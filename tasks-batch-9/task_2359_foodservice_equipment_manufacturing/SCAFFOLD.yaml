scenario: "2359. Foodservice Equipment Manufacturing (commercial kitchen equipment manufacturer): product certification for sanitation, gas and electrical safety with listing agency requirements, chain account customization with specific configurations, controls and branding across many units, production scheduling against restaurant construction and remodel programs with delivery date commitments, cooking performance validation with menu item testing and throughput specifications, connected equipment with recipe management, monitoring and firmware update infrastructure, dealer and consultant channel with specification writing influence and quote support, service network authorization, technician training and parts distribution, warranty and extended service program administration"
domain_name: "foodservice-equipment-manufacturing"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: hybrid
  # Certification/configuration/production/service sub-trees each have a strict parent chain,
  # but ChainConfiguration, SiteOrder, ConnectedUnit and TechnicianCertification each carry
  # cross-aggregate FKs that span those trees (config -> model, slot -> site order,
  # unit -> model + site order, cert -> partner + model), so the shape is a tree with
  # cross-cutting associations.

  state_machine_shape: cyclic
  # Also present, per entity: CertificationListing = cyclic (CONDITIONS_REQUESTED -> SUBMITTED
  # revision loop) plus LISTED <-> SUSPENDED; ChainConfiguration = branching (ENG_REVIEW forks to
  # ENG_APPROVED or REVISION_REQUESTED with divergent side-effect sets) plus RELEASED <->
  # COMPLIANCE_HOLD; PerformanceValidation = cyclic (FAILED -> IN_PROGRESS retest loop);
  # SiteOrder = parallel (fulfillment_status x commitment_status evolve independently on one row);
  # EquipmentModel.certification_posture = compound (derived from CertificationListing children);
  # ConstructionProgram.commit_posture = compound + posture_driven (derived from SiteOrder children).

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # Layered with peer_roles: ChainAdmin owns its own ChainAccount sub-tree, ServicePartnerUser owns
  # its own ServicePartner sub-tree, and neither can read or write the other's resources.
  # Segregation of duties: the ApplicationEngineer user who submits a ChainConfiguration for
  # engineering review MUST NOT be the EngineeringApprover user who approves it, and the
  # ListingReviewer who records an agency decision MUST NOT be the ComplianceEngineer who
  # submitted the listing application.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 70 endpoints / 51 error codes / 8 calculations (3 of them dual-variant) /
  # 13 state-machine entries over 11 entities, including cyclic, branching, parallel dimensions
  # and two compound/derived postures / 2 OCC concurrency rules / 11 roles.
  # Deliberately above the §0.4 Expert band because the scenario carries four independent
  # regulated sub-domains (listing, configuration, production, service) that must interlock.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: EquipmentModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: manufacturer catalog code for the model
        constraints: unique across EquipmentModel; 1-32 chars
      - name: name
        type: string
        source: input
        description: marketing name of the model
      - name: category
        type: enum
        source: input
        description: equipment family
        constraints: one of FRYER, COMBI_OVEN, GRIDDLE, DISHWASHER, HOLDING_CABINET
      - name: energy_type
        type: enum
        source: input
        description: energy source, which determines the required certification scopes
        constraints: one of GAS, ELECTRIC, DUAL
      - name: base_price_cents
        type: integer
        source: input
        description: list price of the un-optioned model in integer cents
        constraints: ">= 1"
      - name: supported_controls_packages
        type: array
        source: input
        description: controls packages this model can be built with
        constraints: non-empty subset of [STANDARD_DIAL, TOUCH_PRO, CONNECT_PLUS]; STANDARD_DIAL always allowed
      - name: rated_throughput_units_per_hour
        type: number
        source: input
        description: catalog throughput rating used as the ceiling for menu-item validation targets
        constraints: "> 0"
      - name: required_scopes
        type: array
        source: computed
        description: certification scopes this model must hold, derived from energy_type by calculations.certification_posture
      - name: covered_scopes
        type: array
        source: computed
        description: scopes currently covered by a non-expired LISTED CertificationListing child
      - name: certification_posture
        type: enum
        source: computed
        description: compound posture derived from CertificationListing children by calculations.certification_posture
        constraints: one of UNLISTED, PARTIAL, LISTED, SUSPENDED

  - name: CertificationListing
    parent: EquipmentModel
    common_fields: true
    fields:
      - name: equipment_model_id
        type: string
        source: input
        description: FK -> EquipmentModel.id; the model this listing application covers
      - name: agency_code
        type: enum
        source: input
        description: listing agency the application is filed with
        constraints: one of AGENCY_ALPHA, AGENCY_BETA, AGENCY_GAMMA
      - name: scopes
        type: array
        source: input
        description: certification scopes requested on this listing
        constraints: non-empty subset of [SANITATION, GAS, ELECTRICAL]; every element must be in AGENCY_SCOPES[agency_code]
      - name: status
        type: enum
        source: computed
        description: listing lifecycle state
        constraints: one of DRAFT, SUBMITTED, UNDER_REVIEW, CONDITIONS_REQUESTED, LISTED, SUSPENDED, REJECTED
      - name: revision
        type: integer
        source: computed
        description: number of times the application has been re-submitted after CONDITIONS_REQUESTED
        default: 0
      - name: conditions_note
        type: string
        source: computed
        description: last agency conditions text recorded on a CONDITIONS decision
        default: null
      - name: listed_on
        type: datetime
        source: computed
        description: logical-clock instant the GRANT decision was recorded
        default: null
      - name: expires_on
        type: datetime
        source: computed
        description: listed_on + LISTING_TERM_DAYS; the listing stops covering scopes once clock >= expires_on
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceEngineer who last submitted this application
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ListingReviewer who recorded the last agency decision
        default: null

  - name: ChainAccount
    parent: null
    common_fields: true
    fields:
      - name: account_code
        type: string
        source: input
        description: restaurant chain account code
        constraints: unique across ChainAccount
      - name: name
        type: string
        source: input
        description: chain legal name
      - name: contracted_unit_volume
        type: integer
        source: input
        description: contracted annual unit volume, the input to the volume-discount tier
        constraints: ">= 0"
      - name: dealer_of_record
        type: string
        source: input
        description: dealer whose specification-writing influence is credited on quotes for this chain
        default: null
      - name: consultant_firm
        type: string
        source: input
        description: kitchen consultant firm named on the chain's specification package
        default: null

  - name: ChainConfiguration
    parent: ChainAccount
    common_fields: true
    fields:
      - name: chain_account_id
        type: string
        source: input
        description: FK -> ChainAccount.id; the chain this configuration belongs to
      - name: equipment_model_id
        type: string
        source: input
        description: FK -> EquipmentModel.id; the base model being customized
      - name: config_code
        type: string
        source: input
        description: chain-facing configuration code
        constraints: unique per chain_account_id
      - name: option_codes
        type: array
        source: input
        description: factory options applied to the base model
        constraints: subset of [SPLIT_TANK, HIGH_ALT, LEFT_HINGE, ENERGY_SAVER]; may be empty; no duplicates
      - name: controls_package
        type: enum
        source: input
        description: controls package selected for this configuration
        constraints: one of STANDARD_DIAL, TOUCH_PRO, CONNECT_PLUS; must be in EquipmentModel.supported_controls_packages
      - name: branding_kit
        type: enum
        source: input
        description: chain branding treatment applied at the factory
        constraints: one of NONE, LOGO_BADGE, FULL_WRAP
      - name: status
        type: enum
        source: computed
        description: configuration lifecycle state
        constraints: one of DRAFT, ENG_REVIEW, REVISION_REQUESTED, ENG_APPROVED, RELEASED, COMPLIANCE_HOLD, SUPERSEDED
      - name: revision
        type: integer
        source: computed
        description: number of REVISION_REQUESTED -> ENG_REVIEW round trips completed
        default: 0
      - name: revision_note
        type: string
        source: computed
        description: last engineering revision-request text
        default: null
      - name: branding_signed_off
        type: boolean
        source: computed
        description: whether the chain has signed off the branding artwork; required before RELEASED
        default: false
      - name: indicative_unit_price_cents
        type: integer
        source: computed
        description: quote_indicative variant of calculations.chain_configuration_unit_price_cents, refreshed on create
      - name: firm_unit_price_cents
        type: integer
        source: computed
        description: release_firm variant of calculations.chain_configuration_unit_price_cents, stamped on RELEASE
        default: null
      - name: pinned_model_version
        type: integer
        source: computed
        description: EquipmentModel.version captured at ENG_APPROVED, pinning the reviewed model revision
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ApplicationEngineer who last submitted for engineering review
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the EngineeringApprover who approved the configuration
        default: null

  - name: PerformanceValidation
    parent: ChainConfiguration
    common_fields: true
    fields:
      - name: chain_configuration_id
        type: string
        source: input
        description: FK -> ChainConfiguration.id; the configuration under cooking-performance test
      - name: menu_item_code
        type: string
        source: input
        description: chain menu item being throughput-tested
        constraints: 1-32 chars
      - name: target_throughput_units_per_hour
        type: number
        source: input
        description: throughput specification the menu item must meet
        constraints: "> 0 and <= EquipmentModel.rated_throughput_units_per_hour"
      - name: hold_temp_target_c
        type: number
        source: input
        description: target hold temperature in Celsius for the menu item
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: validation lifecycle state
        constraints: one of IN_PROGRESS, PASSED, FAILED, SUPERSEDED
      - name: attempt_count
        type: integer
        source: computed
        description: number of conclude attempts made, capped by RETEST_LIMIT
        default: 0
      - name: test_runs
        type: array
        source: computed
        description: append-only list of test-run objects {run_index, units_produced, minutes, hold_temp_c, recorded_at}; cleared to [] when a FAILED validation re-enters IN_PROGRESS
        default: []
      - name: certified_throughput_units_per_hour
        type: number
        source: computed
        description: best_window variant of calculations.measured_throughput_units_per_hour, stamped on conclude
        default: null
      - name: as_tested_throughput_units_per_hour
        type: number
        source: computed
        description: full_series variant of calculations.measured_throughput_units_per_hour, stamped on conclude
        default: null
      - name: failure_reason
        type: string
        source: computed
        description: THROUGHPUT_BELOW_TARGET or HOLD_TEMP_OUT_OF_TOLERANCE when status is FAILED
        default: null

  - name: ConstructionProgram
    parent: ChainAccount
    common_fields: true
    fields:
      - name: chain_account_id
        type: string
        source: input
        description: FK -> ChainAccount.id; the chain running this build/remodel program
      - name: program_code
        type: string
        source: input
        description: construction program code
        constraints: unique per chain_account_id
      - name: program_type
        type: enum
        source: input
        description: whether the program is new construction or a remodel wave
        constraints: one of NEW_BUILD, REMODEL
      - name: site_count_planned
        type: integer
        source: input
        description: maximum number of SiteOrder children the program admits
        constraints: ">= 1"
      - name: commit_posture
        type: enum
        source: computed
        description: compound posture over SiteOrder.commitment_status children per calculations.construction_program_commit_posture
        constraints: one of ON_TRACK, AT_RISK, BREACHED

  - name: SiteOrder
    parent: ConstructionProgram
    common_fields: true
    fields:
      - name: construction_program_id
        type: string
        source: input
        description: FK -> ConstructionProgram.id; the program this site belongs to
      - name: chain_configuration_id
        type: string
        source: input
        description: FK -> ChainConfiguration.id; the released configuration to be built for this site
      - name: site_code
        type: string
        source: input
        description: restaurant site code
        constraints: unique per construction_program_id
      - name: committed_delivery_date
        type: datetime
        source: input
        description: delivery date committed to the chain for this site
      - name: unit_count
        type: integer
        source: input
        description: number of units this site requires
        constraints: ">= 1"
      - name: fulfillment_status
        type: enum
        source: computed
        description: physical fulfillment dimension (independent of commitment_status)
        constraints: one of PENDING, SCHEDULED, IN_BUILD, BUILT, SHIPPED, DELIVERED
      - name: commitment_status
        type: enum
        source: computed
        description: delivery-commitment dimension per calculations.site_order_commitment_status (independent of fulfillment_status)
        constraints: one of UNSCHEDULED, COMMITTED, AT_RISK, BREACHED, WAIVED
      - name: projected_delivery_date
        type: datetime
        source: computed
        description: selected ProductionSlot.window_end + TRANSIT_DAYS, null while no slot is held
        default: null
      - name: slack_days
        type: integer
        source: computed
        description: whole days between projected_delivery_date and committed_delivery_date, null while no slot is held
        default: null
      - name: waiver_reason
        type: string
        source: computed
        description: text recorded when the chain waives the delivery commitment
        default: null

  - name: BuildLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: production line code
        constraints: unique across BuildLine
      - name: plant_code
        type: string
        source: input
        description: plant the line sits in
      - name: daily_capacity_units
        type: integer
        source: input
        description: units the line can build per calendar day
        constraints: ">= 1"
      - name: supported_energy_types
        type: array
        source: input
        description: energy types the line is tooled for
        constraints: non-empty subset of [GAS, ELECTRIC, DUAL]
      - name: committed_units
        type: integer
        source: computed
        description: sum of ProductionSlot.units over children with status IN {RESERVED, CONFIRMED, IN_BUILD}; the conserved quantity of the slot-reserve/slot-cancel invariant
        default: 0

  - name: ProductionSlot
    parent: BuildLine
    common_fields: true
    fields:
      - name: build_line_id
        type: string
        source: input
        description: FK -> BuildLine.id; the line the interval is reserved on
      - name: site_order_id
        type: string
        source: input
        description: FK -> SiteOrder.id; the site order this slot builds
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the reserved build interval
      - name: window_end
        type: datetime
        source: input
        description: inclusive end of the reserved build interval; must be > window_start
      - name: units
        type: integer
        source: input
        description: units to be built in this interval
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: slot lifecycle state
        constraints: one of RESERVED, CONFIRMED, IN_BUILD, COMPLETED, CANCELLED

  - name: ConnectedUnit
    parent: null
    common_fields: true
    fields:
      - name: equipment_model_id
        type: string
        source: input
        description: FK -> EquipmentModel.id; the model of the installed unit
      - name: site_order_id
        type: string
        source: input
        description: FK -> SiteOrder.id; the site order that shipped this unit; null for aftermarket units registered outside a construction program
        default: null
      - name: serial_number
        type: string
        source: input
        description: factory serial number
        constraints: unique across ConnectedUnit
      - name: service_tier
        type: enum
        source: input
        description: warranty / extended service program tier purchased for the unit
        constraints: one of BASE, EXTENDED_PLUS
      - name: firmware_version
        type: string
        source: computed
        description: firmware currently running on the unit
        default: "1.0.0"
      - name: recipe_book_version
        type: integer
        source: computed
        description: recipe book generation pushed to the unit
        default: 1
      - name: fault_count_30d
        type: integer
        source: input
        description: faults reported by the unit in the trailing 30 days, set by telemetry
        default: 0
      - name: missed_heartbeat_count
        type: integer
        source: input
        description: missed monitoring heartbeats, set by telemetry
        default: 0
      - name: health_score
        type: integer
        source: computed
        description: monitoring score per calculations.connected_unit_health_score
        default: 100
      - name: service_program_status
        type: enum
        source: computed
        description: coverage lifecycle state
        constraints: one of PENDING_INSTALL, ACTIVE, EXTENDED, GRACE, EXPIRED, VOIDED
      - name: coverage_start_date
        type: datetime
        source: computed
        description: logical-clock instant coverage was activated
        default: null
      - name: coverage_end_date
        type: datetime
        source: computed
        description: coverage_start_date + COVERAGE_TERM_DAYS[service_tier]
        default: null
      - name: grace_expires_on
        type: datetime
        source: computed
        description: instant the GRACE window closes; set to clock + GRACE_PERIOD_DAYS when coverage enters GRACE
        default: null
      - name: reserve_initial_cents
        type: integer
        source: computed
        description: RESERVE_BY_TIER[service_tier], stamped when coverage activates; the conserved total of the warranty-reserve invariant
        default: 0
      - name: reserve_balance_cents
        type: integer
        source: computed
        description: remaining warranty reserve
        default: 0
      - name: claims_paid_cents
        type: integer
        source: computed
        description: cumulative approved claim payout against this unit
        default: 0

  - name: FirmwareCampaign
    parent: EquipmentModel
    common_fields: true
    fields:
      - name: equipment_model_id
        type: string
        source: input
        description: FK -> EquipmentModel.id; the model whose fleet the campaign targets
      - name: campaign_code
        type: string
        source: input
        description: campaign code
        constraints: unique across FirmwareCampaign
      - name: target_firmware_version
        type: string
        source: input
        description: firmware version the cohort is moved to
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the rollout window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the rollout window; must be > window_start
      - name: cohort_scope
        type: enum
        source: input
        description: cohort sizing policy
        constraints: one of CANARY, BROAD
      - name: status
        type: enum
        source: computed
        description: campaign lifecycle state
        constraints: one of DRAFT, SCHEDULED, RUNNING, COMPLETED, ROLLED_BACK
      - name: cohort_unit_ids
        type: array
        source: computed
        description: ConnectedUnit.id values selected into the cohort at SCHEDULE time
        default: []
      - name: success_count
        type: integer
        source: computed
        description: cohort units that reported a successful update
        default: 0
      - name: failure_count
        type: integer
        source: computed
        description: cohort units that reported a failed update
        default: 0
      - name: success_rate
        type: number
        source: computed
        description: success_count / len(cohort_unit_ids), rounded to 4 decimal places, evaluated at completion
        default: null

  - name: ServicePartner
    parent: null
    common_fields: true
    fields:
      - name: partner_code
        type: string
        source: input
        description: service network partner code
        constraints: unique across ServicePartner
      - name: name
        type: string
        source: input
        description: partner legal name
      - name: region_code
        type: string
        source: input
        description: service region the partner covers
      - name: parts_stocking_level
        type: enum
        source: input
        description: parts distribution commitment level
        constraints: one of BASIC, FULL
      - name: status
        type: enum
        source: computed
        description: authorization lifecycle state
        constraints: one of APPLIED, PROVISIONAL, AUTHORIZED, SUSPENDED, TERMINATED
      - name: authorized_model_ids
        type: array
        source: computed
        description: EquipmentModel.id values the partner may file warranty claims for, per calculations.service_partner_claim_authority
        default: []

  - name: TechnicianCertification
    parent: ServicePartner
    common_fields: true
    fields:
      - name: service_partner_id
        type: string
        source: input
        description: FK -> ServicePartner.id; the partner employing the technician
      - name: equipment_model_id
        type: string
        source: input
        description: FK -> EquipmentModel.id; the model the technician is trained on
      - name: technician_code
        type: string
        source: input
        description: technician identifier within the partner
        constraints: unique per (service_partner_id, equipment_model_id)
      - name: training_hours
        type: number
        source: input
        description: documented training hours completed
        constraints: ">= 0"
      - name: exam_score
        type: integer
        source: computed
        description: certification exam score recorded at grading
        default: null
      - name: status
        type: enum
        source: computed
        description: certification lifecycle state
        constraints: one of ENROLLED, PASSED, FAILED
      - name: certified_on
        type: datetime
        source: computed
        description: logical-clock instant a PASSED grade was recorded
        default: null
      - name: expires_on
        type: datetime
        source: computed
        description: certified_on + CERT_TERM_DAYS; the certification stops counting once clock >= expires_on
        default: null

  - name: WarrantyClaim
    parent: ConnectedUnit
    common_fields: true
    fields:
      - name: connected_unit_id
        type: string
        source: input
        description: FK -> ConnectedUnit.id; the covered unit the claim is filed against
      - name: service_partner_id
        type: string
        source: input
        description: FK -> ServicePartner.id; the partner filing the claim
      - name: technician_certification_id
        type: string
        source: input
        description: FK -> TechnicianCertification.id; the certification of the technician who performed the work
      - name: claim_code
        type: string
        source: input
        description: partner-supplied claim reference
        constraints: unique across WarrantyClaim
      - name: parts_cost_cents
        type: integer
        source: input
        description: parts consumed, in integer cents
        constraints: ">= 0"
      - name: labor_hours
        type: number
        source: input
        description: labor hours claimed
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: adjudication lifecycle state
        constraints: one of SUBMITTED, APPROVED, DENIED, REVERSED
      - name: coinsurance_pct
        type: number
        source: computed
        description: coinsurance fraction selected from the unit's pre-claim utilization band, stamped at approval
        default: null
      - name: adjudicated_amount_cents
        type: integer
        source: computed
        description: payout per calculations.warranty_claim_adjudicated_amount_cents, stamped at approval
        default: null
      - name: denial_reason
        type: string
        source: computed
        description: text recorded when the claim is denied
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the WarrantyAdjudicator who decided the claim
        default: null

state_machines:
  - entity: EquipmentModel
    dimension: certification_posture
    initial_state: UNLISTED
    terminal_states: []
    note: |
      Compound / derived posture. No endpoint sets it directly; it is recomputed by
      calculations.certification_posture on every CertificationListing status change and on every
      logical-clock advance that crosses a listing's expires_on.
    transitions:
      - from: UNLISTED
        to: PARTIAL
        trigger: "system: calculations.certification_posture re-derived after a CertificationListing child reaches LISTED"
        actor: system
        preconditions:
          - "covered_scopes is a non-empty strict subset of required_scopes"
          - "no CertificationListing child of this model has status SUSPENDED"
        side_effects:
          - "sets EquipmentModel.covered_scopes to the union of scopes over LISTED children with clock < expires_on"
          - "increments EquipmentModel.version by 1"
      - from: PARTIAL
        to: LISTED
        trigger: "system: calculations.certification_posture re-derived after a CertificationListing child reaches LISTED"
        actor: system
        preconditions:
          - "covered_scopes is a superset of required_scopes"
          - "no CertificationListing child of this model has status SUSPENDED"
        side_effects:
          - "sets EquipmentModel.covered_scopes to the union of scopes over LISTED children with clock < expires_on"
          - "increments EquipmentModel.version by 1"
      - from: UNLISTED
        to: LISTED
        trigger: "system: calculations.certification_posture re-derived after a CertificationListing child covering every required scope reaches LISTED"
        actor: system
        preconditions:
          - "covered_scopes is a superset of required_scopes"
          - "no CertificationListing child of this model has status SUSPENDED"
        side_effects:
          - "sets EquipmentModel.covered_scopes to the union of scopes over LISTED children with clock < expires_on"
          - "increments EquipmentModel.version by 1"
      - from: LISTED
        to: SUSPENDED
        trigger: "system: calculations.certification_posture re-derived after a CertificationListing child transitions LISTED -> SUSPENDED"
        actor: system
        preconditions:
          - "at least one CertificationListing child of this model has status SUSPENDED"
        side_effects:
          - "cascade hop 3: every ChainConfiguration child of this model with status RELEASED transitions RELEASED -> COMPLIANCE_HOLD"
          - "increments EquipmentModel.version by 1"
      - from: PARTIAL
        to: SUSPENDED
        trigger: "system: calculations.certification_posture re-derived after a CertificationListing child transitions LISTED -> SUSPENDED"
        actor: system
        preconditions:
          - "at least one CertificationListing child of this model has status SUSPENDED"
        side_effects:
          - "cascade hop 3: every ChainConfiguration child of this model with status RELEASED transitions RELEASED -> COMPLIANCE_HOLD"
          - "increments EquipmentModel.version by 1"
      - from: SUSPENDED
        to: LISTED
        trigger: "system: calculations.certification_posture re-derived after the last SUSPENDED CertificationListing child is reinstated to LISTED"
        actor: system
        preconditions:
          - "no CertificationListing child of this model has status SUSPENDED"
          - "covered_scopes is a superset of required_scopes"
        side_effects:
          - "every ChainConfiguration child of this model with status COMPLIANCE_HOLD transitions COMPLIANCE_HOLD -> RELEASED"
          - "increments EquipmentModel.version by 1"
      - from: SUSPENDED
        to: PARTIAL
        trigger: "system: calculations.certification_posture re-derived after the last SUSPENDED CertificationListing child is reinstated to LISTED"
        actor: system
        preconditions:
          - "no CertificationListing child of this model has status SUSPENDED"
          - "covered_scopes is a non-empty strict subset of required_scopes"
        side_effects:
          - "every ChainConfiguration child of this model with status COMPLIANCE_HOLD transitions COMPLIANCE_HOLD -> RELEASED"
          - "increments EquipmentModel.version by 1"
      - from: LISTED
        to: PARTIAL
        trigger: "system: calculations.certification_posture re-derived when the logical clock advances to or past a LISTED child's expires_on"
        actor: system
        preconditions:
          - "clock >= expires_on for at least one LISTED child whose scopes were counted in covered_scopes"
          - "the surviving covered_scopes remains a non-empty strict subset of required_scopes"
        side_effects:
          - "recomputes EquipmentModel.covered_scopes excluding listings whose expires_on <= clock"
          - "increments EquipmentModel.version by 1"
      - from: LISTED
        to: UNLISTED
        trigger: "system: calculations.certification_posture re-derived when the logical clock advances to or past the expires_on of every LISTED child"
        actor: system
        preconditions:
          - "no LISTED child has clock < expires_on"
        side_effects:
          - "sets EquipmentModel.covered_scopes to []"
          - "increments EquipmentModel.version by 1"

  - entity: CertificationListing
    initial_state: DRAFT
    terminal_states: [REJECTED]
    note: |
      Cyclic: CONDITIONS_REQUESTED -> SUBMITTED re-opens the agency review loop and increments
      revision, capped at MAX_LISTING_REVISIONS. Also cyclic on LISTED <-> SUSPENDED.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /certification-listings/{id}/submissions"
        actor: ComplianceEngineer
        preconditions:
          - "every element of scopes is in AGENCY_SCOPES[agency_code]"
          - "no other CertificationListing child of the same EquipmentModel with the same agency_code has status IN {SUBMITTED, UNDER_REVIEW, CONDITIONS_REQUESTED, LISTED}"
        side_effects:
          - "sets CertificationListing.submitted_by_user_id to the acting X-User-ID"
      - from: CONDITIONS_REQUESTED
        to: SUBMITTED
        trigger: "POST /certification-listings/{id}/submissions"
        actor: ComplianceEngineer
        preconditions:
          - "revision < MAX_LISTING_REVISIONS"
        side_effects:
          - "increments CertificationListing.revision by 1"
          - "sets CertificationListing.submitted_by_user_id to the acting X-User-ID"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /certification-listings/{id}/agency-decisions with decision=ACKNOWLEDGE_REVIEW"
        actor: ListingReviewer
        preconditions:
          - "the acting X-User-ID differs from CertificationListing.submitted_by_user_id"
        side_effects:
          - "sets CertificationListing.decided_by_user_id to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: CONDITIONS_REQUESTED
        trigger: "POST /certification-listings/{id}/agency-decisions with decision=CONDITIONS"
        actor: ListingReviewer
        preconditions:
          - "conditions_note is present and non-empty"
          - "the acting X-User-ID differs from CertificationListing.submitted_by_user_id"
        side_effects:
          - "sets CertificationListing.conditions_note to the supplied text"
          - "sets CertificationListing.decided_by_user_id to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: LISTED
        trigger: "POST /certification-listings/{id}/agency-decisions with decision=GRANT"
        actor: ListingReviewer
        preconditions:
          - "the acting X-User-ID differs from CertificationListing.submitted_by_user_id"
        side_effects:
          - "sets CertificationListing.listed_on to the current logical clock"
          - "sets CertificationListing.expires_on to listed_on + LISTING_TERM_DAYS"
          - "re-derives EquipmentModel.certification_posture and EquipmentModel.covered_scopes"
          - "sets CertificationListing.decided_by_user_id to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /certification-listings/{id}/agency-decisions with decision=REJECT"
        actor: ListingReviewer
        preconditions:
          - "the acting X-User-ID differs from CertificationListing.submitted_by_user_id"
        side_effects:
          - "sets CertificationListing.decided_by_user_id to the acting X-User-ID"
      - from: LISTED
        to: SUSPENDED
        trigger: "POST /certification-listings/{id}/agency-decisions with decision=SUSPEND"
        actor: ListingReviewer
        preconditions:
          - "conditions_note is present and non-empty"
        side_effects:
          - "cascade hop 1: sets CertificationListing.status to SUSPENDED and conditions_note to the supplied text"
          - "cascade hop 2: re-derives EquipmentModel.certification_posture, which becomes SUSPENDED"
          - "cascade hop 3: caused by hop 2 -- every ChainConfiguration child of the model with status RELEASED transitions RELEASED -> COMPLIANCE_HOLD"
          - "cascade hop 4: caused by hop 3 -- every ProductionSlot with status IN {RESERVED, CONFIRMED} whose SiteOrder references a held configuration transitions to CANCELLED and decrements BuildLine.committed_units by ProductionSlot.units"
          - "cascade hop 5: caused by hop 4 -- each affected SiteOrder resets fulfillment_status to PENDING, commitment_status to UNSCHEDULED, projected_delivery_date to null and slack_days to null"
          - "cascade hop 6: caused by hop 5 -- ConstructionProgram.commit_posture is re-derived from the surviving SiteOrder children"
      - from: SUSPENDED
        to: LISTED
        trigger: "POST /certification-listings/{id}/agency-decisions with decision=REINSTATE"
        actor: ListingReviewer
        preconditions:
          - "clock < CertificationListing.expires_on"
        side_effects:
          - "re-derives EquipmentModel.certification_posture, which leaves SUSPENDED"
          - "every ChainConfiguration child of the model with status COMPLIANCE_HOLD transitions COMPLIANCE_HOLD -> RELEASED"
          - "sets CertificationListing.decided_by_user_id to the acting X-User-ID"

  - entity: ChainConfiguration
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: |
      Branching: ENG_REVIEW forks to ENG_APPROVED (pins the model version, unlocks release) or to
      REVISION_REQUESTED (stores the note, increments revision on the next submit) with disjoint
      side-effect sets. Also cyclic on RELEASED <-> COMPLIANCE_HOLD.
    transitions:
      - from: DRAFT
        to: ENG_REVIEW
        trigger: "POST /chain-configurations/{id}/submissions"
        actor: ApplicationEngineer
        preconditions:
          - "at least one PerformanceValidation child of this configuration has status PASSED"
        side_effects:
          - "sets ChainConfiguration.submitted_by_user_id to the acting X-User-ID"
      - from: REVISION_REQUESTED
        to: ENG_REVIEW
        trigger: "POST /chain-configurations/{id}/submissions"
        actor: ApplicationEngineer
        preconditions:
          - "at least one PerformanceValidation child of this configuration has status PASSED"
        side_effects:
          - "increments ChainConfiguration.revision by 1"
          - "sets ChainConfiguration.submitted_by_user_id to the acting X-User-ID"
      - from: ENG_REVIEW
        to: ENG_APPROVED
        trigger: "POST /chain-configurations/{id}/engineering-decisions with decision=APPROVE"
        actor: EngineeringApprover
        preconditions:
          - "the acting X-User-ID differs from ChainConfiguration.submitted_by_user_id"
          - "EquipmentModel.certification_posture == LISTED"
        side_effects:
          - "sets ChainConfiguration.pinned_model_version to the referenced EquipmentModel.version"
          - "sets ChainConfiguration.approved_by_user_id to the acting X-User-ID"
      - from: ENG_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /chain-configurations/{id}/engineering-decisions with decision=REQUEST_REVISION"
        actor: EngineeringApprover
        preconditions:
          - "the acting X-User-ID differs from ChainConfiguration.submitted_by_user_id"
          - "revision_note is present and non-empty"
        side_effects:
          - "sets ChainConfiguration.revision_note to the supplied text"
          - "sets ChainConfiguration.branding_signed_off to false"
          - "leaves ChainConfiguration.pinned_model_version null"
      - from: ENG_APPROVED
        to: RELEASED
        trigger: "POST /chain-configurations/{id}/release"
        actor: ApplicationEngineer
        preconditions:
          - "ChainConfiguration.branding_signed_off == true"
          - "EquipmentModel.certification_posture == LISTED"
          - "ChainConfiguration.pinned_model_version == the referenced EquipmentModel.version"
        side_effects:
          - "stamps ChainConfiguration.firm_unit_price_cents using the release_firm variant of calculations.chain_configuration_unit_price_cents"
      - from: RELEASED
        to: COMPLIANCE_HOLD
        trigger: "system: EquipmentModel.certification_posture transitions to SUSPENDED (cascade hop 3)"
        actor: system
        preconditions:
          - "EquipmentModel.certification_posture == SUSPENDED"
        side_effects:
          - "cascade hop 4: every ProductionSlot with status IN {RESERVED, CONFIRMED} whose SiteOrder references this configuration transitions to CANCELLED and decrements BuildLine.committed_units by ProductionSlot.units"
      - from: COMPLIANCE_HOLD
        to: RELEASED
        trigger: "system: EquipmentModel.certification_posture leaves SUSPENDED after a REINSTATE decision"
        actor: system
        preconditions:
          - "EquipmentModel.certification_posture != SUSPENDED"
        side_effects:
          - "leaves ChainConfiguration.firm_unit_price_cents unchanged at its original release value"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a newer ChainConfiguration is created for the same (chain_account_id, equipment_model_id) pair"
        actor: system
        preconditions:
          - "the superseding POST /chain-configurations call carried a matching expected_chain_account_version"
        side_effects:
          - "every PerformanceValidation child with status IN {IN_PROGRESS, PASSED, FAILED} transitions to SUPERSEDED"
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system: a newer ChainConfiguration is created for the same (chain_account_id, equipment_model_id) pair"
        actor: system
        preconditions:
          - "the superseding POST /chain-configurations call carried a matching expected_chain_account_version"
        side_effects:
          - "every PerformanceValidation child with status IN {IN_PROGRESS, PASSED, FAILED} transitions to SUPERSEDED"

  - entity: PerformanceValidation
    initial_state: IN_PROGRESS
    terminal_states: [PASSED, SUPERSEDED]
    note: "Cyclic: FAILED -> IN_PROGRESS retest loop, bounded by RETEST_LIMIT on attempt_count."
    transitions:
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /performance-validations/{id}/conclusion"
        actor: ApplicationEngineer
        preconditions:
          - "len(test_runs) >= MIN_RUNS"
          - "attempt_count < RETEST_LIMIT"
          - "certified_throughput_units_per_hour >= target_throughput_units_per_hour"
          - "every test_runs[].hold_temp_c is within HOLD_TEMP_TOLERANCE_C of hold_temp_target_c"
        side_effects:
          - "increments PerformanceValidation.attempt_count by 1"
          - "stamps certified_throughput_units_per_hour (best_window variant) and as_tested_throughput_units_per_hour (full_series variant) of calculations.measured_throughput_units_per_hour"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /performance-validations/{id}/conclusion"
        actor: ApplicationEngineer
        preconditions:
          - "len(test_runs) >= MIN_RUNS"
          - "attempt_count < RETEST_LIMIT"
          - "certified_throughput_units_per_hour < target_throughput_units_per_hour OR some test_runs[].hold_temp_c deviates from hold_temp_target_c by more than HOLD_TEMP_TOLERANCE_C"
        side_effects:
          - "increments PerformanceValidation.attempt_count by 1"
          - "stamps certified_throughput_units_per_hour and as_tested_throughput_units_per_hour"
          - "sets failure_reason to THROUGHPUT_BELOW_TARGET when the throughput check failed, otherwise HOLD_TEMP_OUT_OF_TOLERANCE"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /performance-validations/{id}/retest"
        actor: ApplicationEngineer
        preconditions:
          - "attempt_count < RETEST_LIMIT"
          - "the parent ChainConfiguration.status IN {DRAFT, REVISION_REQUESTED}"
        side_effects:
          - "clears PerformanceValidation.test_runs to []"
          - "clears certified_throughput_units_per_hour, as_tested_throughput_units_per_hour and failure_reason to null"
      - from: IN_PROGRESS
        to: SUPERSEDED
        trigger: "system: a newer PerformanceValidation is created for the same (chain_configuration_id, menu_item_code) pair, or the parent ChainConfiguration is superseded"
        actor: system
        preconditions:
          - "the superseding POST /performance-validations call carried a matching expected_chain_configuration_version, or the parent configuration transitioned to SUPERSEDED"
        side_effects:
          - "freezes test_runs at their current contents"
      - from: PASSED
        to: SUPERSEDED
        trigger: "system: a newer PerformanceValidation is created for the same (chain_configuration_id, menu_item_code) pair, or the parent ChainConfiguration is superseded"
        actor: system
        preconditions:
          - "the superseding POST /performance-validations call carried a matching expected_chain_configuration_version, or the parent configuration transitioned to SUPERSEDED"
        side_effects:
          - "freezes test_runs at their current contents"
      - from: FAILED
        to: SUPERSEDED
        trigger: "system: a newer PerformanceValidation is created for the same (chain_configuration_id, menu_item_code) pair, or the parent ChainConfiguration is superseded"
        actor: system
        preconditions:
          - "the superseding POST /performance-validations call carried a matching expected_chain_configuration_version, or the parent configuration transitioned to SUPERSEDED"
        side_effects:
          - "freezes test_runs at their current contents"

  - entity: SiteOrder
    dimension: fulfillment_status
    initial_state: PENDING
    terminal_states: [DELIVERED]
    note: |
      Parallel dimension 1 of 2 on SiteOrder. fulfillment_status tracks physical progress and is
      driven by ProductionSlot transitions plus the shipping events; it evolves independently of
      commitment_status, which tracks the delivery-date promise.
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "system: a ProductionSlot is created for this SiteOrder (POST /production-slots)"
        actor: system
        preconditions:
          - "the created ProductionSlot has status RESERVED"
        side_effects:
          - "recomputes SiteOrder.projected_delivery_date, slack_days and commitment_status per calculations.site_order_commitment_status"
          - "re-derives ConstructionProgram.commit_posture"
      - from: SCHEDULED
        to: IN_BUILD
        trigger: "system: POST /production-slots/{id}/build-progress with progress=START on a slot of this SiteOrder"
        actor: system
        preconditions:
          - "the slot transitioned CONFIRMED -> IN_BUILD"
        side_effects:
          - "refreshes SiteOrder.updated_at"
      - from: IN_BUILD
        to: BUILT
        trigger: "system: POST /production-slots/{id}/build-progress with progress=COMPLETE on a slot of this SiteOrder"
        actor: system
        preconditions:
          - "the slot transitioned IN_BUILD -> COMPLETED"
        side_effects:
          - "decrements BuildLine.committed_units by ProductionSlot.units"
      - from: BUILT
        to: SHIPPED
        trigger: "POST /site-orders/{id}/fulfillment-events with event=SHIP"
        actor: ProductionPlanner
        preconditions:
          - "SiteOrder.fulfillment_status == BUILT"
        side_effects:
          - "refreshes SiteOrder.updated_at"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /site-orders/{id}/fulfillment-events with event=DELIVER"
        actor: ProductionPlanner
        preconditions:
          - "SiteOrder.fulfillment_status == SHIPPED"
        side_effects:
          - "recomputes SiteOrder.commitment_status per calculations.site_order_commitment_status"
          - "re-derives ConstructionProgram.commit_posture"
      - from: SCHEDULED
        to: PENDING
        trigger: "system: the last non-CANCELLED ProductionSlot of this SiteOrder is cancelled (POST /production-slots/{id}/cancellation, or cascade hop 4 from a listing suspension)"
        actor: system
        preconditions:
          - "no ProductionSlot child of this SiteOrder has status IN {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}"
        side_effects:
          - "cascade hop 5: sets SiteOrder.commitment_status to UNSCHEDULED and clears projected_delivery_date and slack_days to null"
          - "cascade hop 6: re-derives ConstructionProgram.commit_posture"

  - entity: SiteOrder
    dimension: commitment_status
    initial_state: UNSCHEDULED
    terminal_states: [WAIVED]
    note: |
      Parallel dimension 2 of 2 on SiteOrder. commitment_status is recomputed by
      calculations.site_order_commitment_status whenever the slot set, the logical clock, or the
      fulfillment dimension changes; WAIVED is an operator override that freezes the dimension.
    transitions:
      - from: UNSCHEDULED
        to: COMMITTED
        trigger: "system: calculations.site_order_commitment_status re-evaluated after a ProductionSlot change"
        actor: system
        preconditions:
          - "slack_days >= 0"
        side_effects:
          - "re-derives ConstructionProgram.commit_posture"
      - from: UNSCHEDULED
        to: AT_RISK
        trigger: "system: calculations.site_order_commitment_status re-evaluated after a ProductionSlot change"
        actor: system
        preconditions:
          - "-AT_RISK_GRACE_DAYS <= slack_days < 0"
        side_effects:
          - "re-derives ConstructionProgram.commit_posture"
      - from: UNSCHEDULED
        to: BREACHED
        trigger: "system: calculations.site_order_commitment_status re-evaluated after a ProductionSlot change"
        actor: system
        preconditions:
          - "slack_days < -AT_RISK_GRACE_DAYS"
        side_effects:
          - "re-derives ConstructionProgram.commit_posture"
      - from: COMMITTED
        to: AT_RISK
        trigger: "system: calculations.site_order_commitment_status re-evaluated after a ProductionSlot change"
        actor: system
        preconditions:
          - "-AT_RISK_GRACE_DAYS <= slack_days < 0"
        side_effects:
          - "re-derives ConstructionProgram.commit_posture"
      - from: AT_RISK
        to: BREACHED
        trigger: "system: calculations.site_order_commitment_status re-evaluated after a ProductionSlot change"
        actor: system
        preconditions:
          - "slack_days < -AT_RISK_GRACE_DAYS"
        side_effects:
          - "re-derives ConstructionProgram.commit_posture"
      - from: AT_RISK
        to: COMMITTED
        trigger: "system: calculations.site_order_commitment_status re-evaluated after a ProductionSlot change"
        actor: system
        preconditions:
          - "slack_days >= 0"
        side_effects:
          - "re-derives ConstructionProgram.commit_posture"
      - from: BREACHED
        to: COMMITTED
        trigger: "system: calculations.site_order_commitment_status re-evaluated after a ProductionSlot change"
        actor: system
        preconditions:
          - "slack_days >= 0"
        side_effects:
          - "re-derives ConstructionProgram.commit_posture"
      - from: BREACHED
        to: AT_RISK
        trigger: "system: calculations.site_order_commitment_status re-evaluated after a ProductionSlot change"
        actor: system
        preconditions:
          - "-AT_RISK_GRACE_DAYS <= slack_days < 0"
        side_effects:
          - "re-derives ConstructionProgram.commit_posture"
      - from: COMMITTED
        to: UNSCHEDULED
        trigger: "system: the last non-CANCELLED ProductionSlot of this SiteOrder is cancelled"
        actor: system
        preconditions:
          - "no ProductionSlot child of this SiteOrder has status IN {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}"
        side_effects:
          - "clears projected_delivery_date and slack_days to null"
          - "re-derives ConstructionProgram.commit_posture"
      - from: AT_RISK
        to: UNSCHEDULED
        trigger: "system: the last non-CANCELLED ProductionSlot of this SiteOrder is cancelled"
        actor: system
        preconditions:
          - "no ProductionSlot child of this SiteOrder has status IN {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}"
        side_effects:
          - "clears projected_delivery_date and slack_days to null"
          - "re-derives ConstructionProgram.commit_posture"
      - from: BREACHED
        to: UNSCHEDULED
        trigger: "system: the last non-CANCELLED ProductionSlot of this SiteOrder is cancelled"
        actor: system
        preconditions:
          - "no ProductionSlot child of this SiteOrder has status IN {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}"
        side_effects:
          - "clears projected_delivery_date and slack_days to null"
          - "re-derives ConstructionProgram.commit_posture"
      - from: AT_RISK
        to: WAIVED
        trigger: "POST /site-orders/{id}/commitment-waiver"
        actor: ChainAdmin
        preconditions:
          - "SiteOrder.commitment_status IN {AT_RISK, BREACHED}"
          - "waiver_reason is present and non-empty"
        side_effects:
          - "sets SiteOrder.waiver_reason to the supplied text"
          - "re-derives ConstructionProgram.commit_posture, which now ignores this SiteOrder"
      - from: BREACHED
        to: WAIVED
        trigger: "POST /site-orders/{id}/commitment-waiver"
        actor: ChainAdmin
        preconditions:
          - "SiteOrder.commitment_status IN {AT_RISK, BREACHED}"
          - "waiver_reason is present and non-empty"
        side_effects:
          - "sets SiteOrder.waiver_reason to the supplied text"
          - "re-derives ConstructionProgram.commit_posture, which now ignores this SiteOrder"

  - entity: ConstructionProgram
    dimension: commit_posture
    initial_state: ON_TRACK
    terminal_states: []
    note: "Compound / posture-driven: derived from SiteOrder.commitment_status children by calculations.construction_program_commit_posture; never set directly by an endpoint."
    transitions:
      - from: ON_TRACK
        to: AT_RISK
        trigger: "system: calculations.construction_program_commit_posture re-derived after a SiteOrder.commitment_status change"
        actor: system
        preconditions:
          - "at least one SiteOrder child has commitment_status AT_RISK and none has BREACHED"
        side_effects:
          - "increments ConstructionProgram.version by 1"
      - from: ON_TRACK
        to: BREACHED
        trigger: "system: calculations.construction_program_commit_posture re-derived after a SiteOrder.commitment_status change"
        actor: system
        preconditions:
          - "at least one SiteOrder child has commitment_status BREACHED"
        side_effects:
          - "increments ConstructionProgram.version by 1"
      - from: AT_RISK
        to: BREACHED
        trigger: "system: calculations.construction_program_commit_posture re-derived after a SiteOrder.commitment_status change"
        actor: system
        preconditions:
          - "at least one SiteOrder child has commitment_status BREACHED"
        side_effects:
          - "increments ConstructionProgram.version by 1"
      - from: AT_RISK
        to: ON_TRACK
        trigger: "system: calculations.construction_program_commit_posture re-derived after a SiteOrder.commitment_status change, a waiver, or a slot cancellation"
        actor: system
        preconditions:
          - "no SiteOrder child has commitment_status IN {AT_RISK, BREACHED}"
        side_effects:
          - "increments ConstructionProgram.version by 1"
      - from: BREACHED
        to: ON_TRACK
        trigger: "system: calculations.construction_program_commit_posture re-derived after a SiteOrder.commitment_status change, a waiver, or a slot cancellation"
        actor: system
        preconditions:
          - "no SiteOrder child has commitment_status IN {AT_RISK, BREACHED}"
        side_effects:
          - "increments ConstructionProgram.version by 1"
      - from: BREACHED
        to: AT_RISK
        trigger: "system: calculations.construction_program_commit_posture re-derived after a SiteOrder.commitment_status change, a waiver, or a slot cancellation"
        actor: system
        preconditions:
          - "at least one SiteOrder child has commitment_status AT_RISK and none has BREACHED"
        side_effects:
          - "increments ConstructionProgram.version by 1"

  - entity: ProductionSlot
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /production-slots/{id}/build-progress with progress=CONFIRM"
        actor: ProductionPlanner
        preconditions:
          - "the parent SiteOrder's ChainConfiguration.status == RELEASED"
        side_effects:
          - "leaves BuildLine.committed_units unchanged"
      - from: CONFIRMED
        to: IN_BUILD
        trigger: "POST /production-slots/{id}/build-progress with progress=START"
        actor: ProductionPlanner
        preconditions:
          - "clock >= ProductionSlot.window_start"
          - "the parent SiteOrder's ChainConfiguration.status == RELEASED"
        side_effects:
          - "transitions the parent SiteOrder.fulfillment_status SCHEDULED -> IN_BUILD"
      - from: IN_BUILD
        to: COMPLETED
        trigger: "POST /production-slots/{id}/build-progress with progress=COMPLETE"
        actor: ProductionPlanner
        preconditions:
          - "clock >= ProductionSlot.window_start"
        side_effects:
          - "decrements BuildLine.committed_units by ProductionSlot.units"
          - "transitions the parent SiteOrder.fulfillment_status IN_BUILD -> BUILT"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /production-slots/{id}/cancellation, or cascade hop 4 from a listing suspension"
        actor: ProductionPlanner
        preconditions:
          - "ProductionSlot.status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "decrements BuildLine.committed_units by ProductionSlot.units, restoring the slot-reserve invariant"
          - "if no ProductionSlot child of the SiteOrder remains in {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}, resets the SiteOrder to fulfillment_status PENDING and commitment_status UNSCHEDULED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /production-slots/{id}/cancellation, or cascade hop 4 from a listing suspension"
        actor: ProductionPlanner
        preconditions:
          - "ProductionSlot.status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "decrements BuildLine.committed_units by ProductionSlot.units, restoring the slot-reserve invariant"
          - "if no ProductionSlot child of the SiteOrder remains in {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}, resets the SiteOrder to fulfillment_status PENDING and commitment_status UNSCHEDULED"

  - entity: ConnectedUnit
    dimension: service_program_status
    initial_state: PENDING_INSTALL
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: PENDING_INSTALL
        to: ACTIVE
        trigger: "POST /connected-units/{id}/coverage-actions with action=ACTIVATE"
        actor: WarrantyAdjudicator
        preconditions:
          - "EquipmentModel.certification_posture IN {LISTED, PARTIAL}"
        side_effects:
          - "sets coverage_start_date to the current logical clock and coverage_end_date to coverage_start_date + COVERAGE_TERM_DAYS[service_tier]"
          - "sets reserve_initial_cents and reserve_balance_cents to RESERVE_BY_TIER[service_tier] and claims_paid_cents to 0"
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /connected-units/{id}/coverage-actions with action=EXTEND"
        actor: WarrantyAdjudicator
        preconditions:
          - "ConnectedUnit.service_tier == EXTENDED_PLUS"
          - "clock < ConnectedUnit.coverage_end_date"
        side_effects:
          - "extends coverage_end_date by EXTENSION_TERM_DAYS"
          - "adds EXTENSION_RESERVE_CENTS to reserve_balance_cents and to reserve_initial_cents, preserving the warranty-reserve invariant"
      - from: ACTIVE
        to: GRACE
        trigger: "system: cascade hop 3 -- an approved WarrantyClaim drove reserve_balance_cents to 0"
        actor: system
        preconditions:
          - "ConnectedUnit.reserve_balance_cents == 0"
        side_effects:
          - "sets grace_expires_on to clock + GRACE_PERIOD_DAYS"
      - from: EXTENDED
        to: GRACE
        trigger: "system: cascade hop 3 -- an approved WarrantyClaim drove reserve_balance_cents to 0"
        actor: system
        preconditions:
          - "ConnectedUnit.reserve_balance_cents == 0"
        side_effects:
          - "sets grace_expires_on to clock + GRACE_PERIOD_DAYS"
      - from: GRACE
        to: ACTIVE
        trigger: "system: a WarrantyClaim reversal restored reserve_balance_cents above 0"
        actor: system
        preconditions:
          - "ConnectedUnit.reserve_balance_cents > 0"
          - "clock < ConnectedUnit.grace_expires_on"
        side_effects:
          - "clears grace_expires_on to null, completing the compensation with no drift in reserve_initial_cents"
      - from: GRACE
        to: EXPIRED
        trigger: "system: lazily evaluated on any read or write touching this unit once clock >= grace_expires_on"
        actor: system
        preconditions:
          - "clock >= ConnectedUnit.grace_expires_on"
        side_effects:
          - "refreshes ConnectedUnit.updated_at"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazily evaluated on any read or write touching this unit once clock >= coverage_end_date"
        actor: system
        preconditions:
          - "clock >= ConnectedUnit.coverage_end_date"
        side_effects:
          - "refreshes ConnectedUnit.updated_at"
      - from: EXTENDED
        to: EXPIRED
        trigger: "system: lazily evaluated on any read or write touching this unit once clock >= coverage_end_date"
        actor: system
        preconditions:
          - "clock >= ConnectedUnit.coverage_end_date"
        side_effects:
          - "refreshes ConnectedUnit.updated_at"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /connected-units/{id}/coverage-actions with action=VOID"
        actor: WarrantyAdjudicator
        preconditions:
          - "void_reason is present and non-empty"
        side_effects:
          - "sets reserve_balance_cents to 0 and leaves claims_paid_cents unchanged"
      - from: EXTENDED
        to: VOIDED
        trigger: "POST /connected-units/{id}/coverage-actions with action=VOID"
        actor: WarrantyAdjudicator
        preconditions:
          - "void_reason is present and non-empty"
        side_effects:
          - "sets reserve_balance_cents to 0 and leaves claims_paid_cents unchanged"
      - from: GRACE
        to: VOIDED
        trigger: "POST /connected-units/{id}/coverage-actions with action=VOID"
        actor: WarrantyAdjudicator
        preconditions:
          - "void_reason is present and non-empty"
        side_effects:
          - "sets reserve_balance_cents to 0 and leaves claims_paid_cents unchanged"

  - entity: FirmwareCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED, ROLLED_BACK]
    note: "Branching at close: COMPLETE and ROLL_BACK carry disjoint side-effect sets on the cohort's firmware_version."
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /firmware-campaigns/{id}/schedule"
        actor: ConnectedOpsEngineer
        preconditions:
          - "the count of FirmwareCampaign rows for the same equipment_model_id with status IN {SCHEDULED, RUNNING} whose [window_start, window_end) intersects this campaign's window is < MAX_CONCURRENT_CAMPAIGNS_PER_MODEL"
          - "at least COHORT_SIZE[cohort_scope] ConnectedUnit rows of this model have service_program_status IN {ACTIVE, EXTENDED} and firmware_version != target_firmware_version"
        side_effects:
          - "sets cohort_unit_ids to the first COHORT_SIZE[cohort_scope] eligible ConnectedUnit ids ordered by health_score ASC then created_at ASC"
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /firmware-campaigns/{id}/start"
        actor: ConnectedOpsEngineer
        preconditions:
          - "window_start <= clock < window_end"
        side_effects:
          - "resets success_count and failure_count to 0"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /firmware-campaigns/{id}/close with disposition=COMPLETE"
        actor: ConnectedOpsEngineer
        preconditions:
          - "success_count + failure_count == len(cohort_unit_ids)"
          - "success_rate >= MIN_SUCCESS_RATE"
        side_effects:
          - "stamps success_rate"
          - "sets ConnectedUnit.firmware_version to target_firmware_version for every cohort unit that reported SUCCESS"
          - "leaves firmware_version unchanged on cohort units that reported FAILURE"
      - from: RUNNING
        to: ROLLED_BACK
        trigger: "POST /firmware-campaigns/{id}/close with disposition=ROLL_BACK"
        actor: ConnectedOpsEngineer
        preconditions:
          - "success_count + failure_count == len(cohort_unit_ids)"
        side_effects:
          - "stamps success_rate"
          - "leaves ConnectedUnit.firmware_version unchanged on every cohort unit"
          - "increments ConnectedUnit.recipe_book_version by 1 on every cohort unit that reported SUCCESS, recording the rollback recipe re-sync"

  - entity: ServicePartner
    initial_state: APPLIED
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLIED
        to: PROVISIONAL
        trigger: "POST /service-partners/{id}/authorization with action=PROVISION"
        actor: ChannelManager
        preconditions:
          - "at least one TechnicianCertification child has status PASSED"
        side_effects:
          - "re-derives ServicePartner.authorized_model_ids per calculations.service_partner_claim_authority"
      - from: PROVISIONAL
        to: AUTHORIZED
        trigger: "POST /service-partners/{id}/authorization with action=AUTHORIZE"
        actor: ChannelManager
        preconditions:
          - "ServicePartner.authorized_model_ids is non-empty"
          - "ServicePartner.parts_stocking_level == FULL"
        side_effects:
          - "re-derives ServicePartner.authorized_model_ids per calculations.service_partner_claim_authority"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /service-partners/{id}/authorization with action=SUSPEND"
        actor: ChannelManager
        preconditions:
          - "ServicePartner.status == AUTHORIZED"
        side_effects:
          - "every WarrantyClaim child with status SUBMITTED remains SUBMITTED but becomes unapprovable while the partner is SUSPENDED"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /service-partners/{id}/authorization with action=REINSTATE"
        actor: ChannelManager
        preconditions:
          - "ServicePartner.authorized_model_ids is non-empty"
        side_effects:
          - "re-derives ServicePartner.authorized_model_ids per calculations.service_partner_claim_authority"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /service-partners/{id}/authorization with action=TERMINATE"
        actor: ChannelManager
        preconditions:
          - "no WarrantyClaim child has status SUBMITTED"
        side_effects:
          - "sets ServicePartner.authorized_model_ids to []"
      - from: PROVISIONAL
        to: TERMINATED
        trigger: "POST /service-partners/{id}/authorization with action=TERMINATE"
        actor: ChannelManager
        preconditions:
          - "no WarrantyClaim child has status SUBMITTED"
        side_effects:
          - "sets ServicePartner.authorized_model_ids to []"

  - entity: TechnicianCertification
    initial_state: ENROLLED
    terminal_states: [FAILED]
    transitions:
      - from: ENROLLED
        to: PASSED
        trigger: "POST /technician-certifications/{id}/grade"
        actor: ChannelManager
        preconditions:
          - "TechnicianCertification.training_hours >= MIN_TRAINING_HOURS"
          - "exam_score >= PASS_SCORE"
        side_effects:
          - "sets exam_score, certified_on to the current logical clock and expires_on to certified_on + CERT_TERM_DAYS"
          - "re-derives ServicePartner.authorized_model_ids per calculations.service_partner_claim_authority"
      - from: ENROLLED
        to: FAILED
        trigger: "POST /technician-certifications/{id}/grade"
        actor: ChannelManager
        preconditions:
          - "TechnicianCertification.training_hours >= MIN_TRAINING_HOURS"
          - "exam_score < PASS_SCORE"
        side_effects:
          - "sets exam_score and leaves certified_on and expires_on null"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/adjudication with decision=APPROVE"
        actor: WarrantyAdjudicator
        preconditions:
          - "ServicePartner.status == AUTHORIZED"
          - "ConnectedUnit.service_program_status IN {ACTIVE, EXTENDED}"
          - "adjudicated_amount_cents <= ConnectedUnit.reserve_balance_cents"
        side_effects:
          - "cascade hop 1: stamps WarrantyClaim.coinsurance_pct and adjudicated_amount_cents per calculations.warranty_claim_adjudicated_amount_cents and sets adjudicated_by_user_id"
          - "cascade hop 2: caused by hop 1 -- decrements ConnectedUnit.reserve_balance_cents and increments ConnectedUnit.claims_paid_cents by adjudicated_amount_cents"
          - "cascade hop 3: caused by hop 2 -- if reserve_balance_cents reached 0, the unit transitions ACTIVE|EXTENDED -> GRACE and grace_expires_on is set to clock + GRACE_PERIOD_DAYS"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/adjudication with decision=DENY"
        actor: WarrantyAdjudicator
        preconditions:
          - "denial_reason is present and non-empty"
        side_effects:
          - "sets denial_reason and adjudicated_by_user_id and leaves adjudicated_amount_cents null"
          - "leaves ConnectedUnit.reserve_balance_cents and claims_paid_cents unchanged"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /warranty-claims/{id}/reversal"
        actor: WarrantyAdjudicator
        preconditions:
          - "reversal_reason is present and non-empty"
          - "ConnectedUnit.service_program_status != VOIDED"
        side_effects:
          - "compensation: increments ConnectedUnit.reserve_balance_cents and decrements ConnectedUnit.claims_paid_cents by WarrantyClaim.adjudicated_amount_cents, leaving reserve_balance_cents + claims_paid_cents == reserve_initial_cents"
          - "if the unit was GRACE and reserve_balance_cents is now > 0, the unit transitions GRACE -> ACTIVE and grace_expires_on is cleared"

concurrency_rules:
  - rule_id: config-create-stale-chain-account
    parent_entity: ChainAccount
    write_endpoint: "POST /chain-configurations"
    occ_field: "expected_chain_account_version"
    description: |
      Creating a ChainConfiguration for a ChainAccount whose version has advanced since the client
      last read it is rejected. A new configuration for the same (chain_account_id,
      equipment_model_id) pair legitimately supersedes any prior pre-release configuration for that
      pair, so a writer holding a stale view of the account would silently discard work it never
      observed; the stale-version check forces the writer to re-read first.
    error_id: ERR_STALE_CHAIN_ACCOUNT_VERSION
    http_status: 412

  - rule_id: validation-create-stale-configuration
    parent_entity: ChainConfiguration
    write_endpoint: "POST /performance-validations"
    occ_field: "expected_chain_configuration_version"
    description: |
      Creating a PerformanceValidation against a ChainConfiguration whose version has advanced
      since the client last read it is rejected. A new validation for the same
      (chain_configuration_id, menu_item_code) pair legitimately supersedes the prior one, so a
      writer working from a stale configuration view would supersede a validation produced against
      a configuration revision it never saw.
    error_id: ERR_STALE_CONFIGURATION_VERSION
    http_status: 412

calculations:
  - name: certification_posture
    trigger: "on every CertificationListing status change, on EquipmentModel creation, and on every POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      required_scopes = ["SANITATION"]
                        + (["GAS"]        if EquipmentModel.energy_type in {GAS, DUAL}     else [])
                        + (["ELECTRICAL"] if EquipmentModel.energy_type in {ELECTRIC, DUAL} else [])
        # emitted in this fixed order: SANITATION, GAS, ELECTRICAL

      covered_scopes = sorted_union(
          listing.scopes
          for listing in CertificationListing children of this EquipmentModel
          if listing.status == LISTED and clock < listing.expires_on   # strict: clock == expires_on does NOT cover
      )   # sorted in the fixed order SANITATION, GAS, ELECTRICAL

      if any(listing.status == SUSPENDED for listing in children):        certification_posture = SUSPENDED
      elif set(required_scopes) is a subset of set(covered_scopes):       certification_posture = LISTED
      elif len(covered_scopes) > 0:                                       certification_posture = PARTIAL
      else:                                                              certification_posture = UNLISTED
    input_set: "CertificationListing children of the EquipmentModel; only status == LISTED children with clock < expires_on contribute to covered_scopes; any child with status == SUSPENDED forces SUSPENDED regardless of coverage; DRAFT / SUBMITTED / UNDER_REVIEW / CONDITIONS_REQUESTED / REJECTED children contribute nothing"
    constants:
      AGENCY_SCOPES:
        AGENCY_ALPHA: [SANITATION]
        AGENCY_BETA: [GAS, ELECTRICAL]
        AGENCY_GAMMA: [SANITATION, GAS, ELECTRICAL]
      LISTING_TERM_DAYS: 365
    precision: "set-valued; no rounding. The expiry comparison is strict (clock < expires_on), so a listing whose expires_on equals the clock contributes nothing."

  - name: chain_configuration_unit_price_cents
    trigger: "the quote_indicative variant on POST /chain-configurations and on GET /chain-configurations/{id}/price-quote; the release_firm variant on POST /chain-configurations/{id}/release"
    algorithm: tiered_pricing
    formula: |
      base = EquipmentModel.base_price_cents

      # PINNED ROUNDING ORDER (mode (b)): round each option's uplift to whole cents
      # INDEPENDENTLY, in the fixed option order [SPLIT_TANK, HIGH_ALT, LEFT_HINGE, ENERGY_SAVER],
      # and only then sum. Summing the percentages first and rounding once is WRONG and yields a
      # different number of cents.
      option_amount_cents = sum(
          ROUND_HALF_UP(base * OPTION_PCT[code])
          for code in [SPLIT_TANK, HIGH_ALT, LEFT_HINGE, ENERGY_SAVER] if code in option_codes
      )

      controls_cents = CONTROLS_UPLIFT_CENTS[controls_package]
      branding_cents = BRANDING_KIT_CENTS[branding_kit]

      volume_pct = 0.12 if ChainAccount.contracted_unit_volume >= 500
              else 0.08 if ChainAccount.contracted_unit_volume >= 200
              else 0.04 if ChainAccount.contracted_unit_volume >= 50
              else 0.00

      discountable_subtotal_cents = base + option_amount_cents + controls_cents
      volume_discount_cents       = ROUND_HALF_UP(discountable_subtotal_cents * volume_pct)
      discounted_cents            = discountable_subtotal_cents - volume_discount_cents

      # variant divergence: branding is quoted separately (excluded) at indicative time and is
      # added AFTER the volume discount (never discounted) at release time
      quote_indicative -> unit_price_cents = discounted_cents
      release_firm     -> unit_price_cents = discounted_cents + branding_cents
    input_set: "the ChainConfiguration's own option_codes / controls_package / branding_kit, the referenced EquipmentModel.base_price_cents, and the parent ChainAccount.contracted_unit_volume; no SiteOrder or ProductionSlot data participates"
    constants:
      OPTION_PCT:
        SPLIT_TANK: 0.075
        HIGH_ALT: 0.0325
        LEFT_HINGE: 0.015
        ENERGY_SAVER: 0.0425
      CONTROLS_UPLIFT_CENTS:
        STANDARD_DIAL: 0
        TOUCH_PRO: 185000
        CONNECT_PLUS: 340000
      BRANDING_KIT_CENTS:
        NONE: 0
        LOGO_BADGE: 42000
        FULL_WRAP: 156000
      VOLUME_TIER_500_PCT: 0.12
      VOLUME_TIER_200_PCT: 0.08
      VOLUME_TIER_50_PCT: 0.04
    precision: "integer cents throughout, ROUND_HALF_UP at each pinned rounding step (per option, then once on the volume discount)"
    variants:
      - name: quote_indicative
        when: "computed at POST /chain-configurations and re-read via GET /chain-configurations/{id}/price-quote, before branding artwork sign-off"
        difference: "excludes BRANDING_KIT_CENTS entirely; stored in ChainConfiguration.indicative_unit_price_cents"
      - name: release_firm
        when: "stamped at POST /chain-configurations/{id}/release"
        difference: "adds BRANDING_KIT_CENTS after the volume discount, so the branding charge is never discounted; stored in ChainConfiguration.firm_unit_price_cents"

  - name: measured_throughput_units_per_hour
    trigger: "both variants are computed and stamped on POST /performance-validations/{id}/conclusion"
    algorithm: aggregation
    formula: |
      runs = PerformanceValidation.test_runs ordered by run_index ASC

      # best_window variant (certified): the maximum hourly rate over every set of
      # WINDOW_SIZE CONSECUTIVE runs
      window_rate(i) = sum(runs[i .. i+WINDOW_SIZE-1].units_produced) * 60
                       / sum(runs[i .. i+WINDOW_SIZE-1].minutes)
      certified_throughput_units_per_hour =
          ROUND_HALF_UP( max(window_rate(i) for i in 0 .. len(runs)-WINDOW_SIZE), 2 )

      # full_series variant (as_tested): one rate over the whole series
      as_tested_throughput_units_per_hour =
          ROUND_HALF_UP( sum(runs[*].units_produced) * 60 / sum(runs[*].minutes), 2 )

      # the PASS/FAIL gate reads the certified (best_window) value only
      throughput_ok = certified_throughput_units_per_hour >= target_throughput_units_per_hour
      hold_temp_ok  = all(abs(r.hold_temp_c - hold_temp_target_c) <= HOLD_TEMP_TOLERANCE_C for r in runs)
    input_set: "every element of PerformanceValidation.test_runs, which is append-only within one attempt and reset to [] by POST /performance-validations/{id}/retest; runs are ordered by their run_index, assigned 1..n in append order"
    constants:
      WINDOW_SIZE: 3
      MIN_RUNS: 3
      HOLD_TEMP_TOLERANCE_C: 2.0
      RETEST_LIMIT: 3
    precision: "2 decimal places, round_half_up, applied once to each variant's final rate (never to intermediate window rates)"
    variants:
      - name: best_window
        when: "stamped into certified_throughput_units_per_hour and used as the PASS/FAIL gate against target_throughput_units_per_hour"
        difference: "takes the maximum rate over consecutive WINDOW_SIZE-run windows, so weak trailing runs are excluded from the certified figure"
      - name: full_series
        when: "stamped into as_tested_throughput_units_per_hour and published to the chain as the as-tested figure"
        difference: "pools every run in the series, so weak runs drag the number down; never used for the PASS/FAIL gate"

  - name: warranty_claim_adjudicated_amount_cents
    trigger: "on POST /warranty-claims/{id}/adjudication with decision=APPROVE"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER (mode (c)). The coinsurance band depends on the unit's reserve
      # utilization, and this claim's own payout changes that utilization -- so the order below is
      # normative: utilization is measured on the PRE-CLAIM ledger, never on the post-claim one.
      # step 1  utilization measured BEFORE this claim is applied
      utilization = ConnectedUnit.claims_paid_cents / ConnectedUnit.reserve_initial_cents

      # step 2  coinsurance band (lower bounds inclusive)
      coinsurance_pct = 0.00 if utilization <  0.60
                   else 0.10 if utilization <  0.85
                   else 0.25

      # step 3  parts, capped
      covered_parts_cents = min(WarrantyClaim.parts_cost_cents, PARTS_CAP_CENTS)

      # step 4  labor at the unit's tier rate
      labor_cents = ROUND_HALF_UP(WarrantyClaim.labor_hours * LABOR_RATE_CENTS_BY_TIER[ConnectedUnit.service_tier])

      # step 5  gross
      gross_cents = covered_parts_cents + labor_cents

      # step 6  coinsurance withheld, rounded once on the gross
      adjudicated_amount_cents = gross_cents - ROUND_HALF_UP(gross_cents * coinsurance_pct)

      # step 7  only then compared against the reserve; over-reserve payouts are rejected,
      #         never truncated
      if adjudicated_amount_cents > ConnectedUnit.reserve_balance_cents: reject ERR_WARRANTY_RESERVE_EXHAUSTED
    input_set: "the WarrantyClaim's own parts_cost_cents and labor_hours, plus the referenced ConnectedUnit's service_tier, reserve_initial_cents, claims_paid_cents and reserve_balance_cents as they stand immediately BEFORE this adjudication; WarrantyClaim rows with status IN {SUBMITTED, DENIED, REVERSED} contribute nothing to claims_paid_cents"
    constants:
      PARTS_CAP_CENTS: 180000
      LABOR_RATE_CENTS_BY_TIER:
        BASE: 9000
        EXTENDED_PLUS: 11000
      COINSURANCE_BAND_1_LOWER: 0.60
      COINSURANCE_BAND_2_LOWER: 0.85
      COINSURANCE_BAND_1_PCT: 0.10
      COINSURANCE_BAND_2_PCT: 0.25
      RESERVE_BY_TIER:
        BASE: 250000
        EXTENDED_PLUS: 600000
      EXTENSION_RESERVE_CENTS: 300000
    precision: "integer cents; ROUND_HALF_UP applied exactly twice -- once to labor_cents and once to the coinsurance withholding on gross_cents. utilization is an exact rational comparison, so utilization == 0.60 falls in the 0.10 band."

  - name: site_order_commitment_status
    trigger: "on POST /production-slots, on POST /production-slots/{id}/cancellation, on POST /production-slots/{id}/build-progress, on POST /site-orders/{id}/fulfillment-events with event=DELIVER, and on POST /_clock/set_current_utc"
    algorithm: threshold
    formula: |
      # selector: exactly one slot drives the projection
      candidates = ProductionSlot children of this SiteOrder with status IN {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}
      if candidates is empty:
          projected_delivery_date = null
          slack_days             = null
          commitment_status      = UNSCHEDULED        # empty-set fallback
      else:
          selected = candidates ordered by window_end DESC, then created_at ASC -> take first
          projected_delivery_date = selected.window_end + TRANSIT_DAYS days
          slack_days = floor( (committed_delivery_date - projected_delivery_date) / 1 day )
          commitment_status = COMMITTED if slack_days >= 0
                         else AT_RISK   if slack_days >= -AT_RISK_GRACE_DAYS   # -3 is AT_RISK, -4 is BREACHED
                         else BREACHED
      # WAIVED is sticky: once SiteOrder.commitment_status == WAIVED this calculation still
      # refreshes projected_delivery_date and slack_days but never overwrites commitment_status.
    input_set: "ProductionSlot children of the SiteOrder with status IN {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}; CANCELLED slots are excluded. Ranking is window_end DESC with created_at ASC as the tie-break; the resource id is never a decision input."
    constants:
      TRANSIT_DAYS: 7
      AT_RISK_GRACE_DAYS: 3
    precision: "slack_days is a whole-day integer via floor on the timedelta; the COMMITTED boundary is inclusive at 0 and the AT_RISK boundary is inclusive at -AT_RISK_GRACE_DAYS"

  - name: construction_program_commit_posture
    trigger: "on every SiteOrder.commitment_status change, on POST /site-orders, on POST /site-orders/{id}/commitment-waiver, and on cascade hop 6 of a listing suspension"
    algorithm: aggregation
    formula: |
      considered = SiteOrder children with commitment_status IN {COMMITTED, AT_RISK, BREACHED}
                   # UNSCHEDULED and WAIVED children are excluded from the posture entirely
      if any(s.commitment_status == BREACHED for s in considered):  commit_posture = BREACHED
      elif any(s.commitment_status == AT_RISK for s in considered): commit_posture = AT_RISK
      else:                                                        commit_posture = ON_TRACK
                   # the empty considered set yields ON_TRACK
    input_set: "SiteOrder children of the ConstructionProgram whose commitment_status IN {COMMITTED, AT_RISK, BREACHED}; UNSCHEDULED (no slot held) and WAIVED (commitment released by the chain) children are excluded, and an empty set yields ON_TRACK"
    constants: {}
    precision: "enum-valued; no rounding"

  - name: connected_unit_health_score
    trigger: "on POST /connected-units, on POST /connected-units/{id}/telemetry, and on POST /firmware-campaigns/{id}/close"
    algorithm: weighted_scoring
    formula: |
      # the firmware bonus needs a single well-defined reference version
      completed = FirmwareCampaign rows with equipment_model_id == ConnectedUnit.equipment_model_id
                  and status == COMPLETED
      if completed is empty:
          reference_firmware_version = null
      else:
          reference_firmware_version = (completed ordered by window_start DESC, then created_at ASC
                                        -> take first).target_firmware_version

      raw = 100
            - FAULT_WEIGHT     * ConnectedUnit.fault_count_30d
            - HEARTBEAT_WEIGHT * ConnectedUnit.missed_heartbeat_count
            + (FIRMWARE_CURRENT_BONUS
               if reference_firmware_version is not null
                  and ConnectedUnit.firmware_version == reference_firmware_version
               else 0)

      health_score = min(HEALTH_SCORE_MAX, max(HEALTH_SCORE_MIN, raw))
    input_set: "the ConnectedUnit's own fault_count_30d, missed_heartbeat_count and firmware_version, plus FirmwareCampaign rows for the same equipment_model_id with status == COMPLETED (DRAFT / SCHEDULED / RUNNING / ROLLED_BACK campaigns contribute nothing); ranking is window_start DESC with created_at ASC as the tie-break"
    constants:
      FAULT_WEIGHT: 7
      HEARTBEAT_WEIGHT: 3
      FIRMWARE_CURRENT_BONUS: 5
      HEALTH_SCORE_MIN: 0
      HEALTH_SCORE_MAX: 100
    precision: "integer score clamped to [HEALTH_SCORE_MIN, HEALTH_SCORE_MAX]; the clamp is applied once, after the bonus"

  - name: service_partner_claim_authority
    trigger: "on POST /technician-certifications/{id}/grade, on POST /service-partners/{id}/authorization, and on POST /_clock/set_current_utc"
    algorithm: aggregation
    formula: |
      for each distinct equipment_model_id m among the ServicePartner's TechnicianCertification children:
          certified_count(m) = count(
              cert for cert in TechnicianCertification children of this ServicePartner
              if cert.equipment_model_id == m
                 and cert.status == PASSED
                 and clock < cert.expires_on          # strict: clock == expires_on no longer counts
          )
      authorized_model_ids = [ m where certified_count(m) >= MIN_CERTIFIED_TECHS_PER_MODEL ]
                             ordered by EquipmentModel.created_at ASC

      # gate used by POST /warranty-claims
      partner_may_claim_for(model_id) = ServicePartner.status == AUTHORIZED
                                        and model_id in ServicePartner.authorized_model_ids
    input_set: "TechnicianCertification children of the ServicePartner with status == PASSED and clock < expires_on; ENROLLED and FAILED certifications never count, and a PASSED certification stops counting the instant the clock reaches expires_on"
    constants:
      MIN_CERTIFIED_TECHS_PER_MODEL: 2
      MIN_TRAINING_HOURS: 24
      PASS_SCORE: 80
      CERT_TERM_DAYS: 730
    precision: "integer counts; the >= comparison at MIN_CERTIFIED_TECHS_PER_MODEL is inclusive"

constants:
  # Constants referenced by §1.2 transitions and §1.4 validations that are not owned by a single
  # §1.3 calculation. Constants owned by a calculation are declared in that calculation's
  # `constants:` block and are not repeated here.
  MAX_LISTING_REVISIONS: 3
  CHANGEOVER_BUFFER_HOURS: 12
  COVERAGE_TERM_DAYS:
    BASE: 365
    EXTENDED_PLUS: 730
  EXTENSION_TERM_DAYS: 365
  GRACE_PERIOD_DAYS: 30
  MAX_CONCURRENT_CAMPAIGNS_PER_MODEL: 2
  COHORT_SIZE:
    CANARY: 3
    BROAD: 5
  MIN_SUCCESS_RATE: 0.80
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "when X-User-Role == ChainAdmin, X-User-ID equals the ChainAccount.id that owns the targeted resource (ChainConfiguration.chain_account_id, ConstructionProgram.chain_account_id, or SiteOrder -> ConstructionProgram.chain_account_id)"
    error_id: ERR_CHAIN_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /chain-accounts/{id}, GET /chain-configurations, GET /chain-configurations/{id}, GET /chain-configurations/{id}/price-quote, POST /chain-configurations/{id}/branding-signoff, POST /construction-programs, GET /construction-programs, GET /construction-programs/{id}, POST /site-orders, GET /site-orders, GET /site-orders/{id}, POST /site-orders/{id}/commitment-waiver"

  - priority: 4
    category: auth
    check: "when X-User-Role == ServicePartnerUser, X-User-ID equals the ServicePartner.id that owns the targeted resource (TechnicianCertification.service_partner_id or WarrantyClaim.service_partner_id, and the service_partner_id supplied in the body)"
    error_id: ERR_PARTNER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /service-partners/{id}, POST /technician-certifications, GET /technician-certifications, GET /technician-certifications/{id}, POST /warranty-claims, GET /warranty-claims, GET /warranty-claims/{id}"

  - priority: 5
    category: business_constraint
    check: "request body / query parameters are well formed: required fields present, enum members valid, integers within their declared constraints, datetimes ISO-8601 UTC, window_end > window_start, limit in [1,100], offset >= 0, arrays free of duplicates"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "the equipment_model_id in the path or body resolves to an existing EquipmentModel"
    error_id: ERR_EQUIPMENT_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /equipment-models/{id}, PATCH /equipment-models/{id}, POST /certification-listings, POST /chain-configurations, POST /connected-units, POST /firmware-campaigns, POST /technician-certifications"

  - priority: 7
    category: existence
    check: "the CertificationListing id in the path resolves to an existing row"
    error_id: ERR_COMPLIANCE_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /certification-listings/{id}, POST /certification-listings/{id}/submissions, POST /certification-listings/{id}/agency-decisions"

  - priority: 8
    category: existence
    check: "the ChainAccount / ChainConfiguration / PerformanceValidation / ConstructionProgram / SiteOrder id in the path or body resolves to an existing row"
    error_id: ERR_CHAIN_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /chain-accounts/{id}, PATCH /chain-accounts/{id}, POST /chain-configurations, GET /chain-configurations/{id}, GET /chain-configurations/{id}/price-quote, POST /chain-configurations/{id}/submissions, POST /chain-configurations/{id}/engineering-decisions, POST /chain-configurations/{id}/branding-signoff, POST /chain-configurations/{id}/release, POST /performance-validations, GET /performance-validations/{id}, POST /performance-validations/{id}/test-runs, POST /performance-validations/{id}/conclusion, POST /performance-validations/{id}/retest, POST /construction-programs, GET /construction-programs/{id}, POST /site-orders, GET /site-orders/{id}, POST /site-orders/{id}/commitment-waiver, POST /site-orders/{id}/fulfillment-events, POST /production-slots, POST /connected-units"

  - priority: 9
    category: existence
    check: "the BuildLine / ProductionSlot id in the path or body resolves to an existing row"
    error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /build-lines/{id}, POST /production-slots, GET /production-slots/{id}, POST /production-slots/{id}/build-progress, POST /production-slots/{id}/cancellation"

  - priority: 10
    category: existence
    check: "the ConnectedUnit / FirmwareCampaign id in the path or body resolves to an existing row"
    error_id: ERR_CONNECTED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /connected-units/{id}, POST /connected-units/{id}/telemetry, POST /connected-units/{id}/recipe-pushes, POST /connected-units/{id}/coverage-actions, GET /firmware-campaigns/{id}, POST /firmware-campaigns/{id}/schedule, POST /firmware-campaigns/{id}/start, POST /firmware-campaigns/{id}/unit-results, POST /firmware-campaigns/{id}/close, POST /warranty-claims"

  - priority: 11
    category: existence
    check: "the ServicePartner / TechnicianCertification id in the path or body resolves to an existing row"
    error_id: ERR_CHANNEL_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /service-partners/{id}, POST /service-partners/{id}/authorization, POST /technician-certifications, GET /technician-certifications/{id}, POST /technician-certifications/{id}/grade, POST /warranty-claims"

  - priority: 12
    category: existence
    check: "the WarrantyClaim id in the path resolves to an existing row"
    error_id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /warranty-claims/{id}, POST /warranty-claims/{id}/adjudication, POST /warranty-claims/{id}/reversal"

  - priority: 13
    category: state
    check: "expected_chain_account_version equals the current ChainAccount.version (concurrency_rules[config-create-stale-chain-account])"
    error_id: ERR_STALE_CHAIN_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /chain-configurations"

  - priority: 14
    category: state
    check: "expected_chain_configuration_version equals the current ChainConfiguration.version (concurrency_rules[validation-create-stale-configuration])"
    error_id: ERR_STALE_CONFIGURATION_VERSION
    http_status: 412
    applies_to: "POST /performance-validations"

  - priority: 15
    category: business_safety
    check: "segregation of duties: the acting X-User-ID differs from CertificationListing.submitted_by_user_id on an agency decision, and differs from ChainConfiguration.submitted_by_user_id on an engineering decision"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /certification-listings/{id}/agency-decisions, POST /chain-configurations/{id}/engineering-decisions"

  - priority: 16
    category: state
    check: "the CertificationListing.status admits the requested transition (submissions require DRAFT or CONDITIONS_REQUESTED; ACKNOWLEDGE_REVIEW requires SUBMITTED; CONDITIONS / GRANT / REJECT require UNDER_REVIEW; SUSPEND requires LISTED; REINSTATE requires SUSPENDED)"
    error_id: ERR_LISTING_STATE_INVALID
    http_status: 409
    applies_to: "POST /certification-listings/{id}/submissions, POST /certification-listings/{id}/agency-decisions"

  - priority: 17
    category: state
    check: "the ChainConfiguration.status admits the requested transition (submissions require DRAFT or REVISION_REQUESTED; engineering decisions require ENG_REVIEW; branding sign-off requires status IN {DRAFT, ENG_REVIEW, ENG_APPROVED}; release requires ENG_APPROVED; POST /performance-validations requires the parent configuration in DRAFT or REVISION_REQUESTED)"
    error_id: ERR_CONFIGURATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /chain-configurations/{id}/submissions, POST /chain-configurations/{id}/engineering-decisions, POST /chain-configurations/{id}/branding-signoff, POST /chain-configurations/{id}/release, POST /performance-validations"

  - priority: 18
    category: state
    check: "the PerformanceValidation.status admits the requested operation (test-runs and conclusion require IN_PROGRESS; retest requires FAILED)"
    error_id: ERR_VALIDATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /performance-validations/{id}/test-runs, POST /performance-validations/{id}/conclusion, POST /performance-validations/{id}/retest"

  - priority: 19
    category: state
    check: "the ProductionSlot.status admits the requested progress (CONFIRM requires RESERVED; START requires CONFIRMED; COMPLETE requires IN_BUILD; cancellation requires RESERVED or CONFIRMED) and the SiteOrder.fulfillment_status admits the requested fulfillment event (SHIP requires BUILT; DELIVER requires SHIPPED)"
    error_id: ERR_PRODUCTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /production-slots/{id}/build-progress, POST /production-slots/{id}/cancellation, POST /site-orders/{id}/fulfillment-events"

  - priority: 20
    category: state
    check: "the ConnectedUnit / FirmwareCampaign state admits the requested operation (ACTIVATE requires PENDING_INSTALL; EXTEND requires ACTIVE; VOID requires ACTIVE, EXTENDED or GRACE; recipe-pushes require service_program_status IN {ACTIVE, EXTENDED}; schedule requires DRAFT; start requires SCHEDULED; unit-results require RUNNING; close requires RUNNING)"
    error_id: ERR_CONNECTED_STATE_INVALID
    http_status: 409
    applies_to: "POST /connected-units/{id}/recipe-pushes, POST /connected-units/{id}/coverage-actions, POST /firmware-campaigns/{id}/schedule, POST /firmware-campaigns/{id}/start, POST /firmware-campaigns/{id}/unit-results, POST /firmware-campaigns/{id}/close"

  - priority: 21
    category: state
    check: "the ServicePartner / TechnicianCertification state admits the requested operation (PROVISION requires APPLIED; AUTHORIZE requires PROVISIONAL; SUSPEND requires AUTHORIZED; REINSTATE requires SUSPENDED; TERMINATE requires PROVISIONAL or SUSPENDED; grade requires ENROLLED; enrolling a technician requires ServicePartner.status != TERMINATED)"
    error_id: ERR_CHANNEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /service-partners/{id}/authorization, POST /technician-certifications, POST /technician-certifications/{id}/grade"

  - priority: 22
    category: state
    check: "the WarrantyClaim.status admits the requested decision (adjudication requires SUBMITTED; reversal requires APPROVED)"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/adjudication, POST /warranty-claims/{id}/reversal"

  - priority: 23
    category: state
    check: "the referenced ConnectedUnit.service_program_status IN {ACTIVE, EXTENDED} (evaluated after the lazy GRACE -> EXPIRED and ACTIVE|EXTENDED -> EXPIRED re-evaluation against the current clock)"
    error_id: ERR_UNIT_COVERAGE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /warranty-claims, POST /warranty-claims/{id}/adjudication"

  - priority: 24
    category: state
    check: "the SiteOrder's referenced ChainConfiguration.status == RELEASED"
    error_id: ERR_CONFIGURATION_NOT_RELEASED
    http_status: 409
    applies_to: "POST /site-orders, POST /production-slots, POST /production-slots/{id}/build-progress"

  - priority: 25
    category: business_safety
    check: "the referenced EquipmentModel.certification_posture != SUSPENDED"
    error_id: ERR_MODEL_LISTING_SUSPENDED
    http_status: 422
    applies_to: "POST /chain-configurations, POST /chain-configurations/{id}/engineering-decisions, POST /chain-configurations/{id}/release, POST /connected-units/{id}/coverage-actions, POST /firmware-campaigns/{id}/schedule"

  - priority: 26
    category: business_safety
    check: "the referenced EquipmentModel.certification_posture == LISTED, i.e. covered_scopes covers every required scope with clock < expires_on"
    error_id: ERR_MODEL_NOT_LISTED
    http_status: 422
    applies_to: "POST /chain-configurations/{id}/engineering-decisions, POST /chain-configurations/{id}/release"

  - priority: 27
    category: business_safety
    check: "at least one PerformanceValidation child of the ChainConfiguration has status PASSED"
    error_id: ERR_PERFORMANCE_VALIDATION_NOT_PASSED
    http_status: 422
    applies_to: "POST /chain-configurations/{id}/submissions"

  - priority: 28
    category: business_referential
    check: "every element of the requested scopes is in AGENCY_SCOPES[agency_code]"
    error_id: ERR_AGENCY_SCOPE_NOT_COVERED
    http_status: 422
    applies_to: "POST /certification-listings, POST /certification-listings/{id}/submissions"

  - priority: 29
    category: business_referential
    check: "the requested controls_package is in EquipmentModel.supported_controls_packages"
    error_id: ERR_CONTROLS_PACKAGE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /chain-configurations"

  - priority: 30
    category: business_referential
    check: "the referenced EquipmentModel.energy_type is in BuildLine.supported_energy_types"
    error_id: ERR_LINE_ENERGY_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /production-slots"

  - priority: 31
    category: business_referential
    check: "the ChainConfiguration's pinned_model_version equals the current EquipmentModel.version, so the approved model revision is still the released one"
    error_id: ERR_MODEL_VERSION_PIN_STALE
    http_status: 422
    applies_to: "POST /chain-configurations/{id}/release"

  - priority: 32
    category: business_referential
    check: "the filing ServicePartner.status == AUTHORIZED and the ConnectedUnit's equipment_model_id is in ServicePartner.authorized_model_ids"
    error_id: ERR_PARTNER_NOT_AUTHORIZED_FOR_CLAIMS
    http_status: 422
    applies_to: "POST /warranty-claims, POST /warranty-claims/{id}/adjudication"

  - priority: 33
    category: business_referential
    check: "the referenced TechnicianCertification belongs to the filing ServicePartner, has status PASSED with clock < expires_on, and its equipment_model_id equals the ConnectedUnit's equipment_model_id"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /warranty-claims"

  - priority: 34
    category: business_temporal
    check: "CLOSED-interval overlap with a CHANGEOVER_BUFFER_HOURS pad: reject when any other ProductionSlot on the same build_line_id with status IN {RESERVED, CONFIRMED, IN_BUILD} satisfies requested.window_start <= existing.window_end + CHANGEOVER_BUFFER_HOURS AND requested.window_end >= existing.window_start - CHANGEOVER_BUFFER_HOURS. Because the interval is closed and padded, back-to-back windows that merely touch are REJECTED."
    error_id: ERR_BUILD_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /production-slots"

  - priority: 35
    category: business_temporal
    check: "HALF-OPEN-interval aggregate capacity: reject when the count of other FirmwareCampaign rows for the same equipment_model_id with status IN {SCHEDULED, RUNNING} whose [window_start, window_end) strictly intersects this campaign's [window_start, window_end) is already >= MAX_CONCURRENT_CAMPAIGNS_PER_MODEL. Because the interval is half-open and unpadded, a campaign starting exactly at another's window_end does NOT intersect and is accepted."
    error_id: ERR_CAMPAIGN_WINDOW_SATURATED
    http_status: 409
    applies_to: "POST /firmware-campaigns/{id}/schedule"

  - priority: 36
    category: business_temporal
    check: "window_start <= clock < window_end when starting a campaign"
    error_id: ERR_CAMPAIGN_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /firmware-campaigns/{id}/start"

  - priority: 37
    category: business_constraint
    check: "no other CertificationListing child of the same EquipmentModel with the same agency_code has status IN {SUBMITTED, UNDER_REVIEW, CONDITIONS_REQUESTED, LISTED}"
    error_id: ERR_DUPLICATE_LISTING_APPLICATION
    http_status: 409
    applies_to: "POST /certification-listings/{id}/submissions"

  - priority: 38
    category: business_constraint
    check: "serial_number is not already used by another ConnectedUnit"
    error_id: ERR_DUPLICATE_SERIAL_NUMBER
    http_status: 409
    applies_to: "POST /connected-units"

  - priority: 39
    category: business_constraint
    check: "the supplied business code is unique in its declared scope: model_code / account_code / line_code / partner_code / campaign_code / claim_code globally, config_code and program_code per chain_account_id, site_code per construction_program_id, technician_code per (service_partner_id, equipment_model_id)"
    error_id: ERR_DUPLICATE_RESOURCE_CODE
    http_status: 409
    applies_to: "POST /equipment-models, POST /chain-accounts, POST /chain-configurations, POST /construction-programs, POST /site-orders, POST /build-lines, POST /firmware-campaigns, POST /service-partners, POST /technician-certifications, POST /warranty-claims"

  - priority: 40
    category: business_constraint
    check: "CertificationListing.revision < MAX_LISTING_REVISIONS when re-submitting from CONDITIONS_REQUESTED"
    error_id: ERR_LISTING_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /certification-listings/{id}/submissions"

  - priority: 41
    category: business_constraint
    check: "PerformanceValidation.attempt_count < RETEST_LIMIT"
    error_id: ERR_RETEST_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /performance-validations/{id}/conclusion, POST /performance-validations/{id}/retest"

  - priority: 42
    category: business_constraint
    check: "len(PerformanceValidation.test_runs) >= MIN_RUNS"
    error_id: ERR_MIN_TEST_RUNS_NOT_MET
    http_status: 422
    applies_to: "POST /performance-validations/{id}/conclusion"

  - priority: 43
    category: business_constraint
    check: "ServicePartner.authorized_model_ids is non-empty, i.e. at least one model has MIN_CERTIFIED_TECHS_PER_MODEL unexpired PASSED technician certifications"
    error_id: ERR_INSUFFICIENT_CERTIFIED_TECHNICIANS
    http_status: 422
    applies_to: "POST /service-partners/{id}/authorization"

  - priority: 44
    category: business_constraint
    check: "TechnicianCertification.training_hours >= MIN_TRAINING_HOURS before an exam grade may be recorded"
    error_id: ERR_TRAINING_HOURS_NOT_MET
    http_status: 422
    applies_to: "POST /technician-certifications/{id}/grade"

  - priority: 45
    category: business_constraint
    check: "ServicePartner.parts_stocking_level == FULL before full authorization, since an authorized partner must carry the full parts distribution kit"
    error_id: ERR_PARTS_STOCKING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /service-partners/{id}/authorization"

  - priority: 46
    category: business_constraint
    check: "the count of existing SiteOrder children of the ConstructionProgram is < ConstructionProgram.site_count_planned"
    error_id: ERR_PROGRAM_SITE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /site-orders"

  - priority: 47
    category: business_constraint
    check: "at least COHORT_SIZE[cohort_scope] ConnectedUnit rows of the campaign's equipment_model_id have service_program_status IN {ACTIVE, EXTENDED} and firmware_version != target_firmware_version"
    error_id: ERR_NO_ELIGIBLE_UNITS
    http_status: 422
    applies_to: "POST /firmware-campaigns/{id}/schedule"

  - priority: 48
    category: business_constraint
    check: "the connected_unit_id supplied on a unit-result is in FirmwareCampaign.cohort_unit_ids and has not already reported a result in this campaign run"
    error_id: ERR_UNIT_NOT_IN_COHORT
    http_status: 422
    applies_to: "POST /firmware-campaigns/{id}/unit-results"

  - priority: 49
    category: business_fiscal
    check: "ProductionSlot.units <= BuildLine.daily_capacity_units * span_days, where span_days = floor((window_end - window_start) / 1 day) + 1 over the closed interval"
    error_id: ERR_BUILD_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /production-slots"

  - priority: 50
    category: business_fiscal
    check: "the computed adjudicated_amount_cents <= ConnectedUnit.reserve_balance_cents; over-reserve payouts are rejected outright rather than truncated"
    error_id: ERR_WARRANTY_RESERVE_EXHAUSTED
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/adjudication"

  - priority: 51
    category: business_fiscal
    check: "success_count + failure_count == len(cohort_unit_ids), and for disposition=COMPLETE additionally success_rate >= MIN_SUCCESS_RATE"
    error_id: ERR_CAMPAIGN_SUCCESS_RATE_TOO_LOW
    http_status: 422
    applies_to: "POST /firmware-campaigns/{id}/close"

endpoints:
  # ---- logical clock (test-driving, §1.5 ladder rung 3) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called. No plausible business endpoint can set a regulator's calendar, so this is a declared test-driving endpoint."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "re-derives EquipmentModel.certification_posture and covered_scopes for every model (listings whose expires_on <= clock stop covering)"
      - "re-derives ServicePartner.authorized_model_ids for every partner (certifications whose expires_on <= clock stop counting)"
      - "re-evaluates the lazy ConnectedUnit GRACE -> EXPIRED and ACTIVE|EXTENDED -> EXPIRED transitions"
      - "recomputes SiteOrder.commitment_status and ConstructionProgram.commit_posture"

  # ---- EquipmentModel ----
  - method: POST
    path: "/equipment-models"
    description: "Create an equipment model in the manufacturer catalog."
    roles: [ComplianceEngineer, PlatformAdmin]
    code: 201
    input: [model_code, name, category, energy_type, base_price_cents, supported_controls_packages, rated_throughput_units_per_hour]
    output: EquipmentModel
    side_effects:
      - "computes EquipmentModel.required_scopes from energy_type per calculations.certification_posture"
      - "sets covered_scopes to [] and certification_posture to UNLISTED"
  - method: GET
    path: "/equipment-models"
    description: "List equipment models."
    roles: [ComplianceEngineer, ListingReviewer, ApplicationEngineer, EngineeringApprover, ProductionPlanner, ConnectedOpsEngineer, ChannelManager, PlatformAdmin]
    code: 200
    input: ["category?", "energy_type?", "certification_posture?", "limit?", "offset?"]
    output: EquipmentModel[]
    side_effects: []
  - method: GET
    path: "/equipment-models/{id}"
    description: "Read one equipment model including its derived certification posture."
    roles: [ComplianceEngineer, ListingReviewer, ApplicationEngineer, EngineeringApprover, ProductionPlanner, ConnectedOpsEngineer, ChannelManager, ServicePartnerUser, ChainAdmin, WarrantyAdjudicator, PlatformAdmin]
    code: 200
    input: []
    output: EquipmentModel
    side_effects: []
  - method: PATCH
    path: "/equipment-models/{id}"
    description: "Revise a model's commercial and capability attributes. Any successful revision bumps EquipmentModel.version, which invalidates the pinned_model_version of any ENG_APPROVED configuration."
    roles: [ComplianceEngineer, PlatformAdmin]
    code: 200
    input: ["base_price_cents?", "supported_controls_packages?", "rated_throughput_units_per_hour?"]
    output: EquipmentModel
    side_effects:
      - "increments EquipmentModel.version by 1"
      - "leaves ChainConfiguration.pinned_model_version untouched, so a later release fails ERR_MODEL_VERSION_PIN_STALE"

  # ---- CertificationListing ----
  - method: POST
    path: "/certification-listings"
    description: "File a listing application with a listing agency for a model's sanitation / gas / electrical scopes."
    roles: [ComplianceEngineer, PlatformAdmin]
    code: 201
    input: [equipment_model_id, agency_code, scopes]
    output: CertificationListing
    side_effects:
      - "sets CertificationListing.status to DRAFT and revision to 0"
  - method: GET
    path: "/certification-listings"
    description: "List certification listings, filterable by model (FK reverse-reachability for CertificationListing.equipment_model_id)."
    roles: [ComplianceEngineer, ListingReviewer, ApplicationEngineer, EngineeringApprover, PlatformAdmin]
    code: 200
    input: ["equipment_model_id?", "agency_code?", "status?", "limit?", "offset?"]
    output: CertificationListing[]
    side_effects: []
  - method: GET
    path: "/certification-listings/{id}"
    description: "Read one certification listing."
    roles: [ComplianceEngineer, ListingReviewer, ApplicationEngineer, EngineeringApprover, PlatformAdmin]
    code: 200
    input: []
    output: CertificationListing
    side_effects: []
  - method: POST
    path: "/certification-listings/{id}/submissions"
    description: "Submit or re-submit the listing application to the agency."
    roles: [ComplianceEngineer, PlatformAdmin]
    code: 200
    input: []
    output: CertificationListing
    side_effects:
      - "DRAFT -> SUBMITTED, or CONDITIONS_REQUESTED -> SUBMITTED with revision incremented by 1"
      - "sets submitted_by_user_id to the acting X-User-ID"
  - method: POST
    path: "/certification-listings/{id}/agency-decisions"
    description: "Record the listing agency's decision on the application, or a post-listing suspension / reinstatement."
    roles: [ListingReviewer, PlatformAdmin]
    code: 200
    input: ["decision", "conditions_note?"]
    output: CertificationListing
    side_effects:
      - "ACKNOWLEDGE_REVIEW: SUBMITTED -> UNDER_REVIEW"
      - "CONDITIONS: UNDER_REVIEW -> CONDITIONS_REQUESTED and stores conditions_note"
      - "GRANT: UNDER_REVIEW -> LISTED, stamps listed_on and expires_on, re-derives EquipmentModel.certification_posture and covered_scopes"
      - "REJECT: UNDER_REVIEW -> REJECTED"
      - "SUSPEND: LISTED -> SUSPENDED and runs the six-hop suspension cascade through EquipmentModel, ChainConfiguration, ProductionSlot, BuildLine, SiteOrder and ConstructionProgram"
      - "REINSTATE: SUSPENDED -> LISTED and returns held ChainConfiguration rows to RELEASED"
      - "sets decided_by_user_id to the acting X-User-ID"

  # ---- ChainAccount ----
  - method: POST
    path: "/chain-accounts"
    description: "Open a restaurant chain account, recording the dealer of record and the kitchen consultant firm whose specification writing drives the chain's package."
    roles: [ChannelManager, PlatformAdmin]
    code: 201
    input: ["account_code", "name", "contracted_unit_volume", "dealer_of_record?", "consultant_firm?"]
    output: ChainAccount
    side_effects: []
  - method: GET
    path: "/chain-accounts"
    description: "List chain accounts."
    roles: [ChannelManager, ApplicationEngineer, EngineeringApprover, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ChainAccount[]
    side_effects: []
  - method: GET
    path: "/chain-accounts/{id}"
    description: "Read one chain account, including the version an OCC configuration create must echo."
    roles: [ChannelManager, ApplicationEngineer, EngineeringApprover, ChainAdmin, PlatformAdmin]
    code: 200
    input: []
    output: ChainAccount
    side_effects: []
  - method: PATCH
    path: "/chain-accounts/{id}"
    description: "Revise the chain's contracted volume or channel attribution. Bumps ChainAccount.version, which is what a stale OCC configuration create observes."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: ["contracted_unit_volume?", "dealer_of_record?", "consultant_firm?"]
    output: ChainAccount
    side_effects:
      - "increments ChainAccount.version by 1"

  # ---- ChainConfiguration ----
  - method: POST
    path: "/chain-configurations"
    description: "Create a chain-specific configuration of a base model (options, controls package, branding kit). Guarded by OCC on the parent ChainAccount because the new configuration supersedes any prior pre-release configuration for the same (chain_account_id, equipment_model_id) pair."
    roles: [ApplicationEngineer, PlatformAdmin]
    code: 201
    input: [chain_account_id, equipment_model_id, config_code, option_codes, controls_package, branding_kit, expected_chain_account_version]
    output: ChainConfiguration
    side_effects:
      - "increments ChainAccount.version by 1"
      - "stamps indicative_unit_price_cents using the quote_indicative variant of calculations.chain_configuration_unit_price_cents"
      - "transitions any prior ChainConfiguration for the same (chain_account_id, equipment_model_id) pair with status IN {DRAFT, REVISION_REQUESTED} to SUPERSEDED, and its PerformanceValidation children to SUPERSEDED"
  - method: GET
    path: "/chain-configurations"
    description: "List chain configurations, filterable by chain account or model (FK reverse-reachability for ChainConfiguration.chain_account_id and ChainConfiguration.equipment_model_id)."
    roles: [ApplicationEngineer, EngineeringApprover, ChannelManager, ChainAdmin, ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["chain_account_id?", "equipment_model_id?", "status?", "limit?", "offset?"]
    output: ChainConfiguration[]
    side_effects: []
  - method: GET
    path: "/chain-configurations/{id}"
    description: "Read one chain configuration, including its version for OCC validation creates and its pinned_model_version."
    roles: [ApplicationEngineer, EngineeringApprover, ChannelManager, ChainAdmin, ProductionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: ChainConfiguration
    side_effects: []
  - method: GET
    path: "/chain-configurations/{id}/price-quote"
    description: "Quote-support read for the dealer and consultant channel: recomputes and returns the configuration with its refreshed indicative_unit_price_cents (quote_indicative variant) and, once released, its firm_unit_price_cents."
    roles: [ChannelManager, ApplicationEngineer, ChainAdmin, PlatformAdmin]
    code: 200
    input: []
    output: ChainConfiguration
    side_effects:
      - "recomputes ChainConfiguration.indicative_unit_price_cents from the current EquipmentModel.base_price_cents and ChainAccount.contracted_unit_volume"
  - method: POST
    path: "/chain-configurations/{id}/submissions"
    description: "Submit the configuration for engineering review."
    roles: [ApplicationEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ChainConfiguration
    side_effects:
      - "DRAFT -> ENG_REVIEW, or REVISION_REQUESTED -> ENG_REVIEW with revision incremented by 1"
      - "sets submitted_by_user_id to the acting X-User-ID"
  - method: POST
    path: "/chain-configurations/{id}/engineering-decisions"
    description: "Engineering approval fork: APPROVE pins the reviewed model version, REQUEST_REVISION sends the package back and clears the branding sign-off. The deciding user must differ from the submitting user."
    roles: [EngineeringApprover, PlatformAdmin]
    code: 200
    input: ["decision", "revision_note?"]
    output: ChainConfiguration
    side_effects:
      - "APPROVE: ENG_REVIEW -> ENG_APPROVED, sets pinned_model_version to the current EquipmentModel.version and approved_by_user_id"
      - "REQUEST_REVISION: ENG_REVIEW -> REVISION_REQUESTED, stores revision_note and sets branding_signed_off to false"
  - method: POST
    path: "/chain-configurations/{id}/branding-signoff"
    description: "The chain signs off the branding artwork for the configuration."
    roles: [ChainAdmin, PlatformAdmin]
    code: 200
    input: [approved_artwork_ref]
    output: ChainConfiguration
    side_effects:
      - "sets ChainConfiguration.branding_signed_off to true"
  - method: POST
    path: "/chain-configurations/{id}/release"
    description: "Release the configuration to production, stamping the firm price."
    roles: [ApplicationEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ChainConfiguration
    side_effects:
      - "ENG_APPROVED -> RELEASED"
      - "stamps firm_unit_price_cents using the release_firm variant of calculations.chain_configuration_unit_price_cents"

  # ---- PerformanceValidation ----
  - method: POST
    path: "/performance-validations"
    description: "Open a cooking-performance validation for one chain menu item against a configuration. Guarded by OCC on the parent ChainConfiguration because the new validation supersedes the prior one for the same menu_item_code."
    roles: [ApplicationEngineer, PlatformAdmin]
    code: 201
    input: [chain_configuration_id, menu_item_code, target_throughput_units_per_hour, hold_temp_target_c, expected_chain_configuration_version]
    output: PerformanceValidation
    side_effects:
      - "increments ChainConfiguration.version by 1"
      - "sets status to IN_PROGRESS, attempt_count to 0 and test_runs to []"
      - "transitions any prior PerformanceValidation for the same (chain_configuration_id, menu_item_code) pair to SUPERSEDED"
  - method: GET
    path: "/performance-validations"
    description: "List performance validations, filterable by configuration (FK reverse-reachability for PerformanceValidation.chain_configuration_id)."
    roles: [ApplicationEngineer, EngineeringApprover, ChainAdmin, PlatformAdmin]
    code: 200
    input: ["chain_configuration_id?", "menu_item_code?", "status?", "limit?", "offset?"]
    output: PerformanceValidation[]
    side_effects: []
  - method: GET
    path: "/performance-validations/{id}"
    description: "Read one performance validation, including its append-only test_runs and both throughput variants."
    roles: [ApplicationEngineer, EngineeringApprover, ChainAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PerformanceValidation
    side_effects: []
  - method: POST
    path: "/performance-validations/{id}/test-runs"
    description: "Append one menu-item test run (units produced, minutes elapsed, measured hold temperature) to the validation."
    roles: [ApplicationEngineer, PlatformAdmin]
    code: 200
    input: [units_produced, minutes, hold_temp_c]
    output: PerformanceValidation
    side_effects:
      - "appends {run_index, units_produced, minutes, hold_temp_c, recorded_at} to PerformanceValidation.test_runs with run_index = len(test_runs) + 1 and recorded_at = the current logical clock"
  - method: POST
    path: "/performance-validations/{id}/conclusion"
    description: "Conclude the validation attempt: stamps both throughput variants and decides PASSED or FAILED."
    roles: [ApplicationEngineer, PlatformAdmin]
    code: 200
    input: []
    output: PerformanceValidation
    side_effects:
      - "increments attempt_count by 1"
      - "stamps certified_throughput_units_per_hour (best_window) and as_tested_throughput_units_per_hour (full_series) per calculations.measured_throughput_units_per_hour"
      - "IN_PROGRESS -> PASSED, or IN_PROGRESS -> FAILED with failure_reason set"
  - method: POST
    path: "/performance-validations/{id}/retest"
    description: "Re-open a FAILED validation for another test series, clearing the prior runs."
    roles: [ApplicationEngineer, PlatformAdmin]
    code: 200
    input: []
    output: PerformanceValidation
    side_effects:
      - "FAILED -> IN_PROGRESS"
      - "clears test_runs to [] and both throughput variants and failure_reason to null"

  # ---- ConstructionProgram ----
  - method: POST
    path: "/construction-programs"
    description: "Open a restaurant construction or remodel program for a chain."
    roles: [ChainAdmin, PlatformAdmin]
    code: 201
    input: [chain_account_id, program_code, program_type, site_count_planned]
    output: ConstructionProgram
    side_effects:
      - "sets commit_posture to ON_TRACK (empty considered set)"
  - method: GET
    path: "/construction-programs"
    description: "List construction programs, filterable by chain account (FK reverse-reachability for ConstructionProgram.chain_account_id)."
    roles: [ChainAdmin, ProductionPlanner, ChannelManager, PlatformAdmin]
    code: 200
    input: ["chain_account_id?", "program_type?", "commit_posture?", "limit?", "offset?"]
    output: ConstructionProgram[]
    side_effects: []
  - method: GET
    path: "/construction-programs/{id}"
    description: "Read one construction program including its derived commit posture."
    roles: [ChainAdmin, ProductionPlanner, ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: ConstructionProgram
    side_effects: []

  # ---- SiteOrder ----
  - method: POST
    path: "/site-orders"
    description: "Add a restaurant site to the program with a committed delivery date and a released configuration."
    roles: [ChainAdmin, PlatformAdmin]
    code: 201
    input: [construction_program_id, chain_configuration_id, site_code, committed_delivery_date, unit_count]
    output: SiteOrder
    side_effects:
      - "sets fulfillment_status to PENDING and commitment_status to UNSCHEDULED with projected_delivery_date and slack_days null"
      - "re-derives ConstructionProgram.commit_posture"
  - method: GET
    path: "/site-orders"
    description: "List site orders, filterable by program or configuration (FK reverse-reachability for SiteOrder.construction_program_id and SiteOrder.chain_configuration_id)."
    roles: [ChainAdmin, ProductionPlanner, ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: ["construction_program_id?", "chain_configuration_id?", "fulfillment_status?", "commitment_status?", "limit?", "offset?"]
    output: SiteOrder[]
    side_effects: []
  - method: GET
    path: "/site-orders/{id}"
    description: "Read one site order including both of its independent status dimensions."
    roles: [ChainAdmin, ProductionPlanner, ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: []
    output: SiteOrder
    side_effects: []
  - method: POST
    path: "/site-orders/{id}/commitment-waiver"
    description: "The chain waives the delivery-date commitment for a site that is AT_RISK or BREACHED, freezing the commitment dimension at WAIVED."
    roles: [ChainAdmin, PlatformAdmin]
    code: 200
    input: [waiver_reason]
    output: SiteOrder
    side_effects:
      - "sets commitment_status to WAIVED and stores waiver_reason"
      - "re-derives ConstructionProgram.commit_posture, which now excludes this site order"
  - method: POST
    path: "/site-orders/{id}/fulfillment-events"
    description: "Record a shipping or delivery event on the site order's fulfillment dimension."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: [event]
    output: SiteOrder
    side_effects:
      - "SHIP: BUILT -> SHIPPED"
      - "DELIVER: SHIPPED -> DELIVERED and recomputes commitment_status and ConstructionProgram.commit_posture"

  # ---- BuildLine ----
  - method: POST
    path: "/build-lines"
    description: "Register a production line with its daily capacity and tooled energy types."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 201
    input: [line_code, plant_code, daily_capacity_units, supported_energy_types]
    output: BuildLine
    side_effects:
      - "sets committed_units to 0"
  - method: GET
    path: "/build-lines"
    description: "List production lines."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: ["plant_code?", "limit?", "offset?"]
    output: BuildLine[]
    side_effects: []
  - method: GET
    path: "/build-lines/{id}"
    description: "Read one production line including its committed_units ledger."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: []
    output: BuildLine
    side_effects: []

  # ---- ProductionSlot ----
  - method: POST
    path: "/production-slots"
    description: "Reserve a closed build interval on a line for a site order. The interval is padded by CHANGEOVER_BUFFER_HOURS on each side, so touching windows collide."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 201
    input: [build_line_id, site_order_id, window_start, window_end, units]
    output: ProductionSlot
    side_effects:
      - "sets status to RESERVED"
      - "increments BuildLine.committed_units by units"
      - "transitions the SiteOrder fulfillment dimension PENDING -> SCHEDULED; a no-op when the site order has already advanced past PENDING, which is how the two SiteOrder dimensions move independently"
      - "recomputes SiteOrder.projected_delivery_date, slack_days and commitment_status per calculations.site_order_commitment_status"
      - "re-derives ConstructionProgram.commit_posture"
  - method: GET
    path: "/production-slots"
    description: "List production slots, filterable by line or site order (FK reverse-reachability for ProductionSlot.build_line_id and ProductionSlot.site_order_id)."
    roles: [ProductionPlanner, ChainAdmin, PlatformAdmin]
    code: 200
    input: ["build_line_id?", "site_order_id?", "status?", "limit?", "offset?"]
    output: ProductionSlot[]
    side_effects: []
  - method: GET
    path: "/production-slots/{id}"
    description: "Read one production slot."
    roles: [ProductionPlanner, ChainAdmin, PlatformAdmin]
    code: 200
    input: []
    output: ProductionSlot
    side_effects: []
  - method: POST
    path: "/production-slots/{id}/build-progress"
    description: "Advance the slot through CONFIRM, START and COMPLETE, driving the site order's fulfillment dimension."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: [progress]
    output: ProductionSlot
    side_effects:
      - "CONFIRM: RESERVED -> CONFIRMED, BuildLine.committed_units unchanged"
      - "START: CONFIRMED -> IN_BUILD and SiteOrder SCHEDULED -> IN_BUILD"
      - "COMPLETE: IN_BUILD -> COMPLETED, decrements BuildLine.committed_units by units, SiteOrder IN_BUILD -> BUILT"
  - method: POST
    path: "/production-slots/{id}/cancellation"
    description: "Cancel a reserved or confirmed slot, releasing the line capacity it held."
    roles: [ProductionPlanner, PlatformAdmin]
    code: 200
    input: [cancellation_reason]
    output: ProductionSlot
    side_effects:
      - "RESERVED|CONFIRMED -> CANCELLED"
      - "decrements BuildLine.committed_units by units, restoring committed_units == sum of units over slots in {RESERVED, CONFIRMED, IN_BUILD}"
      - "if the site order has no slot left in {RESERVED, CONFIRMED, IN_BUILD, COMPLETED}, resets it to fulfillment_status PENDING and commitment_status UNSCHEDULED with projected_delivery_date and slack_days null"
      - "re-derives ConstructionProgram.commit_posture"

  # ---- ConnectedUnit ----
  - method: POST
    path: "/connected-units"
    description: "Register a shipped or aftermarket connected unit into the monitoring fleet."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 201
    input: ["equipment_model_id", "serial_number", "service_tier", "site_order_id?"]
    output: ConnectedUnit
    side_effects:
      - "sets service_program_status to PENDING_INSTALL, firmware_version to 1.0.0, recipe_book_version to 1"
      - "computes health_score per calculations.connected_unit_health_score"
  - method: GET
    path: "/connected-units"
    description: "List connected units, filterable by model or site order (FK reverse-reachability for ConnectedUnit.equipment_model_id and ConnectedUnit.site_order_id)."
    roles: [ConnectedOpsEngineer, WarrantyAdjudicator, ServicePartnerUser, ChainAdmin, PlatformAdmin]
    code: 200
    input: ["equipment_model_id?", "site_order_id?", "service_program_status?", "limit?", "offset?"]
    output: ConnectedUnit[]
    side_effects:
      - "re-evaluates the lazy GRACE -> EXPIRED and ACTIVE|EXTENDED -> EXPIRED transitions for each returned unit"
  - method: GET
    path: "/connected-units/{id}"
    description: "Read one connected unit including its warranty reserve ledger and health score."
    roles: [ConnectedOpsEngineer, WarrantyAdjudicator, ServicePartnerUser, ChainAdmin, PlatformAdmin]
    code: 200
    input: []
    output: ConnectedUnit
    side_effects:
      - "re-evaluates the lazy GRACE -> EXPIRED and ACTIVE|EXTENDED -> EXPIRED transitions"
  - method: POST
    path: "/connected-units/{id}/telemetry"
    description: "Post monitoring telemetry (trailing-30-day fault count and missed heartbeats) for the unit."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: [fault_count_30d, missed_heartbeat_count]
    output: ConnectedUnit
    side_effects:
      - "recomputes ConnectedUnit.health_score per calculations.connected_unit_health_score"
  - method: POST
    path: "/connected-units/{id}/recipe-pushes"
    description: "Push a recipe book generation to a covered unit."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: [recipe_book_version]
    output: ConnectedUnit
    side_effects:
      - "sets ConnectedUnit.recipe_book_version to the supplied generation"
  - method: POST
    path: "/connected-units/{id}/coverage-actions"
    description: "Administer the unit's warranty / extended service program: ACTIVATE stamps the coverage term and reserve, EXTEND buys another term for EXTENDED_PLUS units, VOID terminates coverage."
    roles: [WarrantyAdjudicator, PlatformAdmin]
    code: 200
    input: ["action", "void_reason?"]
    output: ConnectedUnit
    side_effects:
      - "ACTIVATE: PENDING_INSTALL -> ACTIVE, stamps coverage_start_date, coverage_end_date, reserve_initial_cents and reserve_balance_cents"
      - "EXTEND: ACTIVE -> EXTENDED, extends coverage_end_date by EXTENSION_TERM_DAYS and adds EXTENSION_RESERVE_CENTS to both reserve_initial_cents and reserve_balance_cents"
      - "VOID: ACTIVE|EXTENDED|GRACE -> VOIDED and zeroes reserve_balance_cents"

  # ---- FirmwareCampaign ----
  - method: POST
    path: "/firmware-campaigns"
    description: "Draft a firmware rollout campaign over a half-open window for a model's connected fleet."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 201
    input: [equipment_model_id, campaign_code, target_firmware_version, window_start, window_end, cohort_scope]
    output: FirmwareCampaign
    side_effects:
      - "sets status to DRAFT, cohort_unit_ids to [], success_count and failure_count to 0"
  - method: GET
    path: "/firmware-campaigns"
    description: "List firmware campaigns, filterable by model (FK reverse-reachability for FirmwareCampaign.equipment_model_id)."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: ["equipment_model_id?", "status?", "limit?", "offset?"]
    output: FirmwareCampaign[]
    side_effects: []
  - method: GET
    path: "/firmware-campaigns/{id}"
    description: "Read one firmware campaign including its selected cohort."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: []
    output: FirmwareCampaign
    side_effects: []
  - method: POST
    path: "/firmware-campaigns/{id}/schedule"
    description: "Schedule the campaign, selecting its cohort. Enforces the half-open window aggregate capacity of MAX_CONCURRENT_CAMPAIGNS_PER_MODEL per model."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: []
    output: FirmwareCampaign
    side_effects:
      - "DRAFT -> SCHEDULED"
      - "sets cohort_unit_ids to the first COHORT_SIZE[cohort_scope] eligible units ordered by health_score ASC then created_at ASC"
  - method: POST
    path: "/firmware-campaigns/{id}/start"
    description: "Start the scheduled campaign; only permitted while window_start <= clock < window_end."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: []
    output: FirmwareCampaign
    side_effects:
      - "SCHEDULED -> RUNNING and resets success_count and failure_count to 0"
  - method: POST
    path: "/firmware-campaigns/{id}/unit-results"
    description: "Report one cohort unit's firmware update outcome."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: [connected_unit_id, outcome]
    output: FirmwareCampaign
    side_effects:
      - "increments success_count or failure_count by 1"
  - method: POST
    path: "/firmware-campaigns/{id}/close"
    description: "Close the running campaign: COMPLETE promotes the successful cohort units' firmware_version, ROLL_BACK leaves firmware untouched and re-syncs recipes."
    roles: [ConnectedOpsEngineer, PlatformAdmin]
    code: 200
    input: [disposition]
    output: FirmwareCampaign
    side_effects:
      - "stamps success_rate"
      - "COMPLETE: RUNNING -> COMPLETED and sets firmware_version to target_firmware_version on every cohort unit that reported SUCCESS"
      - "ROLL_BACK: RUNNING -> ROLLED_BACK, leaves firmware_version unchanged and increments recipe_book_version by 1 on every cohort unit that reported SUCCESS"
      - "recomputes health_score for every cohort unit"

  # ---- ServicePartner ----
  - method: POST
    path: "/service-partners"
    description: "Register a service network partner application with its region and parts stocking commitment."
    roles: [ChannelManager, PlatformAdmin]
    code: 201
    input: [partner_code, name, region_code, parts_stocking_level]
    output: ServicePartner
    side_effects:
      - "sets status to APPLIED and authorized_model_ids to []"
  - method: GET
    path: "/service-partners"
    description: "List service network partners."
    roles: [ChannelManager, WarrantyAdjudicator, PlatformAdmin]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: ServicePartner[]
    side_effects: []
  - method: GET
    path: "/service-partners/{id}"
    description: "Read one service partner including its derived authorized_model_ids."
    roles: [ChannelManager, WarrantyAdjudicator, ServicePartnerUser, PlatformAdmin]
    code: 200
    input: []
    output: ServicePartner
    side_effects: []
  - method: POST
    path: "/service-partners/{id}/authorization"
    description: "Advance the partner's service network authorization: PROVISION, AUTHORIZE, SUSPEND, REINSTATE or TERMINATE."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: [action]
    output: ServicePartner
    side_effects:
      - "PROVISION: APPLIED -> PROVISIONAL; AUTHORIZE: PROVISIONAL -> AUTHORIZED; SUSPEND: AUTHORIZED -> SUSPENDED; REINSTATE: SUSPENDED -> AUTHORIZED; TERMINATE: PROVISIONAL|SUSPENDED -> TERMINATED"
      - "re-derives ServicePartner.authorized_model_ids per calculations.service_partner_claim_authority"

  # ---- TechnicianCertification ----
  - method: POST
    path: "/technician-certifications"
    description: "Enroll a partner technician in the training program for one equipment model."
    roles: [ServicePartnerUser, ChannelManager, PlatformAdmin]
    code: 201
    input: [service_partner_id, equipment_model_id, technician_code, training_hours]
    output: TechnicianCertification
    side_effects:
      - "sets status to ENROLLED with exam_score, certified_on and expires_on null"
  - method: GET
    path: "/technician-certifications"
    description: "List technician certifications, filterable by partner or model (FK reverse-reachability for TechnicianCertification.service_partner_id and TechnicianCertification.equipment_model_id)."
    roles: [ServicePartnerUser, ChannelManager, WarrantyAdjudicator, PlatformAdmin]
    code: 200
    input: ["service_partner_id?", "equipment_model_id?", "status?", "limit?", "offset?"]
    output: TechnicianCertification[]
    side_effects: []
  - method: GET
    path: "/technician-certifications/{id}"
    description: "Read one technician certification."
    roles: [ServicePartnerUser, ChannelManager, WarrantyAdjudicator, PlatformAdmin]
    code: 200
    input: []
    output: TechnicianCertification
    side_effects: []
  - method: POST
    path: "/technician-certifications/{id}/grade"
    description: "Record the certification exam grade for an enrolled technician."
    roles: [ChannelManager, PlatformAdmin]
    code: 200
    input: [exam_score]
    output: TechnicianCertification
    side_effects:
      - "PASSED when exam_score >= PASS_SCORE, stamping certified_on and expires_on; otherwise FAILED"
      - "re-derives ServicePartner.authorized_model_ids per calculations.service_partner_claim_authority"

  # ---- WarrantyClaim ----
  - method: POST
    path: "/warranty-claims"
    description: "An authorized partner files a warranty claim against a covered unit for parts and labor."
    roles: [ServicePartnerUser, PlatformAdmin]
    code: 201
    input: [connected_unit_id, service_partner_id, technician_certification_id, claim_code, parts_cost_cents, labor_hours]
    output: WarrantyClaim
    side_effects:
      - "sets status to SUBMITTED with coinsurance_pct and adjudicated_amount_cents null"
  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims, filterable by unit, partner or certification (FK reverse-reachability for WarrantyClaim.connected_unit_id, WarrantyClaim.service_partner_id and WarrantyClaim.technician_certification_id)."
    roles: [ServicePartnerUser, WarrantyAdjudicator, ChannelManager, PlatformAdmin]
    code: 200
    input: ["connected_unit_id?", "service_partner_id?", "technician_certification_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Read one warranty claim including its stamped coinsurance and payout."
    roles: [ServicePartnerUser, WarrantyAdjudicator, ChannelManager, PlatformAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/adjudication"
    description: "Adjudicate the claim. APPROVE runs the pinned-order payout calculation and debits the unit's reserve; DENY records a reason and leaves the ledger untouched."
    roles: [WarrantyAdjudicator, PlatformAdmin]
    code: 200
    input: ["decision", "denial_reason?"]
    output: WarrantyClaim
    side_effects:
      - "APPROVE: SUBMITTED -> APPROVED, stamps coinsurance_pct and adjudicated_amount_cents per calculations.warranty_claim_adjudicated_amount_cents, debits ConnectedUnit.reserve_balance_cents and credits ConnectedUnit.claims_paid_cents, and moves the unit to GRACE when the reserve reaches 0"
      - "DENY: SUBMITTED -> DENIED with denial_reason and no ledger movement"
  - method: POST
    path: "/warranty-claims/{id}/reversal"
    description: "Reverse an approved claim, restoring the unit's warranty reserve exactly."
    roles: [WarrantyAdjudicator, PlatformAdmin]
    code: 200
    input: [reversal_reason]
    output: WarrantyClaim
    side_effects:
      - "APPROVED -> REVERSED"
      - "credits ConnectedUnit.reserve_balance_cents and debits ConnectedUnit.claims_paid_cents by adjudicated_amount_cents, preserving reserve_balance_cents + claims_paid_cents == reserve_initial_cents"
      - "returns the unit GRACE -> ACTIVE when the restored reserve is > 0 and clock < grace_expires_on"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role names no role declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_CHAIN_SCOPE_VIOLATION
    http: 403
    condition: "a ChainAdmin acted on a resource whose owning ChainAccount.id differs from the acting X-User-ID"
  - id: ERR_PARTNER_SCOPE_VIOLATION
    http: 403
    condition: "a ServicePartnerUser acted on a resource whose owning ServicePartner.id differs from the acting X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed request: missing required field, invalid enum member, out-of-range integer, non-ISO datetime, window_end <= window_start, limit outside [1,100], negative offset, or duplicated array element"
  - id: ERR_EQUIPMENT_MODEL_NOT_FOUND
    http: 404
    condition: "the referenced equipment_model_id does not exist"
  - id: ERR_COMPLIANCE_RESOURCE_NOT_FOUND
    http: 404
    condition: "the referenced CertificationListing does not exist"
  - id: ERR_CHAIN_RESOURCE_NOT_FOUND
    http: 404
    condition: "the referenced ChainAccount, ChainConfiguration, PerformanceValidation, ConstructionProgram or SiteOrder does not exist"
  - id: ERR_PRODUCTION_RESOURCE_NOT_FOUND
    http: 404
    condition: "the referenced BuildLine or ProductionSlot does not exist"
  - id: ERR_CONNECTED_RESOURCE_NOT_FOUND
    http: 404
    condition: "the referenced ConnectedUnit or FirmwareCampaign does not exist"
  - id: ERR_CHANNEL_RESOURCE_NOT_FOUND
    http: 404
    condition: "the referenced ServicePartner or TechnicianCertification does not exist"
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "the referenced WarrantyClaim does not exist"
  - id: ERR_STALE_CHAIN_ACCOUNT_VERSION
    http: 412
    condition: "expected_chain_account_version does not equal the current ChainAccount.version on POST /chain-configurations"
  - id: ERR_STALE_CONFIGURATION_VERSION
    http: 412
    condition: "expected_chain_configuration_version does not equal the current ChainConfiguration.version on POST /performance-validations"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID equals the user who submitted the listing application or the configuration now being decided"
  - id: ERR_LISTING_STATE_INVALID
    http: 409
    condition: "the CertificationListing is not in a state that admits the requested submission or agency decision"
  - id: ERR_CONFIGURATION_STATE_INVALID
    http: 409
    condition: "the ChainConfiguration is not in a state that admits the requested submission, decision, branding sign-off, release, or validation create"
  - id: ERR_VALIDATION_STATE_INVALID
    http: 409
    condition: "the PerformanceValidation is not in a state that admits the requested test run, conclusion or retest"
  - id: ERR_PRODUCTION_STATE_INVALID
    http: 409
    condition: "the ProductionSlot or SiteOrder fulfillment dimension is not in a state that admits the requested progress or fulfillment event"
  - id: ERR_CONNECTED_STATE_INVALID
    http: 409
    condition: "the ConnectedUnit coverage dimension or FirmwareCampaign is not in a state that admits the requested action"
  - id: ERR_CHANNEL_STATE_INVALID
    http: 409
    condition: "the ServicePartner or TechnicianCertification is not in a state that admits the requested authorization action, enrollment or grade"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "the WarrantyClaim is not in a state that admits the requested adjudication or reversal"
  - id: ERR_UNIT_COVERAGE_NOT_ACTIVE
    http: 409
    condition: "the referenced ConnectedUnit.service_program_status is not ACTIVE or EXTENDED after the lazy expiry re-evaluation"
  - id: ERR_CONFIGURATION_NOT_RELEASED
    http: 409
    condition: "the SiteOrder's ChainConfiguration.status is not RELEASED"
  - id: ERR_MODEL_LISTING_SUSPENDED
    http: 422
    condition: "the referenced EquipmentModel.certification_posture is SUSPENDED"
  - id: ERR_MODEL_NOT_LISTED
    http: 422
    condition: "the referenced EquipmentModel.certification_posture is not LISTED, because a required scope is uncovered or the covering listing has reached its expires_on"
  - id: ERR_PERFORMANCE_VALIDATION_NOT_PASSED
    http: 422
    condition: "no PerformanceValidation child of the ChainConfiguration has status PASSED"
  - id: ERR_AGENCY_SCOPE_NOT_COVERED
    http: 422
    condition: "a requested certification scope is not in AGENCY_SCOPES for the chosen agency_code"
  - id: ERR_CONTROLS_PACKAGE_UNSUPPORTED
    http: 422
    condition: "the requested controls_package is not in EquipmentModel.supported_controls_packages"
  - id: ERR_LINE_ENERGY_INCOMPATIBLE
    http: 422
    condition: "the model's energy_type is not in BuildLine.supported_energy_types"
  - id: ERR_MODEL_VERSION_PIN_STALE
    http: 422
    condition: "ChainConfiguration.pinned_model_version no longer equals the current EquipmentModel.version at release time"
  - id: ERR_PARTNER_NOT_AUTHORIZED_FOR_CLAIMS
    http: 422
    condition: "the filing ServicePartner is not AUTHORIZED, or the unit's equipment_model_id is not in the partner's authorized_model_ids"
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 422
    condition: "the referenced TechnicianCertification is not an unexpired PASSED certification of the filing partner for the unit's model"
  - id: ERR_BUILD_SLOT_OVERLAP
    http: 409
    condition: "the requested closed build interval collides with an existing RESERVED / CONFIRMED / IN_BUILD slot on the same line once padded by CHANGEOVER_BUFFER_HOURS on each side"
  - id: ERR_CAMPAIGN_WINDOW_SATURATED
    http: 409
    condition: "MAX_CONCURRENT_CAMPAIGNS_PER_MODEL SCHEDULED / RUNNING campaigns for this model already intersect the requested half-open window"
  - id: ERR_CAMPAIGN_WINDOW_NOT_OPEN
    http: 409
    condition: "the clock is outside [window_start, window_end) when starting the campaign"
  - id: ERR_DUPLICATE_LISTING_APPLICATION
    http: 409
    condition: "another listing for the same model and agency is already SUBMITTED, UNDER_REVIEW, CONDITIONS_REQUESTED or LISTED"
  - id: ERR_DUPLICATE_SERIAL_NUMBER
    http: 409
    condition: "another ConnectedUnit already uses this serial_number"
  - id: ERR_DUPLICATE_RESOURCE_CODE
    http: 409
    condition: "the supplied business code is already used within its declared uniqueness scope"
  - id: ERR_LISTING_REVISION_LIMIT
    http: 422
    condition: "the listing has already been re-submitted MAX_LISTING_REVISIONS times"
  - id: ERR_RETEST_LIMIT_EXCEEDED
    http: 422
    condition: "PerformanceValidation.attempt_count has reached RETEST_LIMIT"
  - id: ERR_MIN_TEST_RUNS_NOT_MET
    http: 422
    condition: "fewer than MIN_RUNS test runs have been appended to the validation"
  - id: ERR_INSUFFICIENT_CERTIFIED_TECHNICIANS
    http: 422
    condition: "the partner has no model with MIN_CERTIFIED_TECHS_PER_MODEL unexpired PASSED technician certifications"
  - id: ERR_TRAINING_HOURS_NOT_MET
    http: 422
    condition: "the technician's training_hours is below MIN_TRAINING_HOURS at grading time"
  - id: ERR_PARTS_STOCKING_INSUFFICIENT
    http: 422
    condition: "the partner's parts_stocking_level is not FULL at full-authorization time"
  - id: ERR_PROGRAM_SITE_CAPACITY_EXCEEDED
    http: 422
    condition: "the construction program already holds site_count_planned site orders"
  - id: ERR_NO_ELIGIBLE_UNITS
    http: 422
    condition: "fewer than COHORT_SIZE[cohort_scope] covered units of the model are eligible for the target firmware version"
  - id: ERR_UNIT_NOT_IN_COHORT
    http: 422
    condition: "the reported unit is not in the campaign's cohort_unit_ids, or already reported a result in this run"
  - id: ERR_BUILD_CAPACITY_EXCEEDED
    http: 422
    condition: "the requested slot units exceed the line's daily_capacity_units multiplied by the closed interval's span in days"
  - id: ERR_WARRANTY_RESERVE_EXHAUSTED
    http: 422
    condition: "the computed adjudicated_amount_cents exceeds the unit's remaining reserve_balance_cents"
  - id: ERR_CAMPAIGN_SUCCESS_RATE_TOO_LOW
    http: 422
    condition: "the campaign cannot be closed: not every cohort unit has reported, or the success_rate is below MIN_SUCCESS_RATE for a COMPLETE disposition"

roles:
  - name: ComplianceEngineer
    description: "Owns the manufacturer catalog and files listing applications with the sanitation / gas / electrical listing agencies."
    identity: "opaque"
    exclusive_operations:
      - "POST /equipment-models"
      - "PATCH /equipment-models/{id}"
      - "POST /certification-listings"
      - "POST /certification-listings/{id}/submissions"
    shared_operations:
      - "GET /equipment-models"
      - "GET /equipment-models/{id}"
      - "GET /certification-listings"
      - "GET /certification-listings/{id}"

  - name: ListingReviewer
    description: "Records listing-agency decisions, suspensions and reinstatements. Segregation of duties: cannot decide a listing they submitted."
    identity: "opaque"
    exclusive_operations:
      - "POST /certification-listings/{id}/agency-decisions"
    shared_operations:
      - "GET /equipment-models"
      - "GET /equipment-models/{id}"
      - "GET /certification-listings"
      - "GET /certification-listings/{id}"

