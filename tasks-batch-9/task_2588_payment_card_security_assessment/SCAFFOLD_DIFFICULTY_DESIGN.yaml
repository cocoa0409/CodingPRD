            - "Requirement 3.5.1 (family R3) is NOT_IN_PLACE and carries a SUBMITTED worksheet with the same 4 refs and the same 7-day interval, so control_depth_points 80, monitoring_factor 80, risk_offset_points 25 and rigor_score 66.25."
