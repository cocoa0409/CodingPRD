              as: CaseWorker
              captures: { ncpi: "$.data.id" }
            - call: "POST /child-support/participants/${ncpi}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpi}", noncustodial_party_id: "${ncpi}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casei: "$.data.id" }
            - call: "POST /child-support/cases/${casei}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casei}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderi: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Perla Nyquist", ssn_last4: "6133", residence_state_code: "MN", monthly_gross_income_cents: 100001, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpj: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Sten Nyquist", ssn_last4: "6134", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpj: "$.data.id" }
            - call: "POST /child-support/participants/${ncpj}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpj}", noncustodial_party_id: "${ncpj}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casej: "$.data.id" }
            - call: "POST /child-support/cases/${casej}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casej}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderj: "$.data.id" }
          trigger:
            - call: "POST /child-support/orders/${orderi}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { i_g: "$.data.guideline_monthly_cents", i_imp: "$.data.imputation_applied", i_cpi: "$.data.guideline_cp_income_cents", i_ncpi: "$.data.guideline_ncp_income_cents", i_basic: "$.data.guideline_basic_obligation_cents", i_ratio: "$.data.guideline_ncp_share_ratio" }
            - call: "POST /child-support/orders/${orderj}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { j_g: "$.data.guideline_monthly_cents", j_imp: "$.data.imputation_applied", j_cpi: "$.data.guideline_cp_income_cents", j_ncpi: "$.data.guideline_ncp_income_cents", j_basic: "$.data.guideline_basic_obligation_cents", j_ratio: "$.data.guideline_ncp_share_ratio" }
          assert:
            - "${i_cpi} == 100000 and ${i_ncpi} == 300000  # combined 400000 == the band 1 ceiling, and the test is `ceiling >= combined`"
            - "${i_basic} == 112000  # band 1 two_children 0.28: round_half_up(400000 * 0.28) == 112000"
            - "${i_ratio} == 0.7500 and ${i_g} == 84000  # round_half_up(112000 * 0.7500) == 84000, below available 186800"
            - "${j_basic} == 100000  # combined 400001 falls to band 2 two_children 0.25: round_half_up(400001 * 0.25) == round_half_up(100000.25) == 100000"
            - "${j_ratio} == 0.7500  # round_half_up_4dp(300000/400001) == round_half_up_4dp(0.749998...) == 0.7500"
