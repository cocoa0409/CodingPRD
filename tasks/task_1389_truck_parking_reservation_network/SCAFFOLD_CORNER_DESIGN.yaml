        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_FLEET_SUSPENDED]"]
        distinguishing_aspect: "Fleet SUSPENDED by the overdue cascade; approving a still-PENDING authorization (untouched by the cascade, which only suspends ACTIVE ones) fails ERR_FLEET_SUSPENDED."
        test_recipe:
          setup:
            - "site 1 reservable stall; fleet F (terms 30); driver D1 auth PENDING (never approved); driver D2 auth ACTIVE with a settled 4500 booking invoiced for 2026-08"
            - "clock 2026-10-01 fleet ops-run -> invoice OVERDUE -> fleet SUSPENDED"
          setup_api_calls:
