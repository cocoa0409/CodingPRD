              payload: {}
              as: ServiceTechnician
              captures: { err_so: $.data.error_id }
            - call: "GET /fitness/parts-inventory/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ServiceTechnician
              captures: { err_pi: $.data.error_id }
          assert:
            - "both GETs return 404 with error_id ERR_RESOURCE_NOT_FOUND (captured as ${err_so} and ${err_pi})"
            - "neither response leaks an entity-specific not-found code"
            - "response_type is error and meta.api_request_id is present on both"

  # ===========================================================================
  - section: errors
    instances:

      - name: second_owner_on_a_membership_returns_owner_already_exists
        claim_type: Violation → Error
        grounds:
          - errors[ERR_OWNER_ALREADY_EXISTS]
          - entities.HouseholdUser.fields.role
        distinguishing_aspect: "The uniqueness of the OWNER row within a membership is enforced at creation, and the second OWNER attempt is refused without disturbing the first."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PROVISIONAL membership with an existing OWNER row."
          setup_api_calls:
