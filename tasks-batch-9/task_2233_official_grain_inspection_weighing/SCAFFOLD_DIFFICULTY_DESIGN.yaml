  - rule_id: resource_temporal_overlap
    rule_summary: "Two time windows compete for one resource; the boundary case decides acceptance."
    instances:
      - name: inspector_watch_windows_conflict_inside_a_45_minute_travel_buffer
        mechanism: |
          A supervising inspector's watch windows are compared AFTER both are inflated by a 45-minute
          travel buffer, using the half-open predicate conflict iff new.start < existing.end + 45min
          and existing.start < new.end + 45min. A watch starting 30 minutes after the previous one ends
          therefore conflicts, a watch starting exactly 45 minutes after it ends does not, and the same
          asymmetric test applies on the earlier side. Terminal watches (ABORTED, CLOSED) leave the
          resource free.
        distinguishing_aspect: "The contended resource is a PERSON and the comparison is buffer-inflated, so the conflict zone extends outside the declared windows; the sibling contends for area capacity using raw windows where mere touching conflicts."
        entities_involved: [VesselWatch, Inspector, InspectionRequest, ServiceArea]
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_INSPECTOR_WATCH_OVERLAP]"
          - "entities.VesselWatch.fields.window_start_at"
          - "entities.VesselWatch.fields.window_end_at"
          - "endpoints[POST /grain-inspection/vessel-watches]"
        test_recipe:
          setup:
            - "A DESIGNATED area with concurrent_watch_capacity 9 so area capacity can never be the binding constraint."
            - "One ACTIVE supervisor holding SUPERVISION and three export requests with EXPORT_SUPERVISION requested."
            - "A SCHEDULED watch for that supervisor covering 2026-08-03T08:00:00Z to 12:00:00Z; the logical clock stands at 07:00:00Z so no watch has started."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T07:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED", concurrent_watch_capacity: 9 }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Ocean Grain Traders", account_code: "OGT-002", contact_email: "export@ocean.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-9101", full_name: "S. Watcher", endorsements: ["SUPERVISION"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${insp}/training-records
              as: ServiceAdmin
              payload: { course_code: "SUPERVISION-201", hours: 24 }
            - call: POST /grain-inspection/inspectors/${insp}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-VW1", declared_quantity_bushels: 5000, requested_services: ["GRADING", "EXPORT_SUPERVISION"] }
              captures: { req1: "$.data.id" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-VW2", declared_quantity_bushels: 5000, requested_services: ["GRADING", "EXPORT_SUPERVISION"] }
              captures: { req2: "$.data.id" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-VW3", declared_quantity_bushels: 5000, requested_services: ["GRADING", "EXPORT_SUPERVISION"] }
              captures: { req3: "$.data.id" }
            - call: POST /grain-inspection/vessel-watches
              as: SupervisingInspector
              payload: { inspection_request_id: "${req1}", supervisor_inspector_id: "${insp}", vessel_name: "MV Alpha", window_start_at: "2026-08-03T08:00:00Z", window_end_at: "2026-08-03T12:00:00Z", holds_declared: 2 }
              captures: { vw1: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/vessel-watches
              as: SupervisingInspector
              payload: { inspection_request_id: "${req2}", supervisor_inspector_id: "${insp}", vessel_name: "MV Bravo", window_start_at: "2026-08-03T12:30:00Z", window_end_at: "2026-08-03T15:00:00Z", holds_declared: 1 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_INSPECTOR_WATCH_OVERLAP — 12:30 < 12:00 + 45min (12:45), so the buffered windows conflict even though the declared windows are disjoint"
            - "The same watch scheduled at window_start_at 2026-08-03T12:45:00Z -> 201 (12:45 < 12:45 is false; the boundary is open and exactly 45 minutes of travel is enough)"
            - "On the earlier side, a watch 2026-08-03T06:00:00Z to 2026-08-03T07:15:00Z -> 201 (08:00 < 07:15 + 45min = 08:00 is false), while 06:00 to 07:16 -> 422 ERR_INSPECTOR_WATCH_OVERLAP"
            - "GET /grain-inspection/vessel-watches?supervisor_inspector_id=${insp} -> total_count 1 immediately after the rejected trigger (no partial row was written)"
            - "POST /grain-inspection/vessel-watches/${vw1}/abort then re-posting the 12:30 to 15:00 watch -> 201, because ABORTED is terminal and no longer occupies the inspector"
            - "A watch for a DIFFERENT inspector at 12:30 to 15:00 -> 201; the buffer is per-inspector, not per-area"
        expected_failure_mode_if_naive: "Naive interval checks compare the raw windows and accept the 12:30 watch, double-booking the supervisor; over-eager implementations use a closed comparison and reject the legitimate 12:45 watch."

      - name: area_watch_capacity_counts_touching_windows_at_the_shared_endpoint
        mechanism: |
          Area capacity is a counting constraint over intersecting windows in which TOUCHING endpoints
          count as intersecting: with concurrent_watch_capacity 1, a watch beginning at exactly the
          instant the incumbent ends is refused, and one beginning a single second later is accepted.
          Only non-terminal watches occupy capacity, and the count is over the area rather than the
          inspector, so distinct supervisors do not escape it.
        distinguishing_aspect: "A per-area COUNT with closed-endpoint intersection resolved at one-second granularity; the sibling is a per-person pairwise test with a 45-minute buffer and an open boundary."
        entities_involved: [ServiceArea, VesselWatch, Inspector, InspectionRequest]
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_AREA_WATCH_CAPACITY_EXCEEDED]"
          - "entities.ServiceArea.fields.concurrent_watch_capacity"
          - "entities.ServiceArea.fields.open_watch_count"
          - "errors[ERR_WATCH_WINDOW_INVALID]"
        test_recipe:
          setup:
            - "A DELEGATED area with concurrent_watch_capacity 1."
            - "Two ACTIVE supervisors holding SUPERVISION so the per-inspector buffer rule cannot fire, and two export requests with EXPORT_SUPERVISION requested."
            - "One SCHEDULED watch covering 2026-08-03T08:00:00Z to 12:00:00Z held by the first supervisor; open_watch_count is 1 and the clock stands at 07:00:00Z."
