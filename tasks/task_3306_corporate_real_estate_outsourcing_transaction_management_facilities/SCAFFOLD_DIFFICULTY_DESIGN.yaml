- rule_id: priority_pair_validation_conflict
  instances:
  - name: draft_account_beats_oversized_site
    grounds:
    - validations[priority=6]
    - validations[priority=14]
    - errors[ERR_ACCOUNT_NOT_ACTIVE]
    - errors[ERR_SITE_EXCEEDS_PORTFOLIO]
    distinguishing_aspect: A facility-site create that violates both the state gate (account not ACTIVE, priority 6) and the referential size cap (priority 14) resolves to ERR_ACCOUNT_NOT_ACTIVE, so the state category outranks business_referential.
    test_recipe:
      setup:
      - PortfolioAccount draft-account DRAFT with portfolio_sqft 400000, ENTERPRISE tier
      - FacilitiesVendor V1 SOURCING created on that DRAFT account
      - the requested site sqft 999999 exceeds the whole portfolio
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: DraftCo
          client_name: Draft Holdings
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          dacc: $.data.id
      - call: POST /api/facilities-vendors
        payload:
          account_id: ${dacc}
          vendor_name: Ace Janitorial
          service_line: JANITORIAL
          delivery_model: SELF_PERFORM
          sourcing_program: DIVERSITY
          service_rate_cents_per_sqft: 1.25
        as: FacilitiesManager
        captures:
          V1: $.data.id
      trigger:
      - call: POST /api/facility-sites
        payload:
          account_id: ${dacc}
          vendor_id: ${V1}
          site_name: Tower Oversize
          sqft: 999999
        as: FacilitiesManager
        captures:
          e1: $.data.error_id
          m1: $.data.message
      assert:
      - ${e1} == ERR_ACCOUNT_NOT_ACTIVE
      - ${e1} != ERR_SITE_EXCEEDS_PORTFOLIO
  - name: failed_audit_consent_beats_approval_level
    grounds:
    - validations[priority=10]
    - validations[priority=16]
    - errors[ERR_CONSENT_REQUIRED]
    - errors[ERR_APPROVAL_LEVEL_INSUFFICIENT]
    distinguishing_aspect: An approval decision that violates both the safety gate (unresolved FAILED audit, priority 10) and the fiscal gate (actor level below required_approval_level, priority 16) resolves to ERR_CONSENT_REQUIRED, so business_safety outranks business_fiscal.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, portfolio_sqft 400000, ENTERPRISE tier
      - DisciplineAudit A1 FAILED with remediation_required true on the account
      - 'two AccountAssignments: auth_mgr level MANAGER, auth_dir level ACCOUNT_EXECUTIVE'
      - Lease L1 prior_rent 74000000 so required_approval_level is DIRECTOR
      - TransactionRequest T1 PENDING_APPROVAL on L1
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Regency
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/assignments
        payload:
          assignee_name: Mia Manager
          assignment_role: APPROVAL_AUTHORITY
          approval_level: MANAGER
        as: AccountExecutive
        as_user_id: ${acc}
        captures:
          auth_mgr: $.data.id
      - call: POST /api/accounts/${acc}/assignments
        payload:
          assignee_name: Dana Director
          assignment_role: APPROVAL_AUTHORITY
          approval_level: ACCOUNT_EXECUTIVE
        as: AccountExecutive
        as_user_id: ${acc}
        captures:
          auth_dir: $.data.id
      - call: POST /api/discipline-audits
        payload:
          account_id: ${acc}
          discipline: TRANSACTION
          finding: Approval minutes incomplete
        as: GovernanceManager
        captures:
          AU: $.data.id
      - call: POST /api/discipline-audits/${AU}/start
        payload: {}
        as: GovernanceManager
      - call: POST /api/discipline-audits/${AU}/decide
        payload:
          outcome: FAILED
        as: GovernanceManager
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 1 Market St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          L1: $.data.id
      - call: POST /api/transaction-requests
        payload:
          account_id: ${acc}
          lease_id: ${L1}
          request_type: RENEWAL
          prior_rent_cents_per_year: 74000000
          proposed_rent_cents_per_year: 68000000
          requested_term_months: 60
          third_party_commission_cents: 1850000
        as: TransactionManager
        captures:
          T1: $.data.id
      - call: POST /api/transaction-requests/${T1}/submit
        payload: {}
        as: TransactionManager
      trigger:
      - call: POST /api/transaction-requests/${T1}/decide
        payload:
          decision: APPROVE
          level: MANAGER
        as: ApprovalAuthority
        as_user_id: ${auth_mgr}
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_CONSENT_REQUIRED
      - ${e1} != ERR_APPROVAL_LEVEL_INSUFFICIENT
- rule_id: boundary_precision_check
  instances:
  - name: escalation_exact_margin_does_not_open
    grounds:
    - calculations.escalation_threshold_check
    - validations[priority=4]
    - errors[ERR_RESOURCE_NOT_FOUND]
    - entities.ServiceLevelKpi.fields.escalation_status
    distinguishing_aspect: A BPS shortfall of exactly 500 does not open an escalation while 501 does, pinning the strict comparison on a numeric metric reachable only through the KPI evaluate endpoint.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - ServiceLevelKpi K1 SERVICE_LEVEL BPS target 9100, AWAITING_BASELINE
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Beacon
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: COMPLETE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/service-level-kpis
        payload:
          account_id: ${acc}
          kpi_code: SLA_SCORE
          kpi_family: SERVICE_LEVEL
          measurement_unit: BPS
          measurement_window: QUARTERLY
          target_value: 9100
        as: GovernanceManager
        captures:
          K1: $.data.id
      trigger:
      - call: POST /api/service-level-kpis/${K1}/evaluate
        payload:
          actual_value: 8600
        as: GovernanceManager
        captures:
          esc: $.data.escalation_status
          pen: $.data.penalty_cents
      assert:
      - ${esc} == NONE
      - ${pen} == 150000.00
      - ${pen} != 152000.00
  - name: completion_floor_two_of_three_tasks
    grounds:
    - calculations.transition_completion_score
    - validations[priority=28]
    - errors[ERR_TRANSITION_INCOMPLETE]
    - entities.PortfolioAccount.fields.completion_pct_bps
    distinguishing_aspect: Two of three transition tasks terminal yields completion_pct_bps 6666 by floor while rounding would give 6667, pinning the truncation on a count metric reachable through the transition-task complete endpoint.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE, then OFFBOARDING with tasks TK1, TK2, TK3 all PENDING
      - TK1 and TK2 IN_PROGRESS
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Halcyon
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/transitions
        payload: {}
        as: AccountExecutive
      - call: POST /api/transition-tasks
        payload:
          account_id: ${acc}
          task_name: Handover
          task_type: DATA_HANDOVER
          sequence_no: 1
          blocking: true
          due_at: '2026-12-31T00:00:00Z'
        as: TransitionManager
        captures:
          TK1: $.data.id
      - call: POST /api/transition-tasks
        payload:
          account_id: ${acc}
          task_name: Records
          task_type: RECORDS_TRANSFER
          sequence_no: 2
          blocking: true
          due_at: '2026-12-31T00:00:00Z'
        as: TransitionManager
        captures:
          TK2: $.data.id
      - call: POST /api/transition-tasks
        payload:
          account_id: ${acc}
          task_name: Vendor wind-down
          task_type: VENDOR_TERMINATION
          sequence_no: 3
          blocking: false
          due_at: '2026-12-31T00:00:00Z'
        as: TransitionManager
        captures:
          TK3: $.data.id
      - call: POST /api/transition-tasks/${TK1}/start
        payload: {}
        as: TransitionManager
      - call: POST /api/transition-tasks/${TK2}/start
        payload: {}
        as: TransitionManager
      trigger:
      - call: POST /api/transition-tasks/${TK1}/complete
        payload: {}
        as: TransitionManager
      - call: POST /api/transition-tasks/${TK2}/complete
        payload: {}
        as: TransitionManager
      assert:
      - PortfolioAccount.${acc}.completion_pct_bps == 6666
      - PortfolioAccount.${acc}.completion_pct_bps != 6667
