scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: pack_to_melt_yield_provisional_vs_final_diverge_on_same_lot
        grounds:
          - calculations.pack_to_melt_yield
          - entities.PackLot.fields.provisional_yield_pct
          - entities.PackLot.fields.final_yield_pct
          - state_machines.PackLot.PENDING_INSPECTION_to_RELEASED
          - entities.Campaign.fields.unaccounted_loss_tons
        distinguishing_aspect: |
          The provisional variant divides gross packed tons by the job's reserved melt tons only,
          while the final variant divides NET packed tons by reserved melt tons PLUS the attributed
          colour-transition tons, so the same lot reads 95.00 at creation and 82.44 after release.
        test_recipe:
          setup:
            - "Furnace F-01: design_pull_tpd 300.00, refractory_life_total_units 100000.00, current_color AMBER after a completed colour change"
            - "Campaign CMP-01 ACTIVE, target_pull_tpd 300.00, window 2026-08-01 to 2026-08-11 (pull pool 3000.00 t)"
            - "ColorChange CC-01 COMPLETED, FLINT to AMBER, closed window 2026-08-01T00:00:00Z..2026-08-02T00:00:00Z, transition_loss_tons 90.00"
            - "ProductionJob PJ-01 COMPLETED over a 2-day window starting exactly at the colour-change window end, planned_pull_tpd 300.00 so reserved_melt_tons is 600.00, produced_units 3000000, unit weight 190.00 g"
            - "PackLot lot exists in quality_status PENDING_INSPECTION with provisional_yield_pct already computed"
            - "Logical clock at 2026-08-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "F-01", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Acme Filling", account_code: "ACME-01", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-01", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-AM", color: "AMBER", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 3.50 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/batch-recipes/${br}/approve"
              payload: {}
              as: BatchHouseTech
            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-01", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB", changeover_buffer_minutes: 45 }
              as: PlantManager
              captures: { m: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-01", color: "AMBER", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 10, target_line_speed_bpm: 500.00, container_price_usd: 0.1725, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-01", cavity_count: 12, mold_family: "PRESS_BLOW", owner: "CUSTOMER", condition_score: 70 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "AMBER", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-02T00:00:00Z", transition_loss_tons: 90.00 }
              as: BatchHouseTech
              captures: { cc: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlantManager
            - call: "POST /glass-plant/color-changes/${cc}/complete"
              payload: {}
              as: BatchHouseTech
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: PlantScheduler
              captures: { fv: "$.data.version" }
            - call: "POST /glass-plant/production-jobs"
              payload: { campaign_id: "${cmp}", furnace_id: "${f}", forming_machine_id: "${m}", batch_recipe_id: "${br}", bottle_design_id: "${d}", mold_set_id: "${ms}", code: "PJ-01", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-04T00:00:00Z", planned_pull_tpd: 300.00, expected_furnace_version: "${fv}" }
              as: PlantScheduler
              captures: { j: "$.data.id" }
            - call: "POST /glass-plant/production-jobs/${j}/start"
              payload: {}
              as: PlantScheduler
            - call: "POST /glass-plant/production-jobs/${j}/close"
              payload: { outcome: "COMPLETED", produced_units: 3000000 }
              as: PlantScheduler
            - call: "GET /glass-plant/pack-lots"
              payload: { production_job_id: "${j}" }
              as: QualityEngineer
              captures: { lot: "$.data[0].id", prov: "$.data[0].provisional_yield_pct" }
            - call: "POST /glass-plant/pack-lots/${lot}/inspection-results"
              payload: { defect_class: "MAJOR", defect_code: "CHECK_CRACK", rejected_units: 4000, inspected_at: "2026-08-02T00:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-3"
            - call: "POST /glass-plant/pack-lots/${lot}/inspection-results"
              payload: { defect_class: "MINOR", defect_code: "BIRDSWING", rejected_units: 2000, inspected_at: "2026-08-02T00:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-3"
          trigger:
            - call: "POST /glass-plant/pack-lots/${lot}/release"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-4"
          assert:
            - "PackLot.${lot}.provisional_yield_pct == 95.00"
            - "PackLot.${lot}.final_yield_pct == 82.44"
            - "PackLot.${lot}.quality_status == RELEASED"
            - "PackLot.${lot}.net_packed_units == 2994000"
            - "PackLot.${lot}.major_ppm == 1333.3 and PackLot.${lot}.minor_ppm == 666.7"
            - "Campaign.${cmp}.packed_tons == 568.86"
            - "Campaign.${cmp}.transition_loss_tons == 90.00"
            - "Campaign.${cmp}.reject_loss_tons == 1.14"
            - "Campaign.${cmp}.melt_tons_charged == 690.00"
            - "Campaign.${cmp}.unaccounted_loss_tons == 30.00"

      - name: refractory_wear_nominal_vs_stress_adjusted_diverge_on_same_job
        grounds:
          - calculations.refractory_wear
          - entities.ProductionJob.fields.projected_refractory_units_nominal
          - entities.ProductionJob.fields.projected_refractory_units_stress_adjusted
          - entities.BatchRecipe.fields.cullet_stress_factor
          - state_machines.ProductionJob.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          For one job with planned_pull_tpd 330.00 on a 300.00 tpd furnace melting a 55.00% cullet
          recipe, the nominal variant reports 990.00 wear units while the stress_adjusted variant
          reports 1267.20 (multiplier 1.28), and it is the stress_adjusted number that is charged at
          close, leaving refractory_remaining_pct at 98.73 rather than the nominal 99.01.
        test_recipe:
          setup:
            - "Furnace F-02: design_pull_tpd 300.00, refractory_life_total_units 100000.00, current_color FLINT, refractory_consumed_units 0"
            - "Campaign CMP-02 ACTIVE, target_pull_tpd 300.00, window 2026-08-01 to 2026-08-11 (pull pool 3000.00 t)"
            - "BatchRecipe BR-F55 approved, FLINT, cullet_ratio_pct 55.00 so cullet_stress_factor is 0.1000"
            - "ProductionJob PJ-02 SCHEDULED then RUNNING, window 2026-08-01T00:00:00Z..2026-08-04T00:00:00Z (3 days), planned_pull_tpd 330.00 giving over-pull 0.10"
            - "Logical clock left at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "F-02", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Boreal Beverages", account_code: "BOREAL-01", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-02", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-F55", color: "FLINT", cullet_ratio_pct: 55.00, soda_ash_kg_per_ton: 170.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/batch-recipes/${br}/approve"
              payload: {}
              as: BatchHouseTech
            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-02", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB", changeover_buffer_minutes: 45 }
              as: PlantManager
              captures: { m: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-02", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "PLANT" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-02", cavity_count: 8, mold_family: "NNPB", owner: "PLANT", condition_score: 90 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: PlantScheduler
              captures: { fv: "$.data.version" }
            - call: "POST /glass-plant/production-jobs"
              payload: { campaign_id: "${cmp}", furnace_id: "${f}", forming_machine_id: "${m}", batch_recipe_id: "${br}", bottle_design_id: "${d}", mold_set_id: "${ms}", code: "PJ-02", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-04T00:00:00Z", planned_pull_tpd: 330.00, expected_furnace_version: "${fv}" }
              as: PlantScheduler
              captures: { j: "$.data.id" }
            - call: "GET /glass-plant/production-jobs/${j}/refractory-projection"
              payload: {}
              as: PlantScheduler
              captures: { nom: "$.data.projected_refractory_units_nominal", stress: "$.data.projected_refractory_units_stress_adjusted" }
            - call: "POST /glass-plant/production-jobs/${j}/start"
              payload: {}
              as: PlantScheduler
          trigger:
            - call: "POST /glass-plant/production-jobs/${j}/close"
              payload: { outcome: "COMPLETED", produced_units: 1500000 }
              as: PlantScheduler
          assert:
            - "ProductionJob.${j}.projected_refractory_units_nominal == 990.00"
            - "ProductionJob.${j}.projected_refractory_units_stress_adjusted == 1267.20"
            - "ProductionJob.${j}.refractory_wear_units == 1267.20"
            - "Furnace.${f}.refractory_consumed_units == 1267.20"
            - "Furnace.${f}.refractory_remaining_pct == 98.73"
            - "Furnace.${f}.refractory_remaining_pct != 99.01"
            - "Furnace.${f}.posture == OPERATING"

  - rule_id: combinatorial_formula
    instances:
      - name: changeover_minutes_nested_min_max_over_swap_cavity_and_condition
        grounds:
          - calculations.changeover_minutes
          - entities.FormingMachine.fields.primary_mold_family
          - entities.MoldSet.fields.condition_score
          - state_machines.ProductionJob.SCHEDULED_to_RUNNING
        distinguishing_aspect: |
          Mode (a) nested min/max: the cavity-delta tier and the mold-condition penalty are combined
          with max() and only that winner is added to the family-scaled swap time before min() caps
          the total at 240, so a PRESS_BLOW set on an NNPB machine with cavity delta 2 and condition
          70 yields exactly 115 minutes, not 60 + 15 + 25 = 100 and not 90 + 15 + 25 = 130.
        test_recipe:
          setup:
            - "FormingMachine IS-03 with primary_mold_family NNPB and max_cavities 40"
            - "BottleDesign BD-03 APPROVED with cavity_count 10"
            - "MoldSet MS-03 AVAILABLE with cavity_count 12 (delta 2 => tier 15), mold_family PRESS_BLOW (foreign => swap 90.0), condition_score 70 (=> penalty 25)"
            - "Campaign CMP-03 ACTIVE on a FLINT furnace with an approved FLINT recipe"
            - "ProductionJob PJ-03 SCHEDULED on that machine with that mold set"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "F-03", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Cedar Cider", account_code: "CEDAR-01", palletization_standard: "GMA_1200x1000", complaint_ppm_threshold: 4000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/campaigns"
              payload: { furnace_id: "${f}", code: "CMP-03", target_pull_tpd: 300.00, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z" }
              as: PlantManager
              captures: { cmp: "$.data.id" }
            - call: "POST /glass-plant/campaigns/${cmp}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-F03", color: "FLINT", cullet_ratio_pct: 40.00, soda_ash_kg_per_ton: 170.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
              captures: { br: "$.data.id" }
            - call: "POST /glass-plant/batch-recipes/${br}/approve"
              payload: {}
              as: BatchHouseTech
            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-03", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB", changeover_buffer_minutes: 45 }
              as: PlantManager
              captures: { m: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-03", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 10, target_line_speed_bpm: 500.00, container_price_usd: 0.1600, mold_owner: "PLANT" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /glass-plant/mold-sets"
              payload: { bottle_design_id: "${d}", code: "MS-03", cavity_count: 12, mold_family: "PRESS_BLOW", owner: "PLANT", condition_score: 70 }
              as: MoldEngineer
              captures: { ms: "$.data.id" }
            - call: "GET /glass-plant/furnaces/${f}"
              payload: {}
              as: PlantScheduler
              captures: { fv: "$.data.version" }
            - call: "POST /glass-plant/production-jobs"
              payload: { campaign_id: "${cmp}", furnace_id: "${f}", forming_machine_id: "${m}", batch_recipe_id: "${br}", bottle_design_id: "${d}", mold_set_id: "${ms}", code: "PJ-03", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z", planned_pull_tpd: 300.00, expected_furnace_version: "${fv}" }
              as: PlantScheduler
              captures: { j: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/production-jobs/${j}/start"
              payload: {}
              as: PlantScheduler
          assert:
            - "ProductionJob.${j}.changeover_minutes == 115"
            - "ProductionJob.${j}.status == RUNNING"
            - "MoldSet.${ms}.status == MOUNTED and MoldSet.${ms}.mount_count == 1"
            - "FormingMachine.${m}.mounted_cavities == 12 and FormingMachine.${m}.status == RUNNING"

      - name: complaint_credit_round_per_pallet_then_multiply
        grounds:
          - calculations.complaint_credit_usd
          - entities.Complaint.fields.affected_pallets
          - entities.BottleDesign.fields.container_price_usd
          - state_machines.Complaint.INVESTIGATING_to_CREDIT_ISSUED
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity: 1800 x 0.1725 x 0.5000 x 0.5 = 77.625 must be rounded
          to 77.63 per pallet BEFORE multiplying by 3 affected pallets, giving 232.89; multiplying
          first and rounding once gives 232.88, so the two orders are distinguishable to the cent.
        test_recipe:
          setup:
            - "Customer DELTA-01 with palletization_standard EURO_1200x800 (1800 units/pallet) and complaint_ppm_threshold 5000.00"
            - "BottleDesign BD-04 APPROVED with container_price_usd 0.1725"
            - "PackLot lot RELEASED and SHIPPED with packed_units 2001000, one MINOR reading of 1000 rejects, net_packed_units 2000000"
            - "Complaint CO-01 in INVESTIGATING with attribution PLANT and affected_units 5000 (breakage_ppm 2500.0, severity_share 0.5000, affected_pallets 3)"
            - "Logical clock advanced to 2026-08-06T00:00:00Z so the lot's 3-day aging has elapsed"
          setup_api_calls:
