# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Scenario 956: Kids' Consignment Pop-Up Sale (JBF style)
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_projection_vs_final_actuals
        grounds:
          - calculations.settlement_payout
          - entities.Settlement.fields.provisional_gross_cents
          - entities.Settlement.fields.gross_cents
        distinguishing_aspect: |
          Settlement domain: the provisional variant is forward-looking (adds a
          50% sell-through projection of ON_FLOOR items to actual gross) while the
          final variant counts COMPLETED-transaction actuals only — identical item
          data yields provisional_gross_cents 5000 vs final gross_cents 10000.
        test_recipe:
          setup:
            - "Event in SALE_ACTIVE; consignor Ann has one item (barcode-tagged, price 10000) ON_FLOOR; a DRAFT settlement exists (generated during SALE_ACTIVE); no markdown rules; no passes."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Ann", email: "ann@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Bike", category: GEAR, price_cents: 10000, discount_eligible: true, donate_flag: false }, as: Consignor, as_user_id: "${c_id}", captures: { item_id: $.data.id, bc: $.data.barcode } }
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Insp Ira", email: "ira@x.com" }, as: Anonymous, captures: { v_insp: $.data.id } }
            - { call: "POST /items/${item_id}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_insp}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
            - { call: "GET /sale-events/${ev_id}", payload: {}, as: EventOrganizer, captures: { ev_v1: $.data.version } }
            - { call: "POST /sale-events/${ev_id}/generate-settlements", payload: { expected_sale_event_version: "${ev_v1}" }, as: EventOrganizer, captures: { s1_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /settlements/${s1_id}", payload: {}, as: EventOrganizer }
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "${bc}" }, as: Cashier }
            - { call: "POST /pos-transactions/${tx_id}/checkout", payload: { tendered_cents: 10000 }, as: Cashier }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-07T15:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SETTLEMENT }, as: EventOrganizer }
            - { call: "GET /sale-events/${ev_id}", payload: {}, as: EventOrganizer, captures: { ev_v2: $.data.version } }
            - { call: "POST /sale-events/${ev_id}/generate-settlements", payload: { expected_sale_event_version: "${ev_v2}" }, as: EventOrganizer, captures: { s2_id: "$.data[0].id" } }
            - { call: "POST /settlements/${s2_id}/finalize", payload: {}, as: EventOrganizer }
            - { call: "GET /settlements/${s2_id}", payload: {}, as: EventOrganizer }
          assert:
            - "Before the sale (first GET): Settlement.${s1_id}.provisional_gross_cents == 5000 (0 actual + 50% of 10000 ON_FLOOR projection)"
            - "Settlement.${s1_id}.provisional_payout_cents == 2000 (5000 at 60% => 3000 before fee, minus 1000 supply fee)"
            - "After finalize: Settlement.${s2_id}.gross_cents == 10000 (actuals only, no projection)"
            - "Settlement.${s2_id}.payout_cents == 5000 (10000 - 4000 commission - 1000 fee)"
            - "provisional_gross_cents (5000) != gross_cents (10000) for the same underlying item set"

      - name: volunteer_projected_vs_earned_discount
        grounds:
          - calculations.volunteer_discount_tier
          - entities.Volunteer.fields.projected_discount_pct
          - entities.PresalePass.fields.discount_pct
        distinguishing_aspect: |
          Volunteer-discount domain (different entity domain than Settlement): the
          projected variant counts CHECKED_IN shifts while the earned variant pinned
          on the pass counts COMPLETED only — the same volunteer shows
          projected_discount_pct 15 but an issued pass with discount_pct 10.
        test_recipe:
          setup:
            - "Volunteer Vic has one 4h shift COMPLETED (2026-05-28) and one 4h shift CHECKED_IN but not completed (2026-05-29); event advanced to INTAKE_CLOSED."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Vic", email: "vic@x.com" }, as: Anonymous, captures: { v_id: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Setup", start_time: "2026-05-28T09:00:00Z", end_time: "2026-05-28T13:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { sh1: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Setup", start_time: "2026-05-29T09:00:00Z", end_time: "2026-05-29T13:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { sh2: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${sh1}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { su1: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${sh2}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { su2: $.data.id } }
            - { call: "POST /shift-signups/${su1}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${su1}/check-out", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${su2}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
          trigger:
            - { call: "POST /sale-events/${ev_id}/issue-presale-passes", payload: {}, as: EventOrganizer }
            - { call: "GET /presale-passes", payload: { sale_event_id: "${ev_id}", holder_id: "${v_id}" }, as: EventOrganizer, captures: { pass_pct: "$.data[0].discount_pct" } }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: EventOrganizer }
          assert:
            - "Volunteer.${v_id}.completed_hours == 4.0 and Volunteer.${v_id}.projected_hours == 8.0"
            - "Volunteer.${v_id}.projected_discount_pct == 15 (projected variant: 8h tier)"
            - "PresalePass discount_pct == 10 (earned variant pinned at issuance: 4h tier)"
            - "projected_discount_pct (15) != pass discount_pct (10) for the same signup data"

  - rule_id: combinatorial_formula
    instances:
      - name: split_tier_bonus_cap_interaction
        grounds:
          - calculations.consignor_split_percentage
          - calculations.settlement_payout
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: gross tier (60000 ->
          70), linked-volunteer bonus (+5 for >=4 completed hours), and the nested
          min cap produce split_pct = min(75, 70+5) = 75; removing any one input
          changes the result.
        test_recipe:
          setup:
            - "Consignor Bea has a linked volunteer with 4.0 completed hours; Bea's single item (price 60000) is SOLD in a COMPLETED transaction; settlement generated and finalized in SETTLEMENT phase."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Bea", email: "bea@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Bea Vol", email: "beav@x.com", linked_consignor_id: "${c_id}" }, as: Anonymous, captures: { v_link: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Setup", start_time: "2026-05-28T09:00:00Z", end_time: "2026-05-28T13:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { sh1: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${sh1}", volunteer_id: "${v_link}" }, as: Volunteer, as_user_id: "${v_link}", captures: { su1: $.data.id } }
            - { call: "POST /shift-signups/${su1}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${su1}/check-out", payload: {}, as: EventOrganizer }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Stroller", category: GEAR, price_cents: 60000 }, as: Consignor, as_user_id: "${c_id}", captures: { item_id: $.data.id, bc: $.data.barcode } }
            - { call: "POST /items/${item_id}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Insp Ida", email: "ida@x.com" }, as: Anonymous, captures: { v_insp: $.data.id } }
            - { call: "POST /items/${item_id}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_insp}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "${bc}" }, as: Cashier }
            - { call: "POST /pos-transactions/${tx_id}/checkout", payload: { tendered_cents: 60000 }, as: Cashier }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-07T15:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SETTLEMENT }, as: EventOrganizer }
            - { call: "GET /sale-events/${ev_id}", payload: {}, as: EventOrganizer, captures: { ev_v: $.data.version } }
            - { call: "POST /sale-events/${ev_id}/generate-settlements", payload: { expected_sale_event_version: "${ev_v}" }, as: EventOrganizer, captures: { s_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /settlements/${s_id}/finalize", payload: {}, as: EventOrganizer }
          assert:
            - "Settlement.${s_id}.gross_cents == 60000"
            - "Settlement.${s_id}.split_pct == 75 (tier 70 + volunteer bonus 5, nested min caps at 75)"
            - "Settlement.${s_id}.commission_cents == 15000"
            - "Settlement.${s_id}.payout_before_fee_cents == 45000"
            - "Settlement.${s_id}.supply_fee_cents == 0 (waived: payout_before_fee 45000 >= 30000, and bonus condition holds)"
            - "Settlement.${s_id}.payout_cents == 45000"

      - name: per_line_rounding_then_sum
        grounds:
          - calculations.transaction_totals
          - calculations.markdown_price_at_scan
          - entities.TransactionLine.fields.final_line_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: per-line round_half_up then sum
          yields total 802 (2 x 401); the forbidden sum-then-round order yields 803.
          Tag 525, markdown 15% (line 446), pass 10% (final 401 per line).
        test_recipe:
          setup:
            - "Event in SALE_ACTIVE; markdown rule 15% covering 2026-06-05..2026-06-08; volunteer with 4.0 completed hours holds a 10% pass; consignor has two items at 525 cents each ON_FLOOR."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_OPEN }, as: EventOrganizer }
            - { call: "POST /consignors", payload: { sale_event_id: "${ev_id}", full_name: "Cyd", email: "cyd@x.com" }, as: Anonymous, captures: { c_id: $.data.id } }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Vera", email: "vera@x.com" }, as: Anonymous, captures: { v_id: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { sale_event_id: "${ev_id}", role_name: "Setup", start_time: "2026-05-28T09:00:00Z", end_time: "2026-05-28T13:00:00Z", capacity: 5 }, as: EventOrganizer, captures: { sh1: $.data.id } }
            - { call: "POST /shift-signups", payload: { shift_id: "${sh1}", volunteer_id: "${v_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { su1: $.data.id } }
            - { call: "POST /shift-signups/${su1}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /shift-signups/${su1}/check-out", payload: {}, as: EventOrganizer }
            - { call: "POST /drop-off-slots", payload: { sale_event_id: "${ev_id}", start_time: "2026-06-02T10:00:00Z", end_time: "2026-06-02T12:00:00Z", capacity: 2 }, as: EventOrganizer, captures: { slot_id: $.data.id } }
            - { call: "POST /drop-off-bookings", payload: { slot_id: "${slot_id}", consignor_id: "${c_id}" }, as: Consignor, as_user_id: "${c_id}", captures: { bk_id: $.data.id } }
            - { call: "POST /drop-off-bookings/${bk_id}/check-in", payload: {}, as: EventOrganizer }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Blocks A", category: TOYS, price_cents: 525 }, as: Consignor, as_user_id: "${c_id}", captures: { it1: $.data.id, bc1: $.data.barcode } }
            - { call: "POST /items", payload: { consignor_id: "${c_id}", title: "Blocks B", category: TOYS, price_cents: 525 }, as: Consignor, as_user_id: "${c_id}", captures: { it2: $.data.id, bc2: $.data.barcode } }
            - { call: "POST /items/${it1}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /items/${it2}/drop-off", payload: {}, as: Consignor, as_user_id: "${c_id}" }
            - { call: "POST /volunteers", payload: { sale_event_id: "${ev_id}", full_name: "Insp Ike", email: "ike@x.com" }, as: Anonymous, captures: { v_insp: $.data.id } }
            - { call: "POST /items/${it1}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_insp}" }
            - { call: "POST /items/${it2}/inspect", payload: { outcome: PASS }, as: Inspector, as_user_id: "${v_insp}" }
            - { call: "POST /markdown-rules", payload: { sale_event_id: "${ev_id}", effective_from: "2026-06-05T00:00:00Z", effective_to: "2026-06-08T00:00:00Z", discount_pct: 15 }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T18:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: INTAKE_CLOSED }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/issue-presale-passes", payload: {}, as: EventOrganizer }
            - { call: "GET /presale-passes", payload: { sale_event_id: "${ev_id}", holder_id: "${v_id}" }, as: EventOrganizer, captures: { pass_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-04T17:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: PRESALE_DAY }, as: EventOrganizer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T09:00:00Z" }, as: EventOrganizer }
            - { call: "POST /sale-events/${ev_id}/advance-phase", payload: { to_phase: SALE_ACTIVE }, as: EventOrganizer }
          trigger:
            - { call: "POST /pos-transactions", payload: { sale_event_id: "${ev_id}", presale_pass_id: "${pass_id}" }, as: Cashier, captures: { tx_id: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "${bc1}" }, as: Cashier, captures: { ln1: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/lines", payload: { barcode: "${bc2}" }, as: Cashier, captures: { ln2: $.data.id } }
            - { call: "POST /pos-transactions/${tx_id}/checkout", payload: { tendered_cents: 900 }, as: Cashier }
            - { call: "GET /pos-transactions/${tx_id}", payload: {}, as: Cashier }
          assert:
            - "TransactionLine.${ln1}.line_price_cents == 446 and final_line_cents == 401"
            - "TransactionLine.${ln2}.line_price_cents == 446 and final_line_cents == 401"
            - "POSTransaction.${tx_id}.subtotal_cents == 892"
            - "POSTransaction.${tx_id}.discount_cents == 90"
            - "POSTransaction.${tx_id}.total_cents == 802 (per-line rounding; sum-then-round would give 803)"
            - "POSTransaction.${tx_id}.change_cents == 98"

      - name: fee_waiver_evaluation_order
        grounds:
          - calculations.settlement_payout
          - entities.Settlement.fields.supply_fee_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: the
          fee waiver reads payout_before_fee_cents (pre-fee, 30550 >= 30000 ->
          waived), never the post-fee payout; fee-first evaluation would compute
          29550 < 30000 and wrongly charge 1000.
        test_recipe:
          setup:
            - "Consignor Dee (no linked volunteer) has one item at 47000 cents SOLD; settlement DRAFT exists in SETTLEMENT phase."
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
