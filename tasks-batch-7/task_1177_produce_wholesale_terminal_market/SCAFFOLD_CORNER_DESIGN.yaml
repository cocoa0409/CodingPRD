            - { call: "POST /market/purchase-lots/${lot}/receive", payload: {}, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US2", defect_pct: 25, result: "FAIL" }, as: USDAInspector, captures: { i1: "$.data.id" } }
            - { call: "POST /market/inspections/${i1}/certify", payload: {}, as: USDAInspector }
            - { call: "POST /market/purchase-lots/${lot}/dispute", payload: { reason: "grade below contract" }, as: Receiver }
            - { call: "POST /market/inspections", payload: { purchase_lot_id: "${lot}", inspected_grade: "US1", defect_pct: 8, result: "PASS" }, as: USDAInspector, captures: { i2: "$.data.id" } }
            - { call: "POST /market/purchase-lots/${lot}/dispute", payload: { reason: "second opinion contested" }, as: Receiver }
          trigger:
            - { call: "POST /market/purchase-lots/${lot}/resolve-dispute", payload: { outcome: "REJECT_TO_SHIPPER" }, as: MarketAdmin, captures: { st: "$.data.status", pay: "$.data.payable_cents" } }
            - { call: "GET /market/purchase-lots/${lot}/inspections", payload: {}, as: USDAInspector, captures: { i1_st: "$.data[0].status", i2_st: "$.data[1].status" } }
          assert:
            - "lot.status == REJECTED and lot.payable_cents == 0"
            - "I1 (CERTIFIED) stays CERTIFIED; I2 (was SUBMITTED) is now VOIDED — the auto-void side effect fired"
            - "a REJECTED lot has zero SUBMITTED inspections"

