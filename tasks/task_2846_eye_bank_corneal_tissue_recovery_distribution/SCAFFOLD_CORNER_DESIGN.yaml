              payload: { donor_id: "${donor_id}", technician_id: "${rt_id}", dispatched_at: "2026-08-03T06:30:00.000Z", planned_release_at: "2026-08-03T10:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rec_id: $.data.id }
            - call: "POST /eye-bank/recoveries/${rec_id}/arrive"
              payload: { arrival_at: "2026-08-03T07:00:00.000Z" }
              as: RecoveryTechnician
              as_user_id: "${rt_id}"
            - call: "POST /eye-bank/recoveries/${rec_id}/complete"
              payload: { preservation_at: "2026-08-03T09:00:00.000Z", preservation_medium: "OPTISOL_GS", recovered_lateralities: ["OD"] }
              as: RecoveryTechnician
              as_user_id: "${rt_id}"
              captures: { band: $.data.time_limit_band }
            - call: "GET /eye-bank/tissues"
              payload: { recovery_id: "${rec_id}" }
              as: EyeBankCoordinator
              captures: { t_id: "$.data[0].id", t_v: "$.data[0].version", prov_exp: "$.data[0].expires_at" }
            - call: "POST /eye-bank/tissues/${t_id}/evaluations"
              payload: { evaluator_technician_id: "${et_id}", method: "SLIT_LAMP", performed_at: "2026-08-03T09:30:00.000Z", epithelium_defect_grade: 0, stromal_clarity_grade: 0, dm_folds_grade: 0, expected_tissue_version: "${t_v}" }
              as: EvaluationTechnician
              as_user_id: "${et_id}"
              captures: { t_v2: $.data.tissue_version_after }
            - call: "POST /eye-bank/tissues/${t_id}/evaluations"
              payload: { evaluator_technician_id: "${et_id}", method: "SPECULAR", performed_at: "2026-08-03T09:45:00.000Z", guttata_grade: 0, endothelial_cell_count: 4000, expected_tissue_version: "${t_v2}" }
              as: EvaluationTechnician
              as_user_id: "${et_id}"
              captures: { t_v3: $.data.tissue_version_after }
          trigger:
            - call: "POST /eye-bank/tissues/${t_id}/classify"
              payload: {}
              as: MedicalDirector
              captures: { q: $.data.tissue_quality_score, cls: $.data.classification, disp: $.data.disposition_status, shelf: $.data.shelf_life_hours, variant: $.data.shelf_life_variant, exp: $.data.expires_at }
          assert:
            - "${band} == \"WITHIN_STANDARD\" and ${prov_exp} == \"2026-08-17T09:00:00.000Z\""
            - "${q} == 100 (raw 105 clamped; ECD points capped at 40 rather than 44)"
            - "${cls} == \"TRANSPLANT_OPTICAL\" and ${disp} == \"ELIGIBLE\""
            - "${shelf} == 336 and ${variant} == \"FINAL_AT_CLASSIFICATION\""
            - "${exp} == \"2026-08-17T09:00:00.000Z\" (no cooling or ECD penalty applies, so the final value equals the provisional one)"

      - name: shelf_life_variant_divergence_between_provisional_and_final
        claim_type: variant_divergence
        grounds:
          - calculations.tissue_shelf_life.variants
          - entities.CorneaTissue.fields.shelf_life_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / tissue_shelf_life_provisional_vs_final_expiry
          rationale: "The named §1.8 instance runs both variants on the same tissue and asserts the exact hour delta (cooling 72 h + ECD 24 h) and the earlier expires_at after classification."

      - name: screening_risk_variant_divergence_on_unknown_answers
        claim_type: variant_selection
        grounds:
          - calculations.donor_screening_risk_score.variants
          - entities.Donor.fields.screening_risk_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / donor_screening_risk_interview_vs_post_serology_reconciled
          rationale: "The named §1.8 instance holds the ScreeningRecord rows fixed and flips only the reconciliation predicate, asserting both scores and the delta."

      - name: allocation_fee_rounding_does_not_accumulate_drift
        claim_type: rounding_accumulation
        grounds:
          - calculations.allocation_processing_fee
          - calculations.allocation_processing_fee.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / allocation_fee_rounds_each_surcharge_before_summing
          rationale: "The named §1.8 instance asserts the per-component round-half-up total 277464 against the forbidden sum-then-round 277463 on the same inputs."

      - name: priority_tier_boundaries_are_read_from_the_base_score
        claim_type: tier_boundary
        grounds:
          - calculations.request_priority_score
          - entities.SurgeonRequest.fields.priority_tier
        excluded_because:
          difficulty_instance: combinatorial_formula / request_priority_tier_derived_from_base_score_only
          rationale: "The named §1.8 instance walks the PLATINUM/GOLD/STANDARD boundaries and proves the tier ignores the tier bonus itself."

  - section: validations
    instances:

      - name: donor_list_with_limit_one_hundred_and_one_yields_err_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations.priority_7
          - "errors[ERR_INVALID_PAGINATION]"
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The pagination guard is a real range check, not a silent clamp: limit 101 on
          GET /eye-bank/donors returns 400 ERR_INVALID_PAGINATION instead of quietly serving 100
          rows, and limit 100 on the same data succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z; one donor exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-V01", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
          trigger:
            - call: "GET /eye-bank/donors"
              payload: { limit: 101, offset: 0 }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /eye-bank/donors"
              payload: { limit: 100, offset: 0 }
              as: EyeBankCoordinator
              captures: { ok_count: $.meta.total_count }
          assert:
            - "HTTP 400 on limit 101"
            - "${err} == \"ERR_INVALID_PAGINATION\""
            - "HTTP 200 on limit 100 with ${ok_count} == 1 (the upper bound itself is legal)"

      - name: reusing_a_donor_code_yields_err_duplicate_donor_code
        claim_type: violation_to_error
        grounds:
          - validations.priority_44
          - "errors[ERR_DUPLICATE_DONOR_CODE]"
          - entities.Donor.fields.donor_code
        distinguishing_aspect: |
          donor_code uniqueness is global, not scoped to referral_source or death date: a second
          POST reusing D-2846-V02 with an entirely different body returns 409
          ERR_DUPLICATE_DONOR_CODE and creates no second row.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z; one donor with donor_code D-2846-V02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-V02", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-V02", referral_source: "MEDICAL_EXAMINER", death_at: "2026-08-03T01:00:00.000Z", death_time_basis: "PRONOUNCED", age_years: 68, cause_of_death_category: "TRAUMA" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /eye-bank/donors"
              payload: {}
              as: EyeBankCoordinator
              captures: { total: $.meta.total_count }
          assert:
            - "HTTP 409"
            - "${err} == \"ERR_DUPLICATE_DONOR_CODE\""
            - "${total} == 1 (only ${first_id} exists)"

      - name: answering_the_same_screening_question_twice_yields_err_duplicate_screening_answer
        claim_type: violation_to_error
        grounds:
          - validations.priority_45
          - "errors[ERR_DUPLICATE_SCREENING_ANSWER]"
          - entities.ScreeningRecord.fields.question_code
        distinguishing_aspect: |
          Uniqueness is on the (donor_id, question_code) pair only — changing the response from NO
          to YES or the historian from SPOUSE to SIBLING does not make it a new answer, so the
          second POST is 409 and the donor's risk score stays at the first answer's value.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor with a single ScreeningRecord for TATTOO_12M / NO (weight 0, risk 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-V03", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "NO", historian_relationship: "SPOUSE" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "YES", historian_relationship: "SIBLING" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /eye-bank/donors/${donor_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { risk: $.data.screening_risk_score, v: $.data.version }
            - call: "GET /eye-bank/donors/${donor_id}/screening-records"
              payload: {}
              as: EyeBankCoordinator
              captures: { rows: $.meta.total_count }
          assert:
            - "HTTP 409"
            - "${err} == \"ERR_DUPLICATE_SCREENING_ANSWER\""
            - "${risk} == 0 and ${v} == 2 (the rejected write neither re-scored nor bumped the donor)"
            - "${rows} == 1"

      - name: a_donor_whose_death_at_is_after_now_yields_err_death_time_in_future
        claim_type: violation_to_error
        grounds:
          - validations.priority_30
          - "errors[ERR_DEATH_TIME_IN_FUTURE]"
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: |
          The check is against the LOGICAL clock, not wall time: with the clock pinned at
          2026-08-03T06:00:00.000Z a death_at of 2026-08-03T08:00:00.000Z is refused 422
          ERR_DEATH_TIME_IN_FUTURE even though that instant is in the real-world past.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z; empty donor table"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { now: $.data.current_utc }
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-V04", referral_source: "HOSPITAL", death_at: "2026-08-03T08:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${now} == \"2026-08-03T06:00:00.000Z\""
            - "HTTP 422"
            - "${err} == \"ERR_DEATH_TIME_IN_FUTURE\""

      - name: a_death_at_exactly_equal_to_now_is_accepted_and_earns_the_full_cooling_credit
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_30
          - calculations.donor_recovery_window
          - entities.Donor.fields.recovery_deadline_at
        distinguishing_aspect: |
          The satisfaction side of the same rule at its exact boundary: death_at == now passes
          because the check is `<=`, and the simultaneous body_cooled_at gives a cooling delay of
          0 minutes, which sits inside the <= 240 band for the full 240-minute credit, so the
          window is 960 and the deadline is 2026-08-03T18:00:00.000Z.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-V05", referral_source: "HOSPITAL", death_at: "2026-08-03T06:00:00.000Z", death_time_basis: "ASYSTOLE", body_cooled_at: "2026-08-03T06:00:00.000Z", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { st: $.data.status, win: $.data.recovery_window_minutes, deadline: $.data.recovery_deadline_at }
          assert:
            - "HTTP 201"
            - "${st} == \"REFERRED\""
            - "${win} == 960 (720 + 240, delay 0 is inside the fast band)"
            - "${deadline} == \"2026-08-03T18:00:00.000Z\""

      - name: rewinding_the_logical_clock_yields_err_clock_rewind_forbidden_while_a_reset_to_now_passes
        claim_type: violation_to_error
        grounds:
          - validations.priority_49
          - "errors[ERR_CLOCK_REWIND_FORBIDDEN]"
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: |
          The monotonicity guard is `>=`, so it distinguishes two instants one millisecond apart:
          05:59:59.999 is refused 422 ERR_CLOCK_REWIND_FORBIDDEN, while re-setting the clock to
          exactly the current 06:00:00.000 is accepted and leaves the clock untouched.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-03T06:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:59:59.999Z" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { same: $.data.current_utc }
          assert:
            - "HTTP 422 on the rewind"
            - "${err} == \"ERR_CLOCK_REWIND_FORBIDDEN\""
            - "HTTP 200 on the equal-instant set with ${same} == \"2026-08-03T06:00:00.000Z\""

      - name: a_surgeon_request_whose_surgery_date_equals_now_yields_err_surgery_date_in_past
        claim_type: violation_to_error
        grounds:
          - validations.priority_33
          - "errors[ERR_SURGERY_DATE_IN_PAST]"
          - "endpoints[POST /eye-bank/surgeon-requests]"
        distinguishing_aspect: |
          The rule is strict (`surgery_date > now`), so the exact-equality case fails: a request
          dated 2026-08-03T06:00:00.000Z against a clock of 2026-08-03T06:00:00.000Z returns 422
          ERR_SURGERY_DATE_IN_PAST, and one millisecond later is accepted with priority_score
          computed for a same-day proximity bucket.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z; one ACTIVE surgeon"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/surgeons"
              payload: { full_name: "Dr Imani Rho", center_code: "CTR-01", specialty: "CORNEA" }
              as: EyeBankCoordinator
              captures: { sg_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/surgeon-requests"
              payload: { surgeon_id: "${sg_id}", procedure_type: "PK", surgery_date: "2026-08-03T06:00:00.000Z", min_ecd: 2000, max_donor_age_years: 70, laterality_preference: "ANY", urgency: "ROUTINE" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /eye-bank/surgeon-requests"
              payload: { surgeon_id: "${sg_id}", procedure_type: "PK", surgery_date: "2026-08-03T06:00:00.001Z", min_ecd: 2000, max_donor_age_years: 70, laterality_preference: "ANY", urgency: "ROUTINE" }
              as: EyeBankCoordinator
              captures: { req_id: $.data.id, st: $.data.status, base: $.data.base_score }
          assert:
            - "HTTP 422 on the equal-instant request"
            - "${err} == \"ERR_SURGERY_DATE_IN_PAST\""
            - "HTTP 201 one millisecond later: ${st} == \"OPEN\" and ${base} == 50 (ROUTINE 10 + same-day proximity 40)"
            - "${req_id} is the only SurgeonRequest row"

      - name: quarantined_lookback_tissue_reports_the_state_error_not_the_lookback_error
        claim_type: priority_ordering
        grounds:
          - validations.priority_14
          - validations.priority_24
          - "errors[ERR_TISSUE_NOT_ELIGIBLE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / allocation_of_quarantined_lookback_tissue_returns_409_state_error
          rationale: "The named §1.8 instance violates both rules with one call and asserts the lower-priority ERR_TISSUE_NOT_ELIGIBLE wins over ERR_DONOR_UNDER_LOOKBACK."

      - name: suspended_surgeon_with_short_shelf_life_reports_the_credentialing_error
        claim_type: priority_ordering
        grounds:
          - validations.priority_25
          - validations.priority_35
          - "errors[ERR_SURGEON_NOT_CREDENTIALED]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / allocation_for_suspended_surgeon_with_short_shelf_life_returns_422_credentialing
          rationale: "The named §1.8 instance violates the credentialing rule and the expiry-before-surgery rule simultaneously and asserts the priority-25 error is returned."

  - section: endpoints
    instances:

      - name: surgeon_create_read_and_nested_request_listing_are_ordered_by_priority_score
        claim_type: standard_crud
        grounds:
          - "endpoints[POST /eye-bank/surgeons]"
          - "endpoints[GET /eye-bank/surgeons/{id}]"
          - "endpoints[GET /eye-bank/surgeons/{id}/requests]"
          - calculations.request_priority_score
        distinguishing_aspect: |
          The Surgeon CRUD triple plus its nested collection: creation defaults credential_status
          ACTIVE with all three money ledgers at 0, the read echoes them, and the nested request
          list is sorted by priority_score DESC (85 for the URGENT 2026-08-05 request, 35 for the
          ROUTINE 2026-08-08 one) — not by created_at, which is the reverse of the insertion order.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one surgeon with two OPEN requests created ROUTINE-first then URGENT-second"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/surgeons"
              payload: { full_name: "Dr Imani Rho", center_code: "CTR-01", specialty: "CORNEA" }
              as: EyeBankCoordinator
              captures: { sg_id: $.data.id, cred: $.data.credential_status, gross: $.data.gross_billed_cents, credited: $.data.credited_fee_cents, outstanding: $.data.outstanding_fee_cents, v: $.data.version }
            - call: "GET /eye-bank/surgeons/${sg_id}"
              payload: {}
              as: MedicalDirector
              captures: { r_name: $.data.full_name, r_center: $.data.center_code, r_spec: $.data.specialty, r_cred: $.data.credential_status, r_v: $.data.version }
            - call: "POST /eye-bank/surgeon-requests"
              payload: { surgeon_id: "${sg_id}", procedure_type: "PK", surgery_date: "2026-08-08T00:00:00.000Z", min_ecd: 2000, max_donor_age_years: 70, laterality_preference: "ANY", urgency: "ROUTINE" }
              as: EyeBankCoordinator
              captures: { routine_id: $.data.id, routine_base: $.data.base_score, routine_tier: $.data.priority_tier, routine_score: $.data.priority_score }
            - call: "POST /eye-bank/surgeon-requests"
              payload: { surgeon_id: "${sg_id}", procedure_type: "DMEK", surgery_date: "2026-08-05T00:00:00.000Z", min_ecd: 2000, max_donor_age_years: 70, laterality_preference: "OD", urgency: "URGENT" }
              as: EyeBankCoordinator
              captures: { urgent_id: $.data.id, urgent_base: $.data.base_score, urgent_tier: $.data.priority_tier, urgent_score: $.data.priority_score }
            - call: "GET /eye-bank/surgeons/${sg_id}/requests"
              payload: {}
              as: Surgeon
              as_user_id: "${sg_id}"
              captures: { first_id: "$.data[0].id", first_score: "$.data[0].priority_score", second_id: "$.data[1].id", second_score: "$.data[1].priority_score" }
          assert:
            - "HTTP 201 on create; ${cred} == \"ACTIVE\" and ${gross} == 0 and ${credited} == 0 and ${outstanding} == 0 and ${v} == 1"
            - "${r_name} == \"Dr Imani Rho\" and ${r_center} == \"CTR-01\" and ${r_spec} == \"CORNEA\" and ${r_cred} == \"ACTIVE\" and ${r_v} == 1"
            - "${routine_base} == 35 and ${routine_tier} == \"STANDARD\" and ${routine_score} == 35"
            - "${urgent_base} == 70 and ${urgent_tier} == \"PLATINUM\" and ${urgent_score} == 85"
            - "${first_id} == ${urgent_id} and ${first_score} == 85"
            - "${second_id} == ${routine_id} and ${second_score} == 35"

      - name: deactivating_a_technician_makes_the_next_dispatch_fail_with_not_certified
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /eye-bank/technicians/{id}/status]"
          - validations.priority_27
          - "errors[ERR_TECHNICIAN_NOT_CERTIFIED]"
          - entities.Technician.fields.open_dispatch_count
        distinguishing_aspect: |
          The status action is a real gate, not a label: after status -> INACTIVE (Technician
          version 1 -> 2) the same dispatch payload that would otherwise be accepted returns 422
          ERR_TECHNICIAN_NOT_CERTIFIED, no Recovery row is created and open_dispatch_count stays 0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one RECOVERY_ONLY technician switched to INACTIVE; one donor in APPROVED_FOR_RECOVERY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Rosa Field", certification_level: "RECOVERY_ONLY", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rt_id: $.data.id, tech_st0: $.data.status, tech_v0: $.data.version }
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-E02", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", body_cooled_at: "2026-08-03T03:00:00.000Z", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
