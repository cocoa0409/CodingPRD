      - name: rfp_response_at_response_deadline_instant_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=84]
          - errors[ERR_RFP_EXPIRED]
          - state_machines.RequestForPayment.DELIVERED_to_ACCEPTED
          - global_constants.RFP_RESPONSE_SLA_MINUTES
        distinguishing_aspect: "The response obligation closes at min(expiry_at, delivered_at + 30 minutes) and the comparison is >=, so a response landing exactly on that instant is late. Choosing expiry_at 13:20 makes the expiry the binding half of the min(), and the request is still DELIVERED because no sweep has run - proving the refusal comes from the temporal rule and not from a state change."
        test_recipe:
          setup:
            - "Alpha National Bank (021000021) is LIVE with customer account CUST-ALPHA-0001 (ACTIVE, baseline 20); Beta Trust Bank (021000089) is LIVE."
            - "At 13:00 Beta requests 5,000,000 cents from CUST-ALPHA-0001 with expiry_at 2026-08-03T13:20:00Z and the request is delivered immediately, so response_deadline_at = min(13:20, 13:30) = 13:20."
            - "The clock is then moved to exactly 2026-08-03T13:20:00Z without running a network sweep, so the request is still DELIVERED."
