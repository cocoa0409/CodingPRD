              as: Mechanic
              as_user_id: "${mr}"
          trigger:
            - call: "POST /api/work-orders/${wor}/return-to-service"
              payload: {}
              as: Mechanic
              as_user_id: "${mr}"
            - call: "GET /api/work-orders/${wor}/invoice"
              payload: {}
              as: ShopManager
          assert:
            - "Invoice.parts_charge_cents == 15006 (10005 + 1 + 5000, per-line rounding then sum)"
            - "Invoice.shop_supplies_cents == round_half_up(15006 * 0.05) == 750 (since 15006 < 50000, low tier)"
            - "Had the scaffold pinned sum-then-round on a fractional-cent example, the result would differ; the pinned per-line order is the only correct one"

  - rule_id: non_linear_state_machine
    instances:
      - name: discrepancy_rectified_open_cycle
        grounds:
          - state_machines.Discrepancy.RECTIFIED_to_OPEN
          - state_machines.Discrepancy.RECTIFIED_to_VERIFIED
        distinguishing_aspect: |
          Discrepancy state machine is CYCLIC: RECTIFIED -> OPEN on failed
