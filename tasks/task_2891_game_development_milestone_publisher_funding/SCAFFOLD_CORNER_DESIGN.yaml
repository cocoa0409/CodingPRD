  - section: endpoints
    instances:
      - name: corner_publisher_user_registry_create_read_and_paginated_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/publisher-users
          - endpoints.GET_/publisher-users/{id}
          - endpoints.GET_/publisher-users
          - entities.PublisherUser
        distinguishing_aspect: "The registry surface is create-read-list ONLY: §1.5 declares no PUT, PATCH or DELETE anywhere in the API, so a PublisherUser is structurally immutable once created. The list must honour the §1.0 pagination envelope (limit / offset / total_count / has_more) and GET /publisher-users must refuse the Developer role, which is the one GET in §1.5 that is not open to all four roles."
        test_recipe:
          setup:
            - "Publisher Vantage Publishing exists with three PublisherUsers: one REVIEW, one FINANCE, one DUAL."
            - "Studio Northlight exists so that a Developer actor id is available for the role check."
          setup_api_calls:
            - call: "POST /studios"
              payload: { legal_name: "Northlight Studio", contact_email: "dev@northlight.example", country_code: "SE" }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Vantage Publishing", contact_email: "ops@vantage.example", country_code: "US" }
              as: PlatformAdmin
              captures: { publisher_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Rae Reviewer", function: "REVIEW" }
              as: PlatformAdmin
              captures: { reviewer_id: $.data.id }
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Fen Finance", function: "FINANCE" }
              as: PlatformAdmin
              captures: { finance_id: $.data.id }
          trigger:
            - call: "POST /publisher-users"
              payload: { publisher_id: "${publisher_id}", display_name: "Dov Dual", function: "DUAL" }
              as: PlatformAdmin
              captures: { dual_id: $.data.id }
            - call: "GET /publisher-users/${dual_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "${finance_id}"
            - call: "GET /publisher-users"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /publisher-users"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /publisher-users/${dual_id}"
              payload: {}
              as: Developer
              as_user_id: "${studio_id}"
              captures: { developer_denied_error_id: "$.data.error_id" }
          assert:
            - "trigger call 1 -> HTTP 201 with data.function == DUAL, data.publisher_id == ${publisher_id}, data.version == 1, data.id / created_at / updated_at present and system-generated"
            - "trigger call 2 -> HTTP 200 and data equal field-for-field to the creation response (no mutation surface exists to change it)"
            - "trigger call 3 -> HTTP 200 with response_type array, exactly 2 rows, meta/data total_count == 3 and has_more == true"
            - "trigger call 4 -> HTTP 200 with exactly 1 row and has_more == false; the three ids across calls 3 and 4 are exactly {${reviewer_id}, ${finance_id}, ${dual_id}} with no duplicate"
            - "trigger call 5 -> HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED (Developer is excluded from the publisher-user registry reads)"
            - "no PUT, PATCH or DELETE route exists for any entity in §1.5; a PATCH /publisher-users/${dual_id} attempt is not part of the contract and must not be implemented"

      - name: corner_action_endpoint_change_order_decision
        claim_type: action_endpoint
