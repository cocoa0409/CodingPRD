      - name: member_suspension_gate_precedes_the_authority_gate_and_needs_a_fresh_analysis
        grounds:
          - validations.priority_18
          - validations.priority_30
          - errors.ERR_MEMBER_NOT_ACTIVE
          - errors.ERR_PIGGYBACK_NOT_AUTHORIZED
          - state_machines.MemberAgency.registration_status.ACTIVE_to_SUSPENDED
          - state_machines.MemberAgency.registration_status.SUSPENDED_to_ACTIVE
          - state_machines.PiggybackAnalysis.status.DETERMINED_to_VOIDED
          - concurrency_rules.piggyback-analysis-create-stale-member
        distinguishing_aspect: |
          Usage validity hangs on two different entities' states at once. Suspending the MEMBER voids its
          DETERMINED analysis with voided_reason MEMBER_SUSPENDED, so the same usage body yields three
          different answers in sequence: ERR_MEMBER_NOT_ACTIVE while suspended, then
          ERR_PIGGYBACK_NOT_AUTHORIZED after reinstatement (because reinstatement deliberately does NOT
          revive the voided opinion), then success only after a brand-new analysis is minted and
          determined. An implementation that revives voided analyses on REINSTATE, or that checks the
          authority before the member state, diverges on one of the three.
