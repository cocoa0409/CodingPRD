  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- Instance 1: state (P8) vs business_safety (P10) on design accept ---
      - name: conflict_state_vs_variant_mismatch_on_accept
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - state_machines.DesignLayout.DRAFT_to_ACCEPTED
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): a single accept call on an
          already-ACCEPTED design that ALSO selected a non-PET turf for a PET variant must
          return the higher-priority state error ERR_INVALID_STATE (P8), not the
          business_safety ERR_VARIANT_PRODUCT_MISMATCH (P10), because state precedes safety.
        test_recipe:
          setup:
            - "A PET design (d1) created with a turf that IS pet_approved, accepted successfully; a second accept of d1 is attempted while it is already ACCEPTED. d1's selected turf would also fail the variant check if it were re-evaluated, but state ordering wins."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ivy I", email: "ivy@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-PET", name: "Pet Turf", pile_height_mm: 30, price_per_sqft_cents: 600, roll_width_ft: 15, pet_approved: true }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
