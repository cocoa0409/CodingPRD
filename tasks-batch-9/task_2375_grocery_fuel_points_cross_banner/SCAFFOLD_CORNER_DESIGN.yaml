              captures: { cl9_id: $.data.id }
            - &cx_link2_activate
              call: "POST /household-links/${cl9_id}/activate"
              payload: {}
              as: LoyaltyAnalyst
            - *cx_basket
            - *cx_post
            - &cx_transfer
              call: "POST /point-transfers"
              payload: { member_id: "${cm_id}", recipient_member_id: "${cm9_id}", points: 100 }
