          CYCLIC machine on GenericApplication (contrasts with the parallel
          dimensions on Supplement in the sibling instance): an amendment to a
          tentatively approved application loops the application back to
          RECEIVED with a fresh review cycle, and the loop can close again to
          TENTATIVE_APPROVAL or APPROVED.
