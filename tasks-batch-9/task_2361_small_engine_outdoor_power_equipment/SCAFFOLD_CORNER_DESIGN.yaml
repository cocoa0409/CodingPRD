      - name: supersession_chain_walks_forward_and_rejects_self_reference
        claim_type: topological
        grounds:
          - calculations.supersession_chain_resolution
          - validations[priority=48]
          - validations[priority=29]
          - errors[ERR_SUPERSESSION_CYCLE]
        distinguishing_aspect: |
          Supersession forms a strict forward DAG: a part may only be superseded ONTO an
          ACTIVE successor, which is why the five-hop chain must be built from the head
          outward and why any attempt to close a loop surfaces as ERR_PART_STATE_INVALID at
          priority 29 (the target is already SUPERSEDED) — the only reachable
          ERR_SUPERSESSION_CYCLE is the degenerate self-reference, and it is checked before
          any substitution work happens.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
            - "Six ACTIVE service parts P1..P6, each holding 0 pieces so no substitution work interferes."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-P1", category: "CARBURETOR_KIT", on_hand_qty: 0, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-P2", category: "CARBURETOR_KIT", on_hand_qty: 0, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-P3", category: "CARBURETOR_KIT", on_hand_qty: 0, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-P4", category: "CARBURETOR_KIT", on_hand_qty: 0, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-P5", category: "CARBURETOR_KIT", on_hand_qty: 0, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { p5_id: $.data.id }
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-P6", category: "CARBURETOR_KIT", on_hand_qty: 0, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { p6_id: $.data.id }
            - call: "POST /service-parts/${p1_id}/supersede"
              payload: { successor_part_id: "${p1_id}" }
              as: PlantAdmin
            - call: "POST /service-parts/${p1_id}/supersede"
              payload: { successor_part_id: "${p2_id}" }
              as: PlantAdmin
            - call: "POST /service-parts/${p2_id}/supersede"
              payload: { successor_part_id: "${p3_id}" }
              as: PlantAdmin
            - call: "POST /service-parts/${p3_id}/supersede"
              payload: { successor_part_id: "${p4_id}" }
              as: PlantAdmin
            - call: "POST /service-parts/${p4_id}/supersede"
              payload: { successor_part_id: "${p5_id}" }
              as: PlantAdmin
            - call: "POST /service-parts/${p5_id}/supersede"
              payload: { successor_part_id: "${p6_id}" }
              as: PlantAdmin
            - call: "POST /service-parts/${p6_id}/supersede"
              payload: { successor_part_id: "${p1_id}" }
              as: PlantAdmin
            - call: "GET /service-parts?superseded_by_part_id=${p6_id}"
              payload: { superseded_by_part_id: "${p6_id}", limit: 10, offset: 0 }
              as: PlantAdmin
          assert:
            - "the self-supersede P1 -> P1 -> 409 ERR_SUPERSESSION_CYCLE, and ServicePart.${p1_id}.status stays ACTIVE with superseded_by_part_id == null"
            - "the five forward hops all succeed: P1..P5 end SUPERSEDED with superseded_by_part_id pointing at the next part, and ${p6_id} remains ACTIVE as the chain tail"
            - "the loop-closing attempt P6 -> P1 -> 409 ERR_PART_STATE_INVALID (priority 29: the successor is SUPERSEDED), NOT ERR_SUPERSESSION_CYCLE — priority 29 outranks priority 48"
            - "ServicePart.${p6_id}.status stays ACTIVE and superseded_by_part_id == null after the rejected loop"
            - "GET /service-parts?superseded_by_part_id=${p6_id} returns total_count == 1 (only ${p5_id}) — the pointer is a single hop, not a transitive closure"
            - "every superseded part reports fill_rate_pct == null: no request ever existed, so the recomputation divides nothing"

      - name: platform_posture_projection_follows_every_family_status
        claim_type: projection
        grounds:
          - calculations.platform_certification_posture
          - entities.EnginePlatform.fields.certification_posture
          - state_machines[CertificationFamily]
        distinguishing_aspect: |
          Posture is never written by a client and never stored independently — it is a pure
          projection of the owning family's status, re-derived inside the same request that
          moves the family. One walk exercises four of the five projection arms
          (PENDING, RESTRICTED for three distinct family states, OPEN) and shows the platform
          row's own version staying put while its posture changes.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS in DRAFT with platform 208SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - call: "GET /engine-platforms/${plat_id}"
              payload: {}
              as: PlantAdmin
              captures: { posture_v0: $.data.version }
            - *a_dur
            - call: "GET /engine-platforms/${plat_id}"
              payload: {}
              as: PlantAdmin
            - *a_dur_complete
            - call: "GET /engine-platforms/${plat_id}"
              payload: {}
              as: PlantAdmin
            - *a_submit
            - call: "GET /engine-platforms/${plat_id}"
              payload: {}
              as: PlantAdmin
            - *a_certify
            - call: "GET /engine-platforms/${plat_id}"
              payload: {}
              as: PlantAdmin
          assert:
            - "with the family DRAFT the platform reads certification_posture == PENDING"
            - "after POST /durability-tests the family is DURABILITY_TESTING and the posture reads RESTRICTED"
            - "after complete the family is DURABILITY_COMPLETE and the posture is still RESTRICTED"
            - "after submit the family is SUBMITTED and the posture is still RESTRICTED — three distinct family states project onto one posture value"
            - "after certify the family is CERTIFIED and the same read returns OPEN in the certify response itself (consistency_model immediate)"
            - "EnginePlatform.${plat_id}.version == ${posture_v0} at the end — no projection step wrote the platform row"

      - name: audit_sample_and_progress_count_only_settled_units
        claim_type: input_set_filtering
        grounds:
          - calculations.audit_outcome_evaluation
          - calculations.build_order_progress
          - entities.ProductionLineAudit.fields.required_sample_size
        distinguishing_aspect: |
          required_sample_size is derived from built_quantity — RELEASED units only — so
          STAGED and CANCELLED siblings are invisible to it, and the MIN_AUDIT_SAMPLE floor of
          2 dominates the 2% fraction at this scale. The same filtering governs
          build_order_progress: a cancelled unit leaves both counters, it does not linger in
          staged_quantity.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude with order ${bo_id} (planned 6) RELEASED."
          setup_api_calls: *prelude_order
          trigger:
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - *a_u2_stage
            - *a_u3_stage
            - call: "POST /engine-units/${u3_id}/cancel"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
            - *a_audit_schedule
            - call: "GET /engine-units?build_order_id=${bo_id}&build_state=STAGED"
              payload: { build_order_id: "${bo_id}", build_state: "STAGED", limit: 10, offset: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "BuildOrder.${bo_id}: built_quantity == 1 (only the RELEASED unit), staged_quantity == 1 (the CANCELLED unit is excluded from both counters)"
            - "ProductionLineAudit.${audit_id}.required_sample_size == 2 == max(MIN_AUDIT_SAMPLE 2, ceil(1 * 0.02)) — the floor dominates, and the 2 STAGED/CANCELLED units did not raise it"
            - "the filtered unit listing returns total_count == 1 and only ${u2_id}"
            - "ComponentLot.${lot_carb_id}: consumed_qty == 2 and remaining_qty == 798 — the cancelled unit refunded its pieces while the released and staged units keep theirs"
            - "recording units_tested == 2 on this audit would answer 422 ERR_AUDIT_SAMPLE_EXCEEDS_POPULATION because built_quantity is 1, even though 2 units physically exist"

      - name: deterioration_variant_divergence_covered_by_difficulty_design
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: deterioration_factor_multiplicative_vs_additive_diverge
          rationale: |
            deterioration_factor_and_certified_emission is the scaffold's headline
            dual-variant calculation, and the §1.8 instance runs the identical
            baseline/initial/final triple through both arms (MULTIPLICATIVE 1.2800 -> 5.12 ->
            36.00 margin versus ADDITIVE 1.4000 -> 5.40 -> 32.50) and asserts the delta, which
            is precisely the variant-divergence claim.

      - name: supplier_ppm_variant_selection_covered_by_difficulty_design
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: supplier_ppm_pooled_vs_per_lot_average_diverge
          rationale: |
            supplier_defect_ppm is selected by context rather than by payload: the POOLED
            variant is what inspect stores on the supplier, while the PER_LOT_AVERAGE variant
            is what GET /suppliers/{id}/scorecard reports. The §1.8 instance builds the
            unequal-sample lot pair (40 sampled clean, then 10 sampled with 2 defects) where
            the two variants read 40000 and 100000 ppm respectively and shows each surface
            returning its own variant.

      - name: extrapolation_reconciliation_covered_by_difficulty_design
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: deterioration_extrapolation_scaling_diverges_per_variant
          rationale: |
            The only place a variant's result is re-derived on different terms is the
            short-run extrapolation (a run completed at 250 of 500 target hours scales the
            raw factor before it becomes the certified basis). The §1.8 instance walks that
            re-derivation under both variants and asserts the resulting margins (22.00 versus
            15.00), covering the delta-on-switch claim; no entity in this scaffold ever
            switches variant mid-life, so there is no ledger delta to reconcile beyond it.

  # ===========================================================================
  # 4. From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: emission_limit_outranks_compliance_margin_in_the_same_category
        claim_type: priority_conflict
        grounds:
          - validations[priority=36]
          - validations[priority=37]
          - errors[ERR_CERTIFIED_EMISSION_EXCEEDS_LIMIT]
          - errors[ERR_COMPLIANCE_MARGIN_TOO_LOW]
        distinguishing_aspect: |
          Both business_safety rules are violated by the same certify call — the certified
          value exceeds the family limit AND the margin is far below the 5.00 floor (it is
          negative) — and the earlier priority wins. Because the two rules share a category
          and differ by exactly one priority step, an implementation that evaluates the
          margin first cannot be rescued by category ordering.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z and an empty database."
            - "Family 2027-EPA-OVER (limit 8.00, baseline 4.00) runs a durability test from 5.00 to 11.00 g/kWh, giving df 2.2000 and certified 8.80."
          setup_api_calls:
            - *a_clock
            - call: "POST /certification-families"
              payload: { family_code: "2027-EPA-OVER", model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_over_id: $.data.id, fam_over_v1: $.data.version }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_over_id}", platform_code: "208OVER", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_over_id: $.data.id }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_over_id}", engine_platform_id: "${plat_over_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_over_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_over_id: $.data.id }
            - call: "POST /durability-tests/${dur_over_id}/complete"
              payload: { accumulated_hours: 500, final_emission_g_per_kwh: 11.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /certification-families/${fam_over_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
          trigger:
            - call: "POST /certification-families/${fam_over_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
          assert:
            - "-> 422 ERR_CERTIFIED_EMISSION_EXCEEDS_LIMIT (priority 36), NOT ERR_COMPLIANCE_MARGIN_TOO_LOW (priority 37)"
            - "the projected values that the rules read are df 2.2000 and certified 8.80 with a margin of -10.00, so both rules are genuinely violated"
            - "CertificationFamily.${fam_over_id}.status stays SUBMITTED with certified_emission_g_per_kwh and compliance_margin_pct left unwritten (null)"
            - "EnginePlatform.${plat_over_id}.certification_posture stays RESTRICTED, so no build order on it could be released"

      - name: auth_role_shape_and_existence_run_in_that_order_missing_auth
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: |
          The first four priorities are probed with requests that violate several at once, so
          each answer proves an ordering rather than a single rule: no headers plus a broken
          body answers 401 (not 400), a forbidden role plus a broken body answers 403 (not
          400), and a broken body plus a dead foreign key answers 400 (not 404). Only when
          the body is well formed does the 404 surface.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; one real family 2027-EPA-208SS exists in DRAFT so that a genuine version number is available for the OCC field, but the id used below points nowhere."
          setup_api_calls:
            - *a_clock
            - *a_fam
          trigger:
            # sent with NO X-User-Role / X-User-ID headers; `as:` records the identity the caller would have used
            - call: "POST /certification-families"
              payload: { model_year: 9999 }
              as: CertificationEngineer
            - call: "POST /certification-families"
              payload: { model_year: 9999 }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "POST /durability-tests"
              payload: { certification_family_id: "11111111-1111-1111-1111-111111111111", engine_platform_id: "22222222-2222-2222-2222-222222222222", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /durability-tests"
              payload: { certification_family_id: "11111111-1111-1111-1111-111111111111", engine_platform_id: "22222222-2222-2222-2222-222222222222", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
          assert:
            - "headerless call -> 401 ERR_UNAUTHENTICATED even though the body also violates priority 3"
            - "ChannelPartner on a CertificationEngineer-only endpoint -> 403 ERR_FORBIDDEN_ROLE, not 400 — the role check precedes the schema check"
            - "the durability call missing target_hours -> 400 ERR_INVALID_REQUEST, not 404 — the schema check precedes existence, and not 412 either"
            - "the same call with target_hours present -> 404 ERR_CERTIFICATION_FAMILY_NOT_FOUND (priority 4 beats the platform check at priority 5 and the OCC check at priority 17)"
            - "no DurabilityTestRun row exists at the end (GET /durability-tests reports total_count == 0) and the pre-existing family is untouched at version ${fam_v1}"

      - name: safety_and_channel_rules_apply_only_to_matching_configurations
        claim_type: conditional_validation
        grounds:
          - validations[priority=32]
          - validations[priority=33]
          - validations[priority=47]
          - errors[ERR_SAFETY_CONTROL_REQUIRED]
        distinguishing_aspect: |
          The control-coherence rule is a family of conditional clauses keyed on
          product_line and channel, and each clause has to be checked against its own
          configuration: a GENERATOR must have blade_brake NONE and a NULL blade stop time,
          a WALK_MOWER must have BAIL presence control, a DUAL/DEALER model needs 36 months
          of warranty while MASS_RETAIL needs only 24, and the dealer share must match the
          channel exactly. The same payload is legal for one product line and illegal for
          another.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "GEN-BADBRAKE", product_line: "GENERATOR", channel: "MASS_RETAIL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "CO_SHUTOFF", warranty_months: 24, standard_cost_cents: 30000, msrp_cents: 79900, dealer_share_pct: 0.00, dealer_cap_units: 0, mass_retail_cap_units: 500 }
              as: PlantAdmin
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "GEN-OK", product_line: "GENERATOR", channel: "MASS_RETAIL", blade_brake_type: "NONE", operator_presence_type: "CO_SHUTOFF", warranty_months: 24, standard_cost_cents: 30000, msrp_cents: 79900, dealer_share_pct: 0.00, dealer_cap_units: 0, mass_retail_cap_units: 500 }
              as: PlantAdmin
              captures: { model_gen_id: $.data.id }
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_gen_id}", standard_code: "UL_2201", blade_stop_time_ms: 2600, opc_stop_time_ms: 900, tested_on: "2026-07-15", expires_on: "2027-07-15" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_gen_id}", standard_code: "ANSI_B71_1", opc_stop_time_ms: 900, tested_on: "2026-07-15", expires_on: "2027-07-15" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_gen_id}", standard_code: "UL_2201", opc_stop_time_ms: 900, tested_on: "2026-07-15", expires_on: "2027-07-15" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { cert_gen_id: $.data.id }
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "WM-SEAT", product_line: "WALK_MOWER", channel: "DUAL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "SEAT_SWITCH", warranty_months: 36, standard_cost_cents: 21000, msrp_cents: 59900, dealer_share_pct: 0.55, dealer_cap_units: 500, mass_retail_cap_units: 500 }
              as: PlantAdmin
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "WM-SHORTWARRANTY", product_line: "WALK_MOWER", channel: "DUAL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "BAIL", warranty_months: 24, standard_cost_cents: 21000, msrp_cents: 59900, dealer_share_pct: 0.55, dealer_cap_units: 500, mass_retail_cap_units: 500 }
              as: PlantAdmin
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "WM-BADSHARE", product_line: "WALK_MOWER", channel: "DUAL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "BAIL", warranty_months: 36, standard_cost_cents: 21000, msrp_cents: 59900, dealer_share_pct: 1.00, dealer_cap_units: 500, mass_retail_cap_units: 500 }
              as: PlantAdmin
          assert:
            - "GEN-BADBRAKE -> 422 ERR_SAFETY_CONTROL_REQUIRED (a GENERATOR must carry blade_brake_type NONE)"
            - "GEN-OK is accepted at warranty_months 24 because its channel is MASS_RETAIL — the same 24 months on a DUAL model is refused below"
            - "the GENERATOR certification carrying blade_stop_time_ms -> 422 ERR_SAFETY_CONTROL_REQUIRED (it must be null for a GENERATOR)"
            - "the GENERATOR certification with standard_code ANSI_B71_1 -> 422 ERR_SAFETY_STANDARD_MISMATCH (priority 32 fires before priority 33)"
            - "SafetyCertification.${cert_gen_id}.result == PASSED with blade_stop_time_ms == null — a null blade stop is legal, not a failure"
            - "WM-SEAT -> 422 ERR_SAFETY_CONTROL_REQUIRED (WALK_MOWER demands BAIL); WM-SHORTWARRANTY -> 422 ERR_SAFETY_CONTROL_REQUIRED (DUAL demands >= 36 months)"
            - "WM-BADSHARE -> 422 ERR_CHANNEL_SHARE_MISMATCH (priority 47: DUAL demands a share strictly between 0.00 and 1.00)"
            - "GET /engine-platforms/${plat_id}/product-models reports total_count == 1 — only GEN-OK survived"

      - name: capability_gate_outcome_gates_the_downstream_staging_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=38]
          - validations[priority=39]
          - calculations.process_capability_cpk
          - errors[ERR_MACHINING_RUN_NOT_CLOSED]
        distinguishing_aspect: |
          Staging a unit cannot be validated until the capability calculation has run: the
          run's status is the OUTPUT of the cpk gate, and priority 39 reads that output. Two
          runs that never reached CLOSED for two different reasons — one whose close was
          refused for an undersized sample (still OPEN) and one that closed into
          CAPABILITY_HOLD at cpk 1.3200 against the CRITICAL gate of 1.33 — both make the
          staging call fail with the same downstream error.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude with order ${bo_id} (planned 6) RELEASED and an accepted CASTING lot (a CRITICAL supplier, so the capability gate is 1.33)."
          setup_api_calls: *prelude_order
          trigger:
            - call: "POST /machining-runs"
              payload: { engine_platform_id: "${plat_id}", casting_lot_id: "${lot_cast_id}", component_type: "CRANK_JOURNAL", lsl_mm: 64.98020, usl_mm: 65.01980 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { mrun_open_id: $.data.id }
            - call: "POST /machining-runs/${mrun_open_id}/close"
              payload: { measurements: [65.000, 65.002, 64.998, 65.004] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_open_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0031" }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /machining-runs"
              payload: { engine_platform_id: "${plat_id}", casting_lot_id: "${lot_cast_id}", component_type: "CRANK_JOURNAL", lsl_mm: 64.98020, usl_mm: 65.01980 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { mrun_hold_id: $.data.id }
            - call: "POST /machining-runs/${mrun_hold_id}/close"
              payload: { measurements: [65.0050, 64.9950, 65.0050, 64.9950, 65.0000] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_hold_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0032" }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "the four-measurement close -> 422 ERR_CAPABILITY_SAMPLE_INSUFFICIENT (priority 38) and MachiningRun.${mrun_open_id}.status stays OPEN with cpk == null"
            - "staging SN-0031 against that OPEN run -> 409 ERR_MACHINING_RUN_NOT_CLOSED (priority 39)"
            - "the five-measurement close computes mean 65.00000, sigma 0.005000 and cpk 1.3200, which is below the CRITICAL gate 1.33, so MachiningRun.${mrun_hold_id}.status == CAPABILITY_HOLD"
            - "staging SN-0032 against the CAPABILITY_HOLD run -> 409 ERR_MACHINING_RUN_NOT_CLOSED as well — only CLOSED feeds the line"
            - "BuildOrder.${bo_id}.staged_quantity == 0 and status == RELEASED: neither rejected staging moved the order out of RELEASED"
            - "ComponentLot.${lot_carb_id}.consumed_qty == 0 — a rejected staging charges nothing"

      - name: season_window_is_violated_from_both_sides
        claim_type: violation_error
        grounds:
          - validations[priority=52]
          - errors[ERR_SEASON_WINDOW_MISMATCH]
          - calculations.build_carry_cost.constants
        distinguishing_aspect: |
          SEASON_START[WALK_MOWER] (2027-03-01) splits the calendar with a strict/inclusive
          pair, so the rule is violated from both directions and the boundary week itself is
          only legal on the IN_SEASON side: PRE_SEASON at exactly 2027-03-01 is refused,
          IN_SEASON one week earlier is refused, and IN_SEASON at exactly 2027-03-01 is
          accepted with carry_weeks 0.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude with the released WALK_MOWER model WM-21-BBC and line L1."
          setup_api_calls: *prelude_certified
          trigger:
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2027-03-01", week_span: 1, planned_quantity: 2 }
              as: ProductionPlanner
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "IN_SEASON", production_week: "2027-02-22", week_span: 1, planned_quantity: 2 }
              as: ProductionPlanner
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "IN_SEASON", production_week: "2027-03-01", week_span: 1, planned_quantity: 2 }
              as: ProductionPlanner
              captures: { bo_season_id: $.data.id }
          assert:
            - "PRE_SEASON at 2027-03-01 -> 422 ERR_SEASON_WINDOW_MISMATCH (PRE_SEASON demands production_week < SEASON_START)"
            - "IN_SEASON at 2027-02-22 -> 422 ERR_SEASON_WINDOW_MISMATCH (IN_SEASON demands production_week >= SEASON_START)"
            - "IN_SEASON at 2027-03-01 is accepted: BuildOrder.${bo_season_id}.carry_weeks == 0, carry_cost_cents == 0, total_committed_cents == 42000"
            - "GET /build-orders?assembly_line_id=${line_id} reports total_count == 1 — the two refused orders left no rows"

      - name: lot_code_uniqueness_is_scoped_per_supplier
        claim_type: satisfaction_pass
        grounds:
          - validations[priority=16]
          - errors[ERR_DUPLICATE_CODE]
          - entities.ComponentLot.fields.lot_code
        distinguishing_aspect: |
          Priority 16 mixes two scopes in one rule, and the passing case is the interesting
          one: lot_code is unique only WITHIN a supplier, so re-using CB-001 under a
          different supplier must succeed, while every other code in the rule
          (supplier_code, serial_number, part_number) is globally unique and its duplicate
          must fail.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude with order ${bo_id} RELEASED, lot CB-001 under SUP-CARB and lot IG-001 under SUP-IGN."
          setup_api_calls: *prelude_order
          trigger:
            - *a_u1_stage
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_ign_id}", lot_code: "CB-001", lot_quantity: 300 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_reuse_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-001", lot_quantity: 300 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-CARB", name: "Carburetion Partners Duplicate", component_category: "CARBURETOR" }
              as: PlantAdmin
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0001" }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "CB-001 under SUP-IGN is accepted: ComponentLot.${lot_reuse_id}.lot_code == CB-001 with a different supplier_id"
            - "CB-001 again under SUP-CARB -> 409 ERR_DUPLICATE_CODE"
            - "supplier_code SUP-CARB again -> 409 ERR_DUPLICATE_CODE (global scope)"
            - "serial_number SN-0001 again -> 409 ERR_DUPLICATE_CODE, and it is refused before the quantity rule at priority 60 could ever matter"
            - "BuildOrder.${bo_id}.staged_quantity == 1 and GET /component-lots reports total_count == 4 (CB-001, IG-001, CS-001 and the re-used CB-001)"

      - name: line_capacity_aggregate_covered_by_difficulty_design
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: assembly_line_week_capacity_inclusive_week_sets
          rationale: |
            Weekly line capacity is the scaffold's only aggregate rule: each order is
            individually legal but the per-week sum of ceil(planned_quantity / week_span)
            across PLANNED/RELEASED/IN_PRODUCTION orders must fit weekly_capacity_units. The
            §1.8 instance sits exactly on the boundary (1000 units over 2 weeks == 500 == the
            cap, then a 2-unit order in a shared week tips it to 502) which is the
            aggregate-validation claim in full.

      - name: durability_window_temporal_validation_covered_by_difficulty_design
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: platform_durability_windows_half_open_instants
          rationale: |
            The forward-looking temporal rule is the half-open durability window on a
            platform: an operation that is legal today creates a future conflict for the next
            scheduler. The §1.8 instance covers the shared-instant adjacency that must be
            allowed and the one-hour straddle that must raise
            ERR_PLATFORM_TEST_WINDOW_OVERLAP.

      - name: lot_state_cross_entity_validation_covered_by_difficulty_design
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: engine_unit_hot_test_gated_by_component_lot_state
          rationale: |
            Whether a unit may proceed depends on the state of entities it merely references
            (its carburetor, ignition and casting lots, and their suppliers). The §1.8
            cross-entity instance drives one referenced lot through RECEIVED, REJECTED,
            QUARANTINED and DEVIATION_ACCEPTED and shows the unit action flipping between
            success and ERR_COMPONENT_LOT_NOT_RELEASABLE.

      - name: remaining_priority_pairs_covered_by_difficulty_design
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: expired_safety_certification_outranks_uncertified_platform
          rationale: |
            Three further cross-category pairs are already designed in §1.8 and would only be
            duplicated here: expired_safety_certification_outranks_uncertified_platform
            (35 before 43), completed_order_state_outranks_quantity_quota (25 before 60),
            rejected_lot_safety_outranks_quantity_quota (40 before 60) and
            changeover_conflict_outranks_line_capacity (51 before 59). The pair kept in §1.9
            above (36 before 37) is the only SAME-category pair, which none of the §1.8
            instances covers.

  # ===========================================================================
  # 5. From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: service_part_crud_surface_is_create_read_list_only
        claim_type: standard_crud
        grounds:
          - endpoints[POST /service-parts]
          - endpoints[GET /service-parts/{id}]
          - endpoints[GET /service-parts]
          - response_envelope.success
        distinguishing_aspect: |
          This API exposes no PATCH, PUT or DELETE on any resource: the CRUD surface is
          create + read + list, and every mutation after creation goes through a named action
          endpoint. One walk shows the three shapes and their envelopes — a 201 object, a
          200 object and a 200 array with the four pagination fields — and shows the list
          filter composing with the platform scope.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - *a_part1
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-IGN-COIL-1", category: "IGNITION_COIL", on_hand_qty: 3, committed_availability_years: 8, last_production_year: 2027 }
              as: PlantAdmin
              captures: { part_coil_id: $.data.id }
            - call: "GET /service-parts/${part1_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /service-parts?engine_platform_id=${plat_id}&category=IGNITION_COIL&limit=10&offset=0"
              payload: { engine_platform_id: "${plat_id}", category: "IGNITION_COIL", limit: 10, offset: 0 }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /service-parts?status=ACTIVE&limit=1&offset=1"
              payload: { status: "ACTIVE", limit: 1, offset: 1 }
              as: PlantAdmin
          assert:
            - "both creates answer 201 with response_type == object and meta.api_request_id / meta.api_request_timestamp present"
            - "the read answers 200 with response_type == object and every stored field, including the computed commitment_expires_year 2037 and 2035"
            - "the category-filtered list answers 200 with response_type == array, total_count == 1, has_more == false and only ${part_coil_id}"
            - "the paged list answers limit == 1, offset == 1, total_count == 2, has_more == false and exactly 1 row — offset 1 is the last page of two"
            - "§1.5 declares no update or delete route for ServicePart: status changes only through POST /service-parts/{id}/supersede and POST /service-parts/{id}/obsolete"

      - name: allocation_reset_action_clears_the_split_and_reopens_the_pool
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /build-orders/{id}/allocations/reset]
          - endpoints[POST /build-orders/{id}/allocations/run]
          - entities.BuildOrder.fields.allocation_status
          - entities.BuildOrder.fields.allocation_run_at
        distinguishing_aspect: |
          The reset action is the only way back from an allocated split, and it is a true
          inverse: it clears both channel counters, returns every built unit to
          unallocated_units, clears allocation_run_at and bumps the order's version — after
          which a fresh run reproduces the identical split. Reset carries no OCC field, so it
          cannot be blocked by a stale read.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude through the CLOSED machining run."
          setup_api_calls: *prelude_certified
          trigger:
            - *a_bo1
            - *a_bo1_release
            - *a_solo_stage
            - *a_solo_torque
            - *a_solo_hot
            - *a_solo_release
            - *a_bo1_version_read
            - call: "POST /build-orders/${bo1_id}/allocations/run"
              payload: { expected_build_order_version: "${bo1_v_now}" }
              as: ProductionPlanner
            - call: "POST /build-orders/${bo1_id}/allocations/reset"
              payload: {}
              as: ProductionPlanner
            - call: "GET /build-orders/${bo1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { bo1_v_after_reset: $.data.version }
            - call: "POST /build-orders/${bo1_id}/allocations/run"
              payload: { expected_build_order_version: "${bo1_v_after_reset}" }
              as: ProductionPlanner
          assert:
            - "after the first run: allocated_dealer_units == 1, allocated_mass_retail_units == 0, unallocated_units == 0, allocation_run_at == 2026-08-03T08:00:00Z"
            - "after the reset: allocated_dealer_units == 0, allocated_mass_retail_units == 0, unallocated_units == 1 (the whole built pool) and allocation_run_at == null"
            - "the reset bumps the order version, so ${bo1_v_after_reset} != ${bo1_v_now}"
            - "the second run reproduces 1 / 0 / 0 — the pool itself was never consumed, only the split"
            - "BuildOrder.${bo1_id}.status stays COMPLETED across run, reset and re-run, and built_quantity stays 1"

      - name: unit_creation_links_four_entities_and_validates_each_link
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /engine-units]
          - validations[priority=44]
          - validations[priority=45]
          - endpoints[GET /engine-units]
        distinguishing_aspect: |
          A single POST creates four associations at once, and each one is validated on its
          own axis rather than by mere existence: the machining run must belong to the same
          platform as the unit's model (ERR_PLATFORM_MISMATCH), and each lot id must resolve
          to a lot of the matching component category (ERR_COMPONENT_CATEGORY_MISMATCH), so
          swapping the carburetor and ignition ids is caught even though both ids are valid
          lots.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude with order ${bo_id} RELEASED."
            - "A second platform 210SS under the same family carries its own CLOSED machining run."
          setup_api_calls: *prelude_order
          trigger:
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "210SS", displacement_cc: 210, torque_spec_nm: 23.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat2_id: $.data.id }
            - call: "POST /machining-runs"
              payload: { engine_platform_id: "${plat2_id}", casting_lot_id: "${lot_cast_id}", component_type: "CYLINDER_BORE", lsl_mm: 64.980, usl_mm: 65.020 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { mrun2_id: $.data.id }
            - call: "POST /machining-runs/${mrun2_id}/close"
              payload: { measurements: [65.000, 65.002, 64.998, 65.004, 64.996] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun2_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0041" }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_ign_id}", ignition_lot_id: "${lot_carb_id}", serial_number: "SN-0042" }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - *a_u1_stage
            - call: "GET /engine-units?machining_run_id=${mrun_id}&limit=10&offset=0"
              payload: { machining_run_id: "${mrun_id}", limit: 10, offset: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /engine-units?carburetor_lot_id=${lot_carb_id}&limit=10&offset=0"
              payload: { carburetor_lot_id: "${lot_carb_id}", limit: 10, offset: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /machining-runs?engine_platform_id=${plat2_id}&status=CLOSED&limit=10&offset=0"
              payload: { engine_platform_id: "${plat2_id}", status: "CLOSED", limit: 10, offset: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "GET /machining-runs?engine_platform_id=${plat2_id}&status=CLOSED reports total_count == 1 (${mrun2_id}) — the 210SS run exists and is capable, it is simply on the wrong platform"
            - "SN-0041 -> 409 ERR_PLATFORM_MISMATCH: the run belongs to 210SS while the order's model sits on 208SS, even though the run is CLOSED and capable"
            - "SN-0042 -> 422 ERR_COMPONENT_CATEGORY_MISMATCH: an IGNITION lot cannot be the carburetor_lot_id (both ids exist and are ACCEPTED)"
            - "SN-0001 is created and links all four: build_order_id, machining_run_id, carburetor_lot_id and ignition_lot_id are all echoed"
            - "GET /engine-units?machining_run_id=${mrun_id} returns total_count == 1 and GET /engine-units?carburetor_lot_id=${lot_carb_id} returns total_count == 1 — the two rejected calls created no association"
            - "ComponentLot.${lot_ign_id}.consumed_qty == 1 — charged once by the accepted unit only"

      - name: part_obsoletion_is_allowed_only_after_the_commitment_and_backorders_clear
        claim_type: conditional_action
        grounds:
          - validations[priority=53]
          - validations[priority=58]
          - validations[priority=29]
          - endpoints[POST /service-parts/{id}/obsolete]
        distinguishing_aspect: |
          Obsoletion is gated by two independent conditions that unlock at different times,
          and the parts-availability commitment is a STRICT year comparison: at the
          commitment's final year (2037) the action is still refused, only 2038 opens it.
          Even then an open backorder blocks the part it belongs to while a sibling part with
          no backorders obsoletes in the same instant — and an OBSOLETE part refuses new
          requests.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
            - "Part PN-OBS-A (1 on hand, 10 committed years from last production 2027 -> commitment_expires_year 2037) and part PN-OBS-B (0 on hand, same commitment)."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-OBS-A", category: "CARBURETOR_KIT", on_hand_qty: 1, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { obs_a_id: $.data.id }
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-OBS-B", category: "FILTER_KIT", on_hand_qty: 0, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { obs_b_id: $.data.id }
          trigger:
            - call: "POST /service-parts/${obs_a_id}/obsolete"
              payload: {}
              as: PlantAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2037-12-31T23:00:00Z" }
              as: PlantAdmin
            - call: "POST /service-parts/${obs_a_id}/obsolete"
              payload: {}
              as: PlantAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2038-01-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /parts-requests"
              payload: { service_part_id: "${obs_a_id}", requested_quantity: 4, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
              captures: { obs_req_id: $.data.id }
            - call: "POST /service-parts/${obs_a_id}/obsolete"
              payload: {}
              as: PlantAdmin
            - call: "POST /service-parts/${obs_b_id}/obsolete"
              payload: {}
              as: PlantAdmin
            - call: "POST /parts-requests"
              payload: { service_part_id: "${obs_b_id}", requested_quantity: 1, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
          assert:
            - "at clock year 2026 -> 409 ERR_AVAILABILITY_COMMITMENT_ACTIVE (2026 is not > 2037)"
            - "at 2037-12-31 -> 409 ERR_AVAILABILITY_COMMITMENT_ACTIVE — the final committed year is still protected, the comparison is strictly greater"
            - "PartsFulfillmentRequest.${obs_req_id}.status == BACKORDERED (4 requested, 1 on hand) with promised_ship_date == 2038-01-26"
            - "at 2038-01-05 with that backorder open -> 409 ERR_OPEN_BACKORDERS_EXIST (priority 58, after the commitment rule at 53 has been satisfied)"
            - "the sibling PN-OBS-B obsoletes successfully in the same clock instant: ServicePart.${obs_b_id}.status == OBSOLETE"
            - "a new request against the OBSOLETE ${obs_b_id} -> 409 ERR_PART_STATE_INVALID, and ServicePart.${obs_a_id}.status is still ACTIVE"

      - name: supplier_scorecard_computed_read_exposes_criticality_and_streak
        claim_type: computed_read
        grounds:
          - endpoints[GET /suppliers/{id}/scorecard]
          - calculations.lot_sample_plan
          - entities.Supplier.fields.criticality
          - entities.Supplier.fields.incoming_inspection_level
        distinguishing_aspect: |
          The scorecard is a pure projection with no stored row of its own, and it is the
          only place where a CASTING supplier's CRITICAL criticality becomes visible together
          with the plan it forces: acceptance_number 0 regardless of sample size, so a single
          defect in a critical lot rejects it while the same defect count in a standard lot
          of the same size is accepted.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; SUP-CAST (CASTING, therefore CRITICAL) and SUP-CARB (CARBURETOR, STANDARD), each with one 800-piece lot at NORMAL inspection."
          setup_api_calls:
            - *a_clock
            - *a_sup_cast
            - *a_sup_carb
          trigger:
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_cast_id}", lot_code: "CS-010", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_cast10_id: $.data.id }
            - call: "POST /component-lots/${lot_cast10_id}/inspect"
              payload: { defects_found: 1 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-010", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_carb10_id: $.data.id }
            - call: "POST /component-lots/${lot_carb10_id}/inspect"
              payload: { defects_found: 1 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /suppliers/${sup_cast_id}/scorecard"
              payload: {}
              as: ProductionPlanner
            - call: "GET /suppliers/${sup_carb_id}/scorecard"
              payload: {}
              as: ProductionPlanner
          assert:
            - "both lots are sampled 40 pieces (NORMAL, 5% of 800), but ComponentLot.${lot_cast10_id}.acceptance_number == 0 while ComponentLot.${lot_carb10_id}.acceptance_number == 4"
            - "ComponentLot.${lot_cast10_id}.status == REJECTED on a single defect; ComponentLot.${lot_carb10_id}.status == ACCEPTED on the same single defect"
            - "the CASTING scorecard returns criticality == CRITICAL, inspected_lot_count == 1, rolling_defect_ppm == 25000, scorecard_average_ppm == 25000, consecutive_accepted_lots == 0"
            - "25000 ppm does NOT trip probation: the threshold comparison is strict, so approval_status == APPROVED and incoming_inspection_level == NORMAL"
            - "the CARBURETOR scorecard returns criticality == STANDARD, consecutive_accepted_lots == 1, rolling_defect_ppm == 25000 and approval_status == APPROVED"
            - "both scorecard reads echo supplier_id and are side-effect free — a second read returns identical numbers"

      - name: supersession_bulk_substitution_covered_by_difficulty_design
        claim_type: bulk_action
        excluded_because:
          difficulty_instance: supersede_backorder_substitution_fill_rate_cascade
          rationale: |
            The only endpoint that processes a set of rows in one call is
            POST /service-parts/{id}/supersede, which walks the superseded part's BACKORDERED
            requests in created_at ASC order and substitutes each one that the successor's
            stock covers, skipping (never rolling back) the ones it cannot. The §1.8 instance
            asserts exactly that partial-success semantics plus the recomputation on both
            parts, so a separate bulk-action instance would only restate it.

  # ===========================================================================
  # 6. From Table 6 (Errors) — every catalog id must be triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: torque_reading_count_must_equal_the_platform_fastener_count
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TORQUE_READING_COUNT_MISMATCH]
          - validations[priority=54]
          - entities.EnginePlatform.fields.required_fastener_count
        distinguishing_aspect: |
          The reading count is checked for equality, not for a minimum: three readings and
          five readings are both rejected against a 4-fastener platform, and neither rejected
          call advances the unit or records a torque summary — only the exact count is accepted.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the 208SS prelude with order ${bo_id} RELEASED (platform required_fastener_count == 4)."
          setup_api_calls: *prelude_order
          trigger:
            - *a_u1_stage
            - call: "POST /engine-units/${u1_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units/${u1_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }, { station: 4, torque_nm: 22.2 }, { station: 5, torque_nm: 22.0 }] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - *a_u1_torque
          assert:
            - "3 readings -> 422 ERR_TORQUE_READING_COUNT_MISMATCH"
            - "5 readings -> 422 ERR_TORQUE_READING_COUNT_MISMATCH (too many is as wrong as too few)"
            - "after both rejections EngineUnit.${u1_id}.build_state is still STAGED with torque_readings == null and out_of_spec_fastener_count == null"
            - "the 4-reading call answers 200 with build_state == ASSEMBLED, out_of_spec_fastener_count == 0 and conformance_state == PENDING (all four readings inside the inclusive band [20.90, 23.10])"

      - name: build_order_line_scope_and_line_posture_produce_distinct_errors
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LINE_PRODUCT_LINE_UNSUPPORTED]
          - errors[ERR_ASSEMBLY_LINE_DOWN]
          - validations[priority=49]
          - validations[priority=42]
        distinguishing_aspect: |
          The two line-related refusals fire at different moments and with different statuses:
          an unsupported product line blocks the order at creation time (422), while a DOWN
          line lets the order be planned and only blocks the release (409) — so a planner can
          book work on a stopped line but cannot start it.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS CERTIFIED and WALK_MOWER model WM-21-BBC RELEASED."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
          trigger:
            - call: "POST /assembly-lines"
              payload: { line_code: "L-SNOW", supported_product_lines: ["SNOW_THROWER"], weekly_capacity_units: 500, changeover_gap_weeks: 0, status: "RUNNING" }
              as: PlantAdmin
              captures: { line_snow_id: $.data.id }
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_snow_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 1, planned_quantity: 4 }
              as: ProductionPlanner
            - call: "POST /assembly-lines"
              payload: { line_code: "L-DOWN", supported_product_lines: ["WALK_MOWER"], weekly_capacity_units: 500, changeover_gap_weeks: 0, status: "DOWN" }
              as: PlantAdmin
              captures: { line_down_id: $.data.id }
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_down_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 1, planned_quantity: 4 }
              as: ProductionPlanner
              captures: { bo_down_id: $.data.id }
            - call: "POST /build-orders/${bo_down_id}/release"
              payload: {}
              as: ProductionPlanner
          assert:
            - "the order on L-SNOW -> 422 ERR_LINE_PRODUCT_LINE_UNSUPPORTED (WALK_MOWER is not in [SNOW_THROWER])"
            - "the order on L-DOWN is created: BuildOrder.${bo_down_id}.status == PLANNED with carry_weeks == 24 already computed"
            - "the release of ${bo_down_id} -> 409 ERR_ASSEMBLY_LINE_DOWN and the order stays PLANNED with staged_quantity == 0"
            - "GET /build-orders?assembly_line_id=${line_snow_id} reports total_count == 0"

      - name: model_release_requires_a_currently_passing_safety_certification
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SAFETY_CERTIFICATION_MISSING]
          - validations[priority=34]
          - calculations.safety_certification_evaluation
        distinguishing_aspect: |
          A missing certification and a FAILED certification are the same refusal: the rule
          reads only the latest row by tested_on DESC, created_at DESC and demands
          result == PASSED, so a model with a 3200 ms blade-stop record is exactly as
          unreleasable as a model with no record at all — and a later PASSED test unblocks it
          without deleting the failure.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS CERTIFIED with platform 208SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
          trigger:
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "WM-22-EK", product_line: "WALK_MOWER", channel: "DEALER", blade_brake_type: "ENGINE_KILL", operator_presence_type: "BAIL", warranty_months: 36, standard_cost_cents: 24000, msrp_cents: 69900, dealer_share_pct: 1.00, dealer_cap_units: 400, mass_retail_cap_units: 0 }
              as: PlantAdmin
              captures: { model_ek_id: $.data.id }
            - call: "POST /product-models/${model_ek_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_ek_id}", standard_code: "ANSI_B71_1", blade_stop_time_ms: 3200, opc_stop_time_ms: 900, tested_on: "2026-07-20", expires_on: "2027-07-20" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { cert_fail_id: $.data.id }
            - call: "POST /product-models/${model_ek_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_ek_id}", standard_code: "ANSI_B71_1", blade_stop_time_ms: 2950, opc_stop_time_ms: 1000, tested_on: "2026-07-25", expires_on: "2027-07-25" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { cert_pass_id: $.data.id }
            - call: "POST /product-models/${model_ek_id}/release"
              payload: {}
              as: PlantAdmin
            - call: "GET /product-models/${model_ek_id}/safety-certifications"
              payload: { limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
          assert:
            - "the first release (no certification at all) -> 422 ERR_SAFETY_CERTIFICATION_MISSING and ProductModel.${model_ek_id}.status stays DRAFT"
            - "SafetyCertification.${cert_fail_id}.result == FAILED (3200 ms > the 3000 ms blade-stop ceiling) even though opc_stop_time_ms 900 is fine"
            - "the second release -> 422 ERR_SAFETY_CERTIFICATION_MISSING — a FAILED latest row is treated as no certification"
            - "SafetyCertification.${cert_pass_id}.result == PASSED (2950 ms and exactly 1000 ms are both inclusive passes)"
            - "the third release answers 200 with status == RELEASED; the listing still returns total_count == 2, the failure is retained"

      - name: audit_scheduling_and_recording_gates_are_all_reachable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_AUDIT_ALREADY_OPEN]
          - errors[ERR_AUDIT_SAMPLE_TOO_SMALL]
          - errors[ERR_AUDIT_SAMPLE_EXCEEDS_POPULATION]
          - validations[priority=28]
          - validations[priority=56]
          - validations[priority=57]
        distinguishing_aspect: |
          One order may hold only one SCHEDULED audit, and because required_sample_size is
          frozen at MIN_AUDIT_SAMPLE 2 while the built population is still 1, the audit is
          temporarily unrecordable from both sides: 1 unit tested is too small and 2 units
          tested exceed the population. Building the second unit satisfies both bounds at once
          without re-freezing required_sample_size.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the 208SS prelude with order ${bo_id} RELEASED for 6 units."
          setup_api_calls: *prelude_order
          trigger:
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - *a_audit_schedule
            - call: "POST /build-orders/${bo_id}/line-audits"
              payload: { audit_week: "2026-09-21" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /line-audits/${audit_id}/record"
              payload: { units_tested: 1, units_failed: 0, max_measured_emission_g_per_kwh: 5.60 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /line-audits/${audit_id}/record"
              payload: { units_tested: 2, units_failed: 0, max_measured_emission_g_per_kwh: 5.60 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - *a_u2_stage
            - *a_u2_torque
            - *a_u2_hot
            - *a_u2_release
            - call: "POST /line-audits/${audit_id}/record"
              payload: { units_tested: 2, units_failed: 0, max_measured_emission_g_per_kwh: 5.60 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "GET /build-orders/${bo_id}/line-audits"
              payload: { limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
          assert:
            - "ProductionLineAudit.${audit_id}.required_sample_size == 2 — max(2, ceil(1 * 0.02)) with built_quantity 1 at schedule time"
            - "the second scheduling attempt -> 409 ERR_AUDIT_ALREADY_OPEN even though its audit_week 2026-09-21 differs"
            - "units_tested 1 -> 422 ERR_AUDIT_SAMPLE_TOO_SMALL (1 < 2)"
            - "units_tested 2 against built_quantity 1 -> 422 ERR_AUDIT_SAMPLE_EXCEEDS_POPULATION (57 fires only after 56 is satisfied)"
            - "after SN-0002 is released built_quantity == 2 and the same payload answers 200 with status == PASSED, failure_rate == 0.0000, failure_reason == null"
            - "required_sample_size is still 2 after the second unit — it was frozen at schedule time, not recomputed"
            - "the audit listing reports total_count == 1"

      - name: suspended_supplier_cannot_ship_further_lots
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SUPPLIER_SUSPENDED]
          - validations[priority=31]
          - calculations.supplier_quality_ladder
        distinguishing_aspect: |
          Suspension is reached by arithmetic, not by an admin action: a single 100-piece lot
          with 2 defects in its 8-piece sample is 250000 ppm, past the 100000 ppm suspension
          threshold, and the supplier's very next lot receipt is refused — while the already
          received lot keeps its REJECTED disposition and remains readable.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; supplier SUP-CARB-X (CARBURETOR, STANDARD criticality, NORMAL inspection)."
          setup_api_calls:
            - *a_clock
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-CARB-X", name: "Venturi Imports", component_category: "CARBURETOR" }
              as: PlantAdmin
              captures: { sup_x_id: $.data.id }
          trigger:
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_x_id}", lot_code: "CX-001", lot_quantity: 100 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_x_id: $.data.id }
            - call: "POST /component-lots/${lot_x_id}/inspect"
              payload: { defects_found: 2 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /suppliers/${sup_x_id}/scorecard"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_x_id}", lot_code: "CX-002", lot_quantity: 50 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /component-lots?supplier_id=${sup_x_id}&limit=10&offset=0"
              payload: { supplier_id: "${sup_x_id}", limit: 10, offset: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "ComponentLot.${lot_x_id}.sample_size == 8 (the MIN_SAMPLE floor beats 5% of 100), acceptance_number == 0, status == REJECTED, accepted_qty == 0"
            - "ComponentLot.${lot_x_id}.defect_ppm == 250000"
            - "the scorecard returns approval_status == SUSPENDED, incoming_inspection_level == TIGHTENED, consecutive_accepted_lots == 0"
            - "the CX-002 receipt -> 409 ERR_SUPPLIER_SUSPENDED"
            - "the lot listing still reports total_count == 1 — the refused receipt created no row"

      - name: fully_deviated_lot_has_no_releasable_pieces_left
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COMPONENT_LOT_DEPLETED]
          - validations[priority=61]
          - validations[priority=40]
          - entities.ComponentLot.fields.remaining_qty
        distinguishing_aspect: |
          A deviation acceptance makes a lot releasable without making it usable: with
          defects_found equal to lot_quantity the accepted_qty is 0, so priority 40 passes
          (the lot is DEVIATION_ACCEPTED) and priority 61 refuses the staging on
          remaining_qty — proving the two checks read different fields.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the 208SS prelude with order ${bo_id} RELEASED."
            - "A separate carburetor supplier SUP-CARB-Z ships an 8-piece lot so the sample plan covers the whole lot."
          setup_api_calls: *prelude_order
          trigger:
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-CARB-Z", name: "Zenith Fuel Systems", component_category: "CARBURETOR" }
              as: PlantAdmin
              captures: { sup_z_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_z_id}", lot_code: "CZ-001", lot_quantity: 8 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_z_id: $.data.id }
            - call: "POST /component-lots/${lot_z_id}/inspect"
              payload: { defects_found: 8 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_z_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0051" }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /component-lots/${lot_z_id}/deviation-accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_z_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0052" }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /component-lots/${lot_z_id}"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "ComponentLot.${lot_z_id}.sample_size == 8 (5% of 8 floored up to the MIN_SAMPLE 8, capped at lot_quantity), acceptance_number == 0, status == REJECTED"
            - "SN-0051 -> 422 ERR_COMPONENT_LOT_NOT_RELEASABLE while the lot is REJECTED (priority 40)"
            - "after the deviation: status == DEVIATION_ACCEPTED, deviation_flag == true, accepted_qty == 0, consumed_qty == 0, remaining_qty == 0"
            - "SN-0052 -> 409 ERR_COMPONENT_LOT_DEPLETED — the same call that was blocked at 40 is now blocked at 61"
            - "BuildOrder.${bo_id}.staged_quantity == 0 and ComponentLot.${lot_ign_id}.consumed_qty == 0 — no lot was charged by either refused staging"

      - name: error_safety_certification_expired_on_build_order_release
        claim_type: error_triggerable
        grounds: ["errors[ERR_SAFETY_CERTIFICATION_EXPIRED]"]
        excluded_because:
          difficulty_instance: expired_safety_certification_outranks_uncertified_platform
          rationale: "Triggered as the winning error of that §1.8 priority-pair instance, where a certification expired before the clock date loses to nothing else."

      - name: error_line_changeover_conflict_on_build_order_creation
        claim_type: error_triggerable
        grounds: ["errors[ERR_LINE_CHANGEOVER_CONFLICT]"]
        excluded_because:
          difficulty_instance: changeover_conflict_outranks_line_capacity
          rationale: "Triggered as the winning error of that §1.8 priority-pair instance (priority 51 ahead of the capacity check at 59)."

      - name: error_line_capacity_exceeded_on_build_order_creation
        claim_type: error_triggerable
        grounds: ["errors[ERR_LINE_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: assembly_line_week_capacity_inclusive_week_sets
          rationale: "Triggered on the week-set overlap boundary in that §1.8 instance, where the changeover gap is 0 so the capacity rule is the one that fires."

      - name: error_no_allocatable_units_on_allocation_run
        claim_type: error_triggerable
        grounds: ["errors[ERR_NO_ALLOCATABLE_UNITS]"]
        excluded_because:
          difficulty_instance: allocatable_pool_boundary_zero_versus_one_released_unit
          rationale: "Triggered at pool size 0 in that §1.8 boundary instance, immediately before the same call succeeds at pool size 1."

  # ===========================================================================
  # 7. From Table 7 (RBAC) — role_model: segregation_of_duties
  # ===========================================================================
  - section: rbac
    instances:

      - name: each_role_performs_its_own_exclusive_and_shared_operations
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.PlantAdmin.exclusive_operations
          - roles.CertificationEngineer.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.QualityEngineer.exclusive_operations
          - roles.ProductionPlanner.exclusive_operations
          - roles.ChannelPartner.exclusive_operations
        distinguishing_aspect: |
          The whole plant workflow is drivable only by six different callers: no single role
          can carry a family from creation to a released unit, and the read surface is shared
          by all five production roles. This instance shows every role exercising at least one
          of its exclusive writes and all five production roles reading the same order.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the full 208SS prelude, each call issued by the role that owns it."
          setup_api_calls: *prelude_order
          trigger:
            - *a_part1
            - *a_req1
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: PlantAdmin
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "the prelude proves the exclusive writes: PlantAdmin created the platform, model, line and suppliers; CertificationEngineer created and submitted the family and ran the durability test; ComplianceOfficer certified it and recorded the safety certification; QualityEngineer received and inspected the lots and closed the machining run; ProductionPlanner created and released the order"
            - "ChannelPartner raises PartsFulfillmentRequest.${req1_id} -> 201 with requester_user_id == cp-dealer-77"
            - "all five production-role reads of ${bo_id} answer 200 with identical data payloads — the read is shared, not owned"

      - name: exclusive_writes_reject_every_other_role_forbidden
        claim_type: exclusive_operations_denied
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.ProductionPlanner.exclusive_operations
          - roles.QualityEngineer.exclusive_operations
          - roles.PlantAdmin.exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: |
          Role denial is checked at priority 2, ahead of existence at 4 and every state and
          business rule, so a wrong-role caller gets ERR_FORBIDDEN_ROLE even when the target id
          does not exist and even when the operation would have been refused on business
          grounds anyway — and nothing is written.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the 208SS prelude with order ${bo_id} RELEASED, model ${model_id} RELEASED and lots ACCEPTED."
          setup_api_calls: *prelude_order
          trigger:
            - call: "POST /certification-families/${fam_id}/certify"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /certification-families/11111111-1111-4111-8111-111111111111/certify"
              payload: {}
              as: PlantAdmin
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "IN_SEASON", production_week: "2027-03-01", week_span: 1, planned_quantity: 2 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0061" }
              as: ProductionPlanner
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-900", lot_quantity: 100 }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "PX-1", displacement_cc: 200, torque_spec_nm: 21.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProductionPlanner
            - call: "GET /build-orders?product_model_id=${model_id}&limit=10&offset=0"
              payload: { product_model_id: "${model_id}", limit: 10, offset: 0 }
              as: ProductionPlanner
          assert:
            - "certify as CertificationEngineer -> 403 ERR_FORBIDDEN_ROLE (the submitter's role can never certify, independently of the segregation-of-duties user check)"
            - "certify as PlantAdmin against a non-existent family id -> 403 ERR_FORBIDDEN_ROLE, not 404 ERR_CERTIFICATION_FAMILY_NOT_FOUND"
            - "POST /build-orders as QualityEngineer -> 403; POST /engine-units as ProductionPlanner -> 403; POST /component-lots as ChannelPartner -> 403; POST /engine-platforms as ComplianceOfficer -> 403; POST /_clock/set_current_utc as ProductionPlanner -> 403"
            - "CertificationFamily.${fam_id}.status is still CERTIFIED at the same version, GET /build-orders reports total_count == 1, GET /engine-units reports total_count == 0 and GET /component-lots reports total_count == 3"

      - name: production_and_supplier_reads_are_closed_to_the_channel_partner_forbidden
        claim_type: exclusive_operations_denied
        grounds:
          - roles.ChannelPartner.shared_operations
          - endpoints[GET /build-orders/{id}]
          - endpoints[GET /component-lots]
          - endpoints[GET /suppliers/{id}/scorecard]
        distinguishing_aspect: |
          ChannelPartner is the only role whose read surface is narrower than "every GET": the
          three service-part reads answer 200 while production, supplier and certification
          reads answer 403 — so a dealer can see what it can order but nothing about how it is
          built or who supplies it.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the 208SS prelude with order ${bo_id} RELEASED, plus service part PN-CARB-KIT-1."
          setup_api_calls: *prelude_order
          trigger:
            - *a_part1
            - call: "GET /service-parts/${part1_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /service-parts?engine_platform_id=${plat_id}&limit=10&offset=0"
              payload: { engine_platform_id: "${plat_id}", limit: 10, offset: 0 }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /component-lots?limit=10&offset=0"
              payload: { limit: 10, offset: 0 }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /suppliers/${sup_carb_id}/scorecard"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /certification-families/${fam_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /engine-units?build_order_id=${bo_id}&limit=10&offset=0"
              payload: { build_order_id: "${bo_id}", limit: 10, offset: 0 }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
          assert:
            - "GET /service-parts/${part1_id} -> 200 and GET /service-parts (filtered) -> 200 with total_count == 1"
            - "GET /build-orders/${bo_id} -> 403 ERR_FORBIDDEN_ROLE"
            - "GET /component-lots -> 403; GET /suppliers/${sup_carb_id}/scorecard -> 403; GET /certification-families/${fam_id} -> 403; GET /engine-units -> 403"
            - "every 403 carries response_type == error with data.error_id == ERR_FORBIDDEN_ROLE and no data leakage in the message"

      - name: parts_request_listing_is_scoped_to_the_requesting_dealer
        claim_type: peer_roles
        grounds:
          - roles.ChannelPartner.shared_operations
          - endpoints[GET /service-parts/{id}/requests]
          - entities.PartsFulfillmentRequest.fields.requester_user_id
        distinguishing_aspect: |
          Two ChannelPartner operators share one role but not one view: each sees exactly its
          own requests on the same part, while any production role sees both — and the status
          filter composes with the scope, so a dealer filtering for BACKORDERED sees only its
          own backorders.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family, platform and service part PN-CARB-KIT-1 with 5 on hand (dealer lead 2 days, mass-retail lead 5 days)."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_part1
          trigger:
            - *a_req1
            - call: "POST /parts-requests"
              payload: { service_part_id: "${part1_id}", requested_quantity: 9, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-88"
              captures: { req88_id: $.data.id }
            - call: "GET /service-parts/${part1_id}/requests?limit=10&offset=0"
              payload: { limit: 10, offset: 0 }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /service-parts/${part1_id}/requests?limit=10&offset=0"
              payload: { limit: 10, offset: 0 }
              as: ChannelPartner
              as_user_id: "cp-dealer-88"
            - call: "GET /service-parts/${part1_id}/requests?limit=10&offset=0"
              payload: { limit: 10, offset: 0 }
              as: ProductionPlanner
            - call: "GET /service-parts/${part1_id}/requests?status=BACKORDERED&limit=10&offset=0"
              payload: { status: "BACKORDERED", limit: 10, offset: 0 }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
            - call: "GET /service-parts/${part1_id}/requests?status=BACKORDERED&limit=10&offset=0"
              payload: { status: "BACKORDERED", limit: 10, offset: 0 }
              as: PlantAdmin
          assert:
            - "PartsFulfillmentRequest.${req1_id}.status == FILLED with promised_ship_date == 2026-08-05 and requester_user_id == cp-dealer-77"
            - "PartsFulfillmentRequest.${req88_id}.status == BACKORDERED (9 requested against 4 remaining) with promised_ship_date == 2026-08-24 and requester_user_id == cp-dealer-88"
            - "cp-dealer-77's listing returns total_count == 1 and only ${req1_id}; cp-dealer-88's listing returns total_count == 1 and only ${req88_id}"
            - "ProductionPlanner's listing returns total_count == 2 — the scope applies only to ChannelPartner"
            - "cp-dealer-77 filtered on BACKORDERED returns total_count == 0 while PlantAdmin filtered on BACKORDERED returns total_count == 1"
            - "ServicePart.${part1_id}.on_hand_qty == 4, backordered_request_count == 1 and fill_rate_pct == 50.00"

      - name: segregation_of_duties_bars_the_submitter_and_the_inspector
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=30]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.CertificationFamily.fields.submitted_by_user_id
          - entities.ComponentLot.fields.inspected_by_user_id
        distinguishing_aspect: |
          Holding the ComplianceOfficer role is necessary but not sufficient: the same X-User-ID
          that submitted the family cannot certify it and the same X-User-ID that inspected the
          lot cannot grant its deviation, even though both calls carry a valid ComplianceOfficer
          role — the check compares user ids stamped on the target row, not roles.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS submitted by ce-hana after a COMPLETED durability run."
            - "The CRITICAL casting supplier SUP-CAST has one 800-piece lot CS-020 inspected by qe-mika with 1 defect (acceptance_number 0 -> REJECTED, 25000 ppm, supplier stays APPROVED)."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_sup_cast
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_cast_id}", lot_code: "CS-020", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_sod_id: $.data.id }
            - call: "POST /component-lots/${lot_sod_id}/inspect"
              payload: { defects_found: 1 }
              as: QualityEngineer
              as_user_id: "qe-mika"
          trigger:
            - call: "POST /certification-families/${fam_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "ce-hana"
            - call: "POST /certification-families/${fam_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /component-lots/${lot_sod_id}/deviation-accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "qe-mika"
            - call: "POST /component-lots/${lot_sod_id}/deviation-accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
          assert:
            - "certify as ce-hana -> 409 ERR_SEGREGATION_OF_DUTIES; CertificationFamily.${fam_id}.status stays SUBMITTED with submitted_by_user_id == ce-hana"
            - "certify as co-ravi -> 200 with status == CERTIFIED, certified_by_user_id == co-ravi and certified_emission_g_per_kwh == 5.12"
            - "deviation-accept as qe-mika -> 409 ERR_SEGREGATION_OF_DUTIES; ComponentLot.${lot_sod_id}.status stays REJECTED and deviation_flag == false"
            - "deviation-accept as co-ravi -> 200 with status == DEVIATION_ACCEPTED, deviation_approved_by_user_id == co-ravi, accepted_qty == 799 and deviation_flag == true"
            - "priority 30 sits after the role check at 2: the same two calls made by a QualityEngineer answer ERR_FORBIDDEN_ROLE instead"

  # ===========================================================================
  # 8. From Cross-Cutting Complexity Layers
  #    (optimistic_concurrency, cascading_side_effects,
  #     dual_variant_calculation, rate_threshold_triggers)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_family_version_is_refused_then_retried_fresh
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[durability-create-stale-family]
          - errors[ERR_STALE_FAMILY_VERSION]
          - validations[priority=17]
        distinguishing_aspect: |
          Scheduling a durability run is itself the write that invalidates the client's view:
          the first POST bumps CertificationFamily.version by 1, so replaying the same
          expected_certification_family_version for a second, non-overlapping window answers
          412 and creates nothing — a fresh read of version makes the identical call succeed.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS in DRAFT at version ${fam_v1} with platform 208SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - *a_dur
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-08-25T09:00:00Z", scheduled_end_at: "2026-09-15T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "GET /certification-families/${fam_id}"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_v2: $.data.version }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-08-25T09:00:00Z", scheduled_end_at: "2026-09-15T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v2}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur2_id: $.data.id }
            - call: "GET /durability-tests?certification_family_id=${fam_id}&limit=10&offset=0"
              payload: { certification_family_id: "${fam_id}", limit: 10, offset: 0 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
          assert:
            - "the first run is created (201) and CertificationFamily.${fam_id}.status == DURABILITY_TESTING with ${fam_v2} == ${fam_v1} + 1"
            - "the replay carrying ${fam_v1} -> 412 ERR_STALE_FAMILY_VERSION even though the window itself is legal"
            - "the retry carrying ${fam_v2} -> 201, so the refusal was purely the version mismatch"
            - "after the retry CertificationFamily.${fam_id}.version == ${fam_v1} + 2 — every accepted write increments it"
            - "the listing reports total_count == 2 (${dur_id} and ${dur2_id}), both SCHEDULED; the refused call left no row"
            - "EnginePlatform.${plat_id}.certification_posture == RESTRICTED throughout"

      - name: occ_stale_build_order_version_is_refused_then_retried_fresh
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-run-stale-build-order]
          - errors[ERR_STALE_BUILD_ORDER_VERSION]
          - validations[priority=18]
        distinguishing_aspect: |
          The version a planner captured when the order was created is already three writes
          old by the time a unit is built (release, staging, unit release all bump it), so the
          allocation run is refused twice — once with that creation-era value and once with a
          deliberately decremented fresh value — and succeeds only with the exact current
          version, leaving the split unchanged in between.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the 208SS prelude with order ${bo_id} created at version ${bo_v1} and RELEASED."
          setup_api_calls: *prelude_order
          trigger:
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - call: "POST /build-orders/${bo_id}/allocations/run"
              payload: { expected_build_order_version: "${bo_v1}" }
              as: ProductionPlanner
            - call: "GET /build-orders/${bo_id}"
              payload: {}
              as: ProductionPlanner
              captures: { bo_v_fresh: $.data.version }
            - call: "POST /build-orders/${bo_id}/allocations/run"
              payload: { expected_build_order_version: "${bo_v_fresh} - 1" }
              as: ProductionPlanner
            - call: "POST /build-orders/${bo_id}/allocations/run"
              payload: { expected_build_order_version: "${bo_v_fresh}" }
              as: ProductionPlanner
          assert:
            - "the run carrying the creation-era ${bo_v1} -> 412 ERR_STALE_BUILD_ORDER_VERSION"
            - "${bo_v_fresh} > ${bo_v1} — the release, the staging and the unit release each incremented the order's version"
            - "the run carrying ${bo_v_fresh} - 1 -> 412 ERR_STALE_BUILD_ORDER_VERSION: only the exact current version is accepted, not merely a recent one"
            - "after both refusals allocated_dealer_units == 0, allocated_mass_retail_units == 0, unallocated_units == 1, allocation_status == UNALLOCATED and allocation_run_at == null"
            - "the run carrying ${bo_v_fresh} -> 200 with allocated_dealer_units == 1, allocated_mass_retail_units == 0, unallocated_units == 0, allocation_run_at == 2026-08-03T08:00:00Z, and the version increments once more"

      - name: family_suspension_at_the_cumulative_audit_failure_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines[CertificationFamily].transitions.AUDIT_HOLD_to_SUSPENDED
          - calculations.audit_outcome_evaluation
          - entities.CertificationFamily.fields.cumulative_audit_failures
        distinguishing_aspect: |
          The suspension trigger is cumulative, not instantaneous: the first FAILED audit only
          holds the family (failures 1 < 2) while the second — a milder failure at 0.5000
          instead of 1.0000 — crosses AUDIT_FAILURE_SUSPEND_COUNT and suspends it for good,
          freezing every platform and blocking even a remediation durability run.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the 208SS prelude with order ${bo_id} RELEASED and two units SN-0001 and SN-0002 built and RELEASED (built_quantity 2)."
          setup_api_calls: *prelude_order
          trigger:
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - *a_u2_stage
            - *a_u2_torque
            - *a_u2_hot
            - *a_u2_release
            - *a_audit_schedule
            - call: "POST /line-audits/${audit_id}/record"
              payload: { units_tested: 2, units_failed: 2, max_measured_emission_g_per_kwh: 5.60 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /build-orders/${bo_id}/line-audits"
              payload: { audit_week: "2026-09-21" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { audit2_id: $.data.id }
            - call: "POST /line-audits/${audit2_id}/record"
              payload: { units_tested: 2, units_failed: 1, max_measured_emission_g_per_kwh: 5.60 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "GET /certification-families/${fam_id}"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_v_susp: $.data.version }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-09-01T09:00:00Z", scheduled_end_at: "2026-09-22T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v_susp}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
          assert:
            - "audit 1: status == FAILED with failure_rate == 1.0000, failure_reason == FAILURE_RATE_EXCEEDED; CertificationFamily.${fam_id}.status == AUDIT_HOLD with cumulative_audit_failures == 1 (1 < 2, so no suspension yet)"
            - "the second audit is schedulable on the HELD order (only ERR_AUDIT_ALREADY_OPEN guards scheduling) with required_sample_size == 2"
            - "audit 2: failure_rate == 0.5000 — a milder failure than the first — but 0.5000 > 0.2500, so status == FAILED"
            - "CertificationFamily.${fam_id}.status == SUSPENDED with cumulative_audit_failures == 2 — the count is never reset by the intervening hold"
            - "EnginePlatform.${plat_id}.certification_posture == FROZEN and BuildOrder.${bo_id}.held_reason == FAMILY_SUSPENDED"
            - "the remediation durability run carrying the correct ${fam_v_susp} -> 409 ERR_FAMILY_STATE_INVALID: SUSPENDED is terminal, so no version is fresh enough to escape it"

      - name: family_basis_re_bases_to_the_latest_completed_durability_run
        claim_type: dual_variant_calculation
        grounds:
          - calculations.deterioration_factor_and_certified_emission
          - state_machines[CertificationFamily].transitions.DURABILITY_TESTING_to_DURABILITY_COMPLETE
          - entities.CertificationFamily.fields.certified_emission_g_per_kwh
        distinguishing_aspect: |
          A family carrying two scheduled runs takes its certified basis from the latest
          COMPLETED run, not from the first or the best: completing run 1 sets df 1.2800 /
          5.12 g per kWh / 36.00 percent margin, and completing run 2 re-bases the same three
          fields to 1.4400 / 5.76 / 28.00 — the certification then locks in the second run's
          numbers.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS (EPA_PHASE3, limit 8.00, declared baseline 4.00) with platforms 208SS and 210SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "210SS", displacement_cc: 210, torque_spec_nm: 23.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_b_id: $.data.id }
          trigger:
            - *a_dur
            - call: "GET /certification-families/${fam_id}"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_v_mid: $.data.version }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_b_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v_mid}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_b_id: $.data.id }
            - *a_dur_complete
            - call: "POST /durability-tests/${dur_b_id}/complete"
              payload: { accumulated_hours: 500, final_emission_g_per_kwh: 7.20 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - *a_submit
            - *a_certify
          assert:
            - "the second run is accepted on platform 210SS even though its window is identical to the first run's — the overlap rule is per platform"
            - "after completing ${dur_id}: DurabilityTestRun.${dur_id}.computed_deterioration_factor == 1.2800 and CertificationFamily.${fam_id}.deterioration_factor == 1.2800, certified_emission_g_per_kwh == 5.12, compliance_margin_pct == 36.00, status == DURABILITY_COMPLETE"
            - "after completing ${dur_b_id}: DurabilityTestRun.${dur_b_id}.computed_deterioration_factor == 1.4400 and the family re-bases to deterioration_factor == 1.4400, certified_emission_g_per_kwh == 5.76, compliance_margin_pct == 28.00"
            - "DurabilityTestRun.${dur_id}.computed_deterioration_factor is still 1.2800 — the run rows are not rewritten, only the family's basis moves"
            - "the certification locks in the later basis: CertificationFamily.${fam_id}.status == CERTIFIED with certified_emission_g_per_kwh == 5.76 (5.76 <= the 8.00 limit and 28.00 >= the 5.00 percent minimum margin)"

      - name: layer_cascading_side_effects_covered_by_difficulty_design
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers.cascading_side_effects"]
        excluded_because:
          difficulty_instance: audit_failure_five_level_family_cascade
          rationale: "That §1.8 instance verifies the deepest declared chain end to end (audit -> family -> platform+model -> build order -> unit conformance and allocation counters), including which rows are deliberately left untouched."

      - name: layer_supplier_ppm_threshold_covered_by_difficulty_design
        claim_type: rate_threshold_triggers
        grounds: ["complexity_profile.complexity_layers.rate_threshold_triggers"]
        excluded_because:
          difficulty_instance: supplier_ppm_pooled_vs_per_lot_average_diverge
          rationale: "The instantaneous side of the layer — the pooled 25000 ppm probation threshold and the inspection-level move it forces — is asserted there; this section keeps only the cumulative audit-failure threshold."

  # ===========================================================================
  # 9. From Consistency Model — immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.BuildOrder.fields.built_quantity
          - entities.ServicePart.fields.fill_rate_pct
        distinguishing_aspect: |
          No field in this API lags its cause: the unit-release response already carries the
          bubbled order status, and an immediately following read shows the identical numbers —
          the same holds for the parts request, whose response already reflects the decremented
          stock and the recomputed fill rate. There is no second read that changes an answer.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude through the CLOSED machining run."
          setup_api_calls: *prelude_certified
          trigger:
            - *a_bo1
            - *a_bo1_release
            - *a_solo_stage
            - *a_solo_torque
            - *a_solo_hot
            - *a_solo_release
            - call: "GET /build-orders/${bo1_id}"
              payload: {}
              as: ProductionPlanner
            - call: "GET /component-lots/${lot_carb_id}"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
            - *a_part1
            - *a_req1
            - call: "GET /service-parts/${part1_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
          assert:
            - "the POST /engine-units/${solo_id}/release response already reports build_state == RELEASED and conformance_state == CONFORMING"
            - "the immediately following GET /build-orders/${bo1_id} reports status == COMPLETED, built_quantity == 1, staged_quantity == 0 — the bubble-up was applied inside the release call, not by a later job"
            - "the GET /component-lots/${lot_carb_id} reports consumed_qty == 1 and remaining_qty == 799, matching the counters the staging response already returned"
            - "the POST /parts-requests response reports status == FILLED, promised_ship_date == 2026-08-05 and shipped_from_part_id == ${part1_id}"
            - "the immediately following GET /service-parts/${part1_id} reports on_hand_qty == 4, filled_request_count == 1, backordered_request_count == 0 and fill_rate_pct == 100.00 — identical to what the create response implied"
