          - state_machines.BenefitPayment.IN_PAY_to_IN_PAY
        distinguishing_aspect: "apply-cola on an IN_PAY payment whose plan has cola_pct=0 -> ERR_NO_COLA_CONFIGURED (409)."
        test_recipe:
          setup: ["IN_PAY payment on a plan with cola_pct=0."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme NoCola", ein_psn: "99-0000020-001", benefit_formula_type: "FINAL_AVERAGE_PAY", cola_pct: 0.0, fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2020", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /plans/compensation"
              payload: { participant_id: "${p_id}", plan_year: 2023, gross_comp_cents: 12000000 }
              as: BenefitsAdministrator
            - call: "POST /plans/participants/${p_id}/terminate"
              payload: { termination_date: "2024-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/elections"
              payload: { participant_id: "${p_id}", payment_form: "SINGLE_LIFE", annuity_start_date: "2024-06-01" }
              as: BenefitsAdministrator
              captures: { e_id: $.data.id }
            - call: "POST /plans/elections/${e_id}/submit"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_A"
            - call: "POST /plans/elections/${e_id}/approve"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "POST /plans/elections/${e_id}/commence"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "ADM_B"
            - call: "GET /plans/payments?participant_id=${p_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /plans/payments/${pay_id}/activate"
              payload: {}
              as: BenefitsAdministrator
          trigger:
            - call: "POST /plans/payments/${pay_id}/apply-cola"
              payload: {}
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_COLA_CONFIGURED"

      - name: benefit_not_available_below_age_55
        claim_type: Violation → Error
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_BENEFIT_NOT_AVAILABLE]"
        excluded_because:
          difficulty_instance: boundary_precision_check / early_retirement_age_55_boundary_on_submit
          rationale: "The age-55 boundary (pass at exactly 55) is the named §1.8 boundary instance; the age-54 failure is its negative twin."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_participants_filtered_by_plan_id_paginated
        claim_type: Computed read
        grounds:
          - entities.Participant.fields.plan_id
        distinguishing_aspect: "GET /plans/participants?plan_id=X returns the array of that plan's participants with pagination envelope (total_count, has_more)."
        test_recipe:
          setup: ["Plan with two participants."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Acme List", ein_psn: "99-0000021-001", benefit_formula_type: "FINAL_AVERAGE_PAY", fap_accrual_rate: 0.015, cb_pay_credit_rate: 0.0, cb_interest_crediting_rate: 0.0 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2101", date_of_birth: "1962-01-01", hire_date: "2000-01-01" }
              as: BenefitsAdministrator
            - call: "POST /plans/participants"
              payload: { plan_id: "${plan_id}", ssn_last4: "2102", date_of_birth: "1963-01-01", hire_date: "2001-01-01" }
              as: BenefitsAdministrator
          trigger:
            - call: "GET /plans/participants?plan_id=${plan_id}"
              payload: {}
              as: PlanActuary
              captures: { first_id: "$.data[0].id" }
