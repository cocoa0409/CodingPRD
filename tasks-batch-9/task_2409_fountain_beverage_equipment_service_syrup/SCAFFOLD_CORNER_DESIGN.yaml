            - "ServiceCall.${sc}.reserved_part_units == 0"
            - "ServiceCall.${sc}.reserved_part_stock_id == null"
            - "no VanPartStock row exists"

      - name: close_term_exactly_at_the_term_end_date_passes
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 22 ERR_TERM_NOT_ELAPSED]
          - state_machines.PlacementAgreement.ACTIVE_to_EXPIRED
        distinguishing_aspect: "The gate is clock >= term_end_date; with the clock set exactly to the 2026-08-01 term end the close-term action succeeds and the agreement reaches EXPIRED instead of returning 409 ERR_TERM_NOT_ELAPSED."
        test_recipe:
          setup:
            - "An ACTIVE agreement whose term_end_date is exactly the 2026-08-01T00:00:00Z clock."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
