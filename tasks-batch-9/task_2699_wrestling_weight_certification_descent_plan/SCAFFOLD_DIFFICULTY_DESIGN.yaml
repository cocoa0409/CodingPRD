            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_a}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${wa_ver_1}" }
              as: TeamCoach
