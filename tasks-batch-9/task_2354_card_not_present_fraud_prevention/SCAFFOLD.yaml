# =============================================================================
# task_2354 — Card-Not-Present Fraud Prevention (aegis-cnp)
# Seed tables §1.0–§1.7. Difficulty calibration: EXPERT+ (deliberately above the
# §0.4 Expert band: 12 entities / 48 endpoints / 9 state-machine axes across 8
# entities / 16 calculation rules, with 2 OCC races and 4 cross-cutting layers).
# =============================================================================

scenario: |
  2354. Card-Not-Present Fraud Prevention (e-commerce fraud operations): risk scoring at checkout using device, behavioral, velocity and identity signals with rule and model blending, decision thresholds across approve, review and decline with manual review queue staffing, false positive measurement through good-customer rejection analysis and insult rate, account takeover detection at login and profile change with step-up authentication, promotion abuse, reshipper and drop-address detection with address intelligence, chargeback outcome feedback loops retraining models with reason code segmentation, guarantee and liability shift program evaluation, policy exception handling for high-value customers and business accounts

domain_name: aegis-cnp-fraud
api_prefix: /fraud

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every entity is addressed at its own top-level collection under /fraud; the
  # only nested path is the RulePack -> FraudRule composition. All other links
  # are FK fields in request bodies, discovered through filtered list endpoints.

  state_machine_shape: parallel
  # Customer carries two independent state axes on one row (account_status x
  # ato_posture); AuthEvent carries outcome x challenge_state. ReviewCase and
  # RiskModel are cyclic; CheckoutAssessment is a branching fork with three
  # divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # RulePack -> FraudRule, Customer -> CheckoutAssessment
    - self_referential     # AddressRecord.canonical_parent_address_id -> AddressRecord.id
    - cross_aggregate      # ChargebackRecord mutates Customer / DeviceProfile / AddressRecord / ReviewCase

  role_model: segregation_of_duties
  # A RulePack cannot be activated by its creator; a PolicyException cannot be
  # decided by its requester; an ESCALATED ReviewCase cannot be re-assigned to
  # the analyst who escalated it.

  consistency_model: immediate

  difficulty_level: expert_plus

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Account email; free-form, not uniqueness-constrained" }
      - { name: tier, type: enum, source: input, default: STANDARD, description: "STANDARD | HIGH_VALUE | BUSINESS — gates policy-exception eligibility and review priority", constraints: "one of STANDARD, HIGH_VALUE, BUSINESS" }
      - { name: home_country, type: string, source: input, description: "ISO-3166 alpha-2 country of record; compared against AuthEvent.ip_country by ato_score_evaluation", constraints: "exactly 2 uppercase letters" }
      - { name: account_status, type: enum, source: system, default: ACTIVE, description: "State axis 1: ACTIVE | LOCKED | CLOSED — independent of ato_posture", constraints: "one of ACTIVE, LOCKED, CLOSED" }
      - { name: ato_posture, type: enum, source: system, default: CLEAR, description: "State axis 2: CLEAR | WATCH | CONTAINED — independent of account_status", constraints: "one of CLEAR, WATCH, CONTAINED" }
      - { name: lifetime_net_approved_cents, type: integer, source: computed, default: 0, description: "Conserved ledger: SUM(CheckoutAssessment.amount_cents) over this customer's rows with state == DECIDED_APPROVE AND outcome_label != FRAUD" }
      - { name: approved_count, type: integer, source: computed, default: 0, description: "Count of this customer's assessments with state == DECIDED_APPROVE" }
      - { name: declined_count, type: integer, source: computed, default: 0, description: "Count of this customer's assessments with state == DECIDED_DECLINE" }
      - { name: confirmed_fraud_count, type: integer, source: computed, default: 0, description: "Count of this customer's assessments with outcome_label == FRAUD" }
      - { name: failed_login_count, type: integer, source: computed, default: 0, description: "Number of step-up challenge failures since the last PASS; feeds ato_score_evaluation" }
      - { name: good_customer_flag, type: boolean, source: computed, default: false, description: "Good-customer classification per §1.3 customer_good_standing; drives insult-rate cohorts and review priority" }
      - { name: locked_reason, type: string, source: system, default: null, description: "Free-form reason recorded when account_status becomes LOCKED; null otherwise" }

  - name: Analyst
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Human-readable analyst name" }
      - { name: seniority, type: enum, source: input, description: "JUNIOR | SENIOR | LEAD — only LEAD may hold an ESCALATED ReviewCase", constraints: "one of JUNIOR, SENIOR, LEAD" }
      - { name: skill_families, type: array, source: input, description: "Signal families this analyst may review; array of DEVICE | BEHAVIORAL | VELOCITY | IDENTITY | ADDRESS | PROMO | MODEL", constraints: "non-empty array of the signal-family enum" }
      - { name: shift_capacity_cases, type: integer, source: input, description: "Maximum simultaneously ASSIGNED cases for this analyst", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | OFF_SHIFT | SUSPENDED — only AVAILABLE analysts are assignment-eligible", constraints: "one of AVAILABLE, OFF_SHIFT, SUSPENDED" }
      - { name: open_case_count, type: integer, source: computed, default: 0, description: "Conserved capacity counter: count of ReviewCase rows with assigned_analyst_id == this.id AND state == ASSIGNED" }
      - { name: resolved_case_count, type: integer, source: computed, default: 0, description: "Count of ReviewCase rows this analyst moved to RESOLVED_APPROVE or RESOLVED_DECLINE" }

  - name: DeviceProfile
    parent: null
    common_fields: true
    fields:
      - { name: device_hash, type: string, source: input, description: "Client-side device fingerprint; globally unique across DeviceProfile rows" }
      - { name: emulator_flag, type: boolean, source: input, default: false, description: "True when the fingerprint matched an emulator signature" }
      - { name: tz_offset_minutes, type: integer, source: input, description: "Browser timezone offset in minutes" }
      - { name: reputation, type: enum, source: computed, default: NEW, description: "NEW | TRUSTED | SUSPECT | BLOCKED per §1.3 device_reputation_recompute", constraints: "one of NEW, TRUSTED, SUSPECT, BLOCKED" }
      - { name: distinct_customer_count, type: integer, source: computed, default: 0, description: "Count of DISTINCT customer_id over (CheckoutAssessment rows on this device with decision != null) UNION (AuthEvent rows on this device)" }
      - { name: approved_use_count, type: integer, source: computed, default: 0, description: "Count of CheckoutAssessment rows on this device with state == DECIDED_APPROVE" }
      - { name: fraud_confirmed_count, type: integer, source: computed, default: 0, description: "Count of CheckoutAssessment rows on this device with outcome_label == FRAUD" }

  - name: AddressRecord
    parent: null
    common_fields: true
    fields:
      - { name: line1, type: string, source: input, description: "Street line as submitted" }
      - { name: postal_code, type: string, source: input, description: "Postal code as submitted" }
      - { name: country_code, type: string, source: input, description: "ISO-3166 alpha-2; compared with CheckoutAssessment.ip_country by ID_GEO_MISMATCH", constraints: "exactly 2 uppercase letters" }
      - { name: classification, type: enum, source: input, default: RESIDENTIAL, description: "RESIDENTIAL | COMMERCIAL | FREIGHT_FORWARDER | PO_BOX — address-intelligence label", constraints: "one of RESIDENTIAL, COMMERCIAL, FREIGHT_FORWARDER, PO_BOX" }
      - { name: canonical_parent_address_id, type: string, source: input, default: null, description: "FK -> AddressRecord.id; self-referential unit/suite variant link. Null when this row IS the canonical root. When set, the referenced row MUST have canonical_parent_address_id == null (single-level clusters only)" }
      - { name: canonical_address_id, type: string, source: computed, description: "Resolved cluster root: equals id when canonical_parent_address_id is null, else equals canonical_parent_address_id. Not an input field" }
      - { name: distinct_customer_count, type: integer, source: computed, default: 0, description: "Maintained on the canonical root only: DISTINCT customer_id over CheckoutAssessment rows whose shipping address resolves to this cluster AND decision != null. Variant rows keep 0" }
      - { name: approved_use_count, type: integer, source: computed, default: 0, description: "Canonical-root counter: assessments shipping to this cluster with state == DECIDED_APPROVE" }
      - { name: fraud_confirmed_count, type: integer, source: computed, default: 0, description: "Canonical-root counter: assessments shipping to this cluster with outcome_label == FRAUD" }
      - { name: promo_redemption_count, type: integer, source: computed, default: 0, description: "Canonical-root counter: assessments shipping to this cluster with promo_code != null AND state == DECIDED_APPROVE" }
      - { name: drop_risk_state, type: enum, source: computed, default: CLEAN, description: "CLEAN | WATCH | KNOWN_DROP per §1.3 address_intelligence_recompute; maintained on the canonical root" }
      - { name: reshipper_confidence, type: number, source: computed, default: 0.0, description: "0.00–1.00 reshipper score per §1.3 address_intelligence_recompute, 2 decimals" }

  - name: RulePack
    parent: null
    common_fields: true
    fields:
      - { name: version_label, type: string, source: input, description: "Human-readable pack label" }
      - { name: blend_mode, type: enum, source: input, description: "WEIGHTED | RULE_DOMINANT — selects the §1.3 blended_risk_score variant", constraints: "one of WEIGHTED, RULE_DOMINANT" }
      - { name: rule_weight, type: number, source: input, description: "Weight applied to rule_score in WEIGHTED mode, 2 decimals", constraints: "0.00 <= rule_weight <= 1.00; rule_weight + model_weight == 1.00" }
      - { name: model_weight, type: number, source: input, description: "Weight applied to model_points in WEIGHTED mode, 2 decimals", constraints: "0.00 <= model_weight <= 1.00" }
      - { name: review_floor_score, type: number, source: input, description: "Inclusive lower bound of the REVIEW band, 2 decimals", constraints: "0.00 <= review_floor_score < decline_floor_score" }
      - { name: decline_floor_score, type: number, source: input, description: "Inclusive lower bound of the DECLINE band, 2 decimals", constraints: "decline_floor_score <= 200.00" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the pack's decisioning window (ISO 8601 UTC)" }
      - { name: effective_until, type: datetime, source: input, description: "Exclusive end of the pack's decisioning window", constraints: "effective_until > effective_from" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED", constraints: "one of DRAFT, ACTIVE, RETIRED" }
      - { name: created_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the PolicyEngineer that created the pack; segregation-of-duties comparand" }
      - { name: activated_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the PolicyEngineer that activated the pack" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock instant of activation" }
      - { name: retired_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which a successor activation retired this pack" }
      - { name: rule_count, type: integer, source: computed, default: 0, description: "Count of FraudRule rows with rule_pack_id == this.id" }

  - name: FraudRule
    parent: RulePack
    common_fields: false
    fields:
      - { name: rule_pack_id, type: string, source: input, description: "FK -> RulePack.id; supplied via the path segment of the create endpoint" }
      - { name: code, type: enum, source: input, description: "Signal predicate identifier; one of DEV_MULTI_ACCOUNT, DEV_EMULATOR, BEH_FAST_CHECKOUT, BEH_BULK_CART, VEL_CUSTOMER_1H, VEL_DEVICE_CARD_24H, ID_GEO_MISMATCH, ADDR_DROP_RISK, ADDR_FREIGHT_FORWARDER, PROMO_ADDRESS_ABUSE. Unique within a rule pack" }
      - { name: signal_family, type: enum, source: input, description: "DEVICE | BEHAVIORAL | VELOCITY | IDENTITY | ADDRESS | PROMO — must match the family the code belongs to", constraints: "one of DEVICE, BEHAVIORAL, VELOCITY, IDENTITY, ADDRESS, PROMO" }
      - { name: points, type: integer, source: input, description: "Points added to rule_score when the predicate fires", constraints: "0 <= points <= 100" }
      - { name: hard_decline, type: boolean, source: input, default: false, description: "When true, firing this rule short-circuits evaluation and forces decision DECLINE with reason HARD_RULE" }
      - { name: evaluation_order, type: integer, source: input, description: "Ascending evaluation order within the pack; ties broken by created_at ASC", constraints: ">= 1" }

  - name: RiskModel
    parent: null
    common_fields: true
    fields:
      - { name: model_version_label, type: string, source: input, description: "Human-readable model label" }
      - { name: calibration_intercept, type: number, source: input, description: "Additive calibration term applied to the raw model probability", constraints: "-1.0 <= calibration_intercept <= 1.0" }
      - { name: calibration_slope, type: number, source: input, description: "Multiplicative calibration term applied to the raw model probability", constraints: "0.0 < calibration_slope <= 4.0" }
      - { name: trained_on_chargeback_cutoff_at, type: datetime, source: input, default: null, description: "Exclusive upper bound on ChargebackRecord.received_at for the training corpus. Null marks a cold-start model that may go DRAFT -> SHADOW directly; non-null forces the DRAFT -> TRAINING reason-code-segment gate" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | TRAINING | SHADOW | ACTIVE | RETIRED", constraints: "one of DRAFT, TRAINING, SHADOW, ACTIVE, RETIRED" }
      - { name: training_segment_counts, type: object, source: computed, default: null, description: "Map reason_code -> count of LOST chargebacks with received_at < trained_on_chargeback_cutoff_at, frozen at the moment START_TRAINING succeeded; null until then" }
      - { name: promoted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of promotion to ACTIVE" }
      - { name: retired_at, type: datetime, source: system, default: null, description: "Logical-clock instant of retirement" }
      - { name: scored_assessment_count, type: integer, source: computed, default: 0, description: "Count of CheckoutAssessment rows with risk_model_id == this.id AND decision != null" }

  - name: CheckoutAssessment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: device_profile_id, type: string, source: input, description: "FK -> DeviceProfile.id" }
      - { name: shipping_address_id, type: string, source: input, description: "FK -> AddressRecord.id; ADDRESS-family predicates resolve through its canonical_address_id" }
      - { name: billing_address_id, type: string, source: input, description: "FK -> AddressRecord.id; supplies country_code for ID_GEO_MISMATCH" }
      - { name: rule_pack_id, type: string, source: computed, description: "FK -> RulePack.id; version-pinned at creation to the pack with status == ACTIVE whose window contains the creation instant" }
      - { name: risk_model_id, type: string, source: computed, description: "FK -> RiskModel.id; version-pinned at creation to the RiskModel with status == ACTIVE" }
      - { name: applied_exception_id, type: string, source: computed, default: null, description: "FK -> PolicyException.id; set when a PolicyException changed rule evaluation or the decision band" }
      - { name: amount_cents, type: integer, source: input, description: "Order total in cents", constraints: ">= 1" }
      - { name: card_bin, type: string, source: input, description: "First 6 digits of the PAN; distinct-BIN velocity input", constraints: "exactly 6 digits" }
      - { name: ip_country, type: string, source: input, description: "ISO-3166 alpha-2 country of the checkout IP", constraints: "exactly 2 uppercase letters" }
      - { name: session_seconds, type: integer, source: input, description: "Seconds from session start to checkout submit; behavioral input", constraints: ">= 0" }
      - { name: cart_item_count, type: integer, source: input, description: "Number of line items in the cart", constraints: ">= 1" }
      - { name: promo_code, type: string, source: input, default: null, description: "Promotion code applied at checkout; null when none" }
      - { name: model_raw_probability, type: number, source: input, description: "Raw fraud probability emitted by the upstream scoring service, 4 decimals; calibrated into model_points by §1.3 model_point_calibration", constraints: "0.0000 <= model_raw_probability <= 1.0000" }
      - { name: state, type: enum, source: system, default: PENDING_SIGNALS, description: "PENDING_SIGNALS | IN_REVIEW | DECIDED_APPROVE | DECIDED_DECLINE", constraints: "one of PENDING_SIGNALS, IN_REVIEW, DECIDED_APPROVE, DECIDED_DECLINE" }
      - { name: decision, type: enum, source: computed, default: null, description: "Band decision frozen at scoring: APPROVE | REVIEW | DECLINE; never rewritten by manual review", constraints: "one of APPROVE, REVIEW, DECLINE or null" }
      - { name: decision_reason, type: enum, source: computed, default: null, description: "SCORE_BAND | HARD_RULE | POLICY_EXCEPTION | MANUAL_REVIEW | ATO_CONTAINMENT" }
      - { name: rule_score, type: number, source: computed, default: null, description: "Rule component per §1.3 rule_score_evaluation, 0–100" }
      - { name: model_points, type: number, source: computed, default: null, description: "Calibrated model component per §1.3 model_point_calibration, 2 decimals" }
      - { name: blended_score, type: number, source: computed, default: null, description: "Blended risk score per §1.3 blended_risk_score, 2 decimals" }
      - { name: triggered_rule_codes, type: array, source: computed, default: null, description: "Rule codes that fired, in evaluation order; excludes rules suppressed by an ADDRESS_WHITELIST exception" }
      - { name: hard_decline_triggered, type: boolean, source: computed, default: false, description: "True when a rule with hard_decline == true fired" }
      - { name: primary_signal_family, type: enum, source: computed, default: null, description: "Family of the highest-points triggered rule (ties -> lowest evaluation_order); MODEL when no rule fired" }
      - { name: velocity_customer_assessment_count_1h, type: integer, source: computed, default: null, description: "Velocity signal per §1.3 velocity_signal_window" }
      - { name: velocity_device_distinct_card_bin_count_24h, type: integer, source: computed, default: null, description: "Velocity signal per §1.3 velocity_signal_window; includes this assessment's own card_bin" }
      - { name: velocity_promo_address_count_30d, type: integer, source: computed, default: null, description: "Promotion-abuse velocity signal per §1.3 velocity_signal_window" }
      - { name: good_customer_at_decision, type: boolean, source: computed, default: null, description: "Snapshot of Customer.good_customer_flag taken at the scoring instant; retained for insult-rate audits" }
      - { name: final_disposition, type: enum, source: computed, default: null, description: "APPROVED | DECLINED — terminal commercial outcome, set when state becomes DECIDED_APPROVE or DECIDED_DECLINE" }
      - { name: outcome_label, type: enum, source: computed, default: UNKNOWN, description: "UNKNOWN | LEGIT | FRAUD — chargeback feedback label", constraints: "one of UNKNOWN, LEGIT, FRAUD" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant the assessment reached a terminal state" }

  - name: ReviewCase
    parent: null
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: computed, description: "FK -> CheckoutAssessment.id; the case is created by the SCORED -> IN_REVIEW cascade, never by a client call" }
      - { name: assigned_analyst_id, type: string, source: system, default: null, description: "FK -> Analyst.id; null while QUEUED or ESCALATED" }
      - { name: escalated_by_analyst_id, type: string, source: system, default: null, description: "FK -> Analyst.id; the analyst that escalated the case. Segregation-of-duties comparand: an ESCALATED case may not be re-assigned to this analyst" }
      - { name: state, type: enum, source: system, default: QUEUED, description: "QUEUED | ASSIGNED | ESCALATED | RESOLVED_APPROVE | RESOLVED_DECLINE", constraints: "one of QUEUED, ASSIGNED, ESCALATED, RESOLVED_APPROVE, RESOLVED_DECLINE" }
      - { name: primary_signal_family, type: enum, source: system, description: "Copied from CheckoutAssessment.primary_signal_family at case creation; matched against Analyst.skill_families" }
      - { name: priority_score, type: number, source: computed, description: "Queue priority per §1.3 review_case_priority_score, 2 decimals; recomputed on cascade" }
      - { name: sla_due_at, type: datetime, source: system, description: "created_at + SLA_SECONDS (14400)" }
      - { name: assigned_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent assignment" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock instant of resolution" }
      - { name: requeue_count, type: integer, source: computed, default: 0, description: "Number of ASSIGNED -> QUEUED releases caused by analyst shift changes" }
      - { name: escalation_count, type: integer, source: computed, default: 0, description: "Number of ASSIGNED -> ESCALATED transitions" }
      - { name: resolved_late, type: boolean, source: computed, default: null, description: "resolved_at > sla_due_at, evaluated at resolution" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Analyst note recorded at resolution or escalation" }

  - name: AuthEvent
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: device_profile_id, type: string, source: input, description: "FK -> DeviceProfile.id" }
      - { name: event_type, type: enum, source: input, description: "LOGIN | PASSWORD_CHANGE | EMAIL_CHANGE | SHIP_ADDRESS_ADD | PAYMENT_INSTRUMENT_ADD", constraints: "one of LOGIN, PASSWORD_CHANGE, EMAIL_CHANGE, SHIP_ADDRESS_ADD, PAYMENT_INSTRUMENT_ADD" }
      - { name: ip_country, type: string, source: input, description: "ISO-3166 alpha-2 country of the request IP", constraints: "exactly 2 uppercase letters" }
      - { name: prior_password_change_hours, type: number, source: input, default: null, description: "Hours since the account's last password change as reported by the caller; null when unknown" }
      - { name: ato_score, type: number, source: computed, description: "Account-takeover score per §1.3 ato_score_evaluation, 2 decimals" }
      - { name: outcome, type: enum, source: computed, description: "State axis 1 (immutable after creation): ALLOWED | STEP_UP_REQUIRED | BLOCKED", constraints: "one of ALLOWED, STEP_UP_REQUIRED, BLOCKED" }
      - { name: challenge_state, type: enum, source: system, default: NONE, description: "State axis 2: NONE | ISSUED | PASSED | FAILED | EXPIRED", constraints: "one of NONE, ISSUED, PASSED, FAILED, EXPIRED" }
      - { name: challenge_method, type: enum, source: system, default: null, description: "OTP_SMS | OTP_EMAIL | THREE_DS; OTP_SMS on first issue, overridable on reissue" }
      - { name: challenge_attempts, type: integer, source: computed, default: 0, description: "Count of FAIL actions recorded against this challenge" }
      - { name: challenge_expires_at, type: datetime, source: system, default: null, description: "Issue instant + CHALLENGE_TTL_SECONDS (900)" }
      - { name: device_first_seen_for_customer, type: boolean, source: computed, description: "True when no earlier AuthEvent and no earlier CheckoutAssessment pairs this customer_id with this device_profile_id" }

  - name: ChargebackRecord
    parent: null
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: input, description: "FK -> CheckoutAssessment.id; the disputed order" }
      - { name: reason_code, type: enum, source: input, description: "FRAUD_CNP | FRAUD_ATO | PRODUCT_NOT_RECEIVED | SUBSCRIPTION_CANCELED — segments the retraining corpus", constraints: "one of FRAUD_CNP, FRAUD_ATO, PRODUCT_NOT_RECEIVED, SUBSCRIPTION_CANCELED" }
      - { name: amount_cents, type: integer, source: input, description: "Disputed amount in cents", constraints: ">= 1" }
      - { name: liability_shift, type: boolean, source: input, description: "True when the issuer bore liability (3-D Secure authenticated); blocks guarantee reimbursement" }
      - { name: received_at, type: datetime, source: input, description: "Network receipt instant; compared with RiskModel.trained_on_chargeback_cutoff_at" }
      - { name: state, type: enum, source: system, default: RECEIVED, description: "RECEIVED | REPRESENTED | WON | LOST", constraints: "one of RECEIVED, REPRESENTED, WON, LOST" }
      - { name: evidence_note, type: string, source: input, default: null, description: "Representment evidence summary" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock instant of WON/LOST resolution" }
      - { name: guarantee_state, type: enum, source: computed, default: NOT_APPLICABLE, description: "NOT_APPLICABLE | REIMBURSED | DENIED per §1.3 guarantee_liability_evaluation", constraints: "one of NOT_APPLICABLE, REIMBURSED, DENIED" }
      - { name: guarantee_denial_reason, type: enum, source: computed, default: null, description: "LIABILITY_SHIFTED | REASON_NOT_COVERED | EXCEPTION_OVERRIDE | DECISION_NOT_ELIGIBLE — first failing test in that pinned order" }
      - { name: guarantee_eligible_cents, type: integer, source: computed, default: 0, description: "min(amount_cents, assessment.amount_cents, GUARANTEE_COVERAGE_CAP_CENTS) when covered, else 0" }
      - { name: guarantee_fee_cents, type: integer, source: computed, default: 0, description: "Program fee withheld from the eligible amount" }
      - { name: guarantee_reimbursed_cents, type: integer, source: computed, default: 0, description: "guarantee_eligible_cents - guarantee_fee_cents when covered, else 0" }

  - name: PolicyException
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the beneficiary account" }
      - { name: requested_by_analyst_id, type: string, source: system, description: "FK -> Analyst.id; X-User-ID of the requesting RiskAnalyst. Segregation-of-duties comparand" }
      - { name: approved_by_analyst_id, type: string, source: system, default: null, description: "FK -> Analyst.id; X-User-ID of the deciding ReviewLead" }
      - { name: whitelisted_address_id, type: string, source: input, default: null, description: "FK -> AddressRecord.id; required when scope == ADDRESS_WHITELIST, must be null otherwise" }
      - { name: scope, type: enum, source: input, description: "AUTO_APPROVE_UNDER_AMOUNT (band-stage override) | ADDRESS_WHITELIST (rule-stage suppression)", constraints: "one of AUTO_APPROVE_UNDER_AMOUNT, ADDRESS_WHITELIST" }
      - { name: max_amount_cents, type: integer, source: input, description: "Order-amount ceiling the exception covers", constraints: ">= 1 and <= the tier cap in §1.3 policy_exception_tier_cap" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the exception window" }
      - { name: expires_at, type: datetime, source: input, description: "Exclusive end of the exception window", constraints: "expires_at > effective_from" }
      - { name: justification, type: string, source: input, description: "Business justification recorded by the requester" }
      - { name: state, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | REJECTED | REVOKED", constraints: "one of REQUESTED, APPROVED, REJECTED, REVOKED" }
      - { name: consumed_count, type: integer, source: computed, default: 0, description: "Number of assessments whose applied_exception_id equals this row" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the APPROVE/REJECT/REVOKE decision" }
      - { name: decision_note, type: string, source: input, default: null, description: "Note recorded by the deciding ReviewLead" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Customer
  # PARALLEL DIMENSIONS: Customer carries two independent state axes on one row.
  # Neither axis constrains the other's transition set; a cascade may move both
  # in the same request, but each axis is separately reachable.
  - entity: Customer
    state_field: account_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: LOCKED
        trigger: "POST /fraud/customers/{id}/posture with account_status=LOCKED"
        actor: PlatformAdmin
        preconditions: ["customer.account_status == ACTIVE"]
        side_effects:
          - "sets locked_reason to the supplied reason"
          - "recomputes good_customer_flag per §1.3 customer_good_standing (an inactive account is never good) — flips true -> false when it was true"
          - "leaves ato_posture untouched"
          - "increments Customer.version by 1"
        note: "Administrative lock. Does NOT auto-decline in-review assessments; only the ATO containment cascade does that."
      - from: LOCKED
        to: ACTIVE
        trigger: "POST /fraud/customers/{id}/posture with account_status=ACTIVE"
        actor: PlatformAdmin
        preconditions: ["customer.account_status == LOCKED"]
        side_effects:
          - "clears locked_reason to null"
          - "recomputes good_customer_flag per §1.3 customer_good_standing"
          - "increments Customer.version by 1"
        note: "Unlock — makes the axis cyclic (ACTIVE -> LOCKED -> ACTIVE)."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fraud/customers/{id}/posture with account_status=CLOSED"
        actor: PlatformAdmin
        preconditions: ["customer.account_status == ACTIVE"]
        side_effects:
          - "sets good_customer_flag to false"
          - "increments Customer.version by 1"
        note: "Terminal. No further posture transitions on either axis."

  - entity: Customer
    state_field: ato_posture
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: WATCH
        trigger: "POST /fraud/auth-events whose ato_score lands in the STEP_UP band"
        actor: system
        preconditions: ["customer.account_status != CLOSED", "ATO_STEPUP_FLOOR <= auth_event.ato_score < ATO_BLOCK_FLOOR"]
        side_effects:
          - "creates the AuthEvent with outcome STEP_UP_REQUIRED and challenge_state ISSUED"
          - "increments Customer.version by 1"
      - from: WATCH
        to: CLEAR
        trigger: "POST /fraud/auth-events/{id}/challenge with action=PASS"
        actor: CheckoutService
        preconditions: ["auth_event.challenge_state == ISSUED", "current_utc < auth_event.challenge_expires_at"]
        side_effects:
          - "sets Customer.failed_login_count to 0"
          - "increments Customer.version by 1"
      - from: WATCH
        to: CONTAINED
        trigger: "POST /fraud/auth-events/{id}/challenge with action=FAIL reaching MAX_CHALLENGE_ATTEMPTS"
        actor: CheckoutService
        preconditions: ["auth_event.challenge_state == ISSUED", "auth_event.challenge_attempts + 1 >= MAX_CHALLENGE_ATTEMPTS"]
        side_effects:
          - "CASCADE LINK 2 of the ATO containment chain: sets account_status to LOCKED with locked_reason 'ATO_CONTAINMENT'"
          - "CASCADE LINK 3: every CheckoutAssessment of this customer in state IN_REVIEW moves to DECIDED_DECLINE with decision_reason ATO_CONTAINMENT and final_disposition DECLINED, and declined_count increases per assessment"
          - "CASCADE LINK 4: each such assessment's ReviewCase moves to RESOLVED_DECLINE, and its assigned_analyst_id (when non-null) has open_case_count decremented by 1 and version incremented by 1"
          - "increments Customer.version by 1"
      - from: CLEAR
        to: CONTAINED
        trigger: "POST /fraud/auth-events whose ato_score lands in the BLOCK band"
        actor: system
        preconditions: ["customer.account_status != CLOSED", "auth_event.ato_score >= ATO_BLOCK_FLOOR"]
        side_effects:
          - "creates the AuthEvent with outcome BLOCKED and challenge_state NONE"
          - "CASCADE LINK 2/3/4 identical to the WATCH -> CONTAINED containment cascade above"
          - "increments Customer.version by 1"
      - from: CONTAINED
        to: CLEAR
        trigger: "POST /fraud/customers/{id}/posture with ato_posture=CLEAR"
        actor: PlatformAdmin
        preconditions: ["customer.ato_posture == CONTAINED"]
        side_effects:
          - "sets failed_login_count to 0"
          - "does NOT unlock account_status — the two axes are cleared independently"
          - "increments Customer.version by 1"
        note: "Makes the posture axis cyclic (CLEAR -> WATCH/CONTAINED -> CLEAR)."

  # ------------------------------------------------------- CheckoutAssessment
  # BRANCHING FORK: one trigger (score) resolves to three targets with three
  # disjoint side-effect sets.
  - entity: CheckoutAssessment
    initial_state: PENDING_SIGNALS
    terminal_states: [DECIDED_APPROVE, DECIDED_DECLINE]
    transitions:
      - from: PENDING_SIGNALS
        to: DECIDED_APPROVE
        trigger: "POST /fraud/checkout-assessments/{id}/score resolving to decision APPROVE"
        actor: CheckoutService
        preconditions:
          - "assessment.state == PENDING_SIGNALS"
          - "customer.account_status == ACTIVE"
          - "customer.ato_posture != CONTAINED"
          - "rule_pack.status == ACTIVE"
          - "risk_model.status == ACTIVE"
          - "decision_band_selection yields APPROVE (blended_score < rule_pack.review_floor_score, or a POLICY_EXCEPTION override) AND hard_decline_triggered == false"
        side_effects:
          - "computes velocity_* fields per §1.3 velocity_signal_window, rule_score per §1.3 rule_score_evaluation, model_points per §1.3 model_point_calibration, blended_score per §1.3 blended_risk_score, and decision/decision_reason per §1.3 decision_band_selection"
          - "sets final_disposition APPROVED, decided_at = current_utc, good_customer_at_decision = customer.good_customer_flag"
          - "increments Customer.approved_count by 1 and Customer.lifetime_net_approved_cents by amount_cents, then recomputes Customer.good_customer_flag per §1.3 customer_good_standing; increments Customer.version by 1"
          - "recomputes the shipping cluster root's distinct_customer_count, approved_use_count, promo_redemption_count, drop_risk_state and reshipper_confidence per §1.3 address_intelligence_recompute"
          - "recomputes device_profile.distinct_customer_count, approved_use_count and reputation per §1.3 device_reputation_recompute"
          - "when applied_exception_id is non-null, increments that PolicyException.consumed_count by 1 and its version by 1"
          - "increments RiskModel.scored_assessment_count by 1"
      - from: PENDING_SIGNALS
        to: IN_REVIEW
        trigger: "POST /fraud/checkout-assessments/{id}/score resolving to decision REVIEW"
        actor: CheckoutService
        preconditions:
          - "assessment.state == PENDING_SIGNALS"
          - "customer.account_status == ACTIVE"
          - "customer.ato_posture != CONTAINED"
          - "rule_pack.status == ACTIVE"
          - "risk_model.status == ACTIVE"
          - "decision_band_selection yields REVIEW and no AUTO_APPROVE_UNDER_AMOUNT exception override applies"
        side_effects:
          - "computes the same score fields as the APPROVE branch, sets decision REVIEW and decision_reason SCORE_BAND"
          - "leaves Customer.lifetime_net_approved_cents, approved_count and declined_count unchanged (no ledger movement in the REVIEW branch)"
          - "creates a ReviewCase in state QUEUED with assessment_id = this assessment, primary_signal_family copied from the assessment, sla_due_at = current_utc + SLA_SECONDS, and priority_score per §1.3 review_case_priority_score"
          - "recomputes device_profile.distinct_customer_count and reputation per §1.3 device_reputation_recompute"
          - "recomputes the shipping cluster root's distinct_customer_count, drop_risk_state and reshipper_confidence per §1.3 address_intelligence_recompute"
          - "increments RiskModel.scored_assessment_count by 1"
      - from: PENDING_SIGNALS
        to: DECIDED_DECLINE
        trigger: "POST /fraud/checkout-assessments/{id}/score resolving to decision DECLINE"
        actor: CheckoutService
        preconditions:
          - "assessment.state == PENDING_SIGNALS"
          - "customer.account_status == ACTIVE"
          - "customer.ato_posture != CONTAINED"
          - "rule_pack.status == ACTIVE"
          - "risk_model.status == ACTIVE"
          - "hard_decline_triggered == true OR blended_score >= rule_pack.decline_floor_score"
        side_effects:
          - "computes the same score fields as the APPROVE branch; decision_reason is HARD_RULE when hard_decline_triggered else SCORE_BAND"
          - "sets final_disposition DECLINED, decided_at = current_utc, good_customer_at_decision = customer.good_customer_flag"
          - "increments Customer.declined_count by 1 and Customer.version by 1; leaves lifetime_net_approved_cents unchanged"
          - "recomputes device_profile.distinct_customer_count and reputation, and the shipping cluster root's distinct_customer_count, drop_risk_state and reshipper_confidence"
          - "increments RiskModel.scored_assessment_count by 1"
        note: "A hard-decline rule forces this branch even when blended_score sits below review_floor_score."
      - from: IN_REVIEW
        to: DECIDED_APPROVE
        trigger: "POST /fraud/review-cases/{id}/resolve with action=APPROVE"
        actor: RiskAnalyst
        preconditions: ["review_case.state == ASSIGNED", "assessment.state == IN_REVIEW"]
        side_effects:
          - "sets decision_reason MANUAL_REVIEW, final_disposition APPROVED, decided_at = current_utc; decision stays REVIEW"
          - "increments Customer.approved_count by 1 and Customer.lifetime_net_approved_cents by amount_cents, recomputes good_customer_flag, increments Customer.version by 1"
          - "recomputes the shipping cluster root's approved_use_count, promo_redemption_count, drop_risk_state and reshipper_confidence, and device_profile.approved_use_count and reputation"
      - from: IN_REVIEW
        to: DECIDED_DECLINE
        trigger: "POST /fraud/review-cases/{id}/resolve with action=DECLINE, or the ATO containment cascade"
        actor: RiskAnalyst | system
        preconditions: ["review_case.state == ASSIGNED (manual path) OR customer.ato_posture transitions to CONTAINED (cascade path)"]
        side_effects:
          - "sets decision_reason MANUAL_REVIEW (manual path) or ATO_CONTAINMENT (cascade path), final_disposition DECLINED, decided_at = current_utc"
          - "increments Customer.declined_count by 1 and Customer.version by 1"
          - "recomputes device_profile.reputation and the shipping cluster root's drop_risk_state"

  # -------------------------------------------------------------- ReviewCase
  # CYCLIC: ASSIGNED -> ESCALATED -> ASSIGNED, and ASSIGNED -> QUEUED -> ASSIGNED.
  - entity: ReviewCase
    initial_state: QUEUED
    terminal_states: [RESOLVED_APPROVE, RESOLVED_DECLINE]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /fraud/review-cases/{id}/assign or POST /fraud/review-cases/{id}/auto-assign"
        actor: ReviewLead
        preconditions:
          - "review_case.state == QUEUED"
          - "analyst.status == AVAILABLE"
          - "review_case.primary_signal_family IN analyst.skill_families"
          - "analyst.open_case_count < analyst.shift_capacity_cases"
          - "explicit assign only: expected_analyst_version == analyst.version"
        side_effects:
          - "sets assigned_analyst_id and assigned_at = current_utc"
          - "increments Analyst.open_case_count by 1 and Analyst.version by 1"
          - "increments ReviewCase.version by 1"
      - from: ESCALATED
        to: ASSIGNED
        trigger: "POST /fraud/review-cases/{id}/assign or POST /fraud/review-cases/{id}/auto-assign"
        actor: ReviewLead
        preconditions:
          - "review_case.state == ESCALATED"
          - "analyst.seniority == LEAD"
          - "analyst.id != review_case.escalated_by_analyst_id"
          - "analyst.status == AVAILABLE"
          - "review_case.primary_signal_family IN analyst.skill_families"
          - "analyst.open_case_count < analyst.shift_capacity_cases"
          - "explicit assign only: expected_analyst_version == analyst.version"
        side_effects:
          - "sets assigned_analyst_id and assigned_at = current_utc"
          - "increments Analyst.open_case_count by 1 and Analyst.version by 1"
        note: "Closes the escalation cycle."
      - from: ASSIGNED
        to: ESCALATED
        trigger: "POST /fraud/review-cases/{id}/resolve with action=ESCALATE"
        actor: RiskAnalyst
        preconditions: ["review_case.state == ASSIGNED", "X-User-ID == review_case.assigned_analyst_id"]
        side_effects:
          - "sets escalated_by_analyst_id to the acting analyst, clears assigned_analyst_id to null, increments escalation_count by 1"
          - "decrements the previously assigned Analyst.open_case_count by 1 and increments that Analyst.version by 1"
          - "recomputes priority_score per §1.3 review_case_priority_score, now including ESCALATION_BOOST"
      - from: ASSIGNED
        to: QUEUED
        trigger: "POST /fraud/analysts/{id}/shift moving the assigned analyst to OFF_SHIFT or SUSPENDED"
        actor: system
        preconditions: ["review_case.state == ASSIGNED", "review_case.assigned_analyst_id == the analyst whose shift changed"]
        side_effects:
          - "CASCADE LINK 2 of the shift-release chain: clears assigned_analyst_id and assigned_at, increments requeue_count by 1"
          - "CASCADE LINK 3: sets the analyst's open_case_count to 0 and increments Analyst.version by 1, restoring the review_capacity_ledger invariant"
      - from: ASSIGNED
        to: RESOLVED_APPROVE
        trigger: "POST /fraud/review-cases/{id}/resolve with action=APPROVE"
        actor: RiskAnalyst
        preconditions: ["review_case.state == ASSIGNED", "X-User-ID == review_case.assigned_analyst_id OR X-User-Role == ReviewLead"]
        side_effects:
          - "sets resolved_at = current_utc, resolution_note, resolved_late = (resolved_at > sla_due_at)"
          - "decrements Analyst.open_case_count by 1, increments Analyst.resolved_case_count by 1 and Analyst.version by 1"
          - "cascades the assessment IN_REVIEW -> DECIDED_APPROVE with all of that transition's ledger side effects"
      - from: ASSIGNED
        to: RESOLVED_DECLINE
        trigger: "POST /fraud/review-cases/{id}/resolve with action=DECLINE, or the ATO containment cascade"
        actor: RiskAnalyst | system
        preconditions: ["review_case.state == ASSIGNED (manual path); no analyst precondition on the cascade path"]
        side_effects:
          - "sets resolved_at = current_utc and resolved_late; decrements Analyst.open_case_count by 1 and increments Analyst.version by 1 when an analyst held the case"
          - "cascades the assessment IN_REVIEW -> DECIDED_DECLINE"
      - from: QUEUED
        to: RESOLVED_DECLINE
        trigger: "ATO containment cascade (CASCADE LINK 4)"
        actor: system
        preconditions: ["review_case.state == QUEUED", "the case's assessment moved to DECIDED_DECLINE with decision_reason ATO_CONTAINMENT"]
        side_effects:
          - "sets resolved_at = current_utc and resolved_late; no analyst counter changes because assigned_analyst_id is null"
      - from: ESCALATED
        to: RESOLVED_DECLINE
        trigger: "ATO containment cascade (CASCADE LINK 4)"
        actor: system
        preconditions: ["review_case.state == ESCALATED", "the case's assessment moved to DECIDED_DECLINE with decision_reason ATO_CONTAINMENT"]
        side_effects:
          - "sets resolved_at = current_utc and resolved_late; no analyst counter changes because assigned_analyst_id is null"

  # ------------------------------------------------ AuthEvent.challenge_state
  # CYCLIC: ISSUED -> FAILED -> ISSUED (reissue) up to MAX_CHALLENGE_ATTEMPTS.
  # The `outcome` axis is frozen at creation (ALLOWED / STEP_UP_REQUIRED / BLOCKED)
  # and is what decides whether challenge_state starts at NONE or ISSUED.
  - entity: AuthEvent
    state_field: challenge_state
    initial_state: NONE
    terminal_states: [PASSED, EXPIRED]
    transitions:
      - from: NONE
        to: ISSUED
        trigger: "POST /fraud/auth-events with ato_score in the STEP_UP band"
        actor: system
        preconditions: ["ATO_STEPUP_FLOOR <= ato_score < ATO_BLOCK_FLOOR"]
        side_effects:
          - "sets challenge_method OTP_SMS and challenge_expires_at = current_utc + CHALLENGE_TTL_SECONDS"
          - "moves Customer.ato_posture CLEAR -> WATCH"
      - from: ISSUED
        to: PASSED
        trigger: "POST /fraud/auth-events/{id}/challenge with action=PASS"
        actor: CheckoutService
        preconditions: ["challenge_state == ISSUED", "current_utc < challenge_expires_at"]
        side_effects:
          - "sets Customer.failed_login_count to 0 and moves Customer.ato_posture WATCH -> CLEAR"
          - "increments AuthEvent.version by 1"
      - from: ISSUED
        to: FAILED
        trigger: "POST /fraud/auth-events/{id}/challenge with action=FAIL"
        actor: CheckoutService
        preconditions: ["challenge_state == ISSUED", "current_utc < challenge_expires_at"]
        side_effects:
          - "increments challenge_attempts by 1 and Customer.failed_login_count by 1"
          - "CASCADE LINK 1 of the ATO containment chain when challenge_attempts reaches MAX_CHALLENGE_ATTEMPTS: moves Customer.ato_posture to CONTAINED, which fires links 2–4"
          - "increments AuthEvent.version by 1"
      - from: FAILED
        to: ISSUED
        trigger: "POST /fraud/auth-events/{id}/challenge with action=REISSUE"
        actor: CheckoutService
        preconditions: ["challenge_state == FAILED", "challenge_attempts < MAX_CHALLENGE_ATTEMPTS", "customer.ato_posture != CONTAINED"]
        side_effects:
          - "sets challenge_method to the supplied method (default OTP_SMS) and challenge_expires_at = current_utc + CHALLENGE_TTL_SECONDS"
          - "leaves challenge_attempts unchanged"
        note: "The retry cycle. Rejected once attempts have reached MAX_CHALLENGE_ATTEMPTS."
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /fraud/auth-events/{id}/challenge with action=EXPIRE"
        actor: CheckoutService
        preconditions: ["challenge_state == ISSUED", "current_utc >= challenge_expires_at"]
        side_effects:
          - "leaves Customer.ato_posture at WATCH and failed_login_count unchanged"
          - "increments AuthEvent.version by 1"

  # ----------------------------------------------------------------- RulePack
  - entity: RulePack
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fraud/rule-packs/{id}/activate"
        actor: PolicyEngineer
        preconditions:
          - "rule_pack.status == DRAFT"
          - "X-User-ID != rule_pack.created_by_user_id (segregation of duties)"
          - "rule_count >= 1"
          - "rule_weight + model_weight == 1.00"
          - "review_floor_score < decline_floor_score"
          - "no RulePack with status IN {ACTIVE, RETIRED} whose buffer-inflated window collides per §1.4 priority 75"
        side_effects:
          - "sets status ACTIVE, activated_at = current_utc, activated_by_user_id = X-User-ID, increments version by 1"
          - "CASCADE: every other RulePack with status == ACTIVE and effective_until <= this pack's effective_from moves to RETIRED with retired_at = current_utc and version incremented by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "successor activation cascade (see DRAFT -> ACTIVE side effects)"
        actor: system
        preconditions: ["rule_pack.status == ACTIVE", "rule_pack.effective_until <= successor.effective_from"]
        side_effects:
          - "sets retired_at = current_utc and increments version by 1"
          - "any PENDING_SIGNALS assessment pinned to this pack can no longer be scored (§1.4 priority 62)"

  # ---------------------------------------------------------------- RiskModel
  # CYCLIC (SHADOW -> DRAFT) plus a conditional fork out of DRAFT.
  - entity: RiskModel
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: TRAINING
        trigger: "POST /fraud/risk-models/{id}/lifecycle with action=START_TRAINING"
        actor: PolicyEngineer
        preconditions:
          - "risk_model.status == DRAFT"
          - "trained_on_chargeback_cutoff_at is not null"
          - "for EVERY reason_code in REQUIRED_TRAINING_SEGMENTS, count of ChargebackRecord rows with state == LOST and received_at < trained_on_chargeback_cutoff_at is >= MIN_SAMPLES_PER_SEGMENT per §1.3 model_training_segment_eligibility"
        side_effects:
          - "freezes training_segment_counts to the per-reason_code counts computed by §1.3 model_training_segment_eligibility"
          - "increments version by 1"
      - from: DRAFT
        to: SHADOW
        trigger: "POST /fraud/risk-models/{id}/lifecycle with action=PUBLISH_SHADOW (cold-start branch)"
        actor: PolicyEngineer
        preconditions: ["risk_model.status == DRAFT", "trained_on_chargeback_cutoff_at is null"]
        side_effects: ["increments version by 1"]
        note: "Only cold-start models (null cutoff) may skip TRAINING."
      - from: TRAINING
        to: SHADOW
        trigger: "POST /fraud/risk-models/{id}/lifecycle with action=PUBLISH_SHADOW"
        actor: PolicyEngineer
        preconditions: ["risk_model.status == TRAINING"]
        side_effects: ["increments version by 1"]
      - from: SHADOW
        to: DRAFT
        trigger: "POST /fraud/risk-models/{id}/lifecycle with action=REJECT"
        actor: PolicyEngineer
        preconditions: ["risk_model.status == SHADOW"]
        side_effects:
          - "clears training_segment_counts to null"
          - "increments version by 1"
        note: "Retraining loop — makes the machine cyclic (DRAFT -> TRAINING -> SHADOW -> DRAFT)."
      - from: SHADOW
        to: ACTIVE
        trigger: "POST /fraud/risk-models/{id}/lifecycle with action=PROMOTE"
        actor: PolicyEngineer
        preconditions: ["risk_model.status == SHADOW"]
        side_effects:
          - "sets promoted_at = current_utc and increments version by 1"
          - "CASCADE: the RiskModel previously in status ACTIVE (at most one) moves to RETIRED with retired_at = current_utc and version incremented by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /fraud/risk-models/{id}/lifecycle with action=RETIRE, or the promotion cascade above"
        actor: PolicyEngineer | system
        preconditions: ["risk_model.status == ACTIVE"]
        side_effects:
          - "sets retired_at = current_utc and increments version by 1"
          - "assessments pinned to this model can no longer be scored (§1.4 priority 63); new assessments fail with ERR_NO_ACTIVE_RISK_MODEL until another model is promoted"

  # --------------------------------------------------------- ChargebackRecord
  - entity: ChargebackRecord
    initial_state: RECEIVED
    terminal_states: [WON, LOST]
    transitions:
      - from: RECEIVED
        to: REPRESENTED
        trigger: "POST /fraud/chargebacks/{id}/transition with action=REPRESENT"
        actor: PlatformAdmin
        preconditions: ["chargeback.state == RECEIVED"]
        side_effects: ["stores evidence_note and increments version by 1"]
      - from: REPRESENTED
        to: WON
        trigger: "POST /fraud/chargebacks/{id}/transition with action=WIN"
        actor: PlatformAdmin
        preconditions: ["chargeback.state == REPRESENTED"]
        side_effects:
          - "sets resolved_at = current_utc, guarantee_state stays NOT_APPLICABLE"
          - "sets the assessment's outcome_label to LEGIT; Customer.lifetime_net_approved_cents is unchanged"
      - from: RECEIVED
        to: LOST
        trigger: "POST /fraud/chargebacks/{id}/transition with action=LOSE (liability accepted without representment)"
        actor: PlatformAdmin
        preconditions: ["chargeback.state == RECEIVED"]
        side_effects: ["identical to the REPRESENTED -> LOST cascade below"]
      - from: REPRESENTED
        to: LOST
        trigger: "POST /fraud/chargebacks/{id}/transition with action=LOSE"
        actor: PlatformAdmin
        preconditions: ["chargeback.state == REPRESENTED"]
        side_effects:
          - "CASCADE LINK 1: sets state LOST, resolved_at = current_utc, increments version by 1, and evaluates §1.3 guarantee_liability_evaluation to fill guarantee_state / guarantee_denial_reason / guarantee_eligible_cents / guarantee_fee_cents / guarantee_reimbursed_cents"
          - "CASCADE LINK 2 (only when reason_code IN {FRAUD_CNP, FRAUD_ATO}): sets the assessment's outcome_label to FRAUD"
          - "CASCADE LINK 3 (caused by link 2): decrements Customer.lifetime_net_approved_cents by the ASSESSMENT's amount_cents (not the chargeback amount), increments Customer.confirmed_fraud_count by 1, and increments Customer.version by 1"
          - "CASCADE LINK 4 (caused by link 3): recomputes Customer.good_customer_flag per §1.3 customer_good_standing — confirmed_fraud_count > 0 forces false"
          - "CASCADE LINK 5 (caused by link 4, only when the flag actually flipped): recomputes priority_score per §1.3 review_case_priority_score for every ReviewCase in state IN {QUEUED, ASSIGNED, ESCALATED} whose assessment belongs to this customer, incrementing each ReviewCase.version by 1"
          - "ALSO caused by link 2: RECOMPUTES the device_profile's counters and reputation per §1.3 device_reputation_recompute, and RECOMPUTES the shipping cluster root's counters, drop_risk_state and reshipper_confidence per §1.3 address_intelligence_recompute. Both are COUNTs over assessments, never increments, so a second LOST chargeback on the same assessment leaves them unchanged."
        note: "Non-fraud reason codes stop after link 1: outcome_label stays UNKNOWN, no ledger reversal, guarantee_state DENIED with reason REASON_NOT_COVERED."

  # ----------------------------------------------------------- PolicyException
  - entity: PolicyException
    initial_state: REQUESTED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /fraud/policy-exceptions/{id}/decision with action=APPROVE"
        actor: ReviewLead
        preconditions:
          - "exception.state == REQUESTED"
          - "customer.account_status == ACTIVE"
          - "expected_customer_version == customer.version"
          - "X-User-ID != exception.requested_by_analyst_id (segregation of duties)"
        side_effects:
          - "sets state APPROVED, approved_by_analyst_id = X-User-ID, decided_at = current_utc, decision_note"
          - "increments Customer.version by 1 (the customer's policy surface changed)"
          - "increments PolicyException.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /fraud/policy-exceptions/{id}/decision with action=REJECT"
        actor: ReviewLead
        preconditions:
          - "exception.state == REQUESTED"
          - "expected_customer_version == customer.version"
          - "X-User-ID != exception.requested_by_analyst_id"
        side_effects:
          - "sets state REJECTED, decided_at = current_utc, decision_note; approved_by_analyst_id stays null"
          - "increments Customer.version by 1 and PolicyException.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /fraud/policy-exceptions/{id}/decision with action=REVOKE"
        actor: ReviewLead
        preconditions:
          - "exception.state == APPROVED"
          - "expected_customer_version == customer.version"
        side_effects:
          - "sets state REVOKED and decided_at = current_utc; consumed_count is preserved"
          - "increments Customer.version by 1 and PolicyException.version by 1"
          - "assessments scored after this instant no longer see the exception"
        note: "REVOKE is exempt from the segregation-of-duties check — the requester may revoke their own exception."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: case-assign-stale-analyst
    parent_entity: Analyst
    write_endpoint: "POST /fraud/review-cases/{id}/assign"
    occ_field: "expected_analyst_version"
    description: |
      Assigning a ReviewCase to an Analyst whose version has advanced since the
      client last read that analyst is rejected. This captures the case where the
      client's view of the analyst's capacity (open_case_count vs
      shift_capacity_cases) is stale because another case was already assigned to
      the same analyst — an operation that legitimately succeeds on its own, so
      the second assignment cannot be rejected by any state precondition: the
      case being assigned is still QUEUED and the analyst is still AVAILABLE with
      headroom. Only the stale version distinguishes the two requests.
    error_id: ERR_STALE_ANALYST_VERSION
    http_status: 412

  - rule_id: exception-decision-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /fraud/policy-exceptions/{id}/decision"
    occ_field: "expected_customer_version"
    description: |
      Deciding a PolicyException against a Customer whose version has advanced
      since the client last read that customer is rejected. The client's view of
      the customer's policy surface (tier, account_status, and the set of already
      APPROVED exceptions that this decision would stack on top of) is stale. A
      second decision on a different REQUESTED exception for the same customer is
      legitimate on its own — both exceptions are REQUESTED and the customer is
      ACTIVE — so no state precondition rejects it; only the stale version does.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# Rounding is ROUND_HALF_UP everywhere unless a rule says otherwise. All money is
# integer cents. All instants come from the logical clock (§1.5 /_clock).
# =============================================================================
global_constants:
  SLA_SECONDS: 14400                      # ReviewCase.sla_due_at = created_at + 4h
  CHALLENGE_TTL_SECONDS: 900              # step-up challenge lifetime
  MAX_CHALLENGE_ATTEMPTS: 3               # 3rd FAIL contains the account
  ATO_STEPUP_FLOOR: 45.00                 # inclusive
  ATO_BLOCK_FLOOR: 75.00                  # inclusive
  VELOCITY_CUSTOMER_WINDOW_SECONDS: 3600
  VELOCITY_DEVICE_WINDOW_SECONDS: 86400
  VELOCITY_PROMO_WINDOW_SECONDS: 2592000  # 30 days
  GOOD_CUSTOMER_MIN_APPROVED: 2
  GOOD_CUSTOMER_MIN_NET_CENTS: 20000
  GOOD_CUSTOMER_BOOST: 20.00
  ESCALATION_BOOST: 15.00
  AMOUNT_TERM_CAP: 20.00
  RULE_SCORE_CAP: 100
  BLENDED_SCORE_CAP: 200.00
  RULE_DOMINANT_MODEL_DAMPEN: 0.35
  RULE_DOMINANT_UPLIFT: 1.25
  REQUIRED_TRAINING_SEGMENTS: [FRAUD_CNP, FRAUD_ATO]
  MIN_SAMPLES_PER_SEGMENT: 2
  GUARANTEE_COVERAGE_CAP_CENTS: 500000
  GUARANTEE_FEE_BPS: 250                  # 2.50 %, floored
  GUARANTEE_COVERED_REASON_CODES: [FRAUD_CNP, FRAUD_ATO]
  RULE_PACK_ACTIVATION_FREEZE_SECONDS: 3600
  TIER_EXCEPTION_CAP_CENTS: { STANDARD: 50000, HIGH_VALUE: 500000, BUSINESS: 2000000 }
  TIER_PRIORITY_BOOST: { STANDARD: 0.00, HIGH_VALUE: 10.00, BUSINESS: 15.00 }
  ATO_EVENT_BASE: { LOGIN: 10.00, PASSWORD_CHANGE: 25.00, EMAIL_CHANGE: 30.00, SHIP_ADDRESS_ADD: 20.00, PAYMENT_INSTRUMENT_ADD: 35.00 }

calculations:

  # -------------------------------------------------------------------- 1 / 16
  - name: velocity_signal_window
    algorithm_type: aggregation
    applies_to: CheckoutAssessment
    trigger: "POST /fraud/checkout-assessments/{id}/score"
    input_set: "CheckoutAssessment rows other than the one being scored, filtered by the three windows below against `now` = the logical clock at the scoring instant"
    formula: |
      velocity_customer_assessment_count_1h =
        COUNT(a) WHERE a.customer_id == self.customer_id
                   AND a.id != self.id
                   AND a.created_at >= now - VELOCITY_CUSTOMER_WINDOW_SECONDS   # INCLUSIVE lower bound
                   AND a.created_at <= now                                      # INCLUSIVE upper bound
          -- a.state is NOT filtered: PENDING_SIGNALS attempts count as velocity.

      velocity_device_distinct_card_bin_count_24h =
        COUNT(DISTINCT a.card_bin) WHERE (a.device_profile_id == self.device_profile_id
                                          AND a.created_at >= now - VELOCITY_DEVICE_WINDOW_SECONDS
                                          AND a.created_at <= now)
                                       OR a.id == self.id
          -- self.card_bin IS included, so the minimum value is 1.

      velocity_promo_address_count_30d =
        COUNT(a) WHERE a.promo_code IS NOT NULL
                   AND a.id != self.id
                   AND resolve_cluster(a.shipping_address_id) == resolve_cluster(self.shipping_address_id)
                   AND a.created_at >= now - VELOCITY_PROMO_WINDOW_SECONDS
                   AND a.created_at <= now
          -- resolve_cluster(x) = AddressRecord(x).canonical_address_id
          -- self is excluded even when self.promo_code is non-null.
    precision: "integer counts"
    notes:
      - "Lower bounds are INCLUSIVE: a sibling assessment created at exactly now - 3600 is still counted."
      - "Windows are evaluated against the logical clock, so a POST /_clock/set_current_utc between two creations is what pushes a row out of the window."

  # -------------------------------------------------------------------- 2 / 16
  - name: rule_score_evaluation
    algorithm_type: chronological
    applies_to: CheckoutAssessment
    trigger: "POST /fraud/checkout-assessments/{id}/score"
    input_set: "FraudRule rows with rule_pack_id == assessment.rule_pack_id, walked in evaluation_order ASC, ties broken by created_at ASC"
    formula: |
      PINNED EVALUATION ORDER — rules are evaluated one at a time in
      (evaluation_order ASC, created_at ASC) and the walk SHORT-CIRCUITS on the
      first rule with hard_decline == true that fires. Rules after the
      short-circuit are never evaluated and never appear in triggered_rule_codes.

      suppress_address_family = TRUE iff there exists a PolicyException e with
        e.state == APPROVED AND e.customer_id == assessment.customer_id
        AND e.scope == ADDRESS_WHITELIST
        AND e.effective_from <= now < e.expires_at
        AND resolve_cluster(e.whitelisted_address_id) == resolve_cluster(assessment.shipping_address_id)

      predicate(code) for each rule:
        DEV_MULTI_ACCOUNT      : device.distinct_customer_count >= 3      # value BEFORE this assessment's recompute
        DEV_EMULATOR           : device.emulator_flag == true
        BEH_FAST_CHECKOUT      : assessment.session_seconds < 45
        BEH_BULK_CART          : assessment.cart_item_count >= 10
        VEL_CUSTOMER_1H        : velocity_customer_assessment_count_1h >= 3
        VEL_DEVICE_CARD_24H    : velocity_device_distinct_card_bin_count_24h >= 3
        ID_GEO_MISMATCH        : assessment.ip_country != AddressRecord(billing_address_id).country_code
        ADDR_DROP_RISK         : cluster_root(shipping_address_id).drop_risk_state == KNOWN_DROP
        ADDR_FREIGHT_FORWARDER : AddressRecord(shipping_address_id).classification == FREIGHT_FORWARDER
        PROMO_ADDRESS_ABUSE    : assessment.promo_code IS NOT NULL AND velocity_promo_address_count_30d >= 2

      A rule FIRES iff predicate(code) is true AND NOT (rule.signal_family == ADDRESS
      AND suppress_address_family). A suppressed ADDRESS rule is skipped entirely:
      it adds no points, is absent from triggered_rule_codes, and cannot
      short-circuit even when hard_decline is true — but it DOES set
      applied_exception_id to the whitelisting exception.

      rule_score              = MIN(RULE_SCORE_CAP, SUM(points of fired rules))
      triggered_rule_codes    = codes of fired rules in evaluation order
      hard_decline_triggered  = TRUE iff a fired rule had hard_decline == true
      primary_signal_family   = signal_family of the fired rule with the highest
                                points; ties broken by the LOWEST evaluation_order;
                                MODEL when no rule fired.
    precision: "integer points, capped at 100"

  # -------------------------------------------------------------------- 3 / 16
  - name: model_point_calibration
    algorithm_type: weighted_scoring
    applies_to: CheckoutAssessment
    trigger: "POST /fraud/checkout-assessments/{id}/score"
    input_set: "assessment.model_raw_probability and the pinned RiskModel's calibration_intercept / calibration_slope"
    formula: |
      p_cal        = model.calibration_intercept + model.calibration_slope * assessment.model_raw_probability
      p_clamped    = MIN(1.0000, MAX(0.0000, p_cal))          # clamp BEFORE scaling
      model_points = ROUND_HALF_UP(p_clamped * 100, 2)        # 0.00 .. 100.00
    precision: "2 decimals, ROUND_HALF_UP; clamping happens on the probability, not on the points"
    notes:
      - "Clamping before scaling matters: intercept 0.20 + slope 2.00 * 0.9000 = 1.9800 clamps to 1.0000 -> 100.00, not 198.00."

  # -------------------------------------------------------------------- 4 / 16
  - name: blended_risk_score
    algorithm_type: weighted_scoring
    applies_to: CheckoutAssessment
    trigger: "POST /fraud/checkout-assessments/{id}/score"
    input_set: "rule_score and model_points of the assessment plus the pinned RulePack's blend_mode / rule_weight / model_weight"
    variants:
      - name: WEIGHTED
        selector: "rule_pack.blend_mode == WEIGHTED"
        formula: |
          blended_score = MIN(BLENDED_SCORE_CAP,
                              ROUND_HALF_UP(rule_pack.rule_weight  * rule_score
                                          + rule_pack.model_weight * model_points, 2))
          -- ONE rounding step over the whole weighted sum. The two products are
          -- NOT rounded individually.
      - name: RULE_DOMINANT
        selector: "rule_pack.blend_mode == RULE_DOMINANT"
        formula: |
          inner_model_term = ROUND_HALF_UP(model_points * RULE_DOMINANT_MODEL_DAMPEN, 1)   # 1 DECIMAL
          blended_score    = MIN(BLENDED_SCORE_CAP,
                                 ROUND_HALF_UP((rule_score + inner_model_term)
                                               * RULE_DOMINANT_UPLIFT, 2))
          -- PINNED NESTED ROUNDING ORDER: the damped model term is rounded to ONE
          -- decimal FIRST, then the uplift multiplies the already-rounded sum and
          -- the result is rounded to two decimals. Collapsing the two steps
          -- produces a different score.
          -- rule_weight and model_weight are ignored in this mode (they are still
          -- required to sum to 1.00 by the §1.1 constraint).
    precision: "2 decimals, ROUND_HALF_UP, hard cap 200.00"
    notes:
      - "Worked WEIGHTED example (rule_weight 0.40, model_weight 0.60, rule_score 20, model_points 53.25): 0.40*20 = 8.00, 0.60*53.25 = 31.95, sum 39.95 -> 39.95."
      - "Same inputs under RULE_DOMINANT: ROUND_HALF_UP(53.25*0.35, 1) = ROUND_HALF_UP(18.6375, 1) = 18.6; (20 + 18.6)*1.25 = 48.25 -> 48.25. Divergence 8.30 points, and the two variants land in different decision bands."
      - "Naive single-step RULE_DOMINANT would give ROUND_HALF_UP((20 + 18.6375)*1.25, 2) = ROUND_HALF_UP(48.296875, 2) = 48.30 — 0.05 off the pinned 48.25."

  # -------------------------------------------------------------------- 5 / 16
  - name: decision_band_selection
    algorithm_type: threshold
    applies_to: CheckoutAssessment
    trigger: "POST /fraud/checkout-assessments/{id}/score"
    input_set: "blended_score, hard_decline_triggered, the pinned RulePack's floors, and APPROVED PolicyException rows for the customer whose window contains `now`"
    formula: |
      PINNED PRECEDENCE — first matching clause wins:
        1. hard_decline_triggered == true
             -> decision DECLINE, decision_reason HARD_RULE
             (no PolicyException can rescue a hard decline)
        2. blended_score >= rule_pack.decline_floor_score            # INCLUSIVE
             -> decision DECLINE, decision_reason SCORE_BAND
             (an AUTO_APPROVE_UNDER_AMOUNT exception cannot rescue the DECLINE band)
        3. blended_score >= rule_pack.review_floor_score             # INCLUSIVE
             3a. an eligible band-stage exception exists
                 -> decision APPROVE, decision_reason POLICY_EXCEPTION,
                    applied_exception_id = that exception
             3b. otherwise -> decision REVIEW, decision_reason SCORE_BAND
        4. otherwise -> decision APPROVE, decision_reason SCORE_BAND

      An exception e is an eligible band-stage exception iff
        e.state == APPROVED AND e.customer_id == assessment.customer_id
        AND e.scope == AUTO_APPROVE_UNDER_AMOUNT
        AND e.effective_from <= now < e.expires_at        # half-open window
        AND assessment.amount_cents <= e.max_amount_cents
      Tie-break when several qualify: highest max_amount_cents, then earliest
      created_at.

      applied_exception_id precedence: a band-stage exception (3a) always wins the
      slot; the rule-stage ADDRESS_WHITELIST exception only fills it when no
      band-stage exception was applied.
    precision: "band comparisons use the 2-decimal blended_score exactly as stored"
    notes:
      - "blended_score exactly equal to review_floor_score lands in REVIEW; exactly equal to decline_floor_score lands in DECLINE."

  # -------------------------------------------------------------------- 6 / 16
  - name: customer_good_standing
    algorithm_type: threshold
    applies_to: Customer
    trigger: "any write that changes account_status, ato_posture, approved_count, confirmed_fraud_count or lifetime_net_approved_cents"
    input_set: "the customer row itself, after the current request's counter updates have been applied"
    formula: |
      good_customer_flag = (account_status == ACTIVE)
                       AND (ato_posture != CONTAINED)
                       AND (confirmed_fraud_count == 0)
                       AND (approved_count >= GOOD_CUSTOMER_MIN_APPROVED)          # 2
                       AND (lifetime_net_approved_cents >= GOOD_CUSTOMER_MIN_NET_CENTS)  # 20000
    precision: boolean
    notes:
      - "Recomputed AFTER the counters move, so the approval that reaches the 2nd approved order flips the flag inside that same request."
      - "A single confirmed fraud permanently forces false: confirmed_fraud_count never decreases."

  # -------------------------------------------------------------------- 7 / 16
  - name: review_case_priority_score
    algorithm_type: weighted_scoring
    applies_to: ReviewCase
    trigger: "case creation, ASSIGNED -> ESCALATED, and the chargeback good-customer cascade"
    input_set: "the case's assessment (blended_score, amount_cents), the assessment's customer (tier, good_customer_flag AS IT IS AT RECOMPUTE TIME), and the case's own escalation_count"
    formula: |
      amount_term   = MIN(AMOUNT_TERM_CAP, ROUND_HALF_UP(assessment.amount_cents / 10000.0, 2))
      priority_score = ROUND_HALF_UP( assessment.blended_score * 0.50
                                    + amount_term
                                    + TIER_PRIORITY_BOOST[customer.tier]
                                    + (customer.good_customer_flag ? GOOD_CUSTOMER_BOOST : 0.00)
                                    + (case.escalation_count > 0   ? ESCALATION_BOOST    : 0.00)
                                    , 2)
    precision: "2 decimals, ROUND_HALF_UP"
    notes:
      - "Worked example (blended_score 50.00, amount_cents 75000, tier STANDARD, good customer, never escalated): 25.00 + 7.50 + 0.00 + 20.00 + 0.00 = 52.50."
      - "Same case after the good-customer flag is lost to a confirmed fraud: 25.00 + 7.50 = 32.50."
      - "Unlike good_customer_at_decision on the assessment, this term reads the customer's CURRENT flag, which is what makes the chargeback cascade reach the queue."

  # -------------------------------------------------------------------- 8 / 16
  - name: review_queue_selector
    algorithm_type: topological
    applies_to: ReviewCase
    trigger: "POST /fraud/review-cases/{id}/auto-assign"
    input_set: "Analyst rows with status == AVAILABLE, open_case_count < shift_capacity_cases, and case.primary_signal_family IN skill_families"
    formula: |
      SELECTOR POLICY — the eligible pool is filtered, then ordered, then the head
      is taken:
        filter:
          analyst.status == AVAILABLE
          AND case.primary_signal_family IN analyst.skill_families
          AND analyst.open_case_count < analyst.shift_capacity_cases
          AND (case.state != ESCALATED OR analyst.seniority == LEAD)
          AND (case.state != ESCALATED OR analyst.id != case.escalated_by_analyst_id)
        order (PINNED, first key wins):
          1. remaining_headroom = shift_capacity_cases - open_case_count  DESC
          2. seniority rank ASC  (JUNIOR=0, SENIOR=1, LEAD=2)   # cheapest qualified analyst first
          3. created_at ASC
          4. id ASC
        result: the head of the ordered pool; an EMPTY pool is an error
                (ERR_NO_ELIGIBLE_ANALYST), never a no-op.
    precision: "deterministic total order — no ties can survive key 4"

  # -------------------------------------------------------------------- 9 / 16
  - name: ato_score_evaluation
    algorithm_type: weighted_scoring
    applies_to: AuthEvent
    trigger: "POST /fraud/auth-events"
    input_set: "the auth event's inputs, the customer (home_country, failed_login_count), and the device (reputation) — all read BEFORE this event's own side effects"
    formula: |
      device_first_seen_for_customer =
        NOT EXISTS (AuthEvent a WHERE a.customer_id == self.customer_id
                                  AND a.device_profile_id == self.device_profile_id
                                  AND a.id != self.id)
        AND NOT EXISTS (CheckoutAssessment c WHERE c.customer_id == self.customer_id
                                              AND c.device_profile_id == self.device_profile_id)

      geo_term    = (self.ip_country != customer.home_country) ? 25.00 : 0.00
      device_term = device_first_seen_for_customer ? 20.00
                    : (device.reputation == BLOCKED ? 40.00
                       : device.reputation == SUSPECT ? 15.00 : 0.00)
        -- PINNED: first-seen SUPPRESSES the reputation term; the two are never summed.
      failed_term = MIN(15.00, customer.failed_login_count * 5.00)

      ato_score = MIN(100.00, ROUND_HALF_UP(ATO_EVENT_BASE[event_type]
                                          + geo_term + device_term + failed_term, 2))

      outcome = ato_score >= ATO_BLOCK_FLOOR   ? BLOCKED             # 75.00 inclusive
              : ato_score >= ATO_STEPUP_FLOOR  ? STEP_UP_REQUIRED    # 45.00 inclusive
              :                                  ALLOWED
      challenge_state starts at ISSUED for STEP_UP_REQUIRED, NONE otherwise.
    precision: "2 decimals, ROUND_HALF_UP, capped at 100.00"
    notes:
      - "Worked example: PASSWORD_CHANGE (25.00) + geo mismatch (25.00) on a known device with 0 prior failures = 50.00 -> STEP_UP_REQUIRED."
      - "Worked example: PAYMENT_INSTRUMENT_ADD (35.00) + geo mismatch (25.00) + failed_term capped at 15.00 = 75.00 -> BLOCKED exactly at the floor."

  # ------------------------------------------------------------------- 10 / 16
  - name: device_reputation_recompute
    algorithm_type: threshold
    applies_to: DeviceProfile
    trigger: "assessment scoring, manual review resolution, and the chargeback fraud cascade"
    input_set: "the device's own counters after they have been recomputed for the current request"
    formula: |
      distinct_customer_count = COUNT(DISTINCT customer_id) over
        (CheckoutAssessment rows on this device with decision IS NOT NULL)
        UNION (AuthEvent rows on this device)
      approved_use_count  = COUNT(CheckoutAssessment on this device WHERE state == DECIDED_APPROVE)
      fraud_confirmed_count = COUNT(CheckoutAssessment on this device WHERE outcome_label == FRAUD)

      PINNED ORDER — first match wins:
        fraud_confirmed_count >= 2                                        -> BLOCKED
        fraud_confirmed_count == 1 OR distinct_customer_count >= 3
          OR emulator_flag == true                                        -> SUSPECT
        fraud_confirmed_count == 0 AND approved_use_count >= 3
          AND distinct_customer_count <= 2                                -> TRUSTED
        otherwise                                                         -> NEW
    precision: "enum"
    notes:
      - "BLOCKED is absorbing in practice because fraud_confirmed_count never decreases."

  # ------------------------------------------------------------------- 11 / 16
  - name: address_intelligence_recompute
    algorithm_type: aggregation
    applies_to: AddressRecord
    trigger: "assessment scoring, manual review resolution, and the chargeback fraud cascade"
    input_set: "every CheckoutAssessment whose shipping_address_id resolves (via canonical_address_id) to this cluster root; variant rows contribute to the ROOT's counters and keep their own at 0"
    formula: |
      cluster(root) = { root } UNION { a : a.canonical_parent_address_id == root.id }

      distinct_customer_count = COUNT(DISTINCT customer_id) over assessments shipping
                                to cluster(root) WHERE decision IS NOT NULL
      approved_use_count      = COUNT(... WHERE state == DECIDED_APPROVE)
      fraud_confirmed_count   = COUNT(... WHERE outcome_label == FRAUD)
      promo_redemption_count  = COUNT(... WHERE promo_code IS NOT NULL AND state == DECIDED_APPROVE)

      drop_risk_state — PINNED ORDER, first match wins:
        fraud_confirmed_count >= 2                                            -> KNOWN_DROP
        root.classification == FREIGHT_FORWARDER AND distinct_customer_count >= 3 -> KNOWN_DROP
        fraud_confirmed_count == 1 OR distinct_customer_count >= 3
          OR root.classification IN {FREIGHT_FORWARDER, PO_BOX}               -> WATCH
        otherwise                                                             -> CLEAN

      reshipper_confidence = ROUND_HALF_UP(MIN(1.00,
          0.20 * MIN(distinct_customer_count, 3)
        + 0.15 * MIN(promo_redemption_count, 2)
        + (root.classification == FREIGHT_FORWARDER ? 0.30 : 0.00)
        + (root.classification == PO_BOX            ? 0.10 : 0.00)), 2)
    precision: "integer counts; reshipper_confidence 2 decimals ROUND_HALF_UP"
    notes:
      - "All four counters and both derived fields live on the cluster ROOT only. A variant row (canonical_parent_address_id non-null) always reports 0 / CLEAN / 0.00."
      - "Worked example (1 distinct customer, 0 promo redemptions, RESIDENTIAL root): 0.20 * 1 = 0.20."

  # ------------------------------------------------------------------- 12 / 16
  - name: policy_exception_tier_cap
    algorithm_type: tiered_pricing
    applies_to: PolicyException
    trigger: "POST /fraud/policy-exceptions"
    input_set: "the beneficiary Customer's tier and the requested max_amount_cents"
    formula: |
      cap = TIER_EXCEPTION_CAP_CENTS[customer.tier]     # STANDARD 50000, HIGH_VALUE 500000, BUSINESS 2000000
      max_amount_cents > cap  -> ERR_EXCEPTION_AMOUNT_EXCEEDS_TIER_CAP (422)
      max_amount_cents == cap -> accepted (the cap is INCLUSIVE)

      scope == AUTO_APPROVE_UNDER_AMOUNT requires customer.tier IN {HIGH_VALUE, BUSINESS}
        -> otherwise ERR_EXCEPTION_TIER_NOT_ELIGIBLE (422)
      scope == ADDRESS_WHITELIST is available to every tier and still honours the cap.
    precision: "integer cents, inclusive cap"

  # ------------------------------------------------------------------- 13 / 16
  - name: guarantee_liability_evaluation
    algorithm_type: waterfall_allocation
    applies_to: ChargebackRecord
    trigger: "POST /fraud/chargebacks/{id}/transition with action=LOSE"
    input_set: "the chargeback (liability_shift, reason_code, amount_cents) and its assessment (applied_exception_id, decision, decision_reason, amount_cents)"
    formula: |
      PINNED WATERFALL — the FIRST failing test decides guarantee_denial_reason and
      no later test is evaluated:
        T1  liability_shift == true
              -> DENIED / LIABILITY_SHIFTED
        T2  reason_code NOT IN GUARANTEE_COVERED_REASON_CODES
              -> DENIED / REASON_NOT_COVERED
        T3  assessment.applied_exception_id IS NOT NULL
              -> DENIED / EXCEPTION_OVERRIDE
        T4  assessment.decision != APPROVE OR assessment.decision_reason == MANUAL_REVIEW
              -> DENIED / DECISION_NOT_ELIGIBLE
        else -> REIMBURSED / guarantee_denial_reason = null

      DENIED: guarantee_eligible_cents = guarantee_fee_cents = guarantee_reimbursed_cents = 0
      REIMBURSED:
        guarantee_eligible_cents   = MIN(chargeback.amount_cents,
                                         assessment.amount_cents,
                                         GUARANTEE_COVERAGE_CAP_CENTS)
        guarantee_fee_cents        = FLOOR(guarantee_eligible_cents * GUARANTEE_FEE_BPS / 10000)
        guarantee_reimbursed_cents = guarantee_eligible_cents - guarantee_fee_cents
    precision: "integer cents; the fee is FLOORed (never rounded up)"
    notes:
      - "Worked example (chargeback 75000, assessment 75000, machine-approved, no exception, no liability shift): eligible 75000, fee FLOOR(75000*250/10000) = FLOOR(1875.0) = 1875, reimbursed 73125."
      - "T1 precedes T2, so a liability-shifted PRODUCT_NOT_RECEIVED chargeback denies with LIABILITY_SHIFTED, not REASON_NOT_COVERED."
      - "guarantee_state stays NOT_APPLICABLE on the WON path; the waterfall only runs on LOSE."

  # ------------------------------------------------------------------- 14 / 16
  - name: model_training_segment_eligibility
    algorithm_type: aggregation
    applies_to: RiskModel
    trigger: "POST /fraud/risk-models/{id}/lifecycle with action=START_TRAINING"
    input_set: "ChargebackRecord rows with state == LOST and received_at < model.trained_on_chargeback_cutoff_at"
    formula: |
      FOR EACH rc IN REQUIRED_TRAINING_SEGMENTS:                 # [FRAUD_CNP, FRAUD_ATO]
        segment_count[rc] = COUNT(ChargebackRecord
                                  WHERE state == LOST
                                    AND reason_code == rc
                                    AND received_at < model.trained_on_chargeback_cutoff_at)   # STRICT <
      eligible = ALL(segment_count[rc] >= MIN_SAMPLES_PER_SEGMENT for rc in REQUIRED_TRAINING_SEGMENTS)
      eligible == false -> ERR_TRAINING_SEGMENT_UNDERFILLED (422), naming the first
                           deficient segment in the REQUIRED_TRAINING_SEGMENTS order.
      eligible == true  -> training_segment_counts is FROZEN to segment_count and the
                           model moves DRAFT -> TRAINING. Later chargebacks never
                           mutate the frozen map.
    precision: "integer counts; the cutoff comparison is STRICTLY less-than, so a chargeback received_at == cutoff is excluded"
    notes:
      - "Non-fraud reason codes are counted nowhere: 10 LOST PRODUCT_NOT_RECEIVED chargebacks leave both required segments at 0."

  # ------------------------------------------------------------------- 15 / 16
  - name: rule_pack_performance_metrics
    algorithm_type: aggregation
    applies_to: RulePack
    trigger: "GET /fraud/rule-packs/{id}/performance"
    input_set: "CheckoutAssessment rows with rule_pack_id == this pack AND state IN {DECIDED_APPROVE, DECIDED_DECLINE} — assessments still PENDING_SIGNALS or IN_REVIEW are excluded from both cohorts"
    variants:
      - name: DECISION_COHORT
        selector: "query parameter cohort=DECISION_COHORT (default)"
        formula: |
          denominator = COUNT(terminal assessments on this pack)
          numerator   = COUNT(terminal assessments WHERE final_disposition == DECLINED
                                                     AND outcome_label != FRAUD)
          insult_rate = denominator == 0 ? 0.0000
                                        : ROUND_HALF_UP(numerator / denominator, 4)
      - name: GOOD_CUSTOMER_COHORT
        selector: "query parameter cohort=GOOD_CUSTOMER_COHORT"
        formula: |
          denominator = COUNT(terminal assessments WHERE good_customer_at_decision == true)
          numerator   = COUNT(those WHERE final_disposition == DECLINED
                                      AND outcome_label != FRAUD)
          insult_rate = denominator == 0 ? 0.0000
                                        : ROUND_HALF_UP(numerator / denominator, 4)
    formula: |
      PINNED EVALUATION ORDER for both variants:
        step 1  resolve the cohort membership of each assessment from the SNAPSHOT
                field good_customer_at_decision stored on the assessment — never
                from Customer.good_customer_flag as it stands now;
        step 2  partition into numerator / denominator;
        step 3  divide;
        step 4  round the QUOTIENT to 4 decimals (never round the counts).

      Both variants additionally report, over their own cohort:
        approved_count        = COUNT(final_disposition == APPROVED)
        declined_count        = COUNT(final_disposition == DECLINED)
        false_positive_count  = numerator
        confirmed_fraud_count = COUNT(outcome_label == FRAUD)
        fraud_capture_rate    = COUNT(outcome_label == FRAUD AND final_disposition == DECLINED)
                                / COUNT(outcome_label == FRAUD), 4 decimals, 0.0000 when the
                                denominator is 0
    precision: "rates at 4 decimals, ROUND_HALF_UP; counts are integers"
    notes:
      - "A chargeback that later flips outcome_label to FRAUD moves an assessment out of the insult numerator without changing any cohort membership, because good_customer_at_decision is frozen."

  # ------------------------------------------------------------------- 16 / 16
  - name: ledger_invariants
    algorithm_type: constraint_propagation
    applies_to: [Customer, Analyst]
    trigger: "every write that touches an approval, a decline, a chargeback resolution, or a case assignment"
    input_set: "the two conserved quantities below"
    formula: |
      INVARIANT A — net_approved_ledger (monetary, per Customer):
        customer.lifetime_net_approved_cents
          == SUM(a.amount_cents) over a.customer_id == customer.id
                                  AND a.state == DECIDED_APPROVE
                                  AND a.outcome_label != FRAUD
        Compensating movements:
          + amount_cents  on PENDING_SIGNALS -> DECIDED_APPROVE and on
                          IN_REVIEW -> DECIDED_APPROVE
          - assessment.amount_cents  when a chargeback loss flips the assessment's
                          outcome_label from UNKNOWN to FRAUD
        IDEMPOTENCE GUARD: the subtraction fires ONLY on the UNKNOWN -> FRAUD
        transition. A second LOST chargeback on the same assessment finds
        outcome_label already FRAUD and moves neither the ledger nor
        confirmed_fraud_count. Without the guard the ledger drifts negative.
        The reversal always uses the ASSESSMENT's amount_cents, never the
        chargeback's disputed amount (which may be partial).

      INVARIANT B — review_capacity_ledger (per Analyst):
        analyst.open_case_count
          == COUNT(ReviewCase WHERE assigned_analyst_id == analyst.id
                                AND state == ASSIGNED)
        Compensating movements:
          +1 on QUEUED/ESCALATED -> ASSIGNED
          -1 on ASSIGNED -> RESOLVED_APPROVE / RESOLVED_DECLINE
          -1 on ASSIGNED -> ESCALATED (the assignment is cleared)
          set to 0 on the analyst shift-change release cascade, which requeues
             every ASSIGNED case the analyst held
        A full assign -> escalate -> reassign -> resolve loop must return the
        analyst to the count they started with — no drift across the cycle.
    precision: "integer cents / integer counts; both invariants must hold after every request"

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending `priority`. The FIRST violated
# rule decides the response; no later rule is evaluated. Priorities are globally
# unique so every conflict has one deterministic winner.
# =============================================================================
validations:

  # ---------------------------------------------------------------- auth (1–4)
  - priority: 1
    category: auth
    applies_to: ["all endpoints"]
    condition: "X-User-Role header absent or empty"
    error_id: ERR_MISSING_ROLE
    http_status: 401
  - priority: 2
    category: auth
    applies_to: ["all endpoints"]
    condition: "X-User-Role is not one of the five §1.7 role names"
    error_id: ERR_INVALID_ROLE
    http_status: 401
  - priority: 3
    category: auth
    applies_to: ["all endpoints"]
    condition: "the supplied role is not listed in the endpoint's `roles`"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
  - priority: 4
    category: auth
    applies_to: ["every endpoint whose role is entity_backed (RiskAnalyst, ReviewLead)"]
    condition: "X-User-ID absent, or no Analyst row has that id"
    error_id: ERR_INVALID_USER_CONTEXT
    http_status: 401

  # ----------------------------------------------------------- existence (10–13)
  - priority: 10
    category: existence
    applies_to: ["every endpoint with a path {id}"]
    condition: "no row of the addressed entity has that id"
    error_id: "ERR_<ENTITY>_NOT_FOUND — ERR_CUSTOMER_NOT_FOUND, ERR_ANALYST_NOT_FOUND, ERR_DEVICE_NOT_FOUND, ERR_ADDRESS_NOT_FOUND, ERR_RULE_PACK_NOT_FOUND, ERR_RULE_NOT_FOUND, ERR_RISK_MODEL_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_AUTH_EVENT_NOT_FOUND, ERR_CHARGEBACK_NOT_FOUND, ERR_EXCEPTION_NOT_FOUND"
    http_status: 404
  - priority: 11
    category: existence
    applies_to: ["POST /fraud/checkout-assessments", "POST /fraud/auth-events", "POST /fraud/chargebacks", "POST /fraud/policy-exceptions", "POST /fraud/addresses", "POST /fraud/review-cases/{id}/assign"]
    condition: "a foreign-key field in the request body names a row that does not exist"
    error_id: "the target entity's ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    note: "Body FKs are checked in the field order declared in the endpoint's `input:` list."
  - priority: 12
    category: existence
    applies_to: ["POST /fraud/rule-packs/{id}/rules", "GET /fraud/rule-packs/{id}/rules", "GET /fraud/rule-packs/{id}/performance"]
    condition: "the parent RulePack in the path does not exist"
    error_id: ERR_RULE_PACK_NOT_FOUND
    http_status: 404
  - priority: 13
    category: existence
    applies_to: ["GET /fraud/rules/{id}"]
    condition: "no FraudRule has that id"
    error_id: ERR_RULE_NOT_FOUND
    http_status: 404

  # ------------------------------------------------------- request shape (14–20)
  - priority: 14
    category: request_shape
    applies_to: ["every POST"]
    condition: "a field declared required in the endpoint's `input:` is absent or null"
    error_id: ERR_VALIDATION
    http_status: 422
  - priority: 15
    category: request_shape
    applies_to: ["every POST"]
    condition: "a field has the wrong JSON type, or an enum field carries a value outside its §1.1 constraint list (including an unknown `action`)"
    error_id: ERR_VALIDATION
    http_status: 422
  - priority: 16
    category: request_shape
    applies_to: ["POST /fraud/customers", "POST /fraud/addresses", "POST /fraud/checkout-assessments", "POST /fraud/auth-events"]
    condition: "home_country / country_code / ip_country is not exactly 2 uppercase letters, or card_bin is not exactly 6 digits"
    error_id: ERR_VALIDATION
    http_status: 422
  - priority: 17
    category: request_shape
    applies_to: ["POST /fraud/checkout-assessments", "POST /fraud/chargebacks", "POST /fraud/policy-exceptions", "POST /fraud/analysts", "POST /fraud/rule-packs/{id}/rules", "POST /fraud/risk-models"]
    condition: "a numeric field falls outside its §1.1 range (amount_cents < 1, session_seconds < 0, cart_item_count < 1, shift_capacity_cases < 1, points outside 0..100, evaluation_order < 1, model_raw_probability outside 0.0000..1.0000, calibration_slope outside (0.0, 4.0], calibration_intercept outside [-1.0, 1.0], weights or floors outside 0.00..200.00)"
    error_id: ERR_VALIDATION
    http_status: 422
  - priority: 18
    category: request_shape
    applies_to: ["POST /fraud/analysts"]
    condition: "skill_families is empty or contains a value outside the signal-family enum"
    error_id: ERR_VALIDATION
    http_status: 422
  - priority: 19
    category: request_shape
    applies_to: ["every GET list endpoint"]
    condition: "limit outside 1..100 or offset < 0"
    error_id: ERR_VALIDATION
    http_status: 422
  - priority: 20
    category: request_shape
    applies_to: ["POST /_clock/set_current_utc"]
    condition: "current_utc is not a valid ISO-8601 UTC instant"
    error_id: ERR_VALIDATION
    http_status: 422

  # ------------------------------------------------------------- state (40–51)
  - priority: 40
    category: state
    applies_to: ["POST /fraud/checkout-assessments/{id}/score"]
    condition: "assessment.state != PENDING_SIGNALS"
    error_id: ERR_ASSESSMENT_ALREADY_SCORED
    http_status: 409
    note: "Also the idempotency guard: scoring the same assessment twice fails here."
  - priority: 41
    category: state
    applies_to: ["POST /fraud/policy-exceptions", "POST /fraud/policy-exceptions/{id}/decision (APPROVE only)", "POST /fraud/checkout-assessments", "POST /fraud/checkout-assessments/{id}/score"]
    condition: "customer.account_status != ACTIVE"
    error_id: ERR_CUSTOMER_ACCOUNT_LOCKED
    http_status: 409
    note: "PRIORITY-PAIR WINNER: on POST /fraud/policy-exceptions this outranks the fiscal tier-cap check at priority 86."
  - priority: 42
    category: state
    applies_to: ["POST /fraud/checkout-assessments/{id}/score"]
    condition: "customer.ato_posture == CONTAINED"
    error_id: ERR_CUSTOMER_ATO_CONTAINED
    http_status: 409
  - priority: 43
    category: state
    applies_to: ["POST /fraud/review-cases/{id}/assign", "POST /fraud/review-cases/{id}/auto-assign", "POST /fraud/review-cases/{id}/resolve"]
    condition: "the case's state does not permit the requested transition (assign/auto-assign require QUEUED or ESCALATED; resolve requires ASSIGNED)"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
  - priority: 44
    category: state
    applies_to: ["POST /fraud/chargebacks/{id}/transition"]
    condition: "the (state, action) pair is not a declared §1.2 ChargebackRecord transition"
    error_id: ERR_CHARGEBACK_TRANSITION_INVALID
    http_status: 409
  - priority: 45
    category: state
    applies_to: ["POST /fraud/risk-models/{id}/lifecycle"]
    condition: "the (status, action) pair is not a declared §1.2 RiskModel transition, including PUBLISH_SHADOW from DRAFT when trained_on_chargeback_cutoff_at is non-null"
    error_id: ERR_MODEL_TRANSITION_INVALID
    http_status: 409
  - priority: 46
    category: state
    applies_to: ["POST /fraud/rule-packs/{id}/activate", "POST /fraud/rule-packs/{id}/rules"]
    condition: "rule_pack.status != DRAFT"
    error_id: ERR_RULE_PACK_NOT_DRAFT
    http_status: 409
  - priority: 47
    category: state
    applies_to: ["POST /fraud/policy-exceptions/{id}/decision"]
    condition: "the (state, action) pair is not a declared §1.2 PolicyException transition (APPROVE/REJECT require REQUESTED; REVOKE requires APPROVED)"
    error_id: ERR_EXCEPTION_STATE_INVALID
    http_status: 409
  - priority: 48
    category: state
    applies_to: ["POST /fraud/auth-events/{id}/challenge"]
    condition: "challenge_state does not permit the action (PASS/FAIL/EXPIRE require ISSUED; REISSUE requires FAILED)"
    error_id: ERR_CHALLENGE_STATE_INVALID
    http_status: 409
  - priority: 49
    category: state
    applies_to: ["POST /fraud/auth-events/{id}/challenge"]
    condition: "action IN {PASS, FAIL, REISSUE} and current_utc >= challenge_expires_at"
    error_id: ERR_CHALLENGE_EXPIRED
    http_status: 409
  - priority: 50
    category: state
    applies_to: ["POST /fraud/auth-events/{id}/challenge"]
    condition: "action == EXPIRE and current_utc < challenge_expires_at"
    error_id: ERR_CHALLENGE_NOT_EXPIRED
    http_status: 409
  - priority: 51
    category: state
    applies_to: ["POST /fraud/customers/{id}/posture"]
    condition: "the requested (axis, value) pair is not a declared §1.2 Customer transition (e.g. anything out of CLOSED, or ato_posture=CLEAR while posture is already CLEAR)"
    error_id: ERR_CUSTOMER_POSTURE_INVALID
    http_status: 409

  # ------------------------------------------------------- concurrency (52–53)
  - priority: 52
    category: occ
    applies_to: ["POST /fraud/review-cases/{id}/assign"]
    condition: "expected_analyst_version != analyst.version"
    error_id: ERR_STALE_ANALYST_VERSION
    http_status: 412
  - priority: 53
    category: occ
    applies_to: ["POST /fraud/policy-exceptions/{id}/decision"]
    condition: "expected_customer_version != customer.version"
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

  # --------------------------------------------------- business_safety (56–58)
  - priority: 56
    category: business_safety
    applies_to: ["POST /fraud/rule-packs/{id}/activate"]
    condition: "X-User-ID == rule_pack.created_by_user_id"
    error_id: ERR_ACTIVATION_SEGREGATION_VIOLATION
    http_status: 409
  - priority: 57
    category: business_safety
    applies_to: ["POST /fraud/policy-exceptions/{id}/decision (APPROVE and REJECT only)"]
    condition: "X-User-ID == exception.requested_by_analyst_id"
    error_id: ERR_DECISION_SEGREGATION_VIOLATION
    http_status: 409
    note: "REVOKE is exempt — the requester may revoke their own exception."
  - priority: 58
    category: business_safety
    applies_to: ["POST /fraud/review-cases/{id}/assign"]
    condition: "case.state == ESCALATED and analyst_id == case.escalated_by_analyst_id"
    error_id: ERR_ESCALATION_SEGREGATION_VIOLATION
    http_status: 409

  # ---------------------------------------------- business_referential (59–69)
  - priority: 59
    category: business_referential
    applies_to: ["POST /fraud/review-cases/{id}/assign"]
    condition: "case.state == ESCALATED and analyst.seniority != LEAD"
    error_id: ERR_ESCALATED_REQUIRES_LEAD
    http_status: 422
    note: "PRIORITY-PAIR WINNER: outranks the business_constraint capacity check at priority 76."
  - priority: 60
    category: business_referential
    applies_to: ["POST /fraud/review-cases/{id}/assign"]
    condition: "case.primary_signal_family NOT IN analyst.skill_families"
    error_id: ERR_ANALYST_SKILL_MISMATCH
    http_status: 422
  - priority: 61
    category: business_referential
    applies_to: ["POST /fraud/review-cases/{id}/assign"]
    condition: "analyst.status != AVAILABLE"
    error_id: ERR_ANALYST_NOT_AVAILABLE
    http_status: 409
  - priority: 62
    category: business_referential
    applies_to: ["POST /fraud/checkout-assessments/{id}/score"]
    condition: "the pinned RulePack's status != ACTIVE at the scoring instant"
    error_id: ERR_RULE_PACK_NOT_ACTIVE
    http_status: 409
  - priority: 63
    category: business_referential
    applies_to: ["POST /fraud/checkout-assessments/{id}/score"]
    condition: "the pinned RiskModel's status != ACTIVE at the scoring instant"
    error_id: ERR_RISK_MODEL_NOT_ACTIVE
    http_status: 409
  - priority: 64
    category: business_referential
    applies_to: ["POST /fraud/checkout-assessments"]
    condition: "no RulePack has status == ACTIVE with effective_from <= now < effective_until, or no RiskModel has status == ACTIVE"
    error_id: "ERR_NO_ACTIVE_RULE_PACK, else ERR_NO_ACTIVE_RISK_MODEL (checked in that order)"
    http_status: 422
  - priority: 65
    category: business_referential
    applies_to: ["POST /fraud/review-cases/{id}/resolve"]
    condition: "X-User-Role == RiskAnalyst and X-User-ID != case.assigned_analyst_id"
    error_id: ERR_NOT_CASE_OWNER
    http_status: 403
    note: "A ReviewLead may resolve any ASSIGNED case."
  - priority: 66
    category: business_referential
    applies_to: ["POST /fraud/policy-exceptions"]
    condition: "scope == ADDRESS_WHITELIST and whitelisted_address_id is null"
    error_id: ERR_EXCEPTION_SCOPE_ADDRESS_REQUIRED
    http_status: 422
  - priority: 67
    category: business_referential
    applies_to: ["POST /fraud/policy-exceptions"]
    condition: "scope == AUTO_APPROVE_UNDER_AMOUNT and whitelisted_address_id is non-null"
    error_id: ERR_EXCEPTION_ADDRESS_NOT_ALLOWED
    http_status: 422
  - priority: 68
    category: business_referential
    applies_to: ["POST /fraud/addresses"]
    condition: "canonical_parent_address_id names an AddressRecord whose own canonical_parent_address_id is non-null (clusters are single-level)"
    error_id: ERR_ADDRESS_CLUSTER_DEPTH
    http_status: 422
  - priority: 69
    category: business_referential
    applies_to: ["POST /fraud/chargebacks"]
    condition: "the assessment's state != DECIDED_APPROVE"
    error_id: ERR_CHARGEBACK_ASSESSMENT_NOT_APPROVED
    http_status: 422

  # ------------------------------------------------ business_temporal (70–74)
  - priority: 70
    category: business_temporal
    applies_to: ["POST /fraud/rule-packs", "POST /fraud/policy-exceptions"]
    condition: "effective_until <= effective_from (RulePack) or expires_at <= effective_from (PolicyException)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
  - priority: 71
    category: business_referential
    applies_to: ["POST /fraud/rule-packs/{id}/rules"]
    condition: "signal_family does not match the family the `code` belongs to (DEV_* -> DEVICE, BEH_* -> BEHAVIORAL, VEL_* -> VELOCITY, ID_* -> IDENTITY, ADDR_* -> ADDRESS, PROMO_* -> PROMO)"
    error_id: ERR_RULE_FAMILY_MISMATCH
    http_status: 422
  - priority: 72
    category: business_temporal
    applies_to: ["POST /fraud/chargebacks"]
    condition: "received_at < assessment.decided_at"
    error_id: ERR_CHARGEBACK_BEFORE_DECISION
    http_status: 422
  - priority: 73
    category: business_temporal
    applies_to: ["POST /fraud/risk-models"]
    condition: "trained_on_chargeback_cutoff_at is non-null and > the current logical clock"
    error_id: ERR_TRAINING_CUTOFF_IN_FUTURE
    http_status: 422
  - priority: 74
    category: business_temporal
    applies_to: ["POST /_clock/set_current_utc"]
    condition: "current_utc < the clock's present value (the logical clock never moves backwards)"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422

  # --------------------------------------------- business_constraint (75–83)
  - priority: 75
    category: business_constraint
    applies_to: ["POST /fraud/rule-packs/{id}/activate"]
    condition: |
      The pack's window, inflated by RULE_PACK_ACTIVATION_FREEZE_SECONDS (3600) on
      BOTH ends, overlaps the un-inflated window of any RulePack with status IN
      {ACTIVE, RETIRED}:
        NOT (candidate.effective_until + 3600 <= other.effective_from
             OR other.effective_until + 3600 <= candidate.effective_from)
      Adjacency is therefore REJECTED — two packs must be separated by a strictly
      greater-than-3600s gap.
    error_id: ERR_RULE_PACK_WINDOW_OVERLAP
    http_status: 409
  - priority: 76
    category: business_constraint
    applies_to: ["POST /fraud/review-cases/{id}/assign"]
    condition: "analyst.open_case_count >= analyst.shift_capacity_cases"
    error_id: ERR_ANALYST_CAPACITY_EXCEEDED
    http_status: 409
    note: "PRIORITY-PAIR LOSER against ERR_ESCALATED_REQUIRES_LEAD (priority 59)."
  - priority: 77
    category: business_constraint
    applies_to: ["POST /fraud/review-cases/{id}/auto-assign"]
    condition: "the §1.3 review_queue_selector eligible pool is empty"
    error_id: ERR_NO_ELIGIBLE_ANALYST
    http_status: 422
  - priority: 78
    category: business_constraint
    applies_to: ["POST /fraud/rule-packs/{id}/activate"]
    condition: "rule_count == 0"
    error_id: ERR_RULE_PACK_EMPTY
    http_status: 422
  - priority: 79
    category: business_constraint
    applies_to: ["POST /fraud/policy-exceptions"]
    condition: |
      Another PolicyException with the same customer_id AND the same scope, whose
      state IN {REQUESTED, APPROVED}, has a HALF-OPEN window overlapping the
      candidate's:
        NOT (candidate.expires_at <= other.effective_from
             OR other.expires_at <= candidate.effective_from)
      Adjacency (candidate.effective_from == other.expires_at) is ALLOWED.
      REJECTED and REVOKED rows never block.
    error_id: ERR_EXCEPTION_WINDOW_OVERLAP
    http_status: 409
  - priority: 80
    category: business_constraint
    applies_to: ["POST /fraud/devices"]
    condition: "another DeviceProfile already has that device_hash"
    error_id: ERR_DUPLICATE_DEVICE_HASH
    http_status: 409
  - priority: 81
    category: business_constraint
    applies_to: ["POST /fraud/rule-packs/{id}/rules"]
    condition: "another FraudRule in the same pack already uses that code"
    error_id: ERR_DUPLICATE_RULE_CODE
    http_status: 409
  - priority: 82
    category: business_constraint
    applies_to: ["POST /fraud/auth-events/{id}/challenge"]
    condition: "action == REISSUE and challenge_attempts >= MAX_CHALLENGE_ATTEMPTS"
    error_id: ERR_CHALLENGE_ATTEMPTS_EXHAUSTED
    http_status: 409
  - priority: 83
    category: business_constraint
    applies_to: ["POST /fraud/risk-models/{id}/lifecycle (action=START_TRAINING)"]
    condition: "§1.3 model_training_segment_eligibility reports any REQUIRED_TRAINING_SEGMENTS entry below MIN_SAMPLES_PER_SEGMENT"
    error_id: ERR_TRAINING_SEGMENT_UNDERFILLED
    http_status: 422

  # ------------------------------------------------- business_fiscal (84–90)
  - priority: 84
    category: business_fiscal
    applies_to: ["POST /fraud/rule-packs", "POST /fraud/rule-packs/{id}/activate"]
    condition: "ROUND_HALF_UP(rule_weight + model_weight, 2) != 1.00"
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
  - priority: 85
    category: business_fiscal
    applies_to: ["POST /fraud/rule-packs", "POST /fraud/rule-packs/{id}/activate"]
    condition: "review_floor_score >= decline_floor_score"
    error_id: ERR_INVALID_SCORE_BANDS
    http_status: 422
  - priority: 86
    category: business_fiscal
    applies_to: ["POST /fraud/policy-exceptions"]
    condition: "max_amount_cents > TIER_EXCEPTION_CAP_CENTS[customer.tier] (§1.3 policy_exception_tier_cap; the cap itself is accepted)"
    error_id: ERR_EXCEPTION_AMOUNT_EXCEEDS_TIER_CAP
    http_status: 422
    note: "PRIORITY-PAIR LOSER against ERR_CUSTOMER_ACCOUNT_LOCKED (priority 41)."
  - priority: 87
    category: business_fiscal
    applies_to: ["POST /fraud/policy-exceptions"]
    condition: "scope == AUTO_APPROVE_UNDER_AMOUNT and customer.tier == STANDARD"
    error_id: ERR_EXCEPTION_TIER_NOT_ELIGIBLE
    http_status: 422
  - priority: 88
    category: business_fiscal
    applies_to: ["POST /fraud/chargebacks"]
    condition: "amount_cents > assessment.amount_cents"
    error_id: ERR_CHARGEBACK_AMOUNT_EXCEEDS_ORDER
    http_status: 422

# =============================================================================
# §1.5 API Endpoint Table (48 endpoints)
# `input:` lists request-body fields (and query params for GET); a trailing `?`
# marks the field optional. Every path template uses `{id}`.
# =============================================================================
endpoints:

  # ------------------------------------------------------------ test harness
  - method: POST
    path: /_clock/set_current_utc
    roles: [PlatformAdmin]
    input: ["current_utc"]
    output: { current_utc: datetime }
    description: |
      Sets the server's logical clock. MANDATORY DEFAULT: before any call to this
      endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT
      fall back to wall-clock time. The clock is monotonic — a value earlier than
      the present reading is rejected with ERR_CLOCK_NOT_MONOTONIC. Every
      created_at / decided_at / *_expires_at / window comparison in this domain
      reads this clock.
    side_effects: ["advances the logical clock; no entity is written"]

  # ---------------------------------------------------------------- Customer
  - method: POST
    path: /fraud/customers
    roles: [PlatformAdmin, CheckoutService]
    input: ["email", "home_country", "tier?"]
    output: Customer
    description: "Registers a shopper account. tier defaults to STANDARD; account_status starts ACTIVE and ato_posture starts CLEAR; all counters start at 0 and good_customer_flag starts false."
    side_effects: ["creates the Customer with version 1"]
  - method: GET
    path: /fraud/customers
    roles: [PlatformAdmin, CheckoutService, RiskAnalyst, ReviewLead, PolicyEngineer]
    input: ["tier?", "account_status?", "ato_posture?", "good_customer_flag?", "limit?", "offset?"]
    output: Customer[]
    description: "Paginated customer list with the §1.0 pagination envelope."
  - method: GET
    path: /fraud/customers/{id}
    roles: [PlatformAdmin, CheckoutService, RiskAnalyst, ReviewLead, PolicyEngineer]
    input: []
    output: Customer
    description: "Reads one customer, including both state axes and every derived counter."
  - method: POST
    path: /fraud/customers/{id}/posture
    roles: [PlatformAdmin]
    input: ["account_status?", "ato_posture?", "reason?"]
    output: Customer
    description: "Drives either Customer state axis. Exactly one of account_status / ato_posture must be supplied; supplying neither or both is ERR_VALIDATION."
    side_effects:
      - "applies the requested §1.2 Customer transition on that axis only"
      - "recomputes good_customer_flag per §1.3 customer_good_standing"
      - "sets or clears locked_reason; increments version by 1"

  # ----------------------------------------------------------------- Analyst
  - method: POST
    path: /fraud/analysts
    roles: [PlatformAdmin]
    input: ["display_name", "seniority", "skill_families", "shift_capacity_cases"]
    output: Analyst
    description: "Registers a fraud analyst. status starts AVAILABLE; open_case_count and resolved_case_count start at 0."
    side_effects: ["creates the Analyst with version 1"]
  - method: GET
    path: /fraud/analysts
    roles: [PlatformAdmin, ReviewLead, RiskAnalyst]
    input: ["status?", "seniority?", "limit?", "offset?"]
    output: Analyst[]
    description: "Paginated analyst roster."
  - method: GET
    path: /fraud/analysts/{id}
    roles: [PlatformAdmin, ReviewLead, RiskAnalyst]
    input: []
    output: Analyst
    description: "Reads one analyst, including the conserved open_case_count and the version used for OCC on assignment."
  - method: POST
    path: /fraud/analysts/{id}/shift
    roles: [PlatformAdmin]
    input: ["status"]
    output: Analyst
    description: "Moves an analyst between AVAILABLE / OFF_SHIFT / SUSPENDED."
    side_effects:
      - "on a move away from AVAILABLE: every ReviewCase with state == ASSIGNED held by this analyst goes ASSIGNED -> QUEUED with requeue_count incremented"
      - "sets open_case_count to 0 in the same request, restoring INVARIANT B of §1.3 ledger_invariants"
      - "increments version by 1"

  # ----------------------------------------------------------- DeviceProfile
  - method: POST
    path: /fraud/devices
    roles: [CheckoutService, PlatformAdmin]
    input: ["device_hash", "tz_offset_minutes", "emulator_flag?"]
    output: DeviceProfile
    description: "Registers a device fingerprint. reputation starts NEW unless emulator_flag is true, in which case §1.3 device_reputation_recompute makes it SUSPECT immediately."
    side_effects: ["creates the DeviceProfile with version 1 and runs §1.3 device_reputation_recompute"]
  - method: GET
    path: /fraud/devices
    roles: [CheckoutService, PlatformAdmin, RiskAnalyst, ReviewLead, PolicyEngineer]
    input: ["reputation?", "emulator_flag?", "limit?", "offset?"]
    output: DeviceProfile[]
    description: "Paginated device list."
  - method: GET
    path: /fraud/devices/{id}
    roles: [CheckoutService, PlatformAdmin, RiskAnalyst, ReviewLead, PolicyEngineer]
    input: []
    output: DeviceProfile
    description: "Reads one device profile with its four derived signals."

  # ----------------------------------------------------------- AddressRecord
  - method: POST
    path: /fraud/addresses
    roles: [CheckoutService, RiskAnalyst, PlatformAdmin]
    input: ["line1", "postal_code", "country_code", "classification?", "canonical_parent_address_id?"]
    output: AddressRecord
    description: "Registers a shipping/billing address. canonical_address_id resolves to id when canonical_parent_address_id is null, else to the parent — clusters are single-level."
    side_effects:
      - "creates the AddressRecord with version 1"
      - "computes canonical_address_id; all cluster counters start at 0, drop_risk_state CLEAN, reshipper_confidence 0.00"
      - "when the row joins an existing cluster, runs §1.3 address_intelligence_recompute on the cluster ROOT"
  - method: GET
    path: /fraud/addresses
    roles: [CheckoutService, RiskAnalyst, ReviewLead, PlatformAdmin, PolicyEngineer]
    input: ["canonical_parent_address_id?", "canonical_address_id?", "classification?", "drop_risk_state?", "limit?", "offset?"]
    output: AddressRecord[]
    description: "Paginated address list; filter by canonical_parent_address_id to walk a cluster's variant rows, or by canonical_address_id for the whole cluster."
  - method: GET
    path: /fraud/addresses/{id}
    roles: [CheckoutService, RiskAnalyst, ReviewLead, PlatformAdmin, PolicyEngineer]
    input: []
    output: AddressRecord
    description: "Reads one address, including the cluster-root intelligence fields."

  # ----------------------------------------------------- RulePack / FraudRule
  - method: POST
    path: /fraud/rule-packs
    roles: [PolicyEngineer]
    input: ["version_label", "blend_mode", "rule_weight", "model_weight", "review_floor_score", "decline_floor_score", "effective_from", "effective_until"]
    output: RulePack
    description: "Drafts a rule pack. status starts DRAFT, rule_count 0, created_by_user_id = X-User-ID (the segregation-of-duties comparand for activation)."
    side_effects: ["creates the RulePack with version 1 and records created_by_user_id"]
  - method: GET
    path: /fraud/rule-packs
    roles: [PolicyEngineer, ReviewLead, RiskAnalyst, PlatformAdmin]
    input: ["status?", "blend_mode?", "limit?", "offset?"]
    output: RulePack[]
    description: "Paginated rule-pack list."
  - method: GET
    path: /fraud/rule-packs/{id}
    roles: [PolicyEngineer, ReviewLead, RiskAnalyst, PlatformAdmin]
    input: []
    output: RulePack
    description: "Reads one rule pack with its lifecycle stamps and rule_count."
  - method: POST
    path: /fraud/rule-packs/{id}/activate
    roles: [PolicyEngineer]
    input: []
    output: RulePack
    description: "Promotes a DRAFT pack to ACTIVE. Rejected when X-User-ID created the pack (ERR_ACTIVATION_SEGREGATION_VIOLATION), when rule_count is 0, when the weights are not normalized, when the bands are inverted, or when the buffer-inflated window collides with an existing ACTIVE/RETIRED pack."
    side_effects:
      - "sets status ACTIVE, activated_at = current_utc, activated_by_user_id = X-User-ID, increments version by 1"
      - "CASCADE: retires every other ACTIVE pack whose effective_until <= this pack's effective_from"
  - method: GET
    path: /fraud/rule-packs/{id}/performance
    roles: [PolicyEngineer, ReviewLead]
    input: ["cohort?"]
    output: { cohort: string, denominator_count: integer, approved_count: integer, declined_count: integer, false_positive_count: integer, confirmed_fraud_count: integer, insult_rate: number, fraud_capture_rate: number }
    description: "False-positive measurement for a pack per §1.3 rule_pack_performance_metrics. `cohort` selects the variant and defaults to DECISION_COHORT; GOOD_CUSTOMER_COHORT restricts every count to assessments whose frozen good_customer_at_decision snapshot is true."
  - method: POST
    path: /fraud/rule-packs/{id}/rules
    roles: [PolicyEngineer]
    input: ["code", "signal_family", "points", "evaluation_order", "hard_decline?"]
    output: FraudRule
    description: "Adds an immutable FraudRule to a DRAFT pack (common_fields: false — no version, no update endpoint). rule_pack_id comes from the path."
    side_effects: ["creates the FraudRule and increments RulePack.rule_count by 1"]
  - method: GET
    path: /fraud/rule-packs/{id}/rules
    roles: [PolicyEngineer, ReviewLead, RiskAnalyst, PlatformAdmin]
    input: ["signal_family?", "limit?", "offset?"]
    output: FraudRule[]
    description: "Lists a pack's rules in evaluation_order ASC, created_at ASC — the exact order §1.3 rule_score_evaluation walks."
  - method: GET
    path: /fraud/rules/{id}
    roles: [PolicyEngineer, ReviewLead, RiskAnalyst, PlatformAdmin]
    input: []
    output: FraudRule
    description: "Reads one fraud rule by id."

  # --------------------------------------------------------------- RiskModel
  - method: POST
    path: /fraud/risk-models
    roles: [PolicyEngineer]
    input: ["model_version_label", "calibration_intercept", "calibration_slope", "trained_on_chargeback_cutoff_at?"]
    output: RiskModel
    description: "Drafts a scoring model. Omitting trained_on_chargeback_cutoff_at marks a cold-start model that may publish to SHADOW without the reason-code-segment gate."
    side_effects: ["creates the RiskModel in DRAFT with version 1"]
  - method: GET
    path: /fraud/risk-models
    roles: [PolicyEngineer, ReviewLead, PlatformAdmin]
    input: ["status?", "limit?", "offset?"]
    output: RiskModel[]
    description: "Paginated model list."
  - method: GET
    path: /fraud/risk-models/{id}
    roles: [PolicyEngineer, ReviewLead, PlatformAdmin]
    input: []
    output: RiskModel
    description: "Reads one model, including the frozen training_segment_counts map."
  - method: POST
    path: /fraud/risk-models/{id}/lifecycle
    roles: [PolicyEngineer]
    input: ["action"]
    output: RiskModel
    description: "Drives the RiskModel machine. action is one of START_TRAINING, PUBLISH_SHADOW, REJECT, PROMOTE, RETIRE."
    side_effects:
      - "START_TRAINING: freezes training_segment_counts per §1.3 model_training_segment_eligibility"
      - "REJECT: clears training_segment_counts back to null (retraining loop)"
      - "PROMOTE: sets promoted_at and CASCADE-retires the incumbent ACTIVE model"
      - "RETIRE: sets retired_at; assessments pinned to the model can no longer be scored"
      - "increments version by 1 on every action"

  # ------------------------------------------------------ CheckoutAssessment
  - method: POST
    path: /fraud/checkout-assessments
    roles: [CheckoutService]
    input: ["customer_id", "device_profile_id", "shipping_address_id", "billing_address_id", "amount_cents", "card_bin", "ip_country", "session_seconds", "cart_item_count", "model_raw_probability", "promo_code?"]
    output: CheckoutAssessment
    description: "Opens a checkout risk assessment in PENDING_SIGNALS and VERSION-PINS rule_pack_id (the ACTIVE pack whose window contains now) and risk_model_id (the ACTIVE model). No score is computed yet."
    side_effects:
      - "creates the CheckoutAssessment with version 1, state PENDING_SIGNALS, all score fields null and outcome_label UNKNOWN"
      - "pins rule_pack_id and risk_model_id; fails with ERR_NO_ACTIVE_RULE_PACK / ERR_NO_ACTIVE_RISK_MODEL when either is missing"
  - method: GET
    path: /fraud/checkout-assessments
    roles: [CheckoutService, RiskAnalyst, ReviewLead, PolicyEngineer, PlatformAdmin]
    input: ["customer_id?", "device_profile_id?", "shipping_address_id?", "billing_address_id?", "rule_pack_id?", "risk_model_id?", "applied_exception_id?", "state?", "decision?", "outcome_label?", "limit?", "offset?"]
    output: CheckoutAssessment[]
    description: "Paginated assessment list, filterable by every foreign key and by state / decision / outcome_label."
  - method: GET
    path: /fraud/checkout-assessments/{id}
    roles: [CheckoutService, RiskAnalyst, ReviewLead, PolicyEngineer, PlatformAdmin]
    input: []
    output: CheckoutAssessment
    description: "Reads one assessment with every computed signal, the blended score, the decision and the frozen good_customer_at_decision snapshot."
  - method: POST
    path: /fraud/checkout-assessments/{id}/score
    roles: [CheckoutService]
    input: []
    output: CheckoutAssessment
    description: "Runs the whole scoring pipeline in one request and resolves the three-way branch of §1.2 CheckoutAssessment. Rejected with ERR_ASSESSMENT_ALREADY_SCORED on a second call."
    side_effects:
      - "computes velocity signals, rule_score, model_points, blended_score, triggered_rule_codes, hard_decline_triggered, primary_signal_family, decision and decision_reason per §1.3"
      - "APPROVE branch: state DECIDED_APPROVE, ledger + counter movement on Customer, exception consumption"
      - "REVIEW branch: state IN_REVIEW plus a new QUEUED ReviewCase with priority_score and sla_due_at"
      - "DECLINE branch: state DECIDED_DECLINE and declined_count movement only"
      - "always recomputes the device reputation and the shipping cluster root's address intelligence, and increments RiskModel.scored_assessment_count"

  # -------------------------------------------------------------- ReviewCase
  - method: GET
    path: /fraud/review-cases
    roles: [RiskAnalyst, ReviewLead, PlatformAdmin]
    input: ["assessment_id?", "assigned_analyst_id?", "escalated_by_analyst_id?", "state?", "primary_signal_family?", "limit?", "offset?"]
    output: ReviewCase[]
    description: "Manual-review queue, returned in priority_score DESC, created_at ASC order. Filter by assessment_id to find the case a REVIEW decision just created."
  - method: GET
    path: /fraud/review-cases/{id}
    roles: [RiskAnalyst, ReviewLead, PlatformAdmin]
    input: []
    output: ReviewCase
    description: "Reads one review case with its priority_score, SLA stamp, requeue_count and escalation_count."
  - method: POST
    path: /fraud/review-cases/{id}/assign
    roles: [ReviewLead]
    input: ["analyst_id", "expected_analyst_version"]
    output: ReviewCase
    description: "Assigns a QUEUED or ESCALATED case to a named analyst under OCC on the ANALYST's version (§1.2.1 case-assign-stale-analyst)."
    side_effects:
      - "sets assigned_analyst_id and assigned_at; state -> ASSIGNED"
      - "increments Analyst.open_case_count by 1 and Analyst.version by 1"
      - "increments ReviewCase.version by 1"
  - method: POST
    path: /fraud/review-cases/{id}/auto-assign
    roles: [ReviewLead]
    input: []
    output: ReviewCase
    description: "Assigns the case to the head of the §1.3 review_queue_selector pool. An empty pool is ERR_NO_ELIGIBLE_ANALYST, never a silent no-op. No OCC field — the server reads the analyst it selects."
    side_effects: ["identical to /assign, for the selected analyst"]
  - method: POST
    path: /fraud/review-cases/{id}/resolve
    roles: [RiskAnalyst, ReviewLead]
    input: ["action", "resolution_note?"]
    output: ReviewCase
    description: "action is APPROVE, DECLINE or ESCALATE. APPROVE/DECLINE close the case and cascade the assessment out of IN_REVIEW; ESCALATE returns it to the queue as ESCALATED for a LEAD."
    side_effects:
      - "APPROVE/DECLINE: sets resolved_at, resolved_late, decrements Analyst.open_case_count, increments Analyst.resolved_case_count, and cascades the assessment to DECIDED_APPROVE / DECIDED_DECLINE with all Customer ledger movement"
      - "ESCALATE: sets escalated_by_analyst_id, clears assigned_analyst_id, increments escalation_count, decrements Analyst.open_case_count, and recomputes priority_score with the ESCALATION_BOOST"

  # --------------------------------------------------------------- AuthEvent
  - method: POST
    path: /fraud/auth-events
    roles: [CheckoutService]
    input: ["customer_id", "device_profile_id", "event_type", "ip_country", "prior_password_change_hours?"]
    output: AuthEvent
    description: "Records a login or profile-change event, scores it per §1.3 ato_score_evaluation, and freezes the immutable `outcome` axis. STEP_UP_REQUIRED issues a challenge (challenge_state ISSUED); BLOCKED contains the account immediately."
    side_effects:
      - "creates the AuthEvent with version 1, computes ato_score, outcome and device_first_seen_for_customer"
      - "STEP_UP_REQUIRED: sets challenge_method OTP_SMS and challenge_expires_at = now + 900s; moves Customer.ato_posture CLEAR -> WATCH"
      - "BLOCKED: moves Customer.ato_posture to CONTAINED, which fires the full containment cascade"
      - "recomputes the device's distinct_customer_count and reputation"
  - method: GET
    path: /fraud/auth-events
    roles: [RiskAnalyst, ReviewLead, CheckoutService, PlatformAdmin]
    input: ["customer_id?", "device_profile_id?", "event_type?", "outcome?", "challenge_state?", "limit?", "offset?"]
    output: AuthEvent[]
    description: "Paginated auth-event list, filterable by both foreign keys and both state axes."
  - method: GET
    path: /fraud/auth-events/{id}
    roles: [RiskAnalyst, ReviewLead, CheckoutService, PlatformAdmin]
    input: []
    output: AuthEvent
    description: "Reads one auth event with its ato_score and challenge fields."
  - method: POST
    path: /fraud/auth-events/{id}/challenge
    roles: [CheckoutService]
    input: ["action", "challenge_method?"]
    output: AuthEvent
    description: "Drives the challenge_state axis. action is PASS, FAIL, REISSUE or EXPIRE. EXPIRE is the only way to reach the terminal EXPIRED state and is rejected before challenge_expires_at."
    side_effects:
      - "PASS: challenge_state PASSED, Customer.failed_login_count -> 0, ato_posture WATCH -> CLEAR"
      - "FAIL: challenge_attempts +1, Customer.failed_login_count +1; the MAX_CHALLENGE_ATTEMPTS-th failure fires the 4-link ATO containment cascade"
      - "REISSUE: challenge_state FAILED -> ISSUED with a fresh challenge_expires_at; challenge_attempts is preserved"
      - "EXPIRE: challenge_state -> EXPIRED with no customer-side effect"
      - "increments AuthEvent.version by 1"

  # -------------------------------------------------------- ChargebackRecord
  - method: POST
    path: /fraud/chargebacks
    roles: [PlatformAdmin]
    input: ["assessment_id", "reason_code", "amount_cents", "liability_shift", "received_at", "evidence_note?"]
    output: ChargebackRecord
    description: "Files a dispute against an approved order. state starts RECEIVED and guarantee_state NOT_APPLICABLE."
    side_effects: ["creates the ChargebackRecord with version 1"]
  - method: GET
    path: /fraud/chargebacks
    roles: [PlatformAdmin, RiskAnalyst, ReviewLead, PolicyEngineer]
    input: ["assessment_id?", "reason_code?", "state?", "guarantee_state?", "limit?", "offset?"]
    output: ChargebackRecord[]
    description: "Paginated dispute list; filter by reason_code and state to inspect a model's training corpus."
  - method: GET
    path: /fraud/chargebacks/{id}
    roles: [PlatformAdmin, RiskAnalyst, ReviewLead, PolicyEngineer]
    input: []
    output: ChargebackRecord
    description: "Reads one dispute with the full guarantee evaluation."
  - method: POST
    path: /fraud/chargebacks/{id}/transition
    roles: [PlatformAdmin]
    input: ["action", "evidence_note?"]
    output: ChargebackRecord
    description: "action is REPRESENT, WIN or LOSE. LOSE runs §1.3 guarantee_liability_evaluation and the 5-link fraud-feedback cascade."
    side_effects:
      - "WIN: sets resolved_at and the assessment's outcome_label to LEGIT; no ledger movement"
      - "LOSE: fills the guarantee_* fields; for a fraud reason_code, flips the assessment's outcome_label UNKNOWN -> FRAUD, reverses the customer ledger by the ASSESSMENT's amount_cents, increments confirmed_fraud_count, recomputes good_customer_flag, and re-prices every open ReviewCase of that customer"
      - "LOSE also increments the device's and address cluster's fraud_confirmed_count and recomputes reputation / drop_risk_state / reshipper_confidence"
      - "increments version by 1"

  # --------------------------------------------------------- PolicyException
  - method: POST
    path: /fraud/policy-exceptions
    roles: [RiskAnalyst]
    input: ["customer_id", "scope", "max_amount_cents", "effective_from", "expires_at", "justification", "whitelisted_address_id?"]
    output: PolicyException
    description: "Requests a policy exception for a high-value or business account. state starts REQUESTED; requested_by_analyst_id = X-User-ID."
    side_effects: ["creates the PolicyException with version 1 and consumed_count 0"]
  - method: GET
    path: /fraud/policy-exceptions
    roles: [RiskAnalyst, ReviewLead, PlatformAdmin, CheckoutService]
    input: ["customer_id?", "requested_by_analyst_id?", "approved_by_analyst_id?", "whitelisted_address_id?", "scope?", "state?", "limit?", "offset?"]
    output: PolicyException[]
    description: "Paginated exception list, filterable by every foreign key plus scope and state."
  - method: GET
    path: /fraud/policy-exceptions/{id}
    roles: [RiskAnalyst, ReviewLead, PlatformAdmin, CheckoutService]
    input: []
    output: PolicyException
    description: "Reads one exception with its window, cap and consumed_count."
  - method: POST
    path: /fraud/policy-exceptions/{id}/decision
    roles: [ReviewLead]
    input: ["action", "expected_customer_version", "decision_note?"]
    output: PolicyException
    description: "action is APPROVE, REJECT or REVOKE, under OCC on the CUSTOMER's version (§1.2.1 exception-decision-stale-customer). APPROVE and REJECT enforce segregation of duties against requested_by_analyst_id; REVOKE does not."
    side_effects:
      - "applies the requested §1.2 PolicyException transition, sets decided_at and decision_note"
      - "APPROVE also sets approved_by_analyst_id = X-User-ID"
      - "increments Customer.version by 1 and PolicyException.version by 1"

# =============================================================================
# §1.6 Error Catalog (65 codes)
# =============================================================================
errors:
  # ---- authentication / authorization
  - { error_id: ERR_MISSING_ROLE, http_status: 401, message: "X-User-Role header is required" }
  - { error_id: ERR_INVALID_ROLE, http_status: 401, message: "X-User-Role is not a recognized role" }
  - { error_id: ERR_UNAUTHORIZED, http_status: 403, message: "This role may not perform this operation" }
  - { error_id: ERR_INVALID_USER_CONTEXT, http_status: 401, message: "X-User-ID is required and must name an existing analyst for this role" }
  - { error_id: ERR_NOT_CASE_OWNER, http_status: 403, message: "Only the assigned analyst or a review lead may resolve this case" }
  # ---- request shape
  - { error_id: ERR_VALIDATION, http_status: 422, message: "Request body failed field-level validation" }
  # ---- existence
  - { error_id: ERR_CUSTOMER_NOT_FOUND, http_status: 404, message: "Customer not found" }
  - { error_id: ERR_ANALYST_NOT_FOUND, http_status: 404, message: "Analyst not found" }
  - { error_id: ERR_DEVICE_NOT_FOUND, http_status: 404, message: "Device profile not found" }
  - { error_id: ERR_ADDRESS_NOT_FOUND, http_status: 404, message: "Address record not found" }
  - { error_id: ERR_RULE_PACK_NOT_FOUND, http_status: 404, message: "Rule pack not found" }
  - { error_id: ERR_RULE_NOT_FOUND, http_status: 404, message: "Fraud rule not found" }
  - { error_id: ERR_RISK_MODEL_NOT_FOUND, http_status: 404, message: "Risk model not found" }
  - { error_id: ERR_ASSESSMENT_NOT_FOUND, http_status: 404, message: "Checkout assessment not found" }
  - { error_id: ERR_CASE_NOT_FOUND, http_status: 404, message: "Review case not found" }
  - { error_id: ERR_AUTH_EVENT_NOT_FOUND, http_status: 404, message: "Auth event not found" }
  - { error_id: ERR_CHARGEBACK_NOT_FOUND, http_status: 404, message: "Chargeback record not found" }
  - { error_id: ERR_EXCEPTION_NOT_FOUND, http_status: 404, message: "Policy exception not found" }
  # ---- state
  - { error_id: ERR_ASSESSMENT_ALREADY_SCORED, http_status: 409, message: "Assessment has already been scored" }
  - { error_id: ERR_CUSTOMER_ACCOUNT_LOCKED, http_status: 409, message: "Customer account is not ACTIVE" }
  - { error_id: ERR_CUSTOMER_ATO_CONTAINED, http_status: 409, message: "Customer is under account-takeover containment" }
  - { error_id: ERR_CUSTOMER_POSTURE_INVALID, http_status: 409, message: "Requested posture transition is not permitted from the current state" }
  - { error_id: ERR_CASE_STATE_INVALID, http_status: 409, message: "Review case state does not permit this operation" }
  - { error_id: ERR_CHARGEBACK_TRANSITION_INVALID, http_status: 409, message: "Chargeback transition is not permitted from the current state" }
  - { error_id: ERR_MODEL_TRANSITION_INVALID, http_status: 409, message: "Risk model transition is not permitted from the current status" }
  - { error_id: ERR_RULE_PACK_NOT_DRAFT, http_status: 409, message: "Rule pack must be in DRAFT for this operation" }
  - { error_id: ERR_EXCEPTION_STATE_INVALID, http_status: 409, message: "Policy exception state does not permit this decision" }
  - { error_id: ERR_CHALLENGE_STATE_INVALID, http_status: 409, message: "Challenge state does not permit this action" }
  - { error_id: ERR_CHALLENGE_EXPIRED, http_status: 409, message: "Step-up challenge has expired" }
  - { error_id: ERR_CHALLENGE_NOT_EXPIRED, http_status: 409, message: "Step-up challenge has not expired yet" }
  # ---- optimistic concurrency
  - { error_id: ERR_STALE_ANALYST_VERSION, http_status: 412, message: "Analyst has been modified since it was read" }
  - { error_id: ERR_STALE_CUSTOMER_VERSION, http_status: 412, message: "Customer has been modified since it was read" }
  # ---- segregation of duties
  - { error_id: ERR_ACTIVATION_SEGREGATION_VIOLATION, http_status: 409, message: "A rule pack may not be activated by the user that created it" }
  - { error_id: ERR_DECISION_SEGREGATION_VIOLATION, http_status: 409, message: "A policy exception may not be approved or rejected by its requester" }
  - { error_id: ERR_ESCALATION_SEGREGATION_VIOLATION, http_status: 409, message: "An escalated case may not be reassigned to the analyst that escalated it" }
  # ---- referential / cross-entity
  - { error_id: ERR_ESCALATED_REQUIRES_LEAD, http_status: 422, message: "An escalated case may only be assigned to a LEAD analyst" }
  - { error_id: ERR_ANALYST_SKILL_MISMATCH, http_status: 422, message: "Analyst does not cover this case's primary signal family" }
  - { error_id: ERR_ANALYST_NOT_AVAILABLE, http_status: 409, message: "Analyst is not AVAILABLE" }
  - { error_id: ERR_RULE_PACK_NOT_ACTIVE, http_status: 409, message: "The rule pack pinned to this assessment is no longer ACTIVE" }
  - { error_id: ERR_RISK_MODEL_NOT_ACTIVE, http_status: 409, message: "The risk model pinned to this assessment is no longer ACTIVE" }
  - { error_id: ERR_NO_ACTIVE_RULE_PACK, http_status: 422, message: "No ACTIVE rule pack covers the current instant" }
  - { error_id: ERR_NO_ACTIVE_RISK_MODEL, http_status: 422, message: "No ACTIVE risk model is available" }
  - { error_id: ERR_EXCEPTION_SCOPE_ADDRESS_REQUIRED, http_status: 422, message: "whitelisted_address_id is required for an ADDRESS_WHITELIST exception" }
  - { error_id: ERR_EXCEPTION_ADDRESS_NOT_ALLOWED, http_status: 422, message: "whitelisted_address_id is only valid for an ADDRESS_WHITELIST exception" }
  - { error_id: ERR_ADDRESS_CLUSTER_DEPTH, http_status: 422, message: "Address clusters are single-level: the canonical parent must itself be a root" }
  - { error_id: ERR_CHARGEBACK_ASSESSMENT_NOT_APPROVED, http_status: 422, message: "A chargeback may only be filed against an approved assessment" }
  - { error_id: ERR_RULE_FAMILY_MISMATCH, http_status: 422, message: "signal_family does not match the rule code's family" }
  # ---- temporal
  - { error_id: ERR_INVALID_WINDOW, http_status: 422, message: "Window end must be strictly after window start" }
  - { error_id: ERR_CHARGEBACK_BEFORE_DECISION, http_status: 422, message: "received_at may not precede the assessment's decision instant" }
  - { error_id: ERR_TRAINING_CUTOFF_IN_FUTURE, http_status: 422, message: "trained_on_chargeback_cutoff_at may not be in the future" }
  - { error_id: ERR_CLOCK_NOT_MONOTONIC, http_status: 422, message: "The logical clock may not move backwards" }
  # ---- constraint
  - { error_id: ERR_RULE_PACK_WINDOW_OVERLAP, http_status: 409, message: "Rule pack windows must be separated by more than the activation freeze buffer" }
  - { error_id: ERR_ANALYST_CAPACITY_EXCEEDED, http_status: 409, message: "Analyst is already at shift capacity" }
  - { error_id: ERR_NO_ELIGIBLE_ANALYST, http_status: 422, message: "No analyst satisfies the auto-assignment selector" }
  - { error_id: ERR_RULE_PACK_EMPTY, http_status: 422, message: "A rule pack must contain at least one rule before activation" }
  - { error_id: ERR_EXCEPTION_WINDOW_OVERLAP, http_status: 409, message: "An open exception of the same scope already covers part of this window" }
  - { error_id: ERR_DUPLICATE_DEVICE_HASH, http_status: 409, message: "device_hash is already registered" }
  - { error_id: ERR_DUPLICATE_RULE_CODE, http_status: 409, message: "This rule code already exists in the pack" }
  - { error_id: ERR_CHALLENGE_ATTEMPTS_EXHAUSTED, http_status: 409, message: "The step-up challenge attempt budget is exhausted" }
  - { error_id: ERR_TRAINING_SEGMENT_UNDERFILLED, http_status: 422, message: "A required reason-code training segment has too few LOST chargebacks" }
  # ---- fiscal
  - { error_id: ERR_WEIGHTS_NOT_NORMALIZED, http_status: 422, message: "rule_weight and model_weight must sum to 1.00" }
  - { error_id: ERR_INVALID_SCORE_BANDS, http_status: 422, message: "review_floor_score must be strictly below decline_floor_score" }
  - { error_id: ERR_EXCEPTION_AMOUNT_EXCEEDS_TIER_CAP, http_status: 422, message: "max_amount_cents exceeds the customer tier's exception cap" }
  - { error_id: ERR_EXCEPTION_TIER_NOT_ELIGIBLE, http_status: 422, message: "This customer tier is not eligible for an auto-approval exception" }
  - { error_id: ERR_CHARGEBACK_AMOUNT_EXCEEDS_ORDER, http_status: 422, message: "Disputed amount may not exceed the order amount" }

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =============================================================================
roles:

  - name: CheckoutService
    identity: opaque
    description: |
      The storefront's server-side checkout and identity integration. Machine
      actor: X-User-ID is an opaque service token that is never matched against
      any entity row.
    exclusive_operations:
      - "POST /fraud/checkout-assessments"
      - "POST /fraud/checkout-assessments/{id}/score"
      - "POST /fraud/auth-events"
      - "POST /fraud/auth-events/{id}/challenge"
    shared_operations:
      - "POST /fraud/customers (with PlatformAdmin)"
      - "POST /fraud/devices (with PlatformAdmin)"
      - "POST /fraud/addresses (with RiskAnalyst, PlatformAdmin)"
      - "all GET reads on Customer, DeviceProfile, AddressRecord, CheckoutAssessment, AuthEvent, PolicyException"
    forbidden:
      - "any review-case operation, any rule-pack or risk-model write, any chargeback write, any policy-exception write"

  - name: RiskAnalyst
    identity: entity_backed:Analyst
    description: |
      A fraud analyst working the manual review queue. X-User-ID MUST be the id of
      an existing Analyst row; it is compared against ReviewCase.assigned_analyst_id
      (case ownership) and PolicyException.requested_by_analyst_id (segregation of
      duties).
    exclusive_operations:
      - "POST /fraud/policy-exceptions"
    shared_operations:
      - "POST /fraud/review-cases/{id}/resolve (with ReviewLead; a RiskAnalyst may only resolve a case assigned to their own id)"
      - "POST /fraud/addresses (with CheckoutService, PlatformAdmin)"
      - "GET reads on Customer, Analyst, DeviceProfile, AddressRecord, RulePack, FraudRule, CheckoutAssessment, ReviewCase, AuthEvent, ChargebackRecord, PolicyException"
    forbidden:
      - "POST /fraud/review-cases/{id}/assign, /auto-assign — queue staffing is a ReviewLead operation"
      - "POST /fraud/policy-exceptions/{id}/decision — a requester may never decide"
      - "any rule-pack, risk-model, analyst, chargeback or clock write"

  - name: ReviewLead
    identity: entity_backed:Analyst
    description: |
      A senior analyst who staffs the review queue and decides policy exceptions.
      X-User-ID MUST name an existing Analyst row and is compared against
      PolicyException.requested_by_analyst_id and, for escalation reassignment,
      against ReviewCase.escalated_by_analyst_id.
    exclusive_operations:
      - "POST /fraud/review-cases/{id}/assign"
      - "POST /fraud/review-cases/{id}/auto-assign"
      - "POST /fraud/policy-exceptions/{id}/decision"
    shared_operations:
      - "POST /fraud/review-cases/{id}/resolve (with RiskAnalyst; a ReviewLead may resolve any ASSIGNED case)"
      - "GET /fraud/rule-packs/{id}/performance (with PolicyEngineer)"
      - "GET reads across every entity"
    forbidden:
      - "POST /fraud/policy-exceptions — a lead may not request the exception they would decide"
      - "any rule-pack, risk-model, analyst, chargeback or clock write"

  - name: PolicyEngineer
    identity: opaque
    description: |
      Owns rule packs and scoring models. X-User-ID is an opaque engineer token,
      recorded in RulePack.created_by_user_id / activated_by_user_id and compared
      between the two for the activation segregation-of-duties check — it is never
      resolved against an entity row.
    exclusive_operations:
      - "POST /fraud/rule-packs"
      - "POST /fraud/rule-packs/{id}/rules"
      - "POST /fraud/rule-packs/{id}/activate"
      - "POST /fraud/risk-models"
      - "POST /fraud/risk-models/{id}/lifecycle"
    shared_operations:
      - "GET /fraud/rule-packs/{id}/performance (with ReviewLead)"
      - "GET reads on Customer, DeviceProfile, AddressRecord, RulePack, FraudRule, RiskModel, CheckoutAssessment, ChargebackRecord"
    forbidden:
      - "any review-case, auth-event, chargeback, policy-exception or customer-posture write"
      - "activating a pack the same X-User-ID created"

  - name: PlatformAdmin
    identity: opaque
    description: |
      Fraud-operations platform administrator. Owns the analyst roster, customer
      posture, the dispute pipeline and the logical clock. X-User-ID is an opaque
      admin token.
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /fraud/analysts"
      - "POST /fraud/analysts/{id}/shift"
      - "POST /fraud/customers/{id}/posture"
      - "POST /fraud/chargebacks"
      - "POST /fraud/chargebacks/{id}/transition"
    shared_operations:
      - "POST /fraud/customers (with CheckoutService)"
      - "POST /fraud/devices (with CheckoutService)"
      - "POST /fraud/addresses (with CheckoutService, RiskAnalyst)"
      - "GET reads across every entity"
    forbidden:
      - "POST /fraud/checkout-assessments and /score — decisioning is the checkout service's job"
      - "any review-case write, any policy-exception write, any rule-pack or risk-model write"
