              payload: { decision: "APPROVE", justification: "looks fine" }
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { e_noexc: $.data.error_id }
          assert:
            - "Response status is 409"
            - "${e_noexc} == ERR_MARGIN_EXCEPTION_NOT_REQUIRED"
            - "SaveOfferGrant.${grant_id}.blended_term_margin_pct == 0.5691"
            - "SaveOfferGrant.${grant_id}.margin_exception_required == false"
            - "SaveOfferGrant.${grant_id}.margin_exception_state == NOT_REQUIRED"
            - "SaveOfferGrant.${grant_id}.decided_by_user_id == null"
            - "SaveOfferGrant.${grant_id}.version == 1"

      - name: creating_a_fifth_attempt_is_rejected_as_attempts_exhausted
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUNNING_ATTEMPTS_EXHAUSTED]
          - validations[priority=47]
          - calculations.dunning_retry_schedule.constants.MAX_RETRY_ATTEMPTS
        distinguishing_aspect: |
          LOST_STOLEN backoffs are [0, 0, 0, 0], so all four attempts land on 2026-01-10, never
          exceed grace_end_at 2026-01-13 and never turn final - which is the only way to reach the
          count ceiling: attempt 5 is 422 ERR_DUNNING_ATTEMPTS_EXHAUSTED, not
          ERR_INVOICE_NOT_PAYABLE and not ERR_GRACE_PERIOD_ENDED.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A."
            - "Four attempts were created on the signup invoice, each settled SOFT_DECLINE with decline_code LOST_STOLEN; all four scheduled_at values are 2026-01-10 with grace_clamped false and is_final false, so the invoice is still FAILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "GET /invoices"
              payload: { subscription_id: "${s_a_id}" }
              as: BillingOperator
              captures: { inv0_id: "$.data[0].id" }
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SOFT_DECLINE", decline_code: "LOST_STOLEN" }
              as: BillingOperator
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SOFT_DECLINE", decline_code: "LOST_STOLEN" }
              as: BillingOperator
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SOFT_DECLINE", decline_code: "LOST_STOLEN" }
              as: BillingOperator
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { att4_id: $.data.id }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0_id}", outcome: "SOFT_DECLINE", decline_code: "LOST_STOLEN" }
              as: BillingOperator
          trigger:
            - call: "POST /invoices/${inv0_id}/dunning-attempts"
              payload: {}
              as: BillingOperator
              captures: { e_exh: $.data.error_id }
          assert:
            - "Response status is 422"
            - "${e_exh} == ERR_DUNNING_ATTEMPTS_EXHAUSTED"
            - "DunningAttempt.${att4_id}.attempt_number == 4"
            - "DunningAttempt.${att4_id}.backoff_days_applied == 0"
            - "DunningAttempt.${att4_id}.scheduled_at == 2026-01-10T00:00:00Z"
            - "DunningAttempt.${att4_id}.grace_clamped == false"
            - "DunningAttempt.${att4_id}.is_final == false"
            - "Invoice.${inv0_id}.status == FAILED"
            - "Invoice.${inv0_id}.attempt_count == 4"
            - "GET /dunning-attempts?invoice_id=${inv0_id} returns meta.total_count == 4"
            - "Subscription.${s_a_id}.consecutive_failed_attempts == 4"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"

      - name: error_offer_expired_on_accept
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_EXPIRED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / offer_expiry_state_outranks_margin_floor_fiscal
          rationale: "The named §1.8 instance accepts an expired grant and asserts ERR_OFFER_EXPIRED is returned ahead of the fiscal rule."

      - name: error_margin_floor_breach_on_accept
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MARGIN_FLOOR_BREACH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / offer_expiry_state_outranks_margin_floor_fiscal
          rationale: "The control leg of the named §1.8 instance accepts an unexpired but under-floor grant and asserts ERR_MARGIN_FLOOR_BREACH."

      - name: error_tenure_requirement_not_met_on_present_offers
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TENURE_REQUIREMENT_NOT_MET]
        excluded_because:
          difficulty_instance: boundary_precision_check / min_tenure_days_inclusive_boundary_59_versus_60
          rationale: "The named §1.8 instance asserts this error at 59 days and the 201 at exactly 60."

      - name: error_subscription_past_due_on_accept
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUBSCRIPTION_PAST_DUE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / offer_accept_gated_by_subscription_billing_state
          rationale: "The named §1.8 instance accepts the same grant under PAST_DUE and under CURRENT and asserts both outcomes."

      - name: error_pause_window_overlap_on_modification
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PAUSE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pause_windows_reject_overlap_but_allow_adjacency
          rationale: "The named §1.8 instance rejects the overlapping window and admits the adjacent one."

      - name: error_renewal_reminder_missing_on_renewals
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RENEWAL_REMINDER_MISSING]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / renewal_reminder_safety_outranks_payment_method_referential
          rationale: "The named §1.8 instance asserts this error when both the reminder and the card rules are violated."

      - name: error_payment_method_inactive_on_renewals
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PAYMENT_METHOD_INACTIVE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / renewal_reminder_safety_outranks_payment_method_referential
          rationale: "The control leg of the named §1.8 instance renews with a valid reminder and an inactive card and asserts ERR_PAYMENT_METHOD_INACTIVE."

      - name: error_contact_cap_exceeded_on_send
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONTACT_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / winback_contact_cap_aggregate_sliding_window
          rationale: "The named §1.8 instance sends inside the 30-day window and asserts the aggregate cap error."

      - name: error_stale_subscription_version_on_modification
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_SUBSCRIPTION_VERSION]
        excluded_because:
          difficulty_instance: non_linear_state_machine / subscription_parallel_axes_paused_while_past_due
          rationale: "Covered as an OCC corner in the consistency-model section of this file and as the OCC comparand throughout the named §1.8 instance's modification chain."

  # ===========================================================================
  - section: rbac
    instances:

      - name: subscriber_cannot_present_save_offers
        claim_type: exclusive_operation_denied
        grounds:
          - roles.RetentionSpecialist.exclusive_operations
          - endpoints["POST /cancellation-sessions/{id}/present-offers"].roles
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Presenting an offer is exclusively the RetentionSpecialist's: the subscriber who owns the
          session gets 403 ERR_UNAUTHORIZED (not 422 for a missing offer), no grant is created and
          step_count stays 2, so a denied call cannot consume the simple-cancellation budget.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE; template T_PRICE (DISCOUNT 0.1000 x 1, reason PRICE); subscriber A subscribed and captured reason PRICE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "T_PRICE", name: "Price Discount", offer_type: "DISCOUNT", priority_rank: 10, discount_pct: 0.1000, discount_cycles: 1, eligible_reason_codes: ["PRICE"] }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
          trigger:
            - call: "POST /cancellation-sessions/${sess_id}/present-offers"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { e_pres: $.data.error_id }
          assert:
            - "Response status is 403"
            - "${e_pres} == ERR_UNAUTHORIZED"
            - "CancellationSession.${sess_id}.state == REASON_CAPTURED"
            - "CancellationSession.${sess_id}.offers_presented_count == 0"
            - "CancellationSession.${sess_id}.step_count == 2"
            - "CancellationSession.${sess_id}.presented_by_user_id == null"
            - "GET /save-offer-grants?cancellation_session_id=${sess_id} returns meta.total_count == 0"

      - name: billing_operator_cannot_accept_a_save_offer
        claim_type: exclusive_operation_denied
        grounds:
          - roles.Subscriber.exclusive_operations
          - endpoints["POST /save-offer-grants/{id}/accept"].roles
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Acceptance is the subscriber's consent and cannot be performed on their behalf: the
          BillingOperator's accept is 403 ERR_UNAUTHORIZED, the grant stays PRESENTED, and the
          subscription keeps its list price 4999 with no discount applied.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE; template T_PRICE (DISCOUNT 0.1000 x 1, reason PRICE); subscriber A was presented a grant by rs_43."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "T_PRICE", name: "Price Discount", offer_type: "DISCOUNT", priority_rank: 10, discount_pct: 0.1000, discount_cycles: 1, eligible_reason_codes: ["PRICE"] }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "AGENT_ASSISTED" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /cancellation-sessions/${sess_id}/present-offers"
              payload: {}
              as: RetentionSpecialist
              as_user_id: "rs_43"
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /save-offer-grants/${grant_id}/accept"
              payload: {}
              as: BillingOperator
              captures: { e_acc: $.data.error_id }
          assert:
            - "Response status is 403"
            - "${e_acc} == ERR_UNAUTHORIZED"
            - "SaveOfferGrant.${grant_id}.state == PRESENTED"
            - "SaveOfferGrant.${grant_id}.accepted_at == null"
            - "CancellationSession.${sess_id}.state == OFFERS_PRESENTED"
            - "Subscription.${s_a_id}.committed_price_cents == 4999"
            - "Subscription.${s_a_id}.active_discount_pct == 0.0000"
            - "Subscription.${s_a_id}.version == 1"

      - name: subscriber_cannot_open_a_session_on_another_subscribers_subscription
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=6]
          - errors[ERR_UNAUTHORIZED]
          - roles.Subscriber.identity
        distinguishing_aspect: |
          Role membership is not enough - identity must match: subscriber B holds the Subscriber
          role, which the endpoint allows, yet opening a session on A's subscription is 403
          ERR_UNAUTHORIZED and no session row is created.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE; subscribers A and B both registered, each with a card; only A holds a subscription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "b@dtc.test", acquisition_channel: "REFERRAL" }
              as: PlatformAdmin
              captures: { sub_b_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
          trigger:
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "WEB_SELF_SERVE" }
              as: Subscriber
              as_user_id: "${sub_b_id}"
              captures: { e_cross: $.data.error_id }
          assert:
            - "Response status is 403"
            - "${e_cross} == ERR_UNAUTHORIZED"
            - "GET /cancellation-sessions?subscription_id=${s_a_id} returns meta.total_count == 0"
            - "Subscription.${s_a_id}.lifecycle_state == ACTIVE"
            - "Subscription.${s_a_id}.version == 1"

      - name: the_presenting_user_may_not_decide_that_grants_margin_exception
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=9]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.SaveOfferGrant.fields.presented_by_user_id
          - roles.RetentionSpecialist.note
        distinguishing_aspect: |
          The bar is per-user, not per-role: rs_9 presented the under-floor grant (blended 0.3902 <
          floor 0.4048, so margin_exception_state is PENDING), so a ComplianceOfficer acting as
          rs_9 is 403 ERR_SEGREGATION_OF_DUTIES while co_1 APPROVEs the identical payload and
          unlocks the accept.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan BOUND (5000 / 2500, floor 0.4048, cadence [4], not negative option)."
            - "Template T_DEEP (DISCOUNT 0.4500 x 2, rank 10, reason PRICE); subscriber A subscribed and captured reason PRICE."
            - "rs_9 presented the offer, producing a grant with per_cycle 0.0909, blended 0.3902 and margin_exception_state PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "BOUND", name: "Bounded Box", monthly_price_cents: 5000, unit_cogs_cents: 2500, margin_floor_pct: 0.4048, allowed_frequency_weeks: [4], is_negative_option: false }
              as: PlatformAdmin
              captures: { bound_plan_id: $.data.id }
            - call: "POST /save-offer-templates"
              payload: { code: "T_DEEP", name: "Deep Discount", offer_type: "DISCOUNT", priority_rank: 10, discount_pct: 0.4500, discount_cycles: 2, eligible_reason_codes: ["PRICE"] }
              as: PlatformAdmin
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${bound_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id }
            - call: "POST /cancellation-sessions"
              payload: { subscription_id: "${s_a_id}", entry_channel: "AGENT_ASSISTED" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /cancellation-sessions/${sess_id}/reason"
              payload: { reason_code: "PRICE" }
              as: Subscriber
              as_user_id: "${sub_a_id}"
            - call: "POST /cancellation-sessions/${sess_id}/present-offers"
              payload: {}
              as: RetentionSpecialist
              as_user_id: "rs_9"
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /save-offer-grants/${grant_id}/margin-exception"
              payload: { decision: "APPROVE", justification: "self approval attempt" }
              as: ComplianceOfficer
              as_user_id: "rs_9"
              captures: { e_sod: $.data.error_id }
            - call: "POST /save-offer-grants/${grant_id}/margin-exception"
              payload: { decision: "APPROVE", justification: "retention value justifies the floor breach" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /save-offer-grants/${grant_id}/accept"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_a_id}"
          assert:
            - "First response status is 403 and ${e_sod} == ERR_SEGREGATION_OF_DUTIES"
            - "SaveOfferGrant.${grant_id}.presented_by_user_id == rs_9"
            - "After the denied call: SaveOfferGrant.${grant_id}.margin_exception_state == PENDING and decided_by_user_id == null"
            - "Second response status is 200"
            - "SaveOfferGrant.${grant_id}.margin_exception_required == true"
            - "SaveOfferGrant.${grant_id}.per_cycle_margin_pct == 0.0909"
            - "SaveOfferGrant.${grant_id}.blended_term_margin_pct == 0.3902"
            - "SaveOfferGrant.${grant_id}.retention_value_cents == 8000"
            - "SaveOfferGrant.${grant_id}.margin_exception_state == APPROVED"
            - "SaveOfferGrant.${grant_id}.decided_by_user_id == co_1"
            - "Third response status is 200 and SaveOfferGrant.${grant_id}.state == ACCEPTED"
            - "Subscription.${s_a_id}.committed_price_cents == 2750"
            - "Subscription.${s_a_id}.active_discount_pct == 0.4500"
            - "Subscription.${s_a_id}.discount_remaining_cycles == 2"
            - "CancellationSession.${sess_id}.state == OFFER_ACCEPTED"

      - name: retention_specialist_shared_operations_all_succeed
        claim_type: shared_operation_allowed
        grounds:
