            - "trigger[1]: HTTP 201 - IMPLANT_PLANNING is in the small-FOV allow list"
            - "trigger[2]: HTTP 201 - PANORAMIC accepts any of the five codes, so the rule never runs"
            - "trigger[3]: HTTP 201 with dose_flag == WITHIN_PROTOCOL (800.0 <= the 900.0 large-FOV reference level)"
            - "GET /imaging-studies?patient_id=${pat_id} reports total_count == 3"

      - name: case_window_reaching_past_the_block_end_rejected
