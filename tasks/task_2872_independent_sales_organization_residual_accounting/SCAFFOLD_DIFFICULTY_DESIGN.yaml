            - "AgentStatement.${st_y}.advance_recoupment_cents == 5000 and net_payable_cents == 9643   # round_half_up(30000 / 6), under the 7322 aggregate cap"
            - "AgentAdvance.${adv_y}.outstanding_cents == 25000, cumulative_recouped_cents == 5000, months_recouped == 1, state == ACTIVE"
