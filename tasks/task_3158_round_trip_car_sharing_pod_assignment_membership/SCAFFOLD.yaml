    side_effects: ["AccessEvent.outcome = SUCCESS or FAILED", "Reservation.status = IN_USE on success", "Vehicle.use_status = IN_USE on success", "derives AccessEvent.vehicle_id and AccessEvent.pod_id from the reservation", "increments Reservation.version by 1 on success", "increments Vehicle.version by 1 on success"]
  - method: GET
    path: "/car-share/access-events"
