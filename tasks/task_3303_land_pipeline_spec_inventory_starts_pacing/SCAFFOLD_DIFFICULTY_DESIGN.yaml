            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 20}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 1, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id", lot2: "$.data[1].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER }
            - { call: "POST /communities/${com}/advance-phase", payload: {}, as: DIVISION_PRESIDENT }
            - { call: "POST /communities/${com}/advance-phase", payload: {}, as: DIVISION_PRESIDENT }
            - { call: "POST /communities/${com}/advance-phase", payload: {}, as: DIVISION_PRESIDENT }
          trigger:
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot2}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {err: $.data.error_id} }
          assert:
            - "trigger response HTTP 409 with error_id == ERR_COMMUNITY_NOT_OPEN (state priority 6 beats fiscal ERR_STARTS_QUOTA_EXCEEDED priority 10)"

      - name: takedown_execute_referential_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - errors[ERR_TAKEDOWN_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Category pair business_referential vs business_temporal: the takedown
          execute request violates both (contract is DEFAULTED and the window
          has passed); priority 7 referential error ERR_CONTRACT_NOT_ACTIVE must
          win over the priority 8 temporal error, and the takedown stays
          SCHEDULED (no default side effect fires under the referential failure).
        test_recipe:
          setup:
            - "Contract executed at clock 2026-09-01; takedown window 2026-09-01..2026-09-10"
            - "Takedown auto-defaults when clock set to 2026-09-11 (window passed); contract flips to DEFAULTED"
            - "Both preconditions now fail on an execute attempt: contract not ACTIVE (referential) and window expired (temporal)"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-09-11T00:00:00Z"}, as: DIVISION_PRESIDENT }
          trigger:
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER, captures: {err: $.data.error_id} }
          assert:
            - "trigger response HTTP 409 with error_id == ERR_CONTRACT_NOT_ACTIVE (referential priority 7 beats temporal ERR_TAKEDOWN_WINDOW_EXPIRED priority 8)"

  # ------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics, different endpoints
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: months_of_supply_exactly_4_blocks_spec_start
        grounds:
          - calculations.absorption_and_supply
          - errors[ERR_STARTS_BLOCKED_OVERHELD]
        distinguishing_aspect: |
          Metric months_of_supply on POST /communities/{id}/homes: with the
          absorption floor at 1.0, standing_spec_count 3 yields 3.0 (NORMAL,
          start allowed) while standing_spec_count 4 yields exactly 4.0, which
          crosses the >= threshold (OVERHELD) — the equality case must block.
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z"
            - "Community open, CLASSIC series, plan max_starts 10, capacity 10, no closed sales (trailing 0 -> floor 1.0)"
            - "Homes H1..H4 started in order; starts 1-4 succeed (months at start time 0.0, 1.0, 2.0, 3.0)"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id", lot2: "$.data[1].id", lot3: "$.data[2].id", lot4: "$.data[3].id", lot5: "$.data[4].id"} }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot2}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot3}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER }
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot4}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER }
          trigger:
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot5}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {err: $.data.error_id} }
            - { call: "GET /communities/${com}/pacing-summary", as: COMMUNITY_MANAGER, captures: {mos: $.data.months_of_supply, post: $.data.posture} }
          assert:
            - "4th start succeeded (months at that moment 3.0 < 4.0)"
            - "5th start response HTTP 409 with error_id == ERR_STARTS_BLOCKED_OVERHELD (months == 4.0 crosses >=)"
            - "pacing-summary.months_of_supply == 4.0 and posture == OVERHELD"

      - name: takedown_window_end_inclusive_boundary
        grounds:
          - state_machines.Takedown.SCHEDULED_to_EXECUTED
          - errors[ERR_TAKEDOWN_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Metric execution timestamp on POST /takedowns/{id}/execute: the window
          is a closed interval, so clock exactly equal to window_end
          (2026-09-10T00:00:00Z) executes successfully, while one second later
          (2026-09-10T00:00:01Z) flips the takedown to DEFAULTED with
          ERR_TAKEDOWN_WINDOW_EXPIRED — inclusive-endpoint precision.
        test_recipe:
          setup:
            - "Clock default; contract ACTIVE; takedown T1 window 2026-09-01T00:00:00Z..2026-09-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: DIVISION_PRESIDENT }
          trigger:
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER, captures: {st: $.data.state} }
          assert:
            - "Takedown.${t1}.state == EXECUTED (clock == window_end is inside the closed interval)"
            - "Takedown.${t1}.executed_at == 2026-09-10T00:00:00Z"

  # ------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: home_start_requires_community_open_phase
        grounds:
          - validations[priority=6]
          - entities.Home.fields.community_id
          - entities.Community.fields.phase
          - errors[ERR_COMMUNITY_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Home -> Community: a home start is valid only while the
          parent community phase is OPEN_FOR_SALES or SELLING_OUT; the same
          request against a PLANNING community fails with
          ERR_COMMUNITY_NOT_OPEN even though lot, quota, and capacity are all
          available.
        test_recipe:
          setup:
            - "Clock default; contract ACTIVE; community in PLANNING (never opened); lots already released into it; plan published; capacity committed"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/product-series", payload: {series_code: "CLASSIC", min_price_cents: 30000000, max_price_cents: 50000000}, as: COMMUNITY_MANAGER, captures: {s1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "POST /takedowns/${t1}/execute", payload: {}, as: LAND_MANAGER }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
            - { call: "GET /communities/${com}", as: DIVISION_PRESIDENT, captures: {comv: $.data.version} }
            - { call: "POST /communities/${com}/pacing-plans", payload: {period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", max_starts: 10, expected_community_version: "${comv}"}, as: DIVISION_PRESIDENT }
            - { call: "GET /communities/${com}/lots", as: COMMUNITY_MANAGER, captures: {lot1: "$.data[0].id"} }
          trigger:
            - { call: "POST /communities/${com}/homes", payload: {lot_id: "${lot1}", product_series_id: "${s1}", base_price_cents: 40000000}, as: COMMUNITY_MANAGER, captures: {err: $.data.error_id} }
          assert:
            - "trigger response HTTP 409 with error_id == ERR_COMMUNITY_NOT_OPEN (community phase PLANNING gates the child operation)"

      - name: takedown_execute_requires_contract_active
        grounds:
          - validations[priority=7]
          - entities.Takedown.fields.option_contract_id
          - entities.OptionContract.fields.state
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Takedown -> OptionContract: a takedown inside its window
          still cannot execute while its parent contract is DEFAULTED (a sibling
          takedown lapsed earlier); curing the contract re-enables execution of
          the in-window takedown — the gate follows the contract's state, not
          the takedown's own.
        test_recipe:
          setup:
            - "Clock 2026-09-05; contract ACTIVE; takedown T1 window 2026-09-01..2026-09-03 (already lapsed -> DEFAULTED -> contract DEFAULTED); takedown T2 window 2026-09-04..2026-09-20 (in window)"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-03T00:00:00Z", expected_contract_version: "${c1v}"}, as: LAND_MANAGER, captures: {t1: $.data.id} }
            - { call: "GET /option-contracts/${c1}", as: LAND_MANAGER, captures: {c1v2: $.data.version} }
            - { call: "POST /option-contracts/${c1}/takedowns", payload: {community_id: "${com}", lot_count: 5, window_start: "2026-09-04T00:00:00Z", window_end: "2026-09-20T00:00:00Z", expected_contract_version: "${c1v2}"}, as: LAND_MANAGER, captures: {t2: $.data.id} }
            - { call: "POST /_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: DIVISION_PRESIDENT }
          trigger:
            - { call: "POST /takedowns/${t2}/execute", payload: {}, as: LAND_MANAGER, captures: {err: $.data.error_id} }
            - { call: "POST /option-contracts/${c1}/cure", payload: {}, as: LAND_MANAGER, captures: {cst: $.data.state} }
            - { call: "POST /takedowns/${t2}/execute", payload: {}, as: LAND_MANAGER, captures: {t2st: $.data.state} }
          assert:
            - "first execute response HTTP 409 with error_id == ERR_CONTRACT_NOT_ACTIVE (in-window takedown gated by DEFAULTED contract)"
            - "OptionContract.${c1}.state == ACTIVE after cure"
            - "Takedown.${t2}.state == EXECUTED after cure"

  # ------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: capacity_commitment_half_open_adjacency
        grounds:
          - errors[ERR_CAPACITY_PERIOD_OVERLAP]
          - entities.CapacityCommitment.fields.period_start
        distinguishing_aspect: |
          Resource CapacityCommitment, half-open [period_start, period_end)
          semantics: a second commitment for the same partner+community starting
          exactly at the first's period_end (2026-10-01) is legal adjacency,
          while one starting 2026-09-15 (interior overlap) is rejected.
        test_recipe:
          setup:
            - "Clock default; community exists; partner P with commitment [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /trade-partners", payload: {name: "FrameCo", trade: "FRAMING"}, as: DIVISION_PRESIDENT, captures: {tp1: $.data.id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", committed_units: 10}, as: TRADE_PARTNER, as_user_id: "${tp1}" }
          trigger:
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-09-15T00:00:00Z", period_end: "2026-10-15T00:00:00Z", committed_units: 5}, as: TRADE_PARTNER, as_user_id: "${tp1}", captures: {err: $.data.error_id} }
            - { call: "POST /trade-partners/${tp1}/capacity-commitments", payload: {community_id: "${com}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", committed_units: 5}, as: TRADE_PARTNER, as_user_id: "${tp1}", captures: {cc2: $.data.id} }
          assert:
            - "overlapping create response HTTP 409 with error_id == ERR_CAPACITY_PERIOD_OVERLAP"
            - "adjacent create (start == prior period_end) returns 201 (half-open semantics allow touching)"

      - name: incentive_same_type_buffer_gap
        grounds:
          - errors[ERR_INCENTIVE_WINDOW_CONFLICT]
          - entities.Incentive.fields.window_end
        distinguishing_aspect: |
          Resource Incentive, closed-interval-with-buffer semantics: same
          (type, series_code) windows must be separated by >= 7 full days after
          the earlier window_end — a new PRICE_CUT starting 2026-09-22 (exactly
          7 days after window_end 2026-09-15) is legal, but 2026-09-20 is
          rejected; different types may overlap freely.
        test_recipe:
          setup:
            - "Clock default; community open; incentive PRICE_CUT window 2026-09-01..2026-09-15 exists"
          setup_api_calls:
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/incentives", payload: {type: "PRICE_CUT", value_cents: 500000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z"}, as: COMMUNITY_MANAGER }
          trigger:
            - { call: "POST /communities/${com}/incentives", payload: {type: "PRICE_CUT", value_cents: 300000, window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-30T00:00:00Z"}, as: COMMUNITY_MANAGER, captures: {err: $.data.error_id} }
            - { call: "POST /communities/${com}/incentives", payload: {type: "PRICE_CUT", value_cents: 300000, window_start: "2026-09-22T00:00:00Z", window_end: "2026-09-30T00:00:00Z"}, as: COMMUNITY_MANAGER, captures: {inc2: $.data.id} }
            - { call: "POST /communities/${com}/incentives", payload: {type: "CLOSING_COST_CREDIT", value_cents: 200000, window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z"}, as: COMMUNITY_MANAGER, captures: {inc3: $.data.id} }
          assert:
            - "PRICE_CUT starting 2026-09-20 rejected with HTTP 409 ERR_INCENTIVE_WINDOW_CONFLICT (gap 5 days < 7)"
            - "PRICE_CUT starting 2026-09-22 returns 201 (exactly 7-day buffer satisfied)"
            - "CLOSING_COST_CREDIT overlapping the PRICE_CUT window returns 201 (different type exempt)"

  # ------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: home_status_partition_conserved_under_approve_terminate
        grounds:
          - state_machines.Home
          - entities.Community.fields.standing_spec_count
        distinguishing_aspect: |
          Conserved quantity: the home-count partition — for the community,
          count(Home) == UNSOLD + RESERVED + SOLD + CLOSED_SALE at every step.
          The forward action (approve: UNSOLD->SOLD path) paired with its
          compensating action (terminate: SOLD->UNSOLD) leaves the partition
          sum unchanged and restores standing_spec_count exactly.
        test_recipe:
          setup:
            - "Clock default; community open; plan max_starts 20; capacity 20; homes H1, H2 started (standing 2)"
          setup_api_calls:
            - { call: "POST /land-parcels", payload: {name: "Parcel A", market_code: "DFW", acres: 100.0}, as: LAND_MANAGER, captures: {p1: $.data.id} }
            - { call: "POST /option-contracts", payload: {land_parcel_id: "${p1}", option_fee_cents: 500000, earnest_money_cents: 1000000, total_lots: 40, lot_base_price_cents: 8000000}, as: LAND_MANAGER, captures: {c1: $.data.id} }
            - { call: "POST /option-contracts/${c1}/execute", payload: {}, as: LAND_MANAGER, captures: {c1v: $.data.version} }
            - { call: "POST /communities", payload: {name: "Community A", market_code: "DFW", absorption_target_per_month: 3.0, months_supply_target: 3.0}, as: DIVISION_PRESIDENT, captures: {com: $.data.id} }
            - { call: "POST /communities/${com}/open", payload: {}, as: COMMUNITY_MANAGER, captures: {comv: $.data.version} }
