# =============================================================================
# §1.9 Scaffold Corner Design — Life Insurance Claims & Beneficiary Payout
# Breadth coverage of every §1.1–§1.7 testable claim not already probed by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections/claim_types follow
# references/claim-extraction-guide.md. All chains replay from empty-DB.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: c_policy_create_defaults_and_system_fields
        claim_type: defaults
        grounds: ["entities.Policy.fields.contestability_months", "entities.Policy.fields.status"]
        distinguishing_aspect: "Omitting contestability_months applies default 24; status starts ACTIVE; id/created_at/version are server-minted (version == 1) even if the client omits them."
        test_recipe:
          setup: ["empty DB; default logical clock 2026-08-01T00:00:00Z (no clock call made)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /policies", payload: { policy_number: "P-COR-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, cm: $.data.contestability_months, st: $.data.status, v: $.data.version } }
          assert:
            - "response 201; contestability_months == 24 (default applied)"
            - "status == ACTIVE (initial state); version == 1; id is a server-minted UUID"
            - "created_at == 2026-08-01 (default logical clock, not wall clock)"

      - name: c_policy_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Policy.fields.face_amount_cents", "validations[priority=3]"]
        distinguishing_aspect: "Omitting required face_amount_cents yields ERR_INVALID_REQUEST (400); no Policy is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /policies", payload: { policy_number: "P-COR-2", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"
            - "GET /policies returns total_count == 0"

      - name: c_statute_duplicate_state_code_rejected
        claim_type: type_constraints
        grounds: ["entities.StateStatute.fields.state_code", "errors[ERR_STATUTE_ALREADY_EXISTS]"]
        distinguishing_aspect: "state_code uniqueness is tenant-global: second POST with the same state_code is rejected with ERR_STATUTE_ALREADY_EXISTS (409)."
        test_recipe:
          setup: ["IL statute exists"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 500, interest_basis: "PROOF_OF_LOSS_COMPLETE", grace_days: 10, payment_deadline_days: 60, dormancy_years: 5, raa_minimum_cents: 50000, raa_annual_interest_rate_bp: 200 }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STATUTE_ALREADY_EXISTS, http 409"
            - "GET /state-statutes?state_code=IL still shows the original 1000bp row"

      - name: c_claim_snapshots_policy_fields
        claim_type: computed_fields
        grounds: ["entities.Claim.fields.face_amount_cents", "entities.Claim.fields.state_code", "entities.Claim.fields.notification_date"]
        distinguishing_aspect: "Claim creation copies face_amount_cents and state_code from the Policy (system source — client cannot set them) and stamps notification_date from the logical clock."
        test_recipe:
          setup: ["IL statute; policy face 7000000 state IL"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-COR-3", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 7000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id, fa: $.data.face_amount_cents, sc: $.data.state_code, nd: $.data.notification_date, ex: $.data.assigned_examiner_id } }
          assert:
            - "face_amount_cents == 7000000 and state_code == 'IL' (snapshotted from Policy)"
            - "notification_date == '2026-03-05' (logical clock date)"
            - "assigned_examiner_id == 'examiner-1' (from X-User-ID header)"

      - name: c_escheatment_case_computed_dates
        claim_type: computed_fields
        grounds: ["entities.EscheatmentCase.fields.escheat_due_date", "entities.EscheatmentCase.fields.due_diligence_start_date", "calculations.escheat_schedule"]
        distinguishing_aspect: "Approving a claim with an empty allocation pool creates a CLAIM_PROCEEDS case whose escheat_due_date = approved_at + dormancy_years and due_diligence_start_date = due - 120 days, both computed."
        test_recipe:
          setup:
            - "IL statute (dormancy 3); policy; claim approved 2026-04-10 with NO beneficiary claims (empty pool)"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-COR-4", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 25000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1" }
          trigger:
            - { call: "GET /escheatment-cases", payload: { claim_id: "${cl}" }, as: ComplianceOfficer, captures: { case_status: "$.data[0].status", due: "$.data[0].escheat_due_date", dd: "$.data[0].due_diligence_start_date", amt: "$.data[0].amount_cents", subj: "$.data[0].subject_type" } }
          assert:
            - "exactly one case: subject_type == CLAIM_PROCEEDS, status == MONITORING, account_id == null"
            - "escheat_due_date == '2029-04-10' (approved 2026-04-10 + 3 years)"
            - "due_diligence_start_date == '2028-12-11' (due - 120 days)"
            - "amount_cents == 25068493 (total_payable 25000000 + interest 68493, nothing paid)"

      - name: c_list_pagination_and_envelope_shape
        claim_type: listing
        grounds: ["response_envelope", "endpoints.\"GET /claims"]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more, and both success and error responses use the fixed §1.0 envelope."
        test_recipe:
          setup: ["IL statute; one policy with two claims (both NOTIFIED)"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-COR-5", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-02" }, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "GET /claims", payload: { policy_id: "${pol}", limit: 1, offset: 0 }, as: ClaimsExaminer }
            - { call: "GET /claims", payload: { policy_id: "${pol}", limit: 1, offset: 1 }, as: ClaimsExaminer }
          assert:
            - "Page 1: response_type == 'array', data has 1 item, total_count == 2, has_more == true, meta.api_request_id present"
            - "Page 2: 1 item, has_more == false"
            - "The two pages return different claim ids"

      - name: c_get_claim_not_found
        claim_type: not_found
        grounds: ["errors[ERR_CLAIM_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent claim id returns ERR_CLAIM_NOT_FOUND (404) with the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /claims/11111111-2222-3333-4444-555555555555", payload: {}, as: ClaimsExaminer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_FOUND, http 404, response_type == 'error'"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: c_begin_review_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Claim.NOTIFIED_to_UNDER_REVIEW", "errors[ERR_CLAIM_NOT_REVIEWABLE]"]
        distinguishing_aspect: "begin-review from UNDER_REVIEW (already reviewed) is rejected with ERR_CLAIM_NOT_REVIEWABLE; second call has no side effects."
        test_recipe:
          setup: ["IL statute; policy; claim NOTIFIED; begin-review done once"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-SM-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_REVIEWABLE (409); Claim.status remains UNDER_REVIEW; version unchanged by the failed call"

      - name: c_rescind_from_contestability_review_succeeds
        claim_type: valid_transition
        grounds: ["state_machines.Claim.CONTESTABILITY_REVIEW_to_RESCINDED"]
        distinguishing_aspect: "Rescission is only reachable via the contestability fork; success cascades open BeneficiaryClaims to REJECTED with reason POLICY_RESCINDED."
        test_recipe:
          setup:
            - "IL statute; policy issue 2024-03-01; claim death 2026-02-28 (contestable) with certified + APS docs VERIFIED; designation Alice 100%; one VALIDATED beneficiary claim; claim in CONTESTABILITY_REVIEW"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-SM-2", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-02-28" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { d1: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "ATTENDING_PHYSICIAN_STATEMENT" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { d2: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${d1}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/documents/${d2}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/rescind", payload: { rescission_reason: "MATERIAL_MISREPRESENTATION" }, as: ClaimsApprover, as_user_id: "approver-1", captures: { st: $.data.status } }
            - { call: "GET /beneficiary-claims/${bc}", payload: {}, as: ClaimsApprover, captures: { bc_st: $.data.status, bc_reason: $.data.rejection_reason } }
          assert:
            - "Claim.status == RESCINDED; rescission_reason stored"
            - "BeneficiaryClaim.${bc}.status == REJECTED with rejection_reason == 'POLICY_RESCINDED' (cascade side effect)"

      - name: c_rescind_from_under_review_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Claim.CONTESTABILITY_REVIEW_to_RESCINDED", "errors[ERR_CLAIM_NOT_IN_CONTESTABILITY_REVIEW]"]
        distinguishing_aspect: "Rescind on a non-contestable claim (UNDER_REVIEW) is rejected with ERR_CLAIM_NOT_IN_CONTESTABILITY_REVIEW — rescission has a single legal from-state."
        test_recipe:
          setup: ["IL statute; policy; non-contestable claim in UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-SM-3", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/rescind", payload: { rescission_reason: "X" }, as: ClaimsApprover, as_user_id: "approver-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_CLAIM_NOT_IN_CONTESTABILITY_REVIEW (409); claim remains UNDER_REVIEW"]

      - name: c_contestable_claim_requires_aps_document
        claim_type: precondition_enforcement
        grounds: ["state_machines.Claim.CONTESTABILITY_REVIEW_to_APPROVED", "errors[ERR_REQUIRED_DOCS_INCOMPLETE]"]
        distinguishing_aspect: "The required-document set is CONDITIONAL on contestability_flag: a contestable claim with only the certified certificate VERIFIED still cannot be approved — the attending physician statement is also required."
        test_recipe:
          setup: ["IL statute; policy issue 2024-03-01; contestable claim (death 2026-02-28) in CONTESTABILITY_REVIEW with ONLY the certified certificate VERIFIED"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-SM-4", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-02-28" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id, flag: $.data.contestability_flag } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { d1: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${d1}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { err: $.data.error_id } }
          assert:
            - "contestability_flag == true and claim is CONTESTABILITY_REVIEW"
            - "approve fails: error_id == ERR_REQUIRED_DOCS_INCOMPLETE (ATTENDING_PHYSICIAN_STATEMENT missing from the required set)"

      - name: c_document_double_review_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DeathDocument.PENDING_to_VERIFIED", "errors[ERR_DOCUMENT_ALREADY_REVIEWED]"]
        distinguishing_aspect: "DeathDocument review is one-shot: reviewing an already-VERIFIED document returns ERR_DOCUMENT_ALREADY_REVIEWED (terminal state lockdown)."
        test_recipe:
          setup: ["IL statute; policy; claim with certified doc already VERIFIED"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-SM-5", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { d1: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${d1}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
          trigger:
            - { call: "POST /claims/${cl}/documents/${d1}/review", payload: { review_result: "REJECTED", rejection_reason: "ILLEGIBLE" }, as: ClaimsExaminer, as_user_id: "examiner-2", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_DOCUMENT_ALREADY_REVIEWED (409); document remains VERIFIED with reviewed_by_id == 'examiner-2'"]

      - name: c_document_rejection_keeps_proof_incomplete
        claim_type: side_effect_execution
        grounds: ["state_machines.DeathDocument.PENDING_to_REJECTED", "entities.Claim.fields.proof_complete_date"]
        distinguishing_aspect: "A REJECTED required document never satisfies the proof set: after rejection, claim.proof_complete_date stays null and approval is blocked."
        test_recipe:
          setup: ["IL statute; policy; claim in UNDER_REVIEW; its only certified certificate REJECTED (with reason)"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-SM-6", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
