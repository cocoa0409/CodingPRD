        distinguishing_aspect: "PACK is conditionally gated on the order's quality dimension: with quality PENDING (never inspected) the completion fails even though the packaging spec is ACTIVE and sequence order is respected."
        test_recipe:
          setup: ["RUNNING order O-V11 (quality PENDING, STOCK spec ACTIVE); TRIM(seq 1) COMPLETED; PACK(seq 2) PENDING"]
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "L-V11", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
