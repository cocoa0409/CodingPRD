        distinguishing_aspect: "Payer-bucket ceiling: after the family pays its exact 30000 share, one more family cent fails ERR_OVERPAYMENT while a STATE payment of 90000 would still succeed — the cap is per payer bucket, not per invoice."
        test_recipe:
