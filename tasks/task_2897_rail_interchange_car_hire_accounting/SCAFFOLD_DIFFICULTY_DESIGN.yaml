            - "after bad-order-report: Car.${car5_id} == (ON_FOREIGN_ROAD, BAD_ORDER, NO_OBLIGATION)"
            - "after empty-routing-obligation: Car.${car5_id} == (ON_FOREIGN_ROAD, BAD_ORDER, OBLIGATION_ACTIVE) — mechanical dimension unchanged by a routing action"
            - "after release-to-service: Car.${car5_id} == (ON_FOREIGN_ROAD, SERVICEABLE, OBLIGATION_ACTIVE) — routing and custody dimensions unchanged by a mechanical action"
