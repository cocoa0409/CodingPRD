              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 20.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/certifications"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", program_name: "Blue Ocean Council", certificate_number: "BOC-77120", valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", claim_text: "Certified sustainable wild-capture fishery" }
              as: SupplierRep
              as_user_id: "${supplier_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /seafood-ops/certifications/${cert_id}/review"
              payload: { decision: "REJECT", review_note: "certificate scope does not cover this fishery" }
              as: ComplianceOfficer
              as_user_id: "officer-claim-2"
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 2, reading_at: "2026-08-01T13:00:00Z", temperature_c: 6.0, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
