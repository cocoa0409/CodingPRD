# =============================================================================
# task_2150 — Household Hazardous Waste (HHW) Collection Event
# County HHW collection program: seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2150. Household Hazardous Waste Collection Event (county HHW collection program): event scheduling & site selection with containment, resident eligibility & appointment/registration, accepted vs rejected material list & quantity limits, traffic flow & unload staffing, contractor packing, manifesting & disposal, business waste exclusion & referral to programs, participation counts & material tonnage reporting, cost per participant & budget

domain_name: hhw-collection-event
api_prefix: /hhw

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every resource is addressed at `/hhw/<collection>/{id}`. Ownership is expressed
  # through FK fields in request bodies, never through nested resource paths.
  # Sub-paths that DO appear (`/transitions`, `/lines`, `/containment-inspections`,
  # `/release`, `/eligibility-actions`, `/posture-override`, `/cost-summary`) are
  # action / computed-read verbs on a flat resource, not a containment hierarchy.

  state_machine_shape: parallel
  # CollectionEvent carries two independent state axes on one row:
  #   lifecycle_status  (PLANNED → SITE_CONFIRMED → OPEN_FOR_REGISTRATION → IN_PROGRESS → CLOSED → RECONCILED | CANCELLED)
  #   containment_status(PENDING_INSPECTION → COMPLIANT ⇄ DEFICIENT ⇄ REMEDIATED → COMPLIANT)
  # Appointment adds a CONFIRMED ⇄ WAITLISTED cycle plus a CHECKED_IN/UNLOADING
  # fork into {COMPLETED, REFERRED_OUT}; Manifest adds a SHIPPED → DISCREPANCY →
  # DRAFT revision cycle; PackedContainer adds SEALED ⇄ OPEN and SHIPPED → SEALED.

  relationship_patterns:
    - one_to_many          # Program→Site/Resident/MaterialCategory/Staffer, CollectionEvent→Appointment, Appointment→DropoffLine
    - self_referential     # Site.replaces_site_id -> Site.id (a retired site names its successor's predecessor)
    - cross_aggregate      # DropoffLine.container_id crosses the Appointment aggregate into the PackedContainer aggregate
    - polymorphic          # CollectionEvent.containment_findings[] records both site-origin and event-origin findings

  role_model: segregation_of_duties
  # The ContainmentInspector user who approved a Site may not file that site's
  # event-day containment inspection; manifest preparation (PackingContractor)
  # and manifest signing/receiving (ProgramAdmin) are held by different roles.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "County HHW program name" }
      - { name: fiscal_year, type: integer, source: input, description: "Budget fiscal year, e.g. 2027", constraints: "2020..2100" }
      - { name: budget_cents, type: integer, source: input, description: "Total disposal + staffing budget authority for the fiscal year, in cents", constraints: ">= 0" }
      - { name: cost_per_participant_ceiling_cents, type: integer, source: input, description: "Board-adopted ceiling on projected cost per participant, in cents", constraints: "> 0" }
      - { name: staff_hourly_rate_cents, type: integer, source: input, description: "Blended loaded hourly rate charged for event staffing, in cents", constraints: "> 0" }
      - { name: eligible_jurisdiction_codes, type: array, source: input, description: "Jurisdiction codes whose residents are eligible, e.g. [\"CO-DEN\",\"CO-ARV\"]", constraints: "non-empty array of strings" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived by calculations.program_posture after every mutation that touches budget_encumbered_cents, budget_in_transit_cents, budget_spent_cents, open_containment_deficiency_count, or any event's projected_cost_per_participant_cents", default: OPEN, constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: posture_override, type: enum, source: system, description: "OPEN when an admin override is in force, otherwise NONE. Never lifts FROZEN.", default: NONE, constraints: "NONE | OPEN" }
      - { name: posture_override_expires_utc, type: datetime, source: system, description: "Instant at which posture_override reverts to NONE; null when posture_override == NONE" }
      - { name: budget_encumbered_cents, type: integer, source: computed, description: "Sum of estimated_disposal_cost_cents over PackedContainer rows in this program with status IN {SEALED, MANIFESTED}", default: 0 }
      - { name: budget_in_transit_cents, type: integer, source: computed, description: "Sum of estimated_disposal_cost_cents over PackedContainer rows in this program with status == SHIPPED", default: 0 }
      - { name: budget_spent_cents, type: integer, source: computed, description: "Sum of invoiced_disposal_cost_cents over Manifest rows in this program with status == RECEIVED", default: 0 }
      - { name: open_containment_deficiency_count, type: integer, source: computed, description: "Count of CollectionEvent rows in this program with containment_status == DEFICIENT", default: 0 }
      - { name: budget_alert_count, type: integer, source: system, description: "Monotonic counter incremented every time posture transitions OPEN -> RESTRICTED or OPEN -> FROZEN or RESTRICTED -> FROZEN", default: 0 }
      - { name: participant_count_ytd, type: integer, source: computed, description: "Count of Appointment rows with status == COMPLETED whose event belongs to this program", default: 0 }
      - { name: tonnage_ytd_kg, type: number, source: computed, description: "Sum of Manifest.net_weight_kg over Manifest rows in this program with status == RECEIVED, rounded to 3 decimals round_half_up", default: 0 }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning county program" }
      - { name: replaces_site_id, type: string, source: input, description: "FK -> Site.id; the RETIRED site this candidate replaces. Optional (null for a first-generation site).", default: null }
      - { name: name, type: string, source: input, description: "Site name, e.g. 'Arvada Public Works Yard'" }
      - { name: address, type: string, source: input, description: "Street address of the collection site" }
      - { name: impervious_surface, type: boolean, source: input, description: "True when the unload pad is fully impervious (asphalt/concrete)" }
      - { name: secondary_containment_liters, type: integer, source: input, description: "Rated secondary containment volume of the unload pad in liters", constraints: ">= 0" }
      - { name: storm_drain_distance_m, type: number, source: input, description: "Distance in meters from the unload pad edge to the nearest storm drain inlet", constraints: ">= 0" }
      - { name: lane_count, type: integer, source: input, description: "Number of physical unload lanes the site can stripe", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "CANDIDATE | APPROVED | SUSPENDED | RETIRED", default: CANDIDATE, constraints: "CANDIDATE | APPROVED | SUSPENDED | RETIRED" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the ContainmentInspector who last drove this site to APPROVED; null while CANDIDATE" }
      - { name: last_inspection_result, type: enum, source: system, description: "PASS | FAIL — result of the most recent site-level containment screen", default: null, constraints: "PASS | FAIL" }

  - name: MaterialCategory
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning county program" }
      - { name: code, type: string, source: input, description: "Category code, e.g. LATEX_PAINT, SOLVENT, POOL_ACID, EXPLOSIVE", constraints: "unique per program_id, uppercase snake" }
      - { name: display_name, type: string, source: input, description: "Human-readable category name printed on the accepted-materials flyer" }
      - { name: acceptance_policy, type: enum, source: input, description: "ACCEPTED_WITH_LIMIT (accepted up to the quantity limits) | REJECTED_ALWAYS (never accepted at an HHW event)", constraints: "ACCEPTED_WITH_LIMIT | REJECTED_ALWAYS" }
      - { name: compatibility_class, type: enum, source: input, description: "Lab-pack segregation class: FLAMMABLE | CORROSIVE_ACID | CORROSIVE_BASE | OXIDIZER | TOXIC | AEROSOL | UNIVERSAL_WASTE", constraints: "FLAMMABLE | CORROSIVE_ACID | CORROSIVE_BASE | OXIDIZER | TOXIC | AEROSOL | UNIVERSAL_WASTE" }
      - { name: dot_hazard_class, type: string, source: input, description: "DOT hazard class printed on the manifest line, e.g. '3', '8', '6.1', 'NA'" }
      - { name: max_kg_per_resident_per_event, type: number, source: input, description: "Per-resident per-event accepted mass ceiling for this category, in kg", constraints: "> 0" }
      - { name: max_kg_per_resident_per_year, type: number, source: input, description: "Per-resident per-fiscal-year accepted mass ceiling for this category, in kg", constraints: "> 0" }
      - { name: disposal_rate_cents_per_kg, type: integer, source: input, description: "Contractor disposal rate in cents per kilogram for this category", constraints: ">= 0" }
      - { name: business_referral_program_code, type: string, source: input, description: "Program code a business generator is referred to for this category, e.g. 'CESQG-DROPOFF'", default: "CESQG-DROPOFF" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program the resident registered with" }
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: street_address, type: string, source: input, description: "Residential street address used for jurisdiction proof" }
      - { name: claimed_jurisdiction_code, type: string, source: input, description: "Jurisdiction code the resident self-declares at registration" }
      - { name: eligibility_status, type: enum, source: system, description: "PENDING_VERIFICATION | ELIGIBLE | INELIGIBLE_OUT_OF_JURISDICTION | SUSPENDED", default: PENDING_VERIFICATION, constraints: "PENDING_VERIFICATION | ELIGIBLE | INELIGIBLE_OUT_OF_JURISDICTION | SUSPENDED" }
      - { name: verified_jurisdiction_code, type: string, source: system, description: "Jurisdiction code recorded by the EligibilityClerk at verification; null before verification" }
      - { name: annual_quantity_reserved_kg, type: number, source: computed, description: "Sum of declared_total_kg over this resident's Appointment rows with status IN {CONFIRMED, CHECKED_IN, UNLOADING}; rounded to 3 decimals round_half_up", default: 0 }
      - { name: annual_quantity_settled_kg, type: number, source: computed, description: "Sum of net_weight_kg over DropoffLine rows with disposition == ACCEPTED belonging to this resident's Appointment rows; rounded to 3 decimals round_half_up", default: 0 }
      - { name: no_show_strike_count, type: integer, source: computed, description: "Count of this resident's Appointment rows with status == NO_SHOW", default: 0 }
      - { name: completed_visit_count, type: integer, source: computed, description: "Count of this resident's Appointment rows with status == COMPLETED", default: 0 }

  - name: CollectionEvent
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning county program" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site the event is scheduled at" }
      - { name: window_start_utc, type: datetime, source: input, description: "Inclusive start of the public collection window (ISO 8601 UTC, three fractional digits)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Inclusive end of the public collection window; must be strictly after window_start_utc and on the same UTC calendar date" }
      - { name: min_viable_registrations, type: integer, source: input, description: "Board-set floor on confirmed registrations below which the event is flagged undersubscribed", default: 20, constraints: ">= 0" }
      - { name: event_date, type: string, source: computed, description: "UTC calendar date of window_start_utc as YYYY-MM-DD" }
      - { name: window_duration_hours, type: number, source: computed, description: "(window_end_utc - window_start_utc) in hours, rounded to 2 decimals round_half_up" }
      - { name: lifecycle_status, type: enum, source: system, description: "PLANNED | SITE_CONFIRMED | OPEN_FOR_REGISTRATION | IN_PROGRESS | CLOSED | RECONCILED | CANCELLED", default: PLANNED, constraints: "PLANNED | SITE_CONFIRMED | OPEN_FOR_REGISTRATION | IN_PROGRESS | CLOSED | RECONCILED | CANCELLED" }
      - { name: containment_status, type: enum, source: system, description: "PENDING_INSPECTION | COMPLIANT | DEFICIENT | REMEDIATED — independent axis from lifecycle_status", default: PENDING_INSPECTION, constraints: "PENDING_INSPECTION | COMPLIANT | DEFICIENT | REMEDIATED" }
      - { name: containment_findings, type: array, source: system, description: "Append-only log of inspection records; each element { origin: SITE | EVENT, result: PASS | FAIL, finding_code, inspector_user_id, recorded_at }" }
      - { name: open_lane_count, type: integer, source: computed, description: "Count of DISTINCT lane_number over LaneAssignment rows for this event with status == ACTIVE", default: 0 }
      - { name: certified_staff_hours, type: number, source: computed, description: "Sum of duration_hours over LaneAssignment rows for this event with status == ACTIVE whose Staffer has status == ACTIVE and hazwoper_expires_on >= event_date; rounded to 2 decimals round_half_up", default: 0 }
      - { name: staffing_cost_cents, type: integer, source: computed, description: "round_half_up(certified_staff_hours * Program.staff_hourly_rate_cents)", default: 0 }
      - { name: slot_capacity, type: integer, source: computed, description: "Vehicle capacity of the event per calculations.event_slot_capacity", default: 0 }
      - { name: reserved_slot_count, type: integer, source: computed, description: "Count of Appointment rows for this event with status IN {CONFIRMED, CHECKED_IN, UNLOADING}", default: 0 }
      - { name: participant_count, type: integer, source: computed, description: "Count of Appointment rows for this event with status == COMPLETED", default: 0 }
      - { name: accepted_tonnage_kg, type: number, source: computed, description: "Sum of net_weight_kg over DropoffLine rows of this event's appointments with disposition == ACCEPTED, rounded to 3 decimals round_half_up", default: 0 }
      - { name: rejected_tonnage_kg, type: number, source: computed, description: "Sum of net_weight_kg over DropoffLine rows of this event's appointments with disposition IN {REJECTED_PROHIBITED, REJECTED_OVER_ANNUAL_LIMIT, REJECTED_OVER_EVENT_LIMIT, REFERRED_BUSINESS}, rounded to 3 decimals round_half_up", default: 0 }
      - { name: tonnage_reported_kg, type: number, source: computed, description: "Sum of net_weight_kg over Manifest rows of this event with status == RECEIVED, rounded to 3 decimals round_half_up", default: 0 }
      - { name: projected_cost_per_participant_cents, type: integer, source: computed, description: "floor(staffing_cost_cents / max(reserved_slot_count, 1))", default: 0 }
      - { name: discrepancy_container_count, type: integer, source: computed, description: "Count of PackedContainer rows of this event with discrepancy_flag == true", default: 0 }
      - { name: cancel_reason, type: string, source: input, description: "Reason recorded when lifecycle_status becomes CANCELLED", default: null }

  - name: Staffer
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program that credentials this staffer" }
      - { name: full_name, type: string, source: input, description: "Staffer full name" }
      - { name: role_code, type: enum, source: input, description: "TRAFFIC | UNLOAD | CHEMIST | SUPERVISOR", constraints: "TRAFFIC | UNLOAD | CHEMIST | SUPERVISOR" }
      - { name: hazwoper_expires_on, type: string, source: input, description: "HAZWOPER refresher expiry date as YYYY-MM-DD" }
      - { name: status, type: enum, source: input, description: "ACTIVE | INACTIVE — an INACTIVE staffer is on the roster but may not be assigned to a lane", default: ACTIVE, constraints: "ACTIVE | INACTIVE" }
      - { name: assigned_hours, type: number, source: computed, description: "Sum of duration_hours over this staffer's LaneAssignment rows with status == ACTIVE, rounded to 2 decimals round_half_up", default: 0 }

  - name: LaneAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CollectionEvent.id; event being staffed" }
      - { name: staffer_id, type: string, source: input, description: "FK -> Staffer.id; staffer occupying the lane interval" }
      - { name: lane_number, type: integer, source: input, description: "Physical unload lane number, 1..Site.lane_count", constraints: ">= 1" }
      - { name: start_utc, type: datetime, source: input, description: "Inclusive start of the staffing interval; must lie within the event window" }
      - { name: end_utc, type: datetime, source: input, description: "Exclusive end of the staffing interval; must lie within the event window and be strictly after start_utc" }
      - { name: duration_hours, type: number, source: computed, description: "(end_utc - start_utc) in hours, rounded to 2 decimals round_half_up", constraints: "> 0 and <= 12.0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", default: ACTIVE, constraints: "ACTIVE | RELEASED" }
      - { name: released_reason, type: string, source: input, description: "Reason recorded when the assignment is released", default: null }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CollectionEvent.id; event the appointment is booked at" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; resident holding the appointment" }
      - { name: slot_start_utc, type: datetime, source: input, description: "Start of the 15-minute arrival slot; must be aligned to a 15-minute boundary and lie inside [event.window_start_utc, event.window_end_utc)" }
      - { name: waste_origin, type: enum, source: input, description: "HOUSEHOLD | BUSINESS — generator self-declaration captured at booking", constraints: "HOUSEHOLD | BUSINESS" }
      - { name: declared_total_kg, type: number, source: input, description: "Total mass the resident declares they will bring, in kg", constraints: "> 0" }
      - { name: declared_category_ids, type: array, source: input, description: "Array of MaterialCategory ids the resident declares they will bring", constraints: "non-empty array" }
      - { name: vehicle_count, type: integer, source: input, description: "Number of vehicles arriving on this appointment", default: 1, constraints: ">= 1 and <= 2" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | WAITLISTED | CHECKED_IN | UNLOADING | COMPLETED | REFERRED_OUT | NO_SHOW | CANCELLED | EXPIRED", default: REQUESTED, constraints: "REQUESTED | CONFIRMED | WAITLISTED | CHECKED_IN | UNLOADING | COMPLETED | REFERRED_OUT | NO_SHOW | CANCELLED | EXPIRED" }
      - { name: waitlist_reason, type: enum, source: system, description: "CAPACITY | CONTAINMENT_DEFICIENCY — why the appointment sits on the waitlist; null unless status == WAITLISTED", default: null, constraints: "CAPACITY | CONTAINMENT_DEFICIENCY" }
      - { name: cancel_reason, type: enum, source: input, description: "RESIDENT_REQUEST | SUPERSEDED | RESIDENT_SUSPENDED | EVENT_CANCELLED", default: null, constraints: "RESIDENT_REQUEST | SUPERSEDED | RESIDENT_SUSPENDED | EVENT_CANCELLED" }
      - { name: referral_program_code, type: string, source: input, description: "Program code the business generator was referred to; set only on REFERRED_OUT", default: null }
      - { name: referral_packet_code, type: string, source: computed, description: "Deterministic referral packet identifier minted on REFERRED_OUT as '<referral_program_code>-<event.event_date>-<queue_seq>'", default: null }
      - { name: queue_seq, type: integer, source: system, description: "Monotonic per-event sequence number assigned on creation, starting at 1, in creation order", default: null }
      - { name: reserved_kg, type: number, source: computed, description: "declared_total_kg while status IN {CONFIRMED, CHECKED_IN, UNLOADING}, otherwise 0", default: 0 }
      - { name: settled_kg, type: number, source: computed, description: "Sum of net_weight_kg over this appointment's DropoffLine rows with disposition == ACCEPTED, rounded to 3 decimals round_half_up", default: 0 }
      - { name: check_in_utc, type: datetime, source: system, description: "Logical-clock instant recorded on CHECK_IN", default: null }
      - { name: unload_complete_utc, type: datetime, source: system, description: "Logical-clock instant recorded on COMPLETE_UNLOAD", default: null }

  - name: DropoffLine
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; appointment being unloaded" }
      - { name: material_category_id, type: string, source: input, description: "FK -> MaterialCategory.id; category the material was screened into" }
      - { name: container_id, type: string, source: system, description: "FK -> PackedContainer.id; container this line was lab-packed into; null until packed", default: null }
      - { name: declared_kg, type: number, source: input, description: "Mass the resident declared for this category, in kg", constraints: ">= 0" }
      - { name: net_weight_kg, type: number, source: input, description: "Weighed net mass of the material actually presented, in kg", constraints: "> 0" }
      - { name: disposition, type: enum, source: computed, description: "ACCEPTED | REJECTED_PROHIBITED | REJECTED_OVER_ANNUAL_LIMIT | REJECTED_OVER_EVENT_LIMIT | REFERRED_BUSINESS — resolved by calculations.dropoff_disposition_ladder at creation and frozen thereafter", constraints: "ACCEPTED | REJECTED_PROHIBITED | REJECTED_OVER_ANNUAL_LIMIT | REJECTED_OVER_EVENT_LIMIT | REFERRED_BUSINESS" }
      - { name: rejection_reason_code, type: string, source: computed, description: "PROHIBITED_MATERIAL | ANNUAL_LIMIT | EVENT_LIMIT | BUSINESS_GENERATOR; null when disposition == ACCEPTED", default: null }
      - { name: estimated_disposal_cost_cents, type: integer, source: computed, description: "round_half_up(net_weight_kg * MaterialCategory.disposal_rate_cents_per_kg) when disposition == ACCEPTED, else 0", default: 0 }
      - { name: screened_by_user_id, type: string, source: system, description: "X-User-ID of the UnloadTech who screened this line" }

  - name: PackedContainer
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CollectionEvent.id; event whose waste this container holds" }
      - { name: manifest_id, type: string, source: system, description: "FK -> Manifest.id; manifest currently carrying this container; null while OPEN or SEALED", default: null }
      - { name: container_code, type: string, source: input, description: "Contractor container code, e.g. 'DRUM-A1'", constraints: "unique per event_id" }
      - { name: compatibility_class, type: enum, source: input, description: "Lab-pack segregation class this container accepts: FLAMMABLE | CORROSIVE_ACID | CORROSIVE_BASE | OXIDIZER | TOXIC | AEROSOL | UNIVERSAL_WASTE", constraints: "FLAMMABLE | CORROSIVE_ACID | CORROSIVE_BASE | OXIDIZER | TOXIC | AEROSOL | UNIVERSAL_WASTE" }
      - { name: capacity_kg, type: number, source: input, description: "Maximum net mass the container may hold, in kg", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "OPEN | SEALED | MANIFESTED | SHIPPED | DISPOSED", default: OPEN, constraints: "OPEN | SEALED | MANIFESTED | SHIPPED | DISPOSED" }
      - { name: line_count, type: integer, source: computed, description: "Count of DropoffLine rows whose container_id == this container's id", default: 0 }
      - { name: net_weight_kg, type: number, source: computed, description: "Sum of net_weight_kg over DropoffLine rows whose container_id == this container's id, rounded to 3 decimals round_half_up", default: 0 }
      - { name: estimated_disposal_cost_cents, type: integer, source: computed, description: "Round-per-line-then-sum estimate per calculations.disposal_cost_valuation (container_estimate variant)", default: 0 }
      - { name: sealed_by_user_id, type: string, source: system, description: "X-User-ID of the PackingContractor who sealed the container", default: null }
      - { name: discrepancy_flag, type: boolean, source: system, description: "True once the container has been returned from a rejected manifest", default: false }

  - name: Manifest
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CollectionEvent.id; event whose containers this manifest ships" }
      - { name: manifest_tracking_number, type: string, source: input, description: "Uniform hazardous waste manifest tracking number", constraints: "unique across all manifests" }
      - { name: tsdf_epa_id, type: string, source: input, description: "EPA identification number of the receiving TSDF" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | SHIPPED | RECEIVED | DISCREPANCY | VOIDED", default: DRAFT, constraints: "DRAFT | SIGNED | SHIPPED | RECEIVED | DISCREPANCY | VOIDED" }
      - { name: container_ids, type: array, source: computed, description: "Ids of PackedContainer rows whose manifest_id == this manifest's id, ordered by container created_at ASC" }
      - { name: net_weight_kg, type: number, source: computed, description: "Sum of net_weight_kg over the manifest's containers, rounded to 3 decimals round_half_up", default: 0 }
      - { name: estimated_disposal_cost_cents, type: integer, source: computed, description: "Sum of estimated_disposal_cost_cents over the manifest's containers (round-per-line-then-sum lineage)", default: 0 }
      - { name: blended_rate_cents_per_kg, type: number, source: computed, description: "Mass-weighted blended disposal rate per calculations.disposal_cost_valuation, rounded to 4 decimals round_half_up; 0 when net_weight_kg == 0", default: 0 }
      - { name: invoiced_disposal_cost_cents, type: integer, source: computed, description: "Sum-then-round invoice amount minted at RECEIVE per calculations.disposal_cost_valuation; 0 until RECEIVE", default: 0 }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the PackingContractor who created the manifest" }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramAdmin who signed the manifest", default: null }
      - { name: signed_at_utc, type: datetime, source: system, description: "Logical-clock instant recorded at SIGN", default: null }
      - { name: discrepancy_code, type: string, source: input, description: "TSDF discrepancy code recorded at REJECT, e.g. 'WEIGHT_VARIANCE'", default: null }
      - { name: superseded_by_manifest_id, type: string, source: system, description: "FK -> Manifest.id; the manifest that superseded this DRAFT when it was VOIDED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Site -----
  - entity: Site
    field: status
    initial_state: CANDIDATE
    terminal_states: [RETIRED]
    transitions:
      - from: CANDIDATE
        to: APPROVED
        trigger: "POST /hhw/sites/{id}/transitions (action=APPROVE)"
        actor: ContainmentInspector
        preconditions:
          - "Site.impervious_surface == true"
          - "Site.secondary_containment_liters >= 2000"
          - "Site.storm_drain_distance_m >= 15.0"
          - "Program.posture != FROZEN"
        side_effects:
          - "Site.status = APPROVED"
          - "Site.approved_by_user_id = X-User-ID of the acting ContainmentInspector"
          - "Site.last_inspection_result = PASS"

      - from: CANDIDATE
        to: CANDIDATE
        trigger: "POST /hhw/sites/{id}/transitions (action=APPROVE) that fails the containment screen"
        actor: ContainmentInspector
        preconditions:
          - "At least one of impervious_surface / secondary_containment_liters / storm_drain_distance_m fails its threshold"
        side_effects:
          - "Request rejected with ERR_CONTAINMENT_REQUIREMENTS_NOT_MET; Site.last_inspection_result is NOT written and Site.version is NOT incremented"
        note: "Recorded as a self-loop only to make the rejection path explicit; no state is written."

      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /hhw/sites/{id}/transitions (action=SUSPEND)"
        actor: ContainmentInspector
        preconditions: []
        side_effects:
          - "Site.status = SUSPENDED"
          - "Site.last_inspection_result = FAIL"
          - "Every CollectionEvent of this site with lifecycle_status IN {SITE_CONFIRMED, OPEN_FOR_REGISTRATION} has containment_status forced to DEFICIENT (containment axis), appending a { origin: SITE, result: FAIL } entry to containment_findings"
          - "Because those events became DEFICIENT: their CONFIRMED appointments cascade to WAITLISTED per the CollectionEvent containment cascade below"

      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /hhw/sites/{id}/transitions (action=REINSTATE)"
        actor: ContainmentInspector
        preconditions:
          - "Program.posture != FROZEN"
        side_effects:
          - "Site.status = APPROVED"
          - "Site.approved_by_user_id = X-User-ID of the acting ContainmentInspector"
          - "Site.last_inspection_result = PASS"
          - "Event containment_status is NOT auto-restored; a fresh event containment inspection is required"

      - from: APPROVED
        to: RETIRED
        trigger: "POST /hhw/sites/{id}/transitions (action=RETIRE)"
        actor: EventCoordinator
        preconditions:
          - "No CollectionEvent of this site has lifecycle_status IN {PLANNED, SITE_CONFIRMED, OPEN_FOR_REGISTRATION, IN_PROGRESS}"
        side_effects:
          - "Site.status = RETIRED"

      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /hhw/sites/{id}/transitions (action=RETIRE)"
        actor: EventCoordinator
        preconditions:
          - "No CollectionEvent of this site has lifecycle_status IN {PLANNED, SITE_CONFIRMED, OPEN_FOR_REGISTRATION, IN_PROGRESS}"
        side_effects:
          - "Site.status = RETIRED"

  # ------------------------------------------------------------ Resident -----
  - entity: Resident
    field: eligibility_status
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    transitions:
      - from: PENDING_VERIFICATION
        to: ELIGIBLE
        trigger: "POST /hhw/residents/{id}/eligibility-actions (action=VERIFY)"
        actor: EligibilityClerk
        preconditions:
          - "verified_jurisdiction_code IS IN Program.eligible_jurisdiction_codes"
        side_effects:
          - "Resident.eligibility_status = ELIGIBLE"
          - "Resident.verified_jurisdiction_code = supplied verified_jurisdiction_code"

      - from: PENDING_VERIFICATION
        to: INELIGIBLE_OUT_OF_JURISDICTION
        trigger: "POST /hhw/residents/{id}/eligibility-actions (action=VERIFY)"
        actor: EligibilityClerk
        preconditions:
          - "verified_jurisdiction_code IS NOT IN Program.eligible_jurisdiction_codes"
        side_effects:
          - "Resident.eligibility_status = INELIGIBLE_OUT_OF_JURISDICTION"
          - "Resident.verified_jurisdiction_code = supplied verified_jurisdiction_code"

      - from: INELIGIBLE_OUT_OF_JURISDICTION
        to: ELIGIBLE
        trigger: "POST /hhw/residents/{id}/eligibility-actions (action=VERIFY)"
        actor: EligibilityClerk
        preconditions:
          - "verified_jurisdiction_code IS IN Program.eligible_jurisdiction_codes"
        side_effects:
          - "Resident.eligibility_status = ELIGIBLE"
          - "Resident.verified_jurisdiction_code = supplied verified_jurisdiction_code"

      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system: no_show_strike_count reaches NO_SHOW_SUSPEND_THRESHOLD after an Appointment enters NO_SHOW"
        actor: system
        preconditions:
          - "Resident.no_show_strike_count >= 2 after the NO_SHOW transition is applied"
        side_effects:
          - "Resident.eligibility_status = SUSPENDED"
          - "Because the resident became SUSPENDED: every other Appointment of this resident with status IN {REQUESTED, CONFIRMED, WAITLISTED} transitions to CANCELLED with cancel_reason = RESIDENT_SUSPENDED, processed in Appointment.created_at ASC order"

      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /hhw/residents/{id}/eligibility-actions (action=REINSTATE)"
        actor: EligibilityClerk
        preconditions:
          - "Resident.eligibility_status == SUSPENDED"
        side_effects:
          - "Resident.eligibility_status = ELIGIBLE"
          - "no_show_strike_count is NOT reset — it remains a computed count over NO_SHOW appointments"

  # ------------------------------- CollectionEvent (axis 1: lifecycle) -------
  - entity: CollectionEvent
    field: lifecycle_status
    initial_state: PLANNED
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SITE_CONFIRMED
        trigger: "POST /hhw/events/{id}/transitions (action=CONFIRM_SITE)"
        actor: EventCoordinator
        preconditions:
          - "Site.status == APPROVED"
          - "Program.posture != FROZEN"
        side_effects:
          - "CollectionEvent.lifecycle_status = SITE_CONFIRMED"

      - from: SITE_CONFIRMED
        to: OPEN_FOR_REGISTRATION
        trigger: "POST /hhw/events/{id}/transitions (action=OPEN_REGISTRATION)"
        actor: EventCoordinator
        preconditions:
          - "CollectionEvent.containment_status == COMPLIANT"
          - "current_utc < CollectionEvent.window_start_utc"
          - "Program.posture == OPEN"
        side_effects:
          - "CollectionEvent.lifecycle_status = OPEN_FOR_REGISTRATION"
          - "CollectionEvent.slot_capacity recomputed per calculations.event_slot_capacity"
          - "CollectionEvent.projected_cost_per_participant_cents recomputed"
          - "Program.posture recomputed per calculations.program_posture"

      - from: OPEN_FOR_REGISTRATION
        to: IN_PROGRESS
        trigger: "POST /hhw/events/{id}/transitions (action=START)"
        actor: EventCoordinator
        preconditions:
          - "current_utc >= CollectionEvent.window_start_utc"
          - "CollectionEvent.containment_status IN {COMPLIANT, REMEDIATED}"
          - "CollectionEvent.open_lane_count >= 1"
        side_effects:
          - "CollectionEvent.lifecycle_status = IN_PROGRESS"

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /hhw/events/{id}/transitions (action=CLOSE)"
        actor: EventCoordinator
        preconditions:
          - "current_utc >= CollectionEvent.window_end_utc"
        side_effects:
          - "CollectionEvent.lifecycle_status = CLOSED"
          - "Every Appointment of this event with status == WAITLISTED transitions to EXPIRED, processed in Appointment.created_at ASC order"
          - "Every Appointment of this event with status IN {REQUESTED, CONFIRMED} transitions to NO_SHOW, processed in Appointment.created_at ASC order, releasing each reservation"
          - "Because those appointments entered NO_SHOW: each affected Resident.no_show_strike_count is recomputed and the ELIGIBLE -> SUSPENDED system transition is evaluated per the Resident machine"

      - from: CLOSED
        to: RECONCILED
        trigger: "POST /hhw/events/{id}/transitions (action=RECONCILE)"
        actor: EventCoordinator
        preconditions:
          - "Every Manifest of this event has status IN {RECEIVED, VOIDED}"
          - "Every PackedContainer of this event has status IN {DISPOSED, OPEN} with line_count == 0 when OPEN"
          - "CollectionEvent.discrepancy_container_count == 0"
        side_effects:
          - "CollectionEvent.lifecycle_status = RECONCILED"
          - "CollectionEvent.tonnage_reported_kg frozen at its current value"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /hhw/events/{id}/transitions (action=CANCEL)"
        actor: EventCoordinator
        preconditions: []
        side_effects:
          - "CollectionEvent.lifecycle_status = CANCELLED; cancel_reason recorded"

      - from: SITE_CONFIRMED
        to: CANCELLED
        trigger: "POST /hhw/events/{id}/transitions (action=CANCEL)"
        actor: EventCoordinator
        preconditions: []
        side_effects:
          - "CollectionEvent.lifecycle_status = CANCELLED; cancel_reason recorded"
          - "Every LaneAssignment of this event with status == ACTIVE transitions to RELEASED with released_reason = EVENT_CANCELLED, processed in LaneAssignment.created_at ASC order"
          - "Because those assignments were released: each affected Staffer.assigned_hours is recomputed and CollectionEvent.certified_staff_hours / staffing_cost_cents fall to 0"

      - from: OPEN_FOR_REGISTRATION
        to: CANCELLED
        trigger: "POST /hhw/events/{id}/transitions (action=CANCEL)"
        actor: EventCoordinator
        preconditions: []
        side_effects:
          - "CollectionEvent.lifecycle_status = CANCELLED; cancel_reason recorded"
          - "Every Appointment of this event with status IN {REQUESTED, CONFIRMED, WAITLISTED} transitions to CANCELLED with cancel_reason = EVENT_CANCELLED, processed in Appointment.created_at ASC order"
          - "Because those appointments were cancelled: each affected Resident.annual_quantity_reserved_kg is recomputed and CollectionEvent.reserved_slot_count falls to 0"
          - "Every LaneAssignment of this event with status == ACTIVE transitions to RELEASED with released_reason = EVENT_CANCELLED, processed in LaneAssignment.created_at ASC order"

  # ---------------------------- CollectionEvent (axis 2: containment) --------
  - entity: CollectionEvent
    field: containment_status
    initial_state: PENDING_INSPECTION
    terminal_states: []
    note: "Independent of lifecycle_status; both axes advance on the same row without ordering constraints between them."
    transitions:
      - from: PENDING_INSPECTION
        to: COMPLIANT
        trigger: "POST /hhw/events/{id}/containment-inspections (result=PASS)"
        actor: ContainmentInspector
        preconditions:
          - "CollectionEvent.lifecycle_status NOT IN {RECONCILED, CANCELLED}"
          - "X-User-ID != Site.approved_by_user_id of the event's site (inspector independence)"
        side_effects:
          - "CollectionEvent.containment_status = COMPLIANT"
          - "An entry { origin: EVENT, result: PASS, finding_code, inspector_user_id, recorded_at } is appended to containment_findings"
          - "CollectionEvent.slot_capacity recomputed"

      - from: PENDING_INSPECTION
        to: DEFICIENT
        trigger: "POST /hhw/events/{id}/containment-inspections (result=FAIL)"
        actor: ContainmentInspector
        preconditions:
          - "CollectionEvent.lifecycle_status NOT IN {RECONCILED, CANCELLED}"
          - "X-User-ID != Site.approved_by_user_id of the event's site"
        side_effects:
          - "CollectionEvent.containment_status = DEFICIENT"
          - "Entry appended to containment_findings"
          - "Program.open_containment_deficiency_count recomputed; Program.posture recomputed"

      - from: COMPLIANT
        to: DEFICIENT
        trigger: "POST /hhw/events/{id}/containment-inspections (result=FAIL)"
        actor: ContainmentInspector
        preconditions:
          - "CollectionEvent.lifecycle_status NOT IN {RECONCILED, CANCELLED}"
          - "X-User-ID != Site.approved_by_user_id of the event's site"
        side_effects:
          - "HOP 1 — CollectionEvent.containment_status = DEFICIENT; entry appended to containment_findings"
          - "HOP 2 (because the event became DEFICIENT) — every Appointment of this event with status == CONFIRMED transitions to WAITLISTED with waitlist_reason = CONTAINMENT_DEFICIENCY, processed in Appointment.created_at ASC order; each such appointment's reserved_kg falls to 0 and its Resident.annual_quantity_reserved_kg is decremented by declared_total_kg"
          - "HOP 3 (because those reservations were released) — CollectionEvent.reserved_slot_count falls and CollectionEvent.projected_cost_per_participant_cents is recomputed as floor(staffing_cost_cents / max(reserved_slot_count, 1))"
          - "HOP 4 (because projected_cost_per_participant_cents rose above Program.cost_per_participant_ceiling_cents) — Program.posture is recomputed to RESTRICTED and Program.budget_alert_count is incremented by 1"
          - "Program.open_containment_deficiency_count recomputed"

      - from: DEFICIENT
        to: REMEDIATED
        trigger: "POST /hhw/events/{id}/containment-inspections (result=PASS)"
        actor: ContainmentInspector
        preconditions:
          - "CollectionEvent.lifecycle_status NOT IN {RECONCILED, CANCELLED}"
          - "X-User-ID != Site.approved_by_user_id of the event's site"
        side_effects:
          - "CollectionEvent.containment_status = REMEDIATED (never straight to COMPLIANT)"
          - "CollectionEvent.slot_capacity recomputed with the REMEDIATED containment derate"
          - "Waitlist promotion sweep per calculations.waitlist_promotion_sweep: Appointment rows with status == WAITLISTED and waitlist_reason == CONTAINMENT_DEFICIENCY are promoted back to CONFIRMED in Appointment.created_at ASC order while reserved_slot_count < slot_capacity; each promotion re-reserves declared_total_kg on the Resident"
          - "Program.open_containment_deficiency_count recomputed; Program.posture recomputed"

      - from: REMEDIATED
        to: COMPLIANT
        trigger: "POST /hhw/events/{id}/containment-inspections (result=PASS)"
        actor: ContainmentInspector
        preconditions:
          - "CollectionEvent.lifecycle_status NOT IN {RECONCILED, CANCELLED}"
          - "X-User-ID != Site.approved_by_user_id of the event's site"
        side_effects:
          - "CollectionEvent.containment_status = COMPLIANT"
          - "CollectionEvent.slot_capacity recomputed without the derate"
          - "Waitlist promotion sweep per calculations.waitlist_promotion_sweep"

      - from: REMEDIATED
        to: DEFICIENT
        trigger: "POST /hhw/events/{id}/containment-inspections (result=FAIL)"
        actor: ContainmentInspector
        preconditions:
          - "CollectionEvent.lifecycle_status NOT IN {RECONCILED, CANCELLED}"
          - "X-User-ID != Site.approved_by_user_id of the event's site"
        side_effects:
          - "CollectionEvent.containment_status = DEFICIENT"
          - "Same HOP 2 / HOP 3 / HOP 4 cascade as COMPLIANT -> DEFICIENT"

  # --------------------------------------------------------- Appointment -----
  - entity: Appointment
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REFERRED_OUT, NO_SHOW, CANCELLED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /hhw/appointments/{id}/transitions (action=CONFIRM)"
        actor: "EligibilityClerk | Resident (owner)"
        preconditions:
          - "CollectionEvent.lifecycle_status == OPEN_FOR_REGISTRATION"
          - "CollectionEvent.containment_status IN {COMPLIANT, REMEDIATED}"
          - "Resident.eligibility_status == ELIGIBLE"
          - "Appointment.waste_origin == HOUSEHOLD"
          - "Program.posture == OPEN"
          - "CollectionEvent.reserved_slot_count + 1 <= CollectionEvent.slot_capacity"
        side_effects:
          - "Appointment.status = CONFIRMED; reserved_kg = declared_total_kg"
          - "Resident.annual_quantity_reserved_kg increased by declared_total_kg"
          - "CollectionEvent.reserved_slot_count increased by 1; projected_cost_per_participant_cents recomputed"
          - "Program.posture recomputed"

      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /hhw/appointments/{id}/transitions (action=WAITLIST)"
        actor: EligibilityClerk
        preconditions:
          - "CollectionEvent.lifecycle_status == OPEN_FOR_REGISTRATION"
          - "Resident.eligibility_status == ELIGIBLE"
        side_effects:
          - "Appointment.status = WAITLISTED; waitlist_reason = CAPACITY"
          - "No reservation is taken; Resident.annual_quantity_reserved_kg unchanged"

      - from: WAITLISTED
        to: CONFIRMED
        trigger: "POST /hhw/appointments/{id}/transitions (action=PROMOTE) or system waitlist promotion sweep"
        actor: "EligibilityClerk | system"
        preconditions:
          - "CollectionEvent.lifecycle_status == OPEN_FOR_REGISTRATION"
          - "CollectionEvent.containment_status IN {COMPLIANT, REMEDIATED}"
          - "Resident.eligibility_status == ELIGIBLE"
          - "Program.posture == OPEN"
          - "CollectionEvent.reserved_slot_count + 1 <= CollectionEvent.slot_capacity"
        side_effects:
          - "Appointment.status = CONFIRMED; waitlist_reason = null; reserved_kg = declared_total_kg"
          - "Resident.annual_quantity_reserved_kg increased by declared_total_kg"
          - "CollectionEvent.reserved_slot_count increased by 1; projected_cost_per_participant_cents recomputed"

      - from: CONFIRMED
        to: WAITLISTED
        trigger: "system: event containment_status transitions into DEFICIENT"
        actor: system
        preconditions:
          - "CollectionEvent.containment_status became DEFICIENT in this request"
        side_effects:
          - "Appointment.status = WAITLISTED; waitlist_reason = CONTAINMENT_DEFICIENCY; reserved_kg = 0"
          - "Resident.annual_quantity_reserved_kg decreased by declared_total_kg"
          - "CollectionEvent.reserved_slot_count decreased by 1"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /hhw/appointments/{id}/transitions (action=CHECK_IN)"
        actor: UnloadTech
        preconditions:
          - "CollectionEvent.lifecycle_status == IN_PROGRESS"
          - "CollectionEvent.containment_status IN {COMPLIANT, REMEDIATED}"
        side_effects:
          - "Appointment.status = CHECKED_IN; check_in_utc = current_utc"

      - from: CHECKED_IN
        to: UNLOADING
        trigger: "POST /hhw/appointments/{id}/transitions (action=START_UNLOAD)"
        actor: UnloadTech
        preconditions:
          - "CollectionEvent.lifecycle_status == IN_PROGRESS"
          - "CollectionEvent.open_lane_count >= 1"
        side_effects:
          - "Appointment.status = UNLOADING"

      - from: UNLOADING
        to: COMPLETED
        trigger: "POST /hhw/appointments/{id}/transitions (action=COMPLETE_UNLOAD)"
        actor: UnloadTech
        preconditions:
          - "CollectionEvent.lifecycle_status == IN_PROGRESS"
          - "Appointment has at least one DropoffLine"
        side_effects:
          - "BRANCH A — Appointment.status = COMPLETED; unload_complete_utc = current_utc; reserved_kg = 0"
          - "Resident.annual_quantity_reserved_kg decreased by declared_total_kg; Resident.annual_quantity_settled_kg recomputed from ACCEPTED lines; Resident.completed_visit_count recomputed"
          - "CollectionEvent.reserved_slot_count decreased by 1; participant_count increased by 1; accepted_tonnage_kg / rejected_tonnage_kg recomputed"
          - "Program.participant_count_ytd recomputed"

      - from: UNLOADING
        to: REFERRED_OUT
        trigger: "POST /hhw/appointments/{id}/transitions (action=REFER_BUSINESS)"
        actor: UnloadTech
        preconditions:
          - "CollectionEvent.lifecycle_status == IN_PROGRESS"
          - "referral_program_code is supplied"
        side_effects:
          - "BRANCH B — Appointment.status = REFERRED_OUT; referral_program_code recorded; referral_packet_code minted as '<referral_program_code>-<event.event_date>-<queue_seq>'; reserved_kg = 0"
          - "Every DropoffLine of this appointment has disposition rewritten to REFERRED_BUSINESS and rejection_reason_code = BUSINESS_GENERATOR, and estimated_disposal_cost_cents set to 0"
          - "Because those lines left ACCEPTED: Resident.annual_quantity_settled_kg is recomputed and CollectionEvent.accepted_tonnage_kg / rejected_tonnage_kg are recomputed"
          - "Resident.annual_quantity_reserved_kg decreased by declared_total_kg; CollectionEvent.reserved_slot_count decreased by 1"
          - "CollectionEvent.participant_count is NOT increased — a referred-out visitor is not a participant"

      - from: CHECKED_IN
        to: REFERRED_OUT
        trigger: "POST /hhw/appointments/{id}/transitions (action=REFER_BUSINESS)"
        actor: UnloadTech
        preconditions:
          - "CollectionEvent.lifecycle_status == IN_PROGRESS"
          - "referral_program_code is supplied"
        side_effects:
          - "Same BRANCH B side effects; the appointment has no DropoffLine rows yet so only the reservation release and referral_packet_code minting apply"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /hhw/appointments/{id}/transitions (action=NO_SHOW)"
        actor: UnloadTech
        preconditions:
          - "CollectionEvent.lifecycle_status == IN_PROGRESS"
        side_effects:
          - "HOP 1 — Appointment.status = NO_SHOW; reserved_kg = 0; Resident.annual_quantity_reserved_kg decreased by declared_total_kg; CollectionEvent.reserved_slot_count decreased by 1"
          - "HOP 2 (because the appointment became NO_SHOW) — Resident.no_show_strike_count recomputed; when it reaches 2 the Resident ELIGIBLE -> SUSPENDED system transition fires"
          - "HOP 3 (because the resident became SUSPENDED) — every other Appointment of that resident with status IN {REQUESTED, CONFIRMED, WAITLISTED} transitions to CANCELLED with cancel_reason = RESIDENT_SUSPENDED, processed in Appointment.created_at ASC order, releasing each reservation"
          - "HOP 4 (because those appointments were cancelled) — each affected CollectionEvent.reserved_slot_count is decremented and its projected_cost_per_participant_cents recomputed; Program.posture recomputed"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /hhw/appointments/{id}/transitions (action=CANCEL)"
        actor: "Resident (owner) | EligibilityClerk"
        preconditions: []
        side_effects:
          - "Appointment.status = CANCELLED; cancel_reason recorded (default RESIDENT_REQUEST)"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /hhw/appointments/{id}/transitions (action=CANCEL)"
        actor: "Resident (owner) | EligibilityClerk"
        preconditions: []
        side_effects:
          - "Appointment.status = CANCELLED; cancel_reason recorded; reserved_kg = 0"
          - "Resident.annual_quantity_reserved_kg decreased by declared_total_kg (compensating action for CONFIRM)"
          - "CollectionEvent.reserved_slot_count decreased by 1; projected_cost_per_participant_cents recomputed"
          - "Program.posture recomputed"

      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /hhw/appointments/{id}/transitions (action=CANCEL)"
        actor: "Resident (owner) | EligibilityClerk"
        preconditions: []
        side_effects:
          - "Appointment.status = CANCELLED; cancel_reason recorded; no reservation to release"

      - from: WAITLISTED
        to: EXPIRED
        trigger: "system: CollectionEvent lifecycle_status transitions IN_PROGRESS -> CLOSED"
        actor: system
        preconditions:
          - "CollectionEvent.lifecycle_status became CLOSED in this request"
        side_effects:
          - "Appointment.status = EXPIRED"

  # ------------------------------------------------------ PackedContainer ----
  - entity: PackedContainer
    field: status
    initial_state: OPEN
    terminal_states: [DISPOSED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /hhw/containers/{id}/transitions (action=SEAL)"
        actor: PackingContractor
        preconditions:
          - "PackedContainer.line_count >= 1"
          - "Program.posture != FROZEN"
          - "Program.budget_encumbered_cents + Program.budget_in_transit_cents + Program.budget_spent_cents + PackedContainer.estimated_disposal_cost_cents <= Program.budget_cents"
        side_effects:
          - "PackedContainer.status = SEALED; sealed_by_user_id = X-User-ID"
          - "Program.budget_encumbered_cents increased by PackedContainer.estimated_disposal_cost_cents"
          - "Program.posture recomputed"

      - from: SEALED
        to: OPEN
        trigger: "POST /hhw/containers/{id}/transitions (action=UNSEAL)"
        actor: PackingContractor
        preconditions:
          - "PackedContainer.manifest_id IS null"
        side_effects:
          - "PackedContainer.status = OPEN; sealed_by_user_id = null"
          - "Program.budget_encumbered_cents decreased by PackedContainer.estimated_disposal_cost_cents (compensating action for SEAL)"
          - "Program.posture recomputed"

      - from: SEALED
        to: MANIFESTED
        trigger: "system: POST /hhw/manifests lists this container in container_ids, or the manifest that previously carried it transitions DISCREPANCY -> DRAFT"
        actor: system
        preconditions:
          - "PackedContainer.event_id == Manifest.event_id"
        side_effects:
          - "PackedContainer.status = MANIFESTED; manifest_id set; discrepancy_flag cleared"

      - from: MANIFESTED
        to: SEALED
        trigger: "system: the carrying Manifest is VOIDED by a superseding manifest, or transitions DISCREPANCY -> DRAFT with this container dropped"
        actor: system
        preconditions: []
        side_effects:
          - "PackedContainer.status = SEALED; manifest_id = null"

      - from: MANIFESTED
        to: SHIPPED
        trigger: "system: the carrying Manifest transitions SIGNED -> SHIPPED"
        actor: system
        preconditions: []
        side_effects:
          - "PackedContainer.status = SHIPPED"
          - "Program.budget_encumbered_cents decreased by estimated_disposal_cost_cents; Program.budget_in_transit_cents increased by the same amount"

      - from: SHIPPED
        to: SEALED
        trigger: "system: the carrying Manifest transitions SHIPPED -> DISCREPANCY"
        actor: system
        preconditions: []
        side_effects:
          - "PackedContainer.status = SEALED; manifest_id = null; discrepancy_flag = true"
          - "Program.budget_in_transit_cents decreased by estimated_disposal_cost_cents; Program.budget_encumbered_cents increased by the same amount (compensating action for the SHIP transfer)"

      - from: SHIPPED
        to: DISPOSED
        trigger: "system: the carrying Manifest transitions SHIPPED -> RECEIVED"
        actor: system
        preconditions: []
        side_effects:
          - "PackedContainer.status = DISPOSED"
          - "Program.budget_in_transit_cents decreased by estimated_disposal_cost_cents"

  # ------------------------------------------------------------- Manifest ----
  - entity: Manifest
    field: status
    initial_state: DRAFT
    terminal_states: [RECEIVED, VOIDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /hhw/manifests/{id}/transitions (action=SIGN)"
        actor: ProgramAdmin
        preconditions:
          - "Every PackedContainer in Manifest.container_ids has status == MANIFESTED"
          - "Manifest.container_ids is non-empty"
        side_effects:
          - "Manifest.status = SIGNED; signed_by_user_id = X-User-ID; signed_at_utc = current_utc"

      - from: SIGNED
        to: SHIPPED
        trigger: "POST /hhw/manifests/{id}/transitions (action=SHIP)"
        actor: PackingContractor
        preconditions: []
        side_effects:
          - "Manifest.status = SHIPPED"
          - "Every container of this manifest transitions MANIFESTED -> SHIPPED, moving its estimate from Program.budget_encumbered_cents to Program.budget_in_transit_cents"
          - "Program.posture recomputed"

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /hhw/manifests/{id}/transitions (action=RECEIVE)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Manifest.status = RECEIVED"
          - "Manifest.blended_rate_cents_per_kg and Manifest.invoiced_disposal_cost_cents minted per calculations.disposal_cost_valuation (manifest_invoice variant)"
          - "Every container of this manifest transitions SHIPPED -> DISPOSED, draining Program.budget_in_transit_cents"
          - "Program.budget_spent_cents increased by Manifest.invoiced_disposal_cost_cents"
          - "CollectionEvent.tonnage_reported_kg recomputed; Program.tonnage_ytd_kg recomputed"
          - "Program.posture recomputed"

      - from: SHIPPED
        to: DISCREPANCY
        trigger: "POST /hhw/manifests/{id}/transitions (action=REJECT)"
        actor: ProgramAdmin
        preconditions:
          - "discrepancy_code is supplied"
        side_effects:
          - "HOP 1 — Manifest.status = DISCREPANCY; discrepancy_code recorded"
          - "HOP 2 (because the manifest entered DISCREPANCY) — every PackedContainer with manifest_id == this manifest transitions SHIPPED -> SEALED, clears manifest_id and sets discrepancy_flag = true, processed in PackedContainer.created_at ASC order; each move returns estimated_disposal_cost_cents from Program.budget_in_transit_cents to Program.budget_encumbered_cents"
          - "HOP 3 (because those containers now carry discrepancy_flag) — CollectionEvent.discrepancy_container_count is recomputed above 0, which blocks the CLOSED -> RECONCILED transition"
          - "Program.posture recomputed"

      - from: DISCREPANCY
        to: DRAFT
        trigger: "POST /hhw/manifests/{id}/transitions (action=REOPEN)"
        actor: PackingContractor
        preconditions:
          - "At least one PackedContainer of this manifest's event has discrepancy_flag == true, status == SEALED and manifest_id == null"
        side_effects:
          - "Manifest.status = DRAFT; discrepancy_code cleared; signed_by_user_id and signed_at_utc cleared"
          - "Every PackedContainer of this manifest's event with discrepancy_flag == true, status == SEALED and manifest_id == null is re-attached: SEALED -> MANIFESTED, manifest_id set to this manifest, discrepancy_flag cleared, processed in PackedContainer.created_at ASC order"
          - "Because those containers cleared discrepancy_flag: CollectionEvent.discrepancy_container_count falls back to 0, unblocking the CLOSED -> RECONCILED transition"
        note: "Closes the DRAFT -> SIGNED -> SHIPPED -> DISCREPANCY -> DRAFT -> SIGNED revision cycle; the re-attached containers stay encumbered in Program.budget_encumbered_cents throughout."

      - from: DRAFT
        to: VOIDED
        trigger: "system: POST /hhw/manifests creates a superseding manifest for the same event"
        actor: system
        preconditions:
          - "Manifest.status == DRAFT at the moment the superseding manifest is created"
        side_effects:
          - "Manifest.status = VOIDED; superseded_by_manifest_id = id of the new manifest"
          - "Every container of the voided manifest transitions MANIFESTED -> SEALED and clears manifest_id"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-create-stale-resident
    parent_entity: Resident
    write_endpoint: "POST /hhw/appointments"
    occ_field: "expected_resident_version"
    description: |
      Creating an Appointment against a Resident whose version has advanced since
      the client last observed it is rejected. A new appointment for a resident who
      already holds a non-terminal appointment at the same event legitimately
      supersedes that appointment (the prior one is CANCELLED with
      cancel_reason = SUPERSEDED and its reservation released), so a writer holding
      a stale view of the resident would silently discard a booking it never saw.
      The stale-version check turns that into a deterministic rejection.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: manifest-create-stale-event
    parent_entity: CollectionEvent
    write_endpoint: "POST /hhw/manifests"
    occ_field: "expected_event_version"
    description: |
      Creating a Manifest against a CollectionEvent whose version has advanced since
      the client last observed it is rejected. A new manifest for an event
      legitimately supersedes any DRAFT manifest already open on that event (the
      prior DRAFT is VOIDED and its containers returned to SEALED), so a writer
      working from a stale view of the event would void a manifest it never read.
      The stale-version check makes the outcome deterministic.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: event_slot_capacity
    trigger: "Recomputed on every LaneAssignment create/release, on every event containment_status transition, and on the SITE_CONFIRMED -> OPEN_FOR_REGISTRATION transition"
    algorithm: threshold
    combinatorial_mode: "(a) formula with >=3 inputs and non-linear interaction (nested min/floor plus a conditional branch on CollectionEvent.containment_status)"
    formula: |
      # All three legs are evaluated, then the binding constraint is the minimum.
      window_duration_hours = round_half_up((window_end_utc - window_start_utc) / 3600 seconds, 2)

      lane_throughput      = floor(open_lane_count * VEHICLES_PER_LANE_HOUR * window_duration_hours)
      staffing_capacity    = floor(certified_staff_hours / STAFF_HOURS_PER_VEHICLE)

      base_containment     = floor(Site.secondary_containment_liters / CONTAINMENT_LITERS_PER_VEHICLE)
      containment_capacity =
          base_containment                                  if containment_status == COMPLIANT
          floor(base_containment * REMEDIATED_DERATE)        if containment_status == REMEDIATED
          0                                                  if containment_status IN {PENDING_INSPECTION, DEFICIENT}

      slot_capacity = min(lane_throughput, staffing_capacity, containment_capacity)
    input_set: |
      open_lane_count counts DISTINCT lane_number over LaneAssignment rows of this event with status == ACTIVE.
      certified_staff_hours sums duration_hours over LaneAssignment rows of this event with status == ACTIVE whose
      Staffer has status == ACTIVE AND hazwoper_expires_on >= CollectionEvent.event_date (string date compare).
      RELEASED assignments and assignments held by INACTIVE or lapsed staffers are excluded from both legs.
      Site is resolved through CollectionEvent.site_id.
    constants:
      VEHICLES_PER_LANE_HOUR: 12
      STAFF_HOURS_PER_VEHICLE: 0.25
      CONTAINMENT_LITERS_PER_VEHICLE: 40
      REMEDIATED_DERATE: 0.5
    precision: "slot_capacity is an integer; window_duration_hours is 2 decimals round_half_up; every division is floored"
    worked_example: |
      1 open lane, window 2026-09-12T08:00:00Z..2026-09-12T20:00:00Z (12.00 h), one ACTIVE 12.00 h assignment,
      site secondary_containment_liters = 2000.
        lane_throughput      = floor(1 * 12 * 12.00)  = 144
        staffing_capacity    = floor(12.00 / 0.25)    = 48
        base_containment     = floor(2000 / 40)       = 50
        COMPLIANT   -> containment_capacity = 50  -> slot_capacity = min(144, 48, 50) = 48
        REMEDIATED  -> containment_capacity = floor(50 * 0.5) = 25 -> slot_capacity = min(144, 48, 25) = 25

  - name: disposal_cost_valuation
    trigger: "container_estimate variant on every DropoffLine pack/unpack and on PackedContainer SEAL; manifest_invoice variant once, on the Manifest SHIPPED -> RECEIVED transition"
    algorithm: tiered_pricing
    combinatorial_mode: "(b) nested rounding where order matters — the same mass and the same rates yield different cents under round-then-sum vs sum-then-round; both orders are pinned below"
    formula: |
      # ---- variant container_estimate : ROUND PER LINE, THEN SUM ----------------
      for each DropoffLine L with container_id == C.id AND disposition == ACCEPTED:
          line_cost_cents(L) = round_half_up(L.net_weight_kg * MaterialCategory(L).disposal_rate_cents_per_kg)
      C.estimated_disposal_cost_cents = sum over L of line_cost_cents(L)          # integer cents
      C.net_weight_kg                 = round_half_up(sum over L of L.net_weight_kg, 3)

      # ---- variant manifest_invoice : SUM FIRST, BLEND, THEN ROUND ONCE ---------
      M.net_weight_kg = round_half_up(sum over containers C of C.net_weight_kg, 3)
      weighted_cents  = sum over all ACCEPTED lines L in all containers of M of
                          (L.net_weight_kg * MaterialCategory(L).disposal_rate_cents_per_kg)   # exact, unrounded
      M.blended_rate_cents_per_kg     = round_half_up(weighted_cents / M.net_weight_kg, 4)   if M.net_weight_kg > 0 else 0
      M.invoiced_disposal_cost_cents  = round_half_up(M.net_weight_kg * M.blended_rate_cents_per_kg)

      # The two variants are NOT reconciled: the container estimate drives budget
      # encumbrance, the manifest invoice drives budget_spent_cents. Their delta is
      # the program's rounding variance and is never written back to the containers.
    input_set: |
      Only DropoffLine rows with disposition == ACCEPTED and a non-null container_id participate in either variant.
      Lines whose disposition is REJECTED_* or REFERRED_BUSINESS are never packable, contribute 0 cents, and are
      excluded from net_weight_kg. Containers enter the manifest legs only while manifest_id == M.id.
    constants: {}
    precision: "line and container costs are integer cents, round_half_up; blended_rate_cents_per_kg is 4 decimals round_half_up; masses are 3 decimals round_half_up"
    variants:
      - name: container_estimate
        when: "PackedContainer.estimated_disposal_cost_cents, computed at pack time and frozen at SEAL; drives Program.budget_encumbered_cents"
        difference: "Rounds each line to whole cents BEFORE summing, so every line's fractional cent is resolved independently and upward-biased"
      - name: manifest_invoice
        when: "Manifest.invoiced_disposal_cost_cents, minted once at the SHIPPED -> RECEIVED transition; drives Program.budget_spent_cents"
        difference: "Sums exact unrounded line values, derives one blended rate, and rounds ONCE at the manifest level, so per-line fractional cents cancel instead of accumulating"
    worked_example: |
      One TOXIC container holding three ACCEPTED LATEX_PAINT lines at 155 cents/kg: 1.5 kg, 2.5 kg, 0.5 kg.
        container_estimate: round(232.5)=233, round(387.5)=388, round(77.5)=78  -> 233+388+78 = 699 cents
        manifest_invoice  : net = 4.5 kg; weighted = 697.5; blended = 155.0000; round(4.5*155.0000) = round(697.5) = 698 cents
      Identical inputs, 1 cent apart. 699 is encumbered at SEAL; 698 is spent at RECEIVE.

  - name: appointment_quota_ledger
    trigger: "provisional_reservation variant on Appointment REQUESTED/WAITLISTED -> CONFIRMED and on every release transition; final_settlement variant on every DropoffLine creation and on UNLOADING -> COMPLETED"
    algorithm: aggregation
    formula: |
      # ---- variant provisional_reservation (declared mass, whole-appointment) ----
      Resident.annual_quantity_reserved_kg =
          round_half_up( sum of A.declared_total_kg
                         over Appointment A with A.resident_id == R.id
                         and A.status IN {CONFIRMED, CHECKED_IN, UNLOADING}, 3 )

      # ---- variant final_settlement (weighed mass, accepted lines only) ---------
      Resident.annual_quantity_settled_kg =
          round_half_up( sum of L.net_weight_kg
                         over DropoffLine L whose Appointment.resident_id == R.id
                         and L.disposition == ACCEPTED, 3 )

      Appointment.reserved_kg = declared_total_kg while status IN {CONFIRMED, CHECKED_IN, UNLOADING}, else 0
      Appointment.settled_kg  = round_half_up(sum of net_weight_kg over its ACCEPTED DropoffLine rows, 3)
    input_set: |
      provisional_reservation counts the WHOLE declared_total_kg of every appointment in {CONFIRMED, CHECKED_IN,
      UNLOADING} — REQUESTED and WAITLISTED appointments reserve nothing, and every terminal status
      ({COMPLETED, REFERRED_OUT, NO_SHOW, CANCELLED, EXPIRED}) reserves nothing.
      final_settlement counts ONLY lines whose ladder disposition resolved to ACCEPTED; REJECTED_PROHIBITED,
      REJECTED_OVER_ANNUAL_LIMIT, REJECTED_OVER_EVENT_LIMIT and REFERRED_BUSINESS lines contribute 0 kg even
      though they were physically weighed and are still reported in rejected_tonnage_kg.
    constants: {}
    precision: "3 decimal places, round_half_up"
    variants:
      - name: provisional_reservation
        when: "Capacity and quota are held against the resident's DECLARED mass from CONFIRM until the appointment leaves the reserving set"
        difference: "Uses Appointment.declared_total_kg — an operator-entered promise — and never inspects DropoffLine rows"
      - name: final_settlement
        when: "The year-to-date quota consumed by the resident, recomputed from weighed DropoffLine rows"
        difference: "Uses DropoffLine.net_weight_kg filtered to disposition == ACCEPTED, so a resident who declared 18.5 kg but had 4.5 kg accepted settles 4.5 kg while having reserved 18.5 kg"
    note: "COMPLETING an appointment moves mass out of annual_quantity_reserved_kg and into annual_quantity_settled_kg, and the two figures are deliberately NOT equal."

  - name: dropoff_disposition_ladder
    trigger: "POST /hhw/dropoff-lines — evaluated once at line creation and frozen on the row thereafter"
    algorithm: waterfall_allocation
    formula: |
      # Rungs are evaluated STRICTLY top to bottom; the FIRST matching rung wins and
      # no later rung is consulted. A line that breaches several rungs reports the
      # HIGHEST rung it breached.
      RUNG 1  if MaterialCategory.acceptance_policy == REJECTED_ALWAYS:
                  disposition = REJECTED_PROHIBITED ; rejection_reason_code = PROHIBITED_MATERIAL
      RUNG 2  elif resident_ytd_accepted_kg + net_weight_kg > MaterialCategory.max_kg_per_resident_per_year:
                  disposition = REJECTED_OVER_ANNUAL_LIMIT ; rejection_reason_code = ANNUAL_LIMIT
      RUNG 3  elif appointment_event_accepted_kg + net_weight_kg > MaterialCategory.max_kg_per_resident_per_event:
                  disposition = REJECTED_OVER_EVENT_LIMIT ; rejection_reason_code = EVENT_LIMIT
      RUNG 4  else:
                  disposition = ACCEPTED ; rejection_reason_code = null

      # REFERRED_BUSINESS is NOT produced by this ladder. It is written only by the
      # Appointment REFER_BUSINESS transition, which rewrites every line of the
      # appointment to disposition = REFERRED_BUSINESS with
      # rejection_reason_code = BUSINESS_GENERATOR and estimated_disposal_cost_cents = 0.

      estimated_disposal_cost_cents =
          round_half_up(net_weight_kg * MaterialCategory.disposal_rate_cents_per_kg) if disposition == ACCEPTED else 0
    input_set: |
      resident_ytd_accepted_kg   = sum of net_weight_kg over DropoffLine rows with disposition == ACCEPTED,
                                   the SAME material_category_id, and an Appointment whose resident_id matches,
                                   across ALL events of the program, EXCLUDING the line being created.
      appointment_event_accepted_kg = sum of net_weight_kg over DropoffLine rows with disposition == ACCEPTED,
                                   the SAME material_category_id, and the SAME appointment_id,
                                   EXCLUDING the line being created.
      Both sums count only ACCEPTED lines, so a previously rejected line never consumes quota.
    constants: {}
    precision: "comparisons use exact decimal arithmetic; both limits are breached only on STRICT greater-than, so a cumulative total exactly equal to a limit is ACCEPTED"
    note: |
      RUNG 2 precedes RUNG 3 on purpose: a line that exceeds BOTH the annual and the per-event ceiling
      reports REJECTED_OVER_ANNUAL_LIMIT, never REJECTED_OVER_EVENT_LIMIT.
      The ladder never raises an HTTP error — POST /hhw/dropoff-lines returns 201 with the resolved
      disposition, because a rejected material must still be counted in rejected_tonnage_kg.

  - name: waitlist_promotion_sweep
    trigger: "Every event containment_status transition into REMEDIATED or COMPLIANT"
    algorithm: chronological
    formula: |
      candidates = Appointment rows with event_id == E.id
                   AND status == WAITLISTED
                   AND waitlist_reason == CONTAINMENT_DEFICIENCY
      sort candidates by Appointment.created_at ASC; tie-break by Appointment.queue_seq ASC
      for each candidate in that order:
          if E.reserved_slot_count + 1 <= E.slot_capacity
             AND Resident.eligibility_status == ELIGIBLE
             AND Program.posture == OPEN:
                 promote candidate to CONFIRMED (waitlist_reason cleared, declared_total_kg re-reserved)
                 E.reserved_slot_count += 1
          else:
                 leave candidate WAITLISTED and CONTINUE to the next candidate
    input_set: "Only CONTAINMENT_DEFICIENCY waitlist entries are swept; waitlist_reason == CAPACITY entries are promoted exclusively by an explicit PROMOTE action."
    constants: {}
    precision: "integer slot counting; capacity is re-read after every promotion so the sweep stops exactly at slot_capacity"
    note: "Ordering is Appointment.created_at ASC then queue_seq ASC. Appointment.id is never consulted."

  - name: staff_hours_ledger
    trigger: "POST /hhw/lane-assignments, POST /hhw/lane-assignments/{id}/release, and every cascade that releases assignments"
    algorithm: aggregation
    formula: |
      LaneAssignment.duration_hours = round_half_up((end_utc - start_utc) / 3600 seconds, 2)
      Staffer.assigned_hours = round_half_up( sum of duration_hours
                                              over LaneAssignment rows with staffer_id == S.id
                                              and status == ACTIVE, 2 )
      CollectionEvent.certified_staff_hours = round_half_up( sum of duration_hours
                                              over LaneAssignment rows with event_id == E.id and status == ACTIVE
                                              whose Staffer.status == ACTIVE and Staffer.hazwoper_expires_on >= E.event_date, 2 )
      CollectionEvent.staffing_cost_cents   = round_half_up(certified_staff_hours * Program.staff_hourly_rate_cents)
      CollectionEvent.open_lane_count       = count of DISTINCT lane_number over ACTIVE LaneAssignment rows of E
    input_set: "Only status == ACTIVE assignments count. RELEASED assignments are retained as history and contribute 0 hours."
    constants: {}
    precision: "hours 2 decimals round_half_up; cents integer round_half_up"

  - name: program_cost_rollup
    trigger: "GET /hhw/programs/{id}/cost-summary — evaluated on read"
    algorithm: waterfall_allocation
    combinatorial_mode: "(c) circular-looking dependency — the contingency reserve reads as 'a percentage of total program cost', but total program cost contains the contingency. The evaluation order below pins the value: contingency is 8% of the PRE-contingency subtotal, never of the total."
    formula: |
      # Steps execute in this exact order. No step may read a later step's output.
      STEP 1  received_manifests    = Manifest rows of this program with status == RECEIVED
      STEP 2  disposal_subtotal_cents = sum of invoiced_disposal_cost_cents over received_manifests
      STEP 3  received_tonnage_kg     = round_half_up(sum of net_weight_kg over received_manifests, 3)
      STEP 4  tier selection on received_tonnage_kg:
                  received_tonnage_kg <  2000  -> MOBILIZATION = 250000, REBATE_PCT = 0.00
                  2000 <= received_tonnage_kg <  8000  -> MOBILIZATION = 180000, REBATE_PCT = 0.03
                  received_tonnage_kg >= 8000  -> MOBILIZATION = 120000, REBATE_PCT = 0.06
              mobilization_fee_cents = 0 when received_manifests is EMPTY, otherwise MOBILIZATION
      STEP 5  volume_rebate_cents  = floor(disposal_subtotal_cents * REBATE_PCT)
      STEP 6  staffing_cost_cents  = sum of CollectionEvent.staffing_cost_cents over events of this program
                                     with lifecycle_status != CANCELLED
      STEP 7  pre_contingency_cents = disposal_subtotal_cents + mobilization_fee_cents + staffing_cost_cents
                                      - volume_rebate_cents
      STEP 8  contingency_cents     = round_half_up(pre_contingency_cents * CONTINGENCY_PCT)
      STEP 9  total_program_cost_cents = pre_contingency_cents + contingency_cents
      STEP 10 participant_count     = count of Appointment rows with status == COMPLETED
                                      whose event belongs to this program
      STEP 11 cost_per_participant_cents = floor(total_program_cost_cents / participant_count)
                                            when participant_count > 0, otherwise 0
    input_set: |
      Only RECEIVED manifests enter STEPS 1-5; SHIPPED, DISCREPANCY, SIGNED, DRAFT and VOIDED manifests contribute
      nothing to either the subtotal or the tonnage tier. Only non-CANCELLED events contribute staffing cost.
      Only COMPLETED appointments count as participants — REFERRED_OUT, NO_SHOW, CANCELLED and EXPIRED do not.
    constants:
      CONTINGENCY_PCT: 0.08
      TIER_1_TONNAGE_KG: 2000
      TIER_2_TONNAGE_KG: 8000
      TIER_1_MOBILIZATION_CENTS: 250000
      TIER_2_MOBILIZATION_CENTS: 180000
      TIER_3_MOBILIZATION_CENTS: 120000
      TIER_1_REBATE_PCT: 0.00
      TIER_2_REBATE_PCT: 0.03
      TIER_3_REBATE_PCT: 0.06
    precision: "integer cents throughout; rebate and cost-per-participant use floor, contingency uses round_half_up"
    worked_example: |
      One RECEIVED manifest (invoiced 698 cents, 4.5 kg), one event with 12.00 certified staff hours at
      4200 cents/h, one COMPLETED appointment:
        disposal_subtotal = 698 ; received_tonnage = 4.5 -> tier 1 -> mobilization 250000, rebate_pct 0.00
        volume_rebate = 0 ; staffing = 50400
        pre_contingency = 698 + 250000 + 50400 - 0 = 301098
        contingency = round_half_up(301098 * 0.08) = round_half_up(24087.84) = 24088
        total = 325186 ; cost_per_participant = floor(325186 / 1) = 325186
      With zero COMPLETED appointments and zero received manifests the whole chain collapses to
      mobilization 0, total 0 and cost_per_participant_cents 0 — never a division error.

  - name: program_posture
    trigger: "Recomputed at the end of every request that mutates budget_encumbered_cents, budget_in_transit_cents, budget_spent_cents, open_containment_deficiency_count, or any event's projected_cost_per_participant_cents"
    algorithm: threshold
    formula: |
      committed_cents = budget_encumbered_cents + budget_in_transit_cents + budget_spent_cents

      posture_raw =
        FROZEN      if committed_cents >= budget_cents
                    OR open_containment_deficiency_count >= DEFICIENCY_FREEZE_COUNT
        RESTRICTED  elif committed_cents * 100 >= budget_cents * RESTRICT_UTILIZATION_PCT
                    OR EXISTS CollectionEvent e in this program with
                       e.lifecycle_status == OPEN_FOR_REGISTRATION
                       AND e.projected_cost_per_participant_cents > Program.cost_per_participant_ceiling_cents
        OPEN        otherwise

      posture = OPEN         if posture_override == OPEN
                             AND current_utc < posture_override_expires_utc
                             AND posture_raw != FROZEN
                else posture_raw

      # budget_alert_count increments by 1 whenever posture moves OPEN -> RESTRICTED,
      # OPEN -> FROZEN, or RESTRICTED -> FROZEN in a single request. It never decrements.
    input_set: "Events with lifecycle_status IN {PLANNED, SITE_CONFIRMED, IN_PROGRESS, CLOSED, RECONCILED, CANCELLED} are excluded from the projected-cost clause; only OPEN_FOR_REGISTRATION events can push the program to RESTRICTED."
    constants:
      DEFICIENCY_FREEZE_COUNT: 2
      RESTRICT_UTILIZATION_PCT: 85
    precision: "integer cents; the utilization test is cross-multiplied to avoid float division"
    note: "posture_override can lift RESTRICTED but never FROZEN. FROZEN blocks event creation, CONFIRM_SITE, OPEN_REGISTRATION, appointment CONFIRM/PROMOTE, container SEAL and manifest creation; RESTRICTED blocks OPEN_REGISTRATION and appointment CONFIRM/PROMOTE only."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST failing rule decides the response, later rules are not run)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, and X-User-Role is one of the eight declared roles"
    error_id: ERR_MISSING_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role appears in the endpoint's declared roles list, and — on POST /hhw/manifests/{id}/transitions — the action is allowed for that role (SIGN/RECEIVE/REJECT require ProgramAdmin, SHIP/REOPEN require PackingContractor)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_constraint
    check: "Request body carries every required field with the declared type, every enum value is a declared member, arrays are non-empty where required, numeric ranges hold (declared_total_kg > 0, net_weight_kg > 0, lane_count >= 1, vehicle_count in 1..2, capacity_kg > 0, limit in 1..100, offset >= 0), and window_end_utc is strictly after window_start_utc on the same UTC date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints and all list endpoints"

  - priority: 4
    category: existence
    check: "Every id in the request PATH resolves to a stored row, validated left to right"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_MATERIAL_CATEGORY_NOT_FOUND | ERR_STAFFER_NOT_FOUND | ERR_LANE_ASSIGNMENT_NOT_FOUND | ERR_CONTAINER_NOT_FOUND | ERR_MANIFEST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "Every foreign key in the request BODY resolves, validated in this declared order: program_id, site_id, replaces_site_id, event_id, resident_id, staffer_id, appointment_id, material_category_id, container_ids[], dropoff_line_id"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_STAFFER_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_MATERIAL_CATEGORY_NOT_FOUND | ERR_CONTAINER_NOT_FOUND"
    http_status: 404
    applies_to: "all mutating endpoints carrying foreign keys"

  - priority: 6
    category: auth
    check: "When X-User-Role == Resident, X-User-ID equals Resident.id of the appointment's resident_id (or of the resident named in the request body)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /hhw/appointments, POST /hhw/appointments/{id}/transitions"

  - priority: 7
    category: auth
    check: "Segregation of duties — the acting ContainmentInspector's X-User-ID must differ from Site.approved_by_user_id of the event's site"
    error_id: ERR_INSPECTOR_NOT_INDEPENDENT
    http_status: 403
    applies_to: "POST /hhw/events/{id}/containment-inspections"

  - priority: 8
    category: state
    check: "expected_resident_version equals Resident.version (POST /hhw/appointments); expected_event_version equals CollectionEvent.version (POST /hhw/manifests)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hhw/appointments, POST /hhw/manifests"

  - priority: 9
    category: state
    check: "The requested action is a declared transition out of the target row's current state on the relevant axis"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /hhw/sites/{id}/transitions, POST /hhw/events/{id}/transitions, POST /hhw/appointments/{id}/transitions, POST /hhw/containers/{id}/transitions, POST /hhw/manifests/{id}/transitions, POST /hhw/residents/{id}/eligibility-actions, POST /hhw/lane-assignments/{id}/release, POST /hhw/containers/{id}/lines, POST /hhw/dropoff-lines"

  - priority: 10
    category: state
    check: "The target event's lifecycle_status == OPEN_FOR_REGISTRATION when booking, confirming, waitlisting or promoting an appointment"
    error_id: ERR_EVENT_NOT_ACCEPTING_REGISTRATIONS
    http_status: 409
    applies_to: "POST /hhw/appointments, POST /hhw/appointments/{id}/transitions (CONFIRM, WAITLIST, PROMOTE)"

  - priority: 11
    category: state
    check: "The event's Site.status == APPROVED when creating an event or confirming its site"
    error_id: ERR_SITE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /hhw/events, POST /hhw/events/{id}/transitions (CONFIRM_SITE)"

  - priority: 12
    category: state
    check: "The event's containment_status is not DEFICIENT and not PENDING_INSPECTION when confirming/promoting an appointment, checking in, or starting the event"
    error_id: ERR_CONTAINMENT_DEFICIENT
    http_status: 409
    applies_to: "POST /hhw/appointments/{id}/transitions (CONFIRM, PROMOTE, CHECK_IN), POST /hhw/events/{id}/transitions (START, OPEN_REGISTRATION)"

  - priority: 13
    category: state
    check: "Every container listed in container_ids has status == SEALED and manifest_id == null when a manifest is created"
    error_id: ERR_CONTAINER_NOT_SEALED
    http_status: 409
    applies_to: "POST /hhw/manifests"

  - priority: 14
    category: state
    check: "Program.posture != FROZEN"
    error_id: ERR_PROGRAM_FROZEN
    http_status: 409
    applies_to: "POST /hhw/events, POST /hhw/sites/{id}/transitions (APPROVE, REINSTATE), POST /hhw/events/{id}/transitions (CONFIRM_SITE, OPEN_REGISTRATION), POST /hhw/appointments/{id}/transitions (CONFIRM, PROMOTE), POST /hhw/containers/{id}/transitions (SEAL), POST /hhw/manifests"

  - priority: 15
    category: state
    check: "Program.posture == OPEN (RESTRICTED blocks the operation even though FROZEN did not fire)"
    error_id: ERR_PROGRAM_RESTRICTED
    http_status: 409
    applies_to: "POST /hhw/events/{id}/transitions (OPEN_REGISTRATION), POST /hhw/appointments/{id}/transitions (CONFIRM, PROMOTE)"

  - priority: 16
    category: business_safety
    check: "Site containment screen — impervious_surface == true AND secondary_containment_liters >= 2000 AND storm_drain_distance_m >= 15.0"
    error_id: ERR_CONTAINMENT_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /hhw/sites/{id}/transitions (APPROVE, REINSTATE)"

  - priority: 17
    category: business_safety
    check: "Staffer.hazwoper_expires_on >= CollectionEvent.event_date (string date comparison; equal dates pass) and Staffer.status == ACTIVE"
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /hhw/lane-assignments"

  - priority: 18
    category: business_safety
    check: "No id in declared_category_ids names a MaterialCategory with acceptance_policy == REJECTED_ALWAYS"
    error_id: ERR_PROHIBITED_MATERIAL_DECLARED
    http_status: 422
    applies_to: "POST /hhw/appointments"

  - priority: 19
    category: business_safety
    check: "Appointment.waste_origin == HOUSEHOLD — a self-declared BUSINESS generator may hold a REQUESTED appointment but may never be CONFIRMED or WAITLISTED"
    error_id: ERR_BUSINESS_WASTE_EXCLUDED
    http_status: 422
    applies_to: "POST /hhw/appointments/{id}/transitions (CONFIRM, WAITLIST, PROMOTE)"

  - priority: 20
    category: business_safety
    check: "MaterialCategory.compatibility_class of the line equals PackedContainer.compatibility_class"
    error_id: ERR_INCOMPATIBLE_MATERIAL_CLASS
    http_status: 422
    applies_to: "POST /hhw/containers/{id}/lines"

  - priority: 21
    category: business_referential
    check: "The line's Appointment.event_id equals the container's event_id (and, for POST /hhw/manifests, every container's event_id equals the manifest's event_id)"
    error_id: ERR_CONTAINER_EVENT_MISMATCH
    http_status: 409
    applies_to: "POST /hhw/containers/{id}/lines, POST /hhw/manifests"

  - priority: 22
    category: business_referential
    check: "DropoffLine.container_id is null and DropoffLine.disposition == ACCEPTED"
    error_id: ERR_LINE_ALREADY_PACKED
    http_status: 409
    applies_to: "POST /hhw/containers/{id}/lines"

  - priority: 23
    category: business_temporal
    check: "Staffer interval geometry — HALF-OPEN [start_utc, end_utc) with a 30-minute decontamination buffer appended ONLY to the end of every existing ACTIVE assignment. The new interval is rejected when [new.start_utc, new.end_utc) intersects [existing.start_utc, existing.end_utc + 30 minutes) for any ACTIVE assignment of the same staffer, across all events. Starting exactly at existing.end_utc + 30 minutes is accepted."
    error_id: ERR_STAFFER_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /hhw/lane-assignments"

  - priority: 24
    category: business_temporal
    check: "Site interval geometry — CLOSED [window_start_utc, window_end_utc] on both endpoints, widened SYMMETRICALLY by a 48-hour mobilisation/teardown buffer on each side of every existing non-CANCELLED event at the same site. The new event is rejected when its closed [window_start_utc, window_end_utc] intersects [existing.window_start_utc - 48h, existing.window_end_utc + 48h] at even a single instant, so touching the buffered endpoint exactly is a conflict."
    error_id: ERR_SITE_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /hhw/events"

  - priority: 25
    category: business_temporal
    check: "Aggregate site capacity — the site already hosts fewer than 2 non-CANCELLED events whose event_date falls in the same UTC calendar month (YYYY-MM) as the new event"
    error_id: ERR_SITE_MONTHLY_EVENT_CAP
    http_status: 409
    applies_to: "POST /hhw/events"

  - priority: 26
    category: business_temporal
    check: "slot_start_utc lies inside the half-open window [event.window_start_utc, event.window_end_utc)"
    error_id: ERR_SLOT_OUTSIDE_EVENT_WINDOW
    http_status: 422
    applies_to: "POST /hhw/appointments"

  - priority: 27
    category: business_temporal
    check: "slot_start_utc is aligned to a 15-minute boundary measured from event.window_start_utc (minutes offset modulo 15 == 0 and seconds/milliseconds are zero)"
    error_id: ERR_SLOT_NOT_ALIGNED
    http_status: 422
    applies_to: "POST /hhw/appointments"

  - priority: 28
    category: business_constraint
    check: "Resident.eligibility_status == ELIGIBLE"
    error_id: ERR_RESIDENT_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /hhw/appointments/{id}/transitions (CONFIRM, WAITLIST, PROMOTE)"

  - priority: 29
    category: business_constraint
    check: "PackedContainer.net_weight_kg + DropoffLine.net_weight_kg <= PackedContainer.capacity_kg"
    error_id: ERR_CONTAINER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /hhw/containers/{id}/lines"

  - priority: 30
    category: business_fiscal
    check: "CollectionEvent.reserved_slot_count + 1 <= CollectionEvent.slot_capacity"
    error_id: ERR_EVENT_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /hhw/appointments/{id}/transitions (CONFIRM, PROMOTE)"

  - priority: 31
    category: business_fiscal
    check: "Program.budget_encumbered_cents + budget_in_transit_cents + budget_spent_cents + PackedContainer.estimated_disposal_cost_cents <= Program.budget_cents"
    error_id: ERR_PROGRAM_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /hhw/containers/{id}/transitions (SEAL)"

# =============================================================================
# §1.5 API Endpoint Table
#   All resources are addressed flatly at /hhw/<collection>/{id}. Sub-paths are
#   action verbs or computed reads, never containment. Every FK declared in §1.1
#   is reverse-reachable through the matching filtered-list GET below.
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Program ----
  - method: POST
    path: "/hhw/programs"
    description: "Create a county HHW collection program with its budget authority, cost ceiling and eligible jurisdictions."
    roles: [ProgramAdmin]
    code: 201
    input: [name, fiscal_year, budget_cents, cost_per_participant_ceiling_cents, staff_hourly_rate_cents, eligible_jurisdiction_codes]
    output: Program
    side_effects: ["Program created with posture = OPEN, all budget counters 0, version = 1"]

  - method: GET
    path: "/hhw/programs/{id}"
    description: "Read a program including its live posture and budget counters."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/hhw/programs/{id}/cost-summary"
    description: "Computed participation, tonnage, budget and cost-per-participant report per calculations.program_cost_rollup."
    roles: [ProgramAdmin, EventCoordinator]
    code: 200
    input: []
    output:
      event_count: integer
      participant_count: integer
      accepted_tonnage_kg: number
      rejected_tonnage_kg: number
      received_tonnage_kg: number
      disposal_subtotal_cents: integer
      mobilization_fee_cents: integer
      volume_rebate_cents: integer
      staffing_cost_cents: integer
      pre_contingency_cents: integer
      contingency_cents: integer
      total_program_cost_cents: integer
      cost_per_participant_cents: integer
    side_effects: ["none — read-only projection; Program.version is not incremented"]

  - method: POST
    path: "/hhw/programs/{id}/posture-override"
    description: "Record an administrative posture override. An OPEN override lifts RESTRICTED until it expires but can never lift FROZEN."
    roles: [ProgramAdmin]
    code: 200
    input: [posture_override, posture_override_expires_utc]
    output: Program
    side_effects: ["Program.posture_override and posture_override_expires_utc written", "Program.posture recomputed per calculations.program_posture", "increments Program.version by 1"]

  # ---------------------------------------------------------------- Site ----
  - method: POST
    path: "/hhw/sites"
    description: "Register a candidate collection site with its containment attributes."
    roles: [EventCoordinator]
    code: 201
    input: [program_id, name, address, impervious_surface, secondary_containment_liters, storm_drain_distance_m, lane_count, "replaces_site_id?"]
    output: Site
    side_effects: ["Site created with status = CANDIDATE"]

  - method: GET
    path: "/hhw/sites"
    description: "List sites, filterable by owning program, by the retired site they replace, and by status."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["program_id?", "replaces_site_id?", "status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: GET
    path: "/hhw/sites/{id}"
    description: "Read one site."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/hhw/sites/{id}/transitions"
    description: "Drive the site lifecycle: APPROVE / SUSPEND / REINSTATE (ContainmentInspector) or RETIRE (EventCoordinator)."
    roles: [ContainmentInspector, EventCoordinator]
    code: 200
    input: [action, "finding_code?"]
    output: Site
    side_effects: ["Site.status advanced", "APPROVE/REINSTATE stamp approved_by_user_id from X-User-ID", "SUSPEND forces containment_status = DEFICIENT on the site's SITE_CONFIRMED / OPEN_FOR_REGISTRATION events and cascades their CONFIRMED appointments to WAITLISTED", "increments Site.version by 1"]

  # ---------------------------------------------------- MaterialCategory ----
  - method: POST
    path: "/hhw/material-categories"
    description: "Publish an accepted or prohibited material category with its quantity limits, compatibility class and disposal rate."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, code, display_name, acceptance_policy, compatibility_class, dot_hazard_class, max_kg_per_resident_per_event, max_kg_per_resident_per_year, disposal_rate_cents_per_kg, "business_referral_program_code?"]
    output: MaterialCategory
    side_effects: ["MaterialCategory created"]

  - method: GET
    path: "/hhw/material-categories"
    description: "List the published accepted/rejected material list for a program."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["program_id?", "acceptance_policy?", "compatibility_class?", "limit?", "offset?"]
    output: MaterialCategory[]
    side_effects: []

  - method: GET
    path: "/hhw/material-categories/{id}"
    description: "Read one material category."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: MaterialCategory
    side_effects: []

  # ------------------------------------------------------------ Resident ----
  - method: POST
    path: "/hhw/residents"
    description: "Register a resident. Anonymous self-registration and clerk-assisted registration both land in PENDING_VERIFICATION."
    roles: [Anonymous, EligibilityClerk]
    code: 201
    input: [program_id, full_name, street_address, claimed_jurisdiction_code]
    output: Resident
    side_effects: ["Resident created with eligibility_status = PENDING_VERIFICATION, version = 1"]

  - method: GET
    path: "/hhw/residents"
    description: "List residents, filterable by program and eligibility status."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["program_id?", "eligibility_status?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []

  - method: GET
    path: "/hhw/residents/{id}"
    description: "Read one resident, including the live quota ledger and the current version needed for appointment OCC."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []

  - method: POST
    path: "/hhw/residents/{id}/eligibility-actions"
    description: "VERIFY the resident's jurisdiction of record, or REINSTATE a resident suspended for no-show strikes."
    roles: [EligibilityClerk]
    code: 200
    input: [action, "verified_jurisdiction_code?"]
    output: Resident
    side_effects: ["eligibility_status advanced per the Resident state machine", "verified_jurisdiction_code stored on VERIFY", "increments Resident.version by 1"]

  # ----------------------------------------------------- CollectionEvent ----
  - method: POST
    path: "/hhw/events"
    description: "Schedule a collection event at an approved site. Subject to the site's closed-interval occupancy buffer and its monthly event cap."
    roles: [EventCoordinator]
    code: 201
    input: [program_id, site_id, window_start_utc, window_end_utc, "min_viable_registrations?"]
    output: CollectionEvent
    side_effects: ["CollectionEvent created with lifecycle_status = PLANNED and containment_status = PENDING_INSPECTION", "event_date and window_duration_hours computed", "slot_capacity computed as 0 (no lanes, containment pending)"]

  - method: GET
    path: "/hhw/events"
    description: "List collection events, filterable by program, site and either state axis."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["program_id?", "site_id?", "lifecycle_status?", "containment_status?", "limit?", "offset?"]
    output: CollectionEvent[]
    side_effects: []

  - method: GET
    path: "/hhw/events/{id}"
    description: "Read one event with both state axes, live capacity, staffing and tonnage rollups, and the version needed for manifest OCC."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: CollectionEvent
    side_effects: []

  - method: POST
    path: "/hhw/events/{id}/transitions"
    description: "Drive the event lifecycle axis: CONFIRM_SITE / OPEN_REGISTRATION / START / CLOSE / RECONCILE / CANCEL."
    roles: [EventCoordinator]
    code: 200
    input: [action, "cancel_reason?"]
    output: CollectionEvent
    side_effects: ["lifecycle_status advanced per the CollectionEvent lifecycle machine", "CLOSE expires WAITLISTED appointments and no-shows REQUESTED/CONFIRMED ones in created_at ASC order", "CANCEL releases lane assignments and cancels open appointments", "Program.posture recomputed", "increments CollectionEvent.version by 1"]

  - method: POST
    path: "/hhw/events/{id}/containment-inspections"
    description: "File an event-day containment inspection. Drives the containment axis independently of lifecycle_status. The inspector must not be the site's approving inspector."
    roles: [ContainmentInspector]
    code: 200
    input: [result, "finding_code?", "remediation_note?"]
    output: CollectionEvent
    side_effects: ["containment_status advanced per the containment axis machine", "finding appended to containment_findings", "a transition into DEFICIENT waitlists CONFIRMED appointments and releases their reservations, which recomputes projected_cost_per_participant_cents and then Program.posture", "a transition into REMEDIATED or COMPLIANT runs calculations.waitlist_promotion_sweep", "slot_capacity recomputed", "increments CollectionEvent.version by 1"]

  # ------------------------------------------------------------- Staffer ----
  - method: POST
    path: "/hhw/staffers"
    description: "Register an event staffer with their HAZWOPER refresher expiry."
    roles: [EventCoordinator]
    code: 201
    input: [program_id, full_name, role_code, hazwoper_expires_on, "status?"]
    output: Staffer
    side_effects: ["Staffer created with status = ACTIVE and assigned_hours = 0"]

  - method: GET
    path: "/hhw/staffers"
    description: "List staffers, filterable by program and status."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["program_id?", "status?", "role_code?", "limit?", "offset?"]
    output: Staffer[]
    side_effects: []

  - method: GET
    path: "/hhw/staffers/{id}"
    description: "Read one staffer including the live assigned_hours ledger."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: Staffer
    side_effects: []

  # ------------------------------------------------------ LaneAssignment ----
  - method: POST
    path: "/hhw/lane-assignments"
    description: "Assign a staffer to an unload/traffic lane for an interval inside the event window. Enforces the half-open interval plus 30-minute decontamination buffer on the staffer."
    roles: [EventCoordinator]
    code: 201
    input: [event_id, staffer_id, lane_number, start_utc, end_utc]
    output: LaneAssignment
    side_effects: ["LaneAssignment created with status = ACTIVE and computed duration_hours", "Staffer.assigned_hours increased", "CollectionEvent.open_lane_count, certified_staff_hours, staffing_cost_cents, slot_capacity and projected_cost_per_participant_cents recomputed", "Program.posture recomputed"]

  - method: GET
    path: "/hhw/lane-assignments"
    description: "List lane assignments, filterable by event, staffer and status."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["event_id?", "staffer_id?", "status?", "limit?", "offset?"]
    output: LaneAssignment[]
    side_effects: []

  - method: GET
    path: "/hhw/lane-assignments/{id}"
    description: "Read one lane assignment."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: LaneAssignment
    side_effects: []

  - method: POST
    path: "/hhw/lane-assignments/{id}/release"
    description: "Compensating action for an assignment: release the staffer from the lane interval and return the hours to the ledger."
    roles: [EventCoordinator]
    code: 200
    input: ["released_reason?"]
    output: LaneAssignment
    side_effects: ["LaneAssignment.status = RELEASED", "Staffer.assigned_hours decreased by duration_hours", "CollectionEvent.open_lane_count, certified_staff_hours, staffing_cost_cents, slot_capacity and projected_cost_per_participant_cents recomputed", "increments LaneAssignment.version by 1"]

  # --------------------------------------------------------- Appointment ----
  - method: POST
    path: "/hhw/appointments"
    description: "Book an appointment slot. Supersedes the resident's existing non-terminal appointment at the same event; guarded by OCC on the resident's version."
    roles: [Resident, EligibilityClerk]
    code: 201
    input: [event_id, resident_id, slot_start_utc, waste_origin, declared_total_kg, declared_category_ids, expected_resident_version, "vehicle_count?"]
    output: Appointment
    side_effects: ["Appointment created with status = REQUESTED and the next per-event queue_seq", "any existing Appointment of this resident at this event with status IN {REQUESTED, CONFIRMED, WAITLISTED} transitions to CANCELLED with cancel_reason = SUPERSEDED, releasing its reservation", "increments Resident.version by 1"]

  - method: GET
    path: "/hhw/appointments"
    description: "List appointments, filterable by event, resident and status."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["event_id?", "resident_id?", "status?", "waitlist_reason?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: GET
    path: "/hhw/appointments/{id}"
    description: "Read one appointment including its reservation and settlement figures."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/hhw/appointments/{id}/transitions"
    description: "Drive the appointment lifecycle: CONFIRM / WAITLIST / PROMOTE / CANCEL (Resident owner or EligibilityClerk) and CHECK_IN / START_UNLOAD / COMPLETE_UNLOAD / REFER_BUSINESS / NO_SHOW (UnloadTech)."
    roles: [Resident, EligibilityClerk, UnloadTech]
    code: 200
    input: [action, "cancel_reason?", "referral_program_code?", "no_show_note?"]
    output: Appointment
    side_effects: ["status advanced per the Appointment machine", "CONFIRM/PROMOTE reserve declared_total_kg and a slot; CANCEL/NO_SHOW/COMPLETE_UNLOAD/REFER_BUSINESS release them", "REFER_BUSINESS rewrites every DropoffLine of the appointment to disposition = REFERRED_BUSINESS and mints referral_packet_code", "NO_SHOW may suspend the resident, which cancels their other open appointments", "Program.posture recomputed", "increments Appointment.version by 1"]

  # --------------------------------------------------------- DropoffLine ----
  - method: POST
    path: "/hhw/dropoff-lines"
    description: "Record a weighed material line at the unload lane. The disposition ladder resolves accepted / prohibited / over-limit / business-referred at creation; the call returns 201 in every case."
    roles: [UnloadTech]
    code: 201
    input: [appointment_id, material_category_id, declared_kg, net_weight_kg]
    output: DropoffLine
    side_effects: ["disposition, rejection_reason_code and estimated_disposal_cost_cents resolved per calculations.dropoff_disposition_ladder", "screened_by_user_id stamped from X-User-ID", "Appointment.settled_kg, Resident.annual_quantity_settled_kg, CollectionEvent.accepted_tonnage_kg and rejected_tonnage_kg recomputed"]

  - method: GET
    path: "/hhw/dropoff-lines"
    description: "List dropoff lines, filterable by appointment, material category, container and disposition."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["appointment_id?", "material_category_id?", "container_id?", "disposition?", "limit?", "offset?"]
    output: DropoffLine[]
    side_effects: []

  - method: GET
    path: "/hhw/dropoff-lines/{id}"
    description: "Read one dropoff line."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: DropoffLine
    side_effects: []

  # ------------------------------------------------------ PackedContainer ---
  - method: POST
    path: "/hhw/containers"
    description: "Open a lab-pack container for one compatibility class at an event."
    roles: [PackingContractor]
    code: 201
    input: [event_id, container_code, compatibility_class, capacity_kg]
    output: PackedContainer
    side_effects: ["PackedContainer created with status = OPEN, line_count 0, net_weight_kg 0"]

  - method: GET
    path: "/hhw/containers"
    description: "List packed containers, filterable by event, carrying manifest and status."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["event_id?", "manifest_id?", "status?", "limit?", "offset?"]
    output: PackedContainer[]
    side_effects: []

  - method: GET
    path: "/hhw/containers/{id}"
    description: "Read one container with its round-per-line-then-sum cost estimate."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: PackedContainer
    side_effects: []

  - method: POST
    path: "/hhw/containers/{id}/lines"
    description: "Lab-pack one ACCEPTED dropoff line into this container. Enforces compatibility class, same-event referential integrity and container capacity."
    roles: [PackingContractor]
    code: 200
    input: [dropoff_line_id]
    output: PackedContainer
    side_effects: ["DropoffLine.container_id set", "PackedContainer.line_count, net_weight_kg and estimated_disposal_cost_cents recomputed per calculations.disposal_cost_valuation (container_estimate variant)", "increments PackedContainer.version by 1"]

  - method: POST
    path: "/hhw/containers/{id}/transitions"
    description: "SEAL a packed container (encumbering its estimate against the program budget) or UNSEAL it (returning the encumbrance)."
    roles: [PackingContractor]
    code: 200
    input: [action]
    output: PackedContainer
    side_effects: ["status advanced OPEN <-> SEALED", "SEAL adds estimated_disposal_cost_cents to Program.budget_encumbered_cents and stamps sealed_by_user_id; UNSEAL subtracts it", "Program.posture recomputed", "increments PackedContainer.version by 1"]

  # ------------------------------------------------------------ Manifest ----
  - method: POST
    path: "/hhw/manifests"
    description: "Prepare a uniform hazardous waste manifest over SEALED containers of one event. Supersedes any DRAFT manifest already open on that event; guarded by OCC on the event's version."
    roles: [PackingContractor]
    code: 201
    input: [event_id, manifest_tracking_number, tsdf_epa_id, container_ids, expected_event_version]
    output: Manifest
    side_effects: ["Manifest created in DRAFT with prepared_by_user_id stamped from X-User-ID", "each listed container transitions SEALED -> MANIFESTED with manifest_id set", "any other DRAFT manifest of this event transitions to VOIDED with superseded_by_manifest_id set, returning its containers MANIFESTED -> SEALED", "increments CollectionEvent.version by 1"]

  - method: GET
    path: "/hhw/manifests"
    description: "List manifests, filterable by event, status and the manifest that superseded them."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: ["event_id?", "status?", "superseded_by_manifest_id?", "limit?", "offset?"]
    output: Manifest[]
    side_effects: []

  - method: GET
    path: "/hhw/manifests/{id}"
    description: "Read one manifest including its blended rate and invoiced amount once received."
    roles: [ProgramAdmin, EventCoordinator, ContainmentInspector, EligibilityClerk, UnloadTech, PackingContractor, Resident]
    code: 200
    input: []
    output: Manifest
    side_effects: []

  - method: POST
    path: "/hhw/manifests/{id}/transitions"
    description: "Drive the manifest cycle: SIGN / RECEIVE / REJECT (ProgramAdmin) and SHIP / REOPEN (PackingContractor)."
    roles: [ProgramAdmin, PackingContractor]
    code: 200
    input: [action, "discrepancy_code?", "invoice_reference?"]
    output: Manifest
    side_effects: ["status advanced per the Manifest cycle", "SHIP moves each container MANIFESTED -> SHIPPED and its estimate from budget_encumbered_cents to budget_in_transit_cents", "RECEIVE mints blended_rate_cents_per_kg and invoiced_disposal_cost_cents, disposes the containers and adds the invoice to budget_spent_cents", "REJECT returns every container SHIPPED -> SEALED with discrepancy_flag = true and re-encumbers their estimates", "Program.posture recomputed", "increments Manifest.version by 1"]

  # --------------------------------------------------------- logical clock --
  - method: POST
    path: "/hhw/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: datetime
    side_effects: ["logical clock set; no entity is mutated and no version is incremented"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_CONTEXT_HEADER,        http: 400, condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the eight declared roles" }
  - { id: ERR_INVALID_REQUEST,               http: 400, condition: "Missing required body field, wrong type, undeclared enum member, empty required array, out-of-range number, limit outside 1..100, offset < 0, or window_end_utc not strictly after window_start_utc on the same UTC date" }
  - { id: ERR_UNAUTHORIZED_ROLE,             http: 403, condition: "X-User-Role is not listed for the endpoint, or the manifest action is not permitted for that role (SIGN/RECEIVE/REJECT are ProgramAdmin-only; SHIP/REOPEN are PackingContractor-only)" }
  - { id: ERR_NOT_RESOURCE_OWNER,            http: 403, condition: "A Resident acts on an appointment whose resident_id differs from X-User-ID" }
  - { id: ERR_INSPECTOR_NOT_INDEPENDENT,     http: 403, condition: "The acting ContainmentInspector's X-User-ID equals Site.approved_by_user_id of the event's site" }
  - { id: ERR_RESIDENT_NOT_ELIGIBLE,         http: 403, condition: "Resident.eligibility_status is not ELIGIBLE when confirming, waitlisting or promoting an appointment" }
  - { id: ERR_PROGRAM_NOT_FOUND,             http: 404, condition: "No Program row with the given id" }
  - { id: ERR_SITE_NOT_FOUND,                http: 404, condition: "No Site row with the given id (path id, site_id, or replaces_site_id)" }
  - { id: ERR_EVENT_NOT_FOUND,               http: 404, condition: "No CollectionEvent row with the given id" }
  - { id: ERR_RESIDENT_NOT_FOUND,            http: 404, condition: "No Resident row with the given id" }
  - { id: ERR_APPOINTMENT_NOT_FOUND,         http: 404, condition: "No Appointment row with the given id" }
  - { id: ERR_MATERIAL_CATEGORY_NOT_FOUND,   http: 404, condition: "No MaterialCategory row with the given id, including any element of declared_category_ids" }
  - { id: ERR_STAFFER_NOT_FOUND,             http: 404, condition: "No Staffer row with the given id" }
  - { id: ERR_LANE_ASSIGNMENT_NOT_FOUND,     http: 404, condition: "No LaneAssignment row with the given id" }
  - { id: ERR_CONTAINER_NOT_FOUND,           http: 404, condition: "No PackedContainer row with the given id, including any element of container_ids, or no DropoffLine row for dropoff_line_id" }
  - { id: ERR_MANIFEST_NOT_FOUND,            http: 404, condition: "No Manifest row with the given id" }
  - { id: ERR_PROGRAM_BUDGET_EXCEEDED,       http: 402, condition: "Sealing the container would push budget_encumbered_cents + budget_in_transit_cents + budget_spent_cents above Program.budget_cents" }
  - { id: ERR_INVALID_STATE_TRANSITION,      http: 409, condition: "The requested action is not a declared transition out of the row's current state on the relevant axis, including any action on a terminal state" }
  - { id: ERR_EVENT_NOT_ACCEPTING_REGISTRATIONS, http: 409, condition: "The event's lifecycle_status is not OPEN_FOR_REGISTRATION when booking, confirming, waitlisting or promoting" }
  - { id: ERR_SITE_NOT_APPROVED,             http: 409, condition: "The event's site has status other than APPROVED when scheduling the event or confirming its site" }
  - { id: ERR_CONTAINMENT_DEFICIENT,         http: 409, condition: "The event's containment_status is DEFICIENT or PENDING_INSPECTION when the operation requires a compliant or remediated pad" }
  - { id: ERR_CONTAINER_NOT_SEALED,          http: 409, condition: "A container named in container_ids is not SEALED or already carries a manifest_id" }
  - { id: ERR_PROGRAM_FROZEN,                http: 409, condition: "Program.posture is FROZEN and the operation is one of the FROZEN-gated writes" }
  - { id: ERR_PROGRAM_RESTRICTED,            http: 409, condition: "Program.posture is RESTRICTED and the operation is one of the RESTRICTED-gated writes" }
  - { id: ERR_CONTAINER_EVENT_MISMATCH,      http: 409, condition: "The dropoff line's event differs from the container's event, or a listed container's event differs from the manifest's event" }
  - { id: ERR_LINE_ALREADY_PACKED,           http: 409, condition: "The dropoff line already carries a container_id, or its disposition is not ACCEPTED" }
  - { id: ERR_STAFFER_INTERVAL_CONFLICT,     http: 409, condition: "The requested half-open staffing interval intersects an existing ACTIVE assignment of the same staffer widened by the 30-minute decontamination buffer" }
  - { id: ERR_SITE_INTERVAL_CONFLICT,        http: 409, condition: "The new event's closed window intersects an existing non-CANCELLED event at the same site widened by the symmetric 48-hour buffer" }
  - { id: ERR_SITE_MONTHLY_EVENT_CAP,        http: 409, condition: "The site already hosts 2 non-CANCELLED events in the same UTC calendar month" }
  - { id: ERR_EVENT_SLOT_CAPACITY_EXCEEDED,  http: 409, condition: "Confirming or promoting the appointment would push reserved_slot_count above slot_capacity" }
  - { id: ERR_STALE_VERSION,                 http: 412, condition: "expected_resident_version does not equal Resident.version, or expected_event_version does not equal CollectionEvent.version" }
  - { id: ERR_CONTAINMENT_REQUIREMENTS_NOT_MET, http: 422, condition: "Site approval screen fails: impervious_surface false, secondary_containment_liters < 2000, or storm_drain_distance_m < 15.0" }
  - { id: ERR_CERTIFICATION_EXPIRED,         http: 422, condition: "Staffer.hazwoper_expires_on is earlier than the event's event_date, or the staffer is INACTIVE" }
  - { id: ERR_PROHIBITED_MATERIAL_DECLARED,  http: 422, condition: "declared_category_ids names a MaterialCategory with acceptance_policy == REJECTED_ALWAYS" }
  - { id: ERR_BUSINESS_WASTE_EXCLUDED,       http: 422, condition: "An appointment with waste_origin == BUSINESS is confirmed, waitlisted or promoted" }
  - { id: ERR_INCOMPATIBLE_MATERIAL_CLASS,   http: 422, condition: "The line's material compatibility_class differs from the container's compatibility_class" }
  - { id: ERR_CONTAINER_CAPACITY_EXCEEDED,   http: 422, condition: "Packing the line would push the container's net_weight_kg above capacity_kg" }
  - { id: ERR_SLOT_OUTSIDE_EVENT_WINDOW,     http: 422, condition: "slot_start_utc falls outside the half-open event window [window_start_utc, window_end_utc)" }
  - { id: ERR_SLOT_NOT_ALIGNED,              http: 422, condition: "slot_start_utc is not on a 15-minute boundary measured from window_start_utc" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "County solid-waste division administrator: owns program setup, the published material list, posture overrides, and manifest signing/receiving/rejection."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhw/programs"
      - "POST /hhw/programs/{id}/posture-override"
      - "POST /hhw/material-categories"
      - "POST /hhw/manifests/{id}/transitions with action IN {SIGN, RECEIVE, REJECT}"
      - "POST /hhw/_clock/set_current_utc"
    shared_operations:
      - "GET /hhw/programs/{id}/cost-summary (with EventCoordinator)"
      - "all GET read endpoints"

  - name: EventCoordinator
    description: "Program staff who select sites, schedule events, drive the event lifecycle axis, and roster lane staffing."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhw/sites"
      - "POST /hhw/events"
      - "POST /hhw/events/{id}/transitions"
      - "POST /hhw/staffers"
      - "POST /hhw/lane-assignments"
      - "POST /hhw/lane-assignments/{id}/release"
      - "POST /hhw/sites/{id}/transitions with action == RETIRE"
    shared_operations:
      - "GET /hhw/programs/{id}/cost-summary (with ProgramAdmin)"
      - "all GET read endpoints"

  - name: ContainmentInspector
    description: "Environmental health inspector who screens candidate sites and files event-day containment inspections. Bound by segregation of duties: the inspector who approved a site may not inspect that site's events."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhw/sites/{id}/transitions with action IN {APPROVE, SUSPEND, REINSTATE}"
      - "POST /hhw/events/{id}/containment-inspections"
    shared_operations:
      - "all GET read endpoints"

  - name: EligibilityClerk
    description: "Front-desk clerk who verifies resident jurisdiction, reinstates suspended residents, and books or manages appointments on a resident's behalf."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhw/residents/{id}/eligibility-actions"
      - "POST /hhw/appointments/{id}/transitions with action IN {WAITLIST, PROMOTE}"
    shared_operations:
      - "POST /hhw/residents (with Anonymous)"
      - "POST /hhw/appointments (with Resident)"
      - "POST /hhw/appointments/{id}/transitions with action IN {CONFIRM, CANCEL} (with Resident)"
      - "all GET read endpoints"

  - name: Resident
    description: "A verified county resident acting on their own registration and appointments. X-User-ID is the Resident row's id."
    identity: "entity_backed:Resident"
    exclusive_operations: []
    shared_operations:
      - "POST /hhw/appointments (with EligibilityClerk) — only for their own resident_id"
      - "POST /hhw/appointments/{id}/transitions with action IN {CONFIRM, CANCEL} (with EligibilityClerk) — only on their own appointments"
      - "all GET read endpoints"

  - name: UnloadTech
    description: "Unload-lane technician who checks vehicles in, screens and weighs each material line, refers business generators out, and marks no-shows."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhw/dropoff-lines"
      - "POST /hhw/appointments/{id}/transitions with action IN {CHECK_IN, START_UNLOAD, COMPLETE_UNLOAD, REFER_BUSINESS, NO_SHOW}"
    shared_operations:
      - "all GET read endpoints"

  - name: PackingContractor
    description: "Licensed disposal contractor who lab-packs containers, prepares manifests, and ships them to the TSDF."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhw/containers"
      - "POST /hhw/containers/{id}/lines"
      - "POST /hhw/containers/{id}/transitions"
      - "POST /hhw/manifests"
      - "POST /hhw/manifests/{id}/transitions with action IN {SHIP, REOPEN}"
    shared_operations:
      - "all GET read endpoints"

  - name: Anonymous
    description: "Unauthenticated public self-registration channel. X-User-ID carries an opaque session identifier that is never matched against any stored row."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /hhw/residents (with EligibilityClerk)"
