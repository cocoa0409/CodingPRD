            - "cost-summary.variance_cents == 0 and cost-summary.variance_pct == 0.00 (not null, and no division-by-zero error)"
            - "cost-summary.funding_requirement_cents == 0 and cost-summary.funding_gap_cents == 0 and cost-summary.funding_gap_pct == 0.00"
            - "PipPlan.${plan_id}.scope_item_count == 0 and PipPlan.${plan_id}.status == ISSUED and PipPlan.${plan_id}.dispute_state == DISPUTE_RESOLVED_REMOVED"
            - "risk-summary.snapshot_score == 100 and risk-summary.snapshot_posture == COMPLIANT (an empty scored-item set carries no penalty)"
            - "GET /pip/compliance-ledger-entries?plan_id=${plan_id} contains an entry with entry_type == ITEM_REMOVED and delta_cents == -1000000"

  # =========================================================================
  # Rule 7 — cross-entity state dependencies on different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: item_start_gated_by_capital_budget_lock_state
        grounds:
          - validations[priority=92]
          - state_machines.PipItem.SCOPED_to_IN_PROGRESS
          - state_machines.CapitalBudget.LOCKED_to_SUPERSEDED
          - errors[ERR_BUDGET_NOT_LOCKED]
          - concurrency_rules[budget-create-stale-plan]
        distinguishing_aspect: |
          Entity pair PipItem -> CapitalBudget: an item may only leave SCOPED while the plan's
          active budget is exactly LOCKED, so the same start call fails before the lock, succeeds
          after it, and fails again for a second item once a superseding budget drops the plan
          out of the LOCKED state.
        test_recipe:
          setup:
            - "One property with a plan holding two GUEST_FACING items of 1000000 cents each, issued and acknowledged."
            - "funding_requirement_cents is 2365000 at contingency 0.10; the first capital budget authorises exactly that and is APPROVED but not yet LOCKED."
