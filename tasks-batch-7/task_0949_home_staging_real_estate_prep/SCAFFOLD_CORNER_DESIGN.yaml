        claim_type: Computed read
        grounds: ["endpoints.GET./staging/projects/{project_id}", "entities.Project.fields.contract_value", "entities.Project.fields.reshoot_credits_remaining", "entities.Project.fields.fiscal_hold"]
        distinguishing_aspect: "A single project read surfaces contract_value 7690.00, room_count 4, accessory_set_count 3, reshoot_credits_remaining 1, restage_count 0 and fiscal_hold false without any further call."
        test_recipe:
          setup: ["The canonical VACANT project staged."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "GET /staging/projects/${proj_id}"
