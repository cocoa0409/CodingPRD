    instances:
      - name: sphere_delta_exactly_at_tolerance_passes_and_one_hundredth_over_fails
        grounds:
          - calculations.inspection_delta_and_verdict
          - entities.ToleranceStandard.fields.sphere_tolerance_diopters
          - entities.QualityInspection.fields.sphere_delta
          - endpoints.POST_/quality-inspections
