  # ===========================================================================

  - rule_id: resource_temporal_overlap
    instances:

      - name: instructor_half_open_adjacency_allowed_same_room_but_15_minute_buffer_across_rooms
        grounds:
          - validations[priority 62 category business_constraint ERR_INSTRUCTOR_SCHEDULE_CONFLICT]
          - entities.CourseSession.fields.starts_at
          - entities.CourseSession.fields.ends_at
          - entities.CourseSession.fields.room_code
          - errors.ERR_INSTRUCTOR_SCHEDULE_CONFLICT
        distinguishing_aspect: |
          The instructor's booked intervals are HALF-OPEN [starts_at, ends_at), so a session that
          begins exactly when another ends is NOT an overlap - but only inside the same room. Across
          a different room_code the rule adds a travel buffer: a gap of less than 15 minutes is a
          conflict even though the intervals do not intersect at all. Four candidate windows against
          one existing 09:00-11:00 R1 session therefore split 2 accepted / 2 rejected, and no single
          interpretation of the interval (closed, half-open, or half-open with a uniform buffer)
          produces that split. The last candidate confirms a genuine interior intersection in the
          same room is still rejected.
        test_recipe:
          setup:
            - "One CertificationStandard requiring 6.00 PATROL hours, one AcademyClass, one CERTIFIED instructor authorized for PATROL, one APPROVED PATROL LessonPlan."
            - "One existing SCHEDULED CourseSession for that instructor: 2026-08-10T09:00:00Z - 2026-08-10T11:00:00Z in room R1."
            - "Logical clock stays at the default 2026-08-01T00:00:00Z (creation never requires the clock to have reached the window)."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-OVL", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 6.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
