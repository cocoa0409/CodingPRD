            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 300000, processing_date_balance_cents: 300000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
            - { call: "POST /safe-harbor-iras", payload: { distribution_case_id: "${c_a}" }, as: ProviderOps, captures: { ira: $.data.id } }
            - { call: "POST /safe-harbor-iras/${ira}/match-searches", payload: { new_plan_id: "${plan_y}", new_recordkeeper_id: "${rk_b}", employment_start_date: "2026-08-10", ssn_exact: true, name_similarity: 0.90, dob_match: true }, as: ProviderOps }
            - { call: "POST /recordkeepers/${rk_b}/suspend", payload: {}, as: ProviderOps }
            - { call: "GET /safe-harbor-iras/${ira}", payload: {}, as: ProviderOps, captures: { ira_v: $.data.version } }
          trigger:
            - { call: "POST /safe-harbor-iras/${ira}/transfers", payload: { expected_ira_version: "${ira_v}" }, as: ProviderOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRENOTICE_NOT_DELIVERED with http 422 (business_safety, priority 7)"
            - "NOT ERR_RECORDKEEPER_NOT_ACTIVE (business_referential, priority 9) even though RK-B is SUSPENDED"

  - rule_id: boundary_precision_check
    instances:
      - name: force_out_band_boundary_at_thresholds
        grounds:
          - calculations.force_out_path_selection
          - entities.DistributionCase.fields.force_out_path
        distinguishing_aspect: |
          Metric: money threshold, endpoint: batch lock. vested == 100000 -> CASH_OUT (inclusive <=);
          vested == 100001 -> SAFE_HARBOR_IRA; vested == 700000 -> SAFE_HARBOR_IRA (inclusive <=);
          vested == 700001 -> INELIGIBLE_REMAINS with immediate SETTLED/REMAIN_IN_PLAN at lock.
        test_recipe:
          setup:
            - "One plan (default thresholds 100000/700000), one batch, four cases at exactly 100000, 100001, 700000, 700001 cents (vesting 100, both feed balances equal)"
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
