# =============================================================================
# §1.2 State Machine Table (7 machines)
# =============================================================================
state_machines:
  - entity: Design
    field: approval_state
    initial_state: PENDING_LICENSOR_APPROVAL
    terminal_states: [APPROVED]
    note: "Cyclic with a single-step revert: APPROVAL_REJECTED returns to PENDING_LICENSOR_APPROVAL on resubmission, so a rejected design can be revised and re-approved."
    transitions:
      - from: PENDING_LICENSOR_APPROVAL
        to: APPROVAL_REJECTED
        trigger: "PUT /designs/{design_id}/licensor-decision with decision=REJECT"
        actor: LicensingOps
        preconditions:
          - "Design.approval_state == PENDING_LICENSOR_APPROVAL"
          - "rejection_reason present and non-empty"
        side_effects:
          - "Design.rejection_reason = supplied reason"
          - "Design.version incremented by 1"
          - "Every ProductionOrder with design_id == this design is set to status RETIRED_DESTROYED, retire_reason ASSORTMENT_CHANGED, retired_at stamped, and its design.version bumped by 1 (cascade hop 1)"
          - "For each such ProductionOrder, the cascade continues in ProductionOrder.transitions PARALLEL_HOLD_to_RETIRED_DESTROYED and PRINTING_to_RETIRED_DESTROYED: every PrintLayer of that run moves to PRINT_FAILED with committed_qty 0, which in turn scales that run's open FulfillmentOrders as documented on those transitions"

      - from: APPROVAL_REJECTED
        to: PENDING_LICENSOR_APPROVAL
        trigger: "PUT /designs/{design_id}/submit"
        actor: DesignOps
        preconditions:
          - "Design.approval_state == APPROVAL_REJECTED"
        side_effects:
          - "Design.rejection_reason cleared to null; design ready for a fresh licensor decision"
          - "Design.version incremented by 1"
        note: "The revert that makes this machine cyclic in shape"

      - from: PENDING_LICENSOR_APPROVAL
        to: APPROVED
        trigger: "PUT /designs/{design_id}/licensor-decision with decision=APPROVE"
        actor: LicensingOps
        preconditions:
          - "Design.approval_state == PENDING_LICENSOR_APPROVAL"
        side_effects:
          - "Design.approved_version = Design.version after increment"
          - "Design.version incremented by 1; the approved_version anchor is what every ProductionOrder.retired_design_version pins"

  - entity: ProductionOrder
    field: status
    initial_state: PARALLEL_HOLD
    terminal_states: [RETIRED_DESTROYED, RETIRED_DONATED]
    note: "Branching fork/join: the two outcome runs of one event are created in PARALLEL_HOLD, the winning run COMMITS while the losing run is RETIRED_*. COMMITTED -> PRINTING is cyclic with an explicit revert (reopening a committed run within the event window), and each PRINTING -> PRINTING reversal carries a distinct side-effect set."
    transitions:
      - from: PARALLEL_HOLD
        to: COMMITTED
        trigger: "POST /production-orders/{id}/layers on the run representing the winning outcome"
        actor: ProductionPlanner
        preconditions:
          - "ProductionOrder.status == PARALLEL_HOLD"
          - "The referenced Design.approval_state == APPROVED (ERR_DESIGN_NOT_APPROVED otherwise)"
          - "SUPERSEDE applies first: if a COMMITTED run with the same team_code and trigger_type exists, the lower-created_at run already received its transition and this request is rejected with ERR_PRODUCTION_ALREADY_COMMITTED"
        side_effects:
          - "status → COMMITTED, committed_at stamped"
          - "committed_inventory_cents recomputed; hold_allocation_cents released to 0"
          - "Acquires cycle eligibility: the committed_at stamp makes this run the favored cycle of its team_code"
          - "Unresets demand_collapse_write_down: this run's write_down_inventory_cents is recomputed at unit_cost_cents"
          - "Relicenses print capacity: each supported (city_code, print_type) window with at least rush_sla_hours remaining is re-eligible for this run's reservations"
          - "Design.version incremented by 1"
          - "Licensor.version incremented by 1; Licensor.accrued_unsettled_cents recomputed"

      - from: COMMITTED
        to: PRINTING
        trigger: "POST /print-layers/{print_layer_id}/print with layer.committed_qty > 0"
        actor: PrintOperator
        preconditions:
          - "ProductionOrder.status in {COMMITTED, PRINTING}"
          - "PrintLayer.print_type == BASE, or the run's pennants_included flag is true for PENNANT layers"
          - "BASE layers must be committed before EMBROIDER or HEAT_PRESS layers on the same run; a non-BASE layer requested first is rejected with ERR_PRINT_TYPECAST_MISMATCH"
        side_effects:
          - "PrintLayer.printed_qty += printed_qty, committed_qty = printed_qty - failed_qty, layer_state → PRINTED"
          - "PrintLayer.design_version_checked = Design.version observed at this print"
          - "ProductionOrder.base_units_printed or accessory_units_printed recomputed from committed layers; status → PRINTING"
          - "Design.version incremented by 1"

      - from: PRINTING
        to: COMMITTED
        trigger: "POST /print-layers/{print_layer_id}/print-failure when the print reducer yields committed_qty == 0 (reopen inside the event window)"
        actor: PrintOperator
        preconditions:
          - "PrintLayer.failed_qty >= PrintLayer.printed_qty after the reducer is applied"
          - "Logical clock is at or before ProductionOrder.committed_at + 48 hours; later attempts are rejected with ERR_EVENT_WINDOW_CLOSED"
        side_effects:
          - "layer_state → PRINT_FAILED, committed_qty 0"
          - "status → COMMITTED, committed_at re-stamped (the event window restarts from the new stamp)"
          - "ProductionOrder.base_units_printed / accessory_units_printed recomputed so the failed layer's contribution is removed"
          - "The run's write_down_inventory_cents is zeroed, because no version of this run is sellable"
          - "The run's open FulfillmentOrders are recomputed against the reduced printable pool and any order whose recomputed requested_wholesale_cents drops below zero is set to DISTRESSED"
        note: "Cyclic revert: the reopened run may be layered again, and a second failed print reverts it a second time."

      - from: COMMITTED
        to: RETIRED_DONATED
        trigger: "POST /production-orders/{id}/retire with retire_reason LOSING_OUTCOME and destroy_mode DONATE"
        actor: ProductionPlanner
        preconditions:
          - "status == COMMITTED"
          - "retire_reason in {LOSING_OUTCOME, DEMAND_COLLAPSE, ASSORTMENT_CHANGED, OUTCOME_COMMITTED}"
        side_effects:
          - "status → RETIRED_DONATED, retired_at stamped"
          - "For every FulfillmentOrder of this run: donated_qty = quantity, destroyed_qty = 0, requested_wholesale_cents weighted by the DONATE branch, realized_wholesale_cents = 0"
          - "Design.version incremented by 1; Design.approved_version is NOT cleared"
          - "Licensor.version incremented by 1; Licensor.accrued_royalty_cents reduced by the destroyed-or-donated share"

      - from: COMMITTED
        to: RETIRED_DESTROYED
        trigger: "POST /production-orders/{id}/retire with retire_reason LOSING_OUTCOME and destroy_mode DESTROY"
        actor: ProductionPlanner
        preconditions:
          - "status == COMMITTED"
          - "retire_reason in {LOSING_OUTCOME, DEMAND_COLLAPSE, ASSORTMENT_CHANGED, OUTCOME_COMMITTED}"
        side_effects:
          - "status → RETIRED_DESTROYED, retired_at stamped"
          - "For every FulfillmentOrder of this run: destroyed_qty = quantity, donated_qty = 0, requested_wholesale_cents weighted by the DESTROY branch (penalty rate applies), realized_wholesale_cents = 0"
          - "Design.version incremented by 1"
          - "Licensor.version incremented by 1; write-down value flows to the licensor's destroyed-unit ledger line"

      - from: PARALLEL_HOLD
        to: RETIRED_DESTROYED
        trigger: "POST /production-orders/{id}/retire, or the cascade from Design.licensor-decision rejection"
        actor: ProductionPlanner
        side_effects:
          - "status → RETIRED_DESTROYED, retired_at stamped; hold_allocation_cents released"
          - "Every PRINTED PrintLayer of this run moves to PRINT_FAILED with committed_qty 0"
          - "For each such layer, the cascade continues in PrintLayer.transitions PRINTED_to_PRINT_FAILED, which scales that run's open FulfillmentOrders down and marks an order DISTRESSED when its recomputed wholesale total falls below zero"

      - from: PRINTING
        to: RETIRED_DESTROYED
        trigger: "POST /production-orders/{id}/retire, or the cascade from Design.licensor-decision rejection"
        actor: ProductionPlanner
        side_effects:
          - "status → RETIRED_DESTROYED, retired_at stamped"
          - "Every PRINTED PrintLayer of this run moves to PRINT_FAILED with committed_qty 0"
          - "Skip-if-lesser: the write-down that PrintLayer.transitions PRINTED_to_PRINT_FAILED would apply is skipped whenever it is strictly less than the write-down already applied on this run, because the greater write-down remains"
          - "Design.version incremented by 1; Licensor.version incremented by 1"

  - entity: PrintLayer
    field: layer_state
    initial_state: PENDING_PRINT
    terminal_states: []
    note: "Branching accept/reject per print attempt; PRINTED and PRINT_FAILED both return to themselves on a repeat print, so a layer accumulates successful and failed attempts."
    transitions:
      - from: PENDING_PRINT
        to: PRINTED
        trigger: "POST /print-layers/{id}/print"
        actor: PrintOperator
        preconditions:
          - "printed_qty <= quantity (ERR_PRINT_QUANTITY_EXCEEDED otherwise)"
          - "Logical clock is at or before the run's committed_at + 48 hours if the run is in PRINTING (ERR_EVENT_WINDOW_CLOSED otherwise)"
        side_effects:
          - "printed_qty += printed_qty; committed_qty = printed_qty - failed_qty"
          - "design_version_checked = Design.version observed now"
          - "Allows the parent run to accept the shift to PRINTING"

      - from: PRINTED
        to: PRINTED
        trigger: "POST /print-layers/{id}/print with a further printed_qty"
        actor: PrintOperator
        side_effects:
          - "printed_qty and committed_qty increase again; design_version_checked refreshed"

      - from: PENDING_PRINT
        to: PRINT_FAILED
        trigger: "POST /print-layers/{id}/print-failure"
        actor: PrintOperator
        side_effects:
          - "failed_qty += failed_qty; committed_qty = printed_qty - failed_qty (negative values are floored at 0)"
          - "design_version_checked = Design.version observed now"

      - from: PRINTED
        to: PRINT_FAILED
        trigger: "POST /print-layers/{id}/print-failure"
        actor: PrintOperator
        side_effects:
          - "failed_qty += failed_qty; committed_qty = printed_qty - failed_qty"
          - "The parent run's base_units_printed / accessory_units_printed are recomputed downward (cascade hop 2)"
          - "For the run's open FulfillmentOrders, the cascade continues in FulfillmentOrder.transitions PLANNED_to_DISTRESSED: requested_wholesale_cents is scaled by committed_qty/quantity, and any order whose recomputed total falls to zero or below is set DISTRESSED with reason DEMAND_COLLAPSE"

      - from: PRINTED
        to: PRINT_FAILED
        trigger: "system (parent ProductionOrder retired while layers were printed)"
        actor: system
        side_effects:
          - "committed_qty forced to 0 even though printed_qty > 0"
          - "design_version_checked = ProductionOrder.retired_design_version, preserving the version the goods were actually printed at"
          - "Write-down recorded at the layer's planned quantity; skipped when an equal-or-greater write-down is already present on the run"

  - entity: FulfillmentOrder
    field: status
    initial_state: PLANNED
    terminal_states: [DELIVERED, DISTRESSED, RETURNED]
    note: "Branching: PLANNED forks into PICKED, DISTRESSED, or RETURNED; PICKED rejoins SHIPPED only when the full quantity ships."
    transitions:
      - from: PLANNED
        to: PICKED
        trigger: "POST /fulfillment-orders/{id}/pick"
        actor: FulfillmentCoordinator
        preconditions:
          - "status == PLANNED"
          - "quantity <= reference pool available, where the pool is the requested quantity of the run's earliest shipment by committed_at (ERR_INVENTORY_INSUFFICIENT otherwise)"
          - "pick_remark differs from every prior pick_remark on this order (ERR_PICK_REMARK_REUSED otherwise)"
          - "PICKED units of the referenced run, counted across all channels, must not exceed the run's committed_inventory_cents / unit_cost_cents (ERR_CAPACITY_EXCEEDED otherwise)"
        side_effects:
          - "picked_qty += quantity; status → PICKED"
          - "ProductionOrder.version incremented by 1"

      - from: PICKED
        to: PICKED
        trigger: "POST /fulfillment-orders/{id}/pick with a further quantity"
        actor: FulfillmentCoordinator
        side_effects:
          - "picked_qty increases again; a repeated pick_remark is rejected"

      - from: PICKED
        to: SHIPPED
        trigger: "POST /fulfillment-orders/{id}/ship"
        actor: FulfillmentCoordinator
        preconditions:
          - "ship quantity <= picked_qty - shipped_qty"
          - "The referenced ProductionOrder.status is COMMITTED or PRINTING; a retired run blocks the ship (ERR_INVALID_STATE otherwise)"
          - "carrier RUSH_AIR requires rush_flag true (ERR_RUSH_COMMITMENT_BREACH otherwise)"
          - "sla_hours <= 24 when rush_flag is true and the destination is a venue or pop-up code (ERR_RUSH_COMMITMENT_BREACH otherwise)"
        side_effects:
          - "shipped_qty += quantity; a Shipment in IN_TRANSIT is created"
          - "requested_wholesale_cents recomputed with the shipped leg counted at the CITY family rate and the destination family at face value"

      - from: SHIPPED
        to: SHIPPED
        trigger: "POST /fulfillment-orders/{id}/ship for the remaining picked quantity"
        actor: FulfillmentCoordinator
        side_effects:
          - "A second Shipment is created; the partial-shipment ledger line is appended"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /fulfillment-orders/{id}/deliver"
        actor: FulfillmentCoordinator
        preconditions:
          - "status == SHIPPED"
        side_effects:
          - "status → DELIVERED; Shipment.shipment_state → DELIVERED, delivered_at stamped"
          - "realized_wholesale_cents = requested_wholesale_cents"
          - "Licensor.version incremented by 1; Licensor.accrued_royalty_cents recomputed from the delivered units"

      - from: PLANNED
        to: RETURNED
        trigger: "POST /fulfillment-orders/{id}/return"
        actor: FulfillmentCoordinator
        preconditions:
          - "status == PLANNED"
          - "The run is retired or the order was never picked"
        side_effects:
          - "returned_qty += return_quantity; status → RETURNED"
          - "realized_wholesale_cents = requested_wholesale_cents - return_quantity * (run unit cost) rounded HALF_UP; the remainder counts as a lost recovery"
          - "Damaged units append units_destroyed_damaged to the settling ledger line while donated_qty is untouched"

      - from: SHIPPED
        to: RETURNED
        trigger: "POST /fulfillment-orders/{id}/return"
        actor: FulfillmentCoordinator
        side_effects:
          - "returned_qty += return_quantity; status → RETURNED"
          - "The already-recognized wholesale value is reduced by the returned share; licensed units of the opened case append a units_damaged_destroyed line"

      - from: PLANNED
        to: DISTRESSED
        trigger: "POST /fulfillment-orders/{id}/distress, or the cascade from FulfillmentOrder pick/capacity collapse"
        actor: FulfillmentCoordinator
        side_effects:
          - "status → DISTRESSED, distress_reason recorded"
          - "DESTROY branch: destroyed_qty = quantity, requested_wholesale_cents weighted by the DESTROY penalty rate, realized_wholesale_cents = 0"
          - "DONATE branch: donated_qty = quantity, requested_wholesale_cents weighted by the DONATE branch (no penalty), realized_wholesale_cents = 0"
          - "licensor_royalty_settlement is recomputed so the distressed units stop accruing exposition royalty"
          - "Licensor.version incremented by 1"

      - from: PICKED
        to: DISTRESSED
        trigger: "system (cascade from PrintLayer PRINTED_to_PRINT_FAILED)"
        actor: system
        side_effects:
          - "status → DISTRESSED with reason DEMAND_COLLAPSE; the already-picked units are counted as the destroyed quantity"
          - "requested_wholesale_cents recomputed downward by committed_qty/quantity scaling (cascade hop 3)"

  - entity: PrintReservation
    field: reservation_state
    initial_state: HELD
    terminal_states: []
    note: "Accumulator with an explicit reclaim rail: HELD reservations accumulate against their window, while the legacy reclaim rail retires released windows without altering the reservation's own state."
    transitions:
      - from: HELD
        to: HELD
        trigger: "POST /print-capacity:reserve adding a further reservation to the same window"
        actor: FulfillmentCoordinator
        preconditions:
          - "quantity <= PrintCapacity.available_qty (ERR_CAPACITY_EXCEEDED otherwise)"
        side_effects:
          - "PrintCapacity.reserved_qty += quantity; available_qty recomputed"
          - "The reservation is stamped with reserved_at, which orders competing reservations deterministically; a tie on reserved_at is broken by ascending quantity and never by a random field"
      - from: HELD
        to: HELD
        trigger: "POST /print-capacity:reserve reclaiming a window whose capacity window has already closed"
        actor: FulfillmentCoordinator
        preconditions:
          - "The capacity window's window_end precedes the logical clock"
        side_effects:
          - "No window quantity is released: the reservation is re-pointed at the next window that honours the same city_code and print_type"
          - "PrintCapacity.reserved_qty is unchanged on the closed window, so a released window's reclaimed units are counted once and only once"

  - entity: MinimumGuaranteeSettlement
    field: status
    initial_state: PENDING
    terminal_states: [APPROVED, REVERSED]
    note: "Linear with compensating reversal; the reversal restores snapped_accrued_cents exactly."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /licensors/{licensor_id}/minimum-guarantee/apply"
        actor: LicensingOps
        preconditions:
          - "Licensor.accrued_unsettled_cents > 0 (ERR_NO_ACCRUED_ROYALTY otherwise)"
          - "reserved_cents <= Licensor.accrued_unsettled_cents (ERR_NO_ACCRUED_ROYALTY otherwise)"
          - "min_accrued_after = accrued_royalty_cents - reserved_cents; when min_accrued_after < minimum_guarantee_cents the request must carry accept_guarantee_breach true, otherwise it is rejected with ERR_GUARANTEE_FLOOR_BREACH and the exact shortfall is returned in the error message"
        side_effects:
          - "snapped_accrued_cents = Licensor.accrued_royalty_cents before settlement"
          - "Licensor.accrued_royalty_cents -= reserved_cents; Licensor.guarantee_recovery_block_cents += guarantee_shortfall_cents; accrued_unsettled_cents recomputed"
          - "Licensor.version incremented by 1"

      - from: APPROVED
        to: APPROVED
        trigger: "POST /licensors/{licensor_id}/minimum-guarantee/apply repeated"
        actor: LicensingOps
        preconditions:
          - "reserved_cents > 0 or the settlement must move at least one ledger quantity (ERR_SETTLEMENT_NOOP otherwise)"
        side_effects:
          - "A settlement that neither reserves nor re-blocks leaves the ledger triple untouched and is rejected rather than recorded"

      - from: APPROVED
        to: REVERSED
        trigger: "POST /licensors/{licensor_id}/minimum-guarantee/reverse"
        actor: system
        side_effects:
          - "Licensor.accrued_royalty_cents restored to snapped_accrued_cents exactly; guarantee_recovery_block_cents reduced by guarantee_shortfall_cents; accrued_unsettled_cents recomputed"
          - "CounterfeitReport.total_exposure_cents recomputed when the reversal clause is elected"

  - entity: CounterfeitReport
    field: report_status
    initial_state: OPEN
    terminal_states: []
    note: "Branching confirmation: enforcement confirms or clears the report; a cleared report may be re-enforced, hence the OPEN self-loop."
    transitions:
      - from: OPEN
        to: ENFORCED
        trigger: "POST /counterfeit-reports/{id}/enforce with infringement_confirmed=true"
        actor: EnforcementAgent
        preconditions:
          - "suspect_quantity <= unit_count (ERR_COUNTERFEIT_OVERCOUNT otherwise)"
          - "suspect_quantity > 0 for a confirmed infringement (ERR_COUNTERFEIT_OVERCOUNT otherwise)"
        side_effects:
          - "report_status → ENFORCED; royalty_leakage_cents and penalty_cents recomputed; total_exposure_cents = leakage + penalty"
          - "Licensor.version incremented by 1; the exposure is surfaced on the licensor's enforcement ledger"

      - from: OPEN
        to: OPEN
        trigger: "POST /counterfeit-reports/{id}/enforce with infringement_confirmed=false"
        actor: EnforcementAgent
        side_effects:
          - "total_exposure_cents = 0; the report stays open and may be enforced again after further evidence"

      - from: ENFORCED
        to: ENFORCED
        trigger: "POST /counterfeit-reports/{id}/enforce repeated with a larger suspect_quantity"
        actor: EnforcementAgent
        side_effects:
          - "royalty_leakage_cents, penalty_cents and total_exposure_cents recomputed on the newly confirmed quantity"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: order-pick-stale-production-order
    parent_entity: ProductionOrder
    write_endpoint: "POST /fulfillment-orders/{fulfillment_order_id}/pick"
    occ_field: "expected_production_order_version"
    description: |
      A pick that carries a stale view of the order's version is rejected, because a
      concurrent writer has already advanced this order's version — either through a
      further pick on the same order, or through a cascade from the referenced
      ProductionOrder's print layers — so the client's captured version no longer
      describes the order it is picking against.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-stale-licensor
    parent_entity: Licensor
    write_endpoint: "POST /licensors/{licensor_id}/minimum-guarantee/apply"
    occ_field: "expected_licensor_version"
    description: |
      A minimum-guarantee settlement whose expected licensor version is stale is
      rejected, because any royalty accrual, production retirement or enforcement
      confirmation that landed since the client read the licensor has advanced the
      version, and settling against that stale ledger would reserve an amount that
      the licensor no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (7 calculations)
# =============================================================================
calculations:
  - name: hot_market_capacity_commitment
    trigger: "POST /production-orders for a hot-market run, and every re-evaluation of expected_demand_qty"
    algorithm: threshold
    formula: |
      Inputs: Y = expected_demand_qty, Z = win_probability_pct, X = unit_cost_cents,
              T = trigger_type, and H = whole hours from the logical clock to the run's
              outcome_at (H <= 0 once the outcome instant has passed). The written field is
              ProductionOrder.capacity_commitment_units.
      Step 1 tier selection, inclusive at each lower edge:
        Y >= MAJOR_MARKET_DEMAND_UNITS (100000) -> tier = MAJOR_MARKET
        Y >= REGIONAL_DEMAND_UNITS (25000)      -> tier = REGIONAL
        otherwise                                -> tier = LOCAL
      Step 2 probability floor:
        p = max(Z, PROBABILITY_FLOOR (0.05))
      Step 3 hour band, inclusive at each lower edge:
        H > RUSH_HOURS (6) -> hour_factor = 1.0
        H > 1              -> hour_factor = RUSH_ADDITIONAL_FACTOR (1.5)
        otherwise          -> hour_factor = SAME_HOUR_FACTOR (2.0)
      Step 4 hot_market_provisional (the default variant): the FIRST run created for a
        given (team_code, trigger_type) pair commits
          capacity_commitment_units = ceil(Y * p * hour_factor)
      Step 5 committed_final (the superseding variant): the SECOND and every later run
        created for the same (team_code, trigger_type) pair commits
          capacity_commitment_units = floor(Y * p) + TIER_RESIDUAL[tier]
        with TIER_RESIDUAL = { LOCAL: 25, REGIONAL: 50, MAJOR_MARKET: 0 }.
      Step 6 floor: capacity_commitment_units = max(capacity_commitment_units, ceil(Y * p / 2)).
      The evaluation order is pinned: tier, then p, then hour_factor, then the residual.
      capacity_commitment_units is never recomputed from a value it has already written, so the
      calculation terminates in one pass and never iterates to a fixed point.
      Worked divergence on identical inputs (Y = 1000, Z = 0.25, H = 2, LOCAL):
        provisional gives ceil(1000 * 0.25 * 1.5) = 375;
        committed_final gives floor(1000 * 0.25) + 25 = 275.
    input_set: "The run's own inputs plus, for the committed_final variant, whether an earlier run for the same (team_code, trigger_type) pair exists — ordered by created_at; ties on created_at are broken by ascending ProductionOrder.id order of creation, never by any random field."
    constants:
      MAJOR_MARKET_DEMAND_UNITS: 100000
      REGIONAL_DEMAND_UNITS: 25000
      PROBABILITY_FLOOR: 0.05
      RUSH_HOURS: 6
      RUSH_ADDITIONAL_FACTOR: 1.5
      SAME_HOUR_FACTOR: 2.0
      TIER_RESIDUAL_LOCAL: 25
      TIER_RESIDUAL_REGIONAL: 50
      TIER_RESIDUAL_MAJOR_MARKET: 0
    precision: "capacity_commitment_units is an integer; ceil/floor applied once at the point written"
    variants:
      - name: hot_market_provisional
        when: "the run is the first created for its (team_code, trigger_type) pair"
        difference: "Multiplies the probability by the hour factor before rounding, so a run created inside six hours of the outcome writes 1.5x or 2x the units of an otherwise identical later run."
      - name: committed_final
        when: "the run is the second or a later run for the same (team_code, trigger_type) pair"
        difference: "Drops the hour factor entirely and adds the tier residual after flooring, so identical inputs write fewer units than the provisional variant."

  - name: licensor_royalty_accrual
    trigger: "POST /fulfillment-orders/{fulfillment_order_id}/deliver, POST .../return, POST .../distress, and POST /production-orders/{production_order_id}/retire"
    algorithm: weighted_scoring
    formula: |
      For each FulfillmentOrder F of the licensor's production runs with status in
      {DELIVERED, RETURNED}, processed in created_at order (ties broken by ascending
      created_at only; F.quantity is not a sort key):
        gross = F.realized_wholesale_cents
        rate  = SKU_ROYALTY_RATE[design.garment_sku]
        row_royalty = round_half_up(gross * rate)
        row_premium = round_half_up(row_royalty * DESIGNER_PREMIUM_PCT)
        row_total   = row_royalty + row_premium
      accrued_royalty_cents = sum(row_total)
      Rounding order is pinned: each row is rounded HALF_UP to the cent BEFORE the rows are
      summed. Rounding the unrounded sum once instead yields a different cent.
      Worked divergence: two DELIVERED orders of 1250 cents each on a CAP design
        (rate 0.06, premium 0.125):
        per-row-first gives (round(75) + round(9.375)) * 2 = 84.38 * 2 = 168.76;
        sum-first gives round((75 + 9.375) * 2) = round(168.75) = 168.75.
    input_set: "Every FulfillmentOrder of the licensor's runs whose status is DELIVERED or RETURNED. Orders in PLANNED, PICKED, SHIPPED or DISTRESSED contribute nothing, and DISTRESSED orders never accrue a royalty."
    constants:
      SKU_RATE_JERSEY: 0.08
      SKU_RATE_TRACTOR: 0.02
      SKU_RATE_DUFFEL: 0.04
      SKU_RATE_CAP: 0.06
      SKU_RATE_MINI: 0.06
      SKU_RATE_PENNANT: 0.00
      DESIGNER_PREMIUM_PCT: 0.125
    precision: "per-row HALF_UP to 2 decimal places, then summed; the total is not re-rounded"
    variants:
      - name: accrued_per_row
        when: "the licensor's actual ledger is read after settlement (default)"
        difference: "Rounds each order's royalty and premium to the cent before accumulating, which is the value written to Licensor.accrued_royalty_cents."
      - name: projected_sum
        when: "the licensor's outstanding royalty is projected before the next settlement"
        difference: "Accumulates the unrounded per-row values and rounds once at the end, so a licensor with two or more accrual rows reads one cent higher than the actual ledger."

  - name: rush_delivery_commitment
    trigger: "POST /print-capacity:reserve, and every re-evaluation of a PRINTING run's delivery commitment"
    algorithm: constraint_propagation
    formula: |
      For each PrintReservation R of the run that is still in HELD state:
        window_hours = hours from R's PrintCapacity.window_start to R.needed_by
        if window_hours <= RUSH_WINDOW_HOURS (24): class = RUSH, rush_qty += R.quantity
        else:                                     class = STANDARD, standard_qty += R.quantity
      ProductionOrder.rush_delivery_points = round_half_up(RUSH_WEIGHT * rush_qty + STANDARD_WEIGHT * standard_qty)
      commitment_floor_units = ceil(rush_delivery_points / 2)
      if ProductionOrder.rush_delivery_points == 0 and the run's needed floor is above 0:
        the run is rejected with ERR_RUSH_COMMITMENT_BREACH and the message carries
        commitment_floor_units.
      Overflow rule: any reserved quantity beyond a window's remaining capacity is still
      counted at its class rate and is NOT available to a later run competing for the same
      window; the later reservation is processed after the earlier one, ordered by
      reserved_at ascending, and a tie on reserved_at is broken by ascending reservation
      quantity — never by any random field.
      Worked value: one RUSH window holding 100 units and one STANDARD window holding 50
      units writes ProductionOrder.rush_delivery_points = 0.9 * 100 + 0.1 * 50 = 90 + 5 = 95.
    input_set: "All HELD PrintReservation rows of the run whose window supports the run's print_type, plus each window's remaining capacity after the reservations already processed."
    constants:
      RUSH_WINDOW_HOURS: 24
      STANDARD_WINDOW_HOURS: 72
      RUSH_WEIGHT: 0.9
      STANDARD_WEIGHT: 0.1
    precision: "ProductionOrder.rush_delivery_points HALF_UP to 2 decimals; quantities are integers"
    variants:
      - name: rush_priority_weighted
        when: "a run whose needed_by leaves no slack elects the rush weighting"
        difference: "Weights HELD units 0.9 / 0.1 in favour of rush windows, so the same reserved quantity writes a larger commitment than the slope form."
      - name: standard_slope_unweighted
        when: "a run with slack elects the unweighted slope"
        difference: "Uses the unweighted 1/2 slope over all HELD units and ignores the rush/standard split, so identical reservations write a smaller commitment."

  - name: licensor_royalty_settlement
    trigger: "POST /licensors/{licensor_id}/minimum-guarantee/apply and its compensating reversal"
    algorithm: waterfall_allocation
    formula: |
      Ledger quantities: A = accrued_royalty_cents, B = guarantee_recovery_block_cents,
      U = accrued_unsettled_cents. All three start at 0.
      INVARIANT, checked at every observable point: U = max(0, A - B).
      APPLY(reserved_cents R, accept_guarantee_breach G), in the pinned order:
        precondition (see §1.4): U > 0 and R <= U
        min_accrued_after = max(0, A - R)
        if min_accrued_after < minimum_guarantee_cents and G is false:
            reject with ERR_GUARANTEE_FLOOR_BREACH, reporting
            max(0, minimum_guarantee_cents - min_accrued_after) in the message
        snapped_accrued_cents     := A
        guarantee_shortfall_cents := max(0, minimum_guarantee_cents - min_accrued_after)
        max_recoverable_early_cents := U as captured before this application
        A := min_accrued_after
        B := B + guarantee_shortfall_cents
        U := max(0, A - B)
      REVERSE():
        A := snapped_accrued_cents
        B := B - guarantee_shortfall_cents
        U := max(0, A - B)
      Compensating invariant: APPLY followed by REVERSE restores the triple (A, B, U) to
      exactly the values observed before APPLY, with zero drift.
      Waterfall order, applied in this sequence and never re-entered:
        RESET -> EARNED -> DROP -> FLOOR -> CAP -> UNSETTLED.
      CAP is applied last: when B exceeds GUARANTEE_BLOCK_CAP_CENTS (12500) the excess is
      not blocked, so B is capped at 12500 and folded back into A.
      Worked value with a breach elected: A = 843.75, minimum_guarantee_cents = 2000,
        R = 100, G = true gives min_accrued_after 743.75, shortfall 1256.25, A = 743.75,
        B = 1256.25, U = 0; REVERSE restores A = 843.75, B = 0, U = 843.75 exactly.
      Failure value: A = 843.75, minimum_guarantee_cents = 2000, R = 100, G = false is
        rejected with ERR_GUARANTEE_FLOOR_BREACH and the shortfall 1256.25 in the message.
    input_set: "The licensor's A, B and U before the call, its minimum_guarantee_cents, and the requested reserved_cents. Superseded RoyaltyAccrual rows never contribute."
    constants:
      GUARANTEE_BLOCK_CAP_CENTS: 12500
      SHORTFALL_REPORTED_HALF_UP: true
    precision: "integer cents; HALF_UP only when min_accrued_after is fractional"
    variants:
      - name: ledger_actual
        when: "the licensor's real ledger is read (default)"
        difference: "Blocks recovery only up to GUARANTEE_BLOCK_CAP_CENTS, so a licensor whose shortfall exceeds the cap keeps the excess as recoverable royalty."
      - name: ledger_uncapped_projection
        when: "the licensor's exposure is projected forward before settlement"
        difference: "Blocks the full shortfall with no cap, so identical inputs leave a smaller accrued_unsettled_cents than the actual ledger."

  - name: counterfeit_exposure
    trigger: "POST /counterfeit-reports/{report_id}/enforce"
    algorithm: weighted_scoring
    formula: |
      exposure_units = suspect_quantity
      royalty_leakage_cents = round_half_up(exposure_units
                              * EXPOSURE_VALUATION_CENTS_PER_UNIT (1450)
                              * LEAKAGE_RATE_OF_GROSS (0.6)
                              * licensor.royalty_rate_pct)
      penalty_cents = round_half_up(royalty_leakage_cents * DETERRENCE_MULTIPLIER (2.5))
      total_exposure_cents = royalty_leakage_cents + penalty_cents
      A confirmed finding whose total falls below CONFIRMED_FLOOR_CENTS (500) is raised to
      500. An unconfirmed finding writes total_exposure_cents = 0 and leaves the report OPEN.
      Worked value: suspect_quantity = 200 on a licensor with royalty_rate_pct = 0.08 gives
        leakage = round(200 * 1450 * 0.6 * 0.08) = round(13920) = 13920,
        penalty = round(34800) = 34800, total = 48720.
    input_set: "The report's suspect_quantity (0 until enforcement confirms units), the report's unit_count, and the licensor's royalty_rate_pct. unit_count is never an input to the formula — it is only a bound checked by §1.4."
    constants:
      EXPOSURE_VALUATION_CENTS_PER_UNIT: 1450
      LEAKAGE_RATE_OF_GROSS: 0.6
      DETERRENCE_MULTIPLIER: 2.5
      CONFIRMED_FLOOR_CENTS: 500
    precision: "integer cents, HALF_UP"
    variants:
      - name: confirmed_case_exposure
        when: "infringement_confirmed is true"
        difference: "Computes leakage plus penalty and applies the 500-cent floor, so the report writes a non-zero total_exposure_cents."
      - name: unconfirmed_case_exposure
        when: "infringement_confirmed is false"
        difference: "Writes total_exposure_cents = 0 while leaving the report OPEN, so the same suspect_quantity produces divergent totals depending only on the confirmation flag."

  - name: wholesale_fulfillment_total
    trigger: "request-time quote on POST /fulfillment-orders, and every requote at pick, ship, return and distress"
    algorithm: aggregation
    formula: |
      CHANNEL_RATE_CENTS_PER_UNIT = { VENUE_RETAIL: 12, EVENT_POPUP: 9, ECOM: 5 }
      base_cents = quantity * CHANNEL_RATE_CENTS_PER_UNIT[channel]
      if rush_flag is true: base_cents += quantity * RUSH_SURCHARGE_CENTS_PER_UNIT (2)
      if donation_recipient_code is present: base_cents += DONATION_FLAT_CENTS (100)
      requested_wholesale_cents = base_cents
      Post-event rails, each replacing the recognition rather than adding to it:
        DELIVERED: realized_wholesale_cents = requested_wholesale_cents
        RETURNED:  realized_wholesale_cents = max(0, requested_wholesale_cents
                     - return_quantity * run.unit_cost_cents) rounded HALF_UP
        DISTRESSED with destroy_mode DESTROY: realized_wholesale_cents = 0 and
                     requested_wholesale_cents = quantity * DESTROY_PENALTY_CENTS_PER_UNIT (4)
        DISTRESSED with destroy_mode DONATE:  realized_wholesale_cents = 0 and
                     requested_wholesale_cents = quantity * DONATE_PENALTY_CENTS_PER_UNIT (0)
      Summation order is pinned: the per-unit channel term is computed and rounded HALF_UP to
      the cent first, then the rush surcharge term, then the flat donation term, and the
      three are added in that order. Rounding the unrounded sum once instead yields a
      different cent whenever the channel term is fractional.
      Worked values: VENUE_RETAIL 250 units, no rush, no donation gives 250 * 12 = 3000.
      ECOM 250 units gives 250 * 5 = 1250.
    input_set: "The order's channel, quantity, rush_flag and donation_recipient_code, plus the run's unit_cost_cents for the RETURNED rail. Orders whose parent run is in PARALLEL_HOLD are never quoted."
    constants:
      VENUE_RETAIL_RATE_CENTS_PER_UNIT: 12
      EVENT_POPUP_RATE_CENTS_PER_UNIT: 9
      ECOM_RATE_CENTS_PER_UNIT: 5
      RUSH_SURCHARGE_CENTS_PER_UNIT: 2
      DONATION_FLAT_CENTS: 100
      DESTROY_PENALTY_CENTS_PER_UNIT: 4
      DONATE_PENALTY_CENTS_PER_UNIT: 0
    precision: "integer cents; per-term HALF_UP then summed in the pinned order"
    variants:
      - name: request_time_quote
        when: "the order has not shipped yet; the value written at creation"
        difference: "Includes the rush surcharge and the donation flat, so the request-time total is larger than the settled recognition for the same order."
      - name: settled_recognition
        when: "the order settles at delivery, return or distress"
        difference: "Drops the surcharge terms and recognizes moved units only, so identical orders read a smaller realized_wholesale_cents."

  - name: demand_collapse_write_down
    trigger: "POST /production-orders/{production_order_id}/retire, POST /fulfillment-orders/{fulfillment_order_id}/return and POST .../distress"
    algorithm: decay_function
    formula: |
      Target A — ProductionOrder.write_down_inventory_cents for a retired run:
        recovery_pct = (trigger_type == STANDARD) ? STANDARD_RECOVERY_PCT (0.6)
                                                  : FULL_LOSS_RECOVERY_PCT (0.0)
        write_down_inventory_cents = round_half_up(destroyed_qty * unit_cost_cents
                                                   * (1 - recovery_pct))
      Target B — FulfillmentOrder.write_down_inventory_cents for an order still in PLANNED
      when the event window closes:
        write_down_inventory_cents = round_half_up(
            quantity * unit_cost_cents * POST_EVENT_MARKUP (2.5))
      The greater of the two charges is retained on each target independently: when Target B
      is strictly less than Target A it is skipped, because the greater write-down already
      stands.
      discharged = sum of realized_wholesale_cents over the run's DELIVERED and RETURNED
      orders, in created_at order; the write-down may not reduce discharged below 0.
      Worked values: destroyed_qty 100 with unit_cost_cents 900 on a STANDARD run gives
        round(100 * 900 * 0.4) = 36000; on a CHAMPIONSHIP_WIN run it gives
        round(100 * 900 * 1.0) = 90000.
    input_set: "The run's destroyed and donated quantities, its unit_cost_cents, its trigger_type, and every FulfillmentOrder of the run with its terminal status. Orders that never left PLANNED contribute nothing to discharged."
    constants:
      STANDARD_RECOVERY_PCT: 0.6
      FULL_LOSS_RECOVERY_PCT: 0.0
      WRITE_DOWN_RESET_HOURS: 48
      POST_EVENT_MARKUP: 2.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard_collapse_recovery
        when: "the run's trigger_type is STANDARD"
        difference: "Recovers 60 per cent of the destroyed unit cost, so the write-down is 40 per cent of cost."
      - name: hot_market_full_loss
        when: "the run's trigger_type is CHAMPIONSHIP_WIN, MILESTONE or ATHLETE_TRANSACTION"
        difference: "Recovers nothing, so identical destroyed quantities produce a write-down 2.5 times as large as the standard variant."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: business_constraint
    check: "Request shape: required body fields present, enum members valid, numeric fields strictly positive where constrained"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 2
    category: auth
    check: "Segregation of duties: the acting X-User-ID that recorded the licensor decision on a design may not be the acting X-User-ID that commits a production run using that design, nor the one that settles that licensor's minimum guarantee"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /production-orders, POST /production-orders/{production_order_id}/layers, POST /licensors/{licensor_id}/minimum-guarantee/apply"

  - priority: 2
    category: auth
    check: "Licensor ownership: a LicensingOps caller may only act on its own licensor (X-User-ID equals the licensor_id being decided or settled)"
    error_id: ERR_LICENSOR_MISMATCH
    http_status: 403
    applies_to: "PUT /designs/{design_id}/licensor-decision, POST /licensors/{licensor_id}/minimum-guarantee/apply"

  - priority: 3
    category: existence
    check: "Every path id resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3
    category: existence
    check: "The referenced licensor exists"
    error_id: ERR_LICENSOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /designs, POST /production-orders, POST /counterfeit-reports, POST /licensors/{licensor_id}/minimum-guarantee/apply"

  - priority: 3
    category: existence
    check: "The referenced design exists"
    error_id: ERR_DESIGN_NOT_FOUND
    http_status: 404
    applies_to: "POST /production-orders, POST /production-orders/{production_order_id}/layers"

  - priority: 3
    category: existence
    check: "The referenced production order exists"
    error_id: ERR_PRODUCTION_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /production-orders/{production_order_id}/layers, POST /production-orders/{production_order_id}/retire, POST /fulfillment-orders"

  - priority: 3
    category: existence
    check: "The referenced fulfillment order exists"
    error_id: ERR_FULFILLMENT_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /fulfillment-orders/{fulfillment_order_id}/pick, .../ship, .../deliver, .../return, .../distress"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition (including terminal-state lockdown: no transition leaves DELIVERED, RETURNED, DISTRESSED, RETIRED_DESTROYED, RETIRED_DONATED or REVERSED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 4
    category: state
    check: "The referenced production run is no longer COMMITTED or PRINTING, so picked units may not ship"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /fulfillment-orders/{fulfillment_order_id}/ship"

  - priority: 4
    category: state
    check: "A commit was requested on a production run that has already left PARALLEL_HOLD without an intervening revert"
    error_id: ERR_ALREADY_COMMITTED
    http_status: 409
    applies_to: "POST /production-orders/{production_order_id}/layers"

  - priority: 5
    category: state
    check: "OCC: the request's expected_*_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fulfillment-orders/{fulfillment_order_id}/pick, POST /licensors/{licensor_id}/minimum-guarantee/apply"

  - priority: 6
    category: business_referential
    check: "The referenced design is APPROVED by its licensor, and the licensor holds a project record covering the run's trigger_type"
    error_id: ERR_DESIGN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /production-orders, POST /production-orders/{production_order_id}/layers"

  - priority: 6
    category: business_referential
    check: "The licensor has a recorded room project for the requested chamber tier"
    error_id: ERR_LICENSOR_PROJECT_NOT_FOUND
    http_status: 422
    applies_to: "POST /production-orders"

  - priority: 7
    category: business_temporal
    check: "A capacity window can satisfy the reservation's needed_by under the rush SLA, and the logical clock sits inside the run's reopen window"
    error_id: ERR_RUSH_COMMITMENT_BREACH
    http_status: 422
    applies_to: "POST /print-capacity:reserve, POST /production-orders/{production_order_id}/layers"

  - priority: 7
    category: business_temporal
    check: "The logical clock is at or before the referenced production order's committed_at + 48 hours"
    error_id: ERR_EVENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /print-layers/{print_layer_id}/print"

  - priority: 8
    category: business_constraint
    check: "Sequencing: no run with the same team_code and trigger_type has already committed; the earliest-created run is the eligible one"
    error_id: ERR_PRODUCTION_ALREADY_COMMITTED
    http_status: 409
    applies_to: "POST /production-orders/{production_order_id}/layers"

  - priority: 9
    category: business_constraint
    check: "Aggregate capacity: picked, destroyed, donated and returned units of a run, counted across all channels, must not exceed the run's printable pool; a pick quantity must not exceed the requested quantity of the run's earliest shipment"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fulfillment-orders/{fulfillment_order_id}/pick, .../return, .../distress, POST /production-orders/{production_order_id}/retire"

  - priority: 9
    category: business_constraint
    check: "The reservation quantity exceeds the capacity window's remaining available units"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /print-capacity:reserve"

  - priority: 9
    category: business_constraint
    check: "The pick quantity exceeds the available units of the reference pool"
    error_id: ERR_INVENTORY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /fulfillment-orders/{fulfillment_order_id}/pick"

  - priority: 9
    category: business_constraint
    check: "Every picked unit of the referenced run has already been shipped or distressed, leaving nothing to pick from"
    error_id: ERR_LOT_EXHAUSTED
    http_status: 409
    applies_to: "POST /fulfillment-orders/{fulfillment_order_id}/pick"

  - priority: 10
    category: business_fiscal
    check: "Licensor ledger: accrued_unsettled_cents must be greater than 0 and reserved_cents must not exceed accrued_unsettled_cents"
    error_id: ERR_NO_ACCRUED_ROYALTY
    http_status: 422
    applies_to: "POST /licensors/{licensor_id}/minimum-guarantee/apply"

  - priority: 10
    category: business_fiscal
    check: "min_accrued_after (accrued_royalty_cents minus reserved_cents, clamped at 0) is below minimum_guarantee_cents while accept_guarantee_breach is false; the exact shortfall is returned on the error"
    error_id: ERR_GUARANTEE_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /licensors/{licensor_id}/minimum-guarantee/apply"

  - priority: 11
    category: business_fiscal
    check: "reserved_cents is 0 and the settlement would leave accrued_royalty_cents, guarantee_recovery_block_cents and accrued_unsettled_cents all unchanged"
    error_id: ERR_SETTLEMENT_NOOP
    http_status: 422
    applies_to: "POST /licensors/{licensor_id}/minimum-guarantee/apply"

  - priority: 11
    category: business_constraint
    check: "Counterfeit integrity: suspect_quantity <= unit_count, and suspect_quantity > 0 when the infringement is confirmed"
    error_id: ERR_COUNTERFEIT_OVERCOUNT
    http_status: 422
    applies_to: "POST /counterfeit-reports/{report_id}/enforce"

  - priority: 11
    category: business_referential
    check: "The report's online_listing_id does not begin with the VERIFIED- prefix, so the marketplace listing is unverified"
    error_id: ERR_LISTING_UNVERIFIED
    http_status: 422
    applies_to: "POST /counterfeit-reports/{report_id}/enforce"

  - priority: 11
    category: business_constraint
    check: "The pick_remark repeats a remark already recorded on any pick of this order"
    error_id: ERR_PICK_REMARK_REUSED
    http_status: 409
    applies_to: "POST /fulfillment-orders/{fulfillment_order_id}/pick"

  - priority: 11
    category: business_constraint
    check: "A non-BASE layer was requested before its run's BASE layer was committed, or a PENNANT layer was requested on a run whose pennants_included flag is false"
    error_id: ERR_PRINT_TYPECAST_MISMATCH
    http_status: 422
    applies_to: "POST /production-orders/{production_order_id}/layers, POST /print-layers/{print_layer_id}/print"

  - priority: 11
    category: business_constraint
    check: "printed_qty would exceed the layer's authorized quantity"
    error_id: ERR_PRINT_QUANTITY_EXCEEDED
    http_status: 422
    applies_to: "POST /print-layers/{print_layer_id}/print"

  - priority: 12
    category: business_constraint
    check: "The hot-market allocation computed by hot_market_capacity_commitment falls below its own floor + alignment"
    error_id: ERR_UNBALANCED_ALLOCATION
    http_status: 422
    applies_to: "POST /production-orders"

# =============================================================================

# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (38 endpoints)
# =============================================================================
endpoints:
  # --- Licensors ---
  - method: POST
    path: "/licensors"
    description: "Register a rights holder with its royalty rate and minimum guarantee"
    roles: [PlatformAdmin]
    code: 201
    input: [name, league_code, royalty_rate_pct, minimum_guarantee_cents, "currency?"]
    output: Licensor
    side_effects: ["accrued_royalty_cents=0, guarantee_recovery_block_cents=0, accrued_unsettled_cents=0"]

  - method: GET
    path: "/licensors/{licensor_id}"
    description: "Read a licensor ledger (accrued, guarantee-shortfall block, unsettled)"
    roles: [LicensingOps, AuditOnly, EnforcementAgent]
    code: 200
    input: []
    output: Licensor
    side_effects: []

  - method: POST
    path: "/licensors/{licensor_id}/minimum-guarantee/apply"
    description: "Settle the minimum guarantee early: reserve unpaid royalty, record the guarantee shortfall, and block recovery below the guarantee floor"
    roles: [LicensingOps]
    code: 201
    input: [expected_licensor_version, reserved_cents, accept_guarantee_breach]
    output: MinimumGuaranteeSettlement
    side_effects:
      - "snapped_accrued_cents = Licensor.accrued_royalty_cents before settlement; guarantee_shortfall_cents = max(0, minimum_guarantee_cents - min_accrued_after) with min_accrued_after = accrued_royalty_cents - reserved_cents"
      - "Rejects with ERR_GUARANTEE_FLOOR_BREACH, reporting the shortfall, when min_accrued_after is below minimum_guarantee_cents and accept_guarantee_breach is false"
      - "Licensor.accrued_royalty_cents -= reserved_cents; Licensor.guarantee_recovery_block_cents += guarantee_shortfall_cents; accrued_unsettled_cents recomputed"
      - "increments Licensor.version by 1"
      - "A later reversal restores snapped_accrued_cents exactly and reduces guarantee_recovery_block_cents by the recorded guarantee_shortfall_cents"

  - method: GET
    path: "/licensors/{id}/minimum-guarantee-settlements"
    description: "List a licensor's minimum-guarantee settlements"
    roles: [LicensingOps, AuditOnly]
    code: 200
    input: []
    output: MinimumGuaranteeSettlement[]
    side_effects: []

  - method: POST
    path: "/licensors/{licensor_id}/minimum-guarantee/reverse"
    description: "Reverse the licensor's latest APPROVED early settlement, restoring the ledger triple to exactly the values observed before it was applied"
    roles: [LicensingOps]
    code: 200
    input: [expected_licensor_version]
    output: MinimumGuaranteeSettlement
    side_effects:
      - "status → REVERSED; the settlement's snapped_accrued_cents is restored to Licensor.accrued_royalty_cents"
      - "Licensor.guarantee_recovery_block_cents -= guarantee_shortfall_cents; accrued_unsettled_cents recomputed as max(0, accrued - block)"
      - "increments Licensor.version by 1"
      - "Rejects with ERR_INVALID_STATE when no APPROVED settlement exists to reverse"

  # --- Designs ---
  - method: POST
    path: "/designs"
    description: "Create a licensed design for a team, player and garment"
    roles: [DesignOps]
    code: 201
    input: [licensor_id, team_code, "player_code?", garment_sku, design_name]
    output: Design
    side_effects: ["approval_state=PENDING_LICENSOR_APPROVAL, approved_version=null"]

  - method: GET
    path: "/designs/{design_id}"
    description: "Read a design with its approval state and pinned approved version"
    roles: [DesignOps, LicensingOps, ProductionPlanner, AuditOnly]
    code: 200
    input: []
    output: Design
    side_effects: []

  - method: GET
    path: "/designs"
    description: "List designs, optionally scoped to one licensor"
    roles: [DesignOps, ProductionPlanner, AuditOnly]
    code: 200
    input: ["licensor_id?", "approval_state?", "limit?", "offset?"]
    output: Design[]
    side_effects: []

  - method: PUT
    path: "/designs/{design_id}/submit"
    description: "Return a rejected design to licensor review"
    roles: [DesignOps]
    code: 200
    input: [expected_design_version]
    output: Design
    side_effects: ["approval_state → PENDING_LICENSOR_APPROVAL, rejection_reason cleared, increments Design.version by 1"]

  - method: PUT
    path: "/designs/{design_id}/licensor-decision"
    description: "Record the licensor's approval or rejection of a design; a rejection cascades to every production run using that design"
    roles: [LicensingOps]
    code: 200
    input: [decision, expected_design_version, "rejection_reason?"]
    output: Design
    side_effects:
      - "decision=APPROVE: approval_state → APPROVED, approved_version pinned, increments Design.version by 1"
      - "decision=REJECT: approval_state → APPROVAL_REJECTED, rejection_reason recorded, increments Design.version by 1"
      - "REJECT cascade hop 1: every ProductionOrder with design_id == this design → RETIRED_DESTROYED with retire_reason ASSORTMENT_CHANGED, its PRINTED PrintLayers → PRINT_FAILED with committed_qty 0, and each run's open FulfillmentOrders rescaled or set DISTRESSED"

  # --- Production orders ---
  - method: POST
    path: "/production-orders"
    description: "Create a hot-market or standard production run for one outcome; runs for the two possible outcomes of the same event form a parallel-hold pair"
    roles: [ProductionPlanner]
    code: 201
    input: [licensor_id, design_id, team_code, trigger_type, "event_outcome?", expected_demand_qty, unit_cost_cents, "pennants_included?", "win_probability_pct?", "outcome_at?"]
    output: ProductionOrder
    side_effects:
      - "status=PARALLEL_HOLD; retired_design_version pinned to Design.approved_version; observed_current_design_version = Design.version"
      - "hold_allocation_cents = parallel_hold_inventory_cents (shared by the two outcome runs of the same event)"
      - "capacity_commitment_units set by hot_market_capacity_commitment; raises ERR_UNBALANCED_ALLOCATION when the allocation falls below its floor, returning the required value in the error message"
      - "rush_delivery_points set by rush_delivery_commitment from the run's HELD reservations (0 when none are held yet)"

  - method: GET
    path: "/production-orders/{production_order_id}"
    description: "Read a production run with its capitalized inventory and pinned design version"
    roles: [ProductionPlanner, FulfillmentCoordinator, AuditOnly]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []

  - method: GET
    path: "/production-orders"
    description: "List production runs filtered by licensor, design, status or team"
    roles: [ProductionPlanner, FulfillmentCoordinator, AuditOnly]
    code: 200
    input: ["licensor_id?", "design_id?", "status?", "team_code?", "limit?", "offset?"]
    output: ProductionOrder[]
    side_effects: []

  - method: POST
    path: "/production-orders/{production_order_id}/layers"
    description: "Author print layers for a run and commit the winning outcome (destroy_mode SHORTFALL leaves the run in PARALLEL_HOLD)"
    roles: [ProductionPlanner]
    code: 200
    input: [expected_production_order_version, layers, "destroy_mode?"]
    output: ProductionOrder
    side_effects:
      - "PARALLEL_HOLD → COMMITTED when destroy_mode is absent or DESTROY/DONATE; committed_at stamped; committed_inventory_cents recomputed and hold_allocation_cents released"
      - "Recomputes base_units_printed / accessory_units_printed from the submitted layers and appends the new layer ids to layer_ids in submission order; capacity_commitment_units stays as written at creation"
      - "Rejects the run when a same-team same-trigger run already committed (ERR_PRODUCTION_ALREADY_COMMITTED)"
      - "Rejects when the referenced design is not APPROVED (ERR_DESIGN_NOT_APPROVED) or the run's pinned design version differs from the design's current approved version (ERR_PRINT_TYPECAST_MISMATCH)"
      - "increments ProductionOrder.version by 1; increments Design.version by 1; increments Licensor.version by 1 and recomputes accrued_unsettled_cents"

  - method: POST
    path: "/production-orders/{production_order_id}/retire"
    description: "Retire a run, destroying or donating the losing side's goods after the outcome is known"
    roles: [ProductionPlanner]
    code: 200
    input: [retire_reason, "destroy_mode?"]
    output: ProductionOrder
    side_effects:
      - "status → RETIRED_DESTROYED or RETIRED_DONATED per destroy_mode; retired_at stamped"
      - "destroy_mode DESTROY: every FulfillmentOrder of the run gets destroyed_qty = quantity and a DESTROY-weighted requested_wholesale_cents; DONATE: donated_qty = quantity and no penalty"
      - "ProductionOrder.write_down_inventory_cents recomputed by demand_collapse_write_down"
      - "Every PRINTED PrintLayer → PRINT_FAILED with committed_qty 0; write_down_inventory_cents is booked by demand_collapse_write_down at planned quantity (skipped when an equal-or-greater write-down already exists)"
      - "increments ProductionOrder.version by 1, Design.version by 1 and Licensor.version by 1"

  # --- Print layers ---
  - method: POST
    path: "/print-layers/{print_layer_id}/print"
    description: "Print units on a layer; a successful print moves the parent run into PRINTING, and a print whose committed quantity reduces to zero reverts the run to COMMITTED"
    roles: [PrintOperator]
    code: 200
    input: [printed_qty]
    output: PrintLayer
    side_effects:
      - "printed_qty += printed_qty; committed_qty = printed_qty - failed_qty; layer_state → PRINTED; design_version_checked = Design.version observed now"
      - "Parent run COMMITTED → PRINTING with base_units_printed / accessory_units_printed recomputed"
      - "Parent run PRINTING → COMMITTED (reopen) when the reducer yields committed_qty 0 inside the reopen window; open FulfillmentOrders are rescaled and distressed when their recomputed total falls below zero"
      - "increments Design.version by 1"

  - method: POST
    path: "/print-layers/{print_layer_id}/print-failure"
    description: "Record lost units on a layer and rescale the parent run's open demand"
    roles: [PrintOperator]
    code: 200
    input: [failed_qty]
    output: PrintLayer
    side_effects:
      - "failed_qty += failed_qty; committed_qty = printed_qty - failed_qty (floored at 0); layer_state → PRINT_FAILED"
      - "Parent run base_units_printed / accessory_units_printed recomputed downward"
      - "Each open FulfillmentOrder: requested_wholesale_cents scaled by committed_qty/quantity, marked DISTRESSED when the recomputed total falls to zero or below"

  - method: GET
    path: "/print-layers"
    description: "List print layers filtered by run or design"
    roles: [PrintOperator, ProductionPlanner, AuditOnly]
    code: 200
    input: ["production_order_id?", "design_id?", "layer_state?", "limit?", "offset?"]
    output: PrintLayer[]
    side_effects: []

  - method: GET
    path: "/print-layers/{print_layer_id}"
    description: "Read a print layer with its printed, committed and failed quantities"
    roles: [PrintOperator, ProductionPlanner, AuditOnly]
    code: 200
    input: []
    output: PrintLayer
    side_effects: []

  # --- Print capacity ---
  - method: POST
    path: "/print-capacity"
    description: "Register an on-demand print/embroidery capacity window near a market"
    roles: [FulfillmentCoordinator]
    code: 201
    input: [city_code, print_type, window_start, window_end, capacity_qty, rush_sla_hours]
    output: PrintCapacity
    side_effects: ["reserved_qty=0, available_qty=capacity_qty"]

  - method: GET
    path: "/print-capacity/{print_capacity_id}"
    description: "Read a capacity window with its reserved and available quantities"
    roles: [FulfillmentCoordinator, ProductionPlanner, AuditOnly]
    code: 200
    input: []
    output: PrintCapacity
    side_effects: []

  - method: POST
    path: "/print-capacity:reserve"
    description: "Reserve units from a capacity window, carrying the rush delivery commitment"
    roles: [FulfillmentCoordinator]
    code: 201
    input: [print_capacity_id, quantity, "rush_flag?", needed_by]
    output: PrintReservation
    side_effects:
      - "reservation_state=HELD; reserved_at stamped"
      - "PrintCapacity.reserved_qty += quantity; available_qty recomputed"
      - "Rejects when the window cannot start at or before needed_by under the rush SLA (ERR_RUSH_COMMITMENT_BREACH)"
      - "Reservations are processed in reserved_at order, so an earlier reservation keeps its units when a later one would overflow the window"

  - method: GET
    path: "/print-capacity/{id}/reservations"
    description: "List the reservations held against one capacity window"
    roles: [FulfillmentCoordinator, AuditOnly]
    code: 200
    input: []
    output: PrintReservation[]
    side_effects: []

  # --- Fulfillment orders ---
  - method: POST
    path: "/fulfillment-orders"
    description: "Place venue retail, event pop-up or e-commerce demand against a run's shared inventory pool"
    roles: [FulfillmentCoordinator]
    code: 201
    input: [production_order_id, channel, destination_code, quantity, "rush_flag?", "donation_recipient_code?", "pick_remark?"]
    output: FulfillmentOrder
    side_effects: ["status=PLANNED; requested_wholesale_cents computed by wholesale_fulfillment_total at request time"]

  - method: GET
    path: "/fulfillment-orders/{fulfillment_order_id}"
    description: "Read a fulfillment order with its picked, shipped, returned, destroyed and donated quantities"
    roles: [FulfillmentCoordinator, AuditOnly]
    code: 200
    input: []
    output: FulfillmentOrder
    side_effects: []

  - method: GET
    path: "/fulfillment-orders"
    description: "List fulfillment orders filtered by run, status or channel"
    roles: [FulfillmentCoordinator, AuditOnly]
    code: 200
    input: ["production_order_id?", "status?", "channel?", "limit?", "offset?"]
    output: FulfillmentOrder[]
    side_effects: []

  - method: POST
    path: "/fulfillment-orders/{fulfillment_order_id}/pick"
    description: "Pick units from the run's pool; venue retail, pop-up and e-commerce draw on the same pool"
    roles: [FulfillmentCoordinator]
    code: 200
    input: [expected_production_order_version, quantity, pick_remark]
    output: FulfillmentOrder
    side_effects:
      - "picked_qty += quantity; status → PICKED"
      - "Rejects when the quantity exceeds the reference pool's available units (ERR_INVENTORY_INSUFFICIENT)"
      - "Rejects when picking would take the run's channel-total picked units past its printable pool (ERR_CAPACITY_EXCEEDED)"
      - "Rejects a repeated pick_remark (ERR_PICK_REMARK_REUSED)"
      - "increments ProductionOrder.version by 1"

  - method: POST
    path: "/fulfillment-orders/{fulfillment_order_id}/ship"
    description: "Ship picked units and open a shipment for the rush or ground leg"
    roles: [FulfillmentCoordinator]
    code: 201
    input: [quantity, carrier, sla_hours]
    output: Shipment
    side_effects:
      - "shipped_qty += quantity; a Shipment in IN_TRANSIT is created with committed_at stamped"
      - "status → SHIPPED when the picked quantity is fully shipped"
      - "Rejects carrier RUSH_AIR when rush_flag is false, and a rush delivery to a venue or pop-up with sla_hours > 24 (ERR_RUSH_COMMITMENT_BREACH)"
      - "requested_wholesale_cents recomputed with the shipped leg counted at the CITY family rate"

  - method: POST
    path: "/fulfillment-orders/{fulfillment_order_id}/deliver"
    description: "Confirm delivery and recognize the order's wholesale value and royalty"
    roles: [FulfillmentCoordinator]
    code: 200
    input: []
    output: FulfillmentOrder
    side_effects:
      - "status → DELIVERED; the order's shipments → DELIVERED with delivered_at stamped"
      - "realized_wholesale_cents = requested_wholesale_cents"
      - "increments Licensor.version by 1 and recomputes accrued_royalty_cents from the delivered units"

  - method: POST
    path: "/fulfillment-orders/{fulfillment_order_id}/return"
    description: "Accept unsold units back after the event window and settle the recovery"
    roles: [FulfillmentCoordinator]
    code: 200
    input: [return_quantity, "destroy_mode?"]
    output: FulfillmentOrder
    side_effects:
      - "returned_qty += return_quantity; status → RETURNED"
      - "realized_wholesale_cents = requested_wholesale_cents - return_quantity * unit_cost_cents rounded HALF_UP; damaged units raise the run's destroyed quantity while donated_qty is untouched"
      - "Rejects a return_quantity above the order's shipped quantity (ERR_CAPACITY_EXCEEDED)"

  - method: POST
    path: "/fulfillment-orders/{fulfillment_order_id}/distress"
    description: "Distress unsold demand after a demand collapse, destroying or donating the units"
    roles: [FulfillmentCoordinator]
    code: 200
    input: [distress_reason, "destroy_mode?", "donation_recipient_code?"]
    output: FulfillmentOrder
    side_effects:
      - "status → DISTRESSED with distress_reason recorded"
      - "destroy_mode DESTROY: destroyed_qty = quantity and requested_wholesale_cents weighted by the destroy penalty; DONATE: donated_qty = quantity and no penalty; both set realized_wholesale_cents = 0"
      - "Rejects destroy_mode DONATE without a donation_recipient_code (ERR_INVALID_REQUEST)"
      - "increments Licensor.version by 1"

  - method: GET
    path: "/fulfillment-orders/{id}/shipments"
    description: "List the shipments opened for one fulfillment order"
    roles: [FulfillmentCoordinator, AuditOnly]
    code: 200
    input: []
    output: Shipment[]
    side_effects: []

  # --- Royalty accruals ---
  - method: GET
    path: "/royalty-accruals"
    description: "List royalty accrual rows filtered by licensor or production order"
    roles: [LicensingOps, AuditOnly]
    code: 200
    input: ["licensor_id?", "production_order_id?", "basis?", "limit?", "offset?"]
    output: RoyaltyAccrual[]
    side_effects: []

  - method: GET
    path: "/royalty-accruals/{accrual_id}"
    description: "Read one royalty accrual row with its basis and accrued value"
    roles: [LicensingOps, AuditOnly]
    code: 200
    input: []
    output: RoyaltyAccrual
    side_effects: []

  # --- Counterfeit enforcement ---
  - method: POST
    path: "/counterfeit-reports"
    description: "Log counterfeit merchandise found around a venue or on a marketplace listing"
    roles: [EnforcementAgent]
    code: 201
    input: [licensor_id, venue_code, online_listing_id, unit_count, "suspect_quantity?", detected_at]
    output: CounterfeitReport
    side_effects: ["report_status=OPEN; total_exposure_cents=0 until enforcement runs"]

  - method: POST
    path: "/counterfeit-reports/{report_id}/enforce"
    description: "Confirm or clear a counterfeit finding and compute the licensor's exposure"
    roles: [EnforcementAgent]
    code: 200
    input: [infringement_confirmed, suspect_quantity]
    output: CounterfeitReport
    side_effects:
      - "infringement_confirmed=true: report_status → ENFORCED, royalty_leakage_cents and penalty_cents computed, total_exposure_cents = leakage + penalty"
      - "infringement_confirmed=false: total_exposure_cents = 0 and the report stays OPEN"
      - "increments Licensor.version by 1"

  - method: GET
    path: "/counterfeit-reports/{report_id}"
    description: "Read a counterfeit report with its exposure breakdown"
    roles: [EnforcementAgent, AuditOnly]
    code: 200
    input: []
    output: CounterfeitReport
    side_effects: []

  - method: GET
    path: "/counterfeit-reports"
    description: "List counterfeit reports filtered by licensor"
    roles: [EnforcementAgent, AuditOnly]
    code: 200
    input: ["licensor_id?", "report_status?", "limit?", "offset?"]
    output: CounterfeitReport[]
    side_effects: []

  # --- Test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default is 2026-09-01T00:00:00Z: before any call to this endpoint the clock reads exactly that instant and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["Logical clock advanced or rewound; every deadline, reopen window and rush SLA is evaluated against it"]
# =============================================================================
# §1.6 Error Code Catalog (30 codes)
# =============================================================================
errors:
  # --- Request shape & auth ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request: missing or mistyped body field, non-positive quantity, window_end not after window_start, or destroy_mode DONATE without a donation_recipient_code"

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent or malformed"

  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The calling role is not permitted for this operation per the §1.7 matrix"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting operator recorded the design's licensor decision and is now trying to commit or settle that same licensor's work"

  - id: ERR_LICENSOR_MISMATCH
    http: 403
    condition: "A LicensingOps caller is acting on a licensor other than the one its X-User-ID identifies"

  # --- Existence ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id does not resolve to any resource"

  - id: ERR_LICENSOR_NOT_FOUND
    http: 404
    condition: "The referenced licensor does not exist"

  - id: ERR_DESIGN_NOT_FOUND
    http: 404
    condition: "The referenced design does not exist"

  - id: ERR_PRODUCTION_ORDER_NOT_FOUND
    http: 404
    condition: "The referenced production run does not exist"

  - id: ERR_FULFILLMENT_ORDER_NOT_FOUND
    http: 404
    condition: "The referenced fulfillment order does not exist"

  # --- State & concurrency ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The resource is not in a state that permits the requested transition, including any attempt to leave a terminal state"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "The request's expected_*_version does not equal the parent entity's current version"

  - id: ERR_ALREADY_COMMITTED
    http: 409
    condition: "A second commit was attempted on a run that has already left PARALLEL_HOLD without an intervening revert"

  # --- Licensing & design approval ---
  - id: ERR_DESIGN_NOT_APPROVED
    http: 422
    condition: "The referenced design is in PENDING_LICENSOR_APPROVAL or APPROVAL_REJECTED when a production run or print layer needs it approved"

  - id: ERR_LICENSOR_PROJECT_NOT_FOUND
    http: 422
    condition: "The licensor holds no recorded rights project covering the run's requested trigger_type or garment_sku"

  - id: ERR_PRINT_TYPECAST_MISMATCH
    http: 422
    condition: "A non-BASE layer was requested before its run's BASE layer committed, a PENNANT layer was requested on a run with pennants_included false, or the run's pinned design version differs from the design's current approved version"

  - id: ERR_PRINT_QUANTITY_EXCEEDED
    http: 422
    condition: "printed_qty would exceed the print layer's authorized quantity"

  # --- Hot market & capacity ---
  - id: ERR_UNBALANCED_ALLOCATION
    http: 422
    condition: "The hot-market allocation computed for a production run falls below its own floor plus residual; the required value is returned in the message"

  - id: ERR_RUSH_COMMITMENT_BREACH
    http: 422
    condition: "No capacity window can start at or before the reservation's needed_by under the rush SLA, a RUSH_AIR shipment was requested without the rush flag, a rush venue delivery exceeds 24 hours, or a run with zero rush delivery points is not punctual"

  - id: ERR_EVENT_WINDOW_CLOSED
    http: 409
    condition: "The logical clock has passed the referenced production run's committed_at + 48 hours, so the event window can no longer be reopened or printed into"

  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "The run's channel-total picked, destroyed, donated and returned units would pass its printable pool, or a return quantity exceeds the shipped quantity"

  - id: ERR_INVENTORY_INSUFFICIENT
    http: 409
    condition: "The pick quantity exceeds the available units of the reference pool"

  - id: ERR_PRODUCTION_ALREADY_COMMITTED
    http: 409
    condition: "A run with the same team_code and trigger_type has already committed; only the earliest-created run of the pair may commit"

  - id: ERR_PICK_REMARK_REUSED
    http: 409
    condition: "The pick_remark repeats a remark already recorded on any pick of this order"

  - id: ERR_LOT_EXHAUSTED
    http: 409
    condition: "Every picked unit of the referenced run has already been shipped or distressed, leaving nothing to pick from"

  # --- Royalty ledger ---
  - id: ERR_NO_ACCRUED_ROYALTY
    http: 422
    condition: "The licensor has no unsettled accrual, the reserve exceeds the unsettled amount, or the accrued royalty sits below the minimum guarantee"

  - id: ERR_GUARANTEE_FLOOR_BREACH
    http: 422
    condition: "The licensor's accrued royalty is below its minimum guarantee; the exact shortfall is returned in the message"

  - id: ERR_SETTLEMENT_NOOP
    http: 422
    condition: "The settlement would set the reserved, accrued and unsettled quantities to zero without moving any royalty"

  # --- Counterfeit enforcement ---
  - id: ERR_COUNTERFEIT_OVERCOUNT
    http: 422
    condition: "suspect_quantity exceeds unit_count, or a confirmed infringement carries a zero suspect_quantity"

  - id: ERR_LISTING_UNVERIFIED
    http: 422
    condition: "The report's online_listing_id does not begin with the VERIFIED- prefix, so the marketplace listing is unverified and enforcement may not confirm it"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Benchmark administrator; owns the logical clock and the licensor register"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — Set the logical clock"
      - "POST /licensors — Register a rights holder"
    shared_operations:
      - "GET /licensors/{licensor_id} — Read any licensor ledger"
      - "GET /designs, GET /production-orders — Unscoped reads across all licensors"

  - name: LicensingOps
    description: "Licensing operator bound to one rights holder; records licensor decisions and settles minimum guarantees"
    identity: entity_backed:Licensor
    exclusive_operations:
      - "PUT /designs/{design_id}/licensor-decision — Approve or reject a design; a rejection cascades to every run of that design"
      - "POST /licensors/{licensor_id}/minimum-guarantee/apply — Settle the minimum guarantee early"
      - "POST /licensors/{licensor_id}/minimum-guarantee/reverse — Reverse the licensor's latest early settlement"
    shared_operations:
      - "GET /licensors/{licensor_id} — Read its own licensor ledger"
      - "GET /designs/{design_id} — Read a design"
      - "GET /royalty-accruals — Read accrual rows"

  - name: DesignOps
    description: "Design studio; authors licensed designs and resubmits rejected ones"
    identity: opaque
    exclusive_operations:
      - "POST /designs — Create a design"
      - "PUT /designs/{design_id}/submit — Resubmit a rejected design for review"
    shared_operations:
      - "GET /designs/{design_id}, GET /designs — Read designs"

  - name: ProductionPlanner
    description: "Hot-market planner; opens parallel-hold runs, commits the winning outcome, authors layers and retires the losing side"
    identity: opaque
    exclusive_operations:
      - "POST /production-orders — Create a production run for one outcome"
      - "POST /production-orders/{production_order_id}/layers — Author layers and commit the outcome"
      - "POST /production-orders/{production_order_id}/retire — Retire a run, destroying or donating the goods"
    shared_operations:
      - "GET /production-orders/{production_order_id}, GET /production-orders — Read runs"
      - "GET /print-layers, GET /print-layers/{print_layer_id} — Read layers"
      - "GET /print-capacity/{print_capacity_id} — Read capacity windows"
      - "GET /designs/{design_id} — Read the design being produced"

  - name: PrintOperator
    description: "Press and embroidery operator; runs print jobs and records lost units"
    identity: opaque
    exclusive_operations:
      - "POST /print-layers/{print_layer_id}/print — Print units on a layer"
      - "POST /print-layers/{print_layer_id}/print-failure — Record lost units"
    shared_operations:
      - "GET /print-layers, GET /print-layers/{print_layer_id} — Read layers"

  - name: FulfillmentCoordinator
    description: "Venue, pop-up and e-commerce fulfilment operator; holds print capacity and moves the shared inventory pool"
    identity: opaque
    exclusive_operations:
      - "POST /print-capacity — Register an on-demand capacity window"
      - "POST /print-capacity:reserve — Reserve units from a window"
      - "POST /fulfillment-orders — Place channel demand against a run"
      - "POST /fulfillment-orders/{fulfillment_order_id}/pick — Pick units"
      - "POST /fulfillment-orders/{fulfillment_order_id}/ship — Ship picked units"
      - "POST /fulfillment-orders/{fulfillment_order_id}/deliver — Confirm delivery"
      - "POST /fulfillment-orders/{fulfillment_order_id}/return — Accept unsold units back"
      - "POST /fulfillment-orders/{fulfillment_order_id}/distress — Distress unsold demand"
    shared_operations:
      - "GET /fulfillment-orders/{fulfillment_order_id}, GET /fulfillment-orders — Read orders"
      - "GET /fulfillment-orders/{fulfillment_order_id}/shipments — Read shipments"
      - "GET /print-capacity/{print_capacity_id}, GET /print-capacity/{print_capacity_id}/reservations — Read capacity"
      - "GET /production-orders/{production_order_id} — Read the run being fulfilled"

  - name: EnforcementAgent
    description: "Brand-protection investigator; logs counterfeit findings around venues and on marketplaces"
    identity: opaque
    exclusive_operations:
      - "POST /counterfeit-reports — Log a counterfeit finding"
      - "POST /counterfeit-reports/{report_id}/enforce — Confirm or clear a finding"
    shared_operations:
      - "GET /counterfeit-reports/{report_id}, GET /counterfeit-reports — Read reports"
      - "GET /licensors/{licensor_id} — Read the affected licensor's ledger"

  - name: AuditOnly
    description: "Read-only reviewer across the licensing, production and royalty surfaces"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /licensors/{licensor_id} — Read a licensor ledger"
      - "GET /licensors/{licensor_id}/minimum-guarantee-settlements — Read settlements"
      - "GET /designs/{design_id}, GET /designs — Read designs"
      - "GET /production-orders/{production_order_id}, GET /production-orders — Read runs"
      - "GET /print-layers, GET /print-layers/{print_layer_id} — Read layers"
      - "GET /print-capacity/{print_capacity_id}, GET /print-capacity/{print_capacity_id}/reservations — Read capacity"
      - "GET /fulfillment-orders/{fulfillment_order_id}, GET /fulfillment-orders, GET /fulfillment-orders/{fulfillment_order_id}/shipments — Read fulfillment"
      - "GET /royalty-accruals, GET /royalty-accruals/{accrual_id} — Read accruals"
      - "GET /counterfeit-reports/{report_id}, GET /counterfeit-reports — Read reports"
