              as: Bookkeeper
              captures: { o1_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
