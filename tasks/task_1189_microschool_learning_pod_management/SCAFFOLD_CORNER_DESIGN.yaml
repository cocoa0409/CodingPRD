  # =====================================================================
  # Section 9: Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_enroll
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "After POST /pods/{id}/seats/{seat_id}/enroll returns 200, a subsequent GET /pods/{id} immediately reflects enrolled_count incremented by 1."
        test_recipe:
          setup: ["Pod ACTIVE; one RESERVED seat."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PodOperator
              captures: { v_pre: $.data.version, cnt_pre: $.data.enrolled_count }
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/enroll"
              payload: { expected_pod_version: "${v_pre}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PodOperator
              captures: { cnt_post: $.data.enrolled_count }
          assert:
            - "cnt_post == cnt_pre + 1 (immediately visible; no eventual consistency delay)"
