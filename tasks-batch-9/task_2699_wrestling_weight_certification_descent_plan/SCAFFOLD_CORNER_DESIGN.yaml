  - section: state_machines
    instances:

      - name: event_status_valid_transition_walk_to_completed
        claim_type: valid_transition
        grounds:
          - state_machines.Event.SCHEDULED_to_WEIGH_IN_OPEN
          - state_machines.Event.WEIGH_IN_OPEN_to_WEIGH_IN_CLOSED
          - state_machines.Event.WEIGH_IN_CLOSED_to_SEEDED
          - state_machines.Event.SEEDED_to_COMPLETED
          - state_machines.TournamentEntry.WEIGHED_IN_to_SEEDED
        distinguishing_aspect: "The full declared Event path SCHEDULED -> WEIGH_IN_OPEN -> WEIGH_IN_CLOSED -> SEEDED -> COMPLETED succeeds in order, bracket_locked flips to true exactly at seeding, and seed_integrity_sum lands on 1 for the single seeded entry."
        test_recipe:
          setup:
            - "Open season, one team, wrestler A certified (min class 150, WEEKLY_STEP plan from 2026-11-02)."
            - "One event on 2026-12-12; at that date the governing milestone is w5 = 147.9 so the lowest eligible class is 150 and the entry is filed at 150."
            - "Clock advanced to 2026-12-12 before the weigh-in so recorded_at falls on event_date + day_index 0."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
