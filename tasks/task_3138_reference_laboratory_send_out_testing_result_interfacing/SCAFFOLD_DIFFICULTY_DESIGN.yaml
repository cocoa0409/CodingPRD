  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      # -----------------------------------------------------------------------
      - name: send_out_order_hold_cycle_returns_to_submitted
        grounds:
          - state_machines.SendOutOrder.S_SUBMITTED_to_S_ON_HOLD
          - state_machines.SendOutOrder.S_ON_HOLD_to_S_SUBMITTED
          - state_machines.ClientLaboratory.ACTIVE_to_CREDIT_HOLD
          - state_machines.ClientLaboratory.CREDIT_HOLD_to_ACTIVE
          - entities.SendOutOrder.fields.order_status
          - entities.SendOutOrder.fields.billing_status
        distinguishing_aspect: |
          SendOutOrder.order_status is cyclic rather than a pipeline: the ledger-driven posture
          flip holds a SUBMITTED order, settlement releases it back to SUBMITTED, and a second
          over-limit charge holds it again — a linear A-to-B-to-C machine cannot express the
          third visit to ON_HOLD.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client with a 1000-cent credit limit, a certified build, published entries whose single charges exceed that limit, and an order in SUBMITTED."
          setup_api_calls:
            - *clk
            - call: "POST /reference-lab/client-laboratories"
              payload: { name: "Box Elder Clinic", clia_number: "45D-2002", client_type: "PHYSICIAN_OFFICE", state_code: "UT", billing_arrangement: "CLIENT", credit_limit_cents: 1000 }
              as: ReferenceLabOperations
              captures: { c2_id: $.data.id }
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - call: "GET /reference-lab/client-laboratories/${c2_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { c2_v: $.data.version }
            - call: "POST /reference-lab/courier-runs"
              payload: { client_laboratory_id: "${c2_id}", route_code: "BRV-PM", origin_city: "Brigham City", destination_city: "Salt Lake City", vehicle_id: "VAN-9", scheduled_departure_at: "2026-09-01T05:00:00Z", scheduled_arrival_at: "2026-09-01T09:30:00Z", scheduled_pickup_at: "2026-09-01T05:00:00Z", scheduled_delivery_at: "2026-09-01T09:30:00Z", temperature_control_mode: "AMBIENT", expected_client_laboratory_version: "${c2_v}" }
              as: CourierCoordinator
              captures: { cr2_id: $.data.id }
            - call: "POST /reference-lab/client-laboratories/${c2_id}/publish-requirements"
              payload: {}
              as: ReferenceLabOperations
            - call: "POST /reference-lab/client-laboratories/${c2_id}/activate"
              payload: {}
              as: ReferenceLabOperations
            - call: "POST /reference-lab/billing-ledgers"
              payload: { client_laboratory_id: "${c2_id}" }
              as: LabBillingSpecialist
              captures: { bl2_id: $.data.id }
            - call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${c2_id}", courier_run_id: "${cr2_id}", accession_number: "ACC-5001", patient_mrn: "MRN-9001", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 3.0, collection_at: "2026-09-01T06:00:00Z", received_at: "2026-09-01T06:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { sp50_id: $.data.id }
            - call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${c2_id}", specimen_id: "${sp50_id}", order_number: "REQ-5001", patient_mrn: "MRN-9001", client_requested_at: "2026-09-01T06:35:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${t1_id}", line_sequence: 1 }], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { o50_id: $.data.id, l50_id: "$.data.test_lines[0].id" }
            - call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${t1_id}", instrument_code: "IMM-05", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T07:00:00Z", reserved_end_at: "2026-09-01T12:00:00Z" }
              as: MedicalTechnologist
            - call: "POST /reference-lab/specimens/${sp50_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/send-out-orders/${o50_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/specimens/${sp50_id}/begin-testing"
              payload: {}
              as: MedicalTechnologist
              captures: { o50_v: $.data.version }
            - call: "POST /reference-lab/send-out-orders/${o50_id}/enter-results"
              payload: { expected_send_out_order_version: "${o50_v}", result_lines: [{ order_test_line_id: "${l50_id}", result_value: 90.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }] }
              as: MedicalTechnologist
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: ReferenceLabOperations
            - call: "POST /reference-lab/send-out-orders/${o50_id}/release-results"
              payload: { interpretive_comment: "Ferritin, no interpretive comment." }
              as: Pathologist
          trigger:
            - call: "GET /reference-lab/client-laboratories/${c2_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { c2_posture1: $.data.status }
            - call: "POST /reference-lab/client-laboratories/${c2_id}/settle-balance"
              payload: { settlement_amount_cents: 1150 }
              as: LabBillingSpecialist
              captures: { c2_posture2: $.data.status }
            - call: "POST /reference-lab/send-out-orders/${o50_id}/release-hold"
              payload: {}
              as: LabBillingSpecialist
              captures: { o50_os1: $.data.order_status, o50_bs1: $.data.billing_status }
            - call: "POST /reference-lab/send-out-orders/${o50_id}/hold"
              payload: {}
              as: ReferenceLabOperations
              captures: { o50_os2: $.data.order_status }
            - call: "POST /reference-lab/send-out-orders/${o50_id}/release-hold"
              payload: {}
              as: LabBillingSpecialist
              captures: { o50_os3: $.data.order_status }
          assert:
            - "the release-time charge already pushed the client over the limit: ClientLaboratory.${c2_id}.status == CREDIT_HOLD because the 1150-cent routed balance exceeds the 1000-cent limit"
            - "after settlement, ClientLaboratory.${c2_id}.status == ACTIVE"
            - "SendOutOrder.${o50_id}.order_status == SUBMITTED after the first release-hold, then ON_HOLD after the hold, then SUBMITTED again after the second release-hold"
            - "SendOutOrder.${o50_id}.billing_status == BILLED while order_status == SUBMITTED, so the two dimensions are independent"
            - "order_status occupies SUBMITTED, ON_HOLD, SUBMITTED, ON_HOLD, SUBMITTED across this recipe and never reaches ACCESSIONED, so it is a cycle rather than a one-way pipeline"

      # -----------------------------------------------------------------------
      - name: interface_message_retry_cycle_and_backoff_cap
        grounds:
          - state_machines.ResultInterfaceMessage.VALIDATED_to_FAILED
          - state_machines.ResultInterfaceMessage.FAILED_to_VALIDATED
          - calculations.interface_retry_backoff
          - entities.ResultInterfaceMessage.fields.retry_count
          - entities.ResultInterfaceMessage.fields.next_retry_offset_minutes
        distinguishing_aspect: |
          ResultInterfaceMessage runs a genuine FAILED -> VALIDATED -> FAILED cycle on a
          different entity from SendOutOrder, and each lap recomputes a backoff that only
          saturates at the cap: retry_count 1, 2, 3, 4 give 10, 20, 40, 60 minutes of offset,
          so the cycle is revisitable four times without leaving FAILED permanently.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T07:00:00Z. One ACTIVE client with a certified dual-direction build and one released order, so a RESULT message can be queued and validated."
          setup_api_calls:
            - *clk
            - *c1
            - *t1
            - *t1p
            - *ib
            - *ibs
            - *ibc
            - *c1v
            - *cr
            - *pr
            - *act
            - *spec1
            - *ord1
            - *run1
            - *acc1
            - *oadm1
            - *beg1
            - *o1ver
            - *ent1
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: ReferenceLabOperations
            - call: "POST /reference-lab/send-out-orders/${o1_id}/release-results"
              payload: { interpretive_comment: "Ferritin within reference interval." }
              as: Pathologist
              captures: { o1_vrel: $.data.version }
            - &qmsg
              call: "POST /reference-lab/result-interface-messages"
              payload: { send_out_order_id: "${o1_id}", interface_build_id: "${ib_id}", message_type: "RESULT", control_id: "CTL-9001", expected_send_out_order_version: "${o1_vrel}" }
              as: InterfaceAnalyst
              captures: { msg_id: $.data.id }
            - call: "POST /reference-lab/result-interface-messages/${msg_id}/validate"
              payload: {}
              as: InterfaceAnalyst
          trigger:
            - call: "POST /reference-lab/result-interface-messages/${msg_id}/fail"
              payload: {}
              as: InterfaceAnalyst
              captures: { m_rc1: $.data.retry_count, m_bo1: $.data.next_retry_offset_minutes }
            - call: "POST /reference-lab/result-interface-messages/${msg_id}/validate"
              payload: {}
              as: InterfaceAnalyst
            - call: "POST /reference-lab/result-interface-messages/${msg_id}/fail"
              payload: {}
              as: InterfaceAnalyst
              captures: { m_rc2: $.data.retry_count, m_bo2: $.data.next_retry_offset_minutes }
            - call: "POST /reference-lab/result-interface-messages/${msg_id}/validate"
              payload: {}
              as: InterfaceAnalyst
            - call: "POST /reference-lab/result-interface-messages/${msg_id}/fail"
              payload: {}
              as: InterfaceAnalyst
              captures: { m_rc3: $.data.retry_count, m_bo3: $.data.next_retry_offset_minutes }
            - call: "POST /reference-lab/result-interface-messages/${msg_id}/validate"
              payload: {}
              as: InterfaceAnalyst
            - call: "POST /reference-lab/result-interface-messages/${msg_id}/fail"
              payload: {}
              as: InterfaceAnalyst
              captures: { m_rc4: $.data.retry_count, m_bo4: $.data.next_retry_offset_minutes }
          assert:
            - "after the first failure ResultInterfaceMessage.${msg_id}.retry_count == 1 and next_retry_offset_minutes == 10"
            - "after the second failure retry_count == 2 and next_retry_offset_minutes == 20"
            - "after the third failure retry_count == 3 and next_retry_offset_minutes == 40"
            - "after the fourth failure retry_count == 4 and next_retry_offset_minutes == 60, where the 60-minute cap binds instead of the 80 that 5 * 2^4 would give"
            - "the message returns to VALIDATED between every pair of failures, so status visited FAILED, VALIDATED, FAILED, VALIDATED, FAILED, VALIDATED, FAILED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      # -----------------------------------------------------------------------
      - name: catalog_withdrawal_five_hop_cascade_to_the_client_ledger
        grounds:
          - state_machines.TestCatalogEntry.PUBLISHED_to_WITHDRAWN
          - state_machines.Specimen.R_ACCESSIONED_to_R_REJECTED
          - state_machines.SendOutOrder.S_INTERIM_REPORTED_to_S_CANCELLED
          - state_machines.OrderTestLine.PENDING_to_CANCELLED
          - calculations.billing_ledger_net_position
          - calculations.billing_route_attribution
        distinguishing_aspect: |
          The catalog-withdrawal cascade is a real chain of depth 5 — TestCatalogEntry to
          Specimen to SendOutOrder to OrderTestLine to BillingLedger to ClientLaboratory —
          where each hop is caused by the previous hop's mutation rather than by the original
          withdrawal, and the trigger transition is the withdrawal rather than a result release.
        test_recipe:
          setup:
