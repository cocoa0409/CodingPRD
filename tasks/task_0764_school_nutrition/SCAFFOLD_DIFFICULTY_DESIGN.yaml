# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_par_vs_served_on_production_record
        grounds:
          - calculations.production_forecast_par
          - entities.ProductionRecord.fields.forecast_par_qty
          - entities.ProductionRecord.fields.served_qty
          - state_machines.MealTransaction.(create)_to_RECORDED
        distinguishing_aspect: "On the SAME ProductionRecord, forecast_par_qty=round(planned_qty*0.9)=90 (forward projection) diverges from served_qty=1 (chronological actual after one recorded meal) — two variants, different numbers, same row."
        test_recipe:
          setup:
            - "Site with a compliant APPROVED lunch menu and a PREPARED production record (planned_qty=100 -> forecast_par_qty=90); one PAID student with a reimbursable lunch recorded."
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Lincoln", site_code: "LNC-1", negative_balance_allowed: true }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Chicken Patty", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "WG Roll", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Apple", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_ent}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_grn}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_fru}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_milk}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/submit", payload: {}, as: MenuPlanner, as_user_id: "planner_1" }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/approve", payload: {}, as: NutritionDirector, as_user_id: "dir_1" }
            - { call: "POST /nutrition/production-records", payload: { site_id: "${site_id}", menu_cycle_id: "${mc_id}", service_date: "2026-04-15", meal_type: "LUNCH", planned_qty: 100 }, as: CafeteriaManager, captures: { pr_id: "$.data.id", forecast: "$.data.forecast_par_qty" } }
            - { call: "POST /nutrition/production-records/${pr_id}/prepare", payload: { prepared_qty: 100 }, as: CafeteriaManager }
            - { call: "POST /nutrition/students", payload: { site_id: "${site_id}", first_name: "Ann", last_name: "Lee", grade: "GRADES_9_12", eligibility_category: "PAID" }, as: PlatformAdmin, captures: { stu_id: "$.data.id" } }
          trigger:
            - { call: "POST /nutrition/meal-transactions", payload: { site_id: "${site_id}", student_id: "${stu_id}", production_record_id: "${pr_id}", service_date: "2026-04-15", meal_type: "LUNCH", selected_components: ["MEAT_MEAT_ALT","GRAINS","FRUIT"] }, as: POSClerk, captures: { mt_id: "$.data.id" } }
          assert:
            - "ProductionRecord.${pr_id}.forecast_par_qty == 90"
            - "ProductionRecord.${pr_id}.served_qty == 1"
            - "ProductionRecord.${pr_id}.forecast_par_qty != ProductionRecord.${pr_id}.served_qty"

      - name: estimated_vs_final_reimbursement_on_claim
        grounds:
          - calculations.reimbursement_amount
          - entities.ReimbursementClaim.fields.estimated_reimbursement_cents
          - entities.ReimbursementClaim.fields.final_reimbursement_cents
          - state_machines.ReimbursementClaim.SUBMITTED_to_PAID
        distinguishing_aspect: "On the SAME claim, estimated_reimbursement_cents snapshotted at submit (paid_count=1 -> 889) differs from final_reimbursement_cents snapshotted at mark-paid after the PAID meal was voided (paid_count=0 -> 826)."
        test_recipe:
          setup:
            - "Performance-certified site; NSLP rates seeded; one FREE, one REDUCED, one PAID reimbursable lunch in month 2026-04; a DRAFT claim created after all three meals; submitted (estimate), then the PAID meal voided, then marked paid (final)."
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Grant", site_code: "GRT-1", performance_based_certified: true, negative_balance_allowed: true }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/reimbursement-rates", payload: { program: "NSLP", category: "FREE", rate_cents: 425, performance_addon_cents: 8, effective_date: "2025-07-01" }, as: PlatformAdmin }
            - { call: "POST /nutrition/reimbursement-rates", payload: { program: "NSLP", category: "REDUCED", rate_cents: 385, performance_addon_cents: 8, effective_date: "2025-07-01" }, as: PlatformAdmin }
            - { call: "POST /nutrition/reimbursement-rates", payload: { program: "NSLP", category: "PAID", rate_cents: 55, performance_addon_cents: 8, effective_date: "2025-07-01" }, as: PlatformAdmin }
            - { call: "POST /nutrition/food-items", payload: { name: "Chicken Patty", category: "ENTREE", meat_alt_oz_eq: 2.0 }, as: PlatformAdmin, captures: { f_ent: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "WG Roll", category: "GRAIN", grain_oz_eq: 1.0, is_whole_grain_rich: true }, as: PlatformAdmin, captures: { f_grn: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Apple", category: "FRUIT", fruit_cup: 0.75 }, as: PlatformAdmin, captures: { f_fru: "$.data.id" } }
            - { call: "POST /nutrition/food-items", payload: { name: "Milk", category: "MILK" }, as: PlatformAdmin, captures: { f_milk: "$.data.id" } }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_ent}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_grn}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_fru}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/inventory-lots", payload: { site_id: "${site_id}", food_item_id: "${f_milk}", lot_type: "PURCHASED", quantity_received: 1000, received_date: "2026-03-10" }, as: CafeteriaManager }
            - { call: "POST /nutrition/menu-cycles", payload: { site_id: "${site_id}", meal_type: "LUNCH", grade_group: "GRADES_9_12", effective_date: "2026-04-01", end_date: "2026-06-30", components: [ { food_item_id: "${f_ent}", component: "MEAT_MEAT_ALT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_grn}", component: "GRAINS", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_fru}", component: "FRUIT", planned_servings: 1, serving_amount: 1 }, { food_item_id: "${f_milk}", component: "MILK", planned_servings: 1, serving_amount: 1 } ] }, as: MenuPlanner, captures: { mc_id: "$.data.id" } }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/submit", payload: {}, as: MenuPlanner, as_user_id: "planner_1" }
            - { call: "POST /nutrition/menu-cycles/${mc_id}/approve", payload: {}, as: NutritionDirector, as_user_id: "dir_1" }
            - { call: "POST /nutrition/production-records", payload: { site_id: "${site_id}", menu_cycle_id: "${mc_id}", service_date: "2026-04-15", meal_type: "LUNCH", planned_qty: 100 }, as: CafeteriaManager, captures: { pr_id: "$.data.id" } }
            - { call: "POST /nutrition/production-records/${pr_id}/prepare", payload: { prepared_qty: 100 }, as: CafeteriaManager }
            - { call: "POST /nutrition/students", payload: { site_id: "${site_id}", first_name: "Free", last_name: "One", grade: "GRADES_9_12", eligibility_category: "FREE" }, as: PlatformAdmin, captures: { stu_free: "$.data.id" } }
            - { call: "POST /nutrition/students", payload: { site_id: "${site_id}", first_name: "Red", last_name: "Two", grade: "GRADES_9_12", eligibility_category: "REDUCED" }, as: PlatformAdmin, captures: { stu_red: "$.data.id" } }
            - { call: "POST /nutrition/students", payload: { site_id: "${site_id}", first_name: "Paid", last_name: "Three", grade: "GRADES_9_12", eligibility_category: "PAID" }, as: PlatformAdmin, captures: { stu_paid: "$.data.id" } }
            - { call: "POST /nutrition/meal-transactions", payload: { site_id: "${site_id}", student_id: "${stu_free}", production_record_id: "${pr_id}", service_date: "2026-04-15", meal_type: "LUNCH", selected_components: ["MEAT_MEAT_ALT","GRAINS","FRUIT"] }, as: POSClerk }
            - { call: "POST /nutrition/meal-transactions", payload: { site_id: "${site_id}", student_id: "${stu_red}", production_record_id: "${pr_id}", service_date: "2026-04-15", meal_type: "LUNCH", selected_components: ["MEAT_MEAT_ALT","GRAINS","FRUIT"] }, as: POSClerk }
            - { call: "POST /nutrition/meal-transactions", payload: { site_id: "${site_id}", student_id: "${stu_paid}", production_record_id: "${pr_id}", service_date: "2026-04-15", meal_type: "LUNCH", selected_components: ["MEAT_MEAT_ALT","GRAINS","FRUIT"] }, as: POSClerk, captures: { mt_paid: "$.data.id" } }
            - { call: "POST /nutrition/reimbursement-claims", payload: { site_id: "${site_id}", claim_month: "2026-04" }, as: NutritionDirector, as_user_id: "dir_create", captures: { claim_id: "$.data.id", claim_v: "$.data.version" } }
            - { call: "POST /nutrition/reimbursement-claims/${claim_id}/submit", payload: { expected_claim_version: "${claim_v}" }, as: NutritionDirector, as_user_id: "dir_submit", captures: { est: "$.data.estimated_reimbursement_cents" } }
            - { call: "POST /nutrition/meal-transactions/${mt_paid}/void", payload: {}, as: POSClerk }
          trigger:
            - { call: "POST /nutrition/reimbursement-claims/${claim_id}/mark-paid", payload: {}, as: PlatformAdmin, captures: { fin: "$.data.final_reimbursement_cents" } }
          assert:
            - "ReimbursementClaim.${claim_id}.estimated_reimbursement_cents == 889"
            - "ReimbursementClaim.${claim_id}.final_reimbursement_cents == 826"
            - "ReimbursementClaim.${claim_id}.estimated_reimbursement_cents != ReimbursementClaim.${claim_id}.final_reimbursement_cents"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reimbursement_amount_tiered_conditional_addon
        grounds:
          - calculations.reimbursement_amount
          - entities.SchoolSite.fields.performance_based_certified
          - entities.ReimbursementClaim.fields.estimated_reimbursement_cents
        distinguishing_aspect: "Mode (a): >=3 inputs with conditional branching — free/reduced/paid counts each multiplied by a per-category rate PLUS a performance addon applied only because site.performance_based_certified is true: 1*(425+8)+1*(385+8)+1*(55+8)=889 (would be 865 without the flag)."
        test_recipe:
          setup:
            - "Performance-certified site; NSLP rates seeded; exactly one FREE, one REDUCED, one PAID reimbursable lunch in 2026-04; a DRAFT claim created after the meals and submitted."
          setup_api_calls:
            - { call: "POST /nutrition/sites", payload: { name: "Perf", site_code: "PRF-1", performance_based_certified: true, negative_balance_allowed: true }, as: PlatformAdmin, captures: { site_id: "$.data.id" } }
            - { call: "POST /nutrition/reimbursement-rates", payload: { program: "NSLP", category: "FREE", rate_cents: 425, performance_addon_cents: 8, effective_date: "2025-07-01" }, as: PlatformAdmin }
            - { call: "POST /nutrition/reimbursement-rates", payload: { program: "NSLP", category: "REDUCED", rate_cents: 385, performance_addon_cents: 8, effective_date: "2025-07-01" }, as: PlatformAdmin }
