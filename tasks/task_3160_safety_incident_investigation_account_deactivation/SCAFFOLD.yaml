    description: "List accounts, filtered by status, account_type, home_region_code and risk_tier"
    roles: [PlatformAdmin, SafetyInvestigator, SafetyOperationsLead, SafetyAppealReviewer, RegulatorLiaison, BackgroundReviewer]
    code: 200
    input:
      - status?
      - account_type?
      - home_region_code?
      - risk_tier?
      - limit?
      - offset?
    output: Account[]
    side_effects: []

  - method: GET
    path: "/safety/accounts/{id}"
