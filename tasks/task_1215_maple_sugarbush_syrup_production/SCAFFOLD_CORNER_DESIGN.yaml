        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          run_id: $.data.id
      - call: POST /sugarhouse/sap-runs/${run_id}/void
        as: SugarhouseManager
      trigger:
      - call: POST /sugarhouse/sap-runs/${run_id}/confirm
        as: FieldCrew
        as_user_id: ${tapper_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE (HTTP 409); run stays VOIDED
  - name: go_live_with_installing_line_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Sugarbush.TAPPING_to_LIVE
    - errors[ERR_TAP_LINES_NOT_READY]
    distinguishing_aspect: go-live while any non-PULLED line is still INSTALLING -> ERR_TAP_LINES_NOT_READY.
    test_recipe:
      setup:
      - bush TAPPING with one INSTALLING line
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
