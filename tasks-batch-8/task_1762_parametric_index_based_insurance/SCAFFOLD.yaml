# =============================================================================
# PRD Benchmark Scaffold — Parametric & Index-Based Insurance Settlement
# =============================================================================

scenario: |
  Parametric & Index-Based Insurance Settlement (parametric insurance program):
  index/trigger definition & data source agreement, event verification against
  measurement station or model, automatic payout calculation & tiered
  thresholds, basis risk explanation & customer dispute handling, policy
  pricing from historical index distribution, contract wording & regulatory
  classification, rapid payment operations & fraud controls, reporting &
  reinsurance interplay

domain_name: parametric-index-insurance
api_prefix: /programs

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: event_sourcing        # state derived by replaying ordered index observations
  secondary_archetype: pricing_engine      # tiered payout + premium pricing from index distribution
  complexity_layers:
    - optimistic_concurrency               # OCC on InsuranceProgram.version for treaty binding & program retrocession
    - cascading_side_effects               # observation -> trigger event -> claims -> treaty recovery -> program exposure
    - dual_variant_calculation             # provisional (forward-looking) vs final (chronological) payout; gross vs net cession
    - rate_threshold_triggers              # tiered payout thresholds with >= boundary precision
  entity_topology: hierarchical            # Program -> children; cross-cutting FKs between claims and trigger events
  state_machine_shape: compound            # parallel dims on ParametricPolicy + cyclic dispute + branching claim verification
  relationship_patterns:
    - one_to_many
    - cross_aggregate                      # PayoutClaim references TriggerEvent across the policy aggregate
  role_model: segregation_of_duties        # underwriter prices, claims adjuster verifies, treasury pays, actuary files; no overlap
  consistency_model: immediate             # all cascades atomic within the request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: InsuranceProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique business code for the program" }
      - { name: peril_type, type: enum, source: input, description: "RAINFALL_DEFICIT | WINDSPEED | EARTHQUAKE_MAGNITUDE | TEMPERATURE_EXCESS" }
      - { name: regulatory_classification, type: enum, source: input, description: "ADMITTED_INSURANCE | SURPLUS_LINES | DERIVATIVE_CONTRACT — drives wording & reporting obligations" }
      - { name: contract_wording_version, type: string, source: input, description: "Legal wording template identifier bound to the program" }
      - { name: exposure_limit_cents, type: integer, source: input, description: "Maximum aggregate net retained exposure the program may carry" }
      - { name: gross_written_premium_cents, type: integer, source: computed, default: 0, description: "Sum of premium_cents over policies ever BOUND (never decremented)" }
      - { name: incurred_claims_cents, type: integer, source: computed, default: 0, description: "Sum of final_payout_cents over claims in PAID or RECOVERY_CEDED" }
      - { name: ceded_recovery_cents, type: integer, source: computed, default: 0, description: "Sum of ceded amounts recovered from reinsurance treaties" }
      - { name: net_retained_exposure_cents, type: integer, source: computed, default: 0, description: "= sum of sum_insured_cents over policies in BOUND state, minus ceded_percentage share under ACTIVE treaties (rounded half-up per policy)" }
      - { name: fraud_alert_count, type: integer, source: computed, default: 0, description: "Number of claims currently in FRAUD_HOLD within this program" }
      - { name: reporting_epoch, type: integer, source: system, default: 0, description: "Program reporting epoch; incremented by advance-reporting-epoch ops run" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSED" }

  - name: IndexDefinition
    parent: InsuranceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; owning program" }
      - { name: index_code, type: string, source: input, description: "Business code of the index (e.g. REGION7_RAIN_30D)" }
      - { name: measurement_unit, type: string, source: input, description: "Physical unit of the index value (mm, m/s, Mw, degC)" }
      - { name: aggregation_window_days, type: integer, source: input, description: "Length of the rolling measurement window in days" }
      - { name: data_source_agreement_ref, type: string, source: input, description: "Executed data-source agreement reference (legal contract id)" }
      - { name: source_priority_mode, type: enum, source: input, description: "STATION_PRIMARY | MODEL_PRIMARY — which source wins on disagreement" }
      - { name: trigger_thresholds, type: array, source: input, description: "Ordered list of tiers [{tier: 1, threshold_value: number, payout_fraction: number}, ...] ascending by severity distance; payout_fraction in (0,1]" }
      - { name: strike_direction, type: enum, source: input, description: "BELOW | ABOVE — BELOW triggers when index value <= threshold; ABOVE when >= threshold" }
      - { name: historical_breach_frequency, type: number, source: input, description: "Observed historical frequency of tier-1 breach per year from the index distribution (used in pricing)" }
      - { name: expected_loss_ratio, type: number, source: input, description: "Expected loss ratio from the historical index distribution (used in pricing)" }
      - { name: status, type: enum, source: system, description: "PENDING_AGREEMENT | ACTIVE | SUSPENDED | DECOMMISSIONED" }

  - name: MeasurementStation
    parent: InsuranceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; owning program" }
      - { name: station_code, type: string, source: input, description: "Station identifier from the data-source agreement" }
      - { name: station_kind, type: enum, source: input, description: "PHYSICAL_STATION | GRID_MODEL" }
      - { name: reliability_weight, type: number, source: input, description: "Weight in [0.1, 1.0] used in blended index value; model sources typically lower" }
      - { name: status, type: enum, source: system, description: "COMMISSIONED | OFFLINE | DECOMMISSIONED" }

  - name: IndexObservation
    parent: IndexDefinition
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: index_definition_id, type: string, source: system, description: "FK -> IndexDefinition.id; index this observation feeds" }
      - { name: station_id, type: string, source: system, description: "FK -> MeasurementStation.id; station or model that produced the reading" }
      - { name: window_end_date, type: string, source: input, description: "ISO date of the last day of the aggregation window (YYYY-MM-DD)" }
      - { name: measured_value, type: number, source: input, description: "Raw measured value from this station for the window" }
      - { name: sequence_no, type: integer, source: system, description: "Per-index monotonic ingestion sequence, assigned by server in arrival order" }
      - { name: supersedes_observation_id, type: string, source: input, description: "Optional: id of a prior observation this one corrects (late revision)" }
      - { name: is_effective, type: boolean, source: computed, description: "True unless superseded by a later revision for the same (station_id, window_end_date)" }

  - name: Policyholder
    parent: InsuranceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; owning program" }
      - { name: legal_name, type: string, source: input, description: "Policyholder legal name" }
      - { name: tax_id, type: string, source: input, description: "Tax identifier" }
      - { name: basis_risk_disclosure_acknowledged, type: boolean, source: input, default: false, description: "Policyholder acknowledged the basis-risk explanation document" }
      - { name: fraud_score, type: integer, source: computed, default: 0, description: "Cumulative fraud signals; drives automatic FRAUD_HOLD at threshold" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | BLACKLISTED" }

  - name: ParametricPolicy
    parent: Policyholder
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: system, description: "FK -> Policyholder.id; owning policyholder" }
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; denormalized for aggregate queries" }
      - { name: index_definition_id, type: string, source: input, description: "FK -> IndexDefinition.id; index this policy triggers on" }
      - { name: sum_insured_cents, type: integer, source: input, description: "Maximum payout (limit) of the policy" }
      - { name: policy_start_date, type: string, source: input, description: "Coverage start date (YYYY-MM-DD), inclusive" }
      - { name: policy_end_date, type: string, source: input, description: "Coverage end date (YYYY-MM-DD), inclusive; must be > policy_start_date" }
      - { name: premium_cents, type: integer, source: computed, description: "Pure premium loaded for expenses; see premium_pricing calculation" }
      - { name: premium_tax_cents, type: integer, source: computed, description: "Tax on premium; tier depends on program.regulatory_classification" }
      - { name: lifecycle_status, type: enum, source: system, description: "Parallel dimension 1: QUOTED | BOUND | EXPIRED | CANCELLED" }
      - { name: settlement_posture, type: enum, source: system, description: "Parallel dimension 2: CLEAR | PAYMENT_PENDING | SETTLED_QUIET — gates claim operations" }

  - name: TriggerEvent
    parent: IndexDefinition
    common_fields: true
    fields:
      - { name: index_definition_id, type: string, source: system, description: "FK -> IndexDefinition.id; index that fired" }
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; denormalized" }
      - { name: window_end_date, type: string, source: system, description: "Aggregation window end date that breached (copied from decisive observation)" }
      - { name: blended_index_value, type: number, source: computed, description: "Weighted blend of effective observations for the window at verification time" }
      - { name: max_tier_breached, type: integer, source: computed, description: "Highest tier whose threshold is breached by blended_index_value; 0 = none" }
      - { name: verification_method, type: enum, source: computed, description: "STATION_VERIFIED | MODEL_FALLBACK — decided by source_priority_mode and station availability" }
      - { name: status, type: enum, source: system, description: "DETECTED | UNDER_REVIEW | VERIFIED | REJECTED | ANNULLED" }

  - name: PayoutClaim
    parent: ParametricPolicy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> ParametricPolicy.id; policy claiming" }
      - { name: trigger_event_id, type: string, source: system, description: "FK -> TriggerEvent.id; event that generated this claim (cross-aggregate link)" }
      - { name: tier_applied, type: integer, source: computed, description: "Tier used for the payout (from trigger event at generation; re-derived on adjustment)" }
      - { name: provisional_payout_cents, type: integer, source: computed, description: "Forward-looking payout computed at claim generation" }
      - { name: final_payout_cents, type: integer, source: computed, description: "Chronological payout recomputed at payment release; supersedes provisional" }
      - { name: ceded_recovery_cents, type: integer, source: computed, default: 0, description: "Amount ceded to reinsurance treaties for this claim" }
      - { name: net_payment_cents, type: integer, source: computed, description: "= final_payout_cents - ceded_recovery_cents" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the ClaimsAdjuster who approved (recorded at approve; used for SoD check at release-payment)" }
      - { name: status, type: enum, source: system, description: "GENERATED | ADJUSTED | APPROVED | FRAUD_HOLD | PAID | RECOVERY_CEDED | DECLINED | VOIDED" }

  - name: DisputeCase
    parent: PayoutClaim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> PayoutClaim.id; claim under dispute" }
      - { name: opened_by_role, type: string, source: system, description: "Role that opened the dispute (Policyholder via servicing agent)" }
      - { name: dispute_reason, type: enum, source: input, description: "BASIS_RISK_MISMATCH | DATA_SOURCE_ERROR | THRESHOLD_BOUNDARY | LATE_REVISION" }
      - { name: claimed_tier, type: integer, source: input, description: "Tier the policyholder asserts should apply" }
      - { name: resolution, type: enum, source: system, description: "NONE | UPHELD | PARTIAL_UPHELD | DENIED" }
      - { name: adjustment_delta_cents, type: integer, source: computed, default: 0, description: "Signed payout delta applied when dispute resolves UPHELD/PARTIAL_UPHELD" }
      - { name: status, type: enum, source: system, description: "OPEN | AWAITING_CUSTOMER | RESOLVED | WITHDRAWN" }

  - name: ReinsuranceTreaty
    parent: InsuranceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> InsuranceProgram.id; ceding program" }
      - { name: treaty_name, type: string, source: input, description: "Treaty identifier" }
      - { name: ceded_percentage, type: number, source: input, description: "Quota-share percentage in (0, 100] ceded to reinsurer" }
      - { name: attachment_point_cents, type: integer, source: input, description: "Per-event retention: cession applies only to the portion of a claim above this attachment" }
      - { name: treaty_limit_cents, type: integer, source: input, description: "Aggregate cap of recoveries under this treaty" }
      - { name: recovered_to_date_cents, type: integer, source: computed, default: 0, description: "Cumulative recoveries ceded; cannot exceed treaty_limit_cents" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | EXHAUSTED | COMMUTED" }

  - name: PremiumInvoice
    parent: ParametricPolicy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> ParametricPolicy.id; billed policy" }
      - { name: invoice_amount_cents, type: integer, source: computed, description: "= premium_cents + premium_tax_cents, computed at issuance" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative payments applied" }
      - { name: due_date, type: string, source: system, description: "Policy start date; coverage binds only when fully paid by due date" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InsuranceProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{programId}/activate"
        actor: ProgramManager
        preconditions:
          - "At least one IndexDefinition of this program is in ACTIVE status (ERR_PROGRAM_NO_ACTIVE_INDEX)"
          - "contract_wording_version and regulatory_classification are set (validated at creation)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/{programId}/suspend"
        actor: ProgramManager
        preconditions:
          - "Program is ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "All IndexDefinitions of this program in ACTIVE status -> SUSPENDED (cascade down)"
          - "Policy binding and trigger detection halt while suspended"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /programs/{programId}/resume"
        actor: ProgramManager
        preconditions:
          - "Program is SUSPENDED (ERR_PROGRAM_NOT_SUSPENDED)"
        side_effects:
          - "All IndexDefinitions of this program in SUSPENDED status -> ACTIVE (cycle resume)"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /programs/{programId}/close"
        actor: ProgramManager
        preconditions:
          - "No PayoutClaim in this program in GENERATED, ADJUSTED, APPROVED, or FRAUD_HOLD (ERR_OPEN_CLAIMS_EXIST)"
          - "No DisputeCase in this program in OPEN or AWAITING_CUSTOMER (ERR_OPEN_CLAIMS_EXIST)"
        side_effects:
          - "All policies still BOUND -> EXPIRED (cascade down, settlement_posture unchanged)"
          - "All ReinsuranceTreaties in ACTIVE -> COMMUTED"

  - entity: IndexDefinition
    initial_state: PENDING_AGREEMENT
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PENDING_AGREEMENT
        to: ACTIVE
        trigger: "POST /programs/{programId}/index-definitions/{indexId}/activate"
        actor: Actuary
        preconditions:
          - "Index is PENDING_AGREEMENT (ERR_INDEX_NOT_PENDING)"
          - "data_source_agreement_ref is non-empty (validated at creation)"
          - "At least one MeasurementStation of the parent program is COMMISSIONED (ERR_NO_COMMISSIONED_STATION)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade (program suspend) or POST .../index-definitions/{indexId}/suspend"
        actor: ProgramManager
        preconditions:
          - "Index is ACTIVE (ERR_INDEX_NOT_ACTIVE)"
        side_effects:
          - "Observation ingestion on this index is rejected while SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade (program resume) or POST .../index-definitions/{indexId}/resume"
        actor: ProgramManager
        preconditions:
          - "Index is SUSPENDED (ERR_INDEX_NOT_SUSPENDED)"
        side_effects: []

      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST .../index-definitions/{indexId}/decommission"
        actor: Actuary
        preconditions:
          - "No ParametricPolicy referencing this index is BOUND (ERR_INDEX_IN_USE)"
          - "No TriggerEvent of this index is DETECTED or UNDER_REVIEW (ERR_INDEX_IN_USE)"
        side_effects: []

  - entity: MeasurementStation
    initial_state: COMMISSIONED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: COMMISSIONED
        to: OFFLINE
        trigger: "POST /programs/{programId}/stations/{stationId}/take-offline"
        actor: DataOperations
        preconditions:
          - "Station is COMMISSIONED (ERR_STATION_NOT_COMMISSIONED)"
        side_effects:
          - "New observations from this station are rejected while OFFLINE"

      - from: OFFLINE
        to: COMMISSIONED
        trigger: "POST /programs/{programId}/stations/{stationId}/recommission"
        actor: DataOperations
        preconditions:
          - "Station is OFFLINE (ERR_STATION_NOT_OFFLINE)"
        side_effects: []

      - from: COMMISSIONED
        to: DECOMMISSIONED
        trigger: "POST /programs/{programId}/stations/{stationId}/decommission"
        actor: DataOperations
        preconditions:
          - "Station is COMMISSIONED (ERR_STATION_NOT_COMMISSIONED)"
        side_effects: []

      - from: OFFLINE
        to: DECOMMISSIONED
        trigger: "POST /programs/{programId}/stations/{stationId}/decommission"
        actor: DataOperations
        preconditions:
          - "Station is OFFLINE (ERR_STATION_NOT_OFFLINE)"
        side_effects: []

  - entity: Policyholder
    initial_state: PROSPECT
    terminal_states: [BLACKLISTED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "system (automatic when basis_risk_disclosure_acknowledged flips to true via PATCH)"
        actor: ServicingAgent
        preconditions:
          - "basis_risk_disclosure_acknowledged = true (ERR_BASIS_RISK_NOT_ACKNOWLEDGED)"
        side_effects:
          - "status = ACTIVE (policy binding now permitted)"

      - from: ACTIVE
        to: BLACKLISTED
        trigger: "POST /programs/{programId}/policyholders/{holderId}/blacklist"
        actor: FraudAnalyst
        preconditions:
          - "Policyholder is ACTIVE (ERR_HOLDER_NOT_ACTIVE)"
        side_effects:
          - "All claims of this policyholder in GENERATED or ADJUSTED -> VOIDED (cross-entity cascade)"
          - "Claims in APPROVED are unaffected (already committed to treasury)"

      - from: PROSPECT
        to: BLACKLISTED
        trigger: "POST /programs/{programId}/policyholders/{holderId}/blacklist"
        actor: FraudAnalyst
        preconditions:
          - "Policyholder is PROSPECT or ACTIVE (ERR_HOLDER_NOT_ACTIVE)"
        side_effects: []

  - entity: ParametricPolicy
    initial_state: QUOTED
    terminal_states: [EXPIRED, CANCELLED]
    note: "Parallel state dimensions: lifecycle_status and settlement_posture evolve independently. settlement_posture transitions are listed separately below."
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /programs/{programId}/policyholders/{holderId}/policies/{policyId}/bind"
        actor: Underwriter
        preconditions:
          - "Policy lifecycle_status = QUOTED (ERR_POLICY_NOT_QUOTED)"
          - "Policyholder status = ACTIVE (ERR_HOLDER_NOT_ACTIVE_FOR_BIND)"
          - "Parent program status = ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "Referenced IndexDefinition status = ACTIVE (ERR_INDEX_NOT_ACTIVE)"
          - "The policy's PremiumInvoice is PAID (ERR_PREMIUM_NOT_PAID)"
          - "Net retained exposure after binding stays <= exposure_limit_cents (ERR_EXPOSURE_LIMIT_EXCEEDED)"
        side_effects:
          - "lifecycle_status = BOUND"
          - "program.gross_written_premium_cents += premium_cents"
          - "program.net_retained_exposure_cents recomputed (adds retained share of sum_insured_cents)"

      - from: BOUND
        to: EXPIRED
        trigger: "system (automatic at policy_end_date close, or program close cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "lifecycle_status = EXPIRED"
          - "program.net_retained_exposure_cents recomputed (removes retained share)"

      - from: BOUND
        to: CANCELLED
        trigger: "POST .../policies/{policyId}/cancel"
        actor: Underwriter
        preconditions:
          - "lifecycle_status = BOUND (ERR_POLICY_NOT_BOUND)"
          - "settlement_posture != PAYMENT_PENDING (ERR_POLICY_PAYMENT_IN_FLIGHT)"
          - "No claim of this policy in GENERATED, ADJUSTED, APPROVED, FRAUD_HOLD, or PAID (ERR_POLICY_HAS_CLAIMS)"
        side_effects:
          - "lifecycle_status = CANCELLED"
          - "program.net_retained_exposure_cents recomputed (removes retained share)"

  - entity: ParametricPolicy_settlement_posture
    note: "Parallel dimension of ParametricPolicy; machine listed separately for clarity."
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: PAYMENT_PENDING
        trigger: "system (automatic when any PayoutClaim of this policy enters APPROVED or FRAUD_HOLD)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PAYMENT_PENDING
        to: SETTLED_QUIET
        trigger: "system (automatic when all claims of the policy reach a terminal state: PAID, RECOVERY_CEDED, DECLINED, or VOIDED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SETTLED_QUIET
        to: PAYMENT_PENDING
        trigger: "system (automatic when a new claim is GENERATED for this policy — e.g. late event after quiet)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TriggerEvent
    initial_state: DETECTED
    terminal_states: [VERIFIED, REJECTED, ANNULLED]
    transitions:
      - from: DETECTED
        to: UNDER_REVIEW
        trigger: "POST /programs/{programId}/index-definitions/{indexId}/trigger-events/{eventId}/open-review"
        actor: ClaimsAdjuster
        preconditions:
          - "Event is DETECTED (ERR_EVENT_NOT_DETECTED)"
        side_effects:
          - "status = UNDER_REVIEW"

      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST .../trigger-events/{eventId}/verify"
        actor: ClaimsAdjuster
        preconditions:
          - "Event is UNDER_REVIEW (ERR_EVENT_NOT_UNDER_REVIEW)"
          - "blended_index_value recomputed from effective observations still breaches tier >= 1 (ERR_EVENT_NO_LONGER_BREACHING)"
        side_effects:
          - "status = VERIFIED"
          - "blended_index_value and max_tier_breached recomputed (chronological replay of effective observations)"
          - "For every BOUND policy on this index whose coverage window contains window_end_date: generate a PayoutClaim (status GENERATED) — cross-entity cascade, one claim per policy, ordered by policy created_at ASC"
          - "Each generated claim runs the provisional_payout calculation"
          - "Each affected policy settlement_posture -> PAYMENT_PENDING via claim approval path only (claims start GENERATED)"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST .../trigger-events/{eventId}/reject"
        actor: ClaimsAdjuster
        preconditions:
          - "Event is UNDER_REVIEW (ERR_EVENT_NOT_UNDER_REVIEW)"
        side_effects:
          - "status = REJECTED"
          - "No claims are generated"

      - from: VERIFIED
        to: ANNULLED
        trigger: "system (automatic when a late IndexObservation revision flips blended_index_value so max_tier_breached becomes 0)"
        actor: system
        preconditions: []
        side_effects:
          - "status = ANNULLED"
          - "All claims generated from this event still in GENERATED or ADJUSTED -> DECLINED (compensation cascade)"
          - "Claims already APPROVED remain (they must be resolved via dispute, not auto-voided)"
          - "Affected policies' settlement_posture re-evaluated"

  - entity: PayoutClaim
    initial_state: GENERATED
    terminal_states: [PAID, RECOVERY_CEDED, DECLINED, VOIDED]
    transitions:
      - from: GENERATED
        to: ADJUSTED
        trigger: "POST /programs/{programId}/claims/{claimId}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is GENERATED or ADJUSTED (ERR_CLAIM_NOT_ADJUSTABLE)"
          - "Claim's trigger event is VERIFIED (ERR_EVENT_NOT_VERIFIED)"
        side_effects:
          - "tier_applied replaced with the requested tier (must be <= trigger event max_tier_breached)"
          - "provisional_payout_cents recomputed via provisional_payout calculation"
          - "status = ADJUSTED (idempotent loop: ADJUSTED -> ADJUSTED allowed)"

      - from: ADJUSTED
        to: ADJUSTED
        trigger: "POST /programs/{programId}/claims/{claimId}/adjust"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is GENERATED or ADJUSTED (ERR_CLAIM_NOT_ADJUSTABLE)"
        side_effects:
          - "provisional_payout_cents recomputed"

      - from: GENERATED
        to: APPROVED
        trigger: "POST /programs/{programId}/claims/{claimId}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is GENERATED or ADJUSTED (ERR_CLAIM_NOT_ADJUSTABLE)"
          - "Claim's trigger event is VERIFIED (ERR_EVENT_NOT_VERIFIED)"
          - "Policy lifecycle_status = BOUND (ERR_POLICY_NOT_BOUND)"
          - "policyholder.status != BLACKLISTED (ERR_HOLDER_BLACKLISTED)"
          - "policyholder.fraud_score < FRAUD_SCORE_AUTO_HOLD (else claim goes to FRAUD_HOLD instead — see auto-transition)"
        side_effects:
          - "status = APPROVED"
          - "final_payout_cents recomputed via final_payout calculation (chronological variant; may differ from provisional)"
          - "policy settlement_posture -> PAYMENT_PENDING (bubble up)"

      - from: ADJUSTED
        to: APPROVED
        trigger: "POST /programs/{programId}/claims/{claimId}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is GENERATED or ADJUSTED"
          - "Same guard set as GENERATED -> APPROVED"
        side_effects:
          - "Same as GENERATED -> APPROVED"

      - from: GENERATED
        to: FRAUD_HOLD
        trigger: "system (automatic on approve attempt when policyholder.fraud_score >= FRAUD_SCORE_AUTO_HOLD)"
        actor: system
        preconditions:
          - "policyholder.fraud_score >= 70"
        side_effects:
          - "status = FRAUD_HOLD"
          - "program.fraud_alert_count += 1"
          - "policy settlement_posture -> PAYMENT_PENDING"

      - from: FRAUD_HOLD
        to: APPROVED
        trigger: "POST /programs/{programId}/claims/{claimId}/clear-fraud-hold"
        actor: FraudAnalyst
        preconditions:
          - "Claim is FRAUD_HOLD (ERR_CLAIM_NOT_IN_FRAUD_HOLD)"
        side_effects:
          - "status = APPROVED"
          - "program.fraud_alert_count -= 1"
          - "final_payout_cents recomputed via final_payout calculation"

      - from: APPROVED
        to: PAID
        trigger: "POST /programs/{programId}/claims/{claimId}/release-payment"
        actor: TreasuryOfficer
        preconditions:
          - "Claim is APPROVED (ERR_CLAIM_NOT_APPROVED)"
          - "Segregation of duties: release actor's X-User-ID must differ from the adjuster who approved (ERR_SOD_VIOLATION)"
        side_effects:
          - "status = PAID"
          - "program.incurred_claims_cents += final_payout_cents"
          - "Reinsurance cession: for each ACTIVE treaty of the program (ordered by treaty created_at ASC), ceded = min(remaining recoverable, round_half_up(max(0, final_payout_cents - attachment_point_cents) * ceded_percentage / 100)); claim.ceded_recovery_cents = total ceded; claim.net_payment_cents = final - ceded"
          - "If ceded_recovery_cents > 0: claim status becomes RECOVERY_CEDED instead of PAID"
          - "Each treaty: recovered_to_date_cents += its ceded share; treaty hitting treaty_limit_cents exactly -> EXHAUSTED"
          - "program.ceded_recovery_cents += claim.ceded_recovery_cents"
          - "If all claims of the policy now terminal: policy settlement_posture -> SETTLED_QUIET (bubble up)"

      - from: APPROVED
        to: RECOVERY_CEDED
        trigger: "system (same release-payment transition; status lands RECOVERY_CEDED when ceded_recovery_cents > 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: GENERATED
        to: DECLINED
        trigger: "system (trigger event annulment compensation) or POST /programs/{programId}/claims/{claimId}/decline"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is GENERATED or ADJUSTED (ERR_CLAIM_NOT_ADJUSTABLE)"
        side_effects:
          - "status = DECLINED"
          - "If all claims of the policy now terminal: policy settlement_posture -> SETTLED_QUIET"

      - from: ADJUSTED
        to: DECLINED
        trigger: "POST /programs/{programId}/claims/{claimId}/decline or system annulment cascade"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim is GENERATED or ADJUSTED"
        side_effects:
          - "status = DECLINED"
          - "Policy settlement_posture re-evaluated"

      - from: GENERATED
        to: VOIDED
        trigger: "system (policyholder blacklist cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "status = VOIDED"
          - "Policy settlement_posture re-evaluated"

      - from: ADJUSTED
        to: VOIDED
        trigger: "system (policyholder blacklist cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "status = VOIDED"
          - "Policy settlement_posture re-evaluated"

  - entity: DisputeCase
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: AWAITING_CUSTOMER
        trigger: "POST /programs/{programId}/claims/{claimId}/disputes/{disputeId}/request-info"
        actor: ClaimsAdjuster
        preconditions:
          - "Dispute is OPEN (ERR_DISPUTE_NOT_OPEN)"
        side_effects:
          - "status = AWAITING_CUSTOMER"

      - from: AWAITING_CUSTOMER
        to: OPEN
        trigger: "POST /programs/{programId}/claims/{claimId}/disputes/{disputeId}/submit-info"
        actor: ServicingAgent
        preconditions:
          - "Dispute is AWAITING_CUSTOMER (ERR_DISPUTE_NOT_AWAITING)"
        side_effects:
          - "status = OPEN (cycle: OPEN -> AWAITING_CUSTOMER -> OPEN allowed repeatedly)"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /programs/{programId}/claims/{claimId}/disputes/{disputeId}/resolve"
        actor: ClaimsAdjuster
        preconditions:
          - "Dispute is OPEN or AWAITING_CUSTOMER (ERR_DISPUTE_NOT_OPEN)"
          - "resolution input in {UPHELD, PARTIAL_UPHELD, DENIED}"
          - "Claim status is PAID, RECOVERY_CEDED, or DECLINED (disputes adjudicate settled outcomes)"
        side_effects:
          - "status = RESOLVED; resolution recorded"
          - "If UPHELD: adjustment_delta_cents = payout_for_tier(claimed_tier) - final_payout_cents; claim.final_payout_cents += adjustment_delta_cents; program.incurred_claims_cents += adjustment_delta_cents (compensation side effect, signed)"
          - "If PARTIAL_UPHELD: adjustment_delta_cents = round_half_up((payout_for_tier(claimed_tier) - final_payout_cents) / 2); same signed application"
          - "If DENIED: adjustment_delta_cents = 0"
          - "policyholder.fraud_score += 10 when resolution = DENIED and dispute_reason = DATA_SOURCE_ERROR (contagion: frivolous data challenges raise fraud signal)"

      - from: AWAITING_CUSTOMER
        to: RESOLVED
        trigger: "POST /programs/{programId}/claims/{claimId}/disputes/{disputeId}/resolve"
        actor: ClaimsAdjuster
        preconditions:
          - "Dispute is OPEN or AWAITING_CUSTOMER"
        side_effects:
          - "Same as OPEN -> RESOLVED"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /programs/{programId}/claims/{claimId}/disputes/{disputeId}/withdraw"
        actor: ServicingAgent
        preconditions:
          - "Dispute is OPEN or AWAITING_CUSTOMER (ERR_DISPUTE_NOT_OPEN)"
        side_effects:
          - "status = WITHDRAWN; no financial effect"

      - from: AWAITING_CUSTOMER
        to: WITHDRAWN
        trigger: "POST /programs/{programId}/claims/{claimId}/disputes/{disputeId}/withdraw"
        actor: ServicingAgent
        preconditions:
          - "Dispute is OPEN or AWAITING_CUSTOMER"
        side_effects:
          - "status = WITHDRAWN"

  - entity: ReinsuranceTreaty
    initial_state: PROPOSED
    terminal_states: [EXHAUSTED, COMMUTED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /programs/{programId}/treaties/{treatyId}/bind-treaty"
        actor: ProgramManager
        preconditions:
          - "Treaty is PROPOSED (ERR_TREATY_NOT_PROPOSED)"
          - "OCC: expected_program_version must equal program.version (ERR_STALE_VERSION, 412)"
          - "Program is ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "status = ACTIVE"
          - "program.version incremented by 1 (OCC write)"
          - "program.net_retained_exposure_cents recomputed (cession lowers retention)"

      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (automatic when recovered_to_date_cents reaches treaty_limit_cents during a claim cession)"
        actor: system
        preconditions: []
        side_effects:
          - "status = EXHAUSTED (no further cessions)"

      - from: ACTIVE
        to: COMMUTED
        trigger: "system (program close cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PremiumInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /programs/{programId}/invoices/{invoiceId}/payments"
        actor: ServicingAgent
        preconditions:
          - "Invoice is ISSUED or PARTIALLY_PAID (ERR_INVOICE_NOT_PAYABLE)"
          - "payment amount > 0 and amount_paid_cents + amount <= invoice_amount_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "amount_paid_cents += amount; if amount_paid_cents == invoice_amount_cents status = PAID else PARTIALLY_PAID"

      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /programs/{programId}/invoices/{invoiceId}/payments"
        actor: ServicingAgent
        preconditions:
          - "Invoice is ISSUED or PARTIALLY_PAID"
        side_effects:
          - "amount_paid_cents += amount"

      - from: ISSUED
        to: PAID
        trigger: "POST /programs/{programId}/invoices/{invoiceId}/payments (single full payment)"
        actor: ServicingAgent
        preconditions:
          - "Invoice is ISSUED or PARTIALLY_PAID"
        side_effects:
          - "amount_paid_cents = invoice_amount_cents"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /programs/{programId}/invoices/{invoiceId}/payments"
        actor: ServicingAgent
        preconditions:
          - "Invoice is ISSUED or PARTIALLY_PAID"
        side_effects:
          - "amount_paid_cents = invoice_amount_cents"

      - from: ISSUED
        to: VOID
        trigger: "system (policy cancellation before binding)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: treaty-bind-stale-program
    parent_entity: InsuranceProgram
    write_endpoint: "POST /programs/{programId}/treaties/{treatyId}/bind-treaty"
    occ_field: "expected_program_version"
    description: |
      Binding a treaty against an InsuranceProgram whose version has advanced
      since the client last observed it is rejected. Another writer may have
      just bound a different treaty (legitimately superseding the retention
      profile the current writer priced against); the writer's view of
      net_retained_exposure_cents is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: program-close-stale-program
    parent_entity: InsuranceProgram
    write_endpoint: "POST /programs/{programId}/close"
    occ_field: "expected_program_version"
    description: |
      Closing a program against a stale observed version is rejected. Any
      mutation that advanced program.version since the client's last read
      (a bind, a payment release, an epoch advance) invalidates the basis on
      which the close preconditions were checked.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: blended_index_value
    trigger: "trigger event verification, and re-verification on late observation revision"
    algorithm: weighted_scoring
    formula: |
      Let S = set of IndexObservation rows where index_definition_id = this index,
        window_end_date = event.window_end_date, is_effective = true.
      If S is empty: blend fails (ERR_EVENT_NO_LONGER_BREACHING at verify).
      weighted_sum = sum over S of (measured_value * station.reliability_weight)
      weight_total = sum over S of station.reliability_weight
      blended = round(weighted_sum / weight_total, 4)   # round_half_up at 4 dp
      Source-mode override: if source_priority_mode = STATION_PRIMARY and at least
        one observation in S comes from a PHYSICAL_STATION, exclude GRID_MODEL rows
        before blending. Symmetrically for MODEL_PRIMARY.
    input_set: "Effective observations for the (index, window_end_date) pair; station reliability weights; source priority mode filter"
    constants:
      BLEND_PRECISION_DP: 4
    precision: "4 decimal places, round_half_up"

  - name: max_tier_breached
    trigger: "with blended_index_value, whenever it recomputes"
    algorithm: threshold
    formula: |
      For strike_direction = BELOW: tier t breaches iff blended <= trigger_thresholds[t].threshold_value
      For strike_direction = ABOVE: tier t breaches iff blended >= trigger_thresholds[t].threshold_value
      max_tier_breached = highest t that breaches; 0 if none.
      Boundary precision: comparisons are INCLUSIVE (<= / >=) — a value exactly at the
      threshold breaches the tier.
    input_set: "blended_index_value and the index's trigger_thresholds ordered list"
    precision: "tier is an integer; boundary comparison inclusive"

  - name: provisional_payout
    trigger: "claim generation at event verification; claim adjust"
    algorithm: tiered_pricing
    formula: |
      provisional_payout_cents = round_half_up(sum_insured_cents * trigger_thresholds[tier_applied].payout_fraction)
      tier_applied defaults to trigger event max_tier_breached; adjust may lower it.
      This variant is FORWARD-LOOKING: it uses the tier assignment only, with no
      regard to other claims of the same policy in the same coverage year.
    input_set: "Policy sum_insured_cents, index trigger_thresholds, tier_applied"
    precision: "integer cents, round_half_up"
    variants:
      - name: forward_looking
        when: "claim generation and adjustment (provisional)"
        difference: "Ignores aggregate-per-policy-year cap; uses tier fraction directly"

  - name: final_payout
    trigger: "claim approval (and fraud-hold clearance)"
    algorithm: chronological
    formula: |
      CHRONOLOGICAL variant with per-policy-year aggregate cap:
      1. Let prior = sum of final_payout_cents of this policy's claims in PAID,
         RECOVERY_CEDED, or APPROVED status with the same coverage-year as this
         claim's trigger event window_end_date (coverage-year = calendar year of
         window_end_date).
      2. uncapped = round_half_up(sum_insured_cents * payout_fraction of tier_applied)
      3. final_payout_cents = min(uncapped, max(0, sum_insured_cents - prior))
      Two valid interpretations diverge: provisional (forward-looking, uncapped)
      vs final (chronological, capped). The scaffold PINS the chronological
      capped variant for APPROVED claims and the forward-looking uncapped
      variant for GENERATED/ADJUSTED claims.
    input_set: "Policy claims in APPROVED/PAID/RECOVERY_CEDED for the same coverage year, tier fraction, sum insured"
    precision: "integer cents, round_half_up"
    variants:
      - name: chronological_capped
        when: "claim approval / payment release"
        difference: "Applies the per-year aggregate cap: cumulative payouts to one policy within a coverage year never exceed sum_insured_cents"

  - name: premium_pricing
    trigger: "policy quotation (creation)"
    algorithm: tiered_pricing
    formula: |
      Pure premium = sum_insured_cents * historical_breach_frequency * expected_loss_ratio
      Expense loading depends on program.regulatory_classification (mode (a) branch):
        ADMITTED_INSURANCE:  loading_pct = 0.25, tax_pct = 0.02
        SURPLUS_LINES:       loading_pct = 0.35, tax_pct = 0.05
        DERIVATIVE_CONTRACT: loading_pct = 0.15, tax_pct = 0.00
      premium_cents = round_half_up(pure_premium * (1 + loading_pct))
      premium_tax_cents = round_half_up(premium_cents * tax_pct)
      Evaluation order pinned: compute pure premium from the index distribution
      FIRST, then loading, then tax on the loaded premium (not on pure).
    input_set: "sum_insured_cents, index historical_breach_frequency, index expected_loss_ratio, program regulatory_classification"
    constants:
      LOADING_ADMITTED: 0.25
      LOADING_SURPLUS: 0.35
      LOADING_DERIVATIVE: 0.15
      TAX_ADMITTED: 0.02
      TAX_SURPLUS: 0.05
      TAX_DERIVATIVE: 0.00
    precision: "integer cents, round_half_up; loading applied to pure premium before tax"

  - name: cession_allocation
    trigger: "payment release (claim APPROVED -> PAID/RECOVERY_CEDED)"
    algorithm: waterfall_allocation
    formula: |
      Treaties processed in created_at ASC order (tie impossible: creation is
      sequential and timestamps distinct; if a tie somehow occurs, break by
      created_at ASC only — never by id).
      For each ACTIVE treaty T:
        excess_over_attachment = max(0, final_payout_cents - T.attachment_point_cents)
        gross_cede = round_half_up(excess_over_attachment * T.ceded_percentage / 100)
        room = T.treaty_limit_cents - T.recovered_to_date_cents
        cede_T = min(gross_cede, max(0, room))
        T.recovered_to_date_cents += cede_T
        if T.recovered_to_date_cents == T.treaty_limit_cents: T -> EXHAUSTED
      claim.ceded_recovery_cents = sum of cede_T over all ACTIVE treaties
      claim.net_payment_cents = final_payout_cents - claim.ceded_recovery_cents
      Rounding order pinned: round per-treaty THEN sum (not sum-then-round).
    input_set: "Claim final_payout_cents; program treaties in ACTIVE status ordered by created_at ASC"
    precision: "integer cents; round_half_up per treaty before summing"

  - name: net_retained_exposure
    trigger: "policy bind/cancel/expire; treaty bind"
    algorithm: aggregation
    formula: |
      retained = 0
      For each ParametricPolicy with lifecycle_status = BOUND in this program
      (ordered by created_at ASC for determinism):
        ceded_share = round_half_up(sum_insured_cents * total_active_ceded_pct / 100)
        retained += (sum_insured_cents - ceded_share)
      where total_active_ceded_pct = min(100, sum of ceded_percentage over ACTIVE treaties)
      program.net_retained_exposure_cents = retained
    input_set: "Policies with lifecycle_status = BOUND; ACTIVE treaties of the program"
    precision: "integer cents; per-policy ceded share rounded half-up before summing"

  - name: fraud_score_contagion
    trigger: "dispute resolved DENIED with reason DATA_SOURCE_ERROR; manual fraud flag"
    algorithm: aggregation
    formula: |
      policyholder.fraud_score starts at 0.
      +10 on each DENIED dispute with dispute_reason = DATA_SOURCE_ERROR
      +25 on manual flag (POST .../policyholders/{id}/flag-fraud)
      Floor 0, ceiling 100 (clamped).
      If fraud_score >= FRAUD_SCORE_AUTO_HOLD (70): subsequent approve attempts
      on this policyholder's claims route to FRAUD_HOLD instead of APPROVED.
    input_set: "Policyholder dispute history and manual flags"
    constants:
      FRAUD_SCORE_AUTO_HOLD: 70
      DENIED_DATA_SOURCE_PENALTY: 10
      MANUAL_FLAG_PENALTY: 25
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "integer, clamped [0,100]"

  - name: dispute_adjustment
    trigger: "dispute resolution UPHELD or PARTIAL_UPHELD"
    algorithm: threshold
    formula: |
      target = payout_for_tier(claimed_tier) = round_half_up(sum_insured_cents * payout_fraction of claimed_tier)
      claimed_tier must be >= 1, <= the claim's trigger event max_tier_breached,
      and != claim.tier_applied (any violation -> ERR_TIER_EXCEEDS_BREACH).
      UPHELD:         adjustment_delta_cents = target - claim.final_payout_cents
      PARTIAL_UPHELD: adjustment_delta_cents = round_half_up((target - claim.final_payout_cents) / 2)
      DENIED:         0
      The signed delta applies to claim.final_payout_cents and
      program.incurred_claims_cents. Cession is NOT re-run on adjustment;
      net_payment_cents is recomputed as final_payout_cents - ceded_recovery_cents.
    input_set: "Claim, its trigger event max_tier_breached, index trigger_thresholds, claimed_tier, resolution"
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist and nest correctly (program -> index/station/holder/policy/claim/invoice/treaty), validated left-to-right"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "Parent InsuranceProgram status permits the operation (binding/observation/trigger flows require ACTIVE)"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "policy bind, observation ingestion, treaty bind"

  - priority: 5
    category: state
    check: "Target entity is in the required state for the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: release-payment actor's X-User-ID differs from the approving adjuster's recorded approver id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /programs/{programId}/claims/{claimId}/release-payment"

  - priority: 7
    category: business_referential
    check: "Referenced entities exist and are linkable (index belongs to program, station belongs to program, claim belongs to policy of holder of program)"
    error_id: ERR_CROSS_REFERENCE_INVALID
    http_status: 422
    applies_to: "policy creation, observation ingestion, claim generation"

  - priority: 8
    category: business_temporal
    check: "Policy coverage window contains the trigger event window_end_date; observation window_end_date not in the future relative to logical clock"
    error_id: ERR_WINDOW_OUT_OF_COVERAGE
    http_status: 422
    applies_to: "claim generation (system), observation ingestion"

  - priority: 9
    category: business_temporal
    check: "Observation dedupe/revision: a second observation for (station_id, window_end_date) must carry supersedes_observation_id of the prior effective row, else rejected"
    error_id: ERR_DUPLICATE_OBSERVATION
    http_status: 409
    applies_to: "POST /programs/{programId}/index-definitions/{indexId}/observations"

  - priority: 10
    category: business_constraint
    check: "Trigger event verification still breaches tier >= 1 after recomputing the blend (late revisions may have moved the index)"
    error_id: ERR_EVENT_NO_LONGER_BREACHING
    http_status: 409
    applies_to: "trigger event verify"

  - priority: 11
    category: business_constraint
    check: "Claim adjust/dispute claimed tier must be >= 1, <= event max_tier_breached, and != current tier_applied"
    error_id: ERR_TIER_EXCEEDS_BREACH
    http_status: 422
    applies_to: "claim adjust, dispute resolve"

  - priority: 12
    category: business_constraint
    check: "Treaty capacity: cession allocation never exceeds treaty_limit_cents; treaty binds only with ceded_percentage in (0,100]"
    error_id: ERR_TREATY_CAPACITY_INVALID
    http_status: 422
    applies_to: "treaty creation, payment release"

  - priority: 13
    category: business_fiscal
    check: "Aggregate exposure: binding the policy would keep net_retained_exposure_cents <= exposure_limit_cents"
    error_id: ERR_EXPOSURE_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "policy bind"

  - priority: 14
    category: business_fiscal
    check: "Premium invoice must be fully paid before bind; payments never exceed invoice_amount_cents"
    error_id: ERR_PREMIUM_NOT_PAID
    http_status: 402
    applies_to: "policy bind; invoice payments (overpayment -> ERR_OVERPAYMENT)"

  - priority: 15
    category: business_safety
    check: "Fraud gate: approve attempt with policyholder.fraud_score >= 70 routes to FRAUD_HOLD; blacklisted holder blocks approve outright"
    error_id: ERR_HOLDER_BLACKLISTED
    http_status: 403
    applies_to: "claim approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time."
    roles: [ProgramManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; expiry sweeps (policy_end_date) run on read"]

  # --- InsuranceProgram ---
  - method: POST
    path: "/programs"
    description: "Create an insurance program"
