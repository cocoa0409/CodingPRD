        distinguishing_aspect: "Replacing a single-source plan with a 60/40 two-source plan RELEASES the original allocation with release_reason PLAN_SUPERSEDED and zeroed amounts, and creates two PROPOSED rows with plan_sequence 1 and 2 that split 300000 into 180000 and 120000 at submit."
