          trigger:
            - call: "POST /installer-assignments"
              payload: { project_id: "${p2_id}", installer_id: "${inst_id}", window_start: "2026-08-25T17:29:00.000Z", window_end: "2026-08-25T21:29:00.000Z", expected_project_version: "${p2_version}" }
              as: ProjectCoordinator
            - call: "POST /installer-assignments"
              payload: { project_id: "${p2_id}", installer_id: "${inst_id}", window_start: "2026-08-25T17:30:00.000Z", window_end: "2026-08-25T21:30:00.000Z", expected_project_version: "${p2_version}" }
              as: ProjectCoordinator
              captures: { a2_id: $.data.id }
          assert:
            - "First attempt: HTTP 409 ERR_INSTALLER_WINDOW_CONFLICT — 17:29 is inside A1's buffered end of 17:30"
            - "After the refusal, Installer.${inst_id}.committed_minutes == 480 and Project.${p2_id}.version == ${p2_version}"
            - "Second attempt succeeds: InstallerAssignment.${a2_id}.status == HELD AND duration_minutes == 240"
            - "Installer.${inst_id}.committed_minutes == 720 (480 + 240), still far under MAX_COMMITTED_MINUTES 4800"
            - "InstallerAssignment.${a1_id}.status == CONFIRMED and window_end is unchanged at 2026-08-25T16:00:00.000Z"
            - "Project.${p2_id}.fulfillment_status == SCHEDULED and Project.${p1_id}.fulfillment_status == SCHEDULED"

      - name: jurisdiction_inspection_slots_are_closed_intervals_counted_in_aggregate
        grounds:
          - validations[priority 27].ERR_INSPECTION_CAPACITY_FULL
          - entities.Jurisdiction.fields.max_concurrent_inspections
          - entities.Project.fields.inspection_slot_start
          - state_machines.Project.permit_status.ISSUED_to_INSPECTION_SCHEDULED
          - endpoints[POST /projects/{id}/inspection-slot]
        distinguishing_aspect: |
          A DIFFERENT resource entity — the Jurisdiction — with DIFFERENT interval
          semantics: CLOSED intervals [inspection_slot_start,
          inspection_slot_end] counted in AGGREGATE against
          max_concurrent_inspections 2, with no travel buffer and no pairwise
          rule. A requested slot starting exactly at another project's
          inspection_slot_end still intersects it (closed bound), which pushes the
          intersecting count to 2 and fails; one second later it intersects only
          one project and succeeds. The installer overlap instance would accept
          both, because it uses half-open bounds and a pairwise test.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z, so slot_start must be at least 2026-08-04T00:00:00.000Z (inspection_lead_days 3, inclusive)."
