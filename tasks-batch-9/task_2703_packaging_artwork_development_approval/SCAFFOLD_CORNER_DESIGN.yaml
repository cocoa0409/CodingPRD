            - call: "GET /marketing-claims"
              payload: {claim_code: "NAS-01", market_code: "US", legal_status: "CLEARED"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
          assert:
            - "the first GET /artwork-versions/${v1_id} returns 200 with approved_at == 2026-08-01T00:00:00Z, requires_reverification == false and pinned_claim_snapshot of length 2 in claim_ids order: entry 0 { marketing_claim_id: ${claim1}, claim_code: NAS-01, cleared_until_utc: 2026-08-15T00:00:00Z } and entry 1 { marketing_claim_id: ${claim2}, claim_code: GF-02, cleared_until_utc: 2026-12-31T00:00:00Z }"
            - "with the clock at 2026-08-20T00:00:00Z the first release-to-print returns 422 ERR_CLAIM_CLEARANCE_EXPIRED per validations[priority=39] - one expired snapshot entry is enough, GF-02 being valid does not save it, and it is NOT 409 ERR_VERSION_STATE_INVALID or 422 ERR_PROOF_NOT_APPROVED"
            - "the withdrawal returns 200 with legal_status == REJECTED on ${claim1} while cleared_from_utc and cleared_until_utc are retained for audit"
            - "the fresh NAS-01/US claim is created and cleared for [2026-08-15, 2026-12-31) with 200 and no ERR_CLAIM_CLEARANCE_OVERLAP, because overlap detection only sees legal_status == CLEARED rows and ${claim1} is now REJECTED"
            - "the second GET /artwork-versions/${v1_id} returns a pinned_claim_snapshot that is byte-identical to the first: still ${claim1} / NAS-01 / 2026-08-15T00:00:00Z at index 0, never repointed at ${claim3} and never refreshed to 2026-12-31T00:00:00Z"
            - "the second release-to-print returns 422 ERR_CLAIM_CLEARANCE_EXPIRED again, so a newly cleared claim of the same code and market does not unblock a version pinned to the old one - the artwork must go through a new version and a new approval"
            - "GET /marketing-claims?claim_code=NAS-01&market_code=US&legal_status=CLEARED returns exactly 1 row, ${claim3}, which confirms the live library really would have satisfied a code-based lookup"
            - "v1 is still APPROVED with released_at == null after both refusals"

      - name: cascading_side_effects_layer_chain_ordering_and_partial_failure
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - entities.ArtworkAsset.fields.current_approved_version_id
          - entities.ArtworkAsset.fields.obsolescence_state
          - endpoints[POST /review-tasks/{id}/decision]
          - state_machines.ArtworkVersion.APPROVED_to_OBSOLETE_PENDING
        excluded_because:
          difficulty_instance: transitive_cascade / approval_cascade_supersedes_prior_version_and_autocancels_plate_orders
          rationale: "That instance walks the full four-link approval cascade end to end from a single decision call - route COMPLETE_APPROVED -> version APPROVED -> asset SUPERSEDE_PENDING and repointed current_approved_version_id -> prior version OBSOLETE_PENDING with its open plate orders auto-cancelled and the committed ledger debited - asserting link ordering and the ledger effects of the partial-failure branch. A separate corner instance would restate the same chain with no new failure mode."

      - name: dual_variant_calculation_layer_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.cost_recovery_amount.variants.PROVISIONAL
          - calculations.cost_recovery_amount.variants.FINAL
          - entities.ErrorEscape.fields.recovery_variance_cents
          - entities.ErrorEscape.fields.final_recovery_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / recovery_provisional_vs_final_diverge_on_per_line_rounding
          rationale: "That instance computes both variants of cost_recovery_amount over one escape and asserts the delta on the switch directly as recovery_variance_cents == final_recovery_cents - provisional_recovery_cents, including the case where per-line rounding makes the two variants disagree by more than the invoice difference. The runout FORWARD_LOOKING / CHRONOLOGICAL pair is covered the same way by dual_variant_calc / runout_forward_looking_vs_chronological_date_divergence, so the layer needs no further corner instance."

  # ==========================================================================
  # §1.9 breadth walk, section 9 of 9: the declared consistency model of §1.0 is
  # immediate, whose guide claim is that all changes are visible in the same
  # request's response. One instance suffices, but it is deliberately routed
  # through the deepest same-request chain in the scaffold - a verification run,
  # a submit that creates a route and advances it in one request, and the
  # approval cascade that fires off a ReviewTask write - and it closes with a
  # repeat read to forbid eventual convergence.
  # ==========================================================================
  - section: consistency_model
    instances:

      - name: every_write_response_already_carries_its_own_derived_and_cascaded_values
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - endpoints[POST /artwork-versions/{id}/verify-elements]
          - endpoints[POST /artwork-versions/{id}/submit]
          - endpoints[POST /review-tasks/{id}/decision]
          - endpoints[GET /element-checks]
          - endpoints[GET /element-checks/{id}]
          - endpoints[GET /review-routes/{id}]
          - entities.ArtworkVersion.fields.compliance_score
          - entities.ArtworkVersion.fields.check_run_no
          - entities.ArtworkVersion.fields.route_count
          - entities.ArtworkVersion.fields.pinned_claim_snapshot
          - entities.ArtworkAsset.fields.current_approved_version_id
          - entities.ReviewRoute.fields.current_stage_no
          - state_machines.ReviewRoute.PENDING_to_IN_PROGRESS
          - state_machines.ArtworkVersion.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The declared consistency model is immediate, and this walks the three places
          where a lazy implementation would be tempted to defer work: the verification
          run (compliance_score must already be in the POST's own response body, not
          only on the next GET), the submit (the route and its four tasks must exist
          AND the route must already be IN_PROGRESS rather than PENDING, because the
          PENDING -> IN_PROGRESS hop is declared to happen inside the same request),
          and the final QUALITY decision (whose response is a ReviewTask, so the whole
          approval cascade must nonetheless be visible to the very next read with no
          retry, no polling and no second write to nudge it). The closing repeat of the
          same three GETs is the anti-convergence check: an eventually-consistent
          implementation that settles between reads would return different bodies the
          second time, which is a failure here rather than a success.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; brief SKU-1001 APPROVED."
            - "One US CARTON asset with one DRAFT version v1 carrying all seven mandatory elements correct and no claim_ids, so the pinned snapshot at approval must be the empty array rather than null."
            - "No prior approved version exists on the asset, so the cascade repoints current_approved_version_id from null and leaves the asset ACTIVE instead of SUPERSEDE_PENDING."
            - "Nothing in the trigger sequence sleeps, retries or re-issues a write to force convergence: each assertion is made on the first response that could carry the value."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: {decision: "APPROVED", review_note: "Scheme and net contents confirmed."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial launch artwork for the US carton."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
          trigger:
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: {verification_note: "Mandatory element verification run."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /artwork-versions/${v1_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /element-checks"
              payload: {artwork_version_id: "${v1_id}"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { first_check: "$.data[0].id" }
            - call: "GET /element-checks/${first_check}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-versions/${v1_id}/submit"
              payload: {submit_note: "Route through brand, regulatory, legal and quality."}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-routes"
              payload: {artwork_version_id: "${v1_id}", status: "IN_PROGRESS"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { r_1: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "BRAND"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_brand: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "REGULATORY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_reg: "$.data[0].id" }
            - call: "POST /review-tasks/${t_1_brand}/decision"
              payload: {decision: "APPROVED", comment: "Brand identity approved."}
              as: BrandReviewer
              as_user_id: "u_brand"
            - call: "POST /review-tasks/${t_1_reg}/decision"
              payload: {decision: "APPROVED", comment: "Regulatory copy approved."}
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "LEGAL"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_legal: "$.data[0].id" }
            - call: "POST /review-tasks/${t_1_legal}/decision"
              payload: {decision: "APPROVED", comment: "No legal exposure."}
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_1}", discipline: "QUALITY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_1_qa: "$.data[0].id" }
            - call: "POST /review-tasks/${t_1_qa}/decision"
              payload: {decision: "APPROVED", comment: "Quality sign-off."}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "GET /review-routes/${r_1}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /artwork-versions/${v1_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /artwork-assets/${asset_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-routes/${r_1}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /artwork-versions/${v1_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /artwork-assets/${asset_id}"
              payload: {}
              as: PackagingCoordinator
              as_user_id: "u_coord"
          assert:
            - "the verify-elements response itself (not a follow-up GET) already carries state == ELEMENTS_VERIFIED, check_run_no == 1, compliance_score == 100.0, failed_element_count == 0 and waived_element_count == 0"
            - "the immediately following GET /artwork-versions/${v1_id} returns exactly the same state, check_run_no, compliance_score and version as the verify-elements response body - read-your-writes with no lag"
            - "GET /element-checks?artwork_version_id=${v1_id} returns total_count == 7 with every row result == PASS and check_run_no == 1, all written inside the verify-elements request"
            - "the row captured from that list is immediately addressable on its own: GET /element-checks/${first_check} returns 200 for the NET_CONTENTS row of check_run_no 1 with result == PASS, deduction_points == 0 and waived_by_user_id == null"
            - "the submit response itself already carries state == IN_REVIEW and route_count == 1"
            - "GET /review-routes?artwork_version_id=${v1_id}&status=IN_PROGRESS returns exactly 1 row in the same breath, so the route was created AND advanced PENDING -> IN_PROGRESS within the submit request; a route still reported as PENDING is a failure"
            - "GET /review-tasks?review_route_id=${r_1} straight after submit returns total_count == 4 with BRAND and REGULATORY at stage_no 1 is_active true and LEGAL and QUALITY is_active false"
            - "after the two stage-1 decisions the same list call shows LEGAL is_active true and current_stage_no == 2 on the route without any further write - the stage advance is part of the second decision's own request"
            - "GET /review-routes/${r_1} right after the QUALITY decision returns status == COMPLETE_APPROVED with current_stage_no == 3 and conditional_count == 0"
            - "GET /artwork-versions/${v1_id} right after the QUALITY decision returns state == APPROVED, approved_at == 2026-08-01T00:00:00Z, requires_reverification == false and pinned_claim_snapshot == [] - the cascade is complete on the first read"
            - "GET /artwork-assets/${asset_id} right after it returns current_approved_version_id == ${v1_id} and obsolescence_state == ACTIVE"
            - "the second round of the same three GETs returns bodies identical to the first round field for field, including every version number and updated_at: reads are side-effect free and nothing converges after the fact"
