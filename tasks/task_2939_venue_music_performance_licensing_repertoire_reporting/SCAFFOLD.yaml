# =============================================================================
# Venue Music Performance Licensing & Repertoire Reporting — seed tables (v1)
# =============================================================================

scenario: |
  Venue music performance licensing and repertoire reporting platform for
  performing-rights organisations (BMI / ASCAP / SESAC / GMR) and the venues
  they license. The system covers: license type selection driven by venue
  category, fire-code occupancy and music-use profile; annual fee calculation
  from seating and standing occupancy, cover-charge revenue and live-versus-
  recorded use; multi-society coverage requirements with covered-repertoire
  share tracking and gap risk arising from performances of unlicensed
  repertoire; setlist and performance reporting for live venues with per-work
  repertoire matching; license audit with lookback back-license exposure,
  penalty assessment and settlement negotiation; seasonal and event-based
  license adjustments through coverage-window riders; background-music service
  exemption analysis against statutory square-footage and speaker-count limits;
  and license renewal with rate-schedule re-pinning when a rate-court order
  changes published rates.

domain_name: venue-music-licensing
api_prefix: /licensing

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection under
  # /licensing; parents are reached only through FK fields and filtered lists.
  # No entity is nested inside another entity's URL path.

  state_machine_shape: cyclic
  # LicenseApplication: UNDER_REVIEW -> RETURNED_FOR_REVISION -> SUBMITTED ->
  #   UNDER_REVIEW (bounded by MAX_REVISION_ROUNDS).
  # PerformanceReport: DRAFT -> SUBMITTED -> REJECTED -> DRAFT.
  # AuditCase: SETTLEMENT_PROPOSED -> DISPUTED -> SETTLEMENT_PROPOSED.
  # License additionally carries two independent state dimensions on one row
  #   (coverage_status x billing_status).

  relationship_patterns:
    - one_to_many          # Society -> RateSchedule, License; Venue -> License
    - self_referential     # License.renewal_of_license_id -> License.id
    - cross_aggregate      # FeeAssessment references Venue, License and AuditCase
    - many_to_many         # Venue <-> Society realised through License rows

  role_model: segregation_of_duties
  # The ComplianceAuditor who issues an audit case's findings MUST NOT be the
  # SettlementOfficer who proposes or accepts its settlement, compared on
  # X-User-ID.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Society
    parent: null
    common_fields: true
    fields:
      - { name: society_code, type: enum, source: input, description: "Performing-rights organisation code", constraints: "one of BMI, ASCAP, SESAC, GMR; unique across all Society rows" }
      - { name: display_name, type: string, source: input, description: "Human-readable society name", constraints: "1..120 chars" }
      - { name: repertoire_share_bp, type: integer, source: input, description: "Share of the typical performed repertoire this society controls, in basis points; drives per-society fee apportionment and Venue.covered_share_bp", constraints: "0 <= repertoire_share_bp <= 10000" }
      - { name: rate_court_supervised, type: boolean, source: input, default: false, description: "True when this society's rates are supervised by a rate court; informational only" }
      - { name: licensed_venue_count, type: integer, source: computed, default: 0, description: "Count of distinct Venue rows holding at least one License for this society with coverage_status == ACTIVE" }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: society_id, type: string, source: input, description: "FK -> Society.id; the society whose rates this schedule publishes" }
      - { name: venue_category, type: enum, source: input, description: "Venue category this schedule prices", constraints: "one of CONCERT_HALL, BAR_GRILL, NIGHTCLUB, RESTAURANT, HOTEL, FITNESS_STUDIO" }
      - { name: schedule_version, type: integer, source: system, description: "1 for the first schedule created for a (society_id, venue_category) pair, then max(schedule_version)+1 for that pair" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC instant from which this schedule may be selected for fee calculation" }
      - { name: rate_court_order_ref, type: string, source: input, default: null, description: "Rate-court docket reference that ordered this rate change; null for a voluntary filing" }
      - { name: adjustment_bp, type: integer, source: input, default: 10000, description: "Basis-point multiplier applied to the tier base component and the tier per-occupant component of annual_license_fee; 10000 means unadjusted", constraints: "5000 <= adjustment_bp <= 20000" }
      - { name: min_annual_fee_cents, type: integer, source: input, default: 30000, description: "Floor applied to the pre-apportionment scaled fee", constraints: ">= 0" }
      - { name: max_annual_fee_cents, type: integer, source: input, default: 4500000, description: "Ceiling applied to the pre-apportionment scaled fee", constraints: "> min_annual_fee_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Schedule lifecycle", constraints: "one of DRAFT, EFFECTIVE, SUPERSEDED" }
      - { name: pinned_license_count, type: integer, source: computed, default: 0, description: "Count of License rows whose rate_schedule_id equals this schedule's id" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered venue name", constraints: "1..160 chars" }
      - { name: venue_category, type: enum, source: input, description: "Licensing category of the venue", constraints: "one of CONCERT_HALL, BAR_GRILL, NIGHTCLUB, RESTAURANT, HOTEL, FITNESS_STUDIO" }
      - { name: seating_capacity, type: integer, source: input, description: "Fixed seats in the music room", constraints: ">= 0" }
      - { name: standing_capacity, type: integer, source: input, description: "Standing-room capacity in the music room", constraints: ">= 0" }
      - { name: occupancy_limit, type: integer, source: input, description: "Fire-code occupancy limit for the music room", constraints: ">= 1" }
      - { name: music_use_profile, type: enum, source: input, description: "Verified music use profile of the venue", constraints: "one of LIVE_ONLY, RECORDED_ONLY, MIXED, BACKGROUND_ONLY" }
      - { name: weekly_live_performance_nights, type: integer, source: input, description: "Verified count of nights per week featuring live performance", constraints: "0 <= weekly_live_performance_nights <= 7" }
      - { name: annual_cover_revenue_cents, type: integer, source: input, description: "Verified annual cover-charge and admission revenue", constraints: ">= 0" }
      - { name: gross_square_feet, type: integer, source: input, default: null, description: "Gross floor area of the establishment; null when not surveyed" }
      - { name: speaker_count, type: integer, source: input, default: null, description: "Total loudspeakers used for music reproduction; null when not surveyed" }
      - { name: max_speakers_per_room, type: integer, source: input, default: null, description: "Largest loudspeaker count in any single room; null when not surveyed" }
      - { name: has_cover_charge, type: boolean, source: input, default: false, description: "True when admission or a cover charge is collected for music" }
      - { name: retransmission_only, type: boolean, source: input, default: false, description: "True when all music is retransmission of a licensed broadcast or subscription service" }
      - { name: uses_licensed_bgm_service, type: boolean, source: input, default: false, description: "True when background music arrives through a service that already clears public performance" }
      - { name: bgm_service_provider, type: string, source: input, default: null, description: "Name of the background-music service; null when uses_licensed_bgm_service is false" }
      - { name: bgm_exemption_status, type: enum, source: computed, default: NOT_ANALYZED, description: "Result of the most recent background-music exemption analysis", constraints: "one of NOT_ANALYZED, EXEMPT, NOT_EXEMPT, INCONCLUSIVE" }
      - { name: bgm_exemption_reason, type: enum, source: computed, default: null, description: "Reason code accompanying bgm_exemption_status", constraints: "one of LICENSED_SERVICE_PASSTHROUGH, WITHIN_SIZE_AND_SPEAKER_LIMITS, MUSIC_USE_PROFILE_INELIGIBLE, SIZE_LIMIT_EXCEEDED, SPEAKER_LIMIT_EXCEEDED, COVER_CHARGE_DISQUALIFIES, PERFORMANCE_NOT_RETRANSMISSION, DATA_INCOMPLETE; null while bgm_exemption_status == NOT_ANALYZED" }
      - { name: status, type: enum, source: input, default: OPERATING, description: "Venue operating state", constraints: "one of OPERATING, CLOSED" }
      - { name: covered_share_bp, type: integer, source: computed, default: 0, description: "Sum of Society.repertoire_share_bp over societies holding a License on this venue with coverage_status == ACTIVE whose term covers the logical clock instant" }
      - { name: coverage_posture, type: enum, source: computed, default: UNCOVERED, description: "Derived multi-society coverage posture", constraints: "one of UNCOVERED, PARTIALLY_COVERED, FULLY_COVERED" }
      - { name: gap_risk_score, type: number, source: computed, default: 0, description: "Unlicensed-repertoire risk score in [0, 100] with two decimals, derived from the most recent reportable PerformanceReport" }
      - { name: audit_hold, type: boolean, source: computed, default: false, description: "True while at least one AuditCase on this venue has status in {OPEN, FINDINGS_ISSUED, SETTLEMENT_PROPOSED, DISPUTED}" }
      - { name: lifetime_assessed_cents, type: integer, source: computed, default: 0, description: "Running total of amount_cents over every FeeAssessment ever issued against this venue" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents - paid_amount_cents over FeeAssessment rows for this venue with status == ISSUED" }
      - { name: settled_amount_cents, type: integer, source: computed, default: 0, description: "Sum of paid_amount_cents over every FeeAssessment row for this venue, whatever its status" }
      - { name: voided_amount_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents - paid_amount_cents over FeeAssessment rows for this venue with status in {VOIDED, SETTLED}" }

  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue applying for coverage" }
      - { name: society_id, type: string, source: input, description: "FK -> Society.id; the society the venue is applying to" }
      - { name: requested_license_type, type: enum, source: input, description: "License type the operator asked for", constraints: "one of BLANKET, PER_PROGRAM, SEASONAL_EVENT, BGM_EXEMPT" }
      - { name: assigned_license_type, type: enum, source: computed, default: null, description: "License type the licence-type decision table assigns at approval; may differ from requested_license_type", constraints: "one of BLANKET, PER_PROGRAM, SEASONAL_EVENT, BGM_EXEMPT; null before approval" }
      - { name: declared_seating, type: integer, source: input, description: "Seating capacity as self-declared on this application", constraints: ">= 0" }
      - { name: declared_standing, type: integer, source: input, description: "Standing capacity as self-declared on this application", constraints: ">= 0" }
      - { name: declared_cover_revenue_cents, type: integer, source: input, description: "Annual cover revenue as self-declared on this application", constraints: ">= 0" }
      - { name: declared_live_nights, type: integer, source: input, description: "Weekly live-performance nights as self-declared on this application", constraints: "0 <= declared_live_nights <= 7" }
      - { name: declared_music_use_profile, type: enum, source: input, description: "Music use profile as self-declared on this application", constraints: "one of LIVE_ONLY, RECORDED_ONLY, MIXED, BACKGROUND_ONLY" }
      - { name: requested_term_start, type: datetime, source: input, description: "Requested ISO 8601 UTC start instant of the annual term" }
      - { name: provisional_annual_fee_cents, type: integer, source: computed, default: null, description: "annual_license_fee computed with the provisional_declared variant at approval; null before approval" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Application lifecycle", constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_REVISION, APPROVED, DECLINED, WITHDRAWN" }
      - { name: revision_round, type: integer, source: computed, default: 0, description: "Number of times this application has been returned for revision" }
      - { name: return_reason, type: enum, source: computed, default: null, description: "Reason recorded on the most recent return-for-revision", constraints: "one of DECLARATION_MISMATCH, MISSING_EXEMPTION_ANALYSIS, AUDIT_HOLD" }
      - { name: decline_reason, type: enum, source: computed, default: null, description: "Reason recorded when the application is declined", constraints: "one of REVISION_LIMIT_EXCEEDED, EXEMPTION_APPLIES, DUPLICATE_COVERAGE" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; copied from the approved application" }
      - { name: society_id, type: string, source: system, description: "FK -> Society.id; copied from the approved application" }
      - { name: application_id, type: string, source: system, description: "FK -> LicenseApplication.id; the approved application, or the predecessor's application_id for a renewal" }
      - { name: rate_schedule_id, type: string, source: system, description: "FK -> RateSchedule.id; the schedule pinned to this license at issuance, re-pinned on rate-change re-rating and on renewal" }
      - { name: renewal_of_license_id, type: string, source: system, default: null, description: "FK -> License.id; the predecessor license this row renews; null for a first-term license" }
      - { name: pinned_schedule_version, type: integer, source: computed, description: "schedule_version of the currently pinned RateSchedule" }
      - { name: license_type, type: enum, source: computed, description: "Assigned license type carried over from the application", constraints: "one of BLANKET, PER_PROGRAM, SEASONAL_EVENT, BGM_EXEMPT" }
      - { name: term_start, type: datetime, source: computed, description: "ISO 8601 UTC start instant of the annual term; equals the application's requested_term_start" }
      - { name: term_end, type: datetime, source: computed, description: "term_start plus exactly 365 days; the annual term is the half-open interval [term_start, term_end)" }
      - { name: provisional_annual_fee_cents, type: integer, source: computed, description: "Fee computed with the provisional_declared variant at issuance" }
      - { name: annual_fee_cents, type: integer, source: computed, description: "Fee currently in force; recomputed with the final_verified variant at activation, at rate-change re-rating and at renewal issuance" }
      - { name: verified_fee_delta_cents, type: integer, source: computed, default: 0, description: "annual_fee_cents minus provisional_annual_fee_cents as of the most recent recomputation" }
      - { name: coverage_status, type: enum, source: system, default: PENDING_ACTIVATION, description: "Coverage state dimension; evolves independently of billing_status on the same row", constraints: "one of PENDING_ACTIVATION, ACTIVE, SUSPENDED, EXPIRED, TERMINATED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "Billing state dimension; evolves independently of coverage_status on the same row", constraints: "one of UNBILLED, INVOICED, PAID, DELINQUENT, WRITTEN_OFF" }
      - { name: suspension_reason, type: enum, source: computed, default: null, description: "Reason recorded when coverage_status becomes SUSPENDED", constraints: "one of NONPAYMENT, AUDIT_FINDINGS, OPERATOR_REQUEST" }
      - { name: reporting_required, type: boolean, source: computed, description: "True when license_type is in {BLANKET, PER_PROGRAM} and the venue's music_use_profile is in {LIVE_ONLY, MIXED}" }
      - { name: accepted_report_count, type: integer, source: computed, default: 0, description: "Count of PerformanceReport rows on this license with status == ACCEPTED" }
      - { name: renewal_issued_at, type: datetime, source: computed, default: null, description: "Logical-clock instant at which a renewal license was issued against this row; null while no renewal exists" }

  - name: CoverageWindow
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; the license this window belongs to" }
      - { name: window_kind, type: enum, source: input, description: "Kind of coverage window", constraints: "one of ANNUAL_TERM, SEASONAL_EVENT_RIDER, FESTIVAL_RIDER" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive ISO 8601 UTC start instant of the window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive ISO 8601 UTC end instant of the window; coverage windows are half-open [window_start, window_end)" }
      - { name: covered_day_count, type: integer, source: computed, description: "Whole days between window_start and window_end, computed as (window_end - window_start) in days" }
      - { name: rider_fee_cents, type: integer, source: computed, default: 0, description: "seasonal_rider_fee for a SEASONAL_EVENT_RIDER or FESTIVAL_RIDER window; always 0 for an ANNUAL_TERM window" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Window lifecycle", constraints: "one of ACTIVE, VOIDED" }

  - name: RepertoireWork
    parent: null
    common_fields: false   # immutable registry row: only id and created_at
    fields:
      - { name: society_id, type: string, source: input, description: "FK -> Society.id; the society in whose repertoire this work is registered" }
      - { name: title, type: string, source: input, description: "Registered work title used for setlist matching", constraints: "1..200 chars" }
      - { name: writer_name, type: string, source: input, description: "Registered writer name used for setlist matching", constraints: "1..120 chars" }
      - { name: iswc, type: string, source: input, default: null, description: "International Standard Musical Work Code; unique across RepertoireWork rows when not null" }

  - name: PerformanceReport
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; the license this reporting period belongs to" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive ISO 8601 UTC start instant of the reporting period" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive ISO 8601 UTC end instant of the reporting period; reporting periods are half-open intervals [period_start, period_end)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Report lifecycle", constraints: "one of DRAFT, SUBMITTED, ACCEPTED, REJECTED" }
      - { name: reported_entry_count, type: integer, source: computed, default: 0, description: "Count of SetlistEntry rows attached to this report" }
      - { name: matched_entry_count, type: integer, source: computed, default: 0, description: "Count of attached SetlistEntry rows with is_matched == true after submission matching" }
      - { name: uncovered_entry_count, type: integer, source: computed, default: 0, description: "Count of attached SetlistEntry rows with is_covered == false after submission matching" }
      - { name: unmatched_share_pct, type: number, source: computed, default: 0, description: "Weighted unmatched share from the repertoire_gap_share title_match variant, two decimals" }
      - { name: uncovered_share_pct, type: number, source: computed, default: 0, description: "Weighted uncovered share from the repertoire_gap_share affiliation_coverage variant, two decimals" }
      - { name: gap_exposure_cents, type: integer, source: computed, default: 0, description: "Money value of the uncovered share against this license's annual_fee_cents" }
      - { name: rejection_reason, type: enum, source: computed, default: null, description: "Reason recorded when the report is rejected", constraints: "one of INCOMPLETE_SETLIST, PERIOD_MISMATCH, EXCESSIVE_UNMATCHED" }
      - { name: review_round, type: integer, source: computed, default: 0, description: "Number of times this report has been rejected and reopened for revision" }

  - name: SetlistEntry
    parent: null
    common_fields: false   # immutable performance record: only id and created_at
    fields:
      - { name: performance_report_id, type: string, source: input, description: "FK -> PerformanceReport.id; the reporting period this performance falls in" }
      - { name: work_title, type: string, source: input, description: "Title as reported by the venue", constraints: "1..200 chars" }
      - { name: writer_name, type: string, source: input, description: "Writer as reported by the venue", constraints: "1..120 chars" }
      - { name: society_affiliation, type: enum, source: input, description: "Society the venue believes controls this work", constraints: "one of BMI, ASCAP, SESAC, GMR, UNAFFILIATED, UNKNOWN" }
      - { name: performance_datetime, type: datetime, source: input, description: "ISO 8601 UTC instant of the performance" }
      - { name: use_type, type: enum, source: input, description: "Whether the performance was live or a recorded rendition", constraints: "one of LIVE, RECORDED" }
      - { name: duration_seconds, type: integer, source: input, description: "Performance duration in seconds", constraints: ">= 1" }
      - { name: is_matched, type: boolean, source: computed, default: false, description: "True when repertoire matching found a RepertoireWork for this entry at report submission" }
      - { name: matched_work_id, type: string, source: computed, default: null, description: "FK -> RepertoireWork.id; the work matched at report submission, null when unmatched" }
      - { name: is_covered, type: boolean, source: computed, default: false, description: "True when the entry's society_affiliation had a License with coverage_status == ACTIVE covering performance_datetime at submission time" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue under audit" }
      - { name: audit_trigger, type: enum, source: input, description: "What opened this case", constraints: "one of ROUTINE, GAP_RISK_ESCALATION, COMPLAINT" }
      - { name: lookback_start, type: datetime, source: input, description: "Inclusive ISO 8601 UTC start instant of the audited lookback interval" }
      - { name: lookback_end, type: datetime, source: input, description: "Exclusive ISO 8601 UTC end instant of the audited lookback interval; the lookback is half-open [lookback_start, lookback_end)" }
      - { name: society_ids, type: array, source: input, description: "Society identifiers in audit scope; each element MUST reference an existing Society row and is validated left-to-right", constraints: "1..4 elements, no duplicates" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Audit lifecycle", constraints: "one of OPEN, FINDINGS_ISSUED, SETTLEMENT_PROPOSED, DISPUTED, SETTLED, CLOSED_NO_ACTION" }
      - { name: unlicensed_month_count, type: integer, source: computed, default: 0, description: "Total count of (society, whole calendar month) pairs in scope that had no ACTIVE coverage" }
      - { name: back_license_exposure_cents, type: integer, source: computed, default: 0, description: "back_license_exposure output; unpaid licence value for uncovered months" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Penalty applied to back_license_exposure_cents at the unlicensed-month tier rate" }
      - { name: pre_credit_total_cents, type: integer, source: computed, default: 0, description: "back_license_exposure_cents + penalty_cents; the amount assessed at findings issuance" }
      - { name: goodwill_credit_cents, type: integer, source: computed, default: 0, description: "Goodwill credit selected from the tier of pre_credit_total_cents" }
      - { name: settlement_total_cents, type: integer, source: computed, default: 0, description: "pre_credit_total_cents - goodwill_credit_cents; the negotiation target" }
      - { name: settlement_floor_cents, type: integer, source: computed, default: 0, description: "Minimum acceptable offer, SETTLEMENT_FLOOR_BP of settlement_total_cents" }
      - { name: offered_amount_cents, type: integer, source: computed, default: null, description: "Amount on the most recent settlement offer; null before the first offer" }
      - { name: payment_plan_months, type: integer, source: computed, default: null, description: "Instalment count on the most recent settlement offer; null before the first offer" }
      - { name: dispute_round, type: integer, source: computed, default: 0, description: "Number of times the venue has disputed a settlement offer on this case" }
      - { name: findings_issued_by_user_id, type: string, source: computed, default: null, description: "Opaque X-User-ID of the ComplianceAuditor who issued findings; null before findings" }
      - { name: settlement_proposed_by_user_id, type: string, source: computed, default: null, description: "Opaque X-User-ID of the SettlementOfficer who made the most recent offer" }
      - { name: settled_by_user_id, type: string, source: computed, default: null, description: "Opaque X-User-ID of the SettlementOfficer who accepted the settlement" }
      - { name: closed_reason, type: enum, source: computed, default: null, description: "Reason recorded when the case closes without action", constraints: "one of NO_GAP_FOUND, WITHIN_TOLERANCE" }

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; the venue billed" }
      - { name: license_id, type: string, source: system, default: null, description: "FK -> License.id; the license billed, null for an AUDIT_BACK_LICENSE assessment" }
      - { name: audit_case_id, type: string, source: system, default: null, description: "FK -> AuditCase.id; the audit that produced this assessment, null for every other assessment_kind" }
      - { name: assessment_kind, type: enum, source: system, description: "What produced this assessment", constraints: "one of INITIAL, RENEWAL, SEASONAL_RIDER, RATE_CHANGE_TRUEUP, AUDIT_BACK_LICENSE" }
      - { name: amount_cents, type: integer, source: computed, description: "Assessed amount in cents", constraints: ">= 1" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Cash actually applied against this assessment" }
      - { name: due_date, type: datetime, source: computed, description: "Logical-clock instant of issuance plus 30 days" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "Assessment lifecycle", constraints: "one of ISSUED, PAID, VOIDED, SETTLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RateSchedule
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "POST /licensing/rate-schedules/{id}/publish"
        actor: LicensingAdmin
        preconditions:
          - "RateSchedule.status == DRAFT"
          - "RateSchedule.effective_from <= logical clock instant"
        side_effects:
          - "status = EFFECTIVE; version increments by 1"
          - "CASCADE-A LINK 1: the prior effective schedule for the same (society_id, venue_category) — candidate set = RateSchedule rows with status == EFFECTIVE and the same (society_id, venue_category), ranked effective_from DESC then schedule_version DESC, tie-break created_at DESC — transitions EFFECTIVE -> SUPERSEDED and its version increments by 1. When the candidate set is empty there is no supersession and CASCADE-A LINK 2, 3 and 4 do not run."
          - "CASCADE-A LINK 2 (caused by LINK 1, not by the publish call): because that schedule left EFFECTIVE, every License with rate_schedule_id == the superseded schedule's id and coverage_status == ACTIVE re-pins rate_schedule_id and pinned_schedule_version to this newly EFFECTIVE schedule, recomputes annual_fee_cents with annual_license_fee/final_verified, sets verified_fee_delta_cents = annual_fee_cents - provisional_annual_fee_cents, and increments License.version by 1. Affected licenses are processed in created_at ASC order."
          - "CASCADE-A LINK 3 (caused by LINK 2): because annual_fee_cents rose on a re-pinned License, a FeeAssessment with assessment_kind == RATE_CHANGE_TRUEUP, status == ISSUED and amount_cents == rate_change_trueup is created for that License. A License whose recomputed annual_fee_cents did not increase gets no assessment."
          - "CASCADE-A LINK 4 (caused by LINK 3): because a new ISSUED FeeAssessment exists, its Venue.lifetime_assessed_cents and Venue.outstanding_balance_cents each increase by amount_cents, Venue.version increments by 1, and when the post-issuance Venue.outstanding_balance_cents > DELINQUENCY_TOLERANCE_CENTS every License of that venue whose billing_status is in {UNBILLED, INVOICED} transitions to DELINQUENT."
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system, CASCADE-A LINK 1 of POST /licensing/rate-schedules/{id}/publish on a newer schedule for the same (society_id, venue_category)"
        actor: system
        preconditions:
          - "RateSchedule.status == EFFECTIVE"
          - "another RateSchedule for the same (society_id, venue_category) is being published"
        side_effects:
          - "status = SUPERSEDED; version increments by 1"
          - "no License is unpinned by this transition itself; the re-pin happens in CASCADE-A LINK 2"

  - entity: LicenseApplication
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensing/license-applications/{id}/submit"
        actor: VenueOperator
        preconditions:
          - "LicenseApplication.status == DRAFT"
          - "X-User-ID == LicenseApplication.venue_id"
          - "Venue.status == OPERATING"
        side_effects:
          - "status = SUBMITTED; version increments by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /licensing/license-applications/{id}/review with disposition == ACCEPT_FOR_REVIEW"
        actor: LicensingAdmin
        preconditions:
          - "LicenseApplication.status == SUBMITTED"
        side_effects:
          - "status = UNDER_REVIEW; version increments by 1"
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /licensing/license-applications/{id}/review with disposition == RETURN_FOR_REVISION and return_reason supplied"
        actor: LicensingAdmin
        preconditions:
          - "LicenseApplication.status == UNDER_REVIEW"
          - "LicenseApplication.revision_round < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "status = RETURNED_FOR_REVISION; revision_round increments by 1; return_reason = the supplied reason; version increments by 1"
        note: "Cycle edge 1 of 2. When revision_round == MAX_REVISION_ROUNDS the same call takes the UNDER_REVIEW -> DECLINED edge instead."
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /licensing/license-applications/{id}/submit"
        actor: VenueOperator
        preconditions:
          - "LicenseApplication.status == RETURNED_FOR_REVISION"
          - "X-User-ID == LicenseApplication.venue_id"
          - "Venue.audit_hold == false"
        side_effects:
          - "status = SUBMITTED; return_reason = null; version increments by 1"
        note: "Cycle edge 2 of 2: RETURNED_FOR_REVISION -> SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_REVISION, bounded by MAX_REVISION_ROUNDS."
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /licensing/license-applications/{id}/review with disposition == RETURN_FOR_REVISION while revision_round == MAX_REVISION_ROUNDS"
        actor: LicensingAdmin
        preconditions:
          - "LicenseApplication.status == UNDER_REVIEW"
          - "LicenseApplication.revision_round == MAX_REVISION_ROUNDS"
        side_effects:
          - "status = DECLINED; decline_reason = REVISION_LIMIT_EXCEEDED; version increments by 1"
        note: "Termination guard on the revision cycle: the fourth return converts to a decline instead of looping."
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /licensing/license-applications/{id}/review with disposition == DECLINE and decline_reason supplied"
        actor: LicensingAdmin
        preconditions:
          - "LicenseApplication.status == UNDER_REVIEW"
        side_effects:
          - "status = DECLINED; decline_reason = the supplied reason; version increments by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /licensing/license-applications/{id}/review with disposition == APPROVE"
        actor: LicensingAdmin
        preconditions:
          - "LicenseApplication.status == UNDER_REVIEW"
          - "Venue.audit_hold == false"
          - "requested_license_type != BGM_EXEMPT or Venue.bgm_exemption_status != NOT_ANALYZED"
          - "an EFFECTIVE RateSchedule exists for (LicenseApplication.society_id, Venue.venue_category) with effective_from <= logical clock instant"
        side_effects:
          - "assigned_license_type = license_type_assignment output; provisional_annual_fee_cents = annual_license_fee/provisional_declared; status = APPROVED; version increments by 1"
          - "a License row is created with coverage_status = PENDING_ACTIVATION, billing_status = UNBILLED, venue_id / society_id / application_id copied from this application, rate_schedule_id and pinned_schedule_version taken from the rate_schedule_selection winner, license_type = assigned_license_type, term_start = requested_term_start, term_end = term_start + 365 days, provisional_annual_fee_cents = annual_fee_cents = the provisional fee, verified_fee_delta_cents = 0, reporting_required per its formula"
          - "when assigned_license_type == BGM_EXEMPT the created License has provisional_annual_fee_cents = 0 and annual_fee_cents = 0"
          - "RateSchedule.pinned_license_count of the winning schedule increases by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /licensing/license-applications/{id}/withdraw"
        actor: VenueOperator
        preconditions:
          - "LicenseApplication.status is in {DRAFT, SUBMITTED, RETURNED_FOR_REVISION}"
          - "X-User-ID == LicenseApplication.venue_id"
        side_effects:
          - "status = WITHDRAWN; version increments by 1"
        note: "Same edge is available from SUBMITTED and RETURNED_FOR_REVISION."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system, supersession by a newer LicenseApplication for the same (venue_id, society_id)"
        actor: system
        preconditions:
          - "LicenseApplication.status is in {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_REVISION}"
          - "a new LicenseApplication for the same (venue_id, society_id) is being created and passes the OCC check on Venue.version"
        side_effects:
          - "status = WITHDRAWN; version increments by 1"
        note: "Create-with-supersede: this is the transition the venue-application-create OCC rule guards."
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "system, CASCADE-B LINK 4 of POST /licensing/performance-reports/{id}/submit"
        actor: system
        preconditions:
          - "LicenseApplication.status is in {SUBMITTED, UNDER_REVIEW}"
          - "Venue.audit_hold just became true"
          - "LicenseApplication.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "status = RETURNED_FOR_REVISION; revision_round increments by 1; return_reason = AUDIT_HOLD; version increments by 1"
          - "when revision_round == MAX_REVISION_ROUNDS instead, status = DECLINED with decline_reason = REVISION_LIMIT_EXCEEDED"

  - entity: License
    state_field: coverage_status
    initial_state: PENDING_ACTIVATION
    terminal_states: [EXPIRED, TERMINATED]
    note: "Dimension 1 of 2 on the same License row. coverage_status and billing_status advance independently: a License may be ACTIVE and DELINQUENT, or SUSPENDED and PAID."
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/activate"
        actor: LicensingAdmin
        preconditions:
          - "License.coverage_status == PENDING_ACTIVATION"
          - "Venue.status == OPERATING"
          - "no other License with the same (venue_id, society_id) has coverage_status in {ACTIVE, PENDING_ACTIVATION} and a term interval [term_start, term_end) overlapping this License's term"
        side_effects:
          - "coverage_status = ACTIVE; annual_fee_cents = annual_license_fee/final_verified against the currently pinned RateSchedule; verified_fee_delta_cents = annual_fee_cents - provisional_annual_fee_cents; version increments by 1"
          - "a CoverageWindow is created with window_kind = ANNUAL_TERM, window_start = term_start, window_end = term_end, covered_day_count = 365, rider_fee_cents = 0, status = ACTIVE"
          - "when license_type != BGM_EXEMPT a FeeAssessment is created with assessment_kind = INITIAL when renewal_of_license_id is null else RENEWAL, amount_cents = annual_fee_cents, paid_amount_cents = 0, status = ISSUED, due_date = logical clock instant + 30 days; billing_status advances UNBILLED -> INVOICED"
          - "when license_type == BGM_EXEMPT no FeeAssessment is created and billing_status stays UNBILLED"
          - "Venue.lifetime_assessed_cents and Venue.outstanding_balance_cents each increase by the created assessment's amount_cents; Venue.covered_share_bp, Venue.coverage_posture recomputed; Society.licensed_venue_count recomputed; Venue.version increments by 1"
          - "when the post-issuance Venue.outstanding_balance_cents > DELINQUENCY_TOLERANCE_CENTS every License of that venue whose billing_status is in {UNBILLED, INVOICED} transitions to DELINQUENT"
          - "conditional cascade: when renewal_of_license_id is not null AND the logical clock instant >= the predecessor License.term_end, the predecessor transitions coverage_status ACTIVE -> EXPIRED and its version increments by 1; when the clock is still before the predecessor's term_end the predecessor stays ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licensing/licenses/{id}/suspend with suspension_reason"
        actor: LicensingAdmin
        preconditions:
          - "License.coverage_status == ACTIVE"
        side_effects:
          - "coverage_status = SUSPENDED; suspension_reason = the supplied reason; version increments by 1"
          - "Venue.covered_share_bp and Venue.coverage_posture recomputed (this society's share leaves the sum); Society.licensed_venue_count recomputed; Venue.version increments by 1"
          - "CoverageWindow rows of this License keep status ACTIVE; suspension does not void windows"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/reinstate"
        actor: LicensingAdmin
        preconditions:
          - "License.coverage_status == SUSPENDED"
          - "when suspension_reason == NONPAYMENT, Venue.outstanding_balance_cents <= REINSTATEMENT_BALANCE_LIMIT_CENTS"
        side_effects:
          - "coverage_status = ACTIVE; suspension_reason = null; version increments by 1"
          - "Venue.covered_share_bp and Venue.coverage_posture recomputed (this society's share re-enters the sum); Society.licensed_venue_count recomputed; Venue.version increments by 1"
        note: "Cycle on the coverage dimension: ACTIVE -> SUSPENDED -> ACTIVE is unbounded."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /licensing/licenses/{id}/terminate"
        actor: LicensingAdmin
        preconditions:
          - "License.coverage_status is in {PENDING_ACTIVATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "coverage_status = TERMINATED; version increments by 1"
          - "every CoverageWindow of this License with status == ACTIVE transitions to VOIDED"
          - "when void_unpaid_assessments == true every FeeAssessment of this License with status == ISSUED transitions to VOIDED with paid_amount_cents unchanged, billing_status becomes WRITTEN_OFF, Venue.outstanding_balance_cents decreases by the sum of (amount_cents - paid_amount_cents) over those assessments and Venue.voided_amount_cents increases by the same sum"
          - "when void_unpaid_assessments is false or omitted, open assessments keep status ISSUED and billing_status is unchanged"
          - "Venue.covered_share_bp, Venue.coverage_posture recomputed; Society.licensed_venue_count recomputed; Venue.version increments by 1"
        note: "Same edge is available from PENDING_ACTIVATION and SUSPENDED."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, activation of a renewal License whose predecessor is this row, when the logical clock instant >= this row's term_end"
        actor: system
        preconditions:
          - "License.coverage_status == ACTIVE"
          - "a renewal License with renewal_of_license_id == this row's id is being activated"
          - "logical clock instant >= License.term_end"
        side_effects:
          - "coverage_status = EXPIRED; version increments by 1"
          - "Venue.covered_share_bp and Venue.coverage_posture recomputed"

  - entity: License
    state_field: billing_status
    initial_state: UNBILLED
    terminal_states: [WRITTEN_OFF]
    note: "Dimension 2 of 2 on the same License row, driven entirely by FeeAssessment activity; no endpoint targets billing_status directly."
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "system, INITIAL or RENEWAL FeeAssessment issuance during POST /licensing/licenses/{id}/activate"
        actor: system
        preconditions:
          - "License.billing_status == UNBILLED"
          - "License.license_type != BGM_EXEMPT"
        side_effects:
          - "billing_status = INVOICED; version increments by 1"
      - from: PAID
        to: INVOICED
        trigger: "system, issuance of a RATE_CHANGE_TRUEUP or SEASONAL_RIDER FeeAssessment against this License"
        actor: system
        preconditions:
          - "License.billing_status == PAID"
        side_effects:
          - "billing_status = INVOICED; version increments by 1"
        note: "Cycle on the billing dimension: INVOICED -> PAID -> INVOICED is unbounded."
      - from: INVOICED
        to: PAID
        trigger: "system, POST /licensing/fee-assessments/{id}/pay clearing the last ISSUED assessment of this License"
        actor: system
        preconditions:
          - "License.billing_status is in {INVOICED, DELINQUENT}"
          - "no FeeAssessment with this license_id has status == ISSUED after the payment"
          - "Venue.outstanding_balance_cents == 0 after the payment"
        side_effects:
          - "billing_status = PAID; version increments by 1"
      - from: INVOICED
        to: DELINQUENT
        trigger: "system, FeeAssessment issuance that pushes Venue.outstanding_balance_cents above DELINQUENCY_TOLERANCE_CENTS"
        actor: system
        preconditions:
          - "License.billing_status is in {UNBILLED, INVOICED}"
          - "post-issuance Venue.outstanding_balance_cents > DELINQUENCY_TOLERANCE_CENTS"
        side_effects:
          - "billing_status = DELINQUENT; version increments by 1"
        note: "Same edge is available from UNBILLED, which is how a BGM_EXEMPT License becomes DELINQUENT through a sibling license's assessment."
      - from: DELINQUENT
        to: INVOICED
        trigger: "system, POST /licensing/fee-assessments/{id}/pay or POST /licensing/audit-cases/{id}/settle bringing Venue.outstanding_balance_cents back to <= DELINQUENCY_TOLERANCE_CENTS while some ISSUED assessment remains"
        actor: system
        preconditions:
          - "License.billing_status == DELINQUENT"
          - "post-payment Venue.outstanding_balance_cents <= DELINQUENCY_TOLERANCE_CENTS"
          - "at least one FeeAssessment with this license_id still has status == ISSUED, or Venue.outstanding_balance_cents > 0"
        side_effects:
          - "billing_status = INVOICED; version increments by 1"
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "system, POST /licensing/licenses/{id}/terminate with void_unpaid_assessments == true"
        actor: system
        preconditions:
          - "License.billing_status is in {UNBILLED, INVOICED, DELINQUENT}"
          - "at least one FeeAssessment with this license_id had status == ISSUED at termination time"
        side_effects:
          - "billing_status = WRITTEN_OFF; version increments by 1"

  - entity: CoverageWindow
    state_field: status
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "system, POST /licensing/licenses/{id}/terminate on the owning License"
        actor: system
        preconditions:
          - "CoverageWindow.status == ACTIVE"
          - "the owning License is transitioning to TERMINATED"
        side_effects:
          - "status = VOIDED; version increments by 1"
          - "Venue.covered_share_bp and Venue.coverage_posture recomputed"

  - entity: PerformanceReport
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensing/performance-reports/{id}/submit"
        actor: VenueOperator
        preconditions:
          - "PerformanceReport.status == DRAFT"
          - "X-User-ID == the owning License.venue_id"
          - "License.coverage_status == ACTIVE"
        side_effects:
          - "CASCADE-B LINK 1: status = SUBMITTED; repertoire matching runs over every attached SetlistEntry setting is_matched, matched_work_id and is_covered; reported_entry_count, matched_entry_count, uncovered_entry_count, unmatched_share_pct (repertoire_gap_share/title_match), uncovered_share_pct (repertoire_gap_share/affiliation_coverage) and gap_exposure_cents are written; version increments by 1"
          - "CASCADE-B LINK 2 (caused by LINK 1, not by the submit call): because uncovered_share_pct was written on the now most-recent reportable report, Venue.gap_risk_score is recomputed by repertoire_gap_risk_score and Venue.version increments by 1"
          - "CASCADE-B LINK 3 (caused by LINK 2): because the recomputed Venue.gap_risk_score >= GAP_ESCALATION_THRESHOLD, a system AuditCase is created for this venue with audit_trigger = GAP_RISK_ESCALATION, status = OPEN, lookback_start = the report's period_start, lookback_end = the report's period_end, society_ids = the ids of every Society whose repertoire_share_bp > 0 that appears as the society_affiliation of an uncovered SetlistEntry of this report (ordered by Society.created_at ASC); Venue.audit_hold becomes true. When gap_risk_score < GAP_ESCALATION_THRESHOLD no case is created and LINK 4 does not run."
          - "CASCADE-B LINK 4 (caused by LINK 3): because Venue.audit_hold became true, every LicenseApplication of this venue with status in {SUBMITTED, UNDER_REVIEW} transitions to RETURNED_FOR_REVISION with return_reason = AUDIT_HOLD and revision_round incremented, or to DECLINED with decline_reason = REVISION_LIMIT_EXCEEDED when its revision_round already equals MAX_REVISION_ROUNDS. Applications are processed in created_at ASC order."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /licensing/performance-reports/{id}/review with disposition == ACCEPT"
        actor: LicensingAdmin
        preconditions:
          - "PerformanceReport.status == SUBMITTED"
        side_effects:
          - "status = ACCEPTED; version increments by 1"
          - "the owning License.accepted_report_count increases by 1 and License.version increments by 1"
          - "Venue.gap_risk_score recomputed from the most recent reportable report"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /licensing/performance-reports/{id}/review with disposition == REJECT and rejection_reason supplied"
        actor: LicensingAdmin
        preconditions:
          - "PerformanceReport.status == SUBMITTED"
        side_effects:
          - "status = REJECTED; rejection_reason = the supplied reason; review_round increments by 1; version increments by 1"
          - "Venue.gap_risk_score recomputed; a REJECTED report leaves the reportable set, so the score falls back to the next most recent report with status in {SUBMITTED, ACCEPTED} or to 0 when none exists"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /licensing/performance-reports/{id}/setlist-entries on a REJECTED report"
        actor: VenueOperator
        preconditions:
          - "PerformanceReport.status == REJECTED"
          - "X-User-ID == the owning License.venue_id"
        side_effects:
          - "status = DRAFT; rejection_reason = null; matched_entry_count, uncovered_entry_count, unmatched_share_pct, uncovered_share_pct and gap_exposure_cents reset to 0; every already attached SetlistEntry has is_matched reset to false, matched_work_id to null and is_covered to false; version increments by 1"
        note: "Cycle: DRAFT -> SUBMITTED -> REJECTED -> DRAFT, reopened by attaching a further setlist entry."

  - entity: AuditCase
    state_field: status
    initial_state: OPEN
    terminal_states: [SETTLED, CLOSED_NO_ACTION]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /licensing/audit-cases/{id}/findings"
        actor: ComplianceAuditor
        preconditions:
          - "AuditCase.status == OPEN"
          - "AuditCase.lookback_end <= logical clock instant"
          - "an EFFECTIVE RateSchedule with effective_from <= logical clock instant exists for every (society in society_ids, Venue.venue_category) pair"
        side_effects:
          - "unlicensed_month_count, back_license_exposure_cents, penalty_cents and pre_credit_total_cents written from back_license_exposure; goodwill_credit_cents, settlement_total_cents and settlement_floor_cents written from settlement_target; findings_issued_by_user_id = X-User-ID; status = FINDINGS_ISSUED; version increments by 1"
          - "when pre_credit_total_cents > 0 a FeeAssessment is created with assessment_kind = AUDIT_BACK_LICENSE, venue_id = AuditCase.venue_id, license_id = null, audit_case_id = this case, amount_cents = pre_credit_total_cents, paid_amount_cents = 0, status = ISSUED, due_date = logical clock instant + 30 days"
          - "Venue.lifetime_assessed_cents and Venue.outstanding_balance_cents each increase by pre_credit_total_cents; Venue.version increments by 1"
          - "when the post-issuance Venue.outstanding_balance_cents > DELINQUENCY_TOLERANCE_CENTS every License of that venue whose billing_status is in {UNBILLED, INVOICED} transitions to DELINQUENT"
      - from: OPEN
        to: CLOSED_NO_ACTION
        trigger: "POST /licensing/audit-cases/{id}/close with closed_reason"
        actor: ComplianceAuditor
        preconditions:
          - "AuditCase.status == OPEN"
        side_effects:
          - "status = CLOSED_NO_ACTION; closed_reason = the supplied reason; version increments by 1"
          - "Venue.audit_hold recomputed and becomes false when no other AuditCase of the venue has status in {OPEN, FINDINGS_ISSUED, SETTLEMENT_PROPOSED, DISPUTED}; Venue.version increments by 1"
      - from: FINDINGS_ISSUED
        to: SETTLEMENT_PROPOSED
        trigger: "POST /licensing/audit-cases/{id}/settlement-offer"
        actor: SettlementOfficer
        preconditions:
          - "AuditCase.status is in {FINDINGS_ISSUED, DISPUTED}"
          - "X-User-ID != AuditCase.findings_issued_by_user_id"
          - "offered_amount_cents >= AuditCase.settlement_floor_cents"
        side_effects:
          - "status = SETTLEMENT_PROPOSED; offered_amount_cents and payment_plan_months = the supplied values; settlement_proposed_by_user_id = X-User-ID; version increments by 1"
      - from: SETTLEMENT_PROPOSED
        to: DISPUTED
        trigger: "POST /licensing/audit-cases/{id}/dispute"
        actor: VenueOperator
        preconditions:
          - "AuditCase.status == SETTLEMENT_PROPOSED"
          - "X-User-ID == AuditCase.venue_id"
          - "AuditCase.dispute_round < MAX_DISPUTE_ROUNDS (2)"
        side_effects:
          - "status = DISPUTED; dispute_round increments by 1; version increments by 1"
        note: "Cycle: SETTLEMENT_PROPOSED -> DISPUTED -> SETTLEMENT_PROPOSED, bounded by MAX_DISPUTE_ROUNDS."
      - from: DISPUTED
        to: SETTLEMENT_PROPOSED
        trigger: "POST /licensing/audit-cases/{id}/settlement-offer"
        actor: SettlementOfficer
        preconditions:
          - "AuditCase.status == DISPUTED"
          - "X-User-ID != AuditCase.findings_issued_by_user_id"
          - "offered_amount_cents >= AuditCase.settlement_floor_cents"
        side_effects:
          - "status = SETTLEMENT_PROPOSED; offered_amount_cents and payment_plan_months replaced by the supplied values; settlement_proposed_by_user_id = X-User-ID; version increments by 1"
      - from: SETTLEMENT_PROPOSED
        to: SETTLED
        trigger: "POST /licensing/audit-cases/{id}/settle"
        actor: SettlementOfficer
        preconditions:
          - "AuditCase.status == SETTLEMENT_PROPOSED"
          - "X-User-ID != AuditCase.findings_issued_by_user_id"
          - "the FeeAssessment with audit_case_id == this case has status == ISSUED"
        side_effects:
          - "status = SETTLED; settled_by_user_id = X-User-ID; version increments by 1"
          - "the AUDIT_BACK_LICENSE FeeAssessment transitions ISSUED -> SETTLED with paid_amount_cents = AuditCase.offered_amount_cents"
          - "Venue.settled_amount_cents increases by offered_amount_cents; Venue.voided_amount_cents increases by (assessment.amount_cents - offered_amount_cents); Venue.outstanding_balance_cents decreases by assessment.amount_cents; Venue.audit_hold recomputed; Venue.version increments by 1"
          - "when the post-settlement Venue.outstanding_balance_cents <= DELINQUENCY_TOLERANCE_CENTS every License of that venue with billing_status == DELINQUENT transitions to INVOICED, or to PAID when Venue.outstanding_balance_cents == 0 and no ISSUED assessment remains for that license"

  - entity: FeeAssessment
    state_field: status
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED, SETTLED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /licensing/fee-assessments/{id}/pay"
        actor: VenueOperator
        preconditions:
          - "FeeAssessment.status == ISSUED"
          - "X-User-ID == FeeAssessment.venue_id"
          - "the payment clears the whole remainder: amount_cents == FeeAssessment.amount_cents - FeeAssessment.paid_amount_cents"
        side_effects:
          - "paid_amount_cents = FeeAssessment.amount_cents; status = PAID; version increments by 1"
          - "Venue.settled_amount_cents increases by amount_cents; Venue.outstanding_balance_cents decreases by amount_cents; Venue.version increments by 1"
          - "the owning License's billing_status advances to PAID when no ISSUED assessment remains for it and Venue.outstanding_balance_cents == 0, or to INVOICED when it was DELINQUENT and Venue.outstanding_balance_cents is now <= DELINQUENCY_TOLERANCE_CENTS"
      - from: ISSUED
        to: ISSUED
        trigger: "POST /licensing/fee-assessments/{id}/pay with a part payment"
        actor: VenueOperator
        preconditions:
          - "FeeAssessment.status == ISSUED"
          - "X-User-ID == FeeAssessment.venue_id"
          - "the payment is short of the remainder: 0 < amount_cents < FeeAssessment.amount_cents - FeeAssessment.paid_amount_cents"
        side_effects:
          - "paid_amount_cents increases by amount_cents; status stays ISSUED; version increments by 1"
          - "Venue.settled_amount_cents increases by amount_cents; Venue.outstanding_balance_cents decreases by amount_cents; Venue.version increments by 1"
          - "the owning License's billing_status moves DELINQUENT -> INVOICED when Venue.outstanding_balance_cents is now <= DELINQUENCY_TOLERANCE_CENTS; it never reaches PAID on a part payment because an ISSUED assessment remains"
      - from: ISSUED
        to: VOIDED
        trigger: "system, POST /licensing/licenses/{id}/terminate with void_unpaid_assessments == true"
        actor: system
        preconditions:
          - "FeeAssessment.status == ISSUED"
          - "FeeAssessment.license_id == the License being terminated"
        side_effects:
          - "status = VOIDED; paid_amount_cents unchanged; version increments by 1"
          - "Venue.voided_amount_cents increases by (amount_cents - paid_amount_cents); Venue.outstanding_balance_cents decreases by the same amount"
      - from: ISSUED
        to: SETTLED
        trigger: "system, POST /licensing/audit-cases/{id}/settle"
        actor: system
        preconditions:
          - "FeeAssessment.status == ISSUED"
          - "FeeAssessment.audit_case_id == the AuditCase being settled"
        side_effects:
          - "status = SETTLED; paid_amount_cents = AuditCase.offered_amount_cents; version increments by 1"
          - "Venue.settled_amount_cents increases by paid_amount_cents; Venue.voided_amount_cents increases by (amount_cents - paid_amount_cents); Venue.outstanding_balance_cents decreases by amount_cents"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on a parent entity's version only)
# =============================================================================
concurrency_rules:
  - rule_id: application-create-stale-venue
    parent_entity: Venue
    write_endpoint: "POST /licensing/license-applications"
    occ_field: "expected_venue_version"
    description: |
      Creating a LicenseApplication against a Venue whose version has advanced
      since the client last read it is rejected. A create for a (venue_id,
      society_id) pair that already has a non-terminal application legitimately
      supersedes that application (the prior row transitions to WITHDRAWN), so a
      second create observes no blocking state field and would otherwise
      succeed; the stale-version check is what makes the outcome deterministic.
    error_id: ERR_STALE_VENUE_VERSION
    http_status: 412
  - rule_id: renewal-create-stale-license
    parent_entity: License
    write_endpoint: "POST /licensing/licenses/{id}/renew"
    occ_field: "expected_license_version"
    description: |
      Issuing a renewal against a License whose version has advanced since the
      client last read it is rejected. Rate-change re-rating (CASCADE-A LINK 2)
      silently rewrites annual_fee_cents and rate_schedule_id and bumps the
      row's version, so a renewal computed against the client's older view would
      quote a superseded rate; the stale-version check forces a re-read.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: annual_license_fee
    trigger: "LicenseApplication UNDER_REVIEW -> APPROVED (provisional_declared variant), License PENDING_ACTIVATION -> ACTIVE, CASCADE-A LINK 2 re-rating, and renewal issuance (final_verified variant)"
    algorithm: tiered_pricing
    formula: |
      # occupancy is the LARGER of the two capacities, never their sum
      occupancy      = max(seating, standing)
      tier           = TIER_1 if occupancy <= 100
                       TIER_2 if 101 <= occupancy <= 300
                       TIER_3 if 301 <= occupancy <= 750
                       TIER_4 if occupancy >= 751
      # STEP 1 - the two schedule-adjusted components are each rounded on their own
      base           = round_half_up(TIER_BASE_CENTS[tier] * schedule.adjustment_bp / 10000)
      seat_component = round_half_up(TIER_PER_OCCUPANT_CENTS[tier] * occupancy * schedule.adjustment_bp / 10000)
      # STEP 2 - the cover-charge component is NOT touched by adjustment_bp
      cover_component = round_half_up(cover_revenue_cents * TIER_COVER_RATE_BP[tier] / 10000)
      subtotal       = base + seat_component + cover_component
      # STEP 3 - use profile and live-night uplift are added in basis points, then applied once
      uplift_bp      = min(live_nights, 7) * LIVE_NIGHT_UPLIFT_BP
      multiplier_bp  = USE_PROFILE_MULTIPLIER_BP[music_use_profile] + uplift_bp
      scaled         = round_half_up(subtotal * multiplier_bp / 10000)
      # STEP 4 - the floor and ceiling are applied to the PRE-APPORTIONMENT amount
      clamped        = min(max(scaled, schedule.min_annual_fee_cents), schedule.max_annual_fee_cents)
      # STEP 5 - only then is the society's repertoire share applied; the result MAY fall below
      #          schedule.min_annual_fee_cents and that is correct
      annual_fee_cents = round_half_up(clamped * society.repertoire_share_bp / 10000)
      # A BGM_EXEMPT license short-circuits the whole formula to 0
      if license_type == BGM_EXEMPT: annual_fee_cents = 0
    input_set: "The pinned RateSchedule (rate_schedule_selection winner), the Society row named by society_id, and one of the two capacity/use input sets below. No other rows participate."
    constants:
      TIER_BASE_CENTS: { TIER_1: 42000, TIER_2: 78000, TIER_3: 145000, TIER_4: 265000 }
      TIER_PER_OCCUPANT_CENTS: { TIER_1: 180, TIER_2: 240, TIER_3: 310, TIER_4: 385 }
      TIER_COVER_RATE_BP: { TIER_1: 90, TIER_2: 135, TIER_3: 190, TIER_4: 250 }
      USE_PROFILE_MULTIPLIER_BP: { LIVE_ONLY: 11500, MIXED: 10000, RECORDED_ONLY: 8200, BACKGROUND_ONLY: 6000 }
      LIVE_NIGHT_UPLIFT_BP: 250
    precision: "integer cents; every round_half_up in the formula is to 0 decimal places, in the order shown"
    variants:
      - name: provisional_declared
        when: "LicenseApplication UNDER_REVIEW -> APPROVED; writes LicenseApplication.provisional_annual_fee_cents and License.provisional_annual_fee_cents"
        difference: "seating = declared_seating, standing = declared_standing, cover_revenue_cents = declared_cover_revenue_cents, live_nights = declared_live_nights, music_use_profile = declared_music_use_profile — every input comes from the operator's self-declaration on the application"
      - name: final_verified
        when: "License PENDING_ACTIVATION -> ACTIVE, CASCADE-A LINK 2 re-rating, renewal issuance, and back_license_exposure; writes License.annual_fee_cents"
        difference: "seating = Venue.seating_capacity, standing = Venue.standing_capacity, cover_revenue_cents = Venue.annual_cover_revenue_cents, live_nights = Venue.weekly_live_performance_nights, music_use_profile = Venue.music_use_profile — every input comes from the society's verified venue survey, so an understated declaration yields a strictly larger final fee"

  - name: repertoire_gap_share
    trigger: "CASCADE-B LINK 1 of POST /licensing/performance-reports/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      # per-entry weight, identical under both variants
      duration_weight(e) = min(ceil(e.duration_seconds / 60), DURATION_WEIGHT_CAP)
      use_weight(e)      = USE_TYPE_WEIGHT[e.use_type]
      weight(e)          = duration_weight(e) * use_weight(e)
      total_weight       = sum of weight(e) over every SetlistEntry attached to the report
      # empty-collection guard: a report with zero attached entries yields 0.00, never a division by zero
      if total_weight == 0: return 0.00
      share_pct          = round_half_up(sum of weight(e) over the variant's flagged set * 100 / total_weight, 2)
    input_set: "Every SetlistEntry with performance_report_id == this report, in created_at ASC order. RepertoireWork rows are consulted through repertoire_match_selection. License rows consulted for coverage are limited to those with venue_id == the report's venue and coverage_status == ACTIVE."
    constants:
      DURATION_WEIGHT_CAP: 10
      USE_TYPE_WEIGHT: { LIVE: 100, RECORDED: 40 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: title_match
        when: "writes PerformanceReport.unmatched_share_pct and PerformanceReport.matched_entry_count"
        difference: "the flagged set is the entries with is_matched == false, i.e. those for which repertoire_match_selection found no RepertoireWork row at all. An entry whose work IS registered counts as fine here even when the registering society holds no license on this venue."
      - name: affiliation_coverage
        when: "writes PerformanceReport.uncovered_share_pct, PerformanceReport.uncovered_entry_count and PerformanceReport.gap_exposure_cents, and feeds repertoire_gap_risk_score"
        difference: "the flagged set is the entries with is_covered == false, i.e. those whose society_affiliation is UNAFFILIATED or UNKNOWN, or names a Society for which this venue has no License with coverage_status == ACTIVE and an ACTIVE CoverageWindow spanning the entry's performance_datetime. A registered-but-unlicensed work is flagged here and not by title_match, so the two variants return different percentages for identical setlist data."

  - name: repertoire_gap_risk_score
    trigger: "CASCADE-B LINK 2 of report submission, and the SUBMITTED -> ACCEPTED / SUBMITTED -> REJECTED review transitions"
    algorithm: weighted_scoring
    formula: |
      # source report selector: exactly one report feeds the score
      candidates = PerformanceReport rows whose owning License has venue_id == this venue
                   AND status in {SUBMITTED, ACCEPTED}
      ranking    = period_end DESC, tie-break created_at DESC
      if candidates is empty: gap_risk_score = 0 and stop
      r = the top-ranked candidate
      distinct_uncovered_societies = count of distinct society_affiliation values
                                     among r's SetlistEntry rows with is_covered == false
                                     (UNAFFILIATED and UNKNOWN each count as one distinct value)
      gap_risk_score = min(100,
                           round_half_up(r.uncovered_share_pct * GAP_SHARE_WEIGHT
                                         + UNCOVERED_SOCIETY_PENALTY * distinct_uncovered_societies, 2))
      escalates = gap_risk_score >= GAP_ESCALATION_THRESHOLD
    input_set: "One PerformanceReport (the top-ranked candidate) plus its SetlistEntry rows. Reports with status DRAFT or REJECTED are excluded from the candidate set."
    constants:
      GAP_SHARE_WEIGHT: 0.8
      UNCOVERED_SOCIETY_PENALTY: 6
      GAP_ESCALATION_THRESHOLD: 60.00
    precision: "2 decimal places, round_half_up; hard ceiling at 100.00"

  - name: back_license_exposure
    trigger: "AuditCase OPEN -> FINDINGS_ISSUED"
    algorithm: chronological
    formula: |
      months = the whole calendar months of the half-open interval
               [lookback_start, lookback_end), walked oldest-first
      for each society S in AuditCase.society_ids (walked in Society.created_at ASC order):
        fee(S) = annual_license_fee/final_verified for (this Venue, S, the EFFECTIVE
                 RateSchedule for (S, Venue.venue_category) selected by rate_schedule_selection)
        # ROUNDING ORDER IS PINNED: round the monthly instalment FIRST, then sum the months.
        # "sum the months then round" is WRONG and yields a different total.
        monthly(S) = round_half_up(fee(S) / 12)
        for each month M in months:
          covered = exists a License with venue_id == this venue, society_id == S,
                    coverage_status in {ACTIVE, SUSPENDED, EXPIRED, TERMINATED} whose term
                    interval [term_start, term_end) contains the FIRST INSTANT of month M
          if not covered:
            unlicensed_month_count += 1
            exposure += monthly(S)
      back_license_exposure_cents = exposure
      penalty_bp = PENALTY_BP_BY_MONTHS[tier of unlicensed_month_count]
      penalty_cents = round_half_up(back_license_exposure_cents * penalty_bp / 10000)
      pre_credit_total_cents = back_license_exposure_cents + penalty_cents
    input_set: "Societies named in AuditCase.society_ids; every License of the audited venue regardless of coverage_status (a terminated licence still proves the month was covered); the currently EFFECTIVE RateSchedule per society."
    constants:
      PENALTY_BP_BY_MONTHS: { "months <= 6": 2500, "7 <= months <= 18": 5000, "months >= 19": 10000 }
    precision: "integer cents; monthly instalment rounded per month before summation"

  - name: settlement_target
    trigger: "AuditCase OPEN -> FINDINGS_ISSUED, immediately after back_license_exposure"
    algorithm: waterfall_allocation
    formula: |
      # The goodwill tier LOOKS circular (a credit against the total, keyed on a tier of the
      # total). Evaluation order is PINNED and the tier is never re-evaluated after the credit.
      # STEP 1
      pre_credit_total_cents = back_license_exposure_cents + penalty_cents
      # STEP 2 - tier selected from the PRE-credit total, once
      goodwill_bp = GOODWILL_BP_BY_PRE_CREDIT_TOTAL[tier of pre_credit_total_cents]
      # STEP 3
      goodwill_credit_cents = round_half_up(pre_credit_total_cents * goodwill_bp / 10000)
      # STEP 4 - the post-credit total NEVER re-enters STEP 2
      settlement_total_cents = pre_credit_total_cents - goodwill_credit_cents
      # STEP 5
      settlement_floor_cents = round_half_up(settlement_total_cents * SETTLEMENT_FLOOR_BP / 10000)
    input_set: "The AuditCase's own back_license_exposure_cents and penalty_cents only."
    constants:
      GOODWILL_BP_BY_PRE_CREDIT_TOTAL: { "total < 500000": 0, "500000 <= total < 2500000": 500, "2500000 <= total < 10000000": 1000, "total >= 10000000": 1500 }
      SETTLEMENT_FLOOR_BP: 6000
    precision: "integer cents, round_half_up"

  - name: bgm_exemption_determination
    trigger: "POST /licensing/venues/{id}/exemption-analysis"
    algorithm: threshold
    formula: |
      # evaluated top to bottom; the first matching clause wins
      if Venue.music_use_profile != BACKGROUND_ONLY:
        status = NOT_EXEMPT, reason = MUSIC_USE_PROFILE_INELIGIBLE
      elif Venue.uses_licensed_bgm_service == true:
        status = EXEMPT,     reason = LICENSED_SERVICE_PASSTHROUGH
      elif Venue.gross_square_feet is null or Venue.speaker_count is null
           or Venue.max_speakers_per_room is null:
        status = INCONCLUSIVE, reason = DATA_INCOMPLETE
      elif Venue.has_cover_charge == true:
        status = NOT_EXEMPT, reason = COVER_CHARGE_DISQUALIFIES
      elif Venue.retransmission_only == false:
        status = NOT_EXEMPT, reason = PERFORMANCE_NOT_RETRANSMISSION
      else:
        limit = FOOD_DRINK_SQFT_LIMIT if Venue.venue_category in {BAR_GRILL, RESTAURANT}
                else OTHER_ESTABLISHMENT_SQFT_LIMIT
        # boundary is INCLUSIVE: gross_square_feet == limit is exempt, limit + 1 is not
        if Venue.gross_square_feet > limit:
          status = NOT_EXEMPT, reason = SIZE_LIMIT_EXCEEDED
        elif Venue.speaker_count > MAX_TOTAL_SPEAKERS
             or Venue.max_speakers_per_room > MAX_SPEAKERS_PER_ROOM:
          status = NOT_EXEMPT, reason = SPEAKER_LIMIT_EXCEEDED
        else:
          status = EXEMPT,     reason = WITHIN_SIZE_AND_SPEAKER_LIMITS
    input_set: "The single Venue row addressed by the path; no other row participates."
    constants:
      FOOD_DRINK_SQFT_LIMIT: 3750
      OTHER_ESTABLISHMENT_SQFT_LIMIT: 2000
      MAX_TOTAL_SPEAKERS: 6
      MAX_SPEAKERS_PER_ROOM: 4
    precision: "exact integer comparisons; no rounding"

  - name: venue_coverage_posture
    trigger: "License activation, suspension, reinstatement, termination and expiry; CoverageWindow voiding"
    algorithm: aggregation
    formula: |
      covered_share_bp = sum of Society.repertoire_share_bp over the DISTINCT societies S
                         for which there exists a License with venue_id == this venue,
                         society_id == S, coverage_status == ACTIVE, and an ACTIVE
                         CoverageWindow whose half-open [window_start, window_end) contains
                         the logical clock instant
      coverage_posture = FULLY_COVERED     if covered_share_bp >= FULL_COVERAGE_THRESHOLD_BP
                         PARTIALLY_COVERED if 1 <= covered_share_bp < FULL_COVERAGE_THRESHOLD_BP
                         UNCOVERED         if covered_share_bp == 0
    input_set: "Licenses of this venue with coverage_status == ACTIVE only; PENDING_ACTIVATION, SUSPENDED, EXPIRED and TERMINATED licences contribute nothing. Each society is counted once even if it holds two licences."
    constants:
      FULL_COVERAGE_THRESHOLD_BP: 9500
    precision: "integer basis points; the FULLY_COVERED boundary is inclusive at exactly 9500"

  - name: venue_ledger_balances
    trigger: "Every FeeAssessment creation and every FeeAssessment status transition"
    algorithm: aggregation
    formula: |
      lifetime_assessed_cents   = sum of amount_cents over every FeeAssessment with this venue_id
                                  (all four statuses included; rows are never deleted)
      outstanding_balance_cents = sum of (amount_cents - paid_amount_cents) over FeeAssessment
                                  rows with this venue_id and status == ISSUED
      settled_amount_cents      = sum of paid_amount_cents over EVERY FeeAssessment row with
                                  this venue_id, whatever its status (a partial payment on a
                                  still-ISSUED row counts here immediately)
      voided_amount_cents       = sum of (amount_cents - paid_amount_cents) over FeeAssessment
                                  rows with this venue_id and status in {VOIDED, SETTLED}
      # LEDGER IDENTITY, invariant after every forward action and every compensating action:
      #   outstanding_balance_cents + settled_amount_cents + voided_amount_cents
      #     == lifetime_assessed_cents
      delinquent = outstanding_balance_cents > DELINQUENCY_TOLERANCE_CENTS
    input_set: "Every FeeAssessment row with venue_id == this venue, whatever its assessment_kind or status."
    constants:
      DELINQUENCY_TOLERANCE_CENTS: 250000
      RENEWAL_OUTSTANDING_LIMIT_CENTS: 100000
      REINSTATEMENT_BALANCE_LIMIT_CENTS: 100000
    precision: "integer cents; the delinquency comparison is strictly greater-than"

  - name: seasonal_rider_fee
    trigger: "POST /licensing/licenses/{id}/coverage-windows with window_kind == SEASONAL_EVENT_RIDER or FESTIVAL_RIDER"
    algorithm: prorata_interval
    formula: |
      covered_day_count = (window_end - window_start) in whole days   # half-open, so an
                          # interval ending exactly where the next begins is counted once
      # SINGLE rounding at the very end: the day fraction and the peak factor are combined
      # inside one expression, NOT rounded independently
      rider_fee_cents = round_half_up(license.annual_fee_cents * covered_day_count
                                      * SEASONAL_PEAK_BP / (TERM_DAYS * 10000))
    input_set: "The owning License's annual_fee_cents as it stands when the rider is created; a later re-rating does NOT retroactively change an existing rider's rider_fee_cents."
    constants:
      SEASONAL_PEAK_BP: 13500
      TERM_DAYS: 365
    precision: "integer cents, round_half_up, single rounding step"

  - name: rate_change_trueup
    trigger: "CASCADE-A LINK 3 of POST /licensing/rate-schedules/{id}/publish"
    algorithm: prorata_interval
    formula: |
      delta_cents    = new annual_fee_cents - previous annual_fee_cents
      if delta_cents <= 0: no assessment is created
      remaining_days = (license.term_end - logical clock instant) in whole days
      # single rounding at the end
      amount_cents   = round_half_up(delta_cents * remaining_days / TERM_DAYS)
      if amount_cents == 0: no assessment is created
    input_set: "One License being re-rated; the logical clock instant at publish time."
    constants:
      TERM_DAYS: 365
    precision: "integer cents, round_half_up, single rounding step"

  - name: rate_schedule_selection
    trigger: "LicenseApplication approval, License activation, CASCADE-A LINK 2 re-rating, renewal issuance, back_license_exposure"
    algorithm: selector
    formula: |
      eligibility: RateSchedule rows with society_id == the target society,
                   venue_category == Venue.venue_category, status == EFFECTIVE,
                   and effective_from <= logical clock instant
      ranking:     effective_from DESC, then schedule_version DESC
      tie_break:   created_at DESC
      fallback:    empty candidate set -> reject the request with
                   ERR_NO_EFFECTIVE_RATE_SCHEDULE (409)
    input_set: "RateSchedule rows only; DRAFT and SUPERSEDED schedules are never eligible."
    constants: {}
    precision: "n/a - selection, not arithmetic"

  - name: license_type_assignment
    trigger: "LicenseApplication UNDER_REVIEW -> APPROVED"
    algorithm: decision_table
    formula: |
      # first matching row wins; requested_license_type is only ever a hint
      1. Venue.bgm_exemption_status == EXEMPT                                  -> BGM_EXEMPT
      2. Venue.music_use_profile == BACKGROUND_ONLY                            -> BLANKET
      3. requested_license_type == SEASONAL_EVENT
         AND Venue.weekly_live_performance_nights <= 1                         -> SEASONAL_EVENT
      4. requested_license_type == PER_PROGRAM
         AND Venue.venue_category in {CONCERT_HALL, NIGHTCLUB}
         AND Venue.weekly_live_performance_nights <= 3                         -> PER_PROGRAM
      5. otherwise                                                             -> BLANKET
    input_set: "The Venue row and the application's requested_license_type; no other row participates."
    constants: {}
    precision: "n/a - enum assignment"

  - name: repertoire_match_selection
    trigger: "CASCADE-B LINK 1, once per attached SetlistEntry"
    algorithm: selector
    formula: |
      eligibility: RepertoireWork rows where lower(trim(title)) == lower(trim(entry.work_title))
                   AND lower(trim(writer_name)) == lower(trim(entry.writer_name))
      ranking:     created_at ASC
      tie_break:   Society.repertoire_share_bp DESC of the work's society, then
                   Society.society_code ASC (lexicographic)
      fallback:    empty candidate set -> is_matched = false, matched_work_id = null
      on match:    is_matched = true, matched_work_id = the winner's id
    input_set: "Every RepertoireWork row, regardless of which society registered it."
    constants: {}
    precision: "case-insensitive, whitespace-trimmed exact string equality; no fuzzy matching"

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing rule determines the response, later rules are not evaluated)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty, and X-User-Role is one of LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "The caller's role appears in the endpoint's allowed-role set in §1.7, and for a VenueOperator the addressed row resolves (directly, or through venue_id / license_id / performance_report_id) to a Venue whose id equals X-User-ID"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 3
    category: existence
    check: "Every id appearing in the URL path exists, validated left to right; the path's own resource is checked last"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_SOCIETY_NOT_FOUND | ERR_RATE_SCHEDULE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_COVERAGE_WINDOW_NOT_FOUND | ERR_WORK_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_SETLIST_ENTRY_NOT_FOUND | ERR_AUDIT_CASE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: business_referential
    check: "Every id supplied in the request BODY as a foreign key exists (venue_id, society_id, license_id, audit_case_id, society_ids[])"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_SOCIETY_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_AUDIT_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /licensing/rate-schedules, POST /licensing/license-applications, POST /licensing/repertoire-works, POST /licensing/performance-reports, POST /licensing/audit-cases"

  - priority: 5
    category: business_constraint
    check: "Request body parses, every required field is present and non-null, every enum field carries a declared value, every *_cents / *_bp / count field is a JSON integer >= 0, and every *_at / *_datetime / period_* / term_* / window_* field is an RFC 3339 UTC instant ending in Z"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 6
    category: business_constraint
    check: "expected_venue_version / expected_license_version, when the endpoint declares it in §1.2.1, matches the parent row's current version"
    error_id: "ERR_STALE_VENUE_VERSION | ERR_STALE_LICENSE_VERSION"
    http_status: 412
    applies_to: "POST /licensing/license-applications, POST /licensing/licenses/{license_id}/renew"

  - priority: 7
    category: state
    check: "The addressed License has coverage_status == ACTIVE"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /licensing/performance-reports, POST /licensing/performance-reports/{report_id}/submit, POST /licensing/licenses/{license_id}/coverage-windows"
    notes: "PRIORITY PAIR 1 (higher half). A submit request on a SUSPENDED licence whose reporting period also overlaps an existing SUBMITTED report fails HERE with ERR_LICENSE_NOT_ACTIVE, never with the priority-12 ERR_REPORT_PERIOD_OVERLAP."

  - priority: 8
    category: state
    check: "The addressed row is in the state the requested transition departs from: LicenseApplication is DRAFT for PATCH and submit, SUBMITTED or UNDER_REVIEW for review; RateSchedule is DRAFT for publish; License is PENDING_ACTIVATION for activate, SUSPENDED for reinstate, ACTIVE or SUSPENDED for terminate, ACTIVE or EXPIRED for renew; PerformanceReport is DRAFT or REJECTED for setlist-entry creation and DRAFT for submit, SUBMITTED for review; AuditCase is OPEN for findings, FINDINGS_ISSUED for settlement-offer, SETTLEMENT_PROPOSED for dispute and settle; FeeAssessment is ISSUED for pay"
    error_id: "ERR_APPLICATION_STATE_INVALID | ERR_RATE_SCHEDULE_NOT_DRAFT | ERR_LICENSE_STATE_INVALID | ERR_REPORT_STATE_INVALID | ERR_AUDIT_CASE_STATE_INVALID | ERR_ASSESSMENT_NOT_ISSUED"
    http_status: 409
    applies_to: "every action endpoint and every PATCH"

  - priority: 9
    category: business_safety
    check: "The governing Venue has audit_hold == false"
    error_id: ERR_AUDIT_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /licensing/license-applications/{application_id}/submit, POST /licensing/licenses/{license_id}/activate, POST /licensing/licenses/{license_id}/renew, POST /licensing/licenses/{license_id}/reinstate"
    notes: "PRIORITY PAIR 2 (higher half). A renew request on a venue that both carries audit_hold == true and owes more than RENEWAL_OUTSTANDING_LIMIT_CENTS fails HERE with ERR_AUDIT_HOLD_ACTIVE, never with the priority-16 ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL."

  - priority: 10
    category: business_safety
    check: "The acting X-User-ID is not the same user recorded in AuditCase.findings_issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /licensing/audit-cases/{audit_case_id}/settlement-offer, POST /licensing/audit-cases/{audit_case_id}/settle"

  - priority: 11
    category: business_temporal
    check: "Every declared half-open interval satisfies start < end strictly: period_start < period_end, term_start < term_end, window_start < window_end, lookback_start < lookback_end, effective_from is not null"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /licensing/rate-schedules, POST /licensing/license-applications, POST /licensing/licenses/{license_id}/coverage-windows, POST /licensing/performance-reports, POST /licensing/audit-cases"

  - priority: 12
    category: business_temporal
    check: "The new PerformanceReport's half-open [period_start, period_end) does not overlap the period of any other report on the same license_id whose status is DRAFT, SUBMITTED or ACCEPTED; an interval that begins exactly where an existing one ends does NOT overlap"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /licensing/performance-reports, POST /licensing/performance-reports/{report_id}/submit"
    notes: "PRIORITY PAIR 1 (lower half). REJECTED reports are excluded from the overlap set, so a rejected period may be re-reported."

  - priority: 13
    category: business_temporal
    check: "A new CoverageWindow's half-open [window_start, window_end) lies inside the owning License's [term_start, term_end) and does not overlap any ACTIVE window of the same license_id and window_kind; adjacency (next.window_start == prior.window_end) is allowed"
    error_id: "ERR_WINDOW_OUTSIDE_TERM | ERR_COVERAGE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "POST /licensing/licenses/{license_id}/coverage-windows"

  - priority: 14
    category: business_temporal
    check: "A renewal's requested_term_start equals the predecessor License's term_end exactly, to the instant"
    error_id: ERR_RENEWAL_TERM_MISMATCH
    http_status: 409
    applies_to: "POST /licensing/licenses/{license_id}/renew"

  - priority: 15
    category: business_temporal
    check: "Every SetlistEntry's performance_datetime lies inside the owning PerformanceReport's half-open [period_start, period_end)"
    error_id: ERR_ENTRY_OUTSIDE_PERIOD
    http_status: 409
    applies_to: "POST /licensing/performance-reports/{report_id}/setlist-entries"

  - priority: 16
    category: business_constraint
    check: "The predecessor License has renewal_issued_at == null, i.e. no successor has been issued against it yet; the successor itself is found through License.renewal_of_license_id"
    error_id: ERR_LICENSE_ALREADY_RENEWED
    http_status: 409
    applies_to: "POST /licensing/licenses/{license_id}/renew"

  - priority: 17
    category: business_constraint
    check: "Declared uniqueness holds: no other License exists for the same (venue_id, society_id) pair with coverage_status in {PENDING_ACTIVATION, ACTIVE, SUSPENDED} whose term interval overlaps the term being created or activated (a renewal that starts exactly at the predecessor's term_end is therefore legal), and no other Society already uses the requested society_code"
    error_id: "ERR_DUPLICATE_ACTIVE_LICENSE | ERR_DUPLICATE_SOCIETY_CODE"
    http_status: 409
    applies_to: "POST /licensing/societies, POST /licensing/license-applications/{application_id}/review with disposition APPROVE, POST /licensing/licenses/{license_id}/activate, POST /licensing/licenses/{license_id}/renew"

  - priority: 18
    category: business_constraint
    check: "rate_schedule_selection returns at least one candidate for the (society, venue_category) pair at the current logical clock instant"
    error_id: ERR_NO_EFFECTIVE_RATE_SCHEDULE
    http_status: 409
    applies_to: "POST /licensing/license-applications/{application_id}/review with disposition APPROVE, POST /licensing/licenses/{license_id}/activate, POST /licensing/licenses/{license_id}/renew, POST /licensing/audit-cases/{audit_case_id}/findings"

  - priority: 19
    category: business_constraint
    check: "AuditCase.dispute_round is strictly less than MAX_DISPUTE_ROUNDS (2) before a dispute is accepted. The parallel LicenseApplication bound is NOT a validation: a RETURN_FOR_REVISION on an application already at MAX_REVISION_ROUNDS (3) is honoured as a DECLINE with decline_reason REVISION_LIMIT_EXCEEDED rather than refused, so review never returns a limit error"
    error_id: ERR_DISPUTE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /licensing/audit-cases/{audit_case_id}/dispute"

  - priority: 20
    category: business_fiscal
    check: "Venue.outstanding_balance_cents is at most RENEWAL_OUTSTANDING_LIMIT_CENTS (100000)"
    error_id: ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL
    http_status: 409
    applies_to: "POST /licensing/licenses/{license_id}/renew"
    notes: "PRIORITY PAIR 2 (lower half). Reachable only when the venue's audit_hold is false, so the priority-9 rule always shadows it when both hold."

  - priority: 21
    category: business_fiscal
    check: "When the SUSPENDED License carries suspension_reason == NONPAYMENT, Venue.outstanding_balance_cents is at most REINSTATEMENT_BALANCE_LIMIT_CENTS (100000); a license suspended for AUDIT_FINDINGS or OPERATOR_REQUEST is not balance-gated"
    error_id: ERR_OUTSTANDING_BALANCE_BLOCKS_REINSTATEMENT
    http_status: 409
    applies_to: "POST /licensing/licenses/{license_id}/reinstate"

  - priority: 22
    category: business_fiscal
    check: "A settlement offer's offer_amount_cents is at least AuditCase.settlement_floor_cents"
    error_id: ERR_SETTLEMENT_BELOW_FLOOR
    http_status: 409
    applies_to: "POST /licensing/audit-cases/{audit_case_id}/settlement-offer"

  - priority: 23
    category: business_fiscal
    check: "A payment's amount_cents is at most (FeeAssessment.amount_cents - FeeAssessment.paid_amount_cents)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 409
    applies_to: "POST /licensing/fee-assessments/{assessment_id}/pay"

# =============================================================================
# Table 5: API Endpoint Table
# Every business collection lives under api_prefix /licensing. The single
# test-driving endpoint lives under the /_ namespace.
# =============================================================================
endpoints:
  # --- test-driving endpoint (logical clock) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical current UTC instant. The logical clock is the ONLY source of 'now' for term expiry, rate-schedule eligibility, coverage-window containment, due dates and audit lookbacks. Server startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time. Moving the clock does not by itself mutate any row; state changes still require the corresponding business call."
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock instant replaced; no row is written"]

  # --- Society -------------------------------------------------------------
  - method: POST
    path: "/licensing/societies"
    description: "Registers a performing-rights society with its repertoire share in basis points"
    roles: [LicensingAdmin]
    code: 201
    input: ["society_code", "display_name", "repertoire_share_bp", "rate_court_supervised?"]
    output: Society
    side_effects: []

  - method: GET
    path: "/licensing/societies"
    description: "Lists registered societies"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: ["society_code?", "limit?", "offset?"]
    output: Society[]
    side_effects: []

  - method: GET
    path: "/licensing/societies/{society_id}"
    description: "Reads one society, including its computed licensed_venue_count"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: []
    output: Society
    side_effects: []

  # --- RateSchedule --------------------------------------------------------
  - method: POST
    path: "/licensing/rate-schedules"
    description: "Creates a DRAFT rate schedule for one (society, venue_category) pair; schedule_version is assigned by the server as one more than the highest existing version for that pair"
    roles: [LicensingAdmin]
    code: 201
    input: ["society_id", "venue_category", "effective_from", "rate_court_order_ref?", "adjustment_bp?", "min_annual_fee_cents?", "max_annual_fee_cents?"]
    output: RateSchedule
    side_effects: ["schedule_version assigned"]

  - method: POST
    path: "/licensing/rate-schedules/{rate_schedule_id}/publish"
    description: "Publishes a DRAFT schedule (CASCADE-A trigger, depth 4)"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: RateSchedule
    side_effects:
      - "LINK 1: the prior EFFECTIVE schedule for the same (society_id, venue_category) becomes SUPERSEDED"
      - "LINK 2: every ACTIVE License pinned to the superseded schedule is re-pinned to this schedule and re-rated with annual_license_fee/final_verified; version bumps"
      - "LINK 3: each re-rated License with a positive delta gets a RATE_CHANGE_TRUEUP FeeAssessment (rate_change_trueup) in ISSUED"
      - "LINK 4: each affected Venue's ledger is recomputed by venue_ledger_balances and each License's billing_status moves INVOICED or DELINQUENT"
      - "pinned_license_count recomputed on both schedules"

  - method: GET
    path: "/licensing/rate-schedules"
    description: "Lists rate schedules, filterable by owning society, category and status"
    roles: [LicensingAdmin, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: ["society_id?", "venue_category?", "status?", "limit?", "offset?"]
    output: RateSchedule[]
    side_effects: []

  - method: GET
    path: "/licensing/rate-schedules/{rate_schedule_id}"
    description: "Reads one rate schedule"
    roles: [LicensingAdmin, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []

  # --- Venue ---------------------------------------------------------------
  - method: POST
    path: "/licensing/venues"
    description: "Registers a venue with its verified capacity and music-use survey data"
    roles: [LicensingAdmin]
    code: 201
    input: ["legal_name", "venue_category", "seating_capacity", "standing_capacity", "occupancy_limit", "music_use_profile", "weekly_live_performance_nights", "annual_cover_revenue_cents", "gross_square_feet?", "speaker_count?", "max_speakers_per_room?", "has_cover_charge?", "retransmission_only?", "uses_licensed_bgm_service?", "bgm_service_provider?", "status?"]
    output: Venue
    side_effects: []

  - method: PATCH
    path: "/licensing/venues/{venue_id}"
    description: "Updates the verified survey data of a venue; the OCC parent of license-application creation, so every successful call bumps version"
    roles: [LicensingAdmin]
    code: 200
    input: ["seating_capacity?", "standing_capacity?", "occupancy_limit?", "music_use_profile?", "weekly_live_performance_nights?", "annual_cover_revenue_cents?", "gross_square_feet?", "speaker_count?", "max_speakers_per_room?", "has_cover_charge?", "retransmission_only?", "uses_licensed_bgm_service?", "bgm_service_provider?", "status?"]
    output: Venue
    side_effects: ["version incremented; bgm_exemption_status and bgm_exemption_reason reset to NOT_ANALYZED and null"]

  - method: POST
    path: "/licensing/venues/{venue_id}/exemption-analysis"
    description: "Runs bgm_exemption_determination against the venue's current survey data and stores the verdict"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Venue
    side_effects: ["bgm_exemption_status and bgm_exemption_reason written; version incremented"]

  - method: GET
    path: "/licensing/venues"
    description: "Lists venues with their coverage posture, gap risk score and ledger balances"
    roles: [LicensingAdmin, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: ["venue_category?", "coverage_posture?", "audit_hold?", "status?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  - method: GET
    path: "/licensing/venues/{venue_id}"
    description: "Reads one venue, including covered_share_bp, coverage_posture, gap_risk_score, audit_hold and the four ledger fields"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # --- LicenseApplication --------------------------------------------------
  - method: POST
    path: "/licensing/license-applications"
    description: "Files a DRAFT license application against one venue and one society. expected_venue_version is the OCC guard declared in §1.2.1: it must equal the Venue's current version."
    roles: [VenueOperator, LicensingAdmin]
    code: 201
    input: ["venue_id", "society_id", "requested_license_type", "declared_seating", "declared_standing", "declared_cover_revenue_cents", "declared_live_nights", "declared_music_use_profile", "requested_term_start", "expected_venue_version"]
    output: LicenseApplication
    side_effects:
      - "Venue.version incremented"
      - "any other DRAFT LicenseApplication for the same (venue_id, society_id) becomes WITHDRAWN"

  - method: PATCH
    path: "/licensing/license-applications/{application_id}"
    description: "Revises the self-declared figures on a DRAFT application"
    roles: [VenueOperator, LicensingAdmin]
    code: 200
    input: ["requested_license_type?", "declared_seating?", "declared_standing?", "declared_cover_revenue_cents?", "declared_live_nights?", "declared_music_use_profile?", "requested_term_start?"]
    output: LicenseApplication
    side_effects: ["version incremented"]

  - method: POST
    path: "/licensing/license-applications/{application_id}/submit"
    description: "Submits a DRAFT or RETURNED_FOR_REVISION application for review"
    roles: [VenueOperator, LicensingAdmin]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["status becomes SUBMITTED; return_reason cleared to null"]

  - method: POST
    path: "/licensing/license-applications/{application_id}/review"
    description: "Advances review. disposition is one of ACCEPT_FOR_REVIEW, RETURN_FOR_REVISION, APPROVE, DECLINE."
    roles: [LicensingAdmin]
    code: 200
    input: ["disposition", "return_reason?", "decline_reason?"]
    output: LicenseApplication
    side_effects:
      - "ACCEPT_FOR_REVIEW: status becomes UNDER_REVIEW"
      - "RETURN_FOR_REVISION below the cap: revision_round incremented, return_reason stored, status becomes RETURNED_FOR_REVISION"
      - "RETURN_FOR_REVISION at revision_round == MAX_REVISION_ROUNDS: status becomes DECLINED with decline_reason REVISION_LIMIT_EXCEEDED"
      - "APPROVE: assigned_license_type set by license_type_assignment; rate_schedule_selection pins a schedule; provisional_annual_fee_cents computed by annual_license_fee/provisional_declared; a License row is created in PENDING_ACTIVATION / UNBILLED with term_start = requested_term_start and term_end = term_start + 365 days"
      - "DECLINE: decline_reason stored, status becomes DECLINED"

  - method: POST
    path: "/licensing/license-applications/{application_id}/withdraw"
    description: "Withdraws a DRAFT application"
    roles: [VenueOperator, LicensingAdmin]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: ["status becomes WITHDRAWN"]

  - method: GET
    path: "/licensing/license-applications"
    description: "Lists applications, filterable by venue, society and status"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: ["venue_id?", "society_id?", "status?", "limit?", "offset?"]
    output: LicenseApplication[]
    side_effects: []

  - method: GET
    path: "/licensing/license-applications/{application_id}"
    description: "Reads one application including its provisional fee and revision_round"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []

  # --- License -------------------------------------------------------------
  - method: POST
    path: "/licensing/licenses/{license_id}/activate"
    description: "Activates a PENDING_ACTIVATION license, re-rating it from the venue's VERIFIED survey data"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: License
    side_effects:
      - "annual_fee_cents computed by annual_license_fee/final_verified; verified_fee_delta_cents = annual_fee_cents - provisional_annual_fee_cents"
      - "coverage_status becomes ACTIVE; an ANNUAL_TERM CoverageWindow spanning [term_start, term_end) is created in ACTIVE"
      - "when license_type != BGM_EXEMPT a FeeAssessment of assessment_kind INITIAL (or RENEWAL when renewal_of_license_id is set) is issued for annual_fee_cents with due_date = the logical clock instant of issuance plus 30 days; a BGM_EXEMPT licence is activated with no assessment at all"
      - "billing_status becomes INVOICED, or DELINQUENT when the venue's outstanding balance passes DELINQUENCY_TOLERANCE_CENTS; a BGM_EXEMPT licence stays UNBILLED"
      - "Venue.covered_share_bp, coverage_posture and the four ledger fields recomputed; Society.licensed_venue_count recomputed"
      - "when renewal_of_license_id is set and the logical clock has reached the predecessor's term_end, the predecessor's coverage_status becomes EXPIRED"

  - method: POST
    path: "/licensing/licenses/{license_id}/suspend"
    description: "Suspends an ACTIVE license for non-payment or a compliance failure"
    roles: [LicensingAdmin]
    code: 200
    input: ["suspension_reason"]
    output: License
    side_effects:
      - "coverage_status becomes SUSPENDED; suspension_reason stored"
      - "Venue.covered_share_bp and coverage_posture recomputed (a SUSPENDED licence contributes nothing)"
      - "Society.licensed_venue_count recomputed"

  - method: POST
    path: "/licensing/licenses/{license_id}/reinstate"
    description: "Reinstates a SUSPENDED license; when it was suspended for NONPAYMENT the venue must owe at most REINSTATEMENT_BALANCE_LIMIT_CENTS"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: License
    side_effects:
      - "coverage_status becomes ACTIVE; suspension_reason cleared to null"
      - "Venue.covered_share_bp, coverage_posture and Society.licensed_venue_count recomputed"

  - method: POST
    path: "/licensing/licenses/{license_id}/terminate"
    description: "Terminates an ACTIVE or SUSPENDED license. void_unpaid_assessments is the compensating switch: when true every ISSUED FeeAssessment of this license is VOIDED and the ledger identity is preserved by moving the unpaid remainder into voided_amount_cents."
    roles: [LicensingAdmin]
    code: 200
    input: ["void_unpaid_assessments"]
    output: License
    side_effects:
      - "coverage_status becomes TERMINATED"
      - "every ACTIVE CoverageWindow of this license becomes VOIDED"
      - "when void_unpaid_assessments is true: every ISSUED FeeAssessment of this license becomes VOIDED and billing_status becomes WRITTEN_OFF"
      - "Venue.covered_share_bp, coverage_posture and the four ledger fields recomputed; Society.licensed_venue_count recomputed"

  - method: POST
    path: "/licensing/licenses/{license_id}/renew"
    description: "Issues the successor license for an ACTIVE or EXPIRED license. expected_license_version is the OCC guard declared in §1.2.1: it must equal the predecessor License's current version, which CASCADE-A silently bumps."
    roles: [LicensingAdmin]
    code: 201
    input: ["requested_term_start", "expected_license_version"]
    output: License
    side_effects:
      - "predecessor License.renewal_issued_at set and version incremented"
      - "a new License row is created in PENDING_ACTIVATION / UNBILLED with renewal_of_license_id = the predecessor, rate_schedule_id from a fresh rate_schedule_selection, term_start = requested_term_start, term_end = term_start + 365 days, and both fee fields computed by annual_license_fee/final_verified"

  - method: POST
    path: "/licensing/licenses/{license_id}/coverage-windows"
    description: "Attaches a coverage window to an ACTIVE license. window_kind is one of ANNUAL_TERM, SEASONAL_EVENT_RIDER, FESTIVAL_RIDER."
    roles: [LicensingAdmin]
    code: 201
    input: ["window_kind", "window_start", "window_end"]
    output: CoverageWindow
    side_effects:
      - "covered_day_count computed from the half-open interval"
      - "for SEASONAL_EVENT_RIDER and FESTIVAL_RIDER: rider_fee_cents computed by seasonal_rider_fee and a SEASONAL_RIDER FeeAssessment issued for that amount"
      - "Venue ledger fields recomputed; License.billing_status moves to INVOICED or DELINQUENT"

  - method: GET
    path: "/licensing/licenses/{license_id}/coverage-windows"
    description: "Lists the coverage windows of one license (reverse reachability for CoverageWindow.license_id)"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CoverageWindow[]
    side_effects: []

  - method: GET
    path: "/licensing/licenses"
    description: "Lists licenses, filterable by every foreign key they carry and by both state dimensions"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: ["venue_id?", "society_id?", "application_id?", "rate_schedule_id?", "renewal_of_license_id?", "coverage_status?", "billing_status?", "limit?", "offset?"]
    output: License[]
    side_effects: []

  - method: GET
    path: "/licensing/licenses/{license_id}"
    description: "Reads one license including both state dimensions and both fee figures"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/licensing/coverage-windows"
    description: "Lists coverage windows across licenses"
    roles: [LicensingAdmin, ComplianceAuditor]
    code: 200
    input: ["license_id?", "window_kind?", "status?", "limit?", "offset?"]
    output: CoverageWindow[]
    side_effects: []

  - method: GET
    path: "/licensing/coverage-windows/{coverage_window_id}"
    description: "Reads one coverage window including its computed rider fee"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: []
    output: CoverageWindow
    side_effects: []

  # --- RepertoireWork ------------------------------------------------------
  - method: POST
    path: "/licensing/repertoire-works"
    description: "Registers one work in a society's repertoire; immutable once created (no PATCH, no version)"
    roles: [LicensingAdmin]
    code: 201
    input: ["society_id", "title", "writer_name", "iswc?"]
    output: RepertoireWork
    side_effects: []

  - method: GET
    path: "/licensing/repertoire-works"
    description: "Lists registered works, filterable by registering society and exact title"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: ["society_id?", "title?", "limit?", "offset?"]
    output: RepertoireWork[]
    side_effects: []

  - method: GET
    path: "/licensing/repertoire-works/{repertoire_work_id}"
    description: "Reads one registered work"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: []
    output: RepertoireWork
    side_effects: []

  # --- PerformanceReport / SetlistEntry ------------------------------------
  - method: POST
    path: "/licensing/performance-reports"
    description: "Opens a DRAFT performance report for one reporting period of an ACTIVE license"
    roles: [VenueOperator, LicensingAdmin]
    code: 201
    input: ["license_id", "period_start", "period_end"]
    output: PerformanceReport
    side_effects: []

  - method: POST
    path: "/licensing/performance-reports/{report_id}/setlist-entries"
    description: "Appends one setlist entry to a DRAFT or REJECTED report. society_affiliation is one of BMI, ASCAP, SESAC, GMR, UNAFFILIATED, UNKNOWN; use_type is LIVE or RECORDED. Entries are immutable once created (no PATCH, no version)."
    roles: [VenueOperator, LicensingAdmin]
    code: 201
    input: ["work_title", "writer_name", "society_affiliation", "performance_datetime", "use_type", "duration_seconds"]
    output: SetlistEntry
    side_effects:
      - "PerformanceReport.reported_entry_count incremented"
      - "a REJECTED report returns to DRAFT and its rejection_reason is cleared to null"
      - "is_matched, matched_work_id and is_covered stay at their defaults until submission recomputes them"

  - method: GET
    path: "/licensing/performance-reports/{report_id}/setlist-entries"
    description: "Lists the setlist entries of one report (reverse reachability for SetlistEntry.performance_report_id)"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: SetlistEntry[]
    side_effects: []

  - method: POST
    path: "/licensing/performance-reports/{report_id}/submit"
    description: "Submits a DRAFT report (CASCADE-B trigger, depth 4). An empty setlist is accepted and yields zero shares."
    roles: [VenueOperator, LicensingAdmin]
    code: 200
    input: []
    output: PerformanceReport
    side_effects:
      - "LINK 1: every attached SetlistEntry is matched by repertoire_match_selection and coverage-tested; matched_entry_count, uncovered_entry_count, unmatched_share_pct, uncovered_share_pct and gap_exposure_cents written by repertoire_gap_share"
      - "LINK 2: Venue.gap_risk_score recomputed by repertoire_gap_risk_score"
      - "LINK 3: when the score reaches GAP_ESCALATION_THRESHOLD an AuditCase is created in OPEN with audit_trigger GAP_RISK_ESCALATION and Venue.audit_hold becomes true"
      - "LINK 4: while audit_hold is true every SUBMITTED or UNDER_REVIEW LicenseApplication of that venue becomes RETURNED_FOR_REVISION with return_reason AUDIT_HOLD, or DECLINED with decline_reason REVISION_LIMIT_EXCEEDED when already at MAX_REVISION_ROUNDS"
      - "status becomes SUBMITTED"

  - method: POST
    path: "/licensing/performance-reports/{report_id}/review"
    description: "Reviews a SUBMITTED report. disposition is ACCEPT or REJECT; rejection_reason is one of INCOMPLETE_SETLIST, PERIOD_MISMATCH, EXCESSIVE_UNMATCHED."
    roles: [LicensingAdmin, ComplianceAuditor]
    code: 200
    input: ["disposition", "rejection_reason?"]
    output: PerformanceReport
    side_effects:
      - "ACCEPT: status becomes ACCEPTED and License.accepted_report_count is incremented"
      - "REJECT: status becomes REJECTED, rejection_reason stored, review_round incremented, and Venue.gap_risk_score is recomputed from the remaining SUBMITTED or ACCEPTED reports"

  - method: GET
    path: "/licensing/performance-reports"
    description: "Lists performance reports, filterable by license and status"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: ["license_id?", "status?", "limit?", "offset?"]
    output: PerformanceReport[]
    side_effects: []

  - method: GET
    path: "/licensing/performance-reports/{report_id}"
    description: "Reads one report including both computed gap shares and gap_exposure_cents"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: []
    output: PerformanceReport
    side_effects: []

  - method: GET
    path: "/licensing/setlist-entries"
    description: "Lists setlist entries across reports, filterable by report, matched work and coverage flag"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: ["performance_report_id?", "matched_work_id?", "is_matched?", "is_covered?", "limit?", "offset?"]
    output: SetlistEntry[]
    side_effects: []

  - method: GET
    path: "/licensing/setlist-entries/{setlist_entry_id}"
    description: "Reads one setlist entry including its match and coverage verdict"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor]
    code: 200
    input: []
    output: SetlistEntry
    side_effects: []

  # --- AuditCase -----------------------------------------------------------
  - method: POST
    path: "/licensing/audit-cases"
    description: "Opens an audit case over a lookback interval. audit_trigger is one of ROUTINE, GAP_RISK_ESCALATION, COMPLAINT."
    roles: [ComplianceAuditor]
    code: 201
    input: ["venue_id", "audit_trigger", "lookback_start", "lookback_end", "society_ids"]
    output: AuditCase
    side_effects: ["Venue.audit_hold becomes true"]

  - method: POST
    path: "/licensing/audit-cases/{audit_case_id}/findings"
    description: "Issues findings on an OPEN case: computes back-license exposure, penalty and the settlement target, and bills the pre-credit total"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects:
      - "unlicensed_month_count, back_license_exposure_cents and penalty_cents written by back_license_exposure"
      - "pre_credit_total_cents, goodwill_credit_cents, settlement_total_cents and settlement_floor_cents written by settlement_target"
      - "findings_issued_by_user_id set to the acting X-User-ID"
      - "a FeeAssessment of assessment_kind AUDIT_BACK_LICENSE is issued for pre_credit_total_cents with due_date = the logical clock instant + 30 days"
      - "Venue ledger fields recomputed; status becomes FINDINGS_ISSUED"

  - method: POST
    path: "/licensing/audit-cases/{audit_case_id}/close"
    description: "Closes an OPEN case with no action. closed_reason is one of NO_GAP_FOUND, WITHIN_TOLERANCE."
    roles: [ComplianceAuditor]
    code: 200
    input: ["closed_reason"]
    output: AuditCase
    side_effects: ["status becomes CLOSED_NO_ACTION; Venue.audit_hold becomes false when no other non-terminal AuditCase remains for that venue"]

  - method: POST
    path: "/licensing/audit-cases/{audit_case_id}/settlement-offer"
    description: "Proposes a settlement on a FINDINGS_ISSUED or DISPUTED case; the offer must be at least settlement_floor_cents and the proposer must not be the auditor who issued the findings"
    roles: [SettlementOfficer]
    code: 200
    input: ["offer_amount_cents", "payment_plan_months?"]
    output: AuditCase
    side_effects: ["offered_amount_cents and payment_plan_months stored; settlement_proposed_by_user_id set; status becomes SETTLEMENT_PROPOSED"]

  - method: POST
    path: "/licensing/audit-cases/{audit_case_id}/dispute"
    description: "Disputes a proposed settlement, sending the case back for a fresh offer; bounded by MAX_DISPUTE_ROUNDS"
    roles: [VenueOperator, LicensingAdmin]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["dispute_round incremented; offered_amount_cents and payment_plan_months cleared to null; status becomes DISPUTED"]

  - method: POST
    path: "/licensing/audit-cases/{audit_case_id}/settle"
    description: "Accepts the standing offer and closes the case; the acceptor must not be the auditor who issued the findings"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: AuditCase
    side_effects:
      - "the case's AUDIT_BACK_LICENSE FeeAssessment moves ISSUED -> SETTLED with paid_amount_cents = offered_amount_cents, so the unpaid remainder lands in the venue's voided_amount_cents and the ledger identity still holds"
      - "settled_by_user_id set; status becomes SETTLED"
      - "Venue.audit_hold becomes false when no other non-terminal AuditCase remains for that venue; Venue ledger fields recomputed"
      - "License.billing_status of the venue's licenses moves DELINQUENT -> INVOICED when the outstanding balance falls back to at most DELINQUENCY_TOLERANCE_CENTS while an ISSUED assessment remains"

  - method: GET
    path: "/licensing/audit-cases"
    description: "Lists audit cases, filterable by venue, trigger and status"
    roles: [LicensingAdmin, ComplianceAuditor, SettlementOfficer, VenueOperator]
    code: 200
    input: ["venue_id?", "audit_trigger?", "status?", "limit?", "offset?"]
    output: AuditCase[]
    side_effects: []

  - method: GET
    path: "/licensing/audit-cases/{audit_case_id}"
    description: "Reads one audit case including the whole exposure and settlement waterfall"
    roles: [LicensingAdmin, ComplianceAuditor, SettlementOfficer, VenueOperator]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  # --- FeeAssessment -------------------------------------------------------
  - method: POST
    path: "/licensing/fee-assessments/{assessment_id}/pay"
    description: "Records a payment against an ISSUED assessment; a payment for exactly the outstanding remainder moves it to PAID"
    roles: [VenueOperator, LicensingAdmin]
    code: 200
    input: ["amount_cents"]
    output: FeeAssessment
    side_effects:
      - "paid_amount_cents increased; status becomes PAID when paid_amount_cents reaches amount_cents"
      - "Venue ledger fields recomputed"
      - "the owning License's billing_status moves to PAID when its last ISSUED assessment clears, or DELINQUENT -> INVOICED when the balance falls back to at most DELINQUENCY_TOLERANCE_CENTS"

  - method: GET
    path: "/licensing/fee-assessments"
    description: "Lists fee assessments, filterable by every foreign key they carry, by kind and by status"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: ["venue_id?", "license_id?", "audit_case_id?", "assessment_kind?", "status?", "limit?", "offset?"]
    output: FeeAssessment[]
    side_effects: []

  - method: GET
    path: "/licensing/fee-assessments/{assessment_id}"
    description: "Reads one fee assessment"
    roles: [LicensingAdmin, VenueOperator, ComplianceAuditor, SettlementOfficer]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization --------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role missing, empty, or X-User-Role not one of the four declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The caller's role is not allowed on this endpoint, or a VenueOperator addresses a row that does not resolve to the Venue whose id equals X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The X-User-ID proposing or accepting a settlement equals AuditCase.findings_issued_by_user_id" }

  # --- existence -----------------------------------------------------------
  - { id: ERR_SOCIETY_NOT_FOUND, http: 404, condition: "society_id in the path or body matches no Society row" }
  - { id: ERR_RATE_SCHEDULE_NOT_FOUND, http: 404, condition: "rate_schedule_id in the path matches no RateSchedule row" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "venue_id in the path or body matches no Venue row" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application_id in the path matches no LicenseApplication row" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "license_id in the path or body matches no License row" }
  - { id: ERR_COVERAGE_WINDOW_NOT_FOUND, http: 404, condition: "coverage_window_id in the path matches no CoverageWindow row" }
  - { id: ERR_WORK_NOT_FOUND, http: 404, condition: "repertoire_work_id in the path matches no RepertoireWork row" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "report_id in the path matches no PerformanceReport row" }
  - { id: ERR_SETLIST_ENTRY_NOT_FOUND, http: 404, condition: "setlist_entry_id in the path matches no SetlistEntry row" }
  - { id: ERR_AUDIT_CASE_NOT_FOUND, http: 404, condition: "audit_case_id in the path or body matches no AuditCase row" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "assessment_id in the path matches no FeeAssessment row" }

  # --- request shape -------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Unparseable body, missing or null required field, undeclared enum value, negative or non-integer *_cents / *_bp / count field, non-RFC-3339-UTC instant, disposition without its mandatory companion reason, or a pagination limit outside 1..100" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "A declared half-open interval has start >= end (period, term, window or lookback)" }

  # --- concurrency ---------------------------------------------------------
  - { id: ERR_STALE_VENUE_VERSION, http: 412, condition: "expected_venue_version on license-application creation does not equal the Venue's current version" }
  - { id: ERR_STALE_LICENSE_VERSION, http: 412, condition: "expected_license_version on renewal does not equal the predecessor License's current version" }

  # --- state preconditions -------------------------------------------------
  - { id: ERR_RATE_SCHEDULE_NOT_DRAFT, http: 409, condition: "publish addressed a schedule whose status is not DRAFT" }
  - { id: ERR_APPLICATION_STATE_INVALID, http: 409, condition: "The application is not in a state this transition departs from (PATCH or submit on a non-DRAFT / non-RETURNED_FOR_REVISION row, review on a row that is neither SUBMITTED nor UNDER_REVIEW, withdraw on a non-DRAFT row)" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "The addressed License's coverage_status is not ACTIVE when opening or submitting a performance report, or when attaching a coverage window" }
  - { id: ERR_LICENSE_STATE_INVALID, http: 409, condition: "The License is not in a state this transition departs from (activate on a non-PENDING_ACTIVATION row, reinstate on a non-SUSPENDED row, suspend on a non-ACTIVE row, terminate on a row that is neither ACTIVE nor SUSPENDED, renew on a row that is neither ACTIVE nor EXPIRED)" }
  - { id: ERR_REPORT_STATE_INVALID, http: 409, condition: "The report is not in a state this transition departs from (setlist-entry creation on a row that is neither DRAFT nor REJECTED, submit on a non-DRAFT row, review on a non-SUBMITTED row)" }
  - { id: ERR_AUDIT_CASE_STATE_INVALID, http: 409, condition: "The audit case is not in a state this transition departs from (findings or close on a non-OPEN row, settlement-offer on a row that is neither FINDINGS_ISSUED nor DISPUTED, dispute or settle on a non-SETTLEMENT_PROPOSED row)" }
  - { id: ERR_ASSESSMENT_NOT_ISSUED, http: 409, condition: "pay addressed a FeeAssessment whose status is not ISSUED" }

  # --- compliance / safety -------------------------------------------------
  - { id: ERR_AUDIT_HOLD_ACTIVE, http: 409, condition: "The governing Venue has audit_hold == true when submitting an application, or activating, renewing or reinstating a license" }

  # --- temporal and uniqueness constraints ---------------------------------
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "The new report's half-open period overlaps another DRAFT, SUBMITTED or ACCEPTED report of the same license" }
  - { id: ERR_WINDOW_OUTSIDE_TERM, http: 409, condition: "The coverage window's half-open interval is not fully contained in the owning License's [term_start, term_end)" }
  - { id: ERR_COVERAGE_WINDOW_OVERLAP, http: 409, condition: "The coverage window overlaps an ACTIVE window of the same license and window_kind; exact adjacency does not trigger this" }
  - { id: ERR_RENEWAL_TERM_MISMATCH, http: 409, condition: "A renewal's requested_term_start is not exactly the predecessor License's term_end" }
  - { id: ERR_ENTRY_OUTSIDE_PERIOD, http: 409, condition: "A setlist entry's performance_datetime falls outside the report's half-open period" }
  - { id: ERR_LICENSE_ALREADY_RENEWED, http: 409, condition: "The predecessor License already has a successor (renewed_into_license_id is set)" }
  - { id: ERR_DUPLICATE_ACTIVE_LICENSE, http: 409, condition: "Another PENDING_ACTIVATION, ACTIVE or SUSPENDED License for the same (venue, society) pair has an overlapping term" }
  - { id: ERR_DUPLICATE_SOCIETY_CODE, http: 409, condition: "Another Society already uses the requested society_code" }
  - { id: ERR_NO_EFFECTIVE_RATE_SCHEDULE, http: 409, condition: "rate_schedule_selection found no EFFECTIVE schedule for the (society, venue_category) pair at the current logical clock instant" }
  - { id: ERR_DISPUTE_LIMIT_REACHED, http: 409, condition: "A dispute was raised on an audit case already at MAX_DISPUTE_ROUNDS (2)" }

  # --- fiscal --------------------------------------------------------------
  - { id: ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL, http: 409, condition: "Venue.outstanding_balance_cents exceeds RENEWAL_OUTSTANDING_LIMIT_CENTS at renewal time" }
  - { id: ERR_OUTSTANDING_BALANCE_BLOCKS_REINSTATEMENT, http: 409, condition: "Reinstating a License suspended for NONPAYMENT while Venue.outstanding_balance_cents exceeds REINSTATEMENT_BALANCE_LIMIT_CENTS" }
  - { id: ERR_SETTLEMENT_BELOW_FLOOR, http: 409, condition: "offer_amount_cents is below AuditCase.settlement_floor_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 409, condition: "A payment exceeds the assessment's unpaid remainder (amount_cents - paid_amount_cents)" }

# =============================================================================
# Table 7: RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: LicensingAdmin
    description: "Society-side licensing administrator: maintains societies, rate schedules, venue survey records, and the whole licence lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /licensing/societies"
      - "POST /licensing/rate-schedules"
      - "POST /licensing/rate-schedules/{rate_schedule_id}/publish"
      - "POST /licensing/venues"
      - "PATCH /licensing/venues/{venue_id}"
      - "POST /licensing/venues/{venue_id}/exemption-analysis"
      - "POST /licensing/license-applications/{application_id}/review"
      - "POST /licensing/licenses/{license_id}/activate"
      - "POST /licensing/licenses/{license_id}/suspend"
      - "POST /licensing/licenses/{license_id}/reinstate"
      - "POST /licensing/licenses/{license_id}/terminate"
      - "POST /licensing/licenses/{license_id}/renew"
      - "POST /licensing/licenses/{license_id}/coverage-windows"
      - "POST /licensing/repertoire-works"
    shared_operations:
      - "POST /licensing/license-applications and PATCH, submit, withdraw on it (shared with VenueOperator)"
      - "POST /licensing/performance-reports, its setlist-entries and submit (shared with VenueOperator)"
      - "POST /licensing/performance-reports/{report_id}/review (shared with ComplianceAuditor)"
      - "POST /licensing/audit-cases/{audit_case_id}/dispute (shared with VenueOperator)"
      - "POST /licensing/fee-assessments/{assessment_id}/pay (shared with VenueOperator)"
      - "every GET under /licensing"
      - "POST /_clock/set_current_utc"

  - name: VenueOperator
    description: "Operator acting for one venue: files applications, reports performances, pays assessments and disputes settlements. X-User-ID is the Venue's id."
    identity: "entity_backed:Venue"
    exclusive_operations: []
    shared_operations:
      - "POST /licensing/license-applications and PATCH, submit, withdraw on it, restricted to applications whose venue_id equals X-User-ID (shared with LicensingAdmin)"
      - "POST /licensing/performance-reports, its setlist-entries and submit, restricted to reports whose license resolves to X-User-ID (shared with LicensingAdmin)"
      - "POST /licensing/audit-cases/{audit_case_id}/dispute, restricted to cases whose venue_id equals X-User-ID (shared with LicensingAdmin)"
      - "POST /licensing/fee-assessments/{assessment_id}/pay, restricted to assessments whose venue_id equals X-User-ID (shared with LicensingAdmin)"
      - "GET on /licensing/societies, /licensing/venues/{venue_id}, /licensing/licenses, /licensing/license-applications, /licensing/performance-reports, /licensing/setlist-entries, /licensing/coverage-windows, /licensing/repertoire-works, /licensing/audit-cases and /licensing/fee-assessments, always narrowed to rows resolving to X-User-ID"
      - "POST /_clock/set_current_utc"

  - name: ComplianceAuditor
    description: "Audit-side investigator: opens audit cases, issues findings and closes cases without action. Never negotiates money."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/audit-cases"
      - "POST /licensing/audit-cases/{audit_case_id}/findings"
      - "POST /licensing/audit-cases/{audit_case_id}/close"
    shared_operations:
      - "POST /licensing/performance-reports/{report_id}/review (shared with LicensingAdmin)"
      - "every GET under /licensing"
      - "POST /_clock/set_current_utc"

  - name: SettlementOfficer
    description: "Settlement-side negotiator: proposes and accepts settlements. Segregation of duties — must not be the ComplianceAuditor user who issued the findings on the same case."
    identity: opaque
    exclusive_operations:
      - "POST /licensing/audit-cases/{audit_case_id}/settlement-offer"
      - "POST /licensing/audit-cases/{audit_case_id}/settle"
    shared_operations:
      - "GET on /licensing/societies, /licensing/rate-schedules, /licensing/venues, /licensing/licenses, /licensing/audit-cases and /licensing/fee-assessments"
      - "POST /_clock/set_current_utc"
