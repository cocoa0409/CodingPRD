  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: unauthenticated_and_unknown_identity_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Two auth failures at priority 1: a request without role headers, and an entity-backed role whose X-User-ID names no PartyProfile, both yield 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/cases"
              captures: { err1: $.data.error_id }
            - call: "GET /api/cases"
              as: Party
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err2: $.data.error_id }
          assert:
            - "no-header request rejected 401 ERR_UNAUTHENTICATED"
            - "entity-backed role with unknown X-User-ID rejected 401 ERR_UNAUTHENTICATED (identity must resolve to a PartyProfile)"

      - name: party_role_cannot_create_case_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Party is not in POST /api/cases roles; the 403 ERR_FORBIDDEN_ROLE fires at priority 2 even with an otherwise valid body."
        test_recipe:
          setup: ["three profiles exist"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
          trigger:
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: Party
              as_user_id: "${comp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 403 ERR_FORBIDDEN_ROLE; GET /api/cases total_count == 0"

      - name: party_read_unaffiliated_case_denied
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_CASE_ACCESS_DENIED]"]
        distinguishing_aspect: "A Party whose id is neither complainant nor respondent on the case gets 403 ERR_CASE_ACCESS_DENIED on read - affiliation scoping, not just role scoping."
        test_recipe:
          setup: ["case between comp/resp exists; outsider student profile exists"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Outsider", university_id: "U-OUT-1", role_type: "STUDENT", email: "out@example.edu" }, as: CaseAdministrator, captures: { out_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
          trigger:
            - { call: "GET /api/cases/${case_id}", as: Party, as_user_id: "${out_id}", captures: { err: $.data.error_id } }
          assert:
            - "rejected 403 ERR_CASE_ACCESS_DENIED"

      - name: cross_party_supportive_measure_read_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SUPPORTIVE_MEASURE_CONFIDENTIAL]"]
        distinguishing_aspect: "A COMPLAINANT-scoped measure is invisible to the respondent: single-read 403 ERR_SUPPORTIVE_MEASURE_CONFIDENTIAL and the party-scoped list excludes it while staff see it."
        test_recipe:
          setup: ["case with one COMPLAINANT-scoped measure"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - call: "POST /api/cases/${case_id}/supportive-measures"
              payload: { measure_type: "COUNSELING", party_side: "COMPLAINANT", description: "Counseling referral", effective_from: "2026-08-01T00:00:00Z" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { m_id: $.data.id }
          trigger:
            - { call: "GET /api/supportive-measures/${m_id}", as: Party, as_user_id: "${resp_id}", captures: { err: $.data.error_id } }
            - { call: "GET /api/cases/${case_id}/supportive-measures", as: Party, as_user_id: "${resp_id}" }
            - { call: "GET /api/cases/${case_id}/supportive-measures", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          assert:
            - "single-read by respondent rejected 403 ERR_SUPPORTIVE_MEASURE_CONFIDENTIAL"
            - "respondent list returns 0 rows (confidential measure filtered); coordinator list returns 1 row"

      - name: interview_notice_before_allegations_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_NOTICE_ORDER_VIOLATION]"]
        distinguishing_aspect: "Notice ordering: INTERVIEW before any ALLEGATIONS notice exists is rejected even when the lead time itself would be sufficient."
        test_recipe:
          setup: ["case in JURISDICTION_REVIEW (no formal complaint, hence no ALLEGATIONS notice)"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /api/cases/${case_id}/notices", payload: { notice_type: "INTERVIEW", recipient_side: "RESPONDENT", body: "Come in", scheduled_event_at: "2026-08-20T10:00:00Z" }, as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { err: $.data.error_id } }
          assert:
            - "rejected 422 ERR_NOTICE_ORDER_VIOLATION (ALLEGATIONS must precede any INTERVIEW notice)"

      - name: informal_resolution_employee_respondent_prohibited
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_INFORMAL_RESOLUTION_PROHIBITED]"]
        distinguishing_aspect: "Conditional safety rule: informal resolution is prohibited exactly when respondent is EMPLOYEE and complainant is STUDENT - the same proposal on an all-student case succeeds."
        test_recipe:
          setup: ["case in INVESTIGATION with EMPLOYEE respondent and STUDENT complainant, formal complaint signed"]
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
