# =============================================================================
# Task 1891 — Diaper Bank & Baby Supply Distribution
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 following references/claim-extraction-guide.md.
# All chains assume the logical clock default 2026-08-01T00:00:00Z unless set.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: agency_creation_applies_defaults
        claim_type: creation
        grounds: [entities.PartnerAgency]
        distinguishing_aspect: "Create with required inputs only -> 201, status defaults to ACTIVE, computed active_allocated_units == 0, version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /partner-agencies"
              payload: { name: "Agency N", agency_code: "AG-N", contact_email: "n@x.org", children_served_monthly: 120, storage_capacity_units: 5000 }
              as: BankAdmin
              captures: { ag: $.data.id, st: $.data.status, au: $.data.active_allocated_units, v: $.data.version }
          assert:
            - "status == ACTIVE (default applied)"
            - "active_allocated_units == 0 (computed field initialized)"
            - "version == 1 and id/created_at/updated_at server-minted"

      - name: duplicate_agency_code_rejected
        claim_type: type_constraints
        grounds: ["entities.PartnerAgency.fields.agency_code", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "Second create reusing agency_code -> 409 ERR_DUPLICATE_CODE."
        test_recipe:
          setup: ["Agency AG-DUP exists"]
          setup_api_calls:
            - call: "POST /partner-agencies"
              payload: { name: "Agency D1", agency_code: "AG-DUP", contact_email: "d1@x.org", children_served_monthly: 10, storage_capacity_units: 100 }
              as: BankAdmin
          trigger:
            - call: "POST /partner-agencies"
              payload: { name: "Agency D2", agency_code: "AG-DUP", contact_email: "d2@x.org", children_served_monthly: 20, storage_capacity_units: 200 }
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert: ["409 ERR_DUPLICATE_CODE; only one agency with that code exists"]

      - name: grant_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /grants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert: ["404 ERR_NOT_FOUND"]

      - name: inventory_initialize_materializes_all_sizes
        claim_type: computed_fields
        grounds: [entities.Inventory]
        distinguishing_aspect: "Initialize creates entries for all 8 SIZE_CODEs at 0/0 with available 0 and restock flags from thresholds; total_on_hand_units == 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /inventory/initialize"
              payload: { thresholds: { SIZE_1: 200 } }
              as: WarehouseManager
              captures: { inv_v: $.data.version, tot: $.data.total_on_hand_units }
          assert:
            - "sizes contains all 8 SIZE_CODEs; every size on_hand_units == 0, reserved_units == 0, available_units == 0"
            - "sizes.SIZE_1.reorder_threshold_units == 200; omitted sizes default to 0"
            - "sizes.SIZE_1.restock_needed == true (0 <= 200); sizes.SIZE_2.restock_needed == true (0 <= 0)"
            - "total_on_hand_units == 0; version == 1"

      - name: intake_batch_invalid_size_code_rejected
        claim_type: type_constraints
        grounds: ["entities.IntakeBatch.fields.lines", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "lines entry with size_code SIZE_9 (not in enum) -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor Bad", lines: [{ size_code: "SIZE_9", quantity: 5 }] }
              as: WarehouseManager
              captures: { err: $.data.error_id }
          assert: ["400 ERR_VALIDATION; no batch persisted"]

      - name: intake_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "limit=1 returns one item with total_count == 2 and has_more == true; pagination envelope fields all present."
        test_recipe:
          setup: ["Two donation batches exist"]
          setup_api_calls:
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor P1", lines: [{ size_code: "SIZE_1", quantity: 10 }] }
              as: WarehouseManager
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor P2", lines: [{ size_code: "SIZE_2", quantity: 20 }] }
              as: WarehouseManager
          trigger:
            - call: "GET /intake-batches"
              payload: { limit: 1 }
              as: WarehouseManager
          assert:
            - "data array length == 1"
            - "total_count == 2 and has_more == true (limit 1, offset 0)"

      - name: household_creation_pseudonymous_shape
        claim_type: creation
        grounds: [entities.ClientHousehold]
        distinguishing_aspect: "Household create -> eligibility_status PENDING_REVIEW default, monthly_allotment_units == 50 * len(children_sizes); the entity surface carries no name/address/PII fields at all (dignity policy)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { household_code: "HH-NEW", children_sizes: ["SIZE_1", "SIZE_3", "SIZE_5"] }
              as: PrivacyOfficer
              captures: { hh: $.data.id, es: $.data.eligibility_status, allot: $.data.monthly_allotment_units }
          assert:
            - "eligibility_status == PENDING_REVIEW (initial state)"
            - "consent_on_file == false and privacy_restricted == false (defaults)"
            - "monthly_allotment_units == 150 (3 children * 50)"
            - "Response object has no name/address/phone fields — household_code is the only identifier"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: batch_initial_state_is_counted
        claim_type: initial_state
        grounds: [state_machines.IntakeBatch]
        distinguishing_aspect: "Donation batch creation lands in COUNTED (not POSTED); no stock movement until post."
        test_recipe:
          setup: ["Inventory initialized"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
          trigger:
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor I", lines: [{ size_code: "SIZE_1", quantity: 100 }] }
              as: WarehouseManager
              captures: { b1: $.data.id, st: $.data.status }
            - { call: "GET /inventory", payload: {}, as: WarehouseManager }
          assert:
            - "Batch status == COUNTED on creation"
            - "Inventory.sizes.SIZE_1.on_hand_units == 0 (nothing posted yet)"

      - name: event_cancel_after_complete_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.DistributionEvent", "errors[ERR_INVALID_EVENT_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel after complete -> 409 ERR_INVALID_EVENT_STATE."
        test_recipe:
          setup: ["Agency ACTIVE; event opened, locked, completed with zero issuances"]
          setup_api_calls:
            - call: "POST /partner-agencies"
              payload: { name: "Agency T", agency_code: "AG-T", contact_email: "t@x.org", children_served_monthly: 100, storage_capacity_units: 10000 }
              as: BankAdmin
              captures: { ag_t: $.data.id }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_t}", site_name: "T-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
            - { call: "POST /distribution-events/${ev}/complete", payload: {}, as: BankAdmin }
          trigger:
            - call: "POST /distribution-events/${ev}/cancel"
              payload: {}
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_INVALID_EVENT_STATE"
            - "Event stays COMPLETED; issued_total_units == 0"

      - name: run_retract_with_consumption_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.AllocationRun.PUBLISHED_to_DRAFT", "errors[ERR_RUN_NOT_PUBLISHED]"]
        distinguishing_aspect: "Retract is blocked once any line has fulfilled_units > 0 — the revert branch closes after real-world consumption."
        test_recipe:
          setup:
            - "SIZE_1 on_hand 500 posted; agency U; run 2026-08 published -> line 500 reserved 500"
            - "Household 4 children (allotment 200) ELIGIBLE; event completed with issuance 200 -> line PARTIALLY_FULFILLED (fulfilled 200)"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor U", lines: [{ size_code: "SIZE_1", quantity: 500 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency U", agency_code: "AG-U", contact_email: "u@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_u: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-U1", children_sizes: ["SIZE_1", "SIZE_1", "SIZE_1", "SIZE_1"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_u}", site_name: "U-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 200 }] }
              as: PrivacyOfficer
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
            - { call: "POST /distribution-events/${ev}/complete", payload: {}, as: BankAdmin }
          trigger:
            - call: "POST /allocation-runs/${r1}/retract"
              payload: {}
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_RUN_NOT_PUBLISHED (consumption blocks retract)"
            - "Run stays PUBLISHED; line keeps fulfilled_units == 200"

      - name: household_eligibility_redetermination_cycle
        claim_type: valid_transition
        grounds: [state_machines.ClientHousehold]
        distinguishing_aspect: "Cyclic machine: PENDING_REVIEW -> ELIGIBLE -> INELIGIBLE -> ELIGIBLE all legal when consent is on file."
        test_recipe:
          setup: ["Household with consent_on_file true, PENDING_REVIEW"]
          setup_api_calls:
            - call: "POST /households"
              payload: { household_code: "HH-CYC", children_sizes: ["SIZE_2"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
          trigger:
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE", eligibility_reason: "intake verified" }
              as: PrivacyOfficer
              captures: { s1: $.data.eligibility_status }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "INELIGIBLE", eligibility_reason: "moved out of area" }
              as: PrivacyOfficer
              captures: { s2: $.data.eligibility_status }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE", eligibility_reason: "returned" }
              as: PrivacyOfficer
              captures: { s3: $.data.eligibility_status }
          assert:
            - "Statuses in order: ELIGIBLE, INELIGIBLE, ELIGIBLE"
            - "eligibility_reason tracks the latest decision ('returned')"

      - name: household_eligible_requires_consent_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ClientHousehold.PENDING_REVIEW_to_ELIGIBLE", "errors[ERR_CONSENT_REQUIRED]"]
        distinguishing_aspect: "PENDING_REVIEW -> ELIGIBLE without consent_on_file -> 422 ERR_CONSENT_REQUIRED (dignity/consent gate)."
        test_recipe:
          setup: ["Household without consent (default false), PENDING_REVIEW"]
          setup_api_calls:
            - call: "POST /households"
              payload: { household_code: "HH-NC", children_sizes: ["SIZE_1"] }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
          trigger:
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert: ["422 ERR_CONSENT_REQUIRED; status stays PENDING_REVIEW"]

      - name: issuance_void_compensation_restores_allotment
        claim_type: side_effect_execution
        grounds: [state_machines.Issuance.RECORDED_to_VOIDED, calculations.household_monthly_allotment]
        distinguishing_aspect: "Voiding a RECORDED issuance removes it from consumed_this_month_units — compensation leaves no allotment drift."
        test_recipe:
          setup:
            - "SIZE_1 on_hand 100 posted; agency V; run 2026-08 published -> line 100"
            - "Household 1 child (allotment 50) ELIGIBLE; event OPEN; issuance 30 RECORDED (consumed 30)"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor V", lines: [{ size_code: "SIZE_1", quantity: 100 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency V", agency_code: "AG-V", contact_email: "v@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_v: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-V1", children_sizes: ["SIZE_1"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_v}", site_name: "V-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 30 }] }
              as: PrivacyOfficer
              captures: { iss: $.data.id }
          trigger:
            - { call: "POST /issuances/${iss}/void", payload: { reason: "recorded in error" }, as: PrivacyOfficer }
            - call: "GET /households/${hh}"
              payload: {}
              as: PrivacyOfficer
              captures: { consumed: $.data.consumed_this_month_units }
          assert:
            - "Issuance status == VOIDED"
            - "Household consumed_this_month_units == 0 (30 removed — VOIDED excluded from the consumption set)"
            - "Inventory unchanged by the void (stock moves only at fulfillment)"

      - name: event_cancel_auto_voids_recorded_issuances
        claim_type: side_effect_execution
        grounds: [state_machines.DistributionEvent.OPEN_to_CANCELLED, state_machines.Issuance.RECORDED_to_VOIDED]
        distinguishing_aspect: "Cascade-down with conditional scope: cancelling an OPEN event voids exactly its RECORDED issuances; household consumption drops to 0."
        test_recipe:
          setup:
            - "SIZE_2 on_hand 100 posted; agency W; run published -> line 100; household 1 child ELIGIBLE; event OPEN with issuance 40 RECORDED"
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor W", lines: [{ size_code: "SIZE_2", quantity: 100 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency W", agency_code: "AG-W", contact_email: "w@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_w: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-W1", children_sizes: ["SIZE_2"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_w}", site_name: "W-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_2", quantity: 40 }] }
              as: PrivacyOfficer
              captures: { iss: $.data.id }
          trigger:
            - { call: "POST /distribution-events/${ev}/cancel", payload: {}, as: BankAdmin }
            - call: "GET /distribution-events/${ev}/issuances"
              payload: {}
              as: BankAdmin
              captures: { iss_status: "$.data[0].status" }
            - call: "GET /households/${hh}"
              payload: {}
              as: PrivacyOfficer
              captures: { consumed: $.data.consumed_this_month_units }
          assert:
            - "Issuance status == VOIDED (auto-void cascade)"
            - "Household consumed_this_month_units == 0"
            - "Event status == CANCELLED; no inventory movement occurred at any point"

      - name: po_receive_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PurchaseOrder", "errors[ERR_PO_NOT_RECEIVABLE]"]
        distinguishing_aspect: "RECEIVED is reachable only from SUBMITTED; receive on a DRAFT PO -> 409 ERR_PO_NOT_RECEIVABLE."
        test_recipe:
          setup: ["Grant 100000 ACTIVE; PO in DRAFT (total 1000)"]
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder D", grant_code: "GR-D", total_amount_cents: 100000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", lines: [{ size_code: "SIZE_1", quantity: 1, unit_cost_cents: 1000 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po}/receive"
              payload: { received_lines: [{ size_code: "SIZE_1", quantity: 1 }] }
              as: WarehouseManager
              captures: { err: $.data.error_id }
          assert: ["409 ERR_PO_NOT_RECEIVABLE; PO stays DRAFT; no batch created; grant funds untouched"]

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: grant_exhausted_at_exact_total_boundary
        claim_type: correct_result
        grounds: [calculations.grant_funds, state_machines.Grant.ACTIVE_to_EXHAUSTED]
        distinguishing_aspect: "Exhaustion boundary is >= : receiving a PO whose total exactly equals the grant total (spent == total) flips status to EXHAUSTED."
        test_recipe:
          setup: ["Grant total 4947 cents ACTIVE; PO total 4947 (3x1055 SIZE_1 + 7x333 SIZE_2 at 10% discount) SUBMITTED (exact-fit submit allowed: 4947 <= 4947)"]
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder E", grant_code: "GR-E", total_amount_cents: 4947, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", discount_pct: 0.10, lines: [{ size_code: "SIZE_1", quantity: 3, unit_cost_cents: 1055 }, { size_code: "SIZE_2", quantity: 7, unit_cost_cents: 333 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
            - { call: "POST /purchase-orders/${po}/submit", payload: {}, as: FinanceManager, as_user_id: "fm-user-1" }
          trigger:
            - { call: "POST /purchase-orders/${po}/receive", payload: { received_lines: [{ size_code: "SIZE_1", quantity: 3 }, { size_code: "SIZE_2", quantity: 7 }] }, as: WarehouseManager }
            - call: "GET /grants/${g1}"
              payload: {}
              as: FinanceManager
              captures: { g_status: $.data.status, g_spent: $.data.spent_cents, g_avail: $.data.available_cents }
          assert:
            - "Grant status == EXHAUSTED (auto-transition at spent >= total; equality triggers)"
            - "spent_cents == 4947, committed_cents == 0, available_cents == 0"

      - name: forecast_zero_history_null_weeks
        claim_type: correct_result
        grounds: [calculations.size_mix_forecast]
        distinguishing_aspect: "Division-by-zero pinned: with no fulfilled history, weekly_rate == 0 -> forecast 0 and weeks_of_supply null (not infinity/error); need_share 0 for all sizes."
        test_recipe:
          setup: ["Inventory initialized; nothing else"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
          trigger:
            - call: "GET /inventory/forecast"
              payload: {}
              as: WarehouseManager
          assert:
            - "variant defaults to TRAILING_ACTUAL"
            - "Every size: forecast_4wk_units == 0, weeks_of_supply == null, need_share == 0, donation_share == 0, mix_gap == 0"

      - name: donation_mix_gap_share_precision
        claim_type: precision
        grounds: [calculations.size_mix_forecast, entities.IntakeBatch]
        distinguishing_aspect: "Donation mix uses POSTED DONATION batches in the trailing 90-day window: 700 SIZE_1 + 300 SIZE_2 -> donation_share 0.7 / 0.3; with zero need forecast, mix_gap == -0.7 / -0.3 (4-decimal round_half_up)."
        test_recipe:
          setup: ["Two donation batches posted at default clock (posted_at 2026-08-01 within [now-90d, now])"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor M1", lines: [{ size_code: "SIZE_1", quantity: 700 }] }
              as: WarehouseManager
              captures: { m1: $.data.id }
            - { call: "POST /intake-batches/${m1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor M2", lines: [{ size_code: "SIZE_2", quantity: 300 }] }
              as: WarehouseManager
              captures: { m2: $.data.id }
            - { call: "POST /intake-batches/${m2}/post", payload: {}, as: WarehouseManager }
          trigger:
            - call: "GET /inventory/forecast"
              payload: {}
              as: WarehouseManager
          assert:
            - "sizes.SIZE_1.donation_share == 0.7 and sizes.SIZE_2.donation_share == 0.3"
            - "sizes.SIZE_1.mix_gap == -0.7 and sizes.SIZE_2.mix_gap == -0.3 (need_share 0 minus donation share)"
            - "Sizes with no donations have donation_share == 0"

      - name: intake_valuation_donation_vs_purchase_variants
        claim_type: variant_divergence
        grounds: [calculations.intake_valuation, entities.IntakeBatch.fields.valued_total_cents]
        distinguishing_aspect: "Same quantity (500 SIZE_1) valued two ways: donation batch at fair-market 32c -> 16000; purchase batch at actual cost 28c -> 14000. Receive also creates the batch directly in POSTED."
        test_recipe:
          setup: ["Donation batch 500 SIZE_1 created; grant 1000000 ACTIVE; PO 500 x 28c SIZE_1 submitted"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor Val", lines: [{ size_code: "SIZE_1", quantity: 500 }] }
              as: WarehouseManager
              captures: { don: $.data.id, don_val: $.data.valued_total_cents }
            - call: "POST /grants"
              payload: { funder_name: "Funder V", grant_code: "GR-V", total_amount_cents: 1000000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", lines: [{ size_code: "SIZE_1", quantity: 500, unit_cost_cents: 28 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
            - { call: "POST /purchase-orders/${po}/submit", payload: {}, as: FinanceManager, as_user_id: "fm-user-1" }
          trigger:
            - { call: "POST /purchase-orders/${po}/receive", payload: { received_lines: [{ size_code: "SIZE_1", quantity: 500 }] }, as: WarehouseManager }
            - call: "GET /intake-batches"
              payload: { purchase_order_id: "${po}" }
              as: WarehouseManager
              captures: { pb_status: "$.data[0].status", pb_val: "$.data[0].valued_total_cents", pb_src: "$.data[0].source_type" }
            - { call: "GET /inventory", payload: {}, as: WarehouseManager }
          assert:
            - "Donation batch valued_total_cents == 16000 (500 * 32 fair-market)"
            - "Purchase batch valued_total_cents == 14000 (500 * 28 actual cost) — identical quantity, different valuation"
            - "Purchase batch source_type == PURCHASE and status == POSTED at creation (receive posts directly)"
            - "Inventory.sizes.SIZE_1.on_hand_units == 500 (donation never posted)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: create_agency_missing_required_field
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required input name -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /partner-agencies"
              payload: { agency_code: "AG-X", contact_email: "x@x.org", children_served_monthly: 10, storage_capacity_units: 100 }
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert: ["400 ERR_VALIDATION; no agency persisted"]

      - name: volunteer_reading_grant_forbidden_before_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Authorization (p2) precedes existence (p3): Volunteer reading a nonexistent grant id gets 403 ERR_FORBIDDEN_ROLE, not 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /grants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Volunteer
              captures: { err: $.data.error_id }
          assert: ["403 ERR_FORBIDDEN_ROLE (never reveals existence)"]

      - name: issuance_no_allocation_beats_allotment_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "errors[ERR_NO_PUBLISHED_ALLOCATION]"]
        distinguishing_aspect: "Within the fiscal tier the pinned order is no-allocation before allotment: an over-allotment issuance with no PUBLISHED run returns ERR_NO_PUBLISHED_ALLOCATION."
        test_recipe:
          setup: ["Agency ACTIVE; event OPEN; household 1 child (allotment 50) ELIGIBLE; NO allocation run exists"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency Q", agency_code: "AG-Q", contact_email: "q@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_q: $.data.id }
            - call: "POST /households"
              payload: { household_code: "HH-Q1", children_sizes: ["SIZE_1"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "PATCH /households/${hh}"
              payload: { eligibility_status: "ELIGIBLE" }
              as: PrivacyOfficer
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_q}", site_name: "Q-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
          trigger:
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 60 }] }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert: ["422 ERR_NO_PUBLISHED_ALLOCATION (not ERR_ALLOTMENT_EXCEEDED even though 60 > 50 remaining)"]

      - name: run_period_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_PERIOD_IN_PAST]"]
        distinguishing_aspect: "Period 2026-07 < clock month 2026-08 -> 422 ERR_PERIOD_IN_PAST."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /allocation-runs"
              payload: { period: "2026-07" }
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert: ["422 ERR_PERIOD_IN_PAST"]

      - name: run_duplicate_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_PERIOD]"]
        distinguishing_aspect: "Second run with period 2026-08 -> 409 ERR_DUPLICATE_PERIOD regardless of the first run's status."
        test_recipe:
          setup: ["Run for 2026-08 exists"]
          setup_api_calls:
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
          trigger:
            - call: "POST /allocation-runs"
              payload: { period: "2026-08", formula_variant: "EQUAL_SPLIT" }
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert: ["409 ERR_DUPLICATE_PERIOD"]

      - name: grant_close_with_submitted_po_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_GRANT_HAS_OPEN_POS]"]
        distinguishing_aspect: "Referential guard: closing a grant with a SUBMITTED PO outstanding -> 409 ERR_GRANT_HAS_OPEN_POS."
        test_recipe:
          setup: ["Grant 100000 ACTIVE; PO 1000 SUBMITTED against it"]
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder C", grant_code: "GR-C", total_amount_cents: 100000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", lines: [{ size_code: "SIZE_1", quantity: 1, unit_cost_cents: 1000 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
            - { call: "POST /purchase-orders/${po}/submit", payload: {}, as: FinanceManager, as_user_id: "fm-user-1" }
          trigger:
            - call: "POST /grants/${g1}/close"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert: ["409 ERR_GRANT_HAS_OPEN_POS; grant stays ACTIVE with committed_cents == 1000"]

      - name: publish_before_compute_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_RUN_NOT_COMPUTED]"]
        distinguishing_aspect: "Publish requires computed_at non-null: DRAFT run published without compute -> 409 ERR_RUN_NOT_COMPUTED."
        test_recipe:
          setup: ["Run 2026-08 created, never computed"]
          setup_api_calls:
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /allocation-runs/${r1}/publish"
              payload: {}
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert: ["409 ERR_RUN_NOT_COMPUTED; run stays DRAFT"]

      - name: publish_with_stock_below_allocated_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Aggregate re-check at publish: compute saw available 300, but a void drained on_hand to 0 before publish -> 422 ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup: ["SIZE_1 on_hand 300 posted; agency (children 300); run 2026-08 computed -> line 300; the donation batch then voided (on_hand 0)"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor S", lines: [{ size_code: "SIZE_1", quantity: 300 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency S", agency_code: "AG-S", contact_email: "s@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /intake-batches/${b1}/void", payload: {}, as: WarehouseManager }
          trigger:
            - call: "POST /allocation-runs/${r1}/publish"
              payload: {}
              as: BankAdmin
              captures: { err: $.data.error_id }
          assert: ["422 ERR_INSUFFICIENT_STOCK; run stays DRAFT; no reservation applied"]

      - name: sod_same_user_submit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties: the submitting FinanceManager's X-User-ID equals the PO creator's -> 403 ERR_SOD_VIOLATION even with a different role header."
        test_recipe:
          setup: ["Grant ACTIVE; PO created by X-User-ID dual-role-user"]
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder S", grant_code: "GR-S", total_amount_cents: 100000, start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", lines: [{ size_code: "SIZE_1", quantity: 1, unit_cost_cents: 1000 }] }
              as: WarehouseManager
              as_user_id: "dual-role-user"
              captures: { po: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po}/submit"
              payload: {}
              as: FinanceManager
              as_user_id: "dual-role-user"
              captures: { err: $.data.error_id }
          assert: ["403 ERR_SOD_VIOLATION; PO stays DRAFT; committed_cents stays 0"]

      - name: restriction_violation_on_operations_only_grant
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_GRANT_RESTRICTION_VIOLATION]"]
        distinguishing_aspect: "Product PO against an OPERATIONS_ONLY grant -> 422 ERR_GRANT_RESTRICTION_VIOLATION (checked before budget)."
        test_recipe:
          setup: ["Grant OPERATIONS_ONLY 100000 ACTIVE; PO DRAFT total 1000"]
          setup_api_calls:
            - call: "POST /grants"
              payload: { funder_name: "Funder O", grant_code: "GR-O", total_amount_cents: 100000, restriction: "OPERATIONS_ONLY", start_date: "2026-07-01T00:00:00Z", end_date: "2027-06-30T00:00:00Z" }
              as: FinanceManager
              captures: { g1: $.data.id }
            - call: "POST /purchase-orders"
              payload: { grant_id: "${g1}", vendor_name: "Wholesale Co", lines: [{ size_code: "SIZE_1", quantity: 1, unit_cost_cents: 1000 }] }
              as: WarehouseManager
              as_user_id: "wm-user-1"
              captures: { po: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po}/submit"
              payload: {}
              as: FinanceManager
              as_user_id: "fm-user-1"
              captures: { err: $.data.error_id }
          assert: ["422 ERR_GRANT_RESTRICTION_VIOLATION; PO stays DRAFT"]

      - name: issuance_for_ineligible_household_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_HOUSEHOLD_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Household in PENDING_REVIEW (never made ELIGIBLE) -> 422 ERR_HOUSEHOLD_NOT_ELIGIBLE at issuance recording."
        test_recipe:
          setup: ["SIZE_1 on_hand 100 posted; agency; run published -> line 100; event OPEN; household PENDING_REVIEW"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor N", lines: [{ size_code: "SIZE_1", quantity: 100 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency N", agency_code: "AG-N", contact_email: "n@x.org", children_served_monthly: 300, storage_capacity_units: 100000 }
              as: BankAdmin
              captures: { ag_n: $.data.id }
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/publish", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-N1", children_sizes: ["SIZE_1"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_n}", site_name: "N-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
          trigger:
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 10 }] }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert: ["422 ERR_HOUSEHOLD_NOT_ELIGIBLE (PENDING_REVIEW is not ELIGIBLE)"]

      - name: issuance_on_locked_event_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_EVENT_NOT_OPEN]"]
        distinguishing_aspect: "Issuance recording requires OPEN: attempt while LOCKED -> 409 ERR_EVENT_NOT_OPEN (state precedes all business checks)."
        test_recipe:
          setup: ["Agency; event OPEN then LOCKED (no issuances)"]
          setup_api_calls:
            - call: "POST /partner-agencies"
              payload: { name: "Agency L", agency_code: "AG-L", contact_email: "l@x.org", children_served_monthly: 100, storage_capacity_units: 10000 }
              as: BankAdmin
              captures: { ag_l: $.data.id }
            - call: "POST /distribution-events"
              payload: { host_agency_id: "${ag_l}", site_name: "L-Site", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z" }
              as: BankAdmin
              captures: { ev: $.data.id }
            - { call: "POST /distribution-events/${ev}/open", payload: {}, as: BankAdmin }
            - { call: "POST /distribution-events/${ev}/lock", payload: {}, as: BankAdmin }
            - call: "POST /households"
              payload: { household_code: "HH-L1", children_sizes: ["SIZE_1"], consent_on_file: true }
              as: PrivacyOfficer
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /distribution-events/${ev}/issuances"
              payload: { household_id: "${hh}", lines: [{ size_code: "SIZE_1", quantity: 10 }] }
              as: PrivacyOfficer
              captures: { err: $.data.error_id }
          assert: ["409 ERR_EVENT_NOT_OPEN"]

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: compute_replaces_lines_idempotently
        claim_type: side_effect_execution
        grounds: ["endpoints['POST /allocation-runs/{id}/compute']"]
        distinguishing_aspect: "Second compute replaces the line set wholesale — line count stays 1 for a single-agency/single-size pool, never duplicates."
        test_recipe:
          setup: ["SIZE_1 on_hand 200 posted; one agency (children 100)"]
          setup_api_calls:
            - { call: "POST /inventory/initialize", payload: {}, as: WarehouseManager }
            - call: "POST /intake-batches"
              payload: { donor_name: "Donor C2", lines: [{ size_code: "SIZE_1", quantity: 200 }] }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - { call: "POST /intake-batches/${b1}/post", payload: {}, as: WarehouseManager }
            - call: "POST /partner-agencies"
              payload: { name: "Agency C2", agency_code: "AG-C2", contact_email: "c2@x.org", children_served_monthly: 100, storage_capacity_units: 100000 }
              as: BankAdmin
            - call: "POST /allocation-runs"
              payload: { period: "2026-08" }
              as: BankAdmin
              captures: { r1: $.data.id }
          trigger:
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - { call: "POST /allocation-runs/${r1}/compute", payload: {}, as: BankAdmin }
            - call: "GET /allocation-runs/${r1}/lines"
              payload: {}
              as: BankAdmin
              captures: { l0: "$.data[0].allocated_units" }
          assert:
            - "Exactly 1 line exists after two computes (total_count == 1)"
            - "Line allocated_units == 200 and status == PROJECTED (run still DRAFT)"

      - name: withdraw_restores_open_status
        claim_type: side_effect_execution
        grounds: ["endpoints['POST /volunteer-shifts/{id}/withdraw']", "state_machines.VolunteerShift"]
        distinguishing_aspect: "Auto FULL -> OPEN on withdraw: capacity-1 shift fills on signup, reopens on withdraw; signup_count returns to 0."
        test_recipe:
          setup: ["Shift capacity 1"]
          setup_api_calls:
            - call: "POST /volunteer-shifts"
              payload: { title: "Restock", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", capacity: 1 }
              as: VolunteerCoordinator
              captures: { sh: $.data.id }
          trigger:
            - call: "POST /volunteer-shifts/${sh}/signups"
              payload: { volunteer_email: "solo@x.org", volunteer_name: "Solo" }
              as: Volunteer
              captures: { st_full: $.data.status }
            - call: "POST /volunteer-shifts/${sh}/withdraw"
              payload: { volunteer_email: "solo@x.org" }
              as: Volunteer
              captures: { st_open: $.data.status, cnt: $.data.signup_count }
          assert:
            - "After signup: status == FULL (count 1 == capacity 1)"
            - "After withdraw: status == OPEN and signup_count == 0"

