              as: Customer
              as_user_id: "${c_lab}"
            - call: "POST /metrology/pt-rounds/${r1}/transitions"
              payload: { to: EVALUATION }
              as: AccreditationOfficer
            - call: "POST /metrology/pt-rounds/${r1}/transitions"
