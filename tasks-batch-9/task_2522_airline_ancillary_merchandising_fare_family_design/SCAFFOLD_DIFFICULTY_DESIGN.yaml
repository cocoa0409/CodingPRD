              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/review-decision"
