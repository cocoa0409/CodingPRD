    roles: [PharmacyTechnician]
    code: 200
    input: [prepared_volumes_ml, waste_ml, storage_condition, "expected_batch_version?"]
    output: CompoundingBatch
    side_effects: ["batch_yield_and_waste", "beyond_use_dating per preparation", "preparations PLANNED -> COMPOUNDED", "WasteRecord appended", "increments CompoundingBatch.version by 1"]
