          assert:
            - "First activate: ack_err == ERR_REVIEW_NOT_ACKNOWLEDGED with HTTP 409 (review still PUBLISHED)"
            - "After ACKNOWLEDGE: PerformanceReview.${revk_id}.status == ACKNOWLEDGED"
            - "Second activate: HTTP 200, CorrectivePlan.${plk_id}.status == ACTIVE and revision_count == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: promotion_half_open_window_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_PROMOTION_WINDOW_OVERLAP]
          - entities.PromotionProgram.fields.starts_at
        distinguishing_aspect: "Half-open interval semantics on the PromotionProgram/brand_code resource: [2026-09-01, 2026-10-01) touching [2026-10-01, 2026-11-01) at a shared endpoint is allowed (adjacency), while a genuinely overlapping window is rejected and an identical window on a different brand is unaffected."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "One existing OPEN BUD promotion with window [2026-10-01T00:00:00Z, 2026-11-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /promotion-programs"
              payload: { brand_code: "BUD", starts_at: "2026-10-01T00:00:00Z", ends_at: "2026-11-01T00:00:00Z", suggested_discount_pct: 5 }
              as: BrewerAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /promotion-programs"
              payload: { brand_code: "BUD", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-10-01T00:00:00Z", suggested_discount_pct: 3 }
              as: BrewerAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /promotion-programs"
              payload: { brand_code: "BUD", starts_at: "2026-10-15T00:00:00Z", ends_at: "2026-11-15T00:00:00Z", suggested_discount_pct: 4 }
              as: BrewerAdmin
              captures: { ovl_err: $.data.error_id }
            - call: "POST /promotion-programs"
              payload: { brand_code: "MIC", starts_at: "2026-10-15T00:00:00Z", ends_at: "2026-11-15T00:00:00Z", suggested_discount_pct: 4 }
              as: BrewerAdmin
              captures: { p4_id: $.data.id }
          assert:
            - "The adjacent BUD window is accepted: HTTP 201, PromotionProgram.${p2_id}.status == OPEN (ends_at 2026-10-01 == existing starts_at 2026-10-01 is not overlap under half-open semantics)"
            - "The overlapping BUD window is rejected: ovl_err == ERR_PROMOTION_WINDOW_OVERLAP with HTTP 409"
            - "The same overlapping window for brand MIC is accepted: HTTP 201, PromotionProgram.${p4_id}.status == OPEN (overlap is scoped per brand_code)"

      - name: audit_min_gap_buffer_not_overlap_semantics
        grounds:
          - validations[priority=9]
          - errors[ERR_AUDIT_TOO_SOON]
          - entities.RetailAccount.fields.last_audit_at
        distinguishing_aspect: "Minimum-separation buffer semantics on the RetailAccount resource (different entity and different interval semantics than promotion_half_open_window_adjacency's half-open overlap): point-in-time audits cannot 'overlap', yet a second audit 3 days later is still rejected, while another account's audit 1 day after the first is untouched."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Two TX accounts AB1 and AB2 served by the same appointed wholesaler; AB1 has a PASS audit conducted at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Buffer Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tbf_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Buffer Distributing", home_state: "TX", license_number: "TX-W-8101", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wbf_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tbf_id}", wholesaler_id: "${wbf_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /retail-accounts"
              payload: { name: "Buffer Bar 1", state_code: "TX", serving_wholesaler_id: "${wbf_id}" }
              as: BrewerAdmin
              captures: { ab1_id: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Buffer Bar 2", state_code: "TX", serving_wholesaler_id: "${wbf_id}" }
              as: BrewerAdmin
              captures: { ab2_id: $.data.id }
            - call: "POST /draft-audits"
              payload: { account_id: "${ab1_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-28T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-08-25T00:00:00Z", volume_bbl: 10 }] }
              as: DraftAuditor
          trigger:
            - call: "POST /draft-audits"
              payload: { account_id: "${ab2_id}", conducted_at: "2026-09-02T00:00:00Z", line_cleaning_last_at: "2026-08-30T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-08-28T00:00:00Z", volume_bbl: 10 }] }
              as: DraftAuditor
              captures: { audb2_id: $.data.id }
            - call: "POST /draft-audits"
              payload: { account_id: "${ab1_id}", conducted_at: "2026-09-04T00:00:00Z", line_cleaning_last_at: "2026-09-02T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-09-01T00:00:00Z", volume_bbl: 10 }] }
              as: DraftAuditor
              captures: { buf_err: $.data.error_id }
          assert:
            - "DraftAudit.${audb2_id} on the sibling account is accepted (HTTP 201, result PASS) — the 7-day buffer is scoped per RetailAccount, not per wholesaler"
            - "The AB1 re-audit 3 days (259200 s) later is rejected: buf_err == ERR_AUDIT_TOO_SOON with HTTP 409, even though point events cannot overlap"
            - "RetailAccount.${ab1_id}.last_audit_at == 2026-09-01T00:00:00Z (unchanged by the rejected audit)"

  - rule_id: compensating_invariant
    instances:
      - name: confirm_release_conserves_case_ledger
        grounds:
          - endpoints.POST_/allocation-events/{id}/assignments/{wholesalerId}/decision
          - entities.AllocationEvent.fields.committed_qty
          - calculations.allocation_waterfall_assignment
        distinguishing_aspect: "Conserved quantity is CASES: confirm (forward) then release (compensating) leave committed_qty + pending_qty + released_qty + unassigned_remainder == total_qty_cases at every step, ending exactly where the post-lock ledger started."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to GOLD wholesaler WV with brand_scope [BUD-LTD]; allocation event total 500 (cap floor(0.40*500)=200): WV requests 300 and locks; waterfall assigns exactly 200 (guarantee 100 + capacity 100), unassigned_remainder 300, pending_qty 200."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Ledger Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tlv_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Ledger Distributing", home_state: "TX", license_number: "TX-W-9001", tier: "GOLD", financial_capacity_score: 85, warehouse_capacity_score: 85, market_coverage_score: 85 }
              as: BrewerAdmin
              captures: { wv_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tlv_id}", wholesaler_id: "${wv_id}", brand_scope: ["BUD-LTD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /allocation-events"
              payload: { brand_code: "BUD-LTD", total_qty_cases: 500 }
              as: BrewerAdmin
              captures: { evv_id: $.data.id }
            - call: "POST /allocation-events/${evv_id}/requests"
              payload: { requested_qty_cases: 300 }
              as: WholesalerPrincipal
              as_user_id: "${wv_id}"
            - call: "POST /allocation-events/${evv_id}/lock"
              payload: {}
              as: BrewerAdmin
          trigger:
            - call: "POST /allocation-events/${evv_id}/assignments/${wv_id}/decision"
              payload: { decision: "CONFIRM" }
              as: WholesalerPrincipal
              as_user_id: "${wv_id}"
            - call: "POST /allocation-events/${evv_id}/assignments/${wv_id}/decision"
              payload: { decision: "RELEASE" }
              as: WholesalerPrincipal
              as_user_id: "${wv_id}"
            - call: "GET /allocation-events/${evv_id}"
              payload: {}
              as: BrewerAdmin
          assert:
            - "Post-lock baseline: committed_qty == 0, pending_qty == 200, released_qty == 0, unassigned_remainder == 300 — 0+200+0+300 == 500"
            - "After CONFIRM: committed_qty == 200, pending_qty == 0 — 200+0+0+300 == 500 (forward action conserves the ledger)"
            - "After RELEASE: committed_qty == 0, released_qty == 200 — 0+0+200+300 == 500 (compensating action restores the baseline exactly, no drift)"
            - "The ${wv_id} assignment ends RELEASED with assigned_qty == 200 unchanged; total_qty_cases == 500 throughout"

      - name: issue_void_conserves_pos_lifetime_value
        grounds:
          - state_machines.PosGrant.ISSUED_to_VOIDED
          - calculations.pos_ytd_chargeable
          - endpoints.POST_/pos-grants/{id}/void
        distinguishing_aspect: "Conserved quantity is POS DOLLARS (distinct from confirm_release_conserves_case_ledger's cases): issue (forward) then void (compensating) leave lifetime granted value unchanged while chargeable YTD falls back by exactly the voided amount — proven by a same-value replacement grant being accepted."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "TX account AV served by an appointed wholesaler; one ISSUED grant of 26000 cents (YTD chargeable 26000 of the 30000 cap, lifetime granted 26000)."
            - "A follow-up 5000-cent grant is attempted BEFORE the void and must fail (31000 > 30000), proving the cap still bites."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Void Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tvd_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Void Distributing", home_state: "TX", license_number: "TX-W-9101", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wvd_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tvd_id}", wholesaler_id: "${wvd_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /retail-accounts"
              payload: { name: "Void Bar", state_code: "TX", serving_wholesaler_id: "${wvd_id}" }
              as: BrewerAdmin
              captures: { avd_id: $.data.id }
            - call: "POST /pos-grants"
              payload: { account_id: "${avd_id}", item_description: "pool table felt", value_cents: 26000 }
              as: BrewerAdmin
              captures: { gv1_id: $.data.id }
            - call: "POST /pos-grants"
              payload: { account_id: "${avd_id}", item_description: "blocked pre-void", value_cents: 5000 }
              as: BrewerAdmin
              captures: { prevoid_err: $.data.error_id }
          trigger:
            - call: "POST /pos-grants/${gv1_id}/void"
              payload: {}
              as: BrewerAdmin
              captures: { gv1_status: $.data.status }
            - call: "POST /pos-grants"
              payload: { account_id: "${avd_id}", item_description: "replacement felt", value_cents: 5000 }
              as: BrewerAdmin
              captures: { gv2_id: $.data.id }
            - call: "GET /retail-accounts/${avd_id}/pos-grants"
              payload: {}
              as: BrewerAdmin
          assert:
            - "Pre-void: prevoid_err == ERR_POS_VALUE_CAP_EXCEEDED (26000 + 5000 > 30000) — the cap bites before compensation"
            - "PosGrant.${gv1_id}.status == VOIDED with voided_at == 2026-09-01T00:00:00Z (the logical clock)"
            - "Post-void the identical 5000-cent grant is accepted (HTTP 201, PosGrant.${gv2_id}.status == ISSUED): the void restored exactly 26000 cents of headroom"
            - "Ledger conservation: lifetime granted == 31000 == ISSUED sum 5000 (gv2) + VOIDED sum 26000 (gv1); chargeable YTD == 5000"
            - "Both grants carry granted_year == 2026"
