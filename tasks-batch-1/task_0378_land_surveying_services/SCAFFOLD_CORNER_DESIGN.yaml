scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_survey_order_returns_201_with_computed_fees
        claim_type: Creation
        grounds:
          - endpoints.POST_/survey-orders
          - entities.SurveyOrder.fields.estimated_fee_cents
          - entities.SurveyOrder.fields.base_fee_cents
        distinguishing_aspect: "POST /survey-orders with all required fields returns 201; base_fee_cents and estimated_fee_cents are computed (BOUNDARY 3ac no-rush -> 120000 / 144000), status INTAKE, version 1."
        test_recipe:
          setup:
            - "A Coordinator bootstrap operator exists to create the order."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord CC1", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
          trigger:
            - call: "POST /survey-orders"
              payload: { client_name: "NewCo", survey_type: "BOUNDARY", parcel_apn: "APN-C1", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { oid: $.data.id }
          assert:
            - "HTTP status == 201"
            - "SurveyOrder.${oid}.status == INTAKE"
            - "SurveyOrder.${oid}.base_fee_cents == 120000"
            - "SurveyOrder.${oid}.estimated_fee_cents == 144000"
            - "SurveyOrder.${oid}.version == 1"

      - name: get_survey_order_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/survey-orders/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /survey-orders/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A Coordinator operator exists; no order with the queried id."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord CC2", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
          trigger:
            - call: "GET /survey-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_survey_order_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/survey-orders
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field acreage on POST /survey-orders returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Coordinator operator exists."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord CC3", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
          trigger:
            - call: "POST /survey-orders"
              payload: { client_name: "BadCo", survey_type: "BOUNDARY", parcel_apn: "APN-C3", county_fips: "06037", rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_survey_order_invalid_enum_survey_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/survey-orders
          - entities.SurveyOrder.fields.survey_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /survey-orders with survey_type not in {BOUNDARY,TOPO,ALTA,ELEVATION} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "A Coordinator operator exists."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord CC4", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
          trigger:
            - call: "POST /survey-orders"
              payload: { client_name: "EnumCo", survey_type: "MAGNETIC", parcel_apn: "APN-C4", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: rush_defaults_false_when_omitted
        claim_type: Defaults
        grounds:
          - entities.SurveyOrder.fields.rush
          - calculations.order_fee_estimate
        distinguishing_aspect: "Omitting rush on POST /survey-orders defaults rush=false, so no 30% surcharge is added; ELEVATION 4ac estimate is base 90000 + field 32000 = 122000."
        test_recipe:
          setup:
            - "A Coordinator operator exists."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord CC5", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
          trigger:
            - call: "POST /survey-orders"
              payload: { client_name: "DefCo", survey_type: "ELEVATION", parcel_apn: "APN-C5", county_fips: "06037", acreage: 4, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { oid: $.data.id }
          assert:
            - "SurveyOrder.${oid}.rush == false"
            - "SurveyOrder.${oid}.estimated_fee_cents == 122000"

      - name: system_fields_generated_input_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.SurveyOrder.fields.status
          - endpoints.POST_/survey-orders
        distinguishing_aspect: "id, created_at, version, and status are system-generated on POST /survey-orders; a client-supplied status is ignored and the order starts at INTAKE with version 1."
        test_recipe:
          setup:
            - "A Coordinator operator exists."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord CC6", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
          trigger:
            - call: "POST /survey-orders"
              payload: { client_name: "SysCo", survey_type: "BOUNDARY", parcel_apn: "APN-C6", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { oid: $.data.id }
          assert:
            - "SurveyOrder.${oid}.status == INTAKE"
            - "SurveyOrder.${oid}.version == 1"
            - "SurveyOrder.${oid}.id is a server-minted UUID (no type prefix)"

      - name: list_survey_orders_paginated_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/survey-orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /survey-orders returns an array response with pagination fields limit/offset/total_count/has_more; default limit 10."
        test_recipe:
          setup:
            - "A Coordinator operator and two orders exist."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord CC7", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "L1", survey_type: "BOUNDARY", parcel_apn: "APN-C7a", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /survey-orders"
              payload: { client_name: "L2", survey_type: "TOPO", parcel_apn: "APN-C7b", county_fips: "06037", acreage: 5, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /survey-orders"
              payload: { limit: 10, offset: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
          assert:
            - "response_type == array"
            - "total_count >= 2"
            - "has_more == false"

      - name: duplicate_asset_tag_returns_conflict
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/instruments
          - validations[priority=17]
          - errors[ERR_DUPLICATE_ASSET_TAG]
          - entities.Instrument.fields.asset_tag
        distinguishing_aspect: "A second Instrument with an existing asset_tag returns ERR_DUPLICATE_ASSET_TAG (409)."
        test_recipe:
          setup:
            - "A Coordinator operator and an Instrument with asset_tag TAG-DUP exist."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord CC8", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "TAG-DUP", instrument_type: "TOTAL_STATION", calibration_due_on: "2027-01-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /instruments"
              payload: { asset_tag: "TAG-DUP", instrument_type: "GPS_RTK", calibration_due_on: "2027-01-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_ASSET_TAG"
            - "HTTP status == 409"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: start_research_from_research_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SurveyOrder.INTAKE_to_RESEARCH
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling start-research twice: the second call (order already RESEARCH) is not a defined transition from RESEARCH and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "An order already advanced INTAKE->RESEARCH (one research packet exists)."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord SM1", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res SM1", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "TwiceCo", survey_type: "BOUNDARY", parcel_apn: "APN-S1", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { oid: $.data.id }
            - call: "POST /research-packets"
              payload: { order_id: "${oid}", assigned_researcher_id: "${res_id}", encumbrance_count: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /survey-orders/${oid}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /survey-orders/${oid}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "SurveyOrder.${oid}.status == RESEARCH"

      - name: cancel_delivered_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SurveyOrder.SEALED_to_DELIVERED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DELIVERED is terminal; POST /survey-orders/{id}/cancel on a DELIVERED order returns ERR_INVALID_STATE (cancel only defined from pre-SEALED states)."
        test_recipe:
          setup:
            - "An order fully driven to DELIVERED (sealed plat, issued invoice, released deliverable)."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord SM2", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res SM2", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech SM2", role_type: "TECH" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Draft SM2", role_type: "DRAFTER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { draft_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "PLS SM2", role_type: "PLS", license_number: "L-SM2", license_state: "CA", license_expires_on: "2030-01-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { pls_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Bill SM2", role_type: "BILLING_CLERK" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { bill_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "DoneCo", survey_type: "BOUNDARY", parcel_apn: "APN-S2", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { oid: $.data.id }
            - call: "POST /research-packets"
              payload: { order_id: "${oid}", assigned_researcher_id: "${res_id}", encumbrance_count: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /survey-orders/${oid}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /research-packets/${rp_id}/begin"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /research-packets/${rp_id}/clear"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /survey-orders/${oid}/clear-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${oid}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T09:00:00.000Z", scheduled_end: "2026-07-01T13:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /field-assignments/${fa_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /field-assignments/${fa_id}/complete"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /data-sets"
              payload: { order_id: "${oid}", assignment_id: "${fa_id}", recorded_by_id: "${tech_id}", point_count: 50, closure_error_ppm: 20 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { ds_id: $.data.id }
            - call: "POST /data-sets/${ds_id}/reduce"
              payload: {}
              as: Drafter
              as_user_id: "${draft_id}"
            - call: "POST /data-sets/${ds_id}/accept"
              payload: {}
              as: Surveyor
              as_user_id: "${pls_id}"
            - call: "POST /plat-drawings"
              payload: { order_id: "${oid}", dataset_id: "${ds_id}", drafted_by_id: "${draft_id}" }
              as: Drafter
              as_user_id: "${draft_id}"
              captures: { plat_id: $.data.id }
            - call: "POST /plat-drawings/${plat_id}/submit-review"
              payload: {}
              as: Drafter
              as_user_id: "${draft_id}"
            - call: "GET /survey-orders/${oid}"
              payload: {}
              as: Surveyor
              as_user_id: "${pls_id}"
              captures: { ov1: $.data.version }
            - call: "POST /plat-drawings/${plat_id}/seal"
              payload: { sealed_by_id: "${pls_id}", expected_order_version: "${ov1}" }
              as: Surveyor
              as_user_id: "${pls_id}"
            - call: "POST /deliverables"
              payload: { order_id: "${oid}", plat_id: "${plat_id}", format: "PDF" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { del_id: $.data.id }
            - call: "POST /invoices"
              payload: { order_id: "${oid}", issued_by_id: "${bill_id}" }
              as: BillingClerk
              as_user_id: "${bill_id}"
              captures: { inv_id: $.data.id }
            - call: "GET /survey-orders/${oid}"
              payload: {}
              as: BillingClerk
              as_user_id: "${bill_id}"
              captures: { ov2: $.data.version }
            - call: "POST /invoices/${inv_id}/issue"
              payload: { expected_order_version: "${ov2}" }
              as: BillingClerk
              as_user_id: "${bill_id}"
            - call: "POST /deliverables/${del_id}/release"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /survey-orders/${oid}/cancel"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "SurveyOrder.${oid}.status == DELIVERED"

      - name: seal_draft_plat_before_review_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlatDrawing.UNDER_REVIEW_to_SEALED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Sealing a plat still in DRAFTED (never submitted to review) is not a defined transition (seal requires UNDER_REVIEW) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A DRAFTED plat (created from an accepted dataset) that has NOT been submitted to review."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord SM3", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res SM3", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech SM3", role_type: "TECH" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Draft SM3", role_type: "DRAFTER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { draft_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "PLS SM3", role_type: "PLS", license_number: "L-SM3", license_state: "CA", license_expires_on: "2030-01-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { pls_id: $.data.id }
            - call: "POST /survey-orders"
              payload: { client_name: "DraftCo", survey_type: "BOUNDARY", parcel_apn: "APN-S3", county_fips: "06037", acreage: 3, rush: false, requested_due_date: "2026-08-01T00:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { oid: $.data.id }
            - call: "POST /research-packets"
              payload: { order_id: "${oid}", assigned_researcher_id: "${res_id}", encumbrance_count: 0 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { rp_id: $.data.id }
            - call: "POST /survey-orders/${oid}/start-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /research-packets/${rp_id}/begin"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /research-packets/${rp_id}/clear"
              payload: {}
              as: Researcher
              as_user_id: "${res_id}"
            - call: "POST /survey-orders/${oid}/clear-research"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /field-assignments"
              payload: { order_id: "${oid}", crew_member_id: "${tech_id}", scheduled_start: "2026-07-01T09:00:00.000Z", scheduled_end: "2026-07-01T13:00:00.000Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /field-assignments/${fa_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /field-assignments/${fa_id}/complete"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /data-sets"
              payload: { order_id: "${oid}", assignment_id: "${fa_id}", recorded_by_id: "${tech_id}", point_count: 50, closure_error_ppm: 20 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { ds_id: $.data.id }
            - call: "POST /data-sets/${ds_id}/reduce"
              payload: {}
              as: Drafter
              as_user_id: "${draft_id}"
            - call: "POST /data-sets/${ds_id}/accept"
              payload: {}
              as: Surveyor
              as_user_id: "${pls_id}"
            - call: "POST /plat-drawings"
              payload: { order_id: "${oid}", dataset_id: "${ds_id}", drafted_by_id: "${draft_id}" }
              as: Drafter
              as_user_id: "${draft_id}"
              captures: { plat_id: $.data.id }
            - call: "GET /survey-orders/${oid}"
              payload: {}
              as: Surveyor
              as_user_id: "${pls_id}"
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /plat-drawings/${plat_id}/seal"
              payload: { sealed_by_id: "${pls_id}", expected_order_version: "${ov}" }
              as: Surveyor
              as_user_id: "${pls_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "PlatDrawing.${plat_id}.status == DRAFTED"

      - name: research_packet_initial_state_is_open
        claim_type: Initial State
        grounds:
          - state_machines.ResearchPacket.OPEN_to_IN_PROGRESS
          - entities.ResearchPacket.fields.status
        distinguishing_aspect: "A newly created ResearchPacket starts in initial_state OPEN."
        test_recipe:
          setup:
            - "A Coordinator, a RESEARCHER and an order exist."
          setup_api_calls:
            - call: "POST /crew-members"
              payload: { full_name: "Coord SM4", role_type: "COORDINATOR" }
              as: Coordinator
              captures: { coord_id: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Res SM4", role_type: "RESEARCHER" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { res_id: $.data.id }
            - call: "POST /survey-orders"
