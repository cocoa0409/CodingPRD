      - name: allocation_refused_because_participant_left_as_bad_leaver
        grounds:
          - validations.priority_111
          - errors.ERR_AWARD_NOT_ELIGIBLE
          - calculations.participant_prorated_target
          - entities.ParticipantAward.fields.eligibility_status
          - state_machines.ParticipantAward
          - endpoints."POST /eligibility-events"
          - endpoints."POST /participant-awards/{awardId}/propose-allocation"
        distinguishing_aspect: |
          Entity pair (ParticipantAward <- Participant). The award row itself
          is in a perfectly allocatable allocation_status (UNALLOCATED) and
          the pool is ALLOCATING with 4,000,000 available, yet the allocation
          is refused 422 because the participant resigned: the BAD_LEAVER
          classification lives on the Participant/EligibilityEvent side. The
          same event first compensates the earlier proposal — PROPOSED ->
          UNALLOCATED, pool allocated_cents 4,000,000 -> 0 — and re-prorates
          the target to 1,983,562 for 181 credited days.
