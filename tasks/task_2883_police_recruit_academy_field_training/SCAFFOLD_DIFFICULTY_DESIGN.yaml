              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T12:00:00Z" }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions/${cs1_id}/deliver"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions/${cs2_id}/deliver"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions/${cs3_id}/deliver"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
          trigger:
            - call: "GET /recruits/${rec_id}/certification-progress?basis=ATTENDED"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { attended_total: $.data.total_hours }
            - call: "GET /recruits/${rec_id}/certification-progress?basis=SCHEDULED"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { scheduled_total: $.data.total_hours }
            - call: "GET /recruits/${rec_id}"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "tc-1"
          assert:
            - "${attended_total} == 3.39"
            - "${scheduled_total} == 6.00"
            - "Recruit.${rec_id}.credited_hours_total == 3.39"
            - "Recruit.${rec_id}.scheduled_basis_hours_total == 6.00"
            - "Recruit.${rec_id}.per_topic_credited_hours['PATROL'] == 3.39"
            - "AcademyClass.${class_id}.credited_topic_hours_total == 3.39"
            - "AcademyClass.${class_id}.status == IN_SESSION"
            - "Recruit.${rec_id}.academy_status == IN_PROGRESS  # 3.39 < required_hours 6.00, so the curriculum gate does NOT open"
            - "GET /recruits/${rec_id}/certification-progress (no basis parameter) returns data.total_hours == 3.39 and data.basis == 'ATTENDED'"

      - name: terminal_weighted_vs_rolling_mean_diverge_on_late_slump
