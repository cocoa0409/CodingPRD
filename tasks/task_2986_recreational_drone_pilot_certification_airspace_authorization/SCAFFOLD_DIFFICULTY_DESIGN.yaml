            - "link 3: InsurancePolicy.${polid}.open_reserved_cents_total == 1250000, remaining_coverage_cents == 750000, and because 750000 < MIN_COMMERCIAL_COVERAGE_CENTS 1000000 the policy is now \"INSUFFICIENT\""
            - "link 4: Flight.${fb}.status == \"CANCELLED\" with cancellation_reason == \"COVERAGE_INSUFFICIENT\", even though nothing in the request mentions flight B"
