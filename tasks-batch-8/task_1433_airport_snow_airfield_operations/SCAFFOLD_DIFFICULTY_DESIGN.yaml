# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Airport Snow & Airfield Operations
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: event cost vs chemical)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: event_cost_provisional_vs_final_divergence
        grounds:
          - calculations.event_cost_accrual
          - entities.SnowEvent.fields.estimated_cost_cents
          - entities.SnowEvent.fields.actual_cost_cents
        distinguishing_aspect: |
          Entity domain = SnowEvent fiscal accrual: the SAME shift and the SAME
          application yield estimated_cost_cents == 497000 (provisional variant:
          SCHEDULED shift at planned 10h, AUTHORIZED application) but
          actual_cost_cents == 486000 (final variant: COMPLETED shift at 9.5
          worked hours, DISPENSED application) — two valid algorithms over
          identical records produce different totals.
        test_recipe:
          setup:
            - "3 READY equipment units; unit PLOW-01 hourly_rate_cents 14500"
            - "Surface RWY-09L 5000x150 ft (area 750000 sqft)"
            - "ChemicalProduct NAAC-01 base_rate 30, unit cost 12 cents/lb, seasonal_limit 100000"
            - "SnowEvent SNOW-A activated (chemical_limit 100000, budget 5000000)"
            - "One AUTHORIZED application: raw 24750 lbs (750 x 30 x 1.10 at 20F), line cost 297000 cents"
            - "One SCHEDULED shift OP-01 on PLOW-01, planned 08:00-18:00 (10h), base 5000 cents/h"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin, captures: { eq1: $.data.id } }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-01", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 12, seasonal_limit_lbs: 100000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-A", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id } }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1" }
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-01", event_id: "${ev}", equipment_unit_id: "${eq1}", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T18:00:00Z" }, as: OpsController, captures: { sh1: $.data.id } }
            - { call: "GET /snow-events/${ev}/cost-summary", as: OpsController, captures: { est_before: $.data.estimated_cost_cents, act_before: $.data.actual_cost_cents } }
          trigger:
            - { call: "POST /operator-shifts/${sh1}/shift-actions", payload: { action: "COMPLETE", worked_hours: 9.5 }, as: OpsController }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "DISPENSE" }, as: MaintenanceLead, as_user_id: "ml-dispenser-2" }
            - { call: "GET /snow-events/${ev}/cost-summary", as: OpsController, captures: { est_after: $.data.estimated_cost_cents, act_after: $.data.actual_cost_cents } }
          assert:
            - "est_before == 497000  (55000 labor + 145000 equipment + 297000 chemical, per-line rounded then summed)"
            - "act_before == 0"
            - "est_after == 0  (no SCHEDULED shifts or AUTHORIZED applications remain)"
            - "act_after == 486000  (51250 labor at 9.5h + 137750 equipment at 9.5h + 297000 chemical)"
            - "est_before != act_after  (identical underlying records; variants diverge by 11000 cents)"

      - name: chemical_raw_vs_authorized_environmental_cap_divergence
        grounds:
          - calculations.chemical_application_quantity
          - entities.ChemicalApplication.fields.raw_quantity_lbs
          - entities.ChemicalApplication.fields.authorized_quantity_lbs
        distinguishing_aspect: |
          Entity domain = ChemicalApplication/ChemicalProduct environmental
          permitting (distinct from the SnowEvent fiscal domain of
          event_cost_provisional_vs_final_divergence): planned_raw physics says
          24750 lbs while authorized_capped environmental authorization yields
          20000 lbs for the same application because the product's seasonal cap
          binds — two valid computations of "the quantity" diverge.
        test_recipe:
          setup:
            - "3 READY equipment units"
            - "Surface RWY-09L 5000x150 ft (area 750000 sqft)"
            - "ChemicalProduct KA-02 base_rate 30, unit cost 12, seasonal_limit_lbs 20000 (< raw demand)"
            - "SnowEvent SNOW-B activated (chemical_limit 100000, budget 50000000)"
            - "Application proposed at pavement_temp_f 20 -> raw_quantity_lbs 24750"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "KA-02", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 12, seasonal_limit_lbs: 20000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-B", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 50000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id, raw1: $.data.raw_quantity_lbs } }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1", captures: { auth_qty: $.data.authorized_quantity_lbs, capped_flag: $.data.capped } }
          assert:
            - "raw1 == 24750  (planned_raw variant: 750 units x 30 lbs x 1.10)"
            - "auth_qty == 20000  (authorized_capped variant: min(24750, event_remaining 100000, product_available 20000))"
            - "capped_flag == true"
            - "raw1 != auth_qty  (environmental cap binds; the two variants diverge)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) then mode (b))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: chemical_quantity_temperature_branch_nonlinearity
        grounds:
          - calculations.chemical_application_quantity
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: area_units x
          base_rate x a temperature-conditional factor (1.25 / 1.10 / 1.00),
          then nested min() against two environmental pools. Two applications
          identical in area and base rate but at 20F vs 10F yield 24750 vs
          28125 lbs — the conditional temperature branch, not a linear scale.
        test_recipe:
          setup:
            - "3 READY equipment units"
            - "Two surfaces with identical area 750000 sqft: RWY-09L (rank 1), RWY-09R (rank 2)"
            - "ChemicalProduct NAAC-01 base_rate 30, seasonal_limit 1000000, unit cost 12"
            - "SnowEvent SNOW-C activated (chemical_limit 1000000, budget 50000000)"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09R", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 2 }, as: SystemAdmin, captures: { s2: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-01", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 12, seasonal_limit_lbs: 1000000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-C", season_label: "2025-2026", chemical_limit_lbs: 1000000, budget_cents: 50000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { raw_cool: $.data.raw_quantity_lbs } }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s2}", product_id: "${prod}", pavement_temp_f: 10 }, as: MaintenanceLead, captures: { raw_cold: $.data.raw_quantity_lbs } }
          assert:
            - "raw_cool == 24750   (20F is in [15,28] -> factor 1.10; 750 x 30 x 1.10)"
            - "raw_cold == 28125   (10F < 15 -> factor 1.25; 750 x 30 x 1.25)"
            - "raw_cold - raw_cool == 3375  (non-linear conditional branch, not a proportional delta)"

      - name: cost_per_line_rounding_order_pinned
        grounds:
          - calculations.event_cost_accrual
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (distinct from mode
          (a) above): two SCHEDULED shifts of 0.5h at 1001 cents/h each produce
          per-line round_half_up(500.5) = 501 + 501 = 1002 under the pinned
          per-line-then-sum order; sum-then-round would give
          round_half_up(1001.0) = 1001. The scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "3 READY equipment units"
            - "SnowEvent SNOW-D activated (chemical_limit 1000, budget 100000)"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-D", season_label: "2025-2026", chemical_limit_lbs: 1000, budget_cents: 100000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-A", event_id: "${ev}", base_rate_cents_per_hour: 1001, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T08:30:00Z" }, as: OpsController }
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-B", event_id: "${ev}", base_rate_cents_per_hour: 1001, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T08:30:00Z" }, as: OpsController }
          trigger:
            - { call: "GET /snow-events/${ev}/cost-summary", as: OpsController, captures: { est: $.data.estimated_cost_cents } }
          assert:
            - "est == 1002  (per-line: round_half_up(0.5 x 1001) = 501 per shift; 501 + 501)"
            - "est != 1001  (sum-then-round of 500.5 + 500.5 = 1001.0 is the REJECTED order)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (parallel dimensions, then cyclic)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: snow_event_parallel_state_dimensions_independent
        grounds:
          - state_machines.SnowEvent.status
          - state_machines.SnowEvent.closure_status
          - entities.SnowEvent.fields.closure_status
        distinguishing_aspect: |
          Entity = SnowEvent with PARALLEL state dimensions: escalating the
          storm status (ACTIVATED -> ESCALATED -> ACTIVATED) must leave the
          independent closure_status dimension at PROPOSED — the two state axes
          on one row evolve without disturbing each other.
        test_recipe:
          setup:
            - "3 READY equipment units; SnowEvent SNOW-E ACTIVATED with closure PROPOSED"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-E", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /snow-events/${ev}/closure-actions", payload: { action: "PROPOSE" }, as: OpsController }
          trigger:
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ESCALATE" }, as: OpsController, captures: { st1: $.data.status, cl1: $.data.closure_status } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "DE_ESCALATE" }, as: OpsController, captures: { st2: $.data.status, cl2: $.data.closure_status } }
          assert:
            - "st1 == ESCALATED and cl1 == PROPOSED  (status axis moved; closure axis untouched)"
            - "st2 == ACTIVATED and cl2 == PROPOSED  (status axis cycled back; closure axis still untouched)"

      - name: airfield_surface_cyclic_close_reopen_loop
        grounds:
          - state_machines.AirfieldSurface.status
        distinguishing_aspect: |
          Entity = AirfieldSurface (different entity than SnowEvent above):
          a CYCLIC machine — OPEN -> RESTRICTED -> CLOSED -> RESTRICTED -> OPEN
          is a legal loop, and the CLOSED -> RESTRICTED arc is guarded by the
          latest REPORTED friction braking action (GOOD here).
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L OPEN; SnowEvent SNOW-F ACTIVATED"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-F", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController, captures: { st_a: $.data.status, sv_a: $.data.version } }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLOSE", event_id: "${ev}" }, as: OpsController, captures: { st_b: $.data.status, sv_b: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.60, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_b}" }, as: AirfieldInspector, captures: { fa1: $.data.id, ba1: $.data.braking_action } }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "REOPEN", event_id: "${ev}" }, as: OpsController, captures: { st_c: $.data.status } }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLEAR", event_id: "${ev}" }, as: OpsController, captures: { st_d: $.data.status } }
          assert:
            - "st_a == RESTRICTED and st_b == CLOSED"
            - "ba1 == GOOD  (mu 0.60 >= 0.50)"
            - "st_c == RESTRICTED  (cycle step CLOSED -> RESTRICTED guarded by GOOD friction)"
            - "st_d == OPEN  (full loop returns to the initial state)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth 3 from different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: report_supersede_to_notam_reissue_cascade
        grounds:
          - state_machines.ConditionReport.FILED_to_SUPERSEDED
          - state_machines.Notam.ISSUED_to_REISSUE_REQUIRED
          - entities.AirfieldSurface.fields.active_notam_count
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /condition-reports: the new report
          supersedes report R1 (link 1); R1's supersession flips ISSUED NOTAM
          N1 (sourced from R1) to REISSUE_REQUIRED (link 2); N1's flip
          recomputes the surface's active_notam_count 1 -> 0 (link 3). Each
          link is caused by the previous link, not by the POST itself.
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L RESTRICTED; SnowEvent SNOW-G ACTIVATED"
            - "ConditionReport R1 FILED on RWY-09L (the current report)"
            - "NOTAM N1 ISSUED, type SURFACE_CONDITION, source_report_id = R1 (surface.active_notam_count == 1)"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-G", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController, captures: { sv_r: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.60, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_r}" }, as: AirfieldInspector, captures: { fa1: $.data.id } }
            - { call: "GET /airfield-surfaces/${s1}", as: OpsController, captures: { sv_1: $.data.version } }
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "DRY_SNOW", coverage_pct: 40, depth_inches: 0.2, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_1}" }, as: AirfieldInspector, captures: { r1: $.data.id } }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "SURFACE_CONDITION", effective_from: "2026-08-02T00:00:00Z", effective_until: "2026-08-03T00:00:00Z", message: "RWY 09L compacted snow", source_report_id: "${r1}" }, as: OpsController, captures: { n1: $.data.id } }
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "ISSUE" }, as: OpsController, captures: { n1_status: $.data.status } }
            - { call: "GET /airfield-surfaces/${s1}", as: OpsController, captures: { cnt_before: $.data.active_notam_count, sv_2: $.data.version } }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "ICE", coverage_pct: 60, depth_inches: 0.5, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_2}" }, as: AirfieldInspector, captures: { r2: $.data.id } }
          assert:
            - "n1_status == ISSUED and cnt_before == 1  (pre-cascade baseline)"
            - "GET /condition-reports/${r1}.status == SUPERSEDED and superseded_by_id == ${r2}  (link 1)"
            - "GET /notams/${n1}.status == REISSUE_REQUIRED  (link 2, caused by R1's supersession)"
            - "GET /airfield-surfaces/${s1}.active_notam_count == 0  (link 3, caused by N1's flip)"

      - name: dispense_threshold_to_product_constraint_cascade
        grounds:
          - state_machines.ChemicalApplication.AUTHORIZED_to_DISPENSED
          - state_machines.ChemicalProduct.ACTIVE_to_CONSTRAINED
          - calculations.seasonal_chemical_counters
        distinguishing_aspect: |
          Depth-3 chain triggered by POST application-actions DISPENSE
          (different trigger than report_supersede_to_notam_reissue_cascade):
          dispense mutates product.seasonal_dispensed_lbs (link 1); the counter
          crossing 90% of the seasonal limit flips the product ACTIVE ->
          CONSTRAINED (link 2); the flip rejects every PROPOSED application on
          the product (link 3).
        test_recipe:
          setup:
            - "3 READY equipment units"
            - "Surface TWY-A 1000x100 ft (area 100000 sqft = 100 units)"
            - "ChemicalProduct KA-03 base_rate 95, unit cost 10, seasonal_limit_lbs 10000"
            - "SnowEvent SNOW-H ACTIVATED (chemical_limit 100000, budget 100000000)"
            - "Application APP1 on TWY-A at 30F: raw = 100 x 95 x 1.00 = 9500 lbs, AUTHORIZED"
            - "Application APP2 on TWY-A at 30F: raw 9500 lbs, left PROPOSED"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "TWY-A", surface_type: "TAXIWAY", length_ft: 1000, width_ft: 100, priority_rank: 3 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "KA-03", base_rate_lbs_per_1000sqft: 95, unit_cost_cents_per_lb: 10, seasonal_limit_lbs: 10000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-H", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 100000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 30 }, as: MaintenanceLead, captures: { app1: $.data.id, raw1: $.data.raw_quantity_lbs } }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1" }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 30 }, as: MaintenanceLead, captures: { app2: $.data.id } }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "DISPENSE" }, as: MaintenanceLead, as_user_id: "ml-dispenser-2" }
          assert:
            - "raw1 == 9500  (100 units x 95 x 1.00 at 30F)"
            - "GET /chemical-products/${prod}.seasonal_dispensed_lbs == 9500 and seasonal_reserved_lbs == 0  (link 1)"
            - "GET /chemical-products/${prod}.status == CONSTRAINED  (link 2: 9500 >= 0.9 x 10000)"
            - "GET /chemical-applications/${app2}.status == REJECTED  (link 3, caused by the product flip)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: authorize_state_error_beats_budget_error
        grounds:
          - validations[priority=5]
          - validations[priority=19]
          - errors[ERR_EVENT_NOT_ACTIVE]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair = state vs business_fiscal: the AUTHORIZE request
          violates BOTH (event STANDING_DOWN; projected cost 2475000 > budget
          200000) and the state error ERR_EVENT_NOT_ACTIVE (priority 5) must
          win over ERR_BUDGET_EXCEEDED (priority 19).
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L (area 750000 sqft)"
            - "ChemicalProduct NAAC-01 base 30, unit cost 100 cents/lb, seasonal_limit 1000000"
            - "SnowEvent SNOW-I ACTIVATED then STANDING_DOWN (all surfaces OPEN, so STAND_DOWN succeeds)"
            - "Application PROPOSED at 20F: raw 24750 lbs -> would-be line cost 2475000 cents > budget 200000"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-01", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 100, seasonal_limit_lbs: 1000000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-I", season_label: "2025-2026", chemical_limit_lbs: 1000000, budget_cents: 200000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "STAND_DOWN" }, as: OpsController }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1" }
          assert:
            - "response http == 409 and error_id == ERR_EVENT_NOT_ACTIVE  (state priority 5 beats fiscal priority 19)"
            - "GET /chemical-applications/${app1}.status == PROPOSED  (no partial authorization)"

      - name: notam_issue_safety_error_beats_overlap_error
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_UNSAFE_NOTAM_CONDITION]
          - errors[ERR_NOTAM_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair = business_safety vs business_temporal (different pair
          than state vs business_fiscal above): the ISSUE request violates BOTH
          (latest braking action POOR forbids a SURFACE_CONDITION notam; the
          closed window overlaps an ISSUED notam) and the safety error
          ERR_UNSAFE_NOTAM_CONDITION (priority 9) must win over
          ERR_NOTAM_WINDOW_OVERLAP (priority 13).
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L CLOSED; SnowEvent SNOW-J ACTIVATED"
            - "NOTAM N1 ISSUED, type RUNWAY_CLOSURE, closed window [2026-08-10T00:00Z, 2026-08-11T00:00Z]"
            - "Latest friction assessment on RWY-09L: mu 0.20 -> POOR (supersedes an earlier GOOD reading)"
            - "NOTAM N2 DRAFT, type SURFACE_CONDITION, window [2026-08-10T12:00Z, 2026-08-12T00:00Z] overlapping N1"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-J", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLOSE", event_id: "${ev}" }, as: OpsController, captures: { sv_c: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.60, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_c}" }, as: AirfieldInspector, captures: { fa_good: $.data.id } }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "RUNWAY_CLOSURE", effective_from: "2026-08-10T00:00:00Z", effective_until: "2026-08-11T00:00:00Z", message: "RWY 09L closed" }, as: OpsController, captures: { n1: $.data.id } }
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "ISSUE" }, as: OpsController }
            - { call: "GET /airfield-surfaces/${s1}", as: OpsController, captures: { sv_2: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.20, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_2}" }, as: AirfieldInspector, captures: { fa_poor: $.data.id, ba_poor: $.data.braking_action } }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "SURFACE_CONDITION", effective_from: "2026-08-10T12:00:00Z", effective_until: "2026-08-12T00:00:00Z", message: "RWY 09L icy patches", source_assessment_id: "${fa_poor}" }, as: OpsController, captures: { n2: $.data.id } }
          trigger:
            - { call: "POST /notams/${n2}/notam-actions", payload: { action: "ISSUE" }, as: OpsController }
          assert:
            - "ba_poor == POOR  (mu 0.20 in [0.10, 0.26))"
            - "response http == 409 and error_id == ERR_UNSAFE_NOTAM_CONDITION  (safety priority 9 beats temporal priority 13)"
            - "GET /notams/${n2}.status == DRAFT  (no partial issue)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: friction_mu_threshold_equality_medium
        grounds:
          - calculations.braking_action_from_mu
        distinguishing_aspect: |
          Metric = friction coefficient mu on POST /friction-assessments: the
          MEDIUM lower bound is INCLUSIVE — mu exactly 0.36 classifies MEDIUM
          while 0.35 classifies MEDIUM_POOR. Off-by-one-centum implementations
          (>) flip the result at the boundary.
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L; SnowEvent SNOW-K ACTIVATED"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv_0: $.data.version } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-K", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.36, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_0}" }, as: AirfieldInspector, captures: { ba_at: $.data.braking_action } }
            - { call: "GET /airfield-surfaces/${s1}", as: AirfieldInspector, captures: { sv_1: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.35, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_1}" }, as: AirfieldInspector, captures: { ba_below: $.data.braking_action } }
          assert:
            - "ba_at == MEDIUM       (mu == 0.36 hits the INCLUSIVE lower bound)"
            - "ba_below == MEDIUM_POOR  (mu == 0.35 falls below it)"

      - name: authorize_exact_availability_boundary_inclusive
        grounds:
          - calculations.chemical_application_quantity
          - validations[priority=8]
        distinguishing_aspect: |
          Metric = chemical quantity lbs on POST
          /chemical-applications/{id}/application-actions (AUTHORIZE) — a
          different metric and endpoint than the mu threshold above: when
          raw_quantity_lbs exactly equals the product's seasonal availability
          (24750 == 24750), authorization succeeds IN FULL (inclusive <=) with
          capped == false; a strict-< implementation wrongly caps or rejects.
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L (area 750000 sqft)"
            - "ChemicalProduct NAAC-EXACT base 30, unit cost 12, seasonal_limit_lbs exactly 24750"
            - "SnowEvent SNOW-L ACTIVATED (chemical_limit 100000, budget 50000000)"
            - "Application PROPOSED at 20F: raw 24750 lbs"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-EXACT", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 12, seasonal_limit_lbs: 24750 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-L", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 50000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id, raw1: $.data.raw_quantity_lbs } }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1", captures: { auth_qty: $.data.authorized_quantity_lbs, capped_flag: $.data.capped, st: $.data.status } }
          assert:
            - "raw1 == 24750 and st == AUTHORIZED  (exactly-at-cap authorizes; <= is inclusive)"
            - "auth_qty == 24750 and capped_flag == false"
            - "GET /chemical-products/${prod}.seasonal_available_lbs == 0  (pool fully consumed, not overdrawn)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: condition_report_requires_active_event
        grounds:
          - validations[priority=5]
          - state_machines.SnowEvent.status
        distinguishing_aspect: |
          Entity pair = ConditionReport -> SnowEvent: filing a report against
          a FORECAST (never activated) event is rejected with
          ERR_EVENT_NOT_ACTIVE even though the report's own payload is valid —
          the report's creatability is gated by a different entity's state.
        test_recipe:
          setup:
            - "Surface RWY-09L registered (OPEN); SnowEvent SNOW-M created but NEVER activated (status FORECAST)"
          setup_api_calls:
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id, sv_0: $.data.version } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-M", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /condition-reports", payload: { event_id: "${ev}", surface_id: "${s1}", contaminant_type: "DRY_SNOW", coverage_pct: 40, depth_inches: 0.2, observed_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_0}" }, as: AirfieldInspector }
          assert:
            - "response http == 409 and error_id == ERR_EVENT_NOT_ACTIVE"
            - "GET /condition-reports?surface_id=${s1} returns total_count == 0  (no report persisted)"

      - name: notam_issue_requires_non_open_surface
        grounds:
          - validations[priority=5]
          - state_machines.Notam.DRAFT_to_ISSUED
          - state_machines.AirfieldSurface.status
        distinguishing_aspect: |
          Entity pair = Notam -> AirfieldSurface (different pair than
          ConditionReport -> SnowEvent): ISSUE is rejected with
          ERR_INVALID_SURFACE_STATE while the referenced surface is OPEN, even
          though the event is ACTIVATED and the NOTAM payload is valid.
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L OPEN; SnowEvent SNOW-N ACTIVATED; NOTAM N1 DRAFT (RUNWAY_CLOSURE)"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-N", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "RUNWAY_CLOSURE", effective_from: "2026-08-10T00:00:00Z", effective_until: "2026-08-11T00:00:00Z", message: "RWY 09L closure planned" }, as: OpsController, captures: { n1: $.data.id } }
          trigger:
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "ISSUE" }, as: OpsController }
          assert:
            - "response http == 409 and error_id == ERR_INVALID_SURFACE_STATE"
            - "GET /notams/${n1}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: operator_shift_half_open_adjacency
        grounds:
          - validations[priority=12]
          - entities.OperatorShift.fields.start_utc
          - entities.OperatorShift.fields.end_utc
        distinguishing_aspect: |
          Resource = operator_code; interval semantics = HALF-OPEN
          [start_utc, end_utc): a shift starting exactly when another ends is
          ALLOWED (12:00 vs 12:00 touches but does not overlap), while
          [11:00,13:00) genuinely overlapping either neighbor is rejected with
          ERR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "3 READY equipment units; SnowEvent SNOW-O ACTIVATED"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-O", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
          trigger:
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-07", event_id: "${ev}", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T12:00:00Z" }, as: OpsController, captures: { sh1: $.data.id, st1: $.data.status } }
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-07", event_id: "${ev}", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T12:00:00Z", end_utc: "2026-08-10T16:00:00Z" }, as: OpsController, captures: { sh2: $.data.id, st2: $.data.status } }
            - { call: "POST /operator-shifts", payload: { operator_code: "OP-07", event_id: "${ev}", base_rate_cents_per_hour: 5000, start_utc: "2026-08-10T11:00:00Z", end_utc: "2026-08-10T13:00:00Z" }, as: OpsController }
          assert:
            - "st1 == SCHEDULED and st2 == SCHEDULED  (touching half-open windows coexist)"
            - "third create returns http 409 with error_id == ERR_SHIFT_OVERLAP  (genuine overlap)"

      - name: notam_window_closed_interval_touch_conflict
        grounds:
          - validations[priority=13]
          - entities.Notam.fields.effective_from
          - entities.Notam.fields.effective_until
        distinguishing_aspect: |
          Resource = (AirfieldSurface, notam_type) NOTAM windows; interval
          semantics = CLOSED [effective_from, effective_until] — DIFFERENT from
          the half-open shift semantics above: a second window whose start
          exactly equals the first window's end (06:00Z touch) DOES conflict
          and is rejected with ERR_NOTAM_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L CLOSED; SnowEvent SNOW-P ACTIVATED"
            - "NOTAM N1 ISSUED type RUNWAY_CLOSURE, closed window [2026-08-10T00:00Z, 2026-08-10T06:00Z]"
            - "NOTAM N2 DRAFT type RUNWAY_CLOSURE, window [2026-08-10T06:00Z, 2026-08-10T12:00Z] — touches N1 at 06:00Z"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-P", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLOSE", event_id: "${ev}" }, as: OpsController }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "RUNWAY_CLOSURE", effective_from: "2026-08-10T00:00:00Z", effective_until: "2026-08-10T06:00:00Z", message: "RWY 09L closed AM" }, as: OpsController, captures: { n1: $.data.id } }
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "ISSUE" }, as: OpsController, captures: { n1_st: $.data.status } }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "RUNWAY_CLOSURE", effective_from: "2026-08-10T06:00:00Z", effective_until: "2026-08-10T12:00:00Z", message: "RWY 09L closed PM" }, as: OpsController, captures: { n2: $.data.id } }
          trigger:
            - { call: "POST /notams/${n2}/notam-actions", payload: { action: "ISSUE" }, as: OpsController }
          assert:
            - "n1_st == ISSUED  (first window occupies the closed interval including 06:00Z)"
            - "response http == 409 and error_id == ERR_NOTAM_WINDOW_OVERLAP  (touching endpoints conflict under closed-interval semantics)"
            - "GET /notams/${n2}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: chemical_quota_authorize_void_conservation
        grounds:
          - calculations.seasonal_chemical_counters
          - state_machines.ChemicalApplication.AUTHORIZED_to_VOIDED
          - entities.ChemicalProduct.fields.seasonal_available_lbs
        distinguishing_aspect: |
          Conserved quantity = chemical quota split: AUTHORIZE then VOID must
          restore seasonal_dispensed_lbs + seasonal_reserved_lbs +
          seasonal_available_lbs == seasonal_limit_lbs with zero drift —
          reserved returns to 0 and available returns to the full 100000.
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L (area 750000 sqft)"
            - "ChemicalProduct NAAC-01 base 30, unit cost 12, seasonal_limit_lbs 100000"
            - "SnowEvent SNOW-Q ACTIVATED (chemical_limit 100000, budget 50000000); application raw 24750 lbs"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /chemical-products", payload: { product_code: "NAAC-01", base_rate_lbs_per_1000sqft: 30, unit_cost_cents_per_lb: 12, seasonal_limit_lbs: 100000 }, as: SystemAdmin, captures: { prod: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-Q", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 50000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /chemical-applications", payload: { event_id: "${ev}", surface_id: "${s1}", product_id: "${prod}", pavement_temp_f: 20 }, as: MaintenanceLead, captures: { app1: $.data.id } }
          trigger:
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "AUTHORIZE" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1" }
            - { call: "GET /chemical-products/${prod}", as: MaintenanceLead, captures: { res_mid: $.data.seasonal_reserved_lbs, avail_mid: $.data.seasonal_available_lbs, disp_mid: $.data.seasonal_dispensed_lbs } }
            - { call: "POST /chemical-applications/${app1}/application-actions", payload: { action: "VOID" }, as: MaintenanceLead, as_user_id: "ml-authorizer-1" }
            - { call: "GET /chemical-products/${prod}", as: MaintenanceLead, captures: { res_end: $.data.seasonal_reserved_lbs, avail_end: $.data.seasonal_available_lbs, disp_end: $.data.seasonal_dispensed_lbs } }
          assert:
            - "res_mid == 24750 and avail_mid == 75250 and disp_mid == 0   (AUTHORIZE moved quota into reserve)"
            - "res_end == 0 and avail_end == 100000 and disp_end == 0       (VOID compensates exactly)"
            - "disp + reserved + available == 100000 at every read          (conserved quota invariant)"

      - name: notam_active_count_issue_rescind_conservation
        grounds:
          - entities.AirfieldSurface.fields.active_notam_count
          - state_machines.Notam.DRAFT_to_ISSUED
          - state_machines.Notam.ISSUED_to_RESCINDED
        distinguishing_aspect: |
          Conserved quantity = per-surface active NOTAM count (a cardinality,
          different from the chemical mass-quota above): ISSUE increments
          active_notam_count by exactly 1 and its compensating RESCIND
          decrements by exactly 1, returning the surface to its baseline 0.
        test_recipe:
          setup:
            - "3 READY equipment units; Surface RWY-09L RESTRICTED; SnowEvent SNOW-R ACTIVATED"
            - "Latest friction mu 0.60 (GOOD); NOTAM N1 DRAFT type SURFACE_CONDITION sourced from that assessment"
          setup_api_calls:
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-01", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "PLOW-02", unit_type: "PLOW", hourly_rate_cents: 14500 }, as: SystemAdmin }
            - { call: "POST /equipment-units", payload: { unit_code: "BROOM-01", unit_type: "BROOM", hourly_rate_cents: 12000 }, as: SystemAdmin }
            - { call: "POST /airfield-surfaces", payload: { surface_code: "RWY-09L", surface_type: "RUNWAY", length_ft: 5000, width_ft: 150, priority_rank: 1 }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /snow-events", payload: { event_code: "SNOW-R", season_label: "2025-2026", chemical_limit_lbs: 100000, budget_cents: 5000000 }, as: OpsController, captures: { ev: $.data.id } }
            - { call: "POST /snow-events/${ev}/event-actions", payload: { action: "ACTIVATE" }, as: OpsController }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "RESTRICT", event_id: "${ev}" }, as: OpsController, captures: { sv_r: $.data.version } }
            - { call: "POST /friction-assessments", payload: { event_id: "${ev}", surface_id: "${s1}", mu_value: 0.60, measured_at: "2026-08-01T00:00:00Z", expected_surface_version: "${sv_r}" }, as: AirfieldInspector, captures: { fa1: $.data.id } }
            - { call: "POST /notams", payload: { event_id: "${ev}", surface_id: "${s1}", notam_type: "SURFACE_CONDITION", effective_from: "2026-08-02T00:00:00Z", effective_until: "2026-08-03T00:00:00Z", message: "RWY 09L wet snow", source_assessment_id: "${fa1}" }, as: OpsController, captures: { n1: $.data.id } }
          trigger:
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "ISSUE" }, as: OpsController }
            - { call: "GET /airfield-surfaces/${s1}", as: OpsController, captures: { cnt_mid: $.data.active_notam_count } }
            - { call: "POST /airfield-surfaces/${s1}/surface-actions", payload: { action: "CLEAR", event_id: "${ev}" }, as: OpsController }
            - { call: "POST /notams/${n1}/notam-actions", payload: { action: "RESCIND" }, as: OpsController, captures: { n1_end: $.data.status } }
            - { call: "GET /airfield-surfaces/${s1}", as: OpsController, captures: { cnt_end: $.data.active_notam_count } }
          assert:
            - "cnt_mid == 1   (ISSUE added exactly one active NOTAM)"
            - "n1_end == RESCINDED and cnt_end == 0   (RESCIND compensates exactly; baseline restored)"
