            - "trigger[3] -> 200 with data.roster_state == \"SEATED\", data.seated_count == 1, data.offered_count == 0"
            - "trigger[3] data.version == ${ens_v9} (both refusals bumped nothing)"

      - name: state_band_outranks_the_fiscal_band_on_one_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=22]
          - validations[priority=80]
          - difficulty.validations.priority_ordering
        excluded_because:
          difficulty_instance: aid_request_state_band_beats_fiscal_band
          rationale: "The 1.8 instance drives one aid-request that violates the state band at 22 (aid_status APPROVED) and the fiscal band at 80 (aid_requested_cents above assessed_cents) at the same time, asserting ERR_AID_REQUEST_NOT_ALLOWED_IN_STATE and then fixing each violation in turn to expose the second. A breadth copy would assert the same single ordering pair."

      - name: cascade_produced_state_blocks_a_later_validation
        claim_type: cascading_validation
        grounds:
          - validations[priority=45]
          - errors[ERR_DELINQUENT_ACCOUNT_BLOCKS_CLOSE]
          - difficulty.validations.cascading_validation
        excluded_because:
          difficulty_instance: season_close_gated_by_delinquent_tuition_account
          rationale: "The validation whose input is produced by an earlier cascade - a balance recomputation flipping an account to DELINQUENT, which then blocks the season CLOSED hop at priority 45 - is already driven end to end in 1.8, including the payment that clears the delinquency and unblocks the same call."

  # =========================================================================
  # Table 5 (Endpoints) - one instance per endpoint-shape row of the guide.
  - section: endpoints
    instances:
      - name: ensemble_event_create_read_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /ensemble-events]
          - endpoints[GET /ensemble-events/{eventId}]
          - endpoints[GET /ensemble-events]
          - entities.EnsembleEvent
        distinguishing_aspect: |
          EnsembleEvent's whole CRUD surface is create + read-one + list: §1.5 declares no
          PUT, PATCH or DELETE for it (every mutation goes through /programming or the
          participation endpoints), so the round trip must be lossless on the first write.
          The list endpoint honours both declared filters independently - ensemble_id returns
          both rows, kind=CONCERT returns only the concert.
        test_recipe:
          setup:
            - "One Season in PLANNING with one PHILHARMONIC ensemble and no events yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
          trigger:
            - call: "POST /ensemble-events"
              payload: { ensemble_id: "${ens_id}", kind: "REHEARSAL", start_at: "2026-10-05T18:00:00Z", end_at: "2026-10-05T20:00:00Z", venue_code: "HALL-A" }
              as: ArtisticDirector
              captures: { ev_r1_id: "$.data.id" }
            - call: "POST /ensemble-events"
              payload: { ensemble_id: "${ens_id}", kind: "CONCERT", start_at: "2026-11-15T19:00:00Z", end_at: "2026-11-15T21:00:00Z", venue_code: "HALL-B", tour_cost_share_cents: 0, eligibility_window_start: "2026-10-01T00:00:00Z" }
              as: ArtisticDirector
              captures: { ev_c1_id: "$.data.id" }
            - call: "GET /ensemble-events/${ev_c1_id}"
              as: RegistrarStaff
            - call: "GET /ensemble-events?ensemble_id=${ens_id}"
              as: RegistrarStaff
            - call: "GET /ensemble-events?ensemble_id=${ens_id}&kind=CONCERT"
              as: RegistrarStaff
          assert:
            - "trigger[0] -> 201 with data.kind == \"REHEARSAL\", data.programming_state == \"DRAFT\", data.participation_count == 0"
            - "trigger[0] data.is_dress_rehearsal == false, data.dress_rehearsal_required == false, data.chaperone_required == false"
            - "trigger[0] data.soloist_selection_mode == \"AUTO_SELECT\" (declared default) and data.soloist_member_id == null"
            - "trigger[0] data.guest_artist_fee_cents == 0 and data.version == 1"
            - "trigger[1] -> 201 with data.kind == \"CONCERT\" and data.eligibility_window_start == \"2026-10-01T00:00:00Z\""
            - "trigger[2] -> 200 with data.id == ${ev_c1_id}, data.venue_code == \"HALL-B\", data.start_at == \"2026-11-15T19:00:00Z\", data.version == 1"
            - "trigger[3] -> 200 with meta.total_count == 2"
            - "trigger[4] -> 200 with meta.total_count == 1 and data[0].id == ${ev_c1_id}"
            - "no PUT, PATCH or DELETE route exists for /ensemble-events in the §1.5 table"

