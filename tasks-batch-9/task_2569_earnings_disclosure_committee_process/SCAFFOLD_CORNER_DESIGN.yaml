              captures: { a_status: $.data.assessment_status, a_deadline: $.data.current_report_deadline_utc }
            - call: "POST /disclosure/material-events/${ev_b_id}/transitions"
              payload: { action: "ASSESS", determination: "NOT_REPORTABLE", determination_note: "Attempted to treat the boundary case as non-reportable." }
              as: LegalCounsel
              as_user_id: "${legal_id}"
              captures: { err_b: $.data.error_id }
            - call: "POST /disclosure/material-events/${ev_b_id}/transitions"
              payload: { action: "ASSESS", determination: "REPORTABLE", determination_note: "At the reportable floor; current report required." }
              as: LegalCounsel
