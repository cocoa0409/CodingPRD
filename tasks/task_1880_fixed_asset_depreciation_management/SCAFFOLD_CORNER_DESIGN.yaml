# =============================================================================
# Task 1880 — Scaffold Corner Design (Coverage Index for Non-Difficulty Tests, §1.9)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 per claim-extraction-guide taxonomy.
# Instances already exercised by §1.8 appear as excluded_because stubs.
# User ids: u_acct_1 / u_ctrl_1 / u_clerk_1 / u_tax_1 (opaque role identities).
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_asset_class_and_get_it_back
        claim_type: creation
        grounds:
          - "entities.AssetClass"
          - "endpoints[POST /asset-classes]"
          - "endpoints[GET /asset-classes/{id}]"
        distinguishing_aspect: "POST with all required fields returns 201 and the persisted row; GET by id echoes every input field."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "FURN", name: "Furniture", capitalization_threshold_cents: 100000, default_useful_life_months: 36, book_method: "STRAIGHT_LINE", tax_method: "TAX_STRAIGHT_LINE", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
          trigger:
            - call: "GET /asset-classes/${cls}"
              payload: {}
              as: TaxAnalyst
              as_user_id: u_tax_1
          assert:
            - "GET returns 200 with class_code == 'FURN', capitalization_threshold_cents == 100000, default_useful_life_months == 36, version == 1"
            - "id is a server-minted UUID; created_at/updated_at present in ISO 8601 UTC with millisecond precision"

      - name: create_asset_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.FixedAsset"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting acquisition_cost_cents (source: input, no default) is a 400, not a silent default."
        test_recipe:
          setup: ["AssetClass MACH exists"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-001", description: "No cost", asset_class_id: "${cls}", cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST; no FixedAsset persisted"

      - name: asset_defaults_pulled_from_class
        claim_type: defaults
        grounds:
          - "entities.FixedAsset.fields.salvage_value_cents"
          - "entities.FixedAsset.fields.useful_life_months"
        distinguishing_aspect: "Omitting salvage/life/methods/bonus inherits class defaults and zero salvage."
        test_recipe:
          setup: ["AssetClass MACH (life 60, SL, MACRS_5YR) exists"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: true }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-002", description: "Defaults asset", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
          assert:
            - "FixedAsset.${a}: salvage_value_cents == 0, useful_life_months == 60, book_method == STRAIGHT_LINE, tax_method == MACRS_5YR, bonus_elected == false, source == PURCHASE, status == DRAFT"

      - name: get_asset_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "A well-formed but unknown UUID yields 404 ERR_NOT_FOUND, not 500 or empty object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /fixed-assets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "404 with error_id == ERR_NOT_FOUND; error envelope carries meta + response_type == 'error'"

      - name: computed_accumulated_input_ignored
        claim_type: computed_fields
        grounds:
          - "entities.FixedAsset.fields.accumulated_book_cents"
        distinguishing_aspect: "Client-supplied values for computed fields are discarded, not stored."
        test_recipe:
          setup: ["AssetClass MACH exists"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-003", description: "Override attempt", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1", accumulated_book_cents: 99999, net_book_value_cents: 1 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id, acc: $.data.accumulated_book_cents }
          assert:
            - "201 created; response accumulated_book_cents == 0 and net_book_value_cents == 500000 — injected values ignored"

      - name: depreciation_entry_immutable_ledger_line
        claim_type: immutability
        grounds:
          - "entities.DepreciationEntry"
        distinguishing_aspect: "common_fields: false — entries expose id and created_at only (no version, no updated_at) and no PATCH/DELETE endpoint exists for them."
        test_recipe:
          setup: ["Asset A-004 cost 24000, life 2, in service 2026-01-10; run 2026-01 posted"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-004", description: "Entry source", asset_class_id: "${cls}", acquisition_cost_cents: 24000, cost_center: "CC1", location: "PLANT-1", useful_life_months: 2 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "GET /depreciation-entries"
              payload: { asset_id: "${a}", ledger: "BOOK" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { e: "$.data[0].id" }
          trigger:
            - call: "GET /depreciation-entries/${e}"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          assert:
            - "200 with ledger == 'BOOK', period == '2026-01', amount_cents == 12000, source == 'RUN', run_id == ${r1}"
            - "response has no 'version' and no 'updated_at' key (append-only ledger line)"

      - name: component_below_threshold_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_BELOW_CAPITALIZATION_THRESHOLD]"
        distinguishing_aspect: "Major-repair classification: component cost under the class threshold is an expense and must not be recorded as a component asset."
        test_recipe:
          setup: ["Parent asset A-005 IN SERVICE (cost 600000); class threshold 250000"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-005", description: "Parent", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { p: $.data.id }
            - call: "POST /fixed-assets/${p}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-005-R", description: "Minor repair", asset_class_id: "${cls}", acquisition_cost_cents: 100000, cost_center: "CC1", location: "PLANT-1", parent_asset_id: "${p}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "422 with error_id == ERR_BELOW_CAPITALIZATION_THRESHOLD (100000 < 250000); no component asset persisted"

      - name: component_on_draft_parent_rejected
        claim_type: parent_relationships
        grounds:
          - "validations[priority=4]"
          - "entities.FixedAsset.fields.parent_asset_id"
        distinguishing_aspect: "A component can only attach to an IN_SERVICE parent; a DRAFT parent rejects with a state error."
        test_recipe:
          setup: ["Parent asset A-006 in DRAFT (never placed in service)"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-006", description: "Draft parent", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { p: $.data.id }
          trigger:
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-006-C", description: "Component", asset_class_id: "${cls}", acquisition_cost_cents: 300000, cost_center: "CC1", location: "PLANT-1", parent_asset_id: "${p}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "409 with error_id == ERR_INVALID_STATE (parent must be IN_SERVICE); no component persisted"

      - name: cost_line_with_unknown_project_not_found
        claim_type: parent_relationships
        grounds:
          - "entities.CIPCostLine.fields.project_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "FK integrity: a body FK referencing a missing parent is a 404 existence failure."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cip-cost-lines"
              payload: { project_id: "00000000-0000-4000-8000-000000000000", amount_cents: 1000, cost_type: "OTHER", incurred_date: "2026-01-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"

      - name: asset_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /fixed-assets]"
        distinguishing_aspect: "limit/offset/total_count/has_more follow §1.0 defaults (limit default 10, max 100); page 1 of 2 assets with limit=1 reports has_more true."
        test_recipe:
          setup: ["AssetClass MACH; two assets A-010, A-011 created"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-010", description: "One", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-011", description: "Two", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "GET /fixed-assets?limit=1&offset=0"
              payload: {}
              as: InventoryClerk
              as_user_id: u_clerk_1
            - call: "GET /fixed-assets?limit=1&offset=1"
              payload: {}
              as: InventoryClerk
              as_user_id: u_clerk_1
          assert:
            - "page 1: response_type == 'array'; data has exactly 1 item; pagination block: limit == 1, offset == 0, total_count == 2, has_more == true"
            - "page 2: exactly 1 item (the other asset), offset == 1, has_more == false; the two pages together contain both assets with no overlap"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds:
          - "state_machines.CapitalProject"
          - "state_machines.FixedAsset"
          - "state_machines.Disposal"
          - "state_machines.ImpairmentReview"
          - "state_machines.DepreciationRun"
          - "state_machines.ExternalSchedule"
          - "state_machines.InventoryRun"
        distinguishing_aspect: "Every machine starts in its declared initial_state on creation, before any action endpoint runs."
        test_recipe:
          setup: ["AssetClass MACH; asset A-020 in service 2026-01-10"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-020", description: "Init asset", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-I", name: "Init", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pj_st: $.data.status }
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SCRAP", effective_date: "2026-06-15" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { d_st: $.data.status, d: $.data.id }
            - call: "POST /impairment-reviews"
              payload: { asset_id: "${a}", indicator: "DAMAGE" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { rv_st: $.data.status }
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { rn_st: $.data.status }
            - call: "POST /external-schedules"
              payload: { asset_id: "${a}", schedule_type: "PROPERTY_TAX", schedule_year: 2026, assessed_value_cents: 8000000 }
              as: TaxAnalyst
              as_user_id: u_tax_1
              captures: { sc_st: $.data.status }
            - call: "POST /inventory-runs"
              payload: { name: "Init run", scope_type: "ALL" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { ir_st: $.data.status }
          assert:
            - "project status == OPEN; disposal status == REQUESTED; review status == OPEN; run status == OPEN; schedule status == IMPORTED; inventory run status == COUNTING"
            - "fresh FixedAsset (pre-place-in-service) starts DRAFT — verified on the A-020 create response"

      - name: place_in_service_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.FixedAsset"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "place-in-service is only valid from DRAFT; replaying it on IN_SERVICE is rejected and idempotency is NOT assumed."
        test_recipe:
          setup: ["Asset A-021 already IN_SERVICE"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-021", description: "Twice placed", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-02-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err: $.data.error_id }
          assert:
            - "409 with error_id == ERR_INVALID_STATE; in_service_date remains 2026-01-10 (unchanged)"

      - name: terminal_lockdown_disposed_asset
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.FixedAsset"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_ALREADY_DISPOSED]"
        distinguishing_aspect: "From terminal DISPOSED every further transition is closed: place-in-service fails and a second disposal fails with a distinct domain error."
        test_recipe:
          setup: ["Asset A-022 in service 2026-01-10, SCRAP-disposed (posted) effective 2026-02-20"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-022", description: "Terminal asset", asset_class_id: "${cls}", acquisition_cost_cents: 500000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SCRAP", effective_date: "2026-02-20" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { d: $.data.id }
            - call: "POST /disposals/${d}/approve"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
            - call: "POST /disposals/${d}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-03-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err1: $.data.error_id }
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SALE", proceeds_cents: 1000, effective_date: "2026-03-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { err2: $.data.error_id }
          assert:
            - "place-in-service -> 409 ERR_INVALID_STATE"
            - "second disposal -> 409 ERR_ALREADY_DISPOSED; asset remains DISPOSED"

      - name: cancel_project_twice_returns_project_not_open
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.CapitalProject"
          - "errors[ERR_PROJECT_NOT_OPEN]"
        distinguishing_aspect: "CANCELLED is terminal for the project machine; a second cancel is rejected."
        test_recipe:
          setup: ["project PROJ-X created and cancelled"]
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /capital-projects"
              payload: { project_code: "PROJ-X", name: "Cancel me", asset_class_id: "${cls}" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { pj: $.data.id }
            - call: "POST /capital-projects/${pj}/cancel"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          trigger:
            - call: "POST /capital-projects/${pj}/cancel"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
              captures: { err: $.data.error_id }
          assert:
            - "409 with error_id == ERR_PROJECT_NOT_OPEN"

      - name: auto_fully_depreciated_transition
        claim_type: valid_transition
        grounds:
          - "state_machines.FixedAsset"
        excluded_because:
          difficulty_instance: full_depreciation_exact_equality_transition
          rationale: "The system auto-transition IN_SERVICE -> FULLY_DEPRECIATED at exact basis equality is asserted there."

      - name: inventory_recount_loop
        claim_type: valid_transition
        grounds:
          - "state_machines.InventoryRun"
        excluded_because:
          difficulty_instance: inventory_recount_reconciling_cycle
          rationale: "COUNTING -> RECONCILING -> COUNTING cycle and close are exercised there."

      - name: disposal_revision_loop
        claim_type: valid_transition
        grounds:
          - "state_machines.Disposal"
        excluded_because:
          difficulty_instance: disposal_reject_resubmit_revision_cycle
          rationale: "REQUESTED -> REJECTED -> REQUESTED -> APPROVED -> POSTED is exercised there."

      - name: transfer_disposal_moves_cost_center_without_derecognition
        claim_type: side_effect_execution
        grounds:
          - "state_machines.FixedAsset"
          - "state_machines.Disposal"
          - "calculations.disposal_gain_loss"
        distinguishing_aspect: "TRANSFER is the non-derecognizing branch: the asset stays IN_SERVICE in the new cost center, gain/loss fields are exactly 0, and no final depreciation entries are created."
        test_recipe:
