      - name: registration_submit_admits_the_deadline_instant_and_rejects_the_next_one
        claim_type: temporal_validation
        grounds:
          - validations.priority_42.check
          - entities.StateProgram.fields.registration_deadline
          - endpoints.POST /epr/_clock/set_current_utc
        distinguishing_aspect: "The same registration submit fails with ERR_REGISTRATION_DEADLINE_PASSED at 2027-01-01T00:00:00Z and succeeds at exactly the 2026-12-31T23:59:59Z deadline instant, so the boundary is inclusive."
        test_recipe:
          setup:
            - "A CA program with registration_deadline 2026-12-31T23:59:59Z, an obligated producer with one ACTIVE SKU, a determination, and a DRAFT registration."
          setup_api_calls:
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "ENTITY_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 1000000, small_producer_tonnage_threshold_kg: 1.000, exempt_product_categories: [], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
