      - name: second_breach_reading_while_excursion_open_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=18.6]", "errors[ERR_EXCURSION_ALREADY_OPEN]"]
        distinguishing_aspect: "A second out-of-band reading while the shipment's excursion is still OPEN is rejected ERR_EXCURSION_ALREADY_OPEN; the shipment stays EXCURSION_HOLD."
        test_recipe:
          setup: ["cold-chain chain to EXCURSION_HOLD with an OPEN excursion"]
          setup_api_calls:
            - { call: "POST /lab/warehouses", payload: { name: "WH-NE", region_code: "US-NE", hazmat_certified: true }, as: OpsAdmin, captures: { wh_id: "$.data.id" } }
            - { call: "POST /lab/storage-zones", payload: { warehouse_id: "${wh_id}", zone_class: "REFRIGERATED_2_8", capacity_units: 1000, rotation_policy: "FEFO" }, as: OpsAdmin, captures: { zone_id: "$.data.id" } }
