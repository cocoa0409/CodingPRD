            - call: "POST /drugs"
              payload: { name: "Tocilizumab", molecule_class: "IL6", route: "IV", formulary_tier: 4, acquisition_cost_cents: 500000, admin_time_minutes: 150, monitoring_panel_type: "CMP", monitoring_panel_interval_days: 90 }
              as: RegistryAdmin
              captures: { tcz_id: $.data.id }
            - call: "POST /payer-plans"
              payload: { name: "Meridian PPO", pharmacy_benefit_enabled: true, medical_benefit_enabled: true, site_of_care_policy: "PREFER_AMBULATORY", coinsurance_pct: 0.175, deductible_remaining_cents: 100000, medical_facility_fee_cents: 12500, hospital_outpatient_multiplier: 1.40, appeal_rounds_allowed: 2, auth_validity_days: 180, step_therapy_classes_required: ["TNFI"] }
              as: RegistryAdmin
              captures: { mer_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
