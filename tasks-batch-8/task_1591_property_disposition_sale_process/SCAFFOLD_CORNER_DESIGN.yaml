        grounds:
          - "errors[ERR_ANALYSIS_NOT_APPROVED]"
          - "errors[ERR_HOLD_RECOMMENDED]"
          - "validations[priority=19]"
          - "validations[priority=20]"
        distinguishing_aspect: "list with NO analysis -> ERR_ANALYSIS_NOT_APPROVED; after an APPROVED analysis recommending HOLD (sell_net exactly 95% of hold), the same call -> ERR_HOLD_RECOMMENDED — the two referential gates fire in priority order on one asset."
        test_recipe:
          setup: ["Gamma asset only"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Gamma", market: "Denver", asset_type: MULTIFAMILY, noi_cents: 100000000, noi_growth_bps: 200, book_value_cents: 1500000000, guidance_price_cents: 2000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { g_id: $.data.id, g_v: $.data.version } }
          trigger:
