  - rule_id: transitive_cascade
    instances:

      - name: audit_finalize_cascades_restatement_reconciliation_balance_and_notice
        grounds:
          - state_machines.AuditEngagement.FINDINGS_ISSUED_to_FINAL
          - state_machines.GrossReceiptsReport.ACCEPTED_to_RESTATED
          - state_machines.FeeReconciliation.PENDING_PAYMENT_to_SUPERSEDED
          - state_machines.Lease.compliance_status.COMPLIANT_to_DEFICIENT
          - calculations.audit_underreport_assessment
          - calculations.annual_fee_reconciliation
          - entities.Lease.fields.outstanding_fee_balance_cents
          - entities.ComplianceAction.fields.origin
        distinguishing_aspect: |
          A depth-4 chain where each hop is caused strictly by the previous one: finalizing
          the audit restates the three covered reports (hop 1), the restated receipts force
          the lease-year reconciliation to be SUPERSEDED by a replacement carrying
          penalty 220,000 and interest 66,000 (hop 2), the replacement's 2,486,000
          rewrites Lease.outstanding_fee_balance_cents (hop 3), and only because that
          balance exceeds the 2,000,000 notice threshold does the lease turn DEFICIENT with
          a SYSTEM_ISSUED FEE_DELINQUENCY notice (hop 4) — the year-1 delta of 1,300,000
          would have stopped the chain at hop 3.
