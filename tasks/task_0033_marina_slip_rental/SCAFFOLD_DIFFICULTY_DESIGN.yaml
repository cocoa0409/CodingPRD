              payload: { email: "th@x.com", full_name: "T H" }
              as: HarborMaster
              captures: { th_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "ti@x.com", full_name: "T I" }
              as: HarborMaster
              captures: { ti_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${th_id}", name: "VH", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PH", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${th_id}"
              captures: { vh_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${ti_id}", name: "VI", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PI", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${ti_id}"
              captures: { vi_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${th_id}", vessel_id: "${vh_id}", start_date: "2026-09-01", end_date: "2026-09-10", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${th_id}"
              captures: { lease_h_id: $.data.id, slip_v1: $.data.version }
          trigger:
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${ti_id}", vessel_id: "${vi_id}", start_date: "2026-09-05", end_date: "2026-09-15", expected_slip_version: "${slip_v1}" }
              as: Tenant
              as_user_id: "${ti_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_SLIP_DATE_CONFLICT\""
            - "trigger response http_status == 409"

      - name: liveaboard_quota_aggregate_capacity_at_marina
        grounds:
          - validations[priority=11]
          - entities.Marina.fields.liveaboard_current_count
          - entities.Marina.fields.liveaboard_cap
        distinguishing_aspect: |
          Different interval semantics — AGGREGATE-CAPACITY overlap on a
          DIFFERENT resource (Marina, not Slip). The conserved "interval"
          here is the count of concurrent APPROVED liveaboard tenants; an
          approval is rejected when the aggregate already saturates capacity
          regardless of date geometry. Different geometric treatment from
          rule-8 instance 1 (point-in-time aggregate cap vs half-open
          interval intersect).
        test_recipe:
          setup:
            - "Marina HMP cap=2; tenants TJ,TK already APPROVED (count=2); TL PENDING approval."
          setup_api_calls:
            - call: "POST /marinas"
