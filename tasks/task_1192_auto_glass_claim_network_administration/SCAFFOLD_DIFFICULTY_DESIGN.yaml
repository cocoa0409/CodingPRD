          setup:
            - "FL regulation; policyholder + COMPREHENSIVE policy"
            - "STANDARD shop mobile_capable=true mobile_unit_count=1 serving 336"
            - "claim A work order ACCEPTED (will schedule MOBILE 10:00-11:00); claim B work order ACCEPTED (will try MOBILE 11:30-12:30 same day)"
