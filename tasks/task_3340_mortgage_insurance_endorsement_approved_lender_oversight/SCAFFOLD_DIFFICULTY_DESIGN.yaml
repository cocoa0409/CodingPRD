            - "captured ${d7_endorsed} == ENDORSED"
            - "captured ${d7_vintage} == POST_CUTOFF (endorsed at 2026-09-01)"
            - "LoanCase.${c_case_id}.ltv_bps == 8333 (round_half_up(20000000/24000000*10000))"

  - rule_id: transitive_cascade
    instances:
      - name: tier1_defect_confirm_cascades_review_case_escrow
        grounds:
          - state_machines.Defect.OPEN_to_CONFIRMED
          - state_machines.PostEndorsementReview.FINDINGS_RECORDED_to_CLOSURE_PENDING
          - state_machines.RepairEscrow.OPEN_to_FROZEN
          - entities.LoanCase.fields.endorsement_integrity
        distinguishing_aspect: "Depth-3 chain from POST /mi/defects/{id}/confirm: the CONFIRMED TIER_1 defect itself moves the review FINDINGS_RECORDED -> CLOSURE_PENDING; that review transition impairs the case (endorsement_integrity SOUND -> IMPAIRED); the impairment freezes the case's OPEN escrow (freeze_origin=IMPAIRMENT) — each hop caused by the previous hop, not by the original request."
        test_recipe:
          setup:
            - "Lender APPROVED; case endorsed 2026-09-01 by rev-alpha, defaulted 2026-10-01."
            - "OPEN escrow (window 2026-09-01..2026-12-31, amount 500000) on the case."
            - "Post-endorsement review opened by rev-gamma (segregation: != rev-alpha)."
            - "Defect INCOME_MISCALC recorded while case IN_DEFAULT: score = round(40 * 1.0 * 1.25) = 50 -> TIER_1."
          setup_api_calls:
            - *d2_clock
            - *d1_lender
            - call: "POST /mi/lenders/${d1_lender_id}/financial-filings"
              payload: { fiscal_year_end: "2026-06-30", total_assets_cents: 140000000, total_liabilities_cents: 20000000, liquid_assets_cents: 20000000, expected_lender_version: "${d1_lender_v}" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { d8_filing_id: $.data.id }
            - call: "POST /mi/financial-filings/${d8_filing_id}/decide"
              payload: { decision: "ACCEPT", expected_lender_version: "${d1_lender_v} + 1" }
              as: FhaReviewer
              as_user_id: "rev-alpha"
            - *d1_advance
            - *d1_approve
            - *c_case
            - *c_appraisal
            - *c_appraisal_accept
            - *c_submit
            - *c_endorse
            - &e_escrow
              call: "POST /mi/loan-cases/${c_case_id}/repair-escrows"
              payload: { amount_cents: 500000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: LenderOfficer
              as_user_id: "${d1_lender_id}"
              captures: { e_escrow_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - *c_default
            - &e_review
              call: "POST /mi/loan-cases/${c_case_id}/post-endorsement-reviews"
              payload: { scope_codes: ["UNDERWRITING"] }
              as: FhaReviewer
              as_user_id: "rev-gamma"
              captures: { e_review_id: $.data.id }
            - &e_defect_t1
              call: "POST /mi/post-endorsement-reviews/${e_review_id}/defects"
              payload: { defect_code: "INCOME_MISCALC", detail: "income overstated" }
              as: FhaReviewer
              as_user_id: "rev-gamma"
              captures: { e_defect_id: $.data.id, e_defect_tier: $.data.severity_tier, e_defect_score: $.data.severity_score }
          trigger:
            - call: "POST /mi/defects/${e_defect_id}/confirm"
              payload: { decision: "CONFIRM" }
              as: FhaApprover
              as_user_id: "appr-beta"
            - call: "GET /mi/loan-cases/${c_case_id}"
              payload: {}
              as: FhaApprover
              as_user_id: "appr-beta"
              captures: { e_case_integrity: $.data.endorsement_integrity }
            - call: "GET /mi/loan-cases/${c_case_id}/post-endorsement-reviews"
