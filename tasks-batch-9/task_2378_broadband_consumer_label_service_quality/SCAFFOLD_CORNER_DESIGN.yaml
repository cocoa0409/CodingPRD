        excluded_because:
          difficulty_instance: combinatorial_formula / percentage_fee_rounding_order_pinned_round_then_sum
          rationale: "The named §1.8 instance pins round-then-sum against the sum-then-round alternative and asserts the one-cent divergence on the reference fixture."

      - name: discount_cap_constant_applied_after_percentage_fees
        claim_type: constants_applied
        grounds:
          - calculations.discount_program_benefit
          - validation_constants.DISCOUNT_MONTHLY_CAP_CENTS
        excluded_because:
          difficulty_instance: combinatorial_formula / discount_benefit_evaluation_order_after_percentage_fees
          rationale: "The named §1.8 instance asserts the 3000-cent cap, the min() clamp and the pinned gross-before-benefit ordering."

      - name: first_year_variants_diverge_on_the_same_label
        claim_type: variant_divergence
        grounds:
          - calculations.first_year_total_disclosure
        excluded_because:
          difficulty_instance: dual_variant_calc / first_year_disclosure_variants_diverge_on_same_label
          rationale: "The named §1.8 instance computes both first-year variants on one label and asserts the 23172-cent delta."

      - name: typical_speed_variants_diverge_on_the_same_pool
        claim_type: variant_divergence
        grounds:
          - calculations.typical_speed_metrics
        excluded_because:
          difficulty_instance: dual_variant_calc / typical_speed_variants_diverge_on_identical_run_pool
          rationale: "The named §1.8 instance computes both metric variants over one run pool and asserts the divergent download, upload and latency figures."

      - name: aggregation_running_total_after_reversal
        claim_type: aggregation
        grounds:
          - entities.ServicePlan.fields.evidence_sample_total
        excluded_because:
          difficulty_instance: compensating_invariant / invalidate_run_restores_evidence_sample_total_invariant
          rationale: "The named §1.8 instance asserts the aggregate after each add and after the reversal, restoring the pre-add value exactly."

      - name: interval_merge_adjacent_label_windows
        claim_type: interval_merge
        grounds:
          - calculations.effective_label_selection
          - validations.priority_60
        excluded_because:
          difficulty_instance: resource_temporal_overlap / label_display_window_half_open_adjacency_allowed
          rationale: "The named §1.8 instance tests adjacency at gap zero, one-second overlap and disjoint windows against the half-open rule."

      - name: waterfall_floor_then_ceiling_on_credits
        claim_type: waterfall_allocation
        grounds:
          - calculations.remediation_credit_amount
          - validation_constants.CREDIT_FLOOR_CENTS
        excluded_because:
          difficulty_instance: transitive_cascade / uphold_complaint_four_hop_credit_audit_cascade
          rationale: "The named §1.8 instance asserts the round-then-floor-then-ceiling order on both a floor-lifted and a ceiling-clamped credit."

      - name: constraint_propagation_reaches_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.plan_label_posture
        excluded_because:
          difficulty_instance: transitive_cascade / invalidate_run_five_hop_substantiation_cascade
          rationale: "The named §1.8 instance propagates one invalidation through five hops to the posture and asserts the terminal FROZEN fixed point."

