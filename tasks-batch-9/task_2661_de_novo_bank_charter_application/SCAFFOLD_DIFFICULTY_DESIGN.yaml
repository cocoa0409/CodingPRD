              as: CharterCounsel
              captures: { o2_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
              payload: { full_name: "Priya Raghunathan", role_on_board: "PROPOSED_CRO", is_independent: true, affiliation_code: "IND_A", banking_years: 3, regulatory_experience_score: 66 }
              as: CharterCounsel
              captures: { o3_id: $.data.id }
            - call: "POST /de-novo/organizing-groups/${g_id}/organizers"
