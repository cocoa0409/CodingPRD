            - call: "POST /bureau/clients"
              payload: { client_code: "CL-V3", name: "Past Window Partners", dr_readiness_required: false }
              as: BureauAdmin
              captures: { v3_client_id: "$.data.id" }
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-V3", capabilities: [], sheets_per_hour: 600, daily_sheet_capacity: 2000 }
              as: BureauAdmin
              captures: { v3_line_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${v3_client_id}", template_code: "T-V3", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { v3_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${v3_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${v3_client_id}", file_name: "v3.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 5000 }
              as: ClientLiaison
              captures: { v3_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${v3_file_id}", account_ref: "ABC2301", sequence_no: 1, statement_amount_cents: 5000, address_line1: "2800 Clock Court", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "2801" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${v3_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${v3_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${v3_file_id}", template_id: "${v3_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { v3_job_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${v3_job_id}/presort"
              payload: {}
              as: CompositionOperator
          trigger:
            - call: "POST /bureau/composition-jobs/${v3_job_id}/schedule"
              payload: { window_start: "2026-08-09T23:59:00Z", press_line_id: "${v3_line_id}" }
              as: ProductionScheduler
              captures: { v3_error: "$.data.error_id" }
            - call: "POST /bureau/composition-jobs/${v3_job_id}/schedule"
              payload: { window_start: "2026-08-10T00:00:00Z", press_line_id: "${v3_line_id}" }
              as: ProductionScheduler
              captures: { v3_run_id: "$.data.id", v3_run_status: "$.data.status", v3_window_end: "$.data.window_end" }
          assert:
            - "HTTP 422 with ${v3_error} == ERR_WINDOW_IN_PAST for a start one minute before the clock, and the job stays PRESORTED with no PrintRun row"
            - "HTTP 201 with ${v3_run_status} == PLANNED and ${v3_window_end} == 2026-08-10T01:00:00Z for a start exactly at the clock — the comparison is window_start < current_utc, not <="
            - "The job advances to SCHEDULED only on the accepted call: GET /bureau/print-runs?composition_job_id=${v3_job_id} returns total_count == 1"

      - name: dr_readiness_is_not_checked_when_the_client_opts_out
        claim_type: conditional_validation
        grounds: [validations.ERR_DR_SITE_NOT_READY, entities.Client.fields.dr_readiness_required]
        distinguishing_aspect: "The disaster-recovery gate is guarded by the client's own dr_readiness_required flag, so a job for an opted-out client schedules successfully even while the single DrSite reads FAILED."
        test_recipe:
          setup:
            - "DR site DR-V4 with a FAIL drill recorded, leaving readiness_status FAILED."
            - "Client CL-V4 created with dr_readiness_required false; ACTIVE template T-V4; press line PL-V4 (600 sheets/hour, capacity 2000)."
            - "A one-record file composed and presorted."
          setup_api_calls:
