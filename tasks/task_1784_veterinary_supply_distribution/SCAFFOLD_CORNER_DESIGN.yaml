    - errors[ERR_NOT_SHORT_DATED]
    excluded_because:
      difficulty_instance: short_date_window_180_day_boundary
      rationale: "Asserted as the 181-day rejection leg of the named \xA71.8 boundary instance."
  - name: error_delivery_window_overlap_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DELIVERY_WINDOW_OVERLAP]
    excluded_because:
