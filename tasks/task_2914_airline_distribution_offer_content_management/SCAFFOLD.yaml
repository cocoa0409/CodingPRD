# =============================================================================
# SCAFFOLD — task_2914_airline_distribution_offer_content_management
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines · §1.2.1
# Concurrency · §1.3 Calculations · §1.4 Validations · §1.5 Endpoints ·
# §1.6 Errors · §1.7 RBAC
#
# Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8).
# Corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2914. Airline Distribution & Offer Content Management (airline distribution
  strategy): content differentiation across direct, modern retailing
  connections and legacy distribution channels with fare filing rules, agency
  incentive agreements, surcharge structures and content access tiers, offer
  construction combining fares, ancillaries and bundles delivered dynamically
  by channel, order management with servicing capability parity across
  channels including changes and refunds, corporate contract distribution with
  negotiated fares and traceability requirements, technology partner
  certification and connectivity testing with aggregators, distribution cost
  per booking analysis across channels, regulatory display and disclosure
  requirements in each channel

domain_name: airline-distribution-offers

# All collections are declared at the API root (flat peer topology): /channels,
# /fare-filings, /offers, /orders, /partner-certifications, ... An empty prefix
# is therefore the correct top-level resource path for this scaffold.
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Fourteen peer entities linked exclusively by foreign keys declared on the
  # child (`FK -> Parent.id`). Only four sub-resource URL segments exist
  # (`/channels/{id}/surcharge-rules`, `/offers/{id}/items`,
  # `/orders/{id}/service-requests`,
  # `/partner-certifications/{id}/connectivity-tests`); every other entity is
  # addressed at its own root collection with FK fields in the body.

  state_machine_shape: parallel
  # Order carries two independent dimensions (payment_status ×
  # fulfillment_status) that advance through separate endpoints;
  # AgencyAgreement is cyclic (PROPOSED -> COUNTERED -> PROPOSED negotiation
  # rounds); ServiceRequest is branching fork-join
  # (UNDER_REVIEW -> {APPROVED, REJECTED} -> APPLIED) with divergent
  # side-effect sets per request_type.

  relationship_patterns:
    - one_to_many          # Channel -> SurchargeRule, Offer -> OfferItem, Order -> ServiceRequest
    - self_referential     # FareFiling.base_filing_id -> FareFiling.id (revision chain)
    - cross_aggregate      # Order -> AgencyAgreement revenue ledger, Offer -> CorporateContract cap
    - polymorphic          # DistributionPartner serves TRAVEL_AGENCY / TECH_PROVIDER / CORPORATE roles

  role_model: segregation_of_duties
  # Six roles. The DistributionManager who proposed an AgencyAgreement may not
  # be the DistributionManager who accepts it (X-User-ID compared), and the
  # TechnologyPartner that ran the connectivity tests may not certify itself.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- 1. Channel : distribution channel configuration + cost ledger --------
  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: channel_code, type: string, source: input, description: "Human-readable channel identifier", constraints: "1-32 chars, unique across all Channels" }
      - { name: channel_kind, type: enum, source: input, description: "Distribution technology of this channel", constraints: "DIRECT | NDC_AGGREGATOR | GDS_LEGACY" }
      - { name: content_tier, type: enum, source: input, description: "Content access tier granted to this channel", default: STANDARD, constraints: "FULL | STANDARD | RESTRICTED" }
      - { name: content_tier_rank, type: integer, source: computed, description: "Numeric rank of content_tier: FULL=3, STANDARD=2, RESTRICTED=1" }
      - { name: content_markup_pct, type: number, source: input, description: "Per-line distribution markup applied to every offer line priced through this channel", default: 0, constraints: "0 <= value <= 0.25, at most 4 decimal places" }
      - { name: incentive_multiplier, type: number, source: input, description: "Channel multiplier applied to the marginal agency incentive amount", default: 1.0, constraints: "1.0 <= value <= 2.0, at most 2 decimal places" }
      - { name: monthly_platform_fee_cents, type: integer, source: input, description: "Fixed monthly platform fee for this channel, allocated by the CHANNEL_AVERAGE cost variant", default: 0, constraints: ">= 0" }
      - { name: per_message_cost_cents, type: integer, source: input, description: "Per distribution message cost consumed by the ACTIVITY_BASED cost variant", default: 0, constraints: ">= 0" }
      - { name: per_segment_fee_cents, type: integer, source: input, description: "Per booked segment fee consumed by the ACTIVITY_BASED cost variant", default: 0, constraints: ">= 0" }
      - { name: servicing_parity_change, type: boolean, source: input, description: "True when CHANGE service requests can be applied through this channel", default: true }
      - { name: servicing_parity_refund, type: boolean, source: input, description: "True when REFUND service requests can be applied through this channel", default: true }
      - { name: required_disclosure_codes, type: array, source: input, description: "Regulatory display/disclosure codes that must be acknowledged on publish and on order creation in this channel; array of strings, may be empty", default: [] }
      - { name: booking_count, type: integer, source: computed, description: "Count of Orders on this channel whose payment_status == PAID", default: 0 }
      - { name: activity_cost_cents, type: integer, source: computed, description: "Accumulated ACTIVITY_BASED distribution cost for this channel (messaging + segment fees + signed-agreement incentive accrual)", default: 0 }
      - { name: cost_per_booking_flat_cents, type: integer, source: computed, description: "CHANNEL_AVERAGE variant of distribution cost per booking", default: 0 }
      - { name: cost_per_booking_activity_cents, type: integer, source: computed, description: "ACTIVITY_BASED variant of distribution cost per booking", default: 0 }

  # --- 2. SurchargeRule : immutable per-channel surcharge structure ---------
  - name: SurchargeRule
    parent: Channel
    common_fields: false
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; the channel whose offers this surcharge rule prices" }
      - { name: surcharge_code, type: string, source: input, description: "Surcharge identifier stamped onto the generated SURCHARGE OfferItem", constraints: "1-32 chars" }
      - { name: item_scope, type: enum, source: input, description: "Which offer lines form this rule's scope base", constraints: "FARE | ANCILLARY | ALL" }
      - { name: rate_pct, type: number, source: input, description: "Rate applied to the scope base", constraints: "0 < value <= 0.5, at most 4 decimal places" }
      - { name: threshold_cents, type: integer, source: input, description: "Rule fires only when the scope base is >= this value (inclusive boundary)", default: 0, constraints: ">= 0" }
      - { name: min_cents, type: integer, source: input, description: "Lower clamp applied after the rate multiplication", default: 0, constraints: ">= 0" }
      - { name: max_cents, type: integer, source: input, description: "Upper clamp applied after the rate multiplication", constraints: ">= min_cents" }

  # --- 3. DistributionPartner : agency / tech provider / corporate account --
  - name: DistributionPartner
    parent: null
    common_fields: true
    fields:
      - { name: partner_name, type: string, source: input, description: "Legal name of the distribution partner", constraints: "1-120 chars" }
      - { name: partner_type, type: enum, source: input, description: "Which distribution relationship this partner holds", constraints: "TRAVEL_AGENCY | TECH_PROVIDER | CORPORATE" }
      - { name: iata_code, type: string, source: input, description: "IATA / account identifier of the partner", constraints: "1-16 chars" }
      - { name: home_country, type: string, source: input, description: "ISO 3166-1 alpha-2 country of the partner", constraints: "exactly 2 uppercase letters" }
      - { name: certification_status, type: enum, source: computed, description: "Derived from this partner's PartnerCertification rows", default: UNCERTIFIED, constraints: "UNCERTIFIED | IN_CERTIFICATION | CERTIFIED" }

  # --- 4. FareFiling : filed fare with sale/travel windows + revisions ------
  - name: FareFiling
    parent: null
    common_fields: true
    fields:
      - { name: fare_basis_code, type: string, source: input, description: "Filed fare basis code", constraints: "1-16 chars" }
      - { name: origin, type: string, source: input, description: "Origin station of the filed market", constraints: "exactly 3 uppercase letters" }
      - { name: destination, type: string, source: input, description: "Destination station of the filed market", constraints: "exactly 3 uppercase letters" }
      - { name: cabin, type: enum, source: input, description: "Cabin the fare is filed in", constraints: "ECONOMY | PREMIUM | BUSINESS" }
      - { name: base_amount_cents, type: integer, source: input, description: "Filed base fare amount in cents before channel markup and surcharges", constraints: "> 0" }
      - { name: sale_from, type: datetime, source: input, description: "Inclusive start of the sale window (ISO 8601 UTC, 3 fractional digits)" }
      - { name: sale_to, type: datetime, source: input, description: "Exclusive end of the sale window (ISO 8601 UTC, 3 fractional digits); sale window is half-open [sale_from, sale_to)", constraints: "sale_to > sale_from" }
      - { name: travel_from, type: datetime, source: input, description: "Inclusive earliest permitted departure date (ISO 8601 UTC)" }
      - { name: travel_to, type: datetime, source: input, description: "Inclusive latest permitted departure date (ISO 8601 UTC)", constraints: "travel_to >= travel_from" }
      - { name: min_content_tier_rank, type: integer, source: input, description: "Minimum Channel.content_tier_rank permitted to sell this filing", default: 1, constraints: "1 <= value <= 3" }
      - { name: refundable, type: boolean, source: input, description: "True when the FARE OfferItem generated from this filing enters the refundable base", default: true }
      - { name: is_private, type: boolean, source: input, description: "True when the filing is a negotiated private fare that may only be sold under a CorporateContract", default: false }
      - { name: base_filing_id, type: string, source: system, description: "FK -> FareFiling.id; the filing this row revises (null on original filings)", default: null }
      - { name: revision_number, type: integer, source: system, description: "0 on an original filing; base.revision_number + 1 on each revision", default: 0 }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the PricingAnalyst that created the filing" }
      - { name: status, type: enum, source: system, description: "Lifecycle state of the filing", default: DRAFT, constraints: "DRAFT | FILED | ACTIVE | SUSPENDED | SUPERSEDED | WITHDRAWN" }

  # --- 5. AncillaryProduct : sellable ancillary -----------------------------
  - name: AncillaryProduct
    parent: null
    common_fields: true
    fields:
      - { name: ancillary_code, type: string, source: input, description: "Ancillary identifier referenced by offers and bundles", constraints: "1-16 chars, unique across all AncillaryProducts" }
      - { name: name, type: string, source: input, description: "Display name of the ancillary", constraints: "1-80 chars" }
      - { name: list_amount_cents, type: integer, source: input, description: "Undiscounted list price in cents", constraints: "> 0" }
      - { name: min_content_tier_rank, type: integer, source: input, description: "Minimum Channel.content_tier_rank permitted to sell this ancillary", default: 1, constraints: "1 <= value <= 3" }
      - { name: refundable, type: boolean, source: input, description: "True when the generated ANCILLARY / BUNDLE_ANCILLARY OfferItem enters the refundable base", default: false }

  # --- 6. BundleDefinition : ancillary bundle with discount -----------------
  - name: BundleDefinition
    parent: null
    common_fields: true
    fields:
      - { name: bundle_code, type: string, source: input, description: "Bundle identifier", constraints: "1-16 chars, unique across all BundleDefinitions" }
      - { name: ancillary_codes, type: array, source: input, description: "AncillaryProduct.ancillary_code values contained in this bundle; array of strings", constraints: "1-6 entries, every entry must resolve to an existing AncillaryProduct" }
      - { name: bundle_discount_pct, type: number, source: input, description: "Discount applied to each bundled ancillary's list_amount_cents before the channel markup", constraints: "0 <= value <= 0.5, at most 4 decimal places" }
      - { name: min_content_tier_rank, type: integer, source: input, description: "Minimum Channel.content_tier_rank permitted to sell this bundle", default: 1, constraints: "1 <= value <= 3" }

  # --- 7. AgencyAgreement : incentive agreement, cyclic negotiation ---------
  - name: AgencyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: input, description: "FK -> DistributionPartner.id; the contracting travel agency" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the channel this agreement governs" }
      - { name: proposed_incentive_pct, type: number, source: input, description: "Incentive percentage currently on the table for the open negotiation round", constraints: "0 < value <= 0.15, at most 4 decimal places" }
      - { name: agreed_incentive_pct, type: number, source: computed, description: "proposed_incentive_pct frozen at the moment of ACCEPT; null until the agreement is SIGNED", default: null }
      - { name: incentive_cap_cents, type: integer, source: input, description: "Hard cap on incentive_accrued_cents for this agreement", constraints: "> 0" }
      - { name: target_net_revenue_cents, type: integer, source: input, description: "Net revenue target recorded on the agreement for reporting", constraints: "> 0" }
      - { name: cumulative_net_revenue_cents, type: integer, source: computed, description: "Sum of Order.net_revenue_cents over this agreement's Orders with payment_status == PAID", default: 0 }
      - { name: incentive_accrued_cents, type: integer, source: computed, description: "Output of the agency_incentive_accrual calculation", default: 0 }
      - { name: incentive_tier, type: enum, source: computed, description: "Highest marginal tier reached by cumulative_net_revenue_cents", default: TIER_1, constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: tier_downgrade_count, type: integer, source: computed, description: "Incremented every time a recomputation moves incentive_tier to a strictly lower tier", default: 0 }
      - { name: negotiation_round, type: integer, source: computed, description: "Number of COUNTER actions recorded on this agreement", default: 0 }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the DistributionManager that last performed PROPOSE (creation counts as the first PROPOSE)" }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID of the DistributionManager that performed ACCEPT; null until SIGNED", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle state of the agreement", default: PROPOSED, constraints: "PROPOSED | COUNTERED | SIGNED | SUSPENDED | WITHDRAWN | SUPERSEDED" }

  # --- 8. CorporateContract : negotiated fares + traceability ---------------
  - name: CorporateContract
    parent: null
    common_fields: true
    fields:
      - { name: corporate_partner_id, type: string, source: input, description: "FK -> DistributionPartner.id; the corporate account holder (partner_type must be CORPORATE)" }
      - { name: negotiated_fare_filing_id, type: string, source: input, description: "FK -> FareFiling.id; the private negotiated filing this contract unlocks" }
      - { name: account_code, type: string, source: input, description: "Corporate account code printed on offers and orders", constraints: "1-24 chars" }
      - { name: max_offer_total_cents, type: integer, source: input, description: "Fiscal cap: an offer priced under this contract may not exceed this total", constraints: "> 0" }
      - { name: traceability_required, type: boolean, source: input, description: "True when every Order under this contract must carry corporate_tracking_ref", default: true }
      - { name: tracking_ref_prefix, type: string, source: input, description: "Required literal prefix of Order.corporate_tracking_ref under this contract", default: "CORP-", constraints: "1-12 chars" }
      - { name: min_content_tier_rank, type: integer, source: input, description: "Minimum Channel.content_tier_rank permitted to distribute this contract's content", default: 2, constraints: "1 <= value <= 3" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of contract validity (ISO 8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of contract validity (ISO 8601 UTC); validity window is half-open [effective_from, effective_to)", constraints: "effective_to > effective_from" }
      - { name: validity_state, type: enum, source: computed, description: "Derived by comparing the logical clock to [effective_from, effective_to): PENDING when clock < effective_from, IN_EFFECT when effective_from <= clock < effective_to, LAPSED when clock >= effective_to", constraints: "PENDING | IN_EFFECT | LAPSED" }

  # --- 9. Offer : channel-specific constructed offer ------------------------
  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel the offer is constructed for" }
      - { name: partner_id, type: string, source: input, description: "FK -> DistributionPartner.id; requesting distribution partner" }
      - { name: fare_filing_id, type: string, source: input, description: "FK -> FareFiling.id; filing that produces the FARE line" }
      - { name: bundle_id, type: string, source: input, description: "FK -> BundleDefinition.id; bundle whose ancillaries produce BUNDLE_ANCILLARY lines (null when no bundle is attached)", default: null }
      - { name: corporate_contract_id, type: string, source: input, description: "FK -> CorporateContract.id; contract the offer is priced under (null for public content)", default: null }
      - { name: ancillary_codes, type: array, source: input, description: "AncillaryProduct.ancillary_code values sold a la carte (outside any bundle); array of strings, may be empty", default: [] }
      - { name: trip_origin, type: string, source: input, description: "Requested origin station", constraints: "exactly 3 uppercase letters" }
      - { name: trip_destination, type: string, source: input, description: "Requested destination station", constraints: "exactly 3 uppercase letters" }
      - { name: departure_date, type: datetime, source: input, description: "Requested departure instant (ISO 8601 UTC)" }
      - { name: cabin, type: enum, source: input, description: "Requested cabin", constraints: "ECONOMY | PREMIUM | BUSINESS" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of net_amount_cents over this offer's FARE, ANCILLARY and BUNDLE_ANCILLARY items", default: 0 }
      - { name: surcharge_cents, type: integer, source: computed, description: "Sum of net_amount_cents over this offer's SURCHARGE items", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + surcharge_cents", default: 0 }
      - { name: item_count, type: integer, source: computed, description: "Count of OfferItem rows belonging to this offer", default: 0 }
      - { name: acknowledged_disclosure_codes, type: array, source: computed, description: "Disclosure codes acknowledged on the publish call; array of strings", default: [] }
      - { name: disclosure_complete, type: boolean, source: computed, description: "True when acknowledged_disclosure_codes covers Channel.required_disclosure_codes", default: false }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + OFFER_TTL_MINUTES; an offer is EXPIRED once the logical clock reaches this instant" }
      - { name: priced_channel_version, type: integer, source: system, description: "Channel.version observed while pricing this offer, recorded for content traceability" }
      - { name: status, type: enum, source: system, description: "Lifecycle state of the offer", default: CONSTRUCTED, constraints: "CONSTRUCTED | PUBLISHED | ORDERED | WITHDRAWN | EXPIRED" }

  # --- 10. OfferItem : immutable priced offer line --------------------------
  - name: OfferItem
    parent: Offer
    common_fields: false
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; owning offer" }
      - { name: item_type, type: enum, source: system, description: "Kind of line", constraints: "FARE | ANCILLARY | BUNDLE_ANCILLARY | SURCHARGE" }
      - { name: item_code, type: string, source: system, description: "fare_basis_code, ancillary_code or surcharge_code depending on item_type" }
      - { name: sequence, type: integer, source: system, description: "1-based line order: the FARE line first, then BUNDLE_ANCILLARY lines by item_code ASC, then ANCILLARY lines by item_code ASC, then SURCHARGE lines by (threshold_cents ASC, SurchargeRule.created_at ASC)" }
      - { name: list_amount_cents, type: integer, source: computed, description: "Undiscounted catalogue amount for this line" }
      - { name: net_amount_cents, type: integer, source: computed, description: "Amount after bundle discount and channel markup, rounded to whole cents at line level" }
      - { name: refundable, type: boolean, source: computed, description: "Copied from the source FareFiling.refundable / AncillaryProduct.refundable; always false for SURCHARGE lines" }

  # --- 11. Order : parallel payment × fulfillment dimensions ---------------
  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: input, description: "FK -> Offer.id; the published offer being ordered" }
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; copied from the offer" }
      - { name: partner_id, type: string, source: system, description: "FK -> DistributionPartner.id; copied from the offer" }
      - { name: agency_agreement_id, type: string, source: system, description: "FK -> AgencyAgreement.id; the SIGNED agreement for (partner_id, channel_id) at order creation (null when the ordering partner is not a TRAVEL_AGENCY)", default: null }
      - { name: corporate_tracking_ref, type: string, source: input, description: "Traceability reference required when the offer's contract has traceability_required == true", default: null }
      - { name: disclosure_ack_codes, type: array, source: input, description: "Disclosure codes acknowledged at booking time; array of strings", default: [] }
      - { name: message_count, type: integer, source: input, description: "Distribution messages exchanged to create this order (ACTIVITY_BASED cost input)", default: 1, constraints: ">= 1" }
      - { name: segment_count, type: integer, source: input, description: "Booked segments on this order (ACTIVITY_BASED cost input)", default: 1, constraints: ">= 1" }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Amount captured on this order; equals the offer's total_cents once payment_status == PAID", default: 0 }
      - { name: refunded_amount_cents, type: integer, source: computed, description: "Amount refunded by applied REFUND service requests", default: 0 }
      - { name: net_revenue_cents, type: integer, source: computed, description: "Offer.total_cents frozen at order creation; the quantity the agreement revenue ledger accumulates", default: 0 }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension", default: AUTHORIZED, constraints: "AUTHORIZED | PAID | VOIDED | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment dimension, independent of payment_status", default: RESERVED, constraints: "RESERVED | TICKETED | CHANGED | FLOWN | CANCELLED" }

  # --- 12. ServiceRequest : branching servicing workflow -------------------
  - name: ServiceRequest
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the order being serviced" }
      - { name: request_type, type: enum, source: input, description: "Servicing capability requested", constraints: "CHANGE | REFUND | VOID" }
      - { name: requested_change_note, type: string, source: input, description: "Free-text description of the requested change", default: null, constraints: "0-240 chars" }
      - { name: refundable_base_cents, type: integer, source: computed, description: "Step 1 of refund_settlement: sum of net_amount_cents over the order's refundable OfferItems", default: 0 }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Step 2 of refund_settlement: fee tier selected from refundable_base_cents", default: 0 }
      - { name: refund_total_cents, type: integer, source: computed, description: "Step 3 of refund_settlement: max(refundable_base_cents - cancellation_fee_cents, 0)", default: 0 }
      - { name: incentive_clawback_cents, type: integer, source: computed, description: "Step 4 of refund_settlement: audit-only clawback figure derived from refund_total_cents and the agreement's incentive_tier rate", default: 0 }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID that submitted the request" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the DistributionManager that reviewed the request", default: null }
      - { name: status, type: enum, source: system, description: "Branching servicing lifecycle", default: SUBMITTED, constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | APPLIED" }

  # --- 13. PartnerCertification : tech partner certification --------------
  - name: PartnerCertification
    parent: null
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: input, description: "FK -> DistributionPartner.id; the partner under connectivity certification (partner_type must be TECH_PROVIDER or TRAVEL_AGENCY; a CORPORATE partner is rejected)" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the channel the partner is certifying against" }
      - { name: env_code, type: enum, source: input, description: "Shared certification environment the connectivity tests occupy", constraints: "CERT_ENV_A | CERT_ENV_B" }
      - { name: reserved_test_minutes, type: integer, source: computed, description: "Sum of duration_minutes over this certification's ConnectivityTests with status == SCHEDULED", default: 0 }
      - { name: readiness_score_strict, type: integer, source: computed, description: "STRICT variant of certification_readiness_score (0-100)", default: 0 }
      - { name: readiness_score_provisional, type: integer, source: computed, description: "PROVISIONAL variant of certification_readiness_score (0-100)", default: 0 }
      - { name: mandatory_failed_count, type: integer, source: computed, description: "Count of this certification's ConnectivityTests with is_mandatory == true and status == FAILED", default: 0 }
      - { name: certified_variant, type: enum, source: computed, description: "Readiness variant that was used by the CERTIFY decision; null until CERTIFIED", default: null, constraints: "STRICT | PROVISIONAL" }
      - { name: tested_by_user_id, type: string, source: system, description: "X-User-ID of the TechnologyPartner that scheduled the connectivity tests" }
      - { name: status, type: enum, source: system, description: "Certification lifecycle", default: TESTING, constraints: "TESTING | CERTIFIED | SUSPENDED | REVOKED" }

  # --- 14. ConnectivityTest : interval occupation on a shared env ---------
  - name: ConnectivityTest
    parent: PartnerCertification
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: system, description: "FK -> PartnerCertification.id; owning certification" }
      - { name: test_code, type: string, source: input, description: "Connectivity test case identifier", constraints: "1-32 chars" }
      - { name: is_mandatory, type: boolean, source: input, description: "True when the test carries weight MANDATORY_TEST_WEIGHT and gates STRICT readiness", default: false }
      - { name: scheduled_start, type: datetime, source: input, description: "Inclusive start of the environment slot (ISO 8601 UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Length of the environment slot in minutes", constraints: "1 <= value <= 240" }
      - { name: scheduled_end, type: datetime, source: computed, description: "scheduled_start + duration_minutes; slot occupation is the closed interval [scheduled_start, scheduled_end]" }
      - { name: score, type: integer, source: computed, description: "Score reported on the outcome call; null while SCHEDULED and on CANCELLED tests", default: null, constraints: "0 <= value <= 100" }
      - { name: status, type: enum, source: system, description: "Test lifecycle", default: SCHEDULED, constraints: "SCHEDULED | PASSED | FAILED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- FareFiling : linear pipeline with a SUSPENDED revert + supersede -----
  - entity: FareFiling
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /fare-filings/{id}/state with to_state=FILED"
        actor: PricingAnalyst
        preconditions:
          - "sale_to > sale_from and travel_to >= travel_from (ERR_INVALID_REQUEST)"
        side_effects:
          - "refreshes FareFiling.updated_at and increments FareFiling.version by 1"

      - from: FILED
        to: ACTIVE
        trigger: "POST /fare-filings/{id}/state with to_state=ACTIVE"
        actor: PricingAnalyst
        preconditions:
          - "no other FareFiling with status == ACTIVE sharing (origin, destination, cabin, fare_basis_code) has a sale window that strictly overlaps this filing's half-open window [sale_from, sale_to) (ERR_FARE_SALE_WINDOW_OVERLAP)"
        side_effects:
          - "the filing becomes sellable: offer construction referencing it stops failing with ERR_FARE_FILING_NOT_ACTIVE"
          - "increments FareFiling.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fare-filings/{id}/state with to_state=SUSPENDED"
        actor: PricingAnalyst | DistributionManager
        preconditions: []
        side_effects:
          - "cascade hop 1: every Offer with fare_filing_id == this filing and status IN {CONSTRUCTED, PUBLISHED} is set to WITHDRAWN"
          - "increments FareFiling.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fare-filings/{id}/state with to_state=ACTIVE"
        actor: PricingAnalyst
        preconditions:
          - "no other FareFiling with status == ACTIVE sharing (origin, destination, cabin, fare_basis_code) strictly overlaps [sale_from, sale_to) (ERR_FARE_SALE_WINDOW_OVERLAP)"
        side_effects:
          - "increments FareFiling.version by 1; Offers withdrawn during suspension are NOT resurrected"
        note: "This revert edge makes the machine non-linear on the sellability axis but is not counted as a Rule 3 instance."

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /fare-filings/{id}/state with to_state=WITHDRAWN"
        actor: PricingAnalyst
        preconditions: []
        side_effects:
          - "every Offer with fare_filing_id == this filing and status IN {CONSTRUCTED, PUBLISHED} is set to WITHDRAWN"
          - "increments FareFiling.version by 1"

      - from: FILED
        to: WITHDRAWN
        trigger: "POST /fare-filings/{id}/state with to_state=WITHDRAWN"
        actor: PricingAnalyst
        preconditions: []
        side_effects:
          - "increments FareFiling.version by 1"

      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /fare-filings/{id}/state with to_state=WITHDRAWN"
        actor: PricingAnalyst
        preconditions: []
        side_effects:
          - "increments FareFiling.version by 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /fare-filings/{id}/revisions"
        actor: PricingAnalyst
        preconditions:
          - "expected_fare_filing_version equals this filing's current version (ERR_STALE_FARE_FILING_VERSION)"
        side_effects:
          - "creates a new FareFiling in status DRAFT copying fare_basis_code / origin / destination / cabin / travel window / min_content_tier_rank / refundable / is_private, with base_filing_id == this filing's id and revision_number == this filing's revision_number + 1"
          - "every Offer with fare_filing_id == this filing and status IN {CONSTRUCTED, PUBLISHED} is set to WITHDRAWN"
          - "increments FareFiling.version by 1"

      - from: FILED
        to: SUPERSEDED
        trigger: "POST /fare-filings/{id}/revisions"
        actor: PricingAnalyst
        preconditions:
          - "expected_fare_filing_version equals this filing's current version (ERR_STALE_FARE_FILING_VERSION)"
        side_effects:
          - "creates the revision FareFiling in status DRAFT as above"
          - "increments FareFiling.version by 1"

  # --- AgencyAgreement : CYCLIC negotiation + suspend/reinstate cycle -------
  - entity: AgencyAgreement
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, SUPERSEDED]
    transitions:
      - from: null
        to: PROPOSED
        trigger: "POST /agency-agreements"
        actor: DistributionManager
        preconditions:
          - "DistributionPartner.partner_type == TRAVEL_AGENCY (ERR_PARTNER_TYPE_NOT_ELIGIBLE)"
          - "expected_partner_version equals DistributionPartner.version (ERR_STALE_PARTNER_VERSION)"
        side_effects:
          - "any existing AgencyAgreement with the same (partner_id, channel_id) and status IN {PROPOSED, COUNTERED, SIGNED} is set to SUPERSEDED"
          - "sets proposed_by_user_id to the acting X-User-ID, negotiation_round to 0, cumulative_net_revenue_cents to 0, incentive_accrued_cents to 0, incentive_tier to TIER_1"
          - "increments DistributionPartner.version by 1"

      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /agency-agreements/{id}/negotiation-rounds with action=COUNTER"
        actor: Agency
        preconditions:
          - "the acting X-User-ID equals AgencyAgreement.partner_id (ERR_UNAUTHORIZED)"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (ERR_NEGOTIATION_ROUND_LIMIT)"
        side_effects:
          - "negotiation_round increments by 1 and proposed_incentive_pct is replaced by the countered value"
          - "increments AgencyAgreement.version by 1"

      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /agency-agreements/{id}/negotiation-rounds with action=PROPOSE"
        actor: DistributionManager
        preconditions:
          - "negotiation_round <= MAX_NEGOTIATION_ROUNDS (ERR_NEGOTIATION_ROUND_LIMIT)"
        side_effects:
          - "proposed_incentive_pct is replaced by the airline's new value and proposed_by_user_id is set to the acting X-User-ID"
          - "increments AgencyAgreement.version by 1"
        note: "COUNTERED -> PROPOSED closes the negotiation cycle: the pair can be traversed repeatedly until MAX_NEGOTIATION_ROUNDS."

      - from: PROPOSED
        to: SIGNED
        trigger: "POST /agency-agreements/{id}/negotiation-rounds with action=ACCEPT"
        actor: DistributionManager
        preconditions:
          - "the acting X-User-ID differs from proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "agreed_incentive_pct is frozen to the current proposed_incentive_pct and signed_by_user_id is set to the acting X-User-ID"
          - "increments AgencyAgreement.version by 1"

      - from: SIGNED
        to: SUSPENDED
        trigger: "system cascade from POST /partner-certifications/{id}/decision with decision IN {REVOKE, SUSPEND}"
        actor: system
        preconditions:
          - "the agreement's partner_id equals the certification's partner_id and the agreement's channel_id equals the certification's channel_id"
        side_effects:
          - "cascade hop 4: every Offer with (partner_id, channel_id) matching this agreement and status IN {CONSTRUCTED, PUBLISHED} is set to WITHDRAWN"
          - "increments AgencyAgreement.version by 1"

      - from: SUSPENDED
        to: SIGNED
        trigger: "system cascade from POST /partner-certifications/{id}/decision with decision IN {REINSTATE, CERTIFY}"
        actor: system
        preconditions:
          - "the agreement's partner_id equals the certification's partner_id and the agreement's channel_id equals the certification's channel_id"
        side_effects:
          - "agreed_incentive_pct, cumulative_net_revenue_cents and incentive_accrued_cents are left untouched by the reinstatement"
          - "increments AgencyAgreement.version by 1"
        note: "SIGNED -> SUSPENDED -> SIGNED is the second cycle on this entity."

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /agency-agreements/{id}/negotiation-rounds with action=WITHDRAW"
        actor: DistributionManager
        preconditions: []
        side_effects:
          - "increments AgencyAgreement.version by 1"

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /agency-agreements/{id}/negotiation-rounds with action=WITHDRAW"
        actor: DistributionManager
        preconditions: []
        side_effects:
          - "increments AgencyAgreement.version by 1"

  # --- Offer : construction, publish, order, lazy expiry, cascade withdraw -
  - entity: Offer
    initial_state: CONSTRUCTED
    terminal_states: [ORDERED, WITHDRAWN, EXPIRED]
    transitions:
      - from: null
        to: CONSTRUCTED
        trigger: "POST /offers"
        actor: Agency | DistributionManager
        preconditions:
          - "FareFiling.status == ACTIVE (ERR_FARE_FILING_NOT_ACTIVE)"
          - "the logical clock is inside the filing's half-open sale window [sale_from, sale_to) (ERR_FARE_SALE_WINDOW_CLOSED)"
          - "departure_date is inside the filing's closed travel window [travel_from, travel_to] (ERR_TRAVEL_DATE_OUT_OF_WINDOW)"
          - "Channel.content_tier_rank >= every referenced component's min_content_tier_rank (filing, each a la carte ancillary, the bundle, the corporate contract) (ERR_CONTENT_TIER_INSUFFICIENT)"
          - "if FareFiling.is_private then corporate_contract_id is present and that contract's negotiated_fare_filing_id equals fare_filing_id (ERR_PRIVATE_FARE_REQUIRES_CONTRACT)"
          - "if corporate_contract_id is present then that contract's validity_state == IN_EFFECT (ERR_CONTRACT_NOT_IN_EFFECT)"
          - "if corporate_contract_id is present then the computed total_cents <= CorporateContract.max_offer_total_cents (ERR_CONTRACT_CAP_EXCEEDED)"
        side_effects:
          - "generates the FARE OfferItem, one BUNDLE_ANCILLARY OfferItem per bundle member, one ANCILLARY OfferItem per a la carte ancillary_code, and one SURCHARGE OfferItem per firing SurchargeRule, all priced by offer_line_pricing then surcharge_amount"
          - "sets subtotal_cents, surcharge_cents, total_cents, item_count, expires_at = created_at + OFFER_TTL_MINUTES and priced_channel_version = Channel.version"

      - from: CONSTRUCTED
        to: PUBLISHED
        trigger: "POST /offers/{id}/publish"
        actor: Agency | DistributionManager
        preconditions:
          - "the logical clock is strictly before expires_at (ERR_OFFER_EXPIRED)"
          - "FareFiling.status is still ACTIVE (ERR_FARE_FILING_NOT_ACTIVE)"
          - "disclosure_ack_codes covers every entry of Channel.required_disclosure_codes (ERR_DISCLOSURE_INCOMPLETE)"
        side_effects:
          - "acknowledged_disclosure_codes is set to the submitted codes and disclosure_complete becomes true"
          - "increments Offer.version by 1"

      - from: PUBLISHED
        to: ORDERED
        trigger: "POST /orders"
        actor: Agency | DistributionManager
        preconditions:
          - "the logical clock is strictly before expires_at (ERR_OFFER_EXPIRED)"
        side_effects:
          - "creates the Order with payment_status AUTHORIZED and fulfillment_status RESERVED"
          - "increments Offer.version by 1"

      - from: CONSTRUCTED
        to: EXPIRED
        trigger: "system, lazily evaluated at the start of any operation targeting the offer (GET /offers/{id}, POST /offers/{id}/publish, POST /orders)"
        actor: system
        preconditions:
          - "the logical clock is >= expires_at"
        side_effects:
          - "status becomes EXPIRED before the targeting operation is evaluated, so publish and order attempts fail with ERR_OFFER_EXPIRED"
          - "increments Offer.version by 1"

      - from: PUBLISHED
        to: EXPIRED
        trigger: "system, lazily evaluated at the start of any operation targeting the offer"
        actor: system
        preconditions:
          - "the logical clock is >= expires_at"
        side_effects:
          - "status becomes EXPIRED; ordering the offer afterwards fails with ERR_OFFER_EXPIRED"
          - "increments Offer.version by 1"

      - from: CONSTRUCTED
        to: WITHDRAWN
        trigger: "system cascade from FareFiling SUSPENDED / WITHDRAWN / SUPERSEDED, or from AgencyAgreement SIGNED -> SUSPENDED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Offer.version by 1; the offer's OfferItem rows are immutable and are retained for audit"

      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "system cascade from FareFiling SUSPENDED / WITHDRAWN / SUPERSEDED, or from AgencyAgreement SIGNED -> SUSPENDED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Offer.version by 1; already created Orders are untouched"

  # --- Order : PARALLEL payment_status × fulfillment_status dimensions -----
  - entity: Order
    initial_state: "payment_status=AUTHORIZED × fulfillment_status=RESERVED"
    terminal_states: ["payment_status IN {VOIDED, REFUNDED}", "fulfillment_status IN {FLOWN, CANCELLED}"]
    transitions:
      - from: null
        to: "payment_status=AUTHORIZED × fulfillment_status=RESERVED"
        trigger: "POST /orders"
        actor: Agency | DistributionManager
        preconditions:
          - "Offer.status == PUBLISHED (ERR_OFFER_NOT_PUBLISHED)"
          - "disclosure_ack_codes covers every entry of Channel.required_disclosure_codes (ERR_DISCLOSURE_INCOMPLETE)"
          - "if the offer carries a corporate_contract_id whose traceability_required is true, corporate_tracking_ref is present (ERR_CORPORATE_TRACKING_REF_MISSING) and starts with that contract's tracking_ref_prefix (ERR_CORPORATE_TRACKING_REF_INVALID)"
          - "if the ordering DistributionPartner.partner_type == TRAVEL_AGENCY, an AgencyAgreement with status == SIGNED exists for (partner_id, channel_id) (ERR_AGREEMENT_NOT_SIGNED)"
        side_effects:
          - "net_revenue_cents is frozen to Offer.total_cents; agency_agreement_id is set to the SIGNED agreement's id (null for non-agency partners)"
          - "the source Offer transitions PUBLISHED -> ORDERED"

      - from: "payment_status=AUTHORIZED"
        to: "payment_status=PAID"
        trigger: "POST /orders/{id}/payment with action=CAPTURE"
        actor: Agency | DistributionManager
        preconditions:
          - "payment_amount_cents equals the source Offer.total_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_amount_cents becomes payment_amount_cents"
          - "Channel.booking_count increments by 1"
          - "if agency_agreement_id is set: AgencyAgreement.cumulative_net_revenue_cents increases by net_revenue_cents, then agency_incentive_accrual re-runs and rewrites incentive_accrued_cents and incentive_tier (upgrade only raises incentive_tier; tier_downgrade_count is untouched)"
          - "distribution_cost_per_booking re-runs for the channel, rewriting activity_cost_cents, cost_per_booking_flat_cents and cost_per_booking_activity_cents"
          - "increments Order.version by 1"

      - from: "payment_status=AUTHORIZED"
        to: "payment_status=VOIDED"
        trigger: "POST /orders/{id}/payment with action=VOID"
        actor: Agency | DistributionManager
        preconditions: []
        side_effects:
          - "fulfillment_status is forced to CANCELLED; Channel.booking_count is untouched because the order never reached PAID"
          - "increments Order.version by 1"

      - from: "payment_status=PAID"
        to: "payment_status=REFUNDED"
        trigger: "system cascade from POST /service-requests/{id}/apply on a REFUND request"
        actor: system
        preconditions:
          - "the applying ServiceRequest.status == APPROVED and request_type == REFUND"
        side_effects:
          - "cascade hop 1: refunded_amount_cents becomes ServiceRequest.refund_total_cents and fulfillment_status is forced to CANCELLED"
          - "cascade hop 2: Channel.booking_count decrements by 1 and AgencyAgreement.cumulative_net_revenue_cents decreases by net_revenue_cents"
          - "increments Order.version by 1"

      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=TICKETED"
        trigger: "POST /orders/{id}/fulfillment with action=TICKET"
        actor: Agency | DistributionManager
        preconditions:
          - "payment_status == PAID (ERR_ORDER_NOT_PAID)"
        side_effects:
          - "increments Order.version by 1; payment_status is untouched"

      - from: "fulfillment_status=TICKETED"
        to: "fulfillment_status=FLOWN"
        trigger: "POST /orders/{id}/fulfillment with action=FLY"
        actor: DistributionManager
        preconditions: []
        side_effects:
          - "increments Order.version by 1"

      - from: "fulfillment_status=TICKETED"
        to: "fulfillment_status=CHANGED"
        trigger: "system cascade from POST /service-requests/{id}/apply on a CHANGE request"
        actor: system
        preconditions:
          - "Channel.servicing_parity_change == true (ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL)"
        side_effects:
          - "message_count increments by 1, then distribution_cost_per_booking re-runs for the channel"
          - "payment_status is untouched — the dimensions advance independently"
          - "increments Order.version by 1"

      - from: "fulfillment_status IN {RESERVED, TICKETED}"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/fulfillment with action=CANCEL"
        actor: Agency | DistributionManager
        preconditions: []
        side_effects:
          - "payment_status is untouched: a cancelled-but-PAID order keeps its revenue until a REFUND service request is applied"
          - "increments Order.version by 1"

  # --- ServiceRequest : BRANCHING fork-join, divergent apply side effects --
  - entity: ServiceRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, APPLIED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /orders/{id}/service-requests"
        actor: Agency | DistributionManager
        preconditions:
          - "if request_type == REFUND then Order.payment_status == PAID (ERR_ORDER_NOT_PAID)"
          - "if request_type == VOID then Order.payment_status == AUTHORIZED (ERR_ORDER_NOT_PAID)"
          - "if request_type == CHANGE then Order.fulfillment_status == TICKETED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "submitted_by_user_id is set to the acting X-User-ID"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /service-requests/{id}/review with action=START_REVIEW"
        actor: DistributionManager
        preconditions: []
        side_effects:
          - "reviewed_by_user_id is set to the acting X-User-ID; increments ServiceRequest.version by 1"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /service-requests/{id}/review with action=APPROVE"
        actor: DistributionManager
        preconditions: []
        side_effects:
          - "if request_type == REFUND: refund_settlement runs steps 1-4 and writes refundable_base_cents, cancellation_fee_cents, refund_total_cents and incentive_clawback_cents; the Order is NOT mutated yet"
          - "if request_type IN {CHANGE, VOID}: the four settlement fields stay 0"
          - "increments ServiceRequest.version by 1"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /service-requests/{id}/review with action=REJECT"
        actor: DistributionManager
        preconditions: []
        side_effects:
          - "no Order field changes; increments ServiceRequest.version by 1"

      - from: APPROVED
        to: APPLIED
        trigger: "POST /service-requests/{id}/apply"
        actor: DistributionManager
        preconditions:
          - "if request_type == REFUND then Channel.servicing_parity_refund == true (ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL)"
          - "if request_type == CHANGE then Channel.servicing_parity_change == true (ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL)"
          - "if request_type == REFUND then Order.payment_status is still PAID (ERR_ORDER_NOT_PAID)"
        side_effects:
          - "REFUND branch — cascade hop 1: Order.payment_status becomes REFUNDED, refunded_amount_cents becomes refund_total_cents, fulfillment_status becomes CANCELLED"
          - "REFUND branch — cascade hop 2 (caused by the order leaving the PAID revenue base): Channel.booking_count decrements by 1 and AgencyAgreement.cumulative_net_revenue_cents decreases by Order.net_revenue_cents"
          - "REFUND branch — cascade hop 3 (caused by the revenue decrement): agency_incentive_accrual re-runs on the new cumulative_net_revenue_cents, rewriting incentive_accrued_cents and incentive_tier; when the recomputed tier is strictly lower than the stored tier, tier_downgrade_count increments by 1"
          - "REFUND branch — cascade hop 4 (caused by the incentive accrual change): distribution_cost_per_booking re-runs for the channel, rewriting activity_cost_cents, cost_per_booking_flat_cents and cost_per_booking_activity_cents"
          - "CHANGE branch: Order.fulfillment_status becomes CHANGED and Order.message_count increments by 1, then distribution_cost_per_booking re-runs for the channel; the agreement ledger is untouched"
          - "VOID branch: Order.payment_status becomes VOIDED and fulfillment_status becomes CANCELLED; no ledger or cost recomputation happens because the order never reached PAID"
          - "increments ServiceRequest.version by 1"

  # --- PartnerCertification : certify / suspend / reinstate cycle + revoke -
  - entity: PartnerCertification
    initial_state: TESTING
    terminal_states: [REVOKED]
    transitions:
      - from: null
        to: TESTING
        trigger: "POST /partner-certifications"
        actor: TechnologyPartner | PlatformAdmin
        preconditions:
          - "DistributionPartner.partner_type IN {TECH_PROVIDER, TRAVEL_AGENCY} (ERR_PARTNER_TYPE_NOT_ELIGIBLE)"
          - "no other PartnerCertification for the same (partner_id, channel_id) has status IN {TESTING, CERTIFIED, SUSPENDED} (ERR_CERTIFICATION_ALREADY_OPEN)"
        side_effects:
          - "tested_by_user_id is set to the acting X-User-ID"
          - "DistributionPartner.certification_status becomes IN_CERTIFICATION and DistributionPartner.version increments by 1"

      - from: TESTING
        to: CERTIFIED
        trigger: "POST /partner-certifications/{id}/decision with decision=CERTIFY"
        actor: PlatformAdmin
        preconditions:
          - "no ConnectivityTest of this certification has status == SCHEDULED (ERR_INVALID_STATE_TRANSITION)"
          - "the readiness score of the variant named by readiness_variant is >= CERT_MIN_READINESS (ERR_READINESS_BELOW_MINIMUM)"
        side_effects:
          - "certified_variant is set to readiness_variant"
          - "DistributionPartner.certification_status becomes CERTIFIED and DistributionPartner.version increments by 1"
          - "every AgencyAgreement of this (partner_id, channel_id) with status == SUSPENDED returns to SIGNED"

      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /partner-certifications/{id}/decision with decision=SUSPEND"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "DistributionPartner.certification_status becomes IN_CERTIFICATION and DistributionPartner.version increments by 1"
          - "every AgencyAgreement of this (partner_id, channel_id) with status == SIGNED becomes SUSPENDED, and each such agreement's Offers in {CONSTRUCTED, PUBLISHED} become WITHDRAWN"

      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /partner-certifications/{id}/decision with decision=REINSTATE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "DistributionPartner.certification_status becomes CERTIFIED and DistributionPartner.version increments by 1"
          - "every AgencyAgreement of this (partner_id, channel_id) with status == SUSPENDED returns to SIGNED"
        note: "CERTIFIED -> SUSPENDED -> CERTIFIED is a cycle, but Rule 3's two counted instances are AgencyAgreement (cyclic) and Order (parallel dimensions)."

      - from: TESTING
        to: REVOKED
        trigger: "POST /partner-certifications/{id}/decision with decision=REVOKE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "every ConnectivityTest of this certification with status == SCHEDULED becomes CANCELLED and reserved_test_minutes becomes 0"
          - "DistributionPartner.certification_status becomes UNCERTIFIED and DistributionPartner.version increments by 1"

      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /partner-certifications/{id}/decision with decision=REVOKE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "cascade hop 1: this certification's status becomes REVOKED and its SCHEDULED ConnectivityTests become CANCELLED (reserved_test_minutes becomes 0)"
          - "cascade hop 2 (caused by hop 1): DistributionPartner.certification_status becomes UNCERTIFIED and DistributionPartner.version increments by 1"
          - "cascade hop 3 (caused by hop 2 — an uncertified partner loses content access): every AgencyAgreement of this (partner_id, channel_id) with status == SIGNED becomes SUSPENDED"
          - "cascade hop 4 (caused by hop 3): every Offer of that agreement's (partner_id, channel_id) with status IN {CONSTRUCTED, PUBLISHED} becomes WITHDRAWN"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /partner-certifications/{id}/decision with decision=REVOKE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "DistributionPartner.certification_status becomes UNCERTIFIED and DistributionPartner.version increments by 1; agreements already SUSPENDED stay SUSPENDED"

  # --- ConnectivityTest : slot occupation on a shared environment ----------
  - entity: ConnectivityTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /partner-certifications/{id}/connectivity-tests"
        actor: TechnologyPartner
        preconditions:
          - "PartnerCertification.status == TESTING (ERR_INVALID_STATE_TRANSITION)"
          - "no other ConnectivityTest with status == SCHEDULED shares the certification's env_code AND the same test_code AND has a closed interval [scheduled_start, scheduled_end] that comes within TEST_TEARDOWN_BUFFER_MINUTES of this test's closed interval (ERR_TEST_SLOT_CONFLICT)"
          - "at most MAX_CONCURRENT_TESTS_PER_ENV - 1 other ConnectivityTests with status == SCHEDULED on the same env_code have closed intervals sharing at least one instant with this test's closed interval (ERR_TEST_ENV_CAPACITY_EXCEEDED)"
        side_effects:
          - "scheduled_end is computed as scheduled_start + duration_minutes and PartnerCertification.reserved_test_minutes increases by duration_minutes"
          - "increments PartnerCertification.version by 1"

      - from: SCHEDULED
        to: PASSED
        trigger: "POST /connectivity-tests/{id}/outcome with outcome=PASSED"
        actor: TechnologyPartner
        preconditions:
          - "PartnerCertification.status == TESTING (ERR_INVALID_STATE_TRANSITION)"
          - "score is present (ERR_INVALID_REQUEST)"
        side_effects:
          - "PartnerCertification.reserved_test_minutes decreases by duration_minutes"
          - "certification_readiness_score re-runs both variants, rewriting readiness_score_strict and readiness_score_provisional"
          - "increments PartnerCertification.version by 1"

      - from: SCHEDULED
        to: FAILED
        trigger: "POST /connectivity-tests/{id}/outcome with outcome=FAILED"
        actor: TechnologyPartner
        preconditions:
          - "PartnerCertification.status == TESTING (ERR_INVALID_STATE_TRANSITION)"
          - "score is present (ERR_INVALID_REQUEST)"
        side_effects:
          - "PartnerCertification.reserved_test_minutes decreases by duration_minutes"
          - "if is_mandatory: PartnerCertification.mandatory_failed_count increments by 1"
          - "certification_readiness_score re-runs both variants, rewriting readiness_score_strict (forced to 0 while mandatory_failed_count > 0) and readiness_score_provisional"
          - "increments PartnerCertification.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /connectivity-tests/{id}/outcome with outcome=CANCELLED"
        actor: TechnologyPartner
        preconditions:
          - "PartnerCertification.status == TESTING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "PartnerCertification.reserved_test_minutes decreases by duration_minutes, restoring the value it held before this test was scheduled"
          - "score stays null and both readiness variants are unchanged: a cancelled slot leaves no trace in the score"
          - "increments PartnerCertification.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-create-stale-partner
    parent_entity: DistributionPartner
    write_endpoint: "POST /agency-agreements"
    occ_field: "expected_partner_version"
    description: |
      Creating an AgencyAgreement for a DistributionPartner whose version has
      advanced since the client last observed it is rejected. A new agreement
      legitimately supersedes the partner's prior PROPOSED / COUNTERED / SIGNED
      agreement on the same channel, so the writer must prove its view of the
      partner is current before that supersede is allowed to land.
    error_id: ERR_STALE_PARTNER_VERSION
    http_status: 412

  - rule_id: filing-revision-stale-base
    parent_entity: FareFiling
    write_endpoint: "POST /fare-filings/{id}/revisions"
    occ_field: "expected_fare_filing_version"
    description: |
      Filing a revision against a FareFiling whose version has advanced since
      the client last read it is rejected. A revision legitimately supersedes
      the base filing and withdraws every offer built on it, so a stale view of
      the base filing must not be allowed to supersede a revision the writer
      never saw.
    error_id: ERR_STALE_FARE_FILING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- C1 : per-line pricing, ROUNDING ORDER PINNED (round-then-sum) -------
  - name: offer_line_pricing
    trigger: "POST /offers — runs once per generated FARE / BUNDLE_ANCILLARY / ANCILLARY OfferItem, before surcharge_amount"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — list amount per line (no rounding yet)
      FARE line              : list_amount_cents = FareFiling.base_amount_cents
      BUNDLE_ANCILLARY line  : list_amount_cents = AncillaryProduct.list_amount_cents
      ANCILLARY line         : list_amount_cents = AncillaryProduct.list_amount_cents

      # Step 2 — bundle discount, only for BUNDLE_ANCILLARY lines
      discounted = list_amount_cents * (1 - BundleDefinition.bundle_discount_pct)   # exact rational
      discounted = list_amount_cents                                               # for FARE and ANCILLARY lines

      # Step 3 — channel markup, then round EACH LINE to whole cents
      net_amount_cents = round_half_up(discounted * (1 + Channel.content_markup_pct))

      # Step 4 — sum the ALREADY ROUNDED lines
      Offer.subtotal_cents = SUM over FARE, BUNDLE_ANCILLARY, ANCILLARY lines of net_amount_cents

      # PINNED ORDER: round per line, then sum. Summing the exact rational line
      # values and rounding once at the end is explicitly NOT the rule and can
      # differ by up to (line_count - 1) cents.
    input_set: "Exactly the OfferItem rows generated by this POST /offers call: one FARE line, one BUNDLE_ANCILLARY line per BundleDefinition.ancillary_codes entry (ordered by item_code ASC), one ANCILLARY line per Offer.ancillary_codes entry (ordered by item_code ASC). SURCHARGE lines are produced later by surcharge_amount and are excluded from subtotal_cents."
    constants:
      OFFER_TTL_MINUTES: 30
    precision: "whole cents, round_half_up, applied once per line at Step 3"
    variants: []

  # --- C2 : surcharge structure, inclusive threshold + clamps -------------
  - name: surcharge_amount
    trigger: "POST /offers — runs after offer_line_pricing has priced every non-surcharge line"
    algorithm: threshold
    formula: |
      # Rules are evaluated in ascending (SurchargeRule.threshold_cents,
      # SurchargeRule.created_at) order; that order is also the SURCHARGE lines'
      # `sequence` order.
      for rule in Channel.surcharge_rules ordered by (threshold_cents ASC, created_at ASC):
          if rule.item_scope == FARE:      scope_base = net_amount_cents of the FARE line
          if rule.item_scope == ANCILLARY: scope_base = SUM of net_amount_cents over ANCILLARY + BUNDLE_ANCILLARY lines
          if rule.item_scope == ALL:       scope_base = Offer.subtotal_cents
          if scope_base >= rule.threshold_cents:            # INCLUSIVE boundary
              raw   = round_half_up(scope_base * rule.rate_pct)
              amount = min(max(raw, rule.min_cents), rule.max_cents)
              emit a SURCHARGE OfferItem with list_amount_cents = raw and net_amount_cents = amount
          else:
              emit nothing for this rule

      Offer.surcharge_cents = SUM of net_amount_cents over the emitted SURCHARGE lines
      Offer.total_cents     = Offer.subtotal_cents + Offer.surcharge_cents
    input_set: "Every SurchargeRule whose channel_id equals the offer's channel_id. SurchargeRule rows are immutable, so the set is fixed at offer construction time. A rule whose scope_base is strictly below threshold_cents emits no line at all (item_count therefore varies with the scope base)."
    constants: {}
    precision: "whole cents, round_half_up applied to (scope_base * rate_pct) BEFORE the min/max clamp"
    variants: []

  # --- C3 : agency incentive, MARGINAL tiers + multiplier + cap (mode a) ---
  - name: agency_incentive_accrual
    trigger: "POST /orders/{id}/payment with action=CAPTURE (revenue added), and system cascade hop 3 of POST /service-requests/{id}/apply on a REFUND request (revenue removed)"
    algorithm: tiered_pricing
    formula: |
      R = AgencyAgreement.cumulative_net_revenue_cents        # AFTER the add/subtract
      # Step 1 — MARGINAL tier walk (not average rate)
      t1 = min(R, TIER_1_CEILING_CENTS)
      t2 = min(max(R - TIER_1_CEILING_CENTS, 0), TIER_2_CEILING_CENTS - TIER_1_CEILING_CENTS)
      t3 = max(R - TIER_2_CEILING_CENTS, 0)
      marginal = t1 * TIER_1_RATE + t2 * TIER_2_RATE + t3 * TIER_3_RATE     # exact rational, NOT rounded here
      # Step 2 — channel multiplier and the agreed percentage factor
      scaled = marginal * Channel.incentive_multiplier * (AgencyAgreement.agreed_incentive_pct / TIER_2_RATE)
      # Step 3 — cap, then round ONCE
      incentive_accrued_cents = round_half_up(min(scaled, AgencyAgreement.incentive_cap_cents))
      # Step 4 — tier label from the same R
      incentive_tier = TIER_3 if R >= TIER_2_CEILING_CENTS
                       else TIER_2 if R >= TIER_1_CEILING_CENTS
                       else TIER_1
      # Step 5 — downgrade counter (only on the refund cascade path)
      if the newly computed incentive_tier ranks strictly BELOW the stored
      incentive_tier: tier_downgrade_count += 1
    input_set: "cumulative_net_revenue_cents is the sum of Order.net_revenue_cents over Orders with agency_agreement_id == this agreement AND payment_status == PAID. Orders in AUTHORIZED, VOIDED or REFUNDED are excluded; fulfillment_status is irrelevant to the ledger."
    constants:
      TIER_1_CEILING_CENTS: 5000000
      TIER_2_CEILING_CENTS: 20000000
      TIER_1_RATE: 0.010
      TIER_2_RATE: 0.025
      TIER_3_RATE: 0.040
      MAX_NEGOTIATION_ROUNDS: 3
    precision: "whole cents, round_half_up, applied ONCE at Step 3 after the cap; the tier walk and the multiplier stay exact"
    variants: []
    note: "TIER_1_CEILING_CENTS is an INCLUSIVE tier-2 entry boundary: R == 5000000 already labels the agreement TIER_2 and puts 0 cents in the t2 band. MAX_NEGOTIATION_ROUNDS = 3 is carried here as the agreement-scoped constant used by §1.4 priority 29 and by the COUNTER precondition in §1.2: the fourth COUNTER on the same agreement is rejected with ERR_NEGOTIATION_ROUND_LIMIT."

  # --- C4 : DUAL VARIANT #1 — distribution cost per booking (channel) -----
  - name: distribution_cost_per_booking
    trigger: "POST /orders/{id}/payment (action=CAPTURE), system cascade hop 4 of POST /service-requests/{id}/apply on a REFUND request, and the CHANGE branch of POST /service-requests/{id}/apply"
    algorithm: aggregation
    formula: |
      B = Channel.booking_count                              # Orders on this channel with payment_status == PAID
      # ---- variant CHANNEL_AVERAGE (fixed cost spread evenly) ----
      cost_per_booking_flat_cents = 0                        if B == 0
                                  = round_half_up(Channel.monthly_platform_fee_cents / B)   otherwise
      # ---- variant ACTIVITY_BASED (traced per transaction) ----
      activity_cost_cents = SUM over Orders o on this channel with o.payment_status == PAID of
                              ( Channel.per_message_cost_cents * o.message_count
                              + Channel.per_segment_fee_cents  * o.segment_count )
                          + SUM over AgencyAgreements a with a.channel_id == this channel
                                and a.status == SIGNED of a.incentive_accrued_cents
      cost_per_booking_activity_cents = 0                    if B == 0
                                      = round_half_up(activity_cost_cents / B)   otherwise
    input_set: "Both variants read exactly the same Order population (payment_status == PAID on this channel) and the same clock-independent channel configuration. The agreement term of the ACTIVITY_BASED variant includes only agreements with status == SIGNED; SUSPENDED and SUPERSEDED agreements contribute 0."
    constants: {}
    precision: "whole cents, round_half_up on the final division only"
    variants:
      - name: CHANNEL_AVERAGE
        when: "reported in Channel.cost_per_booking_flat_cents — the accounting view that spreads the fixed monthly platform fee across whatever bookings happened"
        difference: "Ignores message_count, segment_count and incentive accrual entirely; a channel with one booking carries the whole monthly_platform_fee_cents."
      - name: ACTIVITY_BASED
        when: "reported in Channel.cost_per_booking_activity_cents — the traced view used for channel-shift decisions"
        difference: "Ignores monthly_platform_fee_cents entirely and instead charges per message, per segment and the signed agreements' incentive accrual, so identical bookings produce a different per-booking figure from CHANNEL_AVERAGE."

  # --- C5 : DUAL VARIANT #2 — certification readiness (weighted scoring) --
  - name: certification_readiness_score
    trigger: "POST /connectivity-tests/{id}/outcome with outcome IN {PASSED, FAILED} — both variants are recomputed and stored on every such call"
    algorithm: weighted_scoring
    formula: |
      considered = ConnectivityTests of this certification with status IN {PASSED, FAILED}
      weight(t)  = MANDATORY_TEST_WEIGHT if t.is_mandatory else OPTIONAL_TEST_WEIGHT
      # ---- variant STRICT ----
      if PartnerCertification.mandatory_failed_count > 0:
          readiness_score_strict = 0
      elif considered is empty:
          readiness_score_strict = 0
      else:
          readiness_score_strict = round_half_up(
              SUM over considered of (t.score * weight(t)) / SUM over considered of weight(t) )
      # ---- variant PROVISIONAL ----
      included = considered minus { t : t.is_mandatory AND t.status == FAILED }
      if included is empty:
          readiness_score_provisional = 0
      else:
          readiness_score_provisional = round_half_up(
              SUM over included of (t.score * weight(t)) / SUM over included of weight(t) )
    input_set: "Only ConnectivityTests with status IN {PASSED, FAILED} are considered; SCHEDULED tests (still holding reserved minutes) and CANCELLED tests never enter either variant's numerator or denominator."
    constants:
      MANDATORY_TEST_WEIGHT: 3
      OPTIONAL_TEST_WEIGHT: 1
      CERT_MIN_READINESS: 80
    precision: "integer 0-100, round_half_up on the weighted mean"
    variants:
      - name: STRICT
        when: "readiness_variant=STRICT on POST /partner-certifications/{id}/decision with decision=CERTIFY"
        difference: "A single FAILED mandatory test zeroes the whole score, so certification is impossible until the test is re-run under a new certification."
      - name: PROVISIONAL
        when: "readiness_variant=PROVISIONAL on POST /partner-certifications/{id}/decision with decision=CERTIFY"
        difference: "FAILED mandatory tests are dropped from BOTH the numerator and the denominator, so the same test population can clear CERT_MIN_READINESS that STRICT scores as 0."

  # --- C6 : refund settlement, EVALUATION ORDER PINNED (mode c) -----------
  - name: refund_settlement
    trigger: "POST /service-requests/{id}/review with action=APPROVE on a ServiceRequest whose request_type == REFUND"
    algorithm: waterfall_allocation
    formula: |
      # The four quantities look circularly defined (the fee depends on the base,
      # the total depends on the fee, the clawback depends on the total, and the
      # clawback is about the incentive that the refund itself will change).
      # The evaluation order below is PINNED; no other order is legal.
      # Step 1
      refundable_base_cents = SUM over OfferItem rows of the order's Offer
                              where refundable == true of net_amount_cents
      # Step 2 — fee tier keyed on the Step-1 result
      cancellation_fee_cents = REFUND_FEE_LOW_CENTS                              if refundable_base_cents <  REFUND_FEE_MID_FLOOR_CENTS
                             = REFUND_FEE_MID_CENTS                              if REFUND_FEE_MID_FLOOR_CENTS <= refundable_base_cents < REFUND_FEE_HIGH_FLOOR_CENTS
                             = round_half_up(refundable_base_cents * REFUND_FEE_HIGH_RATE)  if refundable_base_cents >= REFUND_FEE_HIGH_FLOOR_CENTS
      # Step 3 — total keyed on Steps 1 and 2, floored at zero
      refund_total_cents = max(refundable_base_cents - cancellation_fee_cents, 0)
      # Step 4 — AUDIT-ONLY clawback keyed on Step 3 and on the tier stored on the
      # agreement AT APPROVAL TIME (before the refund cascade moves the tier)
      rate = TIER_1_RATE if agreement.incentive_tier == TIER_1
             TIER_2_RATE if agreement.incentive_tier == TIER_2
             TIER_3_RATE if agreement.incentive_tier == TIER_3
      incentive_clawback_cents = round_half_up(refund_total_cents * rate)   # 0 when the order has no agreement
      # Step 5 — the apply call later re-runs agency_incentive_accrual on the
      # DECREMENTED cumulative_net_revenue_cents. incentive_clawback_cents is a
      # recorded audit figure only and is NEVER subtracted from
      # incentive_accrued_cents — that would double-count the reversal.
    input_set: "OfferItem rows of the order's Offer with refundable == true. SURCHARGE lines always carry refundable == false and are therefore never refunded; a la carte and bundled ancillaries are refundable only when their AncillaryProduct.refundable is true."
    constants:
      REFUND_FEE_LOW_CENTS: 2500
      REFUND_FEE_MID_CENTS: 7500
      REFUND_FEE_MID_FLOOR_CENTS: 50000
      REFUND_FEE_HIGH_FLOOR_CENTS: 200000
      REFUND_FEE_HIGH_RATE: 0.05
      TIER_1_RATE: 0.010
      TIER_2_RATE: 0.025
      TIER_3_RATE: 0.040
    precision: "whole cents, round_half_up at Step 2 (high tier) and Step 4"
    variants: []

  # --- C7 : regulatory disclosure completeness (empty-set boundary) -------
  - name: disclosure_completeness
    trigger: "POST /offers/{id}/publish (writes Offer.disclosure_complete) and POST /orders (gate only, no field written)"
    algorithm: aggregation
    formula: |
      required = Channel.required_disclosure_codes            # array of strings, may be empty
      acked    = the disclosure_ack_codes array submitted on this request (absent => [])
      missing  = [ c for c in required if c not in acked ]     # set difference, order-insensitive
      complete = (length(missing) == 0)
      # On POST /offers/{id}/publish: complete == false  => ERR_DISCLOSURE_INCOMPLETE;
      #   complete == true => Offer.acknowledged_disclosure_codes = acked (verbatim,
      #   including codes the channel did not require) and Offer.disclosure_complete = true.
      # On POST /orders: complete == false => ERR_DISCLOSURE_INCOMPLETE.
      # EMPTY-SET BOUNDARY: required == [] makes missing == [] for ANY acked value,
      # including an omitted disclosure_ack_codes, so publish and order both succeed
      # with disclosure_complete == true and acknowledged_disclosure_codes == [].
    input_set: "Channel.required_disclosure_codes of the offer's channel, compared against the codes submitted on the individual request. Codes already acknowledged on the publish call are NOT carried into POST /orders — the order call must resubmit them."
    constants: {}
    precision: "exact set comparison, no numeric rounding"
    variants: []

  # --- C8 : certification-environment slot geometry (two interval rules) ---
  - name: connectivity_slot_occupation
    trigger: "POST /partner-certifications/{id}/connectivity-tests — evaluated before the ConnectivityTest row is written; also maintains PartnerCertification.reserved_test_minutes on every schedule and outcome call"
    algorithm: interval_merge
    formula: |
      scheduled_end = scheduled_start + duration_minutes
      occupation    = the CLOSED interval [scheduled_start, scheduled_end]

      # ---- Rule A : same-test teardown buffer (pairwise) ----
      # Only SCHEDULED tests of the SAME env_code AND the SAME test_code are compared.
      # Each existing occupation is widened by the buffer on BOTH sides:
      widened(other) = [other.scheduled_start - TEST_TEARDOWN_BUFFER_MINUTES,
                        other.scheduled_end   + TEST_TEARDOWN_BUFFER_MINUTES]
      conflict_A = occupation shares at least one instant with widened(other)
      # Because both intervals are closed, a gap of EXACTLY
      # TEST_TEARDOWN_BUFFER_MINUTES conflicts; a gap strictly greater does not.

      # ---- Rule B : env-wide concurrency capacity (aggregate) ----
      # Every SCHEDULED test on the same env_code counts, regardless of test_code,
      # and NO buffer is applied here — raw closed intervals only.
      overlapping = count of SCHEDULED tests on this env_code whose raw closed
                    interval shares at least one instant with occupation
      conflict_B = (overlapping + 1) > MAX_CONCURRENT_TESTS_PER_ENV

      # ---- reserved minutes ledger ----
      PartnerCertification.reserved_test_minutes =
          SUM of duration_minutes over this certification's ConnectivityTests
          with status == SCHEDULED
    input_set: "ConnectivityTests with status == SCHEDULED only. PASSED, FAILED and CANCELLED tests release their slot and their minutes immediately and never participate in either rule. Rule A is scoped to (env_code, test_code) pairs; Rule B is scoped to env_code across all test_codes, which is why the two rules can never mask each other."
    constants:
      TEST_TEARDOWN_BUFFER_MINUTES: 15
      MAX_CONCURRENT_TESTS_PER_ENV: 2
    precision: "whole minutes; both intervals are CLOSED, so touching endpoints share an instant"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a whitespace-only value is treated as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the X-User-Role value is one of the six declared roles AND that role appears in the endpoint's §1.5 roles list; for entity_backed roles the X-User-ID must also match the resource ownership rule declared in §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body / query is well-formed: all required fields present, types and enum members valid, numeric and string constraints from §1.1 honored, limit within [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: "ERR_CHANNEL_NOT_FOUND | ERR_FARE_FILING_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SERVICE_REQUEST_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_CONNECTIVITY_TEST_NOT_FOUND | ERR_PARTNER_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    category: existence
    check: "every foreign key and catalogue code in the request body resolves: partner_id, channel_id, fare_filing_id, bundle_id, corporate_contract_id, offer_id, negotiated_fare_filing_id, and every entry of ancillary_codes"
    error_id: "ERR_PARTNER_NOT_FOUND | ERR_CHANNEL_NOT_FOUND | ERR_FARE_FILING_NOT_FOUND | ERR_BUNDLE_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_ANCILLARY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /agency-agreements, POST /corporate-contracts, POST /offers, POST /orders, POST /bundle-definitions, POST /partner-certifications"

  - priority: 6
    category: state
    check: "the submitted expected_<parent>_version equals the parent entity's current version (§1.2.1 OCC)"
    error_id: "ERR_STALE_PARTNER_VERSION | ERR_STALE_FARE_FILING_VERSION"
    http_status: 412
    applies_to: "POST /agency-agreements, POST /fare-filings/{id}/revisions"

  - priority: 7
    category: state
    check: "the targeted Offer has not reached expires_at; the lazy CONSTRUCTED/PUBLISHED -> EXPIRED transition is applied first and the operation is then rejected"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /offers/{id}/publish, POST /orders"

  - priority: 8
    category: state
    check: "the referenced FareFiling.status == ACTIVE"
    error_id: ERR_FARE_FILING_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /offers, POST /offers/{id}/publish"

  - priority: 9
    category: state
    check: "the referenced Offer.status == PUBLISHED"
    error_id: ERR_OFFER_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /orders"

  - priority: 10
    category: state
    check: "the targeted entity's current state has an outgoing transition for the requested trigger in §1.2 (covers fare-filing to_state, negotiation action, service-request review/apply, certification decision, connectivity-test outcome, order payment/fulfillment action, and the ConnectivityTest-still-SCHEDULED gate on CERTIFY)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /fare-filings/{id}/state, POST /agency-agreements/{id}/negotiation-rounds, POST /orders/{id}/payment, POST /orders/{id}/fulfillment, POST /orders/{id}/service-requests, POST /service-requests/{id}/review, POST /service-requests/{id}/apply, POST /partner-certifications/{id}/decision, POST /partner-certifications/{id}/connectivity-tests, POST /connectivity-tests/{id}/outcome"

  - priority: 11
    category: state
    check: "the Order's payment_status satisfies the operation: PAID for TICKET, for a REFUND service request and for applying one; AUTHORIZED for a VOID service request"
    error_id: ERR_ORDER_NOT_PAID
    http_status: 409
    applies_to: "POST /orders/{id}/fulfillment, POST /orders/{id}/service-requests, POST /service-requests/{id}/apply"

  - priority: 12
    category: state
    check: "when the ordering DistributionPartner.partner_type == TRAVEL_AGENCY, an AgencyAgreement with status == SIGNED exists for (partner_id, channel_id) of the offer"
    error_id: ERR_AGREEMENT_NOT_SIGNED
    http_status: 409
    applies_to: "POST /orders"

  - priority: 13
    category: state
    check: "no other PartnerCertification for the same (partner_id, channel_id) is in TESTING, CERTIFIED or SUSPENDED"
    error_id: ERR_CERTIFICATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /partner-certifications"

  - priority: 14
    category: business_safety
    check: "segregation of duties: the X-User-ID performing action=ACCEPT differs from AgencyAgreement.proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /agency-agreements/{id}/negotiation-rounds"

  - priority: 15
    category: business_safety
    check: "regulatory display: the submitted disclosure_ack_codes cover every entry of Channel.required_disclosure_codes (disclosure_completeness)"
    error_id: ERR_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /offers/{id}/publish, POST /orders"

  - priority: 16
    category: business_safety
    check: "servicing capability parity: Channel.servicing_parity_refund is true for a REFUND apply and Channel.servicing_parity_change is true for a CHANGE apply"
    error_id: ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL
    http_status: 422
    applies_to: "POST /service-requests/{id}/apply"

  - priority: 17
    category: business_referential
    check: "content linkage: when corporate_contract_id is present, that contract's negotiated_fare_filing_id equals fare_filing_id; and when FareFiling.is_private is true, corporate_contract_id must be present"
    error_id: ERR_PRIVATE_FARE_REQUIRES_CONTRACT
    http_status: 422
    applies_to: "POST /offers"

  - priority: 18
    category: business_referential
    check: "traceability: corporate_tracking_ref is present when the offer's CorporateContract.traceability_required is true"
    error_id: ERR_CORPORATE_TRACKING_REF_MISSING
    http_status: 422
    applies_to: "POST /orders"

  - priority: 19
    category: business_referential
    check: "traceability format: corporate_tracking_ref starts with the contract's tracking_ref_prefix"
    error_id: ERR_CORPORATE_TRACKING_REF_INVALID
    http_status: 422
    applies_to: "POST /orders"

  - priority: 20
    category: business_referential
    check: "partner type eligibility: partner_type == TRAVEL_AGENCY for an agency agreement, == CORPORATE for a corporate contract, IN {TECH_PROVIDER, TRAVEL_AGENCY} for a partner certification"
    error_id: ERR_PARTNER_TYPE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /agency-agreements, POST /corporate-contracts, POST /partner-certifications"

  - priority: 21
    category: business_temporal
    check: "the referenced CorporateContract.validity_state == IN_EFFECT at the current logical clock"
    error_id: ERR_CONTRACT_NOT_IN_EFFECT
    http_status: 409
    applies_to: "POST /offers"

  - priority: 22
    category: business_temporal
    check: "the logical clock lies inside the filing's half-open sale window [sale_from, sale_to)"
    error_id: ERR_FARE_SALE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /offers"

  - priority: 23
    category: business_temporal
    check: "departure_date lies inside the filing's closed travel window [travel_from, travel_to]"
    error_id: ERR_TRAVEL_DATE_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /offers"

  - priority: 24
    category: business_temporal
    check: "no other ACTIVE FareFiling sharing (origin, destination, cabin, fare_basis_code) has a half-open sale window [sale_from, sale_to) that strictly overlaps this one; touching endpoints (a.sale_to == b.sale_from) do NOT overlap"
    error_id: ERR_FARE_SALE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /fare-filings/{id}/state with to_state=ACTIVE"

  - priority: 25
    category: business_temporal
    check: "no SCHEDULED ConnectivityTest with the same env_code AND the same test_code has a closed interval [scheduled_start, scheduled_end] within TEST_TEARDOWN_BUFFER_MINUTES of the requested closed interval; the buffer is applied on both sides, so a gap of exactly the buffer is a conflict and a gap strictly greater than the buffer is not"
    error_id: ERR_TEST_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /partner-certifications/{id}/connectivity-tests"

  - priority: 26
    category: business_constraint
    check: "at most MAX_CONCURRENT_TESTS_PER_ENV SCHEDULED ConnectivityTests on the same env_code may share any instant, counting the requested one; closed intervals that touch at a single instant DO share that instant"
    error_id: ERR_TEST_ENV_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /partner-certifications/{id}/connectivity-tests"

  - priority: 27
    category: business_constraint
    check: "content access tier: Channel.content_tier_rank >= min_content_tier_rank of the filing, of the bundle, of every a la carte ancillary and of the corporate contract"
    error_id: ERR_CONTENT_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /offers"

  - priority: 28
    category: business_constraint
    check: "channel_code is unique across all Channels (case-sensitive exact match)"
    error_id: ERR_DUPLICATE_CHANNEL_CODE
    http_status: 409
    applies_to: "POST /channels"

  - priority: 29
    category: business_constraint
    check: "negotiation_round < MAX_NEGOTIATION_ROUNDS before a COUNTER is recorded"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /agency-agreements/{id}/negotiation-rounds"

  - priority: 30
    category: business_constraint
    check: "the readiness score of the variant named by readiness_variant is >= CERT_MIN_READINESS (inclusive)"
    error_id: ERR_READINESS_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /partner-certifications/{id}/decision with decision=CERTIFY"

  - priority: 31
    category: business_fiscal
    check: "the computed Offer.total_cents <= CorporateContract.max_offer_total_cents when the offer is priced under a contract"
    error_id: ERR_CONTRACT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /offers"

  - priority: 32
    category: business_fiscal
    check: "payment_amount_cents equals the source Offer.total_cents on a CAPTURE"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/payment"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- test-driving logical clock -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00.000Z: before any call to this endpoint every deadline, sale window, contract validity window and offer expiry is evaluated against that fixed instant and NEVER against real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "moves the logical clock; already stored expires_at / scheduled_end values are not rewritten, they are simply re-compared against the new clock"

  # --- Channel -------------------------------------------------------------
  - method: POST
    path: "/channels"
    description: "Registers a distribution channel with its content tier, markup, cost model, servicing parity flags and regulatory disclosure codes."
    roles: [PlatformAdmin]
    code: 201
    input: [channel_code, channel_kind, "content_tier?", "content_markup_pct?", "incentive_multiplier?", "monthly_platform_fee_cents?", "per_message_cost_cents?", "per_segment_fee_cents?", "servicing_parity_change?", "servicing_parity_refund?", "required_disclosure_codes?"]
    output: Channel
    side_effects:
      - "computes content_tier_rank from content_tier (FULL=3, STANDARD=2, RESTRICTED=1)"
      - "initialises booking_count, activity_cost_cents, cost_per_booking_flat_cents and cost_per_booking_activity_cents to 0"

  - method: GET
    path: "/channels/{id}"
    description: "Reads one channel including its live distribution-cost ledger (both cost-per-booking variants)."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency, TechnologyPartner]
    code: 200
    input: []
    output: Channel
    side_effects: []

  - method: PATCH
    path: "/channels/{id}/content-policy"
    description: "Revises a channel's content access tier, servicing parity flags and required disclosure codes. Offers already priced keep their priced_channel_version."
    roles: [DistributionManager]
    code: 200
    input: ["content_tier?", "servicing_parity_change?", "servicing_parity_refund?", "required_disclosure_codes?"]
    output: Channel
    side_effects:
      - "recomputes content_tier_rank; increments Channel.version by 1"
      - "does NOT reprice or withdraw existing offers"

  - method: POST
    path: "/channels/{id}/surcharge-rules"
    description: "Adds an immutable surcharge rule to a channel's surcharge structure."
    roles: [PlatformAdmin]
    code: 201
    input: [surcharge_code, item_scope, rate_pct, "threshold_cents?", "min_cents?", max_cents]
    output: SurchargeRule
    side_effects:
      - "increments Channel.version by 1; future offers on this channel emit a SURCHARGE line whenever the rule's scope base reaches threshold_cents"

  - method: GET
    path: "/channels/{id}/surcharge-rules"
    description: "Lists a channel's surcharge rules in (threshold_cents ASC, created_at ASC) order — the same order in which surcharge_amount evaluates them."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: SurchargeRule[]
    side_effects: []

  # --- DistributionPartner -------------------------------------------------
  - method: POST
    path: "/distribution-partners"
    description: "Registers a travel agency, technology provider or corporate account as a distribution partner."
    roles: [PlatformAdmin]
    code: 201
    input: [partner_name, partner_type, iata_code, home_country]
    output: DistributionPartner
    side_effects:
      - "certification_status starts at UNCERTIFIED"

  - method: GET
    path: "/distribution-partners/{id}"
    description: "Reads one distribution partner, including the certification_status that gates content access, and the version required by the agency-agreement OCC check."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency, TechnologyPartner]
    code: 200
    input: []
    output: DistributionPartner
    side_effects: []

  # --- FareFiling ----------------------------------------------------------
  - method: POST
    path: "/fare-filings"
    description: "Files a fare in DRAFT with its half-open sale window, closed travel window and minimum content tier."
    roles: [PricingAnalyst]
    code: 201
    input: [fare_basis_code, origin, destination, cabin, base_amount_cents, sale_from, sale_to, travel_from, travel_to, "min_content_tier_rank?", "refundable?", "is_private?"]
    output: FareFiling
    side_effects:
      - "status starts at DRAFT, revision_number at 0, base_filing_id at null; filed_by_user_id records the acting X-User-ID"

  - method: GET
    path: "/fare-filings/{id}"
    description: "Reads one fare filing, including the version required by the revision OCC check."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency, TechnologyPartner]
    code: 200
    input: []
    output: FareFiling
    side_effects: []

  - method: GET
    path: "/fare-filings"
    description: "Lists fare filings with filters; base_filing_id resolves a filing's revision children."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency]
    code: 200
    input: ["status?", "origin?", "destination?", "cabin?", "base_filing_id?", "limit?", "offset?"]
    output: FareFiling[]
    side_effects: []

  - method: POST
    path: "/fare-filings/{id}/state"
    description: "Drives the filing lifecycle: FILED, ACTIVE (with the sale-window overlap check), SUSPENDED, WITHDRAWN."
    roles: [PricingAnalyst, DistributionManager]
    code: 200
    input: [to_state, "reason?"]
    output: FareFiling
    side_effects:
      - "on SUSPENDED / WITHDRAWN: every Offer referencing the filing with status IN {CONSTRUCTED, PUBLISHED} becomes WITHDRAWN"
      - "increments FareFiling.version by 1"

  - method: POST
    path: "/fare-filings/{id}/revisions"
    description: "Re-files a fare: creates a DRAFT revision of the base filing and supersedes the base. Guarded by OCC on the base filing's version."
    roles: [PricingAnalyst]
    code: 201
    input: [base_amount_cents, sale_from, sale_to, expected_fare_filing_version]
    output: FareFiling
    side_effects:
      - "the base filing becomes SUPERSEDED and increments FareFiling.version by 1"
      - "the revision copies fare_basis_code / origin / destination / cabin / travel window / min_content_tier_rank / refundable / is_private, sets base_filing_id and revision_number = base.revision_number + 1, and starts in DRAFT"
      - "every Offer referencing the base filing with status IN {CONSTRUCTED, PUBLISHED} becomes WITHDRAWN"

  # --- AncillaryProduct / BundleDefinition ---------------------------------
  - method: POST
    path: "/ancillary-products"
    description: "Publishes a sellable ancillary with its list price, minimum content tier and refundability."
    roles: [PricingAnalyst]
    code: 201
    input: [ancillary_code, name, list_amount_cents, "min_content_tier_rank?", "refundable?"]
    output: AncillaryProduct
    side_effects: []

  - method: POST
    path: "/bundle-definitions"
    description: "Defines an ancillary bundle and the discount applied to each member before the channel markup."
    roles: [PricingAnalyst]
    code: 201
    input: [bundle_code, ancillary_codes, bundle_discount_pct, "min_content_tier_rank?"]
    output: BundleDefinition
    side_effects: []

  # --- AgencyAgreement -----------------------------------------------------
  - method: POST
    path: "/agency-agreements"
    description: "Opens an incentive agreement with a travel agency on one channel, in status PROPOSED. Guarded by OCC on the partner's version because the new agreement supersedes any open or signed agreement for the same (partner_id, channel_id)."
    roles: [DistributionManager]
    code: 201
    input: [partner_id, channel_id, proposed_incentive_pct, incentive_cap_cents, target_net_revenue_cents, expected_partner_version]
    output: AgencyAgreement
    side_effects:
      - "any AgencyAgreement for the same (partner_id, channel_id) with status IN {PROPOSED, COUNTERED, SIGNED} becomes SUPERSEDED"
      - "increments DistributionPartner.version by 1"
      - "sets proposed_by_user_id to the acting X-User-ID and negotiation_round to 0"

  - method: GET
    path: "/agency-agreements/{id}"
    description: "Reads one agency agreement with its revenue ledger, incentive accrual, tier and downgrade counter."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency, TechnologyPartner]
    code: 200
    input: []
    output: AgencyAgreement
    side_effects: []

  - method: GET
    path: "/agency-agreements"
    description: "Lists agency agreements filtered by partner, channel or status."
    roles: [PlatformAdmin, DistributionManager, ComplianceAuditor, Agency]
    code: 200
    input: ["partner_id?", "channel_id?", "status?", "limit?", "offset?"]
    output: AgencyAgreement[]
    side_effects: []

  - method: POST
    path: "/agency-agreements/{id}/negotiation-rounds"
    description: "Records one negotiation action: COUNTER (agency), PROPOSE (airline), ACCEPT (airline, segregation-of-duties enforced) or WITHDRAW."
    roles: [DistributionManager, Agency]
    code: 200
    input: [action, "proposed_incentive_pct?", "note?"]
    output: AgencyAgreement
    side_effects:
      - "COUNTER: negotiation_round += 1, proposed_incentive_pct replaced, status PROPOSED -> COUNTERED"
      - "PROPOSE: proposed_incentive_pct replaced, proposed_by_user_id reset, status COUNTERED -> PROPOSED"
      - "ACCEPT: agreed_incentive_pct frozen, signed_by_user_id set, status PROPOSED -> SIGNED"
      - "WITHDRAW: status becomes WITHDRAWN"
      - "increments AgencyAgreement.version by 1"

  # --- CorporateContract ---------------------------------------------------
  - method: POST
    path: "/corporate-contracts"
    description: "Registers a corporate contract that unlocks a negotiated filing, caps offer totals and pins the traceability reference prefix."
    roles: [DistributionManager]
    code: 201
    input: [corporate_partner_id, negotiated_fare_filing_id, account_code, max_offer_total_cents, "traceability_required?", "tracking_ref_prefix?", "min_content_tier_rank?", effective_from, effective_to]
    output: CorporateContract
    side_effects:
      - "validity_state is derived from the logical clock against [effective_from, effective_to)"

  - method: GET
    path: "/corporate-contracts/{id}"
    description: "Reads one corporate contract with its clock-derived validity_state."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency, TechnologyPartner]
    code: 200
    input: []
    output: CorporateContract
    side_effects: []

  - method: GET
    path: "/corporate-contracts"
    description: "Lists corporate contracts filtered by corporate account, negotiated filing or validity state."
    roles: [PlatformAdmin, DistributionManager, ComplianceAuditor, Agency]
    code: 200
    input: ["corporate_partner_id?", "negotiated_fare_filing_id?", "validity_state?", "limit?", "offset?"]
    output: CorporateContract[]
    side_effects: []

  # --- Offer ---------------------------------------------------------------
  - method: POST
    path: "/offers"
    description: "Constructs a channel-specific offer from one fare filing plus optional bundle and a la carte ancillaries, prices every line through offer_line_pricing and surcharge_amount, and stamps the offer's TTL."
    roles: [Agency, DistributionManager]
    code: 201
    input: [channel_id, partner_id, fare_filing_id, "bundle_id?", "corporate_contract_id?", "ancillary_codes?", trip_origin, trip_destination, departure_date, cabin]
    output: Offer
    side_effects:
      - "creates the FARE, BUNDLE_ANCILLARY, ANCILLARY and SURCHARGE OfferItem rows with their sequence values"
      - "sets subtotal_cents, surcharge_cents, total_cents, item_count, expires_at = created_at + OFFER_TTL_MINUTES and priced_channel_version = Channel.version"

  - method: GET
    path: "/offers/{id}"
    description: "Reads one offer; applies the lazy expiry transition before returning."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency, TechnologyPartner]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "if the logical clock is >= expires_at and status IN {CONSTRUCTED, PUBLISHED}, status becomes EXPIRED and Offer.version increments by 1 before the response is rendered"

  - method: GET
    path: "/offers"
    description: "Lists offers filtered by channel, partner, filing, bundle, contract or status."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency]
    code: 200
    input: ["channel_id?", "partner_id?", "fare_filing_id?", "bundle_id?", "corporate_contract_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: GET
    path: "/offers/{id}/items"
    description: "Lists an offer's immutable priced lines in ascending sequence order — the only channel through which cascade-created OfferItem rows are observable."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency]
    code: 200
    input: ["limit?", "offset?"]
    output: OfferItem[]
    side_effects: []

  - method: POST
    path: "/offers/{id}/publish"
    description: "Publishes a constructed offer into its channel after the regulatory disclosure codes are acknowledged."
    roles: [Agency, DistributionManager]
    code: 200
    input: ["disclosure_ack_codes?"]
    output: Offer
    side_effects:
      - "sets acknowledged_disclosure_codes and disclosure_complete = true; status CONSTRUCTED -> PUBLISHED; increments Offer.version by 1"

  # --- Order ---------------------------------------------------------------
  - method: POST
    path: "/orders"
    description: "Creates an order from a published offer, re-acknowledging the channel's disclosure codes and carrying the corporate traceability reference."
    roles: [Agency, DistributionManager]
    code: 201
    input: [offer_id, "disclosure_ack_codes?", "corporate_tracking_ref?", "message_count?", "segment_count?"]
    output: Order
    side_effects:
      - "freezes net_revenue_cents to Offer.total_cents and resolves agency_agreement_id to the SIGNED agreement for (partner_id, channel_id)"
      - "the source Offer becomes ORDERED and increments Offer.version by 1"

  - method: GET
    path: "/orders/{id}"
    description: "Reads one order with both independent status dimensions and the money ledger."
    roles: [PlatformAdmin, PricingAnalyst, DistributionManager, ComplianceAuditor, Agency, TechnologyPartner]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "Lists orders filtered by channel, partner, offer, agreement or either status dimension."
    roles: [PlatformAdmin, DistributionManager, ComplianceAuditor, Agency]
    code: 200
    input: ["channel_id?", "partner_id?", "offer_id?", "agency_agreement_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/payment"
    description: "Advances the payment dimension only: CAPTURE (AUTHORIZED -> PAID) or VOID (AUTHORIZED -> VOIDED)."
    roles: [Agency, DistributionManager]
    code: 200
    input: [action, "payment_amount_cents?"]
    output: Order
    side_effects:
      - "CAPTURE: paid_amount_cents set, Channel.booking_count += 1, agreement revenue ledger and incentive accrual re-run, channel distribution-cost variants re-run"
      - "VOID: fulfillment_status forced to CANCELLED, ledgers untouched"
      - "increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/fulfillment"
    description: "Advances the fulfillment dimension only: TICKET, FLY or CANCEL. Never changes payment_status."
    roles: [Agency, DistributionManager]
    code: 200
    input: [action]
    output: Order
    side_effects:
      - "increments Order.version by 1; payment_status and the money ledger are untouched"

  - method: POST
    path: "/orders/{id}/service-requests"
    description: "Opens a servicing request (CHANGE, REFUND or VOID) against an order."
    roles: [Agency, DistributionManager]
    code: 201
    input: [request_type, "requested_change_note?"]
    output: ServiceRequest
    side_effects:
      - "status starts at SUBMITTED with all four settlement figures at 0; submitted_by_user_id records the acting X-User-ID"

  - method: GET
    path: "/orders/{id}/service-requests"
    description: "Lists an order's servicing requests — the discovery channel for cascade-visible settlement figures."
    roles: [PlatformAdmin, DistributionManager, ComplianceAuditor, Agency]
    code: 200
    input: ["status?", "request_type?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/review"
    description: "Reviews a servicing request: START_REVIEW, APPROVE (runs refund_settlement for REFUND requests) or REJECT."
    roles: [DistributionManager]
    code: 200
    input: [action, "reason?"]
    output: ServiceRequest
    side_effects:
      - "APPROVE on a REFUND: writes refundable_base_cents, cancellation_fee_cents, refund_total_cents and incentive_clawback_cents without touching the Order"
      - "increments ServiceRequest.version by 1"

  - method: POST
    path: "/service-requests/{id}/apply"
    description: "Applies an approved servicing request, running the branch-specific cascade (REFUND / CHANGE / VOID) after the channel's servicing parity is verified."
    roles: [DistributionManager]
    code: 200
    input: []
    output: ServiceRequest
    side_effects:
      - "REFUND: Order -> REFUNDED + CANCELLED, channel booking_count decrement, agreement revenue decrement, incentive re-accrual with possible tier downgrade, channel distribution-cost re-run"
      - "CHANGE: Order.fulfillment_status -> CHANGED, message_count += 1, channel distribution-cost re-run"
      - "VOID: Order -> VOIDED + CANCELLED, no ledger movement"
      - "increments ServiceRequest.version by 1"

  # --- PartnerCertification / ConnectivityTest -----------------------------
  - method: POST
    path: "/partner-certifications"
    description: "Opens a certification for a technology provider or agency against one channel and one shared certification environment."
    roles: [TechnologyPartner, PlatformAdmin]
    code: 201
    input: [partner_id, channel_id, env_code]
    output: PartnerCertification
    side_effects:
      - "status starts at TESTING; DistributionPartner.certification_status becomes IN_CERTIFICATION and DistributionPartner.version increments by 1"
      - "tested_by_user_id records the acting X-User-ID"

  - method: GET
    path: "/partner-certifications/{id}"
    description: "Reads one certification with reserved_test_minutes and both readiness variants."
    roles: [PlatformAdmin, DistributionManager, ComplianceAuditor, Agency, TechnologyPartner]
    code: 200
    input: []
    output: PartnerCertification
    side_effects: []

  - method: GET
    path: "/partner-certifications"
    description: "Lists certifications filtered by partner, channel or status."
    roles: [PlatformAdmin, DistributionManager, ComplianceAuditor, TechnologyPartner]
    code: 200
    input: ["partner_id?", "channel_id?", "status?", "limit?", "offset?"]
    output: PartnerCertification[]
    side_effects: []

  - method: POST
    path: "/partner-certifications/{id}/connectivity-tests"
    description: "Schedules a connectivity test slot on the certification's shared environment, subject to the same-test teardown buffer and the environment's concurrency capacity."
    roles: [TechnologyPartner]
    code: 201
    input: [test_code, "is_mandatory?", scheduled_start, duration_minutes]
    output: ConnectivityTest
    side_effects:
      - "computes scheduled_end; PartnerCertification.reserved_test_minutes += duration_minutes and PartnerCertification.version increments by 1"

  - method: GET
    path: "/partner-certifications/{id}/connectivity-tests"
    description: "Lists a certification's connectivity tests."
    roles: [PlatformAdmin, DistributionManager, ComplianceAuditor, TechnologyPartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConnectivityTest[]
    side_effects: []

  - method: POST
    path: "/connectivity-tests/{id}/outcome"
    description: "Reports a scheduled test as PASSED, FAILED or CANCELLED, releasing its reserved minutes and re-running both readiness variants."
    roles: [TechnologyPartner]
    code: 200
    input: [outcome, "score?"]
    output: ConnectivityTest
    side_effects:
      - "PartnerCertification.reserved_test_minutes -= duration_minutes; PASSED/FAILED re-run certification_readiness_score for both variants; CANCELLED leaves both scores untouched"
      - "increments PartnerCertification.version by 1"

  - method: POST
    path: "/partner-certifications/{id}/decision"
    description: "Records the airline's certification decision: CERTIFY (with the readiness variant that must clear CERT_MIN_READINESS), SUSPEND, REINSTATE or REVOKE."
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "readiness_variant?"]
    output: PartnerCertification
    side_effects:
      - "CERTIFY: certified_variant set, partner becomes CERTIFIED, SUSPENDED agreements of the pair return to SIGNED"
      - "SUSPEND: partner becomes IN_CERTIFICATION, SIGNED agreements of the pair become SUSPENDED and their CONSTRUCTED/PUBLISHED offers become WITHDRAWN"
      - "REINSTATE: partner becomes CERTIFIED, SUSPENDED agreements of the pair return to SIGNED"
      - "REVOKE: SCHEDULED tests become CANCELLED, reserved_test_minutes becomes 0, partner becomes UNCERTIFIED, SIGNED agreements become SUSPENDED and their CONSTRUCTED/PUBLISHED offers become WITHDRAWN"
      - "increments DistributionPartner.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is absent, empty, or names a role outside the six declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is valid but is not listed in the target endpoint's roles, or an Agency / TechnologyPartner acts on a resource whose partner_id is not its own X-User-ID"

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is outside its declared domain, a money/count field is negative, sale_from >= sale_to, travel_from > travel_to, effective_from >= effective_to, duration_minutes <= 0, or a pct field falls outside [0, 1]"

  # --- existence (404) ----------------------------------------------------
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "no Channel exists with the id given in the path or in channel_id"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "no DistributionPartner exists with the id given in the path, in partner_id, or in corporate_partner_id"
  - id: ERR_FARE_FILING_NOT_FOUND
    http: 404
    condition: "no FareFiling exists with the id given in the path, in fare_filing_id, or in negotiated_fare_filing_id"
  - id: ERR_ANCILLARY_NOT_FOUND
    http: 404
    condition: "an entry of ancillary_codes (on an offer, or reached through a bundle's ancillary_codes) matches no AncillaryProduct"
  - id: ERR_BUNDLE_NOT_FOUND
    http: 404
    condition: "no BundleDefinition exists with the id given in bundle_id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no AgencyAgreement exists with the id given in the path"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no CorporateContract exists with the id given in the path or in corporate_contract_id"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "no Offer exists with the id given in the path or in offer_id"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "no Order exists with the id given in the path"
  - id: ERR_SERVICE_REQUEST_NOT_FOUND
    http: 404
    condition: "no ServiceRequest exists with the id given in the path"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "no PartnerCertification exists with the id given in the path"
  - id: ERR_CONNECTIVITY_TEST_NOT_FOUND
    http: 404
    condition: "no ConnectivityTest exists with the id given in the path"

  # --- optimistic concurrency (412) --------------------------------------
  - id: ERR_STALE_PARTNER_VERSION
    http: 412
    condition: "POST /agency-agreements carries an expected_partner_version that does not equal the target DistributionPartner's current version"
  - id: ERR_STALE_FARE_FILING_VERSION
    http: 412
    condition: "POST /fare-filings/{id}/revisions carries an expected_fare_filing_version that does not equal the base FareFiling's current version"

  # --- state (409) --------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared for the entity's current state — including any trigger fired from a terminal state (WITHDRAWN, SUPERSEDED, EXPIRED, REVOKED, APPLIED, REJECTED, FLOWN) and a repeated one-shot trigger such as a second /publish or a second /apply"
  - id: ERR_OFFER_NOT_PUBLISHED
    http: 409
    condition: "POST /orders names an offer whose status is not PUBLISHED"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "the logical clock has reached the offer's expires_at, so /publish or /orders acts on an offer that lazily became EXPIRED"
  - id: ERR_FARE_FILING_NOT_ACTIVE
    http: 409
    condition: "POST /offers names a FareFiling whose status is not ACTIVE, or POST /offers/{id}/publish finds that the offer's FareFiling has left ACTIVE since construction"
  - id: ERR_AGREEMENT_NOT_SIGNED
    http: 409
    condition: "POST /orders finds no AgencyAgreement in status SIGNED for the offer's (partner_id, channel_id) pair"
  - id: ERR_ORDER_NOT_PAID
    http: 409
    condition: "a REFUND service request is opened against, or applied to, an Order whose payment_status is not PAID"
  - id: ERR_CERTIFICATION_ALREADY_OPEN
    http: 409
    condition: "POST /partner-certifications targets a (partner_id, channel_id) pair that already has a certification in status TESTING, CERTIFIED or SUSPENDED"

  # --- safety / segregation (422) ----------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "POST /agency-agreements/{id}/negotiation-rounds with action=ACCEPT is performed by the same X-User-ID that is recorded in the agreement's proposed_by_user_id; this is the only operation guarded by segregation of duties"
  - id: ERR_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "the disclosure_ack_codes supplied to /publish or POST /orders do not cover every code in the channel's required_disclosure_codes"
  - id: ERR_SERVICING_NOT_SUPPORTED_ON_CHANNEL
    http: 422
    condition: "a CHANGE is applied on a channel whose servicing_parity_change is false, or a REFUND is applied on a channel whose servicing_parity_refund is false"

  # --- referential / corporate (422) -------------------------------------
  - id: ERR_PRIVATE_FARE_REQUIRES_CONTRACT
    http: 422
    condition: "POST /offers names a FareFiling with is_private = true and either supplies no corporate_contract_id or supplies a contract whose negotiated_fare_filing_id is a different filing"
  - id: ERR_CORPORATE_TRACKING_REF_MISSING
    http: 422
    condition: "POST /orders omits corporate_tracking_ref for an offer whose corporate contract has traceability_required = true"
  - id: ERR_CORPORATE_TRACKING_REF_INVALID
    http: 422
    condition: "the supplied corporate_tracking_ref does not begin with the contract's tracking_ref_prefix"
  - id: ERR_PARTNER_TYPE_NOT_ELIGIBLE
    http: 422
    condition: "the partner's partner_type does not admit the operation: a non-TRAVEL_AGENCY partner on POST /agency-agreements, a non-CORPORATE partner as corporate_partner_id, or a CORPORATE partner on POST /partner-certifications"

  # --- temporal (409 / 422) ----------------------------------------------
  - id: ERR_CONTRACT_NOT_IN_EFFECT
    http: 409
    condition: "the corporate contract's validity_state is PENDING or LAPSED when the logical clock is compared against [effective_from, effective_to)"
  - id: ERR_FARE_SALE_WINDOW_CLOSED
    http: 409
    condition: "the logical clock lies outside the filing's half-open sale window [sale_from, sale_to) at offer construction"
  - id: ERR_TRAVEL_DATE_OUT_OF_WINDOW
    http: 422
    condition: "departure_date lies outside the filing's closed travel window [travel_from, travel_to]"
  - id: ERR_FARE_SALE_WINDOW_OVERLAP
    http: 409
    condition: "activating a filing would give two ACTIVE filings with the same (origin, destination, cabin, fare_basis_code) strictly overlapping half-open sale windows"
  - id: ERR_TEST_SLOT_CONFLICT
    http: 409
    condition: "a new connectivity test's [scheduled_start, scheduled_end] closed interval, widened by TEST_TEARDOWN_BUFFER_MINUTES, touches an existing SCHEDULED test with the same (env_code, test_code)"
  - id: ERR_TEST_ENV_CAPACITY_EXCEEDED
    http: 409
    condition: "a new connectivity test would make more than MAX_CONCURRENT_TESTS_PER_ENV SCHEDULED tests overlap on the same env_code across different test_codes"

  # --- business constraints (409 / 422) ----------------------------------
  - id: ERR_DUPLICATE_CHANNEL_CODE
    http: 409
    condition: "POST /channels reuses an existing channel_code"
  - id: ERR_NEGOTIATION_ROUND_LIMIT
    http: 422
    condition: "a COUNTER would push negotiation_round beyond MAX_NEGOTIATION_ROUNDS"
  - id: ERR_CONTENT_TIER_INSUFFICIENT
    http: 422
    condition: "the channel's content_tier_rank is below the min_content_tier_rank of the filing, of any requested ancillary, of the bundle, or of the corporate contract"
  - id: ERR_READINESS_BELOW_MINIMUM
    http: 422
    condition: "CERTIFY is requested but the readiness score of the named readiness_variant is below CERT_MIN_READINESS, or the variant is STRICT while mandatory_failed_count > 0"

  # --- fiscal (422) -------------------------------------------------------
  - id: ERR_CONTRACT_CAP_EXCEEDED
    http: 422
    condition: "the constructed offer's total_cents exceeds the corporate contract's max_offer_total_cents"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "CAPTURE supplies a payment_amount_cents that does not equal the order's net_revenue_cents"

