- rule_id: priority_pair_validation_conflict
  applies: true
  rationale: |
    The §1.4 ladder has fourteen priorities, so a request can violate two rules at once and
    only the earlier error may surface. Four non-adjacent pairs are exercised: entity state
    (8) vs fiscal (14), safety (11) vs fiscal (14), temporal (12) vs constraint (13), and
    OCC (10) vs fiscal (14).
  instances:
  - name: subscription_state_precedes_oversubscription_fiscal_check
    grounds:
    - §1.4 priority 8 entity state -> ERR_INVALID_SUBSCRIPTION_STATE (409)
    - §1.4 priority 14 business_fiscal -> ERR_OVERSUBSCRIPTION (422)
    - §1.1 OfferingDocument.offering_amount_cents, .unit_price_cents
    distinguishing_aspect: |
      Re-accepting an already-ACCEPTED subscription against an offering that is already
      filled to its ceiling violates both the state rule at priority 8 and the
      oversubscription rule at priority 14. Only ERR_INVALID_SUBSCRIPTION_STATE (409) may
      be returned. An implementation that computes the money checks before reading the
      subscription's status returns ERR_OVERSUBSCRIPTION (422) instead, and one that is
      merely idempotent returns 200.
