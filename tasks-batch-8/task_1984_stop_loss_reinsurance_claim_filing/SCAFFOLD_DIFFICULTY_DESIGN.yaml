              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CROSS_PLAN_REFERENCE (priority 5 beats priority 9 even though the laser deductible is also below base)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: notice_threshold_exact_equality_triggers
        grounds:
          - calculations.notice_threshold_check
          - entities.ClaimAccumulation.fields.notice_triggered
        distinguishing_aspect: |
          Numeric threshold metric: a SPECIFIC accumulation landing EXACTLY at
          notice_threshold_pct * deductible (>=, not >) MUST flip
          notice_triggered true; one cent below MUST leave it false.
        test_recipe:
          setup:
            - "Contract specific_ded=100000_00, notice_threshold=0.50; member with one claim paid at exactly 50000_00 (exact boundary)"
            - "Second member with one claim paid at 49999_99 (one cent below)"
          setup_api_calls:
            - call: "POST /stop-loss/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdministrator
