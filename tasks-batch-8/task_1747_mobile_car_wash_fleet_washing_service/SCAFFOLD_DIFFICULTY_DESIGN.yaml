            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech F2" }, as: PlatformAdmin, captures: { t2_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-20", van_id: "${van1_id}", lead_technician_id: "${t1_id}" }, as: Dispatcher, captures: { ra_id: $.data.id, ra_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${ra_id}/stops", payload: { wash_order_id: "${oa_id}", expected_route_version: "${ra_v}" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${ra_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
