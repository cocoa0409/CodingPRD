          - errors[ERR_SUPERSEDE_TARGET_INVALID]
          - errors[ERR_EXCAVATION_LIMIT_EXCEEDED]
          - validations[priority=60]
          - validations[priority=70]
          - calculations[remediation_cost]
        distinguishing_aspect: "supersedes_change_order_id must name an APPROVED row: pointing it at a REJECTED change order returns ERR_SUPERSEDE_TARGET_INVALID 409. A separate 50.0 cy change order would push approved_scope to 58.0 cy past the 40.0 cy ceiling, so the approval decision — not the create — returns ERR_EXCAVATION_LIMIT_EXCEEDED 409 and approved_scope_cubic_yards stays at the 8.0 cy baseline."
        test_recipe:
          setup:
            - "One NJ project at REMEDIATION_ACTIVE after a GROSS round-1 result (tph 6200.0, benzene 1.2), baseline_scope 8.0 cy, excavation_limit 40.0 cy."
            - "Change order CO1 (3.0 cy) has been submitted and REJECTED."
