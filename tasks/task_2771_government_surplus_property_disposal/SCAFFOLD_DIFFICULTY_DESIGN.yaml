            - "the first bid returns a single error object, not a list containing ERR_BID_BELOW_RESERVE"
            - "after open: AuctionLot.${lot1}.status == OPEN and bid_count == 0 — the refused bid persisted nothing"
            - "the second bid (same amount, now OPEN) returns 422 with error.code == ERR_BID_BELOW_RESERVE"
