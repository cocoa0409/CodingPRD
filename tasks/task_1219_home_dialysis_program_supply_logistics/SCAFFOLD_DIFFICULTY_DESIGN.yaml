            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pat_v}" }, as: HomeNurse, as_user_id: "nurse-1", captures: { plan: $.data.id } }
