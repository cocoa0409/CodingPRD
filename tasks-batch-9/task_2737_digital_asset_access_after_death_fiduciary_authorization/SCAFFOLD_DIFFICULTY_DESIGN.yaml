              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-H1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-H", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-H", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-only", quoted_value_cents: 200000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
