            - "First queue read: total_count == 3 with rows ordered ${c_lsite5a_id} (90.50), ${c_lsite5b_id} (63.00), ${c_lsite5c_id} (25.50) — creation order was low, high, middle"
            - "Second queue read: total_count == 2 with head ${c_lsite5b_id}; the FUNDED site ${c_lsite5a_id} is absent"
            - "MineSite.${c_lsite5a_id}.funding_status == FUNDED with awarded_funding_amount == 1200000.00"

  # ===========================================================================
  # §1.6 sweep: every error code in the catalog must be reachable. Codes already
  # triggered by a §1.8 instance appear here as excluded_because stubs.
  - section: errors
    instances:
      - name: entity_not_found_codes_are_specific_to_the_addressed_entity
        claim_type: error_triggerability
        grounds:
          - errors[ERR_OPERATOR_NOT_FOUND]
          - errors[ERR_INSPECTOR_PROFILE_NOT_FOUND]
          - errors[ERR_ESTIMATE_NOT_FOUND]
          - errors[ERR_INSTRUMENT_NOT_FOUND]
          - errors[ERR_RELEASE_APPLICATION_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_VIOLATION_NOTICE_NOT_FOUND]
          - errors[ERR_REVISION_NOT_FOUND]
          - errors[ERR_PROCEEDING_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Nine unstored path ids on nine different collections each return that collection's own 404 code, so the priority-4 existence check is entity-specific rather than a single generic NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database; every id below is well-formed but unstored."
          setup_api_calls: []
          trigger:
            - call: "GET /mining/operators/00000000-0000-0000-0000-000000000001"
              as: ProgramDirector
              captures: { c_nf_op: $.data.error_id }
            - call: "GET /mining/inspector-profiles/00000000-0000-0000-0000-000000000002"
              as: ProgramDirector
              captures: { c_nf_insp: $.data.error_id }
            - call: "GET /mining/reclamation-cost-estimates/00000000-0000-0000-0000-000000000003"
              as: ProgramDirector
              captures: { c_nf_est: $.data.error_id }
            - call: "GET /mining/bond-instruments/00000000-0000-0000-0000-000000000004"
              as: ProgramDirector
              captures: { c_nf_inst: $.data.error_id }
            - call: "GET /mining/bond-release-applications/00000000-0000-0000-0000-000000000005"
              as: ProgramDirector
              captures: { c_nf_app: $.data.error_id }
            - call: "GET /mining/inspections/00000000-0000-0000-0000-000000000006"
              as: ProgramDirector
              captures: { c_nf_ins: $.data.error_id }
            - call: "GET /mining/violation-notices/00000000-0000-0000-0000-000000000007"
              as: ProgramDirector
              captures: { c_nf_vn: $.data.error_id }
            - call: "GET /mining/permit-revisions/00000000-0000-0000-0000-000000000008"
              as: ProgramDirector
              captures: { c_nf_rev: $.data.error_id }
            - call: "GET /mining/forfeiture-proceedings/00000000-0000-0000-0000-000000000009"
              as: ProgramDirector
              captures: { c_nf_fp: $.data.error_id }
          assert:
            - "All nine responses are HTTP 404 with response_type == error"
            - "${c_nf_op} == ERR_OPERATOR_NOT_FOUND, ${c_nf_insp} == ERR_INSPECTOR_PROFILE_NOT_FOUND, ${c_nf_est} == ERR_ESTIMATE_NOT_FOUND"
            - "${c_nf_inst} == ERR_INSTRUMENT_NOT_FOUND, ${c_nf_app} == ERR_RELEASE_APPLICATION_NOT_FOUND, ${c_nf_ins} == ERR_INSPECTION_NOT_FOUND"
            - "${c_nf_vn} == ERR_VIOLATION_NOTICE_NOT_FOUND, ${c_nf_rev} == ERR_REVISION_NOT_FOUND, ${c_nf_fp} == ERR_PROCEEDING_NOT_FOUND"

      - name: request_without_auth_headers_rejected_before_anything_else
        claim_type: error_triggerability
        grounds:
          - errors[ERR_MISSING_AUTH_HEADERS]
          - validations[priority=1]
        distinguishing_aspect: "A POST /mining/operators sent with no X-Role or X-User-ID headers returns ERR_MISSING_AUTH_HEADERS (401) even though its body is also malformed, proving priority 1 runs ahead of priority 3."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mining/operators"
              payload: { legal_name: "Headerless Mining" }
              captures: { c_err_auth: $.data.error_id }
          assert:
            - "The request carries neither X-Role nor X-User-ID"
            - "HTTP 401 with ${c_err_auth} == ERR_MISSING_AUTH_HEADERS, not the 422 ERR_INVALID_REQUEST the incomplete body would otherwise cause"
            - "GET /mining/operators (with valid headers) returns total_count == 0"

