    description: "List education completions for a household"
    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist, Household]
    code: 200
    input: ["limit?", "offset?"]
    output: "EducationCompletion[]"
    side_effects: []

  # --- Unit ---
  - method: POST
    path: "/programs/{id}/units"
    description: "Create a unit"
    roles: [ProgramAdmin]
    code: 201
    input: [address, bedrooms, original_subsidy_cents, original_sale_price_cents]
    output: Unit
    side_effects: ["occupancy_status=VACANT; maintenance_flag=OK; next_inspection_due_at computed"]

  - method: GET
    path: "/programs/{id}/units"
