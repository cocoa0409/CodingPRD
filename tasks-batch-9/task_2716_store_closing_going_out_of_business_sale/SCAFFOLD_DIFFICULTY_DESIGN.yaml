      - name: augmentation_ratio_exactly_at_cap_accepted_then_eight_ten_thousandths_over_rejected
        grounds:
          - calculations.augmentation_cap_check
          - validations[priority=80]
          - errors[ERR_AUGMENTATION_CAP_EXCEEDED]
          - entities.Store.fields.augmentation_cost_value_cents
          - entities.Jurisdiction.fields.max_augmentation_ratio
        distinguishing_aspect: |
          A different boundary in a different unit — a 4-decimal RATIO against an inclusive cap,
          not a percentage shortfall against zero. 500,000 cents of augmentation over a 5,000,000
          base is exactly 0.1000 == max_augmentation_ratio and must be ACCEPTED (the comparison is
          strictly greater-than), while adding only 4,000 cents more takes the ratio to 0.1008 and
          must be refused. The 8-in-10,000 margin also proves the ratio is rounded to 4 decimals
          rather than 2, which would report 0.10 and wrongly accept.
