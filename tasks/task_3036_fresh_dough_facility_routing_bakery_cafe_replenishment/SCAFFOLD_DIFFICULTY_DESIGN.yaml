            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r2_id}/stops"
              payload: { seq: 2, cafe_id: "${c5_id}", planned_arrival: "2026-09-11T03:50:00Z", window_start_local: "03:00", window_end_local: "04:00", planned_units: 210 }
