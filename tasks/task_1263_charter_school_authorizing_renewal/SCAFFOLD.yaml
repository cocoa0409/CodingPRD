    side_effects:
      - "status = INITIATED; school OPEN -> CLOSING"
      - "REVOCATION: ACTIVE contract -> REVOKED"
      - "school lottery cascade fires (DRAFT|OPEN|SEALED -> CANCELLED, entries VOIDED)"
  - method: GET
    path: "/authorizer/schools/{id}/closure-plans"
    description: "List closure plans for a school"
    roles: [Applicant, AuthorizerStaff, ApplicationReviewer, BoardMember, AppealsOfficer, SchoolOperator, AuthorizerAdmin]
    code: 200
    input: []
    output: "ClosurePlan[]"
    side_effects: []
  - method: GET
    path: "/authorizer/closure-plans/{id}"
    description: "Get one closure plan"
    roles: [Applicant, AuthorizerStaff, ApplicationReviewer, BoardMember, AppealsOfficer, SchoolOperator, AuthorizerAdmin]
    code: 200
    input: []
    output: ClosurePlan
    side_effects: []
  - method: POST
    path: "/authorizer/closure-plans/{id}/student-transitions"
    description: "Add a student to transition (plan INITIATED or TRANSITION_IN_PROGRESS)"
    roles: [AuthorizerStaff]
    code: 201
    input: [student_ref]
    output: StudentTransition
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/authorizer/closure-plans/{id}/student-transitions"
    description: "List student transitions of a closure plan"
    roles: [Applicant, AuthorizerStaff, ApplicationReviewer, BoardMember, AppealsOfficer, SchoolOperator, AuthorizerAdmin]
    code: 200
    input: []
    output: "StudentTransition[]"
    side_effects: []
  - method: POST
    path: "/authorizer/student-transitions/{id}/place"
    description: "PENDING -> PLACED with destination school"
    roles: [AuthorizerStaff]
    code: 200
    input: [destination_school]
    output: StudentTransition
    side_effects: ["status -> PLACED; destination_school recorded"]
  - method: POST
    path: "/authorizer/student-transitions/{id}/records-sent"
    description: "PLACED -> RECORDS_SENT"
    roles: [AuthorizerStaff]
    code: 200
    input: []
    output: StudentTransition
    side_effects: ["status -> RECORDS_SENT"]
  - method: POST
    path: "/authorizer/closure-plans/{id}/advance"
    description: "Stepwise advance INITIATED -> TRANSITION_IN_PROGRESS -> RECORDS_COMPLETE -> CLOSED"
    roles: [AuthorizerStaff]
    code: 200
    input: []
    output: ClosurePlan
    side_effects: ["step transition per current status; CLOSED closes the school"]

  # --- Authorizer fees ---
  - method: POST
    path: "/authorizer/schools/{id}/fee-invoices"
    description: "Issue annual authorizer fee invoice (ESTIMATED variant); unique (school, fiscal_year); school OPEN or CLOSING"
    roles: [AuthorizerStaff]
    code: 201
    input: [fiscal_year, estimated_enrollment, base_per_pupil_cents, qualifying_supplemental_pupils]
    output: FeeInvoice
    side_effects: ["status = ESTIMATED; billed_variant = ESTIMATED; funding + fee computed"]
  - method: GET
    path: "/authorizer/schools/{id}/fee-invoices"
    description: "List fee invoices for a school"
    roles: [Applicant, AuthorizerStaff, ApplicationReviewer, BoardMember, AppealsOfficer, SchoolOperator, AuthorizerAdmin]
    code: 200
    input: []
    output: "FeeInvoice[]"
    side_effects: []
  - method: POST
    path: "/authorizer/fee-invoices/{id}/finalize"
    description: "ESTIMATED -> FINALIZED with audited enrollment; recompute FINAL variant"
    roles: [AuthorizerStaff]
    code: 200
    input: [audited_enrollment]
    output: FeeInvoice
    side_effects: ["audited_enrollment recorded; billed_variant = FINAL; amounts recomputed"]
  - method: POST
    path: "/authorizer/fee-invoices/{id}/pay"
    description: "SchoolOperator pays own FINALIZED invoice in full"
    roles: [SchoolOperator]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> PAID; paid_cents = billed_amount_cents"]
  - method: POST
    path: "/authorizer/fee-invoices/{id}/waive"
    description: "Board waives a FINALIZED invoice (paid_cents must be 0)"
    roles: [BoardMember]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status -> WAIVED; waived_cents = billed_amount_cents"]

  # --- Appeals ---
  - method: POST
    path: "/authorizer/appeals"
    description: "File an appeal (30-day inclusive window from target decision); SchoolOperator files for own school; Applicant files APPLICATION_DENIAL with school_id null"
    roles: [SchoolOperator, Applicant]
    code: 201
    input: [target_type, target_id, grounds, "school_id?"]
    output: Appeal
    side_effects:
      - "status = FILED; filed_at = clock; filed_by_user_id = caller"
      - "FEE_INVOICE target: invoice FINALIZED -> DISPUTED"
  - method: GET
    path: "/authorizer/appeals"
    description: "List appeals (FK reverse-reachability for school_id)"
    roles: [Applicant, AuthorizerStaff, ApplicationReviewer, BoardMember, AppealsOfficer, SchoolOperator, AuthorizerAdmin]
    code: 200
    input: ["school_id?", "status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/authorizer/appeals/{id}"
    description: "Get one appeal"
    roles: [Applicant, AuthorizerStaff, ApplicationReviewer, BoardMember, AppealsOfficer, SchoolOperator, AuthorizerAdmin]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/authorizer/appeals/{id}/schedule-hearing"
    description: "FILED -> HEARING_SCHEDULED; officer must differ from original decider (SOD)"
    roles: [AuthorizerStaff]
    code: 200
    input: [hearing_officer_user_id]
    output: Appeal
    side_effects: ["hearing_officer_user_id recorded"]
  - method: POST
    path: "/authorizer/appeals/{id}/rule"
    description: "Assigned AppealsOfficer rules UPHELD | OVERTURNED; overturn cascades to the target"
    roles: [AppealsOfficer]
    code: 200
    input: [ruling]
    output: Appeal
    side_effects: ["status -> RULED_UPHELD | RULED_OVERTURNED; target-specific cascade per Appeal machine"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Caller role not in endpoint roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (left-to-right)" }
  - { id: ERR_RESOURCE_OWNERSHIP_MISMATCH, http: 403, condition: "SchoolOperator does not own the target resource's school" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum, out-of-range value, interval start >= end, or missing conditional field (denial_reason, return_notes, destination_school)" }
  - { id: ERR_STALE_SCHOOL_VERSION, http: 412, condition: "expected_school_version does not match school.version on contract create" }
  - { id: ERR_STALE_INTERVENTION_VERSION, http: 412, condition: "expected_intervention_version does not match intervention.version on corrective plan create" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application not in required state (accept-intake, scores, interviews, advance, decide)" }
  - { id: ERR_INTERVIEW_INVALID_STATE, http: 409, condition: "Interview not SCHEDULED when scoring" }
  - { id: ERR_CONTRACT_INVALID_STATE, http: 409, condition: "Contract not DRAFT for targets/activate, or not ACTIVE where required" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "Report not SUBMITTED (accept/return) or not RETURNED (resubmit)" }
  - { id: ERR_LOTTERY_INVALID_STATE, http: 409, condition: "Lottery not in required state (open/seal/execute/certify/entries)" }
  - { id: ERR_ENTRY_INVALID_STATE, http: 409, condition: "Entry not PENDING (verify) or not OFFERED (decline)" }
  - { id: ERR_NOTICE_INVALID_STATE, http: 409, condition: "Notice not DRAFT (issue) or not ISSUED (escalate/resolve/plan), or level REVOCATION_REVIEW on escalate" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "Plan not SUBMITTED (review) or not RETURNED (resubmit)" }
  - { id: ERR_DECISION_INVALID_STATE, http: 409, condition: "Renewal decision not PENDING|REVERTED (decide) or not DECIDED (finalize)" }
  - { id: ERR_CLOSURE_INVALID_STATE, http: 409, condition: "Closure plan not in the state the advance step requires, or not INITIATED|TRANSITION_IN_PROGRESS for student adds" }
  - { id: ERR_TRANSITION_INVALID_STATE, http: 409, condition: "Student transition not PENDING (place) or not PLACED (records-sent)" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Invoice not ESTIMATED (finalize), not FINALIZED (pay), or not FINALIZED-with-zero-paid (waive)" }
  - { id: ERR_APPEAL_INVALID_STATE, http: 409, condition: "Appeal not FILED (schedule-hearing) or not HEARING_SCHEDULED (rule)" }
  - { id: ERR_SCHOOL_NOT_OPEN, http: 409, condition: "School not OPEN where required (lottery open, monitoring create, intervention create, renewal create) or not PRE_OPENING|OPEN where required (lottery create, contract activation)" }
  - { id: ERR_DUPLICATE_RECORD, http: 409, condition: "Uniqueness violated: (application,reviewer,criterion) score; (school,fiscal_year) report or invoice; (school,academic_year) lottery; (contract,domain,metric_code) target" }
  - { id: ERR_BOARD_REVIEW_BLOCKED, http: 409, condition: "Rubric incomplete or interview not SCORED when advancing to board" }
  - { id: ERR_INTERVIEW_ALREADY_ACTIVE, http: 409, condition: "A non-CANCELLED interview already exists for the application" }
  - { id: ERR_SOD_REVIEWER_PANEL_CONFLICT, http: 403, condition: "A panelist appears in the application's review_scores (segregation of duties)" }
  - { id: ERR_PANEL_TIME_OVERLAP, http: 409, condition: "A panelist already has a SCHEDULED interview overlapping the half-open interval (adjacency allowed)" }
  - { id: ERR_NOT_PANELIST, http: 403, condition: "Scoring reviewer is not in the interview's panelist_user_ids" }
  - { id: ERR_COMPOSITE_BELOW_THRESHOLD, http: 422, condition: "decide APPROVED with composite_score < 75.0" }
  - { id: ERR_CONTRACT_TERM_OVERLAP, http: 409, condition: "New term overlaps sibling DRAFT|ACTIVE contract term under closed-interval semantics (start == existing end IS overlap)" }
  - { id: ERR_DOMAIN_TARGET_MISSING, http: 422, condition: "Activation blocked: a domain has no PerformanceTarget" }
  - { id: ERR_TARGET_WEIGHT_TOTAL_INVALID, http: 422, condition: "Activation blocked: target weights do not sum to exactly 1.0" }
  - { id: ERR_UNVERIFIED_PREFERENCE_ENTRIES, http: 409, condition: "Seal blocked: one or more entries still PENDING preference verification" }
  - { id: ERR_SOD_NOTICE_SELF_RESOLVE, http: 403, condition: "Resolver X-User-ID equals notice issued_by_user_id" }
  - { id: ERR_NO_ACCEPTED_CORRECTIVE_PLAN, http: 409, condition: "Resolving PROBATION|REVOCATION_REVIEW notice without an ACCEPTED corrective plan" }
  - { id: ERR_PLAN_ALREADY_ACTIVE, http: 409, condition: "A SUBMITTED or ACCEPTED plan already exists for the notice" }
  - { id: ERR_CORRECTIVE_PLAN_OVERDUE, http: 422, condition: "Plan submitted after intervention corrective_due_date" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 422, condition: "Renewal create outside [term_end - 365 days, term_end - 30 days] inclusive window" }
  - { id: ERR_RENEWAL_ALREADY_OPEN, http: 409, condition: "An open (PENDING|DECIDED) renewal decision already exists for the school" }
  - { id: ERR_RENEWAL_NOT_ELIGIBLE, http: 422, condition: "RENEWED outcome with eligible_term_years == 0" }
  - { id: ERR_TERM_LENGTH_MISMATCH, http: 422, condition: "RENEWED_WITH_CONDITIONS with eligible_term_years < 3" }
  - { id: ERR_APPEAL_WINDOW_OPEN, http: 409, condition: "Finalize attempted while clock <= decided_at + 30 days or an appeal is open on the decision" }
  - { id: ERR_NO_REVOCATION_REVIEW_NOTICE, http: 409, condition: "REVOCATION closure requires an open REVOCATION_REVIEW intervention notice" }
  - { id: ERR_CLOSURE_ALREADY_EXISTS, http: 409, condition: "An open (INITIATED|TRANSITION_IN_PROGRESS|RECORDS_COMPLETE) closure plan already exists for the school" }
  - { id: ERR_STUDENTS_NOT_TRANSITIONED, http: 409, condition: "Advance to RECORDS_COMPLETE blocked: students still PENDING|PLACED" }
  - { id: ERR_TARGET_NOT_APPEALABLE, http: 409, condition: "Appeal target missing, wrong type, or not in an appealable state (application DENIED; decision DECIDED; contract REVOKED; invoice FINALIZED|DISPUTED)" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "filed_at later than target decided_at + 30 days (inclusive window)" }
  - { id: ERR_APPEAL_ALREADY_OPEN, http: 409, condition: "An open (FILED|HEARING_SCHEDULED) appeal already exists for the target" }
  - { id: ERR_SOD_APPEAL_DECIDER_CONFLICT, http: 403, condition: "Hearing officer equals the original decider of the contested target" }
  - { id: ERR_APPEAL_OFFICER_MISMATCH, http: 403, condition: "Ruling officer is not the assigned hearing_officer_user_id" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Founding group representative submitting charter applications and application-denial appeals"
    identity: opaque
    exclusive_operations:
      - "POST /authorizer/applications"
    shared_operations:
      - "POST /authorizer/appeals (APPLICATION_DENIAL only, school_id null)"
      - "GET endpoints"
  - name: AuthorizerStaff
    description: "Authorizer case-management staff: intake, interviews, contracts, monitoring, lotteries, interventions, plans review, renewal admin, closure admin, invoicing, hearing scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /authorizer/applications/{id}/accept-intake"
      - "POST /authorizer/applications/{id}/interviews"
      - "POST /authorizer/applications/{id}/advance-to-board"
      - "POST /authorizer/schools/{id}/contracts, /monitoring-reports, /lotteries, /interventions, /renewal-decisions, /fee-invoices"
      - "POST /authorizer/contracts/{id}/targets, /activate"
      - "POST /authorizer/monitoring-reports/{id}/submit, /accept, /return"
      - "POST /authorizer/lotteries/{id}/open, /seal, /execute, /certify"
      - "POST /authorizer/lottery-entries/{id}/verify-preference"
      - "POST /authorizer/interventions/{id}/issue, /resolve"
      - "POST /authorizer/corrective-plans/{id}/review"
      - "POST /authorizer/renewal-decisions/{id}/finalize"
      - "POST /authorizer/closure-plans/{id}/student-transitions, /advance"
      - "POST /authorizer/student-transitions/{id}/place, /records-sent"
      - "POST /authorizer/fee-invoices/{id}/finalize"
      - "POST /authorizer/appeals/{id}/schedule-hearing"
    shared_operations:
      - "GET endpoints"
  - name: ApplicationReviewer
    description: "Application scoring reviewer and capacity-interview panelist; SOD-separated per application"
    identity: opaque
    exclusive_operations:
      - "POST /authorizer/applications/{id}/scores"
      - "POST /authorizer/interviews/{id}/score (panelists only)"
    shared_operations:
      - "GET endpoints"
  - name: BoardMember
    description: "Authorizer board: application and renewal decisions, intervention escalation, closure initiation, fee waivers"
    identity: opaque
    exclusive_operations:
      - "POST /authorizer/applications/{id}/decide"
      - "POST /authorizer/renewal-decisions/{id}/decide"
      - "POST /authorizer/interventions/{id}/escalate"
      - "POST /authorizer/schools/{id}/closure-plans"
      - "POST /authorizer/fee-invoices/{id}/waive"
    shared_operations:
      - "GET endpoints"
  - name: AppealsOfficer
    description: "Independent hearing officer ruling on appeals; must not be the original decider"
    identity: opaque
    exclusive_operations:
      - "POST /authorizer/appeals/{id}/rule (assigned officer only)"
    shared_operations:
      - "GET endpoints"
  - name: SchoolOperator
    description: "Charter school operator acting for its own school: lottery entries, declines, corrective plans, invoice payment, appeals"
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /authorizer/lotteries/{id}/entries"
      - "POST /authorizer/lottery-entries/{id}/decline"
      - "POST /authorizer/interventions/{id}/corrective-plans"
      - "POST /authorizer/corrective-plans/{id}/resubmit"
      - "POST /authorizer/fee-invoices/{id}/pay"
    shared_operations:
      - "POST /authorizer/appeals (own school)"
      - "GET endpoints"
  - name: AuthorizerAdmin
    description: "Platform administrator for the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /authorizer/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
