              as: TerminalOperator
          trigger:
            - call: "POST /ocean-billing/containers/${cntr_m}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
              captures: { err_held: $.data.error_id }
            - call: "POST /ocean-billing/containers/${cntr_m2}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
              captures: { m2_status: $.data.status }
          assert:
            - "err_held == ERR_CONTAINER_HELD (active hold blocks gate-out)"
            - "m2_status == GATE_OUT (released hold does not block)"
            - "Container.${cntr_m}.status == AVAILABLE still"

      - name: return_empty_blocked_by_return_location_status
        grounds:
          - state_machines.Container.GATE_OUT_to_EMPTY_RETURNED
          - entities.EquipmentReturnLocation.fields.status
          - errors[ERR_RETURN_LOCATION_CLOSED]
        distinguishing_aspect: |
          Entity pair Container x EquipmentReturnLocation (different pair than
          Container x Container-holds): GATE_OUT -> EMPTY_RETURNED is legal
          only while the assigned return location is not CLOSED — flipping the
          location CLOSED after assignment blocks the return until reassignment.
        test_recipe:
          setup:
            - "CNTR-N GATE_OUT with assigned_return_location LOC-1; LOC-1 then set CLOSED; LOC-2 exists OPEN accepting DRY40"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-N", legal_name: "Nori Supply" }
              as: ContractManager
              captures: { acct_n: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_n}/service-contracts"
              payload: { contract_ref: "CTR-N", demurrage_free_days: 2, detention_free_days: 5, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_n: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_n}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
              as: TerminalOperator
              captures: { term_oak: $.data.id }
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
              captures: { loc_1: $.data.id }
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-2", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 5 }
              as: EquipmentController
              captures: { loc_2: $.data.id }
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000177", equipment_type: "DRY40", customer_account_id: "${acct_n}", service_contract_id: "${ctr_n}", terminal_id: "${term_oak}", discharge_ts: "2026-09-08T12:00:00Z", available_ts: "2026-09-09T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_n: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_n}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_n}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
              captures: { n_assigned: $.data.assigned_return_location_id }
            - call: "POST /ocean-billing/return-locations/${loc_1}/set-status"
              payload: { status: "CLOSED" }
              as: EquipmentController
          trigger:
            - call: "POST /ocean-billing/containers/${cntr_n}/return-empty"
              payload: {}
              as: EquipmentController
              captures: { err_closed: $.data.error_id }
            - call: "POST /ocean-billing/containers/${cntr_n}/reassign-return-location"
              payload: { assigned_return_location_id: "${loc_2}" }
              as: EquipmentController
            - call: "POST /ocean-billing/containers/${cntr_n}/return-empty"
              payload: {}
              as: EquipmentController
              captures: { n_final: $.data.status }
          assert:
            - "n_assigned == ${loc_1} (selector picked the higher-capacity LOC-1 at gate-out)"
            - "err_closed == ERR_RETURN_LOCATION_CLOSED (CLOSED location blocks the return)"
            - "After reassignment to LOC-2, n_final == EMPTY_RETURNED"
  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_slot_capacity_exhaustion_per_day
        grounds:
          - state_machines.TerminalAppointmentSlot.OPEN_to_FULL
          - entities.TerminalAppointmentSlot.fields.capacity
          - errors[ERR_CAPACITY_OR_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: AGGREGATE CAPACITY over a calendar-day resource
          (not pairwise interval intersection) — a slot with capacity 2 admits
          exactly 2 bookings on 2026-09-10; the third booking on the same day
          is rejected even though bookings carry no time-of-day interval.
        test_recipe:
          setup:
            - "Terminal OAK; SLOT-C on 2026-09-10 capacity 2; three AVAILABLE containers CNTR-C1/C2/C3"
          setup_api_calls:
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
              as: TerminalOperator
              captures: { term_oak: $.data.id }
            - call: "POST /ocean-billing/terminals/${term_oak}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/terminals/${term_oak}/appointment-slots"
              payload: { slot_date: "2026-09-10T00:00:00Z", slot_seq: 1, capacity: 2 }
              as: TerminalOperator
              captures: { slot_c: $.data.id }
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-O", legal_name: "Olive Trading" }
              as: ContractManager
              captures: { acct_o: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_o}/service-contracts"
              payload: { contract_ref: "CTR-O", demurrage_free_days: 2, detention_free_days: 5, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_o: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_o}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000185", equipment_type: "DRY40", customer_account_id: "${acct_o}", service_contract_id: "${ctr_o}", terminal_id: "${term_oak}", discharge_ts: "2026-09-08T12:00:00Z", available_ts: "2026-09-09T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_c1: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_c1}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000193", equipment_type: "DRY40", customer_account_id: "${acct_o}", service_contract_id: "${ctr_o}", terminal_id: "${term_oak}", discharge_ts: "2026-09-08T12:00:00Z", available_ts: "2026-09-09T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_c2: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_c2}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000201", equipment_type: "DRY40", customer_account_id: "${acct_o}", service_contract_id: "${ctr_o}", terminal_id: "${term_oak}", discharge_ts: "2026-09-08T12:00:00Z", available_ts: "2026-09-09T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_c3: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_c3}/mark-available"
              payload: {}
              as: TerminalOperator
          trigger:
            - call: "POST /ocean-billing/containers/${cntr_c1}/appointments"
              payload: { slot_id: "${slot_c}" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_c2}/appointments"
              payload: { slot_id: "${slot_c}" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_c3}/appointments"
              payload: { slot_id: "${slot_c}" }
              as: TerminalOperator
              captures: { err_cap: $.data.error_id }
            - call: "GET /ocean-billing/terminal-appointment-slots/${slot_c}"
              payload: {}
              as: TerminalOperator
              captures: { slot_c_status: $.data.status, slot_c_count: $.data.booked_count }
          assert:
            - "Two bookings succeed; third rejected err_cap == ERR_CAPACITY_OR_CONFLICT"
            - "slot_c_status == FULL and slot_c_count == 2 (FULL at booked_count == capacity, boundary inclusive)"

      - name: contract_effective_window_overlap_blocks_double_coverage
        grounds:
          - entities.ServiceContract.fields.effective_from
          - entities.ServiceContract.fields.effective_to
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN-ADJACENCY date-range validity on the
          ServiceContract resource (different resource and different semantics
          than slot capacity) — a contract whose effective_to precedes its
          effective_from is rejected at creation (inverted interval), while an
          inverted-but-equal window [d, d] is a legal single-day contract.
        test_recipe:
          setup:
            - "ACCT-P ACTIVE"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-P", legal_name: "Palm Exports" }
              as: ContractManager
              captures: { acct_p: $.data.id }
          trigger:
            - call: "POST /ocean-billing/customer-accounts/${acct_p}/service-contracts"
              payload: { contract_ref: "CTR-P-BAD", demurrage_free_days: 2, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ContractManager
              captures: { err_inv: $.data.error_id }
            - call: "POST /ocean-billing/customer-accounts/${acct_p}/service-contracts"
              payload: { contract_ref: "CTR-P-1DAY", demurrage_free_days: 2, detention_free_days: 5, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ContractManager
              captures: { ctr_1day: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_1day}/activate"
              payload: {}
              as: ContractManager
              captures: { ctr_1day_status: $.data.status }
          assert:
            - "err_inv == ERR_INVALID_REQUEST (effective_to < effective_from is an inverted interval)"
            - "ctr_1day created and ctr_1day_status == ACTIVE (equal endpoints = legal single-day window; current clock 2026-09-01 inside [09-01, 09-01])"
  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_apply_reverse_preserves_invoice_net
        grounds:
          - state_machines.CreditWaiver.APPLIED_to_REVERSED
          - calculations.credit_waterfall
          - entities.Invoice.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity: invoice NET POSITION — for any invoice,
          gross_amount_cents - credit_total_cents - paid_total_cents ==
          balance_due_cents MUST hold before and after a waiver apply+reverse
          pair; the reverse restores balance_due_cents to its pre-apply value
          exactly (no drift), and account outstanding mirrors it.
        test_recipe:
          setup:
            - "INV-Q for ACCT-Q with gross 159000, no payments; balance_due_cents == 159000; account outstanding 159000"
          setup_api_calls:
            - call: "POST /ocean-billing/customer-accounts"
              payload: { account_code: "ACCT-Q", legal_name: "Quince Retail" }
              as: ContractManager
              captures: { acct_q: $.data.id }
            - call: "POST /ocean-billing/customer-accounts/${acct_q}/service-contracts"
              payload: { contract_ref: "CTR-Q", demurrage_free_days: 4, detention_free_days: 5, saturday_counts_as_free_day: false, demurrage_rate_schedule: "STANDARD", detention_rate_schedule: "STANDARD", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: ContractManager
              captures: { ctr_q: $.data.id }
            - call: "POST /ocean-billing/service-contracts/${ctr_q}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
              as: TerminalOperator
              captures: { term_oak: $.data.id }
            - call: "POST /ocean-billing/terminals/${term_oak}/holidays"
              payload: { holiday_date: "2026-09-07T00:00:00Z", name: "Labor Day" }
              as: TerminalOperator
            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000219", equipment_type: "DRY40", customer_account_id: "${acct_q}", service_contract_id: "${ctr_q}", terminal_id: "${term_oak}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_q: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_q}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_q}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_q}/return-empty"
              payload: {}
              as: EquipmentController
            - call: "POST /ocean-billing/containers/${cntr_q}/issue-invoice"
              payload: {}
              as: BillingAgent
              captures: { inv_q: $.data.id }
            - call: "POST /ocean-billing/invoices/${inv_q}/credit-waivers"
              payload: { amount_cents: 40000, justification: "goodwill, then reconsidered" }
              as: CreditDirector
              captures: { wv_q: $.data.id }
            - call: "GET /ocean-billing/invoices/${inv_q}"
              payload: {}
              as: CreditDirector
              captures: { inv_q_mid: $.data.balance_due_cents, acct_mid_ob: $.data.balance_due_cents }
            - call: "GET /ocean-billing/customer-accounts/${acct_q}"
              payload: {}
              as: CreditDirector
              captures: { acct_q_mid: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /ocean-billing/credit-waivers/${wv_q}/reverse"
              payload: { justification: "reversal per audit finding" }
              as: CreditDirector
            - call: "GET /ocean-billing/invoices/${inv_q}"
              payload: {}
              as: CreditDirector
              captures: { inv_q_end: $.data.balance_due_cents, inv_q_credit_end: $.data.credit_total_cents, inv_q_gross: $.data.gross_amount_cents, inv_q_paid: $.data.paid_total_cents }
            - call: "GET /ocean-billing/customer-accounts/${acct_q}"
              payload: {}
              as: CreditDirector
              captures: { acct_q_end: $.data.outstanding_balance_cents }
          assert:
            - "inv_q_mid == 119000 (159000 - 40000 applied)"
            - "acct_q_mid == 119000"
            - "inv_q_end == 159000 and inv_q_credit_end == 0 (apply+reverse is a perfect compensating pair)"
            - "Invariant: inv_q_gross (159000) - inv_q_credit_end (0) - inv_q_paid (0) == inv_q_end (159000)"
            - "acct_q_end == 159000 (account outstanding restored — no drift)"

      - name: slot_booked_count_conserved_under_book_and_cancel
        grounds:
          - state_machines.TerminalAppointmentSlot.OPEN_to_FULL
          - state_machines.TerminalAppointmentSlot.FULL_to_OPEN
          - entities.TerminalAppointmentSlot.fields.booked_count
        distinguishing_aspect: |
          Conserved quantity: slot OCCUPANCY — booked_count == (number of
          live bookings) at all times; a book (+1) paired with its cancel (-1)
          returns the counter to exactly its pre-book value and oscillates the
          derived state FULL back to OPEN (different conserved quantity than
          invoice money in the sibling instance).
        test_recipe:
          setup:
            - "Terminal OAK; SLOT-R on 2026-09-11 capacity 1; CNTR-R AVAILABLE"
          setup_api_calls:
            - call: "POST /ocean-billing/terminals"
              payload: { terminal_code: "OAK", timezone: "Pacific/Honolulu", daily_appointment_capacity: 5, gate_closed_weekends: true }
