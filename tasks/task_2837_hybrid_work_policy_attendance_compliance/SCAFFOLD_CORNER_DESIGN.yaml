          assert:
            - "HTTP 201 - the surplus keys are ignored, not rejected"
            - "data.id != '00000000-0000-4000-8000-0000000000ff' and data.version == 1, not 47"
            - "data.status == 'ACTIVE', not 'SEPARATED': status is system-owned and only POST /employees/{employee_id}/status can move it"
            - "data.current_eligibility_class == 'ONSITE_REQUIRED', not 'FULLY_REMOTE', and non_compliance_pressure == 0.00, not 9.99"
            - "GET /employees/${e1_id} returns the same server-owned values, so nothing was persisted from the surplus keys"

