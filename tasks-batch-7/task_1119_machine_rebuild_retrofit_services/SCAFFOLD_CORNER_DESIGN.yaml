  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_assessment_create_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[assessment-create-stale-machine]", "errors[ERR_STALE_MACHINE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer: a second assessment create carrying the pre-first-create machine version fails 412; with the fresh version it succeeds and supersedes the first assessment."
        test_recipe:
          setup: ["machine registered (version observed at creation); first assessment already created against that version"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-250", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "first", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 12, spindle_runout_microns: 9, backlash_microns: 7, scope_notes: "stale retry", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/machines/${m}", payload: {}, as: ProjectManager, captures: { m_v2: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 12, spindle_runout_microns: 9, backlash_microns: 7, scope_notes: "fresh retry", expected_machine_version: "${m_v2}" }, as: Assessor, as_user_id: "assessor-1", captures: { a2: $.data.id } }
            - { call: "GET /api/assessments/${a1}", payload: {}, as: ProjectManager, captures: { a1_status: $.data.status } }
          assert:
            - "second create with the stale observed version rejected with ERR_STALE_MACHINE_VERSION (412)"
            - "machine version advanced after the first create (captured fresh version != ${m_v})"
            - "retry with the fresh version succeeds (201) and supersedes: assessment ${a1} status == SUPERSEDED, ${a2} status == DRAFT"

      - name: occ_trade_in_offer_create_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[trade-in-offer-create-stale-machine]", "errors[ERR_STALE_MACHINE_VERSION]"]
        distinguishing_aspect: "Same OCC rule on a different write endpoint: offer creation with a stale machine version fails 412; a fresh create succeeds and supersedes the prior OFFERED offer."
        test_recipe:
          setup: ["machine registered; first offer created against the creation version"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-251", machine_type: "GRINDER", year_of_manufacture: 2011, control_generation: "LEGACY", spindle_hours: 85000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/trade-in-offers", payload: { valuation_variant: "MARKET_COMPARABLE", expected_machine_version: "${m_v}" }, as: ProjectManager, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /api/machines/${m}/trade-in-offers", payload: { valuation_variant: "COST_APPROACH", expected_machine_version: "${m_v}" }, as: ProjectManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/machines/${m}", payload: {}, as: ProjectManager, captures: { m_v2: $.data.version } }
            - { call: "POST /api/machines/${m}/trade-in-offers", payload: { valuation_variant: "COST_APPROACH", expected_machine_version: "${m_v2}" }, as: ProjectManager, captures: { o2: $.data.id } }
            - { call: "GET /api/trade-in-offers/${o1}", payload: {}, as: ProjectManager, captures: { o1_status: $.data.status } }
          assert:
            - "stale-version offer create rejected with ERR_STALE_MACHINE_VERSION (412)"
            - "fresh-version create succeeds; offer ${o1} status == SUPERSEDED, offer ${o2} status == OFFERED"

      - name: occ_quote_recompute_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[quote-create-stale-project]", "errors[ERR_STALE_PROJECT_VERSION]"]
        distinguishing_aspect: "OCC on RebuildProject.version: a quote recompute carrying the pre-first-compute project version fails 412; each successful compute advances the version."
        test_recipe:
          setup: ["project DECIDED with one part line; project version observed before the first quote computation"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 500000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-252", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-252", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 1 }, as: ProjectManager }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager, captures: { q_rev: $.data.quote_revision } }
          trigger:
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager, captures: { err: $.data.error_id } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v2: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v2}" }, as: ProjectManager, captures: { q_rev2: $.data.quote_revision } }
          assert:
            - "first compute succeeds: quote_revision == 1"
            - "recompute with the stale version rejected with ERR_STALE_PROJECT_VERSION (412)"
            - "recompute with the fresh version succeeds: quote_revision == 2"

