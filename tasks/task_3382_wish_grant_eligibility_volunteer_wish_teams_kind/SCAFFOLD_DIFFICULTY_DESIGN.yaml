  - rule_id: compensating_invariant
    instances:
      - name: donation_quantity_reserve_release_conservation
        grounds:
          - entities.DonationOffer.fields.quantity_reserved
          - state_machines.PlanLineItem.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: per-offer unit pool. Invariant
          quantity_reserved + quantity_available == quantity_total holds after the
          reserve (3/7/10) and is restored exactly (0/10/10) after the compensating
          release via plan abort. The sibling instance conserves chapter committed
          cents, a different quantity.
        test_recipe:
          setup:
            - "RECEIVE_ITEM wish PLANNING, DRAFT plan; retailer offer quantity_total 10."
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
