              captures: { fc_read_e12: "$.data[0].id" }
            - call: "GET /portfolio-forecasts/${fc_el_e12}"
              payload: {}
              as: PortfolioController
          assert:
            - "both POSTs return HTTP 201"
            - "PortfolioForecast.${fc_el_e12}.merchant_count == 0"
            - "PortfolioForecast.${fc_el_e12}.unpaid_exposure_cents == 0"
            - "PortfolioForecast.${fc_el_e12}.gross_expected_loss_cents == 0"
            - "PortfolioForecast.${fc_el_e12}.net_expected_loss_cents == 0"
            - "PortfolioForecast.${fc_el_e12}.total_reserve_held_cents == 0"
            - "PortfolioForecast.${fc_el_e12}.coverage_gap_cents == 0"
            - "PortfolioForecast.${fc_el_e12}.required_additional_reserve_cents == 0"
            - "PortfolioForecast.${fc_el_e12}.reserve_adequacy_ratio_bps == 0"
            - "PortfolioForecast.${fc_el_e12}.projected_adequacy_ratio_bps == 0"
            - "PortfolioForecast.${fc_el_e12}.generated_by_user_id == user-treasury-01"
            - "PortfolioForecast.${fc_st_e12}.stress_multiplier_bps == 30000 and gross_expected_loss_cents == 0"
            - "the unfiltered list returns meta.total_count == 2 and ?method=STRESSED returns meta.total_count == 1 with ${fc_read_e12} == ${fc_st_e12}"
