  - section: endpoints
    instances:
      - name: handler_registration_round_trips_through_the_read_endpoint
        claim_type: standard_crud
        grounds:
          - entities.Handler.fields.handler_name
          - entities.Handler.fields.member_number
          - entities.Handler.fields.region_code
          - entities.Handler.fields.status
          - endpoints[POST /dog-shows/handlers]
          - endpoints[GET /dog-shows/handlers/{id}]
        distinguishing_aspect: "The write path and the read path have to agree on the whole row, including the fields the caller never sent: status defaults to ACTIVE, suspension_reason stays null and the row opens at version 1 with created_at pinned to the logical clock."
        test_recipe:
          setup:
            - "The logical clock has been set to 2026-08-10T09:00:00Z."
            - "No handler with member_number M-1002 exists yet."
            - "The registration is filed by a SanctionOfficer and omits both optional fields."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
          trigger:
            - call: "POST /dog-shows/handlers"
              payload: { handler_name: "Bo Trent", member_number: "M-1002", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { h2_id: $.data.id }
            - call: "GET /dog-shows/handlers/${h2_id}"
              payload: {}
              as: ShowSecretary
          assert:
            - "First call: HTTP 201 and Handler.handler_name == Bo Trent"
            - "First call: Handler.status == ACTIVE and Handler.suspension_reason == null"
            - "First call: Handler.version == 1 and Handler.created_at == 2026-08-10T09:00:00.000Z (ISO 8601 with three fractional digits)"
            - "Second call: HTTP 200 and every field of the read row equals the created row - member_number M-1002, region_code NE, status ACTIVE, version 1"
            - "Second call: Handler.id == ${h2_id}"
      - name: open_day_moves_the_approved_show_into_progress_and_bumps_its_version
        claim_type: action_endpoint
        grounds:
          - state_machines.Show.APPROVED_to_IN_PROGRESS
          - entities.Show.fields.status
          - endpoints[POST /dog-shows/shows/{id}/open-day]
          - endpoints[GET /dog-shows/shows/{id}]
        distinguishing_aspect: "The action carries no body at all: the whole transition is driven by the path id, and its compound precondition (at least one class, every class past OPEN) is satisfied here by the single CLOSED class, so the only observable effects are the status move and the version bump."
