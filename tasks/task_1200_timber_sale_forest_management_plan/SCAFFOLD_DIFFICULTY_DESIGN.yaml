scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cruise_volume_provisional_vs_certified
        grounds: [calculations.cruise_volume_estimate, entities.InventoryCruise.fields.provisional_volume_bf, entities.InventoryCruise.fields.certified_volume_bf]
        distinguishing_aspect: "Inventory-domain dual variant: identical tally rows yield provisional_volume_bf 306250 (all plots, no deduction) vs certified_volume_bf 300125 (reconciled plots, 2.00% sampling-error deduction) — two valid algorithms, different results, on the cruise entity domain."
        test_recipe:
          setup: ["Stand of 50 acres with one TALLIED cruise of 6 plots (0.2 ac each), PINE bf per plot [1165,1285,1165,1285,1165,1285]; reconcile with all 6 plots"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 }, { plot_number: 2, species: "PINE", volume_bf: 1285 }, { plot_number: 3, species: "PINE", volume_bf: 1165 }, { plot_number: 4, species: "PINE", volume_bf: 1285 }, { plot_number: 5, species: "PINE", volume_bf: 1165 }, { plot_number: 6, species: "PINE", volume_bf: 1285 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
            - { call: "POST /forestry/cruises/${cr_id}/finalize-tally", payload: {}, as: Forester, as_user_id: "${f_id}" }
          trigger:
            - { call: "POST /forestry/cruises/${cr_id}/reconcile", payload: { reconciled_plot_numbers: [1, 2, 3, 4, 5, 6] }, as: Forester, as_user_id: "${f_id}" }
          assert:
            - "InventoryCruise.${cr_id}.provisional_volume_bf == 306250"
            - "InventoryCruise.${cr_id}.certified_volume_bf == 300125"
            - "InventoryCruise.${cr_id}.sampling_error_pct == 2.00"
            - "InventoryCruise.${cr_id}.certified_volume_bf < InventoryCruise.${cr_id}.provisional_volume_bf"
            - "InventoryCruise.${cr_id}.certified_volume_by_species == [{species: PINE, volume_bf: 300125}]"

      - name: doyle_vs_international_governing_volume
        grounds: [calculations.log_scale_board_feet, entities.ScaleTicket.fields.bf_doyle, entities.ScaleTicket.fields.bf_international, entities.ScaleTicket.fields.bf_governing]
        distinguishing_aspect: "Scaling-domain dual variant (distinct from cruise): the same log dimensions (D=14in, L=16ft, 10 logs) yield bf_doyle 1000 vs bf_international 1230 on one ticket, and a DOYLE-governed contract bills bf_governing 1000 while an INTERNATIONAL_14-governed contract would bill 1230."
        test_recipe:
          setup: ["PER_UNIT sale with scaling_rule DOYLE awarded and contract in HARVESTING; certified PINE volume 300125 bf"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
            - { call: "POST /forestry/buyers", payload: { company_name: "Blue Mill", license_no: "B-100" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /forestry/contractors", payload: { company_name: "CutCo", license_no: "C-100" }, as: PlatformAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /forestry/tracts", payload: { name: "Tract A", county: "Covington", total_acres: 100, landowner_id: "${lo_id}", forester_id: "${f_id}" }, as: Forester, as_user_id: "${f_id}", captures: { tr_id: "$.data.id" } }
            - { call: "POST /forestry/stands", payload: { tract_id: "${tr_id}", name: "Stand 1", acres: 50, primary_species: "PINE" }, as: Forester, as_user_id: "${f_id}", captures: { st_id: "$.data.id", st_v: "$.data.version" } }
            - { call: "POST /forestry/cruises", payload: { stand_id: "${st_id}", cruise_date: "2026-03-01", plots: [ { plot_number: 1, species: "PINE", volume_bf: 1165 }, { plot_number: 2, species: "PINE", volume_bf: 1285 }, { plot_number: 3, species: "PINE", volume_bf: 1165 }, { plot_number: 4, species: "PINE", volume_bf: 1285 }, { plot_number: 5, species: "PINE", volume_bf: 1165 }, { plot_number: 6, species: "PINE", volume_bf: 1285 } ] }, as: Forester, as_user_id: "${f_id}", captures: { cr_id: "$.data.id" } }
            - { call: "POST /forestry/cruises/${cr_id}/finalize-tally", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cr_id}/reconcile", payload: { reconciled_plot_numbers: [1, 2, 3, 4, 5, 6] }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/cruises/${cr_id}/certify", payload: { expected_stand_version: "${st_v}" }, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/prescriptions", payload: { stand_id: "${st_id}", cruise_id: "${cr_id}", silvicultural_method: "CLEARCUT", window_start: "2026-06-01", window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}", captures: { pr_id: "$.data.id" } }
            - { call: "POST /forestry/prescriptions/${pr_id}/propose", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/prescriptions/${pr_id}/approve", payload: {}, as: Landowner, as_user_id: "${lo_id}" }
            - { call: "POST /forestry/sales", payload: { tract_id: "${tr_id}", stand_id: "${st_id}", prescription_id: "${pr_id}", sale_type: "PER_UNIT", scaling_rule: "DOYLE", advertised_minimum_cents: 10000000, species_minimum_rates: [ { species: "PINE", min_rate_cents_per_mbf: 40000 } ], bid_open_at: "2026-05-10T00:00:00Z", bid_close_at: "2026-05-20T00:00:00Z", harvest_window_start: "2026-06-01", harvest_window_end: "2026-10-01" }, as: Forester, as_user_id: "${f_id}", captures: { sa_id: "$.data.id" } }
            - { call: "POST /forestry/sales/${sa_id}/offer", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/sales/${sa_id}/open-bidding", payload: {}, as: Forester, as_user_id: "${f_id}", captures: { sa_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /forestry/sales/${sa_id}/bids", payload: { expected_sale_version: "${sa_v}", deposit_cents: 100000, species_rates: [ { species: "PINE", rate_cents_per_mbf: 45000 } ] }, as: Buyer, as_user_id: "${b_id}", captures: { bid_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /forestry/sales/${sa_id}/close-bidding", payload: {}, as: Forester, as_user_id: "${f_id}" }
            - { call: "POST /forestry/sales/${sa_id}/award", payload: { bid_id: "${bid_id}" }, as: Forester, as_user_id: "${f_id}" }
            - { call: "GET /forestry/contracts", payload: {}, as: Forester, as_user_id: "${f_id}", captures: { ct_id: "$.data[0].id" } }
            - { call: "POST /forestry/contracts/${ct_id}/assign-contractor", payload: { contractor_id: "${c_id}" }, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /forestry/contracts/${ct_id}/bond", payload: { amount_cents: 945394 }, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /forestry/contracts/${ct_id}/start-harvest", payload: {}, as: Contractor, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /forestry/scale-tickets", payload: { contract_id: "${ct_id}", scaled_date: "2026-06-20", species: "PINE", small_end_diameter_in: 14, length_ft: 16, log_count: 10 }, as: Contractor, as_user_id: "${c_id}", captures: { tk_id: "$.data.id" } }
          assert:
            - "ScaleTicket.${tk_id}.bf_doyle == 1000"
            - "ScaleTicket.${tk_id}.bf_international == 1230"
            - "ScaleTicket.${tk_id}.bf_governing == 1000"
            - "ScaleTicket.${tk_id}.bf_doyle != ScaleTicket.${tk_id}.bf_international"

      - name: lump_sum_vs_per_unit_settlement_divergence
        grounds: [calculations.settlement_amounts, entities.Settlement.fields.kind, entities.Settlement.fields.gross_cents]
        distinguishing_aspect: "Payment-domain dual variant (distinct from cruise and scaling): a LUMP_SUM contract pays a fixed milestone gross of 3600000 on 40% of a 9000001-cent award regardless of delivered volume, while a PER_UNIT contract's settlement gross 112500 is derived entirely from verified scaled volume times bid rates."
        test_recipe:
          setup: ["Two awarded contracts: LUMP_SUM award 9000001 cents with contract HARVESTING; PER_UNIT contract HARVESTING with three VERIFIED tickets of 1000/1000/500 bf at 45000 cents/MBF"]
