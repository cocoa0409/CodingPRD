# =============================================================================
# SCAFFOLD — Egg Layer Operation & Grading Plant (Cal-Maine style layer farm)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in sibling
# files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Egg Layer Operation & Grading Plant (Cal-Maine style layer farm): flock
  placement & age/lay-curve tracking, feed conversion & production cost per
  dozen, grading/candling & size distribution, cage-free/pasture claim & audit
  compliance, egg pricing formula & retailer contract, salmonella testing &
  environmental sampling, spent-hen disposition & flock turnover, pack
  date/shelf-life & recall traceability.

domain_name: egg-layer-grading-plant
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - optimistic_concurrency
  entity_topology: flat            # peer entities joined by FK references; no URL nesting
  state_machine_shape: cyclic      # dominant distinctive shape (Flock molt loop); EggLot additionally carries parallel dimensions
  relationship_patterns:
    - one_to_many
    - self_referential             # Flock.prior_flock_id -> Flock.id (flock turnover in a House)
    - cross_aggregate              # EggLot -> RetailerContract / Recall; Recall -> SalmonellaTest
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# All entities are top-level (flat topology). Dates are ISO 8601 dates
# (YYYY-MM-DD) interpreted against the server's logical clock (see
# POST /_clock/set_current_utc; startup default 2026-08-01T00:00:00Z).
# =============================================================================
entities:
  - name: Farm
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Farm display name" }
      - { name: certification_program, type: enum, source: input, description: "CONVENTIONAL | CAGE_FREE | PASTURE — drives shelf-life days and lot claim_program" }
      - { name: daily_overhead_cents, type: integer, source: input, description: "Fixed daily overhead allocated into cost-per-dozen (>= 0)" }
      - { name: compliance_posture, type: enum, source: computed, description: "CLEAR | WATCH | SUSPENDED — derived by compliance_posture_derivation; SUSPENDED gates lot release and contract reinstate" }
      - { name: active_flock_count, type: integer, source: computed, description: "Count of flocks (via Houses of this farm) with status != DEPLETED" }

  - name: House
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: input, description: "FK -> Farm.id" }
      - { name: house_code, type: string, source: input, description: "Operator house code; unique within farm" }
      - { name: environment_type, type: enum, source: input, description: "CAGED | AVIARY | PASTURE_RANGE" }
      - { name: capacity_hens, type: integer, source: input, description: "Maximum hens (> 0); placement validates initial_hen_count <= capacity_hens" }
      - { name: status, type: enum, source: system, description: "EMPTY | OCCUPIED | DEPOPULATING | CLEANING | RESTING — cyclic, advanced by placement/depopulation/flock-depletion and the daily ops run" }
      - { name: status_changed_date, type: datetime, source: system, description: "Date (logical clock) of last status change; drives CLEANING->RESTING (7 days) and RESTING->EMPTY (14 days)" }
      - { name: current_flock_id, type: string, source: system, description: "Nullable. Flock currently occupying the house (set on placement, cleared when flock reaches DEPLETED)" }

  - name: Flock
    parent: null
    common_fields: true
    fields:
      - { name: house_id, type: string, source: input, description: "FK -> House.id; house must be EMPTY at placement" }
      - { name: breed_code, type: string, source: input, description: "Breed label (free-form, e.g. HYLINE_BROWN)" }
      - { name: breed_peak_rate_pct, type: number, source: input, description: "Breed peak lay rate percent (e.g. 95.0); feeds lay_curve_projection" }
      - { name: placement_date, type: datetime, source: input, description: "Date pullets placed; must be <= current clock date" }
      - { name: initial_hen_count, type: integer, source: input, description: "Hens placed (> 0, <= house capacity_hens)" }
      - { name: pullet_cost_cents, type: integer, source: input, description: "Acquisition cost of the flock, amortized over 420 days into cost-per-dozen (>= 0)" }
      - { name: prior_flock_id, type: string, source: system, description: "Nullable. FK -> Flock.id; self-referential link set at placement to the house's most recently DEPLETED flock (selector: status == DEPLETED, max depleted_date, tie-break created_at ASC); null for the house's first flock" }
      - { name: depleted_date, type: datetime, source: system, description: "Nullable. Date the flock reached DEPLETED" }
      - { name: lay_cycle, type: enum, source: system, description: "FIRST | SECOND — SECOND after a completed molt" }
      - { name: molt_count, type: integer, source: system, default: 0, description: "Completed molts; hard cap MAX_MOLTS = 1" }
      - { name: molt_started_date, type: datetime, source: system, description: "Nullable. Date induce-molt fired" }
      - { name: status, type: enum, source: system, description: "PLACED | GROWING | LAYING | MOLT_REST | DEPOPULATING | DEPLETED" }
      - { name: quarantine_status, type: enum, source: system, description: "CLEAR | QUARANTINED — parallel dimension; set by positive salmonella cascade, cleared when linked recall closes" }
      - { name: age_weeks, type: integer, source: computed, description: "floor((clock_date - placement_date) / 7)" }
      - { name: current_lay_rate_pct, type: number, source: computed, description: "lay_curve_projection(age_weeks, lay_cycle, breed_peak_rate_pct, status); 0.00 while status != LAYING" }
      - { name: current_hen_count, type: integer, source: computed, description: "initial_hen_count - cumulative_mortality - sum(hen_count of COMPLETED non-VOIDED dispositions)" }
      - { name: cumulative_mortality, type: integer, source: computed, description: "Sum of mortality_count over the flock's ProductionDays" }
      - { name: cumulative_eggs, type: integer, source: computed, description: "Sum of eggs_collected over the flock's ProductionDays" }
      - { name: ungraded_egg_pool, type: integer, source: computed, description: "Sum(eggs_collected - rejected_eggs) - sum(eggs_to_grade of CONFIRMED non-VOIDED grading runs)" }
      - { name: loose_egg_pool, type: integer, source: computed, description: "Sum of sub-dozen remainder eggs released by confirmed grading runs (per size class count mod 12)" }

  - name: FeedDelivery
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: input, description: "FK -> Farm.id" }
      - { name: delivered_at, type: datetime, source: input, description: "Delivery date; FIFO queue ordered by delivered_at ASC, created_at ASC tie-break" }
      - { name: quantity_kg, type: integer, source: input, description: "Delivered kg (> 0)" }
      - { name: cost_per_kg_cents, type: integer, source: input, description: "Unit cost cents per kg (> 0)" }
      - { name: remaining_kg, type: integer, source: computed, description: "quantity_kg minus kg consumed by ProductionDay feed issuance (FIFO)" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | DEPLETED — DEPLETED when remaining_kg == 0" }

  - name: ProductionDay
    parent: null
    common_fields: false   # immutable event log: id + created_at only; no update/delete
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; flock must be LAYING" }
      - { name: lay_date, type: datetime, source: input, description: "Production date; >= flock.placement_date and <= clock date; unique per flock (ERR_DUPLICATE_PRODUCTION_DAY)" }
      - { name: eggs_collected, type: integer, source: input, description: "Total eggs collected that day (>= 0), including rejects" }
      - { name: rejected_eggs, type: integer, source: input, description: "Cracked/dirty eggs removed at collection (>= 0, <= eggs_collected)" }
      - { name: feed_issued_kg, type: integer, source: input, description: "Feed issued to the flock that day (>= 0); consumed FIFO from the farm's FeedDelivery queue" }
      - { name: mortality_count, type: integer, source: input, description: "Dead hens removed that day (>= 0, <= flock.current_hen_count)" }
      - { name: hens_at_start, type: integer, source: computed, description: "flock.current_hen_count immediately before this record's mortality is applied" }
      - { name: feed_cost_cents, type: integer, source: computed, description: "FIFO layer cost of feed_issued_kg (chronological feed_fifo_costing)" }
      - { name: lay_rate_pct, type: number, source: computed, description: "round_half_up(eggs_collected * 100 / hens_at_start, 2); 0.00 when hens_at_start == 0" }

  - name: GradingRun
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id" }
      - { name: grade, type: enum, source: input, description: "AA | A | B — whole-run grade" }
      - { name: eggs_to_grade, type: integer, source: input, description: "Eggs drawn from flock.ungraded_egg_pool (> 0; validated against pool at create and again at confirm)" }
      - { name: peewee_count, type: integer, source: input, description: "Size-class counts supplied at submit (each >= 0)" }
      - { name: small_count, type: integer, source: input, description: "Size-class count" }
      - { name: medium_count, type: integer, source: input, description: "Size-class count" }
      - { name: large_count, type: integer, source: input, description: "Size-class count" }
      - { name: xlarge_count, type: integer, source: input, description: "Size-class count" }
      - { name: jumbo_count, type: integer, source: input, description: "Size-class count" }
      - { name: cracked_count, type: integer, source: input, description: "Undergrade count found at candling (>= 0)" }
      - { name: dirty_count, type: integer, source: input, description: "Undergrade count (>= 0)" }
      - { name: blood_spot_count, type: integer, source: input, description: "Undergrade count found at candling (>= 0)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | VOIDED" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of submitter (SoD: confirmer must differ)" }
      - { name: confirmed_by, type: string, source: system, description: "Nullable. X-User-ID of confirmer" }
      - { name: pack_date, type: datetime, source: system, description: "Nullable. Logical clock date at confirm; stamped on all created lots" }
      - { name: lot_ids, type: array, source: system, description: "EggLot ids created at confirm, in deterministic creation order JUMBO, XLARGE, LARGE, MEDIUM, SMALL, PEEWEE (only classes with dozen_count > 0)" }

  - name: EggLot
    parent: null
    common_fields: true
    fields:
      - { name: grading_run_id, type: string, source: system, description: "FK -> GradingRun.id; lots are created only by grading-run confirm" }
      - { name: flock_id, type: string, source: system, description: "FK -> Flock.id (copied from grading run)" }
      - { name: farm_id, type: string, source: system, description: "FK -> Farm.id (denormalized via flock's house for recall sweeps)" }
      - { name: contract_id, type: string, source: system, description: "Nullable. FK -> RetailerContract.id; set at allocate, cleared if allocation is released (expiry/recall cascade)" }
      - { name: recall_id, type: string, source: system, description: "Nullable. FK -> Recall.id; set when a recall scope sweep recalls this lot" }
      - { name: size_class, type: enum, source: system, description: "PEEWEE | SMALL | MEDIUM | LARGE | XLARGE | JUMBO" }
      - { name: grade, type: enum, source: system, description: "AA | A | B (from grading run)" }
      - { name: dozen_count, type: integer, source: system, description: "floor(size-class egg count / 12); remainder eggs go to flock.loose_egg_pool" }
      - { name: claim_program, type: enum, source: system, description: "CONVENTIONAL | CAGE_FREE | PASTURE — snapshot of farm.certification_program at lot creation" }
      - { name: pack_date, type: datetime, source: system, description: "From grading run confirm (logical clock date)" }
      - { name: sell_by_date, type: datetime, source: computed, description: "pack_date + SHELF_LIFE_DAYS(claim_program): CONVENTIONAL 45, CAGE_FREE 30, PASTURE 30" }
      - { name: ship_date, type: datetime, source: system, description: "Nullable. Logical clock date at ship; drives settlement line inclusion" }
      - { name: lifecycle_status, type: enum, source: system, description: "FRESH | RELEASED | ALLOCATED | SHIPPED | CLOSED | EXPIRED | RECALLED — dimension 1 of 2" }
      - { name: hold_status, type: enum, source: system, description: "CLEAR | HELD — dimension 2 of 2, independent of lifecycle_status" }

  - name: RetailerContract
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: input, description: "FK -> Farm.id" }
      - { name: retailer_name, type: string, source: input, description: "Retailer display name" }
      - { name: pricing_model, type: enum, source: input, description: "MARKET_INDEX | COST_PLUS — selects settlement_pricing variant" }
      - { name: spread_cents, type: integer, source: input, description: "Added to market index per dozen (>= 0; MARKET_INDEX only; must be 0 for COST_PLUS)" }
      - { name: margin_pct, type: number, source: input, description: "Cost-plus margin fraction (>= 0; COST_PLUS only; must be 0 for MARKET_INDEX)" }
      - { name: claim_premium_pct, type: number, source: input, description: "Extra per-dozen price multiplier when claim_required != NONE (>= 0)" }
      - { name: claim_required, type: enum, source: input, description: "NONE | CAGE_FREE | PASTURE — minimum claim a lot must satisfy to allocate" }
      - { name: effective_start, type: datetime, source: input, description: "Window start (inclusive); < effective_end" }
      - { name: effective_end, type: datetime, source: input, description: "Window end (exclusive) — half-open [start, end); same-farm windows of non-terminal contracts must not overlap (touching allowed)" }
      - { name: weekly_min_dozen, type: integer, source: input, description: "Weekly volume commitment reference (>= 0)" }
      - { name: max_open_dozen, type: integer, source: input, description: "Cap on allocated-but-unshipped dozens (> 0); allocate enforces allocated_dozen + lot <= max_open_dozen" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | EXPIRED" }
      - { name: allocated_dozen, type: integer, source: computed, description: "Sum of dozen_count of lots with lifecycle_status == ALLOCATED on this contract" }
      - { name: shipped_dozen, type: integer, source: computed, description: "Sum of dozen_count of lots SHIPPED or CLOSED on this contract" }
      - { name: held_allocated_dozen, type: integer, source: computed, description: "Sum of dozen_count of ALLOCATED lots with hold_status == HELD; > 0 auto-suspends the contract" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> RetailerContract.id" }
      - { name: period_start, type: datetime, source: input, description: "Settlement period start (inclusive); <= period_end" }
      - { name: period_end, type: datetime, source: input, description: "Settlement period end (inclusive)" }
      - { name: market_index_cents, type: integer, source: input, description: "Urner-Barry-style index per dozen for the period (>= 0; required when contract.pricing_model == MARKET_INDEX, ignored otherwise)" }
      - { name: expected_contract_version, type: integer, source: input, description: "OCC: RetailerContract.version last observed by the client (ERR_STALE_VERSION on mismatch)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | VOIDED — a new DRAFT for an overlapping period supersedes (auto-VOIDs) the prior DRAFT; DRAFTs auto-VOID when the contract suspends" }
      - { name: pricing_model_used, type: enum, source: system, description: "MARKET_INDEX | COST_PLUS — snapshot of contract.pricing_model at finalize" }
      - { name: lines, type: array, source: computed, description: "At finalize: one line per SHIPPED lot of the contract with ship date in [period_start, period_end]: { lot_id, size_class, grade, dozen_count, price_cents_per_dozen, line_amount_cents }, ordered pack_date ASC, created_at ASC" }
      - { name: cost_per_dozen_cents, type: number, source: computed, description: "COST_PLUS only: ACTUAL_FIFO cost per dozen over the settlement period, 2dp round_half_up" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_amount_cents at finalize" }
      - { name: rebate_pct, type: number, source: computed, description: "Volume rebate tier selected on PRE-rebate subtotal_cents: >= 500000 -> 0.04, >= 100000 -> 0.02, else 0" }
      - { name: rebate_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * rebate_pct) to integer cents" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - rebate_cents" }

  - name: SalmonellaTest
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id" }
      - { name: test_type, type: enum, source: input, description: "ENVIRONMENTAL | EGG_POOL" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned collection date (>= clock date at creation)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COLLECTED | RESULTED | CLEARED | RESOLVED" }
      - { name: collected_date, type: datetime, source: system, description: "Nullable. Logical clock date at collect; collections on the same house must be >= 7 days apart (ERR_SAMPLING_TOO_SOON)" }
      - { name: collected_by, type: string, source: system, description: "Nullable. X-User-ID of collector (SoD: result recorder must differ)" }
      - { name: result, type: enum, source: system, description: "Nullable. NEGATIVE | POSITIVE" }
      - { name: resulted_by, type: string, source: system, description: "Nullable. X-User-ID of the result recorder" }

  - name: ComplianceAudit
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: input, description: "FK -> Farm.id" }
      - { name: standard, type: enum, source: input, description: "USDA_CAGE_FREE | PASTURE_RAISED | FDA_EGG_SAFETY" }
      - { name: audit_date, type: datetime, source: input, description: "Planned audit date; must be >= 30 days from audit_date of every non-terminal audit of the same farm (ERR_AUDIT_INTERVAL_TOO_SOON); gap == 30 exactly is allowed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | FINDINGS_RECORDED | CLOSED_PASSED | CLOSED_FAILED" }
      - { name: findings_count, type: integer, source: input, description: "Recorded at record-findings (>= 0)" }
      - { name: corrective_actions_open, type: integer, source: input, description: "Recorded at record-findings (>= 0); > 0 contributes WATCH posture" }
      - { name: outcome, type: enum, source: system, description: "Nullable. PASSED | FAILED — set by close; FAILED cascades farm posture to SUSPENDED" }
      - { name: closed_date, type: datetime, source: system, description: "Nullable. Logical clock date at close" }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: farm_id, type: string, source: input, description: "FK -> Farm.id" }
      - { name: salmonella_test_id, type: string, source: system, description: "Nullable. FK -> SalmonellaTest.id; set when auto-created by a POSITIVE result cascade; null for manual recalls" }
      - { name: scope_flock_id, type: string, source: input, description: "Nullable. FK -> Flock.id; restricts the scope sweep to one flock; null sweeps the whole farm" }
      - { name: reason, type: enum, source: input, description: "SALMONELLA | QUALITY | LABELING" }
      - { name: pack_window_start, type: datetime, source: input, description: "Scope sweep lower bound on EggLot.pack_date (inclusive); <= pack_window_end" }
      - { name: pack_window_end, type: datetime, source: input, description: "Scope sweep upper bound on EggLot.pack_date (inclusive)" }
      - { name: status, type: enum, source: system, description: "INITIATED | SCOPED | CLOSED" }
      - { name: scoped_lot_count, type: integer, source: computed, description: "Lots swept to RECALLED by the scope action" }

  - name: SpentHenDisposition
    parent: null
    common_fields: true
    fields:
      - { name: flock_id, type: string, source: input, description: "FK -> Flock.id; flock must be DEPOPULATING at complete" }
      - { name: method, type: enum, source: input, description: "RENDERING | COMPOST | LIVE_SALE | EUTHANIZED" }
      - { name: hen_count, type: integer, source: input, description: "Spent hens in this disposition (> 0); complete validates hen_count <= flock.current_hen_count (ERR_HEN_COUNT_EXCEEDED)" }
      - { name: revenue_cents, type: integer, source: input, description: "Realized revenue credited into cost-per-dozen (>= 0)" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMPLETED | VOIDED" }
      - { name: completed_date, type: datetime, source: system, description: "Nullable. Logical clock date at complete" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Flock
    initial_state: PLACED
    terminal_states: [DEPLETED]
    transitions:
      - from: PLACED
        to: GROWING
        trigger: "system (daily ops run, when age_weeks >= 1)"
        actor: system
        preconditions: ["age_weeks >= 1"]
        side_effects: ["increments Flock.version by 1"]
      - from: GROWING
        to: LAYING
        trigger: "system (daily ops run, when age_weeks >= 18; a flock placed at age >= 18 passes PLACED -> GROWING -> LAYING within one ops run)"
        actor: system
        preconditions: ["age_weeks >= 18"]
        side_effects: ["increments Flock.version by 1"]
      - from: LAYING
        to: MOLT_REST
        trigger: "POST /api/flocks/{flockId}/induce-molt"
        actor: FarmManager
        preconditions:
          - "age_weeks >= 60 (ERR_MOLT_AGE_INELIGIBLE; age_weeks == 60 exactly is eligible)"
          - "molt_count < 1 (ERR_MOLT_LIMIT_REACHED)"
          - "quarantine_status == CLEAR (ERR_UNRESOLVED_POSITIVE)"
        side_effects:
          - "molt_started_date = clock date"
          - "current_lay_rate_pct recomputes to 0.00 while in MOLT_REST"
          - "increments Flock.version by 1"
      - from: MOLT_REST
        to: LAYING
        trigger: "POST /api/flocks/{flockId}/resume-lay"
        actor: FarmManager
        preconditions:
          - "clock date >= molt_started_date + 14 days (ERR_MOLT_REST_TOO_SHORT)"
        side_effects:
          - "molt_count += 1"
          - "lay_cycle = SECOND"
          - "current_lay_rate_pct recomputes with POST_MOLT_FACTOR 0.85"
          - "increments Flock.version by 1"
      - from: LAYING
        to: DEPOPULATING
        trigger: "POST /api/flocks/{flockId}/depopulate"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "House occupying this flock: status OCCUPIED -> DEPOPULATING (cascade; House.status_changed_date = clock date)"
          - "increments Flock.version by 1"
      - from: MOLT_REST
        to: DEPOPULATING
        trigger: "POST /api/flocks/{flockId}/depopulate"
        actor: FarmManager
        preconditions: []
        side_effects:
          - "House occupying this flock: status OCCUPIED -> DEPOPULATING (cascade)"
          - "increments Flock.version by 1"
      - from: DEPOPULATING
        to: DEPLETED
        trigger: "system (automatic when current_hen_count reaches 0 after a disposition complete)"
        actor: system
        preconditions: ["current_hen_count == 0"]
        side_effects:
          - "depleted_date = clock date"
          - "House: status DEPOPULATING -> CLEANING, status_changed_date = clock date (cascade link 2)"
          - "House.current_flock_id = null"
          - "increments Flock.version by 1"

  - entity: House
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - from: EMPTY
        to: OCCUPIED
        trigger: "system (on POST /api/flocks placement into this house)"
        actor: system
        preconditions: []
        side_effects:
          - "current_flock_id = new flock id; status_changed_date = clock date"
          - "increments House.version by 1"
      - from: OCCUPIED
        to: DEPOPULATING
        trigger: "system (cascade from Flock depopulate)"
        actor: system
        preconditions: []
        side_effects: ["status_changed_date = clock date", "increments House.version by 1"]
      - from: DEPOPULATING
        to: CLEANING
        trigger: "system (cascade from Flock -> DEPLETED)"
        actor: system
        preconditions: []
        side_effects: ["status_changed_date = clock date", "increments House.version by 1"]
      - from: CLEANING
        to: RESTING
        trigger: "system (daily ops run, when clock date >= status_changed_date + 7)"
        actor: system
        preconditions: ["clock date >= status_changed_date + 7 days"]
        side_effects: ["status_changed_date = clock date", "increments House.version by 1"]
      - from: RESTING
        to: EMPTY
        trigger: "system (daily ops run, when clock date >= status_changed_date + 14)"
        actor: system
        preconditions: ["clock date >= status_changed_date + 14 days"]
        side_effects: ["status_changed_date = clock date", "increments House.version by 1"]

  - entity: GradingRun
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/grading-runs/{gradingRunId}/submit"
        actor: QualityGrader
        preconditions:
          - "six size-class counts + three undergrade counts sum exactly to eggs_to_grade (ERR_SIZE_DISTRIBUTION_MISMATCH)"
        side_effects:
          - "submitted_by = X-User-ID"
          - "increments GradingRun.version by 1"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /api/grading-runs/{gradingRunId}/confirm"
        actor: QAManager
        preconditions:
          - "confirmed_by X-User-ID != submitted_by (ERR_SOD_VIOLATION)"
          - "flock.ungraded_egg_pool >= eggs_to_grade (ERR_INSUFFICIENT_UNGRADED_EGGS)"
        side_effects:
          - "confirmed_by = X-User-ID; pack_date = clock date"
          - "flock.ungraded_egg_pool -= eggs_to_grade (ledger sync)"
          - "per size class in fixed order JUMBO, XLARGE, LARGE, MEDIUM, SMALL, PEEWEE: dozen_count = floor(count/12); if dozen_count > 0 create EggLot (lifecycle FRESH, hold CLEAR); flock.loose_egg_pool += (count mod 12)"
          - "increments GradingRun.version by 1 and Flock.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/grading-runs/{gradingRunId}/void"
        actor: QAManager
        preconditions: []
        side_effects: ["increments GradingRun.version by 1"]
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /api/grading-runs/{gradingRunId}/void"
        actor: QAManager
        preconditions: []
        side_effects: ["increments GradingRun.version by 1"]
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /api/grading-runs/{gradingRunId}/void"
        actor: QAManager
        preconditions:
          - "no child lot with lifecycle_status in {SHIPPED, CLOSED, RECALLED} (ERR_INVALID_STATE)"
        side_effects:
          - "compensation: every child EggLot with lifecycle_status in {FRESH, RELEASED, ALLOCATED} -> EXPIRED (an ALLOCATED lot first releases contract.allocated_dozen and clears contract_id)"
          - "flock.ungraded_egg_pool += eggs_to_grade; flock.loose_egg_pool -= sum(count mod 12 over this run's six size counts)"
          - "increments GradingRun.version by 1 and Flock.version by 1"
        note: "Void compensates confirm: child lots transition FRESH/RELEASED/ALLOCATED -> EXPIRED (ALLOCATED lots first release contract.allocated_dozen); the full egg draw returns to the flock pool"

  - entity: EggLot
    initial_state: FRESH
    terminal_states: [CLOSED, EXPIRED, RECALLED]
    note: "TWO parallel dimensions on one row: lifecycle_status (FRESH -> RELEASED -> ALLOCATED -> SHIPPED -> CLOSED; side exits EXPIRED / RECALLED) x hold_status (CLEAR <-> HELD). hold transitions never change lifecycle and vice versa."
    transitions:
      - from: FRESH
        to: RELEASED
        trigger: "POST /api/lots/{lotId}/release"
        actor: QAManager
        preconditions:
          - "hold_status == CLEAR (ERR_LOT_QUALITY_HELD)"
          - "farm.compliance_posture != SUSPENDED (ERR_FARM_SUSPENDED)"
          - "flock.quarantine_status == CLEAR (ERR_UNRESOLVED_POSITIVE)"
        side_effects: ["increments EggLot.version by 1"]
      - from: RELEASED
        to: ALLOCATED
        trigger: "POST /api/lots/{lotId}/allocate"
        actor: ContractManager
        preconditions:
          - "hold_status == CLEAR (ERR_LOT_QUALITY_HELD)"
          - "contract.status == ACTIVE (ERR_CONTRACT_INACTIVE)"
          - "claim compatibility: contract.claim_required NONE accepts all; CAGE_FREE accepts lot.claim_program in {CAGE_FREE, PASTURE}; PASTURE accepts only PASTURE (ERR_CLAIM_MISMATCH)"
          - "contract.allocated_dozen + dozen_count <= contract.max_open_dozen (ERR_CONTRACT_VOLUME_EXCEEDED)"
          - "clock date within [contract.effective_start, contract.effective_end) (ERR_CONTRACT_INACTIVE — the contract is not currently in force)"
        side_effects:
          - "contract_id set; contract.allocated_dozen += dozen_count"
          - "increments EggLot.version by 1 and RetailerContract.version by 1"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /api/lots/{lotId}/ship"
        actor: ContractManager
        preconditions:
          - "hold_status == CLEAR (ERR_LOT_QUALITY_HELD)"
          - "clock date <= sell_by_date (ERR_SHELF_LIFE_EXCEEDED; equality ships)"
        side_effects:
          - "ship_date = clock date; contract.allocated_dozen -= dozen_count; contract.shipped_dozen += dozen_count"
          - "increments EggLot.version by 1 and RetailerContract.version by 1"
      - from: SHIPPED
        to: CLOSED
        trigger: "system (cascade from Settlement finalize covering this lot)"
        actor: system
        preconditions: []
        side_effects: ["increments EggLot.version by 1"]
      - from: FRESH
        to: EXPIRED
        trigger: "system (daily ops run when clock date > sell_by_date)"
        actor: system
        preconditions: ["clock date > sell_by_date"]
        side_effects: ["increments EggLot.version by 1"]
      - from: RELEASED
        to: EXPIRED
        trigger: "system (daily ops run when clock date > sell_by_date)"
        actor: system
        preconditions: ["clock date > sell_by_date"]
        side_effects: ["increments EggLot.version by 1"]
      - from: ALLOCATED
        to: EXPIRED
        trigger: "system (daily ops run when clock date > sell_by_date)"
        actor: system
        preconditions: ["clock date > sell_by_date"]
        side_effects:
          - "contract.allocated_dozen -= dozen_count; contract_id cleared (cascade)"
          - "increments EggLot.version by 1 and RetailerContract.version by 1"
      - from: FRESH
        to: RECALLED
        trigger: "system (Recall scope sweep)"
        actor: system
        preconditions: []
        side_effects: ["recall_id set; increments EggLot.version by 1"]
      - from: RELEASED
        to: RECALLED
        trigger: "system (Recall scope sweep)"
        actor: system
        preconditions: []
        side_effects: ["recall_id set; increments EggLot.version by 1"]
      - from: ALLOCATED
        to: RECALLED
        trigger: "system (Recall scope sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "recall_id set; contract.allocated_dozen -= dozen_count; contract_id cleared (cascade)"
          - "increments EggLot.version by 1 and RetailerContract.version by 1"
      - from: FRESH
        to: FRESH
        trigger: "POST /api/lots/{lotId}/hold  (hold dimension only: hold_status CLEAR -> HELD; lifecycle unchanged)"
        actor: QAManager
        preconditions: ["hold_status == CLEAR (ERR_INVALID_STATE)"]
        side_effects: ["hold_status = HELD; increments EggLot.version by 1", "if lifecycle ALLOCATED: contract.held_allocated_dozen recompute -> contract auto-suspends when > 0 (cascade)"]
        note: "hold/clear-hold are declared on every pre-terminal lifecycle state FRESH|RELEASED|ALLOCATED with identical semantics"
      - from: RELEASED
        to: RELEASED
        trigger: "POST /api/lots/{lotId}/hold"
        actor: QAManager
        preconditions: ["hold_status == CLEAR"]
        side_effects: ["hold_status = HELD; increments EggLot.version by 1"]
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /api/lots/{lotId}/hold"
        actor: QAManager
        preconditions: ["hold_status == CLEAR"]
        side_effects:
          - "hold_status = HELD; increments EggLot.version by 1"
          - "contract.held_allocated_dozen becomes > 0 -> contract status ACTIVE -> SUSPENDED (cascade), which auto-VOIDs its DRAFT settlements (cascade link 2)"
      - from: FRESH
        to: FRESH
        trigger: "POST /api/lots/{lotId}/clear-hold  (hold_status HELD -> CLEAR)"
        actor: QAManager
        preconditions:
          - "hold_status == HELD (ERR_INVALID_STATE)"
          - "flock.quarantine_status == CLEAR (ERR_UNRESOLVED_POSITIVE — quarantine holds cannot be cleared manually)"
        side_effects: ["hold_status = CLEAR; increments EggLot.version by 1"]
      - from: RELEASED
        to: RELEASED
        trigger: "POST /api/lots/{lotId}/clear-hold"
        actor: QAManager
        preconditions: ["hold_status == HELD", "flock.quarantine_status == CLEAR (ERR_UNRESOLVED_POSITIVE)"]
        side_effects: ["hold_status = CLEAR; increments EggLot.version by 1"]
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /api/lots/{lotId}/clear-hold"
        actor: QAManager
        preconditions: ["hold_status == HELD", "flock.quarantine_status == CLEAR (ERR_UNRESOLVED_POSITIVE)"]
        side_effects: ["hold_status = CLEAR; contract.held_allocated_dozen recompute (does NOT auto-reinstate a SUSPENDED contract); increments EggLot.version by 1"]

  - entity: RetailerContract
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/contracts/{contractId}/activate"
        actor: ContractManager
        preconditions:
          - "window must not overlap any other non-terminal contract of the same farm (ERR_CONTRACT_WINDOW_OVERLAP) — re-checked at activate"
          - "farm.compliance_posture != SUSPENDED (ERR_FARM_SUSPENDED)"
        side_effects: ["increments RetailerContract.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/contracts/{contractId}/suspend  | system cascade (farm posture -> SUSPENDED, or an allocated lot becomes HELD)"
        actor: ContractManager | system
        preconditions: []
        side_effects:
          - "every DRAFT Settlement of this contract -> VOIDED (cascade)"
          - "increments RetailerContract.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/contracts/{contractId}/reinstate"
        actor: ContractManager
        preconditions:
          - "farm.compliance_posture != SUSPENDED (ERR_FARM_SUSPENDED)"
          - "held_allocated_dozen == 0 (ERR_LOT_QUALITY_HELD)"
        side_effects: ["increments RetailerContract.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (daily ops run when clock date >= effective_end)"
        actor: system
        preconditions: ["clock date >= effective_end"]
        side_effects: ["DRAFT settlements -> VOIDED (cascade)", "increments RetailerContract.version by 1"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (daily ops run when clock date >= effective_end)"
        actor: system
        preconditions: ["clock date >= effective_end"]
        side_effects: ["DRAFT settlements -> VOIDED (cascade)", "increments RetailerContract.version by 1"]
      - from: DRAFT
        to: EXPIRED
        trigger: "system (daily ops run when clock date >= effective_end)"
        actor: system
        preconditions: ["clock date >= effective_end"]
        side_effects: ["increments RetailerContract.version by 1"]

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/settlements/{settlementId}/finalize"
        actor: ContractManager
        preconditions:
          - "contract.status == ACTIVE (ERR_CONTRACT_INACTIVE)"
          - "at least one SHIPPED lot of the contract with ship_date in [period_start, period_end] (ERR_SETTLEMENT_EMPTY)"
        side_effects:
          - "snapshot lines, subtotal_cents, rebate_pct, rebate_cents, total_cents per settlement_pricing"
          - "each covered SHIPPED lot -> CLOSED (cascade)"
          - "increments Settlement.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system (superseded by a newer DRAFT settlement with overlapping period, or cascade from contract suspend/expire)"
        actor: system
        preconditions: []
        side_effects: ["increments Settlement.version by 1"]

  - entity: SalmonellaTest
    initial_state: SCHEDULED
    terminal_states: [CLEARED, RESOLVED]
    transitions:
      - from: SCHEDULED
        to: COLLECTED
        trigger: "POST /api/salmonella-tests/{salmonellaTestId}/collect"
        actor: QualityGrader
        preconditions:
          - "clock date >= scheduled_date (ERR_VALIDATION)"
          - ">= 7 days since the most recent COLLECTED-or-later test on the same house (ERR_SAMPLING_TOO_SOON; exactly 7 days is allowed)"
        side_effects: ["collected_date = clock date; collected_by = X-User-ID; increments SalmonellaTest.version by 1"]
      - from: COLLECTED
        to: RESULTED
        trigger: "POST /api/salmonella-tests/{salmonellaTestId}/record-result"
        actor: QAManager
        preconditions:
          - "result recorder X-User-ID != collected_by (ERR_SOD_VIOLATION)"
        side_effects:
          - "result = input (NEGATIVE | POSITIVE); resulted_by = X-User-ID"
          - "increments SalmonellaTest.version by 1"
      - from: RESULTED
        to: CLEARED
        trigger: "system (automatic when result == NEGATIVE, same request as record-result)"
        actor: system
        preconditions: ["result == NEGATIVE"]
        side_effects: ["increments SalmonellaTest.version by 1"]
      - from: RESULTED
        to: RESOLVED
        trigger: "system (cascade from Recall close, when result == POSITIVE)"
        actor: system
        preconditions: ["result == POSITIVE", "linked recall reached CLOSED"]
        side_effects:
          - "POSITIVE cascade (fires at record-result, before RESOLVED): link-1 Flock.quarantine_status CLEAR -> QUARANTINED; link-2 every EggLot of the flock with lifecycle in {FRESH, RELEASED, ALLOCATED} and hold CLEAR -> HELD (an ALLOCATED lot becoming HELD pushes contract.held_allocated_dozen > 0); link-3 each contract with held_allocated_dozen > 0 -> SUSPENDED; link-4 each suspended contract's DRAFT settlements -> VOIDED; link-5 auto-create Recall (farm_id from flock's house's farm, salmonella_test_id = this test, scope_flock_id = this flock, reason SALMONELLA, pack_window covering all pack dates of held lots) in status INITIATED; link-6 farm.compliance_posture -> SUSPENDED (unresolved POSITIVE)"
          - "increments SalmonellaTest.version by 1"

  - entity: ComplianceAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED_PASSED, CLOSED_FAILED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/compliance-audits/{complianceAuditId}/start"
        actor: ComplianceOfficer
        preconditions: ["clock date >= audit_date (ERR_VALIDATION)"]
        side_effects: ["increments ComplianceAudit.version by 1"]
      - from: IN_PROGRESS
        to: FINDINGS_RECORDED
        trigger: "POST /api/compliance-audits/{complianceAuditId}/record-findings"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "if corrective_actions_open > 0: farm.compliance_posture -> WATCH (unless already SUSPENDED)"
          - "increments ComplianceAudit.version by 1"
      - from: FINDINGS_RECORDED
        to: CLOSED_PASSED
        trigger: "POST /api/compliance-audits/{complianceAuditId}/close with outcome=PASSED"
        actor: ComplianceOfficer
        preconditions: ["corrective_actions_open == 0 to pass (ERR_VALIDATION otherwise)"]
        side_effects:
          - "outcome = PASSED; closed_date = clock date; farm.compliance_posture recomputed"
          - "increments ComplianceAudit.version by 1"
      - from: FINDINGS_RECORDED
        to: CLOSED_FAILED
        trigger: "POST /api/compliance-audits/{complianceAuditId}/close with outcome=FAILED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "outcome = FAILED; closed_date = clock date"
          - "cascade link-1: farm.compliance_posture -> SUSPENDED (failed audit within 30 days)"
          - "cascade link-2: every ACTIVE contract of the farm -> SUSPENDED, and each such contract's DRAFT settlements -> VOIDED"
          - "increments ComplianceAudit.version by 1"

  - entity: Recall
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: SCOPED
        trigger: "POST /api/recalls/{recallId}/scope"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sweep selector: EggLots with farm_id == recall.farm_id AND (scope_flock_id null OR flock_id == scope_flock_id) AND pack_window_start <= pack_date <= pack_window_end (inclusive both ends) AND lifecycle_status in {FRESH, RELEASED, ALLOCATED}; processed in pack_date ASC, created_at ASC order"
          - "each swept lot -> RECALLED with recall_id set (ALLOCATED lots release contract.allocated_dozen first)"
          - "scoped_lot_count = number swept (0 allowed)"
          - "increments Recall.version by 1"
      - from: SCOPED
        to: CLOSED
        trigger: "POST /api/recalls/{recallId}/close"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "if salmonella_test_id set and that test is RESULTED/POSITIVE: test -> RESOLVED; that test's flock quarantine_status -> CLEAR"
          - "farm.compliance_posture recomputed (may drop SUSPENDED if no other unresolved positives or recent failed audits)"
          - "increments Recall.version by 1"

  - entity: SpentHenDisposition
    initial_state: PLANNED
    terminal_states: [VOIDED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /api/dispositions/{dispositionId}/complete"
        actor: FarmManager
        preconditions:
          - "flock.status == DEPOPULATING (ERR_INVALID_STATE)"
          - "hen_count <= flock.current_hen_count (ERR_HEN_COUNT_EXCEEDED)"
        side_effects:
          - "flock.current_hen_count -= hen_count (hen_balance invariant)"
          - "completed_date = clock date"
          - "if flock.current_hen_count == 0: flock -> DEPLETED (cascade link-1) and its House -> CLEANING (cascade link-2)"
          - "increments SpentHenDisposition.version by 1 and Flock.version by 1"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /api/dispositions/{dispositionId}/void"
        actor: FarmManager
        preconditions:
          - "flock.status != DEPLETED (ERR_INVALID_STATE — hens cannot return to a depleted flock)"
        side_effects:
          - "compensation: flock.current_hen_count += hen_count; disposition revenue removed from spent-hen credit"
          - "increments SpentHenDisposition.version by 1 and Flock.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-contract
    parent_entity: RetailerContract
    write_endpoint: "POST /api/settlements"
    occ_field: "expected_contract_version"
    description: |
      Creating a Settlement against a RetailerContract whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just created a settlement for an
      overlapping period (which legitimately supersedes the prior DRAFT) or
      has allocated/shipped lots against the contract, and the current
      writer's view of the contract is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lay_curve_projection
    trigger: "read of Flock.current_lay_rate_pct; recomputed whenever age_weeks, lay_cycle, or status changes"
    algorithm: forward_looking
    formula: |
      if status != LAYING: rate = 0.00
      else:
        peak = breed_peak_rate_pct
        if age_weeks < 18: base = 0
        elif age_weeks <= 20: base = peak * (age_weeks - 17) / 4
        elif age_weeks <= 30: base = peak
        else: base = peak * max(1 - 0.015 * (age_weeks - 30), 0.40)
        if lay_cycle == SECOND: base = base * 0.85
        rate = round_half_up(base, 2)
      Reference points (peak 95.0): age 18 -> 23.75; 20 -> 71.25; 21..30 -> 95.00;
      31 -> 93.58; 60 -> 52.25 FIRST / 44.41 SECOND; 61 -> 50.83 FIRST / 43.20 SECOND;
      decline floor: age >= 70 -> 38.00 FIRST / 32.30 SECOND.
    input_set: "the flock's own age_weeks, lay_cycle, breed_peak_rate_pct, status"
    constants:
      RAMP_START_WEEK: 18
      PEAK_START_WEEK: 21
      PEAK_END_WEEK: 30
      DECLINE_PCT_PER_WEEK: 0.015
      POST_MOLT_FACTOR: 0.85
      FLOOR_PCT: 0.40
      MOLT_MIN_AGE_WEEKS: 60
      MAX_MOLTS: 1
      MOLT_REST_MIN_DAYS: 14
    precision: "2 decimal places, round_half_up"

  - name: feed_fifo_costing
    trigger: "ProductionDay creation with feed_issued_kg > 0"
    algorithm: chronological
    formula: |
      queue = farm's FeedDeliveries with remaining_kg > 0,
              ordered delivered_at ASC, tie-break created_at ASC
      need = feed_issued_kg; cost = 0
      if sum(remaining_kg of queue) < need: reject ERR_FEED_STOCK_EXHAUSTED
      for delivery in queue while need > 0:
        take = min(need, delivery.remaining_kg)
        cost += take * delivery.cost_per_kg_cents      # integer cents, no rounding
        delivery.remaining_kg -= take; need -= take
      production_day.feed_cost_cents = cost
    input_set: "FeedDeliveries of the same farm with remaining_kg > 0 (any status ACTIVE)"
    precision: "integer cents; quantities integer kg"
    variants: []

  - name: feed_conversion_ratio
    trigger: "GET /api/flocks/{flockId}/economics"
    algorithm: aggregation
    formula: |
      window = production days of the flock with period_start <= lay_date <= period_end (inclusive)
      total_feed_kg = sum(feed_issued_kg over window)
      avg_egg_weight_g = 60   # default until flock has a CONFIRMED non-VOIDED grading run
      if such a run exists: avg_egg_weight_g = size-weighted average over the LATEST
        confirmed run's size distribution using SIZE_WEIGHT_G
      egg_mass_kg = (sum(eggs_collected over window) * avg_egg_weight_g) / 1000
      FCR = round_half_up(total_feed_kg / egg_mass_kg, 3)   # undefined (null) when egg_mass_kg == 0
    input_set: "ProductionDays of the flock within [period_start, period_end] inclusive"
    constants:
      DEFAULT_AVG_EGG_WEIGHT_G: 60
      SIZE_WEIGHT_G: { PEEWEE: 42, SMALL: 49, MEDIUM: 56, LARGE: 63, XLARGE: 70, JUMBO: 77 }
    precision: "3 decimal places, round_half_up"

  - name: cost_per_dozen
    trigger: "GET /api/flocks/{flockId}/economics?variant=... and Settlement finalize (COST_PLUS contracts use ACTUAL_FIFO over the settlement period)"
    algorithm: aggregation
    formula: |
      window = production days of the flock with period_start <= lay_date <= period_end (inclusive, 7-day periods in fixtures)
      hen_days = sum(hens_at_start over window)
      farm_hen_days = sum(hens_at_start over ALL production days of ALL flocks of the same farm in window)
      share = hen_days / farm_hen_days            # 1 when the farm has a single flock
      overhead_cents = round_half_up(farm.daily_overhead_cents * DAYS_IN_PERIOD * share)
      amortization_cents = round_half_up(flock.pullet_cost_cents * DAYS_IN_PERIOD / 420)
      spent_hen_credit_cents = sum(revenue_cents of COMPLETED non-VOIDED dispositions
                                   with period_start <= completed_date <= period_end)
      Variant ACTUAL_FIFO:
        feed_cents = sum(feed_cost_cents over window)
        total_eggs = sum(eggs_collected over window)
        cpd = round_half_up((feed_cents + overhead_cents + amortization_cents - spent_hen_credit_cents) * 12 / total_eggs, 2)
        (total_eggs == 0 -> ERR_VALIDATION on economics read; COST_PLUS finalize with total_eggs == 0 -> ERR_SETTLEMENT_EMPTY)
      Variant PROJECTED_STANDARD:
        rate = lay_curve_projection(age_weeks at period_end, lay_cycle, breed_peak_rate_pct, status)
        projected_eggs = round_half_up(current_hen_count * rate / 100 * DAYS_IN_PERIOD, 0)
        standard_feed_kg = current_hen_count * 115 * DAYS_IN_PERIOD / 1000
        latest_price = cost_per_kg_cents of the farm's FeedDelivery with max delivered_at (tie-break created_at ASC)
        feed_cents = round_half_up(standard_feed_kg * latest_price)
        projected_hen_days = current_hen_count * DAYS_IN_PERIOD; share over projected farm hen-days likewise
        overhead_cents = round_half_up(farm.daily_overhead_cents * DAYS_IN_PERIOD * share)
        cpd = round_half_up((feed_cents + overhead_cents + amortization_cents - spent_hen_credit_cents) * 12 / projected_eggs, 2)
    input_set: "ProductionDays of the flock in window; farm FeedDeliveries; farm overhead; flock pullet cost; dispositions in window"
    constants:
      AMORTIZATION_DAYS: 420
      STANDARD_FEED_G_PER_HEN_DAY: 115
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ACTUAL_FIFO
        when: "trailing actuals; used by COST_PLUS settlement finalize"
        difference: "uses recorded feed_cost_cents (FIFO layers) and actual eggs_collected"
      - name: PROJECTED_STANDARD
        when: "forward-looking quote support via economics endpoint"
        difference: "uses lay-curve-projected eggs and standard 115 g/hen-day intake priced at the latest delivery; same overhead/amortization/credit terms"

  - name: size_distribution_materialization
    trigger: "GradingRun confirm"
    algorithm: waterfall_allocation
    formula: |
      for size_class in fixed order [JUMBO, XLARGE, LARGE, MEDIUM, SMALL, PEEWEE]:
        count = run's count for the class
        dozen = floor(count / 12); loose = count - dozen * 12
        if dozen > 0: create EggLot(size_class, grade, dozen_count = dozen,
                                    pack_date = clock date, sell_by_date = pack_date + SHELF_LIFE_DAYS(claim_program),
                                    claim_program = farm.certification_program)
        flock.loose_egg_pool += loose
      flock.ungraded_egg_pool -= eggs_to_grade
      invariant checked: sum(six size counts) + cracked_count + dirty_count + blood_spot_count == eggs_to_grade
    input_set: "the confirmed GradingRun's counts"
    constants:
      EGGS_PER_DOZEN: 12
      SHELF_LIFE_DAYS: { CONVENTIONAL: 45, CAGE_FREE: 30, PASTURE: 30 }
    precision: "integer eggs/dozens"

  - name: settlement_pricing
    trigger: "Settlement finalize"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER IS PINNED (steps must execute in this order):
      (1) lines = SHIPPED lots of the contract with period_start <= ship_date <= period_end,
          ordered pack_date ASC, created_at ASC; empty -> ERR_SETTLEMENT_EMPTY
      (2) per line, price_cents_per_dozen depends on pricing_model_used:
          MARKET_INDEX: base = market_index_cents + contract.spread_cents
          COST_PLUS:    base = cost_per_dozen(ACTUAL_FIFO, period) * (1 + contract.margin_pct)
          multiplier = 1 + SIZE_PREMIUM_PCT[size_class] + GRADE_UPLIFT_PCT[grade]
                       + (contract.claim_premium_pct if contract.claim_required != NONE else 0)
          price_cents_per_dozen = round_half_up(base * multiplier, 0)   # ROUND PER LINE FIRST (mode b)
      (3) line_amount_cents = price_cents_per_dozen * dozen_count       # integer, exact
      (4) subtotal_cents = sum(line_amount_cents)
      (5) rebate_pct: PRE-REBATE subtotal tier (mode c): subtotal_cents >= 500000 -> 0.04;
          >= 100000 -> 0.02; else 0  (tier selection uses subtotal BEFORE rebate, never total_cents)
      (6) rebate_cents = round_half_up(subtotal_cents * rebate_pct, 0)
      (7) total_cents = subtotal_cents - rebate_cents
      Covered lots transition SHIPPED -> CLOSED.
    input_set: "SHIPPED lots of the contract with ship_date inside [period_start, period_end] inclusive"
    constants:
      SIZE_PREMIUM_PCT: { JUMBO: 0.20, XLARGE: 0.10, LARGE: 0.0, MEDIUM: -0.05, SMALL: -0.10, PEEWEE: -0.15 }
      GRADE_UPLIFT_PCT: { AA: 0.05, A: 0.0, B: -0.08 }
      REBATE_TIER_2_SUBTOTAL_CENTS: 500000
      REBATE_TIER_2_PCT: 0.04
      REBATE_TIER_1_SUBTOTAL_CENTS: 100000
      REBATE_TIER_1_PCT: 0.02
    precision: "per-dozen price integer cents round_half_up; rebate integer cents round_half_up"
    variants:
      - name: MARKET_INDEX
        when: "contract.pricing_model == MARKET_INDEX"
        difference: "base = market_index_cents (input) + spread_cents"
      - name: COST_PLUS
        when: "contract.pricing_model == COST_PLUS"
        difference: "base = cost_per_dozen ACTUAL_FIFO over the settlement period * (1 + margin_pct); premium multiplier identical"

  - name: shelf_life_expiry
    trigger: "daily ops run; also evaluated inline on ship"
    algorithm: threshold
    formula: |
      sell_by_date = pack_date + SHELF_LIFE_DAYS(claim_program)
      shippable while clock_date <= sell_by_date (equality allowed)
      ops run: lots with lifecycle in {FRESH, RELEASED, ALLOCATED} and clock_date > sell_by_date -> EXPIRED
      (ALLOCATED lots release contract.allocated_dozen and clear contract_id)
    input_set: "all non-terminal lots"
    constants:
      SHELF_LIFE_DAYS: { CONVENTIONAL: 45, CAGE_FREE: 30, PASTURE: 30 }
    precision: "date granularity, inclusive boundary"

  - name: sampling_cadence_schedule
    trigger: "daily ops run"
    algorithm: threshold
    formula: |
      for each flock with status LAYING and quarantine_status == CLEAR:
        windows: W1 = age_weeks in [40, 45]; W2 (only when molt_count >= 1) = weeks since molt_started_date in [4, 6]
        if clock inside a window AND no SalmonellaTest of type ENVIRONMENTAL for the flock
           has collected_date inside the window AND no SCHEDULED test exists for the flock:
          auto-create SalmonellaTest(ENVIRONMENTAL) with scheduled_date pinned:
            W1: placement_date + 321 days (last day with age_weeks == 45)
            W2: molt_started_date + 48 days (last day with weeks-since-molt == 6)
        if a window fully passed with no COLLECTED-or-later ENVIRONMENTAL test inside it:
          farm.compliance_posture at least WATCH
    input_set: "LAYING flocks and their ENVIRONMENTAL tests"
    constants:
      ENV_WINDOW_1_WEEKS: [40, 45]
      POST_MOLT_WINDOW_WEEKS: [4, 6]
      COLLECT_MIN_GAP_DAYS: 7
    precision: "date granularity"

  - name: hen_balance_invariant
    trigger: "ProductionDay create (mortality), disposition complete/void"
    algorithm: aggregation
    formula: |
      CONSERVED QUANTITY (hen headcount):
        flock.initial_hen_count
          == flock.current_hen_count
             + sum(mortality_count over flock's production days)
             + sum(hen_count over flock's COMPLETED, non-VOIDED dispositions)
      forward complete deducts hens; compensating void restores exactly; net drift must be zero.
    input_set: "one flock, its production days and dispositions"
    precision: "integer hens"

  - name: egg_pool_balance_invariant
    trigger: "ProductionDay create, GradingRun create/confirm/void"
    algorithm: aggregation
    formula: |
      CONSERVED QUANTITY (gradable eggs):
        sum(eggs_collected - rejected_eggs over flock's production days)
          == flock.ungraded_egg_pool
             + sum(eggs_to_grade over CONFIRMED, non-VOIDED grading runs)
      forward confirm deducts eggs_to_grade from the pool; compensating void returns exactly
      eggs_to_grade (and reclaims loose remainders); net drift must be zero.
      Undergrades (cracked/dirty/blood-spot at grading) are part of eggs_to_grade and
      therefore stay inside the second term; they never enter lots.
    input_set: "one flock, its production days and grading runs"
    precision: "integer eggs"

  - name: compliance_posture_derivation
    trigger: "recomputed after: record-result, recall close, audit record-findings/close, ops run"
    algorithm: threshold
    formula: |
      posture = SUSPENDED if any SalmonellaTest of the farm's flocks has result == POSITIVE
                and status != RESOLVED
             or any ComplianceAudit of the farm has outcome == FAILED with closed_date within
                the trailing 30 days (inclusive) and no later audit CLOSED_PASSED
      else WATCH if any audit in FINDINGS_RECORDED with corrective_actions_open > 0
             or any flock missed a sampling window (sampling_cadence_schedule)
      else CLEAR
      Gates: lot release and contract activate/reinstate require posture != SUSPENDED.
      Posture -> SUSPENDED cascades: every ACTIVE contract of the farm -> SUSPENDED
      (which auto-VOIDs its DRAFT settlements).
    input_set: "farm's salmonella tests, audits, flocks"
    precision: "enum derivation"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Segregation of duties: grading-run confirmer X-User-ID != submitted_by; salmonella result recorder X-User-ID != collected_by"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /api/grading-runs/{gradingRunId}/confirm, POST /api/salmonella-tests/{salmonellaTestId}/record-result"
  - priority: 4
    category: existence
    check: "Every id in path and every FK id in body exists (validated left-to-right: path ids first)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 5
    category: business_constraint
    check: "Request schema: required fields present, types correct, enum values valid, integers within stated bounds (e.g. > 0 / >= 0), date fields well-formed, period_start <= period_end, spread_cents/margin_pct model-consistency (MARKET_INDEX requires margin_pct == 0 and spread provided; COST_PLUS requires spread_cents == 0 and margin provided)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 6
    category: state
    check: "Target entity's own state machine permits the requested transition from its current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_contract_version == RetailerContract.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/settlements"
  - priority: 8
    category: business_referential
    check: "Cross-entity state gates: farm.compliance_posture != SUSPENDED (lot release, contract activate/reinstate); house.status == EMPTY (flock placement, else ERR_HOUSE_NOT_EMPTY); flock.status == LAYING (production day, else ERR_FLOCK_NOT_LAYING); contract.status == ACTIVE (allocate, settlement create, settlement finalize, else ERR_CONTRACT_INACTIVE)"
    error_id: "ERR_FARM_SUSPENDED | ERR_HOUSE_NOT_EMPTY | ERR_FLOCK_NOT_LAYING | ERR_CONTRACT_INACTIVE"
    http_status: 409
    applies_to: "release, activate, reinstate, flock create, production-day create, allocate, settlement create, settlement finalize"
  - priority: 9
    category: business_safety
    check: "Health/claim gates: lot hold_status == CLEAR for release/allocate/ship (ERR_LOT_QUALITY_HELD); flock.quarantine_status == CLEAR for release/clear-hold/induce-molt (ERR_UNRESOLVED_POSITIVE); lot.claim_program satisfies contract.claim_required (ERR_CLAIM_MISMATCH); no second open (INITIATED|SCOPED) recall per farm (ERR_RECALL_ACTIVE)"
    error_id: "ERR_LOT_QUALITY_HELD | ERR_UNRESOLVED_POSITIVE | ERR_CLAIM_MISMATCH | ERR_RECALL_ACTIVE"
    http_status: 409
    applies_to: "lot release/allocate/ship/clear-hold, induce-molt, recall create"
  - priority: 10
    category: business_temporal
    check: "Time rules: clock <= sell_by_date on ship (ERR_SHELF_LIFE_EXCEEDED); contract [effective_start, effective_end) half-open non-overlap per farm among non-terminal contracts (ERR_CONTRACT_WINDOW_OVERLAP); audit_date >= 30 days from other non-terminal audits of the farm (ERR_AUDIT_INTERVAL_TOO_SOON); age_weeks >= 60 for induce-molt (ERR_MOLT_AGE_INELIGIBLE); clock >= molt_started_date + 14 for resume-lay (ERR_MOLT_REST_TOO_SHORT); >= 7 days between collections on one house (ERR_SAMPLING_TOO_SOON)"
    error_id: "ERR_SHELF_LIFE_EXCEEDED | ERR_CONTRACT_WINDOW_OVERLAP | ERR_AUDIT_INTERVAL_TOO_SOON | ERR_MOLT_AGE_INELIGIBLE | ERR_MOLT_REST_TOO_SHORT | ERR_SAMPLING_TOO_SOON"
    http_status: 422
    applies_to: "ship, contract create/activate, audit create, induce-molt, resume-lay, test collect"
  - priority: 11
    category: business_constraint
    check: "Domain integrity: one ProductionDay per (flock_id, lay_date) (ERR_DUPLICATE_PRODUCTION_DAY); mortality_count and disposition hen_count <= current_hen_count (ERR_HEN_COUNT_EXCEEDED); feed_issued_kg <= farm FIFO stock (ERR_FEED_STOCK_EXHAUSTED); eggs_to_grade <= ungraded_egg_pool (ERR_INSUFFICIENT_UNGRADED_EGGS); size + undergrade counts == eggs_to_grade (ERR_SIZE_DISTRIBUTION_MISMATCH); molt_count < 1 (ERR_MOLT_LIMIT_REACHED)"
    error_id: "ERR_DUPLICATE_PRODUCTION_DAY | ERR_HEN_COUNT_EXCEEDED | ERR_FEED_STOCK_EXHAUSTED | ERR_INSUFFICIENT_UNGRADED_EGGS | ERR_SIZE_DISTRIBUTION_MISMATCH | ERR_MOLT_LIMIT_REACHED"
    http_status: 422
    applies_to: "production-day create, disposition create/complete, grading-run create/submit, induce-molt"
  - priority: 12
    category: business_fiscal
    check: "Money/volume: contract.allocated_dozen + dozen_count <= max_open_dozen (ERR_CONTRACT_VOLUME_EXCEEDED); settlement finalize needs >= 1 covered SHIPPED lot (ERR_SETTLEMENT_EMPTY)"
    error_id: "ERR_CONTRACT_VOLUME_EXCEEDED | ERR_SETTLEMENT_EMPTY"
    http_status: 422
    applies_to: "allocate, settlement finalize"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Same X-User-ID attempted both steps of a segregated pair (grading submit->confirm, test collect->record-result)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, bad enum, bad date, period_start > period_end, model-inconsistent spread/margin, future placement/scheduled date, negative counts" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity's own state machine forbids the transition from its current state (incl. double submit, terminal-state writes, hold toggles)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contract_version != current RetailerContract.version on settlement create (OCC)" }
  - { id: ERR_FARM_SUSPENDED, http: 409, condition: "farm.compliance_posture == SUSPENDED blocks lot release and contract activate/reinstate" }
  - { id: ERR_HOUSE_NOT_EMPTY, http: 409, condition: "Flock placement into a house not in EMPTY status" }
  - { id: ERR_FLOCK_NOT_LAYING, http: 409, condition: "ProductionDay recorded for a flock not in LAYING status" }
  - { id: ERR_MOLT_AGE_INELIGIBLE, http: 422, condition: "induce-molt with age_weeks < 60" }
  - { id: ERR_MOLT_LIMIT_REACHED, http: 422, condition: "induce-molt with molt_count >= 1" }
  - { id: ERR_MOLT_REST_TOO_SHORT, http: 422, condition: "resume-lay before molt_started_date + 14 days" }
  - { id: ERR_FEED_STOCK_EXHAUSTED, http: 422, condition: "ProductionDay feed_issued_kg exceeds farm's total remaining FIFO feed stock" }
  - { id: ERR_DUPLICATE_PRODUCTION_DAY, http: 409, condition: "A ProductionDay already exists for (flock_id, lay_date)" }
  - { id: ERR_HEN_COUNT_EXCEEDED, http: 422, condition: "mortality_count or disposition hen_count exceeds flock.current_hen_count" }
  - { id: ERR_INSUFFICIENT_UNGRADED_EGGS, http: 422, condition: "eggs_to_grade exceeds flock.ungraded_egg_pool (at create or re-validated at confirm)" }
  - { id: ERR_SIZE_DISTRIBUTION_MISMATCH, http: 422, condition: "Six size counts + three undergrade counts do not sum to eggs_to_grade at submit" }
  - { id: ERR_LOT_QUALITY_HELD, http: 409, condition: "Operation requires hold_status == CLEAR; also blocks contract reinstate while allocated lots are HELD" }
  - { id: ERR_UNRESOLVED_POSITIVE, http: 409, condition: "Flock is QUARANTINED (unresolved positive salmonella test); blocks lot release, manual clear-hold, induce-molt" }
  - { id: ERR_SHELF_LIFE_EXCEEDED, http: 422, condition: "Ship attempted with clock date > sell_by_date" }
  - { id: ERR_CLAIM_MISMATCH, http: 409, condition: "lot.claim_program does not satisfy contract.claim_required (NONE < CAGE_FREE < PASTURE dominance)" }
  - { id: ERR_RECALL_ACTIVE, http: 409, condition: "Manual recall create while the farm already has a recall in INITIATED or SCOPED" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Contract [effective_start, effective_end) overlaps another non-terminal contract of the same farm; touching endpoints allowed" }
  - { id: ERR_CONTRACT_INACTIVE, http: 409, condition: "Operation requires contract.status == ACTIVE (also: allocate outside the effective window)" }
  - { id: ERR_CONTRACT_VOLUME_EXCEEDED, http: 422, condition: "allocate would push contract.allocated_dozen above max_open_dozen" }
  - { id: ERR_SETTLEMENT_EMPTY, http: 422, condition: "Finalize found no SHIPPED lots of the contract with ship_date in the period (also: COST_PLUS period with zero eggs)" }
  - { id: ERR_AUDIT_INTERVAL_TOO_SOON, http: 409, condition: "audit_date within 30 days of another non-terminal audit of the same farm; exactly 30 days allowed" }
  - { id: ERR_SAMPLING_TOO_SOON, http: 409, condition: "Test collection less than 7 days after the previous collection on the same house; exactly 7 days allowed" }

# =============================================================================
# §1.5 API Endpoint Table
# List endpoints accept optional filters noted in input plus pagination fields
# (limit/offset); list default sort: created_at ASC (EggLot list adds
# size_class enum-rank DESC as tie-break because lots share pack timestamps).
# GET endpoints are open to all six roles.
# =============================================================================
endpoints:
  # --- test-driving / ops ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601). Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/api/ops/run-daily"
    description: "Daily ops-run checkpoint. Fixed processing order: (1) expire lots past sell_by (pack_date ASC, created_at ASC); (2) expire contracts at/past effective_end (effective_end ASC); (3) flock age transitions PLACED->GROWING->LAYING (placement_date ASC); (4) house CLEANING->RESTING (+7d) and RESTING->EMPTY (+14d) (status_changed_date ASC); (5) auto-schedule due ENVIRONMENTAL sampling windows (flock placement_date ASC); (6) recompute farm postures."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ lots_expired: integer, contracts_expired: integer, flocks_advanced: integer, houses_advanced: integer, tests_auto_scheduled: integer }"
    side_effects: ["per description; every mutation increments the entity version"]

  # --- Farm ---
  - method: POST
    path: "/api/farms"
    description: "Create a farm"
    roles: [PlatformAdmin]
    code: 201
    input: [name, certification_program, daily_overhead_cents]
    output: Farm
    side_effects: ["compliance_posture = CLEAR; active_flock_count = 0"]
  - method: GET
    path: "/api/farms/{farmId}"
    description: "Get a farm (incl. computed compliance_posture)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: Farm
    side_effects: []

  # --- House ---
  - method: POST
    path: "/api/houses"
    description: "Create a house on a farm"
    roles: [PlatformAdmin, FarmManager]
    code: 201
    input: [farm_id, house_code, environment_type, capacity_hens]
    output: House
    side_effects: ["status = EMPTY; status_changed_date = clock date"]
  - method: GET
    path: "/api/houses/{houseId}"
    description: "Get a house"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: House
    side_effects: []
  - method: GET
    path: "/api/houses"
    description: "List houses (filterable by farm_id)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["farm_id?", "status?", "limit?", "offset?"]
    output: House[]
    side_effects: []

  # --- Flock ---
  - method: POST
    path: "/api/flocks"
    description: "Place a flock into an EMPTY house"
    roles: [FarmManager]
    code: 201
    input: [house_id, breed_code, breed_peak_rate_pct, placement_date, initial_hen_count, pullet_cost_cents]
    output: Flock
    side_effects:
      - "status = PLACED; quarantine CLEAR; lay_cycle FIRST; molt_count 0"
      - "prior_flock_id = house's most recent DEPLETED flock (max depleted_date, tie-break created_at ASC) or null"
      - "House: EMPTY -> OCCUPIED, current_flock_id set (cascade)"
  - method: GET
    path: "/api/flocks/{flockId}"
    description: "Get a flock (incl. age_weeks, current_lay_rate_pct, pools, hen counts)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: Flock
    side_effects: []
  - method: GET
    path: "/api/flocks"
    description: "List flocks (filterable)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["house_id?", "prior_flock_id?", "status?", "limit?", "offset?"]
    output: Flock[]
    side_effects: []
  - method: POST
    path: "/api/flocks/{flockId}/induce-molt"
    description: "Move a LAYING flock into MOLT_REST (age >= 60 weeks, molt_count < 1)"
    roles: [FarmManager]
    code: 200
    input: []
    output: Flock
    side_effects: ["status -> MOLT_REST; molt_started_date = clock date; increments Flock.version by 1"]
  - method: POST
    path: "/api/flocks/{flockId}/resume-lay"
    description: "Return a MOLT_REST flock to LAYING after >= 14 rest days; sets lay_cycle SECOND"
    roles: [FarmManager]
    code: 200
    input: []
    output: Flock
    side_effects: ["status -> LAYING; molt_count += 1; lay_cycle = SECOND; increments Flock.version by 1"]
  - method: POST
    path: "/api/flocks/{flockId}/depopulate"
    description: "Begin spent-hen depopulation (LAYING or MOLT_REST -> DEPOPULATING)"
    roles: [FarmManager]
    code: 200
    input: []
    output: Flock
    side_effects: ["status -> DEPOPULATING; House OCCUPIED -> DEPOPULATING (cascade); increments Flock.version by 1"]
  - method: GET
    path: "/api/flocks/{flockId}/economics"
    description: "Computed read: cost-per-dozen and FCR over a period"
    roles: [PlatformAdmin, FarmManager, ContractManager]
    code: 200
    input: ["period_start?", "period_end?", "variant?"]
    output: "{ cost_per_dozen_cents: number, feed_conversion_ratio: number, total_eggs: integer, feed_cost_cents: integer, overhead_cents: integer, amortization_cents: integer, spent_hen_credit_cents: integer }"
    side_effects: []

  # --- FeedDelivery ---
  - method: POST
    path: "/api/feed-deliveries"
    description: "Record a feed delivery into the farm's FIFO queue"
    roles: [FarmManager]
    code: 201
    input: [farm_id, delivered_at, quantity_kg, cost_per_kg_cents]
    output: FeedDelivery
    side_effects: ["remaining_kg = quantity_kg; status = ACTIVE"]
  - method: GET
    path: "/api/feed-deliveries/{feedDeliveryId}"
    description: "Get a feed delivery"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: FeedDelivery
    side_effects: []
  - method: GET
    path: "/api/feed-deliveries"
    description: "List feed deliveries (filterable by farm_id; FIFO order delivered_at ASC, created_at ASC)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["farm_id?", "status?", "limit?", "offset?"]
    output: FeedDelivery[]
    side_effects: []

  # --- ProductionDay ---
  - method: POST
    path: "/api/production-days"
    description: "Record one day of lay (immutable event). Triggers FIFO feed costing and hen/egg ledger updates."
    roles: [FarmManager]
    code: 201
    input: [flock_id, lay_date, eggs_collected, rejected_eggs, feed_issued_kg, mortality_count]
    output: ProductionDay
    side_effects:
      - "feed_fifo_costing consumes farm FIFO layers; feed_cost_cents computed"
      - "flock: cumulative_eggs += eggs_collected; cumulative_mortality += mortality_count; current_hen_count -= mortality_count; ungraded_egg_pool += (eggs_collected - rejected_eggs); version += 1"
  - method: GET
    path: "/api/production-days/{productionDayId}"
    description: "Get a production day"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: ProductionDay
    side_effects: []
  - method: GET
    path: "/api/production-days"
    description: "List production days (filterable by flock_id; chronological lay_date ASC)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["flock_id?", "lay_date?", "limit?", "offset?"]
    output: ProductionDay[]
    side_effects: []

  # --- GradingRun ---
  - method: POST
    path: "/api/grading-runs"
    description: "Open a grading run against a flock's ungraded egg pool"
    roles: [QualityGrader]
    code: 201
    input: [flock_id, grade, eggs_to_grade]
    output: GradingRun
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/grading-runs/{gradingRunId}"
    description: "Get a grading run (incl. lot_ids after confirm)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: GradingRun
    side_effects: []
  - method: GET
    path: "/api/grading-runs"
    description: "List grading runs (filterable by flock_id)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["flock_id?", "status?", "limit?", "offset?"]
    output: GradingRun[]
    side_effects: []
  - method: POST
    path: "/api/grading-runs/{gradingRunId}/submit"
    description: "Submit candling + size distribution; counts must sum to eggs_to_grade"
    roles: [QualityGrader]
    code: 200
    input: [peewee_count, small_count, medium_count, large_count, xlarge_count, jumbo_count, cracked_count, dirty_count, blood_spot_count]
    output: GradingRun
    side_effects: ["status -> SUBMITTED; submitted_by = X-User-ID; increments GradingRun.version by 1"]
  - method: POST
    path: "/api/grading-runs/{gradingRunId}/confirm"
    description: "QA confirms a submitted run; materializes EggLots (SoD vs submitter)"
    roles: [QAManager]
    code: 200
    input: []
    output: GradingRun
    side_effects: ["status -> CONFIRMED; size_distribution_materialization creates lots; pool/loose ledgers update; increments GradingRun.version by 1 and Flock.version by 1"]
  - method: POST
    path: "/api/grading-runs/{gradingRunId}/void"
    description: "Void a run; from CONFIRMED compensates pool and expires its unshipped lots"
    roles: [QAManager]
    code: 200
    input: []
    output: GradingRun
    side_effects: ["status -> VOIDED; CONFIRMED void: flock.ungraded_egg_pool += eggs_to_grade, loose remainders reclaimed, child lots FRESH/RELEASED/ALLOCATED -> EXPIRED (ALLOCATED releases contract first); increments GradingRun.version by 1 and Flock.version by 1"]

  # --- EggLot (created only via grading confirm) ---
  - method: GET
    path: "/api/lots/{lotId}"
    description: "Get an egg lot"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: EggLot
    side_effects: []
  - method: GET
    path: "/api/lots"
    description: "List lots (filterable; default sort created_at ASC then size_class rank DESC)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["grading_run_id?", "flock_id?", "farm_id?", "contract_id?", "recall_id?", "lifecycle_status?", "hold_status?", "size_class?", "limit?", "offset?"]
    output: EggLot[]
    side_effects: []
  - method: POST
    path: "/api/lots/{lotId}/release"
    description: "QA release for sale (FRESH -> RELEASED); gated by farm posture and flock quarantine"
    roles: [QAManager]
    code: 200
    input: []
    output: EggLot
    side_effects: ["lifecycle_status -> RELEASED; increments EggLot.version by 1"]
  - method: POST
    path: "/api/lots/{lotId}/hold"
    description: "Place a quality hold (hold_status CLEAR -> HELD; lifecycle unchanged)"
    roles: [QAManager]
    code: 200
    input: []
    output: EggLot
    side_effects: ["hold_status -> HELD; if ALLOCATED: contract auto-SUSPENDED and its DRAFT settlements VOIDED (cascade); increments EggLot.version by 1"]
  - method: POST
    path: "/api/lots/{lotId}/clear-hold"
    description: "Clear a quality hold; blocked while flock is QUARANTINED"
    roles: [QAManager]
    code: 200
    input: []
    output: EggLot
    side_effects: ["hold_status -> CLEAR; increments EggLot.version by 1"]
  - method: POST
    path: "/api/lots/{lotId}/allocate"
    description: "Allocate a RELEASED lot to a contract (claim + volume gates)"
    roles: [ContractManager]
    code: 200
    input: [contract_id]
    output: EggLot
    side_effects: ["lifecycle_status -> ALLOCATED; contract_id set; contract.allocated_dozen += dozen_count; increments EggLot.version by 1 and RetailerContract.version by 1"]
  - method: POST
    path: "/api/lots/{lotId}/ship"
    description: "Ship an ALLOCATED lot on/before sell_by_date"
    roles: [ContractManager]
    code: 200
    input: []
    output: EggLot
    side_effects: ["lifecycle_status -> SHIPPED; ship_date = clock date; contract.allocated_dozen -= dozen_count; contract.shipped_dozen += dozen_count; increments EggLot.version by 1 and RetailerContract.version by 1"]

  # --- RetailerContract ---
  - method: POST
    path: "/api/contracts"
    description: "Create a retailer contract (window overlap checked per farm, half-open)"
    roles: [ContractManager]
    code: 201
    input: [farm_id, retailer_name, pricing_model, spread_cents, margin_pct, claim_premium_pct, claim_required, effective_start, effective_end, weekly_min_dozen, max_open_dozen]
    output: RetailerContract
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/contracts/{contractId}"
    description: "Get a contract (incl. allocated/shipped/held dozens and version)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: RetailerContract
    side_effects: []
  - method: GET
    path: "/api/contracts"
    description: "List contracts (filterable by farm_id/status)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["farm_id?", "status?", "limit?", "offset?"]
    output: RetailerContract[]
    side_effects: []
  - method: POST
    path: "/api/contracts/{contractId}/activate"
    description: "Activate a DRAFT contract (re-checks overlap and farm posture)"
    roles: [ContractManager]
    code: 200
    input: []
    output: RetailerContract
    side_effects: ["status -> ACTIVE; increments RetailerContract.version by 1"]
  - method: POST
    path: "/api/contracts/{contractId}/suspend"
    description: "Manually suspend an ACTIVE contract"
    roles: [ContractManager]
    code: 200
    input: []
    output: RetailerContract
    side_effects: ["status -> SUSPENDED; DRAFT settlements -> VOIDED (cascade); increments RetailerContract.version by 1"]
  - method: POST
    path: "/api/contracts/{contractId}/reinstate"
    description: "Reinstate a SUSPENDED contract (posture must be CLEAR/WATCH and no held allocated lots)"
    roles: [ContractManager]
    code: 200
    input: []
    output: RetailerContract
    side_effects: ["status -> ACTIVE; increments RetailerContract.version by 1"]

  # --- Settlement ---
  - method: POST
    path: "/api/settlements"
    description: "Create a DRAFT settlement for a contract+period (OCC on contract version; supersedes overlapping DRAFT settlements)"
    roles: [ContractManager]
    code: 201
    input: [contract_id, period_start, period_end, "market_index_cents?", expected_contract_version]
    output: Settlement
    side_effects:
      - "status = DRAFT; any existing DRAFT settlement of the same contract whose [period_start, period_end] overlaps (shared calendar day) is auto-VOIDED"
      - "increments RetailerContract.version by 1"
  - method: GET
    path: "/api/settlements/{settlementId}"
    description: "Get a settlement (incl. lines and totals after finalize)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/api/settlements"
    description: "List settlements (filterable by contract_id/status)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/api/settlements/{settlementId}/finalize"
    description: "Finalize: snapshot lines + totals per settlement_pricing; covered SHIPPED lots -> CLOSED"
    roles: [ContractManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status -> FINALIZED; settlement_pricing; covered lots -> CLOSED; increments Settlement.version by 1"]

  # --- SalmonellaTest ---
  - method: POST
    path: "/api/salmonella-tests"
    description: "Schedule a salmonella/environmental test for a flock"
    roles: [QualityGrader, ComplianceOfficer]
    code: 201
    input: [flock_id, test_type, scheduled_date]
    output: SalmonellaTest
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/api/salmonella-tests/{salmonellaTestId}"
    description: "Get a salmonella test"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: SalmonellaTest
    side_effects: []
  - method: GET
    path: "/api/salmonella-tests"
    description: "List salmonella tests (filterable)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["flock_id?", "status?", "test_type?", "limit?", "offset?"]
    output: SalmonellaTest[]
    side_effects: []
  - method: POST
    path: "/api/salmonella-tests/{salmonellaTestId}/collect"
    description: "Record sample collection (7-day minimum gap per house)"
    roles: [QualityGrader]
    code: 200
    input: []
    output: SalmonellaTest
    side_effects: ["status -> COLLECTED; collected_date/collected_by stamped; increments SalmonellaTest.version by 1"]
  - method: POST
    path: "/api/salmonella-tests/{salmonellaTestId}/record-result"
    description: "Record lab result (SoD vs collector); POSITIVE fires the quarantine/recall cascade"
    roles: [QAManager]
    code: 200
    input: [result]
    output: SalmonellaTest
    side_effects: ["status -> RESULTED (NEGATIVE auto-continues to CLEARED); POSITIVE: flock QUARANTINED -> lots HELD -> contracts SUSPENDED -> DRAFT settlements VOIDED -> Recall auto-created -> farm posture SUSPENDED; increments SalmonellaTest.version by 1"]

  # --- ComplianceAudit ---
  - method: POST
    path: "/api/compliance-audits"
    description: "Schedule a compliance audit (30-day minimum gap per farm vs non-terminal audits)"
    roles: [ComplianceOfficer]
    code: 201
    input: [farm_id, standard, audit_date]
    output: ComplianceAudit
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/api/compliance-audits/{complianceAuditId}"
    description: "Get an audit"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: []
  - method: GET
    path: "/api/compliance-audits"
    description: "List audits (filterable by farm_id/status)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["farm_id?", "status?", "limit?", "offset?"]
    output: ComplianceAudit[]
    side_effects: []
  - method: POST
    path: "/api/compliance-audits/{complianceAuditId}/start"
    description: "Start a scheduled audit (on/after audit_date)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceAudit
    side_effects: ["status -> IN_PROGRESS; increments ComplianceAudit.version by 1"]
  - method: POST
    path: "/api/compliance-audits/{complianceAuditId}/record-findings"
    description: "Record findings; open corrective actions push farm posture to WATCH"
    roles: [ComplianceOfficer]
    code: 200
    input: [findings_count, corrective_actions_open]
    output: ComplianceAudit
    side_effects: ["status -> FINDINGS_RECORDED; posture recompute (WATCH if corrective_actions_open > 0); increments ComplianceAudit.version by 1"]
  - method: POST
    path: "/api/compliance-audits/{complianceAuditId}/close"
    description: "Close audit with outcome PASSED (requires no open corrective actions) or FAILED (cascades posture SUSPENDED -> contracts SUSPENDED -> DRAFT settlements VOIDED)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: ComplianceAudit
    side_effects: ["status -> CLOSED_PASSED | CLOSED_FAILED; FAILED cascades per compliance_posture_derivation; increments ComplianceAudit.version by 1"]

  # --- Recall ---
  - method: POST
    path: "/api/recalls"
    description: "Manually open a recall (one open recall per farm)"
    roles: [ComplianceOfficer]
    code: 201
    input: [farm_id, reason, pack_window_start, pack_window_end, "scope_flock_id?"]
    output: Recall
    side_effects: ["status = INITIATED; salmonella_test_id = null"]
  - method: GET
    path: "/api/recalls/{recallId}"
    description: "Get a recall"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: Recall
    side_effects: []
  - method: GET
    path: "/api/recalls"
    description: "List recalls (filterable)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["farm_id?", "salmonella_test_id?", "scope_flock_id?", "status?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []
  - method: POST
    path: "/api/recalls/{recallId}/scope"
    description: "Execute the scope sweep: matching non-terminal lots -> RECALLED (releases allocations)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Recall
    side_effects: ["status -> SCOPED; lots swept per selector (pack_date ASC, created_at ASC); scoped_lot_count set; increments Recall.version by 1"]
  - method: POST
    path: "/api/recalls/{recallId}/close"
    description: "Close a scoped recall; resolves the originating positive test and clears flock quarantine"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Recall
    side_effects: ["status -> CLOSED; linked POSITIVE test -> RESOLVED; flock quarantine -> CLEAR; posture recompute; increments Recall.version by 1"]

  # --- SpentHenDisposition ---
  - method: POST
    path: "/api/dispositions"
    description: "Plan a spent-hen disposition for a flock"
    roles: [FarmManager]
    code: 201
    input: [flock_id, method, hen_count, revenue_cents]
    output: SpentHenDisposition
    side_effects: ["status = PLANNED"]
  - method: GET
    path: "/api/dispositions/{dispositionId}"
    description: "Get a disposition"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: []
    output: SpentHenDisposition
    side_effects: []
  - method: GET
    path: "/api/dispositions"
    description: "List dispositions (filterable by flock_id/status)"
    roles: [PlatformAdmin, FarmManager, QualityGrader, QAManager, ContractManager, ComplianceOfficer]
    code: 200
    input: ["flock_id?", "status?", "limit?", "offset?"]
    output: SpentHenDisposition[]
    side_effects: []
  - method: POST
    path: "/api/dispositions/{dispositionId}/complete"
    description: "Complete a disposition: hens leave the flock (flock must be DEPOPULATING)"
    roles: [FarmManager]
    code: 200
    input: []
    output: SpentHenDisposition
    side_effects: ["status -> COMPLETED; flock.current_hen_count -= hen_count; at 0: flock -> DEPLETED and House -> CLEANING (cascade); increments SpentHenDisposition.version by 1 and Flock.version by 1"]
  - method: POST
    path: "/api/dispositions/{dispositionId}/void"
    description: "Void a completed disposition (compensates hens back; blocked once flock DEPLETED)"
    roles: [FarmManager]
    code: 200
    input: []
    output: SpentHenDisposition
    side_effects: ["status -> VOIDED; flock.current_hen_count += hen_count; increments SpentHenDisposition.version by 1 and Flock.version by 1"]

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties model. All roles are opaque:
# X-User-ID is an operator identifier never compared to entity ids, EXCEPT the
# two SoD pairs which compare X-User-ID strings stored on the resource.
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator: farms, logical clock, daily ops run"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /api/ops/run-daily"
      - "POST /api/farms"
    shared_operations:
      - "All GET endpoints; POST /api/houses (shared with FarmManager)"
  - name: FarmManager
    description: "Runs the layer operation: houses, flocks, feed, production, molt/depopulation, spent-hen dispositions"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/flocks and flock actions (induce-molt, resume-lay, depopulate)"
      - "POST /api/feed-deliveries"
      - "POST /api/production-days"
      - "POST /api/dispositions (+ complete, void)"
    shared_operations:
      - "All GET endpoints; POST /api/houses (shared with PlatformAdmin)"
  - name: QualityGrader
    description: "Grading floor operator and sample collector"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/grading-runs (+ submit)"
      - "POST /api/salmonella-tests/{id}/collect"
    shared_operations:
      - "All GET endpoints; POST /api/salmonella-tests (shared with ComplianceOfficer)"
  - name: QAManager
    description: "Quality assurance authority: confirms grading runs, records lab results, releases/holds lots"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/grading-runs/{id}/confirm and /void"
      - "POST /api/salmonella-tests/{id}/record-result"
      - "POST /api/lots/{id}/release, /hold, /clear-hold"
    shared_operations:
      - "All GET endpoints"
  - name: ContractManager
    description: "Retailer contracts, lot allocation/shipping, settlements"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/contracts (+ activate, suspend, reinstate)"
      - "POST /api/lots/{id}/allocate and /ship"
      - "POST /api/settlements (+ finalize)"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Audits and recalls"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/compliance-audits (+ start, record-findings, close)"
      - "POST /api/recalls (+ scope, close)"
    shared_operations:
      - "All GET endpoints; POST /api/salmonella-tests (shared with QualityGrader)"
