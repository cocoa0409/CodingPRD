          - state_machines.Amendment.DRAFT_to_ISSUED
          - errors.ERR_AMENDMENT_WINDOW_CONFLICT
        distinguishing_aspect: |
          A DIFFERENT contended resource (a single DocumentaryCredit's amendment
          negotiation timeline, not a Bank's line) with the OPPOSITE interval semantics:
          CLOSED intervals extended by a symmetric 2-day cooling-off buffer and evaluated
          PAIRWISE with no capacity to aggregate, so a start date that merely TOUCHES the
          buffered end at 2026-08-14 collides while 2026-08-15 does not.
