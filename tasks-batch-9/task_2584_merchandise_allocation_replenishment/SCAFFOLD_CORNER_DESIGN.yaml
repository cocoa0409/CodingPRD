          assert:
            - "The program lands on transfer_min_ratio_bp == 15000 and scorecard_basis == UNIT_WEIGHTED, with system status PLANNING, locked_at null and lock_reason null"
            - "The fixture plan lands on effective_to == null, i.e. open-ended, with capacity_units 60"
            - "The size profile lands on core_size_min_share_bp == 1500, so core_size_count == 4 == size_count - the boundary is inclusive"
            - "The item lands on replenishment_model_override == null and therefore resolves replenishment_model == MIN_MAX from item_type BASIC, with lifecycle_state ACTIVE"
            - "The position lands on on_order_units == 0 and consolidated_out == false, with available_units 10 and IN_STOCK"
            - "Because core_size_min_share_bp defaulted to 1500, XL is CORE and the position (S 3, M 4, L 3, no XL) has broken_size_count == 1 and assortment_status == SIZE_OUT_RISK - the default materially changes the derived health"
            - "The PROGRAM-scope event lands on cluster_code null, store_id null, item_class null and status DRAFT"
