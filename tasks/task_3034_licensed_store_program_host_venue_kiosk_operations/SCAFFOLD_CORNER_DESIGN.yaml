            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "GET /licensing/license-agreements/${agr_id}", payload: {}, as: BrandProgramAdmin, captures: { agr_v0: $.data.version } }
            - { call: "POST /licensing/license-agreements/${agr_id}/royalty-statements", payload: { period_start_date: "2026-09-01", period_end_date: "2026-09-30", expected_agreement_version: "${agr_v0}" }, as: BrandProgramAdmin, captures: { stmt1: $.data.id } }
          trigger:
