      - name: corner_error_treatment_recommendation_accept_is_not_repeatable
        claim_type: Violation to Error
        grounds: ["errors[ERR_TREATMENT_RECOMMENDATION_INVALID_STATE]", "validations[priority=7]", "state_machines.TreatmentRecommendation.PROPOSED_to_ACCEPTED", "entities.WellProfile.fields.treatment_media"]
        distinguishing_aspect: |
          The accept transition is guarded on the STORED status, not on the derived
          status_effective: the first accept succeeds and rewires the well and its plan
          (treatment_media SOFTENER_RESIN, plan filter_media SOFTENER_RESIN, plan
          monthly_salt_lbs 51.4 from a 20.0 gpg panel on a household of 4), and the
          identical second call is refused 409
          ERR_TREATMENT_RECOMMENDATION_INVALID_STATE without touching anything.
          Because SOFTENER_RESIN carries a media reduction of 0 days, the plan's
          interval stays 270 - an implementation that treats every media change as a
          shortening reduces it.
        test_recipe:
          setup:
            - "One account, one property with household_size 4, one well with the default 6.0 gallon drawdown (duty ratio 5.00, MODERATE) and one ACTIVE MaintenancePlan created while the media was still NONE."
            - "One CHEMICAL water test sampled 2026-06-01T00:00:00Z, analysed 24 hours later with hardness 20.0 gpg and no analyte over its MCL, so the well stays at potability UNKNOWN."
            - "One PROPOSED TreatmentRecommendation founded on that test."
