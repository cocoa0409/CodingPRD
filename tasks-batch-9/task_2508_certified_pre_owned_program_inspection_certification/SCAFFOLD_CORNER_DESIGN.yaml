            - call: "GET /cpo/inspections/${i1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/inspections/${i1}/results"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "trigger call 1 returns 422 ERR_UNKNOWN_CHECKLIST_ITEM: X9 resolves on MPI-OTHER but not on the inspection's own template"
            - "trigger call 2 shows Inspection.${i1}.status == DRAFT, attempt_count == 0, recorded_item_count == 0 and version unchanged"
            - "trigger call 3 returns an empty array with total_count 0 - neither of the two valid rows was persisted"
