      - name: invoice_zero_orders_still_bills_minimum
        grounds:
          - calculations.fleet_invoice_billing
          - entities.Invoice.fields.minimum_applied
          - "endpoints: POST /fleet-wash/invoices/generate"
        distinguishing_aspect: |
          Metric is an empty set (zero included orders) on invoice generation, a different
          metric than temperature or vehicle count: line_count == 0 yields charges 0 yet
          billed_cents == monthly_minimum_cents and minimum_applied == true.
        test_recipe:
          setup:
            - "FLEET customer with ACTIVE contract (minimum 200000); no wash orders in 2026-09"
          setup_api_calls:
