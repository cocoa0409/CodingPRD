              payload: { device_id: "${dev_id}", operator_id: "${op_id}", reagent_lot_id: "${lot_id}", patient_mrn: "MRN-7001", analyte: "GLUCOSE", measured_value: 98.0, entry_mode: "INTERFACED" }
