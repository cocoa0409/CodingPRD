        distinguishing_aspect: |
          One POST /releases body breaks the uniqueness rule and the advance-allocation rule at the
          same time. The referential 409 must be reported before the fiscal 422. The follow-up calls
          then separate the two rules and land on the inclusive ceiling: 60000 + 40000 == the deal's
          100000 advance is accepted, so the check is > and not >=.
        test_recipe:
          setup:
            - "one Distributor, one Artist and one DRAFT deal with advance_amount_cents 100000"
            - "one PLANNED release with upc 099000000230 and advance_share_cents 60000"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 100000, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000230", title: "First Pressing", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 60000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
          trigger:
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000230", title: "Clash", planned_release_date: "2026-03-01", formats: ["DIGITAL"], advance_share_cents: 60000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_upc: $.data.error_id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000231", title: "Clash", planned_release_date: "2026-03-01", formats: ["DIGITAL"], advance_share_cents: 60000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_adv: $.data.error_id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000232", title: "Clash", planned_release_date: "2026-03-01", formats: ["DIGITAL"], advance_share_cents: 40000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel3_id: $.data.id }
            - call: "GET /releases?deal_id=${deal_id}&limit=50&offset=0"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
          assert:
            - "${e_upc} == \"ERR_DUPLICATE_UPC\" with HTTP 409: the body ALSO overshoots the advance (60000 + 60000 > 100000) but priority 11 is reported before priority 12"
            - "${e_adv} == \"ERR_ADVANCE_ALLOCATION_EXCEEDED\" with HTTP 422 once the upc is unique, proving the fiscal rule was masked and not absent"
            - "${rel3_id} is a fresh release id: 60000 + 40000 == 100000 exactly is ACCEPTED, so the check rejects only sums strictly above advance_amount_cents"
            - "the deal-filtered list returns exactly 2 releases (upc 099000000230 and 099000000232); neither rejected call created a row, so the 409 body carried no id"
            - "each rejected response body has exactly the error envelope keys and the deal's version is unchanged: POST /releases never bumps the deal"

      - name: deal_type_conditional_fields_rejects_mismatched_pairings
        claim_type: conditional_requirement
        grounds:
          - entities[DistributionDeal].fields[distribution_fee_pct]
          - entities[DistributionDeal].fields[profit_share_label_pct]
          - entities[DistributionDeal].fields[services_fee_pct]
          - entities[DistributionDeal].fields[services_monthly_fee_cents]
          - validations[priority 5]
        distinguishing_aspect: |
          Each deal_type makes a different subset of the four share fields REQUIRED and every field
          outside that subset MUST BE NULL. Both halves of the pairing are enforced at priority 5, so
          a DISTRIBUTION_FEE deal that also supplies profit_share_label_pct is 400 even though every
          individual field is inside its own declared range. An implementation that only checks the
          required half accepts the contradictory body and then silently picks a branch of
          deal_net_receipts; one that only checks types accepts both bodies.
        test_recipe:
          setup:
            - "one Distributor and nothing else — every call in this recipe is a fresh POST /distribution-deals"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_missing_fee: $.data.error_id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, profit_share_label_pct: 0.6000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_extra_profit: $.data.error_id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "LABEL_SERVICES", services_fee_pct: 0.1000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_missing_monthly: $.data.error_id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "PROFIT_SHARE", profit_share_label_pct: 0.6000, distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { e_extra_fee: $.data.error_id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "PROFIT_SHARE", profit_share_label_pct: 0.6000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { profit_deal_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "LABEL_SERVICES", services_fee_pct: 0.1000, services_monthly_fee_cents: 25000, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: false, advance_amount_cents: 0, marketing_budget_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { services_deal_id: $.data.id }
          assert:
            - "${e_missing_fee} == \"ERR_INVALID_REQUEST\" with HTTP 400: DISTRIBUTION_FEE requires distribution_fee_pct"
            - "${e_extra_profit} == \"ERR_INVALID_REQUEST\" with HTTP 400: profit_share_label_pct must be null on a DISTRIBUTION_FEE deal even though 0.6000 is inside its own 0.3000..0.9000 range"
            - "${e_missing_monthly} == \"ERR_INVALID_REQUEST\" with HTTP 400: LABEL_SERVICES requires BOTH services_fee_pct and services_monthly_fee_cents, and only one was supplied"
            - "${e_extra_fee} == \"ERR_INVALID_REQUEST\" with HTTP 400: the must-be-null half is symmetric — distribution_fee_pct is forbidden on a PROFIT_SHARE deal"
            - "${profit_deal_id} exists with distribution_fee_pct null, services_fee_pct null and services_monthly_fee_cents null, and ${services_deal_id} exists with services_fee_pct 0.1000 and services_monthly_fee_cents 25000, distribution_fee_pct and profit_share_label_pct both null"
            - "both accepted deals have status \"DRAFT\", version 1 and recoupment_status \"UNRECOUPED\" with advance_recouped_cents 0"

      - name: expire_rejected_until_the_clock_passes_term_end
        claim_type: temporal_boundary
        grounds:
          - state_machines[DistributionDeal.status].transitions[EXECUTED->EXPIRED]
          - validations[priority 10 ERR_TERM_NOT_ENDED]
          - entities[DistributionDeal].fields[post_term_collection_end_date]
        distinguishing_aspect: |
          Natural expiry requires the clock to be STRICTLY after term_end_date, so the last day of the
          term is still rejected: 2026-12-31 gives ERR_TERM_NOT_ENDED and 2027-01-01 succeeds. The
          successful call also proves the EXPIRED branch's own end-date arithmetic —
          post_term_collection_end_date is term_end_date + post_term_collection_days, NOT clock +
          days, which is the TERMINATION_NOTICE branch's rule.
