          - entities.Directive.fields.status
          - "validations[priority=9]"
        distinguishing_aspect: "Pair ThawTransferAuthorization->Directive: authorize is blocked when the patient has an ACTIVE CONSENT but NO ACTIVE DISPOSITION directive -> ERR_DISPOSITION_NOT_ACTIVE; a different entity pair than cycle->consultation."
        test_recipe:
          setup:
            - "Patient with 1 STORED specimen and an ACTIVE CONSENT directive but no DISPOSITION directive; requester phys1 != authorizer phys2."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr L1", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /providers", payload: { full_name: "Dr L2", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys2: "$.data.id" } }
