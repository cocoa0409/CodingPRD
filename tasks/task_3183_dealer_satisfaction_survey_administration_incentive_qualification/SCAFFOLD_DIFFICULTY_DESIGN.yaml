  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sampling_90day_contact_suppression_window
        grounds:
          - calculations.survey_sampling_rule
          - entities.SurveyInvitation.fields.customer_id
        distinguishing_aspect: |
          Resource = Customer contact channel; interval semantics = HALF-OPEN
          90-day trailing window with overlap check across waves. A customer
          with an invitation in a prior wave whose period overlaps the
          trailing 90 days is excluded from the next wave's sampling sweep.
          Interval semantics: any overlap with trailing 90 days blocks re-sampling.
        test_recipe:
          setup:
            - "Region SW; Dealer D15; Dept D15-SALES; Customer C15."
            - "QS-N ACTIVE; Wave W15a [2026-09-01, 2026-10-01); Wave W15b [2026-10-01, 2026-11-01)."
            - "T15a in W15a (completed 2026-09-10) -> sampled and invited."
            - "T15b in W15b (completed 2026-10-15) for the same customer."
            - "W15a opened -> invitation created for T15a."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
