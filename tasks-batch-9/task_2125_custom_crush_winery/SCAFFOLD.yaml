# =============================================================================
# PRD Benchmark Seed Tables — Custom Crush & Bonded Winery Services
# Generated per skills/prd-bench-scaffold-generator/SKILL.md §1.0–§1.7
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2125. Custom Crush & Bonded Winery Services
  (Napa custom crush facility): client contract & tank/barrel allocation, harvest intake
  weight/brix & lot creation, fermentation protocol & work-order billing, blending trials
  & lot merges with traceability, bonded inventory & TTB reporting per client, bottling
  line scheduling & dry-goods supply, storage fees & aging timeline, product release &
  transfer in bond

domain_name: custom-crush-winery
api_prefix: "/"   # flat/graph topology — peer collections live at the API root

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Lots merge into blend Lots (self-referential parent_lot_id) and cross-reference
  # Vessels, Contracts, BottlingLines and DryGoodsItems as peers — no URL nesting.

  state_machine_shape: parallel
  # Lot carries two INDEPENDENT axes: production_status × bond_status.
  # BlendTrial (SUBMITTED->REVISION_REQUESTED->SUBMITTED), WorkOrder
  # (BILLED->DISPUTED->COMPLETED->BILLED), Contract (ACTIVE<->SUSPENDED) and
  # TTBReport (FILED->AMENDED->PREPARED->FILED) are cyclic; VesselAllocation and
  # ReleaseOrder are branching with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the custom-crush client (a bonded winery customer)."
      - name: ttb_permit_number
        type: string
        source: input
        description: "Client's TTB basic permit number; unique across all Clients."
        constraints: "matches ^BW-CA-[0-9]{5}$; unique"
      - name: contact_email
        type: string
        source: input
        description: "Primary billing/compliance contact address."
      - name: status
        type: enum
        source: system
        description: "Client account lifecycle state."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | CLOSED"
      - name: bond_gallons_in_bond
        type: number
        source: computed
        description: "Sum of volume_gallons over this client's Lots whose bond_status == IN_BOND. Recomputed on every Lot volume or bond_status mutation."
        default: 0
        constraints: "2 decimal places"
      - name: taxpaid_gallons_ytd
        type: number
        source: computed
        description: "Cumulative gallons removed under release_type == TAXPAID_REMOVAL by EXECUTED ReleaseOrders whose executed_at falls in the calendar year of the logical clock."
        default: 0
        constraints: "2 decimal places"
      - name: last_filed_period_end
        type: datetime
        source: computed
        description: "period_end of this client's most recent TTBReport in status FILED, ordered by period_end DESC then created_at ASC; null when none."
        default: null

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the custom-crush client this harvest-year contract belongs to."
      - name: harvest_year
        type: integer
        source: input
        description: "Harvest year the contract covers."
        constraints: "2020..2035"
      - name: committed_tons
        type: number
        source: input
        description: "Tonnage the client commits to deliver for this harvest year."
        constraints: "> 0"
      - name: tank_gallons_entitled
        type: number
        source: input
        description: "Maximum aggregate gallons the client may hold in TANK vessels at one time."
        constraints: "> 0"
      - name: barrel_slots_entitled
        type: integer
        source: input
        description: "Maximum number of BARREL vessels the client may occupy at one time."
        constraints: ">= 0"
      - name: crush_rate_cents_per_ton
        type: integer
        source: input
        description: "Tier-1 crush rate in cents per ton; tier multipliers are applied per §1.3 crush_fee."
        constraints: "> 0"
      - name: storage_rate_cents_per_gallon_month
        type: integer
        source: input
        description: "Storage rate in cents per gallon per 30-day month."
        constraints: "> 0"
      - name: labor_rate_cents_per_hour
        type: integer
        source: input
        description: "Cellar labor rate in cents per crew-hour."
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the contract's effective window (ISO 8601 UTC)."
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the contract's effective window (ISO 8601 UTC)."
      - name: status
        type: enum
        source: system
        description: "Contract lifecycle state."
        default: DRAFT
        constraints: "DRAFT | PENDING_SIGNATURE | ACTIVE | SUSPENDED | TERMINATED"
      - name: tons_received
        type: number
        source: computed
        description: "Running sum of HarvestIntake.net_weight_lbs / 2000 over this contract's intakes whose status IN {ACCEPTED, ASSIGNED}, advanced at ACCEPT time."
        default: 0
        constraints: "4 decimal places"
      - name: gallons_allocated
        type: number
        source: computed
        description: "Sum of VesselAllocation.allocated_gallons over this contract's allocations with status IN {RESERVED, COMMITTED} whose vessel_id points at a Vessel with vessel_type == TANK."
        default: 0
        constraints: "2 decimal places"
      - name: barrel_slots_used
        type: integer
        source: computed
        description: "Count of this contract's VesselAllocations with status IN {RESERVED, COMMITTED} whose vessel_id points at a Vessel with vessel_type == BARREL."
        default: 0
      - name: billed_total_cents
        type: integer
        source: computed
        description: "Contract-to-date billed total: crush fees posted at intake ACCEPT, work-order billable amounts posted at BILL, and storage accruals posted via POST /contracts/{id}/storage-accruals; reduced when a BILLED WorkOrder is DISPUTED."
        default: 0
      - name: storage_billed_through
        type: datetime
        source: system
        description: "Exclusive upper bound of the storage period already posted to billed_total_cents; null until the first accrual is posted."
        default: null

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: vessel_code
        type: string
        source: input
        description: "Facility asset tag, e.g. T-101 or BBL-0442; unique across all Vessels."
        constraints: "unique"
      - name: vessel_type
        type: enum
        source: input
        description: "Kind of cooperage."
        constraints: "TANK | BARREL"
      - name: capacity_gallons
        type: number
        source: input
        description: "Working capacity in gallons."
        constraints: "> 0"
      - name: facility_zone
        type: enum
        source: input
        description: "Physical zone of the Napa facility housing this vessel."
        constraints: "ZONE_A | ZONE_B | BARREL_HALL"
      - name: condition
        type: enum
        source: system
        description: "Sanitation/service state of the vessel."
        default: CLEAN
        constraints: "CLEAN | DIRTY | OUT_OF_SERVICE"
      - name: last_released_at
        type: datetime
        source: system
        description: "end_at of the most recently RELEASED VesselAllocation on this vessel; null until the first release."
        default: null

  - name: VesselAllocation
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract whose entitlement this allocation consumes."
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the tank or barrel being occupied."
      - name: lot_id
        type: string
        source: system
        description: "FK -> Lot.id; set when the allocation is COMMITTED to a specific lot, null while RESERVED."
        default: null
      - name: start_at
        type: datetime
        source: input
        description: "Inclusive start of the occupancy interval (ISO 8601 UTC)."
      - name: end_at
        type: datetime
        source: input
        description: "Exclusive end of the occupancy interval (ISO 8601 UTC)."
      - name: allocated_gallons
        type: number
        source: input
        description: "Gallons of vessel working capacity reserved for this occupancy."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle state."
        default: RESERVED
        constraints: "RESERVED | COMMITTED | RELEASED | CANCELLED"
      - name: committed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which a lot was placed into this allocation; null while RESERVED."
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the allocation was released; null until RELEASED."
        default: null
      - name: occupied_days
        type: integer
        source: computed
        description: "Whole days between committed_at and released_at, floor((released_at - committed_at) / 86400s); 0 while not RELEASED."
        default: 0

  - name: HarvestIntake
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract the fruit is delivered against."
      - name: lot_id
        type: string
        source: system
        description: "FK -> Lot.id; set when the intake is folded into a Lot, null before that."
        default: null
      - name: delivery_ticket
        type: string
        source: input
        description: "Weigh-tag number from the crush pad scale; unique across all HarvestIntakes."
        constraints: "unique"
      - name: varietal
        type: enum
        source: input
        description: "Grape varietal delivered."
        constraints: "CABERNET_SAUVIGNON | MERLOT | CHARDONNAY | PINOT_NOIR | ZINFANDEL"
      - name: appellation
        type: enum
        source: input
        description: "AVA of the source block."
        constraints: "NAPA_VALLEY | RUTHERFORD | OAKVILLE | STAGS_LEAP | HOWELL_MOUNTAIN"
      - name: block_code
        type: string
        source: input
        description: "Vineyard block identifier for traceability."
      - name: gross_weight_lbs
        type: number
        source: input
        description: "Loaded truck weight in pounds."
        constraints: "> 0"
      - name: tare_weight_lbs
        type: number
        source: input
        description: "Empty truck weight in pounds."
        constraints: ">= 0 and < gross_weight_lbs"
      - name: net_weight_lbs
        type: number
        source: computed
        description: "gross_weight_lbs - tare_weight_lbs."
        default: 0
      - name: brix
        type: number
        source: system
        description: "Degrees Brix recorded by the lab at SAMPLE; null while WEIGHED."
        default: null
        constraints: "10.0 .. 35.0, 2 decimal places"
      - name: ph
        type: number
        source: system
        description: "Must-pH recorded by the lab at SAMPLE; null while WEIGHED."
        default: null
        constraints: "2.50 .. 4.50"
      - name: estimated_gallons
        type: number
        source: computed
        description: "Brix-adjusted juice yield computed at ACCEPT per §1.3 intake_yield; 0 before ACCEPT."
        default: 0
      - name: crush_fee_cents
        type: integer
        source: computed
        description: "Marginal-tier crush fee posted to Contract.billed_total_cents at ACCEPT per §1.3 crush_fee; 0 before ACCEPT."
        default: 0
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the truck was weighed in."
      - name: status
        type: enum
        source: system
        description: "Intake lifecycle state."
        default: WEIGHED
        constraints: "WEIGHED | SAMPLED | ACCEPTED | REJECTED | ASSIGNED"
      - name: rejection_reason
        type: string
        source: system
        description: "Free-text reason captured when the load is REJECTED; null otherwise."
        default: null

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract that owns this wine."
      - name: current_vessel_id
        type: string
        source: system
        description: "FK -> Vessel.id; vessel the lot currently occupies via a COMMITTED VesselAllocation; null when unhoused."
        default: null
      - name: parent_lot_id
        type: string
        source: system
        description: "FK -> Lot.id; self-referential blend lineage — set on a source lot when it is merged into a blend lot, cleared on unwind."
        default: null
      - name: lot_code
        type: string
        source: input
        description: "Cellar lot code."
      - name: vintage_year
        type: integer
        source: input
        description: "Declared vintage year."
      - name: varietal
        type: enum
        source: computed
        description: "Dominant varietal, derived per §1.3 lot_composition (INTAKE lots) or §1.3 blend_projection (BLEND lots)."
        constraints: "CABERNET_SAUVIGNON | MERLOT | CHARDONNAY | PINOT_NOIR | ZINFANDEL"
      - name: appellation
        type: enum
        source: computed
        description: "Dominant appellation, derived per §1.3 lot_composition or §1.3 blend_projection."
        constraints: "NAPA_VALLEY | RUTHERFORD | OAKVILLE | STAGS_LEAP | HOWELL_MOUNTAIN"
      - name: varietal_label
        type: string
        source: computed
        description: "Label-eligible varietal name when the dominant varietal share >= 75.00 percent of volume, otherwise the literal string RED_BLEND."
      - name: appellation_label
        type: string
        source: computed
        description: "Label-eligible AVA when the dominant appellation share >= 85.00 percent of volume, otherwise the literal string CALIFORNIA."
      - name: volume_gallons
        type: number
        source: computed
        description: "Current wine volume in gallons; set at creation and mutated by blend merges, bottling runs and executed release orders."
        default: 0
        constraints: "2 decimal places, >= 0"
      - name: loss_gallons
        type: number
        source: system
        description: "Cumulative declared/processing loss attributed to this lot."
        default: 0
        constraints: "2 decimal places, >= 0"
      - name: brix_at_crush
        type: number
        source: computed
        description: "Volume-weighted average brix of the intakes folded into this lot; null for BLEND-origin lots."
        default: null
      - name: alcohol_pct
        type: number
        source: computed
        description: "For INTAKE lots, round_half_up(brix_at_crush * 0.55, 2); for BLEND lots, the volume-weighted average of component alcohol_pct."
        default: null
      - name: origin
        type: enum
        source: system
        description: "Whether the lot was created from harvest intakes or from a blend execution."
        default: INTAKE
        constraints: "INTAKE | BLEND"
      - name: production_status
        type: enum
        source: system
        description: "Cellar-processing axis; evolves independently of bond_status."
        default: JUICE
        constraints: "JUICE | FERMENTING | PRESSED | AGING | BOTTLED | CONSUMED"
      - name: bond_status
        type: enum
        source: system
        description: "TTB bond axis; evolves independently of production_status."
        default: IN_BOND
        constraints: "IN_BOND | TAX_DETERMINED | REMOVED_TAXPAID | TRANSFERRED_IN_BOND"
      - name: aging_start_at
        type: datetime
        source: system
        description: "Logical-clock instant at which production_status became AGING; storage accrual clocks from here."
        default: null
      - name: aging_days
        type: integer
        source: computed
        description: "floor((logical clock now - aging_start_at) / 86400s); 0 when aging_start_at is null."
        default: 0
      - name: cases_bottled
        type: integer
        source: system
        description: "Cumulative cases produced by COMPLETED BottlingRuns against this lot."
        default: 0
      - name: source_intake_ids
        type: array
        source: system
        description: "Ordered array of HarvestIntake ids folded into this lot at creation (empty for BLEND lots)."
        default: []
      - name: component_manifest
        type: array
        source: computed
        description: "For BLEND lots, array of { source_lot_id, volume_gallons, pct_of_blend } objects pinning traceability; empty array for INTAKE lots."
        default: []

  - name: BlendTrial
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract under which the blend is trialled."
      - name: result_lot_id
        type: string
        source: system
        description: "FK -> Lot.id; the BLEND-origin lot minted at EXECUTE; null before execution and after unwind."
        default: null
      - name: trial_name
        type: string
        source: input
        description: "Winemaker's name for the trial."
      - name: target_lot_code
        type: string
        source: input
        description: "lot_code to assign to the blend lot when the trial is executed."
      - name: declared_loss_pct
        type: number
        source: input
        description: "Declared racking/blending loss as a percentage of total component gallons."
        constraints: "0 .. 5, 2 decimal places"
      - name: components
        type: array
        source: input
        description: "Array of { source_lot_id, volume_gallons } objects naming the source lots and gallons drawn from each."
        constraints: "at least 2 entries; source_lot_id values must be distinct"
      - name: round_number
        type: integer
        source: system
        description: "Revision round; starts at 1 and increments by 1 on every REVISION_REQUESTED -> SUBMITTED resubmission."
        default: 1
      - name: status
        type: enum
        source: system
        description: "Trial lifecycle state."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED | EXECUTED | UNWOUND"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClientRep that submitted the current round; null while DRAFT."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FacilityAdmin that approved the trial; null until APPROVED."
        default: null
      - name: revision_note
        type: string
        source: system
        description: "Note captured with the most recent REQUEST_REVISION; null otherwise."
        default: null
      - name: total_component_gallons
        type: number
        source: computed
        description: "Sum of components[].volume_gallons."
        default: 0
      - name: projected_loss_gallons
        type: number
        source: computed
        description: "round_half_up(total_component_gallons * declared_loss_pct / 100, 2)."
        default: 0
      - name: projected_blend_gallons
        type: number
        source: computed
        description: "round_half_up(total_component_gallons - projected_loss_gallons, 2)."
        default: 0
      - name: projected_alcohol_pct
        type: number
        source: computed
        description: "Volume-weighted alcohol of the components per §1.3 blend_projection; null when any source lot has null alcohol_pct."
        default: null
      - name: projected_varietal_label
        type: string
        source: computed
        description: "Varietal label the blend lot would carry, per the 75.00 percent rule in §1.3 blend_projection."
        default: null
      - name: projected_appellation_label
        type: string
        source: computed
        description: "Appellation label the blend lot would carry, per the 85.00 percent rule in §1.3 blend_projection."
        default: null

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot the cellar operation acts on."
      - name: operation_type
        type: enum
        source: input
        description: "Fermentation-protocol operation requested."
        constraints: "PUNCHDOWN | PUMPOVER | RACKING | PRESS | ADDITION | TOPPING | FILTRATION"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Requested execution instant (ISO 8601 UTC)."
      - name: labor_hours
        type: number
        source: input
        description: "Estimated labor hours per crew member."
        constraints: "> 0, 2 decimal places"
      - name: crew_size
        type: integer
        source: input
        description: "Number of cellar workers required."
        constraints: ">= 1"
      - name: material_cost_cents
        type: integer
        source: input
        description: "Pass-through additive/material cost in cents."
        default: 0
        constraints: ">= 0"
      - name: rush
        type: boolean
        source: input
        description: "When true a 25 percent rush surcharge is applied to base labor at billing."
        default: false
      - name: status
        type: enum
        source: system
        description: "Work-order lifecycle state."
        default: REQUESTED
        constraints: "REQUESTED | SCHEDULED | IN_PROGRESS | COMPLETED | BILLED | DISPUTED | CANCELLED"
      - name: actual_labor_hours
        type: number
        source: system
        description: "Hours per crew member actually worked, captured at COMPLETE; null before that."
        default: null
      - name: executed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CellarSupervisor that moved the order to IN_PROGRESS; null before that."
        default: null
      - name: billed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FacilityAdmin that billed the order; null before billing."
        default: null
      - name: base_labor_cents
        type: integer
        source: computed
        description: "round_half_up(actual_labor_hours * crew_size * Contract.labor_rate_cents_per_hour) — step 1 of §1.3 work_order_billing."
        default: 0
      - name: rush_surcharge_cents
        type: integer
        source: computed
        description: "round_half_up(base_labor_cents * 25 / 100) when rush is true, else 0 — step 2 of §1.3 work_order_billing."
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: "base_labor_cents + rush_surcharge_cents + material_cost_cents — step 3 of §1.3 work_order_billing."
        default: 0
      - name: volume_discount_pct
        type: number
        source: computed
        description: "Discount tier selected from the UNDISCOUNTED basis (Contract.billed_total_cents + subtotal_cents) — step 4 of §1.3 work_order_billing."
        default: 0
      - name: billable_amount_cents
        type: integer
        source: computed
        description: "subtotal_cents minus round_half_up(subtotal_cents * volume_discount_pct / 100) — step 5 of §1.3 work_order_billing."
        default: 0
      - name: dispute_reason
        type: string
        source: system
        description: "Reason captured when a BILLED order is disputed; null otherwise."
        default: null

  - name: BottlingLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: "Bottling line asset tag; unique across all BottlingLines."
        constraints: "unique"
      - name: cases_per_hour
        type: integer
        source: input
        description: "Nameplate throughput in cases per hour."
        constraints: "> 0"
      - name: changeover_minutes
        type: integer
        source: input
        description: "Fixed changeover time appended to every run's occupancy window."
        constraints: ">= 0"
      - name: daily_capacity_hours
        type: number
        source: input
        description: "Maximum aggregate run_hours schedulable on this line within one UTC calendar day."
        default: 16
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Line availability."
        default: AVAILABLE
        constraints: "AVAILABLE | MAINTENANCE"

  - name: BottlingRun
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot being bottled."
      - name: line_id
        type: string
        source: input
        description: "FK -> BottlingLine.id; the line the run occupies."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Inclusive start of the line occupancy window (ISO 8601 UTC)."
      - name: scheduled_end
        type: datetime
        source: computed
        description: "scheduled_start + run_hours + BottlingLine.changeover_minutes, per §1.3 bottling_schedule; inclusive upper bound of the occupancy window."
      - name: run_hours
        type: number
        source: computed
        description: "cases_planned / BottlingLine.cases_per_hour rounded UP to the next 0.25 hour."
        default: 0
      - name: bottle_size_ml
        type: integer
        source: input
        description: "Bottle format in millilitres."
        constraints: "375 | 750 | 1500"
      - name: cases_planned
        type: integer
        source: input
        description: "Cases scheduled for this run."
        constraints: ">= 1"
      - name: cases_actual
        type: integer
        source: system
        description: "Cases actually produced, captured at COMPLETE; null before that."
        default: null
      - name: gallons_consumed
        type: number
        source: computed
        description: "Wine drawn from the lot: round_half_up(cases * bottles_per_case * bottle_size_ml / 3785.411784, 2), using cases_planned at scheduling and cases_actual at completion."
        default: 0
      - name: supply_reservations
        type: array
        source: computed
        description: "Array of { dry_goods_item_id, item_type, units_reserved } objects created at RESERVE_SUPPLIES per §1.3 dry_goods_allocation; empty array before that and after CANCEL."
        default: []
      - name: status
        type: enum
        source: system
        description: "Bottling-run lifecycle state."
        default: SCHEDULED
        constraints: "SCHEDULED | SUPPLIES_RESERVED | COMPLETED | CANCELLED"

  - name: DryGoodsItem
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; dry goods are client-owned and never shared across clients."
      - name: sku
        type: string
        source: input
        description: "Supplier SKU."
      - name: item_type
        type: enum
        source: input
        description: "Dry-goods category."
        constraints: "BOTTLE | CORK | CAPSULE | LABEL | CASE_BOX"
      - name: units_per_case
        type: integer
        source: input
        description: "Supplier pack size, informational for receiving."
        constraints: ">= 1"
      - name: on_hand_units
        type: integer
        source: system
        description: "Total units physically held at the facility, raised by receipts and lowered when a run is COMPLETED."
        default: 0
      - name: reserved_units
        type: integer
        source: computed
        description: "Sum of units_reserved over supply_reservations of BottlingRuns with status == SUPPLIES_RESERVED that name this item."
        default: 0
      - name: available_units
        type: integer
        source: computed
        description: "on_hand_units - reserved_units."
        default: 0

  - name: TTBReport
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; bonded inventory is reported per client."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting period (ISO 8601 UTC)."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the reporting period (ISO 8601 UTC)."
      - name: variant
        type: enum
        source: system
        description: "Which reconciliation reading §1.3 ttb_reconciliation applied on the most recent PREPARE; taken from the variant field supplied on that action, and left at BONDED when the action omits it."
        default: BONDED
        constraints: "BONDED | GROSS"
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state."
        default: OPEN
        constraints: "OPEN | PREPARED | FILED | AMENDED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that prepared the current figures; null while OPEN."
        default: null
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that filed the report; null until FILED."
        default: null
      - name: opening_gallons
        type: number
        source: computed
        description: "closing_gallons of the client's most recent FILED TTBReport with period_end <= this.period_start; 0 when none."
        default: 0
      - name: produced_gallons
        type: number
        source: computed
        description: "Gallons produced in the window per the selected variant (see §1.3 ttb_reconciliation)."
        default: 0
      - name: removed_taxpaid_gallons
        type: number
        source: computed
        description: "Sum of ReleaseOrder.gallons for EXECUTED TAXPAID_REMOVAL orders with executed_at in [period_start, period_end)."
        default: 0
      - name: removed_in_bond_gallons
        type: number
        source: computed
        description: "Sum of ReleaseOrder.gallons for EXECUTED TRANSFER_IN_BOND orders with executed_at in [period_start, period_end)."
        default: 0
      - name: loss_gallons
        type: number
        source: computed
        description: "Losses recognised in the window per the selected variant (see §1.3 ttb_reconciliation)."
        default: 0
      - name: closing_gallons
        type: number
        source: computed
        description: "Physical count: sum of volume_gallons over the client's Lots whose bond_status == IN_BOND at prepare time."
        default: 0
      - name: variance_gallons
        type: number
        source: computed
        description: "closing_gallons - (opening_gallons + produced_gallons - removed_taxpaid_gallons - removed_in_bond_gallons - loss_gallons); must equal 0.00 to FILE."
        default: 0
      - name: amendment_count
        type: integer
        source: system
        description: "Number of times the report has been amended after filing."
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent FILE; null until filed."
        default: null

  - name: ReleaseOrder
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot wine is drawn from."
      - name: release_type
        type: enum
        source: input
        description: "Branch selector: taxpaid removal from bond, or transfer in bond to another bonded premise."
        constraints: "TAXPAID_REMOVAL | TRANSFER_IN_BOND"
      - name: gallons
        type: number
        source: input
        description: "Gallons to remove."
        constraints: "> 0, 2 decimal places"
      - name: cases
        type: integer
        source: input
        description: "Cases shipped, informational; null when the removal is in bulk."
        default: null
      - name: destination_permit_number
        type: string
        source: input
        description: "Receiving winery's TTB basic permit; required when release_type == TRANSFER_IN_BOND, otherwise must be omitted or null."
        default: null
      - name: status
        type: enum
        source: system
        description: "Release-order lifecycle state."
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | EXECUTED | REJECTED | CANCELLED"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClientRep that requested the release."
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that approved the release; null until APPROVED."
        default: null
      - name: excise_tax_cents
        type: integer
        source: computed
        description: "Federal excise tax computed at EXECUTE per §1.3 excise_tax; always 0 for TRANSFER_IN_BOND."
        default: 0
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant of execution; null until EXECUTED."
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: "Reason captured when the order is REJECTED; null otherwise."
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Client
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{id}/status with action=SUSPEND"
        actor: FacilityAdmin
        preconditions:
          - "Client.status == ACTIVE"
        side_effects:
          - "Client.status := SUSPENDED; Client.version incremented by 1"
          - "CASCADE HOP 1: every Contract with client_id == this client and status == ACTIVE transitions to SUSPENDED (Contract.version incremented by 1 on each)"
          - "CASCADE HOP 2: each Contract that just entered SUSPENDED in HOP 1 sets every one of its own VesselAllocations whose status == RESERVED to CANCELLED (lot_id stays null, released_at stays null)"
          - "CASCADE HOP 3: each VesselAllocation that just entered CANCELLED in HOP 2 forces its Contract.gallons_allocated and Contract.barrel_slots_used to be recomputed from the surviving allocations with status IN {RESERVED, COMMITTED}, incrementing Contract.version by 1 again"
        note: "COMMITTED allocations are NOT cancelled — wine already in a vessel stays housed."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{id}/status with action=REINSTATE"
        actor: FacilityAdmin
        preconditions:
          - "Client.status == SUSPENDED"
        side_effects:
          - "Client.status := ACTIVE"
          - "every Contract with client_id == this client and status == SUSPENDED transitions to ACTIVE; Contract.version incremented by 1 on each"
          - "VesselAllocations cancelled by the earlier suspension are NOT restored"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /clients/{id}/status with action=CLOSE"
        actor: FacilityAdmin
        preconditions:
          - "Client.status == ACTIVE"
          - "no Lot on any of this client's Contracts has bond_status == IN_BOND together with volume_gallons > 0 (else ERR_CLIENT_HAS_BONDED_INVENTORY)"
        side_effects:
          - "Client.status := CLOSED"
          - "every Contract with client_id == this client and status IN {DRAFT, PENDING_SIGNATURE, ACTIVE, SUSPENDED} transitions to TERMINATED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /clients/{id}/status with action=CLOSE"
        actor: FacilityAdmin
        preconditions:
          - "Client.status == SUSPENDED"
          - "no Lot on any of this client's Contracts has bond_status == IN_BOND together with volume_gallons > 0"
        side_effects:
          - "Client.status := CLOSED"
          - "every Contract with client_id == this client and status IN {DRAFT, PENDING_SIGNATURE, ACTIVE, SUSPENDED} transitions to TERMINATED"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /contracts/{id}/transitions with action=SUBMIT"
        actor: FacilityAdmin
        preconditions:
          - "Contract.status == DRAFT"
          - "effective_to > effective_from"
        side_effects:
          - "Contract.status := PENDING_SIGNATURE; Contract.version incremented by 1"
      - from: PENDING_SIGNATURE
        to: DRAFT
        trigger: "POST /contracts/{id}/transitions with action=REVISE"
        actor: FacilityAdmin
        preconditions:
          - "Contract.status == PENDING_SIGNATURE"
        side_effects:
          - "Contract.status := DRAFT; Contract.version incremented by 1"
        note: "Revision loop — DRAFT -> PENDING_SIGNATURE -> DRAFT may repeat any number of times."
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /contracts/{id}/transitions with action=ACTIVATE"
        actor: FacilityAdmin
        preconditions:
          - "Contract.status == PENDING_SIGNATURE"
          - "Client.status == ACTIVE for Contract.client_id (else ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "Contract.status := ACTIVE; Contract.version incremented by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /contracts/{id}/transitions with action=SUSPEND"
        actor: FacilityAdmin
        preconditions:
          - "Contract.status == ACTIVE"
        side_effects:
          - "Contract.status := SUSPENDED; Contract.version incremented by 1"
          - "every VesselAllocation of this contract with status == RESERVED transitions to CANCELLED; Contract.gallons_allocated and Contract.barrel_slots_used are recomputed from the surviving allocations with status IN {RESERVED, COMMITTED}"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /contracts/{id}/transitions with action=REINSTATE"
        actor: FacilityAdmin
        preconditions:
          - "Contract.status == SUSPENDED"
          - "Client.status == ACTIVE for Contract.client_id"
        side_effects:
          - "Contract.status := ACTIVE; Contract.version incremented by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/transitions with action=TERMINATE"
        actor: FacilityAdmin
        preconditions:
          - "Contract.status == ACTIVE"
          - "this contract has no VesselAllocation with status IN {RESERVED, COMMITTED} (else ERR_ALLOCATIONS_OUTSTANDING)"
        side_effects:
          - "Contract.status := TERMINATED; Contract.version incremented by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /contracts/{id}/transitions with action=TERMINATE"
        actor: FacilityAdmin
        preconditions:
          - "Contract.status == SUSPENDED"
          - "this contract has no VesselAllocation with status IN {RESERVED, COMMITTED}"
        side_effects:
          - "Contract.status := TERMINATED; Contract.version incremented by 1"

  - entity: Vessel
    initial_state: CLEAN
    terminal_states: []
    transitions:
      - from: CLEAN
        to: DIRTY
        trigger: "system event: a VesselAllocation on this vessel transitions COMMITTED -> RELEASED"
        actor: system
        preconditions:
          - "the releasing VesselAllocation.vessel_id == this vessel"
        side_effects:
          - "Vessel.condition := DIRTY; Vessel.last_released_at := the releasing allocation's end_at; Vessel.version incremented by 1"
      - from: DIRTY
        to: CLEAN
        trigger: "POST /vessels/{id}/condition with action=CLEAN"
        actor: CellarSupervisor
        preconditions:
          - "Vessel.condition == DIRTY"
        side_effects:
          - "Vessel.condition := CLEAN; Vessel.version incremented by 1"
        note: "Cleaning loop — CLEAN -> DIRTY -> CLEAN repeats for the life of the vessel."
      - from: CLEAN
        to: OUT_OF_SERVICE
        trigger: "POST /vessels/{id}/condition with action=DECOMMISSION"
        actor: FacilityAdmin
        preconditions:
          - "Vessel.condition == CLEAN"
          - "no VesselAllocation on this vessel has status IN {RESERVED, COMMITTED}"
        side_effects:
          - "Vessel.condition := OUT_OF_SERVICE; Vessel.version incremented by 1"
      - from: DIRTY
        to: OUT_OF_SERVICE
        trigger: "POST /vessels/{id}/condition with action=DECOMMISSION"
        actor: FacilityAdmin
        preconditions:
          - "Vessel.condition == DIRTY"
          - "no VesselAllocation on this vessel has status IN {RESERVED, COMMITTED}"
        side_effects:
          - "Vessel.condition := OUT_OF_SERVICE; Vessel.version incremented by 1"
      - from: OUT_OF_SERVICE
        to: CLEAN
        trigger: "POST /vessels/{id}/condition with action=RECOMMISSION"
        actor: FacilityAdmin
        preconditions:
          - "Vessel.condition == OUT_OF_SERVICE"
        side_effects:
          - "Vessel.condition := CLEAN; Vessel.version incremented by 1"

  - entity: VesselAllocation
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /vessel-allocations/{id}/commit"
        actor: CellarSupervisor
        preconditions:
          - "VesselAllocation.status == RESERVED (else ERR_INVALID_STATE)"
          - "Contract.status == ACTIVE for VesselAllocation.contract_id (else ERR_CONTRACT_NOT_ACTIVE)"
          - "Vessel.condition == CLEAN for VesselAllocation.vessel_id (else ERR_VESSEL_NOT_CLEAN)"
          - "the Lot named by body lot_id has Lot.contract_id == VesselAllocation.contract_id (else ERR_CROSS_CONTRACT_REFERENCE)"
          - "Lot.current_vessel_id is null (else ERR_INVALID_STATE)"
          - "Lot.volume_gallons <= VesselAllocation.allocated_gallons (else ERR_VESSEL_CAPACITY_EXCEEDED)"
        side_effects:
          - "VesselAllocation.status := COMMITTED; lot_id := body lot_id; committed_at := logical clock now"
          - "Lot.current_vessel_id := VesselAllocation.vessel_id; Lot.version incremented by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /vessel-allocations/{id}/transitions with action=CANCEL"
        actor: FacilityAdmin
        preconditions:
          - "VesselAllocation.status == RESERVED"
        side_effects:
          - "BRANCH A (cancel): VesselAllocation.status := CANCELLED; released_at stays null; Vessel.condition is NOT changed and Vessel.last_released_at is NOT changed"
          - "Contract.gallons_allocated and Contract.barrel_slots_used recomputed from allocations with status IN {RESERVED, COMMITTED}; Contract.version incremented by 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /vessel-allocations/{id}/transitions with action=RELEASE"
        actor: CellarSupervisor
        preconditions:
          - "VesselAllocation.status == COMMITTED"
        side_effects:
          - "BRANCH B (release): VesselAllocation.status := RELEASED; released_at := logical clock now; occupied_days := floor((released_at - committed_at) / 86400s)"
          - "Lot.current_vessel_id := null; Lot.version incremented by 1"
          - "Vessel.condition := DIRTY; Vessel.last_released_at := VesselAllocation.end_at; Vessel.version incremented by 1"
          - "Contract.gallons_allocated and Contract.barrel_slots_used recomputed; Contract.version incremented by 1"
        note: "Branch A and Branch B leave the Vessel in materially different states — CANCEL never dirties a vessel, RELEASE always does."
      - from: COMMITTED
        to: RELEASED
        trigger: "system event: the housed Lot reaches production_status == CONSUMED (blend merge) or BOTTLED (bottling run completion)"
        actor: system
        preconditions:
          - "VesselAllocation.status == COMMITTED and VesselAllocation.lot_id == the transitioning Lot"
        side_effects:
          - "VesselAllocation.status := RELEASED; released_at := logical clock now; occupied_days computed"
          - "Vessel.condition := DIRTY; Vessel.last_released_at := VesselAllocation.end_at; Vessel.version incremented by 1"
          - "Contract.gallons_allocated and Contract.barrel_slots_used recomputed; Contract.version incremented by 1"

  - entity: HarvestIntake
    initial_state: WEIGHED
    terminal_states: [REJECTED, ASSIGNED]
    transitions:
      - from: WEIGHED
        to: SAMPLED
        trigger: "POST /harvest-intakes/{id}/transitions with action=SAMPLE"
        actor: CellarSupervisor
        preconditions:
          - "HarvestIntake.status == WEIGHED"
          - "body brix and ph are present and inside their declared ranges"
        side_effects:
          - "HarvestIntake.brix := body brix; HarvestIntake.ph := body ph; status := SAMPLED"
      - from: SAMPLED
        to: ACCEPTED
        trigger: "POST /harvest-intakes/{id}/transitions with action=ACCEPT"
        actor: CellarSupervisor
        preconditions:
          - "HarvestIntake.status == SAMPLED"
          - "Contract.status == ACTIVE for HarvestIntake.contract_id (else ERR_CONTRACT_NOT_ACTIVE)"
          - "HarvestIntake.received_at is inside [Contract.effective_from, Contract.effective_to) (else ERR_OUTSIDE_CONTRACT_WINDOW)"
        side_effects:
          - "HarvestIntake.estimated_gallons := §1.3 intake_yield output"
          - "HarvestIntake.crush_fee_cents := §1.3 crush_fee output, evaluated against Contract.tons_received as it stands immediately BEFORE this transition"
          - "Contract.tons_received += net_weight_lbs / 2000; Contract.billed_total_cents += crush_fee_cents; Contract.version incremented by 1"
      - from: WEIGHED
        to: REJECTED
        trigger: "POST /harvest-intakes/{id}/transitions with action=REJECT"
        actor: CellarSupervisor
        preconditions:
          - "HarvestIntake.status == WEIGHED"
        side_effects:
          - "HarvestIntake.status := REJECTED; rejection_reason := body rejection_reason; no contract counters move"
      - from: SAMPLED
        to: REJECTED
        trigger: "POST /harvest-intakes/{id}/transitions with action=REJECT"
        actor: CellarSupervisor
        preconditions:
          - "HarvestIntake.status == SAMPLED"
        side_effects:
          - "HarvestIntake.status := REJECTED; rejection_reason := body rejection_reason; no contract counters move"
      - from: ACCEPTED
        to: ASSIGNED
        trigger: "system event: POST /lots names this intake in intake_ids"
        actor: system
        preconditions:
          - "HarvestIntake.status == ACCEPTED"
          - "HarvestIntake.contract_id == the new Lot's contract_id"
        side_effects:
          - "HarvestIntake.status := ASSIGNED; HarvestIntake.lot_id := the new Lot's id"

  - entity: Lot
    initial_state: JUICE
    terminal_states: [CONSUMED]
    transitions:
      - from: JUICE
        to: FERMENTING
        trigger: "POST /lots/{id}/transitions with action=START_FERMENTATION"
        actor: CellarSupervisor
        preconditions:
          - "Lot.production_status == JUICE"
          - "Lot.current_vessel_id is not null (the lot must be housed, else ERR_LOT_NOT_HOUSED)"
        side_effects:
          - "Lot.production_status := FERMENTING; Lot.version incremented by 1"
        note: "AXIS A (production_status). Lot.bond_status is untouched by every transition on this axis."
      - from: FERMENTING
        to: PRESSED
        trigger: "POST /lots/{id}/transitions with action=PRESS"
        actor: CellarSupervisor
        preconditions:
          - "Lot.production_status == FERMENTING"
          - "body loss_gallons >= 0 and body loss_gallons <= Lot.volume_gallons"
        side_effects:
          - "Lot.loss_gallons += body loss_gallons; Lot.volume_gallons -= body loss_gallons"
          - "Lot.alcohol_pct := round_half_up(Lot.brix_at_crush * 0.55, 2) for INTAKE-origin lots"
          - "Lot.production_status := PRESSED; Lot.version incremented by 1"
      - from: PRESSED
        to: AGING
        trigger: "POST /lots/{id}/transitions with action=START_AGING"
        actor: CellarSupervisor
        preconditions:
          - "Lot.production_status == PRESSED"
        side_effects:
          - "Lot.aging_start_at := logical clock now; Lot.production_status := AGING; Lot.version incremented by 1"
      - from: AGING
        to: CONSUMED
        trigger: "system event: POST /blend-trials/{id}/execute draws this lot's entire remaining volume"
        actor: system
        preconditions:
          - "Lot.production_status == AGING"
          - "the component volume_gallons drawn from this lot equals Lot.volume_gallons exactly"
        side_effects:
          - "Lot.volume_gallons := 0; Lot.parent_lot_id := the new blend Lot's id; Lot.production_status := CONSUMED; Lot.version incremented by 1"
      - from: CONSUMED
        to: AGING
        trigger: "system event: POST /blend-trials/{id}/transitions with action=UNWIND"
        actor: system
        preconditions:
          - "Lot.production_status == CONSUMED and Lot.parent_lot_id == the unwinding trial's result_lot_id"
        side_effects:
          - "Lot.volume_gallons restored to the component volume drawn at execution; Lot.parent_lot_id := null; Lot.production_status := AGING; Lot.version incremented by 1"
        note: "Compensating reversal — the only path out of CONSUMED."
      - from: AGING
        to: BOTTLED
        trigger: "system event: a BottlingRun on this lot transitions SUPPLIES_RESERVED -> COMPLETED and drives Lot.volume_gallons to exactly 0"
        actor: system
        preconditions:
          - "Lot.production_status == AGING"
          - "Lot.volume_gallons - BottlingRun.gallons_consumed == 0"
        side_effects:
          - "Lot.production_status := BOTTLED; Lot.version incremented by 1"
      - from: IN_BOND
        to: TAX_DETERMINED
        trigger: "system event: POST /release-orders/{id}/transitions with action=APPROVE on a TAXPAID_REMOVAL order"
        actor: system
        preconditions:
          - "Lot.bond_status == IN_BOND"
          - "ReleaseOrder.release_type == TAXPAID_REMOVAL"
        side_effects:
          - "Lot.bond_status := TAX_DETERMINED; Lot.version incremented by 1; Lot.production_status is untouched"
        note: "AXIS B (bond_status). This axis advances independently of AXIS A — a lot may be AGING or BOTTLED on axis A while moving IN_BOND -> TAX_DETERMINED on axis B."
      - from: TAX_DETERMINED
        to: REMOVED_TAXPAID
        trigger: "system event: POST /release-orders/{id}/transitions with action=EXECUTE on a TAXPAID_REMOVAL order that drains the lot"
        actor: system
        preconditions:
          - "Lot.bond_status == TAX_DETERMINED"
          - "Lot.volume_gallons - ReleaseOrder.gallons == 0"
        side_effects:
          - "Lot.bond_status := REMOVED_TAXPAID; Lot.volume_gallons := 0; Lot.version incremented by 1"
      - from: TAX_DETERMINED
        to: IN_BOND
        trigger: "system event: POST /release-orders/{id}/transitions with action=EXECUTE that leaves wine behind, or action=CANCEL on an APPROVED TAXPAID_REMOVAL order"
        actor: system
        preconditions:
          - "Lot.bond_status == TAX_DETERMINED"
          - "on EXECUTE: Lot.volume_gallons - ReleaseOrder.gallons > 0; on CANCEL: no execution occurred"
        side_effects:
          - "Lot.bond_status := IN_BOND; on EXECUTE Lot.volume_gallons -= ReleaseOrder.gallons; Lot.version incremented by 1"
        note: "Cycle on AXIS B — IN_BOND -> TAX_DETERMINED -> IN_BOND may repeat for every partial removal."
      - from: IN_BOND
        to: TRANSFERRED_IN_BOND
        trigger: "system event: POST /release-orders/{id}/transitions with action=EXECUTE on a TRANSFER_IN_BOND order that drains the lot"
        actor: system
        preconditions:
          - "Lot.bond_status == IN_BOND"
          - "ReleaseOrder.release_type == TRANSFER_IN_BOND"
          - "Lot.volume_gallons - ReleaseOrder.gallons == 0"
        side_effects:
          - "Lot.bond_status := TRANSFERRED_IN_BOND; Lot.volume_gallons := 0; Lot.version incremented by 1"

  - entity: BlendTrial
    initial_state: DRAFT
    terminal_states: [REJECTED, UNWOUND]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /blend-trials/{id}/transitions with action=SUBMIT"
        actor: ClientRep
        preconditions:
          - "BlendTrial.status == DRAFT"
          - "Contract.status == ACTIVE for BlendTrial.contract_id (else ERR_CONTRACT_NOT_ACTIVE)"
          - "components has at least 2 entries with distinct source_lot_id values"
          - "every source Lot has Lot.contract_id == BlendTrial.contract_id (else ERR_CROSS_CONTRACT_REFERENCE)"
          - "every source Lot has production_status IN {PRESSED, AGING} (else ERR_INVALID_STATE)"
          - "every source Lot has volume_gallons >= its component volume_gallons (else ERR_INSUFFICIENT_LOT_VOLUME)"
        side_effects:
          - "BlendTrial.status := SUBMITTED; submitted_by_user_id := X-User-ID; §1.3 blend_projection recomputes total_component_gallons, projected_loss_gallons, projected_blend_gallons, projected_alcohol_pct, projected_varietal_label, projected_appellation_label"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /blend-trials/{id}/transitions with action=REQUEST_REVISION"
        actor: FacilityAdmin
        preconditions:
          - "BlendTrial.status == SUBMITTED"
        side_effects:
          - "BlendTrial.status := REVISION_REQUESTED; revision_note := body revision_note"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /blend-trials/{id}/revise"
        actor: ClientRep
        preconditions:
          - "BlendTrial.status == REVISION_REQUESTED"
          - "the replacement components satisfy every precondition of the DRAFT -> SUBMITTED transition"
        side_effects:
          - "BlendTrial.components := body components; declared_loss_pct := body declared_loss_pct when supplied"
          - "BlendTrial.round_number incremented by 1; revision_note := null; submitted_by_user_id := X-User-ID"
          - "§1.3 blend_projection recomputes every projected_* field"
        note: "Revision cycle — SUBMITTED -> REVISION_REQUESTED -> SUBMITTED repeats, incrementing round_number each pass."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /blend-trials/{id}/transitions with action=APPROVE"
        actor: FacilityAdmin
        preconditions:
          - "BlendTrial.status == SUBMITTED"
          - "BlendTrial.projected_blend_gallons > 0"
          - "BlendTrial.projected_appellation_label != CALIFORNIA — the facility only executes AVA-eligible blends under its bonded label program (else ERR_APPELLATION_INELIGIBLE)"
        side_effects:
          - "BlendTrial.status := APPROVED; approved_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /blend-trials/{id}/transitions with action=REJECT"
        actor: FacilityAdmin
        preconditions:
          - "BlendTrial.status == SUBMITTED"
        side_effects:
          - "BlendTrial.status := REJECTED"
      - from: REVISION_REQUESTED
        to: REJECTED
        trigger: "POST /blend-trials/{id}/transitions with action=REJECT"
        actor: FacilityAdmin
        preconditions:
          - "BlendTrial.status == REVISION_REQUESTED"
        side_effects:
          - "BlendTrial.status := REJECTED"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /blend-trials/{id}/execute"
        actor: ClientRep
        preconditions:
          - "BlendTrial.status == APPROVED"
          - "body expected_contract_version == Contract.version (else ERR_STALE_CONTRACT_VERSION)"
          - "Contract.status == ACTIVE"
          - "every source Lot still has volume_gallons >= its component volume_gallons (else ERR_INSUFFICIENT_LOT_VOLUME)"
        side_effects:
          - "a new Lot is minted: origin := BLEND, lot_code := target_lot_code, contract_id := BlendTrial.contract_id, volume_gallons := projected_blend_gallons, loss_gallons := projected_loss_gallons, alcohol_pct := projected_alcohol_pct, varietal_label := projected_varietal_label, appellation_label := projected_appellation_label, production_status := AGING, aging_start_at := logical clock now, bond_status := IN_BOND, component_manifest := the traceability array"
          - "BlendTrial.status := EXECUTED; result_lot_id := the new Lot's id"
          - "CASCADE HOP 1: each source Lot has its component volume subtracted from volume_gallons; a source Lot drawn to exactly 0 gallons moves production_status AGING -> CONSUMED and takes parent_lot_id := the new Lot's id"
          - "CASCADE HOP 2: each source Lot that just entered CONSUMED in HOP 1 forces its own COMMITTED VesselAllocation (the one whose lot_id equals that Lot) to transition COMMITTED -> RELEASED, stamping released_at and occupied_days"
          - "CASCADE HOP 3: each VesselAllocation that just entered RELEASED in HOP 2 sets its Vessel.condition := DIRTY and Vessel.last_released_at := that allocation's end_at, incrementing Vessel.version by 1"
          - "CASCADE HOP 4: each Vessel that just went DIRTY in HOP 3 forces the owning Contract to recompute gallons_allocated and barrel_slots_used from the surviving allocations with status IN {RESERVED, COMMITTED}, incrementing Contract.version by 1"
          - "Client.bond_gallons_in_bond recomputed"
      - from: EXECUTED
        to: UNWOUND
        trigger: "POST /blend-trials/{id}/transitions with action=UNWIND"
        actor: FacilityAdmin
        preconditions:
          - "BlendTrial.status == EXECUTED"
          - "the result Lot has volume_gallons == projected_blend_gallons and loss_gallons == projected_loss_gallons (no wine has been bottled, blended onward or released out of it, else ERR_BLEND_ALREADY_CONSUMED)"
        side_effects:
          - "COMPENSATION: each source Lot's volume_gallons is restored by exactly the component volume drawn at execution; parent_lot_id := null; a source Lot in CONSUMED returns to AGING"
          - "the result Lot: volume_gallons := 0, loss_gallons := 0, production_status := CONSUMED, component_manifest := []"
          - "BlendTrial.status := UNWOUND; result_lot_id := null"
          - "Client.bond_gallons_in_bond recomputed"
        note: "Conserves INVARIANT_GALLONS(contract) = sum over that contract's Lots of (volume_gallons + loss_gallons)."

  - entity: WorkOrder
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/transitions with action=SCHEDULE"
        actor: CellarSupervisor
        preconditions:
          - "WorkOrder.status == REQUESTED"
          - "the Contract that owns WorkOrder.lot_id has status == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
          - "Lot.production_status NOT IN {CONSUMED, BOTTLED} (else ERR_INVALID_STATE)"
        side_effects:
          - "WorkOrder.status := SCHEDULED"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/transitions with action=START"
        actor: CellarSupervisor
        preconditions:
          - "WorkOrder.status == SCHEDULED"
        side_effects:
          - "WorkOrder.status := IN_PROGRESS; executed_by_user_id := X-User-ID"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/transitions with action=COMPLETE"
        actor: CellarSupervisor
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
          - "body actual_labor_hours is present and > 0"
        side_effects:
          - "WorkOrder.actual_labor_hours := body actual_labor_hours; WorkOrder.status := COMPLETED"
      - from: COMPLETED
        to: BILLED
        trigger: "POST /work-orders/{id}/bill"
        actor: FacilityAdmin
        preconditions:
          - "WorkOrder.status == COMPLETED"
          - "X-User-ID != WorkOrder.executed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "body expected_contract_version == Contract.version (else ERR_STALE_CONTRACT_VERSION)"
          - "Contract.status == ACTIVE"
        side_effects:
          - "§1.3 work_order_billing writes base_labor_cents, rush_surcharge_cents, subtotal_cents, volume_discount_pct and billable_amount_cents"
          - "Contract.billed_total_cents += billable_amount_cents; Contract.version incremented by 1"
          - "WorkOrder.status := BILLED; billed_by_user_id := X-User-ID"
      - from: BILLED
        to: DISPUTED
        trigger: "POST /work-orders/{id}/transitions with action=DISPUTE"
        actor: ClientRep
        preconditions:
          - "WorkOrder.status == BILLED"
        side_effects:
          - "COMPENSATION: Contract.billed_total_cents -= WorkOrder.billable_amount_cents; Contract.version incremented by 1"
          - "WorkOrder.status := DISPUTED; dispute_reason := body dispute_reason; billable_amount_cents, subtotal_cents and volume_discount_pct are reset to 0"
      - from: DISPUTED
        to: COMPLETED
        trigger: "POST /work-orders/{id}/transitions with action=COMPLETE"
        actor: FacilityAdmin
        preconditions:
          - "WorkOrder.status == DISPUTED"
          - "body actual_labor_hours is present and > 0 (the corrected hours)"
        side_effects:
          - "WorkOrder.actual_labor_hours := body actual_labor_hours; WorkOrder.status := COMPLETED; dispute_reason := null"
        note: "Billing cycle — COMPLETED -> BILLED -> DISPUTED -> COMPLETED -> BILLED repeats until the client accepts the charge."
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/transitions with action=CANCEL"
        actor: ClientRep
        preconditions:
          - "WorkOrder.status == REQUESTED"
        side_effects:
          - "WorkOrder.status := CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/transitions with action=CANCEL"
        actor: ClientRep
        preconditions:
          - "WorkOrder.status == SCHEDULED"
        side_effects:
          - "WorkOrder.status := CANCELLED"

  - entity: BottlingRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SUPPLIES_RESERVED
        trigger: "POST /bottling-runs/{id}/transitions with action=RESERVE_SUPPLIES"
        actor: CellarSupervisor
        preconditions:
          - "BottlingRun.status == SCHEDULED"
          - "the client owning the run's Lot has enough DryGoodsItem.available_units for every required item_type per §1.3 dry_goods_allocation (else ERR_DRY_GOODS_SHORTAGE)"
        side_effects:
          - "BottlingRun.supply_reservations := the §1.3 dry_goods_allocation draw list"
          - "each named DryGoodsItem has reserved_units increased by its units_reserved and available_units recomputed as on_hand_units - reserved_units; DryGoodsItem.version incremented by 1"
          - "BottlingRun.status := SUPPLIES_RESERVED"
      - from: SUPPLIES_RESERVED
        to: COMPLETED
        trigger: "POST /bottling-runs/{id}/transitions with action=COMPLETE"
        actor: CellarSupervisor
        preconditions:
          - "BottlingRun.status == SUPPLIES_RESERVED"
          - "body cases_actual is present, >= 1 and <= cases_planned"
          - "Lot.volume_gallons >= the gallons_consumed recomputed from cases_actual (else ERR_INSUFFICIENT_LOT_VOLUME)"
        side_effects:
          - "BottlingRun.cases_actual := body cases_actual; gallons_consumed recomputed from cases_actual per §1.3 bottling_schedule"
          - "each reserved DryGoodsItem: on_hand_units -= units_reserved, reserved_units -= units_reserved, available_units recomputed; DryGoodsItem.version incremented by 1"
          - "CASCADE HOP 1: Lot.volume_gallons -= gallons_consumed; Lot.cases_bottled += cases_actual; Lot.version incremented by 1"
          - "CASCADE HOP 2: a Lot whose volume_gallons reached exactly 0 in HOP 1 moves production_status AGING -> BOTTLED"
          - "CASCADE HOP 3: a Lot that just entered BOTTLED in HOP 2 forces its COMMITTED VesselAllocation to RELEASED, which sets that allocation's Vessel.condition := DIRTY and recomputes Contract.gallons_allocated"
          - "BottlingRun.status := COMPLETED; Client.bond_gallons_in_bond recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /bottling-runs/{id}/transitions with action=CANCEL"
        actor: CellarSupervisor
        preconditions:
          - "BottlingRun.status == SCHEDULED"
        side_effects:
          - "BottlingRun.status := CANCELLED; the line occupancy window is freed for later scheduling"
      - from: SUPPLIES_RESERVED
        to: CANCELLED
        trigger: "POST /bottling-runs/{id}/transitions with action=CANCEL"
        actor: CellarSupervisor
        preconditions:
          - "BottlingRun.status == SUPPLIES_RESERVED"
        side_effects:
          - "COMPENSATION: every DryGoodsItem named in supply_reservations has reserved_units decreased by exactly its units_reserved and available_units recomputed; on_hand_units is untouched; DryGoodsItem.version incremented by 1"
          - "BottlingRun.supply_reservations := []; BottlingRun.status := CANCELLED"
        note: "Conserves INVARIANT_UNITS(client) = sum over that client's DryGoodsItems of (available_units + reserved_units)."

  - entity: BottlingLine
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /bottling-lines/{id}/status with action=SET_MAINTENANCE"
        actor: FacilityAdmin
        preconditions:
          - "BottlingLine.status == AVAILABLE"
        side_effects:
          - "BottlingLine.status := MAINTENANCE; increments BottlingLine.version by 1; runs already in SCHEDULED or SUPPLIES_RESERVED keep their windows"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /bottling-lines/{id}/status with action=SET_AVAILABLE"
        actor: FacilityAdmin
        preconditions:
          - "BottlingLine.status == MAINTENANCE"
        side_effects:
          - "BottlingLine.status := AVAILABLE; increments BottlingLine.version by 1"
        note: "Maintenance loop — AVAILABLE -> MAINTENANCE -> AVAILABLE repeats for the life of the line."

  - entity: TTBReport
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: PREPARED
        trigger: "POST /ttb-reports/{id}/transitions with action=PREPARE"
        actor: ComplianceOfficer
        preconditions:
          - "TTBReport.status == OPEN"
          - "Client.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "§1.3 ttb_reconciliation computes opening_gallons, produced_gallons, removed_taxpaid_gallons, removed_in_bond_gallons, loss_gallons, closing_gallons and variance_gallons using TTBReport.variant"
          - "prepared_by_user_id := X-User-ID; TTBReport.status := PREPARED"
      - from: PREPARED
        to: OPEN
        trigger: "POST /ttb-reports/{id}/transitions with action=RECALL"
        actor: ComplianceOfficer
        preconditions:
          - "TTBReport.status == PREPARED"
        side_effects:
          - "every computed figure resets to 0; prepared_by_user_id := null; TTBReport.status := OPEN"
        note: "Recall loop — OPEN -> PREPARED -> OPEN repeats until the figures balance."
      - from: PREPARED
        to: FILED
        trigger: "POST /ttb-reports/{id}/transitions with action=FILE"
        actor: ComplianceOfficer
        preconditions:
          - "TTBReport.status == PREPARED"
          - "X-User-ID != TTBReport.prepared_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "TTBReport.period_end <= logical clock now (else ERR_PERIOD_NOT_CLOSED)"
          - "TTBReport.variance_gallons == 0.00 (else ERR_TTB_VARIANCE_UNBALANCED)"
        side_effects:
          - "filed_by_user_id := X-User-ID; filed_at := logical clock now; TTBReport.status := FILED"
          - "Client.last_filed_period_end recomputed"
      - from: FILED
        to: AMENDED
        trigger: "POST /ttb-reports/{id}/transitions with action=AMEND"
        actor: ComplianceOfficer
        preconditions:
          - "TTBReport.status == FILED"
        side_effects:
          - "TTBReport.amendment_count incremented by 1; TTBReport.status := AMENDED"
          - "Client.last_filed_period_end recomputed (this report no longer counts as FILED)"
      - from: AMENDED
        to: PREPARED
        trigger: "POST /ttb-reports/{id}/transitions with action=PREPARE"
        actor: ComplianceOfficer
        preconditions:
          - "TTBReport.status == AMENDED"
        side_effects:
          - "§1.3 ttb_reconciliation recomputes every figure using TTBReport.variant; prepared_by_user_id := X-User-ID; TTBReport.status := PREPARED"
        note: "Amendment cycle — FILED -> AMENDED -> PREPARED -> FILED repeats for every correction."

  - entity: ReleaseOrder
    initial_state: REQUESTED
    terminal_states: [EXECUTED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /release-orders/{id}/transitions with action=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "ReleaseOrder.status == REQUESTED"
          - "Lot.bond_status == IN_BOND (else ERR_INVALID_STATE)"
          - "Lot.production_status IN {AGING, BOTTLED} (else ERR_INVALID_STATE)"
          - "Lot.volume_gallons >= ReleaseOrder.gallons (else ERR_INSUFFICIENT_LOT_VOLUME)"
          - "the owning Client.status == ACTIVE (else ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "ReleaseOrder.status := APPROVED; approved_by_user_id := X-User-ID"
          - "when release_type == TAXPAID_REMOVAL: Lot.bond_status IN_BOND -> TAX_DETERMINED"
          - "when release_type == TRANSFER_IN_BOND: Lot.bond_status is left at IN_BOND"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /release-orders/{id}/transitions with action=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "ReleaseOrder.status == REQUESTED"
        side_effects:
          - "ReleaseOrder.status := REJECTED; rejection_reason := body rejection_reason; the Lot is untouched"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /release-orders/{id}/transitions with action=CANCEL"
        actor: ClientRep
        preconditions:
          - "ReleaseOrder.status == REQUESTED"
        side_effects:
          - "ReleaseOrder.status := CANCELLED; the Lot is untouched"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /release-orders/{id}/transitions with action=CANCEL"
        actor: ClientRep
        preconditions:
          - "ReleaseOrder.status == APPROVED"
        side_effects:
          - "COMPENSATION: a Lot left at TAX_DETERMINED by this order returns to IN_BOND; volume_gallons is untouched"
          - "ReleaseOrder.status := CANCELLED"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /release-orders/{id}/transitions with action=EXECUTE"
        actor: ComplianceOfficer
        preconditions:
          - "ReleaseOrder.status == APPROVED"
          - "the owning Client has no TTBReport in status PREPARED whose [period_start, period_end) contains the logical clock now (else ERR_REPORTING_PERIOD_LOCKED)"
          - "Lot.volume_gallons >= ReleaseOrder.gallons (else ERR_INSUFFICIENT_LOT_VOLUME)"
        side_effects:
          - "BRANCH TAXPAID_REMOVAL: excise_tax_cents := §1.3 excise_tax output; Lot.volume_gallons -= gallons; Client.taxpaid_gallons_ytd += gallons; Lot.bond_status := REMOVED_TAXPAID when the lot reaches 0 gallons, otherwise back to IN_BOND"
          - "BRANCH TRANSFER_IN_BOND: excise_tax_cents := 0; Lot.volume_gallons -= gallons; Client.taxpaid_gallons_ytd is NOT changed; Lot.bond_status := TRANSFERRED_IN_BOND when the lot reaches 0 gallons, otherwise left at IN_BOND"
          - "both branches: executed_at := logical clock now; ReleaseOrder.status := EXECUTED; Lot.version incremented by 1; Client.bond_gallons_in_bond recomputed"
        note: "Fork-join by release_type — the two branches write different fields on Client and land the Lot in different terminal bond states."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-reserve-stale-vessel
    parent_entity: Vessel
    write_endpoint: "POST /vessel-allocations"
    occ_field: "expected_vessel_version"
    description: |
      Reserving an occupancy window on a Vessel whose version has advanced since
      the client last read it is rejected. A writer that has just booked a
      different window on the same vessel, cleaned it, or taken it out of
      service has moved the vessel forward; the current writer's view of the
      vessel's booking calendar and condition is therefore stale, even though
      the window it is asking for would otherwise be perfectly bookable.
    error_id: ERR_STALE_VESSEL_VERSION
    http_status: 412

  - rule_id: blend-execute-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /blend-trials/{id}/execute"
    occ_field: "expected_contract_version"
    description: |
      Executing an APPROVED blend against a Contract whose version has advanced
      since the winemaker last read it is rejected. Another approved trial on
      the same contract may have legitimately executed and drawn down the very
      source lots this trial names, so the volumes the winemaker reasoned about
      are stale.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: work-order-bill-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /work-orders/{id}/bill"
    occ_field: "expected_contract_version"
    description: |
      Billing a COMPLETED work order against a Contract whose version has
      advanced since the biller last read it is rejected. Billing selects a
      volume-discount tier from Contract.billed_total_cents, and any other
      posting (a crush fee, a storage accrual, another work order) legitimately
      moves that total, which would silently reprice this order.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: storage-accrual-post-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /contracts/{id}/storage-accruals"
    occ_field: "expected_contract_version"
    description: |
      Posting a storage accrual against a Contract whose version has advanced
      since the accountant last read it is rejected. The accrual window starts
      at Contract.storage_billed_through, and any other posting that moved the
      contract forward may have already advanced that watermark, so re-posting
      from the stale watermark would double-bill the client.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: intake_yield
    trigger: "HarvestIntake SAMPLED -> ACCEPTED (POST /harvest-intakes/{id}/transitions with action=ACCEPT); writes HarvestIntake.estimated_gallons"
    algorithm: threshold
    formula: |
      net_weight_lbs = gross_weight_lbs - tare_weight_lbs
      tons           = net_weight_lbs / LBS_PER_TON

      # Sugar-driven yield step. The high-brix branch is a STEP plus a slope:
      # crossing HIGH_BRIX_THRESHOLD costs a flat HIGH_BRIX_STEP_PENALTY before
      # any per-degree penalty accrues, so the yield curve is discontinuous at
      # exactly 25.00 Brix.
      if brix >= HIGH_BRIX_THRESHOLD:
          adj_gallons_per_ton = -(HIGH_BRIX_STEP_PENALTY
                                  + (brix - HIGH_BRIX_THRESHOLD) * HIGH_BRIX_SLOPE_PENALTY)
      elif brix <= LOW_BRIX_THRESHOLD:
          adj_gallons_per_ton = +LOW_BRIX_STEP_BONUS
      else:
          adj_gallons_per_ton = 0.0

      estimated_gallons = round_half_up(tons * (BASE_YIELD_GALLONS_PER_TON + adj_gallons_per_ton), 2)
    input_set: "Exactly one HarvestIntake, at the moment its status moves SAMPLED -> ACCEPTED. Intakes in WEIGHED, SAMPLED or REJECTED contribute nothing; estimated_gallons stays 0 for them."
    constants:
      LBS_PER_TON: 2000
      BASE_YIELD_GALLONS_PER_TON: 165.0
      HIGH_BRIX_THRESHOLD: 25.0
      HIGH_BRIX_STEP_PENALTY: 5.0
      HIGH_BRIX_SLOPE_PENALTY: 2.5
      LOW_BRIX_THRESHOLD: 22.0
      LOW_BRIX_STEP_BONUS: 3.0
    precision: "estimated_gallons: 2 decimal places, round_half_up. tons is carried at full precision — it is NOT rounded before multiplication."
    variants: []

  - name: crush_fee
    trigger: "HarvestIntake SAMPLED -> ACCEPTED; writes HarvestIntake.crush_fee_cents and adds it to Contract.billed_total_cents"
    algorithm: tiered_pricing
    formula: |
      # MARGINAL tiering against the contract's running tonnage, not average rate.
      start_tons = Contract.tons_received AS IT STANDS IMMEDIATELY BEFORE THIS ACCEPT
      end_tons   = start_tons + (net_weight_lbs / LBS_PER_TON)

      tiers = [ (0,               CRUSH_TIER1_TONS, CRUSH_TIER1_MULTIPLIER),
                (CRUSH_TIER1_TONS, CRUSH_TIER2_TONS, CRUSH_TIER2_MULTIPLIER),
                (CRUSH_TIER2_TONS, +infinity,        CRUSH_TIER3_MULTIPLIER) ]

      # ROUNDING ORDER IS PINNED: round EACH tier segment to whole cents FIRST,
      # then sum the rounded segments. The alternative reading (sum the
      # unrounded segments, then round once) is explicitly NOT used and can
      # differ by one cent on a straddling load.
      crush_fee_cents = 0
      for (lo, hi, mult) in tiers:
          seg_lo = max(start_tons, lo)
          seg_hi = min(end_tons, hi)
          if seg_hi > seg_lo:
              seg_tons = seg_hi - seg_lo
              crush_fee_cents += round_half_up(seg_tons * Contract.crush_rate_cents_per_ton * mult)
    input_set: "The single HarvestIntake being accepted, priced against Contract.tons_received accumulated from that contract's intakes with status IN {ACCEPTED, ASSIGNED}. Accepts are applied in the chronological order the ACCEPT transitions occur; when two intakes are accepted at the same logical-clock instant the accumulator advances in created_at ASC order of the intakes."
    constants:
      LBS_PER_TON: 2000
      CRUSH_TIER1_TONS: 25
      CRUSH_TIER2_TONS: 75
      CRUSH_TIER1_MULTIPLIER: 1.00
      CRUSH_TIER2_MULTIPLIER: 0.90
      CRUSH_TIER3_MULTIPLIER: 0.80
    precision: "Each tier segment: whole cents, round_half_up, rounded BEFORE summation. seg_tons carried at 4 decimal places."
    variants: []

  - name: lot_composition
    trigger: "POST /lots; writes Lot.volume_gallons, Lot.brix_at_crush, Lot.varietal, Lot.appellation, Lot.varietal_label, Lot.appellation_label and Lot.source_intake_ids"
    algorithm: weighted_scoring
    formula: |
      intakes = the HarvestIntakes named by intake_ids, all of which must have status == ACCEPTED
      volume_gallons = round_half_up(sum(i.estimated_gallons for i in intakes), 2)
      brix_at_crush  = round_half_up(sum(i.estimated_gallons * i.brix for i in intakes)
                                     / sum(i.estimated_gallons for i in intakes), 2)

      # Dominant varietal / appellation: eligibility filter = the intakes in this
      # lot; ranking key = total estimated_gallons for that value DESC;
      # tie-break = the value whose earliest contributing intake has the smallest
      # created_at (never the id); empty candidate set is impossible because
      # intake_ids must be non-empty (ERR_NO_ELIGIBLE_INTAKES otherwise).
      varietal     = argmax over varietal values of sum(estimated_gallons), tie-break earliest contributing intake created_at ASC
      appellation  = argmax over appellation values of sum(estimated_gallons), tie-break earliest contributing intake created_at ASC

      varietal_share_pct    = round_half_up(100 * gallons(varietal)    / volume_gallons, 2)
      appellation_share_pct = round_half_up(100 * gallons(appellation) / volume_gallons, 2)

      varietal_label    = varietal    if varietal_share_pct    >= VARIETAL_LABEL_MIN_PCT    else "RED_BLEND"
      appellation_label = appellation if appellation_share_pct >= APPELLATION_LABEL_MIN_PCT else "CALIFORNIA"
    input_set: "Only HarvestIntakes whose status == ACCEPTED and whose contract_id equals the new Lot's contract_id. An intake in WEIGHED, SAMPLED, REJECTED or ASSIGNED is not eligible."
    constants:
      VARIETAL_LABEL_MIN_PCT: 75.00
      APPELLATION_LABEL_MIN_PCT: 85.00
      BRIX_TO_ALCOHOL_FACTOR: 0.55
    precision: "volume_gallons and brix_at_crush: 2 decimal places, round_half_up. Share percentages: 2 decimal places, round_half_up, compared with >= against the constants."
    variants: []

  - name: blend_projection
    trigger: "POST /blend-trials, POST /blend-trials/{id}/revise and BlendTrial DRAFT -> SUBMITTED; writes total_component_gallons, projected_loss_gallons, projected_blend_gallons, projected_alcohol_pct, projected_varietal_label, projected_appellation_label"
    algorithm: weighted_scoring
    formula: |
      total_component_gallons = sum(c.volume_gallons for c in components)
      projected_loss_gallons  = round_half_up(total_component_gallons * declared_loss_pct / 100, 2)
      projected_blend_gallons = round_half_up(total_component_gallons - projected_loss_gallons, 2)

      # Volume-weighted over the COMPONENT gallons drawn, not over each source
      # lot's whole volume.
      projected_alcohol_pct = round_half_up(
          sum(c.volume_gallons * Lot[c.source_lot_id].alcohol_pct for c in components)
          / total_component_gallons, 2)

      varietal_share_pct    = round_half_up(100 * max over varietal values v of
                                  sum(c.volume_gallons where Lot[c.source_lot_id].varietal == v)
                                  / total_component_gallons, 2)
      appellation_share_pct = round_half_up(100 * max over appellation values a of
                                  sum(c.volume_gallons where Lot[c.source_lot_id].appellation == a)
                                  / total_component_gallons, 2)

      projected_varietal_label    = dominant varietal    if varietal_share_pct    >= VARIETAL_LABEL_MIN_PCT    else "RED_BLEND"
      projected_appellation_label = dominant appellation if appellation_share_pct >= APPELLATION_LABEL_MIN_PCT else "CALIFORNIA"
      # Dominance ties are broken by the source lot with the earliest created_at, never by id.
    input_set: "The components array of this trial only. Source lots must have production_status IN {PRESSED, AGING}; the projection ignores every other lot on the contract."
    constants:
      VARIETAL_LABEL_MIN_PCT: 75.00
      APPELLATION_LABEL_MIN_PCT: 85.00
      BLEND_MAX_LOSS_PCT: 5.00
    precision: "All gallon figures: 2 decimal places, round_half_up. projected_alcohol_pct: 2 decimal places, round_half_up. Share percentages: 2 decimal places, round_half_up, compared with >=."
    variants: []

  - name: work_order_billing
    trigger: "WorkOrder COMPLETED -> BILLED (POST /work-orders/{id}/bill); writes base_labor_cents, rush_surcharge_cents, subtotal_cents, volume_discount_pct, billable_amount_cents and advances Contract.billed_total_cents"
    algorithm: constraint_propagation
    formula: |
      # The discount tier looks circular: the amount billed depends on the tier,
      # and the tier depends on the contract total that this very bill advances.
      # THE EVALUATION ORDER IS PINNED to the five steps below. The tier is
      # selected ONCE, from the UNDISCOUNTED basis. The discounted amount NEVER
      # re-selects the tier, so the result is well-defined even when applying the
      # discount would drop the running total back below the tier threshold.

      # Step 1
      base_labor_cents = round_half_up(actual_labor_hours * crew_size * Contract.labor_rate_cents_per_hour)
      # Step 2
      rush_surcharge_cents = round_half_up(base_labor_cents * RUSH_SURCHARGE_PCT / 100) if rush else 0
      # Step 3
      subtotal_cents = base_labor_cents + rush_surcharge_cents + material_cost_cents
      # Step 4 — tier selected from the UNDISCOUNTED basis
      tier_basis_cents = Contract.billed_total_cents + subtotal_cents
      if   tier_basis_cents >= DISCOUNT_TIER2_CENTS: volume_discount_pct = DISCOUNT_TIER2_PCT
      elif tier_basis_cents >= DISCOUNT_TIER1_CENTS: volume_discount_pct = DISCOUNT_TIER1_PCT
      else:                                          volume_discount_pct = 0
      # Step 5
      billable_amount_cents = subtotal_cents - round_half_up(subtotal_cents * volume_discount_pct / 100)
      Contract.billed_total_cents += billable_amount_cents
    input_set: "One WorkOrder in status COMPLETED, priced against Contract.billed_total_cents as it stands immediately before this bill. Work orders in REQUESTED, SCHEDULED, IN_PROGRESS, DISPUTED or CANCELLED are never priced."
    constants:
      RUSH_SURCHARGE_PCT: 25
      DISCOUNT_TIER1_CENTS: 1000000
      DISCOUNT_TIER1_PCT: 5
      DISCOUNT_TIER2_CENTS: 3000000
      DISCOUNT_TIER2_PCT: 10
    precision: "Every intermediate is whole cents, round_half_up, rounded at each numbered step before feeding the next. Threshold comparisons use >= against DISCOUNT_TIER1_CENTS and DISCOUNT_TIER2_CENTS."
    variants: []

  - name: storage_accrual
    trigger: "GET /contracts/{id}/storage-accrual (read-only projection) and POST /contracts/{id}/storage-accruals (posts the OCCUPANCY reading to Contract.billed_total_cents)"
    algorithm: aggregation
    formula: |
      window_from(x) = max(x.clock_start, Contract.storage_billed_through or Contract.effective_from)
      window_to      = through_at
      days(x)        = max(0, floor((window_to - window_from(x)) / 86400 seconds))

      # VARIANT OCCUPANCY — bill the WINE actually held.
      #   subjects  : Lots of this contract with bond_status IN {IN_BOND, TAX_DETERMINED}
      #               and production_status != CONSUMED and aging_start_at is not null
      #   clock_start = Lot.aging_start_at
      #   charge_cents = sum over subjects of
      #       round_half_up(Lot.volume_gallons * Contract.storage_rate_cents_per_gallon_month * days / DAYS_PER_MONTH)
      #   (rounded PER LOT, then summed)

      # VARIANT VESSEL_FOOTPRINT — bill the COOPERAGE actually tied up.
      #   subjects  : VesselAllocations of this contract with status IN {COMMITTED, RELEASED}
      #   clock_start = VesselAllocation.committed_at
      #   charge_cents = sum over subjects of
      #       round_half_up(VesselAllocation.allocated_gallons * Contract.storage_rate_cents_per_gallon_month * days / DAYS_PER_MONTH)
      #   (rounded PER ALLOCATION, then summed)

      # Posting (POST /contracts/{id}/storage-accruals) always uses OCCUPANCY:
      #   Contract.billed_total_cents += OCCUPANCY charge_cents
      #   Contract.storage_billed_through := through_at
    input_set: "OCCUPANCY reads Lots with bond_status IN {IN_BOND, TAX_DETERMINED}, production_status != CONSUMED and a non-null aging_start_at. VESSEL_FOOTPRINT reads VesselAllocations with status IN {COMMITTED, RELEASED} and a non-null committed_at. Both windows are clipped below by Contract.storage_billed_through when it is set, otherwise by Contract.effective_from."
    constants:
      DAYS_PER_MONTH: 30
    precision: "Whole cents, round_half_up, rounded PER SUBJECT then summed. days is an integer floor of whole 86400-second days."
    variants:
      - name: OCCUPANCY
        when: "Default reading; always used by POST /contracts/{id}/storage-accruals, and by GET /contracts/{id}/storage-accrual when the variant query parameter is absent or equals OCCUPANCY."
        difference: "Charges Lot.volume_gallons (the wine actually in the building) from each lot's aging_start_at. Gives a smaller number whenever a lot under-fills its vessel."
      - name: VESSEL_FOOTPRINT
        when: "GET /contracts/{id}/storage-accrual?variant=VESSEL_FOOTPRINT."
        difference: "Charges VesselAllocation.allocated_gallons (the cooperage tied up) from each allocation's committed_at, and keeps charging RELEASED allocations for the days they were held. For identical data it yields a strictly different cents figure whenever any allocated_gallons exceeds its lot's volume_gallons."

  - name: bottling_schedule
    trigger: "POST /bottling-runs (writes run_hours, scheduled_end, gallons_consumed from cases_planned) and BottlingRun SUPPLIES_RESERVED -> COMPLETED (recomputes gallons_consumed from cases_actual)"
    algorithm: interval_merge
    formula: |
      bottles_per_case = BOTTLES_PER_CASE[bottle_size_ml]      # 375 -> 24, 750 -> 12, 1500 -> 6
      run_hours        = ceil_to_quarter(cases_planned / BottlingLine.cases_per_hour)
                         # ceil_to_quarter(x) = ceil(x * 4) / 4
      scheduled_end    = scheduled_start
                         + run_hours hours
                         + BottlingLine.changeover_minutes minutes

      cases            = cases_planned at scheduling, cases_actual at completion
      gallons_consumed = round_half_up(cases * bottles_per_case * bottle_size_ml / ML_PER_GALLON, 2)

      # Line occupancy is a CLOSED interval [scheduled_start, scheduled_end]:
      # two runs on the same line collide when they merely touch at an endpoint,
      # because the changeover minutes are already baked into scheduled_end.
      # Aggregate daily capacity: the sum of run_hours over that line's runs with
      # status IN {SCHEDULED, SUPPLIES_RESERVED} whose scheduled_start falls on
      # the same UTC calendar day must not exceed BottlingLine.daily_capacity_hours.
    input_set: "One BottlingRun and its BottlingLine. Overlap and daily-capacity checks consider only that line's runs with status IN {SCHEDULED, SUPPLIES_RESERVED}; CANCELLED and COMPLETED runs are excluded from both."
    constants:
      ML_PER_GALLON: 3785.411784
      BOTTLES_PER_CASE_375: 24
      BOTTLES_PER_CASE_750: 12
      BOTTLES_PER_CASE_1500: 6
      LABELS_PER_BOTTLE: 2
    precision: "run_hours: exact multiple of 0.25, always rounded UP. gallons_consumed: 2 decimal places, round_half_up. scheduled_end carries three fractional second digits like every other datetime."
    variants: []

  - name: dry_goods_allocation
    trigger: "BottlingRun SCHEDULED -> SUPPLIES_RESERVED (POST /bottling-runs/{id}/transitions with action=RESERVE_SUPPLIES); writes BottlingRun.supply_reservations and each DryGoodsItem.reserved_units"
    algorithm: waterfall_allocation
    formula: |
      bottles = cases_planned * BOTTLES_PER_CASE[bottle_size_ml]
      required = { BOTTLE:   bottles,
                   CORK:     bottles,
                   CAPSULE:  bottles,
                   LABEL:    bottles * LABELS_PER_BOTTLE,
                   CASE_BOX: cases_planned }

      for each item_type T with required[T] > 0:
          # eligibility filter
          candidates = DryGoodsItems where client_id == the Lot's Contract.client_id
                                      and item_type == T
                                      and available_units > 0
          # ranking expression, then tie-break
          order candidates by available_units DESC, then created_at ASC
          # waterfall: drain the top-ranked item, then the next
          remaining = required[T]
          for item in ordered candidates:
              take = min(item.available_units, remaining)
              if take > 0: append { dry_goods_item_id: item.id, item_type: T, units_reserved: take }
              remaining -= take
              if remaining == 0: break
          # empty-pool / short-pool fallback
          if remaining > 0: reject the whole reservation with ERR_DRY_GOODS_SHORTAGE and
                            leave every DryGoodsItem untouched (all-or-nothing)
    input_set: "Only DryGoodsItems owned by the client that owns the run's Lot (via Lot.contract_id -> Contract.client_id) with available_units > 0. Items belonging to any other client are never drawn, even when the SKU matches."
    constants:
      LABELS_PER_BOTTLE: 2
      BOTTLES_PER_CASE_375: 24
      BOTTLES_PER_CASE_750: 12
      BOTTLES_PER_CASE_1500: 6
    precision: "Whole units. The reservation is all-or-nothing across every required item_type: if any type is short, no type is reserved."
    variants: []

  - name: ttb_reconciliation
    trigger: "TTBReport OPEN -> PREPARED and AMENDED -> PREPARED (POST /ttb-reports/{id}/transitions with action=PREPARE, whose optional variant field selects the reading and is stored on TTBReport.variant); writes opening_gallons, produced_gallons, removed_taxpaid_gallons, removed_in_bond_gallons, loss_gallons, closing_gallons and variance_gallons"
    algorithm: projection
    formula: |
      W = [period_start, period_end)          # half-open window

      opening_gallons = closing_gallons of this client's TTBReports with status == FILED
                        and period_end <= period_start, ranked by period_end DESC then
                        created_at ASC, taking the first; 0 when the set is empty

      removed_taxpaid_gallons = sum(ReleaseOrder.gallons) over EXECUTED orders on this
                        client's lots with release_type == TAXPAID_REMOVAL and executed_at in W
      removed_in_bond_gallons = sum(ReleaseOrder.gallons) over EXECUTED orders on this
                        client's lots with release_type == TRANSFER_IN_BOND and executed_at in W

      closing_gallons = sum(Lot.volume_gallons) over this client's Lots with
                        bond_status == IN_BOND, evaluated at prepare time (a physical count)

      # VARIANT BONDED (default): a blend merge is an internal bond-to-bond move.
      #   produced_gallons = sum(Lot.volume_gallons AT CREATION) over this client's Lots
      #                      with origin == INTAKE and created_at in W
      #   loss_gallons     = sum(Lot.loss_gallons booked in W: press losses plus blend
      #                      declared losses)
      #                      + sum(BottlingRun.gallons_consumed) over that client's runs
      #                        COMPLETED in W — bulk wine packaged into cased goods leaves
      #                        the bulk bonded account and must appear on this line, or the
      #                        physical closing count will not reconcile

      # VARIANT GROSS: every lot minted in the window counts as production, and every
      # gallon drawn into a blend counts as a removal to internal transfer.
      #   produced_gallons = BONDED produced_gallons
      #                      + sum(Lot.volume_gallons AT CREATION) over this client's Lots
      #                        with origin == BLEND and created_at in W
      #   loss_gallons     = BONDED loss_gallons
      #                      - sum(BlendTrial.projected_loss_gallons) for trials EXECUTED in W
      #                      + sum(BlendTrial.total_component_gallons) for trials EXECUTED in W

      variance_gallons = round_half_up(
          closing_gallons
          - (opening_gallons + produced_gallons - removed_taxpaid_gallons
             - removed_in_bond_gallons - loss_gallons), 2)
      # Both variants balance to variance_gallons == 0.00 on the same data; they
      # differ in the produced_gallons and loss_gallons lines they report.
    input_set: "Every subject is filtered to Lots and ReleaseOrders reachable from TTBReport.client_id through Lot.contract_id -> Contract.client_id and ReleaseOrder.lot_id -> Lot.contract_id -> Contract.client_id. Lots of other clients never enter any line."
    constants:
      GALLON_PRECISION: 2
    precision: "All gallon lines: 2 decimal places, round_half_up. variance_gallons is compared with == 0.00 exactly."
    variants:
      - name: BONDED
        when: "TTBReport.variant == BONDED (the default)."
        difference: "Treats a blend merge as an internal transfer that produces nothing and loses only the declared blending loss. produced_gallons counts only INTAKE-origin lots; loss_gallons carries press losses, blend declared losses and the gallons packaged out by COMPLETED bottling runs."
      - name: GROSS
        when: "TTBReport.variant == GROSS."
        difference: "Treats every minted lot as production and every gallon drawn into a blend as a loss line. For identical data produced_gallons is larger by the sum of blend lot volumes and loss_gallons is larger by the sum of component gallons minus the declared blend losses; variance_gallons still reconciles to 0.00."

  - name: excise_tax
    trigger: "ReleaseOrder APPROVED -> EXECUTED (POST /release-orders/{id}/transitions with action=EXECUTE); writes ReleaseOrder.excise_tax_cents"
    algorithm: tiered_pricing
    formula: |
      if release_type == TRANSFER_IN_BOND:
          excise_tax_cents = 0          # wine stays in bond; no tax is determined
          return

      start_gal = Client.taxpaid_gallons_ytd AS IT STANDS IMMEDIATELY BEFORE THIS EXECUTION
      end_gal   = start_gal + ReleaseOrder.gallons

      tiers = [ (0,                  EXCISE_TIER1_GALLONS, EXCISE_TIER1_CENTS_PER_GALLON),
                (EXCISE_TIER1_GALLONS, EXCISE_TIER2_GALLONS, EXCISE_TIER2_CENTS_PER_GALLON),
                (EXCISE_TIER2_GALLONS, +infinity,            EXCISE_TIER3_CENTS_PER_GALLON) ]

      excise_tax_cents = 0
      for (lo, hi, rate) in tiers:
          seg_lo = max(start_gal, lo); seg_hi = min(end_gal, hi)
          if seg_hi > seg_lo:
              excise_tax_cents += round_half_up((seg_hi - seg_lo) * rate)
    input_set: "One EXECUTED ReleaseOrder of release_type TAXPAID_REMOVAL, priced against Client.taxpaid_gallons_ytd accumulated from that client's EXECUTED TAXPAID_REMOVAL orders whose executed_at falls in the same calendar year as the logical clock. TRANSFER_IN_BOND orders never advance the accumulator and always price at 0."
    constants:
      EXCISE_TIER1_GALLONS: 30000
      EXCISE_TIER2_GALLONS: 130000
      EXCISE_TIER1_CENTS_PER_GALLON: 7
      EXCISE_TIER2_CENTS_PER_GALLON: 17
      EXCISE_TIER3_CENTS_PER_GALLON: 107
    precision: "Each tier segment rounded to whole cents with round_half_up before summation, matching crush_fee's pinned order."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST failing rule decides the response)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the endpoint's §1.5 roles list AND, on an endpoint that multiplexes several actions behind an action field, equals the §1.2 actor declared for the requested action (e.g. only FacilityAdmin may send APPROVE on POST /blend-trials/{id}/transitions, only ClientRep may send SUBMIT there, and only ComplianceOfficer may send APPROVE / REJECT / EXECUTE on POST /release-orders/{id}/transitions while only ClientRep may send CANCEL)."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 5
    category: business_constraint
    check: "Request body carries every required field for the endpoint, each field has the declared type, every enum value is a declared member, every numeric constraint (> 0, >= 0, ranges, decimal places) holds, and pagination limit is within 1..100 with offset >= 0. Unknown body fields are ignored, and fields whose §1.1 source is computed or system are ignored when supplied."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 10
    category: existence
    check: "Every id in the URL path resolves to a stored resource, validated left to right."
    error_id: ERR_CLIENT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_INTAKE_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_TRIAL_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_DRY_GOODS_ITEM_NOT_FOUND | ERR_TTB_REPORT_NOT_FOUND | ERR_RELEASE_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 15
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored resource: client_id, contract_id, vessel_id, lot_id, line_id, intake_ids[], components[].source_lot_id."
    error_id: ERR_CLIENT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_VESSEL_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_INTAKE_NOT_FOUND | ERR_LINE_NOT_FOUND
    http_status: 404
    applies_to: "POST /contracts, POST /vessel-allocations, POST /vessel-allocations/{id}/commit, POST /harvest-intakes, POST /lots, POST /blend-trials, POST /blend-trials/{id}/revise, POST /work-orders, POST /bottling-runs, POST /dry-goods-items, POST /ttb-reports, POST /release-orders"

  - priority: 20
    category: auth
    check: "When X-User-Role is ClientRep, X-User-ID must equal the Client.id that owns the target resource, resolved through Contract.client_id, Lot.contract_id -> Contract.client_id, BlendTrial.contract_id -> Contract.client_id, WorkOrder.lot_id -> Lot.contract_id -> Contract.client_id, ReleaseOrder.lot_id -> Lot.contract_id -> Contract.client_id, DryGoodsItem.client_id or TTBReport.client_id."
    error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints on which ClientRep appears in §1.5 roles"

  - priority: 30
    category: state
    check: "The target resource is in a state from which the requested transition is declared in §1.2 (including terminal-state lockdown and repeat-trigger idempotency rejection)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all POST action endpoints"

  - priority: 35
    category: state
    check: "The supplied expected_<parent>_version equals the parent's current version: expected_vessel_version against Vessel.version on POST /vessel-allocations, expected_contract_version against Contract.version on POST /blend-trials/{id}/execute, POST /work-orders/{id}/bill and POST /contracts/{id}/storage-accruals."
    error_id: ERR_STALE_VESSEL_VERSION | ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /vessel-allocations, POST /blend-trials/{id}/execute, POST /work-orders/{id}/bill, POST /contracts/{id}/storage-accruals"

  - priority: 40
    category: state
    check: "Cross-entity state gates hold: the governing Contract.status == ACTIVE; the governing Client.status == ACTIVE; the target Vessel.condition == CLEAN; the target BottlingLine.status == AVAILABLE; the housed Lot has a non-null current_vessel_id where the transition requires housing."
    error_id: ERR_CONTRACT_NOT_ACTIVE | ERR_CLIENT_NOT_ACTIVE | ERR_VESSEL_NOT_CLEAN | ERR_LINE_UNAVAILABLE | ERR_LOT_NOT_HOUSED
    http_status: 409
    applies_to: "POST /contracts/{id}/transitions, POST /vessel-allocations, POST /vessel-allocations/{id}/commit, POST /harvest-intakes/{id}/transitions, POST /lots/{id}/transitions, POST /blend-trials/{id}/transitions, POST /blend-trials/{id}/execute, POST /work-orders/{id}/transitions, POST /work-orders/{id}/bill, POST /bottling-runs, POST /release-orders/{id}/transitions"

  - priority: 50
    category: business_safety
    check: "Segregation of duties: the acting X-User-ID differs from the user recorded for the incompatible prior step — on POST /work-orders/{id}/bill the biller must not be WorkOrder.executed_by_user_id, and on POST /ttb-reports/{id}/transitions with action=FILE the filer must not be TTBReport.prepared_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /work-orders/{id}/bill, POST /ttb-reports/{id}/transitions"

  - priority: 55
    category: business_safety
    check: "The owning client has no TTBReport in status PREPARED whose [period_start, period_end) window contains the logical clock now — bonded books are frozen while a period is being prepared."
    error_id: ERR_REPORTING_PERIOD_LOCKED
    http_status: 409
    applies_to: "POST /release-orders/{id}/transitions with action=EXECUTE"

  - priority: 60
    category: business_referential
    check: "Cross-aggregate ownership holds: every intake in intake_ids has contract_id equal to the new Lot's contract_id; every components[].source_lot_id names a Lot whose contract_id equals the trial's contract_id; the lot named on POST /vessel-allocations/{id}/commit has contract_id equal to the allocation's contract_id; every DryGoodsItem drawn belongs to the client that owns the run's lot."
    error_id: ERR_CROSS_CONTRACT_REFERENCE
    http_status: 422
    applies_to: "POST /lots, POST /blend-trials, POST /blend-trials/{id}/revise, POST /vessel-allocations/{id}/commit, POST /bottling-runs/{id}/transitions"

  - priority: 62
    category: business_constraint
    check: "Uniqueness: Client.ttb_permit_number, Vessel.vessel_code, BottlingLine.line_code and HarvestIntake.delivery_ticket are each unique across all stored rows; a new TTBReport's [period_start, period_end) must not overlap another TTBReport for the same client whose status IN {OPEN, PREPARED, FILED, AMENDED}."
    error_id: ERR_DUPLICATE_PERMIT_NUMBER | ERR_DUPLICATE_VESSEL_CODE | ERR_DUPLICATE_LINE_CODE | ERR_DUPLICATE_DELIVERY_TICKET | ERR_TTB_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /clients, POST /vessels, POST /bottling-lines, POST /harvest-intakes, POST /ttb-reports"

  - priority: 65
    category: business_temporal
    check: "Interval sanity and window containment: end_at > start_at on POST /vessel-allocations; period_end > period_start on POST /ttb-reports; the intake's received_at lies inside [Contract.effective_from, Contract.effective_to) at ACCEPT; a VesselAllocation's [start_at, end_at) lies inside its Contract's effective window; a TTBReport's period_end is at or before the logical clock now when filing."
    error_id: ERR_INVALID_INTERVAL | ERR_OUTSIDE_CONTRACT_WINDOW | ERR_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /vessel-allocations, POST /ttb-reports, POST /harvest-intakes/{id}/transitions, POST /ttb-reports/{id}/transitions"

  - priority: 70
    category: business_constraint
    check: "Resource temporal-overlap. VESSEL (exclusive, half-open, trailing buffer): the requested [start_at, end_at) must not intersect [other.start_at, other.end_at + CLEANING_BUFFER_HOURS) for any other VesselAllocation on the same vessel with status IN {RESERVED, COMMITTED}. LINE (aggregate resource, CLOSED interval): the computed [scheduled_start, scheduled_end] must not intersect [other.scheduled_start, other.scheduled_end] for any other BottlingRun on the same line with status IN {SCHEDULED, SUPPLIES_RESERVED} — touching endpoints DO collide."
    error_id: ERR_VESSEL_OVERLAP | ERR_LINE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /vessel-allocations, POST /bottling-runs"

  - priority: 72
    category: business_constraint
    check: "Aggregate daily capacity: the sum of run_hours over that BottlingLine's runs with status IN {SCHEDULED, SUPPLIES_RESERVED} whose scheduled_start falls on the same UTC calendar day as the new run, plus the new run's run_hours, must be <= BottlingLine.daily_capacity_hours."
    error_id: ERR_LINE_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bottling-runs"

  - priority: 75
    category: business_fiscal
    check: "Vessel and contract entitlement: allocated_gallons <= Vessel.capacity_gallons; for a TANK vessel, Contract.gallons_allocated + allocated_gallons <= Contract.tank_gallons_entitled; for a BARREL vessel, Contract.barrel_slots_used + 1 <= Contract.barrel_slots_entitled; on commit, Lot.volume_gallons <= VesselAllocation.allocated_gallons."
    error_id: ERR_VESSEL_CAPACITY_EXCEEDED | ERR_TANK_ENTITLEMENT_EXCEEDED | ERR_BARREL_SLOTS_EXHAUSTED
    http_status: 422
    applies_to: "POST /vessel-allocations, POST /vessel-allocations/{id}/commit"

  - priority: 78
    category: business_fiscal
    check: "Volume sufficiency: intake_ids is non-empty and every named intake has status == ACCEPTED; every blend component's volume_gallons <= its source Lot.volume_gallons; ReleaseOrder.gallons <= Lot.volume_gallons; a bottling run's gallons_consumed <= Lot.volume_gallons; a press loss <= Lot.volume_gallons."
    error_id: ERR_NO_ELIGIBLE_INTAKES | ERR_INSUFFICIENT_LOT_VOLUME
    http_status: 422
    applies_to: "POST /lots, POST /blend-trials, POST /blend-trials/{id}/revise, POST /blend-trials/{id}/execute, POST /lots/{id}/transitions, POST /bottling-runs/{id}/transitions, POST /release-orders/{id}/transitions"

  - priority: 80
    category: business_fiscal
    check: "Dry-goods sufficiency: for every required item_type the client's eligible DryGoodsItems supply at least the required units per §1.3 dry_goods_allocation; the reservation is all-or-nothing across item types."
    error_id: ERR_DRY_GOODS_SHORTAGE
    http_status: 409
    applies_to: "POST /bottling-runs/{id}/transitions with action=RESERVE_SUPPLIES"

  - priority: 85
    category: business_safety
    check: "A TTBReport may only be filed when variance_gallons == 0.00; a Client may only be CLOSED when no Lot on any of its contracts has bond_status == IN_BOND together with volume_gallons > 0; a Contract may only be TERMINATED when it has no VesselAllocation with status IN {RESERVED, COMMITTED}."
    error_id: ERR_TTB_VARIANCE_UNBALANCED | ERR_CLIENT_HAS_BONDED_INVENTORY | ERR_ALLOCATIONS_OUTSTANDING
    http_status: 422
    applies_to: "POST /ttb-reports/{id}/transitions, POST /clients/{id}/status, POST /contracts/{id}/transitions"

  - priority: 90
    category: business_constraint
    check: "Blend and release label/compliance shape: a blend trial may only be APPROVED when projected_appellation_label != CALIFORNIA; a TRANSFER_IN_BOND release order must carry destination_permit_number and a TAXPAID_REMOVAL order must omit it or send null; an EXECUTED blend may only be UNWOUND while its result lot is untouched."
    error_id: ERR_APPELLATION_INELIGIBLE | ERR_DESTINATION_PERMIT_REQUIRED | ERR_BLEND_ALREADY_CONSUMED
    http_status: 422
    applies_to: "POST /blend-trials/{id}/transitions, POST /release-orders, POST /release-orders/{id}/transitions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- logical clock (test-driving; §1.5 priority-ladder rung 3) -------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Every server-stamped instant is read from it — created_at and updated_at on every entity, plus received_at, committed_at, released_at, aging_start_at, executed_at and filed_at — and every window, buffer and deadline rule is evaluated against it. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock repositioned; no stored entity is mutated"]

  # ---- Client ---------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Registers a custom-crush client (a bonded winery customer of the facility)."
    roles: [FacilityAdmin]
    code: 201
    input: [name, ttb_permit_number, contact_email]
    output: Client
    side_effects: ["Client created with status ACTIVE, bond_gallons_in_bond 0, taxpaid_gallons_ytd 0, version 1"]

  - method: GET
    path: "/clients/{id}"
    description: "Reads one client, including the derived bonded-inventory figures."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "Lists clients with pagination; ClientRep sees only its own client."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: POST
    path: "/clients/{id}/status"
    description: "Drives the Client status machine: SUSPEND, REINSTATE or CLOSE."
    roles: [FacilityAdmin]
    code: 200
    input: [action]
    output: Client
    side_effects:
      - "SUSPEND cascades ACTIVE contracts to SUSPENDED, which cancels their RESERVED allocations, which recomputes Contract.gallons_allocated and Contract.barrel_slots_used"
      - "REINSTATE returns SUSPENDED contracts to ACTIVE without restoring cancelled allocations"
      - "CLOSE terminates every non-terminal contract of the client"

  # ---- Contract -------------------------------------------------------------
  - method: POST
    path: "/contracts"
    description: "Creates a harvest-year custom-crush contract in DRAFT."
    roles: [FacilityAdmin]
    code: 201
    input: [client_id, harvest_year, committed_tons, tank_gallons_entitled, barrel_slots_entitled, crush_rate_cents_per_ton, storage_rate_cents_per_gallon_month, labor_rate_cents_per_hour, effective_from, effective_to]
    output: Contract
    side_effects: ["Contract created in DRAFT with all derived counters at 0 and storage_billed_through null"]

  - method: GET
    path: "/contracts/{id}"
    description: "Reads one contract with its derived tonnage, allocation and billing counters."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "Lists contracts, optionally narrowed to one client, status or harvest year."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["client_id?", "status?", "harvest_year?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: POST
    path: "/contracts/{id}/transitions"
    description: "Drives the Contract state machine: SUBMIT, REVISE, ACTIVATE, SUSPEND, REINSTATE, TERMINATE."
    roles: [FacilityAdmin]
    code: 200
    input: [action]
    output: Contract
    side_effects:
      - "increments Contract.version by 1"
      - "SUSPEND cancels this contract's RESERVED allocations and recomputes gallons_allocated and barrel_slots_used"

  - method: GET
    path: "/contracts/{id}/storage-accrual"
    description: "Read-only storage-fee projection through through_at. Returns the OCCUPANCY reading by default and the VESSEL_FOOTPRINT reading when variant=VESSEL_FOOTPRINT; nothing is posted."
    roles: [FacilityAdmin, ComplianceOfficer, ClientRep]
    code: 200
    input: ["through_at", "variant?"]
    output: { contract_id: string, variant: string, through_at: datetime, subject_count: integer, charge_cents: integer }
    side_effects: []

  - method: POST
    path: "/contracts/{id}/storage-accruals"
    description: "Posts the OCCUPANCY storage accrual through through_at to the contract ledger."
    roles: [FacilityAdmin]
    code: 200
    input: [through_at, expected_contract_version]
    output: Contract
    side_effects:
      - "Contract.billed_total_cents += the OCCUPANCY charge_cents from §1.3 storage_accrual"
      - "Contract.storage_billed_through := through_at"
      - "increments Contract.version by 1"

  # ---- Vessel ---------------------------------------------------------------
  - method: POST
    path: "/vessels"
    description: "Registers a tank or barrel as a facility asset."
    roles: [FacilityAdmin]
    code: 201
    input: [vessel_code, vessel_type, capacity_gallons, facility_zone]
    output: Vessel
    side_effects: ["Vessel created with condition CLEAN and last_released_at null"]

  - method: GET
    path: "/vessels/{id}"
    description: "Reads one vessel including its condition and last_released_at watermark."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: GET
    path: "/vessels"
    description: "Lists vessels, optionally narrowed by type, condition or zone."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["vessel_type?", "condition?", "facility_zone?", "limit?", "offset?"]
    output: Vessel[]
    side_effects: []

  - method: POST
    path: "/vessels/{id}/condition"
    description: "Drives the Vessel condition machine: CLEAN, DECOMMISSION or RECOMMISSION."
    roles: [FacilityAdmin, CellarSupervisor]
    code: 200
    input: [action]
    output: Vessel
    side_effects: ["increments Vessel.version by 1"]

  # ---- VesselAllocation -----------------------------------------------------
  - method: POST
    path: "/vessel-allocations"
    description: "Reserves an occupancy window on a vessel against a contract's entitlement."
    roles: [FacilityAdmin, CellarSupervisor]
    code: 201
    input: [contract_id, vessel_id, start_at, end_at, allocated_gallons, expected_vessel_version]
    output: VesselAllocation
    side_effects:
      - "VesselAllocation created in RESERVED with lot_id null"
      - "Contract.gallons_allocated or Contract.barrel_slots_used recomputed; increments Contract.version by 1"
      - "increments Vessel.version by 1"

  - method: GET
    path: "/vessel-allocations/{id}"
    description: "Reads one vessel allocation."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: VesselAllocation
    side_effects: []

  - method: GET
    path: "/vessel-allocations"
    description: "Lists vessel allocations, optionally narrowed by contract, vessel, lot or status."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["contract_id?", "vessel_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: VesselAllocation[]
    side_effects: []

  - method: POST
    path: "/vessel-allocations/{id}/commit"
    description: "Places a specific lot into a RESERVED allocation, moving it to COMMITTED."
    roles: [CellarSupervisor]
    code: 200
    input: [lot_id]
    output: VesselAllocation
    side_effects:
      - "VesselAllocation.lot_id and committed_at set; status := COMMITTED"
      - "Lot.current_vessel_id := the allocation's vessel_id; increments Lot.version by 1"

  - method: POST
    path: "/vessel-allocations/{id}/transitions"
    description: "Drives the VesselAllocation branches: RELEASE (dirties the vessel) or CANCEL (does not)."
    roles: [FacilityAdmin, CellarSupervisor]
    code: 200
    input: [action]
    output: VesselAllocation
    side_effects:
      - "RELEASE: Lot.current_vessel_id := null; Vessel.condition := DIRTY; Vessel.last_released_at := end_at; Contract counters recomputed"
      - "CANCEL: Contract counters recomputed; the Vessel is left untouched"

  # ---- HarvestIntake --------------------------------------------------------
  - method: POST
    path: "/harvest-intakes"
    description: "Records a truckload weigh-in at the crush pad."
    roles: [CellarSupervisor]
    code: 201
    input: [contract_id, delivery_ticket, varietal, appellation, block_code, gross_weight_lbs, tare_weight_lbs]
    output: HarvestIntake
    side_effects: ["HarvestIntake created in WEIGHED with net_weight_lbs computed and received_at stamped from the logical clock"]

  - method: GET
    path: "/harvest-intakes/{id}"
    description: "Reads one harvest intake including its yield and crush-fee figures."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: HarvestIntake
    side_effects: []

  - method: GET
    path: "/harvest-intakes"
    description: "Lists harvest intakes, optionally narrowed by contract, assigned lot or status."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["contract_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: HarvestIntake[]
    side_effects: []

  - method: POST
    path: "/harvest-intakes/{id}/transitions"
    description: "Drives the HarvestIntake machine: SAMPLE (records brix and ph), ACCEPT (computes yield and crush fee) or REJECT."
    roles: [CellarSupervisor]
    code: 200
    input: ["action", "brix?", "ph?", "rejection_reason?"]
    output: HarvestIntake
    side_effects:
      - "ACCEPT writes estimated_gallons per §1.3 intake_yield and crush_fee_cents per §1.3 crush_fee"
      - "ACCEPT advances Contract.tons_received and Contract.billed_total_cents; increments Contract.version by 1"

  # ---- Lot ------------------------------------------------------------------
  - method: POST
    path: "/lots"
    description: "Creates a wine lot from one or more ACCEPTED harvest intakes."
    roles: [CellarSupervisor]
    code: 201
    input: [contract_id, lot_code, vintage_year, intake_ids]
    output: Lot
    side_effects:
      - "Lot created with origin INTAKE, production_status JUICE, bond_status IN_BOND and the §1.3 lot_composition figures"
      - "each named HarvestIntake moves ACCEPTED -> ASSIGNED and takes lot_id"
      - "Client.bond_gallons_in_bond recomputed"

  - method: GET
    path: "/lots/{id}"
    description: "Reads one lot on both axes: production_status and bond_status."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/lots"
    description: "Lists lots, optionally narrowed by contract, housing vessel, blend parent, or either status axis."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["contract_id?", "current_vessel_id?", "parent_lot_id?", "production_status?", "bond_status?", "origin?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: POST
    path: "/lots/{id}/transitions"
    description: "Drives the Lot production axis: START_FERMENTATION, PRESS (books a loss and fixes alcohol_pct) or START_AGING (starts the storage clock)."
    roles: [CellarSupervisor]
    code: 200
    input: ["action", "loss_gallons?"]
    output: Lot
    side_effects:
      - "PRESS moves loss_gallons out of volume_gallons and writes alcohol_pct"
      - "START_AGING stamps aging_start_at from the logical clock"
      - "Client.bond_gallons_in_bond recomputed"

  - method: GET
    path: "/lots/{id}/traceability"
    description: "Computed read: the lot's full provenance — the intakes it was built from, its blend component manifest, and the transitive ancestor lot ids reachable through blend lineage."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: { lot_id: string, origin: string, source_intake_ids: array, component_manifest: array, ancestor_lot_ids: array, total_source_gallons: number }
    side_effects: []

  # ---- BlendTrial -----------------------------------------------------------
  - method: POST
    path: "/blend-trials"
    description: "Creates a blending trial in DRAFT with its component draw list."
    roles: [ClientRep]
    code: 201
    input: [contract_id, trial_name, target_lot_code, declared_loss_pct, components]
    output: BlendTrial
    side_effects: ["BlendTrial created in DRAFT at round_number 1 with the §1.3 blend_projection figures"]

  - method: GET
    path: "/blend-trials/{id}"
    description: "Reads one blending trial including its projections and revision round."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: BlendTrial
    side_effects: []

  - method: GET
    path: "/blend-trials"
    description: "Lists blending trials, optionally narrowed by contract, result lot or status."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["contract_id?", "result_lot_id?", "status?", "limit?", "offset?"]
    output: BlendTrial[]
    side_effects: []

  - method: POST
    path: "/blend-trials/{id}/revise"
    description: "Resubmits a REVISION_REQUESTED trial with a replacement component list, closing the revision cycle."
    roles: [ClientRep]
    code: 200
    input: ["components", "declared_loss_pct?"]
    output: BlendTrial
    side_effects:
      - "components replaced; round_number incremented by 1; revision_note cleared; status := SUBMITTED"
      - "every projected_* field recomputed per §1.3 blend_projection"

  - method: POST
    path: "/blend-trials/{id}/transitions"
    description: "Drives the BlendTrial machine: SUBMIT, REQUEST_REVISION, APPROVE, REJECT or UNWIND."
    roles: [ClientRep, FacilityAdmin]
    code: 200
    input: ["action", "revision_note?"]
    output: BlendTrial
    side_effects:
      - "SUBMIT recomputes every projected_* field and stamps submitted_by_user_id"
      - "APPROVE stamps approved_by_user_id"
      - "UNWIND restores every source lot's volume_gallons and parent_lot_id, empties the result lot, and recomputes Client.bond_gallons_in_bond"

  - method: POST
    path: "/blend-trials/{id}/execute"
    description: "Executes an APPROVED trial: mints the blend lot, draws the components down and cascades through allocations, vessels and contract counters."
    roles: [ClientRep]
    code: 200
    input: [expected_contract_version]
    output: BlendTrial
    side_effects:
      - "a BLEND-origin Lot is minted in AGING / IN_BOND with the component_manifest traceability array"
      - "each fully drawn source Lot moves AGING -> CONSUMED, which releases its COMMITTED VesselAllocation, which dirties that Vessel, which recomputes Contract.gallons_allocated"
      - "increments Contract.version by 1; Client.bond_gallons_in_bond recomputed"

  # ---- WorkOrder ------------------------------------------------------------
  - method: POST
    path: "/work-orders"
    description: "Requests a fermentation-protocol cellar operation against a lot."
    roles: [ClientRep, CellarSupervisor]
    code: 201
    input: ["lot_id", "operation_type", "scheduled_at", "labor_hours", "crew_size", "material_cost_cents?", "rush?"]
    output: WorkOrder
    side_effects: ["WorkOrder created in REQUESTED with every billing figure at 0"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Reads one work order including its billing breakdown."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "Lists work orders, optionally narrowed by lot, status or operation type."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["lot_id?", "status?", "operation_type?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/transitions"
    description: "Drives the WorkOrder machine: SCHEDULE, START, COMPLETE, DISPUTE or CANCEL."
    roles: [CellarSupervisor, FacilityAdmin, ClientRep]
    code: 200
    input: ["action", "actual_labor_hours?", "dispute_reason?"]
    output: WorkOrder
    side_effects:
      - "START stamps executed_by_user_id from X-User-ID"
      - "COMPLETE stores actual_labor_hours"
      - "DISPUTE subtracts billable_amount_cents from Contract.billed_total_cents, zeroes the billing figures and increments Contract.version by 1"

  - method: POST
    path: "/work-orders/{id}/bill"
    description: "Bills a COMPLETED work order onto the contract ledger. The biller must not be the supervisor who executed it."
    roles: [FacilityAdmin]
    code: 200
    input: [expected_contract_version]
    output: WorkOrder
    side_effects:
      - "writes base_labor_cents, rush_surcharge_cents, subtotal_cents, volume_discount_pct and billable_amount_cents per §1.3 work_order_billing"
      - "Contract.billed_total_cents += billable_amount_cents; increments Contract.version by 1"

  # ---- BottlingLine ---------------------------------------------------------
  - method: POST
    path: "/bottling-lines"
    description: "Registers a bottling line with its throughput, changeover and daily capacity."
    roles: [FacilityAdmin]
    code: 201
    input: ["line_code", "cases_per_hour", "changeover_minutes", "daily_capacity_hours?"]
    output: BottlingLine
    side_effects: ["BottlingLine created with status AVAILABLE"]

  - method: GET
    path: "/bottling-lines/{id}"
    description: "Reads one bottling line."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: BottlingLine
    side_effects: []

  - method: GET
    path: "/bottling-lines"
    description: "Lists bottling lines."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BottlingLine[]
    side_effects: []

  - method: POST
    path: "/bottling-lines/{id}/status"
    description: "Takes a bottling line out of service for maintenance (SET_MAINTENANCE) or returns it to service (SET_AVAILABLE)."
    roles: [FacilityAdmin]
    code: 200
    input: [action]
    output: BottlingLine
    side_effects: ["BottlingLine.status := MAINTENANCE or AVAILABLE; increments BottlingLine.version by 1; already-SCHEDULED runs are left untouched"]

  # ---- BottlingRun ----------------------------------------------------------
  - method: POST
    path: "/bottling-runs"
    description: "Schedules a bottling run, computing run_hours and the closed line-occupancy window."
    roles: [CellarSupervisor]
    code: 201
    input: [lot_id, line_id, scheduled_start, bottle_size_ml, cases_planned]
    output: BottlingRun
    side_effects: ["BottlingRun created in SCHEDULED with run_hours, scheduled_end and gallons_consumed from §1.3 bottling_schedule"]

  - method: GET
    path: "/bottling-runs/{id}"
    description: "Reads one bottling run including its supply reservations."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: BottlingRun
    side_effects: []

  - method: GET
    path: "/bottling-runs"
    description: "Lists bottling runs, optionally narrowed by lot, line or status."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["lot_id?", "line_id?", "status?", "limit?", "offset?"]
    output: BottlingRun[]
    side_effects: []

  - method: POST
    path: "/bottling-runs/{id}/transitions"
    description: "Drives the BottlingRun machine: RESERVE_SUPPLIES (waterfall draw on dry goods), COMPLETE or CANCEL (returns every reserved unit)."
    roles: [CellarSupervisor]
    code: 200
    input: ["action", "cases_actual?"]
    output: BottlingRun
    side_effects:
      - "RESERVE_SUPPLIES writes supply_reservations and raises DryGoodsItem.reserved_units"
      - "COMPLETE consumes on_hand_units, draws Lot.volume_gallons down and can cascade the lot to BOTTLED, releasing its allocation and dirtying its vessel"
      - "CANCEL returns every reserved unit and empties supply_reservations"

  # ---- DryGoodsItem ---------------------------------------------------------
  - method: POST
    path: "/dry-goods-items"
    description: "Registers a client-owned dry-goods SKU held at the facility."
    roles: [FacilityAdmin]
    code: 201
    input: ["client_id", "sku", "item_type", "units_per_case", "initial_units?"]
    output: DryGoodsItem
    side_effects: ["DryGoodsItem created with on_hand_units := initial_units (default 0), reserved_units 0 and available_units := on_hand_units"]

  - method: GET
    path: "/dry-goods-items/{id}"
    description: "Reads one dry-goods item with its reserved and available unit counts."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: DryGoodsItem
    side_effects: []

  - method: GET
    path: "/dry-goods-items"
    description: "Lists dry-goods items, optionally narrowed by owning client or item type."
    roles: [FacilityAdmin, CellarSupervisor, ComplianceOfficer, ClientRep]
    code: 200
    input: ["client_id?", "item_type?", "limit?", "offset?"]
    output: DryGoodsItem[]
    side_effects: []

  - method: POST
    path: "/dry-goods-items/{id}/receipts"
    description: "Receives additional units of a dry-goods SKU into the facility."
    roles: [FacilityAdmin]
    code: 200
    input: [units]
    output: DryGoodsItem
    side_effects: ["on_hand_units += units; available_units recomputed as on_hand_units - reserved_units; increments DryGoodsItem.version by 1"]

  # ---- TTBReport ------------------------------------------------------------
  - method: POST
    path: "/ttb-reports"
    description: "Opens a bonded-inventory reporting period for one client, pinning which reconciliation variant will be used."
    roles: [ComplianceOfficer]
    code: 201
    input: [client_id, period_start, period_end]
    output: TTBReport
    side_effects: ["TTBReport created in OPEN with every gallon line at 0 and variant defaulted to BONDED"]

  - method: GET
    path: "/ttb-reports/{id}"
    description: "Reads one TTB report including every reconciliation line and the variance."
    roles: [FacilityAdmin, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: TTBReport
    side_effects: []

  - method: GET
    path: "/ttb-reports"
    description: "Lists TTB reports, optionally narrowed by client or status."
    roles: [FacilityAdmin, ComplianceOfficer, ClientRep]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: TTBReport[]
    side_effects: []

  - method: POST
    path: "/ttb-reports/{id}/transitions"
    description: "Drives the TTBReport machine: PREPARE (runs §1.3 ttb_reconciliation under the variant supplied on the action, defaulting to BONDED), RECALL, FILE (segregation of duties plus a zero variance) or AMEND."
    roles: [ComplianceOfficer]
    code: 200
    input: ["action", "variant?"]
    output: TTBReport
    side_effects:
      - "PREPARE writes every gallon line and stamps prepared_by_user_id"
      - "FILE stamps filed_by_user_id and filed_at and recomputes Client.last_filed_period_end"
      - "AMEND increments amendment_count and reopens the report for a corrected PREPARE"

  # ---- ReleaseOrder ---------------------------------------------------------
  - method: POST
    path: "/release-orders"
    description: "Requests removal of wine from bond, either as a taxpaid removal or as a transfer in bond to another bonded premise."
    roles: [ClientRep]
    code: 201
    input: ["lot_id", "release_type", "gallons", "cases?", "destination_permit_number?"]
    output: ReleaseOrder
    side_effects: ["ReleaseOrder created in REQUESTED with excise_tax_cents 0 and requested_by_user_id stamped from X-User-ID"]

  - method: GET
    path: "/release-orders/{id}"
    description: "Reads one release order including its computed excise tax."
    roles: [FacilityAdmin, ComplianceOfficer, ClientRep]
    code: 200
    input: []
    output: ReleaseOrder
    side_effects: []

  - method: GET
    path: "/release-orders"
    description: "Lists release orders, optionally narrowed by lot, status or release type."
    roles: [FacilityAdmin, ComplianceOfficer, ClientRep]
    code: 200
    input: ["lot_id?", "status?", "release_type?", "limit?", "offset?"]
    output: ReleaseOrder[]
    side_effects: []

  - method: POST
    path: "/release-orders/{id}/transitions"
    description: "Drives the ReleaseOrder fork: APPROVE, REJECT, CANCEL or EXECUTE (whose side effects diverge by release_type)."
    roles: [ComplianceOfficer, ClientRep]
    code: 200
    input: ["action", "rejection_reason?"]
    output: ReleaseOrder
    side_effects:
      - "APPROVE moves a TAXPAID_REMOVAL lot IN_BOND -> TAX_DETERMINED and leaves a TRANSFER_IN_BOND lot at IN_BOND"
      - "EXECUTE / TAXPAID_REMOVAL: writes excise_tax_cents per §1.3 excise_tax and advances Client.taxpaid_gallons_ytd"
      - "EXECUTE / TRANSFER_IN_BOND: excise_tax_cents stays 0 and Client.taxpaid_gallons_ytd is untouched"
      - "both EXECUTE branches draw Lot.volume_gallons down and recompute Client.bond_gallons_in_bond"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty, or X-User-Role is not one of the four declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the target endpoint's §1.5 roles."
  - id: ERR_CLIENT_SCOPE_VIOLATION
    http: 403
    condition: "A ClientRep acts on a resource that does not resolve back to the Client named by its X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the user recorded for the incompatible prior step: billing a work order one executed, or filing a TTB report one prepared."

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, undeclared enum member, violated numeric constraint, or pagination limit outside 1..100 / offset below 0."

  # --- existence -------------------------------------------------------------
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "No Client matches the id in the path or in client_id."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "No Contract matches the id in the path or in contract_id."
  - id: ERR_VESSEL_NOT_FOUND
    http: 404
    condition: "No Vessel matches the id in the path or in vessel_id."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No VesselAllocation matches the id in the path."
  - id: ERR_INTAKE_NOT_FOUND
    http: 404
    condition: "No HarvestIntake matches the id in the path or an entry of intake_ids."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "No Lot matches the id in the path, in lot_id, or in a components[].source_lot_id entry."
  - id: ERR_TRIAL_NOT_FOUND
    http: 404
    condition: "No BlendTrial matches the id in the path."
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "No WorkOrder matches the id in the path."
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "No BottlingLine matches the id in the path or in line_id."
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "No BottlingRun matches the id in the path."
  - id: ERR_DRY_GOODS_ITEM_NOT_FOUND
    http: 404
    condition: "No DryGoodsItem matches the id in the path."
  - id: ERR_TTB_REPORT_NOT_FOUND
    http: 404
    condition: "No TTBReport matches the id in the path."
  - id: ERR_RELEASE_ORDER_NOT_FOUND
    http: 404
    condition: "No ReleaseOrder matches the id in the path."

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested action is not a declared §1.2 transition out of the target's current state, including repeating a trigger that already fired and any action out of a terminal state."
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "The governing Contract is not in status ACTIVE when the operation requires it (allocation reserve/commit, intake ACCEPT, blend SUBMIT/EXECUTE, work-order SCHEDULE/BILL)."
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "The governing Client is not in status ACTIVE when the operation requires it (contract ACTIVATE/REINSTATE, release-order APPROVE)."
  - id: ERR_VESSEL_NOT_CLEAN
    http: 409
    condition: "A lot is committed into a vessel whose condition is DIRTY or OUT_OF_SERVICE."
  - id: ERR_LINE_UNAVAILABLE
    http: 409
    condition: "A bottling run is scheduled on a BottlingLine whose status is MAINTENANCE."
  - id: ERR_LOT_NOT_HOUSED
    http: 409
    condition: "Fermentation is started on a Lot whose current_vessel_id is null."
  - id: ERR_STALE_VESSEL_VERSION
    http: 412
    condition: "expected_vessel_version on POST /vessel-allocations does not equal the Vessel's current version."
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the Contract's current version on blend execute, work-order bill or storage-accrual post."
  - id: ERR_REPORTING_PERIOD_LOCKED
    http: 409
    condition: "A release order is executed while the owning client has a TTBReport in status PREPARED whose window contains the logical clock now."

  # --- referential / uniqueness ---------------------------------------------
  - id: ERR_CROSS_CONTRACT_REFERENCE
    http: 422
    condition: "An intake, source lot, committed lot or dry-goods item belongs to a different contract or client than the operation's own aggregate."
  - id: ERR_DUPLICATE_PERMIT_NUMBER
    http: 409
    condition: "ttb_permit_number is already held by another Client."
  - id: ERR_DUPLICATE_VESSEL_CODE
    http: 409
    condition: "vessel_code is already held by another Vessel."
  - id: ERR_DUPLICATE_LINE_CODE
    http: 409
    condition: "line_code is already held by another BottlingLine."
  - id: ERR_DUPLICATE_DELIVERY_TICKET
    http: 409
    condition: "delivery_ticket is already held by another HarvestIntake."
  - id: ERR_TTB_PERIOD_OVERLAP
    http: 409
    condition: "The requested reporting window overlaps another TTBReport for the same client."

  # --- temporal --------------------------------------------------------------
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "end_at <= start_at on an allocation, or period_end <= period_start on a TTB report."
  - id: ERR_OUTSIDE_CONTRACT_WINDOW
    http: 422
    condition: "An intake's received_at, or an allocation's [start_at, end_at), falls outside [Contract.effective_from, Contract.effective_to)."
  - id: ERR_PERIOD_NOT_CLOSED
    http: 422
    condition: "A TTB report is filed while its period_end is still after the logical clock now."
  - id: ERR_VESSEL_OVERLAP
    http: 409
    condition: "The requested [start_at, end_at) intersects [other.start_at, other.end_at + 48 hours) on the same vessel — the trailing 48-hour cleaning buffer is part of the occupied interval."
  - id: ERR_LINE_SLOT_CONFLICT
    http: 409
    condition: "The computed closed window [scheduled_start, scheduled_end] intersects another live run's closed window on the same line; endpoints that merely touch DO collide."
  - id: ERR_LINE_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "Adding this run's run_hours would push that line's same-UTC-day scheduled hours past daily_capacity_hours."

  # --- fiscal / capacity -----------------------------------------------------
  - id: ERR_VESSEL_CAPACITY_EXCEEDED
    http: 422
    condition: "allocated_gallons exceeds Vessel.capacity_gallons, or the committed Lot.volume_gallons exceeds the allocation's allocated_gallons."
  - id: ERR_TANK_ENTITLEMENT_EXCEEDED
    http: 422
    condition: "Contract.gallons_allocated + allocated_gallons would exceed Contract.tank_gallons_entitled on a TANK vessel."
  - id: ERR_BARREL_SLOTS_EXHAUSTED
    http: 422
    condition: "Contract.barrel_slots_used + 1 would exceed Contract.barrel_slots_entitled on a BARREL vessel."
  - id: ERR_NO_ELIGIBLE_INTAKES
    http: 422
    condition: "intake_ids is empty, or a named intake is not in status ACCEPTED."
  - id: ERR_INSUFFICIENT_LOT_VOLUME
    http: 422
    condition: "A blend component, press loss, bottling draw or release quantity exceeds the source Lot's volume_gallons."
  - id: ERR_DRY_GOODS_SHORTAGE
    http: 409
    condition: "The client's eligible dry-goods pool cannot cover the required units for at least one item_type; nothing is reserved."

  # --- compliance / label ----------------------------------------------------
  - id: ERR_TTB_VARIANCE_UNBALANCED
    http: 422
    condition: "A TTB report is filed while variance_gallons != 0.00."
  - id: ERR_CLIENT_HAS_BONDED_INVENTORY
    http: 422
    condition: "A client is closed while any of its lots still holds bond_status IN_BOND with volume_gallons > 0."
  - id: ERR_ALLOCATIONS_OUTSTANDING
    http: 422
    condition: "A contract is terminated while it still owns a VesselAllocation in status RESERVED or COMMITTED."
  - id: ERR_APPELLATION_INELIGIBLE
    http: 422
    condition: "A blend trial is approved while its projected_appellation_label is CALIFORNIA — no dominant AVA reaches the 85.00 percent share."
  - id: ERR_DESTINATION_PERMIT_REQUIRED
    http: 422
    condition: "A TRANSFER_IN_BOND release order omits destination_permit_number, or a TAXPAID_REMOVAL order supplies a non-null one."
  - id: ERR_BLEND_ALREADY_CONSUMED
    http: 422
    condition: "An EXECUTED blend trial is unwound after its result lot has been bottled, blended onward or drawn down by a release."

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:

  - name: FacilityAdmin
    description: "Napa custom-crush facility operations manager. Owns the commercial surface — clients, contracts, cooperage, bottling lines, dry goods — and is the only role that may bill a work order onto the contract ledger."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{id}/status"
      - "POST /contracts"
      - "POST /contracts/{id}/transitions"
      - "POST /contracts/{id}/storage-accruals"
      - "POST /vessels"
      - "POST /bottling-lines"
      - "POST /dry-goods-items"
      - "POST /dry-goods-items/{id}/receipts"
      - "POST /work-orders/{id}/bill"
    shared_operations:
      - "POST /vessels/{id}/condition (with CellarSupervisor)"
      - "POST /vessel-allocations (with CellarSupervisor)"
      - "POST /vessel-allocations/{id}/transitions (with CellarSupervisor)"
      - "POST /blend-trials/{id}/transitions — REQUEST_REVISION, APPROVE, REJECT, UNWIND (with ClientRep, which owns SUBMIT)"
      - "POST /work-orders/{id}/transitions (with CellarSupervisor and ClientRep)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET endpoints except the TTB and release-order reads shared only with ComplianceOfficer and ClientRep"

  - name: CellarSupervisor
    description: "Cellar floor lead. Runs the physical wine: weigh-ins, sampling, lot creation, vessel commits and releases, production transitions, and bottling runs. May never bill — the biller must be a different user, which the segregation-of-duties rule enforces."
    identity: "opaque"
    exclusive_operations:
      - "POST /harvest-intakes"
      - "POST /harvest-intakes/{id}/transitions"
      - "POST /lots"
      - "POST /lots/{id}/transitions"
      - "POST /vessel-allocations/{id}/commit"
      - "POST /bottling-runs"
      - "POST /bottling-runs/{id}/transitions"
    shared_operations:
      - "POST /vessels/{id}/condition (with FacilityAdmin)"
      - "POST /vessel-allocations (with FacilityAdmin)"
      - "POST /vessel-allocations/{id}/transitions (with FacilityAdmin)"
      - "POST /work-orders (with ClientRep)"
      - "POST /work-orders/{id}/transitions — SCHEDULE, START, COMPLETE (with FacilityAdmin and ClientRep)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET endpoints except the TTB report and release-order reads"

  - name: ComplianceOfficer
    description: "Bonded-premises compliance officer. Owns TTB reporting and the removal-from-bond gate. Two distinct officer user ids are required to file a report: one prepares, another files."
    identity: "opaque"
    exclusive_operations:
      - "POST /ttb-reports"
      - "POST /ttb-reports/{id}/transitions"
      - "POST /release-orders/{id}/transitions — APPROVE, REJECT, EXECUTE"
    shared_operations:
      - "POST /release-orders/{id}/transitions — CANCEL is the ClientRep's action on the same endpoint"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET /ttb-reports, GET /ttb-reports/{id}, GET /release-orders, GET /release-orders/{id} (with FacilityAdmin and the owning ClientRep)"
      - "all other GET endpoints"

  - name: ClientRep
    description: "The client winery's winemaker. X-User-ID is the Client.id it acts for, so every read and write is scoped to that client's own contracts, lots, trials, work orders and release orders."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /blend-trials"
      - "POST /blend-trials/{id}/revise"
      - "POST /blend-trials/{id}/execute"
      - "POST /release-orders"
    shared_operations:
      - "POST /work-orders (with CellarSupervisor)"
      - "POST /work-orders/{id}/transitions — DISPUTE and CANCEL (with CellarSupervisor and FacilityAdmin)"
      - "POST /blend-trials/{id}/transitions — SUBMIT (with FacilityAdmin, which owns the review actions)"
      - "POST /release-orders/{id}/transitions — CANCEL (with ComplianceOfficer, which owns APPROVE/REJECT/EXECUTE)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET endpoints, always narrowed to the caller's own client"
