        as: PermitOfficer
      - call: GET /aquarium/permits/${pm_id}
        payload: {}
        as: PermitOfficer
      assert:
      - 'first submission: HTTP 422 and data.error_id == ERR_MISSING_DOCUMENTS'
      - Permit.missing_document_codes == ["HEALTH_CERTIFICATE", "IMPORT_LICENSE", "CITES_PERMIT", "ESA_AUTHORIZATION"] — required order, ORIGIN_DECLARATION absent because it was supplied
      - Permit.status == DRAFT and submission_round == 0 after the rejection
      - 'second submission: HTTP 200, Permit.status == SUBMITTED, submission_round == 1, missing_document_codes == []'
      - Permit.document_codes now holds the five replacement codes
      - AcquisitionRequest.status == PENDING_PERMIT throughout
  - name: calc_receiving_eligibility_needs_both_the_status_set_and_the_score_floor
    claim_type: Correct Result
    grounds:
    - §1.3 derived_flag_reconciliation Institution.is_receiving_eligible (accreditation_status IN {ACCREDITED, PROVISIONAL} and welfare_audit_score >= MIN_RECEIVER_WELFARE_SCORE 70.0)
    - §1.1 Institution.is_receiving_eligible (default false)
    - §1.5 GET /aquarium/institutions (is_receiving_eligible filter)
    - §1.5 PATCH /aquarium/institutions/{id}
    distinguishing_aspect: 'Four institutions are created: only the ACCREDITED / 88.00 row is eligible. A SUSPENDED row scoring 99.00 and a NON_ACCREDITED row scoring 100.00 both fail the membership clause despite high scores, and an ACCREDITED row scoring 69.99 fails the floor by one hundredth — proving the two clauses are conjunctive, not either-or.'
    test_recipe:
      setup:
      - 'Four institutions: ACCREDITED 88.00, SUSPENDED 99.00, NON_ACCREDITED 100.00, ACCREDITED 69.99.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/institutions
        payload: {name: Northport Marine Institute, institution_code: NPM, accreditation_status: ACCREDITED, welfare_audit_score: 88.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {ok_id: $.data.id}
      - call: POST /aquarium/institutions
        payload: {name: Sablefish Bay Aquarium, institution_code: SBA, accreditation_status: SUSPENDED, welfare_audit_score: 99.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {susp_id: $.data.id}
      - call: POST /aquarium/institutions
        payload: {name: Harborview Sealife Park, institution_code: HSP, accreditation_status: NON_ACCREDITED, welfare_audit_score: 100.0, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {non_id: $.data.id}
      - call: POST /aquarium/institutions
        payload: {name: Tidewater Discovery Centre, institution_code: TDC, accreditation_status: ACCREDITED, welfare_audit_score: 69.99, last_audit_at: '2026-05-01T00:00:00Z'}
        as: ComplianceDirector
        captures: {low_id: $.data.id}
      trigger:
      - call: GET /aquarium/institutions
        payload: {is_receiving_eligible: true, limit: 10}
        as: ComplianceDirector
      - call: PATCH /aquarium/institutions/${low_id}
        payload: {welfare_audit_score: 70.0}
        as: ComplianceDirector
      - call: GET /aquarium/institutions
        payload: {is_receiving_eligible: true, limit: 10}
        as: ComplianceDirector
      assert:
      - 'first list: total_count == 1 and data[0].id == ${ok_id}'
      - Institution.${susp_id}.is_receiving_eligible == false (SUSPENDED is outside the admitted set even at 99.00)
      - Institution.${non_id}.is_receiving_eligible == false (NON_ACCREDITED at 100.00)
      - Institution.${low_id}.is_receiving_eligible == false at 69.99
      - 'after the PATCH to exactly 70.00: Institution.${low_id}.is_receiving_eligible == true (>= is inclusive) and version == 2'
      - 'second list: total_count == 2 — the derived flag is recomputed on update, not only at creation'
