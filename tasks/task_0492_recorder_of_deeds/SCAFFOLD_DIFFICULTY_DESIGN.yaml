  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: plat_lot_range_closed_interval_overlap
        grounds:
          - state_machines.PlatSurvey.SUBMITTED_to_APPROVED
          - entities.PlatSurvey.fields.start_lot
          - entities.PlatSurvey.fields.end_lot
          - errors[ERR_LOT_RANGE_OVERLAP]
        distinguishing_aspect: |
          PlatSurvey resource, CLOSED integer-interval semantics with zero buffer
          (adjacency allowed): an existing RECORDED plat covering lots [1,10] in
          MAPLE block 1 collides with a new plat covering [10,15] (shares lot 10) →
          ERR_LOT_RANGE_OVERLAP.
        test_recipe:
          setup:
            - "Office; ACTIVE submitter; a RECORDED PlatSurvey in subdivision MAPLE block 1 lots [1,10]; a second SUBMITTED PlatSurvey same subdivision/block lots [10,15] awaiting approval."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Surveyor", submitter_type: "ATTORNEY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /plats"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", subdivision_name: "MAPLE", block_number: 1, start_lot: 1, end_lot: 10 }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { plat1_id: $.data.id }
            - call: "POST /plats/${plat1_id}/approve"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
            - call: "POST /plats/${plat1_id}/record"
              payload: {}
              as: Recorder
              as_user_id: "rec-1"
            - call: "POST /plats"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", subdivision_name: "MAPLE", block_number: 1, start_lot: 10, end_lot: 15 }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { plat2_id: $.data.id }
          trigger:
            - call: "POST /plats/${plat2_id}/approve"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LOT_RANGE_OVERLAP"
            - "HTTP status == 409"
            - "PlatSurvey.${plat2_id}.status == SUBMITTED"

      - name: tax_lien_half_open_period_grace_buffer_overlap
        grounds:
          - calculations.ucc_lapse_and_overlap
          - entities.LienUccFiling.fields.effective_date
          - entities.LienUccFiling.fields.lapse_date
          - errors[ERR_TAX_LIEN_OVERLAP]
        distinguishing_aspect: |
          LienUccFiling resource (different resource and interval semantics from the
          plat): HALF-OPEN datetime periods with a 30-day grace buffer. An ACTIVE
          TAX_LIEN on parcel P-7 effective 2026-01-01 (lapse 2031-01-01) blocks a new
          TAX_LIEN on P-7 effective 2031-01-15 because 2031-01-15 < 2031-01-31
          (lapse + 30-day grace) → ERR_TAX_LIEN_OVERLAP.
        test_recipe:
          setup:
            - "Office; ACTIVE submitter; an ACTIVE TAX_LIEN on parcel P-7 effective 2026-01-01 (lapse 2031-01-01)."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "County Tax", submitter_type: "GOVERNMENT" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /ucc-filings"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", lien_type: "TAX_LIEN", parcel_id: "P-7", debtor_name: "Owner", effective_date: "2026-01-01T00:00:00Z" }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { fil1_id: $.data.id }
          trigger:
            - call: "POST /ucc-filings"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", lien_type: "TAX_LIEN", parcel_id: "P-7", debtor_name: "Owner", effective_date: "2031-01-15T00:00:00Z" }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TAX_LIEN_OVERLAP"
            - "HTTP status == 409"
            - "no second LienUccFiling on P-7 is created"

