              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /cds/vendor-releases/${vra_id}/deltas"
              payload: { rule_code: "DDI-A3", change_type: "NEW_INTERACTION", description: "New major interaction", new_severity: "MAJOR" }
              as: PharmacyInformaticist
              as_user_id: "${pharm_id}"
              captures: { a3_id: $.data.id }
            - call: "POST /cds/vendor-releases/${vra_id}/deltas"
              payload: { rule_code: "DOSE-A4", change_type: "DOSING_BOUND_CHANGED", description: "Vancomycin upper bound lowered", new_severity: "MODERATE" }
