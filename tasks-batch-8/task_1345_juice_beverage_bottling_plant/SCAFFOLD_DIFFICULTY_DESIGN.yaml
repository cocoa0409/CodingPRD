            - { call: "POST /v1/shipment-orders/${ord_id}/ship", payload: {}, as: WarehouseLead }
            - { call: "POST /v1/ops-runs", payload: {}, as: PlantManager, captures: { sweep2: $.data.customers_suspended_count } }
            - { call: "GET /v1/customer-accounts/${cust_id}", payload: {}, as: Any, captures: { end_status: $.data.status, end_out: $.data.outstanding_balance_cents } }
          assert:
            - "sweep1 == 0 (outstanding 149400 == limit 149400 does NOT suspend; strictly-greater rule)"
            - "After ship: outstanding 150900 (149400 + 1 pallet * 1500 escrow)"
            - "sweep2 == 1 and end_status == SUSPENDED (150900 > 149400)"
            - "ShipmentOrder.${ord_id}.status == SHIPPED"

      - name: zone_capacity_equality_boundary
        grounds:
          - errors[ERR_ZONE_CAPACITY_EXCEEDED]
