            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 10959 }
              as: Donor
              as_user_id: "${d1}"
            - call: "GET /giving/purchase-orders"
              payload: { project_id: "${p1}" }
              as: PlatformAdmin
              captures: { po1: "$.data[0].id" }
            - call: "POST /giving/vendors/${v1}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /giving/purchase-orders/${po1}/advance"
              payload: { action: "SHIP", tracking_number: "1Z999AA10123456784" }
              as: Vendor
              as_user_id: "${v1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409) — the vendor row's SUSPENDED state blocks SHIP even though the PO itself is ISSUED"
            - "PurchaseOrder.${po1}.status == ISSUED and shipped_at is null"
            - "Vendor.${v1}.status == SUSPENDED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: match_campaign_adjacent_half_open_windows
        grounds:
          - validations[priority=12]
          - errors.ERR_CAMPAIGN_WINDOW_OVERLAP
          - entities.MatchCampaign.fields.starts_at
        distinguishing_aspect: |
          Half-open [starts_at, ends_at) interval arithmetic on MatchCampaign:
          a same-sponsor same-target campaign starting exactly at the existing
          one's ends_at is ADJACENT and allowed (201), while one straddling the
          boundary is rejected — and an overlapping window with a DIFFERENT
          target_type is also allowed because the conflict key includes the target.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; ACTIVE campaign C1: sponsor Acme, target STATE TX, window [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - *dd_clock
            - call: "POST /giving/match-campaigns"
              payload: { sponsor_name: "Acme Foundation", match_ratio: 1.0, budget_cents: 100000, target_type: "STATE", target_value: "TX", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { mc1: $.data.id }
          trigger:
            - call: "POST /giving/match-campaigns"
              payload: { sponsor_name: "Acme Foundation", match_ratio: 0.5, budget_cents: 50000, target_type: "STATE", target_value: "TX", starts_at: "2026-10-01T00:00:00Z", ends_at: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { mc2: $.data.id }
            - call: "POST /giving/match-campaigns"
              payload: { sponsor_name: "Acme Foundation", match_ratio: 2.0, budget_cents: 50000, target_type: "STATE", target_value: "TX", starts_at: "2026-09-15T00:00:00Z", ends_at: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /giving/match-campaigns"
              payload: { sponsor_name: "Acme Foundation", match_ratio: 1.0, budget_cents: 50000, target_type: "SUBJECT", target_value: "MATH", starts_at: "2026-09-15T00:00:00Z", ends_at: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { mc4: $.data.id }
          assert:
            - "mc2 was created with status 201 — starts_at == C1.ends_at is adjacency, allowed under half-open arithmetic"
            - "err == ERR_CAMPAIGN_WINDOW_OVERLAP for the straddling window [2026-09-15, 2026-10-15) (409)"
            - "mc4 was created with status 201 — same sponsor but target SUBJECT/MATH does not share the conflict key"
            - "MatchCampaign.${mc1}.status == ACTIVE and MatchCampaign.${mc2}.status == ACTIVE"

      - name: equity_fund_touching_closed_windows_conflict
        grounds:
          - validations[priority=13]
          - errors.ERR_EQUITY_WINDOW_OVERLAP
          - entities.EquityFund.fields.window_end
        distinguishing_aspect: |
          Closed-interval [window_start, window_end] semantics on EquityFund —
          a different resource AND different interval geometry than the match
          campaign's half-open windows: a same-state fund whose window_start
          EQUALS the existing fund's window_end CONFLICTS (the shared day belongs
          to both closed intervals), while a window starting the next day is fine.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; ACTIVE equity fund F1: TX, window [2026-09-01, 2026-09-30] (closed)."
          setup_api_calls:
            - *dd_clock
            - call: "POST /giving/equity-funds"
              payload: { name: "TX September Fund", state_code: "TX", min_poverty_pct: 75.0, budget_cents: 100000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /giving/equity-funds"
              payload: { name: "TX Follow-on Fund", state_code: "TX", min_poverty_pct: 60.0, budget_cents: 80000, window_start: "2026-09-30T00:00:00Z", window_end: "2026-10-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /giving/equity-funds"
              payload: { name: "TX October Fund", state_code: "TX", min_poverty_pct: 60.0, budget_cents: 80000, window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { f3: $.data.id }
          assert:
            - "err == ERR_EQUITY_WINDOW_OVERLAP (409) — window_start 2026-09-30 touches F1's window_end 2026-09-30, and closed intervals share that day"
            - "f3 was created with status 201 — starting 2026-10-01 leaves no shared day"
            - "this is stricter than the match-campaign rule: the analogous adjacency there is allowed"
            - "EquityFund.${f1}.status == ACTIVE and EquityFund.${f3}.status == ACTIVE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: donor_conservation_across_refund_and_reallocation
        grounds:
          - calculations.donor_conservation_invariant
          - entities.Donor.fields.lifetime_donated_cents
          - entities.Donor.fields.lifetime_refunded_cents
          - entities.Donor.fields.lifetime_reallocated_cents
        distinguishing_aspect: |
          Conserved quantity: donor principal. The forward action (capture) paired
          with either compensating action (REFUND or REALLOCATE) keeps
          lifetime_donated_cents == active + refunded + reallocated: 10000 ==
          2000 (still CHOICE_PENDING) + 4000 + 4000 at the assertion point.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; FUNDING project (goal 10959) holding Dana's donations of 4000, 4000 and 2000 (funded 10000); clock at 2026-10-01T00:00:00Z and swept: project EXPIRED, all three CHOICE_PENDING; ACTIVE TX equity fund (budget 50000, window covers now)."
          setup_api_calls:
            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 4000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 4000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn2: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 2000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn3: $.data.id }
            - call: "POST /giving/equity-funds"
              payload: { name: "Lone Star Equity Fund", state_code: "TX", min_poverty_pct: 75.0, budget_cents: 50000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_sweeps/expiration_run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /giving/donations/${dn1}"
              payload: {}
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1_v: $.data.version }
            - call: "GET /giving/donations/${dn2}"
              payload: {}
              as: Donor
              as_user_id: "${d1}"
              captures: { dn2_v: $.data.version }
          trigger:
            - call: "POST /giving/donations/${dn1}/reallocation-choice"
              payload: { choice: "REFUND", expected_donation_version: "${dn1_v}" }
              as: Donor
              as_user_id: "${d1}"
            - call: "POST /giving/donations/${dn2}/reallocation-choice"
              payload: { choice: "REALLOCATE", equity_fund_id: "${f1}", expected_donation_version: "${dn2_v}" }
              as: Donor
              as_user_id: "${d1}"
            - call: "GET /giving/donors/${d1}"
              payload: {}
              as: PlatformAdmin
              captures: { donated: $.data.lifetime_donated_cents, refunded: $.data.lifetime_refunded_cents, reallocated: $.data.lifetime_reallocated_cents }
          assert:
            - "donated == 10000 (lifetime never decreases)"
            - "refunded == 4000 and reallocated == 4000"
            - "conservation holds: 10000 == 2000 (dn3 still CHOICE_PENDING) + 4000 refunded + 4000 reallocated"
            - "Donation.${dn3}.status == CHOICE_PENDING (untouched by the other two compensations)"
            - "Project.${p1}.funded_cents == 2000"

      - name: match_budget_conserved_across_apply_and_clawback
        grounds:
          - calculations.campaign_budget_invariant
          - calculations.match_allocation
          - entities.MatchCampaign.fields.remaining_budget_cents
        distinguishing_aspect: |
          Conserved quantity: match budget (different quantity than donor
          principal). Applying a 5000c match moves cents remaining ->
          matched_so_far; the expiry clawback moves exactly those cents back, so
          budget_cents == matched_so_far_cents + remaining_budget_cents == 8000
          at every checkpoint.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; FUNDING project (goal 10959, window 30); ACTIVE campaign ratio 1.0, budget 8000, STATE TX, window [2026-09-01, 2026-12-01); one 5000c matched donation."
          setup_api_calls:
            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/match-campaigns"
              payload: { sponsor_name: "Acme Foundation", match_ratio: 1.0, budget_cents: 8000, target_type: "STATE", target_value: "TX", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { mc1: $.data.id }
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 5000, match_campaign_id: "${mc1}" }
              as: Donor
              as_user_id: "${d1}"
              captures: { m1: $.data.matched_cents }
            - call: "GET /giving/match-campaigns/${mc1}"
              payload: {}
              as: PlatformAdmin
              captures: { so_far_1: $.data.matched_so_far_cents, remaining_1: $.data.remaining_budget_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_sweeps/expiration_run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /giving/match-campaigns/${mc1}"
              payload: {}
              as: PlatformAdmin
              captures: { so_far_2: $.data.matched_so_far_cents, remaining_2: $.data.remaining_budget_cents }
          assert:
            - "m1 == 5000 (ratio 1.0 on 5000c, budget headroom 8000)"
            - "after apply: so_far_1 == 5000 and remaining_1 == 3000 — invariant 8000 == 5000 + 3000"
            - "after the expiry clawback: so_far_2 == 0 and remaining_2 == 8000 — invariant 8000 == 0 + 8000"
            - "MatchCampaign.${mc1}.status == ACTIVE (window still open; budget restoration never reopens a CLOSED campaign here)"
            - "Donation of 5000 is CHOICE_PENDING with matched_cents now 0"
