- section: consistency_model
  instances:
  - name: draft_pick_immediate_consistency
    claim_type: immediate
    grounds:
    - state_machines.Player.EVALUATED_to_DRAFTED
    - entities.Team.fields.roster_count
    distinguishing_aspect: A draft pick's side effects (player DRAFTED, team roster_count) are visible immediately in the same request's response and on the next read.
    test_recipe:
      setup:
      - League in DRAFT; 2 teams; one EVALUATED player; X drafts P1.
      setup_api_calls:
      - call: POST /leagues
        payload:
          name: Spring
          season_year: 2026
          age_cutoff_date: '2026-08-31'
          registration_open_iso: '2026-01-01T00:00:00Z'
          registration_close_iso: '2026-12-31T00:00:00Z'
          draft_snake: true
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lg: $.data.id
      - call: POST /_clock/set
        payload: *id001
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /divisions
        payload:
          league_id: ${lg}
          name: Majors
          min_league_age: 9
          max_league_age: 12
          roster_cap: 12
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          div: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: X
          coach_user_id: cx
          draft_slot: 1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          tx: $.data.id
      - call: POST /teams
        payload:
          league_id: ${lg}
          division_id: ${div}
          name: Y
          coach_user_id: cy
          draft_slot: 2
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          ty: $.data.id
      - call: POST /families
        payload:
          league_id: ${lg}
          guardian_email: fam@x.com
          guardian_name: Fam
          volunteer_deposit_cents: 0
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          fam: $.data.id
      - call: POST /leagues/${lg}/advance
        payload:
          target: REGISTRATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /players
        payload:
          league_id: ${lg}
          family_id: ${fam}
          division_id: ${div}
          full_name: P1
          birth_date: '2015-01-15'
          birth_certificate_ref: bc1
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          p1: $.data.id
      - call: POST /players/${p1}/verify-age
        payload: {}
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: EVALUATION
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /players/${p1}/evaluate
        payload:
          eval_speed: 55
          eval_hitting: 55
          eval_fielding: 55
        as: LeagueAdmin
        as_user_id: admin-1
      - call: POST /leagues/${lg}/advance
        payload:
          target: DRAFT
        as: LeagueAdmin
        as_user_id: admin-1
        captures:
          lv0: $.data.version
      - call: POST /draft-picks
        payload:
          league_id: ${lg}
          team_id: ${tx}
          player_id: ${p1}
          expected_league_version: ${lv0}
        as: LeagueAdmin
        as_user_id: admin-1
      trigger:
      - call: GET /players/${p1}
        as: LeagueAdmin
        as_user_id: admin-1
        payload: {}
      assert:
      - Player.${p1}.status == DRAFTED and Player.${p1}.team_id == ${tx} (immediate consistency)
