      - name: cert_safety_beats_contract_case_cap_fiscal_on_assign
        grounds:
          - validations[priority=41]
          - validations[priority=72]
          - errors.ERR_CERTIFICATION_NOT_CURRENT
          - errors.ERR_CONTRACT_CASE_CAP_EXCEEDED
          - state_machines.Certification.ACTIVE_to_LAPSED
