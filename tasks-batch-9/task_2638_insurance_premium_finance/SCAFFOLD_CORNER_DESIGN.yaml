              payload: { limit: 50 }
              as: ComplianceOfficer
              captures: { im_before_1_sup: "$.data[0].superseded", im_before_2_sup: "$.data[1].superseded" }
            - call: "POST /policies/${im_pol}/reopen-verification"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
