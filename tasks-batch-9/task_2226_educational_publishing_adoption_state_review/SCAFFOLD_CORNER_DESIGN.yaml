            - call: "POST /presentation-slots/${slot_id}/votes"
              payload: { vote: "RECOMMEND", rationale: "Clear teacher supports." }
              as: ReviewCommitteeMember
              as_user_id: "cm-2"
            - call: "POST /presentation-slots/${slot_id}/votes"
              payload: { vote: "RECOMMEND", rationale: "Assessment bank is adequate." }
