  # =======================================================================
  # SECTION: errors - triggerability of the fifty-eight catalogued codes.
  # =======================================================================
  - section: errors
    instances:

      - name: every_path_id_not_found_error_is_triggerable
        claim_type: Error triggerable
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_PLAN_NOT_FOUND]"
          - "errors[ERR_INSTALLMENT_NOT_FOUND]"
          - "errors[ERR_TRANSACTION_NOT_FOUND]"
        distinguishing_aspect: |
          Twelve entities each own a distinct 404 code, and the codes must not collapse onto
          a generic ERR_NOT_FOUND. The database is deliberately non-empty so that a server
          which returns 404 only when a table is empty still fails, and the ids are
          syntactically valid UUIDs so that the failure is genuine absence rather than
          ERR_INVALID_REQUEST from a malformed path segment.
        test_recipe:
          setup:
            - "One plan exists, so every table the probe queries has at least one row where relevant and the not-found answers cannot be an artefact of an empty database."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "GET /plans/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { e_plan: "$.data.error_id" }
            - call: "GET /controlled-groups/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { e_cg: "$.data.error_id" }
            - call: "GET /employers/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { e_emp: "$.data.error_id" }
            - call: "GET /plan-year-valuations/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: PlanActuary
              as_user_id: "act-001"
              captures: { e_val: "$.data.error_id" }
            - call: "GET /contribution-records/00000000-0000-0000-0000-0000000000a5"
              payload: {}
