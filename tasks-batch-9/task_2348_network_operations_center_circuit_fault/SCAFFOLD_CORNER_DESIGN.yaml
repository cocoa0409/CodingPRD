              payload: { soak_passed: true }
              as: NocShiftLead
              as_user_id: "lead-1"
              captures: { tn_v: $.data.version }
          trigger:
            - call: "POST /sla-credit-claims"
              payload: { carrier_ticket_id: "${tn_id}", expected_carrier_ticket_version: "${tn_v} - 1", basis: "NOC_CLOCK" }
              as: VendorManager
              as_user_id: "vm-1"
            - call: "POST /sla-credit-claims"
              payload: { carrier_ticket_id: "${tn_id}", expected_carrier_ticket_version: "${tn_v}", basis: "NOC_CLOCK" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { cl_id: $.data.id }
          assert:
            - "the stale attempt returns 412 with data.error_id == ERR_STALE_CARRIER_TICKET_VERSION"
            - "after the refusal Carrier.${nl_id}.open_credit_exposure_cents == 0 and GET /sla-credit-claims on the ticket returns total_count 0"
            - "the current-version attempt returns 201 with SlaCreditClaim.${cl_id}.origin == MANUAL, basis == NOC_CLOCK, state == DRAFT"
            - "SlaCreditClaim.${cl_id}.breach_minutes == 30.00, breach_hours == 1 and credit_amount_cents == 46000 (920000 * 4/4 * 5 pct)"
            - "CarrierTicket.${tn_id}.version is one higher than the captured value (the successful write bumped the OCC field)"
            - "Carrier.${nl_id}.open_credit_exposure_cents == 46000 and watchlist_state == ACTIVE"

      - name: corner_stale_circuit_version_rejected_on_upgrade_order
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[upgrade-order-create-stale-circuit]
          - validations[priority=49]
          - errors.ERR_STALE_CIRCUIT_VERSION
          - endpoints["POST /upgrade-orders"]
        distinguishing_aspect: "The second declared OCC rule guards the bandwidth ledger: a version read before an intervening capacity reading is stale, so the order is refused with 412 and no megabits are committed until the planner re-reads the circuit."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9005 at 100 Mbps; the planner reads the circuit and captures its version."
            - "A capacity reading of 60.00 is then recorded, which bumps Circuit.version and makes the captured value stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9005", site_a_code: "CHI01", site_z_code: "OMA01", bandwidth_mbps: 100, mrc_cents: 90000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id, cz_v: $.data.version }
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-09-02T00:05:00Z", utilization_pct: 60.00, direction: "INGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
          trigger:
            - call: "POST /upgrade-orders"
              payload: { circuit_id: "${cz_id}", target_bandwidth_mbps: 200, expected_circuit_version: "${cz_v}" }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /circuits/${cz_id}"
              payload: {}
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { cz_v2: $.data.version }
            - call: "POST /upgrade-orders"
              payload: { circuit_id: "${cz_id}", target_bandwidth_mbps: 200, expected_circuit_version: "${cz_v2}" }
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { uo_id: $.data.id }
          assert:
            - "the stale attempt returns 412 with data.error_id == ERR_STALE_CIRCUIT_VERSION"
            - "after the refusal Carrier.${pft_id}.committed_upgrade_mbps == 0 and GET /circuits/${cz_id}/upgrade-orders returns total_count 0"
            - "the re-read version is exactly one higher than the originally captured one (the reading bumped Circuit.version)"
            - "the retried create returns 201 with UpgradeOrder.${uo_id}.delta_mbps == 100, subtotal_cents == 340000, total_cost_cents == 340000"
            - "Carrier.${pft_id}.committed_upgrade_mbps == 100 and Circuit.${cz_id}.version rose by one more"

      - name: corner_cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / alarm_to_circuit_to_path_posture_to_sibling_spof_to_severity
          rationale: "The four-hop chain (alarm -> circuit state -> path posture -> sibling spof -> incident severity) with its pinned ordering is the entire subject of the named §1.8 instance, and the money chain is covered by its sibling instance."

      - name: corner_rate_threshold_trigger_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.capacity_threshold_evaluation
        excluded_because:
          difficulty_instance: boundary_precision_check / utilization_threshold_inclusive_at_exactly_80_00
          rationale: "The inclusive utilization boundary at exactly 80.00 versus 79.99, and the counter reset, are asserted by the named §1.8 instance; the cumulative three-reading trigger is asserted by corner_third_consecutive_high_reading_orders_next_ladder_rung."

      - name: corner_derived_field_reconciliation_full_recompute
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.path_posture_and_legs
        excluded_because:
          difficulty_instance: transitive_cascade / confirm_restoration_to_auto_claim_to_exposure_ledger_to_watchlist
          rationale: "Derived ledger fields after create and update are asserted there and by the two compensating_invariant instances; the after-delete case is covered by corner_delete_path_segment_retires_row_and_rederives_posture."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /alarms"]
          - calculations.path_posture_and_legs
        distinguishing_aspect: "The declared consistency model is immediate: the alarm creation response already carries the incident_id produced by its own cascade, and reads issued straight afterwards show the circuit DOWN, the path DOWN and the incident classified, with no second write and no settling delay."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001 and one BRONZE single-leg path on it, everything healthy."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-09-02T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "GET /circuits/${cz_id}"
              payload: {}
              as: NocAnalyst
            - call: "GET /application-paths/${pq_id}"
              payload: {}
              as: NocAnalyst
            - call: "GET /incidents/${iz_id}"
              payload: {}
              as: NocAnalyst
          assert:
            - "the creation response itself carries a non-null incident_id and correlation_state ROOT"
            - "the immediately following circuit read shows operational_state DOWN and version 2"
            - "the path read shows posture DOWN with healthy_leg_count 0 and active_leg_count 1"
            - "the incident read shows severity SEV3, impact_score 20, response_state DETECTED and alarm_count 1"
            - "no polling or re-read delay is required: every derived value above is already final in the first read"
