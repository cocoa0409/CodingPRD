          - entities.RecurringRental.fields.period_end
        distinguishing_aspect: |
          Half-open [start,end) semantics with adjacency allowed on the RecurringRental resource:
          a renewal starting exactly at the prior period_end (2027-01-01) succeeds, while a renewal
          starting 2026-12-15 (< 2027-01-01) overlaps and fails ERR_RENTAL_PERIOD_OVERLAP.
