          assert:
            - "ThirdPartyObjection(obj_id).status == SUSTAINED"
            - "ResponsiveRecord(rec_id).disposition == WITHHELD"
            - "GET /exemptions?record_id=${rec_id} returns >= 1 Exemption with exemption_code == B4"

  # =================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_glomar_safety_precedence
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR {state (p7) vs business_safety (p9)}: a glomar attempt on a request that is
          BOTH not in PROCESSING (state violation) AND has a logged record (glomar precondition violation)
          must surface the higher-priority ERR_INVALID_STATE (p7), not ERR_GLOMAR_PRECONDITION (p9).
        test_recipe:
          setup:
            - "A PERFECTED (not yet PROCESSING) request, one logged record, one REQUEST-level B1 exemption, officer cleared for glomar."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer K", badge_id: "B-K1", can_invoke_glomar: true }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen L", email: "l@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Sensitive query", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/glomar"
              payload: { expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE   # p7 state wins over p9 glomar-precondition"

      - name: temporal_vs_state_appealability_precedence
        grounds:
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR {business_temporal (p14) vs state (p15)} — a DIFFERENT pair than instance 1:
          filing an appeal that is BOTH past the 90-day window AND against a non-determination (PROCESSING)
          request must surface ERR_APPEAL_WINDOW_CLOSED (p14), not ERR_NOT_APPEALABLE (p15).
        test_recipe:
          setup:
            - "A PROCESSING (non-appealable) request; clock advanced so any appeal filed_at is >90 days after received_at."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer M", badge_id: "B-M1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen N", email: "n@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Active request", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
          trigger:
            - call: "POST /requests/${r_id}/appeals"
              payload: { appellant_id: "${req_user_id}", grounds: "late and premature", filed_at: "2026-06-01T00:00:00.000Z" }
              as: Requester
              as_user_id: "${req_user_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_APPEAL_WINDOW_CLOSED   # p14 temporal wins over p15 not-appealable"

  # =================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: advance_payment_threshold_gt_not_gte
        grounds:
          - calculations.fee_assessment
          - entities.FeeEstimate.fields.requires_advance_payment
          - state_machines.FoiaRequest.PROCESSING_to_AWAITING_PAYMENT
        distinguishing_aspect: |
          BOUNDARY on the $250.00 advance-payment threshold via POST /requests/{id}/fee-estimate: an assessed
          fee of EXACTLY 25000 cents leaves requires_advance_payment=false (uses '>' not '>='), so the request
          stays PROCESSING; 25010 cents flips it true and drives AWAITING_PAYMENT.
        test_recipe:
          setup:
            - "One PROCESSING COMMERCIAL request (search 6.25h -> 25 quarter-hours -> exactly 25000 cents)."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer O", badge_id: "B-O1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "BizCo", email: "biz@x.com", declared_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Large set", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/fee-estimate"
              payload: { search_hours: 6.25, review_hours: 0, billable_pages: 0, expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { adv: $.data.requires_advance_payment, fee: $.data.assessed_fee_cents }
          assert:
            - "FeeEstimate(r_id).assessed_fee_cents == 25000"
            - "FeeEstimate(r_id).requires_advance_payment == false   # 25000 is NOT > 25000"
            - "FoiaRequest(r_id).status == PROCESSING   # no toll, stays processing"

      - name: waiver_score_threshold_gte_boundary
        grounds:
          - calculations.fee_waiver_eligibility_score
          - entities.FoiaRequest.fields.fee_waiver_granted
        distinguishing_aspect: |
          DIFFERENT metric (weighted score) on a DIFFERENT endpoint (POST /requests/{id}/fee-waiver): a score of
          EXACTLY 70 grants the waiver (uses '>=' not '>'); the same factor weights summing to 60 do not. Boundary
          sits on the 70-point grant threshold, not on the fee threshold of instance 1.
        test_recipe:
          setup:
            - "One PROCESSING OTHER request with fee_waiver_requested=true."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer P", badge_id: "B-P1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Reporter", email: "rep@x.com", declared_category: "NEWS_MEDIA" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Public-interest docs", received_at: "2026-01-05T00:00:00.000Z", fee_waiver_requested: true }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/fee-waiver"
              payload: { f_public_understanding: 1, f_not_commercial_interest: 1, f_meaningful_contribution: 0, f_ability_to_disseminate: 0, expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { granted: $.data.fee_waiver_granted }
          assert:
            - "FoiaRequest(r_id).fee_waiver_granted == true   # score exactly 70 >= 70"

  # =================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: determination_depends_on_record_dispositions
        grounds:
          - state_machines.FoiaRequest.PROCESSING_to_GRANTED
          - state_machines.ResponsiveRecord.PENDING_to_RELEASABLE
        distinguishing_aspect: |
          ENTITY PAIR {FoiaRequest -> ResponsiveRecord}: the request's GRANTED transition is only valid when
          EVERY ResponsiveRecord.disposition == RELEASABLE; a single PENDING record blocks the grant with
          ERR_INVALID_STATE (no determination branch matches a PENDING record set).
        test_recipe:
          setup:
            - "A PROCESSING request with one RELEASABLE record and one still-PENDING (unreviewed) record."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer Q", badge_id: "B-Q1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen R", email: "r2@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Set with pending", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Doc A", page_count: 1 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_a: $.data.id }
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Doc B", page_count: 1 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_b: $.data.id }
            - call: "POST /records/${rec_a}/review"
              payload: { disposition: "RELEASABLE" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/determination"
              payload: { expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE   # PENDING rec_b makes no determination branch valid"

      - name: record_release_depends_on_objection_state
        grounds:
          - state_machines.ResponsiveRecord.PENDING_to_RELEASABLE
          - state_machines.ThirdPartyObjection.NOTICED_to_OBJECTED
          - validations[priority=11]
        distinguishing_aspect: |
          DIFFERENT ENTITY PAIR {ResponsiveRecord -> ThirdPartyObjection}: a submitter-info record cannot move
          PENDING->RELEASABLE while its ThirdPartyObjection.status is OBJECTED; the review is rejected with
          ERR_REVERSE_FOIA_PENDING. Distinct from the FoiaRequest->ResponsiveRecord pair in instance 1.
        test_recipe:
          setup:
            - "A PROCESSING request with a submitter-info record under an OBJECTED objection."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer S", badge_id: "B-S1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { company_name: "Secret Corp", contact_email: "sc@x.com" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen T", email: "t@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Contract pricing", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
