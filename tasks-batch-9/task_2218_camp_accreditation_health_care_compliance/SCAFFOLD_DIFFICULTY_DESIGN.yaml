      - name: self_score_met_requires_verified_written_plan_of_the_named_type
        grounds:
          - validations.ERR_WRITTEN_PLAN_NOT_VERIFIED
          - state_machines.WrittenPlan.SUBMITTED_to_VERIFIED
          - entities.Standard.fields.written_plan_type_required
          - entities.StandardEvaluation.fields.written_plan_id
          - endpoints.POST_/accreditation/written-plans/{planId}/review
        distinguishing_aspect: |
          The pair is (StandardEvaluation.self_score, WrittenPlan.status) and the guard
          is doubly keyed: the cited plan must be BOTH in status VERIFIED and of exactly
          the plan_type the standard names. A VERIFIED plan of the wrong type is
          rejected with the same error as an unverified plan of the right type, so an
          implementation that checks only the status, or only the type, passes one
          branch and fails the other. The gate is armed only for standards whose
          written_plan_type_required is non-null.
        test_recipe:
          setup:
            - "Standards edition ACA-2026-W is PUBLISHED with HW.7 HEALTH_WELLNESS mandatory scoring_weight 1 whose written_plan_type_required is HEALTH_CARE, universal."
            - "Willow Day Camp is a DAY / YOUTH_ONLY camp in OH with health_staffing_level FIRST_AIDER_ONLY; its cycle for 2026 stands at SELF_ASSESSMENT."
            - "The camp files a HEALTH_CARE plan with physician_reviewed true that is left at status SUBMITTED, and a SUPERVISION plan that is reviewed to VERIFIED."
          setup_api_calls:
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-W", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { wset_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${wset_id}", code: "HW.7", title: "Health care procedures", domain: "HEALTH_WELLNESS", mandatory: true, scoring_weight: 1, written_plan_type_required: "HEALTH_CARE" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { w1_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets/${wset_id}/publish"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Willow Day Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: [], resident_census: 0, distance_to_hospital_km: 0, max_daily_census: 40, health_staffing_level: "FIRST_AIDER_ONLY", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id", camp_v: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${wset_id}", cycle_year: 2026, expected_camp_version: "${camp_v}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cyc_id: "$.data.id" }
            - call: "GET /accreditation/camps/${camp_id}"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_v2: "$.data.version" }
            - call: "POST /accreditation/written-plans"
              payload: { camp_id: "${camp_id}", plan_type: "HEALTH_CARE", body_ref: "WILLOW-HC-2026", effective_date: "2026-05-01", expires_at: "2027-05-01", physician_reviewed: true, expected_camp_version: "${camp_v2}" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { hc_plan_id: "$.data.id" }
            - call: "GET /accreditation/camps/${camp_id}"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_v3: "$.data.version" }
            - call: "POST /accreditation/written-plans"
              payload: { camp_id: "${camp_id}", plan_type: "SUPERVISION", body_ref: "WILLOW-SUP-2026", effective_date: "2026-05-01", expires_at: "2027-05-01", expected_camp_version: "${camp_v3}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { sup_plan_id: "$.data.id" }
            - call: "POST /accreditation/written-plans/${sup_plan_id}/review"
              payload: { decision: "VERIFY", verification_note: "supervision plan accepted" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cyc_id}", standard_id: "${w1_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { ev1_id: "$.data[0].id" }
          trigger:
            - call: "PATCH /accreditation/standard-evaluations/${ev1_id}/self-assessment"
              payload: { self_score: "MET", written_plan_id: "${hc_plan_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev1_id}/self-assessment"
              payload: { self_score: "MET", written_plan_id: "${sup_plan_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/written-plans/${hc_plan_id}/review"
              payload: { decision: "VERIFY", verification_note: "physician signature confirmed" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "PATCH /accreditation/standard-evaluations/${ev1_id}/self-assessment"
              payload: { self_score: "MET", written_plan_id: "${hc_plan_id}" }
              as: CampDirector
              as_user_id: "${camp_id}"
          assert:
            - "the first PATCH returns 422 ERR_WRITTEN_PLAN_NOT_VERIFIED because the right-type plan is still SUBMITTED"
            - "the second PATCH returns 422 ERR_WRITTEN_PLAN_NOT_VERIFIED because the cited plan is VERIFIED but of plan_type SUPERVISION rather than HEALTH_CARE"
            - "after both rejections StandardEvaluation.${ev1_id}.self_score == null, written_plan_id == null and self_status == DRAFT"
            - "WrittenPlan.${hc_plan_id}.status == VERIFIED with verified_at stamped and reviewer_user_id == officer-1 after the review"
            - "the third PATCH returns 200 with StandardEvaluation.${ev1_id}.self_score == MET, written_plan_id == ${hc_plan_id} and self_status == SUBMITTED"
            - "WrittenPlan.${sup_plan_id}.status == VERIFIED throughout, so the rejections did not disturb the other plan"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: visitor_travel_buffer_rejects_two_day_gap_and_admits_three_day_gap
        grounds:
          - validations.ERR_VISITOR_TRAVEL_CONFLICT
          - calculations.visitor_travel_commitment
          - calculations.visitor_travel_commitment.constants.TRAVEL_BUFFER_DAYS
          - entities.VisitAssignment.fields.travel_days
          - entities.Visitor.fields.committed_travel_days
        distinguishing_aspect: |
          The resource is a Visitor and the intervals are CLOSED calendar-day blocks
          widened by a two-day buffer on both sides, so the rejection boundary sits two
          days OUTSIDE the stored block: a new block starting 2026-09-05 collides with
          one ending 2026-09-03 even though the raw intervals are disjoint, and moving
          the start one day later to 2026-09-06 admits it. A naive raw-overlap check
          admits both, and a buffer applied on only one side admits the first.
        test_recipe:
          setup:
            - "Standards edition ACA-2026-P is PUBLISHED with SU.1 SUPERVISION mandatory scoring_weight 1, universal."
            - "Camp EAST is a DAY / YOUTH_ONLY camp in OH and camp WEST is a DAY / YOUTH_ONLY camp in PA, each with a 2026 cycle."
            - "Camp EAST's DRAFT visit window is 2026-09-01..2026-09-10 and camp WEST's DRAFT visit window is 2026-09-05..2026-09-14."
            - "Visitor ROVER lives in NY with no employer camp and already holds one ASSIGNED MEMBER seat on camp EAST for the closed travel block 2026-09-01..2026-09-03, so committed_travel_days is 3."
            - "TRAVEL_BUFFER_DAYS is 2, so the stored block occupies 2026-08-30..2026-09-05 once widened."
          setup_api_calls:
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-P", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { pset_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${pset_id}", code: "SU.1", title: "Staff supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${pset_id}/publish"
              payload: {}
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "East Day Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: [], resident_census: 0, distance_to_hospital_km: 0, max_daily_census: 50, health_staffing_level: "FIRST_AIDER_ONLY", prior_accredited_cycle_count: 0 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_e_id: "$.data.id", camp_e_v: "$.data.version" }
            - call: "POST /accreditation/camps"
