# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: contract_creation_applies_defaults
        claim_type: creation
        grounds: ["entities.EvaluationContract", "endpoints.POST_/evaluation/contracts"]
        distinguishing_aspect: "Omitting deliverable_report_count applies the default 1; ledger fields initialize to zero and status to ACTIVE."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "GET /evaluation/contracts/${contract_id}"
              as: AgencyOfficer
          assert:
            - "Contract.status == ACTIVE; disbursed_cents == 0; forfeited_cents == 0; remaining_cents == 90000000"
            - "Contract.deliverable_report_count == 1 (default applied)"
            - "Contract.version == 1 and id/created_at/updated_at are server-populated"

      - name: study_creation_initial_computed_fields
        claim_type: creation
        grounds: ["entities.Study", "endpoints.POST_/evaluation/contracts/{contractId}/studies"]
        distinguishing_aspect: "New study starts DESIGN with zeroed projections and UNASSESSED adequacy."
        test_recipe:
          setup: ["An ACTIVE contract"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "Coaching Impact Study", research_question: "Does coaching raise employment?" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
          assert:
            - "Study.status == DESIGN; committed_projected_n == 0; pipeline_projected_n == 0; enrolled_total == 0; quarantined_record_count == 0; sample_adequacy == UNASSESSED"

      - name: contract_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.EvaluationContract.fields.award_amount_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required award_amount_cents fails schema validation before any business logic."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation" }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: design_plan_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.DesignPlan.fields.design_type", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An undeclared design_type enum value is rejected at the schema layer."
        test_recipe:
          setup: ["An ACTIVE contract with a DESIGN study"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "Coaching Evaluation", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id, study_v: $.data.version }
          trigger:
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "QED_XTREME", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (design_type must be RCT | QED_MATCHING | QED_RDD | QED_DID)"

      - name: get_unknown_study_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET_/evaluation/studies/{studyId}"]
        distinguishing_aspect: "A well-formed but nonexistent study id yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /evaluation/studies/00000000-0000-0000-0000-000000000000"
              as: PrincipalInvestigator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: contract_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.EvaluationContract.fields.disbursed_cents"]
        distinguishing_aspect: "Sending the computed field disbursed_cents in a create body is rejected as an undeclared field."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 1000, disbursed_cents: 5 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (disbursed_cents is computed, not an accepted input)"

      - name: participant_create_under_unknown_site_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Participant.fields.site_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Nested creation under a nonexistent parent site id yields ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /evaluation/sites/00000000-0000-0000-0000-000000000000/participants"
              payload: { external_ref: "P001" }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

  - section: state_machines
    instances:
      - name: design_plan_submit_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DesignPlan.DRAFT_to_SUBMITTED", "errors[ERR_DESIGN_PLAN_INVALID_STATE]"]
        distinguishing_aspect: "Second submit from SUBMITTED (idempotency violation) is rejected; state unchanged."
        test_recipe:
          setup: ["Study with a DRAFT plan already SUBMITTED once; single RECRUITED site capacity 250 satisfies feasibility (250 >= 214)"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site A", max_participants: 250 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_a: $.data.id }
            - call: "POST /evaluation/sites/${site_a}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/sign-mou"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_id: $.data.id }
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
          trigger:
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DESIGN_PLAN_INVALID_STATE; DesignPlan.${plan_id}.status remains SUBMITTED"

      - name: report_publish_from_submitted_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.FindingsReport.ACCEPTED_to_PUBLISHED", "errors[ERR_REPORT_INVALID_STATE]"]
        distinguishing_aspect: "Publish requires ACCEPTED; from SUBMITTED (peer review skipped) it is rejected."
        test_recipe:
          setup: ["Study REPORTING with a SUBMITTED report (review not yet performed)"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site A", max_participants: 250 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_a: $.data.id }
            - call: "POST /evaluation/sites/${site_a}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/sign-mou"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_id: $.data.id }
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/design-plans/${plan_id}/agency-decision"
              payload: { decision: "APPROVED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
            - call: "POST /evaluation/studies/${study_id}/irb-protocols"
              payload: { title: "P1", estimated_burden_minutes: 300 }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { irb_id: $.data.id }
            - call: "POST /evaluation/irb-protocols/${irb_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/irb-protocols/${irb_id}/decision"
              payload: { decision: "APPROVED", approval_start: "2026-09-01T00:00:00Z", approval_end: "2027-09-01T00:00:00Z" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /evaluation/studies/${study_id}/analysis-plans"
              payload: { primary_outcomes: ["employment_q4", "earnings_q4"] }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { aplan_id: $.data.id }
            - call: "POST /evaluation/analysis-plans/${aplan_id}/register"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/studies/${study_id}/waves"
              payload: { wave_type: "SURVEY", open_at: "2026-10-01T00:00:00Z", close_at: "2026-11-01T00:00:00Z" }
              as: DataManager
              as_user_id: "dm-1"
              captures: { wave_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /evaluation/waves/${wave_id}/open"
              as: DataManager
              as_user_id: "dm-1"
            - call: "POST /evaluation/waves/${wave_id}/close"
              as: DataManager
              as_user_id: "dm-1"
            - call: "POST /evaluation/studies/${study_id}/reports"
              payload: { title: "R1", report_type: "FINAL", addressed_primary_outcomes: ["employment_q4", "earnings_q4"], payment_milestone_cents: 30000000 }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { report_id: $.data.id }
            - call: "POST /evaluation/reports/${report_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
          trigger:
            - call: "POST /evaluation/reports/${report_id}/publish"
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REPORT_INVALID_STATE; FindingsReport.${report_id}.status remains SUBMITTED"
            - "Contract.disbursed_cents remains 0 (no premature disbursement)"

      - name: site_withdraw_from_declined_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Site", "errors[ERR_SITE_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: withdraw from DECLINED is rejected."
        test_recipe:
          setup: ["Study DESIGN with site D DECLINED"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site D", max_participants: 40 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_d: $.data.id }
            - call: "POST /evaluation/sites/${site_d}/outreach"
              payload: { outcome: "DECLINED" }
              as: StudyDirector
              as_user_id: "sd-1"
          trigger:
            - call: "POST /evaluation/sites/${site_d}/withdraw"
              payload: { reason: "late" }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SITE_INVALID_STATE; Site.${site_d}.status remains DECLINED"

      - name: participant_consent_twice_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Participant.IDENTIFIED_to_CONSENTED", "errors[ERR_PARTICIPANT_INVALID_STATE]"]
        distinguishing_aspect: "Second consent on an already-CONSENTED participant is rejected; enrolled_count not double-counted."
        test_recipe:
          setup: ["Site A ACTIVE (capacity 250) with P1 already CONSENTED"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site A", max_participants: 250 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_a: $.data.id }
            - call: "POST /evaluation/sites/${site_a}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/sign-mou"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_id: $.data.id }
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/design-plans/${plan_id}/agency-decision"
              payload: { decision: "APPROVED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
            - call: "POST /evaluation/studies/${study_id}/irb-protocols"
              payload: { title: "P1", estimated_burden_minutes: 300 }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { irb_id: $.data.id }
            - call: "POST /evaluation/irb-protocols/${irb_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/irb-protocols/${irb_id}/decision"
              payload: { decision: "APPROVED", approval_start: "2026-09-01T00:00:00Z", approval_end: "2027-09-01T00:00:00Z" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /evaluation/sites/${site_a}/activate"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/participants"
              payload: { external_ref: "P001" }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { p1: $.data.id }
            - call: "POST /evaluation/participants/${p1}/consent"
              payload: { consent_form_version: 1 }
              as: Participant
              as_user_id: "${p1}"
          trigger:
            - call: "POST /evaluation/participants/${p1}/consent"
              payload: { consent_form_version: 1 }
              as: Participant
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PARTICIPANT_INVALID_STATE; Site.${site_a}.enrolled_count remains 1"

      - name: wave_close_from_planned_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DataCollectionWave.OPEN_to_CLOSED", "errors[ERR_WAVE_INVALID_STATE]"]
        distinguishing_aspect: "Close requires OPEN; a PLANNED wave cannot be closed."
        test_recipe:
          setup: ["Study RECRUITMENT (plan LOCKED) with a PLANNED SURVEY wave"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/sites"
              payload: { name: "Site A", max_participants: 250 }
              as: StudyDirector
              as_user_id: "sd-1"
              captures: { site_a: $.data.id }
            - call: "POST /evaluation/sites/${site_a}/outreach"
              payload: { outcome: "CONTACTED" }
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "POST /evaluation/sites/${site_a}/sign-mou"
              as: StudyDirector
              as_user_id: "sd-1"
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan_id: $.data.id }
            - call: "POST /evaluation/design-plans/${plan_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/design-plans/${plan_id}/agency-decision"
              payload: { decision: "APPROVED" }
              as: AgencyOfficer
              as_user_id: "ao-1"
            - call: "POST /evaluation/studies/${study_id}/waves"
              payload: { wave_type: "SURVEY", open_at: "2026-10-01T00:00:00Z", close_at: "2026-11-01T00:00:00Z" }
              as: DataManager
              as_user_id: "dm-1"
              captures: { wave_id: $.data.id }
          trigger:
            - call: "POST /evaluation/waves/${wave_id}/close"
              as: DataManager
              as_user_id: "dm-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WAVE_INVALID_STATE; DataCollectionWave.${wave_id}.status remains PLANNED"

      - name: terminated_contract_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.EvaluationContract", "errors[ERR_CONTRACT_NOT_ACTIVE]"]
        distinguishing_aspect: "From TERMINATED no further transitions or child creations are allowed."
        test_recipe:
          setup: ["Contract TERMINATED with its study cascaded to TERMINATED"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 50000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/terminate"
              payload: { reason: "Descoped" }
              as: AgencyOfficer
              as_user_id: "ao-1"
          trigger:
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S2", research_question: "Q2" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { err1: $.data.error_id }
            - call: "POST /evaluation/contracts/${contract_id}/closeout"
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { err2: $.data.error_id }
          assert:
            - "Study create on terminated contract: error_id == ERR_CONTRACT_NOT_ACTIVE"
            - "Closeout on terminated contract: error_id == ERR_CONTRACT_NOT_ACTIVE"
            - "Study.${study_id}.status == TERMINATED (terminate cascade reached the child)"

      - name: wave_close_validates_then_link_assigns_linkage_keys
        claim_type: side_effect_execution
        grounds: ["state_machines.DataCollectionWave.OPEN_to_CLOSED", "state_machines.DataCollectionWave.CLOSED_to_LINKED", "state_machines.ResponseRecord.VALIDATED_to_LINKED"]
        distinguishing_aspect: "Close moves RECEIVED records to VALIDATED; link moves VALIDATED to LINKED and stamps a non-null pseudonymous linkage_key."
        test_recipe:
          setup: ["Study DATA_COLLECTION: OPEN SURVEY wave with one RECEIVED record for consented P1"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
