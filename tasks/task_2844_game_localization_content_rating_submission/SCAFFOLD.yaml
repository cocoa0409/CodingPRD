scenario: |
  2844. Game Localization & Content Rating Submission (game publisher localization and compliance):
  localization scope decisions across text, voice, art and cultural adaptation by market, string
  extraction, translation memory management and context provision for translators, voice recording
  sessions across languages with talent contracting and usage rights, linguistic and functional
  quality assurance passes with bug triage against text overflow and truncation, content rating
  submission with disclosure questionnaires and gameplay footage of relevant content, rating outcome
  management including edits to obtain a target rating in specific markets, regional legal
  requirements including content restrictions and mandatory disclosures, simultaneous release
  coordination across markets with certification timelines

domain_name: game-localization-rating-submission

# Flat topology: every entity is addressed by its own top-level collection and linked by
# foreign keys carried in request bodies / query filters. No nested resource paths.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities joined by FK fields in bodies and query filters; zero nesting in URL paths.

  state_machine_shape: cyclic
  # RatingSubmission cycles UNDER_REVIEW -> RATED -> (appeal) -> UNDER_REVIEW; QaPass cycles
  # OPEN -> CLOSED -> OPEN on content-edit reopen; TranslationUnit carries two independent
  # state axes; LqaBug branches NEW -> {TRIAGED, REJECTED, DUPLICATE}; MarketPlan reverts
  # LQA -> IN_LOCALIZATION; Title is compound (state derived from its MarketPlan children).

  relationship_patterns:
    - one_to_many          # Title -> StringKey / MarketPlan; MarketPlan -> QaPass / VoiceSession
    - cross_aggregate      # TranslationUnit references both StringKey and MarketPlan
    - self_referential     # LqaBug.duplicate_of_bug_id -> LqaBug.id
    - many_to_many         # TalentContract is the junction between VoiceTalent and Title

  role_model: segregation_of_duties
  # ComplianceOfficer submits a rating package; only RatingBoardLiaison records its outcome.
  # The LqaTester who logged a bug (X-User-ID) may not be the one who verifies its fix.
  # TalentAgent is entity-backed and may only sign contracts for its own VoiceTalent row.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 63 endpoints / 50 error codes / 10 calculations / 10 state machines.
  # Volume is driven by the nine §0.5 rules needing distinct carriers (two dual-variant
  # calculations on different domains, two overlap geometries on different resources, two
  # conserved quantities of different types), not by padding.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

list_ordering:
  rule: |
    Every list endpoint returns rows sorted by `created_at` ASC. When two rows share the same
    `created_at` (cascade-created siblings), the tie-break is the entity's declared natural key
    ASC: StringKey.key_name, TranslationUnit -> its StringKey.key_name, MarketPlan.market_code,
    QaPass.pass_index, LqaBug.summary, RatingSubmission.submission_round,
    VoiceSession.start_utc, TalentContract.rights_start_utc, ContentEdit.edit_kind,
    Title.title_code, RecordingBooth.booth_code, VoiceTalent.talent_name.
    `id` is NEVER a sort key or tie-break.

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Title
    parent: null
    common_fields: true
    fields:
      - name: title_code
        type: string
        source: input
        description: publisher-facing short code for the game
        constraints: "matches ^[A-Z0-9-]{3,16}$; unique across all Title rows"
      - name: name
        type: string
        source: input
        description: display name of the game
        constraints: "1..120 characters"
      - name: source_language
        type: enum
        source: input
        description: language the source strings are authored in
        default: EN
        constraints: "one of {EN, JA}"
      - name: target_release_utc
        type: datetime
        source: input
        description: contractual ship instant used by the certification-deadline arithmetic
        constraints: "ISO 8601 UTC instant; must be strictly after the current logical clock at creation"
      - name: release_mode
        type: enum
        source: input
        description: whether every market must ship together or may stagger
        default: SIMULTANEOUS
        constraints: "one of {SIMULTANEOUS, STAGGERED}"
      - name: localization_state
        type: enum
        source: system
        description: compound lifecycle state derived from this Title's MarketPlan children
        default: PLANNING
        constraints: "one of {PLANNING, STRINGS_LOCKED, CERT_WINDOW, SHIPPED}"
      - name: string_lock
        type: boolean
        source: computed
        description: "true iff localization_state != PLANNING; blocks source-string edits"
      - name: extracted_key_count
        type: integer
        source: computed
        description: "count of StringKey rows with title_id == this.id and status IN {EXTRACTED, LOCKED}"
      - name: market_plan_count
        type: integer
        source: computed
        description: "count of all MarketPlan rows with title_id == this.id (no status filter)"
      - name: ready_market_count
        type: integer
        source: computed
        description: "count of MarketPlan rows with title_id == this.id and status == RELEASE_READY"
      - name: release_gate_state
        type: enum
        source: computed
        description: "simultaneous-release posture, per calculations.title_release_gate_state"
        default: OPEN
        constraints: "one of {OPEN, AT_RISK, BLOCKED, CLEARED}"

  - name: MarketPlan
    parent: Title
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the game this market plan localizes"
      - name: market_code
        type: enum
        source: input
        description: target market this plan covers
        constraints: "one of {JP, DE, BR, US, AU, KR}; unique per (title_id, market_code)"
      - name: rating_board
        type: enum
        source: input
        description: content rating board that governs this market
        constraints: "one of {CERO, USK, DJCTQ, ESRB, ACB, GRAC}; must equal MARKET_BOARD[market_code]"
      - name: target_rating
        type: enum
        source: input
        description: rating the publisher intends to obtain in this market
        constraints: "one of {ALL_AGES, TEEN_12, MATURE_15, MATURE_17, ADULTS_ONLY_18}"
      - name: scope_tier
        type: enum
        source: system
        description: localization depth chosen at the scope decision; null until scoped
        default: null
        constraints: "one of {TEXT_ONLY, SUBTITLED, FULL_VOICE, FULL_CULTURAL} or null"
      - name: cultural_adaptation_required
        type: boolean
        source: computed
        description: "true iff scope_tier == FULL_CULTURAL"
      - name: budget_cap_cents
        type: integer
        source: input
        description: hard localization budget for this market in cents
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: system
        description: market localization lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SCOPED, IN_LOCALIZATION, LQA, RELEASE_READY, BLOCKED}"
      - name: blocked_reason
        type: enum
        source: system
        description: why this market was blocked; null unless status == BLOCKED
        default: null
        constraints: "one of {LEGAL_RESTRICTION, RATING_TOO_STRICT, CERT_DEADLINE_MISSED} or null"
      - name: required_unit_count
        type: integer
        source: computed
        description: "count of StringKey rows with title_id == this.title_id and status == LOCKED"
      - name: delivered_unit_count
        type: integer
        source: computed
        description: "count of TranslationUnit rows with market_plan_id == this.id and translation_status == DELIVERED"
      - name: required_voice_line_count
        type: integer
        source: input
        description: recorded voice lines this market must accumulate before LQA
        default: 0
        constraints: "integer >= 0"
      - name: voice_recorded_line_count
        type: integer
        source: computed
        description: "sum of VoiceSession.recorded_line_count over sessions with market_plan_id == this.id and status == RECORDED"
      - name: text_effort_units
        type: number
        source: computed
        description: "translation effort units per calculations.market_text_effort_units; 2 decimal places"
        default: 0
      - name: text_effort_variant
        type: enum
        source: system
        description: which variant produced the current text_effort_units value
        default: null
        constraints: "one of {SCOPE_ESTIMATE, DELIVERED_ACTUAL} or null"
      - name: localization_cost_cents
        type: integer
        source: computed
        description: "budget-capped localization cost per calculations.market_localization_cost_cents"
        default: 0
      - name: overage_cents
        type: integer
        source: computed
        description: "uncapped subtotal minus budget_cap_cents, floored at 0, per calculations.market_localization_cost_cents"
        default: 0

  - name: StringKey
    parent: Title
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the game whose source string this is"
      - name: key_name
        type: string
        source: input
        description: extraction key path, also the list tie-break sort key
        constraints: "1..80 characters; unique per (title_id, key_name)"
      - name: source_text
        type: string
        source: input
        description: source-language text handed to translators
        constraints: "1..2000 characters"
      - name: source_char_count
        type: integer
        source: input
        description: extractor-reported source length driving the effort formula
        constraints: "integer >= 1"
      - name: ui_surface
        type: enum
        source: input
        description: where the string renders; drives the effort uplift and the context requirement
        constraints: "one of {HUD, MENU, SUBTITLE, LEGAL}"
      - name: display_char_limit
        type: integer
        source: input
        description: maximum characters the target UI can render before truncation
        constraints: "integer >= 1"
      - name: tm_match_pct
        type: integer
        source: input
        description: translation-memory match percentage observed at extraction time
        constraints: "integer 0..100"
      - name: context_note
        type: string
        source: input
        description: context handed to translators; mandatory for ui_surface == LEGAL before string lock
        default: null
        constraints: "null or 1..500 characters"
      - name: status
        type: enum
        source: system
        description: extraction lifecycle of this key
        default: EXTRACTED
        constraints: "one of {EXTRACTED, LOCKED, RETIRED}"

  - name: TranslationUnit
    parent: MarketPlan
    common_fields: true
    fields:
      - name: string_key_id
        type: string
        source: input
        description: "FK -> StringKey.id; the source string being translated"
      - name: market_plan_id
        type: string
        source: input
        description: "FK -> MarketPlan.id; the market this translation targets"
      - name: target_text
        type: string
        source: system
        description: translated text; null until a vendor drafts it
        default: null
        constraints: "null or 1..2000 characters"
      - name: target_char_count
        type: integer
        source: computed
        description: "character length of target_text; 0 when target_text is null"
        default: 0
      - name: applied_tm_match_pct
        type: integer
        source: system
        description: translation-memory match the vendor actually reused, recorded at delivery
        default: null
        constraints: "null or integer 0..100"
      - name: overflow_chars
        type: integer
        source: computed
        description: "max(0, target_char_count - StringKey.display_char_limit) for the linked StringKey"
        default: 0
      - name: translation_status
        type: enum
        source: system
        description: first independent state axis - translation production
        default: PENDING
        constraints: "one of {PENDING, DRAFTED, DELIVERED}"
      - name: qa_status
        type: enum
        source: system
        description: second independent state axis - quality assurance
        default: NOT_CHECKED
        constraints: "one of {NOT_CHECKED, LING_FLAGGED, FUNC_FLAGGED, PASSED}"
      - name: open_bug_count
        type: integer
        source: computed
        description: "count of LqaBug rows with translation_unit_id == this.id and status IN {NEW, TRIAGED, FIX_SUBMITTED}"
        default: 0

  - name: RecordingBooth
    parent: null
    common_fields: true
    fields:
      - name: booth_code
        type: string
        source: input
        description: studio booth identifier
        constraints: "1..24 characters; unique across all RecordingBooth rows"
      - name: studio_city
        type: string
        source: input
        description: city the booth physically sits in
        constraints: "1..60 characters"
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: mandatory teardown/setup gap appended to every booking of this booth
        default: 30
        constraints: "integer 0..240"
      - name: reserved_minutes_total
        type: integer
        source: computed
        description: "conserved capacity quantity, per calculations.booth_reserved_minutes_total"
        default: 0

  - name: VoiceTalent
    parent: null
    common_fields: true
    fields:
      - name: talent_name
        type: string
        source: input
        description: talent display name
        constraints: "1..80 characters"
      - name: language_code
        type: enum
        source: input
        description: language this talent records in
        constraints: "one of {JA, DE, PT_BR, EN, KO}"
      - name: union_flag
        type: boolean
        source: input
        description: whether union scale rules apply to this talent
        default: false
      - name: max_daily_recording_minutes
        type: integer
        source: input
        description: aggregate recording minutes this talent may be booked for on one UTC calendar date
        default: 240
        constraints: "integer 1..720"
      - name: reserved_minutes_on_clock_date
        type: integer
        source: computed
        description: "per calculations.talent_reserved_minutes_on_date evaluated for the logical clock's UTC date"
        default: 0

  - name: TalentContract
    parent: VoiceTalent
    common_fields: true
    fields:
      - name: voice_talent_id
        type: string
        source: input
        description: "FK -> VoiceTalent.id; the contracted talent"
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the game the usage rights cover"
      - name: territory_scope
        type: array
        source: input
        description: market codes this contract licenses the recording for
        constraints: "non-empty array of distinct values from {JP, DE, BR, US, AU, KR}"
      - name: media_scope
        type: enum
        source: input
        description: media the usage rights extend to
        constraints: "one of {IN_GAME_ONLY, IN_GAME_AND_TRAILER, ALL_MEDIA}"
      - name: buyout_fee_cents
        type: integer
        source: input
        description: flat buyout paid on signature
        constraints: "integer >= 0"
      - name: per_line_rate_cents
        type: integer
        source: input
        description: per-recorded-line rate used by the commitment ledger
        constraints: "integer >= 0"
      - name: rights_start_utc
        type: datetime
        source: input
        description: first instant the usage rights are valid
        constraints: "ISO 8601 UTC; strictly before rights_end_utc"
      - name: rights_end_utc
        type: datetime
        source: input
        description: exclusive upper bound of the usage-rights window
        constraints: "ISO 8601 UTC; strictly after rights_start_utc"
      - name: status
        type: enum
        source: system
        description: contract lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, SIGNED, EXPIRED, TERMINATED}"
      - name: signed_at_utc
        type: datetime
        source: system
        description: logical-clock instant the talent agent signed
        default: null
      - name: committed_fee_cents
        type: integer
        source: computed
        description: "conserved money quantity, per calculations.talent_commitment_ledger"
        default: 0

  - name: VoiceSession
    parent: MarketPlan
    common_fields: true
    fields:
      - name: market_plan_id
        type: string
        source: input
        description: "FK -> MarketPlan.id; the market whose voice lines are recorded"
      - name: voice_talent_id
        type: string
        source: input
        description: "FK -> VoiceTalent.id; the talent booked for this session"
      - name: recording_booth_id
        type: string
        source: input
        description: "FK -> RecordingBooth.id; the booth occupied by this session"
      - name: talent_contract_id
        type: string
        source: input
        description: "FK -> TalentContract.id; the contract whose usage rights authorize this session"
      - name: start_utc
        type: datetime
        source: input
        description: inclusive session start instant
        constraints: "ISO 8601 UTC; strictly before end_utc; same UTC calendar date as end_utc"
      - name: end_utc
        type: datetime
        source: input
        description: exclusive session end instant
        constraints: "ISO 8601 UTC; strictly after start_utc"
      - name: duration_minutes
        type: integer
        source: computed
        description: "whole minutes between start_utc and end_utc"
      - name: occupied_end_utc
        type: datetime
        source: computed
        description: "end_utc plus RecordingBooth.turnaround_buffer_minutes; exclusive upper bound of the booth occupation"
      - name: planned_line_count
        type: integer
        source: input
        description: lines the session is booked to record
        constraints: "integer >= 1"
      - name: recorded_line_count
        type: integer
        source: system
        description: lines actually recorded, set at completion
        default: null
        constraints: "null or integer >= 0"
      - name: status
        type: enum
        source: system
        description: session lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, RECORDED, CANCELLED}"
      - name: line_fee_cents
        type: integer
        source: computed
        description: "recorded_line_count * TalentContract.per_line_rate_cents when status == RECORDED, else 0"
        default: 0

  - name: QaPass
    parent: MarketPlan
    common_fields: true
    fields:
      - name: market_plan_id
        type: string
        source: input
        description: "FK -> MarketPlan.id; the market under quality assurance"
      - name: pass_type
        type: enum
        source: input
        description: linguistic (LQA) or functional (FQA) pass
        constraints: "one of {LINGUISTIC, FUNCTIONAL}"
      - name: pass_index
        type: integer
        source: system
        description: "1 + count of pre-existing QaPass rows with the same (market_plan_id, pass_type)"
      - name: inspected_unit_count
        type: integer
        source: input
        description: denominator of the defect-density gate
        constraints: "integer >= 1"
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the LqaTester that opened this pass
      - name: status
        type: enum
        source: system
        description: pass lifecycle; reopened by an applied content edit
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: reopen_count
        type: integer
        source: system
        description: number of times this pass has gone CLOSED -> OPEN
        default: 0
      - name: weighted_defect_points
        type: integer
        source: computed
        description: "per calculations.qa_defect_density numerator"
        default: 0
      - name: defect_density
        type: number
        source: computed
        description: "per calculations.qa_defect_density; 4 decimal places"
        default: 0
      - name: closed_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the most recent successful close
        default: null

  - name: LqaBug
    parent: QaPass
    common_fields: true
    fields:
      - name: qa_pass_id
        type: string
        source: input
        description: "FK -> QaPass.id; the pass this bug was logged under"
      - name: translation_unit_id
        type: string
        source: input
        description: "FK -> TranslationUnit.id; null when bug_class == FUNCTIONAL_CRASH"
        default: null
      - name: duplicate_of_bug_id
        type: string
        source: system
        description: "FK -> LqaBug.id; set only when triage resolves this bug as DUPLICATE"
        default: null
      - name: bug_class
        type: enum
        source: input
        description: defect family; determines which TranslationUnit state axis is flagged
        constraints: "one of {TEXT_OVERFLOW, TRUNCATION, MISTRANSLATION, CULTURAL, LEGAL_TEXT, FUNCTIONAL_CRASH}"
      - name: severity
        type: enum
        source: input
        description: triage severity driving the defect-density weight
        constraints: "one of {S1, S2, S3, S4}"
      - name: summary
        type: string
        source: input
        description: one-line defect description; also the list tie-break sort key
        constraints: "1..200 characters"
      - name: status
        type: enum
        source: system
        description: bug lifecycle with a branching triage fork
        default: NEW
        constraints: "one of {NEW, TRIAGED, FIX_SUBMITTED, VERIFIED, REJECTED, DUPLICATE}"
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the LqaTester that logged the bug; used by the duties check
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the LqaTester that verified the fix
        default: null
      - name: severity_weight
        type: integer
        source: computed
        description: "SEVERITY_WEIGHT[severity] from calculations.qa_defect_density constants"
      - name: axis
        type: enum
        source: computed
        description: "LINGUISTIC for bug_class IN {MISTRANSLATION, CULTURAL, LEGAL_TEXT}; FUNCTIONAL for bug_class IN {TEXT_OVERFLOW, TRUNCATION, FUNCTIONAL_CRASH}"
        constraints: "one of {LINGUISTIC, FUNCTIONAL}"

  - name: RatingSubmission
    parent: MarketPlan
    common_fields: true
    fields:
      - name: market_plan_id
        type: string
        source: input
        description: "FK -> MarketPlan.id; the market this rating package is filed for"
      - name: submission_round
        type: integer
        source: system
        description: "1 + count of pre-existing RatingSubmission rows for this market_plan_id"
      - name: rating_board
        type: enum
        source: computed
        description: "copied from MarketPlan.rating_board at creation; drives the base fee"
        constraints: "one of {CERO, USK, DJCTQ, ESRB, ACB, GRAC}"
      - name: disclosed_content_codes
        type: array
        source: input
        description: content descriptors declared on the disclosure questionnaire
        constraints: "non-empty array of distinct values from {VIOLENCE_REALISTIC, VIOLENCE_STYLIZED, BLOOD, SEXUAL_CONTENT, LANGUAGE_STRONG, DRUG_REFERENCE, GAMBLING_SIM, LOOTBOX_PAID, HORROR}"
      - name: footage_asset_count
        type: integer
        source: input
        description: gameplay footage assets attached as evidence of the disclosed content
        constraints: "integer >= 0"
      - name: target_rating
        type: enum
        source: computed
        description: "copied from MarketPlan.target_rating at creation; POST /rating-submissions declares target_rating in its input for symmetry but the stored value always comes from the MarketPlan, so a divergent supplied value is ignored"
      - name: assigned_rating
        type: enum
        source: system
        description: rating the board actually assigned; null until an outcome is recorded
        default: null
        constraints: "one of {ALL_AGES, TEEN_12, MATURE_15, MATURE_17, ADULTS_ONLY_18} or null"
      - name: self_assessed_risk_score
        type: integer
        source: computed
        description: "SELF_ASSESSED variant of calculations.rating_risk_score, frozen at submit"
        default: null
      - name: board_adjusted_risk_score
        type: integer
        source: computed
        description: "BOARD_ADJUSTED variant of calculations.rating_risk_score, recomputed at every review entry"
        default: null
      - name: projected_rating_band
        type: enum
        source: computed
        description: "rating_band(board_adjusted_risk_score); when board_decision == RATE the supplied assigned_rating must equal this value, otherwise the request is rejected with ERR_INVALID_REQUEST at priority 25"
        default: null
      - name: fee_cents
        type: integer
        source: computed
        description: "per calculations.submission_fee_cents, frozen at submit"
        default: 0
      - name: status
        type: enum
        source: system
        description: submission lifecycle with an appeal cycle back into review
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, RATED, EDITS_REQUIRED, WITHDRAWN}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that filed the package
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RatingBoardLiaison that opened the review
        default: null
      - name: appeal_count
        type: integer
        source: system
        description: number of appeals already consumed on this submission
        default: 0
      - name: submitted_at_utc
        type: datetime
        source: system
        description: logical-clock instant of the filing
        default: null

  - name: ContentEdit
    parent: RatingSubmission
    common_fields: true
    fields:
      - name: rating_submission_id
        type: string
        source: input
        description: "FK -> RatingSubmission.id; the submission this edit is filed against"
      - name: edit_kind
        type: enum
        source: input
        description: kind of change made to obtain the target rating
        constraints: "one of {REMOVE_CONTENT, CENSOR_ASSET, AGE_GATE, TEXT_REWRITE}"
      - name: affected_string_key_ids
        type: array
        source: input
        description: StringKey ids whose delivered translations this edit invalidates
        constraints: "array (possibly empty) of distinct StringKey.id values belonging to the submission's title"
      - name: removed_content_codes
        type: array
        source: input
        description: descriptor codes this edit removes from the effective disclosure set once applied
        constraints: "array (possibly empty) of distinct values from the disclosed_content_codes enum"
      - name: rationale
        type: string
        source: input
        description: compliance rationale recorded for the audit trail
        constraints: "1..500 characters"
      - name: status
        type: enum
        source: system
        description: edit lifecycle
        default: PROPOSED
        constraints: "one of {PROPOSED, APPLIED, WITHDRAWN}"
      - name: invalidated_unit_count
        type: integer
        source: system
        description: number of TranslationUnit rows reverted when this edit was applied
        default: null
      - name: applied_at_utc
        type: datetime
        source: system
        description: logical-clock instant the edit was applied
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Title
    state_field: localization_state
    shape: compound
    initial_state: PLANNING
    terminal_states: [SHIPPED]
    transitions:
      - from: PLANNING
        to: STRINGS_LOCKED
        trigger: "POST /titles/{title_id}/lock-strings"
        actor: LocalizationProducer
        preconditions:
          - "Title.localization_state == PLANNING"
          - "count of StringKey with title_id == Title.id and status == EXTRACTED is >= 1"
          - "every StringKey with title_id == Title.id, status == EXTRACTED and ui_surface == LEGAL has context_note != null"
        side_effects:
          - "Title.localization_state := STRINGS_LOCKED; Title.string_lock := true"
          - "cascade down: every StringKey with title_id == Title.id and status == EXTRACTED transitions to status LOCKED"
          - "MarketPlan.required_unit_count recomputed for every MarketPlan of this Title"
          - "increments Title.version by 1"
      - from: STRINGS_LOCKED
        to: CERT_WINDOW
        trigger: "system, evaluated at the end of POST /market-plans/{market_plan_id}/enter-lqa"
        actor: system
        preconditions:
          - "Title.market_plan_count >= 1"
          - "every MarketPlan of this Title has status IN {LQA, RELEASE_READY}"
        side_effects:
          - "Title.localization_state := CERT_WINDOW"
          - "Title.release_gate_state recomputed per calculations.title_release_gate_state"
          - "increments Title.version by 1"
        note: "bubble-up aggregate transition; fires inside the same request that moved the last MarketPlan into LQA"
      - from: CERT_WINDOW
        to: SHIPPED
        trigger: "system, evaluated at the end of POST /market-plans/{market_plan_id}/mark-release-ready"
        actor: system
        preconditions:
          - "Title.market_plan_count >= 1"
          - "Title.ready_market_count == Title.market_plan_count"
        side_effects:
          - "Title.localization_state := SHIPPED"
          - "Title.release_gate_state := CLEARED"
          - "increments Title.version by 1"
      - from: CERT_WINDOW
        to: STRINGS_LOCKED
        trigger: "system, evaluated when a MarketPlan of this Title reverts LQA -> IN_LOCALIZATION"
        actor: system
        preconditions:
          - "at least one MarketPlan of this Title has status IN {DRAFT, SCOPED, IN_LOCALIZATION}"
        side_effects:
          - "Title.localization_state := STRINGS_LOCKED"
          - "Title.release_gate_state recomputed per calculations.title_release_gate_state"
          - "increments Title.version by 1"
        note: "compensating revert; hop 5 of the content-edit cascade"

  - entity: MarketPlan
    state_field: status
    shape: branching_with_revert
    initial_state: DRAFT
    terminal_states: [RELEASE_READY, BLOCKED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /market-plans/{market_plan_id}/scope"
        actor: LocalizationProducer
        preconditions:
          - "MarketPlan.status == DRAFT"
          - "Title.localization_state != PLANNING (source strings are locked)"
        side_effects:
          - "MarketPlan.status := SCOPED; scope_tier and cultural_adaptation_required keep the values supplied at creation (this endpoint takes no body)"
          - "MarketPlan.text_effort_units := calculations.market_text_effort_units variant SCOPE_ESTIMATE; text_effort_variant := SCOPE_ESTIMATE"
          - "MarketPlan.localization_cost_cents and overage_cents := calculations.market_localization_cost_cents"
          - "increments MarketPlan.version by 1"
      - from: SCOPED
        to: IN_LOCALIZATION
        trigger: "POST /market-plans/{market_plan_id}/start-localization"
        actor: LocalizationProducer
        preconditions:
          - "MarketPlan.status == SCOPED"
          - "when scope_tier IN {FULL_VOICE, FULL_CULTURAL}: at least one TalentContract with title_id == MarketPlan.title_id, status == SIGNED and MarketPlan.market_code in territory_scope exists"
        side_effects:
          - "cascade down: creates one TranslationUnit per StringKey with title_id == MarketPlan.title_id and status == LOCKED, each with translation_status PENDING, qa_status NOT_CHECKED, target_text null"
          - "MarketPlan.required_unit_count and delivered_unit_count recomputed"
          - "increments MarketPlan.version by 1"
      - from: IN_LOCALIZATION
        to: LQA
        trigger: "POST /market-plans/{market_plan_id}/enter-lqa"
        actor: LocalizationProducer
        preconditions:
          - "MarketPlan.status == IN_LOCALIZATION"
          - "MarketPlan.delivered_unit_count == MarketPlan.required_unit_count and required_unit_count >= 1"
          - "MarketPlan.voice_recorded_line_count >= MarketPlan.required_voice_line_count"
        side_effects:
          - "MarketPlan.text_effort_units := calculations.market_text_effort_units variant DELIVERED_ACTUAL; text_effort_variant := DELIVERED_ACTUAL"
          - "MarketPlan.localization_cost_cents and overage_cents recomputed from the new text_effort_units"
          - "bubble up: Title STRINGS_LOCKED -> CERT_WINDOW when every MarketPlan of the Title is now IN {LQA, RELEASE_READY}"
          - "increments MarketPlan.version by 1"
      - from: LQA
        to: IN_LOCALIZATION
        trigger: "system, caused by TranslationUnit rows leaving DELIVERED during POST /content-edits/{content_edit_id}/apply, or by voice lines dropping below quota during POST /voice-sessions/{voice_session_id}/cancel"
        actor: system
        preconditions:
          - "MarketPlan.status == LQA"
          - "MarketPlan.delivered_unit_count < MarketPlan.required_unit_count OR MarketPlan.voice_recorded_line_count < MarketPlan.required_voice_line_count"
        side_effects:
          - "MarketPlan.status := IN_LOCALIZATION"
          - "MarketPlan.text_effort_units recomputed under variant DELIVERED_ACTUAL; text_effort_variant := DELIVERED_ACTUAL"
          - "cascade: every QaPass of this MarketPlan with status == CLOSED transitions CLOSED -> OPEN and increments reopen_count"
          - "cascade: Title CERT_WINDOW -> STRINGS_LOCKED"
          - "increments MarketPlan.version by 1"
        note: "compensating revert; hop 3 of the content-edit cascade and hop 3 of the session-cancel cascade"
      - from: LQA
        to: RELEASE_READY
        trigger: "POST /market-plans/{market_plan_id}/mark-release-ready"
        actor: ComplianceOfficer
        preconditions:
          - "MarketPlan.status == LQA"
          - "every QaPass with market_plan_id == MarketPlan.id has status == CLOSED, and at least one QaPass with pass_type == LINGUISTIC exists"
          - "the governing submission - the RatingSubmission with market_plan_id == MarketPlan.id having the greatest submission_round (unique by construction) - has status == RATED"
          - "MANDATORY_DISCLOSURES[market_code] is a subset of the governing submission's effective disclosure set"
          - "RATING_STRICTNESS[governing submission.assigned_rating] <= RATING_STRICTNESS[MarketPlan.target_rating]"
          - "no unresolved restriction: for every code in RESTRICTED_CODES[market_code] present in the governing submission's effective disclosure set there is an APPLIED ContentEdit of that submission whose removed_content_codes contains the code"
          - "Title.release_gate_state != BLOCKED"
          - "MarketPlan.overage_cents == 0"
        side_effects:
          - "MarketPlan.status := RELEASE_READY"
          - "Title.ready_market_count recomputed; Title.release_gate_state recomputed"
          - "bubble up: Title CERT_WINDOW -> SHIPPED when ready_market_count == market_plan_count"
          - "increments MarketPlan.version by 1"
      - from: SCOPED
        to: BLOCKED
        trigger: "POST /market-plans/{market_plan_id}/block"
        actor: ComplianceOfficer
        preconditions:
          - "MarketPlan.status IN {SCOPED, IN_LOCALIZATION, LQA}"
        side_effects:
          - "MarketPlan.status := BLOCKED; blocked_reason := body.blocked_reason"
          - "conditional cascade: every VoiceSession of this MarketPlan with status == SCHEDULED transitions to CANCELLED (sessions already RECORDED or CANCELLED are untouched)"
          - "Title.release_gate_state := BLOCKED"
          - "increments MarketPlan.version by 1"
      - from: IN_LOCALIZATION
        to: BLOCKED
        trigger: "POST /market-plans/{market_plan_id}/block"
        actor: ComplianceOfficer
        preconditions:
          - "MarketPlan.status IN {SCOPED, IN_LOCALIZATION, LQA}"
        side_effects:
          - "identical to the SCOPED -> BLOCKED side-effect set"
      - from: LQA
        to: BLOCKED
        trigger: "POST /market-plans/{market_plan_id}/block"
        actor: ComplianceOfficer
        preconditions:
          - "MarketPlan.status IN {SCOPED, IN_LOCALIZATION, LQA}"
        side_effects:
          - "identical to the SCOPED -> BLOCKED side-effect set"

  - entity: TranslationUnit.translation_status
    state_field: translation_status
    shape: parallel_dimension_axis_1
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: DRAFTED
        trigger: "PUT /translation-units/{translation_unit_id}"
        actor: TranslationVendor
        preconditions:
          - "TranslationUnit.translation_status == PENDING"
          - "MarketPlan.status == IN_LOCALIZATION for the unit's market_plan_id"
        side_effects:
          - "TranslationUnit.target_text := body.target_text; target_char_count and overflow_chars recomputed"
          - "increments TranslationUnit.version by 1"
        note: "the qa_status axis is untouched by this transition"
      - from: DRAFTED
        to: DELIVERED
        trigger: "POST /translation-units/{translation_unit_id}/deliver"
        actor: TranslationVendor
        preconditions:
          - "TranslationUnit.translation_status == DRAFTED"
          - "MarketPlan.status == IN_LOCALIZATION for the unit's market_plan_id"
        side_effects:
          - "TranslationUnit.applied_tm_match_pct := body.applied_tm_match_pct"
          - "MarketPlan.delivered_unit_count recomputed"
          - "increments TranslationUnit.version by 1 and MarketPlan.version by 1"
        note: "delivery is allowed with overflow_chars > 0 on purpose - overflow is an LQA finding, not a delivery gate"
      - from: DELIVERED
        to: PENDING
        trigger: "system, caused by POST /content-edits/{content_edit_id}/apply naming this unit's string_key_id"
        actor: system
        preconditions:
          - "TranslationUnit.translation_status == DELIVERED"
          - "TranslationUnit.string_key_id IN ContentEdit.affected_string_key_ids"
          - "TranslationUnit.market_plan_id == the applied edit's submission's market_plan_id"
        side_effects:
          - "TranslationUnit.target_text := null; target_char_count := 0; overflow_chars := 0; applied_tm_match_pct := null"
          - "TranslationUnit.qa_status := NOT_CHECKED (cross-axis reset, hop 2 of the content-edit cascade)"
          - "MarketPlan.delivered_unit_count recomputed - this is what causes MarketPlan LQA -> IN_LOCALIZATION"
          - "increments TranslationUnit.version by 1"
      - from: DRAFTED
        to: PENDING
        trigger: "system, caused by POST /content-edits/{content_edit_id}/apply naming this unit's string_key_id"
        actor: system
        preconditions:
          - "TranslationUnit.translation_status == DRAFTED"
          - "TranslationUnit.string_key_id IN ContentEdit.affected_string_key_ids"
        side_effects:
          - "identical field resets to the DELIVERED -> PENDING transition; delivered_unit_count is unchanged because this unit was never counted"

  - entity: TranslationUnit.qa_status
    state_field: qa_status
    shape: parallel_dimension_axis_2
    initial_state: NOT_CHECKED
    terminal_states: []
    transitions:
      - from: NOT_CHECKED
        to: LING_FLAGGED
        trigger: "POST /lqa-bugs with translation_unit_id == this unit and a bug_class whose derived axis is LINGUISTIC (MISTRANSLATION, CULTURAL or LEGAL_TEXT)"
        actor: LqaTester
        preconditions:
          - "TranslationUnit.qa_status IN {NOT_CHECKED, PASSED, FUNC_FLAGGED}"
        side_effects:
          - "TranslationUnit.qa_status := LING_FLAGGED; open_bug_count recomputed"
          - "increments TranslationUnit.version by 1"
        note: "independent of translation_status - a PENDING unit can be LING_FLAGGED"
      - from: NOT_CHECKED
        to: FUNC_FLAGGED
        trigger: "POST /lqa-bugs with translation_unit_id == this unit and a bug_class whose derived axis is FUNCTIONAL (TEXT_OVERFLOW, TRUNCATION or FUNCTIONAL_CRASH)"
        actor: LqaTester
        preconditions:
          - "TranslationUnit.qa_status IN {NOT_CHECKED, PASSED}"
        side_effects:
          - "TranslationUnit.qa_status := FUNC_FLAGGED; open_bug_count recomputed"
          - "increments TranslationUnit.version by 1"
        note: "LING_FLAGGED is NOT overwritten by a functional bug - linguistic findings dominate the axis"
      - from: LING_FLAGGED
        to: PASSED
        trigger: "POST /translation-units/{translation_unit_id}/qa-mark"
        actor: LqaTester
        preconditions:
          - "TranslationUnit.qa_status IN {NOT_CHECKED, LING_FLAGGED, FUNC_FLAGGED}"
          - "TranslationUnit.translation_status == DELIVERED (cross-axis guard)"
          - "TranslationUnit.open_bug_count == 0"
          - "TranslationUnit.overflow_chars == 0"
        side_effects:
          - "TranslationUnit.qa_status := PASSED"
          - "increments TranslationUnit.version by 1"
      - from: FUNC_FLAGGED
        to: PASSED
        trigger: "POST /translation-units/{translation_unit_id}/qa-mark"
        actor: LqaTester
        preconditions:
          - "identical to the LING_FLAGGED -> PASSED precondition set"
        side_effects:
          - "identical to the LING_FLAGGED -> PASSED side-effect set"
      - from: NOT_CHECKED
        to: PASSED
        trigger: "POST /translation-units/{translation_unit_id}/qa-mark"
        actor: LqaTester
        preconditions:
          - "identical to the LING_FLAGGED -> PASSED precondition set"
        side_effects:
          - "identical to the LING_FLAGGED -> PASSED side-effect set"
      - from: PASSED
        to: NOT_CHECKED
        trigger: "system, caused by POST /content-edits/{content_edit_id}/apply naming this unit's string_key_id"
        actor: system
        preconditions:
          - "TranslationUnit.qa_status == PASSED"
          - "TranslationUnit.string_key_id IN ContentEdit.affected_string_key_ids"
        side_effects:
          - "TranslationUnit.qa_status := NOT_CHECKED"
          - "increments TranslationUnit.version by 1"

  - entity: TalentContract
    state_field: status
    shape: branching
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /talent-contracts/{talent_contract_id}/sign"
        actor: TalentAgent
        preconditions:
          - "TalentContract.status == DRAFT"
          - "X-User-ID == TalentContract.voice_talent_id (entity-backed ownership)"
          - "logical clock < TalentContract.rights_end_utc"
        side_effects:
          - "TalentContract.status := SIGNED; signed_at_utc := logical clock"
          - "TalentContract.committed_fee_cents := buyout_fee_cents (ledger opening balance)"
          - "increments TalentContract.version by 1"
      - from: SIGNED
        to: EXPIRED
        trigger: "system, evaluated lazily whenever POST /voice-sessions or POST /voice-sessions/{voice_session_id}/start reads this contract"
        actor: system
        preconditions:
          - "TalentContract.status == SIGNED"
          - "logical clock >= TalentContract.rights_end_utc"
        side_effects:
          - "TalentContract.status := EXPIRED"
          - "increments TalentContract.version by 1"
        note: "evaluated before the referencing request's own preconditions, so the referencing call then fails on status != SIGNED"
      - from: SIGNED
        to: TERMINATED
        trigger: "POST /talent-contracts/{talent_contract_id}/terminate"
        actor: LocalizationProducer
        preconditions:
          - "TalentContract.status == SIGNED"
        side_effects:
          - "TalentContract.status := TERMINATED"
          - "conditional cascade: every VoiceSession with talent_contract_id == this and status == SCHEDULED transitions to CANCELLED, releasing booth and talent minutes"
          - "increments TalentContract.version by 1"
      - from: SIGNED
        to: TERMINATED
        trigger: "system, caused by POST /talent-contracts creating a replacement contract for the same (voice_talent_id, title_id)"
        actor: system
        preconditions:
          - "TalentContract.status == SIGNED"
          - "a new TalentContract row is being created with the same voice_talent_id and title_id"
        side_effects:
          - "TalentContract.status := TERMINATED (supersede)"
          - "increments TalentContract.version by 1"
        note: "this legitimate supersede is what makes the create endpoint a true OCC race - see concurrency_rules.contract-create-stale-talent"

  - entity: VoiceSession
    state_field: status
    shape: linear_with_compensation
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /voice-sessions/{voice_session_id}/start"
        actor: LocalizationProducer
        preconditions:
          - "VoiceSession.status == SCHEDULED"
          - "TalentContract.status == SIGNED for talent_contract_id (after the lazy EXPIRED evaluation)"
          - "TalentContract.rights_start_utc <= logical clock < TalentContract.rights_end_utc"
          - "logical clock >= VoiceSession.start_utc"
          - "MarketPlan.status == IN_LOCALIZATION for market_plan_id"
        side_effects:
          - "VoiceSession.status := IN_PROGRESS"
          - "increments VoiceSession.version by 1"
      - from: IN_PROGRESS
        to: RECORDED
        trigger: "POST /voice-sessions/{voice_session_id}/complete"
        actor: LocalizationProducer
        preconditions:
          - "VoiceSession.status == IN_PROGRESS"
          - "0 <= body.recorded_line_count <= VoiceSession.planned_line_count"
        side_effects:
          - "VoiceSession.status := RECORDED; recorded_line_count := body.recorded_line_count; line_fee_cents recomputed"
          - "TalentContract.committed_fee_cents recomputed per calculations.talent_commitment_ledger"
          - "MarketPlan.voice_recorded_line_count recomputed; MarketPlan.localization_cost_cents and overage_cents recomputed"
          - "increments VoiceSession.version, TalentContract.version and MarketPlan.version by 1 each"
      - from: RECORDED
        to: CANCELLED
        trigger: "POST /voice-sessions/{voice_session_id}/cancel"
        actor: LocalizationProducer
        preconditions:
          - "VoiceSession.status IN {SCHEDULED, IN_PROGRESS, RECORDED}"
          - "MarketPlan.status != RELEASE_READY for market_plan_id"
        side_effects:
          - "VoiceSession.status := CANCELLED; line_fee_cents := 0"
          - "hop 1: RecordingBooth.reserved_minutes_total and VoiceTalent.reserved_minutes_on_clock_date recomputed - the occupation is released"
          - "hop 2 (caused by hop 1's fee reversal): TalentContract.committed_fee_cents recomputed - drops back by the reversed line fee"
          - "hop 3 (caused by hop 2): MarketPlan.voice_recorded_line_count and localization_cost_cents recomputed"
          - "hop 4 (caused by hop 3): when MarketPlan.status == LQA and voice_recorded_line_count < required_voice_line_count, MarketPlan reverts LQA -> IN_LOCALIZATION"
          - "hop 5 (caused by hop 4): Title CERT_WINDOW -> STRINGS_LOCKED"
          - "increments VoiceSession.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /voice-sessions/{voice_session_id}/cancel, or system cascade from MarketPlan block / TalentContract terminate"
        actor: LocalizationProducer | system
        preconditions:
          - "VoiceSession.status == SCHEDULED"
        side_effects:
          - "VoiceSession.status := CANCELLED"
          - "RecordingBooth.reserved_minutes_total and VoiceTalent.reserved_minutes_on_clock_date recomputed"
          - "TalentContract.committed_fee_cents unchanged (a SCHEDULED session contributed no line fee)"
          - "increments VoiceSession.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /voice-sessions/{voice_session_id}/cancel"
        actor: LocalizationProducer
        preconditions:
          - "VoiceSession.status == IN_PROGRESS"
        side_effects:
          - "identical to the SCHEDULED -> CANCELLED side-effect set"

  - entity: QaPass
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /qa-passes/{qa_pass_id}/close"
        actor: LqaTester
        preconditions:
          - "QaPass.status == OPEN"
          - "MarketPlan.status == LQA for market_plan_id"
          - "calculations.qa_defect_density result < DEFECT_DENSITY_CEILING (0.0500), evaluated strictly"
        side_effects:
          - "QaPass.status := CLOSED; closed_at_utc := logical clock"
          - "QaPass.weighted_defect_points and defect_density frozen at the values that passed the gate"
          - "increments QaPass.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /qa-passes/{qa_pass_id}/reopen, or system cascade when the owning MarketPlan reverts LQA -> IN_LOCALIZATION"
        actor: system
        preconditions:
          - "QaPass.status == CLOSED"
          - "when triggered by the system cascade: MarketPlan.status transitioned LQA -> IN_LOCALIZATION in this request"
          - "when triggered by POST /qa-passes/{qa_pass_id}/reopen: MarketPlan.status IN {IN_LOCALIZATION, LQA}"
        side_effects:
          - "QaPass.status := OPEN; reopen_count := reopen_count + 1; closed_at_utc := null"
          - "hop 4 (caused by this reopen): every LqaBug of this pass with status == VERIFIED whose translation_unit_id was invalidated by the applied ContentEdit reverts VERIFIED -> TRIAGED"
          - "increments QaPass.version by 1"
        note: "hop 3 of the content-edit cascade; the cycle OPEN -> CLOSED -> OPEN is unbounded"

  - entity: LqaBug
    state_field: status
    shape: branching_with_revert
    initial_state: NEW
    terminal_states: [REJECTED, DUPLICATE]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /lqa-bugs/{lqa_bug_id}/triage with triage_action == ACCEPT"
        actor: LqaTester
        preconditions:
          - "LqaBug.status == NEW"
          - "QaPass.status == OPEN for qa_pass_id"
        side_effects:
          - "LqaBug.status := TRIAGED"
          - "QaPass.weighted_defect_points and defect_density recomputed (the bug stays in the open set)"
          - "increments LqaBug.version by 1"
      - from: NEW
        to: REJECTED
        trigger: "POST /lqa-bugs/{lqa_bug_id}/triage with triage_action == REJECT"
        actor: LqaTester
        preconditions:
          - "LqaBug.status == NEW"
          - "QaPass.status == OPEN for qa_pass_id"
        side_effects:
          - "LqaBug.status := REJECTED"
          - "QaPass.weighted_defect_points and defect_density recomputed - this bug LEAVES the open set, so the density drops"
          - "linked TranslationUnit.open_bug_count recomputed; qa_status is NOT reset (it stays flagged until qa-mark)"
          - "increments LqaBug.version by 1"
        note: "divergent branch: REJECT removes defect weight, ACCEPT keeps it"
      - from: NEW
        to: DUPLICATE
        trigger: "POST /lqa-bugs/{lqa_bug_id}/triage with triage_action == DUPLICATE and duplicate_of_bug_id set"
        actor: LqaTester
        preconditions:
          - "LqaBug.status == NEW"
          - "QaPass.status == OPEN for qa_pass_id"
          - "body.duplicate_of_bug_id references an existing LqaBug with the same qa_pass_id, a different id, and status NOT IN {DUPLICATE}"
        side_effects:
          - "LqaBug.status := DUPLICATE; duplicate_of_bug_id := body.duplicate_of_bug_id"
          - "QaPass.weighted_defect_points and defect_density recomputed - the duplicate leaves the open set"
          - "increments LqaBug.version by 1"
        note: "divergent branch: DUPLICATE additionally writes the self-referential FK"
      - from: TRIAGED
        to: FIX_SUBMITTED
        trigger: "POST /lqa-bugs/{lqa_bug_id}/submit-fix"
        actor: TranslationVendor
        preconditions:
          - "LqaBug.status == TRIAGED"
          - "QaPass.status == OPEN for qa_pass_id"
        side_effects:
          - "LqaBug.status := FIX_SUBMITTED"
          - "when body.target_text is present and LqaBug.translation_unit_id != null: TranslationUnit.target_text := body.target_text; target_char_count and overflow_chars recomputed; translation_status is untouched"
          - "increments LqaBug.version by 1"
      - from: FIX_SUBMITTED
        to: VERIFIED
        trigger: "POST /lqa-bugs/{lqa_bug_id}/verify"
        actor: LqaTester
        preconditions:
          - "LqaBug.status == FIX_SUBMITTED"
          - "QaPass.status == OPEN for qa_pass_id"
          - "X-User-ID != LqaBug.logged_by_user_id (segregation of duties)"
          - "when LqaBug.bug_class IN {TEXT_OVERFLOW, TRUNCATION}: the linked TranslationUnit.overflow_chars == 0"
        side_effects:
          - "LqaBug.status := VERIFIED; verified_by_user_id := X-User-ID"
          - "QaPass.weighted_defect_points and defect_density recomputed - the bug leaves the open set"
          - "linked TranslationUnit.open_bug_count recomputed"
          - "increments LqaBug.version by 1"
      - from: VERIFIED
        to: TRIAGED
        trigger: "system, caused by the owning QaPass reopening CLOSED -> OPEN after a content edit invalidated the linked TranslationUnit"
        actor: system
        preconditions:
          - "LqaBug.status == VERIFIED"
          - "QaPass transitioned CLOSED -> OPEN in this request"
          - "LqaBug.translation_unit_id was reverted to translation_status PENDING in this request"
        side_effects:
          - "LqaBug.status := TRIAGED; verified_by_user_id := null"
          - "QaPass.weighted_defect_points and defect_density recomputed - the bug re-enters the open set"
          - "increments LqaBug.version by 1"
        note: "hop 4 of the content-edit cascade; closes the VERIFIED -> TRIAGED -> FIX_SUBMITTED -> VERIFIED cycle"

  - entity: RatingSubmission
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rating-submissions/{rating_submission_id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "RatingSubmission.status == DRAFT"
          - "MarketPlan.status == LQA for market_plan_id"
          - "MANDATORY_DISCLOSURES[MarketPlan.market_code] is a subset of RatingSubmission.disclosed_content_codes"
          - "when the disclosed set intersects FOOTAGE_MANDATORY_CODES: footage_asset_count >= 1"
        side_effects:
          - "RatingSubmission.status := SUBMITTED; submitted_at_utc := logical clock; submitted_by_user_id := X-User-ID"
          - "RatingSubmission.self_assessed_risk_score := calculations.rating_risk_score variant SELF_ASSESSED (frozen)"
          - "RatingSubmission.fee_cents := calculations.submission_fee_cents (frozen)"
          - "increments RatingSubmission.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /rating-submissions/{rating_submission_id}/begin-review"
        actor: RatingBoardLiaison
        preconditions:
          - "RatingSubmission.status == SUBMITTED"
          - "X-User-ID != RatingSubmission.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "RatingSubmission.status := UNDER_REVIEW; reviewed_by_user_id := X-User-ID"
          - "RatingSubmission.board_adjusted_risk_score := calculations.rating_risk_score variant BOARD_ADJUSTED; projected_rating_band := rating_band(board_adjusted_risk_score)"
          - "increments RatingSubmission.version by 1"
      - from: UNDER_REVIEW
        to: RATED
        trigger: "POST /rating-submissions/{rating_submission_id}/record-outcome with board_decision == RATE"
        actor: RatingBoardLiaison
        preconditions:
          - "RatingSubmission.status == UNDER_REVIEW"
          - "body.assigned_rating is present"
          - "body.assigned_rating == RatingSubmission.projected_rating_band"
        side_effects:
          - "RatingSubmission.status := RATED; assigned_rating := body.assigned_rating"
          - "increments RatingSubmission.version by 1"
      - from: UNDER_REVIEW
        to: EDITS_REQUIRED
        trigger: "POST /rating-submissions/{rating_submission_id}/record-outcome with board_decision == REQUIRE_EDITS"
        actor: RatingBoardLiaison
        preconditions:
          - "RatingSubmission.status == UNDER_REVIEW"
          - "body.assigned_rating is absent"
        side_effects:
          - "RatingSubmission.status := EDITS_REQUIRED; assigned_rating stays null"
          - "increments RatingSubmission.version by 1"
        note: "divergent branch: RATE writes assigned_rating, REQUIRE_EDITS leaves it null and unlocks the ContentEdit path"
      - from: RATED
        to: UNDER_REVIEW
        trigger: "POST /rating-submissions/{rating_submission_id}/appeal"
        actor: ComplianceOfficer
        preconditions:
          - "RatingSubmission.status == RATED"
          - "RATING_STRICTNESS[assigned_rating] > RATING_STRICTNESS[RatingSubmission.target_rating]"
          - "RatingSubmission.appeal_count < MAX_APPEALS (2)"
          - "at least one ContentEdit with rating_submission_id == this.id has status == APPLIED"
        side_effects:
          - "RatingSubmission.status := UNDER_REVIEW; appeal_count := appeal_count + 1; assigned_rating := null"
          - "RatingSubmission.board_adjusted_risk_score and projected_rating_band recomputed under variant BOARD_ADJUSTED over the current effective disclosure set"
          - "increments RatingSubmission.version by 1"
        note: "closes the UNDER_REVIEW -> RATED -> UNDER_REVIEW cycle"
      - from: EDITS_REQUIRED
        to: WITHDRAWN
        trigger: "POST /rating-submissions/{rating_submission_id}/withdraw, or system supersede from POST /rating-submissions creating the next round"
        actor: ComplianceOfficer | system
        preconditions:
          - "RatingSubmission.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, EDITS_REQUIRED}"
        side_effects:
          - "RatingSubmission.status := WITHDRAWN"
          - "increments RatingSubmission.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /rating-submissions/{rating_submission_id}/withdraw, or system supersede from POST /rating-submissions creating the next round"
        actor: ComplianceOfficer | system
        preconditions:
          - "RatingSubmission.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, EDITS_REQUIRED}"
        side_effects:
          - "identical to the EDITS_REQUIRED -> WITHDRAWN side-effect set"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /rating-submissions/{rating_submission_id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "RatingSubmission.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, EDITS_REQUIRED}"
        side_effects:
          - "identical to the EDITS_REQUIRED -> WITHDRAWN side-effect set"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /rating-submissions/{rating_submission_id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "RatingSubmission.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, EDITS_REQUIRED}"
        side_effects:
          - "identical to the EDITS_REQUIRED -> WITHDRAWN side-effect set"

  - entity: ContentEdit
    state_field: status
    shape: branching
    initial_state: PROPOSED
    terminal_states: [APPLIED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: APPLIED
        trigger: "POST /content-edits/{content_edit_id}/apply"
        actor: ComplianceOfficer
        preconditions:
          - "ContentEdit.status == PROPOSED"
          - "RatingSubmission.status IN {EDITS_REQUIRED, RATED} for rating_submission_id"
          - "every id in affected_string_key_ids resolves to a StringKey whose title_id == the submission's MarketPlan.title_id"
        side_effects:
          - "hop 1: ContentEdit.status := APPLIED; applied_at_utc := logical clock; invalidated_unit_count := number of units reverted in hop 2"
          - "hop 2 (caused by hop 1): every TranslationUnit with market_plan_id == the submission's market_plan_id and string_key_id IN affected_string_key_ids and translation_status IN {DRAFTED, DELIVERED} reverts to translation_status PENDING and qa_status NOT_CHECKED, clearing target_text"
          - "hop 2b (conditional, caused by hop 1): when edit_kind == REMOVE_CONTENT, every StringKey in affected_string_key_ids with status == LOCKED transitions to RETIRED, which lowers MarketPlan.required_unit_count"
          - "hop 3 (caused by hop 2 lowering delivered_unit_count below required_unit_count): MarketPlan reverts LQA -> IN_LOCALIZATION"
          - "hop 4 (caused by hop 3): every CLOSED QaPass of that MarketPlan reopens CLOSED -> OPEN with reopen_count + 1"
          - "hop 5 (caused by hop 4): every VERIFIED LqaBug of those passes whose translation_unit_id was reverted in hop 2 goes VERIFIED -> TRIAGED"
          - "hop 6 (caused by hop 3): Title CERT_WINDOW -> STRINGS_LOCKED and Title.release_gate_state recomputed"
          - "the submission's effective disclosure set shrinks by removed_content_codes, which changes the next BOARD_ADJUSTED score"
          - "increments ContentEdit.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /content-edits/{content_edit_id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "ContentEdit.status == PROPOSED"
        side_effects:
          - "ContentEdit.status := WITHDRAWN; no TranslationUnit, QaPass or MarketPlan state changes"
          - "increments ContentEdit.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: submission-create-stale-market-plan
    parent_entity: MarketPlan
    write_endpoint: "POST /rating-submissions"
    occ_field: "expected_market_plan_version"
    description: |
      Filing a RatingSubmission against a MarketPlan whose version has advanced since the client
      last read it is rejected. The new submission legitimately supersedes the market's prior
      non-terminal submission (driving it to WITHDRAWN) and re-bases submission_round, so a filing
      built on a stale view of the market would silently discard an outcome the client never saw.
    error_id: ERR_STALE_MARKET_PLAN_VERSION
    http_status: 412
  - rule_id: contract-create-stale-talent
    parent_entity: VoiceTalent
    write_endpoint: "POST /talent-contracts"
    occ_field: "expected_voice_talent_version"
    description: |
      Creating a TalentContract for a VoiceTalent whose version has advanced since the client last
      read it is rejected. A new contract for the same (voice_talent_id, title_id) legitimately
      supersedes the prior SIGNED contract by terminating it, so a create built on a stale view of
      the talent would terminate rights the client never observed.
    error_id: ERR_STALE_TALENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: market_text_effort_units
    trigger: "POST /market-plans/{market_plan_id}/scope (variant SCOPE_ESTIMATE) and POST /market-plans/{market_plan_id}/enter-lqa plus every MarketPlan LQA -> IN_LOCALIZATION revert (variant DELIVERED_ACTUAL); writes MarketPlan.text_effort_units and MarketPlan.text_effort_variant"
    algorithm: tiered_pricing
    formula: |
      # ---- PINNED ROUNDING ORDER: round EVERY per-key value to 1 decimal place FIRST,
      # ---- then sum, then round the sum to 2 decimals. Summing the unrounded per-key
      # ---- values and rounding once at the end is WRONG and yields a different number.
      TM_FACTOR(tm_match_pct):
        tm_match_pct >= 95            -> 0.10     # EXACT band
        75 <= tm_match_pct < 95       -> 0.45     # HIGH_FUZZY band
        50 <= tm_match_pct < 75       -> 0.75     # LOW_FUZZY band
        tm_match_pct < 50             -> 1.00     # NEW band
      SURFACE_UPLIFT: LEGAL 1.50, SUBTITLE 1.20, HUD 1.10, MENU 1.00

      for each row R in input_set (iterated in StringKey.key_name ASC order; order does not
      affect the result because addition of already-rounded values is associative):
          raw_units(R)  = (R.source_char_count / 100) * TM_FACTOR(R.tm_pct_for_variant)
                          * SURFACE_UPLIFT[R.ui_surface]
          key_units(R)  = round_half_up(raw_units(R), 1)          # step 1 - PER KEY
      text_effort_units = round_half_up(sum of key_units(R) over input_set, 2)   # step 2 - SUM
    input_set: |
      Variant SCOPE_ESTIMATE: every StringKey with title_id == MarketPlan.title_id and
      status IN {EXTRACTED, LOCKED}; R.tm_pct_for_variant = StringKey.tm_match_pct;
      R.source_char_count and R.ui_surface come from the StringKey. RETIRED keys are excluded.
      Variant DELIVERED_ACTUAL: every TranslationUnit with market_plan_id == MarketPlan.id and
      translation_status == DELIVERED; R.tm_pct_for_variant = TranslationUnit.applied_tm_match_pct;
      R.source_char_count and R.ui_surface come from the unit's linked StringKey. Units in
      PENDING or DRAFTED are excluded, so a content-edit revert shrinks the input set.
    constants:
      TM_BAND_EXACT_MIN: 95
      TM_BAND_HIGH_FUZZY_MIN: 75
      TM_BAND_LOW_FUZZY_MIN: 50
      PER_KEY_DECIMALS: 1
      TOTAL_DECIMALS: 2
    precision: "per-key 1 decimal place round_half_up, total 2 decimal places round_half_up"
    variants:
      - name: SCOPE_ESTIMATE
        when: "computed at POST /market-plans/{market_plan_id}/scope, before any translation exists"
        difference: "reads StringKey.tm_match_pct (the TM state at extraction) over ALL non-retired keys of the title"
      - name: DELIVERED_ACTUAL
        when: "computed at POST /market-plans/{market_plan_id}/enter-lqa and on every LQA -> IN_LOCALIZATION revert"
        difference: "reads TranslationUnit.applied_tm_match_pct (the TM the vendor actually reused) over DELIVERED units only; identical key data therefore yields a different number whenever a vendor reused a weaker match than extraction predicted"
    worked_example: |
      Keys: menu.start(125,MENU,tm 96) sub.intro(250,SUBTITLE,tm 80) legal.eula(90,LEGAL,tm 40)
            hud.ammo(175,HUD,tm 60)
      SCOPE_ESTIMATE per-key: 0.125->0.1, 1.35->1.4, 1.35->1.4, 1.44375->1.4  => 4.30
      (sum-then-round trap would give 4.27)
      DELIVERED_ACTUAL with applied_tm 96/60/40/60: 0.1, 2.25->2.3, 1.4, 1.4 => 5.20

  - name: market_localization_cost_cents
    trigger: "recomputed at POST /market-plans/{market_plan_id}/scope, POST /market-plans/{market_plan_id}/enter-lqa, POST /voice-sessions/{voice_session_id}/complete, POST /voice-sessions/{voice_session_id}/cancel and every MarketPlan LQA -> IN_LOCALIZATION revert; writes MarketPlan.localization_cost_cents and MarketPlan.overage_cents"
    algorithm: weighted_scoring
    formula: |
      SCOPE_MULTIPLIER: TEXT_ONLY 1.00, SUBTITLED 1.25, FULL_VOICE 1.80, FULL_CULTURAL 2.40
      text_cost_cents  = round_half_up(MarketPlan.text_effort_units
                                       * TEXT_RATE_CENTS_PER_UNIT
                                       * SCOPE_MULTIPLIER[MarketPlan.scope_tier], 0)
      voice_cost_cents = sum over VoiceSession S where S.market_plan_id == MarketPlan.id
                         and S.status == RECORDED of
                         (S.recorded_line_count * TalentContract[S.talent_contract_id].per_line_rate_cents)
      # conditional branch + nested max: the cultural surcharge has a hard floor
      cultural_surcharge_cents = if MarketPlan.scope_tier == FULL_CULTURAL
            then max(CULTURAL_FLOOR_CENTS,
                     round_half_up(CULTURAL_PCT * (text_cost_cents + voice_cost_cents), 0))
            else 0
      subtotal_cents = text_cost_cents + voice_cost_cents + cultural_surcharge_cents
      localization_cost_cents = min(subtotal_cents, MarketPlan.budget_cap_cents)
      overage_cents           = max(0, subtotal_cents - MarketPlan.budget_cap_cents)
    input_set: "only VoiceSession rows in status RECORDED contribute voice cost; SCHEDULED, IN_PROGRESS and CANCELLED sessions contribute 0"
    constants:
      TEXT_RATE_CENTS_PER_UNIT: 4200
      CULTURAL_PCT: 0.15
      CULTURAL_FLOOR_CENTS: 150000
    precision: "integer cents, round_half_up at each named round_half_up step"
    variants: []
    worked_example: |
      text_effort_units 4.30, FULL_CULTURAL, no recorded session, budget_cap 200000:
        text 43344, cultural max(150000, round(0.15*43344)=6502) = 150000, subtotal 193344,
        cost 193344, overage 0.
      after one RECORDED session of 120 lines at 250 cents/line:
        voice 30000, cultural max(150000, round(0.15*73344)=11002) = 150000, subtotal 223344,
        cost min(223344,200000) = 200000, overage 23344.

  - name: qa_defect_density
    trigger: "recomputed on POST /lqa-bugs, on every LqaBug status transition, and evaluated as the gate of POST /qa-passes/{qa_pass_id}/close; writes QaPass.weighted_defect_points and QaPass.defect_density"
    algorithm: threshold
    formula: |
      SEVERITY_WEIGHT: S1 8, S2 4, S3 2, S4 1
      weighted_defect_points = sum of SEVERITY_WEIGHT[B.severity] over every LqaBug B where
                               B.qa_pass_id == QaPass.id and B.status IN {NEW, TRIAGED, FIX_SUBMITTED}
      defect_density = round_half_up(weighted_defect_points / QaPass.inspected_unit_count, 4)
      close_gate: the close succeeds iff defect_density < DEFECT_DENSITY_CEILING
                  (STRICTLY less than; a density exactly equal to the ceiling is rejected)
    input_set: "open bug set is exactly {NEW, TRIAGED, FIX_SUBMITTED}; VERIFIED, REJECTED and DUPLICATE bugs are excluded, so triaging a bug as REJECT or verifying its fix lowers the density"
    constants:
      DEFECT_DENSITY_CEILING: 0.0500
      SEVERITY_WEIGHT_S1: 8
      SEVERITY_WEIGHT_S2: 4
      SEVERITY_WEIGHT_S3: 2
      SEVERITY_WEIGHT_S4: 1
    precision: "4 decimal places, round_half_up"
    variants: []
    worked_example: |
      inspected_unit_count 160 with two open S2 bugs: 8/160 = 0.0500 -> close REJECTED
      (boundary is exclusive). After verifying one of them: 4/160 = 0.0250 -> close succeeds.

  - name: rating_risk_score
    trigger: "variant SELF_ASSESSED at POST /rating-submissions/{rating_submission_id}/submit (writes self_assessed_risk_score, frozen); variant BOARD_ADJUSTED at POST /rating-submissions/{rating_submission_id}/begin-review and POST /rating-submissions/{rating_submission_id}/appeal (writes board_adjusted_risk_score and projected_rating_band)"
    algorithm: weighted_scoring
    formula: |
      DESCRIPTOR_WEIGHT: VIOLENCE_REALISTIC 25, VIOLENCE_STYLIZED 12, BLOOD 15,
                         SEXUAL_CONTENT 20, LANGUAGE_STRONG 10, DRUG_REFERENCE 14,
                         GAMBLING_SIM 18, LOOTBOX_PAID 22, HORROR 8

      effective_disclosure_set(submission) =
          submission.disclosed_content_codes
          MINUS the union of removed_content_codes over every ContentEdit E where
                E.rating_submission_id == submission.id and E.status == APPLIED

      base_points = sum of DESCRIPTOR_WEIGHT[c] for c in effective_disclosure_set(submission)

      unresolved_legal_bugs = count of LqaBug B where
          B.qa_pass_id IN (QaPass rows with market_plan_id == submission.market_plan_id)
          and B.bug_class == LEGAL_TEXT and B.status IN {NEW, TRIAGED, FIX_SUBMITTED}
      proposed_edits = count of ContentEdit E where E.rating_submission_id == submission.id
                       and E.status == PROPOSED
      applied_edits  = count of ContentEdit E where E.rating_submission_id == submission.id
                       and E.status == APPLIED

      SELF_ASSESSED  : score = min(100, max(0, base_points))
      BOARD_ADJUSTED : score = min(100, max(0, base_points
                                     + LEGAL_BUG_PENALTY * unresolved_legal_bugs
                                     + PROPOSED_EDIT_PENALTY * proposed_edits
                                     - APPLIED_EDIT_CREDIT * applied_edits))

      rating_band(score):
        score <= 20            -> ALL_AGES
        21 <= score <= 40      -> TEEN_12
        41 <= score <= 60      -> MATURE_15
        61 <= score <= 80      -> MATURE_17
        score >= 81            -> ADULTS_ONLY_18
    input_set: "descriptor weights come from the effective disclosure set (declared codes minus codes removed by APPLIED edits); the bug term counts only LEGAL_TEXT bugs still in the open set {NEW, TRIAGED, FIX_SUBMITTED} across every QaPass of the market plan, regardless of pass_type or pass status"
    constants:
      LEGAL_BUG_PENALTY: 6
      PROPOSED_EDIT_PENALTY: 9
      APPLIED_EDIT_CREDIT: 5
      SCORE_MIN: 0
      SCORE_MAX: 100
    precision: "integer points; no rounding needed"
    variants:
      - name: SELF_ASSESSED
        when: "frozen at submit; it is the publisher's own questionnaire arithmetic"
        difference: "counts descriptor weights ONLY - it ignores unresolved LEGAL_TEXT bugs and ignores content edits entirely"
      - name: BOARD_ADJUSTED
        when: "recomputed whenever the submission (re-)enters UNDER_REVIEW"
        difference: "adds 6 per unresolved LEGAL_TEXT bug and 9 per PROPOSED edit, subtracts 5 per APPLIED edit, and works over the shrunken effective disclosure set; identical questionnaire data can therefore land in a stricter band than the publisher's self-assessment"
    worked_example: |
      disclosed [VIOLENCE_STYLIZED, BLOOD, LANGUAGE_STRONG] = 12+15+10 = 37
        SELF_ASSESSED  37 -> TEEN_12
        BOARD_ADJUSTED with one TRIAGED LEGAL_TEXT bug and no edits: 37+6 = 43 -> MATURE_15
      after an APPLIED edit removing LANGUAGE_STRONG and the legal bug verified:
        base 27, applied_edits 1 -> 27-5 = 22 -> TEEN_12

  - name: submission_fee_cents
    trigger: "POST /rating-submissions/{rating_submission_id}/submit; writes RatingSubmission.fee_cents (frozen at submit)"
    algorithm: tiered_pricing
    formula: |
      BOARD_BASE_FEE_CENTS: CERO 480000, USK 350000, DJCTQ 300000, ESRB 320000,
                            ACB 290000, GRAC 260000
      days_to_release = floor((Title.target_release_utc - logical_clock_now) / 86400 seconds)

      # ---- PINNED EVALUATION ORDER. The discount tier is keyed on pre_discount_subtotal_cents
      # ---- ONLY. It is NOT keyed on the post-expedite total, even though the expedite fee is
      # ---- added to the same subtotal - that reading is the trap and produces a different fee.
      step 1: pre_discount_subtotal_cents = BOARD_BASE_FEE_CENTS[RatingSubmission.rating_board]
                  + (RatingSubmission.submission_round - 1) * ROUND_SURCHARGE_CENTS
      step 2: expedite_fee_cents = if days_to_release < EXPEDITE_DAY_THRESHOLD
                  then round_half_up(pre_discount_subtotal_cents * EXPEDITE_PCT, 0) else 0
      step 3: discount_pct = if pre_discount_subtotal_cents >= VOLUME_TIER_2_CENTS then 0.10
                             elif pre_discount_subtotal_cents >= VOLUME_TIER_1_CENTS then 0.05
                             else 0.00
      step 4: volume_discount_cents = round_half_up(pre_discount_subtotal_cents * discount_pct, 0)
      step 5: fee_cents = pre_discount_subtotal_cents + expedite_fee_cents - volume_discount_cents
    input_set: "submission_round is the row's own round counter; days_to_release uses the logical clock at submit time and the Title reached through MarketPlan.title_id"
    constants:
      ROUND_SURCHARGE_CENTS: 75000
      EXPEDITE_PCT: 0.30
      EXPEDITE_DAY_THRESHOLD: 45
      VOLUME_TIER_1_CENTS: 400000
      VOLUME_TIER_2_CENTS: 600000
    precision: "integer cents, round_half_up on each named step"
    variants: []
    worked_example: |
      CERO, round 1, clock 2026-08-01, release 2026-12-01 (days_to_release 122):
        pre 480000, expedite 0, tier 0.05, discount 24000 -> fee 456000
      CERO, round 2, clock 2026-11-05 (days_to_release 26):
        pre 555000, expedite 166500, tier keyed on 555000 -> 0.05, discount 27750 -> fee 693750
        (keying the tier on 555000+166500 = 721500 would give 0.10 and a wrong fee of 649350)

  - name: talent_commitment_ledger
    trigger: "recomputed at POST /talent-contracts/{talent_contract_id}/sign, POST /voice-sessions/{voice_session_id}/complete and POST /voice-sessions/{voice_session_id}/cancel; writes TalentContract.committed_fee_cents"
    algorithm: aggregation
    formula: |
      committed_fee_cents(C) = C.buyout_fee_cents
          + sum over VoiceSession S where S.talent_contract_id == C.id and S.status == RECORDED
            of (S.recorded_line_count * C.per_line_rate_cents)
      # conserved-quantity invariant (money):
      #   complete(S) then cancel(S) MUST leave committed_fee_cents at exactly the value it held
      #   before complete(S). No proration, no cancellation fee, no residual drift.
    input_set: "only sessions in status RECORDED contribute; a SCHEDULED, IN_PROGRESS or CANCELLED session contributes exactly 0. The buyout term is present from the moment the contract is SIGNED and is never reversed."
    constants: {}
    precision: "integer cents, exact"
    variants: []
    worked_example: |
      buyout 500000, per_line 250. sign -> 500000. complete 120 lines -> 530000.
      cancel that session -> 500000 (invariant holds exactly).

  - name: booth_reserved_minutes_total
    trigger: "recomputed at POST /voice-sessions, POST /voice-sessions/{voice_session_id}/cancel and every cascaded session cancellation; writes RecordingBooth.reserved_minutes_total"
    algorithm: interval_merge
    formula: |
      occupied_interval(S) = [ S.start_utc , S.end_utc + booth.turnaround_buffer_minutes )
                             # half-open: the instant end_utc + buffer is FREE
      reserved_minutes_total(booth) =
          sum over VoiceSession S where S.recording_booth_id == booth.id
          and S.status IN {SCHEDULED, IN_PROGRESS, RECORDED}
          of (S.duration_minutes + booth.turnaround_buffer_minutes)

      overlap rejection rule (booth geometry):
          a new or updated session N is rejected when there exists an existing session S on the
          same booth with S.status IN {SCHEDULED, IN_PROGRESS, RECORDED} and
          occupied_interval(N) INTERSECTS occupied_interval(S).
          Because both intervals are half-open, N.start_utc == S.end_utc + buffer is ALLOWED.
      # conserved-quantity invariant (capacity minutes):
      #   create(N) then cancel(N) MUST return reserved_minutes_total to its pre-create value.
    input_set: "CANCELLED sessions are excluded from both the sum and the overlap scan; the buffer is read from the booth row, never from the session"
    constants: {}
    precision: "whole minutes, exact"
    variants: []
    worked_example: |
      booth buffer 30, session 09:00->12:00 => duration 180, contribution 210,
      occupied [09:00, 12:30). A second session starting 12:30 is accepted;
      starting 12:29 is rejected with ERR_BOOTH_WINDOW_CONFLICT.

  - name: talent_reserved_minutes_on_date
    trigger: "evaluated at POST /voice-sessions as the talent capacity gate, and exposed as VoiceTalent.reserved_minutes_on_clock_date evaluated for the logical clock's UTC date"
    algorithm: aggregation
    formula: |
      reserved_minutes_on_date(T, D) =
          sum over VoiceSession S where S.voice_talent_id == T.id
          and S.status IN {SCHEDULED, IN_PROGRESS, RECORDED}
          and utc_calendar_date(S.start_utc) == D
          of S.duration_minutes

      capacity rejection rule (talent geometry - aggregate, not pairwise):
          a new session N is rejected when
          reserved_minutes_on_date(T, utc_calendar_date(N.start_utc)) + N.duration_minutes
          > T.max_daily_recording_minutes
          # the comparison is STRICTLY greater-than, so booking the talent to exactly
          # max_daily_recording_minutes is accepted. Two sessions that do not overlap in time
          # at all can still collide under this rule.
    input_set: "one UTC calendar date, derived from start_utc; sessions are required to start and end on the same UTC date so a session never straddles two buckets. CANCELLED sessions are excluded."
    constants: {}
    precision: "whole minutes, exact"
    variants: []
    worked_example: |
      max_daily 240, existing 180-minute session on 2026-09-10. A further 60-minute session on
      that date: 180+60 = 240, not > 240 -> accepted. A 90-minute one: 270 > 240 -> rejected
      with ERR_TALENT_DAILY_CAPACITY_EXCEEDED even in a different, non-overlapping booth.

  - name: title_release_gate_state
    trigger: "recomputed whenever any MarketPlan of the Title changes status, whenever Title.localization_state changes, and at POST /_clock/set_current_utc; writes Title.release_gate_state"
    algorithm: aggregation
    formula: |
      ready   = count of MarketPlan M where M.title_id == Title.id and M.status == RELEASE_READY
      blocked = count of MarketPlan M where M.title_id == Title.id and M.status == BLOCKED
      total   = count of MarketPlan M where M.title_id == Title.id      # no status filter
      days_to_release = floor((Title.target_release_utc - logical_clock_now) / 86400 seconds)

      # evaluated as an ordered if/elif chain - the FIRST matching clause wins
      1. blocked >= 1                                              -> BLOCKED
      2. total >= 1 and ready == total                             -> CLEARED
      3. Title.release_mode == SIMULTANEOUS and ready >= 1
         and ready < total                                         -> AT_RISK
      4. total >= 1 and ready < total
         and days_to_release < CERT_WINDOW_DAYS                    -> AT_RISK
      5. otherwise                                                 -> OPEN
    input_set: "every MarketPlan of the title regardless of status; a title with zero market plans is OPEN"
    constants:
      CERT_WINDOW_DAYS: 30
    precision: "enum, no arithmetic beyond the day count"
    variants: []
    worked_example: |
      SIMULTANEOUS title, 2 market plans, one RELEASE_READY: clause 3 fires -> AT_RISK.
      STAGGERED title, 2 plans, one RELEASE_READY, 122 days out: clauses 1-4 all fail -> OPEN.

  - name: market_compliance_requirement_set
    trigger: "evaluated at POST /rating-submissions/{rating_submission_id}/submit and POST /market-plans/{market_plan_id}/mark-release-ready; produces the mandatory-disclosure, restricted-code and footage requirements for a market"
    algorithm: constraint_propagation
    formula: |
      missing_mandatory(submission) = MANDATORY_DISCLOSURES[market_code]
                                      MINUS submission.disclosed_content_codes
      footage_required(submission)  = effective_disclosure_set(submission)
                                      INTERSECT FOOTAGE_MANDATORY_CODES  is non-empty
      unresolved_restricted(submission) =
          (effective_disclosure_set(submission) INTERSECT RESTRICTED_CODES[market_code])
          # a restricted code leaves this set only by being removed from the effective
          # disclosure set, i.e. by an APPLIED ContentEdit listing it in removed_content_codes
      submit gate         : missing_mandatory must be empty; when footage_required then
                            footage_asset_count >= 1
      release-ready gate  : unresolved_restricted must be empty
    input_set: "market_code comes from the submission's MarketPlan; effective_disclosure_set is defined in calculations.rating_risk_score"
    constants:
      MARKET_BOARD: { JP: CERO, DE: USK, BR: DJCTQ, US: ESRB, AU: ACB, KR: GRAC }
      MANDATORY_DISCLOSURES:
        JP: []
        DE: [GAMBLING_SIM]
        BR: []
        US: []
        AU: []
        KR: [LOOTBOX_PAID]
      RESTRICTED_CODES:
        JP: []
        DE: [BLOOD]
        BR: []
        US: []
        AU: [DRUG_REFERENCE]
        KR: [GAMBLING_SIM]
      FOOTAGE_MANDATORY_CODES: [VIOLENCE_REALISTIC, SEXUAL_CONTENT, GAMBLING_SIM, LOOTBOX_PAID]
      RATING_STRICTNESS: { ALL_AGES: 1, TEEN_12: 2, MATURE_15: 3, MATURE_17: 4, ADULTS_ONLY_18: 5 }
      MAX_APPEALS: 2
    precision: "set arithmetic, exact"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority - LOWEST number wins)
# When a single request violates several rules, the server MUST return the
# error of the lowest-numbered rule and MUST NOT evaluate any later rule.
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "request body shape is valid: every required field present, every enum value inside its declared set, every integer non-negative where declared, every datetime a valid RFC3339 UTC instant, arrays are arrays. Includes rating_board == MARKET_BOARD[market_code] for MarketPlan creation, and end_utc > start_utc for VoiceSession creation."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 30
    category: existence
    check: "the path resource exists (leftmost path id first, then subsequent path ids): Title, MarketPlan, StringKey, TranslationUnit, RecordingBooth, VoiceTalent, TalentContract, VoiceSession, QaPass, LqaBug, RatingSubmission, ContentEdit"
    error_id: "ERR_TITLE_NOT_FOUND | ERR_MARKET_PLAN_NOT_FOUND | ERR_STRING_KEY_NOT_FOUND | ERR_TRANSLATION_UNIT_NOT_FOUND | ERR_BOOTH_NOT_FOUND | ERR_TALENT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_QA_PASS_NOT_FOUND | ERR_BUG_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_CONTENT_EDIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 32
    category: existence
    check: "every FK supplied in the request body resolves to an existing row, validated in the field order declared on the entity in §1.1 (e.g. POST /voice-sessions checks market_plan_id, then voice_talent_id, then recording_booth_id, then talent_contract_id)"
    error_id: "ERR_MARKET_PLAN_NOT_FOUND | ERR_TALENT_NOT_FOUND | ERR_BOOTH_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_STRING_KEY_NOT_FOUND | ERR_QA_PASS_NOT_FOUND | ERR_TRANSLATION_UNIT_NOT_FOUND | ERR_BUG_NOT_FOUND | ERR_TITLE_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"

  - priority: 34
    category: business_referential
    check: "referential coherence between two supplied FKs: TranslationUnit.string_key_id must belong to the same Title as the MarketPlan; VoiceSession.talent_contract_id must reference a contract whose voice_talent_id equals the supplied voice_talent_id and whose title_id equals the MarketPlan's title_id; LqaBug.translation_unit_id must belong to the QaPass's MarketPlan; ContentEdit.affected_string_key_ids must all belong to the submission's Title"
    error_id: ERR_CROSS_PARENT_MISMATCH
    http_status: 422
    applies_to: "POST /translation-units cascade, POST /voice-sessions, POST /lqa-bugs, POST /content-edits"

  - priority: 36
    category: auth
    check: "ownership: a TalentAgent (identity entity_backed:VoiceTalent) may only act on a TalentContract whose voice_talent_id equals the acting X-User-ID, and only on VoiceSession rows whose voice_talent_id equals it"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /talent-contracts/{talent_contract_id}/sign, POST /voice-sessions/{voice_session_id}/start, POST /voice-sessions/{voice_session_id}/complete"

  - priority: 37
    category: auth
    check: "segregation of duties, evaluated on X-User-ID: the user who opened a QaPass (opened_by_user_id) may not close it; the user who logged an LqaBug (logged_by_user_id) may not verify it; the user who submitted a RatingSubmission (submitted_by_user_id) may not record its outcome"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /qa-passes/{qa_pass_id}/close, POST /lqa-bugs/{lqa_bug_id}/verify, POST /rating-submissions/{rating_submission_id}/record-outcome"

  - priority: 38
    category: business_constraint
    check: "optimistic concurrency: the supplied expected_<parent>_version equals the parent row's current version (see §1.2.1)"
    error_id: "ERR_STALE_MARKET_PLAN_VERSION | ERR_STALE_TALENT_VERSION"
    http_status: 412
    applies_to: "POST /rating-submissions, POST /talent-contracts"

  - priority: 40
    category: business_constraint
    check: "uniqueness: Title.title_code globally unique; MarketPlan.market_code unique per title_id; StringKey.key_name unique per title_id; at most one QaPass in status OPEN per (market_plan_id, pass_type). The start-localization cascade creates exactly one TranslationUnit per (string_key_id, market_plan_id) and is the only writer of that table, so the pair needs no request-time uniqueness error."
    error_id: "ERR_DUPLICATE_TITLE_CODE | ERR_DUPLICATE_MARKET_CODE | ERR_DUPLICATE_STRING_KEY | ERR_OPEN_QA_PASS_EXISTS"
    http_status: 409
    applies_to: "POST /titles, POST /market-plans, POST /string-keys, POST /qa-passes"

  - priority: 42
    category: state
    check: "the target resource is in a state that permits the requested transition (per §1.2): Title.localization_state, MarketPlan.status, StringKey.status, TranslationUnit.translation_status, TalentContract.status, VoiceSession.status, QaPass.status, LqaBug.status, RatingSubmission.status, ContentEdit.status"
    error_id: "ERR_TITLE_STRINGS_ALREADY_LOCKED | ERR_MARKET_PLAN_STATE_INVALID | ERR_STRING_KEY_LOCKED | ERR_UNIT_NOT_DELIVERED | ERR_CONTRACT_NOT_DRAFT | ERR_SESSION_STATE_INVALID | ERR_QA_PASS_NOT_OPEN | ERR_BUG_STATE_INVALID | ERR_SUBMISSION_STATE_INVALID | ERR_CONTENT_EDIT_NOT_PROPOSED"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 44
    category: state
    check: "cross-entity state precondition: the resource's ancestor or peer is in the required state - POST /market-plans/{id}/start-localization requires Title.localization_state == STRINGS_LOCKED; POST /voice-sessions requires TalentContract.status == SIGNED and MarketPlan.status == IN_LOCALIZATION; POST /qa-passes requires MarketPlan.status IN {IN_LOCALIZATION, LQA}; POST /rating-submissions requires MarketPlan.status IN {LQA, RELEASE_READY}; POST /content-edits requires RatingSubmission.status == EDITS_REQUIRED; POST /titles/{id}/lock-strings requires at least one StringKey of the Title in status EXTRACTED and a non-null context_note on every EXTRACTED key whose ui_surface == LEGAL; POST /market-plans/{id}/mark-release-ready requires every QaPass of the market plan to be CLOSED, at least one QaPass with pass_type == LINGUISTIC to exist, and Title.release_gate_state != BLOCKED"
    error_id: ERR_PREREQUISITE_STATE_NOT_MET
    http_status: 409
    applies_to: "POST /market-plans/{market_plan_id}/start-localization, POST /voice-sessions, POST /qa-passes, POST /rating-submissions, POST /content-edits"

  # ---- Business rules, in domain priority order:
  # ---- (a) legal / regulatory compliance, (b) rights and contractual coverage,
  # ---- (c) quality gating, (d) scheduling and capacity, (e) fiscal.
  - priority: 51
    category: business_safety
    check: "every code in MANDATORY_DISCLOSURES[market_code] appears in RatingSubmission.disclosed_content_codes"
    error_id: ERR_MANDATORY_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /rating-submissions/{rating_submission_id}/submit"

  - priority: 52
    category: business_safety
    check: "no code in RESTRICTED_CODES[market_code] remains in the effective disclosure set of the governing RatingSubmission (declared codes minus codes removed by APPLIED ContentEdits)"
    error_id: ERR_CONTENT_RESTRICTION_UNRESOLVED
    http_status: 422
    applies_to: "POST /market-plans/{market_plan_id}/mark-release-ready"

  - priority: 53
    category: business_safety
    check: "when the effective disclosure set intersects FOOTAGE_MANDATORY_CODES, footage_asset_count must be >= 1"
    error_id: ERR_FOOTAGE_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /rating-submissions/{rating_submission_id}/submit"

  - priority: 54
    category: business_referential
    check: "the TalentContract's territory_scope array contains the MarketPlan.market_code, and the contract's media_scope is not IN_GAME_ONLY when the MarketPlan.scope_tier is FULL_CULTURAL"
    error_id: ERR_CONTRACT_TERRITORY_NOT_COVERED
    http_status: 422
    applies_to: "POST /voice-sessions"

  - priority: 55
    category: business_temporal
    check: "the requested session window lies inside the contract's usage rights window: rights_start_utc <= start_utc and end_utc <= rights_end_utc"
    error_id: ERR_CONTRACT_RIGHTS_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /voice-sessions"

  - priority: 56
    category: business_constraint
    check: "the session starts and ends on the same UTC calendar date"
    error_id: ERR_SESSION_SPANS_TWO_DATES
    http_status: 422
    applies_to: "POST /voice-sessions"

  - priority: 57
    category: business_constraint
    check: "quality gate: QaPass.defect_density < DEFECT_DENSITY_CEILING (0.0500, strictly less than)"
    error_id: ERR_DEFECT_DENSITY_EXCEEDED
    http_status: 422
    applies_to: "POST /qa-passes/{qa_pass_id}/close"

  - priority: 58
    category: business_constraint
    check: "no TranslationUnit of the MarketPlan has overflow_chars > 0 with qa_status != PASSED, and no LqaBug of bug_class IN {TEXT_OVERFLOW, TRUNCATION} remains in status NEW, TRIAGED or FIX_SUBMITTED"
    error_id: ERR_TEXT_OVERFLOW_UNRESOLVED
    http_status: 422
    applies_to: "POST /market-plans/{market_plan_id}/mark-release-ready"

  - priority: 59
    category: business_constraint
    check: "delivery completeness: delivered_unit_count == required_unit_count, and when scope_tier IN {FULL_VOICE, FULL_CULTURAL} also voice_recorded_line_count >= required_voice_line_count"
    error_id: ERR_LOCALIZATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /market-plans/{market_plan_id}/enter-lqa"

  - priority: 60
    category: business_constraint
    check: "the governing RatingSubmission (greatest submission_round for the market plan) has status RATED and RATING_STRICTNESS[assigned_rating] <= RATING_STRICTNESS[MarketPlan.target_rating]"
    error_id: ERR_RATING_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /market-plans/{market_plan_id}/mark-release-ready"

  - priority: 61
    category: business_constraint
    check: "appeal budget: RatingSubmission.appeal_count < MAX_APPEALS (2)"
    error_id: ERR_MAX_APPEALS_EXCEEDED
    http_status: 422
    applies_to: "POST /rating-submissions/{rating_submission_id}/appeal"

  - priority: 62
    category: business_temporal
    check: "booth geometry: the new session's buffered half-open occupied interval [start_utc, end_utc + turnaround_buffer_minutes) must not intersect that of any existing SCHEDULED, IN_PROGRESS or RECORDED session on the same booth"
    error_id: ERR_BOOTH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /voice-sessions"

  - priority: 63
    category: business_constraint
    check: "talent capacity: reserved_minutes_on_date(talent, date(start_utc)) + duration_minutes must not exceed VoiceTalent.max_daily_recording_minutes (strictly greater-than is a violation)"
    error_id: ERR_TALENT_DAILY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /voice-sessions"

  - priority: 70
    category: business_fiscal
    check: "budget: after recomputation the MarketPlan's subtotal must not exceed budget_cap_cents, i.e. overage_cents must be 0"
    error_id: ERR_BUDGET_OVERAGE
    http_status: 422
    applies_to: "POST /market-plans/{market_plan_id}/mark-release-ready"

# ---- Rule 5 declared priority pairs (each pair is co-violable by ONE request):
# ---- P1  42 state (ERR_SUBMISSION_STATE_INVALID) beats 51 business_safety
# ----     (ERR_MANDATORY_DISCLOSURE_MISSING) on POST /rating-submissions/{id}/submit
# ---- P2  54 business_referential (ERR_CONTRACT_TERRITORY_NOT_COVERED) beats
# ----     62 business_temporal (ERR_BOOTH_WINDOW_CONFLICT) on POST /voice-sessions
# ---- P3  52 business_safety (ERR_CONTENT_RESTRICTION_UNRESOLVED) beats
# ----     70 business_fiscal (ERR_BUDGET_OVERAGE) on POST /market-plans/{id}/mark-release-ready

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table   (api_prefix is "" - every path is top-level)
# Every endpoint requires the X-User-Role and X-User-ID headers.
# ALL_ROLES = [LocalizationProducer, TranslationVendor, LqaTester,
#              ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
# ---------------------------------------------------------------------------
endpoints:
  # ---- Title -------------------------------------------------------------
  - method: POST
    path: "/titles"
    description: "Register a game title. Starts in localization_state PLANNING with string_lock false and release_gate_state OPEN."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 201
    input: [title_code, name, source_language, target_release_utc, release_mode]
    output: Title
    side_effects: ["extracted_key_count/market_plan_count/ready_market_count initialised to 0", "calculations.title_release_gate_state -> OPEN"]

  - method: GET
    path: "/titles/{title_id}"
    description: "Fetch one title with its derived counters and release_gate_state."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: Title
    side_effects: []

  - method: GET
    path: "/titles"
    description: "List titles, newest-last (created_at ASC, id is never used for ordering). All filters optional."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["localization_state?", "release_mode?", "release_gate_state?", "limit?", "offset?"]
    output: Title[]
    side_effects: []

  - method: POST
    path: "/titles/{title_id}/lock-strings"
    description: "Freeze the string set for translation. Title PLANNING -> STRINGS_LOCKED."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: Title
    side_effects: ["every EXTRACTED StringKey of the title -> LOCKED", "string_lock true", "extracted_key_count frozen", "calculations.title_release_gate_state"]

  # ---- MarketPlan --------------------------------------------------------
  - method: POST
    path: "/market-plans"
    description: "Add a target market to a title. rating_board must equal MARKET_BOARD[market_code]. Starts in DRAFT."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 201
    input: [title_id, market_code, rating_board, target_rating, scope_tier, cultural_adaptation_required, budget_cap_cents, required_voice_line_count]
    output: MarketPlan
    side_effects: ["Title.market_plan_count incremented", "calculations.title_release_gate_state"]

  - method: GET
    path: "/market-plans/{market_plan_id}"
    description: "Fetch one market plan with its effort, cost and overage fields."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: MarketPlan
    side_effects: []

  - method: GET
    path: "/market-plans"
    description: "List market plans; filter by title_id for reverse reachability. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["title_id?", "market_code?", "status?", "scope_tier?", "limit?", "offset?"]
    output: MarketPlan[]
    side_effects: []

  - method: POST
    path: "/market-plans/{market_plan_id}/scope"
    description: "Lock the localization scope for this market. DRAFT -> SCOPED. Computes the SCOPE_ESTIMATE effort variant."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: MarketPlan
    side_effects: ["calculations.market_text_effort_units variant SCOPE_ESTIMATE", "text_effort_variant := SCOPE_ESTIMATE", "calculations.market_localization_cost_cents", "required_unit_count := count of non-retired StringKeys of the title"]

  - method: POST
    path: "/market-plans/{market_plan_id}/start-localization"
    description: "Hand the market to the vendor. SCOPED -> IN_LOCALIZATION. Requires Title.localization_state == STRINGS_LOCKED. Cascade-creates one PENDING TranslationUnit per LOCKED StringKey of the title (discoverable only via GET /translation-units?market_plan_id=)."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: MarketPlan
    side_effects: ["one TranslationUnit per LOCKED StringKey created in translation_status PENDING / qa_status NOT_CHECKED, in StringKey created_at ASC order so GET /translation-units?market_plan_id= returns them in that same order", "required_unit_count := number of units created", "delivered_unit_count := 0", "Title.localization_state PLANNING/STRINGS_LOCKED -> STRINGS_LOCKED (unchanged) and Title.release_gate_state recomputed"]

  - method: POST
    path: "/market-plans/{market_plan_id}/enter-lqa"
    description: "Close translation and open the QA phase. IN_LOCALIZATION -> LQA. Recomputes effort with the DELIVERED_ACTUAL variant and the cost that follows from it."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 200
    input: []
    output: MarketPlan
    side_effects: ["calculations.market_text_effort_units variant DELIVERED_ACTUAL", "text_effort_variant := DELIVERED_ACTUAL", "calculations.market_localization_cost_cents", "Title.localization_state -> CERT_WINDOW when every market plan of the title has left IN_LOCALIZATION", "calculations.title_release_gate_state"]

  - method: POST
    path: "/market-plans/{market_plan_id}/mark-release-ready"
    description: "Declare the market shippable. LQA -> RELEASE_READY. Runs the full compliance, quality, rating-band and budget gate ladder."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: MarketPlan
    side_effects: ["Title.ready_market_count incremented", "Title.localization_state -> SHIPPED when ready_market_count == market_plan_count", "calculations.title_release_gate_state"]

  - method: POST
    path: "/market-plans/{market_plan_id}/block"
    description: "Block a market from any status except RELEASE_READY. -> BLOCKED with a blocked_reason."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: [blocked_reason]
    output: MarketPlan
    side_effects: ["every SCHEDULED VoiceSession of the market plan -> CANCELLED with its ledger and booth reservations reversed", "calculations.booth_reserved_minutes_total", "calculations.talent_commitment_ledger", "calculations.title_release_gate_state -> BLOCKED"]

  # ---- StringKey ---------------------------------------------------------
  - method: POST
    path: "/string-keys"
    description: "Extract one source string. Starts in EXTRACTED. display_char_limit is the target-side overflow budget."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 201
    input: [title_id, key_name, source_text, source_char_count, ui_surface, display_char_limit, tm_match_pct, "context_note?"]
    output: StringKey
    side_effects: ["Title.extracted_key_count incremented"]

  - method: GET
    path: "/string-keys/{string_key_id}"
    description: "Fetch one string key."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: StringKey
    side_effects: []

  - method: GET
    path: "/string-keys"
    description: "List string keys; filter by title_id for reverse reachability. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["title_id?", "status?", "ui_surface?", "limit?", "offset?"]
    output: StringKey[]
    side_effects: []

  - method: PATCH
    path: "/string-keys/{string_key_id}"
    description: "Add or replace translator context, or retire a key. Only permitted while the key is EXTRACTED; a LOCKED key rejects the change."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 200
    input: ["context_note?", "tm_match_pct?", "retire?"]
    output: StringKey
    side_effects: ["retire true -> status RETIRED and Title.extracted_key_count decremented"]

  # ---- TranslationUnit (created only by the start-localization cascade) ---
  - method: GET
    path: "/translation-units/{translation_unit_id}"
    description: "Fetch one translation unit with its overflow_chars and qa_status."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: TranslationUnit
    side_effects: []

  - method: GET
    path: "/translation-units"
    description: "List translation units; the only discovery channel for cascade-created units. Filter by market_plan_id or string_key_id. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["market_plan_id?", "string_key_id?", "translation_status?", "qa_status?", "limit?", "offset?"]
    output: TranslationUnit[]
    side_effects: []

  - method: PUT
    path: "/translation-units/{translation_unit_id}"
    description: "Vendor writes the target text. PENDING -> DRAFTED (or updates a DRAFTED unit). Recomputes overflow_chars against the key's display_char_limit."
    roles: [TranslationVendor, PlatformAdmin]
    code: 200
    input: [target_text, target_char_count, applied_tm_match_pct]
    output: TranslationUnit
    side_effects: ["overflow_chars := max(0, target_char_count - StringKey.display_char_limit)", "translation_status -> DRAFTED"]

  - method: POST
    path: "/translation-units/{translation_unit_id}/deliver"
    description: "Vendor delivers the unit. DRAFTED -> DELIVERED."
    roles: [TranslationVendor, PlatformAdmin]
    code: 200
    input: []
    output: TranslationUnit
    side_effects: ["MarketPlan.delivered_unit_count incremented"]

  - method: POST
    path: "/translation-units/{translation_unit_id}/qa-mark"
    description: "LQA tester records the outcome of an inspection on the second, independent qa_status axis. Requires the unit to be DELIVERED."
    roles: [LqaTester, PlatformAdmin]
    code: 200
    input: [qa_status]
    output: TranslationUnit
    side_effects: ["qa_status moves on its own axis without changing translation_status"]

  # ---- RecordingBooth ----------------------------------------------------
  - method: POST
    path: "/booths"
    description: "Register a recording booth. turnaround_buffer_minutes defaults to 30 and is the buffer appended to every session on this booth."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 201
    input: [booth_code, studio_city, "turnaround_buffer_minutes?"]
    output: RecordingBooth
    side_effects: ["reserved_minutes_total initialised to 0"]

  - method: GET
    path: "/booths/{recording_booth_id}"
    description: "Fetch one booth with its conserved reserved_minutes_total."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: []
    output: RecordingBooth
    side_effects: []

  - method: GET
    path: "/booths"
    description: "List booths. created_at ASC."
    roles: [LocalizationProducer, TranslationVendor, LqaTester, ComplianceOfficer, RatingBoardLiaison, TalentAgent, PlatformAdmin]
    code: 200
    input: ["studio_city?", "limit?", "offset?"]
    output: RecordingBooth[]
    side_effects: []

  # ---- VoiceTalent -------------------------------------------------------
  - method: POST
    path: "/voice-talents"
    description: "Register voice talent. max_daily_recording_minutes defaults to 240 and caps the aggregate daily booking."
    roles: [LocalizationProducer, PlatformAdmin]
    code: 201
    input: [talent_name, language_code, union_flag, "max_daily_recording_minutes?"]
    output: VoiceTalent
    side_effects: []

  - method: GET
    path: "/voice-talents/{voice_talent_id}"
