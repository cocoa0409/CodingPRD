scenario: "922. Hormone-Pellet & Wellness-Injection Clinic: consult & lab, pellet-insertion procedure & schedule, inventory (pellet/lot) & standing order, membership & series, follow-up lab & re-dose, adverse-event, self-pay/financing, recall"
domain_name: "hormone-pellet-wellness-injection-clinic"
api_prefix: "/clinic"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Ops-run checkpoint"
    - "Selector policy"

  entity_topology: graph
  # graph: Procedure, PelletAllocation, PelletLot, StandingOrder, Provider, Patient,
  # SeriesPack, Membership and AdverseEvent form a many-to-many reference web. A
  # single Procedure references 7 peers; PelletAllocation is a true junction between
  # Procedure and PelletLot; AdverseEvent is polymorphic across Procedure /
  # InjectionVisit / PelletLot / StandingOrder. No URL nesting beyond the two
  # junction sub-resources.

  state_machine_shape: parallel
  # 14 declared axes. Procedure carries TWO independent axes on one row
  # (status x recall_status). Procedure.status, PelletLot.sterility_status,
  # StandingOrder.status, Membership.status, SeriesPack.status and
  # FinancingPlan.status are all cyclic. PelletAllocation, LabPanel,
  # AdverseEvent, InjectionVisit and PatientNotification branch with divergent
  # side-effect sets. Patient.eligibility_status is compound (derived from two
  # independent boolean holds).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - polymorphic
    - cross_aggregate

  role_model: delegated_authority
  # A physician's StandingOrder delegates administration authority to
  # NurseInjector within a typed, dose-capped, time-bounded scope. Segregation of
  # duties is layered on top: an AdverseEvent reporter may never be its reviewer.

  consistency_model: immediate

timekeeping:
  logical_clock: |
    The server holds a logical UTC clock. Its startup default is exactly
    2026-05-01T00:00:00Z and it MUST NOT fall back to real wall-clock time.
    POST /clinic/_clock/set_current_utc moves it. Every rule that says "now"
    reads this clock.
  day_arithmetic: |
    days_between(a, b) = floor((b - a) / 86400) where a and b are UTC instants
    expressed in seconds. Whole 24-hour periods only; never calendar-date
    subtraction. Every *_DAYS constant is compared against this function.
  hour_arithmetic: |
    hours_between(a, b) = (b - a) / 3600 as an exact real number (not floored).
    Every *_HOURS constant is compared against this function.
  datetime_rendering: |
    Every datetime field in every response body is rendered as ISO 8601 UTC with
    exactly three fractional-second digits and a trailing Z, e.g.
    "2026-05-01T00:00:00.000Z". This applies uniformly to system-stamped fields
    (created_at, updated_at, resulted_at, performed_at) AND to fields echoed back
    from request input (drawn_at, scheduled_start, valid_from, expiry_date,
    onset_at, first_due_date). Input MAY arrive with or without fractional
    digits; the server normalises to three digits on output.
  money: |
    All money is integer cents. Rounding, wherever a rule invokes it, is
    round_half_up applied to a non-negative magnitude.

domain_constants:
  # ---- Seam 1: dose -> pellet-count conversion -------------------------------
  PELLET_LADDER_TESTOSTERONE_MG: [200, 100]     # [large_strength, small_strength]
  PELLET_LADDER_ESTRADIOL_MG: [25, 10]
  MAX_DOSE_PER_PROCEDURE_MG_TESTOSTERONE: 2000
  MAX_DOSE_PER_PROCEDURE_MG_ESTRADIOL: 150
  ROLLING_MG_WINDOW_DAYS: 365
  ROLLING_MG_CAP_TESTOSTERONE: 4800
  ROLLING_MG_CAP_ESTRADIOL: 400

  # ---- Seam 2: two ranges on one number --------------------------------------
  LAB_REF_LOW_TOTAL_TESTOSTERONE: 264
  LAB_REF_HIGH_TOTAL_TESTOSTERONE: 916
  OPTIMAL_LOW_TOTAL_TESTOSTERONE: 600
  OPTIMAL_HIGH_TOTAL_TESTOSTERONE: 900
  CRITICAL_HIGH_TOTAL_TESTOSTERONE: 1500
  LAB_REF_LOW_ESTRADIOL: 30
  LAB_REF_HIGH_ESTRADIOL: 400
  OPTIMAL_LOW_ESTRADIOL: 80
  OPTIMAL_HIGH_ESTRADIOL: 200
  CRITICAL_HIGH_ESTRADIOL: 500
  LAB_REF_LOW_HEMATOCRIT: 38.0
  LAB_REF_HIGH_HEMATOCRIT: 50.0
  OPTIMAL_LOW_HEMATOCRIT: 40.0
  OPTIMAL_HIGH_HEMATOCRIT: 46.0
  HEMATOCRIT_SAFETY_CEILING: 52.0
  CRITICAL_HIGH_HEMATOCRIT: 54.0
  LAB_MAX_AGE_DAYS: 45

  # ---- Seam 3: re-dose eligibility gate --------------------------------------
  MIN_REDOSE_INTERVAL_DAYS_TESTOSTERONE: 84
  MIN_REDOSE_INTERVAL_DAYS_ESTRADIOL: 70
  TROUGH_WINDOW_OPEN_DAYS_TESTOSTERONE: 70
  TROUGH_WINDOW_CLOSE_DAYS_TESTOSTERONE: 98
  TROUGH_WINDOW_OPEN_DAYS_ESTRADIOL: 56
  TROUGH_WINDOW_CLOSE_DAYS_ESTRADIOL: 84
  REDOSE_MIN_SYMPTOM_SCORE: 40

  # ---- Seam 10: scheduling friction ------------------------------------------
  PROCEDURE_DURATION_MINUTES: 45
  INJECTION_DURATION_MINUTES: 15
  PROVIDER_SLOT_BUFFER_MINUTES: 20
  POST_INSERTION_RESTRICTION_DAYS: 14
  LATE_CANCEL_TIER1_LEAD_HOURS: 48
  LATE_CANCEL_TIER2_LEAD_HOURS: 24
  LATE_CANCEL_TIER1_FEE_CENTS: 5000
  LATE_CANCEL_TIER2_FEE_CENTS: 12500
  NO_SHOW_FEE_CENTS: 20000

  # ---- Pricing ----------------------------------------------------------------
  INSERTION_BASE_FEE_CENTS: 25000
  PELLET_PRICE_CENTS_PER_MG_TESTOSTERONE: 21.5
  PELLET_PRICE_CENTS_PER_MG_ESTRADIOL: 176.25
  FACILITY_FEE_BASE_CENTS: 7500
  FACILITY_FEE_WAIVER_THRESHOLD_CENTS: 42625
  # Reachability note: 42625 is exactly attainable - an ESTRADIOL procedure of
  # 100 mg resolves to 4 x 25 mg pellets, whose pellet line rounds to 17625,
  # plus INSERTION_BASE_FEE_CENTS 25000 = 42625 with no membership discount. Both
  # the waived and the charged branch are therefore reachable, and the `>=`
  # boundary can be hit on the nose.
  INJECTION_LIST_PRICE_CENTS_B12: 3500
  INJECTION_LIST_PRICE_CENTS_LIPOTROPIC: 4500
  INJECTION_LIST_PRICE_CENTS_VITAMIN_D: 5500
  INJECTION_LIST_PRICE_CENTS_GLUTATHIONE: 8500

  # ---- Seam 7: membership + series -------------------------------------------
  MEMBERSHIP_FEE_CENTS_BASIC: 4900
  MEMBERSHIP_FEE_CENTS_PLUS: 9900
  MEMBERSHIP_FEE_CENTS_ELITE: 19900
  MEMBERSHIP_DISCOUNT_PCT_BASIC: 0.00
  MEMBERSHIP_DISCOUNT_PCT_PLUS: 0.10
  MEMBERSHIP_DISCOUNT_PCT_ELITE: 0.20
  MEMBERSHIP_INCLUDED_VISITS_BASIC: 0
  MEMBERSHIP_INCLUDED_VISITS_PLUS: 2
  MEMBERSHIP_INCLUDED_VISITS_ELITE: 4
  MEMBERSHIP_PERIOD_DAYS: 30
  MAX_PAUSE_DAYS_PER_YEAR: 90
  SERIES_PACK_VISITS: 8
  SERIES_PACK_DISCOUNT_PCT: 0.15
  SERIES_ENROLLMENT_FEE_CENTS: 2500
  SERIES_VALIDITY_DAYS: 365

  # ---- Seam 8: self-pay + financing ------------------------------------------
  FINANCING_MIN_DOWN_PAYMENT_PCT: 0.20
  FINANCING_MAX_INSTALLMENTS: 12
  FINANCING_MIN_INSTALLMENTS: 2
  FINANCING_INSTALLMENT_INTERVAL_DAYS: 30
  FINANCING_GRACE_PERIOD_DAYS: 10
  FINANCING_DEFAULT_MISSED_THRESHOLD: 3
  FINANCING_LATE_FEE_CENTS: 2500

  # ---- Seams 5 & 9: recall + adverse event -----------------------------------
  RECALL_NOTIFICATION_DUE_DAYS: 7
  MODERATE_REVIEW_DUE_DAYS: 14
  SEVERE_REVIEW_DUE_HOURS: 24
  STANDING_ORDER_MAX_VALIDITY_DAYS: 365

conservation_invariants:
  - id: lot_pellet_conservation
    conserved_quantity: "discrete pellets held against a PelletLot"
    formula: |
      PelletLot.qty_received ==
        PelletLot.qty_on_hand + PelletLot.qty_reserved + PelletLot.qty_consumed
        + PelletLot.qty_wasted + PelletLot.qty_returned
    holds_after: |
      Every one of: lot create, lot release, FEFO allocation, allocation release
      on procedure cancel, supply open, perform (split into inserted/wasted),
      procedure void, and lot recall. Note qty_reserved covers BOTH allocation
      status RESERVED and OPENED: opening the sterile tray changes allocation
      status only, never lot buckets.
    compensating_pair: |
      Forward = POST /clinic/procedures/{id}/allocations (on_hand -> reserved).
      Compensator = POST /clinic/procedures/{id}/cancel from CONSENTED
      (reserved -> on_hand). Round trip leaves all five buckets at their
      pre-allocation values.
  - id: series_entitlement_conservation
    conserved_quantity: "visit entitlements in a SeriesPack pool"
    formula: |
      SeriesPack.purchased_visits ==
        SeriesPack.remaining_visits + SeriesPack.redeemed_visits
        + SeriesPack.refunded_visits + SeriesPack.forfeited_visits
    holds_after: |
      Pack purchase, injection administration (redeem), injection void
      (redeem -> remaining), pack refund (remaining -> refunded), and expiry
      forfeit (remaining -> forfeited).
    compensating_pair: |
      Forward = POST /clinic/injection-visits/{id}/administer with
      payment_source SERIES (remaining -> redeemed).
      Compensator = POST /clinic/injection-visits/{id}/void
      (redeemed -> remaining). Round trip restores remaining_visits exactly and
      leaves refunded_visits and forfeited_visits untouched.
  - id: financing_money_conservation
    conserved_quantity: "cents of financed principal"
    formula: |
      leg A: FinancingPlan.principal_cents ==
               FinancingPlan.down_payment_cents
               + sum(FinancingPlan.schedule[i].amount_cents for all i)
      leg B: sum(FinancingPlan.schedule[i].amount_cents for all i) ==
               FinancingPlan.paid_installment_cents
               + FinancingPlan.outstanding_cents
               + FinancingPlan.waived_cents
    holds_after: |
      Plan creation, activation, each installment payment, each write-off, the
      delinquency sweep, and plan cancellation on procedure cancel. late_fee_cents
      and refunded_cents sit OUTSIDE both legs: a late fee is new money owed, not
      a redistribution of principal, and a refund is money returned to the patient
      that never re-enters the schedule.

entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO calendar date, YYYY-MM-DD."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across patients."
        constraints: "unique"
      - name: sex_at_birth
        type: enum
        source: input
        description: "Recorded sex at birth."
        constraints: "one of: MALE, FEMALE"
      - name: clinical_hold
        type: boolean
        source: computed
        description: "True while a SEVERE AdverseEvent or a CLASS_I recall notification holds this patient out of procedures."
        default: false
      - name: financial_hold
        type: boolean
        source: computed
        description: "True while this patient has at least one FinancingPlan in status DEFAULTED."
        default: false
      - name: eligibility_status
        type: enum
        source: computed
        description: "Compound projection of the two hold booleans; recomputed on every mutation that touches either."
        constraints: "one of: CLEAR, CLINICAL_HOLD, FINANCIAL_HOLD, DUAL_HOLD"
        default: "CLEAR"
      - name: cumulative_mg_testosterone
        type: number
        source: computed
        description: "Lifetime sum of Procedure.delivered_total_mg over this patient's COMPLETED testosterone procedures."
        default: 0
      - name: cumulative_mg_estradiol
        type: number
        source: computed
        description: "Lifetime sum of Procedure.delivered_total_mg over this patient's COMPLETED estradiol procedures."
        default: 0
      - name: last_insertion_at
        type: datetime
        source: computed
        description: "performed_at of the most recent COMPLETED Procedure of any hormone_type for this patient; null when none."
      - name: last_insertion_hormone_type
        type: enum
        source: computed
        description: "hormone_type of the Procedure that supplied last_insertion_at; null when none."
        constraints: "one of: TESTOSTERONE, ESTRADIOL, or null"
      - name: open_notification_count
        type: integer
        source: computed
        description: "Count of this patient's PatientNotification rows whose status is in {PENDING, OVERDUE}."
        default: 0

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Provider legal name."
      - name: provider_type
        type: enum
        source: input
        description: "Licensure class; only PHYSICIAN may author a StandingOrder or review an AdverseEvent."
        constraints: "one of: PHYSICIAN, NURSE_INJECTOR"
      - name: npi
        type: string
        source: input
        description: "National provider identifier; unique across providers."
        constraints: "unique"
      - name: active
        type: boolean
        source: input
        description: "Whether this provider may be booked."
        default: true

  - name: Protocol
    parent: null
    common_fields: false
    fields:
      - name: hormone_type
        type: enum
        source: input
        description: "Which hormone therapy this protocol governs."
        constraints: "one of: TESTOSTERONE, ESTRADIOL"
      - name: protocol_version
        type: integer
        source: computed
        description: "1 + the highest protocol_version already published for the same hormone_type; starts at 1."
      - name: title
        type: string
        source: input
        description: "Human-readable protocol title."
      - name: published_by_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; must be a Provider whose provider_type is PHYSICIAN."
      - name: effective_at
        type: datetime
        source: system
        description: "Logical-clock instant at publication."

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: hormone_type
        type: enum
        source: input
        description: "Hormone therapy this consent covers."
        constraints: "one of: TESTOSTERONE, ESTRADIOL"
      - name: protocol_version
        type: integer
        source: input
        description: "Protocol version the patient consented under; pinned at signing and never rewritten."
      - name: consented_max_dose_mg
        type: number
        source: input
        description: "Maximum delivered total mg per procedure the patient consented to."
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant at signing."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE until superseded by a newer consent for the same patient+hormone_type, by a protocol publication, or by a SEVERE AdverseEvent."
        constraints: "one of: ACTIVE, SUPERSEDED"
        default: "ACTIVE"

  - name: Consult
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: physician_id
        type: string
        source: input
        description: "FK -> Provider.id; must be a Provider whose provider_type is PHYSICIAN."
      - name: hormone_type
        type: enum
        source: input
        description: "Hormone prescribed at this consult."
        constraints: "one of: TESTOSTERONE, ESTRADIOL"
      - name: prescribed_dose_mg
        type: number
        source: input
        description: "Target hormone dose in mg; converted to a discrete pellet plan by pellet_count_from_dose."
        constraints: "greater than 0"
      - name: symptom_score
        type: integer
        source: input
        description: "Validated symptom burden score used by the re-dose gate."
        constraints: "integer 0..100 inclusive"
      - name: indication
        type: string
        source: input
        description: "Free-text clinical indication."
      - name: planned_large_count
        type: integer
        source: computed
        description: "Number of large-strength pellets in the plan, from pellet_count_from_dose."
      - name: planned_small_count
        type: integer
        source: computed
        description: "Number of small-strength pellets in the plan, from pellet_count_from_dose."
      - name: planned_total_mg
        type: number
        source: computed
        description: "planned_large_count * large_strength + planned_small_count * small_strength."
      - name: planned_pellet_count
        type: integer
        source: computed
        description: "planned_large_count + planned_small_count."

  - name: LabPanel
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: ordered_by_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the provider who ordered the draw."
      - name: acknowledged_by_provider_id
        type: string
        source: computed
        description: "FK -> Provider.id; set by the critical-value acknowledgement, null otherwise."
      - name: analyte
        type: enum
        source: input
        description: "Which analyte this panel reports."
        constraints: "one of: TOTAL_TESTOSTERONE, ESTRADIOL, HEMATOCRIT"
      - name: value
        type: number
        source: input
        description: "Measured analyte value in the analyte's canonical unit."
      - name: unit
        type: string
        source: computed
        description: "ng/dL for TOTAL_TESTOSTERONE, pg/mL for ESTRADIOL, percent for HEMATOCRIT."
      - name: drawn_at
        type: datetime
        source: input
        description: "Instant the specimen was drawn; drives staleness and trough-window checks."
      - name: resulted_at
        type: datetime
        source: system
        description: "Logical-clock instant the result was recorded."
      - name: is_trough_draw
        type: boolean
        source: input
        description: "Whether the draw was taken as a trough specimen."
        default: false
      - name: lab_reference_band
        type: enum
        source: computed
        description: "Classification of value against the standard laboratory reference interval for the analyte."
        constraints: "one of: BELOW_REF, IN_REF, ABOVE_REF"
      - name: clinic_optimal_band
        type: enum
        source: computed
        description: "Classification of the same value against the clinic's narrower therapeutic target band."
        constraints: "one of: BELOW_OPTIMAL, IN_OPTIMAL, ABOVE_OPTIMAL"
      - name: critical_flag
        type: boolean
        source: computed
        description: "True when value exceeds the analyte's CRITICAL_HIGH constant."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the panel."
        constraints: "one of: RECORDED, CRITICAL_FLAGGED, ACKNOWLEDGED, SUPERSEDED"
        default: "RECORDED"

  - name: PelletLot
    parent: null
    common_fields: true
    fields:
      - name: lot_code
        type: string
        source: input
        description: "Manufacturer lot code; unique across lots."
        constraints: "unique"
      - name: hormone_type
        type: enum
        source: input
        description: "Hormone the pellets in this lot contain."
        constraints: "one of: TESTOSTERONE, ESTRADIOL"
      - name: strength_mg
        type: number
        source: input
        description: "Milligrams per pellet; must be a member of the ladder for hormone_type."
        constraints: "TESTOSTERONE in {200, 100}; ESTRADIOL in {25, 10}"
      - name: expiry_date
        type: datetime
        source: input
        description: "Instant after which pellets from this lot may not be allocated."
      - name: qty_received
        type: integer
        source: input
        description: "Pellets received into the lot; immutable after creation and the left side of lot_pellet_conservation."
        constraints: "greater than 0"
      - name: qty_on_hand
        type: integer
        source: computed
        description: "Pellets free to allocate."
      - name: qty_reserved
        type: integer
        source: computed
        description: "Pellets held by PelletAllocation rows in status RESERVED or OPENED."
        default: 0
      - name: qty_consumed
        type: integer
        source: computed
        description: "Pellets actually inserted into patients."
        default: 0
      - name: qty_wasted
        type: integer
        source: computed
        description: "Pellets opened and then destroyed (broken on insertion, or tray abandoned on cancel)."
        default: 0
      - name: qty_returned
        type: integer
        source: computed
        description: "Pellets pulled back out of circulation by a recall."
        default: 0
      - name: sterility_status
        type: enum
        source: computed
        description: "Release posture of the lot; only RELEASED lots are FEFO candidates."
        constraints: "one of: QUARANTINED, RELEASED, RECALLED"
        default: "QUARANTINED"
      - name: recall_severity
        type: enum
        source: computed
        description: "Severity class recorded by the recall action; null before recall."
        constraints: "one of: CLASS_I, CLASS_II, or null"
      - name: recalled_at
        type: datetime
        source: computed
        description: "Logical-clock instant the recall was executed; null before recall."
      - name: recall_reason
        type: string
        source: computed
        description: "Reason text recorded by the recall action; null before recall."

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - name: physician_id
        type: string
        source: input
        description: "FK -> Provider.id; the delegating physician, who must have provider_type PHYSICIAN."
      - name: scope_hormone_types
        type: array
        source: input
        description: "Hormone types a NurseInjector may insert under this order; may be empty."
        constraints: "subset of {TESTOSTERONE, ESTRADIOL}"
      - name: scope_injection_types
        type: array
        source: input
        description: "Wellness-injection types a NurseInjector may administer under this order; may be empty."
        constraints: "subset of {B12, LIPOTROPIC, VITAMIN_D, GLUTATHIONE}"
      - name: max_dose_mg
        type: number
        source: input
        description: "Ceiling on Procedure.planned_total_mg a NurseInjector may deliver under this order."
        constraints: "greater than 0"
      - name: valid_from
        type: datetime
        source: input
        description: "Start of the delegation window, inclusive."
      - name: valid_until
        type: datetime
        source: input
        description: "End of the delegation window, inclusive; at most STANDING_ORDER_MAX_VALIDITY_DAYS after valid_from."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on creation. There is no EXPIRED value: expiry is evaluated at gate time by comparing the clock against valid_from/valid_until, so an ACTIVE-but-lapsed order still fails the gate."
        constraints: "one of: ACTIVE, SUSPENDED, REVOKED"
        default: "ACTIVE"
      - name: suspended_reason
        type: string
        source: computed
        description: "Set when a SEVERE AdverseEvent suspends this order; null otherwise."

  - name: Procedure
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the operator who will perform the insertion."
      - name: consult_id
        type: string
        source: input
        description: "FK -> Consult.id; supplies hormone_type, prescribed dose and symptom_score."
      - name: standing_order_id
        type: string
        source: input
        description: "FK -> StandingOrder.id; the order that would govern a NurseInjector-performed insertion."
      - name: consent_record_id
        type: string
        source: computed
        description: "FK -> ConsentRecord.id; set by consent-attach, cleared when a protocol publication de-consents the procedure."
      - name: lab_panel_id
        type: string
        source: input
        description: "FK -> LabPanel.id; the trough panel supporting a REDOSE; null for INITIAL."
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the membership whose discount applies to the charge; null for non-members."
      - name: procedure_type
        type: enum
        source: input
        description: "INITIAL skips the re-dose gate entirely; REDOSE runs all five re-dose rungs."
        constraints: "one of: INITIAL, REDOSE"
      - name: hormone_type
        type: enum
        source: computed
        description: "Copied from the referenced Consult at scheduling time."
        constraints: "one of: TESTOSTERONE, ESTRADIOL"
      - name: room_code
        type: string
        source: input
        description: "Treatment room identifier; room double-booking is checked on this string."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Slot start instant."
      - name: scheduled_end
        type: datetime
        source: computed
        description: "scheduled_start + PROCEDURE_DURATION_MINUTES."
      - name: planned_pellet_count
        type: integer
        source: computed
        description: "Copied from Consult.planned_pellet_count at scheduling time."
      - name: planned_total_mg
        type: number
        source: computed
        description: "Copied from Consult.planned_total_mg at scheduling time."
      - name: pellets_allocated
        type: integer
        source: computed
        description: "Sum of quantity over this procedure's PelletAllocation rows in status RESERVED, OPENED, CONSUMED, WASTED or RECALL_FLAGGED."
        default: 0
      - name: pellets_opened
        type: integer
        source: computed
        description: "Pellets whose sterile tray has been opened; set by open-supply."
        default: 0
      - name: pellets_inserted
        type: integer
        source: computed
        description: "Pellets actually implanted; set by perform."
        default: 0
      - name: pellets_wasted
        type: integer
        source: computed
        description: "Pellets destroyed; set by perform (breakage) or by cancel from SUPPLY_OPENED (whole tray)."
        default: 0
      - name: delivered_total_mg
        type: number
        source: computed
        description: "Actual milligrams implanted; sum over CONSUMED allocations of quantity * strength_mg."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Primary lifecycle axis."
        constraints: "one of: SCHEDULED, CONSENTED, SUPPLY_OPENED, COMPLETED, CANCELLED, VOIDED, SUPPLY_HOLD"
        default: "SCHEDULED"
      - name: recall_status
        type: enum
        source: computed
        description: "Second, independent axis on the same row: recall exposure of the pellets this procedure consumed."
        constraints: "one of: NONE, RECALL_AFFECTED, NOTIFIED"
        default: "NONE"
      - name: charge_cents
        type: integer
        source: computed
        description: "Patient-owed total from visit_invoice_total_cents; computed at perform."
        default: 0
      - name: cancel_tier
        type: enum
        source: computed
        description: "Lead-time tier that produced cancel_fee_cents; null while not cancelled."
        constraints: "one of: NONE, TIER1, TIER2, NO_SHOW, or null"
      - name: cancel_fee_cents
        type: integer
        source: computed
        description: "Fee charged on cancellation after the membership discount."
        default: 0
      - name: performed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of perform; null otherwise."
      - name: hold_reason
        type: string
        source: computed
        description: "Why the procedure sits in SUPPLY_HOLD; null otherwise."

  - name: PelletAllocation
    parent: Procedure
    common_fields: true
    fields:
      - name: procedure_id
        type: string
        source: system
        description: "FK -> Procedure.id"
      - name: lot_id
        type: string
        source: system
        description: "FK -> PelletLot.id; chosen by the FEFO selector, never supplied by the client."
      - name: strength_mg
        type: number
        source: computed
        description: "Copied from the chosen lot."
      - name: quantity
        type: integer
        source: computed
        description: "Pellets drawn from this lot for this procedure."
      - name: allocation_rank
        type: integer
        source: computed
        description: "1-based position of this lot in the FEFO ordering that produced the plan."
      - name: status
        type: enum
        source: computed
        description: "Allocation lifecycle; branches into consumed/wasted at perform and into released/recall-released on compensation."
        constraints: "one of: RESERVED, OPENED, CONSUMED, WASTED, RELEASED, RECALL_RELEASED, RECALL_FLAGGED"
        default: "RESERVED"

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: tier
        type: enum
        source: input
        description: "Membership tier; drives fee, discount and included-visit allowance."
        constraints: "one of: BASIC, PLUS, ELITE"
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: "MEMBERSHIP_FEE_CENTS_<tier>."
      - name: discount_pct
        type: number
        source: computed
        description: "MEMBERSHIP_DISCOUNT_PCT_<tier>; applied to procedure subtotals and to cancellation fees."
      - name: included_visits_allowance
        type: integer
        source: computed
        description: "MEMBERSHIP_INCLUDED_VISITS_<tier> injection visits per period."
      - name: included_visits_used
        type: integer
        source: computed
        description: "Included visits consumed in the current period; reset to 0 only by tier-change, never by pause/resume."
        default: 0
      - name: period_start
        type: datetime
        source: system
        description: "Logical-clock instant of enrolment or of the most recent tier change."
      - name: period_end
        type: datetime
        source: computed
        description: "period_start + MEMBERSHIP_PERIOD_DAYS, extended by each resume."
      - name: status
        type: enum
        source: computed
        description: "Membership lifecycle."
        constraints: "one of: ACTIVE, PAUSED, CANCELLED"
        default: "ACTIVE"
      - name: paused_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the current pause; null while ACTIVE or CANCELLED."
      - name: pause_days_used
        type: integer
        source: computed
        description: "Cumulative paused days charged against MAX_PAUSE_DAYS_PER_YEAR."
        default: 0
      - name: pause_credit_cents
        type: integer
        source: computed
        description: "Unapplied prorated credit banked by pauses."
        default: 0

  - name: SeriesPack
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; a pack is bound to this patient and is never transferable."
      - name: series_type
        type: enum
        source: input
        description: "Which wellness injection the pack entitles."
        constraints: "one of: B12, LIPOTROPIC, VITAMIN_D, GLUTATHIONE"
      - name: purchased_visits
        type: integer
        source: computed
        description: "Always SERIES_PACK_VISITS."
      - name: remaining_visits
        type: integer
        source: computed
        description: "Entitlements still redeemable."
      - name: redeemed_visits
        type: integer
        source: computed
        description: "Entitlements consumed by ADMINISTERED injection visits."
        default: 0
      - name: refunded_visits
        type: integer
        source: computed
        description: "Entitlements bought back by a pack refund."
        default: 0
      - name: forfeited_visits
        type: integer
        source: computed
        description: "Entitlements destroyed by expiry."
        default: 0
      - name: price_cents
        type: integer
        source: computed
        description: "From series_pack_price_cents."
      - name: per_visit_value_cents
        type: integer
        source: computed
        description: "floor(price_cents / purchased_visits); the residual rides on the final redemption."
      - name: purchased_at
        type: datetime
        source: system
        description: "Logical-clock instant of purchase."
      - name: expires_at
        type: datetime
        source: computed
        description: "purchased_at + SERIES_VALIDITY_DAYS."
      - name: refunded_cents
        type: integer
        source: computed
        description: "Cash returned by a pack refund."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Pack lifecycle; EXHAUSTED can revert to ACTIVE when an injection visit is voided."
        constraints: "one of: ACTIVE, EXHAUSTED, EXPIRED, REFUNDED"
        default: "ACTIVE"

  - name: InjectionVisit
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the administering operator."
      - name: standing_order_id
        type: string
        source: input
        description: "FK -> StandingOrder.id; governs a NurseInjector-administered visit."
      - name: series_pack_id
        type: string
        source: input
        description: "FK -> SeriesPack.id; supplied when the visit should draw an entitlement; null otherwise."
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; supplied when included-visit allowance or tier discount should apply; null otherwise."
      - name: injection_type
        type: enum
        source: input
        description: "Wellness injection administered."
        constraints: "one of: B12, LIPOTROPIC, VITAMIN_D, GLUTATHIONE"
      - name: room_code
        type: string
        source: input
        description: "Treatment room identifier."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Slot start instant."
      - name: scheduled_end
        type: datetime
        source: computed
        description: "scheduled_start + INJECTION_DURATION_MINUTES."
      - name: payment_source
        type: enum
        source: computed
        description: "Resolved at administration by the fixed precedence SERIES then MEMBERSHIP_INCLUDED then SELF_PAY."
        constraints: "one of: SERIES, MEMBERSHIP_INCLUDED, SELF_PAY"
      - name: charge_cents
        type: integer
        source: computed
        description: "Cash owed for this visit; 0 for SERIES and MEMBERSHIP_INCLUDED."
        default: 0
      - name: series_debit_cents
        type: integer
        source: computed
        description: "Entitlement value drawn down from the pack; 0 unless payment_source is SERIES."
        default: 0
      - name: administered_at
        type: datetime
        source: computed
        description: "Logical-clock instant of administration; null otherwise."
      - name: status
        type: enum
        source: computed
        description: "Visit lifecycle."
        constraints: "one of: SCHEDULED, ADMINISTERED, CANCELLED, VOIDED"
        default: "SCHEDULED"

  - name: AdverseEvent
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: procedure_id
        type: string
        source: input
        description: "FK -> Procedure.id; the implicated insertion, or null."
      - name: injection_visit_id
        type: string
        source: input
        description: "FK -> InjectionVisit.id; the implicated injection visit, or null."
      - name: lot_id
        type: string
        source: input
        description: "FK -> PelletLot.id; the implicated lot, or null."
      - name: standing_order_id
        type: string
        source: input
        description: "FK -> StandingOrder.id; the order that governed the implicated administration, or null."
      - name: reported_by_provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the reporter, who may never also be the reviewer."
      - name: reviewed_by_provider_id
        type: string
        source: computed
        description: "FK -> Provider.id; set by review; null before review."
      - name: severity
        type: enum
        source: input
        description: "Routing key: MILD logs only, MODERATE demands timed review, SEVERE fires the four-hop cascade, SURVEILLANCE is system-generated by recall."
        constraints: "one of: MILD, MODERATE, SEVERE, SURVEILLANCE"
      - name: source
        type: enum
        source: computed
        description: "CLINICAL_REPORT for staff-filed events; RECALL_SURVEILLANCE for events minted by the recall cascade."
        constraints: "one of: CLINICAL_REPORT, RECALL_SURVEILLANCE"
        default: "CLINICAL_REPORT"
      - name: narrative
        type: string
        source: input
        description: "Free-text description of the event."
      - name: onset_at
        type: datetime
        source: input
        description: "Instant symptoms began."
      - name: review_due_at
        type: datetime
        source: computed
        description: "onset-independent deadline: creation instant + MODERATE_REVIEW_DUE_DAYS for MODERATE, + SEVERE_REVIEW_DUE_HOURS for SEVERE, null for MILD and SURVEILLANCE."
      - name: disposition_note
        type: string
        source: computed
        description: "Note recorded at review; null before review."
      - name: status
        type: enum
        source: computed
        description: "OPEN branches to CLOSED or ESCALATED; ESCALATED converges to CLOSED under a second, distinct physician."
        constraints: "one of: OPEN, CLOSED, ESCALATED"
        default: "OPEN"

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: procedure_id
        type: string
        source: input
        description: "FK -> Procedure.id; the financed procedure."
      - name: principal_cents
        type: integer
        source: input
        description: "Total financed amount before any down payment."
        constraints: "greater than 0"
      - name: down_payment_cents
        type: integer
        source: input
        description: "Cash paid up front; at least FINANCING_MIN_DOWN_PAYMENT_PCT of principal_cents."
      - name: installment_count
        type: integer
        source: input
        description: "Number of scheduled installments."
        constraints: "integer between FINANCING_MIN_INSTALLMENTS and FINANCING_MAX_INSTALLMENTS inclusive"
      - name: first_due_date
        type: datetime
        source: input
        description: "Due instant of installment index 1."
      - name: schedule
        type: array
        source: computed
        description: "Ordered installment objects, each with index, due_date, amount_cents and status in {PENDING, PAID, MISSED, WAIVED}."
      - name: paid_installment_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over schedule entries whose status is PAID."
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over schedule entries whose status is PENDING or MISSED."
      - name: waived_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over schedule entries whose status is WAIVED."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Cash returned to the patient by a procedure cancellation settlement; sits outside the conservation legs."
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Accrued late fees; sits outside the conservation legs because it is new money owed, not redistributed principal."
        default: 0
      - name: missed_count
        type: integer
        source: computed
        description: "Count of schedule entries currently in status MISSED."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Plan lifecycle; DELINQUENT can cure back to ACTIVE."
        constraints: "one of: DRAFT, ACTIVE, DELINQUENT, DEFAULTED, PAID_OFF, CANCELLED"
        default: "DRAFT"

  - name: PatientNotification
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: system
        description: "FK -> Patient.id"
      - name: procedure_id
        type: string
        source: system
        description: "FK -> Procedure.id; the affected procedure, or null."
      - name: lot_id
        type: string
        source: system
        description: "FK -> PelletLot.id; the recalled lot, or null."
      - name: notification_type
        type: enum
        source: system
        description: "Why the notification was minted."
        constraints: "one of: RECALL, ADVERSE_EVENT, CONSENT_REQUIRED"
      - name: severity_class
        type: enum
        source: system
        description: "Recall severity carried through from the lot; null for non-recall notifications."
        constraints: "one of: CLASS_I, CLASS_II, or null"
      - name: message
        type: string
        source: computed
        description: "Human-readable notification body."
      - name: due_at
        type: datetime
        source: computed
        description: "Creation instant + RECALL_NOTIFICATION_DUE_DAYS."
      - name: acknowledged_at
        type: datetime
        source: computed
        description: "Logical-clock instant of acknowledgement; null before."
      - name: status
        type: enum
        source: computed
        description: "PENDING until acknowledged; flipped to OVERDUE by the delinquency/ops run once due_at has passed."
        constraints: "one of: PENDING, ACKNOWLEDGED, OVERDUE"
        default: "PENDING"

state_machines:
  # ===========================================================================
  # AXIS 1 of 2 on Procedure - primary lifecycle. Shape: branching + cyclic
  # (CONSENTED -> SCHEDULED de-consent loop, SUPPLY_HOLD -> SCHEDULED release
  # loop) with terminal fan-out to CANCELLED / VOIDED.
  # ===========================================================================
  - entity: Procedure
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: CONSENTED
        trigger: "POST /clinic/procedures/{id}/consent-attach"
        actor: FrontDesk
        preconditions:
          - "Procedure.status == SCHEDULED"
          - "referenced ConsentRecord.status == ACTIVE"
          - "ConsentRecord.patient_id == Procedure.patient_id"
          - "ConsentRecord.hormone_type == Procedure.hormone_type"
          - "ConsentRecord.protocol_version == the highest published Protocol.protocol_version for that hormone_type, else ERR_CONSENT_REQUIRED"
          - "ConsentRecord.consented_max_dose_mg >= Procedure.planned_total_mg, else ERR_CONSENT_DOSE_EXCEEDED"
        side_effects:
          - "Procedure.consent_record_id set to the referenced consent"
          - "increments Procedure.version by 1"

      - from: CONSENTED
        to: SCHEDULED
        trigger: "system, hop 3 of the protocol-publication cascade fired by POST /clinic/protocols"
        actor: system
        preconditions:
          - "Procedure.status == CONSENTED"
          - "Procedure.consent_record_id is one of the ConsentRecord rows superseded in hop 2 of the same cascade"
        side_effects:
          - "Procedure.consent_record_id set to null"
          - "hop 4: mint a PatientNotification for Procedure.patient_id with notification_type CONSENT_REQUIRED, status PENDING, due_at = now + RECALL_NOTIFICATION_DUE_DAYS"
          - "Patient.open_notification_count incremented by 1"
          - "increments Procedure.version by 1"
        note: "The cyclic leg. A procedure can be consented, de-consented by a protocol bump, and consented again under the new version without limit."

      - from: CONSENTED
        to: SUPPLY_OPENED
        trigger: "POST /clinic/procedures/{id}/open-supply"
        actor: "NurseInjector or Physician"
        preconditions:
          - "Procedure.status == CONSENTED"
          - "Procedure.pellets_allocated == Procedure.planned_pellet_count (the FEFO plan is complete)"
          - "when the actor role is NurseInjector, the standing-order write gate at validation priority 9 must pass"
        side_effects:
          - "every PelletAllocation of this procedure in status RESERVED moves to OPENED"
          - "Procedure.pellets_opened set to Procedure.pellets_allocated"
          - "PelletLot bucket totals are UNCHANGED: qty_reserved already covers RESERVED and OPENED alike"
          - "increments Procedure.version by 1"

      - from: SUPPLY_OPENED
        to: COMPLETED
        trigger: "POST /clinic/procedures/{id}/perform"
        actor: "NurseInjector or Physician"
        preconditions:
          - "Procedure.status == SUPPLY_OPENED"
          - "expected_patient_version matches Patient.version (OCC rule procedure-perform-stale-patient)"
          - "Patient.clinical_hold == false"
          - "Patient.financial_hold == false"
          - "the patient has no LabPanel in status CRITICAL_FLAGGED"
          - "pellets_wasted_input <= Procedure.pellets_opened"
          - "when the actor role is NurseInjector, the standing-order write gate at validation priority 9 must pass"
        side_effects:
          - "pellets_wasted_input pellets are taken as waste starting from the HIGHEST allocation_rank and walking downward, so the earliest-expiring lot is consumed first and wastage lands on the latest-expiring lot; the remaining pellets move to CONSUMED"
          - "when a wastage boundary falls inside a row, that PelletAllocation row is SPLIT: the original row keeps its id, its allocation_rank and the CONSUMED remainder as its quantity, and a NEW PelletAllocation row is created against the same procedure_id, lot_id, strength_mg and allocation_rank carrying the wasted quantity with status WASTED. A row wasted in full is simply flipped to WASTED with no split."
          - "for each lot: qty_reserved decreases by that lot's opened quantity, qty_consumed increases by its consumed share, qty_wasted increases by its wasted share (lot_pellet_conservation holds)"
          - "Procedure.pellets_inserted and Procedure.pellets_wasted set"
          - "Procedure.delivered_total_mg recomputed by procedure_delivered_mg variant ACTUAL"
          - "Procedure.performed_at set to the logical clock"
          - "Procedure.charge_cents recomputed by visit_invoice_total_cents"
          - "Patient.cumulative_mg_<hormone> increased by Procedure.delivered_total_mg"
          - "Patient.last_insertion_at and Patient.last_insertion_hormone_type updated"
          - "increments Patient.version by 1"
          - "increments Procedure.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinic/procedures/{id}/cancel"
        actor: "FrontDesk, Physician or Patient"
        preconditions:
          - "Procedure.status == SCHEDULED"
        side_effects:
          - "Procedure.cancel_tier and Procedure.cancel_fee_cents set by late_cancel_fee_cents variant CANCEL_TIER"
          - "every PelletAllocation of this procedure in status RESERVED moves to RELEASED; its lot moves quantity from qty_reserved back to qty_on_hand"
          - "any FinancingPlan whose procedure_id is this procedure and whose status is in {DRAFT, ACTIVE, DELINQUENT} moves to CANCELLED and records refunded_cents from refund_settlement_cents variant FINAL_SETTLEMENT"
          - "increments Procedure.version by 1"

      - from: CONSENTED
        to: CANCELLED
        trigger: "POST /clinic/procedures/{id}/cancel"
        actor: "FrontDesk, Physician or Patient"
        preconditions:
          - "Procedure.status == CONSENTED"
        side_effects:
          - "identical to the SCHEDULED to CANCELLED leg, plus the attached ConsentRecord remains ACTIVE and reusable"
          - "increments Procedure.version by 1"

      - from: SUPPLY_OPENED
        to: CANCELLED
        trigger: "POST /clinic/procedures/{id}/cancel"
        actor: "FrontDesk or Physician"
        preconditions:
          - "Procedure.status == SUPPLY_OPENED"
        side_effects:
          - "every PelletAllocation of this procedure in status OPENED moves to WASTED - an opened sterile tray cannot be returned to stock"
          - "each affected lot moves quantity from qty_reserved to qty_wasted (lot_pellet_conservation holds; qty_on_hand does NOT increase)"
          - "Procedure.pellets_wasted set to Procedure.pellets_opened"
          - "Procedure.cancel_tier and Procedure.cancel_fee_cents set by late_cancel_fee_cents variant CANCEL_TIER"
          - "any FinancingPlan for this procedure in {DRAFT, ACTIVE, DELINQUENT} moves to CANCELLED with refunded_cents from refund_settlement_cents variant FINAL_SETTLEMENT, which now subtracts the wasted-pellet charge"
          - "increments Procedure.version by 1"
        note: "This is the leg that makes the provisional-vs-final refund variants diverge."

      - from: SCHEDULED
        to: SUPPLY_HOLD
        trigger: "system, hop 3 of the severe-adverse-event cascade, hop 3b of the lot-recall cascade, or hop 4 of the delinquency cascade"
        actor: system
        preconditions:
          - "Procedure.status == SCHEDULED"
        side_effects:
          - "Procedure.hold_reason set to STANDING_ORDER_SUSPENDED, LOT_RECALL or PATIENT_FINANCIAL_HOLD depending on the originating cascade"
          - "hop 4 of the severe-adverse-event and lot-recall cascades: every PelletAllocation of this procedure in status RESERVED or OPENED moves to RELEASED and its lot moves quantity from qty_reserved back to qty_on_hand"
          - "increments Procedure.version by 1"

      - from: CONSENTED
        to: SUPPLY_HOLD
        trigger: "system, hop 3 of the severe-adverse-event cascade or hop 3b of the lot-recall cascade"
        actor: system
        preconditions:
          - "Procedure.status == CONSENTED"
        side_effects:
          - "same as the SCHEDULED to SUPPLY_HOLD leg; Procedure.consent_record_id is preserved"
          - "increments Procedure.version by 1"

      - from: SUPPLY_OPENED
        to: SUPPLY_HOLD
        trigger: "system, hop 3 of the severe-adverse-event cascade or hop 3b of the lot-recall cascade"
        actor: system
        preconditions:
          - "Procedure.status == SUPPLY_OPENED"
        side_effects:
          - "every PelletAllocation of this procedure in status OPENED moves to RELEASED and its lot moves quantity from qty_reserved back to qty_on_hand"
          - "Procedure.pellets_opened reset to 0"
          - "increments Procedure.version by 1"
        note: "Deliberate asymmetry with the SUPPLY_OPENED to CANCELLED leg: a systemic hold is not the patient's doing, so the tray is credited back rather than charged as waste."

      - from: SUPPLY_HOLD
        to: SCHEDULED
        trigger: "POST /clinic/standing-orders/{id}/reinstate, or POST /clinic/patients/{id}/eligibility-hold with hold_action CLEAR"
        actor: Physician
        preconditions:
          - "Procedure.status == SUPPLY_HOLD"
          - "for the standing-order path: Procedure.standing_order_id == the reinstated order and Procedure.hold_reason == STANDING_ORDER_SUSPENDED"
          - "for the eligibility-hold path: Procedure.patient_id == the cleared patient and Procedure.hold_reason == PATIENT_FINANCIAL_HOLD"
        side_effects:
          - "Procedure.hold_reason set to null"
          - "Procedure.consent_record_id set to null (the procedure must be re-consented and re-allocated)"
          - "increments Procedure.version by 1"
        note: "The second cyclic leg. Procedures held for LOT_RECALL are NOT released here: neither trigger matches hold_reason LOT_RECALL, so a recall hold is permanent and the procedure can only be cancelled."

      - from: SUPPLY_HOLD
        to: CANCELLED
        trigger: "POST /clinic/procedures/{id}/cancel"
        actor: "FrontDesk or Physician"
        preconditions:
          - "Procedure.status == SUPPLY_HOLD"
        side_effects:
          - "Procedure.cancel_tier set to NONE and Procedure.cancel_fee_cents set to 0 - a clinic-initiated hold never charges the patient"
          - "any FinancingPlan for this procedure in {DRAFT, ACTIVE, DELINQUENT} moves to CANCELLED with a full refund"
          - "increments Procedure.version by 1"

      - from: COMPLETED
        to: VOIDED
        trigger: "POST /clinic/procedures/{id}/void"
        actor: Physician
        preconditions:
          - "Procedure.status == COMPLETED"
        side_effects:
          - "Procedure.delivered_total_mg reset to 0"
          - "Patient.cumulative_mg_<hormone> decreased by the pre-void delivered_total_mg"
          - "Patient.last_insertion_at and Patient.last_insertion_hormone_type recomputed from the remaining COMPLETED procedures"
          - "PelletAllocation rows stay CONSUMED and lot buckets are UNCHANGED - the pellets are physically in the patient and voiding is a billing correction, not a stock return"
          - "increments Patient.version by 1"
          - "increments Procedure.version by 1"

  # ===========================================================================
  # AXIS 2 of 2 on Procedure - recall exposure. Runs independently of status:
  # the same row can be COMPLETED/NONE, COMPLETED/RECALL_AFFECTED or
  # COMPLETED/NOTIFIED, and status transitions never touch this axis.
  # ===========================================================================
  - entity: Procedure
    state_field: recall_status
    initial_state: NONE
    terminal_states: [NOTIFIED]
    transitions:
      - from: NONE
        to: RECALL_AFFECTED
        trigger: "system, hop 3a of the lot-recall cascade fired by POST /clinic/pellet-lots/{id}/recall"
        actor: system
        preconditions:
          - "the procedure owns at least one PelletAllocation that moved to RECALL_FLAGGED in hop 2 of the same cascade"
          - "Procedure.status == COMPLETED"
        side_effects:
          - "increments Procedure.version by 1"
        note: "Explicitly does NOT fire for procedures whose status is VOIDED or CANCELLED, and does NOT fire for allocations that were already RELEASED before the recall."

      - from: RECALL_AFFECTED
        to: NOTIFIED
        trigger: "system, hop 4 of the lot-recall cascade"
        actor: system
        preconditions:
          - "Procedure.recall_status == RECALL_AFFECTED"
        side_effects:
          - "mint a PatientNotification with notification_type RECALL, severity_class = PelletLot.recall_severity, patient_id, procedure_id and lot_id set, status PENDING, due_at = now + RECALL_NOTIFICATION_DUE_DAYS"
          - "Patient.open_notification_count incremented by 1"
          - "hop 5, only when severity_class == CLASS_I: mint an AdverseEvent with severity SURVEILLANCE, source RECALL_SURVEILLANCE, status OPEN, reported_by_provider_id = Procedure.provider_id, and set Patient.clinical_hold to true"
          - "increments Procedure.version by 1"
        note: "Hops 4 and 5 run inside the same recall request; RECALL_AFFECTED is therefore observable only transiently and every affected procedure ends the request at NOTIFIED."

  # ===========================================================================
  # PelletLot.sterility_status - cyclic (RELEASED <-> QUARANTINED) with a
  # terminal RECALLED absorbing state.
  # ===========================================================================
  - entity: PelletLot
    state_field: sterility_status
    initial_state: QUARANTINED
    terminal_states: [RECALLED]
    transitions:
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /clinic/pellet-lots/{id}/release"
        actor: InventoryManager
        preconditions:
          - "PelletLot.sterility_status == QUARANTINED"
        side_effects:
          - "the lot becomes a FEFO candidate"
          - "increments PelletLot.version by 1"

      - from: RELEASED
        to: QUARANTINED
        trigger: "system, side effect of POST /clinic/adverse-events when severity == SEVERE and lot_id is non-null"
        actor: system
        preconditions:
          - "PelletLot.sterility_status == RELEASED"
        side_effects:
          - "the lot stops being a FEFO candidate; existing RESERVED and OPENED allocations are left untouched"
          - "increments PelletLot.version by 1"
        note: "The cyclic leg. There is no manual quarantine endpoint: a lot only leaves RELEASED via a severe adverse event or a recall."

      - from: RELEASED
        to: RECALLED
        trigger: "POST /clinic/pellet-lots/{id}/recall"
        actor: "InventoryManager or ComplianceOfficer"
        preconditions:
          - "PelletLot.sterility_status == RELEASED"
        side_effects:
          - "hop 1: qty_returned increased by qty_on_hand, then qty_on_hand set to 0; recall_severity, recall_reason and recalled_at recorded"
          - "hop 2: every PelletAllocation of this lot in status RESERVED or OPENED moves to RECALL_RELEASED with qty_reserved decreased and qty_returned increased by its quantity; every PelletAllocation in status CONSUMED moves to RECALL_FLAGGED with no bucket movement; allocations already in RELEASED, WASTED or RECALL_RELEASED are untouched"
          - "hops 3 to 5 continue on Procedure.recall_status and Procedure.status as declared on those axes"
          - "increments PelletLot.version by 1"

      - from: QUARANTINED
        to: RECALLED
        trigger: "POST /clinic/pellet-lots/{id}/recall"
        actor: "InventoryManager or ComplianceOfficer"
        preconditions:
          - "PelletLot.sterility_status == QUARANTINED"
        side_effects:
          - "identical to the RELEASED to RECALLED leg"
          - "increments PelletLot.version by 1"

  # ===========================================================================
  # PelletAllocation.status - branching fan-out with divergent bucket effects.
  # ===========================================================================
  - entity: PelletAllocation
    state_field: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, WASTED, RELEASED, RECALL_RELEASED, RECALL_FLAGGED]
    transitions:
      - from: RESERVED
        to: OPENED
        trigger: "POST /clinic/procedures/{id}/open-supply"
        actor: "NurseInjector or Physician"
        preconditions:
          - "PelletAllocation.status == RESERVED"
          - "the owning Procedure.status == CONSENTED"
        side_effects:
          - "no lot bucket movement"
          - "increments PelletAllocation.version by 1"

      - from: OPENED
        to: CONSUMED
        trigger: "POST /clinic/procedures/{id}/perform"
        actor: "NurseInjector or Physician"
        preconditions:
          - "PelletAllocation.status == OPENED"
        side_effects:
          - "lot qty_reserved decreased and qty_consumed increased by quantity"
          - "increments PelletAllocation.version by 1"

      - from: OPENED
        to: WASTED
        trigger: "POST /clinic/procedures/{id}/perform with a non-zero pellets_wasted, or POST /clinic/procedures/{id}/cancel from SUPPLY_OPENED"
        actor: "NurseInjector, Physician or FrontDesk"
        preconditions:
          - "PelletAllocation.status == OPENED"
        side_effects:
          - "lot qty_reserved decreased and qty_wasted increased by quantity"
          - "increments PelletAllocation.version by 1"

      - from: RESERVED
        to: RELEASED
        trigger: "POST /clinic/procedures/{id}/cancel from SCHEDULED or CONSENTED, or hop 4 of the severe-adverse-event cascade"
        actor: "FrontDesk, Physician, Patient or system"
        preconditions:
          - "PelletAllocation.status == RESERVED"
        side_effects:
          - "lot qty_reserved decreased and qty_on_hand increased by quantity"
          - "increments PelletAllocation.version by 1"

      - from: OPENED
        to: RELEASED
        trigger: "system, hop 4 of the severe-adverse-event cascade or hop 3b of the lot-recall cascade acting on a SUPPLY_OPENED procedure"
        actor: system
        preconditions:
          - "PelletAllocation.status == OPENED"
        side_effects:
          - "lot qty_reserved decreased and qty_on_hand increased by quantity"
          - "increments PelletAllocation.version by 1"

      - from: RESERVED
        to: RECALL_RELEASED
        trigger: "POST /clinic/pellet-lots/{id}/recall, hop 2"
        actor: system
        preconditions:
          - "PelletAllocation.status == RESERVED"
          - "PelletAllocation.lot_id == the recalled lot"
        side_effects:
          - "lot qty_reserved decreased and qty_returned increased by quantity"
          - "increments PelletAllocation.version by 1"

      - from: OPENED
        to: RECALL_RELEASED
        trigger: "POST /clinic/pellet-lots/{id}/recall, hop 2"
        actor: system
        preconditions:
          - "PelletAllocation.status == OPENED"
          - "PelletAllocation.lot_id == the recalled lot"
        side_effects:
          - "lot qty_reserved decreased and qty_returned increased by quantity"
          - "increments PelletAllocation.version by 1"

      - from: CONSUMED
        to: RECALL_FLAGGED
        trigger: "POST /clinic/pellet-lots/{id}/recall, hop 2"
        actor: system
        preconditions:
          - "PelletAllocation.status == CONSUMED"
          - "PelletAllocation.lot_id == the recalled lot"
        side_effects:
          - "no lot bucket movement - the pellets are inside a patient"
          - "increments PelletAllocation.version by 1"

  # ===========================================================================
  # StandingOrder.status - cyclic ACTIVE <-> SUSPENDED with terminal REVOKED.
  # ===========================================================================
  - entity: StandingOrder
    state_field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, hop 2 of the severe-adverse-event cascade fired by POST /clinic/adverse-events with severity SEVERE"
        actor: system
        preconditions:
          - "StandingOrder.status == ACTIVE"
          - "AdverseEvent.standing_order_id == this order"
        side_effects:
          - "suspended_reason set to SEVERE_ADVERSE_EVENT"
          - "hop 3: every Procedure with this standing_order_id and status in {SCHEDULED, CONSENTED, SUPPLY_OPENED} moves to SUPPLY_HOLD with hold_reason STANDING_ORDER_SUSPENDED, including procedures belonging to other patients"
          - "increments StandingOrder.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clinic/standing-orders/{id}/reinstate"
        actor: Physician
        preconditions:
          - "StandingOrder.status == SUSPENDED"
          - "the acting physician's X-User-ID equals StandingOrder.physician_id"
          - "every AdverseEvent referencing this standing order has status CLOSED"
        side_effects:
          - "suspended_reason set to null"
          - "every Procedure with this standing_order_id, status SUPPLY_HOLD and hold_reason STANDING_ORDER_SUSPENDED moves back to SCHEDULED with hold_reason and consent_record_id cleared"
          - "increments StandingOrder.version by 1"
        note: "The cyclic leg."

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /clinic/standing-orders/{id}/revoke"
        actor: Physician
        preconditions:
          - "StandingOrder.status == ACTIVE"
          - "the acting physician's X-User-ID equals StandingOrder.physician_id"
        side_effects:
          - "the write gate at validation priority 9 now rejects every NurseInjector administration referencing this order"
          - "already-scheduled procedures are NOT held - revocation is forward-looking only, unlike suspension"
          - "increments StandingOrder.version by 1"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /clinic/standing-orders/{id}/revoke"
        actor: Physician
        preconditions:
          - "StandingOrder.status == SUSPENDED"
          - "the acting physician's X-User-ID equals StandingOrder.physician_id"
        side_effects:
          - "procedures already in SUPPLY_HOLD stay held and can no longer be released by reinstate; their only exit is cancel"
          - "increments StandingOrder.version by 1"

  # ===========================================================================
  # ConsentRecord.status - the one linear axis in the scaffold.
  # ===========================================================================
  - entity: ConsentRecord
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /clinic/consents creating a newer consent for the same patient_id and hormone_type; or hop 2 of the protocol-publication cascade; or the direct SEVERE-adverse-event side effect"
        actor: "system"
        preconditions:
          - "ConsentRecord.status == ACTIVE"
        side_effects:
          - "for the protocol-publication trigger, hop 3 continues onto every CONSENTED Procedure holding this consent"
          - "for the SEVERE-adverse-event trigger, every ACTIVE consent of the affected patient is superseded regardless of hormone_type"
          - "increments ConsentRecord.version by 1"

  # ===========================================================================
  # LabPanel.status - branching: a panel either flows RECORDED -> SUPERSEDED or
  # detours through CRITICAL_FLAGGED -> ACKNOWLEDGED, with different gates.
  # ===========================================================================
  - entity: LabPanel
    state_field: status
    initial_state: RECORDED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECORDED
        to: CRITICAL_FLAGGED
        trigger: "POST /clinic/lab-panels, applied within the creating request"
        actor: system
        preconditions:
          - "the recorded value exceeds the analyte's CRITICAL_HIGH constant"
        side_effects:
          - "critical_flag set to true"
          - "the patient's procedures cannot be performed until acknowledgement (validation priority 15)"
        note: "The branch condition reads the CRITICAL threshold only. A value merely above the lab reference interval, or merely above the clinic optimal band, stays RECORDED - this is the axis on which the two-ranges-on-one-number seam bites."

      - from: CRITICAL_FLAGGED
        to: ACKNOWLEDGED
        trigger: "POST /clinic/lab-panels/{id}/acknowledge-critical"
        actor: Physician
        preconditions:
          - "LabPanel.status == CRITICAL_FLAGGED"
        side_effects:
          - "acknowledged_by_provider_id set to the acting physician's X-User-ID"
          - "increments LabPanel.version by 1"

      - from: RECORDED
        to: SUPERSEDED
        trigger: "POST /clinic/lab-panels creating a newer panel for the same patient_id and analyte"
        actor: system
        preconditions:
          - "LabPanel.status == RECORDED"
          - "the new panel has the same patient_id and analyte"
        side_effects:
          - "increments LabPanel.version by 1"
        note: "CRITICAL_FLAGGED panels are deliberately NOT superseded by a newer panel - a critical value must be acknowledged by a physician, never silently displaced."

      - from: ACKNOWLEDGED
        to: SUPERSEDED
        trigger: "POST /clinic/lab-panels creating a newer panel for the same patient_id and analyte"
        actor: system
        preconditions:
          - "LabPanel.status == ACKNOWLEDGED"
          - "the new panel has the same patient_id and analyte"
        side_effects:
          - "increments LabPanel.version by 1"

  # ===========================================================================
  # AdverseEvent.status - branching fork with convergence, plus a second
  # segregation-of-duties gate on the ESCALATED -> CLOSED leg.
  # ===========================================================================
  - entity: AdverseEvent
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /clinic/adverse-events/{id}/review with disposition CLOSED"
        actor: Physician
        preconditions:
          - "AdverseEvent.status == OPEN"
          - "the acting physician's X-User-ID differs from AdverseEvent.reported_by_provider_id"
          - "the acting X-User-ID belongs to a Provider whose provider_type is PHYSICIAN"
        side_effects:
          - "reviewed_by_provider_id and disposition_note set"
          - "if this was the last non-CLOSED AdverseEvent holding the patient, Patient.clinical_hold is set to false and eligibility_status recomputed, and Patient.version increments by 1"
          - "increments AdverseEvent.version by 1"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /clinic/adverse-events/{id}/review with disposition ESCALATED"
        actor: Physician
        preconditions:
          - "AdverseEvent.status == OPEN"
          - "the acting physician's X-User-ID differs from AdverseEvent.reported_by_provider_id"
        side_effects:
          - "reviewed_by_provider_id and disposition_note set"
          - "Patient.clinical_hold stays true regardless of severity"
          - "increments AdverseEvent.version by 1"

      - from: ESCALATED
        to: CLOSED
        trigger: "POST /clinic/adverse-events/{id}/review with disposition CLOSED"
        actor: Physician
        preconditions:
          - "AdverseEvent.status == ESCALATED"
          - "the acting physician's X-User-ID differs from AdverseEvent.reported_by_provider_id"
          - "the acting physician's X-User-ID also differs from the AdverseEvent.reviewed_by_provider_id recorded by the escalating review"
        side_effects:
          - "reviewed_by_provider_id overwritten with the closing physician"
          - "if this was the last non-CLOSED AdverseEvent holding the patient, Patient.clinical_hold is set to false and eligibility_status recomputed, and Patient.version increments by 1"
          - "increments AdverseEvent.version by 1"
        note: "Three distinct people are required to close an escalated event: reporter, escalating reviewer, closing reviewer."

  # ===========================================================================
  # Membership.status - cyclic ACTIVE <-> PAUSED with terminal CANCELLED.
  # ===========================================================================
  - entity: Membership
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /clinic/memberships/{id}/pause"
        actor: "FrontDesk or Patient"
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "membership_pause_credit_cents runs steps 1 to 7 and increases pause_credit_cents"
          - "paused_at set to the logical clock"
          - "included_visits_used is frozen, not reset"
          - "increments Membership.version by 1"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /clinic/memberships/{id}/resume"
        actor: "FrontDesk or Patient"
        preconditions:
          - "Membership.status == PAUSED"
          - "pause_days_used + days_between(paused_at, now) <= MAX_PAUSE_DAYS_PER_YEAR, else ERR_PAUSE_LIMIT_EXCEEDED and NOTHING is mutated"
        side_effects:
          - "pause_days_used increased by days_between(paused_at, now)"
          - "period_end extended by the same number of days"
          - "pause_credit_cents reduced by min(pause_credit_cents, monthly_fee_cents)"
          - "paused_at set to null"
          - "increments Membership.version by 1"
        note: "The cyclic leg."

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /clinic/memberships/{id}/cancel"
        actor: "FrontDesk or Patient"
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "discount_pct is frozen at its current value but stops applying to new charges"
          - "increments Membership.version by 1"

      - from: PAUSED
        to: CANCELLED
        trigger: "POST /clinic/memberships/{id}/cancel"
        actor: "FrontDesk or Patient"
        preconditions:
          - "Membership.status == PAUSED"
        side_effects:
          - "pause_credit_cents is forfeited and reset to 0 - credit is only redeemable by resuming"
          - "increments Membership.version by 1"

  # ===========================================================================
  # SeriesPack.status - non-linear: EXHAUSTED reverts to ACTIVE on visit void,
  # and ACTIVE -> EXPIRED is a mutate-then-reject transition.
  # ===========================================================================
  - entity: SeriesPack
    state_field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REFUNDED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "POST /clinic/injection-visits/{id}/administer drawing the last entitlement"
        actor: "NurseInjector or Physician"
        preconditions:
          - "SeriesPack.status == ACTIVE"
          - "remaining_visits == 1 before the draw"
        side_effects:
          - "remaining_visits set to 0 and redeemed_visits incremented"
          - "increments SeriesPack.version by 1"

      - from: EXHAUSTED
        to: ACTIVE
        trigger: "POST /clinic/injection-visits/{id}/void"
        actor: Physician
        preconditions:
          - "SeriesPack.status == EXHAUSTED"
          - "the voided visit had payment_source SERIES and series_pack_id equal to this pack"
        side_effects:
          - "redeemed_visits decremented and remaining_visits incremented, restoring series_entitlement_conservation exactly"
          - "increments SeriesPack.version by 1"
        note: "The cyclic leg."

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /clinic/injection-visits/{id}/administer attempted after expires_at"
        actor: "NurseInjector or Physician"
        preconditions:
          - "SeriesPack.status == ACTIVE"
          - "now is strictly after SeriesPack.expires_at"
        side_effects:
          - "forfeited_visits increased by remaining_visits, then remaining_visits set to 0"
          - "increments SeriesPack.version by 1"
          - "the administer request is then REJECTED with ERR_SERIES_EXPIRED and the InjectionVisit stays SCHEDULED"
        note: "Mutate-then-reject: the bookkeeping write commits and the request still fails. A second identical attempt sees status EXPIRED and is rejected by validation priority 32 with the same error, but forfeits nothing further."

      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /clinic/series-packs/{id}/refund"
        actor: FrontDesk
        preconditions:
          - "SeriesPack.status == ACTIVE"
        side_effects:
          - "refunded_visits increased by remaining_visits, then remaining_visits set to 0"
          - "refunded_cents set by series_refund_cents"
          - "increments SeriesPack.version by 1"

  # ===========================================================================
  # InjectionVisit.status - branching with terminal fan-out.
  # ===========================================================================
  - entity: InjectionVisit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: ADMINISTERED
        trigger: "POST /clinic/injection-visits/{id}/administer"
        actor: "NurseInjector or Physician"
        preconditions:
          - "InjectionVisit.status == SCHEDULED"
          - "Patient.clinical_hold == false"
          - "when the actor role is NurseInjector, the standing-order write gate at validation priority 9 must pass"
          - "when series_pack_id is non-null: the pack belongs to the same patient, is not past expires_at, and has remaining_visits >= 1"
        side_effects:
          - "payment_source resolved by the fixed precedence in injection_payment_source"
          - "for SERIES: series_debit_cents set by series_redemption_debit_cents, pack remaining_visits decremented and redeemed_visits incremented, charge_cents set to 0"
          - "for MEMBERSHIP_INCLUDED: Membership.included_visits_used incremented, charge_cents set to 0, Membership.version incremented by 1"
          - "for SELF_PAY: charge_cents set by injection_charge_cents"
          - "administered_at set to the logical clock"
          - "increments InjectionVisit.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinic/injection-visits/{id}/cancel"
        actor: "FrontDesk or Patient"
        preconditions:
          - "InjectionVisit.status == SCHEDULED"
        side_effects:
          - "no entitlement is drawn or returned - nothing was consumed at scheduling time"
          - "increments InjectionVisit.version by 1"

      - from: ADMINISTERED
        to: VOIDED
        trigger: "POST /clinic/injection-visits/{id}/void"
        actor: Physician
        preconditions:
          - "InjectionVisit.status == ADMINISTERED"
        side_effects:
          - "for payment_source SERIES: the pack's redeemed_visits decrements and remaining_visits increments, and the pack returns from EXHAUSTED to ACTIVE when it was exhausted by this very visit"
          - "for payment_source MEMBERSHIP_INCLUDED: Membership.included_visits_used decrements and Membership.version increments by 1"
          - "for payment_source SELF_PAY: charge_cents reset to 0"
          - "increments InjectionVisit.version by 1"

  # ===========================================================================
  # FinancingPlan.status - cyclic ACTIVE <-> DELINQUENT with terminal fan-out.
  # ===========================================================================
  - entity: FinancingPlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [DEFAULTED, PAID_OFF, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clinic/financing-plans/{id}/activate"
        actor: FrontDesk
        preconditions:
          - "FinancingPlan.status == DRAFT"
          - "the referenced Procedure.status is not in {CANCELLED, VOIDED}"
        side_effects:
          - "the schedule computed at creation becomes payable"
          - "increments FinancingPlan.version by 1"

      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /clinic/billing/delinquency-run"
        actor: "FrontDesk or ClinicAdmin"
        preconditions:
          - "FinancingPlan.status == ACTIVE"
          - "after the sweep, missed_count is between 1 and FINANCING_DEFAULT_MISSED_THRESHOLD minus 1 inclusive"
        side_effects:
          - "hop 1: each PENDING schedule entry whose due_date + FINANCING_GRACE_PERIOD_DAYS is strictly before now flips to MISSED and adds FINANCING_LATE_FEE_CENTS to late_fee_cents"
          - "missed_count recomputed"
          - "increments FinancingPlan.version by 1"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /clinic/financing-plans/{id}/payments clearing every MISSED entry"
        actor: "FrontDesk or Patient"
        preconditions:
          - "FinancingPlan.status == DELINQUENT"
          - "after the payment, no schedule entry is in status MISSED"
        side_effects:
          - "increments FinancingPlan.version by 1"
        note: "The cyclic leg."

      - from: DELINQUENT
        to: DEFAULTED
        trigger: "POST /clinic/billing/delinquency-run"
        actor: "FrontDesk or ClinicAdmin"
        preconditions:
          - "FinancingPlan.status == DELINQUENT"
          - "after the sweep, missed_count >= FINANCING_DEFAULT_MISSED_THRESHOLD"
        side_effects:
          - "hop 3: Patient.financial_hold set to true and Patient.eligibility_status recomputed; Patient.version increments by 1"
          - "hop 4: every Procedure of that patient with status SCHEDULED moves to SUPPLY_HOLD with hold_reason PATIENT_FINANCIAL_HOLD, releasing its RESERVED allocations"
          - "increments FinancingPlan.version by 1"

      - from: ACTIVE
        to: PAID_OFF
        trigger: "POST /clinic/financing-plans/{id}/payments settling the final PENDING entry"
        actor: "FrontDesk or Patient"
        preconditions:
          - "FinancingPlan.status == ACTIVE"
          - "after the payment, outstanding_cents == 0"
        side_effects:
          - "increments FinancingPlan.version by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "system, side effect of POST /clinic/procedures/{id}/cancel"
        actor: system
        preconditions:
          - "FinancingPlan.status == ACTIVE"
          - "FinancingPlan.procedure_id == the cancelled procedure"
        side_effects:
          - "every PENDING or MISSED schedule entry flips to WAIVED and waived_cents is recomputed, preserving financing_money_conservation leg B"
          - "refunded_cents set by refund_settlement_cents variant FINAL_SETTLEMENT"
          - "increments FinancingPlan.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "system, side effect of POST /clinic/procedures/{id}/cancel"
        actor: system
        preconditions:
          - "FinancingPlan.status == DRAFT"
        side_effects:
          - "every PENDING schedule entry flips to WAIVED; refunded_cents equals down_payment_cents minus the cancellation fee"
          - "increments FinancingPlan.version by 1"

      - from: DELINQUENT
        to: CANCELLED
        trigger: "system, side effect of POST /clinic/procedures/{id}/cancel"
        actor: system
        preconditions:
          - "FinancingPlan.status == DELINQUENT"
        side_effects:
          - "identical to the ACTIVE to CANCELLED leg; accrued late_fee_cents is retained and is NOT refunded"
          - "increments FinancingPlan.version by 1"

  # ===========================================================================
  # PatientNotification.status - branching with convergence.
  # ===========================================================================
  - entity: PatientNotification
    state_field: status
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /clinic/patient-notifications/{id}/acknowledge"
        actor: "Patient or FrontDesk"
        preconditions:
          - "PatientNotification.status == PENDING"
        side_effects:
          - "acknowledged_at set to the logical clock"
          - "Patient.open_notification_count decremented by 1 and Patient.version incremented by 1"
          - "increments PatientNotification.version by 1"

      - from: PENDING
        to: OVERDUE
        trigger: "POST /clinic/billing/delinquency-run"
        actor: "FrontDesk or ClinicAdmin"
        preconditions:
          - "PatientNotification.status == PENDING"
          - "PatientNotification.due_at is strictly before now"
        side_effects:
          - "increments PatientNotification.version by 1"
        note: "The ops run is a single system epoch advance: it sweeps financing schedules AND notification deadlines in one call, financing first, notifications second."

      - from: OVERDUE
        to: ACKNOWLEDGED
        trigger: "POST /clinic/patient-notifications/{id}/acknowledge"
        actor: "Patient or FrontDesk"
        preconditions:
          - "PatientNotification.status == OVERDUE"
        side_effects:
          - "acknowledged_at set to the logical clock"
          - "Patient.open_notification_count decremented by 1 and Patient.version incremented by 1"
          - "increments PatientNotification.version by 1"

  # ===========================================================================
  # Patient.eligibility_status - compound axis derived from two independent
  # boolean holds. Never set directly; always re-derived.
  # ===========================================================================
  - entity: Patient
    state_field: eligibility_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: CLINICAL_HOLD
        trigger: "system, whenever Patient.clinical_hold flips to true"
        actor: system
        preconditions:
          - "Patient.clinical_hold == true and Patient.financial_hold == false"
        side_effects:
          - "procedure perform and injection administration are blocked at validation priority 14"
          - "increments Patient.version by 1"

      - from: CLEAR
        to: FINANCIAL_HOLD
        trigger: "system, hop 3 of the delinquency cascade"
        actor: system
        preconditions:
          - "Patient.clinical_hold == false and Patient.financial_hold == true"
        side_effects:
          - "procedure scheduling and perform are blocked at validation priority 39 with a 402"
          - "injection administration is NOT blocked - a financial hold never withholds care already paid for by a series or membership"
          - "increments Patient.version by 1"

      - from: CLINICAL_HOLD
        to: DUAL_HOLD
        trigger: "system, hop 3 of the delinquency cascade on an already clinically held patient"
        actor: system
        preconditions:
          - "Patient.clinical_hold == true and Patient.financial_hold == true"
        side_effects:
          - "the clinical hold wins the priority ladder: ERR_PATIENT_CLINICAL_HOLD (priority 14) pre-empts ERR_PATIENT_FINANCIAL_HOLD (priority 39)"
          - "increments Patient.version by 1"

      - from: FINANCIAL_HOLD
        to: DUAL_HOLD
        trigger: "system, severity routing of a SEVERE AdverseEvent on an already financially held patient"
        actor: system
        preconditions:
          - "Patient.clinical_hold == true and Patient.financial_hold == true"
        side_effects:
          - "same precedence as the other DUAL_HOLD entry leg"
          - "increments Patient.version by 1"

      - from: DUAL_HOLD
        to: FINANCIAL_HOLD
        trigger: "system, closing the last non-CLOSED AdverseEvent for the patient"
        actor: system
        preconditions:
          - "Patient.clinical_hold == false and Patient.financial_hold == true"
        side_effects:
          - "increments Patient.version by 1"

      - from: CLINICAL_HOLD
        to: CLEAR
        trigger: "system, closing the last non-CLOSED AdverseEvent for the patient, or POST /clinic/patients/{id}/eligibility-hold with hold_kind CLINICAL and hold_action CLEAR"
        actor: "system or Physician"
        preconditions:
          - "Patient.clinical_hold == false and Patient.financial_hold == false"
        side_effects:
          - "increments Patient.version by 1"

      - from: FINANCIAL_HOLD
        to: CLEAR
        trigger: "POST /clinic/patients/{id}/eligibility-hold with hold_kind FINANCIAL and hold_action CLEAR"
        actor: ClinicAdmin
        preconditions:
          - "Patient.clinical_hold == false and Patient.financial_hold == false"
        side_effects:
          - "every Procedure of that patient with status SUPPLY_HOLD and hold_reason PATIENT_FINANCIAL_HOLD returns to SCHEDULED"
          - "increments Patient.version by 1"

      - from: DUAL_HOLD
        to: CLINICAL_HOLD
        trigger: "POST /clinic/patients/{id}/eligibility-hold with hold_kind FINANCIAL and hold_action CLEAR"
        actor: ClinicAdmin
        preconditions:
          - "Patient.clinical_hold == true and Patient.financial_hold == false"
        side_effects:
          - "increments Patient.version by 1"

concurrency_rules:
  - rule_id: perform-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /clinic/procedures/{id}/perform"
    occ_field: "expected_patient_version"
    description: |
      Performing an insertion against a Patient whose version has advanced since
      the client last observed it is rejected. Performing is the moment the
      clinic commits milligrams to a body, and every gate it depends on lives on
      the Patient row: clinical_hold, financial_hold, cumulative_mg_<hormone>,
      last_insertion_at. Any of those may have moved under a legitimate write
      the client has not yet seen - a severe adverse event on a sibling
      procedure, a delinquency default, or an earlier insertion that already
      consumed the rolling milligram allowance - so a stale view must not be
      allowed to commit.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: allocation-create-stale-procedure
    parent_entity: Procedure
    write_endpoint: "POST /clinic/procedures/{id}/allocations"
    occ_field: "expected_procedure_version"
    description: |
      Requesting a FEFO allocation plan against a Procedure whose version has
      advanced since the client last observed it is rejected. A new allocation
      request legitimately supersedes any allocation set the procedure already
      holds - the prior RESERVED rows are released and a fresh FEFO plan is
      minted - so the operation cannot be rejected on state grounds alone and a
      stale-version check is the only thing standing between the caller and
      silently discarding an allocation set produced from a newer plan.
    error_id: ERR_STALE_PROCEDURE_VERSION
    http_status: 412

  - rule_id: tier-change-stale-membership
    parent_entity: Membership
    write_endpoint: "POST /clinic/memberships/{id}/tier-change"
    occ_field: "expected_membership_version"
    description: |
      Changing a Membership tier against a version the client no longer holds is
      rejected. A tier change legitimately supersedes the prior tier, restarts
      the period and resets included_visits_used, so it would otherwise succeed
      from any ACTIVE state; the stale-version check is what prevents a change
      computed against a pre-pause fee basis from overwriting a period that a
      pause or an included-visit redemption has since moved.
    error_id: ERR_STALE_MEMBERSHIP_VERSION
    http_status: 412

calculations:
  - name: pellet_count_from_dose
    trigger: "POST /clinic/consults, and re-read verbatim when POST /clinic/procedures copies the plan onto the Procedure"
    algorithm: constraint_propagation
    formula: |
      ladder      = PELLET_LADDER_TESTOSTERONE_MG when hormone_type == TESTOSTERONE
                    else PELLET_LADDER_ESTRADIOL_MG
      large_mg    = ladder[0]        # 200 for TESTOSTERONE, 25 for ESTRADIOL
      small_mg    = ladder[1]        # 100 for TESTOSTERONE, 10 for ESTRADIOL
      large_count = floor(prescribed_dose_mg / large_mg)
      remainder   = prescribed_dose_mg - large_count * large_mg
      small_count = 0 when remainder == 0 else ceil(remainder / small_mg)
      planned_pellet_count = large_count + small_count
      planned_total_mg     = large_count * large_mg + small_count * small_mg
    input_set: "The single Consult being created. No cross-entity input."
    constants:
      PELLET_LADDER_TESTOSTERONE_MG: [200, 100]
      PELLET_LADDER_ESTRADIOL_MG: [25, 10]
    precision: "Counts are integers. planned_total_mg is exact integer milligrams because every ladder rung is an integer."
    note: |
      The rounding rule is greedy-largest-first with a ceiling on the remainder, so
      planned_total_mg is always >= prescribed_dose_mg and never under-delivers.
      The calculation itself never clamps to a cap - the per-procedure cap is a
      separate validation rung (priority 19) that rejects the Procedure outright.
      Worked: TESTOSTERONE 1150 mg -> large_count 5 (1000), remainder 150,
      small_count ceil(150/100) = 2 -> 7 pellets, planned_total_mg 1200.
      ESTRADIOL 80 mg -> large_count 3 (75), remainder 5, small_count
      ceil(5/10) = 1 -> 4 pellets, planned_total_mg 85.
      ESTRADIOL 100 mg -> large_count 4 (100), remainder 0, small_count 0 ->
      4 pellets, planned_total_mg 100.

  - name: procedure_delivered_mg
    trigger: "PLANNED at POST /clinic/procedures; ACTUAL at POST /clinic/procedures/{id}/perform"
    algorithm: aggregation
    formula: |
      PLANNED = Consult.planned_total_mg, copied onto Procedure.planned_total_mg
      ACTUAL  = sum over PelletAllocation rows of this procedure whose status is
                exactly CONSUMED of (quantity * strength_mg)
    input_set: |
      PLANNED reads only the Consult. ACTUAL reads only allocations in status
      CONSUMED - allocations in OPENED, WASTED, RELEASED, RECALL_RELEASED or
      RECALL_FLAGGED contribute nothing.
    constants: {}
    precision: "Exact integer milligrams."
    variants:
      - name: PLANNED
        when: "Scheduling time, and every forward-looking cap check."
        difference: "Assumes every allocated pellet is implanted; equals the consult plan."
      - name: ACTUAL
        when: "Perform time, and every retrospective exposure sum."
        difference: "Subtracts breakage. Any non-zero pellets_wasted makes ACTUAL strictly less than PLANNED."

  - name: rolling_mg_exposure
    trigger: "Validation priority 20 - at POST /clinic/procedures with the INCLUDING_SCHEDULED variant, and at POST /clinic/procedures/{id}/perform with the COMPLETED_ONLY variant"
    algorithm: forward_looking
    formula: |
      COMPLETED_ONLY(patient, hormone) =
        sum of Procedure.delivered_total_mg over Procedures where
          patient_id == patient
          AND hormone_type == hormone
          AND status == COMPLETED
          AND performed_at is within [now - ROLLING_MG_WINDOW_DAYS days, now] inclusive

      INCLUDING_SCHEDULED(patient, hormone) =
        COMPLETED_ONLY(patient, hormone)
        + sum of Procedure.planned_total_mg over Procedures where
            patient_id == patient
            AND hormone_type == hormone
            AND status in {SCHEDULED, CONSENTED, SUPPLY_OPENED}
            AND scheduled_start is within (now, now + ROLLING_MG_WINDOW_DAYS days] inclusive of the upper bound
    input_set: |
      VOIDED, CANCELLED and SUPPLY_HOLD procedures are excluded from both variants.
      A COMPLETED procedure performed 366 days ago is excluded; one performed
      exactly 365 days ago is included.
    constants:
      ROLLING_MG_WINDOW_DAYS: 365
      ROLLING_MG_CAP_TESTOSTERONE: 4800
      ROLLING_MG_CAP_ESTRADIOL: 400
    precision: "Exact integer milligrams; no rounding."
    variants:
      - name: COMPLETED_ONLY
        when: "The perform-time cap check. The procedure being performed is not yet COMPLETED, so it is not in its own sum; the about-to-commit delivered milligrams are added separately."
        difference: "Counts only milligrams actually in bodies."
      - name: INCLUDING_SCHEDULED
        when: "The scheduling-time cap check on POST /clinic/procedures."
        difference: "Also counts milligrams merely committed by future bookings, so it can reject a booking that COMPLETED_ONLY would allow, and the two variants return different numbers for the identical patient at the identical instant."

  - name: fefo_allocation_plan
    trigger: "POST /clinic/procedures/{id}/allocations"
    algorithm: waterfall_allocation
    formula: |
      Requirement is decomposed into at most two strength legs, LARGE first then SMALL:
        leg 1: need = Consult.planned_large_count pellets of strength large_mg
        leg 2: need = Consult.planned_small_count pellets of strength small_mg
      For each leg with need > 0, in that fixed order:
        candidate_set = PelletLot rows where
              hormone_type    == Procedure.hormone_type
          AND strength_mg     == the leg strength
          AND sterility_status == RELEASED
          AND expiry_date     >  Procedure.scheduled_start      (STRICT: a lot expiring
                                                                 exactly at the slot start
                                                                 is NOT a candidate)
          AND qty_on_hand     >  0
        ranking      = expiry_date ASC
        tie_break    = created_at ASC        (never id, never lot_code)
        walk the ranked list taking take = min(need_remaining, lot.qty_on_hand)
      If either leg finishes with need_remaining > 0, or a leg's candidate_set is
      empty, the WHOLE request fails with ERR_INSUFFICIENT_PELLET_INVENTORY and no
      lot and no allocation row is mutated.
      On success one PelletAllocation row is written per (leg, lot) draw, with
      allocation_rank assigned 1, 2, 3 ... over the concatenated walk order
      (leg 1 draws first, then leg 2).
    input_set: |
      QUARANTINED and RECALLED lots are never candidates. Lots of the right hormone
      but the wrong strength are never candidates - the plan is strength-exact and
      does not substitute two small pellets for one large.
    constants: {}
    precision: "Whole pellets only."
    note: |
      Supersede semantics: if the Procedure already holds PelletAllocation rows in
      status RESERVED or OPENED, they are first moved to RELEASED with their
      quantities credited back to qty_on_hand, and only then is the new plan
      computed. This is what makes the OCC rule allocation-create-stale-procedure a
      true race rather than a state precondition.

  - name: lab_band_classification
    trigger: "POST /clinic/lab-panels, both variants computed and both persisted on the same row"
    algorithm: threshold
    formula: |
      per analyte A, with (ref_low, ref_high, opt_low, opt_high, critical_high) =
        TOTAL_TESTOSTERONE -> (264, 916, 600, 900, 1500)     unit ng/dL
        ESTRADIOL          -> (30, 400, 80, 200, 500)        unit pg/mL
        HEMATOCRIT         -> (38.0, 50.0, 40.0, 46.0, 54.0) unit percent

      lab_reference_band  = BELOW_REF     when value <  ref_low
                          = ABOVE_REF     when value >  ref_high
                          = IN_REF        otherwise
      clinic_optimal_band = BELOW_OPTIMAL when value <  opt_low
                          = ABOVE_OPTIMAL when value >  opt_high
                          = IN_OPTIMAL    otherwise
      critical_flag       = value > critical_high            (STRICT)
    input_set: "One LabPanel row; no cross-entity input."
    constants:
      LAB_REF_LOW_TOTAL_TESTOSTERONE: 264
      LAB_REF_HIGH_TOTAL_TESTOSTERONE: 916
      OPTIMAL_LOW_TOTAL_TESTOSTERONE: 600
      OPTIMAL_HIGH_TOTAL_TESTOSTERONE: 900
      CRITICAL_HIGH_TOTAL_TESTOSTERONE: 1500
      LAB_REF_LOW_ESTRADIOL: 30
      LAB_REF_HIGH_ESTRADIOL: 400
      OPTIMAL_LOW_ESTRADIOL: 80
      OPTIMAL_HIGH_ESTRADIOL: 200
      CRITICAL_HIGH_ESTRADIOL: 500
      LAB_REF_LOW_HEMATOCRIT: 38.0
      LAB_REF_HIGH_HEMATOCRIT: 50.0
      OPTIMAL_LOW_HEMATOCRIT: 40.0
      OPTIMAL_HIGH_HEMATOCRIT: 46.0
      HEMATOCRIT_SAFETY_CEILING: 52.0
      CRITICAL_HIGH_HEMATOCRIT: 54.0
    precision: "Comparisons on the raw numeric value; no rounding."
    variants:
      - name: LAB_REFERENCE
        when: "Drives nothing on its own; it is the number reported back to the patient and the input to the critical-value branch of the LabPanel state machine."
        difference: "Uses the wide laboratory interval. TOTAL_TESTOSTERONE 400 classifies IN_REF."
      - name: CLINIC_OPTIMAL
        when: "Drives re-dose eligibility at validation priority 24."
        difference: "Uses the narrow therapeutic band. The identical TOTAL_TESTOSTERONE 400 classifies BELOW_OPTIMAL, so the one measurement is both lab-normal and re-dose-qualifying. Conversely 1000 is ABOVE_REF and ABOVE_OPTIMAL yet not critical, so it blocks a re-dose without triggering any diversion."

  - name: redose_eligibility
    trigger: "POST /clinic/procedures when procedure_type == REDOSE, and GET /clinic/patients/{id}/therapy-status"
    algorithm: weighted_scoring
    formula: |
      let h            = the Consult's hormone_type
      let anchor       = performed_at of the most recent COMPLETED Procedure for this
                         patient whose hormone_type == h (NOT Patient.last_insertion_at,
                         which ignores hormone_type); when there is none, the patient is
                         not eligible for a REDOSE at all and ERR_REDOSE_INTERVAL_NOT_MET
                         is returned
      let panel        = the LabPanel referenced by lab_panel_id
      let primary      = TOTAL_TESTOSTERONE when h == TESTOSTERONE else ESTRADIOL

      f1 interval  = days_between(anchor, scheduled_start) >= MIN_REDOSE_INTERVAL_DAYS_<h>
                     ("at least"; equality passes)
      f2 trough    = TROUGH_WINDOW_OPEN_DAYS_<h>
                       <= days_between(anchor, panel.drawn_at)
                       <= TROUGH_WINDOW_CLOSE_DAYS_<h>
                     ("within"; BOTH bounds inclusive) AND panel.is_trough_draw == true
      f3 freshness = days_between(panel.drawn_at, now) <= LAB_MAX_AGE_DAYS
                     (a panel exactly LAB_MAX_AGE_DAYS old still supports the decision;
                      one day older does not)
      f4 symptom   = Consult.symptom_score >= REDOSE_MIN_SYMPTOM_SCORE
      f5 band      = panel.analyte == primary AND panel.clinic_optimal_band == BELOW_OPTIMAL

      eligible = f1 AND f2 AND f3 AND f4 AND f5
    input_set: "One Consult, one LabPanel, and the patient's COMPLETED procedures of the same hormone_type."
    constants:
      MIN_REDOSE_INTERVAL_DAYS_TESTOSTERONE: 84
      MIN_REDOSE_INTERVAL_DAYS_ESTRADIOL: 70
      TROUGH_WINDOW_OPEN_DAYS_TESTOSTERONE: 70
      TROUGH_WINDOW_CLOSE_DAYS_TESTOSTERONE: 98
      TROUGH_WINDOW_OPEN_DAYS_ESTRADIOL: 56
      TROUGH_WINDOW_CLOSE_DAYS_ESTRADIOL: 84
      REDOSE_MIN_SYMPTOM_SCORE: 40
      LAB_MAX_AGE_DAYS: 45
    precision: "All day comparisons use days_between as defined in timekeeping."
    note: |
      The five factors are enforced as five separate validation rungs (21 to 25) in a
      fixed order, so a request failing several of them returns exactly the
      highest-priority one. f3 is checked before f2 even though both read the same
      panel: a stale panel is a data-quality problem, a mistimed panel is a clinical
      one, and the clinic reports the data-quality problem first.

  - name: procedure_pellet_charge_cents
    trigger: "POST /clinic/procedures/{id}/perform, and as step 1 of visit_invoice_total_cents"
    algorithm: tiered_pricing
    formula: |
      price_per_mg = PELLET_PRICE_CENTS_PER_MG_TESTOSTERONE (21.5) when hormone_type
                     == TESTOSTERONE else PELLET_PRICE_CENTS_PER_MG_ESTRADIOL (176.25)

      Group the CONSUMED PelletAllocation rows of this procedure by strength_mg. One
      line per distinct strength, ordered large strength first, then small strength.

      line_cents(strength, count) = round_half_up(count * strength * price_per_mg)
      pellet_subtotal_cents       = sum over lines of line_cents
      procedure_subtotal_cents    = INSERTION_BASE_FEE_CENTS + pellet_subtotal_cents
    input_set: "Only allocations in status CONSUMED. WASTED pellets are billed separately by refund_settlement_cents and never enter this subtotal."
    constants:
      INSERTION_BASE_FEE_CENTS: 25000
      PELLET_PRICE_CENTS_PER_MG_TESTOSTERONE: 21.5
      PELLET_PRICE_CENTS_PER_MG_ESTRADIOL: 176.25
    precision: "round_half_up to whole cents, applied PER LINE."
    note: |
      Rounding order is pinned and load-bearing: round each strength line to whole
      cents FIRST, then sum the lines. Summing the raw products and rounding once at
      the end is explicitly WRONG. Worked divergence: an ESTRADIOL plan of 3 x 25 mg
      plus 1 x 10 mg gives line 1 = round(13218.75) = 13219 and line 2 =
      round(1762.5) = 1763, summing to 14982; the forbidden order gives
      round(13218.75 + 1762.5) = round(14981.25) = 14981.

  - name: visit_invoice_total_cents
    trigger: "POST /clinic/procedures/{id}/perform, writing Procedure.charge_cents"
    algorithm: constraint_propagation
    formula: |
      Evaluate in exactly this order; the facility-fee test deliberately reads the
      POST-discount number produced in step 4, not the pre-discount subtotal of step 1.

      1. subtotal_cents            = procedure_pellet_charge_cents(this procedure)
      2. discount_pct              = Membership.discount_pct when Procedure.membership_id
                                     is non-null AND that Membership.status == ACTIVE at
                                     perform time; otherwise 0
      3. membership_discount_cents = round_half_up(subtotal_cents * discount_pct)
      4. discounted_subtotal_cents = subtotal_cents - membership_discount_cents
      5. facility_fee_cents        = 0 when discounted_subtotal_cents
                                          >= FACILITY_FEE_WAIVER_THRESHOLD_CENTS
                                     else FACILITY_FEE_BASE_CENTS
      6. charge_cents              = discounted_subtotal_cents + facility_fee_cents
    input_set: "One Procedure, its CONSUMED allocations, and at most one Membership."
    constants:
      FACILITY_FEE_BASE_CENTS: 7500
      FACILITY_FEE_WAIVER_THRESHOLD_CENTS: 42625
    precision: "round_half_up to whole cents at step 3 only; steps 4 to 6 are exact integer arithmetic."
    note: |
      The circular-looking dependency: the fee depends on the discounted subtotal,
      which depends on the discount, which is keyed on the subtotal. The order above
      resolves it. A consequence the implementation must reproduce rather than
      smooth over: a discount can cost a patient the waiver and leave them paying
      MORE in total. Worked - an ESTRADIOL 100 mg procedure has subtotal 42625; with
      no membership the total is 42625 (waiver granted at exactly the threshold),
      while a PLUS member pays round(4262.5) = 4263 less at step 3, drops to 38362,
      loses the waiver, and totals 45862.

  - name: late_cancel_fee_cents
    trigger: "POST /clinic/procedures/{id}/cancel, and GET /clinic/procedures/{id}/refund-quote"
    algorithm: threshold
    formula: |
      lead_hours = hours_between(now, Procedure.scheduled_start)

      base_fee_cents and cancel_tier:
        lead_hours >= LATE_CANCEL_TIER1_LEAD_HOURS (48)  -> tier NONE,     base 0
        lead_hours >= LATE_CANCEL_TIER2_LEAD_HOURS (24)  -> tier TIER1,    base 5000
        lead_hours >  0                                  -> tier TIER2,    base 12500
        lead_hours <= 0                                  -> tier NO_SHOW,  base 20000

      discount_pct   = the ACTIVE Membership's discount_pct when Procedure.membership_id
                       is non-null and that Membership.status == ACTIVE, else 0
      cancel_fee_cents = round_half_up(base_fee_cents * (1 - discount_pct))
    input_set: "One Procedure and at most one Membership. Never reads the financing plan."
    constants:
      LATE_CANCEL_TIER1_LEAD_HOURS: 48
      LATE_CANCEL_TIER2_LEAD_HOURS: 24
      LATE_CANCEL_TIER1_FEE_CENTS: 5000
      LATE_CANCEL_TIER2_FEE_CENTS: 12500
      NO_SHOW_FEE_CENTS: 20000
    precision: "round_half_up to whole cents, once, after the discount multiply."
    variants:
      - name: CANCEL_TIER
        when: "Every cancel initiated by the patient, front desk or physician from SCHEDULED, CONSENTED or SUPPLY_OPENED."
        difference: "Runs the lead-time ladder above."
      - name: CLINIC_INITIATED
        when: "Cancel from SUPPLY_HOLD - the clinic put the procedure on hold, so the patient is not charged."
        difference: "Forces cancel_tier NONE and cancel_fee_cents 0 regardless of lead_hours; the identical procedure cancelled two hours before its slot yields 12500 under CANCEL_TIER and 0 under CLINIC_INITIATED."

  - name: financing_schedule_cents
    trigger: "POST /clinic/financing-plans"
    algorithm: waterfall_allocation
    formula: |
      financed_cents  = principal_cents - down_payment_cents
      base_cents      = floor(financed_cents / installment_count)
      residual_cents  = financed_cents - base_cents * installment_count

      for i in 1 .. installment_count - 1:
        schedule[i].amount_cents = base_cents
      schedule[installment_count].amount_cents = base_cents + residual_cents

      schedule[i].due_date = first_due_date
                             + (i - 1) * FINANCING_INSTALLMENT_INTERVAL_DAYS days
      schedule[i].status   = PENDING
    input_set: "One FinancingPlan's own input fields."
    constants:
      FINANCING_MIN_DOWN_PAYMENT_PCT: 0.20
      FINANCING_MIN_INSTALLMENTS: 2
      FINANCING_MAX_INSTALLMENTS: 12
      FINANCING_INSTALLMENT_INTERVAL_DAYS: 30
    precision: "Integer cents throughout; floor division, never rounding."
    note: |
      The residual is absorbed entirely by the FINAL installment - not the first, not
      spread one cent at a time across the earliest installments. Worked: principal
      58300 with down payment 11660 over 6 installments gives financed 46640,
      base 7773, residual 2, so installments 1 to 5 are 7773 each and installment 6
      is 7775, and financing_money_conservation leg A holds:
      11660 + 5*7773 + 7775 == 58300.

  - name: membership_pause_credit_cents
    trigger: "POST /clinic/memberships/{id}/pause"
    algorithm: decay_function
    formula: |
      Execute in exactly this numbered order:
      1. elapsed_days       = days_between(Membership.period_start, now)
      2. period_length_days = days_between(Membership.period_start, Membership.period_end)
      3. unused_days        = max(0, period_length_days - elapsed_days)
      4. daily_rate         = monthly_fee_cents / period_length_days
                              (exact rational; explicitly NOT rounded here)
      5. credit_cents       = round_half_up(daily_rate * unused_days)
                              (the ONLY rounding step)
      6. credit_cents       = min(credit_cents, monthly_fee_cents)
      7. Membership.pause_credit_cents += credit_cents
      included_visits_used is frozen at its current value; it is neither reset nor
      forfeited by the pause.
    input_set: "One Membership row and the logical clock."
    constants:
      MEMBERSHIP_PERIOD_DAYS: 30
      MEMBERSHIP_FEE_CENTS_BASIC: 4900
      MEMBERSHIP_FEE_CENTS_PLUS: 9900
      MEMBERSHIP_FEE_CENTS_ELITE: 19900
      MAX_PAUSE_DAYS_PER_YEAR: 90
    precision: "One round_half_up, at step 5 only."
    note: |
      Rounding order is pinned: multiply the unrounded daily rate by unused_days and
      round ONCE. Rounding the daily rate first and then multiplying is WRONG.
      Worked: an ELITE membership (19900 over 30 days) paused on elapsed day 7 has
      unused_days 23 and daily_rate 663.3333...; the correct credit is
      round(15256.6666...) = 15257, whereas round-then-multiply gives 663 * 23 = 15249.

  - name: series_pack_price_cents
    trigger: "POST /clinic/series-packs"
    algorithm: tiered_pricing
    formula: |
      list_price_cents      = INJECTION_LIST_PRICE_CENTS_<series_type>
      price_cents           = round_half_up(SERIES_PACK_VISITS * list_price_cents
                                            * (1 - SERIES_PACK_DISCOUNT_PCT))
                              + SERIES_ENROLLMENT_FEE_CENTS
      per_visit_value_cents = floor(price_cents / SERIES_PACK_VISITS)
      purchased_visits      = SERIES_PACK_VISITS
      remaining_visits      = SERIES_PACK_VISITS
      expires_at            = purchased_at + SERIES_VALIDITY_DAYS days
    input_set: "One SeriesPack's series_type."
    constants:
      SERIES_PACK_VISITS: 8
      SERIES_PACK_DISCOUNT_PCT: 0.15
      SERIES_ENROLLMENT_FEE_CENTS: 2500
      SERIES_VALIDITY_DAYS: 365
      INJECTION_LIST_PRICE_CENTS_B12: 3500
      INJECTION_LIST_PRICE_CENTS_LIPOTROPIC: 4500
      INJECTION_LIST_PRICE_CENTS_VITAMIN_D: 5500
      INJECTION_LIST_PRICE_CENTS_GLUTATHIONE: 8500
    precision: "round_half_up once on the discounted pack body, then the enrollment fee is added as an exact integer; per_visit_value_cents is a floor."
    note: |
      Worked table: B12 price 26300 and per_visit 3287; LIPOTROPIC 33100 and 4137;
      VITAMIN_D 39900 and 4987; GLUTATHIONE 60300 and 7537. Every one leaves a
      4-cent residual that rides on the final redemption.

  - name: series_redemption_debit_cents
    trigger: "POST /clinic/injection-visits/{id}/administer when payment_source resolves to SERIES"
    algorithm: waterfall_allocation
    formula: |
      STANDARD:        series_debit_cents = per_visit_value_cents
      FINAL_RESIDUAL:  series_debit_cents = price_cents
                                            - per_visit_value_cents * (purchased_visits - 1)
      Selector: FINAL_RESIDUAL applies if and only if, immediately BEFORE this draw,
      redeemed_visits == purchased_visits - 1 (every other entitlement was actually
      redeemed). If remaining_visits happens to be 1 because entitlements were
      refunded or forfeited rather than redeemed, STANDARD applies instead.
    input_set: "One SeriesPack row, read before the decrement."
    constants: {}
    precision: "Integer cents; the residual is never split."
    variants:
      - name: STANDARD
        when: "Redemptions 1 through 7 of a full pack."
        difference: "Debits the floored per-visit value. B12 debits 3287."
      - name: FINAL_RESIDUAL
        when: "The eighth redemption of a pack whose other seven were all redeemed."
        difference: "Debits the whole remaining book value so the pack's debits sum exactly to price_cents. B12 debits 26300 - 3287*7 = 3291, four cents more than a STANDARD draw on the identical pack."

  - name: series_refund_cents
    trigger: "POST /clinic/series-packs/{id}/refund"
    algorithm: aggregation
    formula: |
      refunded_visits_delta = SeriesPack.remaining_visits
      refunded_cents        = remaining_visits * per_visit_value_cents
      then: refunded_visits += refunded_visits_delta and remaining_visits = 0
    input_set: "One SeriesPack in status ACTIVE."
    constants: {}
    precision: "Integer cents."
    note: |
      Deliberately uses the floored per-visit value with no residual adjustment: the
      four-cent residual only ever rides on a genuine final redemption, so a pack
      that is fully refunded before any redemption returns 8 * 3287 = 26296 against a
      price of 26300, and the clinic keeps the 4-cent residual. This is intended, not
      drift - series_entitlement_conservation is stated over VISITS, not cents.

  - name: refund_settlement_cents
    trigger: "PROVISIONAL_QUOTE at GET /clinic/procedures/{id}/refund-quote; FINAL_SETTLEMENT inside POST /clinic/procedures/{id}/cancel"
    algorithm: chronological
    formula: |
      paid_to_date_cents = 0 when the procedure has no FinancingPlan, otherwise
                           FinancingPlan.down_payment_cents
                           + FinancingPlan.paid_installment_cents
      cancel_fee_cents   = late_cancel_fee_cents(variant CANCEL_TIER) evaluated against
                           the logical clock at the moment of the call
      wasted_pellet_charge_cents =
          sum over PelletAllocation rows of this procedure whose status is exactly
          WASTED of round_half_up(quantity * strength_mg * price_per_mg),
          rounded PER ALLOCATION ROW and then summed

      PROVISIONAL_QUOTE: refund_cents = max(0, paid_to_date_cents - cancel_fee_cents)
      FINAL_SETTLEMENT:  refund_cents = max(0, paid_to_date_cents - cancel_fee_cents
                                                - wasted_pellet_charge_cents)
    input_set: |
      Both variants read the same rows at the same instant. The divergence is
      structural, not temporal: at quote time a SUPPLY_OPENED procedure has zero
      WASTED allocations, and the very act of cancelling from SUPPLY_OPENED converts
      the whole opened tray to WASTED, so the settlement subtracts a charge the quote
      could not see.
    constants:
      PELLET_PRICE_CENTS_PER_MG_TESTOSTERONE: 21.5
      PELLET_PRICE_CENTS_PER_MG_ESTRADIOL: 176.25
    precision: "round_half_up per allocation row; the max(0, ...) clamp is applied last."
    variants:
      - name: PROVISIONAL_QUOTE
        when: "The read-only quote a coordinator shows the patient before they decide."
        difference: "Assumes zero pellet wastage. Optimistic."
      - name: FINAL_SETTLEMENT
        when: "The number actually written to FinancingPlan.refunded_cents by the cancel."
        difference: "Subtracts the wasted-pellet charge for the tray the cancel itself destroys, so cancelling from SUPPLY_OPENED always settles at or below the quote, and cancelling from SCHEDULED or CONSENTED settles exactly at the quote."

  - name: injection_payment_source
    trigger: "POST /clinic/injection-visits/{id}/administer"
    algorithm: waterfall_allocation
    formula: |
      Fixed precedence, evaluated top to bottom, first match wins:
      1. series_pack_id is non-null                      -> SERIES
      2. membership_id is non-null
         AND that Membership.status == ACTIVE
         AND included_visits_used < included_visits_allowance   -> MEMBERSHIP_INCLUDED
      3. otherwise                                       -> SELF_PAY

      charge_cents:
        SERIES              -> 0   (series_debit_cents carries the value instead)
        MEMBERSHIP_INCLUDED -> 0
        SELF_PAY            -> round_half_up(INJECTION_LIST_PRICE_CENTS_<injection_type>
                                             * (1 - discount_pct))
                               where discount_pct is the Membership's discount_pct when
                               membership_id is non-null and that Membership.status ==
                               ACTIVE, else 0
    input_set: "One InjectionVisit, at most one SeriesPack, at most one Membership."
    constants:
      INJECTION_LIST_PRICE_CENTS_B12: 3500
      INJECTION_LIST_PRICE_CENTS_LIPOTROPIC: 4500
      INJECTION_LIST_PRICE_CENTS_VITAMIN_D: 5500
      INJECTION_LIST_PRICE_CENTS_GLUTATHIONE: 8500
      MEMBERSHIP_DISCOUNT_PCT_BASIC: 0.00
      MEMBERSHIP_DISCOUNT_PCT_PLUS: 0.10
      MEMBERSHIP_DISCOUNT_PCT_ELITE: 0.20
    precision: "round_half_up once, after the discount multiply."
    note: |
      Precedence is absolute: a patient holding both a usable pack and an unused
      included-visit allowance always burns the pack. A PAUSED membership never
      supplies either the allowance or the discount, so a paused ELITE member pays
      the full 8500 for a GLUTATHIONE injection while an active one pays 6800.

  - name: recall_impact_counts
    trigger: "GET /clinic/pellet-lots/{id}/recall-impact"
    algorithm: projection
    formula: |
      PROJECTION (deliberately over-inclusive worst-case planning number):
        projected_released_allocation_count = count of PelletAllocation of this lot
                                              with status in {RESERVED, OPENED}
        projected_flagged_allocation_count  = count with status == CONSUMED
        projected_affected_procedure_count  = count of DISTINCT procedure_id over the
                                              CONSUMED allocations of this lot, with NO
                                              procedure-status filter
        projected_held_procedure_count      = count of DISTINCT procedure_id over the
                                              RESERVED/OPENED allocations of this lot
                                              whose Procedure.status is in
                                              {SCHEDULED, CONSENTED, SUPPLY_OPENED}
        projected_notification_count        = projected_affected_procedure_count
        projected_surveillance_event_count  = projected_affected_procedure_count when the
                                              assume_severity query parameter is CLASS_I,
                                              else 0

      ACTUAL (only meaningful once sterility_status == RECALLED):
        actual_released_allocation_count    = count with status == RECALL_RELEASED
        actual_flagged_allocation_count     = count with status == RECALL_FLAGGED
        actual_affected_procedure_count     = count of Procedures with recall_status
                                              == NOTIFIED owning an allocation of this lot
        actual_held_procedure_count         = count of Procedures with status SUPPLY_HOLD
                                              and hold_reason == LOT_RECALL owning an
                                              allocation of this lot
        actual_notification_count           = count of PatientNotification with this lot_id
        actual_surveillance_event_count     = count of AdverseEvent with this lot_id and
                                              source == RECALL_SURVEILLANCE
    input_set: "One PelletLot and everything reachable through its allocations."
    constants: {}
    precision: "Exact integer counts."
    variants:
      - name: PROJECTION
        when: "variant query parameter PROJECTION, at any time."
        difference: "Counts every procedure holding a CONSUMED allocation, including VOIDED and CANCELLED ones."
      - name: ACTUAL
        when: "variant query parameter ACTUAL, after the recall has run."
        difference: "Counts only what the cascade actually wrote, and hop 3a skips VOIDED and CANCELLED procedures - so a lot consumed by two COMPLETED and one VOIDED procedure projects 3 affected and actually reaches 2."

  - name: delinquency_assessment
    trigger: "POST /clinic/billing/delinquency-run"
    algorithm: chronological
    formula: |
      Phase 1 - financing, plans swept in ascending FinancingPlan.created_at, and within
      each plan its schedule entries in ascending index:
        for each plan with status in {ACTIVE, DELINQUENT}:
          for each schedule entry with status PENDING:
            if days_between(entry.due_date, now) > FINANCING_GRACE_PERIOD_DAYS:
               entry.status = MISSED
               plan.late_fee_cents += FINANCING_LATE_FEE_CENTS
          plan.missed_count = count of entries with status MISSED
          if plan.missed_count >= FINANCING_DEFAULT_MISSED_THRESHOLD:
             plan.status = DEFAULTED and the three-hop default cascade runs
          else if plan.missed_count >= 1:
             plan.status = DELINQUENT
          else:
             plan.status unchanged
      Phase 2 - notifications, swept in ascending PatientNotification.created_at:
        every PatientNotification with status PENDING and due_at strictly before now
        moves to OVERDUE.
      Phase 1 always completes before Phase 2 begins.
    input_set: "All FinancingPlan rows in ACTIVE or DELINQUENT, and all PatientNotification rows in PENDING. DRAFT, DEFAULTED, PAID_OFF and CANCELLED plans are skipped entirely."
    constants:
      FINANCING_GRACE_PERIOD_DAYS: 10
      FINANCING_DEFAULT_MISSED_THRESHOLD: 3
      FINANCING_LATE_FEE_CENTS: 2500
    precision: "Exact integer cents and counts."
    note: |
      Boundary is strict: an installment exactly FINANCING_GRACE_PERIOD_DAYS late is
      still PENDING; at eleven days it flips. A late fee accrues once per entry, at
      the moment it flips, so re-running the sweep without advancing the clock adds
      nothing.

  - name: patient_eligibility_projection
    trigger: "Recomputed inside every request that writes Patient.clinical_hold or Patient.financial_hold"
    algorithm: projection
    formula: |
      eligibility_status = DUAL_HOLD      when clinical_hold and financial_hold
                         = CLINICAL_HOLD  when clinical_hold and not financial_hold
                         = FINANCIAL_HOLD when financial_hold and not clinical_hold
                         = CLEAR          otherwise

      clinical_hold is SET true by: creation of an AdverseEvent with severity SEVERE;
        hop 5 of the lot-recall cascade for a CLASS_I lot; or
        POST /clinic/patients/{id}/eligibility-hold with hold_kind CLINICAL and
        hold_action SET.
      clinical_hold is SET false by: a review that leaves the patient with zero
        AdverseEvent rows whose severity is in {SEVERE, SURVEILLANCE} and whose status
        is in {OPEN, ESCALATED}; or the same endpoint with hold_action CLEAR.
      financial_hold is SET true by: hop 3 of the delinquency default cascade, or the
        same endpoint with hold_kind FINANCIAL and hold_action SET.
      financial_hold is SET false by: the same endpoint with hold_kind FINANCIAL and
        hold_action CLEAR. A DEFAULTED plan never self-cures.
    input_set: "The two persisted booleans on one Patient row."
    constants: {}
    precision: "Enum projection; no arithmetic."
    note: |
      The two booleans are persisted, not re-derived on read. The endpoint is the only
      way to clear a financial hold, which is what makes the SUPPLY_HOLD to SCHEDULED
      recovery leg reachable.

validations:
  # ---------- Rungs 1 to 8: authentication, shape, existence, ownership ----------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven roles declared in the RBAC matrix."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The acting role appears in the endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: |
      Every required input field for the endpoint is present, of the declared type,
      and within its declared numeric bounds; pagination limit is an integer in
      [1, 100] and offset is an integer >= 0. Also covers: prescribed_dose_mg > 0,
      symptom_score an integer in [0, 100], qty_received > 0, principal_cents > 0,
      installment_count an integer, valid_until strictly after valid_from and no
      more than STANDING_ORDER_MAX_VALIDITY_DAYS after it.
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: business_constraint
    check: |
      Every enum-valued INPUT field carries a declared member. The exhaustive list of
      fields routed here is: Patient.sex_at_birth; Provider.provider_type;
      Protocol.hormone_type; ConsentRecord.hormone_type; Consult.hormone_type;
      LabPanel.analyte; PelletLot.hormone_type; StandingOrder.scope_hormone_types
      members; StandingOrder.scope_injection_types members; Procedure.procedure_type;
      InjectionVisit.injection_type; Membership.tier; SeriesPack.series_type;
      AdverseEvent.severity (input members MILD, MODERATE, SEVERE only - SURVEILLANCE
      is system-only and is rejected here); the recall endpoint's severity_class; the
      eligibility-hold endpoint's hold_kind and hold_action; the adverse-event review
      endpoint's disposition; the recall-impact endpoint's variant and
      assume_severity; the therapy-status endpoint's variant. No other field routes
      here - an out-of-range integer or a malformed datetime is ERR_VALIDATION at
      rung 4, not ERR_INVALID_ENUM.
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all endpoints that accept an enum-valued input field"

  - priority: 6
    category: existence
    check: "Every path-segment resource id resolves, validated left to right."
    error_id: "ERR_PATIENT_NOT_FOUND, ERR_PROVIDER_NOT_FOUND, ERR_PROTOCOL_NOT_FOUND, ERR_CONSENT_NOT_FOUND, ERR_CONSULT_NOT_FOUND, ERR_LAB_PANEL_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_STANDING_ORDER_NOT_FOUND, ERR_PROCEDURE_NOT_FOUND, ERR_INJECTION_VISIT_NOT_FOUND, ERR_MEMBERSHIP_NOT_FOUND, ERR_SERIES_PACK_NOT_FOUND, ERR_ADVERSE_EVENT_NOT_FOUND, ERR_FINANCING_PLAN_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 7
    category: existence
    check: |
      Every non-null foreign key in the request body resolves, checked in this fixed
      order: patient_id, then provider_id / physician_id / published_by_provider_id /
      reported_by_provider_id, then consult_id, then standing_order_id, then
      consent_record_id, then lab_panel_id, then lot_id, then procedure_id, then
      injection_visit_id, then series_pack_id, then membership_id.
    error_id: "the same per-entity NOT_FOUND codes as rung 6"
    http_status: 404
    applies_to: "every endpoint with foreign keys in its input"

  - priority: 8
    category: auth
    check: |
      For entity_backed roles, X-User-ID must own the addressed row. Patient may only
      read or act on rows whose patient_id equals X-User-ID. Physician and
      NurseInjector must supply an X-User-ID that is a Provider id, and for
      standing-order revoke and reinstate the acting X-User-ID must equal
      StandingOrder.physician_id.
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "all endpoints whose acting role is Patient, Physician or NurseInjector"

  # ---------- Rung 9: the global delegated-authority write gate ----------
  - priority: 9
    category: business_safety
    check: |
      GLOBAL WRITE GATE. When the acting role is NurseInjector and the endpoint is in
      the gated family - POST /clinic/procedures/{id}/open-supply,
      POST /clinic/procedures/{id}/perform, POST /clinic/injection-visits/{id}/administer
      - the StandingOrder referenced by the target row must satisfy ALL of:
        (a) status == ACTIVE (SUSPENDED and REVOKED both fail);
        (b) valid_from <= now <= valid_until, both bounds inclusive, against the
            logical clock;
        (c) for a Procedure: Procedure.hormone_type is a member of
            scope_hormone_types; for an InjectionVisit: InjectionVisit.injection_type
            is a member of scope_injection_types;
        (d) for a Procedure: Procedure.planned_total_mg <= StandingOrder.max_dose_mg.
      This rung sits above state, OCC and every business rung, so a NurseInjector
      acting under a lapsed order sees ERR_STANDING_ORDER_INVALID even when the
      target row is also in the wrong state, also stale, also out of inventory.
    error_id: ERR_STANDING_ORDER_INVALID
    http_status: 403
    applies_to: "POST /clinic/procedures/{id}/open-supply, POST /clinic/procedures/{id}/perform, POST /clinic/injection-visits/{id}/administer - and ONLY when X-User-Role is NurseInjector"
    exclusions_and_why: |
      Deliberate exclusions that keep the lower rungs reachable:
      (1) The same three endpoints performed by a Physician are OUTSIDE the gate. A
          physician acts on their own licence, so no delegation is needed. This is the
          escape hatch that keeps rungs 10 through 39 reachable even when every
          standing order in the database is suspended, revoked or lapsed.
      (2) POST /clinic/procedures is OUTSIDE the gate for every role. Scheduling
          administers nothing, and holding it outside is what keeps the scheduling
          rungs (21 through 28) reachable without a valid order.
      (3) POST /clinic/procedures/{id}/allocations is OUTSIDE the gate. Allocation is
          an inventory movement performed by an InventoryManager, and keeping it
          outside is what keeps rungs 29 and 30 reachable.
      (4) POST /clinic/lab-panels, POST /clinic/consults and all cancel/void endpoints
          are OUTSIDE the gate - they are clinical data entry and reversals, never
          administration.

  # ---------- Rungs 10 to 13: state, concurrency, duty segregation ----------
  - priority: 10
    category: state
    check: "The target row is in a state from which the requested transition is declared in the relevant state machine."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 11
    category: state
    check: |
      The target row is not already in a terminal state for the axis being moved.
      Terminal sets: Procedure.status {CANCELLED, VOIDED}; PelletLot.sterility_status
      {RECALLED}; StandingOrder.status {REVOKED}; SeriesPack.status {EXPIRED,
      REFUNDED}; InjectionVisit.status {CANCELLED, VOIDED}; Membership.status
      {CANCELLED}; FinancingPlan.status {DEFAULTED, PAID_OFF, CANCELLED};
      AdverseEvent.status {CLOSED}; PatientNotification.status {ACKNOWLEDGED}.
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 12
    category: state
    check: "The supplied expected_<parent>_version equals the parent row's current version."
    error_id: "ERR_STALE_PATIENT_VERSION, ERR_STALE_PROCEDURE_VERSION, ERR_STALE_MEMBERSHIP_VERSION"
    http_status: 412
    applies_to: "POST /clinic/procedures/{id}/perform, POST /clinic/procedures/{id}/allocations, POST /clinic/memberships/{id}/tier-change"

  - priority: 13
    category: business_safety
    check: |
      Segregation of duties on adverse-event review: the acting X-User-ID must differ
      from AdverseEvent.reported_by_provider_id, and when the event is already
      ESCALATED it must additionally differ from the reviewed_by_provider_id recorded
      by the escalating review.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /clinic/adverse-events/{id}/review"

  # ---------- Rungs 14 to 20: clinical safety ----------
  - priority: 14
    category: business_safety
    check: "Patient.clinical_hold is false."
    error_id: ERR_PATIENT_CLINICAL_HOLD
    http_status: 409
    applies_to: "POST /clinic/procedures, POST /clinic/procedures/{id}/perform, POST /clinic/injection-visits/{id}/administer"

  - priority: 15
    category: business_safety
    check: "The patient has no LabPanel in status CRITICAL_FLAGGED. Acknowledging the panel clears the block; recording a newer panel does NOT, because CRITICAL_FLAGGED panels are never superseded."
    error_id: ERR_CRITICAL_LAB_UNACKNOWLEDGED
    http_status: 409
    applies_to: "POST /clinic/procedures/{id}/perform, POST /clinic/injection-visits/{id}/administer"

  - priority: 16
    category: business_referential
    check: |
      The consent attached to the procedure exists, has status ACTIVE, belongs to the
      same patient, covers the same hormone_type, and its protocol_version equals the
      highest published Protocol.protocol_version for that hormone_type. At perform
      time, Procedure.consent_record_id must be non-null and still ACTIVE.
    error_id: ERR_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /clinic/procedures/{id}/consent-attach, POST /clinic/procedures/{id}/open-supply, POST /clinic/procedures/{id}/perform"

  - priority: 17
    category: business_safety
    check: "ConsentRecord.consented_max_dose_mg >= Procedure.planned_total_mg."
    error_id: ERR_CONSENT_DOSE_EXCEEDED
    http_status: 422
    applies_to: "POST /clinic/procedures/{id}/consent-attach"

  - priority: 18
    category: business_safety
    check: "The patient's most recent non-SUPERSEDED HEMATOCRIT LabPanel has value <= HEMATOCRIT_SAFETY_CEILING (52.0). A patient with no HEMATOCRIT panel at all passes this rung."
    error_id: ERR_SAFETY_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /clinic/procedures, POST /clinic/procedures/{id}/perform"

  - priority: 19
    category: business_safety
    check: "Procedure.planned_total_mg <= MAX_DOSE_PER_PROCEDURE_MG_TESTOSTERONE (2000) or MAX_DOSE_PER_PROCEDURE_MG_ESTRADIOL (150) by hormone_type. Equality passes."
    error_id: ERR_DOSE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /clinic/procedures"

  - priority: 20
    category: business_safety
    check: |
      At scheduling: rolling_mg_exposure(INCLUDING_SCHEDULED) + this procedure's
      planned_total_mg <= ROLLING_MG_CAP_<hormone>. At perform:
      rolling_mg_exposure(COMPLETED_ONLY) + the delivered milligrams about to commit
      <= ROLLING_MG_CAP_<hormone>. Equality passes in both cases.
    error_id: ERR_ROLLING_MG_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /clinic/procedures, POST /clinic/procedures/{id}/perform"

  # ---------- Rungs 21 to 25: the five re-dose factors, in fixed order ----------
  - priority: 21
    category: business_temporal
    check: "Factor f3 - days_between(LabPanel.drawn_at, now) <= LAB_MAX_AGE_DAYS (45). Exactly 45 days old passes; 46 fails and forces a re-draw."
    error_id: ERR_LAB_STALE
    http_status: 422
    applies_to: "POST /clinic/procedures when procedure_type == REDOSE"

  - priority: 22
    category: business_temporal
    check: "Factor f2 - LabPanel.is_trough_draw is true AND TROUGH_WINDOW_OPEN_DAYS_<h> <= days_between(anchor, LabPanel.drawn_at) <= TROUGH_WINDOW_CLOSE_DAYS_<h>, BOTH bounds inclusive."
    error_id: ERR_TROUGH_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /clinic/procedures when procedure_type == REDOSE"

  - priority: 23
    category: business_temporal
    check: "Factor f1 - days_between(anchor, scheduled_start) >= MIN_REDOSE_INTERVAL_DAYS_<h>. 'At least', so equality passes. A patient with no COMPLETED procedure of that hormone also fails here."
    error_id: ERR_REDOSE_INTERVAL_NOT_MET
    http_status: 422
    applies_to: "POST /clinic/procedures when procedure_type == REDOSE"

  - priority: 24
    category: business_constraint
    check: "Factor f5 - the referenced LabPanel's analyte is the hormone's primary analyte AND its clinic_optimal_band is BELOW_OPTIMAL. A lab-normal but not-below-optimal value fails here even though lab_reference_band reads IN_REF."
    error_id: ERR_ANALYTE_NOT_BELOW_OPTIMAL
    http_status: 422
    applies_to: "POST /clinic/procedures when procedure_type == REDOSE"

  - priority: 25
    category: business_constraint
    check: "Factor f4 - Consult.symptom_score >= REDOSE_MIN_SYMPTOM_SCORE (40). Equality passes."
    error_id: ERR_SYMPTOM_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /clinic/procedures when procedure_type == REDOSE"

  # ---------- Rungs 26 to 28: temporal occupation ----------
  - priority: 26
    category: business_temporal
    check: |
      Post-insertion restriction, anchored on the PATIENT. Reject when
      scheduled_start < Patient.last_insertion_at + POST_INSERTION_RESTRICTION_DAYS
      (14) days, using a STRICT less-than so a slot exactly 14 days after the last
      insertion is allowed. This is a point-anchored forward exclusion over ANY
      hormone_type, distinct from the same-hormone re-dose interval at rung 23.
    error_id: ERR_POST_INSERTION_RESTRICTION
    http_status: 409
    applies_to: "POST /clinic/procedures"

  - priority: 27
    category: business_temporal
    check: |
      Provider double-booking with a symmetric buffer. Expand the NEW booking by
      PROVIDER_SLOT_BUFFER_MINUTES (20) on both sides and test half-open overlap
      against the RAW intervals of the provider's existing bookings:
        conflict iff (new_start - 20min) < existing_end
                 AND existing_start < (new_end + 20min)
      The candidate set is every Procedure of that provider_id with status in
      {SCHEDULED, CONSENTED, SUPPLY_OPENED, COMPLETED} plus every InjectionVisit of
      that provider_id with status in {SCHEDULED, ADMINISTERED}. CANCELLED, VOIDED
      and SUPPLY_HOLD rows never occupy a provider.
    error_id: ERR_PROVIDER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /clinic/procedures, POST /clinic/injection-visits"

  - priority: 28
    category: business_temporal
    check: |
      Room double-booking with NO buffer and half-open intervals, so back-to-back
      bookings that touch exactly at a boundary are allowed:
        conflict iff new_start < existing_end AND existing_start < new_end
      Same candidate status sets as rung 27, matched on room_code instead of
      provider_id. The two rungs therefore use different interval geometry on
      different resources.
    error_id: ERR_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /clinic/procedures, POST /clinic/injection-visits"

  # ---------- Rungs 29 to 30: inventory ----------
  - priority: 29
    category: business_referential
    check: "PelletLot.strength_mg is a member of the ladder for PelletLot.hormone_type - {200, 100} for TESTOSTERONE, {25, 10} for ESTRADIOL."
    error_id: ERR_LOT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /clinic/pellet-lots"

  - priority: 30
    category: business_constraint
    check: "The FEFO walk satisfies both strength legs in full. An empty candidate set and a short walk both land here, and nothing is mutated."
    error_id: ERR_INSUFFICIENT_PELLET_INVENTORY
    http_status: 409
    applies_to: "POST /clinic/procedures/{id}/allocations"

  # ---------- Rungs 31 to 35: entitlement pools ----------
  - priority: 31
    category: business_referential
    check: "SeriesPack.patient_id equals InjectionVisit.patient_id. Packs are never transferable between patients."
    error_id: ERR_SERIES_NOT_TRANSFERABLE
    http_status: 403
    applies_to: "POST /clinic/injection-visits, POST /clinic/injection-visits/{id}/administer"

  - priority: 32
    category: business_temporal
    check: |
      now <= SeriesPack.expires_at. When it is not, and the pack is still ACTIVE, the
      request FIRST commits the forfeiture side effect declared on the SeriesPack
      ACTIVE-to-EXPIRED transition (forfeited_visits absorbs remaining_visits) and
      THEN fails. A pack already in status EXPIRED fails here with no further write.
    error_id: ERR_SERIES_EXPIRED
    http_status: 409
    applies_to: "POST /clinic/injection-visits/{id}/administer"

  - priority: 33
    category: business_constraint
    check: "SeriesPack.remaining_visits >= 1."
    error_id: ERR_SERIES_EXHAUSTED
    http_status: 409
    applies_to: "POST /clinic/injection-visits/{id}/administer"

  - priority: 34
    category: business_constraint
    check: "The patient has no other Membership in status ACTIVE or PAUSED."
    error_id: ERR_DUPLICATE_ACTIVE_MEMBERSHIP
    http_status: 409
    applies_to: "POST /clinic/memberships"

  - priority: 35
    category: business_temporal
    check: "pause_days_used + days_between(paused_at, now) <= MAX_PAUSE_DAYS_PER_YEAR (90). Equality passes. Checked before any mutation, so a rejected resume leaves the membership untouched."
    error_id: ERR_PAUSE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /clinic/memberships/{id}/resume"

  # ---------- Rungs 36 to 39: fiscal, checked last ----------
  - priority: 36
    category: business_fiscal
    check: "down_payment_cents >= ceil(principal_cents * FINANCING_MIN_DOWN_PAYMENT_PCT) and down_payment_cents < principal_cents."
    error_id: ERR_DOWN_PAYMENT_TOO_LOW
    http_status: 422
    applies_to: "POST /clinic/financing-plans"

  - priority: 37
    category: business_fiscal
    check: "installment_count is between FINANCING_MIN_INSTALLMENTS (2) and FINANCING_MAX_INSTALLMENTS (12) inclusive."
    error_id: ERR_INSTALLMENT_COUNT_INVALID
    http_status: 422
    applies_to: "POST /clinic/financing-plans"

  - priority: 38
    category: business_fiscal
    check: "The payment's amount_cents exactly equals the addressed schedule entry's amount_cents, and that entry's status is PENDING or MISSED. Partial and over-payments are rejected."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /clinic/financing-plans/{id}/payments"

  - priority: 39
    category: business_fiscal
    check: "Patient.financial_hold is false. Sits at the bottom of the ladder so that a patient carrying both holds always sees ERR_PATIENT_CLINICAL_HOLD from rung 14 instead."
    error_id: ERR_PATIENT_FINANCIAL_HOLD
    http_status: 402
    applies_to: "POST /clinic/procedures, POST /clinic/procedures/{id}/perform"

endpoints:
  # ---------------------------- Patients ----------------------------
  - method: POST
    path: "/clinic/patients"
    description: "Register a patient."
    roles: [ClinicAdmin, FrontDesk]
    code: 201
    input: [full_name, date_of_birth, email, sex_at_birth]
    output: Patient
    side_effects: ["clinical_hold and financial_hold initialised false", "eligibility_status initialised CLEAR"]

  - method: GET
    path: "/clinic/patients/{id}"
    description: "Read one patient, including both hold booleans and the cumulative milligram counters."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/clinic/patients/{id}/therapy-status"
    description: "Computed read: both rolling_mg_exposure variants side by side, the five re-dose factors, and the eligibility projection."
    roles: [ClinicAdmin, Physician, NurseInjector, FrontDesk, Patient]
    code: 200
    input: [hormone_type, "consult_id?", "lab_panel_id?", "scheduled_start?"]
    output: "{ patient_id: string, hormone_type: string, rolling_mg_completed_only: number, rolling_mg_including_scheduled: number, rolling_mg_cap: number, anchor_performed_at: string, f1_interval_ok: boolean, f2_trough_ok: boolean, f3_freshness_ok: boolean, f4_symptom_ok: boolean, f5_band_ok: boolean, redose_eligible: boolean, clinical_hold: boolean, financial_hold: boolean, eligibility_status: string }"
    side_effects: []

  - method: POST
    path: "/clinic/patients/{id}/eligibility-hold"
    description: "Set or clear one of the two eligibility holds. The only way to clear a financial hold."
    roles: [ClinicAdmin, Physician]
    code: 200
    input: [hold_kind, hold_action, "reason?"]
    output: Patient
    side_effects:
      - "writes Patient.clinical_hold or Patient.financial_hold and recomputes eligibility_status"
      - "on hold_kind FINANCIAL with hold_action CLEAR: every Procedure of the patient in SUPPLY_HOLD with hold_reason PATIENT_FINANCIAL_HOLD returns to SCHEDULED"
      - "increments Patient.version by 1"

  # ---------------------------- Providers ----------------------------
  - method: POST
    path: "/clinic/providers"
    description: "Register a clinician."
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, provider_type, npi, "active?"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/clinic/providers/{id}"
    description: "Read one provider."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer]
    code: 200
    input: []
    output: Provider
    side_effects: []

  # ---------------------------- Protocols ----------------------------
  - method: POST
    path: "/clinic/protocols"
    description: "Publish a new clinical protocol version for one hormone type. Fires the consent-invalidation cascade."
    roles: [Physician, ClinicAdmin]
    code: 201
    input: [hormone_type, title, published_by_provider_id]
    output: Protocol
    side_effects:
      - "protocol_version set to 1 + the highest existing version for the same hormone_type"
      - "hop 2: every ConsentRecord for that hormone_type in status ACTIVE moves to SUPERSEDED"
      - "hop 3: every Procedure in status CONSENTED holding one of those consents returns to SCHEDULED with consent_record_id cleared"
      - "hop 4: a PatientNotification of type CONSENT_REQUIRED is minted for each such procedure and Patient.open_notification_count increments"

  - method: GET
    path: "/clinic/protocols/{id}"
    description: "Read one protocol version."
    roles: [ClinicAdmin, Physician, NurseInjector, FrontDesk, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: Protocol
    side_effects: []

  - method: GET
    path: "/clinic/protocols"
    description: "List protocol versions, filterable by hormone type and publishing physician."
    roles: [ClinicAdmin, Physician, NurseInjector, FrontDesk, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "hormone_type?", "published_by_provider_id?"]
    output: Protocol[]
    side_effects: []

  # ---------------------------- Consents ----------------------------
  - method: POST
    path: "/clinic/consents"
    description: "Sign a versioned consent. Supersedes any prior ACTIVE consent for the same patient and hormone type."
    roles: [FrontDesk, Physician, Patient]
    code: 201
    input: [patient_id, hormone_type, protocol_version, consented_max_dose_mg]
    output: ConsentRecord
    side_effects:
      - "any prior ConsentRecord for the same patient_id and hormone_type in status ACTIVE moves to SUPERSEDED"
      - "signed_at stamped from the logical clock"

  - method: GET
    path: "/clinic/consents/{id}"
    description: "Read one consent record."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []

  - method: GET
    path: "/clinic/consents"
    description: "List consent records, filterable by patient, hormone type and status."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "hormone_type?", "status?"]
    output: ConsentRecord[]
    side_effects: []

  # ---------------------------- Consults ----------------------------
  - method: POST
    path: "/clinic/consults"
    description: "Record a consult and its prescribed dose. Computes the discrete pellet plan."
    roles: [Physician]
    code: 201
    input: [patient_id, physician_id, hormone_type, prescribed_dose_mg, symptom_score, indication]
    output: Consult
    side_effects: ["runs pellet_count_from_dose, writing planned_large_count, planned_small_count, planned_pellet_count and planned_total_mg"]

  - method: GET
    path: "/clinic/consults/{id}"
    description: "Read one consult, including its pellet plan."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: Consult
    side_effects: []

  - method: GET
    path: "/clinic/consults"
    description: "List consults, filterable by patient and physician."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "physician_id?"]
    output: Consult[]
    side_effects: []

  # ---------------------------- Lab panels ----------------------------
  - method: POST
    path: "/clinic/lab-panels"
    description: "Record a lab result. Classifies it against BOTH the laboratory reference interval and the clinic optimal band."
    roles: [Physician, NurseInjector]
    code: 201
    input: [patient_id, ordered_by_provider_id, analyte, value, drawn_at, "is_trough_draw?"]
    output: LabPanel
    side_effects:
      - "runs lab_band_classification, writing lab_reference_band, clinic_optimal_band and critical_flag"
      - "status set to CRITICAL_FLAGGED when critical_flag is true, else RECORDED"
      - "any prior LabPanel for the same patient_id and analyte in status RECORDED or ACKNOWLEDGED moves to SUPERSEDED; CRITICAL_FLAGGED panels are NOT superseded"

  - method: GET
    path: "/clinic/lab-panels/{id}"
    description: "Read one lab panel with both band classifications."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: LabPanel
    side_effects: []

  - method: GET
    path: "/clinic/lab-panels"
    description: "List lab panels, filterable by patient, ordering provider, acknowledging provider, analyte and status."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "ordered_by_provider_id?", "acknowledged_by_provider_id?", "analyte?", "status?"]
    output: LabPanel[]
    side_effects: []

  - method: POST
    path: "/clinic/lab-panels/{id}/acknowledge-critical"
    description: "Physician acknowledgement of a critical value; clears the perform block."
    roles: [Physician]
    code: 200
    input: ["note?"]
    output: LabPanel
    side_effects: ["status moves CRITICAL_FLAGGED to ACKNOWLEDGED", "acknowledged_by_provider_id set to the acting X-User-ID", "increments LabPanel.version by 1"]

  # ---------------------------- Pellet lots ----------------------------
  - method: POST
    path: "/clinic/pellet-lots"
    description: "Receive a pellet lot into quarantine."
    roles: [InventoryManager]
    code: 201
    input: [lot_code, hormone_type, strength_mg, expiry_date, qty_received]
    output: PelletLot
    side_effects: ["qty_on_hand set to qty_received; qty_reserved, qty_consumed, qty_wasted and qty_returned set to 0", "sterility_status set to QUARANTINED"]

  - method: GET
    path: "/clinic/pellet-lots/{id}"
    description: "Read one lot with all five conservation buckets."
    roles: [ClinicAdmin, InventoryManager, ComplianceOfficer, Physician, NurseInjector]
    code: 200
    input: []
    output: PelletLot
    side_effects: []

  - method: POST
    path: "/clinic/pellet-lots/{id}/release"
    description: "Release a quarantined lot for allocation."
    roles: [InventoryManager]
    code: 200
    input: []
    output: PelletLot
    side_effects: ["sterility_status moves QUARANTINED to RELEASED", "increments PelletLot.version by 1"]

  - method: POST
    path: "/clinic/pellet-lots/{id}/recall"
    description: "Recall a lot. Fires the five-hop cascade through allocations, procedures, notifications and surveillance events."
    roles: [InventoryManager, ComplianceOfficer]
    code: 200
    input: [severity_class, recall_reason]
    output: PelletLot
    side_effects:
      - "hop 1: sterility_status moves to RECALLED; qty_returned absorbs qty_on_hand which becomes 0"
      - "hop 2: RESERVED and OPENED allocations of this lot move to RECALL_RELEASED with quantity moved from qty_reserved to qty_returned; CONSUMED allocations move to RECALL_FLAGGED with no bucket movement"
      - "hop 3a: COMPLETED procedures owning a newly RECALL_FLAGGED allocation move recall_status NONE to RECALL_AFFECTED; VOIDED and CANCELLED procedures do not"
      - "hop 3b: SCHEDULED, CONSENTED and SUPPLY_OPENED procedures owning a newly RECALL_RELEASED allocation move to SUPPLY_HOLD with hold_reason LOT_RECALL"
      - "hop 4: each RECALL_AFFECTED procedure mints a PatientNotification of type RECALL and moves to recall_status NOTIFIED"
      - "hop 5: for severity_class CLASS_I only, each such notification mints an AdverseEvent with severity SURVEILLANCE and sets Patient.clinical_hold true"
      - "increments PelletLot.version by 1"

  - method: GET
    path: "/clinic/pellet-lots/{id}/recall-impact"
    description: "Computed read of recall blast radius under either the over-inclusive PROJECTION variant or the post-cascade ACTUAL variant."
    roles: [ClinicAdmin, InventoryManager, ComplianceOfficer]
    code: 200
    input: [variant, "assume_severity?"]
    output: "{ lot_id: string, variant: string, released_allocation_count: integer, flagged_allocation_count: integer, affected_procedure_count: integer, held_procedure_count: integer, notification_count: integer, surveillance_event_count: integer }"
    side_effects: []

  - method: GET
    path: "/clinic/pellet-lots/{id}/allocations"
    description: "Every allocation drawn from this lot; the reverse-reachability channel for cascade-created allocation rows."
    roles: [ClinicAdmin, InventoryManager, ComplianceOfficer, Physician, NurseInjector]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PelletAllocation[]
    side_effects: []

  # ---------------------------- Standing orders ----------------------------
  - method: POST
    path: "/clinic/standing-orders"
    description: "A physician delegates administration authority within a typed, dose-capped, time-bounded scope."
    roles: [Physician]
    code: 201
    input: [physician_id, scope_hormone_types, scope_injection_types, max_dose_mg, valid_from, valid_until]
    output: StandingOrder
    side_effects: ["status set to ACTIVE"]

  - method: GET
    path: "/clinic/standing-orders/{id}"
    description: "Read one standing order."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer]
    code: 200
    input: []
    output: StandingOrder
    side_effects: []

  - method: GET
    path: "/clinic/standing-orders"
    description: "List standing orders, filterable by physician and status."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "physician_id?", "status?"]
    output: StandingOrder[]
    side_effects: []

  - method: POST
    path: "/clinic/standing-orders/{id}/revoke"
    description: "Permanently withdraw the delegation. Forward-looking only."
    roles: [Physician]
    code: 200
    input: ["reason?"]
    output: StandingOrder
    side_effects: ["status moves to REVOKED", "already-scheduled procedures are NOT held", "increments StandingOrder.version by 1"]

  - method: POST
    path: "/clinic/standing-orders/{id}/reinstate"
    description: "Lift a suspension imposed by a severe adverse event and release the procedures it held."
    roles: [Physician]
    code: 200
    input: []
    output: StandingOrder
    side_effects:
      - "status moves SUSPENDED to ACTIVE and suspended_reason clears"
      - "every Procedure with this standing_order_id in SUPPLY_HOLD with hold_reason STANDING_ORDER_SUSPENDED returns to SCHEDULED with consent_record_id cleared"
      - "increments StandingOrder.version by 1"

  # ---------------------------- Procedures ----------------------------
  - method: POST
    path: "/clinic/procedures"
    description: "Schedule a pellet insertion. Runs the re-dose gate, the dose caps, the safety ceiling and both overlap checks. Deliberately OUTSIDE the standing-order write gate."
    roles: [FrontDesk, Physician]
    code: 201
    input: [patient_id, provider_id, consult_id, standing_order_id, procedure_type, room_code, scheduled_start, "lab_panel_id?", "membership_id?"]
    output: Procedure
    side_effects:
      - "hormone_type, planned_pellet_count and planned_total_mg copied from the Consult"
      - "scheduled_end set to scheduled_start + PROCEDURE_DURATION_MINUTES"
      - "status set to SCHEDULED and recall_status to NONE"

  - method: GET
    path: "/clinic/procedures/{id}"
    description: "Read one procedure across both of its state axes."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, InventoryManager, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: Procedure
    side_effects: []

  - method: GET
    path: "/clinic/procedures"
    description: "List procedures, filterable by every foreign key and by both state axes."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, InventoryManager, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "provider_id?", "consult_id?", "standing_order_id?", "consent_record_id?", "lab_panel_id?", "membership_id?", "status?", "recall_status?"]
    output: Procedure[]
    side_effects: []

  - method: POST
    path: "/clinic/procedures/{id}/consent-attach"
    description: "Attach a versioned consent to a scheduled procedure."
    roles: [FrontDesk, Physician, Patient]
    code: 200
    input: [consent_record_id]
    output: Procedure
    side_effects: ["status moves SCHEDULED to CONSENTED", "consent_record_id set", "increments Procedure.version by 1"]

  - method: POST
    path: "/clinic/procedures/{id}/allocations"
    description: "Run the FEFO allocation plan against released, unexpired lots. Supersedes any allocation set the procedure already holds, which is why it is OCC-guarded."
    roles: [InventoryManager, Physician]
    code: 201
    input: [expected_procedure_version]
    output: PelletAllocation[]
    side_effects:
      - "any existing RESERVED or OPENED allocation of this procedure is first RELEASED with its quantity credited back to qty_on_hand"
      - "one PelletAllocation per lot draw, with allocation_rank in FEFO order"
      - "each drawn lot moves quantity from qty_on_hand to qty_reserved"
      - "Procedure.pellets_allocated recomputed"
      - "increments Procedure.version by 1"

  - method: GET
    path: "/clinic/procedures/{id}/allocations"
    description: "Every allocation held by this procedure; the reverse-reachability channel from the procedure side."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, InventoryManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PelletAllocation[]
    side_effects: []

  - method: POST
    path: "/clinic/procedures/{id}/open-supply"
    description: "Open the sterile tray. Inside the standing-order write gate when the actor is a NurseInjector."
    roles: [NurseInjector, Physician]
    code: 200
    input: []
    output: Procedure
    side_effects:
      - "status moves CONSENTED to SUPPLY_OPENED"
      - "every RESERVED allocation of this procedure moves to OPENED with NO lot bucket movement"
      - "pellets_opened set to pellets_allocated"
      - "increments Procedure.version by 1"

  - method: POST
    path: "/clinic/procedures/{id}/perform"
    description: "Implant the pellets. OCC-guarded on the Patient, and inside the standing-order write gate when the actor is a NurseInjector."
    roles: [NurseInjector, Physician]
    code: 200
    input: [expected_patient_version, pellets_wasted]
    output: Procedure
    side_effects:
      - "status moves SUPPLY_OPENED to COMPLETED"
      - "allocations split into CONSUMED and WASTED with wastage taken from the highest allocation_rank downward; a row straddling the boundary is split into a CONSUMED row (original id, reduced quantity) and a new WASTED row at the same allocation_rank"
      - "lot buckets move qty_reserved to qty_consumed and qty_wasted"
      - "delivered_total_mg, performed_at and charge_cents written"
      - "Patient.cumulative_mg counters, last_insertion_at and last_insertion_hormone_type updated"
      - "increments Patient.version by 1"
      - "increments Procedure.version by 1"

  - method: POST
    path: "/clinic/procedures/{id}/cancel"
    description: "Cancel a non-performed procedure. Computes the lead-time fee tier and the final refund settlement."
    roles: [FrontDesk, Physician, Patient]
    code: 200
    input: ["reason?"]
    output: Procedure
    side_effects:
      - "status moves to CANCELLED"
      - "from SCHEDULED or CONSENTED: RESERVED allocations move to RELEASED and quantities return to qty_on_hand"
      - "from SUPPLY_OPENED: OPENED allocations move to WASTED and quantities move to qty_wasted"
      - "from SUPPLY_HOLD: cancel_tier forced NONE and cancel_fee_cents 0"
      - "cancel_tier and cancel_fee_cents written by late_cancel_fee_cents"
      - "any FinancingPlan for this procedure in DRAFT, ACTIVE or DELINQUENT moves to CANCELLED with refunded_cents from refund_settlement_cents variant FINAL_SETTLEMENT"
      - "increments Procedure.version by 1"

  - method: POST
    path: "/clinic/procedures/{id}/void"
    description: "Void a completed procedure as a billing correction. Pellets stay consumed."
    roles: [Physician]
    code: 200
    input: [reason]
    output: Procedure
    side_effects:
      - "status moves COMPLETED to VOIDED"
      - "delivered_total_mg reset to 0 and the patient's cumulative counters and last_insertion fields recomputed"
      - "lot buckets are UNCHANGED"
      - "increments Patient.version by 1"
      - "increments Procedure.version by 1"

  - method: GET
    path: "/clinic/procedures/{id}/refund-quote"
    description: "Read-only optimistic refund quote under the PROVISIONAL_QUOTE variant."
    roles: [FrontDesk, Physician, Patient]
    code: 200
    input: []
    output: "{ procedure_id: string, variant: string, paid_to_date_cents: integer, cancel_tier: string, cancel_fee_cents: integer, wasted_pellet_charge_cents: integer, refund_cents: integer }"
    side_effects: []

  # ---------------------------- Injection visits ----------------------------
  - method: POST
    path: "/clinic/injection-visits"
    description: "Book a wellness injection visit. Runs both overlap rungs and the series-ownership rung."
    roles: [FrontDesk, NurseInjector, Physician]
    code: 201
    input: [patient_id, provider_id, standing_order_id, injection_type, room_code, scheduled_start, "series_pack_id?", "membership_id?"]
    output: InjectionVisit
    side_effects: ["scheduled_end set to scheduled_start + INJECTION_DURATION_MINUTES", "status set to SCHEDULED"]

  - method: GET
    path: "/clinic/injection-visits/{id}"
    description: "Read one injection visit."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: InjectionVisit
    side_effects: []

  - method: GET
    path: "/clinic/injection-visits"
    description: "List injection visits, filterable by every foreign key and by status."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "provider_id?", "standing_order_id?", "series_pack_id?", "membership_id?", "status?"]
    output: InjectionVisit[]
    side_effects: []

  - method: POST
    path: "/clinic/injection-visits/{id}/administer"
    description: "Administer the injection. Inside the standing-order write gate when the actor is a NurseInjector; resolves the payment source waterfall."
    roles: [NurseInjector, Physician]
    code: 200
    input: []
    output: InjectionVisit
    side_effects:
      - "status moves SCHEDULED to ADMINISTERED and administered_at is stamped"
      - "payment_source resolved by injection_payment_source"
      - "SERIES: pack remaining_visits decrements, redeemed_visits increments, series_debit_cents written, pack may move ACTIVE to EXHAUSTED; increments SeriesPack.version by 1"
      - "MEMBERSHIP_INCLUDED: Membership.included_visits_used increments and Membership.version increments by 1"
      - "SELF_PAY: charge_cents written"
      - "increments InjectionVisit.version by 1"

  - method: POST
    path: "/clinic/injection-visits/{id}/cancel"
    description: "Cancel a booked injection visit before administration."
    roles: [FrontDesk, Patient]
    code: 200
    input: ["reason?"]
    output: InjectionVisit
    side_effects: ["status moves SCHEDULED to CANCELLED", "no entitlement is drawn or returned", "increments InjectionVisit.version by 1"]

  - method: POST
    path: "/clinic/injection-visits/{id}/void"
    description: "Void an administered visit; the compensating action for the series entitlement invariant."
    roles: [Physician]
    code: 200
    input: [reason]
    output: InjectionVisit
    side_effects:
      - "status moves ADMINISTERED to VOIDED"
      - "SERIES: pack redeemed_visits decrements, remaining_visits increments, pack returns EXHAUSTED to ACTIVE when applicable; increments SeriesPack.version by 1"
      - "MEMBERSHIP_INCLUDED: Membership.included_visits_used decrements and Membership.version increments by 1"
      - "SELF_PAY: charge_cents reset to 0"
      - "increments InjectionVisit.version by 1"

  # ---------------------------- Memberships ----------------------------
  - method: POST
    path: "/clinic/memberships"
    description: "Enrol a patient in a membership tier."
    roles: [FrontDesk, ClinicAdmin]
    code: 201
    input: [patient_id, tier]
    output: Membership
    side_effects: ["monthly_fee_cents, discount_pct and included_visits_allowance derived from tier", "period_start stamped from the logical clock and period_end set to period_start + MEMBERSHIP_PERIOD_DAYS"]

  - method: GET
    path: "/clinic/memberships/{id}"
    description: "Read one membership."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, Patient]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/clinic/memberships"
    description: "List memberships, filterable by patient, tier and status."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "tier?", "status?"]
    output: Membership[]
    side_effects: []

  - method: POST
    path: "/clinic/memberships/{id}/pause"
    description: "Pause a membership and bank the prorated credit."
    roles: [FrontDesk, Patient]
    code: 200
    input: []
    output: Membership
    side_effects: ["status moves ACTIVE to PAUSED", "membership_pause_credit_cents steps 1 to 7 run", "paused_at stamped", "increments Membership.version by 1"]

  - method: POST
    path: "/clinic/memberships/{id}/resume"
    description: "Resume a paused membership, extend the period and apply the banked credit."
    roles: [FrontDesk, Patient]
    code: 200
    input: []
    output: Membership
    side_effects: ["status moves PAUSED to ACTIVE", "pause_days_used and period_end extended by the pause duration", "pause_credit_cents reduced by min(pause_credit_cents, monthly_fee_cents)", "increments Membership.version by 1"]

  - method: POST
    path: "/clinic/memberships/{id}/tier-change"
    description: "Move to a different tier. OCC-guarded on the Membership."
    roles: [FrontDesk, ClinicAdmin]
    code: 200
    input: [tier, expected_membership_version]
    output: Membership
    side_effects:
      - "tier, monthly_fee_cents, discount_pct and included_visits_allowance rewritten"
      - "included_visits_used reset to 0 and period_start restamped from the logical clock, with period_end set to period_start + MEMBERSHIP_PERIOD_DAYS"
      - "increments Membership.version by 1"

  - method: POST
    path: "/clinic/memberships/{id}/cancel"
    description: "Cancel a membership."
    roles: [FrontDesk, Patient]
    code: 200
    input: []
    output: Membership
    side_effects: ["status moves to CANCELLED", "from PAUSED: pause_credit_cents forfeited to 0", "increments Membership.version by 1"]

  # ---------------------------- Series packs ----------------------------
  - method: POST
    path: "/clinic/series-packs"
    description: "Sell an injection series pack; a non-transferable entitlement pool."
    roles: [FrontDesk, Patient]
    code: 201
    input: [patient_id, series_type]
    output: SeriesPack
    side_effects: ["price_cents, per_visit_value_cents, purchased_visits, remaining_visits and expires_at written by series_pack_price_cents"]

  - method: GET
    path: "/clinic/series-packs/{id}"
    description: "Read one series pack with all four entitlement buckets."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, Patient]
    code: 200
    input: []
    output: SeriesPack
    side_effects: []

  - method: GET
    path: "/clinic/series-packs"
    description: "List series packs, filterable by patient, type and status."
    roles: [ClinicAdmin, FrontDesk, Physician, NurseInjector, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "series_type?", "status?"]
    output: SeriesPack[]
    side_effects: []

  - method: POST
    path: "/clinic/series-packs/{id}/refund"
    description: "Buy back the unredeemed entitlements at the floored per-visit value."
    roles: [FrontDesk]
    code: 200
    input: ["reason?"]
    output: SeriesPack
    side_effects: ["status moves ACTIVE to REFUNDED", "refunded_visits absorbs remaining_visits which becomes 0", "refunded_cents written by series_refund_cents", "increments SeriesPack.version by 1"]

  # ---------------------------- Adverse events ----------------------------
  - method: POST
    path: "/clinic/adverse-events"
    description: "File an adverse event. Severity routes the response: MILD logs, MODERATE times a review, SEVERE fires the four-hop cascade."
    roles: [Physician, NurseInjector]
    code: 201
    input: [patient_id, reported_by_provider_id, severity, narrative, onset_at, "procedure_id?", "injection_visit_id?", "lot_id?", "standing_order_id?"]
    output: AdverseEvent
    side_effects:
      - "MILD: status OPEN, review_due_at null, no holds"
      - "MODERATE: status OPEN, review_due_at = now + MODERATE_REVIEW_DUE_DAYS, no holds"
      - "SEVERE hop 1: review_due_at = now + SEVERE_REVIEW_DUE_HOURS, Patient.clinical_hold set true, every ACTIVE ConsentRecord of that patient superseded, and any referenced RELEASED lot quarantined"
      - "SEVERE hop 2: the referenced StandingOrder moves ACTIVE to SUSPENDED"
      - "SEVERE hop 3: every Procedure under that order in SCHEDULED, CONSENTED or SUPPLY_OPENED moves to SUPPLY_HOLD"
      - "SEVERE hop 4: every RESERVED or OPENED allocation of those procedures moves to RELEASED with quantities returned to qty_on_hand"
      - "increments Patient.version by 1 for MODERATE and SEVERE"

  - method: GET
    path: "/clinic/adverse-events/{id}"
    description: "Read one adverse event."
    roles: [ClinicAdmin, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: []

  - method: GET
    path: "/clinic/adverse-events"
    description: "List adverse events, filterable by every foreign key plus severity, status and source."
    roles: [ClinicAdmin, Physician, NurseInjector, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "procedure_id?", "injection_visit_id?", "lot_id?", "standing_order_id?", "reported_by_provider_id?", "reviewed_by_provider_id?", "severity?", "status?", "source?"]
    output: AdverseEvent[]
    side_effects: []

  - method: POST
    path: "/clinic/adverse-events/{id}/review"
    description: "Physician review with segregation of duties. Disposition CLOSED or ESCALATED."
    roles: [Physician]
    code: 200
    input: [disposition, disposition_note]
    output: AdverseEvent
    side_effects:
      - "status moves OPEN to CLOSED or ESCALATED, or ESCALATED to CLOSED"
      - "reviewed_by_provider_id and disposition_note written"
      - "on reaching CLOSED with no remaining OPEN or ESCALATED SEVERE/SURVEILLANCE event for that patient: Patient.clinical_hold set false and Patient.version incremented by 1"
      - "increments AdverseEvent.version by 1"

  # ---------------------------- Financing ----------------------------
  - method: POST
    path: "/clinic/financing-plans"
    description: "Create a self-pay installment plan; builds the schedule with the residual on the final installment."
    roles: [FrontDesk]
    code: 201
    input: [patient_id, procedure_id, principal_cents, down_payment_cents, installment_count, first_due_date]
    output: FinancingPlan
    side_effects: ["schedule, outstanding_cents and status DRAFT written by financing_schedule_cents"]

  - method: GET
    path: "/clinic/financing-plans/{id}"
    description: "Read one financing plan including its full schedule array."
    roles: [ClinicAdmin, FrontDesk, Patient]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []

  - method: GET
    path: "/clinic/financing-plans"
    description: "List financing plans, filterable by patient, procedure and status."
    roles: [ClinicAdmin, FrontDesk, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "procedure_id?", "status?"]
    output: FinancingPlan[]
    side_effects: []

  - method: POST
    path: "/clinic/financing-plans/{id}/activate"
    description: "Make the schedule payable."
    roles: [FrontDesk]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: ["status moves DRAFT to ACTIVE", "increments FinancingPlan.version by 1"]

  - method: POST
    path: "/clinic/financing-plans/{id}/payments"
    description: "Pay one installment exactly. Cures delinquency when the last MISSED entry clears."
    roles: [FrontDesk, Patient]
    code: 200
    input: [installment_index, amount_cents]
    output: FinancingPlan
    side_effects:
      - "the addressed schedule entry moves to PAID; paid_installment_cents and outstanding_cents recomputed"
      - "DELINQUENT returns to ACTIVE when no MISSED entry remains; ACTIVE moves to PAID_OFF when outstanding_cents reaches 0"
      - "increments FinancingPlan.version by 1"

  - method: POST
    path: "/clinic/billing/delinquency-run"
    description: "Ops-run checkpoint. Phase 1 sweeps financing schedules and fires the default cascade; phase 2 ages notifications to OVERDUE."
    roles: [FrontDesk, ClinicAdmin]
    code: 200
    input: []
    output: "{ plans_scanned: integer, entries_missed: integer, plans_delinquent: integer, plans_defaulted: integer, patients_held: integer, procedures_held: integer, notifications_overdue: integer }"
    side_effects:
      - "phase 1: PENDING entries past due_date + FINANCING_GRACE_PERIOD_DAYS move to MISSED, each adding FINANCING_LATE_FEE_CENTS"
      - "phase 1: plans reach DELINQUENT or DEFAULTED by missed_count, and DEFAULTED fires the patient financial-hold cascade onto SCHEDULED procedures"
      - "phase 2: PENDING notifications past due_at move to OVERDUE"

  # ---------------------------- Notifications ----------------------------
  - method: GET
    path: "/clinic/patient-notifications/{id}"
    description: "Read one notification."
    roles: [ClinicAdmin, FrontDesk, ComplianceOfficer, Patient]
    code: 200
    input: []
    output: PatientNotification
    side_effects: []

  - method: GET
    path: "/clinic/patient-notifications"
    description: "List notifications; the reverse-reachability channel for every cascade-minted notification."
    roles: [ClinicAdmin, FrontDesk, ComplianceOfficer, Patient]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "procedure_id?", "lot_id?", "notification_type?", "status?"]
    output: PatientNotification[]
    side_effects: []

  - method: POST
    path: "/clinic/patient-notifications/{id}/acknowledge"
    description: "Acknowledge a recall, adverse-event or re-consent notification."
    roles: [FrontDesk, Patient]
    code: 200
    input: []
    output: PatientNotification
    side_effects: ["status moves PENDING or OVERDUE to ACKNOWLEDGED", "acknowledged_at stamped", "Patient.open_notification_count decremented and Patient.version incremented by 1", "increments PatientNotification.version by 1"]

  # ---------------------------- Logical clock ----------------------------
  - method: POST
    path: "/clinic/_clock/set_current_utc"
    description: "Move the server's logical UTC clock. Its startup default is exactly 2026-05-01T00:00:00Z and it never falls back to real wall-clock time."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["every subsequent rule that reads now uses the new instant"]

errors:
  # ---- authentication and authorisation ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or naming a role outside the seven declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "An entity_backed role addressed a row it does not own, or a physician acted on a standing order they did not author."
  - id: ERR_STANDING_ORDER_INVALID
    http: 403
    condition: "A NurseInjector attempted a gated administration under an order that is suspended, revoked, outside its validity window, out of scope for the hormone or injection type, or below the required dose ceiling."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The adverse-event reviewer is the reporter, or the physician closing an escalated event is the same one who escalated it."
  - id: ERR_SERIES_NOT_TRANSFERABLE
    http: 403
    condition: "A series pack was applied to an injection visit for a different patient."

  # ---- request shape ----
  - id: ERR_VALIDATION
    http: 400
    condition: "A required field is missing, of the wrong type, or outside its declared numeric bounds; or a pagination parameter is out of range."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum-valued input field carried a value outside its declared member set; see the exhaustive field list at validation priority 5."

  # ---- existence ----
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "A patient_id in the path or body does not resolve."
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "A provider_id, physician_id, published_by_provider_id or reported_by_provider_id does not resolve."
  - id: ERR_PROTOCOL_NOT_FOUND
    http: 404
    condition: "A protocol id in the path does not resolve."
  - id: ERR_CONSENT_NOT_FOUND
    http: 404
    condition: "A consent id in the path, or a consent_record_id in the body, does not resolve."
  - id: ERR_CONSULT_NOT_FOUND
    http: 404
    condition: "A consult id in the path, or a consult_id in the body, does not resolve."
  - id: ERR_LAB_PANEL_NOT_FOUND
    http: 404
    condition: "A lab panel id in the path, or a lab_panel_id in the body, does not resolve."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "A pellet lot id in the path, or a lot_id in the body, does not resolve."
  - id: ERR_STANDING_ORDER_NOT_FOUND
    http: 404
    condition: "A standing order id in the path, or a standing_order_id in the body, does not resolve."
  - id: ERR_PROCEDURE_NOT_FOUND
    http: 404
    condition: "A procedure id in the path, or a procedure_id in the body, does not resolve."
  - id: ERR_INJECTION_VISIT_NOT_FOUND
    http: 404
    condition: "An injection visit id in the path, or an injection_visit_id in the body, does not resolve."
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "A membership id in the path, or a membership_id in the body, does not resolve."
  - id: ERR_SERIES_PACK_NOT_FOUND
    http: 404
    condition: "A series pack id in the path, or a series_pack_id in the body, does not resolve."
  - id: ERR_ADVERSE_EVENT_NOT_FOUND
    http: 404
    condition: "An adverse event id in the path does not resolve."
  - id: ERR_FINANCING_PLAN_NOT_FOUND
    http: 404
    condition: "A financing plan id in the path does not resolve."
  - id: ERR_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "A patient notification id in the path does not resolve."

  # ---- state and concurrency ----
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition is not declared from the target row's current state on the relevant axis."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target row is already in a terminal state for the axis being moved."
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal Patient.version at perform time."
  - id: ERR_STALE_PROCEDURE_VERSION
    http: 412
    condition: "expected_procedure_version does not equal Procedure.version at allocation time."
  - id: ERR_STALE_MEMBERSHIP_VERSION
    http: 412
    condition: "expected_membership_version does not equal Membership.version at tier-change time."

  # ---- clinical safety ----
  - id: ERR_PATIENT_CLINICAL_HOLD
    http: 409
    condition: "Patient.clinical_hold is true when scheduling, performing or administering."
  - id: ERR_CRITICAL_LAB_UNACKNOWLEDGED
    http: 409
    condition: "The patient holds a LabPanel in status CRITICAL_FLAGGED that no physician has acknowledged."
  - id: ERR_CONSENT_REQUIRED
    http: 409
    condition: "No ACTIVE consent covering this patient, hormone and current protocol version is attached."
  - id: ERR_CONSENT_DOSE_EXCEEDED
    http: 422
    condition: "The attached consent's consented_max_dose_mg is below the procedure's planned_total_mg."
  - id: ERR_SAFETY_CEILING_EXCEEDED
    http: 422
    condition: "The patient's most recent non-superseded HEMATOCRIT panel exceeds HEMATOCRIT_SAFETY_CEILING."
  - id: ERR_DOSE_CAP_EXCEEDED
    http: 422
    condition: "planned_total_mg exceeds the per-procedure cap for the hormone type."
  - id: ERR_ROLLING_MG_CAP_EXCEEDED
    http: 422
    condition: "The rolling 365-day exposure plus this procedure's milligrams exceeds the hormone's rolling cap, under whichever rolling_mg_exposure variant the endpoint uses."

  # ---- re-dose gate ----
  - id: ERR_LAB_STALE
    http: 422
    condition: "The supporting lab panel is more than LAB_MAX_AGE_DAYS old and cannot support a re-dose decision."
  - id: ERR_TROUGH_WINDOW_VIOLATION
    http: 422
    condition: "The supporting panel was not a trough draw, or was drawn outside the inclusive trough window for the hormone."
  - id: ERR_REDOSE_INTERVAL_NOT_MET
    http: 422
    condition: "Fewer than the minimum days separate the last completed insertion of the same hormone from the requested slot, or there is no such insertion at all."
  - id: ERR_ANALYTE_NOT_BELOW_OPTIMAL
    http: 422
    condition: "The supporting panel is not the hormone's primary analyte, or its clinic_optimal_band is not BELOW_OPTIMAL."
  - id: ERR_SYMPTOM_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "The consult's symptom_score is below REDOSE_MIN_SYMPTOM_SCORE."

  # ---- scheduling ----
  - id: ERR_POST_INSERTION_RESTRICTION
    http: 409
    condition: "The requested slot falls strictly inside the POST_INSERTION_RESTRICTION_DAYS window after the patient's last insertion of any hormone."
  - id: ERR_PROVIDER_SLOT_CONFLICT
    http: 409
    condition: "The provider's buffer-expanded interval overlaps an existing occupying booking."
  - id: ERR_ROOM_CONFLICT
    http: 409
    condition: "The room's raw half-open interval overlaps an existing occupying booking."

  # ---- inventory ----
  - id: ERR_LOT_NOT_ELIGIBLE
    http: 409
    condition: "A lot's strength_mg is not a member of the pellet ladder for its hormone_type."
  - id: ERR_INSUFFICIENT_PELLET_INVENTORY
    http: 409
    condition: "The FEFO walk cannot satisfy one of the strength legs, including the empty-candidate-set case."

  # ---- entitlement pools ----
  - id: ERR_SERIES_EXPIRED
    http: 409
    condition: "The series pack is past expires_at. On the first such attempt the forfeiture side effect commits before this error is raised."
  - id: ERR_SERIES_EXHAUSTED
    http: 409
    condition: "The series pack has no remaining_visits."
  - id: ERR_DUPLICATE_ACTIVE_MEMBERSHIP
    http: 409
    condition: "The patient already holds a Membership in status ACTIVE or PAUSED."
  - id: ERR_PAUSE_LIMIT_EXCEEDED
    http: 422
    condition: "Resuming would push pause_days_used past MAX_PAUSE_DAYS_PER_YEAR; nothing is mutated."

  # ---- fiscal ----
  - id: ERR_DOWN_PAYMENT_TOO_LOW
    http: 422
    condition: "down_payment_cents is below the minimum percentage of principal, or is not strictly less than principal."
  - id: ERR_INSTALLMENT_COUNT_INVALID
    http: 422
    condition: "installment_count falls outside FINANCING_MIN_INSTALLMENTS to FINANCING_MAX_INSTALLMENTS."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "The payment amount does not exactly match the addressed installment, or that installment is not PENDING or MISSED."
  - id: ERR_PATIENT_FINANCIAL_HOLD
    http: 402
    condition: "Patient.financial_hold is true when scheduling or performing a procedure."

roles:
  - name: ClinicAdmin
    description: "Clinic operations administrator: onboards providers, publishes protocols, drives the ops run, moves the logical clock and clears financial holds."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinic/providers"
