  - rule_id: transitive_cascade
    instances:

      - name: action_plan_supersede_four_hop_cascade
        grounds:
          - state_machines.ActionPlan.PENDING_PROVIDER_to_ACTIVE
          - state_machines.ActionPlan.ACTIVE_to_SUPERSEDED
          - state_machines.MedicationAuthorization.VERIFIED_to_SUSPENDED
          - state_machines.AdministrationRecord.PREPARED_to_VOIDED
          - calculations.school_days_of_supply
          - calculations.lot_unit_conservation
          - entities.ActionPlan.fields.supersedes_action_plan_id
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /health-office/action-plans/{id}/decision
          with decision = APPROVE: approving plan P2 supersedes P1 (hop 1); BECAUSE
          P1 left ACTIVE its linked authorisation is SUSPENDED (hop 2); BECAUSE that
          authorisation left VERIFIED its PREPARED AdministrationRecord is VOIDED
          and its reservation released (hop 3); BECAUSE those units returned, the
          lot's days_of_supply and the School's albuterol_days_of_supply are
          recomputed from 3.33 back to 4.17 (hop 4). Each link is caused by the
          previous link, not by the approval itself.
        test_recipe:
          setup:
            - "School EDI06 with one RN on an ACTIVE Monday block and one ENROLLED student (ANAPHYLAXIS + ASTHMA, COMPLIANT, intake_risk_score 50)."
            - "One AVAILABLE student-specific ALBUTEROL lot of 5 units (is_stock_protocol false), days_of_supply 4.17."
            - "ActionPlan P1 for condition ASTHMA is ACTIVE; MedicationAuthorization A hangs off P1 with consent_status CONSENT_GRANTED and clinical_status VERIFIED."
            - "An IN_ASSESSMENT HealthVisit holds one PREPARED AdministrationRecord of 1 unit drawn from that lot, so lot quantity_on_hand is 4 / quantity_reserved 1 and days_of_supply is 3.33."
            - "ActionPlan P2 names P1 in supersedes_action_plan_id and sits at PENDING_PROVIDER with guardian consent recorded."
