scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (4 instances, 4 different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_day_count_methods_diverge
        grounds:
          - calculations.closing_proration
          - entities.ProrationStatement.fields.day_count_method
          - entities.ProrationLine.fields.amount_cents
        distinguishing_aspect: |
          Identical unit/lease/closing data prorated under ACTUAL_365 vs
          BANKERS_30_360 yields different RENT line amounts (93708 vs 95000
          cents): the dual variants live in the proration domain
          (ProrationStatement/ProrationLine).
        test_recipe:
          setup:
            - "Acquisition (price 200000000, closing 2026-09-12, ratio 0.40, millage 25.0, prior tax 1800000) kicked off"
            - "Unit 1A with audited-clean lease (contract rent 150000, deposit 150000, start 2025-09-01), rent roll matching (variance 0)"
            - "Walk QA_ACCEPTED with no findings; deposit reconciled (stated 153090 = 150000 + 3090 DAILY_ACCRUAL interest); unit VERIFIED; diligence complete"
            - "APPROVED price-anchored tax projection (annual tax 2000000)"
            - "DRAFT_CLOSING statement generated with ACTUAL_365"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Harbor View", address: "1 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit}", reported_resident_name: "R One", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 153090, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 4, no_findings_declared: true }, as: PropertyOperationsLead, as_user_id: "pol-1" }
            - { call: "POST /acquisitions/inspections/${insp}/qa-accept", payload: {}, as: PropertyOperationsLead, as_user_id: "pol-2" }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease}", seller_stated_amount_cents: 153090, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep: $.data.id } }
            - { call: "POST /acquisitions/deposits/${dep}/reconcile", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/${acq}/complete-diligence", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v1: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { proj: $.data.id } }
            - { call: "POST /acquisitions/tax-projections/${proj}/compute", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/tax-projections/${proj}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v2: $.data.version } }
            - { call: "POST /acquisitions/${acq}/proration-statements", payload: { statement_type: "DRAFT_CLOSING", day_count_method: "ACTUAL_365", expected_acquisition_version: "${acq_v2}" }, as: UnderwritingManager, as_user_id: "um-1", captures: { stmt_a: $.data.id } }
          trigger:
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v3: $.data.version } }
            - { call: "POST /acquisitions/${acq}/proration-statements", payload: { statement_type: "DRAFT_CLOSING", day_count_method: "BANKERS_30_360", expected_acquisition_version: "${acq_v3}" }, as: UnderwritingManager, as_user_id: "um-1", captures: { stmt_b: $.data.id } }
            - { call: "GET /acquisitions/proration-statements/${stmt_a}/lines", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { rent_a: $.data.0.amount_cents, tax_a: $.data.1.amount_cents } }
            - { call: "GET /acquisitions/proration-statements/${stmt_b}/lines", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { rent_b: $.data.0.amount_cents, tax_b: $.data.1.amount_cents } }
          assert:
            - "ACTUAL_365 RENT line amount_cents == 93708 (daily round_half_up(150000*12/365)=4932 x buyer_days 19 covering Sep 12..30 inclusive)"
            - "BANKERS_30_360 RENT line amount_cents == 95000 (daily 150000/30=5000 x buyer_days 30-12+1=19)"
            - "The two variants differ by exactly 1292 cents on identical data"
            - "TAX line is identical under both methods: 1391781 cents (round_half_up(2000000*254/365))"

      - name: tax_projection_methods_diverge
        grounds:
          - calculations.tax_reassessment_projection
          - state_machines.TaxReassessmentProjection.DRAFT_to_COMPUTED
        distinguishing_aspect: |
          On one acquisition, PURCHASE_PRICE_ANCHORED concludes annual tax
          2000000 cents while INCOME_APPROACH concludes 3000000 cents: dual
          variants in the tax-projection domain (different entity domain from
          the proration instance).
        test_recipe:
          setup:
            - "Acquisition with price 200000000, assessment_ratio 0.40, millage_rate 25.0, prior_year_tax 1800000"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Harbor View", address: "1 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id, acq_v1: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { proj_p: $.data.id } }
            - { call: "POST /acquisitions/tax-projections/${proj_p}/compute", payload: {}, as: AcquisitionsAnalyst }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: AcquisitionsAnalyst, captures: { acq_v2: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "INCOME_APPROACH", cap_rate: 0.055, noi_t12_cents: 16500000, expected_acquisition_version: "${acq_v2}" }, as: AcquisitionsAnalyst, captures: { proj_i: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/tax-projections/${proj_i}/compute", payload: {}, as: AcquisitionsAnalyst }
            - { call: "GET /acquisitions/tax-projections/${proj_p}", payload: {}, as: AcquisitionsAnalyst, captures: { p_assessed: $.data.projected_assessed_value_cents, p_tax: $.data.projected_annual_tax_cents, p_delta: $.data.delta_vs_prior_cents } }
            - { call: "GET /acquisitions/tax-projections/${proj_i}", payload: {}, as: AcquisitionsAnalyst, captures: { i_value: $.data.projected_value_cents, i_assessed: $.data.projected_assessed_value_cents, i_tax: $.data.projected_annual_tax_cents, i_delta: $.data.delta_vs_prior_cents } }
          assert:
            - "PURCHASE_PRICE_ANCHORED: assessed == 80000000, annual tax == 2000000, delta_vs_prior == 200000"
            - "INCOME_APPROACH: value == 300000000 (round(16500000/0.055)), assessed == 120000000, annual tax == 3000000, delta_vs_prior == 1200000"
            - "Same acquisition data, two variants, tax differs by exactly 1000000 cents"

      - name: deposit_interest_methods_diverge
        grounds:
          - calculations.deposit_interest_accrual
          - entities.Acquisition.fields.interest_accrual_method
        distinguishing_aspect: |
          Identical lease/deposit inputs accrue 3090 cents under DAILY_ACCRUAL
          vs 3000 cents under SIMPLE_ANNUAL: dual variants in the security-
          deposit domain (third distinct entity domain).
        test_recipe:
          setup:
            - "Acquisition A (DAILY_ACCRUAL) and acquisition B (SIMPLE_ANNUAL), both closing 2026-09-12"
            - "Each has one unit with audited lease (deposit 150000, start 2025-09-01, 376 days at closing) and a RECORDED deposit (stated 150000, rate 0.02)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Daily Deal", address: "1 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000, interest_accrual_method: "DAILY_ACCRUAL" }, as: AcquisitionsAnalyst, captures: { acq_a: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq_a}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit_a: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit_a}", resident_name: "R A", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease_a: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit_a}", reported_resident_name: "R A", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 150000, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease_a}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease_a}", seller_stated_amount_cents: 150000, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep_a: $.data.id } }
            - { call: "POST /acquisitions", payload: { property_name: "Simple Deal", address: "2 Main St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000, interest_accrual_method: "SIMPLE_ANNUAL" }, as: AcquisitionsAnalyst, captures: { acq_b: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq_b}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit_b: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit_b}", resident_name: "R B", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease_b: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit_b}", reported_resident_name: "R B", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 150000, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease_b}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease_b}", seller_stated_amount_cents: 150000, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep_b: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/deposits/${dep_a}/reconcile", payload: {}, as: AcquisitionsAnalyst, captures: { int_a: $.data.accrued_interest_cents, var_a: $.data.variance_cents } }
            - { call: "POST /acquisitions/deposits/${dep_b}/reconcile", payload: {}, as: AcquisitionsAnalyst, captures: { int_b: $.data.accrued_interest_cents, var_b: $.data.variance_cents } }
          assert:
            - "DAILY_ACCRUAL accrued_interest_cents == 3090 (round_half_up(150000*0.02*376/365)); variance == 3090; status DISPUTED"
            - "SIMPLE_ANNUAL accrued_interest_cents == 3000 (floor(376/365)=1 whole year); variance == 3000; status DISPUTED"
            - "Identical inputs diverge by exactly 90 cents across the two variants"

      - name: maintenance_estimate_basis_divergence
        grounds:
          - calculations.deferred_maintenance_rollup
          - entities.Acquisition.fields.maintenance_estimate_basis
          - entities.DeficiencyFinding.fields.verified_cost_cents
        distinguishing_aspect: |
          One VERIFIED finding costs 28015000 cents under INSPECTOR_BASIS and
          25215000 under SELLER_BASIS: dual variants in the deferred-maintenance
          rollup domain (fourth distinct entity domain), switched by PATCHing
          the acquisition basis.
        test_recipe:
          setup:
            - "Acquisition (price 1000000000) IN_DILIGENCE with one unit, one COMPLETED inspection, one VERIFIED finding (LIFE_SAFETY, severity 5, seller 18000000, inspector 20000000)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Big Deal", address: "9 Oak Ave", agreed_purchase_price_cents: 1000000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 2, no_findings_declared: false }, as: PropertyOperationsLead, as_user_id: "pol-1" }
            - { call: "POST /acquisitions/findings", payload: { inspection_id: "${insp}", category: "LIFE_SAFETY", severity: 5, seller_estimate_cents: 18000000, inspector_estimate_cents: 20000000 }, as: PropertyOperationsLead, captures: { f1: $.data.id } }
            - { call: "POST /acquisitions/findings/${f1}/verify", payload: {}, as: PropertyOperationsLead, captures: { cost_before: $.data.verified_cost_cents } }
          trigger:
            - { call: "PATCH /acquisitions/${acq}", payload: { maintenance_estimate_basis: "SELLER_BASIS" }, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/inspections/${insp}/findings", payload: {}, as: PropertyOperationsLead, captures: { cost_after: $.data.0.verified_cost_cents } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { rollup_after: $.data.deferred_maintenance_total_cents } }
          assert:
            - "Before PATCH: verified_cost_cents == 28015000 (round(20000000*1.40)+15000) under default INSPECTOR_BASIS"
            - "After PATCH: verified_cost_cents == 25215000 (round(18000000*1.40)+15000) under SELLER_BASIS"
            - "Acquisition.deferred_maintenance_total_cents re-derived to 25215000"
            - "The basis variant switch changes the rollup by exactly 2800000 cents with zero new findings"
  # ===================================================================
  # Rule 2 — combinatorial_formula (3 instances, modes a, b, c)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deferred_maintenance_tiered_rollup_mode_a
        grounds:
          - calculations.deferred_maintenance_rollup
          - calculations.posture_derivation
          - entities.DeficiencyFinding.fields.severity
        distinguishing_aspect: |
          Mode (a): verified_cost combines three inputs (estimate base,
          severity-tier multiplier, flat category loading) with non-linear
          tier jumps (1.00/1.15/1.25/1.40), and the rollup crosses the 3% then
          5% posture thresholds as findings verify.
        test_recipe:
          setup:
            - "Acquisition price 1000000000 (3% threshold = 30000000, 5% = 50000000), IN_DILIGENCE"
            - "One unit; one COMPLETED inspection (no_findings_declared false)"
            - "Findings created: f1 LIFE_SAFETY sev5 inspector 20000000; f2 MAJOR_SYSTEMS sev4 inspector 5000000; f3 LIFE_SAFETY sev5 inspector 12000000"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Big Deal", address: "9 Oak Ave", agreed_purchase_price_cents: 1000000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 2, no_findings_declared: false }, as: PropertyOperationsLead, as_user_id: "pol-1" }
            - { call: "POST /acquisitions/findings", payload: { inspection_id: "${insp}", category: "LIFE_SAFETY", severity: 5, seller_estimate_cents: 18000000, inspector_estimate_cents: 20000000 }, as: PropertyOperationsLead, captures: { f1: $.data.id } }
            - { call: "POST /acquisitions/findings", payload: { inspection_id: "${insp}", category: "MAJOR_SYSTEMS", severity: 4, seller_estimate_cents: 4800000, inspector_estimate_cents: 5000000 }, as: PropertyOperationsLead, captures: { f2: $.data.id } }
            - { call: "POST /acquisitions/findings", payload: { inspection_id: "${insp}", category: "LIFE_SAFETY", severity: 5, seller_estimate_cents: 11000000, inspector_estimate_cents: 12000000 }, as: PropertyOperationsLead, captures: { f3: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/findings/${f1}/verify", payload: {}, as: PropertyOperationsLead, captures: { c1: $.data.verified_cost_cents } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: PropertyOperationsLead, captures: { tot1: $.data.deferred_maintenance_total_cents, post1: $.data.readiness_posture } }
            - { call: "POST /acquisitions/findings/${f2}/verify", payload: {}, as: PropertyOperationsLead, captures: { c2: $.data.verified_cost_cents } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: PropertyOperationsLead, captures: { tot2: $.data.deferred_maintenance_total_cents, post2: $.data.readiness_posture } }
            - { call: "POST /acquisitions/findings/${f3}/verify", payload: {}, as: PropertyOperationsLead, captures: { c3: $.data.verified_cost_cents } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: PropertyOperationsLead, captures: { tot3: $.data.deferred_maintenance_total_cents, post3: $.data.readiness_posture } }
          assert:
            - "f1 verified_cost_cents == 28015000 (round(20000000 x 1.40) + 15000 LIFE_SAFETY loading)"
            - "After f1: total == 28015000 and posture == ON_TRACK (28015000 <= 30000000)"
            - "f2 verified_cost_cents == 6250000 (round(5000000 x 1.25) + 0)"
            - "After f2: total == 34265000 and posture == AT_RISK (crossed 3% but not 5%)"
            - "f3 verified_cost_cents == 16815000 (round(12000000 x 1.40) + 15000)"
            - "After f3: total == 51080000 and posture == BLOCKED (crossed 5%)"

      - name: proration_rounding_order_pinned_mode_b
        grounds:
          - calculations.closing_proration
        distinguishing_aspect: |
          Mode (b): nested rounding — the daily rate is rounded to cents BEFORE
          multiplying by days (per-line-then-sum). Rent 75005 gives daily 2466
          and line 46854; the forbidden sum-then-round order would give 46852.
          The scaffold pins the per-line order; a 2-cent gap discriminates.
        test_recipe:
          setup:
            - "Acquisition (price 200000000, closing 2026-09-12) with one VERIFIED unit: lease rent 75005, deposit 100000; rent roll matches (75005); deposit stated 102060 (= 100000 + 2060 interest) reconciled"
            - "APPROVED price-anchored tax projection (2000000 annual); diligence complete"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Rounding Deal", address: "3 Elm St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 80000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 75005, term_months: 12, deposit_amount_cents: 100000 }, as: AcquisitionsAnalyst, captures: { lease: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit}", reported_resident_name: "R One", reported_rent_cents: 75005, reported_concession_cents: 0, reported_deposit_cents: 102060, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 4, no_findings_declared: true }, as: PropertyOperationsLead, as_user_id: "pol-1" }
            - { call: "POST /acquisitions/inspections/${insp}/qa-accept", payload: {}, as: PropertyOperationsLead, as_user_id: "pol-2" }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease}", seller_stated_amount_cents: 102060, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep: $.data.id } }
            - { call: "POST /acquisitions/deposits/${dep}/reconcile", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/${acq}/complete-diligence", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v1: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { proj: $.data.id } }
            - { call: "POST /acquisitions/tax-projections/${proj}/compute", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/tax-projections/${proj}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v2: $.data.version } }
          trigger:
            - { call: "POST /acquisitions/${acq}/proration-statements", payload: { statement_type: "DRAFT_CLOSING", day_count_method: "ACTUAL_365", expected_acquisition_version: "${acq_v2}" }, as: UnderwritingManager, as_user_id: "um-1", captures: { stmt: $.data.id } }
            - { call: "GET /acquisitions/proration-statements/${stmt}/lines", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { rent_line: $.data.0.amount_cents, tax_line: $.data.1.amount_cents } }
            - { call: "GET /acquisitions/proration-statements/${stmt}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { buyer_total: $.data.total_buyer_credits_cents, net: $.data.net_amount_cents } }
          assert:
            - "RENT line == 46854: daily round_half_up(75005*12/365) = 2466 first, then 2466 x 19 days"
            - "RENT line MUST NOT be 46852 (the sum-then-round order is forbidden)"
            - "TAX line == 1391781"
            - "total_buyer_credits_cents == 1438635 and net_amount_cents == 1438635 (exact sums of rounded lines)"

      - name: tax_income_approach_pinned_evaluation_order_mode_c
        grounds:
          - calculations.tax_reassessment_projection
          - entities.TaxReassessmentProjection.fields.noi_t12_cents
        distinguishing_aspect: |
          Mode (c): the circular-looking dependency (value = NOI/cap, tax =
          f(value), but NOI contains tax expense) is broken by a pinned one-pass
          order: NOI uses PRIOR-year tax (1800000) and the projected tax
          (3000000) never feeds back; an implementation that re-derives NOI
          with the projected tax produces a different value.
        test_recipe:
          setup:
            - "Acquisition price 200000000, ratio 0.40, millage 25.0, prior_year_tax 1800000"
            - "INCOME_APPROACH projection with noi_t12_cents 16500000, cap_rate 0.055"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Circular Deal", address: "5 Pine St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id, acq_v1: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "INCOME_APPROACH", cap_rate: 0.055, noi_t12_cents: 16500000, expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { proj: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/tax-projections/${proj}/compute", payload: {}, as: AcquisitionsAnalyst, captures: { val: $.data.projected_value_cents, assessed: $.data.projected_assessed_value_cents, tax: $.data.projected_annual_tax_cents, delta: $.data.delta_vs_prior_cents } }
          assert:
            - "projected_value_cents == 300000000 (round_half_up(16500000 / 0.055), one pass)"
            - "projected_assessed_value_cents == 120000000 (round_half_up(300000000 x 0.40))"
            - "projected_annual_tax_cents == 3000000 (round_half_up(120000000 x 25.0 / 1000))"
            - "delta_vs_prior_cents == 1200000"
            - "A feedback implementation (NOI minus projected tax, re-solve) would conclude a lower value; the pinned order forbids it"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (3 instances, different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_file_reflag_cycle
        grounds:
          - state_machines.LeaseFile.RESOLVED_to_DISCREPANCY_FLAGGED
          - state_machines.LeaseFile.DISCREPANCY_FLAGGED_to_RESOLVED
        distinguishing_aspect: |
          LeaseFile cycles RESOLVED -> DISCREPANCY_FLAGGED -> RESOLVED on new
          evidence (revision loop, not a pipeline); each pass re-drives the
          rent-roll verification status and the acquisition open-variance sum.
        test_recipe:
          setup:
            - "Acquisition IN_DILIGENCE; unit with lease (contract 150000) and rent roll (reported 152000); audit auto-flags (variance 2000 >= 500)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Cycle Deal", address: "7 Birch St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit}", reported_resident_name: "R One", reported_rent_cents: 152000, reported_concession_cents: 0, reported_deposit_cents: 150000, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease}/audit", payload: {}, as: AcquisitionsAnalyst, captures: { st0: $.data.status } }
          trigger:
            - { call: "POST /acquisitions/lease-files/${lease}/resolve", payload: { resolution_note: "seller confirmed lease amendment" }, as: AcquisitionsAnalyst, captures: { st1: $.data.status } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: AcquisitionsAnalyst, captures: { var1: $.data.rent_roll_variance_cents, post1: $.data.readiness_posture } }
            - { call: "POST /acquisitions/lease-files/${lease}/flag", payload: { reason: "amendment not countersigned" }, as: AcquisitionsAnalyst, captures: { st2: $.data.status } }
            - { call: "GET /acquisitions/units/${unit}/rent-roll-entries", payload: {}, as: AcquisitionsAnalyst, captures: { rr2: $.data.0.verification_status } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: AcquisitionsAnalyst, captures: { var2: $.data.rent_roll_variance_cents, post2: $.data.readiness_posture } }
            - { call: "POST /acquisitions/lease-files/${lease}/resolve", payload: { resolution_note: "countersigned copy received" }, as: AcquisitionsAnalyst, captures: { st3: $.data.status } }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: AcquisitionsAnalyst, captures: { var3: $.data.rent_roll_variance_cents } }
          assert:
            - "After audit: status == DISCREPANCY_FLAGGED (variance 2000 >= 500 threshold), rent_roll_variance_cents == 2000, posture BLOCKED"
            - "After first resolve: status == RESOLVED, rent_roll_variance_cents == 0, posture ON_TRACK"
            - "After re-flag from RESOLVED: status == DISCREPANCY_FLAGGED again, rent roll entry == MISMATCHED, rent_roll_variance_cents == 2000, posture BLOCKED"
            - "After second resolve: status == RESOLVED, rent_roll_variance_cents == 0 — the loop is repeatable"

      - name: inspection_qa_reject_reschedule_cycle
        grounds:
          - state_machines.UnitWalkInspection.QA_REJECTED_to_SCHEDULED
          - state_machines.UnitWalkInspection.COMPLETED_to_QA_REJECTED
        distinguishing_aspect: |
          UnitWalkInspection loops COMPLETED -> QA_REJECTED -> SCHEDULED ->
          COMPLETED -> QA_ACCEPTED with reschedule_count incrementing and the
          completion fields cleared — a QA revision cycle on a different entity
          than the lease loop.
        test_recipe:
          setup:
            - "Acquisition IN_DILIGENCE; unit; one SCHEDULED inspection (insp-1, 2026-08-10 09:00-10:00)"
          setup_api_calls:
