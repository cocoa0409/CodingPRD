# =============================================================================
# PRD Benchmark Scaffold — Independent Dealer Territory, Parts Commitments
# & Rebuild Programs
# =============================================================================

scenario: |
  Independent Dealer Territory, Parts Commitments & Rebuild Programs (Caterpillar):
  dealer territory assignment with exclusive representation and performance
  expectations, parts availability commitments requiring stocking levels and
  emergency order fulfillment within hours, remanufactured and rebuild programs
  with core return credits and certified rebuild specifications, machine
  population tracking to forecast parts and service demand, dealer service
  technician certification and tooling requirements by product family, equipment
  financing and used equipment remarketing coordination, product support
  agreements bundling maintenance with machine sales, dealer performance review
  with market share and customer loyalty measures

domain_name: dealer-territory-parts-support
api_prefix: /dealer-network

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate / threshold triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the independent dealer"
        constraints: "required; unique per territory_code (explicit SET comparison, case-sensitive)"
      - name: home_state_code
        type: string
        source: input
        description: "Two-letter home state of the dealership"
      - name: territory_code
        type: string
        source: input
        description: "Territory the dealership is assigned to; immutable after creation"
        constraints: "required"
      - name: status
        type: enum
        source: system
        default: "PENDING_AGREEMENT"
        description: "PENDING_AGREEMENT | ACTIVE | SUSPENDED | TERMINATED — PENDING_AGREEMENT until the dealer holds at least one DealerAgreement in STORE_READY; TERMINATED is terminal"
        constraints: "enum members: PENDING_AGREEMENT, ACTIVE, SUSPENDED, TERMINATED"
      - name: certified_family_count
        type: integer
        source: computed
        default: 0
        description: "Count of distinct product_family values for which this dealer holds a CertificationRecord in status ACTIVE"
      - name: trusted_commitment_count
        type: integer
        source: computed
        default: 0
        description: "Count of DealerAgreement rows for this dealer whose trusted_commitment flag is true"
      - name: open_backorder_units
        type: integer
        source: computed
        default: 0
        description: "Sum of unfilled_units across PartsOrderBatch rows whose PartsCommitment belongs to this dealer and whose status is OPEN or CORE_PENDING"
      - name: market_share_pct
        type: number
        source: computed
        default: 0.0
        description: "Latest PerformanceReview.actual_market_share_pct across this dealer's reviews; 0.0 when no review has been evaluated"

  - name: DealerAgreement
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer this agreement assigns territory to"
      - name: product_family
        type: enum
        source: input
        description: "Machine family the agreement covers; immutable after creation"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: territory_code
        type: string
        source: input
        description: "Territory code; must equal the owning Dealer's territory_code for EXCLUSIVE agreements"
      - name: exclusivity_level
        type: enum
        source: input
        default: "SHARED"
        description: "EXCLUSIVE | SHARED — EXCLUSIVE asserts sole representation inside the territory for this product family over [start_at, end_at)"
        constraints: "enum members: EXCLUSIVE, SHARED"
      - name: start_at
        type: datetime
        source: input
        description: "Inclusive start of the representation interval"
      - name: end_at
        type: datetime
        source: input
        description: "Exclusive end of the representation interval; must be strictly after start_at"
      - name: status
        type: enum
        source: system
        default: "DRAFT"
        description: "DRAFT | SUBMITTED | ACTIVE | SUSPENDED | TERMINATED"
        constraints: "enum members: DRAFT, SUBMITTED, ACTIVE, SUSPENDED, TERMINATED"
      - name: performance_plan_share_pct
        type: number
        source: input
        description: "Planned territory market-share percentage the dealer commits to, in percent points [0, 100]"
      - name: performance_actual_share_pct
        type: number
        source: computed
        default: 0.0
        description: "Actual territory share percent from the most recently EVALUATED PerformanceReview for this agreement (created_at ASC, id-tie-free); 0.0 before the first evaluation"
      - name: certified_technician_count
        type: integer
        source: computed
        default: 0
        description: "Distinct technician_name values in CertificationRecord rows with status ACTIVE for this dealer and this product_family"
      - name: tooling_compliance_status
        type: enum
        source: system
        default: "NOT_SUBMITTED"
        description: "NOT_SUBMITTED while the agreement holds no CertificationRecord at all, PARTIAL while certified_technician_count is below the product family minimum of 2, COMPLIANT once it reaches 2; COMPLIANT also requires the product family's tooling kit registration to be present"
        constraints: "enum members: NOT_SUBMITTED, PARTIAL, COMPLIANT"
      - name: trusted_commitment
        type: boolean
        source: computed
        default: false
        description: "true only when tooling_compliance_status == COMPLIANT and a PartsCommitment for this agreement exists with status ORDER_READY"
      - name: closed_at
        type: datetime
        source: system
        description: "Stamp written when the agreement reaches TERMINATED; superseded agreements retain their terminal stamp and are superseded by the successor row"

  - name: PerformanceReview
    parent: null
    common_fields: false
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer under review"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> DealerAgreement.id; the agreement whose product family is under review"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the review period"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the review period; must be strictly after period_start"
      - name: status
        type: enum
        source: system
        default: "DRAFT"
        description: "DRAFT | RESULTS_RECORDED | REMEDIATION_REQUIRED | CIRCUMSTANCE_PENDING | EVALUATED"
        constraints: "enum members: DRAFT, RESULTS_RECORDED, REMEDIATION_REQUIRED, CIRCUMSTANCE_PENDING, EVALUATED"
      - name: actual_territory_machine_units
        type: integer
        source: input
        description: "Machine units this dealer placed in the territory during the period"
      - name: territory_market_machine_units
        type: integer
        source: input
        description: "Total machine units placed in the territory during the period by all sellers"
      - name: actual_market_share_pct
        type: number
        source: computed
        description: "DERIVED and stored exactly as reported: 100.0 * actual_territory_machine_units / territory_market_machine_units, 4 decimal places round_half_up"
      - name: performance_ratio_pct
        type: number
        source: computed
        description: "DERIVED and stored exactly as reported: 100.0 * actual_market_share_pct / performance_plan_share_pct of the agreement, 4 decimal places round_half_up"
      - name: quality_deficiency_pp
        type: number
        source: computed
        description: "Computed on transition to EVALUATED: mean of the product support quality index (100 * met_sla_service_orders / sampled_service_orders) values across the whole Dealer's reviews with status EVALUATED at that instant, minus this review's own product support quality index, 4 decimal places round_half_up"
      - name: quality_deficient
        type: boolean
        source: computed
        default: false
        description: "Computed on transition to EVALUATED: true when the spread of product support quality index values across the whole Dealer's EVALUATED reviews is >= 10.00 percentage points, where the spread is max minus min of those values"
      - name: sampled_service_orders
        type: integer
        source: input
        description: "Customer service orders sampled for SLA conformance in the period"
      - name: met_sla_service_orders
        type: integer
        source: input
        description: "Sampled service orders that met the response SLA; must be <= sampled_service_orders"
      - name: discrepancy_pp
        type: number
        source: computed
        default: 0.0
        description: "Computed on transition to EVALUATED: abs(actual_market_share_pct - market_share_from_observations_pct), 4 decimal places round_half_up, where market_share_from_observations_pct is the share implied by this Dealer's MarketShareObservation rows whose recorded_at falls inside [period_start, period_end)"
      - name: circumstance_note
        type: string
        source: input
        description: "Dealer-supplied note explaining a missed plan; immutable once EVALUATED"
      - name: loyalty_score
        type: number
        source: computed
        default: 0.0
        description: "Computed on transition to EVALUATED: performance_ratio_pct + ltv_bonus + csi_bonus, where ltv_bonus is the machine_lifetime_value() bonus of this dealer and csi_bonus is 3.0 when performance_ratio_pct >= 100.0, else 0.0"

  - name: PartsCommitment
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> DealerAgreement.id; the agreement this stocking commitment serves"
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; denormalized owner of the commitment"
      - name: product_family
        type: enum
        source: input
        description: "Machine family replicating the agreement's product_family; immutable after creation"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: machine_population_units
        type: integer
        source: input
        description: "Machines of this product family in the territory, as declared at commitment submission"
      - name: machine_population_slope
        type: number
        source: input
        default: 1.0
        description: "Territory population trend factor; 1.0 absorbs a territory whose growth is not stated, and the constant 1.0 absorbs the same case"
      - name: machine_population_tier
        type: enum
        source: computed
        description: "MICRO | SMALL | MEDIUM | LARGE — derived from the tier-weighted machine population; tier boundaries are inclusive on the lower edge"
        constraints: "enum members: MICRO, SMALL, MEDIUM, LARGE"
      - name: planned_annual_units
        type: integer
        source: input
        description: "Annual parts units the dealer plans to order for this family"
      - name: emergency_stocking_target_pct
        type: number
        source: input
        description: "Percent of the required stocking mandate the dealer commits to hold for emergency availability, (0, 100]"
      - name: emergency_fill_window_hours
        type: number
        source: input
        description: "Hours within which an emergency order must be filled; the mandate requires <= 24 hours, a value above 24 caps the required stocking level"
      - name: required_stocking_units
        type: integer
        source: computed
        description: "Active variant of the stocking mandate; ceiling (never floor) rounding"
      - name: required_stocking_units_final
        type: integer
        source: computed
        description: "Final variant of the stocking mandate; floor (never ceiling) rounding; asserted to be <= required_stocking_units"
      - name: available_commitment_units
        type: integer
        source: computed
        description: "max(0, required_stocking_units_final - committed_units); recomputed whenever required_stocking_units_final or committed_units changes"
      - name: availability_target_pct
        type: number
        source: computed
        description: "Emergency availability target in percent, 4 decimal places round_half_up"
      - name: emergency_tier
        type: enum
        source: computed
        description: "PREMIUM when emergency_fill_window_hours <= 8, STANDARD when <= 24, BASIC when > 24; refreshed on every recompute of the stocking mandate"
        constraints: "enum members: PREMIUM, STANDARD, BASIC"
      - name: committed_units
        type: integer
        source: computed
        default: 0
        description: "Units already allocated to PartsOrderBatch rows of this commitment under RECEIVED, PARTIAL or CORE_PENDING status"
      - name: fulfilled_units
        type: integer
        source: computed
        default: 0
        description: "Units already received against PartsOrderBatch rows of this commitment"
      - name: fill_rate_pct
        type: number
        source: computed
        default: 0.0
        description: "Fulfilment rate in percent, 4 decimal places round_half_up"
      - name: credit_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Core return credit balance in cents; increases only through RebuildClaim core returns and PARTIALLY_RETURNED batches"
      - name: status
        type: enum
        source: system
        default: "PLANNED"
        description: "PLANNED | SUBMITTED | ORDER_READY | CORE_PENDING | PERFORMANCE_DEFICIENT | SUSPENDED | COMPLETE"
        constraints: "enum members: PLANNED, SUBMITTED, ORDER_READY, CORE_PENDING, PERFORMANCE_DEFICIENT, SUSPENDED, COMPLETE"
      - name: backorder_opened_at
        type: datetime
        source: system
        description: "Stamp written when the commitment enters PERFORMANCE_DEFICIENT; drives the deferred re-evaluation of the shortage"

  - name: PartsOrderBatch
    parent: null
    common_fields: true
    fields:
      - name: commitment_id
        type: string
        source: input
        description: "FK -> PartsCommitment.id; the stocking commitment the batch draws on"
      - name: product_family
        type: enum
        source: input
        description: "Machine family; must equal the commitment's product_family; immutable after creation"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: requested_units
        type: integer
        source: input
        description: "Units requested in this batch; the quantity is immutable after creation, including during the CORE_PENDING round trip"
      - name: reserved_units
        type: integer
        source: system
        description: "Units reserved at creation: for a non-emergency batch min(requested_units, available_commitment), for an oversized non-emergency batch exactly required_stocking_units + 2, for an emergency batch min(gap, 5 * required_stocking_units)"
      - name: unfilled_units
        type: integer
        source: computed
        default: 0
        description: "Units of reserved_units not yet received; feeds Dealer.open_backorder_units while status is OPEN or CORE_PENDING"
      - name: status
        type: enum
        source: system
        default: "OPEN"
        description: "OPEN | ORDERED | RECEIVED | CLOSED | CANCELLED"
        constraints: "enum members: OPEN, ORDERED, RECEIVED, CLOSED, CANCELLED"
      - name: requested_at
        type: datetime
        source: input
        description: "Client-declared instant the batch was requested; used for chronological ordering"
      - name: received_at
        type: datetime
        source: system
        description: "Server clock instant the batch was received; drives emergency fill-window measurement"
      - name: emergency
        type: boolean
        source: input
        default: false
        description: "true when the batch is an emergency order whose fill window is measured and charged"
      - name: core_return_required
        type: boolean
        source: system
        default: false
        description: "true when either the requested_units > available_commitment aggregate condition holds or the dealer is on CORE_PENDING restriction; forces the CORE_PENDING round trip unless already set"
      - name: core_units
        type: integer
        source: input
        description: "Returnable core units declared with the batch"

  - name: CertificationRecord
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer employing the technician"
      - name: technician_name
        type: string
        source: input
        description: "Technician identity key inside the dealership; not a server-minted id"
      - name: product_family
        type: enum
        source: input
        description: "Machine family the credential certifies; immutable after creation"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: credential_code
        type: string
        source: input
        description: "Credential programme code; DEALER_MASTER or DEALER_CERTIFIED"
        constraints: "enum members: DEALER_MASTER, DEALER_CERTIFIED"
      - name: certified_at
        type: datetime
        source: input
        description: "Instant the credential was granted; start of the credential validity interval"
      - name: recurrence_within_period
        type: boolean
        source: computed
        default: false
        description: "true when another non-REVOKED CertificationRecord exists for the same dealer, product_family and technician_name with certified_at inside [this.certified_at, this.certified_at + 12 months), which keeps the credential ACTIVE past its expiry while in force"
      - name: status
        type: enum
        source: system
        default: "ACTIVE"
        description: "ACTIVE | EXPIRED | REVOKED — derived on read from certified_at, recurrence_within_period and the logical clock"
        constraints: "enum members: ACTIVE, EXPIRED, REVOKED"

  - name: RebuildClaim
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer performing the rebuild"
      - name: product_family
        type: enum
        source: input
        description: "Machine family the claim covers; immutable after creation"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: machine_serial
        type: string
        source: input
        description: "Machine serial; unique among non-DENIED, non-DECLINED rebuild claims"
      - name: machine_operating_weight_lb
        type: integer
        source: input
        description: "Operating weight of the core machine in pounds; immutable after submission for approval"
      - name: client_meter_hours
        type: number
        source: input
        description: "Meter hours currently showing on the client's machine; identifies the machine the dealer holds so the exchange itself has nothing to ship"
      - name: requested_at
        type: datetime
        source: input
        description: "Client-declared instant the claim was requested"
      - name: core_purchase_value_cents
        type: integer
        source: input
        description: "Purchase value of the returned core in cents; set at approval"
      - name: core_return_credit_cents
        type: integer
        source: computed
        description: "Core credit granted on core return: core_value + core_handling_fee, 2 decimal places round_half_up, where core_value = round_half_up(core_purchase_value_cents * CORE_CREDIT_RATE, 2) and core_handling_fee = round_half_up(core_value * CERTIFIED_HANDLING_MARGIN, 2)"
      - name: core_returned_at
        type: datetime
        source: input
        description: "Instant the core was returned; stamp written on the core_return transition"
      - name: rebuild_labor_hours
        type: number
        source: input
        description: "Certified rebuild labour hours priced at approval"
      - name: rebuild_labor_rate_cents
        type: integer
        source: input
        description: "Certified shop labour rate in cents per hour"
      - name: rebuild_fee_cents
        type: integer
        source: computed
        description: "rebuild_fee = labor_fee_component + rebuild_handling_component; labor_fee_component = round_half_up(hours * rate_per_hour, 2) with the rate selected by the machine's weight class; rebuild_handling_component = round_half_up(core_value * CERTIFIED_HANDLING_MARGIN, 2) evaluated from the same core_value the core return credit uses"
      - name: certified_rebuild_spec_code
        type: string
        source: input
        description: "Certified rebuild specification code applied at delivery; CAT_CERTIFIED_1, CAT_CERTIFIED_2 or CAT_CERTIFIED_3"
        constraints: "enum members: CAT_CERTIFIED_1, CAT_CERTIFIED_2, CAT_CERTIFIED_3"
      - name: status
        type: enum
        source: system
        default: "REQUESTED"
        description: "REQUESTED | APPROVED | CORE_PENDING | CORE_RETURNED | DELIVERED | CERTIFIED | COMPLETE | DENIED | DECLINED"
        constraints: "enum members: REQUESTED, APPROVED, CORE_PENDING, CORE_RETURNED, DELIVERED, CERTIFIED, COMPLETE, DENIED, DECLINED"

  - name: EquipmentOrder
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer selling the machine"
      - name: product_family
        type: enum
        source: input
        description: "Machine family ordered; immutable after creation"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: machine_serial
        type: string
        source: input
        description: "Serial of the machine being delivered; unique among non-CANCELLED equipment orders"
      - name: list_price_cents
        type: integer
        source: input
        description: "Machine list price in cents; frozen at order submission"
      - name: trade_in_serial
        type: string
        source: input
        description: "Serial of the trade-in machine, when the sale includes one"
      - name: status
        type: enum
        source: system
        default: "DRAFT"
        description: "DRAFT | SUBMITTED | FINANCE_APPROVED | DELIVERED | CANCELLED"
        constraints: "enum members: DRAFT, SUBMITTED, FINANCE_APPROVED, DELIVERED, CANCELLED"
      - name: financing_approval_reference
        type: string
        source: input
        description: "OEM financing approval reference recorded on approval"
      - name: supportable_machine_registered
        type: boolean
        source: computed
        default: false
        description: "true once a SupportAgreement exists for this order's machine_serial; the product support bundle is part of the machine sale"
      - name: requested_at
        type: datetime
        source: input
        description: "Client-declared instant the order was placed"

  - name: TradeInUnit
    parent: EquipmentOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> EquipmentOrder.id; the equipment order this trade-in machine is attached to"
      - name: machine_serial
        type: string
        source: system
        description: "Serial of the taken-in machine, copied from the equipment order's trade_in_serial, to which the dealer's current client_meter_hours is affixed"
      - name: machine_operating_weight_lb
        type: integer
        source: input
        description: "Operating weight of the trade-in machine in pounds"
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Appraised remarketing value of the trade-in machine in cents"
      - name: status
        type: enum
        source: system
        default: "APPRAISED"
        description: "APPRAISED | ACCEPTED | REMARKETED | SCRAPPED"
        constraints: "enum members: APPRAISED, ACCEPTED, REMARKETED, SCRAPPED"

  - name: SupportAgreement
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer providing product support"
      - name: machine_serial
        type: string
        source: input
        description: "Machine serial the product support plan is bound to; unique among non-TERMINATED support agreements"
      - name: plan_tier
        type: enum
        source: input
        description: "BASIC | PLUS | PREMIUM — BASIC keeps the standard warranty terms without adding a product support obligation; PLUS and PREMIUM add a maintenance obligation"
        constraints: "enum members: BASIC, PLUS, PREMIUM"
      - name: enrolled_at
        type: datetime
        source: input
        description: "Instant the plan was enrolled"
      - name: coverage_multiplier
        type: number
        source: computed
        description: "BASIC 1.0, PLUS 1.25, PREMIUM 1.5 — multiplied into the forecast coverage when material is reserved"
      - name: status
        type: enum
        source: system
        default: "ACTIVE"
        description: "ACTIVE | SUSPENDED | TERMINATED"
        constraints: "enum members: ACTIVE, SUSPENDED, TERMINATED"

  - name: MarketShareObservation
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer the observation is about"
      - name: product_family
        type: enum
        source: input
        description: "Machine family observed; immutable after creation"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: observed_machine_units
        type: integer
        source: input
        description: "Rider machines recorded for this dealer and family in the observation window"
      - name: territory_machine_units
        type: integer
        source: input
        description: "Total rider machines recorded for the territory in the observation window"
      - name: observed_share_pct
        type: number
        source: computed
        description: "100.0 * observed_machine_units / territory_machine_units, 4 decimal places round_half_up, recomputed from the summed observation values of this dealer and family"
      - name: recorded_at
        type: datetime
        source: input
        description: "Instant inside the observation window; decides whether the rider share informs the performance review and the derived dealer share"
      - name: kind
        type: enum
        source: input
        default: "MACHINE"
        description: "MACHINE weights the observation at 1.0 and LIGHT weights it at 0.5 when the share is aggregated"
        constraints: "enum members: MACHINE, LIGHT"

  - name: PartyRegistration
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer party standing for the territory"
      - name: territory_code
        type: string
        source: input
        description: "Territory the party stands for; a second registration supersedes the first"
      - name: registered_at
        type: datetime
        source: input
        description: "Instant the party was registered"
      - name: status
        type: enum
        source: system
        default: "REGISTERED"
        description: "REGISTERED | SUPERSEDED — a registration becomes SUPERSEDED as soon as a later registration for the same territory_code is written"
        constraints: "enum members: REGISTERED, SUPERSEDED"

  - name: MachinePopulationRecord
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer whose field population the machine belongs to"
      - name: product_family
        type: enum
        source: input
        description: "Machine family; immutable after creation"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: machine_serial
        type: string
        source: input
        description: "Machine serial registered into the dealer's field population; unique among non-RETIRED records"
      - name: machine_operating_weight_lb
        type: integer
        source: input
        description: "Operating weight in pounds; selects the weight-class tier multiplier"
      - name: meter_hours
        type: number
        source: input
        description: "Latest meter reading for the machine; a lower reading is retained and the coverage-credit bands are re-keyed"
      - name: weight_class_tier
        type: enum
        source: computed
        description: "LIGHT below 40000 lb, MIDDLE from 40000 lb through 100000 lb inclusive at BOTH edges, HEAVY above 100000 lb"
        constraints: "enum members: LIGHT, MIDDLE, HEAVY"
      - name: coverage_multiplier
        type: number
        source: computed
        description: "coverage_multiplier() value currently bound to the machine's serial: 1.5 when an ACTIVE SupportAgreement with plan_tier PREMIUM covers the serial, 1.25 for PLUS, 1.0 otherwise"
      - name: projected_annual_parts_units
        type: integer
        source: computed
        description: "base_annual_parts_units(product_family) * coverage_multiplier * weight_class_tier_multiplier(machine_operating_weight_lb), rounded up to the next whole unit"
      - name: status
        type: enum
        source: system
        default: "ACTIVE"
        description: "ACTIVE | RETIRED — RETIRED records are excluded from every forecast and from the tier-weighted machine population"
        constraints: "enum members: ACTIVE, RETIRED"

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer the order belongs to"
      - name: commitment_id
        type: string
        source: input
        description: "FK -> PartsCommitment.id; the commitment whose availability mandate the order is charged against"
      - name: kind
        type: enum
        source: input
        description: "EMERGENCY_FILL | RESTRICTION | SLA_AUDIT — all three share one response-window treatment"
        constraints: "enum members: EMERGENCY_FILL, RESTRICTION, SLA_AUDIT"
      - name: product_family
        type: enum
        source: input
        description: "Machine family the order concerns"
        constraints: "enum members: EXCAVATION, EARTHMOVING, COMPACTION, POWER_SYSTEMS, LIFT_TRUCK"
      - name: machine_serial
        type: string
        source: input
        description: "Serial of the machine the order concerns, when one is involved"
      - name: orderable_ref_enabled
        type: boolean
        source: input
        default: false
        description: "true selects the orderable branch of the emergency fill case; false selects the non-orderable branch"
      - name: response_window_hours
        type: number
        source: computed
        description: "Derived from the linked PartsCommitment.emergency_fill_window_hours fixed at open"
      - name: restriction_scope
        type: enum
        source: input
        default: "HOURS_SPENT"
        description: "HOURS_SPENT | METER_RUNNING | FULL_STOP — increasing severity for RESTRICTION orders"
        constraints: "enum members: HOURS_SPENT, METER_RUNNING, FULL_STOP"
      - name: priority_rank
        type: integer
        source: computed
        description: "FULL_STOP 3, METER_RUNNING 2, HOURS_SPENT 1"
      - name: risk_score
        type: integer
        source: computed
        description: "priority_rank * 10 + 10 when kind == EMERGENCY_FILL + 5 when the order's machine_serial is covered by an ACTIVE SupportAgreement whose plan_tier is PREMIUM"
      - name: sla_hours
        type: number
        source: input
        description: "Logged response time in hours for the order"
      - name: emergency_filled_units
        type: integer
        source: computed
        description: "Filled quantity for an EMERGENCY_FILL order: with orderable_ref_enabled false it is ceil(gross_filled_units / denom) and with orderable_ref_enabled true it is floor(gross_filled_units / denom), where gross_filled_units is the summed sla_hours of the dealer's OPEN RESTRICTION orders whose machine_serial sits on an ACTIVE MachinePopulationRecord, and denom is 2 when gross_filled_units <= 8.0 and 4 otherwise"
      - name: deferral_tier
        type: integer
        source: computed
        description: "1 + priority_rank when the ordering target list holds at least one candidate, else 0; the ordering target list is the dealer's RESTRICTION orders whose status is OPEN and whose machine_serial is on the dealer's ACTIVE MachinePopulationRecord rows"
      - name: opened_at
        type: datetime
        source: system
        description: "Server clock instant the order was opened"
      - name: resolved_at
        type: datetime
        source: system
        description: "Server clock instant the order reached RESOLVED"
      - name: status
        type: enum
        source: system
        default: "OPEN"
        description: "OPEN | IN_PROGRESS | FILLED | ESCALATED | RESOLVED"
        constraints: "enum members: OPEN, IN_PROGRESS, FILLED, ESCALATED, RESOLVED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DealerAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dealer-agreements/{id}/submit"
        actor: DealerNetworkManager
        preconditions:
          - "exclusivity_level == EXCLUSIVE requires that no other DealerAgreement with the same territory_code and product_family and exclusivity_level EXCLUSIVE is in status SUBMITTED or ACTIVE over an overlapping [start_at, end_at) interval (ERR_TERRITORY_OVERLAP)"
          - "performance_plan_share_pct == 100 at response time is recorded verbatim; a value above 100 is rejected with ERR_TERRITORY_OVERLAP and a value of exactly 100 is not"
          - "when a superseded EXCLUSIVE row for the same territory_code and product_family exists in TERMINATED with end_at <= now, the oldest such row is first reset to start_at=now, end_at=now+1y, status=SUBMITTED and takes part in the overlap determination; the submission then proceeds"
        side_effects:
          - "recompute DealerAgreement.certified_technician_count"
          - "recompute DealerAgreement.tooling_compliance_status"
          - "default_deferred_shortage_rule deactivated for every PartsCommitment of this agreement"

      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /dealer-agreements/{id}/activate"
        actor: DealerNetworkManager
        preconditions:
          - "tooling_compliance_status == COMPLIANT"
          - "certified_technician_count >= 2"
          - "at least one PartsCommitment of this agreement exists and is not in PLANNED"
          - "the owning Dealer is not in TERMINATED"
        side_effects:
          - "recompute PartsCommitment.machine_population_tier for every commitment of this agreement"
          - "recompute PartsCommitment.required_stocking_units and required_stocking_units_final for every commitment of this agreement"
          - "recompute PartsCommitment.availability_target_pct for every commitment of this agreement"
          - "increments DealerAgreement.version by 1"
          - "when Dealer.trusted_commitment_count >= 1, Dealer.status becomes ACTIVE"

      - from: ACTIVE
        to: PERFORMANCE_DEFICIENT
        trigger: "POST /dealer-agreements/{id}/mark-underperforming"
        actor: DealerPerformanceReviewer
        preconditions:
          - "every PerformanceReview of this agreement is in status EVALUATED (none in DRAFT, RESULTS_RECORDED, REMEDIATION_REQUIRED or CIRCUMSTANCE_PENDING) (ERR_REVIEW_OUTSTANDING)"
        side_effects:
          - "PartsCommitment.status becomes PERFORMANCE_DEFICIENT for every commitment of this agreement not already in TERMINATED state"
          - "PartsCommitment.backorder_opened_at is stamped with the server timestamp on each affected commitment"
          - "each affected PartsCommitment raises its required_stocking_units by one availability tier"
          - "Dealer.open_backorder_units is recalculated"
          - "default_deferred_shortage_rule deactivated for each affected commitment"

      - from: PERFORMANCE_DEFICIENT
        to: ACTIVE
        trigger: "POST /dealer-agreements/{id}/reinstate"
        actor: DealerPerformanceReviewer
        preconditions:
          - "every PerformanceReview of this agreement is EVALUATED with performance_ratio_pct >= 80.0"
        side_effects:
          - "default_deferred_shortage_rule reactivated for each commitment of this agreement"
          - "increments DealerAgreement.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dealer-agreements/{id}/suspend"
        actor: DealerNetworkManager
        preconditions:
          - "no PerformanceReview of this agreement is in CIRCUMSTANCE_PENDING (ERR_REVIEW_AWAITING_CIRCUMSTANCE)"
        side_effects:
          - "increments DealerAgreement.version by 1"
          - "Dealer.status becomes SUSPENDED when no other agreement of the dealer is ACTIVE"
          - "default_deferred_shortage_rule deactivated for each commitment of this agreement"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dealer-agreements/{id}/reinstate"
        actor: DealerNetworkManager
        preconditions:
          - "tooling_compliance_status == COMPLIANT"
          - "the owning Dealer is not in TERMINATED"
        side_effects:
          - "default_deferred_shortage_rule reactivated for each commitment of this agreement"
          - "increments DealerAgreement.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /dealer-agreements/{id}/terminate"
        actor: DealerNetworkManager
        preconditions:
          - "every PartsCommitment of this agreement is in status COMPLETE, or in CORE_PENDING with a credit_balance_cents of 0"
          - "no PartsOrderBatch of this agreement's commitments is in OPEN or ORDERED (ERR_AGREEMENT_COMMITMENT_OPEN)"
        side_effects:
          - "every ACTIVE PartsCommitment of this agreement becomes SUSPENDED"
          - "every ACTIVE SupportAgreement bound to a machine_serial of this dealer becomes TERMINATED"
          - "DealerAgreement.closed_at is stamped with the server timestamp"
          - "recompute Dealer.certified_family_count"
          - "Dealer.status becomes TERMINATED only when every agreement of the dealer is TERMINATED"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /dealer-agreements/{id}/terminate"
        actor: DealerNetworkManager
        preconditions:
          - "no PartsOrderBatch of this agreement's commitments is in OPEN or ORDERED (ERR_AGREEMENT_COMMITMENT_OPEN)"
        side_effects:
          - "every ACTIVE PartsCommitment of this agreement becomes SUSPENDED"
          - "DealerAgreement.closed_at is stamped with the server timestamp"
          - "recompute Dealer.certified_family_count"

  - entity: PartsCommitment
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: SUBMITTED
        trigger: "POST /parts-commitments/{id}/submit"
        actor: PartsManager
        preconditions:
          - "the owning DealerAgreement.status is SUBMITTED or ACTIVE (ERR_INVALID_STATE)"
          - "planned_annual_units >= 1"
        side_effects:
          - "recompute machine_population_tier"
          - "recompute required_stocking_units and required_stocking_units_final"
          - "recompute availability_target_pct"

      - from: SUBMITTED
        to: ORDER_READY
        trigger: "POST /parts-commitments/{id}/ready-for-orders"
        actor: PartsManager
        preconditions:
          - "required_stocking_units_final >= 1"
          - "the owning DealerAgreement.tooling_compliance_status == COMPLIANT"
          - "machine_population_tier != MICRO"
        side_effects:
          - "the owning DealerAgreement.trusted_commitment becomes true"
          - "recompute Dealer.trusted_commitment_count"
          - "Dealer.status becomes ACTIVE when trusted_commitment_count >= 1"
          - "default_deferred_shortage_rule reactivated"

      - from: ORDER_READY
        to: PERFORMANCE_DEFICIENT
        trigger: "system (automatic when available_commitment_units < required_stocking_units_final - committed_units for this commitment)"
        actor: system
        preconditions: []
        side_effects:
          - "backorder_opened_at is stamped with the server timestamp"
          - "default_deferred_shortage_rule deactivated"
          - "Dealer.open_backorder_units is recalculated"
          - "a ServiceOrder of kind EMERGENCY_FILL is opened against this commitment"

      - from: PERFORMANCE_DEFICIENT
        to: ORDER_READY
        trigger: "POST /parts-commitments/{id}/reinstate"
        actor: PartsManager
        preconditions:
          - "available_commitment_units >= required_stocking_units_final - committed_units"
        side_effects:
          - "default_deferred_shortage_rule reactivated"
          - "backorder_opened_at is cleared"

      - from: ORDER_READY
        to: SUSPENDED
        trigger: "POST /parts-commitments/{id}/suspend"
        actor: PartsManager
        preconditions:
          - "no PartsOrderBatch of this commitment is in OPEN or ORDERED (ERR_COMMITMENT_BATCH_OPEN)"
        side_effects:
          - "the owning DealerAgreement.trusted_commitment becomes false when no other commitment of that agreement remains ORDER_READY"
          - "recompute Dealer.trusted_commitment_count"
          - "default_deferred_shortage_rule deactivated"

      - from: SUSPENDED
        to: ORDER_READY
        trigger: "POST /parts-commitments/{id}/reinstate"
        actor: PartsManager
        preconditions:
          - "the owning DealerAgreement.status is ACTIVE"
        side_effects:
          - "default_deferred_shortage_rule reactivated"

      - from: ORDER_READY
        to: CORE_PENDING
        trigger: "POST /parts-commitments/{id}/suspend-core-credit"
        actor: PartsManager
        preconditions:
          - "credit_balance_cents == 0 (ERR_CREDIT_ALREADY_APPLIED)"
          - "no PartsOrderBatch of this commitment is in OPEN or ORDERED (ERR_COMMITMENT_BATCH_OPEN)"
        side_effects:
          - "every OPEN PartsOrderBatch of this commitment has core_return_required set to true"
          - "the owning DealerAgreement.trusted_commitment becomes false when no other commitment of that agreement remains ORDER_READY"
          - "recompute Dealer.trusted_commitment_count"
          - "default_deferred_shortage_rule deactivated"
          - "each ServiceOrder of this commitment that is OPEN or IN_PROGRESS becomes ESCALATED"

      - from: CORE_PENDING
        to: ORDER_READY
        trigger: "POST /parts-commitments/{id}/settle-core-credit"
        actor: PartsManager
        preconditions:
          - "credit_balance_cents >= required_stocking_units_final * 100; when the settled figure reaches required_stocking_units_final * 100 the settlement is refused (ERR_STOCKING_MANDATE_HARD_CAP)"
        side_effects:
          - "default_deferred_shortage_rule reactivated"

      - from: ORDER_READY
        to: COMPLETE
        trigger: "system (automatic once credit_balance_cents >= required_stocking_units_final * 100 and every PartsOrderBatch of this commitment is CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Dealer.open_backorder_units is recalculated"
          - "default_deferred_shortage_rule deactivated"

  - entity: PartsOrderBatch
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: ORDERED
        trigger: "POST /parts-order-batches/{id}/place-order"
        actor: PartsManager
        preconditions:
          - "available_commitment_units >= 1, or the batch is emergency (ERR_COMMITMENT_EMPTY)"
        side_effects:
          - "recompute PartsCommitment.committed_units"
          - "recompute PartsCommitment.fill_rate_pct"
          - "when the commitment is not emergency and available_commitment_units is 0, reserved_units is capped to floor(available_commitment_units / 2) without confirming the allocation"

      - from: ORDERED
        to: RECEIVED
        trigger: "POST /parts-order-batches/{id}/receive"
        actor: PartsManager
        preconditions:
          - "a receipt whose unreceipted quantity is already covered by this batch writes no second credit and leaves committed_units untouched (idempotent replay)"
        side_effects:
          - "PartsCommitment.fulfilled_units is increased by unfilled_units"
          - "PartsCommitment.credit_balance_cents is increased by exactly core_units * credited_settlement_units_increment, never by a re-priced figure, when core_units >= 1"
          - "recompute PartsCommitment.fill_rate_pct"
          - "recompute PartsCommitment.committed_units"
          - "recompute Dealer.open_backorder_units"
          - "when the PartsCommitment is PERFORMANCE_DEFICIENT or SUSPENDED and the outstanding SLA claim whose kind is SLA_AUDIT is not resolved, suspend its deferred re-evaluation for that epoch, so the older-performance re-evaluation the suspension discards RE-COMPUTES its deferral tier rather than replaying the tier it held when it ran"
          - "when the receipt uses only part of the batch, the unallocated remainder of reserved_units is carried forward into a new PartsOrderBatch in status OPEN with core_return_required inherited from this batch"

      - from: RECEIVED
        to: PARTIALLY_RETURNED
        trigger: "POST /parts-order-batches/{id}/return-core"
        actor: PartsManager
        preconditions:
          - "core_units >= 1"
        side_effects:
          - "core_return_credit_cents is computed as core_units * credited_settlement_units_increment on the first partial return and frozen on the batch thereafter"
          - "PartsCommitment.credit_balance_cents is increased by the frozen core_return_credit_cents, never re-priced"
          - "clear PartsCommitment's default_deferred_shortage_rule when credit_balance_cents reaches required_stocking_units_final * 100"
          - "recompute PartsCommitment.fulfilled_units"
          - "recompute Dealer.open_backorder_units"

      - from: RECEIVED
        to: CORE_PENDING
        trigger: "POST /parts-order-batches/{id}/core-return"
        actor: PartsManager
        preconditions:
          - "core_return_required is true"
          - "PartsCommitment.status != PERFORMANCE_DEFICIENT (ERR_COMMITMENT_PERFORMANCE_DEFICIENT)"
        side_effects:
          - "PartsCommitment.status becomes CORE_PENDING when the commitment's credit_balance_cents is 0"
          - "default_deferred_shortage_rule deactivated"
          - "every OPEN PartsOrderBatch of the commitment has core_return_required set to true"
          - "the owning DealerAgreement.trusted_commitment becomes false when no other commitment of that agreement remains ORDER_READY"
          - "recompute Dealer.trusted_commitment_count"

      - from: CORE_PENDING
        to: RECEIVED
        trigger: "POST /parts-order-batches/{id}/core-return"
        actor: PartsManager
        preconditions:
          - "core_units >= 1"
          - "PartsCommitment.credit_balance_cents >= required_stocking_units_final * 100"
        side_effects:
          - "PartsCommitment.credit_balance_cents is increased by core_units * 100"
          - "default_deferred_shortage_rule reactivated"
          - "PartsCommitment.status becomes ORDER_READY when credit_balance_cents reaches required_stocking_units_final * 100"

      - from: CORE_PENDING
        to: RECEIVED
        trigger: "POST /parts-order-batches/{id}/cancel-core-return (compensating action)"
        actor: PartsManager
        preconditions: []
        side_effects:
          - "PartsCommitment.credit_balance_cents is decreased by exactly the core_return_credit amount the matching forward return added, never by a re-priced figure"
          - "default_deferred_shortage_rule is set back to the activation it held before the forward return"

      - from: RECEIVED
        to: CLOSED
        trigger: "POST /parts-order-batches/{id}/close"
        actor: PartsManager
        preconditions:
          - "PartsCommitment.credit_balance_cents >= required_stocking_units_final * credited_settlement_units_increment"
          - "PartsCommitment.status == ORDER_READY"
        side_effects:
          - "recompute PartsCommitment.committed_units"
          - "recompute Dealer.open_backorder_units"
          - "when every batch of the commitment is CLOSED and credit_balance_cents >= required_stocking_units_final * credited_settlement_units_increment, PartsCommitment.status becomes COMPLETE"

      - from: OPEN
        to: CANCELLED
        trigger: "POST /parts-order-batches/{id}/cancel"
        actor: PartsManager
        preconditions: []
        side_effects:
          - "the reserved_units of this batch are released back to available_commitment_units"
          - "recompute PartsCommitment.committed_units"
          - "recompute Dealer.open_backorder_units"

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /parts-order-batches/{id}/cancel"
        actor: PartsManager
        preconditions: []
        side_effects:
          - "the reserved_units of this batch are released back to available_commitment_units"
          - "recompute PartsCommitment.committed_units"

  - entity: RebuildClaim
    initial_state: REQUESTED
    terminal_states: [COMPLETE, DENIED, DECLINED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /rebuild-claims/{id}/approve"
        actor: RebuildProgramSpecialist
        preconditions:
          - "the DealerAgreement for this dealer and product_family is ACTIVE"
          - "this dealer holds at least one PartsCommitment in status PERFORMANCE_DEFICIENT (ERR_NO_RESTRICTION_PRIORITY)"
          - "machine_operating_weight_lb <= certified_rebuild_max_weight_lb of the requested specification code (ERR_REBUILD_SPEC_EXCEEDED)"
        side_effects:
          - "derive core_purchase_value_cents from the machine"
          - "recompute rebuild_fee_cents"
          - "recompute core_return_credit_cents"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /rebuild-claims/{id}/deny"
        actor: RebuildProgramSpecialist
        preconditions: []
        side_effects:
          - "no PartsCommitment, core credit or rebuild fee is created for the claim"

      - from: APPROVED
        to: DECLINED
        trigger: "POST /rebuild-claims/{id}/decline"
        actor: RebuildProgramSpecialist
        preconditions:
          - "no PartyRegistration for the territory is in status SUPERSEDED (ERR_PARTY_SUPERSEDED)"
        side_effects:
          - "the DECLINED claim's machine_serial is left out of the machine_serial uniqueness comparison on every later registration"

      - from: APPROVED
        to: CORE_PENDING
        trigger: "POST /rebuild-claims/{id}/request-core-return"
        actor: PartsManager
        preconditions:
          - "core_purchase_value_cents >= 1"
        side_effects:
          - "default_deferred_shortage_rule deactivated"
          - "a ServiceOrder of kind RESTRICTION is opened against the claim's dealer with machine_serial set"

      - from: CORE_PENDING
        to: CORE_RETURNED
        trigger: "POST /rebuild-claims/{id}/core-return"
        actor: PartsManager
        preconditions:
          - "core_returned_at is supplied on the claim"
        side_effects:
          - "when client_meter_hours is set the dealer holds the machine, so the exchange settlement writes nothing: PartsCommitment.credit_balance_cents is unchanged and the credit is carried on the dealer's RESTRICTION ServiceOrder instead"
          - "otherwise PartsCommitment.credit_balance_cents is increased by RebuildClaim.core_return_credit_cents"
          - "default_deferred_shortage_rule reactivated when credit_balance_cents reaches required_stocking_units_final * credited_settlement_units_increment"
          - "recompute Dealer.open_backorder_units"

      - from: CORE_RETURNED
        to: DELIVERED
        trigger: "POST /rebuild-claims/{id}/deliver"
        actor: RebuildProgramSpecialist
        preconditions:
          - "the certified_technician_min_count of certified_rebuild_spec_code <= the agreement's certified_technician_count"
        side_effects:
          - "a ServiceOrder of kind SLA_AUDIT is created with status RESOLVED"
          - "a TradeInUnit row is created in status ACCEPTED with machine_serial copied from the claim"
          - "a SupportAgreement is created in status ACTIVE for the rebuilt machine_serial, carrying the claim's specification code"

      - from: DELIVERED
        to: CERTIFIED
        trigger: "POST /rebuild-claims/{id}/certify"
        actor: RebuildProgramSpecialist
        preconditions:
          - "at least one ServiceOrder with origin_rebuild_id equal to this claim is not CANCELLED"
        side_effects:
          - "required_stocking_units_final decreases by the certified credit reduction while the COMPLETE hard cap remains suspended"
          - "recompute PartsCommitment.required_stocking_units"
          - "recompute Dealer.open_backorder_units"

      - from: CERTIFIED
        to: COMPLETE
        trigger: "system (automatic once credit_balance_cents >= required_stocking_units_final * 100 and no PartsOrderBatch of the dealer is in OPEN or ORDERED)"
        actor: system
        preconditions: []
        side_effects:
          - "Dealer.open_backorder_units is recalculated"
          - "default_deferred_shortage_rule deactivated for the claim's commitment"

  - entity: Dealer
    initial_state: PENDING_AGREEMENT
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_AGREEMENT
        to: ACTIVE
        trigger: "system (automatic when Dealer.trusted_commitment_count >= 1)"
        actor: system
        preconditions: []
        side_effects:
          - "default_deferred_shortage_rule reactivated for every commitment of the dealer"

      - from: PENDING_AGREEMENT
        to: SUSPENDED
        trigger: "system (automatic when every DealerAgreement of this dealer is SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when no DealerAgreement of this dealer is ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "default_deferred_shortage_rule deactivated for every commitment of the dealer"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when at least one DealerAgreement of this dealer returns to ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "default_deferred_shortage_rule reactivated for every commitment of the dealer"

      - from: PENDING_AGREEMENT
        to: TERMINATED
        trigger: "POST /dealers/{id}/terminate"
        actor: DealerNetworkManager
        preconditions:
          - "every DealerAgreement of this dealer is TERMINATED"
        side_effects:
          - "every certification record of the dealer is revoked"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /dealers/{id}/terminate"
        actor: DealerNetworkManager
        preconditions:
          - "every DealerAgreement of this dealer is TERMINATED"
        side_effects:
          - "every support agreement of the dealer is TERMINATED"
          - "every certification record of the dealer is revoked"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /dealers/{id}/terminate"
        actor: DealerNetworkManager
        preconditions:
          - "every DealerAgreement of this dealer is TERMINATED"
        side_effects:
          - "every support agreement of the dealer is TERMINATED"

  - entity: EquipmentOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /equipment-orders/{id}/submit"
        actor: DealerSalesManager
        preconditions:
          - "machine_serial is not held by another EquipmentOrder outside CANCELLED"
          - "machine_serial is not held by an ACTIVE MachinePopulationRecord"
        side_effects:
          - "when trade_in_serial is set, a TradeInUnit is created in status APPRAISED carrying the order's trade_in_serial"
          - "recompute EquipmentOrder.supportable_machine_registered"

      - from: SUBMITTED
        to: FINANCE_APPROVED
        trigger: "POST /equipment-orders/{id}/approve-financing"
        actor: FinancePartner
        preconditions:
          - "financing_approval_reference is present"
          - "the summed appraised_value_cents of ACCEPTED trade-ins attached to this order is strictly less than list_price_cents, not equal to it (ERR_TRADE_IN_APPRAISAL_EXCEEDS_PRICE)"
        side_effects:
          - "the dealer's RestrictionOrder credit is increased by the trade-in value while the financing approval clears the trade-in's appraised value in kind"
          - "recompute EquipmentOrder.supportable_machine_registered"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /equipment-orders/{id}/cancel"
        actor: DealerSalesManager
        preconditions: []
        side_effects:
          - "the attached TradeInUnit rows are released from the remarketing track"

      - from: FINANCE_APPROVED
        to: CANCELLED
        trigger: "POST /equipment-orders/{id}/cancel"
        actor: DealerSalesManager
        preconditions:
          - "the dealer's RestrictionOrder credit is at least the applied financing value"
        side_effects:
          - "the financing credit applied to the RestrictionOrder is reversed"

      - from: FINANCE_APPROVED
        to: DELIVERED
        trigger: "POST /equipment-orders/{id}/deliver"
        actor: DealerSalesManager
        preconditions:
          - "the dealer holds an ACTIVE DealerAgreement whose product_family equals this order's product_family (ERR_NO_ACTIVE_AGREEMENT)"
          - "machine_serial is carried by no RETIRED MachinePopulationRecord (ERR_MACHINE_POPULATION_RETIRED), and by no ACTIVE MachinePopulationRecord outside this dealer's own records (ERR_MACHINE_ALREADY_REGISTERED)"
        side_effects:
          - "a MachinePopulationRecord is registered in status ACTIVE for machine_serial when none exists"
          - "when the order carried a product support bundle, a SupportAgreement is created in status ACTIVE for machine_serial carrying plan_tier PREMIUM"
          - "the attached TradeInUnit becomes REMARKETED when its remarketed price is >= 70 percent of appraised_value_cents, otherwise SCRAPPED"
          - "when the dealer's latest ServiceOrder of kind RESTRICTION has restriction_scope FULL_STOP, the delivery is charged against the restriction's deferral tier by consuming one pending deferral slot rather than opening a new re-evaluation"

  - entity: SupportAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /support-agreements/{id}/suspend"
        actor: PartsManager
        preconditions:
          - "no ServiceOrder of kind SLA_AUDIT referencing this agreement's machine_serial is OPEN or IN_PROGRESS (ERR_SLA_AUDIT_PENDING)"
        side_effects:
          - "coverage_multiplier stops being applied to the coverage-backed inventory tier"
          - "recompute PartsCommitment.required_stocking_units for the dealer's commitments of this product_family"
          - "default_deferred_shortage_rule deactivated for the dealer's commitments of this product_family"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /support-agreements/{id}/reinstate"
        actor: PartsManager
        preconditions:
          - "the MachinePopulationRecord for this machine_serial is in status ACTIVE"
        side_effects:
          - "the coverage-backed inventory tier is re-applied"
          - "recompute PartsCommitment.required_stocking_units for the dealer's commitments of this product_family"
          - "default_deferred_shortage_rule reactivated for the dealer's commitments of this product_family"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /support-agreements/{id}/terminate"
        actor: PartsManager
        preconditions:
          - "no ServiceOrder referencing this agreement's machine_serial is OPEN or IN_PROGRESS"
        side_effects:
          - "MachinePopulationRecord.coverage_multiplier for this serial is recomputed to 1.0"
          - "recompute PartsCommitment.required_stocking_units for the dealer's commitments of this product_family"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /support-agreements/{id}/terminate"
        actor: PartsManager
        preconditions: []
        side_effects:
          - "MachinePopulationRecord.coverage_multiplier for this serial is recomputed to 1.0"

  - entity: ServiceOrder
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/begin"
        actor: ServiceTechnicianSupervisor
        preconditions: []
        side_effects:
          - "response_window_hours is fixed from the linked PartsCommitment.emergency_fill_window_hours"

      - from: IN_PROGRESS
        to: FILLED
        trigger: "POST /service-orders/{id}/fill"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "orderable_ref_enabled == true"
        side_effects:
          - "default_deferred_shortage_rule deactivated"
          - "recompute PartsCommitment.fill_rate_pct"

      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /service-orders/{id}/escalate"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "orderable_ref_enabled == false"
        side_effects:
          - "PartsCommitment.status becomes PERFORMANCE_DEFICIENT"
          - "PartsCommitment.backorder_opened_at is stamped with the server timestamp"
          - "Dealer.open_backorder_units is recalculated"
          - "default_deferred_shortage_rule deactivated"

      - from: ESCALATED
        to: FILLED
        trigger: "POST /service-orders/{id}/fill"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "orderable_ref_enabled == true"
        side_effects:
          - "default_deferred_shortage_rule deactivated"

      - from: FILLED
        to: RESOLVED
        trigger: "system (automatic once a PartsOrderBatch of the linked commitment reaches RECEIVED)"
        actor: system
        preconditions: []
        side_effects:
          - "resolved_at is stamped with the server timestamp"
          - "the order drops out of the ordering target list"
          - "when the order was already RESOLVED by an earlier receipt of the same batch, the repeat is a no-op: no second consequence of the batch receipt is applied (idempotent replay)"

      - from: IN_PROGRESS
        to: FILLED
        trigger: "POST /service-orders/{id}/record-emergency-fill"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "orderable_ref_enabled == true"
        side_effects:
          - "the order is moved to FILLED idempotently — a repeat of the same recorded fill leaves the order FILLED and otherwise unchanged"
          - "default_deferred_shortage_rule deactivated"
          - "recompute PartsCommitment.fill_rate_pct"

      - from: ESCALATED
        to: FILLED
        trigger: "POST /service-orders/{id}/record-emergency-fill"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "orderable_ref_enabled == true"
        side_effects:
          - "the order is moved to FILLED idempotently — a repeat of the same recorded fill leaves the order FILLED and otherwise unchanged"
          - "default_deferred_shortage_rule deactivated"
          - "recompute PartsCommitment.fill_rate_pct"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /service-orders/{id}/resolve"
        actor: ServiceTechnicianSupervisor
        preconditions: []
        side_effects:
          - "resolved_at is stamped with the server timestamp"
          - "a second resolve of the same order is a no-op: resolved_at keeps its first stamp and the response reports success (idempotent replay)"

      - from: FILLED
        to: RESOLVED
        trigger: "POST /service-orders/{id}/resolve"
        actor: ServiceTechnicianSupervisor
        preconditions: []
        side_effects:
          - "resolved_at is stamped with the server timestamp"
          - "a second resolve of the same order is a no-op: resolved_at keeps its first stamp and the response reports success (idempotent replay)"

      - from: IN_PROGRESS
        to: OPEN
        trigger: "POST /service-orders/{id}/reopen"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "no PartsOrderBatch of the linked commitment is in ORDERED"
        side_effects:
          - "the response window is re-derived from the commitment's current emergency_fill_window_hours"

      - from: OPEN
        to: OPEN
        trigger: "POST /service-orders/{id}/raise-restriction"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "restriction_scope != FULL_STOP (ERR_RESTRICTION_ALREADY_FULL_STOP)"
        side_effects:
          - "restriction_scope is raised by one severity step"
          - "recompute priority_rank and risk_score"
          - "recompute deferral_tier for the dealer's OPEN RESTRICTION orders"

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /service-orders/{id}/raise-restriction"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "restriction_scope != FULL_STOP (ERR_RESTRICTION_ALREADY_FULL_STOP)"
        side_effects:
          - "restriction_scope is raised by one severity step"
          - "recompute priority_rank and risk_score"
          - "recompute deferral_tier for the dealer's OPEN RESTRICTION orders"

      - from: OPEN
        to: OPEN
        trigger: "POST /service-orders/{id}/lower-restriction (compensating action)"
        actor: ServiceTechnicianSupervisor
        preconditions:
          - "restriction_scope != HOURS_SPENT (ERR_RESTRICTION_ALREADY_MINIMAL)"
        side_effects:
          - "restriction_scope is lowered by exactly one severity step, never by a re-priced figure"
          - "risk_score is decreased by exactly the same delta the matching raise added"
          - "recompute deferral_tier for the dealer's OPEN RESTRICTION orders"

  - entity: MachinePopulationRecord
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /machine-population-records/{id}/retire"
        actor: PartsManager
        preconditions:
          - "the dealer carries a TradeInUnit with this machine_serial in status ACCEPTED"
        side_effects:
          - "the record is dropped from forecast_parts_demand_units"
          - "recompute PartsCommitment.machine_population_tier for the dealer's commitments of this product_family"
          - "default_deferred_shortage_rule deactivated for the dealer's commitments of this product_family"

      - from: RETIRED
        to: ACTIVE
        trigger: "POST /machine-population-records/{id}/reinstate"
        actor: PartsManager
        preconditions:
          - "the machine_serial is not carried by a TradeInUnit in status REMARKETED (ERR_MACHINE_REMARKETED)"
        side_effects:
          - "the record is re-included in forecast_parts_demand_units"
          - "recompute PartsCommitment.machine_population_tier for the dealer's commitments of this product_family"
          - "default_deferred_shortage_rule reactivated for the dealer's commitments of this product_family"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: text_sweep_metrics
    trigger: "GET /dealer-network/machine-population-records/sweep-metrics"
    algorithm: projection
    formula: |
      order the dealer's machine_serial values by created_at ASC; on equal
      created_at the tie-break runs alphabetically by machine_serial and never by id
      if the FIRST serial in that order has an underlying PartsCommitment in status CORE_PENDING or PERFORMANCE_DEFICIENT:
        text_sweep_est_monthly_parts_value_cents = sum over the whole ordered set of
          text_sweep_order_rank * 100, where text_sweep_order_rank is the serial's
          1-based position in that ordering
      else:
        text_sweep_vendor_code_matches = count of serials whose underlying commitment is in status ORDER_READY
      input_set: "MachinePopulationRecord rows for the dealer with status ACTIVE only; RETIRED rows are excluded before ordering"
    precision: "integer cents; no rounding"
  - name: base_annual_parts_units
    trigger: "any product family coverage lookup"
    algorithm: tiered_pricing
    formula: |
      BASE_ANNUAL_PARTS_UNITS per product_family:
        EXCAVATION: 40, EARTHMOVING: 48, COMPACTION: 28,
        POWER_SYSTEMS: 60, LIFT_TRUCK: 36
    constants:
      EXCAVATION: 40
      EARTHMOVING: 48
      COMPACTION: 28
      POWER_SYSTEMS: 60
      LIFT_TRUCK: 36
  - name: coverage_multiplier
    trigger: "any coverage lookup for a machine_serial"
    algorithm: threshold
    formula: |
      if the serial is covered by a SupportAgreement with status ACTIVE and plan_tier PREMIUM: 1.5
      else if covered by a SupportAgreement with status ACTIVE and plan_tier PLUS: 1.25
      else: 1.0
      constants:
        PREMIUM_COVERAGE: 1.5
        PLUS_COVERAGE: 1.25
      precision: "2 decimal places, round_half_up"
  - name: weight_class_tier_multiplier
    trigger: "machine operating weight changes"
    algorithm: threshold
    formula: |
      lb < 40000 -> 0.8
      lb >= 40000 and lb <= 100000 -> 1.0
      lb > 100000 -> 1.2
      both 40000 and 100000 are inclusive on the middle band
      constants:
        LIGHT_BAND_MAX_EXCLUSIVE: 40000
        MIDDLE_BAND_MIN_INCLUSIVE: 40000
        MIDDLE_BAND_MAX_INCLUSIVE: 100000
        HEAVY_BAND_MIN_EXCLUSIVE: 100000
        LIGHT_MULTIPLIER: 0.8
        MIDDLE_MULTIPLIER: 1.0
        HEAVY_MULTIPLIER: 1.2
      precision: "2 decimal places, round_half_up"
  - name: forecast_parts_demand_units
    trigger: "any change to an ACTIVE MachinePopulationRecord or to the coverage of a machine_serial"
    algorithm: aggregation
    formula: |
      forecast_parts_demand_units(dealer) = SUM over the dealer's ACTIVE
      MachinePopulationRecord rows (status, per record) of
        ceil(base_annual_parts_units(product_family)
             * coverage_multiplier(machine_serial)
             * weight_class_tier_multiplier(machine_operating_weight_lb))
      the ceil is applied PER RECORD and the results are summed
      rounding further: none
      input_set: "MachinePopulationRecord rows with status ACTIVE only; RETIRED rows contribute nothing"
      variants:
        - name: per_record_ceiling
          when: "the canonical forecast served by GET /dealer-network/machine-population-records/forecast"
          difference: "each record's product is rounded up to the next whole unit before summing"
        - name: sum_then_ceiling
          when: "the illustrative variant used to show divergence"
          difference: "the per-record products are summed exactly and the total is rounded up once; for the fixture in the difficulty design this yields 208 where the canonical variant yields 210"
      precision: "whole units; ceil per record breaks ties upward"
  - name: tier_weighted_machine_population
    trigger: "any change to a PartsCommitment.machine_population_units, machine_population_slope, or the year-over-year growth of the population"
    algorithm: aggregation
    formula: |
      tier_weighted_numerator = machine_population_units * machine_population_slope
      if tier_weighted_numerator < 100:          tier = MICRO
      else if tier_weighted_numerator < 500:     tier = SMALL
      else if tier_weighted_numerator < 1500:    tier = MEDIUM
      else:                                      tier = LARGE
      the 100, 500 and 1500 edges belong to the HIGHER tier: a numerator of
      exactly 100 is SMALL, of exactly 1500 is LARGE, of exactly 99.99 is MICRO
      constants:
        MICRO_MAX_EXCLUSIVE: 100
        SMALL_MAX_EXCLUSIVE: 500
        MEDIUM_MAX_EXCLUSIVE: 1500
      precision: "2 decimal places, round_half_up"
  - name: required_stocking_units
    trigger: "PartsCommitment submit, agreement activation, agreement mark-underperforming, and machine population change"
    algorithm: tiered_pricing
    formula: |
      rate_per_machine = 0.101 for a BASIC window
      rate_per_machine = 0.127 for a STANDARD window
      rate_per_machine = 0.152 for a PREMIUM window
      the STANDARD rate is the exact average of the BASIC and PREMIUM rates,
      computed as (0.101 + 0.152) / 2, so a reading that failed to name the
      middle band can only resolve to the average the two named bands imply
      target_from_rate = tier_weighted_numerator * rate_per_machine
      target_from_fill   = planned_annual_units / 800.0
      active_variant = max(ceil(target_from_rate), ceil(target_from_fill))
      final_variant  = max(floor(target_from_rate), floor(target_from_fill))
      a remanufactured-credit reduction from a CERTIFIED rebuild lowers
      required_stocking_units_final while the COMPLETE hard cap stays suspended
      constants:
        BASIC_RATE_PER_MACHINE: 0.101
        STANDARD_RATE_PER_MACHINE: 0.127
        PREMIUM_RATE_PER_MACHINE: 0.152
        PLANNED_ANNUAL_DIVISOR: 800
        STANDARD_FILL_WINDOW_MAX_HOURS: 24
        PREMIUM_FILL_WINDOW_MAX_HOURS: 8
      precision: "whole units; the active variant ceiling-breaks, the final variant floor-breaks"
      variants:
        - name: active
          when: "the stocking level the dealer is measured against, served as required_stocking_units"
          difference: "ceiling per term, i.e. never rounds a term down; for the operative fixture it yields required_stocking_units == 64 from max(ceil(63.5), ceil(62.5))"
        - name: final
          when: "the stocking level used for order acceptance and for PartsCommitment completion"
          difference: "floor per term, so required_stocking_units_final <= required_stocking_units on every input; for the operative fixture it yields required_stocking_units_final == 63 from max(floor(63.5), floor(62.5))"
  - name: availability_target_pct
    trigger: "PartsCommitment submit and any recompute of the stocking mandate"
    algorithm: threshold
    formula: |
      availability_target_pct = 92.0 + min(4.0, 0.1 * max(0, emergency_stocking_target_pct - 60))
      so the surrogate sits at 92.0 for a target of 60 or less and tops out at
      96.0, since the 4.0 cap is reached at a target of 100
      constants:
        BASE_AVAILABILITY_PCT: 92.0
        SLOPE_PER_PCT: 0.1
        SURROGATE_MAX_PCT: 4.0
        SLOPE_KNEE_PCT: 60
      precision: "4 decimal places, round_half_up"
  - name: dealer_coverage_pct
    trigger: "GET /dealer-network/machine-population-records/{id}/coverage-snapshot"
    algorithm: weighted_scoring
    formula: |
      if the machine has an ACTIVE SupportAgreement: coverage = 100 * coverage_multiplier / 1.5
      else: coverage = 100 * machine_population_units / max(1, tier_weighted_numerator)
      precision: "4 decimal places, round_half_up"
  - name: emergency_fill_resolution
    trigger: "POST /dealer-network/service-orders/{id}/record-emergency-fill"
    algorithm: constraint_propagation
    formula: |
      gross_filled_units = sum of sla_hours across the dealer's OPEN RESTRICTION
          service orders whose machine_serial sits on one of the dealer's ACTIVE
          MachinePopulationRecord rows; orders whose machine_serial has no ACTIVE
          population record contribute nothing
      denom = 2 when gross_filled_units <= 8.0 else 4
      the filled quantity is computed from gross_filled_units under one of two
      modes, and the two modes are NOT interchangeable:
        non_orderable_mode (orderable_ref_enabled false): filled = ceil(gross_filled_units / denom)
        orderable_mode     (orderable_ref_enabled true):  filled = floor(gross_filled_units / denom)
      constants:
        DENOM_FIRST_TIER: 2
        DENOM_OVERFLOW: 4
        FIRST_TIER_FILL_MAX: 8.0
      precision: "whole units; the non-orderable mode ceiling-breaks, the orderable mode floor-breaks"
  - name: service_risk_score
    trigger: "ServiceOrder open and any restriction-scope change"
    algorithm: weighted_scoring
    formula: |
      priority_rank = FULL_STOP 3 | METER_RUNNING 2 | HOURS_SPENT 1
      base = priority_rank * 10
      emergency_bonus = 10 when kind == EMERGENCY_FILL else 0
      age_bonus = 5 when the order's machine_serial is covered by an ACTIVE
                  SupportAgreement whose plan_tier is PREMIUM else 0
      risk_score = base + emergency_bonus + age_bonus
      constants:
        PRIORITY_MULTIPLIER: 10
        EMERGENCY_BONUS: 10
        AGE_BONUS: 5
      precision: "integer"
  - name: service_order_sla_outcome
    trigger: "recorded response against a ServiceOrder"
    algorithm: threshold
    formula: |
      met = (sla_hours <= response_window_hours)
      response_window_hours is fixed from the linked PartsCommitment.emergency_fill_window_hours
      note that a response landing exactly on the window is MET
      precision: "boolean; inclusive upper bound"
  - name: restriction_deferral_tier
    trigger: "any restriction-scope change and any resolve of a RESTRICTION order"
    algorithm: aggregation
    formula: |
      deferral_tier = 1 + priority_rank when the ordering target list holds at least one candidate, else 0
      the ordering target list is the dealer's RESTRICTION orders whose status is
      OPEN and whose machine_serial is on the dealer's ACTIVE
      MachinePopulationRecord rows
      candidate ordering, when a tier must be attributed: sla_hours ASC, then
      created_at ASC; never id
      constants:
        EMPTY_TARGET_LIST_TIER: 0
      precision: "integer"
  - name: machine_lifetime_value
    trigger: "any ltv_bonus lookup during performance evaluation"
    algorithm: projection
    formula: |
      if the dealer's PartsCommitment whose product_family matches the serial's
      population record is in status ORDER_READY: core_value = 0, core_fee = 0
      else:
        core_value = core_purchase_value_cents of the dealer's RebuildClaim for
                     this machine_serial with the greatest created_at, ties broken
                     by the larger core_purchase_value_cents, and 0 when no such
                     claim exists
        core_fee = round_half_up(core_value * CERTIFIED_HANDLING_MARGIN, 2)
      parts_value_component = 0
      ltv_bonus = round_half_up((core_value + core_fee + parts_value_component) / 100.0, 2)
    constants:
      CERTIFIED_HANDLING_MARGIN: 0.15
      PARTS_VALUE_COMPONENT: 0
    precision: "2 decimal places, round_half_up"
  - name: market_share_from_observations_pct
    trigger: "PerformanceReview evaluation and the derived Dealer.market_share_pct"
    algorithm: aggregation
    formula: |
      weight by KIND: an observed row carries kind MACHINE at weight 1.0 and
      kind LIGHT at weight 0.5
      numerator   = sum(observed_machine_units * kind_weight) over the dealer's
                    MarketShareObservation rows whose recorded_at falls inside
                    [period_start, period_end)
      denominator = sum(territory_machine_units * kind_weight) over the same rows
      share = 100.0 * numerator / denominator, or 0.0 when the denominator is 0
      representable percentages for a fixture of a single pair of observations
      step by 100 / (2u + 1) as u runs over the integers: 50.0, 40.0, 33.3333,
      28.5714, 25.0, 22.2222, 20.0, 18.1818, 16.6667, 15.3846
      constants:
        MACHINE_WEIGHT: 1.0
        LIGHT_WEIGHT: 0.5
        HALF_WEIGHT_DIVISOR: 0
      precision: "4 decimal places, round_half_up"
  - name: performance_evaluation
    trigger: "POST /dealer-network/performance-reviews/{id}/evaluate"
    algorithm: weighted_scoring
    formula: |
      actual_market_share_pct = 100.0 * actual_territory_machine_units / territory_market_machine_units
      if actual_market_share_pct >= 100.0: performance_ratio_pct = 100.0
      else: performance_ratio_pct = 100.0 * actual_market_share_pct / plan_share_pct
      where plan_share_pct is the linked DealerAgreement.performance_plan_share_pct
      constants:
        TOTAL_SHARE_PCT: 100.0
      variants:
        - name: reported_share_basis
          when: "the canonical ratio the scaffold serves"
          difference: "the ratio is formed from the reported actual_market_share_pct and saturates at 100.0 once the reported share reaches 100, so a plan of 20 percent and a reported share of 120 yields performance_ratio_pct == 100.0"
        - name: uncapped_plan_normalized_basis
          when: "the plan-normalized reading of the same prose"
          difference: "the ratio is formed as 100.0 * actual_market_share_pct / plan_share_pct with no saturation, so the same plan of 20 percent and reported share of 120 yields 600.0; below a reported share of 100 the two bases agree"
      precision: "4 decimal places, round_half_up"
  - name: performance_quality_deficiency
    trigger: "same transition as performance_evaluation"
    algorithm: weighted_scoring
    formula: |
      quality(review) = 100 * met_sla_service_orders / sampled_service_orders
      quality(range) = max(quality) - min(quality) over the whole Dealer's reviews
                       whose status is EVALUATED at the instant this one is evaluated
      quality_deficiency_pp = mean(quality over that set) - quality(this review)
      quality_deficient = quality(range) >= 10.00 percentage points
      constants:
        QUALITY_SPREAD_THRESHOLD_PP: 10.0
      precision: "4 decimal places, round_half_up"
  - name: performance_loyalty_score
    trigger: "same transition as performance_evaluation"
    algorithm: weighted_scoring
    formula: |
      ltv_bonus = machine_lifetime_value() expressed in dollars, plus the
                  PARTIAL_RETURN_PARTS_VALUE_CENTS component
      csi_bonus = 3.0 when performance_ratio_pct >= 100.0, else 0.0
      loyalty_score = performance_ratio_pct + ltv_bonus + csi_bonus
      constants:
        CSI_BONUS_PCT: 3.0
    precision: "2 decimal places, round_half_up"
  - name: certified_core_credit
    trigger: "RebuildClaim approved, core returned, and the batch partial return"
    algorithm: aggregation
    formula: |
      core_value = round_half_up(core_purchase_value_cents * CORE_CREDIT_RATE, 2)
      core_handling_fee = round_half_up(core_value * CERTIFIED_HANDLING_MARGIN, 2)
      core_return_credit_cents = core_value + core_handling_fee
      credited_settlement_units_increment = round_half_up(core_return_credit_cents + 3 * core_value, 2)
      a returned core is priced on this pair, never on a recomputed one
      constants:
        CORE_CREDIT_RATE: 1.4
        CERTIFIED_HANDLING_MARGIN: 0.15
      precision: "2 decimal places, round_half_up"
  - name: certified_rebuild_fee
    trigger: "RebuildClaim approved"
    algorithm: tiered_pricing
    formula: |
      labor_fee_component = round_half_up(rebuild_labor_hours * rate_per_hour, 2)
      rate_per_hour = round_half_up(core_value * 0.0025, 2)
      rebuild_handling_component = round_half_up(core_value * CERTIFIED_HANDLING_MARGIN, 2)
      rebuild_fee_cents = labor_fee_component + rebuild_handling_component
      constants:
        LABOR_RATE_WEIGHT_FACTOR: 0.0025
        CERTIFIED_HANDLING_MARGIN: 0.15
      precision: "2 decimal places, round_half_up"
  - name: dealer_settlement_offset
    trigger: "RebuildClaim core return against a dealer working balance"
    algorithm: waterfall_allocation
    formula: |
      dealer_settlement_offset = arrear_amount_cents - 150 * mean_operating_hours
      where arrear_amount_cents is the commitment's fixed 103040 cents and
      mean_operating_hours is measured over the dealer's ACTIVE
      MachinePopulationRecord rows only
      constants:
        RESTRICTION_UNIT_CENTS: 150
        MANDATE_SETTLEMENT_ARREAR_CENTS: 103040
      precision: "2 decimal places, round_half_up"
  - name: default_deferred_shortage_rule
    trigger: "the deferred re-evaluation armed by a performance-deficient commitment and consumed by the next batch receipt"
    algorithm: decay_function
    formula: |
      the rule does nothing at all when no deferred re-evaluation is armed, and
      a commitment whose arrear_amount_cents is already met is not converted
      shortage = arrear_amount_cents - 1610 * credited_core_units,
      where arrear_amount_cents is 103040 and credited_core_units is the count
      of cores already returned against this commitment
      a returned core therefore settles 1610 cents of the arrear, and the
      deferred re-evaluation fires when credited_core_units reaches 64, since
      63 cores settle only 101430 of the 103040 arrear
      constants:
        MANDATE_SETTLEMENT_ARREAR_CENTS: 103040
        SETTLEMENT_PER_CORE_CENTS: 1610
      precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; the role is a declared role and X-User-ID equals the id of an instance of that role's backing entity when the role is entity-backed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is permitted for the operation; a DealerSalesManager of one dealer cannot act on another dealer's resources"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_referential
    check: "when the X-User-Role equals ServiceTechnicianSupervisor the X-User-ID is read but not compared to the PartsCommitment.dealer_id, so an order opened for one dealer may be reviewed by any technician supervisor"
    error_id: ERR_DEALER_SCOPE_MISMATCH
    http_status: 403
    applies_to:
      - "POST /dealer-network/service-orders/{id}/begin"
      - "POST /dealer-network/service-orders/{id}/record-emergency-fill"

  - priority: 4
    category: existence
    check: "referenced resources exist; body foreign keys are validated in the order the endpoint's input list declares them, left to right"
    error_id: ERR_DEALER_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "the target resource is in a state that admits the operation; every from-state not listed for a trigger is rejected with the operation's invalid-state error"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_safety
    check: "certified-rebuild specification limits and warranty-safety limits: machine_operating_weight_lb against the specification's maximum weight, technician certification minimums against the agreement's certified_technician_count, and the destination of a remanufactured core"
    error_id: ERR_REBUILD_SPEC_EXCEEDED
    http_status: 422
    applies_to:
      - "POST /dealer-network/rebuild-claims/{id}/approve"
      - "POST /dealer-network/rebuild-claims/{id}/deliver"

  - priority: 7
    category: business_constraint
    check: "availability, stocking and mandate limits: the emergency availability target against the stocking mandate's hard cap, plus the aggregate batch reservation condition requested_units > available_commitment_units"
    error_id: ERR_STOCKING_MANDATE_HARD_CAP
    http_status: 409
    applies_to:
      - "POST /dealer-network/parts-commitments/{id}/settle-core-credit"
      - "POST /dealer-network/parts-order-batches"

  - priority: 8
    category: business_fiscal
    check: "the trade-in appraisal against the financed list price: an attached trade-in whose appraised value reaches the list price is refused"
    error_id: ERR_TRADE_IN_APPRAISAL_EXCEEDS_PRICE
    http_status: 409
    applies_to:
      - "POST /dealer-network/equipment-orders/{id}/approve-financing"

  - priority: 9
    category: business_referential
    check: "a machine's serial must be live in the dealer's population before a rebuild claim can be tied to it, and a superseded party registration blocks the decline path"
    error_id: ERR_MACHINE_NOT_IN_POPULATION
    http_status: 409
    applies_to:
      - "POST /dealer-network/rebuild-claims"

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

