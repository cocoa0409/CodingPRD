            - { call: "POST /credit/appraisals/${aprl2}/receive-report", payload: { appraised_value_cents: 400000000, orderly_liquidation_value_cents: 380000000 }, as: AppraisalManager, as_user_id: "${apm}" }
            - { call: "POST /credit/appraisals/${aprl2}/review", payload: { outcome: ACCEPTED }, as: AppraisalManager, as_user_id: "${apm}" }
            - { call: "POST /credit/loan-applications/${app2}/submit-to-committee", payload: {}, as: CreditAnalyst, as_user_id: "${an}", captures: { app2_v: $.data.version, prop2: $.data.proposed_amount_cents } }
            - { call: "POST /credit/committee-sessions", payload: { level: SMALL, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T15:00:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { sess1: $.data.id } }
            - { call: "POST /credit/committee-sessions", payload: { level: STANDARD, starts_at: "2026-08-10T15:00:00Z", ends_at: "2026-08-10T16:00:00Z" }, as: CommitteeChair, as_user_id: "${ch}", captures: { sess2: $.data.id } }
            - { call: "POST /credit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T14:30:00Z" }, as: BankAdmin }
