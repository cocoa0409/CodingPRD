          - errors[ERR_AFFORDABLE_COMMITMENT_SHORTFALL]
          - endpoints[PATCH /jda/agreements/{id}]
        distinguishing_aspect: |
          An agreement committing 45 affordable units against a selected proposal that promised 50 clears the
          15-pct minimum at creation but is refused 409 ERR_AFFORDABLE_COMMITMENT_SHORTFALL at
          submit-for-review; PATCHing the commitment to 50 makes the same submit succeed.
        test_recipe:
          setup:
            - "DRAFTING agreement with affordable_units_committed 45 against a proposal promising 50 of 200"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-050", name: "Viburnum Court Parcel", address_line: "50 Viburnum Ct", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/developers"
              payload: { legal_name: "Alder Transit Partners LLC", contact_email: "dev-a@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/solicitations"
              payload: { solicitation_type: "RFP", response_deadline: "2026-09-15T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15, min_proposals_required: 1, joint_use_required: false }
              as: RealEstateOfficer
              captures: { sol_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/issue"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_a}", proposed_structure: "GROUND_LEASE", proposed_annual_rent_cents: 2400000, affordable_units: 50, total_units: 200, transit_ridership_uplift: 600, design_compliance_score: 88, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { prop_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/negotiation-periods"
              payload: { proposal_id: "${prop_a}", start_date: "2026-08-15", end_date: "2027-01-15" }
              as: RealEstateOfficer
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: RealEstateOfficer
              captures: { site_v1: $.data.version }
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "INCOME_APPROACH", appraised_value_cents: 48500000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-20", expected_site_version: "${site_v1}" }
              as: ValuationOfficer
              captures: { val_a: $.data.id }
            - call: "POST /jda/valuations/${val_a}/certify"
              payload: { }
              as: ValuationOfficer
            - call: "POST /jda/agreements"
              payload: { site_id: "${site_a}", developer_id: "${dev_a}", proposal_id: "${prop_a}", valuation_id: "${val_a}", structure: "GROUND_LEASE", term_years: 20, base_rent_cents: 2000000, revenue_share_pct: 0.05, projected_gross_revenue_cents: 12000000, affordable_units_committed: 45, total_units: 200, site_area_share_pct: 60, joint_use_committed: false }
              as: RealEstateOfficer
              captures: { jda_a: $.data.id, committed_before: $.data.affordable_units_committed, credit_before: $.data.capital_credit_cents }
          trigger:
            - call: "POST /jda/agreements/${jda_a}/submit-for-review"
              payload: { }
              as: RealEstateOfficer
              as_user_id: "reo-001"
              captures: { err: $.data.error_id }
            - call: "PATCH /jda/agreements/${jda_a}"
              payload: { affordable_units_committed: 50 }
              as: RealEstateOfficer
              captures: { committed_after: $.data.affordable_units_committed, credit_after: $.data.capital_credit_cents }
            - call: "POST /jda/agreements/${jda_a}/submit-for-review"
              payload: { }
              as: RealEstateOfficer
              as_user_id: "reo-001"
              captures: { neg: $.data.negotiation_status }
          assert:
            - "${committed_before} == 45 and ${credit_before} == 286000"
            - "First trigger call returns HTTP 409 and ${err} == ERR_AFFORDABLE_COMMITMENT_SHORTFALL"
            - "${committed_after} == 50 and ${credit_after} == 286000"
            - "Third trigger call returns HTTP 200 and ${neg} == AGENCY_REVIEW"
            - "JointDevelopmentAgreement.${jda_a}.negotiation_status == AGENCY_REVIEW"

      - name: corner_release_below_readiness_threshold_returns_site_not_ready
        claim_type: error_triggerable
        grounds:
          - validations[priority=11]
          - errors[ERR_SITE_NOT_READY]
        excluded_because:
          difficulty_instance: release_for_solicitation_readiness_boundary_70_00_versus_69_99
          rationale: |
            The §1.8 boundary_precision_check instance already contrasts a 69.99 CONDITIONAL site refused
            with ERR_SITE_NOT_READY against a 70.00 READY site released successfully.

      - name: corner_debarred_developer_named_on_agreement_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - errors[ERR_DEVELOPER_DEBARRED]
        excluded_because:
          difficulty_instance: agreement_create_site_state_beats_developer_debarment
          rationale: |
            That §1.8 instance repairs the site state and then asserts ERR_DEVELOPER_DEBARRED for the same
            debarred developer, which is the only trigger this error has.

      - name: corner_close_without_responsive_proposals_returns_no_responsive_proposals
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_RESPONSIVE_PROPOSALS]
          - state_machines.Solicitation[ISSUED->CLOSED]
        excluded_because:
          difficulty_instance: solicitation_close_with_zero_responsive_proposals
          rationale: |
            The §1.8 combinatorial empty-set instance already closes a solicitation with zero responsive
            proposals against min_proposals_required 1 and asserts ERR_NO_RESPONSIVE_PROPOSALS.

      - name: corner_colliding_negotiation_period_returns_overlap
        claim_type: error_triggerable
        grounds:
          - validations[priority=52]
          - errors[ERR_NEGOTIATION_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: negotiation_period_closed_closed_boundary_day_collision
          rationale: |
            The §1.8 resource_temporal_overlap instance already drives the closed-closed collision on the
            shared boundary day and asserts ERR_NEGOTIATION_PERIOD_OVERLAP, then accepts the next day.

      - name: corner_uncertified_valuation_blocks_submit_for_review
        claim_type: error_triggerable
        grounds:
          - validations[priority=38]
          - errors[ERR_VALUATION_NOT_CERTIFIED]
          - errors[ERR_BELOW_PERMISSIBLE_FLOOR]
        excluded_because:
          difficulty_instance: submit_for_review_valuation_referential_beats_below_floor_fiscal
          rationale: |
            Both ERR_VALUATION_NOT_CERTIFIED and ERR_BELOW_PERMISSIBLE_FLOOR are triggered in that single
            §1.8 conflict instance, in that order, on POST /jda/agreements/{id}/submit-for-review.

      - name: corner_staging_window_close_twice_returns_not_closable
        claim_type: error_triggerable
        grounds:
          - validations[priority=24]
          - errors[ERR_STAGING_WINDOW_NOT_CLOSABLE]
        excluded_because:
          difficulty_instance: shared_facility_bay_count_conserved_across_staging_close_and_reclose
          rationale: |
            The §1.8 compensating_invariant instance closes an APPROVED window and then re-closes it,
            asserting ERR_STAGING_WINDOW_NOT_CLOSABLE and an unchanged available_bay_capacity.

      - name: corner_staging_approval_without_replacement_returns_incomplete
        claim_type: error_triggerable
        grounds:
          - validations[priority=41]
          - errors[ERR_FACILITY_REPLACEMENT_INCOMPLETE]
        excluded_because:
          difficulty_instance: staging_approval_gated_on_facility_replacement_in_place
          rationale: |
            That §1.8 cross_entity_state_dependency instance approves a staging window only after the
            replacement reaches INTERIM_IN_PLACE, asserting ERR_FACILITY_REPLACEMENT_INCOMPLETE before it.

      - name: corner_third_extension_returns_max_extensions_reached
        claim_type: error_triggerable
        grounds:
          - validations[priority=54]
          - errors[ERR_MAX_EXTENSIONS_REACHED]
        excluded_because:
          difficulty_instance: agreement_parallel_dimensions_with_revision_cycle
          rationale: |
            The cumulative extension ceiling is exercised as a rate_threshold_triggers claim in the
            cross_cutting_layers section of this file (corner_extension_ceiling_is_cumulative_not_windowed);
            this errors-section stub only records that the error is covered there rather than twice.

