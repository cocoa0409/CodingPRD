          - validations[17]
          - errors.ERR_PATTERN_NOT_CONFIRMABLE
        distinguishing_aspect: |
          The confirmability gate is an instantaneous three-part threshold and the
          concentration leg is the one whose boundary is easiest to get wrong,
          because it is a ratio rounded to four places compared with `>=`. Two models
          carry five identical-severity incidents each, differing ONLY in the hazard
          tally: 3 of 5 gives exactly 0.6000 and must be confirmable, 2 of 5 gives
          0.4000 and must not, while incident_count (5 >= 3) and risk_index (16.50 and
