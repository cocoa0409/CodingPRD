scenario: |
  generate task hard than expert level! 1107. Membership Association Dues & Renewal Administration (professional membership association): membership category & dues schedule, renewal cycle (anniversary vs calendar) & grace period, auto-renew authorization & failed payment retry, lapse/reinstatement rules & benefit suspension, chapter/affiliate dues sharing, member benefit entitlement & directory listing, dues increase communication & retention risk, non-dues revenue attribution

domain_name: membership-dues-renewal
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: MembershipCategory
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique category code (e.g. PROFESSIONAL, ASSOCIATE, STUDENT, RETIRED, LIFE)" }
      - { name: name, type: string, source: input, description: "Human-readable category name" }
      - { name: is_voting, type: boolean, source: input, description: "Whether category carries voting rights" }
      - { name: is_directory_eligible, type: boolean, source: input, description: "Whether members of this category appear in the public directory" }
      - { name: allows_auto_renew, type: boolean, source: input, description: "Whether members may enroll in auto-renewal" }
      - { name: lapse_grace_days, type: integer, source: input, description: "Grace period in days after expiry before membership lapses" }
      - { name: reinstatement_window_days, type: integer, source: input, description: "Days after lapse during which reinstatement (not new join) is allowed" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED — RETIRED categories cannot be selected on new joins" }

  - name: DuesSchedule
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> MembershipCategory.id; category this schedule prices" }
      - { name: effective_from, type: datetime, source: input, description: "ISO8601 date from which this schedule applies (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "ISO8601 date on which this schedule stops applying (exclusive); null = open-ended" }
      - { name: annual_amount_cents, type: integer, source: input, description: "Base national annual dues in cents" }
      - { name: chapter_share_bps, type: integer, source: input, description: "Basis points (0-10000) of national dues remitted to home chapter per paid invoice" }
      - { name: increase_notice_days, type: integer, source: input, description: "Required days between dues-increase notice and effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED | RETIRED" }

  - name: Chapter
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique chapter code" }
      - { name: name, type: string, source: input, description: "Chapter name" }
      - { name: is_affiliate, type: boolean, source: input, description: "True for affiliate (non-geographic) chapters" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DISSOLVED" }

  - name: RenewalCyclePolicy
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique policy code" }
      - { name: mode, type: enum, source: input, description: "ANNIVERSARY | CALENDAR — governs how period_end is computed" }
      - { name: calendar_anchor_month, type: integer, source: input, description: "For CALENDAR mode: 1-12 month on which every period ends; ignored for ANNIVERSARY" }
      - { name: calendar_anchor_day, type: integer, source: input, description: "For CALENDAR mode: 1-31 day on which every period ends; ignored for ANNIVERSARY" }
      - { name: proration_method, type: enum, source: input, description: "PRO_RATA_DAILY | FULL_PERIOD | NONE — how mid-period joins are billed" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique email; used as login identity" }
      - { name: full_name, type: string, source: input, description: "Member display name" }
      - { name: category_id, type: string, source: input, description: "FK -> MembershipCategory.id; current membership category" }
      - { name: home_chapter_id, type: string, source: input, description: "FK -> Chapter.id; chapter receiving dues-share" }
      - { name: cycle_policy_id, type: string, source: input, description: "FK -> RenewalCyclePolicy.id; governing cycle" }
      - { name: joined_at, type: datetime, source: input, description: "ISO8601 initial join timestamp; anniversary anchor for ANNIVERSARY mode" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | GRACE | LAPSED | REINSTATED | EXPELLED | RESIGNED" }
      - { name: current_period_start, type: datetime, source: computed, description: "Start of currently paid-through membership period" }
      - { name: current_period_end, type: datetime, source: computed, description: "End of currently paid-through membership period" }
      - { name: lifetime_dues_paid_cents, type: integer, source: computed, description: "Sum over DuesInvoice where payment_status=SETTLED of amount_cents" }
      - { name: risk_score, type: integer, source: computed, description: "0-100 retention risk score; derived from failed_payment_count, days_to_expiry, benefit_usage_30d" }

  - name: MembershipTerm
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: period_start, type: datetime, source: system, description: "Inclusive period start" }
      - { name: period_end, type: datetime, source: system, description: "Exclusive period end" }
      - { name: opened_by, type: enum, source: system, description: "JOIN | RENEWAL | REINSTATEMENT | ADMIN_ADJUST" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | VOID" }

  - name: DuesInvoice
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; billed member" }
      - { name: membership_term_id, type: string, source: system, description: "FK -> MembershipTerm.id; term this invoice pays for" }
      - { name: dues_schedule_id, type: string, source: system, description: "FK -> DuesSchedule.id; pinned schedule version at issuance" }
      - { name: amount_cents, type: integer, source: computed, description: "Computed dues (proration applied) per calculation dues_invoice_amount" }
      - { name: chapter_share_cents, type: integer, source: computed, description: "Portion owed to home chapter; computed on SETTLED" }
      - { name: issued_at, type: datetime, source: system, description: "Invoice issue timestamp" }
      - { name: due_at, type: datetime, source: system, description: "Payment due date; equals period_end for renewals" }
      - { name: settled_at, type: datetime, source: system, description: "Timestamp payment reached SETTLED; null until settled" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | SETTLED | FAILED_RETRYABLE | FAILED_FINAL | REFUNDED | WRITTEN_OFF" }
      - { name: fulfillment_status, type: enum, source: system, description: "NOT_DUE | COVERAGE_ACTIVE | COVERAGE_SUSPENDED | COVERAGE_ENDED — parallel dimension" }

  - name: PaymentAttempt
    parent: DuesInvoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> DuesInvoice.id; target invoice" }
      - { name: attempt_index, type: integer, source: system, description: "1-based sequence within invoice" }
      - { name: attempted_at, type: datetime, source: system, description: "When charge was attempted" }
      - { name: outcome, type: enum, source: system, description: "SUCCEEDED | DECLINED_TRANSIENT | DECLINED_HARD" }
      - { name: decline_code, type: string, source: system, description: "Gateway decline code; null on success" }

  - name: AutoRenewAuthorization
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: payment_method_token, type: string, source: input, description: "Tokenized payment instrument reference" }
      - { name: authorized_at, type: datetime, source: system, description: "When consent was captured" }
      - { name: revoked_at, type: datetime, source: system, description: "When consent was revoked; null while active" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | SUSPENDED_HARD_DECLINE" }

  - name: BenefitEntitlement
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: benefit_code, type: enum, source: input, description: "JOURNAL_ACCESS | CONFERENCE_DISCOUNT | CERTIFICATION_REGISTRY | VOTING_BALLOT | DIRECTORY_LISTING" }
      - { name: granted_at, type: datetime, source: system, description: "When entitlement was granted" }
      - { name: suspended_at, type: datetime, source: system, description: "When entitlement was suspended; null while live" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED" }

  - name: DirectoryListing
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: display_name, type: string, source: input, description: "Public display name" }
      - { name: specialty_tags, type: array, source: input, description: "List of specialty tags" }
      - { name: is_public, type: boolean, source: input, description: "Opt-in flag for public visibility" }
      - { name: visibility_state, type: enum, source: system, description: "VISIBLE | HIDDEN_LAPSE | HIDDEN_OPT_OUT | HIDDEN_CATEGORY" }

  - name: DuesIncreaseNotice
    parent: DuesSchedule
    common_fields: true
    fields:
      - { name: schedule_id, type: string, source: system, description: "FK -> DuesSchedule.id; the schedule carrying the increase" }
      - { name: noticed_at, type: datetime, source: system, description: "When notice was broadcast" }
      - { name: effective_from, type: datetime, source: system, description: "Mirrors schedule.effective_from" }
      - { name: audience_size, type: integer, source: system, description: "Number of ACTIVE members notified" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SENT | CANCELLED" }

  - name: RevenueAttribution
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member this revenue is attributed to" }
      - { name: revenue_kind, type: enum, source: input, description: "CONFERENCE_REGISTRATION | PUBLICATION_SALE | CERTIFICATION_FEE | DONATION — never DUES" }
      - { name: amount_cents, type: integer, source: input, description: "Non-dues amount attributed (positive cents)" }
      - { name: occurred_at, type: datetime, source: input, description: "When the revenue event occurred" }
      - { name: fiscal_period, type: string, source: computed, description: "YYYY-MM derived from occurred_at at record creation" }

  - name: ReinstatementRequest
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; lapsed member" }
      - { name: requested_at, type: datetime, source: system, description: "When the request was filed" }
      - { name: back_dues_invoice_id, type: string, source: system, description: "FK -> DuesInvoice.id; back-dues invoice issued for the lapsed gap" }
      - { name: decided_at, type: datetime, source: system, description: "When the request was approved or rejected; null while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | EXPIRED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: PENDING_VERIFICATION
    terminal_states: [EXPELLED, RESIGNED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /api/members/{id}/verify"
        actor: Member
        preconditions:
          - "Member.status == PENDING_VERIFICATION"
          - "Initial DuesInvoice for the opening term is in payment_status == SETTLED"
        side_effects:
          - "Sets Member.current_period_start and current_period_end from initial MembershipTerm"
          - "Initializes Member.lifetime_dues_paid_cents from the settled invoice"
          - "Creates BenefitEntitlement rows per category defaults with status ACTIVE"
          - "Creates DirectoryListing with visibility_state = VISIBLE if category.is_directory_eligible AND is_public=true, else HIDDEN_OPT_OUT or HIDDEN_CATEGORY"
          - "Increments Member.version by 1"

      - from: ACTIVE
        to: GRACE
        trigger: "system scheduler when now_utc > current_period_end AND no SETTLED renewal invoice covers the next period"
        actor: system
        preconditions:
          - "Member.status == ACTIVE"
          - "now_utc > current_period_end"
        side_effects:
          - "All BenefitEntitlement rows for member -> SUSPENDED"
          - "DirectoryListing.visibility_state -> HIDDEN_LAPSE"
          - "Member.version incremented"

      - from: GRACE
        to: ACTIVE
        trigger: "POST /api/dues-invoices/{id}/payments succeeds AND settles renewal invoice"
        actor: Member
        preconditions:
          - "Member.status == GRACE"
          - "Payment attempt outcome == SUCCEEDED"
        side_effects:
          - "MembershipTerm for new period OPEN with opened_by = RENEWAL"
          - "Member.current_period_start / current_period_end advanced"
          - "All BenefitEntitlement rows SUSPENDED -> ACTIVE"
          - "DirectoryListing.visibility_state -> VISIBLE if is_public and category eligible"
          - "Member.lifetime_dues_paid_cents increased by invoice.amount_cents"
          - "Member.version incremented"

      - from: GRACE
        to: LAPSED
        trigger: "system scheduler when now_utc > current_period_end + category.lapse_grace_days"
        actor: system
        preconditions:
          - "Member.status == GRACE"
          - "now_utc > current_period_end + lapse_grace_days"
        side_effects:
          - "AutoRenewAuthorization (if ACTIVE) -> SUSPENDED_HARD_DECLINE if last attempt was DECLINED_HARD, else unchanged"
          - "DirectoryListing.visibility_state stays HIDDEN_LAPSE"
          - "Member.version incremented"

      - from: LAPSED
        to: REINSTATED
        trigger: "POST /api/members/{id}/reinstatement-requests/{rid}/approve AND back-dues invoice SETTLED"
        actor: MembershipAdministrator
        preconditions:
          - "Member.status == LAPSED"
          - "now_utc <= lapse_timestamp + category.reinstatement_window_days"
          - "ReinstatementRequest.status == PENDING"
          - "Back-dues DuesInvoice payment_status == SETTLED"
        side_effects:
          - "New MembershipTerm OPEN with opened_by = REINSTATEMENT"
          - "Member.status -> ACTIVE (via REINSTATED transient flag -> ACTIVE in same commit)"
          - "All BenefitEntitlement rows -> ACTIVE"
          - "DirectoryListing.visibility_state recomputed per category + is_public"
          - "Member.version incremented"

      - from: LAPSED
        to: EXPELLED
        trigger: "system scheduler when now_utc > lapse_timestamp + category.reinstatement_window_days"
        actor: system
        preconditions:
          - "Member.status == LAPSED"
          - "now_utc > lapse_timestamp + reinstatement_window_days"
        side_effects:
          - "Any PENDING ReinstatementRequest -> EXPIRED"
          - "AutoRenewAuthorization (if not REVOKED) -> REVOKED"
          - "Member.version incremented"

      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /api/members/{id}/resign"
        actor: Member
        preconditions:
          - "Member.status == ACTIVE or GRACE"
        side_effects:
          - "AutoRenewAuthorization -> REVOKED"
          - "All BenefitEntitlement -> REVOKED"
          - "DirectoryListing.visibility_state -> HIDDEN_OPT_OUT"
          - "Open DuesInvoice (payment_status=PENDING or FAILED_RETRYABLE) -> WRITTEN_OFF"
          - "Member.version incremented"

      - from: ACTIVE
        to: EXPELLED
        trigger: "POST /api/members/{id}/expel"
        actor: MembershipAdministrator
        preconditions:
          - "Member.status == ACTIVE or GRACE or LAPSED"
        side_effects:
          - "AutoRenewAuthorization -> REVOKED"
          - "All BenefitEntitlement -> REVOKED"
          - "DirectoryListing.visibility_state -> HIDDEN_OPT_OUT"
          - "Open DuesInvoice -> WRITTEN_OFF"
          - "Member.version incremented"

  - entity: DuesInvoice
    initial_state: "PENDING / NOT_DUE"
    terminal_states: ["SETTLED / COVERAGE_ACTIVE", "REFUNDED / COVERAGE_ENDED", "WRITTEN_OFF / COVERAGE_ENDED"]
    transitions:
      - from: "PENDING / NOT_DUE"
        to: "SETTLED / COVERAGE_ACTIVE"
        trigger: "POST /api/dues-invoices/{id}/payments (outcome=SUCCEEDED)"
        actor: Member
        preconditions:
          - "payment_status IN {PENDING, FAILED_RETRYABLE}"
          - "Invoice not past hard decline exhaustion (failed_attempts < MAX_RETRY)"
        side_effects:
          - "settled_at = now_utc"
          - "MembershipTerm.status -> OPEN for the covered period"
          - "Member.lifetime_dues_paid_cents += amount_cents"
          - "Chapter share ledger accrues chapter_share_cents to member.home_chapter"
          - "Member.version incremented (via ledger sync)"

      - from: "PENDING / NOT_DUE"
        to: "FAILED_RETRYABLE / NOT_DUE"
        trigger: "POST /api/dues-invoices/{id}/payments (outcome=DECLINED_TRANSIENT)"
        actor: Member
        preconditions:
          - "payment_status IN {PENDING, FAILED_RETRYABLE}"
        side_effects:
          - "New PaymentAttempt row appended"
          - "Member.risk_score recomputed"
          - "Member.version incremented"

      - from: "FAILED_RETRYABLE / NOT_DUE"
        to: "FAILED_FINAL / NOT_DUE"
        trigger: "POST /api/dues-invoices/{id}/payments (outcome=DECLINED_HARD) OR system when attempt_index reaches MAX_RETRY"
        actor: system
        preconditions:
          - "payment_status == FAILED_RETRYABLE"
        side_effects:
          - "AutoRenewAuthorization -> SUSPENDED_HARD_DECLINE"
          - "Member.risk_score recomputed"
          - "Member.version incremented"

      - from: "SETTLED / COVERAGE_ACTIVE"
        to: "REFUNDED / COVERAGE_ENDED"
        trigger: "POST /api/dues-invoices/{id}/refund"
        actor: MembershipAdministrator
        preconditions:
          - "payment_status == SETTLED"
          - "now_utc < current_period_end (no refund after coverage ended)"
        side_effects:
          - "Member.lifetime_dues_paid_cents -= amount_cents"
          - "Chapter share ledger debits chapter_share_cents from member.home_chapter"
          - "Member.current_period_end reset to previous paid-through date"
          - "If no remaining SETTLED coverage, Member transitions ACTIVE -> GRACE with immediate effect"
          - "All BenefitEntitlement -> SUSPENDED"
          - "Member.version incremented"

      - from: "PENDING / NOT_DUE"
        to: "WRITTEN_OFF / COVERAGE_ENDED"
        trigger: "POST /api/members/{id}/resign or POST /api/members/{id}/expel cascades"
        actor: system
        preconditions:
          - "Member transition to RESIGNED or EXPELLED"
        side_effects:
          - "Invoice remains readable for audit"

  - entity: AutoRenewAuthorization
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/members/{id}/auto-renew/revoke"
        actor: Member
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "revoked_at = now_utc"

      - from: ACTIVE
        to: SUSPENDED_HARD_DECLINE
        trigger: "system on DuesInvoice -> FAILED_FINAL"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects: []

      - from: SUSPENDED_HARD_DECLINE
        to: ACTIVE
        trigger: "POST /api/members/{id}/auto-renew/reactivate (new payment method)"
        actor: Member
        preconditions:
          - "status == SUSPENDED_HARD_DECLINE"
        side_effects:
          - "payment_method_token replaced"

  - entity: ReinstatementRequest
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/members/{id}/reinstatement-requests/{rid}/approve"
        actor: MembershipAdministrator
        preconditions:
          - "Member.status == LAPSED"
          - "within reinstatement_window_days"
          - "back-dues DuesInvoice SETTLED"
        side_effects:
          - "Member LAPSED -> REINSTATED -> ACTIVE"

      - from: PENDING
        to: REJECTED
        trigger: "POST /api/members/{id}/reinstatement-requests/{rid}/reject"
        actor: MembershipAdministrator
        preconditions:
          - "ReinstatementRequest.status == PENDING"
        side_effects: []

      - from: PENDING
        to: EXPIRED
        trigger: "system scheduler when now_utc > lapse_timestamp + reinstatement_window_days"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DuesSchedule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/dues-schedules/{id}/publish"
        actor: DuesAdministrator
        preconditions:
          - "Increase notice requirements satisfied (see dues_increase_notice_gap calculation)"
          - "No overlapping PUBLISHED schedule for same category_id with colliding [effective_from, effective_to)"
        side_effects:
          - "Any previously PUBLISHED schedule for same category -> SUPERSEDED at effective_from"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system on publication of newer schedule for same category"
        actor: system
        preconditions: []
        side_effects: []

      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /api/dues-schedules/{id}/retire"
        actor: DuesAdministrator
        preconditions:
          - "No PENDING DuesInvoice references this schedule"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on Member.version)
# =============================================================================
concurrency_rules:
  - rule_id: member-resign-stale-version
    parent_entity: Member
    write_endpoint: "POST /api/members/{id}/resign"
    occ_field: "expected_member_version"
    description: |
      Resignation against a Member whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. The
      second (strictly sequential) request observes an unchanged Member
      state for the fields it cares about, so the conflict is a true
      stale-write, resolved via OCC.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: member-auto-renew-revoke-stale-version
    parent_entity: Member
    write_endpoint: "POST /api/members/{id}/auto-renew/revoke"
    occ_field: "expected_member_version"
    description: |
      Auto-renew revocation against a Member whose version has advanced
      since the client last observed it is rejected with
      ERR_STALE_VERSION. This catches the case where another writer has
      just mutated the Member (e.g., via a renewal settle cascade) and
      the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: dues_invoice_amount
    trigger: "DuesInvoice creation (initial join or renewal generation)"
    algorithm: tiered_pricing
    formula: |
      base_cents = schedule.annual_amount_cents
      mode = member.cycle_policy.mode
      if mode == ANNIVERSARY:
        # Anniversary mode: full annual period anchored to joined_at
        amount_cents = base_cents
        period_start = anchor anniversary date
        period_end = period_start + 1 year
      elif mode == CALENDAR:
        # Calendar mode: period ends at next (calendar_anchor_month, calendar_anchor_day)
        period_start = now_utc.date
        period_end = next occurrence of (calendar_anchor_month, calendar_anchor_day) strictly after period_start
        if proration_method == PRO_RATA_DAILY:
          days_remaining = (period_end - period_start).days
          days_in_year = 366 if is_leap_year(period_start.year) else 365
          amount_cents = round_half_up(base_cents * days_remaining / days_in_year)
        elif proration_method == FULL_PERIOD:
          amount_cents = base_cents
        else: # NONE
          amount_cents = base_cents
    input_set: "DuesSchedule.status == PUBLISHED and effective_from <= now_utc < COALESCE(effective_to, +inf) for member.category_id"
    constants:
      DAYS_IN_NON_LEAP: 365
      DAYS_IN_LEAP: 366
    precision: "integer cents, round_half_up"
    variants:
      - name: anniversary_variant
        when: "RenewalCyclePolicy.mode == ANNIVERSARY"
        difference: "Always bills full base_cents; period anchored to Member.joined_at"
      - name: calendar_prorated_variant
        when: "RenewalCyclePolicy.mode == CALENDAR AND proration_method == PRO_RATA_DAILY"
        difference: "Bills base_cents * days_remaining / days_in_year rounded half-up"

  - name: chapter_share_amount
    trigger: "DuesInvoice transitions to SETTLED (payment captured)"
    algorithm: aggregation
    formula: |
      chapter_share_cents = round_half_up(amount_cents * chapter_share_bps / 10000)
      national_share_cents = amount_cents - chapter_share_cents
      # rounding order matters: compute chapter_share first, subtract for national
    input_set: "DuesInvoice.payment_status transitions from PENDING/FAILED_RETRYABLE to SETTLED"
    constants:
      BPS_DENOM: 10000
    precision: "integer cents, round_half_up, chapter_share computed BEFORE national_share"

  - name: dues_increase_notice_gap
    trigger: "DuesSchedule DRAFT -> PUBLISHED when new schedule carries an annual_amount_cents > prior published schedule for same category"
    algorithm: threshold
    formula: |
      if prior_published_schedule exists AND new.annual_amount_cents > prior.annual_amount_cents:
        required_gap_days = new.increase_notice_days
        actual_gap_days = (new.effective_from - notice.noticed_at).days
        if actual_gap_days < required_gap_days:
          reject with ERR_INCREASE_NOTICE_GAP
      # boundary: actual_gap_days == required_gap_days is ALLOWED (>= not >)
    input_set: "DuesSchedule being published + most recent prior PUBLISHED schedule for same category_id + linked DuesIncreaseNotice"
    constants:
      BOUNDARY_OP: ">="

  - name: member_risk_score
    trigger: "any change to Member's invoices, benefit usage, or time-to-expiry"
    algorithm: weighted_scoring
    formula: |
      # Higher score = higher churn risk; range 0..100
      failed_payment_component = min(40, 20 * failed_payment_count_90d)
      expiry_component = max(0, 30 - floor(days_to_current_period_end / 2))   # 0 if >60 days out
      usage_component = max(0, 30 - benefit_usage_events_30d)                  # 0 if >=30 events
      risk_score = clamp(0, 100, failed_payment_component + expiry_component + usage_component)
    input_set: "Member.status IN {ACTIVE, GRACE, LAPSED}"
    constants:
      FAILED_CAP: 40
      EXPIRY_CAP: 30
      USAGE_CAP: 30
    precision: "integer"

  - name: non_dues_revenue_attribution
    trigger: "RevenueAttribution creation"
    algorithm: aggregation
    formula: |
      fiscal_period = strftime(occurred_at, "%Y-%m")
      # attribution does NOT affect member lifetime_dues_paid_cents (dues-only ledger)
      # total_non_dues_cents(member, fiscal_period) = sum(amount_cents for RevenueAttribution where member_id=member AND fiscal_period=fp)
    input_set: "RevenueAttribution rows where revenue_kind != DUES (dues revenue never appears here)"
    precision: "integer cents"

  - name: reinstatement_back_dues
    trigger: "ReinstatementRequest creation"
    algorithm: chronological
    formula: |
      # Walk the gap from lapse date forward through missed renewal periods,
      # applying the schedule in force at each missed period's period_start
      cursor = lapse_date
      total_back_dues_cents = 0
      periods_missed = []
      while cursor < request_date:
        sched = schedule_in_force(member.category_id, cursor)
        periods_missed.append((cursor, cursor + 1_year, sched))
        total_back_dues_cents += dues_invoice_amount(sched, member.cycle_policy, cursor)
        cursor = cursor + 1_year
      # Order matters: must walk forward chronologically because schedule changes year-over-year
    input_set: "Member.status == LAPSED; MembershipTerm history for member"
    precision: "integer cents"

  - name: benefit_suspension_propagation
    trigger: "Member transitions to GRACE, LAPSED, RESIGNED, EXPELLED"
    algorithm: constraint_propagation
    formula: |
      target_status = SUSPENDED if to_state in {GRACE, LAPSED} else REVOKED
      for each BenefitEntitlement where member_id = member.id AND status == ACTIVE:
        entitlement.status = target_status
      # DirectoryListing: visibility_state recomputed:
      #   VISIBLE iff category.is_directory_eligible AND is_public AND member.status == ACTIVE
      #   else HIDDEN_LAPSE (if GRACE/LAPSED), HIDDEN_OPT_OUT (if !is_public or resigned), HIDDEN_CATEGORY (if !eligible)
    input_set: "All BenefitEntitlement for member; DirectoryListing for member"

# =============================================================================
# Table 4: Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in recognized role set"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path ids and referenced body ids (member, invoice, schedule, chapter, category, etc.) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 4
    category: existence
    check: "Member.email uniqueness on POST /api/members"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: ["POST /api/members"]

  - priority: 5
    category: existence
    check: "MembershipCategory.code uniqueness on POST /api/membership-categories"
    error_id: ERR_DUPLICATE_CATEGORY_CODE
    http_status: 409
    applies_to: ["POST /api/membership-categories"]

  - priority: 6
    category: state
    check: "Target resource state permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 7
    category: state
    check: "OCC expected_member_version matches Member.version on guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /api/members/{id}/resign", "POST /api/members/{id}/auto-renew/revoke"]

  - priority: 8
    category: business_temporal
    check: "DuesSchedule [effective_from, effective_to) must not overlap any PUBLISHED schedule for the same category_id"
    error_id: ERR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: ["POST /api/dues-schedules", "POST /api/dues-schedules/{id}/publish"]

  - priority: 9
    category: business_temporal
    check: "Dues-increase notice gap satisfied: effective_from - noticed_at >= increase_notice_days"
    error_id: ERR_INCREASE_NOTICE_GAP
    http_status: 409
    applies_to: ["POST /api/dues-schedules/{id}/publish"]

  - priority: 10
    category: business_referential
    check: "Member.category_id references ACTIVE MembershipCategory; Member.home_chapter_id references ACTIVE Chapter; Member.cycle_policy_id references ACTIVE RenewalCyclePolicy"
    error_id: ERR_INACTIVE_REFERENCE
    http_status: 422
    applies_to: ["POST /api/members"]

  - priority: 11
    category: business_constraint
    check: "Payment retry cap: failed_attempts_count < MAX_RETRY (5) for a given DuesInvoice"
    error_id: ERR_RETRY_EXHAUSTED
    http_status: 422
    applies_to: ["POST /api/dues-invoices/{id}/payments"]

  - priority: 12
    category: business_constraint
    check: "Auto-renew enrollment requires MembershipCategory.allows_auto_renew == true"
    error_id: ERR_AUTO_RENEW_NOT_ALLOWED
    http_status: 422
    applies_to: ["POST /api/members/{id}/auto-renew/enroll"]

  - priority: 13
    category: business_safety
    check: "Reinstatement window: request must be filed within category.reinstatement_window_days of lapse"
    error_id: ERR_REINSTATEMENT_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /api/members/{id}/reinstatement-requests"]

  - priority: 14
    category: business_safety
    check: "Refund must be issued before current_period_end (no refund after coverage ended)"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /api/dues-invoices/{id}/refund"]

  - priority: 15
    category: business_fiscal
    check: "RevenueAttribution.amount_cents must be positive; revenue_kind must NOT be DUES (dues live in DuesInvoice only)"
    error_id: ERR_INVALID_REVENUE_KIND
    http_status: 422
    applies_to: ["POST /api/members/{id}/revenue-attributions"]

  - priority: 16
    category: business_fiscal
    check: "DuesInvoice refund requires payment_status == SETTLED"
    error_id: ERR_INVOICE_NOT_SETTLED
    http_status: 422
    applies_to: ["POST /api/dues-invoices/{id}/refund"]

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Reference data ---
  - method: POST
    path: "/api/membership-categories"
    description: "Create membership category"
    roles: [DuesAdministrator]
    code: 201
    input: [code, name, is_voting, is_directory_eligible, allows_auto_renew, lapse_grace_days, reinstatement_window_days]
    output: MembershipCategory
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/api/membership-categories/{id}"
    description: "Get category"
    roles: [DuesAdministrator, MembershipAdministrator, Member]
    code: 200
    input: []
    output: MembershipCategory
    side_effects: []

  - method: POST
    path: "/api/chapters"
    description: "Create chapter/affiliate"
    roles: [DuesAdministrator]
    code: 201
    input: [code, name, is_affiliate]
    output: Chapter
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/api/chapters/{id}"
    description: "Get chapter"
    roles: [DuesAdministrator, MembershipAdministrator, Member]
    code: 200
    input: []
    output: Chapter
    side_effects: []

  - method: POST
    path: "/api/renewal-cycle-policies"
    description: "Create renewal cycle policy (ANNIVERSARY or CALENDAR)"
    roles: [DuesAdministrator]
    code: 201
    input: [code, mode, calendar_anchor_month, calendar_anchor_day, proration_method]
    output: RenewalCyclePolicy
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/api/renewal-cycle-policies/{id}"
    description: "Get cycle policy"
    roles: [DuesAdministrator, MembershipAdministrator]
    code: 200
    input: []
    output: RenewalCyclePolicy
    side_effects: []

  # --- Dues schedules ---
  - method: POST
    path: "/api/dues-schedules"
    description: "Create dues schedule in DRAFT"
    roles: [DuesAdministrator]
    code: 201
    input: [category_id, effective_from, effective_to, annual_amount_cents, chapter_share_bps, increase_notice_days]
    output: DuesSchedule
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/dues-schedules/{id}"
    description: "Get dues schedule"
    roles: [DuesAdministrator, MembershipAdministrator]
    code: 200
    input: []
    output: DuesSchedule
    side_effects: []

  - method: GET
    path: "/api/membership-categories/{id}/dues-schedules"
    description: "List schedules for category (sub-resource reverse-reachability)"
    roles: [DuesAdministrator, MembershipAdministrator]
    code: 200
    input: []
    output: "DuesSchedule[]"
    side_effects: []

  - method: POST
    path: "/api/dues-schedules/{id}/publish"
    description: "Publish a DRAFT schedule; triggers increase-notice validation when amount rises"
    roles: [DuesAdministrator]
    code: 200
    input: []
    output: DuesSchedule
    side_effects: ["DRAFT -> PUBLISHED; previously PUBLISHED for category -> SUPERSEDED"]

  - method: POST
    path: "/api/dues-schedules/{id}/retire"
    description: "Retire a PUBLISHED schedule"
    roles: [DuesAdministrator]
    code: 200
    input: []
    output: DuesSchedule
    side_effects: ["PUBLISHED -> RETIRED"]

  # --- Dues increase notices ---
  - method: POST
    path: "/api/dues-schedules/{id}/increase-notices"
    description: "Broadcast a dues-increase notice for a schedule"
    roles: [DuesAdministrator]
    code: 201
    input: []
    output: DuesIncreaseNotice
    side_effects: ["noticed_at = now_utc; audience_size = count(ACTIVE members of category)"]

  - method: GET
    path: "/api/dues-schedules/{id}/increase-notices"
    description: "List notices for schedule (sub-resource reverse-reachability)"
    roles: [DuesAdministrator, MembershipAdministrator]
    code: 200
    input: []
    output: "DuesIncreaseNotice[]"
    side_effects: []

  # --- Members ---
  - method: POST
    path: "/api/members"
    description: "Register a new member; creates initial DuesInvoice and opening MembershipTerm"
    roles: [Member]
    code: 201
    input: [email, full_name, category_id, home_chapter_id, cycle_policy_id, joined_at]
    output: Member
    side_effects:
      - "status=PENDING_VERIFICATION"
      - "Initial MembershipTerm (status=OPEN, opened_by=JOIN) created"
      - "Initial DuesInvoice created with amount_cents per dues_invoice_amount calculation"
      - "Member.version initialized to 1"

  - method: GET
    path: "/api/members/{id}"
    description: "Get member"
    roles: [Member, MembershipAdministrator, DuesAdministrator]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/api/members"
    description: "List members with optional filters"
    roles: [MembershipAdministrator, DuesAdministrator]
    code: 200
    input: ["status?", "category_id?", "home_chapter_id?", "cycle_policy_id?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: POST
    path: "/api/members/{id}/verify"
    description: "Mark member verified (PENDING_VERIFICATION -> ACTIVE) once initial invoice is settled"
    roles: [Member]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> ACTIVE; entitlements created; directory listing created"]

  - method: POST
    path: "/api/members/{id}/resign"
    description: "Member resigns (OCC-guarded)"
    roles: [Member]
    code: 200
    input: [expected_member_version]
    output: Member
    side_effects:
      - "Member -> RESIGNED; entitlements REVOKED; auto-renew REVOKED; open invoices WRITTEN_OFF"
      - "Increments Member.version by 1"

  - method: POST
    path: "/api/members/{id}/expel"
    description: "Administrator expels member"
    roles: [MembershipAdministrator]
    code: 200
    input: []
    output: Member
    side_effects: ["Member -> EXPELLED; same cascade as resign"]

  # --- MembershipTerms ---
  - method: GET
    path: "/api/members/{id}/membership-terms"
    description: "List terms for member (sub-resource reverse-reachability)"
    roles: [Member, MembershipAdministrator, DuesAdministrator]
    code: 200
    input: []
    output: "MembershipTerm[]"
    side_effects: []

  # --- Dues Invoices ---
  - method: GET
    path: "/api/members/{id}/dues-invoices"
    description: "List dues invoices for member (sub-resource reverse-reachability)"
    roles: [Member, MembershipAdministrator, DuesAdministrator]
    code: 200
    input: ["payment_status?"]
    output: "DuesInvoice[]"
    side_effects: []

  - method: GET
    path: "/api/dues-invoices/{id}"
    description: "Get single invoice"
    roles: [Member, MembershipAdministrator, DuesAdministrator]
    code: 200
    input: []
    output: DuesInvoice
    side_effects: []

  - method: GET
    path: "/api/dues-invoices"
    description: "Filtered list of dues invoices (filtered-list reverse-reachability for DuesInvoice FKs)"
    roles: [MembershipAdministrator, DuesAdministrator]
    code: 200
    input: ["member_id?", "membership_term_id?", "dues_schedule_id?", "payment_status?", "limit?", "offset?"]
    output: "DuesInvoice[]"
    side_effects: []

  - method: GET
    path: "/api/dues-invoices/{id}/reinstatement-requests"
    description: "List reinstatement requests whose back-dues invoice is this invoice (sub-resource reverse-reachability for ReinstatementRequest.back_dues_invoice_id)"
    roles: [Member, MembershipAdministrator]
    code: 200
    input: []
    output: "ReinstatementRequest[]"
    side_effects: []

  - method: POST
    path: "/api/dues-invoices/{id}/payments"
    description: "Submit payment attempt for invoice; outcome drives state"
    roles: [Member]
    code: 201
    input: [payment_method_token, simulated_outcome]
    output: PaymentAttempt
    side_effects:
      - "On SUCCEEDED: invoice -> SETTLED; chapter share accrued; term -> OPEN; member lifetime_dues_paid_cents updated"
      - "On DECLINED_TRANSIENT: invoice -> FAILED_RETRYABLE"
      - "On DECLINED_HARD or attempt_index==MAX_RETRY: invoice -> FAILED_FINAL; auto-renew SUSPENDED_HARD_DECLINE"

  - method: POST
    path: "/api/dues-invoices/{id}/refund"
    description: "Refund a SETTLED invoice; reverses chapter share and member paid ledger"
    roles: [MembershipAdministrator]
    code: 200
    input: []
    output: DuesInvoice
    side_effects: ["SETTLED -> REFUNDED; chapter share debited; member ledger debited; benefits suspended"]

  - method: GET
    path: "/api/dues-invoices/{id}/payment-attempts"
    description: "List payment attempts for invoice (sub-resource reverse-reachability)"
    roles: [Member, MembershipAdministrator]
    code: 200
    input: []
    output: "PaymentAttempt[]"
    side_effects: []

  # --- Auto-renew ---
  - method: POST
    path: "/api/members/{id}/auto-renew/enroll"
    description: "Enroll member in auto-renew"
    roles: [Member]
    code: 201
    input: [payment_method_token]
    output: AutoRenewAuthorization
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/api/members/{id}/auto-renew/revoke"
    description: "Revoke auto-renew consent (OCC-guarded)"
    roles: [Member]
    code: 200
    input: [expected_member_version]
    output: AutoRenewAuthorization
    side_effects: ["status -> REVOKED", "Increments Member.version by 1"]

  - method: POST
    path: "/api/members/{id}/auto-renew/reactivate"
    description: "Reactivate after SUSPENDED_HARD_DECLINE with new payment method"
    roles: [Member]
    code: 200
    input: [payment_method_token]
    output: AutoRenewAuthorization
    side_effects: ["status -> ACTIVE"]

  - method: GET
    path: "/api/members/{id}/auto-renew"
    description: "Get current auto-renew authorization (filtered-list reverse-reachability; 0-1 rows)"
    roles: [Member, MembershipAdministrator]
    code: 200
    input: []
    output: "AutoRenewAuthorization[]"
    side_effects: []

  # --- Benefits ---
  - method: GET
    path: "/api/members/{id}/benefit-entitlements"
    description: "List entitlements for member (sub-resource reverse-reachability)"
    roles: [Member, MembershipAdministrator]
    code: 200
    input: []
    output: "BenefitEntitlement[]"
    side_effects: []

  # --- Directory ---
  - method: GET
    path: "/api/members/{id}/directory-listing"
    description: "Get member's directory listing (sub-resource reverse-reachability; 0-1 rows)"
    roles: [Member, MembershipAdministrator]
    code: 200
    input: []
    output: "DirectoryListing[]"
    side_effects: []

  - method: PATCH
    path: "/api/directory-listings/{id}"
    description: "Member updates own listing (display_name, specialty_tags, is_public)"
    roles: [Member]
    code: 200
    input: ["display_name?", "specialty_tags?", "is_public?"]
    output: DirectoryListing
    side_effects: ["visibility_state recomputed per category eligibility, member status, is_public"]

  # --- Reinstatement ---
  - method: POST
    path: "/api/members/{id}/reinstatement-requests"
    description: "File reinstatement request; creates back-dues invoice"
    roles: [Member]
    code: 201
    input: []
    output: ReinstatementRequest
    side_effects:
      - "Back-dues DuesInvoice created with amount per reinstatement_back_dues calculation"
      - "ReinstatementRequest.status = PENDING"

  - method: GET
    path: "/api/members/{id}/reinstatement-requests"
    description: "List reinstatement requests (sub-resource reverse-reachability)"
    roles: [Member, MembershipAdministrator]
    code: 200
    input: []
    output: "ReinstatementRequest[]"
    side_effects: []

  - method: POST
    path: "/api/members/{id}/reinstatement-requests/{rid}/approve"
    description: "Approve reinstatement; member transitions to ACTIVE if back-dues settled"
    roles: [MembershipAdministrator]
    code: 200
    input: []
    output: ReinstatementRequest
    side_effects: ["Member LAPSED -> REINSTATED -> ACTIVE; entitlements restored; new term opened"]

  - method: POST
    path: "/api/members/{id}/reinstatement-requests/{rid}/reject"
    description: "Reject reinstatement"
    roles: [MembershipAdministrator]
    code: 200
    input: []
    output: ReinstatementRequest
    side_effects: []

  # --- Revenue attribution ---
  - method: POST
    path: "/api/members/{id}/revenue-attributions"
    description: "Record non-dues revenue event attributed to member"
    roles: [MembershipAdministrator, DuesAdministrator]
    code: 201
    input: [revenue_kind, amount_cents, occurred_at]
    output: RevenueAttribution
    side_effects: ["fiscal_period derived; non-dues ledger appended; lifetime_dues_paid_cents unchanged"]

  - method: GET
    path: "/api/members/{id}/revenue-attributions"
    description: "List revenue attributions (sub-resource reverse-reachability)"
    roles: [Member, MembershipAdministrator, DuesAdministrator]
    code: 200
    input: ["fiscal_period?"]
    output: "RevenueAttribution[]"
    side_effects: []

  # --- System / scheduler ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance logical clock (test-driving). Server startup default is 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time before any set_current_utc call."
    roles: [DuesAdministrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Triggers scheduler: GRACE transitions, LAPSED transitions, EXPELLED transitions, scheduled renewal invoice generation, EXPIRED reinstatement"

  - method: POST
    path: "/api/_scheduler/run_renewal_cycle"
    description: "Test-driving endpoint: fire the scheduled renewal sweep (issues renewal invoices, triggers auto-renew charges, executes GRACE/LAPSED transitions due)"
    roles: [DuesAdministrator]
    code: 200
    input: []
    output: null
    side_effects:
      - "Issues renewal DuesInvoice for ACTIVE members whose period_end is within renewal_lookahead"
      - "Performs auto-renew charge attempts where authorization is ACTIVE"
      - "Advances due Member state transitions (ACTIVE->GRACE, GRACE->LAPSED, LAPSED->EXPELLED)"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member with email already exists" }
  - { id: ERR_DUPLICATE_CATEGORY_CODE, http: 409, condition: "Category with code already exists" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in wrong state for requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_member_version does not match current Member.version" }
  - { id: ERR_SCHEDULE_OVERLAP, http: 409, condition: "New schedule's [effective_from, effective_to) overlaps existing PUBLISHED schedule for same category" }
  - { id: ERR_INCREASE_NOTICE_GAP, http: 409, condition: "Dues increase published without sufficient increase_notice_days gap between noticed_at and effective_from" }
  - { id: ERR_INACTIVE_REFERENCE, http: 422, condition: "Referenced category, chapter, or cycle policy is not ACTIVE" }
  - { id: ERR_RETRY_EXHAUSTED, http: 422, condition: "Failed payment attempts for this invoice reached MAX_RETRY" }
  - { id: ERR_AUTO_RENEW_NOT_ALLOWED, http: 422, condition: "Category does not permit auto-renew enrollment" }
  - { id: ERR_REINSTATEMENT_WINDOW_EXPIRED, http: 422, condition: "Reinstatement filed outside reinstatement_window_days" }
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 422, condition: "Refund attempted on or after current_period_end" }
  - { id: ERR_INVALID_REVENUE_KIND, http: 422, condition: "RevenueAttribution.revenue_kind invalid (DUES is forbidden in non-dues ledger) or amount_cents <= 0" }
  - { id: ERR_INVOICE_NOT_SETTLED, http: 422, condition: "Refund attempted on invoice with payment_status != SETTLED" }
  - { id: ERR_VERIFICATION_BLOCKED, http: 422, condition: "POST /api/members/{id}/verify before initial DuesInvoice settles" }
  - { id: ERR_MEMBER_NOT_GRACE, http: 409, condition: "Renewal payment on invoice whose Member is not in ACTIVE or GRACE state" }
  - { id: ERR_REINSTATEMENT_HAS_PENDING, http: 409, condition: "Second PENDING reinstatement request for same member" }
  - { id: ERR_NO_AUTO_RENEW_ACTIVE, http: 409, condition: "Reactivate called when authorization is not SUSPENDED_HARD_DECLINE" }

