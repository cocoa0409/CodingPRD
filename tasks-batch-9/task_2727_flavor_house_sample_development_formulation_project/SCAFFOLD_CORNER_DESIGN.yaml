              as: Flavorist
              captures: { f1: "$.data.id" }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
          trigger:
            - call: "GET /formulas/${f1}/composition"
              payload: {}
              as: AccountManager
              captures: { err: "$.data.error_id" }
            - call: "GET /formulas/${f1}"
              payload: {}
              as: AccountManager
          assert:
            - "first trigger call returns HTTP status == 403 with data.error_id == ERR_IP_TIER_FORBIDDEN"
            - "second trigger call returns HTTP status == 200"
            - "Formula.${f1}.confidentiality_tier == TIER_2_RESTRICTED"
            - "Formula.${f1}.bench_cost_per_kg_cents == 2000"

      - name: grant_expiry_equality_flips_the_composition_read_to_forbidden
        claim_type: conditional_action
        grounds:
          - validations[priority=26]
          - entities.DisclosureGrant.fields.status
          - endpoints[POST /_clock/set_current_utc]
          - errors.ERR_DISCLOSURE_GRANT_EXPIRED
        distinguishing_aspect: "The identical read with the identical grant_id succeeds at clock 2026-08-01 and returns ERR_DISCLOSURE_GRANT_EXPIRED (403) once the clock equals expires_at 2026-08-15T00:00:00Z, because ACTIVE requires the clock strictly before expires_at."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; brief BRF-0001 accepted; formula F1 is TIER_2_RESTRICTED, costed, holding GUM-BASE at 100.0000 %."
            - "Grant G1 on (BRF-0001, F1) discloses TIER_2_RESTRICTED at redaction_level FULL and expires at 2026-08-15T00:00:00Z."
