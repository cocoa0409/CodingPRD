      - name: welfare_budget_aggregate_exceeded_by_the_second_protocol_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.priority_45
          - calculations.welfare_commitment_rollup
          - entities.Production.fields.welfare_budget_cents
          - entities.Production.fields.welfare_committed_cents
        distinguishing_aspect: |
          Aggregate claim where the surcharge band is what breaks the budget. A single
          4,000,000 protocol commits 4,160,000 against a 5,000,000 budget and is
          accepted; a further 1,000,000 lifts the subtotal to exactly 5,000,000, which
          crosses BAND_MID_FLOOR_CENTS and re-rates the WHOLE subtotal at 0.07, giving
          5,350,000 and a rejection with ERR_WELFARE_BUDGET_EXCEEDED at 409 — even
          though the raw costs merely equal the budget. The rejected write must leave
          welfare_committed_cents at 4,160,000 with no orphan protocol row.
        test_recipe:
          setup:
            - "One DOCUSOAP production (tier STANDARD) with welfare_budget_cents 5,000,000 and no protocols."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 5000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /casting/productions/${prod_id}/welfare-protocols"
              payload: { kind: "DUTY_OF_CARE_OFFICER", coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-12-31T00:00:00Z", cost_cents: 4000000 }
              as: WelfareOfficer
              captures: { wp1_id: $.data.id, wp1_status: $.data.status }
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: WelfareOfficer
              captures: { committed_ok: $.data.welfare_committed_cents }
            - call: "POST /casting/productions/${prod_id}/welfare-protocols"
              payload: { kind: "MEDICAL_STANDBY", coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-12-31T00:00:00Z", cost_cents: 1000000 }
              as: WelfareOfficer
              captures: { budget_err: $.data.error_id }
            - call: "GET /casting/productions/${prod_id}/welfare-protocols"
              payload: { limit: 10, offset: 0 }
              as: WelfareOfficer
              captures: { wp_total: $.meta.total_count }
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: WelfareOfficer
              captures: { committed_after: $.data.welfare_committed_cents, posture_after: $.data.casting_posture }
          assert:
            - "${wp1_status} == PLANNED"
            - "${committed_ok} == 4160000"
            - "${budget_err} == ERR_WELFARE_BUDGET_EXCEEDED"
            - "HTTP 409 on the second protocol"
            - "${wp_total} == 1"
            - "${committed_after} == 4160000"
            - "${posture_after} == OPEN"

