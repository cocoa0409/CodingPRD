        as: EditorInChief
        captures: {t1: $.data.id}
      trigger:
      - call: POST /comics/titles/${t1}/greenlight
        payload: {}
        as: Retailer
        as_user_id: ${r1}
        captures: {e1: $.data.error_id}
      - call: POST /comics/titles/${t1}/issues
