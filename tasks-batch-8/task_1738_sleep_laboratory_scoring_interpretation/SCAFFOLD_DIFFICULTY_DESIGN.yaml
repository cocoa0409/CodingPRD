            - { call: "POST /scoring-tasks/${tk4}/start", payload: {}, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk4}/submit", payload: { obstructive_apneas: 30, central_apneas: 0, mixed_apneas: 0, hypopneas: 30, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s1}" }
            - { call: "POST /scoring-tasks/${tk4}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /scoring-tasks", payload: { study_id: "${st4}", scorer_id: "${s2}", assignment_kind: "RELIABILITY_RESCORE" }, as: LabDirector, captures: { rt4: $.data.id } }
            - { call: "POST /scoring-tasks/${rt4}/start", payload: {}, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rt4}/submit", payload: { obstructive_apneas: 10, central_apneas: 0, mixed_apneas: 0, hypopneas: 10, reras: 0, epochs_total: 1000, total_recording_time_minutes: 360 }, as: Scorer, as_user_id: "${s2}" }
            - { call: "POST /scoring-tasks/${rt4}/accept", payload: {}, as: InterpretingPhysician, as_user_id: "${dr1}" }
            - { call: "POST /inter-rater-cases", payload: { study_id: "${st4}", primary_task_id: "${tk4}", rescore_task_id: "${rt4}" }, as: LabDirector, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /inter-rater-cases/${c2}/adjudicate", payload: { epochs_concordant: 800 }, as: LabDirector }
          assert:
            - "InterRaterCase.${c2}.concordant == false (percent_agreement 80.0 < 85.0 and ahi_delta == 6.7 > 2.0)"
            - "Scorer.${s2}.consecutive_nonconcordant == 2 (link 1)"
            - "Scorer.${s2}.reliability_status == REMEDIATION (link 2, consecutive threshold — adjudicated count 2 < 3 keeps rolling index null)"
            - "ScoringTask.${tk3}.status == RECALLED (link 3)"
            - "SleepStudy.${st2}.status == SCORING_QUEUED (study reverted by the recall)"

      - name: auth_approval_flips_order_depth2
        grounds:
          - state_machines.InsuranceAuthorization.SUBMITTED_to_APPROVED
          - state_machines.ReferralOrder.AUTH_IN_PROGRESS_to_AUTHORIZED
        distinguishing_aspect: |
          Depth-2 cascade from the decision trigger: the authorization's SUBMITTED->APPROVED
          mutation itself flips the parent ReferralOrder AUTH_IN_PROGRESS->AUTHORIZED;
          different trigger and different chain than the adjudication cascade.
        test_recipe:
          setup:
