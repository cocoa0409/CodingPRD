            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset2_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v_now}" }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "StudentAccount.${student_id}.outstanding_balance_cents == 55000 (SCREEN * A grade discount: 100000*0.55*1.00 = 55000; >= 10000 → SUSPENDED)"
            - "StudentAccount.${student_id}.financial_posture == SUSPENDED"
            - "error_id == ERR_STUDENT_SUSPENDED"
            - "HTTP status == 409"

      - name: loaner_floor_breach_zero_remaining
        grounds:
          - calculations.loaner_pool_allocation
          - endpoints: "POST /program/{progId}/students/{studentId}/loaner-checkouts"
        distinguishing_aspect: |
          Metric: count of remaining LOANER-pool AssetUnits. Boundary:
          program loaner_pool_threshold_pct floor. Reachable via POST
          /loaner-checkouts. Test: with floor=0.10 and DEPLOYABLE count=10,
          floor(0.10*10)=1 unit must remain. After 9 of 10 loaners are
          checked out the next checkout is REJECTED with
          ERR_LOANER_FLOOR_BREACH even though 1 unit is still in LOANER
          status. Different metric (cardinality of a pool) and different
          endpoint from instance 1.
