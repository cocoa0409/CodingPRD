        as_user_id: secretary-1
        captures:
          st1: $.data.status
          m: $.data.metrics
      - call: POST /compliance/committee-reports/${rep}/finalize
        payload: {}
        as: BoardSecretary
        as_user_id: secretary-1
        captures:
          err: $.data.error_id
      - call: POST /compliance/committee-reports/${rep}/present
        payload: {}
