              as: NetworkAdmin
            - call: "POST /_payments/capture"
              payload: { membership_id: "${subd_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            # mC keeps all 8 (balance 8). mD: grant a +1 adjustment is not an endpoint;
            # instead give mD a plan with grant 9 so its first-cycle balance is 9.
            - call: "POST /package-plans"
              payload: { name: "Monthly9", kind: "MEMBERSHIP", price_cents: 9000, grant_credits: 9, validity_days: 30, rollover_cap: 8, freeze_max_days: 0 }
              as: NetworkAdmin
