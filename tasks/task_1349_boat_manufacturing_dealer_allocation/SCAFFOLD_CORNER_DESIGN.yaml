  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_order_response_includes_computed_fields
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model", "entities.DealerOrder.fields.invoice_total_cents"]
        distinguishing_aspect: "Consistency model immediate: POST /dealer-orders response already contains all computed fields (invoice_total, required_deposit, production_hours) — no lag or async reconciliation."
        test_recipe:
          setup: ["Model + dealer + TOWER option"]
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m}", option_code: "TOWER", name: "T", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_t: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-1", name: "D", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 10000000 }
              as: AllocationManager
              captures: { d: $.data.id }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${d}", model_id: "${m}", source: "RETAIL", deposit_paid_cents: 291748, option_package_ids: ["${opt_t}"] }
              as: DealerPrincipal
              as_user_id: "${d}"
              captures: { inv: $.data.invoice_total_cents, req: $.data.required_deposit_cents, hrs: $.data.production_hours, opt_total: $.data.options_total_cents }
          assert:
            - "Same response contains invoice_total_cents == 2917475 (computed inline)"
            - "Same response contains required_deposit_cents == 291748"
            - "Same response contains options_total_cents == 332500"
            - "Same response contains production_hours == 46 (40 base + 6 TOWER)"
