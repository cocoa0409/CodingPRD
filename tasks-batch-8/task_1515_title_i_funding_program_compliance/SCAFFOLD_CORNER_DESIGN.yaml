        distinguishing_aspect: "close-no-action is gated on severity == OBSERVATION: a FINDING-severity row is rejected 409 ERR_FINDING_INVALID_STATE, while the OBSERVATION closes and (being the visit's last non-terminal finding) auto-closes the visit."
