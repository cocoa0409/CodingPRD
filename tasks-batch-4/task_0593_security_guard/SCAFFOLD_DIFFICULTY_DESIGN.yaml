              as: Guard
              as_user_id: "${guard_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/actions"
              payload: { action: "SUBMIT" }
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /incidents/${inc_id}/actions"
              payload: { action: "REVIEW" }
              as: FieldSupervisor
              as_user_id: "sup-a"
            - call: "POST /incidents/${inc_id}/actions"
              payload: { action: "REQUEST_INFO", note: "Need CCTV timestamps." }
              as: FieldSupervisor
              as_user_id: "sup-a"
            - call: "POST /incidents/${inc_id}/actions"
              payload: { action: "SUBMIT" }
              as: Guard
              as_user_id: "${guard_id}"
            - call: "POST /incidents/${inc_id}/actions"
              payload: { action: "REVIEW" }
              as: FieldSupervisor
              as_user_id: "sup-a"
            - call: "POST /incidents/${inc_id}/actions"
              payload: { action: "ESCALATE" }
              as: FieldSupervisor
              as_user_id: "sup-a"
            - call: "POST /incidents/${inc_id}/actions"
              payload: { action: "REVIEW" }
              as: FieldSupervisor
              as_user_id: "sup-b"
            - call: "POST /incidents/${inc_id}/actions"
              payload: { action: "ESCALATE" }
              as: FieldSupervisor
              as_user_id: "sup-b"
