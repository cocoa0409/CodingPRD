          setup:
            - "An OPEN program with budget_total_cents 50000000, reservation_ttl_days 120, low_tier_cap_cents 1400000 and low_tier_cost_share_pct 1.00."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 800000 / HVAC_GROUP / 200 A / anchor."
