      - name: rate_cap_self_referential_counter_order
        grounds:
          - calculations.bypass_rate_cap_check
          - entities.BypassEvent.fields.cap_granted_before
          - entities.BypassEvent.fields.cap_total_before
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the cap compares post-decision counters expressed from
          pre-decision values — (g+1)*10000 <= cap*(t+1) with g,t read BEFORE recording. With cap 5000 bps the
          first approach is rejected outright (10000 <= 5000 false), the second granted on equality
          (10000 <= 10000), the third rejected (20000 <= 15000 false), the fourth granted on equality
