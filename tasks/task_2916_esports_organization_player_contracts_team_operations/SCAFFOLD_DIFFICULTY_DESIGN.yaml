              as_user_id: "finance-1"
          assert:
            - "Checkpoint DRAFT: association_levy_cents 0, org_share_cents 0, allocated_cents 0, unallocated_cents 10000000 — the invariant already holds"
            - "Checkpoint APPROVED: association_levy_cents 250000, org_share_cents 3412500, allocated_cents 6337500, unallocated_cents 0, so 250000 + 3412500 + 6337500 + 0 == 10000000; withholding_total_cents == 950625; the single allocation is APPROVED; Organization.${org_id}.prize_payable_cents == 3412500"
            - "Checkpoint VOIDED: distribution_status == VOIDED, association_levy_cents 0, org_share_cents 0, allocated_cents 0, withholding_total_cents 0, escrow_total_cents 0, unallocated_cents 10000000, so the invariant still holds"
            - "GET /prize-distributions/${pd_id}/allocations shows every row with allocation_status == VOIDED (rows are retained, not deleted, and gross_share_cents is still 6337500 on the row)"
            - "GET /organizations/${org_id}/cap-summary reports prize_payable_cents == 0 — exactly the 3412500 added by calculate was given back"
            - "PlayerContract.${c1_id} is untouched: contract_status ACTIVE and provisional_cap_charge_cents 12328767"
