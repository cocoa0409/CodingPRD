      - name: reserve_draw_equal_to_balance_allowed_then_underfunded_gate_blocks_next_award
        grounds:
          - "calculations.project_reserve_draw"
          - "calculations.reserve_balance_reconciliation"
          - "validations[priority=55]"
          - "validations[priority=56]"
        distinguishing_aspect: >
          A CULVERT bid of exactly 600000 against a reserve balance of exactly
          600000 sits on the inclusive edge of priority 56 and must be awarded,
          driving the balance to exactly 0. The same call also crosses the
          ADEQUATE boundary from the inclusive side (600000*100 == 1000000*60 was
          ADEQUATE before the draw; 0 is UNDERFUNDED after), so the second
          CULVERT award — a trivial 50000 bid the balance cannot cover either —
          must answer priority 55's ERR_RESERVE_UNDERFUNDED rather than
          priority 56's ERR_INSUFFICIENT_RESERVE. Off-by-one implementations
          fail visibly: a strict `<` gate rejects the first award, and a
          posture check written with `>` calls 600000 UNDERFUNDED before the
          draw and rejects it for a different reason.
        test_recipe:
          setup: |
            Build SINGLE_4M: one 290 ft RESIDENTIAL_YEAR_ROUND parcel on a
            COMPLIANT segment with three culverts, reserve_target 1000000, and
            an FY2027 FRONTAGE_WEIGHTED roll for 4000000 that is certified and
            levied, crediting round_half_up(4000000 * 0.15) == 600000 to the
            reserve — exactly 60% of target, the inclusive ADEQUATE boundary.
            Open two CULVERT projects on the segment for non-overlapping windows
            as rc-user-1, with no funding proposal on either, and take one
            bonded bid on each: 600000 on the first and 50000 on the second.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
