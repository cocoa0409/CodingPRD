  - competition_name
  - season_label
  - season_start_date
  - season_end_date
  - total_package_pool
  - guaranteed_rating_basis_points
  output: RightsAsset
  side_effects:
  - status = OPEN
  - active_package_count = 0
- method: GET
  path: /rights-assets
  description: List rights assets
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input:
  - limit?
  - offset?
  - status?
  output: RightsAsset[]
  side_effects: []
- method: GET
  path: /rights-assets/{assetId}
  description: Get a rights asset
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
  output: RightsAsset
  side_effects: []
