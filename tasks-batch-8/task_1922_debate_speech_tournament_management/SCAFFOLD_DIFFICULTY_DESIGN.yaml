            - "Entry.${e_b2}.prelim_rank == 3 and Entry.${e_c1}.prelim_rank == 4 (tied on wins 1 and adjusted points 50; opponent_strength 3 > 2 breaks the tie)"

      - name: per_school_entry_cap_boundary
