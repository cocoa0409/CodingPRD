      - name: order_index_recomputed_for_out_of_order_booking
        claim_type: chronological
        grounds:
          - calculations.ring_schedule_layout
          - entities.RingSlot.fields.order_index
          - endpoints.POST_/ring-slots
        distinguishing_aspect: |
          order_index is a chronological rank over the ring's slots, recomputed on
          every insertion — not an insertion counter. Booking 16:00 first, then 14:00,
          then 15:00 must leave the ring numbered 1, 2, 3 in clock order, which means
          the FIRST slot booked ends up with order_index 3. An implementation that
          assigns a monotonically increasing sequence returns 1, 2, 3 in booking
          order and fails on the 16:00 slot.
        test_recipe:
          setup:
            - "APPROVED show, Ring A (turnover_buffer_minutes 10), JUMPER division, classes 101, 102 and 103 OPEN with zero entries each -> every slot is 20 minutes long."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/rings"
              payload: { name: "Ring A", surface_type: "SAND_FIBER", footing_condition_score: 100, turnover_buffer_minutes: 10, warmup_capacity_horses: 12 }
