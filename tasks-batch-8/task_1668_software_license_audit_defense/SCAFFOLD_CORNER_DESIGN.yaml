              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 100, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 100, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "GET /sam/products/${p_id}/monitoring-alerts"
              as: SAMManager
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { gap: "$.data[0].gap_quantity", sev: "$.data[0].gap_severity" }
          assert:
            - "gap == 0 and sev == COMPLIANT"
            - "GET monitoring-alerts returns an empty list (no OVER_DEPLOYMENT row at gap == 0)"

