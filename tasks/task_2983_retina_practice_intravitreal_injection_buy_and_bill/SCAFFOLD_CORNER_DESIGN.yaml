            - "${k_pa_mismatch} == \"ERR_AUTHORIZATION_DRUG_MISMATCH\" with HTTP 409"
            - "no vial of either lot is reserved: DrugLot.${k_lot_bio_a_id}.vials_reserved == 0 and DrugLot.${k_lot_id}.vials_reserved == 0"
            - "PriorAuthorization.${k_pa_m_id}.injections_used == 0 and status is still APPROVED"

      - name: corner_authorization_outside_its_window_is_flipped_to_expired_and_rejected
        claim_type: temporal_validation
        grounds:
