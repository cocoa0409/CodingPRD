  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- Instance 1: state (p6) vs business_safety (p8) on record-birth
      - name: ppvc_state_before_risk_on_record_birth
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.Episode.transitions.ACTIVE_to_BORN
        distinguishing_aspect: |
          Error-category pair {state, business_safety}: a PLANNING episode whose risk_tier is
          TRANSFER_REQUIRED is hit with record-birth. The state precondition (clinical_status must
          be ACTIVE, priority 6) outranks the risk-safety gate (priority 8), so the response is
          ERR_INVALID_STATE, not ERR_RISK_TRANSFER_REQUIRED.
        test_recipe:
          setup:
            - "Standard kit+package+client+episode kept in PLANNING (never activated)."
