# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3030_house_jewelry_credit_lifetime_service_plan_administration
#
# Breadth probe: every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise, walked against the
# nine claim-extraction sections. Corners §1.8 already covers appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: store_create_returns_declared_fields_and_starts_open
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints.POST_/stores
          - state_machines.Store.initial_state
        distinguishing_aspect: "A store posted with only store_code, name, state_code and credit_capacity_cents comes back 201 with store_status OPEN (not the earlier default ACTIVE), version 1, server-minted id and both timestamps, so credit selling stays gated on the explicit activate call."
        test_recipe:
          setup:
            - "Logical clock at the fixed startup default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { new_store_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Store.${new_store_id}.store_status == OPEN"
            - "Store.${new_store_id}.version == 1"
            - "Store.${new_store_id}.open_repair_liability_cents == 0 and open_inspection_count == 0"
            - "the response carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: customer_get_round_trips_stored_values_including_null_phone
        claim_type: Retrieval
        grounds:
          - entities.Customer
          - endpoints.GET_/customers/{id}
        distinguishing_aspect: "Every Customer field round-trips through GET exactly as posted, including the null phone and the defaulted NO_FILE credit_tier and account_status, which are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer created with no phone."
          setup_api_calls:
            - *c_clock
            - &c_cust_ivan
              call: "POST /customers"
              payload: { full_name: "Ivan Petrov", email: "ivan.petrov@example.com", state_code: "NV" }
              as: SalesAssociate
              captures: { ivan_id: $.data.id }
          trigger:
            - call: "GET /customers/${ivan_id}"
              payload: {}
              as: CustomerService
          assert:
            - "the response status is 200"
            - "Customer.${ivan_id}.full_name == \"Ivan Petrov\" and email == \"ivan.petrov@example.com\" and state_code == \"NV\""
            - "Customer.${ivan_id}.phone is null"
            - "Customer.${ivan_id}.account_status == NO_FILE and credit_tier == NO_FILE"
            - "Customer.${ivan_id}.standalone_credit_limit_cents == 0 and outstanding_balance_cents == 0 and lifetime_purchase_cents == 0"
            - "Customer.${ivan_id}.lost_inspection_streak == 0"

      - name: stores_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/stores
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three stores on file, limit=2&offset=0 returns 2 rows carrying total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false, so total_count counts the whole filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three stores opened in TX, NV and CA."
          setup_api_calls:
            - *c_clock
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "0210", name: "Summerlin", state_code: "NV", credit_capacity_cents: 4000000 }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "0333", name: "Glendale", state_code: "CA", credit_capacity_cents: 4500000 }
              as: ChainAdmin
          trigger:
            - call: "GET /stores?limit=2&offset=0"
              payload: {}
              as: ChainAdmin

            - call: "GET /stores?limit=2&offset=2"
              payload: {}
              as: ChainAdmin
          assert:
            - "the first page returns exactly 2 Store rows and reports total_count 3"
            - "the first page reports has_more == true"
            - "the second page returns exactly 1 Store row and has_more == false"
            - "the two pages together enumerate 3 distinct store ids with no repetition"

      - name: unknown_store_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_RESOURCE_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A GET against a well-formed but unregistered store id returns 404 with ERR_RESOURCE_NOT_FOUND and a null data payload rather than an empty object."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ChainAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_RESOURCE_NOT_FOUND"
            - "response_type == error"

      - name: purchase_create_missing_required_base_price_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/purchases
        distinguishing_aspect: "POST /purchases omitting base_price_cents is refused with ERR_INVALID_REQUEST before any lookup runs, because payload shape is checked ahead of the referential and state gates."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A customer exists."
          setup_api_calls:
            - *c_clock
            - &c_customer
              call: "POST /customers"
              payload: { full_name: "Nina Ortiz", email: "nina.ortiz@example.com", state_code: "TX" }
              as: SalesAssociate
              captures: { customer_id: $.data.id }
            - &c_store
              call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}" }
              as: SalesAssociate
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /purchases?customer_id=${customer_id} returns 0 rows"

      - name: credit_application_defaults_down_payment_and_income_to_null
        claim_type: Defaults
        grounds:
          - entities.CreditApplication.fields.down_payment_cents
          - entities.CreditApplication.fields.declared_annual_income_cents
          - entities.CreditApplication.fields.decision_status
        distinguishing_aspect: "Omitting down_payment_cents yields the declared default 0 rather than null, and omitting declared_annual_income_cents leaves it null so the income downgrade branch in the pricing formula is skipped rather than treated as zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer on file, TX TIER_1 registry row registered."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - &c_activate
              call: "POST /stores/${store_id}/activate"
              payload: {}
              as: ChainAdmin
            - &c_registry_t1
              call: "POST /credit-limit-registry-state"
              payload: { registry_key: "TX", credit_tier: "TIER_1", base_limit_cents: 400000, min_down_payment_pct: 0.20, registry_type: "STATE", min_ticket_cents: 200000 }
              as: ChainAdmin
            - &c_reg_tx
              call: "POST /service-plan-regulations"
              payload: { state_code: "TX", max_plan_term_months: 60, inspection_required_months: 6, lapse_cure_days: 30, replacement_plus_pct: 1.0, max_inspection_gap_days: 210 }
              as: ChainAdmin
          trigger:
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 250000, requested_purchase_amount_cents: 250000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
          assert:
            - "CreditApplication.${application_id}.down_payment_cents == 0"
            - "CreditApplication.${application_id}.declared_annual_income_cents is null"
            - "CreditApplication.${application_id}.decision_status == PENDING and decision_tier is null"
            - "CreditApplication.${application_id}.policy_tier == TIER_1"

      - name: store_open_repair_liability_is_recomputed_from_live_repairs
        claim_type: Computed Fields
        grounds:
          - entities.Store.fields.open_repair_liability_cents
          - entities.Repair.fields.loss_liability_cents
          - calculations.repair_loss_liability
        distinguishing_aspect: "Store.open_repair_liability_cents is derived from the store's live repairs rather than stored independently: it reads 0 before intake and 35000 after an intake whose NET_RESERVE liability is 35000, so the two 35000 figures prove the recompute."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer, stone, bundle, regulation, purchase completed, registration claimed ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - &c_bundle
              call: "POST /protection-bundles"
              payload: { bundle_code: "BUNDLE_180", display_name: "Lifetime Diamond 180", lifetime_plan_fee_cents: 19900, stone_limit_labor_cents: 25000, stone_limit_parts_cents: 60000, inspection_interval_days: 180, inspection_cure_days: 30 }
              as: ChainAdmin
              captures: { bundle_id: $.data.id }
            - *c_reg_tx
            - &c_diamond
              call: "POST /diamonds"
              payload: { stone_code: "ST-0001", stone_kind: "NATURAL", carat: 0.90 }
              as: SalesAssociate
              captures: { diamond_id: $.data.id }
            - &c_purchase
              call: "POST /purchases"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", base_price_cents: 450018, diamond_id: "${diamond_id}" }
              as: SalesAssociate
              captures: { purchase_id: $.data.id }
            - &c_complete
              call: "POST /purchases/${purchase_id}/complete"
              payload: {}
              as: SalesAssociate
            - &c_registration
              call: "POST /service-plan-registrations"
              payload: { customer_id: "${customer_id}", purchase_id: "${purchase_id}", diamond_id: "${diamond_id}", store_id: "${store_id}", bundle_id: "${bundle_id}", plan_term_months: 24 }
              as: StoreManager
              captures: { registration_id: $.data.id }
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-09-10T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
          trigger:
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "SETTING", declared_parts_cents: 40000, declared_labor_cents: 15000, declared_loss_liability_cents: 5000 }
              as: StoreManager
              captures: { repair_id: $.data.id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
          assert:
            - "Repair.${repair_id}.loss_liability_cents == 35000 and store_absorbed_cents == 35000"
            - "Store.${store_id}.open_repair_liability_cents == 35000, recomputed from the live repair"
            - "Store.${store_id}.available_credit_capacity_cents == 5000000 - 35000 == 4965000"
            - "repair_status == INTAKE so the repair counts toward the open liability"

      - name: server_stamped_fields_ignore_client_supplied_values
        claim_type: System Fields
        grounds:
          - entities.Store.fields.store_status
          - entities.Repair.fields.accepted_at
          - entities.CreditApplication.fields.expires_at
        distinguishing_aspect: "System-sourced fields cannot be client-forged — a create carrying store_status ACTIVE, accepted_at in the past and expires_at in the future is stored with the server's own OPEN, its own acceptance instant and its own derived expiry."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /stores"
              payload: { store_code: "0142", name: "Highland Village", state_code: "TX", credit_capacity_cents: 5000000 }
              as: ChainAdmin
              captures: { forged_store_id: $.data.id }
          assert:
            - "Store.${forged_store_id}.store_status == OPEN despite the excluded client field"
            - "Store.${forged_store_id}.created_at == 2026-09-01T00:00:00.000Z and updated_at equals it"
            - "Store.${forged_store_id}.version == 1"
            - "the id is a plain UUID with no type prefix"

      - name: invalid_enum_values_are_rejected_on_create
        claim_type: Type Constraints
        grounds:
          - errors.ERR_VALIDATION_FAILED
          - entities.Diamond.fields.stone_kind
          - entities.PromotionalPlan.fields.plan_code
        distinguishing_aspect: "Enum fields reject out-of-set values with ERR_VALIDATION_FAILED while the same request with the in-set value succeeds, and the rejection leaves no row behind."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /diamonds"
              payload: { stone_code: "ST-BAD", stone_kind: "CUBIC_ZIRCONIA", carat: 1.0 }
              as: SalesAssociate
              captures: { error_id: $.data.error_id }
            - call: "POST /diamonds"
              payload: { stone_code: "ST-GOOD", stone_kind: "LAB_GROWN", carat: 1.0 }
              as: SalesAssociate
              captures: { good_diamond_id: $.data.id }
          assert:
            - "the first request returns 422 with error_id == ERR_VALIDATION_FAILED"
            - "GET /diamonds returns exactly 1 row, so the rejected stone was not persisted"
            - "Diamond.${good_diamond_id}.stone_kind == LAB_GROWN"
            - "Diamond.${good_diamond_id}.custody_status == IN_CASE"

      - name: flat_topology_foreign_keys_are_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - endpoints.POST_/credit-applications
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "The flat topology puts both foreign keys in the request body, and priority 3 checks them left to right in the endpoint's declared input order, so with BOTH ids unknown the answer is the customer miss, and with only store_id unknown it is the store miss."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer on file; no store exists."
          setup_api_calls:
            - *c_clock
            - *c_customer
          trigger:
            - call: "POST /credit-applications"
              payload: { customer_id: "00000000-0000-4000-8000-00000000000a", store_id: "00000000-0000-4000-8000-00000000000b", requested_limit_cents: 300000, requested_purchase_amount_cents: 300000, down_payment_cents: 30000 }
              as: SalesAssociate
              captures: { error_both: $.data.error_id }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "00000000-0000-4000-8000-00000000000b", requested_limit_cents: 300000, requested_purchase_amount_cents: 300000, down_payment_cents: 30000 }
              as: SalesAssociate
              captures: { error_store: $.data.error_id }
          assert:
            - "the first request returns 404 with error_both == ERR_RESOURCE_NOT_FOUND"
            - "the second request also returns 404 with error_store == ERR_RESOURCE_NOT_FOUND"
            - "GET /credit-applications?customer_id=${customer_id} returns 0 rows, so neither attempt persisted"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: credit_decision_moves_pending_application_to_approved
        claim_type: Valid Transition
        grounds:
          - state_machines.CreditApplication.PENDING_to_APPROVED
          - endpoints.POST_/credit-applications/{id}/decision
        distinguishing_aspect: "The declared PENDING -> APPROVED transition fires on decision APPROVE_FULL and moves every field the transition's side effects name, with the down-payment figures computed at the TIER_1 row's 20 percent rate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer on file, TX TIER_1 row at min_down_payment_pct 0.20 and base_limit_cents 400000, TX regulation registered, one PENDING application for 250000."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_registry_t1
            - *c_reg_tx
            - &c_app_t1
              call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 250000, requested_purchase_amount_cents: 250000, down_payment_cents: 50000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
          trigger:
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
          assert:
            - "CreditApplication.${application_id}.decision_status == APPROVED"
            - "CreditApplication.${application_id}.decision_tier == TIER_1 and approved_limit_cents == 400000"
            - "CreditApplication.${application_id}.min_down_payment_required_cents == 50000 and down_payment_shortfall_cents == 0"
            - "Customer.${customer_id}.account_status == OPEN and credit_tier == TIER_1 and standalone_credit_limit_cents == 400000"
            - "CreditApplication.${application_id}.version == 2"

      - name: decision_on_already_declined_application_is_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CreditApplication.terminal_states
          - errors.ERR_INVALID_STATE
          - validations[priority=4]
        distinguishing_aspect: "DECLINED is terminal, so a second decision observes decision_status DECLINED and is refused with ERR_INVALID_STATE without touching the customer's credit posture."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer on file, one application already DECLINED."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - &c_app_decline
              call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 250000, requested_purchase_amount_cents: 250000, down_payment_cents: 50000 }
              as: SalesAssociate
              captures: { application_id: $.data.id }
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "DECLINE" }
              as: CreditAnalyst
              captures: { declined_version: $.data.version }
          trigger:
            - call: "POST /credit-applications/${application_id}/decision"
              payload: { decision: "APPROVE_FULL" }
              as: CreditAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "CreditApplication.${application_id}.decision_status is still DECLINED"
            - "CreditApplication.${application_id}.version is still ${declined_version}, so no side effect fired"
            - "Customer.${customer_id}.account_status is still NO_FILE"

      - name: new_repair_starts_at_intake_with_declared_custody_and_zero_delivery
        claim_type: Initial State
        grounds:
          - state_machines.Repair.initial_state
          - entities.Repair.fields.accepted_at
          - entities.Repair.fields.pickup_deadline_at
        distinguishing_aspect: "A fresh Repair starts at INTAKE with accepted_at stamped from the logical clock, promised_delivery_at unwritten until routing, vendor_shop_code null, and the stone still IN_CASE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ACTIVE, customer, stone, bundle, regulation, purchase completed, registration claimed ACTIVE."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - *c_registration
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-09-10T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
          trigger:
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "SETTING", declared_parts_cents: 40000, declared_labor_cents: 15000, declared_loss_liability_cents: 5000 }
              as: StoreManager
              captures: { repair_id: $.data.id }
          assert:
            - "Repair.${repair_id}.repair_status == INTAKE"
            - "Repair.${repair_id}.accepted_at == 2026-09-01T00:00:00.000Z"
            - "Repair.${repair_id}.vendor_shop_code is null and promised_delivery_at is null"
            - "Repair.${repair_id}.pickup_deadline_at is null"
            - "Diamond.${diamond_id}.custody_status == IN_CASE"
            - "Repair.${repair_id}.version == 1"

      - name: verified_loss_is_terminal_and_refuses_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Repair.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "VERIFIED_LOSS is terminal, so a route attempt from it returns ERR_INVALID_STATE and the repair's vendor_shop_code and liability stay exactly as declared at intake."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A stone-loss repair already routed, arrived, submitted for QC and declared as a verified loss."
          setup_api_calls:
            - *c_clock
            - *c_customer
            - *c_store
            - *c_activate
            - &c_shop_malca
              call: "POST /vendor-shops"
              payload: { shop_code: "MALCA", shop_name: "Malca Stone Bench", base_turnaround_days: 12, rush_surcharge_cents: 6000 }
              as: ChainAdmin
            - *c_bundle
            - *c_reg_tx
            - *c_diamond
            - *c_purchase
            - *c_complete
            - *c_registration
            - call: "POST /service-plan-registrations/${registration_id}/exams"
              payload: { visit_at: "2026-09-10T00:00:00Z", result: "CLAIMED" }
              as: StoreManager
            - call: "POST /repairs"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", diamond_id: "${diamond_id}", registration_id: "${registration_id}", failure_class: "STONE_LOSS", declared_parts_cents: 40000, declared_labor_cents: 15000, declared_loss_liability_cents: 5000 }
              as: StoreManager
              captures: { repair_id: $.data.id }
            - call: "POST /repairs/${repair_id}/route"
              payload: {}
              as: StoreManager
            - call: "POST /repairs/${repair_id}/arrive-vendor"
              payload: {}
              as: StoreManager
            - call: "POST /repairs/${repair_id}/submit-qc"
              payload: {}
              as: StoreManager
            - call: "POST /repairs/${repair_id}/declare-loss"
              payload: {}
              as: StoreManager
              captures: { pinned_liability: $.data.loss_liability_cents }
          trigger:
            - call: "POST /repairs/${repair_id}/route"
              payload: {}
              as: StoreManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Repair.${repair_id}.repair_status is still VERIFIED_LOSS"
            - "Repair.${repair_id}.loss_liability_cents is still ${pinned_liability}, never recomputed after intake"
            - "Diamond.${diamond_id}.custody_status == WITHDRAWN"
            - "GET /repairs/${repair_id}/appraisals returns exactly 1 Appraisal row"

      - name: second_route_from_routed_state_is_invalid_state_and_keeps_first_vendor
        claim_type: Idempotency
        grounds:
          - state_machines.Repair.INTAKE_to_ROUTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Repeating the route trigger on an already-routed repair is refused with ERR_INVALID_STATE, and the vendor_shop_code plus promised_delivery_at keep the values the first routing stamped."
        test_recipe:
          setup:
