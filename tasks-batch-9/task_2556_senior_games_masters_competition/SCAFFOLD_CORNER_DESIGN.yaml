            - "the limit 0 call returns HTTP 400 with ${err_zero} == \"ERR_INVALID_PAGINATION\""
            - "the offset -1 call returns HTTP 400 with ${err_neg} == \"ERR_INVALID_PAGINATION\""
            - "the limit 100 / offset 0 call returns HTTP 200 with total_count == 1 and has_more == false, so 100 is inside the accepted range"
            - "the same list called with neither parameter also returns total_count == 1 and has_more == false under the declared default limit 10"

      - name: corner_validation_priority_role_check_precedes_path_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - rbac.GamesAdmin.exclusive_operations
        distinguishing_aspect: "A RegistrationOfficer closing a venue id that does not exist gets HTTP 403 ERR_ROLE_NOT_PERMITTED from priority 5, not HTTP 404 ERR_VENUE_NOT_FOUND from priority 14 — the ladder refuses to leak existence information to a caller who lacks the role, and the same caller on a real venue id gets the identical error."
        test_recipe:
          setup:
            - "Standard fixture with one OPEN venue whose id is known."
          setup_api_calls:
            - call: "POST /senior-games/games-editions"
              payload: { name: "Prairie Senior Games 2026", host_city: "Springfield", host_state_code: "IL", competition_start_date: "2026-09-10", competition_end_date: "2026-09-20", age_reference_date: "2026-12-31", registration_deadline_utc: "2026-08-25T23:59:59Z" }
              as: GamesAdmin
              captures: { ed_id: $.data.id }
            - call: "POST /senior-games/venues"
              payload: { games_edition_id: "${ed_id}", name: "North Oval", competition_area_count: 4, spectator_capacity: 500, emergency_protocol_code: "EP_ADVANCED", has_onsite_medical_bay: true }
              as: GamesAdmin
              captures: { vn_id: $.data.id }
          trigger:
            - call: "POST /senior-games/venues/33333333-3333-4333-8333-333333333333/close"
              payload: { reason: "probing an unknown id" }
              as: RegistrationOfficer
              captures: { err_ghost: $.data.error_id }
            - call: "POST /senior-games/venues/${vn_id}/close"
              payload: { reason: "probing a real id" }
              as: RegistrationOfficer
              captures: { err_real: $.data.error_id }
            - call: "POST /senior-games/venues/33333333-3333-4333-8333-333333333333/close"
              payload: { reason: "same unknown id with the right role" }
              as: GamesAdmin
              captures: { err_admin: $.data.error_id }
          assert:
            - "${err_ghost} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403, not ERR_VENUE_NOT_FOUND"
            - "${err_real} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403 — indistinguishable from the unknown-id case, so no existence oracle leaks"
            - "${err_admin} == \"ERR_VENUE_NOT_FOUND\" with HTTP 404 once the role gate passes, proving priority 14 does run for an authorised caller"
            - "Venue.${vn_id}.status is still \"OPEN\" and closed_reason is null"

