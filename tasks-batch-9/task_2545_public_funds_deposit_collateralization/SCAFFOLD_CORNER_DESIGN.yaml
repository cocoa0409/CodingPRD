        distinguishing_aspect: "The signature endpoint is shared by three roles, so authorisation is per-PARTY rather than per-endpoint: a Custodian caller signing the DEPOSITORY or PUBLIC_UNIT party gets ERR_SIGNATURE_PARTY_MISMATCH (403, not 401/409) even though the role is on the endpoint's role list, and re-signing an already-signed party gets ERR_PARTY_ALREADY_SIGNED (409) rather than being treated as idempotent."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; APPROVED tri-party custodian; APPROVED depository; DEDICATED account; one agreement already CIRCULATED (status PENDING_SIGNATURES, signature_count 0)."
