            - call: "POST /teaching-artists/${a1_id}/vetting"
              payload: { to_vetting_status: "PORTFOLIO_REVIEW" }
              as: RosterCoordinator
            - call: "POST /teaching-artists/${a1_id}/portfolio-reviews"
              payload: { reviewer_user_id: "panelist-1", artistic_quality_score: 3.5, pedagogical_clarity_score: 4.0, cultural_responsiveness_score: 3.2 }
