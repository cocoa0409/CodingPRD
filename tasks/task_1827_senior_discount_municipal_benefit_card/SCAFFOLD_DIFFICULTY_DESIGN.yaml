  - rule_id: boundary_precision_check
    instances:
      - name: age_exactly_65_boundary
        grounds:
          - calculations.age_years_at_clock
          - "errors[ERR_ELIGIBILITY_AGE_NOT_MET]"
        distinguishing_aspect: |
          Boundary on the AGE metric via POST /applications: at the default clock
          2026-08-01, dob 1961-08-01 yields age exactly 65 and PASSES (>= is
          inclusive), while dob 1961-08-02 (one day short) is rejected
          ERR_ELIGIBILITY_AGE_NOT_MET.
        test_recipe:
          setup:
            - "empty DB; logical clock explicitly pinned to 2026-08-01T00:00:00Z (also the startup default)"
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Sixty Five", date_of_birth: "1961-08-01", annual_income_cents: 1000000, residency_address: "12 Boundary Ln" }, as: Applicant, captures: { app_ok: $.data.id, st_ok: $.data.status } }
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "One Day Young", date_of_birth: "1961-08-02", annual_income_cents: 1000000, residency_address: "12 Boundary Ln" }, as: Applicant, captures: { err: $.data.error_id } }
          assert:
            - "dob 1961-08-01: 201, status SUBMITTED — age == 65 exactly satisfies age >= 65 (inclusive boundary)"
            - "dob 1961-08-02: error_id == ERR_ELIGIBILITY_AGE_NOT_MET (http 422) — age 64 years 364 days fails"

      - name: merchant_monthly_cap_exact_boundary
        grounds:
          - calculations.merchant_claim_amount
          - "errors[ERR_MERCHANT_MONTHLY_CAP_EXCEEDED]"
          - state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Boundary on the REIMBURSED CENTS metric via the claim-approve endpoint
          (distinct metric and endpoint from age_exactly_65_boundary): a claim whose
          final amount makes the merchant's period total exactly equal to
          monthly_reimbursement_cap_cents (1000) is APPROVED (<= inclusive), while
          the next period's claim of 1001 cents is rejected
