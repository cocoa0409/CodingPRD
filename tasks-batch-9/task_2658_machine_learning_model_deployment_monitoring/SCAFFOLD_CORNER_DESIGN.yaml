      - name: deployment_health_read_selects_the_variant_and_the_latest_performance_window
        claim_type: Computed read
        grounds:
          - endpoints.GET_deployments_health
          - calculations.composite_health_score
          - entities.MonitoringWindow.fields.health_score_variant
        distinguishing_aspect: |
          This is the read-side contract of the dual-variant score, which the §1.8 instance exercises on
          the stored MonitoringWindow: here the SAME window is read twice through the endpoint and
          score_variant selects the formula on demand — FINAL over an OPEN window returns 74.15 while
          the stored window row still says 83.60 / PROVISIONAL, i.e. the computed read never persists.
          It also pins the window SELECTION (latest PERFORMANCE window by window_end DESC) and the
          empty case (health_score null before any window exists).
        test_recipe:
