              captures: { err: $.data.error_id }
          assert:
            - "settle returns HTTP 409 with error_id == ERR_ASSESSMENT_DISPUTED"

      - name: safety_beats_referential_lesson_required_before_availability_check
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - calculations.quote_rental_cost
        distinguishing_aspect: |
          Pair {business_safety ERR_LESSON_REQUIRED (priority 8) vs business_referential
          ERR_UNIT_NOT_AVAILABLE (priority 5)} — distinct from the state/constraint pair above.
          A beginner confirming a lesson-required gear type without a LESSON add-on: confirm does
          not touch availability, so ERR_LESSON_REQUIRED is the only business failure; the test
          pins that confirm surfaces ERR_LESSON_REQUIRED and that a competing referential failure
          on a separate add-on attach surfaces ERR_UNIT_NOT_AVAILABLE, proving the two categories
          are distinct and independently reachable.
        test_recipe:
          setup:
