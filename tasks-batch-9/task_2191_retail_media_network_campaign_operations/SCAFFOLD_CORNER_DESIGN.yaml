          assert:
            - "HTTP 403"
            - "error_id == ERR_NOT_RESOURCE_OWNER"
            - "Campaign.${camp_id}.advertiser_id == ${adv_id}"
            - "Campaign.${camp_id}.delivery_status == DRAFT"

  - section: cross_cutting_complexity_layers
    instances:
      - name: a_second_budget_plan_create_on_the_advertiser_version_read_before_the_first_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.budget-plan-create-stale-advertiser
          - validations[priority=20]
          - endpoints[POST /rmn/budget-plans]
        distinguishing_aspect: "Plan creation itself increments Advertiser.version, so the version captured from the KYC approval is already superseded by the 2026-Q3 plan; the follow-up 2026-Q4 create quoting that same expected_advertiser_version is refused with ERR_STALE_ADVERTISER_VERSION (412) even though the fiscal periods never collide."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE; the version observed at KYC approval was used to create a DRAFT 2026-Q3 plan, which bumped Advertiser.version."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
          trigger:
            - call: "POST /rmn/budget-plans"
              payload: { advertiser_id: "${adv_id}", fiscal_period_code: "2026-Q4", committed_total_cents: 500000, trade_fund_share_cents: 0, window_start_at: "2026-10-01T00:00:00Z", window_end_at: "2026-12-01T00:00:00Z", expected_advertiser_version: "${adv_v}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == ERR_STALE_ADVERTISER_VERSION"
            - "Advertiser.${adv_id}.onboarding_status == ACTIVE"
            - "Advertiser.${adv_id}.credit_exposure_cents == 0"
            - "BudgetPlan.${plan_id}.plan_status == DRAFT"
            - "BudgetPlan.${plan_id}.available_cents == 2000000"

      - name: a_second_product_assignment_on_the_line_item_version_read_before_the_first_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.product-assignment-create-stale-line-item
          - validations[priority=22]
          - endpoints[POST /rmn/product-assignments]
        distinguishing_aspect: "The first assignment recomputed eligible_product_count and relevance_score and bumped LineItem.version, so the second assignment quoting the version captured at line-item creation is refused with ERR_STALE_LINE_ITEM_VERSION (412) — precisely the case where a stale writer would have demoted a hero chosen after its read."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an APPROVED 2026-Q3 plan, a DRAFT campaign and a DRAFT line item whose hero assignment for SKU-RED-1 already exists; SKU-RED-2 is registered and ELIGIBLE."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
