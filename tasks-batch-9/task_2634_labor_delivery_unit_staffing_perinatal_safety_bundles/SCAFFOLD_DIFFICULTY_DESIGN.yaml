  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # instance 1 = pair (LaborEncounter, ObstetricUnit) via CesareanReadinessDrill
  # instance 2 = pair (SupportPersonPass, EmergencyCesareanEvent)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: second_stage_advance_blocked_by_unit_not_ready_then_unblocked_by_validating_a_drill_nothing_on_the_encounter_changing
        grounds:
          - state_machines.LaborEncounter.ACTIVE_FIRST_STAGE_to_SECOND_STAGE
          - state_machines.CesareanReadinessDrill.DOCUMENTED_to_VALIDATED
          - calculations.cesarean_readiness_derivation
          - validations[priority 11.4]
          - errors[ERR_CESAREAN_READINESS_NOT_MET]
          - endpoints[POST /labor-encounters/{encounterId}/advance-phase]
        distinguishing_aspect: |
          The SECOND_STAGE advance depends on the state of an entity that the call
          does not name and that the encounter has no field pointing at: the
          ObstetricUnit's derived cesarean_readiness_state, which is itself a
          function of a THIRD entity, the CesareanReadinessDrill. This instance
          isolates that dependency to the point of proof. The first advance is
          refused with 422 ERR_CESAREAN_READINESS_NOT_MET while the encounter is
          already perfect on every one of its OWN axes — staffing_state is
          ONE_TO_ONE_COVERED, the fetal assessment is CATEGORY_I and zero minutes
          old, the escalation chain is untouched, the bed is OCCUPIED and LDR, the
          posture is OPEN. Then a single /validate on a drill belonging to the
          UNIT — a call that touches no encounter field whatsoever and does not
          advance the clock — flips readiness from NOT_READY to DEGRADED, and the
          BYTE-IDENTICAL advance-phase request now succeeds. Implementations that
          model preconditions as a per-entity invariant check pass the first
          attempt (nothing about the encounter is wrong); implementations that
          demand READY rather than IN {READY, DEGRADED} fail the second attempt,
          because an empty emergency-cesarean rolling window plus no OR_STANDBY
          shift can only ever reach DEGRADED, never READY.
        test_recipe:
          setup: |
            The drill is deliberately parked at DOCUMENTED, not VALIDATED: it has a
            passing 18-minute measurement and both required participant roles, but
            an unvalidated drill grants no currency, so the unit sits at NOT_READY
            with the drill already one call away from fixing that. The encounter is
            then driven all the way to ACTIVE_FIRST_STAGE under one-to-one coverage
            by an ADVANCED-cert bedside nurse whose ACTIVE shift freezes
            capacity_units_effective at 4.0; a ONE_TO_ONE assignment debits that
            whole 4.0, which stays above the requirement at every phase
            (0.5 in ANTEPARTUM, 2.3 at the TIER_II ACTIVE_FIRST_STAGE floor), so
            the encounter never leaves ONE_TO_ONE_COVERED. The clock is left at
            2026-08-22T07:20:00Z from the assessment onward, so the 15-minute
            SECOND_STAGE freshness window is satisfied at zero minutes on BOTH
            attempts and cannot explain the difference in outcome.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-22T07:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Glenmarrow Family Birth Place", licensed_ldr_beds: 3, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_2: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Perpetua Anand MD", staff_role: "OB_ATTENDING", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-11-30T00:00:00Z", or_circulating_qualified: true }
              as: PerinatalSafetyOfficer
              captures: { s_ob: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Casimir Bujnowski MD", staff_role: "ANESTHESIOLOGIST", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-11-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_anes: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Adaeze Nwachukwu RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-11-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_charge: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Sindre Haugland RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-11-30T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_bed: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Rosalba Ferreira RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-11-30T00:00:00Z", or_circulating_qualified: false }
