scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cap_liability_provisional_vs_final_on_provider
        grounds:
          - calculations.provisional_cap_liability
          - calculations.final_cap_settlement
          - entities.Provider.fields.cap_liability_cents
          - endpoints["GET /hospice/providers/{id}/cap-summary"]
          - endpoints["POST /hospice/providers/{id}/settle-cap"]
        distinguishing_aspect: |
          The dual variant lives on the Provider (aggregate-cap) entity domain: the provisional
          cap-summary recomputes live and DROPS from 130000 to 40000 once a second beneficiary is
          added (allowance rises), whereas the final settlement freezes the value at the settlement
          instant — the same provider's two reads diverge by the live-vs-frozen choice.
        test_recipe:
          setup:
            - "Provider P with per_beneficiary_cap_cents=200000, cap_year_start=2026-01-01."
            - "Election E1 with 3 GIP care-days (payment 110000 each) → ben1 paid 330000."
            - "Clock at 2026-01-10."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Cap Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 200000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Ben One", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-1" }
              as: IntakeCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e1_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e1_id}", service_date: "2026-01-03T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e1_id}", service_date: "2026-01-04T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
          trigger:
            - call: "GET /hospice/providers/${prov_id}/cap-summary"
              payload: {}
              as: BillingAdmin
              captures: { liab_one_ben: $.data.cap_liability_cents }
          assert:
            - "Provider.${prov_id}.total_paid_cents == 330000"
            - "Provider.${prov_id}.counted_beneficiaries == 1"
            - "Provider.${prov_id}.cap_liability_cents == 130000"

      - name: routine_per_diem_high_vs_base_tier_on_careday
        grounds:
          - calculations.day_per_diem
          - calculations.day_per_diem.variants.routine_high
          - calculations.day_per_diem.variants.routine_base
          - entities.CareDay.fields.payment_cents
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: |
          The dual variant lives on the CareDay (per-diem) entity domain, NOT the Provider cap
          domain: identical level_of_care=ROUTINE produces payment_cents=21000 at elapsed_day_index 0
          (high tier) and 16500 at elapsed_day_index 60 (base tier) — same inputs, two outputs keyed
          on the service-intensity window.
        test_recipe:
          setup:
            - "Election E elected 2026-01-01; a ROUTINE day on day 1 and a ROUTINE day on day 61."
            - "Clock advanced to 2026-03-05 so day 61 (2026-03-03) is in the past."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Tier Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Tier Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-2" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-01T00:00:00Z", level_of_care: "ROUTINE", high_intensity: true }
              as: ClinicalManager
              captures: { day1_id: $.data.id, day1_pay: $.data.payment_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-03-03T00:00:00Z", level_of_care: "ROUTINE", high_intensity: false }
              as: ClinicalManager
              captures: { day61_id: $.data.id, day61_pay: $.data.payment_cents }
          assert:
            - "CareDay.${day1_id}.payment_cents == 21000"
            - "CareDay.${day61_id}.payment_cents == 16500"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_diem_three_input_nonlinear_selection
        grounds:
          - calculations.day_per_diem
          - entities.CareDay.fields.level_of_care
          - entities.CareDay.fields.high_intensity
          - entities.CareDay.fields.payment_cents
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: |
          Mode (a): payment_cents is a non-linear selection over THREE inputs — level_of_care
          (branch), elapsed_day_index (tier threshold at 60), and high_intensity (gate) — where the
          routine branch nests a threshold inside an enum branch; a GIP day on day 1 pays 110000 while
          a ROUTINE day on day 1 pays 21000, proving the branch dominates the day index.
        test_recipe:
          setup:
            - "Election elected 2026-02-01; clock at 2026-02-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Combo Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Combo Pt", election_date: "2026-02-01T00:00:00Z", attending_physician_id: "ext-att-3" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-02-01T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
              captures: { gip_id: $.data.id }
          assert:
            - "CareDay.${gip_id}.payment_cents == 110000"
            - "CareDay.${gip_id}.level_of_care == GIP"

      - name: cap_allowance_evaluation_order_pinned
        grounds:
          - calculations.provisional_cap_liability
          - entities.Provider.fields.cap_liability_cents
          - entities.Provider.fields.counted_beneficiaries
          - endpoints["GET /hospice/providers/{id}/cap-summary"]
        distinguishing_aspect: |
          Mode (c): cap_liability_cents has a circular-looking dependency the scaffold pins by order —
          counted_beneficiaries must be evaluated FIRST (it determines cap_allowance_cents =
          per_beneficiary_cap_cents * counted_beneficiaries), THEN liability = max(0, total - allowance);
          adding a second beneficiary changes counted_beneficiaries → allowance → liability in that fixed
          order, dropping liability from 130000 to 40000.
        test_recipe:
          setup:
            - "Provider with per_beneficiary_cap_cents=200000; Election E1 with 3 GIP days (330000)."
            - "Then Election E2 under the same provider with 1 GIP day (110000)."
            - "Clock at 2026-01-10."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Order Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 200000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Ord One", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-4" }
              as: IntakeCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e1_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e1_id}", service_date: "2026-01-03T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e1_id}", service_date: "2026-01-04T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Ord Two", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-5" }
              as: IntakeCoordinator
              captures: { e2_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e2_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
          trigger:
            - call: "GET /hospice/providers/${prov_id}/cap-summary"
              payload: {}
              as: BillingAdmin
              captures: { liab: $.data.cap_liability_cents }
          assert:
            - "Provider.${prov_id}.counted_beneficiaries == 2"
            - "Provider.${prov_id}.total_paid_cents == 440000"
            - "Provider.${prov_id}.cap_liability_cents == 40000"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: certification_branch_certify_vs_reject
        grounds:
          - state_machines.Certification.DRAFT_to_CERTIFIED
          - state_machines.Certification.DRAFT_to_REJECTED
          - entities.Certification.fields.status
          - endpoints["POST /hospice/certifications"]
        distinguishing_aspect: |
          Branching shape on the Certification entity: the same POST /certifications trigger forks to
          CERTIFIED (narrative present, version bumps, next period materialized) or REJECTED (narrative
          absent, no version bump) — divergent side-effect sets per branch on one entity.
        test_recipe:
          setup:
            - "Election elected 2026-01-01; medical-director physician registered; period 1 PENDING_CERT."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Cert Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /hospice/physicians"
              payload: { full_name: "Dr Director", is_medical_director: true }
              as: ClinicalManager
              captures: { md_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Cert Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-6" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver: $.data.version }
          trigger:
            - call: "POST /hospice/certifications"
              payload: { election_id: "${e_id}", period_sequence: 1, certifying_physician_id: "${md_id}", narrative_present: false, expected_election_version: "${e_ver}", commit: true }
              as: Physician
              as_user_id: "${md_id}"
              captures: { rej_status: $.data.status }
          assert:
            - "Certification.status == REJECTED"
            - "Election.${e_id}.version == ${e_ver}"

      - name: careplan_cyclic_revise_loop
        grounds:
          - state_machines.CarePlan.ACTIVE_to_SUPERSEDED
          - state_machines.CarePlan.null_to_ACTIVE
          - entities.CarePlan.fields.status
          - entities.CarePlan.fields.supersedes_plan_id
          - endpoints["POST /hospice/care-plans"]
        distinguishing_aspect: |
          Cyclic shape on the CarePlan entity (distinct from Certification): committing a revision loops
          ACTIVE→ACTIVE while flipping the prior revision ACTIVE→SUPERSEDED; revision_number increments
          1→2 and only one ACTIVE plan exists per election at any time.
        test_recipe:
          setup:
            - "Election elected 2026-01-01 with one ACTIVE CarePlan (revision 1)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Plan Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Plan Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-7" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver0: $.data.version }
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver0}" }
              as: ClinicalManager
              captures: { plan1_id: $.data.id }
            - call: "GET /hospice/elections/${e_id}"
              payload: {}
              as: ClinicalManager
              captures: { e_ver1: $.data.version }
          trigger:
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", supersedes_plan_id: "${plan1_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR","AIDE"], expected_election_version: "${e_ver1}" }
              as: ClinicalManager
              captures: { plan2_id: $.data.id }
          assert:
            - "CarePlan.${plan2_id}.revision_number == 2"
            - "CarePlan.${plan2_id}.status == ACTIVE"
            - "CarePlan.${plan1_id}.status == SUPERSEDED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: careday_post_cascade_period_bind_daysused_capledger
        grounds:
          - state_machines.CareDay
          - calculations.days_used_reconciliation
          - calculations.provisional_cap_liability
          - entities.Election.fields.days_used_in_period
          - entities.Provider.fields.cap_liability_cents
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /care-days: (1) posting binds benefit_period_id, which
          (2) causes Election.days_used_in_period to recount (1), which posting in turn (3) causes the
          Provider cap ledger to recompute total_paid_cents/cap_liability_cents — each link caused by the
          prior link's mutation, not a direct fan-out from the original POST.
        test_recipe:
          setup:
            - "Provider per_beneficiary_cap_cents=200000; Election elected 2026-01-02; clock 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Casc Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 200000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Casc Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-8" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
              captures: { cd_id: $.data.id, bp_bound: $.data.benefit_period_id }
          assert:
            - "CareDay.${cd_id}.benefit_period_id != null"
            - "Election.${e_id}.days_used_in_period == 1"
            - "Provider.${prov_id}.total_paid_cents == 110000"
            - "Provider.${prov_id}.cap_liability_cents == 0"

      - name: certify_cascade_period_certified_next_materialized
        grounds:
          - state_machines.Election.ELECTED_to_ELECTED
          - state_machines.Certification.DRAFT_to_CERTIFIED
          - entities.BenefitPeriod.fields.cert_status
          - entities.BenefitPeriod.fields.sequence
          - endpoints["POST /hospice/certifications"]
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST /certifications): committing the period-1 cert
          (1) flips period 1 cert_status PENDING_CERT→CERTIFIED, which (2) causes the next BenefitPeriod
          (sequence 2, 90 days) to be materialized as PENDING_CERT — the materialization is caused by the
          certify side-effect, not requested directly.
        test_recipe:
          setup:
            - "Election elected 2026-01-01; medical-director physician; period 1 PENDING_CERT."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Mat Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /hospice/physicians"
              payload: { full_name: "Dr Mat", is_medical_director: true }
              as: ClinicalManager
              captures: { md_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Mat Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-9" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver: $.data.version }
          trigger:
            - call: "POST /hospice/certifications"
              payload: { election_id: "${e_id}", period_sequence: 1, certifying_physician_id: "${md_id}", narrative_present: true, expected_election_version: "${e_ver}", commit: true }
              as: Physician
              as_user_id: "${md_id}"
              captures: { cert_id: $.data.id }
          assert:
            - "Certification.${cert_id}.status == CERTIFIED"
            - "BenefitPeriod where election_id==${e_id} and sequence==1 has cert_status == CERTIFIED"
            - "BenefitPeriod where election_id==${e_id} and sequence==2 exists with cert_status == PENDING_CERT and length_days == 90"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_elected_state_beats_face_to_face_safety
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_ELECTION_NOT_ELECTED]
          - errors[ERR_FACE_TO_FACE_REQUIRED]
          - endpoints["POST /hospice/certifications"]
        distinguishing_aspect: |
          Category pair state (priority 4, ERR_ELECTION_NOT_ELECTED) vs business_safety (priority 7,
          ERR_FACE_TO_FACE_REQUIRED): a certify on a REVOKED election that ALSO omits a required
          face-to-face for sequence 3 returns ERR_ELECTION_NOT_ELECTED because the state check is
          higher priority.
        test_recipe:
          setup:
            - "Election elected 2026-01-01 then REVOKED on 2026-01-05; period 1 still PENDING_CERT."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "PC1 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /hospice/physicians"
              payload: { full_name: "Dr PC1", is_medical_director: true }
              as: ClinicalManager
              captures: { md_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "PC1 Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-10" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver: $.data.version }
            - call: "POST /hospice/elections/${e_id}/revoke"
              payload: { revocation_date: "2026-01-05T00:00:00Z" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /hospice/certifications"
              payload: { election_id: "${e_id}", period_sequence: 3, certifying_physician_id: "${md_id}", narrative_present: true, expected_election_version: "${e_ver}", commit: true }
              as: Physician
              as_user_id: "${md_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ELECTION_NOT_ELECTED"

      - name: item_not_covered_beats_plan_not_active_referential
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_ITEM_NOT_COVERED]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - endpoints["POST /hospice/coverage-items"]
        distinguishing_aspect: |
          Category pair business_constraint (priority 10, ERR_ITEM_NOT_COVERED) vs business_referential
          (priority 11, ERR_PLAN_NOT_ACTIVE): ordering a non-terminal-dx item against a SUPERSEDED plan
          returns ERR_ITEM_NOT_COVERED because the coverage constraint (priority 10) is checked before
          the plan-active referential check (priority 11) — a different category pair from instance 1.
        test_recipe:
          setup:
            - "Election elected 2026-01-01; CarePlan revision 1 then superseded by revision 2 (plan1 SUPERSEDED)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "PC2 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "PC2 Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-11" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver0: $.data.version }
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver0}" }
              as: ClinicalManager
              captures: { plan1_id: $.data.id }
            - call: "GET /hospice/elections/${e_id}"
              payload: {}
              as: ClinicalManager
              captures: { e_ver1: $.data.version }
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", supersedes_plan_id: "${plan1_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver1}" }
              as: ClinicalManager
              captures: { plan2_id: $.data.id }
          trigger:
            - call: "POST /hospice/coverage-items"
              payload: { election_id: "${e_id}", care_plan_id: "${plan1_id}", item_type: "MEDICATION", related_to_terminal_dx: false }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ITEM_NOT_COVERED"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: routine_tier_boundary_at_elapsed_day_60
        grounds:
          - calculations.day_per_diem
          - entities.CareDay.fields.payment_cents
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: |
          Numeric-threshold boundary on the per-diem metric reached via POST /care-days: elapsed_day_index
          59 (60th day, high) pays 21000 while elapsed_day_index 60 (61st day, base) pays 16500 — the
          tier flips at < 60 vs >= 60, not at 61.
        test_recipe:
          setup:
            - "Election elected 2026-01-01; ROUTINE day on day index 59 (2026-03-01) and day index 60 (2026-03-02)."
            - "Clock advanced to 2026-03-03."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Bnd1 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Bnd1 Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-12" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-03-01T00:00:00Z", level_of_care: "ROUTINE", high_intensity: true }
              as: ClinicalManager
              captures: { day59_id: $.data.id }
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-03-02T00:00:00Z", level_of_care: "ROUTINE", high_intensity: false }
              as: ClinicalManager
              captures: { day60_id: $.data.id }
          assert:
            - "CareDay.${day59_id}.payment_cents == 21000"
            - "CareDay.${day60_id}.payment_cents == 16500"

      - name: respite_consecutive_run_boundary_at_5
        grounds:
          - calculations.respite_run_length
          - validations[priority=13]
          - errors[ERR_RESPITE_LIMIT_EXCEEDED]
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: |
          A DIFFERENT metric (consecutive-run count, not a per-diem rate) reached via the same endpoint:
          the 5th consecutive RESPITE day succeeds (run_length 5) but the 6th is rejected with
          ERR_RESPITE_LIMIT_EXCEEDED — boundary at run == 5 inclusive vs 6.
        test_recipe:
          setup:
            - "Election elected 2026-01-01; clock advanced to 2026-01-10; 5 consecutive RESPITE days already posted (Jan 1–5)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Bnd2 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Bnd2 Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-13" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-01T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-03T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-04T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-05T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
              captures: { day5_id: $.data.id, run5: $.data.respite_run_length }
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-06T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "CareDay.${day5_id}.respite_run_length == 5"
            - "response_type == error"
            - "data.error_id == ERR_RESPITE_LIMIT_EXCEEDED"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bereavement_requires_election_discharged_by_death
        grounds:
          - state_machines.BereavementCase.null_to_OPEN
          - entities.Election.fields.bereavement_required
          - validations[priority=16]
          - errors[ERR_BEREAVEMENT_NOT_ELIGIBLE]
          - endpoints["POST /hospice/bereavement-cases"]
        distinguishing_aspect: |
          Entity pair BereavementCase→Election: opening a bereavement case is permitted only when the
          referenced Election is DISCHARGED with bereavement_required==true (DEATH discharge); a REVOKED
          election (bereavement_required false) yields ERR_BEREAVEMENT_NOT_ELIGIBLE.
        test_recipe:
          setup:
            - "Election elected 2026-01-01 then REVOKED on 2026-01-10 (not death)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Ce1 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Ce1 Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-14" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/elections/${e_id}/revoke"
              payload: { revocation_date: "2026-01-10T00:00:00Z" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /hospice/bereavement-cases"
              payload: { election_id: "${e_id}", enrolled_date: "2026-01-11T00:00:00Z" }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_BEREAVEMENT_NOT_ELIGIBLE"

      - name: coverage_item_requires_active_care_plan
        grounds:
          - entities.CoverageItem.fields.care_plan_id
          - entities.CarePlan.fields.status
          - validations[priority=11]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - endpoints["POST /hospice/coverage-items"]
        distinguishing_aspect: |
          A DIFFERENT entity pair CoverageItem→CarePlan: ordering a terminal-dx-related item against a
          SUPERSEDED CarePlan yields ERR_PLAN_NOT_ACTIVE; the same item against the ACTIVE revision
          succeeds with coverage_status==COVERED.
        test_recipe:
          setup:
            - "Election elected 2026-01-01; CarePlan revision 1 superseded by revision 2 (plan1 SUPERSEDED, plan2 ACTIVE)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Ce2 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Ce2 Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-15" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver0: $.data.version }
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver0}" }
              as: ClinicalManager
              captures: { plan1_id: $.data.id }
            - call: "GET /hospice/elections/${e_id}"
              payload: {}
              as: ClinicalManager
              captures: { e_ver1: $.data.version }
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", supersedes_plan_id: "${plan1_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver1}" }
              as: ClinicalManager
              captures: { plan2_id: $.data.id }
          trigger:
            - call: "POST /hospice/coverage-items"
              payload: { election_id: "${e_id}", care_plan_id: "${plan1_id}", item_type: "DME", related_to_terminal_dx: true }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_PLAN_NOT_ACTIVE"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_care_day_same_service_date
        grounds:
          - validations[priority=15]
          - entities.CareDay.fields.service_date
          - errors[ERR_DUPLICATE_CARE_DAY]
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: |
          Point-collision interval semantics on the CareDay resource: two CareDays on the SAME
          service_date (zero-width interval, exact-equality overlap) for one election collide and the
          second is rejected with ERR_DUPLICATE_CARE_DAY.
        test_recipe:
          setup:
            - "Election elected 2026-01-02; clock 2026-01-02; one GIP day already posted on 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "To1 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "To1 Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-16" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "ROUTINE", high_intensity: true }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DUPLICATE_CARE_DAY"

      - name: respite_run_adjacency_overlap_window
        grounds:
          - calculations.respite_run_length
          - validations[priority=13]
          - entities.CareDay.fields.respite_run_length
          - errors[ERR_RESPITE_LIMIT_EXCEEDED]
          - endpoints["POST /hospice/care-days"]
        distinguishing_aspect: |
          A DIFFERENT interval semantics on the same CareDay resource: not point-equality but
          contiguous-adjacency aggregation — RESPITE days form a run only when calendar-adjacent (gap 0),
          and a 6th adjacent RESPITE day breaches the 5-day window. A non-adjacent RESPITE day (gap >= 1)
          resets the run to 1 and is accepted, proving the adjacency rule differs from the equality rule.
        test_recipe:
          setup:
            - "Election elected 2026-01-01; clock 2026-01-20; 5 consecutive RESPITE days Jan 1–5 already posted (run reached 5)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "To2 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "To2 Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-17" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-01T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-03T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-04T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-05T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-08T00:00:00Z", level_of_care: "RESPITE", high_intensity: false }
              as: ClinicalManager
              captures: { newrun_id: $.data.id, newrun: $.data.respite_run_length }
          assert:
            - "CareDay.${newrun_id}.respite_run_length == 1"
            - "CareDay.${newrun_id}.level_of_care == RESPITE"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cap_ledger_conserved_total_paid_equals_sum_of_caredays
        grounds:
          - calculations.provisional_cap_liability
          - entities.Provider.fields.total_paid_cents
          - entities.CareDay.fields.payment_cents
          - endpoints["POST /hospice/care-days"]
          - endpoints["GET /hospice/providers/{id}/cap-summary"]
        distinguishing_aspect: |
          Conserved quantity = money (Provider.total_paid_cents). The named invariant is
          total_paid_cents == sum(CareDay.payment_cents) over all in-window care-days of the provider's
          elections; after posting 2 GIP days (110000 each) total_paid_cents == 220000 with zero drift
          versus the explicit sum.
        test_recipe:
          setup:
            - "Provider per_beneficiary_cap_cents=3490000; Election elected 2026-01-02; clock 2026-01-02; 2 GIP days posted."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Inv1 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Inv1 Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-18" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
              captures: { cd1_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-03T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
              captures: { cd2_id: $.data.id }
          trigger:
            - call: "GET /hospice/providers/${prov_id}/cap-summary"
              payload: {}
              as: BillingAdmin
              captures: { tp: $.data.total_paid_cents }
          assert:
            - "CareDay.${cd1_id}.payment_cents == 110000"
            - "CareDay.${cd2_id}.payment_cents == 110000"
            - "Provider.${prov_id}.total_paid_cents == 220000"

      - name: days_used_conserved_equals_current_period_careday_count
        grounds:
          - calculations.days_used_reconciliation
          - entities.Election.fields.days_used_in_period
          - entities.CareDay.fields.benefit_period_id
          - endpoints["POST /hospice/care-days"]
          - endpoints["GET /hospice/elections/{id}"]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = a day-count (Election.days_used_in_period), not money. The
          invariant is days_used_in_period == count(CareDay bound to the current benefit period); after
          posting 3 ROUTINE days inside period 1, days_used_in_period == 3 with no drift versus the
          care-day count, conserved independently of the dollar ledger.
        test_recipe:
          setup:
            - "Election elected 2026-01-02; clock 2026-01-05; 3 ROUTINE high days posted on Jan 2,3,4 (all in period 1)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "Inv2 Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Inv2 Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-19" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "ROUTINE", high_intensity: true }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-03T00:00:00Z", level_of_care: "ROUTINE", high_intensity: true }
              as: ClinicalManager
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-04T00:00:00Z", level_of_care: "ROUTINE", high_intensity: true }
              as: ClinicalManager
          trigger:
            - call: "GET /hospice/elections/${e_id}"
              payload: {}
              as: ClinicalManager
              captures: { du: $.data.days_used_in_period }
          assert:
            - "Election.${e_id}.days_used_in_period == 3"
            - "Election.${e_id}.current_period_number == 1"
