              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-09-15T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np2_id: $.data.id }
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-09-01T00:00:00Z" }
              as: PrivacyOfficer
