# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Urgent Care Walk-In Queue & Visit — EXPERT tier
# Breadth probe across claim-extraction-guide sections. Every grounds[] ref
# resolves into SCAFFOLD.yaml §1.1–§1.7. excluded_because stubs cite §1.8 names.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_clinic_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.Clinic, endpoints]
        distinguishing_aspect: "POST /clinics with name+exam_room_capacity -> 201, posture==OPEN, active_queue_depth==0, rooms_occupied==0, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "Fresh Clinic", exam_room_capacity: 5 }
              as: Anonymous
              captures: { cid: $.data.id, ver: $.data.version, post: $.data.posture }
          assert:
            - "response status == 201"
            - "Clinic.${cid}.posture == OPEN"
            - "Clinic.${cid}.active_queue_depth == 0 AND Clinic.${cid}.rooms_occupied == 0"
            - "Clinic.${cid}.version == 1"

      - name: get_clinic_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Clinic, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /clinics/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clinics/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_queue_entry_missing_required_chief_complaint_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.QueueEntry.fields.chief_complaint, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clinics/{id}/queue-entries omitting chief_complaint -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One clinic exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "ReqClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
          trigger:
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN" }
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_exam_room_default_room_type_standard_applied
        claim_type: Defaults
        grounds: [entities.ExamRoom.fields.room_type]
        distinguishing_aspect: "POST exam-room omitting room_type -> default STANDARD applied; status default AVAILABLE."
        test_recipe:
          setup: ["One clinic exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "DefClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
          trigger:
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "RoomDef" }
              as: ClinicManager
              captures: { rid: $.data.id, rt: $.data.room_type, st: $.data.status }
          assert:
            - "ExamRoom.${rid}.room_type == STANDARD"
            - "ExamRoom.${rid}.status == AVAILABLE"

      - name: patient_is_minor_computed_from_dob_ignores_client_value
        claim_type: Computed Fields
        grounds: [entities.Patient.fields.is_minor, calculations.minor_flag]
        distinguishing_aspect: "is_minor is server-computed from date_of_birth vs clock; DOB 2015-01-01 at clock 2026-06-08 -> is_minor==true (age 11)."
        test_recipe:
          setup: ["Clock 2026-06-08T12:00:00Z; one clinic with a TRIAGED entry; minor's guarantor supplied."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T12:00:00Z" }
              as: Anonymous
            - call: "POST /clinics"
              payload: { name: "MinorClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "minor" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 4 }
              as: TriageNurse
          trigger:
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "Kid Pat", date_of_birth: "2015-01-01", guarantor_name: "Parent", consent_signed: true }
              as: FrontDeskClerk
              captures: { pid: $.data.id, minor: $.data.is_minor }
          assert:
            - "response status == 201"
            - "Patient.${pid}.is_minor == true"

      - name: create_queue_entry_invalid_arrival_channel_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.QueueEntry.fields.arrival_channel, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "arrival_channel='MAIL' (not in {ONLINE,WALK_IN}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One clinic exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "EnumClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
          trigger:
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "MAIL", chief_complaint: "x" }
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: triage_esi_level_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.QueueEntry.fields.esi_level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "triage with esi_level=6 (outside 1..5) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One clinic with a WAITING entry."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "EsiClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "esi-range" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
          trigger:
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 6 }
              as: TriageNurse
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_charge_zero_amount_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Charge.fields.amount_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST charge with amount_cents=0 (constraint > 0) -> ERR_INVALID_REQUEST (400) — zero-quantity boundary on a different endpoint than the esi range."
        test_recipe:
          setup: ["One roomed Visit (billing OPEN)."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "ChgZeroClinic", exam_room_capacity: 2, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "Z1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr Z", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "z" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 4 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "Z Pat", date_of_birth: "1980-01-01", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
          trigger:
            - call: "POST /visits/${visit}/charges"
              payload: { cpt_code: "BAD", amount_cents: 0 }
              as: Provider
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_patient_wrong_queue_entry_fk_returns_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Patient.fields.queue_entry_id, "errors[ERR_FK_NOT_FOUND]"]
        distinguishing_aspect: "POST /patients with a non-existent queue_entry_id -> ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no queue entries)."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { queue_entry_id: "00000000-0000-4000-8000-000000000001", legal_name: "No QE", date_of_birth: "1990-01-01", consent_signed: true }
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

      - name: system_fields_id_created_at_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Clinic]
        distinguishing_aspect: "id/created_at/version are server-minted; the response carries a UUID id and ISO-8601 created_at the client did not supply."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "SysClinic", exam_room_capacity: 3 }
              as: Anonymous
              captures: { cid: $.data.id, ca: $.data.created_at }
          assert:
            - "Clinic.${cid}.id is a server-minted UUID"
            - "Clinic.${cid}.created_at is an ISO-8601 UTC timestamp"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: triage_from_triaged_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.QueueEntry.WAITING_to_TRIAGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling triage on an already-TRIAGED entry (no WAITING->TRIAGED available) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One TRIAGED entry."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "InvStClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "t" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
          trigger:
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 2 }
              as: TriageNurse
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_from_terminal_roomed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.QueueEntry.RESERVED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "cancel on a ROOMED (terminal) entry -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["One ROOMED entry (its Visit exists)."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "TermClinic", exam_room_capacity: 2, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "T1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr T", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "term" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "T Pat", date_of_birth: "1990-01-01", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "SELF_PAY" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
          trigger:
            - call: "POST /clinics/${c}/queue-entries/${qe}/cancel"
              payload: {}
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: new_walk_in_entry_starts_in_waiting
        claim_type: Initial State
        grounds: [state_machines.QueueEntry.none_to_WAITING]
        distinguishing_aspect: "A WALK_IN create yields status==WAITING immediately (initial state for the walk-in branch)."
        test_recipe:
          setup: ["One clinic exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "InitClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
          trigger:
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "init" }
              as: FrontDeskClerk
              captures: { qe: $.data.id, st: $.data.status }
          assert:
            - "QueueEntry.${qe}.status == WAITING"

      - name: online_entry_starts_reserved_with_hold_window
        claim_type: Initial State
        grounds: [state_machines.QueueEntry.none_to_RESERVED, calculations.hold_window]
        distinguishing_aspect: "An ONLINE create yields status==RESERVED with hold_expires_at == reserved_at + 30min; depth unchanged (RESERVED not counted)."
        test_recipe:
          setup: ["Clock 2026-06-08T08:00:00Z; one clinic."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: Anonymous
            - call: "POST /clinics"
              payload: { name: "OnlineClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
          trigger:
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "ONLINE", chief_complaint: "save-spot" }
              as: Patient
              captures: { qe: $.data.id, st: $.data.status, exp: $.data.hold_expires_at }
            - call: "GET /clinics/${c}"
              payload: {}
              as: Patient
              captures: { depth: $.data.active_queue_depth }
          assert:
            - "QueueEntry.${qe}.status == RESERVED"
            - "QueueEntry.${qe}.hold_expires_at == 2026-06-08T08:30:00.000Z"
            - "Clinic.${c}.active_queue_depth == 0"

      - name: reserved_hold_expires_on_run_ops_past_window
        claim_type: Side Effect Execution
        grounds: [state_machines.QueueEntry.RESERVED_to_EXPIRED, calculations.hold_window]
        distinguishing_aspect: "An ONLINE RESERVED entry whose hold_expires_at has passed is swept to EXPIRED by run-ops; boundary is strictly-after (clock 08:31 > 08:30)."
        test_recipe:
          setup: ["Clock 2026-06-08T08:00:00Z; one ONLINE RESERVED entry (expires 08:30); clock then advanced to 08:31."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: Anonymous
            - call: "POST /clinics"
              payload: { name: "ExpClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "ONLINE", chief_complaint: "expire-me" }
              as: Patient
              captures: { qe: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T08:31:00Z" }
              as: Anonymous
          trigger:
            - call: "POST /clinics/${c}/run-ops"
              payload: {}
              as: ClinicManager
            - call: "GET /queue-entries/${qe}"
              payload: {}
              as: Patient
              captures: { st: $.data.status }
          assert:
            - "QueueEntry.${qe}.status == EXPIRED"

      - name: arrive_after_hold_expired_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.QueueEntry.RESERVED_to_WAITING, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Arrive on an entry already EXPIRED (swept by run-ops) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ONLINE entry that has already EXPIRED via run-ops (clock past hold)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: Anonymous
            - call: "POST /clinics"
              payload: { name: "ArrExpClinic", exam_room_capacity: 2 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "ONLINE", chief_complaint: "late" }
              as: Patient
              captures: { qe: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-08T09:00:00Z" }
              as: Anonymous
            - call: "POST /clinics/${c}/run-ops"
              payload: {}
              as: ClinicManager
          trigger:
            - call: "POST /clinics/${c}/queue-entries/${qe}/arrive"
              payload: {}
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: settle_with_correct_version_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Visit.INVOICED_to_SETTLED, "concurrency_rules[visit-settle-stale-version]"]
        distinguishing_aspect: "Settle an INVOICED Visit with the correct expected_visit_version -> billing_status SETTLED."
        test_recipe:
          setup: ["One Visit billing INVOICED with a verified-insurance patient (copay 1000)."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "SettleClinic", exam_room_capacity: 2, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "SE1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr SE", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "settle" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 3 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "SE Pat", date_of_birth: "1990-01-01", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
              payload: { patient_id: "${pat}", coverage_type: "INSURANCE", payer_name: "Cigna", member_id: "X9", copay_cents: 1000 }
              as: FrontDeskClerk
              captures: { cov: $.data.id }
            - call: "POST /coverages/${cov}/verify"
              payload: { outcome: "ELIGIBLE" }
              as: FrontDeskClerk
            - call: "POST /clinics/${c}/queue-entries/${qe}/mark-ready"
              payload: {}
              as: FrontDeskClerk
            - call: "GET /clinics/${c}"
              payload: {}
              as: Provider
              captures: { cv: $.data.version }
            - call: "POST /visits"
              payload: { queue_entry_id: "${qe}", provider_id: "${prov}", exam_room_id: "${room}", expected_clinic_version: "${cv}" }
              as: Provider
              captures: { visit: $.data.id }
            - call: "POST /visits/${visit}/charges"
              payload: { cpt_code: "S1", amount_cents: 9000 }
              as: Provider
            - call: "POST /visits/${visit}/post-charges"
              payload: {}
              as: Provider
            - call: "POST /visits/${visit}/invoice"
              payload: {}
              as: FrontDeskClerk
              captures: { vv: $.data.version }
          trigger:
            - call: "POST /visits/${visit}/settle"
              payload: { expected_visit_version: "${vv}" }
              as: FrontDeskClerk
              captures: { bs: $.data.billing_status }
          assert:
            - "Visit.${visit}.billing_status == SETTLED"

      - name: post_charges_with_no_charges_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Visit.OPEN_to_CHARGES_POSTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "post-charges on a Visit with zero non-voided charges violates the 'at least one charge' precondition -> ERR_INVALID_STATE (409) (empty-set boundary)."
        test_recipe:
          setup: ["One roomed Visit with NO charges, billing OPEN."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "NoChgClinic", exam_room_capacity: 2, self_pay_discount_pct: 0.30 }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /clinics/${c}/exam-rooms"
              payload: { room_label: "N1" }
              as: ClinicManager
              captures: { room: $.data.id }
            - call: "POST /clinics/${c}/providers"
              payload: { full_name: "Dr N", credential: "MD" }
              as: ClinicManager
              captures: { prov: $.data.id }
            - call: "POST /clinics/${c}/queue-entries"
              payload: { arrival_channel: "WALK_IN", chief_complaint: "nochg" }
              as: FrontDeskClerk
              captures: { qe: $.data.id }
            - call: "POST /clinics/${c}/queue-entries/${qe}/triage"
              payload: { esi_level: 4 }
              as: TriageNurse
            - call: "POST /patients"
              payload: { queue_entry_id: "${qe}", legal_name: "N Pat", date_of_birth: "1990-01-01", consent_signed: true }
              as: FrontDeskClerk
              captures: { pat: $.data.id }
            - call: "POST /coverages"
