              captures: { prof_full: $.data.id }
          trigger:
            - call: "POST /channel-disclosure-profiles/${prof_full}/deploy"
              payload: {}
              as: ChannelOperator
              as_user_id: "${c_ota}"
          assert:
            - "before the trigger: ChannelDisclosureProfile.${prof_low}.status == DRAFT with disclosure_score == 10, ${prof_full}.status == DRAFT with disclosure_score == 100, and Property.${p1}.min_channel_disclosure_score is NULL with disclosure_posture COMPLIANT — an empty candidate set, not a minimum of 10"
