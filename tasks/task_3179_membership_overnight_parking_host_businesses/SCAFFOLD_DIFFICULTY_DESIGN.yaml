  # ---------------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_occupancy_half_open_date_interval_no_buffers
        grounds:
          - validations[priority=10]
          - entities.StayRequest.fields.arrival_date
          - entities.StayRequest.fields.departure_date
          - entities.MemberVehicle.fields.vehicle_class
        distinguishing_aspect: |
          Half-open date-interval arithmetic with zero adjacency slack on the
          MemberVehicle: [arrival_date, departure_date) means a stay departing
          2026-06-08 and one arriving 2026-06-08 touch and are rejected with
          ERR_VEHICLE_OCCUPANCY_OVERLAP, while the same request a day later is a
          clear gap and succeeds.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-06-01T00:00:00Z"
            - "TX/FARM host approved with two 40-foot sites V1 and V2"
            - "One ACTIVE PLUS member with one self-contained 30-foot CLASS_C vehicle"
            - "A stay on the vehicle arriving 2026-06-06 for 2 nights: dates 2026-06-06 to 2026-06-08"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Touch Farm", category: "FARM", address_line1: "17 Turn Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_tc: $.data.id }
            - call: "POST /api/hosts/${h_tc}/parking-sites"
              payload: { site_label: "V1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "POST /api/hosts/${h_tc}/parking-sites"
              payload: { site_label: "V2", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_tc}"
              payload: {}
              as: HostOperator
              captures: { h_tc_v1: $.data.version }
            - call: "POST /api/hosts/${h_tc}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_tc_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "m15@x.com", full_name: "M Fifteen", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m15: $.data.id }
            - call: "POST /api/members/${m15}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m15}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m15}"
              captures: { v15: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_tc}", member_id: "${m15}", vehicle_id: "${v15}", arrival_date: "2026-06-06", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m15}"
              captures: { s_first: $.data.id }
            - call: "GET /api/hosts/${h_tc}"
              payload: {}
              as: HostOperator
              captures: { h_tc_v2: $.data.version }
            - call: "POST /api/stay-requests/${s_first}/decisions"
              payload: { decision: "CONFIRM", site_id: "V1", expected_host_version: "${h_tc_v2}" }
              as: HostOperator
              as_user_id: "${h_tc}"
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_tc}", member_id: "${m15}", vehicle_id: "${v15}", arrival_date: "2026-06-08", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m15}"
              captures: { s_touch: $.data.id }
          trigger:
            - call: "GET /api/hosts/${h_tc}"
              payload: {}
              as: HostOperator
              captures: { h_tc_v3: $.data.version }
            - call: "POST /api/stay-requests/${s_touch}/decisions"
              payload: { decision: "CONFIRM", site_id: "V2", expected_host_version: "${h_tc_v3}" }
              as: HostOperator
              as_user_id: "${h_tc}"
              captures: { touch_err: $.data.error_id, touch_msg: $.data.message }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_tc}", member_id: "${m15}", vehicle_id: "${v15}", arrival_date: "2026-06-09", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m15}"
              captures: { s_gap: $.data.id }
          assert:
            - "the ${s_touch} confirm returns error_id \"ERR_VEHICLE_OCCUPANCY_OVERLAP\" with http 409 — [2026-06-08, 2026-06-10) touches [2026-06-06, 2026-06-08)"
            - "StayRequest.${s_touch}.request_status is still \"REQUESTED\", so the conflict was detected before any assignment"
            - "the ${s_gap} request on the same vehicle is created successfully with request_status \"REQUESTED\""
            - "there is no buffer in this rule: the rejection is caused by exact adjacency at 2026-06-08T00:00 UTC, not by a slack margin"

      - name: blocked_approach_hour_interval_with_two_hour_buffer
        grounds:
          - validations[priority=11]
          - entities.HostParkingSite.fields.blocks_sites
          - entities.HostBusiness.fields.arrival_window_start_hour
          - endpoints./api/hosts/{hostId}/parking-sites/{siteId}/availability
        distinguishing_aspect: |
          Hour-grid interval arithmetic with a 2-hour symmetric buffer on the
          HostParkingSite: a circulating PULL_THROUGH stay ending 2026-07-05T11:00
          blocks a BACK_IN site whose new interval starts 2026-07-05T14:00 because
          the buffer reaches 13:00, while the same assignment three days later is
          clear — a different geometry from the zero-buffer date rule.
        test_recipe:
