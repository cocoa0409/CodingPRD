      - name: same_kind_phases_closer_than_48_hours_cannot_both_start
        claim_type: temporal_validation
        grounds:
          - validations.priority_69_5_phase_gap
          - errors.ERR_PHASE_GAP_VIOLATION
        distinguishing_aspect: |
          The 48-hour separation applies only to same-kind phases whose windows do NOT overlap — a
          24-hour gap after the first window is refused at construction-start, while a gap of exactly 48
          hours is allowed. The refusal happens at start, not at creation, so the rejected phase is still
          sitting in PLANNED afterwards.
        test_recipe:
          setup:
            - "Community 'Mistwood' with plat APPROVED and three HOUSING phases: window 08-01..09-01 (started), window 09-02..11-01 (24h gap), window 09-03..12-01 (exactly 48h gap)."
