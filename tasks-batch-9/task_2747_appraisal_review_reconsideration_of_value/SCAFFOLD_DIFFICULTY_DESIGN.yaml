  - rule_id: compensating_invariant
    instances:
      - name: escalation_spend_ledger_restored_on_order_cancel
        grounds:
          - state_machines.EscalationOrder.ASSIGNED_to_CANCELLED
          - entities.AMC.fields.ytd_escalation_spend_cents
          - entities.EscalationOrder.fields.total_cost_cents
          - calculations.escalation_cost_allocation
          - endpoints.POST_escalation_orders_id_cancel
        distinguishing_aspect: |
          Conserved quantity, pinned as an explicit formula:
            AMC.ytd_escalation_spend_cents
              == sum(o.total_cost_cents for o in EscalationOrder
                     where o.amc_id == this AMC and o.status IN {ASSIGNED, REASSIGNMENT_REQUIRED, COMPLETED})
          Cancelling drops the order out of that set, so the ledger must fall back to 0 while the
          order KEEPS its computed total_cost_cents as an audit record. The invariant is about
          money committed to escalations -- a different conserved quantity from the value-of-record
          invariant in the other instance.
        test_recipe:
          setup:
            - "Clock at its default 2026-08-01T00:00:00Z."
            - "AMC on the default 500000 budget, with ytd_escalation_spend_cents starting at 0."
            - "Appraiser A authors, appraiser B reviews; both ACTIVE and panelled."
            - "HIGH risk loan file with an appraisal by A carrying 8 sections, 1 exhibit and three benign in-ceiling CLOSED comparables: completeness 8286, zero fails, one WARN, FINAL 8086, so the HIGH tier matrix requires a FIELD_REVIEW."
            - "The desk review is submitted and ESCALATEd, and the order is assigned to B. hours_remaining is exactly 72.0 so there is no rush surcharge, 45000 is below TIER1_FLOOR_CENTS so there is no discount, and the ledger moves 0 -> 45000."
