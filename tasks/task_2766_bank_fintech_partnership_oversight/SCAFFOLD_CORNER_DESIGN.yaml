            - "dr_renew_status == DRAFT and dr_renew_id is created — the PASSED review left the open-set, and a RENEWAL is legal from DILIGENCE_PASSED"
            - "e_agr_open_draft == ERR_AGREEMENT_ALREADY_OPEN (409) — one agreement is in DRAFT"
            - "agr_s1_status == EXECUTED and e_agr_open_exec == ERR_AGREEMENT_ALREADY_OPEN — the rule keeps firing after execution, so the open-set is not merely {DRAFT, PENDING_RISK_APPROVAL}"
            - "agr_s1_term == TERMINATED and plan_s1_id is created — termination is what finally releases the agreement singleton and moves the Partner to WIND_DOWN"
            - "e_plan_open == ERR_PLAN_ALREADY_OPEN (409) — the DRAFT plan already occupies the {DRAFT, PENDING_APPROVAL, APPROVED, IN_EXECUTION} set"

      - name: root_cause_discipline_and_variance_explanation_are_refusals_that_leave_the_row_untouched
        claim_type: Satisfaction to Pass
        grounds:
          - validations.priority_58
          - validations.priority_75
          - errors.ERR_ROOT_CAUSE_REQUIRED
          - errors.ERR_VARIANCE_NOT_EXPLAINED
        distinguishing_aspect: "Both rules are conditional on ONE field of the request rather than on entity state: outcome=RESOLVED demands a root cause while outcome=WITHDRAWN on the identical complaint does not, and clear-variance demands that variance_adjustment_cents + partner_reported_net_cents reconstruct bank_reported_net_cents EXACTLY, so an adjustment that closes half the gap is refused with the same 422 as one of the wrong sign."
        test_recipe:
          setup:
            - "Partner A LIVE. One complaint with root_cause_code null. One batch reconciled to VARIANCE_OPEN with bank_reported_net_cents 8200000 against partner_reported_net_cents 8100000, i.e. variance_cents 100000."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "BANK_CALL_CENTER", category: "DISCLOSURE", severity: "MEDIUM", received_at: "2026-08-01T00:00:00Z", narrative: "Consumer says the fee schedule was never shown at signup.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { cmp_rc_id: $.data.id, cmp_rc_root: $.data.root_cause_code }
            - *q_batch_1
            - call: "POST /oversight/settlement-batches/${b1_id}/reconcile"
              payload: { bank_reported_net_cents: 8200000 }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { b1_var_recon: $.data.reconciliation_status, b1_var_cents: $.data.variance_cents }
          trigger:
            - call: "POST /oversight/complaints/${cmp_rc_id}/disposition"
              payload: { outcome: "RESOLVED", resolution_note: "Resolved without recording a cause." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_root: $.data.error_id }
            - call: "POST /oversight/complaints/${cmp_rc_id}/disposition"
              payload: { outcome: "WITHDRAWN", resolution_note: "Consumer withdrew the complaint." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { cmp_rc_status: $.data.status }
            - call: "POST /oversight/settlement-batches/${b1_id}/clear-variance"
              payload: { variance_adjustment_cents: 50000, root_cause_note: "Half the gap explained by a fee timing difference." }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { e_var: $.data.error_id }
            - call: "POST /oversight/settlement-batches/${b1_id}/clear-variance"
              payload: { variance_adjustment_cents: -100000, root_cause_note: "Right magnitude, wrong sign." }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { e_var_sign: $.data.error_id }
            - call: "POST /oversight/settlement-batches/${b1_id}/clear-variance"
              payload: { variance_adjustment_cents: 100000, root_cause_note: "Interchange posted a day late; fully explained." }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { b1_var_cleared: $.data.reconciliation_status, b1_var_adj: $.data.variance_adjustment_cents, b1_var_base: $.data.settlement_base_cents }
          assert:
            - "cmp_rc_root is null at intake"
            - "e_root == ERR_ROOT_CAUSE_REQUIRED (409) — outcome=RESOLVED needs root_cause_code != null"
            - "cmp_rc_status == WITHDRAWN — the identical complaint disposes fine on the other outcome, so the rule is conditional on the request field"
            - "b1_var_recon == VARIANCE_OPEN and b1_var_cents == 100000 (8200000 - 8100000)"
            - "e_var == ERR_VARIANCE_NOT_EXPLAINED (422) — 50000 + 8100000 == 8150000 != 8200000"
            - "e_var_sign == ERR_VARIANCE_NOT_EXPLAINED — -100000 + 8100000 == 8000000 != 8200000"
            - "b1_var_cleared == VARIANCE_CLEARED, b1_var_adj == 100000 and b1_var_base == 8000000 + 200000 - 100000 + 100000 == 8200000"
            - "the batch is still VARIANCE_OPEN with variance_adjustment_cents 0 after both refusals, and Partner.unreconciled_variance_cents is still 100000 until the successful call removes it"

  # ===========================================================================
  # §1.5 ENDPOINTS — 54 endpoints plus the clock. Breadth over response-shape
  # rules: pagination arithmetic, filter composition, list ordering, computed
  # reads, status codes and FK reverse-reachability.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: filters_compose_and_total_count_describes_the_filtered_set_not_the_page
        claim_type: Computed read
        grounds:
          - endpoints.GET_/oversight/complaints
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "total_count must count the rows matching ALL supplied filters, not the rows on the page and not the whole table, and has_more must be derived from offset + len(data) < total_count rather than from the page being full. The offset-past-the-end probe is the discriminator: it must return an empty data array while still reporting the same total_count and has_more false."
        test_recipe:
          setup:
            - "Partner A holds five complaints: three on channel EMAIL (two LOW, one HIGH) and two on channel CFPB_PORTAL. Partner B holds one EMAIL complaint. Six rows in the table."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_partner_b
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "A-EMAIL-1 low severity fee complaint.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "A-EMAIL-2 low severity fee complaint.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "UNAUTHORIZED_TRANSACTION", severity: "HIGH", received_at: "2026-08-01T00:00:00Z", narrative: "A-EMAIL-3 high severity unauthorised transaction.", is_reg_e_dispute: true }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "CFPB_PORTAL", category: "DISCLOSURE", severity: "MEDIUM", received_at: "2026-08-01T00:00:00Z", narrative: "A-CFPB-1 disclosure complaint.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "CFPB_PORTAL", category: "SERVICING", severity: "MEDIUM", received_at: "2026-08-01T00:00:00Z", narrative: "A-CFPB-2 servicing complaint.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pb_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "B-EMAIL-1 low severity fee complaint.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
          trigger:
            - call: "GET /oversight/complaints"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { all_total: $.total_count, all_limit: $.limit, all_offset: $.offset, all_more: $.has_more }
            - call: "GET /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { f_total: $.total_count, f_more: $.has_more }
            - call: "GET /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", limit: 2, offset: 2 }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { f2_total: $.total_count, f2_more: $.has_more }
            - call: "GET /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", limit: 2, offset: 50 }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { f3_total: $.total_count, f3_more: $.has_more }
            - call: "GET /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", severity: "HIGH" }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { f4_total: $.total_count }
            - call: "GET /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "SOCIAL" }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { f5_total: $.total_count, f5_more: $.has_more }
            - call: "GET /oversight/complaints"
              payload: { limit: 0 }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_limit_low: $.data.error_id }
          assert:
            - "all_total == 6, all_limit == 10, all_offset == 0 and all_more == false — the §1.0 defaults apply when no pagination is supplied"
            - "f_total == 3 and f_more == true — three A/EMAIL rows, page one of two"
            - "the first page carries exactly 2 rows and the second exactly 1"
            - "f2_total == 3 and f2_more == false — offset 2 + 1 returned == 3"
            - "f3_total == 3, the data array is empty and f3_more == false — an offset past the end is not an error"
            - "f4_total == 1 — three filters compose with AND, not OR"
            - "f5_total == 0 and f5_more == false with an empty data array — a filter matching nothing is a 200, not a 404"
            - "e_limit_low == ERR_VALIDATION (422) — limit 0 is below the declared min of 1"

      - name: ledger_entries_list_in_custody_account_then_sequence_no_order_and_every_fk_filter_is_honoured
        claim_type: Listing
        grounds:
          - endpoints.GET_/oversight/ledger-entries
          - entities.LedgerEntry.sequence_no
        distinguishing_aspect: "sequence_no is per-custody-account, not global, so the FBO account and the RESERVE account each start at 1 and the combined list must group by custody_account_id before ordering by sequence_no. Filtering on settlement_batch_id isolates exactly the legs synthesised by funding, and filtering on reversal_of_entry_id isolates exactly the clawback leg that reversed one named entry."
        test_recipe:
          setup:
            - "Partner A LIVE with FBO 8100000 and RESERVE 506250, one MATCHED batch funded and then clawed back, so the ledger holds manual entries on both accounts plus three funding legs and three clawback legs."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
            - *q_fbo_a_read
            - *q_fbo_seed_8100000
            - *q_res_a_read2
            - *q_res_top_193750
            - *q_batch_1
            - call: "POST /oversight/settlement-batches/${b1_id}/reconcile"
              payload: { bank_reported_net_cents: 8100000 }
              as: InternalAudit
              as_user_id: "ia-erin"
            - call: "POST /oversight/settlement-batches/${b1_id}/fund"
              payload: { funding_reference: "WIRE-LIST-1" }
              as: ProgramOfficer
              as_user_id: "po-alice"
            - call: "GET /oversight/ledger-entries"
              payload: { settlement_batch_id: "${b1_id}", entry_type: "RESERVE_FUND" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { fund_leg_id: "$.data[0].id", fund_leg_total: $.total_count }
            - call: "POST /oversight/settlement-batches/${b1_id}/clawback"
              payload: { clawback_reason: "Duplicate wire." }
              as: ProgramOfficer
              as_user_id: "po-alice"
          trigger:
            - call: "GET /oversight/ledger-entries"
              payload: { partner_id: "${pa_id}", limit: 100 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { all_led_total: $.total_count }
            - call: "GET /oversight/ledger-entries"
              payload: { custody_account_id: "${fbo_a_id}", limit: 100 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { fbo_led_total: $.total_count, fbo_first_seq: "$.data[0].sequence_no", fbo_first_type: "$.data[0].entry_type" }
            - call: "GET /oversight/ledger-entries"
              payload: { settlement_batch_id: "${b1_id}", limit: 100 }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { batch_led_total: $.total_count }
            - call: "GET /oversight/ledger-entries"
              payload: { reversal_of_entry_id: "${fund_leg_id}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { rev_total: $.total_count, rev_type: "$.data[0].entry_type", rev_amount: "$.data[0].amount_cents" }
            - call: "GET /oversight/ledger-entries/${fund_leg_id}"
              payload: {}
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { one_led_type: $.data.entry_type, one_led_batch: $.data.settlement_batch_id }
          assert:
            - "all_led_total == 8 — two manual seeds (FBO 8100000 as sequence_no 1, RESERVE 312500 as 1 and 193750 as 2), three funding legs and three clawback legs"
            - "fbo_led_total == 3 and fbo_first_seq == 1 with fbo_first_type == VARIANCE_ADJUSTMENT — per-account numbering restarts at 1, so the FBO list is 1, 2, 3 strictly ascending"
            - "the RESERVE account's list is also 1, 2, 3, 4 strictly ascending — sequence_no is scoped per custody account, never global"
            - "in the unfiltered partner list every row's (custody_account_id, sequence_no) pair is non-decreasing: all rows for one account appear contiguously and ascend by sequence_no inside the group"
            - "fund_leg_total == 1 and batch_led_total == 6 — three funding legs plus three clawback legs all carry settlement_batch_id == ${b1_id}"
            - "rev_total == 1, rev_type == CLAWBACK and rev_amount == -400000 — exactly the negation of the 400000 RESERVE_FUND leg it reverses"
            - "one_led_type == RESERVE_FUND and one_led_batch == ${b1_id} — the single-row GET returns the same row the filtered list returned"

      - name: the_logical_clock_is_settable_in_both_directions_and_recomputes_nothing_by_itself
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - calculations.complaint_response_due_at
        distinguishing_aspect: "The clock endpoint declares side_effects: performs no recomputation, so a stored response_due_at computed under the old clock must NOT move when the clock moves, while the very next intake must use the new clock. The clock is also settable BACKWARDS, which is the only way to prove a deadline was frozen at write time rather than derived on read."
        test_recipe:
          setup:
            - "Partner A. One EMAIL complaint received at the initial clock of 2026-08-01T00:00:00Z, whose response_due_at is computed on the calendar basis."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Baseline complaint used to freeze a deadline.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { clk_cmp_id: $.data.id, clk_cmp_due: $.data.response_due_at, clk_cmp_v: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T12:34:56Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { clk_fwd: $.data.current_utc }
            - call: "GET /oversight/complaints/${clk_cmp_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { clk_cmp_due2: $.data.response_due_at, clk_cmp_v2: $.data.version }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-20T00:00:00Z", narrative: "Second complaint intaken under the advanced clock.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { clk_cmp2_due: $.data.response_due_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { clk_back: $.data.current_utc }
            - call: "GET /oversight/complaints/${clk_cmp_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { clk_cmp_due3: $.data.response_due_at }
          assert:
            - "clk_fwd == 2026-08-20T12:34:56Z and clk_back == 2026-08-01T00:00:00Z — the response is the single field current_utc, and the input field is to_iso8601"
            - "clk_cmp_due2 == clk_cmp_due and clk_cmp_v2 == clk_cmp_v — moving the clock recomputed nothing and bumped no version"
            - "clk_cmp2_due is computed from received_at 2026-08-20 under the new clock and therefore differs from clk_cmp_due — the deadline is a function of received_at, not of the clock at read time"
            - "clk_cmp_due3 == clk_cmp_due after the clock is wound back — the stored deadline is immutable"
            - "no Partner.version changed across any of the four clock calls"

      - name: the_oversight_summary_read_agrees_field_for_field_with_the_partner_row_and_mutates_nothing
        claim_type: Computed read
        grounds:
          - endpoints.GET_/oversight/partners/{id}/oversight-summary
          - endpoints.GET_/oversight/partners/{id}
          - consistency_model.immediate
        distinguishing_aspect: "The summary is a projection over the SAME persisted columns the entity GET returns, so eleven of its sixteen fields must equal the Partner row byte for byte in the same instant; only concentration_ratio_pct, group_root_partner_id, group_balance_cents, bank_total_fbo_balance_cents and systemic_root_cause_code are computed live. Both GETs must leave version untouched, which catches an implementation that recomputes-and-persists on read."
        test_recipe:
