            - *k_accept1
            - call: "POST /equipment-units/${u1_id}/identify"
              payload: { model_spec_id: "${model_id}", manufacture_date: "2023-09-15T00:00:00Z", age_basis: "MANUFACTURE_DATE" }
              as: IntakeClerk
            - *k_disasm
            - *k_insp_ok
            - *k_bench
