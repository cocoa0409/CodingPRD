# =============================================================================
# §1.9 Scaffold Corner Design — task 2285 Major Appliance Assembly Plant
# Breadth walk over references/claim-extraction-guide.md against §1.1-§1.7 of
# the sibling SCAFFOLD.yaml. Corners already asserted by SCAFFOLD_DIFFICULTY_
# DESIGN.yaml are emitted as excluded_because stubs citing that instance.
# All YAML anchors below are local to this file (anchors cannot cross files).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_line_returns_declared_fields_with_initial_posture_constrained
        claim_type: creation
        grounds:
          - entities.Line
          - endpoints["POST /lines"]
        distinguishing_aspect: "POST /lines with the five declared inputs returns 201 and a Line whose computed fields are seeded: operating_mode RUNNING, posture CONSTRAINED (no stations, so presentation_slots_total 0 and free_slot_pct 0.00), version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-03T06:00:00Z"
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
          trigger:
            - &c_line
              call: "POST /lines"
              payload: { line_code: "L1", takt_seconds: 120, option_load_limit_pct: 63.00, baseline_headcount: 20, current_family_code: "FAM_A" }
              as: PlantAdmin
              captures: { line_id: $.data.id }
          assert:
            - "HTTP 201 with success true, error null and data non-null"
            - "Line.${line_id}: line_code == 'L1', takt_seconds == 120, option_load_limit_pct == 63.00, baseline_headcount == 20, current_family_code == 'FAM_A'"
            - "Line.${line_id}: operating_mode == RUNNING, stop_reason null, changeover_count == 0, checkpoint_index == 0, max_released_sequence_index == 0"
            - "Line.${line_id}: presentation_slots_total == 0, presentation_slots_committed == 0, free_slot_pct == 0.00, posture == CONSTRAINED, version == 1, created_at == 2026-08-03T06:00:00Z"

      - name: get_shift_plan_returns_stored_window_and_capacity
        claim_type: retrieval
        grounds:
          - entities.ShiftPlan
          - endpoints["GET /shift-plans/{id}"]
        distinguishing_aspect: "GET /shift-plans/{id} returns exactly what POST stored plus the computed capacity: available_labor_minutes == 480 for overtime_minutes 0 and all three labour counters at 0 before any slot is sequenced."
        test_recipe:
          setup:
            - "Line L1 with stations ST10 and ST20; ShiftPlan A for 2026-08-03 runs 06:00-14:00 with planned_headcount 20"
          setup_api_calls:
            - *c_clock
            - *c_line
            - &c_st10
              call: "POST /stations"
              payload: { line_id: "${line_id}", station_code: "ST10", position_index: 10, presentation_slot_capacity: 40, station_cycle_seconds: 110 }
              as: PlantAdmin
              captures: { st10_id: $.data.id }
            - &c_st20
              call: "POST /stations"
              payload: { line_id: "${line_id}", station_code: "ST20", position_index: 20, presentation_slot_capacity: 40, station_cycle_seconds: 110 }
              as: PlantAdmin
              captures: { st20_id: $.data.id }
            - &c_lineread
              call: "GET /lines/${line_id}"
              payload: {}
              as: ProductionPlanner
              captures: { line_v: $.data.version }
            - &c_shifta
              call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", expected_line_version: "${line_v}" }
              as: ProductionPlanner
              captures: { shift_a_id: $.data.id }
          trigger:
            - call: "GET /shift-plans/${shift_a_id}"
              payload: {}
              as: LineOperator
          assert:
            - "HTTP 200; ShiftPlan.${shift_a_id}: line_id == ${line_id}, shift_date == '2026-08-03', shift_code == A, planned_headcount == 20, overtime_minutes == 0"
            - "ShiftPlan.${shift_a_id}: shift_start == 2026-08-03T06:00:00Z, shift_end == 2026-08-03T14:00:00Z, available_labor_minutes == 480"
            - "ShiftPlan.${shift_a_id}: unit_labor_minutes == 0, changeover_minutes == 0, committed_labor_minutes == 0, status == ACTIVE, version == 1"
            - "Line.${line_id}.version == ${line_v} + 1 — creating the plan bumped the OCC parent exactly once"

      - name: list_build_slots_returns_pagination_envelope_in_sequence_order
        claim_type: listing
        grounds:
          - endpoints["GET /build-slots"]
          - response_envelope.list_shape
        distinguishing_aspect: "GET /build-slots?line_id=..&limit=1&offset=0 returns one item with total_count 2 and has_more true; offset 1 returns the index-2 slot with has_more false, proving ordering is sequence_index ASC and total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20, SUP1, part P-DOOR-A, ModelVariant WM-X RELEASED with POS-DOOR on P-DOOR-A at ST10 qty 2"
            - "Two PLANNED BuildSlots on L1: sequence_index 1 at 07:00 and sequence_index 2 at 07:30"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - &c_sup1
              call: "POST /suppliers"
              payload: { supplier_code: "SUP1", name: "Sync Modules GmbH", sync_window_minutes: 45 }
              as: PlantAdmin
              captures: { sup1_id: $.data.id }
            - &c_pdoor
              call: "POST /parts"
              payload: { part_number: "P-DOOR-A", supplier_id: "${sup1_id}", is_sequenced_module: false, line_side_max_units: 24 }
              as: PlantAdmin
              captures: { p_door_id: $.data.id }
            - &c_wmx
              call: "POST /model-variants"
              payload: { model_code: "WM-X", family_code: "FAM_A", option_codes: ["OPT-A", "OPT-B"], option_content_points: 4, labor_minutes: 150, functional_cycle_count_required: 3, requires_leak_test: true, hipot_leakage_ma_limit: 0.50, leak_limit_ml_per_min: 2.00, energy_kwh_limit: 400.00, water_liters_limit: 200.00 }
              as: PlantAdmin
              captures: { wmx_id: $.data.id, wmx_v: $.data.version }
            - &c_bomx
              call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "${p_door_id}", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 2, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v}" }
              as: EngineeringLead
              captures: { bom_x_id: $.data.id }
            - &c_relx
              call: "POST /model-variants/${wmx_id}/release"
              payload: {}
              as: PlantAdmin
            - &c_slot1
              call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { slot1_id: $.data.id }
            - &c_slot2
              call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 2, planned_start: "2026-08-03T07:30:00Z" }
              as: ProductionPlanner
              captures: { slot2_id: $.data.id }
          trigger:
            - call: "GET /build-slots"
              payload: { line_id: "${line_id}", limit: 1, offset: 0 }
              as: ProductionPlanner
            - call: "GET /build-slots"
              payload: { line_id: "${line_id}", limit: 1, offset: 1 }
              as: ProductionPlanner
          assert:
            - "Trigger 1: HTTP 200 with data.items length 1, data.items[0].id == ${slot1_id} (sequence_index 1), data.total_count == 2, data.limit == 1, data.offset == 0, data.has_more == true"
            - "Trigger 2: data.items[0].id == ${slot2_id} (sequence_index 2), data.total_count == 2, data.offset == 1, data.has_more == false"
            - "Both responses carry success true and error null; neither item exposes a field outside §1.1's BuildSlot field list"

      - name: get_production_unit_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors.ERR_PRODUCTION_UNIT_NOT_FOUND
        distinguishing_aspect: "GET /production-units/{id} with a syntactically valid but unknown UUID returns 404 ERR_PRODUCTION_UNIT_NOT_FOUND in the standard error envelope, never 200 with data null."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no production unit has ever been created"
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /production-units/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: QualityInspector
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with success false, data null, error.error_id == ERR_PRODUCTION_UNIT_NOT_FOUND and error.message == 'Production unit not found'"
            - "The path-parameter existence check (validation priority 4) runs before any role-specific scoping, so the same 404 is returned for every role on the endpoint's roles list"

      - name: create_delivery_call_missing_required_sequenced_qty_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - endpoints["POST /delivery-calls"]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /delivery-calls omitting sequenced_qty returns 400 ERR_INVALID_REQUEST and creates no row, even though every other required field resolves and the dock window is free."
        test_recipe:
          setup:
            - "Line L1 with ST10, SUP1 and part P-DOOR-A; no delivery call exists"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_sup1
            - *c_pdoor
          trigger:
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z" }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with error.error_id == ERR_INVALID_REQUEST"
            - "GET /delivery-calls?station_id=${st10_id} returns total_count == 0 — schema rejection precedes every side effect"
            - "Supplier.${sup1_id}.on_time_score == 100.00 and delivered_on_time_count == 0 — no scoring occurred"

      - name: create_shift_plan_omitting_overtime_minutes_defaults_to_zero
        claim_type: defaults
        grounds:
          - entities.ShiftPlan.fields.overtime_minutes
          - calculations.shift_committed_labor_minutes
        distinguishing_aspect: "Omitting overtime_minutes stores 0 and yields available_labor_minutes == 480 (SHIFT_MINUTES + 0); planned_headcount 18 does not scale it, because the line runs a single crew."
        test_recipe:
          setup:
            - "Line L1 with stations ST10 and ST20; no shift plan exists yet"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_lineread
          trigger:
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "B", planned_headcount: 18, shift_start: "2026-08-03T14:00:00Z", shift_end: "2026-08-03T22:00:00Z", expected_line_version: "${line_v}" }
              as: ProductionPlanner
              captures: { shift_def_id: $.data.id }
          assert:
            - "ShiftPlan.${shift_def_id}.overtime_minutes == 0 (default applied, field absent from the request)"
            - "ShiftPlan.${shift_def_id}.available_labor_minutes == 480 and committed_labor_minutes == 0"
            - "ShiftPlan.${shift_def_id}.shift_end == 2026-08-03T22:00:00Z — the stored base end is not extended when overtime is 0"

      - name: station_presentation_slots_used_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Station.fields.presentation_slots_used
          - entities.Line.fields.presentation_slots_total
        distinguishing_aspect: "presentation_slots_used is computed: a client value of 7 in the POST body is ignored and the station is created with 0, while the parent Line's presentation_slots_total rises to the sum of station capacities."
        test_recipe:
          setup:
            - "Line L1 exists with no stations (presentation_slots_total 0)"
          setup_api_calls:
            - *c_clock
            - *c_line
          trigger:
            - call: "POST /stations"
              payload: { line_id: "${line_id}", station_code: "ST30", position_index: 30, presentation_slot_capacity: 40, station_cycle_seconds: 110, presentation_slots_used: 7 }
              as: PlantAdmin
              captures: { st30_id: $.data.id }
          assert:
            - "Station.${st30_id}.presentation_slots_used == 0 — the supplied 7 is ignored"
            - "Station.${st30_id}.presentation_slot_capacity == 40 and position_index == 30"
            - "Line.${line_id}.presentation_slots_total == 40, presentation_slots_committed == 0, free_slot_pct == 100.00 and posture == OPEN (recomputed from the new station)"
            - "Line.${line_id}.version == 2 — adding a station bumps the line's OCC version"

      - name: create_supplier_score_and_counters_ignored_input
        claim_type: system_fields
        grounds:
          - entities.Supplier.fields.on_time_score
          - entities.Supplier.fields.status
          - entities.Supplier.fields.missed_count
        distinguishing_aspect: "Supplier score, status and the four delivery counters are system/computed: client values in the POST body are ignored and the row is seeded on_time_score 100.00 / APPROVED / all counters 0."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP9", name: "Optimistic Modules AB", sync_window_minutes: 30, on_time_score: 12.00, status: "SUSPENDED", missed_count: 9 }
              as: PlantAdmin
              captures: { sup9_id: $.data.id }
          assert:
            - "Supplier.${sup9_id}.on_time_score == 100.00 and status == APPROVED — the supplied 12.00 / SUSPENDED are ignored"
            - "Supplier.${sup9_id}.delivered_on_time_count == 0, delivered_late_count == 0, missed_count == 0, quality_penalty_count == 0"
            - "Supplier.${sup9_id}.supplier_code == 'SUP9', sync_window_minutes == 30, version == 1 and id is server-minted (not any client-supplied value)"

      - name: create_shift_plan_overtime_above_cap_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.ShiftPlan.fields.overtime_minutes
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "overtime_minutes is bounded by OVERTIME_CAP_MINUTES: 120 is accepted (available_labor_minutes 600) and 121 is rejected 400 ERR_INVALID_REQUEST before any overlap or OCC check runs."
        test_recipe:
          setup:
            - "Line L1 with stations ST10 and ST20; no shift plan exists"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_lineread
          trigger:
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", overtime_minutes: 121, expected_line_version: "${line_v}" }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
            - call: "POST /shift-plans"
              payload: { line_id: "${line_id}", shift_date: "2026-08-03", shift_code: "A", planned_headcount: 20, shift_start: "2026-08-03T06:00:00Z", shift_end: "2026-08-03T14:00:00Z", overtime_minutes: 120, expected_line_version: "${line_v}" }
              as: ProductionPlanner
              captures: { shift_ot_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 400 with error.error_id == ERR_INVALID_REQUEST and Line.${line_id}.version still == ${line_v} (a schema rejection does not consume the OCC token)"
            - "Trigger 2: HTTP 201 with ShiftPlan.${shift_ot_id}.overtime_minutes == 120 and available_labor_minutes == 600 — the cap boundary itself is legal"
            - "GET /lines/${line_id}/shift-plans returns total_count == 1"

      - name: quality_test_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.QualityTest
          - endpoints["POST /production-units/{id}/quality-tests"]
          - endpoints["GET /production-units/{id}/quality-tests"]
        distinguishing_aspect: "QualityTest is declared common_fields false: its rows carry no version and no updated_at, §1.5 exposes no update or delete endpoint for them, and the only mutation the scaffold allows is the RECORDED -> VOIDED flip driven by clear-quarantine."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20, SUP1, P-DOOR-A, WM-X RELEASED, ShiftPlan A 06:00-14:00, BuildSlot index 1 sequenced and released into unit1"
            - "unit1 has an ELECTRICAL_SAFETY test recorded with measured_value 0.30"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - &c_seq1
              call: "POST /build-slots/${slot1_id}/sequence"
              payload: {}
              as: ProductionPlanner
            - &c_rel1
              call: "POST /build-slots/${slot1_id}/release"
              payload: {}
              as: LineOperator
              captures: { unit1_id: $.data.id }
            - &c_hipot1
              call: "POST /production-units/${unit1_id}/quality-tests"
              payload: { test_type: "ELECTRICAL_SAFETY", measured_value: 0.30 }
              as: QualityInspector
              captures: { test1_id: $.data.id }
          trigger:
            - call: "GET /production-units/${unit1_id}/quality-tests"
              payload: {}
              as: QualityInspector
          assert:
            - "data.items length 1 with id == ${test1_id}, production_unit_id == ${unit1_id}, test_type == ELECTRICAL_SAFETY, measured_value == 0.30, limit_value == 0.50, result == PASS, status == RECORDED, created_at == 2026-08-03T06:00:00Z"
            - "The item exposes NO version and NO updated_at field — the entity is declared common_fields false"
            - "§1.5 declares no PATCH, PUT or DELETE on /production-units/{id}/quality-tests, so a recorded measurement can only ever be voided through POST /production-units/{id}/clear-quarantine"

      - name: create_bom_line_unknown_part_not_found
        claim_type: foreign_key_validated
        grounds:
          - validations[priority=5]
          - errors.ERR_PART_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "On the flat topology every body FK is resolved in the endpoint's declared input order: an unknown part_id on POST /bom-lines returns 404 ERR_PART_NOT_FOUND even though the OCC version supplied is deliberately stale (${wmx_v} + 98 == 99), because existence (priority 5) precedes concurrency (priority 7)."
        test_recipe:
          setup:
            - "Line L1 with ST10; ModelVariant WM-X at version 1 with no BOM lines; no part with the probed id exists"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_wmx
          trigger:
            - call: "POST /bom-lines"
              payload: { model_variant_id: "${wmx_id}", part_id: "00000000-0000-0000-0000-0000000000aa", station_id: "${st10_id}", bom_position_code: "POS-DOOR", qty_per_unit: 2, effective_from_sequence: 1, expected_model_variant_version: "${wmx_v} + 98" }
              as: EngineeringLead
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with error.error_id == ERR_PART_NOT_FOUND, NOT 412 ERR_STALE_MODEL_VARIANT_VERSION"
            - "GET /bom-lines?model_variant_id=${wmx_id} returns total_count == 0 and ModelVariant.${wmx_id}.version == 1"

      - name: create_build_slot_unknown_line_not_found
        claim_type: parent_relationships
        grounds:
          - entities.BuildSlot.parent
          - validations[priority=5]
          - errors.ERR_LINE_NOT_FOUND
        distinguishing_aspect: "BuildSlot declares Line as its parent: POST /build-slots with an unknown line_id returns 404 ERR_LINE_NOT_FOUND and the sequence_index is never reserved, so the same index remains available on a real line."
        test_recipe:
          setup:
            - "Line L1 with ST10/ST20 and WM-X RELEASED; the probed line id belongs to no row"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
          trigger:
            - call: "POST /build-slots"
              payload: { line_id: "00000000-0000-0000-0000-0000000000bb", model_variant_id: "${wmx_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmx_id}", sequence_index: 1, planned_start: "2026-08-03T07:00:00Z" }
              as: ProductionPlanner
              captures: { slot_ok_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 404 with error.error_id == ERR_LINE_NOT_FOUND"
            - "Trigger 2: HTTP 201 with BuildSlot.${slot_ok_id}.sequence_index == 1 and status == PLANNED — index 1 was never consumed by the rejected call"
            - "GET /build-slots?line_id=${line_id} returns total_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: record_arrival_inside_window_moves_call_to_arrived_on_time
        claim_type: valid_transition
        grounds:
          - state_machines.DeliveryCall.SCHEDULED_to_ARRIVED_ON_TIME
          - calculations.supplier_on_time_score
        distinguishing_aspect: "An arrival stamped 09:30 inside the [09:00, 10:00) window moves the call to ARRIVED_ON_TIME with lateness_minutes 0, increments delivered_on_time_count to 1 and leaves on_time_score at 100.00 because the +2 credit is capped."
        test_recipe:
          setup:
            - "Line L1 with ST10, SUP1, part P-DOOR-A; DeliveryCall C1 at ST10 for 09:00-10:00 is SCHEDULED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_sup1
            - *c_pdoor
            - &c_call1
              call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
              captures: { call1_id: $.data.id }
          trigger:
            - call: "POST /delivery-calls/${call1_id}/record-arrival"
              payload: { arrived_at: "2026-08-03T09:30:00Z" }
              as: SupplierPortal
              as_user_id: "${sup1_id}"
          assert:
            - "DeliveryCall.${call1_id}.status == ARRIVED_ON_TIME with arrived_at == 2026-08-03T09:30:00Z and lateness_minutes == 0"
            - "Supplier.${sup1_id}.delivered_on_time_count == 1, delivered_late_count == 0, on_time_score == 100.00 (min(100.00, 100.00 + 2)) and status == APPROVED"

      - name: record_arrival_exactly_at_window_end_is_late
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DeliveryCall.SCHEDULED_to_ARRIVED_LATE
          - calculations.supplier_on_time_score
        distinguishing_aspect: "The on-time band is half-open: arrived_at exactly equal to window_end takes the ARRIVED_LATE branch with lateness_minutes 0 and charges -8, so the score reads 92.00 while the supplier stays APPROVED."
        test_recipe:
          setup:
            - "Line L1 with ST10, SUP1, part P-DOOR-A; DeliveryCall C1 at ST10 for 09:00-10:00 is SCHEDULED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_sup1
            - *c_pdoor
            - *c_call1
          trigger:
            - call: "POST /delivery-calls/${call1_id}/record-arrival"
              payload: { arrived_at: "2026-08-03T10:00:00Z" }
              as: SupplierPortal
              as_user_id: "${sup1_id}"
          assert:
            - "DeliveryCall.${call1_id}.status == ARRIVED_LATE with lateness_minutes == 0 (ceil(0 / 60)) — equality at window_end is late, not on time"
            - "Supplier.${sup1_id}.delivered_late_count == 1, delivered_on_time_count == 0, on_time_score == 92.00 and status == APPROVED"

      - name: cancel_delivery_call_twice_second_attempt_returns_409
        claim_type: idempotency
        grounds:
          - state_machines.DeliveryCall.SCHEDULED_to_CANCELLED
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "cancel is not idempotent: the first call moves SCHEDULED -> CANCELLED with cancel_reason PLANNER, the second returns 409 ERR_INVALID_STATE and leaves cancel_reason unchanged."
        test_recipe:
          setup:
            - "Line L1 with ST10, SUP1, P-DOOR-A; DeliveryCall C1 (09:00-10:00) is SCHEDULED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_sup1
            - *c_pdoor
            - *c_call1
          trigger:
            - call: "POST /delivery-calls/${call1_id}/cancel"
              payload: {}
              as: ProductionPlanner
            - call: "POST /delivery-calls/${call1_id}/cancel"
              payload: {}
              as: ProductionPlanner
              captures: { err_cancel_id: $.data.error_id }
          assert:
            - "Trigger 1: HTTP 200 with DeliveryCall.${call1_id}.status == CANCELLED and cancel_reason == PLANNER"
            - "Trigger 2: HTTP 409 with error.error_id == ERR_INVALID_STATE; cancel_reason is still PLANNER and updated_at is unchanged from trigger 1"

      - name: record_arrival_on_missed_call_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DeliveryCall.terminal_states
          - endpoints["POST /delivery-calls/{id}/record-arrival"]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "MISSED is terminal: once the checkpoint sweep has missed a call, its own supplier recording a (late) arrival gets 409 ERR_INVALID_STATE and no second score is charged, so on_time_score stays 80.00."
        test_recipe:
          setup:
            - "Line L1 with ST10, SUP1, P-DOOR-A; DeliveryCall C1 for 06:10-06:40 is SCHEDULED"
            - "Clock advanced to 2026-08-03T06:56:00Z (past window_end + MISS_GRACE_MINUTES) and one checkpoint has been run, so C1 is MISSED and the score is 80.00"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_sup1
            - *c_pdoor
            - call: "POST /delivery-calls"
              payload: { supplier_id: "${sup1_id}", part_id: "${p_door_id}", station_id: "${st10_id}", window_start: "2026-08-03T06:10:00Z", window_end: "2026-08-03T06:40:00Z", sequenced_qty: 4 }
              as: ProductionPlanner
              captures: { callm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:56:00Z" }
              as: PlantAdmin
            - call: "POST /lines/${line_id}/run-checkpoint"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /delivery-calls/${callm_id}/record-arrival"
              payload: { arrived_at: "2026-08-03T06:55:00Z" }
              as: SupplierPortal
              as_user_id: "${sup1_id}"
              captures: { err_missed_id: $.data.error_id }
          assert:
            - "HTTP 409 with error.error_id == ERR_INVALID_STATE"
            - "DeliveryCall.${callm_id}.status is still MISSED with arrived_at null and lateness_minutes null"
            - "Supplier.${sup1_id}.missed_count == 1, delivered_late_count == 0 and on_time_score == 80.00 — the rejected arrival charged nothing"

      - name: released_slot_creates_unit_in_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.ProductionUnit.initial_state
          - endpoints["POST /build-slots/{id}/release"]
        distinguishing_aspect: "A released slot mints a ProductionUnit in the declared initial compound state IN_STATION x PENDING with rework_count 0, both efficiency readings null and the deterministic serial 'L1-000001'."
        test_recipe:
          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED, ShiftPlan A 06:00-14:00, BuildSlot index 1 SEQUENCED"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
          trigger:
            - call: "POST /build-slots/${slot1_id}/release"
              payload: {}
              as: LineOperator
              captures: { unit_new_id: $.data.id }
          assert:
            - "HTTP 201; ProductionUnit.${unit_new_id}: assembly_status == IN_STATION, quality_status == PENDING, rework_count == 0"
            - "ProductionUnit.${unit_new_id}: build_slot_id == ${slot1_id}, model_variant_id == ${wmx_id}, built_at_sequence_index == 1, serial_number == 'L1-000001', efficiency_index null, certification_tier null, provisional_efficiency_index null"
            - "BuildSlot.${slot1_id}.status == RELEASED and Line.${line_id}.max_released_sequence_index == 1"

      - name: certify_unit_still_pending_returns_409
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProductionUnit.GATED_to_CERTIFIED
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "certify only exists from GATED: on a freshly released unit in PENDING it returns 409 ERR_INVALID_STATE and writes neither efficiency_index nor certification_tier."
        test_recipe:
          setup:
            - "Base fixture with unit1 released from BuildSlot index 1 and no quality test recorded yet"
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_st10
            - *c_st20
            - *c_sup1
            - *c_pdoor
            - *c_wmx
            - *c_bomx
            - *c_relx
            - *c_lineread
            - *c_shifta
            - *c_slot1
            - *c_seq1
            - *c_rel1
          trigger:
