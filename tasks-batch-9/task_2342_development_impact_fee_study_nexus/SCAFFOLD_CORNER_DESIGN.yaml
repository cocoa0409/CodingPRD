          - entities.CreditClaim.fields.facility_category_code
          - entities.NexusComponent.fields.facility_category_id
        distinguishing_aspect: |
          The claim's category has to clear two hurdles in a different entity: it must
          resolve inside the application's program AND that category must carry a
          NexusComponent in the effective study. ROADS satisfies the first and fails the
          second - the effective study prices PARKS only - and an unknown code TRAILS fails
          both. Both must be 422 ERR_CREDIT_CATEGORY_NOT_IN_STUDY, not a 404, because the
          rule is about study coverage rather than row existence.
        test_recipe:
          setup:
            - "HARBOR program with BOTH categories PARKS and ROADS defined."
            - "The EFFECTIVE study contains a NexusComponent for PARKS only, with one SINGLE_FAMILY line of 2.5000 (fee 254168)."
