          setup:
            - "Logical clock 2026-09-01T00:00:00Z; hub, region North, one newsroom position in North, and one proposed change requesting 40 slots with effective date 2026-09-11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
