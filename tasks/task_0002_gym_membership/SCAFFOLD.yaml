# =============================================================================
# Gym Membership Management API — Scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  A nationwide chain of gyms needs to develop a membership management API, which
  involves a complex set of interconnected and mutually restrictive modules,
  including member registration and authentication, multi-level membership and
  access control, subscription billing and automatic renewal, retry and grace
  period handling for failed payments, state-specific refunds and late payment
  penalties, cross-store group class and personal training appointments,
  real-time scheduling of trainers and equipment capacity, waitlist and no-show
  penalty mechanisms, membership suspension and status transitions, issuance and
  verification of promotional coupons and referral rewards, and integration with
  third-party payment, access control gates and data analysis platforms.

domain_name: gym-membership
api_prefix: /members

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
    - scheduled_deferred_actions
    - idempotency

  entity_topology: hybrid
  # Member is the aggregate root; Subscription, Booking, Coupon hang flat off Member.
  # ClassSession + Trainer + Equipment are cross-cutting peer entities referenced
  # by Bookings across stores. PaymentAttempt is an append-only event log under
  # Subscription. ReferralReward links two Members (cross-aggregate).

  state_machine_shape: parallel
  # Member carries two independent state dimensions evolving simultaneously on
  # the same row:
  #   - billing_status (CURRENT → PAST_DUE → GRACE → DELINQUENT → REINSTATED)
  #   - access_status  (ACTIVE | SUSPENDED | FROZEN | CANCELLED)
  # account_posture is a derived field (OPEN | RESTRICTED | FROZEN) computed
  # from the cross-product of the two dimensions and gates every child booking.
  # Booking has a branching shape with revert (RESERVED→CONFIRMED→ATTENDED, plus
  # WAITLISTED→RESERVED on promotion, CONFIRMED→NO_SHOW with penalty cascade).

  relationship_patterns:
    - one_to_many       # Member → Subscription, Member → Booking
    - many_to_many      # Booking ↔ ClassSession via reservations (cross-store)
    - cross_aggregate   # ReferralReward links sponsor Member to invitee Member

  role_model: peer_roles
  # Member, Trainer, StoreManager, BillingAdmin each own distinct resource types.
  # StoreManager handles cross-store class scheduling; BillingAdmin handles
  # refunds, retries, suspensions; Trainer manages PT sessions and no-show marks.

  consistency_model: saga
  # Booking creation spans capacity reservation, ledger debit, coupon redemption,
  # waitlist position assignment — compensated on partial failure or cancellation.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim per SKILL.md §1.0)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: email, type: string, source: input, description: "Login identifier; unique across the chain", constraints: "lowercase RFC-5322; unique" }
      - { name: password_hash, type: string, source: system, description: "Argon2id hash of registration password; never returned in responses" }
      - { name: home_store_id, type: string, source: input, description: "FK to Store this member registered at" }
      - { name: tier, type: enum, source: system, description: "BASIC | PLUS | ELITE — determines access scope and PT discount", constraints: "BASIC | PLUS | ELITE" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of the home_store at registration; pins state-specific refund and late-fee rules", constraints: "ISO 3166-2:US, exactly 2 uppercase letters" }
      - { name: billing_status, type: enum, source: system, description: "Independent billing dimension; evolves on payment events", constraints: "CURRENT | PAST_DUE | GRACE | DELINQUENT | REINSTATED" }
      - { name: access_status, type: enum, source: system, description: "Independent access dimension; evolves on suspension/cancel events", constraints: "ACTIVE | SUSPENDED | FROZEN | CANCELLED" }
      - { name: account_posture, type: enum, source: computed, description: "Derived gate: OPEN if billing_status IN {CURRENT, REINSTATED} AND access_status=ACTIVE; FROZEN if access_status IN {SUSPENDED, FROZEN, CANCELLED}; otherwise RESTRICTED. Recomputed on every billing_status or access_status write.", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: no_show_strike_count, type: integer, source: computed, description: "Count of confirmed bookings transitioned to NO_SHOW within the last 30 days from current clock", default: 0 }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Total unspent refund + referral credit in cents; consumed FIFO by next billing run" }
      - { name: suspension_window_start, type: datetime, source: system, description: "When access_status entered SUSPENDED; null otherwise" }
      - { name: suspension_window_end, type: datetime, source: system, description: "Scheduled end of suspension; null otherwise" }
      - { name: referred_by_member_id, type: string, source: input, description: "FK to sponsoring Member at registration; null if organic", default: null }

  - name: Subscription
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK to owning Member" }
      - { name: plan, type: enum, source: input, description: "BASIC | PLUS | ELITE — must match the tier the Member is buying into", constraints: "BASIC | PLUS | ELITE" }
      - { name: billing_cycle, type: enum, source: input, description: "MONTHLY | ANNUAL", constraints: "MONTHLY | ANNUAL" }
      - { name: base_price_cents, type: integer, source: system, description: "Plan list price in cents at the moment of activation; pinned for the life of the subscription" }
      - { name: status, type: enum, source: system, description: "PENDING_ACTIVATION | ACTIVE | PAST_DUE | GRACE | DELINQUENT | CANCELLED", constraints: "PENDING_ACTIVATION | ACTIVE | PAST_DUE | GRACE | DELINQUENT | CANCELLED" }
      - { name: current_period_start, type: datetime, source: system, description: "ISO 8601 UTC; start of the current billing period" }
      - { name: current_period_end, type: datetime, source: system, description: "ISO 8601 UTC; exclusive end of current period (next charge attempt at this instant)" }
      - { name: auto_renew, type: boolean, source: input, description: "If true, server enqueues a charge at current_period_end", default: true }
      - { name: failed_payment_attempts, type: integer, source: computed, description: "Count of FAILED PaymentAttempts within the current period; reset on a SUCCESS or on entering REINSTATED", default: 0 }
      - { name: grace_period_end, type: datetime, source: system, description: "Computed when entering GRACE; null otherwise" }
      - { name: cancellation_effective_at, type: datetime, source: system, description: "When CANCELLED takes effect (immediate for delinquency, end-of-period for voluntary)" }

  - name: PaymentAttempt
    parent: Subscription
    common_fields: false  # event log: id + created_at only; no version, no updated_at
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK to Subscription" }
      - { name: member_id, type: string, source: system, description: "FK to Member (denormalized for query)" }
      - { name: attempt_number, type: integer, source: system, description: "1, 2, 3 within the current period; resets when period rolls" }
      - { name: amount_cents, type: integer, source: computed, description: "base_price_cents minus wallet_credit_cents applied at this attempt, floor 0" }
      - { name: gateway_txn_id, type: string, source: input, description: "Third-party payment gateway transaction id; idempotency key" }
      - { name: idempotency_key, type: string, source: input, description: "Client-supplied UUID; duplicate replays return the prior response without retrying the gateway" }
      - { name: outcome, type: enum, source: input, description: "SUCCESS | FAILED | DECLINED", constraints: "SUCCESS | FAILED | DECLINED" }
      - { name: failure_reason, type: string, source: input, description: "Gateway-provided decline reason; null on SUCCESS", default: null }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; controls refund and late-fee rule selection", constraints: "ISO 3166-2:US" }
      - { name: opens_at_local, type: string, source: input, description: "HH:MM 24h local time the store opens" }
      - { name: closes_at_local, type: string, source: input, description: "HH:MM 24h local time the store closes" }
      - { name: gate_device_id, type: string, source: input, description: "Identifier the third-party access-gate vendor expects in webhook callbacks" }

  - name: ClassSession
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK to the host Store" }
      - { name: class_type, type: string, source: input, description: "e.g., YOGA, SPIN, HIIT" }
      - { name: trainer_id, type: string, source: input, description: "FK to leading Trainer" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC; class start" }
      - { name: ends_at, type: datetime, source: input, description: "ISO 8601 UTC; class end (must be > starts_at)" }
      - { name: capacity, type: integer, source: input, description: "Maximum reserved seats (excludes waitlist)" }
      - { name: minimum_tier, type: enum, source: input, description: "Lowest tier permitted to reserve; defaults to BASIC", constraints: "BASIC | PLUS | ELITE", default: "BASIC" }
      - { name: equipment_pool_id, type: string, source: input, description: "FK to EquipmentPool reserving N units for this session; null if class needs no shared equipment", default: null }
      - { name: equipment_units_required, type: integer, source: input, description: "Units drawn from equipment_pool_id for the [starts_at, ends_at) window", default: 0 }
      - { name: reserved_seat_count, type: integer, source: computed, description: "Live count of Bookings in RESERVED or CONFIRMED status" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | LOCKED | COMPLETED | CANCELLED", constraints: "SCHEDULED | LOCKED | COMPLETED | CANCELLED" }

  - name: Trainer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Trainer display name" }
      - { name: home_store_id, type: string, source: input, description: "FK to Store the Trainer is primarily based at" }
      - { name: certifications, type: array, source: input, description: "Array of certification strings, e.g., [YOGA, SPIN]" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Per-hour pay rate used in PT booking pricing" }

  - name: EquipmentPool
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK to owning Store" }
      - { name: equipment_type, type: string, source: input, description: "e.g., SPIN_BIKE, ROWER, TRX_RACK" }
      - { name: total_units, type: integer, source: input, description: "Inventory count" }
      - { name: maintenance_window_start, type: datetime, source: input, description: "ISO 8601 UTC; equipment is unavailable during [start, end); null if none", default: null }
      - { name: maintenance_window_end, type: datetime, source: input, description: "ISO 8601 UTC; exclusive end of maintenance window", default: null }

  - name: Booking
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK to booking Member" }
      - { name: booking_kind, type: enum, source: input, description: "GROUP_CLASS | PERSONAL_TRAINING", constraints: "GROUP_CLASS | PERSONAL_TRAINING" }
      - { name: class_session_id, type: string, source: input, description: "FK to ClassSession; required when booking_kind=GROUP_CLASS, else null" }
      - { name: trainer_id, type: string, source: input, description: "FK to Trainer; required when booking_kind=PERSONAL_TRAINING, else null" }
      - { name: store_id, type: string, source: system, description: "Hosting Store (denormalized for cross-store queries)" }
      - { name: starts_at, type: datetime, source: input, description: "ISO 8601 UTC; for GROUP_CLASS this MUST equal ClassSession.starts_at" }
      - { name: ends_at, type: datetime, source: input, description: "ISO 8601 UTC; for GROUP_CLASS this MUST equal ClassSession.ends_at" }
      - { name: applied_coupon_id, type: string, source: input, description: "FK to Coupon redeemed at booking time; null if none", default: null }
      - { name: waitlist_position, type: integer, source: computed, description: "Non-null when status=WAITLISTED; 1-indexed FIFO position by created_at within the same ClassSession" }
      - { name: provisional_price_cents, type: integer, source: computed, description: "Price quoted at reservation time, BEFORE no-show adjustments and refund rules" }
      - { name: final_price_cents, type: integer, source: computed, description: "Price billed/credited after the booking reaches a terminal state (ATTENDED, NO_SHOW, CANCELLED)" }
      - { name: status, type: enum, source: system, description: "WAITLISTED | RESERVED | CONFIRMED | ATTENDED | NO_SHOW | CANCELLED", constraints: "WAITLISTED | RESERVED | CONFIRMED | ATTENDED | NO_SHOW | CANCELLED" }
      - { name: gate_check_in_at, type: datetime, source: system, description: "Timestamp recorded by access-gate webhook on physical entry; null until check-in" }

  - name: Coupon
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Human-typed code; unique across the chain", constraints: "uppercase A-Z, 0-9, length 6-12; unique" }
      - { name: kind, type: enum, source: input, description: "PERCENT_OFF | FIXED_OFF_CENTS | REFERRAL_REWARD", constraints: "PERCENT_OFF | FIXED_OFF_CENTS | REFERRAL_REWARD" }
      - { name: value, type: integer, source: input, description: "Percent (0-100) for PERCENT_OFF; cents for FIXED_OFF_CENTS or REFERRAL_REWARD" }
      - { name: applicable_to, type: enum, source: input, description: "SUBSCRIPTION | BOOKING | BOTH; constrains what the coupon can be redeemed against", constraints: "SUBSCRIPTION | BOOKING | BOTH" }
      - { name: valid_from, type: datetime, source: input, description: "ISO 8601 UTC; coupon inert before this instant" }
      - { name: valid_until, type: datetime, source: input, description: "ISO 8601 UTC; exclusive expiry" }
      - { name: max_redemptions, type: integer, source: input, description: "Hard cap on total redemptions across all members" }
      - { name: redemption_count, type: integer, source: computed, description: "Count of bookings/subscriptions that consumed this coupon" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED | REVOKED", constraints: "ACTIVE | EXHAUSTED | EXPIRED | REVOKED" }
      - { name: tied_to_member_id, type: string, source: system, description: "Set when this coupon was minted by a referral; null for promotional coupons", default: null }

  - name: ReferralReward
    parent: null  # cross-aggregate: links sponsor Member to invitee Member; flat top-level
    common_fields: true
    fields:
      - { name: sponsor_member_id, type: string, source: system, description: "FK to Member who referred" }
      - { name: invitee_member_id, type: string, source: system, description: "FK to Member who registered with referred_by_member_id=sponsor" }
      - { name: minted_coupon_id, type: string, source: system, description: "FK to the Coupon issued to the sponsor; null until invitee qualifies" }
      - { name: status, type: enum, source: system, description: "PENDING | QUALIFIED | PAID_OUT | VOIDED", constraints: "PENDING | QUALIFIED | PAID_OUT | VOIDED" }
      - { name: qualifying_attempt_id, type: string, source: system, description: "FK to the PaymentAttempt whose SUCCESS made the invitee qualify; null until QUALIFIED" }
      - { name: reward_value_cents, type: integer, source: system, description: "Pinned at QUALIFIED time using REFERRAL_REWARD_CENTS_BY_PLAN[invitee.subscription.plan]" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Member billing dimension (one of the parallel axes) -----------------
  - entity: Member
    field: billing_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /members/{memberId}/subscriptions/{subId}/payment-attempts (outcome=FAILED on first attempt of a period)"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE"
          - "PaymentAttempt.attempt_number == 1"
        side_effects:
          - "Subscription.status → PAST_DUE"
          - "Subscription.failed_payment_attempts incremented"
          - "Member.account_posture recomputed → RESTRICTED (blocks new bookings)"

      - from: PAST_DUE
        to: GRACE
        trigger: "POST /members/{memberId}/subscriptions/{subId}/payment-attempts (outcome=FAILED, attempt_number == RETRY_LIMIT)"
        actor: system
        preconditions:
          - "Subscription.failed_payment_attempts == RETRY_LIMIT (3)"
        side_effects:
          - "Subscription.status → GRACE"
          - "Subscription.grace_period_end := current clock + GRACE_PERIOD_DAYS (by state_code)"
          - "Member.account_posture stays RESTRICTED"
          - "Late-payment penalty Coupon (negative credit) accrues against Member.wallet_credit_cents per state_code rule"

      - from: GRACE
        to: DELINQUENT
        trigger: "POST /_clock/advance crossing Subscription.grace_period_end without a SUCCESS"
        actor: system
        preconditions:
          - "Current clock >= Subscription.grace_period_end"
          - "No PaymentAttempt with outcome=SUCCESS recorded since entering GRACE"
        side_effects:
          - "Subscription.status → DELINQUENT"
          - "Member.access_status → SUSPENDED (cross-axis cascade; see access state machine)"
          - "Member.account_posture → FROZEN"
          - "All RESERVED/CONFIRMED future Bookings of this Member → CANCELLED with state-specific refund"

      - from: [PAST_DUE, GRACE]
        to: REINSTATED
        trigger: "POST /members/{memberId}/subscriptions/{subId}/payment-attempts (outcome=SUCCESS)"
        actor: system
        preconditions:
          - "Subscription.status IN {PAST_DUE, GRACE}"
        side_effects:
          - "Subscription.status → ACTIVE"
          - "Subscription.failed_payment_attempts → 0"
          - "Subscription.grace_period_end → null"
          - "Member.account_posture recomputed → OPEN if access_status=ACTIVE"

      - from: REINSTATED
        to: CURRENT
        trigger: "POST /_clock/advance crossing Subscription.current_period_end + 1 second (next billing cycle rolls over cleanly)"
        actor: system
        preconditions:
          - "Subscription has rolled to a new period without a failed first attempt"
        side_effects:
          - "Nothing observable beyond the status label flip; idempotent."

      - from: DELINQUENT
        to: REINSTATED
        trigger: "POST /members/{memberId}/subscriptions/{subId}/reinstate (with manual catch-up PaymentAttempt)"
        actor: BillingAdmin
        preconditions:
          - "A PaymentAttempt with outcome=SUCCESS for the past-due amount + late fee was just recorded"
        side_effects:
          - "Subscription.status → ACTIVE"
          - "Member.access_status → ACTIVE (cascade)"
          - "Member.account_posture → OPEN"

  # ---- Member access dimension (the second parallel axis) ------------------
  - entity: Member
    field: access_status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /members/{memberId}/suspend (voluntary, billed at $0 during window)"
        actor: Member
        preconditions:
          - "Subscription.status IN {ACTIVE, REINSTATED} (cross-entity dependency)"
          - "No future Booking exists for this Member with status IN {RESERVED, CONFIRMED} in [now, suspension_window_end] (otherwise ERR_HAS_FUTURE_BOOKINGS)"
        side_effects:
          - "Member.suspension_window_start := now"
          - "Member.suspension_window_end := now + max_suspension_days(state_code)"
          - "Member.account_posture → FROZEN"
          - "Subscription auto_renew temporarily ignored until window end"

      - from: ACTIVE
        to: FROZEN
        trigger: "POST /members/{memberId}/freeze (system cascade from billing_status entering DELINQUENT)"
        actor: system
        preconditions:
          - "Member.billing_status == DELINQUENT"
        side_effects:
          - "Member.account_posture → FROZEN"
          - "Cascade: all future Bookings of this Member in {RESERVED, CONFIRMED} → CANCELLED with state-specific refund (see Booking state machine)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /_clock/advance crossing Member.suspension_window_end"
        actor: system
        preconditions:
          - "Current clock >= Member.suspension_window_end"
        side_effects:
          - "Member.suspension_window_start → null"
          - "Member.suspension_window_end → null"
          - "Member.account_posture recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{memberId}/resume (early resume)"
        actor: Member
        preconditions:
          - "access_status == SUSPENDED"
        side_effects:
          - "Suspension window cleared"

      - from: FROZEN
        to: ACTIVE
        trigger: "system cascade when billing_status flips to REINSTATED"
        actor: system
        preconditions:
          - "Member.billing_status == REINSTATED"
        side_effects: []

      - from: [ACTIVE, SUSPENDED, FROZEN]
        to: CANCELLED
        trigger: "POST /members/{memberId}/cancel"
        actor: Member
        preconditions:
          - "No PaymentAttempt within the last 2 minutes is in a non-terminal state (ERR_PAYMENT_IN_FLIGHT)"
        side_effects:
          - "Subscription.cancellation_effective_at := current_period_end (voluntary, end-of-period)"
          - "Member.account_posture → FROZEN"
          - "Subscription.auto_renew → false"

  # ---- Subscription state machine ------------------------------------------
  - entity: Subscription
    field: status
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /members/{memberId}/subscriptions/{subId}/payment-attempts (first attempt, outcome=SUCCESS)"
        actor: system
        preconditions:
          - "Subscription has no prior SUCCESS PaymentAttempt"
        side_effects:
          - "current_period_start := now"
          - "current_period_end := now + cycle_duration(billing_cycle)"
          - "If Member has referred_by_member_id set: ReferralReward.status → QUALIFIED; mint Coupon to sponsor"

      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /_clock/advance crossing current_period_end (auto-renew enabled, first charge attempt fails)"
        actor: system
        preconditions:
          - "auto_renew == true"
          - "Newly enqueued PaymentAttempt for the new period returns FAILED"
        side_effects:
          - "current_period_start, current_period_end roll forward by one cycle"
          - "Member.billing_status → PAST_DUE (cross-axis side effect)"

      - from: PAST_DUE
        to: GRACE
        trigger: "system, on the RETRY_LIMIT-th FAILED PaymentAttempt of the current period"
        actor: system
        preconditions:
          - "failed_payment_attempts == RETRY_LIMIT"
        side_effects:
          - "grace_period_end := now + GRACE_PERIOD_DAYS_BY_STATE[Member.state_code]"
          - "Member.billing_status → GRACE"

      - from: GRACE
        to: DELINQUENT
        trigger: "POST /_clock/advance crossing grace_period_end without a SUCCESS"
        actor: system
        preconditions:
          - "current_clock >= grace_period_end"
        side_effects:
          - "Member.billing_status → DELINQUENT"
          - "Member.access_status → SUSPENDED → FROZEN (cross-entity cascade)"

      - from: [PAST_DUE, GRACE]
        to: ACTIVE
        trigger: "POST /members/{memberId}/subscriptions/{subId}/payment-attempts (outcome=SUCCESS)"
        actor: system
        preconditions: []
        side_effects:
          - "failed_payment_attempts → 0"
          - "grace_period_end → null"
          - "Member.billing_status → REINSTATED"

      - from: [ACTIVE, PAST_DUE, GRACE, DELINQUENT]
        to: CANCELLED
        trigger: "POST /members/{memberId}/cancel"
        actor: Member
        preconditions:
          - "No payment-in-flight within last 2 minutes"
        side_effects:
          - "cancellation_effective_at := current_period_end (voluntary, end-of-period)"
          - "auto_renew → false"

  # ---- Booking state machine (branching with revert + cycle) ---------------
  - entity: Booking
    field: status
    initial_state: WAITLISTED   # OR RESERVED depending on capacity at create-time; see preconditions
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: WAITLISTED
        to: RESERVED
        trigger: "system (waitlist promotion when a sibling Booking on the same ClassSession transitions to CANCELLED)"
        actor: system
        preconditions:
          - "ClassSession.reserved_seat_count < ClassSession.capacity after the cancellation"
          - "This Booking has the smallest created_at among WAITLISTED siblings (tie-break: created_at ASC; never id)"
          - "Member.account_posture == OPEN at promotion time (else skip this waitlist row and promote the next eligible)"
        side_effects:
          - "ClassSession.reserved_seat_count += 1"
          - "Coupon redemption count adjusted if applied_coupon_id is set"
          - "provisional_price_cents recomputed at current clock (price may differ from initial estimate if a late-booking surcharge now applies)"

      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /bookings/{bookingId}/confirm (Member explicitly confirms within confirmation window)"
        actor: Member
        preconditions:
          - "Member.account_posture == OPEN"
          - "Current clock < ClassSession.starts_at - CONFIRM_CUTOFF_MINUTES"
        side_effects: []

      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /bookings/{bookingId}/check-in (third-party gate webhook)"
        actor: system
        preconditions:
          - "Current clock IN [ClassSession.starts_at - 15min, ClassSession.ends_at]"
          - "Member.account_posture == OPEN"
        side_effects:
          - "Booking.gate_check_in_at := now"
          - "final_price_cents := provisional_price_cents (no penalty)"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /_sweep/run after ClassSession.ends_at marks unattended CONFIRMED bookings (cascade chain entry)"
        actor: system
        preconditions:
          - "Current clock > ClassSession.ends_at"
          - "Booking.gate_check_in_at IS NULL"
        side_effects:
          - "Member.no_show_strike_count recomputed (event-window aggregation)"
          - "final_price_cents := provisional_price_cents + NO_SHOW_PENALTY_CENTS"
          - "If recomputed strike_count >= NO_SHOW_STRIKE_LIMIT: cascade → Member.access_status → SUSPENDED for STRIKE_SUSPENSION_DAYS"

      - from: [WAITLISTED, RESERVED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: Member
        preconditions:
          - "Booking is not in a terminal state"
        side_effects:
          - "final_price_cents := compute_refund(provisional_price_cents, state_code, hours_to_start)"
          - "Member.wallet_credit_cents += refund delta"
          - "If Booking had a CONFIRMED seat: ClassSession.reserved_seat_count -= 1 and waitlist promotion fires"
          - "Coupon.redemption_count -= 1 if applied_coupon_id"

      - from: [WAITLISTED, RESERVED, CONFIRMED]
        to: CANCELLED
        trigger: "system cascade (Member.access_status enters SUSPENDED/FROZEN/CANCELLED, or ClassSession enters CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as Member-cancel branch but uses ADMIN refund schedule (no late-cancel penalty)"

  # ---- ClassSession state machine ------------------------------------------
  - entity: ClassSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LOCKED
        trigger: "POST /_clock/advance crossing starts_at - CONFIRM_CUTOFF_MINUTES"
        actor: system
        preconditions:
          - "Current clock >= starts_at - CONFIRM_CUTOFF_MINUTES"
        side_effects:
          - "Any RESERVED Booking that has not confirmed → CANCELLED (cascade)"
          - "Waitlist promotion fires for vacated seats"

      - from: LOCKED
        to: COMPLETED
        trigger: "POST /_sweep/run after ends_at"
        actor: system
        preconditions:
          - "Current clock > ends_at"
        side_effects:
          - "All CONFIRMED bookings still without gate_check_in_at → NO_SHOW (cascade A→B; see Booking)"

      - from: [SCHEDULED, LOCKED]
        to: CANCELLED
        trigger: "POST /class-sessions/{sessionId}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "All non-terminal Bookings → CANCELLED with ADMIN refund schedule"
          - "EquipmentPool reservation released for [starts_at, ends_at)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two members race to take the last seat in a ClassSession at full capacity"
    guarantee: "At most one Booking is assigned RESERVED for the last seat; the other becomes WAITLISTED"
    error_id: ERR_NONE   # not an error; loser is gracefully demoted to WAITLISTED
    http_status: 201
    serialization: "First-writer-wins on ClassSession.reserved_seat_count by created_at ASC"

  - scenario: "Member cancels a Booking while sweep marks the same Booking NO_SHOW"
    guarantee: "Exactly one transition wins; the loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Booking.status; the second writer sees a terminal state"

  - scenario: "Two identical PaymentAttempts with the same idempotency_key are submitted concurrently for the same Subscription"
    guarantee: "Exactly one PaymentAttempt is persisted; the other returns the prior response without re-charging the gateway"
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    serialization: "Idempotency key is unique per Subscription; the second writer is folded into the first"

  - scenario: "Coupon redeemed concurrently by two Bookings that together would exceed max_redemptions"
    guarantee: "At most max_redemptions Bookings carry applied_coupon_id; the overflow request is rejected"
    error_id: ERR_COUPON_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on Coupon.redemption_count by Booking.created_at ASC"

  - scenario: "EquipmentPool concurrent allocations for overlapping ClassSessions exceed total_units"
    guarantee: "At most one of the conflicting sessions claims the units; the other gets ERR_EQUIPMENT_UNAVAILABLE"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    serialization: "First-writer-wins on overlapping interval reservation by ClassSession.created_at ASC"

  - scenario: "Member cancels access while access-gate webhook check-in arrives within the same second"
    guarantee: "Cancel-after-check-in is allowed (check-in wins); cancel-before-check-in fires the cascade and check-in returns ERR_BOOKING_TERMINAL"
    error_id: ERR_BOOKING_TERMINAL
    http_status: 409
    serialization: "First-writer-wins on Booking.gate_check_in_at"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: subscription_charge_amount
    trigger: "Every new PaymentAttempt creation; computed server-side before submitting to gateway"
    algorithm: tiered_pricing
    formula: |
      # NESTED ROUNDING ORDER IS PINNED: discount each line then round, then sum,
      # then apply wallet credit, then floor at 0. Reordering changes cents.
      gross_cents = Subscription.base_price_cents
      coupon = Coupon resolved by Subscription.applied_coupon_id, if any with applicable_to IN {SUBSCRIPTION, BOTH}
      if coupon.kind == PERCENT_OFF:
          discount_cents = round_half_up(gross_cents * coupon.value / 100)   # ROUND FIRST
      elif coupon.kind == FIXED_OFF_CENTS:
          discount_cents = min(coupon.value, gross_cents)
      else:
          discount_cents = 0
      net_after_coupon = gross_cents - discount_cents
      wallet_applied = min(Member.wallet_credit_cents, net_after_coupon)
      amount_cents = max(0, net_after_coupon - wallet_applied)
    constants:
      ROUNDING_MODE: round_half_up
    precision: "integer cents; round_half_up at the percent-off step"
    variants:
      - name: first_attempt_of_period
        when: "PaymentAttempt.attempt_number == 1 AND Subscription.status IN {ACTIVE, PENDING_ACTIVATION}"
        difference: "wallet_credit_cents is applied at full available balance"
      - name: retry_attempt_after_failure
        when: "PaymentAttempt.attempt_number > 1"
        difference: "wallet_credit_cents already debited on attempt 1 is NOT re-applied; retry submits the same amount_cents the first attempt computed"

  - name: booking_provisional_price
    trigger: "On Booking creation (POST /bookings), and again on waitlist promotion"
    algorithm: tiered_pricing
    formula: |
      # PT pricing has 3 inputs interacting non-linearly: duration, trainer rate,
      # member tier discount, plus a late-booking surcharge that ALSO scales.
      if booking_kind == GROUP_CLASS:
          base_cents = CLASS_BASE_PRICE_CENTS[ClassSession.class_type]
      else:  # PERSONAL_TRAINING
          duration_minutes = (ends_at - starts_at) in whole minutes
          base_cents = ceil(Trainer.hourly_rate_cents * duration_minutes / 60)  # ceil per session
      tier_discount_pct = TIER_PT_DISCOUNT_PCT[Member.tier]   # BASIC=0, PLUS=10, ELITE=20
      after_tier = base_cents - round_half_up(base_cents * tier_discount_pct / 100)
      hours_to_start = (ClassSession.starts_at - now) / 3600
      if hours_to_start < LATE_BOOKING_SURCHARGE_HOURS:
          surcharge_cents = round_half_up(after_tier * LATE_BOOKING_SURCHARGE_PCT / 100)
      else:
          surcharge_cents = 0
      coupon_discount = apply_coupon(applied_coupon_id, after_tier + surcharge_cents)
      provisional_price_cents = max(0, after_tier + surcharge_cents - coupon_discount)
    constants:
      CLASS_BASE_PRICE_CENTS: {YOGA: 2000, SPIN: 2500, HIIT: 2200}
      TIER_PT_DISCOUNT_PCT: {BASIC: 0, PLUS: 10, ELITE: 20}
      LATE_BOOKING_SURCHARGE_HOURS: 2
      LATE_BOOKING_SURCHARGE_PCT: 25
      ROUNDING_ORDER: "tier_discount first (round_half_up), then surcharge (round_half_up), then coupon, then floor at 0"
    precision: "integer cents; round_half_up at each named step; no late re-rounding of the sum"

  - name: booking_final_price_and_refund
    trigger: "Booking enters a terminal state (ATTENDED, NO_SHOW, CANCELLED)"
    algorithm: threshold
    formula: |
      # state-specific cancellation refund schedule, pinned per Member.state_code
      hours_to_start = (ClassSession.starts_at - cancellation_time) / 3600
      if to_state == ATTENDED:
          final_price_cents = provisional_price_cents
          refund_credit = 0
      elif to_state == NO_SHOW:
          final_price_cents = provisional_price_cents + NO_SHOW_PENALTY_CENTS
          refund_credit = 0
      elif to_state == CANCELLED:
          schedule = STATE_REFUND_SCHEDULE[Member.state_code]
          # schedule example for CA: [{hours_threshold: 24, refund_pct: 100},
          #                           {hours_threshold:  2, refund_pct:  50},
          #                           {hours_threshold:  0, refund_pct:   0}]
          # boundary is INCLUSIVE on hours_to_start >= threshold
          refund_pct = first schedule row where hours_to_start >= row.hours_threshold (else 0)
          refund_credit_cents = round_half_up(provisional_price_cents * refund_pct / 100)
          final_price_cents = provisional_price_cents - refund_credit_cents
      # Boundary: at exactly hours_to_start == 24.000 in CA, refund_pct == 100,
      #          at exactly 2.000, refund_pct == 50, at exactly 1.999, refund_pct == 0.
    constants:
      NO_SHOW_PENALTY_CENTS: 1000
      STATE_REFUND_SCHEDULE:
        CA: [{hours_threshold: 24, refund_pct: 100}, {hours_threshold: 2, refund_pct: 50}, {hours_threshold: 0, refund_pct: 0}]
        NY: [{hours_threshold: 48, refund_pct: 100}, {hours_threshold: 6, refund_pct: 75}, {hours_threshold: 1, refund_pct: 25}, {hours_threshold: 0, refund_pct: 0}]
        TX: [{hours_threshold: 12, refund_pct: 100}, {hours_threshold: 0, refund_pct: 0}]
    precision: "integer cents; round_half_up on the refund_pct multiplication"
    variants:
      - name: voluntary_member_cancel
        when: "Booking cancel triggered by Member.cancel endpoint"
        difference: "Uses STATE_REFUND_SCHEDULE keyed on Member.state_code"
      - name: admin_or_cascade_cancel
        when: "Booking cancelled by system cascade (delinquency, session cancel, suspension)"
        difference: "Full 100% refund regardless of hours_to_start (ADMIN schedule), and no NO_SHOW_PENALTY ever applies even if the booking was previously CONFIRMED"

  - name: late_payment_penalty
    trigger: "Subscription enters GRACE (PAST_DUE → GRACE transition)"
    algorithm: tiered_pricing
    formula: |
      # different conserved quantity from refund: this affects Member.wallet_credit_cents
      # by SUBTRACTING (negative credit). Pinned per state.
      penalty_cents = round_half_up(
          Subscription.base_price_cents * LATE_FEE_PCT_BY_STATE[Member.state_code] / 100
      )
      Member.wallet_credit_cents -= penalty_cents
      # Member.wallet_credit_cents may go negative; the next successful charge MUST
      # add penalty back to amount_cents.
    constants:
      LATE_FEE_PCT_BY_STATE:
        CA: 5
        NY: 8
        TX: 3
    precision: "integer cents; round_half_up"

  - name: account_posture
    trigger: "On every write to Member.billing_status or Member.access_status"
    algorithm: constraint_propagation
    formula: |
      if access_status IN {SUSPENDED, FROZEN, CANCELLED}:
          posture = FROZEN
      elif billing_status IN {PAST_DUE, GRACE, DELINQUENT}:
          posture = RESTRICTED
      elif billing_status IN {CURRENT, REINSTATED} AND access_status == ACTIVE:
          posture = OPEN
      else:
          posture = RESTRICTED   # safe default
    constants: {}
    note: "FROZEN/RESTRICTED both block new Booking creation; gate webhook only accepts check-in when posture==OPEN."

  - name: waitlist_promotion
    trigger: "On Booking enters CANCELLED for a ClassSession with WAITLISTED siblings; on ClassSession's RESERVED→LOCKED tick (cleans up auto-promotion)"
    algorithm: chronological
    formula: |
      # selector policy: pick the WAITLISTED Booking that has been waiting longest
      # whose owner currently has posture == OPEN.
      eligible = [b for b in ClassSession.bookings
                  if b.status == WAITLISTED
                  and Member(b.member_id).account_posture == OPEN]
      sort by b.created_at ASC   # FIFO; never use b.id as tie-break
      if eligible is empty:
          no-op (fallback: leave seat unallocated)
      else:
          promote eligible[0] to RESERVED (state-machine transition above runs all side effects)
    constants: {}
    note: "Tie-break by created_at ASC only; UUID id is identity-only and MUST NOT be used to break ties."

  - name: no_show_strike_count
    trigger: "Each Booking NO_SHOW transition; recomputed live during validation of new bookings"
    algorithm: aggregation
    formula: |
      # event-window aggregation on a different domain (Member behavior) than the
      # ledger calculations above; cumulative within a rolling window.
      window_start = now - NO_SHOW_WINDOW_DAYS days
      strike_count = count(Booking b WHERE b.member_id == Member.id
                                       AND b.status == NO_SHOW
                                       AND Booking_NO_SHOW_transition.created_at >= window_start)
    constants:
      NO_SHOW_WINDOW_DAYS: 30
      NO_SHOW_STRIKE_LIMIT: 3
      STRIKE_SUSPENSION_DAYS: 7

  - name: referral_reward_value
    trigger: "ReferralReward.status enters QUALIFIED (first SUCCESS PaymentAttempt by invitee)"
    algorithm: weighted_scoring
    formula: |
      reward_value_cents = REFERRAL_REWARD_CENTS_BY_PLAN[invitee.subscription.plan]
      # Mint a Coupon with kind=REFERRAL_REWARD, value=reward_value_cents,
      # tied_to_member_id=sponsor.id, applicable_to=SUBSCRIPTION
    constants:
      REFERRAL_REWARD_CENTS_BY_PLAN:
        BASIC: 1000
        PLUS: 2500
        ELITE: 5000

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and match a known identity (Member, Trainer, StoreManager, BillingAdmin)"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be in the endpoint's authorized set (RBAC matrix §1.7)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources resolve left-to-right; missing parent yields its specific NOT_FOUND error"
    error_id: "ERR_MEMBER_NOT_FOUND / ERR_SUBSCRIPTION_NOT_FOUND / ERR_BOOKING_NOT_FOUND / ERR_CLASS_SESSION_NOT_FOUND / ERR_COUPON_NOT_FOUND / ERR_TRAINER_NOT_FOUND / ERR_STORE_NOT_FOUND / ERR_EQUIPMENT_POOL_NOT_FOUND / ERR_REFERRAL_NOT_FOUND"
    http_status: 404
    applies_to: all nested-resource endpoints

  - priority: 4
    category: state
    check: "Target resource must be in a state that permits this operation (e.g., Subscription.status==ACTIVE for suspend; Booking.status not in terminal set for cancel)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 5
    category: state
    check: "Member.account_posture==OPEN required for new GROUP_CLASS or PERSONAL_TRAINING bookings; RESTRICTED still allows waitlist join, FROZEN forbids both"
    error_id: ERR_ACCOUNT_POSTURE_FROZEN
    http_status: 403
    applies_to: "POST /members/{memberId}/bookings"

  - priority: 6
    category: business_referential
    check: "Cross-store booking: store_id must be derivable from class_session_id or trainer_id; if member.home_store_id != store_id, allowed only for tier IN {PLUS, ELITE}"
    error_id: ERR_CROSS_STORE_NOT_ALLOWED_FOR_TIER
    http_status: 403
    applies_to: "POST /members/{memberId}/bookings"

  - priority: 7
    category: business_safety
    check: "ClassSession.minimum_tier respected: a BASIC member cannot reserve a PLUS-only or ELITE-only class"
    error_id: ERR_TIER_BELOW_MINIMUM
    http_status: 403
    applies_to: "POST /members/{memberId}/bookings"

  - priority: 8
    category: business_constraint
    check: "Member has no other Booking whose [starts_at, ends_at) overlaps the requested one (half-open interval, no buffer); applies across stores. Adjacent intervals (back-to-back ends_at == starts_at) are allowed."
    error_id: ERR_MEMBER_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /members/{memberId}/bookings"

  - priority: 9
    category: business_constraint
    check: "Trainer must not have another PT Booking in CONFIRMED or RESERVED whose [starts_at - BUFFER_MIN, ends_at + BUFFER_MIN) closed-on-both-sides envelope overlaps this one. BUFFER_MIN = 15 minutes; adjacency within this envelope IS a conflict."
    error_id: ERR_TRAINER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /members/{memberId}/bookings (PERSONAL_TRAINING only)"

  - priority: 10
    category: business_constraint
    check: "EquipmentPool capacity invariant: sum of equipment_units_required across all SCHEDULED or LOCKED ClassSessions whose [starts_at, ends_at) overlaps the requested session's window must remain <= EquipmentPool.total_units, AND the requested window must not overlap [maintenance_window_start, maintenance_window_end) at all (half-open)."
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /stores/{storeId}/class-sessions"

  - priority: 11
    category: business_temporal
    check: "Booking.starts_at must be >= current_clock + MIN_LEAD_MINUTES for GROUP_CLASS (10 minutes), and exactly equals ClassSession.starts_at"
    error_id: ERR_BOOKING_LEAD_TIME
    http_status: 409
    applies_to: "POST /members/{memberId}/bookings"

  - priority: 12
    category: business_constraint
    check: "Coupon validity: code exists, status==ACTIVE, current_clock IN [valid_from, valid_until), redemption_count < max_redemptions, applicable_to matches request kind"
    error_id: ERR_COUPON_INVALID
    http_status: 400
    applies_to: "POST /members/{memberId}/bookings (with applied_coupon_id), POST /members/{memberId}/subscriptions"

  - priority: 13
    category: business_fiscal
    check: "PaymentAttempt amount_cents must equal the server-recomputed subscription_charge_amount for this attempt (prevents client tampering)"
    error_id: ERR_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /members/{memberId}/subscriptions/{subId}/payment-attempts"

  - priority: 14
    category: business_fiscal
    check: "Suspension only allowed when Subscription.status IN {ACTIVE, REINSTATED} AND no future RESERVED/CONFIRMED Booking exists for this Member"
    error_id: ERR_HAS_FUTURE_BOOKINGS
    http_status: 409
    applies_to: "POST /members/{memberId}/suspend"

  - priority: 15
    category: business_fiscal
    check: "Self-referral forbidden: invitee.referred_by_member_id != invitee.id"
    error_id: ERR_SELF_REFERRAL
    http_status: 400
    applies_to: "POST /members"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Member registration & auth ----
  - method: POST
    path: "/members"
    description: "Register a new Member (creates account in PENDING_ACTIVATION subscription state when subscription params included)"
    roles: [Any]
    code: 201
    input: [email, password, home_store_id, state_code, "referred_by_member_id?", "plan?", "billing_cycle?", "applied_coupon_code?"]
    output: Member
    side_effects:
      - "billing_status := CURRENT, access_status := ACTIVE, account_posture computed"
      - "If referred_by_member_id set: create ReferralReward with status=PENDING"

  - method: POST
    path: "/members/{memberId}/login"
    description: "Authenticate; returns session token bound to X-User-ID for subsequent requests"
    roles: [Any]
    code: 200
    input: [email, password]
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List Members"
    roles: [StoreManager, BillingAdmin]
    code: 200
    input: ["limit?", "offset?", "tier?", "billing_status?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/members/{memberId}"
    description: "Get a Member"
    roles: [Member, Trainer, StoreManager, BillingAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  # ---- Membership lifecycle ----
  - method: POST
    path: "/members/{memberId}/suspend"
    description: "Voluntary suspend (sets suspension_window_end = now + max_suspension_days(state_code))"
    roles: [Member, BillingAdmin]
    code: 200
    input: ["requested_days?"]
    output: Member
    side_effects: ["access_status → SUSPENDED, account_posture → FROZEN"]

  - method: POST
    path: "/members/{memberId}/resume"
    description: "Early resume from suspension"
    roles: [Member, BillingAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["access_status → ACTIVE, account_posture recomputed"]

  - method: POST
    path: "/members/{memberId}/cancel"
    description: "Cancel membership at end of current period"
    roles: [Member, BillingAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["access_status → CANCELLED (at cancellation_effective_at), auto_renew → false"]

  # ---- Subscriptions ----
  - method: POST
    path: "/members/{memberId}/subscriptions"
    description: "Create a Subscription (PENDING_ACTIVATION until first SUCCESS payment)"
    roles: [Member, BillingAdmin]
    code: 201
    input: [plan, billing_cycle, "auto_renew?", "applied_coupon_code?"]
    output: Subscription
    side_effects: ["base_price_cents pinned from plan list at creation time"]

  - method: GET
    path: "/members/{memberId}/subscriptions"
    description: "List Subscriptions for a Member"
    roles: [Member, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []

  - method: GET
    path: "/members/{memberId}/subscriptions/{subId}"
    description: "Get a Subscription"
    roles: [Member, BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/members/{memberId}/subscriptions/{subId}/reinstate"
    description: "Manually reinstate a DELINQUENT subscription (after BillingAdmin verifies catch-up payment)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status → ACTIVE, Member.access_status → ACTIVE, posture → OPEN"]

  # ---- Payment attempts (idempotency-driven, third-party gateway integration) ----
  - method: POST
    path: "/members/{memberId}/subscriptions/{subId}/payment-attempts"
    description: "Record a payment attempt outcome; idempotent on idempotency_key per Subscription"
    roles: [system, BillingAdmin]
    code: 201
    input: [gateway_txn_id, idempotency_key, outcome, "failure_reason?"]
    output: PaymentAttempt
    side_effects:
      - "Subscription/Member state machines fire per outcome"
      - "On SUCCESS during PENDING_ACTIVATION: ReferralReward qualifies"

  - method: GET
    path: "/members/{memberId}/subscriptions/{subId}/payment-attempts"
    description: "List PaymentAttempts for a Subscription"
    roles: [BillingAdmin, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "PaymentAttempt[]"
    side_effects: []

  # ---- Stores & class sessions ----
  - method: GET
    path: "/stores"
    description: "List Stores"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "state_code?"]
    output: "Store[]"
    side_effects: []

  - method: POST
    path: "/stores/{storeId}/class-sessions"
    description: "Schedule a ClassSession; runs trainer overlap + equipment capacity checks"
    roles: [StoreManager]
    code: 201
    input: [class_type, trainer_id, starts_at, ends_at, capacity, "minimum_tier?", "equipment_pool_id?", "equipment_units_required?"]
    output: ClassSession
    side_effects: ["EquipmentPool reservation; trainer schedule check"]

  - method: GET
    path: "/stores/{storeId}/class-sessions"
    description: "List ClassSessions for a Store"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "from?", "to?"]
    output: "ClassSession[]"
    side_effects: []

  - method: GET
    path: "/stores/{storeId}/class-sessions/{sessionId}"
    description: "Get a ClassSession"
    roles: [Any]
    code: 200
    input: []
    output: ClassSession
    side_effects: []

  - method: POST
    path: "/stores/{storeId}/class-sessions/{sessionId}/cancel"
    description: "Cancel a ClassSession; cascades to all non-terminal Bookings"
    roles: [StoreManager]
    code: 200
    input: []
    output: ClassSession
    side_effects: ["All non-terminal Bookings → CANCELLED with ADMIN refund; equipment released"]

  # ---- Equipment & trainers ----
  - method: POST
    path: "/stores/{storeId}/equipment-pools"
    description: "Create an EquipmentPool"
    roles: [StoreManager]
    code: 201
    input: [equipment_type, total_units, "maintenance_window_start?", "maintenance_window_end?"]
    output: EquipmentPool
    side_effects: []

  - method: GET
    path: "/stores/{storeId}/equipment-pools"
    description: "List EquipmentPools for a Store"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "EquipmentPool[]"
    side_effects: []

  - method: POST
    path: "/trainers"
    description: "Register a Trainer"
    roles: [StoreManager, BillingAdmin]
    code: 201
    input: [full_name, home_store_id, certifications, hourly_rate_cents]
    output: Trainer
    side_effects: []

  - method: GET
    path: "/trainers"
    description: "List Trainers"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "home_store_id?"]
    output: "Trainer[]"
    side_effects: []

  - method: GET
    path: "/trainers/{trainerId}"
    description: "Get a Trainer"
    roles: [Any]
    code: 200
    input: []
    output: Trainer
    side_effects: []

  # ---- Bookings (cross-store) ----
  - method: POST
    path: "/members/{memberId}/bookings"
    description: "Create a Booking (GROUP_CLASS or PERSONAL_TRAINING); auto-WAITLIST when capacity full"
    roles: [Member, StoreManager]
    code: 201
    input: [booking_kind, "class_session_id?", "trainer_id?", "starts_at?", "ends_at?", "applied_coupon_id?"]
    output: Booking
    side_effects:
      - "If kind=GROUP_CLASS and capacity available: status=RESERVED, reserved_seat_count incremented"
      - "If capacity full: status=WAITLISTED, waitlist_position assigned by created_at"
      - "provisional_price_cents computed by booking_provisional_price"
      - "Coupon redemption_count incremented if applied"

  - method: GET
    path: "/members/{memberId}/bookings"
    description: "List Bookings for a Member"
    roles: [Member, BillingAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "booking_kind?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/members/{memberId}/bookings/{bookingId}"
    description: "Get a Booking"
    roles: [Member, BillingAdmin, StoreManager, Trainer]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/members/{memberId}/bookings/{bookingId}/confirm"
    description: "Confirm a RESERVED Booking"
    roles: [Member]
    code: 200
    input: []
    output: Booking
    side_effects: ["status RESERVED → CONFIRMED"]

  - method: POST
    path: "/members/{memberId}/bookings/{bookingId}/check-in"
    description: "Access-gate webhook callback (third-party): records gate_check_in_at"
    roles: [system]
    code: 200
    input: [gate_device_id]
    output: Booking
    side_effects: ["status CONFIRMED → ATTENDED; gate_check_in_at recorded"]

  - method: POST
    path: "/members/{memberId}/bookings/{bookingId}/cancel"
    description: "Cancel a Booking (computes state-specific refund)"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["state-specific refund credited to wallet_credit_cents; waitlist promotion fires for vacated seat"]

  # ---- Coupons & referrals ----
  - method: POST
    path: "/coupons"
    description: "Create a promotional Coupon"
    roles: [BillingAdmin]
    code: 201
    input: [code, kind, value, applicable_to, valid_from, valid_until, max_redemptions]
    output: Coupon
    side_effects: []

  - method: GET
    path: "/coupons"
    description: "List Coupons"
    roles: [BillingAdmin, StoreManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Coupon[]"
    side_effects: []

  - method: GET
    path: "/coupons/{couponId}"
    description: "Get a Coupon"
    roles: [BillingAdmin, StoreManager, Member]
    code: 200
    input: []
    output: Coupon
    side_effects: []

  - method: POST
    path: "/coupons/{couponId}/verify"
    description: "Verify a Coupon can be redeemed by a given Member for a given context (third-party analytics integration also calls this)"
    roles: [Member, BillingAdmin, system]
    code: 200
    input: [context_kind, "context_id?"]
    output: Coupon
    side_effects: []

  - method: GET
    path: "/members/{memberId}/referrals"
    description: "List ReferralRewards where this Member is the sponsor"
    roles: [Member, BillingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReferralReward[]"
    side_effects: []

  # ---- Analytics integration ----
  - method: GET
    path: "/members/{memberId}/wallet"
    description: "Read-only view of wallet_credit_cents and recent ledger entries (data analytics platform pulls this)"
    roles: [Member, BillingAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  # ---- Test-driving endpoints (mandatory per §1.5 testability completeness) ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advances server clock to a given ISO 8601 UTC instant; fires all time-gated transitions that became eligible"
    roles: [BillingAdmin]
    code: 200
    input: [to_timestamp]
    output: null
    side_effects:
      - "Cascades: Subscription PAST_DUE → GRACE → DELINQUENT; Member SUSPENDED → ACTIVE on suspension_window_end; ClassSession SCHEDULED → LOCKED → COMPLETED"

  - method: POST
    path: "/_sweep/run"
    description: "Test-only: runs the periodic sweep that marks unattended CONFIRMED bookings NO_SHOW and processes pending waitlist promotions"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "Booking CONFIRMED → NO_SHOW for all whose ClassSession.ends_at < current_clock and gate_check_in_at IS NULL"
      - "Strike count recomputed; cascade suspension fires when strike_count >= NO_SHOW_STRIKE_LIMIT"

  - method: POST
    path: "/_events/emit"
    description: "Test-only: simulates an external event (gate-vendor webhook, payment-gateway webhook) without going through the third-party integration"
    roles: [BillingAdmin]
    code: 200
    input: [event_kind, event_payload]
    output: null
    side_effects: ["Synthesizes a gate check-in, a deferred payment-attempt outcome, or an analytics platform export ack"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,                http: 403, condition: "Role lacks permission for this endpoint" }

  # Not found
  - { id: ERR_MEMBER_NOT_FOUND,         http: 404, condition: "Member with memberId does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND,   http: 404, condition: "Subscription with subId does not exist under this Member" }
  - { id: ERR_BOOKING_NOT_FOUND,        http: 404, condition: "Booking with bookingId does not exist under this Member" }
  - { id: ERR_CLASS_SESSION_NOT_FOUND,  http: 404, condition: "ClassSession with sessionId does not exist under this Store" }
  - { id: ERR_COUPON_NOT_FOUND,         http: 404, condition: "Coupon with couponId or code does not exist" }
  - { id: ERR_TRAINER_NOT_FOUND,        http: 404, condition: "Trainer with trainerId does not exist" }
  - { id: ERR_STORE_NOT_FOUND,          http: 404, condition: "Store with storeId does not exist" }
  - { id: ERR_EQUIPMENT_POOL_NOT_FOUND, http: 404, condition: "EquipmentPool not found in this Store" }
  - { id: ERR_REFERRAL_NOT_FOUND,       http: 404, condition: "ReferralReward not found for this Member" }

  # State
  - { id: ERR_INVALID_STATE,            http: 409, condition: "Target resource is not in a state allowing this operation" }
  - { id: ERR_BOOKING_TERMINAL,         http: 409, condition: "Booking is already in a terminal state (ATTENDED, NO_SHOW, CANCELLED)" }
  - { id: ERR_ACCOUNT_POSTURE_FROZEN,   http: 403, condition: "Member.account_posture is FROZEN; operation blocked" }
  - { id: ERR_PAYMENT_IN_FLIGHT,        http: 409, condition: "A non-terminal PaymentAttempt exists in the last 2 minutes" }
  - { id: ERR_HAS_FUTURE_BOOKINGS,      http: 409, condition: "Member has at least one RESERVED or CONFIRMED Booking in the future" }

  # Idempotency / concurrency
  - { id: ERR_IDEMPOTENT_REPLAY,        http: 200, condition: "Idempotency-key replay; original response returned without re-execution" }

  # Business — referential
  - { id: ERR_CROSS_STORE_NOT_ALLOWED_FOR_TIER, http: 403, condition: "BASIC member cannot book at a store other than home_store_id" }
  - { id: ERR_TIER_BELOW_MINIMUM,               http: 403, condition: "Member.tier is lower than ClassSession.minimum_tier" }

  # Business — temporal / capacity / overlap
  - { id: ERR_MEMBER_TIME_CONFLICT,             http: 409, condition: "Requested booking interval [starts_at, ends_at) overlaps another booking of the same Member (half-open, no buffer)" }
  - { id: ERR_TRAINER_UNAVAILABLE,              http: 409, condition: "Trainer has another PT booking inside [start-15min, end+15min] closed envelope" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE,            http: 409, condition: "EquipmentPool aggregate units required during the window would exceed total_units OR window overlaps maintenance_window" }
  - { id: ERR_BOOKING_LEAD_TIME,                http: 409, condition: "Requested Booking.starts_at is less than MIN_LEAD_MINUTES from current_clock" }

  # Business — coupon / fiscal
  - { id: ERR_COUPON_INVALID,                   http: 400, condition: "Coupon not active, outside [valid_from, valid_until), or applicable_to mismatch" }
  - { id: ERR_COUPON_EXHAUSTED,                 http: 409, condition: "Coupon.redemption_count has reached max_redemptions" }
  - { id: ERR_AMOUNT_MISMATCH,                  http: 422, condition: "Client-supplied PaymentAttempt.amount_cents disagrees with server-recomputed value" }
  - { id: ERR_SELF_REFERRAL,                    http: 400, condition: "Member attempted to refer themselves" }

  # Validation surface
  - { id: ERR_INVALID_REQUEST,                  http: 400, condition: "Generic malformed request (missing fields, type errors, invalid enum value)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "End user; books classes/PT, manages own subscription and bookings"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{memberId}/login"
      - "POST /members/{memberId}/suspend"
      - "POST /members/{memberId}/resume"
      - "POST /members/{memberId}/cancel"
      - "POST /members/{memberId}/bookings — Create own booking"
      - "POST /members/{memberId}/bookings/{bookingId}/confirm"
      - "POST /members/{memberId}/bookings/{bookingId}/cancel — Member-driven cancel only"
    shared_operations:
      - "GET /members/{memberId} — own profile (others restricted)"
      - "GET /members/{memberId}/subscriptions"
      - "GET /members/{memberId}/bookings"
      - "GET /members/{memberId}/wallet"
      - "GET /members/{memberId}/referrals"
      - "POST /coupons/{couponId}/verify"
      - "GET /stores, GET /stores/{storeId}/class-sessions, GET /trainers"
      - "POST /members — Self-register"

  - name: Trainer
    description: "Conducts personal training sessions; reads schedules and bookings; cannot mutate subscriptions or coupons"
    identity: "entity_backed:Trainer"
    exclusive_operations: []
    shared_operations:
      - "GET /members/{memberId} — for sessions they lead"
      - "GET /members/{memberId}/bookings/{bookingId} — for bookings they lead"
      - "GET /stores, GET /stores/{storeId}/class-sessions, GET /trainers, GET /trainers/{trainerId}"

  - name: StoreManager
    description: "Operates a single Store: schedules class sessions, manages equipment, cancels sessions, can cancel/move member bookings as a courtesy"
    identity: "opaque"
    exclusive_operations:
      - "POST /stores/{storeId}/class-sessions"
      - "POST /stores/{storeId}/class-sessions/{sessionId}/cancel"
      - "POST /stores/{storeId}/equipment-pools"
      - "POST /trainers — Onboard trainer"
    shared_operations:
      - "POST /members/{memberId}/bookings — On behalf of a Member"
      - "POST /members/{memberId}/bookings/{bookingId}/cancel — Admin cancel"
      - "GET /members, GET /coupons, GET /coupons/{couponId}"

  - name: BillingAdmin
    description: "Chain-wide finance role: subscriptions, payments, refunds, suspensions, coupons, test endpoints"
    identity: "opaque"
    exclusive_operations:
      - "POST /members/{memberId}/subscriptions/{subId}/reinstate"
      - "POST /coupons — Mint promotional coupons"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /_events/emit"
    shared_operations:
      - "POST /members/{memberId}/subscriptions/{subId}/payment-attempts — also callable by system"
      - "POST /members/{memberId}/suspend / resume / cancel — admin override"
      - "POST /trainers — Onboard trainer"
      - "GET /members, GET /members/{memberId}, GET /coupons, GET /members/{memberId}/wallet"

  - name: Any
    description: "Public/anonymous surface (registration, store directory, trainer directory)"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /members — Self-register"
      - "GET /stores"
      - "GET /stores/{storeId}/class-sessions"
      - "GET /trainers"
      - "GET /trainers/{trainerId}"
