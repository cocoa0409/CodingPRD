              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks/${task_a}"
              payload: {}
              as: PolicyAdmin
              captures: { task_a_v: "$.data.version" }
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /ad-policy/_policy-sweeps/run"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
