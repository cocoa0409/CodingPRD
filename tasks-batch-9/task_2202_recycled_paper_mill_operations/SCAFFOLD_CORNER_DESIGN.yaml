  # ===========================================================================
  # §1.3 CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:

      - name: volume_tier_is_read_off_provisional_extended_even_when_final_value_crosses_the_ceiling
        claim_type: tiered_pricing
        grounds:
          - calculations.indexed_fiber_unit_price
          - calculations.indexed_fiber_unit_price.variants.pinned_provisional_tier
          - entities.FiberPurchaseOrder.fields.extended_contract_value
        distinguishing_aspect: "provisional_extended is 98050.00 (below TIER1_CEILING_USD) so volume_discount_pct must be 0.000, yet extended_contract_value comes out at 105899.30 — above the ceiling. An implementation that re-derives the tier from the final value would apply 0.015 and return quoted 197.04 / extended 104431.20. The pinned answer is 199.81 / 105899.30."
        test_recipe:
          setup: ["One PPI_OCC quote of 180.00 for 2026-08; supplier freight 12.50/ton; a DRAFT PO for 530.00 tons at CURRENT_MONTH basis with a +5.00 negotiated delta."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_OCC", effective_month: "2026-08", published_price_per_ton: 180.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "OCC_11", contracted_tons: 530.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_id: "$.data.id", po_version: "$.data.version" }
          trigger:
            - call: "POST /fiber-purchase-orders/${po_id}/price"
              payload: { expected_purchase_order_version: "${po_version}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 200"
            - "response.data.status == 'PRICED'"
            - "response.data.fuel_surcharge_per_ton == 2.31"
            - "response.data.quoted_unit_price_per_ton == 199.81"
            - "response.data.extended_contract_value == 105899.30"
            - "response.data.index_quote_month_used == '2026-08'"
            - "response.data.pricing_revision_count == 0"

      - name: provisional_extended_exactly_at_tier1_ceiling_takes_the_1_5_percent_discount
        claim_type: threshold
        grounds:
          - calculations.indexed_fiber_unit_price
          - calculations.indexed_fiber_unit_price.constants.TIER1_CEILING_USD
          - calculations.indexed_fiber_unit_price.constants.TIER2_DISCOUNT_PCT
        distinguishing_aspect: "provisional_extended lands on 100000.00 exactly. The tier test is `>= TIER1_CEILING_USD`, so the 0.015 discount applies at the boundary, not one cent above it: base 200.00 becomes 197.00 and quoted_unit_price_per_ton is 211.81. An exclusive `>` reading returns 214.81."
        test_recipe:
          setup: ["One PPI_OCC quote of 195.00 for 2026-08; supplier freight 12.50/ton; a DRAFT PO for 500.00 tons with a +5.00 delta, so base_price is 200.00 and provisional_extended is exactly 100000.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_OCC", effective_month: "2026-08", published_price_per_ton: 195.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "OCC_11", contracted_tons: 500.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_id: "$.data.id", po_version: "$.data.version" }
          trigger:
            - call: "POST /fiber-purchase-orders/${po_id}/price"
              payload: { expected_purchase_order_version: "${po_version}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 200"
            - "response.data.quoted_unit_price_per_ton == 211.81"
            - "response.data.extended_contract_value == 105905.00"
            - "response.data.fuel_surcharge_per_ton == 2.31"

      - name: prior_month_basis_resolves_the_surviving_quote_for_the_preceding_month
        claim_type: input_set_filtering
        grounds:
          - calculations.indexed_fiber_unit_price
          - entities.MarketIndexQuote.fields.superseded
          - entities.FiberPurchaseOrder.fields.index_quote_month_used
          - endpoints[POST /market-index-quotes].side_effects
        distinguishing_aspect: "Three quotes exist for PPI_DLK: 2026-07 at 300.00 (superseded by a republication), 2026-07 at 260.00 (surviving) and 2026-08 at 400.00. With index_basis PRIOR_MONTH and priced_for_month 2026-08 the only admissible row is the surviving 2026-07 quote of 260.00, so index_quote_month_used is '2026-07' and quoted_unit_price_per_ton is 273.70. Picking the superseded row gives 313.70; picking the current month gives 413.70."
        test_recipe:
          setup: ["PPI_DLK quotes: 2026-07 republished from 300.00 to 260.00 (the first row now superseded) and 2026-08 at 400.00. Supplier freight 20.00/ton. A DRAFT PO for 100.00 tons, PRIOR_MONTH basis, priced_for_month 2026-08, delta -10.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "DLK_37", index_symbol: "PPI_DLK", max_contamination_pct: 2.00, max_moisture_pct: 10.00, nominal_yield_pct: 80.00, deink_required: true, rank_order: 2 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_DLK", effective_month: "2026-07", published_price_per_ton: 300.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { stale_quote_id: "$.data.id" }
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_DLK", effective_month: "2026-07", published_price_per_ton: 260.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_DLK", effective_month: "2026-08", published_price_per_ton: 400.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Bayou Deink Sourcing", freight_per_ton: 20.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "DLK_37", contracted_tons: 100.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: -10.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_id: "$.data.id", po_version: "$.data.version" }
          trigger:
            - call: "POST /fiber-purchase-orders/${po_id}/price"
              payload: { expected_purchase_order_version: "${po_version}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 200"
            - "response.data.index_quote_month_used == '2026-07'"
            - "response.data.fuel_surcharge_per_ton == 3.70"
            - "response.data.quoted_unit_price_per_ton == 273.70"
            - "response.data.extended_contract_value == 27370.00"
            - "GET /market-index-quotes?index_symbol=PPI_DLK&effective_month=2026-07&superseded=true as FiberBuyer returns total_count == 1 with data[0].id == ${stale_quote_id} and data[0].published_price_per_ton == 300.00"

      - name: fuel_surcharge_rounds_a_half_cent_upward_at_the_declared_rate
        claim_type: precision
        grounds:
          - calculations.indexed_fiber_unit_price
          - calculations.indexed_fiber_unit_price.constants.FUEL_SURCHARGE_RATE
          - entities.FiberPurchaseOrder.fields.fuel_surcharge_per_ton
        distinguishing_aspect: "17.00 * 0.185 = 3.1450 exactly, a true half-cent tie. round_half_up must yield 3.15, so quoted_unit_price_per_ton is 120.15; banker's rounding or truncation yields 3.14 / 120.14. The freight itself is added twice-over (raw F plus the surcharge), which the total also pins."
        test_recipe:
          setup: ["One PPI_SOP quote of 100.00 for 2026-08; supplier freight 17.00/ton; a DRAFT PO for 10.00 tons with a 0.00 delta."]
