              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Falls", category: "GAMES", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 10000, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "v1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "ok" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /api/developers/${dev_id}/tax-profile"
              payload: { tax_id_provided: false, reason: "IRS B-notice: TIN mismatch" }
              as: PlatformAdmin
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "US", external_order_ref: "ORD-X", line_items: [{ sku: "base", unit_price_cents: 10000, quantity: 1 }] }
              as: StorefrontService
              captures: { px_id: $.data.id }
            - call: "POST /api/purchases/${px_id}/capture"
              payload: {}
              as: StorefrontService
            - call: "POST /api/payout-batches"
              payload: { payout_currency: "USD", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { batch1_id: $.data.id }
            - call: "POST /api/payout-batches/${batch1_id}/calculate"
              payload: {}
