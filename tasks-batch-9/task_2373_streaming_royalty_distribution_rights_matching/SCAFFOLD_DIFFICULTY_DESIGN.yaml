scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: pool_attribution_denominator_variant_divergence
        grounds:
          - calculations.pool_attribution
          - entities.RoyaltyPool.fields.denominator_basis
          - entities.RoyaltyPool.fields.holding_cents
          - entities.AccountingPeriod.fields.claim_window_closes_at
        distinguishing_aspect: |
          The two variants are selected by the logical clock's position relative to
          claim_window_closes_at and change the DENOMINATOR of the per-line attribution, so the
          identical stored usage rows yield attributed_revenue_cents 599999/299999/99999 under
          ALL_USAGE and 666666/333333/0 under MATCHED_ONLY — the unmatched line's 99999 cents is
          held under one variant and redistributed to the matched lines under the other.
        test_recipe:
          setup:
            - "One EFFECTIVE RateSchedule for (GB, INDIVIDUAL) with revenue_share_bps 7000, per_subscriber_minimum_cents 500, statutory_floor_per_play_millicents 100, mechanical 4000 / performance 6000, window 2026-01-01..2026-12-31."
            - "AccountingPeriod 2026-06 covering 2026-06-01..2026-06-30, so claim_window_closes_at == 2026-08-29T00:00:00Z."
            - "One sealed and matched UsageBatch with three GB/INDIVIDUAL lines: 300000 plays matched by exact ISRC, 150000 plays matched by normalized title+artist, 50000 plays left UNMATCHED at confidence 5000."
            - "RoyaltyPool GB/INDIVIDUAL with subscriber_count 1000 and gross_revenue_cents 1428570, calculated once while the logical clock is still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-01", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { rs1: "$.data.id" }
            - call: "POST /royalties/rate-schedules/${rs1}/promulgate"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /royalties/periods"
              payload: { label: "2026-06", usage_start: "2026-06-01", usage_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { per: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "COMPOSITION", identifier: "T3100000001", title: "Midnight Ledger" }
              as: RightsOpsAnalyst
              captures: { c1: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600001", title: "Midnight Ledger", artist_credit: "The Reconcilers", linked_work_id: "${c1}" }
              as: RightsOpsAnalyst
              captures: { w1: "$.data.id" }
            - call: "POST /royalties/works"
              payload: { work_type: "RECORDING", identifier: "GBABC2600002", title: "Neon Ledger", artist_credit: "Halfsleep" }
              as: RightsOpsAnalyst
              captures: { w2: "$.data.id" }
            - call: "POST /royalties/usage-batches"
              payload: { period_id: "${per}", source_label: "UK client feed" }
              as: RightsOpsAnalyst
              captures: { ub: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_isrc: "GBABC2600001", reported_title: "Midnight Ledger", reported_artist: "The Reconcilers", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 300000 }
              as: RightsOpsAnalyst
              captures: { u1: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "  MIDNIGHT   LEDGER!! ", reported_artist: "the reconcilers", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 150000 }
              as: RightsOpsAnalyst
              captures: { u2: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/lines"
              payload: { reported_title: "Neon Ledger", territory_code: "GB", subscription_tier: "INDIVIDUAL", play_count: 50000 }
              as: RightsOpsAnalyst
              captures: { u3: "$.data.id" }
            - call: "POST /royalties/usage-batches/${ub}/seal"
              payload: {}
              as: RightsOpsAnalyst
            - call: "POST /royalties/usage-batches/${ub}/match"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-fuzzy-1"
            - call: "GET /royalties/works/${w1}"
              payload: {}
              as: RightsOpsAnalyst
              captures: { w1v: "$.data.version" }
            - call: "POST /royalties/rights-registrations"
              payload: { work_id: "${w1}", claimant_id: "${lbl}", right_type: "MASTER", routing: "DIRECT", share_bps: 10000, territory_set: ["WORLD"], effective_from: "2026-01-01", effective_to: "2027-01-01", expected_work_version: "${w1v}" }
              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { rg1: "$.data.id" }
            - call: "POST /royalties/rights-registrations/${rg1}/review"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
            - call: "POST /royalties/rights-registrations/${rg1}/approve"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
            - call: "POST /royalties/pools"
              payload: { period_id: "${per}", territory_code: "GB", subscription_tier: "INDIVIDUAL", subscriber_count: 1000, gross_revenue_cents: 1428570 }
              as: RoyaltyAdmin
              captures: { pl1: "$.data.id" }
            - call: "POST /royalties/pools/${pl1}/calculate"
              payload: {}
              as: RoyaltyAdmin
              captures: { basis_a: "$.data.denominator_basis" }
          trigger:
            - call: "POST /royalties/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: RoyaltyAdmin
            - call: "POST /royalties/pools/${pl1}/calculate"
              payload: {}
              as: RoyaltyAdmin
              captures: { basis_b: "$.data.denominator_basis" }
          assert:
            - "First calculate (clock 2026-08-01T00:00:00Z, window open): denominator_basis == ALL_USAGE, denominator_play_count == 500000, distributable_cents == 999999."
            - "First calculate per-line attribution: u1 599999, u2 299999, u3 99999; matched_attributed_cents 899998; holding_cents 99999; rounding_residual_cents 2."
            - "Second calculate (clock 2026-08-30T00:00:00Z, window closed): denominator_basis == MATCHED_ONLY, denominator_play_count == 450000, distributable_cents still 999999."
            - "Second calculate per-line attribution: u1 666666, u2 333333, u3 exactly 0; matched_attributed_cents 999999; holding_cents 0; rounding_residual_cents 0."
            - "Delta on u1 between the two variants is exactly +66667 cents on identical stored usage."

      - name: admin_fee_routing_variant_divergence
        grounds:
          - calculations.admin_fee_resolution
          - entities.RightsRegistration.fields.routing
          - entities.RightsRegistration.fields.payee_holder_id
          - entities.StatementLine.fields.admin_fee_cents
        distinguishing_aspect: |
          Two PERFORMANCE registrations over the SAME composition with the SAME share_bps and
          identical gross_cents of 135000 diverge on BOTH amount and recipient purely through
          routing: COLLECTIVE draws the volume-tiered ADMIN_TIER_2_BPS (900) for a fee of 12150
          and pays the collective, while DIRECT draws the flat direct_deal_rate_bps (800) for a
          fee of 10800 and pays the claimant.
        test_recipe:
          setup:
            - "Two EFFECTIVE rate schedules with identical rate values: one for (GB, INDIVIDUAL) and one for (WORLD, INDIVIDUAL); the GB pool selects the GB schedule and the IE pool falls back to the WORLD layer."
            - "One period 2026-06 with one batch carrying six lines: 300000/150000/50000 plays in GB/INDIVIDUAL and the same 300000/150000/50000 plays in IE/INDIVIDUAL."
            - "MASTER registration over the recording (WORLD, DIRECT, 10000 bps) approved; MECHANICAL registration over the composition (GB, COLLECTIVE, 6000 bps) approved."
            - "PERFORMANCE registration over the composition for territory GB with routing COLLECTIVE and 10000 bps, approved; a second PERFORMANCE registration over the same composition for territory IE with routing DIRECT, same claimant, same 10000 bps, approved."
            - "Both pools calculated at the default clock (window open, ALL_USAGE) and finalized, so the period reaches DISTRIBUTED."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
