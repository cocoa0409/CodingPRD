              payload: { quote_id: "${q_id}", product_id: "${svc_id}", quantity: 10, requested_discount_pct: 0.05 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id, line_net: $.data.final_net_cents }
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { q_net: $.data.final_net_total_cents, q_margin: $.data.final_margin_pct }
