      - name: print_run_equals_qualified_plus_newsstand_buffer
        grounds:
          - calculations.issue_print_run
          - entities.Issue.fields.print_run
          - entities.Issue.fields.qualified_subscriber_count
          - entities.Issue.fields.newsstand_buffer_copies
        distinguishing_aspect: |
          Conserved quantity: copies in the print run. Invariant: print_run ==
          qualified_subscriber_count + newsstand_buffer_copies when no override
          is set. Forward action: ship-to-printer computes both fields.
          Compensating action: a print_run_override that equals the computed
          sum is accepted (invariant preserved); an override below
          qualified_subscriber_count is rejected (invariant protected).
        test_recipe:
          setup:
            - "Publication P, Issue I in AD_CLOSED with 3 qualified ACTIVE subs and newsstand_buffer_copies=10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "Invariant2", issn: "88887777", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
