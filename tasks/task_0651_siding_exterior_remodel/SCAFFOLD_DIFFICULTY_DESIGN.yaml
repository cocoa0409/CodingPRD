              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "c3@x.com", full_name: "Client Three", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "3 Hardie Way" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 2000, opening_sqft: 200, linear_trim_ft: 300, color_code: "NAVAJO_BEIGE" }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { meas_id: $.data.id }
            - call: "POST /estimates"
              payload: { project_id: "${proj_id}", measurement_id: "${meas_id}", waste_factor_pct: 0.10 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { est_obj_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "SIDING", quantity: 1800, unit_price_cents: 500 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { line_id: $.data.id }
          assert:
            - "EstimateLineItem.${line_id}.extended_cents == 990000"

      - name: combinatorial_estimate_total_round_per_line_then_sum_then_tax
        grounds:
          - calculations.estimate_total
          - calculations.estimate_subtotal
          - entities.Estimate.fields.estimate_total_cents
        distinguishing_aspect: "Mode (b): nested rounding order is pinned to round-per-line (in line_extended_amount) THEN sum THEN apply 8.25% tax; computing tax on a raw float sum would give a different cent total."
        test_recipe:
          setup:
            - "Estimate with three lines: SIDING 990000, TRIM 90000, WRAP 144000 (each per-line rounded); subtotal 1224000; tax 100980; total 1324980."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "est4@x.com", full_name: "Est Four", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pm4@x.com", full_name: "PM Four", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "c4@x.com", full_name: "Client Four", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "4 Hardie Way" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 2000, opening_sqft: 200, linear_trim_ft: 300, color_code: "COBBLE_STONE" }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { meas_id: $.data.id }
            - call: "POST /estimates"
              payload: { project_id: "${proj_id}", measurement_id: "${meas_id}", waste_factor_pct: 0.10 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { est_obj_id: $.data.id }
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "SIDING", quantity: 1800, unit_price_cents: 500 }
              as: Estimator
              as_user_id: "${est_id}"
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "TRIM", quantity: 300, unit_price_cents: 300 }
              as: Estimator
              as_user_id: "${est_id}"
          trigger:
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "WRAP", quantity: 1800, unit_price_cents: 80 }
              as: Estimator
              as_user_id: "${est_id}"
            - call: "GET /estimates/${est_obj_id}"
              payload: {}
              as: Estimator
              as_user_id: "${est_id}"
              captures: { final_total: $.data.estimate_total_cents }
          assert:
            - "Estimate.${est_obj_id}.line_subtotal_cents == 1224000"
            - "Estimate.${est_obj_id}.tax_cents == 100980"
            - "Estimate.${est_obj_id}.estimate_total_cents == 1324980"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_changeorder_negotiation_cycle
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_NEGOTIATING
          - state_machines.ChangeOrder.NEGOTIATING_to_SUBMITTED
          - entities.ChangeOrder.fields.status
        distinguishing_aspect: "ChangeOrder is cyclic: SUBMITTED->NEGOTIATING->SUBMITTED can repeat, and the revise step rewrites delta_cents while resetting sign-offs — a cycle on the ChangeOrder entity."
        test_recipe:
          setup:
            - "A SUBMITTED ChangeOrder on a baselined project."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "est5@x.com", full_name: "Est Five", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pm5@x.com", full_name: "PM Five", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "c5@x.com", full_name: "Client Five", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "5 Hardie Way" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 1100, opening_sqft: 100, linear_trim_ft: 300, color_code: "EVENING_BLUE" }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { meas_id: $.data.id }
            - call: "POST /estimates"
              payload: { project_id: "${proj_id}", measurement_id: "${meas_id}", waste_factor_pct: 0.10 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { est_obj_id: $.data.id }
            - call: "POST /estimates/${est_obj_id}/line-items"
              payload: { scope_kind: "SIDING", quantity: 1000, unit_price_cents: 1000 }
              as: Estimator
              as_user_id: "${est_id}"
              captures: { line_id: $.data.id }
            - call: "POST /estimates/${est_obj_id}/baseline"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", target_line_item_id: "${line_id}", delta_cents: 20000 }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /change-orders/${co_id}/negotiate"
              payload: {}
              as: HomeownerClient
              as_user_id: "${client_id}"
            - call: "POST /change-orders/${co_id}/revise"
              payload: { delta_cents: 15000 }
              as: ProjectManager
              as_user_id: "${pm_id}"
            - call: "POST /change-orders/${co_id}/negotiate"
              payload: {}
              as: HomeownerClient
              as_user_id: "${client_id}"
          assert:
            - "ChangeOrder.${co_id}.status == NEGOTIATING"
            - "ChangeOrder.${co_id}.delta_cents == 15000"
            - "ChangeOrder.${co_id}.pm_approved == false"
            - "ChangeOrder.${co_id}.client_approved == false"

      - name: nonlinear_project_parallel_workflow_and_compliance
        grounds:
          - state_machines.Project.DRAFT_to_MEASURED
          - state_machines.Project.PENDING_CLEARANCE_to_PERMIT_FILED
          - entities.Project.fields.workflow_status
          - entities.Project.fields.compliance_status
        distinguishing_aspect: "Project carries two independent state axes: filing a permit advances compliance_status PENDING_CLEARANCE->PERMIT_FILED while workflow_status stays MEASURED unchanged, proving the axes evolve independently on one entity."
        test_recipe:
          setup:
            - "Project at workflow_status=MEASURED, compliance_status=PENDING_CLEARANCE (measured but no permit yet)."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "est6@x.com", full_name: "Est Six", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pm6@x.com", full_name: "PM Six", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "c6@x.com", full_name: "Client Six", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "6 Hardie Way" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { estimator_id: "${est_id}", gross_wall_sqft: 1100, opening_sqft: 100, linear_trim_ft: 300, color_code: "TIMBER_BARK" }
              as: Estimator
              as_user_id: "${est_id}"
          trigger:
            - call: "POST /permits"
              payload: { project_id: "${proj_id}", jurisdiction: "Dallas" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { permit_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { wf: $.data.workflow_status, comp: $.data.compliance_status }
          assert:
            - "Project.${proj_id}.workflow_status == MEASURED"
            - "Project.${proj_id}.compliance_status == PERMIT_FILED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_project_cancel_depth3_to_progressdraw
        grounds:
          - state_machines.Project.cancel
          - state_machines.MaterialOrder.cancel
          - state_machines.WorkSchedule.cancel
          - state_machines.ProgressDraw.reject
        distinguishing_aspect: "Depth-3 cascade triggered by Project.cancel: Project.cancel sets MaterialOrder->CANCELLED, which itself sets WorkSchedule->CANCELLED, which itself sets ProgressDraw->REJECTED — each hop caused by the previous, not the original action."
        test_recipe:
          setup:
            - "Project ORDERED with a CONFIRMED material order (not delivered), one CONFIRMED-equivalent PROPOSED work schedule, and a REQUESTED progress draw is NOT possible without completion; instead use a PROPOSED schedule and a draw requested against it is invalid — so we cancel after building MaterialOrder->WorkSchedule(PROPOSED). To reach a REQUESTED draw at the third hop, the window must be COMPLETED; that requires IN_PROGRESS which blocks cancel. Therefore this depth-3 chain is exercised with MaterialOrder CONFIRMED + WorkSchedule PROPOSED + a REQUESTED draw seeded via a separately completed sibling window."
          setup_api_calls:
            - call: "POST /staff/register"
              payload: { email: "est7@x.com", full_name: "Est Seven", role_code: "ESTIMATOR" }
              as: Anonymous
              captures: { est_id: $.data.id }
            - call: "POST /staff/register"
              payload: { email: "pm7@x.com", full_name: "PM Seven", role_code: "PROJECT_MANAGER" }
              as: Anonymous
              captures: { pm_id: $.data.id }
            - call: "POST /clients/register"
              payload: { email: "c7@x.com", full_name: "Client Seven", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", project_manager_id: "${pm_id}", property_address: "7 Hardie Way", hoa_required: false }
