      - name: cascading_side_effects_of_a_low_effectiveness_quarterly_filing
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RecallCampaign.remedy_status
          - state_machines.AffectedVehicle
          - calculations.remedy_effectiveness_score
        excluded_because:
          difficulty_instance: quarterly_filing_low_effectiveness_revises_remedy_and_reverts_remedied_vehicles
          rationale: |
            The deepest cascade in this system -- a quarterly filing recomputing the score, revising the
            remedy, reverting REMEDIED rows for renotification and invalidating the just-frozen filing
            snapshot -- is driven end to end by that difficulty instance. Any corner-case version would
            replay the same chain with the same final counters.

      - name: dual_variant_completion_rate_on_one_population
        claim_type: dual_variant_calculation
        grounds:
          - calculations.completion_rate.variants
          - endpoints.GET_recall_campaigns_id_completion_metrics
        excluded_because:
          difficulty_instance: completion_rate_regulatory_versus_operational_divergence
          rationale: |
            Both completion variants are asserted side by side on a single population there, including
            which one is persisted and gated on. A corner case would have to build the same UNREACHABLE
            plus SCHEDULED mix to make the two numbers differ, so it adds nothing.

      - name: effectiveness_score_exactly_at_the_minimum_does_not_revise_the_remedy
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.remedy_effectiveness_score
          - calculations.remedy_effectiveness_score.constants.REMEDY_EFFECTIVENESS_MIN
          - state_machines.RecallCampaign.remedy_status
        distinguishing_aspect: |
          One of the two remedied vehicles came back for a second approved repair, so repeat_rate is
          0.5000 and the score lands on exactly 100.00 - 60.00 * 0.5000 == 70.00. The revision trigger is
          a STRICT less-than, so the quarterly filing must NOT revise the remedy at the boundary: the
          remedy stays REMEDY_RELEASED, remedy_revision_count stays 0 and no population row is reverted.
        test_recipe:
          setup:
            - "BASE-FILED for 26V-345 (risk_severity LOW) with THREE matched NE build records; the defect notice is filed on time, so late_filing_flag is false."
            - "R345-01 flat 1.10 (2026-08-01..2027-12-31); part P-88345 with 100 units; remedy released 2026-08-03 by u-eng-2."
            - "Dealer D-NE-01 (NE, rate 138.74, capacity 40) holds a 4-unit ALLOCATED allocation."
            - "Row 1 is repaired twice (2026-08-03 and 2026-08-04, both APPROVED) and row 2 once; row 3 is left UNREPAIRED, so remedied == 2, repeat_claims == 1 and recall_population == 3."
            - "A REMEDY wave for NE scheduled 2026-08-04 is released against the one remaining part unit and mailed, taking the campaign to OWNER_NOTIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-345", defect_type: "SAFETY_DEFECT", defect_description: "Inflator may rupture", risk_severity: "LOW" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
