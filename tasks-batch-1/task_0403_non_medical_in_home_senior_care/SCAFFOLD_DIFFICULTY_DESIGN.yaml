# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Non-Medical In-Home Senior Care — Expert tier
# 9 rules x >=2 instances = 18 instances
# Agency constants used by all recipes (created in setup):
#   base_hourly_rate=30.00, live_in_day_rate=250.00, overtime_threshold_hours=40,
#   overtime_multiplier=1.5, mileage_rate=0.70, evv_rounding_minutes=15,
#   travel_buffer_minutes=30
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_labor_provisional_vs_final_overtime
        grounds:
          - calculations.invoice_labor_final
          - calculations.visit_charge_provisional
          - entities.Invoice.fields.labor_total
          - entities.Visit.fields.visit_charge
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          On the Invoice domain, finalize allocates the 6 completed billable hours past the
          40h weekly threshold at base*1.5, so labor_total==1470.00 while the plain sum of the
          six per-Visit visit_charge values is 1380.00 — same hours, two algorithms, +90.00 delta.
        test_recipe:
          setup:
            - "Agency A; ACTIVE caregiver CG (TIER_2); ACTIVE client CL with a PUBLISHED plan; ACTIVE primary match."
            - "Six COMPLETED HOURLY visits Mon–Sat of ISO week 23 (2026-06-01..06): five of 8 billable hours, one of 6 billable hours (46h total)."
            - "A DRAFT invoice covering [2026-06-01, 2026-06-08)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, overtime_threshold_hours: 40, overtime_multiplier: 1.5, mileage_rate: 0.70, evv_rounding_minutes: 15, travel_buffer_minutes: 30 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA", max_weekly_hours: 50 }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_2" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T17:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T09:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v1}/clock-out"
              payload: { event_at: "2026-06-01T17:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T17:00:00Z" }
              as: Scheduler
              captures: { v2: $.data.id }
            - call: "POST /visits/${v2}/clock-in"
              payload: { event_at: "2026-06-02T09:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v2}/clock-out"
              payload: { event_at: "2026-06-02T17:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T17:00:00Z" }
              as: Scheduler
              captures: { v3: $.data.id }
            - call: "POST /visits/${v3}/clock-in"
              payload: { event_at: "2026-06-03T09:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v3}/clock-out"
              payload: { event_at: "2026-06-03T17:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-04T09:00:00Z", scheduled_end: "2026-06-04T17:00:00Z" }
              as: Scheduler
              captures: { v4: $.data.id }
            - call: "POST /visits/${v4}/clock-in"
              payload: { event_at: "2026-06-04T09:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v4}/clock-out"
              payload: { event_at: "2026-06-04T17:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T17:00:00Z" }
              as: Scheduler
              captures: { v5: $.data.id }
            - call: "POST /visits/${v5}/clock-in"
              payload: { event_at: "2026-06-05T09:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v5}/clock-out"
              payload: { event_at: "2026-06-05T17:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-06T09:00:00Z", scheduled_end: "2026-06-06T15:00:00Z" }
              as: Scheduler
              captures: { v6: $.data.id }
            - call: "POST /visits/${v6}/clock-in"
              payload: { event_at: "2026-06-06T09:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v6}/clock-out"
              payload: { event_at: "2026-06-06T15:00:00Z", evv_source: "TELEPHONY" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /invoices"
              payload: { agency_id: "${ag}", caregiver_id: "${cg}", client_id: "${cl}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingClerk
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { labor: $.data.labor_total }
          assert:
            - "Visit.${v1}.visit_charge == 240.00"
            - "Visit.${v6}.visit_charge == 180.00"
            - "(Visit.${v1}.visit_charge + Visit.${v2}.visit_charge + Visit.${v3}.visit_charge + Visit.${v4}.visit_charge + Visit.${v5}.visit_charge + Visit.${v6}.visit_charge) == 1380.00"
            - "Invoice.${inv}.labor_total == 1470.00"
            - "Invoice.${inv}.invoice_total == 1470.00"

      - name: claim_covered_percentage_vs_cap
        grounds:
          - calculations.claim_covered_amount
          - entities.LtcClaim.fields.covered_amount
          - entities.LtcClaim.fields.daily_benefit_max
          - state_machines.LtcClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          On the LtcClaim domain, the same ISSUED invoice (invoice_total 240.00) yields covered_amount
          192.00 when the 80% percentage binds (cap 1800) versus 150.00 when the daily-benefit cap
          (daily_benefit_max 25 * covered_days 6 = 150) binds — two algorithms, different result.
        test_recipe:
          setup:
            - "An ISSUED invoice with invoice_total 240.00 (one COMPLETED 8h HOURLY visit at base 30)."
            - "Two LTC claim assignments distinguished only by daily_benefit_max."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, mileage_rate: 0.70, evv_rounding_minutes: 15 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA" }
              as: AgencyAdmin
              captures: { cg: $.data.id }
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "CLEAR_BACKGROUND", target_tier: "TIER_1" }
              as: AgencyAdmin
            - call: "POST /caregivers/${cg}/transition"
              payload: { action: "ACTIVATE" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { agency_id: "${ag}", full_name: "CL", residence_state_code: "CA" }
              as: AgencyAdmin
              captures: { cl: $.data.id }
            - call: "POST /clients/${cl}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /clients/${cl}/care-plans"
              payload: { title: "Plan" }
              as: Scheduler
              captures: { plan: $.data.id }
            - call: "POST /care-plans/${plan}/transition"
              payload: { action: "PUBLISH" }
              as: Scheduler
            - call: "POST /matches"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", is_primary: true }
              as: Scheduler
              captures: { mt: $.data.id }
            - call: "POST /matches/${mt}/transition"
              payload: { action: "ACTIVATE" }
              as: Scheduler
            - call: "POST /visits"
              payload: { caregiver_id: "${cg}", client_id: "${cl}", care_plan_id: "${plan}", billing_mode: "HOURLY", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T17:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/clock-in"
              payload: { event_at: "2026-06-01T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /visits/${v1}/clock-out"
              payload: { event_at: "2026-06-01T17:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /invoices"
              payload: { agency_id: "${ag}", caregiver_id: "${cg}", client_id: "${cl}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingClerk
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { iv: $.data.version }
            - call: "POST /ltc-claims"
              payload: { client_id: "${cl}", invoice_id: "${inv}", insurer_name: "PctCo", policy_number: "P-PCT", covered_pct: 0.80, daily_benefit_max: 300, covered_days: 6, expected_invoice_version: "${iv}" }
              as: BillingClerk
              captures: { claim_pct: $.data.id }
            - call: "POST /ltc-claims/${claim_pct}/submit"
              payload: {}
              as: BillingClerk
            - call: "GET /invoices/${inv}"
              payload: {}
              as: BillingClerk
              captures: { iv2: $.data.version }
            - call: "POST /ltc-claims"
              payload: { client_id: "${cl}", invoice_id: "${inv}", insurer_name: "CapCo", policy_number: "P-CAP", covered_pct: 0.80, daily_benefit_max: 25, covered_days: 6, expected_invoice_version: "${iv2}" }
              as: BillingClerk
              captures: { claim_cap: $.data.id }
          trigger:
            - call: "POST /ltc-claims/${claim_cap}/submit"
              payload: {}
              as: BillingClerk
              captures: { cap_amt: $.data.covered_amount }
          assert:
            - "Invoice.${inv}.invoice_total == 240.00"
            - "LtcClaim.${claim_pct}.covered_amount == 192.00"
            - "LtcClaim.${claim_cap}.covered_amount == 150.00"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: labor_overtime_nested_min_max_branch
        grounds:
          - calculations.invoice_labor_final
          - entities.Invoice.fields.lines
          - state_machines.Invoice.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (a): labor_total combines >=3 inputs (running_hours, billable_minutes, threshold,
          multiplier) via nested min/max (reg_h=min(h, max(0, 40-running_hours))) AND a conditional
          branch on billing_mode (LIVE_IN bypasses the hourly path) — producing labor_total 1470.00
          with one OVERTIME line of 270.00.
        test_recipe:
          setup:
            - "Reuse the dual_variant invoice fixture: six COMPLETED HOURLY visits (46 billable hours) in one ISO week, one DRAFT invoice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "A", base_hourly_rate: 30.00, live_in_day_rate: 250.00, overtime_threshold_hours: 40, overtime_multiplier: 1.5, evv_rounding_minutes: 15 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /caregivers"
              payload: { agency_id: "${ag}", full_name: "CG", hire_state_code: "CA", max_weekly_hours: 50 }
