            - { call: "GET /stockpiles/${pile}", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { pile_v2: $.data.version } }
          trigger:
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 50.0, reason: "survey credit", expected_stockpile_version: "${pile_v2}" }, as: SiteManager, as_user_id: "sm-1" }
          assert:
            - "SalesOrder.${o1}.status == CONFIRMED (earlier created_at wins the sweep)"
            - "SalesOrder.${o2}.status stays BACKORDERED (strict FIFO stops at the first non-fitting order)"
            - "Stockpile.${pile}: on_hand_tons == 50.0, reserved_tons == 40.0, available_tons == 10.0"

  # ---------------------------------------------------------------------------
  # Section 4: Validations (violation->error, satisfaction->pass, priority,
  # cross-entity, temporal, aggregate, conditional, SoD)
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: posture_restricted_blocks_bench_release
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SITE_POSTURE_BLOCKED]"]
        distinguishing_aspect: "RESTRICTED (bond DEFICIENT) permits drilling work but blocks NEW disturbance: releasing another bench fails with ERR_SITE_POSTURE_BLOCKED."
        test_recipe:
          setup: ["site (permitted 200, rate 12000), NO bond posted; B1 (1400 ft, 5.0 ac) RELEASED -> required 60000 > posted 0 -> RESTRICTED; B2 (1500 ft, 2.0 ac) PLANNED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { b1: $.data.id } }
            - { call: "POST /benches/${b1}/release", payload: {}, as: SiteManager }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B2", elevation_ft: 1500, acreage: 2.0 }, as: SiteManager, captures: { b2: $.data.id } }
          trigger:
            - { call: "POST /benches/${b2}/release", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_SITE_POSTURE_BLOCKED (http 409)"
            - "QuarrySite.${site}.posture == RESTRICTED and Bench.${b2}.status stays PLANNED"

      - name: posture_suspended_blocks_weighin
        claim_type: cross_entity_validation
        grounds: ["validations[priority=6]", "errors[ERR_SITE_POSTURE_BLOCKED]"]
        distinguishing_aspect: "SUSPENDED halts shipping: weigh-in against an otherwise valid order/queue/scale fails with ERR_SITE_POSTURE_BLOCKED while any overdue S&S citation exists."
        test_recipe:
          setup:
            - "full ticketing setup (spec, pile 200, agreement, certified scale, order qty 100 CONFIRMED, entry AT_SCALE_IN)"
            - "overdue S&S citation pushes the site to SUSPENDED before weigh-in"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 200.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 100 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 70000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /msha-inspections", payload: { site_id: "${site}", inspection_type: "SPOT" }, as: SafetyOfficer, as_user_id: "so-1", captures: { insp: $.data.id } }
            - { call: "POST /msha-citations", payload: { msha_inspection_id: "${insp}", citation_code: "56.14100", s_and_s: true, abatement_due_on: "2026-07-15" }, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 80000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_SITE_POSTURE_BLOCKED (http 409)"
            - "no ticket created: GET /scale-tickets?queue_entry_id=${qe} returns 0 items; entry stays AT_SCALE_IN"

      - name: sod_shotplan_approve_same_user_rejected
        claim_type: segregation_of_duties
        grounds: [state_machines.ShotPlan.SUBMITTED_to_APPROVED, "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The approver's X-User-ID must differ from submitted_by_user_id — same person under a different role hat still fails with 403 ERR_SOD_VIOLATION."
        test_recipe:
          setup: ["site OPERATING (bond posted); bench RELEASED; plan SUBMITTED by user bf-1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
          trigger:
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "bf-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_SOD_VIOLATION (http 403): approver user id equals submitted_by_user_id"
            - "ShotPlan.${plan}.status stays SUBMITTED"

      - name: sod_statement_issue_same_user_rejected
        claim_type: segregation_of_duties
        grounds: [state_machines.RoyaltyStatement.DRAFT_to_ISSUED, "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The statement issuer must not be the generator: issuing as the same X-User-ID that generated fails with ERR_SOD_VIOLATION."
        test_recipe:
          setup: ["site; ACTIVE agreement; DRAFT statement generated by user fc-1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /royalty-statements", payload: { site_id: "${site}", period_start: "2026-01-01", period_end: "2026-02-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { stmt: $.data.id } }
          trigger:
            - { call: "POST /royalty-statements/${stmt}/issue", payload: {}, as: SiteManager, as_user_id: "fc-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_SOD_VIOLATION (http 403): issuer == generator"
            - "RoyaltyStatement.${stmt}.status stays DRAFT"

      - name: sod_gradation_confirm_same_user_rejected
        claim_type: segregation_of_duties
        grounds: [state_machines.GradationTest.REPORTED_to_CONFIRMED, "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The confirmer must not be the reporter (same X-User-ID), independent of both holding QCTechnician."
        test_recipe:
          setup: ["site; spec; stockpile; REPORTED test by qc-1"]
          setup_api_calls:
