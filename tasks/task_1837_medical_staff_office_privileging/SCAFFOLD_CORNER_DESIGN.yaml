        claim_type: correct_result
        grounds: ['calculations.fppe_composite_score']
        distinguishing_aspect: "CLINICAL_QUALITY raw 25.0 normalizes to 100 - 125 = -25, clamped to 0.00 AFTER rounding; a single-metric review (weight 1.0) yields composite 0.00 and outcome UNSATISFACTORY."
        test_recipe:
          setup: ["Member CL1 ACTIVE with grant; OPPE review with one CLINICAL_QUALITY metric raw 25.0 weight 1.0; advanced to PROVISIONAL_RESULT"]
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
