            - call: "POST /sites"
              payload: { banner_id: "${bs_id}", site_number: "P-001", site_type: "PARTNER_STATION", partner_code: "PTR-001", per_gallon_cap_cents: 30, max_gallons_per_redemption: 250 }
              as: ProgramAdmin
