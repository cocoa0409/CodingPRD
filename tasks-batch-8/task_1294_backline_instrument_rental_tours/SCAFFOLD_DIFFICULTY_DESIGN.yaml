            - "ReservationLine.${kr1}.status == RETURNED (hop 2, caused by hop 1)"
            - "GearUnit.${ku}.status == MAINTENANCE (hop 3: projected 25+5 = 30 >= 30 trips gate)"
            - "A MaintenanceTicket for ${ku} exists with opened_reason == SCHEDULED_CYCLE (hop 4 output)"

      - name: vendor_suspend_cascade_depth2
        grounds:
          - state_machines.PartnerVendor.APPROVED_to_SUSPENDED
          - state_machines.CrossRentalRequest.REQUESTED_to_CANCELLED
          - state_machines.CrossRentalRequest.ACCEPTED_to_CANCELLED
