  - rule_id: cross_entity_state_dependency
    instances:
      - name: lot_sale_blocked_until_title_record_reaches_cleared
        grounds:
          - state_machines.AuctionLot.LISTED_to_SOLD
          - state_machines.TitleRecord.REJECTED_to_SUBMITTED
          - validations[priority=14]
          - errors[ERR_TITLE_NOT_CLEARED]
        distinguishing_aspect: |
          Entity pair AuctionLot -> TitleRecord: the lot's LISTED -> SOLD transition is gated on
          a sibling TitleRecord's state, so the identical record-sale call fails while the title
          is REJECTED and succeeds once the title reaches CLEARED.
        test_recipe:
          setup:
            - "donation dx is IN_CUSTODY with a LISTED lot lx (reserve 10000)"
            - "title tx is REJECTED once (rejection_count 1)"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Wheels For Hope", ein: "92-4444444", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "cross1@example.com", full_name: "Cro Ss", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Bay Auto Auction", venue_type: "AUCTION", state_code: "CA" }
              as: ProgramAdmin
              captures: { ve1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { dx: $.data.id }
            - call: "POST /api/donations/${dx}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${dx}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${dx}", title_number: "CA-TTL-X", owner_name: "Cro Ss" }
              as: TitleClerk
              captures: { tx: $.data.id }
            - call: "POST /api/title-records/${tx}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${tx}/dmv-decision"
              payload: { outcome: "REJECTED", rejection_reason: "owner name mismatch" }
              as: TitleClerk
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${dx}", venue_id: "${ve1}", lot_number: "L-X", reserve_price_cents: 10000 }
              as: AuctionManager
              captures: { lx: $.data.id }
            - call: "GET /api/donations/${dx}"
              as: AuctionManager
              captures: { dx_v: $.data.version }
          trigger:
            - call: "POST /api/auction-lots/${lx}/record-sale"
              payload: { sale_price_cents: 60000, expected_donation_version: "${dx_v}" }
              as: AuctionManager
              captures: { err: $.data.error_id }
            - call: "POST /api/title-records/${tx}/resubmit"
              payload: { owner_name: "Cro Ss" }
              as: TitleClerk
            - call: "POST /api/title-records/${tx}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/auction-lots/${lx}/record-sale"
              payload: { sale_price_cents: 60000, expected_donation_version: "${dx_v}" }
              as: AuctionManager
          assert:
            - "the first record-sale returns HTTP 409 with error_id ERR_TITLE_NOT_CLEARED"
            - "after the first record-sale, AuctionLot.${lx}.status == LISTED and Donation.${dx}.status == IN_CUSTODY and Donation.${dx}.version is unchanged"
            - "after the DMV clearance, TitleRecord.${tx}.state == CLEARED and rejection_count == 1"
            - "the second record-sale returns HTTP 200 and AuctionLot.${lx}.status == SOLD"
            - "Donation.${dx}.gross_proceeds_cents == 60000 and net_to_charity_cents == 48500"
            - "CharityAffiliate.${c1}.pledged_balance_cents == 48500"

