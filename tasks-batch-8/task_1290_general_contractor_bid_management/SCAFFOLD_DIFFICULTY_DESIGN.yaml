            - "Interview B (10:30-11:30, ROOM-1): HTTP 409, error_id == ERR_INTERVIEW_ROOM_OVERLAP (half-open intersection [10:30,11:00) non-empty)"
            - "Interview C (11:00-12:00, ROOM-1): HTTP 201 (adjacency allowed: A.end == C.start, half-open intervals do not overlap)"

      - name: prequal_validity_window_containment
        grounds:
          - validations[priority=7]
          - errors[ERR_PREQUAL_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource: containment of
          'now' within a subcontractor's single open validity window
          [approved_at, approved_at+365d) — a new application is rejected
          while the window contains now, and accepted once the window has
          closed (lazy expiry), rather than pairwise half-open overlap on a
          shared room.
        test_recipe:
          setup:
            - "Sub approved at 2026-08-02T00:00:00Z; window [2026-08-02, 2027-08-02)"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Window LLC", contact_email: "w@x.com", license_number: "LIC-W-1002" }
