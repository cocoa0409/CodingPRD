scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: hull_settlement_agreed_value_vs_depreciated_value_basis
        grounds:
          - calculations.hull_settlement_amount
          - calculations.depreciated_hull_value
          - entities.Claim.fields.settlement_basis
          - entities.Claim.fields.deductible_applied_cents
          - state_machines.Claim.adjustment_status.RESERVED_to_SETTLED
          - validations[priority=37]
        distinguishing_aspect: |
          The variant lives on the Claim/Aircraft money domain: two identically specified total losses
          on the same policy settle for 44325000 cents on the AGREED_VALUE basis and 39006000 cents on
          the DEPRECIATED_VALUE basis, and because the percentage deductible is taken on the gross
          basis value it also diverges (675000 vs 594000).
        test_recipe:
          setup:
            - "Clock parked at 2026-08-15T00:00:00Z, then advanced to 2026-11-01T00:00:00Z before the losses are notified."
            - "One FLIGHT_SCHOOL operator, two identically specified 2016 airframes with hull_new_value_cents 66000000 (depreciated value 39600000 in 2026), one CPL pilot."
            - "One BOUND FLEET policy, WORLDWIDE, base_hull_rate_ppm 18000, hull_deductible_ppm 15000, hull_aggregate_limit_cents 900000000."
            - "Two INSTRUCTIONAL schedules, each agreed_value_cents 45000000, one with warranty_status COMPLIANT and one with warranty_status WAIVED after a recorded breach."
            - "Two HULL_DAMAGE claims with loss_date 2026-10-15, each with a 40000000-cent repair assessment (ctl_ratio_ppm 888888, so ctl_flag true), each RESERVED and each with salvage TENDERED."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N511NW", aircraft_class: "MULTI_PISTON", manufacture_year: 2016, hull_new_value_cents: 66000000, seat_count: 6, max_takeoff_weight_kg: 2495 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac_a_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N516NW", aircraft_class: "MULTI_PISTON", manufacture_year: 2016, hull_new_value_cents: 66000000, seat_count: 6, max_takeoff_weight_kg: 2495 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac_b_id: $.data.id }
            - call: "POST /aviation/pilots"
              payload: { pilot_name: "Dana Reyes", license_type: "CPL", total_logged_hours: 1200, hours_on_type: 80, last_training_completed_at: "2026-06-01T00:00:00Z", medical_expires_at: "2027-06-30T00:00:00Z", instrument_rated: false }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { p1_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000, permitted_use_classes: ["PRIVATE", "BUSINESS", "INSTRUCTIONAL"], automatic_acquisition_enabled: false, acquisition_reporting_days: 30, war_risk_required: false }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac_a_id}", named_pilot_id: "${p1_id}", use_class: "INSTRUCTIONAL", agreed_value_cents: 45000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", acquisition_source: "SCHEDULED" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { sa_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac_b_id}", named_pilot_id: "${p1_id}", use_class: "INSTRUCTIONAL", agreed_value_cents: 45000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", acquisition_source: "SCHEDULED" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { sb_id: $.data.id }
            - call: "POST /aviation/policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/schedules/${sa_id}/warranty-findings"
              payload: { finding: "EVIDENCE_VERIFIED" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/schedules/${sb_id}/warranty-findings"
              payload: { finding: "BREACH", breach_reason: "Logbook audit could not evidence the warranted 50 hours on type" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/schedules/${sb_id}/warranty-findings"
              payload: { finding: "WAIVER" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/claims"
              payload: { policy_id: "${pol_id}", schedule_id: "${sa_id}", loss_date: "2026-10-15T00:00:00Z", loss_type: "HULL_DAMAGE", loss_description: "Gear collapse on landing, airframe substantially damaged" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { claim_a_id: $.data.id }
            - call: "POST /aviation/claims"
              payload: { policy_id: "${pol_id}", schedule_id: "${sb_id}", loss_date: "2026-10-15T00:00:00Z", loss_type: "HULL_DAMAGE", loss_description: "Gear collapse on landing, airframe substantially damaged" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { claim_b_id: $.data.id }
            - call: "POST /aviation/claims/${claim_a_id}/investigations"
              payload: { cooperation_status: "COOPERATING", investigator_reference: "AAIB-2026-1041" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /aviation/claims/${claim_b_id}/investigations"
              payload: { cooperation_status: "COOPERATING", investigator_reference: "AAIB-2026-1042" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /aviation/damage-assessments"
              payload: { claim_id: "${claim_a_id}", repair_cost_estimate_cents: 40000000, assessor_reference: "SURV-A-1", assessed_at: "2026-10-20T00:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /aviation/damage-assessments"
              payload: { claim_id: "${claim_b_id}", repair_cost_estimate_cents: 40000000, assessor_reference: "SURV-B-1", assessed_at: "2026-10-20T00:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /aviation/claims/${claim_a_id}/coverage-decision"
              payload: { decision: "COVERED", reserve_cents: 45000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /aviation/claims/${claim_b_id}/coverage-decision"
              payload: { decision: "COVERED", reserve_cents: 45000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /aviation/claims/${claim_a_id}/salvage-disposition"
              payload: { salvage_action: "TENDER" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /aviation/claims/${claim_b_id}/salvage-disposition"
              payload: { salvage_action: "TENDER" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /aviation/claims/${claim_a_id}/settlement"
              payload: { settlement_basis: "AGREED_VALUE" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
            - call: "POST /aviation/claims/${claim_b_id}/settlement"
              payload: { settlement_basis: "DEPRECIATED_VALUE" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
          assert:
            - "Claim.${claim_a_id}.settlement_amount_cents == 44325000"
            - "Claim.${claim_a_id}.deductible_applied_cents == 675000"
            - "Claim.${claim_b_id}.settlement_amount_cents == 39006000"
            - "Claim.${claim_b_id}.deductible_applied_cents == 594000"
            - "Claim.${claim_a_id}.settlement_amount_cents - Claim.${claim_b_id}.settlement_amount_cents == 5319000"
            - "Claim.${claim_a_id}.adjustment_status == SETTLED and Claim.${claim_b_id}.adjustment_status == SETTLED"
            - "AircraftSchedule.${sa_id}.coverage_status == TOTAL_LOSS_SETTLED and AircraftSchedule.${sb_id}.coverage_status == TOTAL_LOSS_SETTLED"
            - "GET /aviation/premium-transactions?policy_id=${pol_id}&txn_type=SETTLEMENT_RETURN returns exactly 2 rows, each with amount_cents == -1558279"
            - "Policy.${pol_id}.paid_hull_cents == 83331000"
      - name: pilot_qualification_logged_hours_vs_verified_hours
        grounds:
          - calculations.pilot_qualification_score
          - calculations.rerate_adjustment_delta
          - entities.Pilot.fields.qualification_score_verified
          - entities.AircraftSchedule.fields.warranty_basis
          - state_machines.AircraftSchedule.warranty_status.PENDING_EVIDENCE_to_COMPLIANT
        distinguishing_aspect: |
          The variant lives on the Pilot/underwriting-score domain rather than on money: the same pilot
          scores 490 points (BAND_C) on broker-declared hours and 332 points (BAND_D) on audited hours,
          which re-rates the unchanged schedule from 39375 ppm to 50400 ppm.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-15T00:00:00Z."
            - "One FLIGHT_SCHOOL operator, one 2016 airframe with hull_new_value_cents 66000000, one CPL pilot declaring 1200 total hours and 80 hours on type, no instrument rating, last training 2026-06-01."
            - "One BOUND FLEET policy, WORLDWIDE, base_hull_rate_ppm 18000; one INSTRUCTIONAL schedule with agreed_value_cents 45000000 priced on the logged basis."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N511NW", aircraft_class: "MULTI_PISTON", manufacture_year: 2016, hull_new_value_cents: 66000000, seat_count: 6, max_takeoff_weight_kg: 2495 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac_a_id: $.data.id }
            - call: "POST /aviation/pilots"
              payload: { pilot_name: "Dana Reyes", license_type: "CPL", total_logged_hours: 1200, hours_on_type: 80, last_training_completed_at: "2026-06-01T00:00:00Z", medical_expires_at: "2027-06-30T00:00:00Z", instrument_rated: false }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { p1_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000, permitted_use_classes: ["PRIVATE", "BUSINESS", "INSTRUCTIONAL"], automatic_acquisition_enabled: false, acquisition_reporting_days: 30, war_risk_required: false }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac_a_id}", named_pilot_id: "${p1_id}", use_class: "INSTRUCTIONAL", agreed_value_cents: 45000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", acquisition_source: "SCHEDULED" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { s1_id: $.data.id }
            - call: "POST /aviation/policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-1"
          trigger:
            - call: "POST /aviation/pilots/${p1_id}/hours-verifications"
              payload: { verified_total_hours: 600, verified_hours_on_type: 50 }
              as: Underwriter
              as_user_id: "uw-1"
          assert:
            - "Pilot.${p1_id}.qualification_score_logged == 490 and Pilot.${p1_id}.rating_band_logged == BAND_C"
            - "Pilot.${p1_id}.qualification_score_verified == 332 and Pilot.${p1_id}.rating_band_verified == BAND_D"
            - "AircraftSchedule.${s1_id}.warranty_basis == VERIFIED_HOURS"
            - "AircraftSchedule.${s1_id}.rate_ppm == 50400"
            - "AircraftSchedule.${s1_id}.hull_premium_cents == 2268000"
            - "AircraftSchedule.${s1_id}.warranty_status == COMPLIANT and AircraftSchedule.${s1_id}.coverage_status == ACTIVE"
            - "GET /aviation/premium-transactions?policy_id=${pol_id}&txn_type=RERATE_ADJUSTMENT returns exactly 1 row with amount_cents == 496125"
            - "Policy.${pol_id}.written_premium_cents == 2268000"
  - rule_id: combinatorial_formula
    instances:
      - name: four_factor_rate_chain_with_fleet_size_credit_branch
        grounds:
          - calculations.hull_rate_ppm
          - calculations.annual_hull_premium
          - entities.AircraftSchedule.fields.rate_ppm
          - entities.Policy.fields.live_schedule_count
          - entities.Policy.fields.total_hull_sum_insured_cents
        distinguishing_aspect: |
          Mode (a) of the pricing engine: a four-stage multiplicative chain (base rate x use-class
          factor x territory factor x pilot-band factor, floored after every stage, then clamped to
          [8000, 60000] ppm) whose result is then passed through a fleet-size conditional, so the fifth
          identical hull on the policy prices at 577125 cents while the fourth prices at 607500.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-15T00:00:00Z."
            - "One FLIGHT_SCHOOL operator; five airframes; one CPL pilot scoring 490 (BAND_C) and one ATPL pilot scoring 1000 (BAND_A)."
            - "One DRAFT FLEET policy, WORLDWIDE, base_hull_rate_ppm 18000, permitted use classes PRIVATE/BUSINESS/INSTRUCTIONAL, hull_aggregate_limit_cents 900000000."
            - "Four schedules already attached: one INSTRUCTIONAL at agreed 45000000 on the BAND_C pilot, three PRIVATE at agreed 30000000 on the BAND_A pilot. live_schedule_count is 4, one short of the credit threshold."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N511NW", aircraft_class: "MULTI_PISTON", manufacture_year: 2016, hull_new_value_cents: 66000000, seat_count: 6, max_takeoff_weight_kg: 2495 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac1_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N512NW", aircraft_class: "SINGLE_PISTON", manufacture_year: 2020, hull_new_value_cents: 40000000, seat_count: 4, max_takeoff_weight_kg: 1300 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac2_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N513NW", aircraft_class: "SINGLE_PISTON", manufacture_year: 2020, hull_new_value_cents: 40000000, seat_count: 4, max_takeoff_weight_kg: 1300 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac3_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N514NW", aircraft_class: "SINGLE_PISTON", manufacture_year: 2020, hull_new_value_cents: 40000000, seat_count: 4, max_takeoff_weight_kg: 1300 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac4_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N515NW", aircraft_class: "SINGLE_PISTON", manufacture_year: 2020, hull_new_value_cents: 40000000, seat_count: 4, max_takeoff_weight_kg: 1300 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac5_id: $.data.id }
            - call: "POST /aviation/pilots"
              payload: { pilot_name: "Dana Reyes", license_type: "CPL", total_logged_hours: 1200, hours_on_type: 80, last_training_completed_at: "2026-06-01T00:00:00Z", medical_expires_at: "2027-06-30T00:00:00Z", instrument_rated: false }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { p1_id: $.data.id }
            - call: "POST /aviation/pilots"
              payload: { pilot_name: "Morgan Vale", license_type: "ATPL", total_logged_hours: 3000, hours_on_type: 300, last_training_completed_at: "2026-07-01T00:00:00Z", medical_expires_at: "2028-01-31T00:00:00Z", instrument_rated: true }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { p2_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000, permitted_use_classes: ["PRIVATE", "BUSINESS", "INSTRUCTIONAL"], automatic_acquisition_enabled: false, acquisition_reporting_days: 30, war_risk_required: false }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac1_id}", named_pilot_id: "${p1_id}", use_class: "INSTRUCTIONAL", agreed_value_cents: 45000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", acquisition_source: "SCHEDULED" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { s1_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac2_id}", named_pilot_id: "${p2_id}", use_class: "PRIVATE", agreed_value_cents: 30000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", acquisition_source: "SCHEDULED" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { s2_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac3_id}", named_pilot_id: "${p2_id}", use_class: "PRIVATE", agreed_value_cents: 30000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", acquisition_source: "SCHEDULED" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { s3_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac4_id}", named_pilot_id: "${p2_id}", use_class: "PRIVATE", agreed_value_cents: 30000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", acquisition_source: "SCHEDULED" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { s4_id: $.data.id }
          trigger:
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac5_id}", named_pilot_id: "${p2_id}", use_class: "PRIVATE", agreed_value_cents: 30000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", acquisition_source: "SCHEDULED" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { s5_id: $.data.id }
          assert:
            - "AircraftSchedule.${s1_id}.rate_ppm == 39375 and AircraftSchedule.${s1_id}.hull_premium_cents == 1771875"
            - "AircraftSchedule.${s2_id}.rate_ppm == 20250 and AircraftSchedule.${s2_id}.hull_premium_cents == 607500"
            - "AircraftSchedule.${s4_id}.hull_premium_cents == 607500"
            - "AircraftSchedule.${s5_id}.rate_ppm == 20250 and AircraftSchedule.${s5_id}.hull_premium_cents == 577125"
            - "AircraftSchedule.${s5_id}.hull_premium_cents == AircraftSchedule.${s4_id}.hull_premium_cents - 30375"
            - "Policy.${pol_id}.live_schedule_count == 5"
            - "Policy.${pol_id}.total_hull_sum_insured_cents == 165000000"
      - name: fleet_declaration_round_per_line_then_sum
        grounds:
          - calculations.fleet_declaration_premium
          - entities.FleetDeclaration.fields.declared_premium_cents
          - entities.FleetDeclaration.fields.reported_schedule_ids
          - entities.AircraftSchedule.fields.acquisition_source
          - validations[priority=34]
        distinguishing_aspect: |
          Mode (b) of the pricing engine: an order-sensitive aggregation whose rounding order is the
          whole point — ceiling each of the three pro-rata lines to 727799 + 1004403 + 679869 gives
          declared_premium_cents 2412071, whereas summing the exact rationals and ceiling once gives
          2412069, so the two orders are two cents apart on identical inputs.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-15T00:00:00Z for setup, then moved to 2026-10-15T00:00:00Z (inside the 30-day reporting window) before the declaration."
            - "One BOUND FLEET policy with automatic_acquisition_enabled true and acquisition_reporting_days 30, term 2026-09-01 to 2027-09-01 (365 days), base_hull_rate_ppm 18000, WORLDWIDE."
            - "One SCHEDULED INSTRUCTIONAL hull already bound, plus three AUTOMATIC_ACQUISITION BUSINESS hulls on the BAND_A pilot with agreed values 32500000 / 45500000 / 31250000 attaching on 2026-09-15 / 2026-09-20 / 2026-09-25, all still PENDING and unreported."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
