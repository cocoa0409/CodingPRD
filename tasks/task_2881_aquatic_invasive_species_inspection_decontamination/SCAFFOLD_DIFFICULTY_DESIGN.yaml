            - "control on the status filter: DeconOrder ${do_b} sitting in ORDERED with treatment_started_at null consumes no capacity - order A's treatment at 2026-08-05T09:00:00Z was accepted while ${do_b} already existed"

  - rule_id: compensating_invariant
    instances:
      - name: seal_inventory_conserved_across_issuance_and_breach_void
        grounds:
          - invariants.seal_inventory_conservation
          - state_machines.QuarantineOrder.SEALED_to_VOIDED_BREACH
          - entities.InspectionStation.fields.seal_stock_count
          - entities.InspectionStation.fields.seals_in_circulation_count
          - entities.InspectionStation.fields.seals_retired_count
        distinguishing_aspect: |
          Conserved quantity: the station's physical seal count. The forward action
          moves one seal from stock to circulation (3 = 2 + 1 + 0) and the
          compensating action moves that same seal from circulation to retired
          (3 = 2 + 0 + 1). The total never changes and the seal is never returned
          to stock, so an implementation that "refunds" the seal to
          seal_stock_count still sums to 3 but breaks the per-bucket assertions,
          while one that only debits circulation without crediting retired breaks
          the sum.
        test_recipe:
          setup:
            - "Station 'Bighorn Access' with seal_stock_initial_count 3, moved PLANNED -> OPEN so seal_stock_count initialises to 3 with the other two counters at 0."
            - "WaterBody 'Bighorn' risk_tier HIGH, infestation_status SUSPECT; Inspector 'Ada Field' ACTIVE LEVEL_1."
            - "InspectionRecord screened at 80 (EXTREME) and dispositioned DECON, then sealed under a QuarantineOrder with seal MT-SEAL-0500, so the counters read 2 / 1 / 0."
            - "Logical clock at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Bighorn Lake", state_code: "MT", water_body_class: "RESERVOIR", risk_tier: "HIGH", infestation_status: "SUSPECT" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
