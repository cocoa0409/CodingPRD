scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Client.fields.status
          - endpoints
        distinguishing_aspect: "POST /clients with email/full_name/state_code -> 201; status=PENDING_INTAKE, financial_aid_tier=NONE, wallet_credit_cents=0, risk_flag=NONE applied by system."
        test_recipe:
          setup:
            - "Empty DB; logical clock at default 2026-05-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { email: "c1@x.com", full_name: "C One", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Client.${c_id}.status == PENDING_INTAKE"
            - "Client.${c_id}.financial_aid_tier == NONE"
            - "Client.${c_id}.wallet_credit_cents == 0"
            - "Client.${c_id}.risk_flag == NONE"
      - name: get_client_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /clients/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicalAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"
      - name: create_client_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Client.fields.state_code
        distinguishing_aspect: "POST /clients omitting state_code -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: Client
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
      - name: create_client_bad_enum_state_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Client.fields.state_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /clients with state_code 'ZZ' (not in {CA,NY,TX,FL,WA,IL}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { email: "c3@x.com", full_name: "C Three", state_code: "ZZ" }
              as: Client
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
      - name: subscription_default_base_fee_applied
        claim_type: Defaults
        grounds:
          - entities.Subscription.fields.base_weekly_fee_cents
          - entities.Subscription.fields.weekly_credit_grant
        distinguishing_aspect: "POST /subscriptions omitting base_weekly_fee_cents/weekly_credit_grant -> defaults base_weekly_fee_cents=9900, weekly_credit_grant=1 applied; status=TRIALING."
        test_recipe:
          setup:
            - "Client registered and intake submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "c4@x.com", full_name: "C Four", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "Subscription.${sub_id}.base_weekly_fee_cents == 9900"
            - "Subscription.${sub_id}.weekly_credit_grant == 1"
            - "Subscription.${sub_id}.status == TRIALING"
      - name: system_fields_generated_id_ignored_on_input
        claim_type: System Fields
        grounds:
          - entities.Client.fields.status
        distinguishing_aspect: "id/created_at/version are system-minted; status cannot be set by input (always PENDING_INTAKE on create regardless of any client-supplied value)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { email: "c5@x.com", full_name: "C Five", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id, c_v: $.data.version }
          assert:
            - "Client.${c_id}.version == 1"
            - "Client.${c_id}.status == PENDING_INTAKE"
      - name: referenced_fk_not_found_on_subscription_create
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_REFERENCED_NOT_FOUND]
          - entities.Subscription.fields.client_id
        distinguishing_aspect: "POST /subscriptions with a body client_id that does not exist -> ERR_REFERENCED_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /subscriptions"
              payload: { client_id: "00000000-0000-4000-8000-000000000000" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_REFERENCED_NOT_FOUND"
      - name: list_clients_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /clients returns a paginated array envelope with total_count and has_more; default limit 10."
        test_recipe:
          setup:
            - "Two clients registered."
          setup_api_calls:
            - call: "POST /clients"
              payload: { email: "c6@x.com", full_name: "C Six", state_code: "CA" }
              as: Client
            - call: "POST /clients"
              payload: { email: "c7@x.com", full_name: "C Seven", state_code: "NY" }
              as: Client
          trigger:
            - call: "GET /clients"
              payload: {}
              as: ClinicalAdmin
          assert:
            - "response.status == 200"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == false"
      - name: computed_fields_excluded_section_match_score
        claim_type: Computed Fields
        grounds:
          - entities.Match.fields.match_score
        excluded_because:
          difficulty_instance: combinatorial_formula / match_score_three_input_nonlinear_mode_a
          rationale: "Match.match_score computed correctness is asserted as the literal 55 in the named §1.8 instance."

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: complete_session_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LiveSession.SCHEDULED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A LiveSession already COMPLETED rejects a second /complete with ERR_INVALID_STATE; no further credit mutation."
        test_recipe:
          setup:
            - "Client in CA with an ACTIVE match and one credit; one session scheduled and completed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "c8@x.com", full_name: "C Eight", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /therapists"
              payload: { full_name: "T Eight2", specialties: ["ANXIETY"] }
              as: ClinicalAdmin
              captures: { t_id: $.data.id }
            - call: "POST /therapists/${t_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${t_id}/activate"
              payload: {}
              as: ClinicalAdmin
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${t_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { m_v: $.data.version }
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: BillingAdmin
            - call: "POST /matches/${m_id}/live-sessions"
              payload: { starts_at: "2026-06-02T10:00:00Z", ends_at: "2026-06-02T11:00:00Z", expected_match_version: "${m_v}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { ls_id: $.data.id }
            - call: "POST /live-sessions/${ls_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /live-sessions/${ls_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: terminal_state_lockdown_void_superbill_cannot_issue
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Superbill.ISSUED_to_VOID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A VOID superbill is terminal; /issue on it rejects with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Client with a COMPLETED session in window; superbill drafted, issued, then voided."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "c9@x.com", full_name: "C Nine", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /therapists"
              payload: { full_name: "T Nine2", specialties: ["ANXIETY"] }
              as: ClinicalAdmin
              captures: { t_id: $.data.id }
            - call: "POST /therapists/${t_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${t_id}/activate"
              payload: {}
              as: ClinicalAdmin
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${t_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { m_v: $.data.version }
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: BillingAdmin
            - call: "POST /matches/${m_id}/live-sessions"
              payload: { starts_at: "2026-06-02T10:00:00Z", ends_at: "2026-06-02T11:00:00Z", expected_match_version: "${m_v}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { ls_id: $.data.id }
            - call: "POST /live-sessions/${ls_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clients/${c_id}/superbills"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingAdmin
              captures: { sb_id: $.data.id }
            - call: "POST /superbills/${sb_id}/issue"
              payload: {}
              as: BillingAdmin
            - call: "POST /superbills/${sb_id}/void"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /superbills/${sb_id}/issue"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: initial_state_match_starts_proposed
        claim_type: Initial State
        grounds:
          - state_machines.Match.PROPOSED_to_ACTIVE
          - entities.Match.fields.status
        distinguishing_aspect: "A newly created Match starts in PROPOSED with no side effects (thread not yet created)."
        test_recipe:
          setup:
            - "AWAITING_MATCH client and an ACCEPTING licensed therapist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /clients"
              payload: { email: "c10@x.com", full_name: "C Ten", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /therapists"
              payload: { full_name: "T Ten2", specialties: ["ANXIETY"] }
              as: ClinicalAdmin
              captures: { t_id: $.data.id }
            - call: "POST /therapists/${t_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${t_id}/activate"
              payload: {}
              as: ClinicalAdmin
          trigger:
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${t_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
          assert:
            - "Match.${m_id}.status == PROPOSED"
            - "Match.${m_id}.version == 1"
      - name: bubble_up_therapist_full_at_caseload_cap
        claim_type: Bubble up
        grounds:
          - state_machines.Therapist.ACCEPTING_to_FULL
          - entities.Therapist.fields.active_caseload
        distinguishing_aspect: "Accepting a match that brings active_caseload to max_active_caseload bubbles Therapist ACCEPTING -> FULL."
        test_recipe:
          setup:
            - "Therapist max_active_caseload 1, ACCEPTING; one CA client with a PROPOSED match."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists"
              payload: { full_name: "T Cap2", specialties: ["ANXIETY"], max_active_caseload: 1 }
              as: ClinicalAdmin
              captures: { t_id: $.data.id }
            - call: "POST /therapists/${t_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${t_id}/activate"
              payload: {}
              as: ClinicalAdmin
            - call: "POST /clients"
              payload: { email: "c11@x.com", full_name: "C Eleven", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${t_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /matches/${m_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
          assert:
            - "Therapist.${t_id}.status == FULL"
            - "Therapist.${t_id}.active_caseload == 1"
      - name: cascade_down_close_excluded
        claim_type: Cascade down
        grounds:
          - state_machines.Client.ACTIVE_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / finalize_cancel_subscription_client_match_caseload_depth4
          rationale: "Client CLOSED cascade ending matches and decrementing caseload is the asserted end-state of the named §1.8 cascade instance."
      - name: idempotency_acknowledge_twice_excluded
        claim_type: Idempotency
        grounds:
          - state_machines.CrisisEscalation.OPEN_to_ACKNOWLEDGED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_safety_accept_acute_already_active
          rationale: "Re-trigger-on-terminal-from-state (invalid second transition) is exercised by the already-ACTIVE re-accept §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: pause_refund_same_day_full_refund
        claim_type: Correct Result
        grounds:
          - calculations.pause_proration_refund
          - entities.Client.fields.wallet_credit_cents
        distinguishing_aspect: "Same-day pause (elapsed_days 0) refunds the full paid 9900 to wallet (remaining_days=7 -> 9900*7/7)."
        test_recipe:
          setup:
            - "Client in CA, subscription base 9900 charged at period_start 2026-06-01; pause on the same day."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "c12@x.com", full_name: "C Twelve", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}", base_weekly_fee_cents: 9900 }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: { resume_on: "2026-07-01T00:00:00Z", expected_subscription_version: "${sub_v}" }
              as: Client
              as_user_id: "${c_id}"
          assert:
            - "Client.${c_id}.wallet_credit_cents == 9900"
      - name: tier3_discount_full_applied
        claim_type: Constants Applied
        grounds:
          - calculations.cycle_billing_amount
          - entities.BillingCycle.fields.list_amount_cents
        distinguishing_aspect: "TIER_3 discount 0.60 on base 9900 -> list_amount 3960 (round_half_up(9900*0.40)); wallet 0 -> charged 3960."
        test_recipe:
          setup:
            - "Client in CA, TIER_3 aid approved (adjusted_income 2,000,000 < 2,500,000), subscription base 9900."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "c13@x.com", full_name: "C Thirteen", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/financial-aid-applications"
              payload: { annual_income_cents: 2000000, household_size: 1 }
              as: Client
              as_user_id: "${c_id}"
              captures: { faa_id: $.data.id }
            - call: "POST /financial-aid-applications/${faa_id}/approve"
              payload: {}
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}", base_weekly_fee_cents: 9900 }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
              captures: { bc_id: $.data.id }
          assert:
            - "BillingCycle.${bc_id}.list_amount_cents == 3960"
            - "BillingCycle.${bc_id}.charged_amount_cents == 3960"
      - name: aid_no_tier_above_top_ceiling
        claim_type: Input Set Filtering
        grounds:
          - calculations.financial_aid_tier_banding
          - entities.FinancialAidApplication.fields.awarded_tier
        distinguishing_aspect: "adjusted_income 6,000,000 (== TIER_1 ceiling, not < it) bands to NONE; Client.financial_aid_tier stays NONE so no discount."
        test_recipe:
          setup:
            - "Client in CA, aid application income 6,000,000 household 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "c14@x.com", full_name: "C Fourteen", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/financial-aid-applications"
              payload: { annual_income_cents: 6000000, household_size: 1 }
              as: Client
              as_user_id: "${c_id}"
              captures: { faa_id: $.data.id }
          trigger:
            - call: "POST /financial-aid-applications/${faa_id}/approve"
              payload: {}
              as: BillingAdmin
          assert:
            - "FinancialAidApplication.${faa_id}.awarded_tier == NONE"
            - "Client.${c_id}.financial_aid_tier == NONE"
      - name: superbill_aggregation_excluded
        claim_type: Variant Divergence
        grounds:
          - calculations.superbill_reimbursable_amount
        excluded_because:
          difficulty_instance: dual_variant_calc / superbill_service_value_basis_on_superbill
          rationale: "Superbill list-value-vs-cash divergence and aggregation correctness are asserted in the named §1.8 instance."

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_subscription_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
