            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "GET /transload/tracks/${trk}", payload: {}, as: YardMaster, captures: { occ1: $.data.occupied_spots, res1: $.data.reserved_spots } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "GET /transload/tracks/${trk}", payload: {}, as: YardMaster, captures: { occ2: $.data.occupied_spots, res2: $.data.reserved_spots } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "GET /transload/tracks/${trk}", payload: {}, as: YardMaster, captures: { occ3: $.data.occupied_spots, res3: $.data.reserved_spots } }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 40.0 }, as: TransferOperator, captures: { to: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${to}/weight-tickets", payload: { truck_reference: "TRK-1", gross_weight_tons: 39.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wt: $.data.id } }
            - { call: "POST /transload/weight-tickets/${wt}/certify", payload: {}, as: TransferOperator }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: TransferOperator, captures: { rem_mid: $.data.quantity_remaining_tons } }
            - { call: "GET /transload/lots/${lot}", payload: {}, as: TransferOperator, captures: { hand_mid: $.data.quantity_on_hand_tons, ship_mid: $.data.quantity_shipped_tons } }
            - { call: "POST /transload/transfer-orders/${to}/weight-tickets", payload: { truck_reference: "TRK-2", gross_weight_tons: 29.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wt2: $.data.id } }
            - { call: "POST /transload/weight-tickets/${wt2}/certify", payload: {}, as: TransferOperator }
            - { call: "POST /transload/railcars/${car}/release", payload: {}, as: YardMaster }
            - { call: "GET /transload/tracks/${trk}", payload: {}, as: YardMaster, captures: { occ4: $.data.occupied_spots, res4: $.data.reserved_spots } }
          assert:
            - "after arrive: lot received == 40.0 and on_hand == 40.0 (mirror of car remaining)"
            - "after create: occupied 0 / reserved 1; after schedule: still 0 / 1 (reservation counted once); after execute: 1 / 0"
            - "after 25.000 t certification: car remaining == 15.0, lot on_hand == 15.0, lot shipped == 25.0"
            - "after full second certification and release: track back to occupied 0 / reserved 0"
      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: "transitive_cascade / incident_suspend_cascade_depth3 and transitive_cascade / certify_autocomplete_cascade_depth3"
          rationale: "N-level cascade chains verified end-to-end in the named §1.8 instances."
      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / demurrage_constructive_vs_actual_basis (and contamination_strict_vs_weighted_policy, sit_calendar_vs_business_days)"
          rationale: "All three variant pairs asserted with deltas in the named §1.8 instances."
      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / demurrage_tiered_hazard_credit_straddle and boundary_precision_check / demurrage_free_minute_boundary (posture count thresholds are covered by calculations / posture_threshold_aggregation in this file)"
          rationale: "Cumulative (tiered demurrage) and instantaneous (posture count) thresholds asserted at their boundaries in the named instances."
  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_in_response
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "immediate consistency: every mutation's response body reflects the post-mutation state in the same request (no re-read needed): arrive returns ARRIVED with stamped arrival_timestamp; PATCH returns the new field values; certify returns CERTIFIED with computed net_weight_tons."
        test_recipe:
          setup: ["Facility; customer; clean=false product; lot; track cap 1; equipment; car chain through SPOTTED with an ACTIVE transfer order and a DRAFT ticket."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-M1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "CONV-1", equipment_type: "CONVEYOR" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "97501", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id } }
          trigger:
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { a_st: $.data.placement_status, a_ts: $.data.arrival_timestamp, a_rem: $.data.quantity_remaining_tons, car_v: $.data.version } }
            - { call: "PATCH /transload/customers/${cust}", payload: { demurrage_basis: "ACTUAL" }, as: FacilityAdmin, captures: { p_basis: $.data.demurrage_basis, p_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster, captures: { sch_st: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster, captures: { ex_st: $.data.status } }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 10.0 }, as: TransferOperator, captures: { to: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${to}/weight-tickets", payload: { truck_reference: "TRK-1", gross_weight_tons: 24.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wt: $.data.id, wt_net: $.data.net_weight_tons } }
            - { call: "POST /transload/weight-tickets/${wt}/certify", payload: {}, as: TransferOperator, captures: { wt_st: $.data.status } }
          assert:
            - "arrive response: placement_status == ARRIVED, arrival_timestamp == 2026-08-03T00:00:00Z, quantity_remaining_tons == 40.0"
            - "PATCH response: demurrage_basis == ACTUAL, version == 2"
            - "schedule response: SCHEDULED; execute response: EXECUTED"
            - "ticket create response already carries computed net_weight_tons == 10.0; certify response: CERTIFIED"
