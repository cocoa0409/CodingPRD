scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: distributor_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Distributor]
        distinguishing_aspect: "A distributor created with the five required inputs starts ACTIVE with zeroed computed ledger fields and version 1; no client input can preset status or ledger fields."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { distributor_code: "D-DEF", name: "Defaults Co", emissions_requirement: "FEDERAL", credit_limit_cents: 500000, volume_discount_pct: 0.1 }
              as: PlantAdmin
              captures: { d_id: $.data.id, d_status: $.data.status, d_held: $.data.deposits_held_cents, d_credit: $.data.credit_balance_cents, d_v: $.data.version }
          assert:
            - "captured d_status == ACTIVE"
            - "captured d_held == 0 and captured d_credit == 0"
            - "captured d_v == 1"
            - "Distributor.${d_id}.created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: get_missing_distributor_returns_not_found
        claim_type: not_found
        grounds: [entities.Distributor, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but non-existent distributor id yields ERR_NOT_FOUND (404), exercised on GET /distributors/{id}."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /distributors/00000000-0000-0000-0000-000000000000"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_NOT_FOUND"

      - name: distributor_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Distributor, "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required input credit_limit_cents on distributor creation is rejected with ERR_VALIDATION (400) before any state is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { distributor_code: "D-MISS", name: "Missing Ltd", emissions_requirement: "FEDERAL", volume_discount_pct: 0.1 }
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION"

      - name: distributor_invalid_emissions_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Distributor.fields.emissions_requirement, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "emissions_requirement is a closed enum {FEDERAL, CALIFORNIA}; the value EURO6 is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { distributor_code: "D-ENUM", name: "Enum Ltd", emissions_requirement: "EURO6", credit_limit_cents: 500000, volume_discount_pct: 0.1 }
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION"

      - name: core_return_provisional_credit_computed
        claim_type: computed_fields
        grounds: [entities.CoreReturn.fields.provisional_credit_cents]
        excluded_because:
          difficulty_instance: core_credit_provisional_vs_final
          rationale: "The provisional variant value (100000) is captured and asserted there at creation time."

      - name: dyno_test_record_is_immutable
        claim_type: immutability
        grounds: [entities.DynoTest]
        distinguishing_aspect: "DynoTest is common_fields:false — its record carries id and created_at but no version/updated_at, and the API exposes no update or delete endpoint for it."
        test_recipe:
          setup:
            - "Engine E is BUILT with its work order in DYNO_TEST (1-op spec, route completed)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-IMM", name: "Immutable Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "LUMINA-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-IMM", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
          trigger:
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-IMM", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
              captures: { dt_id: $.data.id, dt_result: $.data.result }
          assert:
            - "captured dt_result == PASS"
            - "DynoTest.${dt_id} response contains id and created_at but no version field and no updated_at field"
            - "No PUT/PATCH/DELETE endpoint exists for /reman-engines/{id}/dyno-tests in §1.5"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: grade_already_graded_return_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CoreReturn.RECEIVED_to_GRADED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "GRADED is not a from-state for grading (only RECEIVED and DISPUTED are); grading a GRADED, non-disputed return fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Return R graded GRADE_A"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-GG", name: "Double Grade Co", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "MONTECARLO-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
          trigger:
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_B", missing_components: [] }
              as: CoreInspector
              captures: { err: $.data.error_id }
            - call: "GET /core-returns/${r1}"
              as: PlantAdmin
              captures: { r1_grade: $.data.grade, r1_final: $.data.final_credit_cents }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "captured r1_grade == GRADE_A and captured r1_final == 100000 (second grade changed nothing)"

      - name: respond_on_closed_return_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CoreReturn.GRADED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: responding to an already-CLOSED return (ACCEPT or DISPUTE) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Return R graded and accepted (CLOSED)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-TL", name: "Terminal Co", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "BERETTA-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_B", missing_components: [] }
              as: CoreInspector
            - call: "POST /core-returns/${r1}/respond"
              payload: { action: "ACCEPT" }
              as: Distributor
              as_user_id: "${d1}"
          trigger:
            - call: "POST /core-returns/${r1}/respond"
              payload: { action: "DISPUTE" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "CoreReturn.${r1}.status == CLOSED and dispute_count == 0"

      - name: advance_cannot_skip_pipeline_stage
        claim_type: invalid_transition
        grounds: [state_machines.RemanWorkOrder.QUEUED_to_TEARDOWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "The pipeline is ordered QUEUED -> TEARDOWN -> MACHINING -> ASSEMBLY -> DYNO_TEST; a QUEUED work order advancing directly to MACHINING is rejected."
        test_recipe:
          setup: ["Work order W exists in QUEUED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-SKIP", name: "Skip Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "CAVALIER-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id, w1_status: $.data.status }
          trigger:
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
              captures: { err: $.data.error_id }
          assert:
            - "captured w1_status == QUEUED (initial state)"
            - "captured err == ERR_INVALID_STATE"
            - "RemanWorkOrder.${w1}.status == QUEUED after the rejected advance"

      - name: rework_requires_failed_latest_dyno
        claim_type: precondition_enforcement
        grounds: [state_machines.RemanWorkOrder.DYNO_TEST_to_MACHINING]
        distinguishing_aspect: "The DYNO_TEST -> MACHINING rework edge fires only when the engine's latest dyno is FAIL; after a PASS the same advance is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Engine E DYNO_PASSED (latest dyno PASS); work order W in DYNO_TEST"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-RW", name: "Rework Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "PRIZM-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-RW", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-RW", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE (latest dyno is PASS, not FAIL)"
            - "RemanWorkOrder.${w1}.status == DYNO_TEST and rework_count == 0"

      - name: assembly_blocked_until_operations_complete
        claim_type: precondition_enforcement
        grounds: [state_machines.RemanWorkOrder.MACHINING_to_ASSEMBLY, "errors[ERR_OPERATIONS_INCOMPLETE]", "validations[priority=20]"]
        distinguishing_aspect: "Advancing to ASSEMBLY while a declared operation is still PENDING fails with ERR_OPERATIONS_INCOMPLETE (422), not a generic state error."
        test_recipe:
          setup: ["Work order W in MACHINING with one PENDING operation"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-ASM", name: "Assembly Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "TRACKER-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
          trigger:
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_OPERATIONS_INCOMPLETE"
            - "RemanWorkOrder.${w1}.status == MACHINING and reman_engine_id == null (no engine minted)"

      - name: route_sequence_enforced_on_perform
        claim_type: precondition_enforcement
        grounds: ["validations[priority=19]", "errors[ERR_ROUTE_SEQUENCE_VIOLATION]", state_machines.MachineOperation.PENDING_to_COMPLETED]
        distinguishing_aspect: "With a 2-op route [CRANK_GRIND, BORE], performing the BORE op (sequence 2) before CRANK_GRIND (sequence 1) completes is rejected; after seq 1 completes, seq 2 performs normally."
        test_recipe:
          setup: ["Work order W in MACHINING with ops O1 (CRANK_GRIND seq 1) and O2 (BORE seq 2), both PENDING"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-SEQ", name: "Sequence Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "C1500-1995", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND", "BORE"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { w1v2: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "BORE", sequence: 2, expected_work_order_version: "${w1v2}" }
              as: ShopTechnician
              captures: { o2: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
          trigger:
            - call: "POST /operations/${o2}/perform"
              payload: { station_code: "STN-BORE-1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
              captures: { err: $.data.error_id }
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-CRANK-11", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
              captures: { o1_status: $.data.status }
            - call: "POST /operations/${o2}/perform"
              payload: { station_code: "STN-BORE-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", result: "PASS" }
              as: ShopTechnician
              captures: { o2_status: $.data.status }
          assert:
            - "captured err == ERR_ROUTE_SEQUENCE_VIOLATION"
            - "captured o1_status == COMPLETED"
            - "captured o2_status == COMPLETED (allowed once sequence 1 is complete)"

      - name: spec_activation_supersedes_active_sibling
        claim_type: side_effect_execution
        grounds: [state_machines.BuildSpec.DRAFT_to_ACTIVE, state_machines.BuildSpec.ACTIVE_to_RETIRED]
        distinguishing_aspect: "Activating spec B retires the currently ACTIVE spec A with the same (engine_family, application_code, emissions_tier) key; specs with different keys are untouched. Also pins the DRAFT initial state."
        test_recipe:
          setup: ["Specs A and B share key (SBC-350, BLAZER-1996, FEDERAL); spec C has a different application_code; A is ACTIVE, B and C are DRAFT"]
          setup_api_calls:
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "BLAZER-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { sa: $.data.id, sa_init: $.data.status }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "BLAZER-1996", emissions_tier: "FEDERAL", list_price_cents: 260000, core_deposit_cents: 210000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { sb: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "JIMMY-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { sc: $.data.id }
            - call: "POST /build-specs/${sa}/activate"
              as: PlantAdmin
          trigger:
            - call: "POST /build-specs/${sb}/activate"
              as: PlantAdmin
              captures: { sb_status: $.data.status }
            - call: "GET /build-specs/${sa}"
              as: PlantAdmin
              captures: { sa_status: $.data.status }
            - call: "GET /build-specs/${sc}"
              as: PlantAdmin
              captures: { sc_status: $.data.status }
          assert:
            - "captured sa_init == DRAFT (initial state)"
            - "captured sb_status == ACTIVE"
            - "captured sa_status == RETIRED (supersede cascade)"
            - "captured sc_status == DRAFT (different key, untouched)"

      - name: retire_blocked_by_open_work_order
        claim_type: precondition_enforcement
        grounds: [state_machines.BuildSpec.ACTIVE_to_RETIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A spec referenced by a non-terminal work order (QUEUED here) cannot be retired; the retire is rejected with ERR_INVALID_STATE and the spec stays ACTIVE."
        test_recipe:
          setup: ["Spec S ACTIVE; work order W referencing S is QUEUED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-RET", name: "Retire Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "SONOMA-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
