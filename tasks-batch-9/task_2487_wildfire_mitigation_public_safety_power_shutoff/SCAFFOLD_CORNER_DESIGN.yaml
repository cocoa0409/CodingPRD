            - *k_ws_m1
            - *k_obs_m1
            - *k_fpi_m
            - *k_cust_m1
            - *k_cust_m2
            - *k_cust_m3
            - *k_cust_m4
            - *k_cust_m5
            - *k_evm
            - *k_scope_m
