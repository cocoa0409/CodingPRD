              as: MinePlanner
              captures: { p11_id: $.data.id }
            - call: "POST /salt/panels/${p11_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p11_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${m11_id}"
              payload: {}
              as: MinePlanner
              captures: { m11_v: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m11_id}", panel_id: "${p11_id}", planned_tons: 40000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-13T00:00:00Z", expected_mine_version: "${m11_v}" }
              as: MinePlanner
              captures: { r11_id: $.data.id, r11_rate: $.data.planned_tons_per_hour }
            - call: "POST /salt/production-runs/${r11_id}/hoist"
              payload: { hoisted_tons: 40000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Depot A", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d11: $.data.id }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r11_id}", depot_id: "${d11}", product_line: "HIGHWAY_DEICING", screen_spec: "MEDIUM", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 39000, moisture_pct: 0.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { b11a: $.data.id, b11a_yield: $.data.yield_tons }
            - call: "POST /salt/treatment-batches/${b11a}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r11_id}", depot_id: "${d11}", product_line: "HIGHWAY_DEICING", screen_spec: "MEDIUM", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 999, moisture_pct: 0.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { b11b: $.data.id, b11b_yield: $.data.yield_tons }
            - call: "POST /salt/treatment-batches/${b11b}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "GET /salt/depots/${d11}/storage-posture"
              payload: {}
              as: LogisticsPlanner
              captures: { pre_tons: $.data.covered_stored_tons, pre_util: $.data.covered_utilization_pct, pre_state: $.data.depot_state }
          trigger:
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r11_id}", depot_id: "${d11}", product_line: "HIGHWAY_DEICING", screen_spec: "MEDIUM", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 1, moisture_pct: 0.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { b11c: $.data.id, b11c_yield: $.data.yield_tons }
            - call: "POST /salt/treatment-batches/${b11c}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "GET /salt/depots/${d11}/storage-posture"
              payload: {}
              as: LogisticsPlanner
              captures: { post_tons: $.data.covered_stored_tons, post_util: $.data.covered_utilization_pct, post_state: $.data.depot_state }
          assert:
            - "${r11_rate} == 833.3333 (40000 / 48 h at 4 decimals)"
            - "${b11a_yield} == 35100.00 and ${b11b_yield} == 899.10 and ${b11c_yield} == 0.90"
            - "${pre_tons} == 35999.10 and ${pre_util} == 90.00 — the DISPLAYED utilization already reads 90.00 because 89.99775 rounds half-up"
            - "${pre_state} == OPEN — the auto-SURGE comparison 35999.10 x 100 >= 40000 x 90 is 3599910.00 >= 3600000 which is FALSE"
            - "${post_tons} == 36000.00 and ${post_util} == 90.00 and ${post_state} == SURGE — 3600000 >= 3600000 crosses on equality"
