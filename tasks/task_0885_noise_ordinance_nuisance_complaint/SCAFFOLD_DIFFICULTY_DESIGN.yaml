          - errors[ERR_VARIANCE_COVERS_COMPLAINT]
        distinguishing_aspect: "Entity pair (Complaint, VariancePermit): a reviewed, over-limit complaint cannot be substantiated because an ISSUED variance on the same Property covers its reported_at at a permitted_max_db >= the measured level."
        test_recipe:
