  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_overlap_half_open_strict
        grounds:
          - validations[priority=11]
          - entities.ServiceVisit.fields.technician_id
        distinguishing_aspect: |
          Technician overlap uses half-open [start,end) geometry on the Technician resource: a new
          visit 09:30-10:30 strictly overlapping an existing 09:00-10:00 on the same technician is
          rejected ERR_TECHNICIAN_DOUBLE_BOOKED (no buffer, adjacency would be allowed).
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00Z. Technician TECH1. Account A ACTIVE (PLUS) with SCHEDULED visit 2026-06-03T09:00-10:00 on TECH1. A SECOND account B is used so the conflict is technician-only, not account-level."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech One", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "AcctA", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_a}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-03T09:00:00Z", window_end: "2026-06-03T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
            - call: "POST /accounts"
              payload: { customer_name: "AcctB", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_b}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_b}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-03T09:30:00Z", window_end: "2026-06-03T10:30:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TECHNICIAN_DOUBLE_BOOKED"

      - name: account_overlap_closed_plus_buffer
        grounds:
          - validations[priority=12]
          - entities.ServiceVisit.fields.account_id
        distinguishing_aspect: |
          Account overlap uses closed-interval + 60-minute buffer geometry: a new visit on the same
          account starting only 30 minutes after a prior visit ends (gap 30 < 60) is rejected
          ERR_ACCOUNT_VISIT_CONFLICT even though a technician-only check (adjacency-allowed) would pass.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00Z. Two technicians TECH1, TECH2 (so the second visit's tech is free, isolating the account buffer rule). Account ACTIVE (PLUS) with SCHEDULED visit 2026-06-04T09:00-10:00 on TECH1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech One", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Two", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech2: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Buf", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-04T09:00:00Z", window_end: "2026-06-04T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-04T10:30:00Z", window_end: "2026-06-04T11:30:00Z", technician_id: "${tech2}" }
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_VISIT_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: addon_attach_then_drop_conserves_monthly_recurring
        grounds:
          - entities.Account.fields.monthly_recurring_cents
          - entities.AddOnSubscription.fields.status
          - calculations.monthly_recurring_charge
        distinguishing_aspect: |
          Conserved quantity = Account.monthly_recurring_cents: attaching an add-on then dropping it
          MUST return monthly_recurring_cents to its exact pre-attach value (6800c), no drift.
        test_recipe:
          setup:
            - "Catalog PLUS (rank2 fee6000), HBOX premium (fee1500 min_rank2), RSF CA base800 surcharge500. Account PLUS ACTIVE, no add-on -> monthly_recurring 6800c (6000 package + 800 rsf)."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /premium-channels"
              payload: { code: "HBOX", name: "HBox", kind: "PREMIUM", monthly_fee_cents: 1500, min_package_rank: 2, active: true }
              as: BillingAdmin
              captures: { hbox_id: $.data.id }
            - call: "POST /regional-sports-fee-rules"
              payload: { state_code: "CA", base_fee_cents: 800, premier_surcharge_cents: 500, active: true }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { customer_name: "Inv1", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { net_before: $.data.monthly_recurring_cents }
            - call: "POST /accounts/${acct_id}/add-ons"
              payload: { premium_channel_id: "${hbox_id}" }
              as: CustomerServiceAgent
              captures: { addon_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/add-ons/${addon_id}/drop"
              payload: {}
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { net_after: $.data.monthly_recurring_cents }
          assert:
            - "net_before == 6800"
            - "Account.${net_after} == 6800"
            - "net_after == net_before"

      - name: equipment_assign_then_return_conserves_monthly_recurring
        grounds:
          - state_machines.EquipmentLease.status.ASSIGNED_to_RETURNED
          - entities.EquipmentLease.fields.monthly_lease_cents
          - calculations.monthly_recurring_charge
        distinguishing_aspect: |
          Conserved quantity = Account.monthly_recurring_cents on a DIFFERENT line type (equipment):
          assigning a 1000c lease then returning it MUST restore monthly_recurring_cents to 6800c,
          with unreturned_charge_cents staying 0 (no replacement drift).
        test_recipe:
          setup:
            - "Catalog PLUS (rank2 fee6000), DVR model (lease1000 repl30000), RSF CA base800 surcharge500. Account PLUS ACTIVE, no equipment -> monthly_recurring 6800c."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /equipment-models"
              payload: { model_code: "DVR-4K", kind: "DVR", monthly_lease_cents: 1000, replacement_cost_cents: 30000, active: true }
              as: BillingAdmin
              captures: { dvr_id: $.data.id }
            - call: "POST /regional-sports-fee-rules"
              payload: { state_code: "CA", base_fee_cents: 800, premier_surcharge_cents: 500, active: true }
              as: BillingAdmin
            - call: "POST /accounts"
              payload: { customer_name: "Inv2", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { net_before: $.data.monthly_recurring_cents }
            - call: "POST /accounts/${acct_id}/equipment-leases"
              payload: { equipment_model_id: "${dvr_id}", quantity: 1 }
              as: CustomerServiceAgent
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/equipment-leases/${lease_id}/return"
              payload: {}
              as: CustomerServiceAgent
              captures: { lease_status: $.data.status, unret: $.data.unreturned_charge_cents }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { net_after: $.data.monthly_recurring_cents }
          assert:
            - "net_before == 6800"
            - "EquipmentLease.${lease_status} == RETURNED"
            - "EquipmentLease.${unret} == 0"
            - "Account.${net_after} == 6800"
