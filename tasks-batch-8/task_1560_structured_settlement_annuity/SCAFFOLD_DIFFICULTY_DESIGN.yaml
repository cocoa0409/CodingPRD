# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Structured Settlement Annuity Administration — 9 rules x >=2 instances = 20
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual-variant calculations across DIFFERENT entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: escalation_carry_vs_end_rounding
        grounds:
          - calculations.escalated_payment_amount
          - entities.ScheduledPayment.fields.amount_cents
          - entities.ScheduledPayment.fields.disclosure_amount_cents
        distinguishing_aspect: |
          On ScheduledPayment (payment domain), the same base/rate/anchor inputs
          yield two payable figures: carry-rounded amount_cents rounds after every
          annual step while end-rounded disclosure_amount_cents rounds once at the
          end; at n=2 with base 99994 and 333 bps they diverge by exactly 1 cent.
        test_recipe:
          setup:
            - "CA profile exists (AOM 18, cap 700, cooling 10, ipa true, dormancy 3, commutation true)"
            - "Adult payee (DOB 1980-06-15, resident CA) exists"
            - "Agreement ESC-001 is EXECUTED"
            - "DRAFT schedule effective 2026-02-01 with escalation anchor 2026-02-01"
            - "Two payments: seq1 due 2027-02-01 base 99994 esc 333bps; seq2 due 2028-02-01 base 99994 esc 333bps"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Ann Adult", date_of_birth: "1980-06-15", tax_id: "111-22-3333", address_line1: "1 Main St", address_city: "Sacramento", address_state_code: "CA", address_postal_code: "95814" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "ESC-001", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2027-02-01", base_amount_cents: 99994, escalation_rate_bps: 333 }
              as: CaseManager
              captures: { p1_id: $.data.id, p1_amt: $.data.amount_cents, p1_disc: $.data.disclosure_amount_cents }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 2, due_date: "2028-02-01", base_amount_cents: 99994, escalation_rate_bps: 333 }
              as: CaseManager
              captures: { p2_id: $.data.id, p2_amt: $.data.amount_cents, p2_disc: $.data.disclosure_amount_cents }
          trigger: []
          assert:
            - "ScheduledPayment.${p1_id}.amount_cents == 103324 (carry-rounded: round_half_up(99994*1.0333) = round_half_up(103323.80))"
            - "ScheduledPayment.${p1_id}.disclosure_amount_cents == 103324 (n=1: variants agree)"
            - "ScheduledPayment.${p2_id}.amount_cents == 106765 (carry: round_half_up(103324*1.0333) = round_half_up(106764.69))"
            - "ScheduledPayment.${p2_id}.disclosure_amount_cents == 106764 (end: round_half_up(99994*1.0333^2) = round_half_up(106763.92))"
            - "captured ${p2_amt} != ${p2_disc} and ${p2_amt} - ${p2_disc} == 1"

      - name: transfer_rate_aggregate_vs_irr
        grounds:
          - calculations.transfer_discount_rates
          - entities.TransferPetition.fields.disclosed_discount_rate_bps
          - entities.TransferPetition.fields.effective_annual_rate_bps
          - validations[priority=8]
        distinguishing_aspect: |
          On TransferPetition (secondary-market domain — a different entity domain
          than ScheduledPayment), the aggregate discount method yields 667 bps while
          the actuarial IRR method yields 732 bps on identical inputs; the statutory
          cap binds the IRR figure only, so the petition is rejected at 732 even
          though its disclosed aggregate rate 667 sits under the 700 cap.
        test_recipe:
          setup:
            - "CA profile (cap 700 bps); adult CA payee; agreement fully funded (policy rate 500 bps, rider DEATH_AND_HARDSHIP, certain end 2036-12-31)"
            - "ACTIVE schedule with payments: 100000 due 2030-01-01 and 100000 due 2031-01-01 (esc 0)"
            - "logical clock at 2029-01-01T00:00:00Z (valuation date; t1=1.0, t2=2.0 ACT/365)"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Ann Adult", date_of_birth: "1980-06-15", tax_id: "111-22-3333", address_line1: "1 Main St", address_city: "Sacramento", address_state_code: "CA", address_postal_code: "95814" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "TR-001", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-1", insurer_name: "LifeCo", premium_cents: 50000000, contract_discount_rate_bps: 500, commutation_rider: "DEATH_AND_HARDSHIP", certain_period_end_date: "2036-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2030-01-01", base_amount_cents: 100000, escalation_rate_bps: 0 }
              as: CaseManager
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 2, due_date: "2031-01-01", base_amount_cents: 100000, escalation_rate_bps: 0 }
              as: CaseManager
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /annuity/transfer-petitions"
              payload: { settlement_agreement_id: "${agr_id}", payee_id: "${payee_id}", factoring_company_name: "FactorCo", purchase_price_cents: 180000, transfer_start_date: "2030-01-01", transfer_end_date: "2031-01-31" }
              as: CaseManager
              captures: { pet_id: $.data.id, pet_agg: $.data.disclosed_discount_rate_bps, pet_irr: $.data.effective_annual_rate_bps, pet_pv: $.data.present_value_cents }
          trigger:
            - call: "POST /annuity/transfer-petitions/${pet_id}/file"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
              captures: { file_err: $.data.error_id }
          assert:
            - "TransferPetition.${pet_id}.disclosed_discount_rate_bps == 667 (aggregate: round_half_up(10000*20000/200000/1.5))"
            - "TransferPetition.${pet_id}.effective_annual_rate_bps == 732 (IRR solving 180000 = 100000/(1+r) + 100000/(1+r)^2)"
            - "TransferPetition.${pet_id}.present_value_cents == 185941 (95238 + 90703 at contract 500 bps)"
            - "captured ${pet_irr} > ${pet_agg} (IRR method exceeds aggregate on a discounted multi-payment set)"
            - "file rejected: ${file_err} == ERR_EFFECTIVE_RATE_EXCEEDS_CAP because the cap binds the IRR variant (732 > 700) even though 667 <= 700"
            - "TransferPetition.${pet_id}.status == DRAFT after the rejected file"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial formulas in DIFFERENT modes ((a) multi-input non-linear, (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: commuted_value_min_rate_branch_cap
        grounds:
          - calculations.commuted_value
          - entities.CommutationRequest.fields.commuted_value_cents
          - entities.CommutationRequest.fields.fee_cents
        distinguishing_aspect: |
          Mode (a): commuted_value combines >=3 inputs non-linearly — the discount
          rate is min(policy 500 bps, state cap 400 bps) = 400 bps, the reason
          branch (DEATH) zeroes the fee, and the hardship branch would apply
          min(3% of pv, 25000). With two 100000-cent payments at t=1 and t=2 the
          DEATH commutation is worth exactly 188610 cents.
        test_recipe:
          setup:
            - "CA profile variant: cap 400 bps (below the policy rate), AOM 18, cooling 10, ipa true, dormancy 3, commutation_permitted true"
            - "Payee (DOB 1965-04-10) with funded agreement; policy rate 500 bps, rider DEATH_AND_HARDSHIP, certain end 2036-12-31"
            - "ACTIVE schedule with payments 100000 due 2030-01-01 and 100000 due 2031-01-01 (esc 0); both survive death because certain end covers them"
            - "DeathClaim for the payee is SETTLED (date_of_death 2028-12-20, claimant ESTATE)"
            - "logical clock at 2029-01-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 400, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Dee Senior", date_of_birth: "1965-04-10", tax_id: "222-33-4444", address_line1: "9 Oak Ave", address_city: "Fresno", address_state_code: "CA", address_postal_code: "93701" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "CM-001", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-C", insurer_name: "LifeCo", premium_cents: 40000000, contract_discount_rate_bps: 500, commutation_rider: "DEATH_AND_HARDSHIP", certain_period_end_date: "2036-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2030-01-01", base_amount_cents: 100000, escalation_rate_bps: 0 }
              as: CaseManager
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 2, due_date: "2031-01-01", base_amount_cents: 100000, escalation_rate_bps: 0 }
              as: CaseManager
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/death-claims"
              payload: { payee_id: "${payee_id}", settlement_agreement_id: "${agr_id}", date_of_death: "2028-12-20", claimant_type: "ESTATE", claimant_name: "Estate of Senior" }
              as: CaseManager
              captures: { claim_id: $.data.id }
            - call: "POST /annuity/death-claims/${claim_id}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /annuity/annuity-policies/${pol_id}"
              payload: {}
              as: Any
              captures: { pol_v: $.data.version }
          trigger:
            - call: "POST /annuity/commutation-requests"
              payload: { annuity_policy_id: "${pol_id}", settlement_agreement_id: "${agr_id}", reason: "DEATH", death_claim_id: "${claim_id}", expected_annuity_policy_version: "${pol_v}" }
              as: CaseManager
              captures: { com_id: $.data.id, com_val: $.data.commuted_value_cents }
          assert:
            - "CommutationRequest.${com_id}.commuted_value_cents == 188610 (rate = min(500,400)=400bps; round(100000/1.04)=96154 + round(100000/1.0816)=92456)"
            - "CommutationRequest.${com_id}.fee_cents == 0 (DEATH reason zeroes the fee)"
            - "CommutationRequest.${com_id}.covered_payment_count == 2"
            - "CommutationRequest.${com_id}.status == REQUESTED"
            - "both ScheduledPayments remain SCHEDULED until pay-out (creation freezes but does not move the set)"

      - name: pv_per_payment_rounding_order
        grounds:
          - calculations.transferred_payment_set_pv
          - entities.TransferPetition.fields.present_value_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, on a different formula
          than the escalation calc: present_value_cents pins per-payment
          round_half_up THEN sum; with payments 99999 and 100009 both at t=1 and
          rate 400 bps the pinned order yields 192316 while sum-then-round yields
          192315 — one cent of difference driven purely by rounding order.
        test_recipe:
          setup:
            - "CA profile (cap 700); adult payee; funded agreement with policy rate 400 bps, rider NONE, certain end 2036-12-31"
            - "ACTIVE schedule with payments 99999 and 100009 both due 2030-01-01 (esc 0)"
            - "logical clock at 2029-01-01T00:00:00Z (both payments at t=1.0)"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Pat Round", date_of_birth: "1985-11-30", tax_id: "333-44-5555", address_line1: "5 Pine Rd", address_city: "Chico", address_state_code: "CA", address_postal_code: "95926" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "PV-001", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-P", insurer_name: "LifeCo", premium_cents: 30000000, contract_discount_rate_bps: 400, commutation_rider: "NONE", certain_period_end_date: "2036-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2030-01-01", base_amount_cents: 99999, escalation_rate_bps: 0 }
              as: CaseManager
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 2, due_date: "2030-01-01", base_amount_cents: 100009, escalation_rate_bps: 0 }
              as: CaseManager
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /annuity/transfer-petitions"
              payload: { settlement_agreement_id: "${agr_id}", payee_id: "${payee_id}", factoring_company_name: "FactorCo", purchase_price_cents: 150000, transfer_start_date: "2030-01-01", transfer_end_date: "2030-01-01" }
              as: CaseManager
              captures: { pet_id: $.data.id, pet_pv: $.data.present_value_cents }
          assert:
            - "TransferPetition.${pet_id}.present_value_cents == 192316 (round(99999/1.04)=96153 plus round(100009/1.04)=96163, per-payment rounding then sum)"
            - "present_value_cents != 192315 (the sum-then-round alternative is rejected by the pinned order)"
            - "TransferPetition.${pet_id}.transferred_payment_count == 2"
            - "TransferPetition.${pet_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 3: non-linear state-machine shape on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: payment_issue_return_reissue_cycle
        grounds:
          - state_machines.ScheduledPayment.PAYABLE_to_ISSUED
          - state_machines.ScheduledPayment.ISSUED_to_RETURNED
          - state_machines.ScheduledPayment.RETURNED_to_PAYABLE
        distinguishing_aspect: |
          ScheduledPayment has a true cycle ISSUED -> RETURNED -> PAYABLE -> ISSUED
          (reissue loop); after the full loop the payment is ISSUED again with
          issue_count == 2 and the ReturnedPaymentCase closed as RESOLVED_REISSUE.
        test_recipe:
          setup:
            - "CA profile; adult payee; funded agreement; ACTIVE schedule with one payment 120000 due 2026-09-01 (esc 0)"
            - "logical clock at 2026-09-01T00:00:00Z so the payment is PAYABLE and the agreement ACTIVE"
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Cycl Ical", date_of_birth: "1979-02-11", tax_id: "444-55-6666", address_line1: "7 Elm St", address_city: "Redding", address_state_code: "CA", address_postal_code: "96001" }
              as: CaseManager
              captures: { payee_id: $.data.id }
            - call: "POST /annuity/settlement-agreements"
              payload: { case_number: "CY-001", court_state_code: "CA", obligor_name: "Acme Insurance", injury_type: "PHYSICAL", primary_payee_id: "${payee_id}", agreement_date: "2026-01-15" }
              as: CaseManager
              captures: { agr_id: $.data.id }
            - call: "POST /annuity/settlement-agreements/${agr_id}/execute"
              payload: {}
              as: CaseManager
            - call: "POST /annuity/qualified-assignments"
              payload: { settlement_agreement_id: "${agr_id}", assignment_company_name: "QAC Corp", executed_date: "2026-01-20" }
              as: CaseManager
              captures: { asg_id: $.data.id }
            - call: "POST /annuity/annuity-policies"
              payload: { settlement_agreement_id: "${agr_id}", qualified_assignment_id: "${asg_id}", policy_number: "POL-R", insurer_name: "LifeCo", premium_cents: 20000000, contract_discount_rate_bps: 500, commutation_rider: "DEATH_AND_HARDSHIP", certain_period_end_date: "2036-12-31" }
              as: CaseManager
              captures: { pol_id: $.data.id }
            - call: "POST /annuity/annuity-policies/${pol_id}/mark-in-force"
              payload: { in_force_date: "2026-01-25" }
              as: CaseManager
            - call: "POST /annuity/payment-schedules"
              payload: { settlement_agreement_id: "${agr_id}", effective_from_date: "2026-02-01", escalation_anchor_date: "2026-02-01" }
              as: CaseManager
              captures: { sch_id: $.data.id }
            - call: "POST /annuity/scheduled-payments"
              payload: { payment_schedule_id: "${sch_id}", payee_id: "${payee_id}", payment_seq_no: 1, due_date: "2026-09-01", base_amount_cents: 120000, escalation_rate_bps: 0 }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { agr_v: $.data.version }
            - call: "POST /annuity/payment-schedules/${sch_id}/activate"
              payload: { expected_settlement_agreement_version: "${agr_v}" }
              as: CaseManager
            - call: "POST /annuity/_clock/set_current_utc"
