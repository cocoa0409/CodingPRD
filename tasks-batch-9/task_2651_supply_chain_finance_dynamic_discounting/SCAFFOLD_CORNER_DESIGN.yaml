          Two settled invoices of unequal face (100000 at 1000 bps and 300000 at 600 bps) must yield
          the face-weighted 700 bps, never the arithmetic mean 800 bps; the difference is observable
          twice over because the THROTTLED ceiling that follows is floor(700*75/100) = 525 rather
          than floor(800*75/100) = 600.
