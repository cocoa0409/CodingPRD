              as: StateAgencyReviewer
              captures: { aer_id: $.data.id }
            - call: "POST /sfsp/sites"
              payload: { sponsor_id: "${sp_id}", name: "Riverbend Park", site_type: "OPEN", production_mode: "SELF_PREP", approved_meal_types: ["LUNCH"], approved_max_attendance: 200, operating_start_date: "2026-06-08", operating_end_date: "2026-08-14", area_eligibility_record_id: "${aer_id}", is_open_air: false, is_rural: true }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { site_id: $.data.id }
            - call: "POST /sfsp/sites/${site_id}/eligibility-determination"
              payload: {}
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/approval-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/operating-status"
              payload: { to_status: "OPERATING" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
          trigger:
            - call: "POST /sfsp/sites/${site_id}/approval-decision"
              payload: { decision: "SUSPENDED", reason: "Unannounced review found no site supervisor present" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sites/${site_id}/approval-decision"
              payload: { decision: "REINSTATED", reason: "Supervisor coverage documented" }
              as: StateAgencyReviewer
          assert:
            - "After the SUSPENDED decision: Site.${site_id}.approval_status == SUSPENDED"
            - "After the SUSPENDED decision: Site.${site_id}.operating_status == OPERATING (unchanged)"
            - "After the SUSPENDED decision: Site.${site_id}.claim_hold == true and Site.${site_id}.suspension_reason == \"Unannounced review found no site supervisor present\""
            - "After the REINSTATED decision: Site.${site_id}.approval_status == APPROVED"
            - "After the REINSTATED decision: Site.${site_id}.operating_status == OPERATING (still unchanged)"
            - "After the REINSTATED decision: Site.${site_id}.claim_hold == false and Site.${site_id}.suspension_reason == null"
            - "Site.${site_id}.first_operating_date == 2026-06-08 before and after both transitions"
            - "Site.${site_id}.voided_day_count == 0"

