      - name: two_support_rows_split_with_rounding_and_the_primary_row_absorbs_the_residual_on_every_change
        grounds:
          - calculations.assignment_minute_allocation.precision
          - calculations.assignment_minute_allocation.constants.SUPPORT_SHARE
          - calculations.assignment_minute_allocation.constants.ROLE_RANK
          - calculations.teacher_committed_minutes
        distinguishing_aspect: |
          With two SUPPORT rows each gets round_half_up(390 * 0.3 / 2 / 5) * 5 = 60 and the PRIMARY row
          takes 390 - 120 = 270; a SPED_SERVICE row is allocated 0 yet still counts as ACTIVE. Releasing
          one SUPPORT row re-divides by one instead of two, so the per-support figure jumps to 115 and the
          PRIMARY residual becomes 275. Neither 60 nor 115 is a clean share of 390 - the invariant only
          holds because the residual is assigned to PRIMARY rather than distributed - and the divisor
          change makes an incremental (delta-based) implementation drift by 5 minutes.
