# =============================================================================
# PRD-Bench Scaffold — task_2710_sales_tax_audit_assessment_appeal
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2710. Sales Tax Audit & Assessment Appeal (state revenue audit division): audit selection through risk scoring, industry projects and information-return matching, audit scope, period and statute of limitations with waiver extensions, sampling methodology agreement with the taxpayer and projection of error rates to the population, exemption certificate review with good-faith acceptance standards and missing-certificate assessments, use tax assessment on untaxed purchases with capital asset and consumable analysis, assessment issuance with penalty and interest computation and abatement criteria, informal conference, administrative appeal and tax tribunal escalation, payment plans, offers in compromise and collection referral

domain_name: sales-tax-audit-assessment-appeal

# All resource collections are rooted at the API root; there is no nesting of
# unrelated aggregates under a single top-level segment (entity_topology: flat).
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Fourteen peer aggregates joined by explicit foreign keys in request bodies;
  # URL paths never nest one aggregate under another except for read-only
  # reverse-reachability sub-resources (`GET /audits/{id}/statute-waivers`).

  state_machine_shape: cyclic
  # SamplingAgreement negotiates PROPOSED -> COUNTERED -> PROPOSED (bounded to
  # 3 rounds); ExemptionCertificate loops REJECTED -> CURED -> REJECTED;
  # AppealProceeding REMANDED drives Audit ASSESSED -> FIELDWORK. Assessment
  # additionally carries two independent state axes (`status` x
  # `collection_status`), and AppealProceeding branches three ways with
  # divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Audit -> SamplingAgreement/ExemptionCertificate/UseTaxPurchase
    - self_referential     # SamplingAgreement.supersedes_agreement_id, Assessment.supersedes_assessment_id, AppealProceeding.predecessor_proceeding_id
    - cross_aggregate      # AppealProceeding decision mutates Audit, Assessment, AssessmentAdjustment, PaymentArrangement, Taxpayer
    - polymorphic          # AssessmentAdjustment.kind selects which producer wrote the row (MANUAL vs SYSTEM)

  role_model: segregation_of_duties
  # The FieldAuditor who develops the audit may not close its own fieldwork
  # (AuditSupervisor does), and no appeal forum may be presided over by the
  # audit's lead auditor or by the officer who decided the predecessor forum.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities · 60 endpoints · 46 error codes · 7 calculations (3 with
  # divergent variants) · 8 state machines · 2 OCC rules.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Taxpayer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the permit holder under audit.
        constraints: "1..160 chars"
      - name: permit_number
        type: string
        source: input
        description: State sales-tax permit number; unique across all Taxpayers.
        constraints: "matches ^STP-[0-9]{6}$; uniqueness violation -> ERR_DUPLICATE_PERMIT_NUMBER"
      - name: industry_naics_code
        type: string
        source: input
        description: Six-digit NAICS code used to match the taxpayer to an IndustryProject.
        constraints: "matches ^[0-9]{6}$"
      - name: filing_frequency
        type: enum
        source: input
        description: Return filing cadence.
        constraints: "one of MONTHLY, QUARTERLY, ANNUAL"
      - name: gross_receipts_annual_cents
        type: integer
        source: input
        description: Self-reported annual gross receipts in cents; drives the magnitude component of the risk score.
        constraints: ">= 0"
      - name: delinquent_period_count
        type: integer
        source: input
        default: 0
        description: Number of filing periods filed late or not filed; drives the delinquency component.
        constraints: "0..40"
      - name: prior_audit_error_rate_bp
        type: integer
        source: input
        default: null
        description: Error rate in basis points measured by the most recent prior audit; null means never audited.
        constraints: "null or 0..10000"
      - name: compliance_status
        type: enum
        source: input
        default: COMPLIANT
        description: Permit standing; also written by system cascades from collection and arrangement outcomes.
        constraints: "one of COMPLIANT, DELINQUENT, REVOKED"
      - name: reported_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of InformationReturn.reported_amount_cents over this taxpayer's returns whose period_end <= the logical clock date (inclusive); recomputed on every InformationReturn create and on every logical-clock change. Addition over integer cents is order-insensitive, so no tie-break is required."
      - name: matched_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of InformationReturn.matched_return_amount_cents over the same filtered set as reported_total_cents."
      - name: info_variance_bp
        type: integer
        source: computed
        default: 0
        description: "Information-return variance component v of calculations.taxpayer_risk_score, in basis points."
      - name: delinquency_bp
        type: integer
        source: computed
        default: 0
        description: "Delinquency component d of calculations.taxpayer_risk_score, in basis points."
      - name: magnitude_bp
        type: integer
        source: computed
        default: 0
        description: "Receipts-magnitude component m of calculations.taxpayer_risk_score, in basis points."
      - name: prior_audit_bp
        type: integer
        source: computed
        default: 3500
        description: "Prior-audit component p of calculations.taxpayer_risk_score, in basis points; NEUTRAL_PRIOR_BP when prior_audit_error_rate_bp is null."
      - name: screening_score
        type: integer
        source: computed
        default: 0
        description: "SCREENING variant of calculations.taxpayer_risk_score (project-independent, so it is stored on the Taxpayer); 0..1000."
      - name: open_audit_count
        type: integer
        source: computed
        default: 0
        description: "Count of Audit rows for this taxpayer whose status is in {PLANNED, SCOPED, FIELDWORK, REVIEW_COMPLETE, ASSESSED}; gates selection eligibility and lead conversion."

  - name: InformationReturn
    parent: null
    common_fields: false
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the permit holder the third party reported payments to."
      - name: source_type
        type: enum
        source: input
        description: Third-party program that produced the return.
        constraints: "one of FEDERAL_1099K, WHOLESALER_REPORT, MARKETPLACE_REPORT"
      - name: period_start
        type: datetime
        source: input
        description: First day of the reported period (ISO 8601 calendar date, 00:00:00Z).
      - name: period_end
        type: datetime
        source: input
        description: Last day of the reported period (ISO 8601 calendar date, 00:00:00Z); must be >= period_start.
      - name: reported_amount_cents
        type: integer
        source: input
        description: Gross amount the third party reported for the period, in cents.
        constraints: ">= 0"
      - name: matched_return_amount_cents
        type: integer
        source: input
        description: Amount the taxpayer's own filed returns account for over the same period, in cents.
        constraints: ">= 0"
      - name: variance_cents
        type: integer
        source: computed
        description: "reported_amount_cents - matched_return_amount_cents (signed)."
      - name: match_status
        type: enum
        source: computed
        description: "MATCHED when variance_cents == 0, UNDER_REPORTED when > 0, OVER_REPORTED when < 0."
        constraints: "one of MATCHED, UNDER_REPORTED, OVER_REPORTED"
      - name: in_scoring_window
        type: boolean
        source: computed
        description: "True when period_end <= the logical clock date; evaluated at read time, never stored stale."

  - name: IndustryProject
    parent: null
    common_fields: true
    fields:
      - name: project_name
        type: string
        source: input
        description: Name of the industry audit project.
        constraints: "1..120 chars"
      - name: industry_naics_code
        type: string
        source: input
        description: NAICS code this project targets; only Taxpayers with the identical code are eligible candidates.
        constraints: "matches ^[0-9]{6}$"
      - name: industry_error_rate_bp
        type: integer
        source: input
        description: Historical industry error rate in basis points; the i component of the FULL risk-score variant.
        constraints: "0..10000"
      - name: selection_mode
        type: enum
        source: input
        description: "How a selection run walks the ranking: THRESHOLD selects every lead at or above selection_threshold_score, QUOTA selects the top selection_quota leads regardless of score, HYBRID requires both."
        constraints: "one of THRESHOLD, QUOTA, HYBRID"
      - name: selection_threshold_score
        type: integer
        source: input
        description: Inclusive cutoff; a candidate is selectable when risk_score >= this value.
        constraints: "0..1000"
      - name: selection_quota
        type: integer
        source: input
        description: Maximum number of leads that may hold SELECTED or CONVERTED status at once.
        constraints: ">= 1"
      - name: selections_used
        type: integer
        source: computed
        default: 0
        description: "Count of AuditLead rows of this project whose status is in {SELECTED, CONVERTED}."
      - name: selections_remaining
        type: integer
        source: computed
        description: "selection_quota - selections_used; the conserved-quota invariant selection_quota == selections_used + selections_remaining must hold after every mutation."
      - name: last_run_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock timestamp of the most recent selection run.
      - name: last_cutoff_score
        type: integer
        source: computed
        default: null
        description: "risk_score of the lowest-ranked lead the most recent run moved to SELECTED, or selection_threshold_score when that run selected nobody."
      - name: scored_lead_count
        type: integer
        source: computed
        default: 0
        description: Total AuditLead rows this project has ever produced.

  - name: AuditLead
    parent: null
    common_fields: true
    fields:
      - name: industry_project_id
        type: string
        source: input
        description: "FK -> IndustryProject.id; the project whose selection run scored this candidate."
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the scored candidate."
      - name: status
        type: enum
        source: system
        default: SCORED
        description: Lead lifecycle state.
        constraints: "one of SCORED, SELECTED, NOT_SELECTED, CONVERTED, DECLINED"
      - name: risk_score
        type: integer
        source: computed
        description: "Output of calculations.taxpayer_risk_score under the variant named by the project's selection_mode; 0..1000."
      - name: score_variant
        type: enum
        source: computed
        default: FULL
        description: "Variant of calculations.taxpayer_risk_score that produced risk_score. A project selection run always writes FULL; the SCREENING variant is only ever written to Taxpayer.screening_score, never to a lead."
        constraints: "one of SCREENING, FULL"
      - name: score_breakdown
        type: object
        source: computed
        description: "Component basis points actually used: { info_variance_bp, delinquency_bp, industry_error_rate_bp, magnitude_bp, prior_audit_bp, weighted_sum }."
      - name: rank_position
        type: integer
        source: computed
        description: "1-based rank inside its selection run under sort risk_score DESC, then Taxpayer.created_at ASC."
      - name: scored_at
        type: datetime
        source: computed
        description: Logical-clock timestamp of the run that produced this lead.
      - name: promoted_from_scored
        type: boolean
        source: computed
        default: false
        description: True when this lead reached SELECTED by waitlist promotion after another lead of the same project was declined.
      - name: decline_reason
        type: string
        source: input
        default: null
        description: Reason recorded when an analyst declines the lead.

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - name: taxpayer_id
        type: string
        source: input
        description: "FK -> Taxpayer.id; the audited permit holder."
      - name: audit_lead_id
        type: string
        source: input
        description: "FK -> AuditLead.id; the lead this audit was converted from."
      - name: agreed_agreement_id
        type: string
        source: computed
        default: null
        description: "FK -> SamplingAgreement.id; set to the agreement that reached AGREED status on this audit, null before that. Sample projection reads sample units through this id only."
      - name: lead_auditor_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the FieldAuditor assigned at conversion; segregation-of-duties compares appeal presiding officers against this value.
        constraints: "1..64 chars"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: Audit lifecycle state.
        constraints: "one of PLANNED, SCOPED, FIELDWORK, REVIEW_COMPLETE, ASSESSED, CLOSED, ABANDONED"
      - name: audit_type
        type: enum
        source: input
        default: null
        description: Examination type, fixed when the scope is set.
        constraints: "null or one of FIELD, DESK, MANAGED"
      - name: scope_period_start
        type: datetime
        source: input
        default: null
        description: First day of the audited period (ISO 8601 calendar date).
      - name: scope_period_end
        type: datetime
        source: input
        default: null
        description: Last day of the audited period (ISO 8601 calendar date); must be >= scope_period_start.
      - name: base_statute_expiry_date
        type: datetime
        source: computed
        default: null
        description: "scope_period_end + STATUTE_BASE_DAYS, fixed when the scope is set and never moved afterwards."
      - name: statute_expiry_date
        type: datetime
        source: computed
        default: null
        description: "Output of calculations.statute_expiry: base expiry advanced by executed waivers and then by tolled appeal days."
      - name: waiver_days_added
        type: integer
        source: computed
        default: 0
        description: "(waiver-advanced expiry - base_statute_expiry_date) in whole days; returns to 0 when every waiver is voided."
      - name: tolled_days
        type: integer
        source: computed
        default: 0
        description: "Sum of AppealProceeding.tolled_days over DECIDED proceedings attached to this audit's assessments."
      - name: statute_status
        type: enum
        source: computed
        default: UNSET
        description: "Derived at read time and at every validation against the logical clock; never stored stale. UNSET before the scope is set."
        constraints: "one of UNSET, PROTECTED, EXPIRING_SOON, EXPIRED"
      - name: projection_method
        type: enum
        source: computed
        default: NONE
        description: Projection algorithm most recently applied.
        constraints: "one of NONE, MEAN_PER_UNIT, RATIO_ESTIMATION"
      - name: projection_status
        type: enum
        source: computed
        default: NOT_RUN
        description: "CURRENT after a projection run; STALE once any sample unit, exemption certificate or use-tax purchase feeding it changes."
        constraints: "one of NOT_RUN, CURRENT, STALE"
      - name: sample_error_rate_bp
        type: integer
        source: computed
        default: null
        description: "round_half_up(sum(SampleUnit.error_amount_cents) * 10000 / sum(SampleUnit.invoice_amount_cents)) over the agreed agreement's units."
      - name: projected_deficiency_cents
        type: integer
        source: computed
        default: 0
        description: "Population deficiency projected from the sample by calculations.sample_projection under projection_method."
      - name: certificate_deficiency_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.certificate_deficiency: direct missing-certificate tax for REJECTED certificates that are NOT attached to a sample unit."
      - name: use_tax_deficiency_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of UseTaxPurchase.use_tax_due_cents over this audit's purchases."
      - name: examined_unit_count
        type: integer
        source: computed
        default: 0
        description: Count of SampleUnit rows under this audit's agreed agreement.
      - name: fraud_indicator
        type: boolean
        source: input
        default: false
        description: Set when fieldwork closes; forces the fraud penalty rate and zeroes every abatement.
      - name: reopen_count
        type: integer
        source: computed
        default: 0
        description: Number of times an appeal remand pushed this audit back to FIELDWORK.

  - name: StatuteWaiver
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> Audit.id; the audit whose limitation period this waiver extends."
      - name: status
        type: enum
        source: system
        default: DRAFTED
        description: Waiver lifecycle state.
        constraints: "one of DRAFTED, EXECUTED, VOIDED"
      - name: covers_period_end
        type: datetime
        source: input
        description: Period end the waiver covers; must equal the audit's scope_period_end.
      - name: extended_to_date
        type: datetime
        source: input
        description: New limitation date requested; must be strictly after the audit's current statute_expiry_date.
      - name: prior_expiry_date
        type: datetime
        source: computed
        default: null
        description: Snapshot of Audit.statute_expiry_date taken at execution; null while DRAFTED.
      - name: days_added
        type: integer
        source: computed
        default: 0
        description: "(extended_to_date - prior_expiry_date) in whole days while EXECUTED; reset to 0 on void."
      - name: signed_by_name
        type: string
        source: input
        default: null
        description: Name of the taxpayer officer who signed the waiver.
      - name: signed_date
        type: datetime
        source: input
        default: null
        description: Signature date; must equal the logical clock date. Waiver ordering inside calculations.statute_expiry sorts by signed_date ASC then created_at ASC.
      - name: void_reason
        type: string
        source: input
        default: null
        description: Reason recorded when a supervisor voids an executed waiver.

  - name: SamplingAgreement
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> Audit.id; the audit whose sampling methodology is being negotiated."
      - name: supersedes_agreement_id
        type: string
        source: input
        default: null
        description: "FK -> SamplingAgreement.id; the prior agreement this proposal replaces, null for a first proposal."
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: Negotiation state.
        constraints: "one of PROPOSED, COUNTERED, AGREED, SUPERSEDED"
      - name: methodology
        type: enum
        source: input
        description: "Projection method agreed with the taxpayer; selects the variant of calculations.sample_projection that POST /audits/{id}/project-sample runs."
        constraints: "one of MEAN_PER_UNIT, RATIO_ESTIMATION"
      - name: confidence_level_bp
        type: integer
        source: input
        description: Confidence level in basis points.
        constraints: "one of 9000, 9500, 9900"
      - name: minimum_sample_size
        type: integer
        source: input
        description: Minimum number of sample units fieldwork must examine before it may close.
        constraints: ">= 1"
      - name: round_number
        type: integer
        source: computed
        default: 1
        description: "Negotiation round; incremented by each revision. A revision attempted while round_number == MAX_NEGOTIATION_ROUNDS (3) is rejected."
      - name: strata
        type: array
        source: input
        description: "Ordered stratum definitions, each { period_start, period_end, population_base_amount_cents, population_unit_count }. Intervals are half-open [period_start, period_end); consecutive strata must be exactly adjacent and the union must equal [audit.scope_period_start, audit.scope_period_end + 1 day)."
        constraints: "1..12 entries"
      - name: population_base_amount_cents
        type: integer
        source: computed
        description: Sum of strata[].population_base_amount_cents; the denominator population for RATIO_ESTIMATION.
      - name: population_unit_count
        type: integer
        source: computed
        description: Sum of strata[].population_unit_count; the multiplier for MEAN_PER_UNIT.
      - name: examined_unit_count
        type: integer
        source: computed
        default: 0
        description: Count of SampleUnit rows created against this agreement.
      - name: counter_note
        type: string
        source: input
        default: null
        description: Taxpayer's objection recorded when countering.
      - name: requested_minimum_sample_size
        type: integer
        source: input
        default: null
        description: "Sample size the taxpayer asked for when countering; advisory only until an auditor revision adopts it into minimum_sample_size."
        constraints: ">= 1 when present"
      - name: agreed_by_name
        type: string
        source: input
        default: null
        description: Name of the taxpayer officer who accepted the methodology.

  - name: SampleUnit
    parent: null
    common_fields: true
    fields:
      - name: sampling_agreement_id
        type: string
        source: input
        description: "FK -> SamplingAgreement.id; the AGREED agreement this unit was drawn under."
      - name: stratum_index
        type: integer
        source: input
        description: 0-based index into the agreement's strata array.
        constraints: ">= 0 and < len(strata)"
      - name: invoice_reference
        type: string
        source: input
        description: Auditor's reference for the examined invoice.
      - name: invoice_date
        type: datetime
        source: input
        description: "Invoice date; must fall inside the half-open window [strata[stratum_index].period_start, strata[stratum_index].period_end)."
      - name: invoice_amount_cents
        type: integer
        source: input
        description: Total invoice amount in cents; the per-unit base for RATIO_ESTIMATION.
        constraints: "> 0"
      - name: exempt_sale_amount_cents
        type: integer
        source: input
        default: 0
        description: Portion of the invoice claimed exempt; the base for a CERTIFICATE_DEFECT error amount.
        constraints: ">= 0 and <= invoice_amount_cents"
      - name: error_class
        type: enum
        source: input
        default: PENDING
        description: "Auditor's determination for this unit. PENDING means undetermined, which excludes the unit from calculations.sample_projection entirely. UNREPORTED_TAXABLE_SALE and RATE_ERROR both require declared_error_amount_cents."
        constraints: "one of PENDING, NO_ERROR, UNREPORTED_TAXABLE_SALE, CERTIFICATE_DEFECT, RATE_ERROR"
      - name: declared_error_amount_cents
        type: integer
        source: input
        default: null
        description: Auditor-stated error in cents; required for UNREPORTED_TAXABLE_SALE and RATE_ERROR, forbidden otherwise.
        constraints: "null or >= 0"
      - name: error_amount_cents
        type: integer
        source: computed
        description: "0 for NO_ERROR; round_half_up(exempt_sale_amount_cents * STATE_SALES_TAX_RATE_BP / 10000) for CERTIFICATE_DEFECT; declared_error_amount_cents otherwise."
      - name: redetermination_count
        type: integer
        source: computed
        default: 0
        description: Number of times the determination has been changed after creation.

  - name: ExemptionCertificate
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> Audit.id; the audit reviewing this certificate."
      - name: sample_unit_id
        type: string
        source: input
        default: null
        description: "FK -> SampleUnit.id; the sampled invoice this certificate supports. When set, a rejection flows into the projection through the unit; when null, a rejection is assessed directly."
      - name: purchaser_name
        type: string
        source: input
        description: Name of the exempt purchaser named on the certificate.
      - name: purchaser_permit_number
        type: string
        source: input
        default: null
        description: Purchaser's permit number; a null value fails the good-faith standard.
      - name: claimed_exemption_type
        type: enum
        source: input
        description: Exemption category claimed.
        constraints: "one of RESALE, MANUFACTURING, AGRICULTURAL, NONPROFIT, GOVERNMENT"
      - name: covered_sale_amount_cents
        type: integer
        source: input
        description: Sale amount the certificate purports to exempt, in cents.
        constraints: "> 0"
      - name: received_before_sale
        type: boolean
        source: input
        description: Whether the seller held the certificate before the sale closed.
      - name: form_complete
        type: boolean
        source: input
        description: Whether every mandatory field of the state form is completed.
      - name: claimed_exemption_matches_purchaser_business
        type: boolean
        source: input
        description: Whether the claimed exemption is consistent with the purchaser's line of business.
      - name: good_faith_accepted
        type: boolean
        source: computed
        description: "True only when received_before_sale AND form_complete AND purchaser_permit_number is non-null AND claimed_exemption_matches_purchaser_business; a VALIDATED determination requires it."
      - name: status
        type: enum
        source: system
        default: ON_FILE
        description: Review state.
        constraints: "one of ON_FILE, VALIDATED, REJECTED, CURED"
      - name: cure_count
        type: integer
        source: computed
        default: 0
        description: Number of times the taxpayer has cured this certificate after a rejection.
      - name: missing_certificate_tax_cents
        type: integer
        source: computed
        description: "round_half_up(covered_sale_amount_cents * STATE_SALES_TAX_RATE_BP / 10000); enters Audit.certificate_deficiency_cents only while status == REJECTED and sample_unit_id is null."
      - name: review_note
        type: string
        source: input
        default: null
        description: Auditor's note recorded with the determination.

  - name: UseTaxPurchase
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> Audit.id; the audit assessing this untaxed purchase."
      - name: vendor_name
        type: string
        source: input
        description: Out-of-state vendor that invoiced the purchase without tax.
      - name: invoice_date
        type: datetime
        source: input
        description: Purchase invoice date; must fall inside the audit's scope period (closed interval).
      - name: purchase_price_cents
        type: integer
        source: input
        description: Invoiced purchase price in cents.
        constraints: "> 0"
      - name: asset_class
        type: enum
        source: input
        description: "Consumable supplies, capital equipment, or exempt manufacturing input; selects the basis branch of calculations.use_tax_liability."
        constraints: "one of CONSUMABLE, CAPITAL_ASSET, EXEMPT_MANUFACTURING"
      - name: in_state_usage_pct_bp
        type: integer
        source: input
        default: 10000
        description: In-state usage share in basis points; applied only on the CAPITAL_ASSET branch.
        constraints: "1..10000"
      - name: first_use_outside_state
        type: boolean
        source: input
        default: false
        description: Whether the asset was first used outside the state.
      - name: months_used_outside_state
        type: integer
        source: input
        default: 0
        description: Whole months of documented out-of-state use before entry.
        constraints: "0..600"
      - name: fair_market_value_at_entry_cents
        type: integer
        source: input
        default: null
        description: Fair market value when the asset entered the state; required when asset_class is CAPITAL_ASSET and first_use_outside_state is true and months_used_outside_state >= 6.
        constraints: "null or > 0"
      - name: tax_paid_other_state_cents
        type: integer
        source: input
        default: 0
        description: Sales or use tax already paid to another state, eligible as a credit.
        constraints: ">= 0"
      - name: taxable_basis_cents
        type: integer
        source: computed
        description: Basis after the asset-class branch and, on the capital-asset branch, after in-state apportionment.
      - name: gross_use_tax_cents
        type: integer
        source: computed
        description: "round_half_up(taxable_basis_cents * STATE_SALES_TAX_RATE_BP / 10000)."
      - name: credit_applied_cents
        type: integer
        source: computed
        description: "min(gross_use_tax_cents, tax_paid_other_state_cents)."
      - name: use_tax_due_cents
        type: integer
        source: computed
        description: "gross_use_tax_cents - credit_applied_cents."
      - name: reclassification_count
        type: integer
        source: computed
        default: 0
        description: Number of times the asset class or apportionment inputs have been changed after creation.

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: "FK -> Audit.id; the audit whose findings this notice assesses."
      - name: supersedes_assessment_id
        type: string
        source: input
        default: null
        description: "FK -> Assessment.id; the prior assessment this one replaces, null for a first assessment."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Notice axis of the parallel state machine; evolves independently of collection_status."
        constraints: "one of DRAFT, DRAFT_STALE, ISSUED, FINAL, WITHDRAWN, SUPERSEDED"
      - name: collection_status
        type: enum
        source: system
        default: NOT_DUE
        description: "Collection axis of the parallel state machine; evolves independently of status."
        constraints: "one of NOT_DUE, DUE, ARRANGED, REFERRED, SATISFIED"
      - name: collection_hold
        type: boolean
        source: computed
        default: false
        description: True while at least one AppealProceeding on this assessment is OPEN; blocks collection referral.
      - name: tax_deficiency_cents
        type: integer
        source: computed
        description: "projected_deficiency_cents + certificate_deficiency_cents + use_tax_deficiency_cents snapshotted from the audit when the amounts are computed."
      - name: penalty_rate_bp
        type: integer
        source: computed
        description: Negligence penalty rate selected by the tier table, or the fraud rate when the audit's fraud_indicator is set.
      - name: penalty_cents
        type: integer
        source: computed
        description: Negligence penalty after the small-balance waiver decision.
      - name: interest_days
        type: integer
        source: computed
        description: "max(0, logical clock date - (audit.scope_period_end + 1 day)) in whole days at the moment the amounts were computed."
      - name: interest_cents
        type: integer
        source: computed
        description: Simple interest on tax plus penalty (or on tax alone when the penalty was waived).
      - name: provisional_total_due_cents
        type: integer
        source: computed
        description: "tax_deficiency_cents + penalty (pre-waiver) + interest (pre-waiver); the value the small-balance threshold is tested against."
      - name: penalty_waived_small_balance
        type: boolean
        source: computed
        default: false
        description: True when provisional_total_due_cents <= SMALL_BALANCE_THRESHOLD_CENTS and the penalty was therefore zeroed.
      - name: total_due_cents
        type: integer
        source: computed
        description: Final assessed liability after the small-balance pass.
      - name: total_adjustments_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of AssessmentAdjustment.amount_cents over rows of this assessment whose status == POSTED (credits positive, fees negative)."
      - name: total_abated_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of amount_cents over POSTED adjustments whose kind == PENALTY_ABATEMENT."
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Cash recorded through POST /payment-arrangements/{id}/payments. Manual AssessmentAdjustment rows of kind PAYMENT flow through total_adjustments_cents instead, so the two aggregates never double-count the same money."
      - name: balance_due_cents
        type: integer
        source: computed
        description: "total_due_cents - total_adjustments_cents - amount_paid_cents; the conserved-money invariant balance_due_cents + total_adjustments_cents + amount_paid_cents == total_due_cents must hold after every mutation."
      - name: notice_mailed_date
        type: datetime
        source: input
        default: null
        description: Date the notice was mailed; must equal the logical clock date at issuance.
      - name: protest_deadline_date
        type: datetime
        source: computed
        default: null
        description: "notice_mailed_date + PROTEST_WINDOW_DAYS (60 calendar days); an informal conference filed on this date is timely."
      - name: issued_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock timestamp of issuance.

  - name: AssessmentAdjustment
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the assessment whose balance this row moves."
      - name: appeal_proceeding_id
        type: string
        source: input
        default: null
        description: "FK -> AppealProceeding.id; set only on rows a proceeding decision produced."
      - name: kind
        type: enum
        source: input
        description: "Ledger row type. Only PAYMENT may be posted by a client through POST /assessment-adjustments; PENALTY_ABATEMENT, APPEAL_REDUCTION, ASSESSMENT_VACATED, COLLECTION_FEE and OIC_WRITEOFF are SYSTEM-only and are written by cascades (ERR_ADJUSTMENT_KIND_SYSTEM_ONLY when a client names one)."
        constraints: "one of PENALTY_ABATEMENT, PAYMENT, APPEAL_REDUCTION, ASSESSMENT_VACATED, COLLECTION_FEE, OIC_WRITEOFF"
      - name: amount_cents
        type: integer
        source: input
        description: "Signed credit against total_due_cents: positive for PENALTY_ABATEMENT / PAYMENT / APPEAL_REDUCTION / ASSESSMENT_VACATED / OIC_WRITEOFF, negative for COLLECTION_FEE. Computed (input forbidden) for PENALTY_ABATEMENT and for every system kind."
      - name: status
        type: enum
        source: system
        default: POSTED
        description: Ledger row state; a REVERSED row no longer contributes to any Assessment total.
        constraints: "one of POSTED, REVERSED"
      - name: abatement_factors
        type: array
        source: input
        default: null
        description: "Non-empty array of recognized reasonable-cause factor names drawn from FIRST_TIME_COMPLIANT, RELIANCE_ON_WRITTEN_ADVICE, RECORDS_LOST_IN_DISASTER and SUBSTANTIAL_COOPERATION; carried onto the PENALTY_ABATEMENT row that POST /assessments/{id}/abate-penalty creates, null on every other kind. Never accepted on POST /assessment-adjustments."
      - name: abatement_pct
        type: integer
        source: computed
        default: null
        description: "Abatement percentage from calculations.penalty_abatement; null for non-abatement kinds."
      - name: posted_at
        type: datetime
        source: computed
        description: Logical-clock timestamp when the row was posted.
      - name: source
        type: enum
        source: computed
        description: MANUAL for rows posted through the adjustments endpoint, SYSTEM for rows a cascade produced.
        constraints: "one of MANUAL, SYSTEM"
      - name: reversal_reason
        type: string
        source: input
        default: null
        description: Reason recorded when a supervisor reverses the row.

  - name: AppealProceeding
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the assessment under protest."
      - name: predecessor_proceeding_id
        type: string
        source: input
        default: null
        description: "FK -> AppealProceeding.id; the forum this one escalates from, null for an informal conference."
      - name: forum
        type: enum
        source: input
        description: Escalation level; the ladder is INFORMAL_CONFERENCE -> ADMINISTRATIVE_APPEAL -> TAX_TRIBUNAL.
        constraints: "one of INFORMAL_CONFERENCE, ADMINISTRATIVE_APPEAL, TAX_TRIBUNAL"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Proceeding state.
        constraints: "one of OPEN, DECIDED"
      - name: outcome
        type: enum
        source: computed
        default: NONE
        description: Branch taken at decision; each branch carries a different side-effect set.
        constraints: "one of NONE, SUSTAINED, REDUCED, REMANDED"
      - name: protest_basis
        type: string
        source: input
        description: Taxpayer's stated grounds for protest.
        constraints: "1..500 chars"
      - name: filed_date
        type: datetime
        source: computed
        description: "Logical-clock date at filing. POST /appeal-proceedings accepts a filed_date in the body for symmetry with the paper form, but the value is ignored: the stored field is always the clock date."
      - name: decided_date
        type: datetime
        source: computed
        default: null
        description: Logical-clock date at decision.
      - name: tolled_days
        type: integer
        source: computed
        default: 0
        description: "(decided_date - filed_date) in whole days once DECIDED; feeds Audit.tolled_days."
      - name: presiding_officer_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the officer who decided the proceeding; must differ from the audit's lead_auditor_user_id and from the predecessor's presiding officer.
      - name: reduction_amount_cents
        type: integer
        source: input
        default: null
        description: Credit granted on a REDUCED outcome; required for REDUCED, forbidden otherwise.
        constraints: "null or > 0"
      - name: escalation_deadline_date
        type: datetime
        source: computed
        default: null
        description: "decided_date + ESCALATION_WINDOW_DAYS[next forum], which is 30 calendar days for ADMINISTRATIVE_APPEAL and 30 calendar days for TAX_TRIBUNAL; the next forum must be filed on or before this date."
      - name: decision_rationale
        type: string
        source: input
        default: null
        description: Officer's written rationale.

  - name: PaymentArrangement
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the assessment being paid down or compromised."
      - name: arrangement_type
        type: enum
        source: input
        description: Installment plan versus offer in compromise.
        constraints: "one of INSTALLMENT_PLAN, OFFER_IN_COMPROMISE"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: Arrangement state.
        constraints: "one of REQUESTED, APPROVED, COMPLETED, DEFAULTED, CANCELLED"
      - name: monthly_installment_cents
        type: integer
        source: input
        default: null
        description: Monthly installment; required for INSTALLMENT_PLAN, forbidden for OFFER_IN_COMPROMISE.
        constraints: "null or > 0"
      - name: term_months
        type: integer
        source: input
        default: null
        description: Number of installments; required for INSTALLMENT_PLAN, forbidden for OFFER_IN_COMPROMISE.
        constraints: "null or 1..72"
      - name: offer_amount_cents
        type: integer
        source: input
        default: null
        description: Compromise amount offered; required for OFFER_IN_COMPROMISE, forbidden for INSTALLMENT_PLAN.
        constraints: "null or > 0"
      - name: hardship_documented
        type: boolean
        source: input
        default: false
        description: Whether financial hardship documentation is on file; required true to approve an offer in compromise.
      - name: scheduled_total_cents
        type: integer
        source: computed
        description: "monthly_installment_cents * term_months for an installment plan, offer_amount_cents for an offer in compromise."
      - name: payments_made_count
        type: integer
        source: computed
        default: 0
        description: Number of POSTED payment rows recorded through this arrangement.
      - name: amount_paid_cents
        type: integer
        source: computed
        default: 0
        description: Sum of amounts recorded through this arrangement.
      - name: approved_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock timestamp of approval.
      - name: default_reason
        type: string
        source: input
        default: null
        description: Reason recorded when collections declares the arrangement in default.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: AuditLead
    initial_state: SCORED
    terminal_states: [NOT_SELECTED, CONVERTED, DECLINED]
    transitions:
      - from: SCORED
        to: SELECTED
        trigger: "POST /industry-projects/{id}/selection-runs (same run that created the lead)"
        actor: system
        preconditions:
          - "risk_score >= IndustryProject.selection_threshold_score"
          - "IndustryProject.selections_remaining > 0 at the moment this lead is reached in rank order (risk_score DESC, then Taxpayer.created_at ASC)"
        side_effects:
          - "sets rank_position, risk_score and score_breakdown from calculations.taxpayer_risk_score under the project's selection_mode"
          - "increments IndustryProject.selections_used by 1 and decrements IndustryProject.selections_remaining by 1"
          - "sets IndustryProject.last_cutoff_score to this lead's risk_score when it is the lowest-ranked lead the run selected"
      - from: SCORED
        to: NOT_SELECTED
        trigger: "POST /industry-projects/{id}/selection-runs (same run that created the lead)"
        actor: system
        preconditions:
          - "risk_score < IndustryProject.selection_threshold_score"
        side_effects:
          - "sets rank_position, risk_score and score_breakdown; leaves IndustryProject.selections_used unchanged"
        note: "A lead that meets the threshold but finds selections_remaining == 0 stays in SCORED as a waitlist entry; it is not NOT_SELECTED."
      - from: SCORED
        to: SELECTED
        trigger: "system waitlist promotion during POST /audit-leads/{id}/decline on a sibling lead"
        actor: system
        preconditions:
          - "the declined sibling lead was SELECTED"
          - "this lead is the SCORED lead of the same IndustryProject with the highest risk_score, tie-broken by created_at ASC"
          - "risk_score >= IndustryProject.selection_threshold_score"
        side_effects:
          - "sets promoted_from_scored = true"
          - "increments IndustryProject.selections_used by 1 and decrements selections_remaining by 1, restoring the slot the decline released"
      - from: SELECTED
        to: DECLINED
        trigger: "POST /audit-leads/{id}/decline"
        actor: SelectionAnalyst
        preconditions:
          - "status == SELECTED or status == SCORED"
        side_effects:
          - "records decline_reason"
          - "decrements IndustryProject.selections_used by 1 and increments selections_remaining by 1 (only when the lead was SELECTED)"
          - "then promotes the highest-ranked remaining SCORED lead of the same project (see the promotion transition above); the promotion re-consumes the released slot, so selection_quota == selections_used + selections_remaining is preserved at every step"
      - from: SCORED
        to: DECLINED
        trigger: "POST /audit-leads/{id}/decline"
        actor: SelectionAnalyst
        preconditions:
          - "status == SCORED"
        side_effects:
          - "records decline_reason; leaves IndustryProject.selections_used and selections_remaining unchanged and triggers no promotion"
      - from: SELECTED
        to: CONVERTED
        trigger: "POST /audit-leads/{id}/convert"
        actor: AuditSupervisor
        preconditions:
          - "status == SELECTED"
          - "Taxpayer.open_audit_count == 0"
        side_effects:
          - "creates an Audit in PLANNED with taxpayer_id, audit_lead_id and lead_auditor_user_id"
          - "increments Taxpayer.open_audit_count by 1"
          - "IndustryProject.selections_used is unchanged (SELECTED and CONVERTED both consume a slot)"

  - entity: Audit
    initial_state: PLANNED
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: PLANNED
        to: SCOPED
        trigger: "POST /audits/{id}/scope"
        actor: FieldAuditor
        preconditions:
          - "status == PLANNED"
          - "scope_period_start <= scope_period_end"
          - "no other Audit of the same Taxpayer whose status is not ABANDONED — CLOSED audits included, because a period is audited once — has a scope period overlapping [scope_period_start, scope_period_end] under closed-interval semantics (a shared endpoint day is an overlap)"
        side_effects:
          - "stores audit_type, scope_period_start, scope_period_end"
          - "sets base_statute_expiry_date = scope_period_end + STATUTE_BASE_DAYS and recomputes statute_expiry_date via calculations.statute_expiry"
      - from: SCOPED
        to: FIELDWORK
        trigger: "POST /sampling-agreements/{id}/agree (cascade from the agreement reaching AGREED)"
        actor: system
        preconditions:
          - "status == SCOPED"
        side_effects:
          - "sets agreed_agreement_id to the accepted agreement"
          - "supersedes every other SamplingAgreement of this audit whose status is in {PROPOSED, COUNTERED}"
      - from: FIELDWORK
        to: REVIEW_COMPLETE
        trigger: "POST /audits/{id}/close-fieldwork"
        actor: AuditSupervisor
        preconditions:
          - "status == FIELDWORK"
          - "statute_status != EXPIRED"
          - "projection_status == CURRENT"
          - "examined_unit_count >= the agreed agreement's minimum_sample_size"
        side_effects:
          - "stores fraud_indicator"
          - "freezes the finding set: sample units, certificates and use-tax purchases may no longer be created or changed"
      - from: REVIEW_COMPLETE
        to: FIELDWORK
        trigger: "POST /audits/{id}/reopen-fieldwork"
        actor: AuditSupervisor
        preconditions:
          - "status == REVIEW_COMPLETE"
          - "no Assessment of this audit has status ISSUED or FINAL"
          - "statute_status != EXPIRED"
        side_effects:
          - "increments reopen_count by 1 and unfreezes the finding set so sample units, certificates and use-tax purchases may be added or changed again"
          - "leaves projection_status at CURRENT: reopening by itself changes no finding, so a DRAFT Assessment of this audit stays DRAFT until an actual finding moves"
        note: "The supervisor-driven half of the Audit cycle: REVIEW_COMPLETE -> FIELDWORK -> REVIEW_COMPLETE. The other half is the remand cascade from ASSESSED."
      - from: REVIEW_COMPLETE
        to: ASSESSED
        trigger: "POST /assessments/{id}/issue (cascade from the assessment reaching ISSUED)"
        actor: system
        preconditions:
          - "status == REVIEW_COMPLETE"
        side_effects:
          - "no field of the audit other than updated_at/version changes"
      - from: ASSESSED
        to: FIELDWORK
        trigger: "POST /appeal-proceedings/{id}/decision with outcome REMANDED (cascade)"
        actor: system
        preconditions:
          - "status == ASSESSED"
        side_effects:
          - "increments reopen_count by 1"
          - "sets projection_status = STALE"
          - "recomputes statute_expiry_date via calculations.statute_expiry, now including the proceeding's tolled_days"
        note: "This is the cycle that makes the Audit machine non-linear: ASSESSED -> FIELDWORK -> REVIEW_COMPLETE -> ASSESSED."
      - from: ASSESSED
        to: CLOSED
        trigger: "POST /assessments/{id}/finalize or POST /appeal-proceedings/{id}/decision with forum TAX_TRIBUNAL and outcome SUSTAINED (cascade from the assessment reaching FINAL)"
        actor: system
        preconditions:
          - "status == ASSESSED"
          - "the assessment that triggered the cascade reached status FINAL"
        side_effects:
          - "decrements Taxpayer.open_audit_count by 1, which restores the taxpayer's eligibility for future selection runs"
      - from: PLANNED
        to: ABANDONED
        trigger: "POST /audits/{id}/abandon"
        actor: AuditSupervisor
        preconditions:
          - "status is in {PLANNED, SCOPED, FIELDWORK, REVIEW_COMPLETE}"
          - "statute_status == EXPIRED"
        side_effects:
          - "supersedes every SamplingAgreement of this audit whose status is in {PROPOSED, COUNTERED}"
          - "decrements Taxpayer.open_audit_count by 1"
        note: "The same transition definition applies from SCOPED, FIELDWORK and REVIEW_COMPLETE."

  - entity: StatuteWaiver
    initial_state: DRAFTED
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFTED
        to: EXECUTED
        trigger: "POST /statute-waivers/{id}/execute"
        actor: Taxpayer
        preconditions:
          - "status == DRAFTED"
          - "Audit.status is in {SCOPED, FIELDWORK, REVIEW_COMPLETE}"
          - "Audit.statute_status != EXPIRED"
          - "signed_date equals the logical clock date"
        side_effects:
          - "sets prior_expiry_date = Audit.statute_expiry_date and days_added = extended_to_date - prior_expiry_date in whole days"
          - "recomputes Audit.statute_expiry_date and Audit.waiver_days_added via calculations.statute_expiry (hop 2)"
          - "that recomputation moves Audit.statute_status, evaluated at read time, from EXPIRING_SOON to PROTECTED (hop 3), which is what re-enables POST /audits/{id}/close-fieldwork and POST /assessments"
      - from: EXECUTED
        to: VOIDED
        trigger: "POST /statute-waivers/{id}/void"
        actor: AuditSupervisor
        preconditions:
          - "status == EXECUTED"
          - "Audit.status is in {SCOPED, FIELDWORK, REVIEW_COMPLETE}"
        side_effects:
          - "sets days_added = 0 and records void_reason"
          - "recomputes Audit.statute_expiry_date and Audit.waiver_days_added via calculations.statute_expiry; with no other executed waiver the audit returns exactly to base_statute_expiry_date + tolled_days (conserved-days invariant)"
      - from: DRAFTED
        to: VOIDED
        trigger: "POST /statute-waivers/{id}/void"
        actor: AuditSupervisor
        preconditions:
          - "status == DRAFTED"
        side_effects:
          - "records void_reason; Audit.statute_expiry_date is unchanged because an unexecuted waiver never contributed days"

  - entity: SamplingAgreement
    initial_state: PROPOSED
    terminal_states: [AGREED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /sampling-agreements/{id}/counter"
        actor: Taxpayer
        preconditions:
          - "status == PROPOSED"
          - "Audit.status == SCOPED"
        side_effects:
          - "records counter_note and requested_minimum_sample_size"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /sampling-agreements/{id}/revise"
        actor: FieldAuditor
        preconditions:
          - "status == COUNTERED"
          - "round_number < MAX_NEGOTIATION_ROUNDS"
          - "any supplied strata array still tiles the audit scope exactly"
        side_effects:
          - "increments round_number by 1"
          - "overwrites methodology, confidence_level_bp, minimum_sample_size and strata with the supplied values and recomputes population_base_amount_cents and population_unit_count"
        note: "This is the negotiation cycle PROPOSED -> COUNTERED -> PROPOSED, bounded at MAX_NEGOTIATION_ROUNDS rounds."
      - from: PROPOSED
        to: AGREED
        trigger: "POST /sampling-agreements/{id}/agree"
        actor: Taxpayer
        preconditions:
          - "status == PROPOSED"
          - "Audit.status == SCOPED"
          - "Audit.statute_status != EXPIRED"
        side_effects:
          - "records agreed_by_name"
          - "sets Audit.agreed_agreement_id = this.id and moves Audit.status SCOPED -> FIELDWORK"
          - "moves every other SamplingAgreement of this audit in {PROPOSED, COUNTERED} to SUPERSEDED"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /sampling-agreements (a new proposal naming this row in supersedes_agreement_id) or POST /sampling-agreements/{id}/agree on a sibling or POST /audits/{id}/abandon"
        actor: system
        preconditions:
          - "status is in {PROPOSED, COUNTERED}"
        side_effects:
          - "no further counter, revise or agree call is accepted on this row"
        note: "The same transition definition applies from COUNTERED."

  - entity: ExemptionCertificate
    initial_state: ON_FILE
    terminal_states: [VALIDATED]
    transitions:
      - from: ON_FILE
        to: VALIDATED
        trigger: "POST /exemption-certificates/{id}/review with determination VALIDATED"
        actor: FieldAuditor
        preconditions:
          - "status == ON_FILE"
          - "good_faith_accepted == true"
          - "Audit.status == FIELDWORK"
        side_effects:
          - "records review_note"
          - "when sample_unit_id is set and that unit's error_class == CERTIFICATE_DEFECT, resets the unit to error_class NO_ERROR and error_amount_cents 0, then sets Audit.projection_status = STALE (compensating reversal of the rejection cascade)"
      - from: ON_FILE
        to: REJECTED
        trigger: "POST /exemption-certificates/{id}/review with determination REJECTED"
        actor: FieldAuditor
        preconditions:
          - "status == ON_FILE"
          - "Audit.status == FIELDWORK"
        side_effects:
          - "hop 1: records review_note and the REJECTED status"
          - "hop 2: caused by hop 1, when sample_unit_id is set the referenced SampleUnit is redetermined to error_class CERTIFICATE_DEFECT with error_amount_cents = round_half_up(exempt_sale_amount_cents * STATE_SALES_TAX_RATE_BP / 10000); when sample_unit_id is null, Audit.certificate_deficiency_cents is instead recomputed via calculations.certificate_deficiency"
          - "hop 3: caused by hop 2, Audit.sample_error_rate_bp becomes unreliable and Audit.projection_status is set to STALE"
          - "hop 4: caused by hop 3, every Assessment of this audit whose status == DRAFT moves to DRAFT_STALE"
      - from: REJECTED
        to: CURED
        trigger: "POST /exemption-certificates/{id}/cure"
        actor: Taxpayer
        preconditions:
          - "status == REJECTED"
          - "Audit.status == FIELDWORK"
        side_effects:
          - "overwrites purchaser_permit_number, received_before_sale, form_complete and claimed_exemption_matches_purchaser_business, then recomputes good_faith_accepted"
          - "increments cure_count by 1"
          - "leaves the linked SampleUnit determination and Audit.certificate_deficiency_cents untouched until the next review"
        note: "REJECTED -> CURED -> REJECTED is the certificate revision cycle."
      - from: CURED
        to: REJECTED
        trigger: "POST /exemption-certificates/{id}/review with determination REJECTED"
        actor: FieldAuditor
        preconditions:
          - "status == CURED"
          - "Audit.status == FIELDWORK"
        side_effects:
          - "same four-hop cascade as the ON_FILE -> REJECTED transition"
      - from: CURED
        to: VALIDATED
        trigger: "POST /exemption-certificates/{id}/review with determination VALIDATED"
        actor: FieldAuditor
        preconditions:
          - "status == CURED"
          - "good_faith_accepted == true (recomputed by the cure, so a cure that supplied the missing particular unblocks this edge)"
          - "Audit.status == FIELDWORK"
        side_effects:
          - "records review_note and moves the certificate to its terminal state"
          - "recomputes Audit.certificate_deficiency_cents via calculations.certificate_deficiency, which drops this certificate's missing_certificate_tax_cents out of the sum and resets that field to 0"
          - "when sample_unit_id is set and that unit's error_class == CERTIFICATE_DEFECT, resets the unit to error_class NO_ERROR and error_amount_cents 0, then sets Audit.projection_status = STALE"

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [FINAL, WITHDRAWN, SUPERSEDED]
    transitions:
      # ---- axis 1 of 2: `status` (notice axis). Evolves independently of `collection_status`.
      - from: DRAFT
        to: DRAFT_STALE
        trigger: "POST /sample-units, POST /sample-units/{id}/redetermine, POST /exemption-certificates/{id}/review, POST /use-tax-purchases, POST /use-tax-purchases/{id}/reclassify (cascade from Audit.projection_status becoming STALE or from a deficiency component changing)"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "the stored amounts are frozen as they were and issuance is blocked until a recompute"
        note: "dimension: status"
      - from: DRAFT_STALE
        to: DRAFT
        trigger: "POST /assessments/{id}/recompute"
        actor: AuditSupervisor
        preconditions:
          - "status == DRAFT_STALE"
          - "Audit.projection_status == CURRENT"
        side_effects:
          - "re-runs calculations.assessment_liability_rollup and overwrites tax_deficiency_cents, penalty_rate_bp, penalty_cents, interest_days, interest_cents, provisional_total_due_cents, penalty_waived_small_balance, total_due_cents and balance_due_cents"
        note: "dimension: status"
      - from: DRAFT
        to: ISSUED
        trigger: "POST /assessments/{id}/issue"
        actor: AuditSupervisor
        preconditions:
          - "status == DRAFT (DRAFT_STALE is rejected)"
          - "Audit.status == REVIEW_COMPLETE"
          - "Audit.statute_status != EXPIRED"
          - "notice_mailed_date equals the logical clock date"
        side_effects:
          - "sets issued_at and protest_deadline_date = notice_mailed_date + PROTEST_WINDOW_DAYS"
          - "moves collection_status NOT_DUE -> DUE on the collection axis"
          - "moves Audit.status REVIEW_COMPLETE -> ASSESSED"
        note: "dimension: status (with a one-time kick of the collection axis)"
      - from: ISSUED
        to: FINAL
        trigger: "POST /assessments/{id}/finalize, or POST /appeal-proceedings/{id}/decision with forum TAX_TRIBUNAL and outcome in {SUSTAINED, REDUCED} (cascade)"
        actor: AuditSupervisor
        preconditions:
          - "status == ISSUED"
          - "no AppealProceeding of this assessment is OPEN"
          - "the logical clock date is strictly after protest_deadline_date, and strictly after escalation_deadline_date of every DECIDED proceeding of this assessment"
        side_effects:
          - "cascades Audit.status ASSESSED -> CLOSED, which decrements Taxpayer.open_audit_count by 1"
        note: "dimension: status. The tribunal cascade bypasses the deadline preconditions because the ladder is exhausted."
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /appeal-proceedings/{id}/decision with outcome REMANDED (cascade)"
        actor: system
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "posts a SYSTEM AssessmentAdjustment of kind ASSESSMENT_VACATED for the full remaining balance_due_cents, driving balance_due_cents to 0"
          - "moves collection_status to NOT_DUE and clears collection_hold"
          - "moves every PaymentArrangement of this assessment in {REQUESTED, APPROVED} to CANCELLED"
        note: "dimension: status"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /assessments naming this row in supersedes_assessment_id"
        actor: AuditSupervisor
        preconditions:
          - "status is in {DRAFT, DRAFT_STALE, ISSUED}"
        side_effects:
          - "no further recompute, issue, finalize, adjustment or proceeding is accepted against this row"
        note: "dimension: status. The same transition definition applies from DRAFT_STALE and ISSUED."
      # ---- axis 2 of 2: `collection_status` (collection axis). Evolves independently of `status`.
      - from: DUE
        to: ARRANGED
        trigger: "POST /payment-arrangements/{id}/approve"
        actor: CollectionsAgent
        preconditions:
          - "collection_status is in {DUE, REFERRED}"
        side_effects:
          - "no change to the notice axis: an assessment may sit at status ISSUED or FINAL while ARRANGED"
        note: "dimension: collection_status"
      - from: DUE
        to: REFERRED
        trigger: "POST /assessments/{id}/collection-referral, or POST /payment-arrangements/{id}/default (cascade)"
        actor: CollectionsAgent
        preconditions:
          - "collection_status is in {DUE, ARRANGED}"
          - "collection_hold == false"
        side_effects:
          - "hop 1: collection_status becomes REFERRED"
          - "hop 2: caused by hop 1, a SYSTEM AssessmentAdjustment of kind COLLECTION_FEE is posted with amount_cents = -round_half_up(balance_due_cents * COLLECTION_FEE_BP / 10000) with COLLECTION_FEE_BP = 1000 (10 percent), which raises balance_due_cents"
          - "hop 3: caused by hop 2, Taxpayer.compliance_status becomes DELINQUENT"
        note: "dimension: collection_status. The same transition definition applies from ARRANGED."
      - from: DUE
        to: SATISFIED
        trigger: "POST /assessment-adjustments, POST /payment-arrangements/{id}/payments, or POST /appeal-proceedings/{id}/decision with outcome REDUCED (cascade from balance_due_cents reaching 0)"
        actor: system
        preconditions:
          - "collection_status is in {DUE, ARRANGED, REFERRED}"
          - "balance_due_cents == 0 after the posting"
        side_effects:
          - "moves every PaymentArrangement of this assessment in {REQUESTED, APPROVED} to COMPLETED"
          - "that completion recomputes Taxpayer.compliance_status to COMPLIANT when no other Assessment of the taxpayer has collection_status == REFERRED"
        note: "dimension: collection_status. The same transition definition applies from ARRANGED and REFERRED."

  - entity: AppealProceeding
    initial_state: OPEN
    terminal_states: [DECIDED]
    transitions:
      - from: OPEN
        to: DECIDED
        trigger: "POST /appeal-proceedings/{id}/decision with outcome SUSTAINED"
        actor: AppealsOfficer
        preconditions:
          - "status == OPEN"
          - "the acting role matches the forum: AppealsOfficer for INFORMAL_CONFERENCE and ADMINISTRATIVE_APPEAL, TaxTribunalJudge for TAX_TRIBUNAL"
          - "X-User-ID differs from Audit.lead_auditor_user_id and from the predecessor proceeding's presiding_officer_user_id"
          - "reduction_amount_cents is absent"
        side_effects:
          - "sets outcome SUSTAINED, decided_date, tolled_days = decided_date - filed_date, presiding_officer_user_id"
          - "clears Assessment.collection_hold when no other proceeding of that assessment is OPEN"
          - "sets escalation_deadline_date = decided_date + ESCALATION_WINDOW_DAYS of the next forum, or null when forum == TAX_TRIBUNAL"
          - "when forum == TAX_TRIBUNAL, moves Assessment.status ISSUED -> FINAL (which cascades Audit -> CLOSED and Taxpayer.open_audit_count -1)"
          - "recomputes Audit.statute_expiry_date via calculations.statute_expiry, now including this proceeding's tolled_days"
        note: "Branch 1 of 3. No ledger row is written on this branch."
      - from: OPEN
        to: DECIDED
        trigger: "POST /appeal-proceedings/{id}/decision with outcome REDUCED"
        actor: AppealsOfficer
        preconditions:
          - "status == OPEN"
          - "the acting role matches the forum and X-User-ID satisfies the segregation-of-duties checks"
          - "reduction_amount_cents is present and <= Assessment.balance_due_cents"
        side_effects:
          - "hop 1: sets outcome REDUCED, decided_date, tolled_days, presiding_officer_user_id, escalation_deadline_date"
          - "hop 2: caused by hop 1, posts a SYSTEM AssessmentAdjustment of kind APPEAL_REDUCTION with amount_cents = reduction_amount_cents and appeal_proceeding_id = this proceeding"
          - "hop 3: caused by hop 2, recomputes Assessment.total_adjustments_cents and balance_due_cents; when balance_due_cents reaches 0 the collection axis moves to SATISFIED"
          - "hop 4: caused by hop 3, every PaymentArrangement of the assessment in {REQUESTED, APPROVED} moves to COMPLETED"
          - "hop 5: caused by hop 4, Taxpayer.compliance_status is recomputed to COMPLIANT when the taxpayer has no Assessment with collection_status == REFERRED"
          - "when forum == TAX_TRIBUNAL, also moves Assessment.status ISSUED -> FINAL"
          - "recomputes Audit.statute_expiry_date via calculations.statute_expiry"
        note: "Branch 2 of 3 — the deepest cascade in the scaffold."
      - from: OPEN
        to: DECIDED
        trigger: "POST /appeal-proceedings/{id}/decision with outcome REMANDED"
        actor: AppealsOfficer
        preconditions:
          - "status == OPEN"
          - "the acting role matches the forum and X-User-ID satisfies the segregation-of-duties checks"
          - "forum != TAX_TRIBUNAL (the tribunal may not remand)"
          - "reduction_amount_cents is absent"
        side_effects:
          - "sets outcome REMANDED, decided_date, tolled_days, presiding_officer_user_id and escalation_deadline_date = null"
          - "moves Assessment.status ISSUED -> WITHDRAWN, posts a SYSTEM ASSESSMENT_VACATED adjustment for the whole remaining balance, resets collection_status to NOT_DUE and cancels the assessment's arrangements"
          - "moves Audit.status ASSESSED -> FIELDWORK, increments Audit.reopen_count and sets Audit.projection_status = STALE"
          - "recomputes Audit.statute_expiry_date via calculations.statute_expiry, adding this proceeding's tolled_days"
        note: "Branch 3 of 3 — the branch that closes the Audit cycle."

  - entity: PaymentArrangement
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DEFAULTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /payment-arrangements/{id}/approve"
        actor: CollectionsAgent
        preconditions:
          - "status == REQUESTED"
          - "Assessment.status == ISSUED or Assessment.status == FINAL"
          - "Assessment.collection_status is in {DUE, REFERRED}"
          - "no AppealProceeding of the assessment is OPEN"
          - "for INSTALLMENT_PLAN: scheduled_total_cents >= Assessment.balance_due_cents"
          - "for OFFER_IN_COMPROMISE: hardship_documented == true and offer_amount_cents * 10000 >= MIN_OIC_BP * Assessment.balance_due_cents, where MIN_OIC_BP is 2000 (20 percent of the balance, no rounding: the comparison is done on the cross-multiplied integers)"
        side_effects:
          - "sets approved_at"
          - "moves Assessment.collection_status to ARRANGED"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /payment-arrangements/{id}/payments (cascade when the arrangement is fully performed) or a cascade from Assessment.collection_status reaching SATISFIED"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "for INSTALLMENT_PLAN: Assessment.balance_due_cents == 0; for OFFER_IN_COMPROMISE: amount_paid_cents >= offer_amount_cents"
        side_effects:
          - "for OFFER_IN_COMPROMISE, first posts a SYSTEM AssessmentAdjustment of kind OIC_WRITEOFF for the remaining balance_due_cents, driving it to 0"
          - "moves Assessment.collection_status to SATISFIED"
          - "recomputes Taxpayer.compliance_status to COMPLIANT when the taxpayer has no Assessment with collection_status == REFERRED"
      - from: APPROVED
        to: DEFAULTED
        trigger: "POST /payment-arrangements/{id}/default"
        actor: CollectionsAgent
        preconditions:
          - "status == APPROVED"
          - "Assessment.balance_due_cents > 0"
        side_effects:
          - "hop 1: records default_reason and the DEFAULTED status"
          - "hop 2: caused by hop 1, moves Assessment.collection_status to REFERRED and posts a SYSTEM COLLECTION_FEE adjustment of -round_half_up(balance_due_cents * COLLECTION_FEE_BP / 10000)"
          - "hop 3: caused by hop 2, sets Taxpayer.compliance_status to DELINQUENT"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /appeal-proceedings/{id}/decision with outcome REMANDED (cascade)"
        actor: system
        preconditions:
          - "status is in {REQUESTED, APPROVED}"
        side_effects:
          - "when the row was APPROVED, moves Assessment.collection_status back to NOT_DUE as part of the vacate cascade"
        note: "The same transition definition applies from APPROVED."

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: sampling-agreement-propose-stale-audit
    parent_entity: Audit
    write_endpoint: "POST /sampling-agreements"
    occ_field: "expected_audit_version"
    description: |
      Proposing a SamplingAgreement against an Audit whose version has advanced
      since the client last read it is rejected. A proposal legitimately
      supersedes whichever PROPOSED or COUNTERED agreement the audit already
      carries, so a writer holding a stale view of the audit would silently
      discard a methodology round it never saw; the stale-version check turns
      that into an explicit rejection.
    error_id: ERR_STALE_AUDIT_VERSION
    http_status: 412
  - rule_id: adjustment-post-stale-assessment
    parent_entity: Assessment
    write_endpoint: "POST /assessment-adjustments"
    occ_field: "expected_assessment_version"
    description: |
      Posting an AssessmentAdjustment against an Assessment whose version has
      advanced since the client last read it is rejected. Adjustments
      legitimately accumulate, so a second posting computed against an older
      balance_due_cents would abate or credit an amount the ledger no longer
      supports; the stale-version check forces the writer to re-read the
      assessment first.
    error_id: ERR_STALE_ASSESSMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: taxpayer_risk_score
    trigger: "SCREENING variant on POST /taxpayers/{id}/rescore-screening and on every POST /information-returns that lands in the scoring window; FULL variant on POST /industry-projects/{id}/selection-runs (writes AuditLead.risk_score)"
    algorithm: weighted_scoring
    formula: |
      # --- component points, each an integer in basis points (0..10000) ---
      # 1. information-return variance
      # the denominator is the taxpayer's OWN reported figure, so the score answers
      # "what fraction of what you reported is unexplained", and a taxpayer with no
      # returns in the window scores 0 on this component rather than dividing by zero.
      if Taxpayer.reported_total_cents == 0:
          variance_bp = 0
      else:
          delta = abs(reported_total_cents - matched_total_cents)
          variance_bp = min(10000, round_half_up(delta * 10000 / reported_total_cents))
      # 2. filing delinquency
      delinquency_bp = min(10000, delinquent_period_count * DELINQUENCY_BP_PER_PERIOD)
      # 3. magnitude of the taxpayer, capped
      magnitude_bp = min(10000, round_half_up(
          min(gross_receipts_annual_cents, MAGNITUDE_CAP_CENTS) * 10000 / MAGNITUDE_CAP_CENTS))
      # 4. prior audit history; an unaudited taxpayer scores the neutral prior
      prior_bp = NEUTRAL_PRIOR_BP if prior_audit_error_rate_bp is null
                 else min(10000, prior_audit_error_rate_bp)
      # 5. industry error rate (FULL only; sourced from IndustryProject.industry_error_rate_bp)
      industry_bp = min(10000, IndustryProject.industry_error_rate_bp)

      # --- variant weighting; weights are applied to the raw bp components and the
      #     WHOLE weighted sum is divided once, so no per-component rounding drift ---
      if variant == SCREENING:                       # 2 factors, weights sum to 100
          score = round_half_up((60*variance_bp + 40*delinquency_bp) / 1000)
      if variant == FULL:                            # 5 factors, weights sum to 100
          score = round_half_up((35*variance_bp + 20*delinquency_bp + 20*industry_bp
                                 + 15*magnitude_bp + 10*prior_bp) / 1000)
      # score is an integer 0..1000. Component points are also persisted:
      # Taxpayer.info_variance_bp, .delinquency_bp, .magnitude_bp, .prior_audit_bp
      # and AuditLead.score_breakdown (a map of the five component bp values).

      # --- ranking of the leads produced by one FULL scoring run ---
      # order by risk_score DESC, then Taxpayer.created_at ASC; rank_position is 1-based.
      # Selection then walks that order:
      #   selection_mode == THRESHOLD: select while risk_score >= selection_threshold_score
      #   selection_mode == QUOTA:     select the first selection_quota leads
      #   selection_mode == HYBRID:    select while BOTH conditions hold
    input_set: |
      Only Taxpayer rows with compliance_status != REVOKED and open_audit_count == 0 are
      scored by a project run. Only InformationReturn rows whose in_scoring_window is
      true — period_end within the audit-scope window of the project run, i.e.
      period_end >= (clock date - STATUTE_BASE_DAYS) — contribute to reported_total_cents
      and matched_total_cents. A return whose matched_return_amount_cents is 0 contributes its
      reported_amount_cents but nothing to matched_total_cents.
    constants:
      DELINQUENCY_BP_PER_PERIOD: 2500
      MAGNITUDE_CAP_CENTS: 5000000000
      NEUTRAL_PRIOR_BP: 3500
      STATUTE_BASE_DAYS: 1095
      SCREENING_WEIGHTS: "variance 60, delinquency 40"
      FULL_WEIGHTS: "variance 35, delinquency 20, industry 20, magnitude 15, prior 10"
    precision: "integer cents in, integer score out; every division is round_half_up on the whole weighted numerator, never per component"
    variants:
      - name: SCREENING
        when: "pre-selection triage of a single taxpayer; written to Taxpayer.screening_score"
        difference: "uses only the variance and delinquency components with weights 60/40; ignores industry, magnitude and prior-audit history entirely"
      - name: FULL
        when: "a project scoring run; written to AuditLead.risk_score with score_variant = FULL"
        difference: "adds the industry, magnitude and neutral-prior components and reweights all five to 35/20/20/15/10, so the same taxpayer generally lands on a different integer than its screening score"
    worked_example: |
      Taxpayer T1: reported_total_cents 120000000, matched_total_cents 90000000,
      delinquent_period_count 2, gross_receipts_annual_cents 250000000,
      prior_audit_error_rate_bp null. IndustryProject.industry_error_rate_bp 4200.
        variance_bp    = round_half_up(30000000*10000/120000000) = 2500
        delinquency_bp = 2*2500 = 5000
        magnitude_bp   = round_half_up(250000000*10000/5000000000) = 500
        prior_bp       = 3500 (neutral, unaudited)
        industry_bp    = 4200
        SCREENING = round_half_up((60*2500 + 40*5000)/1000) = 350
        FULL      = round_half_up((35*2500 + 20*5000 + 20*4200 + 15*500 + 10*3500)/1000)
                  = round_half_up(314000/1000) = 314
      Taxpayer T2: reported 200000000, matched 100000000, delinquent 0,
      gross 1000000000, prior_audit_error_rate_bp 6000
        -> variance 5000, delinquency 0, magnitude 2000, prior 6000
        -> SCREENING 300, FULL 349.
      Taxpayer T3: no InformationReturn rows (reported 0, matched 0), delinquent 1,
      gross 100000000, prior null -> variance 0, delinquency 2500, magnitude 200,
      prior 3500 -> SCREENING 100, FULL 172.
      T1 ranks first on SCREENING (350 > 300 > 100) but second on FULL (349 > 314 > 172):
      the two variants disagree about the ordering of the same three taxpayers.

  - name: sample_projection
    trigger: "POST /audits/{id}/project-sample; also re-run by POST /assessments/{id}/recompute"
    algorithm: projection
    formula: |
      units      = examined SampleUnit rows of Audit.agreed_agreement_id (see input_set)
      sum_err    = sum(u.error_amount_cents for u in units)
      sum_base   = sum(u.invoice_amount_cents for u in units)
      n          = count(units)

      if variant == MEAN_PER_UNIT:
          mean_unit_error = round_half_up(sum_err / n)            # round FIRST
          projected       = mean_unit_error * population_unit_count
          sample_error_rate_bp = round_half_up(sum_err * 10000 / sum_base)   # reported only
      if variant == RATIO_ESTIMATION:
          # MANDATORY ORDER: the rate is rounded to a WHOLE basis point first, and only
          # then multiplied by the population base. Multiplying the unrounded ratio by
          # the base and rounding at the end is a DIFFERENT number and is forbidden.
          sample_error_rate_bp = round_half_up(sum_err * 10000 / sum_base)
          projected = round_half_up(population_base_amount_cents * sample_error_rate_bp / 10000)

      Audit.sample_error_rate_bp   = sample_error_rate_bp
      Audit.projected_deficiency_cents = projected
      Audit.examined_unit_count    = n
      Audit.projection_status      = CURRENT
    input_set: |
      Only SampleUnit rows of the audit's AGREED SamplingAgreement (Audit.agreed_agreement_id)
      whose error_class != PENDING are examined. Rows still PENDING are excluded from both
      sums AND from n. A projection over zero examined rows is rejected
      (ERR_SAMPLE_SET_EMPTY), and a projection with n < SamplingAgreement.minimum_sample_size
      is rejected (ERR_SAMPLE_SIZE_NOT_MET). Units of superseded agreements never contribute.
      error_amount_cents is 0 for error_class == NO_ERROR, equals declared_error_amount_cents
      for UNREPORTED_TAXABLE_SALE and RATE_ERROR, and equals
      round_half_up(exempt_sale_amount_cents * STATE_SALES_TAX_RATE_BP / 10000) for
      CERTIFICATE_DEFECT.
    constants:
      STATE_SALES_TAX_RATE_BP: 625
    precision: "integer cents; round_half_up at each step named in the formula, in exactly that order"
    variants:
      - name: MEAN_PER_UNIT
        when: "SamplingAgreement.methodology == MEAN_PER_UNIT"
        difference: "rounds the mean error per examined unit to whole cents, then multiplies by population_unit_count; the population's dollar base is ignored"
      - name: RATIO_ESTIMATION
        when: "SamplingAgreement.methodology == RATIO_ESTIMATION"
        difference: "rounds the error rate to whole basis points, then applies it to population_base_amount_cents; the population's unit count is ignored"
    worked_example: |
      Five examined units, error_amount_cents [62500, 0, 50000, 18750, 0] and
      invoice_amount_cents [1000000, 500000, 800000, 1200000, 700000];
      population_unit_count 2400, population_base_amount_cents 1200000000.
        sum_err = 131250, sum_base = 4200000, n = 5
        rate_bp = round_half_up(131250*10000/4200000) = round_half_up(312.5) = 313
        MEAN_PER_UNIT:    mean = round_half_up(131250/5) = 26250
                          projected = 26250 * 2400 = 63000000
        RATIO_ESTIMATION: projected = round_half_up(1200000000*313/10000) = 37560000
      The forbidden order (multiply the unrounded 3.125% by the base, then round) yields
      37500000 — a 60000-cent divergence that pins the rounding order.

  - name: certificate_deficiency
    trigger: "POST /exemption-certificates/{id}/review and POST /exemption-certificates/{id}/cure; re-summed by POST /audits/{id}/project-sample and POST /assessments/{id}/recompute"
    algorithm: aggregation
    formula: |
      # per certificate, at review time
      good_faith_accepted = (received_before_sale AND form_complete
                             AND claimed_exemption_matches_purchaser_business)
      if good_faith_accepted:
          status = VALIDATED
          missing_certificate_tax_cents = 0
      else:
          status = REJECTED
          missing_certificate_tax_cents =
              round_half_up(covered_sale_amount_cents * STATE_SALES_TAX_RATE_BP / 10000)

      # audit-level roll-up — the double-counting guard
      Audit.certificate_deficiency_cents =
          sum(c.missing_certificate_tax_cents for c in REJECTED certificates of this audit
              WHERE c.sample_unit_id IS NULL)
    input_set: |
      Only ExemptionCertificate rows with status == REJECTED contribute. Rows whose
      sample_unit_id is NOT NULL are DELIBERATELY EXCLUDED from this sum: their tax has
      already entered the population through the linked SampleUnit's CERTIFICATE_DEFECT
      error_amount_cents and therefore through sample_projection. Including them would
      double-count. Certificates that were REJECTED and later CURED (status VALIDATED)
      drop out of the sum and their missing_certificate_tax_cents is reset to 0.
    constants:
      STATE_SALES_TAX_RATE_BP: 625
    precision: "integer cents, round_half_up"
    worked_example: |
      Sample unit U3 carries exempt_sale_amount_cents 800000 and a linked certificate that
      fails good faith: the unit's CERTIFICATE_DEFECT error_amount_cents is
      round_half_up(800000*625/10000) = 50000 and it flows through the projection.
      A second, unlinked certificate (sample_unit_id null) with covered_sale_amount_cents
      2000000 is also rejected: missing_certificate_tax_cents = 125000.
      Audit.certificate_deficiency_cents = 125000 — NOT 175000.

  - name: use_tax_liability
    trigger: "POST /use-tax-purchases, POST /use-tax-purchases/{id}/reclassify; re-summed by POST /assessments/{id}/recompute"
    algorithm: threshold
    formula: |
      if asset_class == CONSUMABLE:
          taxable_basis_cents = purchase_price_cents          # apportionment never applies
      elif asset_class == CAPITAL_ASSET:
          if first_use_outside_state AND months_used_outside_state >= 6:
              # the asset entered the state used: basis steps down to fair market value
              base = fair_market_value_at_entry_cents        # required in this branch
          else:
              base = purchase_price_cents
          taxable_basis_cents = round_half_up(base * in_state_usage_pct_bp / 10000)
      elif asset_class == EXEMPT_MANUFACTURING:
          taxable_basis_cents = 0

      gross_use_tax_cents = round_half_up(taxable_basis_cents * STATE_SALES_TAX_RATE_BP / 10000)
      credit_applied_cents = min(tax_paid_other_state_cents, gross_use_tax_cents)  # never negative
      use_tax_due_cents    = gross_use_tax_cents - credit_applied_cents

      Audit.use_tax_deficiency_cents = sum(use_tax_due_cents of the audit's purchases)
    input_set: |
      All UseTaxPurchase rows of the audit contribute, including rows whose
      use_tax_due_cents computes to 0. A reclassification recomputes the row in place,
      increments reclassification_count, re-sums the audit total and sets
      Audit.projection_status = STALE, which in turn moves any DRAFT Assessment of the
      audit to DRAFT_STALE.
    constants:
      STATE_SALES_TAX_RATE_BP: 625
      FMV_STEPDOWN_MONTHS: 6
    precision: "integer cents, round_half_up; the credit is clamped at the gross tax so a purchase never produces a refund"
    worked_example: |
      P1 CONSUMABLE, purchase_price 4000000, in_state_usage_pct_bp 5000 (ignored),
      tax_paid_other_state 0: basis 4000000, gross 250000, credit 0, due 250000.
      P2 CAPITAL_ASSET, purchase_price 10000000, first_use_outside_state true,
      months_used_outside_state 8, fair_market_value_at_entry 6000000,
      in_state_usage_pct_bp 7500, tax_paid_other_state 200000:
        basis = round_half_up(6000000*7500/10000) = 4500000
        gross = round_half_up(4500000*625/10000)  = 281250
        credit = min(200000, 281250) = 200000  ->  due = 81250
      Audit.use_tax_deficiency_cents = 331250.
      Reclassifying P2 to CONSUMABLE re-runs the row: basis 10000000, gross 625000,
      credit 200000, due 425000 — audit total 675000.

  - name: assessment_liability_rollup
    trigger: "POST /assessments (initial draft) and POST /assessments/{id}/recompute; read-only preview via GET /audits/{id}/liability-preview"
    algorithm: tiered_pricing
    formula: |
      # ---- STEP 1: the deficiency the notice asserts
      tax_deficiency_cents = Audit.projected_deficiency_cents
                           + Audit.certificate_deficiency_cents
                           + Audit.use_tax_deficiency_cents

      # ---- STEP 2: penalty tier, chosen on the WHOLE tax_deficiency_cents
      #      (an average-rate tier, not a marginal/tiered slice)
      if Audit.fraud_indicator:                   penalty_rate_bp = 5000
      elif tax_deficiency_cents >  1000000000:    penalty_rate_bp = 2500   # > $10,000,000.00
      elif tax_deficiency_cents >   100000000:    penalty_rate_bp = 1500   # > $1,000,000.00
      elif tax_deficiency_cents >     1000000:    penalty_rate_bp = 1000   # > $10,000.00
      else:                                       penalty_rate_bp =  500
      penalty_cents = round_half_up(tax_deficiency_cents * penalty_rate_bp / 10000)

      # ---- STEP 3: interest, simple, 365-day year, NO compounding, charged on
      #      tax + penalty. The day count is the whole number of calendar days from
      #      Audit.scope_period_end to the current logical clock date, floored at 0,
      #      so a rollup run on the scope's last day carries zero interest days.
      interest_days = max(0, days_between(Audit.scope_period_end, clock_date))
                      + sum(tolled_days of DECIDED AppealProceeding rows of prior
                            assessments of this audit)
      interest_cents = round_half_up((tax_deficiency_cents + penalty_cents)
                                     * ANNUAL_INTEREST_RATE_BP * interest_days
                                     / (10000 * 365))

      # ---- STEP 4: provisional total, then the small-balance test. The test reads the
      #      PROVISIONAL total (tax+penalty+interest), NOT the tax alone.
      provisional_total_due_cents = tax_deficiency_cents + penalty_cents + interest_cents
      if provisional_total_due_cents <= SMALL_BALANCE_THRESHOLD_CENTS:      # inclusive <=
          penalty_waived_small_balance = true
          penalty_cents  = 0
          # interest is RECOMPUTED on the bare tax now that the penalty is gone
          interest_cents = round_half_up(tax_deficiency_cents
                                         * ANNUAL_INTEREST_RATE_BP * interest_days
                                         / (10000 * 365))
      else:
          penalty_waived_small_balance = false

      # ---- STEP 5: the final total. The small-balance test is NOT re-applied to the
      #      recomputed total, and a waiver never un-waives itself.
      total_due_cents = tax_deficiency_cents + penalty_cents + interest_cents
      balance_due_cents = total_due_cents - total_adjustments_cents - amount_paid_cents
    input_set: |
      Reads the three deficiency components off the parent Audit, which must have
      projection_status == CURRENT. total_adjustments_cents is the sum of amount_cents
      over POSTED AssessmentAdjustment rows of this assessment (REVERSED rows drop out
      and a COLLECTION_FEE row carries a negative amount_cents, so it raises the balance).
      amount_paid_cents accumulates from the assessment's arrangements' payments.
      Superseded assessments contribute nothing.
    constants:
      ANNUAL_INTEREST_RATE_BP: 800
      DAYS_PER_YEAR: 365
      PENALTY_TIER_BP: "<= $10,000.00 -> 500; > $10,000.00 -> 1000; > $1,000,000.00 -> 1500; > $10,000,000.00 -> 2500; fraud_indicator -> 5000"
      SMALL_BALANCE_THRESHOLD_CENTS: 5000
    precision: "integer cents, round_half_up at every named step, in exactly the five-step order above"
    worked_example: |
      RATIO projection 37560000 + certificates 125000 + use tax 331250
        tax_deficiency_cents = 38016250 -> tier > 1000000 -> penalty_rate_bp 1000
        penalty_cents  = round_half_up(38016250*1000/10000) = 3801625
        interest_days  = days_between(2024-12-31, 2026-09-01) = 609
        interest_cents = round_half_up(41817875*800*609/(10000*365)) = 5581827
        provisional = total = 47399702 (well above the small-balance threshold)
      Same audit under MEAN_PER_UNIT (projection 63000000): tax 63456250,
      penalty 6345625, interest 9317116, total 79118991.
      Small-balance boundary with interest_days 0: a single CONSUMABLE purchase of
      76192 gives tax 4762, penalty 238, provisional 5000 -> waived -> total 4762;
      76208 gives tax 4763, penalty 238, provisional 5001 -> not waived -> total 5001.

  - name: penalty_abatement
    trigger: "POST /assessments/{id}/abate-penalty"
    algorithm: waterfall_allocation
    formula: |
      # factor points are additive, then capped
      points = 0
      if "FIRST_TIME_COMPLIANT"   in abatement_factors: points += 40
      if "RELIANCE_ON_WRITTEN_ADVICE" in abatement_factors: points += 35
      if "RECORDS_LOST_IN_DISASTER"   in abatement_factors: points += 25
      if "SUBSTANTIAL_COOPERATION"    in abatement_factors: points += 20
      abatement_pct = min(100, points)

      # ---- caps applied in order ----
      if Audit.fraud_indicator:
          reject with ERR_ABATEMENT_NOT_ALLOWED          # fraud is never abatable
      if Taxpayer.compliance_status == DELINQUENT:
          abatement_pct = min(abatement_pct, 50)         # a delinquent taxpayer is capped at half
      if Assessment.penalty_waived_small_balance:
          reject with ERR_ABATEMENT_NOT_ALLOWED          # there is no penalty left to abate

      amount_cents = round_half_up(Assessment.penalty_cents * abatement_pct / 100)
      # posts a PENALTY_ABATEMENT AssessmentAdjustment for amount_cents, which flows
      # into total_abated_cents, total_adjustments_cents and balance_due_cents.
      # The abatement is computed against the ORIGINAL penalty_cents, so a second
      # abatement on the same assessment can only be posted after the first is reversed.
    input_set: |
      Only an Assessment with status == ISSUED and penalty_cents > 0 may be abated, and
      only when no AppealProceeding of the assessment is OPEN. abatement_factors must be
      a non-empty set drawn from the four recognized factor names; an unrecognized factor
      name is ERR_INVALID_REQUEST.
    constants:
      FIRST_TIME_COMPLIANT_POINTS: 40
      RELIANCE_ON_WRITTEN_ADVICE_POINTS: 35
      RECORDS_LOST_IN_DISASTER_POINTS: 25
      SUBSTANTIAL_COOPERATION_POINTS: 20
      MAX_ABATEMENT_PCT: 100
      DELINQUENT_ABATEMENT_CAP_PCT: 50
    precision: "integer percent points, integer cents, round_half_up"
    worked_example: |
      penalty_cents 3801625, abatement_factors [FIRST_TIME_COMPLIANT, SUBSTANTIAL_COOPERATION]
      -> points 60, taxpayer COMPLIANT -> abatement_pct 60. Under the fixture used in the
      difficulty design the taxpayer is DELINQUENT, so abatement_pct is capped to 50 and
      amount_cents = round_half_up(3801625*50/100) = 1900813, leaving
      balance_due_cents = 47399702 - 1900813 = 45498889.
      All four factors on a compliant taxpayer give points 120 -> capped to 100.

  - name: statute_expiry
    trigger: "POST /audits/{id}/scope (base date), POST /statute-waivers/{id}/execute, POST /statute-waivers/{id}/void, POST /appeal-proceedings/{id}/decision; status derived on every read of the audit"
    algorithm: chronological
    formula: |
      base_expiry = Audit.scope_period_end + STATUTE_BASE_DAYS        # calendar days

      # waivers are replayed in a fixed chronological order, NEVER by id:
      #   order by signed_date ASC, then created_at ASC
      running = base_expiry
      days_added = 0
      for w in EXECUTED StatuteWaiver rows of this audit, in that order:
          # each waiver must strictly extend the running expiry as of its own turn
          if w.extended_to_date <= running:  # rejected at execute time
              raise ERR_WAIVER_NOT_EXTENDING
          w.prior_expiry_date = running
          w.days_added = days_between(running, w.extended_to_date)
          days_added  += w.days_added
          running      = w.extended_to_date

      tolled_days = sum(p.tolled_days for p in DECIDED AppealProceeding rows reachable
                        from this audit's assessments)
      statute_expiry_date = running + tolled_days
      Audit.waiver_days_added = days_added
      Audit.tolled_days       = tolled_days

      # derived at read time from the CURRENT logical clock, never stored stale:
      if clock_date >  statute_expiry_date:                          status = EXPIRED
      elif days_between(clock_date, statute_expiry_date) <= EXPIRING_SOON_DAYS:
                                                                     status = EXPIRING_SOON
      else:                                                          status = PROTECTED
    input_set: |
      Only StatuteWaiver rows with status == EXECUTED are replayed; DRAFTED rows and rows
      VOIDED after execution are excluded and their days are removed from the running
      total, which is the compensating path. Only AppealProceeding rows with
      status == DECIDED contribute tolled_days.
    constants:
      STATUTE_BASE_DAYS: 1095
      EXPIRING_SOON_DAYS: 90
    precision: "whole calendar days; no time-of-day component participates"
    worked_example: |
      scope_period_end 2024-12-31 -> base_expiry 2024-12-31 + 1095 = 2027-12-31.
      Waiver W1 signed 2026-08-05, extended_to_date 2028-12-31: prior_expiry_date
      2027-12-31, days_added 366, running 2028-12-31.
      An appeal filed 2026-10-15 and decided 2026-11-01 tolls 17 days, so
      statute_expiry_date becomes 2029-01-17. Voiding W1 returns the audit to
      2027-12-31 + 17 = 2028-01-17 and waiver_days_added to 0.
      With the clock at 2027-10-15 and no waiver, the audit is 77 days from
      2027-12-31 -> statute_status EXPIRING_SOON (77 <= 90).

# =============================================================================
# §1.4 Validation Rules (evaluated in ascending priority; the FIRST violated rule
#      decides the response, and no later rule may pre-empt an earlier one)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id embedded in the path exists, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 4
    category: auth
    check: "when the acting role is Taxpayer, the addressed resource must belong to that taxpayer (X-User-ID equals the Taxpayer.id reachable from the resource). This runs AFTER path existence so a taxpayer probing a foreign id learns nothing more than that it exists."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /taxpayers/{id}, GET /assessments/{id}, GET /assessments, POST /appeal-proceedings, POST /payment-arrangements, POST /exemption-certificates/{id}/cure, POST /statute-waivers/{id}/execute"
  - priority: 5
    category: business_constraint
    check: "request body schema: required fields present, unknown enum values rejected, integers non-negative where the field is a cents/bp/count field, in_state_usage_pct_bp within 0..10000, confidence_level_bp within 0..10000, period_start <= period_end, invoice_date parseable, abatement_factors non-empty and drawn from the four recognized names"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying a FK in the body"
  - priority: 7
    category: state
    check: "the addressed resource is in a state from which this transition is declared in §1.2 (e.g. issuing a DRAFT_STALE assessment, reviewing a VALIDATED certificate, approving a DEFAULTED arrangement, deciding a DECIDED proceeding, executing a VOIDED waiver). Two state checks have their own code instead of the generic one: recording a payment against an arrangement whose status is not APPROVED returns ERR_ARRANGEMENT_NOT_ACTIVE at this same priority, and POST /audit-leads/{id}/convert is exempt from the generic check entirely — the lead-status test is deferred to priority 10, where a lead whose status is not SELECTED returns ERR_LEAD_NOT_SELECTED."
    error_id: "ERR_INVALID_STATE | ERR_ARRANGEMENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_safety
    check: "segregation of duties: the deciding user may not be the audit's lead_auditor_user_id, and may not be the presiding_officer_user_id of the predecessor proceeding; the forum must match the acting role (AppealsOfficer for INFORMAL_CONFERENCE and ADMINISTRATIVE_APPEAL, TaxTribunalJudge for TAX_TRIBUNAL). Compliance separation outranks every deadline and money rule below."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeal-proceedings/{id}/decision, POST /audits/{id}/close-fieldwork"
  - priority: 9
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (§1.2.1)"
    error_id: "ERR_STALE_<PARENT>_VERSION"
    http_status: 412
    applies_to: "POST /sampling-agreements, POST /assessment-adjustments"
  - priority: 10
    category: business_referential
    check: "referenced sibling entities are in the required state: the promoted AuditLead is SELECTED; the audit's agreed_agreement_id is AGREED before sampling or projection; Audit.projection_status is CURRENT before an assessment is drafted or recomputed; the predecessor AppealProceeding is DECIDED before an escalation is filed; no AppealProceeding of the assessment is OPEN before abatement, finalization or arrangement approval; the assessment is ISSUED or FINAL before an arrangement is approved"
    error_id: "ERR_LEAD_NOT_SELECTED | ERR_AGREEMENT_NOT_AGREED | ERR_PROJECTION_STALE | ERR_PREDECESSOR_NOT_DECIDED | ERR_APPEAL_PENDING"
    http_status: 409
    applies_to: "POST /audit-leads/{id}/convert, POST /sample-units, POST /audits/{id}/project-sample, POST /assessments, POST /assessments/{id}/recompute, POST /assessments/{id}/abate-penalty, POST /assessments/{id}/finalize, POST /appeal-proceedings, POST /payment-arrangements/{id}/approve"
  - priority: 11
    category: business_constraint
    check: "interval geometry. (a) An audit's [scope_period_start, scope_period_end] fixed by POST /audits/{id}/scope must not overlap the closed scope interval of any other audit of the same taxpayer whose status is not ABANDONED (CLOSED audits included) — sharing a single endpoint day IS an overlap; and POST /audit-leads/{id}/convert requires the taxpayer's open_audit_count == 0. (b) A SamplingAgreement's strata must tile the audit scope exactly with half-open [from, to) intervals: sorted by from, each stratum's from must equal the previous stratum's to (adjacency is required, not merely allowed), the first from must equal scope_period_start and the last to must equal scope_period_end + 1 day; any overlap, gap or non-contiguous stratum_index is rejected. (c) A SampleUnit's invoice_date must fall inside the half-open interval of its declared stratum_index."
    error_id: "ERR_AUDIT_SCOPE_OVERLAP | ERR_TAXPAYER_AUDIT_IN_PROGRESS | ERR_STRATUM_OVERLAP | ERR_STRATUM_GAP | ERR_STRATUM_INDEX_INVALID | ERR_INVOICE_DATE_OUT_OF_STRATUM"
    http_status: "409 for audit scope overlap, 422 for strata and invoice-date geometry"
    applies_to: "POST /audits/{id}/scope, POST /audit-leads/{id}/convert, POST /sampling-agreements, POST /sampling-agreements/{id}/revise, POST /sample-units"
  - priority: 12
    category: business_temporal
    check: "deadline and clock rules: Audit.statute_status must not be EXPIRED to agree a methodology, take a sample, project a sample, close fieldwork, issue an assessment or execute a waiver; a waiver's extended_to_date must strictly exceed the running expiry (ERR_WAIVER_NOT_EXTENDING) and only one DRAFTED (awaiting-signature) waiver may exist per audit; an assessment's notice_mailed_date must equal the logical clock date; a protest must be filed on or before protest_deadline_date (day 60 inclusive); an escalation must be filed on or before the predecessor's escalation_deadline_date; a void of an executed waiver requires the audit's recomputed expiry to remain unexpired (ERR_STATUTE_EXPIRED), while abandoning a lapsed audit requires it to BE expired (ERR_STATUTE_NOT_EXPIRED)"
    error_id: "ERR_STATUTE_EXPIRED | ERR_STATUTE_NOT_EXPIRED | ERR_WAIVER_NOT_EXTENDING | ERR_WAIVER_ALREADY_PENDING | ERR_NOTICE_DATE_INVALID | ERR_PROTEST_WINDOW_CLOSED | ERR_ESCALATION_WINDOW_CLOSED"
    http_status: "409 for statute and window rules, 422 for a notice date that is not the clock date"
    applies_to: "POST /sampling-agreements/{id}/agree, POST /audits/{id}/abandon, POST /audits/{id}/close-fieldwork, POST /statute-waivers, POST /statute-waivers/{id}/execute, POST /statute-waivers/{id}/void, POST /audits/{id}/project-sample, POST /assessments/{id}/issue, POST /appeal-proceedings"
  - priority: 13
    category: business_fiscal
    check: "money rules: an AssessmentAdjustment's amount_cents may not exceed Assessment.balance_due_cents; an appeal's reduction_amount_cents may not exceed balance_due_cents; an INSTALLMENT_PLAN's monthly_installment_cents * term_months must reach balance_due_cents; an OFFER_IN_COMPROMISE's offer_amount_cents * 10000 must be >= MIN_OIC_BP * balance_due_cents and hardship_documented must be true; a CAPITAL_ASSET purchase in the FMV-stepdown branch must supply fair_market_value_at_entry_cents; an UNREPORTED_TAXABLE_SALE or RATE_ERROR sample unit must supply declared_error_amount_cents; abatement is refused on a fraud audit or an assessment whose penalty was waived as a small balance"
    error_id: "ERR_ADJUSTMENT_EXCEEDS_BALANCE | ERR_REDUCTION_EXCEEDS_BALANCE | ERR_PLAN_UNDERFUNDED | ERR_OFFER_BELOW_MINIMUM | ERR_HARDSHIP_NOT_DOCUMENTED | ERR_CAPITAL_ASSET_FMV_REQUIRED | ERR_ERROR_AMOUNT_REQUIRED | ERR_ABATEMENT_NOT_ALLOWED"
    http_status: 422
    applies_to: "POST /assessment-adjustments, POST /appeal-proceedings/{id}/decision, POST /payment-arrangements/{id}/approve, POST /use-tax-purchases, POST /use-tax-purchases/{id}/reclassify, POST /sample-units, POST /sample-units/{id}/redetermine, POST /assessments/{id}/abate-penalty"
  - priority: 14
    category: business_constraint
    check: "quota, round and empty-set limits, checked last: an IndustryProject run may not select beyond selections_remaining and a THRESHOLD run that selects nothing is rejected (ERR_NO_ELIGIBLE_CANDIDATES); a SamplingAgreement round_number may not exceed MAX_NEGOTIATION_ROUNDS; a projection over zero examined units is rejected (ERR_SAMPLE_SET_EMPTY) and one over fewer than minimum_sample_size units is rejected (ERR_SAMPLE_SIZE_NOT_MET); an audit may carry only one non-superseded ISSUED assessment (ERR_ASSESSMENT_ALREADY_OPEN); the forum ladder must advance INFORMAL_CONFERENCE -> ADMINISTRATIVE_APPEAL -> TAX_TRIBUNAL without skipping or repeating (ERR_FORUM_SEQUENCE_INVALID); a client may not post a SYSTEM-only adjustment kind (ERR_ADJUSTMENT_KIND_SYSTEM_ONLY); permit_number is unique across taxpayers (ERR_DUPLICATE_PERMIT_NUMBER)"
    error_id: "ERR_NO_ELIGIBLE_CANDIDATES | ERR_NEGOTIATION_ROUNDS_EXHAUSTED | ERR_SAMPLE_SET_EMPTY | ERR_SAMPLE_SIZE_NOT_MET | ERR_ASSESSMENT_ALREADY_OPEN | ERR_FORUM_SEQUENCE_INVALID | ERR_ADJUSTMENT_KIND_SYSTEM_ONLY | ERR_DUPLICATE_PERMIT_NUMBER | ERR_ASSESSMENT_NOT_FINALIZABLE"
    http_status: "409 for sequence, uniqueness and open-assessment conflicts, 422 for quota, round and sample-size limits"
    applies_to: "POST /taxpayers, POST /industry-projects/{id}/selection-runs, POST /sampling-agreements/{id}/revise, POST /sampling-agreements, POST /audits/{id}/project-sample, POST /audits/{id}/close-fieldwork, POST /assessments, POST /appeal-proceedings, POST /assessment-adjustments, POST /assessments/{id}/finalize"

# =============================================================================
# §1.5 API Endpoint Table   (api_prefix is "/", so every path below is absolute)
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- Taxpayer
  - method: POST
    path: "/taxpayers"
    description: "Register a permit holder in the audit-selection universe."
    roles: [SelectionAnalyst, AuditSupervisor]
    code: 201
    input: [legal_name, permit_number, industry_naics_code, filing_frequency, gross_receipts_annual_cents, "delinquent_period_count?", "prior_audit_error_rate_bp?", "compliance_status?"]
    output: Taxpayer
    side_effects:
      - "permit_number uniqueness is enforced (ERR_DUPLICATE_PERMIT_NUMBER)"
      - "screening_score, info_variance_bp, delinquency_bp, magnitude_bp and prior_audit_bp are computed from calculations.taxpayer_risk_score variant SCREENING with no information returns yet on file"
      - "open_audit_count starts at 0"
  - method: GET
    path: "/taxpayers"
    description: "List permit holders, filterable for selection work."
    roles: [SelectionAnalyst, AuditSupervisor, FieldAuditor, CollectionsAgent]
    code: 200
    input: ["compliance_status?", "industry_naics_code?", "limit?", "offset?"]
    output: Taxpayer[]
    side_effects: []
  - method: GET
    path: "/taxpayers/{id}"
    description: "Read one permit holder, including the live screening score and open-audit count."
    roles: [SelectionAnalyst, AuditSupervisor, FieldAuditor, CollectionsAgent, Taxpayer]
    code: 200
    input: []
    output: Taxpayer
    side_effects: []
  - method: POST
    path: "/taxpayers/{id}/rescore-screening"
    description: "Recompute the SCREENING variant of the risk score from the information returns currently in the scoring window."
    roles: [SelectionAnalyst]
    code: 200
    input: []
    output: Taxpayer
    side_effects:
      - "recomputes reported_total_cents, matched_total_cents and the four component bp fields"
      - "recomputes screening_score via calculations.taxpayer_risk_score variant SCREENING"
  - method: GET
    path: "/taxpayers/{id}/information-returns"
    description: "List the third-party information returns matched to this permit holder."
    roles: [SelectionAnalyst, AuditSupervisor, FieldAuditor, Taxpayer]
    code: 200
    input: ["source_type?", "match_status?", "limit?", "offset?"]
    output: InformationReturn[]
    side_effects: []

  # ------------------------------------------------------- InformationReturn
  - method: POST
    path: "/information-returns"
    description: "Load one third-party information return and match it against the permit holder's reported figures."
    roles: [SelectionAnalyst]
    code: 201
    input: [taxpayer_id, source_type, period_start, period_end, reported_amount_cents, matched_return_amount_cents]
    output: InformationReturn
    side_effects:
      - "computes variance_cents, match_status and in_scoring_window"
      - "rolls reported_total_cents and matched_total_cents up onto the Taxpayer and recomputes its SCREENING score"
  - method: GET
    path: "/information-returns/{id}"
    description: "Read one information return. Information returns are immutable once loaded."
    roles: [SelectionAnalyst, AuditSupervisor, FieldAuditor]
    code: 200
    input: []
    output: InformationReturn
    side_effects: []

  # --------------------------------------------------------- IndustryProject
  - method: POST
    path: "/industry-projects"
    description: "Open an industry audit project with its selection mode, threshold and quota."
    roles: [SelectionAnalyst, AuditSupervisor]
    code: 201
    input: [project_name, industry_naics_code, industry_error_rate_bp, selection_mode, "selection_threshold_score?", "selection_quota?"]
    output: IndustryProject
    side_effects:
      - "selections_used starts at 0 and selections_remaining starts at selection_quota, establishing the invariant selection_quota == selections_used + selections_remaining"
  - method: GET
    path: "/industry-projects"
    description: "List industry projects."
    roles: [SelectionAnalyst, AuditSupervisor]
    code: 200
    input: ["selection_mode?", "industry_naics_code?", "limit?", "offset?"]
    output: IndustryProject[]
    side_effects: []
  - method: GET
    path: "/industry-projects/{id}"
    description: "Read one industry project, including quota consumption and the last run's cutoff score."
    roles: [SelectionAnalyst, AuditSupervisor]
    code: 200
    input: []
    output: IndustryProject
    side_effects: []
  - method: POST
    path: "/industry-projects/{id}/selection-runs"
    description: "Score every eligible permit holder in the project's industry with the FULL risk-score variant, rank them, and select down the ranking under the project's selection_mode. Creates one AuditLead per scored taxpayer; discover them with GET /audit-leads?industry_project_id=."
    roles: [SelectionAnalyst]
    code: 200
    input: []
    output: IndustryProject
    side_effects:
      - "creates an AuditLead in SCORED for every Taxpayer with the project's industry_naics_code, compliance_status != REVOKED and open_audit_count == 0, each carrying risk_score, score_variant FULL, score_breakdown and rank_position from calculations.taxpayer_risk_score"
      - "walks the ranking (risk_score DESC, then Taxpayer.created_at ASC) and moves leads to SELECTED or NOT_SELECTED per selection_mode, consuming selections_remaining"
      - "sets scored_lead_count, last_run_at and last_cutoff_score"
      - "a THRESHOLD or HYBRID run that selects nothing is rejected with ERR_NO_ELIGIBLE_CANDIDATES and leaves no leads behind"

  # --------------------------------------------------------------- AuditLead
  - method: GET
    path: "/audit-leads"
    description: "List scored audit leads, filterable by project, taxpayer and status."
    roles: [SelectionAnalyst, AuditSupervisor]
    code: 200
    input: ["industry_project_id?", "taxpayer_id?", "status?", "limit?", "offset?"]
    output: AuditLead[]
    side_effects: []
  - method: GET
    path: "/audit-leads/{id}"
    description: "Read one audit lead with its score breakdown and rank position."
    roles: [SelectionAnalyst, AuditSupervisor]
    code: 200
    input: []
    output: AuditLead
    side_effects: []
  - method: POST
    path: "/audit-leads/{id}/decline"
    description: "Decline a lead. Declining a SELECTED lead releases its quota slot and promotes the highest-ranked waitlisted SCORED lead of the same project."
    roles: [SelectionAnalyst, AuditSupervisor]
    code: 200
    input: [decline_reason]
    output: AuditLead
    side_effects:
      - "for a SELECTED lead: decrements IndustryProject.selections_used and increments selections_remaining, then promotes the highest-ranked SCORED lead that still meets the threshold (setting promoted_from_scored) and re-consumes the slot"
      - "for a SCORED lead: no quota movement and no promotion"
  - method: POST
    path: "/audit-leads/{id}/convert"
    description: "Convert a SELECTED lead into an Audit. Returns the created Audit in PLANNED."
    roles: [AuditSupervisor]
    code: 201
    input: [lead_auditor_user_id, "audit_type?"]
    output: Audit
    side_effects:
      - "creates the Audit in PLANNED with taxpayer_id and audit_lead_id from the lead"
      - "increments Taxpayer.open_audit_count by 1, which removes the taxpayer from future selection runs"
      - "moves the lead SELECTED -> CONVERTED without changing IndustryProject.selections_used"

  # ------------------------------------------------------------------- Audit
  - method: GET
    path: "/audits"
    description: "List audits, filterable by taxpayer, originating lead, agreed sampling agreement and status."
    roles: [AuditSupervisor, FieldAuditor, SelectionAnalyst, AppealsOfficer]
    code: 200
    input: ["taxpayer_id?", "audit_lead_id?", "agreed_agreement_id?", "status?", "statute_status?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: GET
    path: "/audits/{id}"
    description: "Read one audit. statute_status and statute_expiry_date are derived against the current logical clock on every read."
    roles: [AuditSupervisor, FieldAuditor, AppealsOfficer, TaxTribunalJudge, Taxpayer]
    code: 200
    input: []
    output: Audit
    side_effects:
      - "recomputes statute_expiry_date via calculations.statute_expiry and derives statute_status from the logical clock"
  - method: POST
    path: "/audits/{id}/scope"
    description: "Fix the audit's type and examination period. The scope period may not overlap another live audit of the same taxpayer under closed-interval semantics."
    roles: [FieldAuditor, AuditSupervisor]
    code: 200
    input: [audit_type, scope_period_start, scope_period_end]
    output: Audit
    side_effects:
      - "moves status PLANNED -> SCOPED"
      - "sets base_statute_expiry_date = scope_period_end + STATUTE_BASE_DAYS and statute_expiry_date via calculations.statute_expiry"
  - method: POST
    path: "/audits/{id}/project-sample"
    description: "Project the examined sample's error to the population using the agreed agreement's methodology."
    roles: [FieldAuditor]
    code: 200
    input: []
    output: Audit
    side_effects:
      - "runs calculations.sample_projection under the variant named by the agreed SamplingAgreement.methodology and writes sample_error_rate_bp, projected_deficiency_cents and examined_unit_count"
      - "re-sums certificate_deficiency_cents via calculations.certificate_deficiency and use_tax_deficiency_cents via calculations.use_tax_liability"
      - "sets projection_status = CURRENT"
  - method: POST
    path: "/audits/{id}/close-fieldwork"
    description: "Close fieldwork and freeze the finding set. The closing supervisor may not be the audit's lead auditor."
    roles: [AuditSupervisor]
    code: 200
    input: ["fraud_indicator?"]
    output: Audit
    side_effects:
      - "moves status FIELDWORK -> REVIEW_COMPLETE and stores fraud_indicator"
      - "no further sample units, certificates or use-tax purchases may be created or changed on this audit"
  - method: POST
    path: "/audits/{id}/reopen-fieldwork"
    description: "Reopen a reviewed audit for additional findings. Refused once an assessment has been issued."
    roles: [AuditSupervisor]
    code: 200
    input: ["reopen_reason?"]
    output: Audit
    side_effects:
      - "moves status REVIEW_COMPLETE -> FIELDWORK and increments reopen_count"
      - "refused with ERR_INVALID_STATE when an Assessment of the audit is ISSUED or FINAL"
      - "does not by itself change projection_status, so a DRAFT Assessment stays DRAFT until a finding actually moves"
  - method: POST
    path: "/audits/{id}/abandon"
    description: "Abandon an audit whose limitation period has run out."
    roles: [AuditSupervisor]
    code: 200
    input: ["abandon_reason?"]
    output: Audit
    side_effects:
      - "requires statute_status == EXPIRED (otherwise ERR_STATUTE_NOT_EXPIRED)"
      - "supersedes every PROPOSED or COUNTERED SamplingAgreement of the audit and decrements Taxpayer.open_audit_count by 1"
  - method: GET
    path: "/audits/{id}/liability-preview"
    description: "Computed read: the liability the audit would assess right now, without creating an Assessment. Runs the same five-step rollup as POST /assessments."
    roles: [AuditSupervisor, FieldAuditor]
    code: 200
    input: []
    output: { tax_deficiency_cents: integer, penalty_rate_bp: integer, penalty_cents: integer, interest_days: integer, interest_cents: integer, provisional_total_due_cents: integer, penalty_waived_small_balance: boolean, total_due_cents: integer, projection_status: string }
    side_effects: []
  - method: GET
    path: "/audits/{id}/statute-waivers"
    description: "List the audit's limitation-period waivers in replay order (signed_date ASC, then created_at ASC)."
    roles: [AuditSupervisor, FieldAuditor, Taxpayer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StatuteWaiver[]
    side_effects: []
  - method: GET
    path: "/audits/{id}/use-tax-purchases"
    description: "List the untaxed purchases examined under this audit."
    roles: [AuditSupervisor, FieldAuditor, Taxpayer]
    code: 200
    input: ["asset_class?", "limit?", "offset?"]
    output: UseTaxPurchase[]
    side_effects: []

  # ----------------------------------------------------------- StatuteWaiver
  - method: POST
    path: "/statute-waivers"
    description: "Draft a limitation-period waiver for the taxpayer's signature. Only one DRAFTED waiver may be outstanding per audit."
    roles: [AuditSupervisor, FieldAuditor]
    code: 201
    input: [audit_id, covers_period_end, extended_to_date, signed_by_name]
    output: StatuteWaiver
    side_effects:
      - "status starts at DRAFTED and contributes no days until executed"
      - "rejects a second outstanding draft with ERR_WAIVER_ALREADY_PENDING"
  - method: GET
    path: "/statute-waivers/{id}"
    description: "Read one waiver with the expiry it moved and the days it added."
    roles: [AuditSupervisor, FieldAuditor, Taxpayer]
    code: 200
    input: []
    output: StatuteWaiver
    side_effects: []
  - method: POST
    path: "/statute-waivers/{id}/execute"
    description: "Taxpayer signs the waiver, extending the audit's limitation period."
    roles: [Taxpayer]
    code: 200
    input: [signed_date]
    output: StatuteWaiver
    side_effects:
      - "moves status DRAFTED -> EXECUTED, sets prior_expiry_date and days_added"
      - "recomputes Audit.statute_expiry_date and Audit.waiver_days_added via calculations.statute_expiry"
  - method: POST
    path: "/statute-waivers/{id}/void"
    description: "Void a waiver. Voiding an EXECUTED waiver returns every day it added, restoring the audit's prior expiry exactly."
    roles: [AuditSupervisor]
    code: 200
    input: [void_reason]
    output: StatuteWaiver
    side_effects:
      - "sets days_added = 0 and recomputes Audit.statute_expiry_date and Audit.waiver_days_added"

  # ------------------------------------------------------ SamplingAgreement
  - method: POST
    path: "/sampling-agreements"
    description: "Propose a sampling methodology to the taxpayer. The strata must tile the audit scope exactly with half-open intervals. Requires the audit's current version."
    roles: [FieldAuditor]
    code: 201
    input: [audit_id, expected_audit_version, methodology, confidence_level_bp, minimum_sample_size, strata, "supersedes_agreement_id?"]
    output: SamplingAgreement
    side_effects:
      - "rejects a stale expected_audit_version with ERR_STALE_AUDIT_VERSION (412) and increments Audit.version by 1 on success"
      - "status starts at PROPOSED with round_number 1"
      - "when supersedes_agreement_id is supplied, moves that agreement to SUPERSEDED"
  - method: GET
    path: "/sampling-agreements"
    description: "List sampling agreements, filterable by audit, by the agreement they supersede and by status."
    roles: [FieldAuditor, AuditSupervisor, Taxpayer]
    code: 200
    input: ["audit_id?", "supersedes_agreement_id?", "status?", "methodology?", "limit?", "offset?"]
    output: SamplingAgreement[]
    side_effects: []
  - method: GET
    path: "/sampling-agreements/{id}"
    description: "Read one sampling agreement, including its strata and negotiation round."
    roles: [FieldAuditor, AuditSupervisor, Taxpayer]
    code: 200
    input: []
    output: SamplingAgreement
    side_effects: []
  - method: POST
    path: "/sampling-agreements/{id}/counter"
    description: "Taxpayer counters the proposed methodology."
    roles: [Taxpayer]
    code: 200
    input: [counter_note, "requested_minimum_sample_size?"]
    output: SamplingAgreement
    side_effects:
      - "moves status PROPOSED -> COUNTERED and records counter_note and requested_minimum_sample_size"
  - method: POST
    path: "/sampling-agreements/{id}/revise"
    description: "Auditor revises a countered methodology, opening the next negotiation round. Bounded at MAX_NEGOTIATION_ROUNDS."
    roles: [FieldAuditor]
    code: 200
    input: ["methodology?", "confidence_level_bp?", "minimum_sample_size?", "strata?"]
    output: SamplingAgreement
    side_effects:
      - "moves status COUNTERED -> PROPOSED and increments round_number by 1"
      - "rejects a revision past the round cap with ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
      - "any supplied strata array must still tile the audit scope exactly"
  - method: POST
    path: "/sampling-agreements/{id}/agree"
    description: "Taxpayer agrees to the methodology, which opens fieldwork on the audit."
    roles: [Taxpayer]
    code: 200
    input: [agreed_by_name]
    output: SamplingAgreement
    side_effects:
      - "moves status PROPOSED -> AGREED and records agreed_by_name"
      - "sets Audit.agreed_agreement_id and moves Audit.status SCOPED -> FIELDWORK"
      - "moves every other PROPOSED or COUNTERED agreement of the audit to SUPERSEDED"

  # -------------------------------------------------------------- SampleUnit
  - method: POST
    path: "/sample-units"
    description: "Record one invoice drawn into the sample. The invoice date must fall inside the declared stratum's half-open interval."
    roles: [FieldAuditor]
    code: 201
    input: [sampling_agreement_id, stratum_index, invoice_reference, invoice_date, invoice_amount_cents, "exempt_sale_amount_cents?", "error_class?", "declared_error_amount_cents?"]
    output: SampleUnit
    side_effects:
      - "error_class defaults to PENDING, which excludes the unit from the projection entirely"
      - "computes error_amount_cents: 0 for NO_ERROR and PENDING, declared_error_amount_cents for UNREPORTED_TAXABLE_SALE and RATE_ERROR (required in those classes), round_half_up(exempt_sale_amount_cents * STATE_SALES_TAX_RATE_BP / 10000) for CERTIFICATE_DEFECT"
      - "sets Audit.projection_status = STALE, which moves any DRAFT Assessment of the audit to DRAFT_STALE"
  - method: GET
    path: "/sample-units/{id}"
    description: "Read one sampled invoice with its error determination."
    roles: [FieldAuditor, AuditSupervisor, Taxpayer]
    code: 200
    input: []
    output: SampleUnit
    side_effects: []
  - method: GET
    path: "/sampling-agreements/{id}/sample-units"
    description: "List the invoices drawn under one sampling agreement."
    roles: [FieldAuditor, AuditSupervisor, Taxpayer]
    code: 200
    input: ["stratum_index?", "error_class?", "limit?", "offset?"]
    output: SampleUnit[]
    side_effects: []
  - method: POST
    path: "/sample-units/{id}/redetermine"
    description: "Change a sampled invoice's error determination."
    roles: [FieldAuditor]
    code: 200
    input: [error_class, "declared_error_amount_cents?"]
    output: SampleUnit
    side_effects:
      - "recomputes error_amount_cents and increments redetermination_count"
      - "sets Audit.projection_status = STALE, cascading any DRAFT Assessment of the audit to DRAFT_STALE"

  # ------------------------------------------------------ ExemptionCertificate
  - method: POST
    path: "/exemption-certificates"
    description: "File an exemption certificate for review, optionally linked to the sampled invoice it supports."
    roles: [FieldAuditor, Taxpayer]
    code: 201
    input: [audit_id, purchaser_name, purchaser_permit_number, claimed_exemption_type, covered_sale_amount_cents, received_before_sale, form_complete, claimed_exemption_matches_purchaser_business, "sample_unit_id?"]
    output: ExemptionCertificate
    side_effects:
      - "status starts at ON_FILE and good_faith_accepted is computed from the three good-faith conditions"
      - "missing_certificate_tax_cents starts at 0 and is only set on rejection"
  - method: GET
    path: "/exemption-certificates"
    description: "List exemption certificates, filterable by audit, by the sampled invoice they support and by status."
    roles: [FieldAuditor, AuditSupervisor, Taxpayer]
    code: 200
    input: ["audit_id?", "sample_unit_id?", "status?", "claimed_exemption_type?", "limit?", "offset?"]
    output: ExemptionCertificate[]
    side_effects: []
  - method: GET
    path: "/exemption-certificates/{id}"
    description: "Read one exemption certificate with its good-faith determination."
    roles: [FieldAuditor, AuditSupervisor, Taxpayer]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: []
  - method: POST
    path: "/exemption-certificates/{id}/review"
    description: "Determine the certificate under the good-faith acceptance standard. A REJECTED determination assesses the tax, through the linked sampled invoice when there is one."
    roles: [FieldAuditor]
    code: 200
    input: [determination, "review_note?"]
    output: ExemptionCertificate
    side_effects:
      - "a VALIDATED determination requires good_faith_accepted == true (otherwise ERR_GOOD_FAITH_STANDARD_NOT_MET) and, when a linked unit was previously CERTIFICATE_DEFECT, resets that unit to NO_ERROR with error_amount_cents 0"
      - "a REJECTED determination sets missing_certificate_tax_cents = round_half_up(covered_sale_amount_cents * STATE_SALES_TAX_RATE_BP / 10000) and either redetermines the linked SampleUnit to CERTIFICATE_DEFECT or, when sample_unit_id is null, raises Audit.certificate_deficiency_cents"
      - "either way sets Audit.projection_status = STALE and cascades any DRAFT Assessment to DRAFT_STALE"
  - method: POST
    path: "/exemption-certificates/{id}/cure"
    description: "Taxpayer cures a rejected certificate by supplying the missing particulars."
    roles: [Taxpayer]
    code: 200
    input: ["purchaser_permit_number?", "received_before_sale?", "form_complete?", "claimed_exemption_matches_purchaser_business?"]
    output: ExemptionCertificate
    side_effects:
      - "moves status REJECTED -> CURED, increments cure_count and recomputes good_faith_accepted"
      - "leaves the linked unit's determination and Audit.certificate_deficiency_cents untouched until the next review"

  # --------------------------------------------------------- UseTaxPurchase
  - method: POST
    path: "/use-tax-purchases"
    description: "Record an untaxed purchase for use-tax analysis. CAPITAL_ASSET rows apportion by in-state usage and may step the basis down to fair market value at entry."
    roles: [FieldAuditor]
    code: 201
    input: [audit_id, vendor_name, invoice_date, purchase_price_cents, asset_class, "in_state_usage_pct_bp?", "first_use_outside_state?", "months_used_outside_state?", "fair_market_value_at_entry_cents?", "tax_paid_other_state_cents?"]
    output: UseTaxPurchase
    side_effects:
      - "runs calculations.use_tax_liability and writes taxable_basis_cents, gross_use_tax_cents, credit_applied_cents and use_tax_due_cents"
      - "requires fair_market_value_at_entry_cents in the CAPITAL_ASSET stepdown branch (ERR_CAPITAL_ASSET_FMV_REQUIRED)"
      - "re-sums Audit.use_tax_deficiency_cents, sets Audit.projection_status = STALE and cascades any DRAFT Assessment to DRAFT_STALE"
  - method: GET
    path: "/use-tax-purchases/{id}"
    description: "Read one untaxed purchase with its taxable basis and credit."
    roles: [FieldAuditor, AuditSupervisor, Taxpayer]
    code: 200
    input: []
    output: UseTaxPurchase
    side_effects: []
  - method: POST
    path: "/use-tax-purchases/{id}/reclassify"
    description: "Reclassify a purchase between consumable, capital-asset and exempt-manufacturing treatment."
    roles: [FieldAuditor]
    code: 200
    input: [asset_class, "in_state_usage_pct_bp?", "first_use_outside_state?", "months_used_outside_state?", "fair_market_value_at_entry_cents?", "tax_paid_other_state_cents?"]
    output: UseTaxPurchase
    side_effects:
      - "re-runs calculations.use_tax_liability in place and increments reclassification_count"
      - "re-sums Audit.use_tax_deficiency_cents, sets Audit.projection_status = STALE and cascades any DRAFT Assessment to DRAFT_STALE"

  # -------------------------------------------------------------- Assessment
  - method: POST
    path: "/assessments"
    description: "Draft the assessment for a reviewed audit, running the five-step liability rollup."
    roles: [AuditSupervisor]
    code: 201
    input: [audit_id, "supersedes_assessment_id?"]
    output: Assessment
    side_effects:
      - "requires Audit.status == REVIEW_COMPLETE and Audit.projection_status == CURRENT (otherwise ERR_PROJECTION_STALE)"
      - "runs calculations.assessment_liability_rollup and writes tax_deficiency_cents, penalty_rate_bp, penalty_cents, interest_days, interest_cents, provisional_total_due_cents, penalty_waived_small_balance, total_due_cents and balance_due_cents"
      - "status starts at DRAFT and collection_status at NOT_DUE"
      - "rejects a second live notice on the same audit with ERR_ASSESSMENT_ALREADY_OPEN unless supersedes_assessment_id names the existing one, which is then moved to SUPERSEDED"
  - method: GET
    path: "/assessments"
    description: "List assessments, filterable by audit, by the assessment they supersede and by both status axes."
    roles: [AuditSupervisor, CollectionsAgent, AppealsOfficer, TaxTribunalJudge, Taxpayer]
    code: 200
    input: ["audit_id?", "supersedes_assessment_id?", "status?", "collection_status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: GET
    path: "/assessments/{id}"
    description: "Read one assessment with both status axes and the full penalty/interest breakdown."
    roles: [AuditSupervisor, CollectionsAgent, AppealsOfficer, TaxTribunalJudge, Taxpayer]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: POST
    path: "/assessments/{id}/recompute"
    description: "Re-run the liability rollup on a stale draft after the findings changed."
    roles: [AuditSupervisor]
    code: 200
    input: []
    output: Assessment
    side_effects:
      - "requires Audit.projection_status == CURRENT (otherwise ERR_PROJECTION_STALE)"
      - "moves status DRAFT_STALE -> DRAFT and overwrites every computed money field via calculations.assessment_liability_rollup"
  - method: POST
    path: "/assessments/{id}/issue"
    description: "Mail the notice of assessment. notice_mailed_date must be the current logical clock date."
    roles: [AuditSupervisor]
    code: 200
    input: [notice_mailed_date]
    output: Assessment
    side_effects:
      - "moves status DRAFT -> ISSUED (a DRAFT_STALE notice is refused with ERR_INVALID_STATE) and sets issued_at"
      - "sets protest_deadline_date = notice_mailed_date + PROTEST_WINDOW_DAYS"
      - "moves collection_status NOT_DUE -> DUE and Audit.status REVIEW_COMPLETE -> ASSESSED"
  - method: POST
    path: "/assessments/{id}/abate-penalty"
    description: "Abate penalty against the recognized abatement factors. Posts a PENALTY_ABATEMENT adjustment."
    roles: [AuditSupervisor]
    code: 200
    input: [abatement_factors]
    output: Assessment
    side_effects:
      - "runs calculations.penalty_abatement, capping a delinquent taxpayer at 50 percent and refusing a fraud audit or a small-balance-waived notice with ERR_ABATEMENT_NOT_ALLOWED"
      - "posts a SYSTEM AssessmentAdjustment of kind PENALTY_ABATEMENT, raising total_abated_cents and total_adjustments_cents and lowering balance_due_cents"
      - "refused while any AppealProceeding of the assessment is OPEN (ERR_APPEAL_PENDING)"
  - method: POST
    path: "/assessments/{id}/finalize"
    description: "Finalize an assessment whose protest and escalation windows have all closed, which closes the audit."
    roles: [AuditSupervisor]
    code: 200
    input: []
    output: Assessment
    side_effects:
      - "requires the clock to be past protest_deadline_date and past every DECIDED proceeding's escalation_deadline_date, and no OPEN proceeding (otherwise ERR_ASSESSMENT_NOT_FINALIZABLE)"
      - "moves status ISSUED -> FINAL, then Audit.status ASSESSED -> CLOSED, then decrements Taxpayer.open_audit_count by 1"
  - method: POST
    path: "/assessments/{id}/collection-referral"
    description: "Refer an unpaid assessment to collections, which adds the statutory collection fee."
    roles: [CollectionsAgent]
    code: 200
    input: ["referral_note?"]
    output: Assessment
    side_effects:
      - "moves collection_status DUE or ARRANGED -> REFERRED; refused while collection_hold is true"
      - "posts a SYSTEM COLLECTION_FEE adjustment of -round_half_up(balance_due_cents * COLLECTION_FEE_BP / 10000), raising balance_due_cents"
      - "sets Taxpayer.compliance_status = DELINQUENT"
  - method: GET
    path: "/assessments/{id}/payment-arrangements"
    description: "List the payment arrangements requested against one assessment."
    roles: [CollectionsAgent, AuditSupervisor, Taxpayer]
    code: 200
    input: ["arrangement_type?", "status?", "limit?", "offset?"]
    output: PaymentArrangement[]
    side_effects: []

  # ---------------------------------------------------- AssessmentAdjustment
  - method: POST
    path: "/assessment-adjustments"
    description: "Post a credit or debit against an assessment's balance. Requires the assessment's current version."
    roles: [AuditSupervisor, CollectionsAgent]
    code: 201
    input: [assessment_id, expected_assessment_version, kind, amount_cents]
    output: AssessmentAdjustment
    side_effects:
      - "rejects a stale expected_assessment_version with ERR_STALE_ASSESSMENT_VERSION (412) and increments Assessment.version by 1 on success"
      - "rejects the SYSTEM-only kinds PENALTY_ABATEMENT, APPEAL_REDUCTION, COLLECTION_FEE, OIC_WRITEOFF and ASSESSMENT_VACATED with ERR_ADJUSTMENT_KIND_SYSTEM_ONLY"
      - "rejects amount_cents greater than Assessment.balance_due_cents with ERR_ADJUSTMENT_EXCEEDS_BALANCE"
      - "status starts at POSTED and re-derives Assessment.total_adjustments_cents and balance_due_cents; a balance reaching 0 moves collection_status to SATISFIED"
  - method: GET
    path: "/assessment-adjustments"
    description: "List ledger rows, filterable by assessment, by the proceeding that produced them and by status."
    roles: [AuditSupervisor, CollectionsAgent, AppealsOfficer, Taxpayer]
    code: 200
    input: ["assessment_id?", "appeal_proceeding_id?", "kind?", "status?", "limit?", "offset?"]
    output: AssessmentAdjustment[]
    side_effects: []
  - method: GET
    path: "/assessment-adjustments/{id}"
    description: "Read one ledger row."
    roles: [AuditSupervisor, CollectionsAgent, AppealsOfficer, Taxpayer]
    code: 200
    input: []
    output: AssessmentAdjustment
    side_effects: []
  - method: POST
    path: "/assessment-adjustments/{id}/reverse"
    description: "Reverse a posted ledger row, restoring the balance exactly."
    roles: [AuditSupervisor]
    code: 200
    input: [reversal_reason]
    output: AssessmentAdjustment
    side_effects:
      - "moves status POSTED -> REVERSED and records reversal_reason"
      - "re-derives Assessment.total_adjustments_cents, total_abated_cents and balance_due_cents so that balance_due_cents + total_adjustments_cents + amount_paid_cents == total_due_cents still holds"
      - "a SATISFIED assessment whose balance becomes positive again returns to collection_status DUE"

  # ---------------------------------------------------------- AppealProceeding
  - method: POST
    path: "/appeal-proceedings"
    description: "File a protest at the informal conference, the administrative appeal or the tax tribunal. The forum ladder may not be skipped and each escalation has its own window."
    roles: [Taxpayer]
    code: 201
    input: [assessment_id, forum, protest_basis, filed_date, "predecessor_proceeding_id?"]
    output: AppealProceeding
    side_effects:
      - "the first proceeding must be INFORMAL_CONFERENCE filed on or before protest_deadline_date (ERR_PROTEST_WINDOW_CLOSED); a later forum requires predecessor_proceeding_id naming a DECIDED proceeding at the immediately preceding forum (ERR_FORUM_SEQUENCE_INVALID, ERR_PREDECESSOR_NOT_DECIDED) filed on or before its escalation_deadline_date (ERR_ESCALATION_WINDOW_CLOSED)"
      - "status starts at OPEN and sets Assessment.collection_hold = true, which blocks a collection referral"
  - method: GET
    path: "/appeal-proceedings"
    description: "List proceedings, filterable by assessment, by the proceeding they escalate from, by forum and by status."
    roles: [AppealsOfficer, TaxTribunalJudge, AuditSupervisor, CollectionsAgent, Taxpayer]
    code: 200
    input: ["assessment_id?", "predecessor_proceeding_id?", "forum?", "status?", "outcome?", "limit?", "offset?"]
    output: AppealProceeding[]
    side_effects: []
  - method: GET
    path: "/appeal-proceedings/{id}"
    description: "Read one proceeding with its outcome, tolled days and escalation deadline."
    roles: [AppealsOfficer, TaxTribunalJudge, AuditSupervisor, CollectionsAgent, Taxpayer]
    code: 200
    input: []
    output: AppealProceeding
    side_effects: []
  - method: POST
    path: "/appeal-proceedings/{id}/decision"
    description: "Decide the proceeding SUSTAINED, REDUCED or REMANDED. The deciding officer must match the forum and may not be the lead auditor or the predecessor's presiding officer."
    roles: [AppealsOfficer, TaxTribunalJudge]
    code: 200
    input: [outcome, "decision_rationale?", "reduction_amount_cents?"]
    output: AppealProceeding
    side_effects:
      - "moves status OPEN -> DECIDED, sets decided_date, tolled_days = decided_date - filed_date, presiding_officer_user_id and escalation_deadline_date for the next forum"
      - "SUSTAINED: no ledger movement; a TAX_TRIBUNAL decision moves the Assessment to FINAL and closes the audit"
      - "REDUCED: posts a SYSTEM APPEAL_REDUCTION adjustment of reduction_amount_cents (refused above the balance with ERR_REDUCTION_EXCEEDS_BALANCE), lowering balance_due_cents and, at zero, moving collection_status to SATISFIED and completing the assessment's arrangements"
      - "REMANDED: refused at the tribunal (ERR_FORUM_SEQUENCE_INVALID); vacates the Assessment to WITHDRAWN with a SYSTEM ASSESSMENT_VACATED adjustment, cancels its arrangements and reopens the Audit ASSESSED -> FIELDWORK with projection_status STALE"
      - "always recomputes Audit.statute_expiry_date via calculations.statute_expiry with the new tolled_days, and clears Assessment.collection_hold when no proceeding of the assessment remains OPEN"

  # --------------------------------------------------------- PaymentArrangement
  - method: POST
    path: "/payment-arrangements"
    description: "Request an installment plan or an offer in compromise against an issued assessment."
    roles: [Taxpayer, CollectionsAgent]
    code: 201
    input: [assessment_id, arrangement_type, "monthly_installment_cents?", "term_months?", "offer_amount_cents?", "hardship_documented?"]
    output: PaymentArrangement
    side_effects:
      - "status starts at REQUESTED; scheduled_total_cents = monthly_installment_cents * term_months for an INSTALLMENT_PLAN and offer_amount_cents for an OFFER_IN_COMPROMISE"
  - method: GET
    path: "/payment-arrangements/{id}"
    description: "Read one arrangement with its schedule and payment history."
    roles: [CollectionsAgent, AuditSupervisor, Taxpayer]
    code: 200
    input: []
    output: PaymentArrangement
    side_effects: []
  - method: POST
    path: "/payment-arrangements/{id}/approve"
    description: "Approve the arrangement. An installment plan must cover the balance; an offer in compromise must reach the statutory minimum and document hardship."
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: PaymentArrangement
    side_effects:
      - "moves status REQUESTED -> APPROVED, sets approved_at and moves Assessment.collection_status to ARRANGED"
      - "rejects an underfunded plan with ERR_PLAN_UNDERFUNDED, an offer below MIN_OIC_BP of the balance with ERR_OFFER_BELOW_MINIMUM and an undocumented hardship with ERR_HARDSHIP_NOT_DOCUMENTED"
      - "refused while any AppealProceeding of the assessment is OPEN (ERR_APPEAL_PENDING)"
  - method: POST
    path: "/payment-arrangements/{id}/payments"
    description: "Record a payment against an approved arrangement."
    roles: [Taxpayer, CollectionsAgent]
    code: 200
    input: [amount_cents]
    output: PaymentArrangement
    side_effects:
      - "increments amount_paid_cents and payments_made_count on the arrangement and Assessment.amount_paid_cents, lowering balance_due_cents"
      - "refused unless status == APPROVED (ERR_ARRANGEMENT_NOT_ACTIVE)"
      - "a fully performed arrangement moves to COMPLETED; an OFFER_IN_COMPROMISE first posts a SYSTEM OIC_WRITEOFF adjustment for the remaining balance, and either way Assessment.collection_status becomes SATISFIED and Taxpayer.compliance_status is recomputed"
  - method: POST
    path: "/payment-arrangements/{id}/default"
    description: "Declare an approved arrangement in default, which refers the assessment to collections."
    roles: [CollectionsAgent]
    code: 200
    input: [default_reason]
    output: PaymentArrangement
    side_effects:
      - "moves status APPROVED -> DEFAULTED and records default_reason"
      - "moves Assessment.collection_status to REFERRED with a SYSTEM COLLECTION_FEE adjustment, then sets Taxpayer.compliance_status = DELINQUENT"

  # ------------------------------------------------------------- test driver
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, statute, interest-day and window rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [AuditSupervisor]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "changes the instant every subsequent request evaluates statute_status, protest_deadline_date, escalation_deadline_date and interest_days against; stored fields are not rewritten"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication and authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Taxpayer-role caller addressed a resource that does not belong to the taxpayer named by X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user is the audit's lead_auditor_user_id closing that audit's own fieldwork, or is deciding a proceeding they or their predecessor forum already presided over, or the acting role does not match the proceeding's forum."
  # ---- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, unknown enum value, negative cents/bp/count, in_state_usage_pct_bp or confidence_level_bp outside 0..10000, period_start after period_end, unparseable date, or an empty/unrecognized abatement_factors set."
  # ---- existence
  - id: ERR_TAXPAYER_NOT_FOUND
    http: 404
    condition: "No Taxpayer with the given id."
  - id: ERR_INFORMATION_RETURN_NOT_FOUND
    http: 404
    condition: "No InformationReturn with the given id."
  - id: ERR_INDUSTRY_PROJECT_NOT_FOUND
    http: 404
    condition: "No IndustryProject with the given id."
  - id: ERR_AUDIT_LEAD_NOT_FOUND
    http: 404
    condition: "No AuditLead with the given id."
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No Audit with the given id."
  - id: ERR_STATUTE_WAIVER_NOT_FOUND
    http: 404
    condition: "No StatuteWaiver with the given id."
  - id: ERR_SAMPLING_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No SamplingAgreement with the given id."
  - id: ERR_SAMPLE_UNIT_NOT_FOUND
    http: 404
    condition: "No SampleUnit with the given id."
  - id: ERR_EXEMPTION_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "No ExemptionCertificate with the given id."
  - id: ERR_USE_TAX_PURCHASE_NOT_FOUND
    http: 404
    condition: "No UseTaxPurchase with the given id."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "No Assessment with the given id."
  - id: ERR_ASSESSMENT_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "No AssessmentAdjustment with the given id."
  - id: ERR_APPEAL_PROCEEDING_NOT_FOUND
    http: 404
    condition: "No AppealProceeding with the given id."
  - id: ERR_PAYMENT_ARRANGEMENT_NOT_FOUND
    http: 404
    condition: "No PaymentArrangement with the given id."
  # ---- state
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The addressed resource is not in a state from which the requested transition is declared: issuing a DRAFT_STALE assessment, recomputing a DRAFT assessment, scoping a SCOPED audit, closing fieldwork on a non-FIELDWORK audit, countering an AGREED or SUPERSEDED agreement, reviewing a VALIDATED certificate, curing a non-REJECTED certificate, executing a VOIDED waiver, deciding a DECIDED proceeding, approving a non-REQUESTED arrangement."
  - id: ERR_STALE_AUDIT_VERSION
    http: 412
    condition: "expected_audit_version does not equal the Audit's current version on POST /sampling-agreements."
  - id: ERR_STALE_ASSESSMENT_VERSION
    http: 412
    condition: "expected_assessment_version does not equal the Assessment's current version on POST /assessment-adjustments."
  # ---- cross-entity referential state
  - id: ERR_LEAD_NOT_SELECTED
    http: 409
    condition: "POST /audit-leads/{id}/convert on a lead whose status is not SELECTED."
  - id: ERR_TAXPAYER_AUDIT_IN_PROGRESS
    http: 409
    condition: "Converting a lead for a taxpayer whose open_audit_count is greater than 0."
  - id: ERR_AGREEMENT_NOT_AGREED
    http: 409
    condition: "Drawing a sample unit or projecting a sample when the audit has no AGREED sampling agreement, or when the unit's sampling_agreement_id is not the audit's agreed_agreement_id."
  - id: ERR_PROJECTION_STALE
    http: 409
    condition: "Drafting or recomputing an assessment, or closing fieldwork, while Audit.projection_status is STALE."
  - id: ERR_PREDECESSOR_NOT_DECIDED
    http: 409
    condition: "Escalating from a predecessor proceeding whose status is still OPEN."
  - id: ERR_APPEAL_PENDING
    http: 409
    condition: "Abating penalty, finalizing an assessment or approving an arrangement while a proceeding of that assessment is OPEN."
  # ---- interval geometry
  - id: ERR_AUDIT_SCOPE_OVERLAP
    http: 409
    condition: "The scope period shares at least one day with the closed scope interval of another non-terminal audit of the same taxpayer."
  - id: ERR_STRATUM_OVERLAP
    http: 422
    condition: "Two strata of a sampling agreement cover a common day under half-open [from, to) semantics."
  - id: ERR_STRATUM_GAP
    http: 422
    condition: "The strata do not tile the audit scope: a gap between adjacent strata, a first from after scope_period_start, or a last to before scope_period_end + 1 day."
  - id: ERR_STRATUM_INDEX_INVALID
    http: 422
    condition: "stratum_index is not a contiguous 0-based index into the agreement's strata array."
  - id: ERR_INVOICE_DATE_OUT_OF_STRATUM
    http: 422
    condition: "A sample unit's invoice_date falls outside the half-open interval of its declared stratum."
  # ---- temporal
  - id: ERR_STATUTE_EXPIRED
    http: 409
    condition: "Drawing or projecting a sample, closing fieldwork, issuing an assessment or executing a waiver on an audit whose derived statute_status is EXPIRED, or voiding a waiver that would leave the audit expired."
  - id: ERR_STATUTE_NOT_EXPIRED
    http: 409
    condition: "POST /audits/{id}/abandon on an audit whose limitation period has not run out."
  - id: ERR_WAIVER_NOT_EXTENDING
    http: 422
    condition: "extended_to_date is on or before the audit's running expiry at the moment the waiver is executed."
  - id: ERR_WAIVER_ALREADY_PENDING
    http: 409
    condition: "The audit already has a DRAFTED waiver awaiting signature."
  - id: ERR_NOTICE_DATE_INVALID
    http: 422
    condition: "notice_mailed_date is not the current logical clock date."
  - id: ERR_PROTEST_WINDOW_CLOSED
    http: 409
    condition: "An informal conference is filed after protest_deadline_date (day 60 inclusive is still open)."
  - id: ERR_ESCALATION_WINDOW_CLOSED
    http: 409
    condition: "An escalation is filed after the predecessor proceeding's escalation_deadline_date."
  # ---- money
  - id: ERR_ADJUSTMENT_EXCEEDS_BALANCE
    http: 422
    condition: "A posted adjustment's amount_cents exceeds Assessment.balance_due_cents."
  - id: ERR_REDUCTION_EXCEEDS_BALANCE
    http: 422
    condition: "A REDUCED decision's reduction_amount_cents exceeds Assessment.balance_due_cents."
  - id: ERR_PLAN_UNDERFUNDED
    http: 422
    condition: "monthly_installment_cents * term_months is below Assessment.balance_due_cents at approval."
  - id: ERR_OFFER_BELOW_MINIMUM
    http: 422
    condition: "offer_amount_cents * 10000 is below MIN_OIC_BP * Assessment.balance_due_cents at approval."
  - id: ERR_HARDSHIP_NOT_DOCUMENTED
    http: 422
    condition: "An OFFER_IN_COMPROMISE is approved without hardship_documented."
  - id: ERR_CAPITAL_ASSET_FMV_REQUIRED
    http: 422
    condition: "A CAPITAL_ASSET purchase with first_use_outside_state and months_used_outside_state >= 6 omits fair_market_value_at_entry_cents."
  - id: ERR_ERROR_AMOUNT_REQUIRED
    http: 422
    condition: "A sample unit set to UNREPORTED_TAXABLE_SALE or RATE_ERROR omits declared_error_amount_cents."
  - id: ERR_GOOD_FAITH_STANDARD_NOT_MET
    http: 422
    condition: "A VALIDATED determination is requested for a certificate that fails one of the three good-faith conditions."
  - id: ERR_ABATEMENT_NOT_ALLOWED
    http: 422
    condition: "Abatement requested on a fraud-indicator audit, on an assessment whose penalty was waived as a small balance, or on an assessment with penalty_cents == 0."
  # ---- quota, rounds, empty sets, sequence and uniqueness
  - id: ERR_NO_ELIGIBLE_CANDIDATES
    http: 422
    condition: "A THRESHOLD or HYBRID selection run scored candidates but selected none, or found no eligible taxpayer at all."
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "A revision would take round_number past MAX_NEGOTIATION_ROUNDS."
  - id: ERR_SAMPLE_SET_EMPTY
    http: 422
    condition: "A projection is requested when no sample unit of the agreed agreement has been determined (every unit still PENDING)."
  - id: ERR_SAMPLE_SIZE_NOT_MET
    http: 422
    condition: "A projection or a fieldwork close is requested with fewer examined units than the agreed agreement's minimum_sample_size."
  - id: ERR_ASSESSMENT_ALREADY_OPEN
    http: 409
    condition: "The audit already has a DRAFT, DRAFT_STALE or ISSUED assessment and supersedes_assessment_id does not name it."
  - id: ERR_FORUM_SEQUENCE_INVALID
    http: 409
    condition: "A forum is skipped or repeated on the ladder INFORMAL_CONFERENCE -> ADMINISTRATIVE_APPEAL -> TAX_TRIBUNAL, or a TAX_TRIBUNAL proceeding is decided REMANDED."
  - id: ERR_ADJUSTMENT_KIND_SYSTEM_ONLY
    http: 422
    condition: "A client posted an adjustment of a SYSTEM-only kind (PENALTY_ABATEMENT, APPEAL_REDUCTION, COLLECTION_FEE, OIC_WRITEOFF, ASSESSMENT_VACATED)."
  - id: ERR_ARRANGEMENT_NOT_ACTIVE
    http: 409
    condition: "A payment is recorded against an arrangement whose status is not APPROVED."
  - id: ERR_ASSESSMENT_NOT_FINALIZABLE
    http: 409
    condition: "Finalization requested while the protest window is still open, while a DECIDED proceeding's escalation window is still open, or while a proceeding is OPEN."
  - id: ERR_DUPLICATE_PERMIT_NUMBER
    http: 409
    condition: "permit_number already belongs to another Taxpayer."

# =============================================================================
# §1.7 RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: SelectionAnalyst
    description: "Runs the selection pipeline: loads information returns, scores permit holders and works the lead queue."
    identity: "opaque"
    exclusive_operations:
      - "POST /taxpayers/{id}/rescore-screening"
      - "POST /information-returns"
      - "POST /industry-projects/{id}/selection-runs"
    shared_operations:
      - "POST /taxpayers (with AuditSupervisor)"
      - "POST /industry-projects (with AuditSupervisor)"
      - "POST /audit-leads/{id}/decline (with AuditSupervisor)"
      - "GET /taxpayers, GET /taxpayers/{id}, GET /taxpayers/{id}/information-returns, GET /information-returns/{id}, GET /industry-projects, GET /industry-projects/{id}, GET /audit-leads, GET /audit-leads/{id}, GET /audits"
  - name: FieldAuditor
    description: "Performs the examination: negotiates methodology, draws the sample, reviews certificates and analyses untaxed purchases."
    identity: "opaque"
    exclusive_operations:
      - "POST /sampling-agreements"
      - "POST /sampling-agreements/{id}/revise"
      - "POST /sample-units"
      - "POST /sample-units/{id}/redetermine"
      - "POST /exemption-certificates/{id}/review"
      - "POST /use-tax-purchases"
      - "POST /use-tax-purchases/{id}/reclassify"
      - "POST /audits/{id}/project-sample"
    shared_operations:
      - "POST /audits/{id}/scope (with AuditSupervisor)"
      - "POST /statute-waivers (with AuditSupervisor)"
      - "POST /exemption-certificates (with Taxpayer)"
      - "GET /audits, GET /audits/{id}, GET /audits/{id}/liability-preview, GET /audits/{id}/statute-waivers, GET /audits/{id}/use-tax-purchases, GET /sampling-agreements, GET /sampling-agreements/{id}, GET /sampling-agreements/{id}/sample-units, GET /sample-units/{id}, GET /exemption-certificates, GET /exemption-certificates/{id}, GET /use-tax-purchases/{id}, GET /taxpayers, GET /taxpayers/{id}"
  - name: AuditSupervisor
    description: "Supervises the division: converts leads, closes fieldwork, issues, abates and finalizes assessments, and controls the logical clock. May not close fieldwork on an audit they lead."
    identity: "opaque"
    exclusive_operations:
      - "POST /audit-leads/{id}/convert"
      - "POST /audits/{id}/close-fieldwork"
      - "POST /audits/{id}/reopen-fieldwork"
      - "POST /audits/{id}/abandon"
      - "POST /statute-waivers/{id}/void"
      - "POST /assessments"
      - "POST /assessments/{id}/recompute"
      - "POST /assessments/{id}/issue"
      - "POST /assessments/{id}/abate-penalty"
      - "POST /assessments/{id}/finalize"
      - "POST /assessment-adjustments/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /taxpayers, POST /industry-projects, POST /audit-leads/{id}/decline (with SelectionAnalyst)"
      - "POST /audits/{id}/scope, POST /statute-waivers (with FieldAuditor)"
      - "POST /assessment-adjustments (with CollectionsAgent)"
      - "every GET except GET /taxpayers/{id}/information-returns is available; GET /assessments and GET /assessments/{id} are shared with CollectionsAgent, AppealsOfficer, TaxTribunalJudge and Taxpayer"
  - name: Taxpayer
    description: "The audited permit holder. Signs waivers, negotiates methodology, cures certificates, protests assessments and requests payment arrangements. Sees only its own resources."
    identity: "entity_backed:Taxpayer"
    exclusive_operations:
      - "POST /statute-waivers/{id}/execute"
      - "POST /sampling-agreements/{id}/counter"
      - "POST /sampling-agreements/{id}/agree"
      - "POST /exemption-certificates/{id}/cure"
      - "POST /appeal-proceedings"
    shared_operations:
      - "POST /exemption-certificates (with FieldAuditor)"
      - "POST /payment-arrangements, POST /payment-arrangements/{id}/payments (with CollectionsAgent)"
      - "GET /taxpayers/{id}, GET /taxpayers/{id}/information-returns, GET /audits/{id}, GET /audits/{id}/statute-waivers, GET /audits/{id}/use-tax-purchases, GET /statute-waivers/{id}, GET /sampling-agreements, GET /sampling-agreements/{id}, GET /sampling-agreements/{id}/sample-units, GET /sample-units/{id}, GET /exemption-certificates, GET /exemption-certificates/{id}, GET /use-tax-purchases/{id}, GET /assessments, GET /assessments/{id}, GET /assessments/{id}/payment-arrangements, GET /assessment-adjustments, GET /assessment-adjustments/{id}, GET /appeal-proceedings, GET /appeal-proceedings/{id}, GET /payment-arrangements/{id} — every one of these is additionally gated on ownership"
  - name: AppealsOfficer
    description: "Presides over the informal conference and the administrative appeal. May not decide a matter they audited or already presided over at the previous forum."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /appeal-proceedings/{id}/decision (with TaxTribunalJudge, restricted to forums INFORMAL_CONFERENCE and ADMINISTRATIVE_APPEAL)"
      - "GET /appeal-proceedings, GET /appeal-proceedings/{id}, GET /assessments, GET /assessments/{id}, GET /assessment-adjustments, GET /assessment-adjustments/{id}, GET /audits, GET /audits/{id}"
  - name: TaxTribunalJudge
    description: "Presides over the tax tribunal, the last rung of the ladder. A tribunal decision ends the matter: it cannot remand."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /appeal-proceedings/{id}/decision (with AppealsOfficer, restricted to forum TAX_TRIBUNAL)"
      - "GET /appeal-proceedings, GET /appeal-proceedings/{id}, GET /assessments, GET /assessments/{id}, GET /audits/{id}"
  - name: CollectionsAgent
    description: "Collects issued assessments: refers to collections, approves arrangements, records payments and declares defaults."
    identity: "opaque"
    exclusive_operations:
      - "POST /assessments/{id}/collection-referral"
      - "POST /payment-arrangements/{id}/approve"
      - "POST /payment-arrangements/{id}/default"
    shared_operations:
      - "POST /assessment-adjustments (with AuditSupervisor)"
      - "POST /payment-arrangements, POST /payment-arrangements/{id}/payments (with Taxpayer)"
      - "GET /taxpayers, GET /assessments, GET /assessments/{id}, GET /assessments/{id}/payment-arrangements, GET /assessment-adjustments, GET /assessment-adjustments/{id}, GET /appeal-proceedings, GET /appeal-proceedings/{id}, GET /payment-arrangements/{id}"
