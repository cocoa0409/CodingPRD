      - name: end_production_action_re_derives_the_mandated_deadlines_and_a_second_call_is_rejected
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /repair-program/product-models/{model_id}/end-production]
          - state_machines.ProductModel.transitions[ACTIVE_PRODUCTION -> LEGACY_SUPPORT]
          - calculations.mandated_support_window.formula
          - validations[priority=60]
        distinguishing_aspect: |
          The action rewrites a child obligation that was created while the model
          was still in production — deadline_basis flips from PRODUCTION_ACTIVE to
          END_OF_PRODUCTION and two null deadlines become dates — and the trigger
          is not repeatable out of LEGACY_SUPPORT.
        test_recipe:
          setup:
            - "Profile US-CA (7/7); model CRX-E2 (TIER_A) with no end_of_production_date; PUBLISHED part SKU-E2-A with an open-ended compatibility row and a PUBLISHED DISASSEMBLY_GUIDE covering it; one obligation for (CRX-E2, US-CA)."
