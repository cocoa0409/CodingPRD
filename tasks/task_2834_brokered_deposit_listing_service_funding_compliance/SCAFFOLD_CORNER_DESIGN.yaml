          assert:
            - "${e1} == ERR_INVALID_REQUEST with HTTP 400 - FROBNICATE is not a declared action member, so priority 3 fires before priority 18"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400 - Q5 fails the report_period pattern"
            - "${e3} == ERR_INVALID_REQUEST with HTTP 400 - a negative *_cents field is rejected on shape, not on arithmetic"
            - "${e4} == ERR_INVALID_REQUEST with HTTP 400 - score fields are constrained to 0..100"
            - "no CallReportFiling and no BrokerAgreement row is created; DepositProgram.${prog_id}.state is still PENDING_CLASSIFICATION"

      - name: corner_uniqueness_scopes_are_per_parent_not_global
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_KEY]
          - validations[priority 39 ERR_DUPLICATE_KEY]
        distinguishing_aspect: "agreement_ref is unique within one broker and report_period within one institution, so the same literal succeeds under a different parent and only collides under the same one; the NationalRateCap key is the (tenor_bucket, effective_date) pair, so one component differing is enough to pass."
