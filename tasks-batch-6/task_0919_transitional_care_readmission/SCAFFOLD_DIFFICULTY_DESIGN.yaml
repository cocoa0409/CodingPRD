  - rule_id: non_linear_state_machine
    instances:
      - name: visit_encounter_no_show_reschedule_cycle
        grounds:
          - state_machines.TcmVisit.SCHEDULED_to_NO_SHOW
          - state_machines.TcmVisit.NO_SHOW_to_SCHEDULED
          - entities.TcmVisit.fields.encounter_status
          - entities.TcmVisit.fields.confirmation_status
          - calculations.visit_deadline_status
        distinguishing_aspect: |
          The non-linear shape is a CYCLE on the TcmVisit encounter axis - the
          same row traverses SCHEDULED to NO_SHOW to SCHEDULED twice, each
          reschedule resetting confirmation_status to UNCONFIRMED, which no
          linear pipeline can express.
