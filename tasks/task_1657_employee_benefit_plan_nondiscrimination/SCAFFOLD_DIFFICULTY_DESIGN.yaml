        payload:
          ssn: '333330002'
          full_name: Noah Two
          date_of_birth: '1982-01-01'
          date_of_hire: '2020-01-01'
          employment_status: ACTIVE
        as: PlanAdministrator
        captures:
          n3b: $.data.id
      - call: POST /ndt/plan-years/${py3_id}/census-employees
        payload:
          ssn: '333330003'
          full_name: Hank Three
          date_of_birth: '1975-01-01'
          date_of_hire: '2015-01-01'
          employment_status: ACTIVE
          ownership_pct_direct: 6
        as: PlanAdministrator
        captures:
          h3c: $.data.id
      - call: POST /ndt/census-employees/${n3a}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 10000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${n3b}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 10000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${h3c}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 30000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${n3a}/contributions
        payload:
          contribution_type: ELECTIVE_DEFERRAL
          amount_cents: 400000
          contribution_date: '2026-06-30'
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${n3b}/contributions
        payload:
          contribution_type: ELECTIVE_DEFERRAL
          amount_cents: 600000
          contribution_date: '2026-06-30'
        as: PlanAdministrator
