            - call: "POST /clients/${cc_id}/grant-applications"
              payload: { fund_id: "${f_id}", category: "FOOD", requested_cents: 60000, hardship_statement: "c" }
              as: Client
              as_user_id: "${cc_id}"
              captures: { gc_id: $.data.id }
            - call: "POST /grant-applications/${gc_id}/submit"
              payload: {}
              as: Client
