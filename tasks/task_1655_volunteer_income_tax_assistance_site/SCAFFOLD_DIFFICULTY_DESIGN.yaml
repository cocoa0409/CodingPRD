  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: volunteer_overlap_half_open_semantics
        grounds:
          - calculations.appointment_conflict_check
          - validations[priority=8]
          - errors[ERR_APPOINTMENT_OVERLAP_VOLUNTEER]
        distinguishing_aspect: |
          Resource = Volunteer, semantics = binary exclusion over half-open
          intervals [start_at, end_at): the 11:00-12:00 appointment is allowed
          because it only touches the 10:00-11:00 appointment at the boundary
          instant, while the 10:30-11:30 appointment overlaps in the open
          interior and is rejected.
        test_recipe:
          setup:
            - "Certified OPEN site (capacity 4); preparer active; three verified taxpayers"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Library VITA", sponsor_org: "UnitedWay", station_capacity: 4, season_start: "2026-07-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", daily_open_hour: 9, daily_close_hour: 17, goal_returns: 50 }, as: SponsorAdmin, captures: { site_id: $.data.id } }
