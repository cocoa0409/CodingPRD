# =============================================================================
# Task 0999 — Corporate Wellness Program & Incentive Platform
# Seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  generate task hard than expert level! 999. Corporate Wellness Program &
  Incentive Platform: population & enrollment, HRA & biometric capture,
  challenge/activity & points, incentive/premium-differential rules,
  device/app integration, coaching referral, de-identified aggregate
  reporting, vendor & billing

domain_name: corporate-wellness-incentives
api_prefix: /wellness

complexity_profile:
  primary_archetype: ledger_reconciliation      # provisional vs settled points ledger vs premium-differential schedule: same activity data, two algorithms, divergent money outcomes
  secondary_archetype: compliance_audit         # k-anonymity suppression, reasonable-alternative standard, segregation of duties on vendor billing
  complexity_layers:
    - dual_variant_calculation                  # PROVISIONAL vs SETTLED points; STANDARD vs REASONABLE_ALTERNATIVE award
    - rate_threshold_triggers                   # tier thresholds (>=), daily points cap, k-anonymity threshold
    - derived_field_reconciliation              # enrollment balances recomputed from ledger on every mutation
    - idempotency                               # device sync dedupe on (device_source, external_event_id)
  entity_topology: flat                         # peer entities joined by FK references; sub-resource GETs only for reverse reachability
  state_machine_shape: cyclic                   # CoachingReferral re-referral loop and IncentiveAward dispute loop; Enrollment additionally carries parallel state dimensions
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties             # invoice submitter (VendorManager) must differ from approver (PlatformAdmin) by X-User-ID
  consistency_model: immediate                  # all cascades and recomputes visible in the same request/response

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employer legal name" }
      - { name: annual_self_only_premium_cents, type: integer, source: input, description: "Annual self-only medical premium in cents; basis of the award cap" }
      - { name: tobacco_surcharge_cents, type: integer, source: input, description: "Annual tobacco surcharge in cents applied when attested and not waived" }
      - { name: pmpm_fee_cents, type: integer, source: input, description: "Vendor per-member-per-month fee in cents (full month)" }
      - { name: coaching_session_fee_cents, type: integer, source: input, description: "Vendor fee per coaching session in cents" }
      - { name: k_anonymity_threshold, type: integer, source: input, description: "Minimum cohort size for de-identified aggregate reporting" }
      - { name: kiosk_capacity, type: integer, source: input, description: "Max overlapping biometric-screening appointments per clinic_location" }
      - { name: invoice_approval_limit_cents, type: integer, source: input, description: "Invoice totals strictly greater than this require override_limit=true on approve" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: email, type: string, source: input, description: "Work email; unique per employer" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: department, type: string, source: input, description: "Department code used as report cohort filter" }
      - { name: hire_date, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: tobacco_attested, type: boolean, source: input, default: false, description: "Self-attested tobacco use flag" }

  - name: WellnessProgram
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: plan_year_start, type: string, source: input, description: "ISO date; inclusive plan-year start" }
      - { name: plan_year_end, type: string, source: input, description: "ISO date; EXCLUSIVE plan-year end (window is half-open [start, end))" }
      - { name: bronze_threshold, type: integer, source: input, description: "Settled points for BRONZE (>=)" }
      - { name: silver_threshold, type: integer, source: input, description: "Settled points for SILVER (>=)" }
      - { name: gold_threshold, type: integer, source: input, description: "Settled points for GOLD (>=)" }
      - { name: bronze_award_cents, type: integer, source: input, description: "BRONZE tier annual award" }
      - { name: silver_award_cents, type: integer, source: input, description: "SILVER tier annual award" }
      - { name: gold_award_cents, type: integer, source: input, description: "GOLD tier annual award" }
      - { name: premium_cap_pct, type: number, source: input, description: "Max award as fraction of annual_self_only_premium_cents (e.g. 0.30)" }
      - { name: coaching_required_sessions, type: integer, source: input, description: "Sessions required before a referral may be discharged" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | SETTLED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> WellnessProgram.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: ra_eligible, type: boolean, source: input, default: false, description: "Reasonable-alternative eligibility (medical waiver) set at creation by BenefitsAdmin" }
      - { name: participation_status, type: enum, source: system, description: "INVITED | ACTIVE | SUSPENDED | TERMINATED — independent state axis 1" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | VERIFIED | FLAGGED — independent state axis 2, driven by HRA/screening events" }
      - { name: points_balance_provisional, type: integer, source: computed, default: 0, description: "Sum of points_delta over ledger entries with status PROVISIONAL or POSTED" }
      - { name: points_balance_settled, type: integer, source: computed, default: 0, description: "Sum of points_delta over ledger entries with status POSTED only" }
      - { name: auto_referral_count, type: integer, source: computed, default: 0, description: "Number of AUTO_RISK coaching referrals created for this enrollment" }
      - { name: terminated_at, type: datetime, source: system, description: "Set when participation_status -> TERMINATED; null otherwise" }

  - name: HealthAssessment
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: answers, type: array, source: input, description: "Exactly 10 integers, each 0..10" }
      - { name: risk_score, type: integer, source: computed, description: "Sum of answers" }
      - { name: risk_band, type: enum, source: computed, description: "LOW (<30) | MODERATE (30..59) | HIGH (>=60)" }

  - name: BiometricScreening
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: clinic_location, type: string, source: input, description: "Clinic/kiosk location code; capacity scope" }
      - { name: slot_start, type: datetime, source: input, description: "Appointment start (inclusive)" }
      - { name: slot_end, type: datetime, source: input, description: "Appointment end (exclusive); must be > slot_start" }
      - { name: bmi, type: number, source: input, description: "Set on result" }
      - { name: systolic_bp, type: integer, source: input, description: "Set on result" }
      - { name: total_cholesterol, type: integer, source: input, description: "Set on result" }
      - { name: glucose, type: integer, source: input, description: "Set on result" }
      - { name: targets_met, type: integer, source: computed, description: "Count 0..4 of: bmi<30.0, systolic_bp<140, total_cholesterol<200, glucose<100" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RESULTED | NO_SHOW" }

  - name: Challenge
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> WellnessProgram.id" }
      - { name: name, type: string, source: input, description: "Challenge name" }
      - { name: activity_type, type: enum, source: input, description: "STEPS | MINUTES | VISITS" }
      - { name: goal_quantity, type: integer, source: input, description: "Progress needed to complete (>=)" }
      - { name: points_reward, type: integer, source: input, description: "BONUS ledger points granted on completion" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (exclusive); must be > starts_at" }
      - { name: completed_count, type: integer, source: computed, default: 0, description: "Participations currently in COMPLETED status" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ACTIVE | COMPLETED" }

  - name: ChallengeParticipation
    parent: null
    common_fields: true
    fields:
      - { name: challenge_id, type: string, source: input, description: "FK -> Challenge.id" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: progress_quantity, type: integer, source: computed, default: 0, description: "Sum of quantity of ACCEPTED ActivityEvents matching activity_type with occurred_at in [starts_at, ends_at)" }
      - { name: status, type: enum, source: system, description: "JOINED | COMPLETED | FAILED" }

  - name: ActivityEvent
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: device_source, type: string, source: input, description: "Device/app source identifier (e.g. fitbit, apple-health)" }
      - { name: external_event_id, type: string, source: input, description: "Idempotency key; unique per (enrollment_id, device_source)" }
      - { name: activity_type, type: enum, source: input, description: "STEPS | MINUTES | VISITS" }
      - { name: quantity, type: integer, source: input, description: "Raw activity quantity (steps / minutes / visits); > 0" }
      - { name: occurred_at, type: datetime, source: input, description: "When the activity happened; must be within program plan year and not in the future" }
      - { name: points_granted, type: integer, source: computed, description: "Points actually granted after rate conversion and daily cap" }

  - name: PointsLedgerEntry
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: kind, type: enum, source: system, description: "EARNED (activity) | BONUS (challenge completion) | ADJUSTED (manual)" }
      - { name: points_delta, type: integer, source: system, description: "Signed points; EARNED/BONUS positive, ADJUSTED signed" }
      - { name: source_activity_event_id, type: string, source: system, description: "FK -> ActivityEvent.id; only when kind=EARNED, null otherwise" }
      - { name: reason, type: string, source: input, description: "Required free-text reason when kind=ADJUSTED" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | POSTED | EXPIRED — ADJUSTED entries are created POSTED" }

  - name: IncentiveAward
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: computed, description: "FK -> Enrollment.id" }
      - { name: program_id, type: string, source: computed, description: "FK -> WellnessProgram.id (denormalized from enrollment)" }
      - { name: tier, type: enum, source: computed, description: "NONE | BRONZE | SILVER | GOLD from tier_attainment" }
      - { name: standard_award_cents, type: integer, source: computed, description: "Award under the STANDARD variant (always stored for comparison)" }
      - { name: award_cents, type: integer, source: computed, description: "Award actually conferred after variant selection" }
      - { name: applied_variant, type: enum, source: computed, description: "STANDARD | REASONABLE_ALTERNATIVE" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Tobacco surcharge (0 when waived)" }
      - { name: net_annual_differential_cents, type: integer, source: computed, description: "= surcharge_cents - award_cents (positive = employee pays more)" }
      - { name: status, type: enum, source: system, description: "PROJECTED | CONFIRMED | APPLIED | DISPUTED" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock timestamp of CONFIRMED transition; null until confirmed" }
      - { name: dispute_reason, type: string, source: input, description: "Required on dispute" }

  - name: CoachingReferral
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: reason, type: enum, source: input, description: "HIGH_RISK | TOBACCO_CESSATION | RA_REQUEST" }
      - { name: source, type: enum, source: system, description: "MANUAL (BenefitsAdmin) | AUTO_RISK (system on HIGH HRA)" }
      - { name: assigned_coach_id, type: string, source: system, description: "Opaque X-User-ID of the Coach who engaged; null until ENGAGED" }
      - { name: sessions_completed, type: integer, source: computed, default: 0, description: "Sessions logged in the current round; resets to 0 on rerefer" }
      - { name: session_dates, type: array, source: system, description: "Lifetime list of session dates (ISO date), never reset; billing reads this" }
      - { name: referral_round, type: integer, source: system, default: 1, description: "Increments on each rerefer" }
      - { name: outcome, type: enum, source: input, description: "GOALS_MET | GOALS_NOT_MET; set on discharge, cleared on rerefer" }
      - { name: status, type: enum, source: system, description: "REFERRED | ENGAGED | DISCHARGED | DECLINED" }

  - name: VendorInvoice
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> WellnessProgram.id" }
      - { name: vendor_name, type: string, source: input, description: "Vendor label" }
      - { name: period_start, type: string, source: input, description: "ISO date; inclusive billing period start" }
      - { name: period_end, type: string, source: input, description: "ISO date; INCLUSIVE billing period end; must be >= period_start" }
      - { name: line_items, type: array, source: computed, description: "Computed at creation + appended adjustments: [{ line_type: MEMBER_MONTH|COACHING_SESSION|ADJUSTMENT, ref_id, amount_cents, note }]" }
      - { name: total_cents, type: integer, source: computed, description: "Exact sum of line_items.amount_cents" }
      - { name: submitted_by, type: string, source: system, description: "Opaque X-User-ID of the VendorManager who submitted" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | PAID | DISPUTED" }

  - name: AggregateReport
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> WellnessProgram.id" }
      - { name: department, type: string, source: input, description: "Cohort filter: Employee.department equality" }
      - { name: cohort_size, type: integer, source: computed, description: "Enrollments of program whose employee.department matches and participation_status in {ACTIVE, SUSPENDED, TERMINATED}" }
      - { name: avg_settled_points, type: number, source: computed, description: "Mean of cohort points_balance_settled, 2 decimal places round_half_up" }
      - { name: participation_rate, type: number, source: computed, description: "Fraction of cohort with >=1 COMPLETED participation, 4 decimal places round_half_up" }
      - { name: tobacco_rate, type: number, source: computed, description: "Fraction of cohort whose employee.tobacco_attested is true, 4 decimal places round_half_up" }
      - { name: status, type: enum, source: system, description: "GENERATED | PUBLISHED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WellnessProgram
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wellness/programs/{id}/activate"
        actor: BenefitsAdmin
        preconditions:
          - "plan_year_end > plan_year_start (else ERR_INVALID_REQUEST)"
          - "No other program for the same employer with status in {ACTIVE, CLOSED} whose half-open window overlaps [plan_year_start, plan_year_end); adjacency (other.plan_year_end == this.plan_year_start or this.plan_year_end == other.plan_year_start) is allowed (else ERR_PROGRAM_WINDOW_OVERLAP)"
        side_effects: ["increments WellnessProgram.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /wellness/programs/{id}/close"
        actor: BenefitsAdmin
        preconditions: []
        side_effects:
          - "Every PROVISIONAL PointsLedgerEntry of every enrollment in this program -> EXPIRED; both enrollment balances recomputed"
          - "Every Challenge with status PUBLISHED or ACTIVE -> COMPLETED; each JOINED participation resolved: progress_quantity >= goal_quantity -> COMPLETED (grants BONUS entry as POSTED because program is closing? NO — BONUS granted as PROVISIONAL then immediately EXPIRED by the ledger sweep above; ordering: challenge sweep runs FIRST, ledger expiry SECOND, so completion BONUS entries are created PROVISIONAL and then expired in the same close)"
          - "Every BiometricScreening with status SCHEDULED -> NO_SHOW"
          - "increments WellnessProgram.version by 1"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /wellness/programs/{id}/settle"
        actor: BenefitsAdmin
        preconditions:
          - "Every IncentiveAward of this program has status APPLIED (else ERR_PROGRAM_HAS_OPEN_AWARDS)"
        side_effects: ["increments WellnessProgram.version by 1"]

  - entity: Enrollment
    initial_state: "participation_status=INVITED, verification_status=PENDING"
    terminal_states: ["participation_status=TERMINATED"]
    transitions:
      - from: "participation_status=INVITED"
        to: "participation_status=ACTIVE"
        trigger: "POST /wellness/enrollments/{id}/accept"
        actor: Employee
        preconditions:
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "X-User-ID == enrollment.employee_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["increments Enrollment.version by 1"]
      - from: "participation_status=ACTIVE"
        to: "participation_status=SUSPENDED"
        trigger: "POST /wellness/enrollments/{id}/suspend"
        actor: BenefitsAdmin
        preconditions: []
        side_effects: ["increments Enrollment.version by 1"]
      - from: "participation_status=SUSPENDED"
        to: "participation_status=ACTIVE"
        trigger: "POST /wellness/enrollments/{id}/reinstate"
        actor: BenefitsAdmin
        preconditions:
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
        side_effects: ["increments Enrollment.version by 1"]
      - from: "participation_status=INVITED"
        to: "participation_status=TERMINATED"
        trigger: "POST /wellness/enrollments/{id}/terminate"
        actor: BenefitsAdmin
        preconditions: []
        side_effects: ["terminated_at = logical clock now", "increments Enrollment.version by 1"]
      - from: "participation_status=ACTIVE"
        to: "participation_status=TERMINATED"
        trigger: "POST /wellness/enrollments/{id}/terminate"
        actor: BenefitsAdmin
        preconditions: []
        side_effects: ["terminated_at = logical clock now", "increments Enrollment.version by 1"]
      - from: "participation_status=SUSPENDED"
        to: "participation_status=TERMINATED"
        trigger: "POST /wellness/enrollments/{id}/terminate"
        actor: BenefitsAdmin
        preconditions: []
        side_effects: ["terminated_at = logical clock now", "increments Enrollment.version by 1"]
      - from: "verification_status=PENDING"
        to: "verification_status=VERIFIED"
        trigger: "system (automatic when a HealthAssessment is created for this enrollment)"
        actor: system
        preconditions: []
        side_effects: ["increments Enrollment.version by 1"]
        note: "Independent of participation_status; a SUSPENDED member can still become VERIFIED"
      - from: "verification_status=VERIFIED"
        to: "verification_status=FLAGGED"
        trigger: "system (automatic when a BiometricScreening transitions to RESULTED with targets_met <= 1)"
        actor: system
        preconditions: []
        side_effects: ["increments Enrollment.version by 1"]
      - from: "verification_status=FLAGGED"
        to: "verification_status=VERIFIED"
        trigger: "system (automatic when a later BiometricScreening transitions to RESULTED with targets_met >= 3)"
        actor: system
        preconditions: []
        side_effects: ["increments Enrollment.version by 1"]

  - entity: HealthAssessment
    initial_state: SCORED
    terminal_states: [SCORED]
    transitions:
      - from: "(create)"
        to: SCORED
        trigger: "POST /wellness/hras"
        actor: Employee
        preconditions:
          - "enrollment.participation_status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "No prior HealthAssessment exists for this enrollment (else ERR_HRA_ALREADY_COMPLETED)"
          - "answers has exactly 10 integers each in 0..10 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "risk_score and risk_band computed"
          - "Enrollment.verification_status PENDING -> VERIFIED"
          - "If risk_band == HIGH: auto-create CoachingReferral(reason=HIGH_RISK, source=AUTO_RISK, status=REFERRED) and increment Enrollment.auto_referral_count by 1"

  - entity: BiometricScreening
    initial_state: SCHEDULED
    terminal_states: [RESULTED, NO_SHOW]
    transitions:
      - from: "(create)"
        to: SCHEDULED
        trigger: "POST /wellness/biometric-screenings"
        actor: Employee
        preconditions:
          - "enrollment.participation_status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "slot_end > slot_start (else ERR_INVALID_REQUEST)"
          - "slot_start >= plan_year_start and slot_end <= plan_year_end of the enrollment's program (else ERR_SLOT_OUTSIDE_WINDOW)"
          - "Count of other SCHEDULED screenings at the same clinic_location whose [slot_start, slot_end) strictly overlaps the new one (new.start < other.end AND new.end > other.start) must be < employer.kiosk_capacity (else ERR_KIOSK_CAPACITY_EXCEEDED); back-to-back adjacency does not count as overlap"
        side_effects: []
      - from: SCHEDULED
        to: RESULTED
        trigger: "POST /wellness/biometric-screenings/{id}/result"
        actor: BenefitsAdmin
        preconditions: []
        side_effects:
          - "targets_met computed from the four biometric targets"
          - "Enrollment.verification_status: VERIFIED -> FLAGGED if targets_met <= 1; FLAGGED -> VERIFIED if targets_met >= 3"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (automatic sweep when the logical clock advances past slot_end, applied by POST /_clock/set_current_utc and by program close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Challenge
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /wellness/challenges/{id}/publish"
        actor: BenefitsAdmin
        preconditions:
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "No other challenge in the same program with the same activity_type and status in {PUBLISHED, ACTIVE} whose half-open [starts_at, ends_at) overlaps this one; adjacency allowed (else ERR_CHALLENGE_WINDOW_OVERLAP)"
        side_effects: ["increments Challenge.version by 1"]
      - from: PUBLISHED
        to: ACTIVE
        trigger: "system (automatic sweep when logical clock >= starts_at, applied by POST /_clock/set_current_utc)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic sweep when logical clock > ends_at, applied by POST /_clock/set_current_utc; also by program close)"
        actor: system
        preconditions: []
        side_effects:
          - "Every JOINED participation resolved: progress_quantity >= goal_quantity -> COMPLETED (grants BONUS ledger entry PROVISIONAL, increments completed_count); else -> FAILED"

  - entity: ChallengeParticipation
    initial_state: JOINED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: "(create)"
        to: JOINED
        trigger: "POST /wellness/challenge-participations"
        actor: Employee
        preconditions:
          - "enrollment.participation_status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "challenge.status in {PUBLISHED, ACTIVE} (else ERR_INVALID_STATE)"
          - "enrollment.program_id == challenge.program_id (else ERR_CHALLENGE_PROGRAM_MISMATCH)"
          - "No existing participation for (challenge_id, enrollment_id) (else ERR_PARTICIPATION_EXISTS)"
        side_effects:
          - "progress_quantity initialized by summing already-accepted matching events in the window (backfill)"
      - from: JOINED
        to: COMPLETED
        trigger: "system (automatic during activity-event acceptance cascade when progress_quantity >= goal_quantity; or at challenge completion sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Create PointsLedgerEntry(kind=BONUS, points_delta=challenge.points_reward, status=PROVISIONAL)"
          - "Enrollment points balances recomputed"
          - "Challenge.completed_count += 1"
      - from: JOINED
        to: FAILED
        trigger: "system (challenge completion sweep when progress_quantity < goal_quantity)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PointsLedgerEntry
    initial_state: "PROVISIONAL (EARNED/BONUS) or POSTED (ADJUSTED)"
    terminal_states: [POSTED, EXPIRED]
    transitions:
      - from: PROVISIONAL
        to: POSTED
        trigger: "POST /wellness/programs/{id}/finalize-points"
        actor: BenefitsAdmin
        preconditions:
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "All PROVISIONAL entries of all enrollments in the program -> POSTED"
          - "Enrollment points balances recomputed"
      - from: PROVISIONAL
        to: EXPIRED
        trigger: "system (program close)"
        actor: system
        preconditions: []
        side_effects: ["Enrollment points balances recomputed"]

  - entity: IncentiveAward
    initial_state: PROJECTED
    terminal_states: [APPLIED]
    transitions:
      - from: "(compute)"
        to: PROJECTED
        trigger: "POST /wellness/incentive-awards/compute"
        actor: BenefitsAdmin
        preconditions:
          - "program.status in {ACTIVE, CLOSED} (DRAFT -> ERR_PROGRAM_NOT_ACTIVE; SETTLED -> ERR_PROGRAM_ALREADY_SETTLED)"
        side_effects:
          - "One award per eligible enrollment (participation_status in {ACTIVE, SUSPENDED}); existing PROJECTED awards recomputed in place; CONFIRMED/APPLIED/DISPUTED awards untouched"
      - from: PROJECTED
        to: CONFIRMED
        trigger: "POST /wellness/incentive-awards/{id}/confirm"
        actor: BenefitsAdmin
        preconditions:
          - "program.status == CLOSED (else ERR_PROGRAM_NOT_CLOSED)"
          - "award amounts were computed after the latest program close (else ERR_AWARD_NOT_CONFIRMABLE)"
        side_effects: ["confirmed_at = logical clock now", "increments IncentiveAward.version by 1"]
      - from: CONFIRMED
        to: APPLIED
        trigger: "POST /wellness/incentive-awards/{id}/apply"
        actor: BenefitsAdmin
        preconditions: []
        side_effects: ["increments IncentiveAward.version by 1"]
      - from: CONFIRMED
        to: DISPUTED
        trigger: "POST /wellness/incentive-awards/{id}/dispute"
        actor: Employee
        preconditions:
          - "X-User-ID == enrollment.employee_id of the award's enrollment (else ERR_OWNERSHIP_MISMATCH)"
          - "logical clock <= confirmed_at + 30 days (else ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: ["increments IncentiveAward.version by 1"]
      - from: DISPUTED
        to: CONFIRMED
        trigger: "POST /wellness/incentive-awards/{id}/resolve"
        actor: BenefitsAdmin
        preconditions:
          - "outcome in {UPHELD, ADJUSTED}; adjusted_award_cents required iff outcome=ADJUSTED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "If ADJUSTED: award_cents = adjusted_award_cents; net_annual_differential_cents recomputed"
          - "confirmed_at refreshed to logical clock now (new 30-day dispute window)"
          - "increments IncentiveAward.version by 1"

  - entity: CoachingReferral
    initial_state: REFERRED
    terminal_states: [DISCHARGED, DECLINED]
    transitions:
      - from: REFERRED
        to: ENGAGED
        trigger: "POST /wellness/coaching-referrals/{id}/engage"
        actor: Coach
        preconditions: []
        side_effects: ["assigned_coach_id = X-User-ID of the engaging Coach", "increments CoachingReferral.version by 1"]
      - from: ENGAGED
        to: DISCHARGED
        trigger: "POST /wellness/coaching-referrals/{id}/discharge"
        actor: Coach
        preconditions:
          - "X-User-ID == assigned_coach_id (else ERR_OWNERSHIP_MISMATCH)"
          - "sessions_completed >= program.coaching_required_sessions (else ERR_REFERRAL_SESSIONS_INSUFFICIENT)"
        side_effects:
          - "outcome set from input"
          - "Cascade: if enrollment.ra_eligible and outcome == GOALS_MET, recompute the enrollment's PROJECTED IncentiveAward under the REASONABLE_ALTERNATIVE variant"
          - "increments CoachingReferral.version by 1"
      - from: REFERRED
        to: DECLINED
        trigger: "POST /wellness/coaching-referrals/{id}/decline"
        actor: Employee
        preconditions:
          - "X-User-ID == enrollment.employee_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: ["increments CoachingReferral.version by 1"]
      - from: DISCHARGED
        to: REFERRED
        trigger: "POST /wellness/coaching-referrals/{id}/rerefer"
        actor: BenefitsAdmin
        preconditions: []
        side_effects: ["referral_round += 1", "sessions_completed = 0", "outcome = null", "assigned_coach_id = null", "increments CoachingReferral.version by 1"]
      - from: DECLINED
        to: REFERRED
        trigger: "POST /wellness/coaching-referrals/{id}/rerefer"
        actor: BenefitsAdmin
        preconditions: []
        side_effects: ["referral_round += 1", "sessions_completed = 0", "outcome = null", "assigned_coach_id = null", "increments CoachingReferral.version by 1"]

  - entity: VendorInvoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: "(create)"
        to: DRAFT
        trigger: "POST /wellness/vendor-invoices"
        actor: VendorManager
        preconditions:
          - "program.status in {ACTIVE, CLOSED} (DRAFT -> ERR_PROGRAM_NOT_ACTIVE; SETTLED -> ERR_PROGRAM_ALREADY_SETTLED)"
          - "period_end >= period_start (else ERR_INVALID_REQUEST)"
        side_effects:
          - "line_items computed (MEMBER_MONTH + COACHING_SESSION) and total_cents summed per vendor_invoice_total"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wellness/vendor-invoices/{id}/submit"
        actor: VendorManager
        preconditions: []
        side_effects: ["submitted_by = X-User-ID", "increments VendorInvoice.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /wellness/vendor-invoices/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "X-User-ID != submitted_by (segregation of duties, else ERR_SOD_VIOLATION)"
          - "total_cents <= employer.invoice_approval_limit_cents OR override_limit=true (else ERR_INVOICE_EXCEEDS_LIMIT)"
        side_effects: ["increments VendorInvoice.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /wellness/vendor-invoices/{id}/pay"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments VendorInvoice.version by 1"]
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /wellness/vendor-invoices/{id}/dispute"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments VendorInvoice.version by 1"]
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /wellness/vendor-invoices/{id}/revise"
        actor: VendorManager
        preconditions: []
        side_effects: ["submitted_by = null", "increments VendorInvoice.version by 1"]

  - entity: AggregateReport
    initial_state: GENERATED
    terminal_states: [PUBLISHED]
    transitions:
      - from: "(create)"
        to: GENERATED
        trigger: "POST /wellness/aggregate-reports"
        actor: BenefitsAdmin
        preconditions:
          - "program.status == CLOSED (ACTIVE/DRAFT -> ERR_PROGRAM_NOT_CLOSED; SETTLED -> ERR_PROGRAM_ALREADY_SETTLED)"
          - "cohort_size >= employer.k_anonymity_threshold (else ERR_COHORT_TOO_SMALL; no report is persisted)"
        side_effects: ["cohort_size, avg_settled_points, participation_rate, tobacco_rate computed"]
      - from: GENERATED
        to: PUBLISHED
        trigger: "POST /wellness/aggregate-reports/{id}/publish"
        actor: BenefitsAdmin
        preconditions:
          - "program.status == CLOSED (else ERR_PROGRAM_ALREADY_SETTLED)"
        side_effects: ["increments AggregateReport.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-adjustment-stale-version
    parent_entity: Enrollment
    write_endpoint: "POST /wellness/enrollments/{id}/adjustments"
    occ_field: expected_enrollment_version
    description: |
      Posting a manual points adjustment against an Enrollment whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just posted an adjustment (or a
      cascade bumped the balance) and the current writer's view of the
      enrollment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: challenge-update-stale-version
    parent_entity: Challenge
    write_endpoint: "PATCH /wellness/challenges/{id}"
    occ_field: expected_challenge_version
    description: |
      Editing a DRAFT Challenge whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      writer has just edited the challenge and the current writer's view of
      the goal/window fields is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: activity_points_conversion
    trigger: "ActivityEvent acceptance (POST /wellness/activity-events)"
    algorithm: chronological
    formula: |
      raw = match activity_type:
        STEPS  -> floor(quantity / 1000)
        MINUTES -> floor(quantity / 30)
        VISITS -> quantity * 10
      day_key = UTC calendar date of occurred_at
      day_total = sum(points_granted of ACCEPTED events for this enrollment
                  with the same day_key), accumulated in ingestion order
                  (created_at ASC; tie-break: none needed, created_at is unique per request)
      points_granted = min(raw, max(0, DAILY_CAP - day_total))
    input_set: "ACCEPTED ActivityEvents of one enrollment; rejection never persists an event"
    constants:
      DAILY_CAP: 100
    precision: "integer points; floor division"

  - name: points_balance
    trigger: "any PointsLedgerEntry creation or status transition for the enrollment"
    algorithm: aggregation
    formula: |
      points_balance_settled     = sum(points_delta of entries with status POSTED)
      points_balance_provisional = sum(points_delta of entries with status in {PROVISIONAL, POSTED})
    input_set: "all PointsLedgerEntry rows of the enrollment regardless of kind; EXPIRED entries contribute to neither balance"
    precision: "integer points"
    variants:
      - name: provisional_view
        when: "in-year reads, challenge progress, projected tier"
        difference: "includes PROVISIONAL entries; equals settled view plus not-yet-finalized activity"
      - name: settled_view
        when: "award computation (tier_attainment) and program close/settle"
        difference: "POSTED entries only; identical event data yields a smaller or equal number whenever any PROVISIONAL entry exists"

  - name: challenge_progress
    trigger: "ActivityEvent acceptance; also backfilled once at participation creation"
    algorithm: aggregation
    formula: |
      progress_quantity = sum(quantity of ACCEPTED ActivityEvents where
        enrollment_id == participation.enrollment_id
        AND activity_type == challenge.activity_type
        AND occurred_at >= challenge.starts_at AND occurred_at < challenge.ends_at)
      if participation.status == JOINED and progress_quantity >= challenge.goal_quantity:
        participation -> COMPLETED (BONUS cascade)
    input_set: "ACCEPTED events of the enrollment matching type and half-open window"
    precision: "integer quantity; completion boundary is >= (goal met exactly counts)"

  - name: hra_risk_score
    trigger: "POST /wellness/hras"
    algorithm: weighted_scoring
    formula: |
      risk_score = sum(answers)            # exactly 10 integers, each 0..10
      risk_band = LOW if risk_score < 30
                  MODERATE if 30 <= risk_score < 60
                  HIGH if risk_score >= 60
    input_set: "the submitted answers array"
    precision: "integer"
    variants: []

  - name: biometric_targets_met
    trigger: "POST /wellness/biometric-screenings/{id}/result"
    algorithm: threshold
    formula: |
      targets_met = (bmi < 30.0) + (systolic_bp < 140)
                  + (total_cholesterol < 200) + (glucose < 100)   # 0..4
    input_set: "the four resulted measurements"
    precision: "strict < comparisons"

  - name: tier_attainment
    trigger: "POST /wellness/incentive-awards/compute (per eligible enrollment)"
    algorithm: threshold
    formula: |
      P = enrollment.points_balance_settled
      H = 1 if a HealthAssessment exists for the enrollment else 0
      B = max(targets_met over RESULTED screenings of the enrollment; 0 if none)
      tier = GOLD   if P >= gold_threshold   AND H == 1 AND B >= 3
             SILVER if P >= silver_threshold AND H == 1
             BRONZE if P >= bronze_threshold
             NONE otherwise
    input_set: "enrollment settled balance, HRA existence, best RESULTED screening"
    precision: "integer thresholds, all >= (exact threshold attains the tier)"
    constants:
      GOLD_MIN_TARGETS: 3

  - name: premium_differential
    trigger: "POST /wellness/incentive-awards/compute (and RA recompute on referral discharge)"
    algorithm: threshold
    formula: |
      cap_cents = round_half_up(program.premium_cap_pct * employer.annual_self_only_premium_cents)
      tier_value = match tier: GOLD->gold_award_cents, SILVER->silver_award_cents,
                   BRONZE->bronze_award_cents, NONE->0
      standard_award_cents = min(tier_value, cap_cents)
      ra_available = enrollment.ra_eligible AND exists a CoachingReferral of this
                     enrollment with status == DISCHARGED AND outcome == GOALS_MET
      if ra_available:
        applied_variant = REASONABLE_ALTERNATIVE
        award_cents = min(gold_award_cents, cap_cents)
      else:
        applied_variant = STANDARD
        award_cents = standard_award_cents
      cessation_done = exists a CoachingReferral of this enrollment with
                       reason == TOBACCO_CESSATION AND status == DISCHARGED
                       AND outcome == GOALS_MET
      surcharge_cents = employer.tobacco_surcharge_cents
                        if employee.tobacco_attested AND NOT cessation_done else 0
      net_annual_differential_cents = surcharge_cents - award_cents
    input_set: "tier_attainment result; referral set of the enrollment; employer money config"
    precision: "integer cents, round_half_up on the cap product"
    variants:
      - name: standard
        when: "default"
        difference: "award follows attained points tier"
      - name: reasonable_alternative
        when: "ra_eligible member completed coaching with GOALS_MET"
        difference: "award equals the GOLD-tier amount (capped) regardless of points; identical activity data yields a different award_cents"

  - name: vendor_invoice_total
    trigger: "POST /wellness/vendor-invoices (creation); POST /wellness/vendor-invoices/{id}/adjustments (re-sum)"
    algorithm: tiered_pricing
    formula: |
      days_in_period = (period_end - period_start).days + 1          # inclusive end
      for each enrollment of the program with participation_status in
      {ACTIVE, SUSPENDED} OR (TERMINATED with terminated_at >= period_start):
        member_start = max(date(enrollment.created_at), period_start)
        member_end   = min(date(terminated_at) if TERMINATED else period_end, period_end)
        member_days  = max(0, (member_end - member_start).days + 1)
        if member_days > 0:
          line = round_half_up(employer.pmpm_fee_cents * member_days / days_in_period)
          emit MEMBER_MONTH line (ref_id = enrollment.id, amount_cents = line)
      for each CoachingReferral of program enrollments:
        n = count(session_dates d with period_start <= d <= period_end)
        if n > 0:
          emit COACHING_SESSION line (ref_id = referral.id,
            amount_cents = n * employer.coaching_session_fee_cents)
      total_cents = sum(line_items.amount_cents)   # MEMBER_MONTH + COACHING_SESSION + ADJUSTMENT
    input_set: "program enrollments filtered by status at invoice creation; lifetime session_dates intersected with the period"
    precision: |
      ROUNDING ORDER IS PINNED: each MEMBER_MONTH line is individually rounded
      half-up to integer cents BEFORE summation; total_cents is the exact sum of
      rounded line amounts. The alternative (sum unrounded prorations, round
      once) is REJECTED and yields different cents.
    constants: {}

  - name: cohort_aggregate
    trigger: "POST /wellness/aggregate-reports"
    algorithm: aggregation
    formula: |
      cohort = enrollments E of program where
        E.employee.department == report.department
        AND E.participation_status in {ACTIVE, SUSPENDED, TERMINATED}
      cohort_size = |cohort|
      if cohort_size < employer.k_anonymity_threshold: reject ERR_COHORT_TOO_SMALL
      avg_settled_points = round_half_up(mean(E.points_balance_settled), 2)
      participation_rate = round_half_up(|E with >=1 COMPLETED participation| / cohort_size, 4)
      tobacco_rate       = round_half_up(|E with employee.tobacco_attested| / cohort_size, 4)
    input_set: "program enrollments joined to employees, filtered by department equality and the explicit status set above"
    precision: "2 dp (points) and 4 dp (rates), round_half_up; threshold comparison is >= (exactly k is publishable)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right, and the request body satisfies the endpoint's input schema (missing required fields, malformed values, bad enum members, end <= start); FK bodies reference existing resources. Path-existence failures outrank body-schema failures."
    error_id: "ERR_NOT_FOUND / ERR_INVALID_REQUEST"
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "expected_<parent>_version matches the parent's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wellness/enrollments/{id}/adjustments, PATCH /wellness/challenges/{id}"
  - priority: 5
    category: auth
    check: "Entity-backed identity scope: Employee acts only on own enrollment-derived resources; Coach only on referrals they are assigned to"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Employee/Coach action endpoints"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the requested transition (incl. ERR_ENROLLMENT_NOT_ACTIVE, ERR_PROGRAM_NOT_ACTIVE, ERR_PROGRAM_NOT_CLOSED, ERR_AWARD_NOT_CONFIRMABLE, ERR_INVOICE_NOT_EDITABLE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Privacy/compliance guards: cohort k-anonymity; segregation of duties on invoice approval"
    error_id: ERR_COHORT_TOO_SMALL
    http_status: 422
    applies_to: "POST /wellness/aggregate-reports; POST /wellness/vendor-invoices/{id}/approve (ERR_SOD_VIOLATION, 403)"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/overlap/capacity: program window overlap, challenge window overlap, kiosk capacity, idempotency-key conflict, duplicate participation, duplicate HRA, sessions prerequisite"
    error_id: ERR_PROGRAM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "activate/publish/screening-create/event-create/participation-create/hra-create/referral-discharge"
  - priority: 9
    category: business_temporal
    check: "Window rules: activity occurred_at inside plan year and not future; screening slot inside plan year; award dispute within 30 days of confirm"
    error_id: ERR_EVENT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "activity-events, biometric-screenings, award dispute"
  - priority: 10
    category: business_referential
    check: "Referenced entity in a compatible lifecycle relation: program not SETTLED for new dependent artifacts; challenge and enrollment belong to the same program"
    error_id: ERR_PROGRAM_ALREADY_SETTLED
    http_status: 409
    applies_to: "invoice create, report create/publish, award compute, participation create"
  - priority: 11
    category: business_fiscal
    check: "Money guard: invoice total within approval limit unless explicitly overridden"
    error_id: ERR_INVOICE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /wellness/vendor-invoices/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Default before any call is exactly 2026-05-01T00:00:00Z (never wall-clock). Sweep applies: PUBLISHED challenges with starts_at <= now -> ACTIVE; ACTIVE challenges with ends_at < now -> COMPLETED (resolving JOINED participations); SCHEDULED screenings with slot_end < now -> NO_SHOW."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: string }
    side_effects: ["challenge/screening time sweeps as described"]

  # --- Employer ---
  - method: POST
    path: "/wellness/employers"
    description: "Create an employer (tenant config)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, annual_self_only_premium_cents, tobacco_surcharge_cents, pmpm_fee_cents, coaching_session_fee_cents, k_anonymity_threshold, kiosk_capacity, invoice_approval_limit_cents]
    output: Employer
    side_effects: []
  - method: GET
    path: "/wellness/employers/{id}"
    description: "Get one employer"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: []
  - method: GET
    path: "/wellness/employers/{id}/employees"
    description: "List employees of an employer"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Employee[]
    side_effects: []
  - method: GET
    path: "/wellness/employers/{id}/programs"
    description: "List programs of an employer"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: WellnessProgram[]
    side_effects: []

  # --- Employee ---
  - method: POST
    path: "/wellness/employees"
    description: "Create an employee (population entry)"
    roles: [BenefitsAdmin]
    code: 201
    input: [employer_id, email, full_name, department, hire_date, "tobacco_attested?"]
    output: Employee
    side_effects: []
  - method: GET
    path: "/wellness/employees/{id}"
    description: "Get one employee"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/wellness/employees/{id}/enrollments"
    description: "List enrollments of an employee"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  # --- WellnessProgram ---
  - method: POST
    path: "/wellness/programs"
    description: "Create a program (starts DRAFT)"
    roles: [BenefitsAdmin]
    code: 201
    input: [employer_id, name, plan_year_start, plan_year_end, bronze_threshold, silver_threshold, gold_threshold, bronze_award_cents, silver_award_cents, gold_award_cents, premium_cap_pct, coaching_required_sessions]
    output: WellnessProgram
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/wellness/programs/{id}"
    description: "Get one program"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: []
    output: WellnessProgram
    side_effects: []
  - method: POST
    path: "/wellness/programs/{id}/activate"
    description: "DRAFT -> ACTIVE; enforces per-employer half-open window non-overlap"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: WellnessProgram
    side_effects: ["status -> ACTIVE", "increments WellnessProgram.version by 1"]
  - method: POST
    path: "/wellness/programs/{id}/close"
    description: "ACTIVE -> CLOSED; expires PROVISIONAL ledger entries, completes challenges, no-shows SCHEDULED screenings"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: WellnessProgram
    side_effects: ["program close sweep per state machine", "increments WellnessProgram.version by 1"]
  - method: POST
    path: "/wellness/programs/{id}/settle"
    description: "CLOSED -> SETTLED; requires every award APPLIED"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: WellnessProgram
    side_effects: ["increments WellnessProgram.version by 1"]
  - method: POST
    path: "/wellness/programs/{id}/finalize-points"
    description: "Move all PROVISIONAL ledger entries of the program to POSTED"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: { finalized_count: integer }
    side_effects: ["PROVISIONAL -> POSTED", "enrollment balances recomputed"]
  - method: GET
    path: "/wellness/programs/{id}/enrollments"
    description: "List enrollments of a program"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/wellness/programs/{id}/challenges"
    description: "List challenges of a program"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Challenge[]
    side_effects: []
  - method: GET
    path: "/wellness/programs/{id}/incentive-awards"
    description: "List awards of a program"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: IncentiveAward[]
    side_effects: []
  - method: GET
    path: "/wellness/programs/{id}/vendor-invoices"
    description: "List invoices of a program"
    roles: [PlatformAdmin, BenefitsAdmin, VendorManager]
    code: 200
    input: ["limit?", "offset?"]
    output: VendorInvoice[]
    side_effects: []
  - method: GET
    path: "/wellness/programs/{id}/aggregate-reports"
    description: "List aggregate reports of a program"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AggregateReport[]
    side_effects: []

  # --- Enrollment ---
  - method: POST
    path: "/wellness/enrollments"
    description: "BenefitsAdmin enrolls an employee into a program (starts INVITED)"
    roles: [BenefitsAdmin]
    code: 201
    input: [program_id, employee_id, "ra_eligible?"]
    output: Enrollment
    side_effects: ["participation_status=INVITED", "verification_status=PENDING"]
  - method: GET
    path: "/wellness/enrollments/{id}"
    description: "Get one enrollment (Employee scoped to own)"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/wellness/enrollments/{id}/accept"
    description: "Employee accepts invitation: INVITED -> ACTIVE"
    roles: [Employee]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["participation_status -> ACTIVE", "increments Enrollment.version by 1"]
  - method: POST
    path: "/wellness/enrollments/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["increments Enrollment.version by 1"]
  - method: POST
    path: "/wellness/enrollments/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE (program must be ACTIVE)"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["increments Enrollment.version by 1"]
  - method: POST
    path: "/wellness/enrollments/{id}/terminate"
    description: "INVITED/ACTIVE/SUSPENDED -> TERMINATED"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["terminated_at set", "increments Enrollment.version by 1"]
  - method: POST
    path: "/wellness/enrollments/{id}/adjustments"
    description: "Manual signed points adjustment; OCC on expected_enrollment_version"
    roles: [BenefitsAdmin]
    code: 201
    input: [points_delta, reason, expected_enrollment_version]
    output: PointsLedgerEntry
    side_effects:
      - "Creates PointsLedgerEntry(kind=ADJUSTED, status=POSTED, points_delta as given, nonzero)"
      - "Enrollment balances recomputed"
      - "increments Enrollment.version by 1"
  - method: GET
    path: "/wellness/enrollments/{id}/hras"
    description: "List health assessments of an enrollment"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: HealthAssessment[]
    side_effects: []
  - method: GET
    path: "/wellness/enrollments/{id}/biometric-screenings"
    description: "List screenings of an enrollment"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: BiometricScreening[]
    side_effects: []
  - method: GET
    path: "/wellness/enrollments/{id}/challenge-participations"
    description: "List participations of an enrollment"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: ChallengeParticipation[]
    side_effects: []
  - method: GET
    path: "/wellness/enrollments/{id}/activity-events"
    description: "List activity events of an enrollment"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: ActivityEvent[]
    side_effects: []
  - method: GET
    path: "/wellness/enrollments/{id}/points-ledger-entries"
    description: "List ledger entries of an enrollment"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: PointsLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/wellness/enrollments/{id}/incentive-awards"
    description: "List awards of an enrollment"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: IncentiveAward[]
    side_effects: []
  - method: GET
    path: "/wellness/enrollments/{id}/coaching-referrals"
    description: "List coaching referrals of an enrollment"
    roles: [PlatformAdmin, BenefitsAdmin, Employee, Coach]
    code: 200
    input: ["limit?", "offset?"]
    output: CoachingReferral[]
    side_effects: []

  # --- HealthAssessment ---
  - method: POST
    path: "/wellness/hras"
    description: "Submit and score an HRA in one call; HIGH risk auto-creates a coaching referral"
    roles: [Employee]
    code: 201
    input: [enrollment_id, answers]
    output: HealthAssessment
    side_effects: ["risk_score/risk_band computed", "verification PENDING->VERIFIED", "HIGH -> auto referral + auto_referral_count += 1"]

  # --- BiometricScreening ---
  - method: POST
    path: "/wellness/biometric-screenings"
    description: "Schedule a screening appointment (kiosk capacity enforced per clinic_location)"
    roles: [Employee]
    code: 201
    input: [enrollment_id, clinic_location, slot_start, slot_end]
    output: BiometricScreening
    side_effects: ["status=SCHEDULED"]
  - method: POST
    path: "/wellness/biometric-screenings/{id}/result"
    description: "Enter results: SCHEDULED -> RESULTED; computes targets_met and drives verification FLAGGED/VERIFIED"
    roles: [BenefitsAdmin]
    code: 200
    input: [bmi, systolic_bp, total_cholesterol, glucose]
    output: BiometricScreening
    side_effects: ["targets_met computed", "verification_status side effects per state machine", "increments BiometricScreening.version by 1"]

  # --- Challenge ---
  - method: POST
    path: "/wellness/challenges"
    description: "Create a challenge (DRAFT)"
    roles: [BenefitsAdmin]
    code: 201
    input: [program_id, name, activity_type, goal_quantity, points_reward, starts_at, ends_at]
    output: Challenge
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/wellness/challenges/{id}"
    description: "Get one challenge"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: []
    output: Challenge
    side_effects: []
  - method: PATCH
    path: "/wellness/challenges/{id}"
    description: "Edit a DRAFT challenge; OCC on expected_challenge_version"
    roles: [BenefitsAdmin]
    code: 200
    input: ["name?", "goal_quantity?", "points_reward?", "starts_at?", "ends_at?", expected_challenge_version]
    output: Challenge
    side_effects: ["increments Challenge.version by 1"]
  - method: POST
    path: "/wellness/challenges/{id}/publish"
    description: "DRAFT -> PUBLISHED; same-activity_type half-open window non-overlap within program"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: Challenge
    side_effects: ["increments Challenge.version by 1"]
  - method: GET
    path: "/wellness/challenges/{id}/participations"
    description: "List participations of a challenge"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ChallengeParticipation[]
    side_effects: []

  # --- ChallengeParticipation ---
  - method: POST
    path: "/wellness/challenge-participations"
    description: "Join a challenge; backfills progress from already-accepted in-window events"
    roles: [Employee]
    code: 201
    input: [challenge_id, enrollment_id]
    output: ChallengeParticipation
    side_effects: ["progress_quantity backfilled", "if backfilled progress >= goal_quantity: immediate COMPLETED cascade"]

  # --- ActivityEvent ---
  - method: POST
    path: "/wellness/activity-events"
    description: "Device/app sync ingest. Idempotent on (enrollment_id, device_source, external_event_id): identical replay returns 200 with the existing event and no new ledger entry; same key with different quantity/occurred_at/activity_type -> ERR_DUPLICATE_EVENT."
    roles: [Employee]
    code: 201
    input: [enrollment_id, device_source, external_event_id, activity_type, quantity, occurred_at]
    output: ActivityEvent
    side_effects:
      - "points_granted computed (activity_points_conversion with daily cap)"
      - "Create PointsLedgerEntry(kind=EARNED, status=PROVISIONAL, source_activity_event_id=this event)"
      - "Enrollment balances recomputed"
      - "Each JOINED participation of this enrollment whose challenge matches activity_type: progress recomputed; >= goal triggers COMPLETED cascade (BONUS entry, completed_count += 1)"
  - method: GET
    path: "/wellness/activity-events/{id}"
    description: "Get one activity event"
    roles: [PlatformAdmin, BenefitsAdmin, Employee]
    code: 200
    input: []
    output: ActivityEvent
    side_effects: []
  - method: GET
    path: "/wellness/activity-events/{id}/points-ledger-entries"
    description: "List ledger entries sourced from one activity event (0 or 1)"
    roles: [PlatformAdmin, BenefitsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PointsLedgerEntry[]
    side_effects: []

  # --- PointsLedgerEntry ---
  # (creation only via event ingest / challenge completion / adjustments; listed under enrollment and activity-event)

  # --- IncentiveAward ---
  - method: POST
    path: "/wellness/incentive-awards/compute"
    description: "(Re)compute PROJECTED awards for all eligible enrollments of a program"
    roles: [BenefitsAdmin]
    code: 200
    input: [program_id]
    output: { created_count: integer, updated_count: integer }
    side_effects: ["tier_attainment + premium_differential per enrollment", "PROJECTED awards upserted"]
  - method: POST
    path: "/wellness/incentive-awards/{id}/confirm"
    description: "PROJECTED -> CONFIRMED (program must be CLOSED)"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["confirmed_at set", "increments IncentiveAward.version by 1"]
  - method: POST
    path: "/wellness/incentive-awards/{id}/apply"
    description: "CONFIRMED -> APPLIED (payroll application)"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: IncentiveAward
    side_effects: ["increments IncentiveAward.version by 1"]
  - method: POST
    path: "/wellness/incentive-awards/{id}/dispute"
    description: "Employee disputes a CONFIRMED award within 30 days"
    roles: [Employee]
    code: 200
    input: [dispute_reason]
    output: IncentiveAward
    side_effects: ["increments IncentiveAward.version by 1"]
  - method: POST
    path: "/wellness/incentive-awards/{id}/resolve"
    description: "DISPUTED -> CONFIRMED; UPHELD keeps amounts, ADJUSTED overwrites award_cents"
    roles: [BenefitsAdmin]
    code: 200
    input: [outcome, "adjusted_award_cents?"]
    output: IncentiveAward
    side_effects: ["confirmed_at refreshed", "increments IncentiveAward.version by 1"]

  # --- CoachingReferral ---
  - method: POST
    path: "/wellness/coaching-referrals"
    description: "Manual referral (source=MANUAL)"
    roles: [BenefitsAdmin]
    code: 201
    input: [enrollment_id, reason]
    output: CoachingReferral
    side_effects: ["status=REFERRED"]
  - method: POST
    path: "/wellness/coaching-referrals/{id}/engage"
    description: "REFERRED -> ENGAGED; engaging Coach becomes assigned_coach_id"
    roles: [Coach]
    code: 200
    input: []
    output: CoachingReferral
    side_effects: ["assigned_coach_id set", "increments CoachingReferral.version by 1"]
  - method: POST
    path: "/wellness/coaching-referrals/{id}/sessions"
    description: "Log a coaching session (ENGAGED only, assigned coach only)"
    roles: [Coach]
    code: 201
    input: [session_date, duration_minutes]
    output: CoachingReferral
    side_effects: ["sessions_completed += 1", "session_dates appended", "increments CoachingReferral.version by 1"]
  - method: POST
    path: "/wellness/coaching-referrals/{id}/discharge"
    description: "ENGAGED -> DISCHARGED; GOALS_MET on an ra_eligible enrollment recomputes its PROJECTED award (RA variant)"
    roles: [Coach]
    code: 200
    input: [outcome]
    output: CoachingReferral
    side_effects: ["outcome set", "RA award recompute cascade", "increments CoachingReferral.version by 1"]
  - method: POST
    path: "/wellness/coaching-referrals/{id}/decline"
    description: "REFERRED -> DECLINED (employee self)"
    roles: [Employee]
    code: 200
    input: []
    output: CoachingReferral
    side_effects: ["increments CoachingReferral.version by 1"]
  - method: POST
    path: "/wellness/coaching-referrals/{id}/rerefer"
    description: "DISCHARGED/DECLINED -> REFERRED; referral_round += 1, sessions reset"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: CoachingReferral
    side_effects: ["referral_round += 1", "sessions_completed=0, outcome=null, assigned_coach_id=null", "increments CoachingReferral.version by 1"]

  # --- VendorInvoice ---
  - method: POST
    path: "/wellness/vendor-invoices"
    description: "Create invoice (DRAFT) with computed MEMBER_MONTH and COACHING_SESSION lines"
    roles: [VendorManager]
    code: 201
    input: [program_id, vendor_name, period_start, period_end]
    output: VendorInvoice
    side_effects: ["line_items computed per vendor_invoice_total", "total_cents summed"]
  - method: POST
    path: "/wellness/vendor-invoices/{id}/adjustments"
    description: "Append a signed ADJUSTMENT line (DRAFT only)"
    roles: [VendorManager]
    code: 201
    input: [amount_cents, note]
    output: VendorInvoice
    side_effects: ["line_items appended", "total_cents re-summed", "increments VendorInvoice.version by 1"]
  - method: POST
    path: "/wellness/vendor-invoices/{id}/submit"
    description: "DRAFT -> SUBMITTED; records submitted_by"
    roles: [VendorManager]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: ["submitted_by = X-User-ID", "increments VendorInvoice.version by 1"]
  - method: POST
    path: "/wellness/vendor-invoices/{id}/approve"
    description: "SUBMITTED -> APPROVED; SoD + approval-limit guards"
    roles: [PlatformAdmin]
    code: 200
    input: ["override_limit?"]
    output: VendorInvoice
    side_effects: ["increments VendorInvoice.version by 1"]
  - method: POST
    path: "/wellness/vendor-invoices/{id}/pay"
    description: "APPROVED -> PAID"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: ["increments VendorInvoice.version by 1"]
  - method: POST
    path: "/wellness/vendor-invoices/{id}/dispute"
    description: "SUBMITTED -> DISPUTED"
    roles: [PlatformAdmin]
    code: 200
    input: [note]
    output: VendorInvoice
    side_effects: ["increments VendorInvoice.version by 1"]
  - method: POST
    path: "/wellness/vendor-invoices/{id}/revise"
    description: "DISPUTED -> DRAFT; clears submitted_by"
    roles: [VendorManager]
    code: 200
    input: []
    output: VendorInvoice
    side_effects: ["submitted_by=null", "increments VendorInvoice.version by 1"]

  # --- AggregateReport ---
  - method: POST
    path: "/wellness/aggregate-reports"
    description: "Generate a de-identified cohort report (program CLOSED; cohort >= k)"
    roles: [BenefitsAdmin]
    code: 201
    input: [program_id, department]
    output: AggregateReport
    side_effects: ["cohort aggregates computed per cohort_aggregate"]
  - method: POST
    path: "/wellness/aggregate-reports/{id}/publish"
    description: "GENERATED -> PUBLISHED (program must still be CLOSED)"
    roles: [BenefitsAdmin]
    code: 200
    input: []
    output: AggregateReport
    side_effects: ["increments AggregateReport.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, bad enum, answers length/range violation, end <= start" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Employee/Coach X-User-ID does not own (or is not assigned to) the target resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid from-state for the requested transition" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Operation requires participation_status == ACTIVE" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires program status ACTIVE (or the program is DRAFT)" }
  - { id: ERR_PROGRAM_NOT_CLOSED, http: 409, condition: "Operation requires program status CLOSED" }
  - { id: ERR_PROGRAM_ALREADY_SETTLED, http: 409, condition: "Referenced program is SETTLED; no new dependent artifacts or publishes" }
  - { id: ERR_PROGRAM_HAS_OPEN_AWARDS, http: 409, condition: "Settle requires every award APPLIED" }
  - { id: ERR_AWARD_NOT_CONFIRMABLE, http: 409, condition: "Award not in PROJECTED or computed before the latest close" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Dispute later than confirmed_at + 30 days" }
  - { id: ERR_HRA_ALREADY_COMPLETED, http: 409, condition: "An HRA already exists for this enrollment" }
  - { id: ERR_EVENT_OUTSIDE_WINDOW, http: 422, condition: "occurred_at outside program plan year or in the future" }
  - { id: ERR_SLOT_OUTSIDE_WINDOW, http: 422, condition: "Screening slot outside program plan year" }
  - { id: ERR_PROGRAM_WINDOW_OVERLAP, http: 409, condition: "Overlapping half-open plan-year window with another ACTIVE/CLOSED program of the same employer" }
  - { id: ERR_CHALLENGE_WINDOW_OVERLAP, http: 409, condition: "Same-activity_type PUBLISHED/ACTIVE challenge window overlap within the program" }
  - { id: ERR_KIOSK_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping SCHEDULED screenings at clinic_location reached employer.kiosk_capacity" }
  - { id: ERR_DUPLICATE_EVENT, http: 409, condition: "Idempotency key reused with a different payload" }
  - { id: ERR_PARTICIPATION_EXISTS, http: 409, condition: "Participation already exists for (challenge_id, enrollment_id)" }
  - { id: ERR_CHALLENGE_PROGRAM_MISMATCH, http: 422, condition: "enrollment.program_id != challenge.program_id on join" }
  - { id: ERR_REFERRAL_SESSIONS_INSUFFICIENT, http: 409, condition: "Discharge before sessions_completed >= coaching_required_sessions" }
  - { id: ERR_COHORT_TOO_SMALL, http: 422, condition: "Report cohort_size < employer.k_anonymity_threshold" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Invoice approver X-User-ID equals submitted_by" }
  - { id: ERR_INVOICE_EXCEEDS_LIMIT, http: 422, condition: "total_cents > invoice_approval_limit_cents without override_limit=true" }
  - { id: ERR_INVOICE_NOT_EDITABLE, http: 409, condition: "Adjustments allowed only while invoice is DRAFT" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns employer onboarding, the logical clock, and invoice approval/payment"
    identity: opaque
    exclusive_operations:
      - "POST /wellness/employers"
      - "POST /_clock/set_current_utc"
      - "POST /wellness/vendor-invoices/{id}/approve|pay|dispute"
    shared_operations:
      - "All GET endpoints"
  - name: BenefitsAdmin
    description: "Employer HR benefits operator; configures programs/challenges, manages enrollment, enters biometric results, computes and confirms awards, manages referrals and reports"
    identity: opaque
    exclusive_operations:
      - "POST /wellness/employees, /wellness/programs + activate/close/settle/finalize-points"
      - "POST /wellness/enrollments + suspend/reinstate/terminate/adjustments"
      - "POST /wellness/biometric-screenings/{id}/result"
      - "POST/PATCH /wellness/challenges + publish"
      - "POST /wellness/incentive-awards/compute|confirm|apply|resolve"
      - "POST /wellness/coaching-referrals + rerefer"
      - "POST /wellness/aggregate-reports + publish"
    shared_operations:
      - "All GET endpoints"
  - name: Employee
    description: "Enrolled member; acts only on resources derived from their own enrollment"
    identity: entity_backed:Employee
    exclusive_operations:
      - "POST /wellness/enrollments/{id}/accept"
      - "POST /wellness/hras"
      - "POST /wellness/biometric-screenings"
      - "POST /wellness/challenge-participations"
      - "POST /wellness/activity-events"
      - "POST /wellness/incentive-awards/{id}/dispute"
      - "POST /wellness/coaching-referrals/{id}/decline"
    shared_operations:
      - "GET endpoints scoped to own records"
  - name: Coach
    description: "Vendor coaching staff; engages, logs sessions, and discharges assigned referrals"
    identity: opaque
    exclusive_operations:
      - "POST /wellness/coaching-referrals/{id}/engage|sessions|discharge"
    shared_operations:
      - "GET /wellness/enrollments/{id}/coaching-referrals"
  - name: VendorManager
    description: "Vendor billing operator; drafts, adjusts, submits, and revises invoices (may never approve — segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /wellness/vendor-invoices + adjustments|submit|revise"
    shared_operations:
      - "GET /wellness/programs/{id}/vendor-invoices"
