              as: ComplianceOfficer
              captures: { wh_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Fay Filer", user_role: "FILING_AGENT" }
              as: ComplianceOfficer
              captures: { agent_a: $.data.id }
            - call: "POST /licensee-users"
              payload: { wholesaler_id: "${wh_a}", full_name: "Cora Certifier", user_role: "CERTIFYING_OFFICER" }
              as: ComplianceOfficer
              captures: { cert_a: $.data.id }
            - call: "POST /brands"
              payload: { wholesaler_id: "${wh_a}", brand_name: "Rio Reserve", supplier_name: "Rio Supply Co", beverage_class: "SPIRITS", registration_effective_from: "2026-01-01T00:00:00Z", registration_expires_on: "2027-12-31T23:59:59Z" }
              as: FilingAgent
              as_user_id: "${agent_a}"
              captures: { brand_a: $.data.id }
            - call: "POST /brands/${brand_a}/approve"
