      - name: occ_quotation_revise_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quotation-revise-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential revises carrying the SAME observed version: the first succeeds (version advances), the second is deterministically rejected ERR_STALE_VERSION 412 — no wall-clock parallelism involved."
        test_recipe:
          setup: ["WATER quotation SENT; capture version v via GET"]
          setup_api_calls:
            - call: "POST /chandlery/ship-agents"
              payload: { name: "Agent AY", settlement_currency: USD, credit_limit_cents: 5000000, payment_terms_days: 30 }
              as: FinanceController
              captures: { agentY: $.data.id }
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C23", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterY: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${waterY}", lot_code: "DS-Y", storage_tier: DRY_STORE, received_qty: 10000, capacity_qty: 0 }
              as: WarehouseSupervisor
            - call: "POST /chandlery/vessel-calls"
              payload: { vessel_name: "MV Yara", imo_number: "9074789", agent_id: "${agentY}", port_code: "SGSIN", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-14T12:00:00Z", foreign_going: false }
              as: ChandlerOpsManager
              captures: { vcY: $.data.id }
            - call: "POST /chandlery/vessel-calls/${vcY}/requisitions"
              payload: { title: "Water", lines: [{ catalog_item_id: "${waterY}", requested_qty: 100, allows_substitution: false }] }
              as: VesselCateringOfficer
              as_user_id: "${vcY}"
              captures: { reqY: $.data.id }
            - call: "POST /chandlery/requisitions/${reqY}/submit"
              payload: {}
              as: VesselCateringOfficer
              as_user_id: "${vcY}"
            - call: "POST /chandlery/requisitions/${reqY}/quotations"
              payload: { lines: [{ catalog_item_id: "${waterY}", qty: 100, unit_price_cents: 120, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z" }
              as: ChandlerSalesRep
              captures: { quoY: $.data.id }
            - call: "POST /chandlery/quotations/${quoY}/send"
              payload: {}
              as: ChandlerSalesRep
            - call: "GET /chandlery/quotations/${quoY}"
              payload: {}
              as: ChandlerSalesRep
              captures: { quoY_v: $.data.version }
          trigger:
            - call: "POST /chandlery/quotations/${quoY}/revise"
              payload: { lines: [{ catalog_item_id: "${waterY}", qty: 90, unit_price_cents: 115, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z", expected_quotation_version: "${quoY_v}" }
              as: ChandlerSalesRep
              captures: { quoY_v2: $.data.version }
            - call: "POST /chandlery/quotations/${quoY}/revise"
              payload: { lines: [{ catalog_item_id: "${waterY}", qty: 80, unit_price_cents: 110, is_substitution: false }], valid_until: "2026-08-12T00:00:00Z", expected_quotation_version: "${quoY_v}" }
              as: ChandlerSalesRep
              captures: { errY: $.data.error_id }
          assert:
            - "first revise succeeds: version increments to ${quoY_v} + 1"
            - "second revise with the same stale version fails: error_id == ERR_STALE_VERSION (412)"

      - name: occ_stock_adjustment_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[stock-adjustment-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A stock adjustment applied after another adjustment advanced the lot version is rejected ERR_STALE_VERSION; the lot's on_hand reflects exactly one adjustment."
        test_recipe:
          setup: ["Stock lot received 1000; capture version via GET (== 1)"]
          setup_api_calls:
            - call: "POST /chandlery/catalog-items"
              payload: { sku: "WATER-C24", name: "Water 1L", category: PROVISIONS, bonded_eligible: false, requires_cold_chain: false, base_price_cents: 120, duty_rate_pct: 0 }
              as: ChandlerOpsManager
              captures: { waterZ: $.data.id }
            - call: "POST /chandlery/stock-lots"
              payload: { catalog_item_id: "${waterZ}", lot_code: "DS-Z", storage_tier: DRY_STORE, received_qty: 1000, capacity_qty: 0 }
              as: WarehouseSupervisor
              captures: { lotZ: $.data.id, lotZ_v: $.data.version }
          trigger:
            - call: "POST /chandlery/stock-lots/${lotZ}/adjustments"
              payload: { adjustment_qty: 50, reason: "found pallet", expected_stock_lot_version: "${lotZ_v}" }
              as: WarehouseSupervisor
              captures: { lotZ_oh: $.data.on_hand_qty }
            - call: "POST /chandlery/stock-lots/${lotZ}/adjustments"
              payload: { adjustment_qty: -20, reason: "damage writeoff", expected_stock_lot_version: "${lotZ_v}" }
              as: WarehouseSupervisor
              captures: { errZ: $.data.error_id }
          assert:
            - "first adjustment succeeds: on_hand_qty == 1050"
            - "second adjustment with stale version fails: error_id == ERR_STALE_VERSION (412); on_hand stays 1050"

