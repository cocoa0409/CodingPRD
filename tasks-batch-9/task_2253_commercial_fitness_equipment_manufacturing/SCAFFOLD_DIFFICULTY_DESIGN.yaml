      - 'Level 2: FirmwareCertification.${c1}.cert_status == REVOKED and FirmwareRelease.${fw1}.certified_revision_count == 0'
      - 'Level 3: SerializedAsset.${a1}.connectivity_support_status == FIRMWARE_REVOKED with firmware_support_expires_at == 2026-08-01T00:00:00Z'
      - 'Level 3: SerializedAsset.${a1}.warranty_expires_at == 2029-07-31T00:00:00Z and support_gap_days == 1095'
      - 'Level 4: PMProgram.${pm1}.status == NEEDS_REVISION with needs_revision_reason == FIRMWARE_REVOKED'
      - 'Level 5: MaintenanceVisit.${v1}.status == ON_HOLD with held_reason == PROGRAM_NEEDS_REVISION'
      - 'Level 6: ServicePartner.${p1}.spare_stock_reserved_units == 0, spare_stock_on_hand_units == 20, spare_stock_consumed_units == 0, spare_stock_received_units == 20'
      - ServicePartner.${p1}.committed_hours == 8.75 (a NEEDS_REVISION program still consumes capacity) and coverage_status == ACTIVE
      - PMProgram.${pm1}.annual_labor_hours_committed == 8.75 and covered_asset_count == 1
