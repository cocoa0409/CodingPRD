# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2323 — Public Charging Network Reliability & Uptime Compliance
#
# Walked row-by-row against references/claim-extraction-guide.md's nine sections.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and no test_recipe.
#
# Every instance's setup_api_calls chain was checked to be composable from §1.5
# starting at an empty database with the default logical clock.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (§1.1) + flat entity_topology
  # ===========================================================================
  - section: entities
    instances:

      - name: create_host_site_echoes_every_declared_field_and_starts_station_count_at_zero
        claim_type: creation
        grounds:
          - entities.HostSite
          - endpoints[POST /host-sites]
        distinguishing_aspect: "A HostSite created with every optional field supplied explicitly must return 201 with all ten declared business fields echoed exactly as submitted, plus station_count seeded to 0."
        test_recipe:
          setup:
            - "Empty database, logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 640.50, agreement_status: "EXECUTED", power_upgrade_status: "IN_PROGRESS", access_hours_mode: "RESTRICTED", access_open_minute: 300, access_close_minute: 1290, parking_enforcement_mode: "SIGNAGE_ONLY" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "HostSite.${site_id}.site_code == \"HS-1\" and host_org_name == \"Alder Court Retail\""
            - "HostSite.${site_id}.committed_service_capacity_kw == 640.50"
            - "HostSite.${site_id}.agreement_status == EXECUTED and power_upgrade_status == IN_PROGRESS"
            - "HostSite.${site_id}.access_hours_mode == RESTRICTED, access_open_minute == 300, access_close_minute == 1290"
            - "HostSite.${site_id}.parking_enforcement_mode == SIGNAGE_ONLY"
            - "HostSite.${site_id}.station_count == 0"
            - "response body has meta.api_request_id and meta.api_request_timestamp, and response_type == \"object\""

      - name: get_station_by_id_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /stations/{station_id}]
          - entities.Station
        distinguishing_aspect: "GET /stations/{station_id} must return the persisted row byte-for-byte, including the system defaults DRAFT / NONE and the zeroed computed ledger fields, without triggering any recomputation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one HostSite; one Station created under it with no ports yet."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 2, corridor_designated: true }
              as: NetworkOperator
              captures: { st_id: $.data.id }
          trigger:
            - call: "GET /stations/${st_id}"
              payload: {}
              as: ComplianceAuditor
          assert:
            - "HTTP status == 200 and response_type == \"object\""
            - "Station.${st_id}.host_site_id == \"${site_id}\" and station_code == \"ST-1\""
            - "Station.${st_id}.power_class == DCFC_150, declared_port_count == 2, corridor_designated == true"
            - "Station.${st_id}.status == DRAFT and suspension_source == NONE and commissioned_at == null"
            - "Station.${st_id}.commissioned_port_count == 0, out_of_service_port_count == 0, installed_power_kw == 0, payment_interop_score == 0"
            - "Station.${st_id}.gross_downtime_minutes_lifetime == 0, excluded_downtime_minutes_lifetime == 0, billable_downtime_minutes_lifetime == 0, refund_liability_cents == 0"

      - name: list_spare_parts_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /spare-parts]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three SpareParts stored, limit=2/offset=0 must return 2 rows with total_count 3 and has_more true, and limit=2/offset=2 must return the remaining 1 row with has_more false — total_count reflects the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; three SpareParts SP-1 (DISPENSER), SP-2 (POWER_MODULE), SP-3 (CABLE_ASSEMBLY)."
          setup_api_calls:
            - call: "POST /spare-parts"
              payload: { part_number: "SP-1", part_class: "DISPENSER", lead_time_days: 3 }
              as: NetworkOperator
            - call: "POST /spare-parts"
              payload: { part_number: "SP-2", part_class: "POWER_MODULE", lead_time_days: 5 }
              as: NetworkOperator
            - call: "POST /spare-parts"
              payload: { part_number: "SP-3", part_class: "CABLE_ASSEMBLY", lead_time_days: 1 }
              as: NetworkOperator
          trigger:
            - call: "GET /spare-parts"
              payload: { limit: 2, offset: 0 }
              as: NetworkOperator
            - call: "GET /spare-parts"
              payload: { limit: 2, offset: 2 }
              as: NetworkOperator
            - call: "GET /spare-parts"
              payload: { part_class: "DISPENSER", limit: 10, offset: 0 }
              as: NetworkOperator
          assert:
            - "first page: response_type == \"array\", 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row returned, total_count == 3, has_more == false, offset == 2"
            - "filtered page: 1 row returned whose part_number == \"SP-1\", total_count == 1, has_more == false"

      - name: get_station_with_unknown_id_returns_station_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STATION_NOT_FOUND]
          - endpoints[GET /stations/{station_id}]
        distinguishing_aspect: "A syntactically valid but unknown station id must produce ERR_STATION_NOT_FOUND (404) with the error envelope, not an empty 200 body and not a 400."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z; no Station exists."
          setup_api_calls: []
          trigger:
            - call: "GET /stations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response_type == \"error\" and data.error_id == \"ERR_STATION_NOT_FOUND\""
            - "meta.api_request_id is present on the error envelope too"

      - name: create_station_missing_required_power_class_rejected
        claim_type: required_fields
        grounds:
          - entities.Station.fields.power_class
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "power_class is source: input with no default, so omitting it must produce ERR_INVALID_REQUEST (400) before any FK or business check runs; no Station row may be created and HostSite.station_count must stay 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one HostSite with station_count 0."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", declared_port_count: 1 }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "HostSite.${site_id}.station_count == 0 (no partial create)"
            - "GET /host-sites/${site_id}/stations returns 0 rows"

      - name: create_charging_port_omitting_optional_flags_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ChargingPort.fields.contactless_enabled
          - entities.ChargingPort.fields.plug_and_charge_enabled
          - entities.ChargingPort.fields.price_display_verified
          - entities.ChargingPort.fields.roaming_ocpi_version
          - endpoints[POST /charging-ports]
        distinguishing_aspect: "Omitting all four optional interoperability inputs must yield contactless_enabled false, plug_and_charge_enabled false, price_display_verified false and roaming_ocpi_version NONE — which in turn makes the station's payment_interop_score exactly 0, proving the defaults were materialised rather than left null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one HostSite; one Station ST-1 in DRAFT with no ports."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ChargingPort.${p_id}.contactless_enabled == false, plug_and_charge_enabled == false, price_display_verified == false"
            - "ChargingPort.${p_id}.roaming_ocpi_version == NONE"
            - "ChargingPort.${p_id}.terminal_certification_status == PENDING, service_state == IN_SERVICE, maintenance_state == NONE, retired_at == null"
            - "Station.${st_id}.payment_interop_score == 0.00 and Station.${st_id}.commissioned_port_count == 1 and Station.${st_id}.installed_power_kw == 150.00"
            - "Station.${st_id}.corridor_designated == false (the Station-level optional default also applied)"

      - name: create_host_site_generates_id_timestamps_and_initial_version
        claim_type: system_fields
        grounds:
          - entities.HostSite
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "id, created_at, updated_at and version are server-generated: created_at and updated_at must equal the logical clock instant set before the call (2026-06-01T00:00:00Z, not the default 2026-08-01T00:00:00Z), version must start at 1, and the client never supplies any of them."
        test_recipe:
          setup:
            - "Empty database; logical clock explicitly moved to 2026-06-01T00:00:00Z before the create."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: NetworkOperator
          trigger:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00 }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          assert:
            - "HTTP status == 201 and HostSite.${site_id}.id is a non-empty server-generated identifier"
            - "HostSite.${site_id}.created_at == \"2026-06-01T00:00:00Z\" and updated_at == \"2026-06-01T00:00:00Z\""
            - "HostSite.${site_id}.version == 1"
            - "HostSite.${site_id}.agreement_status == DRAFT, power_upgrade_status == REQUESTED, access_hours_mode == TWENTY_FOUR_SEVEN, access_open_minute == 0, access_close_minute == 1440, parking_enforcement_mode == NONE"

      - name: host_site_station_count_is_derived_from_live_stations
        claim_type: computed_fields
        grounds:
          - entities.HostSite.fields.station_count
          - endpoints[POST /stations]
          - endpoints[POST /stations/{station_id}/status-transitions]
        distinguishing_aspect: "station_count is source: computed — it is never accepted as input, rises to 2 as two Stations are created, and falls back to 1 when one of them is decommissioned. A denormalised counter that only ever increments fails the third observation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one HostSite with station_count 0."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 800.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st1_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-2", power_class: "L2_19", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st2_id: $.data.id }
            - call: "POST /stations/${st2_id}/status-transitions"
              payload: { target_status: "DECOMMISSIONED" }
              as: NetworkOperator
          assert:
            - "after the first create: HostSite.${site_id}.station_count == 1"
            - "after the second create: HostSite.${site_id}.station_count == 2"
            - "after the decommission: HostSite.${site_id}.station_count == 1"
            - "Station.${st2_id}.status == DECOMMISSIONED"
            - "GET /host-sites/${site_id}/stations returns 2 rows (the decommissioned station is still listed; only the counter changed)"
            - "GET /host-sites/${site_id}/stations?status=DECOMMISSIONED returns exactly 1 row whose id == \"${st2_id}\""

      - name: create_charging_port_with_invalid_connector_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.ChargingPort.fields.connector_type
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "connector_type is closed over {CCS1, NACS, CHADEMO, J1772}; a value outside that set must be rejected with ERR_INVALID_REQUEST (400) and leave Station.commissioned_port_count at 0, distinguishing enum validation from free-text acceptance."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one HostSite; one Station ST-1 in DRAFT with no ports."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "TYPE2_MENNEKES", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "Station.${st_id}.commissioned_port_count == 0 and installed_power_kw == 0"
            - "GET /stations/${st_id}/charging-ports returns 0 rows"

      - name: create_station_under_unknown_host_site_returns_host_site_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Station.fields.host_site_id
          - errors[ERR_HOST_SITE_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "host_site_id is a declared FK; pointing it at an id no HostSite owns must yield ERR_HOST_SITE_NOT_FOUND (404), which is an existence failure at priority 3 rather than the shape failure ERR_INVALID_REQUEST at priority 5."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; exactly one HostSite exists, and the id used in the trigger is not it."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00 }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /stations"
              payload: { host_site_id: "00000000-0000-0000-0000-0000000000ff", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == \"ERR_HOST_SITE_NOT_FOUND\""
            - "HostSite.${site_id}.station_count == 0 (the real site was untouched)"

      - name: create_complaint_with_port_belonging_to_another_station_rejected
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=13]
          - errors[ERR_COMPLAINT_PORT_MISMATCH]
          - endpoints[POST /customer-complaints]
        distinguishing_aspect: "The flat topology means CustomerComplaint carries two independent FKs that must agree: both station_id and port_id resolve to real rows, so no NOT_FOUND applies, yet the port belongs to the other station and the create must fail with ERR_COMPLAINT_PORT_MISMATCH (409). This is cross-reference integrity, not existence."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one HostSite; two Stations ST-1 and ST-2, each with one ChargingPort (DS-1 on ST-1, DS-2 on ST-2)."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 800.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st1_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-2", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st2_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st1_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st2_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-2", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /customer-complaints"
              payload: { station_id: "${st1_id}", port_id: "${p2_id}", complaint_type: "PAYMENT_DECLINED", session_started_at: "2026-07-31T10:00:00Z", session_ended_at: "2026-07-31T10:20:00Z", session_energy_kwh: 5.000, session_price_per_kwh_cents: 40, session_charged_cents: 200 }
              as: CustomerSupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == \"ERR_COMPLAINT_PORT_MISMATCH\""
            - "GET /customer-complaints?station_id=${st1_id} returns 0 rows"
            - "GET /customer-complaints?port_id=${p2_id} returns 0 rows"

      - name: duplicate_dispenser_serial_across_two_stations_rejected
        claim_type: type_constraints
        grounds:
          - entities.ChargingPort.fields.dispenser_serial
          - validations[priority=6]
          - errors[ERR_DISPENSER_SERIAL_DUPLICATE]
        distinguishing_aspect: "dispenser_serial uniqueness is GLOBAL, not per-station: reusing DS-1 on a second station must still fail with ERR_DISPENSER_SERIAL_DUPLICATE (409). A per-parent unique index would wrongly accept it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one HostSite; two Stations ST-1 and ST-2; ChargingPort DS-1 already exists on ST-1."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 800.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st1_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-2", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st2_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st1_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /charging-ports"
              payload: { station_id: "${st2_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-9" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == \"ERR_DISPENSER_SERIAL_DUPLICATE\""
            - "Station.${st2_id}.commissioned_port_count == 0 and installed_power_kw == 0"
            - "GET /stations/${st2_id}/charging-ports returns 0 rows"
            - "GET /stations/${st1_id}/charging-ports returns exactly 1 row whose id == \"${p1_id}\""

  # ===========================================================================
  # SECTION 2 — State Machines (§1.2), parallel state_machine_shape
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_entities_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Station.initial_state
          - state_machines.ChargingPort.initial_state
          - state_machines.OutageEvent.initial_state
          - state_machines.CustomerComplaint.initial_state
          - state_machines.MaintenanceDispatch.initial_state
        distinguishing_aspect: "Five independent state machines must seed their initial states on create: Station DRAFT, ChargingPort IN_SERVICE + maintenance_state NONE, OutageEvent DETECTED, CustomerComplaint INTAKE + refund_state NONE. A MINOR fault must NOT pull the port out of service on intake, which is what separates initial-state seeding from the fault cascade."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /outage-events"
