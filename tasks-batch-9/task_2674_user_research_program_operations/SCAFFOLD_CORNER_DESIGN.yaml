        grounds:
          - state_machines[Study.recruitment_status] QUOTA_MET -> RECRUITING
          - state_machines[Recruitment.status] SCHEDULED -> WITHDRAWN
          - state_machines[Recruitment.incentive_state] RESERVED -> RELEASED
        distinguishing_aspect: "The recruitment dimension is a genuine loop: a withdrawal drops the held-slot count below target, QUOTA_MET reverts to RECRUITING, and the freed reservation makes the next invitation affordable again."
        test_recipe:
          setup:
            - "FIELDING INTERVIEW study with target 2, both slots held by SCHEDULED recruitments, pool reserved 10000 of 100000"
