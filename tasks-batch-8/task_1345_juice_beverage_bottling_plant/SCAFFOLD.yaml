# =============================================================================
# Juice & Beverage Bottling Plant (beverage co-packing bottler) — seed tables v1
# =============================================================================

scenario: |
  Juice & Beverage Bottling Plant (beverage co-packing bottler): formula/brix & blending tank scheduling, pasteurization/HPP process validation, bottling line changeover & container supply, co-packing customer scheduling & minimum runs, shelf-life dating & distribution channel routing, label/claim compliance review, yield loss & giveaway control, returnable pallet & warehouse capacity

domain_name: juice-bottling-plant
api_prefix: /v1

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: "Temporal windowing"        # tank/line interval scheduling with CIP + changeover buffers
  secondary_archetype: "Compliance / audit"      # label-claim review, process validation, segregation of duties
  complexity_layers:
    - optimistic_concurrency                     # OCC on Formula / ProductionRun / ShipmentOrder version
    - cascading_side_effects                     # condemn / label-reject / recall cascades span 3+ entities
    - version_pinning_on_approval                # label_version pinned onto scheduled runs
    - ops_run_checkpoint                         # expiry, credit sweep, pallet aging per epoch
  entity_topology: flat                          # peer entities with FK references; flat URL space under /v1
  state_machine_shape: cyclic                    # Batch QA-reblend loop, Formula label-review loop, order backorder loop, customer suspend/reactivate loop; ProductionRun adds parallel dims
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties              # QA verdict vs blender; label reviewer vs submitter
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer display name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit limit; ops-run suspends when outstanding strictly greater" }
      - { name: minimum_run_units, type: integer, source: input, description: "Co-pack minimum: every production run for this customer must plan >= this many units" }
      - { name: pallet_deposit_cents, type: integer, source: input, description: "Returnable-pallet deposit charged per shipped pallet" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Ledger balance: invoices + pallet escrow charges - payments - pallet return credits" }
      - { name: status, type: enum, source: system, description: "PENDING_CREDIT | ACTIVE | SUSPENDED | CLOSED" }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning co-pack customer" }
      - { name: formula_code, type: string, source: input, description: "Unique-per-customer recipe code" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: target_brix, type: number, source: input, description: "Target sugar content (degrees Brix)" }
      - { name: brix_tolerance, type: number, source: input, description: "Inclusive +/- tolerance band around target_brix" }
      - { name: process_type, type: enum, source: input, description: "PASTEURIZATION | HPP" }
      - { name: container_fill_ml, type: integer, source: input, description: "Nominal fill volume per container in milliliters" }
      - { name: concentrate_brix, type: number, source: input, description: "Brix of the concentrate used for upward adjustment" }
      - { name: allergen_group, type: enum, source: input, description: "NONE | SULFITE | TREE_NUT | MILK" }
      - { name: shelf_life_days, type: integer, source: input, description: "Label-claim shelf life in calendar days from production date" }
      - { name: claims, type: array, source: input, description: "Label claims: ORGANIC | NON_GMO | NO_ADDED_SUGAR | VITAMIN_C | COLD_PRESSED" }
      - { name: label_version, type: integer, source: system, default: 0, description: "Starts 0; increments by 1 on every label-review approval" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the ProductDeveloper who most recently submitted for label review (SoD marker)" }
      - { name: status, type: enum, source: system, description: "DRAFT | LABEL_REVIEW | APPROVED | REVISION_REQUIRED | RETIRED" }

  - name: LabelClaimReview
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: system, description: "FK -> Formula.id; formula under review" }
      - { name: claims_snapshot, type: array, source: system, description: "Snapshot of formula.claims at submission time" }
      - { name: review_note, type: string, source: input, description: "Optional reviewer note (required on reject semantics-free)" , constraints: "optional" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of reviewer who decided; null until decided" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | SUPERSEDED" }

  - name: BlendingTank
    parent: null
    common_fields: true
    fields:
      - { name: tank_code, type: string, source: input, description: "Human tank identifier" }
      - { name: capacity_liters, type: integer, source: input, description: "Maximum working volume" }
      - { name: allergen_group, type: enum, source: system, default: "NONE", description: "Allergen of last batch; reset to NONE on complete-cip" }
      - { name: posture, type: enum, source: computed, description: "AVAILABLE | OCCUPIED | AWAITING_CIP | IN_CIP" }
      - { name: occupying_batch_id, type: string, source: system, description: "Batch currently occupying the tank; null when not OCCUPIED" }
      - { name: cip_started_at, type: datetime, source: system, description: "Clock timestamp when current CIP cycle started; null unless IN_CIP" }
      - { name: cip_required_hours, type: integer, source: computed, description: "6 if allergen_group != NONE at CIP start else 2 (ALLERGEN_CIP_HOURS / STANDARD_CIP_HOURS)" }

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id" }
      - { name: tank_id, type: string, source: input, description: "FK -> BlendingTank.id" }
      - { name: planned_start_at, type: datetime, source: input, description: "Planned tank-occupation window start (closed interval)" }
      - { name: planned_end_at, type: datetime, source: input, description: "Planned tank-occupation window end (closed interval; must be > start)" }
      - { name: quantity_liters, type: number, source: input, description: "Initial blend volume; updated by adjustments (0.1 L precision)" }
      - { name: initial_quantity_liters, type: number, source: system, description: "Copy of quantity_liters at creation (mass-balance anchor)" }
      - { name: measured_brix, type: number, source: input, description: "Brix measured at record-blend; null until then" }
      - { name: added_water_liters, type: number, source: system, default: 0, description: "Cumulative water added by adjustments" }
      - { name: added_concentrate_liters, type: number, source: system, default: 0, description: "Cumulative concentrate added by adjustments" }
      - { name: adjustment_count, type: integer, source: system, default: 0, description: "Number of applied adjustments; hard cap REBLEND_LIMIT = 2" }
      - { name: blended_by_user_id, type: string, source: system, description: "X-User-ID recorded at record-blend (SoD marker)" }
      - { name: linked_run_id, type: string, source: system, description: "ProductionRun currently reserving this batch; null when unlinked" }
      - { name: loss_liters, type: number, source: computed, description: "Process loss = round(quantity_liters * 0.02, 1) at processing completion" }
      - { name: processed_liters, type: number, source: computed, description: "quantity_liters - loss_liters at processing completion" }
      - { name: status, type: enum, source: system, description: "PLANNED | BLENDING | AWAITING_QA | QA_PASSED | QA_FAILED | PROCESSING | PROCESSED | RELEASED | CONDEMNED | CONSUMED" }

  - name: ProcessRun
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id" }
      - { name: process_type, type: enum, source: system, description: "Copied from formula at creation: PASTEURIZATION | HPP" }
      - { name: setpoint_temp_c, type: number, source: input, description: "Required for PASTEURIZATION: hold temperature setpoint" }
      - { name: setpoint_hold_seconds, type: integer, source: input, description: "Required for PASTEURIZATION: hold time setpoint" }
      - { name: setpoint_pressure_mpa, type: number, source: input, description: "Required for HPP: pressure setpoint" }
      - { name: setpoint_pressure_hold_seconds, type: integer, source: input, description: "Required for HPP: pressure hold setpoint" }
      - { name: min_temp_c, type: number, source: input, description: "PASTEURIZATION reading at complete" }
      - { name: time_below_setpoint_seconds, type: integer, source: input, description: "PASTEURIZATION reading at complete" }
      - { name: min_pressure_mpa, type: number, source: input, description: "HPP reading at complete" }
      - { name: pressure_hold_shortfall_seconds, type: integer, source: input, description: "HPP reading at complete: seconds short of setpoint hold" }
      - { name: deviation_class, type: enum, source: computed, description: "NONE | MINOR | MAJOR" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RUNNING | VALIDATED | DEVIATED | ABORTED | DISPOSITION_RELEASED | DISPOSITION_REJECTED" }

  - name: ContainerLot
    parent: null
    common_fields: true
    fields:
      - { name: container_type, type: enum, source: input, description: "GLASS_355 | PET_473 | PET_1000 | CAN_330" }
      - { name: quantity_received, type: integer, source: input, description: "Units received" }
      - { name: supplier_lot_code, type: string, source: input, description: "Supplier lot reference" }
      - { name: quantity_available, type: integer, source: computed, description: "received - reserved - consumed" }
      - { name: quantity_reserved, type: integer, source: computed, description: "Reserved by SCHEDULED production runs" }
      - { name: quantity_consumed, type: integer, source: computed, description: "Consumed by completed production runs" }
      - { name: status, type: enum, source: system, description: "RECEIVED | QC_PASSED | QC_FAILED | RETURNED | DEPLETED" }

  - name: BottlingLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Human line identifier" }
      - { name: supported_container_types, type: array, source: input, description: "Subset of GLASS_355 | PET_473 | PET_1000 | CAN_330" }
      - { name: nominal_cpm, type: integer, source: input, description: "Nominal containers per minute" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; formula.customer_id must equal customer_id" }
      - { name: container_type, type: enum, source: input, description: "GLASS_355 | PET_473 | PET_1000 | CAN_330" }
      - { name: planned_units, type: integer, source: input, description: "Planned fill count (units)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Co-pack price per billable unit" }
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id; supplied at schedule" }
      - { name: line_id, type: string, source: input, description: "FK -> BottlingLine.id; supplied at schedule" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Line window start (half-open [start, end))" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Line window end (must be > start)" }
      - { name: label_version_pinned, type: integer, source: system, description: "formula.label_version captured at schedule; checked again at start" }
      - { name: theoretical_units, type: integer, source: computed, description: "floor(batch.processed_liters * 1000 / formula.container_fill_ml) at schedule" }
      - { name: actual_units_filled, type: integer, source: input, description: "Filler count at complete" }
      - { name: avg_fill_ml, type: number, source: input, description: "Average measured fill at complete" }
      - { name: giveaway_liters, type: number, source: computed, description: "max(0, (avg_fill_ml - container_fill_ml)) * actual_units_filled / 1000, 1 dp round_half_up" }
      - { name: billable_units, type: integer, source: computed, description: "(actual_units_filled // 12) * 12 — case-floor BEFORE invoicing (pinned rounding order)" }
      - { name: pallet_count, type: integer, source: computed, description: "ceil(actual_units_filled / UNITS_PER_PALLET[container_type])" }
      - { name: provisional_invoice_cents, type: integer, source: computed, description: "billable_units * unit_price_cents at complete" }
      - { name: final_invoice_cents, type: integer, source: computed, description: "provisional - round_half_up(giveaway_liters * 140) at finalize" }
      - { name: production_status, type: enum, source: system, description: "QUOTED | CONFIRMED | SCHEDULED | IN_PRODUCTION | COMPLETED | BLOCKED_SUPPLY | BLOCKED_LABEL | CANCELLED" }
      - { name: invoice_status, type: enum, source: system, description: "NOT_INVOICED | PROVISIONAL | FINAL — parallel dimension, independent of production_status" }

  - name: FinishedGoodLot
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id" }
      - { name: formula_id, type: string, source: system, description: "FK -> Formula.id (denormalized from run)" }
      - { name: customer_id, type: string, source: system, description: "FK -> CustomerAccount.id (denormalized from run)" }
      - { name: warehouse_zone_id, type: string, source: system, description: "FK -> WarehouseZone.id" }
      - { name: lot_code, type: string, source: system, description: "Server-minted lot code FG-<production_run_id>" }
      - { name: units_total, type: integer, source: system, description: "actual_units_filled at creation" }
      - { name: units_available, type: integer, source: computed, description: "units_total - units_allocated - units_shipped" }
      - { name: units_allocated, type: integer, source: computed, description: "Units reserved by non-terminal shipment-order allocations" }
      - { name: units_shipped, type: integer, source: computed, description: "Units shipped out" }
      - { name: pallet_count, type: integer, source: computed, description: "ceil((units_total - units_shipped) / UNITS_PER_PALLET[run.container_type])" }
      - { name: production_date, type: string, source: system, description: "Calendar date (YYYY-MM-DD) of the logical clock at run completion" }
      - { name: expiry_label_date, type: string, source: computed, description: "production_date + formula.shelf_life_days" }
      - { name: expiry_stability_date, type: string, source: computed, description: "HPP: production_date + floor(shelf_life_days * 1.5); PASTEURIZATION: production_date + shelf_life_days - 7" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | DEPLETED | EXPIRED | RECALLED" }

  - name: WarehouseZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Human zone identifier" }
      - { name: temperature_class, type: enum, source: input, description: "AMBIENT | CHILLED | FROZEN" }
      - { name: pallet_capacity, type: integer, source: input, description: "Max pallets; lots occupy until units_total - units_shipped == 0" }
      - { name: pallets_stored, type: integer, source: computed, description: "Sum of pallet_count over lots in this zone with units_total - units_shipped > 0" }

  - name: ShipmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id" }
      - { name: channel, type: enum, source: input, description: "DIRECT_RETAIL | CLUB | FOODSERVICE | EXPORT" }
      - { name: requested_delivery_date, type: string, source: input, description: "YYYY-MM-DD; must be >= current logical date" }
      - { name: units_requested, type: integer, source: input, description: "Units to ship" }
      - { name: min_shelf_life_days, type: integer, source: computed, description: "Channel minimum on receipt: DIRECT_RETAIL 30 | CLUB 45 | FOODSERVICE 21 | EXPORT 60" }
      - { name: allocations, type: array, source: system, description: "Array of {lot_id, units} built by FEFO allocation" }
      - { name: allocated_units, type: integer, source: computed, description: "Sum of allocations[].units" }
      - { name: pallet_count, type: integer, source: computed, description: "Sum over allocations of ceil(units_i / UNITS_PER_PALLET[lot container_type]) — per-lot ceil THEN sum (pinned)" }
      - { name: status, type: enum, source: system, description: "PLACED | ALLOCATED | PICKED | SHIPPED | BACKORDERED | CANCELLED" }

  - name: PalletAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> CustomerAccount.id; exactly one per customer, created with it" }
      - { name: pallets_out_total, type: integer, source: computed, default: 0, description: "Sum of SHIP entry pallet_count" }
      - { name: pallets_returned_total, type: integer, source: computed, default: 0, description: "Sum of RETURN entry pallet_count" }
      - { name: pallets_converted_total, type: integer, source: computed, default: 0, description: "Sum of CONVERSION entry pallet_count" }
      - { name: pallets_outstanding, type: integer, source: computed, description: "out - returned - converted; never negative" }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "pallets_outstanding * customer.pallet_deposit_cents" }

  - name: PalletEntry
    parent: null
    common_fields: false
    fields:
      - { name: pallet_account_id, type: string, source: system, description: "FK -> PalletAccount.id" }
      - { name: entry_type, type: enum, source: system, description: "SHIP | RETURN | CONVERSION" }
      - { name: pallet_count, type: integer, source: system, description: "Positive pallet count of this entry" }
      - { name: shipment_order_id, type: string, source: system, description: "Originating shipment order for SHIP entries; null otherwise" }
      - { name: entry_date, type: string, source: system, description: "Calendar date of the logical clock when posted" }
      - { name: running_balance, type: integer, source: computed, description: "pallets_outstanding immediately after this entry posts" }

  - name: OpsRun
    parent: null
    common_fields: false
    fields:
      - { name: ran_at, type: datetime, source: system, description: "Logical clock timestamp of the sweep" }
      - { name: lots_expired_count, type: integer, source: system, description: "Lots flipped AVAILABLE -> EXPIRED" }
      - { name: orders_backordered_count, type: integer, source: system, description: "Orders demoted to BACKORDERED by expiry sweep" }
      - { name: orders_cancelled_count, type: integer, source: system, description: "Stale PLACED/BACKORDERED orders auto-cancelled" }
      - { name: customers_suspended_count, type: integer, source: system, description: "ACTIVE customers suspended for credit breach" }
      - { name: pallets_converted_count, type: integer, source: system, description: "Pallets aged >= 30 days converted to sold" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CustomerAccount
    initial_state: PENDING_CREDIT
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_CREDIT
        to: ACTIVE
        trigger: "POST /v1/customer-accounts/{id}/approve-credit"
        actor: FinanceClerk
        preconditions:
          - "Customer in PENDING_CREDIT (else ERR_CUSTOMER_STATE_INVALID)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/customer-accounts/{id}/suspend, or system (ops run: outstanding_balance_cents > credit_limit_cents, strictly greater)"
        actor: "FinanceClerk or system"
        preconditions:
          - "Manual: customer in ACTIVE (else ERR_CUSTOMER_STATE_INVALID)"
        side_effects:
          - "Blocks: production-run confirm, shipment-order placement/allocation (ERR_CUSTOMER_NOT_ACTIVE)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/customer-accounts/{id}/reactivate"
        actor: FinanceClerk
        preconditions:
          - "Customer in SUSPENDED (else ERR_CUSTOMER_STATE_INVALID)"
          - "outstanding_balance_cents <= floor(credit_limit_cents * 0.8) (else ERR_REACTIVATION_THRESHOLD_NOT_MET) — hysteresis band: paying down to exactly the limit is NOT enough"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /v1/customer-accounts/{id}/close"
        actor: FinanceClerk
        preconditions:
          - "Customer in ACTIVE or SUSPENDED (else ERR_CUSTOMER_STATE_INVALID)"
          - "No ProductionRun in QUOTED/CONFIRMED/SCHEDULED/IN_PRODUCTION/BLOCKED_SUPPLY/BLOCKED_LABEL and no ShipmentOrder in PLACED/ALLOCATED/PICKED/BACKORDERED (else ERR_CUSTOMER_STATE_INVALID)"
          - "PalletAccount.pallets_outstanding == 0 (else ERR_CUSTOMER_STATE_INVALID)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /v1/customer-accounts/{id}/close"
        actor: FinanceClerk
        preconditions:
          - "Same as ACTIVE -> CLOSED"
        side_effects: []

  - entity: Formula
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: LABEL_REVIEW
        trigger: "POST /v1/formulas/{id}/submit-label-review"
        actor: ProductDeveloper
        preconditions:
          - "Formula in DRAFT, REVISION_REQUIRED, APPROVED or LABEL_REVIEW (else ERR_FORMULA_STATE_INVALID)"
          - "OCC: expected_formula_version == formula.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Creates LabelClaimReview(PENDING) with claims_snapshot = formula.claims"
          - "Any existing PENDING LabelClaimReview for this formula -> SUPERSEDED"
          - "formula.submitted_by_user_id = caller X-User-ID"
          - "formula.version += 1"
      - from: REVISION_REQUIRED
        to: LABEL_REVIEW
        trigger: "POST /v1/formulas/{id}/submit-label-review"
        actor: ProductDeveloper
        preconditions:
          - "Same as DRAFT -> LABEL_REVIEW"
        side_effects:
          - "Same as DRAFT -> LABEL_REVIEW"
      - from: APPROVED
        to: LABEL_REVIEW
        trigger: "POST /v1/formulas/{id}/submit-label-review (re-submission of an approved formula)"
        actor: ProductDeveloper
        preconditions:
          - "Same as DRAFT -> LABEL_REVIEW"
        side_effects:
          - "Same as DRAFT -> LABEL_REVIEW"
          - "Runs in CONFIRMED are NOT demoted yet (demotion happens on reject); their pinned label_version is still current until an approval bumps it"
      - from: LABEL_REVIEW
        to: LABEL_REVIEW
        trigger: "POST /v1/formulas/{id}/submit-label-review (re-submission while a review is PENDING)"
        actor: ProductDeveloper
        preconditions:
          - "Formula in DRAFT, REVISION_REQUIRED, APPROVED or LABEL_REVIEW (else ERR_FORMULA_STATE_INVALID)"
          - "OCC: expected_formula_version == formula.version (else ERR_STALE_VERSION)"
        side_effects:
          - "The currently PENDING LabelClaimReview -> SUPERSEDED; a new PENDING review is created"
          - "formula.submitted_by_user_id = caller X-User-ID; formula.version += 1"
      - from: LABEL_REVIEW
        to: APPROVED
        trigger: "system (LabelClaimReview approve)"
        actor: system
        preconditions:
          - "The decided review is the current PENDING review of this formula"
        side_effects:
          - "formula.label_version += 1"
          - "All ProductionRuns of this formula in BLOCKED_LABEL -> CONFIRMED (auto-restore)"
      - from: LABEL_REVIEW
        to: REVISION_REQUIRED
        trigger: "system (LabelClaimReview reject)"
        actor: system
        preconditions: []
        side_effects:
          - "All ProductionRuns of this formula in CONFIRMED -> BLOCKED_LABEL (cascade hop 2)"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /v1/formulas/{id}/retire"
        actor: ProductDeveloper
        preconditions:
          - "Formula in DRAFT or APPROVED (else ERR_FORMULA_STATE_INVALID)"
          - "No ProductionRun of this formula in QUOTED/CONFIRMED/SCHEDULED/IN_PRODUCTION/BLOCKED_SUPPLY/BLOCKED_LABEL (else ERR_FORMULA_STATE_INVALID)"
        side_effects: []
      - from: APPROVED
        to: RETIRED
        trigger: "POST /v1/formulas/{id}/retire"
        actor: ProductDeveloper
        preconditions:
          - "Same as DRAFT -> RETIRED"
        side_effects: []

  - entity: LabelClaimReview
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /v1/label-reviews/{id}/approve"
        actor: LabelComplianceReviewer
        preconditions:
          - "Review in PENDING (else ERR_REVIEW_STATE_INVALID)"
          - "SoD: caller X-User-ID != formula.submitted_by_user_id (else ERR_SOD_LABEL_SELF_REVIEW)"
        side_effects:
          - "reviewer_user_id = caller"
          - "Formula: LABEL_REVIEW -> APPROVED, label_version += 1, BLOCKED_LABEL runs -> CONFIRMED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /v1/label-reviews/{id}/reject"
        actor: LabelComplianceReviewer
        preconditions:
          - "Review in PENDING (else ERR_REVIEW_STATE_INVALID)"
          - "SoD: caller X-User-ID != formula.submitted_by_user_id (else ERR_SOD_LABEL_SELF_REVIEW)"
        side_effects:
          - "Formula: LABEL_REVIEW -> REVISION_REQUIRED; its CONFIRMED runs -> BLOCKED_LABEL"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (a newer submit-label-review on the same formula)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BlendingTank
    initial_state: AVAILABLE
    terminal_states: []
    note: "posture machine; field: posture"
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system (POST /v1/batches creates a batch in this tank)"
        actor: system
        preconditions:
          - "Tank posture AVAILABLE (else ERR_TANK_STATE_INVALID)"
        side_effects:
          - "occupying_batch_id = new batch id; tank.allergen_group = formula.allergen_group"
      - from: OCCUPIED
        to: AWAITING_CIP
        trigger: "system (occupying batch enters PROCESSING, or is CONDEMNED)"
        actor: system
        preconditions: []
        side_effects:
          - "occupying_batch_id = null"
      - from: AWAITING_CIP
        to: IN_CIP
        trigger: "POST /v1/blending-tanks/{id}/start-cip"
        actor: BlendOperator
        preconditions:
          - "Tank posture AWAITING_CIP (else ERR_TANK_STATE_INVALID)"
        side_effects:
          - "cip_started_at = current logical clock; cip_required_hours = 6 if allergen_group != NONE else 2"
      - from: IN_CIP
        to: AVAILABLE
        trigger: "POST /v1/blending-tanks/{id}/complete-cip"
        actor: BlendOperator
        preconditions:
          - "Tank posture IN_CIP (else ERR_TANK_STATE_INVALID)"
          - "current logical clock >= cip_started_at + cip_required_hours (else ERR_CIP_DURATION_INSUFFICIENT; equality allowed)"
        side_effects:
          - "allergen_group = NONE; cip_started_at = null"

  - entity: Batch
    initial_state: PLANNED
    terminal_states: [CONDEMNED, CONSUMED]
    transitions:
      - from: PLANNED
        to: BLENDING
        trigger: "POST /v1/batches/{id}/start-blend"
        actor: BlendOperator
        preconditions:
          - "Batch in PLANNED (else ERR_BATCH_STATE_INVALID)"
          - "Tank posture OCCUPIED by this batch (else ERR_TANK_STATE_INVALID)"
        side_effects: []
      - from: BLENDING
        to: AWAITING_QA
        trigger: "POST /v1/batches/{id}/record-blend"
        actor: BlendOperator
        preconditions:
          - "Batch in BLENDING (else ERR_BATCH_STATE_INVALID)"
        side_effects:
          - "measured_brix = input; blended_by_user_id = caller X-User-ID"
      - from: AWAITING_QA
        to: QA_PASSED
        trigger: "POST /v1/batches/{id}/qa-verdict verdict=PASS"
        actor: QAInspector
        preconditions:
          - "Batch in AWAITING_QA (else ERR_BATCH_STATE_INVALID)"
          - "SoD: caller X-User-ID != blended_by_user_id (else ERR_SOD_QA_SELF_APPROVAL)"
          - "|measured_brix - formula.target_brix| <= formula.brix_tolerance, inclusive (else ERR_BRIX_OUT_OF_TOLERANCE)"
        side_effects: []
      - from: AWAITING_QA
        to: QA_FAILED
        trigger: "POST /v1/batches/{id}/qa-verdict verdict=FAIL"
        actor: QAInspector
        preconditions:
          - "Batch in AWAITING_QA (else ERR_BATCH_STATE_INVALID)"
          - "SoD: caller X-User-ID != blended_by_user_id (else ERR_SOD_QA_SELF_APPROVAL)"
        side_effects: []
      - from: QA_FAILED
        to: BLENDING
        trigger: "POST /v1/batches/{id}/apply-adjustment"
        actor: BlendOperator
        preconditions:
          - "Batch in QA_FAILED (else ERR_BATCH_STATE_INVALID)"
          - "adjustment_count < 2 before this adjustment (else ERR_REBLEND_LIMIT_EXCEEDED — the third attempt is rejected)"
          - "measured_brix outside tolerance band (else ERR_NOTHING_TO_ADJUST)"
          - "Computed addition fits tank: quantity_liters + addition <= tank.capacity_liters (else ERR_ADJUSTMENT_EXCEEDS_TANK_CAPACITY)"
        side_effects:
          - "Apply brix_adjustment: added_water_liters or added_concentrate_liters += computed addition; quantity_liters += addition; adjustment_count += 1"
      - from: QA_FAILED
        to: CONDEMNED
        trigger: "POST /v1/batches/{id}/condemn"
        actor: QAInspector
        preconditions:
          - "Batch in QA_FAILED, PROCESSED or RELEASED (else ERR_BATCH_STATE_INVALID)"
          - "SoD: caller X-User-ID != blended_by_user_id (else ERR_SOD_QA_SELF_APPROVAL)"
        side_effects:
          - "Cascade hop 1: its ProcessRun in SCHEDULED/RUNNING/DEVIATED -> ABORTED"
          - "Cascade hop 2: linked ProductionRun (linked_run_id) in SCHEDULED -> BLOCKED_SUPPLY"
          - "Cascade hop 3: that run's container reservations released (ContainerLot.quantity_reserved -= ; quantity_available += per lot)"
          - "Cascade hop 4: that run's line window freed (run no longer occupies BottlingLine window set)"
          - "Tank: if OCCUPIED by this batch -> AWAITING_CIP"
      - from: PROCESSED
        to: CONDEMNED
        trigger: "POST /v1/batches/{id}/condemn"
        actor: QAInspector
        preconditions:
          - "Same as QA_FAILED -> CONDEMNED"
        side_effects:
          - "Same cascade as QA_FAILED -> CONDEMNED"
      - from: RELEASED
        to: CONDEMNED
        trigger: "POST /v1/batches/{id}/condemn (post-release retained-sample failure)"
        actor: QAInspector
        preconditions:
          - "Same as QA_FAILED -> CONDEMNED"
        side_effects:
          - "Same cascade as QA_FAILED -> CONDEMNED"
      - from: PROCESSING
        to: CONDEMNED
        trigger: "system (qa-disposition REJECT on the governing DEVIATED process run)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as QA_FAILED -> CONDEMNED"
      - from: QA_PASSED
        to: PROCESSING
        trigger: "system (POST /v1/process-runs/{id}/start on a run of this batch)"
        actor: system
        preconditions: []
        side_effects:
          - "Tank OCCUPIED by this batch -> AWAITING_CIP (batch leaves the tank)"
      - from: PROCESSING
        to: PROCESSED
        trigger: "system (process run complete -> VALIDATED, or qa-disposition RELEASE)"
        actor: system
        preconditions: []
        side_effects:
          - "loss_liters = round(quantity_liters * 0.02, 1); processed_liters = quantity_liters - loss_liters"
      - from: PROCESSING
        to: QA_PASSED
        trigger: "system (process run abort)"
        actor: system
        preconditions: []
        side_effects:
          - "Batch returns to QA_PASSED so a replacement ProcessRun can be created (cycle)"
      - from: PROCESSED
        to: RELEASED
        trigger: "POST /v1/batches/{id}/release"
        actor: QAInspector
        preconditions:
          - "Batch in PROCESSED or PROCESSING (else ERR_BATCH_STATE_INVALID)"
          - "SoD: caller X-User-ID != blended_by_user_id (else ERR_SOD_QA_SELF_APPROVAL)"
          - "When releasing from PROCESSING: governing (latest non-ABORTED) ProcessRun must be VALIDATED or DISPOSITION_RELEASED (else ERR_PROCESS_NOT_VALIDATED); when releasing from PROCESSED the gate already held at the PROCESSED transition"
        side_effects: []
      - from: PROCESSING
        to: RELEASED
        trigger: "POST /v1/batches/{id}/release (fast-path release straight out of processing)"
        actor: QAInspector
        preconditions:
          - "Same as PROCESSED -> RELEASED, including the process-validation gate"
        side_effects:
          - "If loss_liters not yet computed (governing run reached DISPOSITION_RELEASED semantics aside), compute loss/processed as in PROCESSING -> PROCESSED"
      - from: RELEASED
        to: CONSUMED
        trigger: "system (linked ProductionRun completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProcessRun
    initial_state: SCHEDULED
    terminal_states: [VALIDATED, ABORTED, DISPOSITION_RELEASED, DISPOSITION_REJECTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /v1/process-runs/{id}/start"
        actor: BlendOperator
        preconditions:
          - "ProcessRun in SCHEDULED (else ERR_PROCESS_RUN_STATE_INVALID)"
          - "Batch in QA_PASSED (else ERR_BATCH_STATE_INVALID)"
        side_effects:
          - "Batch QA_PASSED -> PROCESSING; tank freed to AWAITING_CIP"
      - from: RUNNING
        to: VALIDATED
        trigger: "POST /v1/process-runs/{id}/complete (readings satisfy setpoints exactly)"
        actor: BlendOperator
        preconditions:
          - "ProcessRun in RUNNING (else ERR_PROCESS_RUN_STATE_INVALID)"
        side_effects:
          - "deviation_class = NONE; Batch PROCESSING -> PROCESSED (loss/processed computed)"
      - from: RUNNING
        to: DEVIATED
        trigger: "POST /v1/process-runs/{id}/complete (readings miss setpoints)"
        actor: BlendOperator
        preconditions:
          - "ProcessRun in RUNNING (else ERR_PROCESS_RUN_STATE_INVALID)"
        side_effects:
          - "deviation_class = MINOR or MAJOR per process_validation; batch stays PROCESSING pending disposition"
      - from: DEVIATED
        to: DISPOSITION_RELEASED
        trigger: "POST /v1/process-runs/{id}/qa-disposition disposition=RELEASE"
        actor: QAInspector
        preconditions:
          - "ProcessRun in DEVIATED (else ERR_PROCESS_RUN_STATE_INVALID)"
          - "SoD: caller X-User-ID != batch.blended_by_user_id (else ERR_SOD_QA_SELF_APPROVAL)"
        side_effects:
          - "Batch PROCESSING -> PROCESSED (loss/processed computed)"
      - from: DEVIATED
        to: DISPOSITION_REJECTED
        trigger: "POST /v1/process-runs/{id}/qa-disposition disposition=REJECT"
        actor: QAInspector
        preconditions:
          - "ProcessRun in DEVIATED (else ERR_PROCESS_RUN_STATE_INVALID)"
          - "SoD: caller X-User-ID != batch.blended_by_user_id (else ERR_SOD_QA_SELF_APPROVAL)"
        side_effects:
          - "Batch PROCESSING -> CONDEMNED and the full condemn cascade fires (process run already terminal, linked run -> BLOCKED_SUPPLY, reservations released, window freed)"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /v1/process-runs/{id}/abort, or system (batch condemned)"
        actor: "BlendOperator or system"
        preconditions:
          - "Manual: ProcessRun in SCHEDULED or RUNNING (else ERR_PROCESS_RUN_STATE_INVALID)"
        side_effects:
          - "If batch was PROCESSING (run was RUNNING): batch PROCESSING -> QA_PASSED"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /v1/process-runs/{id}/abort, or system (batch condemned)"
        actor: "BlendOperator or system"
        preconditions:
          - "Manual: ProcessRun in SCHEDULED or RUNNING"
        side_effects:
          - "If batch was PROCESSING: batch PROCESSING -> QA_PASSED"

  - entity: ContainerLot
    initial_state: RECEIVED
    terminal_states: [RETURNED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: QC_PASSED
        trigger: "POST /v1/container-lots/{id}/qc-verdict verdict=PASS"
        actor: QAInspector
        preconditions:
          - "Lot in RECEIVED (else ERR_CONTAINER_LOT_STATE_INVALID)"
        side_effects: []
      - from: RECEIVED
        to: QC_FAILED
        trigger: "POST /v1/container-lots/{id}/qc-verdict verdict=FAIL"
        actor: QAInspector
        preconditions:
          - "Lot in RECEIVED (else ERR_CONTAINER_LOT_STATE_INVALID)"
        side_effects: []
      - from: QC_FAILED
        to: RETURNED
        trigger: "POST /v1/container-lots/{id}/return"
        actor: WarehouseLead
        preconditions:
          - "Lot in QC_FAILED (else ERR_CONTAINER_LOT_STATE_INVALID)"
          - "quantity_reserved == 0 and quantity_consumed == 0 (full-lot return only)"
        side_effects: []
      - from: QC_PASSED
        to: DEPLETED
        trigger: "system (quantity_available == 0 after a run completion consumes the last units)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BottlingLine
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /v1/bottling-lines/{id}/set-maintenance"
        actor: PlantManager
        preconditions:
          - "Line in ACTIVE (else ERR_LINE_STATE_INVALID)"
          - "No ProductionRun on this line in SCHEDULED or IN_PRODUCTION (else ERR_LINE_STATE_INVALID)"
        side_effects: []
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /v1/bottling-lines/{id}/set-active"
        actor: PlantManager
        preconditions:
          - "Line in MAINTENANCE (else ERR_LINE_STATE_INVALID)"
        side_effects: []

  - entity: ProductionRun
    initial_state: QUOTED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Two parallel dimensions: production_status (this machine) x invoice_status (NOT_INVOICED -> PROVISIONAL at complete -> FINAL at finalize-invoice). They evolve independently after COMPLETED."
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /v1/production-runs/{id}/confirm"
        actor: ProductionPlanner
        preconditions:
          - "Run in QUOTED (else ERR_RUN_STATE_INVALID)"
          - "Customer in ACTIVE (else ERR_CUSTOMER_NOT_ACTIVE)"
          - "Formula in APPROVED (else ERR_LABEL_NOT_APPROVED)"
          - "planned_units >= customer.minimum_run_units (else ERR_MINIMUM_RUN_NOT_MET; equality allowed)"
        side_effects: []
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "POST /v1/production-runs/{id}/schedule"
        actor: ProductionPlanner
        preconditions:
          - "Run in CONFIRMED or BLOCKED_SUPPLY (else ERR_RUN_STATE_INVALID)"
          - "OCC: expected_production_run_version == run.version (else ERR_STALE_VERSION)"
          - "Formula in APPROVED (else ERR_LABEL_NOT_APPROVED)"
          - "Batch in RELEASED and batch.linked_run_id is null (else ERR_BATCH_NOT_RELEASED / ERR_BATCH_ALREADY_LINKED)"
          - "Batch formula_id == run.formula_id (else ERR_BATCH_NOT_RELEASED)"
          - "Line exists, status ACTIVE (else ERR_LINE_STATE_INVALID), container_type in line.supported_container_types (else ERR_LINE_UNSUPPORTED_CONTAINER)"
          - "scheduled_end_at > scheduled_start_at (else ERR_INVALID_WINDOW)"
          - "Line window free under half-open semantics with directional changeover buffer (else ERR_LINE_WINDOW_CONFLICT)"
          - "Container supply: sum of quantity_available over QC_PASSED lots of container_type >= ceil(planned_units * 1.05) (else ERR_CONTAINER_SUPPLY_INSUFFICIENT)"
        side_effects:
          - "label_version_pinned = formula.label_version; theoretical_units computed from batch.processed_liters"
          - "batch.linked_run_id = run id (batch stays RELEASED)"
          - "Container reservation FIFO: QC_PASSED lots of container_type ordered created_at ASC; reserve until ceil(planned_units * 1.05) reached; lot counters updated"
          - "run.version += 1"
      - from: BLOCKED_SUPPLY
        to: SCHEDULED
        trigger: "POST /v1/production-runs/{id}/schedule (re-schedule with a fresh batch)"
        actor: ProductionPlanner
        preconditions:
          - "Same as CONFIRMED -> SCHEDULED"
        side_effects:
          - "Same as CONFIRMED -> SCHEDULED"
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "POST /v1/production-runs/{id}/start"
        actor: ProductionPlanner
        preconditions:
          - "Run in SCHEDULED (else ERR_RUN_STATE_INVALID)"
          - "current logical clock in [scheduled_start_at, scheduled_end_at), half-open (else ERR_RUN_WINDOW_NOT_ACTIVE)"
          - "label_version_pinned == formula.label_version (else ERR_LABEL_VERSION_STALE)"
          - "Line status ACTIVE (else ERR_LINE_STATE_INVALID)"
        side_effects: []
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /v1/production-runs/{id}/complete"
        actor: ProductionPlanner
        preconditions:
          - "Run in IN_PRODUCTION (else ERR_RUN_STATE_INVALID)"
          - "actual_units_filled >= 1 and actual_units_filled <= min(theoretical_units, ceil(planned_units * 1.05)) (else ERR_FILL_COUNT_EXCEEDS_THEORETICAL)"
          - "WarehouseZone exists; temperature match: formula.process_type == HPP requires CHILLED; PASTEURIZATION allows AMBIENT or CHILLED; FROZEN always rejected (else ERR_ZONE_TEMPERATURE_MISMATCH)"
          - "zone.pallets_stored + run.pallet_count <= zone.pallet_capacity (else ERR_ZONE_CAPACITY_EXCEEDED; equality allowed)"
        side_effects:
          - "yield/giveaway/billable computed per yield_and_giveaway; invoice per invoice_calculation (provisional)"
          - "Creates FinishedGoodLot(AVAILABLE) in the zone with production_date = current logical date"
          - "Container consumption FIFO over the run's reserved lots (created_at ASC): consume actual_units_filled; release the remaining reserved balance"
          - "Batch -> CONSUMED; batch.linked_run_id = null"
          - "invoice_status NOT_INVOICED -> PROVISIONAL; customer.outstanding_balance_cents += provisional_invoice_cents"
      - from: SCHEDULED
        to: BLOCKED_SUPPLY
        trigger: "system (linked batch condemned)"
        actor: system
        preconditions: []
        side_effects:
          - "Container reservations released; line window freed; batch link cleared"
      - from: CONFIRMED
        to: BLOCKED_LABEL
        trigger: "system (formula label review rejected)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED_LABEL
        to: CONFIRMED
        trigger: "system (formula label review approved)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /v1/production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "Run in QUOTED, CONFIRMED, SCHEDULED, BLOCKED_SUPPLY or BLOCKED_LABEL (else ERR_RUN_STATE_INVALID)"
        side_effects:
          - "Compensation: release container reservations, free line window, clear batch link (batch stays RELEASED); nothing invoiced (invoice_status stays NOT_INVOICED)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions: ["Same as QUOTED -> CANCELLED"]
        side_effects: ["Same compensation as QUOTED -> CANCELLED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions: ["Same as QUOTED -> CANCELLED"]
        side_effects: ["Same compensation as QUOTED -> CANCELLED"]
      - from: BLOCKED_SUPPLY
        to: CANCELLED
        trigger: "POST /v1/production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions: ["Same as QUOTED -> CANCELLED"]
        side_effects: ["Same compensation as QUOTED -> CANCELLED"]
      - from: BLOCKED_LABEL
        to: CANCELLED
        trigger: "POST /v1/production-runs/{id}/cancel"
        actor: ProductionPlanner
        preconditions: ["Same as QUOTED -> CANCELLED"]
        side_effects: ["Same compensation as QUOTED -> CANCELLED"]
    parallel_dimensions:
      - field: invoice_status
        initial_state: NOT_INVOICED
        transitions:
          - from: NOT_INVOICED
            to: PROVISIONAL
            trigger: "system (run complete)"
            actor: system
          - from: PROVISIONAL
            to: FINAL
            trigger: "POST /v1/production-runs/{id}/finalize-invoice"
            actor: FinanceClerk
            preconditions:
              - "production_status == COMPLETED and invoice_status == PROVISIONAL (else ERR_RUN_STATE_INVALID)"
            side_effects:
              - "final_invoice_cents computed; customer.outstanding_balance_cents += (final_invoice_cents - provisional_invoice_cents)"

  - entity: FinishedGoodLot
    initial_state: AVAILABLE
    terminal_states: [DEPLETED, EXPIRED, RECALLED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (units_total - units_shipped reaches 0 via shipment)"
        actor: system
        preconditions: []
        side_effects:
          - "Warehouse zone pallets_stored recomputed (lot contributes 0)"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (ops run: current logical date >= expiry_label_date; equality expires)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: allocations referencing this lot on ShipmentOrders in PLACED/ALLOCATED/BACKORDERED are removed (PICKED orders keep their allocations; the ship gate blocks them instead); allocated_units recomputed; any such order whose allocated_units < units_requested -> BACKORDERED (from ALLOCATED or PICKED)"
      - from: AVAILABLE
        to: RECALLED
        trigger: "POST /v1/finished-good-lots/{id}/recall"
        actor: QAInspector
        preconditions:
          - "Lot in AVAILABLE (else ERR_LOT_STATE_INVALID)"
        side_effects:
          - "Same de-allocation cascade as EXPIRED (PLACED/ALLOCATED/BACKORDERED only)"
      - from: EXPIRED
        to: RECALLED
        trigger: "POST /v1/finished-good-lots/{id}/recall"
        actor: QAInspector
        preconditions:
          - "Lot in AVAILABLE or EXPIRED (else ERR_LOT_STATE_INVALID)"
        side_effects: []

  - entity: ShipmentOrder
    initial_state: PLACED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PLACED
        to: ALLOCATED
        trigger: "POST /v1/shipment-orders/{id}/allocate"
        actor: WarehouseLead
        preconditions:
          - "Order in PLACED or BACKORDERED (else ERR_ORDER_STATE_INVALID)"
          - "OCC: expected_shipment_order_version == order.version (else ERR_STALE_VERSION)"
          - "Customer in ACTIVE (else ERR_CUSTOMER_NOT_ACTIVE)"
        side_effects:
          - "FEFO allocation per fefo_allocation; lots' units_available/units_allocated updated; status = ALLOCATED iff allocated_units == units_requested else BACKORDERED"
          - "order.version += 1"
      - from: PLACED
        to: BACKORDERED
        trigger: "POST /v1/shipment-orders/{id}/allocate (eligible pool short of units_requested; partial allocations persist)"
        actor: WarehouseLead
        preconditions:
          - "Same as PLACED -> ALLOCATED"
        side_effects:
          - "Same as PLACED -> ALLOCATED; status lands on BACKORDERED when allocated_units < units_requested"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "POST /v1/shipment-orders/{id}/allocate (top-up re-allocation; supersedes the prior allocation set)"
        actor: WarehouseLead
        preconditions:
          - "Same as PLACED -> ALLOCATED"
        side_effects:
          - "Same as PLACED -> ALLOCATED; existing allocations are kept and topped up"
      - from: ALLOCATED
        to: BACKORDERED
        trigger: "system (lot expired or recalled; allocation units removed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ALLOCATED
        to: PICKED
        trigger: "POST /v1/shipment-orders/{id}/pick"
        actor: WarehouseLead
        preconditions:
          - "Order in ALLOCATED (else ERR_ORDER_STATE_INVALID)"
        side_effects: []
      - from: PICKED
        to: SHIPPED
        trigger: "POST /v1/shipment-orders/{id}/ship"
        actor: WarehouseLead
        preconditions:
          - "Order in PICKED (else ERR_ORDER_STATE_INVALID)"
          - "Every allocated lot still AVAILABLE (not EXPIRED/RECALLED/DEPLETED) (else ERR_ORDER_CONTAINS_UNSHIPPABLE_LOT)"
        side_effects:
          - "Per lot: units_shipped += alloc units; units_allocated -= alloc units; lot pallet_count recomputed; zone pallets_stored recomputed"
          - "PalletEntry(SHIP) posted on customer's PalletAccount: pallet_count = order.pallet_count (per-lot ceil then sum); escrow_balance_cents += pallet_count * pallet_deposit_cents; customer.outstanding_balance_cents += same amount"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /v1/shipment-orders/{id}/cancel, or system (ops run: requested_delivery_date + 7 days < current logical date, strictly)"
        actor: "WarehouseLead, CustomerServiceRep, or system"
        preconditions:
          - "Manual: order in PLACED, BACKORDERED, ALLOCATED or PICKED (else ERR_ORDER_STATE_INVALID)"
        side_effects:
          - "All allocations released (lot units_available restored)"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /v1/shipment-orders/{id}/cancel, or system (ops run stale-order sweep)"
        actor: "WarehouseLead, CustomerServiceRep, or system"
        preconditions: ["Same as PLACED -> CANCELLED"]
        side_effects: ["Same as PLACED -> CANCELLED"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /v1/shipment-orders/{id}/cancel"
        actor: "WarehouseLead, CustomerServiceRep"
        preconditions: ["Same as PLACED -> CANCELLED"]
        side_effects: ["Same as PLACED -> CANCELLED"]
      - from: PICKED
        to: CANCELLED
        trigger: "POST /v1/shipment-orders/{id}/cancel"
        actor: "WarehouseLead, CustomerServiceRep"
        preconditions: ["Same as PLACED -> CANCELLED"]
        side_effects: ["Same as PLACED -> CANCELLED"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: label-review-submit-stale-formula
    parent_entity: Formula
    write_endpoint: "POST /v1/formulas/{id}/submit-label-review"
    occ_field: expected_formula_version
    description: |
      Submitting a label review against a Formula whose version has advanced
      since the client last observed it is rejected. A prior successful submit
      legitimately supersedes the previous PENDING review and bumps
      formula.version, so the second writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: run-schedule-stale-run
    parent_entity: ProductionRun
    write_endpoint: "POST /v1/production-runs/{id}/schedule"
    occ_field: expected_production_run_version
    description: |
      Scheduling (or re-scheduling from BLOCKED_SUPPLY) a ProductionRun whose
      version has advanced since the client last observed it is rejected. A
      prior schedule legitimately supersedes the old booking (batch link,
      container reservation, line window) and bumps run.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-allocate-stale-order
    parent_entity: ShipmentOrder
    write_endpoint: "POST /v1/shipment-orders/{id}/allocate"
    occ_field: expected_shipment_order_version
    description: |
      Allocating (or topping up) a ShipmentOrder whose version has advanced
      since the client last observed it is rejected. A prior allocation
      legitimately supersedes the order's allocation set and bumps
      order.version, so a second allocate carrying the old version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: brix_adjustment
    trigger: "POST /v1/batches/{id}/apply-adjustment (batch in QA_FAILED with out-of-tolerance measured_brix)"
    algorithm: constraint_propagation
    formula: |
      diff = measured_brix - formula.target_brix
      if abs(diff) <= formula.brix_tolerance:              # inclusive band
          adjustment = 0 (rejected upstream as ERR_NOTHING_TO_ADJUST)
      elif diff > 0:                                        # too sweet -> dilute with water TO TARGET (not to band edge)
          addition = quantity_liters * diff / formula.target_brix
          added_water_liters += addition
      else:                                                 # too thin -> concentrate TO TARGET
          addition = quantity_liters * (formula.target_brix - measured_brix) / (formula.concentrate_brix - formula.target_brix)
          added_concentrate_liters += addition
      Feasibility gate (before applying): quantity_liters + addition <= tank.capacity_liters,
      else reject with ERR_ADJUSTMENT_EXCEEDS_TANK_CAPACITY (no partial addition).
      On success: quantity_liters += addition; adjustment_count += 1.
      mass-balance invariant: quantity_liters == initial_quantity_liters + added_water_liters + added_concentrate_liters
    input_set: "the batch in QA_FAILED, its formula, its tank"
    constants:
      REBLEND_LIMIT: 2
    precision: "addition rounded to 0.1 liter, round_half_up, BEFORE the capacity gate"
    variants:
      - name: dilution_branch
        when: "measured_brix > target_brix + brix_tolerance"
        difference: "adds water; numerator uses (measured - target), denominator target_brix"
      - name: concentration_branch
        when: "measured_brix < target_brix - brix_tolerance"
        difference: "adds concentrate; denominator (concentrate_brix - target_brix) — different divisor, different magnitude"

  - name: process_validation
    trigger: "POST /v1/process-runs/{id}/complete"
    algorithm: threshold
    formula: |
      PASTEURIZATION (uses min_temp_c, time_below_setpoint_seconds):
        if min_temp_c >= setpoint_temp_c AND time_below_setpoint_seconds == 0:  VALIDATED, deviation NONE
        elif min_temp_c >= setpoint_temp_c - 2.0 AND time_below_setpoint_seconds <= 60:  DEVIATED, deviation MINOR
        else:  DEVIATED, deviation MAJOR
      HPP (uses min_pressure_mpa, pressure_hold_shortfall_seconds):
        if min_pressure_mpa >= setpoint_pressure_mpa AND pressure_hold_shortfall_seconds == 0:  VALIDATED, deviation NONE
        elif min_pressure_mpa >= setpoint_pressure_mpa - 20 AND pressure_hold_shortfall_seconds <= 30:  DEVIATED, deviation MINOR
        else:  DEVIATED, deviation MAJOR
      All boundaries inclusive as written (>=, <=).
    input_set: "the RUNNING process run; readings supplied at complete"
    constants:
      PASTE_MINOR_TEMP_DROP_C: 2.0
      PASTE_MINOR_TIME_S: 60
      HPP_MINOR_PRESSURE_DROP_MPA: 20
      HPP_MINOR_TIME_S: 30
    precision: "exact numeric comparison; no rounding"

  - name: changeover_matrix
    trigger: "POST /v1/production-runs/{id}/schedule — line-window conflict evaluation"
    algorithm: threshold
    formula: |
      changeover_minutes(E -> N) =
          (15 if E.container_type == N.container_type else 90)
        + (60 if E.allergen_group != "NONE" AND E.allergen_group != N.allergen_group else 0)
      where E.allergen_group = allergen of E's formula, N likewise.
      NOTE the asymmetry: washing OUT of an allergen run costs +60, but starting an
      allergen run after a NONE run costs +0.
      Line conflict rule (half-open windows [start, end)): new run N conflicts with
      existing run E (production_status in {SCHEDULED, IN_PRODUCTION}) on the same line unless
          N.scheduled_end_at   + changeover(N -> E) minutes <= E.scheduled_start_at
       OR E.scheduled_end_at   + changeover(E -> N) minutes <= N.scheduled_start_at
      Equality is allowed (the buffer minute itself is free).
    input_set: "ProductionRuns on the same BottlingLine in SCHEDULED or IN_PRODUCTION"
    constants:
      CHANGEOVER_SAME_CONTAINER_MIN: 15
      CHANGEOVER_DIFF_CONTAINER_MIN: 90
      CHANGEOVER_ALLERGEN_WASHOUT_MIN: 60
    precision: "whole minutes; datetimes compared at minute granularity"

  - name: tank_occupancy
    trigger: "POST /v1/batches — tank-window conflict evaluation"
    algorithm: interval_merge
    formula: |
      Tank occupation windows are CLOSED intervals [planned_start_at, planned_end_at].
      A new batch N conflicts with an occupying batch E (status in
      {PLANNED, BLENDING, AWAITING_QA, QA_PASSED, QA_FAILED, PROCESSING}) on the same tank unless
          N.planned_end_at   + TANK_GAP_HOURS hours <= E.planned_start_at
       OR E.planned_end_at   + TANK_GAP_HOURS hours <= N.planned_start_at
      Equality is allowed (a gap of exactly TANK_GAP_HOURS suffices).
      Batches in PROCESSED/RELEASED/CONDEMNED/CONSUMED no longer occupy the tank.
      Different interval semantics from changeover_matrix: closed windows + flat gap,
      versus half-open windows + directional changeover matrix on lines.
    input_set: "occupying batches on the same tank"
    constants:
      TANK_GAP_HOURS: 3
    precision: "datetimes compared at minute granularity"

  - name: yield_and_giveaway
    trigger: "POST /v1/production-runs/{id}/complete"
    algorithm: aggregation
    formula: |
      theoretical_units   = floor(batch.processed_liters * 1000 / formula.container_fill_ml)   # floor, pinned
      Gate: 1 <= actual_units_filled <= min(theoretical_units, ceil(planned_units * 1.05))
      giveaway_liters     = max(0, avg_fill_ml - formula.container_fill_ml) * actual_units_filled / 1000
      cases               = actual_units_filled // UNITS_PER_CASE          # floor per run FIRST
      billable_units      = cases * UNITS_PER_CASE                          # THEN scale back — pinned order:
                                                                            # round-per-case-then-sum, never sum-then-round
      pallet_count        = ceil(actual_units_filled / UNITS_PER_PALLET[container_type])
    input_set: "the IN_PRODUCTION run, its linked CONSUMED-to-be batch, its formula"
    constants:
      UNITS_PER_CASE: 12
      UPP_GLASS_355: 2016
      UPP_PET_473: 1440
      UPP_PET_1000: 960
      UPP_CAN_330: 2880
      CONTAINER_RESERVE_OVERAGE_PCT: 0.05
    precision: "giveaway_liters 1 dp round_half_up; units are integers"

  - name: invoice_calculation
    trigger: "provisional: run complete; final: POST /v1/production-runs/{id}/finalize-invoice"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER (pinned — later steps read earlier results):
        1. billable_units            (from yield_and_giveaway: case-floor first)
        2. provisional_invoice_cents = billable_units * unit_price_cents                 (at complete)
        3. giveaway_deduction_cents  = round_half_up(giveaway_liters * GIVEAWAY_RATE_CENTS_PER_LITER)
        4. final_invoice_cents       = provisional_invoice_cents - giveaway_deduction_cents   (at finalize)
      Ledger posting:
        at complete: customer.outstanding_balance_cents += provisional_invoice_cents
        at finalize: customer.outstanding_balance_cents += (final_invoice_cents - provisional_invoice_cents)
      The two variants legitimately differ for identical fill data whenever giveaway_liters > 0.
    input_set: "the COMPLETED run"
    constants:
      GIVEAWAY_RATE_CENTS_PER_LITER: 140
    precision: "integers (cents); round_half_up at the giveaway deduction step only"
    variants:
      - name: provisional_invoice
        when: "computed at run completion"
        difference: "no giveaway deduction: billable_units * unit_price_cents"
      - name: final_invoice
        when: "computed at finalize-invoice"
        difference: "subtracts giveaway_deduction_cents; ledger receives only the delta"

  - name: shelf_life_expiry
    trigger: "FinishedGoodLot creation (both variants stored); allocation and ops-run sweeps read them"
    algorithm: forward_looking
    formula: |
      expiry_label_date     = production_date + formula.shelf_life_days
      expiry_stability_date = production_date + floor(formula.shelf_life_days * 1.5)   if process_type == HPP
                              production_date + formula.shelf_life_days - 7            if process_type == PASTEURIZATION
      effective_expiry(channel) = expiry_stability_date if channel == EXPORT else expiry_label_date
      Physical expiry (ops-run sweep) ALWAYS uses expiry_label_date:
      lot EXPIRED when current logical date >= expiry_label_date (equality expires).
    input_set: "the FinishedGoodLot and its formula"
    constants:
      HPP_SHELF_LIFE_FACTOR: 1.5
      PASTE_SHELF_LIFE_DELTA_DAYS: -7
    precision: "calendar-day arithmetic on YYYY-MM-DD dates"
    variants:
      - name: label_claim_expiry
        when: "DIRECT_RETAIL, CLUB, FOODSERVICE channels; physical expiry sweep"
        difference: "raw shelf_life_days"
      - name: stability_adjusted_expiry
        when: "EXPORT channel eligibility only"
        difference: "HPP multiplies by 1.5 (floor); PASTEURIZATION subtracts 7 — same lot yields a different eligibility verdict"

  - name: fefo_allocation
    trigger: "POST /v1/shipment-orders/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      Eligible lots (all conditions):
        lot.formula_id == order.formula_id AND lot.customer_id == order.customer_id
        AND lot.status == AVAILABLE AND lot.units_available > 0
        AND (effective_expiry(order.channel) - order.requested_delivery_date).days >= order.min_shelf_life_days
      Ranking: effective_expiry(order.channel) ASC; tie-break lot.created_at ASC.
      Waterfall: take min(lot.units_available, remaining) from each lot in rank order
      until remaining == 0 or the eligible set is exhausted; existing allocations are kept.
      Outcome: status = ALLOCATED iff allocated_units == units_requested afterwards, else BACKORDERED.
      Empty eligible set is NOT an error: the order simply sits in BACKORDERED.
    input_set: "FinishedGoodLots of the same customer+formula"
    constants:
      MIN_SHELF_DIRECT_RETAIL: 30
      MIN_SHELF_CLUB: 45
      MIN_SHELF_FOODSERVICE: 21
      MIN_SHELF_EXPORT: 60
    precision: "calendar-day arithmetic; integer units"

  - name: pallet_ledger
    trigger: "shipment-order ship (SHIP), pallet return (RETURN), ops run aging (CONVERSION)"
    algorithm: chronological
    formula: |
      Posting order is chronological by entry_date then created_at; running balances follow entries.
      SHIP (at ship):       pallets_out_total += p; escrow += p * deposit; outstanding += p * deposit
      RETURN (at return):   precondition r <= pallets_outstanding (else ERR_PALLET_RETURN_EXCEEDS_OUTSTANDING);
                            pallets_returned_total += r; escrow -= r * deposit; outstanding -= r * deposit
      CONVERSION (ops run): walk SHIP entries oldest-first (entry_date ASC, created_at ASC),
                            net RETURNs FIFO against them; any SHIP entry with net outstanding > 0
                            and age >= 30 days (entry_date <= current_date - 30; equality converts)
                            posts CONVERSION for its net count c:
                            pallets_converted_total += c; escrow -= c * deposit; outstanding UNCHANGED
                            (deposit forfeited — already collected at ship).
      Conserved invariant: pallets_outstanding == pallets_out_total - pallets_returned_total - pallets_converted_total
                           AND escrow_balance_cents == pallets_outstanding * customer.pallet_deposit_cents
    input_set: "PalletEntries of the customer's PalletAccount"
    constants:
      PALLET_AGING_DAYS: 30
    precision: "integers; calendar-day arithmetic"

  - name: container_reservation
    trigger: "run schedule (reserve), run complete (consume + release remainder), run cancel / block (release)"
    algorithm: waterfall_allocation
    formula: |
      reserve_units = ceil(planned_units * 1.05)                        # overage allowance, ceiling pinned
      Reserve: QC_PASSED ContainerLots of the run's container_type, ordered created_at ASC;
      take min(lot.quantity_available, still_needed) per lot until reserve_units satisfied;
      if the whole pool is short -> ERR_CONTAINER_SUPPLY_INSUFFICIENT, nothing reserved (atomic).
      Consume (at complete): actual_units_filled consumed FIFO in the same created_at ASC order;
      the unconsumed reserved balance is released in the same request.
      Release (cancel / BLOCKED_SUPPLY cascade): entire reserved balance released.
      Conserved invariant per lot: quantity_received == quantity_available + quantity_reserved + quantity_consumed
    input_set: "ContainerLots of the run's container_type in QC_PASSED"
    constants:
      CONTAINER_RESERVE_OVERAGE_PCT: 0.05
    precision: "integer units; ceiling for the overage"

  - name: credit_sweep
    trigger: "POST /v1/ops-runs"
    algorithm: threshold
    formula: |
      For each CustomerAccount in ACTIVE:
        if outstanding_balance_cents > credit_limit_cents:   # strictly greater; equality does NOT suspend
            status -> SUSPENDED
      Stale-order sweep: ShipmentOrders in PLACED or BACKORDERED with
        requested_delivery_date + 7 days < current logical date  (strictly later; equality keeps)
        -> CANCELLED (allocations released).
      Lot expiry sweep: per shelf_life_expiry (label variant, equality expires).
    input_set: "all ACTIVE customers; all PLACED/BACKORDERED orders; all AVAILABLE lots"
    constants:
      REACTIVATION_RATIO: 0.8
      STALE_ORDER_GRACE_DAYS: 7
    precision: "integer cents; calendar days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins on dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role must be listed on the endpoint; CustomerContact may only act on its own customer_id (X-User-ID == customer_id)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/formulas/{id}/submit-label-review, POST /v1/production-runs/{id}/schedule, POST /v1/shipment-orders/{id}/allocate"
  - priority: 5
    category: state
    check: "Target entity (and cross-entity gates such as customer ACTIVE) must be in the required state for the transition"
    error_id: "ERR_{ENTITY}_STATE_INVALID | ERR_CUSTOMER_NOT_ACTIVE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Label/QA safety gates: formula label APPROVED at confirm/schedule; label_version_pinned current at start; SoD on QA verdicts/dispositions/releases and label reviews; governing process run VALIDATED or DISPOSITION_RELEASED at batch release; brix within inclusive tolerance for QA PASS"
    error_id: "ERR_LABEL_NOT_APPROVED | ERR_LABEL_VERSION_STALE | ERR_SOD_QA_SELF_APPROVAL | ERR_SOD_LABEL_SELF_REVIEW | ERR_PROCESS_NOT_VALIDATED | ERR_BRIX_OUT_OF_TOLERANCE"
    http_status: 409
    applies_to: "confirm, schedule, start, qa-verdict, qa-disposition, release, label-review approve/reject"
  - priority: 7
    category: business_referential
    check: "Referenced entities must be in a linkable state: batch RELEASED and unlinked and of the run's formula at schedule; container lot QC_PASSED for reservation; QC_FAILED with zero reserved/consumed for return"
    error_id: "ERR_BATCH_NOT_RELEASED | ERR_BATCH_ALREADY_LINKED"
    http_status: 409
    applies_to: "schedule, container-lot return"
  - priority: 8
    category: business_constraint
    check: "Structural constraints: window end > start; quantity within tank capacity and >= 500 L; tank-window gap (closed + 3h); line-window changeover (half-open + directional buffer); line supports container type; minimum run (inclusive); reblend limit (count < 2); adjustment fits tank; fill count within min(theoretical, reserved); zone temperature rule; zone pallet capacity (inclusive); container supply >= ceil(planned * 1.05); payment 0 < amount <= outstanding"
    error_id: "ERR_INVALID_WINDOW | ERR_TANK_CAPACITY_EXCEEDED | ERR_BATCH_TOO_SMALL | ERR_TANK_WINDOW_CONFLICT | ERR_LINE_WINDOW_CONFLICT | ERR_LINE_UNSUPPORTED_CONTAINER | ERR_MINIMUM_RUN_NOT_MET | ERR_REBLEND_LIMIT_EXCEEDED | ERR_ADJUSTMENT_EXCEEDS_TANK_CAPACITY | ERR_FILL_COUNT_EXCEEDS_THEORETICAL | ERR_ZONE_TEMPERATURE_MISMATCH | ERR_ZONE_CAPACITY_EXCEEDED | ERR_CONTAINER_SUPPLY_INSUFFICIENT | ERR_PAYMENT_INVALID_AMOUNT | ERR_FORMULA_CUSTOMER_MISMATCH"
    http_status: 422
    applies_to: "create/schedule/complete/payment endpoints"
  - priority: 9
    category: business_temporal
    check: "Clock-relative gates: complete-cip requires clock >= cip_started_at + cip_required_hours (equality allowed); run start requires clock in [scheduled_start_at, scheduled_end_at); requested_delivery_date >= current logical date; clock never moves backwards"
    error_id: "ERR_CIP_DURATION_INSUFFICIENT | ERR_RUN_WINDOW_NOT_ACTIVE | ERR_DELIVERY_DATE_IN_PAST | ERR_CLOCK_REGRESSION"
    http_status: 409
    applies_to: "complete-cip, run start, shipment-order create, clock set"
  - priority: 10
    category: business_fiscal
    check: "Money gates: reactivate requires outstanding <= floor(0.8 * credit_limit); pallet return count <= pallets_outstanding"
    error_id: "ERR_REACTIVATION_THRESHOLD_NOT_MET | ERR_PALLET_RETURN_EXCEEDS_OUTSTANDING"
    http_status: 409
    applies_to: "customer reactivate, pallet returns"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (never wall-clock). Rejects moving backwards (ERR_CLOCK_REGRESSION)."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["current_utc := to_iso8601 (must be >= previous value)"]

  # --- CustomerAccount ---
  - method: POST
    path: "/v1/customer-accounts"
    description: "Onboard a co-pack customer; auto-creates its PalletAccount"
    roles: [PlantManager]
    code: 201
    input: [name, credit_limit_cents, minimum_run_units, pallet_deposit_cents]
    output: CustomerAccount
    side_effects: ["status = PENDING_CREDIT; outstanding_balance_cents = 0; PalletAccount created with all counters 0"]
  - method: GET
    path: "/v1/customer-accounts"
    description: "List customers"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CustomerAccount[]"
    side_effects: []
  - method: GET
    path: "/v1/customer-accounts/{id}"
    description: "Get one customer"
    roles: [Any]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []
  - method: POST
    path: "/v1/customer-accounts/{id}/approve-credit"
    description: "PENDING_CREDIT -> ACTIVE"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/v1/customer-accounts/{id}/suspend"
    description: "ACTIVE -> SUSPENDED (manual credit hold)"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/v1/customer-accounts/{id}/reactivate"
    description: "SUSPENDED -> ACTIVE with 80% hysteresis gate"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> ACTIVE when outstanding <= floor(credit_limit * 0.8)"]
  - method: POST
    path: "/v1/customer-accounts/{id}/close"
    description: "ACTIVE/SUSPENDED -> CLOSED when no open work and zero pallet balance"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/v1/customer-accounts/{id}/payments"
    description: "Post a payment; reduces outstanding_balance_cents"
    roles: [FinanceClerk]
    code: 201
    input: [amount_cents]
    output: CustomerAccount
    side_effects: ["outstanding_balance_cents -= amount_cents (0 < amount <= outstanding)"]
  - method: GET
    path: "/v1/customer-accounts/{id}/production-runs"
    description: "Runs of a customer (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []
  - method: GET
    path: "/v1/customer-accounts/{id}/shipment-orders"
    description: "Shipment orders of a customer (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShipmentOrder[]"
    side_effects: []
  - method: GET
    path: "/v1/customer-accounts/{id}/pallet-account"
    description: "The customer's PalletAccount (array of 0-1)"
    roles: [Any]
    code: 200
    input: []
    output: "PalletAccount[]"
    side_effects: []

  # --- PalletAccount / PalletEntry ---
  - method: GET
    path: "/v1/pallet-accounts/{id}"
    description: "Get one pallet account"
    roles: [Any]
    code: 200
    input: []
    output: PalletAccount
    side_effects: []
  - method: POST
    path: "/v1/pallet-accounts/{id}/returns"
    description: "Record returned returnable pallets; credits escrow and outstanding"
    roles: [WarehouseLead]
    code: 201
    input: [pallet_count]
    output: PalletEntry
    side_effects: ["PalletEntry(RETURN) posted; escrow -= count * deposit; outstanding -= count * deposit"]
  - method: GET
    path: "/v1/pallet-accounts/{id}/entries"
    description: "Append-only pallet ledger entries (FK reverse), chronological"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PalletEntry[]"
    side_effects: []

  # --- Formula / LabelClaimReview ---
  - method: POST
    path: "/v1/formulas"
    description: "Register a formula for a customer"
    roles: [ProductDeveloper]
    code: 201
    input: [customer_id, formula_code, name, target_brix, brix_tolerance, process_type, container_fill_ml, concentrate_brix, allergen_group, shelf_life_days, claims]
    output: Formula
    side_effects: ["status = DRAFT; label_version = 0"]
  - method: GET
    path: "/v1/formulas"
    description: "List formulas (FK reverse for customer_id)"
    roles: [Any]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "Formula[]"
    side_effects: []
  - method: GET
    path: "/v1/formulas/{id}"
    description: "Get one formula"
    roles: [Any]
    code: 200
    input: []
    output: Formula
    side_effects: []
  - method: POST
    path: "/v1/formulas/{id}/submit-label-review"
    description: "Submit claims for compliance review; supersedes any PENDING review; OCC on formula version"
    roles: [ProductDeveloper]
    code: 201
    input: [expected_formula_version]
    output: LabelClaimReview
    side_effects: ["Formula -> LABEL_REVIEW; submitted_by_user_id stamped; prior PENDING review -> SUPERSEDED; formula.version += 1"]
  - method: POST
    path: "/v1/formulas/{id}/retire"
    description: "Retire a DRAFT/APPROVED formula with no open runs"
    roles: [ProductDeveloper]
    code: 200
    input: []
    output: Formula
    side_effects: ["status -> RETIRED"]
  - method: GET
    path: "/v1/formulas/{id}/label-reviews"
    description: "Reviews of a formula (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "LabelClaimReview[]"
    side_effects: []
  - method: GET
    path: "/v1/formulas/{id}/batches"
    description: "Batches of a formula (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Batch[]"
    side_effects: []
  - method: GET
    path: "/v1/label-reviews/{id}"
    description: "Get one label review"
    roles: [Any]
    code: 200
    input: []
    output: LabelClaimReview
    side_effects: []
  - method: POST
    path: "/v1/label-reviews/{id}/approve"
    description: "Approve claims; SoD vs submitter; bumps formula label_version"
    roles: [LabelComplianceReviewer]
    code: 200
    input: []
    output: LabelClaimReview
    side_effects: ["Review -> APPROVED; formula -> APPROVED, label_version += 1; BLOCKED_LABEL runs -> CONFIRMED"]
  - method: POST
    path: "/v1/label-reviews/{id}/reject"
    description: "Reject claims; SoD vs submitter; demotes CONFIRMED runs"
    roles: [LabelComplianceReviewer]
    code: 200
    input: ["review_note?"]
    output: LabelClaimReview
    side_effects: ["Review -> REJECTED; formula -> REVISION_REQUIRED; CONFIRMED runs of formula -> BLOCKED_LABEL"]

  # --- BlendingTank ---
  - method: POST
    path: "/v1/blending-tanks"
    description: "Register a blending tank"
    roles: [PlantManager]
    code: 201
    input: [tank_code, capacity_liters]
    output: BlendingTank
    side_effects: ["posture = AVAILABLE; allergen_group = NONE"]
  - method: GET
    path: "/v1/blending-tanks"
    description: "List tanks"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BlendingTank[]"
    side_effects: []
  - method: GET
    path: "/v1/blending-tanks/{id}"
    description: "Get one tank"
    roles: [Any]
    code: 200
    input: []
    output: BlendingTank
    side_effects: []
  - method: POST
    path: "/v1/blending-tanks/{id}/start-cip"
    description: "Begin clean-in-place; stamps cip_started_at and required hours"
    roles: [BlendOperator]
    code: 200
    input: []
    output: BlendingTank
    side_effects: ["posture AWAITING_CIP -> IN_CIP; cip_started_at = clock; cip_required_hours computed (6 allergen / 2 standard)"]
  - method: POST
    path: "/v1/blending-tanks/{id}/complete-cip"
    description: "Finish CIP after the required duration (equality allowed)"
    roles: [BlendOperator]
    code: 200
    input: []
    output: BlendingTank
    side_effects: ["posture IN_CIP -> AVAILABLE; allergen_group -> NONE"]
  - method: GET
    path: "/v1/blending-tanks/{id}/batches"
    description: "Batches in a tank (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Batch[]"
    side_effects: []

  # --- Batch ---
  - method: POST
    path: "/v1/batches"
    description: "Plan a blend batch into a tank window"
    roles: [BlendOperator]
    code: 201
    input: [formula_id, tank_id, planned_start_at, planned_end_at, quantity_liters]
    output: Batch
    side_effects: ["status = PLANNED; initial_quantity_liters = quantity_liters; tank AVAILABLE -> OCCUPIED, allergen_group := formula.allergen_group"]
  - method: GET
    path: "/v1/batches"
    description: "List batches (FK reverse for formula_id / tank_id)"
    roles: [Any]
    code: 200
    input: ["formula_id?", "tank_id?", "status?", "limit?", "offset?"]
    output: "Batch[]"
    side_effects: []
  - method: GET
    path: "/v1/batches/{id}"
    description: "Get one batch"
    roles: [Any]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: POST
    path: "/v1/batches/{id}/start-blend"
    description: "PLANNED -> BLENDING"
    roles: [BlendOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> BLENDING"]
  - method: POST
    path: "/v1/batches/{id}/record-blend"
    description: "Record measured brix; BLENDING -> AWAITING_QA; stamps blended_by_user_id"
    roles: [BlendOperator]
    code: 200
    input: [measured_brix]
    output: Batch
    side_effects: ["status -> AWAITING_QA; blended_by_user_id = caller"]
  - method: POST
    path: "/v1/batches/{id}/qa-verdict"
    description: "QA pass/fail; SoD vs blended_by; PASS requires brix within inclusive tolerance"
    roles: [QAInspector]
    code: 200
    input: [verdict]
    output: Batch
    side_effects: ["status -> QA_PASSED or QA_FAILED"]
  - method: POST
    path: "/v1/batches/{id}/apply-adjustment"
    description: "Apply computed brix correction; QA_FAILED -> BLENDING; max 2 adjustments"
    roles: [BlendOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["brix_adjustment applied; adjustment_count += 1; status -> BLENDING"]
  - method: POST
    path: "/v1/batches/{id}/condemn"
    description: "Condemn from QA_FAILED, PROCESSED or RELEASED; full cascade (process abort, run block, container release, window free)"
    roles: [QAInspector]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> CONDEMNED; cascade per Batch state machine"]
  - method: POST
    path: "/v1/batches/{id}/release"
    description: "PROCESSED/PROCESSING -> RELEASED; from PROCESSING requires governing process run VALIDATED or DISPOSITION_RELEASED; SoD"
    roles: [QAInspector]
    code: 200
    input: []
    output: Batch
    side_effects: ["status -> RELEASED"]
  - method: GET
    path: "/v1/batches/{id}/process-runs"
    description: "Process runs of a batch (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProcessRun[]"
    side_effects: []
  - method: GET
    path: "/v1/batches/{id}/production-runs"
    description: "Production runs linked to a batch (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []

  # --- ProcessRun ---
  - method: POST
    path: "/v1/process-runs"
    description: "Schedule a pasteurization/HPP run for a QA_PASSED batch; one active run per batch"
    roles: [BlendOperator]
    code: 201
    input: [batch_id, "setpoint_temp_c?", "setpoint_hold_seconds?", "setpoint_pressure_mpa?", "setpoint_pressure_hold_seconds?"]
    output: ProcessRun
    side_effects: ["status = SCHEDULED; process_type copied from formula; batch must be QA_PASSED with no SCHEDULED/RUNNING sibling (else ERR_PROCESS_RUN_ACTIVE_EXISTS)"]
  - method: GET
    path: "/v1/process-runs/{id}"
    description: "Get one process run"
    roles: [Any]
    code: 200
    input: []
    output: ProcessRun
    side_effects: []
  - method: POST
    path: "/v1/process-runs/{id}/start"
    description: "SCHEDULED -> RUNNING; batch -> PROCESSING; tank freed to AWAITING_CIP"
    roles: [BlendOperator]
    code: 200
    input: []
    output: ProcessRun
    side_effects: ["Batch QA_PASSED -> PROCESSING; tank OCCUPIED -> AWAITING_CIP"]
  - method: POST
    path: "/v1/process-runs/{id}/complete"
    description: "Record readings; VALIDATED or DEVIATED per process_validation"
    roles: [BlendOperator]
    code: 200
    input: ["min_temp_c?", "time_below_setpoint_seconds?", "min_pressure_mpa?", "pressure_hold_shortfall_seconds?"]
    output: ProcessRun
    side_effects: ["VALIDATED -> batch PROCESSED (loss computed); DEVIATED -> batch stays PROCESSING"]
  - method: POST
    path: "/v1/process-runs/{id}/abort"
    description: "Abort a SCHEDULED/RUNNING run; batch returns to QA_PASSED"
    roles: [BlendOperator]
    code: 200
    input: []
    output: ProcessRun
    side_effects: ["status -> ABORTED; batch PROCESSING -> QA_PASSED if it was running"]
  - method: POST
    path: "/v1/process-runs/{id}/qa-disposition"
    description: "QA disposition of a DEVIATED run; SoD vs blended_by"
    roles: [QAInspector]
    code: 200
    input: [disposition]
    output: ProcessRun
    side_effects: ["RELEASE -> batch PROCESSED; REJECT -> batch CONDEMNED + condemn cascade"]

  # --- ContainerLot ---
  - method: POST
    path: "/v1/container-lots"
    description: "Receive a container lot"
    roles: [WarehouseLead]
    code: 201
    input: [container_type, quantity_received, supplier_lot_code]
    output: ContainerLot
    side_effects: ["status = RECEIVED; available = received, reserved = consumed = 0"]
  - method: GET
    path: "/v1/container-lots"
    description: "List container lots"
    roles: [Any]
    code: 200
    input: ["container_type?", "status?", "limit?", "offset?"]
    output: "ContainerLot[]"
    side_effects: []
  - method: GET
    path: "/v1/container-lots/{id}"
    description: "Get one container lot"
    roles: [Any]
    code: 200
    input: []
    output: ContainerLot
    side_effects: []
  - method: POST
    path: "/v1/container-lots/{id}/qc-verdict"
    description: "QC pass/fail on a received lot"
    roles: [QAInspector]
    code: 200
    input: [verdict]
    output: ContainerLot
    side_effects: ["status -> QC_PASSED or QC_FAILED"]
  - method: POST
    path: "/v1/container-lots/{id}/return"
    description: "Return a full QC_FAILED lot to the supplier"
    roles: [WarehouseLead]
    code: 200
    input: []
    output: ContainerLot
    side_effects: ["status -> RETURNED"]

  # --- BottlingLine ---
  - method: POST
    path: "/v1/bottling-lines"
    description: "Register a bottling line"
    roles: [PlantManager]
    code: 201
    input: [line_code, supported_container_types, nominal_cpm]
    output: BottlingLine
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/v1/bottling-lines"
    description: "List lines"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BottlingLine[]"
    side_effects: []
  - method: GET
    path: "/v1/bottling-lines/{id}"
    description: "Get one line"
    roles: [Any]
    code: 200
    input: []
    output: BottlingLine
    side_effects: []
  - method: POST
    path: "/v1/bottling-lines/{id}/set-maintenance"
    description: "ACTIVE -> MAINTENANCE; blocked while runs are SCHEDULED/IN_PRODUCTION"
    roles: [PlantManager]
    code: 200
    input: []
    output: BottlingLine
    side_effects: ["status -> MAINTENANCE"]
  - method: POST
    path: "/v1/bottling-lines/{id}/set-active"
    description: "MAINTENANCE -> ACTIVE"
    roles: [PlantManager]
    code: 200
    input: []
    output: BottlingLine
    side_effects: ["status -> ACTIVE"]
  - method: GET
    path: "/v1/bottling-lines/{id}/production-runs"
    description: "Runs booked on a line (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []

  # --- ProductionRun ---
  - method: POST
    path: "/v1/production-runs"
    description: "Quote a co-pack production run"
    roles: [ProductionPlanner]
    code: 201
    input: [customer_id, formula_id, container_type, planned_units, unit_price_cents]
    output: ProductionRun
    side_effects: ["production_status = QUOTED; invoice_status = NOT_INVOICED; formula.customer_id must equal customer_id (ERR_FORMULA_CUSTOMER_MISMATCH)"]
  - method: GET
    path: "/v1/production-runs"
    description: "List production runs (FK reverse for formula_id)"
    roles: [Any]
    code: 200
    input: ["customer_id?", "formula_id?", "production_status?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []
  - method: GET
    path: "/v1/production-runs/{id}"
    description: "Get one production run"
    roles: [Any]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: POST
    path: "/v1/production-runs/{id}/confirm"
    description: "QUOTED -> CONFIRMED; customer/label/minimum-run gates"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["production_status -> CONFIRMED"]
  - method: POST
    path: "/v1/production-runs/{id}/schedule"
    description: "CONFIRMED/BLOCKED_SUPPLY -> SCHEDULED; OCC; pins label version; links batch; reserves containers; books line window"
    roles: [ProductionPlanner]
    code: 200
    input: [batch_id, line_id, scheduled_start_at, scheduled_end_at, expected_production_run_version]
    output: ProductionRun
    side_effects: ["label_version_pinned := formula.label_version; container FIFO reservation; batch.linked_run_id set; increments ProductionRun.version by 1"]
  - method: POST
    path: "/v1/production-runs/{id}/start"
    description: "SCHEDULED -> IN_PRODUCTION; clock must be inside the half-open window; pinned label version must still be current"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["production_status -> IN_PRODUCTION"]
  - method: POST
    path: "/v1/production-runs/{id}/complete"
    description: "IN_PRODUCTION -> COMPLETED; computes yield/giveaway/billable; creates FinishedGoodLot; consumes containers; posts provisional invoice"
    roles: [ProductionPlanner]
    code: 200
    input: [actual_units_filled, avg_fill_ml, warehouse_zone_id]
    output: ProductionRun
    side_effects: ["yield_and_giveaway + invoice_calculation(provisional); FinishedGoodLot created; batch -> CONSUMED; invoice_status -> PROVISIONAL; customer.outstanding += provisional_invoice_cents"]
  - method: POST
    path: "/v1/production-runs/{id}/finalize-invoice"
    description: "invoice PROVISIONAL -> FINAL; posts only the giveaway delta"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["final_invoice_cents computed; customer.outstanding += (final - provisional)"]
  - method: POST
    path: "/v1/production-runs/{id}/cancel"
    description: "Cancel from any non-terminal production state; compensating release of batch/containers/window"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["production_status -> CANCELLED; reservations released; batch link cleared; window freed"]
  - method: GET
    path: "/v1/production-runs/{id}/finished-good-lots"
    description: "Finished lots produced by a run (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FinishedGoodLot[]"
    side_effects: []

  # --- FinishedGoodLot / WarehouseZone ---
  - method: GET
    path: "/v1/finished-good-lots"
    description: "List finished lots (FK reverse for formula_id / customer_id)"
    roles: [Any]
    code: 200
    input: ["formula_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: "FinishedGoodLot[]"
    side_effects: []
  - method: GET
    path: "/v1/finished-good-lots/{id}"
    description: "Get one finished lot"
    roles: [Any]
    code: 200
    input: []
    output: FinishedGoodLot
    side_effects: []
  - method: POST
    path: "/v1/finished-good-lots/{id}/recall"
    description: "Recall an AVAILABLE/EXPIRED lot; de-allocates from open orders (demote to BACKORDERED)"
    roles: [QAInspector]
    code: 200
    input: []
    output: FinishedGoodLot
    side_effects: ["status -> RECALLED; allocation-removal cascade"]
  - method: POST
    path: "/v1/warehouse-zones"
    description: "Register a warehouse zone"
    roles: [PlantManager]
    code: 201
    input: [zone_code, temperature_class, pallet_capacity]
    output: WarehouseZone
    side_effects: ["pallets_stored = 0"]
  - method: GET
    path: "/v1/warehouse-zones"
    description: "List zones"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "WarehouseZone[]"
    side_effects: []
  - method: GET
    path: "/v1/warehouse-zones/{id}"
    description: "Get one zone"
    roles: [Any]
    code: 200
    input: []
    output: WarehouseZone
    side_effects: []
  - method: GET
    path: "/v1/warehouse-zones/{id}/finished-good-lots"
    description: "Lots stored in a zone (FK reverse)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FinishedGoodLot[]"
    side_effects: []

  # --- ShipmentOrder ---
  - method: POST
    path: "/v1/shipment-orders"
    description: "Place a distribution order; CustomerContact may only place for its own customer_id"
    roles: [CustomerContact, CustomerServiceRep]
    code: 201
    input: [customer_id, formula_id, channel, requested_delivery_date, units_requested]
    output: ShipmentOrder
    side_effects: ["status = PLACED; min_shelf_life_days derived from channel; customer must be ACTIVE (ERR_CUSTOMER_NOT_ACTIVE); delivery date not in the past (ERR_DELIVERY_DATE_IN_PAST)"]
  - method: GET
    path: "/v1/shipment-orders"
    description: "List shipment orders (FK reverse for formula_id)"
    roles: [Any]
    code: 200
    input: ["customer_id?", "formula_id?", "status?", "limit?", "offset?"]
    output: "ShipmentOrder[]"
    side_effects: []
  - method: GET
    path: "/v1/shipment-orders/{id}"
    description: "Get one shipment order"
    roles: [Any]
    code: 200
    input: []
    output: ShipmentOrder
    side_effects: []
  - method: POST
    path: "/v1/shipment-orders/{id}/allocate"
    description: "FEFO allocate (or top up) eligible lots; OCC on order version"
    roles: [WarehouseLead]
    code: 200
    input: [expected_shipment_order_version]
    output: ShipmentOrder
    side_effects: ["fefo_allocation; status -> ALLOCATED or BACKORDERED; increments ShipmentOrder.version by 1"]
  - method: POST
    path: "/v1/shipment-orders/{id}/pick"
    description: "ALLOCATED -> PICKED"
    roles: [WarehouseLead]
    code: 200
    input: []
    output: ShipmentOrder
    side_effects: ["status -> PICKED"]
  - method: POST
    path: "/v1/shipment-orders/{id}/ship"
    description: "PICKED -> SHIPPED; posts pallet SHIP entry, charges escrow into outstanding, frees warehouse pallets"
    roles: [WarehouseLead]
    code: 200
    input: []
    output: ShipmentOrder
    side_effects: ["pallet_ledger SHIP posting; lot units_shipped updated; zone pallets_stored recomputed"]
  - method: POST
    path: "/v1/shipment-orders/{id}/cancel"
    description: "Cancel an open order; releases allocations"
    roles: [WarehouseLead, CustomerServiceRep]
    code: 200
    input: []
    output: ShipmentOrder
    side_effects: ["status -> CANCELLED; allocations released"]

  # --- Ops run (epoch advance) ---
  - method: POST
    path: "/v1/ops-runs"
    description: "Run the housekeeping epoch: lot expiry sweep (+ order demotion cascade), customer credit sweep, pallet aging conversion, stale-order cancellation"
    roles: [PlantManager]
    code: 201
    input: []
    output: OpsRun
    side_effects: ["credit_sweep; shelf_life_expiry sweep; pallet_ledger conversions; stale-order cancellations; counts recorded on the OpsRun"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed on endpoint; or CustomerContact acting on a customer_id != X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, wrong type, or invalid enum member" }
  # --- existence ---
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "CustomerAccount id not found" }
  - { id: ERR_FORMULA_NOT_FOUND, http: 404, condition: "Formula id not found" }
  - { id: ERR_LABEL_REVIEW_NOT_FOUND, http: 404, condition: "LabelClaimReview id not found" }
  - { id: ERR_TANK_NOT_FOUND, http: 404, condition: "BlendingTank id not found" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "Batch id not found" }
  - { id: ERR_PROCESS_RUN_NOT_FOUND, http: 404, condition: "ProcessRun id not found" }
  - { id: ERR_CONTAINER_LOT_NOT_FOUND, http: 404, condition: "ContainerLot id not found" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "BottlingLine id not found" }
  - { id: ERR_PRODUCTION_RUN_NOT_FOUND, http: 404, condition: "ProductionRun id not found" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "FinishedGoodLot id not found" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "WarehouseZone id not found" }
  - { id: ERR_SHIPMENT_ORDER_NOT_FOUND, http: 404, condition: "ShipmentOrder id not found" }
  - { id: ERR_PALLET_ACCOUNT_NOT_FOUND, http: 404, condition: "PalletAccount id not found" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version != current parent version (OCC)" }
  # --- state ---
  - { id: ERR_CUSTOMER_STATE_INVALID, http: 409, condition: "Customer transition precondition failed (wrong state, open work, or pallet balance on close)" }
  - { id: ERR_CUSTOMER_NOT_ACTIVE, http: 409, condition: "Cross-entity gate: customer must be ACTIVE for run confirm / order placement / allocation" }
  - { id: ERR_FORMULA_STATE_INVALID, http: 409, condition: "Formula transition precondition failed (incl. retire with open runs)" }
  - { id: ERR_REVIEW_STATE_INVALID, http: 409, condition: "Label review not in PENDING for approve/reject" }
  - { id: ERR_TANK_STATE_INVALID, http: 409, condition: "Tank posture gate failed (batch create, start-cip, complete-cip, start-blend)" }
  - { id: ERR_BATCH_STATE_INVALID, http: 409, condition: "Batch transition precondition failed" }
  - { id: ERR_PROCESS_RUN_STATE_INVALID, http: 409, condition: "ProcessRun transition precondition failed" }
  - { id: ERR_PROCESS_RUN_ACTIVE_EXISTS, http: 409, condition: "Batch already has a SCHEDULED or RUNNING process run" }
  - { id: ERR_CONTAINER_LOT_STATE_INVALID, http: 409, condition: "ContainerLot transition precondition failed" }
  - { id: ERR_LINE_STATE_INVALID, http: 409, condition: "Line transition precondition failed; or line in MAINTENANCE for schedule/start; or set-maintenance with open runs" }
  - { id: ERR_RUN_STATE_INVALID, http: 409, condition: "ProductionRun transition precondition failed (either parallel dimension)" }
  - { id: ERR_LOT_STATE_INVALID, http: 409, condition: "FinishedGoodLot transition precondition failed" }
  - { id: ERR_ORDER_STATE_INVALID, http: 409, condition: "ShipmentOrder transition precondition failed" }
  # --- safety / compliance ---
  - { id: ERR_LABEL_NOT_APPROVED, http: 409, condition: "Formula not in APPROVED at run confirm/schedule" }
  - { id: ERR_LABEL_VERSION_STALE, http: 409, condition: "label_version_pinned != formula.label_version at run start" }
  - { id: ERR_SOD_QA_SELF_APPROVAL, http: 403, condition: "QA actor X-User-ID equals batch.blended_by_user_id" }
  - { id: ERR_SOD_LABEL_SELF_REVIEW, http: 403, condition: "Label reviewer X-User-ID equals formula.submitted_by_user_id" }
  - { id: ERR_PROCESS_NOT_VALIDATED, http: 409, condition: "Batch release requires governing process run VALIDATED or DISPOSITION_RELEASED" }
  - { id: ERR_BRIX_OUT_OF_TOLERANCE, http: 409, condition: "QA PASS attempted while |measured - target| > tolerance" }
  # --- referential ---
  - { id: ERR_BATCH_NOT_RELEASED, http: 409, condition: "Schedule requires batch in RELEASED and of the run's formula" }
  - { id: ERR_BATCH_ALREADY_LINKED, http: 409, condition: "Batch already linked to another non-terminal run" }
  # --- constraint ---
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "end_at must be strictly after start_at (tank or line window)" }
  - { id: ERR_TANK_CAPACITY_EXCEEDED, http: 422, condition: "quantity_liters > tank capacity at batch create" }
  - { id: ERR_BATCH_TOO_SMALL, http: 422, condition: "quantity_liters < 500 at batch create" }
  - { id: ERR_TANK_WINDOW_CONFLICT, http: 422, condition: "Tank occupation conflict under closed-interval + 3h gap semantics" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Line booking conflict under half-open + directional changeover semantics" }
  - { id: ERR_LINE_UNSUPPORTED_CONTAINER, http: 422, condition: "container_type not in line.supported_container_types" }
  - { id: ERR_MINIMUM_RUN_NOT_MET, http: 422, condition: "planned_units < customer.minimum_run_units at confirm" }
  - { id: ERR_REBLEND_LIMIT_EXCEEDED, http: 409, condition: "apply-adjustment with adjustment_count already == 2" }
  - { id: ERR_NOTHING_TO_ADJUST, http: 409, condition: "apply-adjustment while measured_brix inside the tolerance band" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_TANK_CAPACITY, http: 422, condition: "Computed brix addition would overflow the tank" }
  - { id: ERR_FILL_COUNT_EXCEEDS_THEORETICAL, http: 422, condition: "actual_units_filled outside 1..min(theoretical_units, reserved_units)" }
  - { id: ERR_ZONE_TEMPERATURE_MISMATCH, http: 422, condition: "HPP goods require CHILLED zone; FROZEN never allowed; PASTEURIZATION allows AMBIENT or CHILLED" }
  - { id: ERR_ZONE_CAPACITY_EXCEEDED, http: 409, condition: "pallets_stored + new pallets > zone pallet_capacity" }
  - { id: ERR_CONTAINER_SUPPLY_INSUFFICIENT, http: 409, condition: "QC_PASSED pool below ceil(planned_units * 1.05); reservation is atomic" }
  - { id: ERR_FORMULA_CUSTOMER_MISMATCH, http: 422, condition: "formula.customer_id != run/order customer_id" }
  - { id: ERR_PAYMENT_INVALID_AMOUNT, http: 422, condition: "Payment amount must satisfy 0 < amount <= outstanding_balance_cents" }
  # --- temporal ---
  - { id: ERR_CIP_DURATION_INSUFFICIENT, http: 409, condition: "complete-cip before cip_started_at + cip_required_hours" }
  - { id: ERR_RUN_WINDOW_NOT_ACTIVE, http: 409, condition: "Run start with clock outside [scheduled_start_at, scheduled_end_at)" }
  - { id: ERR_DELIVERY_DATE_IN_PAST, http: 422, condition: "requested_delivery_date before current logical date" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc to an earlier instant than the current logical clock" }
  # --- fiscal ---
  - { id: ERR_REACTIVATION_THRESHOLD_NOT_MET, http: 409, condition: "Reactivate while outstanding > floor(credit_limit * 0.8)" }
  - { id: ERR_PALLET_RETURN_EXCEEDS_OUTSTANDING, http: 422, condition: "Pallet return count > pallets_outstanding" }
  # --- ship gate ---
  - { id: ERR_ORDER_CONTAINS_UNSHIPPABLE_LOT, http: 409, condition: "Ship attempted while an allocated lot is EXPIRED/RECALLED/DEPLETED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant configuration and ops-run epochs"
    identity: opaque
    exclusive_operations:
      - "POST /v1/customer-accounts"
      - "POST /v1/blending-tanks"
      - "POST /v1/bottling-lines"
      - "POST /v1/bottling-lines/{id}/set-maintenance, /set-active"
      - "POST /v1/warehouse-zones"
      - "POST /v1/ops-runs"
      - "POST /v1/_clock/set_current_utc"
    shared_operations: []
  - name: FinanceClerk
    description: "Credit lifecycle, payments, final invoicing"
    identity: opaque
    exclusive_operations:
      - "POST /v1/customer-accounts/{id}/approve-credit, /suspend, /reactivate, /close"
      - "POST /v1/customer-accounts/{id}/payments"
      - "POST /v1/production-runs/{id}/finalize-invoice"
    shared_operations: []
  - name: ProductDeveloper
    description: "Owns formulas and submits label reviews (submitter side of label SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /v1/formulas"
      - "POST /v1/formulas/{id}/submit-label-review"
      - "POST /v1/formulas/{id}/retire"
    shared_operations: []
  - name: LabelComplianceReviewer
    description: "Decides label claim reviews (reviewer side of label SoD: must differ from submitter)"
    identity: opaque
    exclusive_operations:
      - "POST /v1/label-reviews/{id}/approve"
      - "POST /v1/label-reviews/{id}/reject"
    shared_operations: []
  - name: BlendOperator
    description: "Runs blending and process execution (blender side of QA SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /v1/batches, /start-blend, /record-blend, /apply-adjustment"
      - "POST /v1/process-runs, /start, /complete, /abort"
      - "POST /v1/blending-tanks/{id}/start-cip, /complete-cip"
    shared_operations: []
  - name: QAInspector
    description: "Quality gatekeeper (QA side of SoD: must differ from blended_by_user_id)"
    identity: opaque
    exclusive_operations:
      - "POST /v1/batches/{id}/qa-verdict, /condemn, /release"
      - "POST /v1/process-runs/{id}/qa-disposition"
      - "POST /v1/container-lots/{id}/qc-verdict"
      - "POST /v1/finished-good-lots/{id}/recall"
    shared_operations: []
  - name: ProductionPlanner
    description: "Plans, schedules, and completes production runs"
    identity: opaque
    exclusive_operations:
      - "POST /v1/production-runs, /confirm, /schedule, /start, /complete, /cancel"
    shared_operations: []
  - name: WarehouseLead
    description: "Container receiving, shipment allocation/pick/ship, pallet returns"
    identity: opaque
    exclusive_operations:
      - "POST /v1/container-lots, /return"
      - "POST /v1/pallet-accounts/{id}/returns"
      - "POST /v1/shipment-orders/{id}/allocate, /pick, /ship"
    shared_operations:
      - "POST /v1/shipment-orders/{id}/cancel (shared with CustomerServiceRep)"
  - name: CustomerServiceRep
    description: "Places and cancels shipment orders on behalf of any customer"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /v1/shipment-orders"
      - "POST /v1/shipment-orders/{id}/cancel (shared with WarehouseLead)"
  - name: CustomerContact
    description: "External customer portal user; may place shipment orders only for its own customer account"
    identity: "entity_backed:CustomerAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /v1/shipment-orders (only when customer_id == X-User-ID)"
  - name: Any
    description: "Any authenticated caller may use read-only GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints under /v1"
