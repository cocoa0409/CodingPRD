scaffold_difficulty_design:
  # =======================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: abv_provisional_vs_final_on_packaging
        grounds:
          - calculations.abv_from_gravity
          - state_machines.PackagingRun.SCHEDULED_to_COMPLETED
          - entities.FermentationBatch.fields.abv_pct
        distinguishing_aspect: |
          Same fermentation batch: provisional variant uses latest in-flight
          gravity reading during FERMENTING (abv=4.4 when gravity drops to 6.0
          from original 14.0); final variant recomputes at packaging from the
          final gravity reading (abv=5.5 when gravity reaches 4.0). Two valid
          formulas on the SAME batch produce different ABV values.
        test_recipe:
          setup:
            - "AppleVariety v_spy created (code=NORTHERN_SPY)"
            - "OrchardContract c1 ACTIVE with committed_weight_lbs=10000"
            - "HarvestLot h1 RECEIVED under c1 weight=8000, measured_brix=14.0"
            - "PressBatch pb1 PLANNED with one BlendLine(lot=h1, weight=8000)"
            - "pb1 PRESSING -> COMPLETE with actual_juice_liters=4000"
            - "Tank t1 EMPTY capacity=5000, temperature_controlled=true"
            - "YeastProgram y1 kind=CULTURED attenuation=90 temp_min=60 temp_max=72"
            - "FermentationBatch fb1 created from pb1 in t1 with y1"
            - "fb1 original_gravity_brix = 14.0 (locked from blend)"
            - "fb1 volume_liters = 4000"
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "NORTHERN_SPY", tannin_g_per_l: 1.8, brix_at_harvest: 14.0, acidity_g_per_l: 6.5, is_bittersweet: false }
              as: OrchardManager
              captures: { v_spy: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "Hilltop Orchard", region_code: "NY", season_year: 2026, committed_weight_lbs: 10000, price_per_lb_cents: 85, shortfall_penalty_cents_per_lb: 50 }
              as: OrchardManager
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /cidery/contracts/${c1}/activate"
              payload: { expected_contract_version: "${c1_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${c1}/harvest-lots"
              payload: { variety_id: "${v_spy}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 8000, measured_brix: 14.0, measured_tannin_g_per_l: 1.8 }
              as: OrchardManager
              captures: { h1: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 240
                blend_lines:
                  - { harvest_lot_id: "${h1}", weight_lbs: 8000, position: 1 }
              as: CellarLead
              captures: { pb1: $.data.id }
            - call: "POST /cidery/press-batches/${pb1}/start"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/press-batches/${pb1}/complete"
              payload: { actual_juice_liters: 4000 }
              as: CellarLead
            - call: "POST /cidery/tanks"
              payload: { code: "T-101", capacity_liters: 5000, material: "STAINLESS", temperature_controlled: true }
              as: CellarLead
              captures: { t1: $.data.id }
            - call: "POST /cidery/yeast-programs"
              payload: { code: "EC-1118", kind: "CULTURED", attenuation_pct: 90, temp_min_f: 60, temp_max_f: 72, nutrient_required: false }
              as: CellarLead
              captures: { y1: $.data.id }
            - call: "POST /cidery/fermentation-batches"
              payload: { press_batch_id: "${pb1}", tank_id: "${t1}", yeast_program_id: "${y1}" }
              as: CellarLead
              captures: { fb1: $.data.id, fb1_v: $.data.version }
            - call: "POST /cidery/fermentation-batches/${fb1}/readings"
              payload: { gravity_brix: 6.0 }
              as: CellarLead
              captures: { fb1_prov_abv: $.data.abv_pct, fb1_v2: $.data.version }
          trigger:
            - call: "POST /cidery/fermentation-batches/${fb1}/readings"
              payload: { gravity_brix: 4.0 }
              as: CellarLead
              captures: { fb1_final_abv: $.data.abv_pct }
          assert:
            - "fb1_prov_abv == 4.4   # (14.0 - 6.0) * 0.55 = 4.4 (provisional)"
            - "fb1_final_abv == 5.5  # (14.0 - 4.0) * 0.55 = 5.5 (final)"
            - "fb1_prov_abv != fb1_final_abv"

      - name: contract_shortfall_provisional_vs_final
        grounds:
          - calculations.contract_shortfall_penalty
          - state_machines.OrchardContract.ACTIVE_to_SETTLED
          - entities.OrchardContract.fields.received_weight_lbs
        distinguishing_aspect: |
          Same contract: provisional variant reflects live
          received_weight_lbs at quote time (penalty changes as lots are
          received/spoiled); final variant locks the value at settle. With
          committed=10000, one PRESSED lot of 5000 and one SPOILED lot of
          4000, received_weight_lbs at settle = 5000 (SPOILED excluded),
          shortfall=5000, penalty=300000 cents.
        test_recipe:
          setup:
            - "OrchardContract c2 ACTIVE with committed=10000, penalty_per_lb=50"
            - "HarvestLot h_a RECEIVED weight=5000"
            - "HarvestLot h_b RECEIVED weight=4000"
            - "PressBatch pb_a consumes h_a fully -> h_a PRESSED"
            - "h_b marked SPOILED (CellarLead)"
            - "c2.received_weight_lbs = 5000 (only PRESSED/PARTIALLY_PRESSED count)"
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "MACOUN", tannin_g_per_l: 0.8, brix_at_harvest: 12.5, acidity_g_per_l: 5.5, is_bittersweet: false }
              as: OrchardManager
              captures: { v_mac: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "Riverbend Orchard", region_code: "VT", season_year: 2026, committed_weight_lbs: 10000, price_per_lb_cents: 90, shortfall_penalty_cents_per_lb: 50 }
              as: OrchardManager
              captures: { c2: $.data.id, c2_v: $.data.version }
            - call: "POST /cidery/contracts/${c2}/activate"
              payload: { expected_contract_version: "${c2_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${c2}/harvest-lots"
              payload: { variety_id: "${v_mac}", received_at: "2026-09-20T09:00:00Z", weight_lbs: 5000, measured_brix: 12.5, measured_tannin_g_per_l: 0.8 }
              as: OrchardManager
              captures: { h_a: $.data.id }
            - call: "POST /cidery/contracts/${c2}/harvest-lots"
              payload: { variety_id: "${v_mac}", received_at: "2026-09-22T09:00:00Z", weight_lbs: 4000, measured_brix: 12.3, measured_tannin_g_per_l: 0.7 }
              as: OrchardManager
              captures: { h_b: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-23T08:00:00Z"
                press_window_minutes: 240
                blend_lines:
                  - { harvest_lot_id: "${h_a}", weight_lbs: 5000, position: 1 }
              as: CellarLead
              captures: { pb_a: $.data.id }
            - call: "POST /cidery/press-batches/${pb_a}/start"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/press-batches/${pb_a}/complete"
              payload: { actual_juice_liters: 2500 }
              as: CellarLead
            - call: "POST /cidery/harvest-lots/${h_b}/spoil"
              payload: {}
              as: CellarLead
          trigger:
            - call: "POST /cidery/contracts/${c2}/settle"
              payload: {}
              as: OrchardManager
              captures: { c2_after: $.data }
          assert:
            - "c2_after.status == SETTLED"
            - "c2_after.received_weight_lbs == 5000  # SPOILED lot excluded"
            # shortfall = 10000 - 5000 = 5000; free=1000, tier1=2000
            # remaining = 4000; t1 = 2000 (2000*50=100000); t2 = 2000 (2000*100=200000)
            - "c2_after.shortfall_penalty_cents == 300000"

  # =======================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contract_shortfall_tiered_three_input_nonlinear
        grounds:
          - calculations.contract_shortfall_penalty
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs (committed_weight_lbs,
          received_weight_lbs, shortfall_penalty_cents_per_lb) and
          non-linear interaction via floor() at tier boundaries plus a
          min() on tier1 cap. With committed=10000, received=5000,
          rate=50: penalty=300000 (crosses into tier-2 at 2x).
        test_recipe:
          setup:
            - "c3 ACTIVE committed=10000 penalty_rate=50"
            - "5000 lbs received & PRESSED; 0 lbs spoiled"
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "LIBERTY", tannin_g_per_l: 0.6, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { v_lib: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "Stony Field", region_code: "NY", season_year: 2026, committed_weight_lbs: 10000, price_per_lb_cents: 80, shortfall_penalty_cents_per_lb: 50 }
              as: OrchardManager
              captures: { c3: $.data.id, c3_v: $.data.version }
            - call: "POST /cidery/contracts/${c3}/activate"
              payload: { expected_contract_version: "${c3_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${c3}/harvest-lots"
              payload: { variety_id: "${v_lib}", received_at: "2026-09-25T09:00:00Z", weight_lbs: 5000, measured_brix: 13.0, measured_tannin_g_per_l: 0.6 }
              as: OrchardManager
              captures: { h3: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-26T08:00:00Z"
                press_window_minutes: 240
                blend_lines:
                  - { harvest_lot_id: "${h3}", weight_lbs: 5000, position: 1 }
              as: CellarLead
              captures: { pb3: $.data.id }
            - call: "POST /cidery/press-batches/${pb3}/start"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/press-batches/${pb3}/complete"
              payload: { actual_juice_liters: 2500 }
              as: CellarLead
          trigger:
            - call: "POST /cidery/contracts/${c3}/settle"
              payload: {}
              as: OrchardManager
              captures: { c3_after: $.data }
          assert:
            - "c3_after.shortfall_penalty_cents == 300000"
            # 5000 shortfall - 1000 free = 4000 remaining
            # t1 = min(4000, 2000) = 2000 -> 2000*50 = 100000
            # t2 = 2000 -> 2000*100 = 200000
            # total 300000

      - name: excise_per_line_rounding_then_sum
        grounds:
          - calculations.excise_tax
          - calculations.excise_report_aggregation
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Two SHIPPED orders
          each of 5 BOTTLE_500ML: per-line excise = round_half_up(5*0.5*22.6)
          = round_half_up(56.5) = 57 each; period total = 57+57 = 114 cents.
          If instead the period summed liters first then rounded
          (5.0*22.6=113.0 -> 113), the result would be 113 — pinned as WRONG.
        test_recipe:
          setup:
            - "Product p1 ACTIVE, label approval APPROVED for FEDERAL_TTB"
            - "License lic_ny ACTIVE NY_FARM_CIDERY cap=100000"
            - "PackagingRun pr1 COMPLETED: 100 x BOTTLE_500ML"
            - "ExciseReport er1 OPEN for (2026, 10, TTB)"
          setup_api_calls:
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cidery/varieties"
              payload: { code: "SPITZ", tannin_g_per_l: 0.4, brix_at_harvest: 13.5, acidity_g_per_l: 7.0, is_bittersweet: false }
              as: OrchardManager
              captures: { v_sp: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "Hill", region_code: "NY", season_year: 2026, committed_weight_lbs: 5000, price_per_lb_cents: 90, shortfall_penalty_cents_per_lb: 30 }
              as: OrchardManager
              captures: { c4: $.data.id, c4_v: $.data.version }
            - call: "POST /cidery/contracts/${c4}/activate"
              payload: { expected_contract_version: "${c4_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${c4}/harvest-lots"
              payload: { variety_id: "${v_sp}", received_at: "2026-09-20T10:00:00Z", weight_lbs: 5000, measured_brix: 13.5, measured_tannin_g_per_l: 0.4 }
              as: OrchardManager
              captures: { h4: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-22T08:00:00Z"
                press_window_minutes: 240
                blend_lines:
                  - { harvest_lot_id: "${h4}", weight_lbs: 5000, position: 1 }
              as: CellarLead
              captures: { pb4: $.data.id }
            - call: "POST /cidery/press-batches/${pb4}/start"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/press-batches/${pb4}/complete"
              payload: { actual_juice_liters: 2500 }
              as: CellarLead
            - call: "POST /cidery/tanks"
              payload: { code: "T-102", capacity_liters: 5000, material: "STAINLESS", temperature_controlled: true }
              as: CellarLead
              captures: { t4: $.data.id }
            - call: "POST /cidery/yeast-programs"
              payload: { code: "WILDFERM", kind: "WILD", attenuation_pct: 85, temp_min_f: 60, temp_max_f: 75, nutrient_required: false }
              as: CellarLead
              captures: { y4: $.data.id }
            - call: "POST /cidery/fermentation-batches"
              payload: { press_batch_id: "${pb4}", tank_id: "${t4}", yeast_program_id: "${y4}" }
              as: CellarLead
              captures: { fb4: $.data.id }
            - call: "POST /cidery/fermentation-batches/${fb4}/readings"
              payload: { gravity_brix: 5.0 }
              as: CellarLead
            - call: "POST /cidery/fermentation-batches/${fb4}/age"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cidery/fermentation-batches/${fb4}/ready"
              payload: {}
              as: CellarLead
            - call: "POST /cidery/products"
              payload: { sku: "OR-2026-001", name: "Orchard Reserve", style: "DRY", target_abv_pct: 4.7, vintage_year: 2026 }
              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /cidery/products/${p1}/label-approvals"
              payload: { market: "FEDERAL_TTB", application_number: "TTB-2026-001", expires_at: "2099-12-31T23:59:59Z" }
              as: ComplianceOfficer
              captures: { la1: $.data.id }
            - call: "POST /cidery/label-approvals/${la1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/products/${p1}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/licenses"
              payload: { kind: "NY_FARM_CIDERY", license_number: "NY-FC-1234", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-12-31T23:59:59Z", scope_states: ["NY"], annual_volume_cap_liters: 100000 }
              as: ComplianceOfficer
              captures: { lic1: $.data.id }
            - call: "POST /cidery/packaging-runs"
              payload: { product_id: "${p1}", fermentation_batch_id: "${fb4}", package_format: "BOTTLE_500ML", volume_liters: 50, label_approval_id: "${la1}", license_id: "${lic1}" }
              as: PackagingOperator
              captures: { pr1: $.data.id }
            - call: "GET /cidery/fermentation-batches/${fb4}"
              payload: {}
              as: PackagingOperator
              captures: { fb4_v_pre: $.data.version }
            - call: "POST /cidery/packaging-runs/${pr1}/complete"
              payload: { expected_batch_version: "${fb4_v_pre}" }
              as: PackagingOperator
              captures: { pr1_done: $.data }
            - call: "POST /cidery/excise-reports"
              payload: { period_year: 2026, period_month: 10, regulator: "TTB" }
              as: ComplianceOfficer
              captures: { er1: $.data.id }
            - call: "POST /cidery/orders"
              payload: { channel: "TASTING_ROOM", destination_state: "NY", product_id: "${p1}", packaging_run_id: "${pr1}", units: 5, unit_price_cents: 1200 }
              as: SalesRep
              captures: { o1: $.data.id }
            - call: "POST /cidery/orders/${o1}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /cidery/orders/${o1}/ship"
              payload: {}
              as: SalesRep
            - call: "POST /cidery/orders"
              payload: { channel: "TASTING_ROOM", destination_state: "NY", product_id: "${p1}", packaging_run_id: "${pr1}", units: 5, unit_price_cents: 1200 }
              as: SalesRep
              captures: { o2: $.data.id }
            - call: "POST /cidery/orders/${o2}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /cidery/orders/${o2}/ship"
              payload: {}
              as: SalesRep
          trigger:
            - call: "GET /cidery/excise-reports/${er1}"
              payload: {}
              as: ComplianceOfficer
              captures: { er1_after: $.data }
          assert:
            # 5 * 0.5 = 2.5 L per order; 2.5 * 22.6 = 56.5 -> round_half_up -> 57 per order
            # Two orders: 57 + 57 = 114. NOT round(5.0 * 22.6) = 113.
            - "er1_after.taxable_cents == 114"
            - "er1_after.taxable_liters == 5"
            # Sum-first would give 113; per-line gives 114. Pinned per-line.

  # =======================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: press_batch_cycle_pressing_to_planned_reentry
        grounds:
          - state_machines.PressBatch
          - state_machines.HarvestLot
        distinguishing_aspect: |
          Cyclic shape on PressBatch (PRESSING -> PLANNED -> PRESSING).
          Pause reverses BlendLine consumption on HarvestLot
          (PARTIALLY_PRESSED -> RECEIVED), then re-start re-consumes. The
          lot's pressed_weight_lbs returns to 0 mid-cycle then climbs again.
        test_recipe:
          setup:
            - "Contract c5 ACTIVE committed=8000"
            - "Lot h5 RECEIVED weight=8000"
            - "PressBatch pb5 PLANNED with BlendLine(h5, 8000)"
            - "pb5 -> PRESSING (h5.pressed_weight_lbs=8000, status PRESSED)"
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "CORTLAND", tannin_g_per_l: 0.5, brix_at_harvest: 12.0, acidity_g_per_l: 5.0, is_bittersweet: false }
              as: OrchardManager
              captures: { v_cor: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "Meadowbrook", region_code: "NY", season_year: 2026, committed_weight_lbs: 8000, price_per_lb_cents: 75, shortfall_penalty_cents_per_lb: 40 }
              as: OrchardManager
              captures: { c5: $.data.id, c5_v: $.data.version }
            - call: "POST /cidery/contracts/${c5}/activate"
              payload: { expected_contract_version: "${c5_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${c5}/harvest-lots"
              payload: { variety_id: "${v_cor}", received_at: "2026-09-18T10:00:00Z", weight_lbs: 8000, measured_brix: 12.0, measured_tannin_g_per_l: 0.5 }
              as: OrchardManager
              captures: { h5: $.data.id }
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-20T08:00:00Z"
                press_window_minutes: 300
                blend_lines:
                  - { harvest_lot_id: "${h5}", weight_lbs: 8000, position: 1 }
              as: CellarLead
              captures: { pb5: $.data.id }
            - call: "POST /cidery/press-batches/${pb5}/start"
              payload: {}
              as: CellarLead
              captures: { pb5_pressing: $.data }
          trigger:
            - call: "POST /cidery/press-batches/${pb5}/pause"
              payload: { reason: "equipment failure" }
              as: CellarLead
              captures: { pb5_paused: $.data, h5_after_pause: $.data }
            - call: "GET /cidery/harvest-lots/${h5}"
              payload: {}
              as: CellarLead
              captures: { h5_post_pause: $.data }
            - call: "POST /cidery/press-batches/${pb5}/start"
              payload: {}
              as: CellarLead
              captures: { pb5_restarted: $.data }
            - call: "GET /cidery/harvest-lots/${h5}"
              payload: {}
              as: CellarLead
              captures: { h5_post_restart: $.data }
          assert:
            - "pb5_paused.status == PLANNED"
            - "h5_post_pause.pressed_weight_lbs == 0   # pause reversed consumption"
            - "h5_post_pause.status == RECEIVED       # auto-reverted"
            - "pb5_restarted.status == PRESSING"
            - "h5_post_restart.pressed_weight_lbs == 8000"
            - "h5_post_restart.status == PRESSED"

      - name: product_status_cycle_retired_to_active
        grounds:
          - state_machines.CiderProduct
          - state_machines.LabelApproval
        distinguishing_aspect: |
          Cyclic shape on CiderProduct (ACTIVE -> RETIRED -> ACTIVE).
          After retirement, re-activation requires that the underlying
          LabelApproval is still APPROVED (cross-entity gate). Different
          entity than PressBatch; different cyclic semantic.
        test_recipe:
          setup:
            - "Product p2 DRAFT with target_abv=6.0"
            - "LabelApproval la2 APPROVED for FEDERAL_TTB"
            - "p2 activated -> ACTIVE"
            - "p2 retired -> RETIRED"
          setup_api_calls:
            - call: "POST /cidery/products"
              payload: { sku: "SM-2026-002", name: "Semi-Dry Reserve", style: "SEMI_DRY", target_abv_pct: 6.0, vintage_year: 2026 }
              as: ComplianceOfficer
              captures: { p2: $.data.id }
            - call: "POST /cidery/products/${p2}/label-approvals"
              payload: { market: "FEDERAL_TTB", application_number: "TTB-2026-002", expires_at: "2099-12-31T23:59:59Z" }
              as: ComplianceOfficer
              captures: { la2: $.data.id }
            - call: "POST /cidery/label-approvals/${la2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/products/${p2}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cidery/products/${p2}/retire"
              payload: {}
              as: ComplianceOfficer
              captures: { p2_retired: $.data }
          trigger:
            - call: "POST /cidery/products/${p2}/activate"
              payload: {}
              as: ComplianceOfficer
