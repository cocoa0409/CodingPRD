# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0737
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every ground resolves into SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls
# chain drives empty-DB -> setup using only §1.5 endpoints. All roles used are
# opaque (StoreClerk / InventoryManager) so no as_user_id is required.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: line_price_provisional_vs_final_divergence
        grounds:
          - calculations.refill_line_price
          - entities.RefillLine.fields.pricing_stage
          - entities.RefillLine.fields.net_weight_g
        distinguishing_aspect: >
          Same RefillLine priced two ways on the RefillLine/Order domain: PROVISIONAL uses
          declared tare + estimated gross (net 950 -> unit rate 40 -> 342c) while FINAL uses
          measured tare + weighed gross (net 1050 -> bulk rate 30 -> 284c); the two variants
          diverge (342 != 284) and even cross the tier boundary.
        test_recipe:
          setup:
            - "PLUS member; Oats product (unit 40, bulk 30 at >=1000g); station S1; Oats bin on_hand 5000; BYO container (declared tare 200) owned by the member; CART order with one PROVISIONAL line (estimated_gross 1150) whose captured provisional line_price_cents == 342"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m1@x.com", full_name: "M One", membership_tier: "PLUS" }, as: StoreClerk, captures: { m1: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m1}" }, as: StoreClerk, captures: { c1: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m1}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o1: "$.data.id" } }
            - { call: "POST /v1/orders/${o1}/lines", payload: { product_id: "${p_oats}", container_id: "${c1}", estimated_gross_g: 1150 }, as: StoreClerk, captures: { l1: "$.data.id", prov_price: "$.data.line_price_cents" } }
          trigger:
            - { call: "POST /v1/orders/${o1}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${l1}/fill", payload: { gross_weight_g: 1250, measured_tare_g: 200 }, as: StoreClerk, captures: { fin_price: "$.data.line_price_cents" } }
          assert:
            - "captured prov_price == 342"
            - "RefillLine.${l1}.line_price_cents == 284"
            - "RefillLine.${l1}.net_weight_g == 1050"
            - "RefillLine.${l1}.pricing_stage == FINAL"

      - name: loyalty_provisional_vs_final_divergence
        grounds:
          - calculations.loyalty_accrual
          - entities.Member.fields.loyalty_points_balance
          - entities.Order.fields.loyalty_points_earned
        distinguishing_aspect: >
          Loyalty accrual on the Member domain (distinct from the RefillLine price instance): the
          provisional estimate floor((342//100)*1.5)=4 diverges from the final accrual
          floor((284//100)*1.5)=3, and it is the FINAL value 3 that is credited to
          Member.loyalty_points_balance and Order.loyalty_points_earned.
        test_recipe:
          setup:
            - "PLUS member; Oats product (unit 40, bulk 30); station; Oats bin on_hand 5000; BYO container tare 200; order with one line filled to FINAL net 1050 -> line 284c (settled subtotal 284)"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m2@x.com", full_name: "M Two", membership_tier: "PLUS" }, as: StoreClerk, captures: { m2: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m2}" }, as: StoreClerk, captures: { c1: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m2}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o2: "$.data.id" } }
            - { call: "POST /v1/orders/${o2}/lines", payload: { product_id: "${p_oats}", container_id: "${c1}", estimated_gross_g: 1150 }, as: StoreClerk, captures: { l2: "$.data.id" } }
            - { call: "POST /v1/orders/${o2}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${l2}/fill", payload: { gross_weight_g: 1250, measured_tare_g: 200 }, as: StoreClerk }
          trigger:
            - { call: "POST /v1/orders/${o2}/checkout", payload: {}, as: StoreClerk, captures: { earned: "$.data.loyalty_points_earned" } }
          assert:
            - "Order.${o2}.loyalty_points_earned == 3"
            - "captured earned == 3"
            - "Member.${m2}.loyalty_points_balance == 3"
            - "Order.${o2}.subtotal_cents == 284"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_price_tier_and_discount_nonlinear
        grounds:
          - calculations.refill_line_price
          - entities.Product.fields.bulk_tier_threshold_g
        distinguishing_aspect: >
          Mode (a): a >=3-input non-linear formula — net-weight tier branch (net 1050 >= 1000 selects
          bulk rate 30 not unit 40) nested with the PLUS discount factor 0.10 and per-line
          round_half_up — yields 284c; changing any one input changes the branch taken.
        test_recipe:
          setup:
            - "PLUS member; Oats product (unit 40, bulk 30 at >=1000); station; Oats bin on_hand 5000; BYO container tare 200; CART order + one PROVISIONAL line, order in FILLING"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m3@x.com", full_name: "M Three", membership_tier: "PLUS" }, as: StoreClerk, captures: { m3: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m3}" }, as: StoreClerk, captures: { c1: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m3}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o3: "$.data.id" } }
            - { call: "POST /v1/orders/${o3}/lines", payload: { product_id: "${p_oats}", container_id: "${c1}", estimated_gross_g: 1150 }, as: StoreClerk, captures: { l3: "$.data.id" } }
            - { call: "POST /v1/orders/${o3}/start-fill", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/refill-lines/${l3}/fill", payload: { gross_weight_g: 1250, measured_tare_g: 200 }, as: StoreClerk, captures: { price: "$.data.line_price_cents" } }
          assert:
            - "RefillLine.${l3}.net_weight_g == 1050"
            - "RefillLine.${l3}.line_price_cents == 284"
            - "captured price == 284"

      - name: order_subtotal_round_per_line_then_sum
        grounds:
          - calculations.order_totals
          - calculations.refill_line_price
        distinguishing_aspect: >
          Mode (b): pinned rounding order. Two Spice lines each price to raw 100.5c -> round_half_up 101c,
          so subtotal = 101 + 101 = 202 (round-per-line THEN sum); summing raw first (201.0) then
          rounding would give 201. The scaffold pins per-line rounding, so 202 is correct.
        test_recipe:
          setup:
            - "BASIC member; Spice product (unit 67, no bulk tier: threshold 100000); station; Spice bin on_hand 5000; two BYO containers (tare 200) owned by the member; order with two lines each filled to FINAL net 150 (raw 100.5 -> 101)"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m4@x.com", full_name: "M Four", membership_tier: "BASIC" }, as: StoreClerk, captures: { m4: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Spice", category: "SPICES", unit_price_cents_per_100g: 67, bulk_tier_threshold_g: 100000, bulk_tier_price_cents_per_100g: 67 }, as: InventoryManager, captures: { p_spice: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_spice}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 100, last_recount_g: 5000 }, as: InventoryManager, captures: { b_spice: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m4}" }, as: StoreClerk, captures: { ca: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m4}" }, as: StoreClerk, captures: { cb: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m4}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o4: "$.data.id" } }
            - { call: "POST /v1/orders/${o4}/lines", payload: { product_id: "${p_spice}", container_id: "${ca}", estimated_gross_g: 350 }, as: StoreClerk, captures: { la: "$.data.id" } }
            - { call: "POST /v1/orders/${o4}/lines", payload: { product_id: "${p_spice}", container_id: "${cb}", estimated_gross_g: 350 }, as: StoreClerk, captures: { lb: "$.data.id" } }
            - { call: "POST /v1/orders/${o4}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${la}/fill", payload: { gross_weight_g: 350, measured_tare_g: 200 }, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${lb}/fill", payload: { gross_weight_g: 350, measured_tare_g: 200 }, as: StoreClerk }
          trigger:
            - { call: "POST /v1/orders/${o4}/checkout", payload: {}, as: StoreClerk, captures: { sub: "$.data.subtotal_cents" } }
          assert:
            - "RefillLine.${la}.line_price_cents == 101"
            - "RefillLine.${lb}.line_price_cents == 101"
            - "Order.${o4}.subtotal_cents == 202"
            - "captured sub == 202"
            - "Order.${o4}.total_cents == 202"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: container_cyclic_reuse_loop
        grounds:
          - state_machines.Container.IN_USE_to_RETURNED
          - state_machines.Container.RETURNED_to_AVAILABLE
        distinguishing_aspect: >
          Container cycles back to a prior state: after ISSUED->IN_USE->RETURNED->(inspect CLEAN) it
          returns to AVAILABLE with allergen_hold NONE and member_id null — a genuine A->...->A cycle
          on the Container entity, not a linear pipeline.
        test_recipe:
          setup:
            - "Member; Oats product; station; Oats bin on_hand 5000; GLASS_500 container (deposit 150) issued to member; order filled + checked out so the container is IN_USE"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m5@x.com", full_name: "M Five" }, as: StoreClerk, captures: { m5: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "GLASS_500", declared_tare_g: 250 }, as: StoreClerk, captures: { c5: "$.data.id" } }
            - { call: "POST /v1/containers/${c5}/issue", payload: { member_id: "${m5}" }, as: StoreClerk }
            - { call: "POST /v1/orders", payload: { member_id: "${m5}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o5: "$.data.id" } }
            - { call: "POST /v1/orders/${o5}/lines", payload: { product_id: "${p_oats}", container_id: "${c5}", estimated_gross_g: 700 }, as: StoreClerk, captures: { l5: "$.data.id" } }
            - { call: "POST /v1/orders/${o5}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${l5}/fill", payload: { gross_weight_g: 750, measured_tare_g: 250 }, as: StoreClerk }
            - { call: "POST /v1/orders/${o5}/checkout", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/containers/${c5}/return", payload: {}, as: StoreClerk }
            - { call: "POST /v1/containers/${c5}/inspect", payload: { result: "CLEAN" }, as: StoreClerk, captures: { st: "$.data.status" } }
          assert:
            - "Container.${c5}.status == AVAILABLE"
            - "captured st == AVAILABLE"
            - "Container.${c5}.allergen_hold == NONE"
            - "Container.${c5}.member_id == null"

      - name: order_parallel_fulfillment_payment_independent
        grounds:
          - state_machines.Order.CART_to_FILLING
          - state_machines.Order.UNPAID_to_CAPTURED
        distinguishing_aspect: >
          Order carries two independent state axes: after start-fill fulfillment_status==FILLING while
          payment_status is still UNPAID; checkout then advances fulfillment to FILLED and payment to
          CAPTURED — parallel dimensions on the Order entity (distinct entity from Container).
        test_recipe:
          setup:
            - "Member; Oats product; station; Oats bin on_hand 5000; BYO container tare 200; CART order with one PROVISIONAL line"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m6@x.com", full_name: "M Six" }, as: StoreClerk, captures: { m6: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m6}" }, as: StoreClerk, captures: { c6: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m6}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o6: "$.data.id" } }
            - { call: "POST /v1/orders/${o6}/lines", payload: { product_id: "${p_oats}", container_id: "${c6}", estimated_gross_g: 700 }, as: StoreClerk, captures: { l6: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders/${o6}/start-fill", payload: {}, as: StoreClerk, captures: { f_mid: "$.data.fulfillment_status", p_mid: "$.data.payment_status" } }
            - { call: "POST /v1/refill-lines/${l6}/fill", payload: { gross_weight_g: 750, measured_tare_g: 200 }, as: StoreClerk }
            - { call: "POST /v1/orders/${o6}/checkout", payload: {}, as: StoreClerk, captures: { f_end: "$.data.fulfillment_status", p_end: "$.data.payment_status" } }
          assert:
            - "captured f_mid == FILLING"
            - "captured p_mid == UNPAID"
            - "captured f_end == FILLED"
            - "captured p_end == CAPTURED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fill_depletes_bin_low_creates_restock
        grounds:
          - state_machines.RefillLine.PROVISIONAL_to_FINAL
          - state_machines.BulkBin.OPEN_to_LOW
          - entities.RestockTask.fields.requested_fill_g
        distinguishing_aspect: >
          Depth-4 cascade from a single fill trigger: line -> FINAL (hop1) -> bin.on_hand_g 2950 (hop2)
          -> bin.status LOW because 2950 <= 3000 (hop3) -> a RestockTask is auto-created with
          requested_fill_g = 8000 - 2950 = 5050 (hop4); each link is caused by the previous.
        test_recipe:
          setup:
            - "Member; Oats product; station; Oats bin capacity 8000, reorder_threshold 3000, on_hand 3050; BYO container tare 200; order with one PROVISIONAL line, order in FILLING"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m7@x.com", full_name: "M Seven" }, as: StoreClerk, captures: { m7: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 3000, last_recount_g: 3050 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "BYO", declared_tare_g: 200, member_id: "${m7}" }, as: StoreClerk, captures: { c7: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { member_id: "${m7}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z" }, as: StoreClerk, captures: { o7: "$.data.id" } }
            - { call: "POST /v1/orders/${o7}/lines", payload: { product_id: "${p_oats}", container_id: "${c7}", estimated_gross_g: 300 }, as: StoreClerk, captures: { l7: "$.data.id" } }
            - { call: "POST /v1/orders/${o7}/start-fill", payload: {}, as: StoreClerk }
          trigger:
            - { call: "POST /v1/refill-lines/${l7}/fill", payload: { gross_weight_g: 300, measured_tare_g: 200 }, as: StoreClerk, captures: { onhand: "$.data.net_weight_g" } }
          assert:
            - "RefillLine.${l7}.net_weight_g == 100"
            - "RefillLine.${l7}.pricing_stage == FINAL"
            - "BulkBin.${b_oats}.on_hand_g == 2950"
            - "BulkBin.${b_oats}.status == LOW"
            - "GET /v1/restock-tasks?bin_id=${b_oats} returns exactly 1 RestockTask with status OPEN and requested_fill_g == 5050"

      - name: delivery_return_refunds_deposit_to_wallet
        grounds:
          - state_machines.Delivery.DELIVERED_to_RETURNED
          - state_machines.Container.IN_USE_to_RETURNED
          - entities.Member.fields.wallet_balance_cents
        distinguishing_aspect: >
          Depth-3 cascade from a distinct trigger (return-received, not fill): delivery -> RETURNED (hop1)
          -> the order's IN_USE GLASS_500 container -> RETURNED (hop2) -> a WalletLedger DEPOSIT_REFUND
          moves wallet +150 and liability -150 on the Member (hop3).
        test_recipe:
          setup:
            - "Member; Oats product; station; Oats bin on_hand 5000; GLASS_500 container (deposit 150) issued to member; DELIVERY-channel order filled + checked out (container IN_USE, member liability 150, wallet 0); vehicle; delivery dispatched then DELIVERED"
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "m8@x.com", full_name: "M Eight" }, as: StoreClerk, captures: { m8: "$.data.id" } }
            - { call: "POST /v1/products", payload: { name: "Oats", category: "GRAINS", unit_price_cents_per_100g: 40, bulk_tier_threshold_g: 1000, bulk_tier_price_cents_per_100g: 30 }, as: InventoryManager, captures: { p_oats: "$.data.id" } }
            - { call: "POST /v1/stations", payload: { name: "S1" }, as: InventoryManager, captures: { s1: "$.data.id" } }
            - { call: "POST /v1/bins", payload: { product_id: "${p_oats}", station_id: "${s1}", capacity_g: 8000, reorder_threshold_g: 1000, last_recount_g: 5000 }, as: InventoryManager, captures: { b_oats: "$.data.id" } }
            - { call: "POST /v1/containers", payload: { container_type: "GLASS_500", declared_tare_g: 250 }, as: StoreClerk, captures: { c8: "$.data.id" } }
            - { call: "POST /v1/containers/${c8}/issue", payload: { member_id: "${m8}" }, as: StoreClerk }
            - { call: "POST /v1/orders", payload: { member_id: "${m8}", station_id: "${s1}", fill_window_start_at: "2026-03-02T09:00:00Z", fill_window_end_at: "2026-03-02T10:00:00Z", fulfillment_channel: "DELIVERY" }, as: StoreClerk, captures: { o8: "$.data.id" } }
            - { call: "POST /v1/orders/${o8}/lines", payload: { product_id: "${p_oats}", container_id: "${c8}", estimated_gross_g: 750 }, as: StoreClerk, captures: { l8: "$.data.id" } }
            - { call: "POST /v1/orders/${o8}/start-fill", payload: {}, as: StoreClerk }
            - { call: "POST /v1/refill-lines/${l8}/fill", payload: { gross_weight_g: 750, measured_tare_g: 250 }, as: StoreClerk }
