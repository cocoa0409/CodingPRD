  - rule_id: cross_entity_state_dependency
    instances:

      - name: intake_accept_requires_valid_and_unexpired_authorization
        grounds:
          - validations.priority_17
          - validations.priority_18
          - state_machines.Authorization.DEFECTIVE_to_VALID
          - state_machines.Request.INTAKE_REVIEW_to_COMPILATION
        distinguishing_aspect: >
          Request -> Authorization: the request's own state is legal and its own
          fields are perfect, but the operation is gated on a DIFFERENT entity's
          status and on that entity's expires_at against the clock. Two distinct
          cross-entity failures are separated (status != VALID beats lapsed), and
          the accept becomes legal only after the other entity is cured.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; facility; patient."
            - "Requester atty1 holds a DEFECTIVE authorization (signature_verified false) with expires_at 2026-12-31T00:00:00Z."
            - "Requester atty2 holds a VALID authorization on a disjoint scope whose expires_at is 2026-08-20T00:00:00Z."
            - "Each requester has its own INTAKE_REVIEW request; neither has been accepted."
