      - name: queue_retire_restores_queue_capacity_total_without_drift
        grounds:
          - state_machines.QueueSegment.PROPOSED_to_ACCEPTED
          - state_machines.QueueSegment.ACCEPTED_to_RETIRED
          - calculations.queue_segment_capacity
          - calculations.project_queue_position
          - endpoints[POST /queue-segments/{id}/retire]
        distinguishing_aspect: |
          Conserved quantity = guest queue capacity, not money. The invariant is
          AttractionProject.queue_capacity_total_guests == sum of capacity_guests over the project's ACCEPTED
          QueueSegment rows, and retire is the compensating action for accept: retiring the 96-guest accessible segment
          subtracts exactly the 96 that accepting it added, taking the total from 539 back to 443 and the accessible
          share from 17.81 to 0.00 percent. The retired row keeps its own capacity_guests, and a second action on the
          RETIRED row is refused, so the running total cannot be decremented twice.
        test_recipe:
          setup:
            - "Project at BLUE_SKY with RideSystem rs SELECTED (operational_hourly_capacity_guests 1179 >= required 800); no phase advance is needed to design a queue."
            - "Two ACCEPTED QueueSegment rows: STANDARD 120 m x 2.4 m => floor(288.00 / 0.65) = 443 guests, ACCESSIBLE 72 m x 2.0 m => floor(144.00 / 1.50) = 96 guests, total 539."
