scaffold_corner_design:
  # =====================================================================
  # Section 1: Entities
  # =====================================================================
  - section: entities
    instances:
      - name: member_creation_required_fields_missing_returns_invalid
        claim_type: required_fields
        grounds:
          - "entities.Member.fields.email"
          - "entities.Member.fields.category_id"
        distinguishing_aspect: "POST /api/members without email must be rejected as a malformed request; required input fields are non-optional."
        test_recipe:
          setup:
            - "No members exist"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
          trigger:
            - call: "POST /api/members"
              payload: { full_name: "No Email", category_id: "${cat}", home_chapter_id: "ch_x", cycle_policy_id: "pol_x", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { err: $.data.error_id }
          assert:
            - "error_id in {ERR_NOT_FOUND, ERR_INVALID_STATE, ERR_UNAUTHENTICATED, ERR_FORBIDDEN} is rejected; missing required field must surface as a 4xx"

      - name: member_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds:
          - "entities.Member.fields.lifetime_dues_paid_cents"
          - "entities.Member.fields.risk_score"
          - "entities.Member.fields.status"
        distinguishing_aspect: "Client-supplied lifetime_dues_paid_cents / risk_score / status fields MUST be ignored on POST /api/members; the server computes them."
        test_recipe:
          setup:
            - "Category, chapter, ANNIVERSARY policy exist; schedule published"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
          trigger:
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id, st: $.data.status, dues: $.data.lifetime_dues_paid_cents, ver: $.data.version }
          assert:
            - "Member.${m}.status == PENDING_VERIFICATION"
            - "Member.${m}.lifetime_dues_paid_cents == 0"
            - "Member.${m}.version == 1"

      - name: member_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /api/members/{nonexistent_uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MembershipAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: members_list_pagination_defaults
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints"
        distinguishing_aspect: "GET /api/members with no limit/offset uses default limit=10, offset=0; response carries total_count and has_more."
        test_recipe:
          setup: ["Several members exist"]
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m1@x.com", full_name: "M1", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
            - call: "POST /api/members"
              payload: { email: "m2@x.com", full_name: "M2", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
          trigger:
            - call: "GET /api/members"
              payload: {}
              as: MembershipAdministrator
          assert:
            - "response envelope includes meta.api_request_id, meta.api_request_timestamp, response_type, data"
            - "response_type == array"
            - "pagination fields limit/offset/total_count/has_more present"

  # =====================================================================
  # Section 2: State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: member_resign_from_already_resigned_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Member.transitions"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Member in RESIGNED terminal state rejects further resign attempts with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Member M ACTIVE; Member has version v_cur after settle+verify"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/members/${m}/verify"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "GET /api/members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { v: $.data.version }
            - call: "POST /api/members/${m}/resign"
              payload: { expected_member_version: "${v}" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "GET /api/members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { v2: $.data.version }
            - call: "POST /api/members/${m}/resign"
              payload: { expected_member_version: "${v2}" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: dues_schedule_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - "state_machines.DuesSchedule"
        distinguishing_aspect: "A freshly created DuesSchedule has status=DRAFT before any publish call."
        test_recipe:
          setup: ["Category exists"]
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
          trigger:
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { s: $.data.id, st: $.data.status }
          assert:
            - "DuesSchedule.${s}.status == DRAFT"

      - name: auto_renew_terminal_revoked_cannot_reactivate
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.AutoRenewAuthorization"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "AutoRenewAuthorization in REVOKED terminal state cannot be reactivated."
        test_recipe:
          setup: ["Member ACTIVE, auto-renew ACTIVE, then revoked"]
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv: "$.data[0].id" }
            - call: "POST /api/dues-invoices/${inv}/payments"
              payload: { payment_method_token: "tok_v", simulated_outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/members/${m}/verify"
              payload: {}
              as: Member
              as_user_id: "${m}"
            - call: "POST /api/members/${m}/auto-renew/enroll"
              payload: { payment_method_token: "tok_v" }
              as: Member
              as_user_id: "${m}"
            - call: "GET /api/members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { v: $.data.version }
            - call: "POST /api/members/${m}/auto-renew/revoke"
              payload: { expected_member_version: "${v}" }
              as: Member
              as_user_id: "${m}"
          trigger:
            - call: "POST /api/members/${m}/auto-renew/reactivate"
              payload: { payment_method_token: "tok_new" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (REVOKED is terminal)"

  # =====================================================================
  # Section 3: Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: calendar_proration_leap_year_denominator
        claim_type: constants_applied
        grounds:
          - "calculations.dues_invoice_amount"
          - "calculations.dues_invoice_amount.constants.DAYS_IN_LEAP"
        distinguishing_aspect: "When period_start falls in a leap year, days_in_year=366; otherwise 365. Test exercises the leap-year branch: join 2028-02-01 (2028 is leap), anchor 12/31."
        test_recipe:
          setup:
            - "Category PROF, chapter CH, CALENDAR policy with anchor 12/31, proration PRO_RATA_DAILY, schedule annual=120000"
            - "Clock set to 2028-02-01"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY_CAL", mode: "CALENDAR", calendar_anchor_month: 12, calendar_anchor_day: 31, proration_method: "PRO_RATA_DAILY" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2028-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-01T00:00:00Z" }
              as: DuesAdministrator
          trigger:
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2028-02-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { amt: "$.data[0].amount_cents" }
          assert:
            # 2028 is leap. Feb 1 -> Dec 31 = 334 days. round_half_up(120000*334/366) = round_half_up(109508.1967) = 109508
            - "Initial DuesInvoice.amount_cents == 109508"

      - name: schedule_superseded_when_newer_published
        claim_type: correct_result
        grounds:
          - "state_machines.DuesSchedule.transitions"
          - "calculations.dues_invoice_amount"
        distinguishing_aspect: "Publishing a newer schedule for the same category transitions the prior PUBLISHED schedule to SUPERSEDED at the new effective_from; invoice issued at time T between the two uses the schedule in force at T."
        test_recipe:
          setup:
            - "Category PROF; S1 PUBLISHED [2026-01-01, null) annual=120000"
            - "S2 DRAFT [2026-07-01, null) annual=130000; notice sent 2026-04-30 (62 days gap >= 60 required)"
            - "S2 published — S1 becomes SUPERSEDED at 2026-07-01"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { s1: $.data.id }
            - call: "POST /api/dues-schedules/${s1}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-07-01T00:00:00Z", effective_to: null, annual_amount_cents: 130000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { s2: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: DuesAdministrator
            - call: "POST /api/dues-schedules/${s2}/increase-notices"
              payload: {}
              as: DuesAdministrator
          trigger:
            - call: "POST /api/dues-schedules/${s2}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "GET /api/dues-schedules/${s1}"
              payload: {}
              as: DuesAdministrator
              captures: { s1_st: $.data.status }
            - call: "GET /api/dues-schedules/${s2}"
              payload: {}
              as: DuesAdministrator
              captures: { s2_st: $.data.status }
          assert:
            - "Schedule.${s1}.status == SUPERSEDED"
            - "Schedule.${s2}.status == PUBLISHED"

  # =====================================================================
  # Section 4: Validations
  # =====================================================================
  - section: validations
    instances:
      - name: refund_on_pending_invoice_returns_not_settled
        claim_type: violation_to_error
        grounds:
          - "validations[priority=16]"
          - "errors[ERR_INVOICE_NOT_SETTLED]"
        distinguishing_aspect: "Refund on a PENDING invoice (never settled) rejected with ERR_INVOICE_NOT_SETTLED."
        test_recipe:
          setup: ["Member registered; initial invoice PENDING (no payment)"]
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
            - call: "GET /api/members/${m}/dues-invoices"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { inv: "$.data[0].id" }
          trigger:
            - call: "POST /api/dues-invoices/${inv}/refund"
              payload: {}
              as: MembershipAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVOICE_NOT_SETTLED"

      - name: revenue_attribution_dues_kind_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_INVALID_REVENUE_KIND]"
        distinguishing_aspect: "POST /api/members/{id}/revenue-attributions with revenue_kind=DUES is rejected with ERR_INVALID_REVENUE_KIND (dues revenue MUST live in DuesInvoice only — non-dues ledger must not pollute)."
        test_recipe:
          setup: ["Member M exists"]
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
            - call: "POST /api/chapters"
              payload: { code: "CH", name: "C", is_affiliate: false }
              as: DuesAdministrator
              captures: { ch: $.data.id }
            - call: "POST /api/renewal-cycle-policies"
              payload: { code: "POLICY", mode: "ANNIVERSARY", calendar_anchor_month: 1, calendar_anchor_day: 1, proration_method: "NONE" }
              as: DuesAdministrator
              captures: { pol: $.data.id }
            - call: "POST /api/dues-schedules"
              payload: { category_id: "${cat}", effective_from: "2026-01-01T00:00:00Z", effective_to: null, annual_amount_cents: 120000, chapter_share_bps: 2000, increase_notice_days: 60 }
              as: DuesAdministrator
              captures: { sched: $.data.id }
            - call: "POST /api/dues-schedules/${sched}/publish"
              payload: {}
              as: DuesAdministrator
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", category_id: "${cat}", home_chapter_id: "${ch}", cycle_policy_id: "${pol}", joined_at: "2026-05-01T00:00:00Z" }
              as: Member
              captures: { m: $.data.id }
          trigger:
            - call: "POST /api/members/${m}/revenue-attributions"
              payload: { revenue_kind: "DUES", amount_cents: 100, occurred_at: "2026-05-15T00:00:00Z" }
              as: MembershipAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REVENUE_KIND"

      - name: member_email_uniqueness_enforced
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_DUPLICATE_EMAIL]"
        distinguishing_aspect: "Second POST /api/members with the same email rejected with ERR_DUPLICATE_EMAIL."
        test_recipe:
          setup: ["Member m@x.com exists"]
