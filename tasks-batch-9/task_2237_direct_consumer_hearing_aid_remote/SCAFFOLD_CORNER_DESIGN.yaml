      - name: layer_selector_referral_provider_ranks_by_utilization_then_created_at
        claim_type: selector_policy
        grounds: [complexity_layers.selector_policy, calculations.referral_provider_selection, errors.ERR_NO_ELIGIBLE_PROVIDER]
        distinguishing_aspect: "With provider_id omitted the selector ranks eligible CA audiologists by utilization_pct ASC (P1 at 50.0 is passed over) and breaks the 0.0 tie by created_at ASC, so P2 -- created before P3 -- is bound to the referral; npi is only consulted on a created_at tie."
        test_recipe:
          setup:
            - "Three CA LICENSED_AUDIOLOGISTs created in order P2 (npi ...22), P3 (npi ...21), P1 (npi ...20). A filler patient books 240 minutes with P1 on 2026-08-02, taking P1 to 240/480 = 50.0% utilization; P2 and P3 stay at 0.0%. A VERTIGO patient then has an OPEN referral. Note P3's npi sorts before P2's, so an npi-first tie-break would pick P3."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /providers", payload: { provider_type: "LICENSED_AUDIOLOGIST", npi: "1000000022", full_name: "Aud P2", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 15 }, as: PlatformAdmin, captures: { prov_s2: "$.data.id" } }
            - { call: "POST /providers", payload: { provider_type: "LICENSED_AUDIOLOGIST", npi: "1000000021", full_name: "Aud P3", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 15 }, as: PlatformAdmin, captures: { prov_s3: "$.data.id" } }
            - { call: "POST /providers", payload: { provider_type: "LICENSED_AUDIOLOGIST", npi: "1000000020", full_name: "Aud P1", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 15 }, as: PlatformAdmin, captures: { prov_s1: "$.data.id" } }
            - { call: "POST /providers", payload: { provider_type: "TELECARE_FITTER", npi: "1000000023", full_name: "Fitter S", licensed_state_codes: ["CA"], daily_capacity_minutes: 480, buffer_minutes: 15 }, as: PlatformAdmin, captures: { prov_sf: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "l16f@x.test", full_name: "L Filler", age_years: 70 }, as: CareOpsAgent, captures: { pat_l16f: "$.data.id" } }
            - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat_l16f}", session_type: "TROUBLESHOOT", provider_id: "${prov_s1}", scheduled_start_utc: "2026-08-02T09:00:00Z", scheduled_end_utc: "2026-08-02T13:00:00Z" }, as: Patient, as_user_id: "${pat_l16f}", note: "240 booked minutes on the focus date for P1" }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "l16@x.test", full_name: "L Sixteen", age_years: 70 }, as: CareOpsAgent, captures: { pat_l16: "$.data.id" } }
            - { call: "POST /patients/${pat_l16}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_l16}", captures: { scr_l16: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_l16}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["VERTIGO"] }, as: Patient, as_user_id: "${pat_l16}" }
            - { call: "POST /screening-sessions/${scr_l16}/submit", payload: {}, as: Patient, as_user_id: "${pat_l16}" }
            - { call: "GET /provider-referrals?patient_id=${pat_l16}&limit=10&offset=0", payload: {}, as: CareOpsAgent, captures: { ref_l16: "$.data[0].id" } }
          trigger:
            - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat_l16}", session_type: "REFERRAL_EVALUATION", provider_referral_id: "${ref_l16}", scheduled_start_utc: "2026-08-02T14:00:00Z", scheduled_end_utc: "2026-08-02T14:30:00Z" }, as: Patient, as_user_id: "${pat_l16}" }
          assert:
            - "HTTP 201 and data.provider_id == \"${prov_s2}\" with data.status == \"SCHEDULED\""
            - "GET /provider-referrals/${ref_l16} returns data.status == \"SCHEDULED\" and data.provider_id == \"${prov_s2}\""
            - "GET /providers/${prov_s1} returns data.utilization_pct == 50.0 and data.booked_minutes_on_focus_date == 240; the selector skipped it despite ample remaining capacity"
            - "the TELECARE_FITTER ${prov_sf} is never selected (excluded by input_set)"
            - "if all three audiologists are PATCHed to status SUSPENDED, the identical booking returns 409 with data.error_id == \"ERR_NO_ELIGIBLE_PROVIDER\""

    # =====================================================================
    # SECTION 9 -- consistency_model  (declared: immediate)
