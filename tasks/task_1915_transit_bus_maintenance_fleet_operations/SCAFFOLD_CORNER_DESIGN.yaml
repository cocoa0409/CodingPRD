  # ------------------------------------------------------------- consistency ---
  - section: consistency
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a bus create followed by a GET in the next request returns the same fleet_number, odometer, and version — no lag or reconciliation window."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet/buses", payload: { fleet_number: "IM1", vin: "VINIM1", model_year: 2023, in_service_date: "2026-01-01", initial_odometer_miles: 777, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id } }
            - { call: "GET /fleet/buses/${b}", payload: {}, as: FleetManager, captures: { fn: $.data.fleet_number, odo: $.data.odometer_miles, v: $.data.version } }
          assert: ["fleet_number == IM1, odometer_miles == 777, version == 1 in the immediate read"]

  # ------------------------------------------------------------------ errors ---
  - section: errors
    instances:
      - name: err_already_terminal_covered_by_state_beats_safety
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ALREADY_TERMINAL]
        excluded_because:
          difficulty_instance: state_beats_safety_terminal_qa_certify
          rationale: "Asserted as the expected error of that §1.8 priority-conflict instance."

      - name: err_appeal_limit_covered_by_appeal_cycle
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPEAL_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: warranty_claim_denied_appeal_cycle_with_cap
          rationale: "Third APPEAL asserts ERR_APPEAL_LIMIT_EXCEEDED in that §1.8 cycle instance."

      - name: err_shift_overlap_covered_by_adjacency_instance
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SHIFT_OVERLAP]
        excluded_because:
          difficulty_instance: shift_assignment_half_open_adjacency_vs_overlap
          rationale: "Asserted as the failing arm of that §1.8 temporal-overlap instance."

      - name: err_wo_window_overlap_covered_by_buffer_instance
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WO_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: work_order_bus_window_one_day_buffer_required
          rationale: "Asserted as the failing arm of that §1.8 temporal-overlap instance."

      - name: err_emissions_retest_covered_by_retest_gate
        claim_type: violation_to_error
        grounds:
          - errors[ERR_EMISSIONS_RETEST_REQUIRED]
        excluded_because:
          difficulty_instance: emissions_wo_blocked_until_passing_retest
          rationale: "Asserted as the first SUBMIT_QA failure in that §1.8 cross-entity instance."

      - name: err_duplicate_assignment_covered_by_priority_pair
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_ASSIGNMENT]
        excluded_because:
          difficulty_instance: referential_beats_temporal_duplicate_shift_assignment
          rationale: "Asserted as the winning error in that §1.8 priority-conflict instance."
