# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not permitted to invoke this endpoint"

  # --- Not Found ---
  - id: ERR_SYNDICATION_NOT_FOUND
    http: 404
    condition: "syndicationId does not exist"

  - id: ERR_OFFERING_NOT_FOUND
    http: 404
    condition: "offeringId does not exist within the path's syndication"

  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscriptionId does not exist within the path's offering"

  - id: ERR_INVESTOR_NOT_FOUND
    http: 404
    condition: "investorId does not exist"

  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "propertyId does not exist"

  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "documentId does not exist within the path's subscription"

  - id: ERR_CAPITAL_CALL_NOT_FOUND
    http: 404
    condition: "capitalCallId does not exist within the path's offering"

  - id: ERR_CONTRIBUTION_NOT_FOUND
    http: 404
    condition: "contributionId does not exist within the path's capital call"

  - id: ERR_QUARTERLY_REPORT_NOT_FOUND
    http: 404
    condition: "quarterlyReportId does not exist within the path's offering"

  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "distributionId does not exist within the path's offering"

  - id: ERR_CAPITAL_EVENT_NOT_FOUND
    http: 404
    condition: "capitalEventId does not exist within the path's property"

  - id: ERR_K1_PACKAGE_NOT_FOUND
    http: 404
    condition: "k1PackageId does not exist within the path's offering"

  - id: ERR_TRANSFER_REQUEST_NOT_FOUND
    http: 404
    condition: "transferRequestId does not exist within the path's subscription"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is in a state from which the requested transition is not allowed"

  - id: ERR_SYNDICATION_NOT_ACTIVE
    http: 409
    condition: "Operation requires syndication status == ACTIVE"

  - id: ERR_OFFERING_NOT_OPEN
    http: 409
    condition: "Operation requires offering status == OPEN"

  - id: ERR_OFFERING_NOT_ACCEPTING_CALLS
    http: 409
    condition: "Capital call issuance requires offering OPEN or CLOSED_TO_NEW_SUBSCRIPTIONS"

  - id: ERR_PROPERTY_NOT_TRANSACTABLE
    http: 409
    condition: "Capital-event execution requires property status in {OWNED, UNDER_CONTRACT_TO_SELL}"

  - id: ERR_PROPERTY_NOT_OWNED
    http: 409
    condition: "Offering-open requires property status == OWNED"

  - id: ERR_SUBSCRIPTION_NOT_FUNDED
    http: 409
    condition: "Transfer sponsor-approve requires from_subscription.status == FUNDED"

  # --- Business safety / compliance ---
  - id: ERR_SELF_VERIFICATION_FORBIDDEN
    http: 403
    condition: "ComplianceOfficer cannot verify accreditation on their own submitted subscription"

  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: "Suitability approver must differ from the accreditation verifier on the same subscription"

  - id: ERR_INVESTOR_CLASS_INSUFFICIENT
    http: 422
    condition: "Investor class must be ACCREDITED or QUALIFIED_PURCHASER when committed_cents >= 100000_00"

  - id: ERR_ACCREDITATION_DOC_MISSING
    http: 422
    condition: "No ACCEPTED ACCREDITATION_LETTER SubscriptionDocument exists on the subscription"

  # --- Business constraint ---
  - id: ERR_MISSING_REQUIRED_DOCUMENTS
    http: 422
    condition: "Required documents (SUBSCRIPTION_AGREEMENT, W9, SUITABILITY_QUESTIONNAIRE) missing or not ACCEPTED"

  - id: ERR_BELOW_MIN_SUBSCRIPTION
    http: 422
    condition: "committed_cents below offering.min_subscription_cents"

  - id: ERR_NON_ACCREDITED_CAP_REACHED
    http: 422
    condition: "Offering's max_non_accredited_count cap reached by existing non-terminal NON_ACCREDITED subscriptions"

  - id: ERR_DUPLICATE_QUARTERLY_REPORT
    http: 409
    condition: "Another PUBLISHED QuarterlyReport exists for the same (offering, year, quarter)"

  - id: ERR_TRANSFER_EXCEEDS_FUNDED
    http: 422
    condition: "transfer_cents > from_subscription.funded_cents or transfer_cents <= 0"

  - id: ERR_BUYER_NOT_ONBOARDED
    http: 422
    condition: "Buyer has no ACCREDITATION_VERIFIED-or-later Subscription on the same offering"

  - id: ERR_SELF_TRANSFER
    http: 422
    condition: "Buyer equals seller (self-transfer forbidden)"

  - id: ERR_REPORT_LOCKED_BY_DISTRIBUTION
    http: 409
    condition: "A Distribution referencing this QuarterlyReport is in APPROVED or PAID"

  - id: ERR_PROPERTY_HAS_ACTIVE_CAPITAL_EVENT
    http: 409
    condition: "Property already has an active (ANNOUNCED or EXECUTED) CapitalEvent"

  - id: ERR_REPORT_NOT_PUBLISHED
    http: 422
    condition: "QUARTERLY_OPERATING Distribution requires a PUBLISHED QuarterlyReport"

  - id: ERR_CAPITAL_EVENT_NOT_EXECUTED
    http: 422
    condition: "CAPITAL_EVENT Distribution requires an EXECUTED CapitalEvent"

  # --- Fiscal ---
  - id: ERR_ESCROW_OVERPAYMENT
    http: 422
    condition: "Escrow receipt would push amount_received_cents above amount_due_cents"

  - id: ERR_ESCROW_PAST_DUE
    http: 422
    condition: "Escrow receipt received after capital_call.due_date"

  - id: ERR_ESCROW_INCOMPLETE
    http: 422
    condition: "Escrow release requires amount_received_cents == amount_due_cents"

  - id: ERR_ESCROW_ALREADY_RELEASED
    http: 409
    condition: "CapitalCall cannot be cancelled after escrow_released_cents > 0"

  - id: ERR_INSUFFICIENT_PROCEEDS
    http: 422
    condition: "Capital-event gross_proceeds_cents <= debt_payoff_cents"

  - id: ERR_NO_FUNDED_SUBSCRIPTIONS
    http: 422
    condition: "Distribution calculation requires at least one FUNDED Subscription"

  - id: ERR_EMPTY_DISTRIBUTION_POOL
    http: 422
    condition: "Distribution total_distributable_cents must be > 0"

  - id: ERR_OFFERING_HAS_OPEN_SUBSCRIPTIONS
    http: 409
    condition: "FINAL_CLOSE blocked by subscriptions in DRAFT/SUBMITTED/ACCREDITATION_VERIFIED/SUITABILITY_APPROVED/AWAITING_FUNDING"

  - id: ERR_OFFERING_HAS_OPEN_CAPITAL_CALLS
    http: 409
    condition: "FINAL_CLOSE blocked by capital calls not in FULLY_FUNDED or CANCELLED"

  - id: ERR_OFFERING_UNRETURNED_CAPITAL
    http: 409
    condition: "DISSOLVE blocked by offering.unreturned_capital_cents > 0"

  - id: ERR_DISTRIBUTION_NOT_PAID
    http: 409
    condition: "DISSOLVE blocked by a Distribution in non-terminal state"

  - id: ERR_NO_K1_BASE
    http: 422
    condition: "K1Package submit-for-review requires at least one FUNDED Subscription at end of tax_year"

  # --- Temporal ---
  - id: ERR_FUTURE_REPORT_PERIOD
    http: 422
    condition: "QuarterlyReport report_year/report_quarter must not be in the future relative to current UTC"

  # --- Concurrency ---
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "expected_subscription_version does not match the subscription's current version"

  - id: ERR_STALE_DISTRIBUTION_VERSION
    http: 412
    condition: "expected_distribution_version does not match the distribution's current version"

  # --- Portal ---
  - id: ERR_PORTAL_ACCESS_DENIED
    http: 403
    condition: "Investor portal_access_status is not ACTIVE"

  - id: ERR_NOT_YOUR_CONTRIBUTION
    http: 403
    condition: "X-User-ID must equal the linked subscription's investor_id"

  # --- Generic ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, or enum value unrecognized"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SponsorOperator
    description: "General partner / syndicator operator; owns offering lifecycle, capital calls, distributions, K-1 packages, capital events"
    identity: opaque
    exclusive_operations:
      - "POST /syndications"
      - "POST /syndications/{id}/activate|suspend|close"
      - "POST /investors (register an investor)"
      - "POST /investors/{id}/suspend-portal, /revoke-portal"
      - "POST /properties"
      - "POST /syndications/{id}/offerings"
      - "POST /offerings/{id}/open|close-to-new|reopen|final-close|dissolve"
      - "POST /capital-calls (create, issue, cancel)"
      - "POST /contributions/{id}/release-escrow"
      - "POST /quarterly-reports (create, publish, amend)"
      - "POST /distributions (create, calculate, approve, pay, cancel)"
      - "POST /capital-events (announce, execute, cancel)"
      - "POST /k1-packages (create, submit-for-review, finalize, deliver)"
      - "POST /transfer-requests/{id}/sponsor-approve, /sponsor-reject"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources (read access to syndication subtree)"

  - name: ComplianceOfficer
    description: "Back-office compliance reviewer; verifies accreditation, approves/rejects suitability, reviews subscription documents. Segregated from SponsorOperator for the same subscription (cannot both verify and approve the same record)."
    identity: opaque
    exclusive_operations:
      - "POST /subscriptions/{id}/verify-accreditation"
      - "POST /subscriptions/{id}/approve-suitability"
      - "POST /subscriptions/{id}/reject-suitability"
      - "POST /documents/{id}/accept"
      - "POST /documents/{id}/reject"
    shared_operations:
      - "GET endpoints across syndication subtree, investors, K-1 packages"

  - name: TransferAgent
    description: "Independent transfer agent; approves/rejects/settles transfer requests after sponsor review"
    identity: opaque
    exclusive_operations:
      - "POST /transfer-requests/{id}/agent-approve"
      - "POST /transfer-requests/{id}/agent-reject"
      - "POST /transfer-requests/{id}/settle"
    shared_operations:
      - "GET endpoints across syndication subtree, investors"

  - name: Investor
    description: "Limited partner investor; self-serves subscriptions, documents, escrow payments, transfer initiation, portal sessions. X-User-ID equals the Investor.id of the acting investor."
    identity: entity_backed:Investor
    exclusive_operations:
      - "POST /syndications/{id}/offerings/{id}/subscriptions (create own subscription)"
      - "POST /subscriptions/{id}/submit, /resubmit, /withdraw"
      - "POST /subscriptions/{id}/documents (upload)"
      - "POST /contributions/{id}/receive-escrow (own contribution only)"
      - "POST /transfer-requests (initiate)"
      - "POST /transfer-requests/{id}/cancel"
      - "POST /investors/{id}/portal-sessions (own)"
    shared_operations:
      - "GET /syndications, /offerings, /subscriptions (own), /capital-calls, /distributions, /quarterly-reports, /properties"
