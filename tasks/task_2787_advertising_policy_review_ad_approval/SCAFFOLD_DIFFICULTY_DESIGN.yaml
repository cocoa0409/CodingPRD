  - rule_id: transitive_cascade
    instances:
      - name: manual_disapproval_cascades_six_hops_to_suspension_and_sibling_task_expiry
        grounds:
          - state_machines.AdCreative.review_status.PENDING_MANUAL_REVIEW_to_DISAPPROVED
          - state_machines.AdCreative.review_status.PENDING_MANUAL_REVIEW_to_SUSPENDED_HOLD
          - state_machines.EnforcementAction.status.ACTIVE_to_SUPERSEDED
          - state_machines.ReviewTask.status.CLAIMED_to_EXPIRED
          - calculations.disapproval_points_assessment
          - calculations.enforcement_severity_index
          - calculations.advertiser_violation_points
        distinguishing_aspect: |
          Depth 6, each hop caused strictly by the previous one: (1) the review DISAPPROVE
          resolves the task and mints a DisapprovalNotice, (2) the notice writes a
          ViolationLedgerEntry, (3) the ledger entry recomputes the advertiser's raw,
          decayed and severity figures, (4) the recomputed severity_index 45.75 mints a
          SUSPENSION and supersedes the ACTIVE RESTRICTION, (5) the SUSPENSION re-derives
          account_status to SUSPENDED, (6) SUSPENDED sweeps an untouched sibling creative
          to SUSPENDED_HOLD, which expires that sibling's CLAIMED ReviewTask and decrements
          the holding reviewer's claimed_task_count. Hop 6 lands on entities that the
          triggering request never named.
        test_recipe:
          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true, requires_disclaimer true, auto 0.90, manual 0.55, sla 48, default_queue REGULATED_CERT) with a US override RESTRICTED_CERT_REQUIRED, requires_license true, requires_disclaimer true, severity_multiplier 1.50."
            - "One advertiser with both verification axes VERIFIED, one reviewer with queue_specialties [REGULATED_CERT], country_authorizations [US] and max_concurrent_claims 3."
            - "Three creatives cr1, cr2, cr3 are all created while the account is ACTIVE, each declaring ALC_SPIRITS and targeting US only."
            - "All three are submitted and screened at confidence 0.80, so each lands in PENDING_MANUAL_REVIEW with one REGULATED_CERT ReviewTask and risk_score_provisional 7.20."
            - "cr1 additionally receives a destination check that resolves to MISMATCH / HOST_MISMATCH, so DESTINATION_MISMATCH is an admissible reason code on its disapproval."
            - "The reviewer claims cr3's task first and holds it, then claims and disapproves cr1's task with reason_codes [MANUAL_REVIEW, DESTINATION_MISMATCH], assessing 9.00 + 18.75 == 27.75 points and creating a RESTRICTION at severity_index 31.25."
            - "The reviewer then claims cr2's task; immediately before the trigger the advertiser is RESTRICTED with violation_points_raw 27.75, cr3's task is CLAIMED and Reviewer.claimed_task_count == 2."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, requires_disclaimer: true, severity_multiplier: 1.50 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Cedar Ridge Distillers", country_code: "US", industry_code: "ALCOHOL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED", evidence_ref: "kyc-2026-0031" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED", evidence_ref: "reg-2026-0031" }
              as: PolicyAdmin
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Regulated US", queue_specialties: ["REGULATED_CERT"], country_authorizations: ["US"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Cask strength release", body_text: "Our cask strength release ships nationwide today.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.cedarridge.example/cask", display_url: "https://www.cedarridge.example/cask", disclaimer_text: "Drink responsibly. 21+" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr1_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Barrel pick event", body_text: "Join our barrel pick event and take home a bottle.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.cedarridge.example/barrel", display_url: "https://www.cedarridge.example/barrel", disclaimer_text: "Drink responsibly. 21+" }
              as: Advertiser
              as_user_id: "${adv_id}"
