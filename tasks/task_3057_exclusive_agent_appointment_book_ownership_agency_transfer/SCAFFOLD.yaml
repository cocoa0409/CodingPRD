scenario: |
  Exclusive Agent Appointment, Book Ownership & Agency Transfer (State Farm): agent
  appointment process with market need analysis and candidate assessment, agency
  agreement terms where the agent builds a book the company owns with contract value
  on termination, new-agent transition from a retiring agent's book with retention
  expectations, commission schedules differing between new and renewal business and
  across lines, agency staffing and licensing with team member appointments under the
  agent, marketing allowance and lead program participation, agency performance
  measurement on growth, retention and loss ratio, contract termination with policy
  reassignment to nearby agents

domain_name: exclusive-agency-appointment
api_prefix: /agency-network

complexity_profile:
  primary_archetype: multi-party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - multiple_foreign_keys
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: agency_code, type: string, source: input, description: "Unique business code of the agency", constraints: "unique across all agencies" }
      - { name: name, type: string, source: input, description: "Agency display name" }
      - { name: region_code, type: string, source: input, description: "Geographic region/territory code used for reassignment ranking" }
      - { name: market_need_score, type: integer, source: input, description: "Company market-need score for the territory (0-100)" }
      - { name: status, type: enum, source: system, description: "APPROVED | ACTIVE | TERMINATED; starts APPROVED", constraints: "enum {APPROVED, ACTIVE, TERMINATED}" }
      - { name: book_open_count, type: integer, source: computed, description: "Count of Policies with status OPEN, read from company records; company-owned onboarding book" }
      - { name: annualized_commission_cents, type: integer, source: computed, description: "Cash-basis commission earned by this agency in its 12-month anniversary term; reset to 0 at each term rollover by the ops run" }
      - { name: exposure_inforce_cents, type: integer, source: computed, description: "Sum of annual_premium_cents over Policies with status OPEN, written under this agency" }
      - { name: agency_level_units, type: integer, source: computed, description: "Count of Agent contracts in state ACTIVE; recomputed by recompute_agency" }
      - { name: agency_paid_claims_cents, type: integer, source: computed, description: "Sum of policy_paid_cents over Claims on the agency's Policies" }
      - { name: loss_ratio, type: number, source: computed, description: "agency_paid_claims_cents / (exposure_inforce_cents * 0.12) * 100, round_half_up" }
      - { name: growth_new_pct, type: number, source: computed, description: "Trailing-12-month new-business commission growth versus the term-start base" }
      - { name: performance_status, type: enum, source: computed, description: "ON_TRACK | BEHIND | AT_RISK", constraints: "enum {ON_TRACK, BEHIND, AT_RISK}" }
      - { name: agency_valuation_cents, type: integer, source: computed, description: "max(1000000 + annualized_commission_cents*1.5 - agency_paid_claims_cents, 2000000)" }
      - { name: term_start_date, type: datetime, source: system, description: "Start of the current 12-month anniversary term; set at activation and at each ops-run rollover" }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic counter, starts at 0, increments by 1 per ops run" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Candidate/agent legal name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: market_need_score, type: integer, source: input, description: "Company market-need score for the candidate's territory (0-100)", constraints: "0 <= value <= 100" }
      - { name: license_status, type: enum, source: computed, description: "NOT_LICENSED | LICENSED | EXPIRED", constraints: "enum {NOT_LICENSED, LICENSED, EXPIRED}" }
      - { name: license_expiry_date, type: datetime, source: input, description: "Read from the agent's state license record by read_license" }
      - { name: state_market_need_acknowledged, type: boolean, source: system, description: "Set true by the ops run when Agency.market_need_score < 40" }
      - { name: status, type: enum, source: system, description: "CANDIDATE | APPOINTED | ACTIVE | TRANSITIONING | PENDING_TERMINATION | TERMINATED", constraints: "enum {CANDIDATE, APPOINTED, ACTIVE, TRANSITIONING, PENDING_TERMINATION, TERMINATED}" }
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; the agency this agent is contracted to (null until transitioned)" }
      - { name: is_new_agent, type: boolean, source: computed, description: "true for the first 24 months from appointment_date" }
      - { name: appointment_date, type: datetime, source: system, description: "Stamped when the agreement transcribes to ACTIVE" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policy_number, type: string, source: input, description: "Company policy number", constraints: "unique across all policies" }
      - { name: product_line, type: enum, source: input, description: "AUTO | HOME | LIFE", constraints: "enum {AUTO, HOME, LIFE}" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Annualized premium of the policy in cents" }
      - { name: is_new_business, type: boolean, source: input, description: "true when first-year new business; false for renewal" }
      - { name: status, type: enum, source: system, description: "OPEN | LAPSED | CANCELLED | TRANSFERRED", constraints: "enum {OPEN, LAPSED, CANCELLED, TRANSFERRED}" }
      - { name: holder_agent_id, type: string, source: system, description: "FK -> Agent.id; the writing agent currently holding the policy" }
      - { name: owner_agency_id, type: string, source: system, description: "FK -> Agency.id; the company-owned booking agency of the policy" }
      - { name: book_transfer_id, type: string, source: system, description: "FK -> BookTransfer.id; the transfer that reassigned this policy (null if never reassigned)" }
      - { name: first_written_at, type: datetime, source: system, description: "Timestamp the policy was first created; the chronological tie-break key" }
      - { name: paid_claims_cents, type: integer, source: computed, description: "Sum of policy_paid_cents over linked Claims" }
      - { name: sub_producer_released_commission_cents, type: integer, source: computed, description: "20% of the agency's house half already released to the sub-producer; reduced by resolution chargebacks" }

  - name: Agreement
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; the agent this agreement governs" }
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; the agency the agreement binds the agent to" }
      - { name: agreement_type, type: enum, source: input, description: "EXCLUSIVE_AGENT | TEAM_MEMBER", constraints: "enum {EXCLUSIVE_AGENT, TEAM_MEMBER}" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | ACTIVE | SUSPENDED | TERMINATED | TRANSITIONING", constraints: "enum {DRAFT, UNDER_REVIEW, ACTIVE, SUSPENDED, TERMINATED, TRANSITIONING}" }
      - { name: commission_schedule, type: object, source: input, description: "Per-line, per-business-type rates INPUT BY THE CLIENT at transcription, e.g. {AUTO: {new: 0.15, renewal: 0.10}, HOME: {...}, LIFE: {...}}; never computed by the server" }
      - { name: marketing_allowance_pool_cents, type: integer, source: computed, description: "Allowance pool = min(min(exposure_inforce_cents*0.04, 250000) + allowance_carryover_cents, 400000)" }
      - { name: marketing_allowance_spent_cents, type: integer, source: computed, description: "Sum of marketing_allowance_cents over PARTICIPATED Campaigns for the agency" }
      - { name: allowance_carryover_cents, type: integer, source: computed, description: "Unused allowance carried into the following term; adjustment leads balance" }
      - { name: license_verified_at, type: datetime, source: system, description: "Stamped by read_license; null until first read" }
      - { name: termination_initiated_at, type: datetime, source: system, description: "Stamped when cessation is posted" }
      - { name: termination_value_cents, type: integer, source: computed, description: "Contract value of the book on termination; never negative (floor 0)" }

  - name: StaffMember
    parent: Agency
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Team member legal name" }
      - { name: role_title, type: string, source: input, description: "Team member role title" }
      - { name: allocation_units, type: integer, source: input, description: "Work allocation units (10 units == one FTE)", constraints: "1 <= value <= 20" }
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; the agency the member is appointed under" }
      - { name: sponsoring_agreement_id, type: string, source: system, description: "FK -> Agreement.id; the sponsoring agent agreement" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | TERMINATED", constraints: "enum {PENDING, ACTIVE, TERMINATED}" }
      - { name: allocated_agent_id, type: string, source: system, description: "FK -> Agent.id; the agent under whom the member was appointed at activation" }
      - { name: assignment_start_date, type: datetime, source: input, description: "Start of the member's booked assignment window (closed interval)" }
      - { name: assignment_end_date, type: datetime, source: input, description: "End of the member's booked assignment window (closed interval)" }

  - name: MarketingCampaign
    parent: Agency
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; the sponsoring agency" }
      - { name: campaign_type, type: enum, source: input, description: "LEAD_PROGRAM | BRAND | COMMUNITY", constraints: "enum {LEAD_PROGRAM, BRAND, COMMUNITY}" }
      - { name: marketing_allowance_cents, type: integer, source: input, description: "Allowance drawn down by this campaign", constraints: ">= 0" }
      - { name: expected_leads, type: integer, source: input, description: "Projected lead volume" }
      - { name: status, type: enum, source: system, description: "PLANNED | PARTICIPATED | CANCELLED", constraints: "enum {PLANNED, PARTICIPATED, CANCELLED}" }
      - { name: participation_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN; derived from the parent agency status, gates every campaign write" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; the policy the claim is filed against" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Gross claim reserve in cents" }
      - { name: policy_paid_cents, type: integer, source: computed, description: "Amount actually paid; may differ from the reserve because of deductibles" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | DENIED | CANCELLED", constraints: "enum {OPEN, PAID, DENIED, CANCELLED}" }

  - name: BookTransfer
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; the transitioning agent whose book moves" }
      - { name: from_agency_id, type: string, source: input, description: "FK -> Agency.id; the agency the book leaves" }
      - { name: to_agency_id, type: string, source: input, description: "FK -> Agency.id; the agency the book enters" }
      - { name: successor_agent_id, type: string, source: computed, description: "FK -> Agent.id; the successor selected by §1.3m, or null while pending" }
      - { name: transferred_policy_count, type: integer, source: computed, description: "Policies reassigned by this transfer; recomputed by run_ops" }
      - { name: retained_policy_count, type: integer, source: computed, description: "Transferred policies still OPEN and held by the successor; recomputed by run_ops" }
      - { name: retention_pct, type: number, source: computed, description: "retained_policy_count / transferred_policy_count * 100, round_half_up" }
      - { name: retention_met, type: boolean, source: computed, description: "true when retention_pct >= 85" }
      - { name: settlement_payable_cents, type: integer, source: computed, description: "book_transfer_settlement payable to the transferring agency" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED | REVERSED", constraints: "enum {PENDING, SETTLED, REVERSED}" }

  - name: LicenseRecord
    parent: Agent
    common_fields: false
    fields:
      - { name: full_name, type: string, source: input, description: "Licensed individual name" }
      - { name: state_code, type: string, source: input, description: "State of the license" }
      - { name: product_lines, type: array, source: input, description: "Product lines the license covers" }
      - { name: license_expiry_date, type: datetime, source: input, description: "Expiry date the agent record reads" }

  - name: AppointmentApplication
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State the appointment is requested for" }
      - { name: market_need_score, type: integer, source: input, description: "Market-need score considered for this application", constraints: "0 <= value <= 100" }
      - { name: candidate_assessment_score, type: integer, source: input, description: "Company candidate-assessment score", constraints: "0 <= value <= 100" }
      - { name: market_odds_score, type: integer, source: input, description: "Company market-odds score for the territory", constraints: "0 <= value <= 100" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SCORED | REJECTED | APPROVED | CONSUMED", constraints: "enum {SUBMITTED, SCORED, REJECTED, APPROVED, CONSUMED}" }
      - { name: required_action, type: enum, source: computed, description: "PROCEED | MARKET_ANALYSIS_REQUIRED | REJECT; recomputed on every assessment", constraints: "enum {PROCEED, MARKET_ANALYSIS_REQUIRED, REJECT}" }
      - { name: appointment_priority, type: integer, source: computed, description: "Weighted score used to rank applications", constraints: "0 <= value <= 100" }
      - { name: application_value_tier, type: enum, source: computed, description: "STANDARD | PREMIUM; derived from appointment_priority", constraints: "enum {STANDARD, PREMIUM}" }
      - { name: creation_channel, type: enum, source: input, description: "DIGITAL | FIELD; fixed at creation and immutable", constraints: "enum {DIGITAL, FIELD}" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; the appointed agent produced by this application (null until appointed)" }
      - { name: closure_note, type: string, source: input, description: "Optional note captured when the application is rejected" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AppointmentApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, CONSUMED]
    transitions:
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /agency-network/appointment-applications/{id}/assess"
        actor: FieldManager
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "recompute appointment_priority (§1.3)"
          - "recompute required_action (§1.3)"
          - "recompute application_value_tier (§1.3)"
      - from: SCORED
        to: SCORED
        trigger: "POST /agency-network/appointment-applications/{id}/assess"
        actor: FieldManager
        preconditions:
          - "application.status == SCORED"
        side_effects:
          - "recompute appointment_priority (§1.3); re-assessment is idempotent on derived values"
      - from: SCORED
        to: APPROVED
        trigger: "POST /agency-network/appointment-applications/{id}/approve"
        actor: AppointingExecutive
        preconditions:
          - "application.status == SCORED"
          - "application.required_action == PROCEED"
        side_effects:
          - "application.status := APPROVED"
      - from: SCORED
        to: REJECTED
        trigger: "POST /agency-network/appointment-applications/{id}/reject"
        actor: AppointingExecutive
        preconditions:
          - "application.status == SCORED"
        side_effects:
          - "application.closure_note := request note"
      - from: APPROVED
        to: CONSUMED
        trigger: "POST /agency-network/appointment-applications/{id}/appoint"
        actor: FieldManager
        side_effects:
          - "mint Agent from the application (status := APPOINTED, is_new_agent := true)"
          - "CASCADE depth 2: Agent.APPOINTED→TRANSITIONING is invoked by the ops run when a book is ready; only then does Agent.agency_id get bound"
          - "application.agent_id := new Agent.id"

  - entity: Agent
    initial_state: CANDIDATE
    terminal_states: [TERMINATED]
    transitions:
      - from: CANDIDATE
        to: APPOINTED
        trigger: "POST /agency-network/appointment-applications/{id}/appoint (mints the Agent)"
        actor: FieldManager
        preconditions:
          - "application.required_action == PROCEED"
          - "application.status == APPROVED"
        side_effects:
          - "Agent.status := APPOINTED"
      - from: APPOINTED
        to: TRANSITIONING
        trigger: "POST /agency-network/agents/{id}/transition-book"
        actor: FieldManager
        preconditions:
          - "agent.is_new_agent == true"
          - "agent.license_status == LICENSED (read via POST /agency-network/agents/{id}/read-license against the state LicenseRecord)"
          - "target agency.status == ACTIVE"
          - "agency.agency_level_units < 12 (agency staffing cap)"
        side_effects:
          - "agent.agency_id := target agency"
          - "recompute Agency.agency_level_units (§1.3)"
          - "CASCADE depth 3 on contract termination only (see cessation); transition itself has no firm cascade"
      - from: TRANSITIONING
        to: ACTIVE
        trigger: "POST /agency-network/agreements/{id}/transcribe"
        actor: FieldManager
        preconditions:
          - "agreement.status == UNDER_REVIEW"
          - "agreement.agreement_type == EXCLUSIVE_AGENT"
          - "agreement.commission_schedule includes a non-null {new, renewal} rate pair for AUTO, HOME and LIFE"
          - "agent.license_status == LICENSED"
        side_effects:
          - "agent.appointment_date := clock now"
          - "agent.status := ACTIVE"
          - "agreement.status := ACTIVE"
          - "recompute direct_additions_commission_cents (§1.3a)"
          - "recompute Agent.is_new_agent (§1.3f)"
          - "recompute Agency.book_open_count via recompute_agency (§1.3v)"
          - "recompute Agency.exposure_inforce_cents via recompute_agency (§1.3v)"
          - "recompute Agency.annualized_commission_cents via recompute_agency (§1.3v)"
          - "recompute direct_additions_revenue_cents (§1.3c)"
      - from: ACTIVE
        to: PENDING_TERMINATION
        trigger: "POST /agency-network/agents/{id}/cessation"
        actor: AgencyPrincipal
        preconditions:
          - "agent.status == ACTIVE"
        side_effects:
          - "stamp agreement.termination_initiated_at"
          - "agreement.status := SUSPENDED"
          - "CASCADE depth 2: reclaim_book then expires_active_agreements"
          - "PENDING_TERMINATION→TRANSITIONING is invoked by the ops run once a successor agency exists"
          - "recompute contract_value_cents (§1.3j)"
      - from: PENDING_TERMINATION
        to: TRANSITIONING
        trigger: "system event — POST /agency-network/agencies/{id}/run_ops (when a same-region ACTIVE agency with agency_level_units < 12 exists)"
        actor: system
        preconditions:
          - "agent.status == PENDING_TERMINATION"
          - "at least one candidate agency with status == ACTIVE and agency_level_units < 12 in the agent's own region"
        side_effects:
          - "recompute successor selection (§1.3m) — the cascade retarget lock"
          - "recompute retention_threshold_check (§1.3o)"
      - from: TRANSITIONING
        to: TERMINATED
        trigger: "POST /agency-network/agents/{id}/complete-reassignment"
        actor: FieldManager
        preconditions:
          - "agent.status == TRANSITIONING"
          - "all Policies with holder_agent_id == agent.id have status TRANSFERRED"
        side_effects:
          - "agent.status := TERMINATED"

  - entity: Agreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /agency-network/agreements"
        actor: FieldManager
        side_effects:
          - "agreement.status := UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /agency-network/agreements/{id}/transcribe"
        actor: FieldManager
        preconditions:
          - "agent.license_status == LICENSED"
          - "owner agent.status == TRANSITIONING"
        side_effects:
          - "agent: TRANSITIONING→ACTIVE (cross-entity bubble-up)"
          - "agreement.license_verified_at := clock now"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agency-network/agencies/{id}/run_ops (when the licensing sweep finds license_status != LICENSED)"
        actor: system
        side_effects:
          - "agent.status := PENDING_TERMINATION"
          - "StaffMember rows under this agency with status ACTIVE → TERMINATED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agency-network/agents/{id}/cessation"
        actor: AgencyPrincipal
        preconditions:
          - "the owner agent is in status ACTIVE"
        side_effects:
          - "stamp termination_initiated_at"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /agency-network/agencies/{id}/run_ops (expires_active_agreements)"
        actor: system
        side_effects:
          - "StaffMember rows under the agency with status ACTIVE → TERMINATED"

  - entity: StaffMember
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /agency-network/staff/{id}/appoint"
        actor: AgencyPrincipal
        preconditions:
          - "the sponsoring agreement (StaffMember.sponsoring_agreement_id) is in status ACTIVE"
          - "the sponsoring agreement's owner Agent.status == ACTIVE"
          - "member.allocated_agent_id resolves to an Agent whose license_status == LICENSED"
        side_effects:
          - "member.allocated_agent_id := the agent allocated at appointment"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agency-network/agencies/{id}/run_ops (agency AGENCY_TERMINATED_REGION sweep)"
        actor: system
        side_effects:
          - "CASCADE hop 1: Agency.agency_level_units is recomputed (§1.3v)"
          - "CASCADE hop 2: staffing_reimbursement is recomputed from the recomputed agency_level_units (§1.3d)"

  - entity: LicenseRecord
    initial_state: LICENSED
    terminal_states: [EXPIRED, SUSPENDED]
    transitions:
      - from: LICENSED
        to: EXPIRED
        trigger: "POST /agency-network/_clock/set_current_utc (logic: appointment duties locked when license_expiry_date < current_utc)"
        actor: system
        side_effects:
          - "on the next POST /agency-network/agents/{id}/cessation, compute cessation_bonus_cents (§1.3i) = 0"
      - from: LICENSED
        to: SUSPENDED
        trigger: "POST /agency-network/license-records (logic: the state suspends the license by posting a SUSPENDED record)"
        actor: RegulatoryBoard
        side_effects:
          - "the sponsoring agreement's next ops sweep suspends the agency agreement"

  - entity: MarketingCampaign
    initial_state: PLANNED
    terminal_states: [PARTICIPATED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PLANNED
        trigger: "PUT /agency-network/agencies/{id}/marketing-campaigns/{cid} (while the parent agency is APPROVED or ACTIVE)"
        actor: AgencyPrincipal
        preconditions:
          - "campaign.participation_posture == OPEN"
        side_effects:
          - "campaign fields updated in place"
      - from: PLANNED
        to: PARTICIPATED
        trigger: "POST /agency-network/agencies/{id}/marketing-campaigns/{cid}/participate"
        actor: AgencyPrincipal
        preconditions:
          - "campaign.participation_posture == OPEN"
          - "marketing_allowance_pool_cents - marketing_allowance_spent_cents >= campaign.marketing_allowance_cents"
        side_effects:
          - "recompute marketing_allowance_utilization (§1.3e)"
          - "CASCADE depth 2: agreement.marketing_allowance_spent_cents := previous + campaign.marketing_allowance_cents; allowance_carryover_cents := recompute_agency per §1.3v"
      - from: PLANNED
        to: CANCELLED
        trigger: "DELETE /agency-network/agencies/{id}/marketing-campaigns/{cid}"
        actor: AgencyPrincipal
        preconditions:
          - "campaign.status == PLANNED"
        side_effects:
          - "none (no allowance is debited)"

  - entity: Policy
    initial_state: OPEN
    terminal_states: [CANCELLED, TRANSFERRED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /agency-network/agents/{id}/policies/{pid}/cessation (reassign to a successor agent)"
        actor: FieldManager
        preconditions:
          - "policy.holder_agent_id == the ceasing agent"
          - "policy.status == OPEN"
        side_effects:
          - "policy.holder_agent_id := successor agent.id"
          - "policy.owner_agency_id := successor agency.id"
          - "policy.first_written_at unchanged (transfer preserves the original tie-break key)"
      - from: OPEN
        to: TRANSFERRED
        trigger: "POST /agency-network/agents/{id}/complete-reassignment"
        actor: FieldManager
        preconditions:
          - "policy.status == OPEN"
        side_effects:
          - "recompute Agent.TRANSITIONING→TERMINATED when no OPEN policies remain for the agent"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /agency-network/policies/{id}/cancel"
        actor: AgencyPrincipal
        side_effects:
          - "recompute Agency.book_open_count (§1.3v)"
          - "recompute Agency.exposure_inforce_cents (§1.3v)"

  - entity: Claim
    initial_state: OPEN
    terminal_states: [PAID, DENIED, CANCELLED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /agency-network/claims/{id}/settle"
        actor: ClaimsAdjuster
        side_effects:
          - "policy_paid_cents := min(claim_amount_cents, policy.annual_premium_cents * 0.80), rounded half-up to cents"
          - "CASCADE hop 1: the owning Policy.paid_claims_cents is recomputed from its Claims"
          - "CASCADE hop 2: Agency.agency_paid_claims_cents is recomputed from its Policies"
          - "CASCADE hop 3: Agency.loss_ratio is recomputed from agency_paid_claims_cents and exposure_inforce_cents"
          - "CASCADE hop 4: Agency.performance_status is recomputed by the ordered IF/ELIF of §1.3"
      - from: PAID
        to: OPEN
        trigger: "POST /agency-network/claims/{id}/resolve"
        actor: ClaimsAdjuster
        side_effects:
          - "CASCADE depth 3 -> recompute loss_ratio (§1.3k), then termination_value_cents (§1.3j), then agency_valuation (§1.3l)"
      - from: OPEN
        to: DENIED
        trigger: "POST /agency-network/claims/{id}/deny"
        actor: ClaimsAdjuster
        side_effects:
          - "policy_paid_cents := 0"
          - "CASCADE depth 3 -> re-evaluate loss_ratio (§1.3k) → termination_value (§1.3j) → agency_valuation (§1.3l)"
      - from: PAID
        to: OPEN
        trigger: "POST /agency-network/agencies/{id}/run_ops (ops run shelf-reopens a PAID claim whose policy was restored)"
        actor: system
        side_effects:
          - "policy_paid_cents := 0"
          - "recompute expiration / loss ratio for the agency"

  - entity: Agency
    initial_state: APPROVED
    terminal_states: [TERMINATED]
    transitions:
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /agency-network/agencies/{id}/activate"
        actor: AppointingExecutive
        side_effects:
          - "agency.term_start_date := clock now"
          - "ops_run_index := 0"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agency-network/agencies/{id}/terminate"
        actor: AppointingExecutive
        preconditions:
          - "every Agent with agency_id == agency.id has status in {PENDING_TERMINATION, TERMINATED}"
        side_effects:
          - "CASCADE depth 3: each StaffMember under the agency → TERMINATED, which recomputes agency_level_units and staffing_reimbursement"
          - "every MarketingCampaign under the agency → CANCELLED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: campaign-allowance-stale-pool
    parent_entity: Agency
    write_endpoint: "POST /agency-network/agencies/{id}/marketing-campaigns/{cid}/participate"
    occ_field: "expected_agency_version"
    description: |
      A campaign participation posted with a stale expected_agency_version is
      rejected, because a prior participation on this agency advanced the
      allowance pool that the client last observed. A sequential re-send carrying
      the older version observes the advanced agency.version and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-transcribe-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /agency-network/agreements/{id}/transcribe"
    occ_field: "expected_agent_version"
    description: |
      Transcribing an agreement into ACTIVE against an agent whose version has
      advanced since the client last read it is rejected under the same §3.4
      supersede semantics. The second sequential request still carries the stale
      expected_agent_version and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: appointment_priority
    trigger: "when POST /agency-network/appointment-applications/{id}/assess runs"
    algorithm: weighted_scoring
    formula: |
      appointment_priority = round_half_up(
          0.4 * market_odds_score
        + 0.3 * candidate_assessment_score
        + 0.3 * market_need_score)
      # weights must sum to exactly 1.0
    input_set: "the AppointmentApplication being assessed"
    constants:
      W_ODDS: 0.40
      W_ASSESSMENT: 0.30
      W_MARKET_NEED: 0.30
    precision: "integer, round_half_up"
    variants:
      - name: whole_point_weighting
        when: "the 0.4/0.3/0.3 weighting round"
        difference: "the three scores are closed at whole points and summed without intermediate floats; ties are then broken deterministically by created_at"
      - name: weighted_float
        when: "an implementation that divides first and rounds last"
        difference: "floating-point halves (e.g. 32.5) round differently; the scaffold pins round_half_up on the final sum"

  - name: required_action
    trigger: "when POST /agency-network/appointment-applications/{id}/assess runs"
    algorithm: threshold
    formula: |
      if market_odds_score < 40 OR candidate_assessment_score < 40:
          required_action = REJECT
      elif market_odds_score > 70 AND candidate_assessment_score > 70:
          required_action = PROCEED
      elif 60 <= market_odds_score <= 70 OR 60 <= candidate_assessment_score <= 70:
          required_action = MARKET_ANALYSIS_REQUIRED
      else:
          required_action = REJECT
    input_set: "the AppointmentApplication being assessed"
    constants:
      FLOOR: 40
      HIGH_STRICT: 70
      MID_INCLUSIVE: 60
    precision: "enum output — no rounding"
    variants:
      - name: strict_high_gate
        when: "both scores > 70"
        difference: "PROCEED requires strictly greater-than 70 on both scores; a score of exactly 70 falls to MARKET_ANALYSIS_REQUIRED"
      - name: inclusive_mid_gate
        when: "either score in [60, 70]"
        difference: "the middle band is closed on both ends, unlike the open high band"

  - name: application_value_tier
    trigger: "when POST /agency-network/appointment-applications/{id}/assess runs"
    algorithm: threshold
    formula: |
      if appointment_priority >= 80: application_value_tier = PREMIUM
      else: application_value_tier = STANDARD
    input_set: "the AppointmentApplication being assessed"
    constants:
      PREMIUM_THRESHOLD: 80
    precision: "enum output — no rounding"
    variants:
      - name: score_based
        when: "the priority score is the only input"
        difference: "PREMIUM is granted at score 80 exactly (>=), not 81"
      - name: flat_standard
        when: "an implementation that ignores the threshold"
        difference: "applying STANDARD at score 80 diverges from the >= boundary"

  - name: direct_additions_commission_cents
    trigger: "when an Agreement transcribes ACTIVE (per policy, aggregated at transcribe)"
    algorithm: aggregation
    formula: |
      FOR policy IN [Policies where owner_agency_id == agency.id
                     AND is_new_business == true
                     AND status == OPEN
                     ORDER BY first_written_at ASC, policy_number ASC]:
          rate = agreement.commission_schedule[policy.product_line]["new"]
          line_commission = round_half_up(policy.annual_premium_cents * rate)
      # each policy contributes its own rounded line_commission
      direct_additions_commission_cents = SUM(line_commission)
    input_set: "Policies of the agency with is_new_business == true and status == OPEN"
    constants:
      ORDER: "first_written_at ASC, then policy_number ASC as tie-break"
    precision: "per-policy round_half_up to cents, then sum"
    variants:
      - name: per_policy_rounding
        when: "each line is rounded before summing"
        difference: "AUTO 100,000 @ 0.15 = 15,000.00 and HOME 90,000 @ 0.12 = 10,800.00 sum to 25,800.00"
      - name: sum_then_round
        when: "rates are applied to the aggregate then rounded once"
        difference: "aggregating first can drift by a cent when rates are fractional; the scaffold pins per-policy rounding"

  - name: renewal_commission_cents
    trigger: "when an Agreement transcribes ACTIVE"
    algorithm: aggregation
    formula: |
      FOR policy IN [Policies where owner_agency_id == agency.id
                     AND is_new_business == false
                     AND status == OPEN
                     ORDER BY first_written_at ASC, policy_number ASC]:
          rate = agreement.commission_schedule[policy.product_line]["renewal"]
          line_commission = round_half_up(policy.annual_premium_cents * rate)
      renewal_commission_cents = SUM(line_commission)
    input_set: "Policies of the agency with is_new_business == false and status == OPEN"
    constants:
      ORDER: "first_written_at ASC, then policy_number ASC as tie-break"
    precision: "per-policy round_half_up to cents, then sum"
    variants:
      - name: renewal_rates
        when: "is_new_business == false"
        difference: "renewal lines use the schedule's renewal rate, never the new-business rate"
      - name: blended_rate
        when: "an implementation that applies one blended rate"
        difference: "blending diverges whenever renewal != new for any line"

  - name: staffing_reimbursement
    trigger: "when a StaffMember transitions to ACTIVE or TERMINATED"
    algorithm: aggregation
    formula: |
      staffing_reimbursement_cents = min(
          SUM over StaffMember m with m.agency_id == agency.id AND m.status == ACTIVE:
              round_half_up(m.allocation_units * 1.00),
          500.00)
    input_set: "StaffMember rows under the agency with status ACTIVE"
    constants:
      UNIT_ALLOWANCE_CENTS: 1.00
      CAP_CENTS: 500.00
    precision: "2 decimal places, round_half_up, then capped"
    variants:
      - name: capped_total
        when: "the summed allocation exceeds the cap"
        difference: "the total is capped at 500.00 before it is exposed"
      - name: uncapped_total
        when: "an implementation that caps per-member instead of the total"
        difference: "two members of 8 units each give 16.00 either way, but 400 members would diverge; the scaffold pins the total-cap interpretation"

  - name: marketing_allowance_utilization
    trigger: "when a MarketingCampaign participates or a recompute_agency runs for the agency"
    algorithm: direct_leading
    formula: |
      pool_base = min(round_half_up(agency.exposure_inforce_cents * 0.04), 250000.00)
      marketing_allowance_pool_cents = min(pool_base + agreement.allowance_carryover_cents, 400000.00)
      allowance_carryover_cents = marketing_allowance_pool_cents - agreement.marketing_allowance_spent_cents
    input_set: "Policies with status OPEN under the agency, plus that agreement's participation ledger"
    constants:
      RATE: 0.04
      EXPOSURE_CAP_CENTS: 250000.00
      POOL_CAP_CENTS: 400000.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: carryover_adjustment_leading
        when: "the character string is built from a leading adjustment"
        difference: "the carryover is the pool minus spend; the pool itself is never negative and never exceeds 400,000.00"
      - name: exposure_only
        when: "an implementation that forgets the prior carryover"
        difference: "exposure 3,000,000 with carryover 25,000 yields pool 145,000.00, whereas exposure-only yields 120,000.00"

  - name: retention_threshold_check
    trigger: "when POST /agency-network/_clock/set_current_utc is called, or POST /agency-network/agencies/{id}/run_ops runs"
    algorithm: threshold
    formula: |
      scope = [Policies where book_transfer_id references a transfer whose
               to_agency_id == agency.id]
      retained = count(p in scope where p.holder_agent_id is the successor)
      retention_pct = round_half_up(retained / count(scope) * 100)
      met = (retention_pct >= 85)
    input_set: "Policies attached to a completed book transfer targeting a to_agency_id"
    constants:
      TARGET_PCT: 85
    precision: "2 decimal places, round_half_up"
    variants:
      - name: successor_holding
        when: "the policy still has the successor agent"
        difference: "44 of 50 retained at 88.00% meets the target"
      - name: book_agency_only
        when: "an implementation that counts by agency rather than successor"
        difference: "counting any OPEN policy at the agency can inflate retention when the agent left"

  - name: cessation_bonus_cents
    trigger: "when POST /agency-network/agents/{id}/cessation runs for an agreement at least 12 months old"
    algorithm: aggregation
    formula: |
      IF (current_utc - agreement.created_at) < 12 months:
          cessation_bonus_cents = 0
      ELSE:
          cessation_bonus_cents = round_half_up(10 * staff_count)
      # staff_count = count of StaffMember rows with agency_id == agent.agency_id
      #               AND status == ACTIVE at cessation time
    input_set: "the ceasing agent's sponsor agency staff"
    constants:
      PER_STAFF_CENTS: 10.00
      MIN_MONTHS: 12
    precision: "2 decimal places, round_half_up"
    variants:
      - name: eligible
        when: "the agreement is >= 12 months old"
        difference: "with 5 active staff the bonus is 50.00"
      - name: ineligible
        when: "the agreement is < 12 months old"
        difference: "the bonus is 0.00 regardless of staff count"

  - name: contract_value_cents
    trigger: "when POST /agency-network/agents/{id}/cessation completes"
    algorithm: direct_cascade
    formula: |
      payable = round_half_up(agency.annualized_commission_cents * 1.5)
      contract_value_cents = max(payable + cessation_bonus_cents - agency_paid_claims_cents, 0)
    input_set: "the ceasing agency's trailing 12-month commission and paid claims"
    constants:
      MULTIPLE: 1.5
      FLOOR: 0
    precision: "2 decimal places, round_half_up, floored at 0"
    variants:
      - name: current_book_value
        when: "age >= 5 years"
        difference: "the multiple is 1.5 on the trailing-12-month base"
      - name: legacy_book_value
        when: "age < 5 years"
        difference: "the multiple is 2.0 on the same base, because the book has not yet been seasoned"
    note: "age is measured from appointment_date to current_utc; the floor of 0 is applied last"

  - name: agency_paid_claims_cents
    trigger: "whenever a Claim over the agency's book is compensated (settle / resolve / deny)"
    algorithm: aggregation
    formula: |
      agency_paid_claims_cents = SUM over Claims c with c.policy_id in
          [Policies where owner_agency_id == agency.id]: c.policy_paid_cents
    input_set: "Claims attached to the agency's Policies"
    constants:
      TOTAL_POLICY_CAP_CENTS: 10000000.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: gross_paid
        when: "recoveries have not yet been posted"
        difference: "the full paid amount counts against the agency"
      - name: resolved_recovery
        when: "recoveries are netted back"
        difference: "a resolved claim reduces the total; the scaffold pins the pre-recovery reading"

  - name: loss_ratio
    trigger: "when a Claim transitions PAID or re-opens, or POST /agency-network/claims/{id}/resolve runs"
    algorithm: threshold
    formula: |
      loss_ratio = round_half_up(agency_paid_claims_cents / (exposure_inforce_cents * 0.12) * 100)
      flagged = (loss_ratio > 70)
    input_set: "the agency's paid claims and its OPEN policy exposure"
    constants:
      PREMIUM_BASE_RATE: 0.12
      FLAG_THRESHOLD: 70
    precision: "2 decimal places, round_half_up"
    variants:
      - name: paid_basis
        when: "the ratio uses paid claims"
        difference: "settled claims at the full paid amount drive the ratio"
      - name: reserve_basis
        when: "the ratio uses open reserves"
        difference: "counting OPEN reserves instead of paid amounts diverges whenever a claim is DENIED"

  - name: successor_agent_selection
    trigger: "when POST /agency-network/agents/{id}/complete-reassignment runs for an agency book transfer"
    algorithm: selector
    formula: |
      candidates = Agents a where a.status == ACTIVE
                   AND a.agency_id is an Agency with region_code == ceasing_agency.region_code
                   AND a.id != ceasing_agent.id
      if candidates is empty: raise ERR_NO_SUCCESSOR_AGENT
      rank = descending (a.agency_level_units, a.created_at ASC)
      successor = candidates[0]
    input_set: "Agents in the same region as the ceasing agency"
    constants:
      RANK: "agency_level_units DESC, created_at ASC; id is never a tie-break input"
    precision: "n/a"
    variants:
      - name: region_scoped_successor
        when: "a same-region ACTIVE agent exists"
        difference: "the highest agency_level_units wins, then the earliest created_at"
      - name: same_agency_successor
        when: "only same-agency agents are considered"
        difference: "an agent already on the ceasing book is excluded when a same-region agency agent exists"

  - name: book_transfer_settlement
    trigger: "when POST /agency-network/agents/{id}/transition-book completes"
    algorithm: tiered_pricing
    formula: |
      transferred_base_cents = SUM over transferred Policies p:
          p.annual_premium_cents * 0.10
      transfer_commission_cents = transferred_base_cents * 0.10
      # when the prior agent terminated for cause, if any policy was written less
      # than 24 months before current_utc the transfer commission is NOT payable for it
      settlement_payable_cents = round_half_up(transfer_commission_cents * 0.90)
    input_set: "Policies on the book being transitioned"
    constants:
      BASE_RATE: 0.10
      COMMISSION_RATE: 0.10
      PAYOUT_RATE: 0.90
      EARLY_WRITE_MONTHS: 24
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard
        when: "the prior agent did not terminate for cause"
        difference: "the settlement is payable at 90% of the transfer commission"
      - name: cause_forfeiture
        when: "the prior agent was terminated for cause"
        difference: "EARLY_WRITE_MONTHS is ignored and the settlement is not payable for early-written policies"

  - name: agency_performance_measurement
    trigger: "when POST /agency-network/agencies/{id}/run_ops runs"
    algorithm: sequential_provisional
    formula: |
      # (C1) evaluated strictly top-to-bottom; first match wins
      IF loss_ratio > 70:
          performance_status = AT_RISK
      ELIF growth_new_pct < 0:
          performance_status = BEHIND
      ELSE:
          performance_status = ON_TRACK
      growth_new_pct = round_half_up(
          (annualized_commission_cents - rolling_base_cents)
          / rolling_base_cents * 100)
      rolling_base_cents = SUM over the prior 12 months of the agency's
          established book commission, snapshotted at term_start_date
    input_set: "the agency's trailing-12-month new-business commission and its term-start base"
    constants:
      LOSS_FLAG: 70
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict_precedence
        when: "the ordered IF/ELIF chain is honored"
        difference: "an agency with loss_ratio 80 and growth_new_pct -75 is AT_RISK, never BEHIND"
      - name: independent_metrics
        when: "an implementation evaluates growth first"
        difference: "evaluating growth first mislabels the same agency as BEHIND"

  - name: agency_valuation
    trigger: "when POST /agency-network/agencies/{id}/run_ops runs for an agency with status ACTIVE"
    algorithm: direct_cascade
    formula: |
      agency_valuation_cents = max(
          1000000 + annualized_commission_cents * 1.5 - agency_paid_claims_cents,
          2000000)
    input_set: "the agency's trailing commission and paid claims"
    constants:
      BASE_CENTS: 1000000.00
      MULTIPLE: 1.5
      FLOOR_CENTS: 2000000.00
    precision: "2 decimal places, round_half_up, floored at 2000000.00"
    variants:
      - name: replacement_value
        when: "the book is valued for cash-settlement"
        difference: "the floor of 2,000,000.00 applies whenever the formula implies less"
      - name: distressed_value
        when: "loss_ratio > 70 applies"
        difference: "the multiple collapses to 1.0; the floor still governs"

  - name: recompute_agency
    trigger: "system event — any mutation of the agency's Policies, Agreements or Staff"
    algorithm: recompute
    formula: |
      book_open_count = count(Policies with status == OPEN under agency)
      exposure_inforce_cents = sum(Policies with status == OPEN under agency, annual_premium_cents)
      agency_level_units = count(Agreements in state ACTIVE under agency)
      annualized_commission_cents = sum(commission earned by the agency in the
          current 12-month anniversary term)
      allowance_carryover_cents = recompute from marketing_allowance_utilization (§1.3)
    input_set: "all Policies, Agreements and StaffMembers under the agency"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: full_rebuild
        when: "recomputed from source after any write"
        difference: "every derived field is rebuilt from the current children"
      - name: incremental
        when: "an implementation that adds deltas"
        difference: "deltas drift after compensations; the scaffold pins the full rebuild"

  - name: direct_additions_revenue_cents
    trigger: "when an Agreement transcribes ACTIVE"
    algorithm: aggregation
    formula: |
      direct_additions_revenue_cents = SUM over Policies with
          is_new_business == true and status == OPEN under agency:
          round_half_up(annual_premium_cents * schedule[product_line]["new"])
    input_set: "new-business OPEN policies of the agency"
    constants: {}
    precision: "per-policy round_half_up, then sum"
    variants:
      - name: new_business_only
        when: "is_new_business == true"
        difference: "renewals contribute nothing to this line"
      - name: all_business
        when: "an implementation that includes renewals"
        difference: "including renewals inflates the direct-additions line"

  - name: commission_split_invariant
    trigger: "when a sub-producer's house-half is released to a StaffMember"
    algorithm: aggregation
    formula: |
      split_base_cents = agency split base for the agreement (pinned at 120000.00)
      house_half_cents = round_half_up(split_base_cents * 0.50)
      released_to_subproducer_cents = round_half_up(house_half_cents * 0.20)
      house_remaining_cents = round_half_up(house_half_cents - released_to_subproducer_cents)
      INVARIANT: released_to_subproducer_cents + house_remaining_cents == house_half_cents
    input_set: "the agreement's pinned split base"
    constants:
      SPLIT_BASE_CENTS: 120000.00
      HOUSE_SHARE: 0.50
      SUBPRODUCER_SHARE: 0.20
    precision: "2 decimal places, round_half_up"
    variants:
      - name: law_of_commissions
        when: "after any release or chargeback"
        difference: "the two halves always re-sum to the house half: 12000.00 + 48000.00 == 60000.00"
      - name: intercompany_reallocation
        when: "a different split base is used"
        difference: "a split base of 130000.00 changes both halves but the invariant holds"

  - name: resolution_chargeback
    trigger: "when POST /agency-network/claims/{id}/resolve runs on a PAID claim"
    algorithm: aggregation
    formula: |
      chargeback = policy_paid_cents
      sub_producer_released_commission_cents = max(
          sub_producer_released_commission_cents - chargeback, 0)
    input_set: "the resolved claim and the policy's released commission ledger"
    constants:
      FLOOR: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: full_chargeback
        when: "the claim is fully reversed"
        difference: "the full paid amount is withdrawn from the released ledger"
      - name: partial
        when: "only part of the claim is recovered"
        difference: "the recovered amount reduces the ledger by less; the ledger is never negative"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "the role is permitted for the operation per §1.7 RBAC", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path {id} resources exist, validated left-to-right (agency then agent then agreement then policy then claim)", error_id: ERR_AGENCY_NOT_FOUND, http_status: 404, applies_to: "[agency-scoped endpoints]" }
  - { priority: 3, category: existence, check: "the referenced agent exists", error_id: ERR_AGENT_NOT_FOUND, http_status: 404, applies_to: "[agent-scoped endpoints]" }
  - { priority: 3, category: existence, check: "the referenced agreement exists", error_id: ERR_AGREEMENT_NOT_FOUND, http_status: 404, applies_to: "[agreement-scoped endpoints]" }
  - { priority: 3, category: existence, check: "the referenced policy exists", error_id: ERR_POLICY_NOT_FOUND, http_status: 404, applies_to: "[policy-scoped endpoints]" }
  - { priority: 3, category: existence, check: "the referenced claim exists", error_id: ERR_CLAIM_NOT_FOUND, http_status: 404, applies_to: "[claim-scoped endpoints]" }
  - { priority: 4, category: state, check: "the target resource is in the state required by the transition's `from:`", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "[every POST state-transition endpoint]" }
  - { priority: 4, category: state, check: "the transition is allowed from a terminal state (no transitions out of REJECTED, CONSUMED, TERMINATED, CANCELLED or TRANSFERRED)", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "[every POST state-transition endpoint]" }
  - { priority: 5, category: business_safety, check: "license_status == LICENSED is required for any appointment or book-transition duty; a license with license_expiry_date < current_utc is EXPIRED and blocks the duty", error_id: ERR_LICENSED_REQUIRED, http_status: 400, applies_to: "[POST /agency-network/appointment-applications/{id}/appoint, POST /agency-network/agents/{id}/transition-book, POST /agency-network/agents/{id}/cessation, POST /agency-network/agreements/{id}/transcribe, POST /agency-network/staff/{id}/appoint]" }
  - { priority: 5, category: business_safety, check: "the sponsoring agreement's owner agent must be in a live state (ACTIVE or TRANSITIONING) for a sub-appointment", error_id: ERR_SPONSOR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: "[POST /agency-network/staff, POST /agency-network/staff/{id}/appoint]" }
  - { priority: 6, category: business_constraint, check: "market_need_score <= 40 with a SUPPORT subtype does not fit the territory", error_id: ERR_MARKET_NEED_EXISTS, http_status: 409, applies_to: "[POST /agency-network/appointment-applications/{id}/assess]" }
  - { priority: 6, category: business_constraint, check: "agency staffing cap — the target agency must have agency_level_units < 12 before transition", error_id: ERR_AGENCY_STAFFING_CAP, http_status: 409, applies_to: "[POST /agency-network/agents/{id}/transition-book, POST /agency-network/staff/{id}/appoint]" }
  - { priority: 6, category: business_constraint, check: "product-line coverage — the schedule must include a {new, renewal} pair for AUTO, HOME and LIFE", error_id: ERR_SCHEDULE_MISSING, http_status: 400, applies_to: "[POST /agency-network/agreements, POST /agency-network/agreements/{id}/transcribe]" }
  - { priority: 7, category: business_temporal, check: "the interval [start_date, end_date] of a campaign or appointment must not collide with its siblings", error_id: ERR_INTERVAL_OVERLAP, http_status: 409, applies_to: "[POST /agency-network/agencies/{id}/marketing-campaigns, POST /agency-network/staff/{id}/appoint]" }
  - { priority: 8, category: business_fiscal, check: "the allowance pool remaining is sufficient for the requested participation", error_id: ERR_ALLOWANCE_INSUFFICIENT, http_status: 400, applies_to: "[POST /agency-network/agencies/{id}/marketing-campaigns/{cid}/participate]" }
  - { priority: 8, category: business_fiscal, check: "a stale expected_<parent>_version is rejected before any fiscal computation", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "[agency and agent OCC write endpoints]" }
  - { priority: 9, category: business_referential, check: "the previous holder agent kept zero OPEN policies before termination", error_id: ERR_HOLDING_POLICIES_REMAIN, http_status: 409, applies_to: "[POST /agency-network/agents/{id}/complete-reassignment]" }
  - { priority: 9, category: business_referential, check: "a successor exists when the book transfer demands one", error_id: ERR_NO_SUCCESSOR_AGENT, http_status: 409, applies_to: "[POST /agency-network/agents/{id}/complete-reassignment]" }
  - { priority: 9, category: business_referential, check: "unique policy_number and unique agency_code", error_id: ERR_DUPLICATE_POLICY, http_status: 409, applies_to: "[POST /agency-network/policies]" }
  - { priority: 9, category: business_referential, check: "a retired address could not fit the appointment territory", error_id: ERR_INVALID_TERRITORY, http_status: 400, applies_to: "[POST /agency-network/appointment-applications]" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/agency-network/_clock/set_current_utc", description: "Logical clock control. The server's startup default time is 2026-09-01T00:00:00Z and MUST NOT fall back to real wall-clock time before the first call.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["re-evaluates license expiry and retention/deadline windows"] }
  - { method: POST, path: "/agency-network/_inject/agent", description: "Test-driving endpoint that mints a raw Agent row (identity/config seeding only).", roles: [PlatformAdmin], code: 201, input: [full_name, state_code, license_status, is_new_agent, status], output: Agent, side_effects: ["creates an Agent with the supplied status"] }
  - { method: GET, path: "/agency-network/_envelopes/echo", description: "Diagnostic endpoint that echoes the response envelope; used only as a scaffolding helper.", roles: [PlatformAdmin], code: 200, input: [], output: null, side_effects: [] }
  - { method: POST, path: "/agency-network/agencies", description: "Create an agency in APPROVED status.", roles: [AppointingExecutive], code: 201, input: [agency_code, name, region_code, market_need_score], output: Agency, side_effects: ["recompute_agency"] }
  - { method: GET, path: "/agency-network/agencies", description: "List agencies with filters.", roles: [AppointingExecutive, FieldManager, AgencyPrincipal], code: 200, input: ["status?", "region_code?", "limit?", "offset?"], output: "Agency[]", side_effects: [] }
  - { method: GET, path: "/agency-network/agencies/{id}", description: "Read one agency.", roles: [AppointingExecutive, FieldManager, AgencyPrincipal], code: 200, input: [], output: Agency, side_effects: [] }
  - { method: POST, path: "/agency-network/agencies/{id}/activate", description: "Activate an approved agency.", roles: [AppointingExecutive], code: 200, input: [expected_agency_version], output: Agency, side_effects: ["agency APPROVED->ACTIVE", "stamp term_start_date", "increments Agency.version by 1"] }
  - { method: POST, path: "/agency-network/agencies/{id}/terminate", description: "Terminate an agency once all of its agents have ceased.", roles: [AppointingExecutive], code: 200, input: [], output: Agency, side_effects: ["agency ACTIVE->TERMINATED", "cascade staff to TERMINATED", "cancel marketing campaigns"] }
  - { method: POST, path: "/agency-network/agencies/{id}/run_ops", description: "Run the periodic agency ops sweep: advance ops_run_index, roll the anniversary term, expire active agreements, shelf-reopen settled claims, recompute performance and valuation.", roles: [PlatformAdmin, AppointingExecutive], code: 200, input: [], output: Agency, side_effects: ["ops_run_index increments", "recompute_agency", "expire_active_agreements", "sweep license expiries", "shelf-reopen claims"] }
  - { method: GET, path: "/agency-network/agencies/{id}/performance", description: "Computed read of the agency performance measurement.", roles: [AppointingExecutive, FieldManager, AgencyPrincipal], code: 200, input: [], output: "{ book_open_count: integer, exposure_inforce_cents: number, agency_paid_claims_cents: number, loss_ratio: number, growth_new_pct: number, performance_status: string, agency_valuation_cents: number }", side_effects: [] }
  - { method: POST, path: "/agency-network/agencies/{id}/marketing-campaigns", description: "Create a marketing campaign under the agency.", roles: [AgencyPrincipal], code: 201, input: [campaign_type, marketing_allowance_cents, expected_leads, start_date, end_date], output: MarketingCampaign, side_effects: ["participation_posture derived from agency status"] }
  - { method: GET, path: "/agency-network/agencies/{id}/marketing-campaigns", description: "List the agency's marketing campaigns.", roles: [AgencyPrincipal, FieldManager, AppointingExecutive], code: 200, input: [], output: "MarketingCampaign[]", side_effects: [] }
  - { method: GET, path: "/agency-network/agencies/{id}/marketing-campaigns/{cid}", description: "Read one campaign.", roles: [AgencyPrincipal, FieldManager, AppointingExecutive], code: 200, input: [], output: MarketingCampaign, side_effects: [] }
  - { method: PUT, path: "/agency-network/agencies/{id}/marketing-campaigns/{cid}", description: "Update an editable (PLANNED) campaign.", roles: [AgencyPrincipal], code: 200, input: ["marketing_allowance_cents?", "expected_leads?"], output: MarketingCampaign, side_effects: ["campaign fields updated in place"] }
  - { method: POST, path: "/agency-network/agencies/{id}/marketing-campaigns/{cid}/participate", description: "Participate a campaign, drawing down the allowance pool.", roles: [AgencyPrincipal], code: 200, input: [expected_agency_version], output: MarketingCampaign, side_effects: ["campaign PLANNED->PARTICIPATED", "recompute marketing_allowance_spent_cents", "increments Agency.version by 1"] }
  - { method: DELETE, path: "/agency-network/agencies/{id}/marketing-campaigns/{cid}", description: "Cancel a planned campaign.", roles: [AgencyPrincipal], code: 204, input: [], output: null, side_effects: ["campaign PLANNED->CANCELLED"] }
  - { method: POST, path: "/agency-network/appointment-applications", description: "Submit an appointment application.", roles: [FieldManager], code: 201, input: [state_code, market_need_score, candidate_assessment_score, market_odds_score, creation_channel], output: AppointmentApplication, side_effects: ["status := SUBMITTED"] }
  - { method: GET, path: "/agency-network/appointment-applications", description: "List appointment applications.", roles: [FieldManager, AppointingExecutive], code: 200, input: ["status?", "agent_id?", "limit?", "offset?"], output: "AppointmentApplication[]", side_effects: [] }
  - { method: GET, path: "/agency-network/appointment-applications/{id}", description: "Read one application.", roles: [FieldManager, AppointingExecutive], code: 200, input: [], output: AppointmentApplication, side_effects: [] }
  - { method: POST, path: "/agency-network/appointment-applications/{id}/assess", description: "Score the application and derive its priority / action / tier.", roles: [FieldManager], code: 200, input: [], output: AppointmentApplication, side_effects: ["application SUBMITTED->SCORED", "recompute appointment_priority, required_action, application_value_tier"] }
  - { method: POST, path: "/agency-network/appointment-applications/{id}/approve", description: "Approve a scored application.", roles: [AppointingExecutive], code: 200, input: [], output: AppointmentApplication, side_effects: ["application SCORED->APPROVED"] }
  - { method: POST, path: "/agency-network/appointment-applications/{id}/reject", description: "Reject a scored application.", roles: [AppointingExecutive], code: 200, input: ["closure_note?"], output: AppointmentApplication, side_effects: ["application SCORED->REJECTED"] }
  - { method: POST, path: "/agency-network/appointment-applications/{id}/appoint", description: "Mint the agent from an approved application.", roles: [FieldManager], code: 201, input: [], output: Agent, side_effects: ["application APPROVED->CONSUMED", "mint Agent in APPOINTED", "license_status := NOT_LICENSED"] }
  - { method: GET, path: "/agency-network/agents", description: "List agents with filters.", roles: [FieldManager, AppointingExecutive, AgencyPrincipal], code: 200, input: ["status?", "state_code?", "agency_id?", "limit?", "offset?"], output: "Agent[]", side_effects: [] }
  - { method: GET, path: "/agency-network/agents/{id}", description: "Read one agent.", roles: [FieldManager, AppointingExecutive, AgencyPrincipal], code: 200, input: [], output: Agent, side_effects: [] }
  - { method: POST, path: "/agency-network/agents/{id}/read-license", description: "Read the agent's license from the state board and refresh license_status and license_expiry_date.", roles: [FieldManager, PlatformAdmin], code: 200, input: [license_expiry_date, "product_lines?"], output: Agent, side_effects: ["upsert LicenseRecord; set Agent.license_status to LICENSED", "stamp agreement.license_verified_at"] }
  - { method: POST, path: "/agency-network/agents/{id}/transition-book", description: "Transition a new agent onto an agency's book.", roles: [FieldManager], code: 200, input: [agency_id, expected_agent_version], output: Agent, side_effects: ["agent APPOINTED->TRANSITIONING", "bind agency_id", "recompute Agency.agency_level_units", "increments Agent.version by 1"] }
  - { method: POST, path: "/agency-network/agents/{id}/cessation", description: "Post the cessation of an active agent.", roles: [AgencyPrincipal], code: 200, input: [last_day_iso8601], output: Agent, side_effects: ["agent ACTIVE->PENDING_TERMINATION", "agreement := SUSPENDED", "recompute contract_value_cents"] }
  - { method: POST, path: "/agency-network/agents/{id}/policies/{pid}/cessation", description: "Reassign one policy of a ceasing agent.", roles: [FieldManager], code: 200, input: [successor_agent_id], output: Policy, side_effects: ["reassign holder_agent_id and owner_agency_id", "recompute transfer value"] }
  - { method: POST, path: "/agency-network/agents/{id}/complete-reassignment", description: "Finalize the reassignment once the ceasing agent holds no open policies.", roles: [FieldManager], code: 200, input: [], output: Agent, side_effects: ["policies OPEN->TRANSFERRED", "agent -> TERMINATED"] }
  - { method: GET, path: "/agency-network/agents/{id}/staff", description: "List the team members allocated to an agent (reverse lookup of StaffMember.allocated_agent_id).", roles: [AppointingExecutive, FieldManager, AgencyPrincipal], code: 200, input: ["status?", "limit?", "offset?"], output: "StaffMember[]", side_effects: [] }
  - { method: POST, path: "/agency-network/agents/{id}/book-transfer", description: "Post a book transfer for a transitioning agent.", roles: [AgencyPrincipal, FieldManager], code: 200, input: [from_agency_id, to_agency_id], output: BookTransfer, side_effects: ["recompute book_transfer_settlement", "recompute retention_threshold_check"] }
  - { method: GET, path: "/agency-network/agents/{id}/book-transfers", description: "List the book transfers attached to an agent.", roles: [AgencyPrincipal, FieldManager, PlatformAdmin], code: 200, input: [], output: "BookTransfer[]", side_effects: [] }
  - { method: POST, path: "/agency-network/agreements", description: "Draft an agreement for an agent.", roles: [FieldManager], code: 201, input: [agent_id, agency_id, agreement_type, commission_schedule], output: Agreement, side_effects: ["agreement DRAFT->UNDER_REVIEW"] }
  - { method: GET, path: "/agency-network/agreements", description: "List agreements with filters.", roles: [FieldManager, AppointingExecutive, AgencyPrincipal], code: 200, input: ["agent_id?", "agency_id?", "status?", "limit?", "offset?"], output: "Agreement[]", side_effects: [] }
  - { method: GET, path: "/agency-network/agreements/{id}", description: "Read one agreement.", roles: [FieldManager, AppointingExecutive, AgencyPrincipal, StaffMember], code: 200, input: [], output: Agreement, side_effects: [] }
  - { method: POST, path: "/agency-network/agreements/{id}/transcribe", description: "Transcribe an agreement into force.", roles: [FieldManager], code: 200, input: [expected_agent_version], output: Agreement, side_effects: ["agreement UNDER_REVIEW->ACTIVE", "agent TRANSITIONING->ACTIVE", "recompute direct_additions_commission_cents and renewal_commission_cents", "stamp appointment_date", "increments Agent.version by 1"] }
  - { method: POST, path: "/agency-network/staff", description: "Nominate a team member under a sponsoring agreement.", roles: [AgencyPrincipal], code: 201, input: [full_name, role_title, allocation_units, sponsoring_agreement_id, "assignment_start_date?", "assignment_end_date?"], output: StaffMember, side_effects: ["staff PENDING; allocated_agent_id := sponsor's agent"] }
  - { method: GET, path: "/agency-network/staff", description: "List team members with filters.", roles: [AgencyPrincipal, FieldManager, PlatformAdmin], code: 200, input: ["agency_id?", "agent_id?", "sponsoring_agreement_id?", "status?", "limit?", "offset?"], output: "StaffMember[]", side_effects: [] }
  - { method: GET, path: "/agency-network/staff/{id}", description: "Read one team member.", roles: [AgencyPrincipal, FieldManager, PlatformAdmin], code: 200, input: [], output: StaffMember, side_effects: [] }
  - { method: POST, path: "/agency-network/staff/{id}/appoint", description: "Appoint a nominated team member.", roles: [AgencyPrincipal], code: 200, input: [], output: StaffMember, side_effects: ["staff PENDING->ACTIVE", "recompute staffing_reimbursement"] }
  - { method: POST, path: "/agency-network/policies", description: "Create a policy on an agent's book.", roles: [FieldManager], code: 201, input: [policy_number, product_line, annual_premium_cents, is_new_business, holder_agent_id, owner_agency_id], output: Policy, side_effects: ["recompute Agency.book_open_count and exposure_inforce_cents"] }
  - { method: GET, path: "/agency-network/policies", description: "List policies with filters.", roles: [FieldManager, AgencyPrincipal, ClaimsAdjuster], code: 200, input: ["holder_agent_id?", "owner_agency_id?", "book_transfer_id?", "status?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: GET, path: "/agency-network/policies/{id}", description: "Read one policy.", roles: [FieldManager, AgencyPrincipal, ClaimsAdjuster], code: 200, input: [], output: Policy, side_effects: [] }
  - { method: POST, path: "/agency-network/policies/{id}/cancel", description: "Cancel an open policy.", roles: [AgencyPrincipal], code: 200, input: [], output: Policy, side_effects: ["policy OPEN->CANCELLED", "recompute Agency.book_open_count and exposure_inforce_cents"] }
  - { method: POST, path: "/agency-network/claims", description: "File a claim against a policy.", roles: [ClaimsAdjuster], code: 201, input: [policy_id, claim_amount_cents], output: Claim, side_effects: ["claim OPEN"] }
  - { method: GET, path: "/agency-network/claims", description: "List claims with filters.", roles: [ClaimsAdjuster, AgencyPrincipal], code: 200, input: ["policy_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/agency-network/claims/{id}", description: "Read one claim.", roles: [ClaimsAdjuster, AgencyPrincipal], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/agency-network/claims/{id}/settle", description: "Settle an open claim.", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["claim OPEN->PAID", "set policy_paid_cents", "cascade loss_ratio -> termination_value -> agency_valuation"] }
  - { method: POST, path: "/agency-network/claims/{id}/resolve", description: "Re-open a paid claim and post a resolution chargeback.", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["claim PAID->OPEN", "resolution_chargeback", "cascade recompute"] }
  - { method: POST, path: "/agency-network/claims/{id}/deny", description: "Deny an open claim.", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["claim OPEN->DENIED", "policy_paid_cents := 0"] }
  - { method: POST, path: "/agency-network/license-records", description: "Post a state-board license record (suspension or renewal).", roles: [RegulatoryBoard], code: 201, input: [agent_id, full_name, state_code, product_lines, license_expiry_date], output: LicenseRecord, side_effects: ["upsert the agent's license record"] }
  - { method: GET, path: "/agency-network/license-records", description: "List license records.", roles: [RegulatoryBoard, PlatformAdmin], code: 200, input: ["agent_id?", "limit?", "offset?"], output: "LicenseRecord[]", side_effects: [] }
  - { method: GET, path: "/agency-network/agencies/{id}/policies", description: "List the policies booked under an agency (reverse lookup of Policy.owner_agency_id).", roles: [AppointingExecutive, FieldManager, AgencyPrincipal, ClaimsAdjuster], code: 200, input: ["status?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: GET, path: "/agency-network/agencies/{id}/agents", description: "List the agents contracted to an agency (reverse lookup of Agent.agency_id).", roles: [AppointingExecutive, FieldManager, AgencyPrincipal], code: 200, input: ["status?", "limit?", "offset?"], output: "Agent[]", side_effects: [] }
  - { method: GET, path: "/agency-network/book-transfers", description: "List book transfers (multi-FK child collapsed into one filtered list).", roles: [AppointingExecutive, FieldManager, AgencyPrincipal, PlatformAdmin], code: 200, input: ["agent_id?", "from_agency_id?", "to_agency_id?", "successor_agent_id?", "status?", "limit?", "offset?"], output: "BookTransfer[]", side_effects: [] }
  - { method: GET, path: "/agency-network/book-transfers/{id}", description: "Read one book transfer.", roles: [AppointingExecutive, FieldManager, AgencyPrincipal, PlatformAdmin], code: 200, input: [], output: BookTransfer, side_effects: [] }
  - { method: POST, path: "/agency-network/agencies/{id}/book-settlement", description: "Test-driving endpoint: post a trailing-12-month commission settlement into the agency's anniversary term (lets tests set annualized_commission_cents without a full year of activity).", roles: [PlatformAdmin], code: 200, input: [annualized_commission_cents], output: Agency, side_effects: ["agency.annualized_commission_cents := payload value", "recompute Agency.agency_valuation_cents"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or empty" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the role is not permitted for the operation" }
  - { id: ERR_AGENCY_NOT_FOUND, http: 404, condition: "no agency matches the id in the path" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "no agent matches the id in the path" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "no agreement matches the id in the path" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "no policy matches the id in the path" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "no claim matches the id in the path" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in the state required by the transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "a transition is attempted from a terminal state" }
  - { id: ERR_LICENSED_REQUIRED, http: 400, condition: "the acting agent's license is not LICENSED or has expired" }
  - { id: ERR_SPONSOR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "the sponsoring agreement's owner agent is not in a live state" }
  - { id: ERR_MARKET_NEED_EXISTS, http: 409, condition: "the market-need score is too low for the requested territory" }
  - { id: ERR_AGENCY_STAFFING_CAP, http: 409, condition: "the target agency already carries 12 agency-level units" }
  - { id: ERR_SCHEDULE_MISSING, http: 400, condition: "the commission schedule is missing a requested product line" }
  - { id: ERR_INTERVAL_OVERLAP, http: 409, condition: "the requested interval collides with a sibling interval" }
  - { id: ERR_ALLOWANCE_INSUFFICIENT, http: 400, condition: "the allowance pool remaining is less than the campaign draw" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current parent version" }
  - { id: ERR_HOLDING_POLICIES_REMAIN, http: 409, condition: "the previous agent still holds at least one OPEN policy" }
  - { id: ERR_NO_SUCCESSOR_AGENT, http: 409, condition: "no same-region ACTIVE agent is available as a successor" }
  - { id: ERR_DUPLICATE_POLICY, http: 409, condition: "policy_number or agency_code is already in use" }
  - { id: ERR_INVALID_TERRITORY, http: 400, condition: "the address belongs to a territory that cannot fit the appointment" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational administrator (partly opaque) who runs ops sweeps, seeds raw records and controls the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /agency-network/agencies/{id}/run_ops"
      - "POST /agency-network/_inject/agent"
      - "POST /agency-network/_clock/set_current_utc"
      - "GET /agency-network/_envelopes/echo"
    shared_operations:
      - "GET /agency-network/agencies, GET /agency-network/agencies/{id}"
      - "GET /agency-network/staff, GET /agency-network/staff/{id}"
      - "GET /agency-network/license-records"
      - "POST /agency-network/agents/{id}/read-license"
  - name: AppointingExecutive
    description: "Company executive who approves appointments and governs the agency roll."
    identity: opaque
    exclusive_operations:
      - "POST /agency-network/appointment-applications/{id}/approve"
      - "POST /agency-network/appointment-applications/{id}/reject"
      - "POST /agency-network/agencies/{id}/activate"
      - "POST /agency-network/agencies/{id}/terminate"
    shared_operations:
      - "GET /agency-network/agencies, GET /agency-network/agencies/{id}, GET /agency-network/agencies/{id}/performance"
      - "GET /agency-network/agencies/{id}/marketing-campaigns"
      - "POST /agency-network/agencies/{id}/run_ops"
      - "GET /agency-network/appointment-applications, GET /agency-network/appointment-applications/{id}"
      - "GET /agency-network/agents, GET /agency-network/agents/{id}, GET /agency-network/agreements, GET /agency-network/agreements/{id}"
  - name: FieldManager
    description: "Field recruiter who scores applications, mints agents, writes agreements and reassigns books."
    identity: opaque
    exclusive_operations:
      - "POST /agency-network/appointment-applications"
      - "POST /agency-network/appointment-applications/{id}/assess"
      - "POST /agency-network/appointment-applications/{id}/appoint"
      - "POST /agency-network/agents/{id}/read-license"
      - "POST /agency-network/agents/{id}/transition-book"
      - "POST /agency-network/agents/{id}/policies/{pid}/cessation"
      - "POST /agency-network/agents/{id}/complete-reassignment"
      - "POST /agency-network/agreements"
      - "POST /agency-network/agreements/{id}/transcribe"
      - "POST /agency-network/policies"
    shared_operations:
      - "GET /agency-network/agencies, GET /agency-network/agencies/{id}, GET /agency-network/agencies/{id}/performance"
      - "GET /agency-network/appointment-applications, GET /agency-network/appointment-applications/{id}"
      - "GET /agency-network/agents, GET /agency-network/agents/{id}"
      - "GET /agency-network/agreements, GET /agency-network/agreements/{id}"
      - "GET /agency-network/staff, GET /agency-network/staff/{id}"
      - "POST /agency-network/agents/{id}/book-transfer"
  - name: AgencyPrincipal
    description: "Owner/principal of an agency who manages its office, marketing and cessation requests."
    identity: entity_backed:Agency
    exclusive_operations:
      - "POST /agency-network/agencies/{id}/marketing-campaigns"
      - "PUT /agency-network/agencies/{id}/marketing-campaigns/{cid}"
      - "DELETE /agency-network/agencies/{id}/marketing-campaigns/{cid}"
      - "POST /agency-network/agencies/{id}/marketing-campaigns/{cid}/participate"
      - "POST /agency-network/agents/{id}/cessation"
      - "POST /agency-network/staff"
      - "POST /agency-network/staff/{id}/appoint"
      - "POST /agency-network/policies/{id}/cancel"
    shared_operations:
      - "GET /agency-network/agencies, GET /agency-network/agencies/{id}, GET /agency-network/agencies/{id}/performance"
