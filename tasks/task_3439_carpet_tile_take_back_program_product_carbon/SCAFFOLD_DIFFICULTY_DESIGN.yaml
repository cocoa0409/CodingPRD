          - validations[priority=9]
          - validations[priority=10]
          - state_machines.CustomerSite.PLANNED_to_INSTALLED
          - errors[ERR_ADHESIVE_FREE_CERT_REQUIRED]
          - errors[ERR_CONTRACTOR_CERT_EXPIRED]
        distinguishing_aspect: "Category pair business_referential vs business_temporal: an ADHESIVE_FREE install with adhesive_free_certified == false AND an already-expired cert returns ERR_ADHESIVE_FREE_CERT_REQUIRED (priority 9), never ERR_CONTRACTOR_CERT_EXPIRED (priority 10); the expired-only control case proves the temporal error exists and fires when the referential one does not."
        test_recipe:
          setup:
            - "Site S-X: ADHESIVE_FREE system, adhesive_free_certified false, cert_expires_on 2026-01-01 (before install_window_start 2026-10-05) — dual violation."
            - "Site S-Y: ADHESIVE_FREE system, adhesive_free_certified true, same expired cert — temporal violation only."
            - "Distinct contractors so no window-conflict interference."
          setup_api_calls:
            - *k_clock
            - call: "POST /carpetloop/sites"
              payload: { contractor_name: "inst-x", address: "7 Prairie Rd", install_window_start: "2026-10-05T00:00:00Z", install_window_end: "2026-10-10T00:00:00Z", installation_system: "ADHESIVE_FREE", adhesive_free_certified: false, cert_expires_on: "2026-01-01T00:00:00Z", annual_replacement_budget_cents: 500000 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { siteX: $.data.id }
            - call: "POST /carpetloop/sites"
              payload: { contractor_name: "inst-y", address: "8 Prairie Rd", install_window_start: "2026-10-05T00:00:00Z", install_window_end: "2026-10-10T00:00:00Z", installation_system: "ADHESIVE_FREE", adhesive_free_certified: true, cert_expires_on: "2026-01-01T00:00:00Z", annual_replacement_budget_cents: 500000 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { siteY: $.data.id }
          trigger:
            - call: "POST /carpetloop/sites/${siteX}/install"
              payload: {}
              as: Installer
              as_user_id: "inst-x"
              captures: { errX: $.data.error_id }
            - call: "POST /carpetloop/sites/${siteY}/install"
              payload: {}
              as: Installer
              as_user_id: "inst-y"
              captures: { errY: $.data.error_id }
          assert:
            - "errX == ERR_ADHESIVE_FREE_CERT_REQUIRED (http 422) — referential outranks temporal even though the cert is also expired"
            - "errY == ERR_CONTRACTOR_CERT_EXPIRED (http 422) — with certification true, the temporal check is the one that fires"
            - "CustomerSite.${siteX}.status == PLANNED and CustomerSite.${siteY}.status == PLANNED (no partial transition)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: sort_mass_sum_exact_equality
        grounds:
          - validations[priority=11]
          - errors[ERR_SORT_MASS_IMBALANCE]
          - state_machines.TakeBackRequest.COLLECTED_to_CREDITED
          - calculations.takeback_credit
        distinguishing_aspect: "Boundary on the sort-pathway mass metric via POST .../sort: pathway masses summing to collected_kg - 0.01 (159.99 vs 160) are rejected, while the exact sum 160.00 passes and credits 6000 cents — a 2dp equality boundary, not a tolerance band."
        test_recipe:
          setup:
            - "Collection CIR (claim_intent NONE), site INSTALLED, take-back grade B collected at 160 kg."
          setup_api_calls:
            - *k_clock
            - *k_col_grave_none
            - *k_site1
            - *k_install1
            - *k_tb1
            - *k_sched1
            - *k_clock_sep12
            - *k_collect1
          trigger:
            - call: "POST /carpetloop/take-back-requests/${tb1}/sort"
              payload: { reuse_kg: 40, depolymerize_kg: 80, downcycle_kg: 39.99, landfill_kg: 0 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
            - *k_sort1
          assert:
            - "first sort: err == ERR_SORT_MASS_IMBALANCE (http 422); sum 159.99 != collected_kg 160 at 2dp"
            - "the failed sort leaves TakeBackRequest.${tb1}.status == COLLECTED and credit_cents null (no partial side effects)"
            - "second sort with the exact sum 160.00: status == CREDITED, credit_variant == STANDARD, credit_cents == 6000"
            - "a FeedstockLot with origin_takeback_id == ${tb1} and quantity_kg == 80 exists exactly once (cascade C fired only on the successful sort)"

      - name: replacement_budget_exact_fit
        grounds:
          - validations[priority=12]
          - errors[ERR_REPLACEMENT_BUDGET_EXCEEDED]
          - calculations.site_replacement_spend
          - calculations.replacement_quote
        distinguishing_aspect: "Boundary on the budget-cents metric via POST .../complete: completion that brings spent to exactly the budget (60000 == 60000) is allowed (inclusive <=), while the next completion one order over the same budget is rejected — plus the match-side boundary that a batch with available_m2 exactly equal to the zone area is eligible."
