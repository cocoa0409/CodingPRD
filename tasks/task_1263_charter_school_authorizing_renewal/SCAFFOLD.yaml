# =============================================================================
# Task 1263 — Charter School Authorizing & Renewal (state charter authorizer)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1263. Charter School Authorizing & Renewal (state charter authorizer): application review & capacity interview scoring, charter contract & performance framework targets, annual academic/financial/operational monitoring, enrollment lottery & preference verification oversight, intervention/probation notice & corrective action, renewal decision with term length, closure protocol & student transition, authorizer fee & appeal process

domain_name: charter-school-authorizing
api_prefix: /authorizer

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency       # OCC on School.version (contract create) and InterventionNotice.version (plan create)
    - cascading_side_effects       # renewal-denial closure cascade; monitoring-accept standing cascade
    - rate_threshold_triggers      # standing band mapping, composite approval threshold, fee tiers
    - scheduled_actions            # clock-gated appeal windows, renewal window, corrective due dates
  entity_topology: flat            # peer entities joined by FK references; no nested ownership tree
  state_machine_shape: cyclic      # CorrectiveActionPlan resubmission loop; RenewalDecision DECIDED→REVERTED→DECIDED; School parallel standing dimensions
  relationship_patterns:
    - one_to_many                  # School → contracts, reports, lotteries, interventions, invoices, closure plans
    - self_referential             # CharterContract.prior_contract_id (renewal chain); InterventionNotice.successor_notice_id (escalation chain)
    - cross_aggregate              # RenewalDecision references both School and CharterContract; Appeal polymorphic target
  role_model: segregation_of_duties  # rubric scorer cannot sit on capacity panel; appeal officer cannot be original decider; notice issuer cannot self-resolve
  consistency_model: immediate

# =============================================================================
# §1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: CharterApplication
    parent: null
    common_fields: true
    fields:
      - { name: school_name, type: string, source: input, description: "Proposed school name" }
      - { name: founding_group, type: string, source: input, description: "Founding organization name" }
      - { name: cycle_year, type: integer, source: input, description: "Application cycle year (e.g., 2027)" }
      - { name: proposed_grades, type: string, source: input, description: "Grade span, e.g. 'K-8'" }
      - { name: review_scores, type: array, source: system, default: "[]", description: "List of {reviewer_user_id, criterion, score} appended via POST scores; criterion in {ACADEMIC_PLAN, FINANCE_PLAN, GOVERNANCE, OPERATIONS_PLAN, COMMUNITY_SUPPORT}" }
      - { name: rubric_complete, type: boolean, source: computed, default: false, description: "True when all 5 criteria each have >= 1 score" }
      - { name: rubric_score, type: number, source: computed, description: "Mean of the 5 per-criterion mean scores; 1 decimal, round_half_up; null until rubric_complete" }
      - { name: interview_score, type: number, source: computed, description: "Panel score of the SCORED capacity interview; null until scored" }
      - { name: composite_score, type: number, source: computed, description: "PROVISIONAL variant = rubric_score while interview pending; FINAL variant = 0.6*rubric_score + 0.4*interview_score after interview SCORED; 1 decimal round_half_up" }
      - { name: composite_variant, type: enum, source: computed, description: "PROVISIONAL | FINAL" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | BOARD_REVIEW | APPROVED | DENIED" }
      - { name: decided_by_user_id, type: string, source: system, description: "BoardMember X-User-ID who decided; null until decided" }
      - { name: denial_reason, type: string, source: system, description: "Required at decide when outcome=DENIED; null otherwise" }

  - name: CapacityInterview
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> CharterApplication.id; interview belongs to this application" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end; adjacency (new.start == existing.end) allowed" }
      - { name: panelist_user_ids, type: array, source: input, description: "ApplicationReviewer X-User-IDs on the panel; none may appear in application.review_scores[].reviewer_user_id (SOD)" }
      - { name: panel_score, type: number, source: system, description: "0-100, set by POST score; null until scored" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SCORED | CANCELLED" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CharterApplication.id; origin application (created by approve cascade)" }
      - { name: school_name, type: string, source: system, description: "Copied from application" }
      - { name: status, type: enum, source: system, description: "PRE_OPENING | OPEN | CLOSING | CLOSED" }
      - { name: academic_standing, type: enum, source: system, default: "GOOD", description: "Parallel standing dimension: GOOD | NOTICE | PROBATION | CRITICAL" }
      - { name: financial_standing, type: enum, source: system, default: "GOOD", description: "Parallel standing dimension: GOOD | NOTICE | PROBATION | CRITICAL" }
      - { name: operational_standing, type: enum, source: system, default: "GOOD", description: "Parallel standing dimension: GOOD | NOTICE | PROBATION | CRITICAL" }
      - { name: current_contract_id, type: string, source: system, description: "ACTIVE CharterContract id; null until first activation" }

  - name: CharterContract
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; contract belongs to this school" }
      - { name: prior_contract_id, type: string, source: input, description: "FK -> CharterContract.id; null for initial charter; set for renewal/amendment successor" }
      - { name: framework_version, type: string, source: input, description: "Performance framework version label" }
      - { name: term_start, type: datetime, source: input, description: "Closed interval start (ISO8601 date)" }
      - { name: term_end, type: datetime, source: input, description: "Closed interval end; must be > term_start; overlap with sibling DRAFT/ACTIVE terms forbidden under CLOSED-interval semantics (start == prior end IS overlap)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | RENEWED | REVOKED | EXPIRED" }
      - { name: targets_weight_total, type: number, source: computed, default: 0, description: "Sum of PerformanceTarget.weight for this contract" }

  - name: PerformanceTarget
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> CharterContract.id; target belongs to this contract" }
      - { name: domain, type: enum, source: input, description: "ACADEMIC | FINANCIAL | OPERATIONAL" }
      - { name: metric_code, type: string, source: input, description: "Metric identifier, unique per (contract, domain, metric_code)" }
      - { name: target_value, type: number, source: input, description: "Target value for the metric" }
      - { name: floor_value, type: number, source: input, description: "Minimum acceptable value" }
      - { name: weight, type: number, source: input, description: "0 < weight <= 1; all targets on a contract must sum to exactly 1.0 at activation" }

  - name: MonitoringReport
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; report belongs to this school" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year; unique per school" }
      - { name: academic_score, type: number, source: input, description: "0-100 domain score" }
      - { name: financial_score, type: number, source: input, description: "0-100 domain score" }
      - { name: operational_score, type: number, source: input, description: "0-100 domain score" }
      - { name: compliance_index, type: number, source: computed, description: "Conditionally reweighted mean of the three domain scores; 1 decimal round_half_up" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Staff X-User-ID who created the report" }
      - { name: return_notes, type: string, source: system, description: "Set on RETURNED; cleared on resubmit" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | RETURNED" }

  - name: Lottery
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; lottery belongs to this school" }
      - { name: academic_year, type: integer, source: input, description: "Academic year; unique per school" }
      - { name: capacity, type: integer, source: input, description: "Seats available; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SEALED | EXECUTED | CERTIFIED | AUDIT_FAILED | CANCELLED" }

  - name: LotteryEntry
    parent: null
    common_fields: true
    fields:
      - { name: lottery_id, type: string, source: system, description: "FK -> Lottery.id; entry belongs to this lottery" }
      - { name: student_ref, type: string, source: input, description: "Applicant student reference (opaque to authorizer)" }
      - { name: grade_level, type: string, source: input, description: "Grade applying for, e.g. 'K', '6'" }
      - { name: preference_codes, type: array, source: input, description: "Zero or more of SIBLING | DISTRICT_RESIDENT | STAFF_CHILD; empty array auto-VERIFIED at creation" }
      - { name: preference_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED; VERIFIED at creation when preference_codes is empty" }
      - { name: preference_verified_by, type: string, source: system, description: "Staff X-User-ID who verified/rejected; null while PENDING or auto-VERIFIED" }
      - { name: outcome, type: enum, source: system, description: "ENTERED | OFFERED | WAITLISTED | DECLINED | VOIDED" }
      - { name: rank_position, type: integer, source: system, description: "1..N assigned at execute; null until executed" }

  - name: InterventionNotice
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; notice belongs to this school" }
      - { name: level, type: enum, source: input, description: "NOTICE | PROBATION | REVOCATION_REVIEW; input on manual create; auto-created notices are PROBATION" }
      - { name: domain, type: enum, source: input, description: "ACADEMIC | FINANCIAL | OPERATIONAL | COMPLIANCE" }
      - { name: reason, type: string, source: input, description: "Grounds for intervention" }
      - { name: issued_by_user_id, type: string, source: system, description: "Staff X-User-ID at issue; null while DRAFT" }
      - { name: resolved_by_user_id, type: string, source: system, description: "Staff X-User-ID at resolve; MUST differ from issued_by_user_id (SOD); null until resolved" }
      - { name: corrective_due_date, type: datetime, source: system, description: "issued_at + 30 days; corrective plan submissions after this are overdue" }
      - { name: successor_notice_id, type: string, source: system, description: "New InterventionNotice id created by escalate; null until escalated" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | RESOLVED | ESCALATED | MOOT" }

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: intervention_id, type: string, source: system, description: "FK -> InterventionNotice.id; plan belongs to this notice" }
      - { name: plan_text, type: string, source: input, description: "Plan narrative; refreshed on resubmit" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time at (re)submission" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Staff X-User-ID of latest review; null until reviewed" }
      - { name: review_notes, type: string, source: system, description: "Notes from latest review; null until reviewed" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | RETURNED" }

  - name: RenewalDecision
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; decision belongs to this school" }
      - { name: contract_id, type: string, source: input, description: "FK -> CharterContract.id; the ACTIVE contract being renewed" }
      - { name: eligible_term_years, type: integer, source: computed, description: "3 | 5 | 10 per renewal_term_eligibility; 0 means renewal barred" }
      - { name: decision, type: enum, source: system, description: "null | RENEWED | RENEWED_WITH_CONDITIONS | DENIED; null while PENDING" }
      - { name: granted_term_years, type: integer, source: system, description: "Set at decide: equals eligible_term_years for RENEWED; 3 for RENEWED_WITH_CONDITIONS; null for DENIED" }
      - { name: decided_by_user_id, type: string, source: system, description: "BoardMember X-User-ID; null until decided" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at decide; appeal window = decided_at + 30 days inclusive; null until decided" }
      - { name: status, type: enum, source: system, description: "PENDING | DECIDED | FINAL | REVERTED" }

  - name: ClosurePlan
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; closure belongs to this school" }
      - { name: reason, type: enum, source: input, description: "REVOCATION | NON_RENEWAL | VOLUNTARY; NON_RENEWAL plans are system-created by renewal finalize" }
      - { name: closure_date, type: datetime, source: input, description: "Effective closure date" }
      - { name: decided_by_user_id, type: string, source: system, description: "BoardMember X-User-ID for manual creation; 'system' for cascade-created" }
      - { name: status, type: enum, source: system, description: "INITIATED | TRANSITION_IN_PROGRESS | RECORDS_COMPLETE | CLOSED | CANCELLED" }

  - name: StudentTransition
    parent: null
    common_fields: true
    fields:
      - { name: closure_plan_id, type: string, source: system, description: "FK -> ClosurePlan.id; transition belongs to this closure plan" }
      - { name: student_ref, type: string, source: input, description: "Student reference being transitioned" }
      - { name: destination_school, type: string, source: system, description: "Receiving school/district; set at place" }
      - { name: status, type: enum, source: system, description: "PENDING | PLACED | RECORDS_SENT" }

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; invoice belongs to this school" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year; unique per school" }
      - { name: estimated_enrollment, type: integer, source: input, description: "Prior-year audited ADM; drives ESTIMATED variant" }
      - { name: audited_enrollment, type: integer, source: system, description: "Current-year audited ADM; set at finalize; drives FINAL variant" }
      - { name: base_per_pupil_cents, type: integer, source: input, description: "State base funding rate per pupil, integer cents" }
      - { name: qualifying_supplemental_pupils, type: integer, source: input, description: "Pupils qualifying for supplemental funding" }
      - { name: base_funding_cents, type: integer, source: computed, description: "= adm * base_per_pupil_cents (adm per active variant)" }
      - { name: supplemental_cents, type: integer, source: computed, description: "= round_half_up(qualifying_supplemental_pupils * base_per_pupil_cents * supp_rate(band(base_funding_cents)))" }
      - { name: total_funding_cents, type: integer, source: computed, description: "= base_funding_cents + supplemental_cents" }
      - { name: fee_rate, type: number, source: computed, description: "Tiered by adm: <=300 -> 0.025; 301..800 -> 0.020; >=801 -> 0.015" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "= 12 * round_half_up(total_funding_cents * fee_rate / 12); per-month rounding order pinned" }
      - { name: billed_variant, type: enum, source: system, description: "ESTIMATED | FINAL" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Amount paid; pay settles in full" }
      - { name: waived_cents, type: integer, source: system, default: 0, description: "Amount waived" }
      - { name: status, type: enum, source: system, description: "ESTIMATED | FINALIZED | PAID | DISPUTED | WAIVED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; filing school; null only for APPLICATION_DENIAL appeals filed by Applicant" }
      - { name: target_type, type: enum, source: input, description: "APPLICATION_DENIAL | RENEWAL_DENIAL | REVOCATION | FEE_INVOICE" }
      - { name: target_id, type: string, source: input, description: "Polymorphic reference: CharterApplication.id | RenewalDecision.id | CharterContract.id | FeeInvoice.id per target_type (not an FK to a single entity)" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds" }
      - { name: filed_by_user_id, type: string, source: system, description: "Caller X-User-ID at filing" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock at filing" }
      - { name: hearing_officer_user_id, type: string, source: system, description: "AppealsOfficer assigned at schedule-hearing; must differ from original decider (SOD)" }
      - { name: ruling, type: enum, source: system, description: "null | UPHELD | OVERTURNED" }
      - { name: status, type: enum, source: system, description: "FILED | HEARING_SCHEDULED | RULED_UPHELD | RULED_OVERTURNED" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: CharterApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /authorizer/applications/{id}/accept-intake"
        actor: AuthorizerStaff
        preconditions:
          - "status == SUBMITTED (ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: BOARD_REVIEW
        trigger: "POST /authorizer/applications/{id}/advance-to-board"
        actor: AuthorizerStaff
        preconditions:
          - "status == UNDER_REVIEW (ERR_APPLICATION_INVALID_STATE)"
          - "rubric_complete == true (ERR_BOARD_REVIEW_BLOCKED)"
          - "A CapacityInterview for this application is SCORED (ERR_BOARD_REVIEW_BLOCKED)"
        side_effects:
          - "composite_score frozen as FINAL variant"
      - from: BOARD_REVIEW
        to: APPROVED
        trigger: "POST /authorizer/applications/{id}/decide {outcome: APPROVED}"
        actor: BoardMember
        preconditions:
          - "status == BOARD_REVIEW (ERR_APPLICATION_INVALID_STATE)"
          - "composite_score >= 75.0 (ERR_COMPOSITE_BELOW_THRESHOLD; >= is inclusive)"
        side_effects:
          - "Create School {application_id, school_name} in PRE_OPENING with all standings GOOD (cascade link 1 of approve chain)"
          - "decided_by_user_id = caller"
      - from: BOARD_REVIEW
        to: DENIED
        trigger: "POST /authorizer/applications/{id}/decide {outcome: DENIED, denial_reason}"
        actor: BoardMember
        preconditions:
          - "status == BOARD_REVIEW (ERR_APPLICATION_INVALID_STATE)"
          - "denial_reason non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Any SCHEDULED CapacityInterview for this application -> CANCELLED"
          - "decided_by_user_id = caller; denial_reason recorded"
      - from: DENIED
        to: BOARD_REVIEW
        trigger: "system (Appeal on APPLICATION_DENIAL ruled OVERTURNED)"
        actor: system
        preconditions:
          - "Appeal RULED_OVERTURNED whose target is this application"
        side_effects:
          - "denial_reason cleared to null; decided_by_user_id cleared to null"

  - entity: CapacityInterview
    initial_state: SCHEDULED
    terminal_states: [SCORED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCORED
        trigger: "POST /authorizer/interviews/{id}/score"
        actor: ApplicationReviewer
        preconditions:
          - "status == SCHEDULED (ERR_INTERVIEW_INVALID_STATE)"
          - "caller X-User-ID is in panelist_user_ids (ERR_NOT_PANELIST)"
          - "panel_score within 0..100 (ERR_INVALID_REQUEST)"
        side_effects:
          - "application.interview_score = panel_score"
          - "application.composite_score recomputed as FINAL variant (0.6*rubric + 0.4*panel)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (application decided DENIED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: School
    initial_state: PRE_OPENING
    terminal_states: [CLOSED]
    transitions:
      - from: PRE_OPENING
        to: OPEN
        trigger: "system (first CharterContract activation)"
        actor: system
        preconditions:
          - "Activated contract belongs to this school"
        side_effects:
          - "school.current_contract_id = activated contract"
      - from: OPEN
        to: CLOSING
        trigger: "system (renewal finalize DENIED) OR POST /authorizer/schools/{id}/closure-plans (REVOCATION | VOLUNTARY)"
        actor: "system | BoardMember"
        preconditions:
          - "status == OPEN"
        side_effects:
          - "Every Lottery in DRAFT | OPEN | SEALED for this school -> CANCELLED (cascade link 2)"
      - from: CLOSING
        to: CLOSED
        trigger: "system (ClosurePlan reaches CLOSED via advance)"
        actor: system
        preconditions:
          - "ClosurePlan.status -> CLOSED this request"
        side_effects:
          - "ACTIVE contract -> REVOKED (if still ACTIVE)"
          - "Open InterventionNotices (DRAFT | ISSUED) -> MOOT"
    # Parallel standing dimensions (academic_standing / financial_standing / operational_standing)
    # evolve independently of status and of each other via these system transitions:
    #   any standing: GOOD|NOTICE|PROBATION|CRITICAL <- set to band(score) on MonitoringReport accept
    #   (score >= 80 -> GOOD; 65..79.99 -> NOTICE; 50..64.99 -> PROBATION; < 50 -> CRITICAL)
    #   any standing: upgraded exactly one step (CRITICAL->PROBATION->NOTICE->GOOD) on InterventionNotice resolve for that domain

  - entity: CharterContract
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RENEWED, REVOKED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /authorizer/contracts/{id}/activate"
        actor: AuthorizerStaff
        preconditions:
          - "status == DRAFT (ERR_CONTRACT_INVALID_STATE)"
          - "Each of ACADEMIC, FINANCIAL, OPERATIONAL has >= 1 PerformanceTarget (ERR_DOMAIN_TARGET_MISSING)"
          - "targets_weight_total == 1.0 exactly (ERR_TARGET_WEIGHT_TOTAL_INVALID)"
          - "school.status in {PRE_OPENING, OPEN} (ERR_SCHOOL_NOT_OPEN)"
        side_effects:
          - "Any other ACTIVE contract for this school -> SUPERSEDED"
          - "school.current_contract_id = this contract"
          - "If school PRE_OPENING -> OPEN"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (successor contract activated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "system (REVOCATION closure plan created, or school CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RENEWED
        trigger: "system (renewal decision FINAL with decision RENEWED | RENEWED_WITH_CONDITIONS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock passes term_end while still ACTIVE and no renewal pending)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Informational sweep; tests may also drive expiry indirectly via renewal flows."

  - entity: MonitoringReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /authorizer/monitoring-reports/{id}/accept"
        actor: AuthorizerStaff
        preconditions:
          - "status == SUBMITTED (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "For each domain: school standing := band(domain_score) per standing mapping (cascade link 1)"
          - "If any domain standing became PROBATION or CRITICAL and no open (DRAFT|ISSUED) notice exists for (school, domain): auto-create InterventionNotice level=PROBATION, status=ISSUED, issued_by_user_id=acceptor, corrective_due_date=clock+30d (cascade link 2)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /authorizer/monitoring-reports/{id}/return"
        actor: AuthorizerStaff
        preconditions:
          - "status == SUBMITTED (ERR_REPORT_INVALID_STATE)"
          - "return_notes non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "return_notes recorded"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /authorizer/monitoring-reports/{id}/submit (resubmission)"
        actor: AuthorizerStaff
        preconditions:
          - "status == RETURNED (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "return_notes cleared to null"
          - "compliance_index recomputed from (possibly updated) scores"

  - entity: Lottery
    initial_state: DRAFT
    terminal_states: [CERTIFIED, AUDIT_FAILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /authorizer/lotteries/{id}/open"
        actor: AuthorizerStaff
        preconditions:
          - "status == DRAFT (ERR_LOTTERY_INVALID_STATE)"
          - "school.status == OPEN (ERR_SCHOOL_NOT_OPEN)"
        side_effects: []
      - from: OPEN
        to: SEALED
        trigger: "POST /authorizer/lotteries/{id}/seal"
        actor: AuthorizerStaff
        preconditions:
          - "status == OPEN (ERR_LOTTERY_INVALID_STATE)"
          - "Zero entries with preference_status == PENDING (ERR_UNVERIFIED_PREFERENCE_ENTRIES; zero-count boundary)"
        side_effects: []
      - from: SEALED
        to: EXECUTED
        trigger: "POST /authorizer/lotteries/{id}/execute"
        actor: AuthorizerStaff
        preconditions:
          - "status == SEALED (ERR_LOTTERY_INVALID_STATE)"
        side_effects:
          - "Run lottery_assignment: rank entries, top capacity -> OFFERED, rest -> WAITLISTED, rank_position set"
      - from: EXECUTED
        to: CERTIFIED
        trigger: "POST /authorizer/lotteries/{id}/certify {audit_outcome: CERTIFIED}"
        actor: AuthorizerStaff
        preconditions:
          - "status == EXECUTED (ERR_LOTTERY_INVALID_STATE)"
        side_effects: []
      - from: EXECUTED
        to: AUDIT_FAILED
        trigger: "POST /authorizer/lotteries/{id}/certify {audit_outcome: AUDIT_FAILED}"
        actor: AuthorizerStaff
        preconditions:
          - "status == EXECUTED (ERR_LOTTERY_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "system (school -> CLOSING)"
        actor: system
        preconditions: []
        side_effects:
          - "All entries outcome -> VOIDED (cascade link 3)"
      - from: OPEN
        to: CANCELLED
        trigger: "system (school -> CLOSING)"
        actor: system
        preconditions: []
        side_effects:
          - "All entries outcome -> VOIDED (cascade link 3)"
      - from: SEALED
        to: CANCELLED
        trigger: "system (school -> CLOSING)"
        actor: system
        preconditions: []
        side_effects:
          - "All entries outcome -> VOIDED (cascade link 3)"

  - entity: LotteryEntry
    initial_state: ENTERED
    terminal_states: [DECLINED, VOIDED]
    transitions:
      - from: ENTERED
        to: OFFERED
        trigger: "system (lottery execute: rank_position <= capacity) OR system (decline promotion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENTERED
        to: WAITLISTED
        trigger: "system (lottery execute: rank_position > capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: OFFERED
        trigger: "system (promotion after a DECLINED offer frees a seat: WAITLISTED entry with smallest rank_position)"
        actor: system
        preconditions: []
        side_effects:
          - "Seat conservation: OFFERED count restored to min(capacity, non-DECLINED entries)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /authorizer/lottery-entries/{id}/decline"
        actor: SchoolOperator
        preconditions:
          - "outcome == OFFERED (ERR_ENTRY_INVALID_STATE)"
          - "caller school owns lottery (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "If any WAITLISTED entries remain: promote smallest rank_position -> OFFERED (compensating action)"
      - from: ENTERED
        to: VOIDED
        trigger: "system (lottery CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: VOIDED
        trigger: "system (lottery CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: VOIDED
        trigger: "system (lottery CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
    # Parallel dimension: preference_status PENDING -> VERIFIED | REJECTED via
    # POST /authorizer/lottery-entries/{id}/verify-preference, independent of outcome.

  - entity: InterventionNotice
    initial_state: DRAFT
    terminal_states: [RESOLVED, ESCALATED, MOOT]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /authorizer/interventions/{id}/issue"
        actor: AuthorizerStaff
        preconditions:
          - "status == DRAFT (ERR_NOTICE_INVALID_STATE)"
        side_effects:
          - "issued_by_user_id = caller; corrective_due_date = clock + 30 days"
      - from: ISSUED
        to: ESCALATED
        trigger: "POST /authorizer/interventions/{id}/escalate"
        actor: BoardMember
        preconditions:
          - "status == ISSUED (ERR_NOTICE_INVALID_STATE)"
          - "level != REVOCATION_REVIEW (ERR_NOTICE_INVALID_STATE)"
        side_effects:
          - "Create successor InterventionNotice: level NOTICE->PROBATION or PROBATION->REVOCATION_REVIEW, status ISSUED, same domain, issued_by_user_id = caller, corrective_due_date = clock + 30 days"
          - "successor_notice_id = new notice id"
      - from: ISSUED
        to: RESOLVED
        trigger: "POST /authorizer/interventions/{id}/resolve"
        actor: AuthorizerStaff
        preconditions:
          - "status == ISSUED (ERR_NOTICE_INVALID_STATE)"
          - "caller != issued_by_user_id (ERR_SOD_NOTICE_SELF_RESOLVE)"
          - "If level in {PROBATION, REVOCATION_REVIEW}: an ACCEPTED CorrectiveActionPlan exists for this notice (ERR_NO_ACCEPTED_CORRECTIVE_PLAN)"
        side_effects:
          - "resolved_by_user_id = caller"
          - "School standing for notice.domain upgraded exactly one step (CRITICAL->PROBATION->NOTICE->GOOD; GOOD unchanged)"
      - from: DRAFT
        to: MOOT
        trigger: "system (school -> CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: MOOT
        trigger: "system (school -> CLOSED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CorrectiveActionPlan
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /authorizer/corrective-plans/{id}/review {outcome: ACCEPTED}"
        actor: AuthorizerStaff
        preconditions:
          - "status == SUBMITTED (ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "reviewed_by_user_id = caller; review_notes recorded"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /authorizer/corrective-plans/{id}/review {outcome: RETURNED}"
        actor: AuthorizerStaff
        preconditions:
          - "status == SUBMITTED (ERR_PLAN_INVALID_STATE)"
          - "review_notes non-empty when RETURNED (ERR_INVALID_REQUEST)"
        side_effects:
          - "reviewed_by_user_id = caller; review_notes recorded"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /authorizer/corrective-plans/{id}/resubmit"
        actor: SchoolOperator
        preconditions:
          - "status == RETURNED (ERR_PLAN_INVALID_STATE)"
          - "caller school owns intervention (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
          - "clock <= intervention.corrective_due_date (ERR_CORRECTIVE_PLAN_OVERDUE)"
        side_effects:
          - "plan_text replaced; submitted_at = clock; reviewed_by_user_id cleared"

  - entity: RenewalDecision
    initial_state: PENDING
    terminal_states: [FINAL]
    transitions:
      - from: PENDING
        to: DECIDED
        trigger: "POST /authorizer/renewal-decisions/{id}/decide"
        actor: BoardMember
        preconditions:
          - "status in {PENDING, REVERTED} (ERR_DECISION_INVALID_STATE)"
          - "outcome RENEWED requires eligible_term_years > 0 (ERR_RENEWAL_NOT_ELIGIBLE)"
          - "outcome RENEWED_WITH_CONDITIONS requires eligible_term_years >= 3 (ERR_TERM_LENGTH_MISMATCH)"
        side_effects:
          - "decision = outcome; decided_by_user_id = caller; decided_at = clock"
          - "granted_term_years = eligible_term_years (RENEWED) | 3 (RENEWED_WITH_CONDITIONS) | null (DENIED)"
      - from: REVERTED
        to: DECIDED
        trigger: "POST /authorizer/renewal-decisions/{id}/decide (re-decide after appeal overturn)"
        actor: BoardMember
        preconditions:
          - "status in {PENDING, REVERTED} (ERR_DECISION_INVALID_STATE)"
          - "same outcome rules as PENDING -> DECIDED"
        side_effects:
          - "decision, decided_by_user_id, decided_at, granted_term_years refreshed"
      - from: DECIDED
        to: FINAL
        trigger: "POST /authorizer/renewal-decisions/{id}/finalize"
        actor: AuthorizerStaff
        preconditions:
          - "status == DECIDED (ERR_DECISION_INVALID_STATE)"
          - "clock > decided_at + 30 days (ERR_APPEAL_WINDOW_OPEN; strictly greater)"
          - "No Appeal in FILED | HEARING_SCHEDULED targeting this decision (ERR_APPEAL_WINDOW_OPEN)"
        side_effects:
          - "If decision in {RENEWED, RENEWED_WITH_CONDITIONS}: create successor CharterContract DRAFT {prior_contract_id = this contract, term_start = prior.term_end + 1 day, term_end = term_start + granted_term_years years, framework_version copied}; current contract -> RENEWED"
          - "If decision == DENIED: School OPEN -> CLOSING (cascade link 1); create ClosurePlan {reason: NON_RENEWAL, status INITIATED, decided_by_user_id: 'system'} (cascade link 1b); school lottery cascade fires per School machine"
      - from: DECIDED
        to: REVERTED
        trigger: "system (Appeal on RENEWAL_DENIAL ruled OVERTURNED)"
        actor: system
        preconditions: []
        side_effects:
          - "decision, decided_by_user_id, decided_at, granted_term_years retained for audit; status REVERTED allows re-decide"

  - entity: ClosurePlan
    initial_state: INITIATED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: INITIATED
        to: TRANSITION_IN_PROGRESS
        trigger: "POST /authorizer/closure-plans/{id}/advance"
        actor: AuthorizerStaff
        preconditions:
          - "status == INITIATED (ERR_CLOSURE_INVALID_STATE)"
        side_effects: []
      - from: TRANSITION_IN_PROGRESS
        to: RECORDS_COMPLETE
        trigger: "POST /authorizer/closure-plans/{id}/advance"
        actor: AuthorizerStaff
        preconditions:
          - "status == TRANSITION_IN_PROGRESS (ERR_CLOSURE_INVALID_STATE)"
          - "Zero StudentTransitions in PENDING | PLACED (ERR_STUDENTS_NOT_TRANSITIONED)"
        side_effects: []
      - from: RECORDS_COMPLETE
        to: CLOSED
        trigger: "POST /authorizer/closure-plans/{id}/advance"
        actor: AuthorizerStaff
        preconditions:
          - "status == RECORDS_COMPLETE (ERR_CLOSURE_INVALID_STATE)"
        side_effects:
          - "School CLOSING -> CLOSED (and its side effects)"
      - from: INITIATED
        to: CANCELLED
        trigger: "system (REVOCATION appeal ruled OVERTURNED)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract REVOKED -> ACTIVE; School CLOSING -> OPEN"
      - from: TRANSITION_IN_PROGRESS
        to: CANCELLED
        trigger: "system (REVOCATION appeal ruled OVERTURNED)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract REVOKED -> ACTIVE; School CLOSING -> OPEN"

  - entity: StudentTransition
    initial_state: PENDING
    terminal_states: [RECORDS_SENT]
    transitions:
      - from: PENDING
        to: PLACED
        trigger: "POST /authorizer/student-transitions/{id}/place"
        actor: AuthorizerStaff
        preconditions:
          - "status == PENDING (ERR_TRANSITION_INVALID_STATE)"
          - "destination_school non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "destination_school recorded"
      - from: PLACED
        to: RECORDS_SENT
        trigger: "POST /authorizer/student-transitions/{id}/records-sent"
        actor: AuthorizerStaff
        preconditions:
          - "status == PLACED (ERR_TRANSITION_INVALID_STATE)"
        side_effects: []

  - entity: FeeInvoice
    initial_state: ESTIMATED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ESTIMATED
        to: FINALIZED
        trigger: "POST /authorizer/fee-invoices/{id}/finalize"
        actor: AuthorizerStaff
        preconditions:
          - "status == ESTIMATED (ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "audited_enrollment recorded; billed_variant = FINAL; all computed fields recomputed with FINAL variant"
      - from: FINALIZED
        to: PAID
        trigger: "POST /authorizer/fee-invoices/{id}/pay"
        actor: SchoolOperator
        preconditions:
          - "status == FINALIZED (ERR_INVOICE_INVALID_STATE)"
          - "caller school owns invoice (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "paid_cents = billed_amount_cents (full settlement only)"
      - from: FINALIZED
        to: DISPUTED
        trigger: "system (Appeal targeting this FEE_INVOICE filed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: FINALIZED
        trigger: "system (fee appeal ruled UPHELD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: WAIVED
        trigger: "system (fee appeal ruled OVERTURNED)"
        actor: system
        preconditions: []
        side_effects:
          - "waived_cents = billed_amount_cents - paid_cents"
      - from: FINALIZED
        to: WAIVED
        trigger: "POST /authorizer/fee-invoices/{id}/waive"
        actor: BoardMember
        preconditions:
          - "status == FINALIZED (ERR_INVOICE_INVALID_STATE)"
          - "paid_cents == 0 (ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "waived_cents = billed_amount_cents"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [RULED_UPHELD, RULED_OVERTURNED]
    transitions:
      - from: FILED
        to: HEARING_SCHEDULED
        trigger: "POST /authorizer/appeals/{id}/schedule-hearing"
        actor: AuthorizerStaff
        preconditions:
          - "status == FILED (ERR_APPEAL_INVALID_STATE)"
          - "hearing_officer_user_id != original decider of target (ERR_SOD_APPEAL_DECIDER_CONFLICT; targets with decider: APPLICATION_DENIAL -> application.decided_by_user_id, RENEWAL_DENIAL -> decision.decided_by_user_id, REVOCATION -> closure_plan.decided_by_user_id; FEE_INVOICE has no decider so any officer allowed)"
        side_effects:
          - "hearing_officer_user_id recorded"
      - from: HEARING_SCHEDULED
        to: RULED_UPHELD
        trigger: "POST /authorizer/appeals/{id}/rule {ruling: UPHELD}"
        actor: AppealsOfficer
        preconditions:
          - "status == HEARING_SCHEDULED (ERR_APPEAL_INVALID_STATE)"
          - "caller X-User-ID == hearing_officer_user_id (ERR_APPEAL_OFFICER_MISMATCH)"
        side_effects:
          - "FEE_INVOICE target: invoice DISPUTED -> FINALIZED"
          - "Other targets unchanged"
      - from: HEARING_SCHEDULED
        to: RULED_OVERTURNED
        trigger: "POST /authorizer/appeals/{id}/rule {ruling: OVERTURNED}"
        actor: AppealsOfficer
        preconditions:
          - "status == HEARING_SCHEDULED (ERR_APPEAL_INVALID_STATE)"
          - "caller X-User-ID == hearing_officer_user_id (ERR_APPEAL_OFFICER_MISMATCH)"
        side_effects:
          - "APPLICATION_DENIAL target: application DENIED -> BOARD_REVIEW (re-decision cycle)"
          - "RENEWAL_DENIAL target: RenewalDecision DECIDED -> REVERTED (re-decide enabled)"
          - "FEE_INVOICE target: invoice DISPUTED -> WAIVED, waived_cents = billed - paid"
          - "REVOCATION target: ClosurePlan INITIATED|TRANSITION_IN_PROGRESS -> CANCELLED, contract REVOKED -> ACTIVE, school CLOSING -> OPEN"

# =============================================================================
# §1.2.1: Concurrency Rules (true create-with-supersede races, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: contract-create-stale-school
    parent_entity: School
    write_endpoint: "POST /authorizer/schools/{id}/contracts"
    occ_field: "expected_school_version"
    description: |
      Creating a CharterContract against a School whose version has advanced
      since the client last observed it is rejected. A contract creation
      legitimately supersedes the school's current contract set (the new DRAFT
      becomes the activation candidate), so a writer holding a stale school
      version must refresh before creating.
    error_id: ERR_STALE_SCHOOL_VERSION
    http_status: 412
  - rule_id: plan-create-stale-intervention
    parent_entity: InterventionNotice
    write_endpoint: "POST /authorizer/interventions/{interventionId}/corrective-plans"
    occ_field: "expected_intervention_version"
    description: |
      Creating a CorrectiveActionPlan against an InterventionNotice whose
      version has advanced since the school last observed it is rejected.
      A new plan legitimately supersedes the notice's prior plan state, so a
      submission carrying a stale intervention version must refresh first.
    error_id: ERR_STALE_INTERVENTION_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: application_composite_score
    trigger: "rubric score posted (recompute PROVISIONAL); capacity interview scored (recompute FINAL)"
    algorithm: weighted_scoring
    formula: |
      per_criterion_mean(c) = mean of review_scores where criterion == c
      rubric_score = round_half_up(mean of the 5 per_criterion_mean values, 1 decimal)
      PROVISIONAL variant (no SCORED interview): composite_score = rubric_score
      FINAL variant (interview SCORED): composite_score = round_half_up(0.6 * rubric_score + 0.4 * interview_score, 1 decimal)
    input_set: "review_scores on the application; interview_score from the SCORED CapacityInterview"
    constants:
      RUBRIC_WEIGHT: 0.6
      INTERVIEW_WEIGHT: 0.4
      APPROVAL_THRESHOLD: 75.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "rubric complete but no interview SCORED yet"
        difference: "composite_score = rubric_score only; interview contributes nothing"
      - name: FINAL
        when: "capacity interview SCORED"
        difference: "composite_score = 0.6*rubric + 0.4*interview; same inputs yield a different number than PROVISIONAL whenever interview_score != rubric_score"

  - name: monitoring_compliance_index
    trigger: "monitoring report create and resubmit"
    algorithm: weighted_scoring
    formula: |
      base weights: ACADEMIC 0.5, FINANCIAL 0.25, OPERATIONAL 0.25
      For each domain with score < FAILING_BAND (60): that domain's weight doubles
      Renormalize: compliance_index = round_half_up(sum(w_i * s_i) / sum(w_i), 1 decimal)
    input_set: "the report's three domain scores"
    constants:
      FAILING_BAND: 60
      WEIGHT_ACADEMIC: 0.5
      WEIGHT_FINANCIAL: 0.25
      WEIGHT_OPERATIONAL: 0.25
    precision: "1 decimal place, round_half_up"
    variants:
      - name: standard
        when: "all domain scores >= 60"
        difference: "plain weighted mean with base weights"
      - name: failing_reweighted
        when: "any domain score < 60"
        difference: "failing domains' weights double before renormalization; same three scores produce a different index than the standard formula"

  - name: standing_band_mapping
    trigger: "monitoring report accept (per domain)"
    algorithm: threshold
    formula: |
      score >= 80.0   -> GOOD
      65.0 <= score < 80.0 -> NOTICE
      50.0 <= score < 65.0 -> PROBATION
      score < 50.0    -> CRITICAL
    input_set: "each domain score of the ACCEPTED report"
    constants:
      GOOD_FLOOR: 80.0
      NOTICE_FLOOR: 65.0
      PROBATION_FLOOR: 50.0
    precision: "boundaries inclusive at the lower edge of each band (score == 80.0 is GOOD)"

  - name: renewal_term_eligibility
    trigger: "renewal decision creation (snapshot onto RenewalDecision.eligible_term_years)"
    algorithm: tiered_scoring
    formula: |
      inputs:
        avg_index = mean of compliance_index over this school's ACCEPTED MonitoringReports
                    whose fiscal_year falls within [year(contract.term_start), year(contract.term_end)] inclusive;
                    if none, avg_index = 0
        probation_count = count of InterventionNotices for this school with level in
                    {PROBATION, REVOCATION_REVIEW} created within the contract term window (created_at between
                    term_start and term_end inclusive)
        standings = school's three current standing values
      tiers (evaluated top-down, first match wins):
        if avg_index >= 90.0 AND probation_count == 0 AND all standings == GOOD -> 10
        elif avg_index >= 75.0 AND no standing == CRITICAL -> 5
        elif avg_index >= 60.0 -> 3
        else -> 0
    input_set: "ACCEPTED MonitoringReports in term; InterventionNotices in term; current standings"
    constants:
      TIER_10_AVG: 90.0
      TIER_5_AVG: 75.0
      TIER_3_AVG: 60.0
    precision: "avg_index computed to 1 decimal round_half_up before tier comparison; boundaries inclusive"

  - name: lottery_assignment
    trigger: "lottery execute"
    algorithm: waterfall_allocation
    formula: |
      preference_weight(e) = 10 if e.preference_status == VERIFIED and len(e.preference_codes) > 0 else 0
      Order all entries by (preference_weight DESC, created_at ASC, student_ref ASC); assign rank_position 1..N in that order
      Entries with rank_position <= capacity -> OFFERED; entries with rank_position > capacity -> WAITLISTED
      capacity == 0 -> every entry WAITLISTED
      Tie-break: preference_weight ties break by created_at ASC, then student_ref ASC; never by id
    input_set: "all entries of the SEALED lottery (outcome ENTERED)"
    constants:
      PREFERENCE_WEIGHT: 10
    precision: "integer ranks"

  - name: seat_conservation_invariant
    trigger: "lottery execute; entry decline/promotion"
    algorithm: aggregation
    formula: |
      For an EXECUTED lottery with N entries:
        count(OFFERED) + count(WAITLISTED) + count(DECLINED) == N  (always)
        count(OFFERED) == min(capacity, N - count(DECLINED))
      Decline with non-empty waitlist: promotion keeps count(OFFERED) unchanged (compensating action).
      Decline with empty waitlist: count(OFFERED) decreases by 1; the seat remains unfilled.
    input_set: "all entries of the lottery"
    precision: "integer counts"

  - name: per_pupil_funding_total
    trigger: "fee invoice create (ESTIMATED) and finalize (FINAL)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved base-first):
        1. adm = estimated_enrollment (ESTIMATED variant) | audited_enrollment (FINAL variant)
        2. base_funding_cents = adm * base_per_pupil_cents
        3. band is keyed on base_funding_cents ALONE (never on total):
             base <  200_000_000 -> SMALL (supp_rate 0.12)
             200_000_000 <= base <= 600_000_000 -> MID (supp_rate 0.08)
             base >  600_000_000 -> LARGE (supp_rate 0.05)
        4. supplemental_cents = round_half_up(qualifying_supplemental_pupils * base_per_pupil_cents * supp_rate, 0 decimals)
        5. total_funding_cents = base_funding_cents + supplemental_cents
    input_set: "enrollment per variant, base_per_pupil_cents, qualifying_supplemental_pupils"
    constants:
      SMALL_CAP_CENTS: 200000000
      MID_CAP_CENTS: 600000000
      SUPP_SMALL: 0.12
      SUPP_MID: 0.08
      SUPP_LARGE: 0.05
    precision: "integer cents, round_half_up"

  - name: authorizer_fee_billing
    trigger: "fee invoice create (ESTIMATED) and finalize (FINAL)"
    algorithm: tiered_pricing
    formula: |
      fee_rate by adm (same adm as per_pupil_funding_total):
        adm <= 300 -> 0.025
        301 <= adm <= 800 -> 0.020
        adm >= 801 -> 0.015
      Rounding order is pinned: round per month, then sum:
        monthly_cents = round_half_up(total_funding_cents * fee_rate / 12, 0 decimals)
        billed_amount_cents = 12 * monthly_cents
      (Computing round_half_up(total * fee_rate) once yields a different cent value when
       total * fee_rate / 12 is fractional; the per-month order is the pinned behavior.)
    input_set: "total_funding_cents and adm from per_pupil_funding_total"
    constants:
      TIER1_MAX_ADM: 300
      TIER2_MAX_ADM: 800
      RATE_TIER1: 0.025
      RATE_TIER2: 0.020
      RATE_TIER3: 0.015
    precision: "integer cents, round_half_up per month then multiply by 12"
    variants:
      - name: ESTIMATED
        when: "invoice created; audited enrollment not yet available"
        difference: "uses estimated_enrollment (prior-year audited ADM)"
      - name: FINAL
        when: "finalize with audited_enrollment"
        difference: "uses audited_enrollment; identical inputs except adm produce a different billed amount whenever the two enrollment figures differ"

  - name: fee_ledger_invariant
    trigger: "invoice finalize, pay, waive, appeal overturn"
    algorithm: aggregation
    formula: |
      paid_cents + waived_cents + outstanding_cents == billed_amount_cents
      where outstanding_cents = billed_amount_cents - paid_cents - waived_cents >= 0
      Compensating pairs:
        pay:    paid_cents := billed_amount_cents, outstanding := 0
        waive:  waived_cents := billed_amount_cents - paid_cents, outstanding := 0
      After any forward action and its compensating action, billed_amount_cents is unchanged
      and the identity above holds.
    input_set: "the invoice row"
    precision: "integer cents"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 3.5
    category: business_referential
    check: "SchoolOperator X-User-ID must equal the owning School.id of the target resource (lottery entry's lottery.school_id, plan's intervention.school_id, invoice.school_id, appeal.school_id)"
    error_id: ERR_RESOURCE_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "SchoolOperator endpoints on owned resources"
  - priority: 3.6
    category: state
    check: "OCC: expected_school_version == school.version (contract create); expected_intervention_version == intervention.version (plan create)"
    error_id: "ERR_STALE_SCHOOL_VERSION | ERR_STALE_INTERVENTION_VERSION"
    http_status: 412
    applies_to: "POST /authorizer/schools/{id}/contracts; POST /authorizer/interventions/{id}/corrective-plans"
  - priority: 4
    category: state
    check: "Target entity is in the required state for the transition (per state machine preconditions); also covers appeal-target appealable state (ERR_TARGET_NOT_APPEALABLE)"
    error_id: "ERR_*_INVALID_STATE | ERR_TARGET_NOT_APPEALABLE | ERR_SCHOOL_NOT_OPEN"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties & panel integrity: no panelist appears in application.review_scores (ERR_SOD_REVIEWER_PANEL_CONFLICT); notice resolver != issuer (ERR_SOD_NOTICE_SELF_RESOLVE); hearing officer != original decider (ERR_SOD_APPEAL_DECIDER_CONFLICT); score caller is a panelist (ERR_NOT_PANELIST)"
    error_id: "ERR_SOD_REVIEWER_PANEL_CONFLICT | ERR_SOD_NOTICE_SELF_RESOLVE | ERR_SOD_APPEAL_DECIDER_CONFLICT | ERR_NOT_PANELIST"
    http_status: 403
    applies_to: "POST interviews; POST interventions/{id}/resolve; POST appeals/{id}/schedule-hearing; POST interviews/{id}/score"
  - priority: 6
    category: business_temporal
    check: "Temporal windows: interview scheduled_start < scheduled_end and no same-panelist SCHEDULED overlap under half-open semantics (adjacency allowed); appeal filed_at <= target decided_at + 30 days inclusive (ERR_APPEAL_WINDOW_EXPIRED); renewal create within [term_end - 365d, term_end - 30d] inclusive (ERR_RENEWAL_WINDOW_NOT_OPEN); renewal finalize requires clock > decided_at + 30 days (ERR_APPEAL_WINDOW_OPEN); corrective plan submit/resubmit at or before corrective_due_date (ERR_CORRECTIVE_PLAN_OVERDUE); contract term_start < term_end and no closed-interval overlap with sibling DRAFT/ACTIVE terms (ERR_CONTRACT_TERM_OVERLAP)"
    error_id: "ERR_PANEL_TIME_OVERLAP | ERR_APPEAL_WINDOW_EXPIRED | ERR_RENEWAL_WINDOW_NOT_OPEN | ERR_APPEAL_WINDOW_OPEN | ERR_CORRECTIVE_PLAN_OVERDUE | ERR_CONTRACT_TERM_OVERLAP | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "interview scheduling; appeals create; renewal create/finalize; corrective plan create/resubmit; contract create"
  - priority: 7
    category: business_constraint
    check: "Constraint & aggregate rules: unique (application, reviewer, criterion) score (ERR_DUPLICATE_RECORD); unique (school, fiscal_year) report / (school, academic_year) lottery / (school, fiscal_year) invoice / (contract, domain, metric_code) target (ERR_DUPLICATE_RECORD); one non-CANCELLED interview per application (ERR_INTERVIEW_ALREADY_ACTIVE); one open (DRAFT|ISSUED) closure plan per school (ERR_CLOSURE_ALREADY_EXISTS); one open (PENDING|DECIDED) renewal decision per school (ERR_RENEWAL_ALREADY_OPEN); one open (FILED|HEARING_SCHEDULED) appeal per target (ERR_APPEAL_ALREADY_OPEN); rubric complete + interview scored before board (ERR_BOARD_REVIEW_BLOCKED); composite >= 75.0 for APPROVED (ERR_COMPOSITE_BELOW_THRESHOLD); every domain has >= 1 target (ERR_DOMAIN_TARGET_MISSING); target weights sum to exactly 1.0 (ERR_TARGET_WEIGHT_TOTAL_INVALID); zero PENDING preference entries to seal (ERR_UNVERIFIED_PREFERENCE_ENTRIES); no active (SUBMITTED|ACCEPTED) plan when creating a plan (ERR_PLAN_ALREADY_ACTIVE); REVOCATION closure requires open REVOCATION_REVIEW notice (ERR_NO_REVOCATION_REVIEW_NOTICE); zero unplaced/unrecorded students to complete records (ERR_STUDENTS_NOT_TRANSITIONED); RENEWED barred when eligible == 0 (ERR_RENEWAL_NOT_ELIGIBLE); RENEWED_WITH_CONDITIONS requires eligible >= 3 (ERR_TERM_LENGTH_MISMATCH)"
    error_id: "ERR_DUPLICATE_RECORD | ERR_INTERVIEW_ALREADY_ACTIVE | ERR_CLOSURE_ALREADY_EXISTS | ERR_RENEWAL_ALREADY_OPEN | ERR_APPEAL_ALREADY_OPEN | ERR_BOARD_REVIEW_BLOCKED | ERR_COMPOSITE_BELOW_THRESHOLD | ERR_DOMAIN_TARGET_MISSING | ERR_TARGET_WEIGHT_TOTAL_INVALID | ERR_UNVERIFIED_PREFERENCE_ENTRIES | ERR_PLAN_ALREADY_ACTIVE | ERR_NO_REVOCATION_REVIEW_NOTICE | ERR_STUDENTS_NOT_TRANSITIONED | ERR_RENEWAL_NOT_ELIGIBLE | ERR_TERM_LENGTH_MISMATCH"
    http_status: 409
    applies_to: "entity-specific create/action endpoints"
  - priority: 8
    category: business_fiscal
    check: "Fiscal guards: pay only from FINALIZED (full settlement); waive only when paid_cents == 0; finalize recomputes billed under FINAL variant"
    error_id: ERR_INVOICE_INVALID_STATE
    http_status: 409
    applies_to: "POST /authorizer/fee-invoices/{id}/pay; /waive; /finalize"

