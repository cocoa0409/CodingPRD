  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: road_distance_exactly_100_is_eligible
        grounds:
          - calculations.distance_eligibility
          - calculations.travel_stipend_tiering
          - entities.TravelSupportGrant.fields.distance_eligible
        distinguishing_aspect: |
          Boundary metric 1 (numeric threshold, >= semantics): a home engineered to
          produce road_distance_miles exactly 100.0 (straight 76.9 x 1.3 = 99.97 ->
          rounds to 100.0) IS distance_eligible and earns the tier-1 stipend — the
          >= vs > distinction is observable in money. Endpoint: POST
          /applications/{id}/travel-support-grants.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 (45.0,-122.0) capacity 5, ORTHOPEDIC program P1 (0..215, non-staged), source RS1. Application A1 DOB 2020-01-01 home (45.0, -120.4265), accepted."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Edge", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -120.4265 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "ok", expected_application_version: "${a1_v0} + 3" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
          trigger:
            - call: "POST /charity-care/applications/${a1}/travel-support-grants"
              payload: { grant_type: "TRAVEL_AND_LODGING" }
              as: CareCoordinator
              as_user_id: "cc-1"
              captures: { g1: $.data.id }
          assert:
            - "TravelSupportGrant.${g1}.straight_line_distance_miles == 76.9"
            - "TravelSupportGrant.${g1}.road_distance_miles == 100.0"
            - "TravelSupportGrant.${g1}.distance_eligible == true      # >= boundary: exactly 100.0 qualifies"
            - "TravelSupportGrant.${g1}.nightly_lodging_stipend_cents == 15000"
            - "TravelSupportGrant.${g1}.travel_allowance_cents == 5800   # 58 * round(100.0) = 5800"

      - name: fund_commit_at_exact_available_balance_leaves_zero
        grounds:
          - validations[priority=16]
          - state_machines.FundAllocation.PLEDGED_to_COMMITTED
          - entities.PhilanthropicFund.fields.available_cents
        distinguishing_aspect: |
          Boundary metric 2 (zero-remainder fiscal boundary, different endpoint):
          committing an allocation whose amount_cents EQUALS the fund's available_cents
          succeeds and drives available_cents to exactly 0; a follow-up commit of 1
          cent then fails ERR_INSUFFICIENT_FUND_BALANCE. >= vs > on the fiscal side,
          via POST /fund-allocations/{id}/commit — distinct from the distance grant
          endpoint of the sibling instance.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 capacity 5 (no program needed). Fund F1 total_committed 100000, OPEN. Allocation AL1 pledged 100000; allocation AL2 pledged 1."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/philanthropic-funds"
              payload: { fund_name: "General Fund", fiscal_year: 2026, total_committed_cents: 100000 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { f1: $.data.id, f1_v0: $.data.version }
            - call: "POST /charity-care/philanthropic-funds/${f1}/allocations"
              payload: { hospital_id: "${h1}", amount_cents: 100000 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { al1: $.data.id }
            - call: "POST /charity-care/philanthropic-funds/${f1}/allocations"
              payload: { hospital_id: "${h1}", amount_cents: 1 }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { al2: $.data.id }
          trigger:
            - call: "POST /charity-care/fund-allocations/${al1}/commit"
              payload: { expected_fund_version: "${f1_v0}" }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
            - call: "POST /charity-care/fund-allocations/${al2}/commit"
              payload: { expected_fund_version: "${f1_v0} + 1" }
              as: PhilanthropyOfficer
              as_user_id: "po-1"
              captures: { err_commit: $.data.error_id }
          assert:
            - "the AL1 commit succeeds (200): FundAllocation.${al1}.status == COMMITTED"
            - "PhilanthropicFund.${f1}.available_cents == 0 and allocated_cents == 100000"
            - "the AL2 commit returns 402 and err_commit == ERR_INSUFFICIENT_FUND_BALANCE"
            - "FundAllocation.${al2}.status == PLEDGED (unchanged)"
            - "PhilanthropicFund.${f1}.allocated_cents + available_cents == 100000 (conservation holds after both attempts)"

