  - rule_id: cross_entity_state_dependency
    instances:

      - name: schedule_payroll_blocked_when_term_payroll_locked
        grounds:
          - "validations[priority=11]"
          - state_machines.Appointment.NOT_SCHEDULED_to_SCHEDULED
          - state_machines.AcademicTerm.OPEN_to_PAYROLL_LOCKED
          - "errors[ERR_TERM_NOT_OPEN]"
        distinguishing_aspect: |
          The Appointment is itself in a perfectly legal state for the transition (lifecycle_status
          ACTIVE, payroll_status NOT_SCHEDULED) - the only blocker lives on a different entity, the
          AcademicTerm now sitting at PAYROLL_LOCKED - so scheduling payroll must return
          ERR_TERM_NOT_OPEN and create zero StipendDisbursement rows.
        test_recipe:
          setup:
            - "Term XTERM2026 (2026-09-01..2026-12-31, CALENDAR_DAY) with four whole-month pay periods, opened, one appointment driven all the way to ACTIVE, then moved to PAYROLL_LOCKED (legal: no appointment of the term is FUNDING_VERIFIED)."
            - "StipendPolicy (RESEARCH, DOCTORAL): min_fte_monthly_stipend_cents 400000, per_credit_tuition_cents 50000, max_remission_cents_per_term 500000, term_insurance_premium_cents 0."
            - "DOCTORAL student, enrolled_credit_hours 0, non-international."
            - "One GRANT source authorized 5000000 funding the appointment at 100.00 percent; after verify-funding it shows committed 1200000."
            - "Appointment RESEARCH, effort_pct 75, 2026-09-01..2026-12-31, monthly_stipend_cents 300000, lifecycle_status ACTIVE, payroll_status NOT_SCHEDULED, zero StipendDisbursement rows."
