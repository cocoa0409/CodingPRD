  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: certificate_requires_effective_endorsement
        grounds:
          - state_machines.Endorsement
          - entities.Certificate.fields.endorsement_id
          - errors[ERR_CERT_ENDORSEMENT_INVALID]
        distinguishing_aspect: |
          Pair (Certificate <- Endorsement): certificate issuance is gated on the
