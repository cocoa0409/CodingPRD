            - "${err_window} == ERR_ZONE_CREDENTIAL_WINDOW_CAPACITY with HTTP 409 — CR2's window [19:00Z, 21:00Z) overlaps CR1's, and 3 + 2 == 5 exceeds credential_capacity 4"
