endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/mls/_clock/set_current_utc"
    description: "Set logical clock. Server startup default time is exactly 2026-09-01T00:00:00.000Z; before any set_current_utc call the logical clock reads that default and never falls back to wall-clock."
    roles: [AssociationStaff]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["PolicyRevision scheduled activations evaluated against new clock"]
  - method: POST
    path: "/mls/_clock/advance_day"
    description: "Advance logical clock by whole days (default 1). Triggers PolicyRevision activations, dues suspension checks, listing expiry."
