      - name: an_assessment_whose_annual_payment_is_zero_is_rejected
        claim_type: Cascading validation
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_ANNUAL_PAYMENT_ZERO]"
          - "calculations.annual_payment_amount"
        distinguishing_aspect: |
          The record IS in the window, so priority 10 passes and the gross is a healthy
          100000000; only the CBU column is zero, which zeroes the annual payment and makes
          the amortization search divide by zero. The refusal must therefore come from the
          fiscal tier at priority 13, after the allocation has been computed - a server
          that checks CBU as part of body shape at priority 3 rejects a legitimate
          zero-CBU history record at filing time instead.
