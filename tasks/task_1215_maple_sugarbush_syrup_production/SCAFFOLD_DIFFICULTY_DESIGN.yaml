- rule_id: transitive_cascade
  instances:
  - name: vacuum_leak_cascade_depth4
    grounds:
    - state_machines.TapLine.ACTIVE_to_LEAK
    - state_machines.Sugarbush.LIVE_to_TAPPING
    - calculations.taps_rollup
    - calculations.vacuum_leak_trigger
    distinguishing_aspect: 'Depth-4 chain from one POST: vacuum reading 22.9 (< 25.0-2.0) mutates

      TapLine -> LEAK (hop 1); that mutation recomputes Sugarbush.taps_live

      (hop 2); reaching 0 forces Sugarbush LIVE -> TAPPING (hop 3); which

      recomputes Season.taps_live (hop 4). Each hop is caused by the

      previous hop''s mutation, not by the original POST.

      '
    test_recipe:
      setup:
      - Season OPEN; bush LIVE with exactly one ACTIVE line (100 taps, target 25.0 inHg); Season.taps_live == 100
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      - call: POST /sugarhouse/seasons/${season_id}/open
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes
        payload:
          season_id: ${season_id}
          name: North Woods
          tap_capacity: 5000
        as: SugarhouseManager
        captures:
          bush_id: $.data.id
      - call: POST /sugarhouse/sugarbushes/${bush_id}/begin-tapping
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L1
          tap_count: 100
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line1_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line1_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes/${bush_id}/go-live
        as: SugarhouseManager
      trigger:
      - call: POST /sugarhouse/tap-lines/${line1_id}/vacuum-readings
        payload:
          inhg: 22.9
        as: SugarhouseManager
      - call: GET /sugarhouse/tap-lines/${line1_id}
        as: SugarhouseManager
      - call: GET /sugarhouse/sugarbushes/${bush_id}
        as: SugarhouseManager
      - call: GET /sugarhouse/seasons/${season_id}
        as: SugarhouseManager
      assert:
      - TapLine.${line1_id}.status == LEAK and latest_vacuum_inhg == 22.9
      - Sugarbush.${bush_id}.taps_live == 0 and taps_set == 100 (LEAK still counted in taps_set)
      - Sugarbush.${bush_id}.status == TAPPING (auto-demoted at taps_live 0)
      - Season.${season_id}.taps_live == 0
  - name: lease_terminate_cascade_depth3
    grounds:
    - state_machines.Lease.ACTIVE_to_TERMINATED
    - state_machines.Sugarbush.LIVE_to_SHUTDOWN
    - state_machines.TapLine.ACTIVE_to_PULLED
    distinguishing_aspect: 'Depth-3 chain from a different trigger (lease terminate, not a sensor

      POST): terminate mutates Sugarbush -> SHUTDOWN (hop 1); the shutdown

      cascades every non-PULLED TapLine -> PULLED (hop 2); each pull

      recomputes Sugarbush.taps_set/taps_live and Season.taps_live (hop 3).

      '
    test_recipe:
      setup:
      - Season OPEN; bush Leased Hill TAPPING with two ACTIVE lines (60+40 taps) BEFORE lease creation, so activation freezes taps_snapshot == 100 and accrued_royalty_cents == 30000; then go-live -> LIVE;
        Season.taps_live == 100
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      - call: POST /sugarhouse/seasons/${season_id}/open
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes
        payload:
          season_id: ${season_id}
          name: Leased Hill
          tap_capacity: 5000
        as: SugarhouseManager
        captures:
          bush_id: $.data.id
      - call: POST /sugarhouse/sugarbushes/${bush_id}/begin-tapping
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L1
          tap_count: 60
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line1_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line1_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L2
          tap_count: 40
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line2_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line2_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/leases
        payload:
          sugarbush_id: ${bush_id}
          landowner_name: Landowner Lou
          royalty_basis: PER_TAP
          per_tap_cents: 300
          certified_organic_required: false
          term_start: '2027-01-01'
          term_end: '2027-12-31'
        as: SugarhouseManager
        captures:
          lease_id: $.data.id
      - call: POST /sugarhouse/leases/${lease_id}/submit-audit
        as: SugarhouseManager
      - call: POST /sugarhouse/leases/${lease_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/sugarbushes/${bush_id}/go-live
        as: SugarhouseManager
      trigger:
      - call: POST /sugarhouse/leases/${lease_id}/terminate
        as: SugarhouseManager
      - call: GET /sugarhouse/sugarbushes/${bush_id}
        as: SugarhouseManager
      - call: GET /sugarhouse/tap-lines
        payload: {}
        as: SugarhouseManager
      - call: GET /sugarhouse/seasons/${season_id}
        as: SugarhouseManager
      assert:
      - Lease.${lease_id}.status == TERMINATED and accrued_royalty_cents == 30000 (snapshot 100 x 300)
      - Sugarbush.${bush_id}.status == SHUTDOWN, taps_set == 0, taps_live == 0, stand_type == LEASED (active_lease_id retained for history)
      - TapLine.${line1_id}.status == PULLED and TapLine.${line2_id}.status == PULLED
      - Season.${season_id}.taps_live == 0
