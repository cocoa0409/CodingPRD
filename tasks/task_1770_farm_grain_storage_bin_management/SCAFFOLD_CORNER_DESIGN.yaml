        grounds: ["state_machines.FumigationRecord", "errors[ERR_FUMIGATION_NOT_ACTIVE]"]
        distinguishing_aspect: "Clearing an already-CLEARED fumigation fails ERR_FUMIGATION_NOT_ACTIVE (terminal lockdown)."
        test_recipe:
          setup: ["bin BIN-FT; applicators A and B; SULFURYL_FLUORIDE fumigation applied 2026-08-01T00:00:00Z (REI 24h), cleared by B at 2026-08-02T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-FT", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_ft: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_fa: $.data.id } }
            - { call: "POST /grain/applicators", payload: { name: "Bob B", license_no: "LIC-B", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_fb: $.data.id } }
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_ft}", applicator_id: "${app_fa}", product: "SULFURYL_FLUORIDE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T04:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_fa}", captures: { fum_ft: $.data.id, fum_ft_lu: $.data.lockout_until } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SiteManager }
            - { call: "POST /grain/fumigations/${fum_ft}/clear", payload: {}, as: CertifiedApplicator, as_user_id: "${app_fb}" }
          trigger:
            - { call: "POST /grain/fumigations/${fum_ft}/clear", payload: {}, as: CertifiedApplicator, as_user_id: "${app_fb}", captures: { e11: $.data.error_id } }
          assert:
            - "SULFURYL_FLUORIDE lockout_until == 2026-08-02T00:00:00Z (24h REI, not 72h)"
            - "second clear: HTTP 409, error_id == ERR_FUMIGATION_NOT_ACTIVE"
      - name: contract_auto_delivering_on_first_loadout
        claim_type: valid_transition
        grounds: ["state_machines.StorageContract", "entities.StorageContract.fields.committed_bu"]
        distinguishing_aspect: "Creating the first loadout flips contract OPEN -> DELIVERING and sets committed_bu == planned_bu (250.00); version increments 1 -> 2."
        test_recipe:
          setup: ["corn bin with lot 500.00 @15.0%; corn contract 1000 bu OPEN"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-AD", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_ad: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_ad}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 1000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_ad: $.data.id, con_ad_v: $.data.version, con_ad_st: $.data.status } }
          trigger:
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_ad}", bin_id: "${bin_ad}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 250.00, expected_contract_version: "${con_ad_v}" }, as: SiteManager, captures: { lo_ad: $.data.id } }
            - { call: "GET /grain/contracts/${con_ad}", payload: {}, as: SiteManager, captures: { con_ad_st2: $.data.status, con_ad_com: $.data.committed_bu, con_ad_v2: $.data.version } }
          assert:
            - "contract status at create == OPEN; after loadout create == DELIVERING"
            - "committed_bu == 250.00; version == 2 (loadout creation bumps contract version)"
      - name: assessment_epoch_sweeps
        claim_type: side_effect_execution
        grounds: ["calculations.monthly_assessment", "state_machines.StorageContract", "state_machines.LoadOut", "state_machines.BinEntryPermit", "state_machines.InsurancePolicy"]
        distinguishing_aspect: "One assessment run with the clock at 2026-09-15 sweeps all four entity types at once: contract DEFAULTED, SCHEDULED loadout EXPIRED (committed released), APPROVED permit EXPIRED, policy EXPIRED — and the expired policy then rejects a claim with ERR_POLICY_NOT_ACTIVE."
        test_recipe:
          setup: ["bin BIN-SW; contract window ends 2026-08-31; loadout window [2026-08-10 08:00, 12:00) SCHEDULED; permit planned_end 2026-08-20 APPROVED; policy period ends 2026-08-31; CONFIRMED_LOSS alert closed 2026-08-10 (inside policy period); clock advanced to 2026-09-15 before running period 2026-09"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-SW", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_sw: $.data.id } }
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_sw}", recorded_at: "2026-08-05T10:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_sw}" }, as: SiteManager, captures: { al_sw: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T12:00:00Z" }, as: SiteManager }
            - { call: "POST /grain/spoilage-alerts/${al_sw}/close", payload: { outcome: "CONFIRMED_LOSS", loss_bu: 10.00 }, as: SiteManager }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 1000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_sw: $.data.id, con_sw_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_sw}", bin_id: "${bin_sw}", scheduled_start: "2026-08-20T08:00:00Z", scheduled_end: "2026-08-20T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_sw_v}" }, as: SiteManager, captures: { lo_sw: $.data.id } }
            - { call: "POST /grain/entry-permits", payload: { bin_id: "${bin_sw}", planned_start: "2026-08-12T08:00:00Z", planned_end: "2026-08-12T10:00:00Z", atmosphere_test_passed: true, loto_confirmed: true }, as: SiteManager, as_user_id: "mgr-1", captures: { per_sw: $.data.id } }
            - { call: "POST /grain/entry-permits/${per_sw}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /grain/policies", payload: { crop: "CORN", coverage_limit_cents: 1000000, deductible_cents: 5000, valuation_clause: "SPOT", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: FarmOwner, captures: { pol_sw: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: SiteManager }
          trigger:
            - { call: "POST /grain/assessments", payload: { period: "2026-09" }, as: SiteManager, captures: { sw_def: $.data.contracts_defaulted, sw_lo: $.data.loadouts_expired, sw_per: $.data.permits_expired, sw_pol: $.data.policies_expired } }
            - { call: "GET /grain/contracts/${con_sw}", payload: {}, as: SiteManager, captures: { con_sw_st: $.data.status, con_sw_com: $.data.committed_bu, con_sw_v2: $.data.version } }
            - { call: "GET /grain/loadouts/${lo_sw}", payload: {}, as: SiteManager, captures: { lo_sw_tr: $.data.transport_status } }
            - { call: "GET /grain/entry-permits/${per_sw}", payload: {}, as: SiteManager, captures: { per_sw_st: $.data.status } }
            - { call: "POST /grain/claims", payload: { policy_id: "${pol_sw}", spoilage_alert_id: "${al_sw}" }, as: SiteManager, captures: { e12: $.data.error_id } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_sw}", bin_id: "${bin_sw}", scheduled_start: "2026-08-25T08:00:00Z", scheduled_end: "2026-08-25T12:00:00Z", planned_bu: 50.00, expected_contract_version: "${con_sw_v2}" }, as: SiteManager, captures: { e13: $.data.error_id } }
          assert:
            - "assessment response: contracts_defaulted == 1, loadouts_expired == 1, permits_expired == 1, policies_expired == 1"
            - "contract status == DEFAULTED and committed_bu == 0.00 (expired loadout released its 100.00)"
            - "loadout transport_status == EXPIRED; permit status == EXPIRED"
            - "claim against EXPIRED policy: HTTP 409, error_id == ERR_POLICY_NOT_ACTIVE"
            - "loadout create against DEFAULTED contract: HTTP 409, error_id == ERR_CONTRACT_NOT_OPEN"
      - name: fumigation_create_cascade_voids_permits
        claim_type: cross_entity_cascade
        grounds: ["state_machines.BinEntryPermit", "state_machines.Bin", "endpoints[\"POST /grain/fumigations\"]"]
        distinguishing_aspect: "Creating a fumigation on a bin VOIDs its open permits (REQUESTED and APPROVED) unconditionally and flips posture to FUMIGATION_LOCKOUT when application_start <= now."
        test_recipe:
          setup: ["bin BIN-FZ with an APPROVED permit (requested by mgr-1, approved by so-1)"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-FZ", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_fz: $.data.id } }
            - { call: "POST /grain/entry-permits", payload: { bin_id: "${bin_fz}", planned_start: "2026-08-02T08:00:00Z", planned_end: "2026-08-02T10:00:00Z", atmosphere_test_passed: true, loto_confirmed: true }, as: SiteManager, as_user_id: "mgr-1", captures: { per_fz: $.data.id } }
            - { call: "POST /grain/entry-permits/${per_fz}/approve", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /grain/applicators", payload: { name: "Alice A", license_no: "LIC-A", cert_expires_at: "2027-06-01T00:00:00Z" }, as: SiteManager, captures: { app_fz: $.data.id } }
          trigger:
            - { call: "POST /grain/fumigations", payload: { bin_id: "${bin_fz}", applicator_id: "${app_fz}", product: "PHOSPHINE", application_start: "2026-08-01T00:00:00Z", application_end: "2026-08-01T06:00:00Z" }, as: CertifiedApplicator, as_user_id: "${app_fz}" }
            - { call: "GET /grain/entry-permits/${per_fz}", payload: {}, as: SiteManager, captures: { per_fz_st: $.data.status } }
            - { call: "GET /grain/bins/${bin_fz}", payload: {}, as: SiteManager, captures: { bin_fz_post: $.data.posture } }
          assert:
            - "permit status == VOIDED (fumigation cascade)"
            - "bin posture == FUMIGATION_LOCKOUT (application_start 2026-08-01T00:00:00Z <= default clock)"
      - name: lot_suspension_restores_drawn_state
        claim_type: compensation
        grounds: ["state_machines.GrainLot", "state_machines.Bin"]
        distinguishing_aspect: "A PARTIALLY_DRAWN lot (drawn_bu 100.00) is SUSPENDED by a hotspot alert, then returns to PARTIALLY_DRAWN — not STORED — when the alert resolves, because the release rule keys on drawn_bu > 0."
        test_recipe:
          setup: ["corn bin with lot 1000.00 @15.0% filled 2026-08-01; contract 2000; loadout settled net 100.00 (lot PARTIALLY_DRAWN, current 900.00)"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-LS", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_ls: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_ls}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 1000.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_ls: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_ls: $.data.id, con_ls_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_ls}", bin_id: "${bin_ls}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_ls_v}" }, as: SiteManager, captures: { lo_ls: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_ls}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_ls}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 100.00, moisture_pct: 15.0 } ] }, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_ls}/confirm-settlement", payload: {}, as: SiteManager }
          trigger:
            - { call: "POST /grain/temperature-readings", payload: { bin_id: "${bin_ls}", recorded_at: "2026-08-02T00:00:00Z", ambient_temp_f: 60.0, cable_temps_f: [90.0], insect_activity: false }, as: SiteManager }
            - { call: "GET /grain/lots/${lot_ls}", payload: {}, as: SiteManager, captures: { lot_ls_st1: $.data.status } }
            - { call: "GET /grain/spoilage-alerts", payload: { bin_id: "${bin_ls}" }, as: SiteManager, captures: { al_ls: "$.data[0].id" } }
            - { call: "POST /grain/spoilage-alerts/${al_ls}/close", payload: { outcome: "RESOLVED" }, as: SiteManager }
            - { call: "GET /grain/lots/${lot_ls}", payload: {}, as: SiteManager, captures: { lot_ls_st2: $.data.status, lot_ls_dr: $.data.drawn_bu } }
          assert:
            - "after hotspot: lot status == SUSPENDED"
            - "after RESOLVED close: lot status == PARTIALLY_DRAWN (drawn_bu == 100.00 > 0), never back to STORED"
      - name: loadout_hold_release_cycle_via_posture
        claim_type: cyclic
        grounds: ["state_machines.LoadOut"]
        excluded_because:
          difficulty_instance: loadout_parallel_dimensions_hold_cycle
          rationale: "HELD<->SCHEDULED cycle asserted in the named §1.8 instance."
      - name: contract_fulfilled_revert_covered
        claim_type: cyclic
        grounds: ["state_machines.StorageContract"]
        excluded_because:
          difficulty_instance: contract_fulfilled_reverts_to_delivering
          rationale: "FULFILLED->DELIVERING revert asserted in the named §1.8 instance."
  # ============================================================ calculations
  - section: calculations
    instances:
      - name: provisional_shrink_zero_at_or_below_standard
        claim_type: boundary
        grounds: ["calculations.provisional_shrink"]
        distinguishing_aspect: "Shrink applies only when fill moisture is strictly above the crop standard: corn at exactly 15.0 shrinks 0.00, and at 14.0 also 0.00 (no negative shrink credit for dry grain)."
        test_recipe:
          setup: ["corn bin BIN-Z cap 5000"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-Z", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_z: $.data.id } }
          trigger:
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_z}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 100.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_z1: $.data.id, z1_prov: $.data.provisional_shrink_bu, z1_cur: $.data.current_bu } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_z}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 100.00, fill_moisture_pct: 14.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_z2: $.data.id, z2_prov: $.data.provisional_shrink_bu } }
          assert:
            - "at exactly standard 15.0: provisional_shrink_bu == 0.00 and current_bu == 100.00 (> not >=)"
            - "below standard 14.0: provisional_shrink_bu == 0.00 (no negative shrink)"
            - "GET /grain/lots/${lot_z1}/shrink-events total_count == 0 (no PROVISIONAL event when shrink is zero)"
      - name: waterfall_fifo_tiebreak_created_at
        claim_type: correct_result
        grounds: ["calculations.allocation_waterfall", "entities.LoadOut.fields.draws"]
        distinguishing_aspect: "Two lots share fill_date 2026-08-01; the FIFO tie-break is created_at ASC (never id): the earlier-created lot A is drawn first, and the draw list contains only A for a 100.00 settle."
        test_recipe:
          setup: ["corn bin BIN-W with lot A 500.00 then lot B 800.00, both @15.0% filled 2026-08-01", "contract 2000; loadout planned 100.00 delivered net 100.00"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-W", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_w: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_w}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 500.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_wa: $.data.id } }
            - { call: "POST /grain/lots", payload: { bin_id: "${bin_w}", crop: "CORN", grade: "GRADE_1", fill_date: "2026-08-01T00:00:00Z", original_bu: 800.00, fill_moisture_pct: 15.0, fill_basis_cents: -25, reference_price_cents_per_bu: 430 }, as: SiteManager, captures: { lot_wb: $.data.id } }
            - { call: "POST /grain/contracts", payload: { crop: "CORN", contracted_bu: 2000.00, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", basis_cents_per_bu: -20, futures_ref_cents_per_bu: 450 }, as: FarmOwner, captures: { con_w: $.data.id, con_w_v: $.data.version } }
            - { call: "POST /grain/loadouts", payload: { contract_id: "${con_w}", bin_id: "${bin_w}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", planned_bu: 100.00, expected_contract_version: "${con_w_v}" }, as: SiteManager, captures: { lo_w: $.data.id } }
            - { call: "POST /grain/loadouts/${lo_w}/dispatch", payload: {}, as: SiteManager }
            - { call: "POST /grain/loadouts/${lo_w}/deliver", payload: { delivered_at: "2026-08-10T10:00:00Z", scale_tickets: [ { ticket_no: "T1", gross_bu: 100.00, moisture_pct: 15.0 } ] }, as: SiteManager }
          trigger:
            - { call: "POST /grain/loadouts/${lo_w}/confirm-settlement", payload: {}, as: SiteManager, captures: { w_draws: $.data.draws } }
            - { call: "GET /grain/lots/${lot_wa}", payload: {}, as: SiteManager, captures: { wa_cur: $.data.current_bu, wa_st: $.data.status } }
            - { call: "GET /grain/lots/${lot_wb}", payload: {}, as: SiteManager, captures: { wb_cur: $.data.current_bu, wb_st: $.data.status } }
          assert:
            - "draws == [ { lot_id: ${lot_wa}, bu: 100.00 } ] (single entry, earlier-created lot first)"
            - "lot A current_bu == 400.00, status PARTIALLY_DRAWN; lot B current_bu == 800.00 untouched, status STORED"
      - name: posture_precedence_lockout_over_alert
        claim_type: input_set_filtering
        grounds: ["calculations.posture_derivation"]
        distinguishing_aspect: "With an OPEN hotspot alert AND an active fumigation on the same bin, posture is FUMIGATION_LOCKOUT — the fumigation clause outranks the alert clause."
        test_recipe:
          setup: ["corn bin BIN-PP with lot 100.00 @15.0% and an OPEN hotspot alert"]
          setup_api_calls:
            - { call: "POST /grain/bins", payload: { name: "BIN-PP", capacity_bu: 5000, crop: "CORN" }, as: SiteManager, captures: { bin_pp: $.data.id } }
