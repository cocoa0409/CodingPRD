        distinguishing_aspect: "Completing an AERATION task appends a RECOVERY_CREDIT ledger entry whose rest_credit_hours is capped at the field's outstanding 3.83-hour obligation rather than AERATION's nominal RECOVERY_CREDIT_HOURS of 12.00, clears rest_debt_hours to 0.00 and lifts play_status from RESTRICTED back to OPEN - all without touching cumulative_wear_units, which stays 3.65."
