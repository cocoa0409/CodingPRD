          Precision at an exact tie inside the nested minimum rather than at a monetary
          threshold: requested_cents == quarter_cap == 440000000 resolves
          binding_constraint to REQUEST because REQUEST precedes QUARTER_CAP in the fixed
          precedence list, and requested_cents 440000001 (one cent over) returns
