            - { call: "POST /api/maintenance-events", payload: { machine_id: "${mach}", event_type: PREVENTIVE, window_start: "2026-05-10T09:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: BiomedTechnician, captures: { evt: $.data.id } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 10 } ], expected_patient_version: "${pat_v2}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id } }
            - { call: "POST /api/in-center-chairs", payload: { program_id: "${prog}", chair_code: "CH-1" }, as: ProgramAdmin, captures: { chair: $.data.id } }
            - { call: "POST /api/backup-slot-reservations", payload: { patient_id: "${pat}", chair_id: "${chair}", slot_start: "2026-05-12T10:00:00Z", slot_end: "2026-05-12T12:00:00Z" }, as: Patient, as_user_id: "${pat}", captures: { slot: $.data.id } }
            - { call: "POST /api/transition-records", payload: { patient_id: "${pat}", direction: HOME_TO_CENTER, reason_code: PATIENT_CHOICE, effective_from: "2026-05-02" }, as: Patient, as_user_id: "${pat}", captures: { trans: $.data.id } }
            - { call: "POST /api/transition-records/${trans}/approve", as: Nephrologist }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/transition-records/${trans}/activate", as: Nephrologist }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pstatus: $.data.program_status, posture: $.data.posture } }
            - { call: "GET /api/dialysis-machines/${mach}", as: ProgramAdmin, captures: { mstatus: $.data.status, massignee: $.data.assigned_patient_id } }
            - { call: "GET /api/dialysis-machines/${mach}/maintenance-events", as: ProgramAdmin, captures: { estatus: "$.data[0].status" } }
            - { call: "GET /api/patients/${pat}/emergency-backup-plans", as: ProgramAdmin, captures: { planstatus: "$.data[0].status" } }
            - { call: "GET /api/supply-orders/${ord}", as: ProgramAdmin, captures: { ostatus: $.data.order_status } }
            - { call: "GET /api/patients/${pat}/backup-slot-reservations", as: ProgramAdmin, captures: { sstatus: "$.data[0].status" } }
          assert:
            - "Patient.${pat}.program_status == TRANSITIONED_OUT and posture == BLOCKED"
            - "DialysisMachine.${mach}.status == IN_STOCK and assigned_patient_id == null   (link 1 caused by patient transition)"
            - "MaintenanceEvent.${evt}.status == CANCELLED   (link 2 caused by the machine status change — the machine lost its custodian)"
            - "EmergencyBackupPlan.${plan}.status == CLOSED"
            - "SupplyOrder.${ord}.order_status == CANCELLED"
            - "BackupSlotReservation.${slot}.status == CANCELLED"

      - name: assessment_accept_cap_shrink_cancels_open_orders
        grounds:
          - state_machines.HomeAssessment.SUBMITTED_to_ACCEPTED
          - state_machines.HomeAssessment.ACCEPTED_to_SUPERSEDED
          - calculations.home_assessment_evaluation
          - entities.Patient.fields.storage_cap_units
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (assessment accept): accept -> prior ACCEPTED
          assessment SUPERSEDED -> patient.storage_cap_units recomputed 400 -> 100 -> the open
          SUBMITTED 300-unit order no longer fits and is cascade-CANCELLED.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient, tpw=7 units_per_treatment=12 (allowance 336), first assessment sqft 100 (cap 400) ACCEPTED"
            - "May order of 300 CONCENTRATE_5L units in SUBMITTED (on_hand 0, fits cap 400 and allowance 336)"
            - "second assessment with sqft 25 (cap 100) SUBMITTED by nurse-1"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program I", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "CONCENTRATE_5L", name: "Concentrate 5L", unit_price_cents: 4000, handling_rate_cents: 20, unit_credit_cents: 1000 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
