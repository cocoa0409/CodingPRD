# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references the nine Difficulty Rules (§0.5) against the scaffold's
# §1.1–§1.7 declarations. Every `name` is unique and stable; every `grounds`
# entry resolves to a declared element in SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_split_posting_vs_reversal
        grounds:
          - calculations.settlement_split
          - state_machines.Settlement.DRAFT_to_POSTED
          - state_machines.Settlement.POSTED_to_REVERSED
          - entities.Settlement.fields.kind
          - entities.Settlement.fields.platform_commission_cents
          - entities.Settlement.fields.distributor_amount_cents
          - entities.Settlement.fields.cinema_amount_cents
        distinguishing_aspect: |
          Same Showtime + tickets, two algorithms produce different totals: POSTING uses round-then-sum
          over the FULL VALID-ticket set; REVERSAL uses per-ticket arithmetic on the SINGLE refunded
          ticket, so promo eligibility recomputed on the reduced set can flip effective_bps. This is
          the Settlement domain (POSTING vs REVERSAL on the Settlement ledger).
        test_recipe:
          setup:
            - "POST /distributors with default_split_ratio_bps=6000, min_show_count_per_week=0; capture distributor.id"
            - "POST /films with distributor_id, duration_minutes=90, format=2D, region_strategy.allowed_regions=[REG_A], tier_caps={TIER_1:5,TIER_2:5,TIER_3:5}; capture film.id"
            - "POST /_clock/advance to_timestamp = film.release_date (later)"
            - "POST /films/{film_id}/release"
            - "POST /cinemas with region_code=REG_A, tier=TIER_1"
            - "POST /cinemas/{id}/screens with supported_formats=[2D], operating_start_minute=600, operating_end_minute=1440, cleaning_interval_minutes=10, trailer_minutes=10, ad_minutes=5, seat_capacity=100"
            - "POST /screens/{id}/showtimes with start_minute=700, ticket_price_cents=1500, presale_opens_at=now"
            - "POST /_sweep/run so showtime.sale_status:=ON_SALE"
            - "POST /showtimes/{id}/tickets x3 with paid_amount_cents=1500, no promo (yielding 3 VALID tickets)"
            - "POST /_clock/advance past business_date+end_minute; POST /_sweep/run so lifecycle_status:=COMPLETED"
          trigger:
            - "POST /settlements with showtime_id and cycle_label='2026-W19' (creates POSTING DRAFT)"
            - "POST /settlements/{id}/post (POSTING→POSTED)"
            - "POST /tickets/{ticket_id}/refund on one ticket (triggers REVERSAL Settlement append)"
          assert:
            - "POSTING Settlement.platform_commission_cents == 360"   # 3 * round_half_up(1500*800/10000)=3*120
            - "POSTING Settlement.tax_cents == 248"                   # round_half_up((4500-360)*600/10000)=248
            - "POSTING Settlement.distributor_amount_cents == 2335"   # round_half_up((4140-248)*6000/10000)=2335
            - "POSTING Settlement.cinema_amount_cents == 1557"        # 3892 - 2335
            - "REVERSAL Settlement.gross_cents == -1500"
            - "REVERSAL Settlement.platform_commission_cents == -120"
            - "Sum over POSTING + REVERSAL rows: distributor + cinema + tax + platform == 3000 (net of refunded ticket)"

      - name: presale_anomaly_rolling_vs_cumulative
        grounds:
          - calculations.presale_anomaly_score
          - entities.AnomalyAlert.fields.rule
          - entities.Ticket.fields.buyer_external_id
          - entities.Ticket.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Same buyer/showtime, two algorithms with different temporal windows: ROLLING_WINDOW uses
          a 60-minute slice (threshold 10), CUMULATIVE uses unbounded history (threshold 30); they
          can disagree on whether a purchase is anomalous depending on inter-purchase spacing.
          This sits in the Ticket/Buyer domain — a different entity domain from settlement_split.
        test_recipe:
          setup:
            - "Same Showtime as previous test, seat_capacity raised to 100, no other tickets"
            - "Reset clock to presale_opens_at and sweep so sale_status=ON_SALE"
            - "POST /showtimes/{id}/tickets x9 within 5 simulated minutes (clock advances by 30s each), same buyer_external_id='b1'"
          trigger:
            - "POST /showtimes/{id}/tickets — the 10th ticket — same buyer, still within the same 60-minute window"
          assert:
            - "10th purchase rejected with HTTP 409 and error_id=ERR_PRESALE_ANOMALY_DETECTED"
            - "AnomalyAlert row appended with rule='ROLLING_WINDOW', triggering_count==10, buyer_external_id=='b1'"
            - "Ticket count for that buyer remains 9 (the rejected purchase was NOT persisted)"
            - "On a parallel buyer 'b2' purchasing tickets spaced more than 60 minutes apart, after 30 purchases the 30th is rejected with rule='CUMULATIVE', triggering_count==30 — proving the two variants are independent verdicts"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: showtime_block_minutes_mode_a
        grounds:
          - calculations.showtime_block_minutes
          - entities.Film.fields.format
          - entities.Film.fields.duration_minutes
          - entities.Screen.fields.trailer_minutes
          - entities.Screen.fields.ad_minutes
          - entities.Showtime.fields.block_minutes
          - entities.Showtime.fields.end_minute
        distinguishing_aspect: |
          Mode (a) — formula has 4 inputs (Film.duration_minutes, Screen.trailer_minutes,
          Screen.ad_minutes, Film.format) with non-linear interaction via a conditional branch
          on Film.format selecting one of three format_setup constants (5/3/0). Two valid scaffold
          inputs that differ only in format produce different block_minutes.
        test_recipe:
          setup:
            - "POST /films Film_IMAX with duration_minutes=120, format=IMAX; release; capture id"
            - "POST /films Film_2D   with duration_minutes=120, format=2D;   release; capture id"
            - "POST /cinemas; POST /screens with supported_formats=[2D,3D,IMAX], trailer_minutes=10, ad_minutes=5, operating_start_minute=0, operating_end_minute=1440, seat_capacity=100"
          trigger:
            - "POST /screens/{id}/showtimes for Film_IMAX, start_minute=600"
            - "POST /screens/{id}/showtimes for Film_2D,   start_minute=900 (gap ensures no screen conflict)"
          assert:
            - "Showtime(IMAX).block_minutes == 140"   # 120 + 10 + 5 + 5
            - "Showtime(IMAX).end_minute   == 740"
            - "Showtime(2D).block_minutes  == 135"    # 120 + 10 + 5 + 0
            - "Showtime(2D).end_minute     == 1035"

      - name: settlement_split_rounding_order_mode_b
        grounds:
          - calculations.settlement_split
          - entities.Settlement.fields.platform_commission_cents
          - entities.Settlement.fields.tax_cents
          - entities.Settlement.fields.distributor_amount_cents
          - entities.Settlement.fields.cinema_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Per-ticket round-half-up THEN sum
          for platform_commission_cents diverges from sum-then-round on engineered inputs;
          the scaffold pins per-line round-then-sum. Witness inputs prove a swapped order
          produces a different cent total.
        test_recipe:
          setup:
            - "Create Distributor with default_split_ratio_bps=6000, min_show_count_per_week=0"
            - "Create Film(2D, duration=90)/Cinema/Screen(supported_formats=[2D], seat_capacity=10); release film"
            - "Create Showtime; sweep to ON_SALE"
            - "POST /showtimes/{id}/tickets x3 with paid_amount_cents=156 each, no promo (witness inputs: per-line 156*800/10000=12.48 round_half_up=12 each; sum=36. Sum-then-round: 468*800/10000=37.44 round_half_up=37. Pinned answer: 36.)"
            - "Advance clock past end_minute; sweep to COMPLETED"
          trigger:
            - "POST /settlements with showtime_id, cycle_label='2026-W19' (DRAFT POSTING)"
            - "POST /settlements/{settlement_id}/post"
          assert:
            - "Settlement.platform_commission_cents == 36   # 3 * round_half_up(156*800/10000) = 3*12 = 36; an implementation using sum-then-round would emit 37 and fail this assertion"
            - "Settlement.gross_cents == 468"
            - "Settlement.tax_cents == round_half_up((468-36)*600/10000) == 26   # 432*0.06=25.92 → 26"
            - "Settlement.distributor_amount_cents == round_half_up((432-26)*6000/10000) == 244   # 406*0.6=243.6 → 244"
            - "Settlement.cinema_amount_cents == 406 - 244 == 162"
            - "Invariant: 36 + 26 + 244 + 162 == 468 (== gross)"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: film_release_shelve_cycle
        grounds:
          - state_machines.Film
          - state_machines.Film.RELEASED_to_SHELVED
          - state_machines.Film.SHELVED_to_RELEASED
          - entities.Film.fields.status
          - entities.Film.fields.shelved_reason
        distinguishing_aspect: |
          Non-linear (cyclic) — Film.status traverses RELEASED → SHELVED → RELEASED → SHELVED
          arbitrarily many times. Each transition carries divergent side effects (shelved_reason
          set/cleared; future Showtimes flip sale_status). Belongs to the Film entity.
        test_recipe:
          setup:
            - "Create Distributor, Film at PLANNED; advance clock to release_date; release film"
            - "Schedule a Showtime in the future"
          trigger:
            - "POST /films/{id}/shelve reason='low_demand'"
            - "POST /films/{id}/release"
            - "POST /films/{id}/shelve reason='reshoot_required'"
          assert:
            - "After shelve#1: Film.status=='SHELVED' AND Film.shelved_reason=='low_demand' AND future Showtime.sale_status=='CLOSED'"
            - "After release: Film.status=='RELEASED' AND Film.shelved_reason is null AND future Showtime.sale_status reopens to 'PRESALE' (since presale not yet reached)"
            - "After shelve#2: Film.status=='SHELVED' AND Film.shelved_reason=='reshoot_required' — cycle is observable"
            - "AuditLog has rows action=FILM_SHELVE x2, FILM_RELEASE x1 (in addition to the initial RELEASE)"

      - name: showtime_parallel_sale_and_lifecycle
        grounds:
          - state_machines.Showtime.sale_status
          - state_machines.Showtime.lifecycle_status
          - entities.Showtime.fields.sale_status
          - entities.Showtime.fields.lifecycle_status
        distinguishing_aspect: |
          Non-linear (parallel dimensions) — Showtime carries two independent state fields,
          sale_status (PRESALE→ON_SALE→CLOSED) and lifecycle_status (SCHEDULED→IN_PROGRESS→
          COMPLETED, with CANCELLED as alternate terminal). The two evolve independently:
          sale_status can hit CLOSED while lifecycle_status is still SCHEDULED (after Film.shelve).
          Belongs to the Showtime entity (different from Film).
        test_recipe:
          setup:
            - "Create Distributor/Film/Cinema/Screen; release film; create Showtime with presale_opens_at in 1 hour"
          trigger:
            - "POST /_clock/advance to presale_opens_at + 1 minute; POST /_sweep/run"
            - "POST /films/{film_id}/shelve reason='paused_release'"
          assert:
            - "Before sweep: Showtime.sale_status=='PRESALE', Showtime.lifecycle_status=='SCHEDULED'"
            - "After sweep: Showtime.sale_status=='ON_SALE', Showtime.lifecycle_status=='SCHEDULED' (parallel)"
            - "After shelve: Showtime.sale_status=='CLOSED', Showtime.lifecycle_status=='SCHEDULED' (sale dimension changed while lifecycle dimension did NOT)"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: film_delist_four_hop_cascade
        grounds:
          - state_machines.Film.RELEASED_to_DELISTED
          - state_machines.Showtime.lifecycle_status.SCHEDULED_to_CANCELLED
          - entities.Ticket.fields.status
          - entities.Settlement.fields.kind
          - entities.ScheduleAdjustment
        distinguishing_aspect: |
          Depth-4 chain originating from POST /films/{id}/delist:
            (1) Film.status:=DELISTED CAUSES
            (2) each affected Showtime.lifecycle_status:=CANCELLED (cascade hop 1), which itself THEN
            (3) flips each VALID Ticket.status to REFUNDED (the Showtime cancel CAUSES the ticket
                refund, not the Film delist directly), which THEN
            (4) appends a REVERSAL Settlement row for each refunded ticket whose POSTING was POSTED.
          Each link is caused by the previous link, not by the delist. Trigger: FILM_DELIST.
        test_recipe:
          setup:
            - "Create Distributor/Film/Cinema/Screen; release film"
            - "Create two future Showtimes, sell 2 VALID tickets each (4 tickets total)"
            - "Advance clock past 1st showtime; sweep so it COMPLETES; POST settlement and POST it (POSTED)"
          trigger:
            - "POST /films/{film_id}/delist"
          assert:
            - "Film.status=='DELISTED'"
            - "Both Showtimes' lifecycle_status=='CANCELLED' with cancel_reason='INCIDENT'"
            - "All 4 Tickets transitioned to status=='REFUNDED' (including the 2 from the COMPLETED showtime)"
            - "Settlement count grows: original POSTING row remains, and 2 REVERSAL rows appended with parent_settlement_id pointing at the POSTING"
            - "When sum of REVERSAL.gross_cents over those rows offsets POSTING.gross_cents, POSTING.status:=='REVERSED'"
            - "ScheduleAdjustment count == 2 (one per cancelled Showtime), adjustment_type='CANCEL', reason='INCIDENT'"
            - "AuditLog contains FILM_DELIST, SHOWTIME_CANCEL x2, TICKET_REFUND x4, SETTLEMENT_REVERSE x1"

      - name: showtime_cancel_three_hop_cascade
        grounds:
          - state_machines.Showtime.lifecycle_status.SCHEDULED_to_CANCELLED
          - entities.Ticket.fields.status
          - entities.Settlement.fields.kind
        distinguishing_aspect: |
          Depth-3 chain originating from POST /showtimes/{id}/cancel:
            (1) Showtime.lifecycle_status:=CANCELLED CAUSES
            (2) each VALID Ticket.status:=REFUNDED (the cancel CAUSES the refund), which THEN
            (3) appends a REVERSAL Settlement row.
          Different originating trigger than rule_4.film_delist (SHOWTIME_CANCEL vs FILM_DELIST).
        test_recipe:
          setup:
            - "Create Distributor/Film/Cinema/Screen; release film"
            - "Create Showtime, sell 3 VALID tickets at paid_amount_cents=1000 each, advance clock past end_minute and sweep to COMPLETED; POST settlement and POST it"
            - "Reset by creating a SECOND Showtime in SCHEDULED state with 2 VALID tickets (paid=1000 each) — do NOT settle this one (POSTING not posted)"
          trigger:
            - "POST /showtimes/{second_showtime_id}/cancel with cancel_reason=INCIDENT"
          assert:
            - "Second Showtime.lifecycle_status=='CANCELLED', cancel_reason=='INCIDENT'"
            - "Both tickets on the cancelled Showtime are status=='REFUNDED'"
            - "Because no POSTING Settlement existed for the cancelled showtime, NO REVERSAL row appended for it; this proves hop 3 fires only when hop 2 finds a POSTED Settlement — i.e., the chain is conditional and link-by-link"
            - "Now run a parallel scenario: cancel the FIRST showtime — its 3 tickets refund AND a REVERSAL Settlement is appended (hop 3 fires)"
            - "AuditLog ordering: SHOWTIME_CANCEL precedes TICKET_REFUND precedes SETTLEMENT_REVERSE within the same request"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_referential_on_cancel_double
        grounds:
          - validations[priority=5]    # ERR_INVALID_STATE (state)
          - validations[priority=16]   # ERR_MIN_SHOW_COUNT_BREACH (business_referential)
          - state_machines.Showtime.lifecycle_status.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Category pair: state (priority 5, ERR_INVALID_STATE) vs business_referential (priority
          16, ERR_MIN_SHOW_COUNT_BREACH). A second cancel attempt on an already-CANCELLED
          showtime — engineered so that the cancel would ALSO breach the distributor weekly
          minimum if it were allowed — must return ERR_INVALID_STATE (state check fires first),
          NOT ERR_MIN_SHOW_COUNT_BREACH.
        test_recipe:
          setup:
            - "Create Distributor with min_show_count_per_week=3"
            - "Create Film/Cinema/Screen; release film"
            - "Create exactly 3 Showtimes for this distributor on the same ISO-week in this cinema (S1, S2, S3) to satisfy weekly minimum"
            - "POST /showtimes/{S1}/cancel with cancel_reason='INCIDENT', version=current   # S1 now CANCELLED; weekly count drops to 2 (allowed because reason=INCIDENT)"
          trigger:
            - "POST /showtimes/{S1}/cancel a SECOND time with cancel_reason='LOW_ATTENDANCE', version=S1.version   # S1 is already CANCELLED AND if it weren't, cancelling it now would drop count from 2 to 1 (still under 3) — both checks would fire"
          assert:
            - "Response: HTTP 409, error_id=='ERR_INVALID_STATE' (priority 5 wins; the already-cancelled state is rejected before the weekly-minimum referential check runs)"
            - "Showtime S1 unchanged (still lifecycle_status='CANCELLED', original cancel_reason='INCIDENT')"
            - "No AuditLog row appended for the failed second cancel"

      - name: safety_beats_fiscal_on_anomaly
        grounds:
          - validations[priority=8]   # ERR_PRESALE_ANOMALY_DETECTED (business_safety)
          - validations[priority=15]  # ERR_PER_BUYER_LIMIT_EXCEEDED (business_fiscal)
          - calculations.presale_anomaly_score
        distinguishing_aspect: |
          Category pair: business_safety (priority 8, ERR_PRESALE_ANOMALY_DETECTED) vs
          business_fiscal (priority 15, ERR_PER_BUYER_LIMIT_EXCEEDED). A request engineered
          to trip BOTH must return the safety error (lower priority number).
        test_recipe:
          setup:
            - "Configure a Showtime, sell 19 VALID tickets to buyer='b1' (just under PER_BUYER_HARD_CAP=20) within a single hour to also approach ROLLING_WINDOW_THRESHOLD=10 (rolling will already have tripped earlier — engineer carefully: instead, sell 9 within last 60min, plus 10 older, total=19, so rolling=9 not yet >=10, fiscal=19 not yet >=20)"
            - "Sell 10th ticket within window now: rolling=10 → trips anomaly. Also 20th total → trips fiscal."
          trigger:
            - "POST /showtimes/{id}/tickets with buyer_external_id='b1'"
          assert:
            - "Response: HTTP 409, error_id=='ERR_PRESALE_ANOMALY_DETECTED' (priority 8 wins)"
            - "AnomalyAlert row created for the offending purchase even though purchase was rejected — proving safety check ran"
            - "Ticket count for b1 remains 19 (the rejected purchase was NOT persisted)"
            - "ERR_PER_BUYER_LIMIT_EXCEEDED is NOT returned despite the fiscal condition also being true"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: low_attendance_strict_less_than
        grounds:
          - calculations.attendance_rate
          - validations[priority=5]
          - state_machines.Showtime.lifecycle_status.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Boundary at LOW_ATTENDANCE_THRESHOLD_BPS=1500 with STRICT '<' semantics. A
          showtime with attendance_rate_bps == 1500 does NOT qualify; the cancel attempt
          with cancel_reason=LOW_ATTENDANCE must be rejected. Different metric than the
          seat-capacity boundary below.
        test_recipe:
          setup:
            - "Create Distributor/Film/Cinema/Screen with seat_capacity=100, ticket_price_cents=100"
            - "Create Showtime; sell exactly 15 VALID tickets (gross=1500, max_revenue=10000, rate_bps=1500)"
          trigger:
            - "POST /showtimes/{id}/cancel with cancel_reason='LOW_ATTENDANCE', version=current"
          assert:
            - "Response: HTTP 409, error_id=='ERR_INVALID_STATE' (precondition fails because attendance_rate_bps=1500 NOT < 1500)"
            - "Showtime.lifecycle_status remains 'SCHEDULED'"
            - "Now sell ZERO tickets on a fresh Showtime (rate_bps=0): cancel with LOW_ATTENDANCE succeeds — boundary is inclusive-zero, strict-upper"

      - name: seat_capacity_inclusive_upper
        grounds:
          - validations[priority=14]
          - entities.Screen.fields.seat_capacity
          - entities.Showtime.fields.tickets_sold_count
        distinguishing_aspect: |
          Boundary on tickets_sold_count + 1 <= seat_capacity (inclusive '<='). The
          (seat_capacity)-th sale succeeds; the (seat_capacity+1)-th rejects with
          ERR_SEAT_CAPACITY_EXCEEDED. Different metric (count) and different endpoint
          (POST /showtimes/{id}/tickets) from the attendance_rate boundary.
        test_recipe:
          setup:
            - "Create Distributor/Film/Cinema/Screen with seat_capacity=2, ticket_price_cents=500"
            - "Create Showtime, sweep to ON_SALE"
          trigger:
            - "POST /showtimes/{id}/tickets x2 (each succeeds)"
            - "POST /showtimes/{id}/tickets x1 (the 3rd)"
          assert:
            - "First two purchases return HTTP 201; tickets_sold_count==2"
            - "Third purchase returns HTTP 409 with error_id=='ERR_SEAT_CAPACITY_EXCEEDED'"
            - "Showtime.tickets_sold_count remains 2 (rejected purchase not persisted)"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: showtime_sale_depends_on_film_status
        grounds:
          - validations[priority=6]
          - state_machines.Showtime.sale_status.PRESALE_to_ON_SALE
          - entities.Film.fields.status
          - entities.Showtime.fields.sale_status
        distinguishing_aspect: |
          Entity pair: Showtime → Film. A Showtime cannot transition sale_status to ON_SALE
          unless its parent Film.status == RELEASED. Belongs to (Showtime, Film) pair.
        test_recipe:
          setup:
            - "Create Distributor/Film at PLANNED (do NOT release); Cinema/Screen/Showtime"
            - "Advance clock past presale_opens_at"
          trigger:
            - "POST /_sweep/run"
            - "POST /showtimes/{id}/tickets attempt"
          assert:
            - "After sweep: Showtime.sale_status remains 'PRESALE' (NOT ON_SALE) because Film.status='PLANNED'"
            - "Ticket purchase attempt returns HTTP 409 with error_id=='ERR_FILM_NOT_RELEASED'"
            - "After POST /films/{id}/release and POST /_sweep/run: Showtime.sale_status=='ON_SALE', ticket purchase succeeds"

      - name: settlement_post_depends_on_showtime_completion
        grounds:
          - validations[priority=7]
          - state_machines.Settlement.DRAFT_to_POSTED
          - entities.Showtime.fields.lifecycle_status
          - entities.Settlement.fields.status
        distinguishing_aspect: |
          Entity pair: Settlement → Showtime. POST /settlements/{id}/post is rejected unless
          the underlying Showtime.lifecycle_status == COMPLETED. Different entity pair from
          Showtime→Film.
        test_recipe:
          setup:
            - "Create Distributor/Film/Cinema/Screen, release film, create Showtime, sell 1 ticket"
            - "POST /settlements with showtime_id, cycle_label='2026-W19' — creates DRAFT POSTING"
            - "Do NOT advance clock — Showtime.lifecycle_status remains 'SCHEDULED'"
          trigger:
            - "POST /settlements/{settlement_id}/post"
          assert:
            - "Response: HTTP 409, error_id=='ERR_SHOWTIME_NOT_COMPLETED'"
            - "Settlement.status remains 'DRAFT'"
            - "After advancing clock past end_minute and sweeping (lifecycle_status='COMPLETED'), POST /settlements/{id}/post returns 200 and Settlement.status=='POSTED'"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: screen_half_open_with_cleaning_buffer
        grounds:
          - validations[priority=11]
          - calculations.showtime_block_minutes
          - entities.Screen.fields.cleaning_interval_minutes
          - concurrency_rules[Two scheduling calls try to create overlapping Showtimes on the same Screen]
        distinguishing_aspect: |
          Interval semantics — half-open intervals [start, end) with a cleaning_interval_minutes
          buffer ADDED TO THE RIGHT of the earlier showtime; the next showtime's start_minute
          must be >= existing.end_minute + cleaning_interval_minutes. Sits on the Screen resource.
        test_recipe:
          setup:
            - "Create Distributor/Film(2D, duration=90)/Cinema/Screen with trailer=10, ad=5, cleaning_interval_minutes=15, operating_start_minute=600, operating_end_minute=1440, seat_capacity=100, supported_formats=[2D]; release film"
            - "POST /screens/{id}/showtimes start_minute=700 (block_minutes=105 → end_minute=805)"
          trigger:
            - "Attempt #1: POST /screens/{id}/showtimes for SAME screen, start_minute=820 — boundary at 805+15=820 inclusive"
            - "Attempt #2: POST /screens/{id}/showtimes for SAME screen, start_minute=819"
          assert:
            - "Attempt #1 (start_minute=820): HTTP 201 success — start_minute == earlier.end_minute + cleaning_interval is the FIRST allowed slot (inclusive lower bound for the next showtime)"
            - "Attempt #2 (start_minute=819): HTTP 409 with error_id=='ERR_SCREEN_TIME_CONFLICT' — one minute before the buffered boundary collides"

      - name: cinema_peak_density_cap_closed_membership
        grounds:
          - validations[priority=13]
          - entities.Cinema.fields.peak_window_start_minute
          - entities.Cinema.fields.peak_window_end_minute
          - entities.Showtime.fields.distributor_id
        distinguishing_aspect: |
          Interval semantics — peak-window membership uses CLOSED-CLOSED point-membership on
          start_minute (NOT the half-open [start,end) used for screen conflict). Aggregate
          capacity cap COMPETING_PEAK_CAP=1 per (Cinema, Distributor, business_date) within
          [peak_window_start_minute, peak_window_end_minute). Sits on the Cinema resource
          (NOT Screen — competing-film coordination spans screens in the same cinema).
        test_recipe:
          setup:
            - "Create Distributor D1; two Films F1, F2 from D1 (different titles); release both"
            - "Create Cinema with peak_window_start_minute=1080 (18:00), peak_window_end_minute=1380 (23:00)"
            - "Create two Screens S_A, S_B in the same Cinema, both supporting 2D"
            - "POST /screens/{S_A}/showtimes for F1, start_minute=1100 (in peak window)"
          trigger:
            - "POST /screens/{S_B}/showtimes for F2 (same distributor D1), start_minute=1200 (also in peak window, different screen, different film)"
            - "POST /screens/{S_B}/showtimes for F2, start_minute=1080 (boundary lower-bound)"
            - "POST /screens/{S_B}/showtimes for F2, start_minute=1380 (boundary upper-bound — exclusive on end)"
          assert:
            - "Attempt at start_minute=1200: HTTP 409 with error_id=='ERR_COMPETING_FILM_CONFLICT' — cap is 1 per distributor per cinema per peak window per business_date and S_A already used the slot"
            - "Attempt at start_minute=1080 (the inclusive lower bound): also rejected with ERR_COMPETING_FILM_CONFLICT (boundary belongs to the window)"
            - "Attempt at start_minute=1380 (exclusive upper bound): HTTP 201 success — 1380 is NOT in [1080,1380), proving the window is half-open on the right (different geometry from the screen-conflict rule above which uses buffered right boundary)"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: money_conservation_across_settlement_refund
        grounds:
          - calculations.settlement_split
          - state_machines.Settlement.POSTED_to_REVERSED
          - entities.Settlement.fields.platform_commission_cents
          - entities.Settlement.fields.tax_cents
          - entities.Settlement.fields.distributor_amount_cents
          - entities.Settlement.fields.cinema_amount_cents
          - entities.Ticket.fields.paid_amount_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY (cents). After all POSTING and REVERSAL rows for a
          Showtime are summed, the invariant
            Σ(distributor_amount_cents + cinema_amount_cents + tax_cents + platform_commission_cents)
              ==  Σ paid_amount_cents over Tickets still in status=VALID
          MUST hold. The pair (POST settlement / POST ticket refund append REVERSAL) is the
          forward+compensating action; running both leaves money conserved.
        test_recipe:
          setup:
            - "Create Distributor split=6000bps, Film, Cinema, Screen; release film"
            - "Create Showtime, sell 3 tickets at paid_amount_cents=1500 each, sweep to COMPLETED"
            - "POST /settlements; POST /settlements/{id}/post (POSTED — see settlement_split_posting_vs_reversal for numbers)"
          trigger:
            - "POST /tickets/{first_ticket_id}/refund (appends REVERSAL Settlement)"
          assert:
            - "Σ paid_amount_cents over VALID Tickets == 3000 (2 remaining)"
            - "Σ (distributor_amount_cents + cinema_amount_cents + tax_cents + platform_commission_cents) over ALL Settlement rows (POSTING + REVERSAL) == 3000"
            - "POSTING row unchanged: 2335 + 1557 + 248 + 360 == 4500"
            - "REVERSAL row sums: -? + -? + -? + -120 == -1500 (exact split depends on settlement_split applied to the single ticket); invariant holds across both rows"
            - "Sum invariant proves no money was created or destroyed by the refund — only redistributed across the ledger"

      - name: screen_minute_conservation_across_cancel
        grounds:
          - state_machines.Showtime.lifecycle_status.SCHEDULED_to_CANCELLED
          - calculations.showtime_block_minutes
          - validations[priority=11]
          - entities.Screen.fields.operating_start_minute
          - entities.Screen.fields.operating_end_minute
        distinguishing_aspect: |
          Conserved quantity: SCREEN TIME (minutes per business_date per Screen). Define
            scheduled_minutes(screen, date) = Σ block_minutes over Showtimes
                                              with screen_id=screen, business_date=date,
                                              lifecycle_status IN {SCHEDULED, IN_PROGRESS, COMPLETED}.
          The pair (POST /screens/{id}/showtimes ADDS block_minutes; POST /showtimes/{id}/cancel
          SUBTRACTS those same block_minutes by moving the row to CANCELLED, excluding it from
          the sum) MUST leave scheduled_minutes at the pre-creation value. A different conserved
          quantity from money (time vs cents).
        test_recipe:
          setup:
            - "Create Distributor (min_show_count_per_week=0 to avoid breach), Film(2D, duration=90), Cinema, Screen with trailer=10, ad=5, cleaning_interval=15, operating_start_minute=600, operating_end_minute=1440, supported_formats=[2D]; release"
            - "Snapshot scheduled_minutes_before = 0 (no showtimes)"
            - "POST /screens/{id}/showtimes start_minute=700 → block_minutes=105; scheduled_minutes_mid = 105"
          trigger:
            - "POST /showtimes/{id}/cancel with cancel_reason='INCIDENT', version=current"
          assert:
            - "Before cancel: Σ block_minutes for SCHEDULED+IN_PROGRESS+COMPLETED showtimes on the Screen for business_date == 105"
            - "After cancel: Σ block_minutes for SCHEDULED+IN_PROGRESS+COMPLETED showtimes on the Screen for business_date == 0 (CANCELLED rows excluded from sum)"
            - "Conservation: scheduled_minutes_after == scheduled_minutes_before (both equal 0); the minutes 'returned' to the screen by cancellation equal the minutes the creation consumed — no drift"
            - "Now schedule a replacement Showtime at start_minute=700 — succeeds, proving the 105 minutes are genuinely freed (no residual booking)"
