      - name: appeal_remand_cycle_bounded_at_two
        grounds:
          - state_machines.AppealCase.UNDER_REVIEW_to_REMANDED
          - state_machines.AppealCase.REMANDED_to_UNDER_REVIEW
          - state_machines.PermitDecision.FINAL_to_PROPOSED
          - validations[priority=22]
          - entities.AppealCase.fields.remand_count
        distinguishing_aspect: |
          AppealCase is the second non-linear machine and it is a CYCLE on a different entity
          than GrazingPermit's parallel dimensions: UNDER_REVIEW -> REMANDED -> UNDER_REVIEW can
          be traversed exactly MAX_APPEAL_REMANDS (2) times — each remand also pushes the
          appealed PermitDecision FINAL -> PROPOSED — and the third REMAND is refused with
          ERR_APPEAL_REMAND_LIMIT_EXCEEDED while the case stays UNDER_REVIEW.
        test_recipe:
          setup:
            - "One allotment and one permittee"
            - "A STOCKING_ADJUSTMENT decision authored by u_spec_1, environmentally reviewed, and finalized by u_officer_1 (segregation of duties satisfied)"
            - "An appeal filed by the permittee without a stay request, docketed by adjudicator u_judge_1, then twice remanded and twice re-finalized, so remand_count == 2 and the case is UNDER_REVIEW again"
          setup_api_calls:
            - call: "POST /allotments"
              payload: { name: "Remand Basin Allotment", admin_unit_code: "NV-046", acres: 30000, total_permitted_aums: 1200, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
