scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_commission_on_order
        grounds:
          - calculations.payout_computation
          - state_machines.Order.DELIVERED_to_CONFIRMED
          - entities.Order.fields.platform_commission_cents
        distinguishing_aspect: |
          The SAME order yields a different commission figure depending on variant:
          the provisional_estimate variant reads the talent tier at read time
          (STANDARD, 25% -> 2500 cents on a 10000-cent gross), while the
          final_settlement variant freezes the tier at the confirm transition;
          a GMV-driven tier change between read and confirm makes the frozen
          value diverge from the earlier preview. Entity domain: Order.
        test_recipe:
          setup:
            - "clock at 2026-09-01; talent ACTIVE with STANDARD tier, personal rate 10000, turnaround 72h"
            - "buyer with business account; order PERSONAL gross 10000 delivered, latest video CLEARED"
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Star One", legal_name: "Star One Legal", email: "s1@x.com", identity_document_ref: "doc-ref-1" }
              as: Talent
              captures: { t_id: $.data.id, t_ver: $.data.version }
            - call: "POST /marketplace/talents/${t_id}/identity/submit"
              payload: { identity_document_ref: "doc-ref-1" }
              as: Talent
              as_user_id: "${t_id}"
            - call: "POST /marketplace/talents/${t_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "1234" }
              as: Talent
              as_user_id: "${t_id}"
              captures: { td_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${td_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${t_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${t_ver}" }
              as: Talent
              as_user_id: "${t_id}"
              captures: { t_ver2: $.data.version }
            - call: "POST /marketplace/admin/talents/${t_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "b1@x.com", display_name: "Buyer One", is_business_account: false }
              as: Buyer
              captures: { b_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${t_id}", buyer_id: "${b_id}", use_type: "PERSONAL", occasion: "birthday", script_instructions: "say happy birthday to Sam", recipient_name: "Sam" }
              as: Buyer
              as_user_id: "${b_id}"
              captures: { o_id: $.data.id, o_tok: $.data.screening_token, o_ver: $.data.version }
            - call: "POST /marketplace/orders/${o_id}/screening-attest"
              payload: { screening_token: "${o_tok}" }
              as: Buyer
              as_user_id: "${b_id}"
            - call: "POST /marketplace/orders/${o_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${t_id}"
            - call: "POST /marketplace/orders/${o_id}/videos"
              payload: { content_url: "https://cdn.x/v1.mp4", duration_seconds: 60 }
              as: Talent
              as_user_id: "${t_id}"
              captures: { v_id: $.data.id }
            - call: "POST /marketplace/admin/videos/${v_id}/moderate"
              payload: { decision: "CLEAR" }
              as: Moderator
            - call: "GET /marketplace/orders/${o_id}"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
              captures: { o_ver_pre: $.data.version }
          trigger:
            - call: "POST /marketplace/orders/${o_id}/confirm"
              payload: {}
              as: Buyer
              as_user_id: "${b_id}"
          assert:
            - "before confirm the provisional preview tier is STANDARD (commission preview 2500 on gross 10000)"
            - "after confirm Order.${o_id}.platform_commission_cents == 2500 (tier was still STANDARD at confirm)"
            - "Order.${o_id}.talent_net_cents == 7500"
            - "a second order confirmed after the talent reaches SILVER tier freezes 2000 commission on an identical 10000 gross — preview vs final diverge across the tier change"

      - name: trailing_window_vs_lifetime_gmv_tier
        grounds:
          - calculations.commission_tier_assignment
          - entities.Talent.fields.trailing_gmv_cents
          - entities.Talent.fields.commission_tier
        distinguishing_aspect: |
          The SAME confirmation history yields different tiers under the two
          interpretations: the trailing_window variant counts only CONFIRMED
          transitions within [now-365d, now) so confirmations that age past the
          window boundary drop the talent from SILVER back to STANDARD, whereas
          a lifetime cumulative counter would keep SILVER forever. Entity
          domain: Talent (distinct from the Order-domain commission instance).
        test_recipe:
          setup:
            - "talent ACTIVE; 50 PERSONAL orders of gross 10000 each confirmed at logical time 2026-09-01 (trailing GMV exactly 500000 -> SILVER)"
            - "clock then advanced to 2027-09-02, aging every confirmation out of the trailing 365-day window"
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Star Two", legal_name: "Star Two Legal", email: "s2@x.com", identity_document_ref: "doc-ref-2" }
              as: Talent
              captures: { t2_id: $.data.id, t2_ver: $.data.version }
            - call: "POST /marketplace/talents/${t2_id}/identity/submit"
              payload: { identity_document_ref: "doc-ref-2" }
              as: Talent
              as_user_id: "${t2_id}"
            - call: "POST /marketplace/talents/${t2_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "2222" }
              as: Talent
              as_user_id: "${t2_id}"
              captures: { td2_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${td2_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${t2_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${t2_ver}" }
              as: Talent
              as_user_id: "${t2_id}"
            - call: "POST /marketplace/admin/talents/${t2_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/talents/${t2_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "with 50 x 10000-cent confirmations inside the window Talent.${t2_id}.trailing_gmv_cents == 500000 and commission_tier == SILVER (inclusive >= boundary)"
            - "after the clock ages all confirmations out of [now-365d, now) and a recompute is triggered, trailing_gmv_cents == 0 and commission_tier == STANDARD — the trailing_window variant diverges from a lifetime counter which would still read 500000/SILVER"

  - rule_id: combinatorial_formula
    instances:
      - name: licensing_fee_tiered_marginal_discount
        grounds:
          - calculations.licensing_fee
          - entities.LicenseGrant.fields.fee_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — base fee
          keyed by license_type, summed per-channel factors, territory
          multiplier, and a tiered MARGINAL day-count discount that applies
          0.9 only to days beyond 90. A 100-day ADVERTISING GLOBAL [TV,WEB]
          grant yields 71280000 cents under the marginal rule but would yield
          71280000 * ... differently under a flat whole-window discount; the
          scaffold pins the marginal interpretation.
        test_recipe:
          setup:
            - "ADVERTISING_USE order CONFIRMED (gross 80000), latest video CLEARED"
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Star Three", legal_name: "Star Three Legal", email: "s3@x.com", identity_document_ref: "doc-ref-3" }
              as: Talent
              captures: { t3_id: $.data.id, t3_ver: $.data.version }
            - call: "POST /marketplace/talents/${t3_id}/identity/submit"
              payload: { identity_document_ref: "doc-ref-3" }
              as: Talent
              as_user_id: "${t3_id}"
            - call: "POST /marketplace/talents/${t3_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "3333" }
              as: Talent
              as_user_id: "${t3_id}"
              captures: { td3_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${td3_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${t3_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${t3_ver}" }
              as: Talent
              as_user_id: "${t3_id}"
            - call: "POST /marketplace/admin/talents/${t3_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "b3@x.com", display_name: "Biz Buyer", is_business_account: true }
              as: Buyer
              captures: { b3_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${t3_id}", buyer_id: "${b3_id}", use_type: "ADVERTISING_USE", occasion: "product launch", script_instructions: "promote the widget", recipient_name: "WidgetCo" }
              as: Buyer
              as_user_id: "${b3_id}"
              captures: { o3_id: $.data.id, o3_tok: $.data.screening_token }
            - call: "POST /marketplace/orders/${o3_id}/screening-attest"
              payload: { screening_token: "${o3_tok}" }
              as: Buyer
              as_user_id: "${b3_id}"
            - call: "POST /marketplace/orders/${o3_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${t3_id}"
            - call: "POST /marketplace/orders/${o3_id}/videos"
              payload: { content_url: "https://cdn.x/ad.mp4", duration_seconds: 45 }
              as: Talent
              as_user_id: "${t3_id}"
              captures: { v3_id: $.data.id }
            - call: "POST /marketplace/admin/videos/${v3_id}/moderate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /marketplace/orders/${o3_id}/confirm"
              payload: {}
              as: Buyer
              as_user_id: "${b3_id}"
          trigger:
            - call: "POST /marketplace/orders/${o3_id}/license-grants"
              payload: { license_type: "ADVERTISING", territory: "GLOBAL", channels: ["TV", "WEB"], starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-10T00:00:00Z" }
              as: Buyer
              as_user_id: "${b3_id}"
              captures: { lg_id: $.data.id, lg_fee: $.data.fee_cents }
          assert:
            - "LicenseGrant.${lg_id}.fee_cents == 71280000  # 150000 * (2.0+1.2) * 1.5 * (90 + 0.9*10), 100-day window"
            - "the marginal tier discounts only days 91..100; a flat whole-window 10% discount would give 71280000 * ... a different value, so the assertion falsifies the rejected variant"

      - name: commission_round_half_up_and_partial_split
        grounds:
          - calculations.payout_computation
          - calculations.dispute_refund_split
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the commission rounds
          the per-order gross*rate FIRST (round_half_up to integer cents) and
          the partial-refund split separately rounds gross*0.5; an odd gross of
          10001 yields commission 2501 (round_half_up of 2500.25) and, on a
          later PARTIAL_REFUND, buyer refund 5001 (round_half_up of 5000.5) —
          rounding sum-then-split in the opposite order would shift cents.
        test_recipe:
          setup:
            - "talent ACTIVE STANDARD tier; PERSONAL order with odd gross 10001 delivered and CLEARED; clock within buyer window"
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Star Four", legal_name: "Star Four Legal", email: "s4@x.com", identity_document_ref: "doc-ref-4" }
              as: Talent
              captures: { t4_id: $.data.id, t4_ver: $.data.version }
            - call: "POST /marketplace/talents/${t4_id}/identity/submit"
              payload: { identity_document_ref: "doc-ref-4" }
              as: Talent
              as_user_id: "${t4_id}"
            - call: "POST /marketplace/talents/${t4_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "4444" }
              as: Talent
              as_user_id: "${t4_id}"
              captures: { td4_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${td4_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${t4_id}/rates"
              payload: { personal_rate_cents: 10001, business_rate_cents: 40004, advertising_rate_cents: 80008, turnaround_hours: 72, expected_talent_version: "${t4_ver}" }
              as: Talent
              as_user_id: "${t4_id}"
            - call: "POST /marketplace/admin/talents/${t4_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "b4@x.com", display_name: "Buyer Four", is_business_account: false }
              as: Buyer
              captures: { b4_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${t4_id}", buyer_id: "${b4_id}", use_type: "PERSONAL", occasion: "graduation", script_instructions: "congrats grad", recipient_name: "Lee" }
              as: Buyer
              as_user_id: "${b4_id}"
              captures: { o4_id: $.data.id, o4_tok: $.data.screening_token }
            - call: "POST /marketplace/orders/${o4_id}/screening-attest"
              payload: { screening_token: "${o4_tok}" }
              as: Buyer
              as_user_id: "${b4_id}"
            - call: "POST /marketplace/orders/${o4_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${t4_id}"
            - call: "POST /marketplace/orders/${o4_id}/videos"
              payload: { content_url: "https://cdn.x/g.mp4", duration_seconds: 30 }
              as: Talent
              as_user_id: "${t4_id}"
              captures: { v4_id: $.data.id }
            - call: "POST /marketplace/admin/videos/${v4_id}/moderate"
              payload: { decision: "CLEAR" }
              as: Moderator
            - call: "POST /marketplace/orders/${o4_id}/confirm"
              payload: {}
              as: Buyer
              as_user_id: "${b4_id}"
            - call: "GET /marketplace/orders/${o4_id}"
              payload: {}
              as: Buyer
              as_user_id: "${b4_id}"
              captures: { o4_ver_c: $.data.version }
          trigger:
            - call: "POST /marketplace/orders/${o4_id}/disputes"
              payload: { reason: "wrong name pronounced", expected_order_version: "${o4_ver_c}" }
              as: Buyer
              as_user_id: "${b4_id}"
              captures: { d4_id: $.data.id }
            - call: "POST /marketplace/admin/disputes/${d4_id}/resolve"
              payload: { outcome: "PARTIAL_REFUND", resolution_notes: "half" }
              as: PlatformAdmin
          assert:
            - "Order.${o4_id}.platform_commission_cents == 2501  # round_half_up(10001 * 0.25 = 2500.25)"
            - "Dispute.${d4_id}.refund_to_buyer_cents == 5001  # round_half_up(10001 * 0.5 = 5000.5); buyer gets the larger half"
            - "Order.${o4_id}.clawback_cents == 5001"

  - rule_id: non_linear_state_machine
    instances:
      - name: order_delivery_rerecord_cycle
        grounds:
          - state_machines.Order.DELIVERED_to_RE_RECORD_REQUESTED
          - state_machines.Order.RE_RECORD_REQUESTED_to_DELIVERED
          - state_machines.Video.PENDING_REVIEW_to_FLAGGED
        distinguishing_aspect: |
          Order carries a genuine cycle: DELIVERED -> RE_RECORD_REQUESTED ->
          DELIVERED (twice, capped by re_record_count < 2), and moderation FLAG
          forks a DELIVERED order back into the same loop from the Video
          machine. A linear pipeline could not express either path.
        test_recipe:
          setup:
            - "order delivered once with CLEARED video; clock within buyer window"
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Star Five", legal_name: "Star Five Legal", email: "s5@x.com", identity_document_ref: "doc-ref-5" }
              as: Talent
              captures: { t5_id: $.data.id, t5_ver: $.data.version }
            - call: "POST /marketplace/talents/${t5_id}/identity/submit"
              payload: { identity_document_ref: "doc-ref-5" }
              as: Talent
              as_user_id: "${t5_id}"
            - call: "POST /marketplace/talents/${t5_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "5555" }
              as: Talent
              as_user_id: "${t5_id}"
              captures: { td5_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${td5_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${t5_id}/rates"
              payload: { personal_rate_cents: 10000, business_rate_cents: 40000, advertising_rate_cents: 80000, turnaround_hours: 72, expected_talent_version: "${t5_ver}" }
              as: Talent
              as_user_id: "${t5_id}"
            - call: "POST /marketplace/admin/talents/${t5_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/buyers"
              payload: { email: "b5@x.com", display_name: "Buyer Five", is_business_account: false }
              as: Buyer
              captures: { b5_id: $.data.id }
            - call: "POST /marketplace/orders"
              payload: { talent_id: "${t5_id}", buyer_id: "${b5_id}", use_type: "PERSONAL", occasion: "anniversary", script_instructions: "mention 10 years", recipient_name: "Pat" }
              as: Buyer
              as_user_id: "${b5_id}"
              captures: { o5_id: $.data.id, o5_tok: $.data.screening_token }
            - call: "POST /marketplace/orders/${o5_id}/screening-attest"
              payload: { screening_token: "${o5_tok}" }
              as: Buyer
              as_user_id: "${b5_id}"
            - call: "POST /marketplace/orders/${o5_id}/accept"
              payload: {}
              as: Talent
              as_user_id: "${t5_id}"
            - call: "POST /marketplace/orders/${o5_id}/videos"
              payload: { content_url: "https://cdn.x/a1.mp4", duration_seconds: 30 }
              as: Talent
              as_user_id: "${t5_id}"
              captures: { v5_id: $.data.id }
            - call: "POST /marketplace/admin/videos/${v5_id}/moderate"
              payload: { decision: "CLEAR" }
              as: Moderator
          trigger:
            - call: "POST /marketplace/orders/${o5_id}/re-record-requests"
              payload: { notes: "mispronounced the name" }
              as: Buyer
              as_user_id: "${b5_id}"
            - call: "POST /marketplace/orders/${o5_id}/videos"
              payload: { content_url: "https://cdn.x/a2.mp4", duration_seconds: 35 }
              as: Talent
              as_user_id: "${t5_id}"
              captures: { v5b_id: $.data.id, v5b_ver: $.data.version_no }
          assert:
            - "after re-record request Order.${o5_id}.status == RE_RECORD_REQUESTED and re_record_count == 1"
            - "after second delivery Order.${o5_id}.status == DELIVERED and Video.${v5b_id}.version_no == 2"
            - "the cycle proves DELIVERED is re-entered, not a one-way stage"

      - name: talent_pause_resume_cycle
        grounds:
          - state_machines.Talent.ACTIVE_to_PAUSED
          - state_machines.Talent.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Talent carries an independent cyclic machine (ACTIVE <-> PAUSED, with
          PAUSED -> SUSPENDED also reachable) on a different entity than Order,
          satisfying the rule's different-entity clause.
        test_recipe:
          setup:
            - "talent ACTIVE and bookable"
          setup_api_calls:
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Star Six", legal_name: "Star Six Legal", email: "s6@x.com", identity_document_ref: "doc-ref-6" }
              as: Talent
              captures: { t6_id: $.data.id, t6_ver: $.data.version }
            - call: "POST /marketplace/talents/${t6_id}/identity/submit"
              payload: { identity_document_ref: "doc-ref-6" }
              as: Talent
              as_user_id: "${t6_id}"
            - call: "POST /marketplace/talents/${t6_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "6666" }
              as: Talent
              as_user_id: "${t6_id}"
              captures: { td6_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${td6_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents/${t6_id}/rates"
              payload: { personal_rate_cents: 5000, business_rate_cents: 20000, advertising_rate_cents: 40000, turnaround_hours: 48, expected_talent_version: "${t6_ver}" }
              as: Talent
              as_user_id: "${t6_id}"
            - call: "POST /marketplace/admin/talents/${t6_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/talents/${t6_id}/pause"
              payload: {}
              as: Talent
              as_user_id: "${t6_id}"
            - call: "POST /marketplace/talents/${t6_id}/resume"
              payload: {}
              as: Talent
              as_user_id: "${t6_id}"
          assert:
            - "after pause Talent.${t6_id}.status == PAUSED and availability == PAUSED_AVAILABILITY"
            - "after resume Talent.${t6_id}.status == ACTIVE and availability == BOOKABLE — the ACTIVE -> PAUSED -> ACTIVE cycle completed"

  - rule_id: transitive_cascade
    instances:
      - name: auto_confirm_cascades_to_payoutline_and_tier
        grounds:
          - state_machines.Order.DELIVERED_to_CONFIRMED
          - calculations.payout_computation
          - calculations.commission_tier_assignment
        distinguishing_aspect: |
          Depth-3 cascade originating from the deadline-sweep trigger: sweep
          flips Order DELIVERED -> CONFIRMED (hop 1); that transition creates
          the VIDEO_EARNING PayoutLine (hop 2); creating the line credits
          Talent.pending_balance_cents and the GMV recompute flips
          Talent.commission_tier STANDARD -> SILVER (hop 3). Each hop is caused
          by the previous mutation, not by the sweep directly.
        test_recipe:
          setup:
            - "talent STANDARD with trailing GMV 490000; one DELIVERED order gross 10000 with CLEARED video and auto_confirm_at in the past after clock advance"
          setup_api_calls:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/talents"
              payload: { stage_name: "Star Seven", legal_name: "Star Seven Legal", email: "s7@x.com", identity_document_ref: "doc-ref-7" }
              as: Talent
              captures: { t7_id: $.data.id, t7_ver: $.data.version }
            - call: "POST /marketplace/talents/${t7_id}/identity/submit"
              payload: { identity_document_ref: "doc-ref-7" }
              as: Talent
              as_user_id: "${t7_id}"
            - call: "POST /marketplace/talents/${t7_id}/tax-documents"
              payload: { doc_type: "W9", tax_id_last4: "7777" }
              as: Talent
              as_user_id: "${t7_id}"
              captures: { td7_id: $.data.id }
            - call: "POST /marketplace/admin/tax-documents/${td7_id}/review"
              payload: { decision: "VERIFY" }
              as: PlatformAdmin
