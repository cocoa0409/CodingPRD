        excluded_because:
          difficulty_instance: drill_half_open_overlap_adjacency
          rationale: "Both overlap rules (half-open drill intervals, closed report periods with boundary-touch) are asserted by §1.8 instances drill_half_open_overlap_adjacency and report_period_closed_interval_touch."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: drill_list_filter_and_pagination
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "Filtered listing: three drills exist; status=CANCELLED returns only the cancelled one; limit=1 paginates with total_count over the filtered set and has_more flipping at the last page."
        test_recipe:
          setup: ["site with FIRE requirement; drills on 2026-09-15, 2026-09-16, 2026-09-17; the third cancelled"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harborview Middle", enrollment_count: 700, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 4, min_spacing_days: 0, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-16", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-17", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { d3: $.data.id }
            - call: "POST /drill-events/${d3}/cancel"
              as: SchoolSafetyOfficer
          trigger:
            - call: "GET /sites/${site_id}/drill-events"
              payload: { status: CANCELLED }
              as: SchoolSafetyOfficer
            - call: "GET /sites/${site_id}/drill-events"
              payload: { limit: 1, offset: 0 }
              as: SchoolSafetyOfficer
            - call: "GET /sites/${site_id}/drill-events"
              payload: { limit: 1, offset: 2 }
              as: SchoolSafetyOfficer
          assert:
            - "filtered list: total_count == 1 and the sole element is DrillEvent.${d3} with status CANCELLED"
            - "page 1: data length == 1, total_count == 3, has_more == true"
            - "page 3 (offset 2): data length == 1, has_more == false"

      - name: success_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type 'object', and data."
        test_recipe:
          setup: ["one site exists"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /sites/${site_id}"
              as: SchoolSafetyOfficer
          assert:
            - "body.meta.api_request_id is a non-empty string and meta.api_request_timestamp is ISO8601"
            - "body.response_type == \"object\" and body.data.id == site_id"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_envelope_shape
        claim_type: error_envelope
        grounds: ["response_envelope", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type 'error' and data.error_id + data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "body.response_type == \"error\""
            - "body.data.error_id == ERR_NOT_FOUND and body.data.message is a non-empty string"

      - name: incomplete_coverage_rejected
        claim_type: error_trigger
        grounds: ["errors[ERR_INCOMPLETE_COVERAGE]", "validations[priority=4]"]
        distinguishing_aspect: "A site plan whose coverage_tags omit ACCESS_POINTS is rejected at input validation."
        test_recipe:
          setup: ["one site exists"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Partial plan", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS"] }
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "http 400 and error_id == ERR_INCOMPLETE_COVERAGE"

      - name: requirement_not_configured_rejected
        claim_type: error_trigger
        grounds: ["errors[ERR_REQUIREMENT_NOT_CONFIGURED]", "validations[priority=8]"]
        distinguishing_aspect: "Scheduling a LOCKDOWN drill when only FIRE is configured fails with ERR_REQUIREMENT_NOT_CONFIGURED."
        test_recipe:
          setup: ["site with FIRE requirement only"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Maplewood K-8", enrollment_count: 850, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: LOCKDOWN, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_REQUIREMENT_NOT_CONFIGURED"

      - name: roster_incomplete_and_site_plan_gate_stubs
