              payload: { target_text: "残弾", target_char_count: 60, applied_tm_match_pct: 80 }
              as: TranslationVendor
            - call: "POST /translation-units/${u_jp_hud}/deliver"
              payload: {}
              as: TranslationVendor
              captures: { jp_delivered: "$.data.translation_status" }
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
              payload: {}
              as: LocalizationProducer
              captures: { jp_status: "$.data.status", jp_units_actual: "$.data.text_effort_units", jp_variant: "$.data.text_effort_variant" }
            - call: "GET /titles/${title_id}"
              payload: {}
