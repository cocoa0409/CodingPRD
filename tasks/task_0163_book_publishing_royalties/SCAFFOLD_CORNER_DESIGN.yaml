        distinguishing_aspect: "Voiding a SubsidiaryRight that is already STATEMENTED (credited on a finalized statement) returns 409 ERR_RIGHT_ALREADY_SETTLED."
        test_recipe:
          setup: ["A right credited on a FINALIZED statement (so it is STATEMENTED)."]
