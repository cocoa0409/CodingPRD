scenario: |
  Generate task harder than expert level!

  2523. Arena Changeover & Multipurpose Venue Operations (multipurpose arena operations): event
  calendar with changeover windows between ice, court, concert and family show configurations, ice
  installation, maintenance and covering procedures with dehumidification and floor protection,
  seating configuration changes including retractable sections and curtaining for reduced-capacity
  shows, load-in and load-out scheduling with dock allocation, rigging capacity and stagehand labor
  calls, event-specific utility, network and broadcast infrastructure setup, changeover crew staffing
  with overnight shifts and turnaround time targets, equipment inventory and maintenance for staging,
  dashers and floor systems, event conflict resolution and hold priority for anchor tenants

domain_name: arena-changeover-ops
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is its own top-level collection linked by explicit foreign keys. Only four
  # read paths are nested (`/venues/{id}/<child>`, `/event-bookings/{id}/dock-slot-reservations`)
  # and those exist purely as reverse-reachability lookups; no write path is nested more than
  # one level and no entity is addressed through an ancestor chain.

  state_machine_shape: cyclic
  # EventBooking cycles HELD -> CHALLENGED -> HELD (a challenge can be withdrawn or denied,
  # returning the booking to its hold). IceSheet cycles IN_SERVICE <-> COVERED across covering
  # and uncovering changeovers. ChangeoverOrder additionally carries three PARALLEL stage
  # dimensions (floor_stage x seating_stage x infra_stage) whose combination derives `status`.

  relationship_patterns:
    - one_to_many          # Venue -> ConfigurationProfile / AnchorTenant / IceSheet / EquipmentAsset
    - many_to_many         # EquipmentIssue joins EquipmentAsset <-> ChangeoverOrder
    - self_referential     # EventBooking.displaced_by_booking_id -> EventBooking.id
    - cross_aggregate      # ChangeoverOrder spans two EventBookings; LaborCall spans order OR booking

  role_model: segregation_of_duties
  # The ChangeoverSupervisor X-User-ID that opened a ChangeoverOrder may never be the
  # VenueOperationsDirector X-User-ID that signs it off; booking commitment (BookingManager)
  # and floor execution (ChangeoverSupervisor) are separated; labor money (LaborCoordinator)
  # is separated from both.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: arena display name
        constraints: 1..120 chars
      - name: rigging_capacity_kg
        type: number
        source: input
        description: total combined suspended load the roof grid may carry across all
          time-overlapping CONFIRMED bookings
        constraints: "> 0"
      - name: dock_count
        type: integer
        source: input
        description: number of addressable truck docks; DockSlotReservation.dock_number must be in
          1..dock_count
        constraints: 1..8
      - name: max_bowl_seats
        type: integer
        source: input
        description: full-bowl seating capacity of the arena
        constraints: "> 0"
      - name: crew_headcount_cap
        type: integer
        source: input
        description: maximum changeover crew headcount the venue may staff on one shift
        constraints: 1..200
      - name: min_turnaround_buffer_minutes
        type: integer
        source: input
        description: mandatory idle buffer inserted after an outgoing event's end before a
          changeover window may open
        default: 45
        constraints: 0..240
      - name: dock_buffer_minutes
        type: integer
        source: input
        description: mandatory separation between two DockSlotReservations on the same dock_number
        default: 30
        constraints: 0..180
      - name: overnight_shift_start_local_hour
        type: integer
        source: input
        description: venue-local hour from which a shift counts as overnight; see
          calculations.overnight_shift_flag
        default: 22
        constraints: 18..23
      - name: ice_deck_status
        type: enum
        source: computed
        description: derived from the venue's single non-REMOVED IceSheet; NONE when the venue has
          no IceSheet outside REMOVED
        default: NONE
        constraints: "NONE | BUILDING | IN_SERVICE | COVERED | MELTING"
      - name: rigging_committed_load_kg
        type: number
        source: computed
        description: see calculations.rigging_committed_load_kg — aggregate suspended load of
          CONFIRMED bookings whose closed event interval intersects the logical clock instant
        default: 0
      - name: open_hold_count
        type: integer
        source: computed
        description: count of EventBooking rows with venue_id = this Venue and status IN
          {HELD, CHALLENGED}
        default: 0
      - name: changeover_debt_minutes
        type: integer
        source: computed
        description: running ledger of turnaround overrun; incremented by
          ChangeoverOrder.overrun_minutes on every READY_FOR_SIGNOFF -> SIGNED_OFF transition and
          never decremented
        default: 0

  - name: ConfigurationProfile
    parent: Venue
    common_fields: false
    fields:
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; the arena this configuration belongs to
      - name: code
        type: enum
        source: input
        description: which house configuration this profile describes
        constraints: "ICE_HOCKEY | COURT_BASKETBALL | CONCERT_END_STAGE | CONCERT_IN_ROUND | FAMILY_SHOW"
      - name: requires_ice
        type: boolean
        source: input
        description: true when the configuration is played on exposed ice
      - name: ice_cover_required
        type: boolean
        source: input
        description: true when the configuration sits on top of a covered ice deck rather than
          requiring the ice to be melted out
      - name: seating_mode
        type: enum
        source: input
        description: bowl treatment for this configuration
        constraints: "FULL_BOWL | RETRACTABLE_IN | CURTAINED_HALF"
      - name: nominal_seats
        type: integer
        source: input
        description: seats sellable in this configuration
        constraints: "> 0"
      - name: base_changeover_minutes
        type: integer
        source: input
        description: baseline crew-normalised minutes to convert INTO this configuration
        constraints: 30..1440
      - name: crew_size_required
        type: integer
        source: input
        description: nominal changeover crew size this profile is costed against; the divisor of
          calculations.changeover_turnaround_minutes crew_factor
        constraints: 1..200
      - name: floor_protection_panels_required
        type: integer
        source: input
        description: individual floor-protection panels laid for this configuration
        constraints: 0..2000
      - name: dehumidification_required_lph
        type: number
        source: input
        description: litres-per-hour of moisture removal this configuration demands of the ice deck;
          0 for configurations with no ice underneath
        constraints: ">= 0"
      - name: rigging_points_required
        type: integer
        source: input
        description: number of roof rigging points this configuration hangs from
        constraints: 0..400

  - name: AnchorTenant
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; the arena this tenant is anchored to
      - name: name
        type: string
        source: input
        description: tenant display name
        constraints: 1..120 chars
      - name: hold_priority_tier
        type: enum
        source: input
        description: contractual hold priority; TIER_1 outranks TIER_2 outranks TIER_3, and every
          tier outranks a promoter booking whose hold_tier is OPEN
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: guaranteed_holds_per_season
        type: integer
        source: input
        description: number of concurrent holds this tenant is entitled to
        constraints: 1..60
      - name: holds_consumed
        type: integer
        source: computed
        description: count of EventBooking rows with tenant_id = this tenant and status IN
          {HELD, CHALLENGED, CONFIRMED}
        default: 0
      - name: challenge_credits
        type: integer
        source: computed
        description: remaining hold challenges; seeded at CHALLENGE_CREDIT_GRANT on create,
          decremented on HoldChallenge creation, incremented back on OPEN -> WITHDRAWN
        default: 2

  - name: EventBooking
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; the arena this event occupies
      - name: tenant_id
        type: string
        source: input
        description: FK -> AnchorTenant.id; null for promoter bookings, which hold at tier OPEN
        default: null
      - name: config_profile_id
        type: string
        source: input
        description: FK -> ConfigurationProfile.id; the house configuration this event is played in;
          must belong to venue_id
      - name: displaced_by_booking_id
        type: string
        source: computed
        description: FK -> EventBooking.id; set to the challenger's booking id when this booking is
          driven to DISPLACED by an UPHELD HoldChallenge; null otherwise
        default: null
      - name: title
        type: string
        source: input
        description: event title
        constraints: 1..160 chars
      - name: promoter_name
        type: string
        source: input
        description: promoter of record; required when tenant_id is null
        default: null
      - name: event_start_utc
        type: datetime
        source: input
        description: doors-to-curtain start instant of the event itself, ISO 8601 UTC
      - name: event_end_utc
        type: datetime
        source: input
        description: end instant of the event itself; must be strictly after event_start_utc
      - name: rigging_load_kg
        type: number
        source: input
        description: suspended load this event hangs from the roof grid
        default: 0
        constraints: ">= 0"
      - name: expected_attendance
        type: integer
        source: input
        description: forecast attendance; must not exceed the configuration profile's nominal_seats
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: booking lifecycle; see state_machines.EventBooking
        default: DRAFT
        constraints: "DRAFT | HELD | CHALLENGED | CONFIRMED | RELEASED | DISPLACED"
      - name: hold_tier
        type: enum
        source: computed
        description: tier snapshot pinned at the DRAFT -> HELD transition from
          AnchorTenant.hold_priority_tier, or OPEN when tenant_id is null; never re-read from the
          tenant afterwards
        default: null
        constraints: "TIER_1 | TIER_2 | TIER_3 | OPEN | null"
      - name: hold_placed_at
        type: datetime
        source: computed
        description: logical-clock instant of the DRAFT -> HELD transition
        default: null
      - name: hold_expires_at
        type: datetime
        source: computed
        description: see calculations.hold_expires_at — hold_placed_at plus the tier's hold window
        default: null
      - name: release_reason
        type: string
        source: computed
        description: reason recorded on the transition into RELEASED; the literal
          HOLD_EXPIRY_SWEEP when written by the sweep, otherwise the caller's reason
        default: null
      - name: displacement_penalty_cents
        type: integer
        source: computed
        description: see calculations.displacement_settlement_cents; stays 0 unless this booking
          reaches DISPLACED
        default: 0

  - name: HoldChallenge
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> EventBooking.id; the incumbent booking being challenged; must be in HELD
      - name: challenger_tenant_id
        type: string
        source: input
        description: FK -> AnchorTenant.id; the tenant spending a challenge credit
      - name: challenger_booking_id
        type: string
        source: input
        description: FK -> EventBooking.id; the challenger's own DRAFT booking that would take the
          slot if the challenge is upheld
      - name: status
        type: enum
        source: computed
        description: challenge lifecycle; see state_machines.HoldChallenge
        default: OPEN
        constraints: "OPEN | UPHELD | DENIED | WITHDRAWN"
      - name: priority_delta
        type: integer
        source: computed
        description: TIER_RANK[incumbent.hold_tier] - TIER_RANK[challenger tenant's
          hold_priority_tier]; strictly positive means the challenger outranks the incumbent
      - name: ruled_at
        type: datetime
        source: computed
        description: logical-clock instant of the OPEN -> UPHELD or OPEN -> DENIED transition
        default: null
      - name: ruling_note
        type: string
        source: input
        description: free-text rationale supplied when the challenge is ruled on
        default: null

  - name: ChangeoverOrder
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: computed
        description: FK -> Venue.id; copied from to_booking.venue_id at creation
      - name: from_booking_id
        type: string
        source: input
        description: FK -> EventBooking.id; the outgoing event whose configuration is struck
      - name: to_booking_id
        type: string
        source: input
        description: FK -> EventBooking.id; the incoming event whose configuration is built
      - name: window_start_utc
        type: datetime
        source: computed
        description: from_booking.event_end_utc plus Venue.min_turnaround_buffer_minutes
      - name: window_end_utc
        type: datetime
        source: computed
        description: to_booking.event_start_utc
      - name: window_minutes
        type: integer
        source: computed
        description: whole minutes between window_start_utc and window_end_utc
      - name: crew_headcount
        type: integer
        source: input
        description: changeover crew called for this turnaround; capped by Venue.crew_headcount_cap
        constraints: 1..200
      - name: overnight_shift
        type: boolean
        source: computed
        description: see calculations.overnight_shift_flag evaluated on window_start_utc
      - name: planned_turnaround_minutes
        type: integer
        source: computed
        description: variant PLANNED of calculations.changeover_turnaround_minutes, frozen at
          creation
      - name: actual_turnaround_minutes
        type: integer
        source: computed
        description: variant ACTUAL of calculations.changeover_turnaround_minutes, written at
          sign-off
        default: null
      - name: overrun_minutes
        type: integer
        source: computed
        description: max(0, actual_turnaround_minutes - window_minutes), written at sign-off
        default: 0
      - name: floor_stage
        type: enum
        source: computed
        description: floor-system dimension of the parallel state machine
        default: NOT_STARTED
        constraints: "NOT_STARTED | STRIKING | LAYING | FLOOR_COMPLETE"
      - name: seating_stage
        type: enum
        source: computed
        description: bowl/seating dimension of the parallel state machine
        default: NOT_STARTED
        constraints: "NOT_STARTED | RETRACTING | CURTAINING | SEATING_COMPLETE"
      - name: infra_stage
        type: enum
        source: computed
        description: utility/network/broadcast dimension of the parallel state machine
        default: NOT_STARTED
        constraints: "NOT_STARTED | UTILITY_SET | NETWORK_SET | BROADCAST_READY"
      - name: status
        type: enum
        source: computed
        description: compound status derived from the three stage dimensions plus rework and
          sign-off; see state_machines.ChangeoverOrder
        default: PLANNED
        constraints: "PLANNED | IN_PROGRESS | REWORK | READY_FOR_SIGNOFF | SIGNED_OFF | ABANDONED"
      - name: rework_count
        type: integer
        source: computed
        description: number of rework calls accepted on this order
        default: 0
      - name: started_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the first progress call that moved any dimension off
          NOT_STARTED; never rewritten, including across rework
        default: null
      - name: completed_at_utc
        type: datetime
        source: computed
        description: logical-clock instant at which all three dimensions last reached their terminal
          stage; cleared to null by rework and re-stamped on re-completion
        default: null
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the ChangeoverSupervisor that created the order; the
          segregation-of-duties comparand at sign-off
      - name: signed_off_by_user_id
        type: string
        source: system
        description: X-User-ID of the VenueOperationsDirector that signed the order off
        default: null
      - name: abandon_reason
        type: string
        source: computed
        description: cascade reason recorded when the order is driven to ABANDONED; one of
          FROM_BOOKING_GONE or TO_BOOKING_GONE
        default: null

  - name: IceSheet
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; the arena whose floor carries this sheet
      - name: sheet_thickness_mm
        type: number
        source: input
        description: flooded ice thickness in millimetres
        default: 32
        constraints: 18..45
      - name: required_dehumidification_lph
        type: number
        source: computed
        description: snapshot of the installing ConfigurationProfile's
          dehumidification_required_lph, pinned at install and never re-read from the profile
      - name: dehumidification_lph_applied
        type: number
        source: input
        description: dehumidification actually running against the sheet; may be revised on any
          transition call
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: ice lifecycle; see state_machines.IceSheet
        default: BUILDING
        constraints: "BUILDING | IN_SERVICE | COVERED | MELTING | REMOVED"
      - name: cover_installed_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the most recent IN_SERVICE -> COVERED transition
        default: null
      - name: cover_hours_accumulated
        type: number
        source: computed
        description: lifetime hours the sheet has spent COVERED; increased on every
          COVERED -> IN_SERVICE transition by the hours since cover_installed_at_utc
        default: 0
      - name: cover_cycles
        type: integer
        source: computed
        description: lifetime count of IN_SERVICE -> COVERED transitions, including the automatic
          one cascaded from a covering changeover sign-off
        default: 0
      - name: condensation_risk_score
        type: number
        source: computed
        description: see calculations.condensation_risk_score; recomputed on install and on every
          transition call
        default: 0

  - name: DockSlotReservation
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> EventBooking.id; the event whose trucks occupy the dock
      - name: dock_number
        type: integer
        source: input
        description: which dock of the booking's venue is occupied; 1..Venue.dock_count
        constraints: ">= 1"
      - name: purpose
        type: enum
        source: input
        description: whether this window is a load-in or a load-out
        constraints: "LOAD_IN | LOAD_OUT"
      - name: window_start_utc
        type: datetime
        source: input
        description: dock occupation start, ISO 8601 UTC
      - name: window_end_utc
        type: datetime
        source: input
        description: dock occupation end; must be strictly after window_start_utc
      - name: truck_count
        type: integer
        source: input
        description: number of trucks expected through the dock in this window
        constraints: 1..60
      - name: status
        type: enum
        source: computed
        description: reservation lifecycle; see state_machines.DockSlotReservation
        default: RESERVED
        constraints: "RESERVED | RELEASED"
      - name: release_reason
        type: string
        source: computed
        description: reason recorded on the transition into RELEASED; one of OPERATOR_CANCEL or
          BOOKING_GONE
        default: null

  - name: LaborCall
    parent: null
    common_fields: true
    fields:
      - name: changeover_order_id
        type: string
        source: input
        description: FK -> ChangeoverOrder.id; set for changeover-crew calls, null for calls scoped
          to a booking's load-in/load-out
        default: null
      - name: booking_id
        type: string
        source: input
        description: FK -> EventBooking.id; set for load-in/load-out calls, null for changeover-crew
          calls
        default: null
      - name: craft
        type: enum
        source: input
        description: labor craft being called
        constraints: "STAGEHAND | RIGGER | ICE_TECH | ELECTRICIAN | CONVERSION_CREW"
      - name: headcount
        type: integer
        source: input
        description: number of workers on the call
        constraints: 1..200
      - name: call_start_utc
        type: datetime
        source: input
        description: scheduled call start, ISO 8601 UTC
      - name: call_end_utc
        type: datetime
        source: input
        description: scheduled call end; must be strictly after call_start_utc
      - name: guaranteed_hours
        type: number
        source: input
        description: contractual minimum hours paid per worker regardless of hours worked
        default: 4
        constraints: 0..12
      - name: actual_hours
        type: number
        source: input
        description: hours actually worked per worker, supplied when the call is closed
        default: null
        constraints: 0..24
      - name: overnight
        type: boolean
        source: computed
        description: see calculations.overnight_shift_flag evaluated on call_start_utc
      - name: status
        type: enum
        source: computed
        description: call lifecycle; see state_machines.LaborCall
        default: CALLED
        constraints: "CALLED | WORKED | CANCELLED"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: variant ESTIMATED of calculations.labor_call_cost_cents, frozen at creation
      - name: settled_cost_cents
        type: integer
        source: computed
        description: variant SETTLED of calculations.labor_call_cost_cents, written when the call
          is closed
        default: null
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: see calculations.labor_cancellation_fee_cents; written when the call is
          cancelled
        default: 0

  - name: EquipmentAsset
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; the arena that owns the asset pool
      - name: asset_class
        type: enum
        source: input
        description: which staging/floor system this pool holds
        constraints: "STAGE_DECK | DASHER_BOARD_SET | FLOOR_PANEL_SET | CURTAIN_SYSTEM | ICE_COVER_PANEL_SET | BASKETBALL_FLOOR"
      - name: units_total
        type: integer
        source: input
        description: total units owned; the conserved quantity of the equipment inventory invariant
        constraints: 1..500
      - name: units_available
        type: integer
        source: computed
        description: see calculations.equipment_units_available
      - name: units_out_of_service
        type: integer
        source: computed
        description: units withdrawn from the pool by damage reported on return; cleared to 0 by a
          COMPLETE maintenance action
        default: 0
      - name: service_interval_cycles
        type: integer
        source: input
        description: number of issue/return cycles between mandatory servicing
        default: 12
        constraints: 1..200
      - name: cycles_since_service
        type: integer
        source: computed
        description: issue/return cycles accumulated since the last COMPLETE maintenance action;
          incremented on every EquipmentIssue ISSUED -> RETURNED transition
        default: 0
      - name: service_due
        type: boolean
        source: computed
        description: cycles_since_service >= service_interval_cycles, evaluated with >= so the
          interval-th cycle already flags the pool
        default: false
      - name: status
        type: enum
        source: computed
        description: pool availability; see state_machines.EquipmentAsset
        default: IN_SERVICE
        constraints: "IN_SERVICE | OUT_OF_SERVICE"

  - name: EquipmentIssue
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: FK -> EquipmentAsset.id; the pool the units come out of
      - name: changeover_order_id
        type: string
        source: input
        description: FK -> ChangeoverOrder.id; the turnaround the units are issued to
      - name: units_issued
        type: integer
        source: input
        description: units taken out of the pool
        constraints: ">= 1"
      - name: damaged_units
        type: integer
        source: input
        description: units reported damaged when the issue is returned; those units move to
          EquipmentAsset.units_out_of_service instead of back to units_available
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: issue lifecycle; see state_machines.EquipmentIssue
        default: ISSUED
        constraints: "ISSUED | RETURNED"
      - name: returned_at_utc
        type: datetime
        source: computed
        description: logical-clock instant of the ISSUED -> RETURNED transition
        default: null
      - name: return_reason
        type: string
        source: computed
        description: reason recorded on the transition into RETURNED; one of OPERATOR_RETURN or
          ORDER_ABANDONED
        default: null

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: EventBooking
    initial_state: DRAFT
    terminal_states: [RELEASED, DISPLACED]
    transitions:
      - from: DRAFT
        to: HELD
        trigger: "POST /event-bookings/{id}/hold"
        actor: BookingManager | AnchorTenantRep
        preconditions:
          - "status == DRAFT"
          - "when tenant_id is not null: AnchorTenant.holds_consumed < AnchorTenant.guaranteed_holds_per_season (else ERR_TENANT_HOLD_QUOTA_EXCEEDED)"
          - "when acting as AnchorTenantRep: X-User-ID == this booking's tenant_id (else ERR_TENANT_SCOPE_VIOLATION)"
        side_effects:
          - "hold_placed_at = logical clock now"
          - "hold_tier = AnchorTenant.hold_priority_tier when tenant_id is not null, else OPEN (snapshot; never re-read)"
          - "hold_expires_at = calculations.hold_expires_at"
          - "AnchorTenant.holds_consumed recomputed (increments by 1 when tenant_id is not null)"
          - "Venue.open_hold_count recomputed (increments by 1)"
          - "increments Venue.version by 1"
      - from: HELD
        to: CONFIRMED
        trigger: "POST /event-bookings/{id}/confirm"
        actor: BookingManager
        preconditions:
          - "status == HELD"
          - "expected_venue_version == Venue.version (else ERR_STALE_VENUE_VERSION)"
          - "logical clock now <= hold_expires_at (else ERR_HOLD_EXPIRED)"
          - "no other EventBooking on the same venue with status == CONFIRMED whose half-open [event_start_utc, event_end_utc) interval intersects this booking's (else ERR_BOOKING_TIME_CONFLICT)"
          - "calculations.rigging_committed_load_kg over the closed-interval peer set plus this booking's rigging_load_kg <= Venue.rigging_capacity_kg (else ERR_RIGGING_CAPACITY_EXCEEDED)"
        side_effects:
          - "Venue.open_hold_count recomputed (decrements by 1)"
          - "Venue.rigging_committed_load_kg recomputed"
          - "increments Venue.version by 1"
      - from: HELD
        to: CHALLENGED
        trigger: "POST /hold-challenges (system side effect of HoldChallenge creation)"
        actor: system
        preconditions:
          - "status == HELD"
        side_effects:
          - "hold_expires_at is NOT extended; the original expiry keeps running while challenged"
          - "increments Venue.version by 1"
        note: "Entered only as a side effect of HoldChallenge OPEN creation; there is no direct endpoint."
      - from: CHALLENGED
        to: HELD
        trigger: "POST /hold-challenges/{id}/withdraw or POST /hold-challenges/{id}/rule with decision=DENIED"
        actor: system
        preconditions:
          - "status == CHALLENGED"
          - "no other HoldChallenge on this booking remains in OPEN after this transition"
        side_effects:
          - "hold_tier, hold_placed_at and hold_expires_at are left exactly as they were before the challenge"
          - "increments Venue.version by 1"
        note: "Closes the HELD -> CHALLENGED -> HELD cycle; a booking may traverse it repeatedly."
      - from: CHALLENGED
        to: DISPLACED
        trigger: "POST /hold-challenges/{id}/rule with decision=UPHELD"
        actor: system
        preconditions:
          - "status == CHALLENGED"
          - "hold_tier != TIER_1 (else ERR_ANCHOR_HOLD_PROTECTED)"
          - "HoldChallenge.priority_delta >= 1 (else ERR_HOLD_PRIORITY_INSUFFICIENT)"
        side_effects:
          - "displaced_by_booking_id = HoldChallenge.challenger_booking_id"
          - "displacement_penalty_cents = calculations.displacement_settlement_cents"
          - "release_reason = null (displacement is not a release)"
          - "cascade hop 2 of transitive_cascade.upheld_challenge_displacement: every DockSlotReservation with booking_id = this booking and status == RESERVED transitions to RELEASED with release_reason = BOOKING_GONE"
          - "cascade hop 2 of transitive_cascade.upheld_challenge_displacement: every ChangeoverOrder with from_booking_id or to_booking_id = this booking and status NOT IN {SIGNED_OFF, ABANDONED} transitions to ABANDONED"
          - "AnchorTenant.holds_consumed recomputed (decrements by 1 when tenant_id is not null)"
          - "Venue.open_hold_count recomputed (decrements by 1)"
          - "Venue.rigging_committed_load_kg recomputed"
          - "increments Venue.version by 1"
      - from: DRAFT
        to: RELEASED
        trigger: "POST /event-bookings/{id}/release"
        actor: BookingManager
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "release_reason = request reason"
          - "increments Venue.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /event-bookings/{id}/release, or POST /venues/{id}/hold-expiry-sweep when hold_expires_at <= logical clock now"
        actor: BookingManager | system
        preconditions:
          - "status == HELD"
        side_effects:
          - "release_reason = request reason, or the literal HOLD_EXPIRY_SWEEP when written by the sweep"
          - "cascade hop 1->2 of transitive_cascade.hold_sweep_abandon_cancel: every DockSlotReservation with booking_id = this booking and status == RESERVED transitions to RELEASED with release_reason = BOOKING_GONE"
          - "cascade hop 1->2 of transitive_cascade.hold_sweep_abandon_cancel: every ChangeoverOrder with from_booking_id or to_booking_id = this booking and status NOT IN {SIGNED_OFF, ABANDONED} transitions to ABANDONED"
          - "AnchorTenant.holds_consumed recomputed (decrements by 1 when tenant_id is not null)"
          - "Venue.open_hold_count recomputed (decrements by 1)"
          - "increments Venue.version by 1"
      - from: CHALLENGED
        to: RELEASED
        trigger: "POST /event-bookings/{id}/release, or POST /venues/{id}/hold-expiry-sweep when hold_expires_at <= logical clock now"
        actor: BookingManager | system
        preconditions:
          - "status == CHALLENGED"
        side_effects:
          - "every HoldChallenge with booking_id = this booking and status == OPEN transitions to DENIED with ruled_at = logical clock now (the challenger's credit is NOT refunded because DENIED still counts against the grant)"
          - "same DockSlotReservation, ChangeoverOrder, holds_consumed, open_hold_count and Venue.version side effects as the HELD -> RELEASED transition"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /event-bookings/{id}/release"
        actor: BookingManager
        preconditions:
          - "status == CONFIRMED"
          - "every ChangeoverOrder with to_booking_id = this booking has status != SIGNED_OFF (else ERR_INVALID_BOOKING_STATE)"
        side_effects:
          - "release_reason = request reason"
          - "same DockSlotReservation and ChangeoverOrder cascades as the HELD -> RELEASED transition"
          - "AnchorTenant.holds_consumed recomputed (decrements by 1 when tenant_id is not null)"
          - "Venue.rigging_committed_load_kg recomputed"
          - "increments Venue.version by 1"

  - entity: HoldChallenge
    initial_state: OPEN
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /hold-challenges"
        actor: AnchorTenantRep
        preconditions:
          - "X-User-ID == challenger_tenant_id (else ERR_TENANT_SCOPE_VIOLATION)"
          - "incumbent EventBooking.status IN {HELD, CHALLENGED} (else ERR_INVALID_BOOKING_STATE) — a second anchor tenant may open its own challenge against an already-challenged hold, which is why the CHALLENGED -> HELD transition tests for remaining OPEN challenges"
          - "challenger EventBooking.status == DRAFT (else ERR_INVALID_BOOKING_STATE)"
          - "incumbent and challenger bookings share the same venue_id (else ERR_VENUE_SCOPE_MISMATCH)"
          - "challenger AnchorTenant.venue_id equals the incumbent booking's venue_id (else ERR_VENUE_SCOPE_MISMATCH)"
          - "AnchorTenant.challenge_credits >= 1 (else ERR_CHALLENGE_CREDITS_EXHAUSTED)"
          - "no HoldChallenge already exists with the same booking_id and challenger_tenant_id in status OPEN (else ERR_DUPLICATE_CHALLENGE)"
        side_effects:
          - "priority_delta = TIER_RANK[incumbent.hold_tier] - TIER_RANK[challenger tenant hold_priority_tier]"
          - "AnchorTenant.challenge_credits decrements by 1"
          - "incumbent EventBooking transitions HELD -> CHALLENGED when it is still HELD; an incumbent already CHALLENGED by another tenant stays CHALLENGED and its hold fields are untouched"
          - "increments Venue.version by 1"
      - from: OPEN
        to: UPHELD
        trigger: "POST /hold-challenges/{id}/rule with decision=UPHELD"
        actor: BookingManager
        preconditions:
          - "status == OPEN"
          - "incumbent EventBooking.status == CHALLENGED"
          - "incumbent EventBooking.hold_tier != TIER_1 (else ERR_ANCHOR_HOLD_PROTECTED)"
          - "priority_delta >= 1 (else ERR_HOLD_PRIORITY_INSUFFICIENT)"
        side_effects:
          - "ruled_at = logical clock now, ruling_note = request ruling_note"
          - "cascade hop 1 of transitive_cascade.upheld_challenge_displacement: incumbent EventBooking transitions CHALLENGED -> DISPLACED, which itself abandons its ChangeoverOrders, which themselves auto-return their EquipmentIssues and cancel their LaborCalls"
          - "AnchorTenant.challenge_credits is NOT refunded"
      - from: OPEN
        to: DENIED
        trigger: "POST /hold-challenges/{id}/rule with decision=DENIED, or cascaded from the incumbent booking's transition into RELEASED"
        actor: BookingManager | system
        preconditions:
          - "status == OPEN"
        side_effects:
          - "ruled_at = logical clock now, ruling_note = request ruling_note when supplied"
          - "when the incumbent booking is still CHALLENGED and no other OPEN challenge remains: incumbent EventBooking transitions CHALLENGED -> HELD"
          - "AnchorTenant.challenge_credits is NOT refunded"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /hold-challenges/{id}/withdraw"
        actor: AnchorTenantRep
        preconditions:
          - "status == OPEN"
          - "X-User-ID == challenger_tenant_id (else ERR_TENANT_SCOPE_VIOLATION)"
        side_effects:
          - "AnchorTenant.challenge_credits increments by 1 (compensating action of the credit spend)"
          - "when the incumbent booking is still CHALLENGED and no other OPEN challenge remains: incumbent EventBooking transitions CHALLENGED -> HELD"
          - "increments Venue.version by 1"

  - entity: ChangeoverOrder
    initial_state: PLANNED
    terminal_states: [SIGNED_OFF, ABANDONED]
    transitions:
      - from: null
        to: PLANNED
        trigger: "POST /changeover-orders"
        actor: ChangeoverSupervisor
        preconditions:
          - "expected_venue_version == Venue.version (else ERR_STALE_VENUE_VERSION)"
          - "from_booking and to_booking share the same venue_id (else ERR_VENUE_SCOPE_MISMATCH)"
          - "from_booking.status IN {HELD, CONFIRMED} and to_booking.status IN {HELD, CONFIRMED} (else ERR_INVALID_BOOKING_STATE)"
          - "to_booking.event_start_utc > from_booking.event_end_utc (else ERR_ORDER_BOOKING_SEQUENCE_INVALID)"
          - "crew_headcount <= Venue.crew_headcount_cap (else ERR_CREW_CAP_EXCEEDED)"
          - "Venue.changeover_debt_minutes < CHANGEOVER_DEBT_FREEZE_MINUTES (else ERR_CHANGEOVER_DEBT_FREEZE)"
          - "no other ChangeoverOrder on the same venue with status NOT IN {SIGNED_OFF, ABANDONED} whose half-open [window_start_utc, window_end_utc) interval intersects this one's (else ERR_CHANGEOVER_WINDOW_CONFLICT)"
          - "window_minutes >= planned_turnaround_minutes (else ERR_TURNAROUND_WINDOW_INSUFFICIENT)"
        side_effects:
          - "venue_id = to_booking.venue_id"
          - "window_start_utc, window_end_utc, window_minutes computed per the field descriptions"
          - "overnight_shift = calculations.overnight_shift_flag on window_start_utc"
          - "planned_turnaround_minutes = calculations.changeover_turnaround_minutes variant PLANNED"
          - "opened_by_user_id = X-User-ID"
          - "increments Venue.version by 1"
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /changeover-orders/{id}/progress (first accepted call)"
        actor: ChangeoverSupervisor
        preconditions:
          - "status == PLANNED"
          - "to_booking EventBooking.status == CONFIRMED (else ERR_INCOMING_BOOKING_NOT_CONFIRMED)"
          - "the requested to_stage is the immediate successor of the named dimension's current stage (else ERR_INVALID_ORDER_STATE)"
          - "when dimension == FLOOR and to_stage == LAYING: EquipmentIssue rows on this order with status == ISSUED against an EquipmentAsset of asset_class FLOOR_PANEL_SET sum units_issued >= ceil(to_booking config profile floor_protection_panels_required / PANELS_PER_SET) (else ERR_FLOOR_PROTECTION_SHORTFALL)"
        side_effects:
          - "the named dimension advances one stage"
          - "started_at_utc = logical clock now"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /changeover-orders/{id}/progress (subsequent calls that do not complete all three dimensions)"
        actor: ChangeoverSupervisor
        preconditions:
          - "status IN {IN_PROGRESS, REWORK}"
          - "to_booking EventBooking.status == CONFIRMED (else ERR_INCOMING_BOOKING_NOT_CONFIRMED)"
          - "the requested to_stage is the immediate successor of the named dimension's current stage (else ERR_INVALID_ORDER_STATE)"
          - "when dimension == FLOOR and to_stage == LAYING: the floor-protection issue check above"
        side_effects:
          - "the named dimension advances one stage; the other two dimensions are untouched (parallel dimensions)"
        note: "The three dimensions are independent axes on one row: floor_stage, seating_stage and infra_stage may sit at any combination of stages."
      - from: IN_PROGRESS
        to: READY_FOR_SIGNOFF
        trigger: "POST /changeover-orders/{id}/progress (the call after which floor_stage == FLOOR_COMPLETE and seating_stage == SEATING_COMPLETE and infra_stage == BROADCAST_READY)"
        actor: ChangeoverSupervisor
        preconditions:
          - "status IN {IN_PROGRESS, REWORK}"
          - "after applying this call all three dimensions sit at their terminal stage"
        side_effects:
          - "completed_at_utc = logical clock now"
      - from: REWORK
        to: READY_FOR_SIGNOFF
        trigger: "POST /changeover-orders/{id}/progress (re-completing all three dimensions after a rework reset)"
        actor: ChangeoverSupervisor
        preconditions:
          - "status == REWORK"
          - "after applying this call all three dimensions sit at their terminal stage"
        side_effects:
          - "completed_at_utc = logical clock now (re-stamped; started_at_utc is NOT rewritten)"
      - from: READY_FOR_SIGNOFF
        to: REWORK
        trigger: "POST /changeover-orders/{id}/rework"
        actor: ChangeoverSupervisor
        preconditions:
          - "status IN {IN_PROGRESS, READY_FOR_SIGNOFF}"
          - "the named dimension is not already NOT_STARTED (else ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "the named dimension resets to NOT_STARTED; the other two dimensions keep their stages"
          - "rework_count increments by 1"
          - "completed_at_utc = null"
        note: "IN_PROGRESS -> REWORK uses the identical rule; rework is the order's revision loop."
      - from: READY_FOR_SIGNOFF
        to: SIGNED_OFF
        trigger: "POST /changeover-orders/{id}/signoff"
        actor: VenueOperationsDirector
        preconditions:
          - "status == READY_FOR_SIGNOFF"
          - "X-User-ID != opened_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "when the turnaround is a covering changeover (from config requires_ice true, to config requires_ice false, to config ice_cover_required true) and the venue has an IceSheet in IN_SERVICE: that sheet's recomputed condensation_risk_score < CONDENSATION_BLOCK_THRESHOLD (else ERR_CONDENSATION_RISK_TOO_HIGH)"
        side_effects:
          - "signed_off_by_user_id = X-User-ID"
          - "actual_turnaround_minutes = calculations.changeover_turnaround_minutes variant ACTUAL"
          - "overrun_minutes = max(0, actual_turnaround_minutes - window_minutes)"
          - "cascade hop 1->2 of transitive_cascade.signoff_ice_cover_meltout: Venue.changeover_debt_minutes increments by overrun_minutes"
          - "cascade hop 1->2 of transitive_cascade.signoff_ice_cover_meltout: on a covering changeover, the venue's IceSheet in IN_SERVICE transitions IN_SERVICE -> COVERED"
          - "every LaborCall with changeover_order_id = this order and status == CALLED is left untouched (sign-off does not settle labor)"
          - "increments Venue.version by 1"
      - from: PLANNED
        to: ABANDONED
        trigger: "system side effect of from_booking or to_booking entering RELEASED or DISPLACED"
        actor: system
        preconditions:
          - "status NOT IN {SIGNED_OFF, ABANDONED}"
        side_effects:
          - "abandon_reason = FROM_BOOKING_GONE or TO_BOOKING_GONE"
          - "cascade hop 3 of transitive_cascade.upheld_challenge_displacement and of transitive_cascade.hold_sweep_abandon_cancel: every EquipmentIssue with changeover_order_id = this order and status == ISSUED transitions to RETURNED with damaged_units = 0 and return_reason = ORDER_ABANDONED"
          - "cascade hop 3 of transitive_cascade.hold_sweep_abandon_cancel: every LaborCall with changeover_order_id = this order and status == CALLED transitions to CANCELLED with cancellation_fee_cents = calculations.labor_cancellation_fee_cents"
        note: "IN_PROGRESS -> ABANDONED, REWORK -> ABANDONED and READY_FOR_SIGNOFF -> ABANDONED use the identical rule and the identical side effects."

  - entity: IceSheet
    initial_state: BUILDING
    terminal_states: [REMOVED]
    transitions:
      - from: null
        to: BUILDING
        trigger: "POST /venues/{id}/ice-sheets"
        actor: ChangeoverSupervisor
        preconditions:
          - "the venue has no IceSheet with status != REMOVED (else ERR_ICE_SHEET_ALREADY_PRESENT)"
          - "the referenced ConfigurationProfile belongs to this venue (else ERR_VENUE_SCOPE_MISMATCH)"
          - "dehumidification_lph_applied >= MIN_DEHUM_FRACTION * profile dehumidification_required_lph (else ERR_DEHUMIDIFICATION_INSUFFICIENT)"
        side_effects:
          - "required_dehumidification_lph = profile dehumidification_required_lph (snapshot)"
          - "condensation_risk_score = calculations.condensation_risk_score"
          - "Venue.ice_deck_status recomputed to BUILDING"
          - "increments Venue.version by 1"
      - from: BUILDING
        to: IN_SERVICE
        trigger: "POST /ice-sheets/{id}/transition with to_status=IN_SERVICE"
        actor: ChangeoverSupervisor
        preconditions:
          - "status == BUILDING"
          - "dehumidification_lph_applied (after applying any revision in this request) >= MIN_DEHUM_FRACTION * required_dehumidification_lph (else ERR_DEHUMIDIFICATION_INSUFFICIENT)"
        side_effects:
          - "condensation_risk_score recomputed"
          - "Venue.ice_deck_status recomputed to IN_SERVICE"
          - "increments Venue.version by 1"
      - from: IN_SERVICE
        to: COVERED
        trigger: "POST /ice-sheets/{id}/transition with to_status=COVERED, or system cascade from a covering changeover sign-off"
        actor: ChangeoverSupervisor | system
        preconditions:
          - "status == IN_SERVICE"
          - "recomputed condensation_risk_score < CONDENSATION_BLOCK_THRESHOLD (else ERR_CONDENSATION_RISK_TOO_HIGH)"
        side_effects:
          - "cover_installed_at_utc = logical clock now"
          - "cover_cycles increments by 1"
          - "condensation_risk_score recomputed"
          - "cascade hop 3 of transitive_cascade.signoff_ice_cover_meltout: when cover_cycles > COVER_CYCLE_LIMIT after this increment, the sheet immediately transitions COVERED -> MELTING"
          - "Venue.ice_deck_status recomputed"
          - "increments Venue.version by 1"
      - from: COVERED
        to: IN_SERVICE
        trigger: "POST /ice-sheets/{id}/transition with to_status=IN_SERVICE"
        actor: ChangeoverSupervisor
        preconditions:
          - "status == COVERED"
        side_effects:
          - "cover_hours_accumulated increases by (logical clock now - cover_installed_at_utc) in hours, kept to 3 decimal places"
          - "cover_installed_at_utc = null"
          - "condensation_risk_score recomputed (a longer cover raises it)"
          - "Venue.ice_deck_status recomputed to IN_SERVICE"
          - "increments Venue.version by 1"
        note: "Closes the IN_SERVICE <-> COVERED cycle; a sheet may traverse it repeatedly until COVER_CYCLE_LIMIT forces a melt-out."
      - from: IN_SERVICE
        to: MELTING
        trigger: "POST /ice-sheets/{id}/transition with to_status=MELTING"
        actor: ChangeoverSupervisor
        preconditions:
          - "status == IN_SERVICE"
          - "no EventBooking on this venue with status IN {HELD, CHALLENGED, CONFIRMED} whose ConfigurationProfile.requires_ice is true and whose event_start_utc lies in the closed window [logical clock now, logical clock now + ICE_BUILD_MINUTES minutes] (else ERR_ICE_EVENT_DEPENDENCY)"
        side_effects:
          - "Venue.ice_deck_status recomputed to MELTING"
          - "increments Venue.version by 1"
      - from: COVERED
        to: MELTING
        trigger: "system cascade when cover_cycles > COVER_CYCLE_LIMIT after an IN_SERVICE -> COVERED transition"
        actor: system
        preconditions:
          - "status == COVERED"
          - "cover_cycles > COVER_CYCLE_LIMIT"
        side_effects:
          - "Venue.ice_deck_status recomputed to MELTING"
        note: "The ERR_ICE_EVENT_DEPENDENCY guard does NOT apply to this automatic hop; the cover-cycle limit is a hard equipment rule."
      - from: MELTING
        to: REMOVED
        trigger: "POST /ice-sheets/{id}/transition with to_status=REMOVED"
        actor: ChangeoverSupervisor
        preconditions:
          - "status == MELTING"
        side_effects:
          - "Venue.ice_deck_status recomputed to NONE"
          - "increments Venue.version by 1"

  - entity: DockSlotReservation
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /event-bookings/{id}/dock-slot-reservations"
        actor: ChangeoverSupervisor | LaborCoordinator
        preconditions:
          - "booking EventBooking.status IN {HELD, CHALLENGED, CONFIRMED} (else ERR_INVALID_BOOKING_STATE)"
          - "1 <= dock_number <= Venue.dock_count (else ERR_DOCK_NUMBER_INVALID)"
          - "no other DockSlotReservation with status == RESERVED on the same (venue, dock_number) whose buffered interval collides; see validations priority 70 (else ERR_DOCK_WINDOW_CONFLICT)"
        side_effects: []
      - from: RESERVED
        to: RELEASED
        trigger: "POST /dock-slot-reservations/{id}/cancel, or system cascade when the booking enters RELEASED or DISPLACED"
        actor: ChangeoverSupervisor | LaborCoordinator | system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "release_reason = OPERATOR_CANCEL on the endpoint path, BOOKING_GONE on the cascade path"
          - "the (venue, dock_number) interval is freed, so a previously colliding window becomes bookable"

  - entity: LaborCall
    initial_state: CALLED
    terminal_states: [WORKED, CANCELLED]
    transitions:
      - from: null
        to: CALLED
        trigger: "POST /labor-calls"
        actor: LaborCoordinator
        preconditions:
          - "exactly one of changeover_order_id and booking_id is non-null (else ERR_LABOR_CALL_SCOPE_INVALID)"
          - "when changeover_order_id is set: that order's status NOT IN {SIGNED_OFF, ABANDONED} (else ERR_INVALID_ORDER_STATE)"
          - "when booking_id is set: that booking's status IN {HELD, CHALLENGED, CONFIRMED} (else ERR_INVALID_BOOKING_STATE)"
        side_effects:
          - "overnight = calculations.overnight_shift_flag on call_start_utc"
          - "estimated_cost_cents = calculations.labor_call_cost_cents variant ESTIMATED"
      - from: CALLED
        to: WORKED
        trigger: "POST /labor-calls/{id}/close"
        actor: LaborCoordinator
        preconditions:
          - "status == CALLED"
          - "when changeover_order_id is set: that order's status IN {READY_FOR_SIGNOFF, SIGNED_OFF} (else ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "actual_hours = request actual_hours"
          - "settled_cost_cents = calculations.labor_call_cost_cents variant SETTLED"
      - from: CALLED
        to: CANCELLED
        trigger: "POST /labor-calls/{id}/cancel, or system cascade when the parent ChangeoverOrder enters ABANDONED"
        actor: LaborCoordinator | system
        preconditions:
          - "status == CALLED"
        side_effects:
          - "cancellation_fee_cents = calculations.labor_cancellation_fee_cents"
          - "settled_cost_cents stays null"

  - entity: EquipmentAsset
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /equipment-assets/{id}/maintenance with action=START"
        actor: VenueOperationsDirector
        preconditions:
          - "status == IN_SERVICE"
          - "no EquipmentIssue with asset_id = this asset and status == ISSUED (else ERR_INVALID_ISSUE_STATE)"
        side_effects:
          - "units_available recomputed (unchanged; maintenance does not move units)"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /equipment-assets/{id}/maintenance with action=COMPLETE"
        actor: VenueOperationsDirector
        preconditions:
          - "status == OUT_OF_SERVICE"
        side_effects:
          - "units_out_of_service = 0 (damaged units are repaired back into the pool)"
          - "cycles_since_service = 0"
          - "service_due = false"
          - "units_available recomputed to units_total minus outstanding ISSUED units"

  - entity: EquipmentIssue
    initial_state: ISSUED
    terminal_states: [RETURNED]
    transitions:
      - from: null
        to: ISSUED
        trigger: "POST /equipment-issues"
        actor: ChangeoverSupervisor
        preconditions:
          - "EquipmentAsset.status == IN_SERVICE (else ERR_ASSET_OUT_OF_SERVICE)"
          - "ChangeoverOrder.status NOT IN {SIGNED_OFF, ABANDONED} (else ERR_INVALID_ORDER_STATE)"
          - "EquipmentAsset.venue_id == ChangeoverOrder.venue_id (else ERR_VENUE_SCOPE_MISMATCH)"
          - "units_issued <= EquipmentAsset.units_available (else ERR_EQUIPMENT_UNITS_UNAVAILABLE)"
        side_effects:
          - "EquipmentAsset.units_available decreases by units_issued"
      - from: ISSUED
        to: RETURNED
        trigger: "POST /equipment-issues/{id}/return, or system cascade when the parent ChangeoverOrder enters ABANDONED"
        actor: ChangeoverSupervisor | system
        preconditions:
          - "status == ISSUED"
          - "damaged_units <= units_issued (else ERR_INVALID_REQUEST)"
        side_effects:
          - "damaged_units = request damaged_units, or 0 on the cascade path"
          - "returned_at_utc = logical clock now; return_reason = OPERATOR_RETURN or ORDER_ABANDONED"
          - "EquipmentAsset.units_out_of_service increases by damaged_units"
          - "EquipmentAsset.units_available increases by (units_issued - damaged_units)"
          - "EquipmentAsset.cycles_since_service increments by 1"
          - "EquipmentAsset.service_due recomputed as cycles_since_service >= service_interval_cycles"

# ===========================================================================
# 1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: booking-confirm-stale-venue
    parent_entity: Venue
    write_endpoint: "POST /event-bookings/{id}/confirm"
    occ_field: "expected_venue_version"
    description: |
      Confirming a booking commits venue-wide scarce capacity: the exclusive half-open event
      interval and a share of Venue.rigging_capacity_kg. A confirm whose expected_venue_version no
      longer equals Venue.version was computed against a stale view of the venue's committed load
      and committed intervals, and is rejected. Both requests are legitimate on their own terms —
      they target different bookings and neither observes a state field the other changed on its
      own booking — so the stale-version check is the only deterministic arbiter.
    error_id: ERR_STALE_VENUE_VERSION
    http_status: 412

  - rule_id: changeover-order-create-stale-venue
    parent_entity: Venue
    write_endpoint: "POST /changeover-orders"
    occ_field: "expected_venue_version"
    description: |
      Creating a ChangeoverOrder claims an exclusive turnaround window on the venue floor and a
      slice of Venue.crew_headcount_cap, and its planned_turnaround_minutes is computed from
      Venue.ice_deck_status and Venue.changeover_debt_minutes. A create carrying an
      expected_venue_version that no longer equals Venue.version derived its plan from a superseded
      venue snapshot and is rejected.
    error_id: ERR_STALE_VENUE_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: overnight_shift_flag
    trigger: "on ChangeoverOrder creation (evaluated on window_start_utc) and on LaborCall creation (evaluated on call_start_utc)"
    algorithm: threshold
    formula: |
      local_dt = instant_utc + VENUE_LOCAL_UTC_OFFSET_HOURS hours
      h = local_dt.hour                      # 0..23, venue local
      overnight = (h >= Venue.overnight_shift_start_local_hour) OR (h < OVERNIGHT_END_LOCAL_HOUR)
    input_set: "the single instant supplied by the caller; no other entity rows participate"
    constants:
      VENUE_LOCAL_UTC_OFFSET_HOURS: -4
      OVERNIGHT_END_LOCAL_HOUR: 6
    precision: "boolean; the local hour is truncated, never rounded"

  - name: hold_expires_at
    trigger: "on the EventBooking DRAFT -> HELD transition"
    algorithm: threshold
    formula: |
      tier = AnchorTenant.hold_priority_tier when EventBooking.tenant_id is not null, else OPEN
      hold_expires_at = hold_placed_at + HOLD_WINDOW_HOURS[tier] hours
    input_set: "exactly one AnchorTenant row (the booking's tenant) or none for a promoter booking"
    constants:
      HOLD_WINDOW_HOURS: { TIER_1: 336, TIER_2: 168, TIER_3: 72, OPEN: 24 }
    precision: "ISO 8601 UTC with three fractional digits; whole-hour arithmetic only"

  - name: hold_priority_delta
    trigger: "on HoldChallenge creation (POST /hold-challenges); frozen on the row and re-read, never recomputed, when the challenge is ruled on"
    algorithm: threshold
    formula: |
      priority_delta = TIER_RANK[incumbent EventBooking.hold_tier]
                       - TIER_RANK[challenger AnchorTenant.hold_priority_tier]
      # TIER_RANK is an ordinal where a SMALLER number is a STRONGER contractual claim, so a
      # strictly positive delta means the challenger outranks the incumbent's PINNED hold_tier.
      # The incumbent's tier is read from EventBooking.hold_tier (the snapshot taken at
      # DRAFT -> HELD), NEVER from the incumbent tenant's current hold_priority_tier.
    input_set: "the incumbent EventBooking row's hold_tier snapshot plus the challenger AnchorTenant row"
    constants:
      TIER_RANK: { TIER_1: 1, TIER_2: 2, TIER_3: 3, OPEN: 4 }
      CHALLENGE_CREDIT_GRANT: 2
    precision: "integer in -3..3; the ruling gate is `priority_delta >= 1`, so a delta of exactly 0 (equal tiers) is insufficient and a delta of exactly 1 suffices"

  - name: changeover_turnaround_minutes
    trigger: "variant PLANNED on the ChangeoverOrder creation transition (writes planned_turnaround_minutes); variant ACTUAL on the READY_FOR_SIGNOFF -> SIGNED_OFF transition (writes actual_turnaround_minutes and overrun_minutes)"
    algorithm: forward_looking
    formula: |
      # ---- variant PLANNED (forward_looking) -------------------------------
      from_p = ConfigurationProfile of from_booking
      to_p   = ConfigurationProfile of to_booking

      if from_p.requires_ice AND NOT to_p.requires_ice:
          ice_adder = ICE_COVER_MINUTES if to_p.ice_cover_required else ICE_MELT_MINUTES
      else if (NOT from_p.requires_ice) AND to_p.requires_ice:
          ice_adder = ICE_UNCOVER_MINUTES
                        if Venue.ice_deck_status IN {IN_SERVICE, COVERED}
                        else ICE_BUILD_MINUTES
      else:
          ice_adder = 0

      seating_adder = SEATING_MODE_MINUTES[to_p.seating_mode]
      panel_adder   = ceil(to_p.floor_protection_panels_required / PANELS_PER_SET) * PANEL_SET_MINUTES
      raw_minutes   = to_p.base_changeover_minutes + ice_adder + seating_adder + panel_adder

      crew_factor = min(CREW_FACTOR_MAX,
                        max(CREW_FACTOR_MIN,
                            ChangeoverOrder.crew_headcount / to_p.crew_size_required))
                    # exact rational; NEVER rounded before use

      planned = ceil(raw_minutes / crew_factor)                  # STEP 1 ceiling
      if ChangeoverOrder.overnight_shift:
          planned = ceil(planned * OVERNIGHT_SLOWDOWN)           # STEP 2 ceiling, applied to the
                                                                 # already-ceiled STEP 1 value
      planned_turnaround_minutes = planned

      # ---- variant ACTUAL (chronological) ---------------------------------
      actual_turnaround_minutes = floor((completed_at_utc - started_at_utc) / 60 seconds)
      overrun_minutes           = max(0, actual_turnaround_minutes - window_minutes)
    input_set: |
      PLANNED reads only configuration rows (the two ConfigurationProfiles, Venue.ice_deck_status,
      crew_headcount) and no execution history at all. ACTUAL reads only the two logical-clock
      stamps started_at_utc and completed_at_utc, so it necessarily includes every minute the order
      spent in REWORK and every idle minute between progress calls. The two therefore diverge for
      identical configuration inputs.
    constants:
      ICE_COVER_MINUTES: 90
      ICE_UNCOVER_MINUTES: 75
      ICE_MELT_MINUTES: 600
      ICE_BUILD_MINUTES: 720
      SEATING_MODE_MINUTES: { FULL_BOWL: 0, RETRACTABLE_IN: 120, CURTAINED_HALF: 180 }
      PANELS_PER_SET: 40
      PANEL_SET_MINUTES: 15
      CREW_FACTOR_MIN: 0.5
      CREW_FACTOR_MAX: 2.0
      OVERNIGHT_SLOWDOWN: 1.15
    precision: "whole minutes; the two ceilings are applied in the pinned order STEP 1 then STEP 2 (ceil-then-scale-then-ceil), never as a single ceil(raw / crew_factor * OVERNIGHT_SLOWDOWN)"
    variants:
      - name: PLANNED
        when: "written once, at ChangeoverOrder creation, and never recomputed afterwards"
        difference: "forward-looking from configuration only; blind to rework, idle time and the clock"
      - name: ACTUAL
        when: "written at sign-off into actual_turnaround_minutes"
        difference: "chronological wall-of-clock span from started_at_utc to completed_at_utc; includes rework and idle minutes that PLANNED cannot see, so the two values differ on the same order"

  - name: labor_call_cost_cents
    trigger: "variant ESTIMATED on the LaborCall creation transition (writes estimated_cost_cents); variant SETTLED on the CALLED -> WORKED transition (writes settled_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      rate = LABOR_BASE_RATE_CENTS_PER_HOUR[craft]

      scheduled_hours = (call_end_utc - call_start_utc) / 3600     # exact, may be fractional
      billable_hours  = max(guaranteed_hours, scheduled_hours)     # variant ESTIMATED
      billable_hours  = max(guaranteed_hours, actual_hours)        # variant SETTLED

      straight_hours = min(billable_hours, OT_THRESHOLD_HOURS)
      ot_hours       = max(0, billable_hours - OT_THRESHOLD_HOURS)
      mult           = OVERNIGHT_RATE_MULTIPLIER if overnight else 1.0

      per_head_cents = round_half_up(rate * (straight_hours + ot_hours * OT_MULTIPLIER) * mult)
      cost_cents     = per_head_cents * headcount
      # PINNED ROUNDING ORDER: round to whole cents PER HEAD first, THEN multiply by headcount.
      # The alternative order round_half_up(rate * hours * mult * headcount) is explicitly NOT used
      # and produces a different total whenever the per-head amount lands on a half cent.
    input_set: "exactly one LaborCall row; no aggregation over siblings"
    constants:
      LABOR_BASE_RATE_CENTS_PER_HOUR: { STAGEHAND: 4800, RIGGER: 7200, ICE_TECH: 5600, ELECTRICIAN: 6900, CONVERSION_CREW: 4200 }
      OT_THRESHOLD_HOURS: 8
      OT_MULTIPLIER: 1.5
      OVERNIGHT_RATE_MULTIPLIER: 1.35
    precision: "integer cents, round_half_up, applied once per head before the headcount multiply"
    variants:
      - name: ESTIMATED
        when: "at LaborCall creation, before any hours are worked"
        difference: "billable_hours comes from the scheduled window max(guaranteed_hours, scheduled_hours)"
      - name: SETTLED
        when: "at CALLED -> WORKED close, using reported actual_hours"
        difference: "billable_hours comes from max(guaranteed_hours, actual_hours), so overtime above OT_THRESHOLD_HOURS that was not scheduled appears only in SETTLED"

  - name: labor_cancellation_fee_cents
    trigger: "on the LaborCall CALLED -> CANCELLED transition (endpoint path and ABANDONED-order cascade path alike)"
    algorithm: threshold
    formula: |
      notice_hours = (call_start_utc - logical clock now) / 3600     # may be negative
      factor = 0.00 if notice_hours >= 48
               else 0.25 if notice_hours >= 12
               else 0.50
      cancellation_fee_cents = round_half_up(estimated_cost_cents * factor)
    input_set: "the single LaborCall row plus the logical clock; estimated_cost_cents is read as stored, never recomputed"
    constants:
      CANCEL_FREE_NOTICE_HOURS: 48
      CANCEL_PARTIAL_NOTICE_HOURS: 12
      CANCEL_PARTIAL_FACTOR: 0.25
      CANCEL_LATE_FACTOR: 0.50
    precision: "integer cents, round_half_up; the >= comparisons make exactly 48 hours free and exactly 12 hours partial"

  - name: displacement_settlement_cents
    trigger: "on the EventBooking CHALLENGED -> DISPLACED transition"
    algorithm: waterfall_allocation
    formula: |
      base = DISPLACEMENT_BASE_CENTS[displaced_booking.hold_tier]     # TIER_1 never reaches here
      notice_days = floor((displaced_booking.event_start_utc - logical clock now) / 86400 seconds)

      notice_multiplier = 0.25 if notice_days >= 90
                          else 0.60 if notice_days >= 30
                          else 1.00
      subtotal_cents = round_half_up(base * notice_multiplier)        # STEP 1

      admin_rate = 0.08 if subtotal_cents >= 400000
                   else 0.05 if subtotal_cents >= 150000
                   else 0.03                                          # STEP 2: band read from
                                                                      # SUBTOTAL, never from total
      admin_fee_cents = round_half_up(subtotal_cents * admin_rate)    # STEP 3
      displacement_penalty_cents = subtotal_cents + admin_fee_cents   # STEP 4
      # The evaluation order is pinned because the admin band looks circular: the fee is a function
      # of the total-shaped figure it is then added into. STEP 2 MUST read subtotal_cents. Reading
      # the band off (subtotal + admin_fee) is explicitly wrong and yields a different number
      # whenever subtotal sits just below a band edge.
    input_set: "exactly one EventBooking row (the incumbent) plus the logical clock; the challenger's booking contributes nothing to the figure"
    constants:
      DISPLACEMENT_BASE_CENTS: { TIER_2: 650000, TIER_3: 250000, OPEN: 120000 }
      NOTICE_LONG_DAYS: 90
      NOTICE_MID_DAYS: 30
      ADMIN_HIGH_SUBTOTAL_CENTS: 400000
      ADMIN_MID_SUBTOTAL_CENTS: 150000
    precision: "integer cents, round_half_up at STEP 1 and STEP 3 independently; no rounding at STEP 4"

  - name: condensation_risk_score
    trigger: "on IceSheet install and on every IceSheet transition call; gates the IN_SERVICE -> COVERED transition"
    algorithm: weighted_scoring
    formula: |
      dehum_deficit = 0
                      if required_dehumidification_lph == 0
                      else max(0, (required_dehumidification_lph - dehumidification_lph_applied)
                                  / required_dehumidification_lph)
      cover_load    = min(1.0, cover_hours_accumulated / COVER_HOURS_LIMIT)
      thickness_deficit = max(0, (NOMINAL_THICKNESS_MM - sheet_thickness_mm) / NOMINAL_THICKNESS_MM)

      condensation_risk_score = round_half_up(
          100 * (W_DEHUM * dehum_deficit + W_COVER * cover_load + W_THICKNESS * thickness_deficit),
          2)
    input_set: "the single IceSheet row; required_dehumidification_lph is the snapshot pinned at install, never re-read from the ConfigurationProfile"
    constants:
      W_DEHUM: 0.45
      W_COVER: 0.30
      W_THICKNESS: 0.25
      COVER_HOURS_LIMIT: 72
      NOMINAL_THICKNESS_MM: 32
      CONDENSATION_BLOCK_THRESHOLD: 40.00
      MIN_DEHUM_FRACTION: 0.25
      COVER_CYCLE_LIMIT: 3
    precision: "2 decimal places, round_half_up; the gate is `score >= CONDENSATION_BLOCK_THRESHOLD` so exactly 40.00 is rejected and 39.99 is accepted"

  - name: rigging_committed_load_kg
    trigger: "recomputed on every EventBooking transition into or out of CONFIRMED; also evaluated as a candidate check inside the HELD -> CONFIRMED precondition"
    algorithm: aggregation
    formula: |
      # (a) source + status filter
      peers = EventBooking rows where venue_id == Venue.id
                                 AND status == CONFIRMED
                                 AND id != candidate.id
      # (b) window with explicit boundary: CLOSED [event_start_utc, event_end_utc] on BOTH sides,
      #     so two bookings that merely touch at an endpoint DO both count toward the grid load.
      overlapping = peers where peer.event_start_utc <= candidate.event_end_utc
                            AND candidate.event_start_utc <= peer.event_end_utc
      committed = sum(overlapping.rigging_load_kg)

      accept iff committed + candidate.rigging_load_kg <= Venue.rigging_capacity_kg

      # Venue.rigging_committed_load_kg (the stored derived field) uses the same closed-interval
      # arithmetic with the logical clock instant as a degenerate candidate window
      # [now, now]:  sum over CONFIRMED peers whose closed interval contains now.
      # (c) tie-break: none required — the result is a sum, so peer ordering cannot change it.
    input_set: "EventBooking rows with status == CONFIRMED on the same Venue; DRAFT, HELD, CHALLENGED, RELEASED and DISPLACED bookings contribute nothing"
    constants: {}
    precision: "kilograms to 2 decimal places, round_half_up on the sum; the capacity comparison is `<=` so a load landing exactly on rigging_capacity_kg is accepted"

  - name: equipment_units_available
    trigger: "recomputed on EquipmentIssue creation, on EquipmentIssue ISSUED -> RETURNED, and on both EquipmentAsset maintenance transitions"
    algorithm: aggregation
    formula: |
      outstanding = sum(units_issued) over EquipmentIssue rows
                    where asset_id == EquipmentAsset.id AND status == ISSUED
      units_available = units_total - units_out_of_service - outstanding

      # Conservation invariant, true after every mutation:
      #   units_available + outstanding + units_out_of_service == units_total
    input_set: "EquipmentIssue rows with status == ISSUED on this asset; RETURNED issues contribute nothing"
    constants: {}
    precision: "whole units; never negative — the ERR_EQUIPMENT_UNITS_UNAVAILABLE precondition keeps it non-negative"

  - name: hold_expiry_sweep_selection
    trigger: "on POST /venues/{id}/hold-expiry-sweep"
    algorithm: chronological
    formula: |
      # (a) source + status filter
      candidates = EventBooking rows where venue_id == path venue
                                       AND status IN {HELD, CHALLENGED}
                                       AND hold_expires_at <= logical clock now      # inclusive
      # (b) processing order — pinned, because each release mutates Venue and cascades
      ordered = candidates sorted by hold_expires_at ASC, then created_at ASC
      # (c) tie-break: created_at ASC. `id` is NEVER consulted.

      for each booking in ordered:
          apply the HELD -> RELEASED (or CHALLENGED -> RELEASED) transition with
          release_reason = "HOLD_EXPIRY_SWEEP"

      swept_count = len(ordered)
      released_booking_ids = [booking.id for booking in ordered]     # in `ordered` order
      # Empty-set rule: when ordered is empty, swept_count = 0, released_booking_ids = [],
      # and Venue.version is NOT incremented.
    input_set: "EventBooking rows on the path venue in status HELD or CHALLENGED whose hold_expires_at is at or before the logical clock; CONFIRMED, DRAFT, RELEASED and DISPLACED bookings are never swept"
    constants: {}
    precision: "the expiry comparison is `<=`, so a booking whose hold_expires_at equals the clock instant exactly IS swept"

  - name: changeover_readiness_projection
    trigger: "on GET /changeover-orders/{id}/readiness"
    algorithm: projection
    formula: |
      slack_minutes = window_minutes - planned_turnaround_minutes
      blocking_reasons = ordered list, appended in exactly this order:
        1. "INCOMING_BOOKING_NOT_CONFIRMED"  when to_booking.status != CONFIRMED
        2. "FLOOR_PROTECTION_SHORTFALL"      when floor_stage == NOT_STARTED
                                             AND issued FLOOR_PANEL_SET units on this order
                                                 < ceil(to_p.floor_protection_panels_required
                                                        / PANELS_PER_SET)
        3. "FLOOR_INCOMPLETE"                when floor_stage   != FLOOR_COMPLETE
        4. "SEATING_INCOMPLETE"              when seating_stage != SEATING_COMPLETE
        5. "INFRA_INCOMPLETE"                when infra_stage   != BROADCAST_READY
        6. "CHANGEOVER_DEBT_FREEZE"          when Venue.changeover_debt_minutes
                                                 >= CHANGEOVER_DEBT_FREEZE_MINUTES
    input_set: "the ChangeoverOrder row, its two ConfigurationProfiles, its ISSUED EquipmentIssue rows, and its Venue"
    constants:
      CHANGEOVER_DEBT_FREEZE_MINUTES: 180
    precision: "whole minutes; slack_minutes may be negative after a window-shortening rework"

# ===========================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# ===========================================================================
# Ordering rationale for this domain: identity first, then request shape, then existence, then
# optimistic-concurrency, then state, then SAFETY (ice/condensation/floor protection — a wet deck or
# an unprotected floor destroys the building), then TEMPORAL feasibility (windows and docks), then
# CONSTRAINT satisfaction (caps, quotas, priority), then REFERENTIAL scoping, and FISCAL capacity
# last: the arena would rather refuse a dangerous turnaround than a merely expensive one.
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the endpoint's declared roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 22
    category: auth
    check: "when X-User-Role is AnchorTenantRep, X-User-ID equals the AnchorTenant id the request acts for: EventBooking.tenant_id on hold, HoldChallenge.challenger_tenant_id on challenge create and withdraw"
    error_id: ERR_TENANT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /event-bookings, POST /event-bookings/{id}/hold, POST /hold-challenges, POST /hold-challenges/{id}/withdraw"

  - priority: 24
    category: auth
    check: "X-User-ID differs from ChangeoverOrder.opened_by_user_id — the supervisor who opened a turnaround may never sign it off"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /changeover-orders/{id}/signoff"

  - priority: 30
    category: business_constraint
    check: "request body shape: every required input field present, enum values members of their declared set, numeric fields within their declared constraints, event_end_utc > event_start_utc, window_end_utc > window_start_utc, call_end_utc > call_start_utc, expected_attendance <= ConfigurationProfile.nominal_seats, promoter_name present when tenant_id is null, damaged_units <= units_issued, sheet_thickness_mm in 18..45"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 32
    category: business_constraint
    check: "exactly one of changeover_order_id and booking_id is supplied and non-null"
    error_id: ERR_LABOR_CALL_SCOPE_INVALID
    http_status: 400
    applies_to: "POST /labor-calls"

  - priority: 40
    category: existence
    check: "path and body resource ids resolve, validated left-to-right in the path and then in body-field declaration order"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_PROFILE_NOT_FOUND | ERR_TENANT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_CHALLENGE_NOT_FOUND | ERR_CHANGEOVER_ORDER_NOT_FOUND | ERR_ICE_SHEET_NOT_FOUND | ERR_DOCK_RESERVATION_NOT_FOUND | ERR_LABOR_CALL_NOT_FOUND | ERR_EQUIPMENT_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 45
    category: state
    check: "expected_venue_version equals the current Venue.version of the venue the write commits against"
    error_id: ERR_STALE_VENUE_VERSION
    http_status: 412
    applies_to: "POST /event-bookings/{id}/confirm, POST /changeover-orders"

  - priority: 50
    category: state
    check: "the target EventBooking is in a from-state the requested transition declares"
    error_id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    applies_to: "POST /event-bookings/{id}/hold, POST /event-bookings/{id}/confirm, POST /event-bookings/{id}/release, POST /hold-challenges, POST /event-bookings/{id}/dock-slot-reservations, POST /labor-calls"

  - priority: 50
    category: state
    check: "the target ChangeoverOrder is in a from-state the requested transition declares, and for a progress call the requested to_stage is the immediate successor of the named dimension's current stage"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /changeover-orders/{id}/progress, POST /changeover-orders/{id}/rework, POST /changeover-orders/{id}/signoff, POST /equipment-issues, POST /labor-calls, POST /labor-calls/{id}/close"

  - priority: 50
    category: state
    check: "the target IceSheet is in a from-state the requested to_status declares"
    error_id: ERR_INVALID_ICE_SHEET_STATE
    http_status: 409
    applies_to: "POST /ice-sheets/{id}/transition"

  - priority: 50
    category: state
    check: "the target HoldChallenge is OPEN"
    error_id: ERR_INVALID_CHALLENGE_STATE
    http_status: 409
    applies_to: "POST /hold-challenges/{id}/rule, POST /hold-challenges/{id}/withdraw"

  - priority: 50
    category: state
    check: "the target LaborCall is CALLED"
    error_id: ERR_INVALID_LABOR_CALL_STATE
    http_status: 409
    applies_to: "POST /labor-calls/{id}/close, POST /labor-calls/{id}/cancel"

  - priority: 50
    category: state
    check: "the target EquipmentIssue is ISSUED; and a START maintenance action requires the asset to have no ISSUED EquipmentIssue rows"
    error_id: ERR_INVALID_ISSUE_STATE
    http_status: 409
    applies_to: "POST /equipment-issues/{id}/return, POST /equipment-assets/{id}/maintenance"

  - priority: 50
    category: state
    check: "the target DockSlotReservation is RESERVED"
    error_id: ERR_INVALID_DOCK_RESERVATION_STATE
    http_status: 409
    applies_to: "POST /dock-slot-reservations/{id}/cancel"

  - priority: 52
    category: state
    check: "the incoming booking (ChangeoverOrder.to_booking_id) has status == CONFIRMED before any floor, seating or infra progress may be recorded"
    error_id: ERR_INCOMING_BOOKING_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /changeover-orders/{id}/progress"

  - priority: 54
    category: state
    check: "the EquipmentAsset the units come from has status == IN_SERVICE"
    error_id: ERR_ASSET_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /equipment-issues"

  - priority: 56
    category: state
    check: "the venue has no IceSheet with status != REMOVED"
    error_id: ERR_ICE_SHEET_ALREADY_PRESENT
    http_status: 409
    applies_to: "POST /venues/{id}/ice-sheets"

  - priority: 60
    category: business_safety
    check: "dehumidification_lph_applied >= MIN_DEHUM_FRACTION * required_dehumidification_lph (0.25 of the configuration's demand); evaluated with >= so exactly one quarter of the demand passes"
    error_id: ERR_DEHUMIDIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /venues/{id}/ice-sheets, POST /ice-sheets/{id}/transition"

  - priority: 62
    category: business_safety
    check: "the recomputed condensation_risk_score is strictly below CONDENSATION_BLOCK_THRESHOLD (40.00) before ice may be covered, whether covered directly or by the sign-off cascade"
    error_id: ERR_CONDENSATION_RISK_TOO_HIGH
    http_status: 422
    applies_to: "POST /ice-sheets/{id}/transition, POST /changeover-orders/{id}/signoff"

  - priority: 64
    category: business_safety
    check: "no EventBooking on the venue in status HELD, CHALLENGED or CONFIRMED whose configuration requires ice starts inside the closed window [now, now + ICE_BUILD_MINUTES minutes] when the operator asks to melt the sheet out"
    error_id: ERR_ICE_EVENT_DEPENDENCY
    http_status: 409
    applies_to: "POST /ice-sheets/{id}/transition"

  - priority: 66
    category: business_safety
    check: "ISSUED FLOOR_PANEL_SET units on this ChangeoverOrder sum to at least ceil(to-config floor_protection_panels_required / PANELS_PER_SET) before the floor dimension may advance to LAYING; evaluated with >= so the exact set count passes"
    error_id: ERR_FLOOR_PROTECTION_SHORTFALL
    http_status: 422
    applies_to: "POST /changeover-orders/{id}/progress"

  - priority: 68
    category: business_constraint
    check: "to_booking.event_start_utc > from_booking.event_end_utc. This structural ordering check runs BEFORE any window arithmetic (priorities 72 and 74) precisely so that an inverted pair reports the sequencing fault rather than a negative-length window"
    error_id: ERR_ORDER_BOOKING_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /changeover-orders"

  - priority: 70
    category: business_temporal
    check: "no other RESERVED DockSlotReservation on the same (venue, dock_number) collides under buffered half-open arithmetic: reject iff new.window_start_utc < existing.window_end_utc + Venue.dock_buffer_minutes AND existing.window_start_utc < new.window_end_utc + Venue.dock_buffer_minutes. A gap of exactly dock_buffer_minutes is therefore accepted."
    error_id: ERR_DOCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /event-bookings/{id}/dock-slot-reservations"

  - priority: 72
    category: business_temporal
    check: "no other ChangeoverOrder on the same venue with status NOT IN {SIGNED_OFF, ABANDONED} collides under unbuffered half-open arithmetic: reject iff new.window_start_utc < existing.window_end_utc AND existing.window_start_utc < new.window_end_utc. Windows that merely touch are accepted."
    error_id: ERR_CHANGEOVER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /changeover-orders"

  - priority: 74
    category: business_temporal
    check: "window_minutes >= planned_turnaround_minutes; evaluated with >= so a window exactly as long as the plan is accepted"
    error_id: ERR_TURNAROUND_WINDOW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /changeover-orders"

  - priority: 76
    category: business_temporal
    check: "no other EventBooking on the same venue with status == CONFIRMED collides under unbuffered half-open arithmetic on [event_start_utc, event_end_utc): reject iff new.event_start_utc < existing.event_end_utc AND existing.event_start_utc < new.event_end_utc"
    error_id: ERR_BOOKING_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /event-bookings/{id}/confirm"

  - priority: 78
    category: business_temporal
    check: "the logical clock is at or before hold_expires_at; evaluated with <= so confirming exactly at the expiry instant still succeeds"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /event-bookings/{id}/confirm"

  - priority: 80
    category: business_constraint
    check: "crew_headcount <= Venue.crew_headcount_cap"
    error_id: ERR_CREW_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /changeover-orders"

  - priority: 82
    category: business_constraint
    check: "1 <= dock_number <= Venue.dock_count of the booking's venue"
    error_id: ERR_DOCK_NUMBER_INVALID
    http_status: 422
    applies_to: "POST /event-bookings/{id}/dock-slot-reservations"

  - priority: 86
    category: business_constraint
    check: "units_issued <= EquipmentAsset.units_available; evaluated with <= so taking the last available unit succeeds"
    error_id: ERR_EQUIPMENT_UNITS_UNAVAILABLE
    http_status: 409
    applies_to: "POST /equipment-issues"

  - priority: 88
    category: business_constraint
    check: "the incumbent booking's hold_tier is not TIER_1 — a TIER_1 anchor hold can never be displaced"
    error_id: ERR_ANCHOR_HOLD_PROTECTED
    http_status: 409
    applies_to: "POST /hold-challenges/{id}/rule"

  - priority: 90
    category: business_constraint
    check: "HoldChallenge.priority_delta >= 1, i.e. the challenger's tier strictly outranks the incumbent's pinned hold_tier, before a challenge may be upheld"
    error_id: ERR_HOLD_PRIORITY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /hold-challenges/{id}/rule"

  - priority: 92
    category: business_constraint
    check: "AnchorTenant.challenge_credits >= 1"
    error_id: ERR_CHALLENGE_CREDITS_EXHAUSTED
    http_status: 409
    applies_to: "POST /hold-challenges"

  - priority: 94
    category: business_constraint
    check: "Venue.changeover_debt_minutes < CHANGEOVER_DEBT_FREEZE_MINUTES (180) — a venue that has already overrun its turnaround targets by three hours may not open new turnarounds"
    error_id: ERR_CHANGEOVER_DEBT_FREEZE
    http_status: 409
    applies_to: "POST /changeover-orders"

  - priority: 96
    category: business_referential
    check: "referenced rows belong to the same venue: ConfigurationProfile.venue_id and AnchorTenant.venue_id equal the booking's venue_id; from_booking.venue_id equals to_booking.venue_id; EquipmentAsset.venue_id equals ChangeoverOrder.venue_id; the incumbent and challenger bookings of a HoldChallenge share a venue"
    error_id: ERR_VENUE_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /event-bookings, POST /changeover-orders, POST /hold-challenges, POST /equipment-issues, POST /venues/{id}/ice-sheets"

  - priority: 98
    category: business_referential
    check: "no HoldChallenge already exists with the same booking_id and challenger_tenant_id in status OPEN"
    error_id: ERR_DUPLICATE_CHALLENGE
    http_status: 409
    applies_to: "POST /hold-challenges"

  - priority: 100
    category: business_fiscal
    check: "calculations.rigging_committed_load_kg over the closed-interval CONFIRMED peer set plus this booking's rigging_load_kg <= Venue.rigging_capacity_kg; evaluated with <= so a load landing exactly on capacity is accepted"
    error_id: ERR_RIGGING_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /event-bookings/{id}/confirm"

  - priority: 102
    category: business_fiscal
    check: "AnchorTenant.holds_consumed < AnchorTenant.guaranteed_holds_per_season"
    error_id: ERR_TENANT_HOLD_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /event-bookings/{id}/hold"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Venue -------------------------------------------------------------
  - method: POST
    path: "/venues"
    description: "Register an arena with its physical envelope: rigging grid capacity, dock count, crew cap and the two interval buffers that drive every temporal rule."
    roles: [VenueOperationsDirector]
    code: 201
    input: [name, rigging_capacity_kg, dock_count, max_bowl_seats, crew_headcount_cap, "min_turnaround_buffer_minutes?", "dock_buffer_minutes?", "overnight_shift_start_local_hour?"]
    output: Venue
    side_effects:
      - "ice_deck_status = NONE, rigging_committed_load_kg = 0, open_hold_count = 0, changeover_debt_minutes = 0"
      - "version = 1"

  - method: GET
    path: "/venues/{id}"
    description: "Read one arena including its four derived operational fields and its OCC version."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/venues/{id}/configuration-profiles"
    description: "Declare one immutable house configuration (ice, court, concert, family show) with its changeover baseline, crew size, panel count and dehumidification demand."
    roles: [VenueOperationsDirector]
    code: 201
    input: [code, requires_ice, ice_cover_required, seating_mode, nominal_seats, base_changeover_minutes, crew_size_required, floor_protection_panels_required, dehumidification_required_lph, rigging_points_required]
    output: ConfigurationProfile
    side_effects: []

  - method: GET
    path: "/venues/{id}/configuration-profiles"
    description: "Reverse-reachability list of the arena's configuration profiles."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: ConfigurationProfile[]
    side_effects: []

  - method: POST
    path: "/venues/{id}/anchor-tenants"
    description: "Register an anchor tenant with its contractual hold priority tier and hold entitlement."
    roles: [VenueOperationsDirector]
    code: 201
    input: [name, hold_priority_tier, guaranteed_holds_per_season]
    output: AnchorTenant
    side_effects:
      - "holds_consumed = 0"
      - "challenge_credits = CHALLENGE_CREDIT_GRANT (2)"

  - method: GET
    path: "/venues/{id}/anchor-tenants"
    description: "Reverse-reachability list of the arena's anchor tenants with live credit and hold counters."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["hold_priority_tier?", "limit?", "offset?"]
    output: AnchorTenant[]
    side_effects: []

  - method: POST
    path: "/venues/{id}/equipment-assets"
    description: "Create a pool of staging, dasher, curtain or floor-panel units with its service interval."
    roles: [VenueOperationsDirector]
    code: 201
    input: [asset_class, units_total, "service_interval_cycles?"]
    output: EquipmentAsset
    side_effects:
      - "units_available = units_total, units_out_of_service = 0, cycles_since_service = 0, service_due = false, status = IN_SERVICE"

  - method: GET
    path: "/venues/{id}/equipment-assets"
    description: "Reverse-reachability list of the arena's equipment pools with live availability."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["asset_class?", "status?", "limit?", "offset?"]
    output: EquipmentAsset[]
    side_effects: []

  - method: GET
    path: "/equipment-assets/{id}"
    description: "Read one equipment pool with its live availability, out-of-service count, service counter and service_due flag."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: []

  - method: POST
    path: "/equipment-assets/{id}/maintenance"
    description: "Take an equipment pool out of service for maintenance (action=START) or return it repaired (action=COMPLETE, which clears units_out_of_service and resets the service counter)."
    roles: [VenueOperationsDirector]
    code: 200
    input: [action]
    output: EquipmentAsset
    side_effects:
      - "START: status -> OUT_OF_SERVICE"
      - "COMPLETE: status -> IN_SERVICE, units_out_of_service = 0, cycles_since_service = 0, service_due = false, units_available recomputed"

  # ---- Ice ---------------------------------------------------------------
  - method: POST
    path: "/venues/{id}/ice-sheets"
    description: "Flood a new ice sheet for the arena, pinning the installing configuration's dehumidification demand onto the sheet as required_dehumidification_lph."
    roles: [ChangeoverSupervisor]
    code: 201
    input: [config_profile_id, dehumidification_lph_applied, "sheet_thickness_mm?"]
    output: IceSheet
    side_effects:
      - "status = BUILDING, cover_cycles = 0, cover_hours_accumulated = 0"
      - "required_dehumidification_lph snapshotted from the profile"
      - "condensation_risk_score computed"
      - "Venue.ice_deck_status -> BUILDING; increments Venue.version by 1"

  - method: GET
    path: "/venues/{id}/ice-sheets"
    description: "Reverse-reachability list of the arena's ice sheets including REMOVED history."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IceSheet[]
    side_effects: []

  - method: POST
    path: "/ice-sheets/{id}/transition"
    description: "Drive the ice sheet around its lifecycle: BUILDING->IN_SERVICE, the IN_SERVICE<->COVERED covering cycle, IN_SERVICE->MELTING and MELTING->REMOVED. Optionally revise the dehumidification rate in the same call."
    roles: [ChangeoverSupervisor]
    code: 200
    input: [to_status, "dehumidification_lph_applied?"]
    output: IceSheet
    side_effects:
      - "condensation_risk_score recomputed on every accepted call"
      - "-> COVERED: cover_installed_at_utc stamped, cover_cycles incremented, and an automatic COVERED -> MELTING hop when cover_cycles > COVER_CYCLE_LIMIT"
      - "COVERED -> IN_SERVICE: cover_hours_accumulated increased, cover_installed_at_utc cleared"
      - "Venue.ice_deck_status recomputed; increments Venue.version by 1"

  # ---- Bookings and holds ------------------------------------------------
  - method: POST
    path: "/event-bookings"
    description: "Create a DRAFT booking for a configuration on an arena. tenant_id makes it an anchor booking; omitting it makes it a promoter booking that holds at tier OPEN and requires promoter_name."
    roles: [BookingManager, AnchorTenantRep]
    code: 201
    input: [venue_id, config_profile_id, title, event_start_utc, event_end_utc, expected_attendance, "tenant_id?", "promoter_name?", "rigging_load_kg?"]
    output: EventBooking
    side_effects:
      - "status = DRAFT, hold_tier = null, hold_expires_at = null, displacement_penalty_cents = 0"

  - method: GET
    path: "/event-bookings/{id}"
    description: "Read one booking including its pinned hold_tier, hold_expires_at, displacement fields and self-referential displaced_by_booking_id."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: []
    output: EventBooking
    side_effects: []

  - method: GET
    path: "/event-bookings"
    description: "Filtered, paginated booking list. Serves reverse reachability for all four EventBooking foreign keys, including the self-referential displaced_by_booking_id."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["venue_id?", "tenant_id?", "config_profile_id?", "displaced_by_booking_id?", "status?", "limit?", "offset?"]
    output: EventBooking[]
    side_effects: []

  - method: POST
    path: "/event-bookings/{id}/hold"
    description: "Place the contractual hold on a DRAFT booking, pinning hold_tier from the tenant and computing hold_expires_at from the tier's hold window."
    roles: [BookingManager, AnchorTenantRep]
    code: 200
    input: []
    output: EventBooking
    side_effects:
      - "status -> HELD; hold_placed_at, hold_tier and hold_expires_at written"
      - "AnchorTenant.holds_consumed and Venue.open_hold_count recomputed"
      - "increments Venue.version by 1"

  - method: POST
    path: "/event-bookings/{id}/confirm"
    description: "Commit a held booking against venue-wide scarce capacity. Guarded by optimistic concurrency on Venue.version (concurrency_rules.booking-confirm-stale-venue)."
    roles: [BookingManager]
    code: 200
    input: [expected_venue_version]
    output: EventBooking
    side_effects:
      - "status -> CONFIRMED"
      - "Venue.open_hold_count and Venue.rigging_committed_load_kg recomputed"
      - "increments Venue.version by 1"

  - method: POST
    path: "/event-bookings/{id}/release"
    description: "Give a booking back from DRAFT, HELD, CHALLENGED or CONFIRMED, cascading dock reservations, changeover orders, equipment issues and labor calls."
    roles: [BookingManager]
    code: 200
    input: [reason]
    output: EventBooking
    side_effects:
      - "status -> RELEASED; release_reason written"
      - "RESERVED DockSlotReservations on the booking -> RELEASED with release_reason = BOOKING_GONE"
      - "non-terminal ChangeoverOrders referencing the booking -> ABANDONED, which auto-returns their ISSUED EquipmentIssues and cancels their CALLED LaborCalls"
      - "OPEN HoldChallenges on the booking -> DENIED"
      - "AnchorTenant.holds_consumed, Venue.open_hold_count and Venue.rigging_committed_load_kg recomputed"
      - "increments Venue.version by 1"

  - method: POST
    path: "/venues/{id}/hold-expiry-sweep"
    description: "Operator sweep that releases every HELD or CHALLENGED booking on the arena whose hold_expires_at is at or before the logical clock, processed in hold_expires_at ASC then created_at ASC order."
    roles: [BookingManager]
    code: 200
    input: []
    output: "{ swept_count: integer, released_booking_ids: string[], venue_version: integer }"
    side_effects:
      - "each swept booking takes the HELD/CHALLENGED -> RELEASED transition with release_reason = HOLD_EXPIRY_SWEEP and all of its cascades"
      - "increments Venue.version by 1 only when swept_count >= 1; a sweep that matches nothing leaves Venue.version untouched"

  - method: POST
    path: "/hold-challenges"
    description: "An anchor tenant spends a challenge credit to contest an incumbent hold, pushing the incumbent booking into CHALLENGED."
    roles: [AnchorTenantRep]
    code: 201
    input: [booking_id, challenger_tenant_id, challenger_booking_id]
    output: HoldChallenge
    side_effects:
      - "status = OPEN; priority_delta computed"
      - "challenger AnchorTenant.challenge_credits decrements by 1"
      - "incumbent EventBooking HELD -> CHALLENGED"
      - "increments Venue.version by 1"

  - method: GET
    path: "/hold-challenges/{id}"
    description: "Read one hold challenge including its computed priority_delta."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: []
    output: HoldChallenge
    side_effects: []

  - method: GET
    path: "/hold-challenges"
    description: "Filtered, paginated challenge list. Serves reverse reachability for booking_id, challenger_tenant_id and challenger_booking_id."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["booking_id?", "challenger_tenant_id?", "challenger_booking_id?", "status?", "limit?", "offset?"]
    output: HoldChallenge[]
    side_effects: []

  - method: POST
    path: "/hold-challenges/{id}/rule"
    description: "Rule on an open challenge. decision=UPHELD displaces the incumbent and starts the four-hop displacement cascade; decision=DENIED returns the incumbent to HELD, closing the HELD->CHALLENGED->HELD cycle."
    roles: [BookingManager]
    code: 200
    input: [decision, "ruling_note?"]
    output: HoldChallenge
    side_effects:
      - "status -> UPHELD or DENIED; ruled_at stamped"
      - "UPHELD: incumbent EventBooking CHALLENGED -> DISPLACED with displacement_penalty_cents computed, which abandons its ChangeoverOrders, which auto-return their EquipmentIssues and cancel their LaborCalls"
      - "DENIED: incumbent EventBooking CHALLENGED -> HELD with hold_expires_at untouched"
      - "increments Venue.version by 1"

  - method: POST
    path: "/hold-challenges/{id}/withdraw"
    description: "The challenging tenant pulls its challenge back. This is the compensating action of the credit spend and returns the incumbent to HELD."
    roles: [AnchorTenantRep]
    code: 200
    input: []
    output: HoldChallenge
    side_effects:
      - "status -> WITHDRAWN"
      - "challenger AnchorTenant.challenge_credits increments by 1"
      - "incumbent EventBooking CHALLENGED -> HELD"
      - "increments Venue.version by 1"

  # ---- Changeover orders -------------------------------------------------
  - method: POST
    path: "/changeover-orders"
    description: "Open a turnaround between an outgoing and an incoming booking. Computes the window from the outgoing event's end plus the venue buffer and freezes planned_turnaround_minutes. Guarded by optimistic concurrency on Venue.version (concurrency_rules.changeover-order-create-stale-venue)."
    roles: [ChangeoverSupervisor]
    code: 201
    input: [from_booking_id, to_booking_id, crew_headcount, expected_venue_version]
    output: ChangeoverOrder
    side_effects:
      - "venue_id, window_start_utc, window_end_utc, window_minutes, overnight_shift and planned_turnaround_minutes computed"
      - "status = PLANNED; all three stage dimensions = NOT_STARTED; opened_by_user_id = X-User-ID"
      - "increments Venue.version by 1"

  - method: GET
    path: "/changeover-orders/{id}"
    description: "Read one turnaround with its three parallel stage dimensions, compound status and both turnaround variants."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: []
    output: ChangeoverOrder
    side_effects: []

  - method: GET
    path: "/changeover-orders"
    description: "Filtered, paginated turnaround list. Serves reverse reachability for venue_id, from_booking_id and to_booking_id."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["venue_id?", "from_booking_id?", "to_booking_id?", "status?", "limit?", "offset?"]
    output: ChangeoverOrder[]
    side_effects: []

  - method: POST
    path: "/changeover-orders/{id}/progress"
    description: "Advance exactly one of the three parallel dimensions (FLOOR, SEATING, INFRA) by exactly one stage. The compound status follows from the resulting combination."
    roles: [ChangeoverSupervisor]
    code: 200
    input: [dimension, to_stage]
    output: ChangeoverOrder
    side_effects:
      - "the named dimension advances one stage; the other two are untouched"
      - "first accepted call stamps started_at_utc and moves status PLANNED -> IN_PROGRESS"
      - "the call that leaves all three dimensions terminal stamps completed_at_utc and moves status -> READY_FOR_SIGNOFF"

  - method: POST
    path: "/changeover-orders/{id}/rework"
    description: "Send one dimension back to NOT_STARTED because the work failed inspection. The order's revision loop; started_at_utc survives so ACTUAL turnaround absorbs the rework minutes."
    roles: [ChangeoverSupervisor]
    code: 200
    input: [dimension, reason]
    output: ChangeoverOrder
    side_effects:
      - "the named dimension resets to NOT_STARTED; rework_count increments by 1; completed_at_utc cleared; status -> REWORK"

  - method: POST
    path: "/changeover-orders/{id}/signoff"
    description: "Director sign-off of a ready turnaround. Computes the ACTUAL turnaround variant and overrun, charges the venue's changeover debt ledger, and on a covering changeover automatically covers the ice. Cannot be performed by the supervisor who opened the order."
    roles: [VenueOperationsDirector]
    code: 200
    input: []
    output: ChangeoverOrder
    side_effects:
      - "status -> SIGNED_OFF; signed_off_by_user_id = X-User-ID"
      - "actual_turnaround_minutes and overrun_minutes computed"
      - "Venue.changeover_debt_minutes increments by overrun_minutes"
      - "on a covering changeover the venue's IN_SERVICE IceSheet -> COVERED, which itself auto-melts the sheet when cover_cycles > COVER_CYCLE_LIMIT"
      - "increments Venue.version by 1"

  - method: GET
    path: "/changeover-orders/{id}/readiness"
    description: "Computed read: slack against the window plus the ordered list of blocking reasons for this turnaround."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: []
    output: "{ order_id: string, status: string, floor_stage: string, seating_stage: string, infra_stage: string, window_minutes: integer, planned_turnaround_minutes: integer, slack_minutes: integer, blocking_reasons: string[] }"
    side_effects: []

  # ---- Docks -------------------------------------------------------------
  - method: POST
    path: "/event-bookings/{id}/dock-slot-reservations"
    description: "Reserve a dock window for a booking's load-in or load-out. Buffered half-open collision arithmetic on (venue, dock_number)."
    roles: [ChangeoverSupervisor, LaborCoordinator]
    code: 201
    input: [dock_number, purpose, window_start_utc, window_end_utc, truck_count]
    output: DockSlotReservation
    side_effects:
      - "status = RESERVED"

  - method: GET
    path: "/event-bookings/{id}/dock-slot-reservations"
    description: "Reverse-reachability list of a booking's dock reservations."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["purpose?", "status?", "limit?", "offset?"]
    output: DockSlotReservation[]
    side_effects: []

  - method: POST
    path: "/dock-slot-reservations/{id}/cancel"
    description: "Give a dock window back, freeing the buffered interval on that dock number."
    roles: [ChangeoverSupervisor, LaborCoordinator]
    code: 200
    input: []
    output: DockSlotReservation
    side_effects:
      - "status -> RELEASED with release_reason = OPERATOR_CANCEL"

  # ---- Labor -------------------------------------------------------------
  - method: POST
    path: "/labor-calls"
    description: "Issue a labor call scoped to exactly one of a changeover order or a booking. Freezes the ESTIMATED cost variant from the scheduled window and the call guarantee."
    roles: [LaborCoordinator]
    code: 201
    input: [craft, headcount, call_start_utc, call_end_utc, "guaranteed_hours?", "changeover_order_id?", "booking_id?"]
    output: LaborCall
    side_effects:
      - "status = CALLED; overnight computed; estimated_cost_cents computed"

  - method: GET
    path: "/labor-calls/{id}"
    description: "Read one labor call with both cost variants and its cancellation fee."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: []
    output: LaborCall
    side_effects: []

  - method: GET
    path: "/labor-calls"
    description: "Filtered, paginated labor call list. Serves reverse reachability for changeover_order_id and booking_id."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["changeover_order_id?", "booking_id?", "craft?", "status?", "limit?", "offset?"]
    output: LaborCall[]
    side_effects: []

  - method: POST
    path: "/labor-calls/{id}/close"
    description: "Close a worked call with reported hours, writing the SETTLED cost variant."
    roles: [LaborCoordinator]
    code: 200
    input: [actual_hours]
    output: LaborCall
    side_effects:
      - "status -> WORKED; actual_hours stored; settled_cost_cents computed"

  - method: POST
    path: "/labor-calls/{id}/cancel"
    description: "Cancel a call, charging the notice-band cancellation fee against the frozen estimate."
    roles: [LaborCoordinator]
    code: 200
    input: []
    output: LaborCall
    side_effects:
      - "status -> CANCELLED; cancellation_fee_cents computed; settled_cost_cents stays null"

  # ---- Equipment issues --------------------------------------------------
  - method: POST
    path: "/equipment-issues"
    description: "Issue units from an equipment pool to a turnaround. The many-to-many junction between EquipmentAsset and ChangeoverOrder."
    roles: [ChangeoverSupervisor]
    code: 201
    input: [asset_id, changeover_order_id, units_issued]
    output: EquipmentIssue
    side_effects:
      - "status = ISSUED; EquipmentAsset.units_available decreases by units_issued"

  - method: GET
    path: "/equipment-issues/{id}"
    description: "Read one equipment issue."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: []
    output: EquipmentIssue
    side_effects: []

  - method: GET
    path: "/equipment-issues"
    description: "Filtered, paginated equipment issue list. Serves reverse reachability for asset_id and changeover_order_id."
    roles: [VenueOperationsDirector, BookingManager, ChangeoverSupervisor, LaborCoordinator, AnchorTenantRep]
    code: 200
    input: ["asset_id?", "changeover_order_id?", "status?", "limit?", "offset?"]
    output: EquipmentIssue[]
    side_effects: []

  - method: POST
    path: "/equipment-issues/{id}/return"
    description: "Return issued units, optionally reporting damage. The compensating action of the issue; damaged units move to units_out_of_service instead of back to units_available so the pool total is conserved."
    roles: [ChangeoverSupervisor]
    code: 200
    input: ["damaged_units?"]
    output: EquipmentIssue
    side_effects:
      - "status -> RETURNED; returned_at_utc stamped; return_reason = OPERATOR_RETURN"
      - "EquipmentAsset.units_available increases by (units_issued - damaged_units); units_out_of_service increases by damaged_units; cycles_since_service increments by 1; service_due recomputed"

  # ---- Logical clock (test-driving endpoint) ------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every temporal rule in this scaffold reads instead of wall-clock time. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every rule observes that instant and the server MUST NOT fall back to real wall-clock time."
    roles: [VenueOperationsDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "the logical clock jumps to to_iso8601; no entity row is mutated and no version is incremented"

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not in the endpoint's roles list"
  - id: ERR_TENANT_SCOPE_VIOLATION
    http: 403
    condition: "an AnchorTenantRep acts on a booking or challenge belonging to a different AnchorTenant than its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "sign-off attempted by the same X-User-ID recorded in ChangeoverOrder.opened_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, out-of-range number, non-increasing interval, expected_attendance above nominal_seats, promoter_name absent on a tenant-less booking, or damaged_units above units_issued"
  - id: ERR_LABOR_CALL_SCOPE_INVALID
    http: 400
    condition: "a labor call supplies both changeover_order_id and booking_id, or neither"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venue id in the path or body does not resolve"
  - id: ERR_PROFILE_NOT_FOUND
    http: 404
    condition: "config_profile_id does not resolve"
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "tenant_id or challenger_tenant_id does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "an EventBooking id in the path or body does not resolve"
  - id: ERR_CHALLENGE_NOT_FOUND
    http: 404
    condition: "a HoldChallenge id in the path does not resolve"
  - id: ERR_CHANGEOVER_ORDER_NOT_FOUND
    http: 404
    condition: "a ChangeoverOrder id in the path or body does not resolve"
  - id: ERR_ICE_SHEET_NOT_FOUND
    http: 404
    condition: "an IceSheet id in the path does not resolve"
  - id: ERR_DOCK_RESERVATION_NOT_FOUND
    http: 404
    condition: "a DockSlotReservation id in the path does not resolve"
  - id: ERR_LABOR_CALL_NOT_FOUND
    http: 404
    condition: "a LaborCall id in the path does not resolve"
  - id: ERR_EQUIPMENT_NOT_FOUND
    http: 404
    condition: "an EquipmentAsset id or EquipmentIssue id in the path or body does not resolve"
  - id: ERR_STALE_VENUE_VERSION
    http: 412
    condition: "expected_venue_version does not equal the current Venue.version on booking confirm or changeover-order create"
  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "the EventBooking is not in a from-state the requested transition declares, or a CONFIRMED booking with a SIGNED_OFF incoming turnaround is asked to release"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "the ChangeoverOrder is not in a from-state the requested transition declares, or a progress call names a to_stage that is not the immediate successor of the dimension's current stage"
  - id: ERR_INVALID_ICE_SHEET_STATE
    http: 409
    condition: "the requested to_status is not reachable from the IceSheet's current status"
  - id: ERR_INVALID_CHALLENGE_STATE
    http: 409
    condition: "the HoldChallenge is not OPEN"
  - id: ERR_INVALID_LABOR_CALL_STATE
    http: 409
    condition: "the LaborCall is not CALLED"
  - id: ERR_INVALID_ISSUE_STATE
    http: 409
    condition: "the EquipmentIssue is not ISSUED, or a START maintenance action is attempted while the pool still has ISSUED units out"
  - id: ERR_INVALID_DOCK_RESERVATION_STATE
    http: 409
    condition: "the DockSlotReservation is not RESERVED"
  - id: ERR_INCOMING_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "changeover progress is recorded while the incoming booking is not yet CONFIRMED"
  - id: ERR_ASSET_OUT_OF_SERVICE
    http: 409
    condition: "units are issued from an EquipmentAsset whose status is OUT_OF_SERVICE"
  - id: ERR_ICE_SHEET_ALREADY_PRESENT
    http: 409
    condition: "an ice sheet install is attempted while the venue still has a sheet outside REMOVED"
  - id: ERR_DEHUMIDIFICATION_INSUFFICIENT
    http: 422
    condition: "dehumidification_lph_applied is below MIN_DEHUM_FRACTION of the sheet's required_dehumidification_lph"
  - id: ERR_CONDENSATION_RISK_TOO_HIGH
    http: 422
    condition: "condensation_risk_score is at or above CONDENSATION_BLOCK_THRESHOLD (40.00) when the ice is asked to be covered, directly or by the sign-off cascade"
  - id: ERR_ICE_EVENT_DEPENDENCY
    http: 409
    condition: "a melt-out is requested while an ice-requiring booking on the venue starts inside [now, now + ICE_BUILD_MINUTES]"
  - id: ERR_FLOOR_PROTECTION_SHORTFALL
    http: 422
    condition: "the floor dimension is advanced to LAYING with fewer ISSUED FLOOR_PANEL_SET units than the incoming configuration's panel requirement demands"
  - id: ERR_DOCK_WINDOW_CONFLICT
    http: 409
    condition: "the requested dock window collides with a RESERVED window on the same dock number under buffered half-open arithmetic"
  - id: ERR_CHANGEOVER_WINDOW_CONFLICT
    http: 409
    condition: "the derived turnaround window collides with another non-terminal ChangeoverOrder window on the same venue under unbuffered half-open arithmetic"
  - id: ERR_TURNAROUND_WINDOW_INSUFFICIENT
    http: 422
    condition: "window_minutes is strictly less than the freshly computed planned_turnaround_minutes"
  - id: ERR_BOOKING_TIME_CONFLICT
    http: 409
    condition: "a confirm would put two CONFIRMED bookings on the same venue in half-open overlapping event intervals"
  - id: ERR_HOLD_EXPIRED
    http: 409
    condition: "confirm is attempted strictly after hold_expires_at"
  - id: ERR_CREW_CAP_EXCEEDED
    http: 422
    condition: "crew_headcount exceeds Venue.crew_headcount_cap"
  - id: ERR_DOCK_NUMBER_INVALID
    http: 422
    condition: "dock_number is below 1 or above the venue's dock_count"
  - id: ERR_ORDER_BOOKING_SEQUENCE_INVALID
    http: 422
    condition: "to_booking.event_start_utc is not strictly after from_booking.event_end_utc"
  - id: ERR_EQUIPMENT_UNITS_UNAVAILABLE
    http: 409
    condition: "units_issued exceeds the pool's units_available"
  - id: ERR_ANCHOR_HOLD_PROTECTED
    http: 409
    condition: "a challenge against a booking whose pinned hold_tier is TIER_1 is asked to be upheld"
  - id: ERR_HOLD_PRIORITY_INSUFFICIENT
    http: 409
    condition: "a challenge whose priority_delta is below 1 is asked to be upheld"
  - id: ERR_CHALLENGE_CREDITS_EXHAUSTED
    http: 409
    condition: "the challenging tenant has challenge_credits of 0"
  - id: ERR_CHANGEOVER_DEBT_FREEZE
    http: 409
    condition: "a new turnaround is opened while Venue.changeover_debt_minutes is at or above CHANGEOVER_DEBT_FREEZE_MINUTES (180)"
  - id: ERR_VENUE_SCOPE_MISMATCH
    http: 409
    condition: "a referenced configuration profile, tenant, asset, or peer booking belongs to a different venue than the operation's venue"
  - id: ERR_DUPLICATE_CHALLENGE
    http: 409
    condition: "the same tenant already has an OPEN challenge against the same booking"
  - id: ERR_RIGGING_CAPACITY_EXCEEDED
    http: 422
    condition: "the aggregate closed-interval rigging load of overlapping CONFIRMED bookings plus this booking's load exceeds Venue.rigging_capacity_kg"
  - id: ERR_TENANT_HOLD_QUOTA_EXCEEDED
    http: 422
    condition: "the tenant's holds_consumed already equals or exceeds guaranteed_holds_per_season"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: VenueOperationsDirector
    description: "Owns the physical arena: venue registration, configuration profiles, anchor-tenant contracts, equipment pools and their maintenance, the logical clock, and the sign-off that closes a turnaround. Deliberately excluded from opening turnarounds so that sign-off is always a second pair of eyes."
    identity: opaque
    exclusive_operations:
      - "POST /venues"
      - "POST /venues/{id}/configuration-profiles"
      - "POST /venues/{id}/anchor-tenants"
      - "POST /venues/{id}/equipment-assets"
      - "POST /equipment-assets/{id}/maintenance"
      - "POST /changeover-orders/{id}/signoff"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: BookingManager
    description: "Owns the event calendar and conflict resolution: creating, holding, confirming and releasing bookings, sweeping expired holds, and ruling on anchor-tenant hold challenges. May never touch floor execution or sign a turnaround off."
    identity: opaque
    exclusive_operations:
      - "POST /event-bookings/{id}/confirm"
      - "POST /event-bookings/{id}/release"
      - "POST /venues/{id}/hold-expiry-sweep"
      - "POST /hold-challenges/{id}/rule"
    shared_operations:
      - "POST /event-bookings"
      - "POST /event-bookings/{id}/hold"
      - "all GET endpoints"

  - name: ChangeoverSupervisor
    description: "Owns floor execution: ice installation and the covering cycle, opening turnarounds, advancing and reworking the three stage dimensions, dock windows and equipment issues. Structurally barred from signing off the turnarounds it opens."
    identity: opaque
    exclusive_operations:
      - "POST /venues/{id}/ice-sheets"
      - "POST /ice-sheets/{id}/transition"
      - "POST /changeover-orders"
      - "POST /changeover-orders/{id}/progress"
      - "POST /changeover-orders/{id}/rework"
      - "POST /equipment-issues"
      - "POST /equipment-issues/{id}/return"
    shared_operations:
      - "POST /event-bookings/{id}/dock-slot-reservations"
      - "POST /dock-slot-reservations/{id}/cancel"
      - "all GET endpoints"

  - name: LaborCoordinator
    description: "Owns stagehand labor calls and their money: issuing, closing and cancelling calls, and the dock windows those calls work. Separated from both booking commitment and floor sign-off so that the party reporting hours is never the party approving the turnaround."
    identity: opaque
    exclusive_operations:
      - "POST /labor-calls"
      - "POST /labor-calls/{id}/close"
      - "POST /labor-calls/{id}/cancel"
    shared_operations:
      - "POST /event-bookings/{id}/dock-slot-reservations"
      - "POST /dock-slot-reservations/{id}/cancel"
      - "all GET endpoints"

  - name: AnchorTenantRep
    description: "Acts for exactly one AnchorTenant: drafts and holds its own bookings, spends its challenge credits against incumbent holds, and withdraws those challenges. X-User-ID is the AnchorTenant.id it acts for."
    identity: "entity_backed:AnchorTenant"
    exclusive_operations:
      - "POST /hold-challenges"
      - "POST /hold-challenges/{id}/withdraw"
    shared_operations:
      - "POST /event-bookings"
      - "POST /event-bookings/{id}/hold"
      - "all GET endpoints"
