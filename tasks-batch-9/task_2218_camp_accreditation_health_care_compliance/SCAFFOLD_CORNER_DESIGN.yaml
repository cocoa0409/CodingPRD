            - "call 1: 403 ERR_SEGREGATION_OF_DUTIES - officer-1 pressed schedule and is therefore barred from the decision"
            - "call 1 leaves AccreditationCycle.${cycle_id}.status == VISIT_COMPLETED with decision_level, decision_issued_at and decision_issued_by_user_id all still null"
            - "call 2: 200 - officer-3 never touched this cycle, so the decision lands: cycle.status == CLOSED, final_mandatory_pct == 100.00, final_weighted_pct == 100.00, decision_level == ACCREDITED, decision_issued_by_user_id == officer-3"
            - "Camp.${camp_id}.accreditation_status == ACCREDITED and zero Deficiency rows exist"
            - "officer-2 registering the camp, opening the cycle and creating the visit row is no bar at all - had officer-2 issued the decision it would have been accepted, because priority 18 compares only against visit.scheduled_by_user_id"

  - section: cross_cutting_complexity_layers
    instances:
      - name: all_three_declared_occ_writes_refuse_a_stale_parent_view_and_accept_the_refreshed_one
        claim_type: Optimistic Concurrency
        grounds:
          - concurrency_rules[cycle-create-stale-camp]
          - concurrency_rules[written-plan-create-stale-camp]
          - concurrency_rules[visit-create-stale-cycle]
