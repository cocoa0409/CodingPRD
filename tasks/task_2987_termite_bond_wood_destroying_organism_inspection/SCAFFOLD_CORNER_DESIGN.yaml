          assert:
            - "the first service, attempted at the same instant the plan completed, returns 422 ERR_SERVICE_TIME_INVALID — last_serviced_at was seeded to the completion instant and the comparison is strictly after"
            - "the same call at 2026-08-05T09:00:00Z returns 201 and sets last_serviced_at to that instant"
            - "the term-review at 2027-09-06 lapses the bond with lapse_date 2027-09-05 (current_term_end 2027-08-06 plus 30 grace days), not the review date"
            - "reinstatement with amount_usd 0.01 returns 402 ERR_REINSTATEMENT_PAYMENT_INSUFFICIENT — a 402, distinct from the renewal underpayment code"
            - "at 2027-10-15, 35 days after graph_completed_at, the same reinstatement returns 422 ERR_REINSTATEMENT_INSPECTION_STALE while the 90-day window is still open"
            - "at 2027-12-05, one day past lapse_date + 90, the reinstatement returns 409 ERR_REINSTATEMENT_WINDOW_EXPIRED — priority 115 outranks the still-true staleness at 116"
            - "the term-review at 2027-12-05 terminates the bond and cascades every INSTALLED station to REMOVED"
            - "a service on the now-REMOVED station returns 409 ERR_INVALID_STATION_STATE, and a further reinstatement returns 409 ERR_INVALID_BOND_STATE because TERMINATED is terminal"

      - name: fumigation_permit_window_bounds_the_application_and_the_reentry_bounds_completion
