      - name: line_review_cancel_releases_committed_slot_and_reverts_plan
        claim_type: Side Effect Execution
        grounds:
          - state_machines.LineReview.DECIDED_to_CANCELLED
          - state_machines.PlanogramSlot.COMMITTED_to_RELEASED
