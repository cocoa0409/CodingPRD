  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: grant_state_beats_authority_fiscal_cap
        grounds:
          - validations[priority=40]
          - validations[priority=70]
          - errors[ERR_GRANT_INVALID_STATE]
          - errors[ERR_AUTHORITY_CAP_EXCEEDED]
          - state_machines.Grant.PENDING_APPROVAL_to_APPROVED
          - entities.ApprovalAuthority.fields.remaining_shares
        distinguishing_aspect: |
          The conflicting pair is state (priority 40) against business_fiscal (priority 70):
          an already-APPROVED grant is re-approved on the DELEGATED path through an
          authority whose remaining_shares (1000) cannot cover the grant's 15000 weighted
          shares, and the response must be ERR_GRANT_INVALID_STATE, never
          ERR_AUTHORITY_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-09T11:00:00Z; EquityPlan 'Plan I Priority' ACTIVE with 1000000 authorized shares, 200000000 common shares outstanding, burn_rate_limit_bps 500, fungible_ratio_full_value_bps 15000, low_reserve_threshold_bps 0."
            - "ApprovalAuthority DELEGATED_OFFICER for delegate_user_id officer-1, ACTIVE, effective 2026-01-01..2026-12-31, per_grant_share_cap 100000 (satisfied) but aggregate_share_cap only 1000 (violated by the grant's 15000 weighted shares)."
            - "Participant 'Ivy Cap' ACTIVE, NON_INSIDER (so the DELEGATED path is not blocked by the Section 16 rule)."
            - "One RSU Grant of 10000 target shares with a single TIME tranche of 10000 shares, already APPROVED on the BOARD path by board-1, so weighted_reserve_shares == 15000 and the grant is no longer in PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-09T11:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan I Priority", total_authorized_shares: 1000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /approval-authorities"
              payload: { plan_id: "${plan_id}", authority_type: "DELEGATED_OFFICER", delegate_user_id: "officer-1", per_grant_share_cap: 100000, aggregate_share_cap: 1000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: BoardMember
              as_user_id: "board-1"
              captures: { auth_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Ivy Cap", employee_number: "E-2882-09", home_country_code: "US", home_state_code: "CO", hire_date: "2020-11-02", birth_date: "1991-05-05" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU", target_shares: 10000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2027-02-09", target_shares: 10000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/approve"
              payload: { approval_path: "BOARD" }
              as: BoardMember
              as_user_id: "board-1"
          trigger:
            - call: "POST /grants/${g_id}/approve"
              payload: { approval_path: "DELEGATED", authority_id: "${auth_id}" }
              as: DelegatedOfficer
              as_user_id: "officer-1"
              captures: { conflict_error: $.data.error_id }
          assert:
            - "${conflict_error} == ERR_GRANT_INVALID_STATE with HTTP 409"
            - "${conflict_error} != ERR_AUTHORITY_CAP_EXCEEDED"
            - "Grant.${g_id}.status == APPROVED"
            - "Grant.${g_id}.approval_path == BOARD"
            - "Grant.${g_id}.approved_under_authority_id is null"
            - "Grant.${g_id}.approved_by_user_id == board-1"
            - "ApprovalAuthority.${auth_id}.consumed_shares == 0"
            - "ApprovalAuthority.${auth_id}.remaining_shares == 1000"
            - "ApprovalAuthority.${auth_id}.status == ACTIVE"
            - "EquityPlan.${plan_id}.shares_committed_cumulative == 15000"

      - name: window_safety_beats_trade_date_temporal
        grounds:
          - validations[priority=52]
          - validations[priority=62]
          - errors[ERR_TRADING_WINDOW_CLOSED]
          - errors[ERR_TRADE_DATE_OUTSIDE_WINDOW]
          - state_machines.TradingWindow.OPEN_to_SUSPENDED
          - entities.PreclearanceRequest.fields.intended_trade_date
        distinguishing_aspect: |
          A different error-category pair from the state/business_fiscal instance above:
          business_safety (priority 52) against business_temporal (priority 62). The window
          is SUSPENDED and the intended_trade_date 2026-05-15 also falls outside the
          window's [2026-01-05, 2026-03-31] span, so the response must be
          ERR_TRADING_WINDOW_CLOSED, never ERR_TRADE_DATE_OUTSIDE_WINDOW.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-06T10:00:00Z; EquityPlan 'Plan J Window' ACTIVE."
            - "TradingWindow FY2026-Q1 over [2026-01-05T00:00:00Z, 2026-03-31T00:00:00Z), opened and then SUSPENDED with suspension_reason MATERIAL_NEWS_PENDING."
            - "Participant 'Jon Blackout' ACTIVE with insider_status DESIGNATED_INSIDER."
            - "No PreclearanceRequest rows exist yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-06T10:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan J Window", total_authorized_shares: 1000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Jon Blackout", employee_number: "E-2882-10", home_country_code: "US", home_state_code: "NJ", hire_date: "2015-02-16", birth_date: "1977-09-08", insider_status: "DESIGNATED_INSIDER" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w1_id: $.data.id }
            - call: "POST /trading-windows/${w1_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /trading-windows/${w1_id}/status"
              payload: { action: "SUSPEND", suspension_reason: "MATERIAL_NEWS_PENDING" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /preclearance-requests"
              payload: { participant_id: "${p_id}", window_id: "${w1_id}", transaction_type: "SELL", requested_shares: 250, intended_trade_date: "2026-05-15" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { conflict_error: $.data.error_id }
          assert:
            - "${conflict_error} == ERR_TRADING_WINDOW_CLOSED with HTTP 409"
            - "${conflict_error} != ERR_TRADE_DATE_OUTSIDE_WINDOW"
            - "TradingWindow.${w1_id}.status == SUSPENDED"
            - "TradingWindow.${w1_id}.approved_shares_cumulative == 0"
            - "GET /preclearance-requests?window_id=${w1_id} returns total_count == 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: burn_rate_exactly_at_limit_allowed
        grounds:
