              as_user_id: "${cons_id}"
            - call: "GET /sleep-consulting/cases/${case_id}"
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { case_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/plans"
              payload: { method: "GENTLE_NO_CRY", target_night_wake_count: 2, target_longest_stretch_minutes: 240, expected_case_version: "${case_v}" }
              as: Consultant
              as_user_id: "${cons_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /sleep-consulting/cases/${case_id}/packages"
              payload: { tier: "BASIC", kind: "INITIAL", starts_on: "2026-08-01" }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { pkg_id: $.data.id, pkg_v: $.data.version }
            - call: "POST /sleep-consulting/cases/${case_id}/troubleshooting-sessions"
              payload: { session_type: "TRAVEL", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", expected_package_version: "${pkg_v}" }
              as: Parent
