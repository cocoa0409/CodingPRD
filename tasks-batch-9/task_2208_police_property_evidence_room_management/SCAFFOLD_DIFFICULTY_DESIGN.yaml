              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_1_id: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Interview notes packet 2", category: "GENERAL", packaging_type: "SEALED_ENVELOPE", appraised_value_cents: 100, seized_at: "2026-07-31T22:10:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_2_id: $.data.id }
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Seized revolver", category: "FIREARM", packaging_type: "RIGID_BOX", appraised_value_cents: 60000, seized_at: "2026-07-31T22:20:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_3_id: $.data.id }
            - call: "POST /evidence-items/${item_1_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items/${item_2_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /evidence-items/${item_3_id}/storage-assignment"
              payload: { storage_location_id: "${loc_v_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_1_id}", to_custodian_id: "${inv_id}", purpose: "INVESTIGATIVE_REVIEW", released_at: "2026-09-10T00:00:00Z", due_back_at: "2026-09-15T00:00:00Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { transfer_1_id: $.data.id }
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_2_id}", to_custodian_id: "${inv_id}", purpose: "INVESTIGATIVE_REVIEW", released_at: "2026-09-12T00:00:00Z", due_back_at: "2026-09-16T00:00:00Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { transfer_2_id: $.data.id }
          trigger:
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_3_id}", to_custodian_id: "${inv_id}", purpose: "INVESTIGATIVE_REVIEW", released_at: "2026-09-15T00:00:00Z", due_back_at: "2026-09-18T00:00:00Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_3_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-09-15T00:00:00Z", due_back_at: "2026-09-18T00:00:00Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "The third transfer to I-300 returns HTTP 409 with ${err_id} == 'ERR_ESCORT_CAPACITY_EXCEEDED'"
            - "The load counted 2: ${transfer_1_id} because its due_back_at 2026-09-15T00:00:00Z touches the candidate's released_at, and ${transfer_2_id} because its window strictly overlaps"
            - "Custodian.${inv_id}.open_escort_count == 2 (unchanged by the rejection)"
            - "The identical window assigned to a custodian with no open escorts succeeds: ${ok_status} == 'REQUESTED' and Custodian.${lab_id}.open_escort_count == 1"
            - "GET /custody-transfers?to_custodian_id=${inv_id} returns total_count == 2"

      - name: audit_window_48h_buffer_on_location
        grounds:
          - "calculations.audit_window_buffer_conflict"
          - "validations[priority=22]"
          - "errors[ERR_AUDIT_WINDOW_BUFFER]"
          - "concurrency_rules[audit-session-create-stale-location]"
        distinguishing_aspect: |
          BUFFERED interval semantics on the STORAGELOCATION resource: each existing window is inflated
          by 48 hours on both sides, so a session starting at exactly 2026-08-12T17:00:00Z (the prior
          end 2026-08-10T17:00:00Z plus the buffer) is rejected while one starting a millisecond later
          is accepted — a plain non-buffered overlap test would accept both.
        test_recipe:
          setup:
            - "An existing SCHEDULED audit session on R-01 covering 2026-08-08T17:00:00Z to 2026-08-10T17:00:00Z."
            - "The location's current version is re-read before each new scheduling call because every session creation bumps it."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
