      - name: blocking_conflict_cascades_three_levels_from_conflict_counters_to_member_intake_hold
        grounds:
          - state_machines.DraftingRequest.DRAFTING_to_RETURNED_FOR_CLARIFICATION
          - state_machines.StatutoryConflict.null_to_OPEN
          - calculations.member_priority_slot_ledger
          - entities.Member.fields.clarification_pending_count
          - entities.Member.fields.intake_hold
          - entities.Drafter.fields.active_engagement_count
        distinguishing_aspect: |
          Depth 3 from a DIFFERENT triggering transition — StatutoryConflict null ->
          OPEN via POST /statutory-conflicts, not an amendment adoption — and the
          chain runs through a different set of entities: L1 bumps the request's own
          conflict counters; L2 fires only BECAUSE the status left DRAFTING, nulling
          sla_due_utc, releasing the drafter's occupancy slot and incrementing
          Member.clarification_pending_count; L3 fires only BECAUSE that count
          reached the threshold of 2, latching Member.intake_hold to true.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; CONVENED session; one member, one non-senior drafter with max_concurrent_engagements 2, one senior review counsel."
            - "Two drafting requests from the SAME member, both assigned to the same drafter with overlapping engagement windows (allowed at capacity 2) and both advanced to DRAFTING."
            - "Request A already bounced to RETURNED_FOR_CLARIFICATION by its own BLOCKING conflict, so Member.clarification_pending_count is 1 and intake_hold is still false."
            - "Request B is in DRAFTING with actual_complexity_score 12 (4 * 3 affected sections, no conflicts, PUBLIC, non-priority) and a non-null sla_due_utc."
