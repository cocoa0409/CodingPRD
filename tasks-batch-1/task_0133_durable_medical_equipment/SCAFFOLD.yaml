    input: ["order_id?", "status?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []
  - method: POST
    path: "/audits/{id}/uphold"
    description: "Uphold an audit; runs the recoupment cascade over the order's BILLED/PAID cycles"
    roles: [PayerReviewer]
    code: 200
    input: []
    output: Audit
    side_effects:
      - "Recoupment cascade L1->L2->L3 (see state_machines Audit OPEN->UPHELD)"
      - "Set recouped_total_cents and recouped_cycle_count; recompute order.total_allowed_cents"
  - method: POST
    path: "/audits/{id}/dismiss"
    description: "Dismiss an audit with no ledger effect"
    roles: [PayerReviewer]
    code: 200
    input: []
    output: Audit
    side_effects: ["status -> DISMISSED"]

  # ---- Test-driving (clock) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the deterministic system clock (drives resupply timing, prior-auth expiry, delivery/resupply stamps)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: string }"
    side_effects: ["server clock now == to_iso8601"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, or out-of-range value" }
  - { id: ERR_DUPLICATE_VALUE, http: 409, condition: "Unique field (medicare_id / ptan / hcpcs_code) already exists" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in the required state for this transition" }
  - { id: ERR_ACQUISITION_TYPE_MISMATCH, http: 422, condition: "acquisition_type incompatible with item billing_category" }
  - { id: ERR_CMN_REQUIRED, http: 422, condition: "mark-ready on a CMN-required item with no ACTIVE CMN" }
  - { id: ERR_PRIOR_AUTH_REQUIRED, http: 422, condition: "mark-ready on a prior-auth-required item with no APPROVED+unexpired PriorAuthorization" }
  - { id: ERR_SUPPLIER_NOT_ACCREDITED, http: 422, condition: "mark-ready when fulfilling supplier is not accredited" }
  - { id: ERR_NO_PROOF_OF_DELIVERY, http: 422, condition: "activate-billing with no CONFIRMED delivery carrying pod_received==true" }
  - { id: ERR_POD_SIGNATURE_REQUIRED, http: 422, condition: "confirm delivery with empty pod_signature_name" }
  - { id: ERR_CMN_SIGNED_AFTER_ORDER, http: 422, condition: "CMN signed_date is after the order's ordered_at_utc date on activate" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match DMEOrder.version on CMN activate (OCC)" }
  - { id: ERR_RENTAL_CAP_REACHED, http: 422, condition: "rental cycle posted on a CAPPED_RENTAL order whose cap_reached==true" }
  - { id: ERR_CYCLE_OVERLAP, http: 422, condition: "new rental cycle period overlaps an existing cycle on the order" }
  - { id: ERR_RESUPPLY_TOO_SOON, http: 422, condition: "CPAP resupply ship within RESUPPLY_WINDOW_DAYS of the prior shipped resupply of the same supply_kind" }
  - { id: ERR_NOT_A_CPAP_ORDER, http: 422, condition: "CPAP resupply created against a non-CPAP order" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator that manages reference data (patients, suppliers, catalog) and the deterministic clock."
    identity: opaque
    exclusive_operations:
      - "POST /patients, POST /suppliers, PATCH /suppliers/{id}"
      - "POST /hcpcs-items"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on patients/suppliers/hcpcs-items/dme-orders"

  - name: SupplierUser
    description: "DME supplier staff that own orders, deliveries, rental cycles, CPAP resupplies."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /dme-orders and all /dme-orders/{id}/* order-lifecycle transitions (mark-ready, activate-billing, rental-cycles, close, cancel)"
      - "POST /deliveries and /deliveries/{id}/{confirm,fail,cancel}"
      - "POST /prior-authorizations (open)"
      - "POST /cpap-resupply-orders and /cpap-resupply-orders/{id}/{ship,deny}"
    shared_operations:
      - "GET reads on orders/cmns/deliveries/cycles/claim-lines/audits/prior-authorizations/resupply"

  - name: PhysicianUser
    description: "Certifying physician that authors and activates CMNs."
    identity: opaque
    exclusive_operations:
      - "POST /cmns, POST /cmns/{id}/activate, POST /cmns/{id}/revoke"
    shared_operations:
      - "GET /cmns, GET /cmns/{id}"

  - name: PayerReviewer
    description: "Payer-side reviewer that decides prior auths, pays cycles, and runs audits/recoupment."
    identity: opaque
    exclusive_operations:
      - "POST /prior-authorizations/{id}/{approve,deny}"
      - "POST /rental-cycles/{id}/mark-paid"
      - "POST /audits and /audits/{id}/{uphold,dismiss}"
    shared_operations:
      - "GET reads on orders/deliveries/cycles/claim-lines/audits/prior-authorizations/resupply; GET /dme-orders/{id}/rental-quote"
