              as: SponsorOperator
              captures: { off_b_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_a_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_a_i_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Ironvale Placement", crd_number: "CRD-340001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /investors"
              payload: { legal_name: "Ida Brekke", email: "ida.brekke@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /offerings/${off_a_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_a_id}", period_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", request_cutoff_at: "2026-08-10T00:00:00Z", settlement_date: "2026-08-12" }
              as: TransferAgent
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /investors"
              payload: { legal_name: "Ida Brekke-Solheim", email: "ida.brekke@example.com", state_code: "NY", net_worth_cents: 900000000, annual_income_cents: 200000000 }
              as: TransferAgent
              captures: { dup_email_error: $.error.error_id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Quite Different Securities", crd_number: "CRD-340001" }
              as: ComplianceOfficer
              captures: { dup_crd_error: $.error.error_id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_a_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { dup_class_error: $.error.error_id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_b_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sibling_class_id: $.data.id, sibling_class_code: $.data.class_code }
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_a_id}", period_month: "2026-08", opens_at: "2026-08-20T00:00:00Z", request_cutoff_at: "2026-08-25T00:00:00Z", settlement_date: "2026-08-27" }
              as: TransferAgent
              captures: { dup_month_error: $.error.error_id }
          assert:
            - "dup_email_error == \"ERR_DUPLICATE_INVESTOR_EMAIL\" with response http status == 422"
            - "dup_crd_error == \"ERR_DUPLICATE_CRD_NUMBER\" with response http status == 422"
            - "dup_class_error == \"ERR_DUPLICATE_SHARE_CLASS_CODE\" with response http status == 422"
            - "sibling_class_code == \"I\" with response http status == 201 (class_code is unique per offering, not globally)"
            - "dup_month_error == \"ERR_DUPLICATE_REPURCHASE_PERIOD\" with response http status == 422 (the 2026-08-20 window neither overlaps the 2026-08-01..2026-08-10 sibling nor breaches the 5-day buffer after its 2026-08-12 settlement, so the priority-9 window rule cannot pre-empt the priority-11 duplicate rule)"
