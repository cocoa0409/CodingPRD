errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_USER_NOT_FOUND, http: 404, condition: "userId not found" }
  - { id: ERR_EXPERIENCE_NOT_FOUND, http: 404, condition: "experienceId not found" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "itemId not found" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "listingId not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId not found" }
  - { id: ERR_SUBMISSION_NOT_FOUND, http: 404, condition: "submissionId not found" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appealId not found" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "reportId not found" }
  - { id: ERR_TERMINATION_NOT_FOUND, http: 404, condition: "terminationId not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity in wrong state for transition" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed payload" }
  - { id: ERR_AGE_BAND_INSUFFICIENT, http: 403, condition: "Viewer's age_band does not satisfy experience.age_rating" }
  - { id: ERR_PARENTAL_SPEND_LIMIT, http: 403, condition: "Purchase would reach or exceed parental monthly spend limit" }
  - { id: ERR_PARENTAL_CHAT_RESTRICTED, http: 403, condition: "Parental controls chat_mode == RESTRICTED forbids free-text chat" }
  - { id: ERR_CREATOR_AGE_INSUFFICIENT_FOR_RATING, http: 403, condition: "A CHILD creator cannot publish an experience rated SEVENTEEN_PLUS" }
  - { id: ERR_RESALE_FLOOR_VIOLATION, http: 422, condition: "ask_price_robux below floor(item.price_robux * 0.5)" }
  - { id: ERR_LIMITED_SUPPLY_EXHAUSTED, http: 422, condition: "Limited item copies_sold would exceed total_supply" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same user cannot perform two conflicting steps (approve vs pay, review vs appeal-review, initiate-termination on self)" }
  - { id: ERR_DUPLICATE_IDEMPOTENCY_KEY, http: 409, condition: "Idempotency key already used for a different request payload" }
  - { id: ERR_EXPERIENCE_NOT_PUBLISHED, http: 409, condition: "Join or gamepass purchase attempted on a non-PUBLISHED experience" }
  - { id: ERR_ITEM_NOT_ON_SALE, http: 409, condition: "Purchase attempted on a non-ON_SALE item" }
  - { id: ERR_SUBMISSION_NOT_REJECTED, http: 409, condition: "Appeal filed against a submission that is not REJECTED" }
  - { id: ERR_INSUFFICIENT_ROBUX, http: 402, condition: "Buyer's robux_balance below the price" }
  - { id: ERR_DEVEX_NOT_ELIGIBLE, http: 403, condition: "User fails one or more DevEx eligibility clauses" }
  - { id: ERR_DEVEX_MINIMUM_NOT_MET, http: 422, condition: "requested_robux < 30000" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the current entity version (OCC)" }
  - { id: ERR_REFUND_EXCEEDS_BALANCE, http: 409, condition: "Refund of a currency purchase would drive robux_balance negative because Robux were already spent" }

roles:
  - name: Anonymous
    description: "Unauthenticated caller; can register and read public resources"
    identity: opaque
    exclusive_operations: ["register user"]
    shared_operations: ["read public experiences and items"]

  - name: Creator
    description: "Authenticated user acting on their own resources (identity-backed by User)"
    identity: entity_backed:User
    exclusive_operations: ["create experience", "submit experience for review", "create marketplace item", "submit marketplace item", "create resale listing", "create purchase order", "confirm purchase order", "create currency purchase order", "confirm currency payment", "submit identity verification", "submit tax document", "submit devex request", "cancel own devex request", "send chat message", "report chat message", "file moderation appeal", "withdraw own appeal", "set parental controls (when acting as the parent User)", "republish own experience", "archive own experience", "take own item off sale", "put own item on sale", "cancel own resale listing"]
    shared_operations: ["read own resources", "read public resources"]

  - name: Moderator
    description: "First-line human content moderator"
    identity: opaque
    exclusive_operations: ["decide moderation submission (APPROVE | REJECT | ESCALATE)"]
    shared_operations: ["read submissions", "read experiences", "read items", "read chat messages"]

  - name: AppealsReviewer
    description: "Second-line reviewer for moderation appeals; MUST differ from the original Moderator on a given submission (segregation of duties)"
    identity: opaque
    exclusive_operations: ["start appeal review", "decide appeal (UPHELD | OVERTURNED)"]
    shared_operations: ["read submissions", "read appeals"]

  - name: SafetyAgent
    description: "Trust-and-safety operator; handles chat reports and escalations"
    identity: opaque
    exclusive_operations: ["triage report", "action report", "dismiss report", "suspend user (safety path)"]
    shared_operations: ["read reports", "read users", "read chat messages"]

  - name: FinanceOfficer
    description: "Finance operator; handles DevEx approval and payment"
    identity: opaque
    exclusive_operations: ["approve devex request", "reject devex request", "mark devex request paid"]
    shared_operations: ["read devex requests", "read tax documents", "read currency purchase orders", "read purchase orders"]

  - name: PlatformAdmin
    description: "Privileged operator"
    identity: opaque
    exclusive_operations: ["set logical clock", "verify identity", "reject identity", "accept tax document", "reject tax document", "refund currency purchase order", "refund purchase order", "reinstate user", "initiate account termination", "dispose earnings", "post engagement snapshot", "settle monthly engagement", "inject moderation score"]
    shared_operations: ["all read operations", "suspend user", "suspend experience", "fail currency payment"]
