ng on the void-delivery endpoint is 'Allocation is non-terminal' (so PLANNED or DELIVERED states are valid sources of the void edge), and the priority-25-or-equivalent body-schema-sanity rule requires a non-empty reason string per the §1.6 ERR_MISSING_VOID_REASON catalog entry."
