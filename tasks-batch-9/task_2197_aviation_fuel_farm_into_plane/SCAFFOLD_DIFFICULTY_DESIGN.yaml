  - rule_id: compensating_invariant
    instances:
      - name: fuel_volume_conservation_across_uplift_then_abort
        grounds:
          - state_machines.FuelingOrder.FUELING_to_ABORTED
          - calculations.tank_book_inventory
          - entities.FuelingAsset.fields.onboard_volume_liters
          - entities.UpliftRecord.fields.voided_reason
        invariant: "StorageTank.book_volume_liters + FuelingAsset.onboard_volume_liters is conserved at 1000000.00 liters across the post-uplift / abort round trip"
        distinguishing_aspect: |
          Posting the ticket moves 20000.00 liters out of the tank ledger and onto the truck, so book falls to
          980000.00 while onboard rises to 20000.00 and the sum stays 1000000.00. The abort is the compensating
          action: the ticket becomes VOIDED with voided_reason ORDER_ABORTED, book returns to exactly
          1000000.00 and onboard recomputes to 0.0 — the fuel is credited exactly once, not twice, which is
          what makes double-crediting (book 1020000.00) detectable.
        test_recipe:
          setup:
