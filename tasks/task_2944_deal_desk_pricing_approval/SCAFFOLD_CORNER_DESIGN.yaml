  - section: validations
    instances:
      - name: submit_with_extended_payment_terms_and_no_matching_term_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.P14_structural_submit_gates
          - errors.ERR_NONSTANDARD_TERM_REQUIRED
          - calculations.C6_nonstandard_term_risk
        distinguishing_aspect: |
          The submit gate is conditional on the quote's own payment_terms_days: a 60-day quote with no
          PAYMENT_TERMS NonStandardTerm is rejected with ERR_NONSTANDARD_TERM_REQUIRED (422) and stays
          DRAFT, and the identical submit succeeds once the term is filed — its C6 contribution 5.00 is
          below the 30.0 review threshold, so the term auto-approves with reviewer_note
          AUTO_APPROVED_BELOW_RISK_THRESHOLD instead of routing to LegalCounsel.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; standard_payment_terms_days is 30 and terms_review_risk_threshold is 30.0."
            - "One DRAFT quote with payment_terms_days 60 and a single Premium Support line of quantity 10 at requested_discount_pct 0 (blended 0.000000, required_approval_level 0), and no NonStandardTerm."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
            - *cb_core
            - *cb_sup
            - *cb_svc
            - *cb_usg
            - *cb_vt1
            - *cb_vt2
            - *cb_vt3
            - *cb_bundle
            - *cb_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Net 60", term_months: 12, payment_terms_days: 60 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /nonstandard-terms"
              payload: { quote_id: "${q_id}", term_category: "PAYMENT_TERMS", requested_numeric_value: 60 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { term_id: $.data.id, term_sev: $.data.severity_factor, term_contrib: $.data.risk_contribution, term_state: $.data.review_state, term_cosign: $.data.requires_cfo_cosign }
