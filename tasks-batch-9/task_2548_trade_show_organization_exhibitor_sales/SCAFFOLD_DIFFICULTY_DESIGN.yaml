  - rule_id: priority_pair_validation_conflict
    instances:

      - name: sign_on_onsite_show_reports_show_status_not_deposit_shortfall
        grounds:
          - validations[priority=21]
          - validations[priority=62]
          - errors[ERR_INVALID_SHOW_STATUS]
          - errors[ERR_DEPOSIT_BELOW_MINIMUM]
