      - name: exempt_activation_and_appeal_ceiling_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_46_ERR_ENTITY_EXEMPT
          - validations.priority_42_ERR_APPEAL_LIMIT_REACHED
          - state_machines.Registration.DETERMINED_to_UNDER_APPEAL
          - entities.Registration.fields.appeal_count
        distinguishing_aspect: |
          The two guards on the appeal cycle, on a firm whose FIVE_YEAR_AVERAGE
          measurement is 122000 head against the 125000 CATTLE floor: an EXEMPT
          determination can never be activated, and the DETERMINED -> UNDER_APPEAL
          -> DETERMINED loop is bounded at APPEAL_LIMIT 2, so the third appeal is
          refused while appeal_count stays 2.
