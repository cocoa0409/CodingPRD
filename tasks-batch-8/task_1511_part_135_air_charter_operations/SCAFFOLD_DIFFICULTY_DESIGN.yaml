            - "TripRequest.${trip_b72}.refund_cents == 1846800"

      - name: check_hours_equality_dispatch_allowed
        grounds:
          - calculations.check_hours_projection
          - state_machines.TripRequest.BOOKED_to_DISPATCHED
        distinguishing_aspect: |
