              as: TransientGuest
              captures: { transient_full_error_id: "$.data.error_id" }
            - call: "POST /transient-reservations"
              payload: { park_id: "${park_cf_id}", guest_name: "Owen Deleon", arrival_date: "2026-08-12", scheduled_departure_date: "2026-08-14" }
