              as: FeedyardManager
              captures: { la: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-803", sex_class: "STEER", head_count_in: 4, in_weight_total_lbs: 2800, purchase_cost_cents: 560000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { lb: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-804", sex_class: "STEER", head_count_in: 1, in_weight_total_lbs: 700, purchase_cost_cents: 140000, arrival_date: "2026-08-01", commingle_allowed: true }
