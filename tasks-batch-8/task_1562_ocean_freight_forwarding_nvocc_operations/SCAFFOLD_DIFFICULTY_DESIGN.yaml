            - "one more full 24h period on either clock would have produced 15000 (demurrage tier 1) or 12000 (detention) cents"

      - name: consolidation_capacity_equality_allowed_then_exceeded
        grounds:
          - calculations.consolidation_utilization
          - validations[priority=12]
          - errors[ERR_CONSOLIDATION_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric: consolidation capacity in kg/cbm via POST .../stuff. Exact
          boundary: stuffing to used == max (10000 kg / 100.0 cbm) is ALLOWED
          (the comparison is <=); the next gram (0.5 kg / 0.5 cbm booking)
          rejects with ERR_CONSOLIDATION_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Consolidation max 10000 kg / 100.0 cbm; bookings L1 6000kg/60cbm and L2 4000kg/40cbm both CONFIRMED; L3 0.5kg/0.5cbm CONFIRMED"
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME CAP", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
            - { call: "POST /freight/tariffs/${t}/publish", payload: {}, as: ComplianceOfficer, as_user_id: "co_2" }
            - { call: "POST /freight/carrier-contracts", payload: { contract_number: "CARR-1", carrier_name: "MAERSK", service_lane: "CNSHA-USLAX", container_rates: [ { container_type: "40HC", rate_cents: 120000 } ], demurrage_free_days: 4, detention_free_days: 3, demurrage_tiers: [ { from_day: 1, to_day: 3, per_diem_cents: 15000 }, { from_day: 4, to_day: 7, per_diem_cents: 30000 }, { from_day: 8, to_day: null, per_diem_cents: 60000 } ], detention_per_diem_cents: 12000, service_start: "2026-01-01T00:00:00Z", service_end: "2026-12-31T00:00:00Z" }, as: OperationsManager, captures: { c: $.data.id } }
            - { call: "POST /freight/carrier-contracts/${c}/activate", payload: {}, as: OperationsManager }
            - { call: "POST /freight/voyages", payload: { vessel_name: "EVER GIVEN", voyage_number: "EG101", carrier_contract_id: "${c}", origin_port: "CNSHA", destination_port: "USLAX", etd: "2026-09-01T00:00:00Z", eta: "2026-09-21T00:00:00Z" }, as: OperationsManager, captures: { v: $.data.id } }
            - { call: "POST /freight/voyages/${v}/open-for-booking", payload: {}, as: OperationsManager }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 6000, volume_cbm: 60.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b1: $.data.id } }
            - { call: "POST /freight/bookings/${b1}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 4000, volume_cbm: 40.0, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b2: $.data.id } }
            - { call: "POST /freight/bookings/${b2}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/bookings", payload: { voyage_id: "${v}", tariff_id: "${t}", rate_source: "CONTRACT", mode: "LCL", commodity_type: "GENERAL", gross_weight_kg: 0.5, volume_cbm: 0.5, terms: "PREPAID" }, as: Shipper, as_user_id: "${s}", captures: { b3: $.data.id } }
            - { call: "POST /freight/bookings/${b3}/confirm", payload: {}, as: BookingCoordinator }
            - { call: "POST /freight/consolidations", payload: { voyage_id: "${v}", cfs_location: "CFS-LAX-01", container_type: "40HC", max_weight_kg: 10000, max_volume_cbm: 100.0, stuffing_window_start: "2026-08-10T00:00:00Z", stuffing_window_end: "2026-08-15T00:00:00Z" }, as: BookingCoordinator, captures: { con: $.data.id, con_v: $.data.version } }
          trigger:
            - { call: "POST /freight/consolidations/${con}/stuff", payload: { booking_id: "${b1}", expected_consolidation_version: "${con_v}" }, as: BookingCoordinator }
            - { call: "POST /freight/consolidations/${con}/stuff", payload: { booking_id: "${b2}", expected_consolidation_version: "${con_v} + 1" }, as: BookingCoordinator }
            - { call: "POST /freight/consolidations/${con}/stuff", payload: { booking_id: "${b3}", expected_consolidation_version: "${con_v} + 2" }, as: BookingCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /freight/consolidations/${con}", payload: {}, as: Any, captures: { uw: $.data.used_weight_kg, uv: $.data.used_volume_cbm } }
          assert:
            - "stuff L1 (6000kg) and L2 (4000kg) both succeed: used_weight_kg == 10000 and used_volume_cbm == 100.0 (equality allowed by the <= gate)"
            - "stuff L3 (0.5kg/0.5cbm) rejected: error_id == ERR_CONSOLIDATION_CAPACITY_EXCEEDED"
            - "Consolidation.${con}.used_weight_kg remains exactly 10000 after the rejection (no partial mutation)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: bl_release_blocked_by_unaccepted_ams_filing
        grounds:
          - state_machines.BillOfLading.ISSUED_to_RELEASED
