        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority 1: a request without X-User-ID / X-User-Role fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role, existence, or state checks — proven by hitting an endpoint whose other checks would otherwise fail differently."
        test_recipe:
          setup: ["One program exists (so a GET target exists)"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
          trigger:
            - { call: "GET /mobility/programs/${prog_id}", as: MobilityAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "When the test harness omits both X-User-* headers: err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), even though the resource exists and the role would be allowed"

