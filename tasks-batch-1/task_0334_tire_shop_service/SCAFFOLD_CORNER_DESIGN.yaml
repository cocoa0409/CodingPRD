              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: customer_cannot_create_tire_model
        claim_type: role_denied
        grounds: ["roles", "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /tire-models as Customer (an exclusive InventoryManager op) returns ERR_UNAUTHORIZED (403)."
