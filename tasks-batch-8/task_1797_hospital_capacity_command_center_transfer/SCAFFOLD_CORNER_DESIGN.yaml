              captures: { err: $.data.error_id }
            - call: "POST /cc/facilities/${fac}/capacity-forecasts"
              payload: { horizon_hours: 2 }
              as: HouseSupervisor
              captures: { err2: $.data.error_id }
          assert:
            - "publish by coordinator: HTTP 403 ERR_INSUFFICIENT_PERMISSIONS"
            - "create by supervisor: HTTP 403 ERR_INSUFFICIENT_PERMISSIONS"


  # ===========================================================================
  # 8. Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_assignment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transfer-assignment-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential requests: read the request version after ACCEPT (v), then a hold create advances it (cascade), then an assignment create carrying the pre-hold version fails 412 ERR_STALE_VERSION; carrying the fresh version succeeds."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician; bed; request ACCEPTED (version captured), then hold placed (version advanced by cascade)"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "OCC Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr OCC", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "POCC", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "EMERGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "GET /cc/transfer-requests/${tr}"
              as: Any
              captures: { tr_v_stale: $.data.version }
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-assignments"
              payload: { bed_hold_id: "${hold}", expected_transfer_request_version: "${tr_v_stale}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /cc/transfer-requests/${tr}"
              as: Any
              captures: { tr_v_fresh: $.data.version }
            - call: "POST /cc/transfer-requests/${tr}/bed-assignments"
              payload: { bed_hold_id: "${hold}", expected_transfer_request_version: "${tr_v_fresh}" }
              as: TransferCenterCoordinator
              captures: { asg: $.data.id }
          assert:
            - "stale attempt: HTTP 412 error_id == ERR_STALE_VERSION (hold create advanced the version after the client's read)"
            - "fresh attempt: 201 and BedAssignment.${asg}.status == PLACED"
            - "TransferRequest.${tr}.version == ${tr_v_fresh} + 1 after the successful assignment"

      - name: occ_hold_extend_stale_and_limit
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bed-hold-extend-stale-version]", "errors[ERR_STALE_VERSION]", "errors[ERR_HOLD_EXTEND_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Extend OCC: first extend with the creation version succeeds (v1->v2); replaying the same stale version fails 412; two successful extends succeed and the third hits ERR_HOLD_EXTEND_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician; bed; request ACCEPTED; hold created at 00:00 (expires 01:00, version captured)"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "OCC2 Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr O2", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "POX", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id, hold_v: $.data.version }
          trigger:
            - call: "POST /cc/bed-holds/${hold}/extend"
              payload: { expected_bed_hold_version: "${hold_v}" }
              as: TransferCenterCoordinator
              captures: { hold_v2: $.data.version }
            - call: "POST /cc/bed-holds/${hold}/extend"
              payload: { expected_bed_hold_version: "${hold_v}" }
              as: TransferCenterCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /cc/bed-holds/${hold}/extend"
              payload: { expected_bed_hold_version: "${hold_v2}" }
              as: TransferCenterCoordinator
              captures: { hold_v3: $.data.version }
            - call: "POST /cc/bed-holds/${hold}/extend"
              payload: { expected_bed_hold_version: "${hold_v3}" }
              as: TransferCenterCoordinator
              captures: { err3: $.data.error_id }
          assert:
            - "first extend: 200, expires_at == 2026-08-01T01:30:00Z, extend_count == 1, version == 2"
            - "replayed stale version: HTTP 412 ERR_STALE_VERSION"
            - "second extend with fresh version: 200, expires_at == 2026-08-01T02:00:00Z, extend_count == 2"
            - "third extend: HTTP 409 ERR_HOLD_EXTEND_LIMIT_EXCEEDED (cap 2)"

      - name: cascade_side_effects_verified_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Admission, state_machines.DiversionEvent]
        excluded_because:
          difficulty_instance: confirm_discharge_invalidates_forecast_chain
          rationale: "Depth-3 discharge chain and depth-2 diversion chain asserted end-to-end in the two §1.8 transitive_cascade instances."

      - name: rate_threshold_boarding_and_diversion
        claim_type: rate_threshold_triggers
        grounds: [calculations.boarding_escalation_check, calculations.transfer_load_score]
        excluded_because:
          difficulty_instance: boarding_huddle_at_exactly_120_minutes
          rationale: ">=120 huddle boundary and >=95.0 diversion recommendation asserted in §1.8 instances."

      - name: forecast_stale_only_on_published
        claim_type: derived_field_reconciliation
        grounds: [entities.CapacityForecast.fields.stale]
        distinguishing_aspect: "Derived-field reconciliation is scoped: a bed-availability mutation marks only the latest PUBLISHED forecast stale; PROVISIONAL forecasts are untouched."
        test_recipe:
          setup: ["Clock at 00:00; facility with 2 non-ED beds (b1 occupied by A1 pending signed 02:00, b2 available); one PUBLISHED forecast F1 and — after it — one PROVISIONAL forecast F2 (F1 SUPERSEDED by F2's creation? no: pin — F2 creation supersedes F1; instead create F2 AFTER the mutation and verify F2 never stale; assert F1 stale from the mutation)"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Stale Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B1", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "M-1", label: "B2", service: "MEDICAL", max_acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_capability: "NONE" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/admissions"
              payload: { bed_id: "${b1}", patient_ref: "PST", acuity: "ACUITY_3_MEDICAL_SURGICAL", isolation_need: "NONE", service: "MEDICAL" }
              as: BedManager
              captures: { adm: $.data.id }
            - call: "POST /cc/admissions/${adm}/pending-discharge"
              payload: { expected_discharge_at: "2026-08-01T02:00:00Z", discharge_order_signed: true }
              as: BedManager
            - call: "POST /cc/facilities/${fac}/capacity-forecasts"
              payload: { horizon_hours: 2 }
              as: CapacityPlanner
              captures: { fc1: $.data.id }
            - call: "POST /cc/capacity-forecasts/${fc1}/publish"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /cc/admissions/${adm}/rescind-pending-discharge"
              payload: {}
              as: BedManager
            - call: "POST /cc/facilities/${fac}/capacity-forecasts"
              payload: { horizon_hours: 2 }
              as: CapacityPlanner
              captures: { fc2: $.data.id }
          assert:
            - "CapacityForecast.${fc1}.stale == true after the rescind (PUBLISHED forecast reconciled against bed-availability mutation)"
            - "CapacityForecast.${fc2}.stale == false and status == PROVISIONAL (fresh forecast unaffected; PROVISIONAL never marked stale)"
            - "CapacityForecast.${fc1}.status == SUPERSEDED after ${fc2} creation"

      - name: selector_policy_filter_rank_tiebreak_fallback
        claim_type: selector_policy
        grounds: [calculations.bed_match_score]
        excluded_because:
          difficulty_instance: bed_match_score_tiered_ranking
          rationale: "Eligibility filter, ranking, created_at tie-break, and empty-pool fallback are asserted across the §1.8 ranking instance and the §1.9 selector instances."

      - name: temporal_window_semantics
        claim_type: temporal_windows
        grounds: [calculations.diversion_window_overlap, calculations.bed_cooling_window]
        excluded_because:
          difficulty_instance: diversion_windows_half_open_adjacency
          rationale: "Half-open vs closed-buffer interval semantics asserted in the two §1.8 temporal-overlap instances."

      - name: scheduled_deferred_clock_determinism
        claim_type: scheduled_actions
        grounds: [calculations.hold_expiry_check]
        distinguishing_aspect: "Default clock determinism: with no set_current_utc call at all, the logical clock reads exactly 2026-08-01T00:00:00Z, so a default-ttl hold expires at 2026-08-01T01:00:00Z — runtime-independent."
        test_recipe:
          setup: ["No clock set (default 2026-08-01T00:00:00Z); facility; physician; request ACCEPTED"]
          setup_api_calls:
            - call: "POST /cc/facilities"
              payload: { name: "Clock Fac", region: "R1" }
              as: SystemAdministrator
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr Clk", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PCLK", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
          assert:
            - "BedHold.${hold}.starts_at == 2026-08-01T00:00:00Z (server default clock, not wall clock)"
            - "BedHold.${hold}.expires_at == 2026-08-01T01:00:00Z"

  # ===========================================================================
  # 9. Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_hold_side_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the hold-create response itself reflects the mutation, and a GET issued right after shows bed HELD, request HOLD_PLACED, and facility counts updated — no lag."
        test_recipe:
          setup: ["Clock at 00:00; facility; physician; bed; request ACCEPTED"]
          setup_api_calls:
            - call: "POST /cc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdministrator
            - call: "POST /cc/facilities"
              payload: { name: "Imm Fac", region: "R1" }
              as: SystemAdministrator
              captures: { fac: $.data.id }
            - call: "POST /cc/facilities/${fac}/physicians"
              payload: { full_name: "Dr Im", services: ["CARDIAC"] }
              as: SystemAdministrator
              captures: { dr: $.data.id }
            - call: "POST /cc/facilities/${fac}/beds"
              payload: { unit: "C-1", label: "B1", service: "CARDIAC", max_acuity: "ACUITY_1_CRITICAL", isolation_capability: "AIRBORNE" }
              as: SystemAdministrator
              captures: { b1: $.data.id }
            - call: "POST /cc/facilities/${fac}/transfer-requests"
              payload: { source_facility_name: "X", patient_ref: "PIM", acuity: "ACUITY_1_CRITICAL", isolation_need: "NONE", service: "CARDIAC", priority: "URGENT" }
              as: TransferCenterCoordinator
              as_user_id: "coord_1"
              captures: { tr: $.data.id }
            - call: "POST /cc/transfer-requests/${tr}/consult"
              payload: { physician_id: "${dr}" }
              as: TransferCenterCoordinator
            - call: "POST /cc/transfer-requests/${tr}/consult-response"
              payload: { decision: "ACCEPT" }
              as: AcceptingPhysician
              as_user_id: "${dr}"
          trigger:
            - call: "POST /cc/transfer-requests/${tr}/bed-holds"
              payload: { bed_id: "${b1}" }
              as: TransferCenterCoordinator
              captures: { hold: $.data.id }
            - call: "GET /cc/beds/${b1}"
              as: Any
            - call: "GET /cc/transfer-requests/${tr}"
              as: Any
            - call: "GET /cc/facilities/${fac}"
              as: Any
          assert:
