# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3196_autonomous_trucking_corridor_operations_terminal_handoff
#
# Breadth probe over every testable claim §1.1–§1.7 declares that §1.8 does not
# already exercise. Corners already covered by a §1.8 instance appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: corridor_create_returns_every_declared_field_and_starts_planned
        claim_type: Creation
        grounds:
          - entities.Corridor
          - endpoints.POST_/corridors
        distinguishing_aspect: "A corridor created with only the terminal placements, mileage, mapped route and weather profile comes back 201 with corridor_status PLANNED, posture FROZEN, check_pass_count 0 and check_count 0 — none of the derived or status fields are client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
          trigger:
            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 120, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "CLEAR_DEFAULT" }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Corridor.${cor_id}.corridor_status == PLANNED"
            - "Corridor.${cor_id}.posture == FROZEN"
            - "Corridor.${cor_id}.check_pass_count == 0 and Corridor.${cor_id}.check_count == 0"
            - "Corridor.${cor_id}.weather_risk_score == 0 and Corridor.${cor_id}.readiness_score == 0"
            - "Corridor.${cor_id}.version == 1 and the response carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: terminal_create_defaults_and_immutability_of_computed_fields
        claim_type: Computed Fields
        grounds:
          - entities.Terminal.fields.reserved_apron_units
          - entities.Terminal.fields.transfer_turnaround_minutes
          - entities.Terminal.fields.approved_window_count
          - endpoints.POST_/terminals
        distinguishing_aspect: "Terminal's three derived counters are rejected as client input: a create carrying reserved_apron_units and transfer_turnaround_minutes comes back with both at their computed defaults 0 and 0.000, so the computed fields are system-owned rather than accepted from the body."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/terminals"
              payload: { terminal_code: "ELP-HUB", terminal_name: "El Paso Transfer Hub", state_code: "TX", apron_capacity: 12 }
              as: TerminalManager
              captures: { t_id: $.data.id }
          assert:
            - "Terminal.${t_id}.reserved_apron_units == 0"
            - "Terminal.${t_id}.transfer_turnaround_minutes == 0"
            - "Terminal.${t_id}.approved_window_count == 0 and Terminal.${t_id}.total_handoff_minutes == 0"
            - "Terminal.${t_id}.terminal_state == COMMISSIONING and Terminal.${t_id}.staffing_status is null"
            - "an attempt to create a terminal with terminal_state OPERATIONAL in the body is rejected with ERR_INVALID_REQUEST"

      - name: terminal_get_with_an_unknown_id_returns_terminal_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/terminals/{id}
          - errors[ERR_TERMINAL_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unallocated id on the terminal path segment produces the entity-specific 404 ERR_TERMINAL_NOT_FOUND rather than a generic not-found and rather than a 422."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No terminal has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/terminals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "data.error_id == ERR_TERMINAL_NOT_FOUND"
            - "response_type is error and data carries no Terminal fields"

      - name: run_plans_list_filters_by_commitment_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/run-plans
          - response_envelope.pagination_fields
          - entities.RunPlan.fields.shipper_commitment_id
        distinguishing_aspect: "The filtered run-plan list reports total_count over the whole filtered set rather than the page: two commitments holding three plans between them return total_count 3 with a limit of 10, and filtering by one commitment returns total_count 2 with both remaining rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, epoch [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z) adopted."
            - "Carrier AURORA is ACTIVE; corridor Sun Belt I-10 is active enough to accept DRAFT run plans; two shipper commitments exist."
            - "Three DRAFT run plans exist: two against the first commitment, one against the second."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/carriers"
              payload: { carrier_name: "Aurora Freight Systems", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_id: $.data.id }
            - call: "POST /api/driver-prospects"
              payload: { prospect_name: "Dana Whitfield", home_terminal_id: "${t_phx}", pathway: "FIRST_LAST_MILE" }
              as: DriverOutreachCoordinator
              captures: { pro_id: $.data.id }
            - call: "POST /api/shipper-commitments"
              payload: { shipper_name: "Rio Grande Distribution", shipper_floor_per_mile_cents: 100, reserved_window_start_epoch_day: 0, reserved_window_end_epoch_day: 30, committed_slots: 5 }
              as: ShipperPartnershipManager
              captures: { com_a: $.data.id }
            - call: "POST /api/shipper-commitments"
              payload: { shipper_name: "Sonoran Produce Group", shipper_floor_per_mile_cents: 120, reserved_window_start_epoch_day: 0, reserved_window_end_epoch_day: 30, committed_slots: 4 }
              as: ShipperPartnershipManager
              captures: { com_b: $.data.id }
            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 120, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "CLEAR_DEFAULT", weather_risk_score: 20 }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id }
            - call: "POST /api/run-plans"
              payload: { corridor_id: "${cor_id}", carrier_id: "${car_id}", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", shipper_commitment_id: "${com_a}", window_start_epoch_day: 10, window_end_epoch_day: 12, trailer_count: 1, posted_per_mile_cents: 225, hauler_team_id: "${pro_id}", sacra_loadboard_slot_held: false }
              as: CarrierDispatcher
            - call: "POST /api/run-plans"
              payload: { corridor_id: "${cor_id}", carrier_id: "${car_id}", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", shipper_commitment_id: "${com_a}", window_start_epoch_day: 13, window_end_epoch_day: 15, trailer_count: 2, posted_per_mile_cents: 225, hauler_team_id: "${pro_id}", sacra_loadboard_slot_held: false }
              as: CarrierDispatcher
            - call: "POST /api/run-plans"
              payload: { corridor_id: "${cor_id}", carrier_id: "${car_id}", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", shipper_commitment_id: "${com_b}", window_start_epoch_day: 16, window_end_epoch_day: 18, trailer_count: 2, posted_per_mile_cents: 240, hauler_team_id: "${pro_id}", sacra_loadboard_slot_held: false }
              as: CarrierDispatcher
          trigger:
            - call: "GET /api/run-plans"
              payload: { shipper_commitment_id: "${com_a}", limit: 2, offset: 0 }
              as: Any
          assert:
            - "the response status is 200 and response_type is array"
            - "the filtered response returns exactly 2 rows with total_count == 2 and has_more == false"
            - "GET /api/run-plans with no filter returns 3 rows with total_count == 3, limit defaulting to 10 and offset to 0"
            - "GET /api/run-plans?carrier_id=${car_id} returns 3 rows and GET /api/run-plans?run_status=DRAFT returns 3 rows"

      - name: carrier_dot_number_uniqueness_is_not_enforced_at_create
        claim_type: Type Constraints
        grounds:
          - entities.Carrier.fields.dot_number
          - state_machines.Carrier.transitions.ONBOARDING_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Carrier onboarding accepts a DOT number without checking uniqueness at create time; uniqueness is enforced only at activation, where a second carrier carrying an already-active DOT number is rejected with ERR_INVALID_STATE rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One carrier already ACTIVE with DOT-3196001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { carrier_name: "Aurora Freight Systems", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_a: $.data.id }
            - call: "POST /api/carriers/${car_a}/activate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/carriers"
              payload: { carrier_name: "Sonoran Carriers LLC", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_b: $.data.id }
          assert:
            - "the duplicate DOT create returns 201 with Carrier.${car_b}.carrier_status == ONBOARDING, so uniqueness is not a create-time rule"
            - "Carrier.${car_a}.carrier_status == ACTIVE throughout"
            - "activating the duplicate DOT carrier is rejected with ERR_INVALID_STATE because the DOT number is already active"

      - name: driver_prospect_create_returns_identity_for_entity_backed_roles
        claim_type: Creation
        grounds:
          - entities.DriverProspect
          - roles.RemoteSupportOperator
          - endpoints.POST_/driver-prospects
        distinguishing_aspect: "A driver prospect created with a remote-support pathway is the entity that backs the RemoteSupportOperator role, so the created id is usable verbatim as X-User-ID on that role's operations."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One terminal exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
          trigger:
            - call: "POST /api/driver-prospects"
              payload: { prospect_name: "Mira Okafor", home_terminal_id: "${t_phx}", pathway: "REMOTE_SUPPORT" }
              as: DriverOutreachCoordinator
              captures: { pro_id: $.data.id }
          assert:
            - "the response status is 201 and DriverProspect.${pro_id}.safety_reliability_score == 1000"
            - "DriverProspect.${pro_id}.hours_worked == 0 and enrollments_on_file == 0"
            - "DriverProspect.${pro_id}.pathway == REMOTE_SUPPORT and home_terminal_id == ${t_phx}"
            - "the returned id is a bare UUID with no type prefix, per the common-fields convention"

      - name: security_record_route_and_clamps_change_record_status
        claim_type: Type Constraints
        grounds:
          - entities.SecurityRecord.fields.convention_status
          - endpoints.POST_/security-records/{id}/clamp
          - endpoints.POST_/security-records/{id}/route
        distinguishing_aspect: "The security record's convention status is clamped by two different operations: routing a destination terminal clamps it to NORMAL while the record is in transit, and the high-consequence clearance clamp forces HIGH_CONSEQUENCE, so the two clamps are distinguishable by direction."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two terminals exist; one security record is PENDING with convention_status SENSITIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/security-records"
              payload: { security_code: "AZ-ROAD-0001", origin_terminal_id: "${t_phx}", security_classification: "SENSITIVE", clearance_required: true, high_consequence_clearance: false, convention_status: "SENSITIVE", consignor_code: "AZ-ROAD-0001" }
              as: ComplianceOfficer
              captures: { sr_id: $.data.id }
          trigger:
            - call: "POST /api/security-records/${sr_id}/clamp"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "SecurityRecord.${sr_id}.convention_status == HIGH_CONSEQUENCE after the clamp"
            - "SecurityRecord.${sr_id}.destination_terminal_id is null before routing the destination"
            - "SecurityRecord.${sr_id}.consignor_code == AZ-ROAD-0001, copied verbatim from the security code on the consignor roll"
            - "SecurityRecord.${sr_id}.record_status == PENDING and version == 1"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: corridor_validate_from_planned_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Corridor.transitions.PLANNED_to_READINESS_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Corridor launch readiness cannot be validated from PLANNED — the validate trigger is only declared from READINESS_REVIEW and LIMITED — so the call fails with ERR_INVALID_STATE and no posture recompute fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Corridor Sun Belt I-10 exists in PLANNED with two operational terminals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 120, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "CLEAR_DEFAULT", weather_risk_score: 20 }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id, cor_v: $.data.version }
          trigger:
            - call: "GET /api/corridors/${cor_id}"
              payload: {}
              as: Any
              captures: { cor_v: $.data.version }
            - call: "POST /api/corridors/${cor_id}/launch-readiness/validate"
              payload: { expected_corridor_version: "${cor_v}" }
              as: CorridorOperationsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "Corridor.${cor_id}.corridor_status remains PLANNED"
            - "Corridor.${cor_id}.launch_authorized_at remains null"
            - "Corridor.${cor_id}.version stays 1, so the rejected call did not advance the OCC counter"

      - name: terminal_service_window_approve_requires_dispatch_ready_run_plan
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TerminalServiceWindow.transitions.REQUESTED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An apron window cannot be approved while its run plan is still DRAFT or READINESS_PENDING: the approve precondition reads the run plan's status, so the same window that approves once the run reaches DISPATCH_READY is rejected with ERR_INVALID_STATE beforehand."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A run plan on the corridor is DRAFT with one REQUESTED apron window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/carriers"
              payload: { carrier_name: "Aurora Freight Systems", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_id: $.data.id }
            - call: "POST /api/shipper-commitments"
              payload: { shipper_name: "Rio Grande Distribution", shipper_floor_per_mile_cents: 100, reserved_window_start_epoch_day: 0, reserved_window_end_epoch_day: 30, committed_slots: 5 }
              as: ShipperPartnershipManager
              captures: { com_id: $.data.id }
            - call: "POST /api/driver-prospects"
              payload: { prospect_name: "Dana Whitfield", home_terminal_id: "${t_phx}", pathway: "FIRST_LAST_MILE" }
              as: DriverOutreachCoordinator
              captures: { pro_id: $.data.id }
            - call: "POST /api/corridors"
              payload: { corridor_name: "Sun Belt I-10", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", highway_segment_miles: 120, mapped_route: { route_code: "I10-EAST-01", waypoint_count: 14, has_hov_lane: true, requires_tunnel_clearance: false }, weather_profile: "CLEAR_DEFAULT", weather_risk_score: 20 }
              as: CorridorOperationsManager
              captures: { cor_id: $.data.id }
            - call: "POST /api/run-plans"
              payload: { corridor_id: "${cor_id}", carrier_id: "${car_id}", origin_terminal_id: "${t_phx}", destination_terminal_id: "${t_tus}", shipper_commitment_id: "${com_id}", window_start_epoch_day: 10, window_end_epoch_day: 12, trailer_count: 2, posted_per_mile_cents: 225, hauler_team_id: "${pro_id}", sacra_loadboard_slot_held: true }
              as: CarrierDispatcher
              captures: { rp_id: $.data.id }
            - call: "POST /api/terminals/${t_phx}/service-windows"
              payload: { run_plan_id: "${rp_id}", service_type: "HANDOFF_OUTBOUND", window_start_minute: 100, window_end_minute: 160, handoff_duration_minutes: 20, buffer_minutes: 15, yield_to_transit: false }
              as: TerminalManager
              captures: { win_id: $.data.id }
          trigger:
            - call: "POST /api/terminal-service-windows/${win_id}/approve"
              payload: {}
              as: TerminalManager
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == ERR_INVALID_STATE"
            - "TerminalServiceWindow.${win_id}.window_status remains REQUESTED"
            - "Terminal.${t_phx}.approved_window_count == 0 and Terminal.${t_phx}.reserved_apron_units == 0"
            - "RunPlan.${rp_id}.run_status == DRAFT, which is the cross-entity precondition the rejection turns on"

      - name: carrier_offboard_with_a_live_run_plan_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Carrier.transitions.ACTIVE_to_OFFBOARDED
          - errors[ERR_CARRIER_HAS_LIVE_RUN_PLANS]
        distinguishing_aspect: "Offboarding a carrier that still holds a READINESS_PENDING run plan is rejected with the domain-specific ERR_CARRIER_HAS_LIVE_RUN_PLANS, and the same carrier offboards cleanly once that run plan is aborted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Carrier AURORA is ACTIVE with one READINESS_PENDING run plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/terminals"
              payload: { terminal_code: "PHX-WEST", terminal_name: "Phoenix West Hub", state_code: "AZ", apron_capacity: 40 }
              as: TerminalManager
              captures: { t_phx: $.data.id }
            - call: "POST /api/terminals"
              payload: { terminal_code: "TUS-HUB", terminal_name: "Tucson Transfer Hub", state_code: "AZ", apron_capacity: 30 }
              as: TerminalManager
              captures: { t_tus: $.data.id }
            - call: "POST /api/terminals/${t_phx}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/terminals/${t_tus}/operate"
              payload: {}
              as: TerminalManager
            - call: "POST /api/carriers"
              payload: { carrier_name: "Aurora Freight Systems", dot_number: "DOT-3196001" }
              as: ComplianceOfficer
              captures: { car_id: $.data.id }
