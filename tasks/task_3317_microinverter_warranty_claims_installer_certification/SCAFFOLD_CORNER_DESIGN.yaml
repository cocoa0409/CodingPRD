        claim_type: shared_operation
        grounds:
          - roles.PlatformAdmin.shared_operations
          - endpoints.[GET /warranty/claims]
        distinguishing_aspect: |
          A read listed in the admin's shared_operations is allowed for the opaque admin role,
          returning an array envelope even when empty.
        test_recipe:
          setup:
