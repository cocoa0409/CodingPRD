# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0619_float_sensory_deprivation_spa — EXPERT
# Breadth probe over §1.1-§1.7 claims not already covered by §1.8.
# claim_type values come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /members with email+full_name -> 201; status=ACTIVE, orientation_completed=false, waiver_signed_version=0, no_show_strikes=0 in response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /members"
              payload: { email: "fresh@x.com", full_name: "Fresh Face" }
              as: FrontDesk
              captures: { mid: $.data.id, st: $.data.status }
          assert:
            - "Response status == 201"
            - "Member.status == ACTIVE"
            - "Member.orientation_completed == false"
            - "Member.no_show_strikes == 0"
            - "Member.id is a UUID without a type prefix"

      - name: get_tank_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Tank"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /tanks/{random-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
          trigger:
            - call: "GET /tanks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_booking_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - "entities.Booking"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=4]"
        distinguishing_aspect: "POST /bookings missing pay_source -> ERR_INVALID_REQUEST 422; no booking created."
        test_recipe:
          setup: ["a member and a tank exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
            - call: "POST /members"
              payload: { email: "mreq@x.com", full_name: "M Req" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /tanks"
              payload: { name: "Pod-Req", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-02-01T10:00:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_booking_invalid_session_minutes_returns_422
        claim_type: Type Constraints
        grounds:
          - "entities.Booking.fields.session_minutes"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=4]"
        distinguishing_aspect: "session_minutes=75 (not in {60,90}) -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["a member and a tank exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
            - call: "POST /members"
              payload: { email: "menm@x.com", full_name: "M Enm" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /tanks"
              payload: { name: "Pod-Enm", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 75, start_utc: "2026-02-01T10:00:00Z", pay_source: "CASH" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: tank_turnover_buffer_default_applied
        claim_type: Defaults
        grounds: [entities.Tank.fields.turnover_buffer_minutes]
        distinguishing_aspect: "POST /tanks omitting turnover_buffer_minutes -> default 30 applied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
          trigger:
            - call: "POST /tanks"
              payload: { name: "Pod-Def", capacity_kind: "SINGLE" }
              as: Admin
              captures: { buf: $.data.turnover_buffer_minutes }
          assert:
            - "Tank.turnover_buffer_minutes == 30"

      - name: list_tanks_paginated_envelope
        claim_type: Listing
        grounds: [entities.Tank, endpoints]
        distinguishing_aspect: "GET /tanks?limit=1 returns array envelope with total_count and has_more reflecting two created tanks."
        test_recipe:
          setup: ["two tanks created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
            - call: "POST /tanks"
              payload: { name: "Pod-L1", capacity_kind: "SINGLE" }
              as: Admin
            - call: "POST /tanks"
              payload: { name: "Pod-L2", capacity_kind: "DUAL" }
              as: Admin
          trigger:
            - call: "GET /tanks"
              payload: { limit: 1, offset: 0 }
              as: Admin
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"
            - "exactly 1 item returned"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_booking_from_reserved_returns_invalid_state
        claim_type: Invalid Transition
        grounds:
          - "state_machines.Booking.CHECKED_IN_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=5]"
        distinguishing_aspect: "Completing a RESERVED booking (no CHECKED_IN edge from RESERVED) -> ERR_INVALID_STATE 409; status stays RESERVED."
        test_recipe:
          setup: ["a CASH booking left RESERVED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
            - call: "POST /members"
              payload: { email: "iv1@x.com", full_name: "Iv One" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /tanks"
              payload: { name: "Pod-Iv1", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-02-01T10:00:00Z", pay_source: "CASH" }
              as: FrontDesk
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.status == RESERVED"

      - name: cancel_terminal_completed_booking_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Booking"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a COMPLETED booking (terminal) -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["a booking driven to COMPLETED (oriented member, CREDIT, single tank)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "term@x.com", full_name: "Ter Minal" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Na" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-02-01T01:00:00Z", end_utc: "2026-02-01T01:30:00Z" }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T01:05:00Z" }
              as: Admin
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { ship_id: $.data.id }
            - call: "POST /memberships/${ship_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /tanks"
              payload: { name: "Pod-Term", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-02-03T10:00:00Z", pay_source: "CREDIT", membership_id: "${ship_id}" }
              as: FrontDesk
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-03T09:55:00Z" }
              as: Admin
            - call: "POST /bookings/${bk_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.status == COMPLETED"

      - name: new_booking_starts_in_reserved
        claim_type: Initial State
        grounds: [state_machines.Booking, entities.Booking.fields.status]
        distinguishing_aspect: "A freshly created booking has status == RESERVED."
        test_recipe:
          setup: ["a member and tank"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
            - call: "POST /members"
              payload: { email: "init@x.com", full_name: "In It" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /tanks"
              payload: { name: "Pod-Init", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 90, start_utc: "2026-02-01T10:00:00Z", pay_source: "CASH" }
              as: FrontDesk
              captures: { st: $.data.status }
          assert:
            - "Booking.status == RESERVED"

      - name: retire_tank_with_active_booking_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Tank.IN_SERVICE_to_RETIRED"
          - "errors[ERR_TANK_HAS_BOOKINGS]"
        distinguishing_aspect: "Retiring a tank that has a RESERVED booking -> ERR_TANK_HAS_BOOKINGS 409; operational_status stays IN_SERVICE."
        test_recipe:
          setup: ["a tank with one RESERVED booking on it"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Admin
            - call: "POST /members"
              payload: { email: "ret@x.com", full_name: "Re Tire" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /tanks"
              payload: { name: "Pod-Ret", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-02-01T10:00:00Z", pay_source: "CASH" }
              as: FrontDesk
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /tanks/${tank_id}/retire"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_TANK_HAS_BOOKINGS"
            - "Tank.${tank_id}.operational_status == IN_SERVICE"

      - name: orientation_complete_before_start_returns_timing
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Orientation.SCHEDULED_to_COMPLETED"
          - "errors[ERR_TIMING_NOT_ALLOWED]"
        distinguishing_aspect: "Completing an orientation while clock_now < start_utc -> ERR_TIMING_NOT_ALLOWED 409 (orientation_complete_allowed gate)."
        test_recipe:
          setup: ["a SCHEDULED orientation at 2026-03-01T09:00Z; clock at 2026-03-01T08:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: Admin
            - call: "POST /members"
              payload: { email: "otb@x.com", full_name: "O Tb" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Pa" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-03-01T09:00:00Z", end_utc: "2026-03-01T09:30:00Z" }
              as: FrontDesk
              captures: { ori_id: $.data.id }
          trigger:
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_TIMING_NOT_ALLOWED"
            - "Orientation.${ori_id}.status == SCHEDULED"

      - name: orientation_completion_sets_member_oriented_sideeffect
        claim_type: Side Effect Execution
        grounds: [state_machines.Orientation.SCHEDULED_to_COMPLETED, entities.Member.fields.orientation_completed, entities.Member.fields.waiver_signed_version]
        distinguishing_aspect: "Completing an orientation flips Member.orientation_completed to true and writes waiver_signed_version = orientation waiver_version."
        test_recipe:
          setup: ["a SCHEDULED orientation with waiver_version 1; clock past its start"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: Admin
            - call: "POST /members"
              payload: { email: "ose@x.com", full_name: "O Se" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Qu" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2026-03-01T09:00:00Z", end_utc: "2026-03-01T09:30:00Z", waiver_version: 1 }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:05:00Z" }
              as: Admin
          trigger:
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "GET /members/${mem_id}"
              payload: {}
              as: FrontDesk
              captures: { oc: $.data.orientation_completed, wv: $.data.waiver_signed_version }
          assert:
            - "Member.${mem_id}.orientation_completed == true"
            - "Member.${mem_id}.waiver_signed_version == 1"

      - name: sanitation_complete_before_ends_returns_timing
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Tank.IN_CYCLE_to_CLEAN"
          - "errors[ERR_TIMING_NOT_ALLOWED]"
          - "validations[priority=12]"
        distinguishing_aspect: "Completing a DEEP_CLEAN cycle while clock_now < ends_utc -> ERR_TIMING_NOT_ALLOWED 409; tank stays IN_CYCLE."
        test_recipe:
          setup: ["a tank with an IN_PROGRESS 60m DEEP_CLEAN started at 2026-03-05T10:00Z (ends 11:00); clock at 10:30"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T10:00:00Z" }
              as: Admin
            - call: "POST /tanks"
              payload: { name: "Pod-San", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /sanitation-cycles"
              payload: { tank_id: "${tank_id}", kind: "DEEP_CLEAN", duration_minutes: 60 }
              as: FrontDesk
              captures: { cyc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T10:30:00Z" }
              as: Admin
          trigger:
            - call: "POST /sanitation-cycles/${cyc_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_TIMING_NOT_ALLOWED"
            - "Tank.${tank_id}.sanitation_status == IN_CYCLE"

      - name: sanitation_complete_returns_tank_clean
        claim_type: Valid Transition
        grounds: [state_machines.Tank.IN_CYCLE_to_CLEAN, entities.SanitationCycle.fields.status]
        distinguishing_aspect: "Completing a DEEP_CLEAN after ends_utc sets cycle COMPLETED and tank back to CLEAN."
        test_recipe:
          setup: ["a tank with IN_PROGRESS 60m DEEP_CLEAN started 2026-03-06T10:00Z; clock advanced to 11:05"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T10:00:00Z" }
              as: Admin
            - call: "POST /tanks"
              payload: { name: "Pod-San2", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /sanitation-cycles"
              payload: { tank_id: "${tank_id}", kind: "DEEP_CLEAN", duration_minutes: 60 }
              as: FrontDesk
              captures: { cyc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T11:05:00Z" }
              as: Admin
          trigger:
            - call: "POST /sanitation-cycles/${cyc_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { cst: $.data.status }
            - call: "GET /tanks/${tank_id}"
              payload: {}
              as: Admin
              captures: { san: $.data.sanitation_status }
          assert:
            - "SanitationCycle.${cyc_id}.status == COMPLETED"
            - "Tank.${tank_id}.sanitation_status == CLEAN"

      - name: error_invalid_state_checkin_already_consumed
        claim_type: Idempotency
        grounds:
          - "state_machines.Booking.CONFIRMED_to_CHECKED_IN"
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / ppvc_state_over_fiscal_on_checkin
          rationale: "ERR_INVALID_STATE on a non-CONFIRMED check-in is exercised by the §1.8 state-vs-fiscal priority instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: provisional_charge_single_60_member_discount
        claim_type: Correct Result
        grounds: [calculations.provisional_session_charge, entities.Booking.fields.provisional_charge_cents]
        distinguishing_aspect: "SOLO retail 5000, discount 0.20, single 60m member booking -> provisional_charge_cents == 4000 at creation."
        test_recipe:
          setup: ["SOLO plan retail 5000 disc 0.20; ACTIVE membership; member; single tank"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000, member_discount_pct: 0.20 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "cc1@x.com", full_name: "Cc One" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { ship_id: $.data.id }
            - call: "POST /memberships/${ship_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /tanks"
              payload: { name: "Pod-Cc1", capacity_kind: "SINGLE" }
              as: Admin
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-05-01T10:00:00Z", pay_source: "CREDIT", membership_id: "${ship_id}" }
              as: FrontDesk
              captures: { prov: $.data.provisional_charge_cents }
          assert:
            - "Booking.provisional_charge_cents == 4000"

      - name: gift_card_balance_reconciles_after_charge
        claim_type: Correct Result
        grounds: [calculations.gift_card_balance, entities.GiftCard.fields.remaining_balance_cents]
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_giftcard_depletes_to_zero
          rationale: "Gift-card balance reconciliation after a session charge is asserted by the depletion boundary instance."

      - name: credit_balance_equals_ledger_sum
        claim_type: Correct Result
        grounds: [calculations.credit_balance_reconcile, entities.Membership.fields.credit_balance]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_credit_ledger_conservation_consume
          rationale: "credit_balance == sum(ledger.delta) invariant is the core assertion of the credit-conservation instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: couples_booking_on_single_tank_returns_kind_mismatch
        claim_type: Violation to Error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_TANK_KIND_MISMATCH]"
        distinguishing_aspect: "is_couples=true on a SINGLE tank -> ERR_TANK_KIND_MISMATCH 422 at booking creation."
        test_recipe:
          setup: ["a SINGLE tank and a member"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
