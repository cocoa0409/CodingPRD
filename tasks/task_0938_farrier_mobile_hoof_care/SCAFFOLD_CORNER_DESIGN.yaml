          setup: ["A route whose version was captured at creation, then a stop inserted (which bumps the route's version)."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
