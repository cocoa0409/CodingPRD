              as: PropertyManager
            - call: "POST /guest-passes"
              payload: { resident_id: "${resident_id}", guest_name: "Guest1", arrival_at: "2026-06-01T10:00:00Z", expected_departure_at: "2026-06-01T14:00:00Z" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { gp1_id: $.data.id }
          trigger:
            - call: "POST /guest-passes"
              payload: { resident_id: "${resident_id}", guest_name: "Guest2", arrival_at: "2026-06-01T12:00:00Z", expected_departure_at: "2026-06-01T16:00:00Z" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_GUEST_CAPACITY_EXCEEDED"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rent_ledger_conserved_charge_then_payment
        grounds:
          - calculations.ledger_balance_reconciliation
          - calculations.payment_allocation
          - state_machines.Resident.GOOD_STANDING_to_DELINQUENT
          - state_machines.Resident.DELINQUENT_to_GOOD_STANDING
        distinguishing_aspect: |
          Conserved money quantity rent_balance_cents: a +60000 RENT_CHARGE paired with its compensating -60000
          PAYMENT returns rent_balance_cents to its pre-charge value 0 (net owed conserved).
        test_recipe:
          setup:
            - "A resident with rent_balance_cents 0."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Bay", address: "9 Bay St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "901", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Pam", email: "pam@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /residents/${resident_id}/rent-charges"
              payload: { amount_cents: 60000, description: "rent" }
              as: PropertyManager
          trigger:
            - call: "POST /payments"
              payload: { resident_id: "${resident_id}", amount_cents: 60000, method: "ACH" }
              as: PropertyManager
          assert:
            - "Resident.${resident_id}.rent_balance_cents == 0"
            - "Resident.${resident_id}.wallet_credit_cents == 0"
            - "Resident.${resident_id}.account_status == GOOD_STANDING"

      - name: amenity_slot_conserved_confirm_then_cancel
        grounds:
          - calculations.amenity_slot_occupancy
          - state_machines.AmenityBooking.CREATE_to_CONFIRMED
          - state_machines.AmenityBooking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved slot-count quantity: booking A on a capacity-1 amenity then cancelling A returns occupancy(t)
          to 0, so booking B on the identical window succeeds (CONFIRMED); a non-releasing impl would reject B.
        test_recipe:
          setup:
            - "GYM capacity 1, no deposit; booking A 2026-06-08 10:00-11:00 CONFIRMED, then cancelled (>24h out, no penalty)."
          setup_api_calls:
