      - call: POST /hoist-reservations
        payload:
          rig_id: ${rig}
          zone_id: ${z1}
          window_start: '2026-08-10T06:00:00Z'
          window_end: '2026-08-10T18:00:00Z'
          planned_panel_count: 36
        as: FieldSuperintendent
        captures:
          res1: $.data.id
      - call: POST /hoist-reservations
        payload:
          rig_id: ${rig}
          zone_id: ${z2}
          window_start: '2026-08-10T09:00:00Z'
          window_end: '2026-08-10T11:00:00Z'
          planned_panel_count: 30
        as: FieldSuperintendent
        captures:
          e_nested: $.data.error_id
      - call: POST /hoist-reservations
        payload:
          rig_id: ${rig}
          zone_id: ${z2}
          window_start: '2026-08-10T04:00:00Z'
          window_end: '2026-08-10T20:00:00Z'
