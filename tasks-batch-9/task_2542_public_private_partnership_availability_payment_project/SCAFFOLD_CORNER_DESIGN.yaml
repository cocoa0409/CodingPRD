      - name: the_step_in_cycle_can_be_re_entered_after_a_cure
        claim_type: cyclic_shape
        grounds:
          - state_machines.Concession.STEP_IN_to_OPERATIONS
          - state_machines.EnforcementAction.STEP_IN_ACTIVE_to_CURED
        excluded_because:
          difficulty_instance: concession_step_in_cycle_returns_to_operations_and_can_be_re_entered
          rationale: |
            The cyclic-shape breadth claim (the concession loops OPERATIONS -> STEP_IN ->
            OPERATIONS and the loop is re-enterable rather than one-shot) is exactly the
            non_linear_state_machine depth probe, which already walks two full laps and
            asserts the second step-in re-cascades to the concessionaire. A separate
            corner test would replay the same call sequence for a strictly weaker assert.

      - name: the_two_service_period_axes_advance_independently
        claim_type: parallel_shape
        grounds:
          - state_machines.ServicePeriod.reporting_status
          - state_machines.ServicePeriod.payment_status
          - validations[priority=40]
        excluded_because:
          difficulty_instance: service_period_two_axes_advance_independently_with_one_cross_axis_gate
          rationale: |
            The parallel-dimension claim (each axis moves on its own trigger, the combined
            state is the pair, and exactly one cross-axis gate exists: invoice requires
            reporting_status VERIFIED) is the whole content of that difficulty instance,
            which additionally proves the gate is one-directional by paying and then
            re-deducting. The corner version would be a strict subset of its call sequence.

      - name: dispute_creation_is_guarded_by_the_periods_reporting_status
        claim_type: guarded_transition
        grounds:
          - state_machines.DeductionDispute.initial_state
          - validations[priority=52]
          - errors[ERR_CROSS_ENTITY_MISMATCH]
        excluded_because:
          difficulty_instance: dispute_creation_depends_on_the_service_periods_reporting_status
          rationale: |
            The guarded-transition claim ("dispute may be raised only if the parent period
            is VERIFIED, judged on the period's state and not the event's") is the
            cross_entity_state_dependency instance verbatim, which also proves the guard
            re-closes after the period is paid. Duplicating it here adds no coverage.

      - name: withdrawing_a_deduction_reverses_every_side_effect_it_applied
        claim_type: compensation_pattern
        grounds:
          - endpoints[POST /ppp/deduction-events/{id}/withdraw]
          - state_machines.DeductionEvent.ISSUED_to_WITHDRAWN
          - calculations.period_deduction_cap_allocation
        excluded_because:
          difficulty_instance: deduction_issue_then_withdraw_conserves_the_period_payment_identity
          rationale: |
            The compensation-pattern claim (undoing a deduction zeroes both allocations,
            restores net_payment_cents to gross and leaves no drift in deduction_points_ytd
            or availability_deduction_ytd_cents) is the compensating_invariant depth probe.
            That instance already asserts the full before/after identity across the period
            and the concession, so a corner test would only re-assert one leg of it.

  - section: calculations
    instances:
      - name: verified_availability_ratio_and_deduction_points_from_known_inputs
        claim_type: correct_result
        grounds:
          - calculations.service_period_net_payment
          - calculations.deduction_points_from_counts
          - endpoints[POST /ppp/service-periods/{id}/verify]
        distinguishing_aspect: |
          The arithmetic spine of the whole benchmark, pinned on one 200 body: a 31-day
          period is 44640 scheduled minutes, so 100 unavailable minutes give
          1 - 100/44640 = 0.99776... -> 0.9978 at 4dp, and the point formula gives
          100*2 + 2*40 + 4*10 = 320 points on BOTH the reported and verified sides. This
          fixes ratio precision (4dp, not 2) and the weight vector in one test.
        test_recipe:
          setup:
            - "The base chain: a concession in OPERATIONS with monthly_unitary_charge_cents 8604167 and ServicePeriod 1 covering [2027-03-01, 2027-04-01) => 31 days."
            - "The concessionaire self-reports 100 unavailable minutes, 2 category A and 4 category B failures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
