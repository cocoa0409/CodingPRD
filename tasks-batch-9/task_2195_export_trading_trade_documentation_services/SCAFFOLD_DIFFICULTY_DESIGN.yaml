            - "FreightBooking.${booking_4_id}.status == CANCELLED with effective_window_start 2026-08-15T00:00:00Z and effective_window_end 2026-08-19T00:00:00Z still recorded on the row"
            - "VesselSailing.${sailing_4_id}.booked_weight_kg == 0.000 and VesselSailing.${sailing_4_id}.status == OPEN"
            - "VesselSailing.${sailing_5_id}.booked_weight_kg == 400.000 and VesselSailing.${sailing_5_id}.status == OPEN (400.000 < 5000.000)"
            - "ExportOrder.${order_id}.fulfillment_status == BOOKED"

      - name: second_license_rejected_because_closed_interval_endpoints_touch_exactly
        grounds:
          - validations[priority=24]
          - entities.ExportLicense.fields.valid_from
          - entities.ExportLicense.fields.valid_to
          - entities.ExportLicense.fields.eccn
        distinguishing_aspect: |
          The second license's valid_from is exactly the first license's valid_to
          (2026-08-31T00:00:00Z) for the same eccn 3A001 and the same buyer, and because
          priority 24 uses CLOSED intervals where touching endpoints DO overlap the request
          must fail with ERR_LICENSE_WINDOW_OVERLAP and HTTP 409 — the mirror image of the
          half-open booking rule, where an interval starting exactly at another's end is
          accepted. A single shared interval helper for both rules cannot satisfy both tests.
        test_recipe:
