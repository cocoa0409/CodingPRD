  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: return_periods_are_closed_intervals_so_touching_endpoints_collide
        grounds:
          - validations[priority=29]
          - entities.DisclosureReturn.fields.period_end_date
          - errors[ERR_RETURN_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Return periods are CLOSED intervals: a new period starting on 2025-03-31, the exact
          end date of the existing return, OVERLAPS and is refused, while a period starting on
          2025-04-01 is merely adjacent and is accepted. Half-open interval arithmetic would
          admit the touching period.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Fern Hollow holds an EXECUTED agreement whose first DRAFT return covers 2025-01-01..2025-03-31"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Fern Hollow Bakery LLC", taxpayer_type: "BUSINESS", tin_last4: "7028" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-01-01", period_end_date: "2025-03-31", original_due_date: "2025-10-27", reported_tax_cents: 300000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_q1_id: $.data.id }
          trigger:
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-03-31", period_end_date: "2025-06-30", original_due_date: "2025-10-27", reported_tax_cents: 300000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_touch: $.data.error_id }
            - call: "POST /amnesty/agreements/${agr_id}/returns"
              payload: { tax_type: "SALES_USE", period_start_date: "2025-04-01", period_end_date: "2025-06-30", original_due_date: "2025-10-27", reported_tax_cents: 300000 }
              as: Taxpayer
