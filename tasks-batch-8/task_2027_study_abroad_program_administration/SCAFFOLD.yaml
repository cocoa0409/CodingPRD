scenario: |
  2027. Study Abroad Program Administration (university study abroad office):
  program catalog & partner agreement, student application, GPA/conduct clearance
  & approval, course pre-approval for credit transfer, health/safety review &
  travel-warning policy, billing (home tuition vs program fee) & aid portability,
  emergency protocol & insurance enrollment, on-site incident management,
  credit posting on return

domain_name: "study-abroad-program-administration"
api_prefix: "/api/v1"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; no nesting in URL paths except
  # sub-resource reads/creates under /applications/{id}/... for child entities.

  state_machine_shape: cyclic
  # Application has a SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED revision
  # loop; CoursePreApproval has PENDING -> NEEDS_REVISION -> PENDING;
  # BillingStatement has a PARTIALLY_PAID self-loop; guarded transitions
  # (cross-entity preconditions) appear on approve/commit/depart/post.

  relationship_patterns:
    - one_to_many        # Program -> Application -> CoursePreApproval / BillingStatement / InsuranceEnrollment / Incident / CreditPosting
    - cross_aggregate    # TravelAdvisory gates Program/Application flows by country_code + date window; Program -> PartnerAgreement

  role_model: approval_chain
  # Student submits -> ProgramCoordinator records clearance -> a DIFFERENT
  # ProgramCoordinator approves (segregation of duties). FacultyApprover,
  # SafetyOfficer, BursarOffice own disjoint resource types (peer flavor).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PartnerAgreement
    parent: null
    common_fields: true
    fields:
      - name: host_institution
        type: string
        source: input
        description: "Name of the partner/host institution covered by this agreement."
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country code of the host institution (e.g. FR, JP)."
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the agreement becomes effective."
      - name: effective_to
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the agreement stops being effective; must be strictly after effective_from."
      - name: credit_conversion_factor
        type: number
        source: input
        description: "Multiplier converting host-institution credits into home credits (e.g. 0.75); must be > 0."
      - name: insurance_required
        type: boolean
        source: input
        description: "Whether programs under this agreement require emergency insurance enrollment."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE}; DRAFT on creation, ACTIVE after activate"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: partner_agreement_id
        type: string
        source: input
        description: "FK -> PartnerAgreement.id; the governing partner agreement."
      - name: name
        type: string
        source: input
        description: "Catalog display name, e.g. 'Lyon Spring 2027 Exchange'."
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 destination country; drives travel-advisory gating."
      - name: host_institution
        type: string
        source: input
        description: "Host institution name; schedule-buffer checks group by this value."
      - name: term
        type: enum
        source: input
        description: "Academic term."
        constraints: "one of {SPRING, SUMMER, FALL, ACADEMIC_YEAR}"
      - name: start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC program start."
      - name: end_date
        type: datetime
        source: input
        description: "ISO 8601 UTC program end; must be strictly after start_date."
      - name: application_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant; new applications are rejected once the logical clock passes it."
      - name: capacity
        type: integer
        source: input
        description: "Maximum committed seats; must be >= 1."
      - name: billing_model
        type: enum
        source: input
        description: "How enrolled students are billed."
        constraints: "one of {HOME_TUITION, PROGRAM_FEE}"
      - name: program_fee_cents
        type: integer
        source: input
        description: "Program fee in cents; required and > 0 iff billing_model == PROGRAM_FEE, must be omitted or 0 for HOME_TUITION."
      - name: min_gpa
        type: number
        source: input
        description: "Minimum cumulative GPA to apply, inclusive (gpa >= min_gpa); 0.0..4.0."
      - name: seats_taken
        type: integer
        source: computed
        description: "count(Application WHERE program_id = this AND status IN {COMMITTED, ABROAD}); maintained by commit/withdraw/return side effects."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, SUSPENDED}"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Student legal name."
      - name: email
        type: string
        source: input
        description: "University email address."
      - name: gpa
        type: number
        source: input
        description: "Cumulative GPA, 0.0..4.0 inclusive."
      - name: conduct_standing
        type: enum
        source: input
        description: "Conduct-office standing."
        constraints: "one of {GOOD_STANDING, CONDUCT_REVIEW, CONDUCT_HOLD}"
      - name: aid_award_cents
        type: integer
        source: input
        description: "Total financial aid award in cents considered for portability; >= 0."
        default: 0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the applicant."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program applied to."
      - name: aid_award_cents_snapshot
        type: integer
        source: system
        description: "Copy of Student.aid_award_cents frozen at application creation; billing uses the snapshot, never the live Student field."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, RETURNED_FOR_REVISION, CLEARED, APPROVED, COMMITTED, ABROAD, RETURNED_HOME, CREDIT_POSTED, REJECTED, WITHDRAWN}"
      - name: clearance_recorded_by
        type: string
        source: system
        description: "X-User-ID of the ProgramCoordinator who recorded the clearance decision; reset to null on resubmit; segregation-of-duties compares against this."
      - name: approved_by
        type: string
        source: system
        description: "X-User-ID of the approving ProgramCoordinator."
      - name: withdraw_reason
        type: enum
        source: system
        description: "Why the application was withdrawn."
        constraints: "null, or one of {STUDENT_INITIATED, STAFF_INITIATED, SYSTEM_SUSPENSION}"
      - name: transfer_credits_posted
        type: number
        source: computed
        description: "Home credits actually posted on return; set from CreditPosting.final_credits at post time."
        default: 0

  - name: CoursePreApproval
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; application this course plan belongs to."
      - name: course_code
        type: string
        source: input
        description: "Host-institution course code; at most one PENDING/APPROVED record per (application_id, course_code) — a new create supersedes the old one."
      - name: course_title
        type: string
        source: input
        description: "Host-institution course title."
      - name: host_credits
        type: number
        source: input
        description: "Credit value in host-institution units; > 0."
      - name: home_credits_est
        type: number
        source: computed
        description: "round_half_up(host_credits * PartnerAgreement.credit_conversion_factor, step 0.5); recomputed on revise."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        default: PENDING
        constraints: "one of {PENDING, APPROVED, NEEDS_REVISION, REJECTED, SUPERSEDED}"
      - name: reviewed_by
        type: string
        source: system
        description: "X-User-ID of the FacultyApprover who last reviewed this record."
      - name: review_notes
        type: string
        source: system
        description: "Reviewer notes from the latest review decision."

  - name: TravelAdvisory
    parent: null
    common_fields: true
    fields:
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country the advisory applies to."
      - name: level
        type: enum
        source: input
        description: "Advisory severity."
        constraints: "one of {CAUTION, WARNING, DO_NOT_TRAVEL}"
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the advisory window, inclusive (half-open interval start)."
      - name: effective_to
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the advisory window, exclusive; must be strictly after effective_from."
      - name: status
        type: enum
        source: system
        description: "ACTIVE advisories participate in gating and overlap checks; LIFTED is terminal."
        default: ACTIVE
        constraints: "one of {ACTIVE, LIFTED}"

  - name: InsuranceEnrollment
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; the COMMITTED application being insured."
      - name: provider
        type: string
        source: input
        description: "Insurance provider name."
      - name: coverage_start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC coverage start; must be <= program.start_date."
      - name: coverage_end_date
        type: datetime
        source: input
        description: "ISO 8601 UTC coverage end; must be >= program.end_date and > coverage_start_date."
      - name: status
        type: enum
        source: system
        description: "ACTIVE coverage; CANCELLED is terminal."
        default: ACTIVE
        constraints: "one of {ACTIVE, CANCELLED}"

  - name: BillingStatement
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> Application.id; created by the commit transition (never via direct POST)."
      - name: billing_model_snapshot
        type: enum
        source: system
        description: "Program.billing_model frozen at commit."
        constraints: "one of {HOME_TUITION, PROGRAM_FEE}"
      - name: base_cents
        type: integer
        source: system
        description: "Billing base per billing_charge_calculation (home tuition constant or program fee)."
      - name: insurance_premium_cents
        type: integer
        source: system
        description: "INSURANCE_PREMIUM_CENTS when the program's agreement requires insurance, else 0."
      - name: application_fee_cents
        type: integer
        source: system
        description: "APPLICATION_FEE_CENTS constant, always applied."
      - name: aid_portable_cents
        type: integer
        source: system
        description: "Portable aid per billing_charge_calculation: min(aid snapshot, floor(cap_pct * base_cents))."
      - name: charge_cents
        type: integer
        source: computed
        description: "base_cents + insurance_premium_cents + application_fee_cents - aid_portable_cents."
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of accepted payments on this statement."
        default: 0
      - name: credit_memo_cents
        type: integer
        source: system
        description: "Refund credit issued when the statement is voided; equals amount_paid_cents at void time."
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: "charge_cents - amount_paid_cents while status IN {ISSUED, PARTIALLY_PAID, PAID}; forced to 0 when VOID."
      - name: status
        type: enum
        source: system
        description: "Payment lifecycle."
        default: ISSUED
        constraints: "one of {ISSUED, PARTIALLY_PAID, PAID, VOID}"

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; must reference an application in status ABROAD (on-site only)."
      - name: severity
        type: enum
        source: input
        description: "Incident severity."
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: description
        type: string
        source: input
        description: "Free-text incident description."
      - name: reported_by
        type: string
        source: system
        description: "X-User-ID of the reporter."
      - name: status
        type: enum
        source: system
        description: "Triage lifecycle."
        default: REPORTED
        constraints: "one of {REPORTED, TRIAGED, ESCALATED, RESOLVED}"
      - name: resolution_notes
        type: string
        source: system
        description: "Notes captured when transitioning to RESOLVED."

  - name: CreditPosting
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; must reference a RETURNED_HOME application."
      - name: lines
        type: array
        source: input
        description: "Transcript lines, each an object {course_preapproval_id, grade_points}; each course_preapproval_id must reference an APPROVED CoursePreApproval of the same application; grade_points in 0.0..4.0."
      - name: provisional_credits
        type: number
        source: computed
        description: "transfer_credit_conversion provisional variant: per-course rounded home credits summed over ALL lines."
      - name: final_credits
        type: number
        source: computed
        description: "transfer_credit_conversion final_posted variant: per-course rounded home credits summed over lines with grade_points >= 2.0."
      - name: posted_by
        type: string
        source: system
        description: "X-User-ID of the FacultyApprover who posted the credits."
      - name: status
        type: enum
        source: system
        description: "PENDING until posted; POSTED is terminal."
        default: PENDING
        constraints: "one of {PENDING, POSTED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/v1/programs/{id}/publish"
        actor: ProgramCoordinator
        preconditions:
          - "program.status == DRAFT"
          - "program.partner_agreement_id references a PartnerAgreement with status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "program.status := OPEN; program.version += 1"
      - from: OPEN
        to: SUSPENDED
        trigger: "system cascade: POST /api/v1/travel-advisories creates an advisory with level == DO_NOT_TRAVEL whose window FULLY CONTAINS the program dates (advisory.effective_from <= program.start_date AND advisory.effective_to >= program.end_date) and matching country_code"
        actor: system
        preconditions:
          - "program.status == OPEN"
        side_effects:
          - "program.status := SUSPENDED; program.version += 1"
          - "cascade link 2: every Application with program_id == program.id AND status IN {APPROVED, COMMITTED} transitions to WITHDRAWN with withdraw_reason = SYSTEM_SUSPENSION (CLEARED applications are NOT touched); each of those withdrawals fires its own link-3 side effects (billing void, insurance cancel, seat release)"

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, CREDIT_POSTED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /api/v1/applications/{id}/clearance with decision == CLEARED"
        actor: ProgramCoordinator
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.clearance_recorded_by := X-User-ID of the caller"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /api/v1/applications/{id}/clearance with decision == RETURNED_FOR_REVISION"
        actor: ProgramCoordinator
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.clearance_recorded_by := X-User-ID of the caller"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/v1/applications/{id}/clearance with decision == REJECTED"
        actor: ProgramCoordinator
        preconditions:
          - "application.status == SUBMITTED"
        side_effects:
          - "application.clearance_recorded_by := X-User-ID of the caller"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /api/v1/applications/{id}/resubmit"
        actor: Student
        preconditions:
          - "application.status == RETURNED_FOR_REVISION"
          - "caller is the owning student (X-User-ID == application.student_id)"
        side_effects:
          - "application.clearance_recorded_by := null (revision loop: a fresh clearance review is required)"
      - from: CLEARED
        to: APPROVED
        trigger: "POST /api/v1/applications/{id}/approve"
        actor: ProgramCoordinator
        preconditions:
          - "application.status == CLEARED"
          - "cross-entity state: Program referenced by application.program_id has status == OPEN"
          - "segregation of duties: X-User-ID != application.clearance_recorded_by (ERR_SEGREGATION_OF_DUTIES)"
          - "travel-warning gate: no TravelAdvisory with country_code == program.country_code, level == DO_NOT_TRAVEL, status == ACTIVE, window in effect at the logical clock (effective_from <= clock < effective_to), and window overlapping [program.start_date, program.end_date] (ERR_TRAVEL_ADVISORY_BLOCK)"
        side_effects:
          - "application.approved_by := X-User-ID of the caller"
      - from: APPROVED
        to: COMMITTED
        trigger: "POST /api/v1/applications/{id}/commit"
        actor: Student
        preconditions:
          - "application.status == APPROVED"
          - "caller is the owning student"
          - "cross-entity state: Program referenced by application.program_id has status == OPEN"
          - "capacity: program.seats_taken < program.capacity (ERR_PROGRAM_FULL)"
        side_effects:
          - "program.seats_taken += 1; program.version += 1"
          - "create BillingStatement for this application with status ISSUED; run billing_charge_calculation to fill base_cents / insurance_premium_cents / application_fee_cents / aid_portable_cents / charge_cents / outstanding_cents"
      - from: COMMITTED
        to: ABROAD
        trigger: "POST /api/v1/applications/{id}/lifecycle with action == DEPART"
        actor: ProgramCoordinator
        preconditions:
          - "application.status == COMMITTED"
          - "cross-entity: an InsuranceEnrollment with application_id == application.id, status == ACTIVE, coverage_start_date <= program.start_date AND coverage_end_date >= program.end_date exists (ERR_INSURANCE_COVERAGE_MISSING)"
        side_effects:
          - "application.status := ABROAD (seats_taken still counts ABROAD)"
      - from: ABROAD
        to: RETURNED_HOME
        trigger: "POST /api/v1/applications/{id}/lifecycle with action == RECORD_RETURN"
        actor: ProgramCoordinator
        preconditions:
          - "application.status == ABROAD"
        side_effects:
          - "program.seats_taken -= 1 (RETURNED_HOME is outside the {COMMITTED, ABROAD} seat-count set); program.version += 1"
      - from: RETURNED_HOME
        to: CREDIT_POSTED
        trigger: "system cascade: POST /api/v1/credit-postings/{id}/post transitions the application's PENDING CreditPosting to POSTED"
        actor: system
        preconditions:
          - "application.status == RETURNED_HOME"
        side_effects:
          - "application.transfer_credits_posted := credit_posting.final_credits"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/v1/applications/{id}/withdraw"
        actor: Student
        preconditions: ["application.status == SUBMITTED", "caller is the owning student or a ProgramCoordinator"]
        side_effects: ["application.withdraw_reason := STUDENT_INITIATED (student) or STAFF_INITIATED (coordinator)"]
      - from: RETURNED_FOR_REVISION
        to: WITHDRAWN
        trigger: "POST /api/v1/applications/{id}/withdraw"
        actor: Student
        preconditions: ["application.status == RETURNED_FOR_REVISION", "caller is the owning student or a ProgramCoordinator"]
        side_effects: ["application.withdraw_reason := STUDENT_INITIATED or STAFF_INITIATED"]
      - from: CLEARED
        to: WITHDRAWN
        trigger: "POST /api/v1/applications/{id}/withdraw"
        actor: Student
        preconditions: ["application.status == CLEARED", "caller is the owning student or a ProgramCoordinator"]
        side_effects: ["application.withdraw_reason := STUDENT_INITIATED or STAFF_INITIATED"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /api/v1/applications/{id}/withdraw OR system cascade from Program OPEN->SUSPENDED"
        actor: Student
        preconditions: ["application.status == APPROVED", "manual: caller is the owning student or a ProgramCoordinator"]
        side_effects:
          - "application.withdraw_reason := STUDENT_INITIATED / STAFF_INITIATED (manual) or SYSTEM_SUSPENSION (cascade)"
      - from: COMMITTED
        to: WITHDRAWN
        trigger: "POST /api/v1/applications/{id}/withdraw OR system cascade from Program OPEN->SUSPENDED"
        actor: Student
        preconditions: ["application.status == COMMITTED", "manual: caller is the owning student or a ProgramCoordinator"]
        side_effects:
          - "program.seats_taken -= 1; program.version += 1"
          - "cascade link 3a: BillingStatement with application_id == application.id AND status IN {ISSUED, PARTIALLY_PAID, PAID} transitions to VOID; credit_memo_cents := amount_paid_cents (refund_credit_memo); outstanding_cents := 0"
          - "cascade link 3b: InsuranceEnrollment with application_id == application.id AND status == ACTIVE transitions to CANCELLED"
          - "application.withdraw_reason := STUDENT_INITIATED / STAFF_INITIATED (manual) or SYSTEM_SUSPENSION (cascade)"

  - entity: CoursePreApproval
    initial_state: PENDING
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/v1/course-preapprovals/{id}/review with decision == APPROVED"
        actor: FacultyApprover
        preconditions: ["course_pre_approval.status == PENDING"]
        side_effects: ["course_pre_approval.reviewed_by := X-User-ID; review_notes := payload.review_notes (may be null)"]
      - from: PENDING
        to: NEEDS_REVISION
        trigger: "POST /api/v1/course-preapprovals/{id}/review with decision == NEEDS_REVISION"
        actor: FacultyApprover
        preconditions: ["course_pre_approval.status == PENDING"]
        side_effects: ["course_pre_approval.reviewed_by := X-User-ID; review_notes := payload.review_notes"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/v1/course-preapprovals/{id}/review with decision == REJECTED"
        actor: FacultyApprover
        preconditions: ["course_pre_approval.status == PENDING"]
        side_effects: ["course_pre_approval.reviewed_by := X-User-ID; review_notes := payload.review_notes"]
      - from: NEEDS_REVISION
        to: PENDING
        trigger: "POST /api/v1/course-preapprovals/{id}/revise"
        actor: Student
        preconditions:
          - "course_pre_approval.status == NEEDS_REVISION"
          - "caller is the student owning the parent application"
        side_effects:
          - "host_credits := payload.host_credits; home_credits_est recomputed per transfer_credit_conversion per-course rounding"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system cascade: POST /api/v1/applications/{id}/course-preapprovals creates a new record with the same course_code for the same application"
        actor: system
        preconditions: ["an existing record with status IN {PENDING, APPROVED} shares (application_id, course_code) with the new create"]
        side_effects: ["old record.status := SUPERSEDED"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade: POST /api/v1/applications/{id}/course-preapprovals creates a new record with the same course_code for the same application"
        actor: system
        preconditions: ["an existing record with status IN {PENDING, APPROVED} shares (application_id, course_code) with the new create"]
        side_effects: ["old record.status := SUPERSEDED"]

  - entity: TravelAdvisory
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /api/v1/travel-advisories/{id}/lift"
        actor: SafetyOfficer
        preconditions: ["travel_advisory.status == ACTIVE"]
        side_effects: ["no cascade: previously SUSPENDED programs remain SUSPENDED"]

  - entity: InsuranceEnrollment
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/v1/insurance-enrollments/{id}/cancel OR system cascade from Application -> WITHDRAWN"
        actor: Student
        preconditions:
          - "insurance_enrollment.status == ACTIVE"
          - "manual cancel: caller is the owning student or a ProgramCoordinator"
          - "manual cancel safety lock: the linked application.status != ABROAD (ERR_CANNOT_CANCEL_WHILE_ABROAD)"
        side_effects: ["none beyond status change"]

  - entity: BillingStatement
    initial_state: ISSUED
    terminal_states: [VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /api/v1/billing-statements/{id}/payments with 0 < amount_cents < outstanding_cents"
        actor: BursarOffice
        preconditions: ["billing_statement.status == ISSUED", "amount_cents > 0", "amount_cents < outstanding_cents"]
        side_effects: ["amount_paid_cents += amount_cents; outstanding_cents recomputed"]
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /api/v1/billing-statements/{id}/payments with 0 < amount_cents < outstanding_cents"
        actor: BursarOffice
        preconditions: ["billing_statement.status == PARTIALLY_PAID", "amount_cents > 0", "amount_cents < outstanding_cents"]
        side_effects: ["amount_paid_cents += amount_cents; outstanding_cents recomputed"]
      - from: ISSUED
        to: PAID
        trigger: "POST /api/v1/billing-statements/{id}/payments with amount_cents == outstanding_cents"
        actor: BursarOffice
        preconditions: ["billing_statement.status == ISSUED", "amount_cents == outstanding_cents"]
        side_effects: ["amount_paid_cents += amount_cents; outstanding_cents := 0"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /api/v1/billing-statements/{id}/payments with amount_cents == outstanding_cents"
        actor: BursarOffice
        preconditions: ["billing_statement.status == PARTIALLY_PAID", "amount_cents == outstanding_cents"]
        side_effects: ["amount_paid_cents += amount_cents; outstanding_cents := 0"]
      - from: ISSUED
        to: VOID
        trigger: "system cascade from Application -> WITHDRAWN"
        actor: system
        preconditions: ["billing_statement.status IN {ISSUED, PARTIALLY_PAID, PAID}"]
        side_effects: ["credit_memo_cents := amount_paid_cents; outstanding_cents := 0 (refund_credit_memo)"]
      - from: PARTIALLY_PAID
        to: VOID
        trigger: "system cascade from Application -> WITHDRAWN"
        actor: system
        preconditions: ["billing_statement.status IN {ISSUED, PARTIALLY_PAID, PAID}"]
        side_effects: ["credit_memo_cents := amount_paid_cents; outstanding_cents := 0 (refund_credit_memo)"]
      - from: PAID
        to: VOID
        trigger: "system cascade from Application -> WITHDRAWN"
        actor: system
        preconditions: ["billing_statement.status IN {ISSUED, PARTIALLY_PAID, PAID}"]
        side_effects: ["credit_memo_cents := amount_paid_cents; outstanding_cents := 0 (refund_credit_memo)"]

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /api/v1/incidents/{id}/transition with to_state == TRIAGED"
        actor: SafetyOfficer
        preconditions: ["incident.status == REPORTED"]
        side_effects: []
      - from: TRIAGED
        to: ESCALATED
        trigger: "POST /api/v1/incidents/{id}/transition with to_state == ESCALATED"
        actor: SafetyOfficer
        preconditions: ["incident.status == TRIAGED"]
        side_effects: []
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /api/v1/incidents/{id}/transition with to_state == RESOLVED"
        actor: SafetyOfficer
        preconditions: ["incident.status == TRIAGED"]
        side_effects: ["incident.resolution_notes := payload.resolution_notes (may be null)"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /api/v1/incidents/{id}/transition with to_state == RESOLVED"
        actor: SafetyOfficer
        preconditions: ["incident.status == ESCALATED"]
        side_effects: ["incident.resolution_notes := payload.resolution_notes (may be null)"]

  - entity: CreditPosting
    initial_state: PENDING
    terminal_states: [POSTED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /api/v1/credit-postings/{id}/post"
        actor: FacultyApprover
        preconditions:
          - "credit_posting.status == PENDING"
          - "cross-entity state: Application referenced by credit_posting.application_id has status == RETURNED_HOME (ERR_INVALID_STATE)"
        side_effects:
          - "credit_posting.posted_by := X-User-ID"
          - "cascade link 2: Application RETURNED_HOME -> CREDIT_POSTED; application.transfer_credits_posted := credit_posting.final_credits"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: cpa-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /api/v1/applications/{id}/course-preapprovals"
    occ_field: expected_application_version
    description: |
      Creating a CoursePreApproval against an Application whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. This captures the case where another writer has just
      created a pre-approval for the same course_code (which legitimately
      supersedes the prior PENDING/APPROVED record) and the current writer's
      view of the application is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billing_charge_calculation
    description: "Computes the committed application's BillingStatement money fields. Two billing models produce different charges for the same student data."
    trigger: "Application APPROVED -> COMMITTED (commit) — creates the BillingStatement in ISSUED status"
    algorithm: conditional_formula
    formula: |
      base_cents = HOME_TUITION_PER_TERM_CENTS            if program.billing_model == HOME_TUITION
                 = program.program_fee_cents              if program.billing_model == PROGRAM_FEE
      insurance_premium_cents = INSURANCE_PREMIUM_CENTS   if agreement.insurance_required
                              = 0                          otherwise
      aid_cap_pct = AID_CAP_HOME_TUITION  if program.billing_model == HOME_TUITION
                  = AID_CAP_PROGRAM_FEE   if program.billing_model == PROGRAM_FEE
      aid_portable_cents = min(application.aid_award_cents_snapshot,
                               floor(aid_cap_pct * base_cents))
      charge_cents = base_cents + insurance_premium_cents + APPLICATION_FEE_CENTS
                     - aid_portable_cents
      outstanding_cents = charge_cents - amount_paid_cents   # amount_paid_cents == 0 at creation
    input_set: "the committing Application (aid snapshot frozen at creation), its Program (billing_model, program_fee_cents), and the Program's PartnerAgreement (insurance_required)"
    constants:
      HOME_TUITION_PER_TERM_CENTS: 2400000
      INSURANCE_PREMIUM_CENTS: 35000
      APPLICATION_FEE_CENTS: 5000
      AID_CAP_HOME_TUITION: 1.00
      AID_CAP_PROGRAM_FEE: 0.60
    precision: "integer cents throughout; floor() on the aid-cap product; no other rounding"
    variants:
      - name: home_tuition_model
        when: "program.billing_model == HOME_TUITION"
        difference: "base is the university-wide home tuition constant (2400000) and aid is fully portable (cap 100% of base)"
      - name: program_fee_model
        when: "program.billing_model == PROGRAM_FEE"
        difference: "base is the program's own program_fee_cents and aid portability is capped at 60% of base"

  - name: transfer_credit_conversion
    description: "Converts host-institution credits to home credits. Rounding order is pinned: round EACH course to the nearest 0.5 (half-up) BEFORE summing; summing raw values then rounding yields different totals and is NOT the contract."
    trigger: "CoursePreApproval create/revise (home_credits_est) and CreditPosting create (provisional_credits, final_credits) / post"
    algorithm: aggregation
    formula: |
      per course line:
        raw_home = line.host_credits * agreement.credit_conversion_factor
        home     = round_half_up(raw_home / 0.5) * 0.5   # nearest 0.5, ties away from zero
      provisional_credits = sum(home) over ALL transcript lines
      final_credits       = sum(home) over lines where line.grade_points >= TRANSFER_GRADE_MIN
    input_set: "CreditPosting.lines (each bound to an APPROVED CoursePreApproval of the same application) and the Program's PartnerAgreement.credit_conversion_factor"
    constants:
      TRANSFER_GRADE_MIN: 2.0
      CREDIT_ROUNDING_STEP: 0.5
    precision: "nearest 0.5 per course, round_half_up, THEN integer-exact sum"
    variants:
      - name: provisional
        when: "planning/preview context (CreditPosting create response and pre-return views)"
        difference: "includes every transcript line regardless of grade"
      - name: final_posted
        when: "posting on return (CreditPosting post; application.transfer_credits_posted)"
        difference: "excludes lines whose grade_points < TRANSFER_GRADE_MIN (they contribute 0)"

  - name: refund_credit_memo
    description: "Compensating credit issued when a BillingStatement is voided by an application withdrawal; full refund of monies actually paid."
    trigger: "BillingStatement {ISSUED, PARTIALLY_PAID, PAID} -> VOID (system cascade from Application -> WITHDRAWN)"
    algorithm: threshold
    formula: |
      credit_memo_cents = amount_paid_cents      # full refund of payments received
      outstanding_cents = 0                      # charge is cancelled
    input_set: "the BillingStatement being voided"
    constants: {}
    precision: "integer cents, no rounding"
    variants: []

  - name: seats_taken_aggregation
    description: "Derived seat counter on Program; only applications actively holding a seat count."
    trigger: "Application -> COMMITTED (+1), Application COMMITTED -> WITHDRAWN (-1), Application ABROAD -> RETURNED_HOME (-1); read on every Program response"
    algorithm: aggregation
    formula: |
      program.seats_taken = count(Application WHERE program_id = program.id
                                    AND status IN {COMMITTED, ABROAD})
    input_set: "Applications of the program filtered to status IN {COMMITTED, ABROAD} (explicit status set; SUBMITTED/RETURNED_HOME/terminal states excluded)"
    constants: {}
    precision: "integer count, exact"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is in the endpoint's roles list; additionally, for Student-role calls on student-scoped resources (application actions, course-preapproval create/revise, insurance create/cancel, incident create, student read), the linked student_id must equal X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path template ids resolve to existing resources, validated left-to-right (program id before child id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "request-body schema integrity: required fields present, types valid, enum members valid, ranges valid (capacity >= 1, 0.0 <= gpa <= 4.0, effective_from < effective_to, start_date < end_date, coverage_start_date < coverage_end_date, host_credits > 0, credit_conversion_factor > 0); conditional fee rule: billing_model == PROGRAM_FEE requires program_fee_cents > 0 (ERR_PROGRAM_FEE_REQUIRED), billing_model == HOME_TUITION requires program_fee_cents omitted or 0 (ERR_INVALID_REQUEST)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints with a body"
  - priority: 5
    category: state
    check: "state-machine precondition: the target resource is in a `from` state of the requested transition; cross-entity state gates: approve/commit require Program.status == OPEN, depart requires Application.status == COMMITTED, credit-posting create/post require Application.status == RETURNED_HOME, incident create requires Application.status == ABROAD"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints and state-gated creates"
  - priority: 6
    category: auth
    check: "segregation of duties on approve: X-User-ID must differ from application.clearance_recorded_by (record-dependent authorization, evaluated after state)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/v1/applications/{id}/approve"
  - priority: 7
    category: business_safety
    check: "travel-warning gate on approve and insurance-enrollment create: no TravelAdvisory with country_code == program.country_code, level == DO_NOT_TRAVEL, status == ACTIVE, window in effect at the logical clock (effective_from <= clock < effective_to), and window overlapping [program.start_date, program.end_date]; insurance cancel safety lock: linked application.status != ABROAD"
    error_id: ERR_TRAVEL_ADVISORY_BLOCK
    http_status: 422
    applies_to: "POST /api/v1/applications/{id}/approve, POST /api/v1/insurance-enrollments, POST /api/v1/insurance-enrollments/{id}/cancel"
  - priority: 8
    category: business_temporal
    check: "temporal rules: application create requires logical clock <= program.application_deadline (ERR_APPLICATION_DEADLINE_PASSED); TravelAdvisory create rejects half-open-window overlap with an ACTIVE advisory for the same country_code (ERR_ADVISORY_WINDOW_OVERLAP; adjacency — one's effective_to == the other's effective_from — is NOT an overlap); Program create rejects another Program at the same host_institution with status IN {DRAFT, OPEN} separated by fewer than 7 days in either direction (ERR_PROGRAM_SCHEDULE_BUFFER; exactly 7 days is allowed); insurance create requires coverage window to fully contain program dates (coverage_start_date <= program.start_date AND coverage_end_date >= program.end_date, else ERR_COVERAGE_WINDOW_INSUFFICIENT)"
    error_id: ERR_APPLICATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /api/v1/applications, POST /api/v1/travel-advisories, POST /api/v1/programs, POST /api/v1/insurance-enrollments"
  - priority: 9
    category: business_referential
    check: "referential integrity beyond path ids: application create requires program_id to reference an existing OPEN program (missing -> ERR_NOT_FOUND; not OPEN -> ERR_INVALID_STATE); CreditPosting lines: every line.course_preapproval_id must reference a CoursePreApproval with application_id == the posting's application AND status == APPROVED (ERR_PREAPPROVAL_INVALID); depart requires an ACTIVE InsuranceEnrollment covering the program dates (ERR_INSURANCE_COVERAGE_MISSING); publish requires the partner agreement to exist (ERR_NOT_FOUND) and be ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
    error_id: ERR_PREAPPROVAL_INVALID
    http_status: 422
    applies_to: "POST /api/v1/applications, POST /api/v1/applications/{id}/credit-postings, POST /api/v1/applications/{id}/lifecycle, POST /api/v1/programs/{id}/publish"
  - priority: 10
    category: business_constraint
    check: "domain constraints: application create rejects gpa < program.min_gpa (ERR_GPA_BELOW_MINIMUM) and conduct_standing == CONDUCT_HOLD (ERR_CONDUCT_HOLD); duplicate active application per (student_id, program_id) — existing application with status IN {SUBMITTED, RETURNED_FOR_REVISION, CLEARED, APPROVED, COMMITTED, ABROAD, RETURNED_HOME} (ERR_DUPLICATE_APPLICATION); duplicate ACTIVE InsuranceEnrollment per application (ERR_DUPLICATE_ENROLLMENT); duplicate PENDING/POSTED CreditPosting per application (ERR_DUPLICATE_CREDIT_POSTING); transcript grade_points outside 0.0..4.0 (ERR_GRADE_OUT_OF_RANGE)"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /api/v1/applications, POST /api/v1/insurance-enrollments, POST /api/v1/applications/{id}/credit-postings"
  - priority: 11
    category: business_fiscal
    check: "money/capacity checks last: commit requires program.seats_taken < program.capacity (ERR_PROGRAM_FULL); payment amount_cents must be > 0 (ERR_PAYMENT_NOT_POSITIVE) and <= outstanding_cents (ERR_OVERPAYMENT)"
    error_id: ERR_PROGRAM_FULL
    http_status: 409
    applies_to: "POST /api/v1/applications/{id}/commit, POST /api/v1/billing-statements/{id}/payments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/api/v1/partner-agreements"
    description: "Create a partner agreement in DRAFT."
    roles: [ProgramCoordinator]
    code: 201
    input: [host_institution, country_code, effective_from, effective_to, credit_conversion_factor, "insurance_required?"]
    output: PartnerAgreement
    side_effects: []
  - method: POST
    path: "/api/v1/partner-agreements/{id}/activate"
    description: "Activate a DRAFT partner agreement (DRAFT -> ACTIVE)."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: PartnerAgreement
    side_effects: ["status := ACTIVE; version += 1"]
  - method: POST
    path: "/api/v1/programs"
    description: "Create a catalog program in DRAFT. Runs the 7-day host-institution schedule-buffer check."
    roles: [ProgramCoordinator]
    code: 201
    input: [partner_agreement_id, name, country_code, host_institution, term, start_date, end_date, application_deadline, capacity, billing_model, min_gpa, "program_fee_cents?"]
    output: Program
    side_effects: []
  - method: GET
    path: "/api/v1/programs"
    description: "List programs with filters and pagination."
    roles: [ProgramCoordinator, Student, FacultyApprover, SafetyOfficer, BursarOffice]
    code: 200
    input: ["country_code?", "status?", "host_institution?", "partner_agreement_id?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: GET
    path: "/api/v1/programs/{id}"
    description: "Read one program including computed seats_taken."
    roles: [ProgramCoordinator, Student, FacultyApprover, SafetyOfficer, BursarOffice]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: POST
    path: "/api/v1/programs/{id}/publish"
    description: "Publish a DRAFT program (DRAFT -> OPEN); requires the partner agreement to be ACTIVE."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Program
    side_effects: ["Program DRAFT -> OPEN; version += 1"]
  - method: POST
    path: "/api/v1/students"
    description: "Register a student record (registrar import)."
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, email, gpa, conduct_standing, "aid_award_cents?"]
    output: Student
    side_effects: []
  - method: GET
    path: "/api/v1/students/{id}"
    description: "Read a student. Student role may only read its own record."
    roles: [ProgramCoordinator, Student]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: POST
    path: "/api/v1/applications"
    description: "Submit an application to an OPEN program. Runs deadline, GPA, conduct, duplicate checks; snapshots aid."
    roles: [Student]
    code: 201
    input: [student_id, program_id]
    output: Application
    side_effects: ["aid_award_cents_snapshot := Student.aid_award_cents; status := SUBMITTED"]
  - method: GET
    path: "/api/v1/applications"
    description: "List applications with filters (student_id / program_id / status) and pagination."
    roles: [ProgramCoordinator]
    code: 200
    input: ["student_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/api/v1/applications/{id}"
    description: "Read one application. Student role may only read its own."
    roles: [ProgramCoordinator, Student]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/api/v1/applications/{id}/clearance"
    description: "Record GPA/conduct clearance decision from SUBMITTED: CLEARED, RETURNED_FOR_REVISION, or REJECTED."
    roles: [ProgramCoordinator]
    code: 200
    input: [decision, "notes?"]
    output: Application
    side_effects: ["status := decision; clearance_recorded_by := X-User-ID; version += 1"]
  - method: POST
    path: "/api/v1/applications/{id}/resubmit"
    description: "Resubmit a RETURNED_FOR_REVISION application (revision loop back to SUBMITTED)."
    roles: [Student]
    code: 200
    input: []
    output: Application
    side_effects: ["status := SUBMITTED; clearance_recorded_by := null; version += 1"]
  - method: POST
    path: "/api/v1/applications/{id}/approve"
    description: "Approve a CLEARED application; requires program OPEN, travel-advisory gate clear, and an approver different from the clearance recorder."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Application
    side_effects: ["status := APPROVED; approved_by := X-User-ID; version += 1"]
  - method: POST
    path: "/api/v1/applications/{id}/commit"
    description: "Owning student commits to an APPROVED application; consumes a seat and issues the billing statement."
    roles: [Student]
    code: 200
    input: []
    output: Application
    side_effects: ["status := COMMITTED; program.seats_taken += 1; program.version += 1; create BillingStatement ISSUED via billing_charge_calculation; version += 1"]
  - method: POST
    path: "/api/v1/applications/{id}/withdraw"
    description: "Withdraw an application from {SUBMITTED, RETURNED_FOR_REVISION, CLEARED, APPROVED, COMMITTED}; voids billing and cancels insurance when committed."
    roles: [Student, ProgramCoordinator]
    code: 200
    input: []
    output: Application
    side_effects: ["status := WITHDRAWN; if from COMMITTED: seats_taken -= 1, BillingStatement -> VOID (credit memo), InsuranceEnrollment -> CANCELLED; version += 1"]
  - method: POST
    path: "/api/v1/applications/{id}/lifecycle"
    description: "Departure/return bookkeeping: action DEPART (COMMITTED -> ABROAD, requires covering ACTIVE insurance) or RECORD_RETURN (ABROAD -> RETURNED_HOME)."
    roles: [ProgramCoordinator]
    code: 200
    input: [action]
    output: Application
    side_effects: ["DEPART: status := ABROAD. RECORD_RETURN: status := RETURNED_HOME, seats_taken -= 1; version += 1"]
  - method: POST
    path: "/api/v1/applications/{id}/course-preapprovals"
    description: "Create a course pre-approval under an application. Supersedes an existing PENDING/APPROVED record with the same course_code. OCC-guarded by expected_application_version."
    roles: [Student]
    code: 201
    input: [course_code, course_title, host_credits, expected_application_version]
    output: CoursePreApproval
    side_effects: ["existing same-course_code PENDING/APPROVED record -> SUPERSEDED; home_credits_est computed per transfer_credit_conversion; application.version += 1"]
  - method: GET
    path: "/api/v1/applications/{id}/course-preapprovals"
    description: "List course pre-approvals of an application."
    roles: [ProgramCoordinator, FacultyApprover, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: CoursePreApproval[]
    side_effects: []
  - method: POST
    path: "/api/v1/course-preapprovals/{id}/review"
    description: "Faculty review of a PENDING pre-approval: APPROVED, NEEDS_REVISION, or REJECTED."
    roles: [FacultyApprover]
    code: 200
    input: [decision, "review_notes?"]
    output: CoursePreApproval
    side_effects: ["status := decision; reviewed_by := X-User-ID; version += 1"]
  - method: POST
    path: "/api/v1/course-preapprovals/{id}/revise"
    description: "Student revises a NEEDS_REVISION pre-approval back to PENDING with new credit data."
    roles: [Student]
    code: 200
    input: [host_credits, "course_title?"]
    output: CoursePreApproval
    side_effects: ["status := PENDING; home_credits_est recomputed; version += 1"]
  - method: POST
    path: "/api/v1/travel-advisories"
    description: "Create a travel advisory (ACTIVE). Rejects half-open-window overlap per country. A DO_NOT_TRAVEL advisory whose window fully contains an OPEN program's dates suspends that program (cascade)."
    roles: [SafetyOfficer]
    code: 201
    input: [country_code, level, effective_from, effective_to]
    output: TravelAdvisory
    side_effects: ["if level == DO_NOT_TRAVEL: for each OPEN Program with matching country_code whose [start_date, end_date] is fully contained in the advisory window: Program -> SUSPENDED, then per Application IN {APPROVED, COMMITTED}: -> WITHDRAWN (SYSTEM_SUSPENSION), then per withdrawn COMMITTED application: BillingStatement -> VOID (credit memo) and InsuranceEnrollment -> CANCELLED"]
  - method: POST
    path: "/api/v1/travel-advisories/{id}/lift"
    description: "Lift an ACTIVE advisory (ACTIVE -> LIFTED). Does not un-suspend programs."
    roles: [SafetyOfficer]
    code: 200
    input: []
    output: TravelAdvisory
    side_effects: ["status := LIFTED; version += 1"]
  - method: POST
    path: "/api/v1/insurance-enrollments"
    description: "Enroll a COMMITTED application in emergency insurance; coverage must fully contain the program dates; travel-advisory safety gate applies."
    roles: [Student]
    code: 201
    input: [application_id, provider, coverage_start_date, coverage_end_date]
    output: InsuranceEnrollment
    side_effects: ["status := ACTIVE"]
  - method: GET
    path: "/api/v1/insurance-enrollments"
    description: "List insurance enrollments, filterable by application_id."
    roles: [ProgramCoordinator, BursarOffice, Student]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: InsuranceEnrollment[]
    side_effects: []
  - method: GET
    path: "/api/v1/insurance-enrollments/{id}"
    description: "Read one insurance enrollment. Student role only for own application's enrollment."
    roles: [ProgramCoordinator, BursarOffice, Student]
    code: 200
    input: []
    output: InsuranceEnrollment
    side_effects: []
  - method: POST
    path: "/api/v1/insurance-enrollments/{id}/cancel"
    description: "Cancel an ACTIVE enrollment; forbidden while the linked application is ABROAD."
    roles: [Student, ProgramCoordinator]
    code: 200
    input: []
    output: InsuranceEnrollment
    side_effects: ["status := CANCELLED; version += 1"]
  - method: GET
    path: "/api/v1/billing-statements"
    description: "List billing statements, filterable by application_id / status."
    roles: [BursarOffice, ProgramCoordinator]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: BillingStatement[]
    side_effects: []
  - method: GET
    path: "/api/v1/billing-statements/{id}"
    description: "Read one billing statement including computed outstanding_cents."
    roles: [BursarOffice, ProgramCoordinator]
    code: 200
    input: []
    output: BillingStatement
    side_effects: []
  - method: POST
    path: "/api/v1/billing-statements/{id}/payments"
    description: "Record a payment against an ISSUED/PARTIALLY_PAID statement; exact outstanding amount transitions to PAID."
    roles: [BursarOffice]
    code: 200
    input: [amount_cents]
    output: BillingStatement
    side_effects: ["amount_paid_cents += amount_cents; outstanding_cents recomputed; status -> PARTIALLY_PAID or PAID; version += 1"]
  - method: POST
    path: "/api/v1/incidents"
    description: "Report an on-site incident for an ABROAD application."
    roles: [Student, ProgramCoordinator]
    code: 201
    input: [application_id, severity, description]
    output: Incident
    side_effects: ["status := REPORTED; reported_by := X-User-ID"]
  - method: GET
    path: "/api/v1/incidents"
    description: "List incidents, filterable by application_id / status."
    roles: [SafetyOfficer, ProgramCoordinator]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []
  - method: GET
    path: "/api/v1/incidents/{id}"
    description: "Read one incident."
    roles: [SafetyOfficer, ProgramCoordinator]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/api/v1/incidents/{id}/transition"
    description: "Advance incident triage: REPORTED -> TRIAGED -> ESCALATED -> RESOLVED, or TRIAGED -> RESOLVED."
    roles: [SafetyOfficer]
    code: 200
    input: [to_state, "resolution_notes?"]
    output: Incident
    side_effects: ["status := to_state; resolution_notes when RESOLVED; version += 1"]
  - method: POST
    path: "/api/v1/applications/{id}/credit-postings"
    description: "Upload a return transcript as a CreditPosting (PENDING) for a RETURNED_HOME application; computes provisional_credits and final_credits."
    roles: [FacultyApprover]
    code: 201
    input: [lines]
    output: CreditPosting
    side_effects: ["provisional_credits and final_credits computed per transfer_credit_conversion"]
  - method: GET
    path: "/api/v1/applications/{id}/credit-postings"
    description: "List credit postings of an application."
    roles: [FacultyApprover, ProgramCoordinator, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditPosting[]
    side_effects: []
  - method: POST
    path: "/api/v1/credit-postings/{id}/post"
    description: "Post a PENDING credit posting; flips the application to CREDIT_POSTED with transfer_credits_posted := final_credits."
    roles: [FacultyApprover]
    code: 200
    input: []
    output: CreditPosting
    side_effects: ["status := POSTED; posted_by := X-User-ID; Application RETURNED_HOME -> CREDIT_POSTED; application.transfer_credits_posted := final_credits; version += 1"]
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ProgramCoordinator, SafetyOfficer, FacultyApprover, BursarOffice]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID headers missing or role unknown"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted on endpoint, or Student-role caller touches a resource whose student_id != X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "approve caller's X-User-ID equals application.clearance_recorded_by"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path or body reference to a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, invalid enum member, range violation, or malformed date ordering"
  - id: ERR_PROGRAM_FEE_REQUIRED
    http: 422
    condition: "billing_model == PROGRAM_FEE without a positive program_fee_cents"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "state-machine precondition violated (invalid from-state, terminal-state touch, or cross-entity state gate such as Program not OPEN or Application not RETURNED_HOME/ABROAD/COMMITTED)"
  - id: ERR_GPA_BELOW_MINIMUM
    http: 422
    condition: "student.gpa < program.min_gpa on application create"
  - id: ERR_CONDUCT_HOLD
    http: 422
    condition: "student.conduct_standing == CONDUCT_HOLD on application create"
  - id: ERR_APPLICATION_DEADLINE_PASSED
    http: 422
    condition: "logical clock > program.application_deadline on application create"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "an application for the same (student_id, program_id) exists with status IN {SUBMITTED, RETURNED_FOR_REVISION, CLEARED, APPROVED, COMMITTED, ABROAD, RETURNED_HOME}"
  - id: ERR_PROGRAM_FULL
    http: 409
    condition: "program.seats_taken >= program.capacity on commit"
  - id: ERR_TRAVEL_ADVISORY_BLOCK
    http: 422
    condition: "an ACTIVE DO_NOT_TRAVEL advisory for the program's country is in effect at the logical clock and overlaps the program dates (approve / insurance create)"
  - id: ERR_PROGRAM_SCHEDULE_BUFFER
    http: 409
    condition: "another Program at the same host_institution with status IN {DRAFT, OPEN} is separated by fewer than 7 days in either direction"
  - id: ERR_ADVISORY_WINDOW_OVERLAP
    http: 409
    condition: "new advisory's half-open window [effective_from, effective_to) intersects an ACTIVE advisory for the same country_code"
  - id: ERR_COVERAGE_WINDOW_INSUFFICIENT
    http: 422
    condition: "insurance coverage window does not fully contain the program dates"
  - id: ERR_INSURANCE_COVERAGE_MISSING
    http: 422
    condition: "DEPART attempted without an ACTIVE InsuranceEnrollment covering the program dates"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "an ACTIVE InsuranceEnrollment already exists for the application"
  - id: ERR_CANNOT_CANCEL_WHILE_ABROAD
    http: 422
    condition: "manual insurance cancel while the linked application is ABROAD"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "payment amount_cents > outstanding_cents"
  - id: ERR_PAYMENT_NOT_POSITIVE
    http: 422
    condition: "payment amount_cents <= 0"
  - id: ERR_PREAPPROVAL_INVALID
    http: 422
    condition: "credit-posting line references a CoursePreApproval that is missing, belongs to another application, or is not APPROVED"
  - id: ERR_DUPLICATE_CREDIT_POSTING
    http: 409
    condition: "a PENDING or POSTED CreditPosting already exists for the application"
  - id: ERR_GRADE_OUT_OF_RANGE
    http: 422
    condition: "transcript line grade_points outside 0.0..4.0"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 422
    condition: "publish attempted while the partner agreement is not ACTIVE"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_application_version does not match the application's current version (OCC on course-preapproval create)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "Applicant / program participant; acts only on resources it owns."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /api/v1/applications"
      - "POST /api/v1/applications/{id}/resubmit"
      - "POST /api/v1/applications/{id}/commit"
      - "POST /api/v1/applications/{id}/course-preapprovals"
      - "POST /api/v1/course-preapprovals/{id}/revise"
      - "POST /api/v1/insurance-enrollments"
    shared_operations:
      - "GET /api/v1/programs, GET /api/v1/programs/{id} (catalog read, all roles)"
      - "GET /api/v1/students/{id} (self only; ProgramCoordinator unrestricted)"
      - "GET /api/v1/applications/{id} (own only; ProgramCoordinator unrestricted)"
      - "POST /api/v1/applications/{id}/withdraw (own; ProgramCoordinator any)"
      - "POST /api/v1/insurance-enrollments/{id}/cancel (own application's enrollment; ProgramCoordinator any)"
      - "POST /api/v1/incidents (own ABROAD application; ProgramCoordinator any)"
      - "GET /api/v1/applications/{id}/course-preapprovals, GET /api/v1/applications/{id}/credit-postings (own; staff roles unrestricted)"
      - "GET /api/v1/insurance-enrollments, GET /api/v1/insurance-enrollments/{id} (own application only; staff roles unrestricted)"
  - name: ProgramCoordinator
    description: "Study-abroad office administrator; runs catalog, clearance, approval, and lifecycle bookkeeping."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/partner-agreements, POST /api/v1/partner-agreements/{id}/activate"
      - "POST /api/v1/programs, POST /api/v1/programs/{id}/publish"
      - "POST /api/v1/students"
      - "POST /api/v1/applications/{id}/clearance"
      - "POST /api/v1/applications/{id}/approve (subject to segregation of duties)"
      - "POST /api/v1/applications/{id}/lifecycle"
      - "GET /api/v1/applications"
    shared_operations:
      - "catalog reads; student/application reads"
      - "POST /api/v1/applications/{id}/withdraw (shared with Student)"
      - "POST /api/v1/insurance-enrollments/{id}/cancel (shared with Student)"
      - "POST /api/v1/incidents (shared with Student)"
      - "GET /api/v1/insurance-enrollments, GET /api/v1/insurance-enrollments/{id} (shared with BursarOffice, Student)"
      - "GET /api/v1/billing-statements, GET /api/v1/billing-statements/{id} (shared with BursarOffice)"
      - "GET /api/v1/incidents, GET /api/v1/incidents/{id} (shared with SafetyOfficer)"
      - "POST /api/v1/_clock/set_current_utc (shared with all staff roles)"
  - name: FacultyApprover
    description: "Faculty member approving transfer courses and posting return credits."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/course-preapprovals/{id}/review"
      - "POST /api/v1/applications/{id}/credit-postings"
      - "POST /api/v1/credit-postings/{id}/post"
    shared_operations:
      - "catalog reads"
      - "GET /api/v1/applications/{id}/course-preapprovals, GET /api/v1/applications/{id}/credit-postings"
      - "POST /api/v1/_clock/set_current_utc"
  - name: SafetyOfficer
    description: "Health & safety officer; owns travel advisories and incident triage."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/travel-advisories, POST /api/v1/travel-advisories/{id}/lift"
      - "POST /api/v1/incidents/{id}/transition"
    shared_operations:
      - "catalog reads"
      - "GET /api/v1/incidents, GET /api/v1/incidents/{id} (shared with ProgramCoordinator)"
      - "POST /api/v1/_clock/set_current_utc"
  - name: BursarOffice
    description: "Billing office; records payments and reads statements."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/billing-statements/{id}/payments"
    shared_operations:
      - "catalog reads"
      - "GET /api/v1/billing-statements, GET /api/v1/billing-statements/{id} (shared with ProgramCoordinator)"
      - "GET /api/v1/insurance-enrollments (shared with ProgramCoordinator, Student)"
      - "POST /api/v1/_clock/set_current_utc"
