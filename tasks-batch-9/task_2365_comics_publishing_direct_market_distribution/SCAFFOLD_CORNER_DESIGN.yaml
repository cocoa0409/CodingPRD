    grounds: [state_machines.Title.PITCHED_to_GREENLIT, entities.Title.fields.greenlit_at, 'endpoints[POST
        /comics/titles/{id}/greenlight]']
    distinguishing_aspect: POST /comics/titles/{id}/greenlight on a PITCHED title returns GREENLIT with
      greenlit_at stamped from the logical clock (2026-08-01T00:00:00Z) and version bumped by 1.
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', one PITCHED title]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      - call: POST /comics/titles
