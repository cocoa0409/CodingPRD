          setup:
            - "Logical clock at 2026-09-02T06:00:00Z. Store S2 has a 600 lb case capacity so it stays OPEN. Items J1, J2 and B1 exist; associates A1 (DELI_CLERK, allergy_set [MILK, WHEAT]), A2 (DELI_MANAGER) and A3 (BAKERY_COORDINATOR) exist with A1 holding ACTIVE SLICER_OPERATION and FOOD_HANDLING certifications; slicers C2 and C3 are assigned to A1; ACTIVE price file PF1 covers the clock; a 30.0 lb J2 batch is completed."
            - "Promotion PX is ACTIVE over [2026-09-07, 2026-09-14) with required_bread_units 720, and BreadSupplyOrder BSO is CONFIRMED with committed_units 720, so it starts at reserved_units 0 and unreserved_required_units 720."
