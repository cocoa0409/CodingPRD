            - "The 2026 PER_ACRE payment was accrued (band 1 500000 + band 2 462500 = gross 962500, holdback 20.00 pct = 192500, net 770000) and then PAID, so Grower.net_paid_cents is 770000."
            - "The clock then advances to 2027-06-01T00:00:00Z and the 2027 payment is accrued on the same terms (net 770000, status ACCRUED), so Enrollment.accrued_payment_cents is 1540000."
            - "No credits were ever issued for this enrollment, so lifetime_credits_issued is 0 and no reversal exists."
