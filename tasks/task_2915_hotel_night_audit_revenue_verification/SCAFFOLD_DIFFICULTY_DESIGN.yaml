            - "GET /night-audit/journal-postings?allowance_id=${alw_self_id} returns an empty list and GET /night-audit/folios/${folio_f_id} returns balance_amount == 217.75, unchanged."
            - "Retrying the same over-request as NightAuditor u_na_2 then returns 422 ERR_APPROVED_AMOUNT_EXCEEDS_REQUEST, proving the fiscal rule is live and was merely outranked."

      - name: body_existence_outranks_sealed_date_state_on_manual_posting
        grounds: "§1.4 priority 22 existence ERR_FOLIO_NOT_FOUND (404) versus priority 31 state ERR_CHARGES_ALREADY_SEALED (409), both applying to POST /night-audit/journal-postings."
        distinguishing_aspect: >-
          An existence-versus-state pair, i.e. a band boundary crossed in the opposite direction
          from the two instances above: here the *earlier* band is existence, so a 404 must win
