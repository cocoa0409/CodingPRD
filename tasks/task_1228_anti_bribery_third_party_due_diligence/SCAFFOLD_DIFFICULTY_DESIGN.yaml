      - name: gift_rolling_window_lower_bound_exclusive
        grounds:
          - calculations.gift_rolling_window_total
          - entities.ThirdParty.fields.gov_gift_rolling_12m_cents
        distinguishing_aspect: |
          Interval semantics = sliding aggregate-capacity window (event_date - 365d,
          event_date] on the ThirdParty gift registry — different from the pairwise half-open
          overlap of audit windows. An entry dated exactly 365 days before the new event sits
          on the OPEN lower bound and is excluded; the same entry one day later would count.
        test_recipe:
          setup:
            - "Clock set back to 2025-05-31 (clock is freely settable); policy P1 ACTIVE; country CH cpi_score=80; ThirdParty in DD_REVIEW"
            - "E1: APPROVED gov-official entry 30000 cents fx 1.0 event 2025-05-31 (prospective 30000 >= 25000 -> enhanced, approved WITH evidence); rolling = 30000"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2025-05-31T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "CH", cpi_score: 80 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "CH Tech GmbH", country_code: "CH", industry: "TECHNOLOGY", government_touchpoint: "NONE" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { c0: "$.data[0].id", c1: "$.data[1].id", c2: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${c0}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${c1}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${c2}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/third-parties/${tp_id}/gift-hospitality-entries", payload: { entry_type: "HOSPITALITY", recipient_is_government_official: true, value_cents: 30000, fx_rate_to_usd: 1.0, event_date: "2025-05-31" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { e1: $.data.id } }
            - { call: "POST /compliance/gift-hospitality-entries/${e1}/approve", payload: { enhanced_review_evidence: true }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties/${tp_id}/gift-hospitality-entries", payload: { entry_type: "GIFT", recipient_is_government_official: true, value_cents: 25000, fx_rate_to_usd: 1.0, event_date: "2026-05-31" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { e2: $.data.id, e2_enh: $.data.requires_enhanced_approval } }
            - { call: "POST /compliance/gift-hospitality-entries/${e2}/approve", payload: { enhanced_review_evidence: true }, as: ComplianceOfficer, captures: { e2_st: $.data.entry_status } }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { roll: $.data.gov_gift_rolling_12m_cents } }
          assert:
            - "E1 (event 2025-05-31) is excluded from the window (2025-05-31, 2026-05-31] of E2 — open lower bound"
            - "captured e2_enh == true (prospective 25000 >= 25000) and e2_st == APPROVED; create was NOT hard-capped"
            - "captured roll == 25000, not 55000 — had the lower bound been inclusive, prospective would have been 55000 > 50000 and the create rejected with ERR_GIFT_CAP_EXCEEDED"

  - rule_id: compensating_invariant
    instances:
      - name: gift_void_restores_rolling_total
        grounds:
          - calculations.gift_rolling_window_total
          - state_machines.GiftHospitalityEntry.APPROVED_to_VOIDED
          - entities.ThirdParty.fields.gov_gift_rolling_12m_cents
        distinguishing_aspect: |
          Conserved quantity INV-GIFT = gov_gift_rolling_12m_cents: the forward action
          (approve 8000) and its compensating action (void the same entry) must leave the
          aggregate exactly at its pre-forward value 20000, i.e.
          rolling == sum(value_usd_cents over APPROVED gov-official entries in window).
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country CH cpi_score=80; ThirdParty in DD_REVIEW"
            - "E1 20000 APPROVED (rolling 20000); E2 8000 created (prospective 28000 >= 25000 -> enhanced) and APPROVED with evidence (rolling 28000)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "CH", cpi_score: 80 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "CH Tech GmbH", country_code: "CH", industry: "TECHNOLOGY", government_touchpoint: "NONE" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { c0: "$.data[0].id", c1: "$.data[1].id", c2: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${c0}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${c1}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${c2}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/third-parties/${tp_id}/gift-hospitality-entries", payload: { entry_type: "GIFT", recipient_is_government_official: true, value_cents: 20000, fx_rate_to_usd: 1.0, event_date: "2026-05-05" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { e1: $.data.id } }
            - { call: "POST /compliance/gift-hospitality-entries/${e1}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/gift-hospitality-entries", payload: { entry_type: "GIFT", recipient_is_government_official: true, value_cents: 8000, fx_rate_to_usd: 1.0, event_date: "2026-05-06" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { e2: $.data.id } }
            - { call: "POST /compliance/gift-hospitality-entries/${e2}/approve", payload: { enhanced_review_evidence: true }, as: ComplianceOfficer }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { roll_before: $.data.gov_gift_rolling_12m_cents } }
          trigger:
            - { call: "POST /compliance/gift-hospitality-entries/${e2}/void", payload: { reason: "reported in error" }, as: ComplianceOfficer, captures: { e2_st: $.data.entry_status } }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { roll_after: $.data.gov_gift_rolling_12m_cents } }
          assert:
            - "captured roll_before == 28000 (20000 + 8000) and roll_after == 20000 — void compensates the approve exactly, zero drift"
            - "captured e2_st == VOIDED"

      - name: payment_reverse_restores_contract_ledger
        grounds:
          - state_machines.PaymentRequest.SUBMITTED_to_APPROVED
          - state_machines.PaymentRequest.APPROVED_to_REVERSED
          - entities.Contract.fields.approved_payments_total_cents
        distinguishing_aspect: |
          Conserved quantity INV-PAY = Contract.approved_payments_total_cents (a money ledger,
          different quantity than the gift aggregate): two approvals (90000 + 40000) followed
          by reversing the first must leave the ledger at exactly 40000 ==
          sum(APPROVED amounts) - sum(REVERSED amounts), never negative.
        test_recipe:
          setup:
            - "Clock 2026-05-01; policy P1 ACTIVE; country CH cpi_score=80 (norm 20 -> multiplier 1.00 -> effective cap 15.00)"
            - "ThirdParty APPROVED (LOW); contract 1000000 ACTIVE with VERIFIED certification"
            - "P1 90000 (9.00 <= 15) APPROVED by u_fin1; P2 40000 (4.00) APPROVED by u_fin1; ledger 130000"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/country-risk-profiles", payload: { country_code: "CH", cpi_score: 80 }, as: ComplianceAdmin }
            - { call: "POST /compliance/risk-scoring-policies", payload: { w_country: 50, w_industry: 30, w_touchpoint: 20, tier_medium_min: 40, tier_high_min: 70, tier_critical_min: 90, commission_base_cap_pct: 15, commission_hard_cap_pct: 25 }, as: ComplianceAdmin, captures: { pol_id: $.data.id, pol_v: $.data.version } }
            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "CH Tech GmbH", country_code: "CH", industry: "TECHNOLOGY", government_touchpoint: "NONE" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tp_id: $.data.id } }
            - { call: "POST /compliance/third-parties/${tp_id}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tp_id}/screening-checks", as: ComplianceOfficer, captures: { c0: "$.data[0].id", c1: "$.data[1].id", c2: "$.data[2].id" } }
            - { call: "POST /compliance/screening-checks/${c0}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${c1}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "POST /compliance/screening-checks/${c2}/disposition", payload: { outcome: "CLEAR" }, as: ScreeningAnalyst }
            - { call: "GET /compliance/third-parties/${tp_id}", as: ComplianceOfficer, captures: { tp_v: $.data.version } }
            - { call: "POST /compliance/third-parties/${tp_id}/questionnaires", payload: { expected_third_party_version: "${tp_v}" }, as: ComplianceOfficer, captures: { q_id: $.data.id } }
            - { call: "POST /compliance/questionnaires/${q_id}/submit", payload: { government_ownership_pct: 0, has_facilitation_payments: false, uses_sub_agents: false }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/questionnaires/${q_id}/accept", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/third-parties/${tp_id}/contracts", payload: { contract_value_cents: 1000000, start_date: "2026-05-02", end_date: "2027-05-01" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { ct_id: $.data.id } }
            - { call: "POST /compliance/contracts/${ct_id}/attach-clauses", payload: { clause_codes: ["ABAC"] }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/third-parties/${tp_id}/certifications", payload: { cert_type: "ANNUAL_ABAC" }, as: ComplianceOfficer, captures: { cert_id: $.data.id } }
            - { call: "POST /compliance/certifications/${cert_id}/submit", payload: { document_ref: "s3://certs/ch.pdf" }, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "POST /compliance/certifications/${cert_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/contracts/${ct_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /compliance/contracts/${ct_id}/payment-requests", payload: { payment_type: "COMMISSION", amount_cents: 90000 }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { p1: $.data.id } }
            - { call: "POST /compliance/contracts/${ct_id}/payment-requests", payload: { payment_type: "COMMISSION", amount_cents: 40000 }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { p2: $.data.id } }
            - { call: "POST /compliance/payment-requests/${p1}/approve", payload: {}, as: FinanceReviewer, as_user_id: "u_fin1" }
            - { call: "POST /compliance/payment-requests/${p2}/approve", payload: {}, as: FinanceReviewer, as_user_id: "u_fin1" }
            - { call: "GET /compliance/contracts/${ct_id}", as: FinanceReviewer, captures: { ledger_before: $.data.approved_payments_total_cents } }
          trigger:
            - { call: "POST /compliance/payment-requests/${p1}/reverse", payload: { reason: "duplicate invoice" }, as: FinanceReviewer, as_user_id: "u_fin2", captures: { p1_st: $.data.payment_status } }
            - { call: "GET /compliance/contracts/${ct_id}", as: FinanceReviewer, captures: { ledger_after: $.data.approved_payments_total_cents } }
          assert:
            - "captured ledger_before == 130000 and ledger_after == 40000 — reverse compensates the approval exactly"
            - "captured p1_st == REVERSED; P2 remains APPROVED"
            - "ledger invariant holds: 40000 == sum(APPROVED amounts 40000) - sum(REVERSED amounts 0 net of pairing) and >= 0"
