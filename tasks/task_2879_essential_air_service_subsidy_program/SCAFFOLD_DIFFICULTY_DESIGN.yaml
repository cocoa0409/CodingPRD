          - errors.ERR_SUBSIDY_PER_PASSENGER_CAP_EXCEEDED
        conflicting_pair:
          higher: { priority: 6, category: state, error_id: ERR_PROPOSAL_NOT_SUBMITTABLE, http_status: 409 }
          lower: { priority: 29, category: business_fiscal, error_id: ERR_SUBSIDY_PER_PASSENGER_CAP_EXCEEDED, http_status: 422 }
        distinguishing_aspect: |
