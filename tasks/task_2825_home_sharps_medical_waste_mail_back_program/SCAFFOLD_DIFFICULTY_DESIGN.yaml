        distinguishing_aspect: |
          A different combinatorial axis from the rounding-order instance: here the trap is WHICH BASIS
          keys the volume-rebate tier table when three terms (catalog base, weight-driven transport,
          per-unit destruction) combine into a single settlement that lands exactly on a tier edge.
          Mode (a) tier keyed on the PRE-rebate cumulative basis 15000 -> 3% -> final 14550 (pinned);
          mode (b) tier keyed on the POST-rebate cumulative total -> basis 0 at the first settlement
          -> 0% -> final 15000; mode (c) tier keyed on this kit alone but applied to the cumulative
          total -> 450 charged against a 0 basis. Only mode (a) is correct, and the setup pins the
          basis exactly on the 15000 edge so an off-by-one tier comparison (> instead of >=) also fails.
