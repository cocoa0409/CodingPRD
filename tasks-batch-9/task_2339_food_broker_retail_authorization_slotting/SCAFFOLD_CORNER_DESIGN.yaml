        grounds:
          - roles.PrincipalPortalUser
          - validations.v-principal-scope
          - errors.ERR_PRINCIPAL_SCOPE_FORBIDDEN
        distinguishing_aspect: |
          PrincipalPortalUser is entity-backed on Principal with an empty
          exclusive_operations list, so it is the only role whose every business
          write is a 403 and whose every read is filtered by identity. Single-
          resource reads of another principal's rows are a priority-5 403, while
          LIST reads are scoped by filtering rather than by erroring — and because
          the role check sits at priority 2, a write aimed at its OWN principal is
          still ERR_ROLE_FORBIDDEN and never ERR_PRINCIPAL_SCOPE_FORBIDDEN.
        test_recipe:
          setup:
            - "Retailer BIGMART; principals NWF (${p1}) and SGF (${p2}); item i1 owned by NWF and item i2 owned by SGF; one deduction against SGF; an ACTIVE FROZEN_SNACKS agreement for NWF so its statement is readable."
