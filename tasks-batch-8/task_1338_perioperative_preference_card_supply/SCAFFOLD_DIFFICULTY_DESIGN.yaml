            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_7}", supply_item_id: "${item_a}", quantity: 8, designation: "OPEN", pick_sequence: 1 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_7}", supply_item_id: "${item_c}", quantity: 1, designation: "OPEN", pick_sequence: 2 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_7}", supply_item_id: "${item_w7}", quantity: 1, designation: "HOLD", pick_sequence: 3 }, as: SupplyChainAnalyst }
            - { call: "POST /perioperative/preference-card-lines", payload: { card_id: "${card_7}", supply_item_id: "${item_g}", quantity: 1, designation: "OPEN", pick_sequence: 4 }, as: SupplyChainAnalyst }
            - { call: "GET /perioperative/preference-cards/${card_7}", as: Any, captures: { card_7_v: "$.data.version" } }
