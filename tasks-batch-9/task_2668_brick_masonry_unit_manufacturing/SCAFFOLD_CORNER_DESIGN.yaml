              captures: { loaded_2: "$.data.loaded_units", kr1v3: "$.data.version" }
          assert:
            - "${positions} == 5"
            - "${e_cap} == ERR_KILN_CAR_CAPACITY_EXCEEDED with HTTP 422 - 6000 green units will not fit on a 5000-unit car, and the run is never created"
            - "${e_pos} == ERR_INVALID_KILN_POSITION with HTTP 422 - position 6 is outside 1..${positions}"
            - "${loaded_1} == 9600 and ${kr1v2} == ${kr1v1} + 1 - the rejected load left the version at 1, so the same expected_kiln_run_version still worked"
            - "${net_2} == 3900 == 4000 - 100"
            - "${e_occ} == ERR_KILN_POSITION_OCCUPIED with HTTP 409 - R1 already holds position 3 on this kiln run"
            - "${loaded_2} == 13500 == 9600 + 3900 and ${kr1v3} == ${kr1v2} + 1 - only the position 4 load is accepted"
            - "GET /production-runs filtered on kiln_run_id ${kr1} returns total_count == 2, both LOADED, at positions 3 and 4"

      - name: qualifying_against_a_depleted_pit_returns_clay_pit_suspended_while_the_plant_is_still_active
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLAY_PIT_SUSPENDED]
          - validations[priority=11]
          - state_machines.ClayPit
        distinguishing_aspect: "The blocking pit reaches its unusable state through the clay ledger rather than through the plant-idle cascade, so the plant remains ACTIVE and the higher-priority ERR_PLANT_IDLED cannot mask this code."
        test_recipe:
          setup:
            - "Pit A is the plant's only pit with a proven_reserve_tons of exactly 16.00"
            - "Formulation F1 draws 100% from pit A at 3.20 tons per thousand units"
            - "A 5000-unit run commits 5000 / 1000 * 3.20 == 16.00 tons, driving available_tons to exactly 0.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-001"
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CRANE"] }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 16.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { pit_a: "$.data.id", avail_0: "$.data.available_tons", pit_status_0: "$.data.status" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 100.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f1_status: "$.data.status", f1_grade: "$.data.computed_durability_grade" }
            - call: "POST /plants/${p1}/kiln-cars"
              payload: { car_code: "C1", capacity_green_units: 12000 }
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { c1: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${p1}", formulation_id: "${f1}", kiln_car_id: "${c1}", run_code: "R1", texture: "WIRE_CUT", green_units_set: 5000 }
              as: PlantOperator
              as_user_id: "${p1}"
              captures: { r1: "$.data.id", committed: "$.data.clay_tons_committed" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F2", target_color_family: "RED", target_cdi: 21.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.00 }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f2: "$.data.id", f2v1: "$.data.version" }
            - call: "POST /formulations/${f2}/components"
              payload: { pit_id: "${pit_a}", share_pct: 100.00, expected_formulation_version: "${f2v1}" }
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f2v2: "$.data.version", f2_total: "$.data.component_share_total_pct" }
          trigger:
            - call: "GET /plants/${p1}/clay-pits"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { avail_1: "$.data[0].available_tons", comm_1: "$.data[0].committed_tons", pit_status_1: "$.data[0].status" }
            - call: "POST /formulations/${f2}/qualify"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { e_pit: "$.data.error_id" }
            - call: "GET /plants/${p1}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-001"
              captures: { plant_status: "$.data.status" }
            - call: "GET /formulations/${f2}"
              payload: {}
              as: BodyEngineer
              as_user_id: "body-001"
              captures: { f2_status: "$.data.status", f2_qual_at: "$.data.qualified_at", f2v3: "$.data.version" }
          assert:
            - "${avail_0} == 16.00 with ${pit_status_0} == OPEN, and ${f1_status} == QUALIFIED with ${f1_grade} == MW (absorption_index 10.80 on a pure high-iron clay body)"
            - "${committed} == 16.00 == round(5000 / 1000 * 3.20, 2)"
            - "${avail_1} == 0.00, ${comm_1} == 16.00 and ${pit_status_1} == DEPLETED - the whole proven reserve is spoken for"
            - "${f2_total} == 100.00 - appending pit A to F2 is still allowed, because the pit-status gate lives on qualify only"
            - "${e_pit} == ERR_CLAY_PIT_SUSPENDED with HTTP 409"
            - "${plant_status} == ACTIVE - nothing was idled, so the priority 10 ERR_PLANT_IDLED cannot be the answer here"
            - "${f2_status} == DRAFT with ${f2_qual_at} == null and ${f2v3} == ${f2v2} - the rejected qualify changed nothing"

