              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002", "03130003"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id }
          trigger:
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Sponsor
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_unknown_actor: $.data.error_id }
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Auditor
              as_user_id: "${sponsor_id}"
              captures: { e_unknown_role: $.data.error_id }
            - call: "POST /mitigation/banks/00000000-0000-0000-0000-000000000000/conservation-easement"
              payload: { deed_reference: "BK4412-PG221" }
              as: Sponsor
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_auth_before_404: $.data.error_id }
          assert:
            - "${e_unknown_actor} == ERR_UNAUTHENTICATED with HTTP 401 (X-User-ID resolves to no actor)"
            - "${e_unknown_role} == ERR_UNAUTHENTICATED with HTTP 401 (X-Role is not one of Sponsor, Permittee, IRTMember, IRTChair, ProgramAdmin)"
