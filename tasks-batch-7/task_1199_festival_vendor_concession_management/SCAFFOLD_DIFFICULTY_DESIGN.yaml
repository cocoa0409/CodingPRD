  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_aggregate_capacity_semantics
        grounds:
          - calculations.load_in_capacity
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: aggregate-count. Two reservations from DIFFERENT
          assignments fully overlapping the SAME slot window are both admitted —
          the slot only sums vehicles (2 + 3 == 5 == max); the collision surface is
          the count, not the geometry. Resource: LoadInSlot.
        test_recipe:
          setup:
            - "Festival CURATED; CONFIRMED assignments A and B; slot S max_vehicles = 5, window 2026-07-10 08:00-11:00; clock at default 2026-05-01"
