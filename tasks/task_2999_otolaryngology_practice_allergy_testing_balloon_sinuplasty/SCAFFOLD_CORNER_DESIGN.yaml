              payload: { patient_id: "${pat_id}", procedure_type: "TONSILLECTOMY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-04T11:00:00Z", end_at: "2026-08-04T12:00:00Z", physician_user_id: "u_ent_1" }
