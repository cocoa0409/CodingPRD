          trigger:
            - call: "POST /herds/health-treatments"
              payload: { animal_id: "${a_id}", drug_name: "Penicillin", administered_at: "2026-06-09T08:00:00Z", milk_withhold_hours: 96, meat_withdrawal_hours: 240 }
