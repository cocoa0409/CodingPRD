          assert:
            - "response error_id == ERR_TRIP_TOO_LONG"
            - "http status == 422"

      - name: payout_below_minimum_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_PAYOUT_BELOW_MINIMUM]"]
        distinguishing_aspect: "A payout request of 100 cents (< MIN_PAYOUT_CENTS 5000) returns ERR_PAYOUT_BELOW_MINIMUM (422), before any balance check."
