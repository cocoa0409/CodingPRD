  - rule_id: non_linear_state_machine
    instances:

      - name: practice_parallel_affiliation_and_pathway_axes
        grounds:
          - state_machines.Practice.AFFILIATED_to_SUSPENDED
          - state_machines.Practice.ACTIVE_to_NOT_ADOPTED
          - state_machines.Practice.DEPARTING_to_AFFILIATED
          - entities.Practice.fields.pathway_steering_status
        distinguishing_aspect: "Practice carries two independent state axes on one row: affiliation_status cycles PROSPECTIVE->AFFILIATED->SUSPENDED->AFFILIATED while pathway_steering_status cycles NOT_ADOPTED->ACTIVE->SUSPENDED->ACTIVE->NOT_ADOPTED, and no transition on either axis consults the other."
        test_recipe:
          setup:
            - "Network N, practice P affiliated with an ACTIVE contract and an ACTIVE pricing agreement; one PUBLISHED pathway protocol; logical clock 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
