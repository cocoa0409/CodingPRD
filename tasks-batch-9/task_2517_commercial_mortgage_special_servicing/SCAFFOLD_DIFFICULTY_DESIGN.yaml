            - "FeeAccrual.${liq_fee_id}.basis_amount_usd == 7000000.00 — the GROSS proceeds, not the 6,580,000.00 net"
            - "FeeAccrual.${liq_fee_id}.rate_pct == 1.0 and FeeAccrual.${liq_fee_id}.amount_usd == 70000.00"
            - "FeeAccrual.${liq_fee_id}.amount_usd != 65800.00 — 1% of net proceeds is the wrong base"
            - "Advance.${advance_a_id}.status == REIMBURSED with reimbursed_interest_usd 6666.67 and reimbursed_principal_usd 200000.00"
            - "Advance.${advance_b_id}.status == REIMBURSED with reimbursed_interest_usd 3750.00 and reimbursed_principal_usd 150000.00"
            - "Loan.${loan_id}.accrued_unpaid_interest_usd == 0.00"
            - "Loan.${loan_id}.current_principal_balance_usd == 4100416.67"
            - "Loan.${loan_id}.realized_loss_usd == 4100416.67"
            - "Loan.${loan_id}.servicing_status == LIQUIDATED"
            - "Trust.${trust_id}.realized_loss_usd == 4100416.67"
            - "Trust.${trust_id}.excess_liquidation_proceeds_usd == 0.00"
            - "Trust.${trust_id}.controlling_class_notional_usd == 3899583.33 and Trust.${trust_id}.control_status == CONTROLLING"

  - rule_id: non_linear_state_machine
    instances:
      - name: loan_servicing_and_payment_dimensions_advance_independently
        grounds:
          - state_machines.Loan.CURRENT_to_DELINQUENT_30
          - state_machines.Loan.DELINQUENT_30_to_DELINQUENT_60
          - state_machines.Loan.DELINQUENT_60_to_DELINQUENT_90_PLUS
          - state_machines.Loan.DELINQUENT_30_to_CURRENT
          - state_machines.Loan.CURRENT_to_CURRENT
          - state_machines.Loan.MASTER_SERVICING_to_SPECIAL_SERVICING
          - entities.Loan.fields.consecutive_timely_payments
        distinguishing_aspect: |
          The Loan carries two independent state dimensions on one row: driving payment_status all
          the way down to DELINQUENT_90_PLUS and back up to CURRENT never moves servicing_status,
          and transferring servicing_status to SPECIAL_SERVICING never moves payment_status off
          DELINQUENT_90_PLUS. The self-loop CURRENT -> CURRENT is a genuine non-linear edge: it
          leaves the state unchanged while incrementing consecutive_timely_payments, so three
          successive identical requests are three distinct observable effects, not idempotent no-ops.
        test_recipe:
          setup:
            - "One trust and one loan, freshly created, therefore servicing_status MASTER_SERVICING and payment_status CURRENT with consecutive_timely_payments 0."
            - "No manual transfer event is recorded: the qualifying event is produced by the payment dimension's own DELINQUENT_30 -> DELINQUENT_60 cascade."
            - "Logical clock held at the default 2026-08-01T00:00:00Z for the whole scenario so transferred_to_special_on and asset_business_plan_due_date are exact."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-D1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-D01", original_balance_usd: 9000000, current_principal_balance_usd: 8500000, note_rate_pct: 5.5, monthly_debt_service_usd: 52000, maturity_date: "2030-01-01T00:00:00Z", securitization_value_usd: 12000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "DELINQUENT_30", as_of_date: "2026-08-05T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "DELINQUENT_60", as_of_date: "2026-09-04T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "DELINQUENT_90_PLUS", as_of_date: "2026-10-04T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { servicing_after_ladder: "$.data.servicing_status", appraisal_required: "$.data.appraisal_required" }
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { payment_after_transfer: "$.data.payment_status", transfer_code: "$.data.transfer_event_code" }
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2026-10-10T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { cpt_after_cure: "$.data.consecutive_timely_payments" }
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2026-11-10T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/payment-status"
              payload: { to_status: "CURRENT", as_of_date: "2026-12-10T00:00:00Z", timely_payment_recorded: true }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { cpt_final: "$.data.consecutive_timely_payments", servicing_final: "$.data.servicing_status", payment_final: "$.data.payment_status" }
            - call: "GET /special-servicing/loans/${loan_id}/transfer-events"
              payload: { event_code: "MONETARY_DEFAULT_60D" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { auto_event_code: "$.data[0].event_code", auto_event_consumed: "$.data[0].consumed_by_transfer" }
          assert:
            - "After the three delinquency steps, servicing_status is still MASTER_SERVICING — the payment dimension moved alone"
            - "Loan.${loan_id}.appraisal_required == true after DELINQUENT_90_PLUS"
            - "Immediately after the servicing transfer, payment_status is still DELINQUENT_90_PLUS — the servicing dimension moved alone"
            - "Loan.${loan_id}.transfer_event_code == MONETARY_DEFAULT_60D (the auto-recorded event, not a manually posted one)"
            - "The auto-recorded ServicingTransferEvent has triggers_transfer == true and consumed_by_transfer == true after the transfer"
            - "Loan.${loan_id}.transferred_to_special_on == 2026-08-01T00:00:00Z and asset_business_plan_due_date == 2026-09-30T00:00:00Z"
            - "consecutive_timely_payments == 1 after the cure, then 2, then 3 — the CURRENT -> CURRENT self-loop is not a no-op"
            - "Loan.${loan_id}.payment_status == CURRENT and Loan.${loan_id}.servicing_status == SPECIAL_SERVICING at the end: the combined state is (SPECIAL_SERVICING, CURRENT), which no single-dimension machine can represent"

      - name: borrower_request_info_requested_cycle_capped_at_two_rounds
        grounds:
          - state_machines.BorrowerRequest.UNDER_ANALYSIS_to_INFO_REQUESTED
          - state_machines.BorrowerRequest.SUBMITTED_to_UNDER_ANALYSIS
          - entities.BorrowerRequest.fields.info_request_count
          - validations[priority=21]
          - errors.ERR_INFO_REQUEST_LIMIT_EXCEEDED
        distinguishing_aspect: |
          UNDER_ANALYSIS and INFO_REQUESTED form a cycle that is entered by the SAME transition each
          time (INFO_REQUESTED re-enters UNDER_ANALYSIS through the SUBMITTED -> UNDER_ANALYSIS edge)
          and the loop is bounded by a counter that only ever increases: the second lap succeeds and
          the third is refused with ERR_INFO_REQUEST_LIMIT_EXCEEDED (422). Re-entering the cycle also
          nulls any recorded analysis, so a conclusion earned in lap one does not survive lap two.
        test_recipe:
          setup:
            - "One trust, one loan transferred to special servicing."
            - "One ASSUMPTION borrower request with the 15,000.00 assumption deposit floor, moved to UNDER_ANALYSIS."
            - "A servicing standard analysis is recorded in lap one so the cycle's invalidation side effect is observable."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-I1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
