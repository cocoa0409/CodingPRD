  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: traveler_coverage_intervals_half_open_adjacency_allowed
        grounds:
          - validations[priority=14]
          - errors[ERR_COVERAGE_OVERLAP]
          - entities.Policy.fields.trip_start_at
          - entities.Policy.fields.trip_end_at
          - entities.InsuredTraveler.fields.traveler_id
        distinguishing_aspect: |
          Interval semantics #1 (half-open [trip_start_at, trip_end_at), adjacency
          allowed): adding the same Traveler as insured on a second policy whose trip
          interval OVERLAPS an existing covered policy is rejected ERR_COVERAGE_OVERLAP,
          but a back-to-back interval starting exactly when the first ends is accepted.
        test_recipe:
          setup:
            - "Traveler is COVERED on policy P1 (trip 2026-07-01 .. 2026-07-15). A new policy P2 trip 2026-07-10 .. 2026-07-20 overlaps."
          setup_api_calls:
            - call: "POST /plans"
              payload: { code: "OVL-1", tier: "BASIC", base_rate_bps: 400, cancellation_limit_pct: 100, medical_limit_cents: 500000, delay_block_cap_cents: 20000, delay_limit_cents: 100000, baggage_item_sublimit_cents: 30000, baggage_limit_cents: 100000, baggage_depreciation_bps: 2000, waiver_window_days: 14, free_look_days: 10, claim_filing_window_days: 90, cfar_loading_bps: 4000, cfar_reimbursement_pct: 75, senior_loading_bps: 5000 }
              as: CarrierAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t15@x.com", full_name: "T Fifteen", date_of_birth: "1990-01-01" }
              as: CarrierAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 500000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-01T00:00:00Z", trip_end_at: "2026-07-15T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /policies/${p1_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 500000 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /policies"
              payload: { plan_id: "${plan_id}", owner_traveler_id: "${trav_id}", trip_cost_cents: 400000, initial_deposit_at: "2026-05-25T00:00:00Z", trip_start_at: "2026-07-10T00:00:00Z", trip_end_at: "2026-07-20T00:00:00Z" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /policies/${p2_id}/insured-travelers"
              payload: { traveler_id: "${trav_id}", age_at_departure: 36, covered_trip_cost_cents: 400000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_COVERAGE_OVERLAP"

      - name: delay_claim_events_closed_interval_with_buffer_merge
        grounds:
