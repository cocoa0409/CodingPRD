            - { call: "POST /v1/documents/${t0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${t1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${t0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${t1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${ct}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${ct}/execute-transfer", payload: {}, as: RolloverProcessor, as_user_id: "proc-2" }
            - { call: "GET /v1/accounts/${a2}", as: RolloverProcessor, captures: { a2_status: "$.data.status" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", requested_amount_cents: 500000, withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { cy: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${cy}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${cy}/documents", as: RolloverProcessor, captures: { y0: "$.data[0].id", y1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${y0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${y1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${y0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
