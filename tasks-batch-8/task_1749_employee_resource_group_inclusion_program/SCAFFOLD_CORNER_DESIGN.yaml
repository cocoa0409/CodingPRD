  - section: cross_cutting_layers
    instances:
      - name: occ_stale_group_version_on_assign_sponsor
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[group-sponsor-assignment-stale]
          - "errors[ERR_STALE_GROUP_VERSION]"
        distinguishing_aspect: "Two strictly sequential assign-sponsor calls carrying the same observed version: the first succeeds (version 1 -> 2), the second is stale and rejected 412."
        test_recipe:
          setup: ["program OPEN; group CHARTER_DRAFT at version 1; two sponsors available"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sa3", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { spa: $.data.id } }
            - { call: "POST /v1/sponsors", payload: { employee_id: "emp_sb3", max_groups: 3, max_mentees: 2 }, as: DeiAdmin, captures: { spb: $.data.id } }
            - { call: "POST /v1/groups", payload: { program_id: "${pid}", name: "OCC Group", mission_statement: "m", category: "AFFINITY" }, as: GroupLeader, as_user_id: "emp_l61", captures: { g: $.data.id, gv: $.data.version } }
          trigger:
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${spa}", expected_group_version: "${gv}" }, as: DeiAdmin, captures: { v2: $.data.version } }
            - { call: "POST /v1/groups/${g}/assign-sponsor", payload: { sponsor_id: "${spb}", expected_group_version: "${gv}" }, as: DeiAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first assign succeeds and v2 == 2 (version incremented by the write)"
            - "second assign with the pre-write version ${gv} fails: err == ERR_STALE_GROUP_VERSION (HTTP 412)"
