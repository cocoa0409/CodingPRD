              as: DepartmentManager
              captures: { item_id: $.data.id }
            - call: "POST /fresh/lots"
              payload: { item_id: "${item_id}", production_date: "2026-08-05", quantity_original: 24 }
              as: FreshClerk
              captures: { lot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-13T12:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_ambient}", dock_door_code: "D1", scheduled_window_start: "2026-08-13T14:00:00.000Z", scheduled_window_end: "2026-08-13T15:00:00.000Z" }
              as: DepartmentManager
              captures: { pickup_ambient: $.data.id }
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_chilled}", dock_door_code: "D2", scheduled_window_start: "2026-08-13T14:00:00.000Z", scheduled_window_end: "2026-08-13T15:00:00.000Z" }
              as: DepartmentManager
              captures: { pickup_chilled: $.data.id }
          trigger:
