  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_suspend_reinstate_preserves_active_line_count
        grounds:
          - state_machines.PrivilegeGrant.ACTIVE_to_SUSPENDED
          - state_machines.PrivilegeGrant.SUSPENDED_to_ACTIVE
          - entities.MedicalStaffMember.fields.active_privilege_line_count
        distinguishing_aspect: |
          Conserved quantity: member.active_privilege_line_count. The lapse cascade
          (ACTIVE->SUSPENDED, count -= 1) paired with the renewal reinstatement
          (SUSPENDED->ACTIVE, count += 1) must return the count to exactly its pre-lapse
          value with suspension_reason cleared — no drift across the compensate pair.
        test_recipe:
          setup:
            - "Member INV1 ACTIVE with exactly one ACTIVE grant G-INV (fppe completed); STATE_LICENSE SL-INV expiring 2026-08-10"
            - "Clock advanced to 2026-08-11 to fire the lapse cascade (count 1 -> 0), then the credential is renewed with expires_on 2028-08-10"
