              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { tier1: $.data.address_search_tier, attempts1: $.data.address_search_attempts }
            - call: "POST /prt/participants/${lost_id}/address-searches"
              payload: { search_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { tier2: $.data.address_search_tier }
            - call: "POST /prt/participants/${lost_id}/address-searches"
              payload: { search_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { tier3: $.data.address_search_tier, addr3: $.data.address_status, attempts3: $.data.address_search_attempts, conf3: $.data.data_confidence_score }
          trigger:
            - call: "POST /prt/participants/${lost_id}/address-searches"
              payload: { search_result: "CONFIRMED_MATCH", confirmed_address_line1: "9 Ferry Street", confirmed_postal_code: "14602" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "GET /prt/participants/${lost_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { attempts_after: $.data.address_search_attempts, addr_after: $.data.address_status }
          assert:
            - "the three searches set address_search_tier TIER_1, TIER_2 then TIER_3 with address_search_attempts 1, 2 then 3"
            - "after the third the participant is address_status == UNLOCATABLE with data_confidence_score == 65 (100 - 25 unlocatable - 15 audit-not-started)"
            - "the fourth search returns 409 ERR_ADDRESS_SEARCH_TIER_EXHAUSTED even though it would have been a CONFIRMED_MATCH"
            - "${attempts_after} == 3 and ${addr_after} == UNLOCATABLE — the refused call incremented nothing and did not confirm the address"

      - name: buyout_gating_errors_each_have_their_own_code
        claim_type: triggerable
        grounds:
          - errors.ERR_STRATEGY_NOT_APPROVED
          - errors.ERR_TRANCHE_EMPTY
          - errors.ERR_MORTALITY_NOT_CONFIRMED
          - errors.ERR_INSURER_RATING_BELOW_FLOOR
        distinguishing_aspect: |
          Four gates guard the road to a quote and each names a different failure.
          The amendment gate is scope-sensitive: an APPROVED ANNUITY_BUYOUT strategy
          authorizes BUYOUT_ONLY but not BOTH, so the same call with a wider scope is
          still ERR_STRATEGY_NOT_APPROVED. Quoting then refuses an empty tranche, and
          once a participant is attached the mortality gate fires ahead of the
          data-cleanliness gate. Finally a carrier below the safest-available floor may
          not even be solicited.
        test_recipe:
          setup:
