            - "after discontinue: DrugCatalog.${drug_id}.on_hand_vials == 100 and Compound.${c1}.status == WASTED (lot total 100 conserved)"

      - name: payer_accumulator_conserved_on_post_then_void
        grounds:
          - invariants.inv_payer_accumulator
          - state_machines.Claim.DRAFT_to_POSTED
          - state_machines.Claim.POSTED_to_VOID
          - entities.PayerPlan.fields.deductible_remaining_cents
          - entities.PayerPlan.fields.oop_max_remaining_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity than vials = payer accumulator cents: post(claim) debits
          deductible_remaining_cents and oop_max_remaining_cents; void(claim) credits the same amounts back,
          returning both accumulators to their exact pre-post values (deductible 30000, oop 50000).
