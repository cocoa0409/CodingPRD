# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Corner Design (Coverage Index)
# Reliability Standard Compliance Audit & Violation Mitigation
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: registration_derives_applicable_standards_from_functions
        claim_type: computed_fields
        grounds: [entities.RegisteredEntity.fields.applicable_standards, entities.RegisteredEntity.fields.applicable_standard_count]
        distinguishing_aspect: "Registration with functions [GO, TO] yields applicable_standards covering STD-GO-001, STD-GO-002, STD-TO-001, STD-TO-002 (union per STANDARD_LIBRARY) and applicable_standard_count == 4."
        test_recipe:
          setup: ["clock at 2026-09-01"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
          trigger:
            - { call: "POST /compliance/registrations", payload: { legal_name: "Multi Func Co", registration_functions: ["GO", "TO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id, cnt: $.data.applicable_standard_count } }
          assert:
            - "captured cnt == 4"
            - "RegisteredEntity.${e1}.compliance_status == ACTIVE"
            - "RegisteredEntity.${e1}.open_violation_count == 0"
      - name: registration_missing_legal_name_rejected
        claim_type: required_fields
        grounds: [entities.RegisteredEntity.fields.legal_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required legal_name yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["clock at 2026-09-01"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
          trigger:
            - { call: "POST /compliance/registrations", payload: { registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
      - name: registration_invalid_function_code_rejected
        claim_type: type_constraints
        grounds: [entities.RegisteredEntity.fields.registration_functions, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A function code outside the 12-member enum (e.g. XX) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["clock at 2026-09-01"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
          trigger:
            - { call: "POST /compliance/registrations", payload: { legal_name: "Bad Func Co", registration_functions: ["GO", "XX"] }, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_REQUEST"
      - name: enrollment_self_logging_defaults_false
        claim_type: defaults
        grounds: [entities.RegisteredEntity.fields.enrollment_self_logging]
        distinguishing_aspect: "Registration without enrollment_self_logging stores false; a subsequent self-log attempt fails with ERR_SELF_LOG_NOT_ENROLLED."
        test_recipe:
          setup: ["clock at 2026-09-01; entity registered without the enrollment flag"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Default Flag Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id, flag: $.data.enrollment_self_logging } }
          trigger:
            - { call: "POST /compliance/self-log-entries", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", exception_note: "x" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "captured flag == false"
            - "captured err == ERR_SELF_LOG_NOT_ENROLLED"
      - name: patch_registration_recomputes_standards
        claim_type: computed_fields
        grounds: [entities.RegisteredEntity.fields.applicable_standards, entities.RegisteredEntity.fields.applicable_standard_count]
        distinguishing_aspect: "PATCH changing registration_functions from [GO] to [TO, BA] recomputes applicable_standard_count from 2 to 4 and swaps the standard ids."
        test_recipe:
          setup: ["clock at 2026-09-01; entity registered with [GO]"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Patch Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id, cnt_before: $.data.applicable_standard_count } }
          trigger:
            - { call: "PATCH /compliance/registrations/${e1}", payload: { registration_functions: ["TO", "BA"] }, as: RegistrationCoordinator, captures: { cnt_after: $.data.applicable_standard_count } }
          assert:
            - "captured cnt_before == 2"
            - "captured cnt_after == 4"
      - name: get_nonexistent_registration_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", entities.RegisteredEntity]
        distinguishing_aspect: "GET with a random UUID that matches no row returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["clock at 2026-09-01"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
          trigger:
            - { call: "GET /compliance/registrations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ComplianceAuditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND"
      - name: cip_asset_is_bes_derived_from_impact_rating
        claim_type: computed_fields
        grounds: [entities.CIPAsset.fields.is_bes_cyber_asset]
        distinguishing_aspect: "impact_rating HIGH yields is_bes_cyber_asset true; MEDIUM yields false; input-supplied value is ignored."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "CIP Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /compliance/cip-assets", payload: { entity_id: "${e1}", asset_name: "High One", impact_rating: "HIGH" }, as: CIPAssetManager, as_user_id: "${e1}", captures: { hi: $.data.is_bes_cyber_asset } }
            - { call: "POST /compliance/cip-assets", payload: { entity_id: "${e1}", asset_name: "Med One", impact_rating: "MEDIUM" }, as: CIPAssetManager, as_user_id: "${e1}", captures: { med: $.data.is_bes_cyber_asset } }
          assert:
            - "captured hi == true"
            - "captured med == false"
      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.RegisteredEntity]
        distinguishing_aspect: "Client-supplied id/created_at/version in the registration payload are ignored; the response carries server-minted values with version == 1."
        test_recipe:
          setup: ["clock at 2026-09-01"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
          trigger:
            - { call: "POST /compliance/registrations", payload: { legal_name: "SysFields Co", registration_functions: ["GO"], id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 99 }, as: RegistrationCoordinator, captures: { e1: $.data.id, ver: $.data.version } }
          assert:
            - "captured e1 != 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
            - "captured ver == 1"
      - name: list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /compliance/registrations with limit 2 and 3 rows present returns total_count 3, has_more true, and exactly 2 items; offset 2 returns the third with has_more false."
        test_recipe:
          setup: ["clock at 2026-09-01; three registrations created"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "P1", registration_functions: ["GO"] }, as: RegistrationCoordinator }
            - { call: "POST /compliance/registrations", payload: { legal_name: "P2", registration_functions: ["TO"] }, as: RegistrationCoordinator }
            - { call: "POST /compliance/registrations", payload: { legal_name: "P3", registration_functions: ["BA"] }, as: RegistrationCoordinator }
          trigger:
            - { call: "GET /compliance/registrations", payload: { limit: 2, offset: 0 }, as: ComplianceAuditor, captures: { total: $.meta.total_count } }
            - { call: "GET /compliance/registrations", payload: { limit: 2, offset: 2 }, as: ComplianceAuditor }
          assert:
            - "captured total == 3"
            - "first page has_more == true; second page has_more == false and contains exactly 1 item"
      - name: milestone_creation_in_draft_plan_rejected
        claim_type: parent_relationships
        grounds: ["validations[priority=25]", entities.Milestone.fields.plan_id, "errors[ERR_PLAN_STATE]"]
        distinguishing_aspect: "Milestones may only be added while the plan is APPROVED; adding to a SUBMITTED plan fails with ERR_PLAN_STATE."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; violation V1 OPEN; plan P1 created (SUBMITTED, not yet approved)"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "MileStone Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "p", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /compliance/mitigation-plans/${p1}/milestones", payload: { title: "too early", due_date: "2026-10-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_PLAN_STATE"

  - section: state_machines
    instances:
      - name: engagement_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.Engagement]
        distinguishing_aspect: "A newly created engagement has status SCHEDULED."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Init Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "SELF_CERTIFICATION", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: ComplianceAuditor, captures: { st: $.data.status } }
          assert:
            - "captured st == SCHEDULED"
      - name: engagement_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Engagement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is only defined from IN_PROGRESS; calling it on a SCHEDULED engagement fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; engagement SCHEDULED"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "InvTr Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
          trigger:
            - { call: "POST /compliance/engagements/${eng1}/complete", payload: {}, as: ComplianceAuditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"
      - name: engagement_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Engagement]
        distinguishing_aspect: "A COMPLETED engagement rejects start, cancel, and a second complete with ERR_INVALID_STATE."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; engagement completed"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Term Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/engagements/${eng1}/complete", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor, captures: { e_start: $.data.error_id } }
            - { call: "POST /compliance/engagements/${eng1}/cancel", payload: {}, as: ComplianceAuditor, captures: { e_cancel: $.data.error_id } }
            - { call: "POST /compliance/engagements/${eng1}/complete", payload: {}, as: ComplianceAuditor, captures: { e_complete: $.data.error_id } }
          assert:
            - "captured e_start == ERR_INVALID_STATE"
            - "captured e_cancel == ERR_INVALID_STATE"
            - "captured e_complete == ERR_INVALID_STATE"
      - name: engagement_start_before_period_start_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=10]", "errors[ERR_ENGAGEMENT_NOT_YET_OPEN]"]
        distinguishing_aspect: "Starting an engagement whose period_start lies in the future relative to the logical clock fails with ERR_ENGAGEMENT_NOT_YET_OPEN."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; engagement period 2026-10-01..2026-10-31"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Future Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
          trigger:
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_ENGAGEMENT_NOT_YET_OPEN"
      - name: evidence_double_accept_rejected
        claim_type: idempotency
        grounds: [state_machines.EvidenceArtifact, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED artifact fails with ERR_INVALID_STATE; no double coverage recompute occurs."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; engagement IN_PROGRESS; artifact A1 accepted once"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Idem Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: ComplianceAuditor, captures: { eng1: $.data.id } }
            - { call: "POST /compliance/engagements/${eng1}/start", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/evidence", payload: { engagement_id: "${eng1}", standard_id: "STD-GO-001", artifact_kind: "OPERATING_RECORD", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-01-31T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { a1: $.data.id } }
            - { call: "POST /compliance/evidence/${a1}/accept", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "POST /compliance/evidence/${a1}/accept", payload: {}, as: ComplianceAuditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"
      - name: milestone_missed_then_late_completion
        claim_type: valid_transition
        grounds: [state_machines.Milestone.PENDING_to_MISSED, state_machines.Milestone.MISSED_to_COMPLETED]
        distinguishing_aspect: "Clock sweep flips a PENDING milestone to MISSED once due_date passes; a late completion is still accepted and sets status COMPLETED with completed_at after due_date."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; violation with approved plan; milestone due 2026-09-10"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Late Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "p", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/milestones", payload: { title: "m", due_date: "2026-09-10T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { m1: $.data.id } }
            - { call: "POST /compliance/_clock/advance", payload: { seconds: 864000 }, as: RegionalEntityReviewer }
            - { call: "GET /compliance/milestones/${m1}", payload: {}, as: ComplianceAuditor, captures: { st_missed: $.data.status } }
          trigger:
            - { call: "POST /compliance/milestones/${m1}/complete", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { st_done: $.data.status } }
          assert:
            - "captured st_missed == MISSED"
            - "captured st_done == COMPLETED"
      - name: complete_mitigation_with_pending_milestone_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=17]", "errors[ERR_MILESTONES_INCOMPLETE]"]
        distinguishing_aspect: "complete-mitigation with one milestone still PENDING fails with ERR_MILESTONES_INCOMPLETE."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; violation MITIGATION_IN_PROGRESS with one PENDING milestone"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Pend Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "p", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/milestones", payload: { title: "m", due_date: "2026-10-01T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /compliance/violations/${v1}/complete-mitigation", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_MILESTONES_INCOMPLETE"
      - name: verify_plan_before_complete_mitigation_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MitigationPlan.APPROVED_to_VERIFIED, "errors[ERR_VIOLATION_STATE]"]
        distinguishing_aspect: "verify while the violation is still MITIGATION_IN_PROGRESS fails with ERR_VIOLATION_STATE (plan remains APPROVED)."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; violation MITIGATION_IN_PROGRESS, plan APPROVED, no milestones"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "EarlyVer Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "p", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "POST /compliance/mitigation-plans/${p1}/verify", payload: {}, as: ComplianceAuditor, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_VIOLATION_STATE"
            - "MitigationPlan.${p1}.status == APPROVED"
