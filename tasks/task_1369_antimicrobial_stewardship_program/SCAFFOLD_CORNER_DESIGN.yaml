      - name: regulatory_payload_deterministic_checksum
        claim_type: correct_result
        grounds:
          - "calculations.regulatory_payload_assembly"
        distinguishing_aspect: "Two reports pinned to the same FINALIZED snapshot produce byte-identical payload_json and checksum."
        test_recipe:
          setup: ["H; IP; FINALIZED snapshot S for 2026-07 (no orders -> zeros); report R1 submitted; report R2 (STATE_MANDATE) submitted"]
          setup_api_calls:
