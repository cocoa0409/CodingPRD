  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_counter_reoffer_cycle
        grounds:
          - state_machines.SettlementAgreement.OFFERED_to_COUNTERED
          - state_machines.SettlementAgreement.COUNTERED_to_OFFERED
        distinguishing_aspect: |
          Cyclic machine on SettlementAgreement: OFFERED -> COUNTERED -> OFFERED
          loops with round_number incrementing per cycle (0 -> 1 -> 2) and
          vacate_date replaced on each counter/reoffer. Distinct entity from the
          WorkoutCase loops in the sibling instances.
        test_recipe:
          setup:
            - "DIL case LN-NL1 (standard economics) at TERMS_NEGOTIATION; agreement drafted with vacate 2026-09-01 and offered for 10 days"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/loans", payload: { loan_number: "LN-NL1", unpaid_principal_balance_cents: 20000000, accrued_interest_cents: 300000, escrow_advances_cents: 120000, foreclosure_fees_cents: 80000, note_annual_rate: 0.06, fair_market_value_cents: 18000000, delinquency_days: 90 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /property-solutions/borrowers", payload: { full_name: "A. Borrower", email: "a@x.com", hardship_type: MEDICAL, self_reported_condition_grade: B }, as: ServicingAdmin, captures: { bor_id: $.data.id } }
            - { call: "POST /property-solutions/properties", payload: { loan_id: "${loan_id}", address_line: "1 Main St", county: "Maricopa", state_code: "AZ", occupancy_type: OWNER_OCCUPIED }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases", payload: { loan_id: "${loan_id}", borrower_id: "${bor_id}", program_type: DEED_IN_LIEU }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_id: $.data.id } }
            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/title-commitments", payload: { case_id: "${case_id}" }, as: TitleOfficer, as_user_id: to_1, captures: { tc_id: $.data.id } }
            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "A. Borrower" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "GET /property-solutions/cases/${case_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_v: $.data.version } }
            - { call: "POST /property-solutions/cases/${case_id}/agreements", payload: { vacate_date: "2026-09-01", expected_case_version: "${case_v}" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ag_id: $.data.id } }
            - { call: "POST /property-solutions/agreements/${ag_id}/offer", payload: { offer_valid_days: 10 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
          trigger:
            - { call: "POST /property-solutions/agreements/${ag_id}/counter", payload: { proposed_vacate_date: "2026-09-10" }, as: Borrower, as_user_id: "${bor_id}", captures: { r0: $.data.round_number } }
            - { call: "POST /property-solutions/agreements/${ag_id}/reoffer", payload: { vacate_date: "2026-09-10", offer_valid_days: 10 }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { r1: $.data.round_number, v1: $.data.vacate_date } }
            - { call: "POST /property-solutions/agreements/${ag_id}/counter", payload: { proposed_vacate_date: "2026-09-15" }, as: Borrower, as_user_id: "${bor_id}" }
            - { call: "POST /property-solutions/agreements/${ag_id}/reoffer", payload: { vacate_date: "2026-09-15", offer_valid_days: 10 }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { r2: $.data.round_number, v2: $.data.vacate_date } }
            - { call: "POST /property-solutions/agreements/${ag_id}/accept", as: Borrower, as_user_id: "${bor_id}", captures: { fin: $.data.status } }
          assert:
            - "round_number progressed 0 -> 1 -> 2 across two COUNTERED->OFFERED cycles"
            - "SettlementAgreement.${ag_id}.vacate_date == 2026-09-15 after the second reoffer"
            - "SettlementAgreement.${ag_id}.status == ACCEPTED after the loop"
            - "WorkoutCase.${case_id}.status == AGREEMENT_ACTIVE"

      - name: case_program_branch_divergence
        grounds:
          - state_machines.WorkoutCase.DISBURSEMENT_PENDING_to_RECORDING_PENDING
          - state_machines.WorkoutCase.DISBURSEMENT_PENDING_to_COMPLETED
        distinguishing_aspect: |
          Branching fork on WorkoutCase keyed by program_type: after the final
          disbursement release a DEED_IN_LIEU case routes to RECORDING_PENDING
          (deed still to record) while a CASH_FOR_KEYS case routes straight to
          COMPLETED with the loan synced — divergent branches with divergent
          side-effect sets from the same trigger.
        test_recipe:
          setup:
            - "Two cases, LN-BR1 (DEED_IN_LIEU) and LN-BR2 (CASH_FOR_KEYS), identical economics (UPB 20000000, OWNER_OCCUPIED, MEDICAL -> assistance 550000), both driven to DISBURSEMENT_PENDING with clean on-time handover (2026-09-01 handover, keys 2, no deduction lines)"
