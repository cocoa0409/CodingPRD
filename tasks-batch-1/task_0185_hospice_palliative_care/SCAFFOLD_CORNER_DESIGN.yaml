      - name: face_to_face_required_for_period3_recert
        claim_type: Conditional validation
        grounds:
          - validations[priority=7]
          - entities.BenefitPeriod.fields.requires_face_to_face
          - errors[ERR_FACE_TO_FACE_REQUIRED]
          - endpoints["POST /hospice/certifications"]
        distinguishing_aspect: "Recertifying period 3 without a face_to_face_physician_id/date returns ERR_FACE_TO_FACE_REQUIRED, while periods 1 and 2 do not require it."
        test_recipe:
          setup:
