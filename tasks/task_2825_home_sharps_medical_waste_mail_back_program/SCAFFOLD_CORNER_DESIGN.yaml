            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-B", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog_b: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_a}", cadence_days: 30, kits_authorized: 5 }
              as: ProgramAdmin
              captures: { enr_a: $.data.id }
            - call: "POST /sharps/enrollments/${enr_a}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_a}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { enr_a_v1: $.data.version }
            - call: "POST /sharps/enrollments/${enr_a}/kits"
              payload: { expected_enrollment_version: "${enr_a_v1}" }
              as: ProgramAdmin
              captures: { kit_a1: $.data.id }
            - call: "POST /sharps/kits/${kit_a1}/acknowledge-receipt"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit_a1}/seal"
              payload: { fill_units: 60, sealed_gross_weight_grams: 1200 }
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit_a1}/return-labels"
              payload: { packaging_spec_id: "${spec}" }
              as: LogisticsCoordinator
              captures: { lbl_a1: $.data.id }
            - call: "POST /sharps/return-labels/${lbl_a1}/activate"
              payload: { treatment_facility_id: "${fac}", scheduled_intake_date: "2026-08-05", declared_gross_weight_grams: 1200 }
              as: LogisticsCoordinator
              captures: { shp_a1: $.data.id }
            - call: "POST /sharps/shipments/${shp_a1}/transport-events"
              payload: { event_type: "IN_TRANSIT" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp_a1}/transport-events"
              payload: { event_type: "DELIVERED" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp_a1}/conformance-screening"
              payload: { outcome: "NON_CONFORMING", reason_code: "LOOSE_SHARPS_IN_BOX", observed_gross_weight_grams: 1200 }
              as: IntakeTechnician
              as_user_id: "tech-77"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /sharps/enrollments/${enr_a}"
              payload: {}
              as: ProgramAdmin
              captures: { enr_a_v2: $.data.version }
            - call: "POST /sharps/enrollments/${enr_a}/kits"
              payload: { expected_enrollment_version: "${enr_a_v2}" }
              as: ProgramAdmin
              captures: { kit_a2: $.data.id }
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_b}", cadence_days: 30, kits_authorized: 5 }
              as: ProgramAdmin
              captures: { enr_b: $.data.id }
            - call: "POST /sharps/enrollments/${enr_b}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_b}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { enr_b_v1: $.data.version }
            - call: "POST /sharps/enrollments/${enr_b}/kits"
              payload: { expected_enrollment_version: "${enr_b_v1}" }
              as: ProgramAdmin
              captures: { kit_b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sharps/auto-ship-runs"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HTTP status == 201 with as_of_date == \"2026-11-30\", run_at == \"2026-11-30T00:00:00Z\", enrollments_evaluated == 2, kits_created == 0 and created_kit_ids == []"
            - "kits_skipped_risk == 2, kits_skipped_not_due == 0, kits_skipped_unfilled == 0 and kits_skipped_funding == 0 — risk is rung 2 of SKIP_REASON_ORDER, so it claims both enrollments before the unfilled rung ever sees the two ISSUED kits"
            - "Patient.${pat_d}.audit_risk_score == 65 (45 + 10 * 2 late kits) and screening_risk_score == 23 (round_half_up of 45 * 0.5 at age 121 days)"
            - "Patient.${pat_d}.status == \"ENROLLED\" — the run refreshed a score that is past RISK_SUSPEND_THRESHOLD and still wrote nothing to Patient.status"
            - "Enrollment.${enr_a}.status == \"ACTIVE\" with next_autoship_due_date == \"2026-09-01\" and Enrollment.${enr_b}.status == \"ACTIVE\" with next_autoship_due_date == \"2026-09-01\" — a skipped enrollment's due date is never advanced"
            - "Kit.${kit_a2}.status == \"ISSUED\" and Kit.${kit_b1}.status == \"ISSUED\" (no enrollment was paused, so neither kit was voided); Kit.${kit_a1}.status == \"RECEIVED\""
            - "SponsorshipProgram.${prog_a}.reserved_cents == 2930 and SponsorshipProgram.${prog_b}.reserved_cents == 1465; GET /sharps/ledger-entries?sponsorship_program_id=${prog_a} returns total_count == 2 and ...?sponsorship_program_id=${prog_b} returns total_count == 1"
            - "GET /sharps/auto-ship-runs as ProgramAdmin returns total_count == 1 and that row's kits_skipped_risk == 2"

      - name: n_level_cascade_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: nonconforming_screening_cascades_to_patient_suspension_enrollment_pause_and_reservation_release
          rationale: "That §1.8 transitive-cascade instance walks all five hops of the deepest chain in the scaffold (screening -> event -> patient suspension -> enrollment pause -> kit void -> reservation release) with exact cent figures at each hop."

      - name: dual_variant_kit_cost_produces_two_different_amounts_and_reconciles
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: kit_cost_provisional_vs_final_divergence_on_manufacturer_program
          rationale: "The §1.8 dual-variant instance asserts both variant amounts for the same kit and the RESERVATION_RELEASE + COMMITMENT pair that reconciles the delta, which is the whole layer claim."

  # ===========================================================================
  # CONSISTENCY MODEL — immediate
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_current_in_the_very_next_read_with_no_lag
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model (immediate)
          - endpoints.POST /sharps/enrollments/{id}/kits
          - endpoints.POST /sharps/kits/{id}/void
          - entities.SponsorLedgerEntry.fields.available_after_cents
        distinguishing_aspect: "The scaffold declares `immediate`, so a single write must publish its own computed fields in its own response AND leave every denormalised counter on other aggregates already correct for the immediately following read — no second call, no refresh step, no re-derivation. The void half of the probe proves the same for a compensating write: the released reservation is visible at once and the ledger's snapshot columns agree with the program read."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule; MANUFACTURER sponsor; program NW-2026 funded 500000 / 5000; Dana's enrollment ACTIVE with 3 kits authorized and nothing issued yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /sharps/enrollments/${enr}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { enr_v1: $.data.version }
          trigger:
            - call: "POST /sharps/enrollments/${enr}/kits"
              payload: { expected_enrollment_version: "${enr_v1}" }
              as: ProgramAdmin
              captures: { kit: $.data.id }
          assert:
            - "HTTP status == 201 and the response body itself already carries required_units == 99, container_size == \"ONE_QUART\", capacity_units == 100, volume_liters == 0.9, provisional_cost_cents == 1465, seal_deadline_date == \"2026-09-14\" and status == \"ISSUED\""
            - "the immediately following GET /sharps/programs/${prog} shows reserved_cents == 1465, available_cents == 498535, kits_issued_count == 1, committed_cents == 0 and status == \"ACTIVE\" — with no intervening call of any kind"
            - "the immediately following GET /sharps/ledger-entries?sponsorship_program_id=${prog} returns total_count == 1 with entry_type == \"RESERVATION\", amount_cents == 1465, kit_id == ${kit}, reserved_after_cents == 1465, committed_after_cents == 0 and available_after_cents == 498535"
            - "the immediately following GET /sharps/enrollments/${enr} shows version == ${enr_v1} + 1, kits_issued == 1 and next_autoship_due_date == \"2026-08-31\""
            - "POST /sharps/kits/${kit}/void {void_reason: \"address correction\"} as LogisticsCoordinator -> 200 whose own response body already shows status == \"VOIDED\" and void_reason == \"address correction\""
            - "the immediately following GET /sharps/programs/${prog} shows reserved_cents == 0, available_cents == 500000 and kits_issued_count == 0, and GET /sharps/ledger-entries?sponsorship_program_id=${prog} returns total_count == 2 whose sequence_no 2 entry is (RESERVATION_RELEASE, -1465) with reserved_after_cents == 0 and available_after_cents == 500000"
            - "GET /sharps/kits?enrollment_id=${enr} returns total_count == 1 — the voided kit is still listed (there is no soft-delete layer in this scaffold), it simply no longer counts toward kits_issued_count"
