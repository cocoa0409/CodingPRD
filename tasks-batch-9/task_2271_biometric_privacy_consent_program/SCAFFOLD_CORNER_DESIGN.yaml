            - "The same two calls issued as PrivacyOfficer po-1 succeed, isolating the role as the sole cause"

      - name: subject_reading_another_subjects_consent_is_forbidden
        claim_type: shared_operations
        grounds:
          - roles.Subject
          - validations[priority=5]
          - errors[ERR_SUBJECT_MISMATCH]
        distinguishing_aspect: "The Subject role is entity-backed: the same GET succeeds for the caller's own consent row and fails with ERR_SUBJECT_MISMATCH (403, priority 5) for a sibling's row, so ownership is enforced per row rather than per endpoint."
        test_recipe:
          setup:
            - "The standard Illinois pipeline with one activated in-house asset, clock at 2026-08-15, and two EMPLOYEE subjects s1 and s2 each holding one SOLICITED consent."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
