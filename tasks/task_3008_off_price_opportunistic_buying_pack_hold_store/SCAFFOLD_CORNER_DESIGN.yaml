              captures: { ticket_dp_id: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "ST-DP", cluster_code: "SUBURBAN_FAMILY", zone_code: "MT", storage_capacity_units: 500 }
              as: AllocationManager
              captures: { store_dp_id: $.data.id }
            - call: "POST /store-skus"
              payload: { store_id: "${store_dp_id}", lot_line_id: "${line_dp_id}", ticket_id: "${ticket_dp_id}", season_id: "${k_season_id}", units_on_hand: 4 }
              as: StoreOpsLead
              captures: { ss_dp_id: $.data.id }
