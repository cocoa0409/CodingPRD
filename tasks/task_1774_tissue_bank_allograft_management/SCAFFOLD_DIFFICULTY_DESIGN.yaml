# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Tissue Bank & Allograft Management. 9 rules x 2 instances = 18 instances.
# Every setup chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.5 from empty-DB.
# Default logical clock at server start: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: inventory_valuation_fifo_vs_weighted_average_diverge
        grounds:
          - calculations.inventory_valuation
          - entities.TissueUnit.fields.unit_cost_cents
          - endpoints.GET /tissue-bank/inventory/valuation
        distinguishing_aspect: |
          Same accepted population and same on-hand set (money/inventory domain):
          FIFO (oldest-consumed-first over the accepted population) yields
          20003.00 while WEIGHTED_AVERAGE (mean cost over population, per-lot-line
          rounding) yields 20002.66 — two sanctioned algorithms, different totals.
        test_recipe:
          setup:
            - "Supplier qualified (AATB + FDA docs VERIFIED, approved by a different user than verifier)"
            - "Freezer FZ-ULT-1 [-80.0, -60.0] capacity 50"
            - "Shipment 1 (clock 2026-08-01): lot L1 units U-001 @10001, U-002 @10001 BONE — ACCEPTED, both released AVAILABLE"
            - "Shipment 2 (clock 2026-08-02): lot L2 unit U-101 @10002 BONE — ACCEPTED, released AVAILABLE"
            - "U-001 IMPLANTED via case C1 on 2026-08-10 (leaves the on-hand set)"
            - "On-hand BONE = {U-002 (L1), U-101 (L2)}; accepted population = 3"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L2", serial_number: "U-101", unit_cost_cents: 10002, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh2: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh2}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id", u2: "$.data[1].id" } }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh2}", as: QualityManager, as_user_id: "qm-1", captures: { u3: "$.data[0].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u2}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u3}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-1", or_room_id: "OR-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-1", captures: { c1: $.data.id } }
            - { call: "POST /tissue-bank/implant-cases/${c1}/reservations", payload: { tissue_unit_id: "${u1}" }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { res1: $.data.id } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/issue", payload: { reservation_id: "${res1}" }, as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "POST /tissue-bank/implant-cases/${c1}/record-implantation", payload: { tissue_unit_id: "${u1}" }, as: ImplantingSurgeon, as_user_id: "surg-1" }
          trigger:
            - { call: "GET /tissue-bank/inventory/valuation", payload: { tissue_type: BONE, method: WEIGHTED_AVERAGE }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { wa_count: $.data.on_hand_count, wa_total: $.data.total_value } }
            - { call: "GET /tissue-bank/inventory/valuation", payload: { tissue_type: BONE, method: FIFO }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fifo_count: $.data.on_hand_count, fifo_total: $.data.total_value } }
          assert:
            - "wa_count == 2 and fifo_count == 2 (same on-hand set for both methods)"
            - "wa_total == 20002.66 (avg 10001.333... x 1 per lot line, round_half_up per line: 10001.33 + 10001.33)"
            - "fifo_total == 20003.00 (oldest unit U-001 consumed first; remaining = 10001 + 10002)"
            - "wa_total != fifo_total"

      - name: supplier_score_provisional_vs_final_diverge
        grounds:
          - calculations.supplier_qualification_score
          - entities.Supplier.fields.qualification_score_provisional
          - entities.Supplier.fields.qualification_score_final
        distinguishing_aspect: |
          Supplier/compliance domain (distinct from inventory money): with one
          REPORTED adverse case and one ACTIVE recall, provisional counts open
          items (100 - 10 - 15 = 75) while final counts only confirmed/closed
          items (100) — same data, different scores.
        test_recipe:
          setup:
            - "Supplier qualified; freezer; one BONE unit U-001 (lot L1) ACCEPTED, released, reserved, issued, IMPLANTED into case C1 (clock 2026-08-10T11:00:00Z)"
            - "Adverse reaction AR1 on C1/U-001 left in REPORTED (open)"
            - "Recall R1 (lot L1, window covering 2026-08-01) ACTIVE — matches the IMPLANTED unit so affected_unit_count == 1 and no auto-close"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-1", or_room_id: "OR-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-1", captures: { c1: $.data.id } }
            - { call: "POST /tissue-bank/implant-cases/${c1}/reservations", payload: { tissue_unit_id: "${u1}" }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { res1: $.data.id } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/issue", payload: { reservation_id: "${res1}" }, as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "POST /tissue-bank/implant-cases/${c1}/record-implantation", payload: { tissue_unit_id: "${u1}" }, as: ImplantingSurgeon, as_user_id: "surg-1" }
            - { call: "POST /tissue-bank/implant-cases/${c1}/adverse-reactions", payload: { tissue_unit_id: "${u1}", reaction_type: INFECTION, severity: MAJOR, description: "Post-operative infection at graft site" }, as: ImplantingSurgeon, as_user_id: "surg-1", captures: { ar1: $.data.id } }
            - { call: "POST /tissue-bank/recalls", payload: { supplier_id: "${sup}", lot_numbers: ["L1"], received_window_start: "2026-01-01T00:00:00Z", received_window_end: "2026-12-31T00:00:00Z", reason: "Sterility assurance letter from supplier" }, as: QualityManager, as_user_id: "qm-1", captures: { rc1: $.data.id } }
            - { call: "POST /tissue-bank/recalls/${rc1}/activate", as: QualityManager, as_user_id: "qm-1" }
          trigger:
            - { call: "GET /tissue-bank/suppliers/${sup}", as: ComplianceOfficer, as_user_id: "co-1", captures: { prov: $.data.qualification_score_provisional, fin: $.data.qualification_score_final } }
          assert:
            - "prov == 75 (100 - 10*1 open adverse - 15*1 active recall; confirmed findings 0, expired docs 0)"
            - "fin == 100 (only confirmed findings and expired-doc events count; both are 0)"
            - "Recall.${rc1}.status == ACTIVE and affected_unit_count == 1 (IMPLANTED unit matched but unchanged)"

  - rule_id: combinatorial_formula
    instances:
      - name: excursion_severity_nested_caps_and_tier_branch
        grounds:
          - calculations.excursion_severity_score
          - state_machines.TemperatureExcursion.UNDER_INVESTIGATION_to_RESOLVED_DESTROY
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction —
          deviation points hit the min(40, ...) cap (ceil(10.0)*8 = 80 -> 40),
          duration points use whole-hour truncation (150 min -> 12), unit points
          3*2 = 6, tier branch CRITICAL -> 10; total 68 -> class HIGH, which then
          forbids the RELEASE disposition (state-gating branch on the formula).
        test_recipe:
          setup:
            - "Supplier qualified; freezer [-80.0, -60.0]; 3 CRITICAL CARDIOVASCULAR units (lot L1) ACCEPTED and released AVAILABLE"
            - "Clock 2026-08-05T09:00:00Z: out-of-range reading -50.0 opens excursion E (deviation 10.0), 3 units -> QUARANTINED (EXCURSION)"
            - "E investigated -> UNDER_INVESTIGATION; clock advanced to 2026-08-05T11:30:00Z (150 minutes open)"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: CARDIOVASCULAR, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: CRITICAL }, { tissue_type: CARDIOVASCULAR, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: CRITICAL }, { tissue_type: CARDIOVASCULAR, lot_number: "L1", serial_number: "U-003", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: CRITICAL } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id", u2: "$.data[1].id", u3: "$.data[2].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u2}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u3}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "POST /tissue-bank/freezers/${fz}/readings", payload: { temp_celsius: -50.0 }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { ex: $.data.excursion_id } }
            - { call: "POST /tissue-bank/excursions/${ex}/investigate", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T11:30:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
          trigger:
            - { call: "GET /tissue-bank/excursions/${ex}", as: QualityManager, as_user_id: "qm-1", captures: { sev: $.data.severity_score, sev_class: $.data.severity_class, aff: $.data.affected_unit_count } }
            - { call: "POST /tissue-bank/excursions/${ex}/resolve", payload: { disposition: RELEASE, resolution_notes: "Attempted release of HIGH severity excursion" }, as: QualityManager, as_user_id: "qm-1", captures: { err_release: $.data.error_id } }
            - { call: "POST /tissue-bank/excursions/${ex}/resolve", payload: { disposition: DESTROY, resolution_notes: "Destroyed after HIGH severity review" }, as: QualityManager, as_user_id: "qm-1" }
          assert:
            - "aff == 3 (all CRITICAL units held with hold_reason EXCURSION)"
            - "sev == 68 (min(40, ceil(10.0)*8)=40 + min(30, (150//60)*6)=12 + min(20, 3*2)=6 + tier CRITICAL=10)"
            - "sev_class == HIGH (68 >= 60)"
            - "err_release == ERR_SEVERITY_REQUIRES_DESTROY (HIGH forbids RELEASE)"
            - "After DESTROY resolve: TissueUnit.${u1}.status == DISCARDED, ${u2} == DISCARDED, ${u3} == DISCARDED"
            - "Freezer.${fz}.status == OPERATIONAL and current_excursion_id == null"
            - "3 DRAFT DispositionRecords (DESTROYED) exist, one per unit"

      - name: inventory_valuation_per_lot_line_rounding_order
        grounds:
          - calculations.inventory_valuation
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds avg_unit_cost x qty
          per lot line to 2dp THEN sums lines (10001.33 + 10001.33 = 20002.66);
          the forbidden sum-then-round order yields 20002.67 — a one-cent
          divergence proving the pinned order (distinct mode from the severity
          instance's nested min/max + branch).
        test_recipe:
          setup:
            - "Identical fixture to inventory_valuation_fifo_vs_weighted_average_diverge: BONE population {10001, 10001 (L1), 10002 (L2)}; U-001 IMPLANTED; on-hand = {U-002 (L1), U-101 (L2)}"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L2", serial_number: "U-101", unit_cost_cents: 10002, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh2: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh2}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id", u2: "$.data[1].id" } }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh2}", as: QualityManager, as_user_id: "qm-1", captures: { u3: "$.data[0].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u2}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u3}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-1", or_room_id: "OR-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-1", captures: { c1: $.data.id } }
