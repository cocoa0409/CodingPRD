      assert:
      - 'TeamAccount.${acct_id}.tasks_used_current == 9   # 8 from POLLING + 1 from INSTANT_WEBHOOK'
      - 'TeamAccount.${acct_id}.overage_tasks_used == 0   # allowance 100 not exceeded'
- rule_id: combinatorial_formula
  instances:
  - name: cf_charge_task_nested_rounding_ceiling_order
    grounds:
    - calculations.charge_task
    - calculations.metering_factor
    - calculations.trigger_latency_multiplier
    distinguishing_aspect: 'The whole-task count is produced by a nested ceiling whose order is pinned: the metering product is ceiled first and only then multiplied by the retry class (ceil(4 * 2) * ceil(1/3)), so one POLLING attempt yields exactly 8 whole tasks and never a fractional or double-ceiled count. This is the nested-rounding mode (b), distinct from the increment-ordering mode of its sibling instance.'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 10, closer and opening cost 1, overage_enabled true
      - one activated POLLING workflow (latency 900) with one action
      setup_api_calls: &id001
      - call: POST /zapier/accounts
        payload:
          name: Cf2A
          plan_code: TEAM_PRO
          task_allowance: 10
          closer_cost_per_task_cents: 1
          opening_cost_per_task_cents: 1
          overage_enabled: true
        as: PlatformAdmin
        captures:
          acct_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: owner@x.test
          full_name: Owner One
          role: OWNER
        as: PlatformAdmin
        captures:
          mem_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: mem@x.test
          full_name: Mem Ber
          role: MEMBER
        as: PlatformAdmin
        captures:
          mem_x: $.data.id
      - call: POST /zapier/integrations
        payload:
          name: Slack
          partner_name: Partner Inc
          auth_method: OAUTH2
        as: PartnerAdmin
        captures:
          intg_id: $.data.id
      - call: POST /zapier/integrations/${intg_id}/endpoints
        payload:
          path: /v1/op1
          has_response_schema: true
        as: PartnerAdmin
        captures:
          ep1: $.data.id
      - call: POST /zapier/connections
        payload:
          account_id: ${acct_id}
          integration_id: ${intg_id}
          owner_member_id: ${mem_x}
        as: Member
        as_user_id: ${mem_x}
        captures:
          conn_id: $.data.id
      - call: POST /zapier/folders
        payload:
          account_id: ${acct_id}
          name: Ops
        as: Member
        as_user_id: ${mem_id}
        captures:
          fld_id: $.data.id
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: W
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_id: $.data.id
      - call: POST /zapier/workflows/${wf_id}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
        captures:
          act1: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: success
        as: Member
        as_user_id: ${mem_id}
      assert:
      - 'TeamAccount.${acct_id}.tasks_used_current == 8   # ceil(4 * 2) * ceil(1/3) == 8'
      - TeamAccount.${acct_id}.overage_tasks_used == 0
      - TeamAccount.${acct_id}.overage_amount_cents == 0
  - name: cf_charge_task_increment_then_overage_split_order
    grounds:
    - calculations.charge_task
    - entities.TeamAccount.fields.tasks_used_current
    - entities.TeamAccount.fields.overage_tasks_used
    distinguishing_aspect: 'A pinned evaluation-order dependency (mode c) on a different subject: the overage split is defined on the post-increment counter, so tasks_used_current is advanced first and the newly-beyond-allowance delta is derived from the before/after difference. Two identical 8-task charges against allowance 1 therefore leave overage_tasks_used == 15, not 14 or 16 as the alternative orders would produce.'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 1, closer and opening cost 1, overage_enabled true
      - one activated POLLING workflow with one action
      setup_api_calls: *id001
      trigger:
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: success
        as: Member
        as_user_id: ${mem_id}
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: success
        as: Member
        as_user_id: ${mem_id}
      assert:
      - 'TeamAccount.${acct_id}.tasks_used_current == 16   # two 8-task charges'
      - 'TeamAccount.${acct_id}.overage_tasks_used == 15   # max(0,16-1) - max(0,8-1) + 8 == 15'
- rule_id: non_linear_state_machine
  instances:
  - name: nl_workflow_pause_resume_cycle_with_forked_pause_reasons
    grounds:
    - state_machines.Workflow.ACTIVE_to_PAUSED
    - state_machines.Workflow.PAUSED_to_ACTIVE
    distinguishing_aspect: 'Workflow.status is a cyclic fork-join machine: ACTIVE fans out to three distinct PAUSED-forks (AUTO_SOFT_CAP, USER_PAUSED, TOKEN_EXPIRED) that rejoin at PAUSED_to_ACTIVE, so the same state pair is revisited rather than traversed once. The cycle closes when the workflow returns to PAUSED a second time.'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 20, overage_enabled true
      - one activated POLLING workflow with one action on a connected connection
      setup_api_calls: &id002
      - call: POST /zapier/accounts
        payload:
          name: Nl3A
          plan_code: TEAM_PRO
          task_allowance: 20
          closer_cost_per_task_cents: 1
          opening_cost_per_task_cents: 1
          overage_enabled: true
        as: PlatformAdmin
        captures:
          acct_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: owner@x.test
          full_name: Owner One
          role: OWNER
        as: PlatformAdmin
        captures:
          mem_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: mem@x.test
          full_name: Mem Ber
          role: MEMBER
        as: PlatformAdmin
        captures:
          mem_x: $.data.id
      - call: POST /zapier/integrations
        payload:
          name: Slack
          partner_name: Partner Inc
          auth_method: OAUTH2
        as: PartnerAdmin
        captures:
          intg_id: $.data.id
      - call: POST /zapier/integrations/${intg_id}/endpoints
        payload:
          path: /v1/op1
          has_response_schema: true
        as: PartnerAdmin
        captures:
          ep1: $.data.id
      - call: POST /zapier/connections
        payload:
          account_id: ${acct_id}
          integration_id: ${intg_id}
          owner_member_id: ${mem_x}
        as: Member
        as_user_id: ${mem_x}
        captures:
          conn_id: $.data.id
      - call: POST /zapier/folders
        payload:
          account_id: ${acct_id}
          name: Ops
        as: Member
        as_user_id: ${mem_id}
        captures:
          fld_id: $.data.id
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: W
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_id: $.data.id
      - call: POST /zapier/workflows/${wf_id}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
        captures:
          act1: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: POST /zapier/workflows/${wf_id}/pause
        as: Member
        as_user_id: ${mem_id}
        captures:
          paused: $.data
      - call: POST /zapier/workflows/${wf_id}/resume
        as: Member
        as_user_id: ${mem_id}
        captures:
          resumed: $.data
      - call: POST /zapier/workflows/${wf_id}/pause
        as: Member
        as_user_id: ${mem_id}
      assert:
      - paused.status == PAUSED and paused.pause_reason == USER_PAUSED
      - resumed.status == ACTIVE and resumed.pause_reason is null
      - 'after the second pause GET /workflows/${wf_id} .status == PAUSED   # ACTIVE reached twice, cycle closed'
  - name: nl_workflow_action_held_replay_cycle
    grounds:
    - state_machines.WorkflowAction.HELD_to_RUNNING
    - state_machines.WorkflowAction.RUNNING_to_FAILED
    - state_machines.WorkflowAction.FAILED_to_PENDING
    - state_machines.WorkflowAction.PENDING_to_HELD
    distinguishing_aspect: 'A second non-linear machine on a different entity: WorkflowAction.status is genuinely cyclic and forked, since HELD loops back to RUNNING and FAILED loops back to PENDING while the PENDING-to-HELD fork depends on the simulated charge outcome.'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 10, overage_enabled true
      - one activated POLLING workflow with one action on a connected connection
      setup_api_calls: *id002
      trigger:
      - call: POST /zapier/workflows/${wf_id}/runs
        payload:
          charge: hold
          forced_failure: true
          max_retries: 3
        as: Member
        as_user_id: ${mem_id}
        captures:
          held_run: $.data
      - call: POST /zapier/actions/${act1}/replay
        as: Member
        as_user_id: ${mem_id}
        captures:
          replayed: $.data
      assert:
      - held_run.status == HELD and held_run.held_action_id == ${act1}
      - 'replayed.status == RUNNING   # HELD reopened via the HELD_to_RUNNING cycle edge'
      - GET /job-events?action_id=${act1} contains an event with outcome HELD followed by the REPLAYED attempt
- rule_id: transitive_cascade
  instances:
  - name: tc_charge_pauses_workflow_then_expires_connection_then_blocks_migration
    grounds:
    - state_machines.Workflow.ACTIVE_to_PAUSED
    - state_machines.Connection.TOKEN_EXPIRED_to_REAUTH_REQUIRED
    - state_machines.WorkflowVersion.CURRENT_to_MIGRATION_REQUIRED
    - validations[priority=17]
    distinguishing_aspect: 'A depth-3 chain where each hop is caused by the previous hop, not by the original action: the soft-cap charge set the workflow to PAUSED(AUTO_SOFT_CAP) [hop 1]; exhausting the connection''s refresh cap then moved it to REAUTH_REQUIRED [hop 2]; that moved the workflow''s pinned WorkflowVersion to MIGRATION_REQUIRED [hop 3].'
    test_recipe:
      setup:
      - TeamAccount with task_allowance 1, overage_enabled false
      - one activated POLLING workflow whose connection is pinned by a CURRENT WorkflowVersion
      setup_api_calls: &id003
