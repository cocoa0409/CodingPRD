              as: AccreditationDirector
              captures: { v19_u: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { v19_sw: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${v19_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${v19_sw}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${v19_sw}/findings"
              payload: { standard_id: "${v19_s1}", unit_id: "${v19_u}", observed_noncompliance_count: 2, sampled_count: 10, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { v19_f: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${v19_sw}/transition"
              payload: { action: "CLOSE_SURVEY" }
              as: AccreditationDirector
              captures: { v19_follow1: $.data.follow_up_required }
          trigger:
            - call: "POST /accreditation/survey-findings/${v19_f}/escalate"
