              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Owner A", email: "owner_a@x.com", designation: "EMPLOYEE", department: "A" }
              as: LegalAdmin
              captures: { a_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Other B", email: "other_b@x.com", designation: "EMPLOYEE", department: "B" }
