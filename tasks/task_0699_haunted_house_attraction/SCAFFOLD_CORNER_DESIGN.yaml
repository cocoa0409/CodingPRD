        distinguishing_aspect: "Confirming reservation R2 with a stale expected_time_slot_version (the slot version observed before R1's confirm advanced it) is rejected ERR_STALE_TIME_SLOT_VERSION (412)."
        test_recipe:
          setup: ["Slot capacity 10 with one early reader (slot version v0). R1 confirmed (slot version -> v1). R2 still carries v0."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G1", age: 30, email: "g1@x.com" }
              as: BoxOffice
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g1_id}" }
              as: BoxOffice
              captures: { r1_id: $.data.id }
            - call: "POST /reservations/${r1_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /guests"
              payload: { full_name: "G2", age: 30, email: "g2@x.com" }
              as: BoxOffice
              captures: { g2_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g2_id}" }
              as: BoxOffice
              captures: { r2_id: $.data.id }
            - call: "POST /reservations/${r2_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r1_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v0}" }
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${r2_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v0}" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_TIME_SLOT_VERSION"
            - "response http status == 412"

      - name: occ_weather_stale_venue_version
        claim_type: optimistic_concurrency
        grounds: [endpoints, 'errors[ERR_STALE_VENUE_VERSION]', entities.Venue.fields.version]
        distinguishing_aspect: "A second weather change carrying the pre-first-change venue version is rejected ERR_STALE_VENUE_VERSION (412)."
        test_recipe:
          setup: ["Venue at version v0; one weather change applied (version -> v1); a second change still carries v0."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id, ven_v0: $.data.version }
            - call: "POST /venues/${ven_id}/weather"
              payload: { weather_status: "ADVISORY", expected_venue_version: "${ven_v0}" }
              as: OpsManager
          trigger:
            - call: "POST /venues/${ven_id}/weather"
              payload: { weather_status: "CLEAR", expected_venue_version: "${ven_v0}" }
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VENUE_VERSION"
            - "response http status == 412"

      - name: weather_severe_shutdown_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.Venue.OPEN_to_SHUTDOWN, entities.Venue.fields.operational_state]
        distinguishing_aspect: "Setting venue weather SEVERE drives operational_state SHUTDOWN and pauses every OPEN attraction via WEATHER closures."
        test_recipe:
          setup: ["Venue with one OPEN attraction."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id, ven_v0: $.data.version }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /venues/${ven_id}/weather"
              payload: { weather_status: "SEVERE", expected_venue_version: "${ven_v0}" }
              as: OpsManager
            - call: "GET /attractions/${att_id}"
              payload: {}
              as: OpsManager
              captures: { att_status: $.data.status }
          assert:
            - "Venue.${ven_id}.operational_state == SHUTDOWN"
            - "Attraction.${att_id}.status == PAUSED"

      - name: restricted_blocks_vip_ticket_add
        claim_type: conditional_feature_flags
        grounds: [state_machines.Venue.OPEN_to_RESTRICTED, 'validations[priority=15]', 'errors[ERR_SALES_BLOCKED]']
        distinguishing_aspect: "Under operational_state RESTRICTED (weather ADVISORY), adding a VIP ticket is blocked ERR_SALES_BLOCKED (409) while GA tickets still succeed."
        test_recipe:
          setup: ["Venue weather ADVISORY (operational RESTRICTED); a HELD reservation."]
          setup_api_calls:
