  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency
  # Three DIFFERENT entity pairs, each tested on both sides of the dependency:
  #   Measurement    -> InstallerAssignment creation
  #   Installer      -> InstallerAssignment creation
  #   PunchListItem  -> Project closure
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: assignment_creation_depends_on_the_measurement_validity_of_another_entity
        grounds:
          - validations[priority 20].ERR_MEASUREMENT_STALE
          - entities.ServiceCategory.fields.measurement_validity_days
          - entities.Measurement.fields.completed_at
          - state_machines.Measurement.SCHEDULED_to_COMPLETED
          - endpoints[POST /installer-assignments]
          - endpoints[POST /measurements/{id}/complete]
        distinguishing_aspect: |
          Entity pair Measurement -> InstallerAssignment: whether an
          InstallerAssignment may be created at all is decided by a field of a
          DIFFERENT entity (Measurement.completed_at) plus the category's
          measurement_validity_days 45, not by anything on the assignment. Both
          sides are exercised on one project: window_start one second past
          completed_at + 45 days is refused, window_start exactly at
          completed_at + 45 days succeeds.
        test_recipe:
          setup:
            - "ServiceCategory FLOOR-LVP with measurement_required true and measurement_validity_days 45."
            - "Jurisdiction METRO-01 (labor_complexity_multiplier 1.15, background_check_recency_days 365, min_liability_coverage_cents 100000000)."
            - "One Installer ACTIVE with a VERIFIED FLOORING credential for METRO-01, background PASS on 2026-06-01."
            - "One Project with estimated_units 420.00, quoted_labor_cents 196673, deposit 59002 paid, permit_status PENDING_APPLICATION (FLOORING is a permit trade in METRO-01 and 420.00 >= 250.00)."
            - "The logical clock is moved to 2026-07-01T00:00:00.000Z and the measurement is completed there at measured_units 420.00 — identical to estimated_units, so variance is 0.00, no MEASUREMENT_VARIANCE change order is raised and fulfillment_status settles at MEASURED with completed_at 2026-07-01T00:00:00.000Z."
            - "completed_at + 45 whole days is therefore exactly 2026-08-15T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-06-01T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 59002 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /projects/${proj_id}/measurements"
              payload: { scheduled_at: "2026-07-01T09:00:00.000Z", technician_name: "R. Vance" }
              as: ProjectCoordinator
              captures: { meas_id: $.data.id }
            - call: "POST /measurements/${meas_id}/complete"
              payload: { measured_units: 420.00, subfloor_condition: "NONE", obstruction_count: 0, stair_flight_count: 0 }
              as: ProjectCoordinator
              captures: { meas_completed_at: $.data.completed_at, meas_variance: $.data.variance_pct }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectCoordinator
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /installer-assignments"
              payload: { project_id: "${proj_id}", installer_id: "${inst_id}", window_start: "2026-08-15T00:00:01.000Z", window_end: "2026-08-15T08:00:00.000Z", expected_project_version: "${pv}" }
              as: ProjectCoordinator
            - call: "POST /installer-assignments"
              payload: { project_id: "${proj_id}", installer_id: "${inst_id}", window_start: "2026-08-15T00:00:00.000Z", window_end: "2026-08-15T08:00:00.000Z", expected_project_version: "${pv}" }
              as: ProjectCoordinator
              captures: { asg_id: $.data.id }
          assert:
            - "Measurement.${meas_id}.status == COMPLETED AND completed_at == 2026-07-01T00:00:00.000Z AND variance_pct == 0.00 AND change_order_triggered == false"
            - "First attempt: HTTP 409 ERR_MEASUREMENT_STALE — window_start 2026-08-15T00:00:01.000Z is one second past the inclusive validity limit"
            - "After the refusal, Project.${proj_id}.fulfillment_status is still MEASURED and version is still ${pv}"
            - "Second attempt: InstallerAssignment.${asg_id}.status == HELD AND duration_minutes == 480 — window_start exactly at the inclusive limit is accepted"
            - "Project.${proj_id}.fulfillment_status == SCHEDULED AND permit_status == PENDING_APPLICATION AND permit_responsibility == RETAILER"
            - "Installer.${inst_id}.committed_minutes == 480"

      - name: assignment_creation_depends_on_the_installer_status_another_call_changed
        grounds:
          - validations[priority 16].ERR_INSTALLER_NOT_ASSIGNABLE
          - validations[priority 17].ERR_INSTALLER_NOT_LICENSED
          - state_machines.Installer.ACTIVE_to_SUSPENDED
          - state_machines.Installer.SUSPENDED_to_ACTIVE
          - entities.Installer.fields.verified_credential_count
          - endpoints[POST /installer-assignments]
        distinguishing_aspect: |
          A DIFFERENT entity pair — Installer -> InstallerAssignment. The
          identical assignment request is refused and then accepted purely
          because a call on the InstallerCredential entity moved
          Installer.status SUSPENDED -> ACTIVE in between. While suspended the
          installer also has no VERIFIED credential, so priority 16 must beat
          priority 17 and the error is ERR_INSTALLER_NOT_ASSIGNABLE, not
          ERR_INSTALLER_NOT_LICENSED.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z."
            - "ServiceCategory FLOOR-DIRECT (measurement_required false, permit_policy NEVER) and Jurisdiction METRO-01 with license_required true."
            - "One Installer taken to ACTIVE with a VERIFIED FLOORING credential, then knocked back to SUSPENDED by rejecting that only credential, so verified_credential_count is 0."
            - "One Project with estimated_units 420.00 and its 59002 deposit paid, sitting at fulfillment_status MEASURED."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
