              payload: { customer_ref: "PLANT-ISF", contract_number: "C-ISF", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
