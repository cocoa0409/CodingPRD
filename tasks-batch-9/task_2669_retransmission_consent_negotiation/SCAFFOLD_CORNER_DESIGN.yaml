              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { dist_id: "$.data.id" }
          trigger:
            - call: "POST /retrans/elections"
              payload: { station_id: "${st_id}", distributor_id: "${dist_id}", cycle_label: "2027-2029", election_type: "RETRANS_CONSENT", requested_tier: "EXPANDED_BASIC", incumbent_expiry_utc: "2027-01-01T00:00:00Z", incumbent_rate_per_sub_cents: 220 }
              as: StationGroupNegotiator
              as_user_id: "${st_id}"
              captures: { el_id: "$.data.id", el_status: "$.data.status", el_filed: "$.data.filed_at_utc" }
            - call: "GET /retrans/elections/${el_id}/negotiations"
              payload: {}
              as: CarriageAdmin
              as_user_id: "admin-1"
          assert:
            - "${el_status} == \"DRAFT\""
            - "${el_filed} == null"
            - "The negotiations list returns HTTP 200 with total_count == 0"
            - "Station.${st_id}.filed_election_count == 0"

      - name: corner_file_already_filed_election_returns_election_not_draft
