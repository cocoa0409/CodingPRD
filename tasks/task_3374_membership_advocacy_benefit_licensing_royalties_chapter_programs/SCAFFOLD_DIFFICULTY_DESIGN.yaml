            - call: "POST /api/complaints"
              payload: { member_id: "${tm_id}", license_agreement_id: "${ta1_id}", category: "SERVICE", severity: "HIGH", description: "escalation 2" }
              as: Member
              as_user_id: "${tm_id}"
