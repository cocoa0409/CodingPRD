        distinguishing_aspect: "RECALLED is reachable only as a system cascade from a STRUCTURAL_UNDERDESIGN determination, never from a client-facing endpoint, so the lockdown has to be proved after driving the cascade. Two different errors guard the terminal state: the four design triggers return ERR_DESIGN_STATE_INVALID while a brand-new order against the recalled design returns the dedicated ERR_DESIGN_RECALLED. An implementation that reuses one error for both, or that lets a recalled design be revised back into DRAFT, fails."
