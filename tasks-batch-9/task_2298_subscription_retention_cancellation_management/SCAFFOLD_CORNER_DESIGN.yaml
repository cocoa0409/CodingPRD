              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 3, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { e_freq: $.data.error_id }
          assert:
            - "Response status is 422"
            - "${e_freq} == ERR_FREQUENCY_NOT_ALLOWED"
            - "GET /subscriptions?subscriber_id=${sub_a_id} returns meta.total_count == 0"
            - "GET /invoices returns meta.total_count == 0"
            - "Plan.${core_plan_id}.active_subscription_count == 0"

      - name: adding_an_addon_absent_from_the_catalog_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ADDON_NOT_AVAILABLE]
          - validations[priority=34]
          - entities.Plan.fields.addon_catalog
        distinguishing_aspect: |
          The catalog is the authority: SOCKS is not in CORE's addon_catalog, so the ADDON_ADD is
          422 ERR_ADDON_NOT_AVAILABLE with committed_price_cents unchanged at 4999 - an unknown
          addon may not be priced at zero and silently attached.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE offers only MUG in its addon_catalog; subscriber A subscribed with no addons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200, addon_catalog: [{ code: "MUG", unit_price_cents: 1299, unit_cogs_cents: 520 }] }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "ADDON_ADD", expected_subscription_version: "${v1}", addon_code: "SOCKS", addon_qty: 1 }
              as: Subscriber
              as_user_id: "${sub_a_id}"
              captures: { e_addon: $.data.error_id }
          assert:
            - "Response status is 422"
            - "${e_addon} == ERR_ADDON_NOT_AVAILABLE"
            - "Subscription.${s_a_id}.addons is the empty array"
            - "Subscription.${s_a_id}.committed_price_cents == 4999"
            - "Subscription.${s_a_id}.version == 1"
            - "GET /subscription-modifications?subscription_id=${s_a_id} returns meta.total_count == 0"

      - name: downgrade_to_a_plan_that_is_not_the_declared_target_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DOWNGRADE_TARGET_MISSING]
          - validations[priority=37]
          - entities.Plan.fields.downgrade_target_plan_id
        distinguishing_aspect: |
          The downgrade lattice is declared on the plan, not chosen by the caller: CORE has
          downgrade_target_plan_id null, so a PLAN_DOWNGRADE naming the existing BOUND plan resolves
          the foreign key (priority 4 passes) and is still 422 ERR_DOWNGRADE_TARGET_MISSING.
        test_recipe:
          setup:
            - "Clock 2026-01-10; plan CORE with no downgrade target and plan BOUND both exist; subscriber A holds a CORE subscription."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { code: "CORE", name: "Core Box", monthly_price_cents: 4999, unit_cogs_cents: 2100, margin_floor_pct: 0.4200 }
              as: PlatformAdmin
              captures: { core_plan_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "BOUND", name: "Bounded Box", monthly_price_cents: 5000, unit_cogs_cents: 2500, margin_floor_pct: 0.4048, allowed_frequency_weeks: [4], is_negative_option: false }
              as: PlatformAdmin
              captures: { bound_plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "a@dtc.test", acquisition_channel: "ORGANIC" }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id }
            - call: "POST /payment-methods"
              payload: { subscriber_id: "${sub_a_id}", card_last4: "4242", exp_month: 12, exp_year: 2030, network: "VISA" }
              as: PlatformAdmin
              captures: { pm_a_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_a_id}", plan_id: "${core_plan_id}", payment_method_id: "${pm_a_id}", frequency_weeks: 4, disclosure_acknowledged: true }
              as: PlatformAdmin
              captures: { s_a_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /subscriptions/${s_a_id}/modifications"
              payload: { mod_type: "PLAN_DOWNGRADE", expected_subscription_version: "${v1}", target_plan_id: "${bound_plan_id}" }
              as: RetentionSpecialist
              captures: { e_dg: $.data.error_id }
          assert:
