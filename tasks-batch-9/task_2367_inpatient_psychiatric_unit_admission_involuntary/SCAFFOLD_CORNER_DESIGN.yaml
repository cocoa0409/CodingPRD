      - name: discharge_request_lifecycle_rejects_duplicate_and_repeat_response
        claim_type: idempotency
        grounds:
          - state_machines.DischargeRequest.transitions
          - validations[priority=21]
          - validations[priority=42]
          - validations[priority=17]
          - errors[ERR_DISCHARGE_REQUEST_NOT_PENDING]
          - errors[ERR_DUPLICATE_DISCHARGE_REQUEST]
          - errors[ERR_ADMISSION_NOT_DISCHARGEABLE]
        distinguishing_aspect: "A PENDING request is exclusive and single-shot: a second concurrent request is refused 409 ERR_DUPLICATE_DISCHARGE_REQUEST, a second response to the answered request is refused 409 ERR_DISCHARGE_REQUEST_NOT_PENDING, and because the GRANT cancelled a not-yet-placed admission a further request is refused 409 ERR_ADMISSION_NOT_DISCHARGEABLE."
