        grounds:
          - validations[V500]
          - validations[V312]
          - calculations.screening_decision
        distinguishing_aspect: |
          Screening is gated by two different rows on the home: while a CRITICAL obligation holds the
          posture at FROZEN every screen is refused with ERR_HOME_SHOWINGS_BLOCKED, and once the
          obligation is RESOLVED the first screen succeeds and reserves the home - which immediately
          turns the second applicant's screen into ERR_HOME_NOT_VACANT at 409, a refusal caused by the
          first applicant rather than by anything in the second request.
