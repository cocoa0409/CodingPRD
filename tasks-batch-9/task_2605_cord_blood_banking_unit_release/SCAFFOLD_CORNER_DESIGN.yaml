              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
