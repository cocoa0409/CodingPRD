      - name: paying_a_settled_invoice_returns_already_paid
        claim_type: Error Triggerable
        grounds: ["validations[priority=69]", "errors[ERR_INVOICE_ALREADY_PAID]", "validations[priority=31]"]
        distinguishing_aspect: "A duplicate payment is answered by rung 69 with ERR_INVOICE_ALREADY_PAID (409) rather than by the generic rung 31 state code, because rung 31 names this exact exception for the pay endpoint."
        test_recipe:
          setup: ["An OCCUPIED AGENT-payer project with an ISSUED invoice of 3058.06."]
          setup_api_calls: *occ_issued_c
          trigger:
            - call: "POST /staging/invoices/${inv_id}/pay"
              payload: { amount_paid: 3058.06 }
              as: BillingClerk
            - call: "POST /staging/invoices/${inv_id}/pay"
              payload: { amount_paid: 3058.06 }
              as: BillingClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVOICE_ALREADY_PAID"
            - "Invoice.${inv_id}.state == PAID"
            - "Invoice.${inv_id}.paid_at == 2026-06-02T09:00:00.000Z"
            - "Project.${proj_id}.payment_state == SETTLED"

