            - "MonitoringMethod.${m_id}.method_score == 1.0000"
            - "MonitoringMethod.${m_id}.status == ACTIVE"
            - "the second trigger response reports total_count 1"
            - "the third trigger response reports total_count 0"
            - "MonitoringPlan.${plan1_id}.subsurface_subscore == 1.0000"
            - "MonitoringPlan.${plan1_id}.coverage_score == 50.00"
            - "MonitoringPlan.${plan2_id}.coverage_score == 0.00"

      - name: create_tax_credit_claim_with_foreign_project_monitoring_plan_rejected
        claim_type: foreign_key_validation
        grounds:
          - endpoints[POST /ccs/tax-credit-claims]
