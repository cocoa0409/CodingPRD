  instances:
  - name: pilot_create_missing_auth_headers_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request without valid X-User-Role/X-User-ID is rejected 401 before any role or existence check.
    test_recipe:
      setup:
