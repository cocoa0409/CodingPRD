            - { call: "POST /avionics/customers", payload: { name: "Buffer Owner", contact_email: "buf@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N510BF", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
