            - call: "POST /warranty-claims/${wc3_id}/issue-rma"
              payload: { rma_number: "RMA-0203" }
              as: ContractAdmin
            - call: "POST /warranty-claims/${wc3_id}/receive-unit"
              payload: {}
              as: QualityEngineer
            - call: "POST /warranty-claims/${wc3_id}/failure-analysis-reports"
              payload: { attributed_supplier_id: "${sup_id}", root_cause_code: "SUPPLIER_DEFECT", authored_by_user_id: "u_qe_2", quarantine_recommended: false, defect_weight: 10 }
              as: QualityEngineer
              captures: { far3_id: $.data.id }
