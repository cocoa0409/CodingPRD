  # --- Borrow Tickets ---
  - method: POST
    path: "/provider-sites/{id}/borrow-tickets"
    description: "Open a borrow ticket: pull doses from one stock to cover an administration from the other program"
    roles: [VaccineManager]
    code: 201
    input: [from_lot_id, to_lot_id, direction, borrowed_quantity, reason_code]
    output: BorrowTicket
    side_effects:
      - "from_lot.quantity_on_hand -= borrowed_quantity  (physical doses leave the lender lot)"
      - "to_lot.quantity_borrowed_in += borrowed_quantity  (IOU recorded on the borrower lot; quantity_on_hand unchanged)"
      - "ProviderSite.private_lending_balance recomputed"

  - method: GET
    path: "/provider-sites/{id}/borrow-tickets"
    description: "List borrow tickets for a site"
    roles: [ComplianceAuditor, VaccineManager, StateProgramOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "direction?"]
    output: "BorrowTicket[]"
    side_effects: []

