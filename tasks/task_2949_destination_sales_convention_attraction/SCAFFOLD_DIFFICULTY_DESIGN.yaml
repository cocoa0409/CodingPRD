            - call: "GET /hotels/${hotel_b_id}"
              payload: {}
              as: SalesManager
              captures: { bayside_peak_baseline: $.data.committed_peak_rooms, bayside_nights_baseline: $.data.committed_room_nights }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { opp_v_b: $.data.version, coverage_baseline: $.data.block_coverage_pct }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_a_id}", rooms_peak_invited: 100, expected_opportunity_version: "${opp_v_b}" }
              as: SalesManager
              captures: { c_beta_id: $.data.id }
            - call: "POST /room-block-commitments/${c_beta_id}/offer"
