              as_user_id: mgr-01
            - call: "POST /note-assessments/${a_cft}/assess"
              payload: { outcome: "CONFISCATED", assessment_note: "seized" }
              as: BranchManager
              as_user_id: mgr-01
          assert:
            - "${e_conf}, ${e_ret} and ${e_disc} are all ERR_OUTCOME_NOT_PERMITTED_FOR_DEFECT with HTTP 422, and all three assessments are still SUBMITTED with outcome null after those calls"
            - "A_obs then assesses RETURNED with HTTP 200: recovery_usd_cents stays null and the note leaves the branch, so available stays at 20 while quarantined drops to 2"
            - "A_dmg assesses EXCHANGED_AT_DISCOUNT with recovery_usd_cents 6697 (round_half_up(10000 * 1000000 / 970600) = 10303, then round_half_up(10303 * 6500 / 10000)) and its note returns to available, taking the position to 21 available and 1 quarantined"
            - "A_cft assesses CONFISCATED with recovery_usd_cents null, written_off_note_count 1 and quarantined 0, and it creates exactly one DRAFT COUNTERFEIT_SEIZURE ComplianceReport with note_assessment_id ${a_cft}"
            - "ExchangeTransaction.${txn_id}.compliance_status == FLAGGED after the confiscation while settlement_status stays SETTLED, and GET /compliance-reports returns total_count 1"

