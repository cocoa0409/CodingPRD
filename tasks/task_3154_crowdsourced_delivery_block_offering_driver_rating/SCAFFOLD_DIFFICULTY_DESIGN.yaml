      - both forfeited assignments now have strike_reversed == true with forfeit_cause == SYSTEM_DEACTIVATION preserved
  - name: settle_then_void_conserves_station_pay_liabilities
    grounds:
    - state_machines.PayStatement.OPEN_to_SETTLED
    - state_machines.PayStatement.SETTLED_to_VOIDED
    - calculations.pay_liabilities_aggregation
    - entities.Station.fields.pay_liabilities_cents
    distinguishing_aspect: 'Conserved quantity: Station.pay_liabilities_cents (a money aggregate — different from driver reliability basis points
      in the sibling instance). Settle adds the final pay (0 -> 4155) and its compensating void subtracts exactly the same amount (4155 -> 0):
      liabilities return to the pre-settle value with zero drift.'
    test_recipe:
      setup:
      - Driver ACTIVE (STANDARD at accept); warm-up block [02:00,04:00) base 4000, no surge; one 1.0kg package delivered on time with compliant
        photo; completed at 02:30 -> final_pay = 4000 + 0 + 155 - 0 = 4155 (tier_at_accept STANDARD, bonus 0).
      setup_api_calls:
      - *id003
      - call: POST /stations
        payload:
          name: Station A
          zone_code: SEA1
        as: PlatformAdmin
        captures:
          st: $.data.id
          stv: $.data.version
      - call: POST /drivers/register
        payload:
          legal_name: Dana One
          email: dana.one@example.com
        as: Anonymous
        captures:
          d: $.data.id
      - call: GET /drivers/${d}/screenings
        as: PlatformAdmin
        captures:
          sc: $.data[0].id
      - call: POST /screenings/${sc}/begin-review
        as: PlatformAdmin
      - call: POST /screenings/${sc}/decide
        payload:
          decision: CLEARED
        as: PlatformAdmin
      - call: POST /drivers/${d}/vehicles
        payload:
          vin: VIN-D1-0001
          vehicle_class: SEDAN
        as: Driver
        as_user_id: ${d}
        captures:
          v: $.data.id
      - call: POST /vehicles/${v}/attest-insurance
        payload:
          insurance_expires_on: '2027-01-01'
        as: Driver
        as_user_id: ${d}
      - call: POST /drivers/${d}/activate
        as: PlatformAdmin
      - call: POST /stations/${st}/blocks
        payload:
          starts_at: '2026-09-01T02:00:00Z'
          ends_at: '2026-09-01T04:00:00Z'
          required_vehicle_class: SEDAN
          base_pay_cents: 4000
        as: StationOps
        captures:
          bw: $.data.id
      - call: POST /blocks/${bw}/publish
        as: StationOps
      - call: POST /blocks/${bw}/accept
        payload:
          vehicle_id: ${v}
        as: Driver
        as_user_id: ${d}
        captures:
          aw: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T01:45:00Z'
        as: PlatformAdmin
      - call: POST /assignments/${aw}/check-in
        as: Driver
        as_user_id: ${d}
      - call: POST /assignments/${aw}/load-packages
        payload:
          packages:
          - tracking_code: PW-1
            billable_weight_kg: 1.0
            promised_by: '2026-09-01T03:00:00Z'
        as: StationOps
      - call: POST /assignments/${aw}/depart
        as: Driver
        as_user_id: ${d}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:30:00Z'
        as: PlatformAdmin
      - call: GET /assignments/${aw}/packages
        as: StationOps
        captures:
          pw1: $.data[0].id
      - call: POST /packages/${pw1}/deliver
        payload:
          photo_url: https://img.example/pw1.jpg
          photo_gps_tagged: true
        as: Driver
        as_user_id: ${d}
      - call: POST /assignments/${aw}/complete
        as: StationOps
        captures:
          ps: $.data.id
          ps_final: $.data.final_pay_cents
      - call: GET /stations/${st}
        as: PlatformAdmin
        captures:
          liab_pre: $.data.pay_liabilities_cents
      trigger:
      - call: POST /pay-statements/${ps}/settle
        as: PlatformAdmin
        captures:
          st1: $.data.status
      - call: GET /stations/${st}
        as: PlatformAdmin
        captures:
          liab_mid: $.data.pay_liabilities_cents
      - call: POST /pay-statements/${ps}/void
        as: PlatformAdmin
        captures:
          st2: $.data.status
      - call: GET /stations/${st}
        as: PlatformAdmin
        captures:
          liab_post: $.data.pay_liabilities_cents
      assert:
      - PayStatement.${ps}.final_pay_cents == 4155 (captured ${ps_final}; 4000 + 0 + 155 - 0; driver was STANDARD at accept)
      - 'before settle: captured ${liab_pre} == 0'
      - 'after settle: captured ${st1} == "SETTLED" and ${liab_mid} == 4155'
      - 'after void: captured ${st2} == "VOIDED" and ${liab_post} == 0 again — settle + void conserve the station liability exactly'
