          - "entities.MaintenanceBulletin.fields.supersedes_bulletin_id"
          - "calculations.bulletin_fleet_risk_score"
        distinguishing_aspect: "Creating a successor bulletin flips the predecessor to SUPERSEDED and cancels both its IN_WORK and DEFERRED actions, recomputing action_total_count to 0; with an empty input set the predecessor's risk read returns evaluated_action_count 0 and 0.00 for both variants rather than dividing by zero."
