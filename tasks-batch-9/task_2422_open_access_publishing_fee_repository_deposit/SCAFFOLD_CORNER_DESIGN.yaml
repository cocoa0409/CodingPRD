            - call: "POST /publishers/${k2_pb_id}/screening-runs"
              payload: { doaj_indexed: true, cope_member: true, editorial_board_verified: true, retraction_rate_per_1000: 0.0, peer_review_days_median: 30, apc_transparency_score: 100 }
              as: ScholCommLibrarian
