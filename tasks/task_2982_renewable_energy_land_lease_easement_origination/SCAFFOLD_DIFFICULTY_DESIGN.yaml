      - name: crossing_grant_requires_permitted_corridor
        entity_pair: [CrossingAgreement, Corridor]
        grounds:
          - validations[priority=36]
          - errors.ERR_CORRIDOR_NOT_PERMITTED
          - state_machines.CrossingAgreement.PROPOSED_to_GRANTED
