  - rule_id: compensating_invariant
    instances:
      - name: transfer_approve_then_reverse_conserves_certified_points_sum
        grounds:
          - state_machines.PointTransfer.APPROVED_to_REVERSED
          - calculations.certified_points_derivation
          - entities.Donor.fields.transferred_points_in
          - entities.Donor.fields.transferred_points_out
        distinguishing_aspect: |
          Approve then reverse must restore both donors exactly, not merely
          approximately: the pair's certified-points total is 127.50 before the
          transfer, 127.50 while 40.00 points sit with the recipient (27.50 plus
          100.00), and 127.50 again after the reversal, with both donors back to
          67.50 and 60.00 and both transferred_points counters back to 0.00. Any
          re-derivation of certified_base_points during the reversal, or any
          rounding of the running totals, breaks the restoration.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donor A has one RECEIVED 5,000,000-cent 2026 gift and donor B one RECEIVED 4,500,000-cent 2026 gift; both are NON_ALUMNUS with no tenure."
            - "Recalculation R2026 has been run, communicated and CERTIFIED, giving A 67.50 and B 60.00 certified points."
            - "A has been moved to donor_status DECEASED so the DEATH basis needs no policy exception."
            - "A PointTransfer of 40.00 points from A to B on basis DEATH exists in status REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Wren Source", email: "wren.source@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { wa_id: "$.data.id" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Wren Recipient", email: "wren.recipient@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { wb_id: "$.data.id" }
            - call: "POST /athletics/donors/${wa_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 5000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors/${wb_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 4500000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { r_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${r_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/point-recalculations/${r_id}/send-communications"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/point-recalculations/${r_id}"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
              captures: { r_v: "$.data.version" }
            - call: "POST /athletics/point-recalculations/${r_id}/certify"
              payload: { expected_recalculation_version: "${r_v}" }
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "GET /athletics/donors/${wa_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { wa_v1: "$.data.version" }
            - call: "POST /athletics/donors/${wa_id}/status-change"
              payload: { new_status: "DECEASED", effective_date: "2026-07-01T00:00:00.000Z", reason: "Death certificate on file.", expected_donor_version: "${wa_v1}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { wa_v2: "$.data.version" }
            - call: "POST /athletics/point-transfers"
              payload: { source_donor_id: "${wa_id}", recipient_donor_id: "${wb_id}", basis: "DEATH", points_amount: 40.00, expected_source_donor_version: "${wa_v2}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { tr_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-transfers/${tr_id}/approve"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "POST /athletics/point-transfers/${tr_id}/reverse"
              payload: { reason: "Estate settlement reversed the designation." }
              as: PointsCertifier
              as_user_id: "certifier-1"
          assert:
            - "before the transfer Donor.${wa_id}.certified_points == 67.50 and Donor.${wb_id}.certified_points == 60.00, summing to 127.50"
            - "after approve Donor.${wa_id}.certified_points == 27.50 and Donor.${wb_id}.certified_points == 100.00, summing to 127.50"
            - "after reverse Donor.${wa_id}.certified_points == 67.50"
            - "after reverse Donor.${wb_id}.certified_points == 60.00"
            - "Donor.${wa_id}.transferred_points_out == 0.00"
            - "Donor.${wb_id}.transferred_points_in == 0.00"
            - "Donor.${wa_id}.certified_base_points == 67.50"
            - "Donor.${wb_id}.certified_base_points == 60.00"
            - "PointTransfer.${tr_id}.status == REVERSED"
            - "PointTransfer.${tr_id}.points_amount == 40.00"
            - "PointTransfer.${tr_id}.decision_note == Estate settlement reversed the designation."

      - name: pick_then_release_conserves_section_seat_inventory
        grounds:
          - calculations.section_seat_inventory
          - state_machines.SeatAssignment.HELD_to_RELEASED
          - state_machines.Seat.HELD_to_AVAILABLE
          - state_machines.SelectionSlot.CONSUMED_to_FORFEITED
        distinguishing_aspect: |
          A different compensating pair on a different aggregate: SEC-J's
          inventory quadruple (seats_available, seats_committed_count,
          decommissioned_seat_count, seat_row_count) reads 3/0/0/3, becomes
          2/1/0/3 after a pick, and must return to exactly 3/0/0/3 after the
          release, with the consuming slot walked from CONSUMED to FORFEITED. A
          release that forgets either counter leaves the sum invariant
          seats_available + seats_committed_count + decommissioned_seat_count ==
          seat_row_count broken.
