              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rotation-cycles/${rc0_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_system/advance-invoice-default"
              payload: {}
              as: PlatformAdmin
            - call: "GET /invoices/${inv_id}"
              payload: {}
              as: PlatformAdmin
              captures: { status: "$.data.payment_status" }
          assert:
            - "status == 'DEFAULT'"

  # =========================================================================
  # Excluded-because stubs (§1.8 already covers these)
  # =========================================================================
  - section: state_machines
    instances:

      - name: stub_subscription_pause_cascade_covered_by_difficulty
        claim_type: cascade_down
        grounds:
          - state_machines.RotationCycle.OPEN_to_INVALIDATED
        excluded_because:
          difficulty_instance: subscription_pause_depth3_cascade
          rationale: "The cascade Subscription.pause -> RotationCycle -> Delivery -> Client is the depth-3+ chain already verified end-to-end by the named §1.8 instance."

      - name: stub_delivery_dispute_credit_ledger_sync_covered_by_difficulty
        claim_type: ledger_sync
        grounds:
          - state_machines.Delivery.DISPUTED_to_FINALIZED
        excluded_because:
          difficulty_instance: delivery_resolve_dispute_depth2_credit
          rationale: "The credit-ledger sync (delivery.dispute_credit_cents -> client.credit_balance_cents) is the two-hop cascade already verified by the named §1.8 instance."

  - section: calculations
    instances:

      - name: stub_subscription_fee_at_threshold_covered_by_difficulty
        claim_type: threshold_boundary
        grounds:
          - calculations.subscription_fee
        excluded_because:
          difficulty_instance: subscription_fee_headcount_at_threshold_inclusive
          rationale: "Threshold-inclusive branch already exercised at headcount==threshold by the named §1.8 instance."

      - name: stub_delivery_provisional_rounding_covered_by_difficulty
        claim_type: rounding_precision
        grounds:
          - calculations.delivery_provisional_charge
        excluded_because:
          difficulty_instance: delivery_provisional_per_line_rounding_order
          rationale: "Per-line rounding order divergence already exercised by the named §1.8 instance."
