  - section: endpoints
    instances:
      - name: force_checkout_eviction_records_double_strike
        claim_type: conditional_action
        grounds: [state_machines.Booking.OVERSTAY_to_EVICTED, 'endpoints["POST /bookings/{booking_id}/check-out"]']
        distinguishing_aspect: "SiteOperator force=true on an OVERSTAY booking yields EVICTED with the full penalty and a weight-2 EVICTION strike (driver lands PROBATION from a single eviction)."
        test_recipe:
          setup: ["site (base 5000) 1 reservable stall; booking checked in 2026-08-10T15:30Z; swept OVERSTAY at 11:31Z the next day"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-EV", full_name: "E Vee" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T11:31:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
          trigger:
            - { call: "POST /bookings/${b1}/check-out", payload: { force: true }, as: SiteOperator, as_user_id: "op-alice", captures: { st: $.data.status, fin: $.data.final_total_cents, fee: $.data.fee_cents } }
            - { call: "GET /drivers/${d1}", payload: {}, as: NetworkAdmin, captures: { strk: $.data.strikes_90d, stand: $.data.standing } }
          assert:
            - "Booking.status == EVICTED; force time 2026-08-11T11:31:00Z is 1 minute past due+grace (11:30) -> ceil(1/60) = 1 started hour -> fee_cents == 338; final_total_cents == 4838 (4500 + 338)"
            - "Driver.strikes_90d == 2 (EVICTION weight 2) and standing == PROBATION"

      - name: overstay_escalation_auto_creates_security_incident
        claim_type: side_effect_execution
        grounds: [state_machines.Booking.CHECKED_IN_to_OVERSTAY, entities.IncidentReport.fields.booking_id]
        distinguishing_aspect: "OVERSTAY persisting past due+grace+4h auto-creates exactly one IncidentReport (SECURITY/HIGH, booking linked); the flag prevents duplicates on later sweeps."
        test_recipe:
          setup: ["site 1 reservable stall; booking checked in 2026-08-10; OVERSTAY since 11:31Z; clock moved beyond 15:30Z escalation threshold"]
          setup_api_calls:
