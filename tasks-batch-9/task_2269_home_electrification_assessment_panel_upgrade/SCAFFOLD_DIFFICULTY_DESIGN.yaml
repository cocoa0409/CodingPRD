  - rule_id: transitive_cascade
    instances:

      - name: failed_reinspection_release_cascade_depth_four
        grounds:
          - state_machines.RebateProject.INSTALLED_to_FAILED_FINAL
          - state_machines.Reservation.RESERVED_to_RELEASED
          - calculations.program_budget_conservation
          - entities.ClawbackAction
          - endpoints.GET_/clawback-actions
        distinguishing_aspect: |
          Depth 4, triggered by the RebateProject INSTALLED -> FAILED_FINAL
          transition (a FAIL recorded when remediation_count has already
          reached the program cap). Hop 1 moves the project to FAILED_FINAL;
          hop 2 exists ONLY because hop 1 happened — the Reservation moves
          RESERVED -> RELEASED with release_reason FAILED_REINSPECTION; hop 3
          exists only because hop 2 released the encumbrance — Program budget
          and Household lifetime cap are both restored; hop 4 exists only
          because hop 3 restored those ledgers — a ClawbackAction is appended
          recording the post-release ledger positions. Remove hop 2 and hops 3
          and 4 have nothing to act on.
