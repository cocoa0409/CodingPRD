      - name: third_scope_clarification_is_refused
        claim_type: Violation -> Error
        grounds:
          - validations.priority_23
          - errors.ERR_SCOPE_CLARIFICATION_LIMIT
          - entities.PublicRecordsRequest.fields.scope_clarification_count
        distinguishing_aspect: |
          MAX_SCOPE_CLARIFICATIONS is 2 and the guard is `count < 2` before the write, so
          the second clarification is accepted at count 1 and the third is refused at
          count 2, leaving the narrative from the second clarification in place.
        test_recipe:
          setup:
            - "One request in INTAKE for a GENERAL_PUBLIC requester; the first clarification moves it to SCOPING and each further clarification is a legal SCOPING self-loop until the limit bites."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
