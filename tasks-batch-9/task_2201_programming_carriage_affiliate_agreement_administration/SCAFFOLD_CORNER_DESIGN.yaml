          assert:
            - "after the setup ACCEPT of the 2026-05 report, GET /carriage/agreements/${ac_id} returned penetration_breach_count == 1 and lifecycle_status == \"EXECUTED\" — one breach is not yet enough"
            - "the trigger returns 200 with data.status == \"ACCEPTED\" and data.license_fee_due_cents == 4000000 (billable floor 100,000 x 40.0000, not the reported 95,000)"
            - "the FIRST subsequent GET /carriage/agreements/${ac_id} already returns lifecycle_status == \"SUSPENDED\", suspension_reason == \"PENETRATION_BREACH\" and penetration_breach_count == 2 — no second read and no delay is needed"
            - "the FIRST subsequent GET /carriage/rights-windows/${w_id} already returns status == \"BLOCKED\" and block_reason == \"AGREEMENT_SUSPENDED\""
            - "the FIRST subsequent GET /carriage/content-titles/${ct_id} already returns cleared_window_count == 0 and distribution_coverage_status == \"UNDISTRIBUTED\""
            - "GET /carriage/agreements/${ac_id}/settlement-summary in the same immediate read window returns recognized_revenue_cents == 8000000 — both reports bill at the 100,000 floor, so 4000000 + 4000000 — and revenue_identity_holds == true"
            - "there is no request in which report ${r2_id} reads ACCEPTED while the agreement still reads EXECUTED — the report transition and its cascade share one atomic commit"

      - name: refused_writes_leave_no_partial_state
        claim_type: immediate
        grounds:
          - endpoints[POST /carriage/rights-windows/{windowId}/lifecycle]
          - validations[priority=60]
          - errors[ERR_WINDOW_EXCLUSIVITY_CONFLICT]
