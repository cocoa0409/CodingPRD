      - name: system_fields_are_server_minted_and_version_advances_on_mutation
        claim_type: system_fields
        grounds:
          - entities.Winery.fields.status
          - endpoints.POST_/dtc/wineries/{id}/status
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted: the client never supplies them, and
          the only observable that moves on a mutation is updated_at plus version. Advancing the logical clock
          between the two calls makes the refresh falsifiable — created_at must stay on day one while
          updated_at moves to day two.
        test_recipe:
          setup:
            - "Winery Estate 1 was created while the clock read 2026-08-01T00:00:00Z, so version is 1."
            - "The clock was then advanced to 2026-08-02T00:00:00Z before the mutation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dtc/wineries/${w_id}/status"
              payload: { status: "SUSPENDED", suspension_reason: "Excise filing overdue" }
              as: PlatformAdmin
          assert:
            - "HTTP 200, data.status == \"SUSPENDED\" and data.suspension_reason == \"Excise filing overdue\""
            - "data.version == 2 \u2014 exactly one increment for one mutation"
            - "data.updated_at == \"2026-08-02T00:00:00.000Z\" and data.created_at is still \"2026-08-01T00:00:00.000Z\""
            - "data.id is unchanged from setup and remains a bare UUID"
            - "the computed counters are untouched: data.excise_accrued_cents == 0 and data.open_exception_count == 0"
