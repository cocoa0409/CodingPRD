  - section: endpoints
    instances:
      - name: corner_parcel_compliance_dossier_is_a_computed_read
        claim_type: Computed read
        grounds:
          - endpoints[GET /parcels/{id}/compliance-dossier]
          - entities.Parcel.fields.risk_tier
        distinguishing_aspect: "The dossier is derived on read, not stored: for a parcel with one CONDEMNED well and no permits it reports risk_tier ELEVATED, transfer_hold true, water_quality_flag true, well_count 1, active_operating_permit_count 0 and latest_certificate_grade null."
        test_recipe:
          setup:
            - "A parcel with one DOMESTIC well whose only sample was UNSAFE, and no permits of any kind."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-EP1", county_code: "OR", site_address: "68 Dossier Drive", lot_size_sqft: 40000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
            - call: "POST /wells"
              payload: { parcel_id: "${p_id}", well_type: "DOMESTIC", location_x_ft: 0, location_y_ft: 0, depth_ft: 110 }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { w_id: $.data.id }
            - call: "POST /wells/${w_id}/water-samples"
              payload: { collected_at: "2026-05-01T06:00:00Z", nitrate_mg_l: 2.0, coliform_present: true }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { ws_id: $.data.id }
          trigger:
            - call: "GET /parcels/${p_id}/compliance-dossier"
              payload: {}
              as: RecordsClerk
              as_user_id: "u-rc-1"
          assert:
            - "HTTP 200 and response_type == object"
            - "dossier.parcel_id == ${p_id} and dossier.risk_tier == ELEVATED"
            - "dossier.transfer_hold == true and dossier.water_quality_flag == true"
            - "dossier.well_count == 1 and dossier.active_operating_permit_count == 0"
            - "dossier.fee_balance_cents == 0 and dossier.permitted_design_flow_gpd == 0 and dossier.max_design_flow_gpd == 1500"
            - "dossier.open_repair_order_count == 0 and dossier.latest_certificate_grade == null"

      - name: corner_compliance_summary_report_rolls_up_department_wide_counts
        claim_type: Computed read
        grounds:
          - endpoints[GET /reports/compliance-summary]
        distinguishing_aspect: "The roll-up counts a parcel whose only well is CONDEMNED as advisory_well_count 1 but high_risk_parcel_count 0, because 40 water-quality points reach ELEVATED and not the 60-point HIGH threshold; scoping to a county with no parcels returns all zeros."
        test_recipe:
          setup:
            - "One parcel in county OR with one CONDEMNED well and no permits."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-EP2", county_code: "OR", site_address: "69 Summary Street", lot_size_sqft: 40000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
            - call: "POST /wells"
              payload: { parcel_id: "${p_id}", well_type: "DOMESTIC", location_x_ft: 0, location_y_ft: 0, depth_ft: 110 }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { w_id: $.data.id }
            - call: "POST /wells/${w_id}/water-samples"
              payload: { collected_at: "2026-05-01T06:00:00Z", nitrate_mg_l: 2.0, coliform_present: true }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { ws_id: $.data.id }
          trigger:
            - call: "GET /reports/compliance-summary"
              payload: { county_code: "OR" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
            - call: "GET /reports/compliance-summary"
              payload: { county_code: "WA" }
              as: RecordsClerk
              as_user_id: "u-rc-1"
          assert:
            - "for county OR: parcel_count == 1, advisory_well_count == 1, high_risk_parcel_count == 0"
            - "for county OR: active_operating_permit_count == 0, delinquent_permit_count == 0, due_soon_permit_count == 0, open_repair_order_count == 0, total_fee_balance_cents == 0"
            - "for county WA: parcel_count == 0 and every count is 0"

      - name: corner_child_list_endpoints_filter_strictly_by_foreign_key
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /parcels/{id}/wells]
          - endpoints[GET /parcels/{id}/site-evaluations]
          - entities.Well.fields.parcel_id
        distinguishing_aspect: "With two parcels each carrying one well and one site evaluation, the sub-resource listings return exactly the one child belonging to the requested parcel and never leak the sibling parcel's rows."
        test_recipe:
