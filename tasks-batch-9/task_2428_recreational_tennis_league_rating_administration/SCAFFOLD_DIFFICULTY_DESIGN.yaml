  # ===========================================================================
  # RULE 4 — transitive_cascade
  # Three cascades, each >= 3 levels deep and each fired by a DIFFERENT
  # triggering transition:
  #   4a: POST /tennis/strikes                    (depth 4)
  #   4b: POST /tennis/rating-appeals/{id}/decide (depth 4)
  #   4c: POST /tennis/grievances/{id}/decide     (depth 4)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: strike_suspension_cascades_player_to_spot_to_team_to_league
        grounds:
          - calculations.strike_weight_ledger
          - state_machines.Player.ACTIVE_to_STRIKE_SUSPENDED
          - state_machines.RosterSpot.ACTIVE_to_INELIGIBLE
          - entities.Team.fields.roster_compliant
          - entities.League.fields.noncompliant_team_count
        distinguishing_aspect: |
          A single SCORECARD_FALSIFICATION strike (weight 3) reaches strike_limit 3 and drives
          four levels in one request: Player -> STRIKE_SUSPENDED, its ACTIVE RosterSpot ->
          INELIGIBLE with source_strike_id set, Team.active_roster_size 2 -> 1 with
          roster_compliant false, and League.noncompliant_team_count 0 -> 1; the untouched
          opponent team keeps roster_compliant true, so the cascade is scoped, not global.
        test_recipe:
          setup:
            - "Section SOCAL-2026 with strike_limit 3 and disqualification_strike_limit 6."
            - "One SECTION league with min_active_roster_size 2; two teams of two ACTIVE 4.0 players; both teams are IN_PLAY after start-play, so League.status is IN_PLAY and noncompliant_team_count is 0."
            - "Player h2 has no prior strike, so its strike_count is 0 and its status is ACTIVE."
            - "Clock at 2026-08-08T00:00:00Z."
          setup_api_calls:
            - { call: "POST /tennis/sections", payload: { code: "SOCAL-2026", name: "Southern California", season_year: 2026, min_matches_for_playoff_eligibility: 1, strike_limit: 3, disqualification_strike_limit: 6 }, as: SectionAdmin, captures: { sec: $.data.id } }
            - { call: "POST /tennis/facilities", payload: { section_id: "${sec}", name: "Balboa Courts", court_count: 3, turnaround_buffer_minutes: 30 }, as: SectionAdmin, captures: { fac: $.data.id } }
            - { call: "POST /tennis/leagues", payload: { section_id: "${sec}", tier: "SECTION", ntrp_level: 4.0, age_group: "AGE_18_OVER", format: "MENS_DOUBLES", lines_per_match: 3, min_active_roster_size: 2, max_teams: 8, match_duration_minutes: 180, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-08T00:00:00Z", roster_lock_at: "2026-08-08T00:00:00Z", season_end_at: "2026-10-31T00:00:00Z" }, as: SectionAdmin, captures: { lg: $.data.id } }
            - { call: "POST /tennis/leagues/${lg}/open-registration", payload: {}, as: SectionAdmin }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H1 Alvarez", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph1: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H2 Boyd", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph2: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A1 Garza", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa1: $.data.id } }
