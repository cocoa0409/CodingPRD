# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cruise Booking & Cabin Management — Expert
# 9 rules x >= 2 instances = 18 instances.
# All money in integer cents. Numeric asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_cash_vs_fcc_diverges_on_booking
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.cancel_refund_cents
          - entities.Booking.fields.fcc_credit_cents
        distinguishing_aspect: |
          Same CONFIRMED booking (booking_total 367607, paid in full, 75 days before sailing,
          25% tier penalty 91902) cancelled CASH yields cancel_refund_cents=275705 while the FCC
          variant yields fcc_credit_cents=321656 — a divergence on the Booking entity domain.
        test_recipe:
          setup:
            - "Clock at 2026-06-18T16:00:00Z (75 days before embark)."
            - "OPEN sailing embarking 2026-09-01T16:00:00Z, one BALCONY category (base 119900, max_occ 4) with 2 cabins."
            - "A CONFIRMED balcony booking, 3 guests, paid in full (deposit 75000 + final 292607 = 367607)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T16:00:00Z" }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-1", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-1"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "A One", age: 40 }
              as: GuestUser
              as_user_id: "guest-1"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "A Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-1"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "A Three", age: 10 }
              as: GuestUser
              as_user_id: "guest-1"
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "DEPOSIT", amount_cents: 75000 }
              as: GuestUser
              as_user_id: "guest-1"
              captures: { dep_id: $.data.id }
            - call: "POST /payments/${dep_id}/capture"
              payload: {}
              as: GuestUser
              as_user_id: "guest-1"
            - call: "POST /bookings/${b_id}/hold-deposit"
              payload: {}
              as: GuestUser
              as_user_id: "guest-1"
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "FINAL", amount_cents: 292607 }
              as: GuestUser
              as_user_id: "guest-1"
              captures: { fin_id: $.data.id }
            - call: "POST /payments/${fin_id}/capture"
              payload: {}
              as: GuestUser
              as_user_id: "guest-1"
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: GuestUser
              as_user_id: "guest-1"
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: { cancellation_mode: "CASH" }
              as: GuestUser
              as_user_id: "guest-1"
          assert:
            - "Booking.${b_id}.status == CANCELLED"
            - "Booking.${b_id}.cancellation_mode == CASH"
            - "Booking.${b_id}.cancel_refund_cents == 275705"
            - "Booking.${b_id}.fcc_credit_cents == 0"

      - name: guest_fare_provisional_vs_final_group_diverges
        grounds:
          - calculations.guest_fare_assessment
          - state_machines.Booking.DEPOSIT_HELD_to_CONFIRMED
          - entities.Guest.fields.base_fare_cents
          - entities.Guest.fields.final_fare_cents
        distinguishing_aspect: |
          For occupancy-index-1 guest with base 119900 drawn from a 15%-discount group block,
          final_fare_cents == base_fare_cents (119900) while DEPOSIT_HELD, then becomes
          half_up(119900*0.85)=101915 after confirm — a provisional-vs-final divergence on the Guest entity domain.
          (Distinct from the cancellation dual-variant which lives on Booking.)
          group block fares: [101915, 101915, 56053].
          group block taxes: [20620, 20620, 15346]; booking_total 316469.
          group block deposit floor 25000*3=75000 vs 20% of 316469=63294 -> deposit 75000.
          group block final due 316469-75000=241469.
          group block guest 3 base 65945 -> final half_up(65945*0.85)=56053.
          group block guest 3 tax half_up(56053*0.115)+8900=15346.
          group block guest 1/2 tax half_up(101915*0.115)+8900=20620.
          group block fare_total 101915+101915+56053=259883.
          group block tax_total 20620+20620+15346=56586; total 316469.
          provisional (pre-confirm) guest1 final_fare_cents 119900.
        test_recipe:
          setup:
            - "Clock at 2026-06-18T16:00:00Z."
            - "OPEN sailing, one BALCONY category (base 119900, max_occ 4) with 4 cabins."
            - "A HELD group block of size 2 at 15% discount drawing from that category (2 cabins BLOCKED)."
            - "A booking drawing from that group block, 3 guests, DEPOSIT_HELD (deposit 75000 captured)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T16:00:00Z" }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8003", deck: 9 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8004", deck: 9 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${s_id}", group_name: "Reunion", cabin_category_id: "${cc_id}", block_size: 2, group_discount_pct: 0.15, release_cutoff_date: "2026-08-01T00:00:00Z" }
              as: RevenueManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/hold"
              payload: {}
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", group_block_id: "${gb_id}", owner_user_id: "guest-2", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-2"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "G One", age: 41 }
              as: GuestUser
              as_user_id: "guest-2"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "G Two", age: 39 }
              as: GuestUser
              as_user_id: "guest-2"
              captures: { g3_pre: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "G Three", age: 9 }
              as: GuestUser
              as_user_id: "guest-2"
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "DEPOSIT", amount_cents: 75000 }
              as: GuestUser
              as_user_id: "guest-2"
              captures: { dep_id: $.data.id }
            - call: "POST /payments/${dep_id}/capture"
              payload: {}
              as: GuestUser
              as_user_id: "guest-2"
            - call: "POST /bookings/${b_id}/hold-deposit"
              payload: {}
              as: GuestUser
              as_user_id: "guest-2"
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "FINAL", amount_cents: 241469 }
              as: GuestUser
              as_user_id: "guest-2"
              captures: { fin_id: $.data.id }
            - call: "POST /payments/${fin_id}/capture"
              payload: {}
              as: GuestUser
              as_user_id: "guest-2"
          trigger:
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: GuestUser
              as_user_id: "guest-2"
          assert:
            - "Booking.${b_id}.status == CONFIRMED"
            - "Booking.${b_id}.fare_total_cents == 259883"
            - "Booking.${b_id}.booking_total_cents == 316469"
            - "the occupancy-index-1 Guest of ${b_id} has final_fare_cents == 101915 after confirm (was 119900 while DEPOSIT_HELD)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: occupancy_tiered_fare_nonlinear_three_inputs
        grounds:
          - calculations.guest_fare_assessment
          - calculations.booking_total
          - entities.Guest.fields.base_fare_cents
        distinguishing_aspect: |
          Mode (a): fare depends non-linearly on (base 119900, occupancy_index, THIRD_FOURTH_PCT 0.55)
          via a branch on occupancy_index — positions 1-2 pay 119900, position 3 pays half_up(119900*0.55)=65945,
          so fare_total for 3 guests = 119900+119900+65945 = 305745 (not 3*119900).
        test_recipe:
          setup:
            - "Clock at 2026-06-18T16:00:00Z."
            - "OPEN sailing, BALCONY category (base 119900, max_occ 4) with 2 cabins."
            - "A QUOTE booking with 3 guests (no group block)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T16:00:00Z" }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-3", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-3"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C One", age: 40 }
              as: GuestUser
              as_user_id: "guest-3"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-3"
          trigger:
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "C Three", age: 11 }
              as: GuestUser
              as_user_id: "guest-3"
              captures: { g3_id: $.data.id }
          assert:
            - "Guest.${g3_id}.occupancy_index == 3"
            - "Guest.${g3_id}.base_fare_cents == 65945"
            - "Booking.${b_id}.fare_total_cents == 305745"

      - name: tax_port_round_per_guest_then_sum_pinned_order
        grounds:
          - calculations.booking_total
          - calculations.guest_fare_assessment
          - entities.Guest.fields.tax_port_cents
          - entities.Booking.fields.tax_port_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned to round-per-guest-then-sum. Per-guest taxes are
          half_up(119900*0.115)+8900=22689 (x2) and half_up(65945*0.115)+8900=16484, summing to 61862.
          Sum-then-round would give half_up(305745*0.115)+3*8900=61861 — the pinned order yields 61862, not 61861.
        test_recipe:
          setup:
            - "Clock at 2026-06-18T16:00:00Z."
            - "OPEN sailing, BALCONY category (base 119900, max_occ 4) with 2 cabins."
            - "A QUOTE booking with 2 guests already added (occupancy 1-2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T16:00:00Z" }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-4", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-4"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "D One", age: 40 }
              as: GuestUser
              as_user_id: "guest-4"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "D Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-4"
          trigger:
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "D Three", age: 12 }
              as: GuestUser
              as_user_id: "guest-4"
              captures: { g3_id: $.data.id }
          assert:
            - "Guest.${g3_id}.tax_port_cents == 16484"
            - "Booking.${b_id}.tax_port_total_cents == 61862"
            - "Booking.${b_id}.booking_total_cents == 367607"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_revise_cycle_deposit_held_back_to_quote
        grounds:
          - state_machines.Booking.DEPOSIT_HELD_to_QUOTE
          - state_machines.Booking.QUOTE_to_DEPOSIT_HELD
          - entities.Booking.fields.cabin_id
        distinguishing_aspect: |
          Booking exhibits a cycle DEPOSIT_HELD -> QUOTE (revise) -> DEPOSIT_HELD: after revise the
          held cabin is released (cabin_id back to null, category available_cabins restored to 2),
          distinct from the Payment/Folio linear machines.
        test_recipe:
          setup:
            - "OPEN sailing, BALCONY category (base 119900, max_occ 4) with 2 cabins (available_cabins=2)."
            - "A booking with 2 guests, deposit 50000... (recompute) — use 2 guests, deposit = max(20% of 195978=39196, 50000)=50000, captured, DEPOSIT_HELD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T16:00:00Z" }
              as: RevenueManager
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-5", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-5"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "E One", age: 40 }
              as: GuestUser
              as_user_id: "guest-5"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "E Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-5"
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "DEPOSIT", amount_cents: 50000 }
              as: GuestUser
              as_user_id: "guest-5"
              captures: { dep_id: $.data.id }
            - call: "POST /payments/${dep_id}/capture"
              payload: {}
              as: GuestUser
              as_user_id: "guest-5"
            - call: "POST /bookings/${b_id}/hold-deposit"
              payload: {}
              as: GuestUser
              as_user_id: "guest-5"
          trigger:
            - call: "POST /bookings/${b_id}/revise"
              payload: {}
              as: GuestUser
              as_user_id: "guest-5"
          assert:
            - "Booking.${b_id}.status == QUOTE"
            - "Booking.${b_id}.cabin_id == null"
            - "CabinCategory.${cc_id}.available_cabins == 2"
            - "CabinCategory.${cc_id}.held_cabins == 0"

      - name: group_block_held_recall_back_to_negotiating_cycle
        grounds:
          - state_machines.GroupBlock.HELD_to_NEGOTIATING
          - state_machines.GroupBlock.NEGOTIATING_to_HELD
          - entities.GroupBlock.fields.blocked_count
        distinguishing_aspect: |
          GroupBlock exhibits a cycle NEGOTIATING -> HELD -> NEGOTIATING (recall): recall returns the
          2 BLOCKED cabins to AVAILABLE (blocked_count back to 0, category available_cabins restored to 4),
          a non-linear machine on a different entity (GroupBlock, not Booking).
        test_recipe:
          setup:
            - "OPEN sailing, BALCONY category with 4 cabins (available_cabins=4)."
            - "A HELD group block of size 2 (2 cabins BLOCKED, available_cabins=2), no bookings drawn."
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8003", deck: 9 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8004", deck: 9 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${s_id}", group_name: "Reunion", cabin_category_id: "${cc_id}", block_size: 2, group_discount_pct: 0.15, release_cutoff_date: "2026-08-01T00:00:00Z" }
              as: RevenueManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/hold"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${gb_id}/recall"
              payload: {}
              as: RevenueManager
          assert:
            - "GroupBlock.${gb_id}.status == NEGOTIATING"
            - "GroupBlock.${gb_id}.blocked_count == 0"
            - "CabinCategory.${cc_id}.available_cabins == 4"
            - "CabinCategory.${cc_id}.blocked_cabins == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_group_booking_depth3_cabin_category_block
        grounds:
          - state_machines.Booking.DEPOSIT_HELD_to_CANCELLED
          - entities.Cabin.fields.status
          - entities.CabinCategory.fields.blocked_cabins
          - entities.GroupBlock.fields.materialized_count
        distinguishing_aspect: |
          Depth-3 chain triggered by booking-cancel: cancel Booking -> the held Cabin returns to BLOCKED
          (group draw) -> CabinCategory.blocked_cabins increments back to 2 -> GroupBlock.materialized_count
          decrements from 1 to 0. Each hop is caused by the prior hop, not the original cancel.
