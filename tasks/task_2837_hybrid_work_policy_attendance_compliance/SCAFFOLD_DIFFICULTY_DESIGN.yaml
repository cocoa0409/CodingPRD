  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_neighborhood_version_outranks_seat_entitlement
        grounds:
          - validations[priority=40, ERR_STALE_NEIGHBORHOOD_VERSION]
          - validations[priority=70, ERR_SEAT_ENTITLEMENT_EXCEEDED]
          - concurrency_rules.seat-allocation-create-stale-neighborhood
          - calculations.team_seat_entitlement
        priority_pair: [40, 70]
        expected_error: ERR_STALE_NEIGHBORHOOD_VERSION
        distinguishing_aspect: |
          One POST /seat-allocations violates the OCC posture check at band 40 AND
          the team entitlement ceiling at band 70. The naive implementation
          validates the business ceiling first and answers 409
          ERR_SEAT_ENTITLEMENT_EXCEEDED; the pinned precedence answers 412
          ERR_STALE_NEIGHBORHOOD_VERSION. Repairing only the version then exposes
          the 409, and repairing only the seat count still yields the 412 - so the
          test pins the order rather than the pair.
        test_recipe:
          setup:
            - "One OPEN cycle, team T1-CORE with headcount_planned 12 and expected_days_in_office_per_week 3, so expected_daily_attendance is ceil(36/5) = 8, base_entitlement 8, tier max_base 10 -> buffer_pct 0.20, buffer_seats_entitled ceil(1.6) = 2 and entitled_seats 10."
            - "Neighborhood N-A1 with seat_count 30 and buffer_seats 4 (usable capacity 26, far above the team entitlement, so capacity at band 70 is NOT the binding constraint)."
            - "One RESERVED SeatAllocation of 5 seats over [2026-W37, 2026-W41) created with the neighborhood version observed at creation, which advances Neighborhood.version by 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-PP1", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T1-CORE", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t1_id: $.data.id }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${cyc_id}", anchor_team_id: "${t1_id}", neighborhood_code: "N-A1", site_code: "NYC-01", seat_count: 30, buffer_seats: 4, desk_index_from: 1, desk_index_to: 30 }
              as: WorkplaceProgramOffice
              captures: { n1_id: $.data.id, n1_v: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t1_id}", allocated_seats: 5, window_start_week: "2026-W37", window_end_week: "2026-W41", expected_neighborhood_version: "${n1_v}" }
              as: WorkplaceProgramOffice
              captures: { alloc_a: $.data.id }
          trigger:
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t1_id}", allocated_seats: 30, window_start_week: "2026-W38", window_end_week: "2026-W40", expected_neighborhood_version: "${n1_v}" }
              as: WorkplaceProgramOffice
            - call: "GET /neighborhoods/${n1_id}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { n1_v2: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t1_id}", allocated_seats: 30, window_start_week: "2026-W38", window_end_week: "2026-W40", expected_neighborhood_version: "${n1_v2}" }
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t1_id}", allocated_seats: 5, window_start_week: "2026-W38", window_end_week: "2026-W40", expected_neighborhood_version: "${n1_v2}" }
              as: WorkplaceProgramOffice
          assert:
            - "Team.${t1_id}.expected_daily_attendance == 8, base_entitlement == 8, buffer_seats_entitled == 2, entitled_seats == 10"
            - "Call 1 (stale version AND 30 seats) returns HTTP 412 with error id ERR_STALE_NEIGHBORHOOD_VERSION - NOT 409 ERR_SEAT_ENTITLEMENT_EXCEEDED"
            - "Call 3 (fresh version, still 30 seats) returns HTTP 409 with error id ERR_SEAT_ENTITLEMENT_EXCEEDED, proving the band-70 rule was genuinely violated in call 1 too"
            - "Call 4 (fresh version, 5 seats, total 10 in weeks W38..W39 equals entitled_seats exactly) returns HTTP 201 with status RESERVED"
            - "No SeatAllocation row was created by calls 1 or 3: GET /seat-allocations?neighborhood_id=${n1_id} returns exactly 2 rows after the whole sequence"
            - "Neighborhood.${n1_id}.version advanced only on the successful creations, so ${n1_v2} == ${n1_v} + 1 and the final version is ${n1_v} + 2"

