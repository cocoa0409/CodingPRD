        captures:
          col_id: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: C1
          sex: MALE
          approximate_age_months: 20
        as: ProgramCoordinator
        captures:
          c1: $.data.id
      - call: POST /tnr/colonies/${col_id}/cats
        payload:
          intake_tag: C2
          sex: FEMALE
          approximate_age_months: 22
        as: ProgramCoordinator
        captures:
