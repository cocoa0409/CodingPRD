            - { call: "POST /host-assignments", payload: { on_site_host_id: "${host_id}", booking_id: "${bk_id}", hospitality_build_id: "${hb1}", shift_start: "2027-02-01T10:00:00.000Z", shift_end: "2027-02-01T20:01:00.000Z" }, as: OperationsManager, as_user_id: u_ops, captures: { e_window: "$.data.error_id" } }
            - { call: "POST /host-assignments", payload: { on_site_host_id: "${host_id}", booking_id: "${bk_id}", hospitality_build_id: "${hb1}", shift_start: "2027-02-01T09:00:00.000Z", shift_end: "2027-02-01T20:00:00.000Z" }, as: OperationsManager, as_user_id: u_ops, captures: { ok_id: "$.data.id", ok_state: "$.data.assignment_state" } }
