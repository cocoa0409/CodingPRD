          trigger:
            - call: "POST /violations"
              payload: { easement_id: "${ease_a_id}", violation_type: "IMPERVIOUS_EXCEEDANCE", excess_sqft: 2000, notes: "exactly at the major threshold" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
              captures: { viol_minor_id: $.data.id }
            - call: "POST /violations"
              payload: { easement_id: "${ease_a_id}", violation_type: "IMPERVIOUS_EXCEEDANCE", excess_sqft: 2001, notes: "one square foot over the major threshold" }
              as: StewardshipMonitor
              as_user_id: "monitor-1"
              captures: { viol_major_id: $.data.id }
          assert:
            - "Easement.${ease_a_id}.impervious_allowance_sqft == 139392"
            - "the first trigger call returns HTTP 201 with Violation.${viol_minor_id}.severity == MINOR"
            - "Violation.${viol_minor_id}.opened_on == 2027-06-03T00:00:00Z and cure_deadline_on == 2027-11-30T00:00:00Z"
            - "the second trigger call returns HTTP 201 with Violation.${viol_major_id}.severity == MAJOR"
            - "Violation.${viol_major_id}.opened_on == 2027-06-03T00:00:00Z and cure_deadline_on == 2027-09-01T00:00:00Z"
            - "both violations have status == OPEN"
            - "Easement.${ease_a_id}.open_violation_count == 2 and compliance_status == VIOLATION_OPEN and stewardship_hold == true"

      - name: composite_score_receipt_versus_round_close_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.application_composite_score.variants
        excluded_because:
          difficulty_instance: composite_score_receipt_basis_versus_round_close_basis
          rationale: "That §1.8 instance ranks the identical stored data on both bases and asserts the 12.50-point delta."

      - name: easement_value_variant_selection_by_endpoint
        claim_type: Variant Selection
        grounds:
          - calculations.easement_value.variants
        excluded_because:
          difficulty_instance: easement_value_preliminary_assessor_versus_certified_appraisal_basis
          rationale: "That §1.8 instance asserts POST /applications selects the preliminary basis and POST /appraisals/{id}/submission selects the certified basis, with a delta of 17,650,000."

      - name: waterfall_fills_the_first_bucket_before_the_second_and_places_the_remainder
        claim_type: Correct Result
        grounds:
          - calculations.funding_waterfall_allocation.constants
        excluded_because:
          difficulty_instance: funding_waterfall_per_source_floor_then_remainder_to_last_non_zero_take
          rationale: "That §1.8 instance asserts the priority-ordered fill, the per-source floors summing one cent short, and the LAST_NON_ZERO_TAKE remainder placement."

      - name: composite_score_at_the_minimum_selection_threshold
        claim_type: Correct Result
        grounds:
          - calculations.application_composite_score
          - entities.PreservationProgram.fields.min_composite_score
        excluded_because:
          difficulty_instance: composite_score_sixty_exact_ranks_while_fifty_nine_ninety_nine_is_not_selected
          rationale: "That §1.8 instance is the inclusive-threshold boundary pair at 60.00 and 59.99."

      - name: impervious_allowance_threshold_and_exceedance_split
        claim_type: Correct Result
        grounds:
          - calculations.impervious_allowance_and_exceedance
        excluded_because:
          difficulty_instance: impervious_exceedance_at_allowance_exactly_passes_one_sqft_over_opens_violation
          rationale: "That §1.8 instance probes the strictly-greater-than exceedance test at the allowance and one square foot beyond it."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_x_user_id_header_or_unknown_role_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 and priority 2 are the two independent authentication gates: a request with no X-User-ID header and a request whose X-User-Role is a token outside the six declared roles both return 401 ERR_UNAUTHENTICATED, and neither is reported as 403."
        test_recipe:
          setup:
            - "Program P1, one Landowner and Parcel PA1 exist. The clock is 2026-08-10."
          setup_api_calls:
            - *k_prog1
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
          trigger:
            - call: "GET /parcels/${parcel_a_id}"
              payload: {}
              as: ProgramAdmin
              note: "sent with the X-User-Role header only; the X-User-ID header is absent"
            - call: "GET /parcels/${parcel_a_id}"
              payload: {}
              as: Auditor
              as_user_id: "admin-1"
              note: "X-User-Role carries the token Auditor, which is not one of the six declared roles"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: ProgramAdmin
              note: "sent with no X-User-ID and no X-User-Role header at all; this endpoint is the one declared exemption"
          assert:
            - "the first trigger call returns HTTP 401 with error.code == ERR_UNAUTHENTICATED"
            - "the second trigger call returns HTTP 401 with error.code == ERR_UNAUTHENTICATED, not HTTP 403"
            - "the third trigger call returns HTTP 200 and the logical clock becomes 2026-08-11T00:00:00Z"
            - "no Parcel row is read or mutated by either rejected call"

      - name: priority_three_forbidden_role_is_reported_before_the_unknown_round_id
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - roles[ProgramAdmin].exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Landowner calling POST /funding-rounds/{id}/opening on an id that does not exist gets 403 ERR_FORBIDDEN_ROLE, because priority 3 (role check) runs before priority 4 (path-id resolution); the same call as ProgramAdmin then reveals 404 ERR_ROUND_NOT_FOUND."
        test_recipe:
          setup:
            - "Program P1 and one Landowner exist. No FundingRound has been created, so the id 00000000-0000-0000-0000-0000000000ff resolves to nothing."
          setup_api_calls:
            - *k_prog1
            - *k_lo_a
          trigger:
            - call: "POST /funding-rounds/00000000-0000-0000-0000-0000000000ff/opening"
              payload: {}
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "POST /funding-rounds/00000000-0000-0000-0000-0000000000ff/opening"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the first trigger call returns HTTP 403 with error.code == ERR_FORBIDDEN_ROLE"
            - "the first trigger call does NOT return HTTP 404 and does not leak whether the round exists"
            - "the second trigger call returns HTTP 404 with error.code == ERR_ROUND_NOT_FOUND"

      - name: unknown_path_id_is_reported_before_the_invalid_body_returns_not_found
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_APPLICATION_NOT_FOUND]
        distinguishing_aspect: "POST /applications/{id}/counters against a non-existent application with an empty body — which also violates priority 6 by omitting the required counter_cents — returns 404 ERR_APPLICATION_NOT_FOUND, not 422; the same empty body against the real application then returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "The canonical chain has been driven to an OFFER_ISSUED application AP1 for landowner LO_A at clock 2026-10-05."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
          trigger:
            - call: "POST /applications/00000000-0000-0000-0000-0000000000aa/counters"
              payload: {}
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "POST /applications/${app_a_id}/counters"
              payload: {}
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the first trigger call returns HTTP 404 with error.code == ERR_APPLICATION_NOT_FOUND"
            - "the second trigger call returns HTTP 422 with error.code == ERR_INVALID_REQUEST and names counter_cents in error.details"
            - "Application.${app_a_id}.status remains OFFER_ISSUED after both calls"

      - name: invalid_request_is_reported_before_the_not_resource_owner_error
        claim_type: Priority Ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "Landowner LO_B filing on LO_A's parcel with requested_price_cents == -1 breaks priority 6 and priority 7 at once and returns 422 ERR_INVALID_REQUEST; correcting only the price surfaces 403 ERR_NOT_RESOURCE_OWNER, proving the domain check runs first."
        test_recipe:
          setup:
            - "Program P1, Round R1 OPEN, Parcel PA1 owned by LO_A, and a second Landowner LO_B who owns nothing. The clock is 2026-08-10."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - &k_lo_b
              call: "POST /landowners"
              payload: { legal_name: "Vireo Ridge LLC", mailing_state: "PA", tax_id_last4: "8802" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { lo_b_id: $.data.id }
            - *k_clk_0810
            - *k_parcel_a
          trigger:
            - call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_b_id}", requested_price_cents: -1 }
              as: Landowner
              as_user_id: "${lo_b_id}"
            - call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_b_id}", requested_price_cents: 170000000 }
              as: Landowner
              as_user_id: "${lo_b_id}"
            - call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_a_id}", requested_price_cents: 170000000 }
              as: Landowner
              as_user_id: "${lo_b_id}"
          assert:
            - "the first trigger call returns HTTP 422 with error.code == ERR_INVALID_REQUEST (requested_price_cents must be >= 0)"
            - "the second trigger call returns HTTP 403 with error.code == ERR_NOT_RESOURCE_OWNER because Parcel.${parcel_a_id}.landowner_id != ${lo_b_id}"
            - "the third trigger call returns HTTP 403 with error.code == ERR_NOT_RESOURCE_OWNER because X-User-ID ${lo_b_id} != body landowner_id ${lo_a_id}"
            - "no Application row exists after the three calls and Parcel.${parcel_a_id}.status is still ELIGIBLE"

      - name: stale_application_version_is_reported_before_the_application_state_conflict
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - concurrency.application_offer_occ
          - errors[ERR_STALE_APPLICATION_VERSION]
        distinguishing_aspect: "Replaying the offer with the version captured while the application was RANKED breaks priority 8 (stale version) and priority 12 (no RANKED transition available from OFFER_ISSUED) at once; the response is 412 ERR_STALE_APPLICATION_VERSION, never 409."
        test_recipe:
          setup:
            - "Application AP1 was ranked, its version captured as app_a_v1, and an offer of 175,550,000 was then issued, which bumped the version to app_a_v1 + 1 and moved status to OFFER_ISSUED."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
          trigger:
            - call: "POST /applications/${app_a_id}/offers"
              payload: { expected_application_version: "${app_a_v1}", offer_cents: 170000000, structure: "FULL_PURCHASE", offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - call: "GET /applications/${app_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { app_a_v_after: $.data.version }
            - call: "POST /applications/${app_a_id}/offers"
              payload: { expected_application_version: "${app_a_v_after}", offer_cents: 170000000, structure: "FULL_PURCHASE", offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
          assert:
            - "the first trigger call returns HTTP 412 with error.code == ERR_STALE_APPLICATION_VERSION"
            - "the first trigger call does NOT return ERR_INVALID_APPLICATION_STATE even though OFFER_ISSUED admits no second RANKED -> OFFER_ISSUED step"
            - "Application.${app_a_id}.version is unchanged by the rejected call and equals ${app_a_v_after}"
            - "the third trigger call, carrying the fresh version, returns HTTP 409 with error.code == ERR_INVALID_APPLICATION_STATE"
            - "Application.${app_a_id}.current_offer_cents is still 175550000 after all three calls"

      - name: appraisal_review_by_the_engaging_officer_or_the_appraiser_is_rejected
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=16]
          - errors[ERR_APPRAISAL_REVIEW_SOD]
          - state_machines.Appraisal.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: "The segregation-of-duties test on an appraisal review compares X-User-ID against two different columns on the Appraisal row: engaged_by_user_id (officer-1) and appraiser_user_id (appraiser-1). Either identity returns 403 ERR_APPRAISAL_REVIEW_SOD while holding the AppraisalReviewer role; a third identity certifies."
        test_recipe:
          setup:
            - "Appraisal AR1 on application AP1 was engaged by officer-1, assigned to appraiser-1, and submitted at clock 2026-08-20, so its status is SUBMITTED."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
          trigger:
            - call: "POST /appraisals/${appr_a_id}/review"
              payload: { decision: "CERTIFY" }
              as: AppraisalReviewer
              as_user_id: "officer-1"
            - call: "POST /appraisals/${appr_a_id}/review"
              payload: { decision: "CERTIFY" }
              as: AppraisalReviewer
              as_user_id: "appraiser-1"
            - call: "POST /appraisals/${appr_a_id}/review"
              payload: { decision: "REJECT" }
              as: AppraisalReviewer
              as_user_id: "reviewer-1"
            - call: "POST /appraisals/${appr_a_id}/review"
              payload: { decision: "CERTIFY", review_note: "comparable sales verified" }
              as: AppraisalReviewer
              as_user_id: "reviewer-1"
          assert:
            - "the first trigger call returns HTTP 403 with error.code == ERR_APPRAISAL_REVIEW_SOD (caller is Appraisal.engaged_by_user_id)"
            - "the second trigger call returns HTTP 403 with error.code == ERR_APPRAISAL_REVIEW_SOD (caller is Appraisal.appraiser_user_id)"
            - "the third trigger call returns HTTP 422 with error.code == ERR_INVALID_REQUEST because a REJECT decision requires review_note"
            - "the fourth trigger call returns HTTP 200 with Appraisal.${appr_a_id}.status == CERTIFIED"
            - "Application.${app_a_id}.certified_easement_value_cents == 175550000 and easement_value_basis == CERTIFIED_APPRAISAL_BASIS"
            - "Appraisal.${appr_a_id}.status was still SUBMITTED immediately after the two rejected reviews"

      - name: mortgage_subordination_submission_without_the_recorded_lienholder_is_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority=23]
          - errors[ERR_LIENHOLDER_REQUIRED]
          - entities.Parcel.fields.mortgage_lienholder_name
          - state_machines.ClosingRequirement.OUTSTANDING_to_SUBMITTED
        distinguishing_aspect: "lienholder_name is required-and-matching on exactly one requirement_type and forbidden on the others: a MORTGAGE_SUBORDINATION submission with no lienholder_name, one naming the wrong bank, and a TITLE_COMMITMENT submission that carries a lienholder_name all return 409 ERR_LIENHOLDER_REQUIRED."
        test_recipe:
          setup:
            - "Application AP1 was accepted at clock 2026-10-12, which created its three closing requirements in status OUTSTANDING. Parcel PA1 records mortgage_lienholder_name Midstate Farm Credit."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - *k_offer_a
            - *k_get_app_a_v2
            - *k_plan_a
            - *k_clk_1012
            - *k_accept_a
            - *k_get_req_title
            - *k_get_req_sub
          trigger:
            - call: "POST /closing-requirements/${req_sub_id}/submission"
              payload: {}
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - call: "POST /closing-requirements/${req_sub_id}/submission"
              payload: { lienholder_name: "Keystone Savings" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - call: "POST /closing-requirements/${req_title_id}/submission"
              payload: { exception_count: 0, lienholder_name: "Midstate Farm Credit" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - call: "POST /closing-requirements/${req_sub_id}/submission"
              payload: { lienholder_name: "Midstate Farm Credit" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
          assert:
            - "the first trigger call returns HTTP 409 with error.code == ERR_LIENHOLDER_REQUIRED"
            - "the second trigger call returns HTTP 409 with error.code == ERR_LIENHOLDER_REQUIRED because the name does not equal Parcel.mortgage_lienholder_name"
            - "the third trigger call returns HTTP 409 with error.code == ERR_LIENHOLDER_REQUIRED because a TITLE_COMMITMENT submission must not carry lienholder_name"
            - "ClosingRequirement.${req_title_id}.status is still OUTSTANDING after the third call"
            - "the fourth trigger call returns HTTP 200 with ClosingRequirement.${req_sub_id}.status == SUBMITTED and submitted_by_user_id == officer-1"
            - "Application.${app_a_id}.closing_status is still PENDING_REQUIREMENTS with requirement_satisfied_count == 0"

      - name: counter_filed_after_the_offer_expiry_date_is_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=21]
          - errors[ERR_COUNTER_NOT_HIGHER]
          - state_machines.Application.OFFER_ISSUED_to_COUNTERED
        distinguishing_aspect: "ERR_COUNTER_NOT_HIGHER guards two independent conditions on the same endpoint: a counter that equals the standing offer, and a counter that is strictly higher but arrives after current_offer_expires_on. The inclusive boundary is proved by a counter accepted at exactly the expiry instant."
        test_recipe:
          setup:
            - "Application AP1 is RANKED at clock 2026-10-05 with certified_easement_value_cents 175,550,000."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
            - call: "POST /applications/${app_a_id}/offers"
              payload: { expected_application_version: "${app_a_v1}", offer_cents: 170000000, structure: "FULL_PURCHASE", offer_expires_on: "2026-11-19T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /applications/${app_a_id}/counters"
              payload: { counter_cents: 170000000, rationale: "equal to the standing offer" }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-19T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /applications/${app_a_id}/counters"
              payload: { counter_cents: 172000000, rationale: "filed on the expiry date itself" }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "GET /applications/${app_a_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { app_a_v_countered: $.data.version }
            - call: "POST /applications/${app_a_id}/offers"
              payload: { expected_application_version: "${app_a_v_countered}", offer_cents: 173000000, structure: "FULL_PURCHASE", offer_expires_on: "2026-11-25T00:00:00Z" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-26T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /applications/${app_a_id}/counters"
              payload: { counter_cents: 175550000, rationale: "one day after the second offer expired" }
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the first trigger call returns HTTP 409 with error.code == ERR_COUNTER_NOT_HIGHER because 170000000 is not strictly greater than the standing offer"
            - "the third trigger call returns HTTP 200 because the clock equals current_offer_expires_on exactly, and Application.${app_a_id}.status becomes COUNTERED with last_counter_cents == 172000000"
            - "the fifth trigger call returns HTTP 200 with status OFFER_ISSUED, current_offer_cents == 173000000 and current_offer_expires_on == 2026-11-25T00:00:00Z"
            - "the seventh trigger call returns HTTP 409 with error.code == ERR_COUNTER_NOT_HIGHER even though 175550000 is both strictly greater than 173000000 and within the certified value"
            - "Application.${app_a_id}.status is still OFFER_ISSUED and negotiation_round_count == 3 after the final rejection"

      - name: aggregate_funding_guards_fire_in_their_declared_order_as_sources_are_suspended
        claim_type: Aggregate validation
        grounds:
          - validations[priority=28]
          - errors[ERR_FEDERAL_SHARE_EXCEEDED]
          - errors[ERR_MATCH_RATIO_UNSATISFIED]
          - errors[ERR_LOCAL_MATCH_SHORTFALL]
          - errors[ERR_FUNDING_SHORTFALL]
          - calculations.funding_waterfall_allocation
        distinguishing_aspect: "One application whose total_program_cost_cents is 25,500,000 is planned four times against the same six-source program; each suspension changes which sources are swept and therefore which aggregate guard fails first — FEDERAL, then MATCH_RATIO, then LOCAL_MATCH (which outranks the match-ratio failure still present), then SHORTFALL."
        test_recipe:
          setup:
            - "Program P3 has soil/size/contiguity/pressure weights 0.35/0.15/0.25/0.25, min_composite_score 60.00, local_match_min_pct 0.25 and federal_max_share_pct 0.50."
            - "Six ACTIVE sources cover the same obligation window 2026-01-01..2027-12-31, each authorized 100,000,000: FED_A (FEDERAL, 0.45, priority 1, requires_match with match_ratio 2.0), FED_B (FEDERAL, 0.45, priority 2), LOC_A (LOCAL, 0.35, priority 3), STATE_A (STATE, 0.40, priority 4), LOC_B (LOCAL, 0.05, priority 5), STATE_B (STATE, 0.40, priority 6)."
            - "Parcel PT3 is 40.00 acres, all prime, fully contiguous, 100 ft frontage, no sewer, 10.0-acre zoning: soil 100.00, pressure 8.00, composite 65.00, certified easement value 25,000,000."
            - "A FULL_PURCHASE offer of 25,000,000 was issued at clock 2026-10-05, so the 2 percent admin fee is 500,000 and total_program_cost_cents is 25,500,000."
