  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_denied_claim_state_beats_budget
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WARRANTY_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair state(p4) vs business_fiscal(p9): settling a DENIED claim whose computed
          credit (250000) also exceeds the remaining warranty budget (1000) MUST return
          ERR_INVALID_STATE, because state preconditions outrank fiscal checks.
        test_recipe:
          setup:
            - "Order FULFILLED with warranty_budget_cents 1000; DEFECT claim (qty 4, claimed 250000 -> STANDARD credit 250000) driven to DENIED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
