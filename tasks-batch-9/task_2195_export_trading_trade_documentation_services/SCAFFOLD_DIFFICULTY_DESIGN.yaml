      - name: premium_tier_keyed_on_exposure_that_this_policy_will_itself_feed
        grounds:
          - calculations.insurance_premium_assessment
          - calculations.insured_exposure_ledger
          - entities.CreditInsurancePolicy.fields.exposure_tier
          - entities.CreditInsurancePolicy.fields.premium_usd
          - entities.ForeignBuyer.fields.aggregate_exposure_usd
        distinguishing_aspect: |
          Mode (c), self-referential evaluation order: the second policy's tier basis is
          exposure_before 120000.00 (read from persisted utilized_usd BEFORE the row is
          inserted) plus its own credit_limit_usd 150000.00 = 270000.00, which clears
          TIER_1_CEILING_USD and lands TIER_2, so premium_usd is 1380.00 + 250.00 = 1630.00;
          resolving the tier from the policy's own limit alone (or from exposure recomputed
          after insertion) yields TIER_1 and 1020.00 with a waived fee.
        test_recipe:
          setup:
            - "ForeignBuyer 'Higashi Import Co' (JP, credit_rating BBB so RATING_MULTIPLIER 1.00, sanctions_tier NONE, not restricted); aggregate_exposure_usd starts 0.00."
            - "CreditInsurancePolicy POL-A: credit_limit_usd 200000.00, insured_pct 90.00, deductible_usd 5000.00, effective 2026-08-01 -> 2026-12-31. At its creation exposure_before is 0.00 so tier_basis 200000.00 <= 250000.00 -> TIER_1, base 1530.00, fee waived (deductible >= DEDUCTIBLE_FEE_WAIVER_USD) -> premium_usd 1530.00, status ACTIVE."
            - "One ExportOrder for the same buyer with a single line 120.000 @ 1000.0000 USD (ordered_goods_value_usd 120000.00), screened NLR, with an ACCEPTED letter of credit so settlement_status moved UNSECURED -> LC_ACCEPTED and insured_exposure_ledger charged POL-A: utilized_usd 120000.00, available_limit_usd 80000.00, buyer aggregate_exposure_usd 120000.00."
            - "The logical clock never moves from 2026-08-01T00:00:00Z, so both policies sit inside their effective window."
