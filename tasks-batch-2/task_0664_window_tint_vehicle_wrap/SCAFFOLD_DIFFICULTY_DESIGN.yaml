  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_compliance_on_price
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - state_machines.Quote.DRAFT_to_VOIDED
        distinguishing_aspect: >
          Error-category pair state(20) vs business_safety(30): a VOIDED quote (terminal) that ALSO
          carries an illegal FRONT_SIDE VLT line (requested_vlt_pct 20 < CA floor 35), when priced,
          returns ERR_INVALID_STATE (409, priority 20), not ERR_TINT_BELOW_LEGAL_VLT (422, priority 30).
          Line-add does not run the compliance check (priority 30 applies only to price), so the illegal
          line can be parked on the quote before voiding.
        test_recipe:
          setup:
            - "A DRAFT quote with one illegal FRONT_SIDE line (requested_vlt_pct 20 < CA floor 35), then VOIDED."
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "CA", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: true }
              as: ComplianceOfficer
            - call: "POST /shop-locations"
              payload: { name: "CA Shop2", state_code: "CA" }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /service-packages"
              payload: { name: "Tint Full Sedan", service_type: "TINT", base_rate_cents: 28000, duration_minutes: 120, cure_buffer_minutes: 0, warranty_days: 365, requires_proof: false }
              as: ShopManager
              captures: { pkg: $.data.id }
            - call: "POST /film-materials"
              payload: { sku: "CER-PP", category: "TINT_FILM", cure_hours: 24, price_multiplier_bps: 14500 }
              as: ShopManager
              captures: { mat: $.data.id }
            - call: "POST /vehicle-profiles"
              payload: { customer_user_id: "cust-9", vin: "VIN-PP1", size_class: "SEDAN" }
              as: ShopManager
              captures: { veh: $.data.id }
            - call: "POST /quotes"
              payload: { vehicle_profile_id: "${veh}", shop_location_id: "${shop_id}" }
              as: ShopManager
              captures: { q: $.data.id, qv0: $.data.version }
            - call: "POST /quotes/${q}/lines"
              payload: { service_package_id: "${pkg}", film_material_id: "${mat}", coverage: "FULL", window_position: "FRONT_SIDE", requested_vlt_pct: 20, expected_quote_version: "${qv0}" }
              as: ShopManager
              captures: { qv1: $.data.version }
            - call: "POST /quotes/${q}/void"
              payload: {}
              as: ShopManager
