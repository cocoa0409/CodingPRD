            - "Exhibitor 'Nordic Furnishings' takes the keynote deal; 'Harbor Ceramics' takes the lanyard deal. Deals are proposed by SalesRep u_sr_1 and signed by ShowDirector u_sd_1 (SoD)."
            - "Nordic's LOGO_PLACEMENT is delivered; the lanyard deal is then cancelled while its LANYARD_PRINT obligation is still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
