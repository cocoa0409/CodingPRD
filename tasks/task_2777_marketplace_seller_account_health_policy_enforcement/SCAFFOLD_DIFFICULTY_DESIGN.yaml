              as: Anonymous
              captures: { s2_id: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s1_id}", policy_rule_id: "${rule_rm}", reporter_type: "BUYER", evidence_reference: "EV-OA-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The reviews in question were left by verified buyers with no incentive from us." }
              as: Seller
              as_user_id: "${s1_id}"
              captures: { ap1: $.data.id }
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "DENIED", denial_reason: "EVIDENCE_UPHELD", rationale: "Payment records show gift-card reimbursements to eight of the reviewers." }
              as: AppealReviewer
              as_user_id: "ar-1"
          trigger:
            - call: "POST /enforcement-actions/${a1}/acknowledge"
              payload: {}
              as: Seller
