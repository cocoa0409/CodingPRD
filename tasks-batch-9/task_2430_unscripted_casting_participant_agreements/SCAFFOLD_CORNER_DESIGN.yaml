      - name: welfare_run_is_explicitly_triggered_and_scoped_to_one_production
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/casting/productions/{id}/welfare-run
          - state_machines.WelfareProtocol.ACTIVE_to_EXPIRED
          - calculations.welfare_commitment_rollup
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          Scheduled-action claim with two separate falsifiers. First, advancing the logical
          clock past both protocols' coverage_end_utc changes NOTHING on its own — both are
          still ACTIVE and both productions still show 520,000 committed — so the epoch
          sweep is an explicit operation, never a background timer. Second, the sweep is
          scoped to the addressed production: after the run on P1, P1's protocol is EXPIRED
          and its welfare_committed_cents has fallen to 0 (the rollup counts only PLANNED and
          ACTIVE rows) while P2's protocol is untouched at ACTIVE and 520,000, until P2 is
          swept in turn.
        test_recipe:
          setup:
            - "Two productions, each with one ACTIVE INSURANCE_RIDER protocol costing 500,000 whose coverage ends 2026-08-20; the clock is at its 2026-08-01 default."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S2", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 2, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_2: $.data.id }
            - call: "POST /casting/productions/${prod_1}/welfare-protocols"
              payload: { kind: "INSURANCE_RIDER", coverage_start_utc: "2026-08-01T00:00:00Z", coverage_end_utc: "2026-08-20T00:00:00Z", cost_cents: 500000, carrier_certificate_number: "CERT-P1-0001" }
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { wp_1: $.data.id }
            - call: "POST /casting/welfare-protocols/${wp_1}/activate"
              payload: {}
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { wp_1_status: $.data.status }
            - call: "POST /casting/productions/${prod_2}/welfare-protocols"
              payload: { kind: "INSURANCE_RIDER", coverage_start_utc: "2026-08-01T00:00:00Z", coverage_end_utc: "2026-08-20T00:00:00Z", cost_cents: 500000, carrier_certificate_number: "CERT-P2-0001" }
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { wp_2: $.data.id }
            - call: "POST /casting/welfare-protocols/${wp_2}/activate"
              payload: {}
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { wp_2_status: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProductionAdmin
            - call: "GET /casting/productions/${prod_1}/welfare-protocols"
              payload: { limit: 10, offset: 0 }
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { p1_status_no_sweep: "$.data[0].status" }
            - call: "GET /casting/productions/${prod_1}"
              payload: {}
              as: ProductionAdmin
              captures: { p1_committed_no_sweep: $.data.welfare_committed_cents }
            - call: "POST /casting/productions/${prod_1}/welfare-run"
              payload: {}
              as: ProductionAdmin
              captures: { p1_committed_after_sweep: $.data.welfare_committed_cents }
            - call: "GET /casting/productions/${prod_1}/welfare-protocols"
              payload: { limit: 10, offset: 0 }
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { p1_status_after_sweep: "$.data[0].status" }
            - call: "GET /casting/productions/${prod_2}/welfare-protocols"
              payload: { limit: 10, offset: 0 }
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { p2_status_after_p1_sweep: "$.data[0].status" }
            - call: "GET /casting/productions/${prod_2}"
              payload: {}
              as: ProductionAdmin
              captures: { p2_committed_after_p1_sweep: $.data.welfare_committed_cents }
            - call: "POST /casting/productions/${prod_2}/welfare-run"
              payload: {}
              as: ProductionAdmin
              captures: { p2_committed_after_own_sweep: $.data.welfare_committed_cents }
            - call: "GET /casting/productions/${prod_2}/welfare-protocols"
              payload: { limit: 10, offset: 0 }
              as: WelfareOfficer
              as_user_id: "wo_1"
              captures: { p2_status_after_own_sweep: "$.data[0].status" }
          assert:
            - "${wp_1_status} == ACTIVE"
            - "${wp_2_status} == ACTIVE"
            - "${p1_status_no_sweep} == ACTIVE"
            - "${p1_committed_no_sweep} == 520000"
            - "${p1_committed_after_sweep} == 0"
            - "${p1_status_after_sweep} == EXPIRED"
            - "${p2_status_after_p1_sweep} == ACTIVE"
            - "${p2_committed_after_p1_sweep} == 520000"
            - "${p2_committed_after_own_sweep} == 0"
            - "${p2_status_after_own_sweep} == EXPIRED"

      # ---- stubs: layers already exercised by a §1.8 difficulty instance ----
      - name: stipend_variants_differ_on_one_agreement
        claim_type: dual_variant_calculation
        grounds:
          - calculations.agreement_stipend_commitment.variants
          - entities.ParticipantAgreement.fields.provisional_stipend_cents
          - entities.ParticipantAgreement.fields.total_stipend_commitment_cents
        excluded_because:
          difficulty_instance: "dual_variant_calc / agreement_stipend_provisional_vs_final_diverge"
          rationale: |
            That instance already writes both variants for one row and asserts the exact
            divergence, including the tier crossing caused by episodes_used =
            max(episodes_committed, production.episode_order); a plain dual-variant corner
            case would restate it with weaker literals.

      - name: risk_variants_differ_on_one_applicant
        claim_type: dual_variant_calculation
        grounds:
          - calculations.applicant_risk_score.variants
          - entities.Applicant.fields.provisional_risk_score
          - entities.Applicant.fields.final_risk_score
        excluded_because:
          difficulty_instance: "dual_variant_calc / applicant_risk_ceiling_vs_decayed_diverge"
          rationale: |
            The second dual-variant layer instance already contrasts the PENDING-ceiling
            variant with the decayed variant on the same applicant and pins both literals,
            which is exactly what this corner case would claim.

      - name: escalation_side_effects_reach_every_child_entity
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Complaint.TRIAGED_to_ESCALATED
          - entities.Production.fields.duty_of_care_tier
          - entities.Production.fields.casting_posture
        excluded_because:
          difficulty_instance: "transitive_cascade / complaint_escalation_freezes_production_and_cancels_blocks_depth5"
          rationale: |
            The depth-5 cascade instance already asserts every downstream write of the
            escalation branch (tier, incident count, welfare rollup, posture FROZEN, closed
            calls, cancelled blocks and welfare holds); the neighbouring active instance
            above covers the complementary direction, that a rejected transition writes
            nothing at all.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: execute_response_reflects_every_rollup_in_the_same_request
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - state_machines.ParticipantAgreement.SENT_to_EXECUTED
          - calculations.production_stipend_rollup
          - calculations.post_obligation_fee_allocation
        distinguishing_aspect: |
          Immediate-consistency claim: no sweep, no second write and no clock movement sits
          between the execute call and the reads. The execute response itself already carries
          the FINAL total 400,000 and a non-null executed_at, and the very next reads show the
          production's stipend_committed_cents at 400,000, the applicant at CAST and all three
          auto-created PostObligation rows already SCHEDULED with their derived due dates and
          fees. A build that deferred any rollup to the welfare-run, or that recomputed the
          production only on the following request, fails these reads.
        test_recipe:
          setup:
            - "One production; one CLEARED adult applicant; one SENT agreement contracting two press appearances and a reunion."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 18, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_ver: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, press_appearance_obligation_count: 2, reunion_obligation: true, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_id: $.data.id }
            - call: "POST /casting/participant-agreements/${agr_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { prov: $.data.provisional_stipend_cents }
          trigger:
            - call: "POST /casting/participant-agreements/${agr_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_2"
              captures: { exec_total: $.data.total_stipend_commitment_cents, exec_at: $.data.executed_at, exec_status: $.data.status }
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: ProductionAdmin
              captures: { committed: $.data.stipend_committed_cents, posture: $.data.casting_posture, minors: $.data.minor_participant_count }
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { screen: $.data.screening_status }
            - call: "GET /casting/participant-agreements/${agr_id}/post-obligations"
              payload: { limit: 10, offset: 0 }
              as: BusinessAffairs
              as_user_id: "ba_2"
              captures: { ob_count: $.meta.total_count, ob_1_kind: "$.data[0].kind", ob_1_due: "$.data[0].due_utc", ob_1_fee: "$.data[0].fee_cents", ob_1_status: "$.data[0].status" }
          assert:
            - "${prov} == 1420000"
            - "${exec_status} == EXECUTED"
            - "${exec_total} == 400000"
            - "${exec_at} == 2026-08-01T00:00:00Z"
            - "${committed} == 400000"
            - "${posture} == OPEN"
            - "${minors} == 0"
            - "${screen} == CAST"
            - "${ob_count} == 3"
            - "${ob_1_kind} == PRESS_JUNKET"
            - "${ob_1_due} == 2027-01-14T00:00:00Z"
            - "${ob_1_fee} == 25000"
            - "${ob_1_status} == SCHEDULED"
