        grounds:
          - validations[priority=16]
          - calculations.transit_window_dates
          - validations[priority=17]
        distinguishing_aspect: "The same resource adjacency as the cadence rule but with a one-day buffer appended to the interval's end, so an interval ending exactly at blackout_start_date is refused under this rule while the unbuffered cadence window at priority 17 is accepted."
