              captures: { rc_85_id: $.data.id }
            - call: "POST /mortgage-insurance/rate-cards"
              payload: { master_policy_id: "${mp_id}", credit_grade: "B", ltv_band: "851_TO_90", coverage_percent: 25, premium_plan: "BPM", rate_bps: 85, min_borrower_reserves_months: 0 }
              as: MasterPolicyAdmin
              captures: { rc_90_id: $.data.id }
            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
