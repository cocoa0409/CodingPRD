            - call: "POST /home-oxygen/rental-contracts/${c_id}/billing-months"
              payload: { service_month: "2026-09" }
              as: BillingSpecialist
            - call: "POST /home-oxygen/patients/${p_id}/transfer-requests/cancel"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /home-oxygen/rental-contracts/${c_id}/billing-months"
              payload: { service_month: "2026-09" }
              as: BillingSpecialist
          assert:
            - "The first POST billing-months violates BOTH priority 35 (billing_status is SUSPENDED, not ACCRUING) and priority 95 (service-basis cap position for 2026-09 is 2 > cap_month_limit 1)"
            - "The first POST billing-months -> 409 with error id ERR_CONTRACT_BILLING_SUSPENDED (priority 35 wins over priority 95), NOT ERR_CAP_MONTHS_EXHAUSTED"
            - "After the first attempt: RentalContract.${c_id}.posted_month_count == 1 AND lifetime_paid_cents == 5590 AND billing_status == SUSPENDED — nothing was written"
            - "After the cancel: Patient.${p_id}.status == ACTIVE AND branch_id == ${br_id} AND transfer_to_branch_id == null AND RentalContract.${c_id}.billing_status == ACCRUING AND suspension_reason == NONE"
            - "The identical retry POST billing-months for 2026-09 -> 409 with error id ERR_CAP_MONTHS_EXHAUSTED, because only the priority-35 violation was cleared"
            - "After the retry: RentalContract.${c_id}.posted_month_count is still 1 AND lifetime_paid_cents is still 5590 AND last_posted_service_month == \"2026-08\""
            - "The two responses to byte-identical request bodies differ only in error id, which is exactly the priority-order observable"

      - name: portable_not_indicated_beats_role_occupied
        grounds:
          - validations[priority=54]
          - validations[priority=87]
          - errors[ERR_PORTABLE_NOT_INDICATED]
          - errors[ERR_ROLE_ALREADY_OCCUPIED]
          - entities.Patient.fields.mobility_profile
          - calculations.equipment_selection
          - endpoints[PATCH /home-oxygen/patients/{patient_id}]
        distinguishing_aspect: |
          Category pair `business_safety` (priority 54) versus `business_constraint` (priority 87) —
          a different pair from the `state` versus `business_fiscal` conflict above: one
          POST equipment-assignments call with role PORTABLE violates both, and the response must be
          the 422 ERR_PORTABLE_NOT_INDICATED rather than the 409 ERR_ROLE_ALREADY_OCCUPIED, which
          only surfaces once the mobility profile is corrected.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) with three IN_STOCK units: SC-1001 (STATIONARY_CONCENTRATOR, 5.0 LPM) and two portable concentrators PC-2001 and PC-2002 (3.0 LPM), so the equipment_selection candidate set for PORTABLE is never empty and priority 88 stays out of play."
            - "One ACTIVE patient whose mobility_profile is ACTIVE_AMBULATORY."
            - "One ACTIVE certificate prescribing 3.0 LPM, 24 h/day, portable_prescribed true, lifetime need."
            - "One RentalContract (COMPETITIVE_BID_SINGLE_PAYMENT, cap 36) in (billing ACCRUING, service PENDING_SETUP) that already holds a RESERVED PORTABLE placement on PC-2001."
            - "The patient has then been reassessed to HOMEBOUND via PATCH /home-oxygen/patients/{patient_id}, so portable oxygen is no longer indicated while the PORTABLE role remains occupied."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "SC-1001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_stat: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "PC-2001", model_code: "POC-3L", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
              as: BranchManager
              captures: { u_port1: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br_id}", serial_number: "PC-2002", model_code: "POC-3L", equipment_class: "PORTABLE_CONCENTRATOR", max_continuous_lpm: 3.0, max_pulse_setting: 5, pm_interval_days: 365, next_pm_due_date: "2027-05-01" }
              as: BranchManager
              captures: { u_port2: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0090", full_name: "Kira Lindqvist", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "ACTIVE_AMBULATORY", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 24, portable_prescribed: true, length_of_need_months: 99, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_id: $.data.id }
            - call: "POST /home-oxygen/cmns/${cmn_id}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "u-phys-1"
            - call: "POST /home-oxygen/cmns/${cmn_id}/approve"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u-audit-1"
            - call: "POST /home-oxygen/rental-contracts"
              payload: { patient_id: "${p_id}", cmn_id: "${cmn_id}", pricing_basis: "COMPETITIVE_BID_SINGLE_PAYMENT", cap_month_limit: 36 }
              as: BillingSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PORTABLE" }
              as: RespiratoryTherapist
              captures: { pl_port: $.data.id }
            - call: "PATCH /home-oxygen/patients/${p_id}"
              payload: { mobility_profile: "HOMEBOUND" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PORTABLE" }
              as: RespiratoryTherapist
            - call: "PATCH /home-oxygen/patients/${p_id}"
              payload: { mobility_profile: "ACTIVE_AMBULATORY" }
              as: IntakeCoordinator
            - call: "POST /home-oxygen/rental-contracts/${c_id}/equipment-assignments"
              payload: { role: "PORTABLE" }
              as: RespiratoryTherapist
          assert:
            - "The setup assignment selected PC-2001 (${u_port1}) because both portables tie on (max_continuous_lpm - prescribed_lpm) == 0.0 and PC-2001 carries the later next_pm_due_date 2027-06-01"
            - "The first trigger call violates BOTH priority 54 (mobility_profile HOMEBOUND, so portable is not indicated) and priority 87 (a RESERVED PORTABLE placement already exists)"
            - "The first trigger call -> 422 with error id ERR_PORTABLE_NOT_INDICATED (priority 54 wins over priority 87), NOT 409 ERR_ROLE_ALREADY_OCCUPIED"
            - "No second Placement row was created and EquipmentUnit.${u_port2}.status is still IN_STOCK after the first trigger call"
            - "The identical retry after restoring mobility_profile ACTIVE_AMBULATORY -> 409 with error id ERR_ROLE_ALREADY_OCCUPIED, because only the priority-54 violation was cleared"
            - "After the retry: exactly one Placement exists for contract ${c_id} (Placement.${pl_port}, role PORTABLE, status RESERVED, equipment_unit_id ${u_port1}) and EquipmentUnit.${u_port2}.status is still IN_STOCK"
            - "The 422/409 split proves the two rules were evaluated in priority order rather than in the order they appear in the request handler"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: spo2_88_qualifies_group_i_89_requires_cor_pulmonale
        grounds:
          - calculations.qualifying_group_determination
          - calculations.qualifying_group_determination.constants.GROUP_I_SPO2_MAX
          - calculations.qualifying_group_determination.constants.GROUP_II_SPO2
          - entities.QualifyingTest.fields.spo2_percent
          - entities.QualifyingTest.fields.cor_pulmonale_or_edema
          - endpoints[POST /home-oxygen/qualifying-tests]
        distinguishing_aspect: |
          Boundary on the metric spo2_percent at the endpoint POST /home-oxygen/qualifying-tests:
          88% is inside GROUP_I (<= 88), 89% falls out of GROUP_I entirely and lands on
          NON_QUALIFYING unless cor_pulmonale_or_edema is true, in which case the same 89% becomes
          GROUP_II — one integer point separates three different qualifying groups.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) and one ACTIVE patient (ACTIVE_AMBULATORY, altitude 500 ft)."
            - "No qualifying study exists yet for that patient; QualifyingTest rows are immutable, so each boundary value is a separate creation."
            - "The clock is at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0100", full_name: "Lena Duarte", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "ACTIVE_AMBULATORY", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 88, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893", cor_pulmonale_or_edema: false }
              as: IntakeCoordinator
              captures: { qt_88: $.data.id }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 89, tested_at: "2026-07-25T15:00:00Z", ordering_physician_npi: "1234567893", cor_pulmonale_or_edema: false }
              as: IntakeCoordinator
              captures: { qt_89_plain: $.data.id }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 89, tested_at: "2026-07-25T16:00:00Z", ordering_physician_npi: "1234567893", cor_pulmonale_or_edema: true }
              as: IntakeCoordinator
              captures: { qt_89_cor: $.data.id }
          assert:
            - "QualifyingTest.${qt_88}.qualifying_group == GROUP_I (spo2_percent 88 == GROUP_I_SPO2_MAX, an inclusive bound)"
            - "QualifyingTest.${qt_89_plain}.qualifying_group == NON_QUALIFYING (89 > 88 and no secondary finding)"
            - "QualifyingTest.${qt_89_cor}.qualifying_group == GROUP_II (89 == GROUP_II_SPO2 with cor_pulmonale_or_edema true)"
            - "All three rows share test_validity_expires_at computed as tested_at + 30 days (VALIDITY_DAYS_ACUTE for RESTING_ROOM_AIR): 2026-08-24T14:00:00Z, 2026-08-24T15:00:00Z and 2026-08-24T16:00:00Z respectively"
            - "None of the three rows carries a version field or an update endpoint (QualifyingTest has common_fields false)"
            - "GET /home-oxygen/qualifying-tests?patient_id=${p_id} returns total_count 3 with the three distinct qualifying_group values GROUP_I, NON_QUALIFYING and GROUP_II"
            - "The three groups carry different c_group weights downstream (30, 0 and 24), so the one-integer spo2 difference is worth 30 documentation points between ${qt_88} and ${qt_89_plain} and 6 points between ${qt_88} and ${qt_89_cor}"

      - name: documentation_score_exactly_85_passes_submit_84_38_fails
        grounds:
          - calculations.cmn_documentation_score
          - calculations.cmn_documentation_score.constants.DOCUMENTATION_PASS_THRESHOLD
          - validations[priority=50]
          - errors[ERR_DOCUMENTATION_INCOMPLETE]
          - state_machines.CertificateOfMedicalNecessity.DRAFT_to_SUBMITTED
          - endpoints[POST /home-oxygen/cmns/{cmn_id}/submit]
        distinguishing_aspect: |
          Boundary on a different metric (documentation_score) at a different endpoint
          (POST /home-oxygen/cmns/{cmn_id}/submit): hours_per_day 8 gives exactly 85.00 and passes
          the inclusive threshold, while hours_per_day 7 gives 84.375 which must round to 84.38 and
          fail — a case that only a single final round_half_up produces, since rounding c_usage to
          4.38 first would yield 84.38 as well but rounding c_narrative separately in the passing
          case would push the total off 85.00.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) and one ACTIVE patient (ACTIVE_AMBULATORY, altitude 500 ft)."
            - "One GROUP_I study (SpO2 87%, RESTING_ROOM_AIR, tested 2026-07-25T14:00:00Z, so the clock at 2026-08-01 is inside the 30-day validity window and c_currency is the full 20)."
            - "Two DRAFT certificates against that same study, identical except for hours_per_day: certificate LOW uses 7 h/day (documentation_score 84.38) and certificate EXACT uses 8 h/day (documentation_score 85.00). Both use narrative_element_count 3, portable_prescribed true (patient is ACTIVE_AMBULATORY, so c_portable is 10) and length_of_need_months 6 (below LONG_TERM_NEED_MONTHS, so c_duration is 0)."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /home-oxygen/patients"
              payload: { mrn: "MRN-0110", full_name: "Mei Oyelaran", branch_id: "${br_id}", payer_type: "MEDICARE_COMPETITIVE_BID", mobility_profile: "ACTIVE_AMBULATORY", altitude_feet: 500 }
              as: IntakeCoordinator
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /home-oxygen/qualifying-tests"
              payload: { patient_id: "${p_id}", test_type: "RESTING_ROOM_AIR", spo2_percent: 87, tested_at: "2026-07-25T14:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { qt_id: $.data.id }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 7, portable_prescribed: true, length_of_need_months: 6, narrative_element_count: 3, expected_patient_version: "${p_ver}" }
              as: IntakeCoordinator
              captures: { cmn_low: $.data.id }
            - call: "GET /home-oxygen/patients/${p_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { p_ver2: $.data.version }
            - call: "POST /home-oxygen/cmns"
              payload: { patient_id: "${p_id}", qualifying_test_id: "${qt_id}", form_type: "INITIAL", prescribed_lpm: 3.0, hours_per_day: 8, portable_prescribed: true, length_of_need_months: 6, narrative_element_count: 3, expected_patient_version: "${p_ver2}" }
              as: IntakeCoordinator
              captures: { cmn_exact: $.data.id }
          trigger:
            - call: "POST /home-oxygen/cmns/${cmn_low}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
            - call: "POST /home-oxygen/cmns/${cmn_exact}/submit"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "u-intake-1"
          assert:
            - "CertificateOfMedicalNecessity.${cmn_low}.documentation_score == 84.38 (30 + 20 + 15 * 7 / 24 + 20 + 10 + 0 = 84.375, one final round_half_up)"
            - "CertificateOfMedicalNecessity.${cmn_exact}.documentation_score == 85.00 (30 + 20 + 15 * 8 / 24 + 20 + 10 + 0 = 85.0 exactly)"
            - "POST /home-oxygen/cmns/${cmn_low}/submit -> 422 ERR_DOCUMENTATION_INCOMPLETE; status stays DRAFT and submitted_by_user_id stays null"
            - "POST /home-oxygen/cmns/${cmn_exact}/submit -> 200; status == SUBMITTED and submitted_by_user_id == \"u-intake-1\" — the threshold is inclusive at exactly 85.00"
            - "One hour per day of prescribed usage (0.625 documentation points) is the entire difference between a submittable and a rejected certificate"
            - "Patient.${p_id}.current_cmn_status == SUBMITTED after the second trigger call (the EXACT certificate is the most-recently-created one)"

