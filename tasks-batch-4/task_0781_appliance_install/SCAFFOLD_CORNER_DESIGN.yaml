          rationale: "ERR_RETAILER_SUSPENDED is the asserted outcome of that §1.8 instance."
      - name: error_invalid_appointment_window_on_schedule
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_APPOINTMENT_WINDOW]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / schedule_bad_window_beats_invalid_state_returns_422
          rationale: "ERR_INVALID_APPOINTMENT_WINDOW is the asserted winner of that §1.8 priority conflict."

