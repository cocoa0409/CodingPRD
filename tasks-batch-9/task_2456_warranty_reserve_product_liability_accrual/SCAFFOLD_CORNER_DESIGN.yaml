            - "AccrualPeriod.${p_oc1_id}.version == 3 after the successful retry — every accepted write bumps it exactly once"

      - name: corner_occ_rollforward_generation_with_a_stale_period_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rollforward-generate-stale-period]
          - errors[ERR_STALE_PERIOD_VERSION]
        distinguishing_aspect: "lock-analysis itself bumps the period, so a client that read the version before locking is refused 412 on rollforward generation; the rule and error are shared with accrual creation but the write endpoint differs."
        test_recipe:
          setup:
            - "One AccrualPeriod 2026-Q3 with no accruals; its version is captured at creation and it is then locked."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_oc2_id: $.data.id, p_oc2_ver1: $.data.version }
            - call: "POST /warranty/periods/${p_oc2_id}/lock-analysis"
              payload: {}
              as: ReserveController
              captures: { p_oc2_ver2: $.data.version }
          trigger:
            - call: "POST /warranty/periods/${p_oc2_id}/rollforward"
              payload: { expected_period_version: "${p_oc2_ver1}" }
              as: ReserveController
              captures: { e_occ2: $.data.error_id }
            - call: "POST /warranty/periods/${p_oc2_id}/rollforward"
              payload: { expected_period_version: "${p_oc2_ver2}" }
              as: ReserveController
              captures: { rf_oc2_id: $.data.id }
          assert:
            - "The first trigger call returns 412 ERR_STALE_PERIOD_VERSION and AccrualPeriod.${p_oc2_id}.rollforward_generated is still false"
            - "The second trigger call returns 201 with ReserveRollforward.${rf_oc2_id}.period_id == \"${p_oc2_id}\""
            - "AccrualPeriod.${p_oc2_id}.rollforward_generated == true and its version advanced again, so replaying the second call with ${p_oc2_ver2} would now also return 412"

      - name: corner_occ_select_remedy_with_a_stale_field_action_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[remedy-select-stale-field-action]
          - errors[ERR_STALE_FIELD_ACTION_VERSION]
        distinguishing_aspect: "The OCC parent here is the FieldAction itself rather than a period, and the token guards a reselection: after one selection has landed, the pre-selection version is refused 412 and the standing selection is untouched."
        test_recipe:
          setup:
            - "FieldAction FA-OC3 over 500 units with two engineering-approved options (per unit 11000 and 14000)."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-OC3", name: "Concurrency Platform Three", launch_date: "2024-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 12000, reserve_cap_cents: 15000000 }
              as: WarrantyAnalyst
              captures: { fam_oc3_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_oc3_id}", action_code: "FA-OC3-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-01-31", affected_unit_count: 500 }
              as: QualityEngineer
              captures: { fa_oc3_id: $.data.id, fa_oc3_ver1: $.data.version }
            - call: "POST /warranty/field-actions/${fa_oc3_id}/remedy-options"
              payload: { option_code: "OPT-OC3-CHEAP", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 1000, labor_hours_centi: 100, admin_cost_cents: 500, expected_take_rate_bps: 10000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_oc3_cheap: $.data.id }
            - call: "POST /warranty/field-actions/${fa_oc3_id}/remedy-options"
              payload: { option_code: "OPT-OC3-RICH", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 4000, labor_hours_centi: 100, admin_cost_cents: 500, expected_take_rate_bps: 10000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_oc3_rich: $.data.id }
            - call: "POST /warranty/field-actions/${fa_oc3_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_oc3_ver1}", remedy_option_id: "${opt_oc3_rich}" }
              as: QualityEngineer
              captures: { fa_oc3_ver2: $.data.version }
          trigger:
            - call: "POST /warranty/field-actions/${fa_oc3_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_oc3_ver1}", remedy_option_id: "${opt_oc3_cheap}" }
