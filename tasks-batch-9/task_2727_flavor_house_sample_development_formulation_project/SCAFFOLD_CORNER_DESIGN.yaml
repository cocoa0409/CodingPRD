          - entities.ScaleUpBatch.fields.yield_variance_pct
        distinguishing_aspect: "A 147.0 kg measured yield against a 150 kg target writes yield_variance_pct -2.00 (signed, 2 decimals) and moves the batch TOLERANCE_SET -> PILOT_RUN; the director's QUALIFIED decision then reaches the terminal state without touching the cost fields."
