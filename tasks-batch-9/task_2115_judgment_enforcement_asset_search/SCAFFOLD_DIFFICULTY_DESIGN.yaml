        distinguishing_aspect: |
          Interval semantics 1 of 2 — HALF-OPEN ranges [served_on, expires_on) occupying an AssetFinding:
          a second levy served 2026-11-28 overlaps the first levy's [2026-08-01, 2026-11-29) window and is
          rejected, while serving on exactly 2026-11-29 merely touches the endpoint and is accepted, proving
          adjacency is not overlap.
        test_recipe:
          setup:
