            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: "GhostRole"
              as_user_id: "${finance_id}"
              captures: { unknown_role_error_id: "$.data.error_id" }
            - call: "GET /development-agreements/${agreement_id}"
              payload: {}
              as: PublisherFinance
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { actor_missing_error_id: "$.data.error_id" }
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "ACCEPTED", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T10:00:00.000Z", notes: "Finance trying to review" }
              as: PublisherFinance
              as_user_id: "${finance_id}"
              captures: { role_not_permitted_error_id: "$.data.error_id" }
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "ACCEPTED", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T10:00:00.000Z", notes: "Finance officer wearing the reviewer hat" }
              as: PublisherReviewer
              as_user_id: "${finance_id}"
              captures: { function_mismatch_error_id: "$.data.error_id" }
            - call: "POST /publisher-reviews"
              payload: { build_id: "${b1_id}", verdict: "ACCEPTED", review_window_start_at: "2026-08-01T09:00:00.000Z", review_window_end_at: "2026-08-01T10:00:00.000Z", notes: "The right actor" }
              as: PublisherReviewer
              as_user_id: "${reviewer_id}"
              captures: { review_id: $.data.id }
          assert:
            - "trigger call 1 -> HTTP 401 with data.error_id == ERR_MISSING_AUTH_HEADERS (priority 1 fires before the path lookup, so a valid agreement id changes nothing)"
            - "trigger call 2 -> HTTP 401 with data.error_id == ERR_UNKNOWN_ROLE"
            - "trigger call 3 -> HTTP 401 with data.error_id == ERR_ACTOR_NOT_FOUND (401, not 404: an unresolvable actor is an authentication failure, not a missing resource)"
            - "trigger call 4 -> HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED (PublisherFinance is absent from the POST /publisher-reviews role list)"
            - "trigger call 5 -> HTTP 403 with data.error_id == ERR_ROLE_FUNCTION_MISMATCH, proving rule 5 is evaluated after rule 4 rather than folded into it"
            - "trigger call 6 -> HTTP 201 with reviewer_user_id == ${reviewer_id} and Milestone.${m1_id}.status == ACCEPTED; the four rejected calls left no PublisherReview row behind, so this is the milestone's first and only review"

      - name: corner_each_role_owns_its_exclusive_operations_and_shares_only_the_declared_ones
        claim_type: role_exclusive_and_shared_operations
        grounds:
          - rbac.roles.PlatformAdmin
          - rbac.roles.Developer
          - rbac.roles.PublisherReviewer
          - rbac.roles.PublisherFinance
          - validations[priority=4]
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Peer-role isolation in both directions on the four exclusive operations that matter (build submission, acceptance verdict, payment authorization, registry writes) plus the two shared operations whose role lists are deliberately NOT the full set: POST /change-orders excludes PlatformAdmin (the platform never proposes scope) while POST /milestones excludes PublisherReviewer (a reviewer never defines scope). An implementation that grants every GET-capable role every POST fails on those two."
