        grounds:
          - state_machines.UnderwritingSpot.REQUIRED_to_MISSING
          - state_machines.ComplianceIncident.OPEN_to_SUBSTANTIATED
          - state_machines.Program.WATCH_to_RESTRICTED
          - state_machines.SlotAssignment.CONFIRMED_to_PREEMPTED
          - state_machines.Episode.SCHEDULED_to_CANCELLED
          - endpoints[POST /operations/daily-sweep]
        distinguishing_aspect: |
          Trigger is the clock-driven POST /operations/daily-sweep and the chain is depth 4 along a compliance path - spot obligation MISSING, then a station-authored SUBSTANTIATED PUBLIC_FILE incident, then the program crossing 6 penalty points to RESTRICTED, then that program's CONFIRMED occupation PREEMPTED with its SCHEDULED episode CANCELLED and the grid's minute fields rewritten - and the spot itself deliberately stays APPROVED because only adjudicate suspends a spot; the other transitive_cascade instance is triggered by an explicit officer call on POST /certifications/{certificationId}/revoke and runs down a personnel path that touches no grid and no incident.
