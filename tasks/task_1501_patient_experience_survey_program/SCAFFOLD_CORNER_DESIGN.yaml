            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 3, template: { mrn_prefix: "D", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-07-01", discharge_date: "2026-07-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2b: "$.data.discharge_ids" } }
