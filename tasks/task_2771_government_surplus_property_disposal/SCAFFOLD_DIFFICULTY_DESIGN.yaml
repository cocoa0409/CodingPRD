            - call: "POST /venues"
              payload: { name: "Austin Surplus Yard", venue_code: "AUS-01", concurrent_lot_capacity: 2, buyer_premium_pct: 0.105, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v1: "$.data.id" }
            - call: "POST /auction-lots"
              payload: { asset_id: "${a5}", venue_id: "${v1}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-05T00:00:00Z" }
              as: DisposalOfficer
