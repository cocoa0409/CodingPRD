  # =====================================================================
  # RULE 9 - compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdrawing_the_major_comment_reverses_cascade_a_with_no_counter_drift
        grounds:
          - state_machines.ReviewComment.OPEN_to_WITHDRAWN
          - state_machines.HydraulicCalculation.REOPENED_to_SEALED
          - state_machines.ShopDrawing.STALE_to_COORDINATED
          - state_machines.TradeClearance.STALE_to_CLEARED
          - endpoints.POST_/review-comments/{id}/close
          - calculations.project_design_posture
        distinguishing_aspect: |
          A single WITHDRAWN disposition has to undo all four links of cascade A and land exactly on the
          pre-cascade state, which is strictly harder than re-running the forward path: the calculation
          must recover its ORIGINAL sealed_by_engineer_id and sealed_at rather than being resealed by
          the acting reviewer at the current clock, sealed_calculation_count must return to 1 rather
          than to 2 or 0, cleared_trade_count must return to 3 by re-counting rather than by
          incrementing, and the submittal must return to UNDER_REVIEW without minting a new cycle. Any
          double-application or any missed link shows up as an off-by-one in one of the two counters.
        test_recipe:
          setup:
            - "Project FP-2601 with SUB-1 under review, HC-1 SEALED by the lead engineer at the 2026-08-01T00:00:00Z default clock, sheet FP-101 COORDINATED, three CLEARED clearances"
