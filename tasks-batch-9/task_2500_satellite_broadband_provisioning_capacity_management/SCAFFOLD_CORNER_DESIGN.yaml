            - call: "POST /satellite-broadband/beams/${beam_id}/capacity-policy"
              payload: { oversubscription_limit: 5.0, deprioritization_grace_gb: 10, expected_beam_version: "${v_read1}" }
              as: NetworkOpsEngineer
              captures: { v_write1: "$.data.version" }
            - call: "POST /satellite-broadband/beams/${beam_id}/capacity-policy"
              payload: { oversubscription_limit: 5.5, deprioritization_grace_gb: 20, expected_beam_version: "${v_write1}" }
              as: NetworkOpsEngineer
              captures: { v_write2: "$.data.version" }
            - call: "GET /satellite-broadband/beams/${beam_id}"
