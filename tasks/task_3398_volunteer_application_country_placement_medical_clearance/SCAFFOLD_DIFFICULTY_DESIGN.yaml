              payload: { country_program_id: "${prog_pe}", name: "PST-A", start_date: "2027-01-01T00:00:00Z", end_date: "2027-03-31T00:00:00Z", capacity: 6 }
              as: SystemAdmin
              captures: { cohort_a: $.data.id }
            - call: "POST /volunteer-portal/training-cohorts"
              payload: { country_program_id: "${prog_pe}", name: "PST-B", start_date: "2027-02-01T00:00:00Z", end_date: "2027-04-30T00:00:00Z", capacity: 4 }
              as: SystemAdmin
              captures: { cohort_b: $.data.id }
          trigger:
            - call: "POST /volunteer-portal/training-cohorts"
              payload: { country_program_id: "${prog_pe}", name: "PST-C", start_date: "2027-02-15T00:00:00Z", end_date: "2027-03-15T00:00:00Z", capacity: 1 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Cohort B was created successfully although it overlaps cohort A — overlap is PERMITTED while summed capacity 6 + 4 == 10 <= training_capacity 10 (boundary exactly at the cap passes)"
            - "Cohort C (capacity 1, overlapping both) is rejected: error_id == ERR_TRAINING_CAPACITY_EXCEEDED (HTTP 409) because 6 + 4 + 1 == 11 > 10"
            - "GET /volunteer-portal/training-cohorts?country_program_id shows exactly 2 cohorts (A and B); no PST-C persisted"

  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_accept_then_denial_rescission
        grounds:
          - entities.AssignmentOpening.fields.seats_committed
          - entities.AssignmentOpening.fields.seats_provisional
          - state_machines.Invitation
        distinguishing_aspect: |
          Conserved quantity = seat allocation counts: at every step,
          seats_committed == count(ACCEPTED invitations) and seats_provisional == count(ISSUED
          invitations) for the opening; the forward action (accept: provisional -1, committed +1)
          followed by its compensating cascade (medical denial rescission: committed -1) returns
          BOTH counters to their pre-issuance values (0, 0) with the opening back to OPEN.
        test_recipe:
          setup:
