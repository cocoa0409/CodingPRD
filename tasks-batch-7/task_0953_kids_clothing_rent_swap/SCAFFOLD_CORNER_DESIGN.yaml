              as: BillingAgent
              captures: { t1_chg2: $.data.id }
          assert:
            - "before the trigger Member.${t1_m}.outstanding_balance_cents was 14999 and status was ACTIVE"
            - "Member.${t1_m}.outstanding_balance_cents == 15000"
            - "Member.${t1_m}.status == DELINQUENT"
            - "ChargeLedgerEntry.${t1_chg2}.amount_cents == 1"

      - name: corner_ccl_cascading_side_effects_stub
