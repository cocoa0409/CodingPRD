  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority-1 claim: a request that omits X-User-Role and X-User-ID, or sends an X-User-Role outside the seven declared roles, returns 401 ERR_UNAUTHENTICATED before any existence or state check runs, even when the referenced resource does not exist.
        test_recipe:
          setup:
            - "One program exists"
            - "The trigger is sent with both authentication headers stripped and, in a second variant, with X-User-Role set to the undeclared value Bystander"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Riverside CERT", sponsor_agency: "Riverside OES", jurisdiction_code: "CA-RIV-01", equipment_budget_cents: 5000000 }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /cohorts", payload: { program_id: "${prog_id}", cohort_code: "C-2026Q", seat_capacity: 4, session_window_start: "2026-08-01T00:00:00Z", session_window_end: "2026-12-31T23:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-admin-0", captures: { err1: $.data.error_id } }
          assert:
            - "With no auth headers the response is 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "With X-User-Role Bystander the response is 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "GET /cohorts with program_id ${prog_id} still returns total_count 1 (only the setup cohort)"

