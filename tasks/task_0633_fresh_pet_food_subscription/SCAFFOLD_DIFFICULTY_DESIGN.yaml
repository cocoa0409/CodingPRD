          - validations[priority=8]
          - errors[ERR_ALLERGEN_CONFLICT]
          - errors[ERR_INVALID_CADENCE]
        distinguishing_aspect: |
          A subscription create that both has an allergen conflict (priority 6 business_safety
          ERR_ALLERGEN_CONFLICT) and an invalid cadence_days=10 (priority 8 business_constraint
          ERR_INVALID_CADENCE) must return the priority-6 safety error — category pair
          business_safety vs business_constraint, a different pairing than the first instance.
        test_recipe:
