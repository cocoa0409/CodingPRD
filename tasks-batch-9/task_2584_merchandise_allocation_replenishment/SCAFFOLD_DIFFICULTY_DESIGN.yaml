            - "Link 2 - StorePosition.${p1_id}.broken_size_count == 0 and assortment_status == COMPLETE (stock_status stays LOW)"
            - "Link 3 - Item.${item_id}.broken_store_count == 0, size_out_store_count == 0 and lifecycle_state == ACTIVE"
            - "Link 4 - AssortmentAction.${a1_id}.status == SUPERSEDED with its snapshot fields unchanged (broken_size_count == 2, units_at_detection == 4)"
            - "The donor side cascades only two links: StorePosition.${p2_id}.on_hand_units == 24, available_units == 24, stock_status == IN_STOCK, assortment_status still COMPLETE"
            - "A second receive attempt returns ERR_INVALID_STATE_TRANSITION and no field of any of the four entities changes"
      - name: run_commit_cascades_lines_then_receipt_ledger_then_program_reserve
        grounds:
          - state_machines[AllocationRun].transitions[PROPOSED->COMMITTED].side_effects
          - calculations.receipt_unit_ledger_invariant
          - state_machines[Receipt].transitions[ALLOCATING->ALLOCATED]
          - entities.AllocationProgram.fields.open_reserve_units
          - endpoints.POST /allocation/allocation-runs/{runId}/commit
        distinguishing_aspect: |
          A different trigger from instance 1, and a chain that runs upward instead of outward: commit
          books units_allocated on all three lines (link 1), the line totals re-derive
          receipt.units_committed / units_unallocated (link 2), units_unallocated hitting exactly 0 drives
          the Receipt ALLOCATING -> ALLOCATED transition (link 3), and the receipt ledger re-derives
