      - name: combination_sale_band_selected_on_pre_discount_floor_not_discounted_price
        grounds:
          - calculations.combination_sale_min_price
          - entities.CombinationSale.fields.floor_price_cents
          - entities.CombinationSale.fields.min_allowed_price_cents
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (c): the tier band is keyed on the PRE-discount floor of 150000, which selects 0.10 and yields
          min_allowed_price_cents 135000; keying the band on the discounted value would fall into the 0.05 band and
          yield 142500, so the two orderings are separated by 7500 cents on identical inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, StateProgram TX at declared defaults with combination_sale_allowed true and combo_cooldown_days 7."
            - "Wholesaler A with a filing agent and an APPROVED brand Rio Reserve."
            - "Draft schedule for posting month 2026-09 carrying item A (750 ml, 12 per case) at case 120000 / unit 11000 and item A2 (375 ml, 24 per case) at case 30000 / unit 1500."
            - "No other combination sale exists for Wholesaler A, so the cooldown buffer is not engaged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-programs"
