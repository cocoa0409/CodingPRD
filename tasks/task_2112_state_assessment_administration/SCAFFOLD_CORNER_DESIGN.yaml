        claim_type: violation_to_error
        grounds: ["errors[ERR_ROOM_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: room_occupancy_uses_half_open_intervals_plus_turnover_buffer
          rationale: "Triggered and asserted as the first trigger call of that instance."

      - name: error_proctor_time_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROCTOR_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: proctor_availability_uses_closed_intervals_with_no_buffer
          rationale: "Triggered and asserted as the first trigger call of that instance."

      - name: error_proctor_not_certified
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROCTOR_NOT_CERTIFIED]"]
        excluded_because:
          difficulty_instance: session_scheduling_depends_on_proctor_certification_currency
          rationale: "Raised by the expired-training scheduling attempt in that instance."

      - name: error_affidavit_missing
        claim_type: violation_to_error
        grounds: ["errors[ERR_AFFIDAVIT_MISSING]"]
        excluded_because:
          difficulty_instance: missing_affidavit_outranks_proctor_time_conflict
          rationale: "Raised and asserted as the winning error of that priority-pair instance."

      - name: error_return_cycle_limit
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETURN_CYCLE_LIMIT]"]
        excluded_because:
          difficulty_instance: irregularity_report_return_for_info_cycle_capped_at_two
          rationale: "Raised by the third RETURNED_FOR_INFO attempt in that instance."

      - name: error_security_hold_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_SECURITY_HOLD_ACTIVE]"]
        excluded_because:
          difficulty_instance: lot_discrepancy_raises_system_breach_report_and_freezes_score_release
          rationale: "Raised by the blocked SCORING -> RELEASED attempt at the end of that instance."

      - name: error_insufficient_materials
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_MATERIALS]"]
        excluded_because:
          difficulty_instance: session_activation_depends_on_material_lot_checkout_state
