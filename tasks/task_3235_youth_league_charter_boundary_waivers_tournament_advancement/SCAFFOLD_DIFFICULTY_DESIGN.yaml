      - name: screening_must_contain_season_window_not_just_intersect
        grounds:
          - state_machines.BackgroundScreening.SUBMITTED_to_CLEARED
          - errors.ERR_SCREENING_WINDOW_INCOMPLETE
        distinguishing_aspect: |
          Containment interval semantics on the volunteer-screening resource
          (distinct from half-open overlap on waivers): a screening window
          [2027-04-01, 2027-11-30] INTERSECTS the season [2027-03-01,
          2027-10-31] but does not CONTAIN it, so adjudication fails; only
          [2027-02-01, 2027-11-30] ⊇ season clears.
        test_recipe:
          setup:
            - "League CHARTERED (prefix); volunteers V1 and V2 REGISTERED."
            - "V1 screening S1: [2027-04-01, 2027-11-30] (starts after season start 2027-03-01)."
            - "V2 screening S2: [2027-02-01, 2027-11-30] (fully contains the season window)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Containment LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/volunteers"
              payload: { full_name: "Vic One", role_title: "COACH" }
              as: LeagueAdministrator
              captures: { v1: $.data.id }
            - call: "POST /leagues/${lg}/volunteers"
              payload: { full_name: "Vic Two", role_title: "MANAGER" }
              as: LeagueAdministrator
              captures: { v2: $.data.id }
            - call: "POST /leagues/${lg}/volunteers/${v1}/screenings"
              payload: { offense_category: "NONE", valid_from: "2027-04-01", valid_through: "2027-11-30" }
              as: LeagueAdministrator
              captures: { s1: $.data.id }
            - call: "POST /leagues/${lg}/volunteers/${v2}/screenings"
              payload: { offense_category: "NONE", valid_from: "2027-02-01", valid_through: "2027-11-30" }
              as: LeagueAdministrator
              captures: { s2: $.data.id }
          trigger:
            - call: "POST /leagues/${lg}/volunteers/${v1}/screenings/${s1}/adjudicate"
              payload: { action: "APPROVE" }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /leagues/${lg}/volunteers/${v2}/screenings/${s2}/adjudicate"
              payload: { action: "APPROVE" }
              as: DistrictAdministrator
              captures: { s2_status: $.data.status }
          assert:
            - "${err} == ERR_SCREENING_WINDOW_INCOMPLETE — intersection without containment is insufficient"
            - "BackgroundScreening.${s1}.status == SUBMITTED (unchanged) and Volunteer.${v1}.status == REGISTERED"
            - "${s2_status} == CLEARED and Volunteer.${v2}.status == CLEARED — [2027-02-01, 2027-11-30] contains [2027-03-01, 2027-10-31]"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: pitch_total_invariant_holds_across_protest_reversal
        grounds:
          - calculations.recorded_pitch_total
          - state_machines.PitchingAppearance.RECORDED_to_REVERSED
          - state_machines.Protest.FILED_to_UPHELD
        distinguishing_aspect: |
          Conserved quantity: game.recorded_pitch_total. The forward action
          (recording two appearances, 30 + 40 = 70) paired with the
          compensating action (an UPHELD ELIGIBILITY_CHALLENGE protest
          reversing the 40-pitch appearance) leaves recorded_pitch_total equal
          to the sum over RECORDED appearances (30) — no drift.
        test_recipe:
          setup:
            - "League CHARTERED; P1..P3 ELIGIBLE in MAJOR; roster SUBMITTED; entry E DISTRICT; game G IN_PROGRESS with appearances A1 (P1, 30) and A2 (P2, 40); recorded_pitch_total 70."
            - "Protest PR FILED: ELIGIBILITY_CHALLENGE targeting P2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
