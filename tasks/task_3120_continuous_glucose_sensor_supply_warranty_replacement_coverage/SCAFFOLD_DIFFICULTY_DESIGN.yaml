            - "at logical_date == expires_on + 1 (2026-09-02): order rejected with ERR_PRESCRIPTION_NOT_ACTIVE"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: adjudication_reversal_conserves_money_buckets
        grounds:
          - state_machines.SensorOrder.billing_status.ADJUDICATED_to_REVERSED
          - calculations.benefit_adjudication_rule
        distinguishing_aspect: |
          Conserved quantity = money decomposition on the order:
          allowed_amount_cents == plan_paid_cents + patient_paid_cents +
          savings_card_paid_cents. After ADJUDICATED → REVERSED, all three
          paid buckets return to 0 while allowed_amount_cents remains
          unchanged (or also resets to 0 — pinned as 0 on REVERSED). Distinct
          conserved quantity from lot unit lifecycle.
        test_recipe:
          setup:
            - "Adjudicated order with savings card applied"
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
