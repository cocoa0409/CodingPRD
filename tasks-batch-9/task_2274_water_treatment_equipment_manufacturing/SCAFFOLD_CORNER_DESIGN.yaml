      - name: bid_after_submittal_rejection_is_refused_because_the_project_is_bid_blocked
        claim_type: cascading_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_INVALID_PROJECT_STATE]
          - state_machines.OrEqualSubmittal.SUBMITTED_to_REJECTED
          - calculations.or_equal_compliance_score
        distinguishing_aspect: |
          One engineer decision cascades into a validation failure two steps later: REJECTED
          withdraws the PENDING MODERATE deviation (weighted_penalty_points 0.00, score back to
          100.00) and drives the project SCOPED -> BID_BLOCKED, so the subsequent bid is refused with
          ERR_INVALID_PROJECT_STATE (409) at priority 23 rather than with the pre-approval rule at
          priority 52 - a project that never reached BID_READY fails the state check first.
        test_recipe:
          setup:
            - 'single-stage FILTRATION project with package F-100 APPROVED'
            - 'submittal 11 21 13 SUBMITTED with one PENDING MODERATE deviation, then REJECTED by eor-1'
            - 'the project therefore sits at BID_BLOCKED'
