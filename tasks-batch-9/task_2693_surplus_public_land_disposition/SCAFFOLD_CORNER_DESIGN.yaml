        grounds:
          - validations[priority=30]
          - entities.Agency.fields.notice_registry_status
          - endpoints[PATCH /agencies/{id}]
          - errors[ERR_NOTICE_REGISTRY_LAPSED]
        distinguishing_aspect: "The whole notice round is refused atomically because ONE of the two recipients has notice_registry_status LAPSED: HTTP 422 ERR_NOTICE_REGISTRY_LAPSED, zero StatutoryNotice rows exist afterwards (the REGISTERED co-recipient gets no notice either), and the declaration stays ADOPTED with notice_issued_at null."
        test_recipe:
          setup:
            - "One custodian Agency, one REGISTERED HOUSING_AUTHORITY Agency and one TRANSIT Agency whose notice_registry_status is PATCHed to LAPSED."
            - "One Parcel and one ADOPTED declaration."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Housing Authority", agency_type: "HOUSING_AUTHORITY", contact_email: "clerk@rbha.gov", is_preference_entity: true, preference_category: "AFFORDABLE_HOUSING" }
              as: SystemAdministrator
              captures: { pref_agency_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { name: "Riverbend Transit District", agency_type: "TRANSIT", contact_email: "clerk@rtd.gov" }
              as: SystemAdministrator
              captures: { nbr_agency_id: "$.data.id" }
            - call: "PATCH /agencies/${nbr_agency_id}"
              payload: { notice_registry_status: "LAPSED" }
              as: SystemAdministrator
            - call: "POST /parcels"
              payload: { apn: "APN-2693-145", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
