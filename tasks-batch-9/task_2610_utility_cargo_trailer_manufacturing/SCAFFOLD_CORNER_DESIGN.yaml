  - section: Calculations
    instances:
      - name: calc_vin_and_mco_sequence_is_plant_wide_and_composed_field_by_field
        claim_type: Correct Result
        grounds:
          - calculations.vin_assignment
          - entities.CertificationLabel.fields.vin
          - entities.CertificationLabel.fields.mco_number
        distinguishing_aspect: |
          The VIN is a 17-character concatenation of nine positional pieces, and the sequence counter is
          PLANT-wide rather than per model or per unit, so two labels minted back to back read 000001 and
          000002 with identical prefixes. The brake code position is E only because installed_braked_axle_count
          is at least 1, and the year code T comes from the LOGICAL clock year, not from wall time.
