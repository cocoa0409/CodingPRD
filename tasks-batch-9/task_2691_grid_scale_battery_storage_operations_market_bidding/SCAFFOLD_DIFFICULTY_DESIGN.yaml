            - "link 3 — ${o4_status} == SHORTFALL because committed_mw 24.0 > 90.0 / 4.0, with ${o4_derate} == 22.5 and ${o4_mode} == PRELIMINARY"
            - "link 3 penalty under the PRELIMINARY variant at 2026-08-01T00:00:00Z (period_hours 5088.0): ${o4_avail_pct} == 100.00, required_hours_scaled == 4646.58 == round(8000.0 * 5088.0 / 8760.0, 2), ${o4_short} == 0.0 and ${o4_penalty} == 0.00 — a purely capacity-derated obligation is SHORTFALL with a zero exposure, not PENALIZED"
