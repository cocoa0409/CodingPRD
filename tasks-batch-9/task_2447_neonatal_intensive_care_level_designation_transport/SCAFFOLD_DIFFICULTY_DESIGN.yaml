            - call: "POST /referrals/${ref_m2}/accept"
              payload: { expected_unit_version: "${v_m2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
            - call: "POST /admissions"
              payload: { referral_id: "${ref_m2}" }
              as: IntakeNeonatologist
              as_user_id: "${unit_a}:intake-1"
              captures: { adm_m2: $.data.id }
            - &k_batch
              call: "POST /milk-batches"
              payload: { admission_id: "${adm_m2}", donor_type: "MOTHERS_OWN", volume_ml: 120.0, expressed_at: "2026-08-01T00:00:00Z", label_code: "LBL-1" }
              as: BedsideNurse
              as_user_id: "nurse-1"
              captures: { batch_1: $.data.id }
            - &k_batch_verify
              call: "POST /milk-batches/${batch_1}/verify"
              payload: { label_code: "LBL-1" }
              as: BedsideNurse
              as_user_id: "nurse-2"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /milk-batches/${batch_1}/administrations"
              payload: { volume_ml: 200.0 }
              as: BedsideNurse
              as_user_id: "nurse-3"
              captures: { err_fiscal: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: NetworkAdmin
              as_user_id: "net-1"
            - call: "POST /milk-batches/${batch_1}/administrations"
              payload: { volume_ml: 200.0 }
              as: BedsideNurse
              as_user_id: "nurse-3"
              captures: { err_safety_milk: $.data.error_id }
          assert:
            - "${err_fiscal} == ERR_MILK_VOLUME_EXCEEDED with HTTP 422"
            - "${err_safety_milk} == ERR_MILK_EXPIRED with HTTP 422 — priority 11 replaces priority 15 on the identical payload"
            - "MilkBatch.${batch_1}.status == VERIFIED, administered_ml == 0.0, remaining_ml == 120.0 — both refused calls left the ledger untouched"
            - "Admission.${adm_m2}.milk_administered_ml == 0.0"
            - "expires_at == 2026-08-05T00:00:00Z and the batch is expired AT that instant, not after it"

      - name: duplicate_enrollment_referential_precedes_window_temporal
