            - "the case visited OFFER_MADE three times and COUNTERED twice, so neither is a one-shot state"

      - name: section_report_returned_for_info_loops_through_draft_and_raises_surcharge
        grounds:
          - state_machines.SectionReport
          - calculations.section_report_lateness
          - entities.SectionReport.fields.days_late
          - entities.SectionReport.fields.late_surcharge_cents
          - entities.SectionReport.fields.submitted_at
          - endpoints["POST /product-safety/section-reports/{id}/revise"]
        distinguishing_aspect: |
          A DIFFERENT machine from the negotiation cycle and a different flavour of
          non-linearity: SectionReport goes SUBMITTED -> RETURNED_FOR_INFO -> DRAFT,
          so DRAFT — the initial state — is re-entered from two states downstream of
          it, and the same /submit trigger fires twice on one entity. The loop is
          not idempotent: because lateness is recomputed against the unchanged
          report_due_at 2026-03-11T00:00:00Z, the second submission at 2026-03-23
          replaces days_late 2 / surcharge 500000 with days_late 12 / surcharge
          3000000, so revisiting DRAFT costs the filer money rather than resetting
          the clock.
        test_recipe:
          setup:
