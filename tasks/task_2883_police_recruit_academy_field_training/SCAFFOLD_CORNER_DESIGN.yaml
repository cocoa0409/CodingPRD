          - endpoints[POST /course-sessions]
        distinguishing_aspect: "scheduled_hours = ROUND_HALF_UP(seconds / 3600, 2) on three intervals that each land on a different rounding case: 50 minutes -> 0.83 (repeating decimal rounded down), 80 minutes -> 1.33, 30 minutes -> 0.50 (exact)."
        test_recipe:
          setup:
            - "A standard requiring 10.00 PATROL hours, a FORMING cohort, a CERTIFIED PATROL instructor and an APPROVED plan exist."
