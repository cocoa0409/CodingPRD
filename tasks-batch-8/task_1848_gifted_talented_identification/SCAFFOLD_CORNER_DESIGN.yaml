            - { call: "GET /gifted/placements/${plc}/re-evaluations", as: GiftedCoordinator }
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "GET /gifted/placements/${plc}/re-evaluations", as: GiftedCoordinator }
          assert:
            - "at 2027-01-14 the re-evaluation is still SCHEDULED"
            - "at 2027-01-15 (== due_on, inclusive) the re-evaluation is IN_REVIEW"

      - name: gifted_status_reconciles_across_lifecycle
        claim_type: derived_field_reconciliation
        grounds: [entities.Student.fields.gifted_status]
        distinguishing_aspect: "The derived Student.gifted_status tracks the whole lifecycle: NOT_IDENTIFIED at enrollment, IDENTIFIED on transfer honoring, EXITED after the placement withdrawal — each mutation reconciles the field in the same request."
        test_recipe:
          setup: ["clock 2026-08-20; site; cycle OPEN; student enrolled"]
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
