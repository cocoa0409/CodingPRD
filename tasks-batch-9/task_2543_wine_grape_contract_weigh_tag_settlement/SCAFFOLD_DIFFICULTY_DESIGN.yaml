            - "DeliveryAppointment.${appt_b_id}.status is still SCHEDULED, not NO_SHOW, because its window_end 2026-08-27T16:00:00Z has not been reached"

  # ===========================================================================
  # RULE 6 — boundary precision checks (different metrics, distinct endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: lane_daily_capacity_exact_equality_accepted
        endpoint: "POST /grower-relations/delivery-appointments"
        metric: "tons booked on one lane on one UTC calendar date, against CrushPadLane.daily_capacity_tons"
        grounds:
          - validations.priority_44
          - entities.CrushPadLane.fields.daily_capacity_tons
          - entities.CrushPadLane.fields.committed_tons
        distinguishing_aspect: |
          Metric: TONNAGE against a daily lane ceiling, on the appointment-booking endpoint.
          22.000 + 22.000 + 36.000 lands on 80.000, exactly equal to daily_capacity_tons, and
          the rule declares equality accepted; a further 5.000 tons on the same UTC date is
          refused. The two probes differ by the smallest bookable amount either side of the line.
        test_recipe:
          setup:
            - "Producer, block, reference QualitySpec, crew, and lane L1 with daily_capacity_tons 80.000, max_load_tons 70.0 and turnaround_buffer_minutes 30."
            - "ACTIVE contract with committed_tons 85.000, completed PICK_READY sampling visit, acknowledged pick call with target_pick_at 2026-08-25T14:00:00Z."
            - "Two appointments already booked on 2026-08-25: 14:00-16:00 planned 22.000 and 17:00-19:00 planned 22.000, so the lane stands at 44.000 of 80.000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 45.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_id: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/crush-pad-lanes"
              payload: { lane_code: "L1", daily_capacity_tons: 80.000, turnaround_buffer_minutes: 30, max_load_tons: 70.0 }
              as: HarvestCoordinator
              captures: { lane_id: $.data.id }
            - call: "POST /grower-relations/sampling-crews"
              payload: { crew_code: "SC-1", region_code: "NAPA-NORTH", max_concurrent_visits: 2 }
              as: HarvestCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-LANE-EDGE", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_SPOT", term_start_vintage: 2026, term_end_vintage: 2028, committed_tons: 85.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/sampling-visits"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", crew_id: "${crew_id}", window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z" }
              as: HarvestCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /grower-relations/sampling-visits/${visit_id}/record"
              payload: { measured_brix: 24.5, measured_ta_gl: 6.5, measured_ph: 3.45, measured_rot_pct: 1.0 }
              as: HarvestCoordinator
            - call: "POST /grower-relations/pick-calls"
              payload: { contract_id: "${contract_id}", block_id: "${block_id}", target_pick_at: "2026-08-25T14:00:00Z", estimated_tons: 85.000 }
              as: HarvestCoordinator
              captures: { pick_id: $.data.id }
            - call: "POST /grower-relations/pick-calls/${pick_id}/acknowledge"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_id}", lane_id: "${lane_id}", window_start: "2026-08-25T14:00:00Z", window_end: "2026-08-25T16:00:00Z", planned_tons: 22.000 }
              as: HarvestCoordinator
              captures: { appt1_id: $.data.id }
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_id}", lane_id: "${lane_id}", window_start: "2026-08-25T17:00:00Z", window_end: "2026-08-25T19:00:00Z", planned_tons: 22.000 }
              as: HarvestCoordinator
              captures: { appt2_id: $.data.id }
          trigger:
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_id}", lane_id: "${lane_id}", window_start: "2026-08-25T20:00:00Z", window_end: "2026-08-25T22:00:00Z", planned_tons: 36.000 }
              as: HarvestCoordinator
              captures: { appt3_id: $.data.id }
            - call: "POST /grower-relations/delivery-appointments"
              payload: { pick_call_id: "${pick_id}", lane_id: "${lane_id}", window_start: "2026-08-25T23:00:00Z", window_end: "2026-08-25T23:30:00Z", planned_tons: 5.000 }
              as: HarvestCoordinator
          assert:
            - "The first trigger call returns 201: 44.000 + 36.000 == 80.000 is exactly daily_capacity_tons and equality is accepted"
            - "CrushPadLane.${lane_id}.committed_tons == 80.000 and scheduled_appointment_count == 3"
            - "The second trigger call returns 409 with error_id == ERR_LANE_DAILY_CAPACITY_EXCEEDED because 80.000 + 5.000 == 85.000 > 80.000"
            - "CrushPadLane.${lane_id}.committed_tons is still exactly 80.000, not 85.000"
            - "PickCall.${pick_id}.appointed_tons == 80.000"
            - "The refused 5.000-ton window would be legal on 2026-08-26 instead: the ceiling is per UTC calendar date of window_start, not per lane lifetime"

      - name: zero_net_weight_tare_equals_gross_boundary
