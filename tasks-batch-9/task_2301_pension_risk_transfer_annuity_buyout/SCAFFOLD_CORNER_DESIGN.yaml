              as: Actuary
              as_user_id: "actuary-01"
              captures: { strategy_id: $.data.id }
            - call: "POST /prt/strategies/${strategy_id}/submission"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
              captures: { s_v_after_first: $.data.version, s_state_after_first: $.data.strategy_status }
          trigger:
            - call: "POST /prt/strategies/${strategy_id}/submission"
