  - rule_id: resource_temporal_overlap
    instances:
      - name: surface_adjacent_rental_rejected_by_clean_buffer
        grounds:
          - validations[priority=46]
          - state_machines.SupportSurfaceOrder.REQUESTED_to_APPROVED
          - entities.SupportSurface.fields.occupied_until
          - entities.SupportSurface.fields.available_from
          - global_constants.RECLEAN_BUFFER_HOURS
        distinguishing_aspect: |
          Resource SupportSurface, HALF-OPEN interval [rental_start, rental_end)
          plus a TRAILING RECLEAN_BUFFER_HOURS extension, aggregate capacity
          exactly 1. A second rental starting at the precise instant the first
          one ends (2026-08-04T00:00:00Z) would be legal under bare half-open
          arithmetic but is rejected because the blocked span runs to
          2026-08-04T12:00:00Z; starting at exactly 2026-08-04T12:00:00Z is
          accepted, proving the buffer bound is exclusive at its own end.
        test_recipe:
          setup:
            - "Unit 7W exists with rental_budget_cap_cents 500000."
            - "SupportSurface BED-040 is at daily_rate_cents 10000."
            - "Patients MRN-N1 and MRN-N2 are ADMITTED on 7W."
            - "Order A for MRN-N1 covers 2026-08-01T00:00:00Z..2026-08-04T00:00:00Z (3 days, authorized_cost_cents 32400) and is already APPROVED, so SupportSurface.occupied_until is 2026-08-04T00:00:00Z and available_from is 2026-08-04T12:00:00Z."
            - "Order B for MRN-N2 covers 2026-08-04T00:00:00Z..2026-08-07T00:00:00Z and is still REQUESTED."
            - "Order C for MRN-N2 covers 2026-08-04T12:00:00Z..2026-08-07T12:00:00Z and is still REQUESTED."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-N1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-N2", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p2_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-040", surface_class: "LOW_AIR_LOSS", daily_rate_cents: 10000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-04T00:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { oa_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p2_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-04T00:00:00Z", rental_end: "2026-08-07T00:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { ob_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p2_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-04T12:00:00Z", rental_end: "2026-08-07T12:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { oc_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v0: "$.data.version" }
            - call: "POST /support-surface-orders/${oa_id}/approve"
              payload: { expected_unit_version: "${u1_v0}" }
              as: MaterialsCoordinator
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v1: "$.data.version" }
          trigger:
            - call: "POST /support-surface-orders/${ob_id}/approve"
              payload: { expected_unit_version: "${u1_v1}" }
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${oc_id}/approve"
              payload: { expected_unit_version: "${u1_v1}" }
              as: MaterialsCoordinator
          assert:
            - "After order A's approval: SupportSurface.${s1_id}.occupied_until == 2026-08-04T00:00:00Z and available_from == 2026-08-04T12:00:00Z (rental_end + RECLEAN_BUFFER_HOURS 12)"
            - "Order B's approve returns HTTP 409 with data.error_id == ERR_SURFACE_UNAVAILABLE: candidate [2026-08-04T00:00:00Z, 2026-08-07T00:00:00Z) intersects the blocked span [2026-08-01T00:00:00Z, 2026-08-04T12:00:00Z)"
            - "SupportSurfaceOrder.${ob_id}.fulfillment_status == REQUESTED and billing_status == UNBILLED after the rejection"
            - "Order C's approve returns HTTP 200 and SupportSurfaceOrder.${oc_id}.fulfillment_status == APPROVED: candidate [2026-08-04T12:00:00Z, 2026-08-07T12:00:00Z) touches the blocked span only at its exclusive upper bound"
            - "Unit.${u1_id}.rental_encumbered_cents == 64800 (32400 for order A plus 32400 for order C; order B contributed nothing)"
            - "Unit.${u1_id}.rental_available_cents == 435200"
            - "After order C's approval: SupportSurface.${s1_id}.occupied_until == 2026-08-07T12:00:00Z and available_from == 2026-08-08T00:00:00Z"
            - "The 12-hour move of rental_start is the ONLY difference between the rejected order B and the accepted order C — identical patient, unit, surface, duration, authorized_days and cost"

      - name: unit_prevalence_window_conflict_closed_interval_capacity
        grounds:
          - validations[priority=44]
          - state_machines.SurveyRound.PLANNED_to_OPEN
          - entities.SurveyRound.fields.window_start
          - entities.SurveyRound.fields.window_end
          - global_constants.MAX_CONCURRENT_INCIDENCE_ROUNDS
        distinguishing_aspect: |
          A different resource and a different interval algebra from the surface
          instance: the contended resource is a Unit, the arithmetic is CLOSED
          interval with NO buffer, and the aggregate capacity is round_type
          dependent — 1 for PREVALENCE, MAX_CONCURRENT_INCIDENCE_ROUNDS 2 for
          INCIDENCE. Two PREVALENCE windows that merely TOUCH at
          2026-08-05T00:00:00Z therefore collide, while a third INCIDENCE round is
          needed before the incidence capacity trips.
        test_recipe:
          setup:
            - "Unit 7W exists."
            - "R1 is a PREVALENCE round on 7W covering 2026-08-01T00:00:00Z..2026-08-05T00:00:00Z and is already OPEN."
            - "R2 is a PLANNED PREVALENCE round on 7W covering 2026-08-05T00:00:00Z..2026-08-09T00:00:00Z — it touches R1 at exactly one instant."
            - "R3, R4 and R5 are PLANNED INCIDENCE rounds on 7W covering 2026-08-05..2026-08-09, 2026-08-06..2026-08-10 and 2026-08-07..2026-08-11 respectively; all three mutually overlap."
            - "R6 is a PLANNED PREVALENCE round on 7W covering 2026-08-06T00:00:00Z..2026-08-10T00:00:00Z, one day clear of R1's closed end."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "PREVALENCE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-05T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { r1_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "PREVALENCE", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-09T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { r2_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "INCIDENCE", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-09T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { r3_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "INCIDENCE", window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-10T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { r4_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "INCIDENCE", window_start: "2026-08-07T00:00:00Z", window_end: "2026-08-11T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { r5_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "PREVALENCE", window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-10T00:00:00Z", participating_unit_ids: ["${u1_id}"] }
              as: WocProgramDirector
              captures: { r6_id: "$.data.id" }
            - call: "POST /survey-rounds/${r1_id}/open"
              payload: {}
              as: WocProgramDirector
          trigger:
            - call: "POST /survey-rounds/${r2_id}/open"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-rounds/${r3_id}/open"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-rounds/${r4_id}/open"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-rounds/${r5_id}/open"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-rounds/${r6_id}/open"
              payload: {}
              as: WocProgramDirector
          assert:
            - "Opening R2 returns HTTP 409 with data.error_id == ERR_SURVEY_WINDOW_CONFLICT because window_start 2026-08-05T00:00:00Z <= R1.window_end 2026-08-05T00:00:00Z under CLOSED-interval arithmetic, and PREVALENCE capacity is 1"
            - "SurveyRound.${r2_id}.status == PLANNED after the rejection"
            - "Opening R3 returns HTTP 200 and SurveyRound.${r3_id}.status == OPEN — an INCIDENCE round never collides with a PREVALENCE round, so the capacity counters are per round_type"
            - "Opening R4 returns HTTP 200 and SurveyRound.${r4_id}.status == OPEN — one colliding INCIDENCE round is still below MAX_CONCURRENT_INCIDENCE_ROUNDS 2"
            - "Opening R5 returns HTTP 409 with data.error_id == ERR_SURVEY_WINDOW_CONFLICT — R3 and R4 both collide with R5's window, so 2 >= MAX_CONCURRENT_INCIDENCE_ROUNDS 2"
            - "SurveyRound.${r5_id}.status == PLANNED after the rejection"
            - "Opening R6 returns HTTP 200 and SurveyRound.${r6_id}.status == OPEN — window_start 2026-08-06T00:00:00Z is strictly after R1.window_end 2026-08-05T00:00:00Z, and the still-PLANNED R2 is not counted"
            - "Unit.${u1_id}.survey_posture == OPEN throughout — the window contention rule never touches posture"

  - rule_id: compensating_invariant
    instances:
      - name: unit_rental_ledger_conserved_across_approve_and_release
        grounds:
          - entities.Unit.fields.rental_encumbered_cents
          - entities.Unit.fields.rental_committed_cents
          - entities.Unit.fields.rental_released_cents
          - entities.Unit.fields.rental_available_cents
          - state_machines.SupportSurfaceOrder.DELIVERED_to_RETURNED
          - calculations.rental_cost_projection
          - calculations.vendor_service_fee
        distinguishing_aspect: |
          MONEY invariant. The identity
          rental_available_cents == rental_budget_cap_cents - rental_encumbered_cents
          - rental_committed_cents must hold at every checkpoint, and the
          authorization must be conserved exactly on early return:
          authorized 189000 splits into committed 126000 plus released 63000 with
          zero drift and zero double counting.
        test_recipe:
          setup:
            - "Unit 7W exists with rental_budget_cap_cents 500000, all four ledger fields at their initial values."
            - "SupportSurface BED-050 is at daily_rate_cents 30000."
            - "Patient MRN-M1 is ADMITTED on 7W."
            - "A 6-day order 2026-08-01T00:00:00Z..2026-08-07T00:00:00Z with authorized_days 6 exists at (REQUESTED, UNBILLED): projected 180000, tier-2 fee 9000, authorized_cost_cents 189000."
            - "The bed is returned early, at 2026-08-05T00:00:00Z, i.e. after 4 billable days."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-M1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-050", surface_class: "BARIATRIC_BED", daily_rate_cents: 30000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-07T00:00:00Z", authorized_days: 6 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v: "$.data.version" }
          trigger:
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${u1_v}" }
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${o1_id}/deliver"
              payload: { delivered_at: "2026-08-01T00:00:00Z" }
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${o1_id}/return"
              payload: { actual_return_at: "2026-08-05T00:00:00Z" }
              as: MaterialsCoordinator
          assert:
            - "CHECKPOINT 0, before approve: Unit.${u1_id}.rental_encumbered_cents == 0, rental_committed_cents == 0, rental_released_cents == 0, rental_available_cents == 500000; identity 500000 - 0 - 0 == 500000 holds"
            - "SupportSurfaceOrder.${o1_id}.projected_cost_cents == 180000 (6 tier-1 days at 30000) and authorized_cost_cents == 189000 (fee 9000 at FEE_PCT_TIER_2 0.05)"
            - "CHECKPOINT 1, after approve: rental_encumbered_cents == 189000, rental_committed_cents == 0, rental_released_cents == 0, rental_available_cents == 311000; identity 500000 - 189000 - 0 == 311000 holds"
            - "CHECKPOINT 1b, after deliver: all four ledger fields are byte-identical to checkpoint 1 — logistics moves no money"
            - "SupportSurfaceOrder.${o1_id}.actual_cost_cents == 126000 (4 billable days at 30000 = 120000 projected, tier-2 fee 6000)"
            - "CHECKPOINT 2, after return: rental_encumbered_cents == 0, rental_committed_cents == 126000, rental_released_cents == 63000, rental_available_cents == 374000; identity 500000 - 0 - 126000 == 374000 holds"
            - "Conservation of the authorization: rental_committed_cents 126000 + rental_released_cents 63000 == authorized_cost_cents 189000 exactly, with no rounding drift"
            - "The encumbrance is not double counted: rental_encumbered_cents returns to 0 rather than staying at 189000 or going negative"
            - "SupportSurfaceOrder.${o1_id}.billing_status == COMMITTED and fulfillment_status == RETURNED"

      - name: nurse_consult_load_conserved_across_assign_and_close
        grounds:
          - entities.WocNurse.fields.active_consult_load
          - entities.WocNurse.fields.mentored_consult_count
          - entities.WocNurse.fields.certification_eligibility_score
          - state_machines.ConsultRequest.TRIAGED_to_ASSIGNED
          - state_machines.ConsultRequest.PLAN_ACTIVE_to_CLOSED
          - state_machines.ConsultRequest.ASSIGNED_to_CANCELLED
          - calculations.certification_eligibility_score
        distinguishing_aspect: |
          A CAPACITY-COUNT invariant rather than a money one, on a different
          entity (WocNurse): active_consult_load must equal assignments minus
          completions minus cancellations at every checkpoint and return to
          exactly 0, while mentored_consult_count counts ONLY the closed consult
          (1, not 2) and therefore lifts certification_eligibility_score from
          64.00 to 66.00. A cancel that also bumped mentored_consult_count would
          leave the load conserved but the score wrong.
        test_recipe:
          setup:
            - "Unit 7W exists; WocNurse Nina is CERTIFIED with ce_credits 30, competency_signoff_count 2, last_competency_signoff_at 2026-08-01T00:00:00Z, mentored_consult_count 0, certification_eligibility_score 64.00, max_consult_load 8."
            - "WocNurse Omar is CERTIFIED and exists only to validate Nina's staging."
            - "FormularyProduct FOAM-02 is ACTIVE at PREFERRED tier with unit_cost_cents 1250."
            - "Patients MRN-W1 and MRN-W2 were both ADMITTED on 7W at 2026-07-31T12:00:00Z."
            - "Consult C1 (MRN-W1) is driven all the way to PLAN_ACTIVE with its case CLASSIFIED_POA; consult C2 (MRN-W2) is left at ASSIGNED. Both are assigned to Nina, so active_consult_load is 2."
            - "The logical clock stays at its 2026-08-01T00:00:00Z default, so months_since is 0 and recency_component is 100."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /woc-nurses"
              payload: { full_name: "Omar Verify", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n2_id: "$.data.id" }
            - call: "POST /woc-nurses/${n2_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n2_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "RCA" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n2_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n2_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /formulary-products"
              payload: { sku: "FOAM-02", name: "Silicone foam dressing 15x15", category: "FOAM", unit_cost_cents: 1250, formulary_tier: "PREFERRED" }
              as: WocProgramDirector
              captures: { fp_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-W1", unit_id: "${u1_id}", admitted_at: "2026-07-31T12:00:00Z", comorbidity_count: 0, device_related_risk: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-W2", unit_id: "${u1_id}", admitted_at: "2026-07-31T12:00:00Z", comorbidity_count: 0, device_related_risk: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p2_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Sacral wound documented on admission." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "POST /consult-requests"
              payload: { patient_id: "${p2_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Heel redness documented on admission." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c2_id: "$.data.id" }
            - call: "POST /consult-requests/${c2_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c2_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { p1_v: "$.data.version" }
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_2", measured_area_cm2: 6, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}", present_on_admission_claimed: true }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /skin-assessments/${a1_id}/validate"
              payload: { confirmed_stage: "STAGE_2", present_on_admission_confirmed: true }
              as: WocNurse
              as_user_id: "${n2_id}"
            - call: "POST /dressing-protocols"
              payload: { consult_request_id: "${c1_id}", formulary_product_id: "${fp_id}", change_frequency_hours: 48, units_per_change: 2 }
              as: WocNurse
              as_user_id: "${n1_id}"
          trigger:
            - call: "POST /consult-requests/${c1_id}/close"
              payload: { closing_summary: "Wound healing, unit staff educated, POA documented." }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c2_id}/cancel"
              payload: { reason: "Patient transferred to another facility." }
              as: WocProgramDirector
          assert:
            - "CHECKPOINT 0, after the two assignments: WocNurse.${n1_id}.active_consult_load == 2, mentored_consult_count == 0, certification_eligibility_score == 64.00 (0.4*100 + 0.4*min(60, 2*30) + 0.2*0)"
            - "CHECKPOINT 1, after close: WocNurse.${n1_id}.active_consult_load == 1 and ConsultRequest.${c1_id}.status == CLOSED"
            - "CHECKPOINT 1, after close: WocNurse.${n1_id}.mentored_consult_count == 1 and certification_eligibility_score == 66.00 (0.4*100 + 0.4*60 + 0.2*(10*min(4,1)) = 40 + 24 + 2)"
            - "CHECKPOINT 2, after cancel: WocNurse.${n1_id}.active_consult_load == 0 and ConsultRequest.${c2_id}.status == CANCELLED"
            - "CHECKPOINT 2, after cancel: WocNurse.${n1_id}.mentored_consult_count is still 1 and certification_eligibility_score is still 66.00 — a cancelled consult is not a mentored one"
            - "The load identity holds at every checkpoint: active_consult_load == 2 assignments - closes - cancels, and it returns to exactly 0 rather than going negative or sticking at 1"
            - "WocNurse.${n1_id}.certification_status == CERTIFIED and max_consult_load == 8 throughout — load bookkeeping never touches the certification dimension"
            - "WocNurse.${n2_id}.active_consult_load == 0 and mentored_consult_count == 0 — validating another nurse's assessment carries no load"
