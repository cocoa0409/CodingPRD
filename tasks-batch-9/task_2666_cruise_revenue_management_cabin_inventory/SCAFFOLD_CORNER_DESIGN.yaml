      - name: common_fields_are_server_minted_and_version_increments_per_write
        claim_type: system_fields
        grounds:
          - entities.SailingInventory
          - concurrency_rules.oversell-adjust-stale-inventory
          - endpoints[PATCH /sailing-inventories/{id}]
        distinguishing_aspect: |
          The four common fields are entirely server-owned: id is a bare UUID with no type
          prefix, created_at and updated_at are ISO 8601 UTC with three fractional digits,
          version starts at 1 and increments by exactly one per mutation. The PATCH proves the
          increment and that created_at survives while updated_at moves forward.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing SYS-2701 in PLANNED with a guarantee IA allotment created at oversell_allowance 4, whose version at creation is captured as ${sv_a}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "SYS-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_y: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_y}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_y: $.data.id, sv_a: $.data.version }
          trigger:
            - call: "PATCH /sailing-inventories/${inv_y}"
              payload: { oversell_allowance: 2, expected_inventory_version: "${sv_a}" }
              as: RevenueManager
              captures: { sv_b: $.data.version }
          assert:
            - "${sv_a} == 1 (version starts at 1 on creation)"
            - "${sv_b} == 2 (exactly one increment for exactly one mutation)"
            - "SailingInventory.${inv_y}.id is a bare UUID with no type prefix such as inv_ or si_"
            - "SailingInventory.${inv_y}.created_at is unchanged by the PATCH and updated_at is strictly greater than it"
            - "both timestamps are ISO 8601 UTC with three fractional digits"
            - "SailingInventory.${inv_y}.oversell_allowance == 2 and effective_oversell_cabins == 2 and available_cabins == 62"

      - name: enum_and_range_constraints_are_rejected_on_create
