              captures: { ls_b: $.data.id }
            - call: "POST /wind-ops/turbines/${t_id}/curtailment-orders"
              payload: { reason: "NOISE", start_utc: "2026-08-02T00:00:00Z", end_utc: "2026-08-02T06:00:00Z", power_limit_kw: 1500, deemed_kwh_per_hour: 500, expected_turbine_version: "${t_v_fresh}" }
              as: ControlRoomOperator
