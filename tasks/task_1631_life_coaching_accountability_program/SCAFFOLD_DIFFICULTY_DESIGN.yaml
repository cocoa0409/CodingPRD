          trigger:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /coaching/clients/${client_e}?score_variant=provisional"
              as: PracticeManager
              captures: { score_prov: $.data.engagement_score }
            - call: "GET /coaching/clients/${client_e}"
              as: PracticeManager
              captures: { score_final: $.data.engagement_score }
          assert:
            - "provisional variant == 100 (counts 2 sessions / expected 2, 7 habits / 7 days)"
            - "final variant == 25 (counts 2/8 sessions, 7/28 habits)"
            - "Client.${client_e}.engagement_score == 25 (stored field is the final variant)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pro_rata_session_value_tiered_branch
        grounds:
          - calculations.pro_rata_session_value
          - entities.ProgramTier.fields.tier_type
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tier_type branch
          (SINGLE -> 0, PACKAGE -> flat floor, MEMBERSHIP -> time-prorated double floor)
          x consumed fraction x remaining days; MEMBERSHIP quote 120000*42/84 floored
          then divided by remaining sessions yields 59994, not 60000.
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B VERIFIED assessor, Client M"
            - "Tier MEM-12: MEMBERSHIP, session_count 12, price_cents 120000, duration_days 84, installment_count_allowed 1, reschedule_cap 1"
            - "Enrollment ACTIVE since 2026-08-03, paid in full; 3 sessions COMPLETED (2026-08-04/05/06)"
            - "Clock at 2026-09-14 -> days_left = 84 - 42 = 42"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach A", email: "coach.a@x.com", credential_level: "PCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_a: $.data.id }
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach B", email: "coach.b@x.com", credential_level: "MCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
              captures: { coach_b: $.data.id }
            - call: "POST /coaching/coaches/${coach_a}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/coaches/${coach_b}/verify-credential"
              payload: {}
              as: PracticeManager
            - call: "POST /coaching/clients"
              payload: { full_name: "Client M", email: "cm@x.com", timezone: "UTC" }
              as: PracticeManager
              captures: { client_m: $.data.id }
            - call: "POST /coaching/program-tiers"
              payload: { tier_code: "MEM-12", tier_type: "MEMBERSHIP", session_count: 12, price_cents: 120000, duration_days: 84, installment_count_allowed: 1, reschedule_cap: 1 }
              as: PlatformAdmin
              captures: { tier_m: $.data.id }
            - call: "POST /coaching/discovery-calls"
              payload: { client_id: "${client_m}", coach_id: "${coach_a}", scheduled_start: "2026-08-02T10:00:00Z", duration_minutes: 45 }
              as: Client
              as_user_id: "${client_m}"
              captures: { dc_m: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/discovery-calls/${dc_m}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/discovery-calls/${dc_m}/fit-assessment"
              payload: { scope_fit: "WITHIN_SCOPE", commitment_score: 90 }
              as: Coach
              as_user_id: "${coach_b}"
            - call: "POST /coaching/enrollments"
              payload: { client_id: "${client_m}", coach_id: "${coach_a}", program_tier_id: "${tier_m}", discovery_call_id: "${dc_m}", installment_count: 1 }
              as: Client
              as_user_id: "${client_m}"
              captures: { enr_m: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/_payments/simulate"
              payload: { enrollment_id: "${enr_m}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /coaching/enrollments/${enr_m}/sessions"
              payload: { scheduled_start: "2026-08-04T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_m}"
              captures: { s_m1: $.data.id }
            - call: "POST /coaching/enrollments/${enr_m}/sessions"
              payload: { scheduled_start: "2026-08-05T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_m}"
              captures: { s_m2: $.data.id }
            - call: "POST /coaching/enrollments/${enr_m}/sessions"
              payload: { scheduled_start: "2026-08-06T10:00:00Z", duration_minutes: 60 }
              as: Client
              as_user_id: "${client_m}"
              captures: { s_m3: $.data.id }
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/sessions/${s_m1}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/sessions/${s_m2}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
            - call: "POST /coaching/sessions/${s_m3}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_a}"
          trigger:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/refund-requests"
              payload: { enrollment_id: "${enr_m}" }
              as: Client
              as_user_id: "${client_m}"
              captures: { rr_m: $.data.id, rr_m_basis: $.data.basis, rr_m_amount: $.data.amount_cents }
          assert:
            - "RefundRequest.${rr_m}.basis == PRO_RATA (day 42 > 14)"
            - "RefundRequest.${rr_m}.amount_cents == 54994 (MEMBERSHIP branch of pro_rata_session_value: floor(floor(120000*42/84)/9)*9 = 59994; min(59994, 120000) - 5000 = 54994)"
            - "Divergence check: a flat-per-session computation would give 85000 ((12-3)*10000 - 5000); the tiered MEMBERSHIP branch's double-floor yields 54994"
      - name: installment_schedule_remainder_to_last
        grounds:
          - calculations.installment_schedule
          - entities.Installment.fields.amount_cents
          - entities.Installment.fields.sequence_no
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order: per-installment floor first,
          remainder onto the LAST installment. 80000 / 3 => [26666, 26666, 26668];
          a 'round each then sum' or 'remainder to first' convention produces a
          different vector, so the rounding order is observable.
        test_recipe:
          setup:
            - "Coach A VERIFIED, Coach B VERIFIED assessor, Client P"
            - "Tier PKG-8: PACKAGE, 8 sessions, price_cents 80000, installment_count_allowed 3, reschedule_cap 2"
            - "Enrollment created with installment_count 3 (NOT yet paid)"
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /coaching/coaches"
              payload: { display_name: "Coach A", email: "coach.a@x.com", credential_level: "PCC", credential_expires_on: "2027-01-01", max_concurrent_clients: 10 }
              as: PracticeManager
