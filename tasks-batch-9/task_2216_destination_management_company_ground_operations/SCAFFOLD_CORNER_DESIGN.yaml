            - call: "POST /dmc/settlement-payments"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_id: "${ctr_id}", expected_contract_version: "${ctr_v_sent}" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { err: $.data.error_id }
            - call: "GET /dmc/supplier-contracts/${ctr_id}"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
              captures: { ctr_v_now: $.data.version }
            - call: "POST /dmc/settlement-payments"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_id: "${ctr_id}", expected_contract_version: "${ctr_v_now}" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { pay_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 412 and ${err} == ERR_STALE_CONTRACT_VERSION"
            - "${ctr_v_now} == ${ctr_v_sent} + 1"
            - "GET /dmc/settlement-payments?program_id=${prog_id}&limit=10&offset=0 returns total_count == 1 after the third trigger call"
            - "the third trigger call returns HTTP 201"
            - "SettlementPayment.${pay_id}.gross_cents == 200000"
            - "SettlementPayment.${pay_id}.deposit_applied_cents == 0"
            - "SettlementPayment.${pay_id}.net_payable_cents == 200000"

      - name: derived_program_money_reconciles_after_a_line_correction
        claim_type: derived_field_reconciliation
        grounds: [calculations.reconciliation_line_amounts, calculations.program_client_total, entities.Program.fields.final_subtotal_cents]
        distinguishing_aspect: "The derived money set is recomputed, not accumulated: at markup_pct 0.20 the line first bills the 34-guest attrition floor (170000 / 34000), a correction to actual_headcount 42 rewrites it to 210000 / 42000, and approval publishes fee 30240 with final_client_total 282240."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Venue; one APPROVED Supplier."
            - "Program 2026-09-10..2026-09-14, markup_pct 0.20, guaranteed_count 40; one element 2026-09-11T09:00Z..13:00Z with planned/guaranteed 40 and per_person_cost_cents 5000."
            - "ACTIVE SupplierContract with deposit_pct 0; program CONFIRMED then IN_EXECUTION; element READY."
            - "Element delivered with actual_headcount 30 at 2026-09-11T13:30:00Z: FINAL billable is the attrition floor max(ceil(40 x 0.85)=34, 30) = 34."
            - "Program reconciled so exactly one DRAFT ReconciliationLine exists."
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "Derived Venue", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Derived Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Derived Client", group_name: "Derived Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 40, markup_pct: 0.20 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Derived Element", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T13:00:00Z", planned_headcount: 40, guaranteed_headcount: 40, per_person_cost_cents: 5000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el_id: $.data.id }
            - call: "POST /dmc/supplier-contracts"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_value_cents: 200000, required_liability_limit_cents: 100000000, deposit_pct: 0, cancellation_tier: "STANDARD" }
              as: SupplierManager
              captures: { ctr_id: $.data.id }
            - call: "POST /dmc/supplier-contracts/${ctr_id}/send"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-sender-1"
            - call: "POST /dmc/supplier-contracts/${ctr_id}/countersign"
              payload: {}
              as: SupplierManager
              as_user_id: "sm-signer-2"
            - call: "POST /dmc/programs/${prog_id}/lock-design"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/start-execution"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /dmc/program-elements/${el_id}/mark-ready"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T13:30:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/program-elements/${el_id}/deliver"
              payload: { actual_headcount: 30 }
              as: OperationsCoordinator
            - call: "POST /dmc/programs/${prog_id}/reconcile"
              payload: {}
              as: ProgramDirector
            - call: "GET /dmc/reconciliation-lines?program_id=${prog_id}&limit=10&offset=0"
              payload: {}
              as: ProgramDirector
              captures: { line_id: "$.data[0].id" }
          trigger:
            - call: "GET /dmc/reconciliation-lines/${line_id}"
              payload: {}
              as: ProgramDirector
            - call: "PATCH /dmc/reconciliation-lines/${line_id}"
              payload: { actual_headcount: 42 }
              as: ProgramDirector
            - call: "POST /dmc/reconciliation-lines/${line_id}/approve"
              payload: {}
              as: ProgramDirector
          assert:
            - "the first trigger call shows billed_headcount == 34, supplier_cost_cents == 170000, markup_cents == 34000, client_charge_cents == 204000"
            - "after the PATCH, ReconciliationLine.${line_id}.billed_headcount == 42, supplier_cost_cents == 210000, markup_cents == 42000, client_charge_cents == 252000"
            - "after the PATCH, ReconciliationLine.${line_id}.variance_pct == 0.05 so no variance_reason is required"
            - "the third trigger call returns HTTP 200 with ReconciliationLine.${line_id}.status == APPROVED"
            - "Program.${prog_id}.final_subtotal_cents == 210000"
            - "Program.${prog_id}.disclosed_markup_cents == 42000"
            - "Program.${prog_id}.management_fee_cents == 30240"
            - "Program.${prog_id}.final_client_total_cents == 282240"
            - "Program.${prog_id}.supplier_gross_payable_cents == 210000 and Program.${prog_id}.supplier_open_payable_cents == 210000"

      - name: program_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds: [entities.Program.fields.version, "endpoints[POST /dmc/programs/{program_id}/lock-design]"]
        distinguishing_aspect: "Every mutating call against the program advances its version by exactly one -- create 1, element create 2, lock-design 3, unlock-design 4 -- while the two GETs in between leave it untouched."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Venue; one APPROVED Supplier; one DRAFT Program."
          setup_api_calls:
            - call: "POST /dmc/venues"
              payload: { name: "Version Venue", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Version Supplier", supplier_type: "ACTIVITY", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Version Client", group_name: "Version Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
          trigger:
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Version Element", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/lock-design"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/unlock-design"
              payload: {}
              as: ProgramDirector
          assert:
            - "${prog_v1} == 1"
            - "the first trigger call (a GET) reports version == 1"
            - "after the element create Program.${prog_id}.version == 2"
            - "after lock-design Program.${prog_id}.version == 3 and execution_status == DESIGN_LOCKED"
            - "after unlock-design Program.${prog_id}.version == 4 and execution_status == DRAFT"
            - "Program.${prog_id}.element_count == 1 throughout"

      - name: cascading_side_effects_multi_level_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.Permit.SUBMITTED_to_DENIED]
        excluded_because:
          difficulty_instance: transitive_cascade / permit_denial_cascade_depth_four
          rationale: "The four-level chain Permit -> ProgramElement -> StaffAssignment -> StaffMember/Program is verified end to end there."

      - name: dual_variant_calculation_delta_on_switch
        claim_type: dual_variant_calculation
        grounds: [calculations.staff_labor_cost]
        excluded_because:
          difficulty_instance: dual_variant_calc / staff_labor_cost_planned_vs_actual_divergence
          rationale: "Both PLANNED and ACTUAL labor variants and the minimum-call-out floor that drives their divergence are asserted there."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: cascade_is_visible_in_the_triggering_response
        claim_type: immediate
        grounds: [state_machines.TransportSegment.SCHEDULED_to_CANCELLED, entities.TransportSegment.fields.booked_seat_count]
        distinguishing_aspect: "No re-read and no delay is needed: the cancel response body itself already reports status CANCELLED and booked_seat_count 0, and the immediately following reads show both entries RELEASED and unseated_guest_count 2 with no intermediate stale value ever observable."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one Program 2026-09-10..2026-09-14; one SHUTTLE_LOOP segment with seat_capacity 12."
            - "Two ManifestEntry rows on that segment, guest_ref G-600 and G-700, each with seat_count 2, so booked_seat_count is 4."
          setup_api_calls:
            - call: "POST /dmc/programs"
              payload: { client_name: "Immediate Client", group_name: "Immediate Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "DINE_AROUND_LEG", vehicle_code: "IMM-01", origin: "Host Hotel", destination: "Old Town", depart_at: "2026-09-11T18:00:00Z", arrive_at: "2026-09-11T18:25:00Z", seat_capacity: 12, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-600", guest_name: "Fen Adeyemi", seat_count: 2, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me1: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-700", guest_name: "Gita Sharma", seat_count: 2, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me2: $.data.id }
          trigger:
            - call: "POST /dmc/transport-segments/${seg_id}/cancel"
              payload: { cancel_reason: "Vehicle breakdown." }
              as: OperationsCoordinator
            - call: "GET /dmc/manifest-entries?segment_id=${seg_id}&limit=10&offset=0"
              payload: {}
              as: OperationsCoordinator
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: OperationsCoordinator
          assert:
            - "before the trigger TransportSegment.${seg_id}.booked_seat_count == 4 and Program.${prog_id}.seated_guest_count == 4"
            - "the cancel response body itself reports status == CANCELLED and booked_seat_count == 0"
            - "the second trigger call reports both ManifestEntry.${me1} and ManifestEntry.${me2} with status == RELEASED"
            - "the third trigger call reports seated_guest_count == 0 and unseated_guest_count == 2"
            - "no additional read, retry or clock advance is required for any of these values to be correct"
