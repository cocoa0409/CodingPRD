              as: SiteSupervisor
              as_user_id: "${site_id}"
              captures: { day1_id: $.data.id }
            - call: "POST /sfsp/meal-service-days/${day1_id}/open"
              payload: { production_counts: { LUNCH: 150 }, food_received_at: "2026-06-08T10:30:00Z" }
              as: SiteSupervisor
              as_user_id: "${site_id}"
