scenario: "985. Firewood & Bulk-Fuel Delivery: product (cord/pellet) & seasoned grade, order & stacking add-on, delivery route & window, winter subscription, volume pricing, moisture/quality, area restriction, billing"
domain_name: firewood-bulk-fuel-delivery
api_prefix: /api/v1

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ----------------------------------------------------------------------------
# §1.1 Entities
# ----------------------------------------------------------------------------
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Unique customer email" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: street_address, type: string, source: input, description: "Street address used for area-restriction checks" }
      - { name: postal_code, type: string, source: input, description: "Postal code used for delivery-zone lookup; FK-like reference into AreaRestriction.postal_codes" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Wallet credit in cents; adjusted by refunds, top-ups, invoice settlement. Never negative; a refund that would take it below zero is instead clamped to 0 with the remainder carried as outstanding_refund_cents", default: 0 }
      - { name: outstanding_refund_cents, type: integer, source: computed, description: "Refund amount owed to customer beyond what could be clamped into credit_balance_cents", default: 0 }
      - { name: lifetime_cord_equivalent_delivered, type: number, source: computed, description: "Cumulative cord-equivalent volume delivered (status DELIVERED only). Cord = 1.0; pellet ton = 0.8 cord-equivalent; half-cord = 0.5. Drives loyalty tier", default: 0 }
      - { name: loyalty_tier, type: enum, source: computed, description: "Derived from lifetime_cord_equivalent_delivered: STANDARD (<4), SILVER (>=4 and <10), GOLD (>=10). Recomputed on every delivery and refund", constraints: "STANDARD | SILVER | GOLD" }
      - { name: account_status, type: enum, source: system, description: "Customer account status", constraints: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: suspended_reason, type: string, source: system, description: "Set when account_status transitions to SUSPENDED", default: null }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique SKU code" }
      - { name: product_kind, type: enum, source: input, description: "Primary physical form", constraints: "CORD | HALF_CORD | PELLET_TON | PELLET_BAG" }
      - { name: species, type: enum, source: input, description: "Wood species or pellet blend; for PELLET_* kinds only HARDWOOD_BLEND or SOFTWOOD_BLEND permitted", constraints: "OAK | MAPLE | BIRCH | MIXED_HARDWOOD | HARDWOOD_BLEND | SOFTWOOD_BLEND" }
      - { name: seasoned_grade, type: enum, source: input, description: "Seasoning level — drives price multiplier and moisture eligibility", constraints: "GREEN | SEMI_SEASONED | KILN_DRIED" }
      - { name: base_price_cents, type: integer, source: input, description: "List price per unit (unit = cord, half-cord, ton, or 40-lb bag depending on product_kind)" }
      - { name: moisture_ceiling_pct, type: number, source: input, description: "Maximum permissible moisture percentage at delivery; KILN_DRIED typically 20.0, SEMI_SEASONED 25.0, GREEN 60.0" }
      - { name: available_qty, type: number, source: computed, description: "Stock available for new reservations; decremented by reserve, incremented by release/restock" }
      - { name: reserved_qty, type: number, source: computed, description: "Stock committed to non-terminal orders (state in {PENDING_PAYMENT, CONFIRMED, ROUTED, OUT_FOR_DELIVERY})", default: 0 }
      - { name: discontinued, type: boolean, source: input, description: "If true, cannot be added to new orders", default: false }

  - name: AreaRestriction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Restriction zone name" }
      - { name: postal_codes, type: array, source: input, description: "Array of postal-code strings this restriction covers" }
      - { name: restricted_kinds, type: array, source: input, description: "List of product_kind values banned in this zone (e.g. ['CORD','HALF_CORD'] for no-open-burn zones)" }
      - { name: restricted_species, type: array, source: input, description: "List of species banned in this zone (e.g. emerald-ash-borer quarantine bans movement of non-kiln-dried hardwood across zones)" }
      - { name: enforcement_window_start, type: string, source: input, description: "ISO MM-DD start of enforcement within calendar year, inclusive" }
      - { name: enforcement_window_end, type: string, source: input, description: "ISO MM-DD end of enforcement within calendar year, inclusive; window MAY wrap around year end (e.g. 11-01 through 03-31)" }
      - { name: active, type: boolean, source: input, description: "Soft-toggle; false disables the restriction without deleting it", default: true }

  - name: Subscription
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the winter subscription" }
      - { name: tier, type: enum, source: input, description: "Winter commitment tier", constraints: "HEARTH | HEARTH_PLUS | ESTATE" }
      - { name: season_year, type: integer, source: input, description: "Year in which the winter season starts; season window is Nov 1 of season_year through Mar 31 of season_year+1" }
      - { name: commitment_cord_equivalent, type: number, source: input, description: "Cord-equivalent volume customer commits to take delivery of within the season window; HEARTH=2.0, HEARTH_PLUS=4.0, ESTATE=8.0" }
      - { name: delivered_cord_equivalent, type: number, source: computed, description: "Cord-equivalent volume delivered under this subscription; incremented by ORDER line delivery when Subscription.status == ACTIVE and delivery falls inside the season window", default: 0 }
      - { name: prepaid_cents, type: integer, source: input, description: "Amount prepaid at signup; credited to Customer.credit_balance_cents on activation" }
      - { name: discount_pct, type: number, source: input, description: "Subscription discount on the volume-discounted unit price. HEARTH=0.05, HEARTH_PLUS=0.08, ESTATE=0.12. Applies AFTER volume tier and BEFORE loyalty tier" }
      - { name: stacking_included, type: boolean, source: computed, description: "True iff tier in {HEARTH_PLUS, ESTATE}; when true, stacking_fee_cents on any Order placed while subscription is ACTIVE and inside the season window is forced to 0" }
      - { name: status, type: enum, source: system, description: "Subscription lifecycle", constraints: "PENDING | ACTIVE | FULFILLED | SHORTFALL | CANCELLED | EXPIRED" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp when subscription became ACTIVE", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp when subscription reached a terminal state", default: null }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Unique short code, e.g. NORTH-1" }
      - { name: depot_name, type: string, source: input, description: "Originating depot" }
      - { name: service_postal_prefixes, type: array, source: input, description: "Array of postal-code prefix strings served by this route; matching is longest-prefix-first" }
      - { name: capacity_cord_equivalent, type: number, source: input, description: "Maximum cord-equivalent volume this route can carry per delivery date" }
      - { name: active, type: boolean, source: input, description: "Soft-toggle for route availability", default: true }

  - name: DeliveryWindow
    parent: DeliveryRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id" }
      - { name: service_date, type: string, source: input, description: "ISO YYYY-MM-DD calendar date this window serves" }
      - { name: start_hour, type: integer, source: input, description: "Hour of day [0,23] window start, inclusive" }
      - { name: end_hour, type: integer, source: input, description: "Hour of day [0,23] window end, exclusive; MUST be > start_hour (same-day window only, no overnight wrap)" }
      - { name: capacity_cord_equivalent, type: number, source: input, description: "Maximum cord-equivalent volume that may be scheduled into this specific window; MUST be <= parent DeliveryRoute.capacity_cord_equivalent" }
      - { name: committed_cord_equivalent, type: number, source: computed, description: "Sum of cord-equivalent volume of Orders in this window with fulfillment_status in {SCHEDULED, OUT_FOR_DELIVERY, DELIVERED}", default: 0 }
      - { name: status, type: enum, source: system, description: "Window lifecycle", constraints: "OPEN | CLOSED | LOCKED | CANCELLED" }

  - name: Order
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; optional link used when the order draws against a winter subscription", default: null }
      - { name: delivery_window_id, type: string, source: input, description: "FK -> DeliveryWindow.id; assigned during scheduling" , default: null }
      - { name: delivery_street_address, type: string, source: input, description: "Delivery street; defaults to customer.street_address" }
      - { name: delivery_postal_code, type: string, source: input, description: "Delivery postal code; area restrictions evaluate against this" }
      - { name: requested_delivery_date, type: string, source: input, description: "ISO YYYY-MM-DD requested delivery date; drives seasonal-rate selection" }
      - { name: payment_status, type: enum, source: system, description: "Independent payment axis", constraints: "UNPAID | AUTHORIZED | PAID | PARTIALLY_REFUNDED | REFUNDED | PAYMENT_FAILED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Independent fulfillment axis", constraints: "DRAFT | PENDING_PAYMENT | CONFIRMED | SCHEDULED | OUT_FOR_DELIVERY | DELIVERED | DELIVERY_FAILED | CANCELLED" }
      - { name: stacking_addon, type: boolean, source: input, description: "Whether customer requested stacking service", default: false }
      - { name: stacking_fee_cents, type: integer, source: computed, description: "Computed per stacking calculation; forced to 0 when a qualifying subscription covers it", default: 0 }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of OrderLine.extended_price_cents (pre-add-on, pre-tax)", default: 0 }
      - { name: volume_discount_cents, type: integer, source: computed, description: "Sum of per-line volume discounts applied via tiered pricing", default: 0 }
      - { name: subscription_discount_cents, type: integer, source: computed, description: "Subscription percentage discount applied after volume discount", default: 0 }
      - { name: loyalty_discount_cents, type: integer, source: computed, description: "Loyalty-tier discount applied after subscription discount", default: 0 }
      - { name: seasonal_surcharge_cents, type: integer, source: computed, description: "Winter-peak surcharge computed on (subtotal - volume_discount - subscription_discount - loyalty_discount)", default: 0 }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "Distance/zone fee from rate table", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "Final charge in cents: subtotal - volume_discount - subscription_discount - loyalty_discount + seasonal_surcharge + stacking_fee + delivery_fee; rounded half-up to integer cents at the END only", default: 0 }
      - { name: total_cord_equivalent, type: number, source: computed, description: "Cord-equivalent volume of the order", default: 0 }
      - { name: scheduled_at, type: datetime, source: system, description: "Timestamp when the order entered SCHEDULED", default: null }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp when the order was marked DELIVERED", default: null }
      - { name: cancelled_reason, type: string, source: system, description: "Set when fulfillment transitions to CANCELLED", default: null }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: quantity, type: number, source: input, description: "Units of product. MUST be a positive multiple of 0.5 for CORD and HALF_CORD (HALF_CORD quantity 1.0 == one half-cord unit), positive multiple of 1.0 for PELLET_TON, positive multiple of 1 for PELLET_BAG" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Product.base_price_cents × seasoned-grade multiplier at the time of add" }
      - { name: cord_equivalent_per_unit, type: number, source: computed, description: "CORD=1.0, HALF_CORD=0.5, PELLET_TON=0.8, PELLET_BAG=0.016 (40 lb bag, 50 bags per ton)" }
      - { name: line_cord_equivalent, type: number, source: computed, description: "quantity × cord_equivalent_per_unit" }
      - { name: volume_tier_applied, type: enum, source: computed, description: "Volume tier reached on THIS line after considering order-level cumulative cord_equivalent in line-creation order: T0 (<2.0), T1 (>=2.0 and <4.0), T2 (>=4.0 and <8.0), T3 (>=8.0). Marginal pricing: units straddling a tier boundary are split at the boundary", constraints: "T0 | T1 | T2 | T3" }
      - { name: extended_price_cents, type: integer, source: computed, description: "round_half_up(unit_price_cents × quantity × (1 - marginal_tier_discount_avg)); computed with the straddle-aware marginal algorithm in pricing calculation" }
      - { name: moisture_reading_id, type: string, source: input, description: "FK -> MoistureReading.id recorded at delivery; required to mark order DELIVERED", default: null }

  - name: MoistureReading
    parent: OrderLine
    common_fields: false
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the Driver who recorded this reading" }
      - { name: moisture_pct, type: number, source: input, description: "Measured moisture percentage, one decimal place, range [0.0, 100.0]" }
      - { name: reading_pass, type: boolean, source: computed, description: "moisture_pct <= OrderLine.product.moisture_ceiling_pct" }
      - { name: recorded_at, type: datetime, source: system, description: "Timestamp of measurement" }

  - name: Invoice
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: invoice_number, type: string, source: system, description: "Server-minted INV-<season_year>-<6-digit-seq>" }
      - { name: amount_cents, type: integer, source: computed, description: "Equal to Order.total_cents at issuance; immutable thereafter" }
      - { name: paid_cents, type: integer, source: computed, description: "Cumulative payments applied", default: 0 }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative refunds applied", default: 0 }
      - { name: status, type: enum, source: system, description: "Invoice settlement status", constraints: "OPEN | PARTIALLY_PAID | PAID | REFUNDED | VOID" }
      - { name: due_date, type: string, source: input, description: "ISO YYYY-MM-DD payment due date" }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp of issuance" }
      - { name: settled_at, type: datetime, source: system, description: "Timestamp when status reached PAID or REFUNDED", default: null }

  - name: PaymentEvent
    parent: Invoice
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id" }
      - { name: event_kind, type: enum, source: input, description: "Kind of payment event", constraints: "AUTHORIZE | CAPTURE | REFUND | CHARGEBACK | ADJUST_CREDIT" }
      - { name: amount_cents, type: integer, source: input, description: "Absolute amount of the event in cents; sign implied by event_kind" }
      - { name: external_ref, type: string, source: input, description: "External payment-processor reference; unique per (invoice_id, event_kind, external_ref)" }

# ----------------------------------------------------------------------------
# §1.2 State Machines
# ----------------------------------------------------------------------------
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/v1/customers/{id}/suspend"
        actor: OperationsManager
        preconditions:
          - "Customer.account_status == ACTIVE"
          - "No Order of this Customer has fulfillment_status in {OUT_FOR_DELIVERY} (safety: cannot suspend while a truck is en route)"
        side_effects:
          - "Set suspended_reason from request"
          - "All of this Customer's Subscriptions in PENDING transition to CANCELLED with closed_at set"
          - "Increments Customer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/v1/customers/{id}/reinstate"
        actor: OperationsManager
        preconditions:
          - "Customer.account_status == SUSPENDED"
          - "Customer.outstanding_refund_cents == 0 (must first resolve refunds owed)"
        side_effects:
          - "Clears suspended_reason"
          - "Increments Customer.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/v1/customers/{id}/close"
        actor: OperationsManager
        preconditions:
          - "Customer.account_status == ACTIVE"
          - "Customer has no Order with fulfillment_status in {PENDING_PAYMENT, CONFIRMED, SCHEDULED, OUT_FOR_DELIVERY}"
          - "Customer has no Subscription with status in {PENDING, ACTIVE}"
          - "Customer.outstanding_refund_cents == 0"
        side_effects:
          - "Customer.credit_balance_cents is transferred to outstanding_refund_cents (credit zeroed; refund owed)"
          - "Increments Customer.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/v1/customers/{id}/close"
        actor: OperationsManager
        preconditions:
          - "Customer.account_status == SUSPENDED"
          - "Customer has no Order with fulfillment_status in {PENDING_PAYMENT, CONFIRMED, SCHEDULED, OUT_FOR_DELIVERY}"
          - "Customer.outstanding_refund_cents == 0"
        side_effects:
          - "Customer.credit_balance_cents is transferred to outstanding_refund_cents"
          - "Increments Customer.version by 1"

  - entity: Subscription
    initial_state: PENDING
    terminal_states: [FULFILLED, SHORTFALL, CANCELLED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /api/v1/subscriptions/{id}/activate"
        actor: OperationsManager
        preconditions:
          - "Subscription.status == PENDING"
          - "Customer.account_status == ACTIVE"
          - "Logical clock current date is on or before season_year-11-01 (activation after season start forbidden; retroactive activation would break commitment arithmetic)"
        side_effects:
          - "Customer.credit_balance_cents += Subscription.prepaid_cents"
          - "Set activated_at to current logical time"
          - "Increments Subscription.version by 1 AND increments Customer.version by 1 (credit mutation)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/v1/subscriptions/{id}/cancel (from PENDING)"
        actor: CustomerService
        preconditions:
          - "Subscription.status == PENDING"
        side_effects:
          - "Set closed_at"
          - "No credit movement (prepaid_cents never credited)"
          - "Increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/v1/subscriptions/{id}/cancel (from ACTIVE)"
        actor: CustomerService
        preconditions:
          - "Subscription.status == ACTIVE"
          - "No Order referencing this subscription has fulfillment_status in {SCHEDULED, OUT_FOR_DELIVERY}"
        side_effects:
          - "Compute early-termination clawback per clawback calculation; deduct from Customer.credit_balance_cents (clamp at 0, overflow to outstanding_refund_cents as negative-owed refund — i.e., debit)"
          - "Set closed_at"
          - "Increments Subscription.version by 1 AND increments Customer.version by 1"
      - from: ACTIVE
        to: FULFILLED
        trigger: "System: on Order delivery (see Order OUT_FOR_DELIVERY→DELIVERED), when Subscription.delivered_cord_equivalent >= commitment_cord_equivalent"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE"
          - "delivered_cord_equivalent >= commitment_cord_equivalent after applying this delivery's increment"
        side_effects:
          - "Set closed_at to the triggering delivery timestamp"
          - "Customer.loyalty_tier is recomputed (via lifetime_cord_equivalent_delivered update)"
          - "Increments Subscription.version by 1"
      - from: ACTIVE
        to: SHORTFALL
        trigger: "System: when logical clock crosses Apr 1 00:00:00 of season_year+1 (season end sweep)"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE"
          - "delivered_cord_equivalent < commitment_cord_equivalent at sweep time"
        side_effects:
          - "Compute shortfall penalty per shortfall calculation; invoice via synthetic Invoice on the most recent delivered Order OR (if none) create a zero-order standalone invoice bound to the Customer"
          - "Set closed_at to sweep timestamp"
          - "Increments Subscription.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "System: when logical clock crosses Apr 1 00:00:00 of season_year+1 (season end sweep) AND commitment already met but status was not yet transitioned to FULFILLED (defensive branch — normally unreachable; retained for manual recovery)"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE"
          - "delivered_cord_equivalent >= commitment_cord_equivalent at sweep time"
        side_effects:
          - "Set closed_at"
          - "Increments Subscription.version by 1"

  - entity: DeliveryWindow
    initial_state: OPEN
    terminal_states: [LOCKED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/v1/delivery-windows/{id}/close OR system auto-close when committed_cord_equivalent >= capacity_cord_equivalent"
        actor: RoutePlanner | system
        preconditions:
          - "DeliveryWindow.status == OPEN"
        side_effects:
          - "Prevents further scheduling into the window"
          - "Increments DeliveryWindow.version by 1"
      - from: OPEN
        to: LOCKED
        trigger: "System: when logical clock reaches (service_date - 1 day) 18:00 local — the day-before-cutoff — OR POST /api/v1/delivery-windows/{id}/lock"
        actor: RoutePlanner | system
        preconditions:
          - "DeliveryWindow.status == OPEN"
          - "All Orders in this window with fulfillment_status == SCHEDULED have payment_status == PAID"
        side_effects:
          - "Window locked: Order scheduling into the window rejected with ERR_WINDOW_LOCKED"
          - "Increments DeliveryWindow.version by 1"
      - from: CLOSED
        to: LOCKED
        trigger: "POST /api/v1/delivery-windows/{id}/lock"
        actor: RoutePlanner
        preconditions:
          - "DeliveryWindow.status == CLOSED"
          - "All Orders in this window with fulfillment_status == SCHEDULED have payment_status == PAID"
        side_effects:
          - "Window locked"
          - "Increments DeliveryWindow.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/v1/delivery-windows/{id}/cancel"
        actor: RoutePlanner
        preconditions:
          - "DeliveryWindow.status == OPEN"
          - "No Order in this window has fulfillment_status in {SCHEDULED, OUT_FOR_DELIVERY, DELIVERED}"
        side_effects:
          - "Orders in this window with fulfillment_status == CONFIRMED remain CONFIRMED but their delivery_window_id is cleared to null"
          - "Increments DeliveryWindow.version by 1"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /api/v1/delivery-windows/{id}/cancel"
        actor: RoutePlanner
        preconditions:
          - "DeliveryWindow.status == CLOSED"
          - "No Order in this window has fulfillment_status in {SCHEDULED, OUT_FOR_DELIVERY, DELIVERED}"
        side_effects:
          - "Orders with fulfillment_status == CONFIRMED have delivery_window_id cleared"
          - "Increments DeliveryWindow.version by 1"

  - entity: Order
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      # ---- Fulfillment axis ----
      - from: DRAFT
        to: PENDING_PAYMENT
        trigger: "POST /api/v1/orders/{id}/submit"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status == DRAFT"
          - "Order has at least one OrderLine"
          - "All OrderLine products pass area restriction against delivery_postal_code and requested_delivery_date"
          - "For every OrderLine: Product.discontinued == false"
          - "For every OrderLine: Product.available_qty >= OrderLine.quantity (reservation happens here)"
          - "Customer.account_status == ACTIVE"
          - "If subscription_id is set: Subscription.status == ACTIVE AND requested_delivery_date is inside the subscription's season window"
        side_effects:
          - "For each OrderLine: Product.available_qty -= quantity; Product.reserved_qty += quantity; increments Product.version per line"
          - "Order pricing is recomputed (subtotal, volume_discount, subscription_discount, loyalty_discount, seasonal_surcharge, stacking_fee, delivery_fee, total)"
          - "Increments Order.version by 1"
      - from: PENDING_PAYMENT
        to: CONFIRMED
        trigger: "System: on Invoice.status transitioning OPEN→PAID or PARTIALLY_PAID→PAID for this Order's invoice"
        actor: system
        preconditions:
          - "Order.fulfillment_status == PENDING_PAYMENT"
          - "Order.payment_status == PAID"
        side_effects:
          - "Increments Order.version by 1"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "POST /api/v1/orders/{id}/schedule"
        actor: RoutePlanner
        preconditions:
          - "Order.fulfillment_status == CONFIRMED"
          - "delivery_window_id in request identifies a DeliveryWindow with status == OPEN"
          - "DeliveryWindow.committed_cord_equivalent + Order.total_cord_equivalent <= DeliveryWindow.capacity_cord_equivalent"
          - "Logical clock current time is strictly before the window's day-before-cutoff (service_date - 1 day at 18:00)"
          - "OCC: request expected_order_version must match Order.version"
        side_effects:
          - "Order.delivery_window_id = request.delivery_window_id"
          - "DeliveryWindow.committed_cord_equivalent += Order.total_cord_equivalent; increments DeliveryWindow.version by 1"
          - "Set scheduled_at"
          - "If DeliveryWindow.committed_cord_equivalent >= capacity_cord_equivalent after this add: DeliveryWindow auto-transitions OPEN → CLOSED"
          - "Increments Order.version by 1"
      - from: SCHEDULED
        to: OUT_FOR_DELIVERY
        trigger: "POST /api/v1/orders/{id}/dispatch"
        actor: Driver
        preconditions:
          - "Order.fulfillment_status == SCHEDULED"
          - "DeliveryWindow.status == LOCKED"
          - "Logical clock date == DeliveryWindow.service_date"
          - "Logical clock hour in [DeliveryWindow.start_hour, DeliveryWindow.end_hour)"
        side_effects:
          - "Increments Order.version by 1"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /api/v1/orders/{id}/deliver"
        actor: Driver
        preconditions:
          - "Order.fulfillment_status == OUT_FOR_DELIVERY"
          - "Every OrderLine has a MoistureReading with reading_pass == true recorded within the last 24 logical hours"
        side_effects:
          - "For each OrderLine: Product.reserved_qty -= quantity (stock released from reservation)"
          - "Customer.lifetime_cord_equivalent_delivered += Order.total_cord_equivalent; Customer.loyalty_tier recomputed; increments Customer.version"
          - "If Order.subscription_id set AND Subscription.status == ACTIVE AND delivered_at inside season window: Subscription.delivered_cord_equivalent += Order.total_cord_equivalent; increments Subscription.version. If this crosses commitment_cord_equivalent (>=), Subscription auto-transitions ACTIVE → FULFILLED (chained side effect on Subscription)"
          - "Set delivered_at"
          - "Increments Order.version by 1"
      - from: OUT_FOR_DELIVERY
        to: DELIVERY_FAILED
        trigger: "POST /api/v1/orders/{id}/fail-delivery"
        actor: Driver
        preconditions:
          - "Order.fulfillment_status == OUT_FOR_DELIVERY"
          - "Reason provided (e.g. moisture failure on at least one line, access denied, customer absent)"
        side_effects:
          - "Order.payment_status unchanged"
          - "Product.reserved_qty unchanged (still reserved; order may be rescheduled)"
          - "DeliveryWindow.committed_cord_equivalent -= Order.total_cord_equivalent; increments DeliveryWindow.version"
          - "Increments Order.version by 1"
      - from: DELIVERY_FAILED
        to: SCHEDULED
        trigger: "POST /api/v1/orders/{id}/schedule (reschedule path)"
        actor: RoutePlanner
        preconditions:
          - "Order.fulfillment_status == DELIVERY_FAILED"
          - "New delivery_window_id identifies a DeliveryWindow with status == OPEN"
          - "Capacity and cutoff checks as in CONFIRMED → SCHEDULED"
          - "OCC: request expected_order_version must match Order.version"
        side_effects:
          - "DeliveryWindow.committed_cord_equivalent += Order.total_cord_equivalent; increments DeliveryWindow.version"
          - "Set scheduled_at"
          - "Increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status == DRAFT"
          - "Actor is the owner (X-User-ID == Order.customer_id) OR OperationsManager"
        side_effects:
          - "Set cancelled_reason"
          - "Increments Order.version by 1"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status == PENDING_PAYMENT"
          - "Actor is owner OR OperationsManager"
        side_effects:
          - "For each OrderLine: Product.available_qty += quantity; Product.reserved_qty -= quantity; increments Product.version"
          - "If payment_status == PAID: refund issued via PaymentEvent REFUND and Invoice transitions toward REFUNDED"
          - "Set cancelled_reason"
          - "Increments Order.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status == CONFIRMED"
          - "Actor is owner OR OperationsManager"
        side_effects:
          - "For each OrderLine: Product.available_qty += quantity; Product.reserved_qty -= quantity"
          - "Refund PaymentEvent issued at 100% if paid; Customer.credit_balance_cents += refund (clamped; overflow to outstanding_refund_cents)"
          - "Increments Order.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "Order.fulfillment_status == SCHEDULED"
          - "Actor is owner OR OperationsManager"
          - "Logical clock is strictly before (service_date - 1 day) 18:00 (day-before-cutoff; cannot cancel inside 24-hour lock window as Customer)"
        side_effects:
          - "DeliveryWindow.committed_cord_equivalent -= Order.total_cord_equivalent; if window was CLOSED and now has headroom, window auto-transitions CLOSED → OPEN (conditional re-open)"
          - "Reservation release + refund as in CONFIRMED → CANCELLED"
          - "Cancellation fee per cancellation calculation applies (10% of total_cents if inside 72 hours of service_date, else 0)"
          - "Increments Order.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel (admin override inside cutoff window)"
        actor: OperationsManager
        preconditions:
          - "Order.fulfillment_status == SCHEDULED"
          - "Actor is OperationsManager (Customer cannot cancel inside cutoff)"
        side_effects:
          - "Same side effects as Customer-initiated SCHEDULED → CANCELLED, plus mandatory 10% cancellation fee regardless of timing"
          - "Increments Order.version by 1"
      - from: DELIVERY_FAILED
        to: CANCELLED
        trigger: "POST /api/v1/orders/{id}/cancel"
        actor: OperationsManager
        preconditions:
          - "Order.fulfillment_status == DELIVERY_FAILED"
        side_effects:
          - "Reservation release, refund"
          - "No cancellation fee (delivery already failed once)"
          - "Increments Order.version by 1"
      # ---- Payment axis (independent of fulfillment) ----
      - from: UNPAID
        to: AUTHORIZED
        trigger: "System: POST /api/v1/orders/{id}/payments authorize"
        actor: CustomerService
        preconditions:
          - "Order.payment_status == UNPAID"
          - "Order.fulfillment_status == PENDING_PAYMENT"
        side_effects:
          - "PaymentEvent AUTHORIZE persisted; increments Order.version"
      - from: AUTHORIZED
        to: PAID
        trigger: "System: POST /api/v1/orders/{id}/payments capture (full)"
        actor: CustomerService
        preconditions:
          - "Order.payment_status == AUTHORIZED"
          - "capture amount == Invoice.amount_cents - Invoice.paid_cents"
        side_effects:
          - "Invoice.paid_cents += amount; Invoice status transitions OPEN → PAID if fully paid else PARTIALLY_PAID"
          - "Increments Order.version AND Invoice.version"
      - from: UNPAID
        to: PAYMENT_FAILED
        trigger: "System: POST /api/v1/orders/{id}/payments authorize fails"
        actor: system
        preconditions:
          - "Order.payment_status == UNPAID"
        side_effects:
          - "PaymentEvent with declined outcome persisted"
          - "Increments Order.version"
      - from: PAYMENT_FAILED
        to: UNPAID
        trigger: "POST /api/v1/orders/{id}/payments reset-failure"
        actor: CustomerService
        preconditions:
          - "Order.payment_status == PAYMENT_FAILED"
        side_effects:
          - "Increments Order.version"
      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /api/v1/orders/{id}/payments refund (partial)"
        actor: CustomerService
        preconditions:
          - "Order.payment_status == PAID"
          - "refund amount < Invoice.paid_cents - Invoice.refunded_cents"
        side_effects:
          - "PaymentEvent REFUND persisted; Invoice.refunded_cents += amount; Customer.credit_balance_cents += amount (clamped)"
          - "Increments Order.version AND Invoice.version AND Customer.version"
      - from: PAID
        to: REFUNDED
        trigger: "POST /api/v1/orders/{id}/payments refund (full)"
        actor: CustomerService
        preconditions:
          - "Order.payment_status == PAID"
          - "refund amount == Invoice.paid_cents - Invoice.refunded_cents"
        side_effects:
          - "PaymentEvent REFUND; Invoice transitions to REFUNDED, settled_at set"
          - "Customer.credit_balance_cents += amount (clamped; overflow to outstanding_refund_cents)"
          - "Increments Order.version AND Invoice.version AND Customer.version"
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /api/v1/orders/{id}/payments refund (remaining balance)"
        actor: CustomerService
        preconditions:
          - "Order.payment_status == PARTIALLY_REFUNDED"
          - "refund amount == Invoice.paid_cents - Invoice.refunded_cents (i.e., cumulative refund now equals cumulative paid)"
        side_effects:
          - "Invoice transitions to REFUNDED; settled_at set"
          - "Customer.credit_balance_cents += amount (clamped; overflow to outstanding_refund_cents)"
          - "Increments Order.version AND Invoice.version AND Customer.version"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID, REFUNDED, VOID]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "System: payment capture where paid_cents > 0 and paid_cents < amount_cents"
        actor: system
        preconditions:
          - "Invoice.status == OPEN"
        side_effects:
          - "Increments Invoice.version"
      - from: OPEN
        to: PAID
        trigger: "System: payment capture where paid_cents == amount_cents"
        actor: system
        preconditions:
          - "Invoice.status == OPEN"
        side_effects:
          - "settled_at set"
          - "Cascades Order.fulfillment_status PENDING_PAYMENT → CONFIRMED (via Order payment-axis transition)"
          - "Increments Invoice.version"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "System: payment capture where cumulative paid_cents == amount_cents"
        actor: system
        preconditions:
          - "Invoice.status == PARTIALLY_PAID"
        side_effects:
          - "settled_at set"
          - "Cascades Order.fulfillment_status PENDING_PAYMENT → CONFIRMED"
          - "Increments Invoice.version"
      - from: PAID
        to: REFUNDED
        trigger: "System: refund event where cumulative refunded_cents == paid_cents"
        actor: system
        preconditions:
          - "Invoice.status == PAID"
        side_effects:
          - "settled_at overwritten to refund timestamp"
          - "Increments Invoice.version"
      - from: OPEN
        to: VOID
        trigger: "POST /api/v1/invoices/{id}/void"
        actor: OperationsManager
        preconditions:
          - "Invoice.status == OPEN"
          - "Invoice.paid_cents == 0"
          - "Linked Order.fulfillment_status == CANCELLED"
        side_effects:
          - "Increments Invoice.version"

# ----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: order-schedule-stale-version
    parent_entity: Order
    write_endpoint: "POST /api/v1/orders/{id}/schedule"
    occ_field: expected_order_version
    description: |
      Scheduling an Order into a DeliveryWindow with an expected_order_version
      that does not match the Order's current version is rejected. Captures the
      case where a pricing-relevant mutation (e.g. add-on toggle, line edit,
      subscription attach) advanced Order.version since the client last read it,
      so the schedule would be planned against stale capacity math.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-reschedule-stale-version
    parent_entity: Order
    write_endpoint: "POST /api/v1/orders/{id}/schedule"
    occ_field: expected_order_version
    description: |
      Rescheduling from DELIVERY_FAILED into a new window with an
      expected_order_version that does not match the Order's current version is
      rejected. Captures the case where a refund, cancellation fee application,
      or line edit has advanced Order.version since the client observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: subscription-attach-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /api/v1/subscriptions"
    occ_field: expected_customer_version
    description: |
      Creating a Subscription for a Customer whose version has advanced since
      the client last observed it is rejected. Captures the case where a credit
      adjustment or account-status mutation has invalidated the customer's
      observed state, so subscription activation math would be stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ----------------------------------------------------------------------------
# §1.3 Calculation Rules
# ----------------------------------------------------------------------------
calculations:
  - name: cord_equivalent_conversion
    trigger: "On OrderLine create/update; on Order.total_cord_equivalent recompute"
    algorithm: aggregation
    formula: |
      cord_equivalent_per_unit =
        CORD        -> 1.0
        HALF_CORD   -> 0.5
        PELLET_TON  -> 0.8
        PELLET_BAG  -> 0.016
      line_cord_equivalent = quantity * cord_equivalent_per_unit
      Order.total_cord_equivalent = sum over lines of line_cord_equivalent
    input_set: "All OrderLines of the order in any status"
    constants:
      CORD: 1.0
      HALF_CORD: 0.5
      PELLET_TON: 0.8
      PELLET_BAG: 0.016
    precision: "3 decimal places, round_half_up at line level"

  - name: seasoned_grade_price_multiplier
    trigger: "On OrderLine create; unit_price_cents is computed from Product.base_price_cents"
    algorithm: tiered_pricing
    formula: |
      unit_price_cents = round_half_up(Product.base_price_cents * grade_multiplier)
      grade_multiplier =
        GREEN          -> 0.75
        SEMI_SEASONED  -> 1.00
        KILN_DRIED     -> 1.35
    input_set: "Single OrderLine being priced"
    constants:
      GREEN: 0.75
      SEMI_SEASONED: 1.00
      KILN_DRIED: 1.35
    precision: "0 decimal places (integer cents), round_half_up"

  - name: volume_tiered_discount
    trigger: "On Order pricing recompute; runs after cord_equivalent_conversion and seasoned_grade_price_multiplier"
    algorithm: tiered_pricing
    formula: |
      # Marginal volume pricing: order-level cumulative cord-equivalent determines tier boundaries.
      # Lines are processed in OrderLine.created_at ASC, then line_cord_equivalent DESC on tie
      # (deterministic; uses only common fields and declared fields — no id).
      # Tiers on the ORDER-level cumulative (not per-line):
      #   T0 [0, 2.0)    discount 0%
      #   T1 [2.0, 4.0)  discount 4%
      #   T2 [4.0, 8.0)  discount 7%
      #   T3 [8.0, +inf) discount 11%
      # For each line, allocate its line_cord_equivalent across tiers marginally.
      # If a line straddles a boundary (cumulative_before < boundary <= cumulative_after),
      # the portion below the boundary uses the lower tier rate, portion at-or-above uses the next.
      # For each line:
      #   portions = split line_cord_equivalent across tier boundaries
      #   per-portion: portion_price = unit_price_cents * portion_qty_in_units * (1 - tier_discount)
      #   line.extended_price_cents = round_half_up(sum of portion_price)
      #   (portion_qty_in_units = portion_cord_equivalent / cord_equivalent_per_unit)
      # Order.volume_discount_cents = sum over lines of (unit_price_cents * quantity - extended_price_cents)
    input_set: "All OrderLines of the order, sorted by created_at ASC then line_cord_equivalent DESC"
    constants:
      T1_THRESHOLD: 2.0
      T1_RATE: 0.04
      T2_THRESHOLD: 4.0
      T2_RATE: 0.07
      T3_THRESHOLD: 8.0
      T3_RATE: 0.11
    precision: "integer cents, round_half_up applied ONCE per line (after summing portions); do not round per portion"

  - name: subscription_discount
    trigger: "On Order pricing recompute when Order.subscription_id is set and Subscription.status == ACTIVE and requested_delivery_date is inside season window"
    algorithm: tiered_pricing
    formula: |
      base_after_volume = subtotal_cents - volume_discount_cents
      discount_pct = Subscription.discount_pct  # 0.05 | 0.08 | 0.12 by tier
      subscription_discount_cents = round_half_up(base_after_volume * discount_pct)
      # If subscription is set but INACTIVE or out-of-window, discount_pct := 0
    input_set: "Single Order + linked Subscription"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: loyalty_tier_discount
    trigger: "On Order pricing recompute; runs AFTER subscription_discount"
    algorithm: tiered_pricing
    formula: |
      base_after_subs = subtotal_cents - volume_discount_cents - subscription_discount_cents
      tier_discount =
        STANDARD -> 0.00
        SILVER   -> 0.02
        GOLD     -> 0.04
      loyalty_discount_cents = round_half_up(base_after_subs * tier_discount)
      # Customer.loyalty_tier at time of pricing recompute is the operative value
    input_set: "Single Order + owning Customer"
    constants:
      STANDARD: 0.00
      SILVER: 0.02
      GOLD: 0.04
      SILVER_THRESHOLD_CE: 4.0
      GOLD_THRESHOLD_CE: 10.0
    precision: "integer cents, round_half_up"

  - name: seasonal_surcharge
    trigger: "On Order pricing recompute; runs AFTER loyalty_tier_discount"
    algorithm: threshold
    formula: |
      base_after_all_discounts = subtotal_cents - volume_discount_cents - subscription_discount_cents - loyalty_discount_cents
      # Winter peak window: Dec 15 (inclusive) through Feb 15 (inclusive) of the following year.
      # requested_delivery_date in this window -> surcharge applies.
      # Surcharge rate depends on Customer.loyalty_tier (GOLD waives surcharge):
      #   STANDARD -> 0.12
      #   SILVER   -> 0.08
      #   GOLD     -> 0.00
      if requested_delivery_date in winter_peak_window:
        seasonal_surcharge_cents = round_half_up(base_after_all_discounts * surcharge_rate)
      else:
        seasonal_surcharge_cents = 0
    input_set: "Single Order + owning Customer"
    constants:
      STANDARD_RATE: 0.12
      SILVER_RATE: 0.08
      GOLD_RATE: 0.00
      PEAK_WINDOW_START: "12-15"
      PEAK_WINDOW_END: "02-15"
    precision: "integer cents, round_half_up"

  - name: stacking_fee
    trigger: "On Order pricing recompute"
    algorithm: aggregation
    formula: |
      if Order.stacking_addon == false:
        stacking_fee_cents = 0
      elif Order has qualifying subscription (Subscription.status == ACTIVE
           AND requested_delivery_date in season window
           AND Subscription.stacking_included == true):
        stacking_fee_cents = 0
      else:
        # $35 flat + $12 per cord_equivalent (rounded up to whole cords)
        import math
        stacking_fee_cents = 3500 + round_half_up(math.ceil(Order.total_cord_equivalent) * 1200)
    input_set: "Single Order"
    constants:
      FLAT_FEE_CENTS: 3500
      PER_CORD_CENTS: 1200
    precision: "integer cents"

  - name: delivery_fee
    trigger: "On Order pricing recompute"
    algorithm: threshold
    formula: |
      # Base zone fee by DeliveryRoute.depot_name (chosen at schedule time); pre-schedule use the route
      # whose service_postal_prefixes gives the longest prefix match on delivery_postal_code.
      # Longest-prefix tie: pick the route with smallest capacity_cord_equivalent; further tie:
      # smallest route_code lexicographic. Empty candidate set -> ERR_NO_ROUTE.
      # Base fee by zone classification:
      #   zone A (prefix length >= 5): 4500
      #   zone B (prefix length 3-4):  6500
      #   zone C (prefix length 1-2):  9500
      # Surcharge: total_cord_equivalent > 4.0 adds 1500; total_cord_equivalent > 8.0 adds ANOTHER 1500 (cumulative)
      delivery_fee_cents = base_zone_fee + (1500 if total_ce > 4.0 else 0) + (1500 if total_ce > 8.0 else 0)
    input_set: "Single Order + candidate DeliveryRoutes by postal-prefix match"
    constants:
      ZONE_A_FEE_CENTS: 4500
      ZONE_B_FEE_CENTS: 6500
      ZONE_C_FEE_CENTS: 9500
      BULK_THRESHOLD_1: 4.0
      BULK_THRESHOLD_2: 8.0
      BULK_SURCHARGE_CENTS: 1500
    precision: "integer cents"
    variants:
      - name: provisional
        when: "Order not yet SCHEDULED (no delivery_window_id bound)"
        difference: "Uses longest-prefix route selection as described; if multiple candidate routes match, picks by (smallest capacity, smallest route_code)"
      - name: final
        when: "Order is SCHEDULED or beyond (delivery_window_id is bound)"
        difference: "Uses the route of the bound DeliveryWindow regardless of prefix-match ranking; if the bound route's zone differs from provisional pick, fee MAY diverge"

  - name: order_total
    trigger: "On Order pricing recompute; runs LAST"
    algorithm: aggregation
    formula: |
      total_cents = subtotal_cents
                  - volume_discount_cents
                  - subscription_discount_cents
                  - loyalty_discount_cents
                  + seasonal_surcharge_cents
                  + stacking_fee_cents
                  + delivery_fee_cents
      # All inputs are already integer cents (each rounded half-up at its own stage);
      # no further rounding is applied at this stage.
    input_set: "Single Order after all discount/fee calculations"
    constants: {}
    precision: "integer cents, no rounding (inputs pre-rounded)"

  - name: cancellation_fee
    trigger: "On Order SCHEDULED → CANCELLED transition"
    algorithm: threshold
    formula: |
      hours_until_service = (DeliveryWindow.service_date at start_hour) - current_logical_time, in hours, floor
      if actor_role == OperationsManager:
        cancellation_fee_cents = round_half_up(total_cents * 0.10)   # mandatory
      elif hours_until_service < 72:
        cancellation_fee_cents = round_half_up(total_cents * 0.10)
      else:
        cancellation_fee_cents = 0
      # Cancellation fee is NOT refundable and does NOT credit Customer.credit_balance_cents
    input_set: "Single Order + bound DeliveryWindow"
    constants:
      ADMIN_FEE_RATE: 0.10
      LATE_FEE_RATE: 0.10
      LATE_FEE_THRESHOLD_HOURS: 72
    precision: "integer cents, round_half_up"

  - name: subscription_shortfall_penalty
    trigger: "Season-end sweep on Subscription ACTIVE → SHORTFALL"
    algorithm: aggregation
    formula: |
      shortfall_ce = commitment_cord_equivalent - delivered_cord_equivalent
      # Penalty is 20% of the undelivered commitment's retail value, using the volume-tier T0 rate
      # (no discounts) on the weighted-average unit_price of all KILN_DRIED CORD products
      # referenced by this Customer's DELIVERED orders this season. If no such reference exists,
      # fall back to the highest base_price_cents KILN_DRIED CORD Product in the catalog.
      avg_reference_price_cents = weighted average of unit_price_cents on KILN_DRIED CORD lines this season (weight = quantity)
      if avg_reference_price_cents is null:
        avg_reference_price_cents = max(base_price_cents * 1.35) over KILN_DRIED CORD products
      shortfall_penalty_cents = round_half_up(shortfall_ce * avg_reference_price_cents * 0.20)
    input_set: "Subscription + Customer's seasonal order history + Product catalog"
    constants:
      SHORTFALL_RATE: 0.20
    precision: "integer cents, round_half_up"

  - name: subscription_early_termination_clawback
    trigger: "Subscription ACTIVE → CANCELLED transition"
    algorithm: aggregation
    formula: |
      # Claw back the SUBSCRIPTION discount enjoyed on already-DELIVERED orders this season.
      # Plus a flat $50 administrative fee.
      total_subscription_discount_to_clawback = sum over orders O where
          O.subscription_id == this_subscription.id
          AND O.fulfillment_status == DELIVERED
          of O.subscription_discount_cents
      clawback_cents = total_subscription_discount_to_clawback + 5000
    input_set: "Subscription + its DELIVERED orders this season"
    constants:
      ADMIN_FEE_CENTS: 5000
    precision: "integer cents"
    variants:
      - name: provisional
        when: "Computed at ACTIVE → CANCELLED; only DELIVERED orders count"
        difference: "Sums subscription_discount_cents over DELIVERED orders only; orders in SCHEDULED/CONFIRMED contribute zero to clawback"
      - name: final
        when: "Recomputed if a previously-SCHEDULED order is DELIVERED within 7 logical days of subscription cancellation (audit reconciliation pass)"
        difference: "Includes orders that flipped to DELIVERED in the post-cancellation grace window; the delta is debited as a follow-up PaymentEvent ADJUST_CREDIT"

  - name: moisture_pass_fail
    trigger: "On MoistureReading create"
    algorithm: threshold
    formula: |
      reading_pass = (moisture_pct <= Product.moisture_ceiling_pct)
      # Boundary: moisture_pct exactly == ceiling passes (inclusive <=)
    input_set: "Single MoistureReading + its OrderLine's Product"
    constants: {}
    precision: "1 decimal place"

  - name: invoice_amount_snapshot
    trigger: "On Invoice creation (which happens automatically when Order transitions DRAFT → PENDING_PAYMENT)"
    algorithm: aggregation
    formula: |
      Invoice.amount_cents = Order.total_cents  (snapshot at issuance)
      Invoice.due_date = requested_delivery_date + 7 days
    input_set: "Single Order at PENDING_PAYMENT entry"
    constants:
      DUE_DATE_OFFSET_DAYS: 7
    precision: "integer cents"

# ----------------------------------------------------------------------------
# §1.4 Validation Rules (Ordered by Priority)
# ----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-templated resource ids exist (left-to-right: customer, subscription, route, window, order, line, invoice, payment-event)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced FK ids (product_id, customer_id, subscription_id, delivery_window_id) resolve to existing entities"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "POST/PUT/PATCH endpoints with FK inputs"

  - priority: 5
    category: state
    check: "Target resource's current state permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (submit/schedule/dispatch/deliver/cancel/activate/etc.)"

  - priority: 6
    category: state
    check: "OCC expected_<parent>_version matches parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints listed in §1.2.1 concurrency_rules"

  - priority: 7
    category: business_safety
    check: "MoistureReading acceptance: a Driver may not record a reading for their own previously-failed delivery within 1 logical hour (anti-self-override)"
    error_id: ERR_SELF_OVERRIDE_FORBIDDEN
    http_status: 403
    applies_to: "POST /api/v1/order-lines/{id}/moisture-readings"

  - priority: 8
    category: business_safety
    check: "Account safety: Customer.account_status must be ACTIVE for any state-mutating endpoint invoked by or on behalf of that Customer (place order, schedule, subscription create)"
    error_id: ERR_ACCOUNT_INACTIVE
    http_status: 409
    applies_to: "POST /api/v1/orders, POST /api/v1/subscriptions, POST /api/v1/orders/{id}/submit"

  - priority: 9
    category: business_constraint
    check: "Area restriction: for each OrderLine, (product_kind, species) not banned by any ACTIVE AreaRestriction whose postal_codes contain Order.delivery_postal_code AND whose enforcement window covers Order.requested_delivery_date (window may wrap year-end)"
    error_id: ERR_AREA_RESTRICTED
    http_status: 422
    applies_to: "POST /api/v1/orders, POST /api/v1/orders/{id}/lines, POST /api/v1/orders/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "Product.discontinued == false for new lines"
    error_id: ERR_PRODUCT_DISCONTINUED
    http_status: 422
    applies_to: "POST /api/v1/orders, POST /api/v1/orders/{id}/lines"

  - priority: 11
    category: business_constraint
    check: "Quantity granularity: CORD/HALF_CORD quantity is a positive multiple of 0.5; PELLET_TON multiple of 1.0; PELLET_BAG positive integer"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /api/v1/orders, POST /api/v1/orders/{id}/lines, PATCH /api/v1/order-lines/{id}"

  - priority: 12
    category: business_constraint
    check: "Seasoned grade is one of GREEN | SEMI_SEASONED | KILN_DRIED; PELLET_* kinds must use HARDWOOD_BLEND or SOFTWOOD_BLEND species"
    error_id: ERR_INVALID_PRODUCT_SPEC
    http_status: 422
    applies_to: "POST /api/v1/products, PATCH /api/v1/products/{id}"

  - priority: 13
    category: business_temporal
    check: "Delivery window temporal rules: service_date is not in the past; window end_hour > start_hour; current logical time is before day-before-cutoff (service_date - 1 day at 18:00) for scheduling"
    error_id: ERR_WINDOW_CLOSED_FOR_SCHEDULING
    http_status: 422
    applies_to: "POST /api/v1/delivery-windows, POST /api/v1/orders/{id}/schedule"

  - priority: 14
    category: business_temporal
    check: "Subscription season window: activation at or before Nov 1 of season_year; order's requested_delivery_date in [Nov 1 season_year, Mar 31 season_year+1] for subscription to apply"
    error_id: ERR_SUBSCRIPTION_OUT_OF_SEASON
    http_status: 422
    applies_to: "POST /api/v1/subscriptions/{id}/activate, POST /api/v1/orders (when subscription_id provided)"

  - priority: 15
    category: business_temporal
    check: "DeliveryWindow overlap: same route may not have two windows on the same service_date whose [start_hour, end_hour) intervals overlap (half-open semantics: adjacent windows where one.end_hour == other.start_hour are permitted)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/v1/delivery-windows, PATCH /api/v1/delivery-windows/{id}"

  - priority: 16
    category: business_capacity
    check: "Window capacity: DeliveryWindow.committed_cord_equivalent + Order.total_cord_equivalent <= DeliveryWindow.capacity_cord_equivalent; boundary: equality is PERMITTED (<=)"
    error_id: ERR_WINDOW_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/schedule"

  - priority: 17
    category: business_capacity
    check: "Product stock availability: Product.available_qty >= requested quantity on submit"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/submit"

  - priority: 18
    category: business_capacity
    check: "DeliveryWindow.capacity_cord_equivalent <= DeliveryRoute.capacity_cord_equivalent"
    error_id: ERR_CAPACITY_MISMATCH
    http_status: 422
    applies_to: "POST /api/v1/delivery-windows, PATCH /api/v1/delivery-windows/{id}"

  - priority: 19
    category: business_referential
    check: "Order.cancel: cannot cancel in states {OUT_FOR_DELIVERY, DELIVERED, CANCELLED}"
    error_id: ERR_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /api/v1/orders/{id}/cancel"

  - priority: 20
    category: business_referential
    check: "Subscription ownership: Order.subscription_id must reference a Subscription whose customer_id == Order.customer_id"
    error_id: ERR_SUBSCRIPTION_MISMATCH
    http_status: 422
    applies_to: "POST /api/v1/orders, PATCH /api/v1/orders/{id}"

  - priority: 21
    category: business_referential
    check: "MoistureReading required for every OrderLine before DELIVERED; reading_pass must be true"
    error_id: ERR_MOISTURE_CHECK_FAILED
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/deliver"

  - priority: 22
    category: business_fiscal
    check: "Refund amount: 0 < amount_cents <= Invoice.paid_cents - Invoice.refunded_cents"
    error_id: ERR_INVALID_REFUND_AMOUNT
    http_status: 422
    applies_to: "POST /api/v1/orders/{id}/payments refund"

  - priority: 23
    category: business_fiscal
    check: "Invoice void: only when paid_cents == 0 and Order cancelled"
    error_id: ERR_INVOICE_NOT_VOIDABLE
    http_status: 409
    applies_to: "POST /api/v1/invoices/{id}/void"

  - priority: 24
    category: business_fiscal
    check: "Customer close: outstanding_refund_cents == 0 (must be settled first via adjustment)"
    error_id: ERR_OUTSTANDING_REFUND
    http_status: 409
    applies_to: "POST /api/v1/customers/{id}/close"

# ----------------------------------------------------------------------------
# §1.5 API Endpoints
# ----------------------------------------------------------------------------
endpoints:
  # -- Test-driving endpoints (clock + reconciliation) --
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set the logical clock. Server default on startup is exactly 2026-05-01T00:00:00Z; this endpoint MUST be called before any wall-clock-dependent behavior can be exercised. Role: OperationsManager only."
    roles: [OperationsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Advances logical clock; triggers season-end sweep if crossing Apr 1 boundary (Subscription ACTIVE -> SHORTFALL/EXPIRED)"
      - "Triggers DeliveryWindow OPEN -> LOCKED if crossing day-before-cutoff"

  - method: POST
    path: "/api/v1/_sweep/season_end"
    description: "Manually invoke the season-end sweep for a given season_year; normally fired by clock-crossing but exposed for determinism"
    roles: [OperationsManager]
    code: 200
    input: [season_year]
    output: { transitioned_subscription_ids: array }
    side_effects:
      - "Evaluates all ACTIVE subscriptions for the given season; applies shortfall/expiry transitions and posts shortfall invoices"

  # -- Customer --
  - method: POST
    path: "/api/v1/customers"
    description: "Register a customer"
    roles: [CustomerService, OperationsManager]
    code: 201
    input: [full_name, email, phone, street_address, postal_code]
    output: Customer
    side_effects: ["Initializes credit_balance_cents=0, outstanding_refund_cents=0, lifetime_cord_equivalent_delivered=0, loyalty_tier=STANDARD, account_status=ACTIVE"]

  - method: GET
    path: "/api/v1/customers/{id}"
    description: "Get customer"
    roles: [CustomerService, OperationsManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/api/v1/customers"
    description: "List customers (paginated, filter by email/postal_code/account_status/loyalty_tier)"
    roles: [CustomerService, OperationsManager]
    code: 200
    input: ["email?", "postal_code?", "account_status?", "loyalty_tier?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/api/v1/customers/{id}/suspend"
    description: "Suspend a customer"
    roles: [OperationsManager]
    code: 200
    input: [reason]
    output: Customer
    side_effects: ["Customer ACTIVE->SUSPENDED; PENDING subscriptions cascade to CANCELLED"]

  - method: POST
    path: "/api/v1/customers/{id}/reinstate"
    description: "Reinstate a suspended customer"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer SUSPENDED->ACTIVE"]

  - method: POST
    path: "/api/v1/customers/{id}/close"
    description: "Close customer account"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer -> CLOSED; credit_balance_cents moved to outstanding_refund_cents"]

  - method: POST
    path: "/api/v1/customers/{id}/wallet-adjustments"
    description: "OperationsManager manually adjusts customer credit (e.g., to settle outstanding_refund_cents)"
    roles: [OperationsManager]
    code: 201
    input: [amount_cents, reason]
    output: Customer
    side_effects: ["credit_balance_cents += amount_cents (may be negative to settle outstanding); outstanding_refund_cents adjusted symmetrically; increments Customer.version"]

  # -- Product --
  - method: POST
    path: "/api/v1/products"
    description: "Create product"
    roles: [OperationsManager]
    code: 201
    input: [sku, product_kind, species, seasoned_grade, base_price_cents, moisture_ceiling_pct, available_qty, "discontinued?"]
    output: Product
    side_effects: ["reserved_qty initialized to 0"]

  - method: GET
    path: "/api/v1/products/{id}"
    description: "Get product"
    roles: [CustomerService, OperationsManager, Customer, Driver, RoutePlanner]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/api/v1/products"
    description: "List products"
    roles: [CustomerService, OperationsManager, Customer, Driver, RoutePlanner]
    code: 200
    input: ["product_kind?", "seasoned_grade?", "species?", "discontinued?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: PATCH
    path: "/api/v1/products/{id}"
    description: "Update product (restock, discontinue, price change)"
    roles: [OperationsManager]
    code: 200
    input: ["base_price_cents?", "moisture_ceiling_pct?", "available_qty?", "discontinued?"]
    output: Product
    side_effects: ["Increments Product.version"]

  # -- Area Restriction --
  - method: POST
    path: "/api/v1/area-restrictions"
    description: "Create area restriction"
    roles: [OperationsManager]
    code: 201
    input: [name, postal_codes, restricted_kinds, restricted_species, enforcement_window_start, enforcement_window_end, "active?"]
    output: AreaRestriction
    side_effects: []

  - method: GET
    path: "/api/v1/area-restrictions/{id}"
    description: "Get area restriction"
    roles: [CustomerService, OperationsManager, RoutePlanner]
    code: 200
    input: []
    output: AreaRestriction
    side_effects: []

  - method: GET
    path: "/api/v1/area-restrictions"
    description: "List area restrictions"
    roles: [CustomerService, OperationsManager, RoutePlanner]
    code: 200
    input: ["postal_code?", "active?", "limit?", "offset?"]
    output: AreaRestriction[]
    side_effects: []

  # -- Subscription --
  - method: POST
    path: "/api/v1/subscriptions"
    description: "Create winter subscription (OCC on Customer)"
    roles: [CustomerService, OperationsManager]
    code: 201
    input: [customer_id, tier, season_year, commitment_cord_equivalent, prepaid_cents, discount_pct, expected_customer_version]
    output: Subscription
    side_effects: ["Subscription initialized PENDING; increments Customer.version by 1"]

  - method: GET
    path: "/api/v1/subscriptions/{id}"
    description: "Get subscription"
    roles: [CustomerService, OperationsManager, Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/api/v1/subscriptions"
    description: "List subscriptions (filter by customer_id)"
    roles: [CustomerService, OperationsManager]
    code: 200
    input: ["customer_id?", "status?", "tier?", "season_year?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/api/v1/subscriptions/{id}/activate"
    description: "Activate subscription"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["PENDING->ACTIVE; credits prepaid_cents to Customer.credit_balance_cents"]

  - method: POST
    path: "/api/v1/subscriptions/{id}/cancel"
    description: "Cancel subscription (from PENDING or ACTIVE)"
    roles: [CustomerService, OperationsManager]
    code: 200
    input: [reason]
    output: Subscription
    side_effects: ["Applies clawback if from ACTIVE; sets closed_at"]

  # -- Delivery Route --
  - method: POST
    path: "/api/v1/delivery-routes"
    description: "Create delivery route"
    roles: [RoutePlanner, OperationsManager]
    code: 201
    input: [route_code, depot_name, service_postal_prefixes, capacity_cord_equivalent, "active?"]
    output: DeliveryRoute
    side_effects: []

  - method: GET
    path: "/api/v1/delivery-routes/{id}"
    description: "Get delivery route"
    roles: [RoutePlanner, OperationsManager, CustomerService, Driver]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []

  - method: GET
    path: "/api/v1/delivery-routes"
    description: "List delivery routes"
    roles: [RoutePlanner, OperationsManager, CustomerService, Driver]
    code: 200
    input: ["active?", "postal_code?", "limit?", "offset?"]
    output: DeliveryRoute[]
    side_effects: []

  # -- Delivery Window --
  - method: POST
    path: "/api/v1/delivery-windows"
    description: "Create delivery window on a route"
    roles: [RoutePlanner]
    code: 201
    input: [route_id, service_date, start_hour, end_hour, capacity_cord_equivalent]
    output: DeliveryWindow
    side_effects: ["Window initialized OPEN; committed_cord_equivalent=0"]

  - method: GET
    path: "/api/v1/delivery-windows/{id}"
    description: "Get delivery window"
    roles: [RoutePlanner, OperationsManager, CustomerService, Driver, Customer]
    code: 200
    input: []
    output: DeliveryWindow
    side_effects: []

  - method: GET
    path: "/api/v1/delivery-windows"
    description: "List delivery windows (filter by route_id, service_date, status)"
    roles: [RoutePlanner, OperationsManager, CustomerService, Driver, Customer]
    code: 200
    input: ["route_id?", "service_date?", "status?", "limit?", "offset?"]
    output: DeliveryWindow[]
    side_effects: []

  - method: POST
    path: "/api/v1/delivery-windows/{id}/close"
    description: "Close a window to further scheduling"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: DeliveryWindow
    side_effects: ["OPEN->CLOSED"]

  - method: POST
    path: "/api/v1/delivery-windows/{id}/lock"
    description: "Lock a window (day-before cutoff)"
    roles: [RoutePlanner]
    code: 200
    input: []
    output: DeliveryWindow
    side_effects: ["OPEN/CLOSED->LOCKED"]

  - method: POST
    path: "/api/v1/delivery-windows/{id}/cancel"
    description: "Cancel a window (only when no active orders)"
    roles: [RoutePlanner]
    code: 200
    input: [reason]
    output: DeliveryWindow
    side_effects: ["OPEN/CLOSED->CANCELLED; CONFIRMED orders have delivery_window_id cleared"]

  # -- Order --
  - method: POST
    path: "/api/v1/orders"
    description: "Create order in DRAFT (with initial lines)"
    roles: [Customer, CustomerService]
    code: 201
    input: [customer_id, delivery_street_address, delivery_postal_code, requested_delivery_date, "subscription_id?", "stacking_addon?", lines]
    output: Order
    side_effects: ["Initializes DRAFT + UNPAID; computes initial pricing"]

  - method: GET
    path: "/api/v1/orders/{id}"
    description: "Get order"
    roles: [Customer, CustomerService, OperationsManager, RoutePlanner, Driver]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/api/v1/orders"
    description: "List orders"
    roles: [CustomerService, OperationsManager, RoutePlanner, Driver, Customer]
    code: 200
    input: ["customer_id?", "subscription_id?", "delivery_window_id?", "fulfillment_status?", "payment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/api/v1/orders/{id}/lines"
    description: "Add a line to a DRAFT order"
    roles: [Customer, CustomerService]
    code: 201
    input: [product_id, quantity]
    output: OrderLine
    side_effects: ["Recomputes Order pricing"]

  - method: PATCH
    path: "/api/v1/order-lines/{id}"
    description: "Update an OrderLine (quantity change) in DRAFT order"
    roles: [Customer, CustomerService]
    code: 200
    input: [quantity]
    output: OrderLine
    side_effects: ["Recomputes Order pricing; increments Order.version"]

  - method: DELETE
    path: "/api/v1/order-lines/{id}"
    description: "Delete OrderLine from DRAFT order"
    roles: [Customer, CustomerService]
    code: 204
    input: []
    output: null
    side_effects: ["Recomputes Order pricing; increments Order.version"]

  - method: POST
    path: "/api/v1/orders/{id}/submit"
    description: "Submit DRAFT order -> PENDING_PAYMENT; reserves stock; issues Invoice"
    roles: [Customer, CustomerService]
    code: 200
    input: []
    output: Order
    side_effects: ["DRAFT->PENDING_PAYMENT; per-line stock reservation; Invoice created (status OPEN, amount=Order.total_cents)"]

  - method: POST
    path: "/api/v1/orders/{id}/schedule"
    description: "Schedule CONFIRMED order (or reschedule DELIVERY_FAILED) into a DeliveryWindow (OCC on Order)"
    roles: [RoutePlanner]
    code: 200
    input: [delivery_window_id, expected_order_version]
    output: Order
    side_effects: ["CONFIRMED->SCHEDULED or DELIVERY_FAILED->SCHEDULED; DeliveryWindow.committed_cord_equivalent += order.total_cord_equivalent; may auto-close window; increments Order.version"]

  - method: POST
    path: "/api/v1/orders/{id}/dispatch"
    description: "Mark SCHEDULED order OUT_FOR_DELIVERY"
    roles: [Driver]
    code: 200
    input: []
    output: Order
    side_effects: ["SCHEDULED->OUT_FOR_DELIVERY; requires window LOCKED and current time within window hours"]

  - method: POST
    path: "/api/v1/orders/{id}/deliver"
    description: "Mark OUT_FOR_DELIVERY order DELIVERED; requires all lines have passing moisture readings"
    roles: [Driver]
    code: 200
    input: []
    output: Order
    side_effects: ["OUT_FOR_DELIVERY->DELIVERED; releases reserved stock; increments Customer lifetime CE; may transition Subscription to FULFILLED"]

  - method: POST
    path: "/api/v1/orders/{id}/fail-delivery"
    description: "Mark OUT_FOR_DELIVERY order DELIVERY_FAILED"
    roles: [Driver]
    code: 200
    input: [reason]
    output: Order
    side_effects: ["OUT_FOR_DELIVERY->DELIVERY_FAILED; releases window capacity"]

  - method: POST
    path: "/api/v1/orders/{id}/cancel"
    description: "Cancel an order"
    roles: [Customer, CustomerService, OperationsManager]
    code: 200
    input: [reason]
    output: Order
    side_effects: ["Multiple from-states permitted; releases stock reservation; may issue refund; may apply cancellation fee"]

  # -- Moisture Reading --
  - method: POST
    path: "/api/v1/order-lines/{id}/moisture-readings"
    description: "Record a moisture reading on an order line"
    roles: [Driver]
    code: 201
    input: [moisture_pct]
    output: MoistureReading
    side_effects: ["reading_pass computed; appends MoistureReading"]

  - method: GET
    path: "/api/v1/order-lines/{id}/moisture-readings"
    description: "List moisture readings for an order line"
    roles: [Driver, CustomerService, OperationsManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: MoistureReading[]
    side_effects: []

  # -- Invoice --
  - method: GET
    path: "/api/v1/invoices/{id}"
    description: "Get invoice"
    roles: [CustomerService, OperationsManager, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/api/v1/invoices"
    description: "List invoices"
    roles: [CustomerService, OperationsManager]
    code: 200
    input: ["order_id?", "status?", "customer_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/api/v1/invoices/{id}/void"
    description: "Void an unpaid invoice on a cancelled order"
    roles: [OperationsManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["OPEN->VOID"]

  # -- Payment --
  - method: POST
    path: "/api/v1/orders/{id}/payments"
    description: "Post a payment event against the order's invoice (authorize, capture, refund, chargeback, adjust-credit)"
    roles: [CustomerService, OperationsManager]
    code: 201
    input: [event_kind, amount_cents, external_ref]
    output: PaymentEvent
    side_effects: ["Payment-axis transitions on Order + Invoice; Customer.credit_balance_cents updated for REFUND/CHARGEBACK/ADJUST_CREDIT"]

  - method: GET
    path: "/api/v1/invoices/{id}/payment-events"
    description: "List payment events for an invoice"
    roles: [CustomerService, OperationsManager]
    code: 200
    input: ["event_kind?", "limit?", "offset?"]
    output: PaymentEvent[]
    side_effects: []

  # -- OrderLine read (needed for FK reverse-reachability) --
  - method: GET
    path: "/api/v1/order-lines/{id}"
    description: "Get order line"
    roles: [Customer, CustomerService, OperationsManager, Driver, RoutePlanner]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/api/v1/orders/{id}/lines"
    description: "List order lines of an order"
    roles: [Customer, CustomerService, OperationsManager, Driver, RoutePlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/api/v1/order-lines"
    description: "Filtered list of order lines across orders (FK reverse-reachability for product_id and moisture_reading_id)"
    roles: [CustomerService, OperationsManager, RoutePlanner]
    code: 200
    input: ["product_id?", "moisture_reading_id?", "order_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

# ----------------------------------------------------------------------------
# §1.6 Error Catalog
# ----------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated resource id does not exist" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 404, condition: "Body-referenced FK id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current state does not permit requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version mismatch" }
  - { id: ERR_SELF_OVERRIDE_FORBIDDEN, http: 403, condition: "Driver attempting to record moisture reading to override own recent failure" }
  - { id: ERR_ACCOUNT_INACTIVE, http: 409, condition: "Customer.account_status != ACTIVE for state-mutating operation" }
  - { id: ERR_AREA_RESTRICTED, http: 422, condition: "Product kind/species banned in delivery postal zone during enforcement window" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 422, condition: "Product.discontinued == true on add" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "Quantity violates per-kind granularity rule" }
  - { id: ERR_INVALID_PRODUCT_SPEC, http: 422, condition: "Invalid seasoned_grade or species for product_kind" }
  - { id: ERR_WINDOW_CLOSED_FOR_SCHEDULING, http: 422, condition: "Window not OPEN, or past cutoff, or in the past" }
  - { id: ERR_SUBSCRIPTION_OUT_OF_SEASON, http: 422, condition: "Activation past season start OR delivery outside season window" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Same route same date has overlapping hour-interval" }
  - { id: ERR_WINDOW_CAPACITY_EXCEEDED, http: 422, condition: "Adding order would exceed window capacity" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "Product.available_qty < requested quantity at submit" }
  - { id: ERR_CAPACITY_MISMATCH, http: 422, condition: "Window capacity exceeds parent route capacity" }
  - { id: ERR_NOT_CANCELLABLE, http: 409, condition: "Order in OUT_FOR_DELIVERY / DELIVERED / CANCELLED cannot be cancelled" }
  - { id: ERR_SUBSCRIPTION_MISMATCH, http: 422, condition: "Order.subscription_id belongs to a different customer" }
  - { id: ERR_MOISTURE_CHECK_FAILED, http: 422, condition: "Missing or failed moisture reading on at least one line at deliver" }
  - { id: ERR_INVALID_REFUND_AMOUNT, http: 422, condition: "Refund amount out of range" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "Invoice has paid_cents > 0 or order not cancelled" }
  - { id: ERR_OUTSTANDING_REFUND, http: 409, condition: "Customer close with outstanding_refund_cents > 0" }
  - { id: ERR_NO_ROUTE, http: 422, condition: "No active route matches delivery postal prefix (delivery fee cannot be computed)" }
  - { id: ERR_SUBSCRIPTION_ACTIVE_EXISTS, http: 409, condition: "Customer already has an ACTIVE subscription for the same season_year" }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic field-level validation failure (missing required field, malformed value)" }

# ----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ----------------------------------------------------------------------------
roles:
  - name: Customer
    description: "End user placing firewood/bulk-fuel orders"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/v1/orders (as owner)"
      - "POST /api/v1/orders/{id}/submit (as owner)"
      - "POST /api/v1/orders/{id}/cancel from DRAFT/PENDING_PAYMENT/CONFIRMED/SCHEDULED (as owner)"
    shared_operations:
      - "GET /api/v1/orders/{id} (own orders only)"
      - "GET /api/v1/customers/{id} (own record only)"
      - "GET /api/v1/delivery-windows (read)"
      - "GET /api/v1/products (read)"
      - "POST /api/v1/orders/{id}/lines (own DRAFT orders)"
      - "PATCH /api/v1/order-lines/{id} (own DRAFT orders)"
      - "DELETE /api/v1/order-lines/{id} (own DRAFT orders)"

  - name: CustomerService
    description: "Back-office agent helping customers; can create orders/subscriptions on their behalf and process payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/orders/{id}/payments"
      - "POST /api/v1/subscriptions/{id}/cancel"
      - "POST /api/v1/orders/{id}/payments reset-failure"
    shared_operations:
      - "POST /api/v1/customers"
      - "POST /api/v1/orders (on behalf of customer)"
      - "POST /api/v1/subscriptions"
      - "GET reads across most entities"

  - name: OperationsManager
    description: "Operations administrator with override powers"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/customers/{id}/suspend|reinstate|close"
      - "POST /api/v1/customers/{id}/wallet-adjustments"
      - "POST /api/v1/products (create)"
      - "PATCH /api/v1/products/{id}"
      - "POST /api/v1/area-restrictions"
      - "POST /api/v1/subscriptions/{id}/activate"
      - "POST /api/v1/invoices/{id}/void"
      - "POST /api/v1/_clock/set_current_utc"
      - "POST /api/v1/_sweep/season_end"
      - "POST /api/v1/orders/{id}/cancel (override in any non-terminal state)"
    shared_operations:
      - "All CustomerService and RoutePlanner operations (hierarchical override)"
      - "GET reads across all entities"

  - name: RoutePlanner
    description: "Plans delivery routes and schedules orders into windows"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/delivery-routes"
      - "POST /api/v1/delivery-windows"
      - "POST /api/v1/delivery-windows/{id}/close|lock|cancel"
      - "POST /api/v1/orders/{id}/schedule"
    shared_operations:
      - "GET reads on orders, windows, routes, products"

  - name: Driver
    description: "Delivery driver executing routes"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/v1/orders/{id}/dispatch"
      - "POST /api/v1/orders/{id}/deliver"
      - "POST /api/v1/orders/{id}/fail-delivery"
      - "POST /api/v1/order-lines/{id}/moisture-readings"
    shared_operations:
      - "GET reads on orders, routes, windows, products, order lines"
