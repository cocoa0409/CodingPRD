            - "submit returns error_id == ERR_ORDER_INVALID_STATE (priority 5 state) — NOT ERR_POSTURE_NOT_ORDERABLE (priority 6 business_safety)"

      - name: submit_past_month_over_capacity_temporal_wins
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - calculations.order_capacity_gate
        distinguishing_aspect: |
          Category pair business_temporal-vs-business_fiscal (distinct from state-vs-safety): the order
          month 2026-04 is in the past at submit time AND 500 units exceed the 400-unit storage cap;
          the temporal error ERR_ORDER_MONTH_IN_PAST (priority 7) must win over
          ERR_STORAGE_CAPACITY_EXCEEDED (priority 10).
