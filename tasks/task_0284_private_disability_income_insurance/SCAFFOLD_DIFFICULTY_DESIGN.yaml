      - name: benefit_accrual_blocked_by_claim_not_approved
        grounds:
          - validations[priority=10]
          - state_machines.BenefitPeriod.transitions.ACCRUED_to_REVERSED
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Different entity pair BenefitPeriod->Claim: accruing a BenefitPeriod requires the parent Claim
          to be APPROVED; a SUBMITTED (not-yet-approved) claim rejects accrual with ERR_CLAIM_NOT_PAYABLE.
          Distinct pair from Claim->Policy above.
        test_recipe:
          setup:
