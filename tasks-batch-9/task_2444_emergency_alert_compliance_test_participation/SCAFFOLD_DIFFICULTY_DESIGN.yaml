  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: alert_relay_and_accessibility_dimensions_advance_independently
        grounds:
          - "§1.0 complexity_profile.state_machine_shape: parallel"
          - "§1.2 state_machines.AlertEvent — two dimensions (relay_state, accessibility_state) that 'advance without constraining each other'"
          - "§1.5 POST /alert-events/{id}/verify-accessibility side effect 'relay_state untouched' and POST /alert-events/{id}/confirm-relay side effect 'accessibility_state untouched'"
          - "§1.6 ERR_ACCESSIBILITY_ALREADY_VERIFIED (409)"
        distinguishing_aspect: "The alert is driven along the accessibility axis first (UNVERIFIED -> PASSED) while relay_state stays RELAY_PENDING, then along the relay axis (RELAY_PENDING -> RELAYED) while accessibility_state stays PASSED — so neither dimension is a precondition of the other, and each dimension keeps its own exhaustion rule (a second verify-accessibility is a 409 even though the relay axis just moved)."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated with mandatory_relay_event_codes empty; one ACTIVE county-scoped MANDATORY relay rule for TOR over FIPS 20173, priority 10."
            - "Station KWEA registered; one alert TOR / KSPAR-0001 / FIPS 20173 received at the default clock 2026-08-01T00:00:00Z, which the selector matches so relay_state starts at RELAY_PENDING and accessibility_state at ACCESSIBILITY_UNVERIFIED."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: ["20173"], relay_class: "MANDATORY", priority: 10, forward_delay_seconds: 30 }
              captures: { rr_county: "$.data.id" }
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSPAR-0001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_id: "$.data.id" }
          trigger:
            - call: "POST /alert-events/${alert_id}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 60, audio_loudness_lufs: -26.0, caption_interaction: "NONE" }
            - call: "GET /alert-events/${alert_id}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "POST /alert-events/${alert_id}/confirm-relay"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /alert-events/${alert_id}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 120, audio_loudness_lufs: -24.0, caption_interaction: "NONE" }
              captures: { err: "$.data.error_id" }
          assert:
            - "on create: relay_state == RELAY_PENDING, matched_relay_rule_id == ${rr_county}, relay_class_applied == MANDATORY, forward_delay_seconds_applied == 30, accessibility_state == ACCESSIBILITY_UNVERIFIED"
            - "after verify-accessibility: crawl_shortfall_seconds = max(0, 60 - 60) = 0 and loudness_excess_lu = max(0.0, abs(-26.0 - -24.0) - 2.0) = 0.0, so accessibility_deficiency_points == 0.00"
            - "accessibility_state == ACCESSIBILITY_PASSED (0.00 <= 1.00) while the intervening GET shows relay_state STILL == RELAY_PENDING — the accessibility move did not touch the relay axis"
            - "after confirm-relay: relay_state == RELAYED and accessibility_state is STILL ACCESSIBILITY_PASSED with accessibility_deficiency_points 0.00 unchanged"
            - "the second verify-accessibility returns ${err} == 'ERR_ACCESSIBILITY_ALREADY_VERIFIED' with HTTP 409, and visual_crawl_seconds remains 60 / audio_loudness_lufs remains -26.0 (the rejected 120 / -24.0 measurements are not written)"
            - "RECEIVED is never observable on either read: POST /alert-events already resolves relay_state inside the same request"

      - name: outage_repair_cycle_reenters_repair_and_recomputes_from_original_detected_at
        grounds:
          - "§1.2 state_machines.EquipmentOutage: {OPEN, VERIFICATION_FAILED} -> REPAIR_IN_PROGRESS, REPAIR_IN_PROGRESS -> RESTORED, RESTORED -> VERIFICATION_FAILED, RESTORED -> CLOSED"
          - "§1.5 POST /equipment-outages/{id}/start-repair side effect 'repair_cycle_count += 1 only when entering from VERIFICATION_FAILED'"
          - "§1.5 POST /equipment-outages/{id}/fail-verification side effect 'restored_at and both downtime figures cleared to null', 'device stays FAILED'"
          - "§1.3 calculations.outage_downtime_hours"
        distinguishing_aspect: "The outage is cyclic, not linear: it revisits REPAIR_IN_PROGRESS via VERIFICATION_FAILED, and the counter only increments on that back-edge (0 after the first start-repair, 1 after the second), while the second restore recomputes both downtime figures from the ORIGINAL detected_at rather than from the latest repair_started_at — 120.00 h / 60.00 h instead of the 36.00 h / 12.00 h a repair-relative clock would report."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated; station KWEA; device dev1 registered and readiness-checked to READY."
            - "Clock 2026-08-03T08:00:00Z; outage filed with detected_at 2026-08-03T08:00:00Z (device -> FAILED); start-repair leaves repair_cycle_count at 0."
            - "Clock 2026-08-06T20:00:00Z; first restore writes 84.00 / 48.00; ComplianceAdmin rejects it with fail-verification, which nulls restored_at and both figures; clock 2026-08-08T08:00:00Z before the second cycle's restore."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
            - call: "POST /equipment-outages"
              as: StationEngineer
              as_user_id: eng-1
              payload: { device_id: "${dev1}", detected_at: "2026-08-03T08:00:00Z", failure_summary: "encoder audio card intermittent" }
              captures: { outage_id: "$.data.id" }
            - call: "POST /equipment-outages/${outage_id}/start-repair"
              as: StationEngineer
