            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects/${pa_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_expired: $.data.error_id }
            - call: "GET /signal-ops/retiming-projects/${pa_id}"
              payload: {}
