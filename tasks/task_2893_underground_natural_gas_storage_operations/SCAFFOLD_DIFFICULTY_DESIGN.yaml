# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 2893
# Underground Natural Gas Storage Operations.
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in an `assert:` line was produced by executing the
# relevant §1.3 formula against its `constants:` (see workspace/.scratch/compute5.py).
#
# Two field fixtures recur:
#   F_STD   total 10,000,000 / cushion 2,000,000 -> max_working 8,000,000,
#           opening 3,000,000 -> inventory_pct 37.50, TIER_2, pressure 1325 psig,
#           curve points (0,0,400000) (25,150000,350000) (50,300000,250000)
#           (75,450000,150000) (100,600000,0).
#   F_BOUND total 1,000,000 / cushion 900,000 -> max_working 100,000, opening 0,
#           curve points (0,0,120000) (25,30000,100000) (50,60000,80000)
#           (75,90000,60000) (100,120000,0).
# The logical clock starts at 2026-08-01T00:00:00Z in every instance; a call to
# POST /_clock/set_current_utc appears only where the scenario needs time to move.

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deliverability_curve_interpolated_vs_tier_floor_on_identical_field_state
        grounds:
          - calculations.deliverability_rates
          - entities.StorageField.fields.deliverability_method
          - entities.StorageField.fields.max_withdrawal_rate_dth_per_day
          - entities.StorageField.fields.max_injection_rate_dth_per_day
        distinguishing_aspect: |
          Two StorageFields created with byte-identical capacity, cushion, opening working gas and
          deliverability_curve differ only in deliverability_method, and the same inventory_pct of
          37.50 yields withdrawal 225000 / injection 300000 under CURVE_INTERPOLATED but
          withdrawal 150000 / injection 350000 under TIER_FLOOR — a 75000 Dth withdrawal delta and
          a 50000 Dth injection delta in the opposite direction, while inventory_pct, current_pressure_psig
          and deliverability_tier are identical on both rows.
        test_recipe:
          setup:
            - "Two storage fields with identical geometry and identical opening working gas of 3,000,000 Dth (37.50% of the 8,000,000 Dth working-gas ceiling)."
            - "Each field carries one INJECTION_WITHDRAWAL well rated 600000 Dth/day so the well-capacity cap never binds."
            - "Field A evaluates the curve with CURVE_INTERPOLATED, field B with TIER_FLOOR."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome A", field_code: "F-AUR-A", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fa: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fa}", well_name: "AUR-A-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wa: $.data.id }
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome B", field_code: "F-AUR-B", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "TIER_FLOOR", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { fb: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${fb}", well_name: "AUR-B-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wb: $.data.id }
          trigger:
            - call: "GET /storage-fields/${fa}"
              payload: {}
              as: FieldOperator
            - call: "GET /storage-fields/${fb}"
              payload: {}
              as: FieldOperator
          assert:
            - "StorageField.${fa}.inventory_pct == 37.50 and StorageField.${fb}.inventory_pct == 37.50"
            - "StorageField.${fa}.deliverability_tier == TIER_2 and StorageField.${fb}.deliverability_tier == TIER_2"
            - "StorageField.${fa}.current_pressure_psig == 1325 and StorageField.${fb}.current_pressure_psig == 1325"
            - "StorageField.${fa}.max_withdrawal_rate_dth_per_day == 225000"
            - "StorageField.${fa}.max_injection_rate_dth_per_day == 300000"
            - "StorageField.${fb}.max_withdrawal_rate_dth_per_day == 150000"
            - "StorageField.${fb}.max_injection_rate_dth_per_day == 350000"
            - "StorageField.${fa}.max_withdrawal_rate_dth_per_day - StorageField.${fb}.max_withdrawal_rate_dth_per_day == 75000"
            - "StorageField.${fb}.max_injection_rate_dth_per_day - StorageField.${fa}.max_injection_rate_dth_per_day == 50000"
            - "StorageField.${fa}.wells_in_service_count == 1 and StorageField.${fb}.wells_in_service_count == 1"
            - "StorageField.${fa}.field_posture == OPEN and StorageField.${fb}.field_posture == OPEN"

      - name: cash_out_monthly_aggregate_vs_daily_ratchet_over_identical_imbalance_ledger
        grounds:
          - calculations.imbalance_cash_out
          - entities.StorageContract.fields.cash_out_method
          - entities.StorageContract.fields.cash_out_amount_usd
          - entities.ImbalanceLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Two contracts of the same shipper on the same field accumulate byte-identical DAILY_IMBALANCE
          ledgers (-12345, -9865, +3210 Dth against 80000 Dth scheduled on each of 2026-08-05..07);
          MONTHLY_AGGREGATE nets the period first and assesses 61237.50 USD at multiplier 1.25, while
          DAILY_RATCHET prices each day and assesses 103931.26 USD (55605.38 + 42771.38 + 5554.50) —
          the offsetting +3210 day cancels 3210 Dth of exposure under MONTHLY_AGGREGATE but adds a
          separately-billed 1610 Dth under DAILY_RATCHET, and the pinned round-per-day-then-sum order
          makes the ratchet total one cent higher than the forbidden sum-then-round total of 103931.25.
        test_recipe:
          setup:
            - "Field F_STD with one well rated 600000 Dth/day; season INJECTION."
            - "One shipper with a 500000.00 USD penalty threshold, so no credit suspension can fire."
            - "Contract CD (MONTHLY_AGGREGATE) and contract CE (DAILY_RATCHET), both FIRM, both index_price 3.4500, both ACTIVE."
            - "On each of 2026-08-05, 2026-08-06 and 2026-08-07 each contract has a CONFIRMED nomination of 80000 Dth INJECTION and one CONFIRMED ticket metering 67655, 70135 and 83210 Dth respectively."
            - "Each contract therefore holds DAILY_IMBALANCE entries of -12345.000, -9865.000 and +3210.000 Dth and imbalance_dth == -19000.000."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
