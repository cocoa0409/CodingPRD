# =============================================================================
# Crawlspace Encapsulation & Basement Waterproofing — Seed Tables (v1)
# =============================================================================

scenario: |
  657. Crawlspace Encapsulation & Basement Waterproofing: free inspection & moisture/structural
  assessment, scope (vapor barrier/sump/dehumidifier/drain) & quote, financing, crew & install
  scheduling, sump/pump & battery backup, transferable warranty & annual service, callback/claim,
  foundation referral

domain_name: crawlspace-waterproofing
api_prefix: ""   # flat topology: peer resource collections (/jobs, /quotes, /inspections, ...) with FK references, no single nesting root

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: flat
  # Job is a central hub; Inspection, Quote, FinancingApplication, InstallOrder, CrewBooking,
  # Warranty, ServiceVisit, Claim, FoundationReferral are peer entities linked by FK to Job
  # (and to each other), with no nested URL ownership chain beyond /jobs/{id}.

  state_machine_shape: parallel
  # Job carries two independent dimensions: lifecycle_status × financing_status.
  # Quote has a cyclic revision loop; Claim has a reopen cycle; InstallOrder branches PASS/FAIL.

  relationship_patterns:
    - one_to_many        # Job -> many Quotes (revisions), many ServiceVisits, many Claims
    - cross_aggregate    # CrewBooking references InstallOrder; Warranty references InstallOrder & Job

  role_model: peer_roles
  # Homeowner (entity_backed), Inspector / Estimator / Scheduler / WarrantyAdmin (opaque ops roles),
  # FinancePartner (opaque external decisioning).

  consistency_model: immediate

# =============================================================================
# System Constants (referenced by §1.2 state machines and §1.4 validations)
# =============================================================================
system_constants:
  MAX_TRANSFERS: 3              # Warranty.transfer_count ceiling
  SERVICE_GRACE_DAYS: 30        # grace past next_service_due before annual-service lapse is allowed
  MIN_VISIT_GAP_DAYS: 7         # minimum buffer between two SCHEDULED ServiceVisits on the same warranty
  CLOCK_DEFAULT_UTC: "2026-04-01T00:00:00Z"  # logical clock startup default
  QUOTE_VALIDITY_DAYS: 30       # SENT quote expires_at = created_at + this

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: homeowner_id, type: string, source: input, description: "FK -> Homeowner.id; the property owner who requested service" }
      - { name: property_address, type: string, source: input, description: "Street address of the property" }
      - { name: structure_type, type: enum, source: input, description: "CRAWLSPACE | BASEMENT | COMBINED", constraints: "one of CRAWLSPACE, BASEMENT, COMBINED" }
      - { name: footprint_sqft, type: integer, source: input, description: "Conditioned footprint square footage used in pricing", constraints: ">= 1" }
      - { name: lifecycle_status, type: enum, source: system, description: "LEAD | INSPECTED | QUOTED | SOLD | SCHEDULED | INSTALLED | WARRANTED | CLOSED | LOST", default: "LEAD", constraints: "see Job lifecycle state machine" }
      - { name: financing_status, type: enum, source: system, description: "NONE | APPLIED | APPROVED | DECLINED | CASH", default: "NONE", constraints: "see Job financing state machine; evolves independently of lifecycle_status" }
      - { name: accepted_quote_id, type: string, source: system, description: "Forward pointer to the ACCEPTED Quote.id (null until SOLD); reverse lookup is Quote.job_id, see GET /jobs/{job_id}/quotes" }
      - { name: install_order_id, type: string, source: system, description: "Forward pointer to the active InstallOrder.id (null until scheduled); reverse lookup is InstallOrder.job_id, see GET /jobs/{job_id}/install-orders" }
      - { name: assessment_severity, type: enum, source: computed, description: "NONE | LOW | MODERATE | SEVERE; copied from the latest FINALIZED Inspection's computed severity, NONE before any inspection" }
      - { name: open_claim_count, type: integer, source: computed, description: "Count of Claims on this Job whose status IN {OPEN, IN_PROGRESS}", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: Homeowner
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Owner name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: credit_band, type: enum, source: input, description: "PRIME | NEAR_PRIME | SUBPRIME; drives financing APR tier", constraints: "one of PRIME, NEAR_PRIME, SUBPRIME" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the inspected job" }
      - { name: moisture_pct, type: number, source: input, description: "Measured ambient moisture percentage, recorded at finalize", constraints: "0..100" }
      - { name: structural_findings_count, type: integer, source: input, description: "Count of distinct structural defects observed", constraints: ">= 0" }
      - { name: standing_water, type: boolean, source: input, description: "Whether standing water was observed", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED", default: "DRAFT", constraints: "see Inspection state machine" }
      - { name: severity, type: enum, source: computed, description: "NONE | LOW | MODERATE | SEVERE; computed at finalize from moisture/structural/standing_water" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the quoted job" }
      - { name: revision, type: integer, source: system, description: "1-based revision index; increments per superseding Quote on the same Job", default: 1 }
      - { name: includes_vapor_barrier, type: boolean, source: input, description: "Scope: vapor barrier line item included", default: false }
      - { name: includes_sump, type: boolean, source: input, description: "Scope: sump pit + primary pump included", default: false }
      - { name: includes_dehumidifier, type: boolean, source: input, description: "Scope: dehumidifier included", default: false }
      - { name: includes_drain, type: boolean, source: input, description: "Scope: interior drain (linear feet) included", default: false }
      - { name: includes_battery_backup, type: boolean, source: input, description: "Scope: battery backup pump add-on; requires includes_sump", default: false }
      - { name: drain_linear_ft, type: integer, source: input, description: "Linear feet of interior drain, used only when includes_drain", default: 0, constraints: ">= 0" }
      - { name: discount_code, type: string, source: input, description: "Optional promotional code: SPRING10 | SENIOR15 | NONE", default: "NONE" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of selected line items before discount/tax" }
      - { name: discount_cents, type: integer, source: computed, description: "Promotional discount applied to subtotal" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on the discounted subtotal" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal - discount + tax, the quoted price" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACCEPTED | REVISED | EXPIRED | DECLINED", default: "DRAFT", constraints: "see Quote state machine" }
      - { name: expires_at, type: datetime, source: system, description: "Set to created_at + 30 days when SENT; quote EXPIRED past this instant" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: FinancingApplication
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the financed job" }
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the accepted Quote being financed" }
      - { name: term_months, type: integer, source: input, description: "Loan term in months", constraints: "one of 12, 24, 36, 60" }
      - { name: amount_financed_cents, type: integer, source: system, description: "Pinned to the accepted Quote.total_cents at application time" }
      - { name: apr_bps, type: integer, source: computed, description: "Annual percentage rate in basis points, from credit_band + term tier" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Amortized monthly payment at apr_bps over term_months" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DECLINED | WITHDRAWN", default: "SUBMITTED", constraints: "see FinancingApplication state machine" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: InstallOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job being installed" }
      - { name: quote_id, type: string, source: system, description: "Forward pointer to the accepted Quote.id, pinned to Job.accepted_quote_id at creation; reverse lookup via the shared job_id (GET /jobs/{job_id}/install-orders and GET /jobs/{job_id}/quotes)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned install window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned install window end (ISO 8601 UTC), half-open [start, end)" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | IN_PROGRESS | PASSED | FAILED | COMPLETED | CANCELLED", default: "PLANNED", constraints: "see InstallOrder state machine" }
      - { name: actual_drain_linear_ft, type: integer, source: input, description: "Drain linear feet actually installed, recorded at completion", default: 0, constraints: ">= 0" }
      - { name: final_total_cents, type: integer, source: computed, description: "Reconciled install cost using actual measured quantities; differs from Quote.total_cents when actuals diverge" }
      - { name: variance_cents, type: integer, source: computed, description: "final_total_cents - Quote.total_cents; positive means overage billed to homeowner" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: CrewBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the assigned crew" }
      - { name: install_order_id, type: string, source: input, description: "FK -> InstallOrder.id; the install this booking serves" }
      - { name: window_start, type: datetime, source: input, description: "Booking window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Booking window end (ISO 8601 UTC), half-open [start, end)" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | RELEASED", default: "RESERVED", constraints: "see CrewBooking state machine" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Crew display name" }
      - { name: home_region, type: string, source: input, description: "Region code the crew is based in, e.g. NORTH, SOUTH" }
      - { name: daily_capacity, type: integer, source: input, description: "Max number of CONFIRMED bookings per calendar day", constraints: ">= 1" }
      - { name: active, type: boolean, source: input, description: "Whether the crew is bookable", default: true }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Warranty
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the warranted job" }
      - { name: install_order_id, type: string, source: system, description: "Forward pointer to the completed InstallOrder.id; reverse lookup via the shared job_id (GET /jobs/{job_id}/install-orders and GET /jobs/{job_id}/warranties)" }
      - { name: holder_homeowner_id, type: string, source: system, description: "Current warranty holder Homeowner.id (transferable); not a structural child FK, set on issue and on each transfer" }
      - { name: coverage_years, type: integer, source: system, description: "Coverage length; LIFETIME encoded as 25, system covenant", default: 25 }
      - { name: status, type: enum, source: system, description: "ACTIVE | TRANSFERRED | VOID | LAPSED", default: "ACTIVE", constraints: "see Warranty state machine" }
      - { name: transfer_count, type: integer, source: computed, description: "Number of completed transfers; capped at MAX_TRANSFERS", default: 0 }
      - { name: next_service_due, type: datetime, source: computed, description: "last_service_at (or activation) + 1 year; drives annual service eligibility" }
      - { name: last_service_at, type: datetime, source: system, description: "Timestamp of the most recent COMPLETED ServiceVisit, null until first service" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: warranty_id, type: string, source: input, description: "FK -> Warranty.id; the warranty under which service is performed" }
      - { name: visit_type, type: enum, source: input, description: "ANNUAL | CLAIM_REPAIR; ANNUAL is the maintenance visit, CLAIM_REPAIR resolves a claim", constraints: "one of ANNUAL, CLAIM_REPAIR" }
      - { name: claim_id, type: string, source: input, description: "Forward pointer to the Claim.id this visit repairs; required when visit_type=CLAIM_REPAIR, null for ANNUAL; validated to exist and be IN_PROGRESS at schedule time", default: null }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned visit time (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: "SCHEDULED", constraints: "see ServiceVisit state machine" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job the claim is against" }
      - { name: warranty_id, type: string, source: input, description: "FK -> Warranty.id; the warranty being claimed against" }
      - { name: category, type: enum, source: input, description: "WATER_INTRUSION | PUMP_FAILURE | STRUCTURAL; drives whether warranty covers it", constraints: "one of WATER_INTRUSION, PUMP_FAILURE, STRUCTURAL" }
      - { name: description, type: string, source: input, description: "Free-text problem description" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | RESOLVED | DENIED | REOPENED", default: "OPEN", constraints: "see Claim state machine (has reopen cycle)" }
      - { name: reopen_count, type: integer, source: computed, description: "Number of times this claim has been reopened from RESOLVED", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: FoundationReferral
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; the job referred out" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; the finalized inspection that triggered referral eligibility" }
      - { name: partner_name, type: string, source: input, description: "Foundation-repair partner the referral is sent to" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACCEPTED | REJECTED", default: "DRAFT", constraints: "see FoundationReferral state machine" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Job lifecycle (parallel dimension A) ----
  - entity: Job
    field: lifecycle_status
    initial_state: LEAD
    terminal_states: [CLOSED, LOST]
    note: "Parallel dimension A. financing_status (dimension B) evolves independently."
    transitions:
      - from: LEAD
        to: INSPECTED
        trigger: "POST /jobs/{job_id}/inspections/{inspection_id}/finalize (first finalize on the job)"
        actor: Inspector
        preconditions:
          - "Inspection.status == DRAFT"
          - "Inspection.job_id == job_id"
        side_effects:
          - "Inspection.status -> FINALIZED"
          - "Inspection.severity computed (see assessment_severity calc)"
          - "Job.assessment_severity := finalized Inspection.severity"
          - "increments Job.version by 1"

      - from: INSPECTED
        to: QUOTED
        trigger: "POST /quotes/{quote_id}/send (first SENT quote on the job)"
        actor: Estimator
        preconditions:
          - "Quote.status == DRAFT"
          - "Job.lifecycle_status == INSPECTED"
        side_effects:
          - "Quote.status -> SENT"
          - "Quote.expires_at := Quote.created_at + 30 days"
          - "increments Job.version by 1"

      - from: QUOTED
        to: SOLD
        trigger: "POST /quotes/{quote_id}/accept"
        actor: Homeowner
        preconditions:
          - "Quote.status == SENT"
          - "current_utc < Quote.expires_at"
          - "Job.lifecycle_status == QUOTED"
        side_effects:
          - "Quote.status -> ACCEPTED"
          - "Job.accepted_quote_id := quote_id"
          - "all other Quotes on the Job in SENT -> DECLINED"
          - "increments Job.version by 1"

      - from: SOLD
        to: SCHEDULED
        trigger: "POST /jobs/{job_id}/install-orders"
        actor: Scheduler
        preconditions:
          - "Job.lifecycle_status == SOLD"
          - "Job.financing_status IN {CASH, APPROVED}"
        side_effects:
          - "InstallOrder created with status=PLANNED, quote_id := Job.accepted_quote_id"
          - "Job.install_order_id := new InstallOrder.id"
          - "increments Job.version by 1"

      - from: SCHEDULED
        to: INSTALLED
        trigger: "POST /install-orders/{install_order_id}/complete"
        actor: Scheduler
        preconditions:
          - "InstallOrder.status == PASSED"
          - "Job.lifecycle_status == SCHEDULED"
        side_effects:
          - "InstallOrder.status -> COMPLETED"
          - "InstallOrder.final_total_cents and variance_cents computed (install reconciliation calc)"
          - "increments Job.version by 1"

      - from: INSTALLED
        to: WARRANTED
        trigger: "POST /jobs/{job_id}/warranty"
        actor: WarrantyAdmin
        preconditions:
          - "Job.lifecycle_status == INSTALLED"
          - "InstallOrder.status == COMPLETED"
        side_effects:
          - "Warranty created status=ACTIVE, holder_homeowner_id := Job.homeowner_id"
          - "Warranty.next_service_due := activation_time + 1 year"
          - "increments Job.version by 1"

      - from: WARRANTED
        to: CLOSED
        trigger: "POST /jobs/{job_id}/close"
        actor: WarrantyAdmin
        preconditions:
          - "Job.lifecycle_status == WARRANTED"
          - "Job.open_claim_count == 0"
        side_effects:
          - "increments Job.version by 1"

      - from: [LEAD, INSPECTED, QUOTED]
        to: LOST
        trigger: "POST /jobs/{job_id}/mark-lost"
        actor: Estimator
        preconditions:
          - "Job.lifecycle_status IN {LEAD, INSPECTED, QUOTED}"
        side_effects:
          - "all Quotes on the Job in {DRAFT, SENT} -> DECLINED"
          - "increments Job.version by 1"

  # ---- Job financing (parallel dimension B) ----
  - entity: Job
    field: financing_status
    initial_state: NONE
    terminal_states: []
    note: "Parallel dimension B. Cross-driven by FinancingApplication transitions; CASH set directly."
    transitions:
      - from: NONE
        to: CASH
        trigger: "POST /jobs/{job_id}/pay-cash"
        actor: Homeowner
        preconditions:
          - "Job.lifecycle_status == SOLD"
          - "Job.financing_status == NONE"
        side_effects:
          - "increments Job.version by 1"

      - from: NONE
        to: APPLIED
        trigger: "POST /financing-applications (created against this Job)"
        actor: Homeowner
        preconditions:
          - "Job.lifecycle_status == SOLD"
          - "Job.financing_status == NONE"
        side_effects:
          - "FinancingApplication created status=SUBMITTED"
          - "increments Job.version by 1"

      - from: APPLIED
        to: APPROVED
        trigger: "POST /financing-applications/{app_id}/decide (decision=APPROVE)"
        actor: FinancePartner
        preconditions:
          - "FinancingApplication.status == SUBMITTED"
          - "Job.financing_status == APPLIED"
        side_effects:
          - "FinancingApplication.status -> APPROVED"
          - "increments Job.version by 1"

      - from: APPLIED
        to: DECLINED
        trigger: "POST /financing-applications/{app_id}/decide (decision=DECLINE)"
        actor: FinancePartner
        preconditions:
          - "FinancingApplication.status == SUBMITTED"
          - "Job.financing_status == APPLIED"
        side_effects:
          - "FinancingApplication.status -> DECLINED"
          - "increments Job.version by 1"

      - from: DECLINED
        to: NONE
        trigger: "POST /financing-applications/{app_id}/withdraw"
        actor: Homeowner
        preconditions:
          - "FinancingApplication.status == DECLINED"
          - "Job.financing_status == DECLINED"
        side_effects:
          - "FinancingApplication.status -> WITHDRAWN"
          - "increments Job.version by 1"

  # ---- Inspection ----
  - entity: Inspection
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "FINALIZED is non-terminal: a later finalize supersedes the prior FINALIZED inspection."
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /jobs/{job_id}/inspections/{inspection_id}/finalize"
        actor: Inspector
        preconditions:
          - "Inspection.status == DRAFT"
        side_effects:
          - "severity computed (assessment_severity calc)"
          - "if a prior FINALIZED Inspection exists on the Job, that one -> SUPERSEDED"
          - "Job.assessment_severity := this Inspection.severity"
          - "increments Inspection.version by 1"

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a newer Inspection on the same Job is finalized)"
        actor: system
        preconditions:
          - "a newer Inspection on the Job transitions DRAFT -> FINALIZED"
        side_effects:
          - "increments Inspection.version by 1"

  # ---- Quote (cyclic revision loop) ----
  - entity: Quote
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, EXPIRED, DECLINED]
    note: "Cyclic: SENT -> REVISED spawns a new DRAFT Quote (revision+1) which loops back to SENT."
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{quote_id}/send"
        actor: Estimator
        preconditions:
          - "Quote.status == DRAFT"
          - "Job.lifecycle_status IN {INSPECTED, QUOTED}"
        side_effects:
          - "expires_at := created_at + 30 days"
          - "increments Quote.version by 1"

      - from: SENT
        to: REVISED
        trigger: "POST /quotes/{quote_id}/revise"
        actor: Estimator
        preconditions:
          - "Quote.status == SENT"
        side_effects:
          - "a new Quote is created DRAFT with revision = this.revision + 1, copying scope fields"
          - "increments Quote.version by 1"

      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{quote_id}/accept"
        actor: Homeowner
        preconditions:
          - "Quote.status == SENT"
          - "current_utc < Quote.expires_at"
        side_effects:
          - "Job.accepted_quote_id := this.id; Job.lifecycle_status -> SOLD"
          - "all sibling Quotes on the Job in SENT -> DECLINED"
          - "increments Quote.version by 1"

      - from: SENT
        to: EXPIRED
        trigger: "system (current_utc >= expires_at on accept/read) or POST /quotes/{quote_id}/expire"
        actor: "system or Estimator"
        preconditions:
          - "Quote.status == SENT"
          - "current_utc >= Quote.expires_at"
        side_effects:
          - "increments Quote.version by 1"

      - from: SENT
        to: DECLINED
        trigger: "POST /quotes/{quote_id}/decline or system (sibling Quote accepted)"
        actor: "Homeowner or system"
        preconditions:
          - "Quote.status == SENT"
        side_effects:
          - "increments Quote.version by 1"

  # ---- FinancingApplication (branching approve/decline) ----
  - entity: FinancingApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    note: "Branching: SUBMITTED forks to APPROVED or DECLINED with divergent side-effects on Job.financing_status."
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /financing-applications/{app_id}/decide (decision=APPROVE)"
        actor: FinancePartner
        preconditions:
          - "FinancingApplication.status == SUBMITTED"
          - "amount_financed_cents <= MAX_FINANCE_CENTS for the credit_band tier"
        side_effects:
          - "Job.financing_status -> APPROVED"
          - "increments FinancingApplication.version by 1"

      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /financing-applications/{app_id}/decide (decision=DECLINE)"
        actor: FinancePartner
        preconditions:
          - "FinancingApplication.status == SUBMITTED"
        side_effects:
          - "Job.financing_status -> DECLINED"
          - "increments FinancingApplication.version by 1"

      - from: DECLINED
        to: WITHDRAWN
        trigger: "POST /financing-applications/{app_id}/withdraw"
        actor: Homeowner
        preconditions:
          - "FinancingApplication.status == DECLINED"
        side_effects:
          - "Job.financing_status -> NONE"
          - "increments FinancingApplication.version by 1"

  # ---- InstallOrder (branching PASS/FAIL, FAIL loops back to IN_PROGRESS) ----
  - entity: InstallOrder
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Branching with rework loop: IN_PROGRESS -> {PASSED, FAILED}; FAILED -> IN_PROGRESS for rework."
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /install-orders/{install_order_id}/dispatch"
        actor: Scheduler
        preconditions:
          - "InstallOrder.status == PLANNED"
          - "there exists a CONFIRMED CrewBooking for this InstallOrder"
        side_effects:
          - "increments InstallOrder.version by 1"

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /install-orders/{install_order_id}/start"
        actor: Scheduler
        preconditions:
          - "InstallOrder.status == DISPATCHED"
          - "current_utc >= InstallOrder.scheduled_start"
        side_effects:
          - "increments InstallOrder.version by 1"

      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /install-orders/{install_order_id}/inspect-pass"
        actor: Inspector
        preconditions:
          - "InstallOrder.status == IN_PROGRESS"
        side_effects:
          - "increments InstallOrder.version by 1"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /install-orders/{install_order_id}/inspect-fail"
        actor: Inspector
        preconditions:
          - "InstallOrder.status == IN_PROGRESS"
        side_effects:
          - "increments InstallOrder.version by 1"

      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /install-orders/{install_order_id}/start"
        actor: Scheduler
        preconditions:
          - "InstallOrder.status == FAILED"
        side_effects:
          - "increments InstallOrder.version by 1"

      - from: PASSED
        to: COMPLETED
        trigger: "POST /install-orders/{install_order_id}/complete"
        actor: Scheduler
        preconditions:
          - "InstallOrder.status == PASSED"
        side_effects:
          - "final_total_cents and variance_cents computed (install reconciliation calc)"
          - "Job.lifecycle_status -> INSTALLED"
          - "all CrewBooking for this InstallOrder in {RESERVED, CONFIRMED} -> RELEASED"
          - "increments InstallOrder.version by 1"

      - from: [PLANNED, DISPATCHED]
        to: CANCELLED
        trigger: "POST /install-orders/{install_order_id}/cancel"
        actor: Scheduler
        preconditions:
          - "InstallOrder.status IN {PLANNED, DISPATCHED}"
        side_effects:
          - "all CrewBooking for this InstallOrder in {RESERVED, CONFIRMED} -> RELEASED"
          - "Job.lifecycle_status reverts SCHEDULED -> SOLD"
          - "Job.install_order_id := null"
          - "increments InstallOrder.version by 1"

  # ---- CrewBooking ----
  - entity: CrewBooking
    field: status
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /crew-bookings/{booking_id}/confirm"
        actor: Scheduler
        preconditions:
          - "CrewBooking.status == RESERVED"
          - "the Crew's CONFIRMED bookings on the booking's calendar day < Crew.daily_capacity"
          - "no CONFIRMED CrewBooking on the same Crew overlaps [window_start, window_end)"
        side_effects:
          - "increments CrewBooking.version by 1"

      - from: [RESERVED, CONFIRMED]
        to: RELEASED
        trigger: "POST /crew-bookings/{booking_id}/release or system (InstallOrder complete/cancel)"
        actor: "Scheduler or system"
        preconditions:
          - "CrewBooking.status IN {RESERVED, CONFIRMED}"
        side_effects:
          - "increments CrewBooking.version by 1"

  # ---- Warranty (transfer cycle) ----
  - entity: Warranty
    field: status
    initial_state: ACTIVE
    terminal_states: [VOID, LAPSED]
    note: "TRANSFERRED loops back to ACTIVE after holder change; transfer_count increments each loop."
    transitions:
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /warranties/{warranty_id}/transfer"
        actor: WarrantyAdmin
        preconditions:
          - "Warranty.status == ACTIVE"
          - "transfer_count < MAX_TRANSFERS"
        side_effects:
          - "holder_homeowner_id := new holder"
          - "transfer_count increments by 1"
          - "increments Warranty.version by 1"

      - from: TRANSFERRED
        to: ACTIVE
        trigger: "system (transfer settles in same request)"
        actor: system
        preconditions:
          - "Warranty.status == TRANSFERRED"
        side_effects:
          - "increments Warranty.version by 1"

      - from: ACTIVE
        to: VOID
        trigger: "POST /warranties/{warranty_id}/void"
        actor: WarrantyAdmin
        preconditions:
          - "Warranty.status == ACTIVE"
        side_effects:
          - "all SCHEDULED ServiceVisits on this Warranty -> CANCELLED"
          - "increments Warranty.version by 1"

      - from: ACTIVE
        to: LAPSED
        trigger: "POST /warranties/{warranty_id}/lapse or system (annual service overdue past grace)"
        actor: "WarrantyAdmin or system"
        preconditions:
          - "Warranty.status == ACTIVE"
          - "current_utc >= next_service_due + SERVICE_GRACE_DAYS"
        side_effects:
          - "increments Warranty.version by 1"

  # ---- ServiceVisit ----
  - entity: ServiceVisit
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /service-visits/{visit_id}/complete"
        actor: WarrantyAdmin
        preconditions:
          - "ServiceVisit.status == SCHEDULED"
          - "Warranty.status == ACTIVE"
        side_effects:
          - "if visit_type == ANNUAL: Warranty.last_service_at := completion time; Warranty.next_service_due := completion time + 1 year"
          - "if visit_type == CLAIM_REPAIR: referenced Claim IN_PROGRESS -> RESOLVED"
          - "increments ServiceVisit.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /service-visits/{visit_id}/cancel or system (Warranty voided)"
        actor: "WarrantyAdmin or system"
        preconditions:
          - "ServiceVisit.status == SCHEDULED"
        side_effects:
          - "increments ServiceVisit.version by 1"

  # ---- Claim (reopen cycle) ----
  - entity: Claim
    field: status
    initial_state: OPEN
    terminal_states: [DENIED]
    note: "Cyclic: RESOLVED -> REOPENED -> IN_PROGRESS allows reopening a previously resolved claim."
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /claims/{claim_id}/triage (accept=true)"
        actor: WarrantyAdmin
        preconditions:
          - "Claim.status == OPEN"
          - "Warranty.status == ACTIVE"
          - "category is covered by the warranty (STRUCTURAL is NOT covered)"
        side_effects:
          - "Job.open_claim_count recomputed"
          - "increments Claim.version by 1"

      - from: OPEN
        to: DENIED
        trigger: "POST /claims/{claim_id}/triage (accept=false)"
        actor: WarrantyAdmin
        preconditions:
          - "Claim.status == OPEN"
        side_effects:
          - "Job.open_claim_count recomputed"
          - "increments Claim.version by 1"

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "system (a CLAIM_REPAIR ServiceVisit referencing this Claim is COMPLETED)"
        actor: system
        preconditions:
          - "Claim.status == IN_PROGRESS"
        side_effects:
          - "Job.open_claim_count recomputed"
          - "increments Claim.version by 1"

      - from: RESOLVED
        to: REOPENED
        trigger: "POST /claims/{claim_id}/reopen"
        actor: Homeowner
        preconditions:
          - "Claim.status == RESOLVED"
          - "Warranty.status == ACTIVE"
        side_effects:
          - "reopen_count increments by 1"
          - "Job.open_claim_count recomputed"
          - "increments Claim.version by 1"

      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /claims/{claim_id}/triage (accept=true)"
        actor: WarrantyAdmin
        preconditions:
          - "Claim.status == REOPENED"
          - "Warranty.status == ACTIVE"
        side_effects:
          - "Job.open_claim_count recomputed"
          - "increments Claim.version by 1"

  # ---- FoundationReferral ----
  - entity: FoundationReferral
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /foundation-referrals/{referral_id}/send"
        actor: Inspector
        preconditions:
          - "FoundationReferral.status == DRAFT"
          - "the referenced Inspection.status == FINALIZED and Inspection.severity == SEVERE"
        side_effects:
          - "increments FoundationReferral.version by 1"

      - from: SENT
        to: ACCEPTED
        trigger: "POST /foundation-referrals/{referral_id}/resolve (outcome=ACCEPT)"
        actor: Inspector
        preconditions:
          - "FoundationReferral.status == SENT"
        side_effects:
          - "increments FoundationReferral.version by 1"

      - from: SENT
        to: REJECTED
        trigger: "POST /foundation-referrals/{referral_id}/resolve (outcome=REJECT)"
        actor: Inspector
        preconditions:
          - "FoundationReferral.status == SENT"
        side_effects:
          - "increments FoundationReferral.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: install-order-create-stale-job
    parent_entity: Job
    write_endpoint: "POST /jobs/{job_id}/install-orders"
    occ_field: "expected_job_version"
    description: |
      Creating an InstallOrder against a Job whose version has advanced since the
      client last observed it is rejected as a stale-version write. The Job stays in
      lifecycle SOLD throughout, but its version is silently bumped by a financing
      decision that flips financing_status (e.g. APPLIED -> APPROVED) without leaving
      SOLD; a create still carrying the pre-decision job_version is therefore stale.
      A create carrying the fresh version would itself legitimately succeed (the Job
      is a valid SOLD/financing-resolved target), so this is a true supersede race
      resolved by OCC, not a state precondition: two strictly sequential creates that
      both observe SOLD differ only in the version they carry.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: warranty-transfer-stale-warranty
    parent_entity: Warranty
    write_endpoint: "POST /warranties/{warranty_id}/transfer"
    occ_field: "expected_warranty_version"
    description: |
      Transferring a Warranty whose version has advanced since the client last observed
      it is rejected as a stale-version write. This captures the case where a prior
      transfer already changed the holder and bumped transfer_count/version, so a second
      transfer carrying the stale version is rejected rather than re-applying against an
      outdated holder view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_pricing
    trigger: "Quote create (POST /jobs/{job_id}/quotes) and Quote revise"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: line items -> subtotal -> discount -> tax -> total.
      base_cents = footprint_tier_base(Job.footprint_sqft)   # tiered by footprint (see constants)
      vapor_cents = includes_vapor_barrier ? (VAPOR_RATE_CENTS_PER_SQFT * Job.footprint_sqft) : 0
      sump_cents  = includes_sump ? SUMP_CENTS : 0
      dehu_cents  = includes_dehumidifier ? DEHU_CENTS : 0
      backup_cents = includes_battery_backup ? BACKUP_CENTS : 0
      # drain billed per linear foot, but only the feet beyond the first DRAIN_FREE_FT are charged
      drain_billable_ft = includes_drain ? max(0, drain_linear_ft - DRAIN_FREE_FT) : 0
      drain_cents = drain_billable_ft * DRAIN_CENTS_PER_FT
      subtotal_cents = base_cents + vapor_cents + sump_cents + dehu_cents + backup_cents + drain_cents
      # discount: percentage on subtotal, rounded to nearest cent (round_half_up)
      discount_pct = discount_code == "SPRING10" ? 0.10 : (discount_code == "SENIOR15" ? 0.15 : 0.0)
      discount_cents = round_half_up(subtotal_cents * discount_pct)
      discounted = subtotal_cents - discount_cents
      # tax computed on the discounted subtotal (NOT on subtotal before discount)
      tax_cents = round_half_up(discounted * TAX_RATE)
      total_cents = discounted + tax_cents
    input_set: "Single Quote's own scope flags + parent Job.footprint_sqft; no aggregation across quotes."
    constants:
      FOOTPRINT_TIER_1_MAX: 800        # <=800 sqft
      FOOTPRINT_TIER_1_BASE_CENTS: 250000
      FOOTPRINT_TIER_2_MAX: 1500       # 801..1500 sqft
      FOOTPRINT_TIER_2_BASE_CENTS: 400000
      FOOTPRINT_TIER_3_BASE_CENTS: 600000   # > 1500 sqft
      VAPOR_RATE_CENTS_PER_SQFT: 180
      SUMP_CENTS: 120000
      DEHU_CENTS: 165000
      BACKUP_CENTS: 90000
      DRAIN_FREE_FT: 20
      DRAIN_CENTS_PER_FT: 4500
      TAX_RATE: 0.07
    precision: "integer cents; round_half_up on each rounding step in the pinned order above"
    variants:
      - name: quoted_estimate
        when: "computed at Quote create/revise from declared scope quantities"
        difference: "uses declared drain_linear_ft; this is the price SENT to the homeowner"
      - name: install_final_reconciliation
        when: "computed at InstallOrder complete from actual_drain_linear_ft (see install_reconciliation calc)"
        difference: "re-runs the same formula substituting actual_drain_linear_ft for drain_linear_ft, yielding final_total_cents that diverges from the quoted total_cents"

  - name: install_reconciliation
    trigger: "InstallOrder complete (PASSED -> COMPLETED)"
    algorithm: aggregation
    formula: |
      # Re-run quote_pricing formula on the accepted Quote's scope flags but substitute
      # the InstallOrder.actual_drain_linear_ft for the quoted drain_linear_ft.
      # All other line items and the SAME pinned evaluation order (subtotal -> discount -> tax)
      # are reused unchanged from the accepted Quote.
      actual_drain_billable_ft = accepted_quote.includes_drain ? max(0, actual_drain_linear_ft - DRAIN_FREE_FT) : 0
      drain_cents = actual_drain_billable_ft * DRAIN_CENTS_PER_FT
      subtotal_cents = base_cents + vapor_cents + sump_cents + dehu_cents + backup_cents + drain_cents
      discount_cents = round_half_up(subtotal_cents * discount_pct_of_accepted_quote)
      discounted = subtotal_cents - discount_cents
      tax_cents = round_half_up(discounted * TAX_RATE)
      final_total_cents = discounted + tax_cents
      variance_cents = final_total_cents - accepted_quote.total_cents
    input_set: "accepted Quote scope flags (frozen) + InstallOrder.actual_drain_linear_ft"
    constants:
      DRAIN_FREE_FT: 20
      DRAIN_CENTS_PER_FT: 4500
      TAX_RATE: 0.07
    precision: "integer cents; round_half_up; same pinned order as quote_pricing"

  - name: assessment_severity
    trigger: "Inspection finalize (DRAFT -> FINALIZED)"
    algorithm: weighted_scoring
    formula: |
      # score is built ONLY from moisture and structural findings (standing_water is NOT a score input).
      # Evaluation order is pinned: score -> base threshold mapping -> standing-water override.
      score = 0
      if moisture_pct >= MOISTURE_HIGH: score += 3
      elif moisture_pct >= MOISTURE_MID: score += 1
      score += min(structural_findings_count, STRUCT_CAP) * STRUCT_WEIGHT
      # base threshold mapping (standing_water deliberately excluded):
      base_severity =
        SEVERE   if score >= SEVERE_THRESHOLD
        MODERATE if score >= MODERATE_THRESHOLD
        LOW      if score >= 1
        NONE     otherwise
      # hard override applied AFTER mapping: standing water + >=1 structural finding
      # forces at least MODERATE when the base mapping landed at LOW or NONE.
      severity = base_severity
      if standing_water and structural_findings_count >= 1 and base_severity in (LOW, NONE):
        severity = MODERATE
    input_set: "single Inspection's own measured fields"
    constants:
      MOISTURE_MID: 60.0
      MOISTURE_HIGH: 80.0
      STRUCT_CAP: 4
      STRUCT_WEIGHT: 2
      MODERATE_THRESHOLD: 4
      SEVERE_THRESHOLD: 7
    precision: "integer score; severity is an enum mapping"
    variants:
      - name: base_threshold_mapping
        when: "standing_water=false, or base mapping already >= MODERATE"
        difference: "pure score-to-severity threshold lookup; standing_water has no effect"
      - name: standing_water_structural_override
        when: "standing_water=true AND >=1 structural finding AND base mapping yielded LOW or NONE"
        difference: "forces severity up to MODERATE, diverging from the pure threshold result (LOW -> MODERATE)"

  - name: financing_amortization
    trigger: "FinancingApplication create (POST /financing-applications)"
    algorithm: tiered_pricing
    formula: |
      # APR selected by a 2-D tier: credit_band x term bucket. Then standard amortization.
      apr_bps = apr_table[credit_band][term_bucket(term_months)]
      r = apr_bps / 10000 / 12               # monthly rate
      n = term_months
      P = amount_financed_cents               # pinned to accepted Quote.total_cents
      if r == 0:
        monthly_payment_cents = round_half_up(P / n)
      else:
        monthly_payment_cents = round_half_up( P * r * (1+r)**n / ((1+r)**n - 1) )
    input_set: "single FinancingApplication: Homeowner.credit_band + term_months + accepted Quote.total_cents"
    constants:
      # apr_table[credit_band][term_bucket]; term_bucket SHORT = term<=24, LONG = term>24
      APR_PRIME_SHORT_BPS: 599
      APR_PRIME_LONG_BPS: 799
      APR_NEAR_PRIME_SHORT_BPS: 1099
      APR_NEAR_PRIME_LONG_BPS: 1399
      APR_SUBPRIME_SHORT_BPS: 1999
      APR_SUBPRIME_LONG_BPS: 2399
      MAX_FINANCE_PRIME_CENTS: 5000000
      MAX_FINANCE_NEAR_PRIME_CENTS: 3000000
      MAX_FINANCE_SUBPRIME_CENTS: 1500000
    precision: "integer cents; round_half_up on monthly_payment_cents"
    variants:
      - name: prime_tier
        when: "Homeowner.credit_band == PRIME"
        difference: "lowest APR tier; higher MAX_FINANCE ceiling"
      - name: subprime_tier
        when: "Homeowner.credit_band == SUBPRIME"
        difference: "highest APR tier; lowest MAX_FINANCE ceiling -> APPROVE precondition fails sooner"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "All FK fields in the request body reference existing resources of the correct type"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "create endpoints with FK body fields"

  - priority: 5
    category: existence
    check: "Required body fields present and well-typed; enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /jobs/{job_id}/install-orders, POST /quotes/{quote_id}/accept, POST /warranties/{warranty_id}/transfer"

  - priority: 8
    category: business_temporal
    check: "Quote not past its expires_at when accepting"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /quotes/{quote_id}/accept"

  - priority: 9
    category: business_safety
    check: "Claim category is covered by the warranty (STRUCTURAL claims are not covered)"
    error_id: ERR_CLAIM_NOT_COVERED
    http_status: 422
    applies_to: "POST /claims/{claim_id}/triage with accept=true"

  - priority: 10
    category: business_safety
    check: "FoundationReferral may be SENT only when its Inspection is FINALIZED with severity SEVERE"
    error_id: ERR_REFERRAL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /foundation-referrals/{referral_id}/send"

  - priority: 11
    category: business_constraint
    check: "battery backup add-on requires includes_sump=true on the same Quote"
    error_id: ERR_BACKUP_REQUIRES_SUMP
    http_status: 422
    applies_to: "POST /jobs/{job_id}/quotes, POST /quotes/{quote_id}/revise"

  - priority: 12
    category: business_constraint
    check: "Scheduling an install requires financing resolved (Job.financing_status IN {CASH, APPROVED})"
    error_id: ERR_FINANCING_UNRESOLVED
    http_status: 409
    applies_to: "POST /jobs/{job_id}/install-orders"

  - priority: 13
    category: business_fiscal
    check: "Financing amount must not exceed the credit_band's MAX_FINANCE ceiling at approval"
    error_id: ERR_FINANCE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /financing-applications/{app_id}/decide with decision=APPROVE"

  - priority: 14
    category: business_temporal
    check: "Confirming a CrewBooking must not overlap an existing CONFIRMED booking window [start,end) on the same crew"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /crew-bookings/{booking_id}/confirm"

  - priority: 15
    category: business_constraint
    check: "Confirming a CrewBooking must not exceed the crew's daily_capacity of CONFIRMED bookings for that calendar day"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /crew-bookings/{booking_id}/confirm"

  - priority: 16
    category: business_constraint
    check: "Warranty transfer_count must be below MAX_TRANSFERS"
    error_id: ERR_TRANSFER_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /warranties/{warranty_id}/transfer"

  - priority: 17
    category: business_temporal
    check: "CLAIM_REPAIR ServiceVisit requires a non-null claim_id whose Claim is IN_PROGRESS; ANNUAL requires claim_id null"
    error_id: ERR_VISIT_CLAIM_MISMATCH
    http_status: 422
    applies_to: "POST /warranties/{warranty_id}/service-visits"

  - priority: 18
    category: business_constraint
    check: "Job may close only when open_claim_count == 0"
    error_id: ERR_OPEN_CLAIMS_BLOCK_CLOSE
    http_status: 409
    applies_to: "POST /jobs/{job_id}/close"

  - priority: 19
    category: business_temporal
    check: "A new ServiceVisit must be at least MIN_VISIT_GAP_DAYS (7) calendar days from every other SCHEDULED ServiceVisit on the same Warranty; visits are treated as points and the gap is |scheduled_for - other.scheduled_for|, so two SCHEDULED visits within the 7-day buffer (including same instant) collide"
    error_id: ERR_VISIT_TOO_CLOSE
    http_status: 409
    applies_to: "POST /warranties/{warranty_id}/service-visits"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-04-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Scheduler, WarrantyAdmin, Estimator, Inspector, FinancePartner, Homeowner]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

  - method: POST
    path: "/_seed/scheduled-job"
    description: "Test-driving fast-forward: provisions a Job all the way to lifecycle SCHEDULED with an accepted sump-only Quote (total 395900), CASH financing, and a fresh PLANNED InstallOrder. Equivalent to composing the full job->inspect->finalize->quote->send->accept->pay-cash->install-orders chain; provided to keep deep-precondition test setups tractable."
    roles: [Scheduler]
    code: 201
    input: [homeowner_id]
    output: "{ job_id: string, quote_id: string, install_order_id: string, job_version: integer }"
    side_effects: ["creates Job(SCHEDULED, CASH), finalized Inspection, accepted Quote, PLANNED InstallOrder"]

  - method: POST
    path: "/_seed/warranted-job"
    description: "Test-driving fast-forward: provisions a Job all the way to lifecycle WARRANTED with a COMPLETED InstallOrder and an ACTIVE Warranty held by the given homeowner. Equivalent to composing the full scheduled-job chain plus dispatch->start->inspect-pass->complete->warranty; provided to keep deep-precondition test setups tractable."
    roles: [WarrantyAdmin]
    code: 201
    input: [homeowner_id]
    output: "{ job_id: string, warranty_id: string, install_order_id: string }"
    side_effects: ["creates Job(WARRANTED, CASH), COMPLETED InstallOrder, ACTIVE Warranty held by homeowner_id"]

  # ---- Homeowner ----
  - method: POST
    path: "/homeowners"
    description: "Register a homeowner (any back-office operator may register on a customer's behalf)"
    roles: [Homeowner, Estimator, Scheduler, WarrantyAdmin]
    code: 201
    input: [full_name, email, credit_band]
    output: Homeowner
    side_effects: []

  - method: GET
    path: "/homeowners/{homeowner_id}"
    description: "Get a homeowner"
    roles: [Homeowner, Estimator, WarrantyAdmin]
    code: 200
    input: []
    output: Homeowner
    side_effects: []

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Create a crew"
    roles: [Scheduler]
    code: 201
    input: [name, home_region, daily_capacity, "active?"]
    output: Crew
    side_effects: ["status active=true by default"]

  - method: GET
    path: "/crews/{crew_id}"
    description: "Get a crew"
    roles: [Scheduler]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # ---- Job ----
  - method: POST
    path: "/jobs"
    description: "Create a job (lead)"
    roles: [Estimator, Homeowner]
    code: 201
    input: [homeowner_id, property_address, structure_type, footprint_sqft]
    output: Job
    side_effects: ["lifecycle_status=LEAD, financing_status=NONE, assessment_severity=NONE, open_claim_count=0"]

  - method: GET
    path: "/jobs/{job_id}"
    description: "Get a job"
    roles: [Estimator, Homeowner, Scheduler, WarrantyAdmin, Inspector, FinancePartner]
    code: 200
    input: []
    output: Job
    side_effects: []

  - method: GET
    path: "/jobs"
    description: "List jobs, filterable by homeowner"
    roles: [Estimator, Scheduler, WarrantyAdmin]
    code: 200
    input: ["homeowner_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []

  - method: POST
    path: "/jobs/{job_id}/mark-lost"
    description: "Mark a job LOST"
    roles: [Estimator]
    code: 200
    input: []
    output: Job
    side_effects: ["lifecycle_status -> LOST", "DRAFT/SENT Quotes -> DECLINED", "increments Job.version"]

  - method: POST
    path: "/jobs/{job_id}/pay-cash"
    description: "Mark the job financed by cash"
    roles: [Homeowner]
    code: 200
    input: []
    output: Job
    side_effects: ["financing_status NONE -> CASH", "increments Job.version"]

  - method: POST
    path: "/jobs/{job_id}/install-orders"
    description: "Create the install order, moving the job to SCHEDULED (OCC-guarded on Job.version)"
    roles: [Scheduler]
    code: 201
    input: [scheduled_start, scheduled_end, expected_job_version]
    output: InstallOrder
    side_effects: ["InstallOrder created PLANNED", "Job.lifecycle_status SOLD -> SCHEDULED", "Job.install_order_id set", "increments Job.version by 1"]

  - method: POST
    path: "/jobs/{job_id}/warranty"
    description: "Issue the transferable warranty on a completed install"
    roles: [WarrantyAdmin]
    code: 201
    input: [coverage_years]
    output: Warranty
    side_effects: ["Warranty created ACTIVE", "next_service_due = now + 1 year", "Job.lifecycle_status INSTALLED -> WARRANTED", "increments Job.version"]

  - method: POST
    path: "/jobs/{job_id}/close"
    description: "Close a fully-warranted job"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: Job
    side_effects: ["lifecycle_status WARRANTED -> CLOSED", "increments Job.version"]

  # ---- Inspection ----
  - method: POST
    path: "/jobs/{job_id}/inspections"
    description: "Create a draft inspection for a job"
    roles: [Inspector]
    code: 201
    input: [moisture_pct, structural_findings_count, "standing_water?"]
    output: Inspection
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/inspections/{inspection_id}"
    description: "Get an inspection"
    roles: [Inspector, Estimator, Homeowner]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/inspections"
    description: "List inspections, filterable by job"
    roles: [Inspector, Estimator, Homeowner]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/jobs/{job_id}/inspections/{inspection_id}/finalize"
    description: "Finalize an inspection; computes severity, supersedes any prior finalized inspection"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status DRAFT -> FINALIZED", "severity computed", "prior FINALIZED -> SUPERSEDED", "Job.assessment_severity updated", "Job.lifecycle_status LEAD -> INSPECTED on first finalize", "increments versions"]

  # ---- Quote ----
  - method: POST
    path: "/jobs/{job_id}/quotes"
    description: "Create a draft quote (scope + pricing)"
    roles: [Estimator]
    code: 201
    input: ["includes_vapor_barrier?", "includes_sump?", "includes_dehumidifier?", "includes_drain?", "includes_battery_backup?", "drain_linear_ft?", "discount_code?"]
    output: Quote
    side_effects: ["status=DRAFT, revision=1", "subtotal/discount/tax/total computed (quote_pricing)"]

  - method: GET
    path: "/quotes/{quote_id}"
    description: "Get a quote"
    roles: [Estimator, Homeowner]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: GET
    path: "/quotes"
    description: "List quotes, filterable by job"
    roles: [Estimator, Homeowner]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/quotes/{quote_id}/send"
    description: "Send a draft quote to the homeowner"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status DRAFT -> SENT", "expires_at set", "Job.lifecycle_status INSPECTED -> QUOTED on first send", "increments versions"]

  - method: POST
    path: "/quotes/{quote_id}/revise"
    description: "Revise a sent quote, spawning a new draft revision"
    roles: [Estimator]
    code: 201
    input: ["includes_vapor_barrier?", "includes_sump?", "includes_dehumidifier?", "includes_drain?", "includes_battery_backup?", "drain_linear_ft?", "discount_code?"]
    output: Quote
    side_effects: ["this Quote SENT -> REVISED", "new Quote created DRAFT revision+1 with recomputed pricing", "increments versions"]

  - method: POST
    path: "/quotes/{quote_id}/accept"
    description: "Homeowner accepts the quote (OCC-guarded on Quote.version)"
    roles: [Homeowner]
    code: 200
    input: [expected_quote_version]
    output: Quote
    side_effects: ["status SENT -> ACCEPTED", "Job.accepted_quote_id set", "Job.lifecycle_status QUOTED -> SOLD", "sibling SENT Quotes -> DECLINED", "increments versions"]

  - method: POST
    path: "/quotes/{quote_id}/decline"
    description: "Homeowner declines a sent quote"
    roles: [Homeowner]
    code: 200
    input: []
    output: Quote
    side_effects: ["status SENT -> DECLINED", "increments Quote.version"]

  - method: POST
    path: "/quotes/{quote_id}/expire"
    description: "Expire a sent quote past its expires_at"
    roles: [Estimator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status SENT -> EXPIRED (requires current_utc >= expires_at)", "increments Quote.version"]

  # ---- FinancingApplication ----
  - method: POST
    path: "/financing-applications"
    description: "Submit a financing application against an accepted quote"
    roles: [Homeowner]
    code: 201
    input: [job_id, quote_id, term_months]
    output: FinancingApplication
    side_effects: ["status=SUBMITTED", "amount_financed_cents pinned to Quote.total_cents", "apr_bps + monthly_payment computed (financing_amortization)", "Job.financing_status NONE -> APPLIED", "increments Job.version"]

  - method: GET
    path: "/financing-applications/{app_id}"
    description: "Get a financing application"
    roles: [Homeowner, FinancePartner]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []

  - method: GET
    path: "/financing-applications"
    description: "List financing applications, filterable by job"
    roles: [Homeowner, FinancePartner]
    code: 200
    input: ["job_id?", "quote_id?", "status?", "limit?", "offset?"]
    output: FinancingApplication[]
    side_effects: []

  - method: POST
    path: "/financing-applications/{app_id}/decide"
    description: "Finance partner approves or declines"
    roles: [FinancePartner]
    code: 200
    input: [decision]
    output: FinancingApplication
    side_effects: ["APPROVE: status -> APPROVED, Job.financing_status -> APPROVED (subject to MAX_FINANCE)", "DECLINE: status -> DECLINED, Job.financing_status -> DECLINED", "increments versions"]

  - method: POST
    path: "/financing-applications/{app_id}/withdraw"
    description: "Homeowner withdraws a declined application, resetting financing"
    roles: [Homeowner]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: ["status DECLINED -> WITHDRAWN", "Job.financing_status DECLINED -> NONE", "increments versions"]

  # ---- InstallOrder ----
  - method: GET
    path: "/install-orders/{install_order_id}"
    description: "Get an install order"
    roles: [Scheduler, Inspector, WarrantyAdmin]
    code: 200
    input: []
    output: InstallOrder
    side_effects: []

  - method: GET
    path: "/install-orders"
    description: "List install orders, filterable by job"
    roles: [Scheduler, Inspector, WarrantyAdmin]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: InstallOrder[]
    side_effects: []

  - method: POST
    path: "/install-orders/{install_order_id}/dispatch"
    description: "Dispatch a planned install (requires a CONFIRMED crew booking)"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallOrder
    side_effects: ["status PLANNED -> DISPATCHED", "increments version"]

  - method: POST
    path: "/install-orders/{install_order_id}/start"
    description: "Start (or restart after FAIL) the install"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallOrder
    side_effects: ["status DISPATCHED|FAILED -> IN_PROGRESS (requires current_utc >= scheduled_start when from DISPATCHED)", "increments version"]

  - method: POST
    path: "/install-orders/{install_order_id}/inspect-pass"
    description: "Quality inspection passes"
    roles: [Inspector]
    code: 200
    input: []
    output: InstallOrder
    side_effects: ["status IN_PROGRESS -> PASSED", "increments version"]

  - method: POST
    path: "/install-orders/{install_order_id}/inspect-fail"
    description: "Quality inspection fails, sending back for rework"
    roles: [Inspector]
    code: 200
    input: []
    output: InstallOrder
    side_effects: ["status IN_PROGRESS -> FAILED", "increments version"]

  - method: POST
    path: "/install-orders/{install_order_id}/complete"
    description: "Complete a passed install; reconciles final cost and warrants the job pathway"
    roles: [Scheduler]
    code: 200
    input: ["actual_drain_linear_ft?"]
    output: InstallOrder
    side_effects: ["status PASSED -> COMPLETED", "final_total_cents + variance_cents computed (install_reconciliation)", "Job.lifecycle_status SCHEDULED -> INSTALLED", "CrewBookings -> RELEASED", "increments versions"]

  - method: POST
    path: "/install-orders/{install_order_id}/cancel"
    description: "Cancel a planned/dispatched install, reverting the job to SOLD"
    roles: [Scheduler]
    code: 200
    input: []
    output: InstallOrder
    side_effects: ["status -> CANCELLED", "CrewBookings -> RELEASED", "Job.lifecycle_status SCHEDULED -> SOLD", "Job.install_order_id := null", "increments versions"]

  # ---- CrewBooking ----
  - method: POST
    path: "/crew-bookings"
    description: "Reserve a crew for an install order"
    roles: [Scheduler]
    code: 201
    input: [crew_id, install_order_id, window_start, window_end]
    output: CrewBooking
    side_effects: ["status=RESERVED"]

  - method: GET
    path: "/crew-bookings/{booking_id}"
    description: "Get a crew booking"
    roles: [Scheduler]
    code: 200
    input: []
    output: CrewBooking
    side_effects: []

  - method: GET
    path: "/crew-bookings"
    description: "List crew bookings, filterable by crew or install order"
    roles: [Scheduler]
    code: 200
    input: ["crew_id?", "install_order_id?", "status?", "limit?", "offset?"]
    output: CrewBooking[]
    side_effects: []

  - method: POST
    path: "/crew-bookings/{booking_id}/confirm"
    description: "Confirm a reserved booking (overlap + daily-capacity checks)"
    roles: [Scheduler]
    code: 200
    input: []
    output: CrewBooking
    side_effects: ["status RESERVED -> CONFIRMED", "increments version"]

  - method: POST
    path: "/crew-bookings/{booking_id}/release"
    description: "Release a reserved or confirmed booking"
    roles: [Scheduler]
    code: 200
    input: []
    output: CrewBooking
    side_effects: ["status -> RELEASED", "increments version"]

  # ---- Warranty ----
  - method: GET
    path: "/warranties/{warranty_id}"
    description: "Get a warranty"
    roles: [WarrantyAdmin, Homeowner]
    code: 200
    input: []
    output: Warranty
    side_effects: []

  - method: GET
    path: "/warranties"
    description: "List warranties, filterable by job"
    roles: [WarrantyAdmin, Homeowner]
    code: 200
    input: ["job_id?", "status?", "limit?", "offset?"]
    output: Warranty[]
    side_effects: []

  - method: POST
    path: "/warranties/{warranty_id}/transfer"
    description: "Transfer the warranty to a new holder (OCC-guarded on Warranty.version)"
    roles: [WarrantyAdmin]
    code: 200
    input: [new_holder_homeowner_id, expected_warranty_version]
    output: Warranty
    side_effects: ["holder_homeowner_id := new holder", "transfer_count += 1", "increments Warranty.version by 1"]

  - method: POST
    path: "/warranties/{warranty_id}/void"
    description: "Void a warranty (cancels scheduled service)"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: Warranty
    side_effects: ["status ACTIVE -> VOID", "SCHEDULED ServiceVisits -> CANCELLED", "increments versions"]

  - method: POST
    path: "/warranties/{warranty_id}/lapse"
    description: "Lapse a warranty whose annual service is overdue past grace"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: Warranty
    side_effects: ["status ACTIVE -> LAPSED (requires current_utc >= next_service_due + grace)", "increments version"]

  # ---- ServiceVisit ----
  - method: POST
    path: "/warranties/{warranty_id}/service-visits"
    description: "Schedule a service visit (ANNUAL or CLAIM_REPAIR); enforces the 7-day min-gap buffer against other SCHEDULED visits on the warranty"
    roles: [WarrantyAdmin]
    code: 201
    input: [visit_type, scheduled_for, "claim_id?"]
    output: ServiceVisit
    side_effects: ["status=SCHEDULED", "rejected with ERR_VISIT_TOO_CLOSE when within MIN_VISIT_GAP_DAYS of another SCHEDULED visit on the same warranty"]

  - method: GET
    path: "/service-visits/{visit_id}"
    description: "Get a service visit"
    roles: [WarrantyAdmin, Homeowner]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []

  - method: GET
    path: "/service-visits"
    description: "List service visits, filterable by warranty"
    roles: [WarrantyAdmin, Homeowner]
    code: 200
    input: ["warranty_id?", "status?", "visit_type?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []

  - method: POST
    path: "/service-visits/{visit_id}/complete"
    description: "Complete a service visit; ANNUAL resets service clock, CLAIM_REPAIR resolves the claim"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status SCHEDULED -> COMPLETED", "ANNUAL: Warranty.last_service_at + next_service_due updated", "CLAIM_REPAIR: referenced Claim IN_PROGRESS -> RESOLVED, Job.open_claim_count recomputed", "increments versions"]

  - method: POST
    path: "/service-visits/{visit_id}/cancel"
    description: "Cancel a scheduled service visit"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status SCHEDULED -> CANCELLED", "increments version"]

  # ---- Claim ----
  - method: POST
    path: "/claims"
    description: "File a callback/claim against a warranty"
    roles: [Homeowner, WarrantyAdmin]
    code: 201
    input: [job_id, warranty_id, category, description]
    output: Claim
    side_effects: ["status=OPEN", "Job.open_claim_count recomputed", "increments Job.version"]

  - method: GET
    path: "/claims/{claim_id}"
    description: "Get a claim"
    roles: [Homeowner, WarrantyAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims, filterable by job or warranty"
    roles: [Homeowner, WarrantyAdmin]
    code: 200
    input: ["job_id?", "warranty_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/claims/{claim_id}/triage"
    description: "Triage a claim: accept (-> IN_PROGRESS) or deny (-> DENIED)"
    roles: [WarrantyAdmin]
    code: 200
    input: [accept]
    output: Claim
    side_effects: ["accept=true: OPEN|REOPENED -> IN_PROGRESS (coverage checked)", "accept=false: OPEN -> DENIED", "Job.open_claim_count recomputed", "increments versions"]

  - method: POST
    path: "/claims/{claim_id}/reopen"
    description: "Reopen a resolved claim"
    roles: [Homeowner]
    code: 200
    input: []
    output: Claim
    side_effects: ["status RESOLVED -> REOPENED", "reopen_count += 1", "Job.open_claim_count recomputed", "increments versions"]

  # ---- FoundationReferral ----
  - method: POST
    path: "/jobs/{job_id}/foundation-referrals"
    description: "Draft a foundation-repair referral for a job"
    roles: [Inspector]
    code: 201
    input: [inspection_id, partner_name]
    output: FoundationReferral
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/foundation-referrals/{referral_id}"
    description: "Get a foundation referral"
    roles: [Inspector, Estimator]
    code: 200
    input: []
    output: FoundationReferral
    side_effects: []

  - method: GET
    path: "/foundation-referrals"
    description: "List foundation referrals, filterable by job or inspection"
    roles: [Inspector, Estimator]
    code: 200
    input: ["job_id?", "inspection_id?", "status?", "limit?", "offset?"]
    output: FoundationReferral[]
    side_effects: []

  - method: POST
    path: "/foundation-referrals/{referral_id}/send"
    description: "Send a draft referral (requires SEVERE finalized inspection)"
    roles: [Inspector]
    code: 200
    input: []
    output: FoundationReferral
    side_effects: ["status DRAFT -> SENT", "increments version"]

  - method: POST
    path: "/foundation-referrals/{referral_id}/resolve"
    description: "Resolve a sent referral (partner accepted or rejected)"
    roles: [Inspector]
    code: 200
    input: [outcome]
    output: FoundationReferral
    side_effects: ["status SENT -> ACCEPTED|REJECTED", "increments version"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "A body FK field references a non-existent resource of the expected type" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed required body field or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Quote accept attempted at or after the quote's expires_at" }
  - { id: ERR_CLAIM_NOT_COVERED, http: 422, condition: "Triage-accept on a claim whose category is not covered by the warranty (STRUCTURAL)" }
  - { id: ERR_REFERRAL_NOT_ELIGIBLE, http: 422, condition: "Foundation referral send when inspection is not FINALIZED with severity SEVERE" }
  - { id: ERR_BACKUP_REQUIRES_SUMP, http: 422, condition: "includes_battery_backup=true without includes_sump=true on the same quote" }
  - { id: ERR_FINANCING_UNRESOLVED, http: 409, condition: "Install order create while Job.financing_status not IN {CASH, APPROVED}" }
  - { id: ERR_FINANCE_LIMIT_EXCEEDED, http: 422, condition: "Approve a financing application whose amount exceeds the credit_band MAX_FINANCE ceiling" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Confirm a booking overlapping an existing CONFIRMED window [start,end) on the same crew" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 409, condition: "Confirm a booking exceeding the crew's daily_capacity of CONFIRMED bookings that day" }
  - { id: ERR_TRANSFER_LIMIT_REACHED, http: 422, condition: "Warranty transfer when transfer_count already at MAX_TRANSFERS" }
  - { id: ERR_VISIT_CLAIM_MISMATCH, http: 422, condition: "CLAIM_REPAIR visit without an IN_PROGRESS claim_id, or ANNUAL visit with a claim_id present" }
  - { id: ERR_VISIT_TOO_CLOSE, http: 409, condition: "New ServiceVisit scheduled within MIN_VISIT_GAP_DAYS of another SCHEDULED visit on the same warranty" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_CLOSE, http: 409, condition: "Job close while open_claim_count > 0" }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic business-rule field validation failure (e.g., footprint_sqft < 1, negative drain_linear_ft, invalid term_months)" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of allowed bounds (limit 1..100, offset >= 0)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Homeowner
    description: "The property owner; acts on their own jobs, quotes, financing, claims, warranties."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /quotes/{id}/accept — accept a quote"
      - "POST /quotes/{id}/decline — decline a quote"
      - "POST /jobs/{id}/pay-cash — elect cash payment"
      - "POST /financing-applications — submit financing"
      - "POST /financing-applications/{id}/withdraw — withdraw financing"
      - "POST /claims/{id}/reopen — reopen a resolved claim"
    shared_operations:
      - "POST /homeowners — register (shared with Estimator)"
      - "POST /jobs — create a job (shared with Estimator)"
      - "POST /claims — file a claim (shared with WarrantyAdmin)"
      - "GET endpoints on own jobs/quotes/inspections/financing/warranties/service-visits/claims"

  - name: Estimator
    description: "Sales/estimating operator; manages jobs, quotes, and lost-deal handling."
    identity: "opaque"
    exclusive_operations:
      - "POST /jobs/{id}/mark-lost — mark a job lost"
      - "POST /jobs/{id}/quotes — create a quote"
      - "POST /quotes/{id}/send — send a quote"
      - "POST /quotes/{id}/revise — revise a quote"
      - "POST /quotes/{id}/expire — expire a quote"
    shared_operations:
      - "POST /homeowners — register (shared with Homeowner)"
      - "POST /jobs — create a job (shared with Homeowner)"
      - "GET endpoints on jobs/quotes/inspections/foundation-referrals"

  - name: Inspector
    description: "Field inspector; runs assessments and foundation referrals, and quality-gates installs."
    identity: "opaque"
    exclusive_operations:
      - "POST /jobs/{id}/inspections — create inspection"
      - "POST /jobs/{id}/inspections/{id}/finalize — finalize inspection"
      - "POST /jobs/{id}/foundation-referrals — draft referral"
      - "POST /foundation-referrals/{id}/send — send referral"
      - "POST /foundation-referrals/{id}/resolve — resolve referral"
      - "POST /install-orders/{id}/inspect-pass — pass install QA"
      - "POST /install-orders/{id}/inspect-fail — fail install QA"
    shared_operations:
      - "GET endpoints on jobs/inspections/install-orders/foundation-referrals"

  - name: Scheduler
    description: "Operations scheduler; manages crews, crew bookings, and install order lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /crews — create crew"
      - "POST /jobs/{id}/install-orders — create install order"
      - "POST /install-orders/{id}/dispatch|start|complete|cancel — install lifecycle"
      - "POST /crew-bookings — reserve crew"
      - "POST /crew-bookings/{id}/confirm|release — booking lifecycle"
    shared_operations:
      - "POST /homeowners — register a homeowner on a customer's behalf (shared)"
      - "GET endpoints on jobs/install-orders/crews/crew-bookings"

  - name: WarrantyAdmin
    description: "Warranty/service operator; issues warranties, schedules service, triages claims, closes jobs."
    identity: "opaque"
    exclusive_operations:
      - "POST /jobs/{id}/warranty — issue warranty"
      - "POST /jobs/{id}/close — close job"
      - "POST /warranties/{id}/transfer|void|lapse — warranty lifecycle"
      - "POST /warranties/{id}/service-visits — schedule service"
      - "POST /service-visits/{id}/complete|cancel — service lifecycle"
      - "POST /claims/{id}/triage — triage claim"
    shared_operations:
      - "POST /homeowners — register a homeowner on a customer's behalf (shared)"
      - "POST /claims — file a claim (shared with Homeowner)"
      - "GET endpoints on jobs/warranties/service-visits/claims"

  - name: FinancePartner
    description: "External financing decisioning party; approves or declines applications."
    identity: "opaque"
    exclusive_operations:
      - "POST /financing-applications/{id}/decide — approve or decline financing"
    shared_operations:
      - "GET endpoints on financing-applications/jobs"
