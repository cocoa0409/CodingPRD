  - section: errors
    instances:
      - name: stub_annual_limit_exceeded_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_ANNUAL_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_fiscal_annual_limit_over_oversubscription
          rationale: "ERR_ANNUAL_LIMIT_EXCEEDED is triggered and asserted as the winning error in the named §1.8 priority-conflict instance."

      - name: stub_campaign_window_overlap_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAMPAIGN_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / campaign_window_closed_interval_overlap_on_offering
          rationale: "ERR_CAMPAIGN_WINDOW_OVERLAP is the asserted outcome of the named §1.8 temporal-overlap instance."

      - name: stub_update_quiet_period_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_UPDATE_QUIET_PERIOD]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / update_quiet_period_point_buffer_on_investor_update
          rationale: "ERR_UPDATE_QUIET_PERIOD is the asserted outcome of the named §1.8 quiet-period instance."

