            - { call: "POST /payment-integrity/edit-versions/${v1_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${v1_id}/approve", payload: { expected_edit_rule_version: "${rs2_v}", clinical_review_attestation: true }, as: EditApprover, as_user_id: approver-1 }
