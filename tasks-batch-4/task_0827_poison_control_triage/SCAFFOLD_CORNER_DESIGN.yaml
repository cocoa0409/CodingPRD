  - section: endpoints
    instances:
      - name: exposures_reverse_list_by_substance
        claim_type: Cross-reference link
        grounds: [entities.Exposure.fields.substance_id, endpoints]
        distinguishing_aspect: "GET /exposures?substance_id=X returns every exposure across cases that references substance X (FK reverse-reachability)."
        test_recipe:
          setup: ["Two cases, each with one acetaminophen exposure."]
          setup_api_calls:
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "c1" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case1: $.data.id }
            - call: "POST /exposure-cases/${case1}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 100, dose_range_high_mg: 200, time_since_exposure_hours: 1 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 7, patient_weight_kg: 22, patient_sex: "FEMALE", chief_complaint: "c2" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case2: $.data.id }
            - call: "POST /exposure-cases/${case2}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 300, dose_range_high_mg: 400, time_since_exposure_hours: 1 }
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "GET /exposures?substance_id=${sub_apap}"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
          assert:
            - "response total_count == 2 (both exposures reference the substance)"

