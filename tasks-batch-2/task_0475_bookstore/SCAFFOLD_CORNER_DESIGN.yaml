# =============================================================================
# Bookstore — Scaffold Corner Design (§1.9 breadth coverage)
# Walks claim-extraction-guide sections against SCAFFOLD.yaml §1.1-§1.7.
# excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_title_returns_201_with_computed_counts_zero
        claim_type: Creation
        grounds: [entities.Title, endpoints]
        distinguishing_aspect: "POST /titles with all required fields returns 201; on_hand_qty and reserved_qty default to 0; status ACTIVE."
        test_recipe:
          setup: ["Empty DB; clock default."]
          setup_api_calls: []
          trigger:
            - call: "POST /titles"
              payload: { isbn13: "9781111111111", name: "New Title", list_price_cents: 1500 }
              as: Bookseller
              captures: { t_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Title.${t_id}.on_hand_qty == 0"
            - "Title.${t_id}.reserved_qty == 0"
            - "Title.${t_id}.status == ACTIVE"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Member", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_title_missing_list_price_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Title.fields.list_price_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /titles omitting list_price_cents (input, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /titles"
              payload: { isbn13: "9782222222222", name: "No Price" }
              as: Bookseller
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_member_default_tier_regular_applied
        claim_type: Defaults
        grounds: [entities.Member.fields.tier]
        distinguishing_aspect: "POST /members omitting tier yields tier REGULAR (the declared default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "def@x.com", full_name: "Default Tier" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.tier == REGULAR"
            - "Member.${m_id}.store_credit_cents == 0"

      - name: title_computed_on_hand_after_stock_receive
        claim_type: Computed Fields
        grounds: [entities.Title.fields.on_hand_qty, endpoints]
        distinguishing_aspect: "Receiving 3 distributor copies makes Title.on_hand_qty == 3; client-supplied on_hand_qty is ignored (computed)."
        test_recipe:
          setup: ["Title T exists."]
          setup_api_calls:
            - call: "POST /titles"
              payload: { isbn13: "9783333333333", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 3 }
              as: Bookseller
          assert:
            - "Title.${t_id}.on_hand_qty == 3"

      - name: create_title_invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.Title.fields.category", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /titles with category 'MAGAZINE' (not BOOK|CAFE|SIDELINE) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /titles"
              payload: { isbn13: "9784444444444", name: "Bad Cat", category: "MAGAZINE", list_price_cents: 100 }
              as: Bookseller
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_isbn_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ISBN]"]
        distinguishing_aspect: "Creating a second Title with an isbn13 that already exists returns ERR_DUPLICATE_ISBN (409)."
        test_recipe:
          setup: ["Title with isbn13 9785555555555 exists."]
          setup_api_calls:
            - call: "POST /titles"
              payload: { isbn13: "9785555555555", name: "First", list_price_cents: 1000 }
              as: Bookseller
          trigger:
            - call: "POST /titles"
              payload: { isbn13: "9785555555555", name: "Dup", list_price_cents: 1200 }
              as: Bookseller
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_ISBN"

      - name: credit_ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.CreditLedgerEntry]
        distinguishing_aspect: "CreditLedgerEntry has common_fields:false — append-only ledger row with id+created_at, no update endpoint and no version field."
        test_recipe:
          setup: ["Member M with one ADJUSTMENT ledger row (delta 500)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "led@x.com", full_name: "Ledger" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/credit-adjustments"
              payload: { delta_cents: 500 }
              as: StoreAdmin
          trigger:
            - call: "GET /members/${m_id}/credit-ledger"
              payload: {}
              as: StoreAdmin
          assert:
            - "response.data is an array of length 1"
            - "response.data[0].delta_cents == 500"
            - "Member.${m_id}.store_credit_cents == 500"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_special_order_from_received_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.SpecialOrder.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A RECEIVED special order cannot be cancelled (cancel only defined from DRAFT/QUOTED) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Member M, Title T(list 2000), SpecialOrder SO DISTRIBUTOR taken DRAFT->QUOTED->CONFIRMED->RECEIVED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "so1@x.com", full_name: "SO One" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9786666666666", name: "T", list_price_cents: 2000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${m_id}", title_id: "${t_id}", quantity: 1, fulfillment_method: "DISTRIBUTOR" }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/quote"
              payload: {}
              as: Bookseller
            - call: "POST /special-orders/${so_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /special-orders/${so_id}/receive"
              payload: {}
              as: Bookseller
          trigger:
            - call: "POST /special-orders/${so_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: special_order_receive_creates_available_stock
        claim_type: Side Effect Execution
        grounds: [state_machines.SpecialOrder.CONFIRMED_to_RECEIVED, entities.Title.fields.on_hand_qty]
        distinguishing_aspect: "CONFIRMED->RECEIVED on a quantity-2 special order creates 2 AVAILABLE StockItems, raising Title.on_hand_qty by 2."
        test_recipe:
          setup: ["Member M, Title T (list 2000, on_hand 0), SpecialOrder q2 DISTRIBUTOR at CONFIRMED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "so2@x.com", full_name: "SO Two" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9787777777777", name: "T", list_price_cents: 2000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${m_id}", title_id: "${t_id}", quantity: 2, fulfillment_method: "DISTRIBUTOR" }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/quote"
              payload: {}
              as: Bookseller
            - call: "POST /special-orders/${so_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /special-orders/${so_id}/receive"
              payload: {}
              as: Bookseller
          assert:
            - "SpecialOrder.${so_id}.state == RECEIVED"
            - "Title.${t_id}.on_hand_qty == 2"

      - name: terminal_event_cancel_twice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.AuthorEvent.SCHEDULED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED AuthorEvent is terminal; a second cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Title T, future event E cancelled once."]
          setup_api_calls:
            - call: "POST /titles"
              payload: { isbn13: "9788888888888", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /author-events"
              payload: { title_id: "${t_id}", name: "E", starts_at: "2026-06-01T18:00:00Z", capacity: 5, base_price_cents: 1000 }
              as: Bookseller
              captures: { e_id: $.data.id }
            - call: "POST /author-events/${e_id}/cancel"
              payload: {}
              as: Bookseller
          trigger:
            - call: "POST /author-events/${e_id}/cancel"
              payload: {}
              as: Bookseller
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: special_order_revision_limit_blocks_fourth_revise
        claim_type: cyclic
        grounds: ["state_machines.SpecialOrder.QUOTED_to_DRAFT", "validations[priority=10]", "errors[ERR_REVISION_LIMIT]"]
        distinguishing_aspect: "After 3 QUOTED->DRAFT revisions (revision_count==3) a 4th revise is blocked with ERR_REVISION_LIMIT (422); the loop has a termination condition."
        test_recipe:
          setup: ["Member M, Title T(list 2000), SpecialOrder SO DISTRIBUTOR; revised 3 times (revision_count=3), currently QUOTED after a 4th quote."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "so3@x.com", full_name: "SO Three" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9789999999999", name: "T", list_price_cents: 2000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${m_id}", title_id: "${t_id}", quantity: 1, fulfillment_method: "DISTRIBUTOR" }
              as: Member
              as_user_id: "${m_id}"
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/quote"
              payload: {}
              as: Bookseller
            - call: "POST /special-orders/${so_id}/revise"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /special-orders/${so_id}/quote"
              payload: {}
              as: Bookseller
            - call: "POST /special-orders/${so_id}/revise"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /special-orders/${so_id}/quote"
              payload: {}
              as: Bookseller
            - call: "POST /special-orders/${so_id}/revise"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /special-orders/${so_id}/quote"
              payload: {}
              as: Bookseller
          trigger:
            - call: "POST /special-orders/${so_id}/revise"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_REVISION_LIMIT"
            - "SpecialOrder.${so_id}.revision_count == 3"

      - name: publisher_return_accept_removes_copies_permanently
        claim_type: Cross-entity
        grounds: [state_machines.PublisherReturn.SUBMITTED_to_ACCEPTED, entities.StockItem.fields.state]
        distinguishing_aspect: "ACCEPT flips the 2 reserved copies to RETURNED_TO_PUBLISHER permanently; on_hand_qty was already reduced at submit and stays reduced."
        test_recipe:
          setup: ["Returnable Title T (5 AVAILABLE), DRAFT return R q2, submitted (2 reserved, on_hand 3)."]
          setup_api_calls:
            - call: "POST /titles"
              payload: { isbn13: "9780000011111", name: "T", list_price_cents: 1000, returnable: true }
              as: InventoryManager
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 5 }
              as: InventoryManager
            - call: "POST /publisher-returns"
              payload: { title_id: "${t_id}", quantity: 2 }
              as: InventoryManager
              captures: { r_id: $.data.id, rv0: $.data.version }
            - call: "POST /publisher-returns/${r_id}/submit"
              payload: { expected_publisher_return_version: "${rv0}" }
              as: InventoryManager
          trigger:
            - call: "POST /publisher-returns/${r_id}/accept"
              payload: {}
              as: InventoryManager
          assert:
            - "PublisherReturn.${r_id}.state == ACCEPTED"
            - "Title.${t_id}.on_hand_qty == 3"
            - "Title.${t_id}.reserved_qty == 0"

      - name: order_initial_state_open_unpaid
        claim_type: Initial State
        grounds: [state_machines.SalesOrder.UNPAID_to_PAID, entities.SalesOrder.fields.payment_status]
        distinguishing_aspect: "A newly created SalesOrder starts payment_status UNPAID and fulfillment_status OPEN."
        test_recipe:
          setup: ["Member M."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "init@x.com", full_name: "Init" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
          assert:
            - "SalesOrder.${o_id}.payment_status == UNPAID"
            - "SalesOrder.${o_id}.fulfillment_status == OPEN"

      - name: consignment_terminate_returns_onshelf_copies
        claim_type: Cascade down
        grounds: [state_machines.ConsignmentAgreement.ACTIVE_to_TERMINATED, state_machines.ConsignmentCopy.ON_SHELF_to_SOLD, entities.ConsignmentCopy.fields.state]
        distinguishing_aspect: "Terminating an agreement with 2 ON_SHELF copies transitions both to RETURNED_TO_AUTHOR and removes their backing stock (Title.on_hand_qty drops to 0)."
        test_recipe:
          setup: ["Author AU(is_local_author), Title T, ACTIVE agreement AG with 2 ON_SHELF copies (on_hand 2)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "term@x.com", full_name: "Author T", is_local_author: true }
              as: Anonymous
              captures: { au_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000022222", name: "T", list_price_cents: 1500 }
              as: InventoryManager
              captures: { t_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { author_member_id: "${au_id}", title_id: "${t_id}" }
              as: InventoryManager
              captures: { ag_id: $.data.id }
            - call: "POST /consignment-agreements/${ag_id}/copies"
              payload: { sale_price_cents: 1500 }
              as: InventoryManager
            - call: "POST /consignment-agreements/${ag_id}/copies"
              payload: { sale_price_cents: 1500 }
              as: InventoryManager
          trigger:
            - call: "POST /consignment-agreements/${ag_id}/terminate"
              payload: {}
              as: InventoryManager
          assert:
            - "ConsignmentAgreement.${ag_id}.state == TERMINATED"
            - "Title.${t_id}.on_hand_qty == 0"

      - name: cancel_reserved_order_releases_stock_bubble
        claim_type: Compensation
        grounds: [state_machines.SalesOrder.RESERVED_to_CANCELLED, entities.Title.fields.on_hand_qty]
        distinguishing_aspect: "Cancelling a RESERVED order releases its reserved copies back to AVAILABLE (on_hand returns to its pre-reserve value)."
        test_recipe:
          setup: ["Member M, Title T (2 AVAILABLE), Order O line q2 reserved (on_hand 0)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "rel@x.com", full_name: "Rel" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000033333", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 2 }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, v0: $.data.version }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 2 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sales-orders/${o_id}/reserve"
              payload: { expected_sales_order_version: "${v0}" }
              as: Bookseller
          trigger:
            - call: "POST /sales-orders/${o_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "SalesOrder.${o_id}.fulfillment_status == CANCELLED"
            - "Title.${t_id}.on_hand_qty == 2"

  # ===========================================================================
  - section: calculations
    instances:
      - name: buyback_complete_issues_credit_and_stock
        claim_type: Correct Result
        grounds: [calculations.buyback_offer, state_machines.BuybackTransaction.OFFERED_to_COMPLETED, entities.Member.fields.store_credit_cents]
        distinguishing_aspect: "Single-line buyback (Title list 1000, GOOD, q2): offer = round(1000*0.30*0.70)=210 *2 = 420; complete issues +420 store credit and creates 2 BUYBACK stock items."
        test_recipe:
          setup: ["Member M (ACTIVE, credit 0), Title T (list 1000), buyback with one line GOOD q2, OFFERED."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "bb@x.com", full_name: "BB" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000044444", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /buybacks"
              payload: { member_id: "${m_id}" }
              as: Bookseller
              captures: { bb_id: $.data.id }
            - call: "POST /buybacks/${bb_id}/lines"
              payload: { title_id: "${t_id}", condition_grade: "GOOD", quantity: 2 }
              as: Bookseller
            - call: "POST /buybacks/${bb_id}/offer"
              payload: {}
              as: Bookseller
          trigger:
            - call: "POST /buybacks/${bb_id}/complete"
              payload: {}
              as: Bookseller
          assert:
            - "BuybackTransaction.${bb_id}.offer_total_cents == 420"
            - "Member.${m_id}.store_credit_cents == 420"
            - "Title.${t_id}.on_hand_qty == 2"

      - name: gold_member_discount_and_points_on_pay
        claim_type: Variant Selection
        grounds: [calculations.order_pricing, calculations.loyalty_points, entities.SalesOrder.fields.member_discount_cents]
        distinguishing_aspect: "GOLD member, subtotal 2000: member_discount=round(2000*0.05)=100, net_paid=1900, points_provisional=floor(1900/100)*2=38."
        test_recipe:
          setup: ["GOLD member M, Title T (list 1000) with 2 AVAILABLE, Order O line q2."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "gold@x.com", full_name: "Gold", tier: "GOLD" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn13: "9780000055555", name: "T", list_price_cents: 1000 }
              as: Bookseller
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 2 }
              as: Bookseller
            - call: "POST /sales-orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id }
            - call: "POST /sales-orders/${o_id}/lines"
              payload: { title_id: "${t_id}", quantity: 2 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /sales-orders/${o_id}/pay"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "SalesOrder.${o_id}.member_discount_cents == 100"
            - "SalesOrder.${o_id}.net_paid_cents == 1900"
            - "SalesOrder.${o_id}.points_provisional == 38"

      - name: return_credit_snapshot_at_submit
        claim_type: Correct Result
        grounds: [calculations.return_credit, state_machines.PublisherReturn.DRAFT_to_SUBMITTED, entities.PublisherReturn.fields.credit_total_cents]
        distinguishing_aspect: "Submit a return for q2 of a returnable Title list 1000: credit_unit=round(1000*0.50)=500, credit_total=1000."
        test_recipe:
          setup: ["Returnable Title T (list 1000) with 5 AVAILABLE, DRAFT return q2."]
          setup_api_calls:
            - call: "POST /titles"
              payload: { isbn13: "9780000066666", name: "T", list_price_cents: 1000, returnable: true }
              as: InventoryManager
              captures: { t_id: $.data.id }
            - call: "POST /titles/${t_id}/stock-items"
              payload: { quantity: 5 }
              as: InventoryManager
            - call: "POST /publisher-returns"
              payload: { title_id: "${t_id}", quantity: 2 }
              as: InventoryManager
              captures: { r_id: $.data.id, rv0: $.data.version }
          trigger:
            - call: "POST /publisher-returns/${r_id}/submit"
              payload: { expected_publisher_return_version: "${rv0}" }
              as: InventoryManager
          assert:
            - "PublisherReturn.${r_id}.credit_unit_cents == 500"
            - "PublisherReturn.${r_id}.credit_total_cents == 1000"

      - name: ticket_price_regular_normal_is_base
        claim_type: Constants Applied
        grounds: [calculations.ticket_price, entities.EventTicket.fields.price_paid_cents]
        distinguishing_aspect: "REGULAR member booking a NORMAL-demand event (base 2000): no surcharge, no discount -> price_paid_cents == 2000."
        test_recipe:
          setup: ["Clock default. REGULAR member M, NORMAL Title T, future event E base 2000 capacity 5."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "reg@x.com", full_name: "Reg", tier: "REGULAR" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /titles"
