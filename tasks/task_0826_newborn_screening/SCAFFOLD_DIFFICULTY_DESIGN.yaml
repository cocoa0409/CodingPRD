  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: specimen_create_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_CONSENT_REFUSED]
          - errors[ERR_COLLECTION_BEFORE_BIRTH]
        distinguishing_aspect: "A single specimen-create request violates both business_safety (consent REFUSED, priority 7) and business_temporal (collection before birth, priority 10) at once; the safety error ERR_CONSENT_REFUSED wins — pair (business_safety, business_temporal)."
        test_recipe:
          setup:
            - "Term infant whose consent has been REFUSED (the refusal mutation bumps Infant.version to 2)."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "General Hospital", facility_type: "HOSPITAL", state_region: "CA" }
              as: ProgramAdmin
              captures: { hosp_id: "$.data.id" }
            - call: "POST /nbs/infants"
              payload: { facility_id: "${hosp_id}", birth_datetime: "2026-02-27T06:00:00Z", gestational_age_weeks: 39, birth_weight_grams: 3200, sex: "F" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_id: "$.data.id" }
            - call: "POST /nbs/infants/${inf_id}/consent"
              payload: { decision: "REFUSAL", recorded_by: "parent" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { inf_v2: "$.data.version" }
          trigger:
            - call: "POST /nbs/specimens"
              payload: { infant_id: "${inf_id}", specimen_type: "INITIAL", collection_datetime: "2026-02-26T00:00:00Z", expected_infant_version: "${inf_v2}" }
              as: BirthFacilityUser
              as_user_id: "${hosp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CONSENT_REFUSED"

      - name: referral_create_referential_beats_constraint
        grounds:
          - validations[priority=8]
