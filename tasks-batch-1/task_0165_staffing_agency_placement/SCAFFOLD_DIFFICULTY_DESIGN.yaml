  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: placement_end_conserves_filled_count
        grounds:
          - state_machines.Submission.OFFER_EXTENDED_to_PLACED
          - state_machines.Placement.ACTIVE_to_ENDED
          - entities.JobOrder.fields.filled_count
        distinguishing_aspect: |
          Conserved quantity #1 (seat count): forward action (place -> filled_count += 1) paired with the
          compensating action (end -> filled_count -= 1) leaves the invariant JobOrder.filled_count ==
          count of the order's ACTIVE placements intact; after place-then-end, filled_count == 0 and the
          order is back to OPEN (no drift).
        test_recipe:
          setup:
            - "1-opening OPEN order; candidate placed and started (filled_count 1, JobOrder FILLED)."
          setup_api_calls:
            - call: "POST /staffing/skills"
              payload: { code: "JAVA", category: "TECH" }
              as: Recruiter
            - call: "POST /staffing/clients"
