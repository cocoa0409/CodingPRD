# =============================================================================
# Airline Frequent Flyer & Upgrade Program — difficulty design (test targeting index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules (§0.5).
# Every instance grounds in a declared element from SCAFFOLD.yaml.
# Numeric literals in `assert:` lines were computed by running the formulas in
# SCAFFOLD.yaml.calculations against the pinned `setup:` inputs.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: award_price_dynamic_vs_fixed_on_award_booking
        grounds:
          - calculations.award_price
          - calculations.award_price.variants.dynamic_mode
          - calculations.award_price.variants.fixed_mode
          - entities.AwardBooking.fields.pricing_mode
          - entities.AwardBooking.fields.points_cost
          - endpoints[POST /members/{memberId}/award-bookings]
        distinguishing_aspect: |
          Two valid algorithms (dynamic load-factor formula vs fixed region×cabin lookup)
          operate on the AwardBooking entity domain and produce DIFFERENT points_cost
          for identical Flight inputs. The Member's points_balance is unaffected at HELD
          but diverges by 5000 points the moment the booking CONFIRMS.
        test_recipe:
          setup:
            - "POST /flights {flight_number:AA100, origin:JFK, destination:LAX, distance_miles:1000, route_region:DOMESTIC, departure_at:'2026-12-01T10:00:00Z', base_fare_cents:50000, capacity_economy:10, capacity_business:2, capacity_first:1}  → flight F1"
            - "Pre-load 11 confirmed FlightSegments on F1 (8 ECONOMY + 2 BUSINESS + 1 FIRST under other members) so Flight.load_factor == 11/13 ≈ 0.846, which sits in [0.80, 0.95) → demand_mult = 1.5"
            - "POST /members {…}  → member M1 (BASIC tier, points_balance arranged via ADMIN_ADJUSTMENT to be exactly 100000)"
          trigger:
            - "POST /members/M1/award-bookings {flight_id:F1, cabin:ECONOMY, pricing_mode:DYNAMIC}  → booking B_DYNAMIC"
            - "POST /members/M1/award-bookings {flight_id:F1, cabin:ECONOMY, pricing_mode:FIXED}    → booking B_FIXED"
          assert:
            - "B_DYNAMIC.points_cost == 7500  (1000 miles * 5 points_per_mile * 1.5 demand * 1.0 cabin_mult)"
            - "B_FIXED.points_cost   == 12500 (FIXED_AWARD_TABLE.DOMESTIC.ECONOMY)"
            - "B_DYNAMIC.points_cost != B_FIXED.points_cost"
            - "After both booked at HELD, M1.points_balance == 100000 (no debit until CONFIRMED)"

      - name: tier_projected_vs_final_on_member
        grounds:
          - calculations.tier_evaluation
          - calculations.tier_evaluation.variants.final_awarded
          - calculations.tier_evaluation.variants.provisional_projected
          - entities.Member.fields.tier
          - entities.MembershipYear.fields.awarded_tier
          - endpoints[GET /members/{memberId}]
          - endpoints[POST /_sweep/annual-rollover]
        distinguishing_aspect: |
          Two valid algorithms on the Member entity domain — projected end-of-year tier
          (linear scaling of YTD) vs final awarded tier (frozen MembershipYear snapshot)
          — produce DIFFERENT tier values for the same Member at the same instant when
          the year is incomplete.  Different entity domain than instance 1
          (Member, not AwardBooking).
        test_recipe:
          setup:
            - "POST /_clock/advance until current date is exactly day 73 of year 2026 (≈ March 14, 2026)"
            - "Create member M2 (BASIC)"
            - "Fly 10 segments earning 5000 qualifying_points each → current_year_qualifying_points = 50000, current_year_qualifying_segments = 10"
          trigger:
            - "GET /members/M2  → returns provisional projected_tier_eoy"
            - "POST /_clock/advance to year-end; POST /_sweep/annual-rollover {target_year:2026}"
            - "GET /members/M2/membership-years  → returns MembershipYear snapshot"
          assert:
            - "GET response.projected_tier_eoy == PLATINUM  (projected_pts = floor(50000 * 365 / 73) = 250000 → >= 100000)"
            - "MembershipYear[year=2026].awarded_tier == GOLD  (final qualifying_points 50000 >= 50000 but < 100000, qualifying_segments 10 < 50)"
            - "M2.tier == GOLD after rollover (provisional was wrong)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: segment_accrual_four_input_nonlinear_mode_a
        grounds:
          - calculations.segment_accrual
          - entities.FlightSegment.fields.qualifying_points_earned
          - entities.Member.fields.tier
          - entities.Flight.fields.base_fare_cents
          - state_machines.FlightSegment.BOOKED_to_FLOWN
        distinguishing_aspect: |
          Mode (a): formula has FOUR inputs (base_dollars, fare_class_mult, tier_bonus_mult,
          MAX_PER_SEGMENT cap) with nested min/max — `max(MIN, min(MAX, base*class*tier))`.
          Cap binding is non-linear in inputs (kicks in only past 50000).
        test_recipe:
          setup:
            - "Create Flight F2 with base_fare_cents = 400000 ($4000), route_region=DOMESTIC, distance_miles=2000, capacity sufficient"
            - "Create Member M3 with tier=PLATINUM (via admin grant + activated status match)"
            - "Create FlightSegment S3 (member=M3, flight=F2, booked_cabin=FIRST)"
            - "POST /flights/F2/depart"
          trigger:
            - "POST /members/M3/segments/S3/mark-flown"
          assert:
            - "S3.qualifying_points_earned == 50000  (raw = 4000*12*2.0 = 96000, capped at MAX_PER_SEGMENT=50000)"
            - "M3.current_year_qualifying_points increased by exactly 50000 (NOT 96000)"
            - "M3.points_balance increased by exactly 50000"

      - name: gift_transfer_nested_rounding_mode_b
        grounds:
          - calculations.gift_transfer
          - entities.PointsTransaction.fields.points_delta
          - entities.PointsTransaction.fields.kind
          - endpoints[POST /members/{senderId}/gifts]
        distinguishing_aspect: |
          Mode (b): two valid rounding orders give DIFFERENT integer results.
          The scaffold pins "round per-fee FIRST, then subtract".
          At sent=2505: round-first gives delivered=2254;
          round-after-subtract (the wrong order) would give 2255.
          A correct implementation MUST produce 2254.
        test_recipe:
          setup:
            - "Create Member SENDER with points_balance = 10000 (via ADMIN_ADJUSTMENT)"
            - "Create Member RECIPIENT with points_balance = 0"
          trigger:
            - "POST /members/SENDER/gifts {recipient_member_id:RECIPIENT, amount:2505, idempotency_key:K1}"
          assert:
            - "Three PointsTransaction rows appended for SENDER/RECIPIENT scoped (GIFT_OUT on SENDER points_delta=-2505; GIFT_FEE on SENDER points_delta=0; GIFT_IN on RECIPIENT points_delta=+2254)"
            - "SENDER.points_balance == 10000 - 2505 == 7495"
            - "RECIPIENT.points_balance == 2254  (NOT 2255)"
            - "SENDER + RECIPIENT balances sum == 7495 + 2254 == 9749 (10000 - 251 fee)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: member_tier_cyclic_promote_then_demote
        grounds:
          - state_machines.Member  # field: tier
          - state_machines.Member.GOLD_to_PLATINUM
          - state_machines.Member.PLATINUM_to_GOLD
          - state_machines.Member.PLATINUM_to_BASIC
        distinguishing_aspect: |
          CYCLIC shape on Member entity: the same tier value can be re-entered.
          Member tier travels BASIC→GOLD→PLATINUM→GOLD via two annual rollovers
          (promotion in year N, demotion in year N+1). A purely linear A→B→C→D
          pipeline cannot model this.
        test_recipe:
          setup:
            - "Create Member M4 (initial tier=BASIC) at start of year 2026"
            - "Fly enough segments in 2026 to bank 100000 qualifying_points and 0 segments-of-interest"
            - "POST /_clock/advance to 2026-12-31 23:59"
          trigger:
            - "POST /_sweep/annual-rollover {target_year:2026}"
            - "Fly only 1 small segment in 2027 earning < 25000 qualifying_points; POST /_clock/advance to 2027-12-31; POST /_sweep/annual-rollover {target_year:2027}"
          assert:
            - "After first rollover: M4.tier == PLATINUM, MembershipYear[2026].awarded_tier == PLATINUM"
            - "After second rollover: M4.tier in {BASIC, SILVER, GOLD} — same enum the machine started in; specifically M4.tier == BASIC if the 2027 segment earned < 25000 qualifying_points"
            - "Both PLATINUM and BASIC states were visited by the SAME Member.tier field"

      - name: award_booking_branching_with_revert
        grounds:
          - state_machines.AwardBooking
          - state_machines.AwardBooking.HELD_to_CONFIRMED
          - state_machines.AwardBooking.HELD_to_EXPIRED
          - state_machines.AwardBooking.CONFIRMED_to_CANCELLED
          - state_machines.CompanionCertificate.RESERVED_to_ACTIVE
          - state_machines.CompanionCertificate.USED_to_ACTIVE
        distinguishing_aspect: |
          BRANCHING shape with revert on AwardBooking — a different entity than
          instance 1's Member. From HELD there are two divergent paths (CONFIRMED
          vs EXPIRED) with DIFFERENT side-effect sets (CONFIRMED debits points and
          USES certificate; EXPIRED releases certificate back to ACTIVE).
          From CONFIRMED, CANCELLED reverses the debit (compensation arrow).
        test_recipe:
          setup:
            - "Create Member M5 with points_balance=20000 and one ACTIVE CompanionCertificate C5"
            - "Create scheduled Flight F5 (route=DOMESTIC, cabin Economy available)"
          trigger:
            - "POST /members/M5/award-bookings {flight_id:F5, cabin:ECONOMY, pricing_mode:FIXED, companion_certificate_id:C5}  → B5 HELD, C5 RESERVED"
            - "POST /members/M5/award-bookings/B5/confirm  → B5 CONFIRMED, C5 USED, points_balance -= 12500"
            - "POST /members/M5/award-bookings/B5/cancel   → B5 CANCELLED→REFUNDED, C5 reverts to ACTIVE, points_balance += 12500"
          assert:
            - "After cancel: B5.status in {CANCELLED, REFUNDED}"
            - "After cancel: C5.status == ACTIVE  (revert from USED)"
            - "After cancel: M5.points_balance == 20000 (back to original)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: flown_segment_three_hop_chain_to_upgrade_priority
        grounds:
          - state_machines.FlightSegment.BOOKED_to_FLOWN
          - calculations.segment_accrual
          - calculations.tier_evaluation
          - calculations.upgrade_priority_score
          - entities.PointsTransaction
          - entities.Member.fields.tier
          - entities.UpgradeRequest.fields.priority_score
        distinguishing_aspect: |
          Depth-4 transitive chain ORIGINATING in FlightSegment BOOKED→FLOWN:
            (1) FLOWN appends PointsTransaction ACCRUAL  →
            (2) ACCRUAL itself bumps Member.current_year_qualifying_points AND points_balance →
            (3) the bumped current_year_qualifying_points crosses the GOLD threshold, so the
                NEXT tier_evaluation read returns provisional GOLD and the annual rollover
                later flips Member.tier from SILVER to GOLD →
            (4) the Member.tier change itself recomputes priority_score on a pre-existing
                WAITLISTED UpgradeRequest of this member, raising its score by 10_000_000.
          Each hop is caused by the prior hop, not by the original mark-flown call directly.
        test_recipe:
          setup:
            - "Create Member M6 (tier=SILVER, current_year_qualifying_points=49000)"
            - "Create scheduled Flight F6 (base_fare_cents=20000, capacity sufficient, route=DOMESTIC)"
            - "Book FlightSegment S6 (M6, F6, ECONOMY)"
            - "Create another scheduled Flight F7 with capacity_first=1 and pre-load a separate UpgradeRequest UR6 (M6 on a different booked segment, target_cabin=FIRST, points_offered=5000, waitlist_join_seq=7)"
            - "Before mark-flown: UR6.priority_score == 1*10_000_000 + 5000 - 7 == 10_004_993"
            - "POST /flights/F6/depart"
          trigger:
            - "POST /members/M6/segments/S6/mark-flown"
            - "POST /_clock/advance to 2026-12-31; POST /_sweep/annual-rollover {target_year:2026}"
          assert:
            - "After mark-flown: an ACCRUAL row exists with points_delta == 1250 (base_dollars=200, fare_class_mult=5 ECONOMY, tier_bonus_mult=1.25 SILVER → raw=1250; min/max bracket leaves 1250 unchanged)"
            - "After mark-flown: M6.current_year_qualifying_points == 49000 + 1250 == 50250"
            - "After rollover: M6.tier == GOLD"
            - "After rollover: UR6.priority_score == 2*10_000_000 + 5000 - 7 == 20_004_993  (rose by exactly 10_000_000)"

      - name: award_cancel_three_hop_refund_and_certificate_restoration
        grounds:
          - state_machines.AwardBooking.CONFIRMED_to_CANCELLED
          - state_machines.CompanionCertificate.USED_to_ACTIVE
          - entities.PointsTransaction.fields.kind  # REDEMPTION_REFUND
          - calculations.points_balance_conservation
          - entities.FlightSegment.fields.status  # cascading CANCELLED
        distinguishing_aspect: |
          Depth-3 transitive chain ORIGINATING in AwardBooking CONFIRMED→CANCELLED
          (a DIFFERENT trigger than instance 1):
            (1) CANCELLED appends PointsTransaction REDEMPTION_REFUND →
            (2) the new ledger row itself updates Member.points_balance (the cascade is
                'append ledger → recompute balance', not 'cancel directly mutates balance') →
            (3) the same CANCELLED transition's cascade flips the linked FlightSegment
                CANCELLED and that linked-segment update itself flips CompanionCertificate
                USED→ACTIVE (if now < expires_at).
        test_recipe:
          setup:
            - "Create Member M7 with points_balance=30000 and one ACTIVE CompanionCertificate C7 (expires_at = now + 6 months)"
            - "Create scheduled Flight F7 (route_region=INTERNATIONAL, cabin Business available)"
            - "POST /members/M7/award-bookings {flight_id:F7, cabin:BUSINESS, pricing_mode:FIXED, companion_certificate_id:C7} → B7 HELD, C7 RESERVED"
            - "POST /members/M7/award-bookings/B7/confirm → B7 CONFIRMED, FlightSegment S7 created BOOKED, points_balance -= 70000? No — 30000 < 70000 would fail; reset: ADMIN_ADJUSTMENT to give M7 80000 points before HELD"
            - "After confirm: M7.points_balance == 80000 - 70000 == 10000, C7.status == USED, S7.status == BOOKED"
          trigger:
            - "POST /members/M7/award-bookings/B7/cancel"
          assert:
            - "A REDEMPTION_REFUND row exists with points_delta == +70000 (hop 1)"
            - "M7.points_balance == 80000 (back to pre-confirm) (hop 2: ledger → balance)"
            - "S7.status == CANCELLED (hop 3a: linked-segment cascade)"
            - "C7.status == ACTIVE (hop 3b: certificate restoration cascade, now < C7.expires_at)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_award_confirm
        grounds:
          - validations[priority=4]   # state
          - validations[priority=8]   # business_fiscal
          - errors.ERR_BOOKING_NOT_HOLDABLE
          - errors.ERR_INSUFFICIENT_POINTS
          - endpoints[POST /members/{memberId}/award-bookings/{bookingId}/confirm]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): a booking already CONFIRMED
          earlier (so it is no longer HELD) AND the member's points_balance is now
          below points_cost. Two failures fire simultaneously; the lower-priority
          number (4 = state) wins. The returned error MUST be
          ERR_BOOKING_NOT_HOLDABLE, NOT ERR_INSUFFICIENT_POINTS.
        test_recipe:
          setup:
            - "Create Member M8 with points_balance=20000"
            - "Create scheduled Flight F8 (route=DOMESTIC, capacity for ECONOMY available)"
            - "POST /members/M8/award-bookings {flight_id:F8, cabin:ECONOMY, pricing_mode:FIXED} → B8 HELD, points_cost = 12500"
            - "POST /members/M8/award-bookings/B8/confirm → B8 CONFIRMED, M8.points_balance = 7500"
            - "Admin POST /members/M8/points-transactions/adjustments {points_delta:-7500, reason:'test'} → M8.points_balance = 0"
          trigger:
            - "POST /members/M8/award-bookings/B8/confirm   (second time, on now-CONFIRMED B8 with 0 points)"
          assert:
            - "HTTP 409, error_id == ERR_BOOKING_NOT_HOLDABLE  (priority 4 — state)"
            - "error_id != ERR_INSUFFICIENT_POINTS (priority 8 — fiscal — must NOT win)"

      - name: referential_beats_constraint_on_upgrade_request
        grounds:
          - validations[priority=5]   # business_referential (tier check)
          - validations[priority=7]   # business_constraint (inventory)
          - errors.ERR_MEMBER_TIER_INELIGIBLE
          - errors.ERR_UPGRADE_INVENTORY_EXHAUSTED
          - endpoints[POST /upgrades/{upgradeRequestId}/confirm]
        distinguishing_aspect: |
          Error-category pair (business_referential, business_constraint) — a DIFFERENT pair
          from instance 1 (state, business_fiscal). A SILVER member (below GOLD)
          tries to confirm an upgrade on a Flight whose upgrade_inventory_first == 0.
          Two failures fire; lower priority (5 referential) wins.
        test_recipe:
          setup:
            - "Create Member M9 with tier=SILVER (forced via STATUS_MATCH activation)"
            - "Create Flight F9 with capacity_first=0 → upgrade_inventory_first = 0"
            - "Create FlightSegment S9 (M9, F9, BUSINESS)"
            - "Create UpgradeRequest UR9 (S9, target_cabin=FIRST, points_offered=1000) → WAITLISTED"
          trigger:
            - "POST /upgrades/UR9/confirm  (admin override; both checks fail)"
          assert:
            - "HTTP 403, error_id == ERR_MEMBER_TIER_INELIGIBLE  (priority 5 — referential)"
            - "error_id != ERR_UPGRADE_INVENTORY_EXHAUSTED       (priority 7 — constraint — must NOT win)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: platinum_threshold_ge_not_gt_on_annual_rollover
        grounds:
          - calculations.tier_evaluation
          - calculations.tier_evaluation.variants.final_awarded
          - endpoints[POST /_sweep/annual-rollover]
          - entities.Member.fields.tier
          - entities.MembershipYear.fields.awarded_tier
        distinguishing_aspect: |
          Numeric threshold boundary on Member.qualifying_points_final.
          The ladder uses `>= 100000` (NOT `> 100000`). At exactly 100000 → PLATINUM;
          at 99999 → GOLD. Reached via the annual-rollover endpoint.
        test_recipe:
          setup:
            - "Create Member M_A (tier=BASIC), accumulate exactly current_year_qualifying_points = 100000 via FLOWN segments"
            - "Create Member M_B (tier=BASIC), accumulate exactly 99999 (one segment short)"
            - "POST /_clock/advance to 2026-12-31; POST /_sweep/annual-rollover {target_year:2026}"
          trigger:
            - "GET /members/M_A; GET /members/M_B"
            - "GET /members/M_A/membership-years; GET /members/M_B/membership-years"
          assert:
            - "M_A.tier == PLATINUM, MembershipYear[2026].awarded_tier == PLATINUM (100000 reaches the >= bar)"
            - "M_B.tier == GOLD,     MembershipYear[2026].awarded_tier == GOLD     (99999 misses)"

      - name: upgrade_inventory_empty_set_boundary_on_confirm
        grounds:
          - state_machines.UpgradeRequest.WAITLISTED_to_CONFIRMED
          - entities.Flight.fields.upgrade_inventory_first
          - errors.ERR_UPGRADE_INVENTORY_EXHAUSTED
          - endpoints[POST /upgrades/{upgradeRequestId}/confirm]
        distinguishing_aspect: |
          Different metric (collection emptiness, not a numeric threshold) and a
          different endpoint than instance 1. inventory == 0 (the empty case) is
          treated as the rejection boundary; inventory == 1 succeeds.
        test_recipe:
          setup:
            - "Create Member M_C with tier=PLATINUM and points_balance=50000"
            - "Create Flight F_C with capacity_first = 1 → upgrade_inventory_first = 1"
            - "Create FlightSegment S_C1 (different member M_D, F_C, BUSINESS) and pre-confirm an upgrade to FIRST so upgrade_inventory_first = 0"
            - "Create FlightSegment S_C2 (M_C, F_C, BUSINESS)"
            - "Create UpgradeRequest UR_C (S_C2, target_cabin=FIRST, points_offered=10000) → WAITLISTED"
          trigger:
            - "POST /upgrades/UR_C/confirm"
          assert:
            - "HTTP 409, error_id == ERR_UPGRADE_INVENTORY_EXHAUSTED  (inventory was exactly 0 — the empty-set boundary)"
            - "UR_C.status remains WAITLISTED, M_C.points_balance unchanged at 50000"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: upgrade_request_on_member_tier
        grounds:
          - state_machines.UpgradeRequest.WAITLISTED_to_CONFIRMED
          - validations[priority=5]
          - entities.UpgradeRequest.fields.member_id
          - entities.Member.fields.tier
        distinguishing_aspect: |
          Cross-entity pair (UpgradeRequest, Member): UpgradeRequest WAITLISTED→CONFIRMED
          requires Member.tier >= GOLD. The transition's validity depends on the
          referenced Member entity's tier value.
        test_recipe:
          setup:
            - "Create Member M_E (tier=BASIC); create Flight F_E with capacity_first=2 → upgrade_inventory_first=2"
            - "Create FlightSegment S_E (M_E, F_E, BUSINESS)"
            - "Create UpgradeRequest UR_E (S_E, target_cabin=FIRST, points_offered=5000) → WAITLISTED"
          trigger:
            - "POST /upgrades/UR_E/confirm  (tier too low)"
            - "Activate a status-match to flip M_E.tier → GOLD"
            - "POST /upgrades/UR_E/confirm  (retry — tier now eligible)"
          assert:
            - "First confirm: HTTP 403 ERR_MEMBER_TIER_INELIGIBLE"
            - "Second confirm: HTTP 200, UR_E.status == CONFIRMED, M_E.points_balance debited by 5000"

      - name: award_booking_on_flight_status
        grounds:
          - state_machines.AwardBooking.HELD_to_CONFIRMED
          - validations[priority=4]
          - entities.AwardBooking.fields.flight_id
          - entities.Flight.fields.status
          - errors.ERR_FLIGHT_NOT_BOOKABLE
        distinguishing_aspect: |
          Cross-entity pair (AwardBooking, Flight) — a DIFFERENT pair than
          (UpgradeRequest, Member). AwardBooking HELD→CONFIRMED requires the
          referenced Flight to still be SCHEDULED. If the Flight has flipped to
          DEPARTED or CANCELLED, the AwardBooking transition is rejected.
        test_recipe:
          setup:
            - "Create Member M_F with points_balance=50000"
            - "Create scheduled Flight F_F (route=DOMESTIC, capacity for ECONOMY available)"
            - "POST /members/M_F/award-bookings {flight_id:F_F, cabin:ECONOMY, pricing_mode:FIXED} → B_F HELD"
          trigger:
            - "POST /flights/F_F/cancel  (admin cancels the flight)"
            - "POST /members/M_F/award-bookings/B_F/confirm"
          assert:
            - "Second call: HTTP 409, error_id == ERR_FLIGHT_NOT_BOOKABLE"
            - "B_F.status remains HELD, M_F.points_balance unchanged at 50000"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: status_match_cooling_off_window_36_months
        grounds:
          - state_machines.StatusMatchRequest.PENDING_to_APPROVED
          - entities.StatusMatchRequest.fields.cooling_off_until
          - errors.ERR_STATUS_MATCH_COOLING_OFF
        distinguishing_aspect: |
          Interval semantics #1 — cooling-off PERIOD with a single FORWARD-LOOKING
          point check: any new StatusMatchRequest approval is rejected while
          (now < prior.cooling_off_until). The 36-month interval is "rejection-zone
          from approval instant"; there is no second interval to merge with.
          Resource: StatusMatchRequest on a Member.
        test_recipe:
          setup:
            - "Create Member M_G"
            - "Submit StatusMatchRequest SMR1, ProgramAdmin approves it at clock t0; cooling_off_until = t0 + 36 months"
            - "POST /_clock/advance by exactly 35 months → now == t0 + 35 months (still < cooling_off_until)"
            - "Submit StatusMatchRequest SMR2 (PENDING)"
          trigger:
            - "POST /members/M_G/status-match-requests/SMR2/approve"
            - "POST /_clock/advance by 1 additional month (so now == t0 + 36 months) — exact boundary"
            - "POST /members/M_G/status-match-requests/SMR2/approve  (retry at boundary; cooling_off_until uses strict <, so now == cooling_off_until passes)"
          assert:
            - "First approve attempt: HTTP 409, error_id == ERR_STATUS_MATCH_COOLING_OFF"
            - "Second approve attempt (at exact boundary t0+36m): HTTP 200, SMR2.status == APPROVED"

      - name: companion_certificate_half_open_validity_window
        grounds:
          - state_machines.CompanionCertificate.ACTIVE_to_RESERVED
          - entities.CompanionCertificate.fields.issued_at
          - entities.CompanionCertificate.fields.expires_at
          - errors.ERR_CERTIFICATE_EXPIRED
        distinguishing_aspect: |
          Interval semantics #2 — DIFFERENT from instance 1. The certificate
          carries a half-open VALIDITY INTERVAL [issued_at, expires_at) and the
          booking moment must lie INSIDE that interval (containment check), not
          outside it (rejection-zone check).  Different resource (CompanionCertificate
          vs StatusMatchRequest) AND different geometric treatment (containment
          inside half-open window vs forward-looking strict-less-than).
        test_recipe:
          setup:
            - "Create Member M_H with tier=PLATINUM and points_balance=50000"
            - "Admin grants CompanionCertificate C_H at t0; issued_at=t0, expires_at=t0+12 months"
            - "Create scheduled Flight F_H (route=DOMESTIC, capacity for BUSINESS available)"
            - "POST /_clock/advance to exactly t0 + 12 months  (now == expires_at, the closed end)"
          trigger:
            - "POST /members/M_H/award-bookings {flight_id:F_H, cabin:BUSINESS, pricing_mode:FIXED, companion_certificate_id:C_H}"
            - "POST /_clock/advance back to t0 + 6 months by creating a NEW member/cert and resetting — alternatively: at t0 + 6 months exactly, repeat the booking with a fresh certificate C_H2 (issued_at=now-1 month, expires_at=now+11 months)"
          assert:
            - "First call (now == expires_at): HTTP 409, error_id == ERR_CERTIFICATE_EXPIRED  (half-open: expires_at NOT included)"
            - "Second call (now strictly inside the window): HTTP 201, certificate C_H2.status == RESERVED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: points_balance_conserved_under_book_then_cancel
        grounds:
          - state_machines.AwardBooking.HELD_to_CONFIRMED
          - state_machines.AwardBooking.CONFIRMED_to_CANCELLED
          - calculations.points_balance_conservation
          - entities.Member.fields.points_balance
          - entities.PointsTransaction.fields.kind  # REDEMPTION + REDEMPTION_REFUND
        distinguishing_aspect: |
          Conserved quantity #1 — Member.points_balance (the points-currency total).
          Forward action: AwardBooking confirm; compensating action: cancel.
          Pinned formula: post_balance == pre_balance, exactly.
        test_recipe:
          setup:
            - "Create Member M_I with points_balance = 50_000 (via ADMIN_ADJUSTMENT)"
            - "Record pre_balance = 50_000"
            - "Create scheduled Flight F_I (route=DOMESTIC, capacity for ECONOMY available)"
            - "POST /members/M_I/award-bookings {flight_id:F_I, cabin:ECONOMY, pricing_mode:FIXED} → B_I HELD, points_cost == 12500"
            - "POST /members/M_I/award-bookings/B_I/confirm → M_I.points_balance == 37_500"
          trigger:
            - "POST /members/M_I/award-bookings/B_I/cancel"
          assert:
            - "M_I.points_balance == 50_000  (exactly equal to pre_balance)"
            - "Ledger contains exactly one REDEMPTION (-12500) and one REDEMPTION_REFUND (+12500) tied to B_I.id"
            - "Sum over all PointsTransaction.points_delta for M_I == 50_000 (matches Member.points_balance by points_balance_conservation)"

      - name: qualifying_segments_conserved_under_fly_then_refund
        grounds:
          - state_machines.FlightSegment.BOOKED_to_FLOWN
          - state_machines.FlightSegment.FLOWN_to_REFUNDED
          - calculations.qualifying_segment_reversal
          - entities.Member.fields.current_year_qualifying_segments
          - entities.Member.fields.current_year_qualifying_points
        distinguishing_aspect: |
          Conserved quantity #2 — Member.current_year_qualifying_segments (a
          DIFFERENT quantity than points_balance — counts of flown segments, not
          points-currency). Forward action: mark-flown; compensating action: refund.
          Pinned formula: post_count == pre_count AND post_qpoints == pre_qpoints.
        test_recipe:
          setup:
            - "Create Member M_J (tier=SILVER), pre_qsegments = M_J.current_year_qualifying_segments = 4, pre_qpoints = M_J.current_year_qualifying_points = 6000"
            - "Create scheduled Flight F_J (base_fare_cents=20000, route=DOMESTIC), capacity sufficient"
            - "Create FlightSegment S_J (M_J, F_J, ECONOMY) → BOOKED"
            - "POST /flights/F_J/depart"
            - "POST /members/M_J/segments/S_J/mark-flown → S_J.qualifying_points_earned == 1250 (200*5*1.25), M_J.current_year_qualifying_segments == 5, M_J.current_year_qualifying_points == 7250"
          trigger:
            - "POST /members/M_J/segments/S_J/refund"
          assert:
            - "M_J.current_year_qualifying_segments == 4  (back to pre_qsegments)"
            - "M_J.current_year_qualifying_points   == 6000  (back to pre_qpoints)"
            - "Ledger contains a NEGATIVE ACCRUAL row with points_delta == -1250 paired with the original ACCRUAL +1250"
