scenario: "Community Paramedicine / Mobile Integrated Health (MIH): high-utilizer referral & enrollment, home-visit & care plan, telehealth vitals/assessment, medication reconciliation, ED-diversion & readmission tracking, social-needs referral, cost/outcome, payer-pilot billing"
domain_name: "community-paramedicine-mih"
api_prefix: "/mih"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  # flat: peer entities linked by explicit foreign keys; no nesting beyond
  # action sub-paths. Chosen for diversity (0% in current examples).
  state_machine_shape: cyclic
  # CarePlan (ACTIVE <-> UNDER_REVISION) and BillingClaim (SUBMITTED ->
  # DENIED -> SUBMITTED) both loop; Referral branches; several linear.
  relationship_patterns:
    - one_to_many          # PilotProgram -> Enrollment; Enrollment -> HomeVisit
    - cross_aggregate      # BillingClaim references PilotProgram + Payer + Enrollment
    - polymorphic: false
  role_model: segregation_of_duties
  # A CarePlan's authoring clinician cannot also be its HIGH-risk co-signer.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Payer organization name"
      - name: payer_type
        type: enum
        source: input
        description: "Kind of payer"
        constraints: "one of {MEDICARE, MEDICAID, COMMERCIAL}"

  - name: PilotProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Pilot program name"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id; the payer sponsoring this pilot"
      - name: status
        type: enum
        source: computed
        description: "Program lifecycle; set by state machine"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, CLOSED}"
      - name: budget_cap_cents
        type: integer
        source: input
        description: "Total dollars (in cents) the pilot may commit"
      - name: available_budget_cents
        type: integer
        source: computed
        description: "Uncommitted budget; initialized to budget_cap_cents, debited on claim submit, credited back on claim denial"
      - name: committed_spend_cents
        type: integer
        source: computed
        description: "Budget currently committed to submitted/paid claims; initialized to 0"
      - name: enrollment_cap
        type: integer
        source: input
        description: "Maximum simultaneously-ACTIVE enrollments"
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "Count of enrollments currently in ACTIVE status; initialized to 0"
      - name: remaining_slots
        type: integer
        source: computed
        description: "enrollment_cap minus active_enrollment_count; initialized to enrollment_cap"
      - name: per_visit_rate_cents
        type: integer
        source: input
        description: "Reimbursement per completed HomeVisit"
      - name: per_telehealth_rate_cents
        type: integer
        source: input
        description: "Reimbursement per completed TelehealthSession"
      - name: diversion_bonus_cents
        type: integer
        source: input
        description: "Flat bonus added to a claim when ED-diversion target is met"
      - name: readmission_penalty_cents
        type: integer
        source: input
        description: "Flat penalty subtracted from a claim when a readmission occurred in the period"
      - name: diversion_target_max_ed_visits
        type: integer
        source: input
        description: "Diversion is achieved when actual ED_VISIT count in the claim period is <= this value"
      - name: avg_ed_cost_cents
        type: integer
        source: input
        description: "Assumed average cost of one ED visit, used by cost-outcome savings"
      - name: diversion_credit_pct
        type: number
        source: input
        description: "Fraction of avg_ed_cost credited as savings per averted ED visit (0..1)"
      - name: start_date
        type: datetime
        source: input
        description: "Pilot start (informational)"
      - name: end_date
        type: datetime
        source: input
        description: "Pilot end (informational)"

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Staff member name"
      - name: provider_type
        type: enum
        source: input
        description: "Staff role"
        constraints: "one of {PARAMEDIC, CLINICIAN, COORDINATOR, BILLER}"
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier"
      - name: active
        type: boolean
        source: input
        description: "Whether the provider may be assigned"
        default: true

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient name"
      - name: date_of_birth
        type: string
        source: input
        description: "YYYY-MM-DD"
      - name: baseline_ed_visits_12mo
        type: integer
        source: input
        description: "ED visits in the 12 months prior to enrollment (utilization baseline)"
      - name: chronic_conditions_count
        type: integer
        source: input
        description: "Number of active chronic conditions"
      - name: consent_on_file
        type: boolean
        source: input
        description: "Whether MIH consent is signed"
        default: false
      - name: risk_score
        type: integer
        source: computed
        description: "Derived utilization risk score; see calculations.patient_risk_score. Recomputed when an EDEvent is created for this patient"
      - name: risk_tier
        type: enum
        source: computed
        description: "Banded from risk_score"
        constraints: "one of {LOW, MODERATE, HIGH}"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: program_id
        type: string
        source: input
        description: "FK -> PilotProgram.id"
      - name: referring_source
        type: enum
        source: input
        description: "Where the referral originated"
        constraints: "one of {ED, HOSPITAL, PCP, SELF}"
      - name: status
        type: enum
        source: computed
        description: "Referral lifecycle; set by state machine"
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, SCREENED, ACCEPTED, DECLINED}"
      - name: screened_risk_tier
        type: enum
        source: computed
        description: "Snapshot of Patient.risk_tier taken at screen time"
        constraints: "one of {LOW, MODERATE, HIGH}"
      - name: decline_reason
        type: string
        source: input
        description: "Reason captured when declined"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: program_id
        type: string
        source: input
        description: "FK -> PilotProgram.id"
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the accepted referral that produced this enrollment"
      - name: status
        type: enum
        source: computed
        description: "Enrollment lifecycle; set by state machine"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, DISCHARGED, WITHDRAWN}"
      - name: enrolled_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the referral was accepted"
      - name: discharged_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when discharged/withdrawn"
      - name: billed_amount_cents
        type: integer
        source: computed
        description: "Sum of amount_cents across this enrollment's PAID claims; initialized to 0"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times a CarePlan for this enrollment entered UNDER_REVISION; initialized to 0"
      - name: needs_review
        type: boolean
        source: computed
        description: "Set true when a MedReconciliation flag forces the active CarePlan under revision; initialized to false"

  - name: CarePlan
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: authoring_clinician_id
        type: string
        source: input
        description: "FK -> Provider.id; the clinician who authored the plan (must be provider_type CLINICIAN)"
      - name: cosigner_clinician_id
        type: string
        source: input
        description: "FK -> Provider.id; second clinician who co-signs a HIGH-risk plan (must differ from authoring_clinician_id)"
      - name: risk_level
        type: enum
        source: input
        description: "Clinical acuity of the plan"
        constraints: "one of {LOW, MODERATE, HIGH}"
      - name: goals
        type: string
        source: input
        description: "Free-text care goals"
      - name: status
        type: enum
        source: computed
        description: "Care-plan lifecycle; set by state machine"
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, UNDER_REVISION, CLOSED}"

  - name: HomeVisit
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; the plan this visit is scheduled under (must be ACTIVE at schedule time)"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the paramedic performing the visit (must be provider_type PARAMEDIC)"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Visit window start (ISO 8601 UTC)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Visit window end (ISO 8601 UTC); must be strictly after scheduled_start"
      - name: status
        type: enum
        source: computed
        description: "Visit lifecycle; set by state machine"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED, NO_SHOW}"
      - name: systolic_bp
        type: integer
        source: input
        description: "Recorded at completion"
      - name: diastolic_bp
        type: integer
        source: input
        description: "Recorded at completion"
      - name: heart_rate
        type: integer
        source: input
        description: "Recorded at completion"
      - name: billable
        type: boolean
        source: computed
        description: "Set true when the visit is COMPLETED; initialized false"

  - name: TelehealthSession
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient (occupancy resource for buffer-overlap checks)"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the clinician running the session (must be provider_type CLINICIAN)"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Session window start (ISO 8601 UTC)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "Session window end (ISO 8601 UTC); must be strictly after scheduled_start"
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle; set by state machine"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: systolic_bp
        type: integer
        source: input
        description: "Recorded at completion"
      - name: diastolic_bp
        type: integer
        source: input
        description: "Recorded at completion"
      - name: heart_rate
        type: integer
        source: input
        description: "Recorded at completion"
      - name: billable
        type: boolean
        source: computed
        description: "Set true when the session is COMPLETED; initialized false"

  - name: MedReconciliation
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: home_visit_id
        type: string
        source: input
        description: "FK -> HomeVisit.id; the visit during which meds were captured"
      - name: medications
        type: array
        source: input
        description: "List of medication names/strings reconciled"
      - name: discrepancy_count
        type: integer
        source: input
        description: "Number of discrepancies found"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Med-rec lifecycle; set by state machine"
        default: "DRAFTED"
        constraints: "one of {DRAFTED, PENDING_REVIEW, RECONCILED, FLAGGED}"
      - name: review_outcome
        type: enum
        source: computed
        description: "Clinician review decision"
        constraints: "one of {RECONCILED, FLAGGED}"

  - name: SocialNeedsReferral
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: domain
        type: enum
        source: input
        description: "Social-need domain"
        constraints: "one of {HOUSING, FOOD, TRANSPORT, UTILITIES}"
      - name: status
        type: enum
        source: computed
        description: "Social-referral lifecycle; set by state machine"
        default: "OPEN"
        constraints: "one of {OPEN, REFERRED, RESOLVED, UNMET}"
      - name: partner_org
        type: string
        source: input
        description: "Community partner the need was referred to"
      - name: resolution_status
        type: enum
        source: input
        description: "Terminal outcome supplied at resolution"
        constraints: "one of {RESOLVED, UNMET}"
      - name: resolution_note
        type: string
        source: input
        description: "Free-text resolution note"

  - name: EDEvent
    parent: null
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: event_type
        type: enum
        source: input
        description: "Kind of acute-care event"
        constraints: "one of {ED_VISIT, INPATIENT_ADMISSION}"
      - name: event_date
        type: datetime
        source: input
        description: "When the event occurred (ISO 8601 UTC)"
      - name: discharge_date
        type: datetime
        source: input
        description: "Discharge date for INPATIENT_ADMISSION; drives the readmission window"
      - name: is_readmission
        type: boolean
        source: computed
        description: "True when this INPATIENT_ADMISSION falls within READMISSION_WINDOW_DAYS of a prior admission's discharge_date; see calculations.readmission_flag"

  - name: BillingClaim
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: program_id
        type: string
        source: input
        description: "FK -> PilotProgram.id"
      - name: payer_id
        type: string
        source: input
        description: "FK -> Payer.id"
      - name: period_start
        type: datetime
        source: input
        description: "Billing period start (inclusive)"
      - name: period_end
        type: datetime
        source: input
        description: "Billing period end (exclusive)"
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle; set by state machine"
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, PAID, DENIED}"
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: "Estimate computed at DRAFT creation (provisional variant of calculations.claim_amount)"
      - name: final_amount_cents
        type: integer
        source: computed
        description: "Amount computed at submit (final variant of calculations.claim_amount)"
      - name: amount_cents
        type: integer
        source: computed
        description: "Committed amount = final_amount_cents at submit; the value debited from the program budget"
      - name: billable_visit_count
        type: integer
        source: computed
        description: "Count of visits included in the final amount"
      - name: billable_telehealth_count
        type: integer
        source: computed
        description: "Count of telehealth sessions included in the final amount"
      - name: denial_reason
        type: string
        source: input
        description: "Reason supplied by the payer on denial"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: PilotProgram
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /mih/programs/{id}/close"
        actor: ProgramAdmin
        preconditions: ["program.status == ACTIVE"]
        side_effects: ["increments PilotProgram.version by 1"]
        note: "Closed programs reject new claim submissions (ERR_PROGRAM_NOT_ACTIVE)."

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /mih/referrals/{id}/screen"
        actor: CareCoordinator
        preconditions: ["referral.status == SUBMITTED"]
        side_effects:
          - "sets referral.screened_risk_tier = Patient.risk_tier (calculations.patient_risk_score)"
      - from: SCREENED
        to: ACCEPTED
        trigger: "POST /mih/referrals/{id}/accept"
        actor: CareCoordinator
        preconditions:
          - "referral.status == SCREENED"
          - "the referral's PilotProgram.status == ACTIVE (cross-entity)"
          - "the referral's PilotProgram.active_enrollment_count < PilotProgram.enrollment_cap (fiscal)"
        side_effects:
          - "creates Enrollment{status: ACTIVE, patient_id, program_id, referral_id, enrolled_at=clock.now}"
          - "increments PilotProgram.active_enrollment_count by 1"
          - "recomputes PilotProgram.remaining_slots = enrollment_cap - active_enrollment_count"
          - "increments PilotProgram.version by 1"
        note: "Endpoint returns the newly-created Enrollment."
      - from: SCREENED
        to: DECLINED
        trigger: "POST /mih/referrals/{id}/decline"
        actor: CareCoordinator
        preconditions: ["referral.status == SCREENED"]
        side_effects: ["sets referral.decline_reason"]

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [DISCHARGED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /mih/enrollments/{id}/discharge"
        actor: CareCoordinator
        preconditions: ["enrollment.status == ACTIVE"]
        side_effects:
          - "for each CarePlan with enrollment_id==this and status IN {DRAFT, ACTIVE, UNDER_REVISION}: transition it to CLOSED (cascade hop 1 -> triggers CarePlan CLOSED side-effects)"
          - "decrements PilotProgram.active_enrollment_count by 1; recomputes remaining_slots"
          - "sets enrollment.discharged_at = clock.now"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /mih/enrollments/{id}/withdraw"
        actor: CareCoordinator
        preconditions: ["enrollment.status == ACTIVE"]
        side_effects:
          - "decrements PilotProgram.active_enrollment_count by 1; recomputes remaining_slots"
          - "sets enrollment.discharged_at = clock.now"

  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mih/care-plans/{id}/activate"
        actor: Clinician
        preconditions:
          - "care_plan.status == DRAFT"
          - "the CarePlan's Enrollment.status == ACTIVE (cross-entity)"
          - "if risk_level == HIGH: cosigner_clinician_id is present (else ERR_COSIGN_REQUIRED)"
          - "if risk_level == HIGH: cosigner_clinician_id != authoring_clinician_id (else ERR_COSIGN_SAME_CLINICIAN, segregation of duties)"
        side_effects: ["no cross-entity effects"]
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "POST /mih/care-plans/{id}/revise  (or cascade from MedReconciliation FLAGGED)"
        actor: Clinician | system
        preconditions: ["care_plan.status == ACTIVE"]
        side_effects:
          - "increments the CarePlan's Enrollment.revision_count by 1 (cascade hop -> Enrollment)"
          - "sets the CarePlan's Enrollment.needs_review = true"
      - from: UNDER_REVISION
        to: ACTIVE
        trigger: "POST /mih/care-plans/{id}/activate"
        actor: Clinician
        preconditions: ["care_plan.status == UNDER_REVISION"]
        side_effects: ["sets the CarePlan's Enrollment.needs_review = false"]
      - from: DRAFT
        to: CLOSED
        trigger: "POST /mih/care-plans/{id}/close  (or cascade from Enrollment DISCHARGED)"
        actor: Clinician | system
        preconditions: ["care_plan.status IN {DRAFT, ACTIVE, UNDER_REVISION}"]
        side_effects:
          - "for each HomeVisit with care_plan_id==this and status==SCHEDULED: transition it to CANCELLED (cascade hop 2 -> triggers HomeVisit CANCELLED side-effects)"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /mih/care-plans/{id}/close  (or cascade from Enrollment DISCHARGED)"
        actor: Clinician | system
        preconditions: ["care_plan.status IN {DRAFT, ACTIVE, UNDER_REVISION}"]
        side_effects:
          - "for each HomeVisit with care_plan_id==this and status==SCHEDULED: transition it to CANCELLED (cascade hop 2 -> triggers HomeVisit CANCELLED side-effects)"
      - from: UNDER_REVISION
        to: CLOSED
        trigger: "POST /mih/care-plans/{id}/close  (or cascade from Enrollment DISCHARGED)"
        actor: Clinician | system
        preconditions: ["care_plan.status IN {DRAFT, ACTIVE, UNDER_REVISION}"]
        side_effects:
          - "for each HomeVisit with care_plan_id==this and status==SCHEDULED: transition it to CANCELLED (cascade hop 2 -> triggers HomeVisit CANCELLED side-effects)"

  - entity: HomeVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /mih/home-visits/{id}/complete"
        actor: Paramedic
        preconditions: ["home_visit.status == SCHEDULED"]
        side_effects:
          - "records systolic_bp, diastolic_bp, heart_rate"
          - "sets home_visit.billable = true"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /mih/home-visits/{id}/cancel  (or cascade from CarePlan CLOSED)"
        actor: CareCoordinator | Paramedic | system
        preconditions: ["home_visit.status == SCHEDULED"]
        side_effects:
          - "releases the provider's schedule reservation for [scheduled_start, scheduled_end) (cascade hop 3 -> Provider schedule)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /mih/home-visits/{id}/no-show"
        actor: Paramedic
        preconditions: ["home_visit.status == SCHEDULED"]
        side_effects: ["releases the provider's schedule reservation for [scheduled_start, scheduled_end)"]

  - entity: TelehealthSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /mih/telehealth-sessions/{id}/complete"
        actor: Clinician | Paramedic
        preconditions: ["telehealth_session.status == SCHEDULED"]
        side_effects:
          - "records systolic_bp, diastolic_bp, heart_rate"
          - "sets telehealth_session.billable = true"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /mih/telehealth-sessions/{id}/cancel"
        actor: CareCoordinator | Clinician
        preconditions: ["telehealth_session.status == SCHEDULED"]
        side_effects: ["releases the patient's buffered occupancy window"]

  - entity: MedReconciliation
    initial_state: DRAFTED
    terminal_states: [RECONCILED, FLAGGED]
    transitions:
      - from: DRAFTED
        to: PENDING_REVIEW
        trigger: "POST /mih/med-reconciliations/{id}/submit"
        actor: Paramedic
        preconditions: ["med_reconciliation.status == DRAFTED"]
        side_effects: ["no cross-entity effects"]
      - from: PENDING_REVIEW
        to: RECONCILED
        trigger: "POST /mih/med-reconciliations/{id}/review  (review_outcome=RECONCILED)"
        actor: Clinician
        preconditions: ["med_reconciliation.status == PENDING_REVIEW"]
        side_effects: ["sets review_outcome = RECONCILED"]
      - from: PENDING_REVIEW
        to: FLAGGED
        trigger: "POST /mih/med-reconciliations/{id}/review  (review_outcome=FLAGGED)"
        actor: Clinician
        preconditions: ["med_reconciliation.status == PENDING_REVIEW"]
        side_effects:
          - "sets review_outcome = FLAGGED"
          - "the enrollment's ACTIVE CarePlan (status==ACTIVE, at most one) transitions ACTIVE -> UNDER_REVISION (cascade hop 1 -> triggers CarePlan revision side-effects on Enrollment)"

  - entity: SocialNeedsReferral
    initial_state: OPEN
    terminal_states: [RESOLVED, UNMET]
    transitions:
      - from: OPEN
        to: REFERRED
        trigger: "POST /mih/social-referrals/{id}/refer"
        actor: CareCoordinator
        preconditions: ["social_needs_referral.status == OPEN"]
        side_effects: ["sets partner_org"]
      - from: REFERRED
        to: RESOLVED
        trigger: "POST /mih/social-referrals/{id}/resolve  (resolution_status=RESOLVED)"
        actor: CareCoordinator
        preconditions: ["social_needs_referral.status == REFERRED"]
        side_effects: ["sets resolution_status, resolution_note"]
      - from: REFERRED
        to: UNMET
        trigger: "POST /mih/social-referrals/{id}/resolve  (resolution_status=UNMET)"
        actor: CareCoordinator
        preconditions: ["social_needs_referral.status == REFERRED"]
        side_effects: ["sets resolution_status, resolution_note"]

  - entity: BillingClaim
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mih/billing-claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "billing_claim.status == DRAFT"
          - "the claim's PilotProgram.status == ACTIVE (cross-entity, ERR_PROGRAM_NOT_ACTIVE)"
          - "at least one COMPLETED HomeVisit or TelehealthSession in the period, i.e. billable_visit_count + billable_telehealth_count > 0 (else ERR_CLAIM_NO_BILLABLE_EVENTS)"
          - "amount_cents <= PilotProgram.available_budget_cents (else ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "computes final_amount_cents (calculations.claim_amount, final variant); sets amount_cents = final_amount_cents"
          - "debits PilotProgram.available_budget_cents by amount_cents; credits PilotProgram.committed_spend_cents by amount_cents"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /mih/billing-claims/{id}/adjudicate  (outcome=PAID)"
        actor: PayerReviewer
        preconditions: ["billing_claim.status == SUBMITTED"]
        side_effects:
          - "increments the claim's Enrollment.billed_amount_cents by amount_cents"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /mih/billing-claims/{id}/adjudicate  (outcome=DENIED)"
        actor: PayerReviewer
        preconditions: ["billing_claim.status == SUBMITTED"]
        side_effects:
          - "credits PilotProgram.available_budget_cents by amount_cents; decrements PilotProgram.committed_spend_cents by amount_cents (compensating release)"
          - "sets denial_reason"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /mih/billing-claims/{id}/resubmit"
        actor: BillingSpecialist
        preconditions:
          - "billing_claim.status == DENIED"
          - "final_amount_cents <= PilotProgram.available_budget_cents"
        side_effects:
          - "recomputes final_amount_cents (final variant) and amount_cents"
          - "debits PilotProgram.available_budget_cents by amount_cents; credits PilotProgram.committed_spend_cents by amount_cents"

concurrency_rules:
  - rule_id: careplan-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /mih/enrollments/{id}/care-plans"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a CarePlan against an Enrollment whose version has advanced
      since the client last observed it is rejected. An Enrollment permits at
      most one non-CLOSED CarePlan; a new plan legitimately supersedes the
      prior one (closing it), so a create carrying a stale
      expected_enrollment_version reflects a view from before another plan was
      attached and is refused on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: claim_amount
    trigger: "On BillingClaim create (provisional variant) and on submit/resubmit (final variant)"
    algorithm: threshold
    formula: |
      # Inputs pulled for claim.enrollment_id over [period_start, period_end):
      #   VISIT_SET, TELE_SET depend on the variant (see variants).
      billable_visits = count(HomeVisit where enrollment_id==claim.enrollment_id
                              and scheduled_start in [period_start, period_end)
                              and status in VISIT_SET)
      billable_teleh  = count(TelehealthSession where enrollment_id==claim.enrollment_id
                              and scheduled_start in [period_start, period_end)
                              and status in TELE_SET)
      base = billable_visits * program.per_visit_rate_cents
           + billable_teleh  * program.per_telehealth_rate_cents
      actual_ed_visits = count(EDEvent where patient_id==enrollment.patient_id
                               and event_type==ED_VISIT
                               and event_date in [period_start, period_end))
      diversion_achieved = (actual_ed_visits <= program.diversion_target_max_ed_visits)
      diversion_bonus = program.diversion_bonus_cents if diversion_achieved else 0
      readmitted = exists EDEvent where patient_id==enrollment.patient_id
                          and event_type==INPATIENT_ADMISSION and is_readmission==true
                          and event_date in [period_start, period_end)
      readmission_penalty = program.readmission_penalty_cents if readmitted else 0
      amount = max(0, base + diversion_bonus - readmission_penalty)
      # Evaluation order is fixed: base, then bonus, then penalty, then floor at 0.
      # Budget sufficiency (amount <= program.available_budget_cents) is enforced
      # as a submit/resubmit precondition (ERR_BUDGET_EXCEEDED), NOT by clamping here.
    input_set: "HomeVisit/TelehealthSession/EDEvent rows tied to the claim's enrollment/patient within the half-open billing period"
    constants: {}
    precision: "integer cents; no rounding (all terms integer)"
    variants:
      - name: provisional
        when: "computed at DRAFT creation -> provisional_amount_cents"
        difference: "VISIT_SET = {SCHEDULED, COMPLETED}; TELE_SET = {SCHEDULED, COMPLETED} (projects still-scheduled events as if they will occur)"
      - name: final
        when: "computed at submit/resubmit -> final_amount_cents and amount_cents"
        difference: "VISIT_SET = {COMPLETED}; TELE_SET = {COMPLETED} (only realized events count)"

  - name: outcome_net_savings
    trigger: "On GET /mih/enrollments/{id}/cost-outcome (read-time)"
    algorithm: aggregation
    formula: |
      enrollment_days = floor((clock.now - enrollment.enrolled_at) / 1 day)
      expected_ed_visits = round_half_up(patient.baseline_ed_visits_12mo * enrollment_days / 365)
      actual_ed_visits   = count(EDEvent where patient_id==enrollment.patient_id
                                 and event_type==ED_VISIT
                                 and event_date in [enrollment.enrolled_at, clock.now))
      averted_ed_visits  = max(0, expected_ed_visits - actual_ed_visits)
      # ROUNDING ORDER PINNED: round the per-visit saving to the cent FIRST,
      # THEN multiply by the visit count (round-per-visit-then-sum). Do NOT
      # multiply the count by the unrounded product and round once at the end.
      per_averted_saving_cents = round_half_up(program.avg_ed_cost_cents * program.diversion_credit_pct)
      actual_savings_cents    = averted_ed_visits  * per_averted_saving_cents   # chronological / actual variant
      projected_savings_cents = expected_ed_visits * per_averted_saving_cents   # forward-looking variant
      net_savings_cents = actual_savings_cents - enrollment.billed_amount_cents
    input_set: "EDEvent ED_VISIT rows for the enrollment's patient inside [enrolled_at, clock.now); patient baseline and program cost constants"
    constants: {}
    precision: "round_half_up to whole cents; per-visit saving rounded before multiplication"
    variants:
      - name: forward_looking
        when: "projected_savings_cents — assumes every expected baseline ED visit is averted"
        difference: "uses expected_ed_visits (baseline projection); ignores actual EDEvents"
      - name: chronological
        when: "actual_savings_cents — reflects realized utilization"
        difference: "uses averted_ed_visits derived from actual EDEvent rows in the period"

  - name: patient_risk_score
    trigger: "On Patient create and whenever an EDEvent is created for the patient (recompute)"
    algorithm: weighted_scoring
    formula: |
      recent_admissions = count(EDEvent where patient_id==patient.id
                                and event_type==INPATIENT_ADMISSION
                                and event_date >= clock.now - 365 days)
      risk_score = patient.baseline_ed_visits_12mo * W_ED
                 + patient.chronic_conditions_count * W_CHRONIC
                 + recent_admissions * W_ADMIT
      risk_tier = HIGH     if risk_score >= HIGH_MIN
                  MODERATE if MOD_MIN <= risk_score < HIGH_MIN
                  LOW      otherwise
    input_set: "Patient input fields plus INPATIENT_ADMISSION EDEvents within the trailing 365 days"
    constants:
      W_ED: 2
      W_CHRONIC: 3
      W_ADMIT: 5
      MOD_MIN: 10
      HIGH_MIN: 20
    precision: "integer score; tier bands are half-open [MOD_MIN, HIGH_MIN)"

  - name: readmission_flag
    trigger: "On EDEvent create"
    algorithm: threshold
    formula: |
      if event_type != INPATIENT_ADMISSION:
        is_readmission = false
      else:
        prior = EDEvents P where P.patient_id==this.patient_id
                          and P.event_type==INPATIENT_ADMISSION
                          and P.discharge_date is not null
                          and P.discharge_date <= this.event_date
        is_readmission = any P in prior with
                          days_between(P.discharge_date, this.event_date) <= READMISSION_WINDOW_DAYS
      # Boundary: exactly READMISSION_WINDOW_DAYS days counts as a readmission (<=),
      # one day beyond does not.
    input_set: "Prior INPATIENT_ADMISSION EDEvents for the same patient with a non-null discharge_date"
    constants:
      READMISSION_WINDOW_DAYS: 30
    precision: "day-granularity integer comparison, inclusive upper bound"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in the path and every FK in the body resolves to an existing resource (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "request body has all required fields, correct types, valid enum members, and scheduled_end strictly after scheduled_start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: state
    check: "expected_enrollment_version matches the Enrollment's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mih/enrollments/{id}/care-plans"
  - priority: 6
    category: state
    check: "referral is in SCREENED before accept/decline"
    error_id: ERR_REFERRAL_NOT_SCREENED
    http_status: 409
    applies_to: "POST /mih/referrals/{id}/accept, POST /mih/referrals/{id}/decline"
  - priority: 6
    category: state
    check: "target resource is in a state that admits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "med reconciliation is in PENDING_REVIEW before review"
    error_id: ERR_MED_REC_NOT_PENDING
    http_status: 409
    applies_to: "POST /mih/med-reconciliations/{id}/review"
  - priority: 7
    category: business_safety
    check: "CarePlan referenced by a home-visit schedule is in ACTIVE status"
    error_id: ERR_CARE_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /mih/home-visits"
  - priority: 7
    category: business_safety
    check: "Enrollment referenced by a schedule/care-plan operation is in ACTIVE status"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /mih/home-visits, POST /mih/telehealth-sessions, POST /mih/enrollments/{id}/care-plans"
  - priority: 7
    category: business_safety
    check: "PilotProgram referenced by a claim submit/resubmit or referral accept is in ACTIVE status"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /mih/billing-claims/{id}/submit, POST /mih/billing-claims/{id}/resubmit, POST /mih/referrals/{id}/accept"
  - priority: 8
    category: business_temporal
    check: "no other SCHEDULED HomeVisit for the same provider overlaps [scheduled_start, scheduled_end) (half-open; back-to-back allowed)"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /mih/home-visits"
  - priority: 8
    category: business_temporal
    check: "no other SCHEDULED TelehealthSession for the same patient lies within TELEHEALTH_BUFFER_MINUTES (15) of [scheduled_start, scheduled_end)"
    error_id: ERR_TELEHEALTH_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /mih/telehealth-sessions"
  - priority: 9
    category: business_referential
    check: "home-visit provider_id has provider_type PARAMEDIC; telehealth provider_id has provider_type CLINICIAN; care-plan authoring_clinician_id has provider_type CLINICIAN"
    error_id: ERR_PROVIDER_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /mih/home-visits, POST /mih/telehealth-sessions, POST /mih/enrollments/{id}/care-plans"
  - priority: 9
    category: business_referential
    check: "claim.program_id and claim.payer_id are consistent with the claim's Enrollment.program_id and that program's payer_id"
    error_id: ERR_CLAIM_EVENTS_CROSS_ENROLLMENT
    http_status: 422
    applies_to: "POST /mih/billing-claims"
  - priority: 10
    category: business_constraint
    check: "activating a HIGH-risk CarePlan requires a cosigner_clinician_id"
    error_id: ERR_COSIGN_REQUIRED
    http_status: 422
    applies_to: "POST /mih/care-plans/{id}/activate"
  - priority: 10
    category: business_constraint
    check: "a HIGH-risk CarePlan's cosigner_clinician_id must differ from authoring_clinician_id (segregation of duties)"
    error_id: ERR_COSIGN_SAME_CLINICIAN
    http_status: 422
    applies_to: "POST /mih/care-plans/{id}/activate"
  - priority: 10
    category: business_constraint
    check: "a claim submit requires at least one COMPLETED HomeVisit or TelehealthSession in the period (billable_visit_count + billable_telehealth_count > 0)"
    error_id: ERR_CLAIM_NO_BILLABLE_EVENTS
    http_status: 422
    applies_to: "POST /mih/billing-claims/{id}/submit"
  - priority: 11
    category: business_fiscal
    check: "referral accept requires PilotProgram.active_enrollment_count < enrollment_cap"
    error_id: ERR_ENROLLMENT_CAP_REACHED
    http_status: 409
    applies_to: "POST /mih/referrals/{id}/accept"
  - priority: 11
    category: business_fiscal
    check: "claim submit/resubmit requires final_amount_cents <= PilotProgram.available_budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /mih/billing-claims/{id}/submit, POST /mih/billing-claims/{id}/resubmit"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Payer ----
  - method: POST
    path: "/mih/payers"
    description: "Create a payer"
    roles: [ProgramAdmin]
    code: 201
    input: [name, payer_type]
    output: Payer
    side_effects: []
  - method: GET
    path: "/mih/payers/{id}"
    description: "Fetch a payer"
    roles: [ProgramAdmin, CareCoordinator, BillingSpecialist, PayerReviewer]
    code: 200
    input: []
    output: Payer
    side_effects: []

  # ---- PilotProgram ----
  - method: POST
    path: "/mih/programs"
    description: "Create a pilot program"
    roles: [ProgramAdmin]
    code: 201
    input: [name, payer_id, budget_cap_cents, enrollment_cap, per_visit_rate_cents, per_telehealth_rate_cents, diversion_bonus_cents, readmission_penalty_cents, diversion_target_max_ed_visits, avg_ed_cost_cents, diversion_credit_pct, start_date, end_date]
    output: PilotProgram
    side_effects: ["initializes available_budget_cents=budget_cap_cents, committed_spend_cents=0, active_enrollment_count=0, remaining_slots=enrollment_cap"]
  - method: GET
    path: "/mih/programs/{id}"
    description: "Fetch a pilot program (includes budget and slot counters)"
    roles: [ProgramAdmin, CareCoordinator, BillingSpecialist, PayerReviewer, Clinician]
    code: 200
    input: []
    output: PilotProgram
    side_effects: []
  - method: GET
    path: "/mih/programs"
    description: "List pilot programs (filter by payer)"
    roles: [ProgramAdmin, CareCoordinator, BillingSpecialist, PayerReviewer]
    code: 200
    input: ["payer_id?", "limit?", "offset?"]
    output: PilotProgram[]
    side_effects: []
  - method: POST
    path: "/mih/programs/{id}/close"
    description: "Close a pilot program"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PilotProgram
    side_effects: ["PilotProgram ACTIVE -> CLOSED; increments version"]

  # ---- Provider ----
  - method: POST
    path: "/mih/providers"
    description: "Create a provider (staff member)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, provider_type, npi, "active?"]
    output: Provider
    side_effects: []
  - method: GET
    path: "/mih/providers/{id}"
    description: "Fetch a provider"
    roles: [ProgramAdmin, CareCoordinator, Clinician, Paramedic, BillingSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/mih/providers"
    description: "List providers (filter by type)"
    roles: [ProgramAdmin, CareCoordinator, Clinician, Paramedic, BillingSpecialist]
    code: 200
    input: ["provider_type?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/mih/patients"
    description: "Create a patient; computes initial risk_score/risk_tier"
    roles: [CareCoordinator, ProgramAdmin]
    code: 201
    input: [full_name, date_of_birth, baseline_ed_visits_12mo, chronic_conditions_count, "consent_on_file?"]
    output: Patient
    side_effects: ["computes risk_score and risk_tier (calculations.patient_risk_score)"]
  - method: GET
    path: "/mih/patients/{id}"
    description: "Fetch a patient"
    roles: [CareCoordinator, Clinician, Paramedic, ProgramAdmin]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/mih/patients"
    description: "List patients"
    roles: [CareCoordinator, Clinician, Paramedic, ProgramAdmin]
    code: 200
    input: ["risk_tier?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ---- Referral ----
  - method: POST
    path: "/mih/referrals"
    description: "Create a high-utilizer referral"
    roles: [CareCoordinator]
    code: 201
    input: [patient_id, program_id, referring_source]
    output: Referral
    side_effects: []
  - method: GET
    path: "/mih/referrals/{id}"
    description: "Fetch a referral"
    roles: [CareCoordinator, Clinician, ProgramAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/mih/referrals"
    description: "List referrals (filter by patient or program)"
    roles: [CareCoordinator, Clinician, ProgramAdmin]
    code: 200
    input: ["patient_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/mih/referrals/{id}/screen"
    description: "Screen a referral; snapshots patient risk tier"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["SUBMITTED -> SCREENED; sets screened_risk_tier"]
  - method: POST
    path: "/mih/referrals/{id}/accept"
    description: "Accept a screened referral; creates an ACTIVE Enrollment and consumes a program slot"
    roles: [CareCoordinator]
    code: 201
    input: []
    output: Enrollment
    side_effects: ["Referral SCREENED -> ACCEPTED; creates Enrollment; increments PilotProgram.active_enrollment_count; recomputes remaining_slots; increments PilotProgram.version"]
  - method: POST
    path: "/mih/referrals/{id}/decline"
    description: "Decline a screened referral"
    roles: [CareCoordinator]
    code: 200
    input: [decline_reason]
    output: Referral
    side_effects: ["SCREENED -> DECLINED"]

  # ---- Enrollment ----
  - method: GET
    path: "/mih/enrollments/{id}"
    description: "Fetch an enrollment (includes derived counters)"
    roles: [CareCoordinator, Clinician, Paramedic, BillingSpecialist, ProgramAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/mih/enrollments"
    description: "List enrollments (filter by patient, program, or referral)"
    roles: [CareCoordinator, Clinician, Paramedic, BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["patient_id?", "program_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/mih/enrollments/{id}/discharge"
    description: "Discharge an enrollment; cascades plan closure, visit cancellation, and slot release"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["ACTIVE -> DISCHARGED; cascade closes CarePlans -> cancels SCHEDULED HomeVisits; releases program slot"]
  - method: POST
    path: "/mih/enrollments/{id}/withdraw"
    description: "Withdraw an enrollment; releases a program slot"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["ACTIVE -> WITHDRAWN; releases program slot"]
  - method: GET
    path: "/mih/enrollments/{id}/cost-outcome"
    description: "Computed cost/outcome summary for the enrollment (projected vs actual ED-diversion savings)"
    roles: [CareCoordinator, ProgramAdmin, BillingSpecialist]
    code: 200
    input: []
    output: "{ projected_savings_cents: integer, actual_savings_cents: integer, net_savings_cents: integer, averted_ed_visits: integer, expected_ed_visits: integer, actual_ed_visits: integer, per_averted_saving_cents: integer }"
    side_effects: []

  # ---- CarePlan ----
  - method: POST
    path: "/mih/enrollments/{id}/care-plans"
    description: "Create a care plan for an enrollment (OCC-guarded); supersedes any prior non-CLOSED plan"
    roles: [Clinician]
    code: 201
    input: [risk_level, authoring_clinician_id, "cosigner_clinician_id?", goals, expected_enrollment_version]
    output: CarePlan
    side_effects: ["creates CarePlan DRAFT; closes any existing non-CLOSED CarePlan for the enrollment (supersede); increments Enrollment.version by 1"]
  - method: GET
    path: "/mih/care-plans/{id}"
    description: "Fetch a care plan"
    roles: [Clinician, CareCoordinator, Paramedic, ProgramAdmin]
    code: 200
    input: []
    output: CarePlan
    side_effects: []
  - method: GET
    path: "/mih/care-plans"
    description: "List care plans (filter by enrollment or clinician)"
    roles: [Clinician, CareCoordinator, Paramedic, ProgramAdmin]
    code: 200
    input: ["enrollment_id?", "authoring_clinician_id?", "cosigner_clinician_id?", "status?", "limit?", "offset?"]
    output: CarePlan[]
    side_effects: []
  - method: POST
    path: "/mih/care-plans/{id}/activate"
    description: "Activate a DRAFT/UNDER_REVISION care plan; enforces HIGH-risk co-sign"
    roles: [Clinician]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["DRAFT->ACTIVE or UNDER_REVISION->ACTIVE; clears Enrollment.needs_review on reactivation"]
  - method: POST
    path: "/mih/care-plans/{id}/revise"
    description: "Send an ACTIVE care plan back to revision"
    roles: [Clinician]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["ACTIVE -> UNDER_REVISION; increments Enrollment.revision_count; sets Enrollment.needs_review=true"]
  - method: POST
    path: "/mih/care-plans/{id}/close"
    description: "Close a care plan; cancels its SCHEDULED home visits"
    roles: [Clinician]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["-> CLOSED; cascade cancels SCHEDULED HomeVisits with this care_plan_id"]

  # ---- HomeVisit ----
  - method: POST
    path: "/mih/home-visits"
    description: "Schedule a home visit under an ACTIVE care plan"
    roles: [CareCoordinator]
    code: 201
    input: [enrollment_id, care_plan_id, provider_id, scheduled_start, scheduled_end]
    output: HomeVisit
    side_effects: ["reserves the provider schedule window; overlap-checked (half-open) against provider's SCHEDULED visits"]
  - method: GET
    path: "/mih/home-visits/{id}"
    description: "Fetch a home visit"
    roles: [CareCoordinator, Paramedic, Clinician, ProgramAdmin]
    code: 200
    input: []
    output: HomeVisit
    side_effects: []
  - method: GET
    path: "/mih/home-visits"
    description: "List home visits (filter by enrollment, care plan, or provider)"
    roles: [CareCoordinator, Paramedic, Clinician, ProgramAdmin]
    code: 200
    input: ["enrollment_id?", "care_plan_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: HomeVisit[]
    side_effects: []
  - method: POST
    path: "/mih/home-visits/{id}/complete"
    description: "Complete a home visit and record vitals"
    roles: [Paramedic]
    code: 200
    input: [systolic_bp, diastolic_bp, heart_rate]
    output: HomeVisit
    side_effects: ["SCHEDULED -> COMPLETED; sets billable=true"]
  - method: POST
    path: "/mih/home-visits/{id}/cancel"
    description: "Cancel a scheduled home visit"
    roles: [CareCoordinator, Paramedic]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["SCHEDULED -> CANCELLED; releases provider schedule reservation"]
  - method: POST
    path: "/mih/home-visits/{id}/no-show"
    description: "Mark a scheduled home visit a no-show"
    roles: [Paramedic]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["SCHEDULED -> NO_SHOW; releases provider schedule reservation"]

  # ---- TelehealthSession ----
  - method: POST
    path: "/mih/telehealth-sessions"
    description: "Schedule a telehealth session; buffer-overlap checked against the patient"
    roles: [CareCoordinator]
    code: 201
    input: [enrollment_id, patient_id, provider_id, scheduled_start, scheduled_end]
    output: TelehealthSession
    side_effects: ["reserves the patient's buffered occupancy window (15-min buffer)"]
  - method: GET
    path: "/mih/telehealth-sessions/{id}"
    description: "Fetch a telehealth session"
    roles: [CareCoordinator, Paramedic, Clinician, ProgramAdmin]
    code: 200
    input: []
    output: TelehealthSession
    side_effects: []
  - method: GET
    path: "/mih/telehealth-sessions"
    description: "List telehealth sessions (filter by enrollment, patient, or provider)"
    roles: [CareCoordinator, Paramedic, Clinician, ProgramAdmin]
    code: 200
    input: ["enrollment_id?", "patient_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: TelehealthSession[]
    side_effects: []
  - method: POST
    path: "/mih/telehealth-sessions/{id}/complete"
    description: "Complete a telehealth session and record vitals"
    roles: [Clinician, Paramedic]
    code: 200
    input: [systolic_bp, diastolic_bp, heart_rate]
    output: TelehealthSession
    side_effects: ["SCHEDULED -> COMPLETED; sets billable=true"]
  - method: POST
    path: "/mih/telehealth-sessions/{id}/cancel"
    description: "Cancel a scheduled telehealth session"
    roles: [CareCoordinator, Clinician]
    code: 200
    input: []
    output: TelehealthSession
    side_effects: ["SCHEDULED -> CANCELLED; releases patient buffered window"]

  # ---- MedReconciliation ----
  - method: POST
    path: "/mih/med-reconciliations"
    description: "Create a medication reconciliation tied to a home visit"
    roles: [Paramedic]
    code: 201
    input: [enrollment_id, home_visit_id, medications, "discrepancy_count?"]
    output: MedReconciliation
    side_effects: []
  - method: GET
    path: "/mih/med-reconciliations/{id}"
    description: "Fetch a med reconciliation"
    roles: [Paramedic, Clinician, CareCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: MedReconciliation
    side_effects: []
  - method: GET
    path: "/mih/med-reconciliations"
    description: "List med reconciliations (filter by enrollment or home visit)"
    roles: [Paramedic, Clinician, CareCoordinator, ProgramAdmin]
    code: 200
    input: ["enrollment_id?", "home_visit_id?", "status?", "limit?", "offset?"]
    output: MedReconciliation[]
    side_effects: []
  - method: POST
    path: "/mih/med-reconciliations/{id}/submit"
    description: "Submit a drafted med reconciliation for clinician review"
    roles: [Paramedic]
    code: 200
    input: []
    output: MedReconciliation
    side_effects: ["DRAFTED -> PENDING_REVIEW"]
  - method: POST
    path: "/mih/med-reconciliations/{id}/review"
    description: "Clinician reviews a med reconciliation; FLAGGED forces the active care plan under revision"
    roles: [Clinician]
    code: 200
    input: [review_outcome]
    output: MedReconciliation
    side_effects: ["PENDING_REVIEW -> RECONCILED|FLAGGED; on FLAGGED cascades the enrollment's ACTIVE CarePlan to UNDER_REVISION"]

  # ---- SocialNeedsReferral ----
  - method: POST
    path: "/mih/social-referrals"
    description: "Open a social-needs referral for an enrollment"
    roles: [CareCoordinator]
    code: 201
    input: [enrollment_id, domain]
    output: SocialNeedsReferral
    side_effects: []
  - method: GET
    path: "/mih/social-referrals/{id}"
    description: "Fetch a social-needs referral"
    roles: [CareCoordinator, Clinician, ProgramAdmin]
    code: 200
    input: []
    output: SocialNeedsReferral
    side_effects: []
  - method: GET
    path: "/mih/social-referrals"
    description: "List social-needs referrals (filter by enrollment)"
    roles: [CareCoordinator, Clinician, ProgramAdmin]
    code: 200
    input: ["enrollment_id?", "domain?", "status?", "limit?", "offset?"]
    output: SocialNeedsReferral[]
    side_effects: []
  - method: POST
    path: "/mih/social-referrals/{id}/refer"
    description: "Refer an open social need to a partner org"
    roles: [CareCoordinator]
    code: 200
    input: [partner_org]
    output: SocialNeedsReferral
    side_effects: ["OPEN -> REFERRED"]
  - method: POST
    path: "/mih/social-referrals/{id}/resolve"
    description: "Resolve a referred social need"
    roles: [CareCoordinator]
    code: 200
    input: [resolution_status, "resolution_note?"]
    output: SocialNeedsReferral
    side_effects: ["REFERRED -> RESOLVED|UNMET"]

  # ---- EDEvent ----
  - method: POST
    path: "/mih/ed-events"
    description: "Record an ED visit or inpatient admission; computes is_readmission and recomputes patient risk"
    roles: [CareCoordinator, ProgramAdmin]
    code: 201
    input: [patient_id, event_type, event_date, "discharge_date?"]
    output: EDEvent
    side_effects: ["computes is_readmission (calculations.readmission_flag); recomputes Patient.risk_score/risk_tier"]
  - method: GET
    path: "/mih/ed-events/{id}"
    description: "Fetch an ED event"
    roles: [CareCoordinator, Clinician, ProgramAdmin]
    code: 200
    input: []
    output: EDEvent
    side_effects: []
  - method: GET
    path: "/mih/ed-events"
    description: "List ED events (filter by patient)"
    roles: [CareCoordinator, Clinician, ProgramAdmin]
    code: 200
    input: ["patient_id?", "event_type?", "limit?", "offset?"]
    output: EDEvent[]
    side_effects: []

  # ---- BillingClaim ----
  - method: POST
    path: "/mih/billing-claims"
    description: "Create a draft billing claim; computes the provisional amount"
    roles: [BillingSpecialist]
    code: 201
    input: [enrollment_id, program_id, payer_id, period_start, period_end]
    output: BillingClaim
    side_effects: ["computes provisional_amount_cents (calculations.claim_amount, provisional variant)"]
  - method: GET
    path: "/mih/billing-claims/{id}"
    description: "Fetch a billing claim"
    roles: [BillingSpecialist, ProgramAdmin, PayerReviewer]
    code: 200
    input: []
    output: BillingClaim
    side_effects: []
  - method: GET
    path: "/mih/billing-claims"
    description: "List billing claims (filter by enrollment, program, or payer)"
    roles: [BillingSpecialist, ProgramAdmin, PayerReviewer]
    code: 200
    input: ["enrollment_id?", "program_id?", "payer_id?", "status?", "limit?", "offset?"]
    output: BillingClaim[]
    side_effects: []
  - method: POST
    path: "/mih/billing-claims/{id}/submit"
    description: "Submit a draft claim; computes the final amount and commits budget"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillingClaim
    side_effects: ["DRAFT -> SUBMITTED; computes final_amount_cents/amount_cents; debits available_budget_cents; credits committed_spend_cents"]
  - method: POST
    path: "/mih/billing-claims/{id}/adjudicate"
    description: "Payer adjudicates a submitted claim (PAID or DENIED)"
    roles: [PayerReviewer]
    code: 200
    input: [outcome, "denial_reason?"]
    output: BillingClaim
    side_effects: ["SUBMITTED -> PAID (credits Enrollment.billed_amount_cents) or DENIED (releases committed budget)"]
  - method: POST
    path: "/mih/billing-claims/{id}/resubmit"
    description: "Resubmit a denied claim; recomputes and recommits budget"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillingClaim
    side_effects: ["DENIED -> SUBMITTED; recomputes amount; re-debits available_budget_cents"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/mih/_clock/set_current_utc"
    description: "Set the server logical clock. Default before any call is 2026-03-01T00:00:00Z (never real wall-clock). Drives readmission windows, enrollment-day counts, and risk trailing windows."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["sets the logical clock used by all time-dependent calculations"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the operation"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing/invalid required field, bad enum, or scheduled_end not after scheduled_start"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or body FK does not resolve to an existing resource"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_enrollment_version does not match the Enrollment's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not allowed from the resource's current state"
  - id: ERR_REFERRAL_NOT_SCREENED
    http: 409
    condition: "accept/decline attempted on a referral not in SCREENED"
  - id: ERR_MED_REC_NOT_PENDING
    http: 409
    condition: "review attempted on a med reconciliation not in PENDING_REVIEW"
  - id: ERR_CARE_PLAN_NOT_ACTIVE
    http: 409
    condition: "Scheduling a home visit under a care plan not in ACTIVE status"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "Scheduling/care-plan operation on an enrollment not in ACTIVE status"
  - id: ERR_PROGRAM_NOT_ACTIVE
    http: 409
    condition: "Claim submit/resubmit or referral accept against a CLOSED program"
  - id: ERR_SCHEDULE_CONFLICT
    http: 409
    condition: "Home visit overlaps another SCHEDULED visit for the same provider (half-open)"
  - id: ERR_TELEHEALTH_BUFFER_CONFLICT
    http: 409
    condition: "Telehealth session violates the 15-minute buffer around another SCHEDULED session for the same patient"
  - id: ERR_PROVIDER_TYPE_MISMATCH
    http: 422
    condition: "Provider referenced has the wrong provider_type for the role (paramedic/clinician)"
  - id: ERR_CLAIM_EVENTS_CROSS_ENROLLMENT
    http: 422
    condition: "Claim program_id/payer_id inconsistent with the enrollment's program/payer"
  - id: ERR_COSIGN_REQUIRED
    http: 422
    condition: "Activating a HIGH-risk care plan without a cosigner_clinician_id"
  - id: ERR_COSIGN_SAME_CLINICIAN
    http: 422
    condition: "HIGH-risk care plan cosigner equals the authoring clinician (segregation of duties)"
  - id: ERR_CLAIM_NO_BILLABLE_EVENTS
    http: 422
    condition: "Claim submit with no COMPLETED visits or telehealth sessions in the period"
  - id: ERR_ENROLLMENT_CAP_REACHED
    http: 409
    condition: "Referral accept when active_enrollment_count == enrollment_cap"
  - id: ERR_BUDGET_EXCEEDED
    http: 409
    condition: "Claim submit/resubmit when final_amount_cents > available_budget_cents"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ProgramAdmin
    description: "Operational administrator; sets up payers, programs, providers, records ED events, sets the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /mih/payers"
      - "POST /mih/programs"
      - "POST /mih/programs/{id}/close"
      - "POST /mih/providers"
      - "POST /mih/_clock/set_current_utc"
    shared_operations:
      - "POST /mih/patients"
      - "POST /mih/ed-events"
      - "GET (most read endpoints)"
  - name: CareCoordinator
    description: "Owns referral, enrollment, scheduling, and social-needs workflows"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /mih/referrals"
      - "POST /mih/referrals/{id}/screen"
      - "POST /mih/referrals/{id}/accept"
      - "POST /mih/referrals/{id}/decline"
      - "POST /mih/enrollments/{id}/discharge"
      - "POST /mih/enrollments/{id}/withdraw"
      - "POST /mih/home-visits"
      - "POST /mih/telehealth-sessions"
      - "POST /mih/social-referrals"
      - "POST /mih/social-referrals/{id}/refer"
      - "POST /mih/social-referrals/{id}/resolve"
    shared_operations:
      - "POST /mih/patients"
      - "POST /mih/home-visits/{id}/cancel"
      - "POST /mih/telehealth-sessions/{id}/cancel"
  - name: Paramedic
    description: "Performs home visits and medication reconciliation"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /mih/home-visits/{id}/complete"
      - "POST /mih/home-visits/{id}/no-show"
      - "POST /mih/med-reconciliations"
      - "POST /mih/med-reconciliations/{id}/submit"
    shared_operations:
      - "POST /mih/home-visits/{id}/cancel"
      - "POST /mih/telehealth-sessions/{id}/complete"
  - name: Clinician
    description: "Authors/activates care plans, reviews med reconciliations, co-signs high-risk plans"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /mih/enrollments/{id}/care-plans"
      - "POST /mih/care-plans/{id}/activate"
      - "POST /mih/care-plans/{id}/revise"
      - "POST /mih/care-plans/{id}/close"
      - "POST /mih/med-reconciliations/{id}/review"
    shared_operations:
      - "POST /mih/telehealth-sessions/{id}/complete"
      - "POST /mih/telehealth-sessions/{id}/cancel"
  - name: BillingSpecialist
    description: "Creates, submits, and resubmits payer-pilot billing claims"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /mih/billing-claims"
      - "POST /mih/billing-claims/{id}/submit"
      - "POST /mih/billing-claims/{id}/resubmit"
    shared_operations:
      - "GET /mih/enrollments/{id}/cost-outcome"
  - name: PayerReviewer
    description: "Payer-side reviewer who adjudicates submitted claims"
    identity: "entity_backed:Payer"
    exclusive_operations:
      - "POST /mih/billing-claims/{id}/adjudicate"
    shared_operations:
      - "GET /mih/billing-claims/{id}"
      - "GET /mih/billing-claims"
