# =============================================================================
# Junk Removal & Hauling — benchmark seed tables (Expert)
# §1.0–§1.7 in this file. §1.8 / §1.9 live in their sibling design files.
# All monetary amounts are integer cents. Truck fractions are floats billed in
# eighths (0.125 steps). Weights are tons (float). Times are ISO-8601 UTC.
# =============================================================================

scenario: |
  Junk Removal & Hauling: volume-based pricing (truck fraction), item surcharge
  (mattress/appliance/freon), pickup window/crew dispatch, donation/recycling
  diversion, dump-fee pass-through, photo estimate, same-day/scheduled,
  cancellation

domain_name: junk-removal-hauling
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation      # photo estimate vs final actual; weight vs volume dump fee
    - cascading_side_effects        # cancel job -> void dispatch -> release crew minutes -> recompute crew load
    - derived_field_reconciliation  # crew.reserved_minutes, customer.outstanding_balance_cents kept in sync
    - optimistic_concurrency        # OCC on Crew.version (dispatch) and HaulJob.version (revise estimate)

  entity_topology: hybrid
  # Top-level config/resource entities (PricingPolicy, Customer, Crew, Truck) are
  # flat peers referenced by FK; HaulJob owns a child tree (JobItem, PhotoEstimate,
  # DiversionRecord, DumpTicket, Invoice) plus the cross-aggregate Dispatch.

  state_machine_shape: cyclic
  # HaulJob has a revision cycle (SCHEDULED -> ESTIMATED); Invoice carries two
  # independent (parallel) status dimensions.

  relationship_patterns:
    - one_to_many       # HaulJob -> JobItem / DiversionRecord / DumpTicket
    - cross_aggregate   # Dispatch references HaulJob, Crew, Truck across aggregates
    - polymorphic       # none used; FKs are concrete

  role_model: peer_roles
  # Customer owns own jobs; Dispatcher runs scheduling/crew; CrewLead executes
  # on-site loading/weighing; Billing settles invoices; opaque PlatformAdmin
  # owns config (PricingPolicy, Crew, Truck) and clock/test surfaces.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration ---------------------------------------------------------
  - name: PricingPolicy
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: name, type: string, source: input, description: "Policy label, e.g. 'Standard 2026'" }
      - { name: full_truck_cents, type: integer, source: input, description: "Price in cents for a full (1.0) truckload at base tier", constraints: ">= 0" }
      - { name: tier_breaks, type: array, source: input, description: "Ordered array of {upper_fraction, marginal_multiplier}; marginal multipliers applied per band over full_truck_cents. Bands MUST start at fraction 0 and end at upper_fraction 1.0, strictly increasing upper_fraction" }
      - { name: min_billable_fraction, type: number, source: input, default: 0.125, description: "Floor applied after rounding up to fraction_step" }
      - { name: fraction_step, type: number, source: input, default: 0.125, description: "Billing granularity; measured fraction is rounded UP to nearest multiple" }
      - { name: mattress_surcharge_cents, type: integer, source: input, description: "Per-item surcharge for MATTRESS", constraints: ">= 0" }
      - { name: appliance_surcharge_cents, type: integer, source: input, description: "Per-item surcharge for APPLIANCE (no refrigerant)", constraints: ">= 0" }
      - { name: freon_surcharge_cents, type: integer, source: input, description: "Per-item surcharge for FREON_APPLIANCE (EPA refrigerant recovery)", constraints: ">= 0" }
      - { name: dump_fee_per_ton_cents, type: integer, source: input, description: "Landfill tipping fee per ton, pass-through (WEIGHT_BASED variant rate)", constraints: ">= 0" }
      - { name: full_truck_dump_cents, type: integer, source: input, description: "Flat landfill cost for a full truck of mixed waste (VOLUME_BASED variant rate)", constraints: ">= 0" }
      - { name: recycle_fee_per_ton_cents, type: integer, source: input, description: "Recycling-center gate fee per ton diverted to recycling", constraints: ">= 0" }
      - { name: diversion_credit_per_ton_cents, type: integer, source: input, description: "Customer credit per ton diverted to donation OR recycling", constraints: ">= 0" }
      - { name: same_day_surcharge_pct, type: number, source: input, default: 0.20, description: "Rush uplift applied to base haul cost when job.service_type == SAME_DAY", constraints: ">= 0" }
      - { name: tax_pct, type: number, source: input, default: 0.08, description: "Tax applied to (subtotal) at finalization", constraints: ">= 0" }
      - { name: cancel_pct_scheduled, type: number, source: input, default: 0.25, description: "Cancellation fee as fraction of estimated_total_cents when job is SCHEDULED" }
      - { name: cancel_pct_dispatched, type: number, source: input, default: 0.50, description: "Cancellation fee as fraction of estimated_total_cents when job is DISPATCHED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED. Exactly one policy is ACTIVE; activating a new one RETIRES the prior. Enum set {ACTIVE, RETIRED}" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as Customer" }
      - { name: email, type: string, source: input, description: "Unique login email", constraints: "unique among Customer" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: credit_limit_cents, type: integer, source: input, default: 50000, description: "Max outstanding balance permitted before new jobs are blocked", constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of total_cents over this customer's invoices in billing_status IN {ISSUED} that are not yet SETTLED; starts 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. Enum set {ACTIVE, SUSPENDED}" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when acting as CrewLead assigned to this crew" }
      - { name: name, type: string, source: input, description: "Crew label, e.g. 'Truck-A Team'" }
      - { name: shift_start_utc, type: datetime, source: input, description: "Daily shift window start (inclusive)" }
      - { name: shift_end_utc, type: datetime, source: input, description: "Daily shift window end (exclusive)" }
      - { name: buffer_minutes, type: integer, source: input, default: 30, description: "Minimum travel-gap required BETWEEN two pickup windows assigned to this crew", constraints: ">= 0" }
      - { name: hazmat_certified, type: boolean, source: input, default: false, description: "True if crew may handle FREON_APPLIANCE items" }
      - { name: reserved_minutes, type: integer, source: computed, description: "Sum of (window_end - window_start) in minutes over Dispatches referencing this crew in dispatch_status IN {RESERVED, ACTIVE}; starts 0" }
      - { name: status, type: enum, source: system, description: "ON_DUTY | OFF_DUTY. Enum set {ON_DUTY, OFF_DUTY}" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Truck label / plate" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_SERVICE. Enum set {IN_SERVICE, OUT_OF_SERVICE}" }

  # --- Core aggregate --------------------------------------------------------
  - name: HaulJob
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the job" }
      - { name: pricing_policy_id, type: string, source: system, description: "FK -> PricingPolicy.id; the ACTIVE policy pinned at job creation, frozen for life of job" }
      - { name: service_type, type: enum, source: input, description: "SAME_DAY | SCHEDULED. SAME_DAY applies same_day_surcharge_pct uplift. Enum set {SAME_DAY, SCHEDULED}" }
      - { name: address, type: string, source: input, description: "Pickup address" }
      - { name: estimated_truck_fraction, type: number, source: computed, description: "Billed fraction derived from the accepted PhotoEstimate (rounded up to fraction_step); null until ESTIMATED" }
      - { name: measured_truck_fraction, type: number, source: input, description: "Actual raw fraction measured on-site at LOAD; rounded up to fraction_step for billing; null until LOADED" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Cost quoted from accepted PhotoEstimate (base + declared-item surcharge + same-day uplift); null until ESTIMATED" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final billed cost computed at LOAD from measured fraction, actual JobItems, dump tickets, diversion credits, tax; null until LOADED" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Fee assessed on cancellation per policy cancel_pct_* and job state; null unless CANCELLED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ESTIMATED | SCHEDULED | DISPATCHED | ON_SITE | LOADED | COMPLETED | CANCELLED. Enum set {DRAFT, ESTIMATED, SCHEDULED, DISPATCHED, ON_SITE, LOADED, COMPLETED, CANCELLED}" }

  - name: JobItem
    parent: HaulJob
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: haul_job_id, type: string, source: system, description: "FK -> HaulJob.id" }
      - { name: category, type: enum, source: input, description: "STANDARD | MATTRESS | APPLIANCE | FREON_APPLIANCE. Enum set {STANDARD, MATTRESS, APPLIANCE, FREON_APPLIANCE}" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Item count; per-item surcharge multiplied by quantity then rounded", constraints: ">= 1" }
      - { name: description, type: string, source: input, description: "Free-text label" }

  - name: PhotoEstimate
    parent: HaulJob
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: haul_job_id, type: string, source: system, description: "FK -> HaulJob.id" }
      - { name: photo_url, type: string, source: input, description: "URL of the submitted photo" }
      - { name: raw_fraction, type: number, source: input, description: "Estimator's raw truck-fraction read from the photo (0,1]", constraints: "> 0 and <= 1.0" }
      - { name: declared_items, type: array, source: input, description: "Array of {category, quantity} declared from the photo for surcharge estimate" }
      - { name: accepted, type: boolean, source: computed, description: "True for the single estimate accepted to move the job to ESTIMATED; at most one accepted per job" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | SUPERSEDED. Enum set {SUBMITTED, ACCEPTED, SUPERSEDED}" }

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: haul_job_id, type: string, source: input, description: "FK -> HaulJob.id; the job this dispatch serves" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; the assigned crew" }
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id; the assigned truck" }
      - { name: window_start_utc, type: datetime, source: input, description: "Pickup window start (inclusive); half-open interval start" }
      - { name: window_end_utc, type: datetime, source: input, description: "Pickup window end (exclusive); must be > window_start_utc" }
      - { name: window_minutes, type: integer, source: computed, description: "(window_end_utc - window_start_utc) in whole minutes" }
      - { name: dispatch_status, type: enum, source: system, description: "RESERVED | ACTIVE | RELEASED | VOIDED. RESERVED/ACTIVE occupy crew+truck; RELEASED on completion; VOIDED on cancel. Enum set {RESERVED, ACTIVE, RELEASED, VOIDED}" }

  - name: DiversionRecord
    parent: HaulJob
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: haul_job_id, type: string, source: system, description: "FK -> HaulJob.id" }
      - { name: destination, type: enum, source: input, description: "DONATION | RECYCLING. Both earn diversion credit; RECYCLING also incurs recycle_fee_per_ton. Enum set {DONATION, RECYCLING}" }
      - { name: tons, type: number, source: input, description: "Weight diverted to this destination", constraints: ">= 0" }

  - name: DumpTicket
    parent: HaulJob
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: haul_job_id, type: string, source: system, description: "FK -> HaulJob.id" }
      - { name: landfill_tons, type: number, source: input, description: "Weight taken to landfill for this ticket", constraints: ">= 0" }
      - { name: landfill_fraction, type: number, source: input, description: "Truck fraction of mixed waste to landfill for this ticket (VOLUME_BASED variant input)", constraints: ">= 0 and <= 1.0" }
      - { name: fee_basis, type: enum, source: input, description: "WEIGHT_BASED | VOLUME_BASED; selects which dump-fee variant computes this ticket's pass-through fee. Enum set {WEIGHT_BASED, VOLUME_BASED}" }
      - { name: dump_fee_cents, type: integer, source: computed, description: "Pass-through landfill fee for this ticket per the chosen fee_basis variant" }

  - name: Invoice
    parent: HaulJob
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: haul_job_id, type: string, source: system, description: "FK -> HaulJob.id; one invoice per completed job" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the job" }
      - { name: total_cents, type: integer, source: computed, description: "Invoice amount; equals HaulJob.final_total_cents at issue, or cancellation_fee_cents for a cancellation invoice" }
      - { name: kind, type: enum, source: system, description: "SERVICE | CANCELLATION. SERVICE for completed jobs, CANCELLATION for cancellation-fee invoices. Enum set {SERVICE, CANCELLATION}" }
      - { name: billing_status, type: enum, source: system, description: "DRAFT | ISSUED | SETTLED. Independent of dispute_status. Enum set {DRAFT, ISSUED, SETTLED}" }
      - { name: dispute_status, type: enum, source: system, description: "NONE | DISPUTED | RESOLVED. Independent of billing_status. Enum set {NONE, DISPUTED, RESOLVED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- HaulJob: cyclic (revision loop) + cross-entity guards ----
  - entity: HaulJob
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ESTIMATED
        trigger: "POST /haul-jobs/{jobId}/photo-estimates/{estimateId}/accept"
        actor: Customer
        preconditions:
          - "Job has at least one PhotoEstimate in SUBMITTED status (ERR_NO_ESTIMATE)"
          - "Target PhotoEstimate is in SUBMITTED status (ERR_ESTIMATE_NOT_SUBMITTED)"
        side_effects:
          - "Target PhotoEstimate.status -> ACCEPTED, accepted=true; any other ACCEPTED estimate.status -> SUPERSEDED, accepted=false"
          - "Compute HaulJob.estimated_truck_fraction = round_up(estimate.raw_fraction) [calc: estimated_truck_fraction]"
          - "Compute HaulJob.estimated_total_cents [calc: estimated_total_cents]"

      - from: ESTIMATED
        to: SCHEDULED
        trigger: "POST /dispatches"
        actor: Dispatcher
        preconditions:
          - "Referenced HaulJob is in ESTIMATED status (ERR_JOB_NOT_ESTIMATED)"
          - "expected_crew_version matches Crew.version (ERR_STALE_CREW_VERSION) [concurrency: dispatch-create-stale-crew]"
          - "Crew.status == ON_DUTY (ERR_CREW_OFF_DUTY)"
          - "Truck.status == IN_SERVICE (ERR_TRUCK_OUT_OF_SERVICE)"
          - "Window [window_start_utc, window_end_utc) lies within [Crew.shift_start_utc, Crew.shift_end_utc) (ERR_WINDOW_OUTSIDE_SHIFT)"
          - "No Crew overlap: window keeps >= Crew.buffer_minutes gap from every other RESERVED/ACTIVE Dispatch window on this crew (ERR_CREW_WINDOW_CONFLICT) [overlap: crew-buffer-overlap]"
          - "No Truck overlap: window does not intersect (half-open) any RESERVED/ACTIVE Dispatch window on this truck (ERR_TRUCK_WINDOW_CONFLICT) [overlap: truck-halfopen-overlap]"
          - "Job has a FREON_APPLIANCE JobItem only if Crew.hazmat_certified == true (ERR_CREW_NOT_HAZMAT)"
        side_effects:
          - "Create Dispatch with dispatch_status=RESERVED, window_minutes computed"
          - "Crew.reserved_minutes += new Dispatch.window_minutes [calc: crew_reserved_minutes]"
          - "increments Crew.version by 1"
          - "HaulJob.status -> SCHEDULED"

      - from: SCHEDULED
        to: ESTIMATED
        trigger: "POST /haul-jobs/{jobId}/revise"
        actor: Customer
        preconditions:
          - "Job is in SCHEDULED status (ERR_JOB_NOT_REVISABLE)"
          - "expected_job_version matches HaulJob.version (ERR_STALE_JOB_VERSION) [concurrency: revise-stale-job]"
        side_effects:
          - "The job's RESERVED Dispatch.dispatch_status -> VOIDED"
          - "Crew.reserved_minutes -= that Dispatch.window_minutes (caused by void) [calc: crew_reserved_minutes]"
          - "HaulJob.status -> ESTIMATED (customer may submit a new estimate / re-accept, then re-dispatch)"
          - "increments HaulJob.version by 1"
        note: "Cyclic edge: SCHEDULED -> ESTIMATED forms the revision loop with ESTIMATED -> SCHEDULED."

      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /dispatches/{dispatchId}/activate"
        actor: Dispatcher
        preconditions:
          - "Dispatch.dispatch_status == RESERVED (ERR_DISPATCH_NOT_RESERVED)"
          - "Crew.status == ON_DUTY (ERR_CREW_OFF_DUTY)"
        side_effects:
          - "Dispatch.dispatch_status -> ACTIVE"
          - "HaulJob.status -> DISPATCHED"

      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /haul-jobs/{jobId}/arrive"
        actor: CrewLead
        preconditions:
          - "Job is in DISPATCHED status (ERR_JOB_NOT_DISPATCHED)"
        side_effects:
          - "HaulJob.status -> ON_SITE"

      - from: ON_SITE
        to: LOADED
        trigger: "POST /haul-jobs/{jobId}/load"
        actor: CrewLead
        preconditions:
          - "Job is in ON_SITE status (ERR_JOB_NOT_ON_SITE)"
          - "measured_truck_fraction in (0, 1.0] (ERR_INVALID_FRACTION)"
        side_effects:
          - "HaulJob.measured_truck_fraction set; final billed fraction = round_up(measured) [calc: final_total_cents]"
          - "Each DumpTicket.dump_fee_cents computed [calc: dump_fee_passthrough]"
          - "Compute HaulJob.final_total_cents [calc: final_total_cents]"
          - "HaulJob.status -> LOADED"

      - from: LOADED
        to: COMPLETED
        trigger: "POST /haul-jobs/{jobId}/complete"
        actor: Dispatcher
        preconditions:
          - "Job is in LOADED status (ERR_JOB_NOT_LOADED)"
        side_effects:
          - "Create Invoice {kind=SERVICE, billing_status=ISSUED, dispute_status=NONE, total_cents=HaulJob.final_total_cents} (caused by completion)"
          - "Customer.outstanding_balance_cents += Invoice.total_cents (caused by invoice issue) [calc: customer_outstanding_balance]"
          - "The job's ACTIVE Dispatch.dispatch_status -> RELEASED"
          - "Crew.reserved_minutes -= that Dispatch.window_minutes (caused by release) [calc: crew_reserved_minutes]"
          - "HaulJob.status -> COMPLETED"

      - from: [ESTIMATED, SCHEDULED, DISPATCHED]
        to: CANCELLED
        trigger: "POST /haul-jobs/{jobId}/cancel"
        actor: Customer
        preconditions:
          - "Job is in ESTIMATED, SCHEDULED, or DISPATCHED status (ERR_JOB_NOT_CANCELLABLE)"
        side_effects:
          - "Compute HaulJob.cancellation_fee_cents from job status at cancel time [calc: cancellation_fee]"
          - "If the job has a RESERVED or ACTIVE Dispatch: Dispatch.dispatch_status -> VOIDED (caused by cancel)"
          - "Crew.reserved_minutes -= that Dispatch.window_minutes (caused by void) [calc: crew_reserved_minutes]"
          - "If cancellation_fee_cents > 0: create Invoice {kind=CANCELLATION, billing_status=ISSUED, dispute_status=NONE, total_cents=cancellation_fee_cents} and Customer.outstanding_balance_cents += that fee [calc: customer_outstanding_balance]"
          - "HaulJob.status -> CANCELLED"

  # ---- Dispatch: linear with VOIDED/RELEASED terminals (driven by job edges) ----
  - entity: Dispatch
    field: dispatch_status
    initial_state: RESERVED
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /dispatches/{dispatchId}/activate"
        actor: Dispatcher
        preconditions:
          - "Dispatch is RESERVED (ERR_DISPATCH_NOT_RESERVED)"
        side_effects:
          - "Drives HaulJob SCHEDULED -> DISPATCHED (see HaulJob machine)"
      - from: [RESERVED, ACTIVE]
        to: VOIDED
        trigger: "system (HaulJob cancel or revise voids the dispatch)"
        actor: system
        preconditions: []
        side_effects:
          - "Crew.reserved_minutes decremented by this window_minutes"
      - from: ACTIVE
        to: RELEASED
        trigger: "system (HaulJob complete releases the dispatch)"
        actor: system
        preconditions: []
        side_effects:
          - "Crew.reserved_minutes decremented by this window_minutes"

  # ---- Invoice: parallel dimensions (billing_status x dispute_status) ----
  - entity: Invoice
    field: billing_status
    initial_state: ISSUED
    terminal_states: [SETTLED]
    transitions:
      - from: ISSUED
        to: SETTLED
        trigger: "POST /invoices/{invoiceId}/settle"
        actor: Billing
        preconditions:
          - "Invoice.billing_status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
          - "Invoice.dispute_status != DISPUTED (ERR_INVOICE_DISPUTED) [cross-entity not required; same-row dimension guard]"
          - "Linked HaulJob.status == COMPLETED for SERVICE invoices, or == CANCELLED for CANCELLATION invoices (ERR_JOB_NOT_BILLABLE)"
        side_effects:
          - "Invoice.billing_status -> SETTLED"
          - "Customer.outstanding_balance_cents -= Invoice.total_cents [calc: customer_outstanding_balance]"
      - from: ISSUED
        to: ISSUED
        trigger: "POST /invoices/{invoiceId}/dispute"
        actor: Customer
        preconditions:
          - "Invoice.dispute_status == NONE (ERR_INVOICE_ALREADY_DISPUTED)"
          - "Invoice.billing_status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "Invoice.dispute_status -> DISPUTED (parallel dimension; billing_status unchanged)"
        note: "Parallel-dimension edge: mutates dispute_status only; billing_status stays ISSUED."
      - from: ISSUED
        to: ISSUED
        trigger: "POST /invoices/{invoiceId}/resolve-dispute"
        actor: Billing
        preconditions:
          - "Invoice.dispute_status == DISPUTED (ERR_INVOICE_NOT_DISPUTED)"
        side_effects:
          - "Invoice.dispute_status -> RESOLVED (parallel dimension; billing_status stays ISSUED, may then settle)"

  # ---- PhotoEstimate: SUBMITTED -> ACCEPTED/SUPERSEDED ----
  - entity: PhotoEstimate
    field: status
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /haul-jobs/{jobId}/photo-estimates/{estimateId}/accept"
        actor: Customer
        preconditions:
          - "Estimate is SUBMITTED (ERR_ESTIMATE_NOT_SUBMITTED)"
        side_effects:
          - "accepted=true; drives HaulJob DRAFT->ESTIMATED or revision re-accept"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (another estimate accepted on the same job)"
        actor: system
        preconditions: []
        side_effects:
          - "accepted=false"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: dispatch-create-stale-crew
    parent_entity: Crew
    write_endpoint: "POST /dispatches"
    occ_field: "expected_crew_version"
    description: |
      Creating a Dispatch against a Crew whose version has advanced since the
      client last observed it is rejected. Another Dispatch may have just
      reserved an overlapping window on the same crew (legitimately bumping the
      crew's version); the current writer's view of the crew is therefore stale
      and its overlap check would race against an outdated picture.
    error_id: ERR_STALE_CREW_VERSION
    http_status: 412

  - rule_id: revise-stale-job
    parent_entity: HaulJob
    write_endpoint: "POST /haul-jobs/{jobId}/revise"
    occ_field: "expected_job_version"
    description: |
      Revising a SCHEDULED HaulJob whose version has advanced since the client
      last observed it is rejected. A prior accepted re-estimate or dispatch may
      have already moved the job, so the version the client carries is stale.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_truck_fraction
    trigger: "PhotoEstimate accept (HaulJob DRAFT->ESTIMATED, or revision re-accept)"
    algorithm: threshold
    formula: |
      raw = accepted_estimate.raw_fraction
      steps = ceil(raw / policy.fraction_step)          # round UP to next step
      billed = steps * policy.fraction_step
      estimated_truck_fraction = max(billed, policy.min_billable_fraction)
    input_set: "the single PhotoEstimate transitioned to ACCEPTED on this job"
    constants: { }
    precision: "fraction kept exact at multiples of fraction_step (0.125)"

  - name: estimated_total_cents
    trigger: "PhotoEstimate accept (HaulJob DRAFT->ESTIMATED)"
    algorithm: tiered_pricing
    formula: |
      base = base_haul_cents(estimated_truck_fraction, policy)      # see base_haul_cents
      if job.service_type == SAME_DAY:
        base = base + round(base * policy.same_day_surcharge_pct)   # rush uplift, rounded
      surcharge = surcharge_total_cents(accepted_estimate.declared_items, policy)  # round per-item then sum
      estimated_total_cents = base + surcharge
    input_set: "accepted PhotoEstimate.declared_items + estimated_truck_fraction; NO dump/diversion/tax (unknown pre-load)"
    constants: { }
    precision: "integer cents; round_half_up at each round() step"
    variants:
      - name: estimate
        when: "PhotoEstimate accepted; job entering ESTIMATED"
        difference: "Uses estimator's declared_items and raw photo fraction; excludes dump fees, diversion credits, and tax — these are unknown until the load is weighed on-site."

  - name: final_total_cents
    trigger: "HaulJob load (ON_SITE->LOADED)"
    algorithm: tiered_pricing
    formula: |
      # base_haul_cents(billed_fraction, policy):
      #   billed = max(ceil(raw/step)*step, min_billable_fraction)
      #   tiers ordered by upper_fraction; for each band [prev_upper, upper):
      #     band_amount = (min(billed,upper) - prev_upper) clamped to >=0
      #     base += band_amount * policy.full_truck_cents * marginal_multiplier
      #   base = round(base)
      billed = round_up(job.measured_truck_fraction)
      base = base_haul_cents(billed, policy)
      if job.service_type == SAME_DAY:
        base = base + round(base * policy.same_day_surcharge_pct)
      surcharge = surcharge_total_cents(job.JobItems, policy)        # round per-item then sum
      dump = sum(dt.dump_fee_cents for dt in job.DumpTickets)        # per ticket, see dump_fee_passthrough
      recycle = sum(round(dr.tons * policy.recycle_fee_per_ton_cents) for dr in DiversionRecords where destination==RECYCLING)
      credit  = sum(round(dr.tons * policy.diversion_credit_per_ton_cents) for dr in ALL DiversionRecords)
      subtotal = base + surcharge + dump + recycle - credit
      tax = round(subtotal * policy.tax_pct)
      final_total_cents = subtotal + tax
    input_set: "JobItems on the job; DumpTickets on the job; DiversionRecords on the job; the job's frozen pricing_policy"
    constants: { }
    precision: "integer cents; round_half_up; surcharge rounds PER ITEM before summing; base, uplift, recycle, credit, tax each round() independently"
    variants:
      - name: final
        when: "on-site load; actual measured fraction and actual JobItems/tickets/diversion"
        difference: "Uses MEASURED fraction and ACTUAL items + dump tickets + diversion credits + tax — diverges from the photo-estimate variant on a DIFFERENT entity (HaulJob vs PhotoEstimate domain)."

  - name: dump_fee_passthrough
    trigger: "HaulJob load (ON_SITE->LOADED); computes each DumpTicket.dump_fee_cents"
    algorithm: aggregation
    formula: |
      for each DumpTicket dt on the job:
        if dt.fee_basis == WEIGHT_BASED:
          dt.dump_fee_cents = round(dt.landfill_tons * policy.dump_fee_per_ton_cents)
        elif dt.fee_basis == VOLUME_BASED:
          dt.dump_fee_cents = round(dt.landfill_fraction * policy.full_truck_dump_cents)
    input_set: "all DumpTickets on the job"
    constants: { }
    precision: "integer cents; round_half_up per ticket"
    variants:
      - name: weight_based
        when: "DumpTicket.fee_basis == WEIGHT_BASED"
        difference: "Fee = tons * per-ton rate."
      - name: volume_based
        when: "DumpTicket.fee_basis == VOLUME_BASED"
        difference: "Fee = truck-fraction-to-landfill * full-truck flat dump cost; the SAME physical load yields a different fee than weight_based, on the DumpTicket domain (distinct from the estimate-vs-final pair)."

  - name: cancellation_fee
    trigger: "HaulJob cancel ({ESTIMATED,SCHEDULED,DISPATCHED}->CANCELLED)"
    algorithm: threshold
    formula: |
      s = job.status at cancel time
      if s == ESTIMATED:   cancellation_fee_cents = 0
      elif s == SCHEDULED: cancellation_fee_cents = round(job.estimated_total_cents * policy.cancel_pct_scheduled)
      elif s == DISPATCHED: cancellation_fee_cents = round(job.estimated_total_cents * policy.cancel_pct_dispatched)
    input_set: "job.estimated_total_cents and the job's status at the instant of cancellation"
    constants: { }
    precision: "integer cents; round_half_up"

  - name: crew_reserved_minutes
    trigger: "Dispatch RESERVED create / VOID / RELEASE"
    algorithm: aggregation
    formula: |
      Crew.reserved_minutes = sum(
        (d.window_end_utc - d.window_start_utc) in whole minutes
        for d in Dispatches where d.crew_id == Crew.id and d.dispatch_status IN {RESERVED, ACTIVE}
      )
    input_set: "Dispatches for this crew in {RESERVED, ACTIVE}"
    constants: { }
    precision: "integer minutes; recomputed (not delta-drifted) on every dispatch status change"

  - name: customer_outstanding_balance
    trigger: "Invoice issue (job complete / cancel-with-fee) and Invoice settle"
    algorithm: aggregation
    formula: |
      Customer.outstanding_balance_cents = sum(
        inv.total_cents for inv in Invoices
        where inv.customer_id == Customer.id and inv.billing_status == ISSUED
      )
    input_set: "Invoices for this customer with billing_status == ISSUED (i.e., not yet SETTLED)"
    constants: { }
    precision: "integer cents; recomputed from invoice set on every issue/settle"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; entity_backed roles acting on own resource must match ownership FK"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist, validated left-to-right (jobId, then estimateId/dispatchId/invoiceId/policyId; crew_id/truck_id/customer_id in body)"
    error_id: "ERR_JOB_NOT_FOUND / ERR_ESTIMATE_NOT_FOUND / ERR_DISPATCH_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_POLICY_NOT_FOUND / ERR_CREW_NOT_FOUND / ERR_TRUCK_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path/body references

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, types/enums valid, quantity>=1, window_end>window_start, raw_fraction in (0,1]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 4
    category: state
    check: "An ACTIVE PricingPolicy must exist when creating a HaulJob (to pin pricing_policy_id)"
    error_id: ERR_NO_ACTIVE_POLICY
    http_status: 409
    applies_to: "POST /haul-jobs"

  - priority: 5
    category: state
    check: "Target resource in correct state for the transition (e.g. job ESTIMATED to dispatch, RESERVED to activate, ISSUED to settle)"
    error_id: "ERR_JOB_NOT_ESTIMATED / ERR_JOB_NOT_REVISABLE / ERR_JOB_NOT_DISPATCHED / ERR_JOB_NOT_ON_SITE / ERR_JOB_NOT_LOADED / ERR_JOB_NOT_CANCELLABLE / ERR_DISPATCH_NOT_RESERVED / ERR_INVOICE_NOT_ISSUED / ERR_ESTIMATE_NOT_SUBMITTED"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity state guards: dispatch requires Crew.status==ON_DUTY and Truck.status==IN_SERVICE; settle requires linked HaulJob in COMPLETED/CANCELLED"
    error_id: "ERR_CREW_OFF_DUTY / ERR_TRUCK_OUT_OF_SERVICE / ERR_JOB_NOT_BILLABLE"
    http_status: 409
    applies_to: "POST /dispatches, POST /dispatches/{dispatchId}/activate, POST /invoices/{invoiceId}/settle"

  - priority: 7
    category: business_safety
    check: "Dispatch with any FREON_APPLIANCE JobItem requires Crew.hazmat_certified==true (EPA refrigerant handling)"
    error_id: ERR_CREW_NOT_HAZMAT
    http_status: 422
    applies_to: "POST /dispatches"

  - priority: 8
    category: business_temporal
    check: "Pickup window must lie within crew shift, and must clear crew buffer / not collide with truck windows"
    error_id: "ERR_WINDOW_OUTSIDE_SHIFT / ERR_CREW_WINDOW_CONFLICT / ERR_TRUCK_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /dispatches"

  - priority: 9
    category: business_fiscal
    check: "Customer.outstanding_balance_cents + new exposure must not exceed Customer.credit_limit_cents (checked at dispatch / completion)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /dispatches, POST /haul-jobs/{jobId}/complete"

  - priority: 10
    category: business_constraint
    check: "OCC: expected_crew_version / expected_job_version must match the parent's current version"
    error_id: "ERR_STALE_CREW_VERSION / ERR_STALE_JOB_VERSION"
    http_status: 412
    applies_to: "POST /dispatches, POST /haul-jobs/{jobId}/revise"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- PricingPolicy (PlatformAdmin) ----
  - method: POST
    path: "/pricing-policies"
    description: "Create a PricingPolicy; the first created (or any newly activated) becomes ACTIVE"
    roles: [PlatformAdmin]
    code: 201
    input: [name, full_truck_cents, tier_breaks, "min_billable_fraction?", "fraction_step?", mattress_surcharge_cents, appliance_surcharge_cents, freon_surcharge_cents, dump_fee_per_ton_cents, full_truck_dump_cents, recycle_fee_per_ton_cents, diversion_credit_per_ton_cents, "same_day_surcharge_pct?", "tax_pct?", "cancel_pct_scheduled?", "cancel_pct_dispatched?"]
    output: PricingPolicy
    side_effects: ["status=ACTIVE; any prior ACTIVE policy -> RETIRED"]

  - method: GET
    path: "/pricing-policies/{id}"
    description: "Get a pricing policy"
    roles: [PlatformAdmin, Dispatcher, Billing]
    code: 200
    input: []
    output: PricingPolicy
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a Customer"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, "credit_limit_cents?"]
    output: Customer
    side_effects: ["status=ACTIVE, outstanding_balance_cents=0"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (with computed outstanding_balance_cents)"
    roles: [PlatformAdmin, Billing, Dispatcher, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}/haul-jobs"
    description: "List a customer's haul jobs (FK reverse-reachability for HaulJob.customer_id)"
    roles: [PlatformAdmin, Billing, Dispatcher, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "HaulJob[]"
    side_effects: []

  - method: GET
    path: "/customers/{id}/invoices"
    description: "List a customer's invoices (FK reverse-reachability for Invoice.customer_id)"
    roles: [PlatformAdmin, Billing, Customer]
    code: 200
    input: ["billing_status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # ---- Crew (PlatformAdmin) ----
  - method: POST
    path: "/crews"
    description: "Create a Crew with a daily shift window"
    roles: [PlatformAdmin]
    code: 201
    input: [name, shift_start_utc, shift_end_utc, "buffer_minutes?", "hazmat_certified?"]
    output: Crew
    side_effects: ["status=ON_DUTY, reserved_minutes=0"]

  - method: GET
    path: "/crews/{id}"
    description: "Get a crew (with computed reserved_minutes and version)"
    roles: [PlatformAdmin, Dispatcher, CrewLead]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: GET
    path: "/crews/{id}/dispatches"
    description: "List dispatches for a crew (FK reverse-reachability for Dispatch.crew_id)"
    roles: [PlatformAdmin, Dispatcher, CrewLead]
    code: 200
    input: ["dispatch_status?", "limit?", "offset?"]
    output: "Dispatch[]"
    side_effects: []

  - method: POST
    path: "/crews/{id}/status"
    description: "Set crew duty status (ON_DUTY / OFF_DUTY)"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Crew
    side_effects: ["Crew.status updated; increments Crew.version by 1"]

  # ---- Truck (PlatformAdmin) ----
  - method: POST
    path: "/trucks"
    description: "Create a Truck"
    roles: [PlatformAdmin]
    code: 201
    input: [name]
    output: Truck
    side_effects: ["status=IN_SERVICE"]

  - method: GET
    path: "/trucks/{id}"
    description: "Get a truck"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: []
    output: Truck
    side_effects: []

  - method: GET
    path: "/trucks/{id}/dispatches"
    description: "List dispatches for a truck (FK reverse-reachability for Dispatch.truck_id)"
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: ["dispatch_status?", "limit?", "offset?"]
    output: "Dispatch[]"
    side_effects: []

  - method: POST
    path: "/trucks/{id}/status"
    description: "Set truck service status (IN_SERVICE / OUT_OF_SERVICE)"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Truck
    side_effects: ["Truck.status updated"]

  # ---- HaulJob ----
  - method: POST
    path: "/haul-jobs"
    description: "Create a HaulJob in DRAFT; pins the ACTIVE PricingPolicy"
    roles: [Customer, Dispatcher]
    code: 201
    input: [customer_id, service_type, address]
    output: HaulJob
    side_effects: ["status=DRAFT; pricing_policy_id := current ACTIVE policy.id"]

  - method: GET
    path: "/haul-jobs"
    description: "List haul jobs (filterable by customer_id or pricing_policy_id)"
    roles: [PlatformAdmin, Dispatcher, Billing, Customer]
    code: 200
    input: ["customer_id?", "pricing_policy_id?", "status?", "limit?", "offset?"]
    output: "HaulJob[]"
    side_effects: []

  - method: GET
    path: "/haul-jobs/{id}"
    description: "Get a haul job (computed estimate/final totals)"
    roles: [PlatformAdmin, Dispatcher, Billing, Customer, CrewLead]
    code: 200
    input: []
    output: HaulJob
    side_effects: []

  - method: POST
    path: "/haul-jobs/{id}/items"
    description: "Add a JobItem to a DRAFT/ESTIMATED job"
    roles: [Customer, Dispatcher]
    code: 201
    input: [category, "quantity?", "description?"]
    output: JobItem
    side_effects: []

  - method: GET
    path: "/haul-jobs/{id}/items"
    description: "List JobItems on a job (FK reverse-reachability for JobItem.haul_job_id)"
    roles: [PlatformAdmin, Dispatcher, Billing, Customer, CrewLead]
    code: 200
    input: ["limit?", "offset?"]
    output: "JobItem[]"
    side_effects: []

  - method: POST
    path: "/haul-jobs/{id}/photo-estimates"
    description: "Submit a PhotoEstimate for the job"
    roles: [Customer, Dispatcher]
    code: 201
    input: [photo_url, raw_fraction, "declared_items?"]
    output: PhotoEstimate
    side_effects: ["PhotoEstimate.status=SUBMITTED"]

  - method: GET
    path: "/haul-jobs/{id}/photo-estimates"
    description: "List PhotoEstimates on a job (FK reverse-reachability for PhotoEstimate.haul_job_id)"
    roles: [PlatformAdmin, Dispatcher, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PhotoEstimate[]"
    side_effects: []

  - method: POST
    path: "/haul-jobs/{id}/photo-estimates/{estimateId}/accept"
    description: "Accept a SUBMITTED estimate; moves job DRAFT/revision -> ESTIMATED"
    roles: [Customer]
    code: 200
    input: []
    output: HaulJob
    side_effects: ["estimate ACCEPTED, prior ACCEPTED SUPERSEDED; compute estimated_truck_fraction + estimated_total_cents; job -> ESTIMATED"]

  - method: POST
    path: "/haul-jobs/{id}/revise"
    description: "Revise a SCHEDULED job back to ESTIMATED (voids its reserved dispatch)"
    roles: [Customer]
    code: 200
    input: [expected_job_version]
    output: HaulJob
    side_effects: ["RESERVED dispatch -> VOIDED; crew reserved_minutes decremented; job -> ESTIMATED; increments HaulJob.version by 1"]

  - method: POST
    path: "/haul-jobs/{id}/arrive"
    description: "CrewLead marks arrival; DISPATCHED -> ON_SITE"
    roles: [CrewLead]
    code: 200
    input: []
    output: HaulJob
    side_effects: ["job -> ON_SITE"]

  - method: POST
    path: "/haul-jobs/{id}/load"
    description: "CrewLead records measured fraction; ON_SITE -> LOADED; computes final_total"
    roles: [CrewLead]
    code: 200
    input: [measured_truck_fraction]
    output: HaulJob
    side_effects: ["compute DumpTicket fees + final_total_cents; job -> LOADED"]

  - method: POST
    path: "/haul-jobs/{id}/complete"
    description: "Dispatcher completes job; LOADED -> COMPLETED; issues SERVICE invoice"
    roles: [Dispatcher]
    code: 200
    input: []
    output: HaulJob
    side_effects: ["create ISSUED SERVICE Invoice; customer balance += total; ACTIVE dispatch -> RELEASED; crew reserved_minutes decremented; job -> COMPLETED"]

  - method: POST
    path: "/haul-jobs/{id}/cancel"
    description: "Customer cancels job (ESTIMATED/SCHEDULED/DISPATCHED -> CANCELLED)"
    roles: [Customer]
    code: 200
    input: []
    output: HaulJob
    side_effects: ["compute cancellation_fee; void RESERVED/ACTIVE dispatch; crew reserved_minutes decremented; issue CANCELLATION invoice if fee>0; job -> CANCELLED"]

  - method: GET
    path: "/haul-jobs/{id}/diversions"
    description: "List DiversionRecords on a job (FK reverse-reachability for DiversionRecord.haul_job_id)"
    roles: [PlatformAdmin, Dispatcher, Billing, CrewLead]
    code: 200
    input: ["destination?", "limit?", "offset?"]
    output: "DiversionRecord[]"
    side_effects: []

  - method: POST
    path: "/haul-jobs/{id}/diversions"
    description: "Record a donation/recycling diversion (on ON_SITE job, before load)"
    roles: [CrewLead]
    code: 201
    input: [destination, tons]
    output: DiversionRecord
    side_effects: []

  - method: GET
    path: "/haul-jobs/{id}/dump-tickets"
    description: "List DumpTickets on a job (FK reverse-reachability for DumpTicket.haul_job_id)"
    roles: [PlatformAdmin, Dispatcher, Billing, CrewLead]
    code: 200
    input: ["limit?", "offset?"]
    output: "DumpTicket[]"
    side_effects: []

  - method: POST
    path: "/haul-jobs/{id}/dump-tickets"
    description: "Record a landfill dump ticket (on ON_SITE job, before load)"
    roles: [CrewLead]
    code: 201
    input: [landfill_tons, landfill_fraction, fee_basis]
    output: DumpTicket
    side_effects: ["dump_fee_cents computed at load time"]

  # ---- Dispatch ----
  - method: POST
    path: "/dispatches"
    description: "Create a Dispatch (reserve crew+truck window); job ESTIMATED -> SCHEDULED"
    roles: [Dispatcher]
    code: 201
    input: [haul_job_id, crew_id, truck_id, window_start_utc, window_end_utc, expected_crew_version]
    output: Dispatch
    side_effects: ["Dispatch RESERVED; crew reserved_minutes += window_minutes; increments Crew.version by 1; job -> SCHEDULED"]

  - method: GET
    path: "/dispatches"
    description: "List dispatches (filterable by haul_job_id, crew_id, or truck_id); FK reverse-reachability for Dispatch.haul_job_id"
    roles: [PlatformAdmin, Dispatcher, CrewLead]
    code: 200
    input: ["haul_job_id?", "crew_id?", "truck_id?", "dispatch_status?", "limit?", "offset?"]
    output: "Dispatch[]"
    side_effects: []

  - method: GET
    path: "/dispatches/{id}"
    description: "Get a dispatch"
    roles: [PlatformAdmin, Dispatcher, CrewLead]
    code: 200
    input: []
    output: Dispatch
    side_effects: []

  - method: POST
    path: "/dispatches/{id}/activate"
    description: "Activate a RESERVED dispatch; job SCHEDULED -> DISPATCHED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["Dispatch -> ACTIVE; job -> DISPATCHED"]

  # ---- Invoice ----
  - method: GET
    path: "/haul-jobs/{id}/invoices"
    description: "List invoices for a job (FK reverse-reachability for Invoice.haul_job_id)"
    roles: [PlatformAdmin, Dispatcher, Billing, Customer]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [PlatformAdmin, Billing, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/settle"
    description: "Billing settles an ISSUED, non-disputed invoice"
    roles: [Billing]
    code: 200
    input: []
    output: Invoice
    side_effects: ["billing_status -> SETTLED; customer outstanding_balance_cents -= total"]

  - method: POST
    path: "/invoices/{id}/dispute"
    description: "Customer disputes an ISSUED invoice (parallel dimension)"
    roles: [Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["dispute_status -> DISPUTED; billing_status unchanged"]

  - method: POST
    path: "/invoices/{id}/resolve-dispute"
    description: "Billing resolves a DISPUTED invoice"
    roles: [Billing]
    code: 200
    input: []
    output: Invoice
    side_effects: ["dispute_status -> RESOLVED; billing_status unchanged"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-only: set the server's current UTC clock (for same-day vs scheduled / shift windows)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock advanced to the provided instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation, or entity_backed actor not the resource owner" }
  # existence
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "HaulJob id does not exist" }
  - { id: ERR_ESTIMATE_NOT_FOUND, http: 404, condition: "PhotoEstimate id does not exist on this job" }
  - { id: ERR_DISPATCH_NOT_FOUND, http: 404, condition: "Dispatch id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "Crew id (path or body crew_id) does not exist" }
  - { id: ERR_TRUCK_NOT_FOUND, http: 404, condition: "Truck id (path or body truck_id) does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id (path or body customer_id) does not exist" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "PricingPolicy id does not exist" }
  # request validation
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, quantity<1, window_end<=window_start, raw_fraction out of (0,1]" }
  - { id: ERR_INVALID_FRACTION, http: 400, condition: "measured_truck_fraction not in (0, 1.0] at load" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 409, condition: "No ACTIVE PricingPolicy exists when creating a HaulJob" }
  # state
  - { id: ERR_NO_ESTIMATE, http: 409, condition: "Accept attempted but job has no SUBMITTED PhotoEstimate" }
  - { id: ERR_ESTIMATE_NOT_SUBMITTED, http: 409, condition: "Accept target estimate is not in SUBMITTED status" }
  - { id: ERR_JOB_NOT_ESTIMATED, http: 409, condition: "Dispatch requires the job to be in ESTIMATED status" }
  - { id: ERR_JOB_NOT_REVISABLE, http: 409, condition: "Revise requires the job to be in SCHEDULED status" }
  - { id: ERR_JOB_NOT_DISPATCHED, http: 409, condition: "Arrive requires the job to be in DISPATCHED status" }
  - { id: ERR_JOB_NOT_ON_SITE, http: 409, condition: "Load/diversion/dump-ticket requires the job to be in ON_SITE status" }
  - { id: ERR_JOB_NOT_LOADED, http: 409, condition: "Complete requires the job to be in LOADED status" }
  - { id: ERR_JOB_NOT_CANCELLABLE, http: 409, condition: "Cancel requires job in ESTIMATED/SCHEDULED/DISPATCHED status" }
  - { id: ERR_DISPATCH_NOT_RESERVED, http: 409, condition: "Activate requires the dispatch to be RESERVED" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Settle/dispute requires the invoice to be ISSUED" }
  - { id: ERR_INVOICE_ALREADY_DISPUTED, http: 409, condition: "Dispute requires dispute_status NONE" }
  - { id: ERR_INVOICE_NOT_DISPUTED, http: 409, condition: "Resolve-dispute requires dispute_status DISPUTED" }
  - { id: ERR_INVOICE_DISPUTED, http: 409, condition: "Settle blocked while dispute_status == DISPUTED" }
  # referential / cross-entity state
  - { id: ERR_CREW_OFF_DUTY, http: 409, condition: "Dispatch/activate requires Crew.status == ON_DUTY" }
  - { id: ERR_TRUCK_OUT_OF_SERVICE, http: 409, condition: "Dispatch requires Truck.status == IN_SERVICE" }
  - { id: ERR_JOB_NOT_BILLABLE, http: 409, condition: "Settle requires the linked HaulJob in COMPLETED (SERVICE) or CANCELLED (CANCELLATION)" }
  # safety
  - { id: ERR_CREW_NOT_HAZMAT, http: 422, condition: "Job has a FREON_APPLIANCE item but assigned Crew.hazmat_certified is false" }
  # temporal
  - { id: ERR_WINDOW_OUTSIDE_SHIFT, http: 409, condition: "Pickup window not contained within crew shift window" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 409, condition: "Pickup window violates crew buffer gap against another RESERVED/ACTIVE crew dispatch" }
  - { id: ERR_TRUCK_WINDOW_CONFLICT, http: 409, condition: "Pickup window intersects (half-open) another RESERVED/ACTIVE truck dispatch" }
  # fiscal
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Outstanding balance + new exposure would exceed customer credit_limit_cents" }
  # concurrency (OCC)
  - { id: ERR_STALE_CREW_VERSION, http: 412, condition: "expected_crew_version does not match Crew.version on dispatch create" }
  - { id: ERR_STALE_JOB_VERSION, http: 412, condition: "expected_job_version does not match HaulJob.version on revise" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator; owns configuration (pricing policies, crews, trucks, customers) and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /pricing-policies — create/activate policy"
      - "POST /customers — register customer"
      - "POST /crews — create crew"
      - "POST /crews/{crewId}/status — set crew duty"
      - "POST /trucks — create truck"
      - "POST /trucks/{truckId}/status — set truck service"
      - "POST /_clock/set_current_utc — set test clock"
    shared_operations:
      - "GET endpoints across policies, customers, crews, trucks, jobs, dispatches, invoices"

  - name: Customer
    description: "Account holder; creates and manages own jobs, submits/accepts estimates, cancels, disputes invoices"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /haul-jobs/{jobId}/photo-estimates/{estimateId}/accept — accept estimate"
      - "POST /haul-jobs/{jobId}/revise — revise scheduled job"
      - "POST /haul-jobs/{jobId}/cancel — cancel own job"
      - "POST /invoices/{invoiceId}/dispute — dispute own invoice"
    shared_operations:
      - "POST /haul-jobs — create job (with Dispatcher)"
      - "POST /haul-jobs/{jobId}/items — add item (with Dispatcher)"
      - "POST /haul-jobs/{jobId}/photo-estimates — submit estimate (with Dispatcher)"
      - "GET own jobs / items / estimates / invoices / customer record"

  - name: Dispatcher
    description: "Operations; schedules dispatches, activates crews, completes jobs"
    identity: opaque
    exclusive_operations:
      - "POST /dispatches — reserve crew+truck window"
      - "POST /dispatches/{dispatchId}/activate — activate dispatch"
      - "POST /haul-jobs/{jobId}/complete — complete job, issue invoice"
    shared_operations:
      - "POST /haul-jobs — create job (with Customer)"
      - "POST /haul-jobs/{jobId}/items — add item (with Customer)"
      - "POST /haul-jobs/{jobId}/photo-estimates — submit estimate (with Customer)"
      - "GET jobs / crews / trucks / dispatches / diversions / dump-tickets"

  - name: CrewLead
    description: "On-site crew lead; marks arrival, records diversions and dump tickets, records the load"
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /haul-jobs/{jobId}/arrive — mark on-site"
      - "POST /haul-jobs/{jobId}/load — record measured load"
      - "POST /haul-jobs/{jobId}/diversions — record diversion"
      - "POST /haul-jobs/{jobId}/dump-tickets — record dump ticket"
    shared_operations:
      - "GET own crew / dispatches / assigned jobs / items / diversions / dump-tickets"

  - name: Billing
    description: "Finance; settles invoices, resolves disputes"
    identity: opaque
    exclusive_operations:
      - "POST /invoices/{invoiceId}/settle — settle invoice"
      - "POST /invoices/{invoiceId}/resolve-dispute — resolve dispute"
    shared_operations:
      - "GET invoices / customers / jobs / pricing-policies"
