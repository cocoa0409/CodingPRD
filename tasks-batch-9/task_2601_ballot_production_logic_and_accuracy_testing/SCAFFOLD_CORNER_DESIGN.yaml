      - name: sm_cyclic_reproof_loop_covered_by_difficulty_design
        claim_type: cyclic
        grounds:
          - state_machines.BallotStyle.PROOF_REJECTED_to_PROOFING
        excluded_because:
          difficulty_instance: "non_linear_state_machine / nl_style_proof_reject_reproof_cycle"
          rationale: "The §1.8 instance already drives PROOFING -> PROOF_REJECTED -> PROOFING three times, asserting the revision bump on the loop edge only, the proof_cycle_count monotonicity and the guarded self-edge; a §1.9 recipe would re-run the identical chain."
        distinguishing_aspect: "Cyclic re-entry into PROOFING with a revision bump that occurs on the loop edge but not on the first entry."

      - name: sm_parallel_program_and_custody_axes_covered_by_difficulty_design
        claim_type: parallel
        grounds:
          - state_machines.TabulatorUnit.program_status
          - state_machines.TabulatorUnit.custody_status
        excluded_because:
          difficulty_instance: "non_linear_state_machine / nl_tabulator_parallel_program_and_custody_axes"
          rationale: "The §1.8 instance already walks both axes of one TabulatorUnit row independently and shows the LA-failure cross-axis demotion DEPLOYED -> IN_VAULT driven by a program-axis event."
        distinguishing_aspect: "Two state dimensions on the same row advancing independently, with one cross-axis coupling."

      - name: sm_guarded_deploy_transition_covered_by_difficulty_design
        claim_type: guarded_transitions
        grounds:
          - state_machines.TabulatorUnit.custody_status.IN_VAULT_to_DEPLOYED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / ce_tabulator_deploy_depends_on_lot_custody_and_precinct_style"
          rationale: "The §1.8 instance already enumerates the deploy guard's cross-entity clauses (an ISSUED lot at the precinct, the precinct's assigned style, the seal-uniqueness check) and the distinct error per failing clause."
        distinguishing_aspect: "A single transition whose guard reads three other entities, each clause producing a different typed error."

      - name: sm_compensating_recall_transition_covered_by_difficulty_design
        claim_type: compensation
        grounds:
          - state_machines.BallotLot.ISSUED_to_RECEIVED
        excluded_because:
          difficulty_instance: "compensating_invariant / ci_lot_receipt_conservation_across_issue_and_recall"
          rationale: "The §1.8 instance already asserts that recall exactly reverses issue - issued_quantity back to 0, unused_quantity back to the full receipt, issued_by_user_id cleared and the precinct ledger restored - which is the compensation claim in full."
        distinguishing_aspect: "A compensating transition that must restore every derived counter it decremented, not merely the status."

