          assert:
            - "${claim_state0} == FILED, ${claim_days} == 61, ${claim_method} == PRORATA_DAILY"
            - "${claim_cents} == 2005 (round_half_up(11999 * 61 / 365) = round_half_up(2005.3123) = 2005)"
            - "SubscriptionTerm.${term_id}.claimed_days_total == 61 while the claim is FILED"
            - "${e_credit_from_filed} == ERR_INVALID_CLAIM_STATE with HTTP 409 and credited_cents still 0"
            - "${st_review} == PLATFORM_REVIEW"
            - "${st_escalated} == ESCALATED and ${esc_reason} == 'provider ignored the statutory refund rule'"
            - "${e_escalate_twice} == ERR_INVALID_CLAIM_STATE with HTTP 409"
            - "${st_credited} == CREDITED and ${credited} == 2005"
            - "${recovered_after} == 2005"
            - "${e_deny_after_credit} == ERR_INVALID_CLAIM_STATE with HTTP 409 and RefundClaim.${claim_id}.denial_reason stays null"
            - "SubscriptionTerm.${term_id}.claimed_days_total == 61 after the credit (only DENY and CHARGE_BACK release days)"

      - name: access_status_and_disposition_status_move_as_independent_dimensions
        claim_type: Valid Transition
        grounds:
          - state_machines.DigitalAsset.transitions[UNVERIFIED->CATALOG_DISCLOSED]
          - state_machines.DigitalAsset.transitions[PENDING->ELECTED]
          - state_machines.DigitalAsset.transitions[CATALOG_DISCLOSED->ACCESS_REVOKED]
        distinguishing_aspect: |
          DigitalAsset carries two independent state dimensions: the disclosure dimension walks
          UNVERIFIED -> CATALOG_DISCLOSED -> ACCESS_REVOKED under grant events while the disposition
          dimension stays at ELECTED throughout, and the estate's disclosed_asset_count and
          assets_pending_disposition_count move independently of each other (0 and 1 at the end).
        test_recipe:
          setup:
            - "one CLOUD_STORAGE platform with supports_memorialization true, one Estate at AUTHORIZED"
            - "one CLOUD_STORAGE asset disclosed by an APPROVED CATALOG_ACCESS request"
            - "one SUBMITTED MEMORIALIZE election on that asset"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C19" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C19" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-C19", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C19", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-1", quoted_value_cents: 90000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_id: $.data.id, a1_access0: $.data.access_status, a1_disp0: $.data.disposition_status }
            - call: "POST /estates/${est_id}/platform-requests"
