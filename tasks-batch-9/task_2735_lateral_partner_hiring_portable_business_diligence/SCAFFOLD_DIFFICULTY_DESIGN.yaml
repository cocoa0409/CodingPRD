  - rule_id: non_linear_state_machine
    instances:

      - name: questionnaire_revision_loop_is_bounded_at_three_rounds
        grounds:
          - state_machines.LateralQuestionnaire.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.LateralQuestionnaire.REVISION_REQUESTED_to_SUBMITTED
          - entities.LateralQuestionnaire.fields.revision_round
          - validations[priority=25]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Non-linearity = a CYCLE with a counter that survives it. UNDER_REVIEW ->
          REVISION_REQUESTED -> SUBMITTED -> UNDER_REVIEW is traversable three times and a
          fourth attempt is refused, so the reachable state set is NOT a function of the
          current state alone: the same (UNDER_REVIEW, request-revision) pair succeeds at
          revision_round 0/1/2 and fails at 3. Entity = LateralQuestionnaire.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one ACTIVE SearchFirmEngagement, one Candidate in DILIGENCE with one ACTIVE ClientBookEntry."
            - "The LateralQuestionnaire has already traversed the revision loop three times and is back in UNDER_REVIEW with revision_round == 3."
