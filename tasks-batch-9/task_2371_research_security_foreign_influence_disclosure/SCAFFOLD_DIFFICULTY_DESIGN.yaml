              payload: { to_status: "REMOVED" }
              as: SystemAdmin
          assert:
            - "before the trigger, Investigator.${inv_id}.committed_effort_pct == 24.99 and total_commitment_pct == 24.99"
            - "after trigger call 1, Investigator.${inv_id}.committed_effort_pct == 33.32 and total_commitment_pct == 33.32"
            - "after trigger call 2, Investigator.${inv_id}.committed_effort_pct == 24.99 exactly, with no drift to 24.98 or 25.00"
