              payload: { full_name: "Other Client", email: "other@x.com", service_area_code: "98102", need_kind: "BUY" }
              as: OperationsCoordinator
              captures: { client_b: $.data.id }
            - call: "POST /clients/${client_a}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_b}/assign-agent"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_a}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_a: $.data.id }
            - call: "POST /transactions/${tx_a}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 70000000 }
              as: TransactionCoordinator
            - call: "POST /clients/${client_b}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_b: $.data.id }
            - call: "POST /transactions/${tx_b}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 80000000 }
              as: TransactionCoordinator
          trigger:
            - call: "POST /clients/${client_a}/transactions/${tx_b}/close"
              payload: {}
              as: TransactionCoordinator
              captures: { error_id: $.data.error_id }
