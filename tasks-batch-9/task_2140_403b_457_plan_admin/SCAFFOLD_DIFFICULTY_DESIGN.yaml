  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: service_15yr_catchup_three_way_min_with_qualified_org_branch
        grounds:
          - calculations.catchup_capacity_403b
          - entities.Employer.fields.is_qualified_organization
          - entities.Participant.fields.cumulative_special_catchup_used_cents
          - entities.Participant.fields.lifetime_elective_deferrals_cents
          - endpoints[GET /plan-admin/participants/{id}/contribution-limit-summary]
        distinguishing_aspect: |
          Mode (a): a formula with four independent inputs (years_of_service,
          cumulative_special_catchup_used_cents, lifetime_elective_deferrals_cents and the
          employer's qualified-organization branch) folded through a nested max/min so that
          the SECOND term of the three-way min binds at 150000 cents, while an otherwise
          identical participant at a non-qualified organization collapses to 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PUBLIC_SCHOOL employer (qualified organization) with an ACTIVE PLAN_403B plan, and a TAX_EXEMPT_501C3/OTHER employer (not a qualified organization) with its own ACTIVE PLAN_403B plan."
            - "Two participants with identical facts: born 1980-01-01 (attained_age_at_year_end 46, so no age-50 capacity), years_of_service 16, prior_employer_elective_deferrals_cents 500000 and cumulative_special_catchup_used_cents 1350000."
            - "Each participant holds one contract with prior_years_elective_deferrals_cents 6800000 and no year-to-date deferrals, giving lifetime_elective_deferrals_cents 7300000."
          setup_api_calls:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
