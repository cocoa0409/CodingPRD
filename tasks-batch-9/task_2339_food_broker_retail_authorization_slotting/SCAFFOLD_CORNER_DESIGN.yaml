      - name: post_audit_recoverable_amount_differs_by_reason_code
        claim_type: correct_result
        grounds:
          - calculations.post_audit_recovery
          - calculations.post_audit_recovery.invariant
          - errors.ERR_DUPLICATE_LINK_INVALID
          - errors.ERR_PROMO_LINK_INVALID
        distinguishing_aspect: |
          Four reason codes, four different recoverable amounts from the same
          approve-recovery endpoint: SHORTAGE is floored at half (90001 → 45000,
          proving floor and not round), DUPLICATE_BILLBACK is fully recoverable,
          COMPLIANCE_FINE is always 0 and therefore settles CONCEDED while the
          dispute dimension still reaches APPROVED, and the two link validations
          fire at priority 10 before any of that arithmetic runs.
        test_recipe:
          setup:
            - "Retailer BIGMART (dispute window 90 days) and principal NWF; clock 2026-08-01; no reviews or authorizations are needed because deductions attach to (retailer, principal)."
            - "Deductions are filed by BrokerAccountManager user u_am_1 and approved by BrokerAuditManager user u_audit_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 90001, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d1: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "COMPLIANCE_FINE", amount_cents: 75000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d2: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 60000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d0: $.data.id }
          trigger:
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "DUPLICATE_BILLBACK", amount_cents: 60001, deduction_date: "2026-08-02", original_deduction_id: "${d0}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e1: $.data.error_id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "PROMO_BILLBACK", amount_cents: 60000, deduction_date: "2026-08-02" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e2: $.data.error_id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "DUPLICATE_BILLBACK", amount_cents: 60000, deduction_date: "2026-08-02", original_deduction_id: "${d0}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d3: $.data.id }
            - call: "POST /deductions/${d1}/dispute"
              payload: { claim_amount_cents: 90001 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${d1}/substantiate"
              payload: { document_ref: "POD-1001" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${d1}/substantiate"
              payload: { document_ref: "INV-1001" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${d1}/approve-recovery"
              payload: {}
