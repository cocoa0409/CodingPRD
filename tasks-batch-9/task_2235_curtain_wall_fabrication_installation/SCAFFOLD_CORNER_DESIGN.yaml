- section: validations
  instances:
  - name: omitted_role_header_returns_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=10]
    - errors[ERR_MISSING_ROLE]
    distinguishing_aspect: 'The role header is checked before anything else: a request with no X-Role returns ERR_MISSING_ROLE
      at 401 even when the body is malformed and the addressed id does not exist, so it outranks ERR_INVALID_REQUEST (25)
      and every not-found rule (40-49).'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z; one package exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T08:00:00Z'
        as: CWProjectManager
      - call: POST /facade-packages
        payload:
          name: Tower A Facade
          floor_count: 20
          total_area_sqm: 9000.0
          contract_value_cents: 1450000000
          unit_rate_cents_per_sqm: 148733
          base_labor_rate_cents_per_hour: 9800
          design_temp_delta_c: 60.0
          weather_tightness_deadline_date: '2026-12-15'
        as: CWProjectManager
        captures:
          pkg: $.data.id
      trigger:
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
        as: (no X-Role header sent)
        captures:
          e_role: $.data.error_id
      - call: GET /facade-packages/11111111-2222-4333-8444-555555555555
        payload: {}
        as: (no X-Role header sent)
        captures:
          e_role2: $.data.error_id
      assert:
      - the zone create without X-Role returns ERR_MISSING_ROLE with HTTP 401, not ERR_INVALID_REQUEST for the eight absent
        fields
      - the unknown-package read without X-Role returns ERR_MISSING_ROLE with HTTP 401, not ERR_PACKAGE_NOT_FOUND
      - an empty-string X-Role is treated the same as an absent one
      - the error envelope still carries meta.api_request_id and response_type error
      - no row was created and FacadePackage.${pkg}.version is unchanged
  - name: actor_recording_writes_reject_a_missing_user_header_unauthenticated
