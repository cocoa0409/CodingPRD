              captures: { c1_id: $.data.id, c1_v: $.data.version, c1_bp_before: $.data.effective_blueprint_id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v}", dimensions: [{ code: "D1", weight: 0.5000, max_score: 100, critical: false }, { code: "D2", weight: 0.4000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { e_sum: $.data.error_id }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }, { code: "D2", weight: 0.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { e_zero_weight: $.data.error_id }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 0, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { e_max_score: $.data.error_id }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v}", dimensions: [{ code: "D1", weight: 0.5000, max_score: 100, critical: false }, { code: "D1", weight: 0.5000, max_score: 100, critical: true }], passing_rule: "WEIGHTED_PLUS_ALL_CRITICAL", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { e_dup_code: $.data.error_id }
            - call: "GET /competencies/${c1_id}"
              payload: {}
              as: Registrar
              captures: { c1_v_after: $.data.version, c1_bp_after: $.data.effective_blueprint_id }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v}", dimensions: [{ code: "D1", weight: 0.6000, max_score: 100, critical: false }, { code: "D2", weight: 0.4000, max_score: 50, critical: true }], passing_rule: "WEIGHTED_PLUS_ALL_CRITICAL", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { bp_label: $.data.version_label, bp_dims: $.data.dimension_count, bp_status: $.data.status }
          assert:
            - "${c1_bp_before} == null"
            - "${e_sum} == ERR_RUBRIC_WEIGHTS_INVALID"
            - "${e_zero_weight} == ERR_RUBRIC_WEIGHTS_INVALID"
            - "${e_max_score} == ERR_RUBRIC_WEIGHTS_INVALID"
            - "${e_dup_code} == ERR_RUBRIC_WEIGHTS_INVALID"
            - "all four rejections have status code 422"
            - "${c1_v_after} == 1"
            - "${c1_bp_after} == null"
            - "${bp_label} == BP-1"
            - "${bp_dims} == 2"
            - "${bp_status} == PUBLISHED"
            - "the four rejected creates left no AssessmentBlueprint rows: the list for this competency has total_count 1 after the successful create"

