              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "INACT-1", name: "Discontinued Rod", category: "ROD", unit_price_cents: 8000, stock_qty: 0, is_active: false, is_special_order_eligible: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRODUCT_INACTIVE"

      - name: val_special_order_not_eligible
        claim_type: Violation → Error
        grounds: ["errors[ERR_NOT_SPECIAL_ORDER_ELIGIBLE]", entities.Product.fields.is_special_order_eligible]
        distinguishing_aspect: "Requesting a special order for an active but non-eligible product returns ERR_NOT_SPECIAL_ORDER_ELIGIBLE."
        test_recipe:
          setup: ["Customer; product active, is_special_order_eligible=false."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Elig Cust", email: "el@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "NOEL-1", name: "Stock Rod", category: "ROD", unit_price_cents: 8000, stock_qty: 5, is_special_order_eligible: false }
              as: ShopManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_SPECIAL_ORDER_ELIGIBLE"

      - name: val_empty_sale_complete
        claim_type: Violation → Error
        grounds: ["errors[ERR_EMPTY_SALE]", state_machines.Sale.OPEN_to_COMPLETED]
        distinguishing_aspect: "Completing a sale with zero lines returns ERR_EMPTY_SALE."
        test_recipe:
          setup: ["Customer; empty OPEN sale."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Empty Cust", email: "e@x.com", state_code: "CA", birth_date: "1990-05-05" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}" }
              as: ShopClerk
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "COMPLETE" }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EMPTY_SALE"

