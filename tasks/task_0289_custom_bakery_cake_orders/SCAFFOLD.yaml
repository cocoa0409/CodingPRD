scenario: "Custom Bakery & Cake Orders: product/customization options, lead time & order cutoff, deposit & balance, dietary/allergen, pickup/delivery slot, design-proof approval, change/cancellation, peak-date capacity"
domain_name: custom-bakery-cake-orders
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  # Central Order aggregate (Order -> LineCustomization, DesignProof, Payment, SlotReservation children)
  # with cross-aggregate references to flat configuration/resource peers
  # (ProductCatalogItem, ProductionDay, DeliveryRoute, Customer).
  state_machine_shape: parallel
  # Order carries TWO independent state axes: production_status (lifecycle, with a
  # cyclic proof-revision loop) and payment_status (deposit -> balance ledger).
  # DesignProof has its own cyclic revision machine.
  relationship_patterns:
    - one_to_many        # Order -> LineCustomization / DesignProof / Payment / SlotReservation
    - cross_aggregate    # Order references ProductionDay, DeliveryRoute, Customer, ProductCatalogItem
    - many_to_many       # SlotReservation joins Order <-> DeliveryRoute / ProductionDay
  role_model: peer_roles
  # Customer owns their own Orders; BakeryStaff runs production/proofing; DeliveryDispatcher
  # owns route/slot assignment; BakeryManager configures catalog/calendar and overrides cutoffs.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: ProductCatalogItem
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: display name of the base cake product
      - name: base_price_cents
        type: integer
        source: input
        description: base price in cents before any customization surcharges
        constraints: ">= 0"
      - name: base_lead_days
        type: integer
        source: input
        description: minimum whole calendar days between order placement date and production_date for this product
        constraints: ">= 0"
      - name: tier_levels
        type: integer
        source: input
        description: number of stacked tiers; tier_levels >= 3 marks the product as a complex bake requiring a production buffer day
        default: 1
        constraints: ">= 1"
      - name: allowed_option_codes
        type: array
        source: input
        description: array of customization option codes (strings) that may be selected for this product
      - name: declared_allergen_codes
        type: array
        source: input
        description: array of allergen codes intrinsically present in the base product (e.g. EGG, DAIRY, NUT, GLUTEN)
      - name: status
        type: enum
        source: input
        description: catalog availability
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"

  - name: CustomizationOption
    parent: null
    common_fields: true
    fields:
      - name: option_code
        type: string
        source: input
        description: unique option code referenced by ProductCatalogItem.allowed_option_codes and OrderLine.selected_option_codes
        constraints: "unique among CustomizationOption rows"
      - name: surcharge_cents
        type: integer
        source: input
        description: flat surcharge in cents added per order line that selects this option
        constraints: ">= 0"
      - name: introduces_allergen_codes
        type: array
        source: input
        description: array of allergen codes this option introduces (e.g. selecting MARZIPAN introduces NUT)
      - name: dietary_exclusion_codes
        type: array
        source: input
        description: array of dietary tags this option is incompatible with (e.g. BUTTERCREAM excludes VEGAN)

  - name: ProductionDay
    parent: null
    common_fields: true
    fields:
      - name: production_date
        type: string
        source: input
        description: calendar date (YYYY-MM-DD) this row governs
        constraints: "unique; ISO date"
      - name: unit_capacity
        type: integer
        source: input
        description: maximum number of order units that may be scheduled to bake on this date
        constraints: ">= 0"
      - name: units_committed
        type: integer
        source: computed
        description: count of order units currently committed to this date; recomputed on every SlotReservation commit/release against this date
        default: 0
      - name: is_peak
        type: boolean
        source: input
        description: when true a peak-date surcharge applies and a stricter ratio cutoff governs capacity
        default: false
      - name: order_cutoff_at
        type: datetime
        source: input
        description: ISO 8601 UTC timestamp after which no new order may bind this production_date unless a manager override is supplied

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - name: route_name
        type: string
        source: input
        description: human label for the delivery vehicle/route
      - name: service_date
        type: string
        source: input
        description: calendar date (YYYY-MM-DD) this route operates
        constraints: "ISO date"
      - name: stop_minutes
        type: integer
        source: input
        description: number of minutes each delivery occupies the route window, measured forward from the reservation's window_start_min
        constraints: ">= 1"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: customer login email
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: customer display name
      - name: store_credit_cents
        type: integer
        source: computed
        description: refundable store-credit balance in cents; debited when applied to an order balance, credited on cancellation refunds routed to credit
        default: 0
      - name: lifetime_spend_cents
        type: integer
        source: computed
        description: cumulative cents of CAPTURED payments across all of this customer's orders; drives loyalty tier
        default: 0
      - name: loyalty_tier
        type: enum
        source: computed
        description: derived from lifetime_spend_cents thresholds; STANDARD < 50000, SILVER 50000..149999, GOLD >= 150000
        default: STANDARD
        constraints: "one of {STANDARD, SILVER, GOLD}"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: product_id
        type: string
        source: input
        description: "FK -> ProductCatalogItem.id"
      - name: production_day_id
        type: string
        source: input
        description: "FK -> ProductionDay.id; the date this cake is baked"
      - name: placed_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp the order was created; frozen at creation and used for lead-time and cutoff checks
      - name: production_status
        type: enum
        source: computed
        description: lifecycle axis; see §1.2 Order production machine
        default: DRAFT
        constraints: "one of {DRAFT, QUOTED, PROOF_PENDING, CHANGES_REQUESTED, PROOF_APPROVED, IN_PRODUCTION, READY, FULFILLED, CANCELLED}"
      - name: payment_status
        type: enum
        source: computed
        description: payment axis, evolves independently of production_status; see §1.2 Order payment machine
        default: UNPAID
        constraints: "one of {UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED}"
      - name: estimate_total_cents
        type: integer
        source: computed
        description: provisional grand total computed at QUOTED from the line set then current; recomputed on every line add/remove while DRAFT/QUOTED
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: locked grand total computed once at PROOF_APPROVED from the line set then current; null until proof approval
        default: 0
      - name: deposit_due_cents
        type: integer
        source: computed
        description: deposit amount required to advance to PROOF_PENDING; see deposit_calc
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: remaining cents owed after captured payments; reconciled on every Payment capture and on final pricing
        default: 0
      - name: applied_credit_cents
        type: integer
        source: input
        description: store credit the customer elects to apply toward the balance at balance-capture time
        default: 0
        constraints: ">= 0"
      - name: peak_surcharge_cents
        type: integer
        source: computed
        description: surcharge applied when production_day.is_peak; folded into estimate and final totals
        default: 0
      - name: cancel_reason
        type: string
        source: input
        description: free-text reason recorded on cancellation
        default: null

  - name: OrderLineCustomization
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: units
        type: integer
        source: input
        description: number of bakeable units this line represents (e.g. tiers or dozen-units)
        constraints: ">= 1"
      - name: selected_option_codes
        type: array
        source: input
        description: array of CustomizationOption.option_code values applied to this line; each must be in the product's allowed_option_codes
      - name: requested_dietary_codes
        type: array
        source: input
        description: array of dietary tags the customer requires for this line (e.g. VEGAN, GLUTEN_FREE)
      - name: line_surcharge_cents
        type: integer
        source: computed
        description: sum of surcharge_cents over selected_option_codes, times units; recomputed when the line changes
        default: 0
      - name: effective_allergen_codes
        type: array
        source: computed
        description: union of product.declared_allergen_codes and every selected option's introduces_allergen_codes; recomputed when the line changes

  - name: DesignProof
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: revision_number
        type: integer
        source: computed
        description: 1 for the first proof on an order, incremented for each subsequent proof posted after a CHANGES_REQUESTED
        default: 1
      - name: image_ref
        type: string
        source: input
        description: opaque reference to the rendered proof artifact
      - name: proof_status
        type: enum
        source: computed
        description: see §1.2 DesignProof machine
        default: AWAITING_REVIEW
        constraints: "one of {AWAITING_REVIEW, APPROVED, SUPERSEDED, REJECTED}"
      - name: change_note
        type: string
        source: input
        description: customer note recorded when changes are requested against this proof
        default: null

  - name: Payment
    parent: Order
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: kind
        type: enum
        source: input
        description: which leg of the deposit/balance ledger this payment settles
        constraints: "one of {DEPOSIT, BALANCE, REFUND}"
      - name: amount_cents
        type: integer
        source: computed
        description: settled amount in cents; for DEPOSIT equals deposit_due_cents, for BALANCE equals balance_due_cents net of applied credit, for REFUND the refunded amount
      - name: credit_applied_cents
        type: integer
        source: computed
        description: portion of a BALANCE payment covered by store credit rather than fresh tender
        default: 0
      - name: settled_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp the payment was recorded

  - name: SlotReservation
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: fulfillment_mode
        type: enum
        source: input
        description: pickup is counter-only and consumes no route window; delivery binds a DeliveryRoute window
        constraints: "one of {PICKUP, DELIVERY}"
      - name: route_id
        type: string
        source: input
        description: "FK -> DeliveryRoute.id; null for PICKUP reservations"
        default: null
      - name: window_start_min
        type: integer
        source: input
        description: minutes-from-midnight start of the requested delivery window on the route's service_date; required for DELIVERY
        default: null
        constraints: "0..1439 when present"
      - name: status
        type: enum
        source: computed
        description: see §1.2 SlotReservation machine
        default: HELD
        constraints: "one of {HELD, COMMITTED, RELEASED}"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  # ---- Order: production axis (cyclic proof loop) -------------------------
  - entity: Order
    axis: production_status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /orders/{id}/quote"
        actor: Customer
        preconditions:
          - "order has >= 1 OrderLineCustomization"
          - "placed_at + product.base_lead_days (whole days) <= production_day.production_date 00:00:00Z, OR a manager override is attached"
          - "production_day.order_cutoff_at >= now, OR a manager override is attached"
        side_effects:
          - "run estimate_pricing -> sets estimate_total_cents, peak_surcharge_cents"
          - "run deposit_calc -> sets deposit_due_cents"
          - "set balance_due_cents = estimate_total_cents - deposit_due_cents"
          - "increments Order.version by 1"
      - from: QUOTED
        to: PROOF_PENDING
        trigger: "POST /orders/{id}/proofs (first proof) — gated on deposit"
        actor: BakeryStaff
        preconditions:
          - "Order.payment_status == DEPOSIT_PAID (deposit captured)"
        side_effects:
          - "create DesignProof revision_number=1, proof_status=AWAITING_REVIEW"
          - "increments Order.version by 1"
      - from: PROOF_PENDING
        to: CHANGES_REQUESTED
        trigger: "POST /orders/{id}/proofs/{pid}/request-changes"
        actor: Customer
        preconditions:
          - "the named DesignProof.proof_status == AWAITING_REVIEW"
        side_effects:
          - "DesignProof.proof_status -> REJECTED"
          - "increments Order.version by 1"
      - from: CHANGES_REQUESTED
        to: PROOF_PENDING
        trigger: "POST /orders/{id}/proofs (subsequent proof)"
        actor: BakeryStaff
        note: "cyclic revision loop: a new proof reopens review"
        preconditions:
          - "Order has no DesignProof in AWAITING_REVIEW"
        side_effects:
          - "create DesignProof revision_number = prior max(revision_number)+1, proof_status=AWAITING_REVIEW"
          - "increments Order.version by 1"
      - from: PROOF_PENDING
        to: PROOF_APPROVED
        trigger: "POST /orders/{id}/proofs/{pid}/approve"
        actor: Customer
        preconditions:
          - "the named DesignProof.proof_status == AWAITING_REVIEW"
        side_effects:
          - "named DesignProof.proof_status -> APPROVED; all other AWAITING_REVIEW/REJECTED proofs on the order -> SUPERSEDED"
          - "run final_pricing -> sets final_total_cents (locked); recompute balance_due_cents = final_total_cents - sum(CAPTURED DEPOSIT amount_cents)"
          - "lines become immutable"
          - "increments Order.version by 1"
      - from: PROOF_APPROVED
        to: IN_PRODUCTION
        trigger: "POST /orders/{id}/start-production"
        actor: BakeryStaff
        preconditions:
          - "a COMMITTED SlotReservation exists for this order"
          - "Order.payment_status == PAID_IN_FULL"
        side_effects:
          - "increments Order.version by 1"
      - from: IN_PRODUCTION
        to: READY
        trigger: "POST /orders/{id}/mark-ready"
        actor: BakeryStaff
        side_effects:
          - "increments Order.version by 1"
      - from: READY
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: BakeryStaff
        preconditions:
          - "the order's COMMITTED SlotReservation exists"
        side_effects:
          - "SlotReservation.status unchanged (COMMITTED is terminal-on-fulfill)"
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        side_effects:
          - "increments Order.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        side_effects:
          - "run refund_settlement (no captured deposit yet -> zero refund)"
          - "increments Order.version by 1"
      - from: PROOF_PENDING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        side_effects:
          - "CASCADE: release any HELD/COMMITTED SlotReservation -> RELEASED; that release decrements production_day.units_committed; that decrement may unblock a buffer-adjacent production_day"
          - "all non-terminal DesignProof rows -> SUPERSEDED"
          - "run refund_settlement -> refund per cancellation policy; sets payment_status=REFUNDED when any capture is reversed"
          - "increments Order.version by 1"
      - from: CHANGES_REQUESTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        side_effects:
          - "CASCADE: release any HELD/COMMITTED SlotReservation -> RELEASED; release decrements production_day.units_committed"
          - "run refund_settlement"
          - "increments Order.version by 1"
      - from: PROOF_APPROVED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        side_effects:
          - "CASCADE: release any HELD/COMMITTED SlotReservation -> RELEASED; release decrements production_day.units_committed"
          - "run refund_settlement (late-cancel forfeits deposit per policy)"
          - "increments Order.version by 1"

  # ---- Order: payment axis (independent ledger) ---------------------------
  - entity: Order
    axis: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /orders/{id}/payments (kind=DEPOSIT)"
        actor: Customer
        preconditions:
          - "Order.production_status == QUOTED"
          - "deposit_due_cents > 0"
        side_effects:
          - "create Payment kind=DEPOSIT amount_cents=deposit_due_cents"
          - "increments Order.version by 1"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /orders/{id}/balance-payment (kind=BALANCE)"
        actor: Customer
        preconditions:
          - "Order.production_status == PROOF_APPROVED (final price locked)"
          - "expected_order_version matches Order.version (OCC)"
          - "balance_due_cents net of applied credit is settled in this payment"
        side_effects:
          - "run balance_capture (dual-variant credit application) -> Payment kind=BALANCE"
          - "CASCADE: Customer.store_credit_cents -= credit_applied_cents; Customer.lifetime_spend_cents += fresh tender; recompute Customer.loyalty_tier"
          - "balance_due_cents -> 0"
          - "increments Order.version by 1"
      - from: DEPOSIT_PAID
        to: REFUNDED
        trigger: "system: refund_settlement during cancel from a post-deposit production state"
        actor: system
        side_effects:
          - "create Payment kind=REFUND"
          - "CASCADE: refund amount routed to Customer.store_credit_cents per policy"
      - from: PAID_IN_FULL
        to: REFUNDED
        trigger: "system: refund_settlement during cancel from PROOF_APPROVED"
        actor: system
        side_effects:
          - "create Payment kind=REFUND"
          - "CASCADE: refund routed to Customer.store_credit_cents"

  # ---- DesignProof: cyclic review machine ---------------------------------
  - entity: DesignProof
    axis: proof_status
    initial_state: AWAITING_REVIEW
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: AWAITING_REVIEW
        to: APPROVED
        trigger: "POST /orders/{id}/proofs/{pid}/approve"
        actor: Customer
        preconditions:
          - "parent Order.production_status == PROOF_PENDING"
        side_effects:
          - "Order.production_status -> PROOF_APPROVED (cross-entity bubble-up)"
      - from: AWAITING_REVIEW
        to: REJECTED
        trigger: "POST /orders/{id}/proofs/{pid}/request-changes"
        actor: Customer
        preconditions:
          - "parent Order.production_status == PROOF_PENDING"
        side_effects:
          - "Order.production_status -> CHANGES_REQUESTED (cross-entity)"
      - from: AWAITING_REVIEW
        to: SUPERSEDED
        trigger: "system: a newer proof approved, or order cancelled"
        actor: system
        side_effects: []
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system: a later revision approved, or order cancelled"
        actor: system
        side_effects: []

  # ---- SlotReservation: hold/commit/release ------------------------------
  - entity: SlotReservation
    axis: status
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: COMMITTED
        trigger: "POST /orders/{id}/slot/{rid}/commit"
        actor: DeliveryDispatcher
        preconditions:
          - "parent Order.production_status IN {PROOF_APPROVED}"
          - "for DELIVERY: no route-window overlap on DeliveryRoute (half-open [start, start+stop_minutes))"
          - "production_day.units_committed + order units <= production_day effective capacity (peak ratio applies)"
        side_effects:
          - "CASCADE: production_day.units_committed += order units; if that pushes a complex (tier_levels>=3) order's buffer day over its block threshold, the buffer-adjacent production_day is marked saturated for new complex orders"
          - "increments SlotReservation.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /orders/{id}/slot/{rid}/release OR cascade from Order cancel"
        actor: DeliveryDispatcher
        side_effects:
          - "increments SlotReservation.version by 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "cascade from Order cancel (post-commit cancellation)"
        actor: system
        side_effects:
          - "CASCADE: production_day.units_committed -= order units (compensating release)"
          - "increments SlotReservation.version by 1"

# ===========================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# ===========================================================================
concurrency_rules:
  - rule_id: slot-commit-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/slot/{rid}/commit"
    occ_field: "expected_order_version"
    description: |
      Committing a SlotReservation against an Order whose version has advanced
      since the dispatcher last observed it is rejected on a stale version. This
      captures the case where the order's final pricing or another reservation
      commit has already advanced the order (and consumed capacity) and the
      dispatcher's view is therefore out of date.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: balance-capture-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/balance-payment"
    occ_field: "expected_order_version"
    description: |
      Capturing a BALANCE payment against an Order whose version has advanced
      since the customer last read it is rejected on a stale version. Final
      pricing and credit balances may have moved (e.g. a proof re-approval or a
      credit adjustment), so a stale-version balance capture must be refused so
      the customer re-reads the authoritative balance_due_cents first.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: estimate_pricing
    trigger: "Order DRAFT->QUOTED, and recompute on line add/remove while DRAFT or QUOTED"
    algorithm: aggregation
    formula: |
      # ORDER OF EVALUATION IS PINNED (mode (c) circular-looking dependency):
      # peak_surcharge depends on the line subtotal tier, and the grand total
      # depends on peak_surcharge — evaluate in this exact order.
      # 1) line_subtotal = sum over lines of ( units * base_price_share + line_surcharge_cents )
      #    where base_price_share = product.base_price_cents (charged once per unit)
      #    line_surcharge_cents   = units * sum(surcharge_cents of selected_option_codes)
      lines_subtotal = sum( L.units * product.base_price_cents + L.line_surcharge_cents for L in lines )
      # 2) peak surcharge keyed on the subtotal tier (tiered selection over the subtotal):
      if production_day.is_peak:
          if   lines_subtotal <  20000: peak_surcharge_cents = 2500
          elif lines_subtotal <  50000: peak_surcharge_cents = round_half_up(lines_subtotal * 0.10)
          else:                          peak_surcharge_cents = round_half_up(lines_subtotal * 0.15)
      else:
          peak_surcharge_cents = 0
      # 3) grand total
      estimate_total_cents = lines_subtotal + peak_surcharge_cents
    input_set: "all OrderLineCustomization rows on the order (no status filter; lines have no status)"
    constants:
      PEAK_FLAT_CENTS: 2500
      PEAK_MID_RATE: 0.10
      PEAK_HIGH_RATE: 0.15
      PEAK_MID_TIER_FLOOR_CENTS: 20000
      PEAK_HIGH_TIER_FLOOR_CENTS: 50000
    precision: "integer cents, round_half_up on the rate steps"
    variants:
      - name: estimate
        when: "at QUOTED, before proof approval; reflects lines as they stand and may change"
        difference: "provisional — recomputed on every line mutation; written to estimate_total_cents"
      - name: final
        when: "see final_pricing — same formula, frozen at PROOF_APPROVED"
        difference: "locked snapshot written to final_total_cents; never recomputed afterward"

  - name: final_pricing
    trigger: "Order PROOF_PENDING->PROOF_APPROVED (proof approve)"
    algorithm: aggregation
    formula: |
      # Identical formula to estimate_pricing, evaluated once against the line
      # set AT THE MOMENT OF APPROVAL, then frozen. If lines changed between
      # QUOTED and approval (allowed only while CHANGES_REQUESTED), the final
      # total diverges from the estimate.
      final_total_cents = same_pipeline_as_estimate(lines_at_approval, product, production_day)
    input_set: "OrderLineCustomization rows present at the instant of PROOF_APPROVED"
    constants:
      PEAK_FLAT_CENTS: 2500
      PEAK_MID_RATE: 0.10
      PEAK_HIGH_RATE: 0.15
    precision: "integer cents, round_half_up"
    variants:
      - name: matches_estimate
        when: "lines unchanged since QUOTED"
        difference: "final_total_cents == estimate_total_cents (zero delta)"
      - name: diverges_from_estimate
        when: "lines were edited during a CHANGES_REQUESTED loop"
        difference: "final_total_cents != estimate_total_cents; balance recomputed off the final, not the estimate"

  - name: deposit_calc
    trigger: "Order DRAFT->QUOTED (computes deposit_due_cents off the estimate)"
    algorithm: tiered_pricing
    formula: |
      # Tiered deposit ratio with a non-linear interaction across THREE inputs:
      # (estimate_total_cents, production_day.is_peak, product.tier_levels).
      # Mode (a): >=3 inputs, nested conditional branches.
      base_ratio = 0.30
      if production_day.is_peak:       base_ratio = 0.50   # peak dates demand a larger deposit
      if product.tier_levels >= 3:     base_ratio = max(base_ratio, 0.60)  # complex bakes -> >=60%
      raw = estimate_total_cents * base_ratio
      deposit_due_cents = round_half_up(raw)
      # floor: deposit never below DEPOSIT_FLOOR_CENTS, and never above the total
      deposit_due_cents = min( max(deposit_due_cents, DEPOSIT_FLOOR_CENTS), estimate_total_cents )
    input_set: "the order's own estimate_total_cents, production_day.is_peak, product.tier_levels"
    constants:
      DEPOSIT_FLOOR_CENTS: 5000
      STANDARD_RATIO: 0.30
      PEAK_RATIO: 0.50
      COMPLEX_RATIO: 0.60
    precision: "integer cents, round_half_up"

  - name: balance_capture
    trigger: "Order payment DEPOSIT_PAID->PAID_IN_FULL (kind=BALANCE)"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall: applied_credit fills first (capped), fresh tender fills the rest.
      # Dual-variant on the ORDER/PAYMENT domain (distinct from refund_credit_calc
      # which is on the CUSTOMER domain).
      gross_balance = balance_due_cents             # = final_total_cents - captured deposit
      credit_cap    = min(applied_credit_cents, Customer.store_credit_cents, gross_balance)
      credit_applied_cents = credit_cap
      fresh_tender  = gross_balance - credit_applied_cents
      # Payment.amount_cents records fresh tender; credit_applied_cents records the credit leg.
    input_set: "order balance_due_cents, applied_credit_cents (input), Customer.store_credit_cents"
    constants: {}
    precision: "integer cents"
    variants:
      - name: gross_capture
        when: "applied_credit_cents == 0"
        difference: "fresh_tender == gross_balance; no credit consumed; lifetime_spend += gross_balance"
      - name: credit_offset_capture
        when: "applied_credit_cents > 0 and Customer.store_credit_cents > 0"
        difference: "fresh_tender == gross_balance - credit_applied; lifetime_spend increases by fresh_tender ONLY (credit does not count toward loyalty)"

  - name: refund_settlement
    trigger: "Order cancel from a post-deposit production state (refund_settlement side effect)"
    algorithm: threshold
    formula: |
      # Dual-variant on the CUSTOMER domain: how much of captured tender is refunded
      # to store credit depends on WHEN the cancel happens relative to proof approval.
      captured = sum(CAPTURED non-refund Payment.amount_cents on the order)   # excludes credit legs
      if production_status_at_cancel in {QUOTED}:
          refund_cents = captured                       # nothing forfeited (no deposit captured yet -> 0)
      elif production_status_at_cancel in {PROOF_PENDING, CHANGES_REQUESTED}:
          refund_cents = captured                       # full refund of fresh tender (deposit returned)
      elif production_status_at_cancel == PROOF_APPROVED:
          # late cancel forfeits the deposit portion; only the balance fresh tender is refunded
          refund_cents = max(0, captured - deposit_due_cents)
      # routing: refund_cents credited to Customer.store_credit_cents
    input_set: "CAPTURED Payment rows of kind in {DEPOSIT, BALANCE} on the order (exclude REFUND and credit legs)"
    constants:
      FORFEIT_FROM_STATE: PROOF_APPROVED
    precision: "integer cents"
    variants:
      - name: full_refund
        when: "cancel from PROOF_PENDING or CHANGES_REQUESTED"
        difference: "all captured fresh tender returned to store credit; store_credit_cents += captured"
      - name: deposit_forfeit_refund
        when: "cancel from PROOF_APPROVED"
        difference: "store_credit_cents += max(0, captured - deposit_due_cents); deposit forfeited"

  - name: peak_capacity_check
    trigger: "SlotReservation HELD->COMMITTED (capacity precondition) and on quote binding"
    algorithm: threshold
    formula: |
      # Effective capacity differs by peak flag (boundary-precision on the
      # >= comparison). A reservation of `order_units` is admissible iff:
      effective_cap = production_day.unit_capacity
      if production_day.is_peak:
          # peak days reserve a safety margin: only 80% of nominal capacity, FLOORED
          effective_cap = floor(production_day.unit_capacity * 0.80)
      admissible = (production_day.units_committed + order_units) <= effective_cap
      # boundary: committed+units == effective_cap is ADMISSIBLE (<=), committed+units == effective_cap+1 is NOT
    input_set: "production_day.units_committed, production_day.unit_capacity, production_day.is_peak, order_units (sum of line units)"
    constants:
      PEAK_CAPACITY_RATIO: 0.80
    precision: "integer units; floor on the peak ratio"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except anonymous customer registration"
  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for Customer-owned actions, X-User-ID equals the Order.customer_id"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "all /orders/{id}/* customer actions"
  - priority: 4
    category: existence
    check: "every path id (order, proof, reservation, route, product, production_day, customer) resolves, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing paths"
  - priority: 5
    category: existence
    check: "FK bodies reference existing rows (product_id, production_day_id, customer_id, route_id, selected_option_codes resolve)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/slot"
  - priority: 6
    category: state
    check: "target entity is in a state from which this transition is defined (production_status / payment_status / proof_status / reservation status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_order_version matches current Order.version on guarded writes (slot commit, balance payment)"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/slot/{rid}/commit, POST /orders/{id}/balance-payment"
  - priority: 8
    category: business_safety
    check: "ALLERGEN/DIETARY: a line's requested_dietary_codes must not be contradicted by any selected option's dietary_exclusion_codes, and effective_allergen_codes must not contain an allergen the dietary tag forbids (e.g. VEGAN forbids DAIRY/EGG, GLUTEN_FREE forbids GLUTEN)"
    error_id: ERR_DIETARY_CONFLICT
    http_status: 422
    applies_to: "POST /orders/{id}/lines, PATCH /orders/{id}/lines/{lid}"
  - priority: 9
    category: business_constraint
    check: "every selected_option_code is in the product's allowed_option_codes"
    error_id: ERR_OPTION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /orders/{id}/lines, PATCH /orders/{id}/lines/{lid}"
  - priority: 10
    category: business_temporal
    check: "LEAD TIME: placed_at + product.base_lead_days whole days <= production_date, unless manager override; checked at quote"
    error_id: ERR_LEAD_TIME_NOT_MET
    http_status: 422
    applies_to: "POST /orders/{id}/quote"
  - priority: 11
    category: business_temporal
    check: "CUTOFF: now <= production_day.order_cutoff_at unless manager override; checked at quote"
    error_id: ERR_PAST_ORDER_CUTOFF
    http_status: 422
    applies_to: "POST /orders/{id}/quote"
  - priority: 12
    category: business_temporal
    check: "DELIVERY OVERLAP: a DELIVERY commit must not overlap an existing COMMITTED reservation on the same route (half-open [start, start+stop_minutes))"
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /orders/{id}/slot/{rid}/commit"
  - priority: 13
    category: business_constraint
    check: "PROOF GATE: production cannot start nor balance fall due before a proof is APPROVED"
    error_id: ERR_PROOF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /orders/{id}/start-production, POST /orders/{id}/balance-payment"
  - priority: 14
    category: business_fiscal
    check: "CAPACITY: committing the reservation must not push production_day.units_committed over effective capacity (peak ratio applies)"
    error_id: ERR_PRODUCTION_DAY_FULL
    http_status: 409
    applies_to: "POST /orders/{id}/slot/{rid}/commit"
  - priority: 15
    category: business_fiscal
    check: "CREDIT: applied_credit_cents must not exceed Customer.store_credit_cents nor the gross balance"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 422
    applies_to: "POST /orders/{id}/balance-payment"
  - priority: 16
    category: business_fiscal
    check: "DEPOSIT EXACT: a DEPOSIT payment's implied amount must equal deposit_due_cents; a BALANCE must settle the full net balance"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/payments, POST /orders/{id}/balance-payment"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- configuration: products / options ----
  - method: POST
    path: "/products"
    description: "create a base catalog product"
    roles: [BakeryManager]
    code: 201
    input: [name, base_price_cents, base_lead_days, "tier_levels?", allowed_option_codes, declared_allergen_codes, "status?"]
    output: ProductCatalogItem
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "read a product"
    roles: [BakeryManager, BakeryStaff, Customer]
    code: 200
    input: []
    output: ProductCatalogItem
    side_effects: []
  - method: GET
    path: "/products"
    description: "list products"
    roles: [BakeryManager, BakeryStaff, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ProductCatalogItem[]
    side_effects: []
  - method: POST
    path: "/options"
    description: "create a customization option"
    roles: [BakeryManager]
    code: 201
    input: [option_code, surcharge_cents, introduces_allergen_codes, dietary_exclusion_codes]
    output: CustomizationOption
    side_effects: []
  - method: GET
    path: "/options/{id}"
    description: "read an option"
    roles: [BakeryManager, BakeryStaff, Customer]
    code: 200
    input: []
    output: CustomizationOption
    side_effects: []
  - method: GET
    path: "/options"
    description: "list options"
    roles: [BakeryManager, BakeryStaff, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: CustomizationOption[]
    side_effects: []

  # ---- configuration: capacity calendar / routes ----
  - method: POST
    path: "/production-days"
    description: "register a production date with capacity, peak flag, and cutoff"
    roles: [BakeryManager]
    code: 201
    input: [production_date, unit_capacity, "is_peak?", order_cutoff_at]
    output: ProductionDay
    side_effects: []
  - method: GET
    path: "/production-days/{id}"
    description: "read a production day (capacity + committed units)"
    roles: [BakeryManager, BakeryStaff, DeliveryDispatcher, Customer]
    code: 200
    input: []
    output: ProductionDay
    side_effects: []
  - method: GET
    path: "/production-days"
    description: "list production days"
    roles: [BakeryManager, BakeryStaff, DeliveryDispatcher, Customer]
    code: 200
    input: ["is_peak?", "limit?", "offset?"]
    output: ProductionDay[]
    side_effects: []
  - method: POST
    path: "/routes"
    description: "register a delivery route for a service date"
    roles: [BakeryManager, DeliveryDispatcher]
    code: 201
    input: [route_name, service_date, stop_minutes]
    output: DeliveryRoute
    side_effects: []
  - method: GET
    path: "/routes/{id}"
    description: "read a route"
    roles: [BakeryManager, DeliveryDispatcher, Customer]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: GET
    path: "/routes"
    description: "list routes"
    roles: [BakeryManager, DeliveryDispatcher, Customer]
    code: 200
    input: ["service_date?", "limit?", "offset?"]
    output: DeliveryRoute[]
    side_effects: []

  # ---- customers ----
  - method: POST
    path: "/customers"
    description: "register a customer (anonymous self-signup)"
    roles: [Anonymous, BakeryManager]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "read a customer (credit, loyalty)"
    roles: [Customer, BakeryManager, BakeryStaff]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{id}/credit-adjustments"
    description: "manager grants/debits store credit (admin operator surface)"
    roles: [BakeryManager]
    code: 200
    input: [delta_cents, "reason?"]
    output: Customer
    side_effects: ["Customer.store_credit_cents += delta_cents", "increments Customer.version by 1"]

  # ---- orders: core lifecycle ----
  - method: POST
    path: "/orders"
    description: "create a DRAFT order bound to a product, production day, and customer"
    roles: [Customer]
    code: 201
    input: [customer_id, product_id, production_day_id]
    output: Order
    side_effects: ["set placed_at=now", "production_status=DRAFT", "payment_status=UNPAID"]
  - method: GET
    path: "/orders/{id}"
    description: "read an order with both status axes and all computed totals"
    roles: [Customer, BakeryStaff, BakeryManager, DeliveryDispatcher]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "list orders (filterable by customer, production day, status)"
    roles: [Customer, BakeryStaff, BakeryManager, DeliveryDispatcher]
    code: 200
    input: ["customer_id?", "product_id?", "production_day_id?", "production_status?", "payment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/lines"
    description: "add a customization line to a DRAFT/QUOTED/CHANGES_REQUESTED order"
    roles: [Customer]
    code: 201
    input: [units, selected_option_codes, requested_dietary_codes]
    output: OrderLineCustomization
    side_effects: ["recompute line_surcharge_cents, effective_allergen_codes", "if order QUOTED: re-run estimate_pricing + deposit_calc", "increments Order.version by 1"]
  - method: GET
    path: "/orders/{id}/lines"
    description: "list the order's customization lines (FK reverse-reachability for OrderLineCustomization)"
    roles: [Customer, BakeryStaff, BakeryManager]
    code: 200
    input: []
    output: OrderLineCustomization[]
    side_effects: []
  - method: PATCH
    path: "/orders/{id}/lines/{lid}"
    description: "edit a line while the order is editable (DRAFT, QUOTED, or CHANGES_REQUESTED)"
    roles: [Customer]
    code: 200
    input: ["units?", "selected_option_codes?", "requested_dietary_codes?"]
    output: OrderLineCustomization
    side_effects: ["recompute line + order estimate if QUOTED", "increments Order.version by 1"]
  - method: DELETE
    path: "/orders/{id}/lines/{lid}"
    description: "remove a line while the order is editable"
    roles: [Customer]
    code: 204
    input: []
    output: null
    side_effects: ["re-run estimate_pricing if QUOTED", "increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/quote"
    description: "lock the line set into a quote: compute estimate, deposit, balance; enforce lead time + cutoff"
    roles: [Customer]
    code: 200
    input: ["manager_override_token?"]
    output: Order
    side_effects: ["production_status DRAFT->QUOTED", "run estimate_pricing, deposit_calc", "set balance_due_cents", "increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "cancel the order from any non-terminal production state; runs refund_settlement + cascades"
    roles: [Customer]
    code: 200
    input: ["cancel_reason?"]
    output: Order
    side_effects: ["production_status->CANCELLED", "cascade release SlotReservation -> production_day.units_committed adjust", "supersede non-terminal proofs", "refund_settlement -> Customer.store_credit_cents, payment_status", "increments Order.version by 1"]

  # ---- orders: proofs (cyclic) ----
  - method: POST
    path: "/orders/{id}/proofs"
    description: "post a design proof (first proof from QUOTED+deposit, or a new revision from CHANGES_REQUESTED)"
    roles: [BakeryStaff]
    code: 201
    input: [image_ref]
    output: DesignProof
    side_effects: ["create DesignProof AWAITING_REVIEW with next revision_number", "Order production_status -> PROOF_PENDING", "increments Order.version by 1"]
  - method: GET
    path: "/orders/{id}/proofs"
    description: "list proofs for an order (FK reverse-reachability for DesignProof)"
    roles: [Customer, BakeryStaff, BakeryManager]
    code: 200
    input: []
    output: DesignProof[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/proofs/{pid}/approve"
    description: "customer approves a proof; locks final pricing and supersedes other proofs"
    roles: [Customer]
    code: 200
    input: []
    output: DesignProof
    side_effects: ["DesignProof->APPROVED, others->SUPERSEDED", "Order production_status->PROOF_APPROVED", "run final_pricing, recompute balance_due_cents", "increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/proofs/{pid}/request-changes"
    description: "customer requests changes; rejects the proof and reopens editing"
    roles: [Customer]
    code: 200
    input: ["change_note?"]
    output: DesignProof
    side_effects: ["DesignProof->REJECTED", "Order production_status->CHANGES_REQUESTED", "increments Order.version by 1"]

  # ---- orders: payments ----
  - method: POST
    path: "/orders/{id}/payments"
    description: "record a DEPOSIT payment against a QUOTED order (advances payment_status UNPAID->DEPOSIT_PAID)"
    roles: [Customer]
    code: 201
    input: [kind]
    output: Payment
    side_effects: ["DEPOSIT: payment_status UNPAID->DEPOSIT_PAID", "increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/balance-payment"
    description: "capture the BALANCE on a PROOF_APPROVED order (OCC-guarded); applies store credit + bumps loyalty"
    roles: [Customer]
    code: 201
    input: [kind, "applied_credit_cents?", expected_order_version]
    output: Payment
    side_effects: ["run balance_capture, payment_status DEPOSIT_PAID->PAID_IN_FULL", "Customer.store_credit_cents/lifetime_spend_cents/loyalty_tier reconciled", "increments Order.version by 1"]
  - method: GET
    path: "/orders/{id}/payments"
    description: "list payments for an order (FK reverse-reachability for Payment)"
    roles: [Customer, BakeryStaff, BakeryManager]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  # ---- orders: fulfillment slot reservations ----
  - method: POST
    path: "/orders/{id}/slot"
    description: "create a HELD slot reservation (PICKUP or DELIVERY with route window)"
    roles: [Customer, DeliveryDispatcher]
    code: 201
    input: [fulfillment_mode, "route_id?", "window_start_min?"]
    output: SlotReservation
    side_effects: ["create SlotReservation HELD", "increments Order.version by 1"]
  - method: GET
    path: "/orders/{id}/slot"
    description: "list slot reservations for an order (FK reverse-reachability for SlotReservation)"
    roles: [Customer, DeliveryDispatcher, BakeryStaff, BakeryManager]
    code: 200
    input: []
    output: SlotReservation[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/slot/{rid}/commit"
    description: "commit a HELD reservation: enforce route overlap + production-day capacity; consume units (OCC-guarded)"
    roles: [DeliveryDispatcher]
    code: 200
    input: [expected_order_version]
    output: SlotReservation
    side_effects: ["status HELD->COMMITTED", "production_day.units_committed += order units", "buffer-adjacency saturation for complex orders", "increments Order.version by 1", "increments SlotReservation.version by 1"]
  - method: POST
    path: "/orders/{id}/slot/{rid}/release"
    description: "release a HELD/COMMITTED reservation; compensating decrement of units_committed"
    roles: [DeliveryDispatcher]
    code: 200
    input: []
    output: SlotReservation
    side_effects: ["status->RELEASED", "if was COMMITTED: production_day.units_committed -= order units", "increments SlotReservation.version by 1"]
  - method: GET
    path: "/routes/{id}/reservations"
    description: "list COMMITTED reservations on a route (FK reverse-reachability for SlotReservation.route_id)"
    roles: [DeliveryDispatcher, BakeryManager]
    code: 200
    input: []
    output: SlotReservation[]
    side_effects: []

  # ---- orders: production progression ----
  - method: POST
    path: "/orders/{id}/start-production"
    description: "advance an approved+paid order with a committed slot into production"
    roles: [BakeryStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["production_status PROOF_APPROVED->IN_PRODUCTION", "increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/mark-ready"
    description: "mark an in-production order ready for fulfillment"
    roles: [BakeryStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["production_status IN_PRODUCTION->READY", "increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "fulfill (hand off / deliver) a READY order"
    roles: [BakeryStaff]
    code: 200
    input: []
    output: Order
    side_effects: ["production_status READY->FULFILLED", "increments Order.version by 1"]

  # ---- production-day reverse reachability for orders ----
  - method: GET
    path: "/production-days/{id}/orders"
    description: "list orders bound to a production day (FK reverse-reachability for Order.production_day_id)"
    roles: [BakeryStaff, BakeryManager, DeliveryDispatcher]
    code: 200
    input: []
    output: Order[]
    side_effects: []

  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "test-only: set the server's current UTC clock for lead-time/cutoff determinism"
    roles: [BakeryManager]
    code: 200
    input: [now_iso8601]
    output: null
    side_effects: ["all subsequent now() reads return now_iso8601"]
  - method: POST
    path: "/_overrides/mint"
    description: "test-only: mint a manager_override_token that waives lead-time/cutoff at quote"
    roles: [BakeryManager]
    code: 201
    input: [scope]
    output: { token: string, scope: string }
    side_effects: []

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or X-User-ID on an authenticated endpoint"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for the endpoint per §1.7"
  - id: ERR_NOT_ORDER_OWNER
    http: 403
    condition: "Customer X-User-ID does not match the Order.customer_id"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id does not resolve to a row"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a body FK (product_id, production_day_id, customer_id, route_id) or option_code does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the entity's current state (production/payment/proof/reservation)"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not match current Order.version on an OCC-guarded write"
  - id: ERR_DIETARY_CONFLICT
    http: 422
    condition: "a line's requested dietary tag is contradicted by a selected option's exclusion or by an effective allergen"
  - id: ERR_OPTION_NOT_ALLOWED
    http: 422
    condition: "a selected_option_code is not in the product's allowed_option_codes"
  - id: ERR_LEAD_TIME_NOT_MET
    http: 422
    condition: "placed_at + base_lead_days exceeds production_date and no manager override supplied"
  - id: ERR_PAST_ORDER_CUTOFF
    http: 422
    condition: "now is after production_day.order_cutoff_at and no manager override supplied"
  - id: ERR_ROUTE_WINDOW_CONFLICT
    http: 409
    condition: "a DELIVERY commit's half-open window overlaps an existing COMMITTED reservation on the route"
  - id: ERR_PROOF_NOT_APPROVED
    http: 409
    condition: "balance payment or start-production attempted before a proof is APPROVED"
  - id: ERR_PRODUCTION_DAY_FULL
    http: 409
    condition: "committing would push units_committed over effective (peak-adjusted) capacity"
  - id: ERR_INSUFFICIENT_CREDIT
    http: 422
    condition: "applied_credit_cents exceeds the customer's store_credit_cents or the gross balance"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "a DEPOSIT/BALANCE payment cannot be settled because the order has no positive due amount for that leg, or the wrong leg is attempted"
  - id: ERR_LINE_IMMUTABLE
    http: 409
    condition: "attempt to add/edit/remove a line once the order has left an editable state (i.e. proof approved or later)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, bad enum, or out-of-range numeric (e.g. window_start_min outside 0..1439, units < 1)"
  - id: ERR_VALIDATION_PAGINATION
    http: 400
    condition: "limit/offset outside allowed bounds"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Anonymous
    description: "unauthenticated caller; may only self-register as a customer"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["POST /customers"]
  - name: Customer
    description: "owns their orders, lines, proofs decisions, payments, and slot requests"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "PATCH /orders/{id}/lines/{lid}"
      - "DELETE /orders/{id}/lines/{lid}"
      - "POST /orders/{id}/quote"
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/proofs/{pid}/approve"
      - "POST /orders/{id}/proofs/{pid}/request-changes"
      - "POST /orders/{id}/payments"
      - "POST /orders/{id}/balance-payment"
    shared_operations:
      - "GET /orders/{id}"
      - "GET /orders"
      - "GET /orders/{id}/lines"
      - "GET /orders/{id}/proofs"
      - "GET /orders/{id}/payments"
      - "GET /orders/{id}/slot"
      - "POST /orders/{id}/slot"
      - "GET /products"
      - "GET /production-days"
      - "GET /routes"
      - "GET /customers/{id}"
  - name: BakeryStaff
    description: "production-floor role: posts proofs, advances production lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/proofs"
      - "POST /orders/{id}/start-production"
      - "POST /orders/{id}/mark-ready"
      - "POST /orders/{id}/fulfill"
    shared_operations:
      - "GET /orders/{id}"
      - "GET /orders"
      - "GET /orders/{id}/lines"
      - "GET /orders/{id}/proofs"
      - "GET /orders/{id}/payments"
      - "GET /production-days/{id}/orders"
  - name: DeliveryDispatcher
    description: "owns route/slot assignment: commits and releases reservations"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/slot/{rid}/commit"
      - "POST /orders/{id}/slot/{rid}/release"
    shared_operations:
      - "POST /orders/{id}/slot"
      - "GET /orders/{id}/slot"
      - "GET /routes/{id}/reservations"
      - "POST /routes"
      - "GET /routes"
      - "GET /production-days/{id}"
  - name: BakeryManager
    description: "configures catalog, options, capacity calendar, routes; grants credit; mints overrides; operates test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /options"
      - "POST /production-days"
      - "POST /customers/{id}/credit-adjustments"
      - "POST /_clock/set"
      - "POST /_overrides/mint"
    shared_operations:
      - "POST /routes"
      - "GET /orders"
      - "GET /orders/{id}"
      - "GET /production-days/{id}/orders"
      - "GET /customers/{id}"
