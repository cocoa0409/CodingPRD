  # ===========================================================================
  - section: calculations
    instances:

      - name: eligibility_floor_division_discards_remainder
        claim_type: Correct Result
        grounds:
          - calculations.bidding_eligibility
        distinguishing_aspect: "An upfront payment of 31,250,001,250 cents divides by 2500 to 12,500,000.5; the floor rule yields exactly 12,500,000 eligibility units, discarding the odd 1,250 cents."
        test_recipe:
          setup: ["Auction APPLICATION_OPEN; applicant registered"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - *k_applicant_rural
          trigger:
            - call: "POST /spectrum-auctions/applicants/${r_id}/upfront-payments"
              payload: { amount_cents: 31250001250 }
              as: Bidder
              as_user_id: "${r_id}"
              captures: { elig: "$.data.eligibility_units", held: "$.data.upfront_held_cents" }
          assert:
            - "elig == 12500000 (floor, not round — 12,500,000.5 floors down)"
            - "held == 31250001250 (the odd cents remain held; they simply buy no unit)"

      - name: attribution_stake_exactly_25_is_not_attributable
        claim_type: Constants Applied
        grounds:
          - calculations.credit_tier_assignment
        distinguishing_aspect: "ATTRIBUTABLE_STAKE_PCT is a STRICTLY-greater gate: a 25.00% owner with 900,000,000 cents revenue is NOT attributed (credit 35% tier), while a 25.01% owner with the same revenue IS attributed (pushing the applicant to the 25% tier)."
        test_recipe:
          setup: ["Auction APPLICATION_OPEN; two small-business applicants: L25 with a 25.00% owner (revenue 900,000,000), L2501 with a 25.01% owner (revenue 900,000,000); both pay 25,000,000,000 upfront"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "L25", claims_small_business: true, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "HoldCo", stake_pct: 25.00, holder_annual_revenue_cents: 900000000 }, { holder_name: "Rest", stake_pct: 75, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { l25_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${l25_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${l25_id}"
            - call: "POST /spectrum-auctions/applicants/${l25_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${l25_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
              captures: { l25_credit: "$.data.credit_pct", l25_attr: "$.data.attributable_revenue_cents" }
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "L2501", claims_small_business: true, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "HoldCo", stake_pct: 25.01, holder_annual_revenue_cents: 900000000 }, { holder_name: "Rest", stake_pct: 74.99, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { l2501_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${l2501_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${l2501_id}"
            - call: "POST /spectrum-auctions/applicants/${l2501_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${l2501_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
              captures: { l2501_credit: "$.data.credit_pct", l2501_attr: "$.data.attributable_revenue_cents" }
          assert:
            - "l25_attr == 0 (25.00 is not > 25) and l25_credit == 35"
            - "l2501_attr == 900000000 (25.01 > 25 attributes the full holder revenue) and l2501_credit == 25 (900,000,000 <= 2,000,000,000 tier2)"
            - "both applicants QUALIFIED — attribution changes the credit, not the qualification"

      - name: rural_population_cap_exact_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.credit_tier_assignment
        distinguishing_aspect: "RURAL_SERVICE_POPULATION_CAP is inclusive: service_population 250,000 earns the 15% rural credit while 250,001 earns nothing — one resident flips the credit."
        test_recipe:
          setup: ["Auction APPLICATION_OPEN; two rural-claiming applicants, RIN at 250,000 and ROUT at 250,001 service population; both qualified in turn"]
          setup_api_calls:
            - *k_clock0
            - *k_plan
            - *k_area_y
            - *k_block_a
            - *k_publish
            - *k_auction
            - *k_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "R In", claims_small_business: false, claims_rural_credit: true, own_annual_revenue_cents: 0, service_population: 250000, ownership_interests: [{ holder_name: "Sole", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { rin_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${rin_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${rin_id}"
            - call: "POST /spectrum-auctions/applicants/${rin_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${rin_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
              captures: { rin_credit: "$.data.credit_pct" }
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "R Out", claims_small_business: false, claims_rural_credit: true, own_annual_revenue_cents: 0, service_population: 250001, ownership_interests: [{ holder_name: "Sole", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { rout_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${rout_id}/upfront-payments"
              payload: { amount_cents: 25000000000 }
              as: Bidder
              as_user_id: "${rout_id}"
            - call: "POST /spectrum-auctions/applicants/${rout_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${rout_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
              captures: { rout_credit: "$.data.credit_pct" }
          assert:
            - "rin_credit == 15 (at the cap — inclusive)"
            - "rout_credit == 0 (one over the cap)"
            - "both are QUALIFIED (a failed credit claim does not disqualify)"

      - name: increment_ratio_exactly_one_point_five_hits_top_tier
        claim_type: Precision
        grounds:
          - calculations.clock_price_increment
        distinguishing_aspect: "The 1.5 tier boundary is inclusive via cross-multiplication: demand 6 / supply 4 gives 6*2 >= 3*4 (12 >= 12) so the +15% tier applies — 1,000,000,000 becomes exactly 1,150,000,000, not the 10% tier's 1,100,000,000."
        test_recipe:
          setup:
