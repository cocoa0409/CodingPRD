          assert:
            - "state after setup: ${l1_gate} == 7705.25, ${d1_density1} == 0.8500 and ${d1_airspace1} == 196.00; Cell.${c2_id}.fill_pct == 98.00 with status 'FULL'; Landfill.${lf_id}.active_cell_count == 0 and operating_status == 'SUSPENDED_NO_AIRSPACE'; SpecialWasteApproval.${swa_id}.status == 'SUSPENDED'; WasteLoad.${l1_id}.billing_status == 'FINALIZED' with host_royalty_amount 368.14 and final_charge_amount 8073.39"
            - "${d1_state2} == 'AMENDED' with ${d1_tons2} == 0, ${d1_airspace2} == 0 and ${d1_density2} == 0"
            - "${c2_state2} == 'ACTIVE', ${c2_consumed2} == 0.00 and ${c2_fill2} == 0.00 — the cell ledger is back to its exact pre-close value, not merely under the 98% threshold"
            - "${lf_active2} == 1, ${lf_status2} == 'OPEN' (the SUSPENDED_NO_AIRSPACE posture was lifted by the FULL -> ACTIVE compensation), ${lf_consumed2} == 0.00, ${lf_remaining2} == 1000200.00 and ${lf_life2} == 3.00"
            - "SpecialWasteApproval.${swa_id}.status is back to 'APPROVED' — the cascade-link-4 suspension was undone even though no load referenced the approval"
