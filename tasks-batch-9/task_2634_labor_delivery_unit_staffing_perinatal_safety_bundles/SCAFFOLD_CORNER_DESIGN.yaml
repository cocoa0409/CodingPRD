      - name: an_identical_window_snapshot_supersedes_its_predecessor_and_back_links_the_successor_id
        claim_type: Side Effect Execution
        grounds:
          - state_machines.QualityMeasureSnapshot.DRAFT_to_SUPERSEDED
          - entities.QualityMeasureSnapshot.fields.superseded_by_snapshot_id
          - entities.QualityMeasureSnapshot.fields.attribution_basis
          - entities.QualityMeasureSnapshot.fields.ntsv_cesarean_denominator
          - entities.QualityMeasureSnapshot.fields.episiotomy_denominator
          - entities.QualityMeasureSnapshot.fields.composite_quality_index
          - endpoints[POST /obstetric-units/{unitId}/quality-measure-snapshots]
          - concurrency_rules[snapshot-create-stale-unit]
          - calculations.quality_measure_rates
        distinguishing_aspect: |
          Creating a second snapshot over the byte-identical window is a CROSS-ENTITY side effect on
          the first row: the predecessor must move DRAFT -> SUPERSEDED and receive
          superseded_by_snapshot_id pointing at the NEW snapshot, while the new row stays DRAFT with a
          null back-pointer. The direction of the pointer is the discriminator — an implementation
          that writes the link on the successor instead of the predecessor, or that simply refuses the
          duplicate window with a conflict, both fail. The empty-cohort boundary is asserted at the
          same time: with zero encounters in the unit both denominators are 0, so both authoritative
          rates, the shadow rate and the composite index must all be null rather than 0.0000. Each
          create re-reads unit.version so the priority-6 OCC guard is satisfied with a live value.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with no beds, no staff and no encounters, so both
            quality_measure_rates cohorts are empty. unit.version is re-read immediately before each
            snapshot create because each create bumps it.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Heronwood Reporting Unit LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_v_a: $.data.version }
            - call: POST /obstetric-units/${unit_id}/quality-measure-snapshots
              payload: { period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z", expected_unit_version: "${unit_v_a}" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { snap1_id: $.data.id, snap1_status: $.data.status, snap1_link: $.data.superseded_by_snapshot_id }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_v_b: $.data.version }
          trigger:
            - call: POST /obstetric-units/${unit_id}/quality-measure-snapshots
              payload: { period_start_utc: "2026-07-01T00:00:00Z", period_end_utc: "2026-08-01T00:00:00Z", expected_unit_version: "${unit_v_b}" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { snap2_id: $.data.id, snap2_status: $.data.status, snap2_basis: $.data.attribution_basis }
          assert:
            - "HTTP 201"
            - "snap1_status == \"DRAFT\""
            - "snap1_link == null"
            - "QualityMeasureSnapshot.${snap1_id}.status == \"SUPERSEDED\""
            - "QualityMeasureSnapshot.${snap1_id}.superseded_by_snapshot_id == \"${snap2_id}\""
            - "QualityMeasureSnapshot.${snap2_id}.status == \"DRAFT\""
            - "QualityMeasureSnapshot.${snap2_id}.superseded_by_snapshot_id == null"
            - "QualityMeasureSnapshot.${snap2_id}.attribution_basis == \"DELIVERY_COHORT\""
            - "QualityMeasureSnapshot.${snap2_id}.ntsv_cesarean_denominator == 0"
            - "QualityMeasureSnapshot.${snap2_id}.ntsv_cesarean_numerator == 0"
            - "QualityMeasureSnapshot.${snap2_id}.ntsv_cesarean_rate_pct == null"
            - "QualityMeasureSnapshot.${snap2_id}.episiotomy_denominator == 0"
            - "QualityMeasureSnapshot.${snap2_id}.episiotomy_rate_pct == null"
            - "QualityMeasureSnapshot.${snap2_id}.shadow_ntsv_rate_pct == null"
            - "QualityMeasureSnapshot.${snap2_id}.composite_quality_index == null"
            - "QualityMeasureSnapshot.${snap2_id}.certified_at == null"
            - "${unit_v_b} > ${unit_v_a}"

      - name: fetal_escalation_cannot_jump_to_tier_two_before_tier_one_has_been_notified
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FetalMonitoringAssessment.ESCALATION_DUE_to_TIER_1_NOTIFIED
          - entities.FetalMonitoringAssessment.fields.escalation_tier_high_water
          - entities.FetalMonitoringAssessment.fields.escalation_status
          - entities.FetalMonitoringAssessment.fields.next_tier_due_at
          - endpoints[POST /fetal-monitoring-assessments/{assessmentId}/escalate]
          - validations[priority=8.1]
          - errors[ERR_ESCALATION_TIER_SKIPPED]
        distinguishing_aspect: |
          The escalation chain admits exactly ONE tier per call: target_tier must equal
          escalation_tier_high_water + 1. From a fresh ESCALATION_DUE assessment the high-water mark
          is 0, so target_tier 2 must be refused with ERR_ESCALATION_TIER_SKIPPED (409) even though
          every OTHER condition on the call is deliberately satisfied — the notified staff member is a
          real OB_ATTENDING holding an ACTIVE shift on the same unit (so 11.2 cannot fire) and
          clock_now 06:00 is well inside escalation_due_at 06:20 (so 14.2 cannot fire). This isolates
          the chain-step rule from the eligibility and window rules that surround it, and the
          assessment must be left untouched at high_water 0 with next_tier_due_at still null.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with one AVAILABLE LDR bed. An RN_LABOR_DELIVERY
            member with ADVANCED monitoring certification on an ACTIVE CHARGE shift 05:00-15:00 — the
            ACTIVE CHARGE shift is what satisfies the priority-12 on-the-case rule for the
            interpreter. An OB_ATTENDING on a separate ACTIVE BEDSIDE shift over the same window
            (different staff_id, so the 13.2 per-staff overlap rule does not apply) to serve as an
            eligible tier-2 notification target. One ANTEPARTUM encounter carrying a CATEGORY_II
            assessment recorded at 06:00, which starts at escalation_status ESCALATION_DUE with
            escalation_due_at 06:00 + ESCALATION_DUE_MINUTES[CATEGORY_II] 20 = 06:20 and
            escalation_tier_high_water 0.
