              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${p3_id}/visits"
              payload: { window_start: "2026-04-01T11:00:00Z", window_end: "2026-04-01T13:00:00Z", visit_kind: "SERVICE", crew_size_required: 1 }
              as: ProjectManager
              captures: { vc_id: $.data.id, vc_v0: $.data.version }
            # --- assign crew to Visit A ---
            - call: "POST /projects/${p1_id}/visits/${va_id}/assignments"
              payload: { crew_member_id: "${crew_id}", expected_visit_version: "${va_v0}" }
              as: ProjectManager
          trigger:
            - call: "POST /projects/${p2_id}/visits/${vb_id}/assignments"
              payload: { crew_member_id: "${crew_id}", expected_visit_version: "${vb_v0}" }
              as: ProjectManager
              captures: { asg_b: $.data.id }
            - call: "POST /projects/${p3_id}/visits/${vc_id}/assignments"
              payload: { crew_member_id: "${crew_id}", expected_visit_version: "${vc_v0}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "VisitAssignment.${asg_b}.status == ACTIVE (12:00 adjacency to 09:00-12:00 allowed under half-open)"
            - "response error_id == ERR_CREW_TIME_CONFLICT for Visit C (11:00-13:00 genuinely overlaps 09:00-12:00)"

      - name: visit_closed_overlap_touching_endpoint_conflicts
        grounds:
          - validations[priority=10]
          - errors[ERR_VISIT_TIME_CONFLICT]
          - entities.Visit.fields.window_start
        distinguishing_aspect: |
          CLOSED [start,end] interval semantics on the Visit resource (different entity and different geometry
          from the crew half-open rule). Within one project, a new visit 12:00-15:00 that merely TOUCHES an
          existing visit 09:00-12:00 at 12:00 IS a conflict -> ERR_VISIT_TIME_CONFLICT, even though the same
          touch is allowed at the crew (half-open) level.
        test_recipe:
          setup:
            - "An ACCEPTED project in WEST with a PLANNED visit 2026-05-01T09:00Z..12:00Z."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Oma Res", email: "oma@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "16 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 2.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${proj_id}/visits"
              payload: { window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T12:00:00Z", visit_kind: "INSTALL", crew_size_required: 1 }
              as: ProjectManager
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/visits"
              payload: { window_start: "2026-05-01T12:00:00Z", window_end: "2026-05-01T15:00:00Z", visit_kind: "SERVICE", crew_size_required: 1 }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VISIT_TIME_CONFLICT (closed interval: touching at 12:00 conflicts)"
            - "Project.${proj_id} has exactly 1 visit after the rejected create"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: firmware_apply_rollback_restores_version_invariant
        grounds:
          - state_machines.FirmwareUpdate.STAGED_to_APPLIED
          - state_machines.FirmwareUpdate.APPLIED_to_ROLLED_BACK
          - entities.Device.fields.firmware_version
          - entities.FirmwareUpdate.fields.prior_version
        distinguishing_aspect: |
          Conserved quantity = Device.firmware_version (a semver string). Apply (null -> 3.4.1) paired with its
          compensating rollback restores firmware_version to EXACTLY the prior_version captured at STAGED (null),
          leaving the conserved quantity unchanged from its pre-apply value.
        test_recipe:
          setup:
            - "A PROVISIONED device with firmware_version=null; a STAGED firmware update target_version=3.4.1; applied (firmware=3.4.1)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Pat Res", email: "pat@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "17 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
              captures: { rack_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 2.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${proj_id}/start-provisioning"
              payload: {}
              as: ProjectManager
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-CTRL", category: "CONTROLLER", rack_units: 2 }
              as: LowVoltageTech
              captures: { dev_id: $.data.id }
            - call: "POST /devices/${dev_id}/provision"
              payload: {}
              as: LowVoltageTech
            - call: "POST /devices/${dev_id}/firmware-updates"
              payload: { target_version: "3.4.1" }
              as: SupportEngineer
              captures: { fw_id: $.data.id }
            - call: "POST /devices/${dev_id}/firmware-updates/${fw_id}/apply"
              payload: {}
              as: SupportEngineer
          trigger:
            - call: "POST /devices/${dev_id}/firmware-updates/${fw_id}/rollback"
              payload: {}
              as: SupportEngineer
          assert:
            - "Device.${dev_id}.firmware_version == 3.4.1 after apply"
            - "FirmwareUpdate.${fw_id}.prior_version == null (captured at STAGED)"
            - "Device.${dev_id}.firmware_version is null after rollback (restored to prior_version; conserved quantity unchanged)"

      - name: device_provision_retire_conserves_rack_units_used
        grounds:
          - state_machines.Device.REGISTERED_to_PROVISIONED
          - state_machines.Device.PROVISIONED_to_RETIRED
          - calculations.rack_units_used
          - entities.Rack.fields.rack_units_used
        distinguishing_aspect: |
          Conserved quantity = Rack.rack_units_used (a different type: integer RU sum, not a semver). Provisioning
          a 2 RU device (used 0 -> 2) paired with retiring it (used 2 -> 0) restores rack_units_used to exactly
          its pre-provision value 0 — no RU drift.
        test_recipe:
          setup:
            - "A PROVISIONING project with a rack of rack_units_total=10 (rack_units_used=0) and one REGISTERED device rack_units=2."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Quy Res", email: "quy@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
