  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_compliance_requires_physician_active
        grounds:
          - state_machines.Visit.REQUESTED_to_COMPLIANCE_CLEARED
          - entities.Physician.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair Visit -> Physician: a Visit's REQUESTED -> COMPLIANCE_CLEARED transition is blocked
          when the physician's status is DEACTIVATED (Physician.status != ACTIVE), even though a valid CA
          license exists. The visit transition depends on the Physician entity's state.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed CA but DEACTIVATED. Cash patient, CA visit."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
            - call: "POST /physicians/${phys_id}/deactivate"
              payload: {}
              as: LicensingBoard
          trigger:
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"
            - "Visit.${v_id}.status == REQUESTED"

      - name: claim_reversal_depends_on_visit_voided
        grounds:
          - state_machines.Claim.ADJUDICATED_to_REVERSED
          - state_machines.Visit.APPROVED_INSURANCE_to_VOIDED
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Entity pair Claim -> Visit (a DIFFERENT pair than Visit->Physician above): a Claim transitions
          to REVERSED only as a consequence of its source Visit being VOIDED by the license-suspension
          cascade. The Claim's state change is gated on the Visit's state.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed CA. Parity payer covers CA. Insured patient."
            - "Insurance visit cleared+approved -> a Claim exists (auto-adjudicated). Then license suspended."
          setup_api_calls:
