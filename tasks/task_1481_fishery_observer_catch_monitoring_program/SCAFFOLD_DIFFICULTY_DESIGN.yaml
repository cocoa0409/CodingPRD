      - name: selection_scoring_multi_input_nonlinear_with_gear_branch
        grounds:
          - calculations.vessel_selection_scoring
          - entities.SelectionNotice.fields.selection_score
          - entities.SelectionNotice.fields.rank
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction:
          recency_component uses min(recency_days,365)/365 (clamped input),
          compliance_component is a conditional branch on substantiated_harassment_count
          (30 when 0 else max(0, 30 - 10*count) — a max() floor), penalty_component
          subtracts 5*selection_penalty_points, and the whole raw score is then
          conditionally multiplied by 1.25 when Vessel.gear_type == Fishery.priority_gear.
          A vessel with null last_observed_end_date, clean record, zero penalties and
          gear match scores 100.0000 while an identical vessel without gear match scores
          80.0000 — the conditional gear branch alone shifts the value non-linearly.
          Distinct mode from the rounding-order instance (mode b).
        test_recipe:
          setup:
            - "Fishery F with priority_gear TRAWL, coverage_target_pct 0.30"
            - "Operator OP GOOD; vessels V1 (TRAWL, no prior history -> recency null) and V2 (LONGLINE, no prior history), both ACTIVE in F"
            - "CoveragePlan P over F published (required = ceil(1000*0.30)=300 with projected_em 0 -> 300? Pinned: effort 1000, em 0 -> em_cap 400, em_credited 0, base 1000, required ceil(1000*0.30)=300)"
            - "Selection run over P scores both eligible vessels"
