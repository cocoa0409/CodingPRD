          - state_machines.Cycle.DOSIMETRY_REVIEW_to_DOSE_CONFORMING
          - calculations.lot_cumulative_dose
        distinguishing_aspect: "The consistency model is immediate: the dosimetry-close response itself already carries delivered_dose_kgy and the DOSE_CONFORMING status, and a read of the lot in the very next request shows QUARANTINE and the updated cumulative dose with no settling delay."
