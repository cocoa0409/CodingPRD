              as: MaintenanceTech
              captures: { bat_2: $.data.id }
            - call: "POST /batteries/${bat_2}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-3", charge_pct: 90, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_3: $.data.id }
            - call: "POST /batteries/${bat_3}/charge"
              payload: { target_charge_pct: 90 }
              as: MaintenanceTech
            - call: "POST /drones"
