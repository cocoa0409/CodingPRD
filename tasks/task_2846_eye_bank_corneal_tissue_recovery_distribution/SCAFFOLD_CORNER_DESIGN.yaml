      - name: err_surgeon_day_capacity_exceeded_is_triggerable
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_46
          - "errors[ERR_SURGEON_DAY_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          The per-surgeon, per-UTC-date graft ceiling is an aggregate rule; its trigger needs three
          tissues and three requests on one calendar date.
        excluded_because:
          difficulty_instance: resource_temporal_overlap / surgeon_day_capacity_counts_two_grafts_per_utc_date
          rationale: |
            That resource_temporal_overlap instance already allocates two grafts on 2026-08-08 and
            then takes the 422 ERR_SURGEON_DAY_CAPACITY_EXCEEDED on the third, and additionally
            proves a fourth allocation on 2026-08-09 is accepted. Repeating the trigger here would
            duplicate the same aggregate counting logic.

      - name: err_donor_under_lookback_and_err_tissue_not_eligible_are_triggerable
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_14
          - validations.priority_24
          - "errors[ERR_DONOR_UNDER_LOOKBACK]"
          - "errors[ERR_TISSUE_NOT_ELIGIBLE]"
        distinguishing_aspect: |
          A tissue whose donor is under an open lookback is both QUARANTINED (dimension-A defect) and
          lookback-flagged, so the two codes contend for the same request.
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / allocation_of_quarantined_lookback_tissue_returns_409_state_error
          rationale: |
            That priority_pair_validation_conflict instance triggers exactly this contention, asserts
            the 409 ERR_TISSUE_NOT_ELIGIBLE wins on priority 14, and then clears the quarantine to
            expose the priority-24 ERR_DONOR_UNDER_LOOKBACK underneath, covering both codes.

      - name: err_preservation_window_exceeded_is_triggerable
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_31
          - "errors[ERR_PRESERVATION_WINDOW_EXCEEDED]"
        distinguishing_aspect: |
          Completing a recovery after the donor's recovery_deadline_at must be refused rather than
          recorded as an EXCEEDED time-limit band.
        excluded_because:
          difficulty_instance: boundary_precision_check / preservation_at_equal_to_recovery_deadline_accepted_one_millisecond_later_rejected
          rationale: |
            That boundary_precision_check instance accepts preservation_at exactly at the deadline and
            then takes 422 ERR_PRESERVATION_WINDOW_EXCEEDED one millisecond later on an identical
            donor, which is a strictly stronger test of this code than an interior failure.

      - name: err_ecd_below_request_minimum_is_triggerable
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_41
          - "errors[ERR_ECD_BELOW_REQUEST_MINIMUM]"
        distinguishing_aspect: |
          The request's min_ecd floor is compared against the RECORDED SPECULAR endothelial cell
          count, and the comparison is inclusive.
        excluded_because:
          difficulty_instance: boundary_precision_check / ecd_floor_is_inclusive_so_2100_matches_2100_and_2101_is_rejected
          rationale: |
            That boundary_precision_check instance allocates a 2100-cell tissue against a min_ecd of
            2100 and then takes 422 ERR_ECD_BELOW_REQUEST_MINIMUM against a min_ecd of 2101, pinning
            both the code and the inclusive boundary.

      - name: err_surgeon_not_credentialed_is_triggerable
        claim_type: every_code_triggerable
        grounds:
          - validations.priority_25
          - "errors[ERR_SURGEON_NOT_CREDENTIALED]"
        distinguishing_aspect: |
          A SUSPENDED or INACTIVE surgeon may hold requests but may not receive tissue, and the check
          runs again at confirmation and dispatch time.
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / allocation_for_suspended_surgeon_with_short_shelf_life_returns_422_credentialing
          rationale: |
            That priority_pair_validation_conflict instance suspends the surgeon and takes the 422
            ERR_SURGEON_NOT_CREDENTIALED on allocation, while the cross_entity_state_dependency
            instance dispatch_gated_by_the_receiving_surgeons_credential_status re-triggers the same
            code at dispatch time after a mid-flight suspension.

  - section: rbac
    instances:
      - name: every_role_exercises_its_own_exclusive_operation_along_one_donor_to_classification_chain
        claim_type: exclusive_operations_permitted
        grounds:
          - "roles[EyeBankCoordinator].exclusive_operations"
          - "roles[LabTechnician].exclusive_operations"
          - "roles[MedicalDirector].exclusive_operations"
          - "roles[RecoveryTechnician].exclusive_operations"
          - "roles[EvaluationTechnician].exclusive_operations"
          - complexity_profile.role_model
        distinguishing_aspect: |
          One chain drives the donor from referral to a classified tissue, switching actor at every
          hop so that each of the five bank-side roles performs at least one of its own
          exclusive_operations and none of them is silently accepted under a different role. The
          Surgeon role's four exclusive operations (deliver, implant, return, adverse-reaction
          report) are exercised by the delivery chains in the errors section of this file; here the
          Surgeon only opens their own request, which is a shared operation.
