# =============================================================================
# Task 1825 — Astronomy Club & Public Observing Night
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dues_proration_midyear_vs_full_period
        grounds:
          - calculations.dues_proration
          - entities.DuesInvoice.fields.amount_cents
        distinguishing_aspect: |
          Entity domain: DuesInvoice/Member dues. Two valid readings of the
          same proration prose — single-final-rounding vs monthly-rounding —
          produce different cents for a 92-day invoice: pinned formula gives
          30247 (120000*92/365 = 30246.5753, one round_half_up at the end),
          while the full_period variant on a 365-day invoice returns the
          annual dues verbatim with zero proration arithmetic.
        test_recipe:
          setup:
            - "MembershipTier INDIVIDUAL with annual_dues_cents 120000"
            - "Member M1 on that tier; logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Pat Pro", email: "pat@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_mid: $.data.id, amt_mid: $.data.amount_cents }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_full: $.data.id, amt_full: $.data.amount_cents }
          assert:
            - "DuesInvoice.${inv_mid}.amount_cents == 30247"
            - "DuesInvoice.${inv_full}.amount_cents == 120000"
            - "amt_mid != round_half_up per-month interpretation: 30247 != 30240 (monthly-rounding reading would give 7*4320-ish drift; the pinned single-rounding value is authoritative)"

      - name: dark_sky_median_provisional_vs_final
        grounds:
          - calculations.dark_sky_median
          - state_machines.DarkSkyReport.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Entity domain: DarkSkyReport advocacy metric (different domain from
          dues). Provisional variant recomputes on every swept reading while
          OPEN; final variant freezes at FINALIZED — a reading added to the
          window AFTER finalize changes the provisional recompute of a second
          OPEN report but must NOT move the finalized report's median_sqm.
        test_recipe:
          setup:
            - "Tier + member + PUBLIC_NIGHT event E scheduled & confirmed infrastructure in place"
            - "Three readings 21.00, 21.40, 21.80 swept into report R1 covering 2026-08-01..2026-09-01"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Sky Watcher", email: "sky@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "Aug PN", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 20, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 21.00 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 21.40 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 21.80 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/dark-sky-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ClubOfficer
              captures: { report_id: $.data.id, med_pre: $.data.median_sqm }
            - call: "POST /club/dark-sky-reports/${report_id}/finalize"
              payload: {}
              as: ClubOfficer
            - call: "POST /club/sky-quality-readings"
              payload: { taken_by_member_id: "${member_id}", event_id: "${event_id}", sqm_value: 10.50 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "GET /club/dark-sky-reports/${report_id}"
              payload: {}
              as: ClubOfficer
              captures: { med_post: $.data.median_sqm, grade_post: $.data.advocacy_grade }
          assert:
            - "med_pre == 21.40 (odd count median of [21.00, 21.40, 21.80])"
            - "med_post == 21.40 (final variant frozen; the 10.50 reading inside the window does NOT move it)"
            - "grade_post == B (median 21.40 >= 20.50 and < 21.50)"
            - "DarkSkyReport.${report_id}.reading_count == 3 (frozen sweep set)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: group_deposit_marginal_tiers
        grounds:
          - calculations.group_deposit
          - entities.GroupVisitBooking.fields.deposit_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered marginal
          rates with nested min/max and a tier boundary at 30. A party of 31
          pays 22000 under marginal allocation (0 + 20*1000 + 1*2000); an
          average-rate reading of the same prose would give 62000 — the two
          interpretations diverge by 40000.
        test_recipe:
          setup:
            - "Tier, member in good standing (ACTIVE, dues current), PUBLIC_NIGHT event SCHEDULED"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "FAMILY", annual_dues_cents: 180000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 3 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Group Lead", email: "lead@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "PN", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-15T01:00:00Z", window_end: "2026-08-15T05:00:00Z", moon_illumination_pct: 15, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
          trigger:
            - call: "POST /club/group-visit-bookings"
              payload: { event_id: "${event_id}", group_name: "Lincoln Middle", party_size: 31, contact_member_id: "${member_id}" }
              as: Member
              as_user_id: "${member_id}"
              captures: { booking_id: $.data.id, deposit: $.data.deposit_cents }
          assert:
            - "GroupVisitBooking.${booking_id}.deposit_cents == 22000"
            - "deposit != 62000 (average-rate misreading)"

      - name: overdue_fee_nested_rounding_and_cap
        grounds:
          - calculations.overdue_fee
          - entities.LoanReservation.fields.overdue_fees_cents
        distinguishing_aspect: |
          Mode (b) vs instance 1's mode (a): nested threshold arithmetic
          where evaluation order matters — grace subtraction BEFORE the
          daily multiply, cap applied ONLY in the final variant. A 25-day-late
          return yields provisional (25-2)*500 = 11500 uncapped on read while
          OVERDUE, but final persists min(11500, 10000) = 10000 — the same
          inputs, two numbers, pinned order.
        test_recipe:
          setup:
            - "Member ACTIVE with dues current and SOLAR-free REFRACTOR certification valid through 2027"
            - "Telescope T REFRACTOR; loan window 2026-08-02..2026-08-04; checked out at window start"
            - "Logical clock advanced to 2026-08-29 (25 days past window_end)"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Late Larry", email: "larry@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "80mm Refractor", equipment_class: "REFRACTOR" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "REFRACTOR", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope_id}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: ClubOfficer
            - call: "POST /club/loan-reservations/${loan_id}/checkout"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: ClubOfficer
          trigger:
            - call: "GET /club/loan-reservations/${loan_id}"
              payload: {}
              as: EquipmentChair
              captures: { fee_provisional: $.data.overdue_fees_cents, loan_status: $.data.status }
            - call: "POST /club/loan-reservations/${loan_id}/return"
              payload: { damage_reported: false }
              as: EquipmentChair
              captures: { fee_final: $.data.overdue_fees_cents }
          assert:
            - "loan_status == OVERDUE (clock 2026-08-29 >= window_end 2026-08-04)"
            - "fee_provisional == 11500 (25 days late - 2 grace = 23 * 500, uncapped)"
            - "fee_final == 10000 (capped at FEE_CAP_CENTS on finalization)"
            - "LoanReservation.${loan_id}.status == RETURNED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: maintenance_ticket_verification_cycle
        grounds:
          - state_machines.MaintenanceTicket.VERIFICATION_to_IN_PROGRESS
          - state_machines.MaintenanceTicket.IN_PROGRESS_to_VERIFICATION
        distinguishing_aspect: |
          Entity: MaintenanceTicket — a true cycle (IN_PROGRESS ->
          VERIFICATION -> IN_PROGRESS) with a termination path to CLOSED.
          Telescope stays in MAINTENANCE through the loop; condition_score
          applies only on CLOSED.
        test_recipe:
          setup:
            - "Telescope T AVAILABLE; ticket opened (T -> MAINTENANCE)"
          setup_api_calls:
            - call: "POST /club/telescopes"
              payload: { name: "12in Dob", equipment_class: "DOBSONIAN" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/maintenance-tickets"
              payload: { telescope_id: "${scope_id}", kind: "COLLIMATION", severity: "MEDIUM", condition_delta: -5 }
              as: EquipmentChair
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /club/maintenance-tickets/${ticket_id}/start"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/maintenance-tickets/${ticket_id}/submit-verification"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/maintenance-tickets/${ticket_id}/reopen"
              payload: {}
              as: EquipmentChair
              captures: { status_loop: $.data.status }
            - call: "POST /club/maintenance-tickets/${ticket_id}/submit-verification"
              payload: {}
              as: EquipmentChair
            - call: "POST /club/maintenance-tickets/${ticket_id}/close"
              payload: {}
              as: EquipmentChair
              captures: { status_end: $.data.status }
          assert:
            - "status_loop == IN_PROGRESS (cycle VERIFICATION -> IN_PROGRESS traversed)"
            - "status_end == CLOSED"
            - "Telescope.${scope_id}.condition_score == 95 (100 - 5 applied once, on close, not per loop)"
            - "Telescope.${scope_id}.status == AVAILABLE (last ticket closed)"

      - name: member_suspension_reinstatement_cycle
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Entity: Member (different entity than MaintenanceTicket) — cycle
          ACTIVE -> SUSPENDED -> ACTIVE driven by the logical clock crossing
          dues_paid_through + GRACE and then a reinstate after payment.
          effective_access_level flips 2 -> 0 -> 2 across the loop.
        test_recipe:
          setup:
            - "Member M with tier access level 2; dues paid through 2026-08-10; GRACE 7d, LAPSE 37d constants"
            - "Clock moved to 2026-08-18 (8 days past paid-through) -> auto SUSPENDED"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Cyclical Cy", email: "cy@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2025-08-10T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: ClubOfficer
              captures: { inv1: $.data.id, inv1_amt: $.data.amount_cents }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv1}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: ClubOfficer
            - call: "GET /club/members/${member_id}"
              payload: {}
              as: ClubOfficer
              captures: { status_susp: $.data.status, lvl_susp: $.data.effective_access_level }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-10T00:00:00Z", period_end: "2027-08-10T00:00:00Z" }
              as: ClubOfficer
              captures: { inv2: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv2}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /club/members/${member_id}/reinstate"
              payload: {}
              as: ClubOfficer
              captures: { status_re: $.data.status, lvl_re: $.data.effective_access_level }
          assert:
            - "status_susp == SUSPENDED"
            - "lvl_susp == 0"
            - "status_re == ACTIVE"
            - "lvl_re == 2 (cycle returns to the original tier level)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; one depth>=3, one depth>=2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: suspension_cascade_depth3
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.EventOperatorAssignment.CONFIRMED_to_WITHDRAWN
          - state_machines.ObservingEvent.CONFIRMED_to_SCHEDULED
          - calculations.operator_coverage
        distinguishing_aspect: |
          Trigger: dues suspension (clock crossing). Chain depth 3:
          Member SUSPENDED -> assignment CONFIRMED->WITHDRAWN -> host event
          confirmed_operator_count recomputes -> host event CONFIRMED ->
          SCHEDULED because coverage lapsed. Each link is caused by the
          previous link, not by the clock directly.
        test_recipe:
          setup:
            - "Member M ACTIVE with REFRACTOR cert; event E SCHEDULED with min_operators 1; M CONFIRMED as operator; E CONFIRMED"
            - "M's dues_paid_through 2026-08-10; clock advanced to 2026-08-18 -> auto-suspension fires the cascade"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Operator Op", email: "op@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2025-08-10T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "8in SCT", equipment_class: "SCT" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "SCT", expires_at: "2027-08-01T00:00:00Z" }
              as: EquipmentChair
            - call: "POST /club/observing-events"
              payload: { title: "PN Cascade", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-20T01:00:00Z", window_end: "2026-08-20T05:00:00Z", moon_illumination_pct: 10, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
            - call: "POST /club/event-operator-assignments"
              payload: { event_id: "${event_id}", member_id: "${member_id}", telescope_id: "${scope_id}" }
              as: EventCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /club/event-operator-assignments/${asg_id}/accept"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /club/observing-events/${event_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v1: $.data.version }
            - call: "POST /club/observing-events/${event_id}/confirm"
              payload: { expected_event_version: "${ev_v1}" }
              as: EventCoordinator
              captures: { ev_confirmed: $.data.status }
            - call: "POST /club/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: ClubOfficer
          trigger:
            - call: "GET /club/members/${member_id}"
              payload: {}
              as: ClubOfficer
              captures: { m_status: $.data.status }
            - call: "GET /club/event-operator-assignments/${asg_id}"
              payload: {}
              as: EventCoordinator
              captures: { a_status: $.data.status }
            - call: "GET /club/observing-events/${event_id}"
              payload: {}
              as: EventCoordinator
              captures: { e_status: $.data.status, e_count: $.data.confirmed_operator_count }
          assert:
            - "ev_confirmed == CONFIRMED"
            - "m_status == SUSPENDED (link 1)"
            - "a_status == WITHDRAWN (link 2, caused by link 1's side effect)"
            - "e_count == 0"
            - "e_status == SCHEDULED (link 3, caused by link 2's coverage recompute)"

      - name: certification_revocation_cascade_depth2
        grounds:
          - state_machines.TrainingCertification.ACTIVE_to_REVOKED
          - state_machines.LoanReservation.RESERVED_to_CANCELLED
          - state_machines.Telescope.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          Different trigger from instance 1 (revocation, not clock): cert
          REVOKED -> matching RESERVED loan CANCELLED -> telescope RESERVED
          -> AVAILABLE. Depth 3 chain of distinct entity types, and the
          loan-release link is conditional on equipment_class match.
        test_recipe:
          setup:
            - "Member ACTIVE & dues-current with SCT cert; telescope S SCT; loan RESERVED on S"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "INDIVIDUAL", annual_dues_cents: 120000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 2 }
              as: ClubOfficer
              captures: { tier_id: $.data.id }
            - call: "POST /club/members"
              payload: { full_name: "Revokee", email: "rev@x.com", tier_id: "${tier_id}" }
              as: ClubOfficer
              captures: { member_id: $.data.id }
            - call: "POST /club/dues-invoices"
              payload: { member_id: "${member_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2027-08-01T00:00:00Z" }
              as: ClubOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /club/dues-payments"
              payload: { invoice_id: "${inv_id}", member_id: "${member_id}", amount_cents: 120000 }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /club/telescopes"
              payload: { name: "SCT-8", equipment_class: "SCT" }
              as: EquipmentChair
              captures: { scope_id: $.data.id }
            - call: "POST /club/training-certifications"
              payload: { member_id: "${member_id}", equipment_class: "SCT", expires_at: "2027-06-01T00:00:00Z" }
              as: EquipmentChair
              captures: { cert_id: $.data.id }
            - call: "POST /club/loan-reservations"
              payload: { member_id: "${member_id}", telescope_id: "${scope_id}", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-09T00:00:00Z" }
              as: Member
              as_user_id: "${member_id}"
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /club/training-certifications/${cert_id}/revoke"
              payload: {}
              as: EquipmentChair
          assert:
            - "TrainingCertification.${cert_id}.status == REVOKED (link 1)"
            - "LoanReservation.${loan_id}.status == CANCELLED (link 2, class-matched)"
            - "Telescope.${scope_id}.status == AVAILABLE (link 3, released by loan cancellation)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_confirm
        grounds:
          - validations[priority=6]
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WEATHER_RISK]
        distinguishing_aspect: |
          Category pair: state (p6) vs business_temporal (p20). One confirm
          request that fails BOTH: the event is already CANCELLED (state
          precondition violated) AND the recorded weather_cancellation_pct is
          80 (>= 70, weather gate violated). Pinned ordering returns p6's
          ERR_INVALID_STATE — the state check runs before any business gate.
        test_recipe:
          setup:
            - "PUBLIC_NIGHT event SCHEDULED; weather-check recorded 80; event then CANCELLED (reason WEATHER recorded manually)"
          setup_api_calls:
            - call: "POST /club/observing-events"
              payload: { title: "Dual Fail", event_kind: "PUBLIC_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 20, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/observing-events/${event_id}/schedule"
              payload: {}
              as: EventCoordinator
            - call: "POST /club/observing-events/${event_id}/weather-check"
              payload: { weather_cancellation_pct: 80 }
              as: EventCoordinator
            - call: "POST /club/observing-events/${event_id}/cancel"
              payload: { cancellation_reason: "WEATHER" }
              as: EventCoordinator
            - call: "GET /club/observing-events/${event_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /club/observing-events/${event_id}/confirm"
              payload: { expected_event_version: "${ev_v}" }
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (p6 state beats p20 weather even though weather_cancellation_pct == 80 also fails)"
            - "ObservingEvent.${event_id}.status == CANCELLED (unchanged)"

      - name: safety_vs_referential_on_solar_confirm
        grounds:
          - validations[priority=8]
          - validations[priority=20]
          - errors[ERR_NO_SOLAR_CERTIFIED_OPERATOR]
          - errors[ERR_WEATHER_RISK]
        distinguishing_aspect: |
          Different category pair from instance 1: business_safety (p8 solar
          operator certification) vs business_temporal weather risk (p20).
          A SOLAR_SESSION confirm that fails BOTH gates must surface
          ERR_NO_SOLAR_CERTIFIED_OPERATOR because safety outranks weather.
        test_recipe:
          setup:
            - "SOLAR_SESSION E SCHEDULED inside daylight; one operator CONFIRMED but holding only REFRACTOR cert (no SOLAR_SCOPE cert)"
            - "weather-check recorded 80 (>= WEATHER_CANCEL_THRESHOLD 70)"
