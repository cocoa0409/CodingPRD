  - rule_id: compensating_invariant
    instances:
      - name: order_money_splits_into_cash_and_credit_without_loss
        grounds:
          - calculations.refund_and_credit_settlement
          - calculations.ticket_order_total
          - endpoints[POST /ticket-orders/{orderId}/cancel]
          - endpoints[POST /ticket-orders/{orderId}/settle-refund]
          - entities.GuestAccount.fields.experience_credit_cents
        distinguishing_aspect: |
          Conserved quantity: guest money. For every order that reaches REFUNDED from CONFIRMED,
          refunded_cents + credit_issued_cents must equal net_amount_cents exactly, and the guest's
          experience_credit_cents must equal the SUM of credit_issued_cents over that guest's REFUNDED
          orders — never over its REFUND_DUE ones. The load-bearing case is an odd net of 188727 cents
          split at 0.50: the cash leg rounds up to 94364 and the credit leg must absorb 94363, so a
