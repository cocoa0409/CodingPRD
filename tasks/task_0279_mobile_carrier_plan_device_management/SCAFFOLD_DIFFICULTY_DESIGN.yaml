# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0279
# Depth probe: 9 Difficulty Rules (§0.5) x >= 2 instances each (>= 18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every setup_api_calls / trigger call resolves to a flat §1.5 endpoint.
# All numeric asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancel_settlement_forward_vs_chronological_on_line
        grounds:
          - calculations.line_cancel_settlement
          - state_machines.Line.ACTIVE_to_CANCELLED
          - state_machines.BillingCycle.OPEN_to_CLOSED
          - entities.Charge.fields.charge_type
        distinguishing_aspect: |
          Same cancelled Line yields different ledger outcomes by variant: the FORWARD variant
          (at cancel) accelerates the entire EIP remaining_balance (90000) as one EIP_PAYOFF charge,
          whereas the CHRONOLOGICAL variant (at cycle close) would charge only one 3750 EIP installment —
          a Line/BillingCycle domain, distinct from the account-discount dual variant below.
        test_recipe:
          setup:
            - "Account A (ACTIVE, version 1) on a 30-day cycle 2026-06-01..2026-07-01; clock at 2026-06-18."
            - "One ACTIVE line on PLUS (monthly_fee 7000); single line so group_discount_pct=0.00 -> discounted_base 7000."
            - "Line has an ACTIVE EIP: device retail 99900, down 9900, term 24 -> remaining_balance 90000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "A", holder_email: "a@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /billing-cycles"
              payload: { account_id: "${acc_id}", cycle_start: "2026-06-01T00:00:00Z", cycle_end: "2026-07-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /plans"
              payload: { code: "PLUS", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /devices"
              payload: { model: "Phone X", sku: "PX-1", retail_price_cents: 99900, stock_count: 5 }
              as: CarrierAgent
              captures: { dev_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000001" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /installment-plans"
              payload: { line_id: "${line_id}", device_id: "${dev_id}", term_months: 24, down_payment_cents: 9900 }
              as: CarrierAgent
              captures: { eip_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: BillingSystem
          trigger:
            - call: "POST /lines/${line_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acc_id}"
          assert:
            - "Line.${line_id}.status == CANCELLED"
            - "InstallmentPlan.${eip_id}.status == PAID_OFF"
            - "InstallmentPlan.${eip_id}.remaining_balance_cents == 0"
            - "A Charge with charge_type==EIP_PAYOFF and amount_cents==90000 is posted (FORWARD accelerates full remaining)"
            - "A Charge with charge_type==CREDIT and amount_cents==-2800 is posted (forward credit = round_half_up(7000*12/30))"

      - name: group_discount_projected_vs_actual_on_account
        grounds:
          - calculations.account_cycle_total
          - calculations.group_discount
          - entities.Account.fields.group_discount_pct
          - entities.Account.fields.active_line_count
        distinguishing_aspect: |
          On the Account domain (distinct from the Line/BillingCycle cancel variant), the projected
          discount would count 4 lines (2 ACTIVE + 2 still PENDING_ACTIVATION) giving 0.15 and a projected
          discounted base of 5950, whereas the actual discount counts only the 2 ACTIVE lines giving 0.05
          and a discounted base of 6650 — the same plan fee resolves to different cents.
        test_recipe:
          setup:
            - "Account with 4 lines on PLUS: 2 reached ACTIVE, 2 remain PENDING_ACTIVATION (no SIM activation)."
            - "active_line_count counts only {ACTIVE,SUSPENDED} -> 2 -> group_discount_pct=0.05."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "B", holder_email: "b@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v0: $.data.version }
            - call: "POST /plans"
              payload: { code: "PLUS2", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v0}" }
              as: CarrierAgent
              captures: { line1_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line1_id}", sim_type: "PHYSICAL", iccid: "8901000000000000010" }
              as: CarrierAgent
            - call: "POST /lines/${line1_id}/activate"
              payload: {}
              as: CarrierAgent
              captures: { acc_v1: $.data.version }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v1}" }
              as: CarrierAgent
              captures: { line2_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line2_id}", sim_type: "PHYSICAL", iccid: "8901000000000000011" }
              as: CarrierAgent
            - call: "POST /lines/${line2_id}/activate"
              payload: {}
              as: CarrierAgent
              captures: { acc_v3: $.data.version }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v3}" }
              as: CarrierAgent
              captures: { line3_id: $.data.id }
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: CarrierAgent
              captures: { acc_v4: $.data.version }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v4}" }
              as: CarrierAgent
              captures: { line4_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: CarrierAgent
              captures: { gd: $.data.group_discount_pct }
          assert:
            - "Account.${acc_id}.active_line_count == 2"
            - "Account.${acc_id}.group_discount_pct == 0.05"
            - "Actual per-line discounted base = round_half_up(7000*(1-0.05)) == 6650, not the projected-4-lines 5950"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_bill_nonlinear_overage_tier_and_discount_mode_a
        grounds:
          - calculations.line_overage
          - calculations.account_cycle_total
          - entities.Plan.fields.overage_tier1_cap_mb
          - entities.Line.fields.cycle_data_used_mb
        distinguishing_aspect: |
          Mode (a): the per-line total combines >=3 inputs with non-linear interaction — a tiered
          min/max overage split (tier1 capped at 5120 then tier2), a discount branch on group_discount_pct,
          and an EIP add — used_mb 28000 crosses the tier boundary giving overage 6320 (5120*1c + 2400*0.5c).
        test_recipe:
          setup:
            - "Single ACTIVE line on PLUS; group_discount_pct=0.00; clock at 2026-06-15 inside 30-day cycle."
            - "Line consumed 28000 MB DATA (28000 - 20480 = 7520 over; 5120 at tier1, 2400 at tier2)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "C", holder_email: "c@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /billing-cycles"
              payload: { account_id: "${acc_id}", cycle_start: "2026-06-01T00:00:00Z", cycle_end: "2026-07-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /plans"
              payload: { code: "PLUS3", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "ESIM" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BillingSystem
            - call: "POST /usage-records"
              payload: { line_id: "${line_id}", usage_type: "DATA", data_mb: 28000, occurred_at: "2026-06-15T01:00:00Z" }
              as: CarrierAgent
          trigger:
            - call: "GET /lines/${line_id}/usage-summary"
              payload: {}
              as: CarrierAgent
              captures: { ov: $.data.overage_cents }
          assert:
            - "usage-summary.cycle_data_used_mb == 28000"
            - "usage-summary.overage_cents == 6320 (5120*1000 + 2400*500 milli-cents = 6,320,000 -> 6320 cents)"

      - name: account_base_subtotal_round_per_line_then_sum_mode_b
        grounds:
          - calculations.account_cycle_total
          - calculations.line_proration
          - state_machines.BillingCycle.OPEN_to_CLOSED
          - entities.Charge.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — 3 lines on monthly_fee 6995 at 0.10 discount give
          per-line discounted_base round_half_up(6295.5)=6296; rounding-per-line-then-sum yields 18888,
          while sum-then-round would give 18887. This is a different mode from instance (a)'s tier min/max.
        test_recipe:
          setup:
            - "Account with 3 ACTIVE lines on plan ODD (monthly_fee 6995); group_discount_pct=0.10."
            - "Full 30-day cycle, every line active all 30 days; no overage, no EIP, no add-ons; clock at cycle_end."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "D", holder_email: "d@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /billing-cycles"
              payload: { account_id: "${acc_id}", cycle_start: "2026-06-01T00:00:00Z", cycle_end: "2026-07-01T00:00:00Z" }
              as: BillingSystem
              captures: { cyc_id: $.data.id }
            - call: "POST /plans"
              payload: { code: "ODD", name: "Odd", monthly_fee_cents: 6995, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v0}" }
              as: CarrierAgent
              captures: { l1: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${l1}", sim_type: "ESIM" }
              as: CarrierAgent
            - call: "POST /lines/${l1}/activate"
              payload: {}
              as: CarrierAgent
              captures: { acc_v1: $.data.version }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v1}" }
              as: CarrierAgent
              captures: { l2: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${l2}", sim_type: "ESIM" }
              as: CarrierAgent
            - call: "POST /lines/${l2}/activate"
              payload: {}
              as: CarrierAgent
              captures: { acc_v2: $.data.version }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "ESIM", expected_account_version: "${acc_v2}" }
              as: CarrierAgent
              captures: { l3: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${l3}", sim_type: "ESIM" }
              as: CarrierAgent
            - call: "POST /lines/${l3}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /billing-cycles/${cyc_id}/close"
              payload: {}
              as: BillingSystem
          trigger:
            - call: "GET /charges?billing_cycle_id=${cyc_id}&charge_type=PLAN_BASE"
              payload: {}
              as: BillingSystem
          assert:
            - "Sum of Charge.amount_cents where charge_type==PLAN_BASE for cycle ${cyc_id} == 18888 (6296*3, round-per-line-then-sum), NOT 18887"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: line_suspend_reconnect_cycle
        grounds:
          - state_machines.Line.ACTIVE_to_SUSPENDED
          - state_machines.Line.SUSPENDED_to_ACTIVE
          - entities.Line.fields.suspend_reason
        distinguishing_aspect: |
          Line exhibits a cycle ACTIVE -> SUSPENDED -> ACTIVE (suspend/reconnect loop): the same line
          returns to ACTIVE after reconnect with suspend_reason cleared — a non-linear cyclic shape on Line.
        test_recipe:
          setup:
            - "One ACTIVE line on an ACTIVE account."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "E", holder_email: "e@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-E", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000020" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /lines/${line_id}/suspend"
              payload: { suspend_reason: "VOLUNTARY" }
              as: CarrierAgent
          trigger:
            - call: "POST /lines/${line_id}/reconnect"
              payload: {}
              as: CarrierAgent
              captures: { st: $.data.status }
          assert:
            - "Line.${line_id}.status == ACTIVE (returned to ACTIVE via the cycle)"
            - "Line.${line_id}.suspend_reason cleared/null after reconnect"

      - name: port_request_branching_reject_then_revert
        grounds:
          - state_machines.PortRequest.VALIDATED_to_COMPLETED
          - state_machines.PortRequest.REQUESTED_to_REJECTED
          - state_machines.PortRequest.COMPLETED_to_REVERTED
        distinguishing_aspect: |
          PortRequest (different entity from Line) has branching fork-join with compensation: VALIDATED forks
          to COMPLETED or REJECTED with divergent side-effect sets, and COMPLETED PORT_IN can be REVERTED —
          a non-linear branching+revert shape distinct from Line's cycle.
        test_recipe:
          setup:
            - "An ACTIVE line with a COMPLETED PORT_IN request (external_number 12025550111)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "F", holder_email: "f@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /plans"
              payload: { code: "P-F", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000030" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /port-requests"
              payload: { line_id: "${line_id}", direction: "PORT_IN", external_number: "12025550111", donor_carrier: "OtherCo", account_pin: "9999" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /port-requests/${pr_id}/validate"
              payload: { account_pin: "9999" }
              as: PortingOps
            - call: "POST /port-requests/${pr_id}/complete"
              payload: {}
              as: PortingOps
          trigger:
            - call: "POST /port-requests/${pr_id}/revert"
              payload: {}
              as: PortingOps
              captures: { st: $.data.status }
          assert:
            - "PortRequest.${pr_id}.status == REVERTED"
            - "Line.${line_id}.phone_number == null after revert (number returned to donor)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: line_cancel_depth3_cascade_eip_addon_account
        grounds:
          - state_machines.Line.ACTIVE_to_CANCELLED
          - state_machines.InstallmentPlan.ACTIVE_to_PAID_OFF
          - entities.Account.fields.total_eip_outstanding_cents
          - entities.AddOn.fields.status
        distinguishing_aspect: |
          Depth-3 chain originating from POST /lines/{id}/cancel: cancel mutates the Line -> the Line's
          ACTIVE InstallmentPlan transitions to PAID_OFF (link 2, caused by the cancel cascade) -> the EIP
          payoff mutates Account.total_eip_outstanding_cents to 0 (link 3, caused by the EIP transition).
        test_recipe:
          setup:
            - "ACTIVE line with one ACTIVE EIP (remaining 90000) and one ACTIVE add-on; clock 2026-06-18, 30-day cycle."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "G", holder_email: "g@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /billing-cycles"
              payload: { account_id: "${acc_id}", cycle_start: "2026-06-01T00:00:00Z", cycle_end: "2026-07-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /plans"
              payload: { code: "P-G", name: "Plus", monthly_fee_cents: 7000, included_data_mb: 20480, overage_tier1_cap_mb: 5120, overage_tier1_rate_milli_cents: 1000, overage_tier2_rate_milli_cents: 500 }
              as: CarrierAgent
              captures: { plan_id: $.data.id }
            - call: "POST /devices"
              payload: { model: "Phone Y", sku: "PY-1", retail_price_cents: 99900, stock_count: 5 }
              as: CarrierAgent
              captures: { dev_id: $.data.id }
            - call: "POST /lines"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}", sim_type: "PHYSICAL", expected_account_version: "${acc_v}" }
              as: CarrierAgent
              captures: { line_id: $.data.id }
            - call: "POST /sim-assignments"
              payload: { line_id: "${line_id}", sim_type: "PHYSICAL", iccid: "8901000000000000040" }
              as: CarrierAgent
            - call: "POST /lines/${line_id}/activate"
              payload: {}
              as: CarrierAgent
            - call: "POST /installment-plans"
              payload: { line_id: "${line_id}", device_id: "${dev_id}", term_months: 24, down_payment_cents: 9900 }
              as: CarrierAgent
              captures: { eip_id: $.data.id }
            - call: "POST /addons"
              payload: { line_id: "${line_id}", addon_type: "INTL_MONTHLY", monthly_fee_cents: 3000, window_start: "2026-06-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z" }
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { addon_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: BillingSystem
          trigger:
            - call: "POST /lines/${line_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acc_id}"
          assert:
            - "Line.${line_id}.status == CANCELLED (link 1)"
            - "InstallmentPlan.${eip_id}.status == PAID_OFF and remaining_balance_cents == 0 (link 2, caused by link 1)"
            - "Account.${acc_id}.total_eip_outstanding_cents == 0 (link 3, caused by link 2)"
            - "AddOn.${addon_id}.status == CANCELLED (fan-out from cancel, not part of the depth-3 chain)"

      - name: portout_complete_depth2_cascade_line_then_account
        grounds:
          - state_machines.PortRequest.VALIDATED_to_COMPLETED
          - state_machines.Line.ACTIVE_to_CANCELLED
          - calculations.group_discount
          - entities.Account.fields.group_discount_pct
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /port-requests/{id}/complete on a PORT_OUT): completing
          the port cancels the Line (link 1) which recomputes Account.group_discount_pct (link 2, caused by the
          line dropping out of the active set) — a distinct propagation origin from the cancel chain above.
        test_recipe:
          setup:
            - "Account with 2 ACTIVE lines (group_discount_pct=0.05). A VALIDATED PORT_OUT exists on line 2."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "H", holder_email: "h@x.com", billing_day_of_month: 1 }
              as: CarrierAgent
