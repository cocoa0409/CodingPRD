            - "the second verify returns HTTP 422 with ${err_g} == ERR_QUALIFICATION_SCORE_BELOW_THRESHOLD"
            - "QualificationRequest.${req_g_id}.status is still UNDER_REVIEW and Subscriber.${sub_g_id}.qualification_status is still PENDING_QUALIFICATION"

      - name: undeliverable_pct_exactly_at_restrict_boundary
        grounds:
          - calculations.publication_copies_ledger
          - calculations.publication_audit_posture
          - entities.Publication.fields.undeliverable_restrict_pct
          - entities.HygieneRun.fields.posture_after
        distinguishing_aspect: |
          A different metric (undeliverable_pct, a 2-decimal round_half_up ratio) on a different
          endpoint (POST /circulation/hygiene-runs, with the relaxation observed on POST
          /circulation/subscribers): 50 removed copies out of 1000 is exactly 5.00 and MUST restrict,
          while widening the file to 1010 copies makes the same 50 copies 4.95 and MUST relax the
          posture back to OPEN.
        test_recipe:
          setup:
            - "publication with undeliverable_restrict_pct 5.00 and no qualification rules (no recipient is qualified in this instance)"
            - "recipient SD with 950 PAID copies and recipient SE with 50 CONTROLLED copies, both UNQUALIFIED and DELIVERABLE"
            - "two undeliverable events recorded against SE"
            - "clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Hygiene Boundary Weekly", frequency: "WEEKLY", industry_code: "UTILITIES", undeliverable_restrict_pct: 5.00 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pub_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Sierra Grid", contact_email: "sd@sierra.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "APPROVES", subscription_class: "PAID", copies: 950, paid_amount_cents: 19000 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_d_id: $.data.id }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Estuary Power", contact_email: "se@estuary.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "SPECIFIES", subscription_class: "CONTROLLED", copies: 50 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_e_id: $.data.id }
            - call: "POST /circulation/subscribers/${sub_e_id}/undeliverable-events"
              payload: { reason_code: "ADDRESS_INVALID" }
              as: CirculationManager
              as_user_id: "mgr-01"
            - call: "POST /circulation/subscribers/${sub_e_id}/undeliverable-events"
              payload: { reason_code: "REFUSED" }
              as: CirculationManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /circulation/hygiene-runs"
              payload: { publication_id: "${pub_id}", run_type: "UNDELIVERABLE_SWEEP", undeliverable_threshold: 2 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { run_id: $.data.id, posture_before: $.data.posture_before, posture_after: $.data.posture_after, removed: $.data.removed_count, requal: $.data.requalification_required_count }
            - call: "POST /circulation/subscribers"
              payload: { publication_id: "${pub_id}", company_name: "Hotel Metals", contact_email: "sh@hotel.test", job_function_code: "PLANT_MGMT", industry_code: "UTILITIES", purchasing_authority_level: "SPECIFIES", subscription_class: "CONTROLLED", copies: 10 }
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { sub_i_id: $.data.id }
            - call: "GET /circulation/publications/${pub_id}"
              as: CirculationManager
              as_user_id: "mgr-01"
              captures: { pct_after_widening: $.data.undeliverable_pct, posture_after_widening: $.data.audit_posture }
          assert:
            - "${removed} == 1 and ${requal} == 0 — SE was UNQUALIFIED, so the qualification dimension had nothing to move"
            - "${posture_before} == OPEN and ${posture_after} == RESTRICTED"
            - "immediately after the sweep Publication.${pub_id}.removed_copies == 50, copies_on_file_total == 1000 and undeliverable_pct == 5.00 (exactly at the threshold, which restricts)"
            - "${pct_after_widening} == 4.95 (round_half_up(50 * 100 / 1010, 2)) and ${posture_after_widening} == OPEN"
            - "Publication.${pub_id}.copies_on_file_total == 1010 and controlled_copies_on_file == 60 after the widening"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: certify_blocked_by_frozen_publication_then_restatement_exemption
        grounds:
          - validations[priority=41]
          - calculations.publication_audit_posture
          - state_machines.CirculationStatement.RESTATEMENT_REQUIRED_to_SUPERSEDED
          - entities.Publication.fields.audit_posture
          - entities.CirculationStatement.fields.restates_statement_id
        distinguishing_aspect: |
          Entity pair CirculationStatement -> Publication: whether a DRAFT statement may be certified
          depends on no field of its own but on the PARENT publication's audit_posture, and the
          dependency has a narrow exemption — the same FROZEN posture that rejects an unrelated
          statement admits the statement that restates the offending one, which then unfreezes the
          publication and reactivates its suspended contracts.
        test_recipe:
          setup:
            - "publication with materiality_pct 2.00, all three qualification rules and one qualified PAID recipient holding 1200 copies"
            - "an ACTIVE advertiser contract on the publication"
            - "statement ST1 for [2026-07-01, 2026-09-01) filed at clock 2026-10-01 with declared_total_copies 1200, audited against verified_qualified_copies 900, so the report drove it to RESTATEMENT_REQUIRED, audit_posture FROZEN and the contract to SUSPENDED_PENDING_RESTATEMENT"
            - "clock moved to 2026-11-01 and an unrelated DRAFT statement ST_NEW created for [2026-09-01, 2026-10-01)"
          setup_api_calls:
            - call: "POST /circulation/publications"
              payload: { name: "Heavy Industry Journal", frequency: "MONTHLY", industry_code: "MANUFACTURING", materiality_pct: 2.00 }
              as: CirculationManager
