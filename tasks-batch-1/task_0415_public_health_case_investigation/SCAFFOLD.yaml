# =============================================================================
# Public Health Case Investigation & Contact Tracing — seed tables (EXPERT)
# =============================================================================

scenario: |
  415. Public Health Case Investigation & Contact Tracing: reportable-condition
  intake (electronic lab reporting), case interview & exposure window, contact
  elicitation & notification, quarantine/isolation monitoring, lab-result
  linkage, outbreak cluster, jurisdiction transfer, state/NEDSS reporting.

domain_name: public-health-case-investigation
api_prefix: /surveillance

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - temporal_windowing
    - multi_tenancy_isolation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # All entities are peer collections directly under /surveillance with FK
  # references in the body. A SurveillanceProgram groups the rest; Jurisdiction
  # and ReportableCondition are configuration; Case / LabResult / Contact /
  # ExposureEvent / MonitoringPeriod / JurisdictionTransfer / OutbreakCluster /
  # NedssExport are flat resources with cross-aggregate FKs.

  state_machine_shape: branching
  # Case: branching fork-join with revert (interview branch + lab-linkage branch
  #   converge before CONFIRMED; classify forks CONFIRMED/PROBABLE/NOT_A_CASE
  #   with divergent side-effect sets; CLOSED->REOPENED->interview cyclic loop).
  # Contact: branching with revert (record-notification forks SUCCESS/FAILED;
  #   FAILED loops back to NOTIFICATION_PENDING).
  # MonitoringPeriod: lifecycle with compensation (RELEASED_EARLY).
  # JurisdictionTransfer: accept/reject branch with cross-entity case rehome.

  relationship_patterns:
    - one_to_many        # Program -> Jurisdiction; Case -> Contact; Case -> LabResult
    - many_to_many       # LabResult <-> Case linkage; Contact may become an index Case
    - cross_aggregate    # Contact references both its source Case and its monitoring Jurisdiction
    - self_referential   # A Contact promoted to a Case yields Case.source_contact_id -> Contact whose source_case_id is the origin Case

  role_model: peer_roles
  # IntakeProcessor (ELR intake), CaseInvestigator (interview/exposure/lab-link),
  # ContactTracer (elicitation/notification/monitoring), EpiAnalyst (clusters,
  # transfers, NEDSS export), JurisdictionAdmin (program/jurisdiction/condition
  # config). Jurisdiction scoping overlays the operational roles.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: SurveillanceProgram
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Program name (e.g. state public-health surveillance system)" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }
      - { name: current_date, type: datetime, source: system, default: "2026-01-01T00:00:00.000Z", description: "Deterministic surveillance clock (UTC date-time); advanced only via the clock endpoint. All temporal window math reads this." }

  - name: Jurisdiction
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: name, type: string, source: input, description: "Jurisdiction name (e.g. county health department)" }
      - { name: fips_code, type: string, source: input, description: "5-digit county FIPS code; unique within program (uniqueness over Jurisdiction rows whose program_id matches)" }
      - { name: active_monitoring_count, type: integer, source: computed, default: 0, description: "Count of Contacts currently in MONITORING_ACTIVE whose monitoring_jurisdiction_id == this Jurisdiction.id; conserved quantity for compensating-invariant 9b" }

  - name: ReportableCondition
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: condition_code, type: string, source: input, description: "Condition code (e.g. COVID19, MEASLES); unique within program (uniqueness over rows whose program_id matches)" }
      - { name: display_name, type: string, source: input, description: "Human-readable condition name" }
      - { name: presymptomatic_days, type: integer, source: input, description: "Days BEFORE onset/specimen that the infectious period opens (non-negative)" }
      - { name: infectious_tail_days, type: integer, source: input, description: "Days AFTER onset/specimen that the infectious period closes (non-negative)" }
      - { name: quarantine_days, type: integer, source: input, description: "Standard quarantine length in days from last exposure (non-negative)" }
      - { name: test_based_release_days, type: integer, source: input, description: "Reduced quarantine length when a qualifying negative test exists (non-negative; <= quarantine_days)" }
      - { name: test_release_earliest_offset_days, type: integer, source: input, default: 5, description: "Earliest day after last_exposure_date at which a negative specimen qualifies for test-based release" }
      - { name: isolation_min_days, type: integer, source: input, description: "Minimum isolation length in days from symptom onset / specimen (non-negative)" }
      - { name: fever_free_days, type: integer, source: input, description: "Days of resolution required after last symptomatic date before isolation may end (non-negative)" }
      - { name: cluster_min_cases, type: integer, source: input, default: 3, description: "Minimum CONFIRMED cases sharing condition+location+window to auto-form an OutbreakCluster (>= 2)" }
      - { name: cluster_window_days, type: integer, source: input, default: 14, description: "Max gap in days between case onset dates for cluster co-membership" }
      - { name: requires_lab_confirmation, type: boolean, source: input, default: true, description: "If true, classification to CONFIRMED requires at least one POSITIVE linked LabResult" }

  - name: Case
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; owning jurisdiction, drives RBAC scoping" }
      - { name: condition_code, type: string, source: input, description: "Reportable condition code; must match a ReportableCondition in the program" }
      - { name: patient_reference, type: string, source: input, description: "De-identified patient reference token" }
      - { name: source_lab_result_id, type: string, source: input, required: false, description: "FK -> LabResult.id; the ELR result that spawned this case (null for manually opened cases)" }
      - { name: source_contact_id, type: string, source: input, required: false, description: "FK -> Contact.id; set when this case was promoted from a Contact (self-referential lineage via that Contact's source_case_id)" }
      - { name: symptom_onset_date, type: datetime, source: input, required: false, description: "Date symptoms began (UTC midnight); null for asymptomatic" }
      - { name: specimen_collection_date, type: datetime, source: input, required: false, description: "Earliest positive specimen collection date; used for infectious window when asymptomatic" }
      - { name: last_symptomatic_date, type: datetime, source: input, required: false, description: "Last date the patient was symptomatic/febrile; drives isolation extension" }
      - { name: is_symptomatic, type: boolean, source: input, default: true, description: "Whether the patient ever had symptoms; selects symptom-based vs specimen-based windows" }
      - { name: interview_completed, type: boolean, source: computed, default: false, description: "True once the interview transition has run" }
      - { name: infectious_start_date, type: datetime, source: computed, required: false, description: "Computed infectious-period open date (calc: infectious_period_window)" }
      - { name: infectious_end_date, type: datetime, source: computed, required: false, description: "Computed infectious-period close date (calc: infectious_period_window)" }
      - { name: isolation_end_date, type: datetime, source: computed, required: false, description: "Computed isolation end date (calc: isolation_end_date)" }
      - { name: completeness_score, type: integer, source: computed, default: 0, description: "Investigation completeness 0..100 (calc: case_completeness_score)" }
      - { name: contact_count, type: integer, source: computed, default: 0, description: "Count of non-VOIDED Contacts whose source_case_id == this Case.id; conserved quantity for invariant 9a" }
      - { name: linked_positive_count, type: integer, source: computed, default: 0, description: "Count of LINKED LabResults linked to this case with result_value == POSITIVE" }
      - { name: cluster_id, type: string, source: computed, required: false, description: "FK -> OutbreakCluster.id; set when this confirmed case joins/forms a cluster" }
      - { name: exposure_setting_location_id, type: string, source: input, required: false, description: "Free-text location key (e.g. facility/event id) used for outbreak clustering co-location" }
      - { name: classification, type: enum, source: computed, default: SUSPECT, description: "SUSPECT | PROBABLE | CONFIRMED | NOT_A_CASE; set by classify transition" }
      - { name: status, type: enum, source: system, description: "OPEN -> UNDER_INVESTIGATION -> CLASSIFIED -> CLOSED ; REOPENED loop; TRANSFER_PENDING during transfer (constraints: OPEN, UNDER_INVESTIGATION, CLASSIFIED, CLOSED, REOPENED, TRANSFER_PENDING)" }

  - name: LabResult
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; reporting jurisdiction derived from facility" }
      - { name: condition_code, type: string, source: input, description: "Reportable condition code under test" }
      - { name: patient_reference, type: string, source: input, description: "De-identified patient reference token (used for auto-linkage to a Case)" }
      - { name: result_value, type: enum, source: input, description: "POSITIVE | NEGATIVE | INDETERMINATE" }
      - { name: specimen_collection_date, type: datetime, source: input, description: "Specimen collection date (UTC midnight)" }
      - { name: linked_case_id, type: string, source: computed, required: false, description: "FK -> Case.id; case this result is linked to (null until linked)" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> LINKED ; UNLINKED (no matching case) ; SUPERSEDED (replaced by a corrected result) (constraints: RECEIVED, LINKED, UNLINKED, SUPERSEDED)" }

  - name: Contact
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: source_case_id, type: string, source: input, description: "FK -> Case.id; the index case that elicited this contact" }
      - { name: monitoring_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction responsible for monitoring this contact" }
      - { name: contact_reference, type: string, source: input, description: "De-identified contact person reference token" }
      - { name: exposure_setting, type: enum, source: input, description: "HOUSEHOLD | HEALTHCARE | WORKPLACE | SOCIAL | COMMUNITY" }
      - { name: proximity_meters, type: number, source: input, description: "Closest physical distance during exposure, in meters (>= 0)" }
      - { name: cumulative_exposure_minutes, type: integer, source: input, description: "Total minutes of exposure (>= 0)" }
      - { name: is_high_risk_contact, type: boolean, source: input, default: false, description: "Vulnerability flag (immunocompromised, elderly, etc.)" }
      - { name: last_exposure_date, type: datetime, source: input, description: "Most recent exposure date to the index case (UTC midnight); drives quarantine math" }
      - { name: priority_score, type: integer, source: computed, default: 0, description: "Contact prioritization 0..100 (calc: contact_priority_score)" }
      - { name: priority_band, type: enum, source: computed, default: LOW, description: "HIGH | MEDIUM | LOW derived from priority_score thresholds" }
      - { name: quarantine_release_basis, type: enum, source: computed, default: STANDARD, description: "STANDARD | TEST_BASED; which variant produced quarantine_end_date" }
      - { name: quarantine_end_date, type: datetime, source: computed, required: false, description: "Computed quarantine end (calc: quarantine_end_date)" }
      - { name: has_qualifying_negative_test, type: boolean, source: computed, default: false, description: "True once a NEGATIVE qualifying test at/after the earliest offset has been recorded" }
      - { name: notification_attempts, type: integer, source: computed, default: 0, description: "Number of notification attempts made" }
      - { name: promoted_case_id, type: string, source: computed, required: false, description: "FK -> Case.id; the Case created when this contact became symptomatic and was promoted" }
      - { name: status, type: enum, source: system, description: "ELICITED -> NOTIFICATION_PENDING -> NOTIFIED -> MONITORING_ACTIVE -> MONITORING_COMPLETE ; NOTIFICATION_FAILED loop ; PROMOTED_TO_CASE ; VOIDED (constraints: ELICITED, NOTIFICATION_PENDING, NOTIFIED, NOTIFICATION_FAILED, MONITORING_ACTIVE, MONITORING_COMPLETE, PROMOTED_TO_CASE, VOIDED)" }

  - name: ExposureEvent
    parent: SurveillanceProgram
    common_fields: false   # append-only event log: id + created_at only
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: contact_id, type: string, source: input, description: "FK -> Contact.id; the contact this encounter belongs to" }
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; index case (copied from the contact's source_case_id at creation)" }
      - { name: encounter_date, type: datetime, source: input, description: "Date of the encounter between contact and index case (UTC midnight); must fall inside the case infectious window" }
      - { name: setting_note, type: string, source: input, required: false, description: "Free-text note describing the encounter" }

  - name: MonitoringPeriod
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: contact_id, type: string, source: input, description: "FK -> Contact.id; subject of monitoring" }
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; monitoring jurisdiction copied from the contact when the period opened" }
      - { name: monitoring_type, type: enum, source: input, description: "QUARANTINE (exposed contact) | ISOLATION (confirmed case contact promoted)" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive monitoring start date (UTC midnight)" }
      - { name: end_date, type: datetime, source: input, description: "Inclusive monitoring end date (UTC midnight); must be >= start_date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> ACTIVE -> COMPLETED ; RELEASED_EARLY (compensation) (constraints: SCHEDULED, ACTIVE, COMPLETED, RELEASED_EARLY)" }

  - name: JurisdictionTransfer
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case being transferred" }
      - { name: from_jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; copied from case.jurisdiction_id at request time" }
      - { name: to_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; receiving jurisdiction" }
      - { name: expected_case_version, type: integer, source: input, description: "OCC: case.version the requester last observed (transfer create is the OCC write)" }
      - { name: reason, type: string, source: input, required: false, description: "Free-text transfer justification" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ACCEPTED ; REJECTED (constraints: REQUESTED, ACCEPTED, REJECTED)" }

  - name: OutbreakCluster
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: condition_code, type: string, source: system, description: "Condition shared by member cases" }
      - { name: exposure_setting_location_id, type: string, source: system, description: "Shared co-location key" }
      - { name: anchor_case_id, type: string, source: system, description: "FK -> Case.id; earliest-onset member that anchored the cluster (tie-break created_at ASC)" }
      - { name: member_case_count, type: integer, source: computed, default: 0, description: "Count of Cases whose cluster_id == this cluster (conserved quantity for invariant 9c)" }
      - { name: earliest_onset_date, type: datetime, source: computed, description: "Minimum symptom_onset_date over member cases" }
      - { name: latest_onset_date, type: datetime, source: computed, description: "Maximum symptom_onset_date over member cases" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> CLOSED (constraints: ACTIVE, CLOSED)" }

  - name: NedssExport
    parent: SurveillanceProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SurveillanceProgram.id" }
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case being exported to the state/NEDSS feed" }
      - { name: snapshot_classification, type: enum, source: system, description: "Classification captured at export time (CONFIRMED | PROBABLE)" }
      - { name: snapshot_completeness_score, type: integer, source: system, description: "completeness_score captured at export time" }
      - { name: nedss_message_id, type: string, source: system, description: "Server-minted NEDSS message identifier" }
      - { name: status, type: enum, source: system, description: "GENERATED -> TRANSMITTED ; VOIDED (constraints: GENERATED, TRANSMITTED, VOIDED)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /surveillance/cases/{caseId}/interview"
        actor: CaseInvestigator
        preconditions:
          - "Case must be in OPEN or REOPENED (ERR_CASE_NOT_INTERVIEWABLE)"
          - "Actor jurisdiction scope must include case.jurisdiction_id (ERR_JURISDICTION_SCOPE_VIOLATION)"
          - "If resulting is_symptomatic true, symptom_onset_date must be present; else specimen_collection_date must be present (ERR_ONSET_OR_SPECIMEN_REQUIRED)"
        side_effects:
          - "interview_completed = true"
          - "compute infectious_start_date and infectious_end_date (calc: infectious_period_window)"
          - "recompute completeness_score (calc: case_completeness_score)"
        note: "Establishes the exposure/infectious window that gates ExposureEvent creation."

      - from: REOPENED
        to: UNDER_INVESTIGATION
        trigger: "POST /surveillance/cases/{caseId}/interview"
        actor: CaseInvestigator
        preconditions:
          - "Case must be in OPEN or REOPENED (ERR_CASE_NOT_INTERVIEWABLE)"
          - "Actor jurisdiction scope must include case.jurisdiction_id (ERR_JURISDICTION_SCOPE_VIOLATION)"
          - "If resulting is_symptomatic true, symptom_onset_date must be present; else specimen_collection_date must be present (ERR_ONSET_OR_SPECIMEN_REQUIRED)"
        side_effects:
          - "interview_completed = true"
          - "recompute infectious_start_date and infectious_end_date (calc: infectious_period_window)"
          - "recompute completeness_score"
        note: "Cyclic re-entry from the REOPENED revert loop."

      - from: UNDER_INVESTIGATION
        to: CLASSIFIED
        trigger: "POST /surveillance/cases/{caseId}/classify"
        actor: CaseInvestigator
        preconditions:
          - "Case must be in UNDER_INVESTIGATION (ERR_CASE_NOT_CLASSIFIABLE)"
          - "interview_completed must be true (ERR_INTERVIEW_NOT_COMPLETE)"
          - "Requested classification must be one of CONFIRMED | PROBABLE | NOT_A_CASE (ERR_INVALID_CLASSIFICATION)"
          - "If requested classification is CONFIRMED and condition.requires_lab_confirmation true, linked_positive_count must be >= 1 (ERR_LAB_CONFIRMATION_REQUIRED)"
        side_effects:
          - "classification = requested value"
          - "If CONFIRMED: compute isolation_end_date (calc: isolation_end_date)"
          - "If CONFIRMED and exposure_setting_location_id present: run outbreak cluster evaluation (calc: outbreak_cluster_membership) — may set cluster_id, increment OutbreakCluster.member_case_count, or create a new OutbreakCluster"
          - "If NOT_A_CASE: cascade — every non-VOIDED Contact whose source_case_id == this case is VOIDED; each such contact in MONITORING_ACTIVE first releases its ACTIVE MonitoringPeriod -> RELEASED_EARLY and decrements its monitoring_jurisdiction.active_monitoring_count by 1, then case.contact_count is decremented (depth-3 cascade: classify -> contact void -> monitoring release + jurisdiction-count decrement)"
          - "recompute completeness_score (calc: case_completeness_score)"
        note: "Branching fork: CONFIRMED, PROBABLE, NOT_A_CASE carry divergent side-effect sets."

      - from: CLASSIFIED
        to: CLOSED
        trigger: "POST /surveillance/cases/{caseId}/close"
        actor: CaseInvestigator
        preconditions:
          - "Case must be in CLASSIFIED (ERR_CASE_NOT_CLOSEABLE)"
          - "No Contact whose source_case_id == this case is in MONITORING_ACTIVE (ERR_ACTIVE_MONITORING_EXISTS)"
          - "No JurisdictionTransfer for this case in REQUESTED (ERR_TRANSFER_PENDING_EXISTS)"
        side_effects: []

      - from: CLOSED
        to: REOPENED
        trigger: "POST /surveillance/cases/{caseId}/reopen"
        actor: CaseInvestigator
        preconditions:
          - "Case must be in CLOSED (ERR_CASE_NOT_REOPENABLE)"
        side_effects:
          - "classification reset to SUSPECT"
          - "interview_completed = false"
          - "infectious_start_date, infectious_end_date, isolation_end_date cleared"
          - "recompute completeness_score (calc: case_completeness_score)"
        note: "Cyclic revert loop: REOPENED re-enters the interview transition."

      - from: UNDER_INVESTIGATION
        to: TRANSFER_PENDING
        trigger: "POST /surveillance/jurisdiction-transfers (case in UNDER_INVESTIGATION or CLASSIFIED)"
        actor: EpiAnalyst
        preconditions:
          - "Case must be in UNDER_INVESTIGATION or CLASSIFIED (ERR_CASE_NOT_TRANSFERABLE)"
          - "expected_case_version must equal case.version (ERR_STALE_CASE_VERSION, 412 — checked before state)"
          - "to_jurisdiction_id must differ from case.jurisdiction_id (ERR_SAME_JURISDICTION_TRANSFER)"
          - "No other JurisdictionTransfer for this case in REQUESTED (ERR_TRANSFER_PENDING_EXISTS)"
        side_effects:
          - "create JurisdictionTransfer (status REQUESTED, from_jurisdiction_id = case.jurisdiction_id)"
          - "case.status = TRANSFER_PENDING; remember prior status (UNDER_INVESTIGATION) to restore on resolve"
          - "increments Case.version by 1"

      - from: CLASSIFIED
        to: TRANSFER_PENDING
        trigger: "POST /surveillance/jurisdiction-transfers (case in UNDER_INVESTIGATION or CLASSIFIED)"
        actor: EpiAnalyst
        preconditions:
          - "Case must be in UNDER_INVESTIGATION or CLASSIFIED (ERR_CASE_NOT_TRANSFERABLE)"
          - "expected_case_version must equal case.version (ERR_STALE_CASE_VERSION, 412 — checked before state)"
          - "to_jurisdiction_id must differ from case.jurisdiction_id (ERR_SAME_JURISDICTION_TRANSFER)"
          - "No other JurisdictionTransfer for this case in REQUESTED (ERR_TRANSFER_PENDING_EXISTS)"
        side_effects:
          - "create JurisdictionTransfer (status REQUESTED, from_jurisdiction_id = case.jurisdiction_id)"
          - "case.status = TRANSFER_PENDING; remember prior status (CLASSIFIED) to restore on resolve"
          - "increments Case.version by 1"

      - from: TRANSFER_PENDING
        to: UNDER_INVESTIGATION
        trigger: "system (PUT /surveillance/jurisdiction-transfers/{transferId} resolves; prior status was UNDER_INVESTIGATION)"
        actor: EpiAnalyst
        preconditions:
          - "Transfer must be in REQUESTED (ERR_TRANSFER_NOT_RESOLVABLE)"
        side_effects:
          - "On ACCEPTED: case.jurisdiction_id = transfer.to_jurisdiction_id (cascade depth-3: transfer accept -> case rehome -> each non-VOIDED Contact whose source_case_id==case and monitoring_jurisdiction_id==old jurisdiction is reassigned to to_jurisdiction_id, moving any MONITORING_ACTIVE count from old to new jurisdiction's active_monitoring_count)"
          - "On REJECTED: no rehome"
          - "case.status restored to UNDER_INVESTIGATION"

      - from: TRANSFER_PENDING
        to: CLASSIFIED
        trigger: "system (PUT /surveillance/jurisdiction-transfers/{transferId} resolves; prior status was CLASSIFIED)"
        actor: EpiAnalyst
        preconditions:
          - "Transfer must be in REQUESTED (ERR_TRANSFER_NOT_RESOLVABLE)"
        side_effects:
          - "On ACCEPTED: case.jurisdiction_id = transfer.to_jurisdiction_id (cascade depth-3 as above)"
          - "On REJECTED: no rehome"
          - "case.status restored to CLASSIFIED"

  - entity: Contact
    initial_state: ELICITED
    terminal_states: [MONITORING_COMPLETE, PROMOTED_TO_CASE, VOIDED]
    transitions:
      - from: ELICITED
        to: NOTIFICATION_PENDING
        trigger: "POST /surveillance/contacts/{contactId}/queue-notification"
        actor: ContactTracer
        preconditions:
          - "Contact must be in ELICITED or NOTIFICATION_FAILED (ERR_CONTACT_NOT_QUEUEABLE)"
          - "Actor jurisdiction scope must include contact.monitoring_jurisdiction_id (ERR_JURISDICTION_SCOPE_VIOLATION)"
        side_effects: []

      - from: NOTIFICATION_FAILED
        to: NOTIFICATION_PENDING
        trigger: "POST /surveillance/contacts/{contactId}/queue-notification"
        actor: ContactTracer
        preconditions:
          - "Contact must be in ELICITED or NOTIFICATION_FAILED (ERR_CONTACT_NOT_QUEUEABLE)"
        side_effects: []
        note: "Revert/retry loop after a failed notification."

      - from: NOTIFICATION_PENDING
        to: NOTIFIED
        trigger: "POST /surveillance/contacts/{contactId}/record-notification (outcome=SUCCESS)"
        actor: ContactTracer
        preconditions:
          - "Contact must be in NOTIFICATION_PENDING (ERR_CONTACT_NOT_PENDING_NOTIFICATION)"
        side_effects:
          - "notification_attempts += 1"

      - from: NOTIFICATION_PENDING
        to: NOTIFICATION_FAILED
        trigger: "POST /surveillance/contacts/{contactId}/record-notification (outcome=FAILED)"
        actor: ContactTracer
        preconditions:
          - "Contact must be in NOTIFICATION_PENDING (ERR_CONTACT_NOT_PENDING_NOTIFICATION)"
        side_effects:
          - "notification_attempts += 1"
        note: "Branching fork on outcome; FAILED loops back via queue-notification."

      - from: NOTIFIED
        to: MONITORING_ACTIVE
        trigger: "POST /surveillance/contacts/{contactId}/start-monitoring"
        actor: ContactTracer
        preconditions:
          - "Contact must be in NOTIFIED (ERR_CONTACT_NOT_NOTIFIED)"
          - "quarantine_end_date must be present (set at elicitation) (ERR_QUARANTINE_WINDOW_MISSING)"
          - "A MonitoringPeriod for this contact in SCHEDULED must exist (ERR_NO_SCHEDULED_MONITORING)"
        side_effects:
          - "the SCHEDULED MonitoringPeriod (SCHEDULED -> ACTIVE)"
          - "increment monitoring_jurisdiction.active_monitoring_count by 1 (invariant 9b forward action)"

      - from: MONITORING_ACTIVE
        to: MONITORING_COMPLETE
        trigger: "POST /surveillance/contacts/{contactId}/complete-monitoring"
        actor: ContactTracer
        preconditions:
          - "Contact must be in MONITORING_ACTIVE (ERR_CONTACT_NOT_MONITORING)"
          - "program.current_date must be >= contact.quarantine_end_date (ERR_MONITORING_NOT_ELAPSED)"
        side_effects:
          - "the ACTIVE MonitoringPeriod (ACTIVE -> COMPLETED)"
          - "decrement monitoring_jurisdiction.active_monitoring_count by 1 (invariant 9b compensating action)"

      - from: MONITORING_ACTIVE
        to: PROMOTED_TO_CASE
        trigger: "POST /surveillance/contacts/{contactId}/promote"
        actor: ContactTracer
        preconditions:
          - "Contact must be in MONITORING_ACTIVE or NOTIFIED (ERR_CONTACT_NOT_PROMOTABLE)"
          - "symptom_onset_date must be supplied in request (ERR_ONSET_OR_SPECIMEN_REQUIRED)"
        side_effects:
          - "create new Case (status OPEN, classification SUSPECT, source_contact_id = this contact, jurisdiction_id = contact.monitoring_jurisdiction_id, condition_code copied from source case)"
          - "promoted_case_id set to the new case id"
          - "if contact was MONITORING_ACTIVE: ACTIVE MonitoringPeriod -> RELEASED_EARLY; decrement monitoring_jurisdiction.active_monitoring_count by 1 (invariant 9b compensating action)"
        note: "Self-referential lineage: new Case.source_contact_id -> Contact whose source_case_id is the origin case."

      - from: NOTIFIED
        to: PROMOTED_TO_CASE
        trigger: "POST /surveillance/contacts/{contactId}/promote"
        actor: ContactTracer
        preconditions:
          - "Contact must be in MONITORING_ACTIVE or NOTIFIED (ERR_CONTACT_NOT_PROMOTABLE)"
          - "symptom_onset_date must be supplied in request (ERR_ONSET_OR_SPECIMEN_REQUIRED)"
        side_effects:
          - "create new Case (status OPEN, classification SUSPECT, source_contact_id = this contact, jurisdiction_id = contact.monitoring_jurisdiction_id, condition_code copied from source case)"
          - "promoted_case_id set to the new case id"
        note: "Promotion from NOTIFIED does not touch monitoring counts (no ACTIVE period)."

      - from: ELICITED
        to: VOIDED
        trigger: "POST /surveillance/contacts/{contactId}/void OR cascade from Case NOT_A_CASE classify"
        actor: ContactTracer
        preconditions:
          - "Contact must be in ELICITED, NOTIFICATION_PENDING, NOTIFIED, NOTIFICATION_FAILED, or MONITORING_ACTIVE (ERR_CONTACT_NOT_VOIDABLE)"
        side_effects:
          - "decrement source_case.contact_count by 1 (invariant 9a compensating action)"
          - "recompute source_case.completeness_score"

      - from: MONITORING_ACTIVE
        to: VOIDED
        trigger: "POST /surveillance/contacts/{contactId}/void OR cascade from Case NOT_A_CASE classify"
        actor: ContactTracer
        preconditions:
          - "Contact must be in ELICITED, NOTIFICATION_PENDING, NOTIFIED, NOTIFICATION_FAILED, or MONITORING_ACTIVE (ERR_CONTACT_NOT_VOIDABLE)"
        side_effects:
          - "ACTIVE MonitoringPeriod -> RELEASED_EARLY; decrement monitoring_jurisdiction.active_monitoring_count by 1"
          - "decrement source_case.contact_count by 1 (invariant 9a compensating action)"
          - "recompute source_case.completeness_score"

  - entity: LabResult
    initial_state: RECEIVED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: LINKED
        trigger: "POST /surveillance/cases/{caseId}/link-lab-result"
        actor: CaseInvestigator
        preconditions:
          - "LabResult must be in RECEIVED or UNLINKED (ERR_LAB_NOT_LINKABLE)"
          - "Case must not be CLOSED (ERR_CASE_NOT_LINKABLE)"
          - "LabResult.condition_code must equal case.condition_code (ERR_LAB_CONDITION_MISMATCH — checked before patient)"
          - "LabResult.patient_reference must equal case.patient_reference (ERR_LAB_PATIENT_MISMATCH)"
        side_effects:
          - "linked_case_id = case.id; status = LINKED"
          - "recompute case.linked_positive_count (count of LINKED LabResults with result_value POSITIVE)"
          - "recompute case.completeness_score"

      - from: RECEIVED
        to: UNLINKED
        trigger: "system (ELR intake finds no single matching OPEN/UNDER_INVESTIGATION case for patient_reference + condition_code)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LINKED
        to: SUPERSEDED
        trigger: "POST /surveillance/lab-results/{labResultId}/supersede"
        actor: IntakeProcessor
        preconditions:
          - "LabResult must be in LINKED (ERR_LAB_NOT_SUPERSEDABLE)"
        side_effects:
          - "status = SUPERSEDED; clear linked_case_id"
          - "recompute prior linked case.linked_positive_count and completeness_score"

  - entity: MonitoringPeriod
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED_EARLY]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (Contact start-monitoring)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (Contact complete-monitoring)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RELEASED_EARLY
        trigger: "system (Contact void / promote / Case NOT_A_CASE cascade)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Compensation path for early release."

  - entity: JurisdictionTransfer
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "PUT /surveillance/jurisdiction-transfers/{transferId} (status=ACCEPTED)"
        actor: EpiAnalyst
        preconditions:
          - "Transfer must be in REQUESTED (ERR_TRANSFER_NOT_RESOLVABLE)"
        side_effects:
          - "drives Case TRANSFER_PENDING -> prior status with jurisdiction rehome cascade (see Case state machine)"
      - from: REQUESTED
        to: REJECTED
        trigger: "PUT /surveillance/jurisdiction-transfers/{transferId} (status=REJECTED)"
        actor: EpiAnalyst
        preconditions:
          - "Transfer must be in REQUESTED (ERR_TRANSFER_NOT_RESOLVABLE)"
        side_effects:
          - "drives Case TRANSFER_PENDING -> prior status (no rehome)"

  - entity: NedssExport
    initial_state: GENERATED
    terminal_states: [TRANSMITTED, VOIDED]
    transitions:
      - from: GENERATED
        to: TRANSMITTED
        trigger: "POST /surveillance/nedss-exports/{exportId}/transmit"
        actor: EpiAnalyst
        preconditions:
          - "Export must be in GENERATED (ERR_EXPORT_NOT_TRANSMITTABLE)"
          - "Referenced case.classification must still equal snapshot_classification (ERR_EXPORT_SNAPSHOT_STALE)"
        side_effects:
          - "status = TRANSMITTED; nedss_message_id finalized"
      - from: GENERATED
        to: VOIDED
        trigger: "POST /surveillance/nedss-exports/{exportId}/void"
        actor: EpiAnalyst
        preconditions:
          - "Export must be in GENERATED (ERR_EXPORT_NOT_VOIDABLE)"
        side_effects: []

  - entity: OutbreakCluster
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /surveillance/outbreak-clusters/{clusterId}/close"
        actor: EpiAnalyst
        preconditions:
          - "Cluster must be in ACTIVE (ERR_CLUSTER_NOT_CLOSEABLE)"
        side_effects:
          - "status = CLOSED"

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: transfer-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /surveillance/jurisdiction-transfers"
    occ_field: "expected_case_version"
    description: |
      Opening a JurisdictionTransfer against a Case whose version has advanced
      since the requester last observed it is rejected. A prior transfer
      request, a classify, or a link-lab-result may have legitimately advanced
      case.version and changed the jurisdiction or status the requester is
      reasoning about; the requester's view is therefore stale and the transfer
      is refused so it cannot route a case the requester no longer understands.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: infectious_period_window
    trigger: "Case interview transition (OPEN/REOPENED -> UNDER_INVESTIGATION)"
    algorithm: interval_merge
    formula: |
      Let C = ReportableCondition matching case.condition_code in the program.
      If case.is_symptomatic == true:
        anchor = case.symptom_onset_date           # required when symptomatic
      else:
        anchor = case.specimen_collection_date     # required when asymptomatic
      infectious_start_date = anchor - C.presymptomatic_days days
      infectious_end_date   = anchor + C.infectious_tail_days days
      Both stored as UTC-midnight datetimes. The infectious window is the
      CLOSED inclusive interval [infectious_start_date, infectious_end_date]
      and is the gate for ExposureEvent.encounter_date (validation priority 8).
    input_set: "Single case + its condition config; anchor selected by is_symptomatic."
    variants:
      - name: symptom_based
        when: "case.is_symptomatic == true"
        difference: "anchor = symptom_onset_date"
      - name: specimen_based
        when: "case.is_symptomatic == false"
        difference: "anchor = specimen_collection_date; produces a different window even for the same calendar inputs because onset and specimen dates differ"
    precision: "whole days; UTC midnight"

  - name: contact_priority_score
    trigger: "Contact creation (elicitation)"
    algorithm: weighted_scoring
    formula: |
      base = { HOUSEHOLD: 50, HEALTHCARE: 40, WORKPLACE: 25, SOCIAL: 15, COMMUNITY: 10 }[exposure_setting]
      if proximity_meters < 1:                prox = 20
      elif proximity_meters <= 2:             prox = 10
      else:                                   prox = 0
      if cumulative_exposure_minutes >= 15:   dur = 15
      elif cumulative_exposure_minutes >= 5:  dur = 5
      else:                                   dur = 0
      vuln = 20 if is_high_risk_contact else 0
      raw = base + prox + dur + vuln
      priority_score = max(0, min(100, raw))     # clamp
      priority_band  = HIGH if priority_score >= 70 else (MEDIUM if priority_score >= 40 else LOW)
    input_set: "Single Contact's own exposure inputs; no cross-entity inputs."
    constants:
      HOUSEHOLD: 50
      HEALTHCARE: 40
      WORKPLACE: 25
      SOCIAL: 15
      COMMUNITY: 10
      PROX_NEAR_BONUS: 20
      PROX_MID_BONUS: 10
      DUR_HIGH_MIN: 15
      DUR_MID_MIN: 5
      VULN_BONUS: 20
      BAND_HIGH: 70
      BAND_MEDIUM: 40
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "integer; clamp to [0, 100]; band thresholds use >= (inclusive)"

  - name: quarantine_end_date
    trigger: "Contact creation (elicitation, STANDARD); recomputed when a qualifying test is recorded via POST /surveillance/contacts/{id}/qualifying-test"
    algorithm: threshold
    formula: |
      Let C = ReportableCondition for the source case's condition_code.
      standard_end  = last_exposure_date + C.quarantine_days days
      earliest_test = last_exposure_date + C.test_release_earliest_offset_days days
      A qualifying negative test exists when has_qualifying_negative_test == true,
      set when a recorded qualifying test has result_value == NEGATIVE and
      specimen_collection_date >= earliest_test.
      if has_qualifying_negative_test:
        quarantine_release_basis = TEST_BASED
        quarantine_end_date = last_exposure_date + C.test_based_release_days days
      else:
        quarantine_release_basis = STANDARD
        quarantine_end_date = standard_end
    input_set: "Single Contact + condition config + the contact's own qualifying-test record (if any)."
    variants:
      - name: standard
        when: "has_qualifying_negative_test == false"
        difference: "end = last_exposure_date + quarantine_days (longer)"
      - name: test_based
        when: "a NEGATIVE qualifying test with specimen_collection_date >= earliest_test exists"
        difference: "end = last_exposure_date + test_based_release_days (shorter); same last_exposure_date yields a different end date"
    precision: "whole days; UTC midnight"

  - name: isolation_end_date
    trigger: "Case classify to CONFIRMED"
    algorithm: threshold
    formula: |
      Let C = ReportableCondition for case.condition_code.
      if case.is_symptomatic == true:
        anchor = case.symptom_onset_date
        min_end = anchor + C.isolation_min_days days
        if case.last_symptomatic_date present:
          symptom_end = case.last_symptomatic_date + C.fever_free_days days
        else:
          symptom_end = min_end
        isolation_end_date = max(min_end, symptom_end)
      else:
        anchor = case.specimen_collection_date
        isolation_end_date = anchor + C.isolation_min_days days
    input_set: "Single confirmed case + condition config; max() of two candidate dates when symptomatic."
    precision: "whole days; UTC midnight; isolation_end_date = max of the two candidate dates (later wins)"

  - name: case_completeness_score
    trigger: "interview, classify, reopen; lab link/supersede; contact elicit/void"
    algorithm: weighted_scoring
    formula: |
      score = 0
      if interview_completed:                                            score += 40
      if infectious_start_date present AND infectious_end_date present:  score += 20
      if contact_count >= 1:                                             score += 20
      if linked_positive_count >= 1 OR (count of LINKED LabResults with linked_case_id == case.id) >= 1: score += 20
      completeness_score = score    # 0..100, integer
    input_set: "Case's own derived flags + contact_count (non-VOIDED contacts) + count of LINKED LabResults for the case."
    constants:
      W_INTERVIEW: 40
      W_WINDOW: 20
      W_CONTACTS: 20
      W_LAB: 20
    precision: "integer 0..100"

  - name: outbreak_cluster_membership
    trigger: "Case classify to CONFIRMED with exposure_setting_location_id present"
    algorithm: aggregation
    formula: |
      Let K = (case.condition_code, case.exposure_setting_location_id).
      Let C = ReportableCondition for case.condition_code.
      Candidate peers = CONFIRMED Cases (excluding this case) in the same program
        sharing K, whose symptom_onset_date is within C.cluster_window_days days
        of THIS case's symptom_onset_date (abs(day-diff) <= cluster_window_days),
        ordered by symptom_onset_date ASC, created_at ASC as tie-break.
      group = candidate peers + this case.
      if there exists an ACTIVE OutbreakCluster sharing K whose anchor case is
      within window of this case:
        join it: case.cluster_id = cluster.id; cluster.member_case_count += 1;
        recompute earliest_onset_date / latest_onset_date.
      elif size(group) >= C.cluster_min_cases:
        create OutbreakCluster (status ACTIVE);
        anchor_case_id = group member with earliest symptom_onset_date
          (tie-break created_at ASC);
        set cluster_id on every CONFIRMED member in group; member_case_count = size(group);
        earliest_onset_date = min onset; latest_onset_date = max onset.
      else:
        no cluster change (case.cluster_id stays null).
    input_set: "All CONFIRMED Cases in the program sharing condition_code + exposure_setting_location_id within the onset window."
    constants:
      CLUSTER_MIN_CASES_DEFAULT: 3
      CLUSTER_WINDOW_DAYS_DEFAULT: 14
    precision: "integer counts; onset-date proximity in whole days; deterministic ordering by symptom_onset_date ASC then created_at ASC"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "All resource IDs in the path must exist (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "FK fields in the body must reference existing rows in the same program (program_id, jurisdiction_id, condition_code, source_case_id, lab_result_id, contact_id, to_jurisdiction_id, case_id)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "POST/PUT endpoints that accept FK fields"

  - priority: 5
    category: auth
    check: "Operational scoped role (X-User-ID is a Jurisdiction.id) must have its jurisdiction cover the target resource's jurisdiction; cross-jurisdiction access denied"
    error_id: ERR_JURISDICTION_SCOPE_VIOLATION
    http_status: 403
    applies_to: "Case interview/classify/close/reopen/link-lab-result; contact lifecycle"
    note: "JurisdictionAdmin and EpiAnalyst are program-wide (unscoped); CaseInvestigator/ContactTracer/IntakeProcessor are scoped to their X-User-ID jurisdiction."

  - priority: 6
    category: business_constraint
    check: "Concurrency: expected_case_version (when the endpoint requires it) must equal case.version BEFORE any state/business check"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /surveillance/jurisdiction-transfers"
    note: "OCC check precedes state precondition checks on the case."

  - priority: 7
    category: state
    check: "Target resource must be in a state from which the requested transition is legal"
    error_id: "ERR_*_NOT_* (state-specific, e.g. ERR_CASE_NOT_CLASSIFIABLE)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_temporal
    check: "ExposureEvent.encounter_date must fall inside the index case CLOSED infectious window [infectious_start_date, infectious_end_date]"
    error_id: ERR_ENCOUNTER_OUTSIDE_INFECTIOUS_WINDOW
    http_status: 409
    applies_to: "POST /surveillance/contacts/{id}/exposure-events"

  - priority: 9
    category: business_temporal
    check: "A new MonitoringPeriod for a contact must not share any day with an existing non-terminal (SCHEDULED/ACTIVE) MonitoringPeriod for the same contact; adjacency (end_date + 1 day == next start_date) is allowed"
    error_id: ERR_MONITORING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /surveillance/contacts/{id}/monitoring-periods"

  - priority: 10
    category: business_constraint
    check: "Lab linkage: condition_code of the LabResult must match the case (checked before patient_reference)"
    error_id: ERR_LAB_CONDITION_MISMATCH
    http_status: 409
    applies_to: "POST /surveillance/cases/{id}/link-lab-result"

  - priority: 11
    category: business_constraint
    check: "Lab linkage: patient_reference of the LabResult must match the case (checked after condition_code)"
    error_id: ERR_LAB_PATIENT_MISMATCH
    http_status: 409
    applies_to: "POST /surveillance/cases/{id}/link-lab-result"

  - priority: 12
    category: business_safety
    check: "Classify to CONFIRMED requires linked_positive_count >= 1 when condition.requires_lab_confirmation is true"
    error_id: ERR_LAB_CONFIRMATION_REQUIRED
    http_status: 409
    applies_to: "POST /surveillance/cases/{id}/classify"

  - priority: 13
    category: business_constraint
    check: "Complete-monitoring requires program.current_date >= contact.quarantine_end_date"
    error_id: ERR_MONITORING_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /surveillance/contacts/{id}/complete-monitoring"

  - priority: 14
    category: business_constraint
    check: "Case close requires no MONITORING_ACTIVE contacts and no REQUESTED transfer for the case"
    error_id: ERR_ACTIVE_MONITORING_EXISTS
    http_status: 409
    applies_to: "POST /surveillance/cases/{id}/close"

  - priority: 15
    category: business_constraint
    check: "NEDSS export requires case classification CONFIRMED or PROBABLE"
    error_id: ERR_EXPORT_CASE_NOT_REPORTABLE
    http_status: 409
    applies_to: "POST /surveillance/nedss-exports"

  - priority: 16
    category: business_constraint
    check: "Uniqueness: Jurisdiction.fips_code unique within program; ReportableCondition.condition_code unique within program"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /surveillance/jurisdictions, POST /surveillance/reportable-conditions"

  - priority: 17
    category: business_constraint
    check: "Field-level input validation (enum membership, non-negative numbers, end_date >= start_date, classify value in allowed set, transfer to != from)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT endpoints with typed inputs"

# =============================================================================
# Table 5: API Endpoint Table  (flat collections under /surveillance)
# =============================================================================
endpoints:
  # --- Surveillance Programs ---
  - method: POST
    path: "/surveillance/programs"
    description: "Create a surveillance program"
    roles: [JurisdictionAdmin]
    code: 201
    input: [name, "description?"]
    output: SurveillanceProgram
    side_effects: ["current_date initialized to 2026-01-01T00:00:00.000Z"]

  - method: GET
    path: "/surveillance/programs/{programId}"
    description: "Get a surveillance program"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: SurveillanceProgram
    side_effects: []

  - method: POST
    path: "/surveillance/programs/{programId}/clock/set"
    description: "Set the deterministic surveillance clock (operational/test clock control)"
    roles: [JurisdictionAdmin]
    code: 200
    input: [to_iso8601]
    output: SurveillanceProgram
    side_effects: ["current_date = to_iso8601"]

  # --- Jurisdictions ---
  - method: POST
    path: "/surveillance/jurisdictions"
    description: "Create a jurisdiction"
    roles: [JurisdictionAdmin]
    code: 201
    input: [program_id, name, fips_code]
    output: Jurisdiction
    side_effects: ["active_monitoring_count = 0; fips_code uniqueness enforced within program"]

  - method: GET
    path: "/surveillance/jurisdictions"
    description: "List jurisdictions (filterable by program_id)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: ["program_id?"]
    output: "Jurisdiction[]"
    side_effects: []

  - method: GET
    path: "/surveillance/jurisdictions/{jurisdictionId}"
    description: "Get a jurisdiction (includes active_monitoring_count)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # --- Reportable Conditions ---
  - method: POST
    path: "/surveillance/reportable-conditions"
    description: "Define a reportable condition with window/quarantine/cluster parameters"
    roles: [JurisdictionAdmin]
    code: 201
    input: [program_id, condition_code, display_name, presymptomatic_days, infectious_tail_days, quarantine_days, test_based_release_days, "test_release_earliest_offset_days?", isolation_min_days, fever_free_days, "cluster_min_cases?", "cluster_window_days?", "requires_lab_confirmation?"]
    output: ReportableCondition
    side_effects: ["condition_code uniqueness enforced within program"]

  - method: GET
    path: "/surveillance/reportable-conditions"
    description: "List reportable conditions (filterable by program_id)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: ["program_id?"]
    output: "ReportableCondition[]"
    side_effects: []

  - method: GET
    path: "/surveillance/reportable-conditions/{conditionId}"
    description: "Get a reportable condition"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: ReportableCondition
    side_effects: []

  # --- Lab Results (ELR intake) ---
  - method: POST
    path: "/surveillance/lab-results"
    description: "Electronic lab report intake; auto-links to a single OPEN/UNDER_INVESTIGATION case with matching patient_reference + condition_code, else UNLINKED"
    roles: [IntakeProcessor]
    code: 201
    input: [program_id, jurisdiction_id, condition_code, patient_reference, result_value, specimen_collection_date]
    output: LabResult
    side_effects:
      - "status RECEIVED; auto-link attempt sets status LINKED + linked_case_id when exactly one matching non-closed case exists, recomputes that case.linked_positive_count and completeness_score; otherwise status UNLINKED"

  - method: GET
    path: "/surveillance/lab-results"
    description: "List lab results (filterable by program_id, linked_case_id, jurisdiction_id)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: ["program_id?", "linked_case_id?", "jurisdiction_id?"]
    output: "LabResult[]"
    side_effects: []

  - method: GET
    path: "/surveillance/lab-results/{labResultId}"
    description: "Get a lab result"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: LabResult
    side_effects: []

  - method: POST
    path: "/surveillance/lab-results/{labResultId}/supersede"
    description: "Supersede a linked lab result (correction); detaches from its case"
    roles: [IntakeProcessor]
    code: 200
    input: []
    output: LabResult
    side_effects: ["LINKED -> SUPERSEDED; clear linked_case_id; recompute prior case linked_positive_count + completeness_score"]

  # --- Cases ---
  - method: POST
    path: "/surveillance/cases"
    description: "Open a case (manually or from an ELR result)"
    roles: [IntakeProcessor, CaseInvestigator]
    code: 201
    input: [program_id, jurisdiction_id, condition_code, patient_reference, "source_lab_result_id?", "symptom_onset_date?", "specimen_collection_date?", "last_symptomatic_date?", "is_symptomatic?", "exposure_setting_location_id?"]
    output: Case
    side_effects: ["status OPEN; classification SUSPECT; completeness_score 0; contact_count 0; linked_positive_count 0"]

  - method: GET
    path: "/surveillance/cases"
    description: "List cases (filterable by program_id, jurisdiction_id, condition_code, status, cluster_id, source_contact_id, source_lab_result_id)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: ["program_id?", "jurisdiction_id?", "condition_code?", "status?", "cluster_id?", "source_contact_id?", "source_lab_result_id?"]
    output: "Case[]"
    side_effects: []

  - method: GET
    path: "/surveillance/cases/{caseId}"
    description: "Get a case (includes computed windows, scores, counts)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: POST
    path: "/surveillance/cases/{caseId}/interview"
    description: "Record the case interview; computes the infectious/exposure window"
    roles: [CaseInvestigator]
    code: 200
    input: ["symptom_onset_date?", "specimen_collection_date?", "last_symptomatic_date?", "is_symptomatic?"]
    output: Case
    side_effects: ["status -> UNDER_INVESTIGATION; interview_completed=true; compute infectious window; recompute completeness_score"]

  - method: POST
    path: "/surveillance/cases/{caseId}/classify"
    description: "Classify the case (CONFIRMED/PROBABLE/NOT_A_CASE); fork side-effects"
    roles: [CaseInvestigator]
    code: 200
    input: [classification]
    output: Case
    side_effects: ["status -> CLASSIFIED; set classification; CONFIRMED computes isolation_end_date + runs cluster evaluation; NOT_A_CASE cascades contact voids; recompute completeness_score"]

  - method: POST
    path: "/surveillance/cases/{caseId}/close"
    description: "Close a classified case"
    roles: [CaseInvestigator]
    code: 200
    input: []
    output: Case
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/surveillance/cases/{caseId}/reopen"
    description: "Reopen a closed case (revert loop)"
    roles: [CaseInvestigator]
    code: 200
    input: []
    output: Case
    side_effects: ["status -> REOPENED; classification SUSPECT; interview_completed=false; clear windows; recompute completeness_score"]

  - method: POST
    path: "/surveillance/cases/{caseId}/link-lab-result"
    description: "Manually link a RECEIVED/UNLINKED lab result to this case"
    roles: [CaseInvestigator]
    code: 200
    input: [lab_result_id]
    output: LabResult
    side_effects: ["LabResult -> LINKED; linked_case_id set; recompute case.linked_positive_count + completeness_score"]

  - method: GET
    path: "/surveillance/cases/{caseId}/cluster"
    description: "Reverse lookup: the cluster a case belongs to (array of 0 or 1)"
    roles: [JurisdictionAdmin, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: "OutbreakCluster[]"
    side_effects: []

  # --- Contacts (elicitation, notification, monitoring) ---
  - method: POST
    path: "/surveillance/contacts"
    description: "Elicit a contact for an index case; computes priority + quarantine end"
    roles: [ContactTracer]
    code: 201
    input: [program_id, source_case_id, monitoring_jurisdiction_id, contact_reference, exposure_setting, proximity_meters, cumulative_exposure_minutes, "is_high_risk_contact?", last_exposure_date]
    output: Contact
    side_effects: ["status ELICITED; compute priority_score + priority_band; compute quarantine_end_date (STANDARD); increment source_case.contact_count by 1; recompute source_case.completeness_score"]

  - method: GET
    path: "/surveillance/contacts"
    description: "List contacts (filterable by program_id, source_case_id, monitoring_jurisdiction_id, status, priority_band, promoted_case_id)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: ["program_id?", "source_case_id?", "monitoring_jurisdiction_id?", "status?", "priority_band?", "promoted_case_id?"]
    output: "Contact[]"
    side_effects: []

  - method: GET
    path: "/surveillance/contacts/{contactId}"
    description: "Get a contact"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: Contact
    side_effects: []

  - method: POST
    path: "/surveillance/contacts/{contactId}/qualifying-test"
    description: "Record a qualifying test for a contact; may switch quarantine to TEST_BASED"
    roles: [ContactTracer]
    code: 200
    input: [result_value, specimen_collection_date]
    output: Contact
    side_effects: ["set has_qualifying_negative_test if NEGATIVE at/after earliest offset; recompute quarantine_end_date + quarantine_release_basis"]

  - method: POST
    path: "/surveillance/contacts/{contactId}/queue-notification"
    description: "Queue a contact for notification"
    roles: [ContactTracer]
    code: 200
    input: []
    output: Contact
    side_effects: ["status -> NOTIFICATION_PENDING"]

  - method: POST
    path: "/surveillance/contacts/{contactId}/record-notification"
    description: "Record a notification outcome (SUCCESS -> NOTIFIED, FAILED -> NOTIFICATION_FAILED)"
    roles: [ContactTracer]
    code: 200
    input: [outcome]
    output: Contact
    side_effects: ["notification_attempts += 1; status -> NOTIFIED or NOTIFICATION_FAILED"]

  - method: POST
    path: "/surveillance/contacts/{contactId}/monitoring-periods"
    description: "Schedule a monitoring period for a contact (overlap-checked)"
    roles: [ContactTracer]
    code: 201
    input: [monitoring_type, start_date, end_date]
    output: MonitoringPeriod
    side_effects: ["status SCHEDULED; jurisdiction_id copied from contact.monitoring_jurisdiction_id; overlap rejected per validation priority 9"]

  - method: GET
    path: "/surveillance/monitoring-periods"
    description: "List monitoring periods (filterable by program_id, contact_id, jurisdiction_id, status)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: ["program_id?", "contact_id?", "jurisdiction_id?", "status?"]
    output: "MonitoringPeriod[]"
    side_effects: []

  - method: GET
    path: "/surveillance/monitoring-periods/{monitoringPeriodId}"
    description: "Get a monitoring period"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: MonitoringPeriod
    side_effects: []

  - method: POST
    path: "/surveillance/contacts/{contactId}/start-monitoring"
    description: "Activate monitoring (consumes the SCHEDULED monitoring period)"
    roles: [ContactTracer]
    code: 200
    input: []
    output: Contact
    side_effects: ["MonitoringPeriod SCHEDULED -> ACTIVE; status -> MONITORING_ACTIVE; increment monitoring_jurisdiction.active_monitoring_count by 1"]

  - method: POST
    path: "/surveillance/contacts/{contactId}/complete-monitoring"
    description: "Complete monitoring once the quarantine window has elapsed"
    roles: [ContactTracer]
    code: 200
    input: []
    output: Contact
    side_effects: ["MonitoringPeriod ACTIVE -> COMPLETED; status -> MONITORING_COMPLETE; decrement monitoring_jurisdiction.active_monitoring_count by 1"]

  - method: POST
    path: "/surveillance/contacts/{contactId}/promote"
    description: "Promote a symptomatic contact into a new index Case (self-referential lineage)"
    roles: [ContactTracer]
    code: 201
    input: [symptom_onset_date]
    output: Case
    side_effects: ["create new Case (OPEN, source_contact_id set, jurisdiction = contact.monitoring_jurisdiction_id); promoted_case_id set; status -> PROMOTED_TO_CASE; if was MONITORING_ACTIVE: MonitoringPeriod -> RELEASED_EARLY + decrement jurisdiction.active_monitoring_count by 1"]

  - method: POST
    path: "/surveillance/contacts/{contactId}/void"
    description: "Void a contact (manual or cascade); compensating actions reverse counters"
    roles: [ContactTracer]
    code: 200
    input: []
    output: Contact
    side_effects: ["status -> VOIDED; if was MONITORING_ACTIVE: MonitoringPeriod -> RELEASED_EARLY + decrement jurisdiction.active_monitoring_count by 1; decrement source_case.contact_count by 1; recompute source_case.completeness_score"]

  # --- Exposure Events ---
  - method: POST
    path: "/surveillance/contacts/{contactId}/exposure-events"
    description: "Append an exposure encounter; rejected if outside the index case infectious window"
    roles: [ContactTracer]
    code: 201
    input: [encounter_date, "setting_note?"]
    output: ExposureEvent
    side_effects: ["program_id + case_id copied from the contact; encounter_date validated against the case infectious window"]

  - method: GET
    path: "/surveillance/exposure-events"
    description: "List exposure events (filterable by program_id, contact_id, case_id)"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: ["program_id?", "contact_id?", "case_id?"]
    output: "ExposureEvent[]"
    side_effects: []

  - method: GET
    path: "/surveillance/exposure-events/{exposureEventId}"
    description: "Get an exposure event"
    roles: [JurisdictionAdmin, IntakeProcessor, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: ExposureEvent
    side_effects: []

  # --- Jurisdiction Transfers ---
  - method: POST
    path: "/surveillance/jurisdiction-transfers"
    description: "Request transfer of a case to another jurisdiction (OCC on case.version)"
    roles: [EpiAnalyst]
    code: 201
    input: [program_id, case_id, to_jurisdiction_id, expected_case_version, "reason?"]
    output: JurisdictionTransfer
    side_effects: ["create transfer REQUESTED; from_jurisdiction_id = case.jurisdiction_id; case.status -> TRANSFER_PENDING; increments Case.version by 1"]

  - method: GET
    path: "/surveillance/jurisdiction-transfers"
    description: "List jurisdiction transfers (filterable by program_id, case_id, to_jurisdiction_id, from_jurisdiction_id, status)"
    roles: [JurisdictionAdmin, EpiAnalyst, CaseInvestigator]
    code: 200
    input: ["program_id?", "case_id?", "to_jurisdiction_id?", "from_jurisdiction_id?", "status?"]
    output: "JurisdictionTransfer[]"
    side_effects: []

  - method: GET
    path: "/surveillance/jurisdiction-transfers/{transferId}"
    description: "Get a jurisdiction transfer"
    roles: [JurisdictionAdmin, EpiAnalyst, CaseInvestigator]
    code: 200
    input: []
    output: JurisdictionTransfer
    side_effects: []

  - method: PUT
    path: "/surveillance/jurisdiction-transfers/{transferId}"
    description: "Resolve a transfer (ACCEPTED rehomes case + monitoring; REJECTED restores)"
    roles: [EpiAnalyst]
    code: 200
    input: [status]
    output: JurisdictionTransfer
    side_effects: ["REQUESTED -> ACCEPTED/REJECTED; case.status restored; on ACCEPTED case rehomed + monitoring counts moved between jurisdictions"]

  # --- Outbreak Clusters ---
  - method: GET
    path: "/surveillance/outbreak-clusters"
    description: "List outbreak clusters (filterable by program_id, condition_code, exposure_setting_location_id, status, anchor_case_id)"
    roles: [JurisdictionAdmin, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: ["program_id?", "condition_code?", "exposure_setting_location_id?", "status?", "anchor_case_id?"]
    output: "OutbreakCluster[]"
    side_effects: []

  - method: GET
    path: "/surveillance/outbreak-clusters/{clusterId}"
    description: "Get an outbreak cluster (member counts, onset bounds)"
    roles: [JurisdictionAdmin, CaseInvestigator, ContactTracer, EpiAnalyst]
    code: 200
    input: []
    output: OutbreakCluster
    side_effects: []

  - method: POST
    path: "/surveillance/outbreak-clusters/{clusterId}/close"
    description: "Close an active outbreak cluster"
    roles: [EpiAnalyst]
    code: 200
    input: []
    output: OutbreakCluster
    side_effects: ["status -> CLOSED"]

  # --- NEDSS Exports ---
  - method: POST
    path: "/surveillance/nedss-exports"
    description: "Generate a state/NEDSS export snapshot for a CONFIRMED or PROBABLE case"
    roles: [EpiAnalyst]
    code: 201
    input: [program_id, case_id]
    output: NedssExport
    side_effects: ["status GENERATED; snapshot_classification + snapshot_completeness_score captured; nedss_message_id minted"]

  - method: GET
    path: "/surveillance/nedss-exports"
    description: "List NEDSS exports (filterable by program_id, case_id, status)"
    roles: [JurisdictionAdmin, EpiAnalyst]
    code: 200
    input: ["program_id?", "case_id?", "status?"]
    output: "NedssExport[]"
    side_effects: []

  - method: GET
    path: "/surveillance/nedss-exports/{exportId}"
    description: "Get a NEDSS export"
    roles: [JurisdictionAdmin, EpiAnalyst]
    code: 200
    input: []
    output: NedssExport
    side_effects: []

  - method: POST
    path: "/surveillance/nedss-exports/{exportId}/transmit"
    description: "Transmit a generated NEDSS export (rejected if snapshot stale)"
    roles: [EpiAnalyst]
    code: 200
    input: []
    output: NedssExport
    side_effects: ["GENERATED -> TRANSMITTED"]

  - method: POST
    path: "/surveillance/nedss-exports/{exportId}/void"
    description: "Void a generated NEDSS export"
    roles: [EpiAnalyst]
    code: 200
    input: []
    output: NedssExport
    side_effects: ["GENERATED -> VOIDED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or X-User-Role not a known role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_JURISDICTION_SCOPE_VIOLATION, http: 403, condition: "Scoped role acting outside its jurisdiction" }

  # --- Not found ---
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Surveillance program not found (path or FK)" }
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "Jurisdiction not found (path or FK)" }
  - { id: ERR_CONDITION_NOT_FOUND, http: 404, condition: "Reportable condition not found / condition_code unknown in program" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Case not found (path or FK)" }
  - { id: ERR_CONTACT_NOT_FOUND, http: 404, condition: "Contact not found (path or FK)" }
  - { id: ERR_LAB_RESULT_NOT_FOUND, http: 404, condition: "Lab result not found (path or FK)" }
  - { id: ERR_MONITORING_PERIOD_NOT_FOUND, http: 404, condition: "Monitoring period not found" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "Jurisdiction transfer not found" }
  - { id: ERR_CLUSTER_NOT_FOUND, http: 404, condition: "Outbreak cluster not found" }
  - { id: ERR_EXPORT_NOT_FOUND, http: 404, condition: "NEDSS export not found" }

  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, negative number, end_date < start_date, or transfer to == from" }
  - { id: ERR_ONSET_OR_SPECIMEN_REQUIRED, http: 400, condition: "Interview/promote needs symptom_onset_date (symptomatic) or specimen_collection_date (asymptomatic)" }
  - { id: ERR_INVALID_CLASSIFICATION, http: 400, condition: "classify value not in {CONFIRMED, PROBABLE, NOT_A_CASE}" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "fips_code or condition_code already exists in the program" }

  # --- Concurrency ---
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not match case.version on transfer create" }

  # --- Case state ---
  - { id: ERR_CASE_NOT_INTERVIEWABLE, http: 409, condition: "Case not in OPEN/REOPENED for interview" }
  - { id: ERR_CASE_NOT_CLASSIFIABLE, http: 409, condition: "Case not in UNDER_INVESTIGATION for classify" }
  - { id: ERR_INTERVIEW_NOT_COMPLETE, http: 409, condition: "Classify attempted before interview completed" }
  - { id: ERR_CASE_NOT_CLOSEABLE, http: 409, condition: "Case not in CLASSIFIED for close" }
  - { id: ERR_CASE_NOT_REOPENABLE, http: 409, condition: "Case not in CLOSED for reopen" }
  - { id: ERR_CASE_NOT_TRANSFERABLE, http: 409, condition: "Case not in UNDER_INVESTIGATION/CLASSIFIED for transfer" }
  - { id: ERR_CASE_NOT_LINKABLE, http: 409, condition: "Cannot link lab result to a CLOSED case" }
  - { id: ERR_ACTIVE_MONITORING_EXISTS, http: 409, condition: "Case close blocked: a contact is MONITORING_ACTIVE" }
  - { id: ERR_TRANSFER_PENDING_EXISTS, http: 409, condition: "Case close/transfer blocked: a REQUESTED transfer exists for the case" }
  - { id: ERR_SAME_JURISDICTION_TRANSFER, http: 409, condition: "Transfer target equals the case's current jurisdiction" }
  - { id: ERR_LAB_CONFIRMATION_REQUIRED, http: 409, condition: "Classify to CONFIRMED requires >= 1 linked POSITIVE lab when condition requires confirmation" }

  # --- Lab linkage ---
  - { id: ERR_LAB_NOT_LINKABLE, http: 409, condition: "Lab result not in RECEIVED/UNLINKED for linking" }
  - { id: ERR_LAB_CONDITION_MISMATCH, http: 409, condition: "Lab result condition_code differs from case" }
  - { id: ERR_LAB_PATIENT_MISMATCH, http: 409, condition: "Lab result patient_reference differs from case" }
  - { id: ERR_LAB_NOT_SUPERSEDABLE, http: 409, condition: "Lab result not in LINKED for supersede" }

  # --- Contact state ---
  - { id: ERR_CONTACT_NOT_QUEUEABLE, http: 409, condition: "Contact not in ELICITED/NOTIFICATION_FAILED to queue" }
  - { id: ERR_CONTACT_NOT_PENDING_NOTIFICATION, http: 409, condition: "Contact not in NOTIFICATION_PENDING for record-notification" }
  - { id: ERR_CONTACT_NOT_NOTIFIED, http: 409, condition: "Contact not in NOTIFIED for start-monitoring" }
  - { id: ERR_CONTACT_NOT_MONITORING, http: 409, condition: "Contact not in MONITORING_ACTIVE for complete-monitoring" }
  - { id: ERR_CONTACT_NOT_PROMOTABLE, http: 409, condition: "Contact not in MONITORING_ACTIVE/NOTIFIED for promote" }
  - { id: ERR_CONTACT_NOT_VOIDABLE, http: 409, condition: "Contact already terminal for void" }
  - { id: ERR_QUARANTINE_WINDOW_MISSING, http: 409, condition: "start-monitoring before quarantine_end_date computed" }
  - { id: ERR_NO_SCHEDULED_MONITORING, http: 409, condition: "start-monitoring without a SCHEDULED MonitoringPeriod" }
  - { id: ERR_MONITORING_NOT_ELAPSED, http: 409, condition: "complete-monitoring before program.current_date reaches quarantine_end_date" }
  - { id: ERR_MONITORING_PERIOD_OVERLAP, http: 409, condition: "New monitoring period shares a day with an existing non-terminal period for the contact" }

  # --- Exposure window ---
  - { id: ERR_ENCOUNTER_OUTSIDE_INFECTIOUS_WINDOW, http: 409, condition: "ExposureEvent.encounter_date outside the index case infectious window" }

  # --- Transfer state ---
  - { id: ERR_TRANSFER_NOT_RESOLVABLE, http: 409, condition: "Transfer not in REQUESTED for accept/reject" }

  # --- Cluster / export state ---
  - { id: ERR_CLUSTER_NOT_CLOSEABLE, http: 409, condition: "Cluster not in ACTIVE for close" }
  - { id: ERR_EXPORT_CASE_NOT_REPORTABLE, http: 409, condition: "NEDSS export requires case classification CONFIRMED or PROBABLE" }
  - { id: ERR_EXPORT_NOT_TRANSMITTABLE, http: 409, condition: "Export not in GENERATED for transmit" }
  - { id: ERR_EXPORT_SNAPSHOT_STALE, http: 409, condition: "Case classification changed since export snapshot" }
  - { id: ERR_EXPORT_NOT_VOIDABLE, http: 409, condition: "Export not in GENERATED for void" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: JurisdictionAdmin
    description: "Program-wide configurator: creates programs, jurisdictions, reportable conditions, sets the clock. Unscoped (program-wide)."
    identity: opaque
    exclusive_operations:
      - "POST /surveillance/programs — Create program"
      - "POST /surveillance/programs/{id}/clock/set — Set clock"
      - "POST /surveillance/jurisdictions — Create jurisdiction"
      - "POST /surveillance/reportable-conditions — Define condition"
    shared_operations:
      - "All GET reads"

  - name: IntakeProcessor
    description: "Electronic lab reporting intake; opens cases from labs, supersedes corrected results. Scoped: X-User-ID is a Jurisdiction.id."
    identity: entity_backed:Jurisdiction
    exclusive_operations:
      - "POST /surveillance/lab-results — ELR intake"
      - "POST /surveillance/lab-results/{id}/supersede — Supersede result"
    shared_operations:
      - "POST /surveillance/cases — Open case (shared with CaseInvestigator)"
      - "All GET reads"

  - name: CaseInvestigator
    description: "Conducts interviews, sets exposure windows, links labs, classifies, closes/reopens cases. Scoped: X-User-ID is a Jurisdiction.id; may act only on cases in its jurisdiction."
    identity: entity_backed:Jurisdiction
    exclusive_operations:
      - "POST /surveillance/cases/{id}/interview — Interview"
      - "POST /surveillance/cases/{id}/classify — Classify"
      - "POST /surveillance/cases/{id}/close — Close"
      - "POST /surveillance/cases/{id}/reopen — Reopen"
      - "POST /surveillance/cases/{id}/link-lab-result — Link lab"
    shared_operations:
      - "POST /surveillance/cases — Open case (shared with IntakeProcessor)"
      - "GET /surveillance/jurisdiction-transfers — read transfers"
      - "All GET reads"

  - name: ContactTracer
    description: "Elicits contacts, runs notification, schedules/runs monitoring, promotes/voids contacts, records exposure events. Scoped: X-User-ID is a Jurisdiction.id; may act only on contacts in its monitoring jurisdiction."
    identity: entity_backed:Jurisdiction
    exclusive_operations:
      - "POST /surveillance/contacts — Elicit contact"
      - "POST /surveillance/contacts/{id}/qualifying-test — Record qualifying test"
      - "POST /surveillance/contacts/{id}/queue-notification — Queue notification"
      - "POST /surveillance/contacts/{id}/record-notification — Record outcome"
      - "POST /surveillance/contacts/{id}/monitoring-periods — Schedule monitoring"
      - "POST /surveillance/contacts/{id}/start-monitoring — Start monitoring"
      - "POST /surveillance/contacts/{id}/complete-monitoring — Complete monitoring"
      - "POST /surveillance/contacts/{id}/promote — Promote to case"
      - "POST /surveillance/contacts/{id}/void — Void contact"
      - "POST /surveillance/contacts/{id}/exposure-events — Append exposure event"
    shared_operations:
      - "All GET reads"

  - name: EpiAnalyst
    description: "Manages outbreak clusters, jurisdiction transfers, and state/NEDSS exports. Program-wide (unscoped)."
    identity: opaque
    exclusive_operations:
      - "POST /surveillance/jurisdiction-transfers — Request transfer"
      - "PUT /surveillance/jurisdiction-transfers/{id} — Resolve transfer"
      - "POST /surveillance/outbreak-clusters/{id}/close — Close cluster"
      - "POST /surveillance/nedss-exports — Generate export"
      - "POST /surveillance/nedss-exports/{id}/transmit — Transmit export"
      - "POST /surveillance/nedss-exports/{id}/void — Void export"
    shared_operations:
      - "GET /surveillance/jurisdiction-transfers — read transfers"
      - "All GET reads"
