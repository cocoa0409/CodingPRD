              captures: { rk2: $.data.id }
          trigger:
            - call: "POST /vote-by-mail/remake-records/${rk1}/complete"
              payload: { remade_serial: "RM-0001" }
              as: CanvassSupervisor
            - call: "POST /vote-by-mail/remake-records/${rk2}/complete"
              payload: { remade_serial: "RM-0001" }
              as: CanvassSupervisor
              captures: { dup_serial_err: $.data.error_id }
          assert:
            - "First completion: HTTP 200 with status == \"COMPLETED\" and remade_envelope_id != null"
            - "Second completion: HTTP 409 with data.error_id == \"ERR_DUPLICATE_REMAKE_SERIAL\""
            - "GET /vote-by-mail/remake-records/${rk2} returns status == \"OPEN\", remade_serial == null, remade_envelope_id == null, completed_at == null"
            - "GET /vote-by-mail/return-envelopes/${en2} returns custody_status == \"SEALED\" and GET /vote-by-mail/return-envelopes?remade_from_envelope_id=${en2} returns total_count == 0"
            - "GET /vote-by-mail/return-envelopes/${en1} returns custody_status == \"SUPERSEDED_BY_REMAKE\""

      - name: clock_cannot_be_rewound_or_reset_to_the_same_instant
        claim_type: Temporal validation
        grounds:
          - validations[ERR_CLOCK_REWIND_FORBIDDEN]
          - endpoints[POST /vote-by-mail/_clock/set_current_utc]
        distinguishing_aspect: "From 2026-11-03T12:00:00Z both an earlier instant (11:59:59Z) and the identical instant are refused with 422 ERR_CLOCK_REWIND_FORBIDDEN because the rule is strict inequality; the readable clock value is unchanged."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-11-03T12:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_clock_nov3
          trigger:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T11:59:59Z" }
              as: ElectionsAdmin
              captures: { rewind_err: $.data.error_id }
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T12:00:00Z" }
              as: ElectionsAdmin
              captures: { same_instant_err: $.data.error_id }
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T12:00:01Z" }
              as: ElectionsAdmin
              captures: { forward_clock: $.data.current_utc }
          assert:
            - "Rewind: HTTP 422 with data.error_id == \"ERR_CLOCK_REWIND_FORBIDDEN\""
            - "Same instant: HTTP 422 with data.error_id == \"ERR_CLOCK_REWIND_FORBIDDEN\" (the check is to_iso8601 > current, not >=)"
            - "One second forward: HTTP 200 with current_utc == \"2026-11-03T12:00:01Z\""

      - name: reinstating_an_active_enrollment_returns_enrollment_not_suspended
        claim_type: Violation → Error
        grounds:
          - validations[ERR_ENROLLMENT_NOT_SUSPENDED]
          - state_machines.PermanentAbsenteeEnrollment.transitions.SUSPENDED_to_ACTIVE
          - endpoints[POST /vote-by-mail/permanent-absentee-enrollments/{id}/reinstate]
        distinguishing_aspect: "Reinstate is declared only from SUPENDED; on an ACTIVE enrollment it returns 409 ERR_ENROLLMENT_NOT_SUSPENDED and leaves reinstated_count at 0 and last_confirmation_at at the creation instant."
        test_recipe:
          setup:
            - "Voter v1 holds one PermanentAbsenteeEnrollment created directly in ACTIVE at clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - &c_enrollment1
              call: "POST /vote-by-mail/voters/${v1}/permanent-absentee-enrollments"
              payload: {}
              as: ElectionsClerk
              captures: { pae1: $.data.id }
          trigger:
            - call: "POST /vote-by-mail/permanent-absentee-enrollments/${pae1}/reinstate"
              payload: { confirmation_evidence_type: "SIGNED_CONFIRMATION_CARD" }
              as: ElectionsClerk
              captures: { not_suspended_err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == \"ERR_ENROLLMENT_NOT_SUSPENDED\""
            - "GET /vote-by-mail/permanent-absentee-enrollments/${pae1} returns status == \"ACTIVE\", reinstated_count == 0, consecutive_undeliverable_count == 0, suspension_reason_code == null"
            - "GET /vote-by-mail/permanent-absentee-enrollments/${pae1} returns last_confirmation_at == \"2026-09-10T09:00:00Z\""
            - "GET /vote-by-mail/voters/${v1} returns permanent_absentee_active == true"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=ENROLLMENT_REINSTATED returns total_count == 0"

      - name: decision_by_a_reviewer_other_than_the_assignee_is_refused
        claim_type: Violation → Error
        grounds:
          - validations[ERR_NOT_ASSIGNED_REVIEWER]
          - state_machines.SignatureReview.transitions.ASSIGNED_to_SUBMITTED
          - roles.SignatureReviewer.identity
        distinguishing_aspect: "Review sr1 is assigned to rv1; rvB submitting the same review with X-User-ID == ${rvB} returns 403 ERR_NOT_ASSIGNED_REVIEWER, sr1 stays ASSIGNED and rvB's counters stay at 0."
        test_recipe:
          setup:
            - "Envelope en1 in PENDING_REVIEW with sr1 assigned to rv1; rvB is TRAINED and unrelated to en1."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_reviewer_b
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
          trigger:
            - call: "POST /vote-by-mail/signature-reviews/${sr1}/decision"
              payload: { decision: "MATCH", similarity_score: 90 }
              as: SignatureReviewer
              as_user_id: "${rvB}"
              captures: { wrong_reviewer_err: $.data.error_id }
          assert:
            - "HTTP 403; data.error_id == \"ERR_NOT_ASSIGNED_REVIEWER\""
            - "GET /vote-by-mail/signature-reviews/${sr1} returns status == \"ASSIGNED\", decision == null, confidence_score == null, submitted_at == null"
            - "GET /vote-by-mail/return-envelopes/${en1} returns signature_status == \"PENDING_REVIEW\" and review_round_count == 0"
            - "GET /vote-by-mail/reviewers/${rvB} returns active_review_count == 0 and completed_review_count == 0"
            - "GET /vote-by-mail/reviewers/${rv1} returns active_review_count == 1"

      - name: observer_challenge_with_only_a_scheduled_session_is_refused
        claim_type: Cross-entity validation
        grounds:
          - validations[ERR_OBSERVER_SESSION_REQUIRED]
          - endpoints[POST /vote-by-mail/return-envelopes/{id}/challenges]
        distinguishing_aspect: "Session os1 exists for this election with the right station_area but is still SCHEDULED (the clock is 12:00Z, before its 14:00Z window), so the challenge is refused with 403 ERR_OBSERVER_SESSION_REQUIRED and en1 keeps challenge_status NONE and custody_status SEALED."
        test_recipe:
          setup:
            - "Envelope en1 SEALED with challenge_status NONE; observer session os1 (DEM, INTAKE, window 14:00-16:00Z) is SCHEDULED; logical clock is 2026-11-03T12:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_session_dem
          trigger:
            - call: "POST /vote-by-mail/return-envelopes/${en1}/challenges"
              payload: { challenge_reason_code: "SIGNATURE_DISPUTE" }
              as: Observer
              as_user_id: "obs-dem-1"
              captures: { session_required_err: $.data.error_id }
          assert:
            - "HTTP 403; data.error_id == \"ERR_OBSERVER_SESSION_REQUIRED\""
            - "GET /vote-by-mail/observer-sessions/${os1} returns status == \"SCHEDULED\" (a refused challenge does not implicitly check the observer in)"
            - "GET /vote-by-mail/return-envelopes/${en1} returns challenge_status == \"NONE\", custody_status == \"SEALED\", version == ${en1_v}"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=CHALLENGE_FILED returns total_count == 0"

      - name: second_address_result_returns_verification_already_resolved
        claim_type: Violation → Error
        grounds:
          - validations[ERR_VERIFICATION_ALREADY_RESOLVED]
          - endpoints[POST /vote-by-mail/address-verifications/{id}/results]
        distinguishing_aspect: "The first MATCH_SAME result moves av1 out of PENDING; a second result posting MATCH_NON_FORWARDABLE returns 409 ERR_VERIFICATION_ALREADY_RESOLVED and cannot retroactively put br1 on ADDRESS_HOLD."
        test_recipe:
          setup:
            - "Ballot request br1 with its auto-created AddressVerification av1 already CLEARED by a MATCH_SAME result."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
          trigger:
            - call: "POST /vote-by-mail/address-verifications/${av1}/results"
              payload: { ncoa_result: "MATCH_NON_FORWARDABLE" }
              as: ElectionsClerk
              captures: { already_resolved_err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == \"ERR_VERIFICATION_ALREADY_RESOLVED\""
            - "GET /vote-by-mail/address-verifications/${av1} returns status == \"CLEARED\" and ncoa_result == \"MATCH_SAME\""
            - "GET /vote-by-mail/ballot-requests/${br1} returns status == \"ADDRESS_CLEARED\" and forwarding_class == \"SAME_ADDRESS\""
            - "GET /vote-by-mail/voters/${v1} returns permanent_absentee_active == false (the refused NON_FORWARDABLE cascade did not run)"

      - name: counting_an_unseparated_envelope_returns_custody_state_invalid
        claim_type: Violation → Error
        grounds:
          - validations[ERR_ENVELOPE_CUSTODY_STATE_INVALID]
          - endpoints[POST /vote-by-mail/return-envelopes/{id}/count]
        distinguishing_aspect: "en1 is ACCEPTED and unchallenged but still SEALED, so the count endpoint's custody precondition (SEPARATED) is the only failing check and returns 409 ERR_ENVELOPE_CUSTODY_STATE_INVALID rather than the same-priority ERR_CHALLENGE_STATE_INVALID."
        test_recipe:
          setup:
            - "Envelope en1 with signature_status ACCEPTED, challenge_status NONE and custody_status SEALED (no separation run has been executed)."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
            - *c_decision_match80
          trigger:
            - call: "POST /vote-by-mail/return-envelopes/${en1}/count"
              payload: {}
              as: CanvassSupervisor
              captures: { custody_err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == \"ERR_ENVELOPE_CUSTODY_STATE_INVALID\""
            - "GET /vote-by-mail/return-envelopes/${en1} returns custody_status == \"SEALED\" and separation_run_sequence == null"
            - "GET /vote-by-mail/elections/${e1}/accountability returns countable_envelope_count == 0 (countable requires custody IN {SEPARATED, COUNTED})"

      - name: adjudicating_an_unchallenged_envelope_returns_challenge_state_invalid
        claim_type: Violation → Error
        grounds:
          - validations[ERR_CHALLENGE_STATE_INVALID]
          - endpoints[POST /vote-by-mail/return-envelopes/{id}/challenge-adjudication]
        distinguishing_aspect: "Adjudication requires challenge_status == CHALLENGED; on an envelope at NONE it returns 409 ERR_CHALLENGE_STATE_INVALID and no provisional referral is recorded, distinguishing it from the SUSTAIN path that would set Voter.provisional_ballot_eligible."
        test_recipe:
          setup:
            - "Envelope en1 SEALED with challenge_status NONE; no observer has filed a challenge."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
          trigger:
            - call: "POST /vote-by-mail/return-envelopes/${en1}/challenge-adjudication"
              payload: { outcome: "SUSTAIN", challenge_findings: "Signature does not match the registration exemplar." }
              as: CanvassSupervisor
              captures: { challenge_state_err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == \"ERR_CHALLENGE_STATE_INVALID\""
            - "GET /vote-by-mail/return-envelopes/${en1} returns challenge_status == \"NONE\", challenge_findings == null, custody_status == \"SEALED\""
            - "GET /vote-by-mail/voters/${v1} returns provisional_ballot_eligible == false"
            - "GET /vote-by-mail/elections/${e1} returns provisional_referral_count == 0"

      - name: similarity_score_above_one_hundred_returns_invalid_request
        claim_type: Violation → Error
        grounds:
          - validations[ERR_INVALID_REQUEST]
          - endpoints[POST /vote-by-mail/signature-reviews/{id}/decision]
        distinguishing_aspect: "similarity_score 101 is outside the declared 0..100 range, so the priority-3 range check fires with 400 ERR_INVALID_REQUEST before any confidence-score arithmetic runs; sr1 stays ASSIGNED with confidence_score null."
        test_recipe:
          setup:
            - "Signature review sr1 ASSIGNED to rv1 on envelope en1."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
          trigger:
            - call: "POST /vote-by-mail/signature-reviews/${sr1}/decision"
              payload: { decision: "MATCH", similarity_score: 101 }
              as: SignatureReviewer
              as_user_id: "${rv1}"
              captures: { range_err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /vote-by-mail/signature-reviews/${sr1} returns status == \"ASSIGNED\", similarity_score == null, confidence_score == null"
            - "GET /vote-by-mail/return-envelopes/${en1} returns signature_status == \"PENDING_REVIEW\" and review_round_count == 0"

      - name: empty_separation_run_returns_separation_set_empty
        claim_type: Violation → Error
        grounds:
          - validations[ERR_SEPARATION_SET_EMPTY]
          - endpoints[POST /vote-by-mail/elections/{id}/separation-runs]
        distinguishing_aspect: "An empty return_envelope_ids array still satisfies the priority-3 type check (it is an array of strings), so the priority-7 business-safety rule is the one that fires with 400 ERR_SEPARATION_SET_EMPTY and separation_run_sequence stays 0."
        test_recipe:
          setup:
            - "Election e1 auto-advanced to RECEIVING by the first envelope intake, with separation_run_sequence == 0."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
          trigger:
            - call: "POST /vote-by-mail/elections/${e1}/separation-runs"
              payload: { return_envelope_ids: [] }
              as: CanvassSupervisor
              captures: { empty_set_err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == \"ERR_SEPARATION_SET_EMPTY\" (not ERR_INVALID_REQUEST — the payload is well-typed)"
            - "GET /vote-by-mail/elections/${e1} returns separation_run_sequence == 0"
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=SEPARATION_RUN returns total_count == 0"

      - name: seal_inside_the_postage_budget_commits_the_estimated_total
        claim_type: Satisfaction → Pass
        grounds:
          - validations[ERR_POSTAGE_BUDGET_EXCEEDED]
          - endpoints[POST /vote-by-mail/mailing-batches/{id}/seal]
          - calculations.postage_assessment
        distinguishing_aspect: "With postage_budget_cents 1000000 and a single 28g domestic packet the committed total after seal is exactly 141 cents, so the priority-12 fiscal rule passes and the batch reaches SEALED — the positive counterpart of the budget-exceeded corner."
        test_recipe:
          setup:
            - "DRAFT domestic batch mb1 holding one QUEUED 28g packet pk1 for an election with postage_budget_cents 1000000."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
          trigger:
            - call: "POST /vote-by-mail/mailing-batches/${mb1}/seal"
              payload: {}
              as: ElectionsClerk
              captures: { sealed_estimate: $.data.estimated_postage_cents }
          assert:
            - "HTTP 200; status == \"SEALED\" and sealed_at == \"2026-09-10T09:00:00Z\""
            - "estimated_postage_cents == 141 (73 outbound + 68 prepaid return for a 28g domestic packet) and packet_count == 1"
            - "actual_postage_cents == null — the ACTUAL variant is only written at dispatch"
            - "GET /vote-by-mail/elections/${e1}/accountability returns postage_committed_cents == 141 and postage_actual_cents == 0"
            - "GET /vote-by-mail/ballot-packets/${pk1} returns status == \"QUEUED\" (seal does not mail the packet)"

      - name: role_check_precedes_existence_check_on_a_voter_read
        claim_type: Priority Ordering
        grounds:
          - validations[ERR_ROLE_FORBIDDEN]
          - validations[ERR_RECORD_NOT_FOUND]
          - endpoints[GET /vote-by-mail/voters/{id}]
        distinguishing_aspect: "An Observer reading a syntactically valid but non-existent voter id violates the priority-2 role rule and the priority-4 existence rule at once; the response is 403 ERR_ROLE_FORBIDDEN, so the endpoint never leaks whether that voter row exists."
        test_recipe:
          setup:
            - "Election e1 and voter v1 exist; the probed id 00000000-0000-0000-0000-0000000000ff matches no voter row."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
          trigger:
            - call: "GET /vote-by-mail/voters/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Observer
              as_user_id: "obs-dem-1"
              captures: { ladder_err: $.data.error_id }
            - call: "GET /vote-by-mail/voters/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ElectionsClerk
              captures: { existence_err: $.data.error_id }
          assert:
            - "Observer call: HTTP 403 with data.error_id == \"ERR_ROLE_FORBIDDEN\" (not 404)"
            - "ElectionsClerk call on the same id: HTTP 404 with data.error_id == \"ERR_VOTER_NOT_FOUND\" — the existence rule is reached only once the role rule passes"
            - "Neither call mutates state: GET /vote-by-mail/voters?limit=100 as ElectionsClerk returns total_count == 1"

      - name: seal_priority_conflict_batch_state_versus_postage_budget
        claim_type: Priority conflict
        grounds:
          - validations[ERR_BATCH_STATE_INVALID]
          - validations[ERR_POSTAGE_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / batch_state_beats_postage_budget_on_second_seal
          rationale: "The Priority conflict claim for the seal endpoint (priority-6 batch-state rule versus the priority-12 postage-budget rule, both violated by the same second seal) is exercised in depth by the §1.8 priority_pair_validation_conflict instance of the same name; repeating it here would duplicate the identical two-rule collision."

      - name: remake_priority_conflict_bipartisan_versus_double_booking
        claim_type: Priority conflict
        grounds:
          - validations[ERR_REMAKE_TEAM_NOT_BIPARTISAN]
          - validations[ERR_REMAKE_TEAM_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / bipartisan_safety_beats_double_booking_constraint_on_remake
          rationale: "The second Priority conflict pair (priority-10 bipartisan-team safety versus the priority-11 reviewer double-booking constraint on one remake request) is covered by the §1.8 priority_pair_validation_conflict instance of the same name."

      - name: decision_admissibility_depends_on_reviewer_training_state
        claim_type: Cross-entity validation
        grounds:
          - validations[ERR_REVIEWER_TRAINING_INVALID]
          - endpoints[POST /vote-by-mail/signature-reviews/{id}/decision]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / signature_decision_gated_by_reviewer_training_validity
          rationale: "The Cross-entity validation claim where a decision's admissibility depends on the acting Reviewer's training_status and training_expires_at rather than on the envelope is proven by the §1.8 cross_entity_state_dependency instance of the same name, which walks both the valid and the expired side."

      - name: observer_party_slot_overlap_is_a_temporal_validation
        claim_type: Temporal validation
        grounds:
          - validations[ERR_OBSERVER_PARTY_SLOT_CONFLICT]
          - endpoints[POST /vote-by-mail/elections/{id}/observer-sessions]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / observer_party_slot_half_open_window_adjacency
          rationale: "The Temporal validation claim for ERR_OBSERVER_PARTY_SLOT_CONFLICT at exact half-open window adjacency (end == next start must not conflict, end > next start must) is the subject of the §1.8 resource_temporal_overlap instance of the same name."

      - name: remake_team_session_collision_is_a_temporal_validation
        claim_type: Temporal validation
        grounds:
          - validations[ERR_REMAKE_TEAM_DOUBLE_BOOKED]
          - endpoints[POST /vote-by-mail/return-envelopes/{id}/remakes]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / remake_team_closed_interval_changeover_buffer
          rationale: "The companion Temporal validation claim for ERR_REMAKE_TEAM_DOUBLE_BOOKED under the closed-interval remake session semantics plus the 15-minute changeover buffer is exercised by the §1.8 resource_temporal_overlap instance of the same name."

  - section: endpoints
    instances:
      - name: enrollment_delete_marks_removed_and_clears_the_voter_flag
        claim_type: Standard CRUD
        grounds:
          - endpoints[DELETE /vote-by-mail/permanent-absentee-enrollments/{id}]
          - state_machines.PermanentAbsenteeEnrollment.transitions.ACTIVE_to_REMOVED
          - entities.Voter.fields.permanent_absentee_active
        distinguishing_aspect: "The DELETE is a soft state change, not a row deletion: the enrollment is still readable at status REMOVED while Voter.permanent_absentee_active flips back to false."
        test_recipe:
          setup:
            - "Voter v1 with one ACTIVE PermanentAbsenteeEnrollment pae1."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_enrollment1
          trigger:
            - call: "DELETE /vote-by-mail/permanent-absentee-enrollments/${pae1}"
              payload: {}
              as: ElectionsClerk
          assert:
            - "HTTP 200; status == \"REMOVED\""
            - "GET /vote-by-mail/permanent-absentee-enrollments/${pae1} still returns HTTP 200 with status == \"REMOVED\" (the row is retained for audit)"
            - "GET /vote-by-mail/voters/${v1} returns permanent_absentee_active == false"
            - "GET /vote-by-mail/permanent-absentee-enrollments?voter_id=${v1} returns total_count == 1 and data[0].status == \"REMOVED\""

