              payload: { email: "pa10@x.com", full_name: "PA10", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "fin@x.com", full_name: "FIN", birth_date: "1980-01-01", role: "finance" }
              as: system
              captures: { fin_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v10@x.com", full_name: "V10", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/lottery-draws"
              payload: { park_id: "${park_id}", objective: "the_wave", use_date: "2026-09-01", daily_quota: 10, application_open_at: "2026-05-01T00:00:00Z", application_close_at: "2026-07-01T00:00:00Z", draw_at: "2026-07-02T00:00:00Z", permit_fee_per_person_cents: 1500 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { draw_id: $.data.id }
          trigger:
            - call: "POST /v1/lottery-draws/${draw_id}/applications"
