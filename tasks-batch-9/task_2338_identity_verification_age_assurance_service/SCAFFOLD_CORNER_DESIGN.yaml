      rationale: "That instance is the cross-entity form of this rule: the attempt is refused solely because the parent Client is SUSPENDED, and it also shows the LIVE case succeeding."
  - name: audit_window_overlap_is_a_temporal_validation
    claim_type: temporal_validation
    grounds:
    - "validations[priority=39]"
    - "errors[ERR_AUDIT_WINDOW_OVERLAP]"
    excluded_because:
      difficulty_instance: resource_temporal_overlap / bias_audit_windows_half_open_adjacency_admitted_containment_rejected
      rationale: "That instance admits the adjacent window and rejects the contained one, covering both directions of the half-open comparison."
- section: endpoints
  instances:
  - name: retention_sweep_reports_the_three_counters_from_one_pass
    claim_type: bulk_action
    grounds:
    - "endpoints[POST /idv/retention-sweeps]"
    - calculations.retention_schedule
    - calculations.review_sla_schedule
    - calculations.session_expiry_schedule
    distinguishing_aspect: "One sweep must apply three independent branches and report them separately: the lapsed session S3 counts only in expired_session_count, the SLA-overdue case of S2 only in withdrawn_case_count,\
      \ and the 90 day template of S1 only in deleted_template_count."
    test_recipe:
      setup:
      - "At 2026-08-10T09:00:00Z client Acme Sweep3 is LIVE with biometric_retention_mode RETAIN_90_DAYS and one review credit."
      - "Session S1 stored a biometric template, was completed VERIFIED with final score 31, and its template became PURGE_SCHEDULED with retention_expires_at 2026-11-08T09:00:00Z."
      - "Session S2 took a FORGED capture, escalated to MANUAL_REVIEW and its QUEUED case has sla_due_at 2026-08-12T09:00:00Z; it was never assigned."
      - "Session S3 was created at 2026-11-08T07:00:00Z and expires at 2026-11-08T08:00:00Z."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-10T09:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
