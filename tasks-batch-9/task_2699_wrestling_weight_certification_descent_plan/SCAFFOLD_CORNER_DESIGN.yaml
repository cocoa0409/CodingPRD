      - name: assessor_peers_cannot_finalize_or_review_each_others_work
        claim_type: segregation_of_duties
        grounds:
          - roles.Assessor.identity
          - validations[priority=5]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - state_machines.Appeal
        distinguishing_aspect: "Assessor is entity_backed:Assessor and X-User-ID is tracked, so holding the Assessor role is not enough: only the recording assessor may finalize an assessment and only the assigned reviewer may order a retest or decide the appeal. A different assessor gets 403 ERR_NOT_RESOURCE_OWNER at priority 5 — before the priority-19 same-assessor conflict and before any state check."
