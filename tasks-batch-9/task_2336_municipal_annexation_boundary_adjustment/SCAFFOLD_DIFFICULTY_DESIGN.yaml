            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_vi}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
