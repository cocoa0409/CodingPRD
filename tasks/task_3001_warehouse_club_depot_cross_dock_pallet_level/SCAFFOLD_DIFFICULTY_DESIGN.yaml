          assert:
            - "cb_cents == 15000 (LATE_CHECKIN base, zero prior confirmed -> multiplier 1.0)"
            - "err == ERR_FORBIDDEN (403) for the appeal by vendor2's rep — identity mismatch against chargeback.vendor_id"
            - "cb_status == APPEALED after the appeal by vendor1's rep"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_half_open_window_adjacency_vs_overlap
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_APPOINTMENT_CONFLICT]"
        distinguishing_aspect: |
          Half-open pairwise interval semantics on the Appointment resource:
          window [09:00, 09:30) conflicts with [09:15, 09:45) on the same
          depot but NOT with [09:30, 10:00) — adjacency at the boundary is
          allowed because intervals are half-open.
        test_recipe:
          setup:
            - "Clock 2026-09-01; depot with dock hours 09:00-17:00, 30-minute slots, 1 dock"
            - "One BOOKED appointment 09:00-09:30 on 2026-09-02"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "Bay", code: "BAY", avg_member_income_cents: 5000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Pi Goods", vendor_code: "V160016" }
              as: RegionalOps
              captures: { vendor1_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Rho Goods", vendor_code: "V170017" }
              as: RegionalOps
              captures: { vendor2_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "Bay Depot", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor1_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor1_id}"
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor2_id}", delivery_date: "2026-09-02", start_time: "09:15", end_time: "09:45", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor2_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor2_id}", delivery_date: "2026-09-02", start_time: "09:30", end_time: "10:00", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor2_id}"
              captures: { appt2: $.data.id }
          assert:
            - "err_overlap == ERR_APPOINTMENT_CONFLICT (409) for the 09:15-09:45 window"
            - "Adjacent window 09:30-10:00 succeeds ([09:00,09:30) and [09:30,10:00) do not intersect under half-open semantics)"
            - "Depot has exactly 2 BOOKED appointments for 2026-09-02"

      - name: club_floor_slot_aggregate_capacity_overlap
        grounds:
          - "validations[priority=15]"
          - calculations.club_posture_recompute
          - "errors[ERR_CLUB_CAPACITY_EXCEEDED]"
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the Club resource: occupancy
          is a running sum of floor_slots_reserved against floor_slot_capacity,
          not pairwise window intersection; an allocation pushing the sum
          ABOVE capacity is rejected while one landing exactly AT capacity
          succeeds — different interval semantics and a different resource
          entity than the appointment window case.
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; Club capacity 3"
            - "Oversized item (48x48 footprint -> pallets_per_slot 2) and small item (pallets_per_slot 1), both ACTIVE"
            - "One big pallet already allocated (2 slots used); a second big pallet (would reach 4 > 3) and one small pallet (would land at exactly 3) are received"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "Mesa", code: "MESA", avg_member_income_cents: 5000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Sigma Corp", vendor_code: "V180018" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "Mesa Club", club_number: 1101, floor_slot_capacity: 3, member_base: 1000 }
              as: RegionalOps
              captures: { club_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "Mesa Depot", dock_count: 2, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "1800018", description: "Oversized grill", case_pack_qty: 2, pallet_length_in: 48, pallet_width_in: 48, cases_per_layer: 2, max_layers: 2, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_big: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "1800019", description: "Small spice", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_small: $.data.id }
            - call: "POST /wcd/items/${item_big}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/items/${item_small}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 3 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_big}", unit_qty: 8 }
              as: DepotManager
              captures: { pb1: $.data.id }
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_big}", unit_qty: 8 }
              as: DepotManager
              captures: { pb2: $.data.id }
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_small}", unit_qty: 480 }
              as: DepotManager
              captures: { ps1: $.data.id }
            - call: "POST /wcd/cross-dock-runs"
              payload: { depot_id: "${depot_id}", run_date: "2026-09-02", cutoff_time: "16:00" }
              as: DepotPlanner
              captures: { run_id: $.data.id, run_v: $.data.version }
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pb1}", club_id: "${club_id}", expected_cross_dock_run_version: "${run_v}" }
              as: DepotPlanner
              captures: { big_alloc_slots: $.data.floor_slots_reserved, rv1: $.data.run_version }
          trigger:
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pb2}", club_id: "${club_id}", expected_cross_dock_run_version: "${rv1}" }
              as: DepotPlanner
              captures: { err_over: $.data.error_id }
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${ps1}", club_id: "${club_id}", expected_cross_dock_run_version: "${rv1}" }
              as: DepotPlanner
              captures: { small_alloc: $.data.id }
            - call: "GET /wcd/clubs/${club_id}"
              payload: {}
              as: DepotPlanner
              captures: { final_slots: $.data.allocated_slot_count, final_posture: $.data.posture }
          assert:
            - "big_alloc_slots == 2 (footprint 48x48 = 2304 sq in > 48x40 = 1920 sq in standard slot)"
            - "err_over == ERR_CLUB_CAPACITY_EXCEEDED (2 + 2 = 4 > 3)"
            - "The failed big allocation did not advance the run version, so the small allocation reuses the same expected version and succeeds (2 + 1 = 3 exactly at capacity)"
            - "final_slots == 3 and final_posture == FROZEN (>= capacity)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocation_void_restores_club_slot_invariant
        grounds:
          - state_machines.Allocation.PROPOSED_to_VOIDED
          - calculations.club_posture_recompute
          - entities.Club.fields.allocated_slot_count
        distinguishing_aspect: |
          Conserved quantity: club floor-slot accounting. Forward action
          (allocation create) + compensating action (allocation void) leaves
          club.allocated_slot_count unchanged and returns the pallet to
          RECEIVED — sum of floor_slots_reserved over non-terminal
          allocations is invariant under create+void pairs.
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; Club capacity 40, item pallets_per_slot 1, 1 pallet received 2026-09-02, run OPEN"
            - "Baseline allocated_slot_count == 0"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "Tundra", code: "TNDR", avg_member_income_cents: 5000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Tau Supply", vendor_code: "V190019" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "Tundra Club", club_number: 1201, floor_slot_capacity: 40, member_base: 1000 }
              as: RegionalOps
              captures: { club_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "Tundra Depot", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "1900019", description: "Cereal", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
              captures: { pallet_id: $.data.id }
            - call: "POST /wcd/cross-dock-runs"
              payload: { depot_id: "${depot_id}", run_date: "2026-09-02", cutoff_time: "16:00" }
              as: DepotPlanner
              captures: { run_id: $.data.id, run_v: $.data.version }
          trigger:
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pallet_id}", club_id: "${club_id}", expected_cross_dock_run_version: "${run_v}" }
              as: DepotPlanner
              captures: { alloc_id: $.data.id }
            - call: "GET /wcd/clubs/${club_id}"
              payload: {}
              as: DepotPlanner
              captures: { slots_after_create: $.data.allocated_slot_count }
            - call: "POST /wcd/allocations/${alloc_id}/void"
              payload: { void_reason: "plan changed" }
              as: DepotPlanner
            - call: "GET /wcd/clubs/${club_id}"
              payload: {}
              as: DepotPlanner
              captures: { slots_after_void: $.data.allocated_slot_count, posture_after_void: $.data.posture }
            - call: "GET /wcd/pallets/${pallet_id}"
              payload: {}
              as: DepotPlanner
              captures: { pallet_status_after_void: $.data.status }
          assert:
            - "slots_after_create == 1"
            - "slots_after_void == 0 (invariant restored)"
            - "pallet_status_after_void == RECEIVED (freed for re-allocation)"
            - "posture_after_void == NORMAL"

      - name: purchase_refund_restores_member_cap_usage_invariant
        grounds:
          - state_machines.Purchase.COMPLETED_to_REFUNDED
          - calculations.member_cap_check
          - entities.Purchase.fields.cap_window
        distinguishing_aspect: |
          Conserved quantity of a different type: per-member per-item cap
          usage within a cap window. A COMPLETED purchase of 4 units against
          cap 5 followed by its refund restores the usage ledger so a
          subsequent purchase of 5 succeeds — purchase + refund leaves
          sum(COMPLETED unit_qty) for the window unchanged.
        test_recipe:
          setup:
            - "Clock 2026-09-01; Region, Vendor, Club, ACTIVE item with cap 5; ACTIVE member"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "Glacier", code: "GLCR", avg_member_income_cents: 5000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Upsilon Foods", vendor_code: "V200020" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "Glacier Club", club_number: 1301, floor_slot_capacity: 40, member_base: 1000 }
              as: RegionalOps
              captures: { club_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2000020", description: "Coffee", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR", member_purchase_cap: 5 }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/members"
              payload: { club_id: "${club_id}", membership_number: "M000000501", tier: "EXECUTIVE" }
              as: MembershipDesk
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /wcd/purchases"
              payload: { member_id: "${member_id}", club_id: "${club_id}", item_id: "${item_id}", unit_qty: 4 }
              as: MembershipDesk
              captures: { purchase_id: $.data.id }
            - call: "POST /wcd/purchases/${purchase_id}/refund"
              payload: {}
              as: MembershipDesk
              captures: { refund_status: $.data.status }
            - call: "POST /wcd/purchases"
              payload: { member_id: "${member_id}", club_id: "${club_id}", item_id: "${item_id}", unit_qty: 5 }
              as: MembershipDesk
              captures: { second_status: $.data.status }
          assert:
            - "refund_status == REFUNDED"
            - "Cap usage for window 2026-09-01 is 0 after the refund (REFUNDED purchases excluded from member_cap_check)"
            - "second_status == COMPLETED (usage restored by the compensation; without the refund 4 + 5 > 5 would have failed)"
