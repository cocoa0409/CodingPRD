              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PRIZE_UNAVAILABLE (409)"

      - name: redeem_over_available_stock_insufficient
        claim_type: Aggregate validation
        grounds: ["validations[priority=10]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Reserving quantity 6 when only 5 units are available returns ERR_INSUFFICIENT_STOCK (409)."
        test_recipe:
