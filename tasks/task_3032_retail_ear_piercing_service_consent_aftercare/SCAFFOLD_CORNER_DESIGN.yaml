# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3032_retail_ear_piercing_service_consent_aftercare
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8 covers
# appear as `excluded_because:` stubs with no test_recipe.
#
# YAML anchors (*k_*) reuse setup chains verbatim; the generating pipeline and
# the unit-test-generator both expand them to the identical call sequence.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: jurisdiction_create_returns_config_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Jurisdiction
          - endpoints.POST_/piercing-services/jurisdictions
        distinguishing_aspect: "A jurisdiction created with only the nine required regime fields comes back 201 with status ACTIVE, version 1, permitted_sites round-tripping as a two-element array, and server-generated id / created_at / updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /piercing-services/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - &k_jur_il
              call: "POST /piercing-services/jurisdictions"
              payload: { state_code: "IL", min_age_self_consent: 18, min_age_with_guardian: 6, min_age_absolute: 6, permitted_sites: ["LOBE", "UPPER_LOBE", "HELIX", "TRAGUS"], requires_guardian_presence: false, record_retention_years: 7, consent_form_version: "IL-2026", sterilization_protocol_code: "AUTOCLAVE-B" }
              as: ComplianceOfficer
              captures: { jur_id: "$.data.id" }
            - &k_store
              call: "POST /piercing-services/stores"
              payload: { name: "Chicago Loop", jurisdiction_id: "${jur_id}", piercing_room_count: 4 }
              as: ComplianceOfficer
              captures: { store_id: "$.data.id" }
            - &k_piercer
              call: "POST /piercing-services/piercers"
              payload: { full_name: "Rae Novak", home_store_id: "${store_id}" }
              as: StoreManager
              captures: { p_id: "$.data.id" }
            - &k_p_ver
              call: "GET /piercing-services/piercers/${p_id}"
              payload: { }
              as: AnyAuthenticated
              captures: { p_v: "$.data.version" }
            - &k_cert
              call: "POST /piercing-services/certifications"
              payload: { piercer_id: "${p_id}", certification_level: "STANDARD", sterilization_protocol_code: "AUTOCLAVE-B", issued_at: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z", expected_piercer_version: "${p_v}" }
              as: ComplianceOfficer
              captures: { cert_id: "$.data.id" }
            - &k_customer
              call: "POST /piercing-services/customers"
              payload: { full_name: "Dana Whitfield", date_of_birth: "1996-02-02T00:00:00Z" }
              as: IntakeAssociate
              captures: { cust_id: "$.data.id" }
            - &k_consent
              call: "POST /piercing-services/consents"
              payload: { customer_id: "${cust_id}", jurisdiction_id: "${jur_id}", consent_type: "SELF", identification_type: "GOVERNMENT_PHOTO_ID", identification_number_masked: "****1234", signed_at: "2026-08-30T00:00:00Z" }
              as: IntakeAssociate
              captures: { cons_id: "$.data.id" }
            - &k_consent_verify
              call: "POST /piercing-services/consents/${cons_id}/verify"
              payload: { }
              as: IntakeAssociate
            - &k_cycle
              call: "POST /piercing-services/sterilization-cycles"
              payload: { store_location_id: "${store_id}", autoclave_unit_id: "AUTO-1", protocol_code: "AUTOCLAVE-B", cycle_start_at: "2026-08-30T08:00:00Z", cycle_end_at: "2026-08-30T08:45:00Z", temperature_celsius: 134.0 }
              as: SterilizationTechnician
              captures: { cyc_id: "$.data.id" }
            - &k_cycle_pass
              call: "POST /piercing-services/sterilization-cycles/${cyc_id}/complete"
              payload: { temperature_celsius: 135.0, biological_indicator_passed: true }
              as: SterilizationTechnician
            - &k_store_ver
              call: "GET /piercing-services/stores/${store_id}"
              payload: { }
              as: AnyAuthenticated
              captures: { store_v: "$.data.version" }
            - &k_lot
              call: "POST /piercing-services/cartridge-lots"
              payload: { store_location_id: "${store_id}", sterilization_cycle_id: "${cyc_id}", lot_number: "L-1", site_type: "LOBE", units_received: 50, expiration_date: "2027-01-01T00:00:00Z", expected_store_version: "${store_v}" }
              as: StoreManager
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "GET /piercing-services/jurisdictions/${jur_id}"
              payload: { }
              as: AnyAuthenticated
          assert:
            - "the POST /jurisdictions response status is 201 and response_type is object"
            - "Jurisdiction.${jur_id}.status == ACTIVE"
            - "Jurisdiction.${jur_id}.version == 1"
            - "Jurisdiction.${jur_id}.permitted_sites == [LOBE, UPPER_LOBE, HELIX, TRAGUS]"
            - "the jurisdiction data carries non-null id, created_at and updated_at"

      - name: customer_defaults_are_zeroed_and_status_active_on_creation
        claim_type: Defaults
        grounds:
          - entities.Customer
          - endpoints.POST_/piercing-services/customers
        distinguishing_aspect: "A customer created without any monetary or status input comes back with aftercare_credit_cents, refunded_cents and retained_cents all 0 and status ACTIVE — none of these are client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /piercing-services/customers"
              payload: { full_name: "Dana Whitfield", date_of_birth: "1996-02-02T00:00:00Z" }
              as: IntakeAssociate
              captures: { cust_id: "$.data.id" }
          assert:
            - "Customer.${cust_id}.status == ACTIVE"
            - "Customer.${cust_id}.aftercare_credit_cents == 0"
            - "Customer.${cust_id}.refunded_cents == 0"
            - "Customer.${cust_id}.retained_cents == 0"
            - "Customer.${cust_id}.version == 1"

      - name: jurisdiction_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/piercing-services/jurisdictions/{jurisdictionId}
          - errors[ERR_JURISDICTION_NOT_FOUND]
        distinguishing_aspect: "A GET for a jurisdiction id that was never minted returns ERR_JURISDICTION_NOT_FOUND with status 404 and response_type error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /piercing-services/jurisdictions/00000000-0000-4000-8000-000000000000"
              payload: { }
              as: AnyAuthenticated
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and response_type is error"
            - "the response error_id == ERR_JURISDICTION_NOT_FOUND"

      - name: piercer_create_rejects_unknown_home_store
        claim_type: Parent Relationships
        grounds:
          - entities.Piercer.fields.home_store_id
          - errors[ERR_STORE_NOT_FOUND]
          - endpoints.POST_/piercing-services/piercers
        distinguishing_aspect: "Creating a piercer whose home_store_id names no store is rejected with ERR_STORE_NOT_FOUND rather than creating an orphan row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database; no store has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /piercing-services/piercers"
              payload: { full_name: "Rae Novak", home_store_id: "00000000-0000-4000-8000-000000000000" }
              as: StoreManager
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 404 and response_type is error"
            - "the response error_id == ERR_STORE_NOT_FOUND"

      - name: cartridge_lot_computed_availability_derives_from_received
        claim_type: Computed Fields
        grounds:
          - entities.CartridgeLot
          - calculations.cartridge_lot_availability
          - endpoints.POST_/piercing-services/cartridge-lots
        distinguishing_aspect: "A lot created with units_received 50 and no consumption comes back with units_available 50, units_consumed 0 and units_quarantined 0 — the derived field is computed, never echoed from input."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store S1 and a passed-bound cycle Y1 exist."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
            - *k_cycle
            - *k_cycle_pass
            - *k_store_ver
            - *k_lot
          trigger:
            - call: "GET /piercing-services/cartridge-lots/${lot_id}"
              payload: { }
              as: AnyAuthenticated
          assert:
            - "CartridgeLot.${lot_id}.units_received == 50"
            - "CartridgeLot.${lot_id}.units_available == 50"
            - "CartridgeLot.${lot_id}.units_consumed == 0"
            - "CartridgeLot.${lot_id}.status == AVAILABLE"

      - name: appointment_listing_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/piercing-services/appointments
        distinguishing_aspect: "The appointment list carries the four envelope pagination fields, total_count counts the stored rows, and response_type is array."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One store, piercer, customer, consent and one booked appointment exist."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
            - *k_piercer
            - *k_p_ver
            - *k_cert
            - *k_customer
            - *k_consent
            - *k_consent_verify
            - call: "POST /piercing-services/appointments"
              payload: { store_location_id: "${store_id}", customer_id: "${cust_id}", piercer_id: "${p_id}", jurisdiction_id: "${jur_id}", intake_type: "SCHEDULED", site_requested: "LOBE", slot_start_at: "2026-09-01T09:00:00Z", slot_end_at: "2026-09-01T09:30:00Z" }
              as: IntakeAssociate
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "GET /piercing-services/appointments"
              payload: { }
              as: AnyAuthenticated
          assert:
            - "the response contains limit, offset, total_count and has_more"
            - "the list envelope reports total_count == 1"
            - "the response response_type is array"

      - name: store_retrieval_round_trips_configuration
        claim_type: Retrieval
        grounds:
          - entities.StoreLocation
          - endpoints.GET_/piercing-services/stores/{storeId}
        distinguishing_aspect: "Every store field posted at creation round-trips through GET unchanged, alongside the computed compliance_posture OPEN and open_incident_count 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Jurisdiction IL and store S1 with 4 rooms exist."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
          trigger:
            - call: "GET /piercing-services/stores/${store_id}"
              payload: { }
              as: AnyAuthenticated
          assert:
            - "StoreLocation.${store_id}.name == Chicago Loop"
            - "StoreLocation.${store_id}.piercing_room_count == 4"
            - "StoreLocation.${store_id}.compliance_posture == OPEN"
            - "StoreLocation.${store_id}.open_incident_count == 0"

      - name: consent_type_enum_violation_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ConsentRecord.fields.consent_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A consent carrying a consent_type outside {SELF, GUARDIAN_PRESENT, GUARDIAN_NOTARIZED, COURT_ORDER} is rejected as a malformed request."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Jurisdiction IL and customer C1 exist."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
            - *k_customer
          trigger:
            - call: "POST /piercing-services/consents"
              payload: { customer_id: "${cust_id}", jurisdiction_id: "${jur_id}", consent_type: "FRIEND_PRESENT", identification_type: "GOVERNMENT_PHOTO_ID", identification_number_masked: "****1234", signed_at: "2026-08-30T00:00:00Z" }
              as: IntakeAssociate
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 400 and response_type is error"
            - "the response error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: appointment_new_row_starts_booked_with_zero_reschedules
        claim_type: Initial State
        grounds:
          - entities.Appointment.fields.status
          - endpoints.POST_/piercing-services/appointments
        distinguishing_aspect: "A freshly booked appointment starts in BOOKED with reschedule_count 0, never in a later pipeline state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store, piercer, customer and consent exist."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
            - *k_piercer
            - *k_p_ver
            - *k_cert
            - *k_customer
            - *k_consent
            - *k_consent_verify
            - call: "POST /piercing-services/appointments"
              payload: { store_location_id: "${store_id}", customer_id: "${cust_id}", piercer_id: "${p_id}", jurisdiction_id: "${jur_id}", intake_type: "SCHEDULED", site_requested: "LOBE", slot_start_at: "2026-09-01T09:00:00Z", slot_end_at: "2026-09-01T09:30:00Z" }
              as: IntakeAssociate
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "GET /piercing-services/appointments/${app_id}"
              payload: { }
              as: AnyAuthenticated
          assert:
            - "Appointment.${app_id}.status == BOOKED"
            - "Appointment.${app_id}.reschedule_count == 0"

      - name: revoke_certification_twice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CertificationRecord.VALID_to_REVOKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once a certification is REVOKED it is terminal, so a second revoke is rejected with ERR_INVALID_STATE and the state stays REVOKED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Certification C1 is EXPIRED after its expiry passed."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
            - *k_piercer
            - *k_p_ver
            - *k_cert
            - call: "POST /piercing-services/certifications/${cert_id}/revoke"
              payload: { reason_code: "PROTOCOL_BREACH" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /piercing-services/certifications/${cert_id}/revoke"
              payload: { reason_code: "PROTOCOL_BREACH" }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and response_type is error"
            - "the response error_id == ERR_INVALID_STATE"
            - "CertificationRecord.${cert_id}.status == REVOKED"

      - name: store_freeze_cascades_only_non_terminal_appointments
        claim_type: Side Effect Execution
        grounds:
          - state_machines.StoreLocation.OPEN_to_FROZEN
          - endpoints.POST_/piercing-services/stores/{storeId}/posture/freeze
        distinguishing_aspect: "Freezing a store cancels its BOOKED/CONFIRMED appointments while leaving a COMPLETED appointment untouched, so the cascade is conditional on child state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store S1 holds a COMPLETED appointment A1 and a CONFIRMED appointment A2."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
            - *k_piercer
            - *k_p_ver
            - *k_cert
            - *k_customer
            - *k_consent
            - *k_consent_verify
            - *k_cycle
            - *k_cycle_pass
            - *k_store_ver
            - *k_lot
            - &k_app_done
              call: "POST /piercing-services/appointments"
              payload: { store_location_id: "${store_id}", customer_id: "${cust_id}", piercer_id: "${p_id}", jurisdiction_id: "${jur_id}", intake_type: "SCHEDULED", site_requested: "LOBE", slot_start_at: "2026-09-01T08:00:00Z", slot_end_at: "2026-09-01T08:30:00Z" }
              as: IntakeAssociate
              captures: { app_done: "$.data.id" }
            - call: "POST /piercing-services/appointments/${app_done}/confirm"
              payload: { }
              as: IntakeAssociate
            - call: "POST /piercing-services/appointments/${app_done}/check-in"
              payload: { }
              as: IntakeAssociate
            - call: "POST /piercing-services/appointments/${app_done}/screen"
              payload: { anatomy_sites_examined: ["LOBE"], contraindication_codes: [] }
              as: Piercer
              as_user_id: "${p_id}"
              captures: { scr_done: "$.data.id" }
            - call: "POST /piercing-services/screenings/${scr_done}/evaluate"
              payload: { }
              as: Piercer
              as_user_id: "${p_id}"
            - call: "POST /piercing-services/appointments/${app_done}/start-service"
              payload: { }
              as: Piercer
              as_user_id: "${p_id}"
            - call: "POST /piercing-services/appointments/${app_done}/complete"
              payload: { }
              as: Piercer
              as_user_id: "${p_id}"
            - &k_app_open
              call: "POST /piercing-services/appointments"
              payload: { store_location_id: "${store_id}", customer_id: "${cust_id}", piercer_id: "${p_id}", jurisdiction_id: "${jur_id}", intake_type: "SCHEDULED", site_requested: "LOBE", slot_start_at: "2026-09-01T11:00:00Z", slot_end_at: "2026-09-01T11:30:00Z" }
              as: IntakeAssociate
              captures: { app_open: "$.data.id" }
            - call: "POST /piercing-services/appointments/${app_open}/confirm"
              payload: { }
              as: IntakeAssociate
          trigger:
            - call: "POST /piercing-services/stores/${store_id}/posture/freeze"
              payload: { }
              as: ComplianceOfficer
          assert:
            - "StoreLocation.${store_id}.compliance_posture == FROZEN"
            - "Appointment.${app_done}.status == COMPLETED"
            - "Appointment.${app_open}.status == CANCELLED"

      - name: store_close_rejected_while_a_session_is_in_service
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StoreLocation.RESTRICTED_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing a store while a session is IN_SERVICE on the floor is rejected with ERR_INVALID_STATE, so closure is conditional on child state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store S1 with one session IN_SERVICE."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
            - *k_piercer
            - *k_p_ver
            - *k_cert
            - *k_customer
            - *k_consent
            - *k_consent_verify
            - *k_cycle
            - *k_cycle_pass
            - *k_store_ver
            - *k_lot
            - *k_app_done
            - call: "POST /piercing-services/appointments/${app_done}/confirm"
              payload: { }
              as: IntakeAssociate
            - call: "POST /piercing-services/appointments/${app_done}/check-in"
              payload: { }
              as: IntakeAssociate
            - call: "POST /piercing-services/appointments/${app_done}/screen"
              payload: { anatomy_sites_examined: ["LOBE"], contraindication_codes: [] }
              as: Piercer
              as_user_id: "${p_id}"
              captures: { scr_done: "$.data.id" }
            - call: "POST /piercing-services/screenings/${scr_done}/evaluate"
              payload: { }
              as: Piercer
              as_user_id: "${p_id}"
            - call: "POST /piercing-services/appointments/${app_done}/start-service"
              payload: { }
              as: Piercer
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /piercing-services/stores/${store_id}/close"
              payload: { }
              as: ComplianceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "the response status is 409 and response_type is error"
            - "the response error_id == ERR_INVALID_STATE"
            - "StoreLocation.${store_id}.status == OPEN"

  # ===========================================================================
  - section: calculations
    instances:

      - name: incident_refund_minor_severity_yields_zero
        claim_type: Input Set Filtering
        grounds:
          - calculations.incident_refund_allocation
          - state_machines.IncidentReport.TRIAGED_to_RESOLVED
        distinguishing_aspect: "Severity MINOR falls in the zero tier, so the finalized refund is exactly 0 while the retain floor leaves the whole fee retained."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Session X1 completed with base_fee_cents 4500 and aftercare kit included. Incident I1 severity MINOR, already TRIAGED."
          setup_api_calls:
            - *k_clock
            - *k_jur_il
            - *k_store
            - *k_piercer
            - *k_p_ver
            - *k_cert
            - *k_customer
            - *k_consent
            - *k_consent_verify
            - *k_cycle
            - *k_cycle_pass
            - *k_store_ver
            - *k_lot
            - *k_app_done
            - call: "POST /piercing-services/appointments/${app_done}/confirm"
              payload: { }
              as: IntakeAssociate
            - call: "POST /piercing-services/appointments/${app_done}/check-in"
              payload: { }
              as: IntakeAssociate
            - call: "POST /piercing-services/appointments/${app_done}/screen"
              payload: { anatomy_sites_examined: ["LOBE"], contraindication_codes: [] }
              as: Piercer
              as_user_id: "${p_id}"
              captures: { scr_done: "$.data.id" }
            - call: "POST /piercing-services/screenings/${scr_done}/evaluate"
              payload: { }
              as: Piercer
              as_user_id: "${p_id}"
            - call: "POST /piercing-services/appointments/${app_done}/start-service"
              payload: { }
              as: Piercer
              as_user_id: "${p_id}"
            - call: "POST /piercing-services/appointments/${app_done}/complete"
              payload: { }
              as: Piercer
              as_user_id: "${p_id}"
            - call: "GET /piercing-services/appointments/${app_done}/sessions"
              payload: { }
              as: AnyAuthenticated
              captures: { ses_x: "$.data[0].id" }
            - call: "GET /piercing-services/sessions/${ses_x}"
              payload: { }
              as: AnyAuthenticated
              captures: { ses_x_v: "$.data.version" }
            - call: "POST /piercing-services/incidents"
              payload: { session_id: "${ses_x}", reported_at: "2026-09-10T00:00:00Z", severity: "MINOR", reaction_codes: ["REDNESS"], expected_session_version: "${ses_x_v}" }
              as: ComplianceOfficer
              captures: { inc_x: "$.data.id" }
            - call: "POST /piercing-services/incidents/${inc_x}/triage"
              payload: { }
              as: ComplianceOfficer
          trigger:
            - call: "POST /piercing-services/incidents/${inc_x}/resolve"
              payload: { resolution_note: "Observed only, no treatment." }
              as: ComplianceOfficer
          assert:
            - "IncidentReport.${inc_x}.refund_amount_cents == 0"
            - "IncidentReport.${inc_x}.escalation_status == RESOLVED"
