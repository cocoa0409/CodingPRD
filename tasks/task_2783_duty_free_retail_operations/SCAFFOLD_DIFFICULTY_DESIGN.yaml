  - rule_id: transitive_cascade
    instances:
      - name: pickup_cascade_depth_four_duty_status_to_ledger_to_rent_to_basis
        grounds:
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
          - calculations.bonded_duty_suspended_value
          - calculations.concession_rent_accrual
          - entities.ConcessionAgreement.fields.rent_basis
          - entities.BondedMovement.fields.movement_type
        distinguishing_aspect: |
          Depth 4, triggered by POST /sales/{sale_id}/pickup: duty_status EXEMPT_CONFIRMED (L1)
          causes the SALE_ISSUE ledger movement that drops on_hand_qty 20 -> 15 and
          duty_suspended_value_cents 28000 -> 21000 (L2), which lifts the agreement's
          gross_sales_cents 0 -> 100000 and percentage_rent_cents 0 -> 12000 (L3), which flips
          rent_basis MINIMUM_GUARANTEE -> PERCENTAGE (L4). Removing L2 leaves L3 and L4 unreachable.
