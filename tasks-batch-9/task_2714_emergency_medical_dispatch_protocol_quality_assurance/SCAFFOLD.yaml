  - name: AccreditationOfficer
    description: "Accreditation compliance officer: builds and submits the aggregate compliance reports to the medical director and the oversight committee. Cannot touch scores or coaching."
    identity: opaque
    exclusive_operations:
      - "POST /audit-programs/{id}/accreditation-reports"
      - "POST /accreditation-reports/{id}/submit"
    shared_operations:
      - "GET /audit-programs/{id}"
      - "GET /audit-programs/{id}/protocol-versions"
