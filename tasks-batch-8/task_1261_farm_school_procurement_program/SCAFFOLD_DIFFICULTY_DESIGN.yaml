  # uncovered==0 on POST /f2s/substitution-requests - different metrics and
  # endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: window_capacity_exact_limit_boundary
        grounds:
          - entities.ReceivingWindow.fields.capacity_deliveries
          - errors[ERR_WINDOW_CAPACITY_FULL]
        distinguishing_aspect: |
          Count boundary on the delivery metric: a window with
          capacity_deliveries == 2 accepts the 1st and 2nd delivery for the same
          date (count < capacity admits) and rejects exactly the 3rd with
          ERR_WINDOW_CAPACITY_FULL.
        test_recipe:
