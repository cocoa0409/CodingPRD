  - section: cross_cutting_complexity_layers
    instances:
      - name: register_agent_with_a_stale_provider_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.agent-register-stale-provider
          - errors[ERR_STALE_PROVIDER_VERSION]
        distinguishing_aspect: "The rule's own write endpoint is exercised: a version read BEFORE publish-contact bumped the provider is stale by the time register runs, so the call is 412 even though every state precondition is satisfied - and re-reading the provider makes the identical call succeed."
        test_recipe:
          setup:
            - "A provider is created and its version is captured at v1 (before publish-contact)."
            - "publish-contact then bumps the provider version, invalidating the captured token."
            - "One agent is SUBMITTED and ready to register."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id", prov_stale: "$.data.version" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_stale}" }
              as: ComplianceOfficer
            - call: "GET /dmca/providers/${prov_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { prov_fresh: "$.data.version" }
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_fresh}" }
              as: ComplianceOfficer
          assert:
            - "the stale call returns 412 with error_id == ERR_STALE_PROVIDER_VERSION"
            - "after it DesignatedAgent.${agent_id}.registration_status == SUBMITTED and ServiceProviderProfile.${prov_id}.designated_agent_registered == false"
            - "${prov_fresh} != ${prov_stale}"
            - "the fresh call returns 200 with registration_status == REGISTERED"
            - "ServiceProviderProfile.${prov_id}.designated_agent_registered == true and its version advanced again beyond ${prov_fresh}"
