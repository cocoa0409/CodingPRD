              captures: { expo_mid: $.data.reparation_exposure_cents }
            - call: "POST /stb/rate-complaints/${rc1}/reparation-events"
              payload: { event_type: "PAYMENT", amount_cents: 79500 }
              as: CarrierOperator
              as_user_id: "${c1}"
            - call: "GET /stb/carriers/${c1}"
              as: BoardAdjudicator
              captures: { expo_end: $.data.reparation_exposure_cents }
          assert:
            - "before decide: Carrier.${c1}.reparation_exposure_cents == 0"
            - "expo_mid == 79500 (DECIDED complaint contributes its outstanding award)"
            - "expo_end == 0 (complaint CLOSED by full payment)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: decide_response_reflects_new_state_immediately
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/stb/rate-complaints/{complaintId}/decide
        distinguishing_aspect: "Immediate consistency: the decide response body itself carries status DECIDED, decision_outcome UPHELD, prescribed_rate_cents_per_ton 11550, and the award figures — no re-read required to observe the mutation."
        test_recipe:
          setup:
            - "Carrier OKTX with 2025 finding. Complaint in EVIDENTIARY_PHASE with VERIFIED evidence."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/carriers/${c1}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 10.000 }] }
              as: BoardAdjudicator
              captures: { st: $.data.status, pr: $.data.prescribed_rate_cents_per_ton, aw: $.data.award_granted_cents }
          assert:
            - "st == DECIDED and pr == 11550 and aw == 79500 (all in the decide response itself)"
            - "response also carries decision_outcome == UPHELD and award_outstanding_cents == 79500"
