      - name: reliability_penalty_tier_keyed_on_gross_not_net
        grounds:
          - calculations.reliability_shortfall_penalty
          - calculations.technical_dispatch_reliability
          - calculations.monthly_utilization_charge
          - entities.UtilizationPeriod.fields.reliability_penalty_cents
          - entities.UtilizationPeriod.fields.final_charge_cents
        distinguishing_aspect: |
          Mode (c): which intermediate value keys the tier. gross_charge_cents lands on exactly
          5,000,000, the PENALTY_TIER1_GROSS_CENTS boundary; because the tier test is strict
          (gross < 5,000,000 is tier 1), 5,000,000 falls into tier 2 at 3.5%, and with an
          accepted SCHEDULED-basis TDR of 50.00 the deficit factor caps at 9.8, giving
          round_half_up(5,000,000 x 0.035 x 9.8) = 1,715,000 and final_charge 3,285,000.
          Keying the tier on the NET (post-penalty) figure instead would put 3,285,000 below
