  # ================================================== RBAC
  - section: rbac
    instances:
      - name: driver_cannot_create_site
        claim_type: rbac_denial
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Driver role is not in POST /sites roles: 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["driver D exists"]
          setup_api_calls:
            - call: "POST /drivers"
              payload: { name: "D", license_number: "CDL-R1", dot_medical_expires_on: "2027-01-01", vehicle_max_payload_lbs: 2000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { name: "X", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN; http status 403"

      - name: clerk_cannot_confirm_leak
        claim_type: rbac_denial
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Leak confirmation is exclusive to ComplianceOfficer: SiteClerk gets 403."
        test_recipe:
          setup: ["site S with a REPORTED leak"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /leak-reports"
              payload: { site_id: "${s_id}", severity: MINOR }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { lr_id: $.data.id }
          trigger:
            - call: "POST /leak-reports/${lr_id}/confirm"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN; http status 403"

      - name: host_manager_cannot_finalize_statement
        claim_type: rbac_denial
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Finalize is exclusive to PlatformAdmin: HostSiteManager (even of the statement's own site) gets 403."
        test_recipe:
          setup: ["site S; statement exists"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "S", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /commission-statements"
              payload: { site_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-05-01" }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /commission-statements/${st_id}/finalize"
              payload: {}
              as: HostSiteManager
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN; http status 403"

      - name: clerk_cannot_register_fleet_cylinder
        claim_type: rbac_denial
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "SiteClerk may register CUSTOMER cylinders only; FLEET registration by a clerk gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cylinders"
              payload: { serial_number: "SN-FB", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN; http status 403"

      - name: visual_only_technician_cannot_hydrostatic
        claim_type: rbac_denial
        grounds:
          - roles
          - errors[ERR_FORBIDDEN]
          - entities.Technician.fields.cert_level
        distinguishing_aspect: "HYDROSTATIC records require cert_level FULL: a VISUAL_ONLY technician gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["fleet cylinder; technician V with cert_level VISUAL_ONLY"]
          setup_api_calls:
            - call: "POST /cylinders"
              payload: { serial_number: "SN-HY", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "V", cert_level: VISUAL_ONLY }
              as: PlatformAdmin
              captures: { tv_id: $.data.id }
          trigger:
            - call: "POST /certification-records"
              payload: { cylinder_id: "${c_id}", method: HYDROSTATIC, outcome: PASS }
              as: Technician
              as_user_id: "${tv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN; http status 403"

