# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or malformed auth headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed body, missing required field, invalid enum, start >= end" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not declared from current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_policy_version != current Policy.version" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "decider/verifier equals filer" }
  - { id: ERR_MONOPOLISTIC_STATE_EXCLUDED, http: 422, condition: "class assignment or payroll line references a monopolistic state" }
  - { id: ERR_CLASS_CODE_NOT_ON_POLICY, http: 422, condition: "payroll line class not ACTIVE on the policy for that state" }
  - { id: ERR_PAYROLL_PERIOD_OVERLAP, http: 409, condition: "report period collides with existing SUBMITTED/ACCEPTED report or falls outside policy term" }
  - { id: ERR_RATING_TABLE_OVERLAP, http: 409, condition: "new rating table interval overlaps an existing table for the same state" }
  - { id: ERR_RETRO_WINDOW_INVALID, http: 422, condition: "dispute effective_from outside [policy.effective_date, now)" }
  - { id: ERR_BILLING_SUSPENDED, http: 409, condition: "payroll submission while billing_status == SUSPENDED" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a different payload" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "payment amount != invoice.total_cents" }
  - { id: ERR_TAX_FILING_MISSING, http: 422, condition: "audit window quarter lacks a TaxFilingRecord" }
  - { id: ERR_DUPLICATE_INVOICE, http: 409, condition: "attempt to create a second direct invoice for one report" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "operation requires coverage_status == ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Carrier platform operator; owns reference data (rating tables) and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /wc/state-rating-tables", "POST /_clock/set_current_utc", "POST /wc/employers"]
    shared_operations: ["GET /wc/state-rating-tables", "GET /wc/employers", "GET /wc/employers/{id}"]
  - name: Underwriter
    description: "Carrier underwriter; issues/binds/cancels policies and decides class code disputes"
    identity: opaque
    exclusive_operations: ["POST /wc/policies", "POST /wc/policies/{id}/bind", "POST /wc/policies/{id}/cancel", "POST /wc/disputes/{id}/open-review", "POST /wc/disputes/{id}/return-to-filed", "POST /wc/disputes/{id}/decide", "POST /wc/invoices/{id}/void", "POST /wc/audits/{id}/waive"]
    shared_operations: ["GET /wc/policies", "GET /wc/policies/{id}", "GET /wc/policies/{id}/class-codes", "GET /wc/policies/{id}/reports", "GET /wc/policies/{id}/invoices", "GET /wc/policies/{id}/disputes", "GET /wc/policies/{id}/audits", "GET /wc/policies/{id}/tax-filings", "GET /wc/policies/{id}/integration", "GET /wc/payroll-reports/{id}", "GET /wc/payroll-reports/{id}/lines", "GET /wc/invoices/{id}", "GET /wc/disputes/{id}", "GET /wc/audits/{id}", "GET /wc/state-rating-tables"]
  - name: EmployerAdmin
    description: "Employer's admin user; files disputes and pays invoices for their own employer's policies"
    identity: "entity_backed:Employer"
    exclusive_operations: ["POST /wc/disputes", "POST /wc/invoices/{id}/payments"]
    shared_operations: ["GET /wc/policies", "GET /wc/policies/{id}", "GET /wc/policies/{id}/class-codes", "GET /wc/policies/{id}/reports", "GET /wc/policies/{id}/invoices", "GET /wc/policies/{id}/disputes", "GET /wc/policies/{id}/integration", "GET /wc/payroll-reports/{id}", "GET /wc/payroll-reports/{id}/lines", "GET /wc/invoices/{id}", "GET /wc/disputes/{id}", "GET /wc/employers/{id}", "GET /wc/employers/{id}/policies", "GET /wc/state-rating-tables"]
  - name: PayrollProvider
    description: "Integrated payroll provider system user; submits payroll reports and heartbeats"
    identity: opaque
    exclusive_operations: ["POST /wc/payroll-reports", "POST /wc/integrations/{id}/heartbeat"]
    shared_operations: ["GET /wc/policies/{id}", "GET /wc/policies/{id}/class-codes", "GET /wc/policies/{id}/reports", "GET /wc/policies/{id}/integration", "GET /wc/payroll-reports/{id}", "GET /wc/payroll-reports/{id}/lines", "GET /wc/state-rating-tables"]
  - name: TaxFiler
    description: "Employer-side tax filing specialist; records tax filings and files audit reconciliations"
    identity: opaque
    exclusive_operations: ["POST /wc/tax-filings", "POST /wc/audits/{id}/file"]
    shared_operations: ["GET /wc/policies", "GET /wc/policies/{id}", "GET /wc/policies/{id}/audits", "GET /wc/policies/{id}/tax-filings", "GET /wc/audits/{id}", "GET /wc/state-rating-tables"]
  - name: Auditor
    description: "Premium auditor; opens audits and verifies filed reconciliations; must not be the filer"
    identity: opaque
    exclusive_operations: ["POST /wc/audits", "POST /wc/audits/{id}/verify"]
    shared_operations: ["GET /wc/policies", "GET /wc/policies/{id}", "GET /wc/policies/{id}/reports", "GET /wc/policies/{id}/invoices", "GET /wc/policies/{id}/audits", "GET /wc/policies/{id}/tax-filings", "GET /wc/payroll-reports/{id}", "GET /wc/payroll-reports/{id}/lines", "GET /wc/invoices/{id}", "GET /wc/audits/{id}", "GET /wc/state-rating-tables"]
