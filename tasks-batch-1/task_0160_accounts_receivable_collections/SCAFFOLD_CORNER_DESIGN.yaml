            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 30000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
