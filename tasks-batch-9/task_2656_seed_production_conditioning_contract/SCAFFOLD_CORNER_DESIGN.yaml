            - call: "GET /seed-ops/growers/${g_id}"
              payload: {}
              as: SeedInspectorGeneral
              as_user_id: "sig-1"
            - call: "GET /seed-ops/growers/${g_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "First call returns 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The response is NOT 403 and NOT ERR_ROLE_NOT_PERMITTED (priority 1 precedes priority 2)"
            - "Second call, with a declared role, returns 200 with data.id == ${g_id}"

