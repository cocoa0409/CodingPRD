          assert:
            - "HTTP 403 and error_id == ERR_NOT_RESOURCE_OWNER"
      - name: create_listing_invalid_enum_occupancy
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", entities.Listing.fields.occupancy_type]
        distinguishing_aspect: "occupancy_type 'LOFT' is not in {VACANT, OCCUPIED} -> ERR_INVALID_REQUEST (400) before any existence check on seller_id."
