        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - validations.priority_64_ERR_APPROVED_EXCEEDS_FORFEITED
          - endpoints.POST_/refund-exceptions/{id}/decide
          - calculations.guest_refund_scrutiny
          - state_machines[RefundException].transitions
        distinguishing_aspect: "The APPROVED arm of decide is the widest cascade in the domain — exception row, two ledger rows, the reservation's payment_status, Guest.lifetime_refunded_cents, the scrutiny flag and that guest's WAITING waitlist entries. Rejecting it at priority 64 must leave all seven untouched, which is only observable if the cascade is applied atomically after validation rather than incrementally during it. The same exception is then DENIED successfully, proving the row was left usable rather than half-written."
