# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_3374
# §1.9 Coverage Index: every testable claim of SCAFFOLD.yaml §1.1–§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners covered
# by §1.8 appear as excluded_because stubs without test_recipe.
# All money in integer cents. Anchor clock date 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: household_create_defaults_and_computed_fields
        claim_type: Creation
        grounds:
          - entities.Household
          - entities.MembershipTerm
          - endpoints.POST_/api/households
        distinguishing_aspect: "A minimal household creation (no optional fields) returns 201 with status ACTIVE, version 1, auto_renew_enabled false (default), secondary_member_id null, lifetime_collected_cents 1600 (1-year price computed, not client-supplied), and a non-null primary_member_id; the member shows role_in_household PRIMARY."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_hh1
              call: "POST /api/households"
              payload: { state_code: "TX", term_years: 1, primary_full_name: "Ada Adams", primary_date_of_birth: "1970-01-15" }
              as: MemberServicesAgent
              captures: { hh1: $.data.id, hh1_prim: $.data.primary_member_id }
          assert:
            - "the response status is 201, response_type is object, and meta carries api_request_id and api_request_timestamp"
            - "Household.${hh1}.status == ACTIVE and version == 1"
            - "Household.${hh1}.auto_renew_enabled == false (default applied) and secondary_member_id is null"
            - "Household.${hh1}.lifetime_collected_cents == 1600 and lifetime_refunded_cents == 0"
            - "GET /api/households/${hh1}/terms returns 1 row with paid_cents == 1600 (computed by membership_term_pricing), is_renewal == false, status == ACTIVE"
            - "GET /api/households/${hh1}/members returns 1 row with role_in_household == PRIMARY and age_years == 56"

      - name: household_create_with_secondary_member
        claim_type: Creation
        grounds:
          - entities.Household.fields.secondary_member_id
          - entities.Member.fields.role_in_household
        distinguishing_aspect: "Supplying the secondary slot creates a SECOND Member row (role SECONDARY, its own benefit_marketing_opt_out flag honored) at zero additional price — the 3-year household pays 4,320 whether it has one member or two."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/households"
              payload: { state_code: "VT", term_years: 3, primary_full_name: "Ben Bell", primary_date_of_birth: "1968-03-20", secondary_full_name: "Cora Bell", secondary_date_of_birth: "1971-09-12", secondary_benefit_marketing_opt_out: true }
              as: MemberServicesAgent
              captures: { hh2: $.data.id, hh2_sec: $.data.secondary_member_id }
          assert:
            - "the response status is 201 and Household.${hh2}.secondary_member_id is non-null"
            - "GET /api/households/${hh2}/members returns exactly 2 rows: one PRIMARY, one SECONDARY"
            - "the SECONDARY member's benefit_marketing_opt_out == true (stored from creation input)"
            - "GET /api/households/${hh2}/terms returns 1 row with paid_cents == 4320 — the secondary member adds 0 cents"

      - name: provider_created_as_applicant
        claim_type: Creation
        grounds:
          - entities.Provider
          - state_machines.Provider
        distinguishing_aspect: "A new provider starts in APPLICANT with royalty_balance_cents 0 and escalations_trailing_12mo 0; status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/providers"
              payload: { legal_name: "Summit Insurance Group" }
              as: GovernanceOfficer
              captures: { p3_id: $.data.id }
          assert:
            - "the response status is 201 and Provider.${p3_id}.status == APPLICANT"
            - "Provider.${p3_id}.royalty_balance_cents == 0 and escalations_trailing_12mo == 0"
            - "Provider.${p3_id}.version == 1 with non-null id, created_at, updated_at"

      - name: household_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/households/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=6]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the path produces 404 ERR_NOT_FOUND, and the error body carries the §1.0 error envelope shape."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /api/households/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MemberServicesAgent
              captures: { err4: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message; meta carries api_request_id and api_request_timestamp"

      - name: household_create_missing_required_term_years
        claim_type: Required Fields
        grounds:
          - entities.MembershipTerm.fields.term_years
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "term_years is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST from the schema check — NOT the 422 ERR_INVALID_TERM_YEARS that a present-but-unsupported value produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/households"
              payload: { state_code: "TX", primary_full_name: "Dee Daws", primary_date_of_birth: "1970-06-06" }
              as: MemberServicesAgent
              captures: { err5: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "no household was created: a follow-up GET /api/households/{id} for any id would 404"

      - name: invalid_term_years_returns_domain_error
        claim_type: Type Constraints
        grounds:
          - entities.MembershipTerm.fields.term_years
          - errors.ERR_INVALID_TERM_YEARS
          - validations[priority=11]
        distinguishing_aspect: "term_years == 2 is schema-valid JSON but violates the {1,3,5} domain constraint, so the error is 422 ERR_INVALID_TERM_YEARS — distinct from the 400 schema error for a missing field."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/households"
              payload: { state_code: "TX", term_years: 2, primary_full_name: "Ed Edds", primary_date_of_birth: "1970-06-06" }
              as: MemberServicesAgent
              captures: { err6: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_TERM_YEARS"

      - name: household_create_status_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Household.fields.status
          - endpoints.POST_/api/households
        distinguishing_aspect: "status is source: computed; a client-supplied status: LAPSED in the creation payload is ignored and the response still shows the derived ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/households"
              payload: { state_code: "TX", term_years: 1, primary_full_name: "Fay Fenn", primary_date_of_birth: "1972-02-02", status: "LAPSED" }
              as: MemberServicesAgent
              captures: { hh7: $.data.id, hh7_status: $.data.status }
          assert:
            - "the response status is 201 and Household.${hh7}.status == ACTIVE (client input ignored)"

      - name: publication_circulation_recomputed_after_cancel
        claim_type: Computed Fields
        grounds:
          - entities.Publication.fields.circulation_count
          - calculations.circulation_fulfillment
        distinguishing_aspect: "circulation_count is lazily recomputed on every read: cancelling one of the two covering households' terms drops the same publication's count from 2 to 1 without any write to the publication."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; household A (1-year) and household B (3-year) both cover 2026-10-01; publication P with publication_date 2026-10-01, rate card 2000..5000."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/households"
              payload: { state_code: "ME", term_years: 1, primary_full_name: "Gus Gow", primary_date_of_birth: "1969-09-09" }
              as: MemberServicesAgent
              captures: { hh8a: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "ME", term_years: 3, primary_full_name: "Hal Hume", primary_date_of_birth: "1961-01-01" }
              as: MemberServicesAgent
              captures: { hh8b: $.data.id }
            - call: "POST /api/publications"
              payload: { title: "October Issue", publication_date: "2026-10-01", min_cpm_cents: 2000, max_cpm_cents: 5000 }
              as: StandardsReviewer
              captures: { pub8: $.data.id }
            - call: "GET /api/households/${hh8a}/terms"
              payload: {}
              as: MemberServicesAgent
              captures: { term8a: "$.data[0].id" }
          trigger:
            - call: "GET /api/publications/${pub8}"
              payload: {}
              as: StandardsReviewer
              captures: { circ_before: $.data.circulation_count }
            - call: "POST /api/membership-terms/${term8a}/cancel"
              payload: { reason: "VOLUNTARY" }
              as: MemberServicesAgent
            - call: "GET /api/publications/${pub8}"
              payload: {}
              as: StandardsReviewer
              captures: { circ_after: $.data.circulation_count }
          assert:
            - "before cancel: Publication.${pub8}.circulation_count == 2"
            - "after cancel: Publication.${pub8}.circulation_count == 1 (the CANCELLED term never covers, and only household B's ACTIVE 3-year term still covers 2026-10-01)"

      - name: campaign_state_code_conditional_requirement
        claim_type: Required Fields
        grounds:
          - entities.Campaign.fields.state_code
          - validations[priority=5]
        distinguishing_aspect: "state_code is conditionally required: level STATE without it is a 400 schema error, and level FEDERAL with it is equally a 400 schema error — the field's presence is coupled to the level enum."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; LOBBY_ARM entity exists."
          setup_api_calls:
            - *c_clock
            - &c_lob
              call: "POST /api/legal-entities"
              payload: { kind: "LOBBY_ARM", display_name: "Advocacy Lobby Arm", balance_cents: 5000000 }
              as: GovernanceOfficer
              captures: { lob_id: $.data.id }
          trigger:
            - call: "POST /api/campaigns"
              payload: { title: "State Utility Rates", level: "STATE", issue_area: "UTILITIES", start_date: "2026-10-01", end_date: "2026-12-31", sponsor_entity_id: "${lob_id}" }
              as: AdvocacyDirector
              captures: { err9a: $.data.error_id }
            - call: "POST /api/campaigns"
              payload: { title: "Federal Drug Prices", level: "FEDERAL", issue_area: "HEALTHCARE", start_date: "2026-10-01", end_date: "2026-12-31", sponsor_entity_id: "${lob_id}", state_code: "TX" }
              as: AdvocacyDirector
              captures: { err9b: $.data.error_id }
          assert:
            - "STATE campaign without state_code: status 400, error_id == ERR_INVALID_REQUEST"
            - "FEDERAL campaign with state_code present: status 400, error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: cancel_already_cancelled_term_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.MembershipTerm
          - errors.ERR_TERM_NOT_ACTIVE
        distinguishing_aspect: "CANCELLED is terminal for the cancel operation: the second cancel returns 409 ERR_TERM_NOT_ACTIVE and does not change refunded_cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one household with a 1-year ACTIVE term."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/households"
              payload: { state_code: "ID", term_years: 1, primary_full_name: "Ira Iles", primary_date_of_birth: "1960-10-10" }
              as: MemberServicesAgent
              captures: { hh10: $.data.id }
            - call: "GET /api/households/${hh10}/terms"
              payload: {}
              as: MemberServicesAgent
              captures: { term10: "$.data[0].id" }
            - call: "POST /api/membership-terms/${term10}/cancel"
              payload: { reason: "VOLUNTARY" }
              as: MemberServicesAgent
              captures: { refund10: $.data.refunded_cents }
          trigger:
            - call: "POST /api/membership-terms/${term10}/cancel"
              payload: { reason: "VOLUNTARY" }
              as: MemberServicesAgent
              captures: { err10: $.data.error_id }
          assert:
            - "the first cancel succeeded with refunded_cents == 1467 (1600 - 1*133; cancellation month counts as used)"
            - "the second cancel fails: status 409, error_id == ERR_TERM_NOT_ACTIVE"
            - "GET /api/households/${hh10}/terms still shows refunded_cents == 1467 (no double refund)"

      - name: activate_action_from_probation_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.LicenseAgreement
          - errors.ERR_AGREEMENT_STATE
        distinguishing_aspect: "PROBATION -> ACTIVE exists only via the REINSTATE action; sending ACTIVATE from PROBATION is an invalid-from transition returning 409 ERR_AGREEMENT_STATE even though DRAFT -> ACTIVE is legal."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement ACTIVE then manually probated."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Blue River Insurance" }
              as: GovernanceOfficer
              captures: { p11: $.data.id }
            - call: "POST /api/providers/${p11}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { p11_v: $.data.version }
            - call: "POST /api/providers/${p11}/license-agreements"
              payload: { product_category: "INSURANCE_AUTO", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${p11_v}" }
              as: ProviderManager
              as_user_id: "${p11}"
              captures: { a11: $.data.id }
            - call: "POST /api/license-agreements/${a11}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
            - call: "POST /api/license-agreements/${a11}/transitions"
              payload: { action: "PROBATE" }
              as: OversightAnalyst
          trigger:
            - call: "POST /api/license-agreements/${a11}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
              captures: { err11: $.data.error_id }
          assert:
            - "status 409, error_id == ERR_AGREEMENT_STATE"
            - "LicenseAgreement.${a11}.status remains PROBATION with probation_count == 1"

      - name: finalize_superseded_statement_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RoyaltyStatement
          - errors.ERR_STATEMENT_NOT_PROVISIONAL
        distinguishing_aspect: "A SUPERSEDED statement is terminal for finalize; only the live PROVISIONAL row for the quarter can be finalized."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement ACTIVE (TRAVEL_SERVICES, window 2026-01-01..2030-12-31); Q1 statement submitted (1,000,000 sales -> provisional 80,000) then superseded by a corrected resubmission (1,500,000 -> provisional 120,000)."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Wander Travel Co" }
              as: GovernanceOfficer
              captures: { p12: $.data.id }
            - call: "POST /api/providers/${p12}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { p12_v: $.data.version }
            - call: "POST /api/providers/${p12}/license-agreements"
              payload: { product_category: "TRAVEL_SERVICES", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${p12_v}" }
              as: ProviderManager
              as_user_id: "${p12}"
              captures: { a12: $.data.id }
            - call: "POST /api/license-agreements/${a12}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
              captures: { a12_v2: $.data.version }
            - call: "POST /api/license-agreements/${a12}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 1, reported_sales_cents: 1000000, expected_agreement_version: "${a12_v2}" }
              as: ProviderManager
              as_user_id: "${p12}"
              captures: { s12_old: $.data.id }
            - call: "GET /api/license-agreements/${a12}"
              payload: {}
              as: FinanceController
              as_user_id: "fin-7"
              captures: { a12_v3: $.data.version }
            - call: "POST /api/license-agreements/${a12}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 1, reported_sales_cents: 1500000, expected_agreement_version: "${a12_v3}" }
              as: ProviderManager
              as_user_id: "${p12}"
              captures: { s12_new: $.data.id }
          trigger:
            - call: "POST /api/royalty-statements/${s12_old}/finalize"
              payload: { audited_sales_cents: 1000000 }
              as: FinanceController
              as_user_id: "fin-7"
              captures: { err12: $.data.error_id }
          assert:
            - "status 409, error_id == ERR_STATEMENT_NOT_PROVISIONAL (the superseded row is terminal)"
            - "RoyaltyStatement.${s12_old}.status == SUPERSEDED and RoyaltyStatement.${s12_new}.status == PROVISIONAL"

      - name: resolve_from_filed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Complaint
          - errors.ERR_COMPLAINT_STATE
        distinguishing_aspect: "RESOLVE requires UNDER_REVIEW or ESCALATED; a FILED complaint cannot skip review."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED with ACTIVE agreement; one good-standing member; one FILED complaint."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Peak Home Services" }
              as: GovernanceOfficer
              captures: { p13: $.data.id }
            - call: "POST /api/providers/${p13}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { p13_v: $.data.version }
            - call: "POST /api/providers/${p13}/license-agreements"
              payload: { product_category: "HOME_SERVICES", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${p13_v}" }
              as: ProviderManager
              as_user_id: "${p13}"
              captures: { a13: $.data.id }
            - call: "POST /api/license-agreements/${a13}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
            - call: "POST /api/households"
              payload: { state_code: "WY", term_years: 1, primary_full_name: "Joy Judd", primary_date_of_birth: "1965-05-05" }
              as: MemberServicesAgent
              captures: { hh13: $.data.id, m13: $.data.primary_member_id }
            - call: "POST /api/complaints"
              payload: { member_id: "${m13}", license_agreement_id: "${a13}", category: "SERVICE", severity: "LOW", description: "slow callback" }
              as: Member
              as_user_id: "${m13}"
              captures: { c13: $.data.id, c13_status: $.data.status }
          trigger:
            - call: "POST /api/complaints/${c13}/adjudicate"
              payload: { action: "RESOLVE", resolution_code: "EXPLAINED" }
              as: OversightAnalyst
              captures: { err13: $.data.error_id }
          assert:
            - "the complaint starts in FILED (initial state observed at creation)"
            - "RESOLVE from FILED fails: status 409, error_id == ERR_COMPLAINT_STATE"

      - name: approve_rejected_transfer_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.FundTransfer
          - errors.ERR_TRANSFER_STATE
        distinguishing_aspect: "REJECTED is terminal: a second approval attempt on the rejected transfer returns 409 ERR_TRANSFER_STATE, proving terminal-state lockdown of the governance machine."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; MEMBERSHIP_ORG (100,000,000) and FOUNDATION (200,000,000) exist; a transfer requested by gov-1 has been REJECTED by fin-7."
          setup_api_calls:
            - *c_clock
            - &c_mo
              call: "POST /api/legal-entities"
              payload: { kind: "MEMBERSHIP_ORG", display_name: "Membership Organization", balance_cents: 100000000 }
              as: GovernanceOfficer
              captures: { mo_id: $.data.id }
            - &c_fdn
              call: "POST /api/legal-entities"
              payload: { kind: "FOUNDATION", display_name: "Charitable Foundation", balance_cents: 200000000 }
              as: GovernanceOfficer
              captures: { fdn_id: $.data.id }
            - call: "POST /api/fund-transfers"
              payload: { from_entity_id: "${fdn_id}", to_entity_id: "${mo_id}", amount_cents: 5000000, purpose: "grant request" }
              as: GovernanceOfficer
              as_user_id: "gov-1"
              captures: { tx14: $.data.id }
            - call: "POST /api/fund-transfers/${tx14}/approve"
              payload: { decision: "REJECT" }
              as: FinanceController
              as_user_id: "fin-7"
          trigger:
            - call: "POST /api/fund-transfers/${tx14}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fin-7"
              captures: { err14: $.data.error_id }
          assert:
            - "status 409, error_id == ERR_TRANSFER_STATE"
            - "balances unchanged: FOUNDATION 200,000,000 and MEMBERSHIP_ORG 100,000,000"

      - name: escalated_complaint_resolve_clears_threshold_count
        claim_type: Valid Transition
        grounds:
          - state_machines.Complaint.ESCALATED_to_RESOLVED
          - calculations.escalation_threshold_eval
        distinguishing_aspect: "ESCALATED -> RESOLVED is a valid backward-ish branch with a live side effect: only ESCALATED complaints count toward the trailing threshold, so resolving the agreement's single escalation drops escalations_trailing_12mo from 1 to 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement ACTIVE; one good-standing member; one complaint opened and escalated."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Golden Years Insurance" }
              as: GovernanceOfficer
              captures: { p15: $.data.id }
            - call: "POST /api/providers/${p15}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { p15_v: $.data.version }
            - call: "POST /api/providers/${p15}/license-agreements"
              payload: { product_category: "INSURANCE_LIFE", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${p15_v}" }
              as: ProviderManager
              as_user_id: "${p15}"
              captures: { a15: $.data.id }
            - call: "POST /api/license-agreements/${a15}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
            - call: "POST /api/households"
              payload: { state_code: "UT", term_years: 1, primary_full_name: "Kay Kidd", primary_date_of_birth: "1962-12-12" }
              as: MemberServicesAgent
              captures: { hh15: $.data.id, m15: $.data.primary_member_id }
            - call: "POST /api/complaints"
              payload: { member_id: "${m15}", license_agreement_id: "${a15}", category: "CLAIMS", severity: "HIGH", description: "claim mishandled" }
              as: Member
              as_user_id: "${m15}"
              captures: { c15: $.data.id }
            - call: "POST /api/complaints/${c15}/adjudicate"
              payload: { action: "OPEN_REVIEW" }
              as: OversightAnalyst
            - call: "POST /api/complaints/${c15}/adjudicate"
              payload: { action: "ESCALATE" }
              as: OversightAnalyst
          trigger:
            - call: "POST /api/complaints/${c15}/adjudicate"
              payload: { action: "RESOLVE", resolution_code: "PROVIDER_FIXED" }
              as: OversightAnalyst
              captures: { c15_status: $.data.status }
          assert:
            - "Complaint.${c15}.status == RESOLVED and resolution_code == \"PROVIDER_FIXED\""
            - "GET /api/license-agreements/${a15} shows escalations_trailing_12mo == 0 (RESOLVED complaints do not count) while the agreement remains ACTIVE (1 < 3 throughout)"

      - name: mobilization_on_closed_campaign_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Campaign
          - errors.ERR_CAMPAIGN_NOT_ACTIVE
        distinguishing_aspect: "The CLOSED side of the campaign window (clock date > end_date) blocks mobilization exactly like the UPCOMING side — §1.8 covers UPCOMING, this corner pins CLOSED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; LOBBY_ARM entity; campaign window 2026-09-01..2026-09-30 (ACTIVE at the anchor)."
          setup_api_calls:
            - *c_clock
            - *c_lob
            - call: "POST /api/campaigns"
              payload: { title: "September Push", level: "FEDERAL", issue_area: "RETIREMENT", start_date: "2026-09-01", end_date: "2026-09-30", sponsor_entity_id: "${lob_id}" }
              as: AdvocacyDirector
              captures: { camp16: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/campaigns/${camp16}/mobilizations"
              payload: { channel: "MAIL", audience_spec: {} }
              as: AdvocacyDirector
              captures: { err16: $.data.error_id }
          assert:
            - "status 409, error_id == ERR_CAMPAIGN_NOT_ACTIVE"
            - "GET /api/campaigns/${camp16} shows computed_status == CLOSED (2026-10-15 > end_date 2026-09-30)"

      - name: term_coverage_half_open_boundary
        claim_type: Side Effect Execution
        grounds:
          - calculations.circulation_fulfillment
          - calculations.household_standing
          - entities.MembershipTerm.fields.end_date
        distinguishing_aspect: "Coverage is half-open [start_date, end_date): a publication dated exactly on a term's end_date is NOT covered by it (circulation 0, ad booking rejected), while one day earlier IS covered — and because standing is coverage-derived, the household reads LAPSED at its end_date even before the renewal sweep has flipped the term row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; household with a 1-year term (2026-09-01..2027-09-01), auto_renew off."
            - "Publication P_early dated 2027-08-31 and P_boundary dated 2027-09-01, rate cards 2000..5000."
            - "Clock advanced to 2027-09-01T00:00:00Z; the renewal batch has NOT been run, so the term row still reads ACTIVE."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/households"
              payload: { state_code: "KS", term_years: 1, primary_full_name: "Lou Lamm", primary_date_of_birth: "1959-07-07", auto_renew_enabled: false }
              as: MemberServicesAgent
              captures: { hh17: $.data.id }
            - call: "POST /api/publications"
              payload: { title: "Boundary Eve Issue", publication_date: "2027-08-31", min_cpm_cents: 2000, max_cpm_cents: 5000 }
              as: StandardsReviewer
              captures: { pub17a: $.data.id }
            - call: "POST /api/publications"
              payload: { title: "Boundary Day Issue", publication_date: "2027-09-01", min_cpm_cents: 2000, max_cpm_cents: 5000 }
              as: StandardsReviewer
              captures: { pub17b: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/publications/${pub17a}"
              payload: {}
              as: StandardsReviewer
              captures: { circ17a: $.data.circulation_count }
            - call: "GET /api/publications/${pub17b}"
              payload: {}
              as: StandardsReviewer
              captures: { circ17b: $.data.circulation_count }
            - call: "POST /api/publications/${pub17b}/ad-bookings"
              payload: { advertiser_name: "Sunset Cruises", category: "TRAVEL", agreed_cpm_cents: 3000 }
              as: StandardsReviewer
              captures: { err17: $.data.error_id }
            - call: "GET /api/households/${hh17}"
              payload: {}
              as: MemberServicesAgent
              captures: { hh17_status: $.data.status }
          assert:
            - "Publication.${pub17a}.circulation_count == 1 (2027-08-31 < end_date 2027-09-01, term still ACTIVE)"
            - "Publication.${pub17b}.circulation_count == 0 (publication_date == end_date is OUTSIDE the half-open window)"
            - "the ad booking on the boundary-day issue fails: status 422, error_id == ERR_NO_CIRCULATION_BASE"
            - "Household.${hh17}.status == LAPSED even though its term row is still ACTIVE (standing is coverage-derived; the sweep is what flips the term row)"

  # ===========================================================================
  - section: calculations
    instances:

      - name: royalty_tier1_cap_boundary_crossing
        claim_type: Correct Result
        grounds:
          - calculations.royalty_marginal_tiers
        distinguishing_aspect: "Tier-1 boundary precision: a statement whose sales land exactly on the 100,000,000-cent tier-1 cap pays 8,000,000 (entirely at 8%); the next statement's first 100 cents cross into tier 2 at 10% for a royalty of exactly 10."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement INSURANCE_HEALTH ACTIVE (window 2026-01-01..2030-12-31)."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Capstone Health Mutual" }
              as: GovernanceOfficer
              captures: { p18: $.data.id }
            - call: "POST /api/providers/${p18}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { p18_v: $.data.version }
            - call: "POST /api/providers/${p18}/license-agreements"
              payload: { product_category: "INSURANCE_HEALTH", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${p18_v}" }
              as: ProviderManager
              as_user_id: "${p18}"
              captures: { a18: $.data.id }
            - call: "POST /api/license-agreements/${a18}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
              captures: { a18_v2: $.data.version }
          trigger:
            - call: "POST /api/license-agreements/${a18}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 1, reported_sales_cents: 100000000, expected_agreement_version: "${a18_v2}" }
              as: ProviderManager
              as_user_id: "${p18}"
              captures: { s18a: $.data.id, s18a_prov: $.data.provisional_royalty_cents }
            - call: "GET /api/license-agreements/${a18}"
              payload: {}
              as: FinanceController
              as_user_id: "fin-7"
              captures: { a18_v3: $.data.version }
            - call: "POST /api/license-agreements/${a18}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 2, reported_sales_cents: 100, expected_agreement_version: "${a18_v3}" }
              as: ProviderManager
              as_user_id: "${p18}"
              captures: { s18b: $.data.id, s18b_prov: $.data.provisional_royalty_cents }
          assert:
            - "RoyaltyStatement.${s18a}.provisional_royalty_cents == 8000000 (100,000,000 * 0.08 exactly at the tier-1 cap; the cap is inclusive)"
            - "RoyaltyStatement.${s18b}.provisional_royalty_cents == 10 (YTD-before 100,000,000 exhausts tier 1, so the 100 cents land entirely in tier 2 at 10%)"
            - "Provider.${p18}.royalty_balance_cents == 8000010"

      - name: initial_term_pricing_constants
        claim_type: Constants Applied
        grounds:
          - calculations.membership_term_pricing
          - entities.MembershipTerm.fields.paid_cents
        distinguishing_aspect: "The initial-purchase constants produce exactly 1,600 / 4,320 / 6,400 for 1/3/5-year terms — no loyalty component (is_renewal false) and the multi-year discounts 0% / 10% / 20% applied to the 1,600 base."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/households"
              payload: { state_code: "IA", term_years: 1, primary_full_name: "Meg May", primary_date_of_birth: "1970-01-01" }
              as: MemberServicesAgent
              captures: { hh19a: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "IA", term_years: 3, primary_full_name: "Ned Nye", primary_date_of_birth: "1970-01-01" }
              as: MemberServicesAgent
              captures: { hh19b: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "IA", term_years: 5, primary_full_name: "Opal Orr", primary_date_of_birth: "1970-01-01" }
              as: MemberServicesAgent
              captures: { hh19c: $.data.id }
          assert:
            - "GET /api/households/${hh19a}/terms -> [0].paid_cents == 1600 (1600*1*1.00)"
            - "GET /api/households/${hh19b}/terms -> [0].paid_cents == 4320 (1600*3*0.90)"
            - "GET /api/households/${hh19c}/terms -> [0].paid_cents == 6400 (1600*5*0.80)"
            - "Household.${hh19c}.lifetime_collected_cents == 6400"

      - name: lobbying_annual_cap_boundary
        claim_type: Correct Result
        grounds:
          - calculations.fund_transfer_governance
          - errors.ERR_ANNUAL_CAP_EXCEEDED
        distinguishing_aspect: "The lobbying cap is round_down(0.20 * net dues YTD) with an inclusive <= comparison: with dues 12,800 the cap is exactly 2,560, so a 2,560 transfer EXECUTES and the next 1-cent transfer is rejected."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; two households buy 5-year terms in calendar 2026 (dues revenue YTD = 6,400 + 6,400 = 12,800, no refunds)."
            - "MEMBERSHIP_ORG balance 100,000,000; LOBBY_ARM balance 5,000,000."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/households"
              payload: { state_code: "MO", term_years: 5, primary_full_name: "Pam Poe", primary_date_of_birth: "1966-06-06" }
              as: MemberServicesAgent
              captures: { hh20a: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "MO", term_years: 5, primary_full_name: "Rex Rudd", primary_date_of_birth: "1964-04-04" }
              as: MemberServicesAgent
              captures: { hh20b: $.data.id }
            - *c_mo
            - *c_lob
            - call: "POST /api/fund-transfers"
              payload: { from_entity_id: "${mo_id}", to_entity_id: "${lob_id}", amount_cents: 2560, purpose: "Q3 advocacy funding" }
              as: GovernanceOfficer
              as_user_id: "gov-1"
              captures: { tx20a: $.data.id }
          trigger:
            - call: "POST /api/fund-transfers/${tx20a}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fin-7"
              captures: { tx20a_status: $.data.status, tx20a_from_after: $.data.from_balance_after_cents, tx20a_to_after: $.data.to_balance_after_cents }
            - call: "POST /api/fund-transfers"
              payload: { from_entity_id: "${mo_id}", to_entity_id: "${lob_id}", amount_cents: 1, purpose: "one more cent" }
              as: GovernanceOfficer
              as_user_id: "gov-1"
              captures: { tx20b: $.data.id }
            - call: "POST /api/fund-transfers/${tx20b}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fin-7"
              captures: { err20: $.data.error_id }
          assert:
            - "the 2,560-cent transfer EXECUTES (2,560 <= round_down(0.20*12,800) = 2,560 at the inclusive boundary): from_balance_after_cents == 99997440, to_balance_after_cents == 5002560"
            - "the 1-cent transfer is rejected on approval: status 422, error_id == ERR_ANNUAL_CAP_EXCEEDED (2,560 + 1 > 2,560)"
            - "FundTransfer.${tx20b}.status remains PENDING_APPROVAL"

      - name: ad_cost_estimate_rounding_half_up
        claim_type: Precision
        grounds:
          - calculations.ad_cost_estimate
          - entities.AdBooking.fields.estimated_cost_cents
        distinguishing_aspect: "estimated_cost_cents rounds half-up exactly once: 2,500 cpm over a circulation of 3 gives round_half_up(7.5) == 8 — not 7 (floor/banker's) and not 7.5 left fractional."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; three households with 1-year terms (all cover 2026-10-01); publication dated 2026-10-01 with rate card 2000..5000."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/households"
              payload: { state_code: "MS", term_years: 1, primary_full_name: "Sal Sudd", primary_date_of_birth: "1963-03-03" }
              as: MemberServicesAgent
              captures: { hh21a: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "MS", term_years: 1, primary_full_name: "Tess Todd", primary_date_of_birth: "1961-01-01" }
              as: MemberServicesAgent
              captures: { hh21b: $.data.id }
            - call: "POST /api/households"
              payload: { state_code: "MS", term_years: 1, primary_full_name: "Uma Uhl", primary_date_of_birth: "1971-11-11" }
              as: MemberServicesAgent
              captures: { hh21c: $.data.id }
            - call: "POST /api/publications"
              payload: { title: "Autumn Issue", publication_date: "2026-10-01", min_cpm_cents: 2000, max_cpm_cents: 5000 }
              as: StandardsReviewer
              captures: { pub21: $.data.id }
          trigger:
            - call: "POST /api/publications/${pub21}/ad-bookings"
              payload: { advertiser_name: "Riverboat Tours", category: "TRAVEL", agreed_cpm_cents: 2500 }
              as: StandardsReviewer
              captures: { ad21: $.data.id, ad21_cost: $.data.estimated_cost_cents }
          assert:
            - "the publication's circulation_count at booking time == 3"
            - "AdBooking.${ad21}.estimated_cost_cents == 8 (round_half_up(2500 * 3 / 1000) = round_half_up(7.5))"
            - "AdBooking.${ad21}.status == BOOKED"

      - name: auto_probation_threshold_crossing
        claim_type: violation_to_error
        grounds:
          - calculations.escalation_threshold_eval
          - state_machines.LicenseAgreement.ACTIVE_to_PROBATION
        excluded_because:
          difficulty_instance: "boundary_precision_check / third_escalation_exactly_triggers_probation"
          rationale: "The >= threshold crossing at exactly 3 escalations (and non-crossing at 2) is asserted step-by-step in the named §1.8 instance."

      - name: provider_suspension_conditional_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Provider.LICENSED_to_SUSPENDED
        excluded_because:
          difficulty_instance: "transitive_cascade / complaint_escalation_three_hop_cascade"
          rationale: "The conditional cascade (only still-ACTIVE sibling agreements move to PROBATION) and its version increments are asserted in the named §1.8 instance."

      - name: renewal_loyalty_price_and_window
        claim_type: Correct Result
        grounds:
          - calculations.membership_term_pricing
        excluded_because:
          difficulty_instance: "combinatorial_formula / renewal_pricing_discount_cap_nested_min"
          rationale: "Renewal pricing including the loyalty discount and the discount cap is asserted with literal values in the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: household_create_missing_auth_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request without a valid X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role, schema, or existence check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/households"
              payload: { state_code: "TX", term_years: 1, primary_full_name: "Val Vann", primary_date_of_birth: "1970-01-01" }
              as: ""
              captures: { err22: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"

      - name: provider_admit_forbidden_for_member_services
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
          - roles.GovernanceOfficer
        distinguishing_aspect: "Admission is GovernanceOfficer-exclusive; MemberServicesAgent (a role that legitimately touches households and chapters) gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one APPLICANT provider exists."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Plainview Insurance" }
              as: GovernanceOfficer
              captures: { p23: $.data.id }
          trigger:
            - call: "POST /api/providers/${p23}/admit"
              payload: {}
              as: MemberServicesAgent
              captures: { err23: $.data.error_id }
          assert:
            - "status 403, error_id == ERR_FORBIDDEN"
            - "Provider.${p23}.status remains APPLICANT and version remains 1"

      - name: agreement_create_forbidden_for_other_provider
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors.ERR_FORBIDDEN
          - roles.ProviderManager
        distinguishing_aspect: "ProviderManager is entity-backed: presenting provider B's id as X-User-ID while writing under provider A's path is a 403 ownership failure that fires BEFORE the OCC version check (priority 3 < 7)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; providers A and B exist; A is LICENSED (version 2 after admission)."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Northstar Insurance" }
              as: GovernanceOfficer
              captures: { p24a: $.data.id }
            - call: "POST /api/providers"
              payload: { legal_name: "Southfield Services" }
              as: GovernanceOfficer
              captures: { p24b: $.data.id }
            - call: "POST /api/providers/${p24a}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { p24a_v: $.data.version }
          trigger:
            - call: "POST /api/providers/${p24a}/license-agreements"
              payload: { product_category: "INSURANCE_AUTO", effective_from: "2026-01-01", effective_to: "2030-12-31", expected_provider_version: "${p24a_v}" }
              as: ProviderManager
              as_user_id: "${p24b}"
              captures: { err24: $.data.error_id }
          assert:
            - "status 403, error_id == ERR_FORBIDDEN (ownership), NOT 412 ERR_STALE_PROVIDER_VERSION — the presented version was actually current, proving ownership fired first"
            - "Provider.${p24a}.version remains 2 (no agreement was created)"

      - name: cancel_unknown_term_returns_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Existence (priority 6) precedes state (priority 8): an unknown term id gets 404 ERR_NOT_FOUND even though a state error would be meaningless here — the server must not leak existence through a state error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /api/membership-terms/00000000-0000-4000-8000-000000000000/cancel"
              payload: { reason: "VOLUNTARY" }
              as: MemberServicesAgent
              captures: { err25: $.data.error_id }
          assert:
            - "status 404, error_id == ERR_NOT_FOUND"

      - name: self_approval_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors.ERR_SELF_APPROVAL
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties is keyed on the PERSON, not the role pair: a FinanceController who happens to carry the requester's X-User-ID is rejected 403 ERR_SELF_APPROVAL even though the role itself is allowed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; MEMBERSHIP_ORG (100,000,000) and FOUNDATION (200,000,000) exist; transfer requested by X-User-ID gov-1."
          setup_api_calls:
            - *c_clock
            - *c_mo
            - *c_fdn
            - call: "POST /api/fund-transfers"
              payload: { from_entity_id: "${fdn_id}", to_entity_id: "${mo_id}", amount_cents: 1000000, purpose: "program grant" }
              as: GovernanceOfficer
              as_user_id: "gov-1"
              captures: { tx26: $.data.id }
          trigger:
            - call: "POST /api/fund-transfers/${tx26}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "gov-1"
              captures: { err26: $.data.error_id }
          assert:
            - "status 403, error_id == ERR_SELF_APPROVAL"
            - "FundTransfer.${tx26}.status remains PENDING_APPROVAL and both balances are unchanged"

      - name: activate_outside_window_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=11]
          - errors.ERR_AGREEMENT_NOT_IN_WINDOW
        distinguishing_aspect: "Creation tolerates any window, but ACTIVATE validates the clock date against [effective_from, effective_to] inclusive: activating six months after the window closed is a 422."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; provider LICENSED; agreement drafted with window 2026-01-01..2026-12-31; clock then advanced to 2027-06-01."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/providers"
              payload: { legal_name: "Timely Insurance" }
              as: GovernanceOfficer
              captures: { p27: $.data.id }
            - call: "POST /api/providers/${p27}/admit"
              payload: {}
              as: GovernanceOfficer
              captures: { p27_v: $.data.version }
            - call: "POST /api/providers/${p27}/license-agreements"
              payload: { product_category: "INSURANCE_HEALTH", effective_from: "2026-01-01", effective_to: "2026-12-31", expected_provider_version: "${p27_v}" }
              as: ProviderManager
              as_user_id: "${p27}"
              captures: { a27: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/license-agreements/${a27}/transitions"
              payload: { action: "ACTIVATE" }
              as: GovernanceOfficer
              captures: { err27: $.data.error_id }
          assert:
            - "status 422, error_id == ERR_AGREEMENT_NOT_IN_WINDOW"
            - "LicenseAgreement.${a27}.status remains DRAFT"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: complaints_list_filters_and_pagination
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/complaints
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Filter + paginate interact: three FILED complaints on one agreement return 2 rows with total_count 3 and has_more true at limit=2&offset=0, the remaining row with has_more false at offset=2; the member_id filter narrows the same set; omitted pagination uses limit 10 / offset 0."
        test_recipe:
