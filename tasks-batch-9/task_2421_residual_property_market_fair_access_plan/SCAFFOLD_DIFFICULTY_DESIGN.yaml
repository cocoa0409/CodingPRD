          different metric and a different endpoint from the declination-window instance: filed 880 over
          voluntary 800 rounds to exactly 0.1000 and is admissible, while filed 879 over the same 800
          rounds to 0.0988 and is rejected with ERR_RATE_BELOW_VOLUNTARY_FLOOR (422).
