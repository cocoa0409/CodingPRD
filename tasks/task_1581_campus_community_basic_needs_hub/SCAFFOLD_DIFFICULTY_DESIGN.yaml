  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: 168h visit-window edge (strict >) on
  # pantry check-in vs exact-allotment points edge (inclusive <=) on checkout.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: visit_frequency_third_visit_rejected_then_allowed_at_exact_168h
        grounds:
          - calculations.visit_frequency_check
          - validations[priority=14]
          - errors[ERR_VISIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric = rolling-window visit count, endpoint = POST /clients/{cid}/pantry-visits:
          the 3rd visit inside 168h is rejected, but at exactly 168h after the first visit
          the strict `visit_date > now - 168h` edge EXCLUDES that first visit, so the same
          request succeeds — one second of clock position flips the outcome.
        test_recipe:
          setup:
