# =============================================================================
# PRD Benchmark Scaffold — Meat & Protein Wholesale Trading (protein trading desk)
# =============================================================================

scenario: |
  2025. Meat & Protein Wholesale Trading (protein trading desk): carcass/primal purchase & cutout value, yield conversion & specification (trim/fat) compliance, cold storage position & aging, forward contract vs spot & hedging exposure, USDA grading & inspection documentation, load-out & LTL/temperature control, rejection at receiving & claim, weekly price sheet & customer allocation

domain_name: protein-trading-desk
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: establishment_number, type: string, source: input, description: "USDA establishment number; unique across suppliers" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; starts ACTIVE", default: ACTIVE }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded at suspension; null when ACTIVE" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: customer_code, type: string, source: input, description: "Unique customer code" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum permitted outstanding exposure in cents" }
      - { name: allocation_tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3; allocation waterfall priority, TIER_1 first" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CREDIT_HOLD; system-managed from exposure vs credit_limit", default: ACTIVE }
      - { name: outstanding_exposure_cents, type: integer, source: computed, description: "Value of allocations in CONFIRMED or SHIPPED status minus settled claim credits, floored at 0 (calc customer_credit_exposure)", default: 0 }

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cold storage site name" }
      - { name: zone, type: enum, source: input, description: "CHILLER | FROZEN" }
      - { name: capacity_lbs, type: integer, source: input, description: "Maximum aggregate stored weight in lbs" }
      - { name: occupied_lbs, type: number, source: computed, description: "Sum of current_weight_lbs of lots here with status IN_INSPECTION, AVAILABLE, or QUARANTINED (calc warehouse_occupancy)", default: 0 }

  - name: Product
    parent: null
    common_fields: false
    fields:
      - { name: product_code, type: string, source: input, description: "Unique trade item code" }
      - { name: kind, type: enum, source: input, description: "CARCASS | PRIMAL | SUBPRIMAL" }
      - { name: species, type: enum, source: input, description: "BEEF | PORK" }
      - { name: max_fat_pct, type: number, source: input, description: "Specification limit: measured fat percent must be <= this value; null for CARCASS kind (always compliant)" }
      - { name: shelf_life_days, type: integer, source: input, description: "Days from production_date after which lot auto-expires" }
      - { name: required_temp_max_f, type: number, source: input, description: "Shipment temperature ceiling; a reading strictly greater breaches compliance" }

  - name: PriceSheet
    parent: null
    common_fields: true
    fields:
      - { name: week_start_date, type: string, source: input, description: "ISO date of the Monday opening the covered week; interval is half-open [week_start_date, week_start_date+7d)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | CLOSED | SUPERSEDED | DISCARDED", default: DRAFT }
      - { name: supersedes_sheet_id, type: string, source: input, description: "FK -> PriceSheet.id; optional; on publish the referenced PUBLISHED sheet auto-transitions to SUPERSEDED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publication; null until published" }

  - name: PriceSheetLine
    parent: PriceSheet
    common_fields: true
    fields:
      - { name: price_sheet_id, type: string, source: system, description: "FK -> PriceSheet.id; parent sheet" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; priced product" }
      - { name: price_per_lb_cents, type: integer, source: input, description: "Sheet price per lb in cents" }
      - { name: weekly_supply_lbs, type: integer, source: input, description: "Weekly allocation cap for this product on this sheet" }
      - { name: allocated_lbs, type: number, source: computed, description: "Sum of allocated_lbs over CONFIRMED allocations referencing this line (calc allocation_waterfall)", default: 0 }

  - name: YieldSpec
    parent: null
    common_fields: false
    fields:
      - { name: carcass_product_id, type: string, source: input, description: "FK -> Product.id; must reference a Product with kind CARCASS" }
      - { name: output_product_id, type: string, source: input, description: "FK -> Product.id; must reference a Product with kind PRIMAL or SUBPRIMAL" }
      - { name: expected_yield_pct, type: number, source: input, description: "Expected output weight as percent of carcass weight (0-100)" }
      - { name: min_yield_pct, type: number, source: input, description: "Compliance band lower bound (inclusive)" }
      - { name: max_yield_pct, type: number, source: input, description: "Compliance band upper bound (inclusive)" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: po_number, type: string, source: input, description: "Unique purchase order number" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; kind must be CARCASS or PRIMAL" }
      - { name: ordered_weight_lbs, type: number, source: input, description: "Contracted weight in lbs" }
      - { name: contract_price_per_cwt_cents, type: integer, source: input, description: "Purchase price per hundredweight in cents" }
      - { name: required_delivery_date, type: string, source: input, description: "ISO date the product is due" }
      - { name: received_weight_lbs, type: number, source: system, description: "Scale weight captured at receiving; null until RECEIVED" }
      - { name: estimated_cutout_value_cents, type: integer, source: computed, description: "Booking-time cutout estimate on ordered weight using latest PUBLISHED sheet (calc cutout_value, variant sheet_at_booking)" }
      - { name: actual_cutout_value_cents, type: integer, source: computed, description: "Grading-time cutout on received weight using the sheet covering the grading date (calc cutout_value, variant sheet_at_grading); null until GRADED" }
      - { name: status, type: enum, source: system, description: "BOOKED | RECEIVED | GRADED | CANCELLED", default: BOOKED }
      - { name: cancel_reason, type: enum, source: system, description: "MANUAL | SUPPLIER_SUSPENDED; null unless CANCELLED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Unique lot code; supplied at PO receiving, system-minted for fabrication output lots and rejection returns lots" }
      - { name: po_id, type: string, source: system, description: "FK -> PurchaseOrder.id; set for received lots, null for fabrication outputs" }
      - { name: parent_lot_id, type: string, source: system, description: "FK -> InventoryLot.id; fabrication genealogy — set on output lots, null otherwise" }
      - { name: fabrication_batch_id, type: string, source: system, description: "FK -> FabricationBatch.id; set on fabrication output lots, null otherwise" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id" }
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; storage site" }
      - { name: received_weight_lbs, type: number, source: system, description: "Weight at lot creation" }
      - { name: current_weight_lbs, type: number, source: system, description: "On-hand weight; decremented by shipment load-out and fabrication consumption" }
      - { name: production_date, type: string, source: input, description: "ISO production/pack date; drives aging" }
      - { name: age_days, type: integer, source: computed, description: "floor((logical clock date - production_date) in days); production date itself is age 0" }
      - { name: usda_grade, type: enum, source: system, description: "UNGRADED | PRIME | CHOICE | SELECT | STANDARD | NO_ROLL", default: UNGRADED }
      - { name: measured_fat_pct, type: number, source: system, description: "Fat percent recorded at inspection; null until inspected" }
      - { name: spec_compliant, type: boolean, source: computed, description: "measured_fat_pct <= product.max_fat_pct; null until inspected; CARCASS products always true" }
      - { name: unit_value_cents_per_lb, type: integer, source: computed, description: "Aging- and grade-adjusted value (calc aging_adjusted_unit_value); null until graded" }
      - { name: quarantine_reason, type: enum, source: system, description: "SPEC_NONCOMPLIANCE | YIELD_OUT_OF_BAND | USDA_HOLD | CERT_REVOKED | RETURNED_REJECTED; null unless QUARANTINED" }
      - { name: status, type: enum, source: system, description: "IN_INSPECTION | AVAILABLE | QUARANTINED | DEPLETED | EXPIRED", default: IN_INSPECTION }

  - name: FabricationBatch
    parent: null
    common_fields: true
    fields:
      - { name: input_lot_id, type: string, source: input, description: "FK -> InventoryLot.id; must reference an AVAILABLE lot whose product kind is CARCASS" }
      - { name: loss_lbs, type: number, source: input, description: "Recorded shrink/evaporation loss in lbs" }
      - { name: outputs, type: array, source: input, description: "Array of {product_id, weight_lbs}; each product must have a YieldSpec from the input lot's product" }
      - { name: total_output_weight_lbs, type: number, source: computed, description: "Sum of outputs[].weight_lbs" }
      - { name: yield_efficiency_pct, type: number, source: computed, description: "total_output_weight_lbs / input weight consumed x 100" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | VOIDED", default: DRAFT }

  - name: ForwardContract
    parent: null
    common_fields: true
    fields:
      - { name: contract_number, type: string, source: input, description: "Unique forward contract number" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: committed_lbs, type: integer, source: input, description: "Total committed lbs over contract life" }
      - { name: fixed_price_per_lb_cents, type: integer, source: input, description: "Fixed forward price per lb in cents" }
      - { name: delivery_week_start, type: string, source: input, description: "ISO Monday date of the delivery week; half-open [delivery_week_start, +7d)" }
      - { name: delivered_lbs, type: number, source: system, description: "Cumulative lbs delivered against this contract", default: 0 }
      - { name: earmarked_lbs, type: number, source: system, description: "Cumulative lbs granted to CONFIRMED allocations earmarked to this contract", default: 0 }
      - { name: amendment_round, type: integer, source: system, description: "Count of applied amendments", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED | DEFAULTED | CANCELLED", default: OPEN }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: price_sheet_line_id, type: string, source: input, description: "FK -> PriceSheetLine.id; line on a PUBLISHED sheet" }
      - { name: forward_contract_id, type: string, source: input, description: "FK -> ForwardContract.id; optional earmark — pricing and supply come from the contract instead of the sheet line" }
      - { name: requested_lbs, type: number, source: input, description: "Requested quantity" }
      - { name: allocated_lbs, type: number, source: system, description: "Granted quantity set by the allocation waterfall", default: 0 }
      - { name: unit_price_cents, type: integer, source: system, description: "Price snapshot: forward fixed price when earmarked, else sheet line price; null until CONFIRMED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | SHORTFALL | SHIPPED | CANCELLED", default: REQUESTED }
      - { name: cancel_reason, type: enum, source: system, description: "MANUAL | SHEET_SUPERSEDED | SHEET_CLOSED | CONTRACT_CANCELLED; null unless CANCELLED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: input, description: "FK -> Allocation.id; must be CONFIRMED" }
      - { name: carrier_name, type: string, source: input, description: "Carrier name" }
      - { name: trailer_temp_setpoint_f, type: number, source: input, description: "Reefer setpoint in Fahrenheit" }
      - { name: shipped_lbs, type: number, source: input, description: "Loaded weight; must be <= allocation allocated_lbs minus lbs already shipped" }
      - { name: lot_ids, type: array, source: input, description: "Optional explicit lot id list; when omitted the FIFO lot selector runs (calc fifo_lot_selection)" }
      - { name: min_temp_f_reading, type: number, source: system, description: "Minimum recorded temperature; null until first reading" }
      - { name: max_temp_f_reading, type: number, source: system, description: "Maximum recorded temperature; null until first reading" }
      - { name: temp_compliance, type: enum, source: system, description: "UNKNOWN | COMPLIANT | BREACHED — parallel state axis, independent of status", default: UNKNOWN }
      - { name: rejection_reason, type: string, source: system, description: "Recorded at receiving rejection; null otherwise" }
      - { name: status, type: enum, source: system, description: "STAGING | IN_TRANSIT | DELIVERED | REJECTED_AT_RECEIVING", default: STAGING }

  - name: TemperatureReading
    parent: Shipment
    common_fields: false
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id" }
      - { name: reading_f, type: number, source: input, description: "Recorded trailer temperature in Fahrenheit" }
      - { name: recorded_at, type: string, source: input, description: "ISO8601 timestamp of the reading" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; shipment must be DELIVERED or REJECTED_AT_RECEIVING" }
      - { name: claim_type, type: enum, source: input, description: "TEMPERATURE_ABUSE | SPEC_NONCONFORMANCE | WEIGHT_SHORTAGE | QUALITY_DEFECT" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed by the customer" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Filing-time credit estimate (calc claim_provisional_credit)" }
      - { name: current_offer_cents, type: integer, source: system, description: "Latest adjuster offer; supersedes prior offers; null until first offer" }
      - { name: offer_round, type: integer, source: system, description: "Number of offers made; capped at 3", default: 0 }
      - { name: final_settlement_cents, type: integer, source: computed, description: "Settlement value at acceptance (calc claim_final_settlement); null until SETTLED_PAID" }
      - { name: status, type: enum, source: system, description: "FILED | OFFER_MADE | COUNTERED | SETTLED_PAID | SETTLED_DENIED | WITHDRAWN", default: FILED }

  - name: InspectionCertificate
    parent: null
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id" }
      - { name: certificate_type, type: enum, source: input, description: "USDA_GRADE | USDA_INSPECTION | COA" }
      - { name: grade_result, type: enum, source: input, description: "PRIME | CHOICE | SELECT | STANDARD | NO_ROLL; required iff certificate_type == USDA_GRADE" }
      - { name: certificate_number, type: string, source: input, description: "Unique certificate number" }
      - { name: issued_by, type: string, source: input, description: "Inspector name or identifier" }
      - { name: issue_date, type: string, source: input, description: "ISO date of issuance; grading-date basis for actual cutout" }
      - { name: status, type: enum, source: system, description: "VALID | REVOKED", default: VALID }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PUT /api/suppliers/{supplierId}/status"
        actor: DeskAdmin
        preconditions:
          - "Supplier must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Every BOOKED PurchaseOrder of this supplier -> CANCELLED (cancel_reason SUPPLIER_SUSPENDED)"
          - "Each cancelled PurchaseOrder is removed from the inbound component of hedging_exposure"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PUT /api/suppliers/{supplierId}/status"
        actor: DeskAdmin
        preconditions:
          - "Supplier must be SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "suspension_reason cleared to null"
          - "Previously cancelled PurchaseOrders are NOT reinstated"

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system (automatic after any exposure-affecting mutation when outstanding_exposure_cents > credit_limit_cents)"
        actor: system
        preconditions:
          - "outstanding_exposure_cents > credit_limit_cents"
        side_effects:
          - "Customer.status -> CREDIT_HOLD"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: "system (automatic after any exposure-affecting mutation when outstanding_exposure_cents <= credit_limit_cents)"
        actor: system
        preconditions:
          - "outstanding_exposure_cents <= credit_limit_cents"
        side_effects:
          - "Customer.status -> ACTIVE"

  - entity: PriceSheet
    initial_state: DRAFT
    terminal_states: [CLOSED, SUPERSEDED, DISCARDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/price-sheets/{sheetId}/publish"
        actor: DeskAdmin
        preconditions:
          - "Sheet must be DRAFT (ERR_PRICE_SHEET_NOT_DRAFT)"
          - "Sheet must have at least one PriceSheetLine (ERR_SHEET_HAS_NO_LINES)"
          - "No other sheet in status DRAFT or PUBLISHED covers the same week_start_date (ERR_PRICE_SHEET_WEEK_CONFLICT)"
          - "supersedes_sheet_id, when provided, must reference a PUBLISHED sheet (ERR_PRICE_SHEET_NOT_PUBLISHED)"
        side_effects:
          - "published_at set to logical clock"
          - "increments PriceSheet.version by 1"
          - "If supersedes_sheet_id set: that sheet -> SUPERSEDED (cascade link 1)"
          - "That superseded sheet's remaining REQUESTED Allocations, and its CONFIRMED Allocations that have no STAGING or IN_TRANSIT shipments, -> CANCELLED with cancel_reason SHEET_SUPERSEDED (cascade link 2, caused by the supersede)"
          - "Each such cancellation recomputes the customer's outstanding_exposure_cents and re-evaluates CREDIT_HOLD auto-release (cascade link 3, caused by the allocation cancellations)"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /api/price-sheets/{sheetId}/close"
        actor: DeskAdmin
        preconditions:
          - "Sheet must be PUBLISHED (ERR_PRICE_SHEET_NOT_PUBLISHED)"
        side_effects:
          - "Remaining REQUESTED Allocations of this sheet's lines, and CONFIRMED Allocations with no STAGING or IN_TRANSIT shipments, -> CANCELLED with cancel_reason SHEET_CLOSED"
          - "Each cancellation recomputes customer exposure and CREDIT_HOLD auto-release"
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /api/price-sheets/{sheetId}/close"
        actor: DeskAdmin
        preconditions:
          - "Sheet must be DRAFT"
        side_effects: []

  - entity: PurchaseOrder
    initial_state: BOOKED
    terminal_states: [GRADED, CANCELLED]
    transitions:
      - from: BOOKED
        to: RECEIVED
        trigger: "POST /api/purchase-orders/{poId}/receive"
        actor: WarehouseOperator
        preconditions:
          - "PO must be BOOKED (ERR_PO_NOT_BOOKED)"
          - "Supplier must be ACTIVE (ERR_SUPPLIER_SUSPENDED)"
          - "Warehouse capacity: occupied_lbs + received_weight_lbs <= capacity_lbs (ERR_WAREHOUSE_CAPACITY_EXCEEDED)"
          - "production_date must not be in the future and lot age at receiving must be <= shelf_life_days (ERR_PRODUCTION_DATE_INVALID)"
        side_effects:
          - "Creates one InventoryLot (lot_code from payload) in IN_INSPECTION with received_weight_lbs = current_weight_lbs = payload weight"
          - "PO.received_weight_lbs set; warehouse.occupied_lbs recomputed"
          - "increments PurchaseOrder.version by 1"
      - from: RECEIVED
        to: GRADED
        trigger: "system (automatic when a VALID USDA_GRADE InspectionCertificate is issued for the PO's lot)"
        actor: system
        preconditions:
          - "PO must be RECEIVED"
        side_effects:
          - "actual_cutout_value_cents computed (cutout_value variant sheet_at_grading using certificate issue_date)"
          - "increments PurchaseOrder.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/purchase-orders/{poId}/cancel or supplier suspension cascade"
        actor: Trader
        preconditions:
          - "PO must be BOOKED (ERR_PO_NOT_BOOKED)"
        side_effects:
          - "PO removed from inbound component of hedging_exposure"
          - "increments PurchaseOrder.version by 1"

  - entity: InventoryLot
    initial_state: IN_INSPECTION
    terminal_states: [DEPLETED, EXPIRED]
    transitions:
      - from: IN_INSPECTION
        to: AVAILABLE
        trigger: "POST /api/inventory-lots/{lotId}/inspect with spec_compliant result"
        actor: QualityGrader
        preconditions:
          - "Lot must be IN_INSPECTION (ERR_LOT_NOT_IN_INSPECTION)"
        side_effects:
          - "measured_fat_pct and spec_compliant recorded"
          - "unit_value_cents_per_lb recomputed if grade already set"
      - from: IN_INSPECTION
        to: QUARANTINED
        trigger: "POST /api/inventory-lots/{lotId}/inspect with non-compliant result"
        actor: QualityGrader
        preconditions:
          - "Lot must be IN_INSPECTION (ERR_LOT_NOT_IN_INSPECTION)"
        side_effects:
          - "quarantine_reason = SPEC_NONCOMPLIANCE"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /api/inventory-lots/{lotId}/quarantine or inspection-certificate revocation cascade"
        actor: QualityGrader
        preconditions:
          - "Lot must be AVAILABLE (ERR_LOT_NOT_AVAILABLE)"
        side_effects:
          - "quarantine_reason recorded (USDA_HOLD for manual, CERT_REVOKED for cascade)"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /api/inventory-lots/{lotId}/release"
        actor: QualityGrader
        preconditions:
          - "Lot must be QUARANTINED (ERR_INVALID_STATE)"
          - "age_days must be <= product.shelf_life_days (ERR_LOT_EXPIRED)"
        side_effects:
          - "quarantine_reason cleared; unit_value_cents_per_lb recomputed"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic when current_weight_lbs reaches 0 via shipment load-out or fabrication consumption)"
        actor: system
        preconditions:
          - "current_weight_lbs == 0"
        side_effects:
          - "warehouse.occupied_lbs recomputed"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "system (automatic on POST /_clock/set_current_utc when age_days > product.shelf_life_days)"
        actor: system
        preconditions:
          - "age_days > product.shelf_life_days"
        side_effects:
          - "warehouse.occupied_lbs recomputed; lot excluded from hedging_exposure physical component"

  - entity: FabricationBatch
    initial_state: DRAFT
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /api/fabrication-batches/{batchId}/post"
        actor: WarehouseOperator
        preconditions:
          - "Batch must be DRAFT (ERR_BATCH_NOT_DRAFT)"
          - "Input lot must be AVAILABLE (ERR_LOT_NOT_AVAILABLE)"
          - "Mass balance: total_output_weight_lbs + loss_lbs == input lot current_weight_lbs exactly (ERR_MASS_BALANCE_VIOLATION)"
        side_effects:
          - "Input lot current_weight_lbs -> 0 and status -> DEPLETED"
          - "One output InventoryLot created per outputs[] entry (received_weight_lbs = weight_lbs, parent_lot_id = input lot, fabrication_batch_id = batch, production_date = input lot production_date, warehouse_id = input lot warehouse_id)"
          - "Output lot starts IN_INSPECTION when its YieldSpec band holds (min_yield_pct <= actual pct <= max_yield_pct), else QUARANTINED with quarantine_reason YIELD_OUT_OF_BAND"
          - "warehouse.occupied_lbs recomputed; batch totals computed"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/fabrication-batches/{batchId}/void"
        actor: DeskAdmin
        preconditions:
          - "Batch must be DRAFT (ERR_BATCH_NOT_DRAFT)"
        side_effects: []
      - from: POSTED
        to: VOIDED
        trigger: "POST /api/fabrication-batches/{batchId}/void"
        actor: DeskAdmin
        preconditions:
          - "Batch must be POSTED (ERR_BATCH_NOT_DRAFT)"
          - "Every output lot must be untouched: current_weight_lbs == received_weight_lbs for all outputs (ERR_BATCH_NOT_VOIDABLE)"
        side_effects:
          - "Each output lot -> DEPLETED (voided) with current_weight_lbs -> 0 (cascade link 1)"
          - "Input lot current_weight_lbs restored to its pre-post weight and status -> AVAILABLE (cascade link 2, caused by output depletion completing)"
          - "warehouse.occupied_lbs recomputed"

  - entity: ForwardContract
    initial_state: OPEN
    terminal_states: [SETTLED, DEFAULTED, CANCELLED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /api/forward-contracts/{contractId}/amend"
        actor: Trader
        preconditions:
          - "Contract must be OPEN (ERR_CONTRACT_NOT_OPEN)"
          - "expected_contract_version must equal current version (ERR_STALE_CONTRACT_VERSION)"
          - "delivery_week_start must be a Monday not earlier than the current logical week (ERR_FORWARD_WEEK_PASSED / ERR_INVALID_WEEK_START)"
        side_effects:
          - "committed_lbs / fixed_price_per_lb_cents / delivery_week_start replaced by payload values"
          - "amendment_round += 1; increments ForwardContract.version by 1"
      - from: OPEN
        to: SETTLED
        trigger: "system (automatic at shipment delivery when delivered_lbs >= committed_lbs)"
        actor: system
        preconditions:
          - "delivered_lbs >= committed_lbs"
        side_effects: []
      - from: OPEN
        to: DEFAULTED
        trigger: "system (automatic on POST /_clock/set_current_utc when logical date >= delivery_week_start + 7 and delivered_lbs < committed_lbs)"
        actor: system
        preconditions:
          - "logical clock date >= delivery_week_start + 7 days"
          - "delivered_lbs < committed_lbs"
        side_effects:
          - "Contract removed from forward component of hedging_exposure"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/forward-contracts/{contractId}/cancel"
        actor: RiskOfficer
        preconditions:
          - "Contract must be OPEN (ERR_CONTRACT_NOT_OPEN)"
          - "No CONFIRMED allocations earmarked to this contract (ERR_CONTRACT_HAS_CONFIRMED_ALLOCATIONS)"
        side_effects:
          - "REQUESTED allocations earmarked to this contract -> CANCELLED with cancel_reason CONTRACT_CANCELLED"
          - "Contract removed from forward component of hedging_exposure"

  - entity: Allocation
    initial_state: REQUESTED
    terminal_states: [SHORTFALL, SHIPPED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/price-sheets/{sheetId}/run-allocation (waterfall engine)"
        actor: RiskOfficer
        preconditions:
          - "Sheet must be PUBLISHED (ERR_PRICE_SHEET_NOT_PUBLISHED)"
          - "Engine grant > 0 lbs"
        side_effects:
          - "allocated_lbs and unit_price_cents set (forward fixed price when earmarked, else line price)"
          - "PriceSheetLine.allocated_lbs += grant (non-earmarked only) or ForwardContract.earmarked_lbs += grant (earmarked)"
          - "Customer outstanding_exposure_cents recomputed; CREDIT_HOLD auto-transition re-evaluated"
      - from: REQUESTED
        to: SHORTFALL
        trigger: "POST /api/price-sheets/{sheetId}/run-allocation (waterfall engine grant == 0)"
        actor: RiskOfficer
        preconditions:
          - "Sheet must be PUBLISHED"
          - "Engine grant == 0 lbs (supply exhausted or credit gate rejected)"
        side_effects: []
      - from: CONFIRMED
        to: SHIPPED
        trigger: "system (automatic when cumulative shipped lbs on DELIVERED shipments >= allocated_lbs)"
        actor: system
        preconditions:
          - "cumulative delivered lbs >= allocated_lbs"
        side_effects:
          - "Customer outstanding_exposure_cents recomputed (value moves from confirmed-allocation component)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/allocations/{allocationId}/cancel or sheet supersede/close or contract cancel cascade"
        actor: CustomerRep
        preconditions:
          - "Allocation must be REQUESTED (ERR_ALLOCATION_NOT_REQUESTED; cascades bypass role check)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/allocations/{allocationId}/cancel or sheet supersede/close cascade"
        actor: CustomerRep
        preconditions:
          - "Allocation must be CONFIRMED with no STAGING or IN_TRANSIT shipments (ERR_ALLOCATION_NOT_CANCELLABLE)"
        side_effects:
          - "PriceSheetLine.allocated_lbs or ForwardContract.earmarked_lbs decremented"
          - "Customer outstanding_exposure_cents recomputed; CREDIT_HOLD auto-release re-evaluated"

  - entity: Shipment
    initial_state: STAGING
    terminal_states: [DELIVERED, REJECTED_AT_RECEIVING]
    transitions:
      - from: STAGING
        to: IN_TRANSIT
        trigger: "POST /api/shipments/{shipmentId}/depart"
        actor: WarehouseOperator
        preconditions:
          - "Shipment must be STAGING (ERR_SHIPMENT_NOT_STAGING)"
          - "At least one TemperatureReading must exist (ERR_NO_TEMPERATURE_READING)"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /api/shipments/{shipmentId}/deliver"
        actor: CustomerRep
        preconditions:
          - "Shipment must be IN_TRANSIT (ERR_SHIPMENT_NOT_IN_TRANSIT)"
        side_effects:
          - "If allocation earmarked: ForwardContract.delivered_lbs += shipped_lbs; contract auto-SETTLED when delivered_lbs >= committed_lbs"
          - "Allocation auto-SHIPPED when cumulative delivered lbs >= allocated_lbs"
          - "Customer outstanding_exposure_cents recomputed; CREDIT_HOLD auto-release re-evaluated"
      - from: IN_TRANSIT
        to: REJECTED_AT_RECEIVING
        trigger: "POST /api/shipments/{shipmentId}/reject"
        actor: CustomerRep
        preconditions:
          - "Shipment must be IN_TRANSIT (ERR_SHIPMENT_NOT_IN_TRANSIT)"
        side_effects:
          - "rejection_reason recorded"
          - "A returns InventoryLot is created at the shipment's source warehouse: weight = shipped_lbs, production_date = oldest drawn lot's production_date, status QUARANTINED with quarantine_reason RETURNED_REJECTED (cascade link 1)"
          - "warehouse.occupied_lbs recomputed (cascade link 2, caused by the returns-lot creation)"
      - from: UNKNOWN
        to: COMPLIANT
        trigger: "POST /api/shipments/{shipmentId}/temperature-readings with reading_f <= product.required_temp_max_f"
        actor: WarehouseOperator
        preconditions: []
        side_effects: ["min/max readings updated (temp_compliance axis, independent of status axis)"]
      - from: UNKNOWN
        to: BREACHED
        trigger: "POST /api/shipments/{shipmentId}/temperature-readings with reading_f > product.required_temp_max_f"
        actor: WarehouseOperator
        preconditions: []
        side_effects: ["min/max readings updated"]
      - from: COMPLIANT
        to: BREACHED
        trigger: "POST /api/shipments/{shipmentId}/temperature-readings with reading_f > product.required_temp_max_f"
        actor: WarehouseOperator
        preconditions: []
        side_effects: ["min/max readings updated"]

  - entity: Claim
    initial_state: FILED
    terminal_states: [SETTLED_PAID, SETTLED_DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: OFFER_MADE
        trigger: "POST /api/claims/{claimId}/offers"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be FILED, OFFER_MADE, or COUNTERED (ERR_CLAIM_STATE_INVALID)"
          - "offer_round must be < 3 (ERR_CLAIM_OFFER_LIMIT_EXCEEDED)"
          - "expected_claim_version must equal current version (ERR_STALE_CLAIM_VERSION)"
        side_effects:
          - "offer_round += 1; current_offer_cents = payload offer_cents (supersedes prior offer)"
          - "increments Claim.version by 1"
      - from: COUNTERED
        to: OFFER_MADE
        trigger: "POST /api/claims/{claimId}/offers"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be FILED, OFFER_MADE, or COUNTERED (ERR_CLAIM_STATE_INVALID)"
          - "offer_round must be < 3 (ERR_CLAIM_OFFER_LIMIT_EXCEEDED)"
          - "expected_claim_version must equal current version (ERR_STALE_CLAIM_VERSION)"
        side_effects:
          - "offer_round += 1; current_offer_cents superseded; increments Claim.version by 1"
      - from: OFFER_MADE
        to: OFFER_MADE
        trigger: "POST /api/claims/{claimId}/offers (adjuster revises the offer before any customer response; the new offer supersedes)"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be FILED, OFFER_MADE, or COUNTERED (ERR_CLAIM_STATE_INVALID)"
          - "offer_round must be < 3 (ERR_CLAIM_OFFER_LIMIT_EXCEEDED)"
          - "expected_claim_version must equal current version (ERR_STALE_CLAIM_VERSION)"
        side_effects:
          - "offer_round += 1; current_offer_cents superseded; increments Claim.version by 1"
      - from: OFFER_MADE
        to: COUNTERED
        trigger: "POST /api/claims/{claimId}/counter"
        actor: CustomerRep
        preconditions:
          - "Claim must be OFFER_MADE (ERR_CLAIM_STATE_INVALID)"
          - "offer_round must be < 3 (ERR_CLAIM_OFFER_LIMIT_EXCEEDED)"
        side_effects:
          - "increments Claim.version by 1"
      - from: OFFER_MADE
        to: SETTLED_PAID
        trigger: "POST /api/claims/{claimId}/accept"
        actor: CustomerRep
        preconditions:
          - "Claim must be OFFER_MADE (ERR_CLAIM_STATE_INVALID)"
        side_effects:
          - "final_settlement_cents computed (claim_final_settlement)"
          - "Customer outstanding_exposure_cents reduced by final_settlement_cents (cascade link 1)"
          - "CREDIT_HOLD auto-release re-evaluated from the lowered exposure (cascade link 2, caused by the exposure decrease)"
      - from: OFFER_MADE
        to: SETTLED_DENIED
        trigger: "POST /api/claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be OFFER_MADE or COUNTERED (ERR_CLAIM_STATE_INVALID)"
        side_effects: []
      - from: COUNTERED
        to: SETTLED_DENIED
        trigger: "POST /api/claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim must be OFFER_MADE or COUNTERED (ERR_CLAIM_STATE_INVALID)"
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /api/claims/{claimId}/withdraw"
        actor: CustomerRep
        preconditions:
          - "Claim must be FILED, OFFER_MADE, or COUNTERED (ERR_CLAIM_STATE_INVALID)"
        side_effects: []
      - from: OFFER_MADE
        to: WITHDRAWN
        trigger: "POST /api/claims/{claimId}/withdraw"
        actor: CustomerRep
        preconditions:
          - "Claim must be FILED, OFFER_MADE, or COUNTERED (ERR_CLAIM_STATE_INVALID)"
        side_effects: []

  - entity: InspectionCertificate
    initial_state: VALID
    terminal_states: [REVOKED]
    transitions:
      - from: VALID
        to: REVOKED
        trigger: "POST /api/inspection-certificates/{certId}/revoke"
        actor: QualityGrader
        preconditions:
          - "Certificate must be VALID (ERR_CERTIFICATE_ALREADY_REVOKED)"
        side_effects:
          - "If certificate_type == USDA_GRADE: lot.usda_grade reverts to UNGRADED and unit_value_cents_per_lb recomputed (cascade link 1)"
          - "That lot, if AVAILABLE, -> QUARANTINED with quarantine_reason CERT_REVOKED (cascade link 2, caused by the grade revert)"
          - "If the lot is a PO lot and its PO is GRADED: PO reverts to RECEIVED and actual_cutout_value_cents -> null (cascade link 3, caused by the grade revert)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: claim-offer-stale-version
    parent_entity: Claim
    write_endpoint: "POST /api/claims/{claimId}/offers"
    occ_field: expected_claim_version
    description: |
      Posting a settlement offer against a Claim whose version has advanced
      since the client last observed it is rejected. A new offer legitimately
      supersedes the previous offer without changing the claim's status, so a
      second sequential offer carrying the stale expected_claim_version sees
      identical business state and would otherwise succeed — the OCC check is
      the only thing that rejects it.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: contract-amend-stale-version
    parent_entity: ForwardContract
    write_endpoint: "POST /api/forward-contracts/{contractId}/amend"
    occ_field: expected_contract_version
    description: |
      Amending a ForwardContract whose version has advanced since the client
      last observed it is rejected. An amendment replaces the contract's terms
      while the contract stays OPEN, so a second sequential amendment carrying
      the stale expected_contract_version sees identical business state and
      would otherwise succeed — the OCC check is the only thing that rejects it.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cutout_value
    trigger: "PO creation (variant sheet_at_booking) and USDA_GRADE certificate issuance for the PO lot (variant sheet_at_grading)"
    algorithm: forward_looking
    formula: |
      For the PO's product (kind CARCASS), collect all YieldSpec rows where
      carcass_product_id == po.product_id. For each row:
        basis_weight = ordered_weight_lbs (booking) | received_weight_lbs (grading)
        line_lbs = basis_weight * expected_yield_pct / 100
        price = price_per_lb_cents of the selected sheet's PriceSheetLine for
                output_product_id; if the selected sheet has no line for that
                product, this spec row contributes 0
        line_value_cents = round_half_up(line_lbs * price)   # ROUND PER LINE
      cutout = SUM(line_value_cents)                          # THEN SUM
      Rounding order is pinned: round each per-product line to integer cents
      FIRST, then sum the rounded lines. Never sum raw values then round.
      If the PO product has kind PRIMAL (no YieldSpec rows), cutout is the
      single line round_half_up(basis_weight * price of sheet line for that
      product).
    input_set: "YieldSpec rows for the PO product; PriceSheetLine prices from the variant-selected sheet"
    constants:
      ROUNDING: per_line_then_sum
    precision: "integer cents, round_half_up per line"
    variants:
      - name: sheet_at_booking
        when: "PO creation"
        difference: "Uses the most recently PUBLISHED sheet at booking time (selector: max week_start_date, tie-break max published_at, then min created_at) and ordered_weight_lbs"
      - name: sheet_at_grading
        when: "USDA_GRADE certificate issuance for the PO lot"
        difference: "Uses the sheet whose half-open week contains the certificate issue_date (status PUBLISHED, CLOSED, or SUPERSEDED) and received_weight_lbs; if no such sheet exists, falls back to the estimated_cutout_value_cents value"

  - name: aging_adjusted_unit_value
    trigger: "lot grading (certificate issuance/revocation), inspection completion, release from quarantine, and logical-clock advances"
    algorithm: threshold
    formula: |
      base_price = price_per_lb_cents of the most recently PUBLISHED sheet's
                   line for the lot's product (same selector as cutout_value);
                   if no published sheet line exists, base_price = 0
      grade_mult: PRIME 1.08 | CHOICE 1.00 | SELECT 0.94 | STANDARD 0.90 |
                  NO_ROLL 0.85 | UNGRADED 0.97
      age_mult by age_days band (boundary-inclusive at band start):
        age_days <= 7        -> 1.00
        8 <= age_days <= 14  -> 0.95
        15 <= age_days <= 21 -> 0.88
        age_days >= 22       -> 0.75
      unit_value_cents_per_lb = round_half_up(base_price * grade_mult * age_mult)
      Single rounding at the END of the product; intermediate values are not
      rounded. 3+ inputs (base_price, grade, age_days) with non-linear
      conditional interaction between grade band and age band.
    input_set: "The single InventoryLot; latest PUBLISHED PriceSheetLine for its product"
    constants:
      GRADE_PRIME: 1.08
      GRADE_CHOICE: 1.00
      GRADE_SELECT: 0.94
      GRADE_STANDARD: 0.90
      GRADE_NO_ROLL: 0.85
      GRADE_UNGRADED: 0.97
      AGE_BAND_2_START: 8
      AGE_BAND_3_START: 15
      AGE_BAND_4_START: 22
    precision: "integer cents, round_half_up, single final rounding"

  - name: allocation_waterfall
    trigger: "POST /api/price-sheets/{sheetId}/run-allocation"
    algorithm: waterfall_allocation
    formula: |
      For each PriceSheetLine of the sheet, ordered by line created_at ASC:
        remaining_supply = line.weekly_supply_lbs - line.allocated_lbs
        For each REQUESTED Allocation on the line, ordered by
        (customer.allocation_tier ASC [TIER_1 < TIER_2 < TIER_3],
         allocation.created_at ASC):
          if allocation.forward_contract_id is set:
            contract = that ForwardContract (must be OPEN)
            remaining_supply_c = contract.committed_lbs - contract.delivered_lbs
                                   - contract.earmarked_lbs
            price = contract.fixed_price_per_lb_cents
            supply_pool = remaining_supply_c (sheet supply NOT consumed)
          else:
            price = line.price_per_lb_cents
            supply_pool = remaining_supply
          grant = min(allocation.requested_lbs, supply_pool)
          grant = max(grant, 0)
          if grant > 0:
            allocation -> CONFIRMED, allocated_lbs = grant,
            unit_price_cents = price
            line.allocated_lbs += grant (or contract.earmarked_lbs += grant)
            customer.outstanding_exposure_cents recomputed immediately;
            if the recompute pushes exposure strictly above
            customer.credit_limit_cents, the customer auto-transitions to
            CREDIT_HOLD (see customer_credit_exposure)
          else:
            allocation -> SHORTFALL
      Partial grants CONFIRM with allocated_lbs < requested_lbs. A grant of
      exactly 0 lbs yields SHORTFALL. Grants are supply-limited only; credit
      enforcement happens via the post-grant exposure recompute, whose
      comparison is strict: exposure == credit_limit leaves the customer
      ACTIVE, exposure == credit_limit + 1 forces CREDIT_HOLD.
    input_set: "Allocations with status REQUESTED on lines of the given sheet only"
    constants:
      TIER_ORDER: "TIER_1 < TIER_2 < TIER_3"
    precision: "lbs to 2 decimal places; cents integer"

  - name: customer_credit_exposure
    trigger: "allocation CONFIRMED/CANCELLED, shipment DELIVERED, claim SETTLED_PAID"
    algorithm: aggregation
    formula: |
      outstanding_exposure_cents =
        SUM over the customer's allocations with status IN {CONFIRMED, SHIPPED}
            of (allocated_lbs * unit_price_cents)
        - SUM over the customer's SETTLED_PAID claims of final_settlement_cents
      Floor at 0: if the result < 0, outstanding_exposure_cents = 0.
      Desk policy: allocation value stays in exposure until cancellation or
      claim settlement; shipment movement does not change exposure.
      After each recompute, compare to credit_limit_cents:
        exposure >  limit and status ACTIVE      -> CREDIT_HOLD
        exposure <= limit and status CREDIT_HOLD -> ACTIVE
    input_set: "Allocations in CONFIRMED or SHIPPED only; Claims in SETTLED_PAID only"
    precision: "integer cents"

  - name: warehouse_occupancy
    trigger: "lot creation, lot weight change, lot entering/leaving counted statuses, fabrication post/void"
    algorithm: aggregation
    formula: |
      occupied_lbs = SUM of current_weight_lbs over InventoryLots with
        warehouse_id == warehouse.id AND
        status IN {IN_INSPECTION, AVAILABLE, QUARANTINED}
      DEPLETED and EXPIRED lots are excluded.
    input_set: "InventoryLots filtered by warehouse and status set above"
    precision: "lbs to 2 decimal places"

  - name: fifo_lot_selection
    trigger: "POST /api/shipments when lot_ids is omitted"
    algorithm: chronological
    formula: |
      Eligibility filter: InventoryLot.status == AVAILABLE AND
        lot.product_id == allocation line's product_id.
      Ranking: production_date ASC; tie-break created_at ASC.
      Walk the ranked list, decrementing each lot by min(remaining_need,
      lot.current_weight_lbs) until shipped_lbs is covered; a lot reaching 0
      auto-transitions to DEPLETED.
      Empty-pool / insufficient fallback: if total AVAILABLE lbs < shipped_lbs,
      reject the whole request with ERR_INSUFFICIENT_SUPPLY and decrement
      nothing.
    input_set: "AVAILABLE lots of the allocation's product, all warehouses"
    precision: "lbs to 2 decimal places"

  - name: temp_compliance_eval
    trigger: "POST /api/shipments/{shipmentId}/temperature-readings"
    algorithm: threshold
    formula: |
      On each reading:
        min_temp_f_reading = min(existing, reading_f); max likewise
        if reading_f > product.required_temp_max_f  -> temp_compliance = BREACHED
        elif temp_compliance == UNKNOWN             -> temp_compliance = COMPLIANT
      Boundary is strict: reading_f == required_temp_max_f keeps/sets COMPLIANT.
      BREACHED is sticky: once BREACHED, later readings never revert it.
    input_set: "The appended TemperatureReading and the shipment's allocation product"
    precision: "0.1 F comparison, exact decimal compare"

  - name: hedging_exposure
    trigger: "GET /api/exposure"
    algorithm: aggregation
    formula: |
      For product_id P and week_start W (ISO Monday):
        physical_lbs = SUM current_weight_lbs of lots with product_id == P
                       and status == AVAILABLE
        inbound_lbs  = SUM ordered_weight_lbs of PurchaseOrders with
                       product_id == P and status == BOOKED
        forward_lbs  = SUM (committed_lbs - delivered_lbs) over ForwardContracts
                       with product_id == P, status == OPEN,
                       delivery_week_start == W
        spot_lbs     = SUM allocated_lbs over CONFIRMED Allocations whose line's
                       product_id == P and line's sheet week_start_date == W
        exposure_lbs = physical_lbs + inbound_lbs - forward_lbs - spot_lbs
        basis_price  = price of the most recently PUBLISHED sheet's line for P
                       (0 if none)
        exposure_value_cents = round_half_up(exposure_lbs * basis_price)
    input_set: "Lots AVAILABLE only; POs BOOKED only; contracts OPEN and week-equal only; allocations CONFIRMED on sheets of week W only"
    precision: "lbs 2dp; cents integer round_half_up"

  - name: claim_provisional_credit
    trigger: "Claim creation"
    algorithm: threshold
    formula: |
      shipped_value_cents = shipment.shipped_lbs * allocation.unit_price_cents
      PROV_PCT by claim_type: TEMPERATURE_ABUSE 0.60 | SPEC_NONCONFORMANCE 0.50 |
                              WEIGHT_SHORTAGE 1.00 | QUALITY_DEFECT 0.40
      provisional_credit_cents =
        min(claimed_amount_cents,
            round_half_up(shipped_value_cents * PROV_PCT[claim_type]))
    input_set: "The new Claim, its Shipment, and the Shipment's Allocation"
    constants:
      PROV_PCT_TEMPERATURE_ABUSE: 0.60
      PROV_PCT_SPEC_NONCONFORMANCE: 0.50
      PROV_PCT_WEIGHT_SHORTAGE: 1.00
      PROV_PCT_QUALITY_DEFECT: 0.40
    precision: "integer cents, round_half_up"

  - name: claim_final_settlement
    trigger: "POST /api/claims/{claimId}/accept"
    algorithm: threshold
    formula: |
      shipped_value_cents = shipment.shipped_lbs * allocation.unit_price_cents
      liability_cap = round_half_up(shipped_value_cents * 0.80)
      base = min(current_offer_cents, liability_cap)
      freight_allowance = 15000 iff claim_type == TEMPERATURE_ABUSE AND
                          shipment.temp_compliance == BREACHED, else 0
      final_settlement_cents = base + freight_allowance
      Diverges from claim_provisional_credit: different percentage cap (0.80 vs
      per-type), keyed on current_offer_cents rather than claimed_amount_cents,
      plus a conditional flat freight allowance.
    input_set: "The Claim (must be OFFER_MADE), its Shipment, and the Allocation"
    constants:
      LIABILITY_CAP_PCT: 0.80
      FREIGHT_ALLOWANCE_CENTS: 15000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "claim filing"
        difference: "min(claimed_amount, shipped_value * per-type PROV_PCT); no freight allowance"
      - name: final
        when: "offer acceptance"
        difference: "min(current_offer, shipped_value * 0.80) + conditional 15000-cent freight allowance"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "CustomerRep ownership: X-User-ID must equal the id of the Customer that owns the acted resource (allocation.customer_id, shipment's allocation's customer_id, claim's shipment's customer)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "POST /api/allocations, POST /api/allocations/{id}/cancel, POST /api/shipments/{id}/deliver, POST /api/shipments/{id}/reject, POST /api/claims, POST /api/claims/{id}/counter, POST /api/claims/{id}/accept, POST /api/claims/{id}/withdraw" }
  - { priority: 4, category: existence, check: "Request shape: required fields present, types correct, enum members valid, quantities positive", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a request body" }
  - { priority: 5, category: existence, check: "Path resource ids exist, validated left-to-right", error_id: "ERR_SUPPLIER_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_PRICE_SHEET_NOT_FOUND | ERR_PRICE_SHEET_LINE_NOT_FOUND | ERR_YIELD_SPEC_NOT_FOUND | ERR_PURCHASE_ORDER_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_FABRICATION_BATCH_NOT_FOUND | ERR_FORWARD_CONTRACT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 6, category: existence, check: "Body-referenced FK ids exist (supplier_id, product_id, warehouse_id, customer_id, price_sheet_line_id, forward_contract_id, allocation_id, shipment_id, lot_id, input_lot_id, lot_ids[])", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 422, applies_to: "create/action endpoints with body FKs" }
  - { priority: 7, category: state, check: "Target resource state precondition of the endpoint (per state machine; e.g., PO BOOKED for receive, sheet DRAFT for line add, lot IN_INSPECTION for inspect, batch DRAFT/POSTED for void, contract OPEN for amend/cancel, allocation REQUESTED/CONFIRMED for cancel, shipment STAGING/IN_TRANSIT, claim FILED/OFFER_MADE/COUNTERED)", error_id: "state-specific (ERR_PO_NOT_BOOKED, ERR_PRICE_SHEET_NOT_DRAFT, ERR_PRICE_SHEET_NOT_PUBLISHED, ERR_LOT_NOT_IN_INSPECTION, ERR_LOT_NOT_AVAILABLE, ERR_BATCH_NOT_DRAFT, ERR_CONTRACT_NOT_OPEN, ERR_ALLOCATION_NOT_REQUESTED, ERR_ALLOCATION_NOT_CANCELLABLE, ERR_SHIPMENT_NOT_STAGING, ERR_SHIPMENT_NOT_IN_TRANSIT, ERR_CLAIM_STATE_INVALID, ERR_CERTIFICATE_ALREADY_REVOKED, ERR_INVALID_STATE)", http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 8, category: state, check: "Cross-entity state: supplier ACTIVE on PO create/receive (ERR_SUPPLIER_SUSPENDED); sheet of allocation's line PUBLISHED on allocation create (ERR_PRICE_SHEET_NOT_PUBLISHED); shipment DELIVERED or REJECTED_AT_RECEIVING for claim filing (ERR_SHIPMENT_NOT_CLAIMABLE)", error_id: "ERR_SUPPLIER_SUSPENDED | ERR_PRICE_SHEET_NOT_PUBLISHED | ERR_SHIPMENT_NOT_CLAIMABLE", http_status: 409, applies_to: "POST /api/purchase-orders, POST /api/purchase-orders/{id}/receive, POST /api/allocations, POST /api/claims" }
  - { priority: 9, category: business_safety, check: "Lot shippable: every lot drawn (explicit lot_ids or FIFO) must be AVAILABLE (ERR_LOT_NOT_AVAILABLE) and not EXPIRED (ERR_LOT_EXPIRED); claim_type TEMPERATURE_ABUSE requires shipment temp_compliance == BREACHED (ERR_CLAIM_TYPE_NOT_SUPPORTED); depart requires >= 1 temperature reading (ERR_NO_TEMPERATURE_READING)", error_id: "ERR_LOT_NOT_AVAILABLE | ERR_LOT_EXPIRED | ERR_CLAIM_TYPE_NOT_SUPPORTED | ERR_NO_TEMPERATURE_READING", http_status: 409, applies_to: "POST /api/shipments, POST /api/claims, POST /api/shipments/{id}/depart" }
  - { priority: 10, category: business_constraint, check: "Uniqueness: supplier establishment_number, customer_code, product_code, po_number, lot_code, contract_number, certificate_number (ERR_DUPLICATE_CODE); at publish time, no other DRAFT/PUBLISHED sheet may cover the same week_start_date (ERR_PRICE_SHEET_WEEK_CONFLICT); fabrication mass balance total_output + loss == input weight (ERR_MASS_BALANCE_VIOLATION); sheet has >= 1 line at publish (ERR_SHEET_HAS_NO_LINES); shipped_lbs <= allocation remaining (ERR_SHIPMENT_EXCEEDS_ALLOCATION)", error_id: "ERR_DUPLICATE_CODE | ERR_PRICE_SHEET_WEEK_CONFLICT | ERR_MASS_BALANCE_VIOLATION | ERR_SHEET_HAS_NO_LINES | ERR_SHIPMENT_EXCEEDS_ALLOCATION", http_status: 409, applies_to: "create endpoints, sheet publish/close, fabrication post, shipment create" }
  - { priority: 11, category: business_constraint, check: "Warehouse aggregate capacity: occupied_lbs + incoming weight <= capacity_lbs at receiving and at fabrication post (output lots land in the same warehouse)", error_id: ERR_WAREHOUSE_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /api/purchase-orders/{id}/receive, POST /api/fabrication-batches/{id}/post" }
  - { priority: 12, category: business_temporal, check: "week_start_date and delivery_week_start are Mondays (ERR_INVALID_WEEK_START); forward delivery week not earlier than the current logical week (ERR_FORWARD_WEEK_PASSED); production_date not in the future and within shelf life at receiving (ERR_PRODUCTION_DATE_INVALID)", error_id: "ERR_INVALID_WEEK_START | ERR_FORWARD_WEEK_PASSED | ERR_PRODUCTION_DATE_INVALID", http_status: 422, applies_to: "POST /api/price-sheets, POST /api/forward-contracts, POST /api/forward-contracts/{id}/amend, POST /api/purchase-orders/{id}/receive" }
  - { priority: 13, category: business_referential, check: "Kind/reference compatibility: PO product kind CARCASS or PRIMAL (ERR_PRODUCT_KIND_MISMATCH); fabrication input lot product kind CARCASS and every output covered by a YieldSpec (ERR_PRODUCT_KIND_MISMATCH); explicit shipment lot_ids products match allocation product (ERR_LOT_PRODUCT_MISMATCH); earmarked forward contract belongs to the same customer (ERR_FORWARD_CONTRACT_CUSTOMER_MISMATCH), same product as the line (ERR_PRODUCT_KIND_MISMATCH), and delivery week equals the sheet week (ERR_FORWARD_CONTRACT_WEEK_MISMATCH); YieldSpec carcass kind CARCASS / output kind PRIMAL or SUBPRIMAL (ERR_PRODUCT_KIND_MISMATCH)", error_id: "ERR_PRODUCT_KIND_MISMATCH | ERR_LOT_PRODUCT_MISMATCH | ERR_FORWARD_CONTRACT_CUSTOMER_MISMATCH | ERR_FORWARD_CONTRACT_WEEK_MISMATCH", http_status: 422, applies_to: "POST /api/purchase-orders, POST /api/fabrication-batches, POST /api/shipments, POST /api/allocations, POST /api/yield-specs" }
  - { priority: 14, category: business_fiscal, check: "Customer must be ACTIVE (not CREDIT_HOLD) to request allocations; the waterfall's post-grant exposure recompute applies a strict > comparison against credit_limit_cents", error_id: ERR_CUSTOMER_CREDIT_HOLD, http_status: 402, applies_to: "POST /api/allocations" }
  - { priority: 15, category: business_fiscal, check: "OCC version match on superseding writes", error_id: "ERR_STALE_CLAIM_VERSION | ERR_STALE_CONTRACT_VERSION", http_status: 412, applies_to: "POST /api/claims/{id}/offers, POST /api/forward-contracts/{id}/amend" }
  - { priority: 16, category: business_constraint, check: "FIFO pool sufficiency for shipment load-out: total AVAILABLE lbs of the allocation's product must cover shipped_lbs when lot_ids is omitted", error_id: ERR_INSUFFICIENT_SUPPLY, http_status: 409, applies_to: "POST /api/shipments" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Side effects: lot expiry sweep and forward-contract default sweep."
    roles: [DeskAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_lot_ids: string[], defaulted_contract_ids: string[] }"
    side_effects:
      - "AVAILABLE lots with age_days > shelf_life_days -> EXPIRED"
      - "OPEN ForwardContracts past delivery week with delivered_lbs < committed_lbs -> DEFAULTED"

  # --- Supplier ---
  - { method: POST, path: "/api/suppliers", description: "Create supplier", roles: [DeskAdmin], code: 201, input: [name, establishment_number, contact_email], output: Supplier, side_effects: ["status = ACTIVE"] }
  - { method: GET, path: "/api/suppliers", description: "List suppliers", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "status?"], output: "Supplier[]", side_effects: [] }
  - { method: GET, path: "/api/suppliers/{supplierId}", description: "Get supplier", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: Supplier, side_effects: [] }
  - { method: PUT, path: "/api/suppliers/{supplierId}/status", description: "Suspend or reinstate a supplier", roles: [DeskAdmin], code: 200, input: [status, "reason?"], output: Supplier, side_effects: ["SUSPEND cancels BOOKED POs (cascade)"] }

  # --- Customer ---
  - { method: POST, path: "/api/customers", description: "Create customer", roles: [DeskAdmin], code: 201, input: [name, customer_code, credit_limit_cents, allocation_tier], output: Customer, side_effects: ["status = ACTIVE, outstanding_exposure_cents = 0"] }
  - { method: GET, path: "/api/customers", description: "List customers", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "status?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/api/customers/{customerId}", description: "Get customer incl. computed exposure", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: Customer, side_effects: [] }

  # --- Warehouse ---
  - { method: POST, path: "/api/warehouses", description: "Create cold-storage warehouse", roles: [DeskAdmin], code: 201, input: [name, zone, capacity_lbs], output: Warehouse, side_effects: ["occupied_lbs = 0"] }
  - { method: GET, path: "/api/warehouses", description: "List warehouses", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "Warehouse[]", side_effects: [] }
  - { method: GET, path: "/api/warehouses/{warehouseId}", description: "Get warehouse incl. computed occupied_lbs", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: Warehouse, side_effects: [] }

  # --- Product ---
  - { method: POST, path: "/api/products", description: "Create product (immutable configuration)", roles: [DeskAdmin], code: 201, input: [product_code, kind, species, "max_fat_pct?", shelf_life_days, required_temp_max_f], output: Product, side_effects: [] }
  - { method: GET, path: "/api/products", description: "List products", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "kind?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/api/products/{productId}", description: "Get product", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: Product, side_effects: [] }

  # --- YieldSpec ---
  - { method: POST, path: "/api/yield-specs", description: "Create yield spec (immutable configuration)", roles: [DeskAdmin], code: 201, input: [carcass_product_id, output_product_id, expected_yield_pct, min_yield_pct, max_yield_pct], output: YieldSpec, side_effects: [] }
  - { method: GET, path: "/api/yield-specs", description: "List yield specs", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "carcass_product_id?", "output_product_id?"], output: "YieldSpec[]", side_effects: [] }
  - { method: GET, path: "/api/yield-specs/{yieldSpecId}", description: "Get yield spec", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: YieldSpec, side_effects: [] }

  # --- PriceSheet + Lines ---
  - { method: POST, path: "/api/price-sheets", description: "Create weekly price sheet in DRAFT", roles: [Trader], code: 201, input: [week_start_date, "supersedes_sheet_id?"], output: PriceSheet, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/api/price-sheets", description: "List price sheets", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "status?", "supersedes_sheet_id?"], output: "PriceSheet[]", side_effects: [] }
  - { method: GET, path: "/api/price-sheets/{sheetId}", description: "Get price sheet", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: PriceSheet, side_effects: [] }
  - { method: POST, path: "/api/price-sheets/{sheetId}/lines", description: "Add a line to a DRAFT sheet", roles: [Trader], code: 201, input: [product_id, price_per_lb_cents, weekly_supply_lbs], output: PriceSheetLine, side_effects: ["allocated_lbs = 0"] }
  - { method: GET, path: "/api/price-sheets/{sheetId}/lines", description: "List lines of a sheet", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "PriceSheetLine[]", side_effects: [] }
  - { method: GET, path: "/api/price-sheet-lines", description: "List lines across sheets", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "product_id?", "price_sheet_id?"], output: "PriceSheetLine[]", side_effects: [] }
  - { method: GET, path: "/api/price-sheet-lines/{lineId}", description: "Get a line", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: PriceSheetLine, side_effects: [] }
  - { method: POST, path: "/api/price-sheets/{sheetId}/publish", description: "Publish a DRAFT sheet (market epoch advance)", roles: [DeskAdmin], code: 200, input: [], output: PriceSheet, side_effects: ["published_at set", "superseded sheet -> SUPERSEDED and its REQUESTED allocations -> CANCELLED (3-link cascade)", "increments PriceSheet.version by 1"] }
  - { method: POST, path: "/api/price-sheets/{sheetId}/close", description: "Close a PUBLISHED sheet or discard a DRAFT sheet", roles: [DeskAdmin], code: 200, input: [], output: PriceSheet, side_effects: ["remaining REQUESTED allocations -> CANCELLED"] }
  - { method: POST, path: "/api/price-sheets/{sheetId}/run-allocation", description: "Run the allocation waterfall over REQUESTED allocations of this sheet", roles: [RiskOfficer], code: 200, input: [], output: "{ confirmed_count: integer, shortfall_count: integer, allocations: Allocation[] }", side_effects: ["grants per allocation_waterfall", "customer exposures recomputed"] }

  # --- PurchaseOrder ---
  - { method: POST, path: "/api/purchase-orders", description: "Book a carcass/primal purchase; computes estimated cutout", roles: [Trader], code: 201, input: [po_number, supplier_id, product_id, ordered_weight_lbs, contract_price_per_cwt_cents, required_delivery_date], output: PurchaseOrder, side_effects: ["estimated_cutout_value_cents computed (sheet_at_booking)", "status = BOOKED"] }
  - { method: GET, path: "/api/purchase-orders", description: "List purchase orders", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "supplier_id?", "product_id?", "status?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: GET, path: "/api/purchase-orders/{poId}", description: "Get purchase order", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: PurchaseOrder, side_effects: [] }
  - { method: POST, path: "/api/purchase-orders/{poId}/receive", description: "Receive against a BOOKED PO; creates the inventory lot", roles: [WarehouseOperator], code: 200, input: [received_weight_lbs, warehouse_id, lot_code, production_date], output: PurchaseOrder, side_effects: ["creates InventoryLot IN_INSPECTION", "PO -> RECEIVED", "warehouse occupancy recomputed"] }
  - { method: POST, path: "/api/purchase-orders/{poId}/cancel", description: "Cancel a BOOKED PO", roles: [Trader], code: 200, input: [], output: PurchaseOrder, side_effects: ["PO -> CANCELLED"] }

  # --- InventoryLot ---
  - { method: GET, path: "/api/inventory-lots", description: "List lots with filters", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "warehouse_id?", "product_id?", "status?", "po_id?", "parent_lot_id?", "fabrication_batch_id?"], output: "InventoryLot[]", side_effects: [] }
  - { method: GET, path: "/api/inventory-lots/{lotId}", description: "Get lot incl. age_days and unit_value_cents_per_lb", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: InventoryLot, side_effects: [] }
  - { method: POST, path: "/api/inventory-lots/{lotId}/inspect", description: "Record trim/fat inspection; routes lot AVAILABLE or QUARANTINED", roles: [QualityGrader], code: 200, input: [measured_fat_pct], output: InventoryLot, side_effects: ["spec_compliant computed", "status -> AVAILABLE or QUARANTINED"] }
  - { method: POST, path: "/api/inventory-lots/{lotId}/quarantine", description: "Manually quarantine an AVAILABLE lot (USDA hold)", roles: [QualityGrader], code: 200, input: [], output: InventoryLot, side_effects: ["status -> QUARANTINED, quarantine_reason = USDA_HOLD"] }
  - { method: POST, path: "/api/inventory-lots/{lotId}/release", description: "Release a QUARANTINED lot back to AVAILABLE", roles: [QualityGrader], code: 200, input: [], output: InventoryLot, side_effects: ["status -> AVAILABLE", "unit_value recomputed"] }

  # --- FabricationBatch ---
  - { method: POST, path: "/api/fabrication-batches", description: "Draft a fabrication batch converting a carcass lot", roles: [WarehouseOperator], code: 201, input: [input_lot_id, loss_lbs, outputs], output: FabricationBatch, side_effects: ["status = DRAFT", "totals computed"] }
  - { method: GET, path: "/api/fabrication-batches", description: "List fabrication batches", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "input_lot_id?", "status?"], output: "FabricationBatch[]", side_effects: [] }
  - { method: GET, path: "/api/fabrication-batches/{batchId}", description: "Get fabrication batch", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: FabricationBatch, side_effects: [] }
  - { method: POST, path: "/api/fabrication-batches/{batchId}/post", description: "Post the batch: consume input lot, create output lots", roles: [WarehouseOperator], code: 200, input: [], output: FabricationBatch, side_effects: ["input lot DEPLETED", "output lots created (IN_INSPECTION or QUARANTINED by yield band)", "occupancy recomputed"] }
  - { method: POST, path: "/api/fabrication-batches/{batchId}/void", description: "Void a DRAFT or POSTED batch with untouched outputs", roles: [DeskAdmin], code: 200, input: [], output: FabricationBatch, side_effects: ["output lots DEPLETED", "input lot weight restored to AVAILABLE", "occupancy recomputed"] }

  # --- ForwardContract ---
  - { method: POST, path: "/api/forward-contracts", description: "Create a forward contract", roles: [Trader], code: 201, input: [contract_number, customer_id, product_id, committed_lbs, fixed_price_per_lb_cents, delivery_week_start], output: ForwardContract, side_effects: ["status = OPEN"] }
  - { method: GET, path: "/api/forward-contracts", description: "List forward contracts", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "customer_id?", "product_id?", "status?"], output: "ForwardContract[]", side_effects: [] }
  - { method: GET, path: "/api/forward-contracts/{contractId}", description: "Get forward contract", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: ForwardContract, side_effects: [] }
  - { method: POST, path: "/api/forward-contracts/{contractId}/amend", description: "Amend terms of an OPEN contract (OCC-guarded)", roles: [Trader], code: 200, input: [committed_lbs, fixed_price_per_lb_cents, delivery_week_start, expected_contract_version], output: ForwardContract, side_effects: ["amendment_round += 1", "increments ForwardContract.version by 1"] }
  - { method: POST, path: "/api/forward-contracts/{contractId}/cancel", description: "Cancel an OPEN contract with no CONFIRMED earmarked allocations", roles: [RiskOfficer], code: 200, input: [], output: ForwardContract, side_effects: ["REQUESTED earmarked allocations -> CANCELLED"] }

  # --- Allocation ---
  - { method: POST, path: "/api/allocations", description: "Customer requests a weekly allocation", roles: [CustomerRep], code: 201, input: [customer_id, price_sheet_line_id, requested_lbs, "forward_contract_id?"], output: Allocation, side_effects: ["status = REQUESTED"] }
  - { method: GET, path: "/api/allocations", description: "List allocations", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "customer_id?", "price_sheet_line_id?", "forward_contract_id?", "status?"], output: "Allocation[]", side_effects: [] }
  - { method: GET, path: "/api/allocations/{allocationId}", description: "Get allocation", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: Allocation, side_effects: [] }
  - { method: POST, path: "/api/allocations/{allocationId}/cancel", description: "Cancel a REQUESTED allocation, or a CONFIRMED one with no open shipments", roles: [CustomerRep], code: 200, input: [], output: Allocation, side_effects: ["line/contract lbs released", "customer exposure recomputed"] }

  # --- Shipment ---
  - { method: POST, path: "/api/shipments", description: "Load-out against a CONFIRMED allocation (LTL)", roles: [WarehouseOperator], code: 201, input: [allocation_id, carrier_name, trailer_temp_setpoint_f, shipped_lbs, "lot_ids?"], output: Shipment, side_effects: ["lots drawn down (explicit or FIFO)", "status = STAGING", "temp_compliance = UNKNOWN"] }
  - { method: GET, path: "/api/shipments", description: "List shipments", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "allocation_id?", "status?", "temp_compliance?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/api/shipments/{shipmentId}", description: "Get shipment", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/api/shipments/{shipmentId}/temperature-readings", description: "Append a temperature reading; updates min/max and temp_compliance axis", roles: [WarehouseOperator], code: 201, input: [reading_f, recorded_at], output: TemperatureReading, side_effects: ["shipment min/max updated", "temp_compliance re-evaluated (sticky BREACHED)"] }
  - { method: GET, path: "/api/shipments/{id}/temperature-readings", description: "List readings of a shipment", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?"], output: "TemperatureReading[]", side_effects: [] }
  - { method: POST, path: "/api/shipments/{shipmentId}/depart", description: "Depart STAGING shipment (requires >= 1 temp reading)", roles: [WarehouseOperator], code: 200, input: [], output: Shipment, side_effects: ["status -> IN_TRANSIT", "customer exposure recomputed (in-transit component)"] }
  - { method: POST, path: "/api/shipments/{shipmentId}/deliver", description: "Customer receiving accepts the shipment", roles: [CustomerRep], code: 200, input: [], output: Shipment, side_effects: ["status -> DELIVERED", "contract delivered_lbs and allocation SHIPPED cascades", "exposure recomputed"] }
  - { method: POST, path: "/api/shipments/{shipmentId}/reject", description: "Customer rejects at receiving dock", roles: [CustomerRep], code: 200, input: [rejection_reason], output: Shipment, side_effects: ["status -> REJECTED_AT_RECEIVING", "returns lot created QUARANTINED", "occupancy recomputed"] }

  # --- Claim ---
  - { method: POST, path: "/api/claims", description: "Customer files a claim on a delivered/rejected shipment; provisional credit computed", roles: [CustomerRep], code: 201, input: [shipment_id, claim_type, claimed_amount_cents], output: Claim, side_effects: ["provisional_credit_cents computed", "status = FILED"] }
  - { method: GET, path: "/api/claims", description: "List claims", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "shipment_id?", "status?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/api/claims/{claimId}", description: "Get claim", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/api/claims/{claimId}/offers", description: "Adjuster posts a settlement offer (OCC-guarded, supersedes prior offer)", roles: [ClaimsAdjuster], code: 200, input: [offer_cents, expected_claim_version], output: Claim, side_effects: ["offer_round += 1", "status -> OFFER_MADE", "increments Claim.version by 1"] }
  - { method: POST, path: "/api/claims/{claimId}/counter", description: "Customer counters the current offer", roles: [CustomerRep], code: 200, input: [counter_amount_cents], output: Claim, side_effects: ["status -> COUNTERED", "increments Claim.version by 1"] }
  - { method: POST, path: "/api/claims/{claimId}/accept", description: "Customer accepts the current offer; final settlement computed", roles: [CustomerRep], code: 200, input: [], output: Claim, side_effects: ["final_settlement_cents computed", "status -> SETTLED_PAID", "customer exposure reduced", "CREDIT_HOLD re-evaluated"] }
  - { method: POST, path: "/api/claims/{claimId}/deny", description: "Adjuster denies the claim", roles: [ClaimsAdjuster], code: 200, input: [], output: Claim, side_effects: ["status -> SETTLED_DENIED"] }
  - { method: POST, path: "/api/claims/{claimId}/withdraw", description: "Customer withdraws the claim", roles: [CustomerRep], code: 200, input: [], output: Claim, side_effects: ["status -> WITHDRAWN"] }

  # --- InspectionCertificate ---
  - { method: POST, path: "/api/inspection-certificates", description: "Issue a USDA grading/inspection certificate for a lot", roles: [QualityGrader], code: 201, input: [lot_id, certificate_type, "grade_result?", certificate_number, issued_by, issue_date], output: InspectionCertificate, side_effects: ["USDA_GRADE sets lot grade and value", "PO lot grading advances PO -> GRADED with actual cutout"] }
  - { method: GET, path: "/api/inspection-certificates", description: "List certificates", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: ["limit?", "offset?", "lot_id?", "certificate_type?", "status?"], output: "InspectionCertificate[]", side_effects: [] }
  - { method: GET, path: "/api/inspection-certificates/{certId}", description: "Get certificate", roles: [DeskAdmin, Trader, RiskOfficer, QualityGrader, WarehouseOperator, ClaimsAdjuster, CustomerRep], code: 200, input: [], output: InspectionCertificate, side_effects: [] }
  - { method: POST, path: "/api/inspection-certificates/{certId}/revoke", description: "Revoke a certificate; grade revert cascades", roles: [QualityGrader], code: 200, input: [], output: InspectionCertificate, side_effects: ["status -> REVOKED", "lot grade UNGRADED + QUARANTINED cascade", "PO reverts GRADED -> RECEIVED"] }

  # --- Exposure (computed read) ---
  - { method: GET, path: "/api/exposure", description: "Hedging exposure report for a product-week", roles: [DeskAdmin, Trader, RiskOfficer], code: 200, input: [product_id, week_start], output: "{ product_id: string, week_start: string, physical_lbs: number, inbound_lbs: number, forward_lbs: number, spot_lbs: number, exposure_lbs: number, exposure_value_cents: integer }", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role lacks permission for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "CustomerRep X-User-ID does not match the owning Customer of the resource" }

  # --- Not found (path) ---
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "Supplier id in path does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id in path does not exist" }
  - { id: ERR_WAREHOUSE_NOT_FOUND, http: 404, condition: "Warehouse id in path does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id in path does not exist" }
  - { id: ERR_PRICE_SHEET_NOT_FOUND, http: 404, condition: "PriceSheet id in path does not exist" }
  - { id: ERR_PRICE_SHEET_LINE_NOT_FOUND, http: 404, condition: "PriceSheetLine id in path does not exist" }
  - { id: ERR_YIELD_SPEC_NOT_FOUND, http: 404, condition: "YieldSpec id in path does not exist" }
  - { id: ERR_PURCHASE_ORDER_NOT_FOUND, http: 404, condition: "PurchaseOrder id in path does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "InventoryLot id in path does not exist" }
  - { id: ERR_FABRICATION_BATCH_NOT_FOUND, http: 404, condition: "FabricationBatch id in path does not exist" }
  - { id: ERR_FORWARD_CONTRACT_NOT_FOUND, http: 404, condition: "ForwardContract id in path does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "Allocation id in path does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id in path does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id in path does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "InspectionCertificate id in path does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body-referenced FK id does not exist" }

  # --- Input shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, or non-positive quantity" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Unique code collision (establishment_number, customer_code, product_code, po_number, lot_code, contract_number, certificate_number)" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (supplier status transitions, quarantine release from non-QUARANTINED)" }
  - { id: ERR_SUPPLIER_SUSPENDED, http: 409, condition: "PO create/receive while supplier SUSPENDED" }
  - { id: ERR_PRICE_SHEET_NOT_DRAFT, http: 409, condition: "Line add or publish requires sheet DRAFT" }
  - { id: ERR_PRICE_SHEET_NOT_PUBLISHED, http: 409, condition: "Allocation create / run-allocation / supersedes target requires PUBLISHED" }
  - { id: ERR_PO_NOT_BOOKED, http: 409, condition: "Receive or cancel requires PO BOOKED" }
  - { id: ERR_LOT_NOT_IN_INSPECTION, http: 409, condition: "Inspect requires lot IN_INSPECTION" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "Operation requires lot AVAILABLE (shipment draw, fabrication input, quarantine action)" }
  - { id: ERR_LOT_EXPIRED, http: 409, condition: "Lot age exceeds shelf life (release of expired lot or draw of EXPIRED lot)" }
  - { id: ERR_BATCH_NOT_DRAFT, http: 409, condition: "Post/void requires batch in the documented from-state" }
  - { id: ERR_BATCH_NOT_VOIDABLE, http: 409, condition: "POSTED batch has an output lot already drawn down" }
  - { id: ERR_CONTRACT_NOT_OPEN, http: 409, condition: "Amend/cancel requires contract OPEN" }
  - { id: ERR_CONTRACT_HAS_CONFIRMED_ALLOCATIONS, http: 409, condition: "Cancel blocked by CONFIRMED earmarked allocations" }
  - { id: ERR_ALLOCATION_NOT_REQUESTED, http: 409, condition: "Cancel-from-REQUESTED requires REQUESTED status" }
  - { id: ERR_ALLOCATION_NOT_CANCELLABLE, http: 409, condition: "CONFIRMED allocation has STAGING or IN_TRANSIT shipments" }
  - { id: ERR_SHIPMENT_NOT_STAGING, http: 409, condition: "Depart requires STAGING" }
  - { id: ERR_SHIPMENT_NOT_IN_TRANSIT, http: 409, condition: "Deliver/reject requires IN_TRANSIT" }
  - { id: ERR_SHIPMENT_NOT_CLAIMABLE, http: 409, condition: "Claim filing requires shipment DELIVERED or REJECTED_AT_RECEIVING" }
  - { id: ERR_CLAIM_STATE_INVALID, http: 409, condition: "Claim action not permitted from current status" }
  - { id: ERR_CERTIFICATE_ALREADY_REVOKED, http: 409, condition: "Revoke requires certificate VALID" }

  # --- Business ---
  - { id: ERR_PRICE_SHEET_WEEK_CONFLICT, http: 409, condition: "Another DRAFT/PUBLISHED sheet already covers the same week_start_date" }
  - { id: ERR_SHEET_HAS_NO_LINES, http: 409, condition: "Publish requires at least one PriceSheetLine" }
  - { id: ERR_MASS_BALANCE_VIOLATION, http: 422, condition: "Fabrication outputs + loss_lbs must equal input lot current_weight_lbs exactly" }
  - { id: ERR_WAREHOUSE_CAPACITY_EXCEEDED, http: 409, condition: "occupied_lbs + incoming weight would exceed capacity_lbs" }
  - { id: ERR_SHIPMENT_EXCEEDS_ALLOCATION, http: 422, condition: "shipped_lbs exceeds allocation allocated_lbs minus already-shipped lbs" }
  - { id: ERR_INSUFFICIENT_SUPPLY, http: 409, condition: "AVAILABLE lots of the product cannot cover shipped_lbs (FIFO fallback)" }
  - { id: ERR_NO_TEMPERATURE_READING, http: 409, condition: "Depart requires at least one temperature reading" }
  - { id: ERR_CLAIM_TYPE_NOT_SUPPORTED, http: 422, condition: "TEMPERATURE_ABUSE claim requires shipment temp_compliance == BREACHED" }
  - { id: ERR_CLAIM_OFFER_LIMIT_EXCEEDED, http: 422, condition: "Offer/counter beyond the 3-round negotiation cap" }
  - { id: ERR_INVALID_WEEK_START, http: 422, condition: "week_start_date / delivery_week_start is not a Monday" }
  - { id: ERR_FORWARD_WEEK_PASSED, http: 422, condition: "delivery_week_start is earlier than the current logical week" }
  - { id: ERR_PRODUCTION_DATE_INVALID, http: 422, condition: "production_date in the future or already beyond shelf life at receiving" }
  - { id: ERR_PRODUCT_KIND_MISMATCH, http: 422, condition: "Product kind incompatible with the operation (PO/fabrication input/yield spec/earmark)" }
  - { id: ERR_LOT_PRODUCT_MISMATCH, http: 422, condition: "Explicit shipment lot product differs from allocation product" }
  - { id: ERR_FORWARD_CONTRACT_CUSTOMER_MISMATCH, http: 422, condition: "Earmarked contract belongs to a different customer" }
  - { id: ERR_FORWARD_CONTRACT_WEEK_MISMATCH, http: 422, condition: "Earmarked contract delivery week differs from the sheet week" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 402, condition: "Customer on CREDIT_HOLD may not request allocations" }

  # --- OCC ---
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version does not match current Claim.version" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not match current ForwardContract.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DeskAdmin
    description: "Trading desk administrator: owns reference data, publishes/closes price sheets, voids fabrication batches, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/suppliers, PUT /api/suppliers/{id}/status"
      - "POST /api/customers, POST /api/warehouses, POST /api/products, POST /api/yield-specs"
      - "POST /api/price-sheets/{id}/publish, POST /api/price-sheets/{id}/close"
      - "POST /api/fabrication-batches/{id}/void"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["All GET endpoints", "GET /api/exposure"]

  - name: Trader
    description: "Desk trader: books purchases, drafts price sheets and lines, creates and amends forward contracts"
    identity: opaque
    exclusive_operations:
      - "POST /api/purchase-orders, POST /api/purchase-orders/{id}/cancel"
      - "POST /api/price-sheets, POST /api/price-sheets/{id}/lines"
      - "POST /api/forward-contracts, POST /api/forward-contracts/{id}/amend"
    shared_operations: ["All GET endpoints", "GET /api/exposure"]

  - name: RiskOfficer
    description: "Risk manager: runs the weekly allocation waterfall and cancels forward contracts (segregated from the Trader who writes them)"
    identity: opaque
    exclusive_operations:
      - "POST /api/price-sheets/{id}/run-allocation"
      - "POST /api/forward-contracts/{id}/cancel"
    shared_operations: ["All GET endpoints", "GET /api/exposure"]

  - name: QualityGrader
    description: "QA/USDA documentation officer: inspects lots, quarantines/releases, issues and revokes certificates (segregated from receiving)"
    identity: opaque
    exclusive_operations:
      - "POST /api/inventory-lots/{id}/inspect, /quarantine, /release"
      - "POST /api/inspection-certificates, POST /api/inspection-certificates/{id}/revoke"
    shared_operations: ["All GET endpoints"]

  - name: WarehouseOperator
    description: "Cold-storage operator: receives POs, runs fabrication, loads out and departs shipments, records temperatures"
    identity: opaque
    exclusive_operations:
      - "POST /api/purchase-orders/{id}/receive"
      - "POST /api/fabrication-batches, POST /api/fabrication-batches/{id}/post"
      - "POST /api/shipments, POST /api/shipments/{id}/depart, POST /api/shipments/{id}/temperature-readings"
    shared_operations: ["All GET endpoints"]

  - name: ClaimsAdjuster
    description: "Claims settlement officer: posts offers and denies claims (segregated from the customer who files and accepts)"
    identity: opaque
    exclusive_operations:
      - "POST /api/claims/{id}/offers"
      - "POST /api/claims/{id}/deny"
    shared_operations: ["All GET endpoints"]

  - name: CustomerRep
    description: "Customer representative: requests allocations, receives or rejects shipments at the dock, files/counters/accepts/withdraws claims for their own customer"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/allocations, POST /api/allocations/{id}/cancel"
      - "POST /api/shipments/{id}/deliver, POST /api/shipments/{id}/reject"
      - "POST /api/claims, POST /api/claims/{id}/counter, POST /api/claims/{id}/accept, POST /api/claims/{id}/withdraw"
    shared_operations: ["All GET endpoints"]
