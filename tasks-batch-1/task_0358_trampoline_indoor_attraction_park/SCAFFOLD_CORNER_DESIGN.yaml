scaffold_corner_design:

  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: create_slot_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.SessionSlot, endpoints]
        distinguishing_aspect: "POST /park/slots with all required fields returns 201 and the body carries id, starts_at, ends_at, jump_capacity, base_price_cents, seats_taken=0, status=OPEN, version=1."
        test_recipe:
          setup: ["Park bootstrapped."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
          trigger:
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, seats0: $.data.seats_taken, status0: $.data.status, ver0: $.data.version }
          assert:
            - "SessionSlot.${slot_id}.seats_taken == 0"
            - "SessionSlot.${slot_id}.status == OPEN"
            - "SessionSlot.${slot_id}.version == 1"

      - name: get_slot_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.SessionSlot, endpoints]
        distinguishing_aspect: "GET /park/slots/{id} returns the slot matching the created id with jump_capacity 10."
        test_recipe:
          setup: ["A slot exists."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id }
          trigger:
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { got_cap: $.data.jump_capacity }
          assert:
            - "SessionSlot.${slot_id}.jump_capacity == 10"

      - name: list_slots_paginated_envelope
        claim_type: Listing
        grounds: [entities.SessionSlot, endpoints]
        distinguishing_aspect: "GET /park/slots returns a paginated array envelope with total_count and has_more present in meta/data per §1.0."
        test_recipe:
          setup: ["Two slots created in one park."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T13:00:00Z", ends_at: "2026-06-20T15:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
          trigger:
            - call: "GET /park/slots"
              payload: { park_id: "${park_id}", limit: 1, offset: 0 }
              as: FrontDesk
          assert:
            - "response.data length == 1"
            - "response envelope total_count == 2 and has_more == true"

      - name: get_slot_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.SessionSlot, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /park/slots/{non-existent uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Park exists, no such slot."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
          trigger:
            - call: "GET /park/slots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_slot_missing_jump_capacity_returns_validation
        claim_type: Required Fields
        grounds: [entities.SessionSlot.fields.jump_capacity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /park/slots without jump_capacity returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Park exists."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
          trigger:
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", base_price_cents: 2000 }
              as: ParkManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VALIDATION"
            - "response.http_status == 422"

      - name: park_grip_sock_price_default_applied
        claim_type: Defaults
        grounds: [entities.Park.fields.grip_sock_price_cents]
        distinguishing_aspect: "POST /park omitting grip_sock_price_cents yields default 350 in the response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id, sock_price: $.data.grip_sock_price_cents }
          assert:
            - "Park.${park_id}.grip_sock_price_cents == 350"
            - "Park.${park_id}.walkin_surcharge_cents == 500"

      - name: participant_is_minor_computed_from_birthdate
        claim_type: Computed Fields
        grounds: [entities.Participant.fields.is_minor, entities.Participant.fields.birthdate]
        distinguishing_aspect: "A participant with birthdate making them 10 years old at clock time is flagged is_minor=true; client-supplied is_minor is ignored."
        test_recipe:
          setup: ["Park (minor_age_threshold 18); clock 2026-06-15; an adult guardian first."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Guardian A", birthdate: "1980-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Kid K", birthdate: "2016-01-01T00:00:00Z", guardian_participant_id: "${g_id}" }
              as: FrontDesk
              captures: { kid_id: $.data.id, kid_minor: $.data.is_minor }
          assert:
            - "Participant.${kid_id}.is_minor == true"

      - name: jump_pass_system_fields_generated
        claim_type: System Fields
        grounds: [entities.JumpPass.fields.base_charge_cents]
        distinguishing_aspect: "On JumpPass create, base_charge_cents is server-computed (input value, if sent, is ignored); id/created_at/version system-minted."
        test_recipe:
          setup: ["Slot base 2000; participant; clock 2026-06-15."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Sys J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id, base: $.data.base_charge_cents, ver: $.data.version }
          assert:
            - "JumpPass.${pass_id}.base_charge_cents == 2350"
            - "JumpPass.${pass_id}.version == 1"

      - name: jump_pass_invalid_channel_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.JumpPass.fields.channel, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /park/jump-passes with channel='ONLINE' (not RESERVATION|WALKIN) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Slot + participant; clock 2026-06-15."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Enum J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "ONLINE", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VALIDATION"
            - "response.http_status == 422"

      - name: pass_addon_immutable_no_version
        claim_type: Immutability
        grounds: [entities.PassAddOn]
        distinguishing_aspect: "PassAddOn has common_fields:false; it carries id and created_at but no version field, and has no update endpoint — only create + reverse-list."
        test_recipe:
          setup: ["A jump pass exists; an add-on is attached."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Add J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/add-ons"
              payload: { sku: "FAST_PASS", quantity: 2 }
              as: FrontDesk
              captures: { addon_total: $.data.line_total_cents }
          assert:
            - "PassAddOn.line_total_cents == 3000"

      - name: minor_participant_parent_relationship_guardian_required
        claim_type: Parent Relationships
        grounds: [entities.Participant.fields.guardian_participant_id, "validations[priority=6]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / waiver_safety_beats_capacity_fiscal_on_checkin_vs_create
          rationale: "Guardian-required path is exercised in §1.9 self_referential FK instance below; this stub avoids duplicate enumeration of the parent-relationship claim."

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: complete_pass_from_reserved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.JumpPass.CHECKED_IN_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /park/jump-passes/{id}/complete on a RESERVED (never checked-in) pass is not a legal transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A reservation pass in RESERVED."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Inv J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: pass_starts_in_reserved_initial_state
        claim_type: Initial State
        grounds: [state_machines.JumpPass, entities.JumpPass.fields.admission_status]
        distinguishing_aspect: "A RESERVATION pass on create has admission_status=RESERVED and payment_status=UNPAID (initial states of both axes)."
        test_recipe:
          setup: ["Slot + participant."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Init J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id, adm: $.data.admission_status, pay: $.data.payment_status }
          assert:
            - "JumpPass.${pass_id}.admission_status == RESERVED"
            - "JumpPass.${pass_id}.payment_status == UNPAID"

      - name: walkin_pass_starts_checked_in
        claim_type: Initial State
        grounds: [state_machines.JumpPass, entities.JumpPass.fields.channel]
        distinguishing_aspect: "A WALKIN pass is born admission_status=CHECKED_IN (skips RESERVED) while payment_status starts UNPAID."
        test_recipe:
          setup: ["Slot + participant with a SIGNED waiver; clock inside window so walk-in check-in implied by create is valid."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:05:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Walk J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/waivers"
              payload: { participant_id: "${p_id}", signed_by_participant_id: "${p_id}", signature_text: "Walk J" }
              as: FrontDesk
          trigger:
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "WALKIN", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id, adm: $.data.admission_status }
          assert:
            - "JumpPass.${pass_id}.admission_status == CHECKED_IN"

      - name: incident_signed_off_is_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.IncidentReport.REVIEWED_to_SIGNED_OFF, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From SIGNED_OFF (terminal) a void is illegal -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An incident filed, reviewed, signed off."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:05:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Inc J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/waivers"
              payload: { participant_id: "${p_id}", signed_by_participant_id: "${p_id}", signature_text: "Inc J" }
              as: FrontDesk
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "WALKIN", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
            - call: "POST /park/incidents"
              payload: { park_id: "${park_id}", jump_pass_id: "${pass_id}", severity: "MINOR", narrative: "bump" }
              as: FrontDesk
              captures: { inc_id: $.data.id }
            - call: "POST /park/incidents/${inc_id}/review"
              payload: {}
              as: ParkManager
            - call: "POST /park/incidents/${inc_id}/sign-off"
              payload: {}
              as: ParkManager
          trigger:
            - call: "POST /park/incidents/${inc_id}/void"
              payload: {}
              as: ParkManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: pay_twice_returns_already_paid
        claim_type: Idempotency
        grounds: [state_machines.JumpPass.UNPAID_to_PAID, "errors[ERR_ALREADY_PAID]"]
        distinguishing_aspect: "Second POST /pay on the same pass (now PAID) is rejected ERR_ALREADY_PAID (409)."
        test_recipe:
          setup: ["A reservation pass paid once."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 10, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "Pay J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
            - call: "POST /park/jump-passes/${pass_id}/pay"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /park/jump-passes/${pass_id}/pay"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ALREADY_PAID"
            - "response.http_status == 409"

      - name: party_clean_cancel_before_deposit_keeps_seats_zero
        claim_type: Side Effect Execution
        grounds: [state_machines.PartyBooking.PENDING_to_CANCELLED, entities.SessionSlot.fields.seats_taken]
        distinguishing_aspect: "Cancelling a PENDING booking (before any deposit hold) sets booking_status=CANCELLED and leaves slot seats_taken unchanged at 0 (no seats were held, no deposit forfeited) — the divergent branch from DEPOSIT_HELD cancel."
        test_recipe:
          setup: ["A pending booking on a slot; nothing held."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 20, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id }
            - call: "POST /park/rooms"
              payload: { park_id: "${park_id}", name: "Room A", room_capacity: 30 }
              as: ParkManager
              captures: { room_id: $.data.id }
            - call: "POST /park/packages"
              payload: { park_id: "${park_id}", name: "Basic", per_guest_cents: 1500, base_room_fee_cents: 10000, min_guests: 4 }
              as: ParkManager
              captures: { pkg_id: $.data.id }
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot_id}", guest_count: 6 }
              as: FrontDesk
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /park/party-bookings/${booking_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { bstatus: $.data.booking_status }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { seats_after: $.data.seats_taken }
          assert:
            - "PartyBooking.${booking_id}.booking_status == CANCELLED"
            - "SessionSlot.${slot_id}.seats_taken == 0"

      - name: party_deposit_held_cancel_forfeits_deposit
        claim_type: Compensation
        grounds: [state_machines.PartyBooking.DEPOSIT_HELD_to_CANCELLED, entities.PartyBooking.fields.balance_paid_cents]
        distinguishing_aspect: "Cancelling a DEPOSIT_HELD booking releases the guest seats but forfeits the deposit: balance_paid_cents stays at deposit_cents (no refund), divergent from the clean PENDING branch."
        test_recipe:
          setup: ["A 6-guest booking with deposit held (total 19000, deposit round(19000*0.25)=4750)."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 20, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id }
            - call: "POST /park/rooms"
              payload: { park_id: "${park_id}", name: "Room A", room_capacity: 30 }
              as: ParkManager
              captures: { room_id: $.data.id }
            - call: "POST /park/packages"
              payload: { park_id: "${park_id}", name: "Basic", per_guest_cents: 1500, base_room_fee_cents: 10000, min_guests: 4 }
              as: ParkManager
              captures: { pkg_id: $.data.id }
            - call: "POST /park/party-bookings"
              payload: { package_id: "${pkg_id}", room_id: "${room_id}", slot_id: "${slot_id}", guest_count: 6 }
              as: FrontDesk
              captures: { booking_id: $.data.id, total: $.data.total_cents }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { slot_v_pre: $.data.version }
            - call: "POST /park/party-bookings/${booking_id}/hold-deposit"
              payload: { expected_slot_version: "${slot_v_pre}" }
              as: FrontDesk
              captures: { dep: $.data.deposit_cents }
          trigger:
            - call: "POST /park/party-bookings/${booking_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { bstatus: $.data.booking_status, balance: $.data.balance_paid_cents }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { seats_after: $.data.seats_taken }
          assert:
            - "PartyBooking.${booking_id}.booking_status == CANCELLED"
            - "PartyBooking.${booking_id}.balance_paid_cents == 4750"
            - "SessionSlot.${slot_id}.seats_taken == 0"

      - name: no_show_sweep_releases_seats_after_slot_end
        claim_type: Side Effect Execution
        grounds: [state_machines.JumpPass.RESERVED_to_NO_SHOW, entities.SessionSlot.fields.seats_taken]
        distinguishing_aspect: "Running sweep-no-shows after slot end moves a still-RESERVED pass to NO_SHOW and releases its seat (seats_taken 1 -> 0)."
        test_recipe:
          setup: ["A reservation pass left RESERVED; clock advanced to >= slot.ends_at."]
          setup_api_calls:
            - call: "POST /park"
              payload: { name: "Sky Park" }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ParkManager
            - call: "POST /park/slots"
              payload: { park_id: "${park_id}", starts_at: "2026-06-20T10:00:00Z", ends_at: "2026-06-20T12:00:00Z", jump_capacity: 5, base_price_cents: 2000 }
              as: ParkManager
              captures: { slot_id: $.data.id, slot_v0: $.data.version }
            - call: "POST /park/participants"
              payload: { park_id: "${park_id}", full_name: "NS J", birthdate: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /park/jump-passes"
              payload: { slot_id: "${slot_id}", participant_id: "${p_id}", channel: "RESERVATION", sock_count: 1, expected_slot_version: "${slot_v0}" }
              as: FrontDesk
              captures: { pass_id: $.data.id }
            - call: "POST /park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T12:30:00Z" }
              as: ParkManager
          trigger:
            - call: "POST /park/slots/${slot_id}/sweep-no-shows"
              payload: {}
              as: ParkManager
            - call: "GET /park/jump-passes/${pass_id}"
              payload: {}
              as: FrontDesk
              captures: { adm: $.data.admission_status }
            - call: "GET /park/slots/${slot_id}"
              payload: {}
              as: FrontDesk
              captures: { seats_after: $.data.seats_taken }
          assert:
            - "JumpPass.${pass_id}.admission_status == NO_SHOW"
            - "SessionSlot.${slot_id}.seats_taken == 0"

      - name: complete_pass_bubbles_seat_release_full_to_open
        claim_type: Bubble up
        grounds: [state_machines.JumpPass.CHECKED_IN_to_COMPLETED, state_machines.SessionSlot.FULL_to_OPEN]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_paid_inclusion_pass_chain_depth3
          rationale: "Seat-release recompute (FULL->OPEN) on a terminating admission transition is asserted in the depth-3 cascade §1.8 instance."

      - name: severe_incident_slot_close_cascade
        claim_type: Cross-entity
        grounds: [state_machines.IncidentReport.transitions, state_machines.SessionSlot.OPEN_to_CLOSED]
        excluded_because:
          difficulty_instance: transitive_cascade / severe_incident_closes_slot_depth2
          rationale: "SEVERE-incident slot-close cascade is the subject of the depth-2 cascade §1.8 instance."

