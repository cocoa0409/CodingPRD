            - "GET /advocacy/campaigns/${camp_id}/outcome-report returns open_wave_projected_reach_total == 0"
            - "GET /advocacy/campaigns/${camp_id}/outcome-report returns touch_ledger_balanced == true"
            - "Segment.${seg_id}.active_activation_count == 0"

      - name: coalition_funding_total_conserved_across_partner_withdrawal
        grounds:
          - calculations.coalition_cost_share
          - entities.Campaign.fields.committed_share_total_cents
          - state_machines.CoalitionPartner.ACTIVE_to_WITHDRAWN
          - endpoints.GET_advocacy_campaigns_id_outcome_report
        distinguishing_aspect: |
          A different conserved quantity - the funded budget in integer cents, asserted through
          coalition_funding_balanced (committed_share_total_cents == funded_total_cents 100000). The
          withdrawal both zeroes the ANCHOR's 55556 cents and re-splits them, so every partner line
          changes while the total is invariant; the three-way split had a waterfall remainder cent and
          the two-way split has none, yet both sum to exactly 100000.
        test_recipe:
          setup:
            - "One ACTIVE campaign with funded_total_cents 100000 and one HOUSE legislator in HD-14."
            - "Three coalition partners created in order ANCHOR, CORE, ALLY (weights 5 / 3 / 1), splitting 55556 / 33333 / 11111."
            - "No endorsements exist, so the withdrawal cascade touches only the funding split."
            - "The outcome report is read once before the withdrawal to pin the pre-state of the funding ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
            - call: "POST /advocacy/coalition-partners"
              payload: { campaign_id: "${camp_id}", org_name: "Anchor Housing Alliance", tier: "ANCHOR", branding_asset_ref: "brand/anchor.svg" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { part_a_id: $.data.id }
            - call: "POST /advocacy/coalition-partners"
              payload: { campaign_id: "${camp_id}", org_name: "Core Tenants Union", tier: "CORE", branding_asset_ref: "brand/core.svg" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { part_b_id: $.data.id }
            - call: "POST /advocacy/coalition-partners"
              payload: { campaign_id: "${camp_id}", org_name: "Ally Faith Network", tier: "ALLY", branding_asset_ref: "brand/ally.svg" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { part_c_id: $.data.id }
            - call: "GET /advocacy/campaigns/${camp_id}/outcome-report"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { committed_before: $.data.committed_share_total_cents, funded_before: $.data.funded_total_cents, funding_balanced_before: $.data.coalition_funding_balanced }
          trigger:
            - call: "POST /advocacy/coalition-partners/${part_a_id}/withdraw"
              payload: { withdraw_reason: "board vote to exit the coalition" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "${committed_before} == 100000"
            - "${funded_before} == 100000"
            - "${funding_balanced_before} == true"
            - "CoalitionPartner.${part_a_id}.status == WITHDRAWN"
            - "CoalitionPartner.${part_a_id}.committed_cents == 0"
            - "CoalitionPartner.${part_b_id}.committed_cents == 75000"
            - "CoalitionPartner.${part_c_id}.committed_cents == 25000"
            - "Campaign.${camp_id}.committed_share_total_cents == 100000"
            - "Campaign.${camp_id}.funded_total_cents == 100000"
            - "GET /advocacy/campaigns/${camp_id}/outcome-report returns coalition_funding_balanced == true"
            - "GET /advocacy/campaigns/${camp_id}/coalition-partners?status=ACTIVE returns total_count == 2"
            - "MessageVariant list for campaign ${camp_id} is empty, so no quorum cascade fires"
