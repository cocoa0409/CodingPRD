            - "AllocationCycle.${cycle}.status is STILL OPEN with proposed_at == null and no AllocationLine rows, and the refusal is reported BEFORE the supply/demand checks, so it is NOT ERR_NO_ALLOCATABLE_SUPPLY even though the plant holds no lots at all"

