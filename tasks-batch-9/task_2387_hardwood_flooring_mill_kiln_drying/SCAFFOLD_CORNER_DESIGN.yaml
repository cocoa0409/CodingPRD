      - name: responsibility_split_tier_and_rh_penalty_boundaries
        claim_type: correct_result
        grounds: ["calculations.responsibility_split", "calculations.warranty_liability_dual_variant.variants.adjudicated", "calculations.product_line_posture"]
        distinguishing_aspect: "Three claims identical except for the installation readings resolve to mill shares of 100, 60 and 50 percent: mc_delta exactly 2.0 keeps the installer at 0, 2.1 crosses into the 40 tier, and RH 51 adds the 10-point penalty that RH exactly 50 does not."
        test_recipe:
          setup: ["A SOLID RED_OAK line (material 895 c/sf, funded 600000) with no flooring lot, so the reference moisture is the species target 7.0. Logical clock 2026-08-20."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 100, installation_date: "2026-06-01", subfloor_moisture_pct_at_install: 9.0, ambient_rh_pct_at_install: 50 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_a: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 100, installation_date: "2026-06-01", subfloor_moisture_pct_at_install: 9.1, ambient_rh_pct_at_install: 50 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_b: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "GAPPING", affected_square_feet: 100, installation_date: "2026-06-01", subfloor_moisture_pct_at_install: 9.1, ambient_rh_pct_at_install: 51 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_c: "$.data.id" } }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_a}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 100, adjudicated_subfloor_moisture_pct: 9.0, adjudicated_ambient_rh_pct: 50 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
            - { call: "POST /mill/warranty-claims/${claim_b}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 100, adjudicated_subfloor_moisture_pct: 9.1, adjudicated_ambient_rh_pct: 50 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
            - { call: "POST /mill/warranty-claims/${claim_c}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 100, adjudicated_subfloor_moisture_pct: 9.1, adjudicated_ambient_rh_pct: 51 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "All three claims were filed with data.estimated_liability_cents == 147960 (base 137000, admin 8 pct 10960)."
            - "Claim A (mc_delta exactly 2.0): data.installer_share_pct == 0, data.mill_share_pct == 100, data.service_months == 2, data.depreciation_pct == 1.0 and data.adjudicated_liability_cents == 146480 (gross 147960 depreciated to 146480, times 100 pct)."
            - "Claim B (mc_delta 2.1): data.installer_share_pct == 40, data.mill_share_pct == 60, data.adjudicated_liability_cents == 87888."
            - "Claim C: data.installer_share_pct == 50 (40 plus the 10-point RH penalty), data.mill_share_pct == 50, data.adjudicated_liability_cents == 73240."
            - "RH exactly 50 attracts no penalty (claim B keeps installer 40) while 51 does - the band [30, 50] is inclusive."
            - "GET /mill/product-lines/{line_id} finally shows warranty_committed_cents == 307608, warranty_balance_cents == 292392 and posture == \"RESTRICTED\"."

      - name: warranty_admin_tier_discontinuity_at_five_hundred_thousand
        claim_type: precision
        grounds: ["calculations.warranty_liability_dual_variant.constants.ADMIN_PCT_TIER", "calculations.warranty_liability_dual_variant.variants.estimated"]
        distinguishing_aspect: "A base of exactly 500000 cents takes the 6 percent tier (estimated 530000) while a base of 499990 takes 8 percent and rounds 39999.2 down to 39999, so the SMALLER claim carries the LARGER estimate (539989)."
        test_recipe:
          setup: ["A SOLID line whose material value 525 c/sf plus the 475 c/sf labour constant makes exactly 1000 cents per square foot, so 500 sq ft is a base of exactly 500000."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-400", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 4.000, nominal_thickness_in: 0.750, material_value_cents_per_sf: 525, warranty_funded_total_cents: 2000000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 500, installation_date: "2026-06-01", subfloor_moisture_pct_at_install: 9.0, ambient_rh_pct_at_install: 45 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 499.99, installation_date: "2026-06-01", subfloor_moisture_pct_at_install: 9.0, ambient_rh_pct_at_install: 45 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
          assert:
            - "500 sq ft: status 201 with data.estimated_liability_cents == 530000 (base 500000, admin 6 pct = 30000)."
            - "499.99 sq ft: status 201 with data.estimated_liability_cents == 539989 (base 499990, admin 8 pct = 39999.2 ROUND_HALF_UP -> 39999)."
            - "539989 > 530000 - the tier is selected on base_cents with a hard boundary at 500000, and 500000 itself sits in the 6 pct tier."
            - "The admin figure is 39999, proving the step is rounded to whole cents on its own rather than folded into the total."

