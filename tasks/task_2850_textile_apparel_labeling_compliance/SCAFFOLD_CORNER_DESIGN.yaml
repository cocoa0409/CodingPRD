              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { lb_id: $.data.id, hash_b: $.data.content_hash }
            - call: "POST /labeling/label-specs"
              payload: { style_id: "${style_id}", market_codes: ["US"], languages: ["en"], placement_code: "NECK_CENTER_INSIDE", durability_cycles_rating: 40, wash_temp_c: 30, bleach_code: "NO_BLEACH", dry_code: "TUMBLE_LOW", iron_code: "IRON_MEDIUM", dryclean_code: "DO_NOT_DRYCLEAN", identity_display_mode: "RN", fiber_content_text: "100.0% COTTON", origin_text: "Made in VN", origin_determination_id: "${od_id}", care_test_id: "${c1_id}" }
