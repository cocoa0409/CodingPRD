# =============================================================================
# Scaffold: Onboarding I-9 & E-Verify benchmark seed tables (v1)
# Difficulty: Expert
# =============================================================================

scenario: |
  Onboarding I-9 & E-Verify: identity document review (List A/B/C), 3-day
  deadline, Reverification, E-Verify TNC handling, Section 3 update, F-1 OPT
  STEM extension

domain_name: i9-everify-onboarding
api_prefix: ""   # flat topology: multiple top-level collections (/onboardings, /i9-forms, /identity-documents, /everify-cases, /work-authorizations, /audit-entries) rooted at the server origin

complexity_profile:
  primary_archetype: compliance/audit
  secondary_archetype: workflow orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (Onboarding, I9Form, IdentityDocument, EVerifyCase,
  # WorkAuthorization, ReverificationEvent, AuditEntry) joined by FK references;
  # no deep nesting in URL paths.

  state_machine_shape: branching
  # I9Form fork-joins through Section 2 review; EVerifyCase branches through
  # TNC contest/refer/no-action; WorkAuthorization cycles via reverification +
  # STEM extension.

  relationship_patterns:
    - one_to_many        # Onboarding -> IdentityDocument; I9Form -> ReverificationEvent
    - cross_aggregate    # EVerifyCase references I9Form; ReverificationEvent references WorkAuthorization

  role_model: segregation_of_duties
  # The HR Reviewer who completes Section 2 / submits E-Verify cannot be the
  # same person who certifies Section 1 attestation overrides; E-Verify
  # adjudication actions are partitioned. Compliance officer holds override
  # authority the reviewers lack.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Onboarding
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: employee_full_name, type: string, source: input, description: "New hire legal name" }
      - { name: employee_email, type: string, source: input, description: "New hire email (used as employee identity)" }
      - { name: citizenship_status, type: enum, source: input, constraints: "US_CITIZEN | NONCITIZEN_NATIONAL | LPR | ALIEN_AUTHORIZED", description: "Section 1 attested status" }
      - { name: hire_date, type: datetime, source: input, description: "First day of employment for pay (date the I-9 clock anchors on); ISO 8601 UTC" }
      - { name: work_auth_expiration, type: datetime, source: input, constraints: "required only when citizenship_status == ALIEN_AUTHORIZED; null otherwise", description: "Self-attested expiration of employment authorization from Section 1; null for citizens/nationals/LPRs" }
      - { name: status, type: enum, source: system, default: CREATED, constraints: "CREATED | SECTION1_COMPLETE | SECTION2_COMPLETE | EVERIFY_PENDING | AUTHORIZED | TERMINATED_NONCONFIRMED | REVERIFICATION_DUE | EXPIRED_UNAUTHORIZED", description: "Aggregate onboarding lifecycle state" }
      - { name: section2_deadline, type: datetime, source: computed, description: "= hire_date + 3 business days (skipping Sat/Sun and federal holidays); the I-9 Section 2 completion deadline" }
      - { name: is_overdue, type: boolean, source: computed, default: false, description: "Latching compliance flag: true when Section 2 was not completed on time — i.e. (section2_completed_at is null AND current clock > section2_deadline) OR (section2_completed_at > section2_deadline). Once true it stays true until a ComplianceOfficer override clears it; reaching SECTION2_COMPLETE late does NOT clear it." }
      - { name: requires_everify, type: boolean, source: input, default: true, description: "Whether the employer worksite is enrolled in E-Verify (gates EVerifyCase creation)" }

  - name: I9Form
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_id, type: string, source: input, description: "FK -> Onboarding.id; the onboarding this form documents" }
      - { name: section1_attested_at, type: datetime, source: system, description: "Server timestamp when Section 1 attestation was recorded; null until attested" }
      - { name: section1_preparer_used, type: boolean, source: input, default: false, description: "Whether a preparer/translator assisted Section 1" }
      - { name: chosen_document_path, type: enum, source: computed, constraints: "LIST_A | LIST_B_AND_C | UNSET", description: "Which documentary path Section 2 was completed with; UNSET until Section 2 done" }
      - { name: section2_reviewer_id, type: string, source: system, description: "X-User-ID of the HRReviewer who completed Section 2; null until completed" }
      - { name: section2_completed_at, type: datetime, source: system, description: "Server timestamp Section 2 was completed; null until completed" }
      - { name: current_section3_count, type: integer, source: computed, default: 0, description: "Number of Section 3 (reverification/rehire) blocks recorded against this form" }
      - { name: status, type: enum, source: system, default: SECTION1_PENDING, constraints: "SECTION1_PENDING | SECTION1_DONE | SECTION2_DONE | REVERIFIED", description: "Form-level state independent of E-Verify outcome; SECTION1_PENDING at create, advanced by Section 1/2/3 side effects" }

  - name: IdentityDocument
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_id, type: string, source: input, description: "FK -> Onboarding.id; the onboarding presenting this document" }
      - { name: list_category, type: enum, source: input, constraints: "LIST_A | LIST_B | LIST_C", description: "Which List the document belongs to under the I-9 Lists of Acceptable Documents" }
      - { name: document_title, type: string, source: input, description: "e.g. US_PASSPORT, PERMANENT_RESIDENT_CARD, EAD, DRIVERS_LICENSE, SS_CARD, FORM_I20" }
      - { name: document_number, type: string, source: input, description: "Document number as presented" }
      - { name: expiration_date, type: datetime, source: input, constraints: "null means document does not expire; List C SS card and List B school ID may be unexpiring", description: "Document expiration; ISO 8601 UTC or null" }
      - { name: is_receipt, type: boolean, source: input, default: false, description: "True when presented as a receipt for a lost/stolen/replacement document (triggers receipt-rule 90-day window)" }
      - { name: receipt_resolution_deadline, type: datetime, source: computed, description: "= section2_completed_at + 90 calendar days when is_receipt; the date the actual document must replace the receipt; null when not a receipt" }
      - { name: accepted_for_section2, type: boolean, source: computed, default: false, description: "True when this document was one of the documents Section 2 was completed against" }
      - { name: status, type: enum, source: system, default: PRESENTED, constraints: "PRESENTED | ACCEPTED | SUPERSEDED", description: "Per-document review outcome; PRESENTED at create, set to ACCEPTED (chosen) or SUPERSEDED (not chosen) by the section2-complete side effect" }

  - name: EVerifyCase
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_id, type: string, source: input, description: "FK -> Onboarding.id; the onboarding this E-Verify case adjudicates" }
      - { name: i9_form_id, type: string, source: input, description: "FK -> I9Form.id; the completed Section 2 form that backs this case" }
      - { name: submitted_at, type: datetime, source: system, description: "Server timestamp the case was submitted to E-Verify; null until submitted" }
      - { name: everify_deadline, type: datetime, source: computed, description: "= hire_date + 3 business days; the federal deadline to create the E-Verify case" }
      - { name: was_late, type: boolean, source: computed, default: false, description: "True when submitted_at > everify_deadline; late submission requires a recorded reason" }
      - { name: late_reason, type: string, source: input, description: "Required free-text reason when was_late; null otherwise" }
      - { name: tnc_type, type: enum, source: system, constraints: "NONE | SSA_TNC | DHS_TNC", default: NONE, description: "Which agency issued the Tentative Nonconfirmation, if any" }
      - { name: tnc_issued_at, type: datetime, source: system, description: "Server timestamp the TNC was returned; null when tnc_type == NONE" }
      - { name: referral_deadline, type: datetime, source: computed, description: "= tnc_issued_at + 10 federal-government business days; the deadline for the employee to refer/contest; null when no TNC" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SUBMITTED | TNC_ISSUED | REFERRED | EMPLOYMENT_AUTHORIZED | FINAL_NONCONFIRMATION", description: "E-Verify case lifecycle; DRAFT is the pre-create logical state, cases are minted in SUBMITTED" }

  - name: WorkAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: onboarding_id, type: string, source: input, description: "FK -> Onboarding.id; the onboarding whose work eligibility this record tracks" }
      - { name: auth_type, type: enum, source: input, constraints: "EAD | F1_OPT | F1_STEM_OPT | TPS | OTHER", description: "Category of employment authorization" }
      - { name: valid_from, type: datetime, source: input, description: "Start of the authorization interval (inclusive); ISO 8601 UTC" }
      - { name: valid_until, type: datetime, source: input, description: "End of the authorization interval (inclusive last authorized day); ISO 8601 UTC" }
      - { name: stem_extension_applied, type: boolean, source: input, default: false, description: "True when this record is a STEM OPT extension filed against an F-1 OPT base period" }
      - { name: cap_gap_days, type: integer, source: computed, default: 0, description: "Auto-extension days granted while a timely STEM application is pending (capped at 180)" }
      - { name: effective_valid_until, type: datetime, source: computed, description: "= valid_until + cap_gap_days days; the date reverification must occur by under the active extension" }
      - { name: supersedes_id, type: string, source: input, description: "FK -> WorkAuthorization.id; the prior authorization this record extends/replaces; null for the base record" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | EXTENDED | EXPIRED | SUPERSEDED", description: "Authorization record state" }

  - name: ReverificationEvent
    parent: null
    common_fields: true
    fields:
      - { name: i9_form_id, type: string, source: input, description: "FK -> I9Form.id; the form this Section 3 block is appended to" }
      - { name: work_authorization_id, type: string, source: input, description: "FK -> WorkAuthorization.id; the new authorization presented at reverification" }
      - { name: reverification_reason, type: enum, source: input, constraints: "EXPIRING_AUTH | REHIRE | NAME_CHANGE", description: "Why Section 3 is being completed" }
      - { name: new_expiration_date, type: datetime, source: input, description: "Expiration date of the document presented at reverification; ISO 8601 UTC" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the HRReviewer who completed this Section 3 block" }
      - { name: completed_at, type: datetime, source: system, description: "Server timestamp the Section 3 block was completed" }
      - { name: status, type: enum, source: system, default: RECORDED, constraints: "RECORDED", description: "Reverification block state; Section 3 blocks are append-only and always RECORDED" }

  - name: AuditEntry
    parent: null
    common_fields: false  # id, created_at only — append-only event log
    fields:
      - { name: onboarding_id, type: string, source: input, description: "FK -> Onboarding.id; the onboarding the audited action targeted" }
      - { name: actor_role, type: enum, source: system, constraints: "HRReviewer | ComplianceOfficer | EVerifyOperator | system", description: "Role that performed the audited action" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor; 'system' for automatic transitions" }
      - { name: action, type: string, source: system, description: "e.g. SECTION2_COMPLETED, EVERIFY_SUBMITTED, TNC_REFERRED, REVERIFIED, OVERRIDE_APPLIED" }
      - { name: detail, type: string, source: system, description: "Human-readable summary of what changed" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Onboarding
    initial_state: CREATED
    terminal_states: [AUTHORIZED, TERMINATED_NONCONFIRMED, EXPIRED_UNAUTHORIZED]
    transitions:
      - from: CREATED
        to: SECTION1_COMPLETE
        trigger: "POST /onboardings/{id}/section1-attest"
        actor: HRReviewer
        preconditions:
          - "Onboarding.status == CREATED"
          - "if citizenship_status == ALIEN_AUTHORIZED then work_auth_expiration is present"
        side_effects:
          - "Create or update the I9Form for this onboarding: set section1_attested_at = clock, status SECTION1_PENDING -> SECTION1_DONE"
          - "increments Onboarding.version by 1"
        note: "Section 1 must be done by first day of employment; we record attestation, not enforce that date."

      - from: SECTION1_COMPLETE
        to: SECTION2_COMPLETE
        trigger: "POST /onboardings/{id}/section2-complete"
        actor: HRReviewer
        preconditions:
          - "Onboarding.status == SECTION1_COMPLETE"
          - "the chosen documents satisfy the List A OR (List B + List C) rule (calc: section2_document_sufficiency)"
          - "every chosen IdentityDocument belongs to this onboarding and is in status PRESENTED"
          - "no chosen non-receipt document is expired as of the clock (calc: document_validity)"
        side_effects:
          - "set each chosen IdentityDocument.accepted_for_section2 = true, status PRESENTED -> ACCEPTED; set every other PRESENTED document for this onboarding to SUPERSEDED"
          - "set I9Form.chosen_document_path, section2_reviewer_id = X-User-ID, section2_completed_at = clock; I9Form.status SECTION1_DONE -> SECTION2_DONE"
          - "compute receipt_resolution_deadline on any accepted receipt document"
          - "append AuditEntry(action=SECTION2_COMPLETED)"
          - "increments Onboarding.version by 1"
        note: "Must occur on or before section2_deadline; lateness is recorded (is_overdue), not blocked, mirroring real ICE practice."

      - from: SECTION2_COMPLETE
        to: EVERIFY_PENDING
        trigger: "POST /everify-cases (with onboarding_id) when Onboarding.requires_everify == true"
        actor: EVerifyOperator
        preconditions:
          - "Onboarding.status == SECTION2_COMPLETE"
          - "Onboarding.requires_everify == true"
        side_effects:
          - "create EVerifyCase in SUBMITTED; set was_late and require late_reason if submitted_at > everify_deadline"
          - "append AuditEntry(action=EVERIFY_SUBMITTED)"
          - "increments Onboarding.version by 1"

      - from: SECTION2_COMPLETE
        to: AUTHORIZED
        trigger: "POST /onboardings/{id}/finalize when Onboarding.requires_everify == false"
        actor: ComplianceOfficer
        preconditions:
          - "Onboarding.status == SECTION2_COMPLETE"
          - "Onboarding.requires_everify == false"
        side_effects:
          - "append AuditEntry(action=AUTHORIZED_NO_EVERIFY)"
          - "increments Onboarding.version by 1"
        note: "Non-E-Verify employers reach AUTHORIZED directly once Section 2 is complete."

      - from: EVERIFY_PENDING
        to: AUTHORIZED
        trigger: "system: EVerifyCase reaches EMPLOYMENT_AUTHORIZED"
        actor: system
        preconditions:
          - "the onboarding's EVerifyCase.status == EMPLOYMENT_AUTHORIZED"
        side_effects:
          - "append AuditEntry(action=AUTHORIZED)"
          - "increments Onboarding.version by 1"

      - from: EVERIFY_PENDING
        to: TERMINATED_NONCONFIRMED
        trigger: "system: EVerifyCase reaches FINAL_NONCONFIRMATION"
        actor: system
        preconditions:
          - "the onboarding's EVerifyCase.status == FINAL_NONCONFIRMATION"
        side_effects:
          - "append AuditEntry(action=TERMINATED_NONCONFIRMED)"
          - "increments Onboarding.version by 1"

      - from: AUTHORIZED
        to: REVERIFICATION_DUE
        trigger: "system: clock crosses the effective_valid_until of the controlling WorkAuthorization (advanced via POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "Onboarding.status == AUTHORIZED"
          - "exists a controlling WorkAuthorization whose effective_valid_until < clock and no later RECORDED ReverificationEvent covers it"
        side_effects:
          - "append AuditEntry(action=REVERIFICATION_DUE)"
          - "increments Onboarding.version by 1"

      - from: REVERIFICATION_DUE
        to: AUTHORIZED
        trigger: "POST /i9-forms/{id}/section3 (reverification recorded)"
        actor: HRReviewer
        preconditions:
          - "Onboarding.status == REVERIFICATION_DUE"
          - "the presented WorkAuthorization.effective_valid_until > clock (calc: document_validity on the new auth)"
        side_effects:
          - "create ReverificationEvent(status=RECORDED); increment I9Form.current_section3_count; I9Form.status -> REVERIFIED"
          - "mark the prior WorkAuthorization status -> SUPERSEDED; new auth status ACTIVE/EXTENDED"
          - "append AuditEntry(action=REVERIFIED)"
          - "increments Onboarding.version by 1"

      - from: REVERIFICATION_DUE
        to: EXPIRED_UNAUTHORIZED
        trigger: "system: clock crosses effective_valid_until + grace with no Section 3 recorded (advanced via POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "Onboarding.status == REVERIFICATION_DUE"
          - "clock > controlling WorkAuthorization.effective_valid_until and no RECORDED ReverificationEvent exists covering the lapse"
        side_effects:
          - "append AuditEntry(action=EXPIRED_UNAUTHORIZED)"
          - "increments Onboarding.version by 1"

  - entity: EVerifyCase
    initial_state: DRAFT
    terminal_states: [EMPLOYMENT_AUTHORIZED, FINAL_NONCONFIRMATION]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /everify-cases"
        actor: EVerifyOperator
        preconditions:
          - "backing Onboarding.status IN {SECTION2_COMPLETE, EVERIFY_PENDING} (EVERIFY_PENDING admitted only so the duplicate-case guard, not the state guard, rejects a second create)"
          - "no other non-terminal EVerifyCase (status NOT IN {EMPLOYMENT_AUTHORIZED, FINAL_NONCONFIRMATION}) exists for this onboarding (else ERR_EVERIFY_CASE_EXISTS at validation priority 6)"
          - "if submitted_at > everify_deadline then late_reason is present"
        side_effects:
          - "set submitted_at = clock; compute was_late"
          - "drive Onboarding SECTION2_COMPLETE -> EVERIFY_PENDING"
        note: "Created already in SUBMITTED — DRAFT is the pre-create logical state."

      - from: SUBMITTED
        to: EMPLOYMENT_AUTHORIZED
        trigger: "POST /everify-cases/{id}/result with result=AUTHORIZED"
        actor: EVerifyOperator
        preconditions:
          - "EVerifyCase.status == SUBMITTED"
        side_effects:
          - "cascade: drive Onboarding EVERIFY_PENDING -> AUTHORIZED"
          - "append AuditEntry(action=AUTHORIZED)"

      - from: SUBMITTED
        to: TNC_ISSUED
        trigger: "POST /everify-cases/{id}/result with result=TNC and agency in {SSA,DHS}"
        actor: EVerifyOperator
        preconditions:
          - "EVerifyCase.status == SUBMITTED"
        side_effects:
          - "set tnc_type, tnc_issued_at = clock; compute referral_deadline = tnc_issued_at + 10 gov business days"
          - "append AuditEntry(action=TNC_ISSUED)"
        note: "Onboarding stays in EVERIFY_PENDING during TNC handling."

      - from: TNC_ISSUED
        to: REFERRED
        trigger: "POST /everify-cases/{id}/refer"
        actor: EVerifyOperator
        preconditions:
          - "EVerifyCase.status == TNC_ISSUED"
          - "clock <= referral_deadline (calc: document_validity-style window check on the referral window)"
        side_effects:
          - "append AuditEntry(action=TNC_REFERRED)"

      - from: TNC_ISSUED
        to: FINAL_NONCONFIRMATION
        trigger: "system: clock crosses referral_deadline with no referral (advanced via POST /_clock/set_current_utc) OR POST /everify-cases/{id}/result with result=NO_ACTION"
        actor: system
        preconditions:
          - "EVerifyCase.status == TNC_ISSUED"
          - "clock > referral_deadline OR an explicit no-action close"
        side_effects:
          - "cascade: drive Onboarding EVERIFY_PENDING -> TERMINATED_NONCONFIRMED"
          - "append AuditEntry(action=FINAL_NONCONFIRMATION)"

      - from: REFERRED
        to: EMPLOYMENT_AUTHORIZED
        trigger: "POST /everify-cases/{id}/result with result=AUTHORIZED"
        actor: EVerifyOperator
        preconditions:
          - "EVerifyCase.status == REFERRED"
        side_effects:
          - "cascade: drive Onboarding EVERIFY_PENDING -> AUTHORIZED"
          - "append AuditEntry(action=AUTHORIZED_AFTER_REFERRAL)"

      - from: REFERRED
        to: FINAL_NONCONFIRMATION
        trigger: "POST /everify-cases/{id}/result with result=FINAL_NONCONFIRMATION"
        actor: EVerifyOperator
        preconditions:
          - "EVerifyCase.status == REFERRED"
        side_effects:
          - "cascade: drive Onboarding EVERIFY_PENDING -> TERMINATED_NONCONFIRMED"
          - "append AuditEntry(action=FINAL_NONCONFIRMATION)"

  - entity: WorkAuthorization
    initial_state: ACTIVE
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: EXTENDED
        trigger: "POST /work-authorizations (stem_extension_applied=true, supersedes_id set) — STEM OPT extension filed"
        actor: HRReviewer
        preconditions:
          - "the superseded WorkAuthorization.auth_type == F1_OPT and status == ACTIVE"
          - "the STEM application is filed on or before the base OPT valid_until (calc: stem_extension_window)"
        side_effects:
          - "compute cap_gap_days (capped at 180) and effective_valid_until on the new record"
          - "set the base WorkAuthorization.status ACTIVE -> EXTENDED"
        note: "Filing a timely STEM extension auto-extends work authorization while pending."

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /i9-forms/{id}/section3 presenting a new WorkAuthorization"
        actor: HRReviewer
        preconditions:
          - "a ReverificationEvent is being recorded against a new WorkAuthorization"
        side_effects:
          - "set this record status -> SUPERSEDED"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock crosses effective_valid_until with no extension or reverification (advanced via POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "clock > effective_valid_until and status == ACTIVE"
        side_effects:
          - "set status -> EXPIRED"

      - from: EXTENDED
        to: SUPERSEDED
        trigger: "POST /i9-forms/{id}/section3 presenting a successor WorkAuthorization"
        actor: HRReviewer
        preconditions:
          - "a ReverificationEvent is being recorded against a successor WorkAuthorization"
        side_effects:
          - "set this record status -> SUPERSEDED"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: section2-complete-stale-onboarding
    parent_entity: Onboarding
    write_endpoint: "POST /onboardings/{id}/section2-complete"
    occ_field: "expected_onboarding_version"
    description: |
      Completing Section 2 against an Onboarding whose version has advanced
      since the reviewer last observed it is rejected. This captures the case
      where another reviewer has already completed Section 2 (which legitimately
      accepts a documentary set and supersedes the other PRESENTED documents),
      so the current reviewer's view of the onboarding — and of which documents
      are still PRESENTED — is stale.
    error_id: ERR_STALE_ONBOARDING_VERSION
    http_status: 412

  - rule_id: everify-result-stale-case-onboarding
    parent_entity: Onboarding
    write_endpoint: "POST /everify-cases"
    occ_field: "expected_onboarding_version"
    description: |
      Submitting an E-Verify case against an Onboarding whose version has
      advanced since the operator last observed it is rejected. This captures
      the case where the onboarding already moved past SECTION2_COMPLETE (e.g.
      a competing operator's case submission drove it to EVERIFY_PENDING), so
      a second create that legitimately would supersede the prior under the
      one-case-per-onboarding rule must be caught on the stale version.
    error_id: ERR_STALE_ONBOARDING_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: section2_deadline
    trigger: "computed on Onboarding creation and read; pinned at creation from hire_date"
    algorithm: interval_merge
    formula: |
      # 3 *business* days after hire_date, counting the first business day
      # AFTER hire_date as day 1. Weekends (Sat/Sun) and the fixed federal
      # holiday set are skipped. Anchor at hire_date 00:00:00Z.
      d = hire_date.date()
      counted = 0
      while counted < 3:
          d = d + 1 day
          if d.weekday() not in {Sat, Sun} and d not in FEDERAL_HOLIDAYS:
              counted += 1
      section2_deadline = d at 23:59:59.999Z
    input_set: "single Onboarding; hire_date only"
    constants:
      BUSINESS_DAYS: 3
      FEDERAL_HOLIDAYS: ["2026-01-01","2026-01-19","2026-02-16","2026-05-25","2026-06-19","2026-07-03","2026-09-07","2026-11-11","2026-11-26","2026-12-25"]
    precision: "whole-day arithmetic in UTC; deadline stamped at 23:59:59.999Z of the third business day"

  - name: everify_deadline
    trigger: "computed on EVerifyCase creation; pinned from the backing Onboarding.hire_date"
    algorithm: interval_merge
    formula: |
      # Same 3-business-day arithmetic as section2_deadline but the agency
      # counts only FEDERAL GOVERNMENT business days; in this benchmark the
      # business-day set is IDENTICAL to section2_deadline's (weekends +
      # FEDERAL_HOLIDAYS). everify_deadline = section2_deadline of the
      # onboarding. was_late = submitted_at > everify_deadline.
      everify_deadline = onboarding.section2_deadline
      was_late = case.submitted_at > everify_deadline
    input_set: "the backing Onboarding and the submission clock"
    constants:
      BUSINESS_DAYS: 3
    precision: "boolean comparison against the stamped deadline; strict > for lateness"

  - name: section2_document_sufficiency
    trigger: "on POST /onboardings/{id}/section2-complete, before accepting documents"
    algorithm: constraint_propagation
    formula: |
      # The presented set must satisfy EXACTLY ONE documentary path.
      chosen = the IdentityDocuments named in the request, all belonging to onboarding_id
      A = [d for d in chosen if d.list_category == LIST_A]
      B = [d for d in chosen if d.list_category == LIST_B]
      C = [d for d in chosen if d.list_category == LIST_C]
      if len(A) == 1 and len(B) == 0 and len(C) == 0:
          path = LIST_A
      elif len(A) == 0 and len(B) == 1 and len(C) == 1:
          path = LIST_B_AND_C
      else:
          reject ERR_DOCUMENT_COMBINATION_INVALID
      # Citizenship cross-check: ALIEN_AUTHORIZED may NOT use a List B+C path
      # whose List C is a SS card with no work-restriction annotation only if
      # the path proves identity AND work authorization. List B proves identity
      # only; List C proves work authorization only; together they are valid.
    input_set: "the IdentityDocuments named in the section2-complete request"
    constants:
      VALID_PATHS: ["LIST_A", "LIST_B_AND_C"]
    precision: "exact cardinality match; no partial credit"
    variants:
      - name: list_a_path
        when: "exactly one List A document presented"
        difference: "single document proves both identity and work authorization; chosen_document_path = LIST_A"
      - name: list_b_and_c_path
        when: "exactly one List B and exactly one List C presented"
        difference: "two documents: List B (identity) + List C (work authorization); chosen_document_path = LIST_B_AND_C"

  - name: document_validity
    trigger: "on section2-complete (each non-receipt chosen doc), on section3 reverification (new auth), and on TNC referral window check"
    algorithm: threshold
    formula: |
      # A document/authorization is valid iff its controlling expiration is
      # strictly AFTER the comparison clock. Receipts are exempt from the
      # expiration check at acceptance (they substitute for an expired/lost doc)
      # but get a 90-day resolution deadline instead.
      def is_valid(doc, clock):
          if doc.is_receipt: return True
          if doc.expiration_date is None: return True   # non-expiring
          return doc.expiration_date > clock            # strict >
      # Boundary: a document expiring exactly at clock (==) is EXPIRED (invalid).
    input_set: "a single IdentityDocument or WorkAuthorization and the current clock"
    constants:
      EXPIRY_COMPARATOR: "strict_greater_than"
    precision: "datetime comparison at full timestamp resolution; == clock is invalid"

  - name: stem_extension_window
    trigger: "on POST /work-authorizations with stem_extension_applied=true and supersedes_id set"
    algorithm: threshold
    formula: |
      # A STEM OPT extension is timely iff filed (created_at) on or before the
      # base F-1 OPT period end (valid_until), AND the base auth_type == F1_OPT.
      # A timely-pending STEM application grants a cap-gap auto-extension of up
      # to 180 days from the base valid_until.
      base = WorkAuthorization[supersedes_id]
      timely = (filing_clock <= base.valid_until)        # inclusive <=
      if not (base.auth_type == F1_OPT and timely):
          reject ERR_STEM_WINDOW_MISSED
      raw_gap = days_between(base.valid_until, base.valid_until + requested_gap)
      cap_gap_days = min(requested_gap_days, 180)        # ceiling 180
      effective_valid_until = base.valid_until + cap_gap_days days
    input_set: "the base F1_OPT WorkAuthorization and the new STEM record"
    constants:
      CAP_GAP_CEILING_DAYS: 180
      TIMELY_COMPARATOR: "inclusive_less_than_or_equal"
    precision: "whole-day arithmetic; cap applied with min(); inclusive <= on the filing window"
    variants:
      - name: within_cap
        when: "requested auto-extension <= 180 days"
        difference: "cap_gap_days = requested days; effective_valid_until = base.valid_until + requested"
      - name: cap_exceeded
        when: "requested auto-extension > 180 days"
        difference: "cap_gap_days clamps to 180; effective_valid_until = base.valid_until + 180 days"

  - name: onboarding_compliance_risk
    trigger: "computed on read of GET /onboardings/{id}/risk; recomputed after every onboarding-affecting mutation"
    algorithm: weighted_scoring
    formula: |
      # Forward-looking compliance exposure score on the ONBOARDING domain
      # (distinct from per-document validity). Weighted sum, rounded ONCE at
      # the end (sum-then-round), clamped to [0,100].
      score = 0
      if is_overdue:                       score += 40
      if everify_case.was_late:            score += 25
      if everify_case.tnc_type != NONE and status != AUTHORIZED:  score += 20
      score += 15 * (count of IdentityDocument where is_receipt and
                     receipt_resolution_deadline < clock and status==ACCEPTED)
      score += 10 if any controlling WorkAuthorization.effective_valid_until
                     within 30 days of clock else 0
      risk_score = round(min(score, 100))   # sum first, then round, then clamp
    input_set: "the Onboarding plus its EVerifyCase, IdentityDocuments, WorkAuthorizations"
    constants:
      W_OVERDUE: 40
      W_EVERIFY_LATE: 25
      W_OPEN_TNC: 20
      W_UNRESOLVED_RECEIPT: 15
      W_EXPIRING_AUTH: 10
      CLAMP_MAX: 100
      EXPIRING_WINDOW_DAYS: 30
    precision: "sum-then-round (round half up) then clamp to [0,100]; per-term rounding is forbidden"

# =============================================================================
# Table 1.4: Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET (reads allow any known role)"

  - priority: 2
    category: auth
    check: "the acting role is permitted to perform this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: auth
    check: "segregation of duties: the ComplianceOfficer applying an override on an onboarding MUST NOT be the same X-User-ID that completed Section 2 on that onboarding's I9Form"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /onboardings/{id}/override"

  - priority: 4
    category: existence
    check: "every path/body referenced resource (onboarding, i9-form, document, case, work-authorization) exists; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path/body ids"

  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "no other non-terminal EVerifyCase (status NOT IN {EMPLOYMENT_AUTHORIZED, FINAL_NONCONFIRMATION}) exists for the onboarding when creating a case (the onboarding's SECTION2_COMPLETE state precondition independently blocks duplicates once the first case has moved it to EVERIFY_PENDING; this rule additionally rejects a duplicate while still in SECTION2_COMPLETE)"
    error_id: ERR_EVERIFY_CASE_EXISTS
    http_status: 409
    applies_to: "POST /everify-cases"

  - priority: 7
    category: business_referential
    check: "every chosen IdentityDocument in section2-complete belongs to the path onboarding"
    error_id: ERR_DOCUMENT_NOT_OWNED
    http_status: 422
    applies_to: "POST /onboardings/{id}/section2-complete"

  - priority: 8
    category: business_safety
    check: "Section 1 attestation requiring work_auth_expiration (ALIEN_AUTHORIZED) is present and well-formed before Section 1 completes"
    error_id: ERR_SECTION1_INCOMPLETE
    http_status: 422
    applies_to: "POST /onboardings/{id}/section1-attest"

  - priority: 9
    category: business_constraint
    check: "the chosen document set satisfies exactly one of List A or (List B + List C) — calc section2_document_sufficiency"
    error_id: ERR_DOCUMENT_COMBINATION_INVALID
    http_status: 422
    applies_to: "POST /onboardings/{id}/section2-complete"

  - priority: 10
    category: business_temporal
    check: "no chosen non-receipt document is expired as of the clock (expiration_date <= clock) — calc document_validity"
    error_id: ERR_DOCUMENT_EXPIRED
    http_status: 422
    applies_to: "POST /onboardings/{id}/section2-complete; POST /i9-forms/{id}/section3"

  - priority: 11
    category: business_temporal
    check: "a STEM OPT extension is filed on or before the base F-1 OPT valid_until and the base is F1_OPT — calc stem_extension_window"
    error_id: ERR_STEM_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /work-authorizations"

  - priority: 12
    category: business_temporal
    check: "a TNC referral is recorded on or before referral_deadline (clock <= referral_deadline)"
    error_id: ERR_REFERRAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /everify-cases/{id}/refer"

  - priority: 13
    category: business_constraint
    check: "a late E-Verify submission (was_late) must carry a non-empty late_reason"
    error_id: ERR_LATE_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /everify-cases"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_onboarding_version matches the onboarding's current version"
    error_id: ERR_STALE_ONBOARDING_VERSION
    http_status: 412
    applies_to: "POST /onboardings/{id}/section2-complete; POST /everify-cases"

  - priority: 15
    category: business_constraint
    check: "required body fields present and well-typed; enum values within declared domains"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/onboardings"
    description: "Create a new onboarding (employee record + Section 1 inputs)"
    roles: [HRReviewer, ComplianceOfficer]
    code: 201
    input: [employee_full_name, employee_email, citizenship_status, hire_date, "requires_everify?", "work_auth_expiration?"]
    output: Onboarding
    side_effects: ["compute section2_deadline from hire_date", "create the backing I9Form in SECTION1_PENDING"]

  - method: GET
    path: "/onboardings"
    description: "List onboardings with pagination and optional status filter"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Onboarding[]
    side_effects: []

  - method: GET
    path: "/onboardings/{id}"
    description: "Retrieve a single onboarding"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: []
    output: Onboarding
    side_effects: []

  - method: GET
    path: "/onboardings/{id}/risk"
    description: "Computed compliance-risk summary for an onboarding"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: []
    output: "{ risk_score: integer, is_overdue: boolean, open_tnc: boolean }"
    side_effects: ["recompute onboarding_compliance_risk"]

  - method: POST
    path: "/onboardings/{id}/section1-attest"
    description: "Record the Section 1 employee attestation"
    roles: [HRReviewer]
    code: 200
    input: ["section1_preparer_used?"]
    output: Onboarding
    side_effects: ["I9Form SECTION1_PENDING -> SECTION1_DONE", "Onboarding CREATED -> SECTION1_COMPLETE", "increments Onboarding.version by 1"]

  - method: POST
    path: "/onboardings/{id}/section2-complete"
    description: "Complete Section 2 by accepting a sufficient documentary set"
    roles: [HRReviewer]
    code: 200
    input: [document_ids, expected_onboarding_version]
    output: Onboarding
    side_effects: ["accept chosen documents, supersede others", "set chosen_document_path, section2_reviewer_id, section2_completed_at", "Onboarding SECTION1_COMPLETE -> SECTION2_COMPLETE", "append AuditEntry", "increments Onboarding.version by 1"]

  - method: POST
    path: "/onboardings/{id}/finalize"
    description: "Finalize a non-E-Verify onboarding directly to AUTHORIZED"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Onboarding
    side_effects: ["Onboarding SECTION2_COMPLETE -> AUTHORIZED", "append AuditEntry", "increments Onboarding.version by 1"]

  - method: POST
    path: "/onboardings/{id}/override"
    description: "ComplianceOfficer override: force-clear is_overdue / accept a late posture with a recorded justification"
    roles: [ComplianceOfficer]
    code: 200
    input: [override_reason]
    output: Onboarding
    side_effects: ["set is_overdue=false", "append AuditEntry(action=OVERRIDE_APPLIED)", "increments Onboarding.version by 1"]

  - method: POST
    path: "/onboardings/{id}/advance-lifecycle"
    description: "System-triggerable recomputation: re-derive Onboarding/WorkAuthorization/EVerifyCase deadlines against the current clock and apply due automatic transitions (REVERIFICATION_DUE, EXPIRED_UNAUTHORIZED, TNC->FINAL_NONCONFIRMATION)"
    roles: [ComplianceOfficer, EVerifyOperator]
    code: 200
    input: []
    output: Onboarding
    side_effects: ["apply any clock-driven automatic transitions for this onboarding", "increments Onboarding.version by 1 when a transition fires"]

  - method: POST
    path: "/identity-documents"
    description: "Present an identity document against an onboarding"
    roles: [HRReviewer]
    code: 201
    input: [onboarding_id, list_category, document_title, document_number, "expiration_date?", "is_receipt?"]
    output: IdentityDocument
    side_effects: []

  - method: GET
    path: "/identity-documents"
    description: "List/filter identity documents (reverse-reachability for Onboarding FK)"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: ["onboarding_id?", "status?", "limit?", "offset?"]
    output: IdentityDocument[]
    side_effects: []

  - method: GET
    path: "/identity-documents/{id}"
    description: "Retrieve a single identity document"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: []
    output: IdentityDocument
    side_effects: []

  - method: GET
    path: "/i9-forms"
    description: "List/filter I-9 forms (reverse-reachability for Onboarding FK)"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: ["onboarding_id?", "limit?", "offset?"]
    output: I9Form[]
    side_effects: []

  - method: GET
    path: "/i9-forms/{id}"
    description: "Retrieve a single I-9 form"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: []
    output: I9Form
    side_effects: []

  - method: GET
    path: "/i9-forms/{id}/section3"
    description: "List Section 3 reverification events on a form (reverse-reachability for I9Form FK)"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: ReverificationEvent[]
    side_effects: []

  - method: POST
    path: "/i9-forms/{id}/section3"
    description: "Record a Section 3 reverification/rehire block against a new work authorization"
    roles: [HRReviewer]
    code: 201
    input: [work_authorization_id, reverification_reason, new_expiration_date]
    output: ReverificationEvent
    side_effects: ["create ReverificationEvent(RECORDED)", "supersede prior WorkAuthorization", "I9Form -> REVERIFIED, increment current_section3_count", "Onboarding REVERIFICATION_DUE -> AUTHORIZED", "increments Onboarding.version by 1"]

  - method: GET
    path: "/reverification-events"
    description: "List/filter Section 3 reverification events (reverse-reachability for I9Form + WorkAuthorization FKs)"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: ["i9_form_id?", "work_authorization_id?", "limit?", "offset?"]
    output: ReverificationEvent[]
    side_effects: []

  - method: GET
    path: "/reverification-events/{id}"
    description: "Retrieve a single Section 3 reverification event"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: []
    output: ReverificationEvent
    side_effects: []

  - method: POST
    path: "/everify-cases"
    description: "Submit an E-Verify case for a Section-2-complete onboarding"
    roles: [EVerifyOperator]
    code: 201
    input: [onboarding_id, i9_form_id, expected_onboarding_version, "late_reason?"]
    output: EVerifyCase
    side_effects: ["create EVerifyCase(SUBMITTED), compute everify_deadline + was_late", "Onboarding SECTION2_COMPLETE -> EVERIFY_PENDING", "append AuditEntry", "increments Onboarding.version by 1"]

  - method: GET
    path: "/everify-cases"
    description: "List/filter E-Verify cases (reverse-reachability for Onboarding + I9Form FKs)"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: ["onboarding_id?", "i9_form_id?", "status?", "limit?", "offset?"]
    output: EVerifyCase[]
    side_effects: []

  - method: GET
    path: "/everify-cases/{id}"
    description: "Retrieve a single E-Verify case"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: []
    output: EVerifyCase
    side_effects: []

  - method: POST
    path: "/everify-cases/{id}/result"
    description: "Record an E-Verify adjudication result (AUTHORIZED, TNC, NO_ACTION, FINAL_NONCONFIRMATION)"
    roles: [EVerifyOperator]
    code: 200
    input: [result, "agency?"]
    output: EVerifyCase
    side_effects: ["apply the case transition", "cascade onboarding state when result is terminal", "append AuditEntry"]

  - method: POST
    path: "/everify-cases/{id}/refer"
    description: "Record the employee's referral/contest of a TNC within the referral window"
    roles: [EVerifyOperator]
    code: 200
    input: []
    output: EVerifyCase
    side_effects: ["EVerifyCase TNC_ISSUED -> REFERRED", "append AuditEntry"]

  - method: POST
    path: "/work-authorizations"
    description: "Record a work authorization (base, EAD, F-1 OPT, STEM extension, TPS)"
    roles: [HRReviewer]
    code: 201
    input: [onboarding_id, auth_type, valid_from, valid_until, "stem_extension_applied?", "supersedes_id?", "requested_gap_days?"]
    output: WorkAuthorization
    side_effects: ["compute cap_gap_days + effective_valid_until when STEM extension", "supersede base auth (ACTIVE -> EXTENDED) when stem_extension_applied"]

  - method: GET
    path: "/work-authorizations"
    description: "List/filter work authorizations (reverse-reachability for Onboarding + self FKs)"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: ["onboarding_id?", "supersedes_id?", "status?", "limit?", "offset?"]
    output: WorkAuthorization[]
    side_effects: []

  - method: GET
    path: "/work-authorizations/{id}"
    description: "Retrieve a single work authorization"
    roles: [HRReviewer, ComplianceOfficer, EVerifyOperator]
    code: 200
    input: []
    output: WorkAuthorization
    side_effects: []

  - method: GET
    path: "/audit-entries"
    description: "List/filter the append-only audit log (reverse-reachability for Onboarding FK)"
    roles: [ComplianceOfficer, EVerifyOperator, HRReviewer]
    code: 200
    input: ["onboarding_id?", "limit?", "offset?"]
    output: AuditEntry[]
    side_effects: []

  - method: GET
    path: "/audit-entries/{id}"
    description: "Retrieve a single append-only audit log entry"
    roles: [ComplianceOfficer, EVerifyOperator, HRReviewer]
    code: 200
    input: []
    output: AuditEntry
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the deterministic server clock to drive deadline-crossing automatic transitions"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["advance the server clock; subsequent advance-lifecycle calls evaluate deadlines against it"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or unknown X-User-Role / X-User-ID on a mutating endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "acting role not permitted for this operation per RBAC" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "ComplianceOfficer override actor equals the Section 2 reviewer of the same onboarding" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced onboarding/form/document/case/work-authorization does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition not defined from the resource's current state" }
  - { id: ERR_EVERIFY_CASE_EXISTS, http: 409, condition: "a non-terminal EVerifyCase already exists for the onboarding" }
  - { id: ERR_DOCUMENT_NOT_OWNED, http: 422, condition: "a chosen document does not belong to the path onboarding" }
  - { id: ERR_SECTION1_INCOMPLETE, http: 422, condition: "ALIEN_AUTHORIZED Section 1 missing required work_auth_expiration" }
  - { id: ERR_DOCUMENT_COMBINATION_INVALID, http: 422, condition: "chosen documents are not exactly List A or exactly List B + List C" }
  - { id: ERR_DOCUMENT_EXPIRED, http: 422, condition: "a chosen non-receipt document/authorization is expired as of the clock" }
  - { id: ERR_STEM_WINDOW_MISSED, http: 422, condition: "STEM extension filed after base F-1 OPT valid_until or base not F1_OPT" }
  - { id: ERR_REFERRAL_WINDOW_CLOSED, http: 422, condition: "TNC referral attempted after referral_deadline" }
  - { id: ERR_LATE_REASON_REQUIRED, http: 422, condition: "late E-Verify submission without a late_reason" }
  - { id: ERR_STALE_ONBOARDING_VERSION, http: 412, condition: "expected_onboarding_version does not match the onboarding's current version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing/ill-typed body field or out-of-domain enum value" }
  - { id: ERR_VALIDATION_PAGINATION, http: 400, condition: "limit/offset out of pagination bounds" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: HRReviewer
    description: "Front-line HR staff who create onboardings, present documents, complete Section 1 and Section 2, and record Section 3 reverifications."
    identity: "opaque"
    exclusive_operations:
      - "POST /onboardings/{id}/section1-attest"
      - "POST /onboardings/{id}/section2-complete"
      - "POST /identity-documents"
      - "POST /i9-forms/{id}/section3"
      - "POST /work-authorizations"
    shared_operations:
      - "POST /onboardings"
      - "GET (all read endpoints)"

  - name: EVerifyOperator
    description: "Staff who submit E-Verify cases and record agency adjudication results, TNC referrals, and lifecycle advances. Partitioned from document review."
    identity: "opaque"
    exclusive_operations:
      - "POST /everify-cases"
      - "POST /everify-cases/{id}/result"
      - "POST /everify-cases/{id}/refer"
    shared_operations:
      - "POST /onboardings/{id}/advance-lifecycle"
      - "GET (all read endpoints)"

  - name: ComplianceOfficer
    description: "Compliance authority holding override and finalize powers the reviewers lack; subject to segregation-of-duties on overrides. Can set the deterministic clock for lifecycle advancement."
    identity: "opaque"
    exclusive_operations:
      - "POST /onboardings/{id}/override"
      - "POST /onboardings/{id}/finalize"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /onboardings"
      - "POST /onboardings/{id}/advance-lifecycle"
      - "GET (all read endpoints)"
