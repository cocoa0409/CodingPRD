          rationale: "The named §1.8 instance triggers ERR_RELEASE_PHASE_INVALID from an OPEN release and succeeds once the release is CUT."

  # =======================================================================
  - section: rbac
    instances:

      - name: compliance_officer_can_perform_its_exclusive_operations
        claim_type: role_grant
        grounds:
          - roles.ComplianceOfficer
          - endpoints[POST /releases/{id}/freeze-exceptions]
          - endpoints[POST /releases/{id}/evidence-packets]
          - endpoints[POST /flag-cleanup-sweeps]
        distinguishing_aspect: "One ComplianceOfficer identity drives all three of its exclusive operations end to end — freeze exception, cleanup sweep and evidence packet creation — and each returns a 2xx with its declared side effect, proving the grants are not merely read access."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Release 2026.08.1 on core-train with one LOW change merged at 2026-08-01T00:00:00Z, cut at 2026-08-08T00:00:00Z."
            - "One orphaned flag expiring 2026-07-27T00:00:00Z exists so the sweep has something to grade."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: "$.data.id" }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: "$.data.id" }
            - call: "POST /feature-flags"
              payload: { key: "legacy-pricing", owner_user_id: "u-eng-1", expires_at: "2026-07-27T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: "$.data.id" }
            - call: "POST /releases/${rel_id}/change-requests"
              payload: { title: "Small fix", summary_internal: "one-line fix", lines_changed: 40, touched_subsystem_count: 1, declared_blast_radius: "INTERNAL" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { cr_l: "$.data.id" }
            - call: "POST /change-requests/${cr_l}/submit"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /change-requests/${cr_l}/merge"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: ReleaseManager
              as_user_id: "u-rm-1"
          trigger:
            - call: "POST /releases/${rel_id}/freeze-exceptions"
              payload: { justification: "Post-cut hotfix window approved by the release office" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { exception_flag: "$.data.freeze_exception_approved" }
            - call: "POST /flag-cleanup-sweeps"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { overdue: "$.data.overdue_count" }
            - call: "GET /releases/${rel_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { rel_v: "$.data.version" }
            - call: "POST /releases/${rel_id}/evidence-packets"
              payload: { expected_release_version: "${rel_v}" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pkt_id: "$.data.id", base_index: "$.data.base_index" }
          assert:
            - "The freeze exception returns HTTP 201 with Release.${rel_id}.freeze_exception_approved == true and ReleaseTrain.${train_id}.freeze_exception_count == 1"
            - "The sweep returns HTTP 200 with evaluated_count == 1 and overdue_count == 1"
            - "FeatureFlag.${flag_id}.cleanup_state == OVERDUE with stale_debt_points == 30"
            - "The packet creation returns HTTP 201 with ComplianceEvidencePacket.${pkt_id}.state == DRAFT"
            - "ComplianceEvidencePacket.${pkt_id}.base_index == 75 and completeness_index == 75"
            - "ComplianceEvidencePacket.${pkt_id}.missing_items == [canary_pass, release_notes]"
            - "ComplianceEvidencePacket.${pkt_id}.sealed_at == null and sealed_by_user_id == null"

      - name: engineer_cannot_create_environment_and_sre_cannot_cut_release
        claim_type: role_denial
        grounds:
          - roles.PlatformAdmin
          - roles.ReleaseManager
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=2]
        distinguishing_aspect: "Peer roles cannot reach each other's exclusive operations: Engineer on POST /environments, SRE on POST /releases/{id}/cut and ReleaseManager on POST /releases/{id}/deployments each return 403 ERR_ROLE_NOT_PERMITTED, and the RBAC check fires ahead of the temporal cut gate that would otherwise have returned ERR_CUT_BEFORE_FREEZE."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Environment prod-us and Release 2026.08.1 (freeze_at 2026-08-08T00:00:00Z, still OPEN) exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /environments"
              payload: { name: "prod-us", tier: "PROD", deploy_window_start_hour_utc: 2, deploy_window_end_hour_utc: 6, cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
              captures: { env_id: "$.data.id" }
            - call: "POST /release-trains"
              payload: { name: "core-train", cadence_days: 14, code_freeze_lead_hours: 48, stabilization_hours: 72, risk_budget_points: 120 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { train_id: "$.data.id" }
            - call: "POST /release-trains/${train_id}/releases"
              payload: { version_label: "2026.08.1", cut_at: "2026-08-10T00:00:00Z" }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { rel_id: "$.data.id" }
          trigger:
            - call: "POST /environments"
              payload: { name: "rogue-env", tier: "STAGING", deploy_window_start_hour_utc: 0, deploy_window_end_hour_utc: 24 }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { e_env: "$.data.error_id" }
            - call: "POST /releases/${rel_id}/cut"
              payload: {}
              as: SRE
              as_user_id: "u-sre-1"
              captures: { e_cut: "$.data.error_id" }
            - call: "POST /releases/${rel_id}/deployments"
              payload: { environment_id: "${env_id}", window_start_at: "2026-08-10T02:00:00Z", window_end_at: "2026-08-10T04:00:00Z", strategy: "ALL_AT_ONCE", abort_error_rate_pct: 25.0, abort_latency_p95_ms: 800 }
              as: ReleaseManager
              as_user_id: "u-rm-1"
              captures: { e_dep: "$.data.error_id" }
          assert:
            - "All three calls return HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "The SRE cut returns ERR_ROLE_NOT_PERMITTED rather than ERR_CUT_BEFORE_FREEZE, since priority 2 precedes priority 29"
            - "Release.${rel_id}.phase is still OPEN"
            - "GET /deployments filtered by release_id ${rel_id} returns total_count == 0"
            - "GET /environments/${env_id} still resolves and no environment named rogue-env exists"

      - name: missing_x_user_id_header_returns_unauthenticated
        claim_type: role_denial
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - roles.identity
        distinguishing_aspect: "Authentication precedes authorisation and payload validation: a POST /release-trains with no X-User-ID header returns 401 ERR_UNAUTHENTICATED even though the body is invalid, so no ERR_INVALID_REQUEST is emitted and no train is created."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no ReleaseTrain exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
          trigger:
            - call: "POST /release-trains"
              payload: { name: "core-train" }
              as: ReleaseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "The request is sent with no X-User-ID header at all"
            - "HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "The response is not ERR_INVALID_REQUEST despite the missing required body fields"
            - "GET /release-trains with a valid header returns total_count == 0"

      - name: non_owner_engineer_cannot_start_soak_returns_not_resource_owner
        claim_type: role_denial
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=10]
          - entities.FeatureFlag.fields.owner_user_id
        distinguishing_aspect: "Holding the Engineer role is not enough for flag lifecycle actions: a second Engineer identity is refused with 403 ERR_NOT_RESOURCE_OWNER on start-soak and on rollout-step creation, while the declared owner succeeds with the identical payload."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; FeatureFlag checkout-v2 owned by u-eng-1 with one PLANNED step1 (5 pct / 30 min)."
            - "u-eng-2 also holds the Engineer role but does not own the flag."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: "$.data.id", flag_v0: "$.data.version" }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${flag_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step1: "$.data.id" }
          trigger:
            - call: "POST /flag-rollout-steps/${step1}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-2"
              captures: { e_soak: "$.data.error_id" }
            - call: "POST /flag-rollout-steps/${step1}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { ok_state: "$.data.state" }
          assert:
            - "The u-eng-2 call returns HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER"
            - "FlagRolloutStep.${step1}.state is still PLANNED after the refusal and soak_started_at == null"
            - "FeatureFlag.${flag_id}.state is still DRAFT after the refusal"
            - "The owner call returns HTTP 200 with FlagRolloutStep.${step1}.state == SOAKING"
            - "FeatureFlag.${flag_id}.state == ACTIVE_ROLLING_OUT after the owner call"

      - name: segregation_of_duties_covered_by_difficulty_instance
        claim_type: segregation_of_duties
        grounds:
          - roles.ChangeApprover
          - validations[priority=11]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / self_approval_safety_beats_approval_kind_referential_check
          rationale: "The named §1.8 instance asserts that a single user holding both the author and approver capabilities cannot approve their own change."

  # =======================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_feature_flag_version_on_rollout_step_create_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rollout-step-create-stale-flag]
          - errors[ERR_STALE_FLAG_VERSION]
          - validations[priority=7]
        distinguishing_aspect: "The OCC token is the parent flag's version: replaying the version captured before start-soak returns 412 ERR_STALE_FLAG_VERSION and creates nothing, while re-reading the flag and resubmitting the same body with the fresh version succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; FeatureFlag checkout-v2 owned by u-eng-1, version captured at creation."
            - "step1 (5 pct / 30 min) has been created and started soaking, which mutates the flag to ACTIVE_ROLLING_OUT and advances its version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-pa-1"
            - call: "POST /feature-flags"
              payload: { key: "checkout-v2", owner_user_id: "u-eng-1", expires_at: "2026-12-01T00:00:00Z" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { flag_id: "$.data.id", flag_v0: "$.data.version" }
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${flag_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { step1: "$.data.id" }
            - call: "POST /flag-rollout-steps/${step1}/start-soak"
              payload: {}
              as: Engineer
              as_user_id: "u-eng-1"
          trigger:
            - call: "POST /feature-flags/${flag_id}/rollout-steps"
              payload: { target_pct: 5, soak_minutes: 30, expected_feature_flag_version: "${flag_v0}" }
              as: Engineer
              as_user_id: "u-eng-1"
              captures: { err: "$.data.error_id" }
