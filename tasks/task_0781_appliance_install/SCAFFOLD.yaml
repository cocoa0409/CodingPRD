scenario: "781. Appliance & Electronics Installation Marketplace (Handy/retailer-install style): product-linked install (TV-mount/appliance/smart-device) & scope, retailer-referred order & scheduling, pro vetting & dispatch, parts/hardware & add-on, fixed-task pricing, warranty/redo, retailer settlement, rating"
domain_name: appliance-install-marketplace
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - selector_policy            # pro dispatch: eligibility filter + ranking + tie-break + empty-pool fallback
    - dual_variant_calculation   # quoted-vs-final job price; provisional-vs-final pro payout
    - cascading_side_effects     # completion -> payout -> settlement entry -> retailer balance
    - optimistic_concurrency     # OCC on WorkOrder.version for supersede-dispatch
  entity_topology: flat
  # Peer entities linked by foreign keys (Retailer, Customer, Pro, WorkOrder, Assignment, ...);
  # no deep nesting in URL paths beyond parent/{id}/child action segments.
  state_machine_shape: cyclic
  # WorkOrder has a warranty redo loop (COMPLETED -> REDO_REQUESTED -> DISPATCHED -> IN_PROGRESS -> COMPLETED);
  # ProApplication has an APPROVED <-> SUSPENDED cycle. Assignment is fork/branching.
  relationship_patterns:
    - one_to_many        # Retailer -> WorkOrders; Pro -> Assignments; WorkOrder -> Parts
    - cross_aggregate    # WorkOrder completion writes PayoutRecord (Pro) and RetailerSettlementEntry (Retailer)
  role_model: peer_roles
  # Retailer / Pro / Customer own distinct resource types; PlatformAdmin is the operational role.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# =====================================================================
entities:
  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Retailer chain / store display name.
      - name: status
        type: enum
        source: system
        description: Retailer account status; gates whether new work orders may be scheduled.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; starts ACTIVE on create"
      - name: commission_rate_bps
        type: integer
        source: input
        description: "Referral fee the retailer retains, in basis points of the install task base price. Used by referral_fee calc."
        constraints: "0..10000"
      - name: settlement_balance_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this retailer's RetailerSettlementEntry rows whose status == PENDING (REVERSAL rows carry negative amount_cents). Recomputed on every settlement-entry create/reverse/settle."
        default: 0

  - name: ServiceZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: Human-readable zone code (e.g., "SF-94103").
        constraints: "unique across ServiceZone"
      - name: name
        type: string
        source: input
        description: Zone display name.
      - name: max_concurrent_appointments
        type: integer
        source: input
        description: "Aggregate capacity: max number of ACCEPTED assignments whose appointment windows may overlap within this zone at once."
        constraints: ">= 1"
      - name: coverage_active
        type: boolean
        source: input
        description: Whether the platform currently services this zone; gates scheduling.
        default: true

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Customer full name.
      - name: email
        type: string
        source: input
        description: Customer contact email.
      - name: phone
        type: string
        source: input
        description: Customer contact phone.
      - name: address_line
        type: string
        source: input
        description: Service address line for the install.

  - name: Pro
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Installer professional's full name.
      - name: email
        type: string
        source: input
        description: Pro contact email.
      - name: service_zone_id
        type: string
        source: input
        description: "FK -> ServiceZone.id; the single zone this pro serves."
      - name: skills
        type: array
        source: input
        description: "Set of install categories the pro can perform."
        constraints: "non-empty subset of {TV_MOUNT, APPLIANCE, SMART_DEVICE}"
      - name: pending_payout_cents
        type: integer
        source: computed
        description: "Sum of payout_cents over this pro's PayoutRecord rows whose status IN {PENDING, RELEASED}. HELD and REVERSED rows are excluded. Recomputed on every payout state change."
        default: 0
      - name: reserved_slot_count
        type: integer
        source: computed
        description: "Count of this pro's Assignment rows whose status IN {OFFERED, ACCEPTED}. Incremented on offer, decremented on decline/expire/cancel."
        default: 0
      - name: rating_sum
        type: integer
        source: computed
        description: "Running sum of stars across this pro's Rating rows."
        default: 0
      - name: rating_count
        type: integer
        source: computed
        description: "Count of this pro's Rating rows."
        default: 0
      - name: rating_avg
        type: number
        source: computed
        description: "rating_sum / rating_count rounded to 2 decimals (round_half_up); 0 when rating_count == 0. Used as the primary dispatch ranking key."
        default: 0

  - name: ProApplication
    parent: null
    common_fields: true
    fields:
      - name: pro_id
        type: string
        source: input
        description: "FK -> Pro.id; the pro this vetting application belongs to."
      - name: status
        type: enum
        source: system
        description: Vetting lifecycle state.
        default: PENDING_REVIEW
        constraints: "one of {PENDING_REVIEW, APPROVED, REJECTED, SUSPENDED, EXPIRED}"
      - name: background_check_ref
        type: string
        source: input
        description: External background-check reference id.
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock timestamp when the application was approved; null until APPROVED.
      - name: expires_at
        type: datetime
        source: system
        description: "approved_at + VETTING_VALID_DAYS; the vetting is considered EXPIRED once the logical clock passes this instant."

  - name: InstallTask
    parent: null
    common_fields: true
    fields:
      - name: task_code
        type: string
        source: input
        description: Catalog code (e.g., "TV_MOUNT_STD").
        constraints: "unique across InstallTask"
      - name: name
        type: string
        source: input
        description: Task display name.
      - name: category
        type: enum
        source: input
        description: Install category.
        constraints: "one of {TV_MOUNT, APPLIANCE, SMART_DEVICE}"
      - name: required_skill
        type: enum
        source: input
        description: Skill a pro must hold to perform this task.
        constraints: "one of {TV_MOUNT, APPLIANCE, SMART_DEVICE}"
      - name: base_price_cents
        type: integer
        source: input
        description: Fixed-task base labor price in cents.
        constraints: ">= 0"
      - name: estimated_minutes
        type: integer
        source: input
        description: Estimated on-site duration; informational.
        constraints: ">= 1"
      - name: warranty_days
        type: integer
        source: input
        description: "Warranty window length in days; a redo may be requested up to completed_at + warranty_days (inclusive)."
        constraints: ">= 0"

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: addon_code
        type: string
        source: input
        description: Catalog add-on code (e.g., "CABLE_CONCEAL").
        constraints: "unique across AddOn"
      - name: name
        type: string
        source: input
        description: Add-on display name.
      - name: category
        type: enum
        source: input
        description: Category this add-on is compatible with; must match the work order's install task category.
        constraints: "one of {TV_MOUNT, APPLIANCE, SMART_DEVICE}"
      - name: price_cents
        type: integer
        source: input
        description: Add-on list price in cents.
        constraints: ">= 0"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer that referred this order."
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the end customer receiving the install."
      - name: install_task_id
        type: string
        source: input
        description: "FK -> InstallTask.id; the fixed task being installed."
      - name: service_zone_id
        type: string
        source: input
        description: "FK -> ServiceZone.id; the zone the appointment falls in."
      - name: appointment_pro_id
        type: string
        source: system
        description: "FK -> Pro.id; the pro selected by dispatch for the current appointment; null until DISPATCHED, cleared on revert to SCHEDULED."
      - name: product_sku
        type: string
        source: input
        description: Retailer product SKU that this install is linked to.
      - name: product_category
        type: enum
        source: input
        description: Category of the purchased product; must equal the install task category.
        constraints: "one of {TV_MOUNT, APPLIANCE, SMART_DEVICE}"
      - name: scope_notes
        type: string
        source: input
        description: Free-text scope of work.
      - name: selected_addon_ids
        type: array
        source: system
        description: "Ordered list of AddOn.id values attached to this order (via schedule payload). Each contributes its price_cents to pricing."
        default: "[]"
      - name: status
        type: enum
        source: system
        description: Work order lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, DISPATCHED, IN_PROGRESS, COMPLETED, REDO_REQUESTED, CANCELLED, CLOSED}"
      - name: scheduled_start
        type: datetime
        source: input
        description: Appointment window start (UTC); set at schedule time.
      - name: scheduled_end
        type: datetime
        source: input
        description: Appointment window end (UTC); set at schedule time.
      - name: quoted_price_cents
        type: integer
        source: computed
        description: "Provisional estimate computed at schedule time: base_price_cents + sum(AddOn.price_cents for selected_addon_ids). Excludes parts, bundle discount, and zone surcharge."
        default: 0
      - name: final_price_cents
        type: integer
        source: computed
        description: "Authoritative charge computed at completion by the work_order_final_price calc (base + discounted add-ons + parts billed + zone surcharge)."
        default: 0
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent COMPLETED transition.
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: "completed_at + InstallTask.warranty_days; recomputed on each COMPLETED transition. Redo allowed while clock <= this value."
      - name: redo_count
        type: integer
        source: computed
        description: "Number of times this work order has entered REDO_REQUESTED. Drives the pro payout redo penalty."
        default: 0

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the order this dispatch offer is for."
      - name: pro_id
        type: string
        source: input
        description: "FK -> Pro.id; the pro the order was offered to."
      - name: status
        type: enum
        source: system
        description: Dispatch offer state.
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, DECLINED, EXPIRED, CANCELLED}"
      - name: appointment_start
        type: datetime
        source: system
        description: Copied from the work order's scheduled_start at dispatch.
      - name: appointment_end
        type: datetime
        source: system
        description: Copied from the work order's scheduled_end at dispatch.
      - name: offered_at
        type: datetime
        source: system
        description: Logical-clock timestamp the offer was created.
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock timestamp of accept/decline; null while OFFERED.

  - name: Part
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the order this part/hardware line belongs to."
      - name: name
        type: string
        source: input
        description: Part/hardware description.
      - name: unit_cost_cents
        type: integer
        source: input
        description: Pro's acquisition cost per unit in cents (reimbursed to pro at cost).
        constraints: ">= 0"
      - name: quantity
        type: integer
        source: input
        description: Number of units.
        constraints: ">= 1"
      - name: markup_bps
        type: integer
        source: input
        description: "Platform markup in basis points applied to (unit_cost_cents * quantity) when billing the customer."
        constraints: "0..20000"
      - name: line_billed_cents
        type: integer
        source: computed
        description: "round_half_up(unit_cost_cents * quantity * (10000 + markup_bps) / 10000); the per-line billed amount. Rounding is per-line then summed (see parts_billed calc)."
        default: 0

  - name: PayoutRecord
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the completed order that generated this payout."
      - name: pro_id
        type: string
        source: input
        description: "FK -> Pro.id; the pro to be paid."
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the referring retailer (denormalized for settlement)."
      - name: gross_task_cents
        type: integer
        source: computed
        description: "base_price_cents + discounted add-ons total at completion (labor basis for commission)."
        default: 0
      - name: commission_cents
        type: integer
        source: computed
        description: "round_half_up(gross_task_cents * PLATFORM_COMMISSION_BPS / 10000)."
        default: 0
      - name: parts_reimbursement_cents
        type: integer
        source: computed
        description: "sum(unit_cost_cents * quantity) over the order's Part rows (reimbursed at cost, no markup)."
        default: 0
      - name: payout_cents
        type: integer
        source: computed
        description: "Provisional (PENDING/HELD): gross_task_cents - commission_cents + parts_reimbursement_cents. Final (RELEASED): max(0, provisional - REDO_PENALTY_CENTS * WorkOrder.redo_count)."
        default: 0
      - name: status
        type: enum
        source: system
        description: Payout lifecycle state.
        default: PENDING
        constraints: "one of {PENDING, HELD, RELEASED, REVERSED}"

  - name: RetailerSettlementEntry
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer that owes / is credited this entry."
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the order the entry derives from."
      - name: payout_record_id
        type: string
        source: input
        description: "FK -> PayoutRecord.id; the payout that triggered this settlement entry."
      - name: entry_type
        type: enum
        source: system
        description: CHARGE (retailer owes platform) or REVERSAL (compensating credit).
        constraints: "one of {CHARGE, REVERSAL}"
      - name: amount_cents
        type: integer
        source: computed
        description: "CHARGE: final_price_cents - referral_fee_cents. REVERSAL: negative of the CHARGE it reverses. Contributes to Retailer.settlement_balance_cents while status == PENDING."
        default: 0
      - name: status
        type: enum
        source: system
        description: Settlement entry state.
        default: PENDING
        constraints: "one of {PENDING, SETTLED, REVERSED}"
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock timestamp the entry was included in a settlement run; null while PENDING.

  - name: Rating
    parent: null
    common_fields: false
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the completed order being rated (at most one rating per order)."
      - name: pro_id
        type: string
        source: system
        description: "FK -> Pro.id; copied from the work order's appointment_pro_id."
      - name: customer_id
        type: string
        source: system
        description: "FK -> Customer.id; copied from the work order's customer_id."
      - name: stars
        type: integer
        source: input
        description: Star rating.
        constraints: "integer 1..5"
      - name: comment
        type: string
        source: input
        description: Optional free-text review.

# =====================================================================
# §1.2 STATE MACHINE TABLE
# =====================================================================
state_machines:
  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED, CLOSED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: Retailer
        preconditions:
          - "WorkOrder.status == DRAFT"
          - "Retailer.status == ACTIVE (cross-entity: WorkOrder.retailer_id)"
          - "ServiceZone.coverage_active == true (WorkOrder.service_zone_id)"
          - "scheduled_start < scheduled_end"
          - "every id in selected_addon_ids resolves to an AddOn whose category == InstallTask.category"
        side_effects:
          - "set scheduled_start, scheduled_end, selected_addon_ids"
          - "compute quoted_price_cents = base_price_cents + sum(AddOn.price_cents)"
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "WorkOrder.status == SCHEDULED"
          - "expected_work_order_version matches WorkOrder.version (OCC)"
          - "at least one eligible pro exists (see dispatch_pro_selection calc); else ERR_NO_ELIGIBLE_PRO"
        side_effects:
          - "select pro via dispatch_pro_selection; set appointment_pro_id"
          - "create Assignment{status:OFFERED, appointment_start/end copied} for the selected pro"
          - "increment selected Pro.reserved_slot_count by 1 (via Assignment OFFERED)"
          - "increments WorkOrder.version by 1"
      - from: DISPATCHED
        to: SCHEDULED
        trigger: "POST /assignments/{id}/decline or POST /assignments/{id}/expire (system)"
        actor: Pro
        preconditions:
          - "the order's active Assignment moves to DECLINED or EXPIRED"
        side_effects:
          - "clear appointment_pro_id"
          - "decrement that Pro.reserved_slot_count by 1 (via Assignment terminalization)"
        note: "Redo loop / re-dispatch: the order becomes schedulable/dispatchable again."
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: Pro
        preconditions:
          - "WorkOrder.status == DISPATCHED"
          - "the order's active Assignment.status == ACCEPTED (cross-entity)"
          - "X-User-ID == WorkOrder.appointment_pro_id"
        side_effects:
          - "record work started"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: Pro
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
          - "clock >= scheduled_start (appointment window has started)"
          - "X-User-ID == WorkOrder.appointment_pro_id"
        side_effects:
          - "compute final_price_cents (work_order_final_price calc)"
          - "set completed_at = clock; warranty_expires_at = completed_at + warranty_days"
          - "CASCADE L1: create PayoutRecord{status:PENDING} (pro_payout provisional)"
          - "PayoutRecord creation CASCADE L2: create RetailerSettlementEntry{entry_type:CHARGE, status:PENDING} (retailer_settlement_charge calc)"
          - "RetailerSettlementEntry creation CASCADE L3: recompute Retailer.settlement_balance_cents"
          - "recompute appointment Pro.pending_payout_cents"
      - from: COMPLETED
        to: REDO_REQUESTED
        trigger: "POST /work-orders/{id}/request-redo"
        actor: Customer
        preconditions:
          - "WorkOrder.status == COMPLETED"
          - "clock <= warranty_expires_at (else ERR_WARRANTY_EXPIRED)"
          - "X-User-ID == WorkOrder.customer_id"
        side_effects:
          - "increment redo_count by 1"
          - "CASCADE R2: transition the order's PayoutRecord PENDING->HELD"
          - "PayoutRecord HELD CASCADE R3: recompute appointment Pro.pending_payout_cents (HELD excluded)"
      - from: REDO_REQUESTED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "WorkOrder.status == REDO_REQUESTED"
          - "expected_work_order_version matches WorkOrder.version (OCC)"
          - "at least one eligible pro exists"
        side_effects:
          - "select pro; set appointment_pro_id; create Assignment{OFFERED}"
          - "increment selected Pro.reserved_slot_count by 1"
          - "increments WorkOrder.version by 1"
        note: "Closes the warranty redo cycle back into DISPATCHED -> IN_PROGRESS -> COMPLETED."
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /work-orders/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "WorkOrder.status == COMPLETED"
          - "clock > warranty_expires_at (warranty window has elapsed)"
        side_effects:
          - "transition the order's PayoutRecord PENDING->RELEASED (pro_payout final variant applied)"
          - "recompute appointment Pro.pending_payout_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Retailer
        preconditions:
          - "WorkOrder.status == DRAFT"
        side_effects: ["record cancellation reason"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Retailer
        preconditions:
          - "WorkOrder.status == SCHEDULED"
        side_effects: ["record cancellation reason"]
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "WorkOrder.status == DISPATCHED"
        side_effects:
          - "transition the order's active Assignment OFFERED/ACCEPTED -> CANCELLED"
          - "decrement that Pro.reserved_slot_count by 1"
      - from: COMPLETED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "WorkOrder.status == COMPLETED"
        side_effects:
          - "COMPENSATION: transition PayoutRecord PENDING/HELD -> REVERSED"
          - "if the order's CHARGE settlement entry is PENDING: transition it PENDING->REVERSED (it stops contributing to the balance). If it is already SETTLED: create a compensating RetailerSettlementEntry{entry_type:REVERSAL, amount = -(original CHARGE amount), status:PENDING}"
          - "recompute Retailer.settlement_balance_cents and appointment Pro.pending_payout_cents (net contribution of this order returns to 0)"

  - entity: ProApplication
    initial_state: PENDING_REVIEW
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: PlatformAdmin
        preconditions: ["ProApplication.status == PENDING_REVIEW"]
        side_effects:
          - "set approved_at = clock; expires_at = clock + VETTING_VALID_DAYS"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: PlatformAdmin
        preconditions: ["ProApplication.status == PENDING_REVIEW"]
        side_effects: ["record rejection"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /applications/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["ProApplication.status == APPROVED"]
        side_effects: ["pro becomes dispatch-ineligible while suspended"]
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /applications/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: ["ProApplication.status == SUSPENDED"]
        side_effects: ["restore approved_at/expires_at (unchanged); pro dispatch-eligible again"]
        note: "APPROVED <-> SUSPENDED cycle."
      - from: APPROVED
        to: EXPIRED
        trigger: "system: clock > expires_at, evaluated at dispatch/accept eligibility time"
        actor: system
        preconditions: ["clock > expires_at"]
        side_effects: ["pro dispatch-ineligible"]

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/accept"
        actor: Pro
        preconditions:
          - "Assignment.status == OFFERED"
          - "X-User-ID == Assignment.pro_id"
          - "the pro's ProApplication.status == APPROVED and clock <= expires_at (cross-entity; else ERR_PRO_NOT_APPROVED / ERR_VETTING_EXPIRED)"
          - "no PRO schedule conflict with buffer (pro_schedule_overlap)"
          - "zone aggregate capacity not exceeded (zone_capacity_overlap)"
        side_effects: ["set responded_at = clock"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/decline"
        actor: Pro
        preconditions:
          - "Assignment.status == OFFERED"
          - "X-User-ID == Assignment.pro_id"
        side_effects:
          - "set responded_at = clock"
          - "decrement Pro.reserved_slot_count by 1"
          - "revert WorkOrder DISPATCHED -> SCHEDULED and clear appointment_pro_id"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /assignments/{id}/expire (system)"
        actor: system
        preconditions:
          - "Assignment.status == OFFERED"
          - "clock >= offered_at + OFFER_TTL_HOURS"
        side_effects:
          - "decrement Pro.reserved_slot_count by 1"
          - "revert WorkOrder DISPATCHED -> SCHEDULED and clear appointment_pro_id"
      - from: OFFERED
        to: CANCELLED
        trigger: "system: WorkOrder cancelled while DISPATCHED"
        actor: system
        preconditions: ["parent WorkOrder transitions to CANCELLED"]
        side_effects: ["decrement Pro.reserved_slot_count by 1"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system: WorkOrder cancelled while DISPATCHED after accept"
        actor: system
        preconditions: ["parent WorkOrder transitions to CANCELLED"]
        side_effects: ["decrement Pro.reserved_slot_count by 1"]

  - entity: PayoutRecord
    initial_state: PENDING
    terminal_states: [RELEASED, REVERSED]
    transitions:
      - from: PENDING
        to: HELD
        trigger: "system: WorkOrder COMPLETED -> REDO_REQUESTED"
        actor: system
        preconditions: ["PayoutRecord.status == PENDING"]
        side_effects: ["recompute Pro.pending_payout_cents (HELD excluded)"]
      - from: HELD
        to: PENDING
        trigger: "system: WorkOrder REDO_REQUESTED -> ... -> COMPLETED (redo completed)"
        actor: system
        preconditions: ["PayoutRecord.status == HELD"]
        side_effects: ["recompute Pro.pending_payout_cents"]
      - from: PENDING
        to: RELEASED
        trigger: "system: WorkOrder COMPLETED -> CLOSED"
        actor: system
        preconditions: ["PayoutRecord.status == PENDING", "clock > WorkOrder.warranty_expires_at"]
        side_effects:
          - "recompute payout_cents via pro_payout final variant (apply redo penalty)"
          - "recompute Pro.pending_payout_cents"
      - from: PENDING
        to: REVERSED
        trigger: "system: WorkOrder COMPLETED -> CANCELLED"
        actor: system
        preconditions: ["PayoutRecord.status == PENDING"]
        side_effects: ["recompute Pro.pending_payout_cents (REVERSED excluded)"]
      - from: HELD
        to: REVERSED
        trigger: "system: WorkOrder COMPLETED -> CANCELLED after a redo hold"
        actor: system
        preconditions: ["PayoutRecord.status == HELD"]
        side_effects: ["recompute Pro.pending_payout_cents"]

  - entity: RetailerSettlementEntry
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /retailers/{id}/settlements (settlement run)"
        actor: PlatformAdmin
        preconditions:
          - "RetailerSettlementEntry.status == PENDING"
          - "entry belongs to the retailer being settled"
        side_effects:
          - "set settled_at = clock"
          - "recompute Retailer.settlement_balance_cents (SETTLED excluded)"
      - from: PENDING
        to: REVERSED
        trigger: "system: WorkOrder COMPLETED -> CANCELLED, when the CHARGE entry is still PENDING (unsettled)"
        actor: system
        preconditions: ["RetailerSettlementEntry.status == PENDING", "entry_type == CHARGE"]
        side_effects:
          - "the CHARGE stops contributing; recompute Retailer.settlement_balance_cents (the order's net contribution returns to 0). If the CHARGE was already SETTLED, a separate compensating REVERSAL entry is created instead (see WorkOrder cancel side effects)."

concurrency_rules:
  - rule_id: dispatch-supersede-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/dispatch"
    occ_field: "expected_work_order_version"
    description: |
      Dispatching a WorkOrder creates a fresh OFFERED Assignment and advances the
      order's version. A dispatch that carries a version older than the order's
      current version is rejected: it means the order was already dispatched (or
      reverted and re-dispatched) since the caller last observed it, so this offer
      would wrongly supersede the live one. The check is a stale-version comparison
      on WorkOrder.version, not a timing rule.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 CALCULATION RULES TABLE
# =====================================================================
calculations:
  - name: work_order_quoted_price
    trigger: "WorkOrder DRAFT -> SCHEDULED (POST /work-orders/{id}/schedule)"
    algorithm: aggregation
    formula: |
      quoted_price_cents = InstallTask.base_price_cents
                         + sum(AddOn.price_cents for id in selected_addon_ids)
    input_set: "The order's install task base price plus every selected add-on at list price. No bundle discount, no parts, no zone surcharge — this is the provisional estimate."
    constants: {}
    precision: "integer cents; no rounding needed (all inputs integer)"
    variants:
      - name: provisional_quote
        when: "at schedule time"
        difference: "This is the provisional half of the dual-variant job price; the final half is work_order_final_price. For identical add-on selection the two diverge whenever a bundle discount, parts, or a zone surcharge applies."

  - name: work_order_final_price
    trigger: "WorkOrder IN_PROGRESS -> COMPLETED (POST /work-orders/{id}/complete)"
    algorithm: tiered_pricing
    formula: |
      addons_gross   = sum(AddOn.price_cents for id in selected_addon_ids)
      bundle_discount = 0
      if count(selected_addon_ids) >= BUNDLE_MIN_ADDONS:
          bundle_discount = min( round_half_up(addons_gross * BUNDLE_DISCOUNT_BPS / 10000),
                                 MAX_BUNDLE_DISCOUNT_CENTS )
      final_addons   = addons_gross - bundle_discount
      parts_billed   = parts_billed_total            # see parts_billed_total calc
      zone_surcharge = 0
      if hour_utc(scheduled_start) < STANDARD_START_HOUR_UTC
         or hour_utc(scheduled_end) > STANDARD_END_HOUR_UTC:
          zone_surcharge = max( AFTER_HOURS_FLAT_CENTS,
                                round_half_up(base_price_cents * AFTER_HOURS_BPS / 10000) )
      final_price_cents = base_price_cents + final_addons + parts_billed + zone_surcharge
    input_set: "Base task price, discounted add-ons, per-line billed parts total, and an after-hours zone surcharge if the appointment falls outside standard UTC business hours."
    constants:
      BUNDLE_MIN_ADDONS: 3
      BUNDLE_DISCOUNT_BPS: 1000
      MAX_BUNDLE_DISCOUNT_CENTS: 5000
      AFTER_HOURS_FLAT_CENTS: 4000
      AFTER_HOURS_BPS: 1500
      STANDARD_START_HOUR_UTC: 8
      STANDARD_END_HOUR_UTC: 18
    precision: "integer cents; each round_half_up applied where noted; combinatorial min/max evaluated in the order shown"
    variants:
      - name: final_price
        when: "at completion"
        difference: "Final half of the dual-variant job price; combinatorial (>=3 additive inputs with a min-capped bundle discount and a max-selected zone surcharge). Diverges from work_order_quoted_price whenever a discount, parts, or surcharge is present."

  - name: parts_billed_total
    trigger: "referenced by work_order_final_price at completion"
    algorithm: aggregation
    formula: |
      # ROUND-PER-LINE-THEN-SUM (pinned order; NOT sum-then-round).
      for each Part p of the order:
          p.line_billed_cents = round_half_up(p.unit_cost_cents * p.quantity
                                              * (10000 + p.markup_bps) / 10000)
      parts_billed_total = sum(p.line_billed_cents over the order's Part rows)
    input_set: "All Part rows attached to the work order at completion."
    constants: {}
    precision: "round_half_up per line, THEN integer sum. The rounding order is pinned: rounding after summing the raw products can differ by 1+ cent and is NOT used."
    variants:
      - name: per_line_rounding
        when: "always"
        difference: "Nested-rounding combinatorial rule: 'round each line then sum' is authoritative and can differ from 'sum then round' at fractional-cent lines."

  - name: pro_payout
    trigger: "PayoutRecord creation at WorkOrder COMPLETED (provisional); PayoutRecord PENDING->RELEASED at WorkOrder CLOSED (final)"
    algorithm: threshold
    formula: |
      gross_task_cents         = base_price_cents + final_addons          # final_addons from work_order_final_price
      commission_cents         = round_half_up(gross_task_cents * PLATFORM_COMMISSION_BPS / 10000)
      parts_reimbursement_cents = sum(unit_cost_cents * quantity over Part rows)   # at cost, no markup
      provisional_payout       = gross_task_cents - commission_cents + parts_reimbursement_cents
      # FINAL variant (on RELEASED):
      final_payout             = max(0, provisional_payout - REDO_PENALTY_CENTS * WorkOrder.redo_count)
    input_set: "The completed order's labor basis, platform commission, and at-cost parts reimbursement. The final variant subtracts a per-redo penalty."
    constants:
      PLATFORM_COMMISSION_BPS: 2500
      REDO_PENALTY_CENTS: 3000
    precision: "integer cents; round_half_up on commission; final variant floored at 0"
    variants:
      - name: provisional_payout
        when: "PayoutRecord PENDING/HELD (at completion)"
        difference: "No redo penalty applied."
      - name: final_payout
        when: "PayoutRecord RELEASED (at close, after warranty)"
        difference: "Subtracts REDO_PENALTY_CENTS * redo_count, floored at 0. Diverges from provisional whenever redo_count > 0. Dual-variant on the Pro-payout domain (distinct from the WorkOrder-pricing dual variant)."

  - name: retailer_settlement_charge
    trigger: "RetailerSettlementEntry CHARGE creation at WorkOrder COMPLETED"
    algorithm: aggregation
    formula: |
      referral_fee_cents = round_half_up(base_price_cents * Retailer.commission_rate_bps / 10000)
      amount_cents       = final_price_cents - referral_fee_cents
    input_set: "The order's final price less the retailer's retained referral fee (a fraction of base price)."
    constants: {}
    precision: "integer cents; round_half_up on referral fee"
    variants:
      - name: charge_amount
        when: "at completion"
        difference: "Positive CHARGE. A later cancel-after-complete creates a REVERSAL of -amount_cents so the order's net settlement contribution is exactly 0 (see settlement_conservation invariant)."

  - name: retailer_settlement_run
    trigger: "POST /retailers/{id}/settlements"
    algorithm: aggregation
    formula: |
      selected = RetailerSettlementEntry rows where retailer_id == R
                 and status == PENDING and created_at <= period_end
      for e in selected: e.status = SETTLED; e.settled_at = clock
      settled_entry_count = count(selected)
      gross_settled_cents = sum(e.amount_cents for e in selected)   # REVERSAL rows contribute negatives
    input_set: "All PENDING settlement entries for the retailer created at or before period_end (inclusive)."
    constants: {}
    precision: "integer cents"
    variants:
      - name: run_summary
        when: "on settle"
        difference: "Emits an inline summary object; drives Retailer.settlement_balance_cents down to the sum of any still-PENDING entries created after period_end."

  - name: dispatch_pro_selection
    trigger: "WorkOrder -> DISPATCHED (POST /work-orders/{id}/dispatch)"
    algorithm: weighted_scoring
    formula: |
      candidates = Pro p where:
          InstallTask.required_skill in p.skills
          and p.service_zone_id == WorkOrder.service_zone_id
          and EXISTS ProApplication a of p with a.status == APPROVED and clock <= a.expires_at
          and NOT EXISTS ACCEPTED Assignment of p overlapping [scheduled_start, scheduled_end)
              expanded by TRAVEL_BUFFER_MINUTES on both sides (pro_schedule_overlap semantics)
      if candidates is empty: raise ERR_NO_ELIGIBLE_PRO
      rank by: rating_avg DESC, then pending_payout_cents ASC, then created_at ASC
      selected = first candidate
    input_set: "Approved, in-zone, skill-matched pros with no conflicting accepted appointment."
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    precision: "n/a"
    variants:
      - name: rank_selection
        when: "on dispatch"
        difference: "Deterministic selector: eligibility predicate + ranking (rating_avg desc, pending_payout asc) + created_at ASC tie-break + empty-pool fallback ERR_NO_ELIGIBLE_PRO. No random/id inputs."

  - name: pro_rating_aggregate
    trigger: "POST /work-orders/{id}/ratings"
    algorithm: aggregation
    formula: |
      rating_sum   += stars
      rating_count += 1
      rating_avg    = round_half_up(rating_sum / rating_count, 2)   # 0 when rating_count == 0
    input_set: "All Rating rows for the pro."
    constants: {}
    precision: "2 decimals, round_half_up"
    variants:
      - name: running_average
        when: "on each new rating"
        difference: "Incremental running average; feeds dispatch ranking primary key."

# =====================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "acting entity owns the target resource (Retailer==retailer_id / Pro==appointment_pro_id or Assignment.pro_id / Customer==customer_id)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "ownership-scoped mutations"
  - priority: 4
    category: existence
    check: "path/body-referenced resources exist, validated left-to-right"
    error_id: ERR_<RESOURCE>_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, stars in 1..5, integer cents. (Appointment-window ordering is checked separately at priority 6.)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
  - priority: 6
    category: business_temporal
    check: "scheduled_start < scheduled_end for schedule"
    error_id: ERR_INVALID_APPOINTMENT_WINDOW
    http_status: 422
    applies_to: "POST /work-orders/{id}/schedule"
  - priority: 7
    category: state
    check: "target entity is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: state
    check: "target entity is not already in a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: business_referential
    check: "retailer is ACTIVE when scheduling (cross-entity WorkOrder.retailer_id)"
    error_id: ERR_RETAILER_SUSPENDED
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"
  - priority: 10
    category: business_referential
    check: "service zone coverage_active == true when scheduling"
    error_id: ERR_ZONE_COVERAGE_INACTIVE
    http_status: 409
    applies_to: "POST /work-orders/{id}/schedule"
  - priority: 11
    category: business_constraint
    check: "each selected add-on's category == install task category"
    error_id: ERR_ADDON_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /work-orders/{id}/schedule"
  - priority: 12
    category: business_safety
    check: "accepting pro has an APPROVED ProApplication (not SUSPENDED/REJECTED/PENDING)"
    error_id: ERR_PRO_NOT_APPROVED
    http_status: 409
    applies_to: "POST /assignments/{id}/accept"
  - priority: 13
    category: business_safety
    check: "accepting pro's approved vetting has not expired (clock <= expires_at)"
    error_id: ERR_VETTING_EXPIRED
    http_status: 409
    applies_to: "POST /assignments/{id}/accept"
  - priority: 15
    category: business_temporal
    check: "no pro schedule conflict: [start,end) expanded by TRAVEL_BUFFER_MINUTES must not overlap another ACCEPTED assignment of the same pro"
    error_id: ERR_PRO_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /assignments/{id}/accept"
  - priority: 16
    category: business_constraint
    check: "zone aggregate capacity: count of ACCEPTED assignments in the zone overlapping [start,end) must be < ServiceZone.max_concurrent_appointments"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments/{id}/accept"
  - priority: 17
    category: business_temporal
    check: "completion allowed only once clock >= scheduled_start"
    error_id: ERR_APPOINTMENT_NOT_STARTED
    http_status: 422
    applies_to: "POST /work-orders/{id}/complete"
  - priority: 18
    category: business_temporal
    check: "redo requested within warranty: clock <= warranty_expires_at"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /work-orders/{id}/request-redo"
  - priority: 19
    category: business_constraint
    check: "no eligible pro for dispatch -> empty candidate pool"
    error_id: ERR_NO_ELIGIBLE_PRO
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 20
    category: business_constraint
    check: "at most one Rating per work order"
    error_id: ERR_DUPLICATE_RATING
    http_status: 409
    applies_to: "POST /work-orders/{id}/ratings"
  - priority: 21
    category: state
    check: "rating allowed only when work order status IN {COMPLETED, CLOSED}"
    error_id: ERR_RATING_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /work-orders/{id}/ratings"
  - priority: 22
    category: business_constraint
    check: "OCC: expected_work_order_version == WorkOrder.version on dispatch"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /work-orders/{id}/dispatch"

# =====================================================================
# §1.5 API ENDPOINT TABLE
# =====================================================================
endpoints:
  # ----- Retailer -----
  - method: POST
    path: "/retailers"
    description: Create a retailer account (starts ACTIVE).
    roles: [PlatformAdmin]
    code: 201
    input: [name, commission_rate_bps]
    output: Retailer
    side_effects: ["status=ACTIVE", "settlement_balance_cents=0"]
  - method: GET
    path: "/retailers/{id}"
    description: Fetch a retailer.
    roles: [PlatformAdmin, Retailer]
    code: 200
    input: []
    output: Retailer
    side_effects: []
  - method: PATCH
    path: "/retailers/{id}/status"
    description: Suspend or reactivate a retailer.
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Retailer
    side_effects: ["set status IN {ACTIVE, SUSPENDED}"]
  - method: POST
    path: "/retailers/{id}/settlements"
    description: Run a retailer settlement — mark all PENDING settlement entries created at or before period_end as SETTLED; returns a run summary.
    roles: [PlatformAdmin]
    code: 200
    input: [period_end]
    output: "{ retailer_id: string, settled_entry_count: integer, gross_settled_cents: integer, remaining_balance_cents: integer }"
    side_effects: ["RetailerSettlementEntry PENDING->SETTLED (retailer_settlement_run)", "recompute Retailer.settlement_balance_cents"]

  # ----- ServiceZone -----
  - method: POST
    path: "/service-zones"
    description: Create a service zone.
    roles: [PlatformAdmin]
    code: 201
    input: [zone_code, name, max_concurrent_appointments, "coverage_active?"]
    output: ServiceZone
    side_effects: []
  - method: GET
    path: "/service-zones/{id}"
    description: Fetch a service zone.
    roles: [PlatformAdmin, Retailer, Pro]
    code: 200
    input: []
    output: ServiceZone
    side_effects: []

  # ----- Customer -----
  - method: POST
    path: "/customers"
    description: Create a customer.
    roles: [PlatformAdmin, Retailer]
    code: 201
    input: [full_name, email, phone, address_line]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: Fetch a customer.
    roles: [PlatformAdmin, Retailer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ----- Pro -----
  - method: POST
    path: "/pros"
    description: Create a pro (installer) profile.
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, service_zone_id, skills]
    output: Pro
    side_effects: ["counters initialized to 0"]
  - method: GET
    path: "/pros/{id}"
    description: Fetch a pro.
    roles: [PlatformAdmin, Pro]
    code: 200
    input: []
    output: Pro
    side_effects: []
  - method: GET
    path: "/pros"
    description: List pros, optionally filtered by service zone.
    roles: [PlatformAdmin]
    code: 200
    input: ["service_zone_id?", "limit?", "offset?"]
    output: Pro[]
    side_effects: []

  # ----- ProApplication -----
  - method: POST
    path: "/pros/{id}/applications"
    description: Submit a vetting application for a pro (PENDING_REVIEW).
    roles: [PlatformAdmin]
    code: 201
    input: [background_check_ref]
    output: ProApplication
    side_effects: ["status=PENDING_REVIEW"]
  - method: GET
    path: "/applications/{id}"
    description: Fetch a vetting application.
    roles: [PlatformAdmin, Pro]
    code: 200
    input: []
    output: ProApplication
    side_effects: []
  - method: GET
    path: "/applications"
    description: List vetting applications, filtered by pro.
    roles: [PlatformAdmin, Pro]
    code: 200
    input: ["pro_id?", "limit?", "offset?"]
    output: ProApplication[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/approve"
    description: Approve a pending application.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProApplication
    side_effects: ["set approved_at, expires_at = clock + VETTING_VALID_DAYS", "status=APPROVED"]
  - method: POST
    path: "/applications/{id}/reject"
    description: Reject a pending application.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProApplication
    side_effects: ["status=REJECTED"]
  - method: POST
    path: "/applications/{id}/suspend"
    description: Suspend an approved application.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProApplication
    side_effects: ["status=SUSPENDED"]
  - method: POST
    path: "/applications/{id}/reinstate"
    description: Reinstate a suspended application back to APPROVED.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProApplication
    side_effects: ["status=APPROVED"]

  # ----- InstallTask -----
  - method: POST
    path: "/install-tasks"
    description: Create a fixed-task catalog entry.
    roles: [PlatformAdmin]
    code: 201
    input: [task_code, name, category, required_skill, base_price_cents, estimated_minutes, warranty_days]
    output: InstallTask
    side_effects: []
  - method: GET
    path: "/install-tasks/{id}"
    description: Fetch an install task.
    roles: [PlatformAdmin, Retailer]
    code: 200
    input: []
    output: InstallTask
    side_effects: []

  # ----- AddOn -----
  - method: POST
    path: "/add-ons"
    description: Create an add-on catalog entry.
    roles: [PlatformAdmin]
    code: 201
    input: [addon_code, name, category, price_cents]
    output: AddOn
    side_effects: []
  - method: GET
    path: "/add-ons/{id}"
    description: Fetch an add-on.
    roles: [PlatformAdmin, Retailer]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  # ----- WorkOrder -----
  - method: POST
    path: "/work-orders"
    description: Create a retailer-referred work order (DRAFT).
    roles: [Retailer]
    code: 201
    input: [retailer_id, customer_id, install_task_id, service_zone_id, product_sku, product_category, "scope_notes?"]
    output: WorkOrder
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/work-orders/{id}"
    description: Fetch a work order.
    roles: [PlatformAdmin, Retailer, Pro, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: List work orders with optional foreign-key filters.
    roles: [PlatformAdmin, Retailer, Pro]
    code: 200
    input: ["retailer_id?", "customer_id?", "install_task_id?", "service_zone_id?", "appointment_pro_id?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/schedule"
    description: Schedule the order, attach add-ons, compute the provisional quote.
    roles: [Retailer]
    code: 200
    input: [scheduled_start, scheduled_end, "selected_addon_ids?"]
    output: WorkOrder
    side_effects: ["DRAFT->SCHEDULED", "compute quoted_price_cents (work_order_quoted_price)"]
  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: Select an eligible pro and create an OFFERED assignment (supersede-guarded by OCC).
    roles: [PlatformAdmin]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects: ["SCHEDULED|REDO_REQUESTED->DISPATCHED", "dispatch_pro_selection", "create Assignment{OFFERED}", "increment Pro.reserved_slot_count", "increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/start"
    description: Pro starts the job.
    roles: [Pro]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["DISPATCHED->IN_PROGRESS"]
  - method: POST
    path: "/work-orders/{id}/parts"
    description: Add a part/hardware line to the order (before completion).
    roles: [Pro]
    code: 201
    input: [name, unit_cost_cents, quantity, markup_bps]
    output: Part
    side_effects: ["compute Part.line_billed_cents (parts_billed_total per-line rounding)"]
  - method: GET
    path: "/work-orders/{id}/parts"
    description: List the order's part lines.
    roles: [PlatformAdmin, Pro, Retailer]
    code: 200
    input: []
    output: Part[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/complete"
    description: Pro completes the job; prices it and fires the settlement cascade.
    roles: [Pro]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "IN_PROGRESS->COMPLETED"
      - "compute final_price_cents (work_order_final_price)"
      - "set completed_at, warranty_expires_at"
      - "create PayoutRecord{PENDING} (pro_payout provisional)"
      - "create RetailerSettlementEntry{CHARGE,PENDING} (retailer_settlement_charge)"
      - "recompute Retailer.settlement_balance_cents; Pro.pending_payout_cents"
  - method: POST
    path: "/work-orders/{id}/request-redo"
    description: Customer requests a warranty redo.
    roles: [Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["COMPLETED->REDO_REQUESTED", "increment redo_count", "PayoutRecord PENDING->HELD", "recompute Pro.pending_payout_cents"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: Cancel a work order (compensates any completion side effects).
    roles: [PlatformAdmin, Retailer]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["-> CANCELLED", "compensate assignment/payout/settlement per §1.2"]
  - method: POST
    path: "/work-orders/{id}/close"
    description: Close a completed order after the warranty window; releases the payout.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["COMPLETED->CLOSED", "PayoutRecord PENDING->RELEASED (pro_payout final)", "recompute Pro.pending_payout_cents"]
  - method: POST
    path: "/work-orders/{id}/ratings"
    description: Customer rates the pro for a completed order.
    roles: [Customer]
    code: 201
    input: [stars, "comment?"]
    output: Rating
    side_effects: ["create Rating", "recompute Pro.rating_sum/rating_count/rating_avg (pro_rating_aggregate)"]

  # ----- Rating -----
  - method: GET
    path: "/ratings/{id}"
    description: Fetch a rating.
    roles: [PlatformAdmin, Pro, Customer]
    code: 200
    input: []
    output: Rating
    side_effects: []
  - method: GET
    path: "/ratings"
    description: List ratings with optional foreign-key filters.
    roles: [PlatformAdmin, Pro, Customer]
    code: 200
    input: ["work_order_id?", "pro_id?", "customer_id?", "limit?", "offset?"]
    output: Rating[]
    side_effects: []

  # ----- Assignment -----
  - method: GET
    path: "/assignments/{id}"
    description: Fetch an assignment.
    roles: [PlatformAdmin, Pro]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/assignments"
    description: List assignments with optional foreign-key filters.
    roles: [PlatformAdmin, Pro]
    code: 200
    input: ["work_order_id?", "pro_id?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/assignments/{id}/accept"
    description: Pro accepts an offered assignment (vetting/skill/overlap/capacity checks).
    roles: [Pro]
    code: 200
    input: []
    output: Assignment
    side_effects: ["OFFERED->ACCEPTED", "set responded_at"]
  - method: POST
    path: "/assignments/{id}/decline"
    description: Pro declines an offered assignment; reverts the order to SCHEDULED.
    roles: [Pro]
    code: 200
    input: []
    output: Assignment
    side_effects: ["OFFERED->DECLINED", "decrement Pro.reserved_slot_count", "WorkOrder DISPATCHED->SCHEDULED", "clear appointment_pro_id"]
  - method: POST
    path: "/assignments/{id}/expire"
    description: System-triggered expiry of an offer past its TTL; reverts the order to SCHEDULED.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["OFFERED->EXPIRED", "decrement Pro.reserved_slot_count", "WorkOrder DISPATCHED->SCHEDULED", "clear appointment_pro_id"]

  # ----- PayoutRecord -----
  - method: GET
    path: "/payout-records/{id}"
    description: Fetch a payout record.
    roles: [PlatformAdmin, Pro]
    code: 200
    input: []
    output: PayoutRecord
    side_effects: []
  - method: GET
    path: "/payout-records"
    description: List payout records with optional foreign-key filters.
    roles: [PlatformAdmin, Pro]
    code: 200
    input: ["work_order_id?", "pro_id?", "retailer_id?", "limit?", "offset?"]
    output: PayoutRecord[]
    side_effects: []

  # ----- RetailerSettlementEntry -----
  - method: GET
    path: "/settlement-entries/{id}"
    description: Fetch a settlement entry.
    roles: [PlatformAdmin, Retailer]
    code: 200
    input: []
    output: RetailerSettlementEntry
    side_effects: []
  - method: GET
    path: "/settlement-entries"
    description: List settlement entries with optional foreign-key filters.
    roles: [PlatformAdmin, Retailer]
    code: 200
    input: ["retailer_id?", "work_order_id?", "payout_record_id?", "limit?", "offset?"]
    output: RetailerSettlementEntry[]
    side_effects: []

  # ----- Clock (test-driving) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default (never real wall-clock time), making every deadline/expiry/window rule deterministic."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601"]

# =====================================================================
# §1.6 ERROR CODE CATALOG
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the operation, or acting entity does not own the target resource."
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body: missing required field, invalid enum, stars out of 1..5, non-integer cents."
  - id: ERR_RETAILER_NOT_FOUND
    http: 404
    condition: "Referenced retailer id does not exist."
  - id: ERR_SERVICE_ZONE_NOT_FOUND
    http: 404
    condition: "Referenced service zone id does not exist."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Referenced customer id does not exist."
  - id: ERR_PRO_NOT_FOUND
    http: 404
    condition: "Referenced pro id does not exist."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "Referenced vetting application id does not exist."
  - id: ERR_INSTALL_TASK_NOT_FOUND
    http: 404
    condition: "Referenced install task id does not exist."
  - id: ERR_ADDON_NOT_FOUND
    http: 404
    condition: "A selected add-on id does not exist."
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced work order id does not exist."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Referenced assignment id does not exist."
  - id: ERR_PAYOUT_NOT_FOUND
    http: 404
    condition: "Referenced payout record id does not exist."
  - id: ERR_SETTLEMENT_ENTRY_NOT_FOUND
    http: 404
    condition: "Referenced settlement entry id does not exist."
  - id: ERR_RATING_NOT_FOUND
    http: 404
    condition: "Referenced rating id does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a valid from-state for the requested transition."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Target entity is already in a terminal state."
  - id: ERR_INVALID_APPOINTMENT_WINDOW
    http: 422
    condition: "scheduled_start >= scheduled_end on schedule."
  - id: ERR_RETAILER_SUSPENDED
    http: 409
    condition: "Scheduling a work order whose retailer is SUSPENDED."
  - id: ERR_ZONE_COVERAGE_INACTIVE
    http: 409
    condition: "Scheduling into a zone whose coverage_active == false."
  - id: ERR_ADDON_CATEGORY_MISMATCH
    http: 422
    condition: "A selected add-on's category differs from the install task category."
  - id: ERR_NO_ELIGIBLE_PRO
    http: 409
    condition: "Dispatch found an empty candidate pool (no approved, in-zone, skill-matched, conflict-free pro)."
  - id: ERR_PRO_NOT_APPROVED
    http: 409
    condition: "Accepting pro's vetting is not APPROVED (PENDING/SUSPENDED/REJECTED)."
  - id: ERR_VETTING_EXPIRED
    http: 409
    condition: "Accepting pro's approved vetting has expired (clock > expires_at)."
  - id: ERR_PRO_SCHEDULE_CONFLICT
    http: 409
    condition: "Accepted appointment window (expanded by travel buffer) overlaps another ACCEPTED assignment of the same pro."
  - id: ERR_ZONE_CAPACITY_EXCEEDED
    http: 409
    condition: "Zone concurrent-appointment capacity would be exceeded by this accept."
  - id: ERR_APPOINTMENT_NOT_STARTED
    http: 422
    condition: "Completion attempted before clock reaches scheduled_start."
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "Redo requested after clock passes warranty_expires_at."
  - id: ERR_DUPLICATE_RATING
    http: 409
    condition: "A rating already exists for this work order."
  - id: ERR_RATING_NOT_ALLOWED
    http: 409
    condition: "Rating attempted on a work order not in COMPLETED/CLOSED."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_work_order_version does not match current WorkOrder.version on dispatch."

# =====================================================================
# §1.7 RBAC MATRIX
# =====================================================================
roles:
  - name: PlatformAdmin
    description: Platform operations — catalog, vetting, dispatch, settlement, close, cancel, clock.
    identity: opaque
    exclusive_operations:
      - "POST /retailers, PATCH /retailers/{id}/status, POST /retailers/{id}/settlements"
      - "POST /service-zones, POST /install-tasks, POST /add-ons, POST /pros"
      - "POST /pros/{id}/applications, approve/reject/suspend/reinstate applications"
      - "POST /work-orders/{id}/dispatch, /close"
      - "POST /assignments/{id}/expire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /work-orders/{id}/cancel (with Retailer)"
      - "GET reads across resources"
  - name: Retailer
    description: Referring retailer — creates customers and work orders, schedules them, cancels its own.
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /work-orders (retailer_id must == X-User-ID)"
      - "POST /work-orders/{id}/schedule (must own the order)"
    shared_operations:
      - "POST /customers (with PlatformAdmin)"
      - "POST /work-orders/{id}/cancel (own order; with PlatformAdmin)"
      - "GET reads on own retailer, its work orders, settlement entries, catalog"
  - name: Pro
    description: Installer — vetting, accepts/declines dispatch offers, starts/completes jobs, adds parts.
    identity: "entity_backed:Pro"
    exclusive_operations:
      - "POST /assignments/{id}/accept, /decline (Assignment.pro_id must == X-User-ID)"
      - "POST /work-orders/{id}/start, /complete, /parts (WorkOrder.appointment_pro_id must == X-User-ID)"
    shared_operations:
      - "GET reads on own pro, applications, assignments, payout records, parts"
  - name: Customer
    description: End customer — requests warranty redo, rates the pro.
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /work-orders/{id}/request-redo (WorkOrder.customer_id must == X-User-ID)"
      - "POST /work-orders/{id}/ratings (must own the order)"
    shared_operations:
      - "GET reads on own work orders and ratings"
