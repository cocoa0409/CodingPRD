      - name: transfer_cost_ceiling_is_a_cross_entity_aggregate_rule
        claim_type: Aggregate Validation
        grounds:
          - validations[priority=25]
          - errors[ERR_TRANSFER_COST_CEILING_EXCEEDED]
          - entities.RegionHub.fields.transfer_cost_ceiling_cents
        distinguishing_aspect: "Each market's own transfer cost is individually legal, yet the second market's plan-transfer pushes the cumulative cost past the hub ceiling and is refused, so the rule is aggregate rather than per-row."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub with a 150-cent transfer ceiling, site KOT, region North, markets Riverton and Fallow, and routes into both markets."]
