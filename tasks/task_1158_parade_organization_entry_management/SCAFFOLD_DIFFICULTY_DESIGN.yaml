          - calculations.staging_window_conflict
          - entities.StagingArea.fields.reserved_slots
          - errors[ERR_STAGING_CAPACITY_FULL]
        distinguishing_aspect: |
          Numeric-threshold boundary on the slot-count metric via the confirm
