            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
