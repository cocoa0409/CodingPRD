  - rule_id: boundary_precision_check
    instances:
      - name: readiness_floor_inclusive_at_exactly_62_50_and_fails_at_62_45
        grounds:
          - calculations.return_readiness_score
          - validations[priority=12].ERR_RETURN_READINESS_NOT_MET
          - state_machines.ReturnTransitionPlan.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          RETURN_READINESS_MIN is 62.50 and the comparison is INCLUSIVE (>=), against a score
          rounded half-up to 2 decimals. The same plan row is activated twice: with quarters
          {62.00, 62.90} the trailing_two_quarter mean is 62.45 and activation is refused, and
          after a third quarter scoring 62.10 the mean is EXACTLY 62.50 and activation succeeds.
          0.05 apart at the pinned precision, so an implementation using > instead of >=, or
          truncating instead of rounding half up, flips exactly one of the two calls.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z advanced to 2026-09-01T08:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000; one ACTIVE DAY Placement (contract_encumbrance_cents 5760000)."
            - "Two ACCEPTED ProgressReports: Q1 goals_total 10 / goals_met 6 / goals_regressed 1 / benchmark 60 / attendance 90 -> 62.00, and Q2 with attendance 94.5 -> 62.90."
            - "One DRAFT ReturnTransitionPlan."
