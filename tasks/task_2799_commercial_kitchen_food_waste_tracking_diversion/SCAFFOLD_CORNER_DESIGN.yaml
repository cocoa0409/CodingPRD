          rationale: "The depth probe violates both rules in one request and asserts the priority 82 error, then fixes only the date to show the priority 120 error surfacing."

      - name: channel_eligibility_versus_donation_window_priority_pair
        claim_type: priority_ordering
        grounds: ["validations[priority=75]", "validations[priority=85]"]
        excluded_because:
          difficulty_instance: channel_ineligible_food_outranks_expired_donation_window
          rationale: "Both rules are violated by the same consignment line in the depth probe, which asserts the priority 75 error and then the priority 85 error in isolation."

      - name: site_mismatch_versus_allocation_ceiling_priority_pair
        claim_type: priority_ordering
        grounds: ["validations[priority=80]", "validations[priority=95]"]
        excluded_because:
          difficulty_instance: entry_site_mismatch_outranks_allocation_exceeds_unrouted
          rationale: "The depth probe constructs a line that is both cross-site and over the unrouted remainder, asserting the priority 80 error first and the priority 95 error once the site is corrected."

