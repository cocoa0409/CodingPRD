          trigger:
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_oc1}", expected_part_version: "${part_oc1_v}" }
              as: DistributorAdmin
              captures: { run_oc1: $.data.id }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_oc1}", expected_part_version: "${part_oc1_v}" }
              as: DistributorAdmin
              captures: { err_oc1: $.data.error_id }
          assert:
            - "First create succeeds (current version); second create with the same ${part_oc1_v} is stale: ${err_oc1} == ERR_STALE_PART_VERSION (http 412)"
            - "AllocationRun.${run_oc1}.status == PROVISIONAL (the rejected create did NOT supersede it)"
            - "GET /allocation-runs?part_id=${part_oc1} returns total_count == 1"

      - name: reschedule_stale_order_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-line-reschedule-stale-order]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "OCC on CustomerOrder.version: after a successful reschedule bumps the order version, replaying the pre-reschedule version is rejected 412 even though the second reschedule is otherwise legitimate."
        test_recipe:
          setup: ["ACKNOWLEDGED order line ship_date 2026-12-01 (reschedule deadline 2026-11-11; clock at default 2026-08-01 so the window is open)"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-OC2", name: "OCC Line 2", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_oc2: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_oc2}", part_number: "POC-2", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_oc2: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust OC2", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_oc2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_oc2}", lines: [ { part_id: "${part_oc2}", quantity: 5, ship_date: "2026-12-01" } ] }
              as: SalesRep
              captures: { o_oc2: $.data.id }
            - call: "POST /orders/${o_oc2}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_oc2}"
              as: DistributorAdmin
              captures: { l_oc2: "$.data[0].id" }
            - call: "GET /orders/${o_oc2}"
              as: DistributorAdmin
              captures: { o_oc2_v: $.data.version }
          trigger:
            - call: "POST /orders/${o_oc2}/lines/${l_oc2}/reschedule"
              payload: { new_ship_date: "2026-12-15", expected_order_version: "${o_oc2_v}" }
              as: SalesRep
            - call: "POST /orders/${o_oc2}/lines/${l_oc2}/reschedule"
              payload: { new_ship_date: "2026-12-20", expected_order_version: "${o_oc2_v}" }
              as: SalesRep
              captures: { err_oc2: $.data.error_id }
          assert:
            - "First reschedule succeeds: OrderLine.${l_oc2}.ship_date == 2026-12-15 and .cancel_by_date == 2026-11-15 (recomputed)"
            - "Second reschedule replays the stale version: ${err_oc2} == ERR_STALE_ORDER_VERSION (http 412)"
            - "OrderLine.${l_oc2}.ship_date == 2026-12-15 (stale write did not apply)"

      - name: allocation_run_supersede_and_publish
        claim_type: derived_field_reconciliation
        grounds: [state_machines.AllocationRun.PROVISIONAL_to_SUPERSEDED, "errors[ERR_ALLOCATION_RUN_NOT_PROVISIONAL]"]
        distinguishing_aspect: "Creating a new run for a part supersedes the prior PROVISIONAL run; the superseded run can no longer be published while the new run publishes cleanly."
        test_recipe:
          setup: ["Part with lot 100 and one ACKNOWLEDGED line qty 10"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-SP", name: "Supersede Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_sp: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_sp}", part_number: "PSP-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_sp: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_sp}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust SP", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_sp: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_sp}", lines: [ { part_id: "${part_sp}", quantity: 10, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_sp: $.data.id }
            - call: "POST /orders/${o_sp}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_sp}"
              as: DistributorAdmin
              captures: { l_sp: "$.data[0].id" }
            - call: "GET /parts/${part_sp}"
              as: DistributorAdmin
              captures: { part_sp_v1: $.data.version }
          trigger:
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_sp}", expected_part_version: "${part_sp_v1}" }
              as: DistributorAdmin
              captures: { run_sp1: $.data.id }
            - call: "GET /parts/${part_sp}"
              as: DistributorAdmin
              captures: { part_sp_v2: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_sp}", expected_part_version: "${part_sp_v2}" }
              as: DistributorAdmin
              captures: { run_sp2: $.data.id }
            - call: "POST /allocation-runs/${run_sp1}/publish"
              payload: {}
              as: DistributorAdmin
              captures: { err_sp: $.data.error_id }
            - call: "POST /allocation-runs/${run_sp2}/publish"
              payload: {}
              as: DistributorAdmin
          assert:
            - "AllocationRun.${run_sp1}.status == SUPERSEDED (side effect of the second create)"
            - "${err_sp} == ERR_ALLOCATION_RUN_NOT_PROVISIONAL (superseded run cannot publish)"
            - "AllocationRun.${run_sp2}.status == PUBLISHED and OrderLine.${l_sp}.status == ALLOCATED with .allocated_qty == 10"

      - name: cascading_and_dual_variant_layers_covered_by_difficulty
        claim_type: derived_field_reconciliation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: msl_quarantine_cascade_depth3
          rationale: "The cascading_side_effects and dual_variant_calculation layers are exercised end-to-end by §1.8 (msl_quarantine_cascade_depth3, claim_reverse_restore_cascade_depth2, claim_provisional_vs_audited_final, allocation_basis_backlog_vs_usage)."

  # ============================================================ consistency_model
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.CustomerOrder.SUBMITTED_to_ACKNOWLEDGED]
        distinguishing_aspect: "Immediate consistency: the acknowledge response itself carries status ACKNOWLEDGED and the bumped version, and a subsequent GET returns identical values (no lag, no async reconciliation)."
        test_recipe:
          setup: ["One SUBMITTED order"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-IC", name: "Immediate Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_ic: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_ic}", part_number: "PIC-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_ic: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust IC", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_ic: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_ic}", lines: [ { part_id: "${part_ic}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_ic: $.data.id }
          trigger:
            - call: "POST /orders/${o_ic}/acknowledge"
              payload: {}
              as: SalesRep
              captures: { o_ic_status: $.data.status, o_ic_v: $.data.version, o_ic_exp: $.data.open_exposure_cents }
            - call: "GET /orders/${o_ic}"
              as: DistributorAdmin
          assert:
            - "Acknowledge response itself: ${o_ic_status} == ACKNOWLEDGED and ${o_ic_v} == 2 (version bumped by the mutation)"
            - "${o_ic_exp} == 7500 (5 * 1500 exposure recomputed in the same request)"
            - "Subsequent GET /orders/${o_ic} returns status ACKNOWLEDGED, version 2, open_exposure_cents 7500 (identical — no eventual lag)"
