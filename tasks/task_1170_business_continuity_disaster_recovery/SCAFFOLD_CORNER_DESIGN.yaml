        distinguishing_aspect: "BIA create is exclusive to BIAAnalyst; a PlanApprover carrying a valid Contact id is rejected 403 before any existence checks run."
        test_recipe:
          setup: ["Contact C1 exists (used as the caller's identity)"]
          setup_api_calls:
