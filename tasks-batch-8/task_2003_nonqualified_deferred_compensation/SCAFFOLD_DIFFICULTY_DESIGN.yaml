        distinguishing_aspect: |
          Cyclic machine on a different entity: Plan ACTIVE -> SUSPENDED -> ACTIVE,
          and the mid-cycle state is observable through the child-write gate —
          participant creation fails with ERR_PLAN_NOT_ACTIVE exactly while
          SUSPENDED and succeeds after resume.
        test_recipe:
          setup:
            - "Plan created and activated (ACTIVE)"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan SR", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
