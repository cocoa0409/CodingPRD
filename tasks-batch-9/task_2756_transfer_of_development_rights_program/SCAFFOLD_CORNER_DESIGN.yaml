            - call: "POST /tdr/severance-applications/${app_c}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_c}/review-decision"
              payload: { decision: "APPROVE" }
