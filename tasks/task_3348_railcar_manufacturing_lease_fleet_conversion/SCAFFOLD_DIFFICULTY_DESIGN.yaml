          scheduled_end_date: '2026-09-03'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_life_id}/complete
        payload:
          completed_qty: 1
          completion_date: '2026-09-03'
        as: ProductionPlanner
      - call: GET /api/v1/lease-fleet-cars?production_order_id=${po_life_id}
        as: PlatformAdmin
        captures:
          car_life_id: $.data[0].id
      - call: POST /api/v1/lessees
        payload:
          legal_name: Regulatory Life Rail Co
          credit_tier: A
          utilization_threshold_pct: 60
          credit_ceiling_cents: 50000000
        as: LeaseAdministrator
        captures:
          lessee_life_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_life_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 2000
          liability_bearer: LESSOR
          term_start_date: '2026-09-01'
          term_end_date: '2037-09-01'
