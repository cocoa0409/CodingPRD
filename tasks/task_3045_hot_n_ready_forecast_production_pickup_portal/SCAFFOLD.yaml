    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DoughBatch[]"
    side_effects: []

  - method: POST
    path: "/dough-batches/{batchId}/advance"
    description: "Advance dough batch state (MIXING->PROOFING->PROOFED)"
    roles: [CrewMember]
    code: 200
    input: []
    output: DoughBatch
    side_effects: ["state advance with proof-window checks"]

  - method: POST
    path: "/store-days/{dayId}/cheese-batches"
    description: "Prep a cheese batch"
    roles: [CrewMember]
    code: 201
    input: [size_units]
    output: CheeseBatch
    side_effects: ["status PREPPING; prepped_at = clock"]

  - method: GET
    path: "/cheese-batches/{batchId}"
    description: "Get a cheese batch"
    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: []
    output: CheeseBatch
    side_effects: []

  - method: GET
    path: "/store-days/{dayId}/cheese-batches"
    description: "List cheese batches of a store day"
    roles: [StoreManager, ShiftLead, CrewMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CheeseBatch[]"
    side_effects: []

  - method: POST
    path: "/cheese-batches/{batchId}/advance"
    description: "Advance cheese batch state (PREPPING->RESTING->READY)"
    roles: [CrewMember]
    code: 200
    input: []
    output: CheeseBatch
    side_effects: ["state advance with rest-window check"]

  # --- Product ---
  - method: POST
    path: "/products"
    description: "Create a product"
    roles: [StoreManager]
    code: 201
    input: [sku, name, list_price_cents, "promo_price_cents?", "customization_allowed?"]
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "List products"
    roles: [StoreManager, ShiftLead, CrewMember, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/products/{productId}"
    description: "Get a product"
    roles: [StoreManager, ShiftLead, CrewMember, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: PUT
    path: "/products/{productId}"
    description: "Update a product (name, prices, customization flag); promo price locked while referenced by a non-CLOSED run of an OPEN store day"
    roles: [StoreManager]
    code: 200
    input: ["name?", "list_price_cents?", "promo_price_cents?", "customization_allowed?"]
    output: Product
    side_effects: ["promo discipline validations"]

  # --- ProductionRun ---
  - method: POST
    path: "/dayparts/{daypartId}/production-runs"
    description: "Plan a production run for a daypart"
    roles: [ShiftLead]
    code: 201
    input: [product_id, dough_batch_id, cheese_batch_id, quantity]
