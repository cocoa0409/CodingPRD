            Contention for the RING resource, keyed on (show_id, ring_number) with a zero turnaround buffer and
            half-open intervals, so touching endpoints are legal. Block B1 occupies [09:00, 09:08); a block
            starting at exactly 09:08 must be accepted, and one starting four minutes into the next block's span
            must be rejected. Each block belongs to a different class and a different judge, so neither the
            create-with-supersede rule nor the judge rest buffer can account for either outcome.

