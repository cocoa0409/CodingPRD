            - "${err_id} == ERR_PROJECT_POSTURE_FROZEN"
            - "${err_id} != ERR_BIN_CAPACITY_EXCEEDED"
            - "HardwareUnit.${u2}.handling_status == REMOVED"
            - "HardwareUnit.${u2}.storage_bin_id == null"
            - "StorageBin.${bin_a}.occupied_slots == 1"
            - "ReroofProject.${proj_id}.posture == FROZEN"

