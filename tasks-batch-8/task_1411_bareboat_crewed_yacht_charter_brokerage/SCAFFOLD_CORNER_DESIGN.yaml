# =============================================================================
# §1.9 Scaffold Corner Design — yacht-charter-brokerage
# Breadth coverage of every testable claim §1.1–§1.7 declares that §1.8 does
# not already probe. Sections/claim_types per claim-extraction-guide.
# Logical clock default is 2026-08-01T00:00:00Z unless a recipe sets it.
# Shared fixture literals: Yacht A = PRO_RATA, weekly 700000, deposit 500000,
# capacity 8, min_charter_days 3, required_resume_class COASTAL.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: request_creation_defaults
        claim_type: creation
        grounds: [entities.CharterRequest]
        distinguishing_aspect: "A new CharterRequest starts DRAFT with round_count 0, version 1, and null offer fields (quoted_charter_fee_cents, apa_pct, gratuity_pledged_cents, retail_pct_bps, offer_expires_at, rebooked_from_request_id)."
        test_recipe:
          setup: ["operator + central agent + client exist; Yacht A LISTED"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id, rq_v: $.data.version } }
          assert:
            - "CharterRequest.${rq_id}: status == DRAFT, round_count == 0, version == 1"
            - "quoted_charter_fee_cents, apa_pct, gratuity_pledged_cents, retail_pct_bps, offer_expires_at, rebooked_from_request_id are all null"
            - "id is a server-minted UUID; created_at/updated_at present in ISO8601 UTC"

      - name: yacht_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Yacht, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns the fixed error envelope with ERR_NOT_FOUND and http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /yachts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and http status == 404"
            - "error envelope has meta.api_request_id and data.message"

      - name: yacht_enum_type_constraint_rejected
        claim_type: type_constraints
        grounds: [entities.Yacht.fields.pricing_mode, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pricing_mode=DAILY (not a declared enum member) is rejected with ERR_INVALID_REQUEST before any state change."
        test_recipe:
          setup: ["operator + central agent exist"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
          trigger:
            - { call: "POST /yachts", payload: { name: "Yacht X", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: DAILY, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"
            - "GET /yachts?operator_id=${op_id} returns total_count == 0"

      - name: escrow_movement_immutability
        claim_type: immutability
        grounds: [entities.EscrowMovement]
        distinguishing_aspect: "EscrowMovement is common_fields: false — entries carry id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["agreement SIGNED with SIGNING tranche funded (fee 2000000, deposit 500000 -> 1500000)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-30", end_date: "2026-11-19", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_no: "POL-1", coverage_amount_cents: 2000000, valid_from: "2026-10-01", valid_until: "2026-12-01" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { ic_id: $.data.id } }
            - { call: "POST /insurance-certificates/${ic_id}/verify", payload: { outcome: VERIFIED }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: CentralAgent, as_user_id: "${ca_id}" }
          trigger:
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: SIGNING, amount_cents: 1500000 }, as: Client, as_user_id: "${cl_id}", captures: { esc_id: $.data.id } }
            - { call: "GET /escrow-accounts/${esc_id}/movements", payload: {}, as: Client, as_user_id: "${cl_id}" }
          assert:
            - "two CLIENT_FUND movements exist: (CHARTER_FEE, 1000000) and (DEPOSIT, 500000)"
            - "each movement object has id, created_at, escrow_account_id, movement_type, bucket, amount_cents, memo — and no version or updated_at key"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: yacht_list_delist_relist_cycle_and_version
        claim_type: valid_transition
        grounds: [state_machines.Yacht.DELISTED_to_LISTED, entities.Yacht.fields.version]
        distinguishing_aspect: "Yacht supports the DELISTED -> LISTED re-list cycle, and every mutation bumps version: create 1, list 2, delist 3, re-list 4."
        test_recipe:
          setup: ["operator + central agent exist; yacht created (DRAFT, version 1)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
          trigger:
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /yachts/${ya_id}/delist", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { y_end: $.data.status, y_v: $.data.version } }
          assert:
            - "status sequence observed: DRAFT -> LISTED -> DELISTED -> LISTED"
            - "y_v == 4 (one increment per mutation)"

      - name: delist_blocked_by_live_request
        claim_type: precondition_enforcement
        grounds: [state_machines.Yacht.LISTED_to_DELISTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Delisting a yacht with a live (SUBMITTED) charter request is rejected with ERR_INVALID_STATE and the yacht stays LISTED."
        test_recipe:
          setup: ["Yacht A LISTED; QUALIFIED client; request SUBMITTED"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
          trigger:
            - { call: "POST /yachts/${ya_id}/delist", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "GET /yachts/${ya_id} -> status == LISTED"

      - name: manual_charter_block_creation_rejected
        claim_type: invalid_transition
        grounds: [entities.AvailabilityBlock.fields.block_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "block_type=CHARTER is system-only: manual creation with CHARTER fails ERR_INVALID_REQUEST; only MAINTENANCE and OPERATOR_HOLD are accepted."
        test_recipe:
          setup: ["Yacht A created (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id, ya_v: $.data.version } }
          trigger:
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: CHARTER, start_date: "2026-09-10", end_date: "2026-09-20", expected_yacht_version: "${ya_v}" }, as: Operator, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "GET /yachts/${ya_id}/availability-blocks -> total_count == 0"

      - name: charter_block_release_rejected_manual_block_ok
        claim_type: invalid_transition
        grounds: [state_machines.AvailabilityBlock.ACTIVE_to_RELEASED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Manual release of a system-created CHARTER block is rejected ERR_INVALID_STATE, while a MAINTENANCE block releases fine and bumps the yacht version."
        test_recipe:
          setup: ["Yacht A LISTED with one MAINTENANCE block [2026-09-01,2026-09-05); client QUALIFIED; request accepted -> CHARTER block exists"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id, ya_v1: $.data.version } }
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: MAINTENANCE, start_date: "2026-09-01", end_date: "2026-09-05", expected_yacht_version: "${ya_v1}" }, as: Operator, as_user_id: "${op_id}", captures: { mblk_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
            - { call: "GET /charter-agreements/${ag_id}/availability-blocks", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { cblk_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /availability-blocks/${cblk_id}/release", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
            - { call: "POST /availability-blocks/${mblk_id}/release", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { mblk_status: $.data.status } }
          assert:
            - "err == ERR_INVALID_STATE (CHARTER block is cascade-only)"
            - "mblk_status == RELEASED"
            - "Yacht.${ya_id}.version == 5 (create 1, block 2, list 3, accept block 4, manual release 5)"

      - name: resume_rejected_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.Client.REJECTED_to_PENDING_REVIEW]
        distinguishing_aspect: "Client qualification is cyclic: UNVERIFIED -> PENDING_REVIEW -> REJECTED -> PENDING_REVIEW -> QUALIFIED via resubmission with an upgraded resume class."
        test_recipe:
          setup: ["client created (UNVERIFIED)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
          trigger:
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: COASTAL, skippered_hours: 40 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: REJECTED }, as: PlatformAdmin }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin, captures: { cl_end: $.data.qualification_status } }
          assert:
            - "observed statuses: PENDING_REVIEW, REJECTED, PENDING_REVIEW, QUALIFIED"
            - "cl_end == QUALIFIED and resume_class == OFFSHORE, skippered_hours == 300 (latest submission wins)"

      - name: terminal_request_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CharterRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECLINED is terminal: counter and a second decline from DECLINED both fail ERR_INVALID_STATE; offer from DRAFT (skipping submit) also fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Yacht A LISTED; QUALIFIED client; request R1 OFFERED then DECLINED; request R2 left DRAFT (different dates to avoid the duplicate rule)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq1_id: $.data.id } }
            - { call: "POST /charter-requests/${rq1_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq1_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq1_v: $.data.version } }
            - { call: "POST /charter-requests/${rq1_id}/decline", payload: {}, as: Client, as_user_id: "${cl_id}", captures: { rq1_dec_v: $.data.version } }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-12-01", end_date: "2026-12-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq2_id: $.data.id } }
          trigger:
            - { call: "POST /charter-requests/${rq1_id}/counter", payload: { expected_charter_request_version: "${rq1_dec_v}", counter_charter_fee_cents: 900000 }, as: Client, as_user_id: "${cl_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /charter-requests/${rq1_id}/decline", payload: {}, as: Client, as_user_id: "${cl_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /charter-requests/${rq2_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_INVALID_STATE (DECLINED terminal)"
            - "err2 == ERR_INVALID_STATE (no DECLINED->DECLINED self-loop)"
            - "err3 == ERR_INVALID_STATE (offer requires SUBMITTED or COUNTERED, not DRAFT)"

      - name: negotiation_round_cap_at_four
        claim_type: precondition_enforcement
        grounds: [entities.CharterRequest.fields.round_count, "errors[ERR_NEGOTIATION_ROUND_LIMIT]"]
        distinguishing_aspect: "Exactly 4 counter-offer cycles are allowed; the 5th counter fails ERR_NEGOTIATION_ROUND_LIMIT while the request remains OFFERED."
        test_recipe:
          setup: ["Yacht A LISTED; QUALIFIED client; request SUBMITTED (version 2)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
