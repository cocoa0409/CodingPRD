  # =========================================================================
  # §1.9.6  From Table 6 (Errors) - every catalog entry must be reachable
  # =========================================================================
  - section: errors
    instances:

      - name: not_found_is_reported_per_route_family
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SEASON_NOT_FOUND
          - errors.ERR_ENTRY_NOT_FOUND
          - errors.ERR_ROUND_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
        distinguishing_aspect: "Each read route reports its own 404 code rather than a generic one, and a real ConductCase id addressed on the rules-case route is ERR_CASE_NOT_FOUND — the caseId is resolved against the entity the route names, not against any case table."
        test_recipe:
          setup:
            - "One season, one VERIFIED U17 member m1 and one tournament t1."
            - "One ConductCase cc1 exists, filed by TourAdmin against a parent."
            - "The literal 00000000-0000-4000-8000-000000000000 is used as an id that resolves to nothing."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional U17", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /conduct-cases", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}", subject_type: "PARENT", subject_name: "Peter Stone", incident_code: "COACHING_VIOLATION", narrative: "advice shouted from the gallery on the 4th tee" }, as: TourAdmin, as_user_id: "admin-1", captures: { cc_id: $.data.id } }
          trigger:
            - { call: "GET /seasons/00000000-0000-4000-8000-000000000000", payload: {}, as: TourAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /entries/00000000-0000-4000-8000-000000000000", payload: {}, as: TourAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /rounds/00000000-0000-4000-8000-000000000000", payload: {}, as: TourAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /rules-cases/00000000-0000-4000-8000-000000000000", payload: {}, as: TourAdmin, captures: { e4: $.data.error_id } }
            - { call: "GET /rules-cases/${cc_id}", payload: {}, as: TourAdmin, captures: { e5: $.data.error_id } }
            - { call: "GET /conduct-cases/${cc_id}", payload: {}, as: TourAdmin, captures: { ccst: $.data.status } }
          assert:
            - "trigger 1: http_status == 404"
            - "${e1} == ERR_SEASON_NOT_FOUND"
            - "trigger 2: http_status == 404"
            - "${e2} == ERR_ENTRY_NOT_FOUND"
            - "trigger 3: http_status == 404"
            - "${e3} == ERR_ROUND_NOT_FOUND"
            - "trigger 4: http_status == 404"
            - "${e4} == ERR_CASE_NOT_FOUND"
            - "trigger 5: http_status == 404"
            - "${e5} == ERR_CASE_NOT_FOUND"
            - "trigger 6: http_status == 200"
            - "${ccst} == UNDER_REVIEW"

      - name: a_member_reading_another_members_rows_is_forbidden
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FORBIDDEN_RESOURCE
          - roles.Member
          - endpoints.GET_members_memberId
        distinguishing_aspect: "m2's role IS listed on the route, so the refusal is ERR_FORBIDDEN_RESOURCE (403) and not ERR_UNAUTHORIZED — the same two reads on m2's own rows return 200, proving the gate is row ownership rather than role."
        test_recipe:
          setup:
            - "One season with two VERIFIED U17 members m1 and m2."
            - "Both callers use the Member role with X-User-ID set to their own member id."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ben Cole", birth_date: "2010-06-15", state_code: "SC", guardian_email: "ben.guardian@example.com", handicap_index: 5.1, handicap_effective_date: "2026-07-20", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m2_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /members/${m2_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
          trigger:
            - { call: "GET /members/${m1_id}", payload: {}, as: Member, as_user_id: "${m2_id}", captures: { e1: $.data.error_id } }
            - { call: "GET /members/${m1_id}/ranking", payload: {}, as: Member, as_user_id: "${m2_id}", captures: { e2: $.data.error_id } }
            - { call: "GET /members/${m2_id}", payload: {}, as: Member, as_user_id: "${m2_id}", captures: { own: $.data.id } }
            - { call: "GET /members/${m2_id}/ranking", payload: {}, as: Member, as_user_id: "${m2_id}", captures: { ownr: $.data.member_id } }
          assert:
            - "trigger 1: http_status == 403"
            - "${e1} == ERR_FORBIDDEN_RESOURCE"
            - "${e1} != ERR_UNAUTHORIZED"
            - "trigger 2: http_status == 403"
            - "${e2} == ERR_FORBIDDEN_RESOURCE"
            - "trigger 3: http_status == 200"
            - "${own} == ${m2_id}"
            - "trigger 4: http_status == 200"
            - "${ownr} == ${m2_id}"

      - name: deciding_or_revoking_a_settled_grant_is_refused
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_GRANT_STATE
          - state_machines.AidApplication
          - state_machines.CoachAccessGrant
        distinguishing_aspect: "One shared code covers both grant-like entities: re-deciding an APPROVED AidApplication, re-deciding a GRANTED CoachAccessGrant and revoking a DENIED CoachAccessGrant all return ERR_INVALID_GRANT_STATE, and none of the three rows changes status."
        test_recipe:
          setup:
            - "One season and one VERIFIED U17 member m1 with publication_opt_in true."
            - "m1's assistance application a1 is APPROVED."
            - "coach-recruit-1's grant g1 is GRANTED by m1; coach-recruit-2's grant g2 is DENIED by m1."
            - "Member.version is re-read before each optimistic write because both grant requests bump it."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v1: $.data.version } }
            - { call: "POST /aid-applications", payload: { member_id: "${m1_id}", season_id: "${season_id}", household_income_cents: 1000000, dependents: 1, expected_member_version: "${v1}" }, as: Member, as_user_id: "${m1_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /aid-applications/${a1_id}/decide", payload: { decision: "APPROVED" }, as: TourAdmin, captures: { ast: $.data.status } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v2: $.data.version } }
            - { call: "POST /coach-access-grants", payload: { member_id: "${m1_id}", coach_school: "State University", scope: "RESULTS_ONLY", expected_member_version: "${v2}" }, as: Coach, as_user_id: "coach-recruit-1", captures: { g1_id: $.data.id } }
            - { call: "POST /coach-access-grants/${g1_id}/decide", payload: { decision: "GRANTED" }, as: Member, as_user_id: "${m1_id}", captures: { g1st: $.data.status } }
            - { call: "GET /members/${m1_id}", payload: {}, as: TourAdmin, captures: { v3: $.data.version } }
            - { call: "POST /coach-access-grants", payload: { member_id: "${m1_id}", coach_school: "Coastal College", scope: "RESULTS_ONLY", expected_member_version: "${v3}" }, as: Coach, as_user_id: "coach-recruit-2", captures: { g2_id: $.data.id } }
            - { call: "POST /coach-access-grants/${g2_id}/decide", payload: { decision: "DENIED" }, as: Member, as_user_id: "${m1_id}", captures: { g2st: $.data.status } }
          trigger:
            - { call: "POST /aid-applications/${a1_id}/decide", payload: { decision: "DENIED" }, as: TourAdmin, captures: { e1: $.data.error_id } }
            - { call: "POST /coach-access-grants/${g1_id}/decide", payload: { decision: "DENIED" }, as: TourAdmin, captures: { e2: $.data.error_id } }
            - { call: "POST /coach-access-grants/${g2_id}/revoke", payload: { reason: "no longer recruiting" }, as: TourAdmin, captures: { e3: $.data.error_id } }
          assert:
            - "${ast} == APPROVED"
            - "${g1st} == GRANTED"
            - "${g2st} == DENIED"
            - "trigger 1: http_status == 409"
            - "${e1} == ERR_INVALID_GRANT_STATE"
            - "trigger 2: http_status == 409"
            - "${e2} == ERR_INVALID_GRANT_STATE"
            - "trigger 3: http_status == 409"
            - "${e3} == ERR_INVALID_GRANT_STATE"
            - "AidApplication.${a1_id}.status == APPROVED"
            - "CoachAccessGrant.${g1_id}.status == GRANTED"
            - "CoachAccessGrant.${g2_id}.status == DENIED"

