  - rule_id: resource_temporal_overlap
    instances:
      # ---- Half-open interval overlap on Technician via create
      - name: overlap_technician_halfopen_on_create
        grounds:
          - calculations.dispatch_overlap_check
          - validations[priority=11]
          - errors[ERR_TECH_DOUBLE_BOOKED]
          - state_machines.ServiceJob.QUOTED_to_SCHEDULED
        distinguishing_aspect: |
          On the Technician resource, dispatch_overlap_check uses half-open [start,end) semantics with
          NO buffer: a new window strictly overlapping an existing ASSIGNED/EN_ROUTE/ON_SITE window on
          the SAME technician is rejected at create time (ERR_TECH_DOUBLE_BOOKED), while CANCELLED/CLEARED
          dispatches are ignored.
