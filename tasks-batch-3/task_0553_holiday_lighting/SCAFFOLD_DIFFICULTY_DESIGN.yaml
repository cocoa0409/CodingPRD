      - name: storage_bin_buffered_overlap_rejected
        grounds:
          - validations[priority=12]
          - entities.StorageBin.fields.buffer_days
          - entities.StorageRecord.fields.stored_from
          - errors[ERR_BIN_OCCUPIED]
        distinguishing_aspect: |
          Closed [from,until] interval inflated by buffer_days=7 on the StorageBin resource (different resource
          and different interval arithmetic than RouteDay's half-open no-buffer rule): a new occupancy starting
          2026-03-05 collides because it falls within 7 days of the prior occupancy's stored_until 2026-03-01,
          even though the raw date ranges do not overlap; rejected with ERR_BIN_OCCUPIED.
        test_recipe:
          setup:
            - "A bin with buffer_days 7 holds a STORED occupancy [2026-01-01, 2026-03-01]."
          setup_api_calls:
