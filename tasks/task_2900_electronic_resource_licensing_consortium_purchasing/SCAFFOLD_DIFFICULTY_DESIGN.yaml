  - rule_id: cross_entity_state_dependency
    instances:
      - name: signing_rejected_while_the_referenced_trial_is_still_draft
        grounds:
          - validations.priority_13_ERR_TRIAL_NOT_ENDORSED
          - errors.ERR_TRIAL_NOT_ENDORSED
          - state_machines.Negotiation.AGREED_to_SIGNED
          - state_machines.Trial.DRAFT_to_ACTIVE
          - entities.Trial.fields.status
        distinguishing_aspect: |
          Entity pair Negotiation x Trial: the AGREED -> SIGNED transition is legal on the Negotiation's
          own axis and every other signing gate is satisfied (accessibility term granted, VPAT on file,
          signer different from the submitter, one PLEDGED commitment present), yet it must fail purely
          because the referenced Trial is still DRAFT instead of ENDORSED - the sibling entity's state,
          not the negotiation's, decides the outcome.
        test_recipe:
          setup:
            - "Vendor Atlas Scholarly with vpat_on_file true; Product Atlas Humanities Collection; Member Alpha College."
            - "A trial is created on the product for Alpha and deliberately left in DRAFT - it is never opened, never given feedback and never evaluated."
            - "A negotiation referencing that DRAFT trial is submitted by neg-1 and accepted by the vendor at 9000000 cents with granted_accessibility_conformance WCAG_2_1_AA, so the negotiation is AGREED."
            - "Alpha holds a PLEDGED commitment on the product, so the pledge precondition of signing is satisfied and only the trial's state can block the transition."
