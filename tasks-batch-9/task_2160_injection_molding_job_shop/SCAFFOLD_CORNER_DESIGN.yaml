          setup: ["Quote ACCEPTED so mold M-1 is SAMPLING; PPAP package SUBMITTED with submitted_by_user_id qe-alice."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
