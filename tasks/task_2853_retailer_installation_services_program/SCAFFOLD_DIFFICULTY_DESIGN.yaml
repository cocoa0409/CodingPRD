  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Different entities: Project (three genuinely parallel status dimensions plus
  # an inspection re-scheduling cycle) and ChangeOrder (a revision cycle that can
  # repeat without limit).
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: project_permit_dimension_cycles_while_fulfillment_and_financial_hold_still
        grounds:
          - state_machines.Project.permit_status.ISSUED_to_INSPECTION_SCHEDULED
          - state_machines.Project.permit_status.INSPECTION_SCHEDULED_to_INSPECTION_FAILED
          - state_machines.Project.permit_status.INSPECTION_FAILED_to_INSPECTION_SCHEDULED
          - state_machines.Project.permit_status.INSPECTION_SCHEDULED_to_INSPECTION_PASSED
          - state_machines.Project.permit_status.INSPECTION_PASSED_to_CLOSED
          - entities.Project.fields.inspection_attempt_count
          - entities.Project.fields.inspection_slot_start
          - validations[priority=26]
        distinguishing_aspect: |
          Non-linearity on the PROJECT entity takes two shapes at once: three
          parallel status dimensions (fulfillment_status, financial_status,
          permit_status) advance independently — permit_status walks
          PENDING_APPLICATION -> APPLIED -> ISSUED -> INSPECTION_SCHEDULED ->
          INSPECTION_FAILED -> INSPECTION_SCHEDULED -> INSPECTION_PASSED ->
          CLOSED while fulfillment_status never leaves MEASURED and
          financial_status never leaves DEPOSIT_HELD — and the
          INSPECTION_FAILED -> INSPECTION_SCHEDULED edge is a true cycle that
          bumps inspection_attempt_count to 2.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z."
            - "ServiceCategory FLOOR-QUICK: measurement_required false, permit_policy BY_JURISDICTION, base_labor_rate_cents_per_unit 425, minimum_billable_units 150.00, deposit_pct 0.30."
            - "Jurisdiction METRO-01: permit_required_trades contains FLOORING, permit_unit_threshold 250.00, permit_responsible_party RETAILER, inspection_required true, inspection_lead_days 3, max_concurrent_inspections 2."
            - "One Project with estimated_units 420.00 that therefore opens at fulfillment_status MEASURED (no measurement required) and permit_status PENDING_APPLICATION (420.00 >= 250.00 and FLOORING is a permit trade), permit_responsibility RETAILER."
            - "Deposit of 59002 taken, so financial_status DEPOSIT_HELD and deposit_held_cents 59002."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-QUICK", name: "Quick-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 59002 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /projects/${proj_id}/permit/apply"
              payload: { permit_application_reference: "PA-2026-0001" }
              as: ProjectCoordinator
            - call: "POST /projects/${proj_id}/permit/issue"
              payload: { permit_fee_cents: 18500, permit_issued_on: "2026-08-04T00:00:00.000Z" }
              as: ProjectCoordinator
            - call: "POST /projects/${proj_id}/inspection-slot"
              payload: { inspection_slot_start: "2026-08-06T09:00:00.000Z", inspection_slot_end: "2026-08-06T11:00:00.000Z" }
              as: ProjectCoordinator
            - call: "POST /projects/${proj_id}/inspection-result"
              payload: { result: "FAILED", inspector_note: "Missing transition strip at the hall threshold" }
              as: ProjectCoordinator
            - call: "POST /projects/${proj_id}/inspection-slot"
              payload: { inspection_slot_start: "2026-08-08T09:00:00.000Z", inspection_slot_end: "2026-08-08T11:00:00.000Z" }
              as: ProjectCoordinator
            - call: "POST /projects/${proj_id}/inspection-result"
              payload: { result: "PASSED" }
              as: ProjectCoordinator
              captures: { final_permit_status: $.data.permit_status }
          assert:
            - "Project.${proj_id}.permit_status == CLOSED"
            - "Project.${proj_id}.inspection_result == PASSED"
            - "Project.${proj_id}.inspection_attempt_count == 2"
            - "Project.${proj_id}.inspection_slot_start == null"
            - "Project.${proj_id}.inspection_slot_end == null"
            - "Project.${proj_id}.permit_fee_cents_billed == 18500"
            - "Project.${proj_id}.fulfillment_status == MEASURED (unchanged across all six permit calls)"
            - "Project.${proj_id}.financial_status == DEPOSIT_HELD (unchanged across all six permit calls)"
            - "Project.${proj_id}.deposit_held_cents == 59002"
            - "Project.${proj_id}.final_labor_cents == null AND Project.${proj_id}.total_due_cents == 0 AND Project.${proj_id}.balance_due_cents == 0"

      - name: change_order_revision_cycle_repriced_twice_before_acceptance
        grounds:
          - state_machines.ChangeOrder.PENDING_CUSTOMER_to_REVISION_REQUESTED
          - state_machines.ChangeOrder.REVISION_REQUESTED_to_PENDING_CUSTOMER
          - state_machines.ChangeOrder.PENDING_CUSTOMER_to_ACCEPTED
          - state_machines.Project.fulfillment_status.MEASURED_to_CHANGE_PENDING
          - state_machines.Project.fulfillment_status.CHANGE_PENDING_to_MEASURED
          - calculations.change_order_upcharge
          - entities.ChangeOrder.fields.revision_count
        distinguishing_aspect: |
          Non-linearity on the CHANGE ORDER entity is a CYCLE, not parallel
          dimensions: PENDING_CUSTOMER -> REVISION_REQUESTED -> PENDING_CUSTOMER
          is traversed twice on one row, revision_count reaches 2, and each
          re-submission re-runs change_order_upcharge on the replacement lines so
          upcharge_cents walks 10546 -> 7438 -> 17919 while Project.fulfillment_status
          oscillates MEASURED -> CHANGE_PENDING -> MEASURED.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z."
            - "ServiceCategory FLOOR-DIRECT: measurement_required false, permit_policy NEVER, base_labor_rate_cents_per_unit 425, minimum_billable_units 150.00, deposit_pct 0.30."
            - "Jurisdiction METRO-01 with labor_complexity_multiplier 1.15."
            - "One Project with estimated_units 420.00, quoted_labor_cents 196673, fulfillment_status MEASURED, permit_status NOT_REQUIRED."
            - "One ChangeOrder origin CUSTOMER_REQUEST with three lines priced at 10546, submitted so it sits in PENDING_CUSTOMER with revision_count 0 and the project in CHANGE_PENDING."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, pv1: $.data.version }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CUSTOMER_REQUEST", lines: [{ unit_kind: "PRIMARY_UNITS", units_delta: 6.00 }, { unit_kind: "PRIMARY_UNITS", units_delta: 6.00 }, { unit_kind: "TRIM_LINEAR_FT", units_delta: 12.00 }], expected_project_version: "${pv1}" }
              as: ProjectCoordinator
              captures: { co_id: $.data.id }
            - call: "POST /change-orders/${co_id}/submit"
              payload: {}
              as: ProjectCoordinator
          trigger:
            - call: "POST /change-orders/${co_id}/decide"
              payload: { decision: "REQUEST_REVISION", revision_note: "Reduce the trim run" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /change-orders/${co_id}/submit"
              payload: { lines: [{ unit_kind: "PRIMARY_UNITS", units_delta: 6.00 }, { unit_kind: "TRIM_LINEAR_FT", units_delta: 12.00 }] }
              as: ProjectCoordinator
              captures: { upcharge_rev1: $.data.upcharge_cents }
            - call: "POST /change-orders/${co_id}/decide"
              payload: { decision: "REQUEST_REVISION", revision_note: "Swap the trim for two fixtures" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /change-orders/${co_id}/submit"
              payload: { lines: [{ unit_kind: "FIXTURE_EACH", units_delta: 2.00 }] }
              as: ProjectCoordinator
              captures: { upcharge_rev2: $.data.upcharge_cents }
            - call: "POST /change-orders/${co_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "the first re-submission returned upcharge_cents == 7438 (3108 + 4330)"
            - "the second re-submission returned upcharge_cents == 17919 (one FIXTURE_EACH line of 2.00)"
            - "ChangeOrder.${co_id}.revision_count == 2"
            - "ChangeOrder.${co_id}.status == ACCEPTED"
            - "ChangeOrder.${co_id}.upcharge_cents == 17919"
            - "ChangeOrder.${co_id}.net_primary_units_delta == 0.00"
            - "Project.${proj_id}.change_order_upcharge_cents == 17919"
            - "Project.${proj_id}.fulfillment_status == MEASURED"
            - "Project.${proj_id}.total_due_cents == 0 (final_labor_cents is still null)"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # Two chains from DIFFERENT triggering transitions: a depth-5 chain from
  # PunchListItem OPEN -> ESCALATED and a depth-4 chain from
  # InstallerCredential VERIFIED -> REJECTED. Every link is CAUSED by the
  # previous link, not fanned out from the trigger.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: safety_punch_escalation_cascades_five_hops_to_installer_probation
        grounds:
          - state_machines.PunchListItem.OPEN_to_ESCALATED
          - state_machines.Installer.ACTIVE_to_PROBATION
          - entities.Project.fields.escalated_punch_count
          - entities.Project.fields.service_manager_review_required
          - entities.ScorecardEvent.fields.source
          - calculations.installer_scorecard
          - endpoints[POST /punch-list-items/{id}/escalate]
        distinguishing_aspect: |
          Triggering transition PunchListItem OPEN -> ESCALATED, depth 5, each hop
          caused by the one before it: hop 1 flips the punch item to ESCALATED,
          hop 2 (because of hop 1) bumps Project.escalated_punch_count to 1 and
          sets service_manager_review_required true, hop 3 (because of hop 2 on a
          SAFETY item) appends a SYSTEM PUNCH_SAFETY ScorecardEvent, hop 4
          (because of hop 3) recomputes installer_scorecard to composite 68.65,
          and hop 5 (because of hop 4) drives Installer ACTIVE -> PROBATION.
        test_recipe:
          setup:
            - "ServiceCategory FLOOR-DIRECT: measurement_required false, permit_policy NEVER, base_labor_rate_cents_per_unit 425, minimum_billable_units 150.00, deposit_pct 0.30."
            - "Jurisdiction METRO-01 with labor_complexity_multiplier 1.15, license_required true, background_check_recency_days 365, min_liability_coverage_cents 100000000."
            - "One Installer ACTIVE with exactly one VERIFIED FLOORING credential, background PASS on 2026-07-15."
            - "One Project with estimated_units 420.00: quoted_labor_cents 196673, permit_status NOT_REQUIRED, deposit of 59002 paid."
            - "One MaterialDelivery PLANNED with promised_window_end 2026-08-24T08:00:00.000Z."
