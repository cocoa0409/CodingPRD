  - rule_id: compensating_invariant
    instances:
      - name: claim_void_restores_lifetime_max_pool
        grounds:
          - state_machines.InsuranceClaim.APPROVED_to_VOID
          - calculations.actual_benefit_drawdown
          - entities.InsurancePolicy.fields.remaining_max_cents
          - entities.InsuranceClaim.fields.benefit_cents
        distinguishing_aspect: |
          Conserved quantity = insurance lifetime-max pool: after approving (benefit 75000, remaining
          150000) then voiding the claim, lifetime_max_cents == remaining_max_cents +
          sum(benefit_cents of {APPROVED,PAID} claims) holds with remaining_max restored to 225000 and
          the voided claim's benefit_cents == 0.
        test_recipe:
          setup:
            - "Policy rider true coverage 0.50 lifetime_max 225000; plan ACTIVE; claim billed 150000 APPROVED (benefit 75000, remaining 150000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
