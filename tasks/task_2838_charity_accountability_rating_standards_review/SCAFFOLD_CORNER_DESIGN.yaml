      - name: a_pinned_methodology_keeps_scoring_its_cycle_after_it_is_retired
        claim_type: version_pinning_on_approval
        grounds:
          - entities.RatingCycle.fields.methodology_version_id
          - entities.RatingCycle.fields.methodology_pin_locked
          - state_machines.MethodologyVersion.COMMENT_CLOSED_to_ADOPTED
          - state_machines.MethodologyVersion.ADOPTED_to_RETIRED
          - calculations.composite_score_with_penalty
          - validations[priority=12]
          - errors.ERR_METHODOLOGY_NOT_ADOPTED
          - endpoints.POST_/rating-cycles
          - endpoints.POST_/methodology-versions/{methodology_version_id}/adopt
        distinguishing_aspect: |
          Pinning is what makes a mid-cycle methodology revision harmless, and the
          claim has two directions that must hold simultaneously: an EXISTING cycle
          keeps scoring, publishing and reporting under the weights of a version
          that is now RETIRED, while a NEW cycle may no longer choose that version at
          all. An implementation that resolves weights by "the currently ADOPTED
          version" passes every single-methodology test and fails here; one that
          simply forbids retired versions everywhere breaks the existing cycle. The
          instance retires M1 in the middle of the cycle's life - after the pin, before
          the score - so the weights are only ever read after the retirement, and the
          publication record's label is checked too, because that string is the
          public evidence of which methodology judged the charity.
