# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task: task_3096_exchange_listing_qualification_continued_listing_standards
#
# 9 rule_ids x 2 instances = 18 difficulty instances. Every instance grounds
# in SCAFFOLD.yaml §1.1–§1.7 and carries a directly executable test_recipe.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fee_convention_entry_inclusive_vs_annual_exclusive_same_shares
        grounds:
          - calculations.fee_assessment
          - entities.FeeAssessment.fields.amount_cents
          - endpoints.POST_/issuers/{issuerId}/fee-assessments/run-annual-fees
        distinguishing_aspect: "Same issuer, same tier, same shares_outstanding: the ENTRY variant (inclusive of entry fee) and the ANNUAL variant (exclusive) produce different amounts — 1500000 vs 450000 cents at the GLOBAL_SELECT floor with 1 share."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer APP1 with a GLOBAL_SELECT application (equity 2000000000, MVLS 5000000000000, MVUPH 1000000000, revenue 100000000000, income 2000000000, bid 500, publicly held 2000000, unrestricted publicly held 1 share, holders 500, total holders 500, market makers 4, 60 months operating history), approved — an ENTRY fee row exists; the issuer is LISTED."
          setup_api_calls:
            - &dv1_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ListingAnalyst
            - &dv1_issuer
              call: "POST /issuers"
              payload: { legal_name: "Dual Variant One Corp", ticker_symbol: "DVON" }
              as: ListingAnalyst
              captures: { issuer_id: $.data.id }
            - &dv1_app
              call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "GLOBAL_SELECT", board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D3", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 2000000000, market_value_listed_securities_cents: 5000000000000, market_value_unrestricted_publicly_held_cents: 1000000000, total_revenue_cents: 100000000000, income_from_continuing_operations_cents: 2000000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 1, round_lot_holders: 500, total_shareholders: 500, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { app_id: $.data.id }
            - &dv1_submit
              call: "POST /issuers/${issuer_id}/listing-applications/${app_id}/submit"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
            - &dv1_get_issuer
              call: "GET /issuers/${issuer_id}"
              payload: {}
              as: ListingAnalyst
              captures: { issuer_v: $.data.version }
            - &dv1_approve
              call: "POST /issuers/${issuer_id}/listing-applications/${app_id}/approve"
              payload: { expected_issuer_version: "${issuer_v}" }
              as: ListingAnalyst
            - &dv1_list_fees
              call: "GET /issuers/${issuer_id}/fee-assessments"
              payload: { fee_kind: "ENTRY" }
              as: FinanceOfficer
              captures: { entry_fee: "$.data[0].amount_cents" }
          trigger:
            - call: "GET /issuers/${issuer_id}"
              payload: {}
              as: ListingAnalyst
              captures: { issuer_v2: $.data.version }
            - call: "POST /issuers/${issuer_id}/fee-assessments/run-annual-fees"
              payload: { shares_outstanding: 1, expected_issuer_version: "${issuer_v2}" }
              as: FinanceOfficer
              captures: { annual_fee_id: $.data.id }
          assert:
            - "the ENTRY fee row's amount_cents == 1500000 (inclusive variant: clamp(1, 1500000, 2500000))"
            - "FeeAssessment.${annual_fee_id}.fee_kind == ANNUAL and assessment_year == 2026"
            - "FeeAssessment.${annual_fee_id}.amount_cents == 450000 (exclusive variant: clamp(1, 450000, 1050000))"
            - "FeeAssessment.${annual_fee_id}.amount_cents != 1500000 — identical tier and shares_outstanding, divergent variants"
            - "FeeAssessment.${annual_fee_id}.status == INVOICED (assessment invoices immediately on creation)"

      - name: tier_standards_entry_rejects_vs_continued_accepts_same_metrics
        grounds:
          - calculations.evaluate_tier_standards
          - entities.ListingApplication.fields.evaluated_standards
          - endpoints.POST_/issuers/{issuerId}/listing-applications/{applicationId}/submit
        distinguishing_aspect: "Identical metric set (equity 1000000000, MVLS 800000000000, MVUPH 1500000000, revenue 5000000000, income 900000000, holders 500, market makers 4): the entry_standards variant finds no passing GLOBAL standard, while the continued_standards variant over the same numbers passes the GLOBAL MVPHS leg (1500000000 >= 500000000 and 500 >= 400)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer APP2 with a GLOBAL application carrying the borderline metric set."
          setup_api_calls:
            - *dv1_clock
            - call: "POST /issuers"
              payload: { legal_name: "Dual Variant Two Corp", ticker_symbol: "DVTW" }
              as: ListingAnalyst
              captures: { issuer_id: $.data.id }
            - call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "GLOBAL", board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: true }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D3", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 800000000000, market_value_unrestricted_publicly_held_cents: 1500000000, total_revenue_cents: 5000000000, income_from_continuing_operations_cents: 900000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 500, total_shareholders: 500, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications/${app_id}/submit"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
          assert:
            - "ListingApplication.${app_id}.status == REJECTED (auto-rejected at submit: S1 fails the equity leg 1000000000 < 1500000000; S2 passes its MVLS leg but fails MVUPH 1500000000 < 2000000000; S3 fails the revenue leg 5000000000 < 750000000000)"
            - "ListingApplication.${app_id}.evaluated_standards records every GLOBAL standard with passed == false"
            - "evaluated against the continued_standards variant, the same metrics pass GLOBAL: MVPHS leg 1500000000 >= 500000000 and holders 500 >= 400 — the two variants disagree on identical inputs"
            - "Issuer.${issuer_id}.status == PRE_LISTING (no listing was created)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: governance_majority_committee_membership_composition
        grounds:
          - calculations.evaluate_tier_standards
          - validations[priority=7]
          - entities.ListingApplication.fields.audit_committee
        distinguishing_aspect: "Mode (a): submit-time governance gating is a >= 3-input conditional composition — 4-director board with exactly 2 independent fails the strict-majority leg (2 > 2 is false) while a properly staffed audit committee passes its own legs, so the ERR_GOVERNANCE_COMPOSITION error isolates the majority rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Issuer APP3 with a CAPITAL application whose board has 4 directors of whom exactly 2 are independent; audit committee has 3 independent members with 1 financial expert; compensation committee has 2 independent members."
          setup_api_calls:
            - *dv1_clock
            - call: "POST /issuers"
              payload: { legal_name: "Majority Edge Corp", ticker_symbol: "MJED" }
              as: ListingAnalyst
              captures: { issuer_id: $.data.id }
            - call: "POST /issuers/${issuer_id}/listing-applications"
              payload: { target_tier: "CAPITAL", board_directors: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }, { director_name: "D3", is_independent: false }, { director_name: "D4", is_independent: false }], audit_committee: [{ director_name: "D1", is_independent: true, is_financial_expert: true }, { director_name: "D2", is_independent: true, is_financial_expert: false }, { director_name: "D1", is_independent: true, is_financial_expert: false }], compensation_committee: [{ director_name: "D1", is_independent: true }, { director_name: "D2", is_independent: true }], stockholders_equity_cents: 1000000000, market_value_listed_securities_cents: 600000000000, market_value_unrestricted_publicly_held_cents: 500000000, total_revenue_cents: 1000000000, income_from_continuing_operations_cents: 100000000, bid_price_cents: 500, publicly_held_shares: 2000000, unrestricted_publicly_held_shares: 2000000, round_lot_holders: 400, total_shareholders: 400, market_makers: 4, operating_history_months: 60 }
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /issuers/${issuer_id}/listing-applications/${app_id}/submit"
              payload: {}
              as: IssuerOfficer
              as_user_id: "${issuer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_GOVERNANCE_COMPOSITION"
            - "the majority leg is the failing one: 2 independent of 4 directors is not strictly greater than 50 percent"
            - "ListingApplication.${app_id}.status == DRAFT (submit failed before evaluation; evaluated_standards stays empty)"
            - "Issuer.${issuer_id}.status == PRE_LISTING"

      - name: fee_bracket_clamp_order_with_mid_year_surcharge
        grounds:
          - calculations.fee_assessment
          - entities.FeeAssessment.fields.delisted_mid_year
          - endpoints.POST_/issuers/{issuerId}/listings/{listingId}/execute-delisting
        distinguishing_aspect: "Mode (c): the fee amount is well-defined only because evaluation order is pinned — bracket lookup on shares_outstanding, then clamp into the bracket's [min, max] range, then add the flat mid-year surcharge; a CAPITAL delisting fill at 20000000 shares yields clamp to 800000 then + 1000000 = 1800000, not a clamp of 1800000 into the bracket."
