# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file leaves the
# scaffold's declared behaviour identical; it only makes coverage harder to audit.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: damage_provisional_list_vs_final_depreciated_subtotal
        grounds:
          - calculations.damage_line_assessment
          - entities.DamageCharge.fields.provisional_subtotal_cents
          - entities.DamageCharge.fields.assessed_subtotal_cents
          - entities.DamageCharge.fields.depreciation_rate
          - state_machines.RoomInspection.SCHEDULED_to_COMPLETED
          - state_machines.DamageCharge.PENDING_to_BILLED
        distinguishing_aspect: |
          The two variants of damage_line_assessment run on the facilities-billing domain
          (RoomInspection -> DamageCharge): PROVISIONAL_LIST stamped at inspection
          completion returns 37000 cents from undepreciated catalog prices while
          FINAL_DEPRECIATED stamped at billing returns 25900 cents from the same two
          damage lines, a 11100-cent divergence caused purely by the algorithm choice.
        test_recipe:
          setup:
            - "Kerr Hall (posture OPEN) with floor 2 and room 201 (bed_capacity 2, last_renovation_year 2021)."
            - "Ada Ray is a CERTIFIED, ACTIVE RA assigned to floor 2."
            - "Bo Lin is a resident of room 201 with financial_hardship_flag true."
            - "A CHECK_OUT inspection of room 201 is COMPLETED with damage_lines [WALL x2, DOOR x1] and responsible_student_id Bo Lin, producing a PENDING DamageCharge."
            - "The logical clock is still at its 2026-08-01T00:00:00Z default, so the room's age is 5 years and depreciation_rate is 0.30."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Ada Ray", email: "ada@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_ada_id: $.data.id }
            - call: "POST /residence-life/ra-applications"
              payload: { applicant_student_id: "${s_ada_id}", term_code: "2026FA", essay_ref: "E-ADA" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { app_id: $.data.id }
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_ada_id}"
            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 88 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "OFFER" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/response"
              payload: { response: "ACCEPT" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { ra_id: $.data.created_ra_id }
            - call: "POST /residence-life/ras/${ra_id}/floor-assignment"
              payload: { floor_id: "${f_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/employment"
              payload: { action: "ACTIVATE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/certification"
              payload: { action: "START_TRAINING" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "CRISIS" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "TITLE_IX" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "FIRE_SAFETY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/training-records"
              payload: { module_code: "DIVERSITY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/certification"
              payload: { action: "CERTIFY" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/students"
              payload: { full_name: "Bo Lin", email: "bo@u.edu", class_year: "SOPHOMORE", financial_hardship_flag: true }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_bo_id: $.data.id }
            - call: "POST /residence-life/students/${s_bo_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "GET /residence-life/rooms/${r201_id}"
              payload: {}
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_v: $.data.version }
            - call: "POST /residence-life/room-inspections"
              payload: { room_id: "${r201_id}", inspection_type: "CHECK_OUT", scheduled_for: "2026-08-05T09:00:00Z", expected_room_version: "${r201_v}" }
              as: ResidentAssistant
              as_user_id: "${ra_id}"
              captures: { insp_id: $.data.id }
            - call: "POST /residence-life/room-inspections/${insp_id}/completion"
              payload: { condition_score: 62, damage_lines: [{ component_code: "WALL", quantity: 2 }, { component_code: "DOOR", quantity: 1 }], responsible_student_id: "${s_bo_id}" }
              as: ResidentAssistant
              as_user_id: "${ra_id}"
              captures: { charge_id: $.data.damage_charge_id }
          trigger:
            - call: "POST /residence-life/damage-charges/${charge_id}/billing"
              payload: { note: "term-end assessment" }
              as: BursarOfficer
              as_user_id: "bo-1"
          assert:
            - "DamageCharge.${charge_id}.provisional_subtotal_cents == 37000"
            - "DamageCharge.${charge_id}.depreciation_rate == 0.30"
            - "DamageCharge.${charge_id}.assessed_subtotal_cents == 25900"
            - "DamageCharge.${charge_id}.assessed_subtotal_cents != DamageCharge.${charge_id}.provisional_subtotal_cents"
            - "DamageCharge.${charge_id}.status == BILLED"
            - "RoomInspection.${insp_id}.damage_charge_id == ${charge_id}"

      - name: ra_duty_load_term_to_date_vs_forward_28_window
        grounds:
          - calculations.ra_duty_load_score
          - entities.RA.fields.missed_shift_count
          - entities.DutyShift.fields.points_value
          - state_machines.DutyShift.CHECKED_IN_to_COMPLETED
          - state_machines.DutyShift.ASSIGNED_to_MISSED
        distinguishing_aspect: |
          The two variants of ra_duty_load_score run on the staffing domain (RA x DutyShift),
          a different entity domain from the damage-billing dual variant: over one identical
          five-shift table TERM_TO_DATE returns 5 (settled past shifts, MISSED doubled) while
          FORWARD_28 returns 4 (unsettled shifts inside the next 28 days only).
