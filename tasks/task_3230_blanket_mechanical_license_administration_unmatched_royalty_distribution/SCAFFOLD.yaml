    roles: [MLCAdministrator, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?", "claimant_member_id?", "claimed_work_id?", "status?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
