            - call: "POST /removal-requests"
              payload: { exposure_id: "${exp_id}" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { err_buffer_zero: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T23:59:59Z" }
