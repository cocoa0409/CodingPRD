              payload: { name: "Clear Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 100 }
              as: PlatformAdmin
              captures: { cx_ok: $.data.id }
            - call: "POST /camp-ops/complexes/${cx_hit}/workout-groups"
