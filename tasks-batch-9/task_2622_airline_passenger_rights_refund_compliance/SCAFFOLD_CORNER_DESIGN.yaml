        distinguishing_aspect: "The consent requirement is keyed to the CALLER ROLE, not to the election value: a ComplianceOfficer electing TRAVEL_CREDIT without consent_complaint_id gets ERR_CREDIT_CONSENT_REQUIRED (422), while the identical payload from the Passenger role succeeds."
