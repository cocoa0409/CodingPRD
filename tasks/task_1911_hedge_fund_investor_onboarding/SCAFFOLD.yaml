scenario: |
  1911. Hedge Fund Investor Onboarding & Subscription (hedge fund administrator): subscription document collection & AML/KYC verification, accredited/qualified purchaser status verification, capital commitment & funding deadline, side letter terms & most-favored-nation tracking, capital account setup & series/lot accounting for equalization, redemption request & notice/lockup rules, gate/suspension application, investor reporting & statement delivery

domain_name: hedge-fund-investor-onboarding
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: fund_name, type: string, source: input, description: "Legal name of the hedge fund" }
      - { name: domicile, type: string, source: input, description: "Fund domicile jurisdiction" }
      - { name: gate_threshold_pct, type: number, source: input, description: "Investor-level gate: maximum percent of fund net assets redeemable in one period (e.g. 0.25)" }
      - { name: lockup_months_default, type: integer, source: input, description: "Default lockup applied to new share classes" }
      - { name: notice_days_default, type: integer, source: input, description: "Default redemption notice days" }
      - { name: fiscal_year_end_month, type: integer, source: input, description: "Fiscal year end month 1-12" }
      - { name: suspension_status, type: enum, source: system, default: "NOT_SUSPENDED", constraints: "NOT_SUSPENDED | SUSPENDED", description: "Whether redemptions are currently suspended" }
      - { name: current_nav_period_id, type: string, source: system, description: "Currently open NavPeriod id; null when none open" }
      - { name: total_net_assets_cents, type: integer, source: computed, default: 0, description: "Sum of all accepted CapitalAccount balances across all share classes" }

  - name: ShareClass
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> Fund.id; owning fund" }
      - { name: class_code, type: string, source: input, description: "Ticker-style code (e.g. 'A1', 'B-INST')" }
      - { name: min_initial_investment_cents, type: integer, source: input, description: "Minimum initial subscription amount in cents" }
      - { name: min_additional_investment_cents, type: integer, source: input, description: "Minimum additional subscription amount" }
      - { name: management_fee_bps, type: integer, source: input, description: "Annual management fee in basis points" }
      - { name: performance_fee_bps, type: integer, source: input, description: "Performance (incentive) fee in basis points" }
      - { name: hurdle_rate_bps, type: integer, source: input, description: "Annualized hurdle rate in basis points; 0 = none" }
      - { name: high_water_mark_required, type: boolean, source: input, description: "Whether incentive fee requires high-water mark recovery" }
      - { name: lockup_months, type: integer, source: input, description: "Hard lockup period from subscription funding date" }
      - { name: notice_days, type: integer, source: input, description: "Redemption notice days required before redemption effective date" }
      - { name: redemption_frequency, type: enum, source: input, constraints: "MONTHLY | QUARTERLY | SEMI_ANNUAL | ANNUAL", description: "Permitted redemption frequency" }
      - { name: is_open_for_subscription, type: boolean, source: system, default: true, description: "Whether class currently accepts new subscriptions" }
      - { name: is_open_for_redemption, type: boolean, source: system, default: true, description: "Whether class currently honors redemptions" }

  - name: NavPeriod
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> Fund.id; owning fund" }
      - { name: period_index, type: integer, source: system, description: "Monotonically increasing period number, starts at 1" }
      - { name: period_start_utc, type: datetime, source: system, description: "Inclusive period start" }
      - { name: period_end_utc, type: datetime, source: system, description: "Exclusive period end" }
      - { name: gross_return_bps, type: integer, source: input, description: "Fund-level gross return for the period, basis points, may be negative" }
      - { name: status, type: enum, source: system, default: "OPEN", constraints: "OPEN | NAV_FINALIZED | CLOSED", description: "Period lifecycle" }

  - name: Series
    parent: ShareClass
    common_fields: true
    fields:
      - { name: share_class_id, type: string, source: system, description: "FK -> ShareClass.id; owning class" }
      - { name: nav_period_id, type: string, source: system, description: "FK -> NavPeriod.id; issuance period" }
      - { name: series_index, type: integer, source: system, description: "Monotonically increasing within share class, starts at 1" }
      - { name: opening_nav_per_share_cents, type: integer, source: system, description: "NAV/share at series issuance" }
      - { name: equalization_factor_bps, type: integer, source: computed, default: 0, description: "Performance fee equalization factor in basis points; computed when parent NavPeriod finalizes" }
      - { name: status, type: enum, source: system, default: "OPEN", constraints: "OPEN | FINALIZED | ROLLED", description: "Series lifecycle: OPEN while issuing period is open, FINALIZED at period close, ROLLED into lead series when equalization factor collapses to 0" }

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of investor (individual or entity)" }
      - { name: investor_type, type: enum, source: input, constraints: "INDIVIDUAL | JOINT | CORPORATION | TRUST | PARTNERSHIP | LLC | EMPLOYEE_BENEFIT_PLAN", description: "Investor entity classification driving accreditation rules" }
      - { name: tax_id, type: string, source: input, description: "US TIN or foreign equivalent" }
      - { name: email, type: string, source: input, description: "Primary contact email" }
      - { name: residence_country, type: string, source: input, description: "ISO 3166 country of tax residence" }
      - { name: is_us_person, type: boolean, source: input, description: "Whether investor is a US person (drives accredited vs QP verification path)" }
      - { name: kyc_status, type: enum, source: system, default: "NOT_STARTED", constraints: "NOT_STARTED | DOCUMENTS_PENDING | UNDER_REVIEW | APPROVED | REJECTED | EXPIRED", description: "Aggregate AML/KYC posture derived from latest KycCase" }
      - { name: accreditation_status, type: enum, source: system, default: "UNVERIFIED", constraints: "UNVERIFIED | ACCREDITED | QUALIFIED_PURCHASER | EXPIRED", description: "Highest verified accreditation tier" }
      - { name: aggregate_unfunded_commitment_cents, type: integer, source: computed, default: 0, description: "Sum of commitment minus funded amount over all subscriptions in {ACCEPTED, FUNDING_PARTIAL}" }

  - name: KycCase
    parent: Investor
    common_fields: true
    fields:
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; owning investor" }
      - { name: case_sequence, type: integer, source: system, description: "1-based sequence number within investor" }
      - { name: risk_rating, type: enum, source: input, constraints: "LOW | MEDIUM | HIGH | PROHIBITED", description: "Compliance risk rating assigned on case open" }
      - { name: required_documents, type: array, source: system, description: "List of document types required (derived from risk_rating + investor_type)" }
      - { name: submitted_documents, type: array, source: system, default: "[]", description: "List of document types received" }
      - { name: pep_hit, type: boolean, source: input, description: "Politically exposed person screening hit" }
      - { name: sanctions_hit, type: boolean, source: input, description: "Sanctions list screening hit" }
      - { name: adverse_media_hit, type: boolean, source: input, description: "Adverse media screening hit" }
      - { name: status, type: enum, source: system, default: "OPEN", constraints: "OPEN | AWAITING_DOCUMENTS | IN_REVIEW | APPROVED | REJECTED | ESCALATED", description: "KYC case lifecycle" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded on rejection" }

  - name: AccreditationAttestation
    parent: Investor
    common_fields: true
    fields:
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; owning investor" }
      - { name: attestation_tier, type: enum, source: input, constraints: "ACCREDITED | QUALIFIED_PURCHASER", description: "Tier claimed by investor" }
      - { name: evidence_type, type: enum, source: input, constraints: "INCOME_STATEMENT | NET_WORTH_CERT | CPA_LETTER | LICENSED_PROFESSIONAL | ENTITY_ASSETS", description: "Evidence category supporting the claim" }
      - { name: evidence_document_id, type: string, source: input, description: "Reference to evidence artifact" }
      - { name: attested_at_utc, type: datetime, source: input, description: "Timestamp investor signed the attestation" }
      - { name: expires_at_utc, type: datetime, source: computed, description: "= attested_at_utc + 365 days; computed" }
      - { name: status, type: enum, source: system, default: "PENDING_REVIEW", constraints: "PENDING_REVIEW | VERIFIED | REJECTED | EXPIRED", description: "Attestation verification state" }

  - name: Subscription
    parent: Investor
    common_fields: true
    fields:
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; subscriber" }
      - { name: share_class_id, type: string, source: system, description: "FK -> ShareClass.id; target class" }
      - { name: commitment_amount_cents, type: integer, source: input, description: "Total capital commitment in cents" }
      - { name: funded_amount_cents, type: integer, source: system, default: 0, description: "Cumulative wire receipts applied" }
      - { name: funding_deadline_utc, type: datetime, source: input, description: "Hard funding deadline; missing it allows admin cancellation with penalty" }
      - { name: late_fees_accrued_cents, type: integer, source: computed, default: 0, description: "Late funding fees accrued to date" }
      - { name: effective_series_id, type: string, source: system, description: "FK -> Series.id; series the subscription was admitted into (set at ACCEPT)" }
      - { name: status, type: enum, source: system, default: "DRAFT", constraints: "DRAFT | SUBMITTED | KYC_HOLD | COMPLIANCE_APPROVED | FUNDING_PARTIAL | FUNDED | ACCEPTED | REJECTED | CANCELLED", description: "Subscription lifecycle" }

  - name: SideLetter
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; parent subscription" }
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; denormalized for MFN sweep" }
      - { name: share_class_id, type: string, source: system, description: "FK -> ShareClass.id; denormalized for MFN sweep" }
      - { name: terms_document_id, type: string, source: input, description: "Reference to side letter artifact" }
      - { name: supersedes_side_letter_id, type: string, source: input, description: "FK -> SideLetter.id; prior letter this one replaces; null for first" }
      - { name: mfn_election_active, type: boolean, source: system, default: false, description: "Whether investor has elected MFN treatment" }
      - { name: elected_clause_ids, type: array, source: system, default: "[]", description: "List of MfnClause ids elected under MFN" }
      - { name: status, type: enum, source: system, default: "DRAFT", constraints: "DRAFT | EXECUTED | SUPERSEDED | TERMINATED", description: "Side letter lifecycle" }

  - name: MfnClause
    parent: Fund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> Fund.id; owning fund" }
      - { name: clause_tag, type: enum, source: input, constraints: "FEE_REBATE | LIQUIDITY | INFORMATION_RIGHTS | CAPACITY_RIGHTS | CO_INVEST", description: "Category of MFN-tracked term" }
      - { name: clause_text, type: string, source: input, description: "The actual clause language" }
      - { name: capacity_threshold_cents, type: integer, source: input, description: "Minimum commitment at which clause becomes electable; 0 = electable by all" }
      - { name: fee_rebate_bps, type: integer, source: input, description: "For FEE_REBATE clauses: bps rebate; else 0" }
      - { name: notice_days_reduction, type: integer, source: input, description: "For LIQUIDITY clauses: days shaved off notice; else 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", constraints: "ACTIVE | RETIRED", description: "Whether clause can still be newly elected" }

  - name: CapitalAccount
    parent: Investor
    common_fields: true
    fields:
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; owner" }
      - { name: share_class_id, type: string, source: system, description: "FK -> ShareClass.id; class held" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; originating subscription" }
      - { name: current_balance_cents, type: integer, source: computed, default: 0, description: "Marked-to-market balance" }
      - { name: high_water_mark_cents, type: integer, source: computed, default: 0, description: "Peak balance used for incentive fee" }
      - { name: accrued_performance_fee_cents, type: integer, source: computed, default: 0, description: "Cumulative performance fee accrued" }
      - { name: equalization_deposit_cents, type: integer, source: computed, default: 0, description: "Equalization credit held (series accounting)" }
      - { name: locked_until_utc, type: datetime, source: computed, description: "= funded date + share_class.lockup_months; recomputed per accepted funding" }
      - { name: status, type: enum, source: system, default: "ACTIVE", constraints: "ACTIVE | REDEMPTION_PENDING | CLOSED", description: "Account posture" }

  - name: SeriesLot
    parent: CapitalAccount
    common_fields: true
    fields:
      - { name: capital_account_id, type: string, source: system, description: "FK -> CapitalAccount.id; owning account" }
      - { name: series_id, type: string, source: system, description: "FK -> Series.id; series purchased" }
      - { name: nav_period_id, type: string, source: system, description: "FK -> NavPeriod.id; purchase period" }
      - { name: shares, type: number, source: system, description: "Shares acquired in this lot" }
      - { name: cost_basis_cents, type: integer, source: system, description: "Original purchase amount for this lot" }
      - { name: current_value_cents, type: integer, source: computed, description: "Marked-to-market value of this lot" }
      - { name: equalization_credit_cents, type: integer, source: computed, default: 0, description: "Equalization deposit attached to this lot" }
      - { name: status, type: enum, source: system, default: "OUTSTANDING", constraints: "OUTSTANDING | PARTIALLY_REDEEMED | FULLY_REDEEMED | ROLLED", description: "Lot lifecycle" }

  - name: RedemptionRequest
    parent: CapitalAccount
    common_fields: true
    fields:
      - { name: capital_account_id, type: string, source: system, description: "FK -> CapitalAccount.id; account redeemed from" }
      - { name: investor_id, type: string, source: system, description: "FK -> Investor.id; denormalized" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Dollar amount requested" }
      - { name: requested_shares, type: number, source: input, description: "Optional share-based request; mutually exclusive with amount" }
      - { name: notice_given_at_utc, type: datetime, source: system, description: "Timestamp the request was received" }
      - { name: requested_effective_period_id, type: string, source: input, description: "FK -> NavPeriod.id; desired effective period" }
      - { name: effective_period_id, type: string, source: system, description: "FK -> NavPeriod.id; period the redemption actually settles in (may be later than requested when gated)" }
      - { name: gate_applied_pct, type: number, source: computed, default: 0, description: "Pro-rata cut applied when fund-level gate binds; 0 = no cut" }
      - { name: settled_amount_cents, type: integer, source: computed, default: 0, description: "Cash actually paid out on settlement" }
      - { name: status, type: enum, source: system, default: "PENDING", constraints: "PENDING | APPROVED | PARTIALLY_APPROVED | DEFERRED | SETTLED | REJECTED | CANCELLED", description: "Redemption lifecycle" }

  - name: InvestorStatement
    parent: CapitalAccount
    common_fields: true
    fields:
      - { name: capital_account_id, type: string, source: system, description: "FK -> CapitalAccount.id; account reported on" }
      - { name: nav_period_id, type: string, source: system, description: "FK -> NavPeriod.id; period reported" }
      - { name: opening_balance_cents, type: integer, source: system, description: "Balance at period start" }
      - { name: closing_balance_cents, type: integer, source: computed, description: "Balance at period end" }
      - { name: contributions_cents, type: integer, source: system, default: 0, description: "New contributions in period" }
      - { name: distributions_cents, type: integer, source: system, default: 0, description: "Redemptions/distributions paid in period" }
      - { name: management_fee_cents, type: integer, source: computed, default: 0, description: "Management fee charged" }
      - { name: performance_fee_cents, type: integer, source: computed, default: 0, description: "Performance fee crystallized" }
      - { name: delivered_at_utc, type: datetime, source: system, description: "Timestamp statement marked delivered" }
      - { name: status, type: enum, source: system, default: "DRAFT", constraints: "DRAFT | FINALIZED | DELIVERED", description: "Statement lifecycle" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Subscription
    initial_state: DRAFT
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /funds/{fundId}/subscriptions/{subId}/submit"
        actor: Investor
        preconditions:
          - "Investor.kyc_status != REJECTED (ERR_KYC_REJECTED)"
          - "ShareClass.is_open_for_subscription == true (ERR_CLASS_CLOSED)"
          - "commitment_amount_cents >= ShareClass.min_initial_investment_cents (ERR_BELOW_MIN_INVESTMENT)"
        side_effects:
          - "KycCase created for investor if none OPEN or IN_REVIEW"
          - "Subscription moves to KYC_HOLD when Investor.kyc_status != APPROVED"
      - from: SUBMITTED
        to: KYC_HOLD
        trigger: "system auto-transition when Investor.kyc_status != APPROVED on submission"
        actor: system
        preconditions: ["Investor.kyc_status IN {NOT_STARTED, DOCUMENTS_PENDING, UNDER_REVIEW}"]
        side_effects: []
      - from: KYC_HOLD
        to: COMPLIANCE_APPROVED
        trigger: "system auto-transition when latest KycCase.APPROVED propagates"
        actor: system
        preconditions: ["KycCase.status == APPROVED", "AccreditationAttestation VERIFIED with tier appropriate to ShareClass"]
        side_effects:
          - "Investor.kyc_status recomputed to APPROVED"
      - from: SUBMITTED
        to: COMPLIANCE_APPROVED
        trigger: "POST /funds/{fundId}/subscriptions/{subId}/compliance-approve"
        actor: ComplianceOfficer
        preconditions:
          - "Investor.kyc_status == APPROVED"
          - "Latest AccreditationAttestation.status == VERIFIED"
          - "KycCase.sanctions_hit == false AND KycCase.pep_hit == false (else ESCALATED path)"
        side_effects: []
      - from: COMPLIANCE_APPROVED
        to: FUNDING_PARTIAL
        trigger: "POST /funds/{fundId}/subscriptions/{subId}/fundings (amount < commitment)"
        actor: TransferAgent
        preconditions:
          - "current_utc <= funding_deadline_utc (else ERR_FUNDING_DEADLINE_PASSED)"
        side_effects:
          - "Subscription.funded_amount_cents += amount"
          - "Investor.aggregate_unfunded_commitment_cents recomputed"
      - from: FUNDING_PARTIAL
        to: FUNDING_PARTIAL
        trigger: "POST /funds/{fundId}/subscriptions/{subId}/fundings (still under commitment)"
        actor: TransferAgent
        preconditions: ["current_utc <= funding_deadline_utc"]
        side_effects:
          - "Subscription.funded_amount_cents += amount"
          - "if funded_amount_cents == commitment_amount_cents: auto-transition to FUNDED"
      - from: COMPLIANCE_APPROVED
        to: FUNDED
        trigger: "POST /funds/{fundId}/subscriptions/{subId}/fundings (amount >= remaining)"
        actor: TransferAgent
        preconditions: ["current_utc <= funding_deadline_utc"]
        side_effects:
          - "Subscription.funded_amount_cents = commitment_amount_cents"
      - from: FUNDED
        to: ACCEPTED
        trigger: "POST /funds/{fundId}/subscriptions/{subId}/accept"
        actor: FundAdmin
        preconditions:
          - "Fund.current_nav_period_id is not null (ERR_NO_OPEN_NAV_PERIOD)"
          - "expected_fund_version matches Fund.version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "CapitalAccount created (investor × share_class × subscription)"
          - "SeriesLot created under current open Series (or new Series minted)"
          - "CapitalAccount.locked_until_utc = now + ShareClass.lockup_months"
          - "Fund.total_net_assets_cents += funded_amount_cents"
          - "Fund.version incremented by 1"
      - from: COMPLIANCE_APPROVED
        to: REJECTED
        trigger: "POST /funds/{fundId}/subscriptions/{subId}/compliance-reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Investor.aggregate_unfunded_commitment_cents recomputed"
      - from: FUNDING_PARTIAL
        to: CANCELLED
        trigger: "POST /funds/{fundId}/subscriptions/{subId}/cancel (deadline missed)"
        actor: FundAdmin
        preconditions: ["current_utc > funding_deadline_utc"]
        side_effects:
          - "Late fee computed at LATE_FEE_DAILY_BPS × days_late × funded_amount"
          - "Investor.aggregate_unfunded_commitment_cents recomputed"

  - entity: KycCase
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: OPEN
        to: AWAITING_DOCUMENTS
        trigger: "system auto-transition on case creation"
        actor: system
        preconditions: []
        side_effects: ["required_documents populated from investor_type and risk_rating"]
      - from: AWAITING_DOCUMENTS
        to: IN_REVIEW
        trigger: "POST /investors/{investorId}/kyc-cases/{caseId}/documents (last required doc)"
        actor: Investor
        preconditions: ["submitted_documents ∪ {new_doc} ⊇ required_documents"]
        side_effects: []
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /investors/{investorId}/kyc-cases/{caseId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "sanctions_hit == false (else auto-ESCALATED)"
          - "pep_hit == false OR risk_rating == LOW"
        side_effects:
          - "Investor.kyc_status = APPROVED"
          - "Any Subscription in KYC_HOLD for this investor auto-transitions to COMPLIANCE_APPROVED"
      - from: IN_REVIEW
        to: ESCALATED
        trigger: "system auto-transition when sanctions_hit == true OR (pep_hit == true AND risk_rating != LOW)"
        actor: system
        preconditions: []
        side_effects: ["requires senior ComplianceOfficer override to exit"]
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /investors/{investorId}/kyc-cases/{caseId}/approve (with senior_override=true)"
        actor: ComplianceOfficer
        preconditions: ["payload.senior_override == true"]
        side_effects: ["Investor.kyc_status = APPROVED"]
      - from: ESCALATED
        to: REJECTED
        trigger: "POST /investors/{investorId}/kyc-cases/{caseId}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Investor.kyc_status = REJECTED"
          - "All non-terminal Subscription for investor transition to REJECTED"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /investors/{investorId}/kyc-cases/{caseId}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Investor.kyc_status = REJECTED"
          - "All non-terminal Subscription for investor transition to REJECTED"
      - from: AWAITING_DOCUMENTS
        to: REJECTED
        trigger: "POST /investors/{investorId}/kyc-cases/{caseId}/reject (early rejection)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["Investor.kyc_status = REJECTED"]

  - entity: AccreditationAttestation
    initial_state: PENDING_REVIEW
    terminal_states: [VERIFIED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /investors/{investorId}/accreditations/{attId}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "attested_at_utc within past 90 days (else ERR_STALE_ATTESTATION)"
          - "evidence_document_id present"
        side_effects:
          - "Investor.accreditation_status upgraded to attestation_tier if higher than current"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /investors/{investorId}/accreditations/{attId}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system auto-transition when current_utc > expires_at_utc"
        actor: system
        preconditions: []
        side_effects:
          - "Investor.accreditation_status recomputed to next-highest still-valid tier or UNVERIFIED"
          - "Any Subscription in KYC_HOLD/COMPLIANCE_APPROVED for investor reverts to KYC_HOLD"

  - entity: RedemptionRequest
    initial_state: PENDING
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /funds/{fundId}/redemptions/{redId}/approve"
        actor: FundAdmin
        preconditions:
          - "CapitalAccount.locked_until_utc <= current_utc (else ERR_LOCKUP_NOT_EXPIRED)"
          - "notice given >= ShareClass.notice_days before effective period end (else ERR_INSUFFICIENT_NOTICE)"
          - "Fund.suspension_status == NOT_SUSPENDED (else ERR_REDEMPTIONS_SUSPENDED)"
          - "ShareClass.is_open_for_redemption == true"
        side_effects:
          - "CapitalAccount.status = REDEMPTION_PENDING"
      - from: PENDING
        to: REJECTED
        trigger: "POST /funds/{fundId}/redemptions/{redId}/reject"
        actor: FundAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PARTIALLY_APPROVED
        trigger: "system auto-transition at period close when fund-level gate binds"
        actor: system
        preconditions:
          - "Sum of APPROVED redemption amounts > Fund.gate_threshold_pct × Fund.total_net_assets_cents"
        side_effects:
          - "gate_applied_pct = 1 - (gate_pool / total_approved_requests)"
          - "settled_amount_cents = requested_amount_cents × (1 - gate_applied_pct), rounded half-up"
          - "deferred remainder auto-creates new PENDING RedemptionRequest for next period"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /funds/{fundId}/nav-periods/{periodId}/close (when no gate binds)"
        actor: FundAdmin
        preconditions: ["NavPeriod.status == OPEN"]
        side_effects:
          - "settled_amount_cents = requested_amount_cents"
          - "CapitalAccount.current_balance_cents -= settled_amount_cents"
          - "Fund.total_net_assets_cents -= settled_amount_cents"
          - "InvestorStatement updated with distributions_cents"
      - from: PARTIALLY_APPROVED
        to: SETTLED
        trigger: "POST /funds/{fundId}/nav-periods/{periodId}/close (gate applied)"
        actor: FundAdmin
        preconditions: ["NavPeriod.status == OPEN"]
        side_effects:
          - "settled_amount_cents paid out per gate_applied_pct"
          - "Deferred portion spawns new RedemptionRequest (PENDING) for next period with original notice date preserved"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /funds/{fundId}/redemptions/{redId}/cancel"
        actor: Investor
        preconditions: ["current_utc < requested_effective_period.period_end_utc - notice_days (still rescindable)"]
        side_effects: []

  - entity: SideLetter
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /funds/{fundId}/side-letters/{letterId}/execute"
        actor: FundAdmin
        preconditions:
          - "Subscription.status == ACCEPTED"
          - "expected_subscription_version matches Subscription.version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "If supersedes_side_letter_id set: prior SideLetter.status = SUPERSEDED"
          - "Subscription.version incremented"
      - from: EXECUTED
        to: EXECUTED
        trigger: "POST /funds/{fundId}/side-letters/{letterId}/elect-mfn (cyclic: MFN re-election)"
        actor: Investor
        preconditions:
          - "clause.status == ACTIVE (ERR_CLAUSE_RETIRED)"
          - "Investor.commitment_amount_cents >= clause.capacity_threshold_cents (ERR_BELOW_CAPACITY_THRESHOLD)"
          - "mfn_election_active == false for first election; later elections amend"
        side_effects:
          - "elected_clause_ids appended"
          - "mfn_election_active = true"
          - "Effective fee_bps recomputed across investor's CapitalAccount"
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system auto-transition when a new SideLetter with supersedes_side_letter_id=this executes"
        actor: system
        preconditions: []
        side_effects: ["elected MFN clauses re-evaluated against new letter"]
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /funds/{fundId}/side-letters/{letterId}/terminate"
        actor: FundAdmin
        preconditions: []
        side_effects:
          - "elected_clause_ids cleared"
          - "CapitalAccount fee schedule reverts to base ShareClass terms"

  - entity: NavPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: NAV_FINALIZED
        trigger: "POST /funds/{fundId}/nav-periods/{periodId}/finalize"
        actor: FundAdmin
        preconditions:
          - "gross_return_bps input present"
          - "expected_fund_version matches Fund.version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "For each CapitalAccount: apply gross return, accrue management fee"
          - "For each Series in OPEN: equalization_factor_bps computed, Series.FINALIZED"
          - "Fund.version incremented"
      - from: NAV_FINALIZED
        to: CLOSED
        trigger: "POST /funds/{fundId}/nav-periods/{periodId}/close"
        actor: FundAdmin
        preconditions:
          - "All RedemptionRequests in APPROVED or PARTIALLY_APPROVED for this period resolved (SETTLED)"
        side_effects:
          - "Performance fee crystallized against high-water mark"
          - "InvestorStatement generated per active CapitalAccount"
          - "New NavPeriod auto-opened as Fund.current_nav_period_id"
          - "Fund.version incremented"

  - entity: Series
    initial_state: OPEN
    terminal_states: [ROLLED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "system cascade from NavPeriod.finalize"
        actor: system
        preconditions: []
        side_effects: ["equalization_factor_bps computed and locked"]
      - from: FINALIZED
        to: ROLLED
        trigger: "system cascade at next NavPeriod.close when equalization_factor_bps == 0"
        actor: system
        preconditions: ["equalization_factor_bps == 0"]
        side_effects:
          - "All OUTSTANDING SeriesLots under this Series rolled into lead series (series_index=1)"
          - "SeriesLot.status = ROLLED, new lot created under lead series"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent.version only)
# =============================================================================
concurrency_rules:
  - rule_id: subscription-accept-stale-fund
    parent_entity: Fund
    write_endpoint: "POST /funds/{fundId}/subscriptions/{subId}/accept"
    occ_field: "expected_fund_version"
    description: |
      Accepting a Subscription against a Fund whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just accepted a different subscription (advancing
      Fund.total_net_assets_cents and thereby re-pricing the series-NAV the
      current acceptance relies on) and the current writer's view of the fund
      is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: nav-finalize-stale-fund
    parent_entity: Fund
    write_endpoint: "POST /funds/{fundId}/nav-periods/{periodId}/finalize"
    occ_field: "expected_fund_version"
    description: |
      Finalizing a NavPeriod against a Fund whose version has advanced since
      the client last observed it is rejected. Finalization freezes per-series
      equalization factors against the fund's net assets at a particular
      version; if another writer has just accepted a subscription (bumping
      Fund.version), the cached total is stale and the finalize MUST be
      re-issued with a fresh expected_fund_version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: side-letter-execute-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /funds/{fundId}/side-letters/{letterId}/execute"
    occ_field: "expected_subscription_version"
    description: |
      Executing a SideLetter against a Subscription whose version has advanced
      since the client last observed it is rejected. Side letter execution
      supersedes prior letters and re-prices fee terms whose validity depends
      on the subscription state observed at drafting; if another writer has
      just executed a different letter (bumping Subscription.version), the
      current execution is against a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: series_equalization_factor
    trigger: "On NavPeriod.finalize for each OPEN Series of each ShareClass of the fund"
    algorithm: tiered_pricing
    formula: |
      # Inputs: opening_nav_per_share_cents (O), closing_nav_per_share_cents (C),
      #         hurdle_rate_bps (H), performance_fee_bps (P), days_in_period (D)
      # Mode: per-series, non-linear; rounding at the very END only.
      gross_return = (C - O) / O
      hurdle_return = (H / 10000) * (D / 365)
      if gross_return <= hurdle_return:
          equalization_factor_bps = 0
      else:
          excess_return = gross_return - hurdle_return
          incentive = excess_return * (P / 10000)
          # express incentive back as bps of opening NAV
          equalization_factor_bps = round_half_up( incentive * 10000 )
      # Edge: if C < O (negative return), factor is 0 regardless of hurdle.
    input_set: "Series in {OPEN} under the NavPeriod being finalized; ShareClass constants (hurdle_rate_bps, performance_fee_bps)"
    constants:
      DAYS_IN_YEAR: 365
      ROUNDING: "round_half_up at final step only; intermediate values keep full precision"
    precision: "0 decimal places (integer bps), round_half_up"
    variants:
      - name: provisional
        when: "Computed on intra-period estimates (e.g. mid-month flash NAV) for what-if projections; never persisted to Series"
        difference: "Uses estimated closing NAV; result not locked, recomputed on finalize"
      - name: final
        when: "Computed once on NavPeriod.finalize"
        difference: "Uses actual closing NAV; result persisted to Series.equalization_factor_bps and locked"

  - name: redemption_gate_proration
    trigger: "On NavPeriod.close when total approved redemptions exceed fund-level gate"
    algorithm: waterfall_allocation
    formula: |
      # Mode: aggregate-level gate applied pro-rata; rounding order is pinned.
      total_approved_cents = sum(r.requested_amount_cents for r in approved_requests)
      gate_pool_cents = floor(Fund.gate_threshold_pct * Fund.total_net_assets_cents)
      if total_approved_cents <= gate_pool_cents:
          for each r: r.gate_applied_pct = 0, r.settled_amount_cents = r.requested_amount_cents
      else:
          # Phase 1: compute exact pro-rata share per request as a RATIONAL (no rounding yet)
          # Phase 2: settle = floor(requested * gate_pool / total_approved) per line, then
          #          distribute the remainder cents to the largest-remainder lines in order
          #          of (requested_amount_cents DESC, notice_given_at_utc ASC, capital_account_id.created_at ASC)
          gate_applied_pct = 1 - gate_pool_cents / total_approved_cents   # 6-decimal fixed point
          for each r:
              settled_floor = floor(r.requested_amount_cents * gate_pool_cents / total_approved_cents)
              remainder     = r.requested_amount_cents * gate_pool_cents - settled_floor * total_approved_cents
          distribute remaining_pool = gate_pool_cents - sum(settled_floor) one cent at a time by remainder DESC
          # Note: rounding remainder distribution uses created_at as final tie-break; never id
    input_set: "RedemptionRequests in {APPROVED} under the closing NavPeriod and current Fund"
    constants:
      REMAINDER_TIEBREAK: "requested_amount_cents DESC, notice_given_at_utc ASC, capital_account.created_at ASC"
      ROUNDING_ORDER: "floor per line THEN distribute remainder; never round per-line to nearest"
    precision: "settled_amount_cents integer cents; gate_applied_pct 6 decimal fixed-point"

  - name: lockup_expiry_date
    trigger: "On CapitalAccount creation and on every funding receipt that advances funded_amount"
    algorithm: chronological
    formula: |
      # locked_until_utc = (date of funding event that transitions Subscription to FUNDED) + ShareClass.lockup_months
      # If multiple partial fundings span a period, lockup is measured from the FINAL funding that
      # completes the commitment, not from the first. Edge case: month-end + N months (e.g. Jan 31 + 1mo
      # = last day of Feb); use calendar-month arithmetic with end-of-month clamping.
      base_date = subscription.FUNDED_transition_timestamp
      locked_until = add_calendar_months_with_end_of_month_clamp(base_date, lockup_months)
    input_set: "Single Subscription's funding events; ShareClass.lockup_months"
    constants:
      MONTH_END_CLAMP: "when day-of-month > days in target month, use last day of target month"
    precision: "UTC timestamp, second precision"

  - name: mfn_clause_effective_fee
    trigger: "On SideLetter EXECUTED with elected MFN FEE_REBATE clause; recomputed when new clause elected or letter terminated"
    algorithm: weighted_scoring
    formula: |
      # Mode (a): non-linear with tiered capacity thresholds
      base_fee_bps = ShareClass.management_fee_bps + ShareClass.performance_fee_bps
      # Only clauses whose capacity_threshold_cents <= Subscription.commitment_amount_cents are eligible
      eligible = [c for c in elected_fees_clauses if c.capacity_threshold_cents <= commitment]
      # Total rebate = sum of eligible fee_rebate_bps, capped at 50% of base_fee_bps
      total_rebate_bps = min(sum(c.fee_rebate_bps for c in eligible), base_fee_bps // 2)
      effective_fee_bps = base_fee_bps - total_rebate_bps
    input_set: "EXECUTED SideLetter.elected_clause_ids ∩ MfnClause.status==ACTIVE ∩ tag==FEE_REBATE; Subscription.commitment_amount_cents"
    constants:
      REBATE_CAP_PCT: 0.5
    precision: "integer bps"

  - name: late_funding_fee_accrual
    trigger: "On FundAdmin cancellation of FUNDING_PARTIAL subscription past deadline"
    algorithm: decay_function
    formula: |
      # Mode (b): nested rounding — daily accrual rounded PER DAY then summed (not summed then rounded).
      days_late = (cancellation_date - funding_deadline_utc).days  # integer days, floor
      daily_rate = LATE_FEE_DAILY_BPS / 10000
      late_fee_cents = sum( round_half_up(funded_amount_cents * daily_rate) for day in 1..days_late )
      # Note: rounding per-day then summing produces a different total than sum-then-round for
      # odd funded amounts; the per-day rounding order is PINNED.
    input_set: "Subscription in {FUNDING_PARTIAL} with current_utc > funding_deadline_utc"
    constants:
      LATE_FEE_DAILY_BPS: 5
    precision: "integer cents; per-day round_half_up then sum"

  - name: notice_days_validation
    trigger: "On RedemptionRequest.approve"
    algorithm: threshold
    formula: |
      # Boundary-precision: notice_days check is >=, not >.
      required_notice_days = ShareClass.notice_days - sum(c.notice_days_reduction for c in applicable_liquidity_clauses)
      # Boundary at 0: when sum of reductions >= ShareClass.notice_days, required = 0 and any notice satisfies.
      required_notice_days = max(0, required_notice_days)
      actual_notice_days = (requested_effective_period.period_end_utc - notice_given_at_utc).days
      valid = actual_notice_days >= required_notice_days
    input_set: "Single RedemptionRequest; its CapitalAccount.ShareClass; applicable LIQUIDITY MfnClauses"
    constants:
      BOUNDARY_OPERATOR: ">="  # exactly at boundary is VALID
    precision: "integer days"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Fund, Investor, ShareClass, NavPeriod referenced in path exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Child resource (Subscription, KycCase, etc.) exists under parent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target entity in valid state for requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "sanctions_hit == false before KYC approval"
    error_id: ERR_SANCTIONS_HIT
    http_status: 422
    applies_to: "POST /investors/{investorId}/kyc-cases/{caseId}/approve"
  - priority: 7
    category: business_safety
    check: "Fund.suspension_status == NOT_SUSPENDED before redemption approve"
    error_id: ERR_REDEMPTIONS_SUSPENDED
    http_status: 422
    applies_to: "POST /funds/{fundId}/redemptions/{redId}/approve"
  - priority: 8
    category: business_safety
    check: "Attestation not stale (attested_at_utc within 90 days)"
    error_id: ERR_STALE_ATTESTATION
    http_status: 422
    applies_to: "POST /investors/{investorId}/accreditations/{attId}/verify"
  - priority: 9
    category: business_temporal
    check: "current_utc <= funding_deadline_utc on funding receipt"
    error_id: ERR_FUNDING_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /funds/{fundId}/subscriptions/{subId}/fundings"
  - priority: 10
    category: business_temporal
    check: "CapitalAccount.locked_until_utc <= current_utc on redemption approve"
    error_id: ERR_LOCKUP_NOT_EXPIRED
    http_status: 422
    applies_to: "POST /funds/{fundId}/redemptions/{redId}/approve"
  - priority: 11
    category: business_temporal
    check: "actual_notice_days >= required_notice_days on redemption approve"
    error_id: ERR_INSUFFICIENT_NOTICE
    http_status: 422
    applies_to: "POST /funds/{fundId}/redemptions/{redId}/approve"
  - priority: 12
    category: business_constraint
    check: "commitment_amount_cents >= ShareClass.min_initial_investment_cents"
    error_id: ERR_BELOW_MIN_INVESTMENT
    http_status: 422
    applies_to: "POST /funds/{fundId}/subscriptions"
  - priority: 13
    category: business_constraint
    check: "ShareClass.is_open_for_subscription == true on subscription submit"
    error_id: ERR_CLASS_CLOSED
    http_status: 422
    applies_to: "POST /funds/{fundId}/subscriptions"
  - priority: 14
    category: business_constraint
    check: "MfnClause.capacity_threshold_cents <= Subscription.commitment_amount_cents on MFN election"
    error_id: ERR_BELOW_CAPACITY_THRESHOLD
    http_status: 422
    applies_to: "POST /funds/{fundId}/side-letters/{letterId}/elect-mfn"
  - priority: 15
    category: business_constraint
    check: "MfnClause.status == ACTIVE on MFN election"
    error_id: ERR_CLAUSE_RETIRED
    http_status: 422
    applies_to: "POST /funds/{fundId}/side-letters/{letterId}/elect-mfn"
  - priority: 16
    category: business_constraint
    check: "KycCase required_documents ⊆ submitted_documents before case IN_REVIEW"
    error_id: ERR_INCOMPLETE_DOCUMENTS
    http_status: 422
    applies_to: "POST /investors/{investorId}/kyc-cases/{caseId}/documents"
  - priority: 17
    category: business_referential
    check: "supersedes_side_letter_id, when present, references an EXECUTED SideLetter owned by same investor"
    error_id: ERR_INVALID_SUPERSESSION
    http_status: 422
    applies_to: "POST /funds/{fundId}/side-letters"
  - priority: 18
    category: business_referential
    check: "effective_series_id references an OPEN Series of the subscription's ShareClass on accept"
    error_id: ERR_SERIES_MISMATCH
    http_status: 422
    applies_to: "POST /funds/{fundId}/subscriptions/{subId}/accept"
  - priority: 19
    category: business_fiscal
    check: "Fund.current_nav_period_id non-null before subscription accept"
    error_id: ERR_NO_OPEN_NAV_PERIOD
    http_status: 422
    applies_to: "POST /funds/{fundId}/subscriptions/{subId}/accept"
  - priority: 20
    category: business_fiscal
    check: "funding receipt amount > 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /funds/{fundId}/subscriptions/{subId}/fundings"
  - priority: 21
    category: business_fiscal
    check: "redemption requested_amount_cents <= CapitalAccount.current_balance_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /funds/{fundId}/redemptions"
  - priority: 22
    category: state
    check: "OCC expected_<parent>_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /funds/{fundId}/subscriptions/{subId}/accept, POST /funds/{fundId}/nav-periods/{periodId}/finalize, POST /funds/{fundId}/side-letters/{letterId}/execute"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock & system ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical server clock. Server default before any set call is exactly 2026-08-01T00:00:00Z. All time-dependent logic (deadlines, lockups, notice windows, attestation expiry) reads this clock, never wall-clock."
    roles: [FundAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["AccreditationAttestation EXPIRED sweep re-runs", "KycCase EXPIRED sweep re-runs"]

  # ---- Fund ----
  - method: POST
    path: "/funds"
    description: "Create a new hedge fund"
    roles: [FundAdmin]
    code: 201
    input: [fund_name, domicile, gate_threshold_pct, lockup_months_default, notice_days_default, fiscal_year_end_month]
    output: Fund
    side_effects: []
  - method: GET
    path: "/funds"
    description: "List funds (paginated)"
    roles: [FundAdmin, ComplianceOfficer, TransferAgent, PortfolioManager, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Fund[]"
    side_effects: []
  - method: GET
    path: "/funds/{id}"
    description: "Get a single fund"
    roles: [FundAdmin, ComplianceOfficer, TransferAgent, PortfolioManager, Investor]
    code: 200
    input: []
    output: Fund
    side_effects: []
  - method: POST
    path: "/funds/{id}/suspend-redemptions"
    description: "Suspend all redemptions for the fund"
    roles: [FundAdmin]
    code: 200
    input: []
    output: Fund
    side_effects: ["Fund.suspension_status = SUSPENDED"]
  - method: POST
    path: "/funds/{id}/resume-redemptions"
    description: "Resume redemptions"
    roles: [FundAdmin]
    code: 200
    input: []
    output: Fund
    side_effects: ["Fund.suspension_status = NOT_SUSPENDED"]

  # ---- ShareClass ----
  - method: POST
    path: "/funds/{id}/share-classes"
    description: "Create a share class under a fund"
    roles: [FundAdmin]
    code: 201
    input: [class_code, min_initial_investment_cents, min_additional_investment_cents, management_fee_bps, performance_fee_bps, hurdle_rate_bps, high_water_mark_required, lockup_months, notice_days, redemption_frequency]
    output: ShareClass
    side_effects: []
  - method: GET
    path: "/funds/{id}/share-classes"
    description: "List share classes of a fund"
    roles: [FundAdmin, ComplianceOfficer, TransferAgent, PortfolioManager, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShareClass[]"
    side_effects: []
  - method: GET
    path: "/funds/{id}/share-classes/{id}"
    description: "Get a single share class"
    roles: [FundAdmin, ComplianceOfficer, TransferAgent, PortfolioManager, Investor]
    code: 200
    input: []
    output: ShareClass
    side_effects: []
  - method: POST
    path: "/funds/{id}/share-classes/{id}/close-subscription"
    description: "Close a class to new subscriptions"
    roles: [FundAdmin]
    code: 200
    input: []
    output: ShareClass
    side_effects: ["ShareClass.is_open_for_subscription = false"]
  - method: POST
    path: "/funds/{id}/share-classes/{id}/close-redemption"
    description: "Close a class to redemptions"
    roles: [FundAdmin]
    code: 200
    input: []
    output: ShareClass
    side_effects: ["ShareClass.is_open_for_redemption = false"]

  # ---- NavPeriod ----
  - method: POST
    path: "/funds/{id}/nav-periods"
    description: "Open a new NAV period (only one OPEN at a time per fund)"
    roles: [FundAdmin]
    code: 201
    input: [period_end_utc]
    output: NavPeriod
    side_effects: ["Fund.current_nav_period_id updated"]
  - method: GET
    path: "/funds/{id}/nav-periods"
    description: "List NAV periods of a fund"
    roles: [FundAdmin, ComplianceOfficer, TransferAgent, PortfolioManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "NavPeriod[]"
