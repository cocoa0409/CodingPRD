# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0271_bowling_entertainment_center
# 9 rule_ids x >=2 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals precomputed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reservation_per_game_vs_per_hour_diverge
        grounds:
          - calculations.reservation_quote
          - entities.Reservation.fields.pricing_mode
          - entities.Reservation.fields.lane_subtotal_cents
          - state_machines.Reservation.DRAFT_to_HELD
        distinguishing_aspect: "Same lane, same 90-min peak window, same 4 bowlers x 3 games priced PER_GAME yields lane_subtotal 9600 but PER_HOUR yields 7200 — two valid variants, different results, on the Reservation entity."
        test_recipe:
          setup:
            - "RateCard rc: per_game_cents=800, per_hour_cents=3000, block_minutes=60, peak_multiplier_bps=12000, peak_start_hour=18, peak_end_hour=23, deposit_pct_bps=2000."
            - "Lane L1 IN_SERVICE, max_bowlers=6. Customer C1 ACTIVE."
            - "Two reservations on L1 for non-overlapping peak windows, one PER_GAME and one PER_HOUR, both with bowler_count=4 and game_count=3."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "Std", per_game_cents: 800, per_hour_cents: 3000, block_minutes: 60, peak_multiplier_bps: 12000, peak_start_hour: 18, peak_end_hour: 23, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 1, max_bowlers: 6 }
              as: CenterManager
              captures: { l1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: FrontDesk
              captures: { c1_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l1_id}", pricing_mode: "PER_GAME", start_at: "2026-07-01T18:00:00.000Z", end_at: "2026-07-01T19:30:00.000Z", bowler_count: 4, game_count: 3 }
              as: FrontDesk
              captures: { res_game_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l1_id}", pricing_mode: "PER_HOUR", start_at: "2026-07-01T20:00:00.000Z", end_at: "2026-07-01T21:30:00.000Z", bowler_count: 4, game_count: 3 }
              as: FrontDesk
              captures: { res_hour_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_game_id}/hold"
              payload: {}
              as: FrontDesk
              captures: { game_lane_subtotal: $.data.lane_subtotal_cents }
            - call: "POST /reservations/${res_hour_id}/hold"
              payload: {}
              as: FrontDesk
              captures: { hour_lane_subtotal: $.data.lane_subtotal_cents }
          assert:
            - "Reservation.${res_game_id}.lane_subtotal_cents == 9600"
            - "Reservation.${res_hour_id}.lane_subtotal_cents == 7200"
            - "Reservation.${res_game_id}.lane_subtotal_cents != Reservation.${res_hour_id}.lane_subtotal_cents"

      - name: league_season_quote_vs_accrual_diverge
        grounds:
          - calculations.league_fee
          - entities.League.fields.season_fee_quote_cents
          - entities.League.fields.season_fee_accrued_cents
          - state_machines.League.ACTIVE_to_CLOSED
        distinguishing_aspect: "On the League entity (a different domain than Reservation), forward-looking season_fee_quote = 5000*4 = 20000 while chronological accrual over 2 PLAYED + 1 FORFEITED + 1 RAINED_OUT = 15000 — same season size, different result."
        test_recipe:
          setup:
            - "RateCard rc. Four IN_SERVICE lanes so each night can reserve 1 lane."
            - "League LG: season_night_count=4, lanes_per_night=1, weekly_fee_cents=5000, ACTIVE with 4 scheduled nights."
            - "Clock at a time after all night start_at so nights can resolve."
            - "Nights 1,2 -> PLAYED; night 3 -> FORFEITED; night 4 -> RAINED_OUT."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "Lg", per_game_cents: 500, per_hour_cents: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 11 }
              as: CenterManager
              captures: { ln1_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 12 }
              as: CenterManager
              captures: { ln2_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 13 }
              as: CenterManager
              captures: { ln3_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 14 }
              as: CenterManager
              captures: { ln4_id: $.data.id }
            - call: "POST /leagues"
              payload: { name: "Thursday Night", rate_card_id: "${rc_id}", season_night_count: 4, lanes_per_night: 1, weekly_fee_cents: 5000 }
              as: LeagueAdmin
              captures: { lg_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 1, start_at: "2026-07-02T18:00:00.000Z", end_at: "2026-07-02T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { n1_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 2, start_at: "2026-07-09T18:00:00.000Z", end_at: "2026-07-09T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { n2_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 3, start_at: "2026-07-16T18:00:00.000Z", end_at: "2026-07-16T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { n3_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 4, start_at: "2026-07-23T18:00:00.000Z", end_at: "2026-07-23T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { n4_id: $.data.id }
            - call: "POST /leagues/${lg_id}/activate"
              payload: {}
              as: LeagueAdmin
              captures: { quote_after_activate: $.data.season_fee_quote_cents }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-24T00:00:00.000Z" }
              as: FrontDesk
            - call: "POST /league-nights/${n1_id}/mark-played"
              payload: {}
              as: LeagueAdmin
            - call: "POST /league-nights/${n2_id}/mark-played"
              payload: {}
              as: LeagueAdmin
            - call: "POST /league-nights/${n3_id}/forfeit"
              payload: {}
              as: LeagueAdmin
            - call: "POST /league-nights/${n4_id}/rain-out"
              payload: {}
              as: LeagueAdmin
          trigger:
            - call: "POST /leagues/${lg_id}/close"
              payload: {}
              as: LeagueAdmin
              captures: { accrued: $.data.season_fee_accrued_cents, quote: $.data.season_fee_quote_cents }
          assert:
            - "League.${lg_id}.season_fee_quote_cents == 20000"
            - "League.${lg_id}.season_fee_accrued_cents == 15000"
            - "League.${lg_id}.season_fee_quote_cents != League.${lg_id}.season_fee_accrued_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: party_package_tiered_guest_charge_mode_a
        grounds:
          - calculations.party_package_total
          - entities.PartyPackage.fields.base_cents
          - entities.PartyPackage.fields.included_guests
          - entities.Reservation.fields.package_subtotal_cents
        distinguishing_aspect: "Mode (a): package_subtotal = base + max(0, min(guest_count,max_guests)-included_guests)*extra — >=3 inputs with nested min/max; 12 guests, included 8, max 20, base 15000, extra 1200 -> 19800."
        test_recipe:
          setup:
            - "RateCard rc, Lane L IN_SERVICE max_bowlers=6, Customer C ACTIVE."
            - "PartyPackage PP: base_cents=15000, included_guests=8, extra_guest_cents=1200, max_guests=20, included_lane_hours=2."
            - "Reservation with party_package_id=PP, guest_count=12, PER_GAME, bowler_count=6, game_count=0 (lane charge waived by package included hours scenario kept minimal)."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "Party", per_game_cents: 0, per_hour_cents: 0, block_minutes: 60, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 21, max_bowlers: 6 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "party@x.com", full_name: "Party Host" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /party-packages"
              payload: { name: "Birthday Bash", base_cents: 15000, included_guests: 8, extra_guest_cents: 1200, max_guests: 20, included_lane_hours: 2 }
              as: CenterManager
              captures: { pp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", party_package_id: "${pp_id}", pricing_mode: "PER_GAME", start_at: "2026-07-05T14:00:00.000Z", end_at: "2026-07-05T16:00:00.000Z", bowler_count: 6, game_count: 0, guest_count: 12 }
              as: FrontDesk
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/hold"
              payload: {}
              as: FrontDesk
              captures: { pkg_sub: $.data.package_subtotal_cents }
          assert:
            - "Reservation.${res_id}.package_subtotal_cents == 19800"

      - name: food_total_round_per_line_then_sum_mode_b
        grounds:
          - calculations.food_total
          - entities.FoodOrderLine.fields.line_total_cents
          - entities.Reservation.fields.food_subtotal_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned round-per-line-then-sum; two taxable lines (gross 597 each, tax 49 each -> 646 each) sum to 1292, whereas sum-then-round would give 1293 — a 1-cent divergence proving the pinned order."
        test_recipe:
          setup:
            - "RateCard rc, Lane L IN_SERVICE, Customer C ACTIVE, a held Reservation R."
            - "Two FoodItems both taxable unit_cents=199; two FoodOrderLines qty=3 each on R."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "Food", per_game_cents: 0, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 31 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "food@x.com", full_name: "Food C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /food-items"
              payload: { name: "Nachos", unit_cents: 199, taxable: true }
              as: CenterManager
              captures: { fi1_id: $.data.id }
            - call: "POST /food-items"
              payload: { name: "Soda", unit_cents: 199, taxable: true }
              as: CenterManager
              captures: { fi2_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-07-06T12:00:00.000Z", end_at: "2026-07-06T13:00:00.000Z", bowler_count: 2, game_count: 0 }
              as: FrontDesk
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/hold"
              payload: {}
              as: FrontDesk
            - call: "POST /food-lines"
              payload: { reservation_id: "${res_id}", food_item_id: "${fi1_id}", quantity: 3 }
              as: FrontDesk
              captures: { line1_total: $.data.line_total_cents }
            - call: "POST /food-lines"
              payload: { reservation_id: "${res_id}", food_item_id: "${fi2_id}", quantity: 3 }
              as: FrontDesk
              captures: { line2_total: $.data.line_total_cents }
          trigger:
            - call: "GET /reservations/${res_id}"
              payload: {}
              as: FrontDesk
              captures: { food_sub: $.data.food_subtotal_cents }
          assert:
            - "FoodOrderLine(line1).line_total_cents == 646"
            - "FoodOrderLine(line2).line_total_cents == 646"
            - "Reservation.${res_id}.food_subtotal_cents == 1292"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_revision_loop_confirmed_to_held_to_confirmed
        grounds:
          - state_machines.Reservation.CONFIRMED_to_HELD
          - state_machines.Reservation.HELD_to_CONFIRMED
          - entities.Reservation.fields.status
        distinguishing_aspect: "Cycle on the Reservation entity: CONFIRMED -> HELD (revise) -> CONFIRMED returns the entity to a prior state, a non-linear loop distinct from any linear pipeline."
        test_recipe:
          setup:
            - "RateCard rc, Lane L IN_SERVICE, Customer C ACTIVE, Reservation R held then confirmed."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "Rev", per_game_cents: 500, per_hour_cents: 2000, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 41 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rev@x.com", full_name: "Rev C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-07-07T12:00:00.000Z", end_at: "2026-07-07T13:00:00.000Z", bowler_count: 2, game_count: 2 }
              as: FrontDesk
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/hold"
              payload: {}
              as: FrontDesk
              captures: { v_held: $.data.version }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_reservation_version: "${v_held}" }
              as: FrontDesk
              captures: { v_confirmed: $.data.version }
          trigger:
            - call: "POST /reservations/${res_id}/revise"
              payload: { expected_reservation_version: "${v_confirmed}", game_count: 4 }
              as: FrontDesk
              captures: { v_revised: $.data.version, status_after_revise: $.data.status }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_reservation_version: "${v_revised}" }
              as: FrontDesk
              captures: { status_reconfirmed: $.data.status }
          assert:
            - "Reservation.${res_id}.status == HELD immediately after revise"
            - "Reservation.${res_id}.status == CONFIRMED after the second confirm"

      - name: league_night_branch_played_forfeited_rained_out_divergent
        grounds:
          - state_machines.LeagueNight.SCHEDULED_to_PLAYED
          - state_machines.LeagueNight.SCHEDULED_to_FORFEITED
          - state_machines.LeagueNight.SCHEDULED_to_RAINED_OUT
          - entities.LeagueNight.fields.night_fee_cents
        distinguishing_aspect: "Branching fork on the LeagueNight entity: SCHEDULED forks to {PLAYED, FORFEITED, RAINED_OUT} with divergent side-effects — PLAYED/FORFEITED accrue weekly_fee_cents (5000), RAINED_OUT accrues 0."
        test_recipe:
          setup:
            - "RateCard rc, three IN_SERVICE lanes, League LG ACTIVE with 3 nights, clock past all night starts."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "Br", per_game_cents: 0, per_hour_cents: 0 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 51 }
              as: CenterManager
              captures: { la_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 52 }
              as: CenterManager
              captures: { lb_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 53 }
              as: CenterManager
              captures: { lc_id: $.data.id }
            - call: "POST /leagues"
              payload: { name: "Branch League", rate_card_id: "${rc_id}", season_night_count: 3, lanes_per_night: 1, weekly_fee_cents: 5000 }
              as: LeagueAdmin
              captures: { lg_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 1, start_at: "2026-07-02T18:00:00.000Z", end_at: "2026-07-02T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { np_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 2, start_at: "2026-07-09T18:00:00.000Z", end_at: "2026-07-09T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { nf_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 3, start_at: "2026-07-16T18:00:00.000Z", end_at: "2026-07-16T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { nr_id: $.data.id }
            - call: "POST /leagues/${lg_id}/activate"
              payload: {}
              as: LeagueAdmin
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-07-17T00:00:00.000Z" }
              as: FrontDesk
          trigger:
            - call: "POST /league-nights/${np_id}/mark-played"
              payload: {}
              as: LeagueAdmin
              captures: { played_fee: $.data.night_fee_cents }
            - call: "POST /league-nights/${nf_id}/forfeit"
              payload: {}
              as: LeagueAdmin
              captures: { forfeit_fee: $.data.night_fee_cents }
            - call: "POST /league-nights/${nr_id}/rain-out"
              payload: {}
              as: LeagueAdmin
              captures: { rain_fee: $.data.night_fee_cents }
          assert:
            - "LeagueNight.${np_id}.night_fee_cents == 5000"
            - "LeagueNight.${nf_id}.night_fee_cents == 5000"
            - "LeagueNight.${nr_id}.night_fee_cents == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_releases_window_promotes_waitlist_debits_deposit_depth3
        grounds:
          - state_machines.Reservation.HELD_to_CANCELLED
          - state_machines.Reservation.WAITLISTED_to_HELD
          - entities.Reservation.fields.held_deposit_cents
          - entities.Customer.fields.deposit_balance_cents
        distinguishing_aspect: "Depth-3 cascade from a CANCEL trigger: cancel R1 (A) -> frees the lane window (B) -> promotes the earliest WAITLISTED R2 to HELD (C) -> R2's deposit debit raises C2.deposit_balance_cents (D); each hop is caused by the previous."
        test_recipe:
          setup:
            - "RateCard rc (deposit 20%), Lane L IN_SERVICE. Customers C1 and C2 ACTIVE."
            - "R1 (C1) HELD on lane L for window W. R2 (C2) WAITLISTED on the same lane L same window W (contended)."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "Casc", per_game_cents: 1000, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 61 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1c@x.com", full_name: "C1" }
              as: FrontDesk
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2c@x.com", full_name: "C2" }
              as: FrontDesk
              captures: { c2_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c1_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-08-01T18:00:00.000Z", end_at: "2026-08-01T19:00:00.000Z", bowler_count: 2, game_count: 3 }
              as: FrontDesk
              captures: { r1_id: $.data.id }
            - call: "POST /reservations/${r1_id}/hold"
              payload: {}
              as: FrontDesk
            - call: "POST /reservations"
              payload: { customer_id: "${c2_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-08-01T18:00:00.000Z", end_at: "2026-08-01T19:00:00.000Z", bowler_count: 2, game_count: 3 }
              as: FrontDesk
              captures: { r2_id: $.data.id }
            - call: "POST /reservations/${r2_id}/waitlist"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {}
              as: FrontDesk
            - call: "GET /reservations/${r2_id}"
              payload: {}
              as: FrontDesk
              captures: { r2_status: $.data.status, r2_deposit: $.data.held_deposit_cents }
            - call: "GET /customers/${c2_id}"
              payload: {}
              as: FrontDesk
              captures: { c2_balance: $.data.deposit_balance_cents }
          assert:
            - "Reservation.${r2_id}.status == HELD after R1 cancel (promoted)"
            - "Reservation.${r2_id}.held_deposit_cents == 1200"
            - "Customer.${c2_id}.deposit_balance_cents == 1200"

      - name: suspend_customer_expires_holds_returns_rentals_depth3
        grounds:
          - state_machines.Customer.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.HELD_to_EXPIRED
          - entities.RentalItem.fields.available_count
          - entities.Customer.fields.deposit_balance_cents
        distinguishing_aspect: "Depth-3 cascade from the SUSPEND trigger (different origin than cancel): suspend C (A) -> C's HELD reservation R -> EXPIRED (B) -> R's EXPIRED transition both releases R's deposit lowering C.deposit_balance_cents (C) and returns R's OPEN rental line restoring RentalItem.available_count (C')."
        test_recipe:
          setup:
            - "RateCard rc (deposit 20%), Lane L IN_SERVICE, RentalItem SHOES total_count=4. Customer C ACTIVE."
            - "Reservation R (C) HELD on L; one OPEN RentalLine qty=2 of the SHOES against R."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "Susp", per_game_cents: 1000, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 71 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /rental-items"
              payload: { kind: "SHOES", label: "Mens 10", unit_price_cents: 300, total_count: 4 }
              as: CenterManager
              captures: { ri_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "susp@x.com", full_name: "Susp C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /reservations"
