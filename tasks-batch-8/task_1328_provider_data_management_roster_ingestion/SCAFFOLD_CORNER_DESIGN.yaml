          setup: ["provider with A1 [2026-01-01, 2026-04-01) and A2 [2026-04-01, +inf)"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_cl3: $.data.id }
            - call: "POST /pdm/providers/${p_cl3}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V1", effective_date: "2026-01-01", term_date: "2026-04-01" }
              as: DataSteward
            - call: "POST /pdm/providers/${p_cl3}/attributes"
              payload: { attribute_group: "CONTACT", attribute_key: "phone", attribute_value: "V2", effective_date: "2026-04-01" }
              as: DataSteward
          trigger:
            - call: "GET /pdm/providers/${p_cl3}/attributes"
              payload: { as_of_date: "2026-03-01" }
              as: DataSteward
          assert:
            - "Only the [2026-01-01, 2026-04-01) interval is returned for as_of_date=2026-03-01"

      - name: pagination_filter_combination
        claim_type: pagination_with_filtering
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /pdm/providers?lifecycle_status=ACTIVE&limit=1&offset=1 returns exactly one provider, has_more=true when more ACTIVES exist, and the filter excludes SUSPENDED/TERMINATED."
        test_recipe:
          setup: ["3 ACTIVE providers, 1 SUSPENDED"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_cl4a: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567894", tin: "123456789", location_key: "LOC2" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567895", tin: "123456789", location_key: "LOC3" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567896", tin: "123456789", location_key: "LOC4" }
              as: DataSteward
              captures: { p_cl4d: $.data.id }
            - call: "POST /pdm/providers/${p_cl4d}/suspend"
              payload: {}
              as: DataSteward
          trigger:
            - call: "GET /pdm/providers"
              payload: { lifecycle_status: "ACTIVE", limit: 1, offset: 1 }
              as: DataSteward
          assert:
            - "Exactly 1 provider returned; total_count == 3 (SUSPENDED excluded); has_more == true"

      - name: scheduled_sweep_expires_only_due_requests
        claim_type: scheduled_actions
        grounds: [state_machines.AttestationRequest.transitions, calculations.attestation_escalation]
        distinguishing_aspect: "Sweep expires exactly those SENT requests with logical clock >= due_at; a SENT request whose due_at is still in the future remains SENT."
        test_recipe:
          setup: ["two SENT requests: R1 due 2026-08-06, R2 due 2026-08-20; clock at 2026-08-10"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/providers"
              payload: { npi: "1234567893", tin: "123456789", location_key: "LOC1" }
              as: DataSteward
              captures: { p_cl5a: $.data.id }
            - call: "POST /pdm/providers"
              payload: { npi: "1234567894", tin: "123456789", location_key: "LOC2" }
              as: DataSteward
              captures: { p_cl5b: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "CL5A", window_days: 5 }
              as: DataSteward
              captures: { camp_cl5a: $.data.id }
            - call: "POST /pdm/attestation-campaigns"
              payload: { name: "CL5B", window_days: 15 }
              as: DataSteward
              captures: { camp_cl5b: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_cl5a}/open"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_cl5b}/open"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-campaigns/${camp_cl5a}/attestation-requests"
              payload: { provider_id: "${p_cl5a}" }
              as: DataSteward
              captures: { req_cl5a: $.data.id }
            - call: "POST /pdm/attestation-campaigns/${camp_cl5b}/attestation-requests"
              payload: { provider_id: "${p_cl5b}" }
              as: DataSteward
              captures: { req_cl5b: $.data.id }
            - call: "POST /pdm/attestation-requests/${req_cl5a}/send"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/attestation-requests/${req_cl5b}/send"
              payload: {}
              as: DataSteward
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DataSteward
          trigger:
            - call: "POST /pdm/attestation-requests/sweep"
              payload: {}
              as: DataSteward
              captures: { sweep_count: $.data.expired_count }
          assert:
            - "expired_count == 1 (only R1 due)"
            - "R2.status == SENT"

  # ===================================================================
  # Section: consistency_model — immediate consistency.
  # ===================================================================
  - section: consistency_model
    instances:
      - name: commit_effects_visible_in_same_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "After a successful commit, a subsequent GET on the provider reflects the new attributes and refreshed quality score without any delay."
        test_recipe:
          setup: ["committed file touched provider P"]
          setup_api_calls:
            - call: "POST /pdm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DataSteward
            - call: "POST /pdm/roster-sources"
              payload: { source_code: "CM1", display_name: "CM1", format: "CSV", precedence_rank: 1, freshness_sla_days: 90 }
              as: DataSteward
              captures: { src_cm1: $.data.id }
            - call: "POST /pdm/roster-files"
              payload: { roster_source_id: "${src_cm1}", external_file_ref: "cm1f", declared_row_count: 0, checksum: "cm1c" }
              as: IntakeOperator
              as_user_id: "op_intake_1"
              captures: { f_cm1: $.data.id }
            - call: "POST /pdm/roster-files/${f_cm1}/parse"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${f_cm1}/normalize"
              payload: {}
              as: IntakeOperator
            - call: "POST /pdm/roster-files/${f_cm1}/validate"
              payload: {}
              as: IntakeOperator
            - call: "GET /pdm/roster-files/${f_cm1}"
              payload: {}
              as: IntakeOperator
              captures: { f_cm1_v: $.data.version }
          trigger:
            - call: "POST /pdm/roster-files/${f_cm1}/commit"
              payload: { expected_roster_file_version: "${f_cm1_v}" }
              as: IntakeOperator
              as_user_id: "op_intake_2"
              captures: { cm1_status: $.data.status, cm1_committed: $.data.committed_row_count }
          assert:
            - "Commit response itself carries status=COMMITTED and finalized committed_row_count (no async lag)"
