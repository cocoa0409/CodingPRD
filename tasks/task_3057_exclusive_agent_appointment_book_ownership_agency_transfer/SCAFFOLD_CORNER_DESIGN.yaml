          participation_posture: FROZEN
        as: AgencyPrincipal
        as_user_id: ${cali_id}
      assert:
      - MarketingCampaign.${c}.marketing_allowance_cents == 9000 and expected_leads == 12
      - MarketingCampaign.${c}.participation_posture == OPEN (the FROZEN input is ignored)
  - name: agency_performance_computed_read_matches_calculations
    claim_type: Computed read
    grounds:
    - endpoints.GET_/agency-network/agencies/{id}/performance
    - calculations.agency_performance_measurement
    - calculations.agency_valuation
    distinguishing_aspect: "The performance computed-read exposes the same derived values the ops run computes: with 0.00 paid claims and positive growth it reports ON_TRACK and a valuation at the 2,000,000.00 floor."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE, 0.00 paid claims, 150,000.00 trailing commission."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-116
          name: CA-116
          region_code: W
          market_need_score: 60
        as: AppointingExecutive
        captures:
          cali_id: $.data.id
          cali_v0: $.data.version
      - call: POST /agency-network/agencies/${cali_id}/activate
        payload:
          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/agencies/${cali_id}/book-settlement
        payload:
          annualized_commission_cents: 150000
        as: PlatformAdmin
      trigger:
      - call: GET /agency-network/agencies/${cali_id}/performance
        payload: {}
        as: AppointingExecutive
      assert:
      - the response status is 200
      - response growth_new_pct is positive and performance_status == ON_TRACK
      - response agency_valuation_cents == 2000000.00 (the floor governs because 1000000 + 150000*1.5 == 1225000.00 < 2000000.00)
  - name: run_ops_second_call_recomputes_without_drift
    claim_type: Idempotency
    grounds:
    - endpoints.POST_/agency-network/agencies/{id}/run_ops
    - calculations.recompute_agency
    distinguishing_aspect: "Running the ops sweep twice recomputes the same derived values from source: the second run leaves exposure and paid-claims totals unchanged and only advances ops_run_index."
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with one OPEN policy and one settled claim."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
        payload:
          to_iso8601: "2026-09-01T00:00:00Z"
        as: PlatformAdmin
      - call: POST /agency-network/agencies
        payload:
          agency_code: CA-117
          name: CA-117
