            - call: "POST /accounts/${acct_id}/close"
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_ACCOUNT_HAS_ACTIVE_SUBS"
