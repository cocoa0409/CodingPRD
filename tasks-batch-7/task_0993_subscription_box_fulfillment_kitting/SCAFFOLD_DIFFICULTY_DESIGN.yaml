            - call: "POST /return-cases/${tc1_rc}/resolve"
              as: CustomerService
              captures: { tc1_res: $.data.resolution_applied, tc1_repl: $.data.replacement_shipment_id }
            - call: "GET /shipments/${tc1_repl}"
              as: WarehouseOps
              captures: { tc1_repl_ful: $.data.fulfill_status, tc1_repl_flag: $.data.is_replacement, tc1_repl_run: $.data.run_id }
            - call: "GET /components/${tc1_cp}"
              as: WarehouseOps
              captures: { tc1_post_onhand: $.data.on_hand_units, tc1_post_stock: $.data.stock_status }
            - call: "GET /components/${tc1_cp}/inventory-events"
              payload: { event_type: "COMMIT" }
              as: WarehouseOps
          assert:
            - "pre-resolve Component on_hand_units == 96 and stock_status == OK (${tc1_pre_onhand} / ${tc1_pre_stock})"
            - "ReturnCase.${tc1_rc}.resolution_applied == REPLACED and replacement_shipment_id is set"
            - "replacement Shipment.${tc1_repl}: fulfill_status == STAGED, is_replacement == true, run_id == ${tc1_rn}"
            - "Component.${tc1_cp}.on_hand_units == 94 (replacement COMMIT of 2 units) and stock_status == LOW (94 <= reorder_point 95)"
            - "COMMIT event ledger for CMP-TC1 ends with a -2 event tagged to run ${tc1_rn}"

      - name: wave_cancel_cascade_to_statement_postage
        grounds:
          - state_machines.ShippingWave.MANIFESTED_to_CANCELLED
          - state_machines.Shipment.MANIFESTED_to_STAGED
          - calculations.statement_net_amount
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (wave cancel, not return
          resolve): ShippingWave CANCELLED -> each MANIFESTED Shipment reverts
          to STAGED with label PURCHASED -> VOIDED -> the period
          BillingStatement's provisional postage_cents is recomputed from 970
          back to 0 because only PURCHASED labels count.
        test_recipe:
          setup:
            - "client TC2 wallet 100000; component CMP-TC2 100 units (BOM qty 1); plan PL-TC2 ACTIVE price 2000 weight 1200"
            - "2 ACTIVE subscribers zone 3; run 2026-05 LOCKED (statement auto-created PROVISIONAL) -> KITTING -> KITTED actual 2 (provisional box_charge 4000)"
            - "wave USPS GROUND 2026-05-10; both shipments assigned and manifested (postage 485 each; statement postage_cents == 970)"
