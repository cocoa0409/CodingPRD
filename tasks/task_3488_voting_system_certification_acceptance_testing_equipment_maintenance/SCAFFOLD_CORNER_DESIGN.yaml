              payload: { to_official_id: "${off1_id}", seal_number: "SEAL-S1", seal_intact: true }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /evote/equipment-units/${u_id}/custody-transfers"
              payload: { to_official_id: "${off1_id}", seal_number: "SEAL-S2", seal_intact: true }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
              captures: { err3: $.data.error_id }
          assert:
