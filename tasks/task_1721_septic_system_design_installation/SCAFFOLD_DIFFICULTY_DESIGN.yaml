# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1721_septic_system_design_installation
# Nine Difficulty Rules x >= 2 instances each (18 instances total).
# All numeric assertions were pre-computed by executing the §1.3 formulas
# against the pinned setup inputs (book flow 150 gpd/bed, reduced 120,
# rates SAND 1.20 / LOAM 0.80 / CLAY_LOAM 0.50 / CLAY 0.30, HWT x1.5,
# shallow x1.25 under 24in, single terminal ceil; tank catalog step-up;
# proration round-once-at-contract-level; permit validity 6 periods
# inclusive; science max age 24 strict->; LAPSE_GRACE 2).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: book_vs_reduced_flow_on_system_design_sizing
        grounds:
          - calculations.design_daily_flow_gpd
          - calculations.required_absorption_area_sqft
          - calculations.tank_capacity_gal
          - entities.SystemDesign.fields.design_daily_flow_gpd
          - entities.SystemDesign.fields.required_absorption_area_sqft
        distinguishing_aspect: |
          Entity domain = SystemDesign sizing. Two valid flow variants (book
          150 gpd/bedroom vs AREA_REDUCTION-reduced 120 gpd/bedroom) produce
          different required_absorption_area_sqft for identical bedroom_count
          and soil (563 vs 450) while tank_capacity_gal stays at the book
          value (1000) in both — the leg asymmetry is the pinned distinction.
        test_recipe:
          setup:
            - "Company with county WH; staff: designer D1 (lic DSGN-1), officer H1 (badge HO-1), manager M1, scientist SS1 (lic SS-1)"
            - "Customer CU and Site S (parcel P-1, county WH, high_water_table=false) at period 0"
            - "Soil evaluation E1 (LOAM, limiting layer 36in) and perc test PT1 recorded at period 0"
            - "Design DA created: 3 bedrooms, GRAVITY, pins E1/PT1 — no variance exists (book variant)"
            - "Design DB created: 3 bedrooms, GRAVITY, pins E1/PT1, then an AREA_REDUCTION VarianceRequest on DB APPROVED by H1, then DB re-submitted to trigger re-derivation (reduced variant)"
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/system-designers"
              payload: { full_name: "Dana Designer", license_number: "DSGN-1" }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/health-officers"
              payload: { full_name: "Harriet Officer", badge_number: "HO-1" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/soil-scientists"
              payload: { full_name: "Sam Scientist", license_number: "SS-1" }
              as: PlatformAdmin
              captures: { ss1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { s: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/soil-evaluations"
              payload: { evaluator_id: "${ss1}", soil_class: "LOAM", limiting_layer_inches: 36 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { e1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/percolation-tests"
              payload: { evaluator_id: "${ss1}", minutes_per_inch: 12.0, test_pit_count: 4 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { pt1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs"
              payload: { designer_id: "${d1}", soil_evaluation_id: "${e1}", percolation_test_id: "${pt1}", bedroom_count: 3, system_type: "GRAVITY" }
              as: SystemDesigner
              as_user_id: "${d1}"
