              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspection-stations/${st_id}/hours"
              payload: { opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-10-01T00:00:00Z", staffing_level: "SINGLE" }
              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /inspectors"
              payload: { full_name: "Ben Rinse", home_station_id: "${st_id}", decon_endorsement: true }
              as: ProgramAdmin
              captures: { insp_b: $.data.id }
            - call: "POST /inspectors/${insp_b}/training-records"
              payload: { module_code: "AIS-DECON-200", hours: 40, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-6001", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 19, last_water_body_id: "${wb_id}" }
              as: ProgramAdmin
              captures: { wc_a: $.data.id, wc_a_version: $.data.version }
            - call: "POST /watercraft"
              payload: { registration_number: "MT-6002", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 19, last_water_body_id: "${wb_id}" }
              as: ProgramAdmin
              captures: { wc_b: $.data.id, wc_b_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_a}", arrived_at: "2026-08-05T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
