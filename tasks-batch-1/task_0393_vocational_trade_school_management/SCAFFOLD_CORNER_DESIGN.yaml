# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Vocational / Trade School Management — Expert
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_all_fields_201
        claim_type: Creation
        grounds:
          - entities.Program
          - "endpoints[POST /v1/programs]"
        distinguishing_aspect: "POST /v1/programs with all required fields returns 201 and echoes name/credential_type/required_clock_hours plus system status=DRAFT, id, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/programs"
              payload: { name: "HVAC", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { pid: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Program.status == DRAFT"
            - "Program.version == 1"
            - "Program.required_clock_hours == 1000"

      - name: get_program_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Program
          - "validations[priority=3]"
        distinguishing_aspect: "GET /v1/programs/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_program_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Program.fields.required_clock_hours
          - "validations[priority=4]"
        distinguishing_aspect: "POST /v1/programs omitting required_clock_hours returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/programs"
              payload: { name: "HVAC", credential_type: "DIPLOMA", required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_program_invalid_enum_credential_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.Program.fields.credential_type
          - "validations[priority=4]"
        distinguishing_aspect: "POST /v1/programs with credential_type='MASTERS' (not in {DIPLOMA,CERTIFICATE,ASSOCIATE}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/programs"
              payload: { name: "HVAC", credential_type: "MASTERS", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_program_default_sap_thresholds_applied
        claim_type: Defaults
        grounds:
          - entities.Program.fields.sap_warning_min_pace_pct
          - entities.Program.fields.sap_probation_min_pace_pct
        distinguishing_aspect: "Omitting sap_warning_min_pace_pct/sap_probation_min_pace_pct/licensure_min_attendance_pct applies defaults 0.667/0.5/0.9."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/programs"
              payload: { name: "HVAC", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { w: $.data.sap_warning_min_pace_pct, p: $.data.sap_probation_min_pace_pct, l: $.data.licensure_min_attendance_pct }
          assert:
            - "Program.sap_warning_min_pace_pct == 0.667"
            - "Program.sap_probation_min_pace_pct == 0.5"
            - "Program.licensure_min_attendance_pct == 0.9"

      - name: system_fields_minted_on_student_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Student
        distinguishing_aspect: "Client-supplied id/created_at/version on POST /v1/students are ignored; server mints id, created_at, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/students"
              payload: { full_name: "Aa Bb", email: "aabb@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { sid: $.data.id, ver: $.data.version }
          assert:
            - "Student.version == 1"
            - "Student.id is a server-minted UUID (not client-supplied)"

      - name: duplicate_student_email_returns_409
        claim_type: Type Constraints
        grounds:
          - entities.Student.fields.email
          - "validations[priority=19]"
        distinguishing_aspect: "Two students with the same email (case-insensitive) -> second returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["One student with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /v1/students"
              payload: { full_name: "First", email: "dup@x.com", hs_diploma_verified: true }
              as: Registrar
          trigger:
            - call: "POST /v1/students"
              payload: { full_name: "Second", email: "DUP@x.com", hs_diploma_verified: false }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_DUPLICATE_KEY"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cohort_create_starts_in_forming
        claim_type: Initial State
        grounds:
          - state_machines.Cohort
          - entities.Cohort.fields.status
        distinguishing_aspect: "A newly created cohort under an OPEN program starts in status FORMING with enrolled_count 0."
        test_recipe:
          setup: ["Program OPEN."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /v1/programs/${pid}/open"
              payload: {}
              as: SystemAdmin
          trigger:
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { st: $.data.status, ec: $.data.enrolled_count }
          assert:
            - "Cohort.status == FORMING"
            - "Cohort.enrolled_count == 0"

      - name: cohort_create_under_draft_program_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "endpoints[POST /v1/cohorts]"
          - "errors[ERR_PROGRAM_NOT_OPEN]"
        distinguishing_aspect: "Creating a cohort under a DRAFT (not OPEN) program returns ERR_PROGRAM_NOT_OPEN (409)."
        test_recipe:
          setup: ["Program in DRAFT (never opened)."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PROGRAM_NOT_OPEN"

      - name: enroll_twice_second_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.EnrollmentAgreement.DRAFTED_to_ENROLLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Enrolling an already-ENROLLED agreement returns ERR_INVALID_STATE (409); the second enroll does not double-increment enrolled_count."
        test_recipe:
          setup: ["Agreement ENROLLED in a RUNNING cohort."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /v1/programs/${pid}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /v1/cohorts/${cid}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "S", email: "s1@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${sid}", cohort_id: "${cid}", contract_tuition_cents: 500000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { aid: $.data.id }
            - call: "POST /v1/enrollment-agreements/${aid}/enroll"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /v1/enrollment-agreements/${aid}/enroll"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: terminal_cancelled_agreement_rejects_enroll
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.EnrollmentAgreement
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A CANCELLED (terminal) agreement rejects any further transition (enroll) with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Agreement DRAFTED then CANCELLED."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /v1/programs/${pid}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /v1/cohorts/${cid}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "S", email: "s2@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${sid}", cohort_id: "${cid}", contract_tuition_cents: 500000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { aid: $.data.id }
            - call: "POST /v1/enrollment-agreements/${aid}/cancel"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /v1/enrollment-agreements/${aid}/enroll"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: enroll_admission_prereq_unmet_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EnrollmentAgreement.DRAFTED_to_ENROLLED
          - "validations[priority=8]"
          - "errors[ERR_ADMISSION_PREREQ_UNMET]"
        distinguishing_aspect: "Enrolling a student with hs_diploma_verified=false returns ERR_ADMISSION_PREREQ_UNMET (422)."
        test_recipe:
          setup: ["Agreement DRAFTED for a student with hs_diploma_verified=false."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /v1/programs/${pid}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /v1/cohorts/${cid}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "S", email: "s3@x.com", hs_diploma_verified: false }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${sid}", cohort_id: "${cid}", contract_tuition_cents: 500000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /v1/enrollment-agreements/${aid}/enroll"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_ADMISSION_PREREQ_UNMET"

      - name: enroll_into_full_cohort_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EnrollmentAgreement.DRAFTED_to_ENROLLED
          - "validations[priority=12]"
          - "errors[ERR_COHORT_FULL]"
        distinguishing_aspect: "Enrolling a second agreement into a seat_capacity=1 cohort already at enrolled_count 1 returns ERR_COHORT_FULL (409)."
        test_recipe:
          setup: ["Cohort seat_capacity=1, RUNNING, one ENROLLED agreement; a second DRAFTED agreement awaits."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 900000 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /v1/programs/${pid}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 1 }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /v1/cohorts/${cid}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "S1", email: "f1@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { s1: $.data.id }
            - call: "POST /v1/students"
              payload: { full_name: "S2", email: "f2@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { s2: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${s1}", cohort_id: "${cid}", contract_tuition_cents: 500000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { a1: $.data.id }
            - call: "POST /v1/enrollment-agreements/${a1}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${s2}", cohort_id: "${cid}", contract_tuition_cents: 500000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /v1/enrollment-agreements/${a2}/enroll"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_COHORT_FULL"

      - name: graduate_clock_hours_unmet_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.EnrollmentAgreement.ENROLLED_to_GRADUATED
          - "validations[priority=16]"
          - "errors[ERR_CLOCK_HOURS_UNMET]"
        distinguishing_aspect: "Graduating an ENROLLED agreement (GOOD standing, zero balance) with clock_hours_completed below required_clock_hours returns ERR_CLOCK_HOURS_UNMET (422)."
        test_recipe:
          setup: ["Agreement ENROLLED with contract_tuition_cents 0 (no balance), no attendance hours."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 0 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /v1/programs/${pid}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /v1/cohorts/${cid}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "S", email: "g1@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${sid}", cohort_id: "${cid}", contract_tuition_cents: 0, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { aid: $.data.id }
            - call: "POST /v1/enrollment-agreements/${aid}/enroll"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /v1/enrollment-agreements/${aid}/graduate"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_CLOCK_HOURS_UNMET"

      - name: excuse_attendance_keeps_denominator_drops_completed
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AttendanceEntry.POSTED_to_EXCUSED
          - calculations.clock_hour_rollup
          - calculations.attendance_pct
        distinguishing_aspect: "Excusing a POSTED THEORY entry (8 attended / 10 scheduled) zeroes attended_hours but keeps scheduled in the denominator: attendance_pct drops from 0.8 to 0.0."
        test_recipe:
          setup: ["Agreement ENROLLED with one POSTED THEORY entry scheduled 10 attended 8 -> attendance_pct 0.8."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 0 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /v1/programs/${pid}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /v1/cohorts/${cid}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "S", email: "ex1@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${sid}", cohort_id: "${cid}", contract_tuition_cents: 0, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { aid: $.data.id }
            - call: "POST /v1/enrollment-agreements/${aid}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${aid}", term_index: 1, kind: "THEORY", scheduled_hours: 10, attended_hours: 8 }
              as: AcademicAdvisor
              captures: { ent: $.data.id }
          trigger:
            - call: "POST /v1/attendance-entries/${ent}/excuse"
              payload: {}
              as: AcademicAdvisor
            - call: "GET /v1/enrollment-agreements/${aid}"
              payload: {}
              as: AcademicAdvisor
              captures: { att: $.data.attendance_pct, clk: $.data.clock_hours_completed }
          assert:
            - "EnrollmentAgreement.clock_hours_completed == 0"
            - "EnrollmentAgreement.scheduled_hours_to_date == 10"
            - "EnrollmentAgreement.attendance_pct == 0.0"

      - name: void_attendance_excludes_from_denominator
        claim_type: Side Effect Execution
        grounds:
          - state_machines.AttendanceEntry.POSTED_to_VOIDED
          - calculations.attendance_pct
        distinguishing_aspect: "Voiding the only POSTED entry (8/10) removes it from both completed and denominator; with no remaining scheduled hours attendance_pct becomes 1.0 (empty-denominator rule)."
        test_recipe:
          setup: ["Agreement ENROLLED with one POSTED THEORY entry scheduled 10 attended 8."]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "P", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 0 }
              as: SystemAdmin
              captures: { pid: $.data.id }
            - call: "POST /v1/programs/${pid}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${pid}", code: "C1", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /v1/cohorts/${cid}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "S", email: "vd1@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${sid}", cohort_id: "${cid}", contract_tuition_cents: 0, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { aid: $.data.id }
            - call: "POST /v1/enrollment-agreements/${aid}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${aid}", term_index: 1, kind: "THEORY", scheduled_hours: 10, attended_hours: 8 }
              as: AcademicAdvisor
              captures: { ent: $.data.id }
          trigger:
            - call: "POST /v1/attendance-entries/${ent}/void"
              payload: {}
              as: AcademicAdvisor
            - call: "GET /v1/enrollment-agreements/${aid}"
              payload: {}
              as: AcademicAdvisor
              captures: { att: $.data.attendance_pct, sch: $.data.scheduled_hours_to_date }
          assert:
            - "EnrollmentAgreement.scheduled_hours_to_date == 0"
            - "EnrollmentAgreement.attendance_pct == 1.0"

      - name: externship_complete_bubbles_externship_hours_via_system_entry
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ExternshipAssignment.IN_PROGRESS_to_COMPLETED
          - calculations.clock_hour_rollup
          - entities.ExternshipAssignment.fields.verified_hours
