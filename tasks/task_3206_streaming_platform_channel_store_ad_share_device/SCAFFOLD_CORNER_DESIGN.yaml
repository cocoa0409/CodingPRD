# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3206_streaming_platform_channel_store_ad_share_device
# Breadth probe over the §1.1-§1.7 surface. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# The clock defaults to 2026-09-01T00:00:00Z; instances that need another
# position set it explicitly.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: publisher_create_applies_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.Publisher
          - endpoints.POST_/publishers
        distinguishing_aspect: "A publisher created with only the three required inputs returns 201 with standing GOOD, revenue_tier STANDARD, outstanding_balance_cents 0, version 1, and server-minted id/created_at/updated_at — none of the system fields are client-settable."
        test_recipe:
          setup:
            - "Empty database, clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /publishers"
              payload: { legal_name: "Default Pub", default_ad_share_bps: 6500, billing_model: "NET_OF_FEES" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
          assert:
            - "response status is 201 and response_type is object"
            - "Publisher.${pub}.standing == GOOD and revenue_tier == STANDARD and outstanding_balance_cents == 0"
            - "Publisher.${pub}.default_ad_share_bps == 6500 and billing_model == NET_OF_FEES"
            - "Publisher.${pub}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: viewer_create_defaults_ad_consent_when_omitted
        claim_type: defaults
        grounds:
          - entities.ViewerAccount.fields.ad_consent
          - endpoints.POST_/viewer-accounts
        distinguishing_aspect: "Omitting ad_consent and data_retention_opt_out yields NON_PERSONALIZED and false; status starts ACTIVE."
        test_recipe:
          setup:
            - "Empty database, default clock."
          setup_api_calls: []
          trigger:
            - call: "POST /viewer-accounts"
              payload: { email: "default@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
          assert:
            - "ViewerAccount.${vw}.ad_consent == NON_PERSONALIZED"
            - "ViewerAccount.${vw}.data_retention_opt_out == false"
            - "ViewerAccount.${vw}.status == ACTIVE"

      - name: channel_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/channels/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated channel id yields 404 ERR_NOT_FOUND, not a 400 and not an empty object."
        test_recipe:
          setup:
            - "Empty database, default clock."
          setup_api_calls: []
          trigger:
            - call: "GET /channels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404 and response_type is error"
            - "err == ERR_NOT_FOUND"

      - name: device_unit_computed_subsidy_and_base_os_at_creation
        claim_type: computed_fields
        grounds:
          - entities.DeviceUnit.fields.subsidy_cents
          - calculations.device_subsidy_recovery
        distinguishing_aspect: "subsidy_cents is computed as max(0, cost - price) at creation (20000 - 9999 = 10001), os_version_tag starts at BASE, recovered/written_off start at 0, and status is MANUFACTURED."
        test_recipe:
          setup:
            - "Manufacturer M with CERTIFIED model MD (MONETIZATION) — lab window finished before certify."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Comp TV", royalty_per_device_cents: 300 }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /device-models"
              payload: { manufacturer_id: "${mfr}", model_code: "C-1", recovery_policy: "MONETIZATION" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { mod: $.data.id }
            - call: "POST /device-models/${mod}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /device-models/${mod}/certify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /device-units"
              payload: { device_model_id: "${mod}", serial_number: "C-1-001", hardware_cost_cents: 20000, sale_price_cents: 9999 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { unit: $.data.id }
          assert:
            - "DeviceUnit.${unit}.subsidy_cents == 10001"
            - "DeviceUnit.${unit}.subsidy_recovered_cents == 0 and subsidy_written_off_cents == 0 and subsidy_outstanding_cents == 10001"
            - "DeviceUnit.${unit}.os_version_tag == BASE and status == MANUFACTURED and viewer_id is null"

      - name: campaigns_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/campaigns
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three DRAFT campaigns for one publisher, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; the status=DRAFT filter returns all 3."
        test_recipe:
          setup:
            - "Publisher P with PUBLISHED channel C and three DRAFT campaigns."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "List Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "List Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 1000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 2000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 3000, targeting_mode: "PERSONALIZED" }
              as: Publisher
              as_user_id: "${pub}"
          trigger:
            - call: "GET /campaigns"
              payload: { publisher_id: "${pub}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /campaigns with publisher_id=${pub}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /campaigns with publisher_id=${pub}&status=DRAFT returns 3 rows"
            - "GET /campaigns with channel_id=${ch} returns the same 3 rows (both filters agree)"

      - name: channel_version_superseded_when_new_version_submitted
        claim_type: computed_fields
        grounds:
          - state_machines.ChannelVersion.SUBMITTED_to_SUPERSEDED
          - endpoints.POST_/channels/{id}/versions
        distinguishing_aspect: "Submitting version 1.0.1 while 1.0.0 awaits review flips 1.0.0 to SUPERSEDED, leaves the channel in SUBMITTED, and bumps Channel.version — verified via the reverse-reachability list GET /channels/{id}/versions."
        test_recipe:
          setup:
            - "Publisher P with channel C (DRAFT)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Sup Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Sup Channel", category: "KIDS", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v0: $.data.version }
          trigger:
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: false, trick_play: false }, expected_channel_version: "${ch_v0}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { v1: $.data.id }
            - call: "GET /channels/${ch}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch_v1: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.1", technical_checklist: { deep_linking: true, drm: true, trick_play: false }, expected_channel_version: "${ch_v1}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { v2: $.data.id }
          assert:
            - "ChannelVersion.${v1}.review_status == SUPERSEDED"
            - "ChannelVersion.${v2}.review_status == SUBMITTED"
            - "Channel.${ch}.status == SUBMITTED (self-loop) and Channel.${ch}.version == ${ch_v1} + 1"
            - "GET /channels/${ch}/versions returns 2 rows (the FK reverse-reachability channel)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: channel_publish_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Channel
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "POST /channels/{id}/publish is only legal from CERTIFIED; from DRAFT it fails with 409 ERR_INVALID_STATE and the channel stays DRAFT."
        test_recipe:
          setup:
            - "Publisher P with channel C in DRAFT (no version submitted)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Inv Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Inv Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id }
          trigger:
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE with http 409"
            - "Channel.${ch}.status == DRAFT (unchanged)"

      - name: subscription_second_cancel_hits_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Subscription
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELLED is terminal: the first cancel succeeds and revokes entitlement; the identical second cancel fails with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Viewer V with ACTIVE subscription S on a PUBLISHED channel."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "TL Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "TL Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "tl@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 1200 }
              as: Viewer
              as_user_id: "${vw}"
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub}/cancel"
              payload: {}
              as: Viewer
              as_user_id: "${vw}"
            - call: "POST /subscriptions/${sub}/cancel"
              payload: {}
              as: Viewer
              as_user_id: "${vw}"
              captures: { err: $.data.error_id }
          assert:
            - "First cancel: Subscription.${sub}.billing_status == CANCELLED and entitlement_status == REVOKED"
            - "err == ERR_INVALID_STATE with http 409 on the second cancel"

      - name: dispute_appeal_cycle_reopens_evidence_and_redecides
        claim_type: valid_transition
        grounds:
          - state_machines.Dispute
        distinguishing_aspect: "The appeal loop FILED -> TRIAGE -> EVIDENCE -> DECIDED -> APPEALED -> EVIDENCE -> DECIDED is legal: an OVERTURNED channel-removal dispute reinstates the channel to PUBLISHED, and the second decision (UPHELD) leaves it REMOVED."
        test_recipe:
          setup:
            - "Publisher P with channel C carried to PUBLISHED then REMOVED; dispute D filed on the removal."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Loop Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Loop Channel", category: "NEWS", content_rating: "PG" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channels/${ch}/remove"
              payload: { reason: "policy violation strike 3" }
              as: PlatformAdmin
            - call: "POST /disputes"
              payload: { publisher_id: "${pub}", subject_type: "CHANNEL_REMOVAL", channel_id: "${ch}", reason: "removal contested" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { dsp: $.data.id }
          trigger:
            - call: "POST /disputes/${dsp}/triage"
              payload: {}
              as: PlatformAdmin
            - call: "POST /disputes/${dsp}/request-evidence"
              payload: {}
              as: PlatformAdmin
            - call: "POST /disputes/${dsp}/decide"
              payload: { decision: "OVERTURNED" }
              as: PlatformAdmin
            - call: "POST /disputes/${dsp}/appeal"
              payload: { reason: "platform appeals" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /disputes/${dsp}/request-evidence"
              payload: {}
              as: PlatformAdmin
            - call: "POST /disputes/${dsp}/decide"
              payload: { decision: "UPHELD" }
              as: PlatformAdmin
          assert:
            - "After OVERTURNED: Channel.${ch}.status == PUBLISHED (compensating reinstatement) and policy_hold == false"
            - "Appeal is legal from DECIDED: Dispute.${dsp}.status moved DECIDED -> APPEALED -> EVIDENCE"
            - "After the second decide UPHELD: Channel.${ch}.status == REMOVED and Dispute.${dsp}.decision == UPHELD"

      - name: campaign_auto_completes_at_exact_budget_boundary
        claim_type: side_effect_execution
        grounds:
          - state_machines.AdCampaign.ACTIVE_to_COMPLETED
          - calculations.campaign_impression_cost
        distinguishing_aspect: "Spending to exactly budget_cents (10000 via 10000 impressions at cpm 1000) is allowed and flips the campaign ACTIVE -> COMPLETED in the same request; any further impression fails with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Publisher P, channel PUBLISHED, campaign K ACTIVE with budget 10000 and flight covering the default clock."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Auto Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Auto Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 10000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k: $.data.id }
            - call: "POST /campaigns/${k}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${k}/start"
              payload: {}
              as: AdOps
          trigger:
            - call: "POST /campaigns/${k}/impressions"
              payload: { impression_count: 10000, cpm_cents: 1000 }
              as: AdOps
            - call: "POST /campaigns/${k}/impressions"
              payload: { impression_count: 1, cpm_cents: 1000 }
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "AdCampaign.${k}.spent_cents == 10000 and impressions_delivered == 10000"
            - "AdCampaign.${k}.status == COMPLETED (auto-transition at spent == budget)"
            - "err == ERR_INVALID_STATE with http 409 (COMPLETED is terminal for impressions)"

      - name: device_deactivate_writes_off_outstanding_subsidy
        claim_type: side_effect_execution
        grounds:
          - state_machines.DeviceUnit.ACTIVATED_to_DEACTIVATED
          - calculations.device_subsidy_recovery
        distinguishing_aspect: "Deactivation is the compensating action for subsidy recovery: with subsidy 10001 and 416 recovered, deactivate moves the 9585 remainder to written_off, keeps recovered intact, and preserves subsidy == recovered + written_off + outstanding (10001 == 416 + 9585 + 0)."
        test_recipe:
          setup:
            - "Manufacturer M, STRAIGHT_LINE model MD CERTIFIED, unit U (cost 20000, price 9999 -> subsidy 10001) ACTIVATED by viewer V, one straight-line accrual applied."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "WO TV", royalty_per_device_cents: 300 }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /device-models"
              payload: { manufacturer_id: "${mfr}", model_code: "W-1", recovery_policy: "STRAIGHT_LINE" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { mod: $.data.id }
            - call: "POST /device-models/${mod}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /device-models/${mod}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units"
              payload: { device_model_id: "${mod}", serial_number: "W-1-001", hardware_cost_cents: 20000, sale_price_cents: 9999 }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { unit: $.data.id }
            - call: "POST /device-units/${unit}/sell"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "wo@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
            - call: "POST /device-units/${unit}/activate"
              payload: {}
              as: Viewer
              as_user_id: "${vw}"
            - call: "POST /device-units/${unit}/accrue-straight-line"
              payload: {}
              as: AdOps
          trigger:
            - call: "POST /device-units/${unit}/deactivate"
              payload: {}
              as: Viewer
              as_user_id: "${vw}"
          assert:
            - "DeviceUnit.${unit}.status == DEACTIVATED"
            - "DeviceUnit.${unit}.subsidy_recovered_cents == 416 (unchanged by deactivation)"
            - "DeviceUnit.${unit}.subsidy_written_off_cents == 9585 and subsidy_outstanding_cents == 0"
            - "INV-SUBSIDY: 10001 == 416 + 9585 + 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: ad_slot_split_floor_boundary_covered_by_difficulty
        claim_type: boundary_edge
        grounds:
          - calculations.ad_slot_split
        excluded_because:
          difficulty_instance: boundary_precision_check / ad_slot_split_floor_at_exactly_divisible_vs_off_by_one
          rationale: "The 1000 vs 1001 totals and both splits are asserted there."

      - name: ad_revenue_rounding_order_covered_by_difficulty
        claim_type: boundary_edge
        grounds:
          - calculations.ad_revenue_share
        excluded_because:
          difficulty_instance: combinatorial_formula / ad_revenue_per_entry_rounding_then_sum_pinned
          rationale: "Per-entry-then-sum vs sum-then-round divergence is asserted there with [1,1,1] at 3333 bps."

      - name: subscription_payout_variants_covered_by_difficulty
        claim_type: variant_divergence
        grounds:
          - calculations.subscription_payout
        excluded_because:
          difficulty_instance: dual_variant_calc / subscription_payout_gross_vs_net_variant_divergence
          rationale: "GROSS 799 vs NET 755 on identical 999-cent inputs is asserted there."

      - name: campaign_pacing_projection_midpoint_and_clamps
        claim_type: correct_result
        grounds:
          - calculations.campaign_pacing_projection
          - entities.AdCampaign.fields.expected_spend_cents
        distinguishing_aspect: "At the flight midpoint (120h of a 240h flight) with budget 50000, expected_spend_cents == 25000 and pacing_delta == spent - 25000; before flight start elapsed clamps to 0 (expected 0); after flight end it clamps to the full budget."
        test_recipe:
          setup:
