  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: relocate_state_vs_occ_fiscal_state_wins
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - state_machines.Subscription.ACTIVE_to_RELOCATING
        distinguishing_aspect: |
          On POST /subscriptions/{id}/relocate against a PENDING subscription with
          a stale expected_subscription_version, both the state check (priority 6,
          category state, ERR_INVALID_STATE) and the OCC fiscal check (priority 13,
          category business_fiscal, ERR_STALE_SUBSCRIPTION_VERSION) would fail; the
          lower-priority state check wins -> ERR_INVALID_STATE. Pair: state vs
          business_fiscal.
        test_recipe:
          setup:
            - "A PENDING subscription (never activated) with one ASSIGNED seat; client passes a deliberately wrong expected_subscription_version"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 160", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "H", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full P5a", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "P5a Holder", email: "p5a@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id, v_sub: $.data.version }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/relocate"
              payload: { expected_subscription_version: "${v_sub} + 99" }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "TicketTransfer is not involved; error_id == ERR_INVALID_STATE (state check at priority 6 beats OCC at priority 13)"

      - name: relocate_confirm_section_mismatch_vs_seat_window_referential_wins
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.Subscription.RELOCATING_to_ACTIVE
        distinguishing_aspect: |
          On POST /subscriptions/{id}/relocate/confirm with a target seat in a
          DIFFERENT section that is ALSO already SOLD with an overlapping window,
          both the referential check (priority 7, ERR_SECTION_MISMATCH) and the
          temporal seat-window check (priority 9, ERR_SEAT_WINDOW_CONFLICT) fail;
          the lower-priority referential check wins -> ERR_SECTION_MISMATCH. Pair:
          business_referential vs business_temporal — distinct from the first pair.
        test_recipe:
          setup:
            - "Subscription in RELOCATING state holding seat in section S1; target seat lives in a DIFFERENT section S2 and is already SOLD under another subscription with the same season window"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Sec S1", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { s1_id: $.data.id }
            - call: "POST /sections"
              payload: { name: "Sec S2", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { s2_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${s1_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_s1: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${s2_id}", row_label: "A", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_s2: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full P5b", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Mover", email: "mover@x.com" }
              as: BoxOfficeAgent
              captures: { acc_mover: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Occupant", email: "occ@x.com" }
              as: BoxOfficeAgent
              captures: { acc_occ: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_mover}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_mover: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_occ}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_occ: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_mover}", seat_id: "${seat_s1}" }
              as: BoxOfficeAgent
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_occ}", seat_id: "${seat_s2}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_mover}/activate"
              payload: {}
              as: BoxOfficeAgent
              captures: { v_mover: $.data.version }
            - call: "POST /subscriptions/${sub_occ}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub_mover}/relocate"
              payload: { expected_subscription_version: "${v_mover}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_mover}/relocate/confirm"
              payload: { target_seat_ids: ["${seat_s2}"] }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == ERR_SECTION_MISMATCH (referential check at priority 7 beats temporal at priority 9)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_tier_silver_boundary_at_500_points
        grounds:
          - entities.Account.fields.loyalty_tier
          - endpoints[GET /accounts/{id}]
        distinguishing_aspect: |
          loyalty_tier uses >= boundaries: priority_points==499 -> BRONZE,
          priority_points==500 -> SILVER (inclusive). Tested on GET /accounts/{id}
          after setting points to exactly 499 then 500 via grant-points.
        test_recipe:
          setup:
            - "Two accounts: one with priority_points set to exactly 499, one set to exactly 500"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { full_name: "Below", email: "below@x.com" }
              as: BoxOfficeAgent
              captures: { acc_lo: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "AtBound", email: "atbound@x.com" }
              as: BoxOfficeAgent
              captures: { acc_hi: $.data.id }
            - call: "POST /_accounts/${acc_lo}/grant-points"
              payload: { priority_points: 499 }
              as: BoxOfficeAgent
            - call: "POST /_accounts/${acc_hi}/grant-points"
              payload: { priority_points: 500 }
              as: BoxOfficeAgent
          trigger:
            - call: "GET /accounts/${acc_lo}"
              payload: {}
              as: BoxOfficeAgent
            - call: "GET /accounts/${acc_hi}"
              payload: {}
              as: BoxOfficeAgent
          assert:
            - "Account.${acc_lo}.loyalty_tier == BRONZE"
            - "Account.${acc_hi}.loyalty_tier == SILVER"

      - name: parking_zone_capacity_empty_slot_boundary
        grounds:
          - validations[priority=10]
          - entities.ParkingZone.fields.active_pass_count
          - endpoints[POST /parking-addons]
        distinguishing_aspect: |
          Capacity uses >=: a zone with capacity=1 accepts the first add-on
          (active_pass_count goes 0->1, the empty-slot boundary) but rejects the
          second with ERR_PARKING_ZONE_FULL (active_pass_count==1 >= capacity==1).
          A different metric (collection count) on a different endpoint than the
          numeric loyalty threshold.
        test_recipe:
          setup:
            - "ParkingZone capacity=1; two ACTIVE subscriptions each eligible for a pass"
          setup_api_calls:
            - call: "POST /parking-zones"
              payload: { name: "Lot Tiny", capacity: 1, price_cents: 30000 }
              as: BoxOfficeAgent
              captures: { zone_id: $.data.id }
            - call: "POST /sections"
              payload: { name: "Lower 170", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "P", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat1_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "P", seat_number: 2, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat2_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full Park", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Parker1", email: "p1@x.com" }
              as: BoxOfficeAgent
              captures: { acc1_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Parker2", email: "p2@x.com" }
              as: BoxOfficeAgent
              captures: { acc2_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc1_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub1_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc2_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub2_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub1_id}", seat_id: "${seat1_id}" }
              as: BoxOfficeAgent
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub2_id}", seat_id: "${seat2_id}" }
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub1_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /subscriptions/${sub2_id}/activate"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /parking-addons"
              payload: { subscription_id: "${sub1_id}", parking_zone_id: "${zone_id}" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /parking-addons"
              payload: { subscription_id: "${sub2_id}", parking_zone_id: "${zone_id}" }
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_PARKING_ZONE_FULL"
            - "ParkingZone.${zone_id}.active_pass_count == 1"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activate_requires_account_not_suspended
        grounds:
          - state_machines.Subscription.PENDING_to_ACTIVE
          - entities.Account.fields.status
          - validations[priority=6]
        distinguishing_aspect: |
          Subscription PENDING->ACTIVE is blocked when the holder Account.status
          is SUSPENDED (Subscription transition depends on Account state). Entity
          pair: Subscription -> Account.
        test_recipe:
          setup:
            - "PENDING subscription with one ASSIGNED seat whose holder Account has been suspended"
          setup_api_calls:
            - call: "POST /sections"
              payload: { name: "Lower 180", tier: "STANDARD", base_price_cents: 200000 }
              as: BoxOfficeAgent
              captures: { sec_id: $.data.id }
            - call: "POST /seats"
              payload: { section_id: "${sec_id}", row_label: "Q", seat_number: 1, season_start_date: "2026-10-01T00:00:00.000Z", season_end_date: "2027-04-01T00:00:00.000Z" }
              as: BoxOfficeAgent
              captures: { seat_id: $.data.id }
            - call: "POST /season-plans"
              payload: { name: "Full P7a", plan_type: "FULL", game_count: 41, price_multiplier_bps: 10000 }
              as: BoxOfficeAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Suspended Holder", email: "susp@x.com" }
              as: BoxOfficeAgent
              captures: { acc_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acc_id}", season_plan_id: "${plan_id}" }
              as: BoxOfficeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /seat-assignments"
              payload: { subscription_id: "${sub_id}", seat_id: "${seat_id}" }
              as: BoxOfficeAgent
            - call: "POST /accounts/${acc_id}/suspend"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: BoxOfficeAgent
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Subscription.${sub_id}.status == PENDING"

      - name: parking_addon_requires_subscription_active
        grounds:
          - validations[priority=6]
          - entities.Subscription.fields.status
          - endpoints[POST /parking-addons]
        distinguishing_aspect: |
          Creating a ParkingAddOn requires the referenced Subscription.status ==
          ACTIVE; against a still-PENDING subscription it is rejected. Entity pair:
          ParkingAddOn -> Subscription — distinct from the Subscription->Account
          pair above.
        test_recipe:
          setup:
            - "A PENDING (not yet activated) subscription and an available parking zone"
          setup_api_calls:
            - call: "POST /parking-zones"
              payload: { name: "Lot Big", capacity: 50, price_cents: 30000 }
              as: BoxOfficeAgent
              captures: { zone_id: $.data.id }
