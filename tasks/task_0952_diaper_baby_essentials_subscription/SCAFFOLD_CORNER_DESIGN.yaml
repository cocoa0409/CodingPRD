        claim_type: role_denial
        grounds: ["validations[priority=14]", "errors[ERR_NOT_GIFT_PURCHASER]"]
        distinguishing_aspect: "A third account acting as GiftPurchaser on a gift whose purchaser_account_id is someone else's is stopped by rung 14 with ERR_NOT_GIFT_PURCHASER (403), leaving the gift PENDING_PAYMENT."
