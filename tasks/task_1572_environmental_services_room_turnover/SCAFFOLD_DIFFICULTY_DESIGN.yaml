              captures: { rg1: $.data.id }
            - call: "POST /evs/clean-requests/${rg1}/assign"
              payload: { staff_id: "${tg}" }
              as: EVSDispatcher
            - call: "POST /evs/clean-requests/${rg1}/start"
              payload: {}
              as: EVSTechnician
              as_user_id: "${tg}"
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:30:00Z" }, as: EVSAdministrator }
            - call: "POST /evs/clean-requests/${rg1}/complete"
