              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "GET /procurement/approval-steps"
              payload: { requisition_id: "${req_id}" }
              as: Approver
              captures: { lvl: "$.data[0].level" }
          assert:
            - "Requisition.${req_id}.estimated_total_cents == 500000"
            - "Requisition.${req_id}.required_levels == 1"
            - "exactly one ApprovalStep exists, with required_role == MANAGER"

