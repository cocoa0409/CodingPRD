          trigger:
            - call: "POST /delivery-loads"
              payload: { material_order_id: "${ord_id}", delivery_truck_id: "${truck_id}", planned_cubic_yards: 10.01, window_start: "2026-08-04T08:00:00.000Z", window_end: "2026-08-04T12:00:00.000Z" }
              as: DispatchPlanner
          assert:
