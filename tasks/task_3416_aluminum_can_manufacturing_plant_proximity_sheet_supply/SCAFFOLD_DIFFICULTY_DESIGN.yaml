  - rule_id: resource_temporal_overlap
    instances:
      - name: line_run_windows_half_open_touching_allowed
        grounds:
          - validations.priority_8_business_temporal
          - errors.ERR_LINE_WINDOW_OVERLAP
          - entities.ProductionRun.fields.window_start
        distinguishing_aspect: |
          Half-open interval semantics on resource ProductionLine: a run [16:00, 23:00)
          touching an existing run's [08:00, 16:00) end is ACCEPTED (adjacency is not
          overlap), while [15:59:59, 23:00) is rejected ERR_LINE_WINDOW_OVERLAP — one second
          of difference decides.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. ACTIVE agreement; line; QUALIFIED format; run R1 graphics G1 window 2026-09-10T08:00:00Z..2026-09-10T16:00:00Z SCHEDULED. Same graphics G1 everywhere, so the changeover buffer never applies."
