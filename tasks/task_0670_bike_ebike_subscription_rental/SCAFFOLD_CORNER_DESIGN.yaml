            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv1: $.data.version }
          assert:
            - "reserve returns 201; RentalAgreement created with bike_id set"
            - "BikeModel.version incremented by 1 (mv1 == mv0 + 1)"

      - name: occ_stale_model_version_reserve_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-bike-stale-model]", "errors[ERR_STALE_MODEL_VERSION]", "validations[priority=5]"]
        distinguishing_aspect: "OCC negative: a reserve carrying expected_model_version = (current - 1) after a prior reserve advanced the version is rejected with ERR_STALE_MODEL_VERSION 412."
        test_recipe:
          setup: ["Model with 2 bikes; one reserve already bumped the model version; a second reserve carries the pre-bump (stale) version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
