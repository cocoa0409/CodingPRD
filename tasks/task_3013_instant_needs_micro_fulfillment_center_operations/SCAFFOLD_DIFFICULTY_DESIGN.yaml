# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3013_instant_needs_micro_fulfillment_center_operations
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and drives empty-DB -> setup via §1.5 calls only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: tax_rounding_per_line_then_sum_vs_sum_then_round
        grounds:
          - calculations.order_tax
          - calculations.order_tax.variants.per_line_then_sum
          - calculations.order_tax.variants.sum_then_round
          - entities.Order.fields.tax_cents
        distinguishing_aspect: |
          Entity domain: Order tax. The scaffold pins per-line-then-sum as the
          only valid rounding order; this instance pins the exact per-line
          components (7 + 14 = 21 cents) so any implementation that rounds per
          line with a different mode (e.g. banker's rounding on the .93/.07
          split elsewhere) or silently drops the tax class mapping is caught,
          while the sibling instance supplies the true divergence case where
          sum-then-round disagrees.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T14:00:00Z (Thursday, off-peak)."
            - "Site SITE-A: radius 5.0, fee { base 199, per_mile 99, included 1.5, peak 150, min 99, max 999 }, waiver threshold 3000, caps 2/20, horizon 2, no peak windows."
            - "Product SKU-BEER-A AGE_RESTRICTED price 99; SKU-BEER-B AGE_RESTRICTED price 199. No wallet credit."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-BEER-A", name: "Lager 6-pack", price_cents: 99, product_class: "AGE_RESTRICTED" }
              as: SiteOps
              captures: { prod_beer_a: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-BEER-B", name: "IPA 4-pack", price_cents: 199, product_class: "AGE_RESTRICTED" }
              as: SiteOps
              captures: { prod_beer_b: $.data.id }
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_beer_a}", qty: 1 }, { product_id: "${prod_beer_b}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, order_tax: $.data.tax_cents }
          assert:
            - "Order.${order_id}.tax_cents == 21 (per-line: round(6.93)=7 plus round(13.93)=14)"
            - "Order.${order_id}.subtotal_cents == 298"
            - "Order.${order_id}.delivery_fee_cents == 199 (off-peak, within included miles, no membership)"
            - "The per-line components 7 and 14 are individually observable only via the pinned rounding rule; the sum-then-round coincidence here (21) is why the sibling instance uses half-cent lines"

      - name: tax_rounding_divergence_on_half_cent_lines
        grounds:
          - calculations.order_tax
          - calculations.order_tax.variants.sum_then_round
          - entities.Order.fields.tax_cents
        distinguishing_aspect: |
          Entity domain: Order tax — the true divergence probe. Three lines of a
          25-cent AGE_RESTRICTED item (raw line tax 1.75 cents each): per-line
          rounding gives 2+2+2=6 cents; sum-then-round gives round(5.25)=5.
          The scaffold pins 6.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A as in the sibling instance."
            - "Product SKU-MINI AGE_RESTRICTED price 25. Customer of age. No wallet."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-MINI", name: "Mini shooter", price_cents: 25, product_class: "AGE_RESTRICTED" }
              as: SiteOps
              captures: { prod_mini: $.data.id }
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_mini}", qty: 1 }, { product_id: "${prod_mini}", qty: 1 }, { product_id: "${prod_mini}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order2_id: $.data.id }
          assert:
            - "Order.${order2_id}.tax_cents == 6 — per-line round_half_up(1.75)=2 three times"
            - "Order.${order2_id}.tax_cents != 5 — the sum-then-round alternative is rejected"
            - "Order.${order2_id}.subtotal_cents == 75"

      - name: loyalty_record_vs_absorb_variants_on_customer_wallet
        grounds:
          - calculations.loyalty_credit_accrual
          - calculations.loyalty_credit_accrual.variants.record
          - calculations.loyalty_credit_accrual.variants.absorb
          - calculations.loyalty_credit_application
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: |
          Entity domain: Customer wallet — different domain from Order tax. Two
          delivered orders of identical basket composition yield different
          wallet movement depending on which variant engages: the first order
          (empty wallet, record variant) EARNS 67 cents on delivery; the second
          (wallet pre-funded to 200, absorb variant) consumes 200 at placement
          and earns exactly 0 on delivery.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10T14:00:00Z. Site SITE-A; products SKU-CHIPS STANDARD 500 and SKU-SODA STANDARD 300; customer of age with wallet 0."
            - "First order delivered end-to-end (wallet earns 67). Then wallet topped up to 200 via operator adjustment and a second identical order placed with the absorb variant."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Sam Sealer" }
              as: SiteOps
              captures: { picker_2: $.data.id }
            - call: "POST /mfc/drivers"
              payload: { site_id: "${site_id}", name: "Dee Driver", max_run_orders: 4 }
              as: SiteOps
              captures: { driver_1: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 4 } ], delivery_distance_miles: 2.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_1: $.data.id }
            - call: "POST /mfc/pick-batches"
              payload: { site_id: "${site_id}", picker_id: "${picker_1}" }
              as: SiteOps
              captures: { batch_1: $.data.id }
            - call: "POST /mfc/pick-batches/${batch_1}/orders"
              payload: { order_id: "${order_1}" }
              as: Picker
              as_user_id: "${picker_1}"
            - call: "POST /mfc/pick-batches/${batch_1}/seal"
              payload: {}
              as: Picker
              as_user_id: "${picker_2}"
            - call: "POST /mfc/delivery-bags"
              payload: { order_id: "${order_1}" }
              as: SiteOps
              captures: { bag_1: $.data.id }
            - call: "POST /mfc/delivery-bags/${bag_1}/assign"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/delivery-bags/${bag_1}/depart"
              payload: {}
              as: Driver
              as_user_id: "${driver_1}"
            - call: "POST /mfc/delivery-bags/${bag_1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${driver_1}"
            - call: "POST /mfc/customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 133, reason: "promo top-up to 200" }
              as: SiteOps
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 4 } ], delivery_distance_miles: 2.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_2: $.data.id }
          assert:
            - "After order 1 delivered: Customer.${cust_id}.wallet_credit_cents == 67 (record variant: min(500, round(0.03*2249)) = round(67.47) = 67)"
            - "Order 1 delivery_fee_cents == 249 (199 + round(0.5*99)=50, off-peak, no membership)"
            - "After wallet top-up of 133: wallet == 200"
            - "Order.${order_2}.loyalty_credit_applied_cents == 200 — absorb variant consumed the wallet at placement"
            - "Order.${order_2}.total_cents == 2000 + 0 + 249 - 200 == 2049"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: delivery_fee_tiered_peak_cap_nonlinear
        grounds:
          - calculations.delivery_fee
          - entities.Site.fields.fee_schedule
          - entities.Site.fields.peak_windows
        distinguishing_aspect: |
          Mode (a) combinatorial: a 5-input formula (base, billable miles beyond
          the included band, peak flag, min floor, max cap) with non-linear
          interaction — the peak surcharge survives at short distances
          (fee(2.0, peak) == 399 vs off-peak 249) but is swallowed by the max
          cap at long distances (from 9.5 miles out, peak and off-peak both
          clamp to 999).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T02:00:00Z — Saturday 02:00 UTC, inside the site's FRI 22:00-SAT 04:00 peak window."
            - "Site SITE-P: radius 10.0, fee { base 199, per_mile 99, included 1.5, peak 150, min 99, max 999 }, waiver threshold 3000, caps 2/20, horizon 2, peak windows [FRI 22:00-24:00, SAT 00:00-04:00]."
            - "STANDARD product SKU-CHIPS 500, stock seeded, customer of age, no membership."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T02:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-P", name: "Peakville MFC", delivery_radius_miles: 10.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2, peak_windows: [ { day_of_week: "FRI", start: "22:00", end: "24:00" }, { day_of_week: "SAT", start: "00:00", end: "04:00" } ] }
              as: SiteOps
              captures: { site_p: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_c: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_p}", product_id: "${prod_c}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_c: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_c}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "peak@example.com", full_name: "Pete Peak", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_p: $.data.id }
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_p}", site_id: "${site_p}", lines: [ { product_id: "${prod_c}", qty: 1 } ], delivery_distance_miles: 2.0 }
              as: Customer
              as_user_id: "${cust_p}"
              captures: { o_short: $.data.id, fee_short: $.data.delivery_fee_cents }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_p}", site_id: "${site_p}", lines: [ { product_id: "${prod_c}", qty: 1 } ], delivery_distance_miles: 8.0 }
              as: Customer
              as_user_id: "${cust_p}"
              captures: { o_long: $.data.id, fee_long: $.data.delivery_fee_cents }
          assert:
            - "Order.${o_short}.delivery_fee_cents == 399 (199 + round(0.5*99)=50 + peak 150)"
            - "Order.${o_long}.delivery_fee_cents == 993 (199 + round(6.5*99)=644 + 150 — under the cap, so the peak surcharge survives at this distance)"
            - "The cap binds only from 9.5 miles out (199+792+150=1141 -> 999): the min/max envelope interacts non-linearly with the peak flag"
            - "Order.${o_short}.tax_cents == 0 (STANDARD product untaxed)"

      - name: membership_billing_close_evaluation_order
        grounds:
          - calculations.membership_billing_close
          - entities.Membership.fields.tenure_discount_bps
          - entities.Membership.fields.periods_paid
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          fee charged at close N uses the tenure discount in force BEFORE
          periods_paid increments, while the discount for close N+1 is recomputed
          AFTER the increment — closing the 12th paid period charges the full
          1000 cents and only then arms the 500 bps discount.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Customer enrolls FAM at 1000 cents/month. Operator advances the clock 30 days at a time and closes 11 paid periods."
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "tenure@example.com", full_name: "Tess Tenure", date_of_birth: "1988-05-05T00:00:00Z" }
              as: Customer
              captures: { cust_t: $.data.id }
            - call: "POST /mfc/memberships"
