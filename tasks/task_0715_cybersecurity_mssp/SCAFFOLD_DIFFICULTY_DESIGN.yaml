  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_pentest_window_halfopen_adjacent_ok
        grounds:
          - state_machines.Engagement.DRAFT_to_AUTHORIZED
          - validations[priority=28]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Engagement resource, half-open [start, end) interval semantics: a second
          AUTHORIZED PENTEST sharing a scope asset whose window [05,15) overlaps the
          first's [00,10) is rejected with ERR_WINDOW_OVERLAP, but an exactly-adjacent
          window [10,20) (end == start) does NOT conflict — adjacency is allowed.
        test_recipe:
          setup:
            - "Client; one ACTIVE asset; first PENTEST engagement [2026-03-01,2026-03-10) AUTHORIZED on that asset."
            - "Two more DRAFT PENTEST engagements on the same asset: one overlapping [2026-03-05,2026-03-15), one adjacent [2026-03-10,2026-03-20)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Ov Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "ov-01", ip_address: "10.0.1.6", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "PENTEST", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-03-10T00:00:00Z", estimated_hours: 5, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_a: $.data.id }
            - call: "POST /engagements/${eng_a}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "PENTEST", authorized_window_start: "2026-03-05T00:00:00Z", authorized_window_end: "2026-03-15T00:00:00Z", estimated_hours: 5, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_overlap: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "PENTEST", authorized_window_start: "2026-03-10T00:00:00Z", authorized_window_end: "2026-03-20T00:00:00Z", estimated_hours: 5, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_adjacent: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_overlap}/authorize"
              payload: {}
              as: ClientContact
              captures: { err_overlap: $.data.error_id }
            - call: "POST /engagements/${eng_adjacent}/authorize"
              payload: {}
              as: ClientContact
              captures: { adj_status: $.data.status }
          assert:
            - "authorize(eng_overlap) returns ERR_WINDOW_OVERLAP (409) — [05,15) overlaps [00,10)"
            - "authorize(eng_adjacent) succeeds: Engagement.${eng_adjacent}.status == AUTHORIZED — [10,20) is adjacent (end==start), no conflict"

      - name: overlap_scan_cooldown_closed_buffer_24h
        grounds:
          - state_machines.Scan.QUEUED_to_RUNNING
          - validations[priority=29]
          - errors[ERR_SCAN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Scan resource, closed-buffered interval semantics (different from the
          half-open window): a second scan started within 24h (SCAN_COOLDOWN_HOURS)
          of a RUNNING scan on the same engagement collides on the closed buffered
          interval [started_at, started_at+24h] and is rejected with
          ERR_SCAN_WINDOW_OVERLAP — buffer arithmetic, not bare overlap.
        test_recipe:
          setup:
            - "Client; Asset; Engagement ACTIVE; first scan started at clock 2026-03-02T00:00:00Z and left RUNNING."
            - "A second scan queued; clock advanced only 12h (inside the 24h buffer) before starting it."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Cd Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "cd-01", ip_address: "10.0.1.7", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 20, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_a: $.data.id }
            - call: "POST /scans/${scan_a}/start"
              payload: {}
              as: EngagementLead
            - call: "GET /engagements/${eng_id}"
              payload: {}
              as: EngagementLead
              captures: { eng_v_now: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v_now}" }
              as: EngagementLead
              captures: { scan_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /scans/${scan_b}/start"
              payload: {}
              as: EngagementLead
              captures: { err: $.data.error_id }
          assert:
            - "scan_b start returns ERR_SCAN_WINDOW_OVERLAP (409) — clock 2026-03-02T12:00Z is within [02T00:00, 03T00:00] buffer of RUNNING scan_a"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invariant_retainer_reservation_conserved_on_cancel
        grounds:
          - state_machines.Engagement.AUTHORIZED_to_CANCELLED
          - state_machines.Engagement.DRAFT_to_AUTHORIZED
          - entities.RetainerLedger.fields.hours_reserved
          - entities.RetainerLedger.fields.hours_available
        distinguishing_aspect: |
          Conserved quantity = retainer hours_available on the OPEN ledger: authorize
          reserves estimated_hours (40 -> available 60) and the compensating cancel of an
          AUTHORIZED engagement releases exactly estimated_hours, restoring
          hours_available to its pre-authorize value (100) with hours_reserved back to 0 —
          zero drift.
        test_recipe:
          setup:
            - "Client retainer 100h period 0; Asset; Engagement estimated_hours=40 authorized then cancelled."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Inv1 Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "inv1-01", ip_address: "10.0.2.1", criticality: "MEDIUM" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "GET /retainer-ledgers?client_id=${client_id}&period_index=0"
              payload: {}
              as: PlatformAdmin
              captures: { ledger_id: "$.data[0].id" }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 40, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
          trigger:
            - call: "POST /engagements/${eng_id}/cancel"
              payload: {}
              as: EngagementLead
          assert:
            - "After authorize: RetainerLedger.${ledger_id}.hours_reserved == 40 and hours_available == 60"
            - "After compensating cancel: RetainerLedger.${ledger_id}.hours_reserved == 0 and hours_available == 100 (restored to pre-authorize, zero drift)"

      - name: invariant_asset_quarantine_conserved_on_resolve
        grounds:
          - state_machines.Incident.ACKNOWLEDGED_to_CONTAINED
          - state_machines.Incident.CONTAINED_to_RESOLVED
          - entities.Asset.fields.status
          - entities.Incident.fields.quarantined_asset_id
        distinguishing_aspect: |
          Conserved quantity = Asset.status (a different conserved quantity from retainer
          hours): containment sets the Asset to QUARANTINED and the compensating resolve
          restores it to ACTIVE and clears quarantined_asset_id, leaving Asset.status back
          at ACTIVE — the quarantine forward/undo pair conserves the asset's lifecycle state.
        test_recipe:
          setup:
            - "Client; ACTIVE Asset (HIGH/EXTERNAL); Alert promoted to Incident, acknowledged, contained with quarantine_asset=true (asset QUARANTINED)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Inv2 Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "inv2-01", ip_address: "10.0.2.2", criticality: "HIGH", exposure: "EXTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "EDR", raw_score: 80 }
              as: SocAnalyst
              captures: { alert_id: $.data.id }
            - call: "POST /alerts/${alert_id}/triage"
              payload: {}
              as: SocAnalyst
            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { incident_id: $.data.promoted_incident_id }
            - call: "POST /incidents/${incident_id}/acknowledge"
              payload: {}
              as: SocAnalyst
            - call: "POST /incidents/${incident_id}/contain"
              payload: { quarantine_asset: true }
              as: SocAnalyst
          trigger:
            - call: "POST /incidents/${incident_id}/resolve"
              payload: { response_hours: 3 }
              as: EngagementLead
              captures: { quar_after: $.data.quarantined_asset_id }
          assert:
            - "After contain: GET /assets/${asset_id} Asset.status == QUARANTINED"
            - "After compensating resolve: GET /assets/${asset_id} Asset.status == ACTIVE"
            - "After resolve: Incident.${incident_id}.quarantined_asset_id == null (cleared, conserved back to original asset state)"
