              payload: { window_start: "2026-08-02T09:00:00Z" }
              as: ProductionScheduler
              captures: { ps_run_id: "$.data.id", ps_score: "$.data.selection_score", ps_chosen: "$.data.press_line_id" }
          assert:
            - "PrintRun.${ps_run_id}.press_line_id == ${ps_delta_id} (PL-DELTA)"
            - "PrintRun.${ps_run_id}.selection_score == 4120.00 (6600 * 6000 / 10000 == 3960.00 headroom points + 400 * 4000 / 10000 == 160.00 speed points - 0 surplus penalty)"
            - "PrintRun.${ps_run_id}.selection_mode == SELECTED"
            - "PL-ALPHA scores 3200.00 (3960.00 + 240.00 - 2 * 500), so its unpenalised 4200.00 would have won: the surplus-capability term flips the winner"
            - "PL-GAMMA is excluded because its capabilities do not contain DUPLEX; PL-ECHO is excluded because status is MAINTENANCE, even though both would outscore every eligible line"
            - "PrintRun.${ps_run_id}.planned_sheet_count == 2 and run_minutes == 60 (max(MIN_RUN_MINUTES 60, ceil(2 * 60 / 400) == 1))"
            - "PrintRun.${ps_run_id}.window_end == 2026-08-02T10:00:00Z and status == PLANNED"
            - "CompositionJob.${ps_job_id}.status == SCHEDULED"

  - rule_id: non_linear_state_machine
    instances:

      - name: mail_piece_progress_and_integrity_dimensions_advance_independently
        grounds:
          - state_machines.MailPiece.INSERTED_to_INDUCTED
          - state_machines.MailPiece.UNVERIFIED_to_SCAN_MATCHED
          - state_machines.MailPiece.SCAN_MATCHED_to_DUPLICATE_SCAN
          - entities.MailPiece.fields.piece_status
          - entities.MailPiece.fields.integrity_status
          - entities.ScanEvent.fields.rejection_reason
        distinguishing_aspect: |
          MailPiece carries two parallel state dimensions: a duplicate INDUCT read drives
          integrity_status from SCAN_MATCHED to DUPLICATE_SCAN while piece_status stays pinned at
          the terminal INDUCTED and accepted_scan_count stays 3 — the refused scan is recorded as
          evidence rather than raised as an error, so one trigger moves one dimension only.
        test_recipe:
          setup:
