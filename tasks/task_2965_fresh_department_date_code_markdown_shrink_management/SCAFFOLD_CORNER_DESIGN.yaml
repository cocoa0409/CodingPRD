          The liability aggregate is a full recompute over lots in FRESH, MARKED_DOWN or
          DONATION_PENDING: two marked-down lots of 24 and 10 units give 3060 = 34 * 90, and
          withdrawing the 24-unit lot drops it to 900 = 10 * 90 rather than leaving a stale total
