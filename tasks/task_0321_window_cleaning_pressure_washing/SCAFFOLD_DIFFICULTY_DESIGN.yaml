# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Window Cleaning & Pressure Washing — Expert tier
# Every rule_id from §0.5; >= 2 instances each (>= 18 total).
# Each test_recipe drives empty-DB -> precondition via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_amount_pane_vs_sqft_diverge_on_same_property
        grounds:
          - calculations.quote_amount
          - entities.Property.fields.pane_count
          - entities.Property.fields.glass_sqft
          - entities.Quote.fields.quoted_total_cents
        distinguishing_aspect: "Two quotes on the SAME Property, one pricing_basis=PANE_COUNT, one SQ_FT, yield different quoted_total_cents (23000 vs 20190) — dual-variant lives on the Quote entity domain."
        test_recipe:
          setup:
            - "One account (NORTH); one property with pane_count=60, glass_sqft=140.4, stories=2, soft_wash_sqft=0."
            - "Two DRAFT quotes on that property: q_pane (PANE_COUNT,[GUTTER]) and q_sqft (SQ_FT,[GUTTER])."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "acme@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "1 Pane Ln", pane_count: 60, glass_sqft: 140.4, stories: 2, soft_wash_sqft: 0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["GUTTER"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q_pane: $.data.id, q_pane_total: $.data.quoted_total_cents }
          trigger:
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "SQ_FT", addon_codes: ["GUTTER"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q_sqft: $.data.id, q_sqft_total: $.data.quoted_total_cents }
          assert:
            - "Quote.${q_pane}.quoted_total_cents == 23000"
            - "Quote.${q_sqft}.quoted_total_cents == 20190"
            - "Quote.${q_pane}.quoted_total_cents != Quote.${q_sqft}.quoted_total_cents"

      - name: visit_charge_estimate_vs_actual_diverge_on_reschedule
        grounds:
          - calculations.visit_charge
          - entities.Visit.fields.charge_amount_cents
          - entities.Visit.fields.reschedule_count
          - entities.ServiceAgreement.fields.per_visit_price_cents
        distinguishing_aspect: "A Visit whose estimate (agreement.per_visit_price_cents=23000) differs from its actual charge_amount_cents (20700) after >=2 weather reschedules — dual-variant lives on the Visit entity domain, distinct from the Quote-domain instance above."
        test_recipe:
          setup:
            - "Active ONE_TIME agreement on a simple property (pane=60,stories=2,[GUTTER]); per_visit_price_cents=23000."
            - "Its first Visit committed to a route, then weather-rescheduled twice (reschedule_count=2), recommitted, dispatched, started, completed."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "acme2@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "2 Pane Ln", pane_count: 60, glass_sqft: 100.0, stories: 2, soft_wash_sqft: 0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["GUTTER"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
            - call: "POST /service-agreements"
              payload: { quote_id: "${q}", schedule_kind: "ONE_TIME" }
              as: Billing
              captures: { agr: $.data.id }
            - call: "POST /service-agreements/${agr}/activate"
              payload: { first_visit_planned_date: "2026-07-01", first_visit_window_start_min: 540, first_visit_window_end_min: 660 }
              as: Billing
            - call: "GET /service-agreements/${agr}/visits"
              payload: {}
              as: Billing
              captures: { vis: "$.data[0].id" }
            - call: "POST /crews"
              payload: { crew_name: "Crew A", region_code: "NORTH", skill_codes: [], daily_capacity_minutes: 600 }
              as: Dispatcher
              captures: { crew: $.data.id }
            - call: "POST /routes"
              payload: { crew_id: "${crew}", region_code: "NORTH", service_date: "2026-07-01" }
              as: Dispatcher
              captures: { rt1: $.data.id }
            - call: "GET /routes/${rt1}"
              payload: {}
              as: Dispatcher
              captures: { rt1_v: $.data.version }
            - call: "POST /routes/${rt1}/visits"
              payload: { visit_id: "${vis}", expected_route_version: "${rt1_v}" }
              as: Dispatcher
            - call: "POST /weather-advisories"
              payload: { region_code: "NORTH", advisory_date: "2026-07-01", severity: "SUSPEND" }
              as: Dispatcher
            - call: "POST /visits/${vis}/weather-reschedule"
              payload: { new_planned_date: "2026-07-08" }
              as: Dispatcher
            - call: "POST /routes"
              payload: { crew_id: "${crew}", region_code: "NORTH", service_date: "2026-07-08" }
              as: Dispatcher
              captures: { rt2: $.data.id }
            - call: "GET /routes/${rt2}"
              payload: {}
              as: Dispatcher
              captures: { rt2_v: $.data.version }
            - call: "POST /routes/${rt2}/visits"
              payload: { visit_id: "${vis}", expected_route_version: "${rt2_v}" }
              as: Dispatcher
            - call: "POST /weather-advisories"
              payload: { region_code: "NORTH", advisory_date: "2026-07-08", severity: "SUSPEND" }
              as: Dispatcher
            - call: "POST /visits/${vis}/weather-reschedule"
              payload: { new_planned_date: "2026-07-15" }
              as: Dispatcher
            - call: "POST /routes"
              payload: { crew_id: "${crew}", region_code: "NORTH", service_date: "2026-07-15" }
              as: Dispatcher
              captures: { rt3: $.data.id }
            - call: "GET /routes/${rt3}"
              payload: {}
              as: Dispatcher
              captures: { rt3_v: $.data.version }
            - call: "POST /routes/${rt3}/visits"
              payload: { visit_id: "${vis}", expected_route_version: "${rt3_v}" }
              as: Dispatcher
            - call: "POST /routes/${rt3}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /visits/${vis}/photos"
              payload: { phase: "BEFORE", image_uri: "s3://b.jpg" }
              as: FieldCrew
            - call: "POST /visits/${vis}/start"
              payload: {}
              as: FieldCrew
            - call: "POST /visits/${vis}/photos"
              payload: { phase: "AFTER", image_uri: "s3://a.jpg" }
              as: FieldCrew
          trigger:
            - call: "POST /visits/${vis}/complete"
              payload: {}
              as: FieldCrew
              captures: { charge: $.data.charge_amount_cents, rc: $.data.reschedule_count }
          assert:
            - "ServiceAgreement.${agr}.per_visit_price_cents == 23000"
            - "Visit.${vis}.reschedule_count == 2"
            - "Visit.${vis}.charge_amount_cents == 20700"
            - "Visit.${vis}.charge_amount_cents != ServiceAgreement.${agr}.per_visit_price_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_amount_round_per_component_then_sum_softwash_highrise
        grounds:
          - calculations.quote_amount
          - entities.Property.fields.soft_wash_sqft
          - entities.Property.fields.stories
          - entities.Quote.fields.quoted_total_cents
        distinguishing_aspect: "Mode (b) nested rounding-order: high-rise surcharge (round_half_up(base*0.20)) and the soft-wash line (max(round_half_up(sqft*25),12000)) are each rounded to whole cents BEFORE summing; pinned 'round-per-component-then-sum' gives quoted_total_cents=35400."
        test_recipe:
          setup:
            - "One account, one property pane=80, glass=100, stories=4 (high-rise), soft_wash_sqft=400."
            - "A SENT quote PANE_COUNT with addon SOFT_WASH so both the high-rise surcharge and the soft-wash line are rounded independently."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Maple", contact_email: "maple@x.com", region_code: "EAST" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "9 Tall St", pane_count: 80, glass_sqft: 100.0, stories: 4, soft_wash_sqft: 400.0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["SOFT_WASH"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
          trigger:
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
              captures: { base: $.data.base_price_cents, addon: $.data.addon_total_cents, total: $.data.quoted_total_cents }
          assert:
            - "Quote.${q}.base_price_cents == 23400"
            - "Quote.${q}.addon_total_cents == 12000"
            - "Quote.${q}.quoted_total_cents == 35400"

      - name: visit_charge_three_input_conditional_discount_branch
        grounds:
          - calculations.visit_charge
          - entities.Visit.fields.reschedule_count
          - entities.VisitAddOn.fields.charge_cents
        distinguishing_aspect: "Mode (a) >=3-input non-linear branch: charge = max(per_visit_price + sum(VisitAddOn.charge) - (reschedule_count>=2 ? round_half_up(gross*0.10) : 0), 0); the conditional reschedule branch interacts with the add-on delta, distinct from the mode-(b) rounding instance."
        test_recipe:
          setup:
            - "Active ONE_TIME agreement (per_visit_price 23000); first visit committed/dispatched, one GUTTER VisitAddOn attached (charge 7500), reschedule_count=0; completed."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "acme3@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "3 Pane Ln", pane_count: 60, glass_sqft: 100.0, stories: 2, soft_wash_sqft: 0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["GUTTER"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
            - call: "POST /service-agreements"
              payload: { quote_id: "${q}", schedule_kind: "ONE_TIME" }
              as: Billing
              captures: { agr: $.data.id }
            - call: "POST /service-agreements/${agr}/activate"
              payload: { first_visit_planned_date: "2026-07-01", first_visit_window_start_min: 540, first_visit_window_end_min: 660 }
              as: Billing
            - call: "GET /service-agreements/${agr}/visits"
              payload: {}
              as: Billing
              captures: { vis: "$.data[0].id" }
            - call: "POST /visits/${vis}/add-ons"
              payload: { addon_code: "GUTTER" }
              as: Dispatcher
              captures: { ao: $.data.id, ao_charge: $.data.charge_cents }
            - call: "POST /crews"
              payload: { crew_name: "Crew A", region_code: "NORTH", skill_codes: [], daily_capacity_minutes: 600 }
              as: Dispatcher
              captures: { crew: $.data.id }
            - call: "POST /routes"
              payload: { crew_id: "${crew}", region_code: "NORTH", service_date: "2026-07-01" }
              as: Dispatcher
              captures: { rt: $.data.id }
            - call: "GET /routes/${rt}"
              payload: {}
              as: Dispatcher
              captures: { rt_v: $.data.version }
            - call: "POST /routes/${rt}/visits"
              payload: { visit_id: "${vis}", expected_route_version: "${rt_v}" }
              as: Dispatcher
            - call: "POST /routes/${rt}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /visits/${vis}/photos"
              payload: { phase: "BEFORE", image_uri: "s3://b.jpg" }
              as: FieldCrew
            - call: "POST /visits/${vis}/start"
              payload: {}
              as: FieldCrew
            - call: "POST /visits/${vis}/photos"
              payload: { phase: "AFTER", image_uri: "s3://a.jpg" }
              as: FieldCrew
          trigger:
            - call: "POST /visits/${vis}/complete"
              payload: {}
              as: FieldCrew
              captures: { charge: $.data.charge_amount_cents }
          assert:
            - "VisitAddOn.${ao}.charge_cents == 7500"
            - "Visit.${vis}.reschedule_count == 0"
            - "Visit.${vis}.charge_amount_cents == 30500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_parallel_schedule_and_billing_dimensions_independent
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - entities.Visit.fields.schedule_status
          - entities.Visit.fields.billing_status
          - state_machines.Visit.UNBILLED_to_INVOICED
        distinguishing_aspect: "On the Visit entity, schedule_status reaches COMPLETED and stays there while billing_status evolves UNBILLED->INVOICED->PAID independently — two parallel state dimensions on one row."
        test_recipe:
          setup:
            - "A COMPLETED visit (schedule_status COMPLETED, billing_status UNBILLED) on a simple ONE_TIME agreement (per_visit 23000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "acme4@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "4 Pane Ln", pane_count: 60, glass_sqft: 100.0, stories: 2, soft_wash_sqft: 0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["GUTTER"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
            - call: "POST /service-agreements"
              payload: { quote_id: "${q}", schedule_kind: "ONE_TIME" }
              as: Billing
              captures: { agr: $.data.id }
            - call: "POST /service-agreements/${agr}/activate"
              payload: { first_visit_planned_date: "2026-07-01", first_visit_window_start_min: 540, first_visit_window_end_min: 660 }
              as: Billing
            - call: "GET /service-agreements/${agr}/visits"
              payload: {}
              as: Billing
              captures: { vis: "$.data[0].id" }
            - call: "POST /crews"
              payload: { crew_name: "Crew A", region_code: "NORTH", skill_codes: [], daily_capacity_minutes: 600 }
              as: Dispatcher
              captures: { crew: $.data.id }
            - call: "POST /routes"
              payload: { crew_id: "${crew}", region_code: "NORTH", service_date: "2026-07-01" }
              as: Dispatcher
              captures: { rt: $.data.id }
            - call: "GET /routes/${rt}"
              payload: {}
              as: Dispatcher
              captures: { rt_v: $.data.version }
            - call: "POST /routes/${rt}/visits"
              payload: { visit_id: "${vis}", expected_route_version: "${rt_v}" }
              as: Dispatcher
            - call: "POST /routes/${rt}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /visits/${vis}/photos"
              payload: { phase: "BEFORE", image_uri: "s3://b.jpg" }
              as: FieldCrew
            - call: "POST /visits/${vis}/start"
              payload: {}
              as: FieldCrew
            - call: "POST /visits/${vis}/photos"
              payload: { phase: "AFTER", image_uri: "s3://a.jpg" }
              as: FieldCrew
            - call: "POST /visits/${vis}/complete"
              payload: {}
              as: FieldCrew
          trigger:
            - call: "POST /invoices"
              payload: { visit_id: "${vis}" }
              as: Billing
              captures: { inv: $.data.id }
            - call: "GET /visits/${vis}"
              payload: {}
              as: Billing
              captures: { sch: $.data.schedule_status, bill: $.data.billing_status }
          assert:
            - "Visit.${vis}.schedule_status == COMPLETED"
            - "Visit.${vis}.billing_status == INVOICED"
            - "Invoice.${inv}.amount_cents == 23000"

      - name: agreement_active_paused_cycle_round_trip
        grounds:
          - state_machines.ServiceAgreement.ACTIVE_to_PAUSED
          - state_machines.ServiceAgreement.PAUSED_to_ACTIVE
          - entities.ServiceAgreement.fields.status
        distinguishing_aspect: "On the ServiceAgreement entity (different from the Visit parallel instance), status cycles ACTIVE->PAUSED->ACTIVE, returning to ACTIVE — a genuine cycle, not a linear pipeline."
        test_recipe:
          setup:
            - "An ACTIVE recurring agreement."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "acme5@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "5 Pane Ln", pane_count: 60, glass_sqft: 100.0, stories: 2, soft_wash_sqft: 0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["GUTTER"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
            - call: "POST /service-agreements"
              payload: { quote_id: "${q}", schedule_kind: "RECURRING", recurrence_interval_days: 14 }
              as: Billing
              captures: { agr: $.data.id }
            - call: "POST /service-agreements/${agr}/activate"
              payload: { first_visit_planned_date: "2026-07-01", first_visit_window_start_min: 540, first_visit_window_end_min: 660 }
              as: Billing
            - call: "POST /service-agreements/${agr}/pause"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
          trigger:
            - call: "POST /service-agreements/${agr}/resume"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
              captures: { st: $.data.status }
          assert:
            - "ServiceAgreement.${agr}.status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: agreement_cancel_cascades_to_deposit_refund_to_ledger_to_balance
        grounds:
          - state_machines.ServiceAgreement.ACTIVE_to_CANCELLED
          - entities.Deposit.fields.status
          - entities.LedgerEntry.fields.signed_amount_cents
          - entities.Account.fields.balance_cents
          - entities.Account.fields.deposit_held_cents
        distinguishing_aspect: "Depth-4 chain from a single trigger: cancel -> agreement CANCELLED -> (caused) HELD Deposit -> REFUNDED -> (caused) refund LedgerEntry posted -> (caused) Account.balance_cents and deposit_held_cents recomputed to 0; each hop caused by the prior hop, not by the cancel directly."
        test_recipe:
          setup:
            - "Active agreement with one HELD deposit 9000 (deposit_held_cents=9000, balance_cents=9000 from the deposit debit)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Maple", contact_email: "maple2@x.com", region_code: "EAST" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "9 Tall St", pane_count: 80, glass_sqft: 100.0, stories: 4, soft_wash_sqft: 400.0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct}", property_id: "${prop}", pricing_basis: "PANE_COUNT", addon_codes: ["SOFT_WASH"], valid_until: "2026-12-31T00:00:00Z" }
              as: Billing
              captures: { q: $.data.id }
            - call: "POST /quotes/${q}/send"
              payload: {}
              as: Billing
            - call: "POST /quotes/${q}/accept"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
            - call: "POST /service-agreements"
              payload: { quote_id: "${q}", schedule_kind: "ONE_TIME" }
              as: Billing
              captures: { agr: $.data.id }
            - call: "POST /deposits"
              payload: { account_id: "${acct}", agreement_id: "${agr}", amount_cents: 9000 }
              as: Billing
              captures: { dep: $.data.id }
            - call: "POST /service-agreements/${agr}/activate"
              payload: { first_visit_planned_date: "2026-07-01", first_visit_window_start_min: 540, first_visit_window_end_min: 660 }
              as: Billing
          trigger:
            - call: "POST /service-agreements/${agr}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${acct}"
          assert:
            - "ServiceAgreement.${agr}.status == CANCELLED"
            - "Deposit.${dep}.status == REFUNDED"
            - "Account.${acct}.deposit_held_cents == 0"
            - "Account.${acct}.balance_cents == 0"

      - name: visit_complete_cascades_to_next_recurring_visit_generation
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - entities.ServiceAgreement.fields.visits_generated_count
          - entities.Visit.fields.planned_date
        distinguishing_aspect: "Depth-2 chain from a different trigger (visit complete): complete -> Visit COMPLETED -> (caused) next recurring Visit generated UNSCHEDULED at planned_date+interval and visits_generated_count incremented 1->2."
        test_recipe:
          setup:
            - "Active RECURRING agreement (interval 14d); first visit committed/dispatched/started, both photos present."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { company_name: "Acme", contact_email: "acme6@x.com", region_code: "NORTH" }
              as: Billing
              captures: { acct: $.data.id }
            - call: "POST /properties"
              payload: { account_id: "${acct}", address_line: "6 Pane Ln", pane_count: 60, glass_sqft: 100.0, stories: 2, soft_wash_sqft: 0 }
              as: Billing
              captures: { prop: $.data.id }
            - call: "POST /quotes"
