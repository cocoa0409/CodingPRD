              as: StateHFA
              captures: { res: $.data.result, sc: $.data.score }
          assert:
            - "Inspection.${i_id}.score == 53"
            - "Inspection.${i_id}.result == FAIL"
            - "Project.${p_id}.open_finding_count == 1"
            - "Project.${p_id}.posture == AT_RISK"

