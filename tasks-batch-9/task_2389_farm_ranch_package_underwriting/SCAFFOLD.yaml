    input: ["closure_reason"]
    output: FarmPolicy
    side_effects: ["releases every RESERVED CatReservation and bumps each pool version by 1", "reverses the whole premium ledger and zeroes every premium field", "cancels every SCHEDULED Inspection of the policy", "sets uw_status DECLINED and closure_reason", "increments FarmPolicy.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FARM_POLICY_NOT_FOUND, ERR_POLICY_TERMINAL, ERR_POLICY_NOT_BOUND]

