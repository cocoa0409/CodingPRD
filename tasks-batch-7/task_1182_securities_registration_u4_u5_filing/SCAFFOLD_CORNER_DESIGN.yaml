scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: firm_creation_success_and_defaults
        claim_type: creation_defaults
        grounds:
          - entities.Firm
          - endpoints."POST /registration-desk/firms"
        distinguishing_aspect: "POST with required fields returns 201 with status ACTIVE and open_inquiry_count 0; server-minted id is a prefix-free UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3001", legal_name: "Default Firm" }
              as: SystemOperator
              captures: { firm_d_id: $.data.id }
          trigger:
            - call: "GET /registration-desk/firms/${firm_d_id}"
              payload: {}
              as: SystemOperator
          assert:
            - "Firm.${firm_d_id}.status == ACTIVE (default applied)"
            - "Firm.${firm_d_id}.open_inquiry_count == 0 (computed default)"
            - "Firm.${firm_d_id}.version == 1"

      - name: firm_crd_number_uniqueness
        claim_type: violation_to_error
        grounds:
          - entities.Firm.fields.crd_number
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Second firm with the same crd_number is rejected with ERR_DUPLICATE 409."
        test_recipe:
          setup: ["one firm with crd_number 3002 exists"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3002", legal_name: "Dup Firm A" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3002", legal_name: "Dup Firm B" }
              as: SystemOperator
              captures: { err_dup: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE with http 409"

      - name: applicant_missing_required_field_rejected
        claim_type: required_field_validation
        grounds:
          - entities.IndividualApplicant.fields.full_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applicants without full_name fails ERR_INVALID_REQUEST 400 before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3003" }
              as: RegistrationPrincipal
              captures: { err_req: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: applicant_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints."GET /registration-desk/applicants/{id}"
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /registration-desk/applicants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SystemOperator
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: registration_request_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.RegistrationRequest
          - entities.RegistrationRequest.fields.status
        distinguishing_aspect: "A freshly created registration request has status DRAFT, deficiency_count 0, version 1."
        test_recipe:
          setup: ["firm and applicant exist"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3004", legal_name: "Init Firm" }
              as: SystemOperator
              captures: { firm_i_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3005", full_name: "Init Rep", date_of_birth: "1980-05-05" }
              as: RegistrationPrincipal
              captures: { app_i_id: $.data.id }
          trigger:
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_i_id}", firm_id: "${firm_i_id}", registration_category: "PRINCIPAL" }
              as: RegistrationPrincipal
              captures: { req_i_id: $.data.id }
          assert:
            - "RegistrationRequest.${req_i_id}.status == DRAFT"
            - "RegistrationRequest.${req_i_id}.deficiency_count == 0"
            - "RegistrationRequest.${req_i_id}.version == 1"

      - name: disclosure_explanation_min_length_enforced
        claim_type: required_field_validation
        grounds:
          - entities.BackgroundDisclosure.fields.explanation_text
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "answer=true with explanation_text shorter than 20 chars is rejected; answer=false needs no explanation."
        test_recipe:
          setup: ["firm, applicant, request exist"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3006", legal_name: "Disc Firm" }
              as: SystemOperator
              captures: { firm_dc_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3007", full_name: "Disc Rep", date_of_birth: "1981-06-06" }
              as: RegistrationPrincipal
              captures: { app_dc_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_dc_id}", firm_id: "${firm_dc_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_dc_id: $.data.id }
          trigger:
            - call: "POST /registration-desk/background-disclosures"
              payload: { registration_request_id: "${req_dc_id}", question_code: "CRIMINAL", answer: true, explanation_text: "too short" }
              as: RegistrationPrincipal
              captures: { err_disc: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400 (explanation_text length 9 < 20)"

      - name: computed_fingerprint_required_field
        claim_type: computed_field_correctness
        grounds:
          - entities.IndividualApplicant.fields.fingerprint_required
        distinguishing_aspect: "fingerprint_required is true for a new applicant and flips to false once a CLEARED submission exists for any of the applicant's requests; client-supplied fingerprint_required on create is ignored."
        test_recipe:
          setup: ["firm, applicant (fingerprint_required true), request; fingerprint submission processed CLEARED"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3008", legal_name: "FP Firm" }
              as: SystemOperator
              captures: { firm_fp_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3009", full_name: "FP Rep", date_of_birth: "1982-07-07" }
              as: RegistrationPrincipal
              captures: { app_fp_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_fp_id}", firm_id: "${firm_fp_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_fp_id: $.data.id }
            - call: "POST /registration-desk/fingerprint-submissions"
              payload: { registration_request_id: "${req_fp_id}", submission_channel: "HARD_CARD" }
              as: RegistrationPrincipal
              captures: { fp_sub_id: $.data.id }
          trigger:
            - call: "POST /registration-desk/fingerprint-submissions/${fp_sub_id}/process"
              payload: { outcome: "CLEARED" }
              as: SystemOperator
            - call: "GET /registration-desk/applicants/${app_fp_id}"
              payload: {}
              as: SystemOperator
              captures: { fp_req_after: $.data.fingerprint_required }
          assert:
            - "fingerprint_required before processing was true (initial)"
            - "captured fp_req_after == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminal_state_lockdown_withdrawn
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RegistrationRequest
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From WITHDRAWN every further transition (submit/approve/return-deficient/deny) is rejected with ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["request withdrawn from DRAFT"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3101", legal_name: "Lock Firm" }
              as: SystemOperator
              captures: { firm_l_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3102", full_name: "Lock Rep", date_of_birth: "1983-08-08" }
              as: RegistrationPrincipal
              captures: { app_l_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_l_id}", firm_id: "${firm_l_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_l_id: $.data.id }
            - call: "POST /registration-desk/registration-requests/${req_l_id}/withdraw"
              payload: {}
              as: RegistrationPrincipal
          trigger:
            - call: "POST /registration-desk/registration-requests/${req_l_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              captures: { err_lock: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409"
            - "RegistrationRequest.${req_l_id}.status remains WITHDRAWN"

      - name: invalid_transition_approve_from_deficient
        claim_type: invalid_transition
        grounds:
          - state_machines.RegistrationRequest
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "approve is only declared from SUBMITTED; calling it from DEFICIENT (after one return) is an invalid transition."
        test_recipe:
          setup: ["request returned to DEFICIENT once"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3103", legal_name: "InvTr Firm" }
              as: SystemOperator
              captures: { firm_it_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3104", full_name: "InvTr Rep", date_of_birth: "1984-09-09" }
              as: RegistrationPrincipal
              captures: { app_it_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_it_id}", firm_id: "${firm_it_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_it_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_it_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/registration-requests/${req_it_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-it"
            - call: "POST /registration-desk/registration-requests/${req_it_id}/return-deficient"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-it"
          trigger:
            - call: "POST /registration-desk/registration-requests/${req_it_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-it"
              captures: { err_it: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (DEFICIENT is not a valid from-state for approve)"

      - name: deny_requires_flagged_or_expired
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RegistrationRequest.SUBMITTED_to_DENIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "deny on a SUBMITTED request with no FLAGGED disclosure and no EXPIRED exam is rejected (precondition gate), even though the state edge SUBMITTED->DENIED exists."
        test_recipe:
          setup: ["SUBMITTED request, clean disclosures, no expired exams"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3105", legal_name: "Deny Firm" }
              as: SystemOperator
              captures: { firm_dn_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3106", full_name: "Deny Rep", date_of_birth: "1985-10-10" }
              as: RegistrationPrincipal
              captures: { app_dn_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_dn_id}", firm_id: "${firm_dn_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_dn_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_dn_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/registration-requests/${req_dn_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-dn"
          trigger:
            - call: "POST /registration-desk/registration-requests/${req_dn_id}/deny"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-dn"
              captures: { err_dn: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (no FLAGGED disclosure and no EXPIRED exam — deny precondition unsatisfied)"

      - name: u5_close_blocked_by_inconsistent_comment
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TerminationFiling.FILED_to_CLOSED
          - calculations.comment_accuracy_check
        distinguishing_aspect: "A U5 with a comment whose text contradicts termination_reason (VOLUNTARY + 'fired') gets disposition INCONSISTENT, and the close transition is rejected until the inconsistency is resolved."
        test_recipe:
          setup: ["ACTIVE registration terminated VOLUNTARY; one comment 'He was fired for cause' attached (INCONSISTENT)"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3107", legal_name: "Cmt Firm" }
              as: SystemOperator
              captures: { firm_cm_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3108", full_name: "Cmt Rep", date_of_birth: "1986-11-11" }
              as: RegistrationPrincipal
              captures: { app_cm_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_cm_id}", firm_id: "${firm_cm_id}", registration_category: "IA" }
              as: RegistrationPrincipal
              captures: { req_cm_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_cm_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/fingerprint-submissions"
              payload: { registration_request_id: "${req_cm_id}", submission_channel: "ELECTRONIC" }
              as: RegistrationPrincipal
              captures: { fp_cm_id: $.data.id }
            - call: "POST /registration-desk/fingerprint-submissions/${fp_cm_id}/process"
              payload: { outcome: "CLEARED" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_cm_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-cm"
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_cm_id}", exam_code: "SIE" }
              as: RegistrationPrincipal
              captures: { sie_cm_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_cm_id}", exam_code: "S66" }
              as: RegistrationPrincipal
              captures: { s66_cm_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_cm_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-03T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_sie_cm: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_sie_cm}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${s66_cm_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-03T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_s66_cm: $.data.id }
            - call: "POST /registration-desk/exam-windows/${win_s66_cm}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_cm_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-cm"
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/termination-filings"
              payload: { registration_request_id: "${req_cm_id}", termination_reason: "VOLUNTARY", termination_date: "2026-06-03" }
              as: RegistrationPrincipal
              as_user_id: "rp-cm-filer"
              captures: { u5_cm_id: $.data.id }
            - call: "POST /registration-desk/u5-comments"
              payload: { termination_filing_id: "${u5_cm_id}", comment_text: "He was fired for cause after the incident." }
              as: RegistrationPrincipal
              captures: { cmt_cm_id: $.data.id, cmt_disp: $.data.disposition }
          trigger:
            - call: "POST /registration-desk/termination-filings/${u5_cm_id}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-cm-closer"
              captures: { err_close: $.data.error_id }
          assert:
            - "captured cmt_disp == INCONSISTENT (comment_accuracy_check found 'fired' under reason VOLUNTARY)"
            - "error_id == ERR_INVALID_STATE — close blocked while any comment is INCONSISTENT"

      - name: inquiry_late_response_rejected
        claim_type: temporal_validation
        grounds:
          - state_machines.RegulatoryInquiry.PENDING_RESPONSE_to_RESPONDED
          - errors[ERR_TEMPORAL_VIOLATION]
        distinguishing_aspect: "Responding after response_due_at (15 business days from creation) is rejected with ERR_TEMPORAL_VIOLATION even though the state edge exists."
        test_recipe:
          setup: ["firm, applicant, SUBMITTED request; inquiry created 2026-08-03 (Mon), routed; clock advanced to 2026-08-25 (one business day past the 2026-08-24 due date)"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3109", legal_name: "Late Firm" }
              as: SystemOperator
              captures: { firm_lt_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3110", full_name: "Late Rep", date_of_birth: "1987-12-12" }
              as: RegistrationPrincipal
              captures: { app_lt_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_lt_id}", firm_id: "${firm_lt_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_lt_id: $.data.id }
            - call: "POST /registration-desk/jurisdiction-selections"
              payload: { registration_request_id: "${req_lt_id}", jurisdiction_code: "CA", jurisdiction_type: "STATE" }
              as: RegistrationPrincipal
            - call: "POST /registration-desk/registration-requests/${req_lt_id}/submit"
              payload: {}
              as: RegistrationPrincipal
              as_user_id: "rp-lt"
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/regulatory-inquiries"
              payload: { subject_filing_type: "REGISTRATION_REQUEST", subject_filing_id: "${req_lt_id}", inquiry_text: "Regulator seeks clarification on U4 answers." }
              as: Regulator
              captures: { inq_lt_id: $.data.id }
            - call: "POST /registration-desk/regulatory-inquiries/${inq_lt_id}/route"
              payload: {}
              as: SystemOperator
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/regulatory-inquiries/${inq_lt_id}/respond"
              payload: { response_text: "Late but complete response to the inquiry." }
              as: ComplianceOfficer
              captures: { err_lt: $.data.error_id }
          assert:
            - "RegulatoryInquiry.${inq_lt_id}.response_due_at date component == 2026-08-24 (15 business days from 2026-08-03)"
            - "error_id == ERR_TEMPORAL_VIOLATION with http 422 (respond attempted 2026-08-25 > due 2026-08-24)"

      - name: exam_window_out_of_window_result_rejected
        claim_type: temporal_validation
        grounds:
          - state_machines.ExamRequirement.SCHEDULED_to_PASSED
          - errors[ERR_TEMPORAL_VIOLATION]
        distinguishing_aspect: "record-result PASS before window_start or at/after window_end (half-open [start, end)) is rejected; at exactly window_end it is rejected."
        test_recipe:
          setup: ["SIE requirement SCHEDULED with window 2026-06-10T00:00:00Z..2026-06-11T00:00:00Z; clock at exactly window_end"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3111", legal_name: "Win Firm" }
              as: SystemOperator
              captures: { firm_wn_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3112", full_name: "Win Rep", date_of_birth: "1988-01-13" }
              as: RegistrationPrincipal
              captures: { app_wn_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_wn_id}", firm_id: "${firm_wn_id}", registration_category: "RR" }
              as: RegistrationPrincipal
              captures: { req_wn_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
              payload: { registration_request_id: "${req_wn_id}", exam_code: "SIE" }
              as: RegistrationPrincipal
              captures: { sie_wn_id: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /registration-desk/exam-windows"
              payload: { exam_requirement_id: "${sie_wn_id}", window_start: "2026-06-10T00:00:00Z", window_end: "2026-06-11T00:00:00Z" }
              as: RegistrationPrincipal
              captures: { win_wn: $.data.id }
            - call: "POST /registration-desk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /registration-desk/exam-windows/${win_wn}/record-result"
              payload: { result: "PASS" }
              as: SystemOperator
              captures: { err_wn: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPORAL_VIOLATION (current time == window_end is outside the half-open [start, end) interval)"

      - name: exam_requirement_initial_state_and_waiver
        claim_type: valid_transition
        grounds:
          - state_machines.ExamRequirement.REQUIRED_to_WAIVED
        distinguishing_aspect: "A freshly created requirement starts REQUIRED; waive moves it to WAIVED only while the parent request is DRAFT or DEFICIENT."
        test_recipe:
          setup: ["request in DRAFT with an S24 requirement"]
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "3113", legal_name: "Waive Firm" }
              as: SystemOperator
              captures: { firm_wv_id: $.data.id }
            - call: "POST /registration-desk/applicants"
              payload: { crd_number: "3114", full_name: "Waive Rep", date_of_birth: "1989-02-14" }
              as: RegistrationPrincipal
              captures: { app_wv_id: $.data.id }
            - call: "POST /registration-desk/registration-requests"
              payload: { applicant_id: "${app_wv_id}", firm_id: "${firm_wv_id}", registration_category: "PRINCIPAL" }
              as: RegistrationPrincipal
              captures: { req_wv_id: $.data.id }
            - call: "POST /registration-desk/exam-requirements"
