              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_FISCAL_INVALID"
      - name: benefits_send_after_deadline_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DEADLINE_MISSED]", "state_machines.BenefitsNotice.QUEUED_to_SENT"]
        distinguishing_aspect: "Sending a QUEUED notice when current_utc > send_by -> ERR_DEADLINE_MISSED (compliance protection overrides normal flow; notice must be requeued)."
        test_recipe:
          setup: ["CA case in PAYROLL_PENDING; COBRA notice QUEUED with send_by=2026-09-23T17:00Z; clock advanced past send_by"]
          setup_api_calls:
            - call: "POST /offboarding/offboarding-cases"
              payload: { employee_ref: "E-V5", case_type: "RESIGNATION", work_state_code: "CA", notice_received_date: "2026-08-01T00:00:00Z", requested_last_day: "2026-08-10T00:00:00Z", pto_balance_hours: 0.0, tenure_years: 1.0, hourly_wage_cents: 5000, intake_hr_ref: "hr-intake-1" }
