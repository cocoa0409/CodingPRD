              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_b: $.data.id }
            - call: "POST /fmc/invoices/${inv_id}/mark-paid"
              payload: {}
              as: ShipperRep
              as_user_id: "${shipper_id}"
            - call: "POST /fmc/invoices/${inv_b}/disputes"
              payload: { dispute_reason: "INCORRECT_PARTY" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { d_b: $.data.id }
            - call: "POST /fmc/invoice-disputes/${d_b}/respond"
              payload: { resolution: "WAIVE" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
          trigger:
            - call: "POST /fmc/invoices/${inv_id}/disputes"
              payload: { dispute_reason: "OTHER" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { err_paid: $.data.error_id }
            - call: "POST /fmc/invoices/${inv_b}/mark-paid"
              payload: {}
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { err_voided: $.data.error_id }
          assert:
            - "disputing the PAID invoice fails: 409 ERR_INVOICE_NOT_DISPUTABLE"
            - "paying the VOIDED invoice fails: 409 ERR_INVOICE_NOT_PAYABLE"
            - "Invoice.${inv_id} stays PAID and Invoice.${inv_b} stays VOIDED"

      - name: disputed_invoice_rejects_markpaid_until_resolved
