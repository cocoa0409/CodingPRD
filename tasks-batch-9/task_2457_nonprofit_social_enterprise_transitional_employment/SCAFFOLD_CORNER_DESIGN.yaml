      - name: rescreen_waitlisted_referral_to_eligible
        claim_type: valid_transition
        grounds:
          - state_machines.Referral.transitions.WAITLISTED_to_ELIGIBLE
          - calculations.referral_eligibility_score
          - endpoints[POST /referrals/{referralId}/screen]
        distinguishing_aspect: |
          The branching_with_revisit shape: the WAITLISTED branch deliberately skips the score floor,
          so a 49.00 candidate is parked and a later re-screen with one more available hour (22 h
          instead of 21 h) scores exactly 50.00 and moves WAITLISTED -> ELIGIBLE, overwriting
          screened_at and decided_by_user_id.
        test_recipe:
          setup:
            - "One TIER_2 partner (multiplier 1.00) with quota 5."
            - "One referral parked in WAITLISTED with eligibility_score 49.00 (2 barriers, fpl_ratio 1.5905 -> 15 income points, 21 h -> 10 availability points)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /referral-partners"
              payload: { organization_name: "Midtown Bridge", mou_tier: "TIER_2", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-101", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], household_income_cents: 200000, household_size: 1, hours_available_per_week: 21 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "WAITLISTED", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], verified_household_income_cents: 200000, verified_household_size: 1, verified_hours_available_per_week: 21 }
              as: IntakeSpecialist
              as_user_id: "intake-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], verified_household_income_cents: 200000, verified_household_size: 1, verified_hours_available_per_week: 22 }
              as: IntakeSpecialist
              as_user_id: "intake-2"
          assert:
            - "the WAITLISTED screen had stored eligibility_score == 49.00, priority_band == \"BAND_C\", screened_at == \"2026-09-07T00:00:00Z\", decided_by_user_id == \"intake-1\""
            - "HTTP 200 and data.status == \"ELIGIBLE\""
            - "data.eligibility_score == 50.00 ((2*12 + 15 + 11) * 1.00) and data.priority_band == \"BAND_B\""
            - "data.fpl_ratio == 1.5905 (200000*12 / 1509000) and data.hours_available_per_week == 22"
            - "data.screened_at == \"2026-09-08T00:00:00Z\" and data.decided_by_user_id == \"intake-2\" (both overwritten)"

