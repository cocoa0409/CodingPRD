      - name: requests_with_no_role_header_are_unauthenticated_before_anything_else_runs
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority 1 ERR_UNAUTHENTICATED]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Authentication is strictly ahead of authorisation, resolution and state: a request with no
          X-User-Role header is 401 ERR_UNAUTHENTICATED and never 403 ERR_UNAUTHORIZED, on a plain read
          AND on a mutating action that the anonymous caller would also have been forbidden to take. The
          rejected activate must leave no trace - the lease is still APPROVED at its original version.
          
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One APPROVED lease exists on G-ACMI."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
