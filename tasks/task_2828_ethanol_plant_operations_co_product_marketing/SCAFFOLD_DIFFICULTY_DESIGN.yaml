  - rule_id: cross_entity_state_dependency
    instances:

      - name: settle_requires_contract_priced
        grounds:
          - state_machines.CornPurchaseContract.pricing_status.UNPRICED_to_PRICED
          - state_machines.CornDelivery.grading_status.GRADED_to_SETTLED
          - validations[priority=42]
          - errors[ERR_CONTRACT_NOT_PRICED]
          - calculations.corn_delivery_settlement
        distinguishing_aspect: |
          Settling a GRADED delivery is gated on a *different* entity's *other*
          state dimension: the parent contract's pricing_status must be PRICED.
          The delivery itself is in a perfectly legal state, so the failure can
          only come from the parent's pricing dimension.
        test_recipe:
          setup:
            - "Plant exists; contract C-1 is created for 200000.00 bushels at basis -18.0 and left UNPRICED."
            - "One delivery TK-0001 is weighed at 78640.00 gross / 26000.00 tare and graded at basis quality (moisture 15.00, test weight 54.0, foreign material 3.00, damage 5.00), so it is GRADED with 940.00 net dry bushels and zero discounts."
