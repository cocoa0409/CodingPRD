            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt2}", treatment_plan_id: "${pl2}", template_id: "${tp1}", service_date: "2026-08-10", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 600, actual_start_minute: 600, actual_end_minute: 692, cycle_number: 1 }
              as: Scheduler
              captures: { ah2: $.data.id }
          trigger:
            - call: "GET /infusion-centers/${ctr}/chair-billing-summary"
              payload: { service_date: "2026-08-10" }
              as: MedicalDirector
              captures: { units: $.data.day_billable_units, cents: $.data.day_billable_cents }
          assert:
            - "Appointment.${ah1}.billable_chair_units == 17"
            - "Appointment.${ah2}.billable_chair_units == 7"
            - "response completed_appointment_count == 2"
            - "response day_billable_units == 24 — ceil-then-sum; the forbidden sum-then-ceil order yields 23"
            - "response day_billable_cents == 216000 — 24 * 9000; the forbidden order yields 207000"

      - name: cancellation_charge_share_tier_keyed_on_provisional_total_mode_c
        mode: c
        grounds:
          - calculations.cancellation_charge
          - state_machines.DrugPreparation.transitions.PREPARED_to_WASTED
          - entities.Appointment.fields.cancellation_charge_cents
          - entities.Appointment.fields.late_cancellation
          - entities.Patient.fields.waste_liability_cents
        distinguishing_aspect: |
          Mode (c) — a conditional branch whose SELECTOR KEY changes the answer: the
          patient-share tier is looked up on the provisional total (2500 + 24000 = 26500,
          which is above the 25000 tier edge and therefore 0.35), not on waste_cost_cents
          alone (24000, which sits inside the middle tier at 0.20). Keying the branch on
          the wrong quantity yields 7300 instead of the correct 10900 from identical inputs.
        test_recipe:
          setup:
            - "One center, one AVAILABLE chair, one nurse, and Drug Three (iron sucrose: base 60 / min 45 / premed 0 / obs-first 30 / acuity 1 / stability 120 minutes / unit cost 12000 cents / no lab gate)."
