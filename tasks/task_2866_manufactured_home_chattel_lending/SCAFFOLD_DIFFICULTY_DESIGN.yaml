          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default (no clock calls needed)."
            - "One Community with lot_count 96."
            - "An incumbent unit on lot B-07 occupying [2026-08-01, 2026-12-31], i.e. blocked through the 7-day turnover buffer ending 2027-01-07."
