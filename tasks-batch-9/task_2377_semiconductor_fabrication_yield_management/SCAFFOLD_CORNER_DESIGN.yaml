              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 150.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq1: $.data.id, hsp0: $.data.hours_since_pm, pu0: $.data.purge_until }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq1}", chamber_code: "CH_L1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_l1: $.data.id }
            - call: "POST /fab/chambers/${ch_l1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/equipment/${eq1}/pm-start"
              payload: { pm_reason: "Scheduled chamber clean" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { st_pm: $.data.state, pstart: $.data.pm_started_at }
          trigger:
            - call: "POST /fab/equipment/${eq1}/pm-complete"
              payload: {}
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { st: $.data.state, cap: $.data.available_capacity_hours, hsp: $.data.hours_since_pm, pu: $.data.purge_until }
          assert:
            - "${hsp0} == 150.0 and ${pu0} == null"
            - "${st_pm} == PM and ${pstart} == 2026-08-01T00:00:00Z"
            - "HTTP status == 200"
