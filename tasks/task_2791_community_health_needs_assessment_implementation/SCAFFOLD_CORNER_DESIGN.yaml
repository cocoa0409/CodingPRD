        test_recipe:
          setup:
            - "AssessmentCycle in PRIORITIZATION with one SUFFICIENT BEHAVIORAL_HEALTH indicator (overall 18.6 vs benchmark 12.0, subgroups 24.8 and 15.5) and two COMPLETED interviews"
