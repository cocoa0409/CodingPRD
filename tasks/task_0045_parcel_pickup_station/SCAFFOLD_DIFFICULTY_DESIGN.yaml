scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: storage_fee_provisional_vs_final_on_parcel
        grounds:
          - calculations.storage_fee
          - state_machines.Parcel.SHELVED_to_OVERTIME
          - state_machines.Parcel.OVERTIME_to_PICKED_UP
          - entities.Parcel.fields.storage_fee_total
          - entities.Parcel.fields.storage_fee_locked
        distinguishing_aspect: |
          The same parcel produces a provisional storage_fee_total when the
          overtime sweep recomputes against now(), but a different final value
          when the OVERTIME->PICKED_UP transition pins the timestamp; the two
          variants operate on entity domain Parcel (logistics) with the
          difference visible at storage_fee_locked transitioning false->true.
        test_recipe:
          setup:
            - "Create Station S with free_storage_hours=72."
            - "Create ShelfZone Z with 1 row x 1 col, zone_type=STANDARD."
            - "Inbound Parcel P (size_class=M); shelved at clock T0."
            - "Advance clock by 72h + 30h (free + 30 overdue)."
          trigger:
            - "POST /_sweep/run -> Parcel SHELVED->OVERTIME; storage_fee provisional = 18.00."
            - "Advance clock by another 20h (total overdue 50h)."
            - "POST /parcels/{P}/pickup with valid code -> OVERTIME->PICKED_UP."
          assert:
            - "After sweep: Parcel.storage_fee_total == 18.00 AND storage_fee_locked == false."
            - "After pickup: Parcel.storage_fee_total == 38.00 AND storage_fee_locked == true."
            - "A second POST /_sweep/run after pickup does NOT change storage_fee_total."

      - name: quality_composite_vs_adjustment_on_billing_period
        grounds:
          - calculations.quality_composite
          - calculations.quality_adjustment
          - state_machines.BillingPeriod.OPEN_to_CLOSED
          - entities.QualityAssessment.fields.composite_score
          - entities.BillingPeriod.fields.quality_adjustment_factor
        distinguishing_aspect: |
          quality_composite operates on entity domain QualityAssessment and
          produces a continuous score in [0,1]; quality_adjustment operates on
          entity domain BillingPeriod and discretizes the same composite into a
          stepped multiplier {0.85, 0.95, 1.00, 1.05} — same inputs, different
          domain, different output type and tier-boundary semantics.
        test_recipe:
          setup:
            - "Create Station + complete a month of inbound (5 parcels, 1 overdue) producing rates mis=0, lost=0, complaint=0, response=1."
            - "Advance clock past period_end."
            - "POST /stations/{S}/quality-assessments to create QA for period."
            - "POST /stations/{S}/quality-assessments/{period}/close -> composite_score = 1.00."
            - "POST /stations/{S}/billing-periods then close -> reads QA.composite_score."
          trigger:
            - "GET /stations/{S}/billing-periods/{period}"
          assert:
            - "QualityAssessment.composite_score == 1.00 (continuous)."
            - "BillingPeriod.quality_adjustment_factor == 1.05 (discrete tier)."

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: storage_fee_tiered_with_size_multiplier_mode_a
        grounds:
          - calculations.storage_fee
          - entities.Parcel.fields.size_class
          - entities.Parcel.fields.weight_grams
        distinguishing_aspect: |
          Mode (a) — formula has 3+ inputs (overdue_hours, size_class, tier
          rates) with non-linear interaction: ceiling on hours, three-tier
          rate selection (24h/72h/96h+ breakpoints), and SIZE_MULTIPLIER
          dispatch combine multiplicatively, not additively.
        test_recipe:
          setup:
            - "Create Station S free_storage_hours=72; Inbound size_class=XL Parcel P."
            - "Advance clock by 72h + 100h (100h overdue)."
          trigger:
            - "POST /_sweep/run"
            - "POST /parcels/{P}/pickup"
          assert:
            - "Parcel.storage_fee_total == 184.00"
            - "(Computed as (24*0.50 + 72*1.00 + 4*2.00) * 2.0 = 92.00*2.0 = 184.00)"

      - name: period_final_total_pinned_rounding_order_mode_b
        grounds:
          - calculations.period_final_total
          - state_machines.BillingPeriod.OPEN_to_CLOSED
          - entities.BillingPeriod.fields.final_total
        distinguishing_aspect: |
          Mode (b) — nested rounding order is PINNED: round(handover_total *
          factor, 2) FIRST, then add storage_total, then round again. The
          formula's wording ("round per-step, then sum, then round") changes
          the cents vs. a single end-round; the scaffold's `precision:` block
          forbids the single-round form.
        test_recipe:
          setup:
            - "Period with handover_fee_total = 4.00 (5 parcels x 0.80) and storage_fee_total = 18.00."
            - "QualityAssessment closes with composite_score == 0.95 (factor=1.05)."
          trigger:
            - "POST /stations/{S}/billing-periods/{p}/close"
          assert:
            - "BillingPeriod.quality_adjustment_factor == 1.05"
            - "adjusted_handover step = round(4.00 * 1.05, 2) == 4.20"
            - "BillingPeriod.final_total == 22.20 (= 4.20 + 18.00)"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: parcel_branching_pickup_or_return_or_dispose
        grounds:
          - state_machines.Parcel.AWAITING_RETURN_to_PICKED_UP
          - state_machines.Parcel.AWAITING_RETURN_to_RETURNED
          - state_machines.Parcel.AWAITING_RETURN_to_DISPOSED
        distinguishing_aspect: |
          Parcel exhibits branching (fork) from AWAITING_RETURN to three
          divergent terminal states {PICKED_UP, RETURNED, DISPOSED}; each
          branch carries a distinct side-effect set (auto-void return,
          run-shipment cascade, or grace-window write-off), not a linear
          A->B->C pipeline.
        test_recipe:
          setup:
            - "Create three independent parcels P1, P2, P3 each driven to AWAITING_RETURN by clock advance."
          trigger:
            - "On P1: POST /parcels/{P1}/pickup with valid code -> AWAITING_RETURN->PICKED_UP."
            - "On P2: drive return flow to SHIPPED -> AWAITING_RETURN->RETURNED."
            - "On P3: advance clock past DISPOSAL_GRACE_HOURS then POST /parcels/{P3}/dispose -> AWAITING_RETURN->DISPOSED."
          assert:
            - "P1.status == PICKED_UP AND any REQUESTED ReturnShipment for P1 has status == COURIER_DECLINED."
            - "P2.status == RETURNED AND ReturnShipment.status == SHIPPED."
            - "P3.status == DISPOSED AND no SHIPPED ReturnShipment exists for P3."

      - name: billing_period_cycle_closed_disputed_closed
        grounds:
          - state_machines.BillingPeriod.CLOSED_to_DISPUTED
          - state_machines.BillingPeriod.DISPUTED_to_CLOSED
        distinguishing_aspect: |
          BillingPeriod has a cycle: CLOSED -> DISPUTED -> CLOSED, driven by
          child Bill.status oscillating into and out of DISPUTED. A linear
          A->B->C pipeline cannot return to CLOSED after entering DISPUTED.
        test_recipe:
          setup:
            - "Period closed with one ISSUED Bill B."
          trigger:
            - "POST /bills/{B}/dispute -> period auto-transitions CLOSED->DISPUTED."
            - "POST /bills/{B}/resolve-dispute -> period auto-transitions DISPUTED->CLOSED."
          assert:
            - "BillingPeriod.status sequence observed: CLOSED -> DISPUTED -> CLOSED."

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: inbound_cascade_depth4
        grounds:
          - state_machines.Parcel.UNREGISTERED_to_SHELVED
          - calculations.pickup_code_minting
          - entities.PickupCode.fields.code
          - entities.ReminderRecord.fields.tier
          - entities.SystemEventOutbox.fields.event_name
          - entities.Station.fields.current_occupancy
        distinguishing_aspect: |
          Inbound mutation cascades transitively: (1) Parcel writes shelf
          fields, which (2) bumps Station.current_occupancy and
          ShelfZone.occupied_slots, which (3) triggers pickup_code_minting
          producing a PickupCode row, which (4) emits a ReminderRecord and a
          SystemEventOutbox(IM, PICKUP_CODE_SENT). Each link is caused by the
          previous link's write, not by the original action; depth >= 4.
        test_recipe:
          setup:
            - "Station S (capacity=5, occupancy=0); ShelfZone Z (1x1)."
          trigger:
            - "POST /stations/{S}/parcels (accept_and_shelve, size_class=M)"
          assert:
            - "Parcel.status == SHELVED; Station.current_occupancy == 1; ShelfZone.occupied_slots == 1."
            - "Exactly one PickupCode row exists for parcel with status == ACTIVE and 6-digit code."
            - "Exactly one ReminderRecord (tier=T1_INITIAL, channel=SMS, triggered_by=INBOUND) exists."
            - "Exactly one SystemEventOutbox(target=IM, event=PICKUP_CODE_SENT) exists for the parcel."

      - name: long_stay_cascade_depth3
        grounds:
          - state_machines.Parcel.OVERTIME_to_AWAITING_RETURN
          - calculations.reminder_schedule
          - entities.Parcel.fields.long_stay_flagged_at
          - entities.ReminderRecord.fields.tier
          - state_machines.Parcel.AWAITING_RETURN_to_DISPOSED
        distinguishing_aspect: |
          Triggered by the long-stay sweep (different trigger from inbound):
          (1) sweep flips Parcel to AWAITING_RETURN, which (2) sets
          long_stay_flagged_at and emits a T4_RETURN_CONFIRM ReminderRecord,
          which (3) gates the later DISPOSE precondition that depends on
          long_stay_flagged_at + grace. Depth >= 3, with each link caused by
          the preceding link's write.
        test_recipe:
          setup:
            - "Parcel P shelved; advance clock 168h."
          trigger:
            - "POST /_sweep/run"
            - "Advance clock by 240h after long_stay_flagged_at; POST /parcels/{P}/dispose"
          assert:
            - "After sweep: Parcel.status == AWAITING_RETURN AND long_stay_flagged_at != null."
            - "After sweep: a ReminderRecord(tier=T4_RETURN_CONFIRM) exists for P."
            - "After dispose: Parcel.status == DISPOSED."

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pickup_with_bad_code_on_picked_up_parcel
        grounds:
          - validations[priority=6]
          - validations[priority=14]
        distinguishing_aspect: |
          Category pair (state vs business_safety). When a pickup attempt
          carries an invalid code on a parcel already in PICKED_UP, state
          (priority 6) MUST fire before business_safety (priority 14); the
          test asserts ERR_INVALID_PARCEL_STATE, not ERR_PICKUP_VERIFICATION_FAILED.
        test_recipe:
          setup:
            - "Parcel P picked up successfully."
          trigger:
            - "POST /parcels/{P}/pickup with verification_method=code, code=999999"
          assert:
            - "HTTP 409 AND body.data.error_id == 'ERR_INVALID_PARCEL_STATE'."
            - "NOT ERR_PICKUP_VERIFICATION_FAILED."

      - name: business_referential_vs_business_constraint_zone_mismatch_full
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair (business_referential vs business_constraint). When
          inbound supplies a shelf_zone_id that belongs to a different station
          AND that zone happens to also be full, the referential check
          (priority 9) MUST fire before the capacity check (priority 11);
          the test asserts ERR_SHELF_ZONE_STATION_MISMATCH, not ERR_SHELF_ZONE_FULL.
        test_recipe:
          setup:
            - "Stations S1, S2; ShelfZone Z2 (1x1) under S2 that is already full of a parcel."
          trigger:
            - "POST /stations/{S1}/parcels with shelf_zone_id = Z2.id, shelf_position='R01-C01'"
          assert:
            - "HTTP 422 AND body.data.error_id == 'ERR_SHELF_ZONE_STATION_MISMATCH'."

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: free_storage_deadline_strict_inequality
        grounds:
          - calculations.storage_fee
          - state_machines.Parcel.SHELVED_to_OVERTIME
        distinguishing_aspect: |
          Numeric threshold metric: pickup AT free_storage_deadline (t ==
          deadline) yields storage_fee_total == 0.00; pickup at t = deadline
          + 1 second yields ceil(1s/1h)=1 overdue hour and 0.50 fee. Tests
          ceil-on-hours and strict > deadline semantics.
        test_recipe:
          setup:
            - "Parcel P shelved at T0, free_storage_hours=72, size_class=M."
            - "Advance clock to exactly T0 + 72h (deadline)."
          trigger:
            - "POST /parcels/{P}/pickup -> A"
            - "(Separate parcel P2 same setup; advance clock 1 second beyond deadline; pickup) -> B"
          assert:
            - "A.storage_fee_total == 0.00"
            - "B.storage_fee_total == 0.50"

      - name: empty_zone_collection_inbound_rejection
        grounds:
          - validations[priority=4]
          - entities.ShelfZone
        distinguishing_aspect: |
          Empty-collection metric (different endpoint): inbound attempted
          against a station with zero shelf zones MUST be rejected with
          ERR_RESOURCE_NOT_FOUND (zone reference cannot resolve) rather than
          silently succeeding with shelf_zone_id=null. Tests "empty set" edge.
        test_recipe:
          setup:
            - "Station S with NO ShelfZone rows."
          trigger:
            - "POST /stations/{S}/parcels with shelf_zone_id='00000000-0000-0000-0000-000000000000', shelf_position='R01-C01', exception_type=NONE"
          assert:
            - "HTTP 404 AND body.data.error_id == 'ERR_RESOURCE_NOT_FOUND'."

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: parcel_transition_gated_by_station_status
        grounds:
          - state_machines.Parcel.UNREGISTERED_to_SHELVED
          - validations[priority=5]
          - entities.Station.fields.status
        distinguishing_aspect: |
          Entity pair (Parcel -> Station): Parcel UNREGISTERED->SHELVED is
          valid only when Station.status == ACTIVE. Suspending the station
          forces inbound to fail with ERR_STATION_NOT_ACTIVE even though the
          parcel itself is in the correct precondition state.
        test_recipe:
          setup:
            - "Station S, ShelfZone Z (1x1); PATCH /stations/{S} status=SUSPENDED."
          trigger:
            - "POST /stations/{S}/parcels with valid body."
          assert:
            - "HTTP 409 AND body.data.error_id == 'ERR_STATION_NOT_ACTIVE'."

      - name: billing_period_close_gated_by_quality_assessment_status
        grounds:
          - state_machines.BillingPeriod.OPEN_to_CLOSED
          - validations[priority=18]
          - entities.QualityAssessment.fields.status
        distinguishing_aspect: |
          Different entity pair (BillingPeriod -> QualityAssessment): close
          is gated by QualityAssessment.status == CLOSED for the same
          (station_id, period_yyyymm); a DRAFT QA blocks the close even when
          period_end is past.
        test_recipe:
          setup:
            - "Station S, BillingPeriod period_yyyymm=202601, clock advanced past period_end."
            - "Create QualityAssessment for the period but do NOT close it (status=DRAFT)."
          trigger:
            - "POST /stations/{S}/billing-periods/202601/close"
          assert:
            - "HTTP 422 AND body.data.error_id == 'ERR_QUALITY_ASSESSMENT_NOT_CLOSED'."

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: shelf_position_exact_occupancy_overlap
        grounds:
          - concurrency_rules[shelf]
          - validations[priority=10]
          - entities.Parcel.fields.shelf_position
          - entities.ShelfZone
        distinguishing_aspect: |
          Interval semantics: discrete point-occupancy on resource
          (shelf_zone_id, shelf_position). Two parcel rows whose status is
          IN {SHELVED, OVERTIME, AWAITING_RETURN} for the SAME slot are
          treated as overlapping (point-conflict, no adjacency/buffer
          arithmetic). Slot becomes free instantly on PICKED_UP/RETURNED/DISPOSED.
        test_recipe:
          setup:
            - "Station S, ShelfZone Z (1x1); inbound Parcel P1 occupying R01-C01."
          trigger:
            - "POST /stations/{S}/parcels with same shelf_zone_id=Z, shelf_position='R01-C01'."
          assert:
            - "HTTP 409 AND body.data.error_id == 'ERR_SHELF_POSITION_OCCUPIED'."

      - name: pickup_code_active_window_uniqueness
        grounds:
          - concurrency_rules[reissue]
          - calculations.pickup_code_minting
          - entities.PickupCode.fields.code
          - entities.PickupCode.fields.status
        distinguishing_aspect: |
          Different interval semantics: aggregate-capacity uniqueness over
          PickupCode rows where status == ACTIVE. The interval is a logical
          status-window (not a clock window): two ACTIVE codes with the same
          6-digit value at any single instant are an overlap; reissuing flips
          the prior code to REISSUED so the new code can re-use the value if
          desired. Different resource entity (PickupCode) and different
          interval geometry (status-window vs slot-point).
        test_recipe:
          setup:
            - "Parcel P shelved (ACTIVE PickupCode C1 minted automatically)."
          trigger:
            - "POST /parcels/{P}/pickup-codes (reason=LOST) -> new code C2 minted."
          assert:
            - "Exactly one PickupCode for P has status == ACTIVE (= C2)."
            - "C1.status == REISSUED AND C1.superseded_by == C2.id."

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: station_occupancy_conserved_on_inbound_then_pickup
        grounds:
          - state_machines.Parcel.UNREGISTERED_to_SHELVED
          - state_machines.Parcel.SHELVED_to_PICKED_UP
          - entities.Station.fields.current_occupancy
          - entities.ShelfZone.fields.occupied_slots
        distinguishing_aspect: |
          Conserved quantity: capacity counters (Station.current_occupancy
          and ShelfZone.occupied_slots). Invariant: after any complete
          inbound + pickup pair on the same parcel, current_occupancy ==
          starting_value AND occupied_slots == starting_value. Forward
          mutation (+1) and compensating mutation (-1) must net to zero.
        test_recipe:
          setup:
            - "Station S, ShelfZone Z, starting Station.current_occupancy == 0, ShelfZone.occupied_slots == 0."
          trigger:
            - "POST /stations/{S}/parcels (inbound + shelve)."
            - "POST /parcels/{P}/pickup."
          assert:
            - "Station.current_occupancy == 0 after pickup."
            - "ShelfZone.occupied_slots == 0 after pickup."

      - name: storage_fee_conserved_under_dispute_then_resolve_no_adjustment
        grounds:
          - state_machines.Bill.ISSUED_to_DISPUTED
          - state_machines.Bill.DISPUTED_to_RESOLVED
          - entities.Bill.fields.storage_fee_amount
          - entities.BillingPeriod.fields.final_total
        distinguishing_aspect: |
          Different conserved quantity: monetary total. Invariant: if a
          recipient Bill is disputed and then resolved with no
          adjustment_amount, BillingPeriod.final_total MUST equal its value
          immediately after CLOSE — the dispute/resolve pair leaves the
          monetary total unchanged. (Distinct from capacity invariant which
          conserves an integer counter on a different entity.)
        test_recipe:
          setup:
            - "Station S; period closed with one RECIPIENT Bill B carrying storage_fee_amount = 18.00, period final_total = 22.20 (factor 1.05, handover=4.00, storage=18.00)."
          trigger:
            - "POST /bills/{B}/dispute (reason='wrong fee')"
            - "POST /bills/{B}/resolve-dispute (no adjustment_amount)"
          assert:
            - "Bill.storage_fee_amount == 18.00 (unchanged)."
            - "BillingPeriod.final_total == 22.20 (unchanged)."
            - "BillingPeriod.status path observed: CLOSED -> DISPUTED -> CLOSED."
