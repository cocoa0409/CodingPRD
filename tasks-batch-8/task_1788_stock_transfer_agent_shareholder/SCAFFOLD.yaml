scenario: |
  Stock Transfer Agent & Shareholder Recordkeeping (Computershare style transfer agent): registered holder record & book-entry (DRS) positions, transfer request review & medallion guarantee, lost certificate & indemnity bond, dividend payment & address/tax withholding, restricted stock legend removal, escheatment of unclaimed shares & dividends, shareholder inquiry & statement, issuer reporting & record date list

domain_name: "stock-transfer-agent"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_note: |
    Deliberately calibrated above the Expert band of §0.4 (which is a guideline, not a hard
    rule): 13 entities, 58 endpoints, 38 error codes, 6 calculation rules with dual variants
    in two entity domains and combinatorial modes (a), (b) and (c), 10 state machines of
    which 6 are non-linear (cycles), 2 OCC concurrency rules, and segregation-of-duties
    constraints on both transfer approval and lost-certificate claim approval.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Issuer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the issuing company" }
      - { name: cusip, type: string, source: input, description: "9-character CUSIP identifier", constraints: "unique across all issuers" }
      - { name: ticker, type: string, source: input, description: "Exchange ticker symbol" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "one of {ACTIVE, SUSPENDED}" }
      - { name: shares_outstanding, type: integer, source: input, description: "Total issued shares; conservation anchor — must equal the sum of seeded position shares" }
      - { name: par_value_cents, type: integer, source: input, description: "Par value per share in cents", default: 0 }
      - { name: current_market_price_cents, type: integer, source: input, description: "Current market price per share in cents; PATCHable by IssuerOfficer; read by bond/valuation calcs" }
      - { name: total_book_entry_shares, type: integer, source: computed, description: "Sum of Position.book_entry_shares over all positions of this issuer" }
      - { name: total_certificated_shares, type: integer, source: computed, description: "Sum of Position.certificated_shares over all positions of this issuer" }

  - name: ShareholderAccount
    parent: null
    common_fields: true
    fields:
      - { name: holder_name, type: string, source: input, description: "Registered holder legal name" }
      - { name: address_line1, type: string, source: input, description: "Mailing address line 1" }
      - { name: city, type: string, source: input, description: "Mailing city" }
      - { name: state_code, type: string, source: input, description: "2-letter US state of residence; drives dormancy period lookup" }
      - { name: postal_code, type: string, source: input, description: "Postal code" }
      - { name: country_code, type: string, source: input, description: "ISO country code, e.g. US" }
      - { name: residency, type: enum, source: input, description: "Tax residency", default: US, constraints: "one of {US, FOREIGN}" }
      - { name: tax_id, type: string, source: input, description: "SSN/TIN as provided" }
      - { name: tin_status, type: enum, source: input, description: "W-9 certification status", default: MISSING, constraints: "one of {MISSING, CERTIFIED, UNCERTIFIED}" }
      - { name: treaty_tier, type: enum, source: input, description: "NRA treaty tier; only relevant when residency=FOREIGN", default: STANDARD, constraints: "one of {STANDARD, TREATY}" }
      - { name: account_status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "one of {ACTIVE, RESTRICTED, DORMANT, ESCHEATED}" }
      - { name: address_verified, type: boolean, source: system, description: "False after a dividend payment is returned undeliverable; set true by PATCH", default: true }
      - { name: last_qualifying_contact_date, type: datetime, source: system, description: "Set to created_at at registration; refreshed by PATCH, inquiry creation, dividend cashing" }
      - { name: pending_transfer_count, type: integer, source: system, description: "Open transfer requests; incremented on transfer create (bumps version), decremented on terminal transfer", default: 0 }
      - { name: stale_dividend_cents, type: integer, source: system, description: "Sum of gross_cents of this account's STALE_DATED dividend payments not yet escheated", default: 0 }
      - { name: dormancy_years, type: integer, source: computed, description: "Dormancy period in years looked up from state_code via DORMANCY_YEARS table" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ShareholderAccount.id; owner of the position" }
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; security held" }
      - { name: book_entry_shares, type: integer, source: input, description: "DRS (uncertificated) shares; seeded at creation, mutated by flows" }
      - { name: restricted_shares, type: integer, source: input, description: "Subset of book_entry_shares carrying a restrictive legend", default: 0, constraints: "0 <= restricted_shares <= book_entry_shares" }
      - { name: certificated_shares, type: integer, source: system, description: "Shares held in physical certificate form", default: 0 }
      - { name: total_shares, type: integer, source: computed, description: "book_entry_shares + certificated_shares" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "one of {ACTIVE, CLOSED}" }
      - { name: pending_legend_removal_count, type: integer, source: system, description: "Open legend-removal requests; bumped on create (bumps version)", default: 0 }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> ShareholderAccount.id; copied from the position at withdrawal" }
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; copied from the position at withdrawal" }
      - { name: certificate_number, type: string, source: system, description: "Server-generated certificate number" }
      - { name: share_quantity, type: integer, source: input, description: "Face share quantity moved out of book-entry at withdrawal" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ISSUED, constraints: "one of {ISSUED, LOST_REPORTED, REPLACED, CANCELLED}" }
      - { name: legend_restricted, type: boolean, source: input, description: "Whether the certificate bears a restrictive legend", default: false }
      - { name: issued_at, type: datetime, source: system, description: "Timestamp of issuance" }
      - { name: lost_reported_at, type: datetime, source: system, description: "Timestamp the stop-transfer order was placed; null unless LOST_REPORTED" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: from_account_id, type: string, source: input, description: "FK -> ShareholderAccount.id; transferor" }
      - { name: to_account_id, type: string, source: input, description: "FK -> ShareholderAccount.id; transferee" }
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; security being transferred" }
      - { name: source_certificate_id, type: string, source: input, description: "FK -> Certificate.id; optional — set for certificated-source transfers, omitted for DRS book transfers" }
      - { name: share_quantity, type: integer, source: input, description: "Shares to transfer; must equal certificate face quantity when source_certificate_id is set" }
      - { name: transfer_value_cents, type: integer, source: computed, description: "share_quantity x Issuer.current_market_price_cents, frozen at creation" }
      - { name: status, type: enum, source: system, description: "Review lifecycle", default: UNDER_REVIEW, constraints: "one of {UNDER_REVIEW, MEDALLION_VERIFIED, DEFICIENT, APPROVED, SETTLED, REJECTED, CANCELLED}" }
      - { name: medallion_reference, type: string, source: input, description: "Medallion signature guarantee reference submitted at review" }
      - { name: medallion_coverage_cents, type: integer, source: input, description: "Surety coverage of the medallion stamp in cents" }
      - { name: last_examiner_id, type: string, source: system, description: "X-User-ID of the examiner who last acted (submit-medallion or flag-deficient); segregation-of-duties anchor" }
      - { name: deficiency_reason, type: string, source: input, description: "Why the request was flagged deficient" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approving supervisor" }
      - { name: settled_at, type: datetime, source: system, description: "Settlement timestamp" }

  - name: LostCertificateClaim
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: system, description: "FK -> Certificate.id; the lost certificate" }
      - { name: claimant_account_id, type: string, source: system, description: "FK -> ShareholderAccount.id; copied from certificate.account_id at filing" }
      - { name: filed_by_examiner_id, type: string, source: system, description: "X-User-ID of filing examiner (null when filed by a Shareholder); segregation-of-duties anchor" }
      - { name: loss_date, type: datetime, source: input, description: "Claimed date of loss" }
      - { name: loss_report_price_cents, type: integer, source: system, description: "Issuer.current_market_price_cents snapshotted at FILED; used by FIXED_PENALTY bond variant" }
      - { name: bond_variant, type: enum, source: input, description: "Indemnity bond basis", constraints: "one of {OPEN_PENALTY, FIXED_PENALTY}" }
      - { name: bond_amount_cents, type: integer, source: computed, description: "Per indemnity_bond_premium calculation" }
      - { name: required_premium_cents, type: integer, source: computed, description: "Tiered premium per indemnity_bond_premium calculation" }
      - { name: premium_paid_cents, type: integer, source: input, description: "Premium tendered at post-bond" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: FILED, constraints: "one of {FILED, BOND_POSTED, APPROVED, REPLACED, REJECTED, WITHDRAWN}" }
      - { name: replacement_certificate_id, type: string, source: system, description: "FK -> Certificate.id; the replacement certificate (null until issued)" }

  - name: DividendDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; declaring issuer" }
      - { name: record_date, type: datetime, source: input, description: "Holder-of-record cutoff" }
      - { name: payable_date, type: datetime, source: input, description: "Disbursement date; must be strictly after record_date" }
      - { name: amount_per_share_millicents, type: integer, source: input, description: "Dividend per share in 1/1000 cent units (1000 millicents = 1 cent)" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: DECLARED, constraints: "one of {DECLARED, ACCRUED, PAYABLE, CLOSED, VOIDED}" }
      - { name: total_eligible_shares, type: integer, source: computed, description: "Sum of eligible_shares over generated payments" }
      - { name: total_accrued_cents, type: integer, source: computed, description: "Sum of payment.gross_cents (per-payment rounded); invariant anchor, immutable after ACCRUED" }

  - name: DividendPayment
    parent: null
    common_fields: true
    fields:
      - { name: declaration_id, type: string, source: system, description: "FK -> DividendDeclaration.id" }
      - { name: account_id, type: string, source: system, description: "FK -> ShareholderAccount.id; payee" }
      - { name: eligible_shares, type: integer, source: system, description: "Record-date snapshot of Position.total_shares" }
      - { name: gross_cents, type: integer, source: computed, description: "round_half_up(eligible_shares x amount_per_share_millicents / 1000)" }
      - { name: provisional_withholding_cents, type: integer, source: computed, description: "Withholding per dividend_withholding using tin_status/residency/treaty_tier as of record date" }
      - { name: withholding_cents, type: integer, source: computed, description: "Final withholding per dividend_withholding using tin_status/residency/treaty_tier as of payable date" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - withholding_cents" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACCRUED, constraints: "one of {ACCRUED, DISBURSED, RECONCILED, RETURNED, STALE_DATED, ESCHEATED}" }
      - { name: disbursed_at, type: datetime, source: system, description: "Timestamp of disbursement (or reissue); stale-dating clock anchor" }
      - { name: returned_at, type: datetime, source: system, description: "Timestamp marked undeliverable" }

  - name: LegendRemovalRequest
    parent: null
    common_fields: true
    fields:
      - { name: position_id, type: string, source: input, description: "FK -> Position.id; the restricted position" }
      - { name: account_id, type: string, source: input, description: "FK -> ShareholderAccount.id; must equal the position's account" }
      - { name: share_quantity, type: integer, source: input, description: "Restricted shares to release" }
      - { name: rule_basis, type: enum, source: input, description: "Exemption basis", constraints: "one of {RULE_144}" }
      - { name: acquisition_date, type: datetime, source: input, description: "Date the restricted shares were acquired; holding-period anchor" }
      - { name: counsel_opinion_reference, type: string, source: input, description: "Issuer counsel opinion letter reference" }
      - { name: deficiency_reason, type: string, source: input, description: "Why the opinion was flagged deficient" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: SUBMITTED, constraints: "one of {SUBMITTED, OPINION_UNDER_REVIEW, DEFICIENT, LEGEND_REMOVED, REJECTED}" }

  - name: EscheatmentCase
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> ShareholderAccount.id; dormant account under escheatment" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: IDENTIFIED, constraints: "one of {IDENTIFIED, NOTICE_SENT, REPORTED, REMITTED, REACTIVATED}" }
      - { name: dormancy_start_date, type: datetime, source: system, description: "Account last_qualifying_contact_date at identification" }
      - { name: notice_sent_at, type: datetime, source: system, description: "Due-diligence notice timestamp" }
      - { name: report_price_cents, type: integer, source: system, description: "Issuer price frozen at REPORTED; share valuation basis" }
      - { name: share_value_cents, type: integer, source: computed, description: "Position.total_shares x report_price_cents, computed at REPORTED" }
      - { name: cash_value_cents, type: integer, source: computed, description: "Sum of gross_cents of the account's STALE_DATED payments, computed at REPORTED" }
      - { name: total_remit_cents, type: integer, source: computed, description: "share_value_cents + cash_value_cents" }

  - name: ShareholderInquiry
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ShareholderAccount.id; inquiring holder" }
      - { name: channel, type: enum, source: input, description: "Contact channel", constraints: "one of {PHONE, MAIL, EMAIL}" }
      - { name: subject, type: string, source: input, description: "Inquiry subject" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: OPEN, constraints: "one of {OPEN, IN_REVIEW, ANSWERED, CLOSED}" }
      - { name: claimed_by_agent_id, type: string, source: system, description: "X-User-ID of the ServiceAgent who claimed the inquiry" }
      - { name: answer_text, type: string, source: input, description: "Resolution text" }

  - name: TransferFreezeWindow
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; from the path" }
      - { name: start_date, type: datetime, source: input, description: "First frozen day (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Last frozen day (inclusive)" }
      - { name: reason, type: string, source: input, description: "Freeze reason" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: SCHEDULED, constraints: "one of {SCHEDULED, ACTIVE, EXPIRED}" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: entity_type, type: string, source: system, description: "Polymorphic target type name (e.g. TransferRequest)" }
      - { name: entity_id, type: string, source: system, description: "Polymorphic target id; not an FK — targets any entity" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the mutating call" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the mutating call" }
      - { name: action, type: string, source: system, description: "Endpoint action label (e.g. transfer.settle)" }
      - { name: from_state, type: string, source: system, description: "State before transition (empty for creates)" }
      - { name: to_state, type: string, source: system, description: "State after transition" }
      - { name: detail, type: string, source: system, description: "Free-form mutation summary" }
      - { name: prev_entry_hash, type: string, source: system, description: "SHA-256 of previous AuditEvent; GENESIS for the first entry" }
      - { name: entry_hash, type: string, source: system, description: "SHA-256 over prev_entry_hash + canonical fields; tamper-evident chain" }

state_machines:
  - entity: Issuer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /issuers/{id} with status=SUSPENDED"
        actor: IssuerOfficer
        preconditions: ["issuer.status == ACTIVE"]
        side_effects: ["appends AuditEvent(issuer.suspend)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /issuers/{id} with status=ACTIVE"
        actor: IssuerOfficer
        preconditions: ["issuer.status == SUSPENDED"]
        side_effects: ["appends AuditEvent(issuer.resume)"]

  - entity: ShareholderAccount
    initial_state: ACTIVE
    terminal_states: [ESCHEATED]
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /accounts/{id}/restrict"
        actor: ComplianceOfficer
        preconditions: ["account.account_status == ACTIVE"]
        side_effects: ["appends AuditEvent(account.restrict)"]
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /accounts/{id}/release-restriction"
        actor: ComplianceOfficer
        preconditions: ["account.account_status == RESTRICTED"]
        side_effects: ["appends AuditEvent(account.release)"]
      - from: ACTIVE
        to: DORMANT
        trigger: "POST /escheatment/scan (system sweep)"
        actor: system
        preconditions:
          - "account.account_status == ACTIVE"
          - "logical clock >= account.last_qualifying_contact_date + dormancy_years(account.state_code) years (inclusive >=)"
        side_effects:
          - "if account has no EscheatmentCase in {IDENTIFIED, NOTICE_SENT, REPORTED} and (position total_shares > 0 or stale_dividend_cents > 0): create EscheatmentCase IDENTIFIED (or re-arm a REACTIVATED case back to IDENTIFIED with refreshed dormancy_start_date)"
          - "appends AuditEvent(account.dormant)"
      - from: DORMANT
        to: ACTIVE
        trigger: "owner qualifying contact: PATCH /accounts/{id}, POST /inquiries, POST /dividend-payments/{id}/cash, or POST /escheatment-cases/{id}/reactivate"
        actor: Shareholder
        preconditions: ["account.account_status == DORMANT"]
        side_effects:
          - "account.last_qualifying_contact_date := logical clock"
          - "any EscheatmentCase of this account in {IDENTIFIED, NOTICE_SENT} transitions to REACTIVATED"
          - "appends AuditEvent(account.reactivate)"
      - from: DORMANT
        to: ESCHEATED
        trigger: "POST /escheatment-cases/{id}/remit (cascade)"
        actor: system
        preconditions: ["the account's EscheatmentCase is transitioning REPORTED -> REMITTED"]
        side_effects: ["appends AuditEvent(account.escheated)"]

  - entity: Position
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /escheatment-cases/{id}/remit (cascade)"
        actor: system
        preconditions: ["position.account_id == case.account_id and case transitioning REPORTED -> REMITTED"]
        side_effects:
          - "book_entry_shares := 0, restricted_shares := 0, certificated_shares := 0"
          - "Issuer.total_book_entry_shares and Issuer.total_certificated_shares recomputed (cascade hop)"

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [CANCELLED, REPLACED]
    transitions:
      - from: ISSUED
        to: LOST_REPORTED
        trigger: "POST /certificates/{id}/report-lost"
        actor: TransferExaminer
        preconditions: ["certificate.status == ISSUED"]
        side_effects:
          - "certificate.lost_reported_at := logical clock (stop-transfer order placed; open-ended occupancy begins)"
          - "creates LostCertificateClaim FILED with loss_report_price_cents := Issuer.current_market_price_cents, claimant_account_id := certificate.account_id, filed_by_examiner_id := X-User-ID when actor is TransferExaminer else null"
          - "appends AuditEvent(certificate.report_lost)"
      - from: LOST_REPORTED
        to: ISSUED
        trigger: "POST /certificates/{id}/recover"
        actor: TransferExaminer
        preconditions: ["certificate.status == LOST_REPORTED"]
        side_effects:
          - "certificate.lost_reported_at := null (stop-transfer occupancy ends)"
          - "the open LostCertificateClaim (status in {FILED, BOND_POSTED}) transitions to WITHDRAWN; premium obligation voided"
          - "appends AuditEvent(certificate.recover)"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /certificates/{id}/convert-to-drs OR POST /transfer-requests/{id}/settle (certificated source)"
        actor: TransferExaminer
        preconditions: ["certificate.status == ISSUED"]
        side_effects:
          - "Position.certificated_shares -= certificate.share_quantity; Position.book_entry_shares += certificate.share_quantity (convert-to-drs) or credited to transferee position (settle)"
          - "Issuer.total_book_entry_shares / total_certificated_shares recomputed (cascade hop)"
      - from: LOST_REPORTED
        to: REPLACED
        trigger: "POST /lost-certificate-claims/{id}/issue-replacement (cascade)"
        actor: system
        preconditions: ["claim.status == APPROVED and claim.certificate_id == certificate.id"]
        side_effects: ["replacement Certificate ISSUED for the same share_quantity; Position.certificated_shares unchanged (replacement preserves form)"]

  - entity: TransferRequest
    initial_state: UNDER_REVIEW
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: UNDER_REVIEW
        to: MEDALLION_VERIFIED
        trigger: "POST /transfer-requests/{id}/submit-medallion"
        actor: TransferExaminer
        preconditions:
          - "transfer.status == UNDER_REVIEW"
          - "coverage_cents >= transfer.transfer_value_cents (inclusive)"
        side_effects:
          - "transfer.medallion_reference / medallion_coverage_cents recorded"
          - "transfer.last_examiner_id := X-User-ID"
          - "appends AuditEvent(transfer.medallion_verified)"
      - from: UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /transfer-requests/{id}/flag-deficient"
        actor: TransferExaminer
        preconditions: ["transfer.status == UNDER_REVIEW"]
        side_effects: ["transfer.deficiency_reason recorded", "transfer.last_examiner_id := X-User-ID"]
      - from: DEFICIENT
        to: UNDER_REVIEW
        trigger: "POST /transfer-requests/{id}/cure-deficiency"
        actor: Shareholder
        preconditions: ["transfer.status == DEFICIENT"]
        side_effects: ["transfer.deficiency_reason cleared (cycle: request may be flagged and cured repeatedly)"]
      - from: MEDALLION_VERIFIED
        to: APPROVED
        trigger: "POST /transfer-requests/{id}/approve"
        actor: TransferSupervisor
        preconditions:
          - "transfer.status == MEDALLION_VERIFIED"
          - "X-User-ID != transfer.last_examiner_id (segregation of duties)"
        side_effects: ["transfer.approved_by := X-User-ID"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /transfer-requests/{id}/reject"
        actor: TransferSupervisor
        preconditions: ["transfer.status in {UNDER_REVIEW, MEDALLION_VERIFIED, DEFICIENT}"]
        side_effects: ["from_account.pending_transfer_count -= 1"]
      - from: MEDALLION_VERIFIED
        to: REJECTED
        trigger: "POST /transfer-requests/{id}/reject"
        actor: TransferSupervisor
        preconditions: ["transfer.status in {UNDER_REVIEW, MEDALLION_VERIFIED, DEFICIENT}"]
        side_effects: ["from_account.pending_transfer_count -= 1"]
      - from: DEFICIENT
        to: REJECTED
        trigger: "POST /transfer-requests/{id}/reject"
        actor: TransferSupervisor
        preconditions: ["transfer.status in {UNDER_REVIEW, MEDALLION_VERIFIED, DEFICIENT}"]
        side_effects: ["from_account.pending_transfer_count -= 1"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /transfer-requests/{id}/cancel"
        actor: Shareholder
        preconditions: ["transfer.status in {UNDER_REVIEW, DEFICIENT}", "X-User-ID == transfer.from_account_id"]
        side_effects: ["from_account.pending_transfer_count -= 1"]
      - from: DEFICIENT
        to: CANCELLED
        trigger: "POST /transfer-requests/{id}/cancel"
        actor: Shareholder
        preconditions: ["transfer.status in {UNDER_REVIEW, DEFICIENT}", "X-User-ID == transfer.from_account_id"]
        side_effects: ["from_account.pending_transfer_count -= 1"]
      - from: APPROVED
        to: SETTLED
        trigger: "POST /transfer-requests/{id}/settle"
        actor: TransferSupervisor
        preconditions:
          - "transfer.status == APPROVED"
          - "Issuer.status == ACTIVE"
          - "if transfer.source_certificate_id set: Certificate.status == ISSUED (stop-transfer not placed)"
          - "no TransferFreezeWindow of this issuer with status in {SCHEDULED, ACTIVE} and start_date <= logical clock <= end_date (closed interval)"
          - "source shares still available: DRS -> source Position.book_entry_shares >= share_quantity; certificated -> Certificate.share_quantity == share_quantity"
        side_effects:
          - "hop1: if source_certificate_id set, Certificate ISSUED -> CANCELLED"
          - "hop2: source Position debited (certificated_shares -= q for certificated source, book_entry_shares -= q for DRS source); transferee Position created-if-absent and book_entry_shares += q"
          - "hop3: Issuer.total_book_entry_shares / total_certificated_shares recomputed from all positions"
          - "from_account.pending_transfer_count -= 1; transfer.settled_at := logical clock"
          - "appends AuditEvent(transfer.settle)"

  - entity: LostCertificateClaim
    initial_state: FILED
    terminal_states: [REPLACED, REJECTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: BOND_POSTED
        trigger: "POST /lost-certificate-claims/{id}/post-bond"
        actor: TransferExaminer
        preconditions:
          - "claim.status == FILED"
          - "premium_paid_cents >= required_premium_cents computed per indemnity_bond_premium under the requested bond_variant (inclusive)"
        side_effects: ["bond_amount_cents and required_premium_cents frozen on the claim"]
      - from: BOND_POSTED
        to: APPROVED
        trigger: "POST /lost-certificate-claims/{id}/approve"
        actor: TransferSupervisor
        preconditions:
          - "claim.status == BOND_POSTED"
          - "claim.filed_by_examiner_id is null OR X-User-ID != claim.filed_by_examiner_id (segregation of duties)"
        side_effects: ["appends AuditEvent(claim.approve)"]
      - from: BOND_POSTED
        to: REJECTED
        trigger: "POST /lost-certificate-claims/{id}/reject"
        actor: TransferSupervisor
        preconditions: ["claim.status == BOND_POSTED"]
        side_effects: ["certificate remains LOST_REPORTED (stop order stays in force)"]
      - from: APPROVED
        to: REPLACED
        trigger: "POST /lost-certificate-claims/{id}/issue-replacement"
        actor: TransferSupervisor
        preconditions: ["claim.status == APPROVED"]
        side_effects:
          - "original Certificate LOST_REPORTED -> REPLACED"
          - "new Certificate ISSUED minted with same share_quantity; claim.replacement_certificate_id set"
          - "appends AuditEvent(claim.replaced)"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /certificates/{id}/recover (cascade)"
        actor: system
        preconditions: ["certificate recovered while claim open"]
        side_effects: ["bond obligation voided"]
      - from: BOND_POSTED
        to: WITHDRAWN
        trigger: "POST /certificates/{id}/recover (cascade)"
        actor: system
        preconditions: ["certificate recovered while claim open"]
        side_effects: ["bond obligation voided"]

  - entity: DividendDeclaration
    initial_state: DECLARED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: DECLARED
        to: ACCRUED
        trigger: "POST /_clock/set_current_utc advancing the logical clock to >= record_date (system)"
        actor: system
        preconditions: ["declaration.status == DECLARED", "Issuer.status == ACTIVE at evaluation time"]
        side_effects:
          - "for every Position of this issuer with status ACTIVE whose account.account_status != ESCHEATED: create DividendPayment ACCRUED with eligible_shares snapshot per record_date_eligible_shares and provisional_withholding_cents per dividend_withholding (provisional variant)"
          - "declaration.total_eligible_shares and total_accrued_cents computed and frozen"
      - from: ACCRUED
        to: PAYABLE
        trigger: "POST /_clock/set_current_utc advancing the logical clock to >= payable_date (system)"
        actor: system
        preconditions: ["declaration.status == ACCRUED"]
        side_effects:
          - "every DividendPayment ACCRUED -> DISBURSED; withholding_cents recomputed per dividend_withholding (final variant, as of payable date); net_cents := gross_cents - withholding_cents; disbursed_at := logical clock"
      - from: PAYABLE
        to: CLOSED
        trigger: "system bubble-up when all child payments reach a terminal state {RECONCILED, ESCHEATED}"
        actor: system
        preconditions: ["every DividendPayment of this declaration is in {RECONCILED, ESCHEATED}"]
        side_effects: ["appends AuditEvent(declaration.closed)"]
      - from: DECLARED
        to: VOIDED
        trigger: "POST /dividend-declarations/{id}/void"
        actor: IssuerOfficer
        preconditions: ["declaration.status == DECLARED"]
        side_effects: ["no payments ever generated; clock evaluation skips VOIDED declarations"]

  - entity: DividendPayment
    initial_state: ACCRUED
    terminal_states: [RECONCILED, ESCHEATED]
    transitions:
      - from: ACCRUED
        to: DISBURSED
        trigger: "POST /_clock/set_current_utc advancing past declaration payable_date (system)"
        actor: system
        preconditions: ["parent declaration transitioning ACCRUED -> PAYABLE"]
        side_effects: ["final withholding per dividend_withholding; disbursed_at := logical clock"]
      - from: DISBURSED
        to: RECONCILED
        trigger: "POST /dividend-payments/{id}/cash"
        actor: Shareholder
        preconditions: ["payment.status == DISBURSED", "X-User-ID == payment.account_id"]
        side_effects:
          - "account.last_qualifying_contact_date := logical clock (cashing is a qualifying contact)"
          - "if account.account_status == DORMANT: account DORMANT -> ACTIVE (with case reactivation cascade)"
      - from: DISBURSED
        to: RETURNED
        trigger: "POST /dividend-payments/{id}/mark-returned"
        actor: ServiceAgent
        preconditions: ["payment.status == DISBURSED"]
        side_effects: ["account.address_verified := false", "payment.returned_at := logical clock"]
      - from: RETURNED
        to: DISBURSED
        trigger: "POST /dividend-payments/{id}/reissue"
        actor: ServiceAgent
        preconditions: ["payment.status == RETURNED", "account.address_verified == true"]
        side_effects: ["payment.disbursed_at := logical clock (stale-dating clock restarts); cycle: may be returned again"]
      - from: DISBURSED
        to: STALE_DATED
        trigger: "POST /_clock/set_current_utc advancing the logical clock to >= disbursed_at + 180 days (system)"
        actor: system
        preconditions: ["payment.status == DISBURSED"]
        side_effects:
          - "hop1: payment.status := STALE_DATED"
          - "hop2: account.stale_dividend_cents += payment.gross_cents"
          - "hop3: if account.account_status == DORMANT and no EscheatmentCase in {IDENTIFIED, NOTICE_SENT, REPORTED}: create (or re-arm) EscheatmentCase IDENTIFIED"
      - from: STALE_DATED
        to: ESCHEATED
        trigger: "POST /escheatment-cases/{id}/remit (cascade)"
        actor: system
        preconditions: ["payment.account_id == case.account_id and case transitioning REPORTED -> REMITTED"]
        side_effects: ["account.stale_dividend_cents -= payment.gross_cents"]

  - entity: LegendRemovalRequest
    initial_state: SUBMITTED
    terminal_states: [LEGEND_REMOVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: OPINION_UNDER_REVIEW
        trigger: "POST /legend-removal-requests/{id}/submit-opinion"
        actor: Shareholder
        preconditions: ["request.status in {SUBMITTED, DEFICIENT}"]
        side_effects: ["counsel_opinion_reference recorded"]
      - from: DEFICIENT
        to: OPINION_UNDER_REVIEW
        trigger: "POST /legend-removal-requests/{id}/submit-opinion (resubmission cycle)"
        actor: Shareholder
        preconditions: ["request.status in {SUBMITTED, DEFICIENT}"]
        side_effects: ["deficiency_reason cleared; cycle: opinion may be flagged and resubmitted repeatedly"]
      - from: OPINION_UNDER_REVIEW
        to: DEFICIENT
        trigger: "POST /legend-removal-requests/{id}/flag-deficient"
        actor: ComplianceOfficer
        preconditions: ["request.status == OPINION_UNDER_REVIEW"]
        side_effects: ["deficiency_reason recorded"]
      - from: OPINION_UNDER_REVIEW
        to: LEGEND_REMOVED
        trigger: "POST /legend-removal-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == OPINION_UNDER_REVIEW"
          - "logical clock >= request.acquisition_date + 180 days (Rule 144 holding period, inclusive >=)"
        side_effects:
          - "Position.restricted_shares -= request.share_quantity"
          - "Position.pending_legend_removal_count -= 1"
          - "appends AuditEvent(legend.removed)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /legend-removal-requests/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["request.status in {SUBMITTED, OPINION_UNDER_REVIEW, DEFICIENT}"]
        side_effects: ["Position.pending_legend_removal_count -= 1"]
      - from: OPINION_UNDER_REVIEW
        to: REJECTED
        trigger: "POST /legend-removal-requests/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["request.status in {SUBMITTED, OPINION_UNDER_REVIEW, DEFICIENT}"]
        side_effects: ["Position.pending_legend_removal_count -= 1"]
      - from: DEFICIENT
        to: REJECTED
        trigger: "POST /legend-removal-requests/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["request.status in {SUBMITTED, OPINION_UNDER_REVIEW, DEFICIENT}"]
        side_effects: ["Position.pending_legend_removal_count -= 1"]

  - entity: EscheatmentCase
    initial_state: IDENTIFIED
    terminal_states: [REMITTED]
    transitions:
      - from: IDENTIFIED
        to: NOTICE_SENT
        trigger: "POST /escheatment-cases/{id}/send-notice"
        actor: ComplianceOfficer
        preconditions: ["case.status == IDENTIFIED"]
        side_effects: ["notice_sent_at := logical clock"]
      - from: NOTICE_SENT
        to: REPORTED
        trigger: "POST /escheatment-cases/{id}/report"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == NOTICE_SENT"
          - "logical clock >= notice_sent_at + 60 days (due-diligence wait, inclusive >=)"
        side_effects:
          - "report_price_cents := Issuer.current_market_price_cents (frozen)"
          - "share_value_cents, cash_value_cents, total_remit_cents computed per escheatment_remit_valuation (order pinned)"
      - from: REPORTED
        to: REMITTED
        trigger: "POST /escheatment-cases/{id}/remit"
        actor: ComplianceOfficer
        preconditions: ["case.status == REPORTED"]
        side_effects:
          - "hop1: case.status := REMITTED"
          - "hop2: account DORMANT -> ESCHEATED; account Position ACTIVE -> CLOSED with all share fields zeroed; all account STALE_DATED payments -> ESCHEATED and stale_dividend_cents relieved"
          - "hop3: Issuer.total_book_entry_shares / total_certificated_shares recomputed from all positions"
      - from: IDENTIFIED
        to: REACTIVATED
        trigger: "POST /escheatment-cases/{id}/reactivate OR owner qualifying contact (PATCH /accounts/{id}, POST /inquiries)"
        actor: ServiceAgent
        preconditions: ["case.status in {IDENTIFIED, NOTICE_SENT}"]
        side_effects:
          - "account DORMANT -> ACTIVE; account.last_qualifying_contact_date := logical clock"
      - from: NOTICE_SENT
        to: REACTIVATED
        trigger: "POST /escheatment-cases/{id}/reactivate OR owner qualifying contact"
        actor: ServiceAgent
        preconditions: ["case.status in {IDENTIFIED, NOTICE_SENT}"]
        side_effects: ["account DORMANT -> ACTIVE; account.last_qualifying_contact_date := logical clock"]
      - from: REACTIVATED
        to: IDENTIFIED
        trigger: "POST /escheatment/scan (system sweep re-arm)"
        actor: system
        preconditions:
          - "case.status == REACTIVATED"
          - "account.account_status transitioning ACTIVE -> DORMANT in the same sweep"
          - "account still holds total_shares > 0 or stale_dividend_cents > 0"
        side_effects: ["dormancy_start_date refreshed (cycle: property may dormancy-cycle repeatedly until remitted)"]

  - entity: ShareholderInquiry
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /inquiries/{id}/claim"
        actor: ServiceAgent
        preconditions: ["inquiry.status in {OPEN, ANSWERED}"]
        side_effects: ["claimed_by_agent_id := X-User-ID"]
      - from: ANSWERED
        to: IN_REVIEW
        trigger: "POST /inquiries/{id}/claim (follow-up reopen cycle)"
        actor: ServiceAgent
        preconditions: ["inquiry.status in {OPEN, ANSWERED}"]
        side_effects: ["claimed_by_agent_id := X-User-ID"]
      - from: IN_REVIEW
        to: ANSWERED
        trigger: "POST /inquiries/{id}/answer"
        actor: ServiceAgent
        preconditions:
          - "inquiry.status == IN_REVIEW"
          - "X-User-ID == inquiry.claimed_by_agent_id (only the claiming agent may answer)"
        side_effects: ["answer_text recorded"]
      - from: ANSWERED
        to: CLOSED
        trigger: "POST /inquiries/{id}/close"
        actor: ServiceAgent
        preconditions: ["inquiry.status == ANSWERED"]
        side_effects: ["appends AuditEvent(inquiry.close)"]

  - entity: TransferFreezeWindow
    initial_state: SCHEDULED
    terminal_states: [EXPIRED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /_clock/set_current_utc advancing the logical clock to >= start_date (system)"
        actor: system
        preconditions: ["window.status == SCHEDULED"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock past end_date (system)"
        actor: system
        preconditions: ["window.status == ACTIVE"]
        side_effects: []

concurrency_rules:
  - rule_id: transfer-create-stale-account
    parent_entity: ShareholderAccount
    write_endpoint: "POST /transfer-requests"
    occ_field: "expected_account_version"
    description: |
      Creating a TransferRequest against a from-account whose version has advanced
      since the client last observed it (e.g. because another transfer was created
      or terminated against the same account, advancing pending_transfer_count and
      version) is rejected with a stale-version error. The client must re-read the
      account and resubmit with the current version.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
  - rule_id: legend-create-stale-position
    parent_entity: Position
    write_endpoint: "POST /legend-removal-requests"
    occ_field: "expected_position_version"
    description: |
      Creating a LegendRemovalRequest against a Position whose version has advanced
      since the client last observed it (e.g. because a prior legend removal was
      approved and restricted_shares changed, or another request was opened) is
      rejected with a stale-version error. The client must re-read the position
      and resubmit with the current version.
    error_id: ERR_STALE_POSITION_VERSION
    http_status: 412

calculations:
  - name: gross_dividend_accrual
    trigger: "DividendDeclaration DECLARED -> ACCRUED (record-date snapshot), and whenever total_accrued_cents is read"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mode: nested rounding — order matters):
      # Step 1: per payment, gross_millicents = eligible_shares * amount_per_share_millicents
      # Step 2: per payment, gross_cents = round_half_up(gross_millicents / MILLICENTS_PER_CENT)
      # Step 3: declaration.total_accrued_cents = SUM of per-payment gross_cents (already rounded)
      # Sum-then-round (aggregating millicents first) is FORBIDDEN and yields different cents.
      # Example pinned: two accounts x 1 share x 667 millicents -> each gross_cents = 1, total = 2
      # (sum-then-round would give round_half_up(1334/1000) = 1).
      per_payment_gross_cents = round_half_up(eligible_shares * amount_per_share_millicents / 1000)
      total_accrued_cents = sum(per_payment_gross_cents for each generated DividendPayment)
    input_set: "DividendPayments generated at ACCRUED; positions with status ACTIVE whose account.account_status != ESCHEATED"
    constants:
      MILLICENTS_PER_CENT: 1000
    precision: "integer cents; round_half_up at the millicent->cent boundary, per payment"
    variants:
      - name: per_payment_rounding
        when: "always — this is the pinned order"
        difference: "sum-then-round forbidden; per-payment rounding produces strictly >= aggregate cents"

  - name: dividend_withholding
    trigger: "provisional: at record lock (DECLARED -> ACCRUED); final: at disbursement (ACCRUED -> PAYABLE); each recomputed against the account's tax attributes frozen at the respective date"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial (mode a): three inputs with conditional branches and tiered rates.
      # rate(account):
      #   if tin_status in {MISSING, UNCERTIFIED}:            BACKUP_WITHHOLDING_RATE (0.24)
      #   elif tin_status == CERTIFIED and residency == US:   0.00
      #   elif tin_status == CERTIFIED and residency == FOREIGN:
      #       treaty_tier == TREATY   -> NRA_TREATY_RATE   (0.15)
      #       treaty_tier == STANDARD -> NRA_STANDARD_RATE (0.30)
      # withholding_cents = round_half_up(gross_cents * rate)
      # net_cents = gross_cents - withholding_cents
      withholding_cents = round_half_up(gross_cents * rate(account))
      net_cents = gross_cents - withholding_cents
    input_set: "the single DividendPayment's account tax attributes (tin_status, residency, treaty_tier)"
    constants:
      BACKUP_WITHHOLDING_RATE: 0.24
      NRA_STANDARD_RATE: 0.30
      NRA_TREATY_RATE: 0.15
    precision: "integer cents; round_half_up"
    variants:
      - name: provisional
        when: "at record lock; uses account tin_status/residency/treaty_tier as of record_date"
        difference: "stored in provisional_withholding_cents; may diverge from final when W-9 certification changes between record and payable dates"
      - name: final
        when: "at disbursement; uses account tin_status/residency/treaty_tier as of payable_date"
        difference: "stored in withholding_cents and drives net_cents; identical inputs to provisional can yield different cents when tax attributes changed in the interim"

  - name: indemnity_bond_premium
    trigger: "POST /lost-certificate-claims/{id}/post-bond — bond amount and required premium computed and frozen"
    algorithm: tiered_pricing
    formula: |
      # market_value basis depends on variant:
      #   OPEN_PENALTY:  price = Issuer.current_market_price_cents AT post-bond time
      #   FIXED_PENALTY: price = claim.loss_report_price_cents (frozen at FILED)
      # bond_amount_cents = share_quantity * price * BOND_MULTIPLIER
      # required_premium_cents = round_half_up(
      #     min(bond_amount_cents, PREMIUM_TIER1_CAP_CENTS) * PREMIUM_TIER1_RATE
      #   + max(0, bond_amount_cents - PREMIUM_TIER1_CAP_CENTS) * PREMIUM_TIER2_RATE)
      bond_amount_cents = certificate.share_quantity * price * 2
      required_premium_cents = round_half_up(min(bond, 10000000) * 0.03 + max(0, bond - 10000000) * 0.02)
    input_set: "the claim's certificate (share_quantity) and issuer price per variant"
    constants:
      BOND_MULTIPLIER: 2
      PREMIUM_TIER1_CAP_CENTS: 10000000
      PREMIUM_TIER1_RATE: 0.03
      PREMIUM_TIER2_RATE: 0.02
    precision: "integer cents; round_half_up"
    variants:
      - name: open_penalty
        when: "bond_variant == OPEN_PENALTY"
        difference: "prices shares at Issuer.current_market_price_cents at post-bond time; diverges from fixed when the market price moved after the loss report"
      - name: fixed_penalty
        when: "bond_variant == FIXED_PENALTY"
        difference: "prices shares at claim.loss_report_price_cents frozen at FILED; identical share count yields a different bond when price moved"

  - name: escheatment_remit_valuation
    trigger: "EscheatmentCase NOTICE_SENT -> REPORTED"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER (mode: circular-looking dependency — order must be explicit):
      # The cash leg includes stale dividends whose gross_cents were themselves computed from
      # the very shares being valued, so steps MUST execute in this exact sequence:
      #   (1) report_price_cents := Issuer.current_market_price_cents (freeze first)
      #   (2) share_value_cents := account Position.total_shares * report_price_cents
      #   (3) cash_value_cents := SUM(payment.gross_cents) over the account's payments with status == STALE_DATED
      #   (4) total_remit_cents := share_value_cents + cash_value_cents
      report_price_cents = issuer.current_market_price_cents
      share_value_cents = position.total_shares * report_price_cents
      cash_value_cents = sum(gross_cents for payments in STALE_DATED of account)
      total_remit_cents = share_value_cents + cash_value_cents
    input_set: "the account's ACTIVE position in the case's issuer scope (single position per account in this scaffold: the account's positions are all escheated; valuation sums all positions of the account), and all STALE_DATED DividendPayments of the account"
    constants: {}
    precision: "integer cents; no rounding (integer share count x integer price)"
    variants: []

  - name: dormancy_determination
    trigger: "POST /escheatment/scan sweep, per ACTIVE account"
    algorithm: threshold
    formula: |
      # dormancy_years = DORMANCY_YEARS.get(account.state_code, DORMANCY_DEFAULT)
      # dormant iff logical_clock >= last_qualifying_contact_date + dormancy_years YEARS
      # BOUNDARY IS INCLUSIVE (>=): exactly N years to the instant IS dormant; one second short is NOT.
      dormant = (now >= last_qualifying_contact_date + dormancy_years * 1_year)
    input_set: "accounts with account_status == ACTIVE; RESTRICTED accounts are not swept"
    constants:
      DORMANCY_YEARS: { CA: 3, NY: 5, TX: 3 }
      DORMANCY_DEFAULT: 5
    precision: "datetime comparison to the second; inclusive >="
    variants: []

  - name: record_date_eligible_shares
    trigger: "DividendDeclaration DECLARED -> ACCRUED snapshot"
    algorithm: chronological
    formula: |
      # eligible_shares = position.total_shares (book_entry_shares + certificated_shares)
      # as of the record lock instant. Transfers settled AFTER the record instant do not
      # reduce the snapshot; transfers settled AT OR BEFORE are already reflected in positions.
      # Settlement order when several transfers settle in the same sweep: settled_at ASC,
      # tie-break created_at ASC (never id).
      eligible_shares = position.book_entry_shares + position.certificated_shares
    input_set: "Positions of the declaration's issuer with status ACTIVE whose account.account_status != ESCHEATED"
    constants: {}
    precision: "integer shares"
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles; ownership: Shareholder X-User-ID must equal the acted-on account (from_account_id, account_id, or payment.account_id)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids resolve left-to-right (issuer, account, position, certificate, claim, transfer, declaration, payment, legend request, case, inquiry)"
    error_id: ERR_ISSUER_NOT_FOUND
    http_status: 404
    applies_to: "all — the specific ERR_*_NOT_FOUND for the leftmost unresolved segment"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version (POST /transfer-requests, POST /legend-removal-requests)"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /transfer-requests (ERR_STALE_ACCOUNT_VERSION), POST /legend-removal-requests (ERR_STALE_POSITION_VERSION)"
  - priority: 5
    category: state
    check: "Target resource in the required from-state for the invoked transition; related-entity state gates: account not RESTRICTED for transfer create (ERR_ACCOUNT_RESTRICTED), account not ESCHEATED for any mutation (ERR_ACCOUNT_ESCHEATED), issuer not SUSPENDED for transfer create / declaration create (ERR_ISSUER_SUSPENDED), source certificate not LOST_REPORTED at settle (ERR_CERTIFICATE_STOPPED), account.address_verified for payment reissue (ERR_ADDRESS_UNVERIFIED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints — the specific ERR_* per gate"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: transfer approve actor != transfer.last_examiner_id; claim approve actor != claim.filed_by_examiner_id (when examiner-filed)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /transfer-requests/{id}/approve, POST /lost-certificate-claims/{id}/approve"
  - priority: 7
    category: business_temporal
    check: "Temporal gates: settle outside any issuer freeze window [start_date, end_date] closed interval (ERR_TRANSFER_FREEZE_CONFLICT); payable_date strictly after record_date and window end_date >= start_date (ERR_INVALID_DATE_RANGE); legend holding period now >= acquisition_date + 180d (ERR_HOLDING_PERIOD_NOT_MET); escheatment report only after notice_sent_at + 60d (ERR_NOTICE_WINDOW_NOT_ELAPSED)"
    error_id: ERR_TRANSFER_FREEZE_CONFLICT
    http_status: 409
    applies_to: "settle, freeze-window create, declaration create, legend approve, case report — the specific ERR_* per gate"
  - priority: 8
    category: business_constraint
    check: "Uniqueness and shape: cusip unique (ERR_DUPLICATE_CUSIP); one Position per (account, issuer) (ERR_DUPLICATE_POSITION); at most one open LostCertificateClaim per certificate (ERR_DUPLICATE_OPEN_CLAIM); freeze windows on one issuer must not overlap under closed-interval semantics — [s1,e1] vs [s2,e2] conflict iff s1 <= e2 AND s2 <= e1 (ERR_FREEZE_WINDOW_OVERLAP); share quantities >= 1 (ERR_ZERO_SHARE_QUANTITY); enum fields from declared sets (ERR_INVALID_REQUEST); required input fields present (ERR_INVALID_REQUEST)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create endpoints — the specific ERR_* per rule"
  - priority: 9
    category: business_referential
    check: "Cross-reference consistency: legend request account_id must equal the referenced position's account_id (ERR_POSITION_ACCOUNT_MISMATCH); transfer source_certificate_id must belong to from_account and to transfer.issuer_id (ERR_POSITION_ACCOUNT_MISMATCH)"
    error_id: ERR_POSITION_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /legend-removal-requests, POST /transfer-requests"
  - priority: 10
    category: business_fiscal
    check: "Fund/share sufficiency, checked last: DRS transfer share_quantity <= book_entry_shares (ERR_INSUFFICIENT_SHARES); certificate withdrawal share_quantity <= book_entry_shares (ERR_INSUFFICIENT_SHARES); legend share_quantity <= restricted_shares (ERR_INSUFFICIENT_RESTRICTED_SHARES); bond premium_paid_cents >= required_premium_cents (ERR_BOND_PREMIUM_INSUFFICIENT); medallion coverage_cents >= transfer_value_cents (ERR_MEDALLION_COVERAGE_INSUFFICIENT)"
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 422
    applies_to: "POST /transfer-requests, POST /positions/{id}/certificate-withdrawals, POST /legend-removal-requests, POST /lost-certificate-claims/{id}/post-bond, POST /transfer-requests/{id}/submit-medallion — the specific ERR_* per check"

endpoints:
  - { method: POST, path: "/issuers", description: "Onboard an issuer security", roles: [AgentAdmin], code: 201, input: [name, cusip, ticker, shares_outstanding, par_value_cents, current_market_price_cents], output: Issuer, side_effects: ["appends AuditEvent(issuer.create)"] }
  - { method: GET, path: "/issuers/{id}", description: "Read an issuer incl. computed book/certificated totals", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor, ComplianceOfficer, ServiceAgent, Shareholder], code: 200, input: [], output: Issuer, side_effects: [] }
  - { method: PATCH, path: "/issuers/{id}", description: "Update market price and/or status (ACTIVE<->SUSPENDED)", roles: [IssuerOfficer], code: 200, input: ["current_market_price_cents?", "status?"], output: Issuer, side_effects: ["increments Issuer.version by 1", "appends AuditEvent(issuer.patch)"] }
  - { method: POST, path: "/issuers/{id}/freeze-windows", description: "Declare a transfer freeze window [start_date, end_date] closed interval", roles: [IssuerOfficer], code: 201, input: [start_date, end_date, reason], output: TransferFreezeWindow, side_effects: ["appends AuditEvent(freeze.create)"] }
  - { method: GET, path: "/freeze-windows", description: "List freeze windows, filterable by issuer and status", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor, ComplianceOfficer], code: 200, input: ["issuer_id?", "status?"], output: "TransferFreezeWindow[]", side_effects: [] }
  - { method: GET, path: "/issuers/{id}/record-date-report", description: "Issuer record-date list: holder-of-record snapshot for a declaration", roles: [IssuerOfficer, AgentAdmin], code: 200, input: [declaration_id], output: { declaration_id: string, record_date: datetime, total_shares: integer, total_accounts: integer, entries: array }, side_effects: [] }

  - { method: POST, path: "/accounts", description: "Register a shareholder account (registered holder record)", roles: [AgentAdmin], code: 201, input: [holder_name, address_line1, city, state_code, postal_code, country_code, tax_id, "residency?", "tin_status?", "treaty_tier?"], output: ShareholderAccount, side_effects: ["last_qualifying_contact_date := created_at", "appends AuditEvent(account.create)"] }
  - { method: GET, path: "/accounts/{id}", description: "Read an account", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor, ComplianceOfficer, ServiceAgent, Shareholder], code: 200, input: [], output: ShareholderAccount, side_effects: [] }
  - { method: PATCH, path: "/accounts/{id}", description: "Address / W-9 maintenance; qualifying owner contact", roles: [Shareholder, AgentAdmin], code: 200, input: ["address_line1?", "city?", "state_code?", "postal_code?", "country_code?", "tin_status?", "treaty_tier?"], output: ShareholderAccount, side_effects: ["last_qualifying_contact_date := logical clock", "address_verified := true", "if DORMANT: DORMANT -> ACTIVE and open cases -> REACTIVATED", "increments ShareholderAccount.version by 1"] }
  - { method: POST, path: "/accounts/{id}/restrict", description: "Place legal-hold restriction (ACTIVE -> RESTRICTED)", roles: [ComplianceOfficer], code: 200, input: [], output: ShareholderAccount, side_effects: ["increments ShareholderAccount.version by 1"] }
  - { method: POST, path: "/accounts/{id}/release-restriction", description: "Lift restriction (RESTRICTED -> ACTIVE)", roles: [ComplianceOfficer], code: 200, input: [], output: ShareholderAccount, side_effects: ["increments ShareholderAccount.version by 1"] }
  - { method: GET, path: "/accounts/{id}/statement", description: "Shareholder statement: positions and totals as of the logical clock", roles: [Shareholder, AgentAdmin, ServiceAgent], code: 200, input: [], output: { account_id: string, as_of: datetime, positions: array, totals: object }, side_effects: [] }
  - { method: POST, path: "/accounts/{id}/positions", description: "Seed a registered-holder position (DRS book-entry) for an issuer", roles: [AgentAdmin], code: 201, input: [issuer_id, book_entry_shares, "restricted_shares?"], output: Position, side_effects: ["Issuer totals recomputed", "appends AuditEvent(position.create)"] }

  - { method: GET, path: "/positions", description: "List positions, filterable by account and issuer", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor, ComplianceOfficer, ServiceAgent, Shareholder], code: 200, input: ["account_id?", "issuer_id?"], output: "Position[]", side_effects: [] }
  - { method: POST, path: "/positions/{id}/certificate-withdrawals", description: "Convert DRS book shares into a physical certificate", roles: [TransferExaminer], code: 201, input: [share_quantity, "legend_restricted?"], output: Certificate, side_effects: ["Position.book_entry_shares -= share_quantity", "Position.certificated_shares += share_quantity", "increments Position.version by 1", "Issuer totals recomputed"] }

  - { method: GET, path: "/certificates", description: "List certificates, filterable by account, issuer, status", roles: [AgentAdmin, TransferExaminer, TransferSupervisor, ComplianceOfficer, Shareholder], code: 200, input: ["account_id?", "issuer_id?", "status?"], output: "Certificate[]", side_effects: [] }
  - { method: POST, path: "/certificates/{id}/convert-to-drs", description: "Deposit a certificate back into book-entry (ISSUED -> CANCELLED)", roles: [TransferExaminer], code: 200, input: [], output: Certificate, side_effects: ["Position.certificated_shares -= share_quantity", "Position.book_entry_shares += share_quantity", "increments Position.version by 1", "Issuer totals recomputed"] }
  - { method: POST, path: "/certificates/{id}/report-lost", description: "Report a certificate lost; places stop-transfer order and opens a LostCertificateClaim (FILED)", roles: [Shareholder, TransferExaminer], code: 201, input: [loss_date], output: LostCertificateClaim, side_effects: ["Certificate ISSUED -> LOST_REPORTED", "claim.loss_report_price_cents := Issuer.current_market_price_cents", "appends AuditEvent(certificate.report_lost)"] }
  - { method: POST, path: "/certificates/{id}/recover", description: "Original certificate recovered; stop order lifted, open claim withdrawn", roles: [TransferExaminer], code: 200, input: [], output: Certificate, side_effects: ["Certificate LOST_REPORTED -> ISSUED", "open claim -> WITHDRAWN"] }

  - { method: GET, path: "/lost-certificate-claims", description: "List claims, filterable by certificate and status", roles: [TransferExaminer, TransferSupervisor, AgentAdmin, Shareholder], code: 200, input: ["certificate_id?", "claimant_account_id?", "replacement_certificate_id?", "status?"], output: "LostCertificateClaim[]", side_effects: [] }
  - { method: POST, path: "/lost-certificate-claims/{id}/post-bond", description: "Post indemnity bond; computes and freezes bond_amount_cents and required_premium_cents per variant", roles: [TransferExaminer], code: 200, input: [bond_variant, premium_paid_cents], output: LostCertificateClaim, side_effects: ["claim FILED -> BOND_POSTED"] }
  - { method: POST, path: "/lost-certificate-claims/{id}/approve", description: "Approve claim (segregated from filing examiner)", roles: [TransferSupervisor], code: 200, input: [], output: LostCertificateClaim, side_effects: ["claim BOND_POSTED -> APPROVED"] }
  - { method: POST, path: "/lost-certificate-claims/{id}/reject", description: "Reject claim; stop order stays in force", roles: [TransferSupervisor], code: 200, input: [], output: LostCertificateClaim, side_effects: ["claim BOND_POSTED -> REJECTED"] }
  - { method: POST, path: "/lost-certificate-claims/{id}/issue-replacement", description: "Issue replacement certificate; original becomes REPLACED", roles: [TransferSupervisor], code: 200, input: [], output: LostCertificateClaim, side_effects: ["original Certificate -> REPLACED", "new Certificate ISSUED minted", "claim -> REPLACED"] }

  - { method: POST, path: "/transfer-requests", description: "Submit a transfer request (OCC-guarded on from-account version)", roles: [Shareholder, TransferExaminer], code: 201, input: [from_account_id, to_account_id, issuer_id, share_quantity, "source_certificate_id?", expected_account_version], output: TransferRequest, side_effects: ["transfer_value_cents frozen = share_quantity x Issuer.current_market_price_cents", "from_account.pending_transfer_count += 1", "increments ShareholderAccount.version by 1", "appends AuditEvent(transfer.create)"] }
  - { method: GET, path: "/transfer-requests", description: "List transfer requests, filterable by from_account, issuer, status", roles: [Shareholder, TransferExaminer, TransferSupervisor, AgentAdmin], code: 200, input: ["from_account_id?", "to_account_id?", "issuer_id?", "source_certificate_id?", "status?"], output: "TransferRequest[]", side_effects: [] }
  - { method: POST, path: "/transfer-requests/{id}/submit-medallion", description: "Submit medallion signature guarantee; verifies coverage >= transfer value", roles: [TransferExaminer], code: 200, input: [medallion_reference, coverage_cents], output: TransferRequest, side_effects: ["UNDER_REVIEW -> MEDALLION_VERIFIED", "last_examiner_id := X-User-ID"] }
  - { method: POST, path: "/transfer-requests/{id}/flag-deficient", description: "Flag the request deficient (curable)", roles: [TransferExaminer], code: 200, input: [deficiency_reason], output: TransferRequest, side_effects: ["UNDER_REVIEW -> DEFICIENT", "last_examiner_id := X-User-ID"] }
  - { method: POST, path: "/transfer-requests/{id}/cure-deficiency", description: "Cure a deficiency and return to review", roles: [Shareholder, TransferExaminer], code: 200, input: [], output: TransferRequest, side_effects: ["DEFICIENT -> UNDER_REVIEW"] }
  - { method: POST, path: "/transfer-requests/{id}/approve", description: "Approve a medallion-verified transfer (SoD: approver != last examiner)", roles: [TransferSupervisor], code: 200, input: [], output: TransferRequest, side_effects: ["MEDALLION_VERIFIED -> APPROVED", "approved_by := X-User-ID"] }
  - { method: POST, path: "/transfer-requests/{id}/reject", description: "Reject a non-terminal transfer", roles: [TransferSupervisor], code: 200, input: [], output: TransferRequest, side_effects: ["-> REJECTED", "from_account.pending_transfer_count -= 1", "increments ShareholderAccount.version by 1"] }
  - { method: POST, path: "/transfer-requests/{id}/cancel", description: "Transferor cancels a non-approved transfer", roles: [Shareholder], code: 200, input: [], output: TransferRequest, side_effects: ["-> CANCELLED", "from_account.pending_transfer_count -= 1", "increments ShareholderAccount.version by 1"] }
  - { method: POST, path: "/transfer-requests/{id}/settle", description: "Settle an approved transfer; cascades certificate cancel, position debit/credit, issuer totals", roles: [TransferSupervisor], code: 200, input: [], output: TransferRequest, side_effects: ["APPROVED -> SETTLED", "certificate cancellation cascade (hop1)", "position debit/credit (hop2)", "issuer totals recompute (hop3)", "from_account.pending_transfer_count -= 1", "increments ShareholderAccount.version by 1"] }

  - { method: POST, path: "/dividend-declarations", description: "Declare a cash dividend (record/payable dates, millicents per share)", roles: [IssuerOfficer], code: 201, input: [issuer_id, record_date, payable_date, amount_per_share_millicents], output: DividendDeclaration, side_effects: ["appends AuditEvent(declaration.create)"] }
  - { method: GET, path: "/dividend-declarations", description: "List dividend declarations, filterable by issuer and status", roles: [AgentAdmin, IssuerOfficer, TransferSupervisor, ServiceAgent, Shareholder], code: 200, input: ["issuer_id?", "status?"], output: "DividendDeclaration[]", side_effects: [] }
  - { method: GET, path: "/dividend-declarations/{id}", description: "Read a declaration incl. frozen totals", roles: [IssuerOfficer, AgentAdmin, TransferSupervisor, ServiceAgent, Shareholder], code: 200, input: [], output: DividendDeclaration, side_effects: [] }
  - { method: POST, path: "/dividend-declarations/{id}/void", description: "Void a declaration before record lock", roles: [IssuerOfficer], code: 200, input: [], output: DividendDeclaration, side_effects: ["DECLARED -> VOIDED"] }
  - { method: GET, path: "/dividend-payments", description: "List dividend payments, filterable by declaration, account, status", roles: [AgentAdmin, IssuerOfficer, ServiceAgent, Shareholder], code: 200, input: ["declaration_id?", "account_id?", "status?"], output: "DividendPayment[]", side_effects: [] }
  - { method: POST, path: "/dividend-payments/{id}/cash", description: "Payee cashes the dividend (DISBURSED -> RECONCILED); qualifying owner contact", roles: [Shareholder], code: 200, input: [], output: DividendPayment, side_effects: ["account.last_qualifying_contact_date := logical clock", "if account DORMANT: DORMANT -> ACTIVE"] }
  - { method: POST, path: "/dividend-payments/{id}/mark-returned", description: "Mark disbursement undeliverable (DISBURSED -> RETURNED)", roles: [ServiceAgent], code: 200, input: [], output: DividendPayment, side_effects: ["account.address_verified := false", "returned_at := logical clock"] }
  - { method: POST, path: "/dividend-payments/{id}/reissue", description: "Reissue a returned payment to a verified address (RETURNED -> DISBURSED)", roles: [ServiceAgent], code: 200, input: [], output: DividendPayment, side_effects: ["disbursed_at := logical clock (stale clock restarts)"] }

  - { method: POST, path: "/legend-removal-requests", description: "Request restricted-stock legend removal (OCC-guarded on position version)", roles: [Shareholder], code: 201, input: [position_id, account_id, share_quantity, rule_basis, acquisition_date, expected_position_version], output: LegendRemovalRequest, side_effects: ["Position.pending_legend_removal_count += 1", "increments Position.version by 1", "appends AuditEvent(legend.create)"] }
  - { method: POST, path: "/legend-removal-requests/{id}/submit-opinion", description: "Submit counsel opinion (also cures DEFICIENT)", roles: [Shareholder, ComplianceOfficer], code: 200, input: [counsel_opinion_reference], output: LegendRemovalRequest, side_effects: ["SUBMITTED|DEFICIENT -> OPINION_UNDER_REVIEW"] }
  - { method: POST, path: "/legend-removal-requests/{id}/flag-deficient", description: "Flag the opinion package deficient (curable)", roles: [ComplianceOfficer], code: 200, input: [deficiency_reason], output: LegendRemovalRequest, side_effects: ["OPINION_UNDER_REVIEW -> DEFICIENT"] }
  - { method: POST, path: "/legend-removal-requests/{id}/approve", description: "Approve legend removal (holding period enforced); removes restriction from position", roles: [ComplianceOfficer], code: 200, input: [], output: LegendRemovalRequest, side_effects: ["OPINION_UNDER_REVIEW -> LEGEND_REMOVED", "Position.restricted_shares -= share_quantity", "Position.pending_legend_removal_count -= 1", "increments Position.version by 1"] }
  - { method: POST, path: "/legend-removal-requests/{id}/reject", description: "Reject a legend-removal request", roles: [ComplianceOfficer], code: 200, input: [], output: LegendRemovalRequest, side_effects: ["-> REJECTED", "Position.pending_legend_removal_count -= 1", "increments Position.version by 1"] }

  - { method: POST, path: "/escheatment/scan", description: "Dormancy sweep: marks ACTIVE accounts DORMANT past their state dormancy period; creates/re-arms escheatment cases for dormant accounts holding shares or stale dividends", roles: [AgentAdmin], code: 200, input: [], output: { accounts_marked_dormant: integer, cases_created: integer }, side_effects: ["ACTIVE -> DORMANT transitions", "EscheatmentCase create/re-arm", "appends AuditEvent(escheatment.scan)"] }
  - { method: GET, path: "/escheatment-cases", description: "List escheatment cases, filterable by account and status", roles: [ComplianceOfficer, ServiceAgent, AgentAdmin], code: 200, input: ["account_id?", "status?"], output: "EscheatmentCase[]", side_effects: [] }
  - { method: POST, path: "/escheatment-cases/{id}/send-notice", description: "Send due-diligence notice (IDENTIFIED -> NOTICE_SENT)", roles: [ComplianceOfficer], code: 200, input: [], output: EscheatmentCase, side_effects: ["notice_sent_at := logical clock"] }
  - { method: POST, path: "/escheatment-cases/{id}/report", description: "File state report after 60-day notice window; freezes valuation per escheatment_remit_valuation", roles: [ComplianceOfficer], code: 200, input: [], output: EscheatmentCase, side_effects: ["NOTICE_SENT -> REPORTED", "valuation frozen"] }
  - { method: POST, path: "/escheatment-cases/{id}/remit", description: "Remit property to the state; cascades account ESCHEATED, position CLOSED/zeroed, stale payments ESCHEATED", roles: [ComplianceOfficer], code: 200, input: [], output: EscheatmentCase, side_effects: ["REPORTED -> REMITTED", "account/position/payment cascade", "issuer totals recompute"] }
  - { method: POST, path: "/escheatment-cases/{id}/reactivate", description: "Owner contacted; case REACTIVATED, account back to ACTIVE", roles: [ServiceAgent], code: 200, input: [], output: EscheatmentCase, side_effects: ["case -> REACTIVATED", "account DORMANT -> ACTIVE", "contact date refreshed"] }

  - { method: POST, path: "/inquiries", description: "Open a shareholder inquiry; qualifying owner contact (reactivates dormancy)", roles: [Shareholder], code: 201, input: [account_id, channel, subject], output: ShareholderInquiry, side_effects: ["account.last_qualifying_contact_date := logical clock", "if account DORMANT: DORMANT -> ACTIVE and open cases -> REACTIVATED"] }
  - { method: GET, path: "/inquiries", description: "List inquiries, filterable by account and status", roles: [ServiceAgent, AgentAdmin, Shareholder], code: 200, input: ["account_id?", "status?"], output: "ShareholderInquiry[]", side_effects: [] }
  - { method: POST, path: "/inquiries/{id}/claim", description: "Claim an inquiry (also reopens ANSWERED for follow-up)", roles: [ServiceAgent], code: 200, input: [], output: ShareholderInquiry, side_effects: ["OPEN|ANSWERED -> IN_REVIEW", "claimed_by_agent_id := X-User-ID"] }
  - { method: POST, path: "/inquiries/{id}/answer", description: "Answer a claimed inquiry (only the claiming agent)", roles: [ServiceAgent], code: 200, input: [answer_text], output: ShareholderInquiry, side_effects: ["IN_REVIEW -> ANSWERED"] }
  - { method: POST, path: "/inquiries/{id}/close", description: "Close an answered inquiry", roles: [ServiceAgent, Shareholder], code: 200, input: [], output: ShareholderInquiry, side_effects: ["ANSWERED -> CLOSED"] }

  - { method: GET, path: "/accounts/{id}/positions", description: "List positions of an account (reverse reachability for Position.account_id)", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor, ComplianceOfficer, ServiceAgent, Shareholder], code: 200, input: [], output: "Position[]", side_effects: [] }
  - { method: GET, path: "/issuers/{id}/positions", description: "List positions in an issuer (reverse reachability for Position.issuer_id)", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor, ComplianceOfficer], code: 200, input: [], output: "Position[]", side_effects: [] }
  - { method: GET, path: "/accounts/{id}/certificates", description: "List certificates of an account (reverse reachability for Certificate.account_id)", roles: [AgentAdmin, TransferExaminer, TransferSupervisor, ComplianceOfficer, Shareholder], code: 200, input: [], output: "Certificate[]", side_effects: [] }
  - { method: GET, path: "/issuers/{id}/certificates", description: "List certificates of an issuer (reverse reachability for Certificate.issuer_id)", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor, ComplianceOfficer], code: 200, input: [], output: "Certificate[]", side_effects: [] }
  - { method: GET, path: "/accounts/{id}/transfer-requests", description: "List transfer requests touching an account as from_account or to_account", roles: [AgentAdmin, TransferExaminer, TransferSupervisor, Shareholder], code: 200, input: [], output: "TransferRequest[]", side_effects: [] }
  - { method: GET, path: "/issuers/{id}/transfer-requests", description: "List transfer requests for an issuer", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor], code: 200, input: [], output: "TransferRequest[]", side_effects: [] }
  - { method: GET, path: "/transfer-requests/{id}", description: "Read a single transfer request", roles: [AgentAdmin, TransferExaminer, TransferSupervisor, Shareholder], code: 200, input: [], output: TransferRequest, side_effects: [] }
  - { method: GET, path: "/lost-certificate-claims/{id}", description: "Read a single lost-certificate claim", roles: [AgentAdmin, TransferExaminer, TransferSupervisor, Shareholder], code: 200, input: [], output: LostCertificateClaim, side_effects: [] }
  - { method: GET, path: "/dividend-payments/{id}", description: "Read a single dividend payment", roles: [AgentAdmin, IssuerOfficer, ServiceAgent, Shareholder], code: 200, input: [], output: DividendPayment, side_effects: [] }
  - { method: GET, path: "/legend-removal-requests", description: "List legend-removal requests, filterable by position, account, status", roles: [AgentAdmin, ComplianceOfficer, Shareholder], code: 200, input: ["position_id?", "account_id?", "status?"], output: "LegendRemovalRequest[]", side_effects: [] }
  - { method: GET, path: "/legend-removal-requests/{id}", description: "Read a single legend-removal request", roles: [AgentAdmin, ComplianceOfficer, Shareholder], code: 200, input: [], output: LegendRemovalRequest, side_effects: [] }
  - { method: GET, path: "/escheatment-cases/{id}", description: "Read a single escheatment case", roles: [AgentAdmin, ComplianceOfficer, ServiceAgent], code: 200, input: [], output: EscheatmentCase, side_effects: [] }
  - { method: GET, path: "/inquiries/{id}", description: "Read a single inquiry", roles: [AgentAdmin, ServiceAgent, Shareholder], code: 200, input: [], output: ShareholderInquiry, side_effects: [] }
  - { method: GET, path: "/issuers/{id}/freeze-windows", description: "List freeze windows of an issuer (reverse reachability for TransferFreezeWindow.issuer_id)", roles: [AgentAdmin, IssuerOfficer, TransferExaminer, TransferSupervisor, ComplianceOfficer], code: 200, input: [], output: "TransferFreezeWindow[]", side_effects: [] }

  - { method: GET, path: "/audit-events", description: "Query the tamper-evident audit chain, filterable by entity", roles: [AgentAdmin, ComplianceOfficer], code: 200, input: ["entity_type?", "entity_id?"], output: "AuditEvent[]", side_effects: [] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Each set evaluates all time-gated system transitions: declaration ACCRUED/PAYABLE, payment stale-dating, freeze-window activation/expiry.", roles: [AgentAdmin], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["evaluates declaration/payment/freeze-window time-gated transitions at the new instant"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint, or Shareholder acting on another holder's resources" }
  - { id: ERR_ISSUER_NOT_FOUND, http: 404, condition: "Issuer id in path or body does not resolve" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "ShareholderAccount id does not resolve" }
  - { id: ERR_POSITION_NOT_FOUND, http: 404, condition: "Position id does not resolve, or no position for (account, issuer) at transfer create" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "Certificate id does not resolve" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "TransferRequest id does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "LostCertificateClaim id does not resolve" }
  - { id: ERR_DECLARATION_NOT_FOUND, http: 404, condition: "DividendDeclaration id does not resolve" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "DividendPayment id does not resolve" }
  - { id: ERR_LEGEND_REQUEST_NOT_FOUND, http: 404, condition: "LegendRemovalRequest id does not resolve" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "EscheatmentCase id does not resolve" }
  - { id: ERR_INQUIRY_NOT_FOUND, http: 404, condition: "ShareholderInquiry id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or enum value outside the declared set" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "payable_date <= record_date, or freeze-window end_date < start_date" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a from-state permitted for the invoked transition" }
  - { id: ERR_ACCOUNT_RESTRICTED, http: 409, condition: "Transfer create while the from-account is RESTRICTED (legal hold)" }
  - { id: ERR_ACCOUNT_ESCHEATED, http: 409, condition: "Any mutation targeting an ESCHEATED (terminal) account" }
  - { id: ERR_ISSUER_SUSPENDED, http: 409, condition: "Transfer create / declaration create / clock-driven accrual while the issuer is SUSPENDED" }
  - { id: ERR_CERTIFICATE_STOPPED, http: 409, condition: "Settle or convert a certificate that is LOST_REPORTED (stop-transfer order in force)" }
  - { id: ERR_DUPLICATE_CUSIP, http: 409, condition: "Issuer create with a cusip already registered" }
  - { id: ERR_DUPLICATE_POSITION, http: 409, condition: "Second position for the same (account, issuer) pair" }
  - { id: ERR_DUPLICATE_OPEN_CLAIM, http: 409, condition: "report-lost on a certificate with an open (non-terminal) LostCertificateClaim — the stop-transfer occupancy is still in force" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver X-User-ID equals the examiner who verified/flagged the item (transfer.last_examiner_id or claim.filed_by_examiner_id)" }
  - { id: ERR_INQUIRY_CLAIMED_BY_OTHER, http: 403, condition: "answer attempted by a ServiceAgent other than claimed_by_agent_id" }
  - { id: ERR_TRANSFER_FREEZE_CONFLICT, http: 409, condition: "Settle while the logical clock falls inside an issuer freeze window [start_date, end_date] (closed interval)" }
  - { id: ERR_FREEZE_WINDOW_OVERLAP, http: 409, condition: "New freeze window overlaps an existing non-EXPIRED window of the same issuer under closed-interval semantics (s1 <= e2 AND s2 <= e1)" }
  - { id: ERR_HOLDING_PERIOD_NOT_MET, http: 422, condition: "Legend approve before acquisition_date + 180 days (inclusive)" }
  - { id: ERR_NOTICE_WINDOW_NOT_ELAPSED, http: 422, condition: "Case report before notice_sent_at + 60 days (inclusive)" }
  - { id: ERR_POSITION_ACCOUNT_MISMATCH, http: 422, condition: "Referenced position/certificate does not belong to the given account (or issuer)" }
  - { id: ERR_ADDRESS_UNVERIFIED, http: 422, condition: "Payment reissue while account.address_verified is false" }
  - { id: ERR_ZERO_SHARE_QUANTITY, http: 422, condition: "share_quantity < 1 on transfer create, certificate withdrawal, or legend-removal create" }
  - { id: ERR_INSUFFICIENT_SHARES, http: 422, condition: "Requested shares exceed available book_entry_shares (DRS transfer, withdrawal)" }
  - { id: ERR_INSUFFICIENT_RESTRICTED_SHARES, http: 422, condition: "Legend-removal share_quantity exceeds position.restricted_shares" }
  - { id: ERR_BOND_PREMIUM_INSUFFICIENT, http: 422, condition: "premium_paid_cents < required_premium_cents at post-bond" }
  - { id: ERR_MEDALLION_COVERAGE_INSUFFICIENT, http: 422, condition: "coverage_cents < transfer_value_cents at submit-medallion" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match the from-account's current version (OCC)" }
  - { id: ERR_STALE_POSITION_VERSION, http: 412, condition: "expected_position_version does not match the position's current version (OCC)" }

roles:
  - name: AgentAdmin
    description: "Transfer-agent platform operator: issuer onboarding, holder registration, position seeding, dormancy sweeps, logical clock"
    identity: opaque
    exclusive_operations: ["POST /issuers", "POST /accounts", "POST /accounts/{id}/positions", "POST /escheatment/scan", "POST /_clock/set_current_utc"]
    shared_operations: ["GET reads across resources", "PATCH /accounts/{id}"]
  - name: Shareholder
    description: "Registered holder acting on their own account (X-User-ID == ShareholderAccount.id)"
    identity: "entity_backed:ShareholderAccount"
    exclusive_operations: ["POST /transfer-requests/{id}/cancel", "POST /dividend-payments/{id}/cash", "POST /inquiries"]
    shared_operations: ["POST /transfer-requests", "PATCH /accounts/{id}", "POST /legend-removal-requests", "POST /legend-removal-requests/{id}/submit-opinion", "POST /transfer-requests/{id}/cure-deficiency", "POST /certificates/{id}/report-lost", "GET reads of own resources"]
  - name: TransferExaminer
    description: "Review examiner: medallion verification, deficiency flagging, certificate withdrawal/deposit, lost-certificate intake and bond posting — never approval"
    identity: opaque
    exclusive_operations: ["POST /transfer-requests/{id}/submit-medallion", "POST /transfer-requests/{id}/flag-deficient", "POST /positions/{id}/certificate-withdrawals", "POST /certificates/{id}/convert-to-drs", "POST /certificates/{id}/recover", "POST /lost-certificate-claims/{id}/post-bond"]
    shared_operations: ["POST /transfer-requests", "POST /certificates/{id}/report-lost", "POST /transfer-requests/{id}/cure-deficiency", "GET reads"]
  - name: TransferSupervisor
    description: "Approval authority for transfers and lost-certificate claims; segregation of duties forbids approving items they examined"
    identity: opaque
    exclusive_operations: ["POST /transfer-requests/{id}/approve", "POST /transfer-requests/{id}/reject", "POST /transfer-requests/{id}/settle", "POST /lost-certificate-claims/{id}/approve", "POST /lost-certificate-claims/{id}/reject", "POST /lost-certificate-claims/{id}/issue-replacement"]
    shared_operations: ["GET reads"]
  - name: IssuerOfficer
    description: "Officer of the issuing company (X-User-ID == Issuer.id): price updates, suspension, freeze windows, dividend declarations"
    identity: "entity_backed:Issuer"
    exclusive_operations: ["PATCH /issuers/{id}", "POST /issuers/{id}/freeze-windows", "POST /dividend-declarations", "POST /dividend-declarations/{id}/void"]
    shared_operations: ["GET /issuers/{id}/record-date-report", "GET reads"]
  - name: ComplianceOfficer
    description: "Regulatory compliance: account restrictions, legend-removal adjudication, escheatment notice/report/remit"
    identity: opaque
    exclusive_operations: ["POST /accounts/{id}/restrict", "POST /accounts/{id}/release-restriction", "POST /legend-removal-requests/{id}/flag-deficient", "POST /legend-removal-requests/{id}/approve", "POST /legend-removal-requests/{id}/reject", "POST /escheatment-cases/{id}/send-notice", "POST /escheatment-cases/{id}/report", "POST /escheatment-cases/{id}/remit"]
    shared_operations: ["POST /legend-removal-requests/{id}/submit-opinion", "GET /audit-events", "GET reads"]
  - name: ServiceAgent
    description: "Shareholder services desk: inquiry handling, returned-mail processing, payment reissue, escheatment reactivation"
    identity: opaque
    exclusive_operations: ["POST /inquiries/{id}/claim", "POST /inquiries/{id}/answer", "POST /dividend-payments/{id}/mark-returned", "POST /dividend-payments/{id}/reissue", "POST /escheatment-cases/{id}/reactivate"]
    shared_operations: ["POST /inquiries/{id}/close", "GET reads"]
