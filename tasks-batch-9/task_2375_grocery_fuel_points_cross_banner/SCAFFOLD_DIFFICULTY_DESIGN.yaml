          setup:
            - "Banner B_H2 (member's home banner) and Banner B_A2 (the away banner), each with cycles 2026-08 (OPEN) and 2026-09."
            - "Grocery site G14 under B_H2; owned fuel center F_A2 under B_A2 (per-redemption gallon cap 35 by banner default)."
            - "Member M14 under B_H2 with 600 accrued points."
            - "Household H14 under B_A2 with an ACTIVE SECONDARY link to M14."
            - "Logical clock at 2026-08-05T10:00:00Z."
