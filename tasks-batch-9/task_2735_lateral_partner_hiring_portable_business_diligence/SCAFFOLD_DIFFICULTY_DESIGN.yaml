          Mode (c): the dependency graph LOOKS circular — guarantee_true_up_amount_usd is
          a percentage of the guarantee keyed on the net, the net subtracts the integration
          cost, the integration cost contains the search fee, and the search fee is a
          percentage of total_first_year_comp_usd, which a naive reading would define as
          "everything we pay in year one" INCLUDING the true-up. STEP 1 cuts the cycle by
          excluding the true-up from total_first_year_comp_usd, so the five steps evaluate
          once in the pinned order. The cut is directly observable: 550000.00 (guarantee +
