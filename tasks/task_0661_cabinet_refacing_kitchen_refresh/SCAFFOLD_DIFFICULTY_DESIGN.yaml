              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
            - call: "POST /projects/${proj18}/quotes"
              payload: { measure_id: "${meas18}", scope: "REFACE" }
              as: SalesRep
              captures: { q18: $.data.id }
            - call: "POST /quotes/${q18}/issue"
              payload: {}
