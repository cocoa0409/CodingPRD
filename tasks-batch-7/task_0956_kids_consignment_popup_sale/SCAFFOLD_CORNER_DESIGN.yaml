        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Entity-backed ownership: Consignor role with X-User-ID of consignor B cannot drop off consignor A's item even though the role itself is allowed on the endpoint."
