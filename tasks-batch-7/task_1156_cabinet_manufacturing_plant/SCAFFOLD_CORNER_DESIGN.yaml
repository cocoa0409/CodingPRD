        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected 400 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /kcma/dealers"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: invalid_enum_value_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "price_level L9 is not in the declared enum -> ERR_INVALID_ENUM."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /kcma/dealers"
              payload: { name: "Bad", dealer_code: "BAD", price_level: "L9", credit_limit_cents: 1000 }
