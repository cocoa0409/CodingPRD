scaffold_corner_design:
# =============================================================================
# §1.9 Scaffold Corner Design — FRAGMENT 1 of 3
# task_2645_rotational_molding_watercraft_plant
# Sections covered by this fragment: entities, state_machines
#
# Conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml §1.8, reused verbatim)
# -----------------------------------------------------------------------------
#   * The logical clock starts at exactly 2026-08-01T00:00:00Z. Wherever an
#     endpoint both takes an explicit actual timestamp AND stamps "the logical
#     clock", the chain sets the clock first and passes the identical instant.
#   * Opaque roles act as the fixed audit ids "admin-1" / "planner-1" /
#     "agent-1"; §1.4 priority 1 requires a non-empty X-User-ID on every call.
#   * Segregation of duties (§1.4 priority 57): the MOLDING_OPERATOR, the
#     ASSEMBLY_TECH and the QUALITY_INSPECTOR are always three distinct
#     Technician rows.
#   * Production orders are created WITHOUT demand_bucket_id unless the instance
#     targets the build-ahead quota, so §1.4 priorities 69 and 74 stay vacuous.
#   * Every expected_*_version is captured from a GET immediately before the OCC
#     call, because §1.2 cascades bump parent versions mid-chain.
#   * All literal business codes carry a -CD- infix in the entities section and
#     an -SM- infix in the state_machines section, so they can
#     never collide with the §1.8 fixtures (PM-SHIP-KM, MLD-SHIP-1, OV-1, CB-1,
#     T-RES-1, WH-SHIP, LOT-SHIP, PO-SHIP, SHP-1, HK-0001, CUST-WAR, WC-WAR-1).
#   * Instances whose corner is already asserted by a §1.8 instance carry
#     excluded_because and NO test_recipe.
# =============================================================================

  - section: entities
    instances:

      # ---------------------------------------------------------------- Creation
      - name: ent_create_product_model_returns_201_with_warranty_ledger_seeded
        claim_type: Creation
        grounds:
          - entities.ProductModel
          - entities.ProductModel.fields.warranty_reserve_cents
          - entities.ProductModel.fields.warranty_paid_cents
          - endpoints.POST_/product-models
        distinguishing_aspect: "POST /product-models with all 24 declared input fields returns 201 and a row whose two computed money fields are seeded to initial_warranty_reserve_cents and 0 — no other entity has a creation-time ledger to seed."
        test_recipe:
          setup:
            - "Empty database; only the logical clock has been pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /product-models"
              payload: { model_code: "PM-CD-CREATE", hull_type: "CANOE", size_class: "TANDEM", resin_grade: "HDPE_CROSSLINK", master_color_code: "GRANITE", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 30.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 7.00, wall_thickness_min_mm: 5.00, wall_cv_max_pct: 12.00, impact_test_min_joules: 110.00, gross_cube_m3: 3.5000, nest_factor: 0.6000, unit_weight_kg: 41.000, msrp_cents: 265000, warranty_basis: "FLAT_SCHEDULE", initial_warranty_reserve_cents: 400000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "GET /product-models/${pm}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP 201 on POST /product-models"
            - "ProductModel.${pm}.id is a non-empty server-minted string not present in the request body"
            - "ProductModel.${pm}.model_code == 'PM-CD-CREATE'"
            - "ProductModel.${pm}.hull_type == 'CANOE' and ProductModel.${pm}.size_class == 'TANDEM'"
            - "ProductModel.${pm}.resin_grade == 'HDPE_CROSSLINK' and ProductModel.${pm}.master_color_code == 'GRANITE'"
            - "ProductModel.${pm}.nominal_charge_kg == 30.000 and ProductModel.${pm}.charge_tolerance_pct == 5.00"
            - "ProductModel.${pm}.gross_cube_m3 == 3.5000 and ProductModel.${pm}.nest_factor == 0.6000"
            - "ProductModel.${pm}.warranty_basis == 'FLAT_SCHEDULE' and ProductModel.${pm}.initial_warranty_reserve_cents == 400000"
            - "ProductModel.${pm}.warranty_reserve_cents == 400000 (seeded from initial_warranty_reserve_cents, not supplied)"
            - "ProductModel.${pm}.warranty_paid_cents == 0"
            - "ProductModel.${pm}.warranty_reserve_cents + ProductModel.${pm}.warranty_paid_cents == 400000"
            - "ProductModel.${pm}.version == 1"
            - "ProductModel.${pm}.created_at == '2026-08-01T00:00:00Z' and updated_at == '2026-08-01T00:00:00Z'"
            - "GET /product-models/${pm} returns byte-identical field values to the 201 body"

      # --------------------------------------------------------------- Retrieval
      - name: ent_get_mold_by_id_returns_stored_tool_with_counter_zero
        claim_type: Retrieval
        grounds:
          - entities.Mold
          - entities.Mold.fields.cycles_since_service
          - entities.Mold.fields.status
          - entities.Mold.fields.replaces_mold_id
        distinguishing_aspect: "GET /molds/{mold_id} echoes every stored input field and shows cycles_since_service 0, status AVAILABLE and replaces_mold_id null before any cycle has ever touched the tool."
        test_recipe:
          setup:
            - "ProductModel PM-CD-GET (KAYAK/MID, nominal_charge_kg 24.000) exists."
            - "Mold MLD-CD-GET registered against it with cavity_count 1, nominal_charge_kg 24.000 == 24.000 * 1, service_interval_cycles 10, replaces_mold_id omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /product-models"
              payload: { model_code: "PM-CD-GET", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-GET", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
          trigger:
            - call: "GET /molds/${mold}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP 200 on GET /molds/${mold}"
            - "Mold.${mold}.mold_code == 'MLD-CD-GET'"
            - "Mold.${mold}.product_model_id == '${pm}'"
            - "Mold.${mold}.size_class == 'MID' and Mold.${mold}.cavity_count == 1"
            - "Mold.${mold}.nominal_charge_kg == 24.000 and Mold.${mold}.service_interval_cycles == 10"
            - "Mold.${mold}.cycles_since_service == 0"
            - "Mold.${mold}.status == 'AVAILABLE'"
            - "Mold.${mold}.replaces_mold_id == null"
            - "Mold.${mold}.version == 1"

      # ----------------------------------------------------------------- Listing
      - name: ent_list_molds_pagination_total_count_and_has_more
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints.GET_/molds
          - validations[priority=22]
        distinguishing_aspect: "Three molds across two hull models make GET /molds report total_count 3 with has_more true on limit=2&offset=0 and has_more false on limit=2&offset=2, while a product_model_id filter narrows total_count to 1 — so total_count counts the filtered set, not the table."
        test_recipe:
          setup:
            - "Two ProductModels PM-CD-LIST-A (KAYAK/MID) and PM-CD-LIST-B (CANOE/TANDEM)."
            - "Three Molds: MLD-CD-L1 and MLD-CD-L2 on PM-CD-LIST-A, MLD-CD-L3 on PM-CD-LIST-B. All AVAILABLE, none ever used."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /product-models"
              payload: { model_code: "PM-CD-LIST-A", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pma: $.data.id }
            - call: "POST /product-models"
              payload: { model_code: "PM-CD-LIST-B", hull_type: "CANOE", size_class: "TANDEM", resin_grade: "HDPE_CROSSLINK", master_color_code: "GRANITE", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 30.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 7.00, wall_thickness_min_mm: 5.00, wall_cv_max_pct: 12.00, impact_test_min_joules: 110.00, gross_cube_m3: 3.5000, nest_factor: 0.6000, unit_weight_kg: 41.000, msrp_cents: 265000, warranty_basis: "FLAT_SCHEDULE", initial_warranty_reserve_cents: 400000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pmb: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-L1", product_model_id: "${pma}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-L2", product_model_id: "${pma}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 48.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { m2: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-L3", product_model_id: "${pmb}", size_class: "TANDEM", cavity_count: 1, nominal_charge_kg: 30.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { m3: $.data.id }
          trigger:
            - call: "GET /molds?limit=2&offset=0"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { p1a: "$.data[0].id", p1b: "$.data[1].id" }
            - call: "GET /molds?limit=2&offset=2"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { p2a: "$.data[0].id" }
            - call: "GET /molds"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /molds?product_model_id=${pmb}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /molds?limit=0"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "page 1 (limit=2&offset=0): response_type == 'array', len(data) == 2, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "page 2 (limit=2&offset=2): len(data) == 1, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "the set {${p1a}, ${p1b}, ${p2a}} equals the set {${m1}, ${m2}, ${m3}} with no id repeated across the two pages"
            - "unparameterised GET /molds: limit == 10 (pagination_defaults), offset == 0, total_count == 3, has_more == false, len(data) == 3"
            - "GET /molds?product_model_id=${pmb}: total_count == 1, has_more == false, data[0].id == '${m3}'"
            - "GET /molds?limit=0 -> HTTP 422 with error_id ERR_INVALID_QUANTITY (§1.4 priority 22 bounds limit to 1..100)"

      # --------------------------------------------------------------- Not Found
      - name: ent_get_nonexistent_resin_lot_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=10]
          - errors.ERR_RESOURCE_NOT_FOUND
          - endpoints.GET_/resin-lots/{resin_lot_id}
        distinguishing_aspect: "Every path id in this flat API resolves through one rule, so a well-formed but unknown id returns ERR_RESOURCE_NOT_FOUND 404 on a read, on an action endpoint and on a computed read alike — never a 200 with an empty body and never an entity-specific code."
        test_recipe:
          setup:
            - "Empty database apart from one real Warehouse WHS-CD-404, so the 404 cannot be an artefact of an empty table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warehouses"
              payload: { site_code: "WHS-CD-404", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "ZN-CD-A", capacity_cube_m3: 20.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
          trigger:
            - call: "GET /resin-lots/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /molds/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds/00000000-0000-0000-0000-0000000000ff/retire"
              payload: { retire_reason: "CD-404-PROBE" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warehouses/00000000-0000-0000-0000-0000000000ff/footprint-summary"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "GET /resin-lots/00000000-0000-0000-0000-0000000000ff -> HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"
            - "GET /molds/00000000-0000-0000-0000-0000000000ff -> HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"
            - "POST /molds/00000000-0000-0000-0000-0000000000ff/retire -> HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND, and no Mold row is created"
            - "GET /warehouses/00000000-0000-0000-0000-0000000000ff/footprint-summary -> HTTP 404 with error_id ERR_RESOURCE_NOT_FOUND"
            - "every 404 body carries response_type == 'error' and data.error_id, per §1.0 response_envelope.error"
            - "GET /warehouses/${wh}/footprint-summary -> HTTP 200, proving the 404s are id-specific rather than route-wide"

      # ---------------------------------------------------------- Required Fields
      - name: ent_required_fields_and_declared_types_enforced_on_creation
        claim_type: Required Fields
        grounds:
          - validations[priority=20]
          - errors.ERR_VALIDATION
          - entities.Warehouse.fields.zones
          - entities.Mold.fields.service_interval_cycles
          - entities.ProductionOrder.fields.ordered_qty
        distinguishing_aspect: "Each omitted non-optional body field and each field supplied with the wrong JSON type is rejected with ERR_VALIDATION 422 at §1.4 priority 20, which outranks the enum (21) and range (22) rules, and no partial row survives the rejection."
        test_recipe:
          setup:
            - "ProductModel PM-CD-REQ (KAYAK/MID, nominal_charge_kg 24.000) and Warehouse WHS-CD-REQ exist so that only the field under test is missing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /product-models"
              payload: { model_code: "PM-CD-REQ", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WHS-CD-REQ", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "ZN-CD-A", capacity_cube_m3: 20.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
          trigger:
            - call: "POST /warehouses"
              payload: { site_code: "WHS-CD-NOZONES", footprint_capacity_cube_m3: 20.0000 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-NOINT", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /production-orders"
              payload: { order_code: "POR-CD-NOQTY", product_model_id: "${pm}", target_warehouse_id: "${wh}" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /oven-stations"
              payload: { station_code: "OVN-CD-BADTYPE", arm_count: "two", max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warehouses"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /molds"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /production-orders"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /oven-stations"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "POST /warehouses without zones -> HTTP 422 with error_id ERR_VALIDATION"
            - "POST /molds without service_interval_cycles -> HTTP 422 with error_id ERR_VALIDATION"
            - "POST /production-orders without ordered_qty -> HTTP 422 with error_id ERR_VALIDATION (not ERR_INVALID_QUANTITY: absence is a schema fault, priority 20, not a range fault, priority 22)"
            - "POST /oven-stations with arm_count as the string 'two' -> HTTP 422 with error_id ERR_VALIDATION"
            - "GET /warehouses: total_count == 1 and no row has site_code 'WHS-CD-NOZONES'"
            - "GET /molds: total_count == 0"
            - "GET /production-orders: total_count == 0"
            - "GET /oven-stations: total_count == 0"

      # ---------------------------------------------------------------- Defaults
      - name: ent_defaults_warehouse_thresholds_bucket_cap_pct_and_null_optional_fks
        claim_type: Defaults
        grounds:
          - entities.Warehouse.fields.restricted_threshold_pct
          - entities.Warehouse.fields.frozen_threshold_pct
          - entities.DemandForecastBucket.fields.build_ahead_cap_pct
          - entities.DemandForecastBucket.fields.build_ahead_cap_qty
          - entities.Mold.fields.replaces_mold_id
          - entities.ProductionOrder.fields.demand_bucket_id
          - calculations.build_ahead_commitment
        distinguishing_aspect: "Only five §1.5 body fields are genuinely omissible on creation, and omitting each one yields its declared default — 85.00, 95.00, 60.00, null and null — with the bucket's derived cap computed from the DEFAULTED percentage rather than from a client value."
        test_recipe:
          setup:
            - "ProductModel PM-CD-DEF (KAYAK/MID, nominal_charge_kg 24.000)."
            - "Every creation call below omits every field marked optional in §1.5 and supplies nothing else beyond the required set."
            - "forecast_qty is 26 so that floor(26 * 60.00 / 100) == 15 differs from round(15.6) == 16, making the flooring observable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /product-models"
              payload: { model_code: "PM-CD-DEF", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 24.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
          trigger:
            - call: "POST /warehouses"
              payload: { site_code: "WHS-CD-DEF", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "ZN-CD-A", capacity_cube_m3: 20.0000 }] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /demand-forecast-buckets"
              payload: { season_code: "SEA-CD-2026", product_model_id: "${pm}", forecast_qty: 26, window_start_on: "2026-08-01", window_end_on: "2026-10-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { dfb: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-DEF", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "POR-CD-DEF", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
