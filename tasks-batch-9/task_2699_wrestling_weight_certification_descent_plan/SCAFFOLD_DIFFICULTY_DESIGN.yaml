            - "Assessment.${assess_a}.min_weight_class_lbs == 150"
            - "Assessment.${assess_a}.alpha_weight_lbs == 159.6"
            - "Wrestler.${wrestler_a}.certification_status == PROVISIONAL and Wrestler.${wrestler_a}.source_assessment_id == ${assess_a}"
            - "Assessment.${assess_b}.status == HYDRATION_FAILED and Assessment.${assess_b}.hydration_passed == false"
            - "Assessment.${assess_b}.lean_body_weight_lbs == null"
