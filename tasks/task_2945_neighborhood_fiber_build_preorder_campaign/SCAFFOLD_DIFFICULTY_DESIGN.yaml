  - rule_id: combinatorial_formula
    instances:
      - name: make_ready_share_floor_then_remainder_order
        grounds:
          - calculations.make_ready_share_allocation
          - entities.Preorder.fields.make_ready_share_cents
          - entities.BuildZone.fields.make_ready_cost_cents
          - endpoints["POST /build-zones/{id}/construction-start"]
        distinguishing_aspect: |
          Mode (b) nested-rounding order: 500000 cents over 3 qualified preorders must allocate
          166667 / 166667 / 166666 by flooring first and handing the 2-cent remainder to the two
          earliest recipients by created_at, not by rounding each share to 166667 and absorbing
          the drift on the last row; the shares sum to exactly 500000 with zero residue.
        test_recipe:
          setup:
            - "Campaign with deposit_amount_cents 1000; zone with household_count 10 and threshold_pct 10.00."
            - "Three SERVICEABLE addresses created in a fixed order, one account each, one preorder each, so the qualified pool is three rows ordered by created_at."
            - "ROW permit APPROVED and a pole attachment ATTACHED after a 500000-cent make-ready quote was ACCEPTED, so the zone's make_ready_cost_cents is 500000."
            - "Clock past the deadline; qualification-run and sequencing-run already executed, so all three preorders are QUALIFIED and the zone is SEQUENCED."
