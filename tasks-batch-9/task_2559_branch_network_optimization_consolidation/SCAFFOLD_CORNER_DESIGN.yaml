            - "${plan_status} == RAMP_TRACKING with opened_on 2026-08-01, ramp_month_index 0 and ${ramp_status} == ON_TRACK — the endpoint walks APPROVED -> OPENED -> RAMP_TRACKING in one call"
            - "${new_branch_id} is non-null and ${minted_code} == HN-301, copied from proposed_branch_code"
            - "${minted_status} == DE_NOVO_RAMPING with ${minted_deposits} == 0, fte_count 0, atm_count 1, performance_band UNSCORED, snapshot_count 0"
            - "the minted branch carries branch_type LIMITED_SERVICE, tenure_class LEASED and onboarding_capacity_households_per_day 40 from the request body"
            - "${own1} == 1, ${dens1} == 13 ((1 + 30) * 100000 / 240000 rounds to 13) and ${tier1} == UNDER_BRANCHED"
            - "GET /distribution/de-novo-plans?opened_branch_id=${new_branch_id} returns total_count 1 — the new branch is reachable back to its plan"

      - name: clock_sweep_makes_the_notice_effective_and_later_moves_the_lease_to_holdover
