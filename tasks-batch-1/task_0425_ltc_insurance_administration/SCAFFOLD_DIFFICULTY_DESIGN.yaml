  - rule_id: compensating_invariant
    instances:
      - name: nonforfeiture_split_conserves_pool
        grounds:
          - calculations.nonforfeiture_pool
          - state_machines.Policy.premium_status
          - entities.BenefitPool.fields.inflated_pool_cents
          - entities.BenefitPool.fields.nonforfeiture_reduction_cents
        distinguishing_aspect: |
          Conserved quantity = the benefit pool: when a vested policy converts to
          NONFORFEITURE_PAID_UP, paid_up_pool + nonforfeiture_reduction_cents equals the
          pre-reduction inflated pool (1000000 = 120000 + 880000) — no pool drift across the split.
        test_recipe:
          setup:
            - "An IN_FORCE policy pool=1000000 with one PAID premium invoice (amount 120000), benefits triggered, one APPROVED claim that paid 53000 lifetime (so nonforfeiture is vested via inflation rider != NONE OR lifetime_paid > 0)."
          setup_api_calls:
            - call: "POST /policyholders"
