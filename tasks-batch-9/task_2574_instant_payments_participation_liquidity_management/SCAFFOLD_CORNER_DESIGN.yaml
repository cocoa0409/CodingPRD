      - name: waterfall_release_stops_at_first_transfer_that_does_not_fit
        claim_type: waterfall_allocation
        grounds:
          - calculations.throttled_release_waterfall
          - state_machines.CreditTransfer.QUEUED_THROTTLED_to_INITIATED
