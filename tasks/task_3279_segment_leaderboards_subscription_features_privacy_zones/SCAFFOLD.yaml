    side_effects: ["status=ACTIVE; recompute route obfuscation for all existing activities of the owner"]

  - method: GET
    path: "/v1/athletes/{id}/privacy_zones"
    description: "List the athlete's privacy zones (0 or 1)"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: []
    output: "PrivacyZone[]"
    side_effects: []

  - method: GET
    path: "/v1/privacy-zones/{id}"
    description: "Get a privacy zone"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: []
    output: PrivacyZone
    side_effects: []

  - method: PUT
    path: "/v1/privacy-zones/{id}"
    description: "Update zone geometry with OCC on the owning athlete"
    roles: [Athlete, PlatformAdmin]
    code: 200
    input: [center_lat, center_lng, radius_m, expected_athlete_version]
    output: PrivacyZone
    side_effects: ["increments Athlete.version by 1", "recompute route obfuscation for all activities of the owner"]

  - method: POST
    path: "/v1/privacy-zones/{id}/disable"
