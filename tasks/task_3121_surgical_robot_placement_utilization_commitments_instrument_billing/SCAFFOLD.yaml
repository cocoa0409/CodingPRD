# =============================================================================
# PRD Benchmark Seed Tables — Surgical Robot Placement, Utilization Commitments
# & Instrument Billing (Intuitive Surgical style)
#
# Difficulty profile: Expert (15 entities / 51 endpoints / 56 errors /
# 16 calculations / 22 validations / 7 state machines / 10 roles), with the
# cross-cutting layers (dual-variant calc, selector policy, threshold triggers,
# cascading side effects, derived-field reconciliation, scheduled actions,
# optimistic concurrency, bulk operations, pagination+filtering) chosen so the
# nine §0.5 Difficulty Rules each carry ≥ 2 differentiating instances.
# =============================================================================

scenario: |
  Surgical Robot Placement, Utilization Commitments & Instrument Billing
  (Intuitive Surgical): system placement through purchase, lease or usage-based
  arrangements with minimum procedure commitments, hospital site readiness
  including room dimensions, power and integration before installation, surgeon
  training pathway with proctoring requirements and credentialing evidence for
  the hospital, instrument and accessory usage billed per procedure with
  lives-remaining counters on reusable instruments, case scheduling and system
  utilization reporting driving expansion decisions, service contract coverage
  with response time commitments and loaner arrangements, software release
  deployment with feature entitlement by system configuration, program growth
  planning tied to service line development

domain_name: surgical-robot-placement
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: scheduled_deferred_actions
  complexity_layers:
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - pagination_with_filtering
    - bulk_operations
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: [compound, cyclic, parallel, posture_driven]
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: HospitalAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Hospital system legal name" }
      - { name: idn_group_code, type: string, source: input, description: "Integrated delivery network grouping code; systems of the same code share a commitment pool" }
      - { name: region_code, type: string, source: input, description: "Commercial region; the CommercialOperations role is region-scoped to this value" }
      - { name: account_status, type: enum, source: system, description: "PROSPECT → READINESS → CONTRACTED → ACTIVE → DORMANT → CLOSED", default: PROSPECT,
        constraints: "enum closed set {PROSPECT, READINESS, CONTRACTED, ACTIVE, DORMANT, CLOSED}" }
      - { name: account_posture, type: enum, source: computed, description: "Derived gate posture, evaluated in this pinned order: EXPANSION_BLOCKED while any of the account's systems has service_status == SERVICE_ACTION_REQUIRED; else ONBOARDING_GATE while any SiteReadinessReview on the account has readiness_status IN {PENDING_REVIEW, CONDITIONAL, REJECTED} or the account has no review at all; else ACTIVE", constraints: "enum closed set {ACTIVE, ONBOARDING_GATE, EXPANSION_BLOCKED}" }
      - { name: placement_cap, type: integer, source: input, description: "Maximum number of concurrently non-terminal SystemPlacement records; 0 means no cap" }
      - { name: service_line_tier, type: enum, source: computed, description: "Observed service-line depth; tier index = (count of DISTINCT procedure_family values among the account's COMPLETED ProcedureCase rows) - 1, clamped to 0..4" }
      - { name: dormant_since_utc, type: datetime, source: system, description: "Logical-clock instant the account entered DORMANT; null otherwise" }
      - { name: hospital_owner_user_id, type: string, source: system, description: "X-User-ID recorded at account creation; the segregation-of-duties check forbids this same user id from approving proctor reviews for the account" }

  - name: SiteReadinessReview
    parent: HospitalAccount
    common_fields: true
    fields:
      - { name: hospital_account_id, type: string, source: system, description: "FK -> HospitalAccount.id; owning hospital system" }
      - { name: review_round, type: integer, source: computed, description: "1-based revision round; incremented by the REJECTED → PENDING_REVIEW revision loop" }
      - { name: site_code, type: string, source: input, description: "Hospital site identifier; unique within a hospital_account_id" }
      - { name: operating_room_length_cm, type: integer, source: input, description: "Clear OR length available for the system footprint" }
      - { name: operating_room_width_cm, type: integer, source: input, description: "Clear OR width available for the system footprint" }
      - { name: table_throw_radius_cm, type: integer, source: input, description: "Unobstructed arm-throw radius measured from table center" }
      - { name: ceiling_clearance_cm, type: integer, source: input, description: "Finished ceiling height available for the column envelope" }
      - { name: has_dedicated_power_circuit, type: boolean, source: input, description: "Site provides the dedicated circuit the system configuration requires" }
      - { name: has_dark_fiber_run, type: boolean, source: input, description: "Site provides the network run required by the system configuration's integration_tier" }
      - { name: evaluated_configuration_id, type: string, source: input, description: "FK -> SystemConfiguration.id; the configuration whose dimensional and integration requirements this review is measured against" }
      - { name: readiness_status, type: enum, source: system, default: PENDING_REVIEW,
        description: "PENDING_REVIEW → PASSED / CONDITIONAL / REJECTED, with REJECTED → PENDING_REVIEW revision loops; PASSED is terminal, so an account with any non-PASSED review is never gated ACTIVE",
        constraints: "enum closed set {PENDING_REVIEW, PASSED, CONDITIONAL, REJECTED}" }
      - { name: construction_uplift_fee_cents, type: integer, source: computed, default: 0, description: "Construction uplift quoted for this review at creation = 304800 per uplift unit plus 76200 for every unit after the first, where an uplift unit is a dimensional check that missed the configuration minimum or fell inside the 5 cm near-miss band" }
      - { name: conditional_clearance_count, type: integer, source: computed, description: "Number of dimensional or integration checks that missed exact match but fell inside the conditional tolerance band" }
      - { name: remediation_note, type: string, source: input, description: "Optional remediation instructions recorded at rejection" }

  - name: SystemConfiguration
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "System model identifier (DA_V1 | DA_V2 | SP_V1 | SP_V2 | SP_V3)" }
      - { name: base_placement_fee_cents, type: integer, source: input, description: "Placement fee floor before dimensional and integration uplift" }
      - { name: max_instrument_lives, type: integer, source: input, description: "Maximum load the removable accessory set of this configuration supports" }
      - { name: feature_entitlements, type: array, source: input, description: "Array of {feature_code, min_release_index}; a feature is entitled on a system when the installed software release_index >= min_release_index" }
      - { name: requires_dark_fiber, type: boolean, source: input, description: "Whether integrations require a dark fiber network run" }
      - { name: requires_dedicated_power_circuit, type: boolean, source: input, description: "Whether integrations require a dedicated power circuit" }
      - { name: integration_tier, type: integer, source: input, description: "Integration depth 1..3; drives the dimensional tolerance band width" }
      - { name: min_operating_room_length_cm, type: integer, source: input, description: "Minimum clear OR length the system footprint requires" }
      - { name: min_operating_room_width_cm, type: integer, source: input, description: "Minimum clear OR width the system footprint requires" }
      - { name: min_table_throw_radius_cm, type: integer, source: input, description: "Minimum arm-throw radius the system requires" }
      - { name: min_ceiling_clearance_cm, type: integer, source: input, description: "Minimum ceiling clearance the system column envelope requires" }
      - { name: status, type: enum, source: system, default: ACTIVE,
        description: "ACTIVE → RETIRED",
        constraints: "enum closed set {ACTIVE, RETIRED}" }

  - name: PlacementAgreement
    parent: HospitalAccount
    common_fields: true
    fields:
      - { name: hospital_account_id, type: string, source: system, description: "FK -> HospitalAccount.id; owning hospital system" }
      - { name: system_configuration_id, type: string, source: system, description: "FK -> SystemConfiguration.id; configuration the agreement places" }
      - { name: site_readiness_review_id, type: string, source: input, description: "FK -> SiteReadinessReview.id; the PASSED review that authorizes this placement" }
      - { name: arrangement_type, type: enum, source: input, description: "PURCHASE | LEASE | USAGE_BASED", constraints: "enum closed set {PURCHASE, LEASE, USAGE_BASED}" }
      - { name: base_monthly_fee_cents, type: integer, source: input, description: "Fixed monthly instrument-and-accessory fee applied to every agreement regardless of arrangement" }
      - { name: minimum_procedures_per_cycle, type: integer, source: input, default: 0, description: "Per-interval utilization commitment; 0 disables the commitment (and the shortfall fee)" }
      - { name: interval_months, type: integer, source: input, default: 1, description: "Length of one commitment interval in months" }
      - { name: placement_fee_cents, type: integer, source: input, description: "System-specific placement fee for PURCHASE agreements" }
      - { name: lease_monthly_amount_cents, type: integer, source: input, description: "Fixed monthly charge for LEASE agreements" }
      - { name: usage_rate_basis_points, type: integer, source: input, description: "Per-procedure rate in basis points of placement_fee_cents for USAGE_BASED agreements" }
      - { name: committed_cases, type: integer, source: computed, description: "Total procedures delivered against this agreement in the current commitment interval, counted over ProcedureCase rows in {SCHEDULED, COMPLETED} whose case_started_at falls in [cycle_start_utc, cycle_end_utc)" }
      - { name: cycle_start_utc, type: datetime, source: system, description: "Inclusive start of the current commitment interval, stamped from the logical clock at activation" }
      - { name: cycle_end_utc, type: datetime, source: computed, description: "Exclusive end of the current commitment interval = cycle_start_utc + interval_months × 30 days" }
      - { name: shortfall_procedures, type: integer, source: computed, description: "Committed procedures not delivered in the closed interval = max(0, minimum_procedures_per_cycle − committed_cases at close)" }
      - { name: synthesized_system_id, type: string, source: system, description: "The RobotSystem minted by the accept transition; null before acceptance. A cascade-created child, discoverable via GET /api/placement-agreements/{agreementId}/robot-systems" }
      - { name: synthesized_system_version, type: integer, source: system, description: "version of synthesized_system_id immediately after synthesis, always 1" }
      - { name: synthesized_service_contract_id, type: string, source: system, description: "The ServiceContract minted by the accept transition; null before acceptance. Discoverable via GET /api/robot-systems/{systemId}/service-contracts" }
      - { name: net_placement_fee_cents, type: integer, source: system, description: "The placement fee re-evaluated at the activation instant under the write_down_after_integration variant; null until the agreement reaches ACTIVE. Diverges from placement_fee_cents (the list fee written at submit) whenever the volume-discount ladder moves." }
      - { name: last_shortfall_fee_cents, type: integer, source: system, default: 0, description: "The shortfall_fee computed at the most recent interval rollover for this agreement; 0 when the interval met its commitment or the shortfall was waived" }
      - { name: is_shortfall_waived, type: boolean, source: system, default: false, description: "Set when an operator waives a shortfall; prevents the compliance cascade for the current interval and is reset on rollover" }
      - { name: compliance_status, type: enum, source: system, default: MEETS_COMMITMENT,
        description: "MEETS_COMMITMENT → SHORTFALL_WARNING → SHORTFALL_CHARGEABLE → NON_COMPLIANT → REMEDIATION_REQUIRED → MEETS_COMMITMENT",
        constraints: "enum closed set {MEETS_COMMITMENT, SHORTFALL_WARNING, SHORTFALL_CHARGEABLE, NON_COMPLIANT, REMEDIATION_REQUIRED}" }
      - { name: agreement_status, type: enum, source: system, default: DRAFT,
        description: "DRAFT → PENDING_ACCEPTANCE → ACTIVE → SUSPENDED → TERMINATED",
        constraints: "enum closed set {DRAFT, PENDING_ACCEPTANCE, ACTIVE, SUSPENDED, TERMINATED}" }
      - { name: acceptance_expires_utc, type: datetime, source: system, description: "Exclusive expiry of the acceptance window = the submit instant + 30 days; the acceptance becomes ineligible at exactly this instant" }
      - { name: activated_at_utc, type: datetime, source: system, description: "Logical-clock instant the agreement left DRAFT" }

  - name: RobotSystem
    parent: HospitalAccount
    common_fields: true
    fields:
      - { name: hospital_account_id, type: string, source: system, description: "FK -> HospitalAccount.id; owning hospital system" }
      - { name: system_configuration_id, type: string, source: system, description: "FK -> SystemConfiguration.id; configuration this physical system was built to" }
      - { name: placement_agreement_id, type: string, source: system, description: "FK -> PlacementAgreement.id; the accepted agreement that synthesized this system" }
      - { name: site_readiness_review_id, type: string, source: system, description: "FK -> SiteReadinessReview.id; the PASSED review this system was installed against" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique across all systems" }
      - { name: service_status, type: enum, source: system, default: NOT_INSTALLED,
        description: "NOT_INSTALLED → INSTALLED → IN_SERVICE → SERVICE_ACTION_REQUIRED → IN_SERVICE, with IN_SERVICE → DECOMMISSIONED",
        constraints: "enum closed set {NOT_INSTALLED, INSTALLED, IN_SERVICE, SERVICE_ACTION_REQUIRED, DECOMMISSIONED}" }
      - { name: installed_software_release_index, type: integer, source: computed, default: 0, description: "Highest release_index delivered to this system by a COMPLETED SoftwareReleaseDeployment" }
      - { name: entitled_feature_codes, type: array, source: computed, description: "Feature codes of the configuration whose min_release_index <= installed_software_release_index" }
      - { name: current_utilization_cycle_id, type: string, source: system, description: "FK -> UtilizationCycle.id; the open reporting cycle for this system, stamped when the system is commissioned" }
      - { name: instrument_lives_remaining, type: integer, source: computed, description: "= configuration.max_instrument_lives - SUM(approved_load) over ProcedureCase rows on this system with case_status IN {SCHEDULED, COMPLETED}, floored at 0" }
      - { name: expansion_eligible, type: boolean, source: computed, description: "True iff service_status ∈ {IN_SERVICE} AND the active ServiceContract has service_priority_index >= 2 AND the current commitment interval's realized utilization is at least minimum_procedures_per_cycle" }

  - name: SurgeonTrainingRecord
    parent: HospitalAccount
    common_fields: true
    fields:
      - { name: hospital_account_id, type: string, source: system, description: "FK -> HospitalAccount.id; the hospital that must hold credentialing evidence" }
      - { name: surgeon_name, type: string, source: input, description: "Surgeon full name" }
      - { name: surgeon_npi, type: string, source: system, description: "Surgeon identifier; unique within a hospital_account_id" }
      - { name: training_status, type: enum, source: system, default: NOT_STARTED,
        description: "NOT_STARTED → SIMULATION_COMPLETE → PROCTORING → CREDENTIALED, with PROCTORING → SIMULATION_INCOMPLETE revision loop",
        constraints: "enum closed set {NOT_STARTED, SIMULATION_COMPLETE, PROCTORING, SIMULATION_INCOMPLETE, CREDENTIALED}" }
      - { name: simulation_modules_completed, type: integer, source: input, default: 0, description: "Completed simulation modules; the proctoring gate requires at least 3" }
      - { name: required_proctored_cases, type: integer, source: input, description: "Proctored case count demanded before credentialing" }
      - { name: proctored_cases_completed, type: integer, source: computed, default: 0, description: "Approved proctored cases on this record" }
      - { name: proctor_approval_pending, type: boolean, source: system, default: false, description: "True while a proctor has logged a case that the ComplianceOfficer has not yet reviewed" }
      - { name: credential_expires_utc, type: datetime, source: computed, description: "= credentialed_at_utc + 365 days; null until CREDENTIALED" }
      - { name: evidence_required_after_utc, type: datetime, source: computed, description: "= credential_expires_utc + 60-day grace; the credential stays PROVISIONALLY_VALID through this instant (inclusive)" }

  - name: CredentialingEvidence
    parent: SurgeonTrainingRecord
    common_fields: true
    fields:
      - { name: surgeon_training_record_id, type: string, source: system, description: "FK -> SurgeonTrainingRecord.id; the training record this evidence substantiates" }
      - { name: hospital_account_id, type: string, source: system, description: "FK -> HospitalAccount.id; the hospital holding the evidence" }
      - { name: evidence_type, type: enum, source: input, description: "CREDENTIAL_LETTER | PRIVILEGE_ATTESTATION | PROCTOR_SIGNOFF_SET", constraints: "enum closed set {CREDENTIAL_LETTER, PRIVILEGE_ATTESTATION, PROCTOR_SIGNOFF_SET}" }
      - { name: issued_utc, type: datetime, source: input, description: "Instant the evidence was issued; must not be later than the logical clock" }
      - { name: expires_utc, type: datetime, source: input, description: "Exclusive expiry; must be strictly later than issued_utc" }
      - { name: evidence_status, type: enum, source: system, default: VALID,
        description: "VALID → EXPIRING_SOON → EXPIRED / REVOKED",
        constraints: "enum closed set {VALID, EXPIRING_SOON, EXPIRED, REVOKED}" }

  - name: UtilizationCycle
    parent: RobotSystem
    common_fields: true
    fields:
      - { name: robot_system_id, type: string, source: system, description: "FK -> RobotSystem.id; the system whose band this cycle reports" }
      - { name: placement_agreement_id, type: string, source: system, description: "FK -> PlacementAgreement.id; the agreement whose commitment interval this cycle mirrors" }
      - { name: cycle_start_utc, type: datetime, source: system, description: "Inclusive start of the reporting interval" }
      - { name: cycle_end_utc, type: datetime, source: computed, description: "Exclusive end = cycle_start_utc + 30 days" }
      - { name: scheduled_case_count, type: integer, source: computed, description: "ProcedureCase rows on this system with case_started_at in [cycle_start_utc, cycle_end_utc), any non-cancelled status" }
      - { name: completed_case_count, type: integer, source: computed, description: "ProcedureCase rows on this system with status COMPLETED and case_started_at in [cycle_start_utc, cycle_end_utc)" }
      - { name: utilization_band, type: enum, source: computed, description: "UNDERUTILIZED at completed_case_count < 8 (strictly), BASELINE at 8..14, HIGH at 15..21, EXPANSION_READY at 22 or more" }
      - { name: same_hour_conflict_count, type: integer, source: computed, description: "Count of other non-cancelled ProcedureCase rows on the same system whose [case_started_at, case_started_at + duration_minutes + 30 turn-over buffer) interval overlaps this cycle's own scheduled case intervals" }
      - { name: reporting_period_index, type: integer, source: system, default: 0, description: "Advanced by the month-close ops run; drives the eligibility window for expansion reviews" }

  - name: ProcedureCase
    parent: RobotSystem
    common_fields: true
    fields:
      - { name: robot_system_id, type: string, source: input, description: "FK -> RobotSystem.id; the system the case is booked on" }
      - { name: hospital_account_id, type: string, source: system, description: "FK -> HospitalAccount.id; serving hospital system" }
      - { name: placement_agreement_id, type: string, source: system, description: "FK -> PlacementAgreement.id; the agreement whose commitment this case counts toward" }
      - { name: training_record_id, type: string, source: input, description: "FK -> SurgeonTrainingRecord.id; the credentialed operator for this case" }
      - { name: procedure_family, type: enum, source: input, description: "UROLOGY | GYNECOLOGY | GENERAL_SURGERY | THORACIC | COLORECTAL", constraints: "enum closed set {UROLOGY, GYNECOLOGY, GENERAL_SURGERY, THORACIC, COLORECTAL}" }
      - { name: case_started_at, type: datetime, source: input, description: "Scheduled case start; the interval [case_started_at, case_started_at + duration_minutes) is the case occupancy" }
      - { name: duration_minutes, type: integer, source: input, description: "Case duration used for occupancy; 30-minute turn-over buffer added for conflict detection" }
      - { name: instrument_load, type: integer, source: input, default: 0, description: "Attempted instrument-and-accessory load for this case; approved loads are clamped to what the remaining lives support" }
      - { name: is_emergency, type: boolean, source: input, default: false, description: "Emergency add-on; may be scheduled against a system in SERVICE_ACTION_REQUIRED" }
      - { name: approved_instrument_load, type: integer, source: computed, description: "The instrument-and-accessory load actually authorized for this case = min(attempted instrument_load, the accessory set's remaining lives at booking); never above the remaining lives" }
      - { name: instrument_billing_cents, type: integer, source: computed, description: "Derived from the agreement arrangement type and whether the case is a billable service" }
      - { name: commitment_cycle_index, type: integer, source: system, description: "The agreement commitment interval the case was booked into, stamped from the logical clock at creation" }
      - { name: case_status, type: enum, source: system, default: SCHEDULED,
        description: "SCHEDULED → COMPLETED, SCHEDULED → CANCELLED, COMPLETED → BILLED, CANCELLED → SCHEDULED",
        constraints: "enum closed set {SCHEDULED, COMPLETED, CANCELLED, BILLED}" }

  - name: LoanerSystemDispatch
    parent: RobotSystem
    common_fields: true
    fields:
      - { name: robot_system_id, type: string, source: system, description: "FK -> RobotSystem.id; the displaced system the loaner covers" }
      - { name: loaner_serial_number, type: string, source: system, description: "Temporary loaner unit identifier; unique while no other dispatch holds it" }
      - { name: dispatch_window_start_utc, type: datetime, source: input, description: "Inclusive start of the loaner occupancy window" }
      - { name: dispatch_window_end_utc, type: datetime, source: input, description: "Exclusive end of the loaner occupancy window" }
      - { name: reservation_status, type: enum, source: system, default: PROGRAMMED,
        description: "PROGRAMMED → ACTIVATED → RETURNED / CANCELLED / RECLAIMED",
        constraints: "enum closed set {PROGRAMMED, ACTIVATED, RETURNED, CANCELLED, RECLAIMED}" }
      - { name: reclaim_reason, type: enum, source: input, description: "DEFERRED_URGENT | CONTRACT_EXPIRED | null; used when a higher-priority dispatch takes this one's window", constraints: "enum closed set {DEFERRED_URGENT, CONTRACT_EXPIRED}" }

  - name: ServiceContract
    parent: RobotSystem
    common_fields: true
    fields:
      - { name: robot_system_id, type: string, source: system, description: "FK -> RobotSystem.id; covered system" }
      - { name: coverage_tier, type: enum, source: input, description: "COMPREHENSIVE | STANDARD | LIMITED | PARTS_ONLY", constraints: "enum closed set {COMPREHENSIVE, STANDARD, LIMITED, PARTS_ONLY}" }
      - { name: service_tier_index, type: integer, source: computed, description: "COMPREHENSIVE → 3, STANDARD → 2, LIMITED → 1, PARTS_ONLY → 0" }
      - { name: response_time_commitment_hours, type: integer, source: computed, description: "= 24 − 6 × service_tier_index (COMPREHENSIVE 6, STANDARD 12, LIMITED 18, PARTS_ONLY 24)" }
      - { name: contract_start_utc, type: datetime, source: input, description: "Inclusive start of coverage; must fall on or after the system's installation instant" }
      - { name: contract_months, type: integer, source: input, description: "Coverage length in months; the end instant is start + months × 30 days" }
      - { name: contract_end_utc, type: datetime, source: computed, description: "Exclusive end = contract_start_utc + contract_months × 30 days" }
      - { name: contract_status, type: enum, source: system, default: ACTIVE,
        description: "ACTIVE → EXPIRED / TERMINATED",
        constraints: "enum closed set {ACTIVE, EXPIRED, TERMINATED}" }

  - name: IncidentServiceRequest
    parent: RobotSystem
    common_fields: true
    fields:
      - { name: robot_system_id, type: string, source: input, description: "FK -> RobotSystem.id; system reporting the incident" }
      - { name: incident_started_at, type: datetime, source: input, description: "Instant the failure interrupted serviceable operation" }
      - { name: resolved_at_utc, type: datetime, source: system, description: "Logical-clock instant the request was resolved; null while OPEN" }
      - { name: incident_severity, type: enum, source: system, default: MINOR,
        description: "Derived from the system's posture and coverage tier at filing; MINOR | MAJOR | CRITICAL",
        constraints: "enum closed set {MINOR, MAJOR, CRITICAL}" }
      - { name: response_due_at_utc, type: datetime, source: computed, description: "= incident_started_at + response_time_commitment_hours of the active ServiceContract" }
      - { name: request_status, type: enum, source: system, default: OPEN,
        description: "OPEN → ACKNOWLEDGED → LOANER_PENDING → LOANER_DISPATCHED → SERVICE_ACTION_REQUIRED → RESOLVED",
        constraints: "enum closed set {OPEN, ACKNOWLEDGED, LOANER_PENDING, LOANER_DISPATCHED, SERVICE_ACTION_REQUIRED, RESOLVED}" }
      - { name: resolution_notes, type: string, source: input, description: "Optional engineer notes recorded at resolution" }

  - name: SoftwareRelease
    parent: SystemConfiguration
    common_fields: true
    fields:
      - { name: system_configuration_id, type: string, source: system, description: "FK -> SystemConfiguration.id; the configuration this release targets" }
      - { name: release_index, type: integer, source: input, description: "Monotonic release ordinal within the configuration; delivery only accepts indexes greater than the system's installed index" }
      - { name: feature_codes, type: array, source: input, description: "Feature codes unlocked at this release_index" }
      - { name: deployed, type: boolean, source: system, default: false, description: "Set true when a SoftwareReleaseDeployment for this release reaches COMPLETED" }

  - name: SoftwareReleaseDeployment
    parent: RobotSystem
    common_fields: true
    fields:
      - { name: robot_system_id, type: string, source: system, description: "FK -> RobotSystem.id; target system" }
      - { name: software_release_id, type: string, source: input, description: "FK -> SoftwareRelease.id; the release being delivered" }
      - { name: deployment_status, type: enum, source: system, default: PROGRAMMED,
        description: "PROGRAMMED → DELIVERED → VALIDATED → COMPLETED, with PROGRAMMED → CANCELLED",
        constraints: "enum closed set {PROGRAMMED, DELIVERED, VALIDATED, COMPLETED, CANCELLED}" }
      - { name: scheduled_window_start_utc, type: datetime, source: input, description: "Inclusive start of the maintenance window; must not precede the creation instant" }
      - { name: scheduled_window_end_utc, type: datetime, source: input, description: "Exclusive end of the maintenance window; must not be earlier than the start, so a zero-length window is accepted" }
      - { name: entitlement_snapshot, type: array, source: computed, description: "Feature codes entitled on the target system after the deployment completes" }

  - name: ExpansionReview
    parent: HospitalAccount
    common_fields: true
    fields:
      - { name: hospital_account_id, type: string, source: system, description: "FK -> HospitalAccount.id; the system being considered for service-line growth" }
      - { name: placement_agreement_id, type: string, source: system, description: "FK -> PlacementAgreement.id; the agreement whose interval is reviewed" }
      - { name: eligible_system_id, type: string, source: computed, description: "Deterministic selector result: among the account's RobotSystem rows with expansion_eligible true, the one with the highest service_priority_index, ties broken by earliest created_at, ignoring the requester's own system" }
      - { name: eligible_system_utilization, type: integer, source: computed, description: "Completed-case count of the selected eligible system in its current UtilizationCycle" }
      - { name: requires_prior_reporting_period, type: boolean, source: computed, description: "True when the targeted agreement's reference UtilizationCycle sits one reporting_period_index behind the account's newest cycle" }
      - { name: review_status, type: enum, source: system, default: DRAFT,
        description: "DRAFT → SUBMITTED → APPROVED / REJECTED, with REJECTED → DRAFT revision loop",
        constraints: "enum closed set {DRAFT, SUBMITTED, APPROVED, REJECTED}" }
      - { name: decided_at_utc, type: datetime, source: system, description: "Logical-clock instant of the terminal decision" }

  - name: UtilisationConsumptionLedger
    parent: HospitalAccount
    common_fields: true
    fields:
      - { name: hospital_account_id, type: string, source: system, description: "FK -> HospitalAccount.id; owning hospital system" }
      - { name: donor_idn_group_code, type: string, source: system, description: "IDN group code of the account that transferred committed-procedure credit into this account" }
      - { name: consumed_procedure_units, type: integer, source: computed, description: "Procedures this account has consumed from intra-IDN credit transfers" }
      - { name: supplied_procedure_units, type: integer, source: computed, description: "Procedures this account has supplied to peers in the same IDN group" }
      - { name: remaining_credit_units, type: integer, source: computed, description: "Committed procedures still transferable = maximum_procedure_commitment − consumed_procedure_units − supplied_procedure_units, floored at 0" }
      - { name: maximum_procedure_commitment, type: integer, source: input, description: "Account-level procedure commitment across all agreements; 0 means the IDN pool is wide open" }

  - name: UtilisationTransferTransaction
    parent: HospitalAccount
    common_fields: true
    fields:
      - { name: source_account_id, type: string, source: input, description: "FK -> HospitalAccount.id; account donating committed-procedure credit" }
      - { name: destination_account_id, type: string, source: input, description: "FK -> HospitalAccount.id; account receiving committed-procedure credit" }
      - { name: procedure_units, type: integer, source: input, description: "Committed-procedure credit moved by this transaction" }
      - { name: transfer_window_start_utc, type: datetime, source: input, description: "Inclusive start of the credit-validity window on the destination account" }
      - { name: transfer_window_end_utc, type: datetime, source: input, description: "Exclusive end of the credit-validity window on the destination account" }
      - { name: transaction_status, type: enum, source: system, default: COMMITTED,
        description: "COMMITTED → SETTLED / REVERSED",
        constraints: "enum closed set {COMMITTED, SETTLED, REVERSED}" }
      - { name: reversal_reason, type: string, source: input, description: "Optional operator note recorded when the transfer is reversed" }
      - { name: settlement_certified_at_utc, type: datetime, source: system, description: "Logical-clock instant the transfer was marked SETTLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Posture-driven gate entity: account_status × account_posture -------------
  - entity: HospitalAccount
    initial_state: PROSPECT
    terminal_states: [CLOSED]
    transitions:
      - from: PROSPECT
        to: READINESS
        trigger: "POST /api/account-readiness-reviews/{reviewId}/activate"
        actor: RegionalSalesDirector
        preconditions:
          - "HospitalAccount.account_status == PROSPECT (ERR_ACCOUNT_NOT_IN_ELIGIBLE_STATE — checked first)"
          - "The account has at least one SiteReadinessReview row (ERR_READINESS_REVIEW_REQUIRED)"
          - "The account has at least one SurgeonTrainingRecord row (ERR_TRAINING_PATH_UNINITIALIZED)"
        side_effects:
          - "hospital_account.account_posture recomputed"
          - "Opening a fresh UtilizationCycle for every RobotSystem of the account (none exist yet on this path)"

      - from: READINESS
        to: CONTRACTED
        trigger: "POST /api/placement-agreements (system, evaluated after the row is created)"
        actor: system
        preconditions:
          - "HospitalAccount.account_status == READINESS (ERR_ACCOUNT_NOT_IN_ELIGIBLE_STATE — checked first)"
          - "A new PlacementAgreement row has just been drafted for this account"
        side_effects:
          - "hospital_account.account_posture recomputed"

      - from: CONTRACTED
        to: ACTIVE
        trigger: "system (automatic when PlacementAgreement.agreement_status becomes ACTIVE)"
        actor: system
        preconditions:
          - "The account has exactly zero non-terminal SiteReadinessReview rows (ERR_READINESS_REVIEW_PENDING)"
          - "The account has at least one PlacementAgreement with agreement_status == ACTIVE (ERR_NO_ACTIVE_AGREEMENT)"
        side_effects:
          - "hospital_account.account_posture recomputed"
          - "PlacementAgreement.cycle_start_utc stamped from the logical clock"
          - "placement_agreement_commitment_state recomputed for the newly active agreement"

      - from: ACTIVE
        to: DORMANT
        trigger: "system (automatic at a month-close ops run when no ProcedureCase on the account was scheduled in the just-closed UtilizationCycle)"
        actor: system
        preconditions:
          - "HospitalAccount.account_status == ACTIVE (ERR_ACCOUNT_NOT_IN_ELIGIBLE_STATE — checked first)"
          - "Zero non-cancelled ProcedureCase rows on the account's systems inside the closed cycle window"
        side_effects:
          - "hospital_account.dormant_since_utc stamped from the logical clock"
          - "hospital_account.account_posture recomputed"

      - from: DORMANT
        to: ACTIVE
        trigger: "POST /api/households/{accountId}/reactivate"
        actor: RegionalSalesDirector
        preconditions:
          - "HospitalAccount.account_status == DORMANT (ERR_ACCOUNT_NOT_IN_ELIGIBLE_STATE — checked first)"
        side_effects:
          - "hospital_account.dormant_since_utc cleared to null"
          - "hospital_account.account_posture recomputed"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/accounts/{accountId}/close"
        actor: PlatformAdmin
        preconditions:
          - "HospitalAccount.account_status ∈ {ACTIVE, DORMANT} (ERR_ACCOUNT_NOT_CLOSABLE — checked first)"
          - "Zero placement agreements in {ACTIVE, SUSPENDED} (ERR_ACTIVE_AGREEMENT_EXISTS)"
        side_effects:
          - "Every non-terminal ProcedureCase on the account's systems → CANCELLED"
          - "Every ACTIVE ServiceContract on the account's systems → TERMINATED"
          - "hospital_account.account_posture recomputed"

      - from: DORMANT
        to: CLOSED
        trigger: "POST /api/accounts/{accountId}/close"
        actor: PlatformAdmin
        preconditions:
          - "HospitalAccount.account_status ∈ {ACTIVE, DORMANT} (ERR_ACCOUNT_NOT_CLOSABLE — checked first)"
          - "Zero placement agreements in {ACTIVE, SUSPENDED} (ERR_ACTIVE_AGREEMENT_EXISTS)"
        side_effects:
          - "Every non-terminal ProcedureCase on the account's systems → CANCELLED"
          - "Every ACTIVE ServiceContract on the account's systems → TERMINATED"
          - "hospital_account.account_posture recomputed"

  # --- Cyclic revision loop ----------------------------------------------------
  - entity: SiteReadinessReview
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: PASSED
        trigger: "POST /api/account-readiness-reviews/{reviewId}/submit-verdict"
        actor: ClinicalOperationsLead
        preconditions:
          - "SiteReadinessReview.readiness_status == PENDING_REVIEW (ERR_READINESS_REVIEW_NOT_PENDING — checked first)"
          - "Operating-room dimensions, table throw radius and ceiling clearance each meet or exceed the evaluated configuration minimums (ERR_ROOM_REQUIREMENTS_UNMET)"
          - "conditional_clearance_count == 0 (ERR_CONDITIONAL_CLEARANCE_REQUIRES_REVIEW)"
          - "required power circuit present when the configuration demands it (ERR_POWER_CIRCUIT_MISSING)"
          - "required dark fiber present when the configuration demands it (ERR_NETWORK_INTEGRATION_MISSING)"
          - "HospitalAccount.account_posture != EXPANSION_BLOCKED (ERR_ACCOUNT_POSTURE_GATE)"
        side_effects:
          - "hospital_account.account_posture recomputed"

      - from: PENDING_REVIEW
        to: CONDITIONAL
        trigger: "POST /api/account-readiness-reviews/{reviewId}/submit-verdict"
        actor: ClinicalOperationsLead
        preconditions:
          - "SiteReadinessReview.readiness_status == PENDING_REVIEW (ERR_READINESS_REVIEW_NOT_PENDING — checked first)"
          - "At least one dimensional or integration check missed exact match but fell inside the evaluated configuration's conditional tolerance band (ERR_ROOM_REQUIREMENTS_UNMET)"
          - "required power circuit present when the configuration demands it (ERR_POWER_CIRCUIT_MISSING)"
          - "required dark fiber present when the configuration demands it (ERR_NETWORK_INTEGRATION_MISSING)"
          - "HospitalAccount.account_posture != EXPANSION_BLOCKED (ERR_ACCOUNT_POSTURE_GATE)"
        side_effects:
          - "hospital_account.account_posture recomputed"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /api/account-readiness-reviews/{reviewId}/reject"
        actor: ClinicalOperationsLead
        preconditions:
          - "SiteReadinessReview.readiness_status == PENDING_REVIEW (ERR_READINESS_REVIEW_NOT_PENDING — checked first)"
          - "remediation_note is a non-empty string (ERR_REMEDIATION_NOTE_REQUIRED)"
        side_effects:
          - "hospital_account.account_posture recomputed"

      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /api/account-readiness-reviews/{reviewId}/return-to-review"
        actor: ClinicalOperationsLead
        preconditions:
          - "SiteReadinessReview.readiness_status == REJECTED (ERR_READINESS_REVIEW_NOT_REJECTED — checked first)"
        side_effects:
          - "review_round += 1"
          - "conditional_clearance_count recomputed against the evaluated configuration"
          - "hospital_account.account_posture recomputed"

      - from: CONDITIONAL
        to: PASSED
        trigger: "POST /api/account-readiness-reviews/{reviewId}/submit-verdict"
        actor: ClinicalOperationsLead
        preconditions:
          - "SiteReadinessReview.readiness_status ∈ {PENDING_REVIEW, CONDITIONAL} (ERR_READINESS_REVIEW_NOT_PENDING — checked first)"
          - "conditional_clearance_count == 0 (ERR_CONDITIONAL_CLEARANCE_REQUIRES_REVIEW)"
          - "HospitalAccount.account_posture != EXPANSION_BLOCKED (ERR_ACCOUNT_POSTURE_GATE)"
        side_effects:
          - "hospital_account.account_posture recomputed"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "system (automatic when the review's evaluated configuration is RETIRED)"
        actor: system
        preconditions:
          - "evaluated configuration status == RETIRED"
        side_effects:
          - "hospital_account.account_posture recomputed"

  # --- Cyclic revision loop ----------------------------------------------------
  - entity: PlacementAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_ACCEPTANCE
        trigger: "POST /api/placement-agreements/{agreementId}/submit"
        actor: RegionalSalesDirector
        preconditions:
          - "PlacementAgreement.agreement_status == DRAFT (ERR_AGREEMENT_NOT_IN_ELIGIBLE_STATE — checked first)"
          - "Referenced SiteReadinessReview.readiness_status == PASSED (ERR_READINESS_REVIEW_NOT_PASSED)"
          - "HospitalAccount.account_posture == ACTIVE (ERR_ACCOUNT_POSTURE_GATE)"
          - "Arrangement-specific commercial terms present: PURCHASE requires placement_fee_cents; LEASE requires lease_monthly_amount_cents; USAGE_BASED requires usage_rate_basis_points (ERR_AGREEMENT_TERMS_INCOMPLETE)"
          - "Adding this agreement keeps the account's count of non-terminal agreements at or below placement_cap when placement_cap >= 1 (ERR_PLACEMENT_CAP_EXCEEDED)"
        side_effects:
          - "hospital_account.account_posture recomputed"

      - from: PENDING_ACCEPTANCE
        to: ACTIVE
        trigger: "POST /api/placement-agreements/{agreementId}/accept"
        actor: HospitalProcurementOfficer
        preconditions:
          - "PlacementAgreement.agreement_status == PENDING_ACCEPTANCE (ERR_AGREEMENT_NOT_IN_ELIGIBLE_STATE — checked first)"
          - "Logical clock instant is strictly before acceptance_expires_utc (ERR_ACCEPTANCE_WINDOW_EXPIRED)"
          - "HospitalAccount.account_posture == ACTIVE (ERR_ACCOUNT_POSTURE_GATE)"
        side_effects:
          - "activated_at_utc stamped from the logical clock"
          - "cycle_start_utc stamped from the logical clock"
          - "cycle_end_utc recomputed = cycle_start_utc + interval_months × 30 days"
          - "A RobotSystem is synthesized in service_status NOT_INSTALLED (RAISE: 1 system, serial-numbered from the agreement)"
          - "A ServiceContract is synthesized in contract_status ACTIVE with coverage_tier COMPREHENSIVE (RAISE: 1 contract)"
          - "hospital_account.account_posture recomputed"
          - "placement_agreement_commitment_state recomputed"

      - from: PENDING_ACCEPTANCE
        to: DRAFT
        trigger: "system (automatic when the logical clock reaches or passes acceptance_expires_utc)"
        actor: system
        preconditions:
          - "Logical clock instant >= acceptance_expires_utc"
        side_effects:
          - "acceptance_expires_utc cleared to null"
          - "hospital_account.account_posture recomputed"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/placement-agreements/{agreementId}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "PlacementAgreement.agreement_status == ACTIVE (ERR_AGREEMENT_NOT_IN_ELIGIBLE_STATE)"
          - "PlacementAgreement.compliance_status == NON_COMPLIANT (ERR_AGREEMENT_NOT_SUSPENDABLE)"
        side_effects:
          - "Every RobotSystem on this agreement → SERVICE_ACTION_REQUIRED"
          - "Contract dispatcher: if a PROGRAMMED or ACTIVATED loaner dispatch covers a system of this agreement, that dispatch → RECLAIMED and its loaner unit becomes available to other dispatches"
          - "hospital_account.account_posture recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/placement-agreements/{agreementId}/reinstate"
        actor: RegionalSalesDirector
        preconditions:
          - "PlacementAgreement.agreement_status == SUSPENDED (ERR_AGREEMENT_NOT_IN_ELIGIBLE_STATE — checked first)"
          - "Every ACTIVE ServiceContract row on this agreement's systems satisfies logical clock < contract_end_utc (ERR_CONTRACT_TEMPORALLY_INVALID)"
        side_effects:
          - "Every RobotSystem on this agreement currently in SERVICE_ACTION_REQUIRED → IN_SERVICE"
          - "hospital_account.account_posture recomputed"
          - "placement_agreement_commitment_state recomputed"

      - from: ACTIVE
        to: DRAFT
        trigger: "POST /api/placement-agreements/{agreementId}/reject"
        actor: HospitalProcurementOfficer
        preconditions:
          - "PlacementAgreement.agreement_status ∈ {DRAFT, PENDING_ACCEPTANCE, ACTIVE} (ERR_AGREEMENT_NOT_IN_ELIGIBLE_STATE — checked first)"
        side_effects:
          - "cycle_start_utc and activated_at_utc cleared to null"
          - "hospital_account.account_posture recomputed"

      - from: PENDING_ACCEPTANCE
        to: DRAFT
        trigger: "POST /api/placement-agreements/{agreementId}/reject"
        actor: HospitalProcurementOfficer
        preconditions:
          - "PlacementAgreement.agreement_status ∈ {DRAFT, PENDING_ACCEPTANCE, ACTIVE} (ERR_AGREEMENT_NOT_IN_ELIGIBLE_STATE — checked first)"
        side_effects:
          - "acceptance_expires_utc cleared to null"
          - "hospital_account.account_posture recomputed"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/placement-agreements/{agreementId}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "PlacementAgreement.agreement_status ∈ {ACTIVE, SUSPENDED} (ERR_AGREEMENT_NOT_TERMINABLE — checked first)"
        side_effects:
          - "Every non-terminal ProcedureCase on this agreement's systems → CANCELLED"
          - "HOP 1: every RobotSystem on this agreement → DECOMMISSIONED"
          - "HOP 2 (caused by hop 1): because each system has left service, every ACTIVE ServiceContract on those systems → TERMINATED, and contract_response_time_commitment is no longer evaluated for them"
          - "HOP 3 (caused by hop 2): because those contracts ended, every OPEN or ACKNOWLEDGED IncidentServiceRequest on those systems → RESOLVED"
          - "Every PROGRAMMED or ACTIVATED LoanerSystemDispatch on this agreement's systems → CANCELLED, releasing its loaner unit"
          - "hospital_account.account_posture recomputed"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/placement-agreements/{agreementId}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "PlacementAgreement.agreement_status ∈ {ACTIVE, SUSPENDED} (ERR_AGREEMENT_NOT_TERMINABLE — checked first)"
        side_effects:
          - "Every non-terminal ProcedureCase on this agreement's systems → CANCELLED"
          - "HOP 1: every RobotSystem on this agreement → DECOMMISSIONED"
          - "HOP 2 (caused by hop 1): because each system has left service, every ACTIVE ServiceContract on those systems → TERMINATED"
          - "HOP 3 (caused by hop 2): because those contracts ended, every OPEN or ACKNOWLEDGED IncidentServiceRequest on those systems → RESOLVED"
          - "Every PROGRAMMED or ACTIVATED LoanerSystemDispatch on this agreement's systems → CANCELLED, releasing its loaner unit"
          - "hospital_account.account_posture recomputed"

  # --- Parallel state dimensions on one row ------------------------------------
  - entity: RobotSystem
    initial_state: NOT_INSTALLED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: NOT_INSTALLED
        to: INSTALLED
        trigger: "POST /api/robot-systems/{systemId}/install"
        actor: ClinicalOperationsLead
        preconditions:
          - "RobotSystem.service_status == NOT_INSTALLED (ERR_SYSTEM_STATUS_INVALID — checked first)"
          - "Referenced SiteReadinessReview.readiness_status == PASSED (ERR_SYSTEM_SITE_NOT_READY)"
          - "HospitalAccount.account_posture == ACTIVE (ERR_ACCOUNT_POSTURE_GATE)"
          - "The parent agreement's logical clock instant sits inside [cycle_start_utc, cycle_end_utc) or the cycle has not yet been closed (ERR_COMMITMENT_CYCLE_NOT_STARTED)"
        side_effects:
          - "hospital_account.account_posture recomputed"

      - from: INSTALLED
        to: IN_SERVICE
        trigger: "POST /api/robot-systems/{systemId}/commission"
        actor: ClinicalOperationsLead
        preconditions:
          - "RobotSystem.service_status == INSTALLED (ERR_SYSTEM_STATUS_INVALID — checked first)"
          - "At least one SurgeonTrainingRecord on the account is CREDENTIALED (ERR_NO_CREDENTIALED_SURGEON)"
          - "An ACTIVE ServiceContract exists on the system (ERR_SERVICE_CONTRACT_REQUIRED)"
        side_effects:
          - "an opening UtilizationCycle → OPEN for this system"
          - "utilization_band recomputed = UNDERUTILIZED"
          - "hospital_account.account_posture recomputed"

      - from: IN_SERVICE
        to: SERVICE_ACTION_REQUIRED
        trigger: "POST /api/robot-systems/{systemId}/open-service-action"
        actor: ServiceEngineer
        preconditions:
          - "RobotSystem.service_status == IN_SERVICE (ERR_SYSTEM_STATUS_INVALID — checked first)"
        side_effects:
          - "HOP 1: hospital_account.account_posture recomputed, and it becomes EXPANSION_BLOCKED because this system is now in SERVICE_ACTION_REQUIRED"
          - "HOP 2 (caused by hop 1): every ACTIVE placement agreement on this system whose compliance_status == NON_COMPLIANT → SUSPENDED"
          - "HOP 2b (also caused by hop 1): the CONTRACT_EXPIRED reclaim wave leaves any PROGRAMMED or ACTIVATED loaner dispatch on this system RECLAIMED"
          - "robot_system.expansion_eligible recompute"
          - "The CONTRACT_EXPIRED reclaim waves of this system's loaner dispatches cancelled or reclaimed"

      - from: SERVICE_ACTION_REQUIRED
        to: IN_SERVICE
        trigger: "POST /api/robot-systems/{systemId}/restore-service"
        actor: ServiceEngineer
        preconditions:
          - "RobotSystem.service_status == SERVICE_ACTION_REQUIRED (ERR_SYSTEM_STATUS_INVALID — checked first)"
          - "Every INCIDENT ServiceRequest on the system whose request_status is not RESOLVED is RESOLVED (ERR_SERVICE_ACTION_UNRESOLVED)"
          - "An ACTIVE ServiceContract row exists on the system with logical clock < contract_end_utc (ERR_SERVICE_CONTRACT_REQUIRED)"
        side_effects:
          - "hospital_account.account_posture recomputed"

      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /api/robot-systems/{systemId}/decommission"
        actor: PlatformAdmin
        preconditions:
          - "RobotSystem.service_status ∈ {IN_SERVICE, INSTALLED} (ERR_SYSTEM_STATUS_INVALID — checked first)"
          - "Zero non-terminal ProcedureCase rows on the system (ERR_SYSTEM_HAS_OPEN_CASES)"
        side_effects:
          - "Every ACTIVE ServiceContract on this system → TERMINATED"
          - "hospital_account.account_posture recomputed"

      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "POST /api/robot-systems/{systemId}/decommission"
        actor: PlatformAdmin
        preconditions:
          - "RobotSystem.service_status ∈ {IN_SERVICE, INSTALLED} (ERR_SYSTEM_STATUS_INVALID — checked first)"
          - "Zero non-terminal ProcedureCase rows on the system (ERR_SYSTEM_HAS_OPEN_CASES)"
        side_effects:
          - "Every ACTIVE ServiceContract on this system → TERMINATED"
          - "hospital_account.account_posture recomputed"

  # --- Cyclic revision loop ----------------------------------------------------
  - entity: SurgeonTrainingRecord
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: SIMULATION_COMPLETE
        trigger: "POST /api/training-records/{recordId}/complete-simulation"
        actor: ClinicalOperationsLead
        preconditions:
          - "SurgeonTrainingRecord.training_status == NOT_STARTED (ERR_TRAINING_STATUS_INVALID — checked first)"
          - "simulation_modules_completed >= 3 (ERR_SIMULATION_MODULES_INCOMPLETE)"
        side_effects: []

      - from: SIMULATION_COMPLETE
        to: PROCTORING
        trigger: "POST /api/training-records/{recordId}/begin-proctoring"
        actor: RegionalSalesDirector
        preconditions:
          - "SurgeonTrainingRecord.training_status == SIMULATION_COMPLETE (ERR_TRAINING_STATUS_INVALID — checked first)"
          - "required_proctored_cases >= 1 (ERR_PROCTORING_REQUIREMENT_MISSING)"
        side_effects: []

      - from: PROCTORING
        to: CREDENTIALED
        trigger: "POST /api/proctor-cases/{proctorCaseId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "SurgeonTrainingRecord.training_status == PROCTORING (ERR_TRAINING_STATUS_INVALID — checked first)"
          - "proctored_cases_completed >= required_proctored_cases (ERR_PROCTORING_CASES_INCOMPLETE)"
          - "At least one CredentialingEvidence with evidence_status ∈ {VALID, EXPIRING_SOON} exists on the record (ERR_CREDENTIALING_EVIDENCE_REQUIRED)"
          - "X-User-ID of the approver is not equal to HospitalAccount.hospital_owner_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "credential_expires_utc stamped = credentialed_at_utc + 365 days"
          - "evidence_required_after_utc stamped = credential_expires_utc + 60 days"
          - "hospital_account.account_posture recomputed"

      - from: PROCTORING
        to: SIMULATION_INCOMPLETE
        trigger: "system (automatic when a proctored case is rejected)"
        actor: system
        preconditions:
          - "A ProctorCase row on this record reached PROCTOR_REJECTED"
        side_effects:
          - "proctored_cases_completed reset to 0"
          - "proctor_approval_pending cleared to false"

      - from: SIMULATION_INCOMPLETE
        to: SIMULATION_COMPLETE
        trigger: "POST /api/training-records/{recordId}/complete-simulation"
        actor: ClinicalOperationsLead
        preconditions:
          - "SurgeonTrainingRecord.training_status ∈ {NOT_STARTED, SIMULATION_INCOMPLETE} (ERR_TRAINING_STATUS_INVALID — checked first)"
          - "simulation_modules_completed >= 3 (ERR_SIMULATION_MODULES_INCOMPLETE)"
        side_effects: []

      - from: CREDENTIALED
        to: PROCTORING
        trigger: "POST /api/training-records/{recordId}/trigger-reevaluation"
        actor: ClinicalOperationsLead
        preconditions:
          - "SurgeonTrainingRecord.training_status == CREDENTIALED (ERR_TRAINING_STATUS_INVALID — checked first)"
          - "credential_expires_utc is earlier than the logical clock instant, or the record carries at least one REVOKED CredentialingEvidence (ERR_RECERTIFICATION_NOT_DUE)"
        side_effects:
          - "proctored_cases_completed reset to 0"
          - "credential_expires_utc cleared to null"
          - "evidence_required_after_utc cleared to null"

  # --- Linear supporting machine -----------------------------------------------
  - entity: CredentialingEvidence
    initial_state: VALID
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: VALID
        to: EXPIRING_SOON
        trigger: "system (automatic at a month-close ops run when expires_utc is no more than 30 days after the logical clock)"
        actor: system
        preconditions:
          - "expires_utc − logical clock <= 30 days"
        side_effects: []

      - from: VALID
        to: EXPIRED
        trigger: "system (automatic when the logical clock reaches or passes expires_utc)"
        actor: system
        preconditions:
          - "logical clock instant >= expires_utc"
        side_effects: []

      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "system (automatic when the logical clock reaches or passes expires_utc)"
        actor: system
        preconditions:
          - "logical clock instant >= expires_utc"
        side_effects: []

      - from: EXPIRING_SOON
        to: VALID
        trigger: "POST /api/credentialing-evidence/{evidenceId}/renew"
        actor: ComplianceOfficer
        preconditions:
          - "CredentialingEvidence.evidence_status ∈ {VALID, EXPIRING_SOON, EXPIRED} (ERR_EVIDENCE_NOT_RENEWABLE — checked first)"
          - "New expires_utc strictly later than issued_utc and strictly later than the logical clock (ERR_EVIDENCE_WINDOW_INVALID)"
        side_effects: []

      - from: EXPIRED
        to: VALID
        trigger: "POST /api/credentialing-evidence/{evidenceId}/renew"
        actor: ComplianceOfficer
        preconditions:
          - "CredentialingEvidence.evidence_status ∈ {VALID, EXPIRING_SOON, EXPIRED} (ERR_EVIDENCE_NOT_RENEWABLE — checked first)"
          - "New expires_utc strictly later than issued_utc and strictly later than the logical clock (ERR_EVIDENCE_WINDOW_INVALID)"
        side_effects: []

      - from: VALID
        to: REVOKED
        trigger: "POST /api/credentialing-evidence/{evidenceId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "CredentialingEvidence.evidence_status != REVOKED (ERR_EVIDENCE_NOT_RENEWABLE — checked first)"
        side_effects: []

      - from: EXPIRING_SOON
        to: REVOKED
        trigger: "POST /api/credentialing-evidence/{evidenceId}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "CredentialingEvidence.evidence_status != REVOKED (ERR_EVIDENCE_NOT_RENEWABLE — checked first)"
        side_effects: []

  # --- Linear supporting machine -----------------------------------------------
  - entity: ServiceContract
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic at a month-close ops run when the logical clock reaches or passes contract_end_utc)"
        actor: system
        preconditions:
          - "logical clock instant >= contract_end_utc"
        side_effects:
          - "The CONTRACT_EXPIRED reclaim wave leaves every PROGRAMMED or ACTIVATED loaner dispatch of this system RECLAIMED"
          - "hospital_account.account_posture recomputed"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/service-contracts/{contractId}/terminate"
        actor: ServiceEngineer
        preconditions:
          - "ServiceContract.contract_status == ACTIVE (ERR_SERVICE_CONTRACT_NOT_ACTIVE — checked first)"
        side_effects:
          - "Every OPEN or ACKNOWLEDGED IncidentServiceRequest on the system → RESOLVED"
          - "hospital_account.account_posture recomputed"

# --- §1.2.1 Concurrency Rules -------------------------------------------------
concurrency_rules:
  - rule_id: agreement-accept-stale-account
    parent_entity: HospitalAccount
    write_endpoint: "POST /api/placement-agreements/{agreementId}/accept"
    occ_field: "expected_hospital_account_version"
    description: |
      Accepting a placement agreement against a HospitalAccount whose version has
      advanced since the client last observed it is rejected: the account's
      posture or service-line tier is what the accept path gates on, and the
      client's observed posture is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: expansion-review-stale-account
    parent_entity: HospitalAccount
    write_endpoint: "POST /api/expansion-reviews"
    occ_field: "expected_hospital_account_version"
    description: |
      Creating an ExpansionReview against a HospitalAccount whose version has
      advanced since the client last observed it is rejected: the eligible-system
      selector reads the account's systems and their service priorities, so the
      client's observed candidate set is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: service-contract-create-stale-robot-system
    parent_entity: RobotSystem
    write_endpoint: "POST /api/service-contracts"
    occ_field: "expected_robot_system_version"
    description: |
      Creating a ServiceContract against a RobotSystem whose version has advanced
      since the client last observed it is rejected: the contract's start instant
      must fall on or after the system's installation, and the client's observed
      installation state is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: instrument_billing_amount
    trigger: "POST /api/robot-systems/{systemId}/procedure-cases (creation), and again on POST /api/procedure-cases/{caseId}/mark-completed"
    algorithm: tiered_pricing
    formula: |
      Evaluated in this pinned order (the order IS the specification):
        1. If the case's parent agreement arrangement_type == PURCHASE:
             instrument_billing_cents = the approved instrument-and-accessory load
             cost, priced at SERVICE_LIST_PRICE_CENTS_PER_LOAD per whole load.
        2. If arrangement_type == LEASE:
             the load is already covered by lease_monthly_amount_cents, so
             instrument_billing_cents = 0.
        3. If arrangement_type == USAGE_BASED:
             instrument_billing_cents = round_half_up(placement_fee_cents *
             usage_rate_basis_points / 10000). The per-procedure rate does NOT
             vary with the load.
        4. A non-COMPLETED case is never billable: any case whose case_status is
         not COMPLETED (i.e. SCHEDULED, CANCELLED) reports
         instrument_billing_cents = 0, overriding steps 1–3.
        5. A case on a system whose service_status is SERVICE_ACTION_REQUIRED is
         never billable: instrument_billing_cents = 0, overriding steps 1–4.
      Rounding is applied once, at the end, on the whole amount.
    input_set: "ProcedureCase rows with case_status IN {SCHEDULED, COMPLETED}; CANCELLED and BILLED rows report 0"
    constants:
      SERVICE_LIST_PRICE_CENTS_PER_LOAD: 125000
    precision: "integer cents, round_half_up, applied once at the end"
    variants:
      - name: quote_at_creation
        when: "the case is created — an estimate for the hospital's scheduling paperwork"
        difference: "Reads the *attempted* instrument_load submitted with the case, before the load is clamped to the accessory set's remaining lives; a case whose attempted load of 3 is clamped to 1 quotes 375000 while its bill settles at 125000"
      - name: settle_at_completion
        when: "the case transitions to COMPLETED — the authoritative amount"
        difference: "Reads the *approved* (clamped) instrument_load actually consumed and only bills when case_status == COMPLETED"

  - name: accessory_lives_billing
    trigger: "POST /api/robot-systems/{systemId}/procedure-cases (creation)"
    algorithm: threshold
    formula: |
      base_amount_cents = instrument_billing_amount for the case.
      lives_remaining = the parent agreement's accessory set surviving lives
                        minus the case's approved instrument_load.
      if lives_remaining <= 0:
          instrument_billing_cents = base_amount_cents + LIVES_EXHAUSTION_SURCHARGE_CENTS
          accessory_set_status = EXHAUSTED
      else:
          instrument_billing_cents = base_amount_cents
          accessory_set_status = AVAILABLE
      The surcharge is charged at lives_remaining == 0 exactly (current load may
      consume the last life) and for every case after that, until a replacement
      accessory set is provisioned.
    input_set: "ProcedureCase rows that reach an approved load; a case whose approved load is 0 never triggers the threshold"
    constants:
      LIVES_EXHAUSTION_SURCHARGE_CENTS: 45000
    precision: "integer cents, round_half_up"

  - name: utilization_banding
    trigger: "POST /api/robot-systems/{systemId}/procedure-cases (completion), POST /api/month-close/runs"
    algorithm: threshold
    formula: |
      c = completed_case_count of the target UtilizationCycle for the target
          robot_system_id, counted over ProcedureCase rows with case_status ==
          COMPLETED and case_started_at in [cycle_start_utc, cycle_end_utc).
      utilization_band:
          UNDERUTILIZED   when c <= 7
          BASELINE        when 8 <= c <= 14
          HIGH            when 15 <= c <= 21
          EXPANSION_READY when c >= 22
      The band boundaries are inclusive on the lower edge of BASELINE (c == 8 is
      BASELINE, not UNDERUTILIZED) and on the lower edge of EXPANSION_READY
      (c == 22 is EXPANSION_READY, not HIGH).
    input_set: "ProcedureCase rows on the system with case_status == COMPLETED only; SCHEDULED rows count toward scheduled_case_count but never toward the band"
    constants:
      BASELINE_FLOOR_CASES: 8
      HIGH_FLOOR_CASES: 15
      EXPANSION_READY_FLOOR_CASES: 22
    precision: "integer case counts"

  - name: construction_uplift_fee
    trigger: "POST /api/account-readiness-reviews (creation)"
    algorithm: tiered_pricing
    formula: |
      Evaluated in this pinned order:
        1. unmet_count = the count of dimensional checks (operating_room_length_cm,
           operating_room_width_cm, table_throw_radius_cm, ceiling_clearance_cm)
           whose submitted value is below the evaluated configuration's minimum
        2. near_count = the count of those same checks whose submitted value is at
           or above the minimum but below minimum + NEAR_MISS_TOLERANCE_CM
        3. uplift_units = unmet_count + near_count
        4. if uplift_units == 0:
               construction_uplift_fee_cents = 0
           else:
               construction_uplift_fee_cents = (304800 * uplift_units)
                                             + (76200 * max(0, uplift_units - 1))
      The nested max makes the second uplift unit cost strictly more than the
      first: one uplift unit costs 304800, and two cost 685800 rather than 609600.
    input_set: "One SiteReadinessReview's four dimensional measurements measured against its evaluated configuration's minimums"
    constants:
      CONSTRUCTION_UPLIFT_BASE_CENTS: 304800
      CONSTRUCTION_UPLIFT_ESCALATION_CENTS: 76200
      NEAR_MISS_TOLERANCE_CM: 5
    precision: "integer cents, round_half_up"

  - name: system_expansion_eligibility
    trigger: "POST /api/expansion-reviews, POST /api/month-close/runs"
    algorithm: threshold
    formula: |
      expansion_eligible =
            (robot_system.service_status == IN_SERVICE)
        AND (the system's ACTIVE ServiceContract service_tier_index >= 2)
        AND (the system's current UtilizationCycle completed_case_count >= the
             parent agreement's minimum_procedures_per_cycle)
      A minimum_procedures_per_cycle of 0 makes the third conjunct vacuously true.
    input_set: "One RobotSystem row plus its current UtilizationCycle and its ACTIVE ServiceContract"
    constants:
      MIN_SERVICE_TIER_INDEX: 2
    precision: "boolean"

  - name: placement_fee
    trigger: "POST /api/placement-agreements/{agreementId}/submit"
    algorithm: forward_looking
    formula: |
      Evaluated in this pinned order:
        1. dimensional_uplift = ceil(conditional_clearance_count / 2) * 150000
        2. integration_uplift = configuration.integration_tier * 250000
        3. gross_fee = configuration.base_placement_fee_cents
                       + dimensional_uplift + integration_uplift
        4. idn_scale = the count of HospitalAccount rows in the SAME idn_group_code
           whose account_status IN {ACTIVE, DORMANT}
        5. volume_discount_rate = min(0.04, 0.02 * idn_scale)
        6. volume_discount = gross_fee * volume_discount_rate
        7. placement_fee_cents = round_half_up(gross_fee − volume_discount)
      The uplift uses the readiness review's conditional_clearance_count at the
      submit instant, which is 0 for a review that reached PASSED with exact
      matches. The ladder's idn_scale is evaluated AFTER the calling transition's
      own account_status change, so an accept call counts the newly ACTIVE account
      itself while a submit call does not.
    input_set: "The submitted agreement, its passed SiteReadinessReview, its SystemConfiguration, and every non-CLOSED HospitalAccount in the same idn_group_code"
    constants:
      DIMENSIONAL_UPLIFT_PER_TWO_CLEARANCES_CENTS: 150000
      INTEGRATION_UPLIFT_PER_TIER_CENTS: 250000
      IDN_VOLUME_DISCOUNT_PER_PEER: 0.02
    precision: "integer cents, round_half_up, applied once at the end"
    variants:
      - name: list_fee_at_submit
        when: "the agreement is drafted and submitted — contracts and purchase orders are written against this number"
        difference: "Evaluates the ladder against the submit instant, at which the submitting account is still CONTRACTED and therefore counts 0 toward idn_scale; a single-site IDN is placed at volume_discount_rate 0.00"
      - name: write_down_after_integration
        when: "the agreement is accepted and activated — the amount actually invoiced"
        difference: "Re-evaluates the ladder against the activation instant, at which the account itself has become ACTIVE and now counts 1 toward idn_scale, so the same agreement invoices at volume_discount_rate 0.02 and a strictly lower placement_fee_cents than the list fee it was submitted at"

  - name: instrument_lives_remaining
    trigger: "POST /api/robot-systems/{systemId}/instrument-lives/decrement, POST /api/robot-systems/{systemId}/instrument-lives/reset"
    algorithm: aggregate
    formula: |
      remaining_lives = configuration.max_instrument_lives − SUM(approved_load) over
      every ProcedureCase on the agreement's systems with case_status IN
      {SCHEDULED, COMPLETED}; the floor is 0 and the accumulator never goes negative.
      A provisioning reset (POST .../instrument-lives/reset) sets remaining_lives back
      to configuration.max_instrument_lives and is the only action that raises it.
    input_set: "ProcedureCase rows with case_status IN {SCHEDULED, COMPLETED} on the agreement's systems; CANCELLED rows release their load back to the accumulator"
    constants: {}
    precision: "integer"

  - name: shortfall_fee
    trigger: "POST /api/month-close/runs (interval rollover)"
    algorithm: chronological
    formula: |
      At rollover, per agreement with arrangement_type == USAGE_BASED and
      minimum_procedures_per_cycle >= 1:
        1. c = agreement.committed_cases over ProcedureCase rows with
           case_status IN {SCHEDULED, COMPLETED} and case_started_at in
           [cycle_start_utc, cycle_end_utc)
        2. shortfall_procedures = max(0, minimum_procedures_per_cycle − c)
        3. if is_shortfall_waived: shortfall_fee_cents = 0
        4. elif shortfall_procedures == 0: shortfall_fee_cents = 0
        5. elif shortfall_procedures <= SHORTFALL_GRACE_PROCEDURES:
                shortfall_fee_cents = 0
           else:
                shortfall_fee_cents = round_half_up(
                    (shortfall_procedures − SHORTFALL_GRACE_PROCEDURES)
                    × placement_fee_cents
                    × SHORTFALL_RATE_BASIS_POINTS / 10000)
      The grace band is inclusive: a shortfall of exactly 2 procedures under a
      commitment of 10 yields 0, a shortfall of 3 yields 1 × placement_fee × 2%.
    input_set: "One agreement plus its ProcedureCase rows in the closing interval; only agreements with minimum_procedures_per_cycle >= 1 produce a fee"
    constants:
      SHORTFALL_GRACE_PROCEDURES: 2
      SHORTFALL_RATE_BASIS_POINTS: 200
    precision: "integer cents, round_half_up"
    variants:
      - name: reconciliation_at_interval_close
        when: "the interval is rolled over by a month-close run"
        difference: "Uses ProcedureCase rows with case_status IN {SCHEDULED, COMPLETED} at the close instant, so cases still SCHEDULED but not yet delivered (no-shows) count toward the commitment"
      - name: actual_at_billing
        when: "the invoice is issued for the closed interval"
        difference: "Uses only case_status IN {COMPLETED} rows, so a no-show that was never delivered re-opens shortfall that the reconciliation view had credited"

  - name: shortfall_compliance_status
    trigger: "POST /api/month-close/runs, POST /api/placement-agreements/{agreementId}/waive-shortfall"
    algorithm: threshold
    formula: |
      tier = round_half_up(closed-cycle shortfall streak × placement_fee_cents
                           / 1000000)
      compliance_status:
          MEETS_COMMITMENT      when the current interval shortfall == 0 or is waived
          SHORTFALL_WARNING     when tier <= 10
          SHORTFALL_CHARGEABLE  when 10 < tier <= 25
          NON_COMPLIANT         when tier > 25
          REMEDIATION_REQUIRED  when the same agreement occupies tier > 25 at two
                                consecutive month-close runs
      The boundary is strict on the upper edge of the warning band: tier == 10 is
      SHORTFALL_WARNING, tier == 11 is SHORTFALL_CHARGEABLE.
    input_set: "One agreement; the closed-cycle shortfall streak is the count of consecutive prior closed intervals with shortfall_procedures > 0"
    constants:
      TIER_SCALE_DIVISOR: 1000000
    precision: "integer tier"
    variants:
      - name: provisional_at_reconciliation
        when: "the interval's reconciliation view is produced at a month-close run, before any waiver is applied"
        difference: "Ignores is_shortfall_waived, so a waived interval still reports its pre-waiver tier"
      - name: authoritative_after_waiver
        when: "the compliance report is read after the waiver window closes"
        difference: "A waived interval contributes 0 to the streak and reports MEETS_COMMITMENT"

  - name: service_response_commitment
    trigger: "POST /api/incident-service-requests"
    algorithm: threshold
    formula: |
      tier_index = {COMPREHENSIVE: 3, STANDARD: 2, LIMITED: 1, PARTS_ONLY: 0}
      response_time_commitment_hours = 24 − 6 × tier_index
      response_due_at_utc = incident_started_at + response_time_commitment_hours
      incident_severity:
          CRITICAL  when the system's service_status == SERVICE_ACTION_REQUIRED
                    at filing
          MAJOR     when the system's service_status == IN_SERVICE but the
                    account's posture != ACTIVE
          MINOR     otherwise
      The breach instant is exclusive: an acknowledgement stamped exactly at
      response_due_at_utc is NOT a breach.
    input_set: "One RobotSystem plus its ACTIVE ServiceContract plus its owning account's posture"
    constants:
      BASE_RESPONSE_HOURS: 24
      HOURS_REDUCTION_PER_TIER: 6
    precision: "integer hours"

  - name: incident_resolution_penalty
    trigger: "POST /api/incident-service-requests/{incidentId}/resolve, month-close ops run (rollover of unresolved incidents)"
    algorithm: decay_function
    formula: |
      t = tier_index + 1
      resolved_at_utc <= response_due_at_utc               → penalty 0
      response_due_at_utc < resolved_at_utc <= due+6h      → penalty 2 points
      due+6h < resolved_at_utc <= due+24h                  → penalty 2 × t points
      resolved_at_utc > due+24h                            → penalty 4 × t points
      The system is then clamped: penalty_balance_points =
      min(MAX_PENALTY_POINTS, penalty_balance_points + raw_penalty).
      A monthly decay removes 1 point from penalty_balance_points at the start of
      each month-close run before the closing incidents are scored.
    input_set: "IncidentServiceRequest rows with request_status == RESOLVED whose resolved_at_utc falls in the closed interval"
    constants:
      MAX_PENALTY_POINTS: 15
      GRACE_HOURS: 6
      ESCALATION_HOURS: 24
    precision: "integer points"
    variants:
      - name: provisional_penalty
        when: "the incident is still unresolved as the interval closes — a worst-case projection"
        difference: "Projects the penalty as if the incident resolves exactly at the end of the escalation band, giving 4 × t points"
      - name: final_penalty
        when: "the incident is resolved and the actual resolved_at_utc is known"
        difference: "Replaces the projection with the tier the actual resolution instant lands in, so a resolution inside the grace band drops a projected 4 × t to 0"

  - name: penalty_balance
    trigger: "POST /api/month-close/runs, POST /api/incident-service-requests/{incidentId}/resolve"
    algorithm: aggregate
    formula: |
      penalty_balance_points = (opening balance after decay)
                               + SUM(incident_resolution_penalty of every incident
                                     resolved in the interval)
                               + SUM(existing penalty points of transferred units)
      clamped to [0, MAX_PENALTY_POINTS]. The opening balance is the prior
      interval's balance minus 1 decay point, floored at 0.
    input_set: "All RESOLVED IncidentServiceRequest rows in the interval, plus the transferred loaner units carrying penalty points"
    constants:
      MAX_PENALTY_POINTS: 15
      MONTHLY_DECAY_POINTS: 1
    precision: "integer points"

  - name: contract_response_time_commitment
    trigger: "POST /api/service-contracts"
    algorithm: tiered_pricing
    formula: |
      Evaluated in this pinned order:
        1. service_tier_index = {COMPREHENSIVE: 3, STANDARD: 2, LIMITED: 1,
           PARTS_ONLY: 0} — a coverage_tier outside that closed set raises
           ERR_CONTRACT_TIER_UNRECOGNIZED at step 1 and stops here
        2. base_hours = 48 − (12 × service_tier_index)
        3. response_time_commitment_hours = min(24, max(4, base_hours))
      The PINNED order inside step 3 is the trap: the inner max clamps first, so a
      tier that mapped below PARTS_ONLY lands on 4 hours, and the outer min then
      clamps the COMPREHENSIVE branch down from 36 to 24 — an implementation that
      applies max after min reports 36 for COMPREHENSIVE instead of 24.
    input_set: "One ServiceContract row"
    constants:
      BASE_RESPONSE_HOURS: 48
      HOURS_REDUCTION_PER_TIER: 12
      MIN_RESPONSE_HOURS: 4
      MAX_RESPONSE_HOURS: 24
    precision: "integer hours"

  - name: loaner_window_overlap
    trigger: "POST /api/loaner-dispatches"
    algorithm: interval_merge
    formula: |
      Half-open interval arithmetic with a mandatory buffer:
          [A, B) where B = A + LOANER_WINDOW_DAYS × 24 hours + LOANER_BUFFER_HOURS
      A candidate dispatch on loaner unit L is rejected when its buffered interval
      overlaps any non-terminal dispatch on L. Overlap is defined as:
          candidate_start < existing_end_buffered
          AND candidate_end_buffered > existing_start
      Adjacency is permitted: candidate_start exactly equal to an existing
      buffered end is NOT an overlap (half-open), while a one-minute intrusion is.
      Dispatch windows also carry a borrow limit of LOANER_WINDOW_DAYS + 3 days of
      unreturned hold before the unit is reclaimed.
    input_set: "LoanerSystemDispatch rows on the same loaner_serial_number with reservation_status IN {PROGRAMMED, ACTIVATED}"
    constants:
      LOANER_WINDOW_DAYS: 14
      LOANER_BUFFER_HOURS: 4
      LOANER_BORROW_LIMIT_DAYS: 17
    precision: "minute-precision datetimes"

  - name: transfer_window_overlap
    trigger: "POST /api/utilisation-transfer-transactions"
    algorithm: interval_merge
    formula: |
      Closed-window arithmetic with a day-granular boundary and a shared-pool
      capacity rule:
          candidate window is the CLOSED date range
          [transfer_window_start_utc.date, transfer_window_end_utc.date]
          (both endpoints inclusive)
      Reject when any non-REVERSED UtilisationTransferTransaction on the same
      destination_account_id has a closed window overlapping the candidate, OR
      when the SUM(procedure_units) of non-REVERSED transactions on the same
      source_account_id inside their validity windows exceeds the source account's
      maximum_procedure_commitment.
      Grace: a 3-day grace band permits a candidate whose start date is within 3
      days after an existing window's inclusive end date to merge into it instead
      of being rejected — the merged window then spans both.
    input_set: "UtilisationTransferTransaction rows with transaction_status IN {COMMITTED, SETTLED}"
    constants:
      TRANSFER_GRACE_DAYS: 3
    precision: "date granularity (UTC)"

  - name: training_path_eligibility
    trigger: "POST /api/training-records/{recordId}/begin-proctoring, POST /api/proctor-cases/{proctorCaseId}/approve"
    algorithm: constraint_propagation
    formula: |
      Evaluated in this pinned order — each step's output feeds the next:
        1. simulation_ready = simulation_modules_completed >= MIN_SIMULATION_MODULES
        2. proctoring_ready = simulation_ready AND required_proctored_cases >= 1
        3. proctoring_satisfied = proctoring_ready
                                  AND proctored_cases_completed >= required_proctored_cases
        4. credentialing_ready = proctoring_satisfied
                                 AND count(CredentialingEvidence with evidence_status
                                           IN {VALID, EXPIRING_SOON}) >= 1
        5. credential_valid = credentialing_ready
                              AND logical clock <= evidence_required_after_utc
        6. case_eligible = credential_valid
                           AND the case's procedure_family is present among the
                               account's COMPLETED ProcedureCase families OR the
                               account's service_line_tier index < ACTIVITY_TIER_FLOOR
      Boundary: step 5 uses <= (inclusive) because the evidence grace instant is
      itself valid; step 6's family gate applies only once the account's
      service_line_tier index has reached ACTIVITY_TIER_FLOOR.
    input_set: "One SurgeonTrainingRecord plus its CredentialingEvidence rows plus the account's COMPLETED ProcedureCase families"
    constants:
      MIN_SIMULATION_MODULES: 3
      ACTIVITY_TIER_FLOOR: 2
    precision: "boolean"

  - name: expansion_eligibility_selection
    trigger: "POST /api/expansion-reviews"
    algorithm: waterfall_allocation
    formula: |
      Evaluated in this pinned order:
      Support requests are BINARY, not partial: each expansion review round
      carries exactly one support_request_ranking, equal to its requested
      service_line_tier index, and that round either clears every eligible system
      or clears none. Evaluated in this pinned order:
        (a) support_request_ranking = the requested service_line_tier index
        (b) supported_system_count = the number of eligible systems whose parent
            agreement's minimum_procedures_per_cycle is <= EXPANSION_VOLUME_TARGET
            at the request instant
        (c) available_case_capacity = EXPANSION_VOLUME_TARGET × supported_system_count
        (d) allocate_case_capacity = min(REQUESTED_CAPACITY, available_case_capacity)
        (e) total_allocated_case_capacity = min(allocate_case_capacity,
            EXPANSION_VOLUME_TARGET × eligible_system_count)
        (f) unallocated_case_capacity = EXPANSION_VOLUME_TARGET × (eligible_system
            count − supported_system_count), floored at 0
      Eligible systems are those with expansion_eligible true. When two eligible
      systems tie on support_request_ranking, the tie-break is ascending created_at,
      never id.
    input_set: "Every RobotSystem of the account with expansion_eligible true, plus the account's utilisation support ranks"
    constants:
      EXPANSION_VOLUME_TARGET: 22
      REQUESTED_CAPACITY: 22
    precision: "integer cases"

  - name: service_line_tier_index
    trigger: "POST /api/procedure-cases/{caseId}/mark-completed"
    algorithm: aggregation
    formula: |
      distinct_families = count of DISTINCT procedure_family values among
      ProcedureCase rows on the account with case_status == COMPLETED
      service_line_tier index:
          0 when distinct_families == 1     → tier OBSERVATIONAL
          1 when distinct_families == 2     → tier ESTABLISHED
          2 when distinct_families == 3     → tier DEVELOPING
          3 when distinct_families == 4     → tier ADVANCED
          4 when distinct_families >= 5     → tier REFERENCE
      Boundary: the index equals distinct_families - 1 and saturates at 4, so a
      single-family account sits at index 0 (OBSERVATIONAL) and a five-family
      account at index 4 (REFERENCE).
    input_set: "ProcedureCase rows on the account with case_status == COMPLETED only"
    constants:
      FAMILY_STEP: 1
    precision: "integer index 0..4"

  - name: idn_pool_subscription
    trigger: "POST /api/utilisation-transfer-transactions, POST /api/utilisation-consumption-ledgers/{ledgerId}/bootstrap-decrement"
    algorithm: aggregate
    formula: |
      Evaluated in this pinned order, with the pool conserved as an explicit
      accounting identity:
        (a) A caveat applies when the agreement's placement_fee_cents is exactly 0,
            and that caveat is ignored whenever committed_cases > 0
        (b) B caveat applies when the report is read at reporting_period_index > 2
            and consumed_procedure_units > 0 at the same read
        (c) pool_budget = the account ledger's maximum_procedure_commitment when the
            caveat in (a) is inapplicable, otherwise SURPLUS_POOL_BUDGET
        (d) pool_left = pool_budget − SUM(consumed_procedure_units of the account's
            UtilisationConsumptionLedger)   [unsigned: when pool_left is negative
            the pool is over-consumed, never wrapped]
        (e) available_units_to_transfer = min(requested procedure_units, pool_left)
        (f) closing_consumption = SUM(consumed_procedure_units) − SUM(supplied_procedure_units)
            + SUM(procedure_units of non-REVERSED UtilisationTransferTransaction rows
                  on the account's idn_group_code)
        (g) aggregate_utilisation = committed_cases of the agreement's current
            interval + closing_consumption of the destination account, and the
            conserved quantity C = aggregate_utilisation − closing_consumption ×
            unallocated_case_capacity must be identical before and after every
            transfer, so a reversal restores C exactly
        (h) is_pool_saturated = (aggregate_utilisation >= MAX_POOL_UTILISATION_UNITS)
    input_set: "The account's consumption ledger plus the agreement's current-interval committed_cases; negative consumption units clamp at 0"
    constants:
      MAX_POOL_UTILISATION_UNITS: 25
      SURPLUS_POOL_BUDGET: 30
    precision: "integer units"

  - name: procedure_schedule_conflict
    trigger: "POST /api/robot-systems/{systemId}/procedure-cases (creation), POST /api/procedure-cases/{caseId}/reschedule"
    algorithm: interval_merge
    formula: |
      Evaluated in this pinned order:
        1. candidate_occupancy = [case_started_at,
                                  case_started_at + duration_minutes + 30 minutes)
        2. Reject when candidate_occupancy overlaps any non-cancelled
           ProcedureCase on the same robot_system_id, where the sibling's
           occupancy is [sibling.case_started_at,
           sibling.case_started_at + sibling.duration_minutes + 30 minutes)
        3. A case may always be rescheduled against its own freed slot: the
           candidate replaces the case's own prior occupancy rather than
           colliding with it.
      Adjacency is not conflict: a candidate starting exactly at a sibling's
      buffered end is accepted.
    input_set: "ProcedureCase rows on the same system with case_status IN {SCHEDULED, COMPLETED}"
    constants:
      TURNOVER_BUFFER_MINUTES: 30
    precision: "minute-precision"

  - name: shortfall_escalation
    trigger: "POST /api/month-close/runs"
    algorithm: threshold
    formula: |
      Evaluated in this pinned order over the agreement's streak of consecutive
      prior closed intervals with shortfall_procedures > 0:
        1. streak_escalation_tier = the largest integer t with
           REMAINDER(2^t, ESCALATION_MODULUS) != 1, examined in ascending t
        2. period_quota = {0: 0, 1: 1, 2: 2, 3: 4}[streak_escalation_tier]
        3. escalation_effective = period_quota > 0 AND (the reporting_period_index
           of the agreement's current UtilizationCycle modulo period_quota) == 0
        4. when escalation_effective, the agreement is driven to
           REMEDIATION_REQUIRED at this run regardless of its tier
      The trap is step 1: because REMAINDER(2^3, 7) == 1, the ladder stops at
      tier 2 and period_quota is 2 — never 4.
    input_set: "One agreement plus the reporting_period_index of its current UtilizationCycle"
    constants:
      ESCALATION_MODULUS: 7
    precision: "integer tier and period quota"

  - name: expansion_status_recompute
    trigger: "POST /api/procedure-cases/{caseId}/mark-completed, POST /api/month-close/runs"
    algorithm: constraint_propagation
    formula: |
      cap_ratio = total_allocated_case_capacity / (EXPANSION_VOLUME_TARGET × the
                  count of eligible systems), floored at 0
      expansion_status:
          CAPACITY_DEFERRED  when cap_ratio < 1.0
          EXPANSION_READY    when cap_ratio == 1.0 and unallocated_case_capacity == 0
    input_set: "ExpansionReview rows with review_status IN {SUBMITTED, APPROVED} only; DRAFT and REJECTED rows never contribute"
    constants:
      EXPANSION_VOLUME_TARGET: 22
    precision: "ratio, 4 decimal places"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number runs first)
# =============================================================================
validations:

  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "The acting role is permitted for this operation", error_id: ERR_AGENT_NOT_PERMITTED, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "A region-scoped role acts only on HospitalAccount rows whose region_code equals the acting identity's own region_code", error_id: ERR_REGION_SCOPE_VIOLATION, http_status: 403, applies_to: "all endpoints" }
  - { priority: 4, category: existence, check: "Every resource id in the path resolves to a row", error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND", http_status: 404, applies_to: "all endpoints with a path id" }

  - { priority: 5, category: state, check: "HospitalAccount.account_status is in the set the transition requires", error_id: ERR_ACCOUNT_NOT_IN_ELIGIBLE_STATE, http_status: 409, applies_to: "POST /api/accounts/{accountId}/close, POST /api/households/{accountId}/reactivate, POST /api/account-readiness-reviews/{reviewId}/activate, POST /api/account-readiness-reviews/{reviewId}/submit-verdict" }
  - { priority: 6, category: state, check: "SiteReadinessReview.readiness_status is in the set the transition requires", error_id: ERR_READINESS_REVIEW_NOT_PENDING, http_status: 409, applies_to: "POST /api/account-readiness-reviews/{reviewId}/submit-verdict, POST /api/account-readiness-reviews/{reviewId}/reject, POST /api/account-readiness-reviews/{reviewId}/return-to-review" }
  - { priority: 7, category: state, check: "PlacementAgreement.agreement_status is in the set the transition requires", error_id: ERR_AGREEMENT_NOT_IN_ELIGIBLE_STATE, http_status: 409, applies_to: "POST /api/placement-agreements/{agreementId}/submit, accept, suspend, reinstate, reject" }
  - { priority: 8, category: state, check: "RobotSystem.service_status is in the set the transition requires", error_id: ERR_SYSTEM_STATUS_INVALID, http_status: 409, applies_to: "POST /api/robot-systems/{systemId}/install, commission, restore-service, decommission" }
  - { priority: 9, category: state, check: "SurgeonTrainingRecord.training_status is in the set the transition requires", error_id: ERR_TRAINING_STATUS_INVALID, http_status: 409, applies_to: "POST /api/training-records/{recordId}/complete-simulation, begin-proctoring, trigger-reevaluation, POST /api/proctor-cases/{proctorCaseId}/approve" }
  - { priority: 10, category: state, check: "CredentialingEvidence.evidence_status permits the operation", error_id: ERR_EVIDENCE_NOT_RENEWABLE, http_status: 409, applies_to: "POST /api/credentialing-evidence/{evidenceId}/renew, POST /api/credentialing-evidence/{evidenceId}/revoke" }
  - { priority: 11, category: state, check: "ServiceContract.contract_status == ACTIVE", error_id: ERR_SERVICE_CONTRACT_NOT_ACTIVE, http_status: 409, applies_to: "POST /api/service-contracts/{contractId}/terminate" }

  - { priority: 12, category: business_safety, check: "Every operating-room dimension and the table throw radius meet or exceed the evaluated configuration's minimums", error_id: ERR_ROOM_REQUIREMENTS_UNMET, http_status: 422, applies_to: "POST /api/account-readiness-reviews/{reviewId}/submit-verdict" }
  - { priority: 13, category: business_safety, check: "conditional_clearance_count == 0 before a review may reach PASSED", error_id: ERR_CONDITIONAL_CLEARANCE_REQUIRES_REVIEW, http_status: 422, applies_to: "POST /api/account-readiness-reviews/{reviewId}/submit-verdict" }
  - { priority: 14, category: business_safety, check: "Site provides the dedicated power circuit whenever the evaluated configuration requires one", error_id: ERR_POWER_CIRCUIT_MISSING, http_status: 422, applies_to: "POST /api/account-readiness-reviews/{reviewId}/submit-verdict, POST /api/system-configurations" }
  - { priority: 15, category: business_safety, check: "Site provides the dark fiber run whenever the evaluated configuration requires one", error_id: ERR_NETWORK_INTEGRATION_MISSING, http_status: 422, applies_to: "POST /api/account-readiness-reviews/{reviewId}/submit-verdict, POST /api/system-configurations" }
  - { priority: 16, category: business_safety, check: "At least one CredentialingEvidence with evidence_status IN {VALID, EXPIRING_SOON} exists on the record before credentialing", error_id: ERR_CREDENTIALING_EVIDENCE_REQUIRED, http_status: 422, applies_to: "POST /api/proctor-cases/{proctorCaseId}/approve" }
  - { priority: 17, category: business_safety, check: "X-User-ID of the approving ComplianceOfficer differs from HospitalAccount.hospital_owner_user_id", error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http_status: 403, applies_to: "POST /api/proctor-cases/{proctorCaseId}/approve, POST /api/expansion-reviews/{reviewId}/approve" }

  - { priority: 18, category: business_referential, check: "Every referenced parent row still exists in a non-terminal state and shares the child's hospital_account_id", error_id: ERR_REFERENTIAL_INTEGRITY_VIOLATION, http_status: 409, applies_to: "POST /api/robot-systems/{systemId}/procedure-cases, POST /api/placement-agreements, POST /api/expansion-reviews, POST /api/utilisation-transfer-transactions" }

  - { priority: 19, category: business_constraint, check: "Case occupancy [case_started_at, start + duration_minutes + 30min) does not overlap any non-cancelled case on the same system, excluding the case's own prior occupancy", error_id: ERR_CASE_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /api/robot-systems/{systemId}/procedure-cases, POST /api/procedure-cases/{caseId}/reschedule" }
  - { priority: 20, category: business_constraint, check: "Lives-clamped instrument load does not exceed the accessory set's remaining_lives", error_id: ERR_INSTRUMENT_LIVES_EXHAUSTED, http_status: 409, applies_to: "POST /api/robot-systems/{systemId}/procedure-cases" }
  - { priority: 21, category: business_constraint, check: "Loaner dispatch window [start, start + 14d + 4h) does not overlap any non-terminal dispatch on the same loaner_serial_number", error_id: ERR_LOANER_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/loaner-dispatches" }
  - { priority: 22, category: business_constraint, check: "Closed transfer validity window does not overlap any non-REVERSED transfer window on the destination account, ignoring gaps of 3 days or fewer", error_id: ERR_TRANSFER_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/utilisation-transfer-transactions" }
  - { priority: 23, category: business_constraint, check: "robot_system.serial_number is unique across all RobotSystem rows", error_id: ERR_DUPLICATE_SERIAL_NUMBER, http_status: 409, applies_to: "POST /api/placement-agreements/{agreementId}/accept" }
  - { priority: 24, category: business_constraint, check: "SiteReadinessReview.site_code is unique within its hospital_account_id", error_id: ERR_DUPLICATE_SITE_CODE, http_status: 409, applies_to: "POST /api/accounts/{accountId}/readiness-reviews" }
  - { priority: 25, category: business_constraint, check: "SurgeonTrainingRecord.surgeon_npi is unique within its hospital_account_id", error_id: ERR_DUPLICATE_SURGEON_NPI, http_status: 409, applies_to: "POST /api/accounts/{accountId}/training-records" }
  - { priority: 26, category: business_constraint, check: "SoftwareReleaseDeployment.software_release_id targets the system's own system_configuration_id", error_id: ERR_RELEASE_CONFIGURATION_MISMATCH, http_status: 409, applies_to: "POST /api/robot-systems/{systemId}/software-deployments" }
  - { priority: 27, category: business_constraint, check: "Every system referenced by a bulk completion belongs to the acting account identity", error_id: ERR_BULK_SCOPE_VIOLATION, http_status: 403, applies_to: "POST /api/procedure-cases/bulk-complete" }

  - { priority: 28, category: business_temporal, check: "Logical clock instant is strictly before acceptance_expires_utc", error_id: ERR_ACCEPTANCE_WINDOW_EXPIRED, http_status: 409, applies_to: "POST /api/placement-agreements/{agreementId}/accept" }
  - { priority: 29, category: business_temporal, check: "issued_utc is not later than the logical clock and expires_utc is strictly later than issued_utc", error_id: ERR_EVIDENCE_WINDOW_INVALID, http_status: 422, applies_to: "POST /api/training-records/{recordId}/credentialing-evidence, POST /api/credentialing-evidence/{evidenceId}/renew" }
  - { priority: 30, category: business_temporal, check: "window end is strictly later than window start on loaner dispatches and software deployments", error_id: ERR_INVALID_WINDOW, http_status: 400, applies_to: "POST /api/loaner-dispatches, POST /api/robot-systems/{systemId}/software-deployments" }
  - { priority: 31, category: business_temporal, check: "software_release.release_index is strictly greater than the system's installed_software_release_index", error_id: ERR_RELEASE_DOWNGRADE, http_status: 409, applies_to: "POST /api/robot-systems/{systemId}/software-deployments" }
  - { priority: 32, category: business_temporal, check: "Credential re-evaluation is only opened when credential_expires_utc has passed or a REVOKED evidence exists", error_id: ERR_RECERTIFICATION_NOT_DUE, http_status: 409, applies_to: "POST /api/training-records/{recordId}/trigger-reevaluation" }
  - { priority: 33, category: business_temporal, check: "ServiceContract.contract_start_utc falls on or after the system's installation instant and the end is strictly later than the start", error_id: ERR_CONTRACT_TEMPORALLY_INVALID, http_status: 422, applies_to: "POST /api/service-contracts, POST /api/placement-agreements/{agreementId}/reinstate" }
  - { priority: 34, category: business_temporal, check: "software deployment window start is not earlier than the deployment creation instant", error_id: ERR_DEPLOYMENT_WINDOW_INVALID, http_status: 422, applies_to: "POST /api/robot-systems/{systemId}/software-deployments" }

  - { priority: 35, category: business_fiscal, check: "Adding a non-terminal agreement keeps the account's non-terminal agreement count at or below placement_cap when placement_cap >= 1", error_id: ERR_PLACEMENT_CAP_EXCEEDED, http_status: 402, applies_to: "POST /api/placement-agreements/{agreementId}/submit" }
  - { priority: 36, category: business_fiscal, check: "Aggregate utilisation against the IDN pool is strictly below MAX_POOL_UTILISATION_UNITS", error_id: ERR_IDN_POOL_SATURATED, http_status: 402, applies_to: "POST /api/utilisation-transfer-transactions, POST /api/utilisation-consumption-ledgers/{ledgerId}/bootstrap-decrement" }
  - { priority: 37, category: business_fiscal, check: "Source account holds enough remaining credit units for the transfer", error_id: ERR_INSUFFICIENT_UTILISATION_CREDIT, http_status: 402, applies_to: "POST /api/utilisation-transfer-transactions" }
  - { priority: 38, category: business_fiscal, check: "Arrangement-specific commercial terms present: PURCHASE needs placement_fee_cents, LEASE needs lease_monthly_amount_cents, USAGE_BASED needs usage_rate_basis_points", error_id: ERR_AGREEMENT_TERMS_INCOMPLETE, http_status: 422, applies_to: "POST /api/placement-agreements/{agreementId}/submit" }
  - { priority: 39, category: business_fiscal, check: "coverage_tier parses into the response-time ladder", error_id: ERR_CONTRACT_TIER_UNRECOGNIZED, http_status: 422, applies_to: "POST /api/service-contracts" }

  - { priority: 40, category: concurrency, check: "When an expected_<parent>_version field is supplied it equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/placement-agreements/{agreementId}/accept, POST /api/expansion-reviews, POST /api/service-contracts" }
  - { priority: 41, category: business_safety, check: "The training record named by a procedure case satisfies training_path_eligibility step 5 (credential_valid, i.e. credentialed with an unexpired evidence grace)", error_id: ERR_SURGEON_NOT_CREDENTIALED, http_status: 409, applies_to: "POST /api/robot-systems/{systemId}/procedure-cases, all procedure-case mutation endpoints" }
  - { priority: 42, category: auth, check: "An entity_backed role's X-User-ID equals the owning foreign key of the resource it acts on", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "POST /api/robot-systems/{systemId}/procedure-cases, POST /api/procedure-cases/{caseId}/reschedule, POST /api/procedure-cases/{caseId}/mark-completed" }

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

