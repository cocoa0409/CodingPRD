  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_rejected
        claim_type: Violation -> Error
        grounds:
          - validations.priority_1_auth
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role check — priority 1 beats every other rule."
        test_recipe:
          setup: ["Clock default. Store PHX exists."]
          setup_api_calls:
            - *clock0
            - *mk_store_phx
          trigger:
            - call: "GET /v1/stores/${s_phx}"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 400 with error ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: rbac_role_denied_on_exclusive_endpoint
        claim_type: Violation -> Error
        grounds:
          - validations.priority_2_auth
          - errors.ERR_UNAUTHORIZED_ROLE
          - roles.Customer
        distinguishing_aspect: "A Customer (valid identity) calling the Appraiser-exclusive POST /v1/appraisals is rejected 403 ERR_UNAUTHORIZED_ROLE before any existence or state check on its payload references."
        test_recipe:
          setup: ["Clock default. Store PHX, customer CUST1, V_A intaken."]
          setup_api_calls:
            - *clock0
            - *mk_store_phx
            - *mk_mgr1
            - call: "POST /v1/customers"
              payload: { full_name: "Customer One", email: "c1@x.com", credit_score: 720, stated_annual_income_cents: 9000000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - *mk_veh_a
          trigger:
            - call: "POST /v1/appraisals"
              payload: { vehicle_id: "${veh_a}", customer_id: "${cust1}", appraiser_id: "${cust1}" }
              as: Customer
              as_user_id: "${cust1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 403 with error ERR_UNAUTHORIZED_ROLE"
            - "GET /v1/vehicles/${veh_a}/appraisals returns an empty array"

      - name: entity_backed_identity_unknown_rejected
        claim_type: Violation -> Error
        grounds:
          - validations.priority_3_auth
          - errors.ERR_UNKNOWN_IDENTITY
        distinguishing_aspect: "An entity-backed role (Customer) whose X-User-ID is a well-formed UUID that matches no CustomerAccount fails 403 ERR_UNKNOWN_IDENTITY — distinct from the role check and from 404 on path resources."
        test_recipe:
          setup: ["Clock default. Store PHX; no customers registered."]
          setup_api_calls:
            - *clock0
            - *mk_store_phx
          trigger:
            - call: "GET /v1/customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Customer
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status 403 with error ERR_UNKNOWN_IDENTITY (identity checked before the path resource)"

      - name: segregation_of_duties_inspector_equals_appraiser
        claim_type: Violation -> Error
        grounds:
          - validations.priority_6_business_safety
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Opening an inspection with inspector_id equal to the sourcing appraisal's appraiser_id fails 409 ERR_SEGREGATION_OF_DUTIES even when that associate holds both APPRAISER and INSPECTOR eligibility by role_kind — the check is on identity equality, not role."
        test_recipe:
          setup: ["Clock default. Store PHX. One associate APX with role_kind APPRAISER appraises V_A; the same associate id is then supplied as inspector_id."]
          setup_api_calls:
            - *clock0
            - *mk_store_phx
            - *mk_mgr1
            - call: "POST /v1/customers"
              payload: { full_name: "Customer One", email: "c1@x.com", credit_score: 720, stated_annual_income_cents: 9000000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Appraiser X", store_id: "${s_phx}", role_kind: "APPRAISER" }
              as: PlatformAdmin
              captures: { apx: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Inspector X", store_id: "${s_phx}", role_kind: "INSPECTOR" }
              as: PlatformAdmin
              captures: { inx: $.data.id }
            - *mk_veh_a
            - call: "POST /v1/appraisals"
              payload: { vehicle_id: "${veh_a}", customer_id: "${cust1}", appraiser_id: "${apx}" }
              as: Appraiser
              as_user_id: "${apx}"
          trigger:
            - call: "POST /v1/vehicles/${veh_a}/inspections"
              payload: { inspector_id: "${apx}" }
              as: ReconditioningInspector
              as_user_id: "${apx}"
              captures: { err_id: $.data.error_id }
            - call: "POST /v1/vehicles/${veh_a}/inspections"
              payload: { inspector_id: "${inx}" }
              as: ReconditioningInspector
              as_user_id: "${inx}"
              captures: { insp_a: $.data.id }
          assert:
            - "inspector == appraiser -> 409 ERR_SEGREGATION_OF_DUTIES"
            - "a different inspector succeeds: ReconditioningInspection.${insp_a}.status == OPEN"
            - "Vehicle.${veh_a}.lifecycle_status == IN_INSPECTION"

