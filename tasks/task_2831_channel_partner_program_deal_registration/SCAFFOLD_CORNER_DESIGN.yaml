            - "DealRegistration.${r_sc_id}.status is still DRAFT with submitted_at == null after the foreign attempt"
            - "the owner's submit succeeds: status == SUBMITTED with submitted_at == 2026-03-01T00:00:00.000Z"

      - name: suspended_partner_is_frozen_out_of_order_pricing
        claim_type: triggerable
        grounds:
          - validations[priority=20]
          - errors[ERR_PARTNER_SUSPENDED]
          - state_machines.PerformanceReview.PREPARED_to_REJECTED
          - calculations.portal_entitlement
        distinguishing_aspect: "A rejected performance review is the producer of tier_status SUSPENDED: after it, pricing a new order returns ERR_PARTNER_SUSPENDED 403 and the portal short-circuits to BASIC without computing demotions."
        test_recipe:
          setup:
            - "Clock 2026-02-01T00:00:00.000Z; one RESELLER partner with marketing_commitment_cents 0, no certifications and no orders."
            - "PROVISIONAL scoring: cert_component 0, revenue_component 0, marketing_component 1.0 -> score 25.0 -> recommended_tier REGISTERED."
            - "One review prepared by u_ops_1 over [2026-01-01T00:00:00.000Z, 2026-01-31T23:59:59.999Z] with findings_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_sus_id: $.data.id }
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p_sus_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev_sus_id: $.data.id }
          trigger:
            - call: "POST /performance-reviews/${rev_sus_id}/decision"
              payload: { decision: "REJECT" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_sus_id}", order_type: "DROP_SHIP", list_amount_cents: 1000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "PerformanceReview.${rev_sus_id}.provisional_score == 25.0 and recommended_tier == REGISTERED"
            - "PerformanceReview.${rev_sus_id}.status == REJECTED with approved_tier == null and decided_by_user_id == u_dir_1"
            - "Partner.${p_sus_id}.tier_status == SUSPENDED with standing_reason == PROGRAM_REVIEW_REJECTED and portal_entitlement_level == BASIC"
            - "Partner.${p_sus_id}.tier is still REGISTERED (a rejection never writes the tier)"
            - "the order call returns error_id == ERR_PARTNER_SUSPENDED with http_status 403 and no OrderInvoice row exists"

      - name: exclusivity_conflict_error_is_reachable_from_a_live_window
        claim_type: triggerable
        grounds:
          - errors[ERR_EXCLUSIVITY_CONFLICT]
