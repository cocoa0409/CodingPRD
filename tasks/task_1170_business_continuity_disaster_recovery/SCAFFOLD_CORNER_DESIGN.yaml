              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/submit"
              payload: {}
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/approve"
              payload: {}
              as: PlanApprover
              as_user_id: "${c2_id}"
            - call: "POST /resilience/comm-nodes"
              payload: { tree_label: "TREE_FanoutProc", contact_name: "Root", role_title: "Duty", parent_node_id: null, order_index: 1, channel: "PHONE", ack_deadline_minutes: 30 }
              as: CrisisOfficer
              as_user_id: "${c1_id}"
              captures: { root_id: $.data.id }
