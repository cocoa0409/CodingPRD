  # ==========================================================================
  # §1.9 SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_stale_restaurant_version_rejects_override_create
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[override-create-stale-restaurant]
          - validations.priority_9_ERR_STALE_RESTAURANT_VERSION
          - errors[ERR_STALE_RESTAURANT_VERSION]
        distinguishing_aspect: "Proposing a forecast override against a version the store has already moved past is ERR_STALE_RESTAURANT_VERSION (412), and the rejected create bumps nothing."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store whose version was read BEFORE an unrelated PATCH advanced it."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner OCC Override Store", store_number: "C-2398-64", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, v0: $.data.version }
            - call: "PATCH /drive-thru/restaurants/${r_id}"
              payload: { labor_minutes_budget: 400 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { v1: $.data.version }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/forecast-overrides"
              payload: { restaurant_id: "${r_id}", source: "WEATHER", effective_start_at: "2026-08-01T11:00:00Z", effective_end_at: "2026-08-01T14:00:00Z", projected_cars_delta_pct: 0.20, expected_restaurant_version: "${v0}" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${v1} == ${v0} + 1 — the PATCH is the write that made the client's token stale"
            - "HTTP 412 and ${err} == ERR_STALE_RESTAURANT_VERSION"
            - "${err} != ERR_OVERRIDE_AGGREGATE_CAP and != ERR_WINDOW_BOUNDS_INVALID — priority 9 runs ahead of both, and the body is otherwise valid"
            - "GET /drive-thru/forecast-overrides?restaurant_id=${r_id} returns total_count 0"
            - "Restaurant.${r_id}.version == ${v1} — a 412 does not advance the version"

      - name: occ_stale_restaurant_version_rejects_report_create
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[report-create-stale-restaurant]
          - validations.priority_9_ERR_STALE_RESTAURANT_VERSION
          - errors[ERR_STALE_RESTAURANT_VERSION]
        distinguishing_aspect: "The second OCC rule guards report creation on the same field, so a report computed from a stale view of the store is 412 even though an empty window would otherwise have been created happily."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store; clock at 11:05:00Z so the target window is entirely in the past; the store's version read BEFORE an unrelated PATCH advanced it."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner OCC Report Store", store_number: "C-2398-65", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, v0: $.data.version }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:05:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "PATCH /drive-thru/restaurants/${r_id}"
              payload: { staffing_basis: "FORECAST_ADJUSTED" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /drive-thru/throughput-reports"
              payload: { restaurant_id: "${r_id}", window_start_at: "2026-08-01T11:00:00Z", window_end_at: "2026-08-01T11:05:00Z", variant: "PROVISIONAL", expected_restaurant_version: "${v0}" }
              as: MarketCoach
              as_user_id: "coach-1"
              captures: { err: $.data.error_id }
          assert:
            - "${v1} == ${v0} + 1"
            - "HTTP 412 and ${err} == ERR_STALE_RESTAURANT_VERSION"
            - "${err} != ERR_REPORT_WINDOW_FUTURE — window_end_at equals the clock, which satisfies the priority-20 check"
            - "${err} != ERR_REPORT_WINDOW_EMPTY — cars_served 0 is legal at CREATE time; only publish rejects it"
            - "GET /drive-thru/throughput-reports?restaurant_id=${r_id} returns total_count 0 and Restaurant.${r_id}.version == ${v1}"

      - name: occ_fresh_version_succeeds_then_the_same_token_is_stale
        claim_type: satisfaction_to_pass
        grounds:
          - concurrency_rules[override-create-stale-restaurant]
          - endpoints[POST /drive-thru/forecast-overrides]
          - entities.Restaurant.fields.version
        distinguishing_aspect: "The successful create is itself a version-advancing write, so replaying the very token that just worked is 412 — proving version increments on every write and is not merely compared once."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store whose version has never advanced; clock at 11:00:00Z."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner OCC Fresh Store", store_number: "C-2398-66", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, v0: $.data.version }
            - call: "POST /drive-thru/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /drive-thru/forecast-overrides"
              payload: { restaurant_id: "${r_id}", source: "LOCAL_EVENT", effective_start_at: "2026-08-01T11:00:00Z", effective_end_at: "2026-08-01T13:00:00Z", projected_cars_delta_pct: 0.15, expected_restaurant_version: "${v0}" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { fo1: $.data.id, fo1_state: $.data.fo_state }
            - call: "GET /drive-thru/restaurants/${r_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { v1: $.data.version, cphe: $.data.cars_per_hour_effective }
            - call: "POST /drive-thru/forecast-overrides"
              payload: { restaurant_id: "${r_id}", source: "LOCAL_EVENT", effective_start_at: "2026-08-01T11:00:00Z", effective_end_at: "2026-08-01T13:00:00Z", projected_cars_delta_pct: 0.15, expected_restaurant_version: "${v0}" }
              as: Operator
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First call: HTTP 201, ${fo1_state} == PROPOSED"
            - "${v1} == ${v0} + 1 — the override create advanced the store version even though no rollup value changed"
            - "${cphe} == 0.0 — a PROPOSED override has no effect on the rollups (and staffing_basis is still OBSERVED)"
            - "Second identical call: HTTP 412 and ${err} == ERR_STALE_RESTAURANT_VERSION"
            - "The replay is refused purely on freshness: two PROPOSED overrides on the same window are legal product behaviour, so re-issuing the body with expected_restaurant_version ${v1} returns 201"
            - "GET /drive-thru/forecast-overrides?restaurant_id=${r_id}&fo_state=PROPOSED returns total_count 1 after the 412"

      - name: rate_threshold_second_open_remake_flips_store_to_accuracy_hold
        claim_type: violation_to_error
        grounds:
          - calculations.restaurant_rollup_recompute.constants.ACCURACY_HOLD_THRESHOLD
          - validations.priority_11_ERR_POSTURE_ACCURACY_HOLD
          - errors[ERR_POSTURE_ACCURACY_HOLD]
          - state_machines.Restaurant.SURGE_to_ACCURACY_HOLD
        distinguishing_aspect: "The threshold is exactly two: at one open remake the store is merely SURGE and merge-award still succeeds, and the second open remake flips it to ACCURACY_HOLD so the next award is ERR_POSTURE_ACCURACY_HOLD."
        test_recipe:
