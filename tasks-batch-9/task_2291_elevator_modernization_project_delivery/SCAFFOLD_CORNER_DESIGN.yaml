  - section: calculations
    instances:
      - name: condition_score_correct_result_and_two_place_precision
        claim_type: correct_result
        grounds:
          - calculations.car_condition_score
          - calculations.car_condition_score.precision
        excluded_because:
          difficulty_instance: dual_variant_calc / condition_score_observed_only_vs_imputed_failed
          rationale: "That instance pins both bases to two decimal places on the same survey (71.07 over the renormalised 0.70 weight total versus 49.75 over the full 1.00) and asserts the tier each score selects."

      - name: code_upgrade_cents_sums_priced_triggers_only
        claim_type: input_set_filtering
        grounds:
          - calculations.code_upgrade_cents
          - calculations.code_trigger_synthesis
          - state_machines.CodeTrigger.REQUIRED_to_PRICED
          - state_machines.CodeTrigger.REQUIRED_to_WAIVED
        distinguishing_aspect: "code_upgrade_cents ranges over PRICED triggers only: a still-REQUIRED trigger contributes nothing (it has no price yet) and a WAIVED trigger contributes nothing (the AHJ excused the work), so the option total is unchanged by the waiver even though the compliance dimension clears."
        test_recipe:
          setup:
            - "A jurisdiction with fire_service_required true, door_protection_required true, seismic_zone 0 and permit_surcharge_pct 0.0000."
            - "One car with a COUNTERSIGNED survey rating controller GOOD, machine GOOD, door FAIR, so final_score is 73.75 and the recommended tier is CONTROLLER_DOOR."
            - "One DRAFT ScopeOption at tier CONTROLLER_DOOR, base_price_cents 6000000, carrying exactly two REQUIRED CodeTriggers in emission order: FIRE_SERVICE_PHASE_I_II then DOOR_PROTECTION_REOPENING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "County of Marlow", code_edition_year: 2022, fire_service_required: true, seismic_zone: 0, door_protection_required: true, inspection_lead_days: 10, permit_surcharge_pct: 0.0000 }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Marlow Center", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "FAIR" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv1: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c1_id}", tier: "CONTROLLER_DOOR", base_price_cents: 6000000, expected_project_version: "${pv1}" }
              as: ProjectManager
              captures: { so1_id: $.data.id }
            - call: "GET /code-triggers?scope_option_id=${so1_id}"
              as: ProjectManager
              captures: { ct_fire_id: "$.data[0].id", ct_door_id: "$.data[1].id" }
          trigger:
            - call: "POST /code-triggers/${ct_fire_id}/price"
              payload: { cost_cents: 500000 }
              as: ProjectManager
            - call: "POST /code-triggers/${ct_door_id}/waive"
              payload: { waiver_reference: "AHJ-WVR-2026-0044" }
              as: AHJInspector
              as_user_id: "${j_id}"
          assert:
            - "The setup produced total_count == 2 triggers, index 0 trigger_type == FIRE_SERVICE_PHASE_I_II and index 1 trigger_type == DOOR_PROTECTION_REOPENING, both status REQUIRED with cost_cents == 0"
            - "Before pricing, ScopeOption.${so1_id}.code_upgrade_cents == 0 and total_price_cents == 6000000"
            - "After pricing the fire trigger, CodeTrigger.${ct_fire_id}.status == PRICED with cost_cents == 500000"
            - "After pricing, ScopeOption.${so1_id}.code_upgrade_cents == 500000 and total_price_cents == 6500000 (escalation_pct 0.0000 with no live orders, volume_discount_pct 0.0000 below the first break)"
            - "After pricing, ElevatorCar.${c1_id}.compliance_status is still TRIGGERS_OPEN because the door trigger is still REQUIRED"
            - "After the waiver, CodeTrigger.${ct_door_id}.status == WAIVED with waiver_reference == AHJ-WVR-2026-0044 and cost_cents == 0"
            - "After the waiver, ScopeOption.${so1_id}.code_upgrade_cents is still 500000 and total_price_cents is still 6500000 - a WAIVED trigger is outside the summation set"
            - "After the waiver, ElevatorCar.${c1_id}.compliance_status == TRIGGERS_CLEARED because zero triggers remain REQUIRED"

      - name: score_preview_applies_the_declared_condition_weights_and_point_scale
        claim_type: constants_applied
        grounds:
          - calculations.car_condition_score.constants
          - endpoints[GET /equipment-surveys/{survey_id}/score-preview]
        distinguishing_aspect: "The preview endpoint exposes the constants directly: 0.45 / 0.30 / 0.25 against the 100 / 80 / 55 / 25 / 0 point scale gives 82.75 for EXCELLENT / GOOD / FAIR, and observed_weight_total is the full 1.00 because nothing was NOT_OBSERVED - so both bases agree."
