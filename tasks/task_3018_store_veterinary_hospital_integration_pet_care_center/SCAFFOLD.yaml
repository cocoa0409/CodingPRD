      - "GET /stores/training-enrollments/{enrollmentId} and GET /stores/{storeId}/training-enrollments"
      - "GET /breed-handling-rules and GET /breed-handling-rules/{ruleId}"
      - "GET /stores/retail-cross-sells/{crossSellId} and GET /stores/{storeId}/retail-cross-sells"
