        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_APPEAL_CODE]"]
        distinguishing_aspect: "Second appeal with the same code (case-insensitive) under the same campaign returns ERR_DUPLICATE_APPEAL_CODE (409)."
