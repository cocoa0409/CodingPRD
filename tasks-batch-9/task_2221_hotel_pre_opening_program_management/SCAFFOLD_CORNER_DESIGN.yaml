          assert:
            - "response status is 200"
            - "data.projected_opening_date_committed == '2026-10-15' (project_finish 2026-10-01 + 14 licensing_buffer_days)"
            - "data.critical_path_milestone_count == 2"
            - "GET /pre-opening/milestones/${ms_a} returns earliest_start_date '2026-09-01', earliest_finish_date '2026-09-21', latest_finish_date '2026-09-21', total_float_days 0, is_critical true"
            - "GET /pre-opening/milestones/${ms_b} returns earliest_start_date '2026-09-01', earliest_finish_date '2026-09-16', latest_finish_date '2026-09-21', total_float_days 5, is_critical false"
            - "GET /pre-opening/milestones/${ms_c} returns earliest_start_date '2026-09-21' (max of the two drivers, so the 20-day branch decides), earliest_finish_date '2026-10-01', total_float_days 0, is_critical true"

      - name: contingency_for_a_single_accepted_pre_opening_block_follows_the_pinned_order
        claim_type: correct_result
        grounds:
          - "§1.3 contingency_liability pins base -> tier -> fee -> subtotal -> penalty; a 5-room, 2-night block at relocation_rate_cents 25000 gives base 250000, which is below TIER_1_LIMIT_CENTS 500000 and therefore takes TIER_1_PCT 0.05."
        distinguishing_aspect: "10 displaced room-nights give a base of 250000, which lands in the lowest admin-fee tier at 0.05 for a fee of 12500 and a contingency of 262500 — the fee is charged on the base, before the guarantee penalty, which is not yet due for an ACCEPTED block."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' baselined by pd-baseline-1 over a single 30-day CONSTRUCTION_COMPLETE milestone, which was started and then completed at clock 2026-10-01: schedule_state CONSTRUCTION_COMPLETE, projected_opening_date_committed 2026-10-15, schedule_slip_days 0, version 2."
            - "Booking opened, so commercial_state is BOOKING_OPEN and version is 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_cc: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-baseline-1"
            - call: "POST /pre-opening/milestones/${ms_cc}/start"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/milestones/${ms_cc}/complete"
              payload: {}
              as: ConstructionManager
              as_user_id: "cm-1"
