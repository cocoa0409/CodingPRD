      - name: restitution_exposure_variant_selection_is_tolerance_driven
        claim_type: variant_selection
        grounds:
          - calculations.restitution_exposure
        distinguishing_aspect: |
          The POPULATION_EXTRAPOLATED versus SAMPLE_ACTUAL fork for a MATERIAL criticism turns on the
          owning scope area's tolerance_breached flag rather than on anything on the criticism itself.
        excluded_because:
          difficulty_instance: restitution_variant_divergence_driven_by_scope_area_tolerance
          rationale: "That difficulty instance already drives two MATERIAL criticisms - one on a breached area and one on an unbreached area - through the same endpoint and compares both restitution_method values and both exposure figures, which is exactly the fork this corner case would test."

      - name: extrapolated_average_is_rounded_before_multiplication
        claim_type: precision
        grounds:
          - calculations.restitution_exposure
        distinguishing_aspect: |
          The per-file average underpayment is rounded to whole cents before it is multiplied by the
          population size, so rounding after multiplication would change the answer.
        excluded_because:
          difficulty_instance: extrapolated_restitution_pins_average_first_rounding_order
          rationale: "That difficulty instance is built on a sample whose underpayment total does not divide evenly by the reviewed count, so the two rounding orders give different products and the assertion pins the declared one."

      - name: cooperation_credit_tier_is_keyed_on_the_order_subtotal
        claim_type: threshold
        grounds:
          - calculations.penalty_determination
        distinguishing_aspect: |
          The cooperation credit steps from 0.05 to 0.15 on the restitution-plus-gross subtotal, not on
          restitution alone and not on the gross penalty alone.
        excluded_because:
          difficulty_instance: consent_order_credit_tier_is_keyed_on_subtotal_not_restitution
          rationale: "That difficulty instance places restitution below the 25000000 threshold while the subtotal crosses it, so a restitution-keyed implementation and a subtotal-keyed implementation produce different credits and the assertion distinguishes them."

      - name: statutory_penalty_cap_is_measured_on_the_gross_penalty
        claim_type: constants_applied
        grounds:
          - validations[priority 70 ERR_PENALTY_CAP_EXCEEDED]
        distinguishing_aspect: |
          The 50000000 statutory ceiling is compared against the gross penalty before the cooperation
          credit is applied, so a net figure under the cap is still refused.
        excluded_because:
          difficulty_instance: referential_priority_60_beats_fiscal_priority_70_on_consent_order_draft
          rationale: "That difficulty instance drafts an order whose gross penalty exceeds the cap while its net penalty does not, and also orders that refusal against the missing-approved-plan refusal on the same call."

      - name: multistate_allocation_remainder_sweep_conserves_every_cent
        claim_type: waterfall_allocation
        grounds:
          - calculations.multistate_restitution_allocation
        distinguishing_aspect: |
          Floor division leaves a remainder that is swept one cent at a time in a declared order, so the
          per-state allocations must sum to the aggregate restitution exactly.
        excluded_because:
          difficulty_instance: allocation_conserves_every_cent_through_the_remainder_sweep
          rationale: "That difficulty instance allocates a restitution figure that is not divisible by the policy-count denominator and asserts both the exact per-state cents and the exact sum, which is the conservation invariant this corner case would restate."

      - name: response_round_accounting_bounds_the_rebuttal_loop
        claim_type: constants_applied
        grounds:
          - calculations.criticism_response_round_accounting
        distinguishing_aspect: |
          response_round and rebuttal_count advance on their own schedules and the third round is the
          last one the carrier may use.
        excluded_because:
          difficulty_instance: criticism_rebuttal_cycle_loops_to_issued_and_terminates_at_round_bound
          rationale: "That difficulty instance walks the full ISSUED-RESPONDED-ISSUED cycle three times, asserts the counter values at every hop, and then shows the fourth rebuttal refused at the declared bound."
