  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_harvest_event
        grounds:
          - validations.priority_7_ERR_INVALID_CONTRACT_STATE
          - validations.priority_22_ERR_EQUIPMENT_CLEANOUT_REQUIRED
        distinguishing_aspect: |
          Pairs a STATE rule (priority 7, 409) against a BUSINESS_SAFETY rule (priority 22, 409) on
          POST /seed-ops/harvest-events. Both are violated by the same request and both would return 409,
          so only the error_id distinguishes them: the contract-state rule must win. The control call on
          a properly advanced contract proves the lower-priority safety rule is really armed.
        test_recipe:
          setup:
            - "Contract A left in DRAFT on field F-A; contract B advanced to INSPECTION_PASSED on field F-B"
            - "Equipment CMB-7 exists but has never been cleanout-certified for any variety"
            - "Logical clock at 2026-09-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
