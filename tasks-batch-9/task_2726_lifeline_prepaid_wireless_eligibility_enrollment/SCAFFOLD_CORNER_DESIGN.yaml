            - "${issued1_id} == ${dev1_id}, ${issued2_id} == ${dev2_id} and ${issued3_id} == ${dev3_id}, each returned with status ISSUED (${issued1_status} == ${issued2_status} == ${issued3_status} == ISSUED)"
            - "${score1} == 10 and ${count1} == 1"
            - "${score2} == 20 and ${count2} == 2"
            - "${score3} == 20 and ${count3} == 3"
            - "${addr2_status} == DUPLICATE_FLAGGED"
            - "HouseholdAddress.${addr1_id}.status == DUPLICATE_FLAGGED"
            - "${usage4} == PENDING_FIRST_USE and ${transfers4} == 0"
            - "${score4} == 60"
            - "Device.${dev1_id}.status == RETIRED and Device.${dev1_id}.return_condition == DAMAGED"
            - "Device.${dev2_id}.status == RETIRED and Device.${dev2_id}.return_condition == DAMAGED"
            - "Device.${dev3_id}.status == ISSUED"
            - "Provider.${prov_id}.devices_retired_count == 2"
            - "Provider.${prov_id}.devices_issued_count == 1"
            - "Provider.${prov_id}.devices_in_stock_count == 0"
            - "Provider.${prov_id}.devices_total_count == 3"
            - "Enrollment.${enr_id}.device_status == DEVICE_ISSUED"

      - name: claim_variant_divergence_covered_by_difficulty_rule_1
        claim_type: variant_divergence
        grounds:
          - calculations.claim_support_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_provisional_vs_final_support_diverges_on_reimbursement_claim
          rationale: "The variant_divergence row asks for the same data run through both variants with the delta verified; the named §1.8 instance does exactly that on one claim and asserts provisional, final and variance_cents."

      - name: recert_income_variant_selection_covered_by_difficulty_rule_1
        claim_type: variant_selection
        grounds:
          - calculations.eligibility_income_evaluation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / recert_income_annualized_vs_three_month_averaged_on_subscriber
          rationale: "The variant_selection row asks that the right variant fire in the right context; the named §1.8 instance proves STRICT_ANNUALIZED is used at screening and the three-month average at recertification, on one subscriber whose verdict flips between them."

      - name: provider_ledger_records_the_final_variant_not_the_provisional_snapshot
        claim_type: reconciliation
        grounds:
          - calculations.claim_support_amount.variants
          - calculations.provider_ledger_reconciliation
          - entities.ReimbursementClaim.fields.variance_cents
        distinguishing_aspect: |
          The reconciliation step is isolated from the divergence itself: the DRAFT is taken
          mid-month at 463 and the ledger stays at zero, then filing after month close
          writes final 925 and variance 462 - and the provider ledger picks up 925, NOT the
          463 snapshot and NOT the 462 delta. The claim keeps both figures side by side so
          the delta remains auditable after the switch.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50 and one non-tribal VOICE enrollment starting 2026-06-01."
            - "Clock moved to 2026-06-15T00:00:00Z, where the DRAFT is taken: support_days = 2026-06-01..2026-06-15 = 15, so round_half_up(925*15/30) = 463."
            - "Clock then moved to 2026-07-02T00:00:00Z so the month is closed and the full 30 days are payable."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143139", study_area_code: "489139", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-P12" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { prov_ver: $.data.version }
          trigger:
            - call: "POST /lifeline/reimbursement-claims"
              payload: { provider_id: "${prov_id}", service_month: "2026-06", expected_provider_version: "${prov_ver}" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { claim_id: $.data.id, prov_amt: $.data.provisional_amount_cents, prov_covered: $.data.covered_enrollment_count, prov_variance: $.data.variance_cents }
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { gross_mid: $.data.claim_gross_cents, net_mid: $.data.net_reimbursed_cents }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/reimbursement-claims/${claim_id}/file"
              payload: { certifying_officer_ref: "OFFICER-16" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { final_amt: $.data.final_amount_cents, variance: $.data.variance_cents, final_covered: $.data.covered_enrollment_count }
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { gross_after: $.data.claim_gross_cents, net_after: $.data.net_reimbursed_cents, recouped_after: $.data.recouped_cents }
          assert:
            - "${prov_amt} == 463 and ${prov_covered} == 1 and ${prov_variance} == 0"
            - "${gross_mid} == 0 and ${net_mid} == 0"
            - "${final_amt} == 925"
            - "${variance} == 462"
            - "${final_covered} == 1"
            - "${gross_after} == 925"
            - "${net_after} == 925"
            - "${recouped_after} == 0"
