      - name: menu_posture_freezes_at_exactly_one_half_and_the_freeze_blocks_new_proposals
        claim_type: Constants Applied
        grounds:
          - calculations.menu_posture
          - endpoints.POST_/governance/asset-class-slots/{slotId}/retire
          - errors.ERR_MENU_FROZEN
        distinguishing_aspect: "The ratio ladder is evaluated over a denominator that only counts slots in {ACTIVE, AT_RISK, PENDING_REPLACEMENT}, so retiring a perfectly healthy slot makes the plan WORSE: 2 of 5 == 0.4000 (RESTRICTED) becomes 2 of 4 == 0.5000 (FROZEN) without any fund changing state. 0.5000 is the inclusive FROZEN rung, and FROZEN — unlike RESTRICTED — blocks a new proposal on an untroubled slot too, which is the difference between the >= 0.5000 rung and the >= 0.2500 rung."
        test_recipe:
          setup:
            - "chain_breach replayed; the trigger head finalizes quarter 0, leaving SMLVX and INTDX impaired, their two slots AT_RISK, three slots ACTIVE, ratio 0.4000 and posture RESTRICTED."
            - "The TIPS slot holds a CLEAR fund and carries no proposal, so it is retirable; retiring it drops the denominator to 4 while the numerator stays 2."
          setup_api_calls: *chain_breach
          trigger:
            - *b_finalize_q0
            - call: "POST /governance/asset-class-slots/${slot_tips_id}/retire"
              payload: { reason: "TIPS sleeve consolidated into the core bond mandate at the committee's direction." }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { plan_v_frozen: $.data.version }
            - call: "POST /governance/fund-replacements"
              payload: { plan_id: "${plan_id}", slot_id: "${slot_lc_id}", outgoing_fund_id: "${fund_lc_a_id}", incoming_fund_id: "${fund_lc_b_id}", mapping_strategy: "DIRECT_MAP", rationale: "Challenger share class is eight basis points cheaper with an equivalent mandate and a longer record.", expected_plan_version: "${plan_v_frozen}" }
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "the retire returned 200 with AssetClassSlot.${slot_tips_id}.status == RETIRED and current_fund_id still ${fund_tips_id} (retained for audit)"
            - "Fund.${fund_tips_id}.menu_status == PENDING_REMOVAL and watch_status still CLEAR"
            - "Plan.${plan_id}.at_risk_slot_ratio == 0.5000 and menu_posture == FROZEN — the retired slot leaves the denominator entirely"
            - "Plan.${plan_id}.occupied_menu_slots == 4 and available_menu_slots == 2"
            - "the fund-replacement create returned 409 with data.error_id == ERR_MENU_FROZEN and no proposal row was written"
            - "Plan.${plan_id}.version == ${plan_v_frozen} — a rejected create never bumps the OCC version"
            - "FundReplacementProposal.${prop_small_id}.status is still BLOCKED with pre_block_status DRAFT"

      - name: per_capita_and_pro_rata_split_the_same_accrual_pool_into_different_totals
        claim_type: Variant Divergence
        grounds:
          - calculations.levelized_fee_allocation
          - endpoints.POST_/governance/fee-levelization-runs
          - entities.FeeLevelizationRun.remainder_cents
        distinguishing_aspect: "Both methods start from the identical PASS 1 accrual floor — LCGRA floor(800000000 * 10 / 10000) = 800000 and BNDIX floor(400000000 * 5 / 10000) = 200000, capped by credit_pool_cents at eligible_pool 1000000 — and then diverge: PER_CAPITA floors to 833 cents per account over 1200 accounts and can only place 999600, deliberately stranding 400 cents as remainder, while PRO_RATA distributes every cent, its floors leaving one cent that the waterfall hands to the largest-asset fund LCGRA (666667, not 666666). remainder_cents is 400 for one method and exactly 0 for the other on the same pool."
        test_recipe:
          setup:
            - "chain_l3: Plan.participant_account_count 1200, Plan.total_plan_assets_cents 1200000000 (LCGRA 800000000, BNDIX 400000000), both revenue-sharing funds seated and ACCRUING with revenue_share_bps 10 and 5."
            - "FeeLevelizationRun.quarter_index is unique per plan among non-VOID runs, so the two runs must sit in different quarters: the PER_CAPITA run is drafted in quarter 0, the plan is advanced, and the PRO_RATA run is drafted in quarter 1 over the identical pool and credit_pool_cents 1000000. Fund assets and revenue_share_bps are untouched by advance-quarter, so PASS 1 produces the same accruals in both quarters and the divergence is attributable to method alone. Both runs stay DRAFT (a DRAFT run only one quarter old survives advance-quarter) because approval is a separate, motion-gated step."
            - "PER_CAPITA expectation: per_account_cents floor(1000000/1200) = 833; allocated_total 833*1200 = 999600; remainder 1000000 - 999600 = 400; lines floor(999600*800000/1000000) = 799680 and floor(999600*200000/1000000) = 199920, which sum to exactly 999600 so no shortfall is added."
            - "PRO_RATA expectation: raw 1000000*800000000/1200000000 = 666666.67 -> 666666 and 1000000*400000000/1200000000 = 333333.33 -> 333333; leftover 1 goes to LCGRA first (plan_assets_cents DESC) giving 666667 and 333333; allocated_total 1000000 and remainder 0."
          setup_api_calls: *chain_l3
          trigger:
            - call: "POST /governance/fee-levelization-runs"
              payload: { plan_id: "${plan_id}", quarter_index: 0, method: "PER_CAPITA", credit_pool_cents: 1000000, pool_fund_ids: ["${fund_lc_a_id}", "${fund_bond_a_id}"] }
              as: Recordkeeper
              as_user_id: "rk-1"
              captures: { run_pc_id: $.data.id }
            - call: "POST /governance/plans/${plan_id}/advance-quarter"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/fee-levelization-runs"
              payload: { plan_id: "${plan_id}", quarter_index: 1, method: "PRO_RATA", credit_pool_cents: 1000000, pool_fund_ids: ["${fund_lc_a_id}", "${fund_bond_a_id}"] }
              as: Recordkeeper
              as_user_id: "rk-1"
              captures: { run_pr_id: $.data.id }
          assert:
            - "both creates returned 201 with status == DRAFT, approving_motion_id null and posted_at null; the quarter-0 run is still DRAFT after the advance (one quarter old is not older than one quarter)"
            - "FeeLevelizationRun.${run_pc_id}.per_account_cents == 833, allocated_total_cents == 999600 and remainder_cents == 400"
            - "FeeLevelizationRun.${run_pc_id}.allocation_lines has two entries, ${fund_lc_a_id} with basis_cents 800000 and allocated 799680, then ${fund_bond_a_id} with basis_cents 200000 and allocated 199920, ordered by plan_assets_cents DESC"
            - "FeeLevelizationRun.${run_pr_id}.per_account_cents is null and remainder_cents == 0"
            - "FeeLevelizationRun.${run_pr_id}.allocation_lines gives ${fund_lc_a_id} 666667 and ${fund_bond_a_id} 333333 — the waterfall cent lands on the largest-asset fund, never on the smaller one and never dropped"
            - "FeeLevelizationRun.${run_pr_id}.allocated_total_cents == 1000000, which is 400 cents more than the PER_CAPITA run placed from the identical pool"
            - "for each run allocated_total_cents + remainder_cents == 1000000 (PASS 3 invariant)"
            - "no Fund.levelized_credit_cents and no Plan.revenue_credit_allocated_cents changed — DRAFT computation touches no ledger"

      - name: the_credit_pool_is_capped_by_the_summed_accruals_and_never_by_the_request
        claim_type: Input Set Filtering
        grounds:
          - calculations.levelized_fee_allocation
          - entities.FeeLevelizationRun.credit_pool_cents
          - entities.Plan.participant_account_count
        distinguishing_aspect: "eligible_pool_cents = min(credit_pool_cents, sum of PASS 1 accruals) is a silent cap, not an error: asking to levelize 2000000 cents against 1000000 cents of accrued revenue sharing must produce exactly the same allocation as asking for 1000000, while asking for 500000 must produce a strictly smaller one. This also pins the divisor question — per_account_cents is floor(eligible_pool / N) == 833, not floor(credit_pool / N) == 1666 — and shows the PER_CAPITA remainder growing with N: 400 cents when 833*1200 is placed, 800 cents when 416*1200 is."
        test_recipe:
          setup:
            - "chain_l3: accruals are LCGRA 800000 and BNDIX 200000, summing to 1000000; Plan.participant_account_count is 1200."
            - "Run one asks for 2000000 (over-cap) in quarter 0; run two asks for 500000 (under-cap) in quarter 1 after an advance, because quarter_index is unique per plan among non-VOID runs."
            - "Over-cap expectation: eligible 1000000 -> per_account 833, allocated 999600, remainder 400, lines 799680 and 199920."
            - "Under-cap expectation: eligible 500000 -> per_account floor(500000/1200) = 416, allocated 499200, remainder 800, lines floor(499200*800000/1000000) = 399360 and floor(499200*200000/1000000) = 99840."
            - "NOTE — the §1.1 field descriptions define per_account_cents as floor(credit_pool_cents / N) and remainder_cents as credit_pool_cents - allocated_total_cents, which would give 1666 and 1000400 on run one; calculations.levelized_fee_allocation is authoritative and the assertions follow the eligible-pool reading."
          setup_api_calls: *chain_l3
          trigger:
            - call: "POST /governance/fee-levelization-runs"
              payload: { plan_id: "${plan_id}", quarter_index: 0, method: "PER_CAPITA", credit_pool_cents: 2000000, pool_fund_ids: ["${fund_lc_a_id}", "${fund_bond_a_id}"] }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { run_over_id: $.data.id }
            - call: "POST /governance/plans/${plan_id}/advance-quarter"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/fee-levelization-runs"
              payload: { plan_id: "${plan_id}", quarter_index: 1, method: "PER_CAPITA", credit_pool_cents: 500000, pool_fund_ids: ["${fund_lc_a_id}", "${fund_bond_a_id}"] }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { run_under_id: $.data.id }
          assert:
            - "both creates returned 201 and neither is an error — an over-large pool is capped, never rejected"
            - "FeeLevelizationRun.${run_over_id}.per_account_cents == 833, allocated_total_cents == 999600 and remainder_cents == 400 — identical to a request for exactly 1000000"
            - "FeeLevelizationRun.${run_over_id}.allocation_lines are ${fund_lc_a_id} 799680 and ${fund_bond_a_id} 199920, summing to allocated_total_cents"
            - "FeeLevelizationRun.${run_under_id}.per_account_cents == 416, allocated_total_cents == 499200 and remainder_cents == 800"
            - "FeeLevelizationRun.${run_under_id}.allocation_lines are ${fund_lc_a_id} 399360 and ${fund_bond_a_id} 99840"
            - "each fund line is proportional to its own PASS 1 accrual, so the 4:1 asset ratio survives both caps"
            - "Plan.${plan_id}.revenue_credit_balance_cents is still 0 — nothing is debited before a post"

      - name: glidepath_fit_prices_the_same_three_inputs_four_different_ways
        claim_type: Variant Divergence
        grounds:
          - calculations.glidepath_fit_score
          - endpoints.POST_/governance/funds
          - endpoints.PATCH_/governance/funds/{fundId}
        distinguishing_aspect: "glidepath_type picks the reference pair and construction picks the cost allowance, so one physical suite — 50.0% equity at 65, a landing age of 80 and 45 bps — scores 100.00, 92.50, 47.50 or 40.00 depending only on how it is labelled. The custom-versus-off-the-shelf question is worth exactly 7.50 points here (15 bps over the 30 bps allowance at 0.5 per bp) and the glidepath-shape question is worth 52.50. A fifth suite drives the raw score to -97.50 to prove the max(0.00, ...) floor is applied after rounding, and a PATCH of net_expense_ratio_bps must re-derive the score in place."
        test_recipe:
          setup:
            - "chain_l3 already registered TDTHR: CUSTOM, THROUGH_RETIREMENT, equity_at_65_pct 50.00, landing_point_age 80, net 45 bps -> equity_gap 0, landing_gap 0, cost_penalty max(0, 45-45)*0.5 = 0.00 -> exactly 100.00."
            - "TDOTS is the identical suite labelled OFF_THE_SHELF: cost_penalty (45-30)*0.5 = 7.50 -> 92.50."
            - "TDTOR is the identical suite labelled TO_RETIREMENT and CUSTOM: equity_gap abs(50.0-35.0) = 15 -> 22.50, landing_gap abs(80-65) = 15 -> 30.00, no cost penalty -> 47.50."
            - "TDOTR is TO_RETIREMENT and OFF_THE_SHELF: 100.00 - 22.50 - 30.00 - 7.50 = 40.00."
            - "TDFLR is the floor probe: OFF_THE_SHELF, TO_RETIREMENT, equity 0.00, landing 95, net 200 -> 100.00 - 52.50 - 60.00 - 85.00 = -97.50 -> 0.00."
            - "Finally TDOTS is PATCHed to 30 bps, exactly its allowance, so its penalty becomes 0.00 and its score must climb to 100.00."
          setup_api_calls: *chain_l3
          trigger:
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDOTS", fund_name: "Offshelf Through 2065 Suite", asset_class_code: "TARGET_DATE", share_class_code: "R6", gross_expense_ratio_bps: 45, net_expense_ratio_bps: 45, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 40, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9000, plan_assets_cents: 0, is_target_date_suite: true, glidepath_type: "THROUGH_RETIREMENT", construction: "OFF_THE_SHELF", equity_at_65_pct: 50.00, landing_point_age: 80 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_td_ots_id: $.data.id, td_ots_fit: $.data.glidepath_fit_score }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDTOR", fund_name: "Ridgeline Custom To 2065 Suite", asset_class_code: "TARGET_DATE", share_class_code: "R6", gross_expense_ratio_bps: 45, net_expense_ratio_bps: 45, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 40, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9000, plan_assets_cents: 0, is_target_date_suite: true, glidepath_type: "TO_RETIREMENT", construction: "CUSTOM", equity_at_65_pct: 50.00, landing_point_age: 80 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_td_tor_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDOTR", fund_name: "Offshelf To 2065 Suite", asset_class_code: "TARGET_DATE", share_class_code: "R6", gross_expense_ratio_bps: 45, net_expense_ratio_bps: 45, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 40, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9000, plan_assets_cents: 0, is_target_date_suite: true, glidepath_type: "TO_RETIREMENT", construction: "OFF_THE_SHELF", equity_at_65_pct: 50.00, landing_point_age: 80 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { fund_td_otr_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDFLR", fund_name: "Legacy Static Retirement Suite", asset_class_code: "TARGET_DATE", share_class_code: "A", gross_expense_ratio_bps: 200, net_expense_ratio_bps: 200, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 40, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9000, plan_assets_cents: 0, is_target_date_suite: true, glidepath_type: "TO_RETIREMENT", construction: "OFF_THE_SHELF", equity_at_65_pct: 0.00, landing_point_age: 95 }
              as: InvestmentConsultant
