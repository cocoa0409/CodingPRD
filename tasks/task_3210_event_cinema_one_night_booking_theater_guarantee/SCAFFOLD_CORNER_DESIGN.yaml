# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3210_event_cinema_one_night_booking_theater_guarantee
#
# Breadth probe. Every claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: distributor_create_returns_declared_fields_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Distributor
          - endpoints.POST_/distributors
          - entities.Distributor.fields.status
        distinguishing_aspect: "A distributor created with four client fields comes back 201 with status ACTIVE, a system-minted id and version 1, and bookable_title_count computed to 0 — status and version are never client-supplied."
        test_recipe:
          setup:
            - &k_clock
              call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /event-cinema/distributors"
              payload: { distributor_name: "Halcyon Concert Films", contact_email: "booking@halcyon.example", settlement_currency: "USD", guarantee_floor_cents: 250000, ticket_price_default_cents: 1250 }
              as: PlatformOps
              captures: { d_id: $.data.id, d_status: $.data.status, d_version: $.data.version, d_count: $.data.bookable_title_count, d_created: $.data.created_at }
          assert:
            - "the response status is 201 and response_type is object"
            - "Distributor.${d_id}.distributor_name == \"Halcyon Concert Films\" and ticket_price_default_cents == 1250"
            - "the status is system-set — ${d_status} == ACTIVE"
            - "the version starts at one — ${d_version} == 1"
            - "the derived counter starts empty — ${d_count} == 0"
            - "created_at is server-stamped and non-null — ${d_created} is an ISO 8601 instant"

      - name: circuit_create_returns_pending_status_and_zero_balance
        claim_type: Defaults
        grounds:
          - entities.Circuit.fields.status
          - entities.Circuit.fields.committed_screens_balance
          - entities.Circuit.fields.on_sale_lead_days_min
          - endpoints.POST_/circuits
        distinguishing_aspect: "Omitting on_sale_lead_days_min applies the declared default 21, and the circuit arrives in PENDING with committed_screens_balance 0 — a freshly registered circuit cannot yet commit screens."
        test_recipe:
          setup:
            - *k_clock
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Northgate Screen Partners", circuit_code: "NGSP", credit_rating: "C", settlement_terms: "FOUR_WALL", screen_pool_total: 120 }
              as: PlatformOps
              captures: { c_id: $.data.id, c_status: $.data.status, c_bal: $.data.committed_screens_balance, c_lead: $.data.on_sale_lead_days_min }
          assert:
            - "a new circuit is not yet able to commit — Circuit.${c_id}.status == PENDING"
            - "the omitted lead time falls back to the declared default 21 — ${c_lead} == 21"
            - "the committed-screen balance starts at zero — ${c_bal} == 0"
            - "the credit rating and settlement terms round-trip unchanged — FOUR_WALL and C"

      - name: theater_get_with_an_unknown_id_returns_theater_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/theaters/{id}
          - errors[ERR_THEATER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on the theater path yields the entity-specific 404 ERR_THEATER_NOT_FOUND, not a generic not-found and not a 400."
        test_recipe:
          setup:
            - *k_clock
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /event-cinema/theaters/3f1a7c22-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformOps
              captures: { nf_err: "$.data.error_id" }
          assert:
            - "the response status is 404"
            - "the error is entity-specific — ${nf_err} == ERR_THEATER_NOT_FOUND"
            - "the body carries response_type error and a non-empty message"

      - name: theaters_list_filters_by_circuit_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/theaters
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - entities.Theater.fields.circuit_id
        distinguishing_aspect: "With three venues on one circuit and one on another, ?circuit_id= returns only the three, total_count counts the filtered set rather than the page, and has_more flips false on the second page."
        test_recipe:
          setup:
            - &k_dist
              call: "POST /event-cinema/distributors"
              payload: { distributor_name: "Vermilion Stage Rights", contact_email: "rights@vermilion.example", settlement_currency: "USD", guarantee_floor_cents: 1000000, ticket_price_default_cents: 1500 }
              as: PlatformOps
              captures: { dist_id: $.data.id }
            - &k_circ_b
              call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Cedar Point Screens", circuit_code: "CEDR", credit_rating: "B", settlement_terms: "NET_30", screen_pool_total: 2000, on_sale_lead_days_min: 21 }
              as: PlatformOps
              captures: { circ_id: $.data.id }
            - &k_circ_other
              call: "POST /event-cinema/circuits"
              payload: { circuit_name: "Alto Vista Theatres", circuit_code: "ALTV", credit_rating: "C", settlement_terms: "NET_60", screen_pool_total: 90, on_sale_lead_days_min: 14 }
              as: PlatformOps
              captures: { circ2_id: $.data.id }
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_circ_other
            - &k_th_ca
              call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Cedar Point Sacramento", city: "Sacramento", state_code: "CA", timezone: "America/Los_Angeles", seats_total: 200, screen_count: 4 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { t1: $.data.id, th_id: $.data.id }
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Cedar Point Reno", city: "Reno", state_code: "NV", timezone: "America/Los_Angeles", seats_total: 150, screen_count: 3 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { t2: $.data.id }
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ_id}", theater_name: "Cedar Point Boise", city: "Boise", state_code: "ID", timezone: "America/Boise", seats_total: 120, screen_count: 2 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { t3: $.data.id }
            - call: "POST /event-cinema/theaters"
              payload: { circuit_id: "${circ2_id}", theater_name: "Alto Vista Tucson", city: "Tucson", state_code: "AZ", timezone: "America/Phoenix", seats_total: 90, screen_count: 2 }
              as: Exhibitor
              as_user_id: "${circ2_id}"
              captures: { t4: $.data.id }
          trigger:
            - call: "GET /event-cinema/theaters?circuit_id=${circ_id}&limit=2&offset=0"
              payload: {}
              as: PlatformOps
              captures: { first_id: "$.data[0].id" }
            - call: "GET /event-cinema/theaters?circuit_id=${circ_id}&limit=2&offset=2"
              payload: {}
              as: PlatformOps
              captures: { second_id: "$.data[0].id" }
          assert:
            - "the circuit filter is honored — the first page returns 2 of the 3 possibilities and the second page returns exactly 1"
            - "total_count counts the filtered set, not the page — total_count == 3 on both pages"
            - "has_more is true on page one and false on page two"
            - "the cross-circuit venue never appears — the filtered listing never contains ${t4}"
            - "an unfiltered listing with no query parameters returns all 4 venues with limit defaulting to 10 and offset to 0"

      - name: title_create_computes_bookable_window_days
        claim_type: Computed Fields
        grounds:
          - entities.Title.fields.bookable_window_days
          - entities.Title.fields.status
          - endpoints.POST_/titles
        distinguishing_aspect: "bookable_window_days is server-computed from the rights window: 2026-09-01 to 2027-03-01 is exactly 181 whole days, and the field ignores any client attempt to supply it."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
          setup_api_calls:
            - *k_clock
            - *k_dist
          trigger:
            - call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Winter Light Sessions", content_type: "CONCERT", is_live: false, duration_minutes: 105, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2027-03-01T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 200, ticket_price_cents: 1400 }
              as: ProgrammingManager
              captures: { title_id: $.data.id, window_days: $.data.bookable_window_days, tstatus: $.data.status }
          assert:
            - "the window is computed, not supplied — Title.${title_id}.bookable_window_days == 181"
            - "a new title starts unlisted — ${tstatus} == DRAFT"
            - "the rights window round-trips exactly — rights_start_utc 2026-09-01T00:00:00Z and rights_end_utc 2027-03-01T00:00:00Z"
            - "territory_state_codes round-trips as the one-element array [\"CA\"]"

      - name: title_publish_updates_distributor_bookable_count
        claim_type: Computed Fields
        grounds:
          - entities.Distributor.fields.bookable_title_count
          - state_machines.Title.DRAFT_to_BOOKABLE
          - endpoints.POST_/titles/{id}/publish
        distinguishing_aspect: "Publishing a title is a ledger sync across entities: Distributor.bookable_title_count moves 0 -> 1 on publish and back to 0 on unpublish, recomputed rather than incremented."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
            - &k_title_a
              call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Midnight Broadcast: Encore Anniversary", content_type: "ANNIVERSARY", is_live: false, duration_minutes: 120, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2027-06-01T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 120, ticket_price_cents: 1500 }
              as: ProgrammingManager
              captures: { title_id: $.data.id }
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_title_a
          trigger:
            - call: "GET /event-cinema/distributors/${dist_id}"
              payload: {}
              as: PlatformOps
              captures: { count_before: $.data.bookable_title_count }
            - call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
              captures: { t_status: $.data.status }
            - call: "GET /event-cinema/distributors/${dist_id}"
              payload: {}
              as: PlatformOps
              captures: { count_after: $.data.bookable_title_count }
            - call: "POST /event-cinema/titles/${title_id}/unpublish"
              payload: {}
              as: ProgrammingManager
            - call: "GET /event-cinema/distributors/${dist_id}"
              payload: {}
              as: PlatformOps
              captures: { count_final: $.data.bookable_title_count }
          assert:
            - "the count is zero while the title is a draft — ${count_before} == 0"
            - "publishing moves the title — ${t_status} == BOOKABLE"
            - "the distributor's bookable count rises to one — ${count_after} == 1"
            - "unpublishing returns the count to zero rather than decrementing below it — ${count_final} == 0"

      - name: booking_create_stamps_negotiating_user_from_header
        claim_type: System Fields
        grounds:
          - entities.Booking.fields.negotiating_user_id
          - endpoints.POST_/bookings
          - roles[Exhibitor]
        distinguishing_aspect: "negotiating_user_id is stamped from the X-User-ID header of the acting exhibitor and is never read from the body — a client cannot nominate someone else as the negotiating principal."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - &k_acc_b
              call: "POST /event-cinema/circuits/${circ_id}/accredit"
              payload: {}
              as: PlatformOps
            - *k_title_a
            - &k_pub_a
              call: "POST /event-cinema/titles/${title_id}/publish"
              payload: {}
              as: ProgrammingManager
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_title_a
            - *k_pub_a
          trigger:
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 2, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }, { index: 2, date_utc: "2026-12-02T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, stamped: $.data.negotiating_user_id, b_status: $.data.status, plan: $.data.showtime_count }
          assert:
            - "the booking opens in DRAFT — ${b_status} == DRAFT"
            - "the negotiating principal is the acting exhibitor taken from the header — ${stamped} == ${circ_id}"
            - "the two-showtime plan is accepted as declared — ${plan} == 2"
            - "no commercial field is silently rewritten — guarantee_cents == 1000000 and revenue_share_pct == 0.40"

      - name: duplicate_circuit_code_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=25]
          - errors[ERR_DUPLICATE_CIRCUIT_CODE]
          - entities.Circuit.fields.circuit_code
        distinguishing_aspect: "circuit_code is unique across all circuits: a second registration reusing CEDR is rejected with 409 ERR_DUPLICATE_CIRCUIT_CODE even though every other field differs."
        test_recipe:
          setup:
            - *k_clock
            - *k_circ_b
          setup_api_calls:
            - *k_clock
            - *k_circ_b
          trigger:
            - call: "POST /event-cinema/circuits"
              payload: { circuit_name: "A Completely Different Chain", circuit_code: "CEDR", credit_rating: "A", settlement_terms: "NET_60", screen_pool_total: 500 }
              as: PlatformOps
              captures: { dup_err: "$.data.error_id" }
          assert:
            - "the duplicate is refused with 409"
            - "the error names the uniqueness rule — ${dup_err} == ERR_DUPLICATE_CIRCUIT_CODE"
            - "no second circuit was created — GET /event-cinema/circuits still returns exactly 1 row"

      - name: title_content_type_enum_rejects_an_unknown_value
        claim_type: Type Constraints
        grounds:
          - entities.Title.fields.content_type
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/titles
        distinguishing_aspect: "content_type is a closed enum: PODCAST is not a member, so the create is refused with 400 ERR_INVALID_REQUEST rather than being coerced to SPECIAL."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
          setup_api_calls:
            - *k_clock
            - *k_dist
          trigger:
            - call: "POST /event-cinema/titles"
              payload: { distributor_id: "${dist_id}", title_name: "Interview Hour", content_type: "PODCAST", is_live: false, duration_minutes: 60, rights_start_utc: "2026-09-01T00:00:00Z", rights_end_utc: "2027-03-01T00:00:00Z", territory_state_codes: ["CA"], max_screen_commitment: 50, ticket_price_cents: 1200 }
              as: ProgrammingManager
              captures: { enum_err: "$.data.error_id" }
          assert:
            - "the create is refused with 400"
            - "the error is the request-shape one — ${enum_err} == ERR_INVALID_REQUEST"
            - "no title was created — GET /event-cinema/titles?distributor_id=${dist_id} returns 0 rows"
  # ===========================================================================
  - section: state_machines
    instances:

      - name: booking_new_booking_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.Booking.initial_state
          - entities.Booking.fields.status
        distinguishing_aspect: "A newly created booking occupies the declared initial_state DRAFT and cannot be advanced by any client-supplied status field."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_title_a
            - &k_booking_draft
              call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_v1: $.data.version }
            - &k_line_60
              call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 60, expected_attendance: 100, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { line_id: $.data.id, b_v2: $.data.version }
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_title_a
            - *k_pub_a
          trigger:
            - call: "POST /event-cinema/bookings"
              payload: { title_id: "${title_id}", circuit_id: "${circ_id}", showtime_count: 1, showtime_plan: [{ index: 1, date_utc: "2026-12-01T00:00:00Z", start_minute_utc: 1140, auditorium: "AUD-1" }], on_sale_at: "2026-10-01T00:00:00Z", guarantee_cents: 1000000, revenue_share_pct: 0.40, min_screens: 1, pre_sale_threshold: 0 }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_id: $.data.id, b_status: $.data.status }
          assert:
            - "the booking opens in the declared initial state — ${b_status} == DRAFT"
            - "Booking.${b_id}.version == 1"
            - "no line exists yet — GET /event-cinema/bookings/${b_id}/lines returns 0 rows"

      - name: screening_report_from_terminal_state_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Screening.terminal_states
          - validations[priority=7]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "SCREENED is a terminal screening state, so a second report against the same screening is refused with ERR_ALREADY_TERMINAL rather than silently overwriting the headcount."
        test_recipe:
          setup:
            - "Standard CA fixture, booking driven to ON_SALE with one 120-minute screening 19:00-21:00Z on 2026-12-01; clock at 2026-12-01T21:30:00Z."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T21:30:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /event-cinema/screenings/${scr_id}/report"
              payload: { reported_attendance: 175, reported_outcome: "SCREENED" }
              as: Theater
              as_user_id: "${th_id}"
              captures: { first_state: $.data.state, first_att: $.data.reported_attendance }
            - call: "POST /event-cinema/screenings/${scr_id}/report"
              payload: { reported_attendance: 40, reported_outcome: "SCREENED" }
              as: Theater
              as_user_id: "${th_id}"
              captures: { second_err: "$.data.error_id" }
          assert:
            - "the first report lands the screening in a terminal state — ${first_state} == SCREENED with ${first_att} == 175"
            - "the second report is refused with 409 — ${second_err} == ERR_ALREADY_TERMINAL"
            - "the original headcount is not overwritten — GET /event-cinema/screenings/${scr_id} still reports reported_attendance == 175"

      - name: screening_report_from_unscheduled_state_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Screening.transitions
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A screening already VOID by its booking's suspension accepts no report: the trigger is absent from VOID's outgoing transitions, so the attempt yields ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Standard CA fixture, booking driven to ON_SALE, then suspended so its screening is VOID; clock past the screening's end."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/approve"
              payload: { line_id: "${line_id}", expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v4: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /event-cinema/_ops/run-on-sale-sweep"
              payload: {}
              as: PlatformOps
            - call: "GET /event-cinema/screenings"
              payload: { booking_id: "${b_id}", limit: 10, offset: 0 }
              as: PlatformOps
              captures: { scr_id: "$.data[0].id" }
            - call: "POST /event-cinema/bookings/${b_id}/suspend"
              payload: { expected_booking_version: "${b_v4}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { b_v5: $.data.version }
            - call: "POST /event-cinema/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T21:30:00Z" }
              as: PlatformOps
          trigger:
            - call: "POST /event-cinema/screenings/${scr_id}/report"
              payload: { reported_attendance: 175, reported_outcome: "SCREENED" }
              as: Theater
              as_user_id: "${th_id}"
              captures: { void_err: "$.data.error_id" }
          assert:
            - "the suspension voided the screening — GET /event-cinema/screenings/${scr_id} reports state == VOID"
            - "a report against a VOID screening is refused with 409 — ${void_err} == ERR_INVALID_STATE"
