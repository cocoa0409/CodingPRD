            - "${a1_credit} == 1 (TIMER) and ${a2_credit} == 2 (SCORER), from JOB_CREDIT_VALUES"
            - "the unknown-meet call is HTTP 404 with ${err_meet_side} == ERR_MEET_NOT_FOUND"
            - "the unknown-registration call is HTTP 404 with ${err_reg_side} == ERR_REGISTRATION_NOT_FOUND, so the two FK sides are validated independently"
            - "the registration-side list returns total_count == 2 ({${a1_id}, ${a2_id}}) and the meet-side list returns total_count == 2 ({${a1_id}, ${a3_id}}): the junction is traversable from both ends"
            - "meet ${meet_a_id} has volunteer_slots_filled == 2 (TIMER 1 + MARSHAL 1) and meet ${meet_b_id} has volunteer_slots_filled == 2 (SCORER 2), so credits aggregate per meet and never leak across the junction"

      - name: listing_pagination_bounds_are_rejected_not_clamped
        claim_type: listing
        grounds:
          - validations[priority=13]
          - errors[ERR_PAGINATION_INVALID]
          - endpoints[GET /swim-club/memberships]
          - endpoints[GET /swim-club/certifications]
        distinguishing_aspect: |
          The declared bounds are limit in [1, 100] and offset >= 0, and out-of-range values must be
          REJECTED rather than clamped to the nearest legal value - the silent-clamp behavior most
          frameworks default to. The boundaries themselves are inclusive, so limit 1 and limit 100
          both succeed while limit 0 and limit 101 both fail, and the rule holds on every list
          endpoint, not just the first one implemented.
        test_recipe:
          setup:
            - "An empty club is sufficient: the pagination gate runs before any row is read, so no fixture is needed."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T09:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /swim-club/memberships"
              payload: { limit: 0 }
              as: Treasurer
              captures: { err_zero: $.data.error_id }
            - call: "GET /swim-club/memberships"
              payload: { limit: 101 }
              as: Treasurer
              captures: { err_over: $.data.error_id }
            - call: "GET /swim-club/memberships"
              payload: { offset: -1 }
              as: Treasurer
              captures: { err_neg: $.data.error_id }
            - call: "GET /swim-club/certifications"
              payload: { limit: 0 }
              as: PoolManager
              captures: { err_other_endpoint: $.data.error_id }
            - call: "GET /swim-club/memberships"
              payload: { limit: 1, offset: 0 }
              as: Treasurer
              captures: { ok_min: $.data }
            - call: "GET /swim-club/memberships"
              payload: { limit: 100, offset: 0 }
              as: Treasurer
              captures: { ok_max: $.data }
          assert:
            - "limit 0 is HTTP 422 with ${err_zero} == ERR_PAGINATION_INVALID, not a clamp to 1"
            - "limit 101 is HTTP 422 with ${err_over} == ERR_PAGINATION_INVALID, not a clamp to 100"
            - "offset -1 is HTTP 422 with ${err_neg} == ERR_PAGINATION_INVALID"
            - "${err_other_endpoint} == ERR_PAGINATION_INVALID on GET /swim-club/certifications, so the gate is shared and not per-endpoint"
            - "limit 1 and limit 100 are both HTTP 200: the bounds are inclusive on both ends"
            - "both successful responses echo the requested limit and offset alongside total_count 0 and has_more false"

  # ===========================================================================
  # State machines (guide Table 2) - shape `cyclic`
  # ===========================================================================
  - section: state_machines
    instances:

      - name: initial_state_new_meet_is_scheduled_with_an_empty_roster
        claim_type: initial_state
        grounds:
          - state_machines[Meet].initial_state
          - entities.Meet.fields.volunteer_slots_filled
          - endpoints[POST /swim-club/meets]
        distinguishing_aspect: |
          Meet is the branching machine (SCHEDULED forks to STAFFED or UNDERSTAFFED), so its birth
          state must be the un-forked one with roster_closed_at null even when volunteer_slots_required
          is already satisfiable. The corner is that no fork happens at creation time: a meet needing
          0 credits is still SCHEDULED and not STAFFED until close-roster runs.
        test_recipe:
          setup:
