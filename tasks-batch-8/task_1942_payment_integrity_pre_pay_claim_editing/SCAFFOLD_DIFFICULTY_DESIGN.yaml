            - { call: "GET /payment-integrity/itemized-bill-reviews", payload: { claim_id: "${chd_id}" }, as: Any, captures: { ibr_hd_status: "$.data[0].status", ibr_hd_due: "$.data[0].due_at" } }
            - { call: "GET /payment-integrity/abrasion-profiles", payload: { provider_id: "${ph_id}" }, as: Any, captures: { ph_ibr_count: "$.data[0].open_ibr_count" } }
          assert:
            - "Claim.${chd_id}.high_dollar_flag == true (hop 1)"
            - "Claim.${chd_id}.status == PENDED"
            - "ItemizedBillReview[claim=${chd_id}].status == REQUESTED with due_at == 2026-08-31T00:00:00Z (hop 2, default clock + 30 days)"
            - "ProviderAbrasionProfile[provider=${ph_id}].open_ibr_count == 1 (hop 3)"
  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: decided_dispute_past_deadline_state_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_DISPUTE_NOT_DECIDABLE]
          - errors[ERR_DECISION_DEADLINE_PASSED]
        distinguishing_aspect: |
          Pair (state vs business_temporal): the dispute is already DECIDED
          (state violation) AND the 60-day decision deadline has passed
          (temporal violation); the higher-priority state check wins, so the
          response is ERR_DISPUTE_NOT_DECIDABLE (409), not
          ERR_DECISION_DEADLINE_PASSED (422).
        test_recipe:
          setup:
            - "Provider PD9; edit ED9 ACTIVE; claim one 25000 line; hit upheld -> claim DENIED; dispute opened and decided UPHELD at default clock 2026-08-01"
            - "Clock advanced to 2026-10-02 (61 days after submission): the dispute is both DECIDED and past its decision deadline"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-D9", name: "Prio Prov" }, as: PlanAdmin, captures: { pd9_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "PRIO-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rd9_id: $.data.id, rd9_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rd9_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evd9_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evd9_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evd9_id}/approve", payload: { expected_edit_rule_version: "${rd9_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "D9", provider_id: "${pd9_id}", member_id: "M-D9", claim_type: PROFESSIONAL, total_billed_cents: 25000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pd9_id}", captures: { cd9_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cd9_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 25000 }, as: Provider, as_user_id: "${pd9_id}" }
            - { call: "POST /payment-integrity/claims/${cd9_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cd9_id}" }, as: Any, captures: { td9_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${td9_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${td9_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${cd9_id}", payload: {}, as: Any, captures: { cd9_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${cd9_id}/edit-hits", payload: {}, as: Any, captures: { hd9_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/claims/${cd9_id}/disputes", payload: { edit_hit_id: "${hd9_id}", reason: "contest", expected_claim_version: "${cd9_v}" }, as: Provider, as_user_id: "${pd9_id}", captures: { dd9_id: $.data.id } }
            - { call: "POST /payment-integrity/disputes/${dd9_id}/start-review", payload: {}, as: DisputeAdjudicator, as_user_id: adj-1 }
            - { call: "POST /payment-integrity/disputes/${dd9_id}/decide", payload: { outcome: UPHELD }, as: DisputeAdjudicator, as_user_id: adj-1 }
            - { call: "POST /payment-integrity/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: PlanAdmin }
          trigger:
            - { call: "POST /payment-integrity/disputes/${dd9_id}/decide", payload: { outcome: UPHELD }, as: DisputeAdjudicator, as_user_id: adj-1, captures: { err_id: $.data.error_id } }
          assert:
            - "second decide fails with error_id == ERR_DISPUTE_NOT_DECIDABLE and http 409 (state priority 7)"
            - "ERR_DECISION_DEADLINE_PASSED (temporal priority 10) is NOT returned although its condition also holds"
            - "Dispute.${dd9_id} remains DECIDED with outcome UPHELD; no side effects fire"

      - name: approve_missing_attestation_safety_beats_window_overlap
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_CLINICAL_ATTESTATION_REQUIRED]
          - errors[ERR_EDIT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Pair (business_safety vs business_constraint): approving a DENY edit
          applicable to INSTITUTIONAL_INPATIENT without clinical attestation
          AND with a window overlapping an ACTIVE version of the same rule;
          the safety check wins, returning ERR_CLINICAL_ATTESTATION_REQUIRED
          (422), not ERR_EDIT_WINDOW_OVERLAP (409).
        test_recipe:
          setup:
            - "Edit rule RS2 (CLINICAL, INTERNAL); version v1 DENY on INSTITUTIONAL_INPATIENT, window [2026-01-01, 2027-01-01), approved WITH attestation -> ACTIVE (rule version advanced to 2)"
