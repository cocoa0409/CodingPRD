              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE   # AuctionSale creation depends on the referenced Asset's state (MARKED_FOR_SALE required)"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on DIFFERENT resource entities
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sale_objection_window_blocks_early_consummation
        grounds:
          - state_machines.AuctionSale.APPROVED_to_CONSUMMATED
          - errors[ERR_OBJECTION_WINDOW_OPEN]
        distinguishing_aspect: |
          Semantics = half-open occupancy window [approved_on, effective_on)
          during which the sale resource is locked against consummation.
          Effective_on = approval + objection_window_days; consummation at
          effective_on - 1 day is rejected, at exactly effective_on succeeds.
        test_recipe:
          setup:
            - "Case in LIQUIDATION with objection_window_days 3; APPROVED sale with sale_approved_on 2026-06-05 (clock set to 2026-06-05 for approval), so effective_on = 2026-06-08"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor N", creditor_ref: "CR-N-1", contact_email: "n@x.com" }
              as: Clerk
              captures: { cred_n: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10015", debtor_name: "Debtor Fifteen", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001", objection_window_days: 3 }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/assets"
              payload: { description: "Lathe", scheduled_value_cents: 500000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { asset_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_n}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_n}"
              captures: { claim_id: $.data.id }
            - call: "POST /trustee/claims/${claim_id}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_id}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Court
            - call: "POST /trustee/cases/${case_id}/begin_liquidation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/assets/${asset_id}/mark_for_sale"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/sales"
              payload: { asset_id: "${asset_id}", buyer_name: "B", hammer_price_cents: 400000, sale_costs_cents: 0 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { sale_id: $.data.id }
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: Court
            - call: "POST /trustee/sales/${sale_id}/approve"
              payload: {}
              as: Court
          trigger:
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T00:00:00Z" }
              as: Court
            - call: "POST /trustee/sales/${sale_id}/consummate"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { early_err: $.data.error_id }
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: Court
            - call: "POST /trustee/sales/${sale_id}/consummate"
              payload: {}
