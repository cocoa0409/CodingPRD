# =============================================================================
# §1.9 Scaffold Corner Design — task 2658 Machine Learning Model Deployment
# & Monitoring
#
# Breadth probe. Every instance below is a testable claim that SCAFFOLD.yaml's
# §1.1–§1.7 surface declares and that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# does NOT already cover. Corners §1.8 already asserts are emitted as
# `excluded_because:` stubs with no `test_recipe`.
#
# `section:` values are exactly the nine sections of
# references/claim-extraction-guide.md; `claim_type:` values are exactly that
# guide's per-section table rows.
#
# Shared conventions (identical to §1.8, so fixtures compose):
#   * The logical clock starts at its 2026-08-01T00:00:00Z default. Any call to
#     POST /_clock/set_current_utc moves it forward only (ERR_CLOCK_REGRESSION).
#   * Pinned opaque X-User-ID values:
#       u_mle_1   MLEngineer            u_mle_2   MLEngineer (second engineer)
#       u_stew_1  DataSteward           u_stew_2  DataSteward (second steward)
#       u_appr_1  ModelApprover         u_appr_2  ModelApprover (second approver)
#       u_rel_1   ReliabilityEngineer   u_admin_1 PlatformAdmin
#   * doc_sections of 4 of the 5 declared keys => doc_completeness_pct 80.00
#     (exactly the priority-30 floor); repro_artifacts of all 4 => 100.00.
#   * Every `expected_serving_endpoint_version` / `expected_model_version` is a
#     `${var}` captured from an immediately preceding read of that row.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: create_model_returns_declared_fields_defaults_and_success_envelope
        claim_type: Creation
        grounds:
          - entities.Model
          - endpoints.POST_models
          - response_envelope.success
        distinguishing_aspect: |
          POST /models with only the three required inputs returns 201, echoes them, applies
          revalidation_interval_days default 90 and registry_status default ACTIVE, initialises the
          three computed fields to their declared zero values, and wraps everything in the fixed
          §1.0 success envelope with response_type 'object'.
        test_recipe:
          setup:
            - "empty database; clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id, m_interval: $.data.revalidation_interval_days, m_status: $.data.registry_status, m_ver: $.data.version }
          assert:
            - "HTTP 201 with response_type 'object' and meta carrying both api_request_id and api_request_timestamp"
            - "echoed inputs: name == 'fraud-scorer', task_type == 'CLASSIFICATION', owner_team == 'risk-ml'"
            - "default applied: revalidation_interval_days == 90"
            - "system default applied: registry_status == 'ACTIVE'"
            - "computed fields initialised: champion_version_id null, champion_promoted_at null, open_retraining_trigger_count == 0"
            - "common fields present: id non-empty, created_at == '2026-08-01T00:00:00Z', updated_at == '2026-08-01T00:00:00Z', version == 1"
            - "registered_by_user_id == 'u_mle_1', taken from the X-User-ID header and not from the body"

      - name: get_model_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints.GET_models_model_id
          - entities.Model
        distinguishing_aspect: |
          GET /models/{model_id} returns the row exactly as stored by the create call — same id, same
          version, same created_at — proving the read path is not recomputing or re-defaulting.
        test_recipe:
          setup:
            - "one Model created at clock 2026-08-01T00:00:00Z with revalidation_interval_days 90"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 45 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /models/${m_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { got_id: $.data.id, got_interval: $.data.revalidation_interval_days, got_version: $.data.version }
          assert:
            - "HTTP 200 with response_type 'object'"
            - "id == ${m_id}, revalidation_interval_days == 45 (the supplied value, not the 90 default), registry_status == 'ACTIVE'"
            - "version == 1 — a read does not bump the OCC counter"
            - "created_at == updated_at == '2026-08-01T00:00:00Z'"

      - name: list_model_versions_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_model_versions
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /model-versions with limit 2 over three sibling versions returns exactly two rows,
          total_count 3 and has_more true; the second page returns the remaining row with has_more
          false. Pagination metadata counts the FILTERED set, not the table.
        test_recipe:
          setup:
            - "one Model with an APPROVED TrainingDataset and three DRAFT ModelVersions (1.0.0, 1.1.0, 1.2.0)"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.1.0", artifact_digest: "sha256:bbb", feature_spec_hash: "fs-v1", baseline_accuracy: 0.83, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v2_id: $.data.id }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.2.0", artifact_digest: "sha256:ccc", feature_spec_hash: "fs-v1", baseline_accuracy: 0.84, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v3_id: $.data.id }
          trigger:
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 2, offset: 0 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { p1_total: $.meta.total_count, p1_has_more: $.meta.has_more, p1_first: "$.data[0].id" }
            - call: "GET /model-versions"
              payload: { model_id: "${m_id}", limit: 2, offset: 2 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { p2_total: $.meta.total_count, p2_has_more: $.meta.has_more, p2_first: "$.data[0].id" }
          assert:
            - "page 1: HTTP 200, response_type 'array', exactly 2 rows, total_count 3, limit 2, offset 0, has_more true"
            - "page 2: exactly 1 row, total_count 3, limit 2, offset 2, has_more false"
            - "the two pages are disjoint and together cover ${v1_id}, ${v2_id} and ${v3_id}"
            - "every returned row has approval_state 'DRAFT' and doc_completeness_pct 0.00 (no doc_sections supplied)"

      - name: get_deployment_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations.priority_3
          - errors.ERR_DEPLOYMENT_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unstored id on a path parameter is a 404 carrying the
          entity-specific code ERR_DEPLOYMENT_NOT_FOUND, not a generic 400 or 500.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /deployments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type 'error' and data.error_id == 'ERR_DEPLOYMENT_NOT_FOUND'"
            - "data.message is a non-empty string and meta still carries api_request_id"

      - name: create_training_dataset_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations.priority_5
          - errors.ERR_INVALID_REQUEST
          - entities.TrainingDataset.fields.snapshot_uri
        distinguishing_aspect: |
          snapshot_uri is `source: input` with no default, so omitting it is a priority-5 400
          ERR_INVALID_REQUEST — and no TrainingDataset row is created.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { err: $.data.error_id }
            - call: "GET /training-datasets"
              payload: { limit: 10, offset: 0 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { total: $.meta.total_count }
          assert:
            - "HTTP 400 with error_id 'ERR_INVALID_REQUEST' (priority 5)"
            - "nothing was persisted: GET /training-datasets returns total_count 0"

      - name: omitted_optional_inputs_apply_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.ServingEndpoint.fields.max_traffic_pct
          - entities.ServingEndpoint.fields.deploy_cooldown_minutes
          - entities.ModelVersion.fields.evaluation_sample_quota
          - entities.TrainingDataset.fields.pii_review_passed
        distinguishing_aspect: |
          Four different declared defaults across three entities, all exercised by omission in the
          same test: max_traffic_pct 100.00, deploy_cooldown_minutes 30, evaluation_sample_quota
          50000 (with evaluation_sample_budget mirroring it) and pii_review_passed false, plus the
          empty-array defaults for doc_sections and repro_artifacts.
        test_recipe:
          setup:
            - "one Model; clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id, ds_pii: $.data.pii_review_passed }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200 }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id, v1_quota: $.data.evaluation_sample_quota, v1_budget: $.data.evaluation_sample_budget, v1_docs: $.data.doc_sections }
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1" }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se_id: $.data.id, se_max: $.data.max_traffic_pct, se_cool: $.data.deploy_cooldown_minutes }
          assert:
            - "TrainingDataset.${ds_id}.pii_review_passed == false (declared default), approval_state == 'DRAFT'"
            - "ModelVersion.${v1_id}.evaluation_sample_quota == 50000 and evaluation_sample_budget == 50000"
            - "ModelVersion.${v1_id}.doc_sections == [] and repro_artifacts == [], so doc_completeness_pct == 0.00 and reproducibility_score == 0.00"
            - "ServingEndpoint.${se_id}.max_traffic_pct == 100.00 and deploy_cooldown_minutes == 30"
            - "ServingEndpoint.${se_id}.operational_state == 'OPEN' and allocated_traffic_pct == 0.00"
            - "Model.${m_id}.revalidation_interval_days == 90"

      - name: computed_documentation_scores_derive_from_arrays_not_from_client_input
        claim_type: Computed Fields
        grounds:
          - calculations.documentation_and_reproducibility_score
          - entities.ModelVersion.fields.doc_completeness_pct
          - entities.ModelVersion.fields.reproducibility_score
          - endpoints.PATCH_model_versions_version_id_documentation
        distinguishing_aspect: |
          doc_completeness_pct and reproducibility_score are `source: computed`: they are derived
          from the two key arrays at write time (4 of 5 sections => 80.00, 4 of 4 artifacts =>
          100.00) and are RE-derived when PATCH replaces the arrays wholesale (3 of 5 => 60.00,
          3 of 4 => 75.00). Duplicated keys are de-duplicated before counting.
        test_recipe:
          setup:
            - "one Model and one DRAFT TrainingDataset"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
          trigger:
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id, doc0: $.data.doc_completeness_pct, repro0: $.data.reproducibility_score }
            - call: "PATCH /model-versions/${v1_id}/documentation"
              payload: { doc_sections: ["INTENDED_USE", "INTENDED_USE", "TRAINING_DATA", "EVALUATION"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { doc1: $.data.doc_completeness_pct, repro1: $.data.reproducibility_score, docs1: $.data.doc_sections }
          assert:
            - "at creation: doc_completeness_pct == 80.00 (4 of the 5 declared section keys) and reproducibility_score == 100.00 (4 of 4 artifact keys)"
            - "after the PATCH: doc_completeness_pct == 60.00 — the duplicate 'INTENDED_USE' is counted once, so 3 distinct sections of 5"
            - "after the PATCH: reproducibility_score == 75.00 (3 of 4 artifacts)"
            - "the arrays are replaced wholesale, not merged: doc_sections no longer contains 'LIMITATIONS'"
            - "ModelVersion.${v1_id}.version == 2 after the PATCH and approval_state is still 'DRAFT'"

      - name: system_fields_are_server_generated_and_client_values_are_ignored
        claim_type: System Fields
        grounds:
          - entities.TrainingDataset.fields.approval_state
          - entities.TrainingDataset.fields.registered_by_user_id
          - entities.TrainingDataset.fields.decided_by_user_id
        distinguishing_aspect: |
          approval_state, registered_by_user_id, decided_by_user_id and the common id/created_at/
          version fields are all `source: system`. Supplying them in the body cannot override the
          server: the row still starts DRAFT at version 1 with registered_by_user_id taken from the
          X-User-ID header.
        test_recipe:
          setup:
            - "empty database; clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: DataSteward
              as_user_id: "u_stew_1"
              captures: { ds_id: $.data.id, ds_state: $.data.approval_state, ds_reg: $.data.registered_by_user_id, ds_ver: $.data.version }
          assert:
            - "approval_state == 'DRAFT' — the system initial state, never a client-supplied one"
            - "registered_by_user_id == 'u_stew_1', sourced from the X-User-ID header"
            - "decided_by_user_id, decided_at and revocation_reason are all null"
            - "id is server-generated and non-empty, created_at == '2026-08-01T00:00:00Z', version == 1"
            - "dependent_version_count == 0"

      - name: invalid_enum_and_malformed_array_inputs_are_rejected
        claim_type: Type Constraints
        grounds:
          - validations.priority_5
          - validations.priority_6
          - errors.ERR_INVALID_BIN_PROPORTIONS
          - entities.Deployment.fields.pattern
        distinguishing_aspect: |
          Two distinct type-constraint families on two endpoints: an out-of-set enum value
          ('CANARY' for Deployment.pattern) is a priority-5 ERR_INVALID_REQUEST, while a
          bin-proportion array of the right length whose members sum to 0.90 gets the dedicated
          priority-6 ERR_INVALID_BIN_PROPORTIONS — a more specific code for a more specific shape.
        test_recipe:
          setup:
            - "one APPROVED ModelVersion and one OPEN ServingEndpoint, so nothing but the payload can be at fault"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se1_id: $.data.id, se1_v: $.data.version }
          trigger:
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "CANARY", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-08-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { enum_err: $.data.error_id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-08", snapshot_uri: "s3://snaps/2026-08", row_count: 500000, feature_hash: "fs-v2", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.10], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { bins_err: $.data.error_id }
          assert:
            - "pattern 'CANARY' is outside {BATCH, REALTIME, SHADOW}: HTTP 400 with error_id 'ERR_INVALID_REQUEST' (priority 5)"
            - "no Deployment row was created: GET /deployments?serving_endpoint_id=${se1_id} returns total_count 0"
            - "bin proportions [0.20, 0.20, 0.20, 0.20, 0.10] have the right BIN_COUNT 5 but sum to 0.90: HTTP 400 with error_id 'ERR_INVALID_BIN_PROPORTIONS' (priority 6), which outranks nothing else here but is more specific than ERR_INVALID_REQUEST"
            - "the more specific code wins for the array shape while the enum failure keeps the generic code — the two are not interchangeable"

      - name: traffic_ramp_step_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.TrafficRampStep
          - endpoints.GET_traffic_ramp_steps_ramp_step_id
          - endpoints.GET_deployments_deployment_id_ramp_steps
        distinguishing_aspect: |
          TrafficRampStep is the scaffold's only `common_fields: false` entity: it is an append-only
          audit row with no update endpoint anywhere in §1.5 and no `version` field, and all eight of
          its fields are `source: system`. It is readable both as a sub-resource of its deployment
          and from its own top-level collection.
        test_recipe:
          setup:
            - "one REALTIME Deployment ramped twice (traffic_pct 15.00), which appends exactly two rows"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
