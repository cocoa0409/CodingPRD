      - name: revenue_share_adjustment_conserves_gross_equals_retained_plus_share
        grounds:
          - state_machines.RevenueShareStatement.DISPUTED_to_ADJUSTED
          - calculations.final_revenue_share
        distinguishing_aspect: |
          Conserved quantity: per-line (exhibitor_retained_cents +
          agreed_share_cents) == gross_reported_cents. When a dispute leads
          to an adjustment, the adjustment appends an entry to the line's
          adjustments[] such that the line's gross_reported_cents stays
          constant while agreed_share_cents and exhibitor_retained_cents are
          both updated to preserve the invariant. Different conserved
          quantity than the window capacity invariant.
        test_recipe:
          setup:
            - "Standard setup. Slot CONFIRMED for full window with one VALIDATED report of 10_000_000 cents on 2026-09-07. Statement moved DRAFT → ISSUED → DISPUTED."
