scenario: "Multifamily Amenity & Resident-Experience Platform: amenity booking (gym/pool/clubroom), event & community, service request & vendor, package & access, rent & payment linkage, survey/retention, guest & visitor, reporting"
domain_name: "multifamily-amenity-resident-experience"
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  # Property/Unit/Resident form a shallow hierarchy; Amenity, Vendor, Survey are
  # peer configuration entities; AmenityBooking, ServiceRequest, EventRegistration,
  # GuestPass, Package, LedgerEntry, SurveyResponse are flat FK-linked resources
  # cutting across the hierarchy.

  state_machine_shape: cyclic
  # AmenityBooking (CONFIRMED <-> SUSPENDED) and ServiceRequest (TRIAGED <-> ASSIGNED)
  # both carry revision cycles; Resident.account_status also loops
  # GOOD_STANDING <-> DELINQUENT <-> SUSPENDED.

  relationship_patterns:
    - one_to_many          # Property->Unit->Resident, Resident->Booking, etc.
    - many_to_many         # Resident <-> CommunityEvent via EventRegistration
    - cross_aggregate      # Booking/GuestPass reference Resident + Amenity/Property across aggregates

  role_model: segregation_of_duties
  # PropertyManager, Resident, Vendor, FrontDesk. SoD: the PropertyManager who
  # triages a ServiceRequest may not be the PropertyManager (X-User-ID) who
  # approves its vendor invoice.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Property display name.
      - name: address
        type: string
        source: input
        description: Street address.
      - name: timezone
        type: string
        source: input
        description: IANA timezone label (informational only; all window math is UTC).
        default: "America/New_York"
      - name: guest_parking_capacity
        type: integer
        source: input
        description: Max number of guest passes that may be concurrently active (ISSUED or CHECKED_IN) across the property at any instant.
        constraints: ">= 0"
      - name: guest_window_hours
        type: integer
        source: input
        description: Maximum allowed span (hours) between a guest pass arrival_at and expected_departure_at.
        default: 24

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: unit_number
        type: string
        source: input
        description: Human unit label, unique within a property.
      - name: bedrooms
        type: integer
        source: input
        description: Bedroom count.
      - name: occupancy_status
        type: enum
        source: system
        description: VACANT until a Resident is attached, then OCCUPIED.
        default: VACANT
        constraints: "one of {VACANT, OCCUPIED}"

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id"
      - name: full_name
        type: string
        source: input
        description: Resident name.
      - name: email
        type: string
        source: input
        description: Contact email, unique across residents.
      - name: membership_tier
        type: enum
        source: input
        description: Pricing tier; PREMIUM receives the amenity-fee discount.
        default: STANDARD
        constraints: "one of {STANDARD, PREMIUM}"
      - name: account_status
        type: enum
        source: computed
        description: Derived posture gating amenity/guest privileges; recomputed from rent_balance_cents on every charge/payment (see calculations.account_status_evaluation).
        default: GOOD_STANDING
        constraints: "one of {GOOD_STANDING, DELINQUENT, SUSPENDED}"
      - name: rent_balance_cents
        type: integer
        source: computed
        description: Net amount owed = sum of owed-affecting LedgerEntry.amount_cents (charges positive, payments negative). May be 0; never below 0 (overpayment spills to wallet_credit_cents).
        default: 0
      - name: hold_balance_cents
        type: integer
        source: computed
        description: Sum of active booking deposit holds (not yet owed). Released on cancel/checkout/suspend.
        default: 0
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: Prepaid credit from refunds and payment overflow; consumed before rent_balance on future charges.
        default: 0
      - name: no_show_strikes
        type: integer
        source: computed
        description: Count of NO_SHOW amenity bookings; feeds retention_score penalty.
        default: 0
      - name: retention_score
        type: integer
        source: computed
        description: 0-100 engagement/satisfaction score (see calculations.retention_score); recomputed on read.
        default: 50

  - name: Amenity
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: name
        type: string
        source: input
        description: Amenity display name.
      - name: amenity_type
        type: enum
        source: input
        description: Kind of amenity.
        constraints: "one of {GYM, POOL, CLUBROOM}"
      - name: capacity
        type: integer
        source: input
        description: Max number of CONFIRMED/CHECKED_IN bookings that may cover any single instant.
        constraints: ">= 1"
      - name: base_rate_cents_per_hour
        type: integer
        source: input
        description: Off-peak hourly rate in cents.
        constraints: ">= 0"
      - name: deposit_cents
        type: integer
        source: input
        description: Refundable deposit held per booking.
        default: 0
      - name: buffer_minutes
        type: integer
        source: input
        description: Minimum gap required between two bookings on this amenity (turnover buffer).
        default: 0
      - name: open_minute
        type: integer
        source: input
        description: Daily open time as minutes from 00:00 UTC (inclusive).
        constraints: "0..1440"
      - name: close_minute
        type: integer
        source: input
        description: Daily close time as minutes from 00:00 UTC (exclusive upper bound for booking end).
        constraints: "0..1440, > open_minute"
      - name: peak_start_minute
        type: integer
        source: input
        description: Peak window start as minutes from 00:00 UTC (inclusive).
        default: 0
      - name: peak_end_minute
        type: integer
        source: input
        description: Peak window end as minutes from 00:00 UTC (exclusive).
        default: 0
      - name: peak_multiplier
        type: number
        source: input
        description: Multiplier applied to base rate during peak hours.
        default: 1.0
      - name: status
        type: enum
        source: input
        description: Bookability gate.
        default: OPEN
        constraints: "one of {OPEN, CLOSED, MAINTENANCE}"

  - name: AmenityBooking
    parent: null
    common_fields: true
    fields:
      - name: amenity_id
        type: string
        source: input
        description: "FK -> Amenity.id"
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: start_at
        type: datetime
        source: input
        description: Requested window start (UTC, inclusive).
      - name: end_at
        type: datetime
        source: input
        description: Requested window end (UTC, exclusive).
      - name: status
        type: enum
        source: system
        description: Booking lifecycle state.
        default: CONFIRMED
        constraints: "one of {CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW, SUSPENDED}"
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: Fee estimated at creation from the requested window (see calculations.booking_charge, variant=provisional).
      - name: final_fee_cents
        type: integer
        source: computed
        description: Fee settled at check-out from the actual checked-in window (variant=final); null until COMPLETED.
      - name: deposit_hold_cents
        type: integer
        source: computed
        description: Deposit amount held for this booking (copied from amenity.deposit_cents at creation).
      - name: checked_in_at
        type: datetime
        source: system
        description: Logical-clock time of check-in; null until CHECKED_IN.
      - name: checked_out_at
        type: datetime
        source: system
        description: Logical-clock time of check-out; null until COMPLETED.

  - name: CommunityEvent
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: amenity_id
        type: string
        source: input
        description: "FK -> Amenity.id; nullable venue reference (event may be venue-less)."
      - name: title
        type: string
        source: input
        description: Event title.
      - name: start_at
        type: datetime
        source: input
        description: Event start (UTC).
      - name: end_at
        type: datetime
        source: input
        description: Event end (UTC).
      - name: capacity
        type: integer
        source: input
        description: Max RESERVED registrations; further registrations go WAITLISTED.
        constraints: ">= 1"
      - name: fee_cents
        type: integer
        source: input
        description: Per-registration fee in cents.
        default: 0
      - name: status
        type: enum
        source: system
        description: Event lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, CANCELLED, COMPLETED}"
      - name: reserved_count
        type: integer
        source: computed
        description: Count of RESERVED registrations.
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: Count of WAITLISTED registrations.
        default: 0

  - name: EventRegistration
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> CommunityEvent.id"
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: status
        type: enum
        source: system
        description: Registration state.
        default: RESERVED
        constraints: "one of {RESERVED, WAITLISTED, ATTENDED, NO_SHOW, CANCELLED}"
      - name: fee_charged_cents
        type: integer
        source: computed
        description: Fee actually charged to the resident (event.fee_cents when RESERVED, 0 when WAITLISTED).
        default: 0

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Vendor company name.
      - name: trades
        type: array
        source: input
        description: List of trades this vendor services; each member one of {PLUMBING, ELECTRICAL, HVAC, APPLIANCE, GENERAL}.
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Labor rate in cents per hour.
        constraints: ">= 0"
      - name: active_job_limit
        type: integer
        source: input
        description: Max concurrent ASSIGNED/IN_PROGRESS service requests.
        default: 5
      - name: active_job_count
        type: integer
        source: computed
        description: Current count of ASSIGNED/IN_PROGRESS service requests for this vendor.
        default: 0
      - name: status
        type: enum
        source: system
        description: Vendor availability gate; assignments require ACTIVE.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id"
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; nullable until assigned."
      - name: trade
        type: enum
        source: input
        description: Required trade; one of {PLUMBING, ELECTRICAL, HVAC, APPLIANCE, GENERAL}.
      - name: priority
        type: enum
        source: input
        description: Urgency; EMERGENCY adds a trip fee to the invoice.
        default: ROUTINE
        constraints: "one of {ROUTINE, URGENT, EMERGENCY}"
      - name: description
        type: string
        source: input
        description: Problem description.
      - name: status
        type: enum
        source: system
        description: Work-order lifecycle state.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, TRIAGED, ASSIGNED, IN_PROGRESS, COMPLETED, CLOSED, CANCELLED}"
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: Estimate computed at assignment (see calculations.service_invoice, variant=estimate); null until ASSIGNED.
      - name: final_invoice_cents
        type: integer
        source: computed
        description: Actual invoice computed at completion (variant=actual); null until COMPLETED.
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the PropertyManager who triaged; used for the invoice-approval SoD check.
      - name: invoice_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the PropertyManager who approved the invoice; must differ from triaged_by_user_id.

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: entry_type
        type: enum
        source: system
        description: Ledger line kind.
        constraints: "one of {RENT_CHARGE, BOOKING_FEE, DEPOSIT_FORFEIT, EVENT_FEE, SERVICE_CHARGE, PENALTY, PAYMENT, REFUND}"
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount; positive increases owed (charge), negative decreases owed (payment/refund/credit).
      - name: source_type
        type: string
        source: system
        description: Originating resource type label (e.g. AmenityBooking, ServiceRequest, CommunityEvent, Payment) - not a resolvable FK.
      - name: source_id
        type: string
        source: system
        description: Originating resource id (plain reference label, not a validated FK).
      - name: description
        type: string
        source: system
        description: Human-readable memo.

  - name: Package
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: carrier
        type: string
        source: input
        description: Delivery carrier name.
      - name: status
        type: enum
        source: system
        description: Package handling state.
        default: RECEIVED
        constraints: "one of {RECEIVED, NOTIFIED, PICKED_UP, RETURNED}"
      - name: access_code
        type: string
        source: system
        description: Server-minted 6-digit pickup code; required to pick up.
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock time the package was logged.
      - name: picked_up_at
        type: datetime
        source: system
        description: Logical-clock time of pickup; null until PICKED_UP.

  - name: GuestPass
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: guest_name
        type: string
        source: input
        description: Visitor name.
      - name: arrival_at
        type: datetime
        source: input
        description: Expected arrival (UTC, inclusive) - window start for concurrency.
      - name: expected_departure_at
        type: datetime
        source: input
        description: Expected departure (UTC, exclusive) - window end for concurrency.
      - name: status
        type: enum
        source: system
        description: Guest pass state.
        default: ISSUED
        constraints: "one of {ISSUED, CHECKED_IN, DEPARTED, EXPIRED, CANCELLED}"
      - name: pass_code
        type: string
        source: system
        description: Server-minted access code for the visitor.

  - name: Survey
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: title
        type: string
        source: input
        description: Survey title.
      - name: status
        type: enum
        source: system
        description: Survey lifecycle; responses accepted only when OPEN.
        default: DRAFT
        constraints: "one of {DRAFT, OPEN, CLOSED}"
      - name: response_count
        type: integer
        source: computed
        description: Number of submitted responses.
        default: 0

  - name: SurveyResponse
    parent: null
    common_fields: false
    fields:
      - name: survey_id
        type: string
        source: input
        description: "FK -> Survey.id"
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: satisfaction_score
        type: integer
        source: input
        description: 1-5 satisfaction rating.
        constraints: "1..5"
      - name: comment
        type: string
        source: input
        description: Optional free-text comment.

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Resident
    initial_state: GOOD_STANDING
    terminal_states: []
    transitions:
      - from: GOOD_STANDING
        to: DELINQUENT
        trigger: "system: recompute after POST /residents/{id}/rent-charges or POST /payments"
        actor: system
        preconditions:
          - "rent_balance_cents > DELINQUENCY_THRESHOLD_CENTS and rent_balance_cents <= SUSPENSION_THRESHOLD_CENTS"
        side_effects:
          - "for each AmenityBooking of this resident in status CONFIRMED with start_at > clock.now: transition CONFIRMED->SUSPENDED (see AmenityBooking machine); each such suspension releases its deposit hold"
        note: "Cascade origin A (depth 3): resident status -> booking suspension -> deposit-hold release."
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "system: recompute after rent-charge/payment"
        actor: system
        preconditions:
          - "rent_balance_cents > SUSPENSION_THRESHOLD_CENTS"
        side_effects:
          - "same future-CONFIRMED-booking suspension cascade as GOOD_STANDING->DELINQUENT"
      - from: DELINQUENT
        to: SUSPENDED
        trigger: "system: recompute after rent-charge/payment"
        actor: system
        preconditions:
          - "rent_balance_cents > SUSPENSION_THRESHOLD_CENTS"
        side_effects: []
      - from: DELINQUENT
        to: GOOD_STANDING
        trigger: "system: recompute after POST /payments"
        actor: system
        preconditions:
          - "rent_balance_cents <= DELINQUENCY_THRESHOLD_CENTS"
        side_effects:
          - "for each AmenityBooking of this resident in status SUSPENDED with start_at > clock.now AND whose window is still free of capacity/overlap conflicts: transition SUSPENDED->CONFIRMED, re-placing the deposit hold"
        note: "Reverse cascade; completes the CONFIRMED<->SUSPENDED cycle."
      - from: SUSPENDED
        to: DELINQUENT
        trigger: "system: recompute after POST /payments"
        actor: system
        preconditions:
          - "rent_balance_cents > DELINQUENCY_THRESHOLD_CENTS and rent_balance_cents <= SUSPENSION_THRESHOLD_CENTS"
        side_effects: []
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "system: recompute after POST /payments"
        actor: system
        preconditions:
          - "rent_balance_cents <= DELINQUENCY_THRESHOLD_CENTS"
        side_effects:
          - "same SUSPENDED-booking re-confirmation cascade as DELINQUENT->GOOD_STANDING"

  - entity: AmenityBooking
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: CREATE
        to: CONFIRMED
        trigger: "POST /amenity-bookings"
        actor: Resident
        preconditions:
          - "amenity.status == OPEN"
          - "resident.account_status == GOOD_STANDING"
          - "start_at < end_at and both within [open_minute, close_minute] on the same UTC day"
          - "no buffer-expanded overlap with another CONFIRMED/CHECKED_IN booking beyond capacity (see validations priority 10)"
          - "expected_amenity_version matches amenity.version (OCC)"
        side_effects:
          - "compute provisional_fee_cents via calculations.booking_charge (variant=provisional)"
          - "deposit_hold_cents = amenity.deposit_cents; resident.hold_balance_cents += deposit_hold_cents"
          - "increments Amenity.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /amenity-bookings/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "clock.now in [start_at - CHECK_IN_GRACE_MINUTES, end_at)"
        side_effects:
          - "checked_in_at = clock.now"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /amenity-bookings/{id}/check-out"
        actor: FrontDesk
        preconditions:
          - "status == CHECKED_IN"
        side_effects:
          - "checked_out_at = clock.now"
          - "compute final_fee_cents via calculations.booking_charge (variant=final) over [checked_in_at, checked_out_at)"
          - "resident.rent_balance_cents += final_fee_cents; LedgerEntry BOOKING_FEE (+final_fee_cents)"
          - "resident.hold_balance_cents -= deposit_hold_cents (release hold)"
          - "recompute resident.account_status (calculations.account_status_evaluation)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /amenity-bookings/{id}/cancel"
        actor: Resident
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "compute penalty via calculations.late_cancel_penalty"
          - "if penalty > 0: resident.rent_balance_cents += penalty; LedgerEntry PENALTY (+penalty)"
          - "resident.hold_balance_cents -= deposit_hold_cents (release full hold)"
          - "recompute resident.account_status"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /amenity-bookings/{id}/mark-no-show"
        actor: FrontDesk
        preconditions:
          - "clock.now >= end_at and checked_in_at is null"
        side_effects:
          - "resident.rent_balance_cents += deposit_hold_cents (forfeit deposit); LedgerEntry DEPOSIT_FORFEIT (+deposit_hold_cents)"
          - "resident.hold_balance_cents -= deposit_hold_cents"
          - "resident.no_show_strikes += 1"
          - "recompute resident.account_status"
      - from: CONFIRMED
        to: SUSPENDED
        trigger: "system: cascade from Resident GOOD_STANDING/DELINQUENT -> DELINQUENT/SUSPENDED"
        actor: system
        preconditions:
          - "start_at > clock.now"
        side_effects:
          - "resident.hold_balance_cents -= deposit_hold_cents (release hold while suspended); LedgerEntry not written (hold movement only)"
        note: "Cascade A link 2->3."
      - from: SUSPENDED
        to: CONFIRMED
        trigger: "system: cascade from Resident DELINQUENT/SUSPENDED -> GOOD_STANDING"
        actor: system
        preconditions:
          - "start_at > clock.now"
          - "the window is still free of capacity/overlap conflicts"
        side_effects:
          - "resident.hold_balance_cents += deposit_hold_cents (re-place hold)"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /amenity-bookings/{id}/cancel"
        actor: Resident
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "no hold movement (hold already released on suspension); no penalty"

  - entity: ServiceRequest
    initial_state: SUBMITTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /service-requests/{id}/triage"
        actor: PropertyManager
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "triaged_by_user_id = X-User-ID"
          - "optionally overwrite trade/priority from body"
      - from: TRIAGED
        to: ASSIGNED
        trigger: "POST /service-requests/{id}/assign"
        actor: PropertyManager
        preconditions:
          - "vendor.status == ACTIVE"
          - "trade is a member of vendor.trades"
          - "vendor.active_job_count < vendor.active_job_limit"
        side_effects:
          - "vendor_id = body.vendor_id"
          - "compute estimated_cost_cents via calculations.service_invoice (variant=estimate)"
          - "vendor.active_job_count += 1"
      - from: ASSIGNED
        to: TRIAGED
        trigger: "POST /service-requests/{id}/unassign"
        actor: PropertyManager
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "vendor.active_job_count -= 1"
          - "vendor_id = null; estimated_cost_cents = null"
        note: "Revert loop giving the TRIAGED<->ASSIGNED cycle."
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /service-requests/{id}/start"
        actor: Vendor
        preconditions:
          - "acting vendor (X-User-ID) == vendor_id"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-requests/{id}/complete"
        actor: Vendor
        preconditions:
          - "acting vendor (X-User-ID) == vendor_id"
        side_effects:
          - "compute final_invoice_cents via calculations.service_invoice (variant=actual)"
          - "vendor.active_job_count -= 1"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /service-requests/{id}/approve-invoice"
        actor: PropertyManager
        preconditions:
          - "X-User-ID != triaged_by_user_id (segregation of duties)"
        side_effects:
          - "invoice_approved_by_user_id = X-User-ID"
          - "resident.rent_balance_cents += final_invoice_cents; LedgerEntry SERVICE_CHARGE (+final_invoice_cents)"
          - "recompute resident.account_status"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /service-requests/{id}/cancel"
        actor: Resident
        preconditions:
          - "status == SUBMITTED"
        side_effects: []
      - from: TRIAGED
        to: CANCELLED
        trigger: "POST /service-requests/{id}/cancel"
        actor: PropertyManager
        preconditions:
          - "status == TRIAGED"
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /service-requests/{id}/cancel"
        actor: PropertyManager
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "vendor.active_job_count -= 1"

  - entity: CommunityEvent
    initial_state: DRAFT
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /events/{id}/publish"
        actor: PropertyManager
        preconditions:
          - "capacity >= 1"
          - "start_at > clock.now"
        side_effects: []
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: PropertyManager
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "for each EventRegistration in RESERVED or WAITLISTED: transition to CANCELLED; if it had fee_charged_cents > 0, refund it: resident.wallet_credit_cents += fee_charged_cents; LedgerEntry REFUND (-fee_charged_cents)"
        note: "Cascade origin B (depth 2->3): event -> registration cancel -> resident wallet refund."
      - from: PUBLISHED
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: PropertyManager
        preconditions:
          - "clock.now >= end_at"
        side_effects:
          - "each RESERVED registration not checked-in becomes NO_SHOW"

  - entity: EventRegistration
    initial_state: RESERVED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: CREATE
        to: RESERVED
        trigger: "POST /events/{id}/register"
        actor: Resident
        preconditions:
          - "event.status == PUBLISHED"
          - "event.reserved_count < event.capacity"
          - "no existing non-terminal registration for (event, resident)"
        side_effects:
          - "fee_charged_cents = event.fee_cents; resident.rent_balance_cents += event.fee_cents; LedgerEntry EVENT_FEE (+event.fee_cents)"
          - "event.reserved_count += 1"
          - "recompute resident.account_status"
      - from: CREATE
        to: WAITLISTED
        trigger: "POST /events/{id}/register"
        actor: Resident
        preconditions:
          - "event.status == PUBLISHED"
          - "event.reserved_count >= event.capacity"
          - "no existing non-terminal registration for (event, resident)"
        side_effects:
          - "fee_charged_cents = 0"
          - "event.waitlist_count += 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /event-registrations/{id}/cancel"
        actor: Resident
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "if fee_charged_cents > 0: refund -> resident.wallet_credit_cents += fee_charged_cents; LedgerEntry REFUND (-fee_charged_cents)"
          - "event.reserved_count -= 1"
          - "promote the single earliest-created WAITLISTED registration for this event (selector: status == WAITLISTED, ranked by created_at ASC; created_at is server-minted at microsecond precision and is the sole ordering key — never id) to RESERVED: charge its fee, event.waitlist_count -= 1, event.reserved_count += 1"
        note: "Waitlist promotion selector; empty waitlist -> no promotion."
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /event-registrations/{id}/cancel"
        actor: Resident
        preconditions:
          - "status == WAITLISTED"
        side_effects:
          - "event.waitlist_count -= 1"
      - from: RESERVED
        to: ATTENDED
        trigger: "POST /event-registrations/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "event.status == PUBLISHED"
        side_effects: []

  - entity: Package
    initial_state: RECEIVED
    terminal_states: [PICKED_UP, RETURNED]
    transitions:
      - from: CREATE
        to: RECEIVED
        trigger: "POST /packages"
        actor: FrontDesk
        preconditions: []
        side_effects:
          - "access_code minted; received_at = clock.now"
      - from: RECEIVED
        to: NOTIFIED
        trigger: "POST /packages/{id}/notify"
        actor: FrontDesk
        preconditions:
          - "status == RECEIVED"
        side_effects: []
      - from: NOTIFIED
        to: PICKED_UP
        trigger: "POST /packages/{id}/pickup"
        actor: Resident
        preconditions:
          - "body.access_code == access_code"
        side_effects:
          - "picked_up_at = clock.now"
      - from: NOTIFIED
        to: RETURNED
        trigger: "POST /packages/{id}/return"
        actor: FrontDesk
        preconditions:
          - "clock.now >= received_at + PACKAGE_HOLD_DAYS days"
        side_effects: []

  - entity: GuestPass
    initial_state: ISSUED
    terminal_states: [DEPARTED, EXPIRED, CANCELLED]
    transitions:
      - from: CREATE
        to: ISSUED
        trigger: "POST /guest-passes"
        actor: Resident
        preconditions:
          - "resident.account_status != SUSPENDED"
          - "arrival_at < expected_departure_at and span <= property.guest_window_hours"
          - "concurrent active guest passes over the window stay within property.guest_parking_capacity (see validations priority 10)"
        side_effects:
          - "pass_code minted"
      - from: ISSUED
        to: CHECKED_IN
        trigger: "POST /guest-passes/{id}/check-in"
        actor: FrontDesk
        preconditions:
          - "clock.now in [arrival_at, expected_departure_at)"
        side_effects: []
      - from: CHECKED_IN
        to: DEPARTED
        trigger: "POST /guest-passes/{id}/check-out"
        actor: FrontDesk
        preconditions:
          - "status == CHECKED_IN"
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /guest-passes/{id}/check-in when clock.now >= expected_departure_at (system rejects check-in and marks EXPIRED)"
        actor: FrontDesk
        preconditions:
          - "clock.now >= expected_departure_at"
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /guest-passes/{id}/cancel"
        actor: Resident
        preconditions:
          - "status == ISSUED"
        side_effects: []

  - entity: Survey
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /surveys/{id}/open"
        actor: PropertyManager
        preconditions:
          - "status == DRAFT"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /surveys/{id}/close"
        actor: PropertyManager
        preconditions:
          - "status == OPEN"
        side_effects: []

# ===========================================================================
# 1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: booking-create-stale-amenity
    parent_entity: Amenity
    write_endpoint: "POST /amenity-bookings"
    occ_field: "expected_amenity_version"
    description: |
      Creating an AmenityBooking against an Amenity whose version has advanced
      since the client last observed it is rejected. Each successful booking
      creation bumps Amenity.version; a creation carrying a version older than
      the amenity's current version reflects a stale view of the amenity's
      schedule/configuration and is refused. The second sequential creation
      that still carries the pre-bump version fails deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: booking_charge
    trigger: "AmenityBooking creation (provisional) and check-out (final)"
    algorithm: tiered_pricing
    formula: |
      # window = [start, end) for provisional; [checked_in_at, checked_out_at) for final
      duration_hours   = (window_end - window_start) / 3600
      peak_hours       = overlap_hours(window, [amenity.peak_start_minute, amenity.peak_end_minute])
      offpeak_hours    = duration_hours - peak_hours
      gross_cents      = round_half_up(amenity.base_rate_cents_per_hour *
                                       (offpeak_hours + peak_hours * amenity.peak_multiplier))
      tier_discount    = PREMIUM_TIER_DISCOUNT_PCT if resident.membership_tier == PREMIUM else 0.0
      discounted_cents = round_half_up(gross_cents * (1 - tier_discount))
      fee_cents        = min(discounted_cents, DAILY_FEE_CAP_CENTS)
    input_set: "single booking; peak overlap computed against the amenity's peak window (minutes from 00:00 UTC)"
    constants:
      PREMIUM_TIER_DISCOUNT_PCT: 0.20
      DAILY_FEE_CAP_CENTS: 20000
    precision: "whole cents, round_half_up; gross rounded before discount, discounted rounded before cap"
    variants:
      - name: provisional
        when: "at creation"
        difference: "uses requested [start_at, end_at); stored as provisional_fee_cents; NOT charged to rent_balance (deposit is held instead)"
      - name: final
        when: "at check-out"
        difference: "uses actual [checked_in_at, checked_out_at); stored as final_fee_cents; charged to rent_balance_cents and deposit hold released"

  - name: service_invoice
    trigger: "ServiceRequest assignment (estimate) and completion (actual)"
    algorithm: aggregation
    formula: |
      # ESTIMATE (variant=estimate), at assign:
      estimated_cost_cents = round_half_up(vendor.hourly_rate_cents * estimated_hours)
                             + estimated_parts_cents
      # ACTUAL (variant=actual), at complete:
      labor_line   = round_half_up(vendor.hourly_rate_cents * labor_hours)
      part_lines   = [ round_half_up(part.cents * (1 + MATERIAL_TAX_PCT)) for part in parts ]
      subtotal     = labor_line + sum(part_lines)          # round EACH line, THEN sum
      trip_fee     = EMERGENCY_TRIP_FEE_CENTS if priority == EMERGENCY else 0
      final_invoice_cents = subtotal + trip_fee
    input_set: "labor line + one taxed line per part; rounding applied per line before summation (never sum-then-round)"
    constants:
      MATERIAL_TAX_PCT: 0.07
      EMERGENCY_TRIP_FEE_CENTS: 7500
    precision: "whole cents, round_half_up; per-line rounding order is authoritative"
    variants:
      - name: estimate
        when: "at assignment"
        difference: "uses estimated_hours + estimated_parts_cents (parts untaxed lump); stored as estimated_cost_cents"
      - name: actual
        when: "at completion"
        difference: "uses labor_hours + itemized parts each taxed at MATERIAL_TAX_PCT + emergency trip fee; stored as final_invoice_cents"

  - name: late_cancel_penalty
    trigger: "AmenityBooking cancel from CONFIRMED"
    algorithm: threshold
    formula: |
      hours_before_start = (start_at - clock.now) / 3600
      if hours_before_start >= LATE_CANCEL_WINDOW_HOURS:
          penalty_cents = 0                                   # full deposit released, no charge
      else:
          penalty_cents = round_half_up(deposit_hold_cents * LATE_CANCEL_FORFEIT_PCT)
    input_set: "single booking; boundary is inclusive at exactly LATE_CANCEL_WINDOW_HOURS (>= => no penalty)"
    constants:
      LATE_CANCEL_WINDOW_HOURS: 24
      LATE_CANCEL_FORFEIT_PCT: 0.50
    precision: "whole cents, round_half_up"

  - name: event_capacity_allocation
    trigger: "POST /events/{id}/register"
    algorithm: threshold
    formula: |
      if event.reserved_count < event.capacity:      # strict <
          -> RESERVED, fee_charged_cents = event.fee_cents
      else:
          -> WAITLISTED, fee_charged_cents = 0
    input_set: "current reserved_count vs capacity at registration time"
    constants: {}
    precision: "integer counts; boundary strict (reserved_count == capacity => WAITLISTED)"

  - name: account_status_evaluation
    trigger: "after any change to resident.rent_balance_cents (rent-charge, payment, booking fee/penalty/forfeit, event fee, service charge)"
    algorithm: threshold
    formula: |
      if rent_balance_cents > SUSPENSION_THRESHOLD_CENTS:      -> SUSPENDED
      elif rent_balance_cents > DELINQUENCY_THRESHOLD_CENTS:   -> DELINQUENT
      else:                                                    -> GOOD_STANDING
    input_set: "single resident's net owed balance"
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 50000
      SUSPENSION_THRESHOLD_CENTS: 150000
    precision: "integer cents; strict > at both thresholds"

  - name: payment_allocation
    trigger: "POST /payments"
    algorithm: waterfall_allocation
    formula: |
      # A payment first consumes any existing wallet? No: payment ADDS funds.
      remaining = amount_cents
      # 1) reduce rent_balance_cents by up to remaining
      applied_to_rent = min(remaining, rent_balance_cents)
      rent_balance_cents -= applied_to_rent
      remaining          -= applied_to_rent
      # 2) any leftover becomes prepaid wallet credit
      wallet_credit_cents += remaining
      # LedgerEntry PAYMENT (-amount_cents) recorded; then recompute account_status
    input_set: "single resident; rent bucket filled before wallet overflow; deterministic, no ordering ambiguity"
    constants: {}
    precision: "whole cents; rent bucket never goes below 0"

  - name: retention_score
    trigger: "GET /residents/{id}/retention and GET /properties/{id}/report (recomputed on read)"
    algorithm: weighted_scoring
    formula: |
      responses      = SurveyResponse rows for this resident (all surveys)
      avg_score      = mean(satisfaction_score over responses) if responses else 3.0
      satisfaction   = round_half_up((avg_score / 5.0) * SATISFACTION_WEIGHT)
      engagement     = min(completed_bookings_within(RETENTION_WINDOW_DAYS) * ENGAGEMENT_PER_BOOKING,
                           ENGAGEMENT_CAP)
      open_sr_pen    = min(count(service_requests in {SUBMITTED,TRIAGED,ASSIGNED,IN_PROGRESS}) * OPEN_SR_PENALTY_PER,
                           OPEN_SR_PENALTY_CAP)
      no_show_pen    = resident.no_show_strikes * NO_SHOW_PENALTY_PER
      retention_score = clamp(BASE + engagement + satisfaction - open_sr_pen - no_show_pen, 0, 100)
    input_set: "completed bookings whose checked_out_at is within RETENTION_WINDOW_DAYS of clock.now; open service requests by status; all survey responses"
    constants:
      BASE: 50
      SATISFACTION_WEIGHT: 20
      ENGAGEMENT_PER_BOOKING: 3
      ENGAGEMENT_CAP: 30
      OPEN_SR_PENALTY_PER: 5
      OPEN_SR_PENALTY_CAP: 30
      NO_SHOW_PENALTY_PER: 10
      RETENTION_WINDOW_DAYS: 90
    precision: "integer 0..100, round_half_up on the satisfaction term"

  - name: ledger_balance_reconciliation
    trigger: "invariant maintained on every LedgerEntry write"
    algorithm: aggregation
    formula: |
      # Conserved money quantity (net owed):
      rent_balance_cents == max(0, sum(LedgerEntry.amount_cents for resident
                                       where entry_type in {RENT_CHARGE, BOOKING_FEE, DEPOSIT_FORFEIT,
                                                            EVENT_FEE, SERVICE_CHARGE, PENALTY, PAYMENT}))
      # REFUND entries credit wallet_credit_cents, not rent_balance_cents.
      # A forward charge (+X) paired with its compensating reversal (-X) leaves rent_balance_cents unchanged.
    input_set: "all owed-affecting LedgerEntry rows for a resident, ordered by created_at ASC"
    constants: {}
    precision: "whole cents; sum is exact"

  - name: amenity_slot_occupancy
    trigger: "invariant maintained on every booking confirm/cancel/suspend/checkout"
    algorithm: aggregation
    formula: |
      # Conserved capacity/count quantity:
      for any instant t:
        occupancy(amenity, t) = count(AmenityBooking where amenity_id == amenity.id
                                      and status in {CONFIRMED, CHECKED_IN}
                                      and start_at <= t < end_at)
        occupancy(amenity, t) <= amenity.capacity
      # A confirm (place) paired with its compensating cancel (release) leaves
      # occupancy(amenity, t) unchanged for every t.
    input_set: "bookings on one amenity intersecting instant t; buffer_minutes expands each occupied interval for overlap tests"
    constants: {}
    precision: "integer counts; half-open [start, end) intervals"

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted to call this endpoint (see §1.7)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body has all required fields, correct types, enum members valid, numeric ranges honored; for bookings start_at < end_at; for guest passes arrival_at < expected_departure_at; satisfaction_score in 1..5; amounts > 0 where required"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all writes"
  - priority: 4
    category: existence
    check: "every path id and body FK resolves to an existing resource, validated left-to-right"
    error_id: ERR_RESIDENT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id (entity-specific ERR_*_NOT_FOUND chosen per resource)"
  - priority: 5
    category: business_referential
    check: "entity_backed Resident/Vendor acting on a resource must own it (X-User-ID == resource.resident_id / vendor_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "resident-owned and vendor-owned mutations"
  - priority: 6
    category: business_constraint
    check: "invoice approver X-User-ID must differ from triaged_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /service-requests/{id}/approve-invoice"
  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_referential
    check: "referential compatibility: vendor.trades contains service request trade; event.amenity_id (if set) belongs to event.property_id; package access_code matches"
    error_id: ERR_VENDOR_TRADE_MISMATCH
    http_status: 422
    applies_to: "POST /service-requests/{id}/assign (also ERR_PROPERTY_MISMATCH on events, ERR_ACCESS_CODE_MISMATCH on pickup)"
  - priority: 9
    category: business_safety
    check: "resident account posture gate: bookings require GOOD_STANDING; guest passes require account_status != SUSPENDED"
    error_id: ERR_ACCOUNT_DELINQUENT
    http_status: 403
    applies_to: "POST /amenity-bookings (ERR_ACCOUNT_DELINQUENT when DELINQUENT/SUSPENDED), POST /guest-passes (ERR_ACCOUNT_SUSPENDED when SUSPENDED)"
  - priority: 10
    category: business_temporal
    check: "temporal window rules: booking inside amenity operating hours; adding the booking must not push buffer-expanded single-instant occupancy above amenity.capacity; guest concurrency within property.guest_parking_capacity"
    error_id: ERR_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /amenity-bookings (ERR_OUTSIDE_OPERATING_HOURS for hours, ERR_BOOKING_OVERLAP for capacity/buffer conflict), POST /guest-passes (ERR_GUEST_CAPACITY_EXCEEDED)"
  - priority: 11
    category: business_constraint
    check: "non-temporal quota gate: vendor.active_job_count < vendor.active_job_limit"
    error_id: ERR_VENDOR_AT_CAPACITY
    http_status: 409
    applies_to: "POST /service-requests/{id}/assign"
  - priority: 12
    category: business_fiscal
    check: "OCC: expected_amenity_version equals amenity.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /amenity-bookings"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Properties ----
  - method: POST
    path: "/properties"
    description: "Create a property."
    roles: [PropertyManager]
    code: 201
    input: [name, address, "timezone?", guest_parking_capacity, "guest_window_hours?"]
    output: Property
    side_effects: []
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property."
    roles: [PropertyManager, Resident, FrontDesk]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties"
    description: "List properties."
    roles: [PropertyManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: GET
    path: "/properties/{id}/report"
    description: "Property reporting summary (computed)."
    roles: [PropertyManager]
    code: 200
    input: []
    output: "{ unit_count: integer, resident_count: integer, active_bookings: integer, open_service_requests: integer, avg_retention_score: integer }"
    side_effects: ["recompute retention_score per resident"]

  # ---- Units ----
  - method: POST
    path: "/units"
    description: "Create a unit under a property."
    roles: [PropertyManager]
    code: 201
    input: [property_id, unit_number, bedrooms]
    output: Unit
    side_effects: []
  - method: GET
    path: "/units/{id}"
    description: "Fetch a unit."
    roles: [PropertyManager, Resident]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: GET
    path: "/units"
    description: "List/filter units (reverse-reachability for Unit.property_id)."
    roles: [PropertyManager]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  # ---- Residents ----
  - method: POST
    path: "/residents"
    description: "Create a resident on a unit."
    roles: [PropertyManager]
    code: 201
    input: [unit_id, full_name, email, "membership_tier?"]
    output: Resident
    side_effects: ["set unit.occupancy_status = OCCUPIED"]
  - method: GET
    path: "/residents/{id}"
    description: "Fetch a resident."
    roles: [PropertyManager, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []
  - method: GET
    path: "/residents"
    description: "List/filter residents (reverse-reachability for Resident.unit_id)."
    roles: [PropertyManager]
    code: 200
    input: ["unit_id?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []
  - method: GET
    path: "/residents/{id}/ledger"
    description: "List a resident's ledger entries (reverse-reachability for LedgerEntry.resident_id)."
    roles: [PropertyManager, Resident]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/residents/{id}/retention"
    description: "Computed retention score for a resident."
    roles: [PropertyManager]
    code: 200
    input: []
    output: "{ retention_score: integer, avg_satisfaction: number, completed_bookings_90d: integer, open_service_requests: integer }"
    side_effects: ["recompute resident.retention_score"]
  - method: POST
    path: "/residents/{id}/rent-charges"
    description: "Post a rent (or misc) charge to a resident; recomputes posture."
    roles: [PropertyManager]
    code: 201
    input: [amount_cents, "description?"]
    output: Resident
    side_effects:
      - "resident.rent_balance_cents += amount_cents; LedgerEntry RENT_CHARGE (+amount_cents)"
      - "recompute resident.account_status (may cascade booking suspension)"

  # ---- Payments ----
  - method: POST
    path: "/payments"
    description: "Record a payment for a resident (waterfall allocation)."
    roles: [PropertyManager]
    code: 201
    input: [resident_id, amount_cents, method]
    output: Resident
    side_effects:
      - "calculations.payment_allocation; LedgerEntry PAYMENT (-amount_cents)"
      - "recompute resident.account_status (may cascade booking re-confirmation)"

  # ---- Amenities ----
  - method: POST
    path: "/amenities"
    description: "Create a bookable amenity."
    roles: [PropertyManager]
    code: 201
    input: [property_id, name, amenity_type, capacity, base_rate_cents_per_hour, "deposit_cents?", "buffer_minutes?", open_minute, close_minute, "peak_start_minute?", "peak_end_minute?", "peak_multiplier?", "status?"]
    output: Amenity
    side_effects: []
  - method: GET
    path: "/amenities/{id}"
    description: "Fetch an amenity."
    roles: [PropertyManager, Resident, FrontDesk]
    code: 200
    input: []
    output: Amenity
    side_effects: []
  - method: GET
    path: "/amenities"
    description: "List/filter amenities (reverse-reachability for Amenity.property_id)."
    roles: [PropertyManager, Resident]
    code: 200
    input: ["property_id?", "amenity_type?", "limit?", "offset?"]
    output: Amenity[]
    side_effects: []

  # ---- Amenity Bookings ----
  - method: POST
    path: "/amenity-bookings"
    description: "Create (and auto-confirm) an amenity booking. OCC on amenity.version."
    roles: [Resident, PropertyManager]
    code: 201
    input: [amenity_id, resident_id, start_at, end_at, expected_amenity_version]
    output: AmenityBooking
    side_effects:
      - "validations priority 7-12; compute provisional_fee_cents; place deposit hold"
      - "increments Amenity.version by 1"
  - method: GET
    path: "/amenity-bookings/{id}"
    description: "Fetch a booking."
    roles: [PropertyManager, Resident, FrontDesk]
    code: 200
    input: []
    output: AmenityBooking
    side_effects: []
  - method: GET
    path: "/amenity-bookings"
    description: "List/filter bookings (reverse-reachability for amenity_id and resident_id)."
    roles: [PropertyManager, Resident, FrontDesk]
    code: 200
    input: ["amenity_id?", "resident_id?", "status?", "limit?", "offset?"]
    output: AmenityBooking[]
    side_effects: []
  - method: POST
    path: "/amenity-bookings/{id}/check-in"
    description: "Check a resident in to their booking."
    roles: [FrontDesk]
    code: 200
    input: []
    output: AmenityBooking
    side_effects: ["checked_in_at = clock.now"]
  - method: POST
    path: "/amenity-bookings/{id}/check-out"
    description: "Check out; settle final fee, release deposit."
    roles: [FrontDesk]
    code: 200
    input: []
    output: AmenityBooking
    side_effects: ["compute final_fee_cents; charge rent_balance; release hold; recompute posture"]
  - method: POST
    path: "/amenity-bookings/{id}/cancel"
    description: "Cancel a booking; apply late-cancel penalty if within window."
    roles: [Resident, PropertyManager]
    code: 200
    input: []
    output: AmenityBooking
    side_effects: ["late_cancel_penalty; release hold; recompute posture"]
  - method: POST
    path: "/amenity-bookings/{id}/mark-no-show"
    description: "Mark a past-window unattended booking NO_SHOW; forfeit deposit."
    roles: [FrontDesk, PropertyManager]
    code: 200
    input: []
    output: AmenityBooking
    side_effects: ["forfeit deposit; strike++; recompute posture"]

  # ---- Community Events ----
  - method: POST
    path: "/events"
    description: "Create a community event (DRAFT)."
    roles: [PropertyManager]
    code: 201
    input: [property_id, "amenity_id?", title, start_at, end_at, capacity, "fee_cents?"]
    output: CommunityEvent
    side_effects: []
  - method: GET
    path: "/events/{id}"
    description: "Fetch an event."
    roles: [PropertyManager, Resident]
    code: 200
    input: []
    output: CommunityEvent
    side_effects: []
  - method: GET
    path: "/events"
    description: "List/filter events (reverse-reachability for property_id and amenity_id)."
    roles: [PropertyManager, Resident]
    code: 200
    input: ["property_id?", "amenity_id?", "status?", "limit?", "offset?"]
    output: CommunityEvent[]
    side_effects: []
  - method: POST
    path: "/events/{id}/publish"
    description: "Publish an event."
    roles: [PropertyManager]
    code: 200
    input: []
    output: CommunityEvent
    side_effects: []
  - method: POST
    path: "/events/{id}/cancel"
    description: "Cancel a published event; cascade-cancel registrations and refund fees."
    roles: [PropertyManager]
    code: 200
    input: []
    output: CommunityEvent
    side_effects: ["cascade B: cancel registrations, refund fee_charged_cents to wallet"]
  - method: POST
    path: "/events/{id}/complete"
    description: "Complete an event past its end; no-show unchecked-in reservations."
    roles: [PropertyManager]
    code: 200
    input: []
    output: CommunityEvent
    side_effects: ["RESERVED not checked-in -> NO_SHOW"]
  - method: POST
    path: "/events/{id}/register"
    description: "Resident registers; RESERVED or WAITLISTED by capacity."
    roles: [Resident]
    code: 201
    input: [resident_id]
    output: EventRegistration
    side_effects: ["event_capacity_allocation; charge fee if RESERVED; counters update; recompute posture"]

  # ---- Event Registrations ----
  - method: GET
    path: "/event-registrations/{id}"
    description: "Fetch a registration."
    roles: [PropertyManager, Resident]
    code: 200
    input: []
    output: EventRegistration
    side_effects: []
  - method: GET
    path: "/event-registrations"
    description: "List/filter registrations (reverse-reachability for event_id and resident_id)."
    roles: [PropertyManager, Resident]
    code: 200
    input: ["event_id?", "resident_id?", "status?", "limit?", "offset?"]
    output: EventRegistration[]
    side_effects: []
  - method: POST
    path: "/event-registrations/{id}/cancel"
    description: "Cancel a registration; promote earliest waitlisted."
    roles: [Resident, PropertyManager]
    code: 200
    input: []
    output: EventRegistration
    side_effects: ["refund fee if RESERVED; promote earliest WAITLISTED by created_at ASC"]
  - method: POST
    path: "/event-registrations/{id}/check-in"
    description: "Check a resident in at the event."
    roles: [FrontDesk]
    code: 200
    input: []
    output: EventRegistration
    side_effects: []

  # ---- Vendors ----
  - method: POST
    path: "/vendors"
    description: "Create a service vendor."
    roles: [PropertyManager]
    code: 201
    input: [name, trades, hourly_rate_cents, "active_job_limit?"]
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors/{id}"
    description: "Fetch a vendor."
    roles: [PropertyManager, Vendor]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: GET
    path: "/vendors"
    description: "List/filter vendors."
    roles: [PropertyManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []
  - method: POST
    path: "/vendors/{id}/suspend"
    description: "Suspend a vendor (blocks new assignments)."
    roles: [PropertyManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["vendor.status = SUSPENDED"]

  # ---- Service Requests ----
  - method: POST
    path: "/service-requests"
    description: "Resident submits a maintenance request."
    roles: [Resident, PropertyManager]
    code: 201
    input: [unit_id, resident_id, trade, "priority?", description]
    output: ServiceRequest
    side_effects: []
  - method: GET
    path: "/service-requests/{id}"
    description: "Fetch a service request."
    roles: [PropertyManager, Resident, Vendor]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []
  - method: GET
    path: "/service-requests"
    description: "List/filter service requests (reverse-reachability for unit_id, resident_id, vendor_id)."
    roles: [PropertyManager, Resident, Vendor]
    code: 200
    input: ["unit_id?", "resident_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []
  - method: POST
    path: "/service-requests/{id}/triage"
    description: "PropertyManager triages a request."
    roles: [PropertyManager]
    code: 200
    input: ["trade?", "priority?"]
    output: ServiceRequest
    side_effects: ["triaged_by_user_id = X-User-ID"]
  - method: POST
    path: "/service-requests/{id}/assign"
    description: "Assign a vendor; compute estimate."
    roles: [PropertyManager]
    code: 200
    input: [vendor_id, estimated_hours, "estimated_parts_cents?"]
    output: ServiceRequest
    side_effects: ["service_invoice estimate; vendor.active_job_count += 1"]
  - method: POST
    path: "/service-requests/{id}/unassign"
    description: "Unassign vendor; revert to TRIAGED."
    roles: [PropertyManager]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["vendor.active_job_count -= 1; clear vendor_id/estimate"]
  - method: POST
    path: "/service-requests/{id}/start"
    description: "Assigned vendor starts work."
    roles: [Vendor]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []
  - method: POST
    path: "/service-requests/{id}/complete"
    description: "Vendor completes with invoice line items."
    roles: [Vendor]
    code: 200
    input: [labor_hours, "parts?"]
    output: ServiceRequest
    side_effects: ["service_invoice actual; vendor.active_job_count -= 1"]
  - method: POST
    path: "/service-requests/{id}/approve-invoice"
    description: "PropertyManager (different user) approves invoice; charges resident; CLOSED."
    roles: [PropertyManager]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["SoD check; charge SERVICE_CHARGE to resident; recompute posture"]
  - method: POST
    path: "/service-requests/{id}/cancel"
    description: "Cancel a non-terminal request."
    roles: [Resident, PropertyManager]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["release vendor job count if assigned"]

  # ---- Packages ----
  - method: POST
    path: "/packages"
    description: "FrontDesk logs a received package."
    roles: [FrontDesk]
    code: 201
    input: [resident_id, carrier]
    output: Package
    side_effects: ["mint access_code; received_at = clock.now"]
  - method: GET
    path: "/packages/{id}"
    description: "Fetch a package."
    roles: [PropertyManager, Resident, FrontDesk]
    code: 200
    input: []
    output: Package
    side_effects: []
  - method: GET
    path: "/packages"
    description: "List/filter packages (reverse-reachability for Package.resident_id)."
    roles: [PropertyManager, Resident, FrontDesk]
    code: 200
    input: ["resident_id?", "status?", "limit?", "offset?"]
    output: Package[]
    side_effects: []
  - method: POST
    path: "/packages/{id}/notify"
    description: "Mark package NOTIFIED."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Package
    side_effects: []
  - method: POST
    path: "/packages/{id}/pickup"
    description: "Resident picks up with access code."
    roles: [Resident, FrontDesk]
    code: 200
    input: [access_code]
    output: Package
    side_effects: ["picked_up_at = clock.now"]
  - method: POST
    path: "/packages/{id}/return"
    description: "Return to carrier after hold period."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Package
    side_effects: []

  # ---- Guest Passes ----
  - method: POST
    path: "/guest-passes"
    description: "Resident issues a guest pass; concurrency-checked."
    roles: [Resident]
    code: 201
    input: [resident_id, guest_name, arrival_at, expected_departure_at]
    output: GuestPass
    side_effects: ["mint pass_code"]
  - method: GET
    path: "/guest-passes/{id}"
    description: "Fetch a guest pass."
    roles: [PropertyManager, Resident, FrontDesk]
    code: 200
    input: []
    output: GuestPass
    side_effects: []
  - method: GET
    path: "/guest-passes"
    description: "List/filter guest passes (reverse-reachability for GuestPass.resident_id)."
    roles: [PropertyManager, Resident, FrontDesk]
    code: 200
    input: ["resident_id?", "status?", "limit?", "offset?"]
    output: GuestPass[]
    side_effects: []
  - method: POST
    path: "/guest-passes/{id}/check-in"
    description: "FrontDesk checks a guest in."
    roles: [FrontDesk]
    code: 200
    input: []
    output: GuestPass
    side_effects: []
  - method: POST
    path: "/guest-passes/{id}/check-out"
    description: "FrontDesk checks a guest out."
    roles: [FrontDesk]
    code: 200
    input: []
    output: GuestPass
    side_effects: []
  - method: POST
    path: "/guest-passes/{id}/cancel"
    description: "Resident cancels an issued pass."
    roles: [Resident]
    code: 200
    input: []
    output: GuestPass
    side_effects: []

  # ---- Surveys ----
  - method: POST
    path: "/surveys"
    description: "Create a survey (DRAFT)."
    roles: [PropertyManager]
    code: 201
    input: [property_id, title]
    output: Survey
    side_effects: []
  - method: GET
    path: "/surveys/{id}"
    description: "Fetch a survey."
    roles: [PropertyManager, Resident]
    code: 200
    input: []
    output: Survey
    side_effects: []
  - method: GET
    path: "/surveys"
    description: "List/filter surveys (reverse-reachability for Survey.property_id)."
    roles: [PropertyManager, Resident]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: Survey[]
    side_effects: []
  - method: POST
    path: "/surveys/{id}/open"
    description: "Open a survey for responses."
    roles: [PropertyManager]
    code: 200
    input: []
    output: Survey
    side_effects: []
  - method: POST
    path: "/surveys/{id}/close"
    description: "Close a survey."
    roles: [PropertyManager]
    code: 200
    input: []
    output: Survey
    side_effects: []
  - method: POST
    path: "/surveys/{id}/responses"
    description: "Resident submits a survey response."
    roles: [Resident]
    code: 201
    input: [resident_id, satisfaction_score, "comment?"]
    output: SurveyResponse
    side_effects: ["survey.response_count += 1"]

  # ---- Survey Responses ----
  - method: GET
    path: "/survey-responses/{id}"
    description: "Fetch a survey response."
    roles: [PropertyManager]
    code: 200
    input: []
    output: SurveyResponse
    side_effects: []
  - method: GET
    path: "/survey-responses"
    description: "List/filter survey responses (reverse-reachability for survey_id and resident_id)."
    roles: [PropertyManager]
    code: 200
    input: ["survey_id?", "resident_id?", "limit?", "offset?"]
    output: SurveyResponse[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server default before any call is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [PropertyManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced/set to to_iso8601"]

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid auth headers or unknown role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this endpoint"
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, bad type/enum/range, start>=end, non-positive amount"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property id not found"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "unit id not found"
  - id: ERR_RESIDENT_NOT_FOUND
    http: 404
    condition: "resident id not found"
  - id: ERR_AMENITY_NOT_FOUND
    http: 404
    condition: "amenity id not found"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "amenity booking id not found"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "community event id not found"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "event registration id not found"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "vendor id not found"
  - id: ERR_SERVICE_REQUEST_NOT_FOUND
    http: 404
    condition: "service request id not found"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "package id not found"
  - id: ERR_GUEST_PASS_NOT_FOUND
    http: 404
    condition: "guest pass id not found"
  - id: ERR_SURVEY_NOT_FOUND
    http: 404
    condition: "survey id not found"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the target resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "invoice approver X-User-ID equals triaged_by_user_id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_VENDOR_TRADE_MISMATCH
    http: 422
    condition: "assigned vendor does not service the request's trade"
  - id: ERR_VENDOR_INACTIVE
    http: 409
    condition: "assigned vendor is SUSPENDED"
  - id: ERR_PROPERTY_MISMATCH
    http: 422
    condition: "event.amenity_id belongs to a different property than event.property_id"
  - id: ERR_ACCESS_CODE_MISMATCH
    http: 422
    condition: "package pickup access_code does not match"
  - id: ERR_ACCOUNT_DELINQUENT
    http: 403
    condition: "booking blocked: resident.account_status is DELINQUENT or SUSPENDED"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 403
    condition: "guest pass blocked: resident.account_status is SUSPENDED"
  - id: ERR_OUTSIDE_OPERATING_HOURS
    http: 422
    condition: "booking window falls outside amenity [open_minute, close_minute] or spans days"
  - id: ERR_BOOKING_OVERLAP
    http: 409
    condition: "buffer-expanded single-instant occupancy (including this booking) would exceed amenity.capacity"
  - id: ERR_GUEST_CAPACITY_EXCEEDED
    http: 409
    condition: "concurrent active guest passes would exceed property.guest_parking_capacity"
  - id: ERR_VENDOR_AT_CAPACITY
    http: 409
    condition: "vendor.active_job_count == vendor.active_job_limit"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_amenity_version does not equal amenity.version"
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "resident already has a non-terminal registration for this event"
  - id: ERR_SURVEY_NOT_OPEN
    http: 409
    condition: "response submitted to a survey not in OPEN state"
  - id: ERR_DUPLICATE_SURVEY_RESPONSE
    http: 409
    condition: "resident already responded to this survey"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: PropertyManager
    description: "Operator managing properties, units, residents, amenities, vendors, events, service triage/assignment/approval, billing, surveys, reporting."
    identity: "opaque"
    exclusive_operations:
      - "POST /properties, POST /units, POST /residents, POST /amenities, POST /vendors, POST /vendors/{id}/suspend"
      - "POST /residents/{id}/rent-charges, POST /payments"
      - "POST /events, POST /events/{id}/publish, POST /events/{id}/cancel, POST /events/{id}/complete"
      - "POST /service-requests/{id}/triage, /assign, /unassign, /approve-invoice"
      - "POST /surveys, POST /surveys/{id}/open, POST /surveys/{id}/close"
      - "GET /properties/{id}/report, GET /residents/{id}/retention, GET /survey-responses, GET /survey-responses/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across resources; POST /amenity-bookings, /amenity-bookings/{id}/cancel, /amenity-bookings/{id}/mark-no-show; POST /service-requests, /service-requests/{id}/cancel; POST /event-registrations/{id}/cancel"
  - name: Resident
    description: "A resident acting on their own bookings, registrations, service requests, guest passes, packages, survey responses."
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /events/{id}/register, POST /guest-passes, POST /guest-passes/{id}/cancel, POST /surveys/{id}/responses"
    shared_operations:
      - "POST /amenity-bookings, POST /amenity-bookings/{id}/cancel"
      - "POST /service-requests, POST /service-requests/{id}/cancel"
      - "POST /event-registrations/{id}/cancel, POST /packages/{id}/pickup"
      - "GET own resources (residents/{id}, ledger, bookings, registrations, service-requests, guest-passes, packages, surveys, amenities, events)"
  - name: Vendor
    description: "A service vendor acting on assigned service requests."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /service-requests/{id}/start, POST /service-requests/{id}/complete"
    shared_operations:
      - "GET /service-requests, GET /service-requests/{id}, GET /vendors/{id}"
  - name: FrontDesk
    description: "Front-desk/concierge staff handling packages, amenity/guest/event check-ins and check-outs."
    identity: "opaque"
    exclusive_operations:
      - "POST /packages, POST /packages/{id}/notify, POST /packages/{id}/return"
      - "POST /amenity-bookings/{id}/check-in, POST /amenity-bookings/{id}/check-out"
      - "POST /guest-passes/{id}/check-in, POST /guest-passes/{id}/check-out"
      - "POST /event-registrations/{id}/check-in"
    shared_operations:
      - "POST /amenity-bookings/{id}/mark-no-show, POST /packages/{id}/pickup"
      - "GET reads across amenities, bookings, packages, guest-passes, properties"
