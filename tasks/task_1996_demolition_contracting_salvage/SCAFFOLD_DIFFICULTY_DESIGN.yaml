            - { call: "POST /demolition/structure-surveys/${sv_id}/transition", payload: { action: "COMPLETE", hazmat_found: false, findings_summary: "clean" }, as: Surveyor }
            - { call: "POST /demolition/projects/${p_id}/utility-disconnects", payload: { utility_type: "GAS", provider_name: "City Gas", disconnect_window_start: "2026-08-02T08:00:00Z", disconnect_window_end: "2026-08-02T12:00:00Z" }, as: UtilityCoordinator, captures: { ud_id: $.data.id } }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "REPORT_DISCONNECTED" }, as: UtilityCoordinator, as_user_id: "ca-r-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "VERIFY" }, as: UtilityCoordinator, as_user_id: "ca-v-1" }
            - { call: "POST /demolition/utility-disconnects/${ud_id}/transition", payload: { action: "CONFIRM" }, as: UtilityCoordinator, as_user_id: "ca-c-1" }
            - { call: "POST /demolition/projects/${p_id}/permits", payload: { permit_number: "P-1", gross_floor_area_sqft: 20000 }, as: PermitCoordinator, captures: { pm_id: $.data.id } }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "SUBMIT" }, as: PermitCoordinator }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "APPROVE" }, as: AuthorityReviewer }
            - { call: "POST /demolition/permits/${pm_id}/transition", payload: { action: "ACTIVATE" }, as: PermitCoordinator }
            - { call: "POST /demolition/projects/${p_id}/engineering-surveys", payload: { demolition_method: "HIGH_REACH_ARM", structural_stability_rating: "CONDITIONALLY_STABLE", max_structure_height_ft: 60, adjacent_structure_distance_ft: 25 }, as: StructuralEngineer, as_user_id: "ca-a-1", captures: { es_id: $.data.id } }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "ca-a-1" }
            - { call: "POST /demolition/engineering-surveys/${es_id}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "ca-p-1" }
            - { call: "GET /demolition/projects/${p_id}", as: SiteSupervisor, captures: { p_v: $.data.version } }
            - { call: "POST /demolition/projects/${p_id}/engineering-pin", payload: { engineering_survey_id: "${es_id}", expected_project_version: "${p_v}" }, as: SiteSupervisor }
            - { call: "POST /demolition/projects/${p_id}/neighbor-notifications", payload: { address: "13 Elm St", notice_method: "CERTIFIED_MAIL", scheduled_delivery_date: "2026-08-02" }, as: SiteSupervisor, captures: { nn1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /demolition/neighbor-notifications/${nn1}/transition", payload: { action: "DELIVER" }, as: SiteSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: ContractorAdmin }
