scenario: "947. Piano Tuning, Moving & Restoration: client & instrument profile, tuning-cycle reminder & appointment, service (tune/regulate/voice/rebuild) & quote, specialized move & climate, deposit & milestone, technician & route, warranty, showroom/consignment linkage"
domain_name: piano-tuning-moving-restoration
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer entities linked by explicit foreign keys plus many-to-many-ish
  # associations (Instrument <-> Location <-> Client <-> ConsignmentAgreement,
  # ServiceOrder <-> PartsLot via PartsAllocation). Only three sub-resource
  # URL shapes exist; everything else is flat with FK filters.

  state_machine_shape: parallel
  # Instrument carries condition_status x custody_status; Appointment carries
  # scheduling_status x fulfillment_status. Several machines are cyclic
  # (RouteDay OPEN<->LOCKED, ServiceOrder IN_PROGRESS<->ON_HOLD, Milestone
  # RELEASED->REJECTED->READY, Instrument RESTORED->NEEDS_REGULATION).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential      # Quote.supersedes_quote_id, LedgerEntry.reverses_entry_id
    - polymorphic           # LedgerEntry.entry_type selects which optional FK is populated
    - cross_aggregate       # Warranty spans ServiceOrder + Instrument + Client

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

