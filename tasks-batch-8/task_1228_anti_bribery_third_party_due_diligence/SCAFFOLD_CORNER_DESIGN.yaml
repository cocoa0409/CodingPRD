          err: $.data.error_id
      assert:
      - captured err == ERR_UNAUTHENTICATED (sent with neither X-User-Role nor X-User-ID)
  - name: unauthorized_role_beats_not_found
    claim_type: priority_ordering
    grounds:
    - validations[priority=2]
    - validations[priority=3]
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: A BusinessSponsor calling approve on a non-existent ThirdParty id gets ERR_UNAUTHORIZED_ROLE (priority 2), proving authorization runs before the existence check (priority 3) that
      would yield ERR_NOT_FOUND.
    test_recipe:
