  # =====================================================================
  # RULE 6 — boundary/precision on three different metrics at three
  #          different endpoints
  #   6a: capacity units      @ POST /exercises/{id}/schedule
  #   6b: AGREED-member count @ POST /exercises/{id}/execution-transitions
  #   6c: readiness score     @ POST /exercises/{id}/scope-items
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_exactly_equal_to_usable_is_allowed_one_unit_over_rejects
        grounds:
          - validations.priority_41
          - calculations.site_reserved_capacity_units
          - calculations.exercise_required_capacity_units
          - errors.ERR_SITE_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Metric: integer capacity units at POST /exercises/{id}/schedule. The rule reads
          reserved + required <= usable with equality explicitly allowed, so 0 + 6 <= 6 must pass
          on a site whose usable_capacity_units is exactly 6, while the very next unit (6 + 2 > 6)
          must fail — an off-by-one on the comparison operator flips exactly one of the two calls.
        setup_note: "The two exercises use windows a day apart so neither the half-open overlap rule nor the 240-minute FULL_SITE buffer can be the reason for the rejection."
        test_recipe:
          setup:
            - "The standard people fixture exists at clock 2026-08-01T00:00:00Z."
            - "A recovery site SITE-S has usable_capacity_units exactly 6 and reserved_capacity_units 0."
            - "Recovery group RG-S at SITE-S holds a VALIDATED runbook with one coverless weight-10 step, so its readiness is 100.00 and its posture is READY; it has no member applications, so criticality_component is 0."
            - "Exercise exBig is a FULL_SITE_FAILOVER at SITE-S (required_capacity_units 6, window 2026-08-20T00:00:00Z - 06:00:00Z), scoped and impact-approved."
            - "Exercise exSmall is a COMPONENT_FAILOVER at SITE-S (required_capacity_units 2, window 2026-08-21T00:00:00Z - 04:00:00Z), scoped and impact-approved, well clear of exBig's window and of the FULL_SITE buffer."
          setup_api_calls:
            - *b01
            - *b02
            - *b03
            - *b04
            - *b05
            - *b06
            - call: "POST /sites"
              payload: { name: "Small recovery site", site_code: "SITE-S", role: "RECOVERY", usable_capacity_units: 6 }
              as: PlatformAdmin
              captures: { ss_id: $.data.id }
            - call: "POST /recovery-groups"
              payload: { name: "Small-site group", group_code: "RG-S", recovery_site_id: "${ss_id}", lead_coordinator_id: "${c1_id}", recovery_order: 1 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { gs_id: $.data.id }
            - call: "GET /recovery-groups/${gs_id}"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { gs_v: $.data.version }
            - call: "POST /runbooks"
              payload: { recovery_group_id: "${gs_id}", title: "Small-site runbook", author_id: "${c1_id}", expected_recovery_group_version: "${gs_v}", validity_days: 180 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { rbs_id: $.data.id }
            - call: "POST /runbook-steps"
              payload: { runbook_id: "${rbs_id}", step_number: 1, description: "Bring the small site online", owner_id: "${op1_id}", expected_minutes: 30, weight: 10 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { ss1_id: $.data.id }
            - call: "POST /runbooks/${rbs_id}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /runbook-steps/${ss1_id}/validations"
              payload: {}
              as: ITOperator
              as_user_id: "${op1_id}"
            - call: "POST /runbooks/${rbs_id}/transitions"
              payload: { action: "VALIDATE" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises"
              payload: { name: "Full site at the small site", exercise_type: "FULL_SITE_FAILOVER", recovery_site_id: "${ss_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-20T00:00:00Z", planned_end_at: "2026-08-20T06:00:00Z" }
              as: ResilienceCoordinator
