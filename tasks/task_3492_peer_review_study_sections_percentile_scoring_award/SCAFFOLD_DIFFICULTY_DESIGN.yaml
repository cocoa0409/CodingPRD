  - rule_id: boundary_precision_check
    instances:
      - name: page_limit_exact_boundary
        grounds:
          - validations[priority=10]
          - calculations.impact_score
        distinguishing_aspect: |
          Metric: page count. research_strategy_page_count == limit (12) submits cleanly while
          limit + 1 (13) is rejected with ERR_PAGE_LIMIT_EXCEEDED — an off-by-one in a >= vs >
          comparison flips the outcome. Exercised through the submit endpoint.
        test_recipe:
          setup:
            - "FOA with research_strategy_page_limit 12, OPEN, receipt deadline 2026-12-01 (after the default clock 2026-09-01)"
            - "Two draft applications: pages == 12 and pages == 13"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/funding-opportunities", payload: { pa_number: "PA-26-112", title: "R01 Pages FOA", activity_code: "R01", research_strategy_page_limit: 12, min_direct_cents_per_year: 1000000, max_direct_cents_per_year: 25000000, max_years: 5, open_date: "2026-08-01T00:00:00Z", receipt_deadline: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, captures: { foa_id: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI A", email: "pia@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi_a: $.data.id } }
