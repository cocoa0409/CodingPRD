            - "Violation.${vio}.resolution_reason == 'CURE_ACCEPTED'"
            - "Violation.${vio}.assessed_points == 3"
            - "Reseller.${res}.violation_points_total == 3"
            - "EnforcementNotice.${not1}.status == SATISFIED"

      - name: temporal_check_precedes_domain_constraint_rejected
        claim_type: priority_ordering
        grounds: ["validations[priority=11]", "validations[priority=12]"]
        distinguishing_aspect: "An observation that is both stale (2026-07-01) and on a channel outside Acme's permitted set returns ERR_OBSERVATION_STALE, placing priority 11 ahead of priority 12."
        test_recipe:
          setup: ["Acme AUTHORIZED with permitted_channels [MARKETPLACE, OWN_WEBSITE]; clock 2026-08-20; the sighting is on RETAILER_SITE and dated 2026-07-01."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "RETAILER_SITE", seller_display_name: "Acme Store", listing_url: "https://ret.example/l/1", listed_price_cents: 12000, observed_at: "2026-07-01T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", matched_reseller_id: "${res}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_OBSERVATION_STALE'"
            - "GET /price-observations returns 0 rows"

      # --- priority 12: domain constraints ----------------------------------
      - name: duplicate_sku_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "sku uniqueness is global across all Product rows, so a second SKU-AUDIO-1 is ERR_DUPLICATE_SKU even with a different name and msrp."
        test_recipe:
          setup: ["Product SKU-AUDIO-1 already exists under PUBLISHED policy MAP-2026-A."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-AUDIO-1", name: "Studio Headphones Mk II", msrp_cents: 25000, standard_map_floor_cents: 19000, governing_policy_id: "${pol}" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_DUPLICATE_SKU'"
            - "GET /products returns 1 row"

      - name: duplicate_serial_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "serial_number uniqueness is likewise global: re-registering SN-0001 under a different lot is ERR_DUPLICATE_SERIAL, keeping the trace map single-valued."
        test_recipe:
          setup: ["SerialUnit SN-0001 already registered in LOT-A against Northwind."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
          trigger:
            - call: "POST /serial-units"
              payload: { serial_number: "SN-0001", product_id: "${prod}", lot_code: "LOT-B", shipped_distributor_id: "${dist}" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_DUPLICATE_SERIAL'"
            - "GET /serial-units returns 1 row"

      - name: matched_observation_on_a_channel_outside_the_agreement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "The permitted-channel check binds only MATCHED observations: RETAILER_SITE is outside Acme's [MARKETPLACE, OWN_WEBSITE] grant, so attributing the listing to Acme is ERR_CHANNEL_NOT_PERMITTED."
        test_recipe:
          setup: ["Acme AUTHORIZED with permitted_channels [MARKETPLACE, OWN_WEBSITE]; clock 2026-08-20; a fresh RETAILER_SITE sighting attributed to Acme."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
          trigger:
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "RETAILER_SITE", seller_display_name: "Acme Store", listing_url: "https://ret.example/l/2", listed_price_cents: 12000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", matched_reseller_id: "${res}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_CHANNEL_NOT_PERMITTED'"
            - "ResellerAgreement.${agr}.permitted_channels == ['MARKETPLACE', 'OWN_WEBSITE']"
            - "GET /price-observations returns 0 rows"

      - name: agreement_omitting_the_primary_channel_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "permitted_channels must CONTAIN the reseller's primary_channel: Acme applied as MARKETPLACE, so a grant of [OWN_WEBSITE] alone is ERR_CHANNEL_NOT_PERMITTED at agreement creation."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; reseller Acme in APPLIED / HOLD with primary_channel MARKETPLACE."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *RESACME
          trigger:
            - call: "POST /reseller-agreements"
              payload: { reseller_id: "${res}", policy_id: "${pol}", permitted_channels: ["OWN_WEBSITE"], quality_obligations: ["AUTHENTICITY_LABELING"], term_ends_at: "2027-06-30T00:00:00Z" }
              as: BrandChannelManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_CHANNEL_NOT_PERMITTED'"
            - "Reseller.${res}.primary_channel == MARKETPLACE"
            - "GET /reseller-agreements returns 0 rows"

      - name: requesting_termination_on_the_first_notice_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "The requested rung must equal the computed rung: asking for TERMINATION when the ladder computes WARNING is ERR_LADDER_RUNG_MISMATCH, so the caller cannot skip rungs by asserting one."
        test_recipe:
          setup: ["Violation V1 DETECTED at 3 points against a clean Acme; the computed rung is WARNING."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio}", delivery_channel: "CERTIFIED_MAIL", rung: "TERMINATION", expected_reseller_version: "${rv}" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_LADDER_RUNG_MISMATCH'"
            - "Violation.${vio}.status == DETECTED"
            - "Reseller.${res}.authorization_status == AUTHORIZED"

      - name: third_dispute_round_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "dispute_rounds must stay below 2: after two REJECTed rounds the counter reads 2 and a third dispute is ERR_DISPUTE_ROUNDS_EXHAUSTED, while the cure deadline retains both 5-day extensions."
        test_recipe:
          setup: ["Violation V1 NOTICED with dispute_rounds 2 after two disputes that were both REJECTed; the cure deadline has been pushed from 2026-08-30 to 2026-09-09."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *DISPUTE1
            - *DISPUTEREJECT
            - &DISPUTE1B
              call: "POST /violations/${vio}/dispute"
              payload: { dispute_reason: "Second look at the storefront attribution" }
              as: Reseller
              as_user_id: "${res}"
            - &DISPUTEREJECT1B
              call: "POST /violations/${vio}/dispute-decision"
              payload: { decision: "REJECT", decision_reason: "Attribution re-confirmed" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
          trigger:
            - call: "POST /violations/${vio}/dispute"
              payload: { dispute_reason: "Third attempt" }
              as: Reseller
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == 'ERR_DISPUTE_ROUNDS_EXHAUSTED'"
            - "Violation.${vio}.dispute_rounds == 2"
            - "Violation.${vio}.status == NOTICED"
            - "Violation.${vio}.cure_deadline_at == '2026-09-09T00:00:00Z'"

      - name: termination_notice_issued_by_a_channel_manager_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "BrandChannelManager is a legal role on POST /enforcement-notices, so the rejection is the priority 12 code ERR_TERMINATION_REQUIRES_COUNSEL rather than the priority 2 ERR_ROLE_NOT_PERMITTED."
        test_recipe:
          setup: ["Acme is SUSPENDED at 14 points behind a WARNING and a SUSPENSION notice; violation V3 DETECTED at 5 points, so the computed rung is TERMINATION."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
            - *OBS14000C
            - *OBSEVAL3
            - *GETRESV3
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio3}", delivery_channel: "CERTIFIED_MAIL", rung: "TERMINATION", expected_reseller_version: "${rv3}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == 'ERR_TERMINATION_REQUIRES_COUNSEL'"
            - "Reseller.${res}.authorization_status == SUSPENDED"
            - "Violation.${vio3}.status == DETECTED"

      - name: termination_signed_by_the_suspension_issuer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "Segregation of duties is per-USER, not per-role: counsel-1 legitimately issued the SUSPENSION, so the same counsel-1 signing the TERMINATION is ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["The SUSPENSION notice was issued by BrandLegalCounsel counsel-1; violation V3 is DETECTED at 5 points with the computed rung TERMINATION."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - &NOTICE2SUSPC1
              call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio2}", delivery_channel: "EMAIL", rung: "SUSPENSION", suspension_starts_at: "2026-09-01T00:00:00Z", suspension_ends_at: "2026-09-10T00:00:00Z", expected_reseller_version: "${rv2}" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { not2c: $.data.id }
            - *OBS14000C
            - *OBSEVAL3
            - *GETRESV3
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio3}", delivery_channel: "CERTIFIED_MAIL", rung: "TERMINATION", expected_reseller_version: "${rv3}" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == 'ERR_SEGREGATION_OF_DUTIES'"
            - "EnforcementNotice.${not2c}.issued_by_user_id == 'counsel-1'"
            - "Reseller.${res}.authorization_status == SUSPENDED"

      - name: termination_signed_by_a_second_counsel_is_accepted
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "The identical request from counsel-2 satisfies both the counsel requirement and segregation of duties, so the TERMINATION lands and cascades the reseller to TERMINATED / CUT_OFF."
        test_recipe:
          setup: ["The SUSPENSION notice was issued by counsel-1; violation V3 is DETECTED at 5 points with the computed rung TERMINATION."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSPC1
            - *OBS14000C
            - *OBSEVAL3
            - *GETRESV3
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio3}", delivery_channel: "CERTIFIED_MAIL", rung: "TERMINATION", expected_reseller_version: "${rv3}" }
              as: BrandLegalCounsel
              as_user_id: "counsel-2"
              captures: { notT: $.data.id }
          assert:
            - "HTTP 201"
            - "EnforcementNotice.${notT}.rung == TERMINATION"
            - "EnforcementNotice.${notT}.issued_by_user_id == 'counsel-2'"
            - "Reseller.${res}.authorization_status == TERMINATED"
            - "Reseller.${res}.supply_status == CUT_OFF"
            - "ResellerAgreement.${agr}.status == TERMINATED"

      - name: notice_after_the_floor_drops_below_the_listing_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "FINAL_AT_NOTICE points must exceed zero: lowering standard_map_floor_cents to 14000 after detection makes the 14000 listing compliant at issuance, so the notice is ERR_NO_BREACH_AT_FINAL_FLOOR while provisional_points stays 3."
        test_recipe:
          setup: ["Violation V1 DETECTED at provisional 3 points from a 14000 MARKETPLACE listing; the product's standard_map_floor_cents is then patched down to 14000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - &PATCHFLOOR
              call: "PATCH /products/${prod}"
              payload: { standard_map_floor_cents: 14000 }
              as: BrandChannelManager
              captures: { newfloor: $.data.standard_map_floor_cents }
            - *GETRESV
          trigger:
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${res}", violation_id: "${vio}", delivery_channel: "EMAIL", expected_reseller_version: "${rv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_NO_BREACH_AT_FINAL_FLOOR'"
            - "${newfloor} == 14000"
            - "Violation.${vio}.provisional_points == 3"
            - "Violation.${vio}.assessed_points == null"
            - "Violation.${vio}.status == DETECTED"
            - "Reseller.${res}.violation_points_total == 0"

      - name: exception_approval_with_an_out_of_range_override_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        distinguishing_aspect: "The override band is half-open at the top as well: a requested floor equal to the standard 15000 is ERR_OVERRIDE_FLOOR_OUT_OF_RANGE, since an exception must actually lower the floor."
        test_recipe:
          setup: ["Product SKU-AUDIO-1 with standard_map_floor_cents 15000; a REQUESTED PROMOTIONAL_EVENT exception asking for exactly 15000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - call: "POST /pricing-exceptions"
              payload: { product_id: "${prod}", exception_type: "PROMOTIONAL_EVENT", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-25T00:00:00Z", channel_scope: "ALL", requested_override_floor_cents: 15000, dealer_input_source: "BRAND_MARKETING_PLAN" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { exc15: $.data.id }
          trigger:
            - call: "POST /pricing-exceptions/${exc15}/decision"
              payload: { decision: "APPROVE", decision_reason: "No-op floor requested" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_OVERRIDE_FLOOR_OUT_OF_RANGE'"
            - "PricingException.${exc15}.status == REQUESTED"
            - "Product.${prod}.open_exception_count == 0"

      # --- priority 13: fiscal ceiling --------------------------------------
      - name: chargeback_over_the_annual_cap_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]"]
        distinguishing_aspect: "5 units at the 2500 tier is 12500 against a 10000 cap, so the request is 402 ERR_CHARGEBACK_CAP_EXCEEDED and neither the balance nor the diversion score moves."
        test_recipe:
          setup: ["Distributor Capped Freight with annual_chargeback_cap_cents 10000 and a zero balance; one CONFIRMED_UNAUTHORIZED test purchase whose traced unit it shipped."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - &DISTCAP10K
              call: "POST /distributors"
              payload: { legal_name: "Capped Freight Inc", annual_chargeback_cap_cents: 10000 }
              as: BrandChannelManager
              captures: { distk: $.data.id }
            - &SU0007
              call: "POST /serial-units"
              payload: { serial_number: "SN-0007", product_id: "${prod}", lot_code: "LOT-C", shipped_distributor_id: "${distk}" }
              as: BrandChannelManager
              captures: { su7: $.data.id }
            - *CLK0820
            - *OBSGREY
            - *TPNEW
            - &TPCAP7
              call: "POST /test-purchases/${tp}/serial-capture"
              payload: { serial_number: "SN-0007" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
            - *TPCONF1
            - &GETDISTKV
              call: "GET /distributors/${distk}"
              payload: {}
              as: BrandChannelManager
              captures: { dkv: $.data.version }
          trigger:
            - call: "POST /distributor-chargebacks"
              payload: { distributor_id: "${distk}", test_purchase_id: "${tp}", diverted_units: 5, expected_distributor_version: "${dkv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 402"
            - "${err} == 'ERR_CHARGEBACK_CAP_EXCEEDED'"
            - "Distributor.${distk}.chargeback_balance_cents == 0"
            - "Distributor.${distk}.diversion_score == 0"
            - "Distributor.${distk}.standing == GOOD"

      - name: chargeback_exactly_at_the_annual_cap_is_accepted
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=13]"]
        distinguishing_aspect: "'equality is allowed': 4 units at 2500 is exactly the 10000 cap, so the assessment lands and drives the balance to the ceiling with standing PROBATION."
        test_recipe:
          setup: ["Distributor Capped Freight with annual_chargeback_cap_cents 10000 and a zero balance; one CONFIRMED_UNAUTHORIZED test purchase whose traced unit it shipped."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTCAP10K
            - *SU0007
            - *CLK0820
            - *OBSGREY
            - *TPNEW
            - *TPCAP7
            - *TPCONF1
            - *GETDISTKV
          trigger:
            - call: "POST /distributor-chargebacks"
              payload: { distributor_id: "${distk}", test_purchase_id: "${tp}", diverted_units: 4, expected_distributor_version: "${dkv}" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
              captures: { cbk: $.data.id }
          assert:
            - "HTTP 201"
            - "DistributorChargeback.${cbk}.amount_cents == 10000"
            - "Distributor.${distk}.chargeback_balance_cents == 10000"
            - "Distributor.${distk}.annual_chargeback_cap_cents == 10000"
            - "Distributor.${distk}.standing == PROBATION"

  # ===========================================================================
  # SECTION 5 — endpoints  (§1.5, all 61 declared endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      # --- PricingPolicy ----------------------------------------------------
      - name: endpoint_create_pricing_policy_returns_draft_revision_one
        claim_type: standard_crud
        grounds: ["endpoints.POST /pricing-policies"]
        distinguishing_aspect: "The create endpoint accepts all ten policy knobs but needs only policy_code; the response is 201 with status DRAFT and revision_number 1 + the count of existing rows sharing the code, which is 1 for the first row."
        test_recipe:
          setup: ["A clean tenant at clock 2026-08-01."]
          setup_api_calls:
            - *CLK0801
          trigger:
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-A", cure_window_days: 10, suspension_points_threshold: 6, termination_points_threshold: 12, suspension_cooling_off_days: 14 }
              as: BrandChannelManager
              captures: { p: $.data.id, st: $.data.status, rev: $.data.revision_number }
          assert:
            - "HTTP 201"
            - "${st} == 'DRAFT'"
            - "${rev} == 1"
            - "PricingPolicy.${p}.effective_from == null"
            - "PricingPolicy.${p}.version == 1"

      - name: submit_policy_for_review_moves_it_to_in_legal_review
        claim_type: action_endpoint
        grounds: ["endpoints.POST /pricing-policies/{policy_id}/submit-review"]
        distinguishing_aspect: "An action endpoint with an empty input body: the only observable is the DRAFT -> IN_LEGAL_REVIEW move plus a version bump."
        test_recipe:
          setup: ["Policy MAP-2026-A in DRAFT."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
          trigger:
            - *POLSUB
          assert:
            - "HTTP 200"
            - "PricingPolicy.${pol}.status == IN_LEGAL_REVIEW"
            - "PricingPolicy.${pol}.version == 2"

      - name: review_decision_records_the_reviewer_and_notes
        claim_type: action_endpoint
        grounds: ["endpoints.POST /pricing-policies/{policy_id}/review-decision"]
        distinguishing_aspect: "The decision endpoint persists the acting counsel into reviewed_by_user_id and stores the optional legal_review_notes alongside the APPROVED status."
        test_recipe:
          setup: ["Policy MAP-2026-A in IN_LEGAL_REVIEW."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
          trigger:
