  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: change_order_state_check_precedes_contract_ceiling_check
        grounds:
          - validations[priority=8]
          - validations[priority=15]
          - errors[ERR_CHANGE_ORDER_INVALID_STATE]
          - errors[ERR_CONTRACT_CEILING_EXCEEDED]
        distinguishing_aspect: |
          One request violates the state rule at priority 8 (the order is still DRAFT, not SUBMITTED) and the
          business_fiscal rule at priority 15 (its +60,000,000 cent delta would take contract_value_cents to
          306,600,000 against a 300,000,000 ceiling); the response must be ERR_CHANGE_ORDER_INVALID_STATE, so
          the pair is state versus business_fiscal.
        test_recipe:
          setup:
            - "One Project with contract_base_cents 240000000, authorized_ceiling_cents 300000000 and contract_value_cents 243600000."
            - "One ChangeOrder still in DRAFT with price_delta_cents 60000000 and scope_delta_cph 0."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_pp: $.data.id, proj_pp_v: $.data.version }
            - call: "POST /change-orders"
              payload: { project_id: "${proj_pp}", title: "Full mezzanine extension", scope_delta_cph: 0, price_delta_cents: 60000000, schedule_delta_days: 45 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { co_pp: $.data.id }
            - call: "GET /projects/${proj_pp}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_pp_v2: $.data.version }
          trigger:
            - call: "POST /change-orders/${co_pp}/review-decision"
              payload: { decision: "APPROVE", expected_project_version: "${proj_pp_v2}", decision_comment: "Attempting approval on a draft" }
              as: CustomerRep
              as_user_id: "cust-rep-77"
          assert:
            - "the response is 409 with error_id ERR_CHANGE_ORDER_INVALID_STATE (not 422 ERR_CONTRACT_CEILING_EXCEEDED)"
            - "ChangeOrder.${co_pp}.status == DRAFT"
            - "Project.${proj_pp}.contract_value_cents == 243600000 and Project.${proj_pp}.escalation_fee_cents == 3600000"
            - "Project.${proj_pp}.commercial_status == CLEAN"

      - name: protected_shift_check_precedes_cross_project_reference_check
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_PROTECTED_SHIFT_COLLISION]
          - errors[ERR_CROSS_PROJECT_REFERENCE]
        distinguishing_aspect: |
          One cutover-window request violates the business_safety rule at priority 11 (17:00-21:00 UTC overlaps
          the zone's protected 08:00-18:00 shift) and the business_referential rule at priority 13 (the named
          fabrication lot belongs to a different project); the response must be ERR_PROTECTED_SHIFT_COLLISION,
          so the pair is business_safety versus business_referential — a different category pair than the
          state/business_fiscal instance.
        test_recipe:
          setup:
            - "Project P frozen with one SiteZone Z-DOCK (share 10000, protected shift 480-1080, buffer 60) and no cutover windows."
            - "Project Q frozen with its own FabricationLot in FAT_PASSED."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_pa: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Cascade Distribution", facility_code: "DC-PDX-07", customer_rep_user_id: "cust-rep-88", required_throughput_cph: 1250, contract_base_cents: 200000000, authorized_ceiling_cents: 260000000, spares_budget_cents: 3000000, service_tier: "BASIC" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_qb: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_qb}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_q1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_qb}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_q2: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_qb}", from_segment_id: "${seg_q1}", to_segment_id: "${seg_q2}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_qb}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_qb}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-6", concurrent_capacity: 2 }
              as: ShopSupervisor
              captures: { bay_q: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_qb}", lot_code: "LOT-600", staging_bay_id: "${bay_q}", segment_codes: ["IB-01"], occupancy_start_utc: "2026-08-03T00:00:00Z", occupancy_end_utc: "2026-08-07T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_q: $.data.id }
            - call: "POST /fabrication-lots/${lot_q}/start-fabrication"
              payload: {}
              as: ShopSupervisor
            - call: "POST /fabrication-lots/${lot_q}/stage"
              payload: {}
              as: ShopSupervisor
              captures: { lot_q_v: $.data.version }
            - call: "POST /fat-tests"
              payload: { fabrication_lot_id: "${lot_q}", expected_fabrication_lot_version: "${lot_q_v}", measured_cph: 1320, defect_count: 0 }
              as: ShopSupervisor
            - call: "POST /site-zones"
              payload: { project_id: "${proj_pa}", zone_code: "Z-DOCK", throughput_share_bps: 10000, protected_shift_start_minute: 480, protected_shift_end_minute: 1080, buffer_minutes: 60 }
              as: SiteManager
              captures: { zone_pa: $.data.id }
          trigger:
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_pa}", site_zone_id: "${zone_pa}", fabrication_lot_id: "${lot_q}", start_utc: "2026-08-12T17:00:00Z", end_utc: "2026-08-12T21:00:00Z" }
              as: SiteManager
          assert:
            - "the response is 422 with error_id ERR_PROTECTED_SHIFT_COLLISION (not ERR_CROSS_PROJECT_REFERENCE)"
            - "GET /cutover-windows?project_id=${proj_pa} returns total_count == 0"
            - "SiteZone.${zone_pa}.ops_status == LIVE_LEGACY"
            - "FabricationLot.${lot_q}.status == FAT_PASSED (untouched)"

  # =========================================================================
  # Rule 6 — boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ramp_measured_exactly_equal_to_target_passes
        grounds:
          - calculations.ramp_step_evaluation
          - entities.CommissioningRamp.fields.target_cph
          - entities.CommissioningRamp.fields.verdict
        distinguishing_aspect: |
          At the 75% step of a 1250 cph requirement the ceil'd target is exactly 938; a measured 938 held for
          exactly 60 minutes must PASS on both inclusive comparisons, while 937 for 60 minutes must FAIL — the
          off-by-one on the ceil boundary is the whole test.
        test_recipe:
          setup:
            - "Project in delivery_status COMMISSIONING with required_throughput_cph 1250, so ramp targets are 625 / 938 / 1250."
            - "One PASS CommissioningRamp already recorded at step_pct 50."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_bp: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_bp}", segment_code: "IB-01", equipment_class: "BELT", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { seg_bp1: $.data.id }
            - call: "POST /segments"
              payload: { project_id: "${proj_bp}", segment_code: "TR-02", equipment_class: "ROLLER", rated_capacity_cph: 1400, availability_pct: 95 }
              as: DesignEngineer
              captures: { seg_bp2: $.data.id }
            - call: "POST /flow-links"
              payload: { project_id: "${proj_bp}", from_segment_id: "${seg_bp1}", to_segment_id: "${seg_bp2}", split_share_bps: 10000 }
              as: DesignEngineer
            - call: "POST /projects/${proj_bp}/simulations"
              payload: { method: "DEGRADED_AVAILABILITY" }
              as: DesignEngineer
            - call: "POST /projects/${proj_bp}/design-freeze"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /staging-bays"
              payload: { bay_code: "BAY-7", concurrent_capacity: 2 }
              as: ShopSupervisor
              captures: { bay_bp: $.data.id }
            - call: "POST /fabrication-lots"
              payload: { project_id: "${proj_bp}", lot_code: "LOT-700", staging_bay_id: "${bay_bp}", segment_codes: ["IB-01", "TR-02"], occupancy_start_utc: "2026-08-03T00:00:00Z", occupancy_end_utc: "2026-08-07T00:00:00Z" }
              as: ShopSupervisor
              captures: { lot_bp: $.data.id }
            - call: "POST /fabrication-lots/${lot_bp}/start-fabrication"
              payload: {}
              as: ShopSupervisor
            - call: "POST /fabrication-lots/${lot_bp}/stage"
              payload: {}
              as: ShopSupervisor
              captures: { lot_bp_v: $.data.version }
            - call: "POST /fat-tests"
              payload: { fabrication_lot_id: "${lot_bp}", expected_fabrication_lot_version: "${lot_bp_v}", measured_cph: 1313, defect_count: 2 }
              as: ShopSupervisor
            - call: "POST /site-zones"
              payload: { project_id: "${proj_bp}", zone_code: "Z-INBOUND", throughput_share_bps: 10000, protected_shift_start_minute: 480, protected_shift_end_minute: 1080, buffer_minutes: 60 }
              as: SiteManager
              captures: { zone_bp: $.data.id }
            - call: "POST /cutover-windows"
              payload: { project_id: "${proj_bp}", site_zone_id: "${zone_bp}", fabrication_lot_id: "${lot_bp}", start_utc: "2026-08-10T19:00:00Z", end_utc: "2026-08-10T23:00:00Z" }
              as: SiteManager
              captures: { win_bp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T20:00:00Z" }
              as: ProjectDirector
              as_user_id: "pd-001"
            - call: "POST /cutover-windows/${win_bp}/start"
              payload: {}
              as: SiteManager
              as_user_id: "sm-001"
            - call: "POST /cutover-windows/${win_bp}/complete"
              payload: {}
              as: SiteManager
              as_user_id: "sm-001"
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_bp}", step_pct: 50, measured_cph: 625, sustained_minutes: 30 }
              as: SiteManager
              as_user_id: "sm-001"
              captures: { ramp_50: $.data.id }
          trigger:
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_bp}", step_pct: 75, measured_cph: 937, sustained_minutes: 60 }
              as: SiteManager
              as_user_id: "sm-001"
              captures: { ramp_75_fail: $.data.id }
            - call: "POST /commissioning-ramps"
              payload: { project_id: "${proj_bp}", step_pct: 75, measured_cph: 938, sustained_minutes: 60 }
              as: SiteManager
              as_user_id: "sm-001"
              captures: { ramp_75_pass: $.data.id }
          assert:
            - "CommissioningRamp.${ramp_50}.target_cph == 625 and CommissioningRamp.${ramp_50}.verdict == PASS"
            - "CommissioningRamp.${ramp_75_fail}.target_cph == 938 and CommissioningRamp.${ramp_75_fail}.min_sustained_minutes == 60"
            - "CommissioningRamp.${ramp_75_fail}.verdict == FAIL (937 is one carton short of the ceil'd target)"
            - "CommissioningRamp.${ramp_75_pass}.verdict == PASS (measured exactly equal to target and sustained exactly equal to the minimum)"
            - "FabricationLot.${lot_bp}.fat_target_cph == 1313 and FabricationLot.${lot_bp}.status == INSTALLED (measured exactly 1313 with exactly 2 defects passed FAT)"
            - "Project.${proj_bp}.acceptance_ready == false (no PASS at step_pct 100 yet)"

      - name: spares_provisioning_with_empty_fundable_pool_rejected
        grounds:
          - calculations.spares_budget_waterfall
          - errors[ERR_NO_FUNDABLE_SPARE_LINES]
          - entities.Project.fields.spares_unallocated_cents
        distinguishing_aspect: |
          The waterfall's candidate set is empty at the zero boundary — the project has two MINOR lines and
          nothing else, so the CRITICAL/MAJOR filter yields zero rows and the run must return
          ERR_NO_FUNDABLE_SPARE_LINES with the ledger left at budget-equals-unallocated rather than silently
          allocating nothing and reporting success.
        test_recipe:
          setup:
            - "One Project with spares_budget_cents 5000000, spares_allocated_cents 0 and spares_unallocated_cents 5000000."
            - "Exactly two DRAFT SparePartLine rows, both criticality MINOR."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-04", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 5000000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_sm: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_sm}", part_no: "LABEL-STK", criticality: "MINOR", unit_cost_cents: 4000, min_stock_qty: 50, lead_time_days: 7 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { line_m1: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_sm}", part_no: "GUIDE-RAIL", criticality: "MINOR", unit_cost_cents: 9000, min_stock_qty: 4, lead_time_days: 14 }
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { line_m2: $.data.id }
            - call: "GET /projects/${proj_sm}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-001"
              captures: { proj_sm_v: $.data.version }
          trigger:
            - call: "POST /projects/${proj_sm}/spares-provisioning"
              payload: { expected_project_version: "${proj_sm_v}" }
              as: ProjectDirector
              as_user_id: "pd-001"
          assert:
            - "the response is 422 with error_id ERR_NO_FUNDABLE_SPARE_LINES"
            - "Project.${proj_sm}.spares_allocated_cents == 0 and Project.${proj_sm}.spares_unallocated_cents == 5000000"
            - "SparePartLine.${line_m1}.status == DRAFT and SparePartLine.${line_m1}.allocated_cents == 0"
            - "SparePartLine.${line_m2}.status == DRAFT and SparePartLine.${line_m2}.allocated_cents == 0"
            - "SparePartLine.${line_m2}.weighted_target_cents is computed at creation but never funded"

