          - errors.ERR_INVALID_STATE
          - endpoints.POST_/false-alarm-program/dispatch-requests/{requestId}/cancel
        distinguishing_aspect: "Cancellation is declared only from VALIDATED. A company standing down a still-SUBMITTED request gets ERR_INVALID_STATE (409) — it must wait for validation or ask for a refusal, and the request may not skip straight to the CANCELLED terminal state."
        test_recipe:
