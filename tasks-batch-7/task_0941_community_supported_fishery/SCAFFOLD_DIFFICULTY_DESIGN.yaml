              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "SALMON", management_area: "GOM-1", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-06-01T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-1" }
              as: CsfAdmin
              captures: { trip1_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-1" }
              as: CsfAdmin
              captures: { trip2_id: $.data.id }
            - call: "POST /csf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CsfAdmin
          trigger:
            - call: "POST /csf/trips/${trip1_id}/land"
              payload: { species: "SALMON", landed_pounds_gross: 7.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /csf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:01Z" }
              as: CsfAdmin
            - call: "POST /csf/trips/${trip2_id}/land"
              payload: { species: "SALMON", landed_pounds_gross: 7.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Trip.${trip1_id}.status == LANDED"
            - "LandingLot.${lot1_id}.landed_pounds_net == 7.00"
            - "the second land response status is 422"
            - "${err_id} == ERR_SPECIES_OUT_OF_SEASON"
            - "Trip.${trip2_id}.status == PLANNED"
            - "QuotaLedger.${ledger_id}.committed_pounds == 7.00"
            - "QuotaLedger.${ledger_id}.remaining_pounds == 493.00"

  - rule_id: compensating_invariant
    instances:
      - name: landing_rejection_restores_the_quota_pounds_exactly
        grounds:
          - invariants[INV_QUOTA_LEDGER]
          - calculations.quota_debit
          - state_machines.Trip.LANDED_to_REJECTED
          - state_machines.LandingLot.RECORDED_to_CLOSED
        distinguishing_aspect: |
          The conserved quantity is pounds of annual catch entitlement. Landing debits 120.00 lb
          and rejecting the landing report credits exactly the same 120.00 lb back, so
          entitlement_pounds == committed_pounds + remaining_pounds holds at 500.00 both before
          and after, with committed returning to 0.00 rather than drifting.
        test_recipe:
          setup:
            - "an OPEN season with one share plan"
            - "a COMPLIANT vessel with a 500.00 lb SALMON entitlement in GOM-1"
            - "a trip landed with 120.00 lb, leaving committed 120.00 and remaining 380.00"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "MED-PREM-W", share_size: "MEDIUM", delivery_frequency: "WEEKLY", species_tier: "PREMIUM_FINFISH" }
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "SALMON", management_area: "GOM-1", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-1" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "SALMON", landed_pounds_gross: 120.00, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /csf/trips/${trip_id}/verify"
              payload: { accepted: false }
              as: CsfAdmin
          assert:
            - "before the trigger the ledger read committed_pounds 120.00 and remaining_pounds 380.00"
            - "QuotaLedger.${ledger_id}.entitlement_pounds == 500.00"
            - "QuotaLedger.${ledger_id}.committed_pounds == 0.00"
            - "QuotaLedger.${ledger_id}.remaining_pounds == 500.00"
            - "QuotaLedger.${ledger_id}.status == OPEN"
            - "Trip.${trip_id}.status == REJECTED"
            - "LandingLot.${lot_id}.status == CLOSED"
            - "LandingLot.${lot_id}.landed_pounds_net == 120.00"

      - name: holdback_resolution_conserves_gross_settlement_cents
        grounds:
          - invariants[INV_VENDOR_MONEY]
          - calculations.settlement_holdback
          - calculations.vendor_settlement_deductions
          - state_machines.SettlementStatement.HELD_to_FINAL
          - state_machines.LandingLot.HOLD_to_DISCOUNTED
        distinguishing_aspect: |
          A different conserved quantity, settlement cents rather than pounds. Withholding the
          914 cent holdback at creation and resolving it at finalize must leave
          gross_cents == deductions_cents + net_payable_cents + holdback_forfeited_cents +
          offset_cents: 9136 == 2174 + 6505 + 457 + 0, with holdback_released_cents +
          holdback_forfeited_cents == 914 and no cent lost to the DISCOUNT split.
        test_recipe:
          setup:
            - "an OPEN season with one share plan"
            - "a 10.04 lb COD lot landed at 850 cents ex-vessel with 12 offload minutes and a GREEN band, verified as accepted"
            - "a PROVISIONAL settlement statement created against the trip"
            - "a 25 minute cold-chain breach logged by hub-op-1, moving the lot to HOLD and the statement to HELD"
            - "the hold dispositioned as DISCOUNT by quality officer qo-1, who did not log the breach"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "LRG-WHITE-W", share_size: "LARGE", delivery_frequency: "WEEKLY", species_tier: "WHITEFISH" }
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "COD", management_area: "GOM-2", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"], area_sensitivity_penalty: 0, species_stock_adjustment: 0 }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "COD", landed_pounds_gross: 10.04, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/verify"
              payload: { accepted: true }
              as: CsfAdmin
              captures: { trip_v: $.data.version }
            - call: "POST /csf/trips/${trip_id}/settlements"
              payload: { expected_trip_version: "${trip_v}" }
              as: CsfAdmin
              captures: { stmt_id: $.data.id }
            - call: "POST /csf/cold-chain-events"
              payload: { landing_lot_id: "${lot_id}", custody_leg: "DOCK_TO_HUB", minutes_above_threshold: 25, peak_temp_c: 9.0 }
              as: HubOperator
              as_user_id: "hub-op-1"
            - call: "POST /csf/landing-lots/${lot_id}/disposition"
              payload: { disposition: "DISCOUNT" }
              as: QualityOfficer
              as_user_id: "qo-1"
          trigger:
            - call: "POST /csf/settlement-statements/${stmt_id}/finalize"
              payload: {}
              as: CsfAdmin
          assert:
            - "LandingLot.${lot_id}.quality_status == DISCOUNTED"
            - "SettlementStatement.${stmt_id}.status == FINAL"
            - "SettlementStatement.${stmt_id}.variant == FINAL"
            - "SettlementStatement.${stmt_id}.gross_cents == 9136"
            - "SettlementStatement.${stmt_id}.deductions_cents == 2174"
            - "SettlementStatement.${stmt_id}.holdback_cents == 914"
            - "SettlementStatement.${stmt_id}.holdback_released_cents == 457"
            - "SettlementStatement.${stmt_id}.holdback_forfeited_cents == 457"
            - "SettlementStatement.${stmt_id}.offset_cents == 0"
            - "SettlementStatement.${stmt_id}.net_payable_cents == 6505"
