              captures: { prod_err3: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Lupin", species: "DOG", breed: "Akita", weight_kg: 30.0, owner_state: "NV" }
              as: Customer
              captures: { pet_err3: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_err3}" }
              as: Customer
              as_user_id: "${pet_err3}"
              captures: { plan_err3: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_err3}/items"
              payload: { product_id: "${prod_err3}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_err3}"
              captures: { item_err3: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_err3}"
              payload: {}
              as: Customer
              as_user_id: "${pet_err3}"
              captures: { plan_err3_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_err3}/compose"
              payload: { expected_plan_version: "${plan_err3_v}" }
              as: Customer
              as_user_id: "${pet_err3}"
              captures: { order_err3: $.data.id }
          trigger:
            - call: "POST /v1/shipments"
              payload: { order_id: "${order_err3}" }
              as: PharmacyTechnician
              captures: { err_err3: $.data.error_id }
          assert:
