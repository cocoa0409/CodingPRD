  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_beats_state_on_approve
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A single approve call naming a non-existent license id is BOTH an existence failure (no
          such License) and trivially a state failure; the scaffold's priority 3 (existence,
          ERR_NOT_FOUND) outranks priority 5 (state, ERR_INVALID_STATE), so ERR_NOT_FOUND wins —
          error-category pair existence vs state.
        test_recipe:
          setup:
            - "Empty DB except a clerk identity; approve targets a random non-existent license id"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
          trigger:
            - call: "POST /licenses/00000000-0000-4000-8000-000000000000/approve"
              payload: {}
              as: LicensingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: dangerous_hold_safety_beats_period_overlap_on_issue_tag
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_DANGEROUS_DOG_HOLD]
          - errors[ERR_LICENSE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          An issue-tag call on an APPROVED second license for pet PG, where PG already holds an ACTIVE
          license whose period overlaps AND PG has an open DESIGNATED case, violates BOTH priority 9
          (business_safety, ERR_DANGEROUS_DOG_HOLD) and priority 10 (business_temporal,
          ERR_LICENSE_PERIOD_OVERLAP); safety outranks temporal so ERR_DANGEROUS_DOG_HOLD wins —
          error-category pair safety vs temporal, distinct from the existence/state pair above.
        test_recipe:
          setup:
            - "Pet PG holds ACTIVE INDIVIDUAL license LG1 (issued 2026-01-01, term 1yr) — provides the overlapping period"
            - "PG then receives a DESIGNATED dangerous-dog case; a SECOND license LG2 for PG is APPROVED"
            - "Issuing LG2's tag at clock 2026-01-01 would both overlap LG1 and be dangerous-held"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Owner G", email: "og@x.com", address_zip: "70001" }
              as: LicensingClerk
              captures: { og_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${og_id}", name: "Bruno", species: "DOG", breed: "B", is_altered: false, birth_date: "2022-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${og_id}"
              captures: { pg_id: $.data.id }
            - call: "POST /vaccination-records"
              payload: { pet_id: "${pg_id}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "VG" }
              as: Owner
              as_user_id: "${og_id}"
              captures: { vg_id: $.data.id }
            # LG1 — issued ACTIVE first (before any designation), supplies the overlapping period
            - call: "POST /licenses"
              payload: { owner_id: "${og_id}", pet_id: "${pg_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${og_id}"
              captures: { lg1_id: $.data.id }
            - call: "POST /licenses/${lg1_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${og_id}"
            - call: "POST /licenses/${lg1_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${lg1_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${lg1_id}/attach-vaccination"
              payload: { vaccination_record_id: "${vg_id}" }
              as: Owner
              as_user_id: "${og_id}"
            - call: "POST /licenses/${lg1_id}/approve"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${lg1_id}/issue-tag"
              payload: {}
              as: LicensingClerk
            # LG2 — second license, driven to APPROVED
            - call: "POST /licenses"
              payload: { owner_id: "${og_id}", pet_id: "${pg_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${og_id}"
              captures: { lg2_id: $.data.id }
            - call: "POST /licenses/${lg2_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${og_id}"
            - call: "POST /licenses/${lg2_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${lg2_id}/request-vaccination-proof"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${lg2_id}/attach-vaccination"
              payload: { vaccination_record_id: "${vg_id}" }
              as: Owner
              as_user_id: "${og_id}"
            - call: "POST /licenses/${lg2_id}/approve"
              payload: {}
              as: LicensingClerk
            # now designate PG dangerous (after LG1 already ACTIVE)
            - call: "POST /dangerous-dog-cases"
              payload: { pet_id: "${pg_id}", incident_summary: "lunged at officer", severity: "ATTACK" }
              as: AnimalControlOfficer
              captures: { gc_id: $.data.id }
            - call: "POST /dangerous-dog-cases/${gc_id}/investigate"
              payload: {}
              as: AnimalControlOfficer
            - call: "POST /dangerous-dog-cases/${gc_id}/designate"
              payload: {}
              as: AnimalControlOfficer
          trigger:
            - call: "POST /licenses/${lg2_id}/issue-tag"
              payload: {}
              as: LicensingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DANGEROUS_DOG_HOLD"

