              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Short Holder", email: "sht@funds.test", shares_held: 1000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
            - call: "POST /transfer-agent-instructions"
              payload: { company_id: "${co_id}", instruction_type: "DIVIDEND_PAYMENT", record_date: "2026-08-15", payable_date: "2026-08-25", declared_rate_cents_per_share: 500, funding_mode: "DECLARED_RATE" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ins_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          trigger:
            - call: "POST /transfer-agent-instructions/${ins_id}/execute"
              payload: {}
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
            - call: "POST /transfer-agent-instructions/${ins_id}/acknowledge"
              payload: { decision: "ACKNOWLEDGE" }
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
            - call: "POST /transfer-agent-instructions/${ins_id}/execute"
              payload: {}
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
          assert:
            - "trigger step 1 responds HTTP 409 with $.data.error_id == ERR_INSTRUCTION_NOT_ACKNOWLEDGED (the priority-8 state rule wins over the priority-17 fiscal rule)"
            - "trigger step 3 responds HTTP 422 with $.data.error_id == ERR_DIVIDEND_RESERVE_INSUFFICIENT"
            - "TransferAgentInstruction.${ins_id}.status == ACKNOWLEDGED after all three trigger steps"
            - "TransferAgentInstruction.${ins_id}.total_payout_cents == null and payout_ledger == [] (nothing was written by either rejected execute)"
            - "Company.${co_id}.dividend_reserve_cents == 100 and Company.${co_id}.dividend_paid_cents == 0"
            - "Contact.${c_id}.dividend_received_cents == 0"

      - name: meeting_slot_window_check_outranks_contact_double_booking
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_SLOT_OUT_OF_WINDOW]
          - errors[ERR_CONTACT_DOUBLE_BOOKED]
          - endpoints[POST /meeting-requests]
        distinguishing_aspect: |
          One create call violates both the priority-13 `business_temporal` rule (slot 18:00-18:30
          runs past the event's 18:00 window end) and the priority-14 `business_constraint` rule
          (it overlaps the contact's existing 17:30-18:00 booking inside the 30-minute buffer); the
          response is ERR_SLOT_OUT_OF_WINDOW, and the same slot inside a second event whose window
          ends at 19:00 then surfaces ERR_CONTACT_DOUBLE_BOOKED — the pair is business_temporal vs
          business_constraint, a different pair from the state / business_fiscal instance.
        test_recipe:
