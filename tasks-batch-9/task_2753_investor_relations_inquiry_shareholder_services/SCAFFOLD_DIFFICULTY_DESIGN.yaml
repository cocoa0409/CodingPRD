            - "A second GUIDANCE_UPDATE disclosure D2 for the same metric and period, still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
