# =============================================================================
# PRD Benchmark Seed Tables — Athletics Priority Points & Seat Allocation
# Sections §1.0 – §1.7.  §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  3000. Athletics Priority Points & Seat Allocation (university athletics development office): point formula design across cumulative giving, consecutive years, season ticket tenure and alumni status, annual point recalculation with donor communication and dispute resolution, seat selection event sequencing by point rank with time-slot assignment, per-seat donation requirements by section with relocation and upgrade requests, postseason and away-game ticket allocation using the same ranking, point transfer rules on death, divorce or entity giving with policy exceptions, capacity changes from renovation requiring reseating of the full donor base, donor retention analysis and pricing sensitivity by section

domain_name: athletics-priority-points
api_prefix: /athletics

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only two URL nesting
  # relationships exist (Section -> Seat, PointRecalculation -> SelectionEvent);
  # every other association is expressed as an FK field on the child plus a
  # filtered list endpoint. No deep ownership chains, no /a/{id}/b/{id}/c/{id}.

  state_machine_shape: parallel
  # SeatAssignment carries two independent state axes on the same row
  # (occupancy_status x payment_status). PointDispute is cyclic
  # (UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW). SelectionEvent is cyclic
  # (SLOTS_PUBLISHED -> SLOTS_STALE -> SLOTS_PUBLISHED). PointTransfer branches
  # (EXCEPTION_PENDING fork) and supports a compensating reverse edge.

  relationship_patterns:
    - one_to_many          # Section -> Seat, PointRecalculation -> SelectionEvent
    - self_referential     # Donor.household_partner_donor_id -> Donor.id
    - cross_aggregate      # SeatAssignment.donor_id crosses the seat aggregate

  role_model: segregation_of_duties
  # The officer who opens a PointRecalculation may not certify it, and the
  # analyst who reviewed a PointDispute may not decide it. Both checks compare
  # X-User-ID values, so they bite even across different roles.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal or entity name of the donor of record.
        constraints: "1..120 characters, non-blank"
      - name: email
        type: string
        source: input
        description: Contact address used for point-recalculation communications.
        constraints: "must contain '@'; unique across Donor"
      - name: alumni_status
        type: enum
        source: input
        description: Alumni affiliation class feeding the alumni bonus component S6.
        constraints: "ALUMNUS | FACULTY_STAFF | STUDENT | NON_ALUMNUS"
      - name: entity_type
        type: enum
        source: input
        description: Legal form of the donor, gating ENTITY_GIVING_REALIGNMENT transfers.
        constraints: "INDIVIDUAL | JOINT_HOUSEHOLD | CORPORATION | FOUNDATION"
      - name: donor_status
        type: enum
        source: computed
        description: Lifecycle state driving eligibility filters and transfer policy.
        default: ACTIVE
        constraints: "ACTIVE | LAPSED | DECEASED | DISSOLVED_ENTITY | SUSPENDED"
      - name: status_effective_date
        type: datetime
        source: system
        description: Effective instant of the most recent donor_status change; null until the first status-change call.
        default: null
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: household_partner_donor_id
        type: string
        source: computed
        description: "FK -> Donor.id; the reciprocally linked household partner, set by household-link on both rows; null when unlinked."
        default: null
      - name: season_ticket_first_cycle_year
        type: integer
        source: input
        description: First cycle year in which the donor bought season tickets; informational anchor for tenure audits.
        default: null
        constraints: "1900..2100 when present"
      - name: season_ticket_seasons_purchased
        type: integer
        source: computed
        description: Count of season-ticket seasons purchased, incremented by season-ticket-renewals; feeds tenure component S5.
        default: 0
        constraints: ">= 0"
      - name: cumulative_giving_cents
        type: integer
        source: computed
        description: Lifetime qualifying giving in cents as of the last recalculation run, per the CERTIFIED variant input set.
        default: 0
        constraints: ">= 0"
      - name: consecutive_giving_years
        type: integer
        source: computed
        description: Consecutive-year streak as of the last recalculation run, per the CERTIFIED variant input set.
        default: 0
        constraints: ">= 0"
      - name: provisional_points
        type: number
        source: computed
        description: PROVISIONAL-variant priority point score written by point-recalculation run.
        default: 0
        constraints: "2 decimal places, >= 0"
      - name: certified_base_points
        type: number
        source: computed
        description: Frozen base score (S3+S4+S5+S6) written by point-recalculation certify; never re-derived by donor_status changes.
        default: 0
        constraints: "2 decimal places, >= 0"
      - name: certified_points
        type: number
        source: computed
        description: Derived score used by every ranking and eligibility rule; recomputed whenever certified_base_points, transferred_points_in, transferred_points_out or dispute_adjustment_points changes.
        default: 0
        constraints: "2 decimal places, >= 0"
      - name: transferred_points_in
        type: number
        source: computed
        description: Cumulative points received through APPROVED PointTransfer rows, net of REVERSED ones.
        default: 0
        constraints: "2 decimal places, >= 0"
      - name: transferred_points_out
        type: number
        source: computed
        description: Cumulative points surrendered through APPROVED PointTransfer rows, net of REVERSED ones.
        default: 0
        constraints: "2 decimal places, >= 0"
      - name: dispute_adjustment_points
        type: number
        source: computed
        description: Cumulative granted_points_delta from UPHELD PointDispute rows.
        default: 0
        constraints: "2 decimal places"
      - name: rank_position
        type: integer
        source: computed
        description: 1-based rank assigned by the donor_rank_position calculation at the most recent certify; null before the donor's first certification.
        default: null
        constraints: ">= 1 when present"
      - name: pending_request_count
        type: integer
        source: computed
        description: Count of this donor's RelocationRequest rows whose status is AWAITING_SELECTION.
        default: 0
        constraints: ">= 0"

  - name: Gift
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: system
        description: "FK -> Donor.id; taken from the creation path, never from the body."
      - name: gift_date
        type: datetime
        source: input
        description: Instant the gift was made; its calendar year is the gift's cycle_year.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: cycle_year
        type: integer
        source: computed
        description: Calendar year (UTC) of gift_date; the bucket used by the consecutive-year streak scan.
        constraints: "1900..2100"
      - name: amount_cents
        type: integer
        source: input
        description: Gift amount in cents.
        constraints: "> 0"
      - name: designation
        type: enum
        source: input
        description: Fund designation; only ATHLETICS_ANNUAL and CAPITAL count toward points.
        constraints: "ATHLETICS_ANNUAL | CAPITAL | ENDOWMENT"
      - name: gift_status
        type: enum
        source: input
        description: Settlement state of the gift; PLEDGED counts only in the PROVISIONAL variant.
        default: PLEDGED
        constraints: "PLEDGED | RECEIVED | REFUNDED"
      - name: counts_toward_points
        type: boolean
        source: computed
        description: True exactly when designation is in {ATHLETICS_ANNUAL, CAPITAL}.
        constraints: "derived at create; input value ignored"
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant at which gift_status last moved to RECEIVED or REFUNDED; null while PLEDGED.
        default: null

  - name: PointLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: donor_id
        type: string
        source: system
        description: "FK -> Donor.id; the donor this component row belongs to."
      - name: recalculation_id
        type: string
        source: system
        description: "FK -> PointRecalculation.id; the recalculation cycle that produced this row."
      - name: entry_type
        type: enum
        source: system
        description: Which formula component this row explains.
        constraints: "CUMULATIVE_GIVING | CONSECUTIVE_YEARS | SEASON_TICKET_TENURE | ALUMNI_STATUS | NET_TRANSFER | DISPUTE_ADJUSTMENT"
      - name: variant
        type: enum
        source: system
        description: Which calculation variant produced the row; every recalculation run writes one PROVISIONAL row and one CERTIFIED row per component, so a single run appends two generations of rows per donor.
        constraints: "PROVISIONAL | CERTIFIED"
      - name: points
        type: number
        source: system
        description: Points contributed by this component.
        constraints: "2 decimal places"
      - name: basis_note
        type: string
        source: system
        description: Human-readable derivation of the row (tier split, streak span, cap applied).
      - name: computed_at
        type: datetime
        source: system
        description: Logical-clock instant the row was written.
        constraints: "ISO 8601 UTC, three fractional digits"

  - name: PointRecalculation
    parent: null
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: Athletics cycle year this recalculation certifies.
        constraints: "1900..2100; unique across PointRecalculation"
      - name: cutoff_date
        type: datetime
        source: input
        description: Gifts with gift_date after this instant are excluded from both variants.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: dispute_window_end
        type: datetime
        source: input
        description: Last instant at which a PointDispute may be filed against this cycle.
        constraints: "ISO 8601 UTC, three fractional digits; must be > cutoff_date"
      - name: status
        type: enum
        source: computed
        description: Recalculation lifecycle state.
        default: DRAFT
        constraints: "DRAFT | COMPUTED | COMMUNICATED | CERTIFIED"
      - name: initiated_by_user_id
        type: string
        source: system
        description: X-User-ID that created the recalculation; the segregation-of-duties comparand at certify.
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID that certified the recalculation; null before certification.
        default: null
      - name: donors_processed_count
        type: integer
        source: computed
        description: Number of donors scored by run.
        default: 0
        constraints: ">= 0"
      - name: communication_sent_count
        type: integer
        source: computed
        description: Number of donor communications emitted by send-communications.
        default: 0
        constraints: ">= 0"
      - name: certified_points_sum
        type: number
        source: computed
        description: Sum of Donor.certified_points over donors holding a CERTIFIED-variant PointLedgerEntry under this recalculation; recomputed whenever any such donor's certified_points changes.
        default: 0
        constraints: "2 decimal places"
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification; null before certification.
        default: null

  - name: PointDispute
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the disputing donor, who must equal X-User-ID for the Donor role."
      - name: recalculation_id
        type: string
        source: input
        description: "FK -> PointRecalculation.id; the certified cycle being disputed."
      - name: claimed_points_delta
        type: number
        source: input
        description: Points the donor claims were omitted.
        constraints: "> 0, 2 decimal places"
      - name: basis_note
        type: string
        source: input
        description: Donor's stated basis for the dispute.
        constraints: "1..500 characters, non-blank"
      - name: status
        type: enum
        source: computed
        description: Dispute lifecycle state; INFO_REQUESTED cycles back to UNDER_REVIEW.
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | UPHELD | DENIED"
      - name: info_request_rounds
        type: integer
        source: computed
        description: Count of completed INFO_REQUESTED -> UNDER_REVIEW loops; capped by INFO_REQUEST_ROUND_CAP.
        default: 0
        constraints: "0..2"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the DisputeAnalyst that first moved the dispute to UNDER_REVIEW; the segregation-of-duties comparand at decide.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyCommittee member that decided the dispute.
        default: null
      - name: granted_points_delta
        type: number
        source: computed
        description: Points actually granted; equals the decide payload's granted_points_delta when UPHELD, 0 when DENIED.
        default: null
        constraints: "2 decimal places, >= 0 when present"
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision; null before decision.
        default: null

  - name: PointTransfer
    parent: null
    common_fields: true
    fields:
      - name: source_donor_id
        type: string
        source: input
        description: "FK -> Donor.id; donor surrendering points."
      - name: recipient_donor_id
        type: string
        source: input
        description: "FK -> Donor.id; donor receiving points; must differ from source_donor_id."
      - name: basis
        type: enum
        source: input
        description: Policy basis invoked for the transfer.
        constraints: "DEATH | DIVORCE | ENTITY_DISSOLUTION | ENTITY_GIVING_REALIGNMENT"
      - name: points_amount
        type: number
        source: input
        description: Points to move from source to recipient.
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: Transfer lifecycle state; EXCEPTION_PENDING is the policy-exception fork.
        default: REQUESTED
        constraints: "REQUESTED | EXCEPTION_PENDING | APPROVED | DENIED | REVERSED"
      - name: transfer_pct_cap
        type: number
        source: computed
        description: Fraction of the source donor's certified_points transferable under this basis, from TRANSFER_PCT_CAP_BY_BASIS.
        constraints: "2 decimal places, 0 < value <= 1"
      - name: max_transferable_points
        type: number
        source: computed
        description: round_half_up(source Donor.certified_points * transfer_pct_cap, 2) evaluated at create time.
        constraints: "2 decimal places, >= 0"
      - name: exception_required
        type: boolean
        source: computed
        description: True when the basis's factual precondition on the source donor does not hold, forcing the EXCEPTION_PENDING fork.
      - name: exception_granted_by_user_id
        type: string
        source: system
        description: X-User-ID of the PolicyCommittee member that granted the policy exception.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the PointsCertifier that approved the transfer.
        default: null
      - name: decision_note
        type: string
        source: computed
        description: Note supplied by policy-decision or reverse.
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: Logical-clock instant of reversal; null unless status is REVERSED.
        default: null

  - name: Section
    parent: null
    common_fields: true
    fields:
      - name: section_code
        type: string
        source: input
        description: Short seating-section code.
        constraints: "1..16 characters, non-blank, unique across Section"
      - name: venue_code
        type: string
        source: input
        description: Venue the section belongs to.
        constraints: "1..32 characters, non-blank"
      - name: seat_capacity
        type: integer
        source: computed
        description: Maximum number of Seat rows the section may hold; set from the create payload and replaced by post_renovation_capacity when reseating starts.
        constraints: "> 0"
      - name: per_seat_requirement_cents
        type: integer
        source: computed
        description: Current market per-seat donation requirement in cents; set at create, replaced by reprice and by reseating.
        constraints: "> 0"
      - name: required_points_per_seat
        type: number
        source: input
        description: Minimum Donor.certified_points needed to occupy a seat in this section.
        constraints: ">= 0, 2 decimal places"
      - name: requirement_history
        type: array
        source: computed
        description: Append-only list of { cycle_year, per_seat_requirement_cents } objects, one per create/reprice/reseating price change, ordered by append order; the grandfathering lookup source.
      - name: status
        type: enum
        source: computed
        description: Operational state of the section.
        default: OPEN
        constraints: "OPEN | UNDER_RENOVATION | CLOSED"
      - name: renovation_status
        type: enum
        source: computed
        description: Renovation sub-pipeline state, independent of status until COMPLETED returns status to OPEN.
        default: NONE
        constraints: "NONE | SURVEYED | REPRICED | RESEATING | COMPLETED | ABANDONED"
      - name: post_renovation_capacity
        type: integer
        source: computed
        description: Capacity that replaces seat_capacity when reseating starts; null until REPRICE.
        default: null
        constraints: "> 0 when present"
      - name: post_renovation_requirement_cents
        type: integer
        source: computed
        description: Requirement that replaces per_seat_requirement_cents when reseating starts; null until REPRICE.
        default: null
        constraints: "> 0 when present"
      - name: reseating_recalculation_id
        type: string
        source: computed
        description: "FK -> PointRecalculation.id; the certified cycle whose ranking drives the reseating of this section; null until reseating starts."
        default: null
      - name: reseated_donor_count
        type: integer
        source: computed
        description: Number of SeatAssignment rows repriced by the reseating cascade.
        default: 0
        constraints: ">= 0"
      - name: reseating_invoice_total_cents
        type: integer
        source: computed
        description: Total prorated reseating invoice in cents, rounded per seat before summing.
        default: 0
        constraints: ">= 0"
      - name: seat_row_count
        type: integer
        source: computed
        description: Count of Seat rows whose section_id is this section.
        default: 0
        constraints: ">= 0, <= seat_capacity"
      - name: seats_available
        type: integer
        source: computed
        description: Count of Seat rows in this section with seat_status AVAILABLE.
        default: 0
        constraints: ">= 0"
      - name: seats_committed_count
        type: integer
        source: computed
        description: Count of Seat rows in this section with seat_status in {HELD, ASSIGNED}.
        default: 0
        constraints: ">= 0"
      - name: decommissioned_seat_count
        type: integer
        source: computed
        description: Count of Seat rows in this section with seat_status DECOMMISSIONED.
        default: 0
        constraints: ">= 0"
      - name: assigned_seat_count
        type: integer
        source: computed
        description: Count of SeatAssignment rows on this section's seats with occupancy_status in {HELD, ASSIGNED}.
        default: 0
        constraints: ">= 0"
      - name: underwater_seat_count
        type: integer
        source: computed
        description: Count of SeatAssignment rows on this section's seats with occupancy_status in {HELD, ASSIGNED} and eligibility_status UNDERWATER.
        default: 0
        constraints: ">= 0"
      - name: pricing_posture
        type: enum
        source: computed
        description: Derived pricing signal from the underwater ratio and remaining availability, per the section_pricing_posture calculation.
        default: NORMAL
        constraints: "NORMAL | SOFT | PREMIUM"

  - name: Seat
    parent: Section
    common_fields: true
    fields:
      - name: section_id
        type: string
        source: system
        description: "FK -> Section.id; taken from the creation path, never from the body."
      - name: row_label
        type: string
        source: input
        description: Row label within the section.
        constraints: "1..8 characters, non-blank; (section_id, row_label, seat_number) unique"
      - name: seat_number
        type: integer
        source: input
        description: Seat number within the row.
        constraints: "> 0"
      - name: seat_status
        type: enum
        source: computed
        description: Physical availability of the seat.
        default: AVAILABLE
        constraints: "AVAILABLE | HELD | ASSIGNED | DECOMMISSIONED"
      - name: max_concurrent_holds
        type: integer
        source: input
        description: Aggregate capacity for overlapping HELD SeatAssignment windows on this seat.
        default: 1
        constraints: ">= 1"

  - name: SeatAssignment
    parent: null
    common_fields: true
    fields:
      - name: seat_id
        type: string
        source: input
        description: "FK -> Seat.id; the seat being occupied."
      - name: donor_id
        type: string
        source: system
        description: "FK -> Donor.id; copied from the SelectionSlot's donor_id, never from the body."
      - name: selection_slot_id
        type: string
        source: system
        description: "FK -> SelectionSlot.id; the slot through which the seat was picked; null for rows created by relocation-request decide."
        default: null
      - name: occupancy_status
        type: enum
        source: computed
        description: Occupancy axis; evolves independently of payment_status.
        default: HELD
        constraints: "HELD | ASSIGNED | RELEASED"
      - name: payment_status
        type: enum
        source: computed
        description: Billing axis; evolves independently of occupancy_status.
        default: UNBILLED
        constraints: "UNBILLED | INVOICED | PAID | DELINQUENT | WRITTEN_OFF"
      - name: hold_start
        type: datetime
        source: system
        description: Logical-clock instant the hold began; the closed hold interval's lower bound.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: hold_end
        type: datetime
        source: system
        description: hold_start plus HOLD_MINUTES; the closed hold interval's inclusive upper bound.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: first_occupied_cycle_year
        type: integer
        source: computed
        description: Earliest cycle year in which this donor occupied any seat in this section; inherited from the prior assignment when pricing_mode is RENEWAL.
        constraints: "1900..2100"
      - name: pricing_mode
        type: enum
        source: computed
        description: Which seat_requirement_amount variant applies to this row.
        default: MARKET
        constraints: "RENEWAL | MARKET"
      - name: grandfathered_requirement_cents
        type: integer
        source: computed
        description: Section.per_seat_requirement_cents recorded in requirement_history for first_occupied_cycle_year; equals the current market rate when pricing_mode is MARKET.
        constraints: "> 0"
      - name: requirement_cents
        type: integer
        source: computed
        description: Per-seat donation requirement in cents for this row, per the seat_requirement_amount calculation and pricing_mode.
        constraints: "> 0"
      - name: handling_fee_cents
        type: integer
        source: computed
        description: Postseason/away-game handling fee in cents; 0 for SEASON_TICKET events.
        default: 0
        constraints: ">= 0"
      - name: total_due_cents
        type: integer
        source: computed
        description: requirement_cents plus handling_fee_cents.
        constraints: "> 0"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Cents recorded by billing calls with to_status PAID.
        default: 0
        constraints: ">= 0"
      - name: required_points
        type: number
        source: computed
        description: Section.required_points_per_seat snapshotted when the row was created.
        constraints: ">= 0, 2 decimal places"
      - name: points_at_pick
        type: number
        source: computed
        description: Donor.certified_points snapshotted when the row was created.
        constraints: ">= 0, 2 decimal places"
      - name: eligibility_status
        type: enum
        source: computed
        description: UNDERWATER when the donor's current certified_points is below required_points; ELIGIBLE otherwise.
        default: ELIGIBLE
        constraints: "ELIGIBLE | UNDERWATER"
      - name: release_reason
        type: enum
        source: computed
        description: Why the row left occupancy HELD/ASSIGNED.
        default: NONE
        constraints: "NONE | DONOR_RELEASE | SUPERSEDED_BY_NEW_HOLD | RESEATING"

  - name: SelectionEvent
    parent: PointRecalculation
    common_fields: true
    fields:
      - name: recalculation_id
        type: string
        source: system
        description: "FK -> PointRecalculation.id; taken from the creation path, never from the body."
      - name: event_type
        type: enum
        source: input
        description: Which allocation this event runs.
        constraints: "SEASON_TICKET | POSTSEASON | AWAY_GAME"
      - name: status
        type: enum
        source: computed
        description: Event lifecycle state; SLOTS_STALE cycles back to SLOTS_PUBLISHED via publish-slots.
        default: DRAFT
        constraints: "DRAFT | SLOTS_PUBLISHED | SLOTS_STALE | OPEN | CLOSED"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive lower bound of the event's half-open occupation window on its recalculation.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: window_end
        type: datetime
        source: input
        description: Exclusive upper bound of the event's half-open occupation window; must be > window_start.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: slot_minutes
        type: integer
        source: input
        description: Length of each donor's selection slot in minutes.
        constraints: ">= 1"
      - name: slot_buffer_minutes
        type: integer
        source: input
        description: Gap inserted between consecutive slots in minutes.
        default: 0
        constraints: ">= 0"
      - name: eligible_donor_min_points
        type: number
        source: input
        description: Minimum Donor.certified_points for inclusion in this event's candidate pool.
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: published_slot_count
        type: integer
        source: computed
        description: Number of SelectionSlot rows created by the most recent publish-slots call.
        default: 0
        constraints: ">= 0"
      - name: scheduled_slot_count
        type: integer
        source: computed
        description: Count of this event's SelectionSlot rows still in slot_status SCHEDULED.
        default: 0
        constraints: ">= 0"

  - name: SelectionSlot
    parent: SelectionEvent
    common_fields: true
    fields:
      - name: selection_event_id
        type: string
        source: system
        description: "FK -> SelectionEvent.id; the event that published this slot."
      - name: donor_id
        type: string
        source: system
        description: "FK -> Donor.id; the donor entitled to pick in this slot."
      - name: rank_at_publish
        type: integer
        source: computed
        description: Donor.rank_position observed when the slot was published; the staleness comparand.
        constraints: ">= 1"
      - name: slot_index
        type: integer
        source: computed
        description: 0-based position of the slot in the event's window; the default list sort key.
        constraints: ">= 0"
      - name: slot_start
        type: datetime
        source: computed
        description: Inclusive lower bound of the donor's half-open pick window.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: slot_end
        type: datetime
        source: computed
        description: Exclusive upper bound of the donor's half-open pick window.
        constraints: "ISO 8601 UTC, three fractional digits"
      - name: slot_status
        type: enum
        source: computed
        description: Slot lifecycle state.
        default: SCHEDULED
        constraints: "SCHEDULED | STALE | CONSUMED | FORFEITED"

  - name: RelocationRequest
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the requesting donor, who must equal X-User-ID for the Donor role."
      - name: current_seat_assignment_id
        type: string
        source: input
        description: "FK -> SeatAssignment.id; the donor's existing assignment being relocated or upgraded."
      - name: target_section_id
        type: string
        source: input
        description: "FK -> Section.id; the section the donor wants to move into."
      - name: selection_event_id
        type: string
        source: input
        description: "FK -> SelectionEvent.id; the event through which the move would be executed."
      - name: request_type
        type: enum
        source: input
        description: Whether the donor wants a lateral move or a higher-tier section.
        constraints: "RELOCATION | UPGRADE"
      - name: status
        type: enum
        source: computed
        description: Request lifecycle state; BLOCKED is set by the staleness cascade, SUPERSEDED by a newer request from the same donor.
        default: AWAITING_SELECTION
        constraints: "AWAITING_SELECTION | BLOCKED | GRANTED | DENIED | SUPERSEDED"
      - name: granted_seat_assignment_id
        type: string
        source: computed
        description: "FK -> SeatAssignment.id; the assignment created when the request was granted; null otherwise."
        default: null
      - name: decision_note
        type: string
        source: computed
        description: Note recorded by decide, or the cascade reason recorded when the request was BLOCKED or SUPERSEDED.
        default: null

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Donor
    state_field: donor_status
    initial_state: ACTIVE
    terminal_states: [DISSOLVED_ENTITY]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /athletics/donors/{id}/status-change with new_status LAPSED"
        actor: DevelopmentOfficer
        preconditions:
          - "donor_status is ACTIVE"
          - "effective_date is not after the current logical clock instant"
        side_effects:
          - "sets status_effective_date to effective_date"
          - "keeps certified_base_points unchanged; LAPSED donors remain rankable"
          - "increments Donor.version by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /athletics/donors/{id}/status-change with new_status ACTIVE"
        actor: DevelopmentOfficer
        preconditions:
          - "donor_status is LAPSED"
        side_effects:
          - "sets status_effective_date to effective_date"
          - "increments Donor.version by 1"
        note: "Reactivation loop; the alumni bonus is unaffected because it is granted for both ACTIVE and LAPSED."
      - from: ACTIVE
        to: DECEASED
        trigger: "POST /athletics/donors/{id}/status-change with new_status DECEASED"
        actor: DevelopmentOfficer
        preconditions:
          - "donor_status is ACTIVE or LAPSED"
        side_effects:
          - "sets status_effective_date to effective_date"
          - "drops the alumni bonus from the next recalculation because donor_status leaves {ACTIVE, LAPSED}"
          - "makes the donor ineligible for every SelectionEvent candidate pool"
          - "unlocks DEATH-basis PointTransfer without a policy exception"
          - "increments Donor.version by 1"
      - from: LAPSED
        to: DECEASED
        trigger: "POST /athletics/donors/{id}/status-change with new_status DECEASED"
        actor: DevelopmentOfficer
        preconditions:
          - "donor_status is ACTIVE or LAPSED"
        side_effects:
          - "sets status_effective_date to effective_date"
          - "drops the alumni bonus from the next recalculation"
          - "unlocks DEATH-basis PointTransfer without a policy exception"
          - "increments Donor.version by 1"
      - from: ACTIVE
        to: DISSOLVED_ENTITY
        trigger: "POST /athletics/donors/{id}/status-change with new_status DISSOLVED_ENTITY"
        actor: DevelopmentOfficer
        preconditions:
          - "donor_status is ACTIVE or SUSPENDED"
          - "entity_type is CORPORATION or FOUNDATION"
        side_effects:
          - "sets status_effective_date to effective_date"
          - "unlocks ENTITY_DISSOLUTION-basis PointTransfer without a policy exception"
          - "increments Donor.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /athletics/donors/{id}/status-change with new_status SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "donor_status is ACTIVE"
        side_effects:
          - "sets status_effective_date to effective_date"
          - "removes the donor from every SelectionEvent candidate pool"
          - "increments Donor.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /athletics/donors/{id}/status-change with new_status ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "donor_status is SUSPENDED"
        side_effects:
          - "sets status_effective_date to effective_date"
          - "increments Donor.version by 1"

  - entity: Gift
    state_field: gift_status
    initial_state: PLEDGED
    terminal_states: [REFUNDED]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "POST /athletics/gifts/{id}/settle with new_status RECEIVED"
        actor: DevelopmentOfficer
        preconditions:
          - "gift_status is PLEDGED"
        side_effects:
          - "sets settled_at to the current logical clock instant"
          - "adds amount_cents to Donor.cumulative_giving_cents"
          - "sets counts_toward_points to true when designation is ATHLETICS_ANNUAL or CAPITAL"
          - "makes the gift eligible for the CERTIFIED point variant as well as the PROVISIONAL variant"
          - "increments Gift.version by 1 and Donor.version by 1"
      - from: PLEDGED
        to: REFUNDED
        trigger: "POST /athletics/gifts/{id}/settle with new_status REFUNDED"
        actor: DevelopmentOfficer
        preconditions:
          - "gift_status is PLEDGED"
        side_effects:
          - "sets settled_at to the current logical clock instant"
          - "sets counts_toward_points to false"
          - "removes the gift from both the PROVISIONAL and the CERTIFIED input set"
          - "increments Gift.version by 1"
      - from: RECEIVED
        to: REFUNDED
        trigger: "POST /athletics/gifts/{id}/settle with new_status REFUNDED"
        actor: DevelopmentOfficer
        preconditions:
          - "gift_status is RECEIVED"
        side_effects:
          - "subtracts amount_cents from Donor.cumulative_giving_cents"
          - "sets counts_toward_points to false"
          - "leaves already-certified Donor.certified_base_points untouched until the next recalculation run"
          - "increments Gift.version by 1 and Donor.version by 1"

  - entity: PointRecalculation
    state_field: status
    initial_state: DRAFT
    terminal_states: [CERTIFIED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /athletics/point-recalculations/{id}/run"
        actor: DevelopmentOfficer
        preconditions:
          - "status is DRAFT"
        side_effects:
          - "computes provisional_points and certified_base_points for every Donor from the priority_point_score calculation"
          - "appends one PointLedgerEntry per component per variant per donor"
          - "recomputes Donor.certified_points from certified_base_points plus transfers plus dispute adjustments"
          - "sets donors_processed_count"
          - "increments PointRecalculation.version by 1"
      - from: COMPUTED
        to: COMMUNICATED
        trigger: "POST /athletics/point-recalculations/{id}/send-communications"
        actor: DevelopmentOfficer
        preconditions:
          - "status is COMPUTED"
        side_effects:
          - "sets communication_sent_count to donors_processed_count"
          - "opens the dispute window until dispute_window_end"
          - "increments PointRecalculation.version by 1"
      - from: COMMUNICATED
        to: COMPUTED
        trigger: "POST /athletics/point-recalculations/{id}/run"
        actor: DevelopmentOfficer
        preconditions:
          - "status is COMMUNICATED"
          - "no PointDispute on this recalculation is in status UNDER_REVIEW or INFO_REQUESTED"
        side_effects:
          - "recomputes every donor's points, folding in dispute_adjustment_points from UPHELD disputes"
          - "appends a fresh generation of PointLedgerEntry rows"
          - "resets communication_sent_count to 0"
          - "increments PointRecalculation.version by 1"
        note: "The recompute loop is what makes the recalculation machine non-linear: dispute outcomes force a second pass before certification."
      - from: COMMUNICATED
        to: CERTIFIED
        trigger: "POST /athletics/point-recalculations/{id}/certify"
        actor: PointsCertifier
        preconditions:
          - "status is COMMUNICATED"
          - "expected_recalculation_version matches PointRecalculation.version"
          - "X-User-ID differs from initiated_by_user_id"
          - "no PointDispute on this recalculation is in status SUBMITTED, UNDER_REVIEW or INFO_REQUESTED"
        side_effects:
          - "sets certified_by_user_id to X-User-ID and certified_at to the current logical clock instant"
          - "sets certified_points_sum to the sum of Donor.certified_points over all processed donors"
          - "assigns Donor.rank_position over the ranked donor pool"
          - "marks every SCHEDULED SelectionSlot whose rank_at_publish no longer equals its donor's rank_position as STALE"
          - "moves any SelectionEvent that just had a slot marked STALE and retains no SCHEDULED slot to SLOTS_STALE"
          - "moves every AWAITING_SELECTION RelocationRequest on a stale event to BLOCKED and decrements Donor.pending_request_count"
          - "increments PointRecalculation.version by 1"

  - entity: PointDispute
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /athletics/point-disputes/{id}/review"
        actor: DisputeAnalyst
        preconditions:
          - "status is SUBMITTED"
          - "the parent PointRecalculation is in status COMMUNICATED"
        side_effects:
          - "sets reviewed_by_user_id to X-User-ID on the first review only"
          - "increments PointDispute.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /athletics/point-disputes/{id}/request-info"
        actor: DisputeAnalyst
        preconditions:
          - "status is UNDER_REVIEW"
          - "info_request_rounds is below INFO_REQUEST_ROUND_CAP"
        side_effects:
          - "records info_note on the dispute"
          - "increments PointDispute.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /athletics/point-disputes/{id}/provide-info"
        actor: Donor
        preconditions:
          - "status is INFO_REQUESTED"
          - "X-User-ID equals PointDispute.donor_id"
        side_effects:
          - "increments info_request_rounds by 1"
          - "increments PointDispute.version by 1"
        note: "Cyclic return edge; the second completed loop exhausts INFO_REQUEST_ROUND_CAP so a third request-info is rejected."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /athletics/point-disputes/{id}/decide with decision UPHOLD"
        actor: PolicyCommittee
        preconditions:
          - "status is UNDER_REVIEW"
          - "the current logical clock instant is before the parent recalculation's dispute_window_end"
          - "X-User-ID differs from reviewed_by_user_id"
        side_effects:
          - "sets granted_points_delta from the payload and decided_by_user_id to X-User-ID"
          - "adds granted_points_delta to Donor.dispute_adjustment_points"
          - "recomputes Donor.certified_points"
          - "increments PointDispute.version by 1 and Donor.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /athletics/point-disputes/{id}/decide with decision DENY"
        actor: PolicyCommittee
        preconditions:
          - "status is UNDER_REVIEW"
          - "the current logical clock instant is before the parent recalculation's dispute_window_end"
          - "X-User-ID differs from reviewed_by_user_id"
        side_effects:
          - "sets granted_points_delta to 0 and decided_by_user_id to X-User-ID"
          - "leaves Donor.dispute_adjustment_points unchanged"
          - "increments PointDispute.version by 1"

  - entity: PointTransfer
    state_field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: REQUESTED
        to: EXCEPTION_PENDING
        trigger: "POST /athletics/point-transfers (creation with exception_required true)"
        actor: DevelopmentOfficer
        preconditions:
          - "the basis's factual precondition on the source donor does not hold"
        side_effects:
          - "sets exception_required to true"
          - "blocks approve until a PolicyCommittee grant arrives"
        note: "Creation lands directly in EXCEPTION_PENDING rather than REQUESTED, so the entry state depends on the source donor's status."
      - from: EXCEPTION_PENDING
        to: REQUESTED
        trigger: "POST /athletics/point-transfers/{id}/policy-decision with decision GRANT"
        actor: PolicyCommittee
        preconditions:
          - "status is EXCEPTION_PENDING"
        side_effects:
          - "sets exception_granted_by_user_id to X-User-ID and records decision_note"
          - "increments PointTransfer.version by 1"
      - from: EXCEPTION_PENDING
        to: DENIED
        trigger: "POST /athletics/point-transfers/{id}/policy-decision with decision REFUSE"
        actor: PolicyCommittee
        preconditions:
          - "status is EXCEPTION_PENDING"
        side_effects:
          - "records decision_note"
          - "increments PointTransfer.version by 1"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /athletics/point-transfers/{id}/approve"
        actor: PointsCertifier
        preconditions:
          - "status is REQUESTED"
          - "points_amount is at most max_transferable_points"
          - "points_amount is at most the source donor's current certified_points"
        side_effects:
          - "adds points_amount to the recipient's transferred_points_in and to the source's transferred_points_out"
          - "recomputes certified_points for both donors"
          - "flips every HELD or ASSIGNED SeatAssignment whose donor's certified_points fell below required_points to eligibility_status UNDERWATER"
          - "recomputes Section.underwater_seat_count and Section.pricing_posture for every affected section"
          - "sets approved_by_user_id to X-User-ID"
          - "increments PointTransfer.version by 1 and both Donor.version values by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /athletics/point-transfers/{id}/policy-decision with decision REFUSE"
        actor: PolicyCommittee
        preconditions:
          - "status is REQUESTED"
        side_effects:
          - "records decision_note"
          - "increments PointTransfer.version by 1"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /athletics/point-transfers/{id}/reverse"
        actor: PointsCertifier
        preconditions:
          - "status is APPROVED"
        side_effects:
          - "subtracts points_amount from the recipient's transferred_points_in and from the source's transferred_points_out"
          - "recomputes certified_points for both donors, restoring the pre-transfer sum exactly"
          - "restores eligibility_status to ELIGIBLE on every SeatAssignment whose donor again meets required_points"
          - "recomputes Section.underwater_seat_count and Section.pricing_posture"
          - "sets reversed_at to the current logical clock instant and records reason as decision_note"
          - "increments PointTransfer.version by 1 and both Donor.version values by 1"
        note: "Compensating edge: approve followed by reverse must conserve the certified-points total across the donor pair."

  - entity: Section
    state_field: renovation_status
    initial_state: NONE
    terminal_states: [ABANDONED]
    transitions:
      - from: NONE
        to: SURVEYED
        trigger: "POST /athletics/sections/{id}/renovation with renovation_action SURVEY"
        actor: PlatformAdmin
        preconditions:
          - "renovation_status is NONE"
          - "status is OPEN"
          - "expected_section_version matches Section.version"
        side_effects:
          - "sets status to UNDER_RENOVATION, which blocks every pick into this section"
          - "increments Section.version by 1"
      - from: SURVEYED
        to: REPRICED
        trigger: "POST /athletics/sections/{id}/renovation with renovation_action REPRICE"
        actor: PlatformAdmin
        preconditions:
          - "renovation_status is SURVEYED"
          - "post_renovation_capacity and post_renovation_requirement_cents are both present"
          - "expected_section_version matches Section.version"
        side_effects:
          - "stores post_renovation_capacity and post_renovation_requirement_cents without applying them yet"
          - "increments Section.version by 1"
      - from: REPRICED
        to: RESEATING
        trigger: "POST /athletics/sections/{id}/renovation with renovation_action START_RESEATING"
        actor: PlatformAdmin
        preconditions:
          - "renovation_status is REPRICED"
          - "reseating_recalculation_id references a PointRecalculation in status CERTIFIED"
          - "expected_section_version matches Section.version"
        side_effects:
          - "replaces seat_capacity with post_renovation_capacity and per_seat_requirement_cents with post_renovation_requirement_cents"
          - "appends { cycle_year, per_seat_requirement_cents } to requirement_history using the reseating recalculation's cycle_year"
          - "recomputes requirement_cents on every HELD or ASSIGNED SeatAssignment in the section under its own pricing_mode"
          - "sets reseated_donor_count and computes reseating_invoice_total_cents by rounding each seat's prorated share before summing"
          - "moves every affected SeatAssignment's payment_status to INVOICED"
          - "increments Section.version by 1"
      - from: RESEATING
        to: COMPLETED
        trigger: "POST /athletics/sections/{id}/renovation with renovation_action COMPLETE"
        actor: PlatformAdmin
        preconditions:
          - "renovation_status is RESEATING"
          - "expected_section_version matches Section.version"
        side_effects:
          - "sets status back to OPEN, unblocking picks"
          - "recomputes pricing_posture from the post-reseating underwater ratio"
          - "increments Section.version by 1"
      - from: SURVEYED
        to: ABANDONED
        trigger: "POST /athletics/sections/{id}/renovation with renovation_action ABANDON"
        actor: PlatformAdmin
        preconditions:
          - "renovation_status is SURVEYED or REPRICED"
          - "expected_section_version matches Section.version"
        side_effects:
          - "sets status back to OPEN"
          - "clears post_renovation_capacity and post_renovation_requirement_cents"
          - "increments Section.version by 1"
      - from: REPRICED
        to: ABANDONED
        trigger: "POST /athletics/sections/{id}/renovation with renovation_action ABANDON"
        actor: PlatformAdmin
        preconditions:
          - "renovation_status is SURVEYED or REPRICED"
          - "expected_section_version matches Section.version"
        side_effects:
          - "sets status back to OPEN"
          - "clears post_renovation_capacity and post_renovation_requirement_cents"
          - "increments Section.version by 1"
        note: "ABANDONED is terminal for the renovation dimension while the section's own status returns to OPEN — the two dimensions are independent."

  - entity: Seat
    state_field: seat_status
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "POST /athletics/selection-slots/{id}/pick"
        actor: Donor
        preconditions:
          - "seat_status is AVAILABLE or HELD with spare max_concurrent_holds capacity"
          - "expected_seat_version matches Seat.version"
        side_effects:
          - "creates a SeatAssignment in occupancy_status HELD"
          - "moves one seat out of Section.seats_available into Section.seats_committed_count"
          - "increments Seat.version by 1 and Section.version by 1"
      - from: HELD
        to: ASSIGNED
        trigger: "POST /athletics/seat-assignments/{id}/occupancy with to_status ASSIGNED"
        actor: DevelopmentOfficer
        preconditions:
          - "seat_status is HELD"
        side_effects:
          - "increments Section.assigned_seat_count"
          - "increments Seat.version by 1"
      - from: HELD
        to: AVAILABLE
        trigger: "POST /athletics/seat-assignments/{id}/occupancy with to_status RELEASED"
        actor: DevelopmentOfficer
        preconditions:
          - "seat_status is HELD"
        side_effects:
          - "returns one seat from Section.seats_committed_count to Section.seats_available"
          - "increments Seat.version by 1 and Section.version by 1"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /athletics/seat-assignments/{id}/occupancy with to_status RELEASED"
        actor: DevelopmentOfficer
        preconditions:
          - "seat_status is ASSIGNED"
        side_effects:
          - "returns one seat from Section.seats_committed_count to Section.seats_available"
          - "decrements Section.assigned_seat_count"
          - "increments Seat.version by 1 and Section.version by 1"
      - from: AVAILABLE
        to: DECOMMISSIONED
        trigger: "POST /athletics/sections/{id}/renovation with renovation_action START_RESEATING (system, for seats beyond post_renovation_capacity)"
        actor: system
        preconditions:
          - "seat_status is AVAILABLE"
          - "the seat's ordinal position by created_at ASC exceeds post_renovation_capacity"
        side_effects:
          - "moves one seat from Section.seats_available into Section.decommissioned_seat_count"
          - "increments Seat.version by 1"
        note: "Decommissioning order is by created_at ASC, never by id."

  - entity: SeatAssignment
    state_field: occupancy_status
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: ASSIGNED
        trigger: "POST /athletics/seat-assignments/{id}/occupancy with to_status ASSIGNED"
        actor: DevelopmentOfficer
        preconditions:
          - "occupancy_status is HELD"
          - "expected_seat_assignment_version matches SeatAssignment.version"
          - "amount_paid_cents is at least total_due_cents"
          - "eligibility_status is ELIGIBLE"
        side_effects:
          - "moves Seat.seat_status from HELD to ASSIGNED"
          - "increments Section.assigned_seat_count"
          - "sets any matching RelocationRequest to GRANTED with granted_seat_assignment_id set to this row"
          - "increments SeatAssignment.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /athletics/seat-assignments/{id}/occupancy with to_status RELEASED"
        actor: DevelopmentOfficer
        preconditions:
          - "occupancy_status is HELD"
          - "expected_seat_assignment_version matches SeatAssignment.version"
        side_effects:
          - "sets release_reason from the payload, defaulting to DONOR_RELEASE"
          - "restores the seat to AVAILABLE and the section's seat inventory counters to their pre-pick values"
          - "sets the consuming SelectionSlot back from CONSUMED to FORFEITED"
          - "increments SeatAssignment.version by 1"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /athletics/seat-assignments/{id}/occupancy with to_status RELEASED"
        actor: DevelopmentOfficer
        preconditions:
          - "occupancy_status is ASSIGNED"
          - "expected_seat_assignment_version matches SeatAssignment.version"
        side_effects:
          - "sets release_reason from the payload"
          - "restores the seat to AVAILABLE and decrements Section.assigned_seat_count"
          - "decrements Section.underwater_seat_count when the row was UNDERWATER and recomputes pricing_posture"
          - "increments SeatAssignment.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /athletics/selection-slots/{id}/pick by a later picker on the same seat (system supersede)"
        actor: system
        preconditions:
          - "occupancy_status is HELD"
          - "the prior hold's closed [hold_start, hold_end] window has ended before the new pick instant"
        side_effects:
          - "sets release_reason to SUPERSEDED_BY_NEW_HOLD"
          - "leaves the seat in HELD for the new assignment rather than returning it to AVAILABLE"
          - "increments SeatAssignment.version by 1"

  - entity: SeatAssignment
    state_field: payment_status
    initial_state: UNBILLED
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /athletics/seat-assignments/{id}/billing with to_status INVOICED"
        actor: DevelopmentOfficer
        preconditions:
          - "payment_status is UNBILLED"
        side_effects:
          - "freezes requirement_cents, handling_fee_cents and total_due_cents for this row"
          - "increments SeatAssignment.version by 1"
        note: "The payment axis advances independently of occupancy_status, which may still be HELD or already RELEASED."
      - from: INVOICED
        to: PAID
        trigger: "POST /athletics/seat-assignments/{id}/billing with to_status PAID"
        actor: DevelopmentOfficer
        preconditions:
          - "payment_status is INVOICED or DELINQUENT"
          - "amount_cents is at least total_due_cents"
        side_effects:
          - "sets amount_paid_cents to amount_cents"
          - "increments SeatAssignment.version by 1"
      - from: INVOICED
        to: DELINQUENT
        trigger: "POST /athletics/seat-assignments/{id}/billing with to_status DELINQUENT"
        actor: DevelopmentOfficer
        preconditions:
          - "payment_status is INVOICED"
        side_effects:
          - "increments SeatAssignment.version by 1"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /athletics/seat-assignments/{id}/billing with to_status PAID"
        actor: DevelopmentOfficer
        preconditions:
          - "payment_status is INVOICED or DELINQUENT"
          - "amount_cents is at least total_due_cents"
        side_effects:
          - "sets amount_paid_cents to amount_cents"
          - "increments SeatAssignment.version by 1"
        note: "Cure edge: a delinquent row returns to PAID without touching occupancy_status."
      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "POST /athletics/seat-assignments/{id}/billing with to_status WRITTEN_OFF"
        actor: PlatformAdmin
        preconditions:
          - "payment_status is DELINQUENT"
        side_effects:
          - "leaves amount_paid_cents unchanged"
          - "increments SeatAssignment.version by 1"
      - from: PAID
        to: INVOICED
        trigger: "POST /athletics/sections/{id}/renovation with renovation_action START_RESEATING (system reprice)"
        actor: system
        preconditions:
          - "payment_status is PAID"
          - "the row's requirement_cents changed as part of the reseating cascade"
        side_effects:
          - "raises total_due_cents to the reseating amount, leaving amount_paid_cents as the prior payment"
          - "increments SeatAssignment.version by 1"
        note: "Reseating drags an already-PAID row backwards on the payment axis while occupancy_status is untouched."

  - entity: SelectionEvent
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SLOTS_PUBLISHED
        trigger: "POST /athletics/selection-events/{id}/publish-slots"
        actor: DevelopmentOfficer
        preconditions:
          - "status is DRAFT or SLOTS_STALE"
          - "the parent PointRecalculation is in status CERTIFIED"
          - "the eligible donor pool for this event_type is non-empty"
          - "the last slot's slot_end does not exceed window_end"
        side_effects:
          - "ranks the eligible pool by certified_points DESC, cumulative_giving_cents DESC, consecutive_giving_years DESC, created_at ASC"
          - "creates one SelectionSlot per ranked donor with slot_index, slot_start, slot_end and rank_at_publish"
          - "sets published_slot_count and scheduled_slot_count to the pool size"
          - "increments SelectionEvent.version by 1"
      - from: SLOTS_STALE
        to: SLOTS_PUBLISHED
        trigger: "POST /athletics/selection-events/{id}/publish-slots"
        actor: DevelopmentOfficer
        preconditions:
          - "status is DRAFT or SLOTS_STALE"
          - "the parent PointRecalculation is in status CERTIFIED"
        side_effects:
          - "discards STALE slots and republishes a fresh generation from the current ranking"
          - "returns every BLOCKED RelocationRequest on this event to AWAITING_SELECTION and re-increments Donor.pending_request_count"
          - "increments SelectionEvent.version by 1"
        note: "Republication is the recovery edge that makes the event machine cyclic."
      - from: SLOTS_PUBLISHED
        to: OPEN
        trigger: "POST /athletics/selection-events/{id}/gate with to_status OPEN"
        actor: DevelopmentOfficer
        preconditions:
          - "status is SLOTS_PUBLISHED"
          - "no other SelectionEvent on the same PointRecalculation with an OPEN or SLOTS_PUBLISHED status has a half-open window overlapping this event's window"
        side_effects:
          - "allows picks and relocation requests against this event"
          - "increments SelectionEvent.version by 1"
      - from: SLOTS_PUBLISHED
        to: SLOTS_STALE
        trigger: "POST /athletics/point-recalculations/{id}/certify (system, when ranks shift)"
        actor: system
        preconditions:
          - "this certify marked at least one of the event's SCHEDULED slots STALE"
          - "no SelectionSlot on this event remains in slot_status SCHEDULED"
        side_effects:
          - "moves AWAITING_SELECTION RelocationRequests on this event to BLOCKED"
          - "increments SelectionEvent.version by 1"
      - from: OPEN
        to: SLOTS_STALE
        trigger: "POST /athletics/point-recalculations/{id}/certify (system, when ranks shift)"
        actor: system
        preconditions:
          - "this certify marked at least one of the event's SCHEDULED slots STALE"
          - "no SelectionSlot on this event remains in slot_status SCHEDULED"
        side_effects:
          - "moves AWAITING_SELECTION RelocationRequests on this event to BLOCKED"
          - "increments SelectionEvent.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /athletics/selection-events/{id}/gate with to_status CLOSED"
        actor: DevelopmentOfficer
        preconditions:
          - "status is OPEN"
        side_effects:
          - "moves every remaining SCHEDULED slot to FORFEITED"
          - "denies every AWAITING_SELECTION RelocationRequest on this event"
          - "increments SelectionEvent.version by 1"

  - entity: SelectionSlot
    state_field: slot_status
    initial_state: SCHEDULED
    terminal_states: [CONSUMED, FORFEITED]
    transitions:
      - from: SCHEDULED
        to: CONSUMED
        trigger: "POST /athletics/selection-slots/{id}/pick"
        actor: Donor
        preconditions:
          - "slot_status is SCHEDULED"
          - "X-User-ID equals SelectionSlot.donor_id"
          - "the parent SelectionEvent is in status OPEN"
          - "the current logical clock instant lies in the half-open window [slot_start, slot_end)"
          - "the target seat's Section is in status OPEN"
          - "expected_seat_version matches Seat.version"
        side_effects:
          - "creates the SeatAssignment and decrements SelectionEvent.scheduled_slot_count"
          - "increments SelectionSlot.version by 1"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /athletics/selection-slots/{id}/forfeit"
        actor: Donor
        preconditions:
          - "slot_status is SCHEDULED"
          - "X-User-ID equals SelectionSlot.donor_id"
        side_effects:
          - "decrements SelectionEvent.scheduled_slot_count"
          - "increments SelectionSlot.version by 1"
      - from: SCHEDULED
        to: STALE
        trigger: "POST /athletics/point-recalculations/{id}/certify (system)"
        actor: system
        preconditions:
          - "slot_status is SCHEDULED"
          - "rank_at_publish no longer equals the slot donor's rank_position"
        side_effects:
          - "decrements SelectionEvent.scheduled_slot_count"
          - "increments SelectionSlot.version by 1"
      - from: CONSUMED
        to: FORFEITED
        trigger: "POST /athletics/seat-assignments/{id}/occupancy with to_status RELEASED (system)"
        actor: system
        preconditions:
          - "slot_status is CONSUMED"
          - "the SeatAssignment created through this slot left occupancy HELD"
        side_effects:
          - "increments SelectionSlot.version by 1"
        note: "Release walks a terminal-looking slot to the other terminal state, so CONSUMED is not a lockdown state."

  - entity: RelocationRequest
    state_field: status
    initial_state: AWAITING_SELECTION
    terminal_states: [GRANTED, DENIED, SUPERSEDED]
    transitions:
      - from: AWAITING_SELECTION
        to: BLOCKED
        trigger: "POST /athletics/point-recalculations/{id}/certify (system, via the stale-slot cascade)"
        actor: system
        preconditions:
          - "status is AWAITING_SELECTION"
          - "the referenced SelectionEvent moved to SLOTS_STALE"
        side_effects:
          - "records the cascade reason in decision_note"
          - "decrements Donor.pending_request_count"
          - "increments RelocationRequest.version by 1"
      - from: BLOCKED
        to: AWAITING_SELECTION
        trigger: "POST /athletics/selection-events/{id}/publish-slots"
        actor: DevelopmentOfficer
        preconditions:
          - "status is BLOCKED"
          - "the referenced SelectionEvent returned to SLOTS_PUBLISHED"
        side_effects:
          - "increments Donor.pending_request_count"
          - "increments RelocationRequest.version by 1"
      - from: AWAITING_SELECTION
        to: GRANTED
        trigger: "POST /athletics/relocation-requests/{id}/decide with decision GRANT"
        actor: DevelopmentOfficer
        preconditions:
          - "status is AWAITING_SELECTION"
          - "target_seat_id references an AVAILABLE Seat in target_section_id"
          - "the target section's required_points_per_seat is at most the donor's certified_points"
        side_effects:
          - "creates a SeatAssignment on the target seat with pricing_mode MARKET and sets granted_seat_assignment_id"
          - "releases the current_seat_assignment_id row with release_reason DONOR_RELEASE"
          - "decrements Donor.pending_request_count"
          - "increments RelocationRequest.version by 1"
      - from: AWAITING_SELECTION
        to: DENIED
        trigger: "POST /athletics/relocation-requests/{id}/decide with decision DENY"
        actor: DevelopmentOfficer
        preconditions:
          - "status is AWAITING_SELECTION or BLOCKED"
        side_effects:
          - "records decision_note and decrements Donor.pending_request_count"
          - "increments RelocationRequest.version by 1"
      - from: BLOCKED
        to: DENIED
        trigger: "POST /athletics/selection-events/{id}/gate with to_status CLOSED (system)"
        actor: system
        preconditions:
          - "status is AWAITING_SELECTION or BLOCKED"
        side_effects:
          - "records the closure reason in decision_note"
          - "increments RelocationRequest.version by 1"
      - from: AWAITING_SELECTION
        to: SUPERSEDED
        trigger: "POST /athletics/relocation-requests (system, when the same donor files a newer request)"
        actor: system
        preconditions:
          - "status is AWAITING_SELECTION"
          - "the new request carries the donor's current version in expected_donor_version"
        side_effects:
          - "records the supersede reason in decision_note"
          - "leaves Donor.pending_request_count unchanged because the new request replaces the old one"
          - "increments RelocationRequest.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's version only)
# =============================================================================
concurrency_rules:
  - rule_id: relocation-request-create-stale-donor
    parent_entity: Donor
    write_endpoint: "POST /athletics/relocation-requests"
    occ_field: "expected_donor_version"
    description: |
      Creating a RelocationRequest for a Donor whose version has advanced since
      the client last observed it is rejected. A donor may legitimately file a
      replacement request that supersedes their prior AWAITING_SELECTION request,
      so the second create is not blocked by any state precondition; the stale
      expected_donor_version is the only signal that the writer's view of the
      donor — including the request it is about to supersede — is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: seat-pick-stale-seat
    parent_entity: Seat
    write_endpoint: "POST /athletics/selection-slots/{id}/pick"
    occ_field: "expected_seat_version"
    description: |
      Picking a Seat whose version has advanced since the client last read it is
      rejected. Once a prior hold's closed window has ended, a later picker's
      hold legitimately supersedes it, so no state precondition rejects the
      second pick; the stale expected_seat_version is what tells the server the
      picker chose the seat from an outdated inventory view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: priority_point_score
    trigger: "POST /athletics/point-recalculations/{id}/run, for every Donor, once per variant"
    algorithm: weighted_scoring
    formula: |
      # All arithmetic uses decimal.Decimal with ROUND_HALF_UP; never binary floats.
      # ---- S1: tiered marginal giving points -------------------------------
      # qualifying_cents = sum of Gift.amount_cents over the variant's input set
      # Tier bands are cumulative-giving bands on qualifying_cents:
      #   band 1: [0, GIVING_TIER_1_CENTS)                rate RATE_TIER_1
      #   band 2: [GIVING_TIER_1_CENTS, GIVING_TIER_2_CENTS)  rate RATE_TIER_2
      #   band 3: [GIVING_TIER_2_CENTS, infinity)         rate RATE_TIER_3
      # Each rate is points per POINTS_PER_DOLLAR_UNIT_CENTS of giving (marginal,
      # not average): the portion of qualifying_cents falling in each band is
      # scored at that band's rate and the three products are summed.
      #   S1 = round_half_up(
      #          sum over bands of ((band_cents / POINTS_PER_DOLLAR_UNIT_CENTS) * band_rate), 2)
      # ---- S2/S3: loyalty multiplier ---------------------------------------
      #   loyalty_mult = LOYALTY_MULTIPLIER if consecutive_giving_years >= LOYALTY_STREAK_THRESHOLD
      #                  else Decimal("1.00")
      #   S3 = round_half_up(S1 * loyalty_mult, 2)
      # ---- S4: consecutive-year points -------------------------------------
      #   S4 = min(consecutive_giving_years, STREAK_YEARS_CAP) * STREAK_POINTS_PER_YEAR
      # ---- S5: season-ticket tenure points ---------------------------------
      #   S5 = min(season_ticket_seasons_purchased, TENURE_SEASONS_CAP) * TENURE_POINTS_PER_SEASON
      # ---- S6: alumni-status bonus (status-gated) --------------------------
      #   S6 = ALUMNI_BONUS[alumni_status] if donor_status in {ACTIVE, LAPSED} else 0
      # ---- S7: net transfers -----------------------------------------------
      #   S7 = transferred_points_in - transferred_points_out
      # ---- S8/S9: assembly and floor ---------------------------------------
      #   S8 = S3 + S4 + S5 + S6 + S7 + dispute_adjustment_points
      #   S9 = max(Decimal("0.00"), round_half_up(S8, 2))
      # PROVISIONAL writes S9 to Donor.provisional_points.
      # CERTIFIED writes S3+S4+S5+S6 (the gift-and-attribute part, before S7 and
      # dispute adjustments) to Donor.certified_base_points and the full S9 to
      # Donor.certified_points, then appends one PointLedgerEntry per component
      # per variant.
      # ---- consecutive_giving_years (the streak) ---------------------------
      # A year "qualifies" when the donor has at least one gift in the variant's
      # input set whose cycle_year equals that year.
      #   y = recalculation.cycle_year
      #   if y does not qualify: y = y - 1        # one-year grace, applied once
      #   streak = 0
      #   while y qualifies: streak += 1; y -= 1  # stop at the first gap
      # ---- season_ticket_seasons_purchased ---------------------------------
      # Count of POST /athletics/donors/{id}/season-ticket-renewals cycle_year
      # values recorded for the donor, each cycle_year counted once.
    input_set: |
      Gifts belonging to the donor with gift_date at or before the
      recalculation's cutoff_date and designation in {ATHLETICS_ANNUAL,
      CAPITAL}; ENDOWMENT gifts never score. The variant decides which
      gift_status values are admitted. Donors in donor_status DECEASED,
      DISSOLVED_ENTITY or SUSPENDED are still scored (so their balances stay
      transferable) but forfeit the alumni bonus.
    constants:
      POINTS_PER_DOLLAR_UNIT_CENTS: 100000
      GIVING_TIER_1_CENTS: 2500000
      GIVING_TIER_2_CENTS: 10000000
      RATE_TIER_1: 1.0
      RATE_TIER_2: 1.5
      RATE_TIER_3: 2.0
      LOYALTY_STREAK_THRESHOLD: 5
      LOYALTY_MULTIPLIER: 1.10
      STREAK_YEARS_CAP: 20
      STREAK_POINTS_PER_YEAR: 5
      TENURE_SEASONS_CAP: 30
      TENURE_POINTS_PER_SEASON: 3
      ALUMNI_BONUS_ALUMNUS: 25
      ALUMNI_BONUS_FACULTY_STAFF: 15
      ALUMNI_BONUS_STUDENT: 5
      ALUMNI_BONUS_NON_ALUMNUS: 0
    precision: "2 decimal places, round_half_up; the loyalty multiplier is applied to the rounded S1, not to the raw band products"
    variants:
      - name: PROVISIONAL
        when: "written on every run; the figure quoted to donors in the recalculation communication"
        difference: "admits gift_status PLEDGED as well as RECEIVED, so unsettled pledges both raise the tiered giving points and can carry the consecutive-year streak"
      - name: CERTIFIED
        when: "written on every run and frozen at certify; the figure that drives ranking, slotting and seat eligibility"
        difference: "admits gift_status RECEIVED only, so a PLEDGED gift is excluded from the giving bands and its cycle_year does not qualify for the streak — the same donor data yields a strictly lower score whenever any qualifying pledge is unsettled"

  - name: certified_points_derivation
    trigger: "after any change to Donor.transferred_points_in, transferred_points_out or dispute_adjustment_points, and at the end of every recalculation run"
    algorithm: aggregation
    formula: |
      certified_points = max(
        Decimal("0.00"),
        round_half_up(
          certified_base_points
          + transferred_points_in
          - transferred_points_out
          + dispute_adjustment_points, 2))
      # certified_base_points is NEVER re-derived outside a recalculation run, so
      # a donor_status change to DECEASED does not retroactively strip the alumni
      # bonus from an already-certified cycle.
    input_set: "the single Donor row; no gift scan"
    constants: {}
    precision: "2 decimal places, round_half_up, floored at 0.00"
    variants: []

  - name: seat_requirement_amount
    trigger: "POST /athletics/selection-slots/{id}/pick, POST /athletics/relocation-requests/{id}/decide, and the reseating cascade"
    algorithm: threshold
    formula: |
      years_held = event_cycle_year - first_occupied_cycle_year
      # event_cycle_year is the cycle_year of the PointRecalculation that owns the
      # SelectionEvent (or the reseating recalculation during a reseating).
      if pricing_mode == RENEWAL:
        escalated = round_half_up(
            grandfathered_requirement_cents
            * (RENEWAL_ESCALATOR ** years_held))
        ceiling  = round_half_up(
            section.per_seat_requirement_cents * RENEWAL_CEILING_RATIO)
        requirement_cents = min(escalated, ceiling)
      else:  # MARKET
        requirement_cents = section.per_seat_requirement_cents
      # grandfathered_requirement_cents is the per_seat_requirement_cents recorded
      # in Section.requirement_history for first_occupied_cycle_year; when no such
      # entry exists the current market rate is used and pricing_mode is MARKET.
    input_set: "the target Section, its requirement_history, and the donor's prior SeatAssignment in that section when one exists in occupancy_status ASSIGNED"
    constants:
      RENEWAL_ESCALATOR: 1.03
      RENEWAL_CEILING_RATIO: 0.85
    precision: "integer cents, round_half_up on the escalated figure and on the ceiling before comparison"
    variants:
      - name: RENEWAL
        when: "the donor already holds an ASSIGNED SeatAssignment in the same Section from an earlier cycle_year"
        difference: "prices from the grandfathered rate compounded by RENEWAL_ESCALATOR per year held, capped at RENEWAL_CEILING_RATIO of the current market rate — a repriced section therefore charges a renewing donor materially less than a new donor"
      - name: MARKET
        when: "the donor has no prior ASSIGNED SeatAssignment in the section, or the row was created by relocation-request decide"
        difference: "charges the section's current per_seat_requirement_cents with no escalator and no ceiling"

  - name: reseating_invoice_total
    trigger: "POST /athletics/sections/{id}/renovation with renovation_action START_RESEATING"
    algorithm: aggregation
    formula: |
      # Per-seat proration for the remaining months of the cycle, then summed.
      # ORDER IS LOAD-BEARING: each seat's share is rounded to whole cents BEFORE
      # the sum. Summing the raw shares and rounding once at the end produces a
      # different total.
      total = 0
      for each SeatAssignment a in the section with occupancy_status in {HELD, ASSIGNED},
          ordered by created_at ASC:
        share = round_half_up(
            a.requirement_cents * RESEATING_PRORATION_NUMERATOR
            / RESEATING_PRORATION_DENOMINATOR)
        a.requirement_cents = share
        total = total + share
      section.reseating_invoice_total_cents = total
      section.reseated_donor_count = count of rows visited
    input_set: "SeatAssignment rows on the section's seats in occupancy_status HELD or ASSIGNED, visited in created_at ASC order"
    constants:
      RESEATING_PRORATION_NUMERATOR: 7
      RESEATING_PRORATION_DENOMINATOR: 12
    precision: "integer cents, round_half_up per seat before summing"
    variants: []

  - name: postseason_allocation_charge
    trigger: "POST /athletics/selection-slots/{id}/pick when the SelectionEvent's event_type is POSTSEASON or AWAY_GAME"
    algorithm: tiered_pricing
    formula: |
      base_total_cents = requirement_cents          # from seat_requirement_amount
      # The handling tier is keyed on base_total_cents, NOT on total_due_cents.
      if base_total_cents < HANDLING_TIER_1_CENTS:
        rate = HANDLING_RATE_LOW
      elif base_total_cents < HANDLING_TIER_2_CENTS:
        rate = HANDLING_RATE_MID
      else:
        rate = HANDLING_RATE_HIGH
      handling_fee_cents = round_half_up(base_total_cents * rate)
      total_due_cents    = base_total_cents + handling_fee_cents
      # SEASON_TICKET events set handling_fee_cents to 0 and
      # total_due_cents to base_total_cents.
    input_set: "the single SeatAssignment being created, plus its SelectionEvent's event_type"
    constants:
      HANDLING_TIER_1_CENTS: 50000
      HANDLING_TIER_2_CENTS: 250000
      HANDLING_RATE_LOW: 0.06
      HANDLING_RATE_MID: 0.04
      HANDLING_RATE_HIGH: 0.02
    precision: "integer cents, round_half_up; the rate decreases as the base rises, so keying the tier off the fee-inclusive total selects the wrong band near a boundary"
    variants: []

  - name: transfer_cap_evaluation
    trigger: "POST /athletics/point-transfers (creation)"
    algorithm: threshold
    formula: |
      transfer_pct_cap = TRANSFER_PCT_CAP_BY_BASIS[basis]
      max_transferable_points = round_half_up(
          source_donor.certified_points * transfer_pct_cap, 2)
      # The factual precondition per basis, evaluated against the source donor:
      #   DEATH                       -> source_donor.donor_status == DECEASED
      #   DIVORCE                     -> source_donor.entity_type == JOINT_HOUSEHOLD
      #                                  and household_partner_donor_id equals
      #                                  recipient_donor_id
      #   ENTITY_DISSOLUTION          -> source_donor.donor_status == DISSOLVED_ENTITY
      #   ENTITY_GIVING_REALIGNMENT   -> source_donor.entity_type in
      #                                  {CORPORATION, FOUNDATION}
      exception_required = not precondition_holds
      # exception_required true means the transfer is created in EXCEPTION_PENDING
      # and cannot be approved until a PolicyCommittee grant arrives.
    input_set: "the source Donor row and the recipient Donor row"
    constants:
      TRANSFER_PCT_CAP_DEATH: 1.00
      TRANSFER_PCT_CAP_DIVORCE: 0.50
      TRANSFER_PCT_CAP_ENTITY_DISSOLUTION: 1.00
      TRANSFER_PCT_CAP_ENTITY_GIVING_REALIGNMENT: 0.25
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: donor_rank_position
    trigger: "POST /athletics/point-recalculations/{id}/certify and POST /athletics/selection-events/{id}/publish-slots"
    algorithm: chronological
    formula: |
      # 1. Build the candidate pool for the event.
      eligible = every Donor where
            donor_status in {ACTIVE, LAPSED}
        and certified_points >= event.eligible_donor_min_points
        and (event.event_type == SEASON_TICKET
             or the donor holds at least one SeatAssignment in
                occupancy_status ASSIGNED)
      # 2. Order the pool. Every key is a stored business field; the final
      #    tie-break is created_at ASC. Donor.id is NEVER a ranking input.
      order by certified_points          DESC,
               cumulative_giving_cents   DESC,
               consecutive_giving_years  DESC,
               created_at                ASC
      # 3. rank_position is the 1-based index in that order; ties are impossible
      #    because created_at is unique per donor.
      # 4. An empty pool is an error, not an empty publication:
      #    raise ERR_NO_ELIGIBLE_DONORS.
    input_set: "all Donor rows, filtered by the eligibility clause above; POSTSEASON and AWAY_GAME events reuse the identical ordering but restrict the pool to existing season-ticket holders"
    constants: {}
    precision: "integer rank starting at 1"
    variants:
      - name: SEASON_TICKET_POOL
        when: "event_type is SEASON_TICKET"
        difference: "admits every ACTIVE or LAPSED donor above the points floor, whether or not they currently hold a seat"
      - name: EXISTING_HOLDER_POOL
        when: "event_type is POSTSEASON or AWAY_GAME"
        difference: "additionally requires at least one SeatAssignment in occupancy_status ASSIGNED, so a high-point donor with no assigned seat is excluded from the identical ranking"

  - name: slot_window_assignment
    trigger: "POST /athletics/selection-events/{id}/publish-slots"
    algorithm: interval_merge
    formula: |
      for k, donor in enumerate(ranked_pool):        # k is 0-based
        slot_index = k
        slot_start = window_start + (k * (slot_minutes + slot_buffer_minutes)) minutes
        slot_end   = slot_start + slot_minutes minutes
      # Each slot is the HALF-OPEN interval [slot_start, slot_end): a pick at
      # exactly slot_end belongs to the next slot, never to this one.
      # Overflow guard: if the last slot's slot_end is strictly after window_end,
      # nothing is published and ERR_SLOT_WINDOW_OVERFLOW is returned.
      # Event windows on the same PointRecalculation are also half-open, so two
      # events may touch at a shared boundary instant without overlapping; any
      # true interior overlap is rejected with ERR_SELECTION_WINDOW_OVERLAP.
      # Seat hold windows use the OPPOSITE convention: [hold_start, hold_end] is
      # CLOSED, so a pick at exactly a prior hold's hold_end collides with it.
    input_set: "the ranked donor pool from donor_rank_position and the event's window_start, window_end, slot_minutes and slot_buffer_minutes"
    constants:
      HOLD_MINUTES: 4320
    precision: "whole minutes; instants are ISO 8601 UTC with three fractional digits"
    variants: []

  - name: section_pricing_posture
    trigger: "any change to a Section's underwater_seat_count, assigned_seat_count or seats_available"
    algorithm: threshold
    formula: |
      underwater_ratio = Decimal(underwater_seat_count) / Decimal(max(1, assigned_seat_count))
      # The branch order is pinned; SOFT is evaluated first and wins outright.
      if underwater_ratio >= SOFT_POSTURE_RATIO:
        pricing_posture = SOFT
      elif underwater_ratio == 0 and seats_available == 0:
        pricing_posture = PREMIUM
      else:
        pricing_posture = NORMAL
    input_set: "the single Section row's derived counters"
    constants:
      SOFT_POSTURE_RATIO: 0.30
    precision: "ratio to 4 decimal places, round_half_up, compared with >="
    variants: []

  - name: section_seat_inventory
    trigger: "every Seat creation, pick, occupancy change and reseating decommission"
    algorithm: aggregation
    formula: |
      seat_row_count            = count of Seat rows in the section
      seats_available           = count with seat_status AVAILABLE
      seats_committed_count     = count with seat_status in {HELD, ASSIGNED}
      decommissioned_seat_count = count with seat_status DECOMMISSIONED
      # Invariant that must hold after EVERY request, including cascades:
      #   seats_available + seats_committed_count + decommissioned_seat_count
      #     == seat_row_count
      assigned_seat_count   = count of SeatAssignment rows on the section's seats
                              with occupancy_status in {HELD, ASSIGNED}
      underwater_seat_count = the same set restricted to eligibility_status UNDERWATER
      # Seat creation is refused once seat_row_count would exceed seat_capacity:
      #   ERR_SECTION_CAPACITY_EXCEEDED.
    input_set: "the section's Seat rows and the SeatAssignment rows on those seats"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: donor_retention_analysis
    trigger: "GET /athletics/point-recalculations/{id}/retention-analysis"
    algorithm: aggregation
    formula: |
      # Buckets are keyed on the streak the recalculation actually computed.
      retained_donor_count    = donors with consecutive_giving_years >= RETENTION_STREAK_FLOOR
      new_donor_count         = donors with consecutive_giving_years == 1
      lapsed_risk_donor_count = donors with consecutive_giving_years == 0
                                and cumulative_giving_cents > 0
      denominator   = max(1, retained_donor_count + lapsed_risk_donor_count)
      retention_rate = round_half_up(
          Decimal(retained_donor_count) / Decimal(denominator), 4)
      average_certified_points = round_half_up(
          sum of certified_points over all scored donors
          / Decimal(max(1, donors_processed_count)), 2)
      # Inline response payload:
      # { cycle_year, donors_processed_count, retained_donor_count,
      #   new_donor_count, lapsed_risk_donor_count, retention_rate,
      #   average_certified_points, certified_points_sum }
    input_set: "every Donor scored by the referenced PointRecalculation; the recalculation must be in status CERTIFIED"
    constants:
      RETENTION_STREAK_FLOOR: 2
    precision: "retention_rate to 4 decimal places, average_certified_points to 2, both round_half_up"
    variants: []

  - name: section_pricing_sensitivity
    trigger: "GET /athletics/sections/{id}/pricing-sensitivity"
    algorithm: threshold
    formula: |
      underwater_ratio = round_half_up(
          Decimal(underwater_seat_count) / Decimal(max(1, assigned_seat_count)), 4)
      if pricing_posture == SOFT:
        recommended_requirement_cents = round_half_up(
            per_seat_requirement_cents * SOFT_ADJUSTMENT_RATIO)
      elif pricing_posture == PREMIUM:
        recommended_requirement_cents = round_half_up(
            per_seat_requirement_cents * PREMIUM_ADJUSTMENT_RATIO)
      else:
        recommended_requirement_cents = per_seat_requirement_cents
      # Inline response payload:
      # { section_code, per_seat_requirement_cents, required_points_per_seat,
      #   assigned_seat_count, underwater_seat_count, underwater_ratio,
      #   pricing_posture, recommended_requirement_cents,
      #   requirement_history }
    input_set: "the single Section row and its derived counters"
    constants:
      SOFT_ADJUSTMENT_RATIO: 0.90
      PREMIUM_ADJUSTMENT_RATIO: 1.10
    precision: "integer cents, round_half_up; underwater_ratio to 4 decimal places"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in priority order;
# the first violated rule determines the response and no later rule runs)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles listed on the endpoint"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for the Donor role, X-User-ID equals the donor_id of the targeted PointDispute, SelectionSlot, RelocationRequest or SeatAssignment"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /athletics/point-disputes, POST /athletics/point-disputes/{id}/provide-info, POST /athletics/selection-slots/{id}/pick, POST /athletics/selection-slots/{id}/forfeit, POST /athletics/relocation-requests"
  - priority: 4
    category: auth
    check: "segregation of duties: X-User-ID differs from PointRecalculation.initiated_by_user_id at certify, and from PointDispute.reviewed_by_user_id at decide"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /athletics/point-recalculations/{id}/certify, POST /athletics/point-disputes/{id}/decide"
  - priority: 5
    category: existence
    check: "every path id resolves, checked left to right"
    error_id: "ERR_DONOR_NOT_FOUND | ERR_GIFT_NOT_FOUND | ERR_RECALCULATION_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_TRANSFER_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_SEAT_NOT_FOUND | ERR_SEAT_ASSIGNMENT_NOT_FOUND | ERR_SELECTION_EVENT_NOT_FOUND | ERR_SELECTION_SLOT_NOT_FOUND | ERR_RELOCATION_REQUEST_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 6
    category: existence
    check: "request body parses, required fields present, enum values recognised, numeric and string constraints respected, pagination limit within 1..100 and offset at least 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: business_referential
    check: "every id supplied in the request body resolves to an existing row"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /athletics/donors/{id}/household-link, POST /athletics/point-disputes, POST /athletics/point-transfers, POST /athletics/sections/{id}/renovation, POST /athletics/selection-slots/{id}/pick, POST /athletics/relocation-requests, POST /athletics/relocation-requests/{id}/decide"
  - priority: 8
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /athletics/donors/{id}/status-change, POST /athletics/donors/{id}/household-link, POST /athletics/point-recalculations/{id}/certify, POST /athletics/point-transfers, POST /athletics/sections/{id}/reprice, POST /athletics/sections/{id}/renovation, POST /athletics/selection-slots/{id}/pick, POST /athletics/seat-assignments/{id}/occupancy, POST /athletics/relocation-requests"
  - priority: 9
    category: state
    check: "the target resource's current state admits the requested transition per §1.2; two carve-outs report a more specific error instead of ERR_INVALID_STATE — approve on a PointTransfer in status EXCEPTION_PENDING is reported by priority 13 as ERR_TRANSFER_POLICY_EXCEPTION_REQUIRED, and a pick on a SelectionSlot in slot_status STALE whose parent SelectionEvent is in status SLOTS_STALE is reported by priority 12 as ERR_EVENT_SLOTS_STALE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 10
    category: state
    check: "the PointRecalculation the operation depends on is in status CERTIFIED"
    error_id: ERR_RECALCULATION_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /athletics/selection-events/{id}/publish-slots, POST /athletics/sections/{id}/renovation with renovation_action START_RESEATING, GET /athletics/point-recalculations/{id}/retention-analysis"
  - priority: 11
    category: state
    check: "the Section holding the target seat is in status OPEN, not UNDER_RENOVATION or CLOSED"
    error_id: ERR_SECTION_UNDER_RENOVATION
    http_status: 409
    applies_to: "POST /athletics/selection-slots/{id}/pick, POST /athletics/relocation-requests/{id}/decide, POST /athletics/sections/{id}/seats"
  - priority: 12
    category: state
    check: "the SelectionEvent is in status OPEN for picks, and in SLOTS_PUBLISHED or OPEN for relocation requests; an event in SLOTS_STALE accepts neither, and a pick on one of its STALE slots reports ERR_EVENT_SLOTS_STALE here rather than priority 9's ERR_INVALID_STATE"
    error_id: "ERR_EVENT_SLOTS_STALE | ERR_EVENT_NOT_OPEN_FOR_REQUESTS"
    http_status: 409
    applies_to: "POST /athletics/selection-slots/{id}/pick, POST /athletics/relocation-requests"
  - priority: 13
    category: business_safety
    check: "a PointTransfer whose basis precondition does not hold may not be approved until a PolicyCommittee exception has been granted; approve on a transfer still in status EXCEPTION_PENDING reports ERR_TRANSFER_POLICY_EXCEPTION_REQUIRED here rather than priority 9's ERR_INVALID_STATE"
    error_id: ERR_TRANSFER_POLICY_EXCEPTION_REQUIRED
    http_status: 422
    applies_to: "POST /athletics/point-transfers/{id}/approve"
  - priority: 14
    category: business_temporal
    check: "the current logical clock instant lies inside the half-open window [slot_start, slot_end) of the slot being consumed"
    error_id: ERR_OUTSIDE_SLOT_WINDOW
    http_status: 422
    applies_to: "POST /athletics/selection-slots/{id}/pick"
  - priority: 15
    category: business_temporal
    check: "the current logical clock instant is strictly before the parent recalculation's dispute_window_end"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /athletics/point-disputes, POST /athletics/point-disputes/{id}/decide"
  - priority: 16
    category: business_constraint
    check: "the event's half-open window does not overlap the window of another SLOTS_PUBLISHED or OPEN event on the same PointRecalculation; touching at a shared boundary instant is permitted"
    error_id: ERR_SELECTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /athletics/selection-events/{id}/gate"
  - priority: 17
    category: business_constraint
    check: "the target Seat is not already ASSIGNED and not DECOMMISSIONED"
    error_id: ERR_SEAT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /athletics/selection-slots/{id}/pick, POST /athletics/relocation-requests/{id}/decide"
  - priority: 18
    category: business_constraint
    check: "the number of hold windows on the seat whose closed [hold_start, hold_end] intervals contain the pick instant is below Seat.max_concurrent_holds"
    error_id: ERR_SEAT_HOLD_CONFLICT
    http_status: 409
    applies_to: "POST /athletics/selection-slots/{id}/pick"
  - priority: 19
    category: business_constraint
    check: "PointDispute.info_request_rounds is below INFO_REQUEST_ROUND_CAP"
    error_id: ERR_INFO_REQUEST_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /athletics/point-disputes/{id}/request-info"
  - priority: 20
    category: business_constraint
    check: "the eligible donor pool for the event is non-empty"
    error_id: ERR_NO_ELIGIBLE_DONORS
    http_status: 422
    applies_to: "POST /athletics/selection-events/{id}/publish-slots"
  - priority: 21
    category: business_constraint
    check: "the last computed slot's slot_end does not exceed the event's window_end"
    error_id: ERR_SLOT_WINDOW_OVERFLOW
    http_status: 422
    applies_to: "POST /athletics/selection-events/{id}/publish-slots"
  - priority: 22
    category: business_constraint
    check: "a household link targets a different donor, both donors have entity_type JOINT_HOUSEHOLD, and neither is already linked to a third donor"
    error_id: ERR_HOUSEHOLD_LINK_INVALID
    http_status: 409
    applies_to: "POST /athletics/donors/{id}/household-link"
  - priority: 23
    category: business_constraint
    check: "for a granted relocation, target_seat_id is present and belongs to target_section_id"
    error_id: ERR_RELOCATION_TARGET_INVALID
    http_status: 422
    applies_to: "POST /athletics/relocation-requests/{id}/decide"
  - priority: 24
    category: business_constraint
    check: "the donor's certified_points is at least the target section's required_points_per_seat"
    error_id: ERR_SEAT_POINTS_SHORTFALL
    http_status: 422
    applies_to: "POST /athletics/selection-slots/{id}/pick, POST /athletics/relocation-requests/{id}/decide"
  - priority: 25
    category: business_fiscal
    check: "amount_cents covers total_due_cents when marking a SeatAssignment PAID, amount_paid_cents covers total_due_cents when moving occupancy to ASSIGNED, and the donor's current assignment is fully paid when a relocation request is filed"
    error_id: ERR_SEAT_DONATION_SHORTFALL
    http_status: 402
    applies_to: "POST /athletics/seat-assignments/{id}/billing, POST /athletics/seat-assignments/{id}/occupancy, POST /athletics/relocation-requests"
  - priority: 26
    category: business_fiscal
    check: "points_amount is at most both max_transferable_points and the source donor's current certified_points"
    error_id: ERR_TRANSFER_AMOUNT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /athletics/point-transfers, POST /athletics/point-transfers/{id}/approve"
  - priority: 27
    category: business_fiscal
    check: "creating a Seat would not push Section.seat_row_count above Section.seat_capacity"
    error_id: ERR_SECTION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /athletics/sections/{id}/seats"

# =============================================================================
# Table 5: API Endpoint Table
#
# Path shape is deliberately uniform so the FK reverse-reachability contract in
# §1.5 is mechanically checkable: every collection is one segment under
# /athletics, every resource placeholder is literally {id}, and every
# sub-resource hangs directly off /<collection>/{id}/. Every list endpoint
# accepts limit and offset with the §1.0 defaults.
# =============================================================================
endpoints:
  # ---- reads ---------------------------------------------------------------
  - method: GET
    path: "/athletics/donors"
    description: "List donors with filtering; the reverse-reachability channel for the self-referential household link."
    roles: [DevelopmentOfficer, PointsCertifier, DisputeAnalyst, PolicyCommittee, PlatformAdmin]
    code: 200
    input: ["donor_status?", "alumni_status?", "entity_type?", "household_partner_donor_id?", "min_certified_points?", "sort?", "limit?", "offset?"]
    output: Donor[]
    side_effects: []
  - method: GET
    path: "/athletics/donors/{id}"
    description: "Fetch one donor, including every derived point component and rank_position."
    roles: [DevelopmentOfficer, PointsCertifier, DisputeAnalyst, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: GET
    path: "/athletics/donors/{id}/gifts"
    description: "List the donor's gifts; the reverse-reachability channel for Gift.donor_id."
    roles: [DevelopmentOfficer, PointsCertifier, DisputeAnalyst, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: ["gift_status?", "cycle_year?", "designation?", "limit?", "offset?"]
    output: Gift[]
    side_effects: []
  - method: GET
    path: "/athletics/donors/{id}/point-transfers"
    description: "List transfers where the donor is either source or recipient; the reverse-reachability channel for both PointTransfer donor FKs."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: ["status?", "basis?", "limit?", "offset?"]
    output: PointTransfer[]
    side_effects: []
  - method: GET
    path: "/athletics/point-ledger-entries"
    description: "List immutable point-ledger entries; the reverse-reachability channel for both PointLedgerEntry FKs."
    roles: [DevelopmentOfficer, PointsCertifier, DisputeAnalyst, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: ["donor_id?", "recalculation_id?", "entry_type?", "variant?", "limit?", "offset?"]
    output: PointLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/athletics/point-ledger-entries/{id}"
    description: "Fetch one point-ledger entry; the entry carries no version field because it is append-only."
    roles: [DevelopmentOfficer, PointsCertifier, DisputeAnalyst, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: []
    output: PointLedgerEntry
    side_effects: []
  - method: GET
    path: "/athletics/point-recalculations/{id}"
    description: "Fetch one annual recalculation, including its version for the certify OCC check."
    roles: [DevelopmentOfficer, PointsCertifier, DisputeAnalyst, PolicyCommittee, PlatformAdmin]
    code: 200
    input: []
    output: PointRecalculation
    side_effects: []
  - method: GET
    path: "/athletics/point-recalculations/{id}/selection-events"
    description: "List the recalculation's selection events; the reverse-reachability channel for SelectionEvent.recalculation_id."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: ["event_type?", "status?", "limit?", "offset?"]
    output: SelectionEvent[]
    side_effects: []
  - method: GET
    path: "/athletics/point-recalculations/{id}/retention-analysis"
    description: "Computed read: donor retention buckets and averages for a CERTIFIED recalculation, per the donor_retention_analysis calculation."
    roles: [DevelopmentOfficer, PointsCertifier, PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: []
  - method: GET
    path: "/athletics/point-disputes"
    description: "List point disputes; the reverse-reachability channel for both PointDispute FKs."
    roles: [DevelopmentOfficer, DisputeAnalyst, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: ["donor_id?", "recalculation_id?", "status?", "limit?", "offset?"]
    output: PointDispute[]
    side_effects: []
  - method: GET
    path: "/athletics/point-disputes/{id}"
    description: "Fetch one dispute, including info_request_rounds and the review/decision user ids."
    roles: [DevelopmentOfficer, DisputeAnalyst, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: []
    output: PointDispute
    side_effects: []
  - method: GET
    path: "/athletics/sections"
    description: "List sections; the reverse-reachability channel for Section.reseating_recalculation_id."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: ["status?", "renovation_status?", "reseating_recalculation_id?", "pricing_posture?", "venue_code?", "limit?", "offset?"]
    output: Section[]
    side_effects: []
  - method: GET
    path: "/athletics/sections/{id}"
    description: "Fetch one section, including its seat inventory counters, requirement_history and version for the renovation OCC checks."
    roles: [DevelopmentOfficer, PointsCertifier, PolicyCommittee, PlatformAdmin, Donor]
    code: 200
    input: []
    output: Section
    side_effects: []
  - method: GET
    path: "/athletics/sections/{id}/seats"
    description: "List the section's seats; the reverse-reachability channel for Seat.section_id."
