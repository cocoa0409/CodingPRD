      - name: state_vs_business_safety_on_run_start
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Error-category pair state (ERR_INVALID_STATE, priority 4) vs business_safety
          (ERR_QUALITY_HOLD, priority 5): a run start where the run is already
          COMPLETED AND its coil is QUARANTINED must return ERR_INVALID_STATE, because
          priority 4 is checked before priority 5.
        test_recipe:
          setup:
            - "A run that was COMPLETED, then its coil QUARANTINED via a tier-3 audit FAIL"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /api/customers"
              payload: { name: "Theta Auto", customer_code: "THETA", steel_index_basis: "CRU_HRC", base_index_value: 900, pass_through_pct: 0.5 }
              as: PlantAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/parts"
              payload: { customer_id: "${cust_id}", part_number: "P-800", material_spec: "HSLA340", thickness_mm: 1.2, net_weight_kg: 0.62, base_piece_price_cents: 1800, ppap_required_level: 1 }
              as: ProcessEngineer
              captures: { part_id: $.data.id, part_ver: $.data.version }
