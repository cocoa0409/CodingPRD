        claim_type: Variant Selection
        grounds:
          - calculations.estimated_apr
          - calculations.locked_apr
        excluded_because:
          difficulty_instance: dual_variant_calc / estimated_apr_vs_locked_apr_offer
          rationale: "estimate applied at prequal vs final applied at lock (estimated 800 vs locked 775) is the named §1.8 instance."

  # ===========================================================================
  # SECTION 4 — Validations (violation->error, satisfaction->pass)
  # Priority-ordering conflicts already covered by §1.8 priority_pair instances.
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_borrower_email_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=18]
          - errors[ERR_DUPLICATE_KEY]
          - entities.Borrower.fields.email
        distinguishing_aspect: "A second POST /borrowers reusing an existing email returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup:
            - "A borrower already registered with email dup@x.com."
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { email: "dup@x.com", full_name: "First", annual_income_cents: 5000000, fico_band: "PRIME" }
              as: Borrower
          trigger:
            - call: "POST /borrowers"
              payload: { email: "dup@x.com", full_name: "Second", annual_income_cents: 6000000, fico_band: "PRIME" }
              as: Borrower
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_KEY"
            - "HTTP status == 409"

      - name: duplicate_pool_code_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=18]
          - errors[ERR_DUPLICATE_KEY]
          - entities.AbsPool.fields.pool_code
        distinguishing_aspect: "A second POST /abs-pools reusing an existing pool_code returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup:
            - "A pool already exists with pool_code DUP-POOL."
          setup_api_calls:
            - call: "POST /abs-pools"
              payload: { pool_code: "DUP-POOL", max_principal_cents: 10000000, min_fico_band: "SUBPRIME", allowed_rate_type: "ANY" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /abs-pools"
              payload: { pool_code: "DUP-POOL", max_principal_cents: 20000000, min_fico_band: "PRIME", allowed_rate_type: "FIXED" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_KEY"
            - "HTTP status == 409"

