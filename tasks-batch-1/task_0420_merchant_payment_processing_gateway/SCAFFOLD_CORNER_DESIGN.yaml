              payload: { legal_name: "Fee Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
