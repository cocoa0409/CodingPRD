          A DIFFERENT gated pair from the facility instance: (SettlementClaim,
          ScreeningCheck). The claim row is fixed at status LODGED throughout and only
          the governing ScreeningCheck.result moves - HIT_PENDING_REVIEW blocks the
          settle with ERR_SCREENING_NOT_CLEARED and ESCALATED blocks the identical
          request with ERR_DUAL_USE_ESCALATED - so the outcome is a pure function of the
          other entity's state.
