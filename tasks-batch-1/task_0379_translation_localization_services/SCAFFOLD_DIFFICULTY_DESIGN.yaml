          Conserved quantity = SUM of linguist.committed_payout_cents. Forward accept adds the
          provisional payout (15975) to linguist A; the compensating supersede (replacement reviewer/
          translator created) removes exactly 15975, so after supersede A's committed_payout_cents
          returns to 0 — invariant: committed == sum of payout over Assignments in {ACCEPTED,IN_PROGRESS,DELIVERED}.
