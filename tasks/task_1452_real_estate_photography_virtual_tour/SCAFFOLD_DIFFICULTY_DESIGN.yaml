              captures: { j0: "$.data[0].id", j1: "$.data[1].id", j2: "$.data[2].id", j3: "$.data[3].id", j4: "$.data[4].id" }
            - call: "PATCH /shoot-bookings/${b1}/checklist-items/${j0}"
