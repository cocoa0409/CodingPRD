  # =====================================================================
  # Rule 8 — resource_temporal_overlap (≥ 2, different interval semantics, different resources)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pay_period_closed_closed_overlap_on_employee
        grounds:
          - validations[priority=11]
          - errors[ERR_PAY_PERIOD_OVERLAP]
          - endpoints.POST_/paycheck-runs
          - entities.PaycheckRun.fields.pay_period_start
          - entities.PaycheckRun.fields.pay_period_end
        distinguishing_aspect: |
          Closed-closed point-overlap semantics on PaycheckRun pay periods, scoped per affected
          employee: two PaycheckRuns A=[2025-11-01..2025-11-15] and B=[2025-11-15..2025-11-30]
          touch at 2025-11-15. With closed-closed semantics, this single-point touch IS overlap
          when both runs reference at least one common employee — POST /paychecks attaching the
          same employee to run B yields ERR_PAY_PERIOD_OVERLAP. Resource entity: PaycheckRun
          (interval [start,end]). Interval semantics: closed-closed, no buffer, point-touch counts.
        test_recipe:
          setup:
            - "Federal + CA tax tables seeded"
            - "Employee ACTIVE with W4 FILED"
            - "PaycheckRun A DRAFT covering 2025-11-01..2025-11-15 with paycheck for the employee"
            - "PaycheckRun B DRAFT covering 2025-11-15..2025-11-30 (touches A at end-of-day instant) with no paychecks yet"
