          Whether a REPORTABLE event can be recorded as DISCLOSED depends entirely on a DIFFERENT
          entity's state: the linked document must be a CURRENT_REPORT on the same cycle in status
          APPROVED. The identical DISCLOSE request fails with ERR_FILING_DOCUMENT_INVALID while the
          document is IN_REVIEW and succeeds the moment it becomes APPROVED, and the success then runs
          the reverse cascade that drops open_material_event_count back to 0. The event's own fields
