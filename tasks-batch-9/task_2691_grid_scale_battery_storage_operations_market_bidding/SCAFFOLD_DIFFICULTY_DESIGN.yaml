            - "asset B: ${b_acc} == 89.99 == round((1 - 0.5005 / 5) * 100, 2) and ${b_db} == 40.00 — the 17.99 MW sample has error_ratio 0.1005"
            - "asset B one hundredth below the floor: ${b_comp} == 74.99 and ${b_charge} == 0.80 == round((75.00 - 74.99) * 20.0 * 4.00, 2)"
            - "both settle: ${a_scoring} == SETTLED and ${b_scoring} == SETTLED, while ${da_delivered} == 22.5 and ${db_delivered} == 22.498 show the two chains differ only in the fifth sample"
            - "PROVISIONAL parity: ${da_prov_composite} == 75.00 and ${db_prov_composite} == 74.99 — with no late samples the two variants agree on the score, so only the charge term distinguishes them"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_submit_blocked_by_expired_reservation_state
        grounds:
          - state_machines.MarketBid.DRAFT_to_SUBMITTED
          - state_machines.SocReservation.HELD_to_EXPIRED
          - calculations.soc_reservation_availability
          - errors[ERR_RESERVATION_NOT_HELD]
          - endpoints[POST /market-bids/{id}/submit]
        distinguishing_aspect: |
          Entity pair MarketBid <= SocReservation. The bid itself is a perfectly valid DRAFT; it
          cannot be submitted only because the reservation it points at was moved to EXPIRED by
          the create-time expiry sweep of another reservation. A sibling DRAFT bid whose
          reservation is still HELD submits successfully in the same state of the world.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "A1 registered and commissioned"
            - "SocReservation R1 ENERGY_ARBITRAGE 20.0 MWh, window 2026-08-05T00:00:00Z .. 08:00:00Z"
            - "MarketBid B1 DRAFT on R1: DAY_AHEAD ENERGY DISCHARGE 20.0 MW, delivery 2026-08-05T01:00:00Z .. 05:00:00Z"
            - "SocReservation R2 ANCILLARY 20.0 MWh, window 2026-08-20T00:00:00Z .. 08:00:00Z"
            - "MarketBid B2 DRAFT on R2: REAL_TIME REG_UP DISCHARGE 5.0 MW, delivery 2026-08-20T01:00:00Z .. 05:00:00Z"
            - "clock advanced to 2026-08-10T00:00:00Z, then a third reservation is created so the expiry sweep runs and moves R1 to EXPIRED while R2 stays HELD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 20.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T08:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-05T01:00:00Z", delivery_end: "2026-08-05T05:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id, b1_status0: $.data.status }
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { v2: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ANCILLARY", reserved_mwh: 20.0, window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-20T08:00:00Z", expected_asset_version: "${v2}" }
              as: MarketTrader
              captures: { r2: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r2}", market_type: "REAL_TIME", product: "REG_UP", direction: "DISCHARGE", delivery_start: "2026-08-20T01:00:00Z", delivery_end: "2026-08-20T05:00:00Z", offer_mw: 5.0 }
              as: MarketTrader
              captures: { b2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /storage-assets/${a1}"
              payload: {}
              as: AssetManager
              captures: { v3: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 10.0, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z", expected_asset_version: "${v3}" }
              as: MarketTrader
              captures: { r3: $.data.id }
            - call: "GET /soc-reservations/${r1}"
              payload: {}
              as: MarketTrader
              captures: { r1_status: $.data.status, r1_reason: $.data.released_reason }
            - call: "GET /soc-reservations/${r2}"
              payload: {}
              as: MarketTrader
              captures: { r2_status: $.data.status }
          trigger:
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
              captures: { err_dep: $.data.error_id }
            - call: "POST /market-bids/${b2}/submit"
              payload: {}
              as: MarketTrader
              captures: { b2_status: $.data.status, b2_submitter: $.data.submitted_by_user_id }
          assert:
            - "the dependency is established by the sweep, not by the bid: ${r1_status} == EXPIRED with ${r1_reason} == WINDOW_EXPIRED, while ${r2_status} == HELD"
            - "${b1_status0} == DRAFT before the trigger, so the bid's own state is valid"
            - "${err_dep} == ERR_RESERVATION_NOT_HELD with HTTP 409, and MarketBid.${b1}.status == DRAFT is unchanged"
            - "the control path succeeds under the identical asset state: ${b2_status} == SUBMITTED with ${b2_submitter} non-null"
            - "SocReservation.${r3}.status == HELD — the reservation whose creation ran the sweep is itself accepted"

      - name: dispatch_create_requires_cleared_parent_bid
        grounds:
          - state_machines.DispatchInstruction (initial_state PENDING)
          - state_machines.MarketBid.SUBMITTED_to_CLEARED
          - errors[ERR_BID_NOT_CLEARED]
          - endpoints[POST /dispatch-instructions]
        distinguishing_aspect: |
          A different entity pair, DispatchInstruction <= MarketBid, checked at child-creation time
          rather than on a transition of the child. The identical request body is refused with
          ERR_BID_NOT_CLEARED while the parent bid is SUBMITTED and accepted once the market
          operator posts the clearing result, which proves the check reads live parent state.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "A1 registered and commissioned"
            - "SocReservation R1 ENERGY_ARBITRAGE 40.0 MWh, window 2026-08-10T12:00:00Z .. 20:00:00Z"
            - "MarketBid B1 DAY_AHEAD ENERGY DISCHARGE 20.0 MW, delivery 12:00:00Z .. 16:00:00Z, SUBMITTED but not yet cleared"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 20.0 }
              as: MarketTrader
              captures: { b1: $.data.id, b1_price: $.data.offer_price_usd_per_mwh }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
              captures: { b1_status0: $.data.status }
          trigger:
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { err_dep: $.data.error_id }
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 37.00, cleared_mw: 20.0 }
              as: MarketOperator
              captures: { b1_status1: $.data.status, b1_cleared_price: $.data.cleared_price_usd_per_mwh }
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 20.0, setpoint_start: "2026-08-10T14:00:00Z", setpoint_end: "2026-08-10T15:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id, d1_status: $.data.execution_status, d1_direction: $.data.direction, d1_energy: $.data.expected_energy_mwh }
          assert:
            - "${b1_status0} == SUBMITTED before the first trigger"
            - "${err_dep} == ERR_BID_NOT_CLEARED with HTTP 409 and GET /dispatch-instructions?bid_id=${b1} returns total_count 0"
            - "${b1_status1} == CLEARED with ${b1_cleared_price} == 37.00, awarded at exactly the offer floor ${b1_price} == 37.00 (inclusive per validations[priority=29])"
            - "the identical body now succeeds: ${d1_status} == PENDING, ${d1_direction} == DISCHARGE inherited from the bid, ${d1_energy} == 20.0"

      - name: warranty_claim_requires_completed_and_triggered_capacity_test
        grounds:
          - validations[priority=19]
          - state_machines.CapacityTest.IN_PROGRESS_to_COMPLETED
          - calculations.soh_degradation_model
          - errors[ERR_NO_WARRANTY_TRIGGER]
