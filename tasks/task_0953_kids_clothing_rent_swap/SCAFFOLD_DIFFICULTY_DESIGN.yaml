          ENTITY PAIR = (PauseRequest, Shipment). The PauseRequest's REQUESTED -> ACTIVE
          transition is legal on its own row but is refused because a DIFFERENT entity, a
          Shipment belonging to the same member, currently sits in IN_TRANSIT.
        test_recipe:
          setup:
            - "A CORE plan with 1 box slot; one ACTIVE member sized 5."
