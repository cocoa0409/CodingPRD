          rationale: "The Table-2 `cascade down` side-effect pattern for POST /signal-ops/retiming-projects/{id}/implement is the entire subject of that §1.8 transitive_cascade instance, which walks all five links end to end (project -> CERTIFIED plans -> Intersection retiming fields -> Corridor rescore -> COORDINATION complaint requeue) and asserts the per-link ordering plus the untouched non-participants. A second corner test here would be a strict subset of it."

      - name: fine_tuning_cascade_fires_only_for_the_matching_deployed_plan
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: fine_tuning_cascade_four_links_observation_plan_project_evaluation
          rationale: "The `conditional cascade` pattern here is the FieldObservation adjustment path, whose cascade fires only when a DEPLOYED plan matches the observation's (intersection_id, tod_period) and, among matches, only for the greatest created_at. That §1.8 instance already asserts the selected plan, the untouched non-matching plan, and the no-cascade case, so the corner is fully consumed."

      - name: ped_check_waiver_bubbles_up_to_the_parent_plan
        claim_type: bubble_up
        excluded_because:
          difficulty_instance: timing_plan_ped_axis_waiver_advances_while_status_axis_stands_still
          rationale: "The `bubble up` pattern in §1.2 is the PedestrianComplianceCheck waiver setting the parent TimingPlan.ped_compliance_state to WAIVED once no FAIL row remains. That §1.8 non_linear_state_machine instance is built precisely on that bubble-up (including the multi-check case where one FAIL still remains and the parent therefore does NOT flip), leaving nothing for a separate corner test."

      - name: complaint_bucket_counters_stay_in_sync_with_the_complaint_rows
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: project_abandonment_conserves_the_corridor_complaint_partition
          rationale: "The `ledger sync` pattern is the Corridor complaint bucket partition (open/linked/terminal summing to complaint_total_count) tracking every CitizenComplaint transition. That §1.8 compensating_invariant instance reconciles the partition before and after the abandonment cascade against the row-level truth from GET /signal-ops/corridors/{id}/complaints, which is exactly the ledger-sync claim."

      - name: certification_is_guarded_by_the_intersections_posture
        claim_type: guarded_transition
        excluded_because:
          difficulty_instance: timing_plan_certification_depends_on_intersection_operational_posture
          rationale: "`guarded transitions` require a cross-entity precondition of the form 'A -> B only if entity C is in state X'. The one such guard on the TimingPlan machine is SUBMITTED -> CERTIFIED requiring Intersection.operational_posture != BLOCKED, and that §1.8 cross_entity_state_dependency instance already drives the posture from READY to BLOCKED via PATCH and back, asserting both polarities."

