      - name: panel_rating_rejects_an_outsider_and_a_repeat_while_assembly_rejects_a_draft_item
        claim_type: action_endpoint
        grounds:
          - validations[priority=23]
          - validations[priority=25]
          - validations[priority=37]
          - errors.ERR_ITEM_NOT_ELIGIBLE_FOR_FORM
          - errors.ERR_PANELIST_NOT_ON_PANEL
          - errors.ERR_DUPLICATE_PANELIST_RATING
          - endpoints.POST_/forms
          - endpoints.POST_/forms/{id}/panel-ratings
          - entities.ExamForm.computed_fields.panel_status
          - entities.ExamForm.fields.panel_ratings
        distinguishing_aspect: |
          The rating endpoint is guarded on membership and on multiplicity, and assembly is
          guarded on item maturity: a DRAFT item cited as a scored item is refused 422
          ERR_ITEM_NOT_ELIGIBLE_FOR_FORM, a rating for pan-9 who is not in panelist_user_ids is
          refused 422 ERR_PANELIST_NOT_ON_PANEL, and pan-1's second rating is refused 409
          ERR_DUPLICATE_PANELIST_RATING while the first rating's 0.60 survives unchanged — a
          last-write-wins implementation loses that value. panel_status flips to
          RATINGS_COMPLETE only once len(panel_ratings) reaches len(panelist_user_ids) == 2.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX with form_length 1, min_panelists 1 and panel_trim_count 0."
            - "One APPROVED item ${item_id} in domain D1 and one DRAFT item ${draft_id} in the same domain."
            - "No ExamForm exists yet. The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "ready"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "RECALL", "stem": "CPX draft item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { draft_id: "$.data.id" }
          trigger:
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F0", "item_ids": ["${draft_id}"], "panelist_user_ids": ["pan-1", "pan-2"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { e_item: "$.data.error_id" }
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F1", "item_ids": ["${item_id}"], "panelist_user_ids": ["pan-1", "pan-2"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_id: "$.data.id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-9", "mean_expected_pass_rate": 0.55}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { e_outsider: "$.data.error_id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-1", "mean_expected_pass_rate": 0.6}
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-1", "mean_expected_pass_rate": 0.7}
              as: Panelist
              as_user_id: "pan-1"
              captures: { e_dup: "$.data.error_id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-2", "mean_expected_pass_rate": 0.8}
              as: Panelist
              as_user_id: "pan-2"
          assert:
            - "trigger[0] responds 422 with ${e_item} == ERR_ITEM_NOT_ELIGIBLE_FOR_FORM because Item.${draft_id}.status == DRAFT and it is not listed in pretest_item_ids"
            - "${e_item} is not ERR_FORM_LENGTH_MISMATCH — len(item_ids) == 1 == form_length — and no ExamForm row is created"
            - "trigger[1] responds 201 with ExamForm.${form_id}.status == ASSEMBLED, panel_status == OPEN, panel_ratings == [] and scored_item_count == 1"
            - "trigger[2] responds 422 with ${e_outsider} == ERR_PANELIST_NOT_ON_PANEL and leaves panel_ratings == [] with panel_status == OPEN"
            - "after trigger[3] ExamForm.${form_id}.panel_ratings holds exactly one entry {pan-1, 0.60} and panel_status is still OPEN — 1 of 2 panelists have rated"
            - "trigger[4] responds 409 with ${e_dup} == ERR_DUPLICATE_PANELIST_RATING and pan-1's stored mean_expected_pass_rate is still 0.60, not 0.70"
            - "after trigger[5] ExamForm.${form_id}.panel_ratings holds exactly two entries and panel_status == RATINGS_COMPLETE"
            - "ExamForm.${form_id}.raw_cut_score is still null — ratings alone never adopt a cut score"
  # =========================================================================
  - section: rbac
    instances:
      - name: cross_role_writes_are_refused_forbidden_role_while_a_headerless_write_is_unauthenticated
        claim_type: role_denial
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - roles.ItemSpecialist.exclusive_operations
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
          - errors.ERR_UNAUTHENTICATED
          - endpoints.POST_/programs
          - endpoints.POST_/items
          - endpoints.POST_/items/{id}/submit-for-review
        distinguishing_aspect: |
          Each endpoint's roles list is exhaustive, and the two access layers are
          distinguishable: a well-formed write with a role outside the list is refused 403
          ERR_FORBIDDEN_ROLE, the same body with no X-User-ID at all is refused 401
          ERR_UNAUTHENTICATED because priority 1 precedes priority 2, and the identical item
          body from ItemSpecialist succeeds — so the refusals are authorisation decisions, not
          payload defects.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX and one Item ${item_id} in status DRAFT authored by isp-author."
            - "The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
