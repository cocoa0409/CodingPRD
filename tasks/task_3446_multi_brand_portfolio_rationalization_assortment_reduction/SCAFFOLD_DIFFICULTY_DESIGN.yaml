# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_3446_multi_brand_portfolio_rationalization_assortment_reduction
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: obsolescence_standard_vs_salvage_variant
        grounds:
          - calculations.obsolescence_charge
          - entities.Item.fields.salvageable
          - state_machines.RationalizationCase.EXECUTING_to_EXECUTED
        distinguishing_aspect: |
          Same inventory inputs (units_on_hand 100, unit_cost_cents 500) produce two different
          obsolescence charges selected by item.salvageable: STANDARD charges 50000, SALVAGE
          recovers 20% and charges 40000. Entity domain: Item fiscal write-off.
        test_recipe:
          setup:
            - "Brand B (core_flag true), Plant P (capacity 1000000), Item A salvageable=false units_on_hand=100 unit_cost_cents=500, Item S identical but salvageable=true"
            - "Both items have an EXECUTING case whose sell-through deadline has passed (logical clock advanced 90 days after APPROVE)"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-DV1", category_name: "kitchen", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-DV1", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-DV1-A", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 500, units_on_hand: 100 }, as: PortfolioManager, captures: { item_a: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-DV1-S", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 500, units_on_hand: 100, salvageable: true }, as: PortfolioManager, captures: { item_s: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${item_a}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { case_a: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${item_s}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { case_s: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${case_a}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
            - { call: "POST /portfolio/rationalization-cases/${case_s}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-30T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${case_a}/finalize", payload: {}, as: PortfolioManager }
            - { call: "POST /portfolio/rationalization-cases/${case_s}/finalize", payload: {}, as: PortfolioManager }
            - { call: "GET /portfolio/items/${item_a}", payload: {}, as: PortfolioManager, captures: { a_charge: $.data.obsolescence_charge_cents, a_onhand: $.data.units_on_hand, a_wo: $.data.units_written_off_cumulative } }
            - { call: "GET /portfolio/items/${item_s}", payload: {}, as: PortfolioManager, captures: { s_charge: $.data.obsolescence_charge_cents, s_onhand: $.data.units_on_hand } }
          assert:
            - "Item.${item_a}.obsolescence_charge_cents == 50000  (STANDARD: 100 * 500)"
            - "Item.${item_s}.obsolescence_charge_cents == 40000  (SALVAGE: round_half_up(100 * 500 * 0.80))"
            - "Item.${item_a}.units_on_hand == 0 and units_written_off_cumulative == 100"
            - "Item.${item_s}.units_on_hand == 0"
            - "a_charge != s_charge for identical units_on_hand and unit_cost_cents"
      - name: innovation_priority_standard_vs_core_brand_variant
        grounds:
          - calculations.innovation_priority_score
          - entities.Brand.fields.core_flag
          - entities.InnovationProject.fields.priority_score
        distinguishing_aspect: |
          Identical project inputs (strategic_fit_score 80, expected_revenue_cents_year3 1000000000)
          score 68.00 for a non-core brand but 78.00 for a core brand (CORE_BRAND variant adds the
          10-point bonus after rounding). Entity domain: InnovationProject capital prioritization —
          a different domain from the Item obsolescence variant instance.
        test_recipe:
          setup:
            - "CapitalCycle CY in ALLOCATING (total 1000000000, window 2026-09-01..2027-03-01)"
            - "Brand NC (core_flag false) and Brand C (core_flag true); one project in each with identical fit/revenue"
          setup_api_calls:
            - { call: "POST /portfolio/capital-cycles", payload: { period_code: "2027-H1-DV2", total_capital_cents: 1000000000, window_start: "2026-09-01T00:00:00Z", window_end: "2027-03-01T00:00:00Z" }, as: FinanceController, captures: { cy_id: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-NC-DV2", category_name: "kitchen", core_flag: false, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b_nc: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-C-DV2", category_name: "kitchen", core_flag: true, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b_c: $.data.id } }
          trigger:
            - { call: "POST /portfolio/innovation-projects", payload: { brand_id: "${b_nc}", funding_cycle_id: "${cy_id}", title: "P-NC", requested_capital_cents: 1000, expected_revenue_cents_year3: 1000000000, strategic_fit_score: 80 }, as: PortfolioManager, captures: { pr_nc: $.data.id, ps_nc: $.data.priority_score } }
            - { call: "POST /portfolio/innovation-projects", payload: { brand_id: "${b_c}", funding_cycle_id: "${cy_id}", title: "P-C", requested_capital_cents: 1000, expected_revenue_cents_year3: 1000000000, strategic_fit_score: 80 }, as: PortfolioManager, captures: { pr_c: $.data.id, ps_c: $.data.priority_score } }
          assert:
            - "InnovationProject.${pr_nc}.priority_score == 68.00  (0.6*80 + 0.4*50)"
            - "InnovationProject.${pr_c}.priority_score == 78.00  (68.00 + CORE_PRIORITY_BONUS 10)"
            - "ps_c - ps_nc == 10.00 for identical project inputs"

  - rule_id: combinatorial_formula
    instances:
      - name: composite_score_multiclamp_weighted_composition
        grounds:
          - calculations.rationalization_composite_score
          - entities.RationalizationCase.fields.composite_score
        distinguishing_aspect: |
          Mode (a): four clamped sub-scores with a zero-revenue conditional branch and a weighted
          composition over ROUNDED sub-scores. Fixture: brand revenue 1000000000, pl_share 40;
          item 10000 units, rev 2000, cost 1700 -> 80.00/57.14/90.00/63.00 -> composite 72.04 -> CUT.
        test_recipe:
          setup:
            - "Brand B (annual_net_revenue_cents 1000000000, private_label_share_pct 40), Plant P, Item I (annual_units 10000, unit_net_revenue_cents 2000, unit_cost_cents 1700, units_on_hand 0)"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-CF1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-CF1", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-CF1", annual_units: 10000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id, vol: $.data.volume_score, mar: $.data.margin_score, she: $.data.shelf_resilience_score, bac: $.data.backlash_resilience_score, comp: $.data.composite_score, rec: $.data.recommendation } }
          assert:
            - "volume_score == 80.00  (100 - 10000/50000*100)"
            - "margin_score == 57.14  ((0.35 - 0.15)/0.35*100 rounded half-up 2dp)"
            - "shelf_resilience_score == 90.00  (100 - 0.02/0.20*100)"
            - "backlash_resilience_score == 63.00  (90.00 * (0.5 + 0.005*40))"
            - "composite_score == 72.04  (0.30*80.00 + 0.25*57.14 + 0.20*90.00 + 0.25*63.00 = 72.035 -> half-up)"
            - "recommendation == CUT  (72.04 >= 65)"
      - name: tsa_penalty_nested_rounding_order
        grounds:
          - calculations.tsa_early_termination_penalty
          - entities.TransitionServiceAgreement.fields.early_termination_penalty_cents
          - state_machines.TransitionServiceAgreement.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — ceil(days/30) months FIRST, then multiply
          by fee and 0.25, then round_half_up the product. Fee 120010 with 3 months remaining yields
          90008; the forbidden per-month-rounding order yields 90009. Different mode from the
          weighted-composition instance.
        test_recipe:
          setup:
            - "Non-core brand B with divestiture at SPA_SIGNED: TSA fee 120010, window 2026-09-01..2027-09-01, expected_close 2026-10-01; divestiture CLOSED at logical 2026-10-01 so TSA ACTIVE"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-CF2", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Co", headline_price_cents: 500000000, expected_close_date: "2026-10-01T00:00:00Z" }, as: PortfolioManager, captures: { d_id: $.data.id } }
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 120010, tsa_start_date: "2026-09-01T00:00:00Z", tsa_end_date: "2027-09-01T00:00:00Z" }, as: PortfolioManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PortfolioManager }
            - { call: "POST /portfolio/divestitures/${d_id}/close", payload: {}, as: PortfolioManager }
            - { call: "GET /portfolio/tsas?divestiture_id=${d_id}", payload: {}, as: PortfolioManager, captures: { tsa_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-15T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/tsas/${tsa_id}/terminate", payload: {}, as: FinanceController, captures: { pen: $.data.early_termination_penalty_cents, st: $.data.tsa_status } }
          assert:
            - "days_remaining == 78 (2027-06-15 -> 2027-09-01), months_remaining == ceil(78/30) == 3"
            - "TransitionServiceAgreement.${tsa_id}.early_termination_penalty_cents == 90008  (round_half_up(3 * 120010 * 0.25))"
            - "penalty != 90009  (the forbidden per-month-rounding order)"
            - "tsa_status == TERMINATED"

  - rule_id: non_linear_state_machine
    instances:
      - name: item_cut_proposed_revert_then_repropose
        grounds:
          - state_machines.Item.CUT_PROPOSED_to_LISTED
          - state_machines.Item.CUT_PROPOSED_to_SELL_THROUGH
          - state_machines.RationalizationCase.SCORED_to_REJECTED
        distinguishing_aspect: |
          Item is branching-with-revert: CUT_PROPOSED -> LISTED on REJECT (compensation) releases the
          open-case slot, so a SECOND case can later be proposed on the same item and driven to
          SELL_THROUGH. A pure pipeline could never revisit LISTED.
        test_recipe:
          setup:
            - "Brand B, Plant P, Item I (LISTED, units_on_hand 10, annual_units 4000, rev 2000, cost 1700)"
            - "Case C1 proposed then REJECTED (item back to LISTED)"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-NL1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-NL1", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-NL1", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 10 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c1_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${c1_id}/decide", payload: { decision: "REJECT" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: PortfolioManager, captures: { st_after_reject: $.data.item_status } }
          trigger:
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-2", captures: { c2_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${c2_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1", captures: { c2_status: $.data.case_status } }
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: PortfolioManager, captures: { st_final: $.data.item_status, deadline: $.data.sell_through_deadline } }
          assert:
            - "st_after_reject == LISTED  (compensating revert executed)"
            - "second case created successfully: ${c2_id} != ${c1_id}  (open-slot released by REJECT)"
            - "c2_status == EXECUTING"
            - "st_final == SELL_THROUGH"
            - "sell_through_deadline == 2026-11-30T00:00:00Z  (decide at default clock 2026-09-01 + 90 days)"
      - name: transfer_fail_reset_self_loop_then_auto_execute
        grounds:
          - state_machines.ProductTransfer.QUALIFYING_to_QUALIFYING
          - state_machines.ProductTransfer.QUALIFYING_to_EXECUTED
          - entities.ProductTransfer.fields.consecutive_pass_count
        distinguishing_aspect: |
          ProductTransfer is cyclic: a FAIL run self-loops QUALIFYING -> QUALIFYING and resets
          consecutive_pass_count to 0, so two isolated PASSes separated by a FAIL never execute;
          only two CONSECUTIVE passes auto-execute and rewrite item.primary_plant_id.
        test_recipe:
          setup:
            - "Brand B, Plants S and T (OPERATING, capacity 1000000), Item I LISTED at S (annual_units 4000)"
            - "Transfer PLANNED S -> T"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-NL2", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-NL2-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-NL2-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-NL2", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-02T00:00:00Z", units_produced: 10000, units_rejected: 300 }, as: PlantDirector, as_user_id: "${pt_id}", captures: { r1: $.data.result } }
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-03T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}", captures: { r2: $.data.result } }
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-04T00:00:00Z", units_produced: 10000, units_rejected: 900 }, as: PlantDirector, as_user_id: "${pt_id}", captures: { r3: $.data.result } }
            - { call: "GET /portfolio/product-transfers/${t_id}", payload: {}, as: SupplyChainPlanner, captures: { cnt_mid: $.data.consecutive_pass_count, st_mid: $.data.transfer_status } }
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-05T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}" }
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-06T00:00:00Z", units_produced: 10000, units_rejected: 100 }, as: PlantDirector, as_user_id: "${pt_id}", captures: { r5: $.data.result } }
            - { call: "GET /portfolio/product-transfers/${t_id}", payload: {}, as: SupplyChainPlanner, captures: { st_end: $.data.transfer_status, cnt_end: $.data.consecutive_pass_count } }
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: SupplyChainPlanner, captures: { plant_end: $.data.primary_plant_id } }
          assert:
            - "r1 == FAIL (300bp > 250bp) and r2 == PASS and r3 == FAIL (900bp)"
            - "after the third run: transfer_status == QUALIFYING and consecutive_pass_count == 0  (FAIL reset, self-loop)"
            - "after two consecutive PASSes: transfer_status == EXECUTED and consecutive_pass_count == 2"
            - "Item.${i_id}.primary_plant_id == ${pt_id}  (auto-execution rewired the item)"

  - rule_id: transitive_cascade
    instances:
      - name: tsa_terminate_depth3_cascade
        grounds:
          - state_machines.TransitionServiceAgreement.ACTIVE_to_TERMINATED
          - state_machines.Item.LISTED_to_DISCONTINUED
          - state_machines.RationalizationCase.SCORED_to_VOIDED
          - calculations.plant_load
        distinguishing_aspect: |
          Depth-3 chain from one trigger (TSA terminate): hop 1 items of the divested brand ->
          DISCONTINUED with per-item obsolescence charges; hop 2 the open SCORED case on item 1 ->
          VOIDED; hop 3 both host plants recompute committed_units_per_quarter (to 0). Each hop is
          caused by the previous hop, not by the original call.
        test_recipe:
          setup:
            - "Non-core brand B with Item1 at Plant A (annual_units 4000, on hand 100, cost 500, salvageable false) and Item2 at Plant C (annual_units 8000, on hand 50, cost 400, salvageable true)"
            - "Item1 has an open SCORED case; divestiture CLOSED (TSA ACTIVE, window 2026-09-01..2027-09-01)"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-TC1", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-TC1-A", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pa_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-TC1-C", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pc_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${pa_id}", sku_code: "SKU-TC1-1", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 500, units_on_hand: 100 }, as: PortfolioManager, captures: { i1: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${pc_id}", sku_code: "SKU-TC1-2", annual_units: 8000, unit_net_revenue_cents: 2000, unit_cost_cents: 400, units_on_hand: 50, salvageable: true }, as: PortfolioManager, captures: { i2: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i1}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c1: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Co", headline_price_cents: 500000000, expected_close_date: "2026-10-01T00:00:00Z" }, as: PortfolioManager, captures: { d_id: $.data.id } }
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 100000, tsa_start_date: "2026-09-01T00:00:00Z", tsa_end_date: "2027-09-01T00:00:00Z" }, as: PortfolioManager }
            - { call: "POST /portfolio/divestitures/${d_id}/close", payload: {}, as: PortfolioManager }
            - { call: "GET /portfolio/tsas?divestiture_id=${d_id}", payload: {}, as: PortfolioManager, captures: { tsa_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /portfolio/tsas/${tsa_id}/terminate", payload: {}, as: FinanceController, captures: { pen: $.data.early_termination_penalty_cents } }
            - { call: "GET /portfolio/items/${i1}", payload: {}, as: PortfolioManager, captures: { i1_st: $.data.item_status, i1_chg: $.data.obsolescence_charge_cents } }
            - { call: "GET /portfolio/items/${i2}", payload: {}, as: PortfolioManager, captures: { i2_st: $.data.item_status, i2_chg: $.data.obsolescence_charge_cents } }
            - { call: "GET /portfolio/rationalization-cases?item_id=${i1}", payload: {}, as: PortfolioManager, captures: { c1_st: "$.data[0].case_status" } }
            - { call: "GET /portfolio/plants", payload: {}, as: PortfolioManager }
          assert:
            - "Item1: item_status == DISCONTINUED, obsolescence_charge_cents == 50000  (hop 1, STANDARD variant)"
            - "Item2: item_status == DISCONTINUED, obsolescence_charge_cents == 16000  (hop 1, SALVAGE: 50*400*0.8)"
            - "Case.${c1}.case_status == VOIDED  (hop 2: open case voided by item discontinuation)"
            - "Plant A and Plant C committed_units_per_quarter == 0 and utilization_pct == 0.00  (hop 3: both hosts recomputed; 1000 and 2000 quarterly units removed)"
            - "clock was never advanced past the 2026-09-01 default, so termination is early: days_remaining == 365, months == ceil(365/30) == 13, penalty == round_half_up(13 * 100000 * 0.25) == 325000"
      - name: finalize_depth2_cascade
        grounds:
          - state_machines.RationalizationCase.EXECUTING_to_EXECUTED
          - state_machines.Item.SELL_THROUGH_to_DISCONTINUED
          - calculations.plant_load
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (case finalize): hop 1 item SELL_THROUGH ->
          DISCONTINUED with obsolescence charge and inventory zeroed; hop 2 the host plant's
          committed_units_per_quarter drops by the item's quarterly contribution (10000 -> 0).
        test_recipe:
          setup:
            - "Brand B, Plant P (capacity 100000), Item I LISTED at P (annual_units 40000 -> committed 10000, units_on_hand 25, cost 800, salvageable false)"
            - "Case approved at default clock 2026-09-01 (deadline 2026-11-30); clock advanced to 2026-11-30"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-TC2", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-TC2", quarterly_capacity_units: 100000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-TC2", annual_units: 40000, unit_net_revenue_cents: 2000, unit_cost_cents: 800, units_on_hand: 25 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-30T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${c_id}/finalize", payload: {}, as: PortfolioManager, captures: { c_st: $.data.case_status } }
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: PortfolioManager, captures: { i_st: $.data.item_status, i_chg: $.data.obsolescence_charge_cents, i_wo: $.data.units_written_off_cumulative } }
            - { call: "GET /portfolio/plants", payload: {}, as: PortfolioManager, captures: { p_commit: "$.data[0].committed_units_per_quarter", p_util: "$.data[0].utilization_pct" } }
          assert:
            - "case_status == EXECUTED"
            - "hop 1: item_status == DISCONTINUED, obsolescence_charge_cents == 20000  (25 * 800), units_written_off_cumulative == 25"
            - "hop 2: plant committed_units_per_quarter == 0  (was 10000 = 40000/4) and utilization_pct == 0.00"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: transfer_state_guard_beats_capacity_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=20]
          - errors[ERR_ITEM_NOT_TRANSFERABLE]
          - errors[ERR_PLANT_OVER_CAPACITY]
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): one transfer-create request violates BOTH the
          item-state guard (item CUT_PROPOSED, priority 8) and the 110% capacity gate (priority 20);
          the state error ERR_ITEM_NOT_TRANSFERABLE must win.
        test_recipe:
          setup:
            - "Brand B, Plant S (capacity 1000000) hosting Item I LISTED (annual_units 40000), tiny Plant T (capacity 1000) as target"
            - "Open SCORED case on Item I -> item CUT_PROPOSED"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-PP1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-PP1-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-PP1-T", quarterly_capacity_units: 1000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-PP1", annual_units: 40000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ITEM_NOT_TRANSFERABLE  (state priority 8 beats business_fiscal priority 20, even though projected utilization 1000% also fails)"
            - "no transfer created: GET /portfolio/product-transfers?item_id=${i_id} returns empty array"
      - name: respond_state_guard_beats_ttl_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=18]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NEGOTIATION_EXPIRED]
        distinguishing_aspect: |
          Category pair (state vs business_temporal): the negotiation is already REJECTED (terminal)
          AND the logical clock is past expires_at; a second respond must fail with ERR_INVALID_STATE
          (priority 7) and the negotiation must remain REJECTED — the EXPIRED auto-transition must
          NOT fire on a terminal negotiation.
        test_recipe:
          setup:
            - "Retailer R, Brands B1 and B2 (ACTIVE), negotiation N (period 2027-H1) created at default clock, already responded REJECT"
            - "Logical clock advanced past N.expires_at (2026-10-01 + 1 day)"
          setup_api_calls:
            - { call: "POST /portfolio/retailers", payload: { name: "R-PP2", risk_rating: "LOW" }, as: PortfolioManager, captures: { r_id: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-PP2-1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b1: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-PP2-2", category_name: "tools", core_flag: true, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b2: $.data.id } }
            - { call: "POST /portfolio/combined-negotiations", payload: { retailer_id: "${r_id}", period_code: "2027-H1", brand_terms: [ { brand_id: "${b1}", baseline_facings: 100, proposed_facings: 90 }, { brand_id: "${b2}", baseline_facings: 60, proposed_facings: 60 } ], effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-06-30T00:00:00Z" }, as: PortfolioManager, captures: { n_id: $.data.id } }
            - { call: "POST /portfolio/combined-negotiations/${n_id}/respond", payload: { response: "REJECT" }, as: RetailerBuyer, as_user_id: "${r_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/combined-negotiations/${n_id}/respond", payload: { response: "ACCEPT" }, as: RetailerBuyer, as_user_id: "${r_id}", captures: { err: $.data.error_id } }
            - { call: "GET /portfolio/combined-negotiations/${n_id}", payload: {}, as: PortfolioManager, captures: { n_st: $.data.negotiation_status } }
          assert:
            - "err == ERR_INVALID_STATE  (state priority 7 beats business_temporal priority 18)"
            - "negotiation_status == REJECTED  (EXPIRED auto-transition does not fire on a terminal negotiation)"

  - rule_id: boundary_precision_check
    instances:
      - name: qualification_reject_rate_exactly_250bp
        grounds:
          - entities.QualificationRun.fields.result
          - calculations.transfer_capacity_gate
          - state_machines.ProductTransfer.QUALIFYING_to_QUALIFYING
        distinguishing_aspect: |
          Metric: reject rate in basis points on the run-record endpoint. Exactly 250bp
          (250 rejected of 10000) PASSES (integer comparison <=); 251bp FAILS and resets the
          consecutive-pass counter.
        test_recipe:
          setup:
            - "Brand B, Plants S and T, Item I LISTED at S, transfer PLANNED S -> T"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-BP1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-BP1-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-BP1-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-BP1", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-02T00:00:00Z", units_produced: 10000, units_rejected: 250 }, as: PlantDirector, as_user_id: "${pt_id}", captures: { res_a: $.data.result } }
            - { call: "POST /portfolio/product-transfers/${t_id}/qualification-runs", payload: { run_date: "2026-09-03T00:00:00Z", units_produced: 10000, units_rejected: 251 }, as: PlantDirector, as_user_id: "${pt_id}", captures: { res_b: $.data.result } }
            - { call: "GET /portfolio/product-transfers/${t_id}", payload: {}, as: SupplyChainPlanner, captures: { cnt: $.data.consecutive_pass_count } }
          assert:
            - "res_a == PASS  (250 * 10000 <= 10000 * 250, boundary inclusive)"
            - "res_b == FAIL  (251 * 10000 > 10000 * 250)"
            - "consecutive_pass_count == 0 after the FAIL reset (PASS then FAIL nets zero)"
      - name: transfer_capacity_exactly_110pct_allowed
        grounds:
          - calculations.transfer_capacity_gate
          - errors[ERR_PLANT_OVER_CAPACITY]
        distinguishing_aspect: |
          Metric: projected utilization percent on the transfer-create endpoint — a different metric
          and endpoint from the reject-rate boundary. Exactly 110.00% (projected 11000 of capacity
          10000) is ALLOWED by the integer gate; 110.01% (11001) is REJECTED.
        test_recipe:
          setup:
            - "Brand B, target Plant T (capacity 10000) already hosting Item X (annual_units 36000 -> committed 9000)"
            - "Source Plant S (capacity 1000000) hosting Item Y (annual_units 8000 -> quarterly 2000) and Item Z (annual_units 8004 -> quarterly 2001)"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-BP2", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-BP2-T", quarterly_capacity_units: 10000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-BP2-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${pt_id}", sku_code: "SKU-BP2-X", annual_units: 36000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { ix: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-BP2-Y", annual_units: 8000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { iy: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-BP2-Z", annual_units: 8004, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { iz: $.data.id } }
          trigger:
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${iy}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { ty: $.data.id } }
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${iz}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { err: $.data.error_id } }
          assert:
            - "transfer for Y created (201): projected 9000 + 2000 = 11000; 11000 * 100 == 10000 * 110 -> allowed at exactly 110.00%"
            - "err == ERR_PLANT_OVER_CAPACITY for Z: projected 9000 + 2001 = 11001; 11001 * 100 > 10000 * 110 -> 110.01% rejected"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: separate_requires_tsa_terminated
        grounds:
          - state_machines.Divestiture.CLOSED_to_SEPARATED
          - errors[ERR_TSA_STILL_ACTIVE]
          - state_machines.Brand.DIVESTED_to_EXITED
        distinguishing_aspect: |
          Entity pair Divestiture->TSA: the separate transition on the Divestiture is gated on the
          linked TSA reaching TERMINATED — a different entity pair from the transfer->plant instance.
        test_recipe:
          setup:
            - "Non-core brand B (no items), divestiture CLOSED at logical 2026-10-01 (TSA ACTIVE, window 2026-09-01..2027-09-01)"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-CE1", category_name: "tools", core_flag: false, private_label_share_pct: 20, annual_net_revenue_cents: 800000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/divestitures", payload: { brand_id: "${b_id}", acquirer_name: "Acq Co", headline_price_cents: 500000000, expected_close_date: "2026-10-01T00:00:00Z" }, as: PortfolioManager, captures: { d_id: $.data.id } }
            - { call: "POST /portfolio/divestitures/${d_id}/sign-spa", payload: { tsa_monthly_fee_cents: 100000, tsa_start_date: "2026-09-01T00:00:00Z", tsa_end_date: "2027-09-01T00:00:00Z" }, as: PortfolioManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PortfolioManager }
            - { call: "POST /portfolio/divestitures/${d_id}/close", payload: {}, as: PortfolioManager }
            - { call: "GET /portfolio/tsas?divestiture_id=${d_id}", payload: {}, as: PortfolioManager, captures: { tsa_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /portfolio/divestitures/${d_id}/separate", payload: {}, as: PortfolioManager, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-01T00:00:00Z" }, as: PortfolioManager }
            - { call: "POST /portfolio/tsas/${tsa_id}/terminate", payload: {}, as: FinanceController, captures: { pen: $.data.early_termination_penalty_cents } }
            - { call: "POST /portfolio/divestitures/${d_id}/separate", payload: {}, as: PortfolioManager, captures: { d_st: $.data.divestiture_status } }
            - { call: "GET /portfolio/brands", payload: {}, as: PortfolioManager, captures: { b_st: "$.data[0].brand_status" } }
          assert:
            - "first separate: err == ERR_TSA_STILL_ACTIVE  (TSA ACTIVE blocks the cross-entity guard)"
            - "terminate at clock == end_date: penalty == 0  (natural termination boundary)"
            - "second separate: divestiture_status == SEPARATED"
            - "brand_status == EXITED  (cascade to terminal)"
      - name: transfer_requires_target_plant_operating
        grounds:
          - state_machines.ProductTransfer
          - errors[ERR_TARGET_PLANT_NOT_OPERATING]
          - state_machines.Plant.OPERATING_to_CLOSING
        distinguishing_aspect: |
          Entity pair ProductTransfer->Plant: transfer creation is gated on the TARGET plant's state
          (OPERATING) — independent of the item's own state; different pair from Divestiture->TSA.
        test_recipe:
          setup:
            - "Brand B, Plant S OPERATING hosting Item I (LISTED), Plant T announced CLOSING"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-CE2", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-CE2-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-CE2-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-CE2", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/plants/${pt_id}/announce-closure", payload: { closure_date: "2027-03-01T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${pt_id}" }, as: SupplyChainPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_TARGET_PLANT_NOT_OPERATING  (target CLOSING blocks creation even though item is LISTED)"
            - "no transfer exists: GET /portfolio/product-transfers?item_id=${i_id} returns empty array"

  - rule_id: resource_temporal_overlap
    instances:
      - name: capital_cycle_half_open_window_overlap
        grounds:
          - validations[priority=16]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
          - entities.CapitalCycle.fields.window_start
        distinguishing_aspect: |
          Resource: CapitalCycle funding windows with HALF-OPEN [start, end) semantics — adjacency
          (new start == existing end) is allowed. Different interval semantics and different resource
          entity from the closed-interval negotiation instance.
        test_recipe:
          setup:
            - "Cycle C1 [2026-09-01, 2027-03-01) exists"
          setup_api_calls:
            - { call: "POST /portfolio/capital-cycles", payload: { period_code: "2026-H2", total_capital_cents: 1000000000, window_start: "2026-09-01T00:00:00Z", window_end: "2027-03-01T00:00:00Z" }, as: FinanceController, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /portfolio/capital-cycles", payload: { period_code: "2027-H1", total_capital_cents: 500000000, window_start: "2027-03-01T00:00:00Z", window_end: "2027-09-01T00:00:00Z" }, as: FinanceController, captures: { c2: $.data.id } }
            - { call: "POST /portfolio/capital-cycles", payload: { period_code: "2027-X1", total_capital_cents: 1000, window_start: "2027-02-01T00:00:00Z", window_end: "2027-08-01T00:00:00Z" }, as: FinanceController, captures: { err: $.data.error_id } }
          assert:
            - "C2 created (201): start 2027-03-01 == C1 end 2027-03-01 is adjacency, NOT overlap, under half-open semantics"
            - "err == ERR_CYCLE_WINDOW_OVERLAP for C3: [2027-02-01, 2027-08-01) intersects C1 (and C2)"
      - name: negotiation_closed_window_shared_day_overlap
        grounds:
          - validations[priority=17]
          - errors[ERR_NEGOTIATION_WINDOW_OVERLAP]
          - entities.CombinedNegotiation.fields.effective_to
        distinguishing_aspect: |
          Resource: CombinedNegotiation effective windows per retailer with CLOSED [from, to]
          semantics — a shared boundary day IS an overlap (unlike the half-open cycle windows). Same
          retailer only; another retailer's identical window is fine.
        test_recipe:
          setup:
            - "Retailer R, Brands B1/B2 ACTIVE; negotiation N1 effective [2026-09-01, 2026-12-31] TERMS_PROPOSED"
          setup_api_calls:
            - { call: "POST /portfolio/retailers", payload: { name: "R-TO2", risk_rating: "MEDIUM" }, as: PortfolioManager, captures: { r_id: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-TO2-1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b1: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-TO2-2", category_name: "tools", core_flag: true, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b2: $.data.id } }
            - { call: "POST /portfolio/combined-negotiations", payload: { retailer_id: "${r_id}", period_code: "2026-H2", brand_terms: [ { brand_id: "${b1}", baseline_facings: 100, proposed_facings: 90 }, { brand_id: "${b2}", baseline_facings: 60, proposed_facings: 50 } ], effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }, as: PortfolioManager, captures: { n1: $.data.id } }
          trigger:
            - { call: "POST /portfolio/combined-negotiations", payload: { retailer_id: "${r_id}", period_code: "2027-H1", brand_terms: [ { brand_id: "${b1}", baseline_facings: 100, proposed_facings: 90 }, { brand_id: "${b2}", baseline_facings: 60, proposed_facings: 50 } ], effective_from: "2026-12-31T00:00:00Z", effective_to: "2027-03-31T00:00:00Z" }, as: PortfolioManager, captures: { err: $.data.error_id } }
            - { call: "POST /portfolio/combined-negotiations", payload: { retailer_id: "${r_id}", period_code: "2027-H1", brand_terms: [ { brand_id: "${b1}", baseline_facings: 100, proposed_facings: 90 }, { brand_id: "${b2}", baseline_facings: 60, proposed_facings: 50 } ], effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-03-31T00:00:00Z" }, as: PortfolioManager, captures: { n3: $.data.id } }
          assert:
            - "err == ERR_NEGOTIATION_WINDOW_OVERLAP: [2026-12-31, 2027-03-31] shares the boundary day 2026-12-31 with N1's closed window"
            - "N3 created (201): [2027-01-01, 2027-03-31] starts the day AFTER N1's closed end — no overlap"

  - rule_id: compensating_invariant
    instances:
      - name: item_unit_balance_conserved_across_sell_down_and_writeoff
        grounds:
          - invariants[inv_item_unit_and_listed]
          - entities.Item.fields.units_on_hand
          - concurrency_rules[item-sell-down-stale-version]
        distinguishing_aspect: |
          Conserved quantity: physical units. Forward actions (sell-down 200 + 200) and the
          compensating write-off at finalize keep units_on_hand + units_sold_cumulative +
          units_written_off_cumulative == 1000 (the creation balance) at every step.
        test_recipe:
          setup:
            - "Brand B, Plant P, Item I (units_on_hand 1000, cost 500, annual_units 4000); case approved; two sell-downs of 200 each with fresh OCC versions; clock past deadline"
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-CI1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-CI1", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-CI1", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 500, units_on_hand: 1000 }, as: PortfolioManager, captures: { i_id: $.data.id, i_v0: $.data.version } }
            - { call: "POST /portfolio/items/${i_id}/sell-down", payload: { units_sold: 200, expected_item_version: "${i_v0}" }, as: SupplyChainPlanner, captures: { i_v1: $.data.version } }
            - { call: "POST /portfolio/items/${i_id}/sell-down", payload: { units_sold: 200, expected_item_version: "${i_v1}" }, as: SupplyChainPlanner, captures: { i_v2: $.data.version, onhand_mid: $.data.units_on_hand, sold_mid: $.data.units_sold_cumulative } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-30T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${c_id}/finalize", payload: {}, as: PortfolioManager }
            - { call: "GET /portfolio/items/${i_id}", payload: {}, as: PortfolioManager, captures: { oh: $.data.units_on_hand, sold: $.data.units_sold_cumulative, wo: $.data.units_written_off_cumulative, chg: $.data.obsolescence_charge_cents } }
          assert:
            - "mid-chain invariant: onhand_mid == 600 and sold_mid == 400  (600 + 400 + 0 == 1000)"
            - "post-finalize: units_on_hand == 0 and units_sold_cumulative == 400 and units_written_off_cumulative == 600"
            - "0 + 400 + 600 == 1000  (unit balance conserved across forward sell-downs and compensating write-off)"
            - "obsolescence_charge_cents == 300000  (600 remaining units * 500)"
      - name: capital_conservation_across_waterfall
        grounds:
          - invariants[inv_capital_conservation]
          - calculations.capital_waterfall
          - state_machines.CapitalCycle.ALLOCATING_to_LOCKED
        distinguishing_aspect: |
          Conserved quantity: capital cents (different from physical units). The waterfall funds
          600M, defers 500M (overflow), then funds 300M (skip-and-continue); forward funding plus
          compensating deferral conserve allocated + remaining == total (1000000000).
        test_recipe:
          setup:
            - "Cycle CY total 1000000000 (window 2026-09-01..2027-03-01); NON-core brand B (core_flag false -> STANDARD variant keeps scores 94.00/68.00/46.00)"
            - "P1 requested 600000000 (fit 90, rev 2000000000 -> priority 94.00); P2 requested 500000000 (fit 80, rev 1000000000 -> 68.00); P3 requested 300000000 (fit 60, rev 500000000 -> 46.00)"
          setup_api_calls:
            - { call: "POST /portfolio/capital-cycles", payload: { period_code: "2027-H1-CI2", total_capital_cents: 1000000000, window_start: "2026-09-01T00:00:00Z", window_end: "2027-03-01T00:00:00Z" }, as: FinanceController, captures: { cy: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-CI2", category_name: "storage", core_flag: false, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/innovation-projects", payload: { brand_id: "${b_id}", funding_cycle_id: "${cy}", title: "P1", requested_capital_cents: 600000000, expected_revenue_cents_year3: 2000000000, strategic_fit_score: 90 }, as: PortfolioManager, captures: { p1: $.data.id, p1_score: $.data.priority_score } }
            - { call: "POST /portfolio/innovation-projects", payload: { brand_id: "${b_id}", funding_cycle_id: "${cy}", title: "P2", requested_capital_cents: 500000000, expected_revenue_cents_year3: 1000000000, strategic_fit_score: 80 }, as: PortfolioManager, captures: { p2: $.data.id } }
            - { call: "POST /portfolio/innovation-projects", payload: { brand_id: "${b_id}", funding_cycle_id: "${cy}", title: "P3", requested_capital_cents: 300000000, expected_revenue_cents_year3: 500000000, strategic_fit_score: 60 }, as: PortfolioManager, captures: { p3: $.data.id } }
          trigger:
            - { call: "POST /portfolio/capital-cycles/${cy}/run-selection", payload: {}, as: FinanceController, captures: { alloc: $.data.allocated_cents, rem: $.data.remaining_cents, cy_st: $.data.cycle_status } }
            - { call: "GET /portfolio/innovation-projects/${p1}", payload: {}, as: FinanceController, captures: { p1_st: $.data.project_status } }
            - { call: "GET /portfolio/innovation-projects/${p2}", payload: {}, as: FinanceController, captures: { p2_st: $.data.project_status } }
            - { call: "GET /portfolio/innovation-projects/${p3}", payload: {}, as: FinanceController, captures: { p3_st: $.data.project_status } }
          assert:
            - "P1 FUNDED (priority 94.00, fits 1000000000); remaining becomes 400000000"
            - "P2 DEFERRED (500000000 > 400000000 at its rank) — waterfall SKIPS and continues"
            - "P3 FUNDED (300000000 <= 400000000); remaining becomes 100000000"
            - "allocated_cents == 900000000 and remaining_cents == 100000000 and allocated + remaining == total_capital_cents == 1000000000"
            - "cycle_status == LOCKED"
