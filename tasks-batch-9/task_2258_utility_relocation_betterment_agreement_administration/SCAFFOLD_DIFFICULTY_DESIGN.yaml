            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: $.data.id, pl1_round: $.data.revision_round, pl1_status: $.data.status } }
