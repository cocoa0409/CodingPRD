  # ---- ContentBundle ---------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/content-bundles"
    description: "Open a draft content bundle for a cluster. A bundle is the unit that carries daypart slots, the item snapshot and the frozen price snapshot to devices."
    roles: [ContentManager]
    code: 201
    input: [cluster_id, effective_from_utc]
    output: ContentBundle
    side_effects:
      - "sets state to DRAFT, accessibility_audit_state to NOT_AUDITED, bundle_version to the cluster's highest bundle_version + 1 (starting at 1), stale_flag false, and empty daypart_slots / snapshot_item_ids / price_snapshot / findings arrays"

  - method: GET
    path: "/kiosk-ops/content-bundles"
    description: "List content bundles; filter by cluster or lifecycle state."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, PricingApprover, ComplianceOfficer, StoreOperator]
    code: 200
    input: ["cluster_id?", "state?", "limit?", "offset?"]
    output: ContentBundle[]
    side_effects: []

  - method: GET
    path: "/kiosk-ops/content-bundles/{bundle_id}"
    description: "Fetch one content bundle with its daypart_slots, price_snapshot, checksums, stale_flag and current `version` (the value an OCC writer must echo)."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, PricingApprover, ComplianceOfficer, StoreOperator]
    code: 200
    input: []
    output: ContentBundle
    side_effects:
      - "recomputes live_price_checksum from current MenuItem pricing and sets stale_flag true when it differs from price_snapshot_checksum"

  - method: POST
    path: "/kiosk-ops/content-bundles/{bundle_id}/daypart-slots"
    description: "Append a daypart slot to a draft bundle. The slot interval is half-open [start_minute_of_day, end_minute_of_day) in store-local minutes and must not overlap an existing slot. Guarded by optimistic concurrency on the bundle's `version`."
    roles: [ContentManager]
    code: 200
    input: [expected_content_bundle_version, daypart_code, start_minute_of_day, end_minute_of_day, layout_code, buffer_minutes, category_codes]
    output: ContentBundle
    side_effects:
      - "increments ContentBundle.version by 1"
      - "appends the slot to daypart_slots with its created_at, and re-derives snapshot_item_ids as every MenuItem whose category appears in any slot's category_codes"
      - "resets accessibility_audit_state to NOT_AUDITED and state to DRAFT when the bundle was VALIDATED"

  - method: POST
    path: "/kiosk-ops/content-bundles/{bundle_id}/actions"
    description: "Drive the bundle fork-join. `action` is one of VALIDATE (technical branch), ACCESSIBILITY_AUDIT (accessibility branch, requires audit_result), PUBLISH (join point) or ROLLBACK."
    roles: [ContentManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: [action, "audit_result?"]
    output: ContentBundle
    side_effects:
      - "VALIDATE records validation_findings and moves DRAFT -> VALIDATED only when the findings array is empty; a bundle with no daypart_slots fails"
      - "ACCESSIBILITY_AUDIT records accessibility_findings and sets accessibility_audit_state to PASSED or FAILED; every snapshot item must have accessibility_state READY to pass"
      - "PUBLISH requires state VALIDATED and accessibility_audit_state PASSED; it freezes price_snapshot (one entry per (menu_item_id, price_zone_id) pair reachable from the cluster's stores, using calculation effective_zone_price), sets price_snapshot_checksum and live_price_checksum equal, stale_flag false, published_at_utc, moves the previously PUBLISHED bundle of the cluster to SUPERSEDED, and raises StoreCluster.published_bundle_version"
      - "ROLLBACK moves the bundle to ROLLED_BACK, republishes the SUPERSEDED bundle with the highest bundle_version (restoring StoreCluster.published_bundle_version to that value), and marks every Device that cached the rolled-back bundle cache_state STALE"
      - "appends an AuditEvent with subject_kind CONTENT_BUNDLE"

  # ---- Device ----------------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/devices"
    description: "Register a kiosk or menu board at a store, with its offline cache capacity and (for kiosks) its PIN-pad firmware version."
    roles: [PlatformAdmin, StoreOperator]
    code: 201
    input: [store_id, device_kind, device_code, offline_cache_capacity, "pin_pad_firmware_version?"]
    output: Device
    side_effects:
      - "initialises health_state OFFLINE, cache_state MISSING, last_heartbeat_utc null, consecutive_missed_heartbeats 0, offline_order_count 0, and all four hardware flags false"
      - "sets payment_compliance_state to UNATTESTED for a KIOSK and NOT_APPLICABLE for a MENU_BOARD"
      - "re-derives the owning Store.content_posture"

  - method: GET
    path: "/kiosk-ops/devices"
    description: "List devices; filter by store, by cached bundle, by device kind or by derived health state."
    roles: [PlatformAdmin, ContentManager, ComplianceOfficer, StoreOperator]
    code: 200
    input: ["store_id?", "cached_bundle_id?", "device_kind?", "health_state?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/kiosk-ops/devices/{device_id}"
    description: "Fetch one device with its recomputed rolling_health_score, worst_case_health_score, health_state, cache_state and payment_compliance_state."
    roles: [PlatformAdmin, ContentManager, ComplianceOfficer, StoreOperator, DeviceAgent]
    code: 200
    input: []
    output: Device
    side_effects:
      - "recomputes consecutive_missed_heartbeats, rolling_health_score, worst_case_health_score and health_state against the logical clock per calculation device_health_score"
      - "re-derives payment_compliance_state from attestation_expiry_utc against the logical clock (COMPLIANT -> EXPIRING within ATTESTATION_EXPIRING_DAYS -> NON_COMPLIANT once passed)"

  - method: POST
    path: "/kiosk-ops/devices/{device_id}/heartbeat"
    description: "Report the device's four hardware channels. Resets the missed-heartbeat counter and re-scores health."
    roles: [DeviceAgent, PlatformAdmin]
    code: 200
    input: [printer_ok, touch_ok, screen_reader_ok, network_ok]
    output: Device
    side_effects:
      - "sets last_heartbeat_utc to the logical clock and consecutive_missed_heartbeats to 0"
      - "recomputes rolling_health_score, worst_case_health_score and health_state per calculation device_health_score"
      - "re-derives the owning Store.content_posture from the store's devices"

  - method: POST
    path: "/kiosk-ops/devices/{device_id}/cache-sync"
    description: "Pull a published bundle into the device's offline cache so it can keep serving while the network is down."
    roles: [DeviceAgent, PlatformAdmin, StoreOperator]
    code: 200
    input: [bundle_id, "flush_offline_orders?"]
    output: Device
    side_effects:
      - "sets cached_bundle_id, cached_bundle_version and cache_state FRESH"
      - "requires the bundle's state to be PUBLISHED and its cluster to be in the device's store's cluster inheritance chain"
      - "requires the owning Store.accessibility_certified_until_utc to be at or after the logical clock for KIOSK devices"
      - "with flush_offline_orders true, every OrderHandoff of this device in handoff_state CACHED_OFFLINE moves to QUEUED_TO_KITCHEN with payment_state AUTHORIZED, and Device.offline_order_count returns to 0"
      - "re-derives the owning Store.content_posture"

  - method: POST
    path: "/kiosk-ops/devices/{device_id}/payment-attestation"
    description: "Record a PCI/P2PE attestation for a kiosk's payment device. Rejected for MENU_BOARD devices."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: [pin_pad_firmware_version, p2pe_certified, attestation_expiry_utc]
    output: Device
    side_effects:
      - "sets payment_compliance_state to COMPLIANT when p2pe_certified is true and attestation_expiry_utc is more than ATTESTATION_EXPIRING_DAYS beyond the logical clock, EXPIRING when it is within that window, and NON_COMPLIANT when p2pe_certified is false or the expiry is at or before the clock"
      - "appends an AuditEvent with subject_kind DEVICE and action PAYMENT_ATTESTED"

  # ---- OrderHandoff ----------------------------------------------------------
  - method: POST
    path: "/kiosk-ops/devices/{device_id}/orders"
    description: "Capture a kiosk order, price it against the live zone price and the selected campaign, allocate the store's daily order number, and hand it off to the kitchen."
    roles: [DeviceAgent, StoreOperator]
    code: 201
    input: [line_items, tender_kind, "accepted_upsell_rule_ids?", "created_offline?"]
    output: OrderHandoff
    side_effects:
      - "prices every line with the kiosk_charge_price variant of effective_zone_price and applies calculation order_total_with_campaign_discount, storing priced_lines, subtotal_cents, discount_cents, tax_cents, total_cents and applied_campaign_version_id"
      - "resolves daypart_code with calculation daypart_resolution and pins pinned_bundle_version to the device's cached_bundle_version"
      - "allocates order_number and receipt_hash and increments Store.daily_order_seq_counter per calculation order_number_and_receipt"
      - "sets payment_state AUTHORIZED and handoff_state QUEUED_TO_KITCHEN online; with created_offline true, keeps payment_state AUTHORIZED but sets handoff_state CACHED_OFFLINE and increments Device.offline_order_count"
      - "reserves stock: increments each ordered item's StoreItemAvailability.reserved_units by the line qty and re-derives available_units, supply_state and availability_state"
      - "increments Store.open_order_count"

  - method: GET
    path: "/kiosk-ops/order-handoffs"
    description: "List order handoffs; filter by capturing device, by applied campaign version or by handoff state."
    roles: [PlatformAdmin, ContentManager, ComplianceOfficer, StoreOperator]
    code: 200
    input: ["device_id?", "applied_campaign_version_id?", "handoff_state?", "limit?", "offset?"]
    output: OrderHandoff[]
    side_effects: []

  - method: GET
    path: "/kiosk-ops/order-handoffs/{order_id}"
    description: "Fetch one order handoff with its priced_lines, money fields, order_number and receipt_hash."
    roles: [PlatformAdmin, ContentManager, ComplianceOfficer, StoreOperator, DeviceAgent]
    code: 200
    input: []
    output: OrderHandoff
    side_effects: []

  - method: POST
    path: "/kiosk-ops/order-handoffs/{order_id}/actions"
    description: "Drive the kitchen handoff. `action` is one of KITCHEN_ACK (QUEUED_TO_KITCHEN -> ACCEPTED) or VOID (QUEUED_TO_KITCHEN -> VOIDED, the compensation)."
    roles: [StoreOperator, PlatformAdmin]
    code: 200
    input: [action, "void_reason?"]
    output: OrderHandoff
    side_effects:
      - "KITCHEN_ACK moves handoff_state QUEUED_TO_KITCHEN -> ACCEPTED and payment_state AUTHORIZED -> CAPTURED, leaving Store.open_order_count unchanged (both states are open)"
      - "VOID is the compensation: handoff_state VOIDED, payment_state VOIDED, every reserved unit released back to StoreItemAvailability.reserved_units with availability states re-derived, and Store.open_order_count decremented — while Store.daily_order_seq_counter is deliberately NOT decremented"
      - "appends an AuditEvent with subject_kind ORDER_HANDOFF"

  # ---- Computed reads and test-driving surface -------------------------------
  - method: GET
    path: "/kiosk-ops/stores/{store_id}/menu-projection"
    description: "The projection a kiosk or menu board renders for this store right now: the resolved daypart, the board display prices from the store's resolved published bundle, per-item availability, the selected campaign and the ranked upsell suggestions."
    roles: [PlatformAdmin, ContentManager, PricingAnalyst, ComplianceOfficer, StoreOperator, DeviceAgent]
    code: 200
    input: ["at_minute_of_day?", "cart_item_ids?", "device_id?"]
    output:
      resolved_bundle_id: string
      resolved_bundle_version: integer
      daypart_code: string
      layout_code: string
      phase: string
      local_minute_of_day: integer
      selected_campaign_version_id: string
      items: array
      suggested_upsell_rule_ids: array
      stale_prices: boolean
    side_effects:
      - "resolves the bundle and daypart slots by walking the store's cluster inheritance chain per calculation daypart_resolution"
      - "reads board_display_price from the resolved bundle's price_snapshot and sets stale_prices true when the bundle's stale_flag is set"
      - "ranks upsell suggestions per calculation upsell_suggestion_selection using cart_item_ids and, when device_id is supplied, that device's screen_reader_ok flag for the suggestion cap"

  - method: GET
    path: "/kiosk-ops/audit-events"
    description: "The append-only audit trail. Filter by polymorphic subject (subject_kind plus subject_id) or by action; ordered by sequence_no ascending."
    roles: [PlatformAdmin, ComplianceOfficer, PricingApprover]
    code: 200
    input: ["subject_kind?", "subject_id?", "action?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  - method: POST
    path: "/kiosk-ops/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — the mandated startup default — and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
      devices_rescored: integer
      campaign_versions_advanced: integer
      availabilities_released: integer
    side_effects:
      - "advances the logical clock to current_utc"
      - "re-derives every Device's consecutive_missed_heartbeats, rolling_health_score, worst_case_health_score and health_state, then every affected Store.content_posture"
      - "advances every PromoCampaignVersion whose window has opened or closed (SCHEDULED -> ACTIVE -> EXPIRED)"
      - "clears every StoreItemAvailability whose eighty_six_until_utc the clock has passed, running the RESTORE cascade for each"
      - "re-derives every Device.payment_compliance_state from attestation_expiry_utc"

# =============================================================================
# §1.6 Error Code Catalog  (36 codes; every one is triggerable from §1.5)
# =============================================================================
errors:
  # --- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is absent, blank, or names a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_DEVICE_IDENTITY_MISMATCH
    http: 403
    condition: "A DeviceAgent acts on a {device_id} that is not its own X-User-ID"
  - id: ERR_STORE_SCOPE_VIOLATION
    http: 403
    condition: "A StoreOperator addresses a resource owned by a different store"
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: "The approving X-User-ID equals requested_by_user_id or is already present in approval_user_ids"

  # --- existence -------------------------------------------------------------
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path parameter does not resolve to an existing row"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "A foreign key in the request body does not resolve to an existing row"

  # --- request shape / uniqueness -------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum or action verb, negative integer where non-negative is required, minute-of-day outside 0..1439, unparseable ISO-8601 instant, qty below 1, or max_prompt_seconds below MIN_PROMPT_SECONDS"
  - id: ERR_DUPLICATE_NATURAL_KEY
    http: 409
    condition: "zone_code, cluster_code, store_code, sku, device_code, (campaign_code, version_no) or (cluster_id, trigger_item_id, suggestion_slot) among ACTIVE upsell rules already exists"
  - id: ERR_DUPLICATE_AVAILABILITY
    http: 409
    condition: "A StoreItemAvailability row already exists for this (store_id, menu_item_id) pair"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_MENU_ITEM_VERSION
    http: 412
    condition: "expected_menu_item_version does not equal the MenuItem's current version"
  - id: ERR_STALE_CONTENT_BUNDLE_VERSION
    http: 412
    condition: "expected_content_bundle_version does not equal the ContentBundle's current version"

  # --- state -----------------------------------------------------------------
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "An action is attempted on an entity already in a terminal state"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested action verb is not a declared transition out of the entity's current state"
  - id: ERR_REQUEST_NOT_APPROVED
    http: 409
    condition: "APPLY is attempted on a PriceChangeRequest whose state is not APPROVED"
  - id: ERR_BUNDLE_NOT_PUBLISHED
    http: 409
    condition: "A device is asked to cache, or an order resolves, a ContentBundle whose state is not PUBLISHED"
  - id: ERR_STORE_CONTENT_FROZEN
    http: 409
    condition: "An order is captured at a store whose derived content_posture is FROZEN"
  - id: ERR_DEVICE_NOT_OPERATIONAL
    http: 409
    condition: "The capturing device's health_state is QUARANTINED or OFFLINE, or its cache_state is MISSING"

  # --- accessibility / compliance safety ------------------------------------
  - id: ERR_PAYMENT_DEVICE_NON_COMPLIANT
    http: 422
    condition: "A CARD-tendered order is captured on a device whose payment_compliance_state is UNATTESTED or NON_COMPLIANT"
  - id: ERR_ACCESSIBILITY_AUDIT_REQUIRED
    http: 422
    condition: "PUBLISH is attempted on a bundle whose accessibility_audit_state is not PASSED"
  - id: ERR_SCREEN_READER_TEXT_MISSING
    http: 422
    condition: "A snapshot item has blank screen_reader_text or contrast_ratio below MIN_CONTRAST_RATIO"
  - id: ERR_STORE_ACCESSIBILITY_LAPSED
    http: 422
    condition: "A KIOSK caches a bundle at a store whose accessibility_certified_until_utc is before the logical clock"
  - id: ERR_DEVICE_KIND_NOT_SUPPORTED
    http: 422
    condition: "A KIOSK is registered without pin_pad_firmware_version, or a payment attestation is submitted for a MENU_BOARD"

  # --- structural constraints ------------------------------------------------
  - id: ERR_DAYPART_SLOT_OVERLAP
    http: 409
    condition: "A new daypart slot's half-open interval overlaps an existing slot of the same bundle, or start_minute_of_day is not below end_minute_of_day"
  - id: ERR_CAMPAIGN_WINDOW_CONFLICT
    http: 409
    condition: "Scheduling a campaign version whose closed window intersects another SCHEDULED or ACTIVE version of the same stacking_group in the same cluster"
  - id: ERR_UPSELL_CYCLE_DETECTED
    http: 422
    condition: "An upsell rule would close a cycle in its cluster's ACTIVE trigger->suggested digraph, or trigger_item_id equals suggested_item_id"
  - id: ERR_CLUSTER_CHAIN_INVALID
    http: 422
    condition: "parent_cluster_id would create a cycle or push chain_depth above MAX_CLUSTER_CHAIN_DEPTH"
  - id: ERR_OFFLINE_CACHE_CAPACITY_EXCEEDED
    http: 409
    condition: "A device is asked to retain more bundles, or hold more offline orders, than its offline_cache_capacity"

  # --- temporal --------------------------------------------------------------
  - id: ERR_EFFECTIVE_DATE_IN_PAST
    http: 422
    condition: "effective_from_utc is before the logical clock at request creation, or APPLY runs before effective_from_utc"
  - id: ERR_CAMPAIGN_WINDOW_EXPIRED
    http: 422
    condition: "window_end_utc is at or before the logical clock, or at or before window_start_utc"

  # --- referential -----------------------------------------------------------
  - id: ERR_ITEM_NOT_IN_PUBLISHED_BUNDLE
    http: 422
    condition: "An ordered line's menu_item_id is absent from the pinned bundle's snapshot_item_ids"
  - id: ERR_PRICE_ZONE_MISMATCH
    http: 422
    condition: "The request's price_zone_id is not used by any store, or an override is written for a zone other than the one named on the request"
  - id: ERR_UPSELL_RULE_NOT_ELIGIBLE
    http: 422
    condition: "An accepted_upsell_rule_ids entry is not ACTIVE, is outside the store's cluster chain, or its trigger/suggested items are not both in the cart"
  - id: ERR_ITEM_EIGHTY_SIXED
    http: 409
    condition: "An ordered item's StoreItemAvailability at the capturing store has availability_state UNAVAILABLE"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_DUAL_APPROVAL_REQUIRED
    http: 409
    condition: "APPLY is attempted with fewer approvals than required_approvals"
  - id: ERR_UPLIFT_CAP_EXCEEDED
    http: 422
    condition: "uplift_bp computed from the raw proposed price exceeds the zone's max_uplift_bp"

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Chain-level operator. Owns the physical topology (price zones, stores, devices) and the logical clock, and may drive any workflow action as a break-glass operator."
    identity: opaque
    exclusive_operations:
      - "POST /kiosk-ops/price-zones"
      - "POST /kiosk-ops/stores"
      - "POST /kiosk-ops/_clock/set_current_utc"
    shared_operations:
      - "POST /kiosk-ops/store-clusters"
      - "POST /kiosk-ops/menu-items"
      - "POST /kiosk-ops/devices"
      - "POST /kiosk-ops/stores/{store_id}/item-availabilities"
      - "POST /kiosk-ops/item-availabilities/{availability_id}/actions"
      - "POST /kiosk-ops/devices/{device_id}/heartbeat"
      - "POST /kiosk-ops/devices/{device_id}/cache-sync"
      - "POST /kiosk-ops/devices/{device_id}/payment-attestation"
      - "POST /kiosk-ops/price-change-requests/{request_id}/actions"
      - "POST /kiosk-ops/campaign-versions/{version_id}/actions"
      - "POST /kiosk-ops/content-bundles/{bundle_id}/actions"
      - "POST /kiosk-ops/order-handoffs/{order_id}/actions"
      - "every GET endpoint"

  - name: ContentManager
    description: "Owns menu content: bundles, daypart slots, campaign versions and upsell rules. Cannot price and cannot approve prices."
    identity: opaque
    exclusive_operations:
      - "POST /kiosk-ops/content-bundles"
      - "POST /kiosk-ops/content-bundles/{bundle_id}/daypart-slots"
      - "POST /kiosk-ops/campaign-versions"
      - "POST /kiosk-ops/upsell-rules"
    shared_operations:
      - "POST /kiosk-ops/store-clusters"
      - "POST /kiosk-ops/menu-items"
      - "POST /kiosk-ops/menu-items/{menu_item_id}/accessibility-copy"
      - "POST /kiosk-ops/content-bundles/{bundle_id}/actions (VALIDATE, PUBLISH, ROLLBACK)"
      - "POST /kiosk-ops/campaign-versions/{version_id}/actions"
      - "GET /kiosk-ops/stores/{store_id}/menu-projection"

  - name: PricingAnalyst
    description: "Proposes zone price changes and applies them once approved. Segregation of duties forbids it from approving anything."
    identity: opaque
    exclusive_operations:
      - "POST /kiosk-ops/price-change-requests"
      - "POST /kiosk-ops/price-change-requests/{request_id}/actions (SUBMIT, APPLY, WITHDRAW)"
    shared_operations:
      - "GET /kiosk-ops/price-change-requests"
      - "GET /kiosk-ops/menu-items/{menu_item_id}"
      - "GET /kiosk-ops/stores/{store_id}/menu-projection"

  - name: PricingApprover
    description: "Approves, rejects or returns price change requests. May never approve a request it opened, and a second approval must come from a different X-User-ID than the first."
    identity: opaque
    exclusive_operations:
      - "POST /kiosk-ops/price-change-requests/{request_id}/actions (APPROVE, REJECT, REQUEST_CHANGES, ROLLBACK)"
    shared_operations:
      - "GET /kiosk-ops/price-change-requests"
      - "GET /kiosk-ops/audit-events"

  - name: ComplianceOfficer
    description: "Owns accessibility audits and kiosk payment-device attestations, and reads the audit trail. Cannot author content or prices."
    identity: opaque
    exclusive_operations:
      - "POST /kiosk-ops/devices/{device_id}/payment-attestation"
      - "POST /kiosk-ops/content-bundles/{bundle_id}/actions (ACCESSIBILITY_AUDIT)"
    shared_operations:
      - "POST /kiosk-ops/menu-items/{menu_item_id}/accessibility-copy"
      - "GET /kiosk-ops/audit-events"
      - "GET /kiosk-ops/devices"
      - "GET /kiosk-ops/content-bundles/{bundle_id}"

  - name: StoreOperator
    description: "Acts as one store. X-User-ID is that Store's id; every addressed resource must belong to it. Owns inventory sync, 86 lists, its own devices and the kitchen handoff."
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /kiosk-ops/order-handoffs/{order_id}/actions"
    shared_operations:
      - "POST /kiosk-ops/stores/{store_id}/item-availabilities"
      - "POST /kiosk-ops/item-availabilities/{availability_id}/actions"
      - "POST /kiosk-ops/devices"
      - "POST /kiosk-ops/devices/{device_id}/cache-sync"
      - "POST /kiosk-ops/devices/{device_id}/orders"
      - "GET /kiosk-ops/stores/{store_id}/menu-projection"

  - name: DeviceAgent
    description: "Acts as one kiosk or menu board. X-User-ID is that Device's id and must equal the {device_id} in the path. Sends heartbeats, pulls cache and captures orders."
    identity: "entity_backed:Device"
    exclusive_operations:
      - "POST /kiosk-ops/devices/{device_id}/heartbeat"
    shared_operations:
      - "POST /kiosk-ops/devices/{device_id}/cache-sync"
      - "POST /kiosk-ops/devices/{device_id}/orders"
      - "GET /kiosk-ops/devices/{device_id}"
      - "GET /kiosk-ops/order-handoffs/{order_id}"
      - "GET /kiosk-ops/stores/{store_id}/menu-projection"
