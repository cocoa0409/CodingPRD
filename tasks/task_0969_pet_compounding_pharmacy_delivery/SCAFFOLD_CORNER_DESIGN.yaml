scaffold_corner_design:
  - section: entities
    instances:
      - name: owner_creation_defaults
        claim_type: creation
        grounds:
          - entities.Owner.fields.status
          - entities.Owner
        distinguishing_aspect: "POST /owners with the four required fields returns 201 with system-minted id, status ACTIVE, version 1, created_at populated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /owners", payload: { full_name: "Owen K1", email: "k1@x.com", phone: "555-91", ship_to_address: "19 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id, st: $.data.status, v: $.data.version } }
          assert:
            - "response code 201; Owner.${own}.status == ACTIVE; version == 1; id is a prefix-free UUID; created_at and updated_at present"
      - name: pet_weight_must_be_positive
        claim_type: type_constraints
        grounds:
          - entities.Pet.fields.weight_kg
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "weight_kg == 0 (and negatives) are rejected at intake with ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["one owner"]
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen K2", email: "k2@x.com", phone: "555-92", ship_to_address: "20 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
          trigger:
            - { call: "POST /owners/${own}/pets", payload: { name: "Zero", species: "DOG", weight_kg: 0, allergies: [] }, as: PharmacyAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (http 400); no Pet created"
      - name: prescription_controlled_expiration_computed
        claim_type: computed_fields
        grounds:
          - entities.Prescription.fields.expiration_date
          - entities.Prescription.fields.is_controlled
          - entities.Prescription.fields.schedule_snapshot
        distinguishing_aspect: "expiration_date is server-computed: C_IV script written 2026-05-01 expires 2026-10-28 (+180d) while a NON_CONTROLLED script the same day expires 2027-05-01 (+365d); schedule snapshot and is_controlled derive from the drug."
        test_recipe:
          setup: ["owner, pet, DEA-registered verified vet, one C_IV drug+formula, one NON_CONTROLLED drug+formula"]
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen K3", email: "k3@x.com", phone: "555-93", ship_to_address: "21 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Com", species: "DOG", weight_kg: 7, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr K3", license_number: "LIC-K3", dea_registration_number: "DEA-K3", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "TramK3", schedule: "C_IV", requires_cold_chain: false, unit_cost_cents: 350, default_beyond_use_days: 30 }, as: PharmacyAdmin, captures: { drugC: $.data.id } }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiK3", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drugN: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drugC}", name: "TramSuspK3", dosage_form: "SUSPENSION", strength_mg_per_ml: 10, beyond_use_days: 30, base_compounding_minutes: 60 }, as: Pharmacist, captures: { frmC: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drugN}", name: "AmoxiSuspK3", dosage_form: "SUSPENSION", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frmN: $.data.id } }
          trigger:
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frmC}", quantity: 10, days_supply: 10, refills_authorized: 1, directions: "BID", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rxC: $.data.id, expC: $.data.expiration_date, ctlC: $.data.is_controlled, schC: $.data.schedule_snapshot } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frmN}", quantity: 10, days_supply: 10, refills_authorized: 1, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rxN: $.data.id, expN: $.data.expiration_date, ctlN: $.data.is_controlled } }
          assert:
            - "Prescription.${rxC}.expiration_date == 2026-10-28 and is_controlled == true and schedule_snapshot == C_IV"
            - "Prescription.${rxN}.expiration_date == 2027-05-01 and is_controlled == false and schedule_snapshot == NON_CONTROLLED"
      - name: prescription_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but nonexistent prescription id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /prescriptions/00000000-0000-0000-0000-000000000000", payload: {}, as: PharmacyTech, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NOT_FOUND (http 404)"
      - name: controlled_entry_system_computed
        claim_type: system_fields
        grounds:
          - entities.ControlledSubstanceEntry.fields.running_balance
          - entities.ControlledSubstanceEntry.fields.qty_delta
        distinguishing_aspect: "Receiving a controlled lot writes exactly one RECEIVE entry with server-computed qty_delta == received_qty and running_balance == received_qty; the append-only entity carries no version/updated_at."
        test_recipe:
          setup: ["C_IV drug in catalog"]
          setup_api_calls:
            - { call: "POST /drug-catalog-items", payload: { drug_name: "TramK5", schedule: "C_IV", requires_cold_chain: false, unit_cost_cents: 350, default_beyond_use_days: 30 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
          trigger:
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-K5", received_qty: 60, unit_cost_cents: 300, expiration_date: "2027-01-01" }, as: PharmacyTech, captures: { lot: $.data.id } }
            - { call: "GET /controlled-substance-entries?lot_id=${lot}", payload: {}, as: ComplianceOfficer }
          assert:
            - "exactly one entry: entry_type RECEIVE, qty_delta == 60, running_balance == 60, recorded_at and recorded_by set by the system"
            - "entry payload has no version and no updated_at (common_fields false, append-only)"

  - section: state_machines
    instances:
      - name: prescription_initial_state_received
        claim_type: initial_state
        grounds:
          - state_machines.Prescription
          - entities.Prescription.fields.refills_remaining
        distinguishing_aspect: "A newly created prescription starts in RECEIVED with refills_remaining initialized to refills_authorized."
        test_recipe:
          setup: ["owner, pet, verified DEA vet, non-controlled formula"]
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen S1", email: "s1@x.com", phone: "556-01", ship_to_address: "22 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Ini", species: "DOG", weight_kg: 7, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr S1", license_number: "LIC-S1", dea_registration_number: "DEA-S1", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiS1", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspS1", dosage_form: "SUSPENSION", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frm: $.data.id } }
          trigger:
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 10, days_supply: 10, refills_authorized: 3, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id, st: $.data.status, rr: $.data.refills_remaining } }
          assert:
            - "Prescription.${rx}.status == RECEIVED and refills_remaining == 3"
      - name: vet_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Prescription.VET_VERIFICATION_PENDING_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once REJECTED, every further prescription action (vet-confirm shown) fails with ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["prescription REJECTED by its vet"]
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen S2", email: "s2@x.com", phone: "556-02", ship_to_address: "23 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Ter", species: "CAT", weight_kg: 4, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr S2", license_number: "LIC-S2", dea_registration_number: "DEA-S2", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiS2", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspS2", dosage_form: "SUSPENSION", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 10, days_supply: 10, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-reject", payload: { reason: "bad dose" }, as: Veterinarian, as_user_id: "${vet}" }
          trigger:
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE (http 409); prescription remains REJECTED"
      - name: complete_flavoring_invalid_from_compounding
        claim_type: invalid_transition
        grounds:
          - state_machines.CompoundOrder.FLAVORING_to_QA_PENDING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "complete-flavoring is only valid from FLAVORING; invoking it while COMPOUNDING (flavor step not yet entered) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["flavored order in COMPOUNDING"]
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen S3", email: "s3@x.com", phone: "556-03", ship_to_address: "24 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Inv", species: "DOG", weight_kg: 6, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr S3", license_number: "LIC-S3", dea_registration_number: "DEA-S3", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiS3", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /flavorings", payload: { name: "FishS3", allergen_tags: ["FISH"], surcharge_cents: 300, compatible_species: ["DOG", "CAT"] }, as: PharmacyAdmin, captures: { flv: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspS3", dosage_form: "SUSPENSION", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 5, days_supply: 5, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-S3", received_qty: 50, unit_cost_cents: 100, expiration_date: "2027-01-01" }, as: PharmacyTech }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-S3", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { flavoring_id: "${flv}", is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id } }
            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech }
            - { call: "POST /compound-orders/${ord}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
          trigger:
            - { call: "POST /compound-orders/${ord}/complete-flavoring", payload: {}, as: Pharmacist, as_user_id: "pharm-a", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE; order remains COMPOUNDING"
      - name: ambient_shipment_rejects_readings
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=31]
          - entities.Shipment.fields.cold_chain_status
          - errors[ERR_COLD_CHAIN_NOT_REQUIRED]
        distinguishing_aspect: "An ambient-drug shipment initializes cold_chain_status NOT_REQUIRED and rejects any temperature reading with ERR_COLD_CHAIN_NOT_REQUIRED."
        test_recipe:
          setup: ["ambient order READY_TO_DISPATCH and PAID"]
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen S4", email: "s4@x.com", phone: "556-04", ship_to_address: "25 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Amb", species: "DOG", weight_kg: 6, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr S4", license_number: "LIC-S4", dea_registration_number: "DEA-S4", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiS4", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspS4", dosage_form: "SUSPENSION", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 5, days_supply: 5, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /lots", payload: { drug_catalog_item_id: "${drug}", lot_number: "L1-S4", received_qty: 50, unit_cost_cents: 100, expiration_date: "2027-01-01" }, as: PharmacyTech }
            - { call: "POST /compounding-benches", payload: { bench_code: "BN-S4", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id } }
            - { call: "POST /compound-orders/${ord}/allocate", payload: {}, as: PharmacyTech }
            - { call: "POST /compound-orders/${ord}/start-compounding", payload: { bench_id: "${bench}", start_at: "2026-05-01T09:00:00Z", end_at: "2026-05-01T10:00:00Z" }, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-compounding", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/qa-pass", payload: {}, as: Pharmacist, as_user_id: "pharm-b" }
            - { call: "POST /compound-orders/${ord}/pay", payload: { payment_method: "CARD" }, as: Owner, as_user_id: "${own}" }
          trigger:
            - { call: "POST /compound-orders/${ord}/shipments", payload: { carrier: "PetEx", service_level: "STANDARD", destination_zone: "Z1" }, as: Pharmacist, captures: { shp: $.data.id, cc: $.data.cold_chain_status } }
            - { call: "POST /shipments/${shp}/temperature-readings", payload: { recorded_at: "2026-05-01T09:00:00Z", temp_celsius: 20 }, as: PharmacyTech, captures: { err: $.data.error_id } }
          assert:
            - "Shipment.${shp}.cold_chain_status == NOT_REQUIRED at creation"
            - "reading attempt fails with error_id == ERR_COLD_CHAIN_NOT_REQUIRED (http 422)"

      - name: claim_appeal_loop_max_two
        claim_type: invalid_transition
        grounds:
          - state_machines.InsuranceClaim.REJECTED_to_APPEALED
          - validations[priority=28]
          - errors[ERR_MAX_APPEALS_EXCEEDED]
        distinguishing_aspect: "The REJECTED -> APPEALED loop is bounded: after two appeals (appeal_count == 2) a third appeal fails with ERR_MAX_APPEALS_EXCEEDED."
        test_recipe:
          setup: ["order with provisional 500 (qty 5 @100, 2 kg pet); policy deductible 0 coverage 1.0; claim SUBMITTED"]
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen S5", email: "s5@x.com", phone: "556-05", ship_to_address: "26 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Ape", species: "CAT", weight_kg: 2, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr S5", license_number: "LIC-S5", dea_registration_number: "DEA-S5", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /drug-catalog-items", payload: { drug_name: "AmoxiS5", schedule: "NON_CONTROLLED", requires_cold_chain: false, unit_cost_cents: 100, default_beyond_use_days: 14 }, as: PharmacyAdmin, captures: { drug: $.data.id } }
            - { call: "POST /formulas", payload: { drug_catalog_item_id: "${drug}", name: "SuspS5", dosage_form: "CAPSULE", strength_mg_per_ml: 25, beyond_use_days: 14, base_compounding_minutes: 45 }, as: Pharmacist, captures: { frm: $.data.id } }
            - { call: "POST /prescriptions", payload: { pet_id: "${pet}", owner_id: "${own}", veterinarian_id: "${vet}", formula_id: "${frm}", quantity: 5, days_supply: 5, refills_authorized: 0, directions: "QD", written_date: "2026-05-01" }, as: PharmacyTech, captures: { rx: $.data.id } }
            - { call: "POST /prescriptions/${rx}/submit-verification", payload: {}, as: PharmacyTech }
            - { call: "POST /prescriptions/${rx}/vet-confirm", payload: {}, as: Veterinarian, as_user_id: "${vet}", captures: { rxv: $.data.version } }
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { ord: $.data.id } }
            - { call: "POST /insurance-policies", payload: { pet_id: "${pet}", insurer_name: "PetSure", policy_number: "POL-S5", deductible_cents: 0, coverage_pct: 1.0, annual_limit_cents: 100000, renewal_date: "2027-01-01" }, as: Owner, as_user_id: "${own}", captures: { pol: $.data.id, polv: $.data.version } }
            - { call: "POST /insurance-policies/${pol}/claims", payload: { compound_order_id: "${ord}", claimed_amount_cents: 500, expected_policy_version: "${polv}" }, as: Owner, as_user_id: "${own}", captures: { clm: $.data.id } }
          trigger:
            - { call: "POST /claims/${clm}/adjudicate", payload: { outcome: "REJECT", denial_reason: "not covered" }, as: InsuranceAdjuster }
            - { call: "POST /claims/${clm}/appeal", payload: {}, as: Owner, as_user_id: "${own}" }
            - { call: "POST /claims/${clm}/adjudicate", payload: { outcome: "REJECT", denial_reason: "still not covered" }, as: InsuranceAdjuster }
            - { call: "POST /claims/${clm}/appeal", payload: {}, as: Owner, as_user_id: "${own}" }
            - { call: "POST /claims/${clm}/adjudicate", payload: { outcome: "REJECT", denial_reason: "final" }, as: InsuranceAdjuster }
            - { call: "POST /claims/${clm}/appeal", payload: {}, as: Owner, as_user_id: "${own}", captures: { err: $.data.error_id } }
          assert:
            - "two REJECTED -> APPEALED loops succeed; third appeal fails with error_id == ERR_MAX_APPEALS_EXCEEDED"
            - "InsuranceClaim.${clm}.appeal_count == 2 and status == REJECTED"
      - name: autoship_resume_after_cancel_invalid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AutoShipSchedule
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CANCELLED auto-ship schedule is terminal: resume fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["verified rx with an ACTIVE schedule, then cancelled"]
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen S6", email: "s6@x.com", phone: "556-06", ship_to_address: "27 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
            - { call: "POST /owners/${own}/pets", payload: { name: "Sch", species: "DOG", weight_kg: 6, allergies: [] }, as: PharmacyAdmin, captures: { pet: $.data.id } }
            - { call: "POST /veterinarians", payload: { full_name: "Dr S6", license_number: "LIC-S6", dea_registration_number: "DEA-S6", practice_state: "CA" }, as: PharmacyAdmin, captures: { vet: $.data.id } }
            - { call: "POST /veterinarians/${vet}/verify", payload: {}, as: ComplianceOfficer }
