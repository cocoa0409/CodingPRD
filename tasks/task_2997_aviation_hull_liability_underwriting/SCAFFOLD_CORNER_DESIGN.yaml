scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_operator_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Operator
          - endpoints[POST /aviation/operators]
          - response_envelope.success
        distinguishing_aspect: "A FLIGHT_SCHOOL operator created with only the three mandatory inputs must come back with aoc_number null, policy_count 0 and the four common fields present, wrapped in the meta/response_type/data envelope."
        test_recipe:
          setup:
            - "Empty database; the logical clock is parked at the mandatory startup default 2026-08-01T00:00:00Z and is never moved."
          setup_api_calls: []
          trigger:
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Broker
              as_user_id: "bkr-1"
              captures: { op_id: $.data.id }
          assert:
            - "Returns 201 with response_type == object and a meta block carrying api_request_id and api_request_timestamp"
            - "data.legal_name == 'Northwind Flight Academy', data.operator_type == 'FLIGHT_SCHOOL', data.home_base_icao == 'KBFI'"
            - "data.aoc_number == null (declared default) and data.policy_count == 0 (declared computed default)"
            - "data.id is a bare UUID with no type prefix; data.version == 1; data.created_at and data.updated_at are present ISO 8601 UTC instants with three fractional digits"
      - name: corner_aircraft_retrieval_returns_stored_plus_clock_basis_depreciation
        claim_type: retrieval
        grounds:
          - entities.Aircraft.fields.current_depreciated_value_cents
          - calculations.depreciated_hull_value
          - endpoints[GET /aviation/aircraft/{id}]
        distinguishing_aspect: "GET on an airframe returns the stored inputs verbatim AND the clock_basis variant of the depreciation curve, so a 2016 hull worth 66000000 new reads 39600000 while the logical clock sits in 2026."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; one airframe on file."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N511NW", aircraft_class: "MULTI_PISTON", manufacture_year: 2016, hull_new_value_cents: 66000000, seat_count: 6, max_takeoff_weight_kg: 2495 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac1_id: $.data.id }
          trigger:
            - call: "GET /aviation/aircraft/${ac1_id}"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "Returns 200; data.registration_mark == 'N511NW', data.manufacture_year == 2016, data.hull_new_value_cents == 66000000, data.seat_count == 6, data.max_takeoff_weight_kg == 2495"
            - "data.current_depreciated_value_cents == 39600000 (age 10 at the clock year, residual 600000 ppm, floor(66000000 * 600000 / 1000000))"
      - name: corner_policies_list_returns_pagination_envelope_with_filter
        claim_type: listing
        grounds:
          - endpoints[GET /aviation/policies]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three DRAFT policies exist; limit 2 offset 0 with status=DRAFT returns 2 rows, total_count 3 and has_more true, and offset 2 returns the last row with has_more false — total_count reflects the FILTER, not the table."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; one operator; three DRAFT policies on that operator and nothing else."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "SINGLE_AIRCRAFT", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "DOMESTIC", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "SINGLE_AIRCRAFT", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "CONTINENTAL", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol2_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol3_id: $.data.id }
          trigger:
            - call: "GET /aviation/policies?status=DRAFT&limit=2&offset=0"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /aviation/policies?status=DRAFT&limit=2&offset=2"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /aviation/policies?policy_type=FLEET"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "Trigger call 1 returns 200 with response_type == array, exactly 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "Trigger call 2 returns exactly 1 row, total_count == 3, offset == 2 and has_more == false"
            - "Trigger call 3 returns exactly 1 row (${pol3_id}) with total_count == 1 and has_more == false, and its limit defaults to 10 and offset to 0"
      - name: corner_policy_not_found_on_well_formed_unknown_uuid
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_POLICY_NOT_FOUND]
          - endpoints[GET /aviation/policies/{id}]
        distinguishing_aspect: "A syntactically valid UUID that matches no Policy yields 404 ERR_POLICY_NOT_FOUND rather than 400 or 422; the existence check at priority 5 runs before every business rule."
        test_recipe:
          setup:
            - "Empty database apart from the startup clock default."
          setup_api_calls: []
          trigger:
            - call: "GET /aviation/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
            - call: "GET /aviation/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Auditor
              as_user_id: "aud-1"
          assert:
            - "Trigger call 1 returns 404 with response_type == error and data.error_id == 'ERR_POLICY_NOT_FOUND'"
            - "Trigger call 2 returns 404 with data.error_id == 'ERR_CLAIM_NOT_FOUND' — each entity has its own existence error, they are not collapsed into one code"
      - name: corner_schedule_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /aviation/schedules]
        distinguishing_aspect: "agreed_value_cents has source input and no default, so omitting it is 400 ERR_INVALID_REQUEST (a shape failure) and NOT 422 ERR_VALIDATION_FAILED; sending it as a JSON string is the same 400."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; one operator, one airframe, one pilot and one DRAFT policy on file, so every existence check would pass."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N511NW", aircraft_class: "MULTI_PISTON", manufacture_year: 2016, hull_new_value_cents: 66000000, seat_count: 6, max_takeoff_weight_kg: 2495 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac1_id: $.data.id }
            - call: "POST /aviation/pilots"
              payload: { pilot_name: "Dana Reyes", license_type: "CPL", total_logged_hours: 1200, hours_on_type: 80, last_training_completed_at: "2026-06-01T00:00:00Z", medical_expires_at: "2027-06-30T00:00:00Z", instrument_rated: false }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { p1_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac1_id}", named_pilot_id: "${p1_id}", use_class: "PRIVATE", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac1_id}", named_pilot_id: "${p1_id}", use_class: "PRIVATE", agreed_value_cents: "30000000", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
          assert:
            - "Trigger call 1 returns 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "Trigger call 2 returns 400 with data.error_id == 'ERR_INVALID_REQUEST' — money is an integer number of cents, never a JSON string"
            - "No AircraftSchedule row is created: GET /aviation/schedules?policy_id=${pol_id} returns total_count 0 and Policy.${pol_id}.live_schedule_count == 0"
      - name: corner_optional_field_defaults_applied_on_omission
        claim_type: defaults
        grounds:
          - entities.Policy.fields.permitted_use_classes
          - entities.Policy.fields.automatic_acquisition_enabled
          - entities.Policy.fields.acquisition_reporting_days
          - entities.Policy.fields.war_risk_required
          - entities.Pilot.fields.instrument_rated
          - entities.AircraftSchedule.fields.acquisition_source
        distinguishing_aspect: "Every optional input with a declared default is omitted at once: the policy comes back with all four use classes permitted, automatic acquisition off, a 30-day reporting window and war risk not required; the pilot with instrument_rated false; the schedule with acquisition_source SCHEDULED."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; one FLIGHT_SCHOOL operator and one 2020 airframe (hull_new_value_cents 40000000, 120% over-insurance cap 36480000 in 2026) on file."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N512NW", aircraft_class: "SINGLE_PISTON", manufacture_year: 2020, hull_new_value_cents: 40000000, seat_count: 4, max_takeoff_weight_kg: 1300 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac2_id: $.data.id }
          trigger:
            - call: "POST /aviation/pilots"
              payload: { pilot_name: "Morgan Vale", license_type: "ATPL", total_logged_hours: 3000, hours_on_type: 300, last_training_completed_at: "2026-07-01T00:00:00Z", medical_expires_at: "2028-01-31T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { p2_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac2_id}", named_pilot_id: "${p2_id}", use_class: "PRIVATE", agreed_value_cents: 30000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { s_id: $.data.id }
          assert:
            - "Pilot.${p2_id}.instrument_rated == false (declared default), so qualification_score_logged == 850 and rating_band_logged == 'BAND_A' (400 hours component + 250 type component + 0 instrument bonus + 200 ATPL licence points, no recurrency penalty)"
            - "Policy.${pol_id}.permitted_use_classes == ['PRIVATE', 'BUSINESS', 'INSTRUCTIONAL', 'COMMERCIAL'], automatic_acquisition_enabled == false, acquisition_reporting_days == 30, war_risk_required == false"
            - "Policy.${pol_id}.premises_liability_extension == false and product_liability_extension == false (system fields with declared defaults)"
            - "AircraftSchedule.${s_id}.acquisition_source == 'SCHEDULED' and coverage_status == 'PENDING' and warranty_status == 'PENDING_EVIDENCE'"
            - "AircraftSchedule.${s_id}.warranty_basis == 'LOGGED_HOURS' because Pilot.${p2_id}.verified_at is null"
      - name: corner_computed_fields_with_client_supplied_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Pilot.fields.qualification_score_logged
          - entities.AircraftSchedule.fields.hull_premium_cents
          - calculations.pilot_qualification_score
          - calculations.annual_hull_premium
        distinguishing_aspect: "A creation request that smuggles values for computed fields (qualification_score_logged 999, hull_premium_cents 1, rate_ppm 1) must have them ignored and overwritten by the formulas, not echoed."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; one FLIGHT_SCHOOL operator, one 2016 airframe (hull_new_value_cents 66000000) and one DRAFT FLEET policy, WORLDWIDE, base_hull_rate_ppm 18000 on file."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N511NW", aircraft_class: "MULTI_PISTON", manufacture_year: 2016, hull_new_value_cents: 66000000, seat_count: 6, max_takeoff_weight_kg: 2495 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { ac1_id: $.data.id }
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000, permitted_use_classes: ["PRIVATE", "BUSINESS", "INSTRUCTIONAL"] }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /aviation/pilots"
              payload: { pilot_name: "Dana Reyes", license_type: "CPL", total_logged_hours: 1200, hours_on_type: 80, last_training_completed_at: "2026-06-01T00:00:00Z", medical_expires_at: "2027-06-30T00:00:00Z", instrument_rated: false, qualification_score_logged: 999, rating_band_logged: "BAND_A", verified_total_hours: 5000 }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { p1_id: $.data.id }
            - call: "POST /aviation/schedules"
              payload: { policy_id: "${pol_id}", aircraft_id: "${ac1_id}", named_pilot_id: "${p1_id}", use_class: "INSTRUCTIONAL", agreed_value_cents: 45000000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", rate_ppm: 1, hull_premium_cents: 1, coverage_status: "ACTIVE" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { s_id: $.data.id }
          assert:
            - "Pilot.${p1_id}.qualification_score_logged == 490 and rating_band_logged == 'BAND_C' — the smuggled 999 / BAND_A are discarded"
            - "Pilot.${p1_id}.verified_total_hours == null and verified_at == null — system fields are not settable from the request body"
            - "AircraftSchedule.${s_id}.rate_ppm == 39375 and hull_premium_cents == 1771875 — the smuggled 1s are discarded"
            - "AircraftSchedule.${s_id}.coverage_status == 'PENDING' — the smuggled ACTIVE is discarded; only the bind transition may set it"
            - "AircraftSchedule.${s_id}.warranted_min_total_hours == 500 and warranted_min_hours_on_type == 50 (INSTRUCTIONAL row of calculations.pilot_warranty_minima)"
      - name: corner_system_fields_server_minted_with_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Policy.fields.policy_number
          - entities.Policy.fields.status
          - entities.Claim.fields.reserve_cents
          - complexity_profile.consistency_model
        distinguishing_aspect: "policy_number and status carry source system with no input slot: the client cannot choose either, and the policy is minted DRAFT with a non-empty server-side policy_number even when the body tries to dictate both."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; one operator on file."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000, policy_number: "CLIENT-CHOSEN-0001", status: "BOUND", written_premium_cents: 999999 }
              as: Broker
              as_user_id: "bkr-1"
              captures: { pol_id: $.data.id }
          assert:
            - "Returns 201; Policy.${pol_id}.status == 'DRAFT' — the smuggled BOUND is discarded"
            - "Policy.${pol_id}.policy_number is a non-empty server-minted string and is NOT 'CLIENT-CHOSEN-0001'"
            - "Policy.${pol_id}.written_premium_cents == 0, total_hull_sum_insured_cents == 0, outstanding_reserve_cents == 0, paid_hull_cents == 0, live_schedule_count == 0"
            - "Policy.${pol_id}.term_days == 365 (computed from the declared term, 2026-09-01 to 2027-09-01)"
            - "Operator.${op_id}.policy_count == 1, re-derived on the same request rather than lagging (consistency_model immediate)"
      - name: corner_enum_and_range_constraints_rejected_with_validation_failed
        claim_type: type_constraints
        grounds:
          - validations[priority=8]
          - errors[ERR_VALIDATION_FAILED]
          - entities.Aircraft.fields.aircraft_class
          - entities.Aircraft.fields.manufacture_year
          - entities.Policy.fields.base_hull_rate_ppm
        distinguishing_aspect: "Well-shaped JSON that violates a declared constraint is 422 ERR_VALIDATION_FAILED, distinct from the 400 of a missing/mistyped field: a bogus enum member, a manufacture_year of 1949, a base_hull_rate_ppm of 0 and a reversed term all land on the same 422."
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z; one operator on file."
          setup_api_calls:
            - call: "POST /aviation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/operators"
              payload: { legal_name: "Northwind Flight Academy", operator_type: "FLIGHT_SCHOOL", home_base_icao: "KBFI" }
              as: Underwriter
              as_user_id: "uw-1"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N514NW", aircraft_class: "GLIDER", manufacture_year: 2020, hull_new_value_cents: 40000000, seat_count: 4, max_takeoff_weight_kg: 1300 }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/aircraft"
              payload: { registration_mark: "N515NW", aircraft_class: "SINGLE_PISTON", manufacture_year: 1949, hull_new_value_cents: 40000000, seat_count: 4, max_takeoff_weight_kg: 1300 }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 0, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000 }
              as: Underwriter
              as_user_id: "uw-1"
            - call: "POST /aviation/policies"
              payload: { operator_id: "${op_id}", policy_type: "FLEET", effective_from: "2027-09-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", territorial_limit_code: "WORLDWIDE", base_hull_rate_ppm: 18000, hull_deductible_ppm: 15000, liability_limit_cents: 500000000, hull_aggregate_limit_cents: 900000000 }
              as: Underwriter
              as_user_id: "uw-1"
          assert:
            - "Trigger call 1 returns 422 ERR_VALIDATION_FAILED (GLIDER is not a declared aircraft_class member)"
            - "Trigger call 2 returns 422 ERR_VALIDATION_FAILED (manufacture_year below the declared 1950 floor)"
            - "Trigger call 3 returns 422 ERR_VALIDATION_FAILED (base_hull_rate_ppm below the declared floor of 1)"
            - "Trigger call 4 returns 422 ERR_VALIDATION_FAILED (effective_from must be strictly before effective_to)"
