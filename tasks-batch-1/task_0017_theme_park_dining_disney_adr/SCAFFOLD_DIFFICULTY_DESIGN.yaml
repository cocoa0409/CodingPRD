  # =========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: park_session_cancel_cascades_to_reservation_then_lightning_lane_depth3
        grounds:
          - state_machines.ParkSession.NOT_STARTED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.LightningLaneAddOn.REQUESTED_to_CANCELLED
          - endpoints.POST_/v1/park-sessions/{id}/cancel
        distinguishing_aspect: |
          Depth-3 transitive cascade originating from POST /v1/park-sessions/{id}/cancel:
          hop 1 (ParkSession → Reservation) sets Reservation.status=CANCELLED for each
          PENDING/CONFIRMED reservation on the session; hop 2 (Reservation → LightningLaneAddOn)
          is triggered BY the Reservation cancel in hop 1 (not directly by the ParkSession
          cancel) and sets LL.status=CANCELLED; hop 3 (Reservation → DiningPlan) reduces
          held credits and appends a CreditLedgerEntry(RELEASE). Each hop is causally
          dependent on the previous one — removing hop 1 makes hop 2 unreachable.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z (well before visit_date 2026-02-15)."
            - "ParkSession in status NOT_STARTED for visit_date 2026-02-15."
            - "One Reservation CONFIRMED on that session (party_size=2, credits_held=2)."
            - "One LightningLaneAddOn in status REQUESTED attached to that Reservation."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
