  - rule_id: combinatorial_formula
    instances:

      - name: valuation_multiple_nested_min_max_over_tier_and_age
        grounds:
          - "calculations.route_valuation"
          - "calculations.route_valuation.constants.MRR_TIER_1_CENTS"
          - "calculations.route_valuation.constants.MRR_TIER_2_CENTS"
          - "calculations.route_valuation.constants.MULTIPLE_FLOOR"
          - "calculations.route_valuation.constants.MULTIPLE_CAP"
          - "entities.RouteValuation.fields.base_multiple"
          - "entities.RouteValuation.fields.age_adjustment"
          - "entities.RouteValuation.fields.effective_multiple"
        distinguishing_aspect: "Mode (a) - nested min/max over two independently-derived terms: effective_multiple is min(12.0, max(6.0, base_multiple + age_adjustment)) where base_multiple comes from a three-way MRR tier and age_adjustment from a four-way age band, so a 1-cent move across MRR_TIER_1_CENTS (30000 -> 29999) swings valuation_cents from 300000 to 269991 while age is held fixed at 30 months, and a route in the top MRR tier with a 17-month age still lands on 10.0 because the -1.0 band cancels the 11.0 tier."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; AZ StateLicenseProfile seeded; seller ACTIVE."
            - "Three DRAFT listings for the same seller in three different regions (PHX-T1, PHX-T2, PHX-T3), so the (seller_id, region_code) exclusivity rule never fires."
            - "PHX-T1 holds one INCLUDED account started 2024-01-15 (age 30) with service 20000 + chemical 10000 = claimed 30000, repair 0 - exactly on MRR_TIER_1_CENTS."
            - "PHX-T2 holds the same account one cent lower: service 20000 + chemical 9999 = claimed 29999."
            - "PHX-T3 holds one INCLUDED account started 2025-02-10 (age 17) with service 60000 + chemical 40000 = claimed 100000, repair 0 - exactly on MRR_TIER_2_CENTS but in the youngest age band."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /buyers"
              payload: {"legal_name": "Desert Blue Route Co", "state_code": "AZ", "license_status": "LICENSED", "prequalified_amount_cents": 30000000}
              as: Broker
              captures: {"buyer_id": "$.data.id"}
            - call: "POST /buyers/${buyer_id}/qualify"
              payload: {"decision": "APPROVE"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-T1", "state_code": "AZ", "asking_price_cents": 300000, "listed_mrr_cents": 30000, "listed_account_count": 1, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_t1": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_t1}", "customer_ref": "TIER-AT-30000", "service_start_date": "2024-01-15", "route_day": "MON", "monthly_service_fee_cents": 20000, "avg_monthly_chemical_cents": 10000, "avg_monthly_repair_cents": 0, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a_t1": "$.data.id"}
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-T2", "state_code": "AZ", "asking_price_cents": 299990, "listed_mrr_cents": 29999, "listed_account_count": 1, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_t2": "$.data.id"}
            - call: "POST /service-accounts"
              payload: {"listing_id": "${l_t2}", "customer_ref": "TIER-BELOW-30000", "service_start_date": "2024-01-15", "route_day": "MON", "monthly_service_fee_cents": 20000, "avg_monthly_chemical_cents": 9999, "avg_monthly_repair_cents": 0, "chemical_billing_method": "INCLUDED", "billing_frequency": "MONTHLY"}
              as: Broker
              captures: {"a_t2": "$.data.id"}
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "PHX-T3", "state_code": "AZ", "asking_price_cents": 1000000, "listed_mrr_cents": 100000, "listed_account_count": 1, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_t3": "$.data.id"}
