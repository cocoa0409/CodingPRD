            - "InspectionOrder.${re_id}.quoted_fee_cents == 17200"

      - name: reinspection_fee_low_band_discount_half
        grounds:
          - calculations.reinspection_fee
          - calculations.inspection_fee
          - state_machines.InspectionOrder.DELIVERED_to_SCHEDULED
        distinguishing_aspect: |
          Second mode-(c) instance over a different parent band: parent final_fee_cents
          35100 (< 50000) selects the base discount d=0.5; new order quoted (SELLER 2000
          no add-on = (15000+2000*12)*0.90 = 35100) -> reinspect_fee = round(35100*0.5) =
          17550. Proves the band selection on the parent total is what drives the discount.
        test_recipe:
          setup:
            - "Parent SELLER order over a 2000-sqft property (no add-on), measured 2000, one MAJOR + one CRITICAL defect, APPROVED (band MAJOR), paid 35100, DELIVERED (final 35100)."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { label: "fs", base_rate_cents: 15000, tier1_rate_cents_per_sqft: 12, tier2_rate_cents_per_sqft: 8, tier3_rate_cents_per_sqft: 5, addon_radon_cents: 9900, addon_termite_cents: 8500, addon_sewer_cents: 12000 }
              as: Scheduler
              captures: { fs_id: $.data.id }
            - call: "POST /fee-schedules/${fs_id}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /territories"
              payload: { name: "ter", zip_codes: ["33101"], travel_buffer_minutes: 30 }
              as: Scheduler
              captures: { ter_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ina", territory_id: "${ter_id}", certifications: ["SELLER"], daily_capacity_minutes: 480 }
              as: Scheduler
              captures: { insp_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cli", email: "cli@x.com", role_in_deal: "SELLER" }
              as: Scheduler
              captures: { cli_id: $.data.id }
            - call: "POST /agents"
              payload: { full_name: "Agt", email: "agt@x.com", brokerage: "BrkX" }
              as: Scheduler
              captures: { agt_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "1 A St", zip_code: "33101", square_footage: 2000, year_built: 1990 }
              as: Scheduler
              captures: { prop_id: $.data.id }
            - call: "POST /inspection-orders"
              payload: { property_id: "${prop_id}", client_id: "${cli_id}", agent_id: "${agt_id}", fee_schedule_id: "${fs_id}", inspection_type: "SELLER" }
              as: Scheduler
              captures: { ord_id: $.data.id }
            - call: "POST /inspection-orders/${ord_id}/schedule"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-07-20T13:00:00Z" }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/pay"
              payload: { amount_cents: 35100 }
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection-orders/${ord_id}/report"
              payload: { measured_square_footage: 2000 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Panel", severity: "MAJOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/defects"
              payload: { location: "Foundation", severity: "CRITICAL" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /reports/${rep_id}/approve"
              payload: {}
              as: Scheduler
            - call: "POST /inspection-orders/${ord_id}/deliver"
              payload: {}
              as: Scheduler
              captures: { parent_final: $.data.final_fee_cents, ord_v: $.data.version }
          trigger:
            - call: "POST /inspection-orders/${ord_id}/reinspect"
              payload: { inspector_id: "${insp_id}", scheduled_start: "2026-07-23T13:00:00Z", expected_order_version: "${ord_v}" }
              as: Scheduler
              captures: { re_id: $.data.id, re_quoted: $.data.quoted_fee_cents }
          assert:
            - "InspectionOrder.${ord_id}.final_fee_cents == 35100"
            - "InspectionOrder.${re_id}.quoted_fee_cents == 17550"
