scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: dual_variant_calc — two valid approaches, different results,
  # MUST operate on different entity domains.
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bill_provisional_vs_final_insurance_swap
        grounds:
          - calculations.bill_total_provisional
          - calculations.bill_total_final
          - state_machines.Bill.PARTIALLY_PAID_to_PAID
          - entities.Bill.fields.insurance_estimate_cents
          - entities.Bill.fields.insurance_actual_cents
        distinguishing_aspect: |
          Same line_items and deposit on the SAME Bill yield different totals because
          provisional uses insurance_estimate_cents while final uses insurance_actual_cents
          — the dual-variant operates on entity domain "Bill" (cost accounting).
        test_recipe:
          setup:
            - "Create Owner (verified), Pet, Visit, finalize one TreatmentRecord (CONSULT line 100.00) and one LabReport (LAB line 50.00) so gross_cents = 15000."
            - "Create Bill with package_code=null, insurance_estimate_cents=2000, deposit_applied_cents=0; recompute → provisional_total_cents = 13000."
            - "Issue Bill, then POST /_events/payment with amount_cents=13000 (after also setting insurance_actual_cents=5000 via the recompute path before payment posts)."
          trigger:
            - "POST /_events/payment {bill_id, amount_cents: 13000, event_id: 'evt_pay_1'}"
          assert:
            - "Bill.provisional_total_cents == 13000"
            - "Bill.final_total_cents == 10000"
            - "Bill.provisional_total_cents - Bill.final_total_cents == 3000"

      - name: vaccine_due_with_recall_vs_post_recall
        grounds:
          - calculations.vaccine_due_estimate
          - calculations.vaccine_due_estimate.variants
          - state_machines.Visit  # not used directly; entity domain is Pet
          - entities.VaccinationRecord.fields.status
          - endpoints  # GET /pets/{pet_id}/vaccines/due-list, POST /_events/vaccine-batch-recall
        distinguishing_aspect: |
          Same VaccinationRecord history rows yield different next-due dates depending on
          whether the latest record is ACTIVE (use last administered_at + 365) vs RECALLED
          (treat as never administered — fall back to birth_date + age_min_days). The
          dual-variant operates on entity domain "Pet" (immunization schedule), distinct from
          the Bill domain in instance 1.
        test_recipe:
            setup:
              - "Create VaccineSchedule (species=DOG, vaccine_code=RABIES_V1, age_min_days=84, booster_interval_days=365)."
              - "Create Owner (verified), Pet (species=DOG, birth_date=2025-01-01)."
              - "Set test clock to 2025-06-01."
              - "POST /pets/{id}/vaccinations (vaccine_code=RABIES_V1, administered_at=2025-04-01T00:00:00Z, batch_id=BATCH-A1)."
            trigger:
              - "GET /pets/{id}/vaccines/due-list  # variant 1: ACTIVE"
              - "POST /_events/vaccine-batch-recall {batch_id: 'BATCH-A1', vaccine_code: 'RABIES_V1', event_id: 'evt_recall_1'}"
              - "GET /pets/{id}/vaccines/due-list  # variant 2: post-recall"
            assert:
              - "First call: due_list[RABIES_V1].due_at == '2026-04-01'"
              - "Second call: due_list[RABIES_V1].due_at == '2025-03-26'  # birth_date + 84 days"
              - "First.due_at != Second.due_at (entity domain: Pet immunization, distinct from Bill)"

  # =========================================================================
  # Rule 2: combinatorial_formula — two instances in DIFFERENT modes.
  # We use mode (b) nested rounding and mode (c) circular evaluation order.
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bill_per_line_then_sum_round_order
        grounds:
          - calculations.bill_total_provisional
          - calculations.bill_total_provisional.formula
          - entities.Bill.fields.line_items
        distinguishing_aspect: |
          Mode (b): Round-per-line-then-sum vs sum-then-round produce different cents.
          The scaffold pins phase ordering: line_total_cents are computed (qty * unit_price)
          per line FIRST, then summed; the package-discount tier % is applied to gross_cents
          and rounded once via round_half_up — never twice. Three line items with prices
          that would create different cents under sum-then-round-percentage drive the
          assertion.
        test_recipe:
          setup:
            - "Create Visit with three finalized clinical artifacts so line_items = "
            - "  [(CONSULT, qty=1, unit_price_cents=12345),"
            - "   (LAB,     qty=1, unit_price_cents=6789),"
            - "   (DRUG,    qty=3, unit_price_cents=1111)]"
            - "Per-line totals: 12345, 6789, 3*1111=3333 → gross_cents = 22467."
            - "Set package_code='DENTAL_PKG' (tier 5% — gross < 200_00)."
            - "pkg_discount = round_half_up(22467 * 5 / 100) = round_half_up(1123.35) = 1123."
            - "gross_after_discount = 22467 - 1123 = 21344."
            - "deposit_applied=0, insurance_estimate=0 → provisional_total_cents = 21344."
          trigger:
            - "POST /bills/{bill_id}/recompute"
          assert:
            - "Bill.line_items[0].line_total_cents == 12345"
            - "Bill.line_items[1].line_total_cents == 6789"
            - "Bill.line_items[2].line_total_cents == 3333"
            - "Bill.provisional_total_cents == 21344"

      - name: bill_circular_tier_keyed_on_gross_pre_discount
        grounds:
          - calculations.bill_circular_pkg_tier
          - calculations.bill_total_provisional
          - entities.Bill.fields.package_code
        distinguishing_aspect: |
          Mode (c): Circular-looking dependency between gross_cents → tier % → discount → final.
          Tier MUST be selected on gross_cents (pre-discount). Re-keying on post-discount
          would, at this exact boundary, drop the bill into a lower tier (10%) and produce
          a different total — the scaffold pins the single-pass evaluation order so the
          result is well-defined.
        test_recipe:
          setup:
            - "Create Visit with one finalized CONSULT line: qty=1, unit_price_cents=50000."
            - "gross_cents = 50000 (exactly at DENTAL_PKG 15% boundary, since >= 500_00)."
            - "Set package_code='DENTAL_PKG'."
            - "Pinned: pkg_tier_pct = 15 (keyed on gross_cents=50000)."
            - "pkg_discount = round_half_up(50000 * 15 / 100) = 7500."
            - "gross_after_discount = 42500. (If re-keyed on 42500 < 50000 → tier 10%, discount = 4250 → forbidden.)"
            - "deposit=0, insurance=0 → provisional_total_cents = 42500."
          trigger:
            - "POST /bills/{bill_id}/recompute"
          assert:
            - "Bill.provisional_total_cents == 42500"
            - "Bill.line_items[0].line_total_cents == 50000"
            - "Bill.provisional_total_cents != 45750  # the value the forbidden re-keyed path would produce"

  # =========================================================================
  # Rule 3: non_linear_state_machine — different entities.
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: prescription_revision_cycle
        grounds:
          - state_machines.Prescription.DRAFT_to_PENDING_REVIEW
          - state_machines.Prescription.PENDING_REVIEW_to_REJECTED
          - state_machines.Prescription.REJECTED_to_DRAFT
          - state_machines.Prescription.PENDING_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Cyclic shape on entity Prescription: DRAFT → PENDING_REVIEW → REJECTED → DRAFT
          can repeat, distinguishing it from a linear pipeline.
        test_recipe:
          setup:
            - "Create Owner (verified), Pet, Visit (IN_CONSULT), Drug D1 (controlled=false)."
            - "Create Prescription with one D1 item (DRAFT)."
          trigger:
            - "POST /prescriptions/{id}/submit  # → PENDING_REVIEW"
            - "POST /prescriptions/{id}/reject  # → REJECTED"
            - "POST /prescriptions/{id}/redraft # → DRAFT"
            - "POST /prescriptions/{id}/submit  # → PENDING_REVIEW (second cycle)"
            - "POST /prescriptions/{id}/approve # → APPROVED"
          assert:
            - "Prescription.status == 'APPROVED' after the sequence"
            - "Prescription.version increased monotonically by ≥ 5 across the five mutations"

      - name: bill_refund_branch_off_paid
        grounds:
          - state_machines.Bill.PAID_to_REFUND_PENDING
          - state_machines.Bill.PAID_to_INVOICED
          - state_machines.Bill.REFUND_PENDING_to_REFUNDED
          - state_machines.Bill.INVOICED_to_REFUND_PENDING
        distinguishing_aspect: |
          Branching shape on entity Bill: PAID forks into either INVOICED (happy path) or
          REFUND_PENDING (refund branch), with INVOICED also re-entering REFUND_PENDING.
          Different entity from Prescription in instance 1.
        test_recipe:
          setup:
            - "Create Visit with one CONSULT line (10000 cents); insurance_estimate=0."
            - "Issue Bill, post payment 10000 → Bill.status=PAID."
          trigger:
            - "POST /bills/{id}/refund {amount_cents: 4000, reason: 'partial'}  # → REFUND_PENDING"
            - "POST /_events/refund-confirm {bill_id, amount_cents: 4000, event_id: 'evt_r1'}  # → REFUNDED"
          assert:
            - "Bill.status == 'REFUNDED'"
            - "Bill.refund_amount_cents == 4000"
            - "Bill.paid_amount_cents == 10000  # paid stays the same; refund tracked separately"

  # =========================================================================
  # Rule 4: transitive_cascade — two cascades, depths ≥3 and ≥2 respectively,
  # from DIFFERENT triggering transitions.
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispense_cascades_to_bill_and_audit_depth_3
        grounds:
          - state_machines.Prescription.APPROVED_to_DISPENSED
          - state_machines.Bill.ISSUED_to_DRAFT
          - calculations.bill_total_provisional
          - entities.AuditLog
        distinguishing_aspect: |
          Cascade depth 3 originating from DISPENSE: A=Prescription dispense mutates B=Drug.stock_units;
          B's mutation appends a DRUG line item to C=Bill, which itself reverts Bill.status ISSUED→DRAFT
          and triggers D=AuditLog append. Each link is caused by the prior link, not directly by the
          original dispense. Trigger: POST /prescriptions/{id}/dispense.
        test_recipe:
          setup:
            - "Create Drug D1 with stock_units=100, dosage 1–10 mg/kg, controlled=false, unit_price assumed via line."
            - "Create Visit (CONSULT_DONE), Bill issued (status=ISSUED, no DRUG line yet)."
            - "Create Prescription with one item {drug=D1, dose=2 mg/kg, freq=2, dur=5, units=20}, approve."
          trigger:
            - "POST /prescriptions/{id}/dispense"
          assert:
            - "Drug.stock_units == 80  # hop 1: 100 - 20"
            - "Bill.line_items[*].kind contains 'DRUG'  # hop 2: line appended"
            - "Bill.status == 'DRAFT'  # hop 3: ISSUED reverted to DRAFT by cascade"
            - "AuditLog with subject_type='PRESCRIPTION', action='DISPENSE' exists  # cascade-completion audit"

      - name: vaccine_recall_cascades_to_due_list_and_im_depth_3
        grounds:
          - endpoints  # POST /_events/vaccine-batch-recall, POST /_events/im-emit
          - calculations.vaccine_due_estimate.variants
          - entities.VaccinationRecord.fields.status
        distinguishing_aspect: |
          Cascade depth 3 originating from a DIFFERENT trigger (vaccine batch recall, not dispense):
          A=recall event flips matching VaccinationRecord.status ACTIVE→RECALLED; that mutation on
          VaccinationRecord forces recomputation of next_due_at (Pet-level derived field via post_recall
          variant); the recomputed overdue list itself triggers IM emission via /_events/im-emit. Different
          triggering transition than instance 1, so a different propagation pattern is exercised.
        test_recipe:
          setup:
            - "Create VaccineSchedule (DOG, RABIES_V1, age_min_days=84, booster_interval_days=365)."
            - "Create Owner (verified), Pet (DOG, birth_date=2025-01-01); set clock to 2025-07-01."
            - "POST /pets/{id}/vaccinations (vaccine_code=RABIES_V1, administered_at=2025-04-01, batch_id=BATCH-A1)."
          trigger:
            - "POST /_events/vaccine-batch-recall {batch_id: 'BATCH-A1', vaccine_code: 'RABIES_V1', event_id: 'evt_recall_2'}"
          assert:
            - "VaccinationRecord.status == 'RECALLED'  # hop 1"
            - "GET /pets/{id}/vaccines/due-list returns RABIES_V1 with due_at == '2025-03-26' (overdue)  # hop 2"
            - "An /_events/im-emit was recorded for the owner with kind='VACCINE_RECALL'  # hop 3"

  # =========================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs.
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_close_visit
        grounds:
          - validations[priority=10]   # state — ERR_INVALID_STATE
          - validations[priority=31]   # business_referential — ERR_PENDING_PRESCRIPTIONS
          - state_machines.Visit.CONSULT_DONE_to_CLOSED
        distinguishing_aspect: |
          Conflict pair: 'state' vs 'business_referential'. Closing a visit while it has a
          PENDING_REVIEW prescription AND its Bill is still DRAFT triggers BOTH a state
          violation (Bill not in {INVOICED, REFUNDED}) AND a referential violation
          (open prescriptions). The scaffold's priority order picks ERR_INVALID_STATE
          (priority 10) over ERR_PENDING_PRESCRIPTIONS (priority 31).
        test_recipe:
          setup:
            - "Visit in CONSULT_DONE; one Prescription PENDING_REVIEW; Bill in DRAFT (not yet issued)."
          trigger:
            - "POST /visits/{visit_id}/close as Cashier"
          assert:
            - "Response status_code == 409"
            - "Response data.error_id == 'ERR_INVALID_STATE'  # priority 10 wins over priority 31"

      - name: business_safety_vs_business_fiscal_segregation_overrides_deposit
        grounds:
          - validations[priority=22]   # business_safety — ERR_SEGREGATION_OF_DUTIES
          - validations[priority=50]   # business_fiscal — ERR_INSUFFICIENT_DEPOSIT
        distinguishing_aspect: |
          Conflict pair: 'business_safety' vs 'business_fiscal' — DIFFERENT pair from
          instance 1 (which was state vs business_referential). When approving a controlled-
          drug prescription where reviewer == drafter AND the owner has insufficient deposit
          for the same visit's hospitalization, only the approve endpoint runs — the
          segregation check is selected because business_safety (priority 22) precedes
          business_fiscal (priority 50). The fiscal check would only surface on the next
          hospitalization endpoint.
        test_recipe:
          setup:
            - "Drug D1 controlled=true; Owner.deposit_balance_cents=0."
            - "Prescription PENDING_REVIEW; drafted by vet_X."
          trigger:
            - "POST /prescriptions/{id}/approve as ReviewingVet with X-User-ID = vet_X (same as drafter)"
          assert:
            - "Response status_code == 403"
            - "Response data.error_id == 'ERR_SEGREGATION_OF_DUTIES'  # priority 22 wins"

  # =========================================================================
  # Rule 6: boundary_precision_check — different metrics, different endpoints.
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: triage_severity_emergency_threshold_inclusive
        grounds:
          - calculations.triage_priority_score
          - entities.Visit.fields.triage_priority
          - validations  # endpoint POST /visits/{id}/triage
        distinguishing_aspect: |
          Numeric metric: severity → triage_priority bucket boundary at 8.0 inclusive.
          severity=8 with DOG (factor 1.0), age_factor=1.0 → score=8.0 → EMERGENCY.
          severity=7 → 7.0 → URGENT (just below). Endpoint POST /visits/{id}/triage.
        test_recipe:
          setup:
            - "Owner verified; Pet (species=DOG, birth_date such that age=200 days → not pediatric, not geriatric)."
            - "Visit A registered with severity_score=7; Visit B registered with severity_score=8."
          trigger:
            - "POST /visits/{visit_A_id}/triage"
            - "POST /visits/{visit_B_id}/triage"
          assert:
            - "Visit A.triage_priority == 'URGENT'  # score 7.0 < 8.0"
            - "Visit B.triage_priority == 'EMERGENCY'  # score 8.0 >= 8.0 (inclusive)"

      - name: lab_value_at_reference_high_is_normal
        grounds:
          - calculations.lab_abnormal_flag
          - entities.LabReport.fields.abnormal_codes
          - state_machines.LabReport.SENT_TO_LAB_to_RESULT_RECEIVED
        distinguishing_aspect: |
          Different metric and different endpoint: empty/full inclusion at a numeric range
          boundary. Lab value EXACTLY at ref_high is NORMAL (exclusive boundary), value
          slightly above is ABNORMAL. Endpoint POST /_events/external-lab-result. Different
          metric than the triage threshold in instance 1.
        test_recipe:
          setup:
            - "Visit IN_CONSULT; LabReport with test_items=[{code:'GLU', name:'Glucose', ref_low:5.0, ref_high:10.0}]."
            - "Collect sample, send to lab (external_lab_ref='LAB-X1')."
          trigger:
            - "POST /_events/external-lab-result {external_lab_ref:'LAB-X1', results:[{code:'GLU', value:10.0}], event_id:'evt_lab_1'}"
          assert:
            - "LabReport.abnormal_codes == []  # 10.0 is NOT > 10.0 — exclusive boundary"
            - "Re-running with value 10.0001 (new LabReport) yields abnormal_codes == ['GLU']"

  # =========================================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs.
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: visit_close_depends_on_bill_state
        grounds:
          - state_machines.Visit.CONSULT_DONE_to_CLOSED
          - state_machines.Bill.PAID_to_INVOICED
          - validations[priority=31]
        distinguishing_aspect: |
          Entity pair: Visit ↔ Bill. Visit cannot transition CONSULT_DONE→CLOSED unless
          Bill.status ∈ {INVOICED, REFUNDED}. Different pair from instance 2.
        test_recipe:
          setup:
            - "Visit CONSULT_DONE; one finalized TreatmentRecord; Bill PAID (not yet invoiced); no open prescriptions."
          trigger:
            - "POST /visits/{visit_id}/close (first attempt)"
            - "POST /bills/{bill_id}/issue-invoice"
            - "POST /visits/{visit_id}/close (second attempt)"
          assert:
            - "First attempt → 409 ERR_INVALID_STATE (Bill not yet INVOICED)"
            - "After invoice issued, second attempt → 200; Visit.status == 'CLOSED'"

      - name: hospitalization_discharge_depends_on_prescription_state
        grounds:
          - state_machines.Hospitalization.IN_CARE_to_DISCHARGE_PENDING
          - state_machines.Prescription.APPROVED_to_DISPENSED
          - validations[priority=32]
        distinguishing_aspect: |
          Entity pair: Hospitalization ↔ Prescription — DIFFERENT pair from instance 1.
          Hospitalization cannot leave IN_CARE while any Prescription on the same visit
          is in DRAFT/PENDING_REVIEW/APPROVED.
        test_recipe:
          setup:
            - "Hospitalization IN_CARE; one Prescription on the Visit in APPROVED (not yet DISPENSED)."
          trigger:
            - "POST /hospitalizations/{h_id}/request-discharge (first attempt)"
            - "POST /prescriptions/{rx_id}/dispense"
            - "POST /hospitalizations/{h_id}/request-discharge (second attempt)"
          assert:
            - "First attempt → 409 ERR_PENDING_PRESCRIPTIONS"
            - "After dispense, second attempt → 200; Hospitalization.status == 'DISCHARGE_PENDING'"

  # =========================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics, different resources.
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cage_aggregate_capacity_overlap_half_open
        grounds:
          - validations[priority=43]
          - entities.Cage.fields.capacity
          - entities.Cage.fields.occupancy_count
          - state_machines.Hospitalization.ADMITTED_to_IN_CARE
          - state_machines.Hospitalization.DISCHARGE_PENDING_to_DISCHARGED
        distinguishing_aspect: |
          Interval semantics on Cage: half-open [admitted_at, discharged_at) with AGGREGATE
          capacity ≥ count of overlapping intervals. Adjacent intervals (B.admitted_at ==
          A.discharged_at) are NOT overlapping. Resource: Cage.
        test_recipe:
          setup:
            - "Cage C1 capacity=1, occupancy_count=0."
            - "Hospitalization H1 admitted at t0, discharged at t1; H1 transitions to DISCHARGED."
            - "Hospitalization H2 admission attempt at t1 (exactly the discharge moment)."
          trigger:
            - "POST /hospitalizations {visit_id: V2, cage_id: C1}"
          assert:
            - "Adjacent admission at t1 succeeds (status 201) because [t0,t1) and [t1,_) do NOT overlap"
            - "Cage.occupancy_count == 1 after H2 admission"

      - name: vaccine_cooldown_open_lower_closed_upper_window
        grounds:
          - validations[priority=44]
          - calculations.vaccine_due_estimate
          - entities.VaccinationRecord
        distinguishing_aspect: |
          Different interval semantics from instance 1: PER-PET cooldown window
          [prior.administered_at, prior.administered_at + booster_interval_days/2) is the
          FORBIDDEN zone; the earliest valid re-vaccination is at prior + booster_interval/2
          (closed lower end of the allowed range). Aggregate capacity is irrelevant; this is
          a single-resource cooldown, NOT capacity arithmetic. Resource: VaccinationRecord
          (per Pet) — different from Cage.
        test_recipe:
          setup:
            - "VaccineSchedule (DOG, RABIES_V1, age_min_days=0, booster_interval_days=180) — cooldown window = 90 days."
            - "Pet (DOG); POST vaccination administered_at=2025-01-01 (BATCH-A2)."
          trigger:
            - "POST /pets/{id}/vaccinations administered_at=2025-03-31 (89 days later)"
            - "POST /pets/{id}/vaccinations administered_at=2025-04-01 (90 days later — boundary)"
          assert:
            - "First attempt → 422 ERR_VACCINE_COOLDOWN (89 < 90 — inside forbidden zone)"
            - "Second attempt → 201 (90 == 90 — closed lower bound of allowed range)"

  # =========================================================================
  # Rule 9: compensating_invariant — different conserved quantities.
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_conserves_money_balance
        grounds:
          - state_machines.Bill.PAID_to_REFUND_PENDING
          - state_machines.Bill.REFUND_PENDING_to_REFUNDED
          - entities.Owner.fields.deposit_balance_cents
          - entities.Bill.fields.paid_amount_cents
          - entities.Bill.fields.refund_amount_cents
        distinguishing_aspect: |
          Conserved quantity (money): for any single Bill,
          Owner.deposit_balance_cents (after refund) - Owner.deposit_balance_cents (before payment)
          + Bill.paid_amount_cents - Bill.refund_amount_cents
          MUST equal Bill.line_items.sum(line_total_cents) - pkg_discount_cents - insurance_actual_cents
          (i.e., the net economic value the hospital captured). Compensating action (refund) returns
          the system to consistent money balance.
        test_recipe:
          setup:
            - "Owner deposit=20000, then top up another 0 (deposit_balance=20000)."
            - "Visit with one CONSULT line of 10000 cents; Bill issued; paid 10000 fully (deposit_applied=0 because issue happened with deposit_applied set to min)."
            - "Actually for clean invariant: insurance_estimate=0, insurance_actual=0, package_code=null."
            - "After payment: Owner.deposit_balance_cents = 20000 (unchanged); Bill.paid_amount_cents = 10000; net captured = 10000."
          trigger:
            - "POST /bills/{id}/refund {amount_cents: 10000, reason: 'goodwill'}"
            - "POST /_events/refund-confirm {bill_id, amount_cents: 10000, event_id: 'evt_r2'}"
          assert:
            - "Bill.paid_amount_cents == 10000  # paid stays"
            - "Bill.refund_amount_cents == 10000"
            - "Bill.paid_amount_cents - Bill.refund_amount_cents == 0  # net money captured by hospital = 0"
            - "Owner.deposit_balance_cents == 20000  # deposit untouched"

      - name: hospitalization_cancel_conserves_cage_capacity
        grounds:
          - state_machines.Hospitalization.ADMITTED_to_CANCELLED
          - entities.Cage.fields.occupancy_count
          - entities.Cage.fields.capacity
          - entities.Owner.fields.deposit_balance_cents
        distinguishing_aspect: |
          Conserved quantity (resource capacity, NOT money — different conservation domain
          from instance 1): for any Cage, occupancy_count BEFORE admission == occupancy_count
          AFTER admission-then-cancel. The compensating action (cancel) restores cage capacity
          and the admission deposit hold simultaneously, leaving both invariants intact.
        test_recipe:
          setup:
            - "Cage C1 capacity=2, occupancy_count=1."
            - "Owner.deposit_balance_cents = 50000."
          trigger:
            - "POST /hospitalizations {visit_id: V_cd, cage_id: C1}  # admit"
            - "POST /hospitalizations/{h_id}/cancel  # before any treatment_executed=true"
          assert:
            - "After admission: Cage.occupancy_count == 2 AND Owner.deposit_balance_cents == 0"
            - "After cancel: Cage.occupancy_count == 1 (= original) AND Owner.deposit_balance_cents == 50000 (= original)"
            - "Both conserved quantities (cage_capacity_remaining = capacity - occupancy_count, and deposit_balance_cents) returned to pre-admission values"
