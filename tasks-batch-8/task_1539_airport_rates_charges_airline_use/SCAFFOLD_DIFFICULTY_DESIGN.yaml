              payload: { year_label: "FY_CAS", methodology: "RESIDUAL", airfield_opex_cents: 1000000, terminal_opex_cents: 0, nonairline_airfield_revenue_cents: 0, nonairline_terminal_revenue_cents: 0, terminal_total_space_sqft: 100000, forecast_landed_weight_kg: 1000, prior_year_surplus_cents: 0 }
