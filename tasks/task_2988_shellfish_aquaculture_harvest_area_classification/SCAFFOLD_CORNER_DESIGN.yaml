            - "GET /shellfish/growing-areas/${area} reports classification == APPROVED, harvest_status == OPEN, accepted_sample_count == 4 and eligible_classification == INSUFFICIENT_DATA"

      - name: conditionally_approved_without_a_management_plan_on_file_is_refused
        claim_type: violation_to_error
