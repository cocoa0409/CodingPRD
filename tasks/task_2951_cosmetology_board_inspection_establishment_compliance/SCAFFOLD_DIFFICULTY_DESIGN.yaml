# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids x >= 2 instances = 19 instances. Every numeric assert below was produced by
# executing the corresponding calculations[].formula against its constants[].

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: inspection_score_provisional_vs_final_on_site_credit
        grounds:
          - calculations.inspection_adjusted_score
          - entities.Inspection.fields.provisional_adjusted_score
          - entities.Inspection.fields.final_adjusted_score
          - entities.ViolationFinding.fields.provisional_points
          - entities.ViolationFinding.fields.final_points
          - state_machines.Inspection.IN_PROGRESS_to_PENDING_REVIEW
          - state_machines.Inspection.PENDING_REVIEW_to_FINALIZED
        distinguishing_aspect: |
          The PROVISIONAL variant grants a 0.50 on-site-correction credit and the FINAL variant only
          0.25, so the identical two findings score 8.00 at submit and 12.00 at finalize, which also
          flips the outcome band from PASS to CONDITIONAL_PASS on the same Inspection row.
        test_recipe:
          setup:
            - "Two MINOR violation codes are published: SAN-100 (base_points 5.0) and REC-110 (base_points 2.0)."
            - "One establishment 'Glow Salon' exists with license_status PENDING_INSPECTION and demerit_balance 0.00."
            - "One ROUTINE inspection on it is IN_PROGRESS with exactly two findings, both corrected_on_site: SAN-100 observed 2x and REC-110 observed 3x."
            - "Neither violation code has ever appeared on a prior FINALIZED inspection of this establishment, so every repeat_factor is 1.0."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "SAN-100", category: "SANITATION", severity: "MINOR", base_points: 5.0, fine_cents_base: 4000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_minor_id: $.data.id }
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "REC-110", category: "RECORDKEEPING", severity: "MINOR", base_points: 2.0, fine_cents_base: 3000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_rec_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Glow Salon", establishment_type: "SALON", county_code: "NCA", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T17:00:00Z", inspector_user_id: "insp-001" }
              as: Inspector
              as_user_id: "insp-001"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-001"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_minor_id}", observed_count: 2, corrected_on_site: true, note: "two unwashed combs at open stations" }
              as: Inspector
              as_user_id: "insp-001"
              captures: { f1_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_rec_id}", observed_count: 3, corrected_on_site: true, note: "three missing service log pages" }
              as: Inspector
              as_user_id: "insp-001"
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-001"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "Inspection.${insp_id}.provisional_adjusted_score == 8.00"
            - "Inspection.${insp_id}.provisional_outcome == PASS"
            - "Inspection.${insp_id}.final_adjusted_score == 12.00"
            - "Inspection.${insp_id}.final_outcome == CONDITIONAL_PASS"
            - "ViolationFinding.${f1_id}.provisional_points == 5.00"
            - "ViolationFinding.${f1_id}.final_points == 7.50"
            - "ViolationFinding.${f2_id}.provisional_points == 3.00"
            - "ViolationFinding.${f2_id}.final_points == 4.50"
            - "ViolationFinding.${f1_id}.repeat_factor_provisional == 1.0 and ViolationFinding.${f1_id}.repeat_factor_final == 1.0"
            - "Establishment.${est_id}.demerit_balance == 12.00"
            - "Establishment.${est_id}.compliance_posture == CLEAR"
            - "Establishment.${est_id}.license_status == PENDING_INSPECTION"

      - name: apprentice_hour_credit_track_vs_school_equivalence_track
        grounds:
          - calculations.practitioner_credited_hours
          - entities.Practitioner.fields.credited_hours_apprentice
          - entities.Practitioner.fields.credited_hours_total
          - entities.Practitioner.fields.exam_eligible
          - entities.TrainingRecord.fields.credit_type
          - entities.School.fields.required_clock_hours
        distinguishing_aspect: |
          This dual variant lives on the Practitioner/TrainingRecord domain rather than the
          Inspection/ViolationFinding domain of the other instance: byte-identical APPRENTICE_HOUR
          record sets (five 9.0-hour days inside ISO week 2026-W32) credit 24.00 hours under
          APPRENTICE_TRACK (weekly 40.0 cap then x0.60) and 40.00 hours under
          SCHOOL_EQUIVALENCE_TRACK (daily 8.0 cap then x1.00), flipping exam_eligible.
        test_recipe:
          setup:
            - "One school 'Northside Academy' with required_clock_hours 30.0, accreditation_status ACCREDITED and apprenticeship_program_approved true."
            - "One ACTIVE COSMETOLOGIST sponsor 'Rita Vance' credited with 32.00 school clock hours (four 8.0-hour days covering SANITATION, DISINFECTION, THEORY and PRACTICAL)."
            - "Two candidates at the same school with zero school hours: 'Ana Ruiz' (license_type APPRENTICE) and 'Ben Cole' (license_type COSMETOLOGIST)."
            - "Each candidate already has four APPRENTICE_HOUR records of 9.0 hours on 2026-08-03 through 2026-08-06, all sponsored by Rita Vance."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Northside Academy", county_code: "NCA", required_clock_hours: 30.0, accreditation_status: "ACCREDITED", apprenticeship_program_approved: true }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Rita Vance", license_type: "COSMETOLOGIST", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { sponsor_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${sponsor_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-01", discipline: "SANITATION", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "${school_id}"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${sponsor_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-02", discipline: "DISINFECTION", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "${school_id}"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${sponsor_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-03", discipline: "THEORY", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "${school_id}"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${sponsor_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-04", discipline: "PRACTICAL", school_id: "${school_id}" }
              as: SchoolRegistrar
              as_user_id: "${school_id}"
            - call: "POST /cosmetology/practitioners/${sponsor_id}/license-actions"
              payload: { action: "GRANT_EXAM_ELIGIBILITY" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${sponsor_id}/license-actions"
              payload: { action: "ISSUE_LICENSE", effective_at: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Ana Ruiz", license_type: "APPRENTICE", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { p_appr_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Ben Cole", license_type: "COSMETOLOGIST", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { p_cos_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_appr_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-03", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_appr_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-04", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_appr_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-05", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_appr_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-06", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_cos_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-03", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_cos_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-04", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_cos_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-05", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_cos_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-06", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_appr_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-07", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${p_cos_id}", credit_type: "APPRENTICE_HOUR", hours: 9.0, performed_on: "2026-08-07", discipline: "PRACTICAL", sponsor_practitioner_id: "${sponsor_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "Practitioner.${p_appr_id}.credited_hours_apprentice == 24.00"
            - "Practitioner.${p_appr_id}.credited_hours_school == 0.00"
            - "Practitioner.${p_appr_id}.credited_hours_total == 24.00"
            - "Practitioner.${p_appr_id}.required_clock_hours_effective == 30.00"
            - "Practitioner.${p_appr_id}.exam_eligible == false"
            - "Practitioner.${p_cos_id}.credited_hours_apprentice == 40.00"
            - "Practitioner.${p_cos_id}.credited_hours_school == 0.00"
            - "Practitioner.${p_cos_id}.credited_hours_total == 40.00"
            - "Practitioner.${p_cos_id}.required_clock_hours_effective == 30.00"
            - "Practitioner.${p_cos_id}.exam_eligible == true"
            - "Practitioner.${sponsor_id}.credited_hours_school == 32.00 and Practitioner.${sponsor_id}.license_status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: citation_fine_tier_subject_factor_and_excess_point_surcharge
        grounds:
          - calculations.citation_fine_amount
          - entities.Citation.fields.demerit_tier_multiplier
          - entities.Citation.fields.assessed_fine_cents
          - entities.Inspection.fields.demerit_balance_before_finalize
          - entities.ViolationCode.fields.fine_cents_base
          - concurrency_rules[citation-create-stale-inspection]
        distinguishing_aspect: |
          Mode (a): assessed_fine_cents combines four independent inputs non-linearly - the summed
          fine_cents_base of the findings, a tiered demerit multiplier selected from the pinned
          pre-cascade snapshot, a subject factor, and an additive per-excess-point surcharge - and
          then passes the result through a nested min/max clamp, yielding exactly 52000 cents.
        test_recipe:
          setup:
            - "Two violation codes are published: FSP-300 (CRITICAL, base_points 4.0, fine_cents_base 30000) and IMP-200 (MAJOR, base_points 6.0, fine_cents_base 12000)."
            - "One establishment 'Glow Salon' exists with demerit_balance 0.00, so the tier snapshot taken at finalize is 0.00 and demerit_tier_multiplier resolves to 1.00."
            - "One ROUTINE inspection is FINALIZED with two findings, neither corrected on site: FSP-300 observed 2x (40.00 points) and IMP-200 observed 1x (15.00 points), giving final_adjusted_score 55.00 and final_outcome FAIL."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z, so issued_at is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "FSP-300", category: "FOOT_SPA", severity: "CRITICAL", base_points: 4.0, fine_cents_base: 30000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_crit_id: $.data.id }
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "IMP-200", category: "IMPLEMENT_HANDLING", severity: "MAJOR", base_points: 6.0, fine_cents_base: 12000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_major_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Glow Salon", establishment_type: "SALON", county_code: "NCA", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T17:00:00Z", inspector_user_id: "insp-001" }
              as: Inspector
              as_user_id: "insp-001"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-001"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_crit_id}", observed_count: 2, corrected_on_site: false, note: "two foot spas with no screen cleaning record" }
              as: Inspector
              as_user_id: "insp-001"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_major_id}", observed_count: 1, corrected_on_site: false, note: "shears stored wet" }
              as: Inspector
              as_user_id: "insp-001"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-001"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { insp_v: $.data.version }
          trigger:
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { cit_id: $.data.id }
          assert:
            - "Inspection.${insp_id}.final_adjusted_score == 55.00"
            - "Inspection.${insp_id}.final_outcome == FAIL"
            - "Inspection.${insp_id}.demerit_balance_before_finalize == 0.00"
            - "Citation.${cit_id}.demerit_tier_multiplier == 1.00"
            - "Citation.${cit_id}.max_finding_severity == CRITICAL"
            - "Citation.${cit_id}.assessed_fine_cents == 52000"
            - "Citation.${cit_id}.administrative_fee_cents == 4160"
            - "Citation.${cit_id}.total_due_cents == 56160"
            - "Citation.${cit_id}.outstanding_fine_cents == 56160"
            - "Citation.${cit_id}.status == ISSUED"
            - "Citation.${cit_id}.issued_at == 2026-08-01T00:00:00.000Z"
            - "Citation.${cit_id}.due_at == 2026-08-31T00:00:00.000Z"
            - "Citation.${cit_id}.contest_deadline_at == 2026-08-21T00:00:00.000Z"
            - "Establishment.${est_id}.demerit_balance == 55.00"
            - "Establishment.${est_id}.outstanding_fine_total_cents == 56160"
            - "Establishment.${est_id}.open_critical_citation_count == 1"
            - "Establishment.${est_id}.compliance_posture == RESTRICTED"

      - name: inspection_score_rounds_per_finding_before_summing
        grounds:
          - calculations.inspection_adjusted_score
          - entities.ViolationFinding.fields.provisional_points
          - entities.ViolationFinding.fields.final_points
          - entities.ViolationCode.fields.base_points
        distinguishing_aspect: |
          Mode (b): three identical SAN-115 findings each yield the unrounded product 0.525
          (provisional) and 0.7875 (final); the scaffold pins round-per-finding-then-sum, so the
          scores are 1.59 and 2.37, whereas the sum-then-round order would produce 1.58 and 2.36 -
          a one-cent divergence that only the pinned order reproduces.
        test_recipe:
          setup:
            - "One MINOR violation code SAN-115 is published with base_points 1.05 (SEVERITY_WEIGHT[MINOR] is 1.0)."
            - "One establishment 'Tidy Cuts' exists with license_status PENDING_INSPECTION and demerit_balance 0.00."
            - "One ROUTINE inspection on it is IN_PROGRESS with exactly three SAN-115 findings, each observed_count 1 and corrected_on_site true, so every finding's raw product is 1.05 * 1.0 * 1 * 1.0 * 0.50 = 0.525 provisionally and 1.05 * 1.0 * 1 * 1.0 * 0.75 = 0.7875 finally."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "SAN-115", category: "SANITATION", severity: "MINOR", base_points: 1.05, fine_cents_base: 2500 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_odd_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Tidy Cuts", establishment_type: "BARBERSHOP", county_code: "NCB", station_capacity: 3 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-04T09:00:00Z", window_end_at: "2026-08-04T12:00:00Z", inspector_user_id: "insp-002" }
              as: Inspector
              as_user_id: "insp-002"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-002"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_odd_id}", observed_count: 1, corrected_on_site: true, note: "station 1 towel bin" }
              as: Inspector
              as_user_id: "insp-002"
              captures: { g1_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_odd_id}", observed_count: 1, corrected_on_site: true, note: "station 2 towel bin" }
              as: Inspector
              as_user_id: "insp-002"
              captures: { g2_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_odd_id}", observed_count: 1, corrected_on_site: true, note: "station 3 towel bin" }
              as: Inspector
              as_user_id: "insp-002"
              captures: { g3_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-002"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "ViolationFinding.${g1_id}.provisional_points == 0.53"
            - "ViolationFinding.${g2_id}.provisional_points == 0.53"
            - "ViolationFinding.${g3_id}.provisional_points == 0.53"
            - "Inspection.${insp_id}.provisional_adjusted_score == 1.59"
            - "Inspection.${insp_id}.provisional_adjusted_score != 1.58"
            - "ViolationFinding.${g1_id}.final_points == 0.79"
            - "ViolationFinding.${g2_id}.final_points == 0.79"
            - "ViolationFinding.${g3_id}.final_points == 0.79"
            - "Inspection.${insp_id}.final_adjusted_score == 2.37"
            - "Inspection.${insp_id}.final_adjusted_score != 2.36"
            - "Inspection.${insp_id}.final_outcome == PASS"
            - "Establishment.${est_id}.demerit_balance == 2.37"
            - "Establishment.${est_id}.license_status == ACTIVE"
            - "Establishment.${est_id}.compliance_posture == CLEAR"

  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_hazard_dimension_advances_independently_of_status
        grounds:
          - state_machines.Inspection.NONE_to_HAZARD_DECLARED
          - state_machines.Inspection.IN_PROGRESS_to_PENDING_REVIEW
          - state_machines.Inspection.PENDING_REVIEW_to_FINALIZED
          - entities.Inspection.fields.hazard_state
          - entities.Inspection.fields.status
          - entities.ViolationFinding.fields.declared_hazard
          - validations[priority=59]
        distinguishing_aspect: |
          Inspection carries two independent state dimensions on one row: declaring an imminent
          hazard moves hazard_state NONE -> HAZARD_DECLARED while status stays IN_PROGRESS, and the
          subsequent status walk to PENDING_REVIEW and FINALIZED leaves hazard_state untouched while
          hazard_state overrides the score band to IMMEDIATE_CLOSURE in both score variants.
        test_recipe:
