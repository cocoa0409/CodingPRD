              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_fld: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_fld}", warehouse_id: "${wh_tx}", manufactured_on: "2026-06-01", quantity_on_hand: 40 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-10" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_fld}", quantity: 12, core_expected_count: 0 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { line: $.data.id }
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { total: $.data.total_cents }
            - call: "POST /distribution/orders/${ord}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "op-1"
            - call: "GET /distribution/inventory-lots/${lot}"
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { reserved_mid: $.data.quantity_reserved, avail_mid: $.data.quantity_available, onhand_mid: $.data.quantity_on_hand }
          trigger:
            - call: "POST /distribution/orders/${ord}/cancel"
