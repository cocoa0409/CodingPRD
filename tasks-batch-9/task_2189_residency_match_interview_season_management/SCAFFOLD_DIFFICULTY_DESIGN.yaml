              as: ProgramCoordinator
              captures: { app1_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand2_id}" }
              as: ProgramCoordinator
              captures: { app2_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", applicant_id: "${cand3_id}" }
