              as_user_id: "${lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_a_aq_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${aq_id}"
            - call: "POST /accreditation/visits/${visit_a_id}/finalize-scoring"
              as: Visitor
              as_user_id: "${lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_a_su_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "INTERVIEW" }
              as: Visitor
              as_user_id: "${lead_id}"
