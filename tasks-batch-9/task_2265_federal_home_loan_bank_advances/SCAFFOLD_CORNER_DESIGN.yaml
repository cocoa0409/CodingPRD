              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets/${asset_sf}/safekeeping-receipts"
              payload: { file_count: 12, delivery_date: "2026-08-01T00:00:00Z", return_date: "2026-09-30T00:00:00Z" }
              as: CollateralCustodian
              captures: { receipt_id: "$.data.id" }
          trigger:
            call: "POST /fhlb/safekeeping-receipts/${receipt_id}/confirm"
            payload: { outcome: "EXCEPTION", exception_note: "note endorsement missing for 3 of 12 files" }
            as: CollateralCustodian
          assert:
            - "HTTP 200 with data.status == \"EXCEPTION\" and data.exception_note echoing the submitted text"
            - "GET /fhlb/collateral-assets/{asset_sf} reports documentation_status == \"EXCEPTION\", status == \"UNDER_REVIEW\", discount_factor_bps == 0, lendable_value_cents == 0, and custody_location still \"MEMBER_VAULT\""
            - "MemberBank.lendable_collateral_value_cents == 0 and borrowing_capacity_cents == 0"
            - "re-running review-eligibility now yields factor 7100 (7800 - 700 documentation exception) and lendable 14,200,000"

      - name: substitution_links_replacement_and_returns_the_outgoing_files
        claim_type: cross_reference_link
        grounds: ["endpoints.POST /fhlb/collateral-assets/{collateral_asset_id}/substitute", "entities.CollateralAsset.replaces_asset_id", "state_machines.SafekeepingReceipt RECEIVED -> RETURNED"]
        distinguishing_aspect: "Substitution creates a NEW asset row that back-references the old one, terminalises the outgoing asset at SUBSTITUTED with zero lendable value, and returns its RECEIVED safekeeping receipts — a three-entity link in one call."
        test_recipe:
          setup:
            - "Harbor Savings tier 1, BLANKET_LIEN, one ELIGIBLE HELOC asset (upb 1,000,000, market value 1,000,000, ltv 7000) with factor 5000 and lendable 500,000."
            - "A safekeeping receipt for that asset has been confirmed RECEIVED, so custody is FHLB_SAFEKEEPING and the effective mode is DELIVERED at factor 6400 / lendable 640,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "HELOC", unpaid_principal_balance_cents: 1000000, market_value_cents: 1000000, ltv_bps: 7000, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_old: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_old}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets/${asset_old}/safekeeping-receipts"
              payload: { file_count: 4, delivery_date: "2026-08-01T00:00:00Z", return_date: "2026-09-30T00:00:00Z" }
              as: CollateralCustodian
              captures: { receipt_id: "$.data.id" }
            - call: "POST /fhlb/safekeeping-receipts/${receipt_id}/confirm"
              payload: { outcome: "RECEIVED" }
              as: CollateralCustodian
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { ver_h: "$.data.version" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_old}/substitute"
            payload: { expected_member_bank_version: "${ver_h}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { asset_new: "$.data.id" }
          assert:
            - "HTTP 201 with data.id != the outgoing asset id, data.replaces_asset_id == the outgoing asset id, data.status == \"UNDER_REVIEW\", data.lendable_value_cents == 0"
            - "GET /fhlb/collateral-assets/{asset_old} reports status \"SUBSTITUTED\" with discount_factor_bps 0 and lendable_value_cents 0"
            - "GET /fhlb/safekeeping-receipts?collateral_asset_id={asset_old} shows the receipt in status \"RETURNED\" with returned_at set"
            - "GET /fhlb/collateral-assets?replaces_asset_id={asset_old} returns exactly the new asset"
            - "MemberBank.lendable_collateral_value_cents drops to 0 until the replacement is reviewed, then becomes 15,600,000"

      - name: condition_patch_to_tier_four_forces_delivery_and_reprices_capacity
        claim_type: action_endpoint
        grounds: ["endpoints.PATCH /fhlb/member-banks/{member_bank_id}/condition", "entities.MemberBank.delivery_required", "calculations.borrowing_capacity (TIER_CAP_BPS)"]
        distinguishing_aspect: "A single tier field drives two independent derivations: dropping to tier 4 both flips delivery_required to true and halves the tier cap from 10000 to 5000 bps, taking capacity from 15,600,000 to 7,800,000 without touching any asset."
        test_recipe:
          setup: ["Harbor Savings tier 1, ACTIVE, BLANKET_LIEN, one ELIGIBLE SF_MORTGAGE (factor 7800, lendable 15,600,000), capacity 15,600,000, posture OPEN, delivery_required false."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
          trigger:
            call: "PATCH /fhlb/member-banks/${member_id}/condition"
            payload: { credit_rating_tier: 4 }
            as: CreditOfficer
          assert:
            - "HTTP 200 with data.credit_rating_tier == 4, data.delivery_required == true, data.community_lending_eligible == false (tier > 3)"
            - "data.lendable_collateral_value_cents is unchanged at 15600000 but data.borrowing_capacity_cents == 7800000 (tier cap 5000 bps)"
            - "data.collateral_posture is still \"OPEN\" and membership_status still \"ACTIVE\" — the tier change is not a membership transition"
            - "the asset's effective_listing_mode is still \"BLANKET\" with factor 7800: delivery_required gates FUNDING, it does not itself re-list the collateral"

  # =========================================================================
  # SECTION 6 — ERRORS (every catalogue entry must be reachable)
  # =========================================================================
  - section: errors
    instances:
      - name: member_bank_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEMBER_BANK_NOT_FOUND]", "endpoints.GET /fhlb/member-banks/{member_bank_id}"]
        distinguishing_aspect: "The member-bank 404 is the root of the whole FK chain and must be distinguishable from every child 404."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/member-banks/33333333-3333-4333-8333-333333333333"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_MEMBER_BANK_NOT_FOUND\""
            - "the same unknown id on GET /fhlb/member-banks/{id}/borrowing-capacity returns the same error id"

      - name: stock_subscription_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_STOCK_SUBSCRIPTION_NOT_FOUND]", "endpoints.GET /fhlb/stock-subscriptions/{stock_subscription_id}"]
        distinguishing_aspect: "The subscription 404 must fire on its own path even though the entity is a child of MemberBank, so it cannot be reported as ERR_MEMBER_BANK_NOT_FOUND."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/stock-subscriptions/33333333-3333-4333-8333-333333333334"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_STOCK_SUBSCRIPTION_NOT_FOUND\""
            - "POST /fhlb/stock-subscriptions/{same unknown id}/issue returns the same error id"

      - name: safekeeping_receipt_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_SAFEKEEPING_RECEIPT_NOT_FOUND]", "endpoints.GET /fhlb/safekeeping-receipts/{safekeeping_receipt_id}"]
        distinguishing_aspect: "The receipt has both a nested create path and a flat confirm path; the flat path's 404 must name the receipt, not its parent asset."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/safekeeping-receipts/33333333-3333-4333-8333-333333333335"
            payload: {}
            as: CollateralCustodian
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SAFEKEEPING_RECEIPT_NOT_FOUND\""
            - "POST /fhlb/safekeeping-receipts/{same unknown id}/confirm with outcome RECEIVED returns the same error id"

      - name: verification_review_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_REVIEW_NOT_FOUND]", "endpoints.GET /fhlb/collateral-verification-reviews/{collateral_verification_review_id}"]
        distinguishing_aspect: "All five review lifecycle actions hang off the review id, so an unknown review must 404 before any lifecycle precondition is evaluated."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/collateral-verification-reviews/33333333-3333-4333-8333-333333333336"
            payload: {}
            as: CollateralReviewAuditor
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_REVIEW_NOT_FOUND\""
            - "POST .../{same unknown id}/begin-field-work returns the same error id rather than ERR_INVALID_STATE"

      - name: review_finding_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_REVIEW_FINDING_NOT_FOUND]", "endpoints.GET /fhlb/review-findings/{review_finding_id}"]
        distinguishing_aspect: "Findings are addressed by a flat id for remediation and waiver, so the finding 404 is distinct from the review 404."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/review-findings/33333333-3333-4333-8333-333333333337"
            payload: {}
            as: CollateralReviewAuditor
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_REVIEW_FINDING_NOT_FOUND\""
            - "POST /fhlb/review-findings/{same unknown id}/waive returns the same error id"

      - name: advance_product_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_ADVANCE_PRODUCT_NOT_FOUND]", "endpoints.GET /fhlb/advance-products/{advance_product_id}"]
        distinguishing_aspect: "The product is referenced by body FK on advance creation, so its 404 must also fire from POST /fhlb/advances and not be collapsed into ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/advance-products/33333333-3333-4333-8333-333333333338"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ADVANCE_PRODUCT_NOT_FOUND\""
            - "a POST /fhlb/advances whose advance_product_id is that unknown id returns the same 404 error id"

      - name: prepayment_event_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREPAYMENT_EVENT_NOT_FOUND]", "endpoints.GET /fhlb/prepayment-events/{prepayment_event_id}"]
        distinguishing_aspect: "Settlement is addressed by the event id on a flat path, so an unknown quote must 404 rather than being read as an expired quote."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/prepayment-events/33333333-3333-4333-8333-333333333339"
            payload: {}
            as: TreasuryOfficer
            as_user_id: "treasury-officer-unscoped"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_PREPAYMENT_EVENT_NOT_FOUND\""
            - "POST /fhlb/prepayment-events/{same unknown id}/settle returns the same error id, NOT ERR_QUOTE_EXPIRED"

      - name: community_program_allocation_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_ALLOCATION_NOT_FOUND]", "endpoints.GET /fhlb/community-program-allocations/{community_program_allocation_id}"]
        distinguishing_aspect: "The allocation is an optional body FK on advance creation: when supplied and unknown it must 404 at priority 4, before the community-product and eligibility rules at priority 10."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "GET /fhlb/community-program-allocations/33333333-3333-4333-8333-33333333333a"
            payload: {}
            as: CommunityLendingManager
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ALLOCATION_NOT_FOUND\""
            - "a POST /fhlb/advances against a non-community product carrying that unknown allocation id returns the same 404, not ERR_PRODUCT_NOT_COMMUNITY_PROGRAM"

      - name: asset_submission_without_executed_pledge_rejected
        claim_type: violation_to_error
        grounds: ["validations.pledge-agreement-executed", "errors[ERR_PLEDGE_AGREEMENT_NOT_EXECUTED]"]
        distinguishing_aspect: "Collateral cannot exist before the security agreement: with pledge_agreement_status NONE the submission itself is refused at priority 8, so the member never accumulates unpledged assets."
        test_recipe:
          setup: ["Harbor Savings exists with pledge_agreement_status NONE and pledge_mode NONE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets"
            payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_PLEDGE_AGREEMENT_NOT_EXECUTED\""
            - "GET /fhlb/collateral-assets?member_bank_id={member_id} returns total_count == 0"
            - "after POST /fhlb/member-banks/{member_id}/pledge-agreement the identical submission succeeds"

      - name: documentation_missing_blocks_eligibility_review
        claim_type: violation_to_error
        grounds: ["state_machines.CollateralAsset review-eligibility precondition documentation_status != MISSING", "errors[ERR_DOCUMENTATION_MISSING]"]
        distinguishing_aspect: "MISSING documentation is a hard stop while EXCEPTION documentation is only a 700 bps penalty — the two documentation states must not be treated alike."
        test_recipe:
          setup: ["Harbor Savings tier 1 with an executed BLANKET_LIEN pledge and one submitted SF_MORTGAGE whose documentation_status is MISSING."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, documentation_status: "MISSING", appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_nodoc: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_nodoc}/review-eligibility"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DOCUMENTATION_MISSING\""
            - "the asset stays UNDER_REVIEW with lendable_value_cents 0 and ineligibility_reason \"NONE\""
            - "after PATCH /fhlb/collateral-assets/{asset_nodoc}/documentation sets documentation_status EXCEPTION the review succeeds with factor 7100 and lendable 14,200,000"
            - "the same asset reviewed with force_ineligible true records ineligibility_reason \"DOCUMENTATION_MISSING\" instead of erroring"

      - name: ltv_above_maximum_rejected
        claim_type: violation_to_error
        grounds: ["validations.ltv-within-max", "errors[ERR_LTV_EXCEEDS_MAX]"]
        distinguishing_aspect: "9501 bps is one basis point past the inclusive ceiling and must be refused outright, in contrast with the 9500 case that is approved at a penalised factor."
        test_recipe:
          setup: ["Harbor Savings tier 1 with an executed BLANKET_LIEN pledge and one submitted SF_MORTGAGE at ltv 9501."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 9501, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_hot: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_hot}/review-eligibility"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_LTV_EXCEEDS_MAX\""
            - "the asset stays UNDER_REVIEW and MemberBank.lendable_collateral_value_cents is still 0"
            - "after PATCH /fhlb/collateral-assets/{asset_hot}/documentation lowers ltv_bps to 9500 the review succeeds at factor 7300"

      - name: delinquency_beyond_sixty_days_rejected
        claim_type: violation_to_error
        grounds: ["validations.delinquency-within-max", "errors[ERR_DELINQUENT_ASSET_INELIGIBLE]"]
        distinguishing_aspect: "60 days is the inclusive ineligibility threshold, distinct from the 30-day penalty threshold, and the rejection must name the delinquency error rather than the generic invalid-state error."
        test_recipe:
          setup: ["Harbor Savings tier 1 with an executed BLANKET_LIEN pledge and one submitted SF_MORTGAGE at 60 days delinquent."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7000, delinquency_days: 60, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_dq: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_dq}/review-eligibility"
            payload: {}
            as: CreditOfficer
            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DELINQUENT_ASSET_INELIGIBLE\""
            - "the asset stays UNDER_REVIEW with discount_factor_bps 0"
            - "the same asset reviewed with force_ineligible true becomes INELIGIBLE with ineligibility_reason \"DELINQUENT\""

      - name: membership_stock_redemption_breaching_requirement_rejected
        claim_type: violation_to_error
        grounds: ["state_machines.StockSubscription ISSUED -> REDEMPTION_REQUESTED guard", "errors[ERR_STOCK_REDEMPTION_WOULD_BREACH_REQUIREMENT]"]
        distinguishing_aspect: "The guard is evaluated on the post-redemption holding: redeeming the only 9,600,000 subscription would leave 0 against a 9,600,000 requirement, so the request must be refused even though the subscription itself is in a redeemable state."
        test_recipe:
          setup: ["Harbor Savings is ACTIVE holding exactly its required 9,600,000 of MEMBERSHIP stock in one ISSUED subscription, with no advances outstanding."]
          setup_api_calls:
