              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 100.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 60.0 }, { cart_tag: "CART-2", scale_weight_lb: 45.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart1: "$.data[0].id", cart2: "$.data[1].id" }
          trigger:
            - call: "POST /carts/${cart1}/receive"
              payload: {}
              as: PlantOperator
            - call: "GET /stops/${s_id}"
              as: PlantOperator
              captures: { actual_mid: $.data.actual_soiled_weight_lb }
            - call: "POST /carts/${cart2}/receive"
              payload: {}
              as: PlantOperator
            - call: "GET /stops/${s_id}"
