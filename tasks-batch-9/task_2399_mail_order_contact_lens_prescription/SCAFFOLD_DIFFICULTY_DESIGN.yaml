- rule_id: transitive_cascade
  rule_name: Transitive cascade
  instances:
  - name: expiry_sweep_cascades_through_hold_schedule_and_customer_ledger
    grounds: §1.2 prescription_lifecycle VERIFIED_ACTIVE -> EXPIRED opens a PRESCRIPTION_EXPIRED ReorderHold, pauses ACTIVE schedules and recomputes the Customer ledgers, and §1.2 order_verification_state moves RX_CLEARED -> RX_BLOCKED in the same sweep.
    distinguishing_aspect: 'Implementations that only flip the prescription status leave the hold absent, the schedule ACTIVE, the order RX_CLEARED and auto_reorder_enabled true. The correct implementation produces a four-level chain in one call: prescription EXPIRED, one OPEN hold, the schedule PAUSED with pause_reason HOLD_OPEN, the order RX_BLOCKED, and the customer at open_hold_count 1, active_schedule_count 0, auto_reorder_enabled false.'
    test_recipe:
      setup:
      - An UPLOAD prescription expiring 2026-09-10 is verified on 2026-09-08 and carries both a PENDING order and an ACTIVE schedule; the clock is then advanced to the morning of 2026-09-10.
