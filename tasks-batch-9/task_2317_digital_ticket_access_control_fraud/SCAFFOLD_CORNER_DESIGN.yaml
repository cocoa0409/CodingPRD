          - endpoints[POST /reconciliation-reports/{id}/finalize].side_effects
          - endpoints[POST /reconciliation-reports/{id}/reopen].side_effects
          - calculations.reconciliation_variance
        distinguishing_aspect: |
          The report's FINAL → REOPENED → FINAL loop drives the Event status in both
          directions: finalize sets Event.status RECONCILED and stamps
          finalized_by_user_id, reopen returns the Event to CLOSED and clears
          finalized_by_user_id back to null, and re-finalizing restores both. With
          reported_attendance equal to the scan-derived 2 the variance figures are exactly
          zero, so no override_reason is needed on either finalization.
