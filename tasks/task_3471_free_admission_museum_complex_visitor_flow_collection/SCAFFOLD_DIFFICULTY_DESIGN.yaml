# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3471_free_admission_museum_complex_visitor_flow_collection
# Depth probe: 2 instances per each of the 9 Difficulty Rules (§0.5).
# Every recipe drives empty-DB -> setup -> trigger using only SCAFFOLD.yaml §1.5
# endpoints. Clock default 2026-09-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: loan_premium_provisional_vs_final_diverge
        grounds:
          - calculations.loan_premium_cents
          - entities.LoanAgreement.fields.premium_cents
          - state_machines.LoanAgreement.PROPOSED_to_AGREED
        distinguishing_aspect: |
          Loan domain: the PROVISIONAL variant (flat 0.8% of declared value) and
          the FINAL variant (tiered base + courier surcharge) produce different
          results for identical terms — declared 250000000 with courier yields
          PROVISIONAL 2000000 but the persisted FINAL premium is 1260000.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CollectionObject accessioned (declared_value 300000000, not cultural property)."
            - "LoanAgreement PROPOSED for borrower 'Kunstmuseum Basel', window [2026-10-01, 2027-01-01), declared_value_cents 250000000, INSURANCE, courier_required true, negotiated_round 1, version 1."
          setup_api_calls:
            - &clock_reset
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0001", title: "Etruscan Krater", declared_value_cents: 300000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Kunstmuseum Basel", loan_start_date: "2026-10-01", loan_end_date: "2027-01-01", declared_value_cents: 250000000, coverage_type: "INSURANCE", courier_required: true }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
          trigger:
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
          assert:
            - "LoanAgreement.${loan_id}.status == AGREED"
            - "LoanAgreement.${loan_id}.premium_cents == 1260000 (FINAL: tier1 600000 + tier2 525000 = base 1125000; courier surcharge round(1125000*0.12)=135000)"
            - "LoanAgreement.${loan_id}.premium_cents != 2000000 (the PROVISIONAL flat-0.8% reading of the same terms)"

      - name: fund_settled_vs_committed_gating
        grounds:
          - calculations.fund_available_cents
          - entities.FundAccount.fields.committed_available_cents
          - entities.FundAccount.fields.settled_available_cents
        distinguishing_aspect: |
          Fund domain (distinct entity domain from loans): SETTLED availability
          (appropriation + receipts - posted) and COMMITTED availability
          (settled minus approved-unexecuted acquisition commitments) diverge —
          880000000 vs 580000000 here — and the COMMITTED variant gates
          expenditure creation, rejecting 700000000 that SETTLED would allow.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "TRUST fund appropriation_cents 1000000000, ACTIVE."
            - "POSTED expenditure 120000000 OPERATIONS on the fund."
            - "ACQUISITION review (estimated_cost_cents 300000000) submitted by curator 'cur-7' and APPROVED by chair 'chair-1' — still unexecuted."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-GEN", fund_type: "TRUST", appropriation_cents: 1000000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/funds/${fund_id}/expenditures"
              payload: { amount_cents: 120000000, activity_type: "OPERATIONS", memo: "HVAC retrofit" }
              as: FinanceOfficer
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "ACQUISITION", fund_id: "${fund_id}", proposed_object_title: "Bronze Mirror", estimated_cost_cents: 300000000 }
              as: Curator
              as_user_id: "cur-7"
              captures: { rev_id: $.data.id }
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-7"
              captures: { rev_v: $.data.version }
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "APPROVED", expected_review_version: "${rev_v}" }
              as: CommitteeChair
              as_user_id: "chair-1"
          trigger:
            - call: "POST /campus/funds/${fund_id}/expenditures"
              payload: { amount_cents: 700000000, activity_type: "OPERATIONS", memo: "Roof replacement" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
            - call: "GET /campus/funds/${fund_id}"
              payload: {}
              as: FinanceOfficer
              captures: { settled_now: $.data.settled_available_cents, committed_now: $.data.committed_available_cents }
            - call: "GET /campus/expenditures"
              payload: { fund_id: "${fund_id}" }
              as: FinanceOfficer
          assert:
            - "trigger is rejected with error_id == ERR_INSUFFICIENT_FUND_AVAILABLE (http 409)"
            - "settled_now == 880000000 (= 1000000000 - 120000000; the SETTLED variant alone would have passed 700000000)"
            - "committed_now == 580000000 (= 880000000 - 300000000 APPROVED-unexecuted acquisition commitment)"
            - "the expenditures list for the fund still contains exactly the one POSTED 120000000 row (the rejected expenditure left no trace)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: loan_premium_rounding_order_pinned
        grounds:
          - calculations.loan_premium_cents
          - entities.LoanAgreement.fields.premium_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds the tiered base once
          (6000.45 -> 6000) and then computes the 12% courier surcharge on the
          ROUNDED base (720), totaling 6720; the alternative sum-then-round
          reading (round(6000.45 * 1.12)) yields 6721 and is wrong.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CollectionObject accessioned."
            - "LoanAgreement PROPOSED: declared_value_cents 1000075 (tier-1 only), INSURANCE, courier_required true, window [2026-10-01, 2027-01-01)."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0002", title: "Moche Stirrup Vessel", declared_value_cents: 1000075, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Field Museum", loan_start_date: "2026-10-01", loan_end_date: "2027-01-01", declared_value_cents: 1000075, coverage_type: "INSURANCE", courier_required: true }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
          trigger:
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
          assert:
            - "LoanAgreement.${loan_id}.premium_cents == 6720 (base round_half_up(6000.45)=6000; surcharge round_half_up(6000*0.12)=720)"
            - "LoanAgreement.${loan_id}.premium_cents != 6721 (the sum-then-round reading round_half_up(6000.45*1.12))"

      - name: reservation_resolution_evaluation_order
        grounds:
          - calculations.reservation_status_resolution
          - calculations.waitlist_promotion
          - state_machines.SchoolGroupReservation.REQUESTED_to_WAITLISTED
          - state_machines.SchoolGroupReservation.WAITLISTED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          confirmed docents gate confirmation while confirmation consumes the
          capacity that later groups' docent math is checked against. headcount
          25 with ratio 10 needs ceil(25/10)=3 confirmed docents; with only 2
          confirmed the reservation lands WAITLISTED, and the third docent's
          confirm — not any new reservation call — promotes it to CONFIRMED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Museum; EducationProgram MON 600-660, gallery G1, student_capacity 40, docent_ratio 10, max_group_size 50, required_docent_certification BASIC, SCHEDULED."
            - "Three BASIC docents, each ASSIGNED to the program for service_date 2026-09-07 (a Monday); only docents 1 and 2 have confirmed."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/museums"
              payload: { museum_code: "NMAH", display_name: "National Museum of American History", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Innovation Lab Tour", gallery_code: "G1", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 40, docent_ratio: 10, max_group_size: 50, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent One", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { doc1: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent Two", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { doc2: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent Three", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { doc3: $.data.id }
            - call: "POST /campus/education-programs/${prog_id}/docent-assignments"
              payload: { docent_id: "${doc1}", service_date: "2026-09-07" }
              as: ProgramCoordinator
              captures: { asg1: $.data.id }
            - call: "POST /campus/education-programs/${prog_id}/docent-assignments"
              payload: { docent_id: "${doc2}", service_date: "2026-09-07" }
              as: ProgramCoordinator
              captures: { asg2: $.data.id }
            - call: "POST /campus/education-programs/${prog_id}/docent-assignments"
              payload: { docent_id: "${doc3}", service_date: "2026-09-07" }
              as: ProgramCoordinator
              captures: { asg3: $.data.id }
            - call: "POST /campus/docent-assignments/${asg1}/confirm"
              payload: {}
              as: Docent
              as_user_id: "${doc1}"
            - call: "POST /campus/docent-assignments/${asg2}/confirm"
              payload: {}
              as: Docent
              as_user_id: "${doc2}"
          trigger:
            - call: "POST /campus/school-reservations"
              payload: { museum_id: "${mus_id}", program_id: "${prog_id}", school_name: "Jefferson Middle School", headcount: 25, visit_date: "2026-09-07" }
              as: Public
              as_user_id: "teacher-1"
              captures: { res_id: $.data.id, res_status_at_create: $.data.status }
            - call: "POST /campus/docent-assignments/${asg3}/confirm"
              payload: {}
              as: Docent
              as_user_id: "${doc3}"
            - call: "GET /campus/school-reservations"
              payload: { program_id: "${prog_id}" }
              as: ProgramCoordinator
          assert:
            - "res_status_at_create == WAITLISTED (docents_confirmed 2 < docents_required ceil(25/10)=3 although capacity 0+25 <= 40 fits)"
            - "after the third confirm, the reservation's stored status is CONFIRMED (promotion was triggered by the docent confirm side effect)"
            - "SchoolGroupReservation.${res_id}.status == CONFIRMED in the list response"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_counter_rounds_cycle
        grounds:
          - state_machines.LoanAgreement.PROPOSED_to_COUNTERED
          - state_machines.LoanAgreement.COUNTERED_to_PROPOSED
          - state_machines.LoanAgreement.COUNTERED_to_AGREED
          - concurrency_rules[loan-negotiation-stale-version]
        distinguishing_aspect: |
          LoanAgreement is cyclic: PROPOSED -> COUNTERED -> PROPOSED -> COUNTERED
          -> AGREED across alternating BorrowerRep/LoansOfficer counters, with
          negotiated_round reaching 4 and version reaching 5 before the FINAL
          premium locks on the countered terms (750400 on declared 120000000).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CollectionObject accessioned; LoanAgreement PROPOSED: declared_value_cents 120000000, INSURANCE, courier_required true, window [2026-10-01, 2027-03-01)."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0003", title: "Hope Diamond Study Model", declared_value_cents: 120000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Getty Museum", loan_start_date: "2026-10-01", loan_end_date: "2027-03-01", declared_value_cents: 120000000, coverage_type: "INSURANCE", courier_required: true }
              as: LoansOfficer
              captures: { loan_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /campus/loan-agreements/${loan_id}/counter"
              payload: { expected_loan_version: "${v1}", declared_value_cents: 120000000 }
              as: BorrowerRep
              captures: { v2: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/counter"
              payload: { expected_loan_version: "${v2}", loan_end_date: "2027-03-01" }
              as: LoansOfficer
              captures: { v3: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/counter"
              payload: { expected_loan_version: "${v3}" }
              as: BorrowerRep
              captures: { v4: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${v4}" }
              as: LoansOfficer
          assert:
            - "LoanAgreement.${loan_id}.negotiated_round == 4 (1 at create + 3 counters)"
            - "LoanAgreement.${loan_id}.version == 5 (create + 3 counters + accept)"
            - "LoanAgreement.${loan_id}.status == AGREED, accepted by LoansOfficer from COUNTERED (the cycle's exit branch)"
            - "LoanAgreement.${loan_id}.premium_cents == 750400 (base 600000+70000=670000; surcharge round(670000*0.12)=80400)"

      - name: object_loan_loop_returns_to_in_collection
        grounds:
          - state_machines.CollectionObject.IN_COLLECTION_to_OUT_ON_LOAN
          - state_machines.CollectionObject.OUT_ON_LOAN_to_IN_COLLECTION
          - state_machines.LoanAgreement.AGREED_to_ACTIVE
          - state_machines.LoanAgreement.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          CollectionObject (different entity than LoanAgreement) runs the cyclic
          loop IN_COLLECTION -> OUT_ON_LOAN -> IN_COLLECTION across one full loan
          lifecycle, after which a second loan on the same object can be opened —
          the loop is re-enterable, not one-shot.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CollectionObject accessioned (declared_value_cents 50000000)."
            - "Loan 1 PROPOSED with declared 50000000, INSURANCE, courier_required false (50000000 < 100000000 threshold), window [2026-10-01, 2026-12-01)."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0004", title: "Lansdowne Portrait", declared_value_cents: 50000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Metropolitan Museum", loan_start_date: "2026-10-01", loan_end_date: "2026-12-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan1_id: $.data.id, l1_v: $.data.version }
            - call: "POST /campus/loan-agreements/${loan1_id}/accept"
              payload: { expected_loan_version: "${l1_v}" }
              as: BorrowerRep
            - call: "POST /campus/loan-agreements/${loan1_id}/condition-reports"
              payload: { report_kind: "OUTBOUND", condition_summary: "Excellent; minor frame abrasion.", damage_noted: false }
              as: LoansOfficer
              captures: { cr_out: $.data.id }
            - call: "POST /campus/condition-reports/${cr_out}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan1_id}/activate"
              payload: {}
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan1_id}/condition-reports"
              payload: { report_kind: "RETURN", condition_summary: "Returned in identical condition.", damage_noted: false }
              as: BorrowerRep
              captures: { cr_ret: $.data.id }
            - call: "POST /campus/condition-reports/${cr_ret}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan1_id}/close"
              payload: {}
              as: LoansOfficer
          trigger:
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Art Institute of Chicago", loan_start_date: "2027-01-05", loan_end_date: "2027-03-01", declared_value_cents: 52000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan2_id: $.data.id }
          assert:
            - "CollectionObject.${obj_id}.status == IN_COLLECTION after loan 1 close (OUT_ON_LOAN -> IN_COLLECTION loop completed, no damage)"
            - "LoanAgreement.${loan1_id}.status == CLOSED"
            - "LoanAgreement.${loan2_id}.status == PROPOSED (second loop iteration opens cleanly on the same object)"
            - "LoanAgreement.${loan1_id}.premium_cents == 300000 (flat tier-1: round(50000000*0.006), no courier surcharge)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deaccession_execute_cascades_loans_and_reports
        grounds:
          - state_machines.CollectionReview.APPROVED_to_EXECUTED
          - state_machines.CollectionObject.PENDING_DEACCESSION_to_DEACCESSIONED
          - state_machines.LoanAgreement.AGREED_to_CANCELLED
          - state_machines.ConditionReport.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from review execute: execute flips the object to
          DEACCESSIONED (link 1); the object flip cancels the AGREED loan (link
          2 — caused by the object's new state, not by the execute directly);
          the loan cancellation cancels its still-SUBMITTED condition report
          (link 3 — caused by the loan's cancellation). Approval was allowed
          because only ACTIVE loans block a deaccession decide; AGREED loans
          ride the cascade.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CollectionObject (not cultural property) with an AGREED loan (window [2026-10-01, 2027-01-01), declared 80000000, INSURANCE, no courier) and one SUBMITTED OUTBOUND condition report on that loan."
            - "DEACCESSION CollectionReview (disposal TRANSFER) submitted by 'cur-9' and APPROVED by 'chair-2'; object now PENDING_DEACCESSION."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0005", title: "Patent Model Collection", declared_value_cents: 80000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Science Museum London", loan_start_date: "2026-10-01", loan_end_date: "2027-01-01", declared_value_cents: 80000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
            - call: "POST /campus/loan-agreements/${loan_id}/condition-reports"
              payload: { report_kind: "OUTBOUND", condition_summary: "Stable; crate-ready.", damage_noted: false }
              as: BorrowerRep
              captures: { cr_id: $.data.id }
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "DEACCESSION", object_id: "${obj_id}", disposal_method: "TRANSFER", cultural_property_review_completed: false }
              as: Curator
              as_user_id: "cur-9"
              captures: { rev_id: $.data.id }
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-9"
              captures: { rev_v: $.data.version }
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "APPROVED", expected_review_version: "${rev_v}" }
              as: CommitteeChair
              as_user_id: "chair-2"
          trigger:
            - call: "POST /campus/collection-reviews/${rev_id}/execute"
              payload: {}
              as: Registrar
            - call: "GET /campus/loan-agreements"
              payload: { object_id: "${obj_id}" }
              as: LoansOfficer
            - call: "GET /campus/condition-reports"
              payload: { loan_id: "${loan_id}" }
              as: LoansOfficer
          assert:
            - "CollectionReview.${rev_id}.status == EXECUTED"
            - "CollectionObject.${obj_id}.status == DEACCESSIONED (disposal TRANSFER)"
            - "LoanAgreement.${loan_id}.status == CANCELLED (link 2: caused by the object leaving the collection, not by any direct loan call)"
            - "ConditionReport.${cr_id}.status == CANCELLED (link 3: caused by the loan's cancellation)"
            - "LoanAgreement.${loan_id}.premium_cents remains 480000 (locked at accept: base round(80000000*0.006)=480000, no courier surcharge)"

      - name: exhibition_close_cascades_refunds_and_receipts
        grounds:
          - state_machines.SpecialExhibition.ON_SALE_to_CLOSED
          - state_machines.ExhibitionTicket.PURCHASED_to_REFUNDED
          - entities.FundAccount.fields.receipts_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (exhibition close, not review
          execute): close flips each PURCHASED ticket to REFUNDED (link 1), and
          each ticket flip debits the TRUST revenue fund's receipts_cents by
          that ticket's price_paid_cents (link 2 — caused by each refund, not
          by the close directly).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z (public sale open)."
            - "TRUST fund (appropriation 100000000); museum; exhibition fee 1000, daily quota 5, presale 2026-09-05T00:00:00Z, public 2026-09-10T00:00:00Z, ON_SALE, revenue routed to the TRUST fund."
            - "Two public tickets PURCHASED for visit 2026-09-20; fund receipts_cents == 2000."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-EXH", fund_type: "TRUST", appropriation_cents: 100000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/museums"
              payload: { museum_code: "NGA", display_name: "National Gallery", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/exhibitions"
              payload: { title: "Vermeer and the Delft School", fee_cents: 1000, daily_ticket_quota: 5, member_presale_opens_at: "2026-09-05T00:00:00Z", public_sale_opens_at: "2026-09-10T00:00:00Z", revenue_fund_id: "${fund_id}" }
              as: ExhibitionManager
              captures: { exh_id: $.data.id }
            - call: "POST /campus/exhibitions/${exh_id}/open-sale"
