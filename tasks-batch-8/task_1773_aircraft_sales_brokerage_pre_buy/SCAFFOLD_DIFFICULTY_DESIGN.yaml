# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1773_aircraft_sales_brokerage_pre_buy
# 9 rules x 2 instances = 18 instances. Every recipe replays from empty-DB
# using only endpoints declared in SCAFFOLD.yaml §1.5.
# Canonical shared fixtures used across instances:
#   comps (Gulfstream G550, VERIFIED):
#     C1 price 4123456.05 tt 3001 | C2 price 4350000.00 tt 2850 | C3 price 3980000.55 tt 3100
#   listing tt 2900 -> PROVISIONAL 4151152.20 / FINAL 4137885.95
#   deal economics: offer 6200000.50, deposit 500000.00, credit 100000.25
#     -> base 6100000.25, SOLE commission 344000.01, DUAL commission 466000.02
#     -> buyer_due 5600000.25, seller_net SOLE 5856000.49 / DUAL 5734000.48
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: valuation_provisional_vs_final_diverge
        grounds:
          - calculations.market_comparables_valuation
          - entities.Listing.fields.market_value_estimate_usd
          - entities.Listing.fields.valuation_status
        distinguishing_aspect: |
          Same Listing + same VERIFIED comp set: PROVISIONAL (raw mean) yields
          4151152.20 while FINAL (per-comp time adjustment with per-line
          rounding) yields 4137885.95 — two variants on the Listing domain
          producing different values for identical inputs.
        test_recipe:
          setup:
            - "Listing (Gulfstream G550, tt 2900) in DRAFT"
            - "3 VERIFIED ComparableSales for Gulfstream/G550: 4123456.05@3001h, 4350000.00@2850h, 3980000.55@3100h"
          setup_api_calls:
            - call: "POST /api/listings"
              payload: { tail_number: "N1773GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
          trigger:
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "PROVISIONAL" }
              as: ListingAgent
              captures: { prov_val: $.data.market_value_estimate_usd }
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
              captures: { final_val: $.data.market_value_estimate_usd }
          assert:
            - "trigger[0] response data.market_value_estimate_usd == 4151152.20"
            - "trigger[0] response data.valuation_status == PROVISIONAL"
            - "trigger[1] response data.market_value_estimate_usd == 4137885.95"
            - "trigger[1] response data.valuation_status == FINAL"
            - "${prov_val} != ${final_val}"

      - name: commission_sole_vs_dual_diverge
        grounds:
          - calculations.commission_settlement
          - entities.Transaction.fields.commission_amount_usd
          - entities.Transaction.fields.dual_agency
        distinguishing_aspect: |
          Two Transactions with identical agreed_price_usd 6200000.50 and
          credits_total_usd 100000.25: the SOLE_AGENCY variant yields
          commission 344000.01 while the DUAL_AGENCY variant (dual_agency=true,
          disclosure FULLY_ACKED before accept) yields 466000.02 — a
          dual-variant calculation on the Transaction domain, distinct from
          the Listing-domain valuation instance.
        test_recipe:
          setup:
            - "Two ACTIVE G550 listings (comps shared), one QUALIFIED buyer (budget 7000000.00)"
            - "Deal S: sole-agency LOI 6200000.50/500000.00 accepted, escrow FUNDED, inspection COMPLETED, one NON_AIRWORTHINESS item RESOLVED with CREDIT 100000.25 -> DELIVERY_PENDING, delivery conditions complete"
            - "Deal D: dual-agency LOI 6200000.50/500000.00 with both disclosure acks, accepted, escrow FUNDED, inspection COMPLETED, identical CREDIT 100000.25 -> DELIVERY_PENDING, delivery conditions complete"
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_s: $.data.id }
            - call: "POST /api/listings/${lst_s}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_s}/activate"
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1002GS", make: "Gulfstream", model: "G550", year: 2016, total_time_hours: 3050, asking_price_usd: 11800000.00, seller_name: "Meridian Air LLC" }
              as: ListingAgent
              captures: { lst_d: $.data.id }
            - call: "POST /api/listings/${lst_d}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_d}/activate"
              as: ListingAgent
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 7000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_s}", buyer_id: "${byr_id}", offer_price_usd: 6200000.50, deposit_amount_usd: 500000.00 }
              as: BuyerAgent
              captures: { loi_s: $.data.id }
            - call: "POST /api/lois/${loi_s}/accept"
              as: ListingAgent
            - call: "GET /api/transactions?listing_id=${lst_s}"
              as: ListingAgent
              captures: { tx_s: "$.data[0].id" }
            - call: "GET /api/escrow-deposits?transaction_id=${tx_s}"
              as: EscrowOfficer
              captures: { esc_s: "$.data[0].id" }
            - call: "POST /api/escrow-deposits/${esc_s}/fund"
              payload: { funding_reference: "WIRE-S1" }
              as: EscrowOfficer
            - call: "POST /api/inspection-facilities"
              payload: { name: "SkyMRO", airport_code: "KTEB", turnaround_buffer_minutes: 120 }
              as: BrokerPrincipal
              captures: { fac_id: $.data.id }
            - call: "POST /api/inspection-bookings"
              payload: { transaction_id: "${tx_s}", facility_id: "${fac_id}", start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T14:00:00Z" }
              as: FacilityScheduler
              captures: { bk_s: $.data.id }
            - call: "POST /api/inspection-bookings/${bk_s}/confirm"
              as: FacilityScheduler
            - call: "POST /api/inspection-bookings/${bk_s}/complete"
              as: FacilityScheduler
            - call: "POST /api/transactions/${tx_s}/discrepancy-items"
              payload: { inspection_booking_id: "${bk_s}", description: "Corrosion at MLG trunnion", severity: "NON_AIRWORTHINESS", estimated_cost_usd: 185000.00 }
              as: FacilityScheduler
              captures: { dc_s: $.data.id }
            - call: "POST /api/discrepancy-items/${dc_s}/counter"
              payload: { proposed_credit_usd: 100000.25 }
              as: ListingAgent
            - call: "POST /api/discrepancy-items/${dc_s}/agree-credit"
              as: BuyerAgent
            - call: "GET /api/transactions/${tx_s}"
              as: BrokerPrincipal
              captures: { txv_s: $.data.version }
            - call: "PATCH /api/transactions/${tx_s}/delivery-conditions"
              payload: { logbook_complete: true, registration_docs_complete: true, tax_planning_notes: "1031 exchange reviewed", expected_transaction_version: "${txv_s}" }
              as: BrokerPrincipal
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_d}", buyer_id: "${byr_id}", offer_price_usd: 6200000.50, deposit_amount_usd: 500000.00, dual_agency: true }
              as: BuyerAgent
              captures: { loi_d: $.data.id }
            - call: "POST /api/lois/${loi_d}/disclosure/ack"
              payload: { party: "BUYER" }
              as: BrokerPrincipal
            - call: "POST /api/lois/${loi_d}/disclosure/ack"
              payload: { party: "SELLER" }
              as: BrokerPrincipal
            - call: "POST /api/lois/${loi_d}/accept"
              as: ListingAgent
            - call: "GET /api/transactions?listing_id=${lst_d}"
              as: ListingAgent
              captures: { tx_d: "$.data[0].id" }
            - call: "GET /api/escrow-deposits?transaction_id=${tx_d}"
              as: EscrowOfficer
              captures: { esc_d: "$.data[0].id" }
            - call: "POST /api/escrow-deposits/${esc_d}/fund"
              payload: { funding_reference: "WIRE-D1" }
              as: EscrowOfficer
            - call: "POST /api/inspection-bookings"
              payload: { transaction_id: "${tx_d}", facility_id: "${fac_id}", start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T14:00:00Z" }
              as: FacilityScheduler
              captures: { bk_d: $.data.id }
            - call: "POST /api/inspection-bookings/${bk_d}/confirm"
              as: FacilityScheduler
            - call: "POST /api/inspection-bookings/${bk_d}/complete"
              as: FacilityScheduler
            - call: "POST /api/transactions/${tx_d}/discrepancy-items"
              payload: { inspection_booking_id: "${bk_d}", description: "Cabin sidewall delamination", severity: "NON_AIRWORTHINESS", estimated_cost_usd: 185000.00 }
              as: FacilityScheduler
              captures: { dc_d: $.data.id }
            - call: "POST /api/discrepancy-items/${dc_d}/counter"
              payload: { proposed_credit_usd: 100000.25 }
              as: ListingAgent
            - call: "POST /api/discrepancy-items/${dc_d}/agree-credit"
              as: BuyerAgent
            - call: "GET /api/transactions/${tx_d}"
              as: BrokerPrincipal
              captures: { txv_d: $.data.version }
            - call: "PATCH /api/transactions/${tx_d}/delivery-conditions"
              payload: { logbook_complete: true, registration_docs_complete: true, tax_planning_notes: "like-kind exchange reviewed", expected_transaction_version: "${txv_d}" }
              as: BrokerPrincipal
          trigger:
            - call: "POST /api/transactions/${tx_s}/close"
              as: BrokerPrincipal
            - call: "POST /api/transactions/${tx_d}/close"
              as: BrokerPrincipal
          assert:
            - "trigger[0] response data.commission_amount_usd == 344000.01"
            - "trigger[0] response data.settlement_seller_net_usd == 5856000.49"
            - "trigger[0] response data.settlement_buyer_due_usd == 5600000.25"
            - "trigger[1] response data.commission_amount_usd == 466000.02"
            - "trigger[1] response data.settlement_seller_net_usd == 5734000.48"
            - "trigger[1] response data.settlement_buyer_due_usd == 5600000.25"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: valuation_final_rounds_per_comp_before_averaging
        grounds:
          - calculations.market_comparables_valuation
        distinguishing_aspect: |
          Mode (b) nested rounding: FINAL rounds each time-adjusted comp to
          cents BEFORE averaging (4106797.29, 4358700.00, 3948160.55) yielding
          4137885.95; averaging the unrounded adjustments and rounding once
          would yield 4137885.94 — the one-cent divergence is produced only by
          the pinned per-line rounding order.
        test_recipe:
          setup:
            - "Listing Gulfstream G550 tt 2900 in DRAFT; 3 VERIFIED comps 4123456.05@3001h, 4350000.00@2850h, 3980000.55@3100h"
          setup_api_calls:
            - call: "POST /api/listings"
              payload: { tail_number: "N1773GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
          trigger:
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
          assert:
            - "trigger[0] response data.market_value_estimate_usd == 4137885.95"
            - "trigger[0] response data.market_value_estimate_usd != 4137885.94 (the unpinned mean-then-round alternative)"

      - name: commission_tier_straddle_with_dual_branch
        grounds:
          - calculations.commission_settlement
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: base 6100000.25 straddles
          the 5000000 tier boundary, so commission = 300000.00 (tier1 marginal)
          + 44000.01 (tier2 marginal) = 344000.01 — neither flat 6%
          (366000.02) nor flat 4% (244000.01); the dual_agency boolean adds a
          conditional branch (base * 0.02) on top.
        test_recipe:
          setup:
            - "Sole-agency deal at DELIVERY_PENDING: agreed 6200000.50, credits_total 100000.25 (base 6100000.25), delivery conditions complete"
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_s: $.data.id }
            - call: "POST /api/listings/${lst_s}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_s}/activate"
              as: ListingAgent
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 7000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_s}", buyer_id: "${byr_id}", offer_price_usd: 6200000.50, deposit_amount_usd: 500000.00 }
              as: BuyerAgent
              captures: { loi_s: $.data.id }
            - call: "POST /api/lois/${loi_s}/accept"
              as: ListingAgent
            - call: "GET /api/transactions?listing_id=${lst_s}"
              as: ListingAgent
              captures: { tx_s: "$.data[0].id" }
            - call: "GET /api/escrow-deposits?transaction_id=${tx_s}"
              as: EscrowOfficer
              captures: { esc_s: "$.data[0].id" }
            - call: "POST /api/escrow-deposits/${esc_s}/fund"
              payload: { funding_reference: "WIRE-S1" }
              as: EscrowOfficer
            - call: "POST /api/inspection-facilities"
              payload: { name: "SkyMRO", airport_code: "KTEB", turnaround_buffer_minutes: 120 }
              as: BrokerPrincipal
              captures: { fac_id: $.data.id }
            - call: "POST /api/inspection-bookings"
              payload: { transaction_id: "${tx_s}", facility_id: "${fac_id}", start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T14:00:00Z" }
              as: FacilityScheduler
              captures: { bk_s: $.data.id }
            - call: "POST /api/inspection-bookings/${bk_s}/confirm"
              as: FacilityScheduler
            - call: "POST /api/inspection-bookings/${bk_s}/complete"
              as: FacilityScheduler
            - call: "POST /api/transactions/${tx_s}/discrepancy-items"
              payload: { inspection_booking_id: "${bk_s}", description: "Corrosion at MLG trunnion", severity: "NON_AIRWORTHINESS", estimated_cost_usd: 185000.00 }
              as: FacilityScheduler
              captures: { dc_s: $.data.id }
            - call: "POST /api/discrepancy-items/${dc_s}/counter"
              payload: { proposed_credit_usd: 100000.25 }
              as: ListingAgent
            - call: "POST /api/discrepancy-items/${dc_s}/agree-credit"
              as: BuyerAgent
            - call: "GET /api/transactions/${tx_s}"
              as: BrokerPrincipal
              captures: { txv_s: $.data.version }
            - call: "PATCH /api/transactions/${tx_s}/delivery-conditions"
              payload: { logbook_complete: true, registration_docs_complete: true, expected_transaction_version: "${txv_s}" }
              as: BrokerPrincipal
          trigger:
            - call: "POST /api/transactions/${tx_s}/close"
              as: BrokerPrincipal
          assert:
            - "trigger[0] response data.commission_amount_usd == 344000.01"
            - "trigger[0] response data.commission_amount_usd != 366000.02 (flat 6% of base)"
            - "trigger[0] response data.commission_amount_usd != 244000.01 (flat 4% of base)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: loi_negotiation_cycle_submitted_countered
        grounds:
          - state_machines.LOI.SUBMITTED_to_COUNTERED
          - state_machines.LOI.COUNTERED_to_SUBMITTED
          - concurrency_rules[loi-counter-stale-version]
        distinguishing_aspect: |
          LOI negotiation status is cyclic: SUBMITTED -> COUNTERED -> SUBMITTED
          via repeated counters, current_price_usd tracking the latest counter
          and version incrementing each round — not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE listing; QUALIFIED buyer; LOI SUBMITTED with offer 2000000.00 (version 1)"
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_id}/activate"
              as: ListingAgent
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 3000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_id}", buyer_id: "${byr_id}", offer_price_usd: 2000000.00, deposit_amount_usd: 100000.00 }
              as: BuyerAgent
              captures: { loi_id: $.data.id, loi_v: $.data.version }
          trigger:
            - call: "POST /api/lois/${loi_id}/counter"
              payload: { new_price_usd: 1900000.00, expected_loi_version: "${loi_v}" }
              as: ListingAgent
              captures: { loi_v2: $.data.version }
            - call: "POST /api/lois/${loi_id}/counter"
              payload: { new_price_usd: 1950000.00, expected_loi_version: "${loi_v2}" }
              as: BuyerAgent
          assert:
            - "trigger[0] response data.status == COUNTERED"
            - "trigger[0] response data.current_price_usd == 1900000.00"
            - "trigger[0] response data.version == ${loi_v} + 1"
            - "trigger[1] response data.status == SUBMITTED"
            - "trigger[1] response data.current_price_usd == 1950000.00"
            - "trigger[1] response data.version == ${loi_v} + 2"

      - name: listing_contract_cycle_active_under_contract_active_sold
        grounds:
          - state_machines.Listing.ACTIVE_to_UNDER_CONTRACT
          - state_machines.Listing.UNDER_CONTRACT_to_ACTIVE
          - state_machines.Listing.UNDER_CONTRACT_to_SOLD
        distinguishing_aspect: |
          Listing status is cyclic: ACTIVE -> UNDER_CONTRACT -> ACTIVE (on
          terminate) -> UNDER_CONTRACT (on a new accept) -> SOLD (on close) —
          a revert loop on the Listing entity, distinct from the LOI cycle.
        test_recipe:
          setup:
            - "ACTIVE listing; QUALIFIED buyer (budget 3000000.00); LOI-1 SUBMITTED 2000000.00/100000.00"
          setup_api_calls:
            - call: "POST /api/comparable-sales"
