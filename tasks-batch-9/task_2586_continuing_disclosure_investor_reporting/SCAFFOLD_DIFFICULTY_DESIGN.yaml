            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 3333, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req1_id: "$.data.id", req1_audit: "$.data.requires_audit_opinion" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 3333, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req2_id: "$.data.id", req2_audit: "$.data.requires_audit_opinion" }
            - call: "POST /disclosure/content-requirements"
