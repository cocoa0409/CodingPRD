            - "Paraprofessional.${p1}.weekly_scheduled_minutes == 0 (hop 1 release)"
            - "auto-created AbsenceReport[0].status == REPORTED and coverage_plan_id == ${cp1} (hop 2)"
            - "CoveragePlan.${cp1}.coverage_posture == GAPS_OPEN (hop 3)"
            - "StaffingPlan.${plan_id}.committed_cost_cents == 0 (56250 released)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (two different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_priority_on_assignment_create
        grounds:
          - validations[priority=4a]
          - validations[priority=9]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_INSUFFICIENT_BUDGET]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): the request violates BOTH plan-state
          (DRAFT) and budget (total_budget_cents 1 < any cost); priority 4a must
          win, so the error is ERR_PLAN_NOT_ACTIVE, never ERR_INSUFFICIENT_BUDGET.
        test_recipe:
          setup:
            - "Plan DRAFT (never activated) with total_budget_cents 1, building B1, para P1, student S1 ACTIVE_IEP"
            - "Both failures armed: plan not ACTIVE; any assignment cost exceeds budget"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "Tiny Plan", school_year: "2026-27", total_budget_cents: 1 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln Elementary", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
