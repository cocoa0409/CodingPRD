      - name: route_shift_and_window_temporal_rules_reject
        claim_type: violation_to_error
        grounds:
          - validations[priority=71]
          - validations[priority=72]
          - validations[priority=73]
        distinguishing_aspect: |
          The shift rule carries two independent conjuncts (ordering AND the service_date/shift_start
          agreement), and the window-containment rule is asymmetric: the start is compared bare
          against shift_start while the end is compared against shift_end MINUS the branch's
          tank_exchange_buffer_minutes, so a window that visibly ends inside the shift can still be
          rejected.
        test_recipe:
          setup:
            - "One branch with tank_exchange_buffer_minutes 30 and one stationary concentrator."
            - "One contract in PENDING_SETUP with a RESERVED placement, so SETUP_DELIVERY stops clear priority 56."
            - "One route on 2026-08-01 whose shift is deliberately short: 12:00Z to 14:00Z."
          setup_api_calls:
            - call: "POST /home-oxygen/branches"
              payload: { name: "Tampa Bay", state_code: "FL", competitive_bid_area: true, liquid_oxygen_certified: false, refill_capacity_per_day: 4, tank_exchange_buffer_minutes: 30 }
