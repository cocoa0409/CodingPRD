        distinguishing_aspect: |
          Conserved quantity = MemberAccount.wallet_credit_cents (cash ledger, a different conserved
          quantity than the entitlement ledger). An à-la-carte EXAM visit debits wallet by 4800; voiding
          it credits 4800 back, leaving wallet exactly at its pre-visit value (0).
        test_recipe:
          setup:
            - "PLUS membership ENROLLED, enrollment_fee 0, monthly 4500 -> wallet -4500 after activate"
            - "Record 3 EXAM visits: 1st,2nd covered; 3rd à-la-carte debits 4800 -> wallet -9300; void the 3rd"
