# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Ticket Resale Marketplace — breadth probe across §1.1–§1.7.
# Canonical FIXED listing: Section face=10000, Event cap_mult=3.0, ask=20000 → effective 20000.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Venue, endpoints.POST./venues]
        distinguishing_aspect: "POST /venues with name+timezone → 201; response carries server-minted id, created_at, version==1, total_section_count==0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Arena", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Venue.${vid}.version == 1"
            - "Venue.${vid}.total_section_count == 0"

      - name: get_event_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Event, "errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /events/{id} with a well-formed but non-existent UUID → ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_EVENT_NOT_FOUND"

      - name: create_listing_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Listing, "errors[ERR_INVALID_REQUEST]", endpoints.POST./listings]
        distinguishing_aspect: "POST /listings omitting ask_price_cents (source:input, no default) → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Venue, Section, Event(ON_SALE), Seller exist"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 1 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2026-09-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { sellid: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { event_id: "${eid}", seller_id: "${sellid}", section_id: "${sid}", delivery_method: "MOBILE_TRANSFER", pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: event_price_cap_multiplier_default_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Event.fields.price_cap_multiplier, endpoints.POST./events]
        distinguishing_aspect: "POST /events without price_cap_multiplier → default 3.0 applied; last_minute_cutoff_minutes defaults to 180."
        test_recipe:
          setup: ["a Venue exists"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2026-09-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
          assert:
            - "Event.${eid}.price_cap_multiplier == 3.0"
            - "Event.${eid}.last_minute_cutoff_minutes == 180"

      - name: seat_section_id_is_system_copied_input_ignored
        claim_type: System Fields
        grounds: [entities.Seat.fields.section_id, endpoints.POST./seats]
        distinguishing_aspect: "Seat.section_id is source:system copied from the parent listing; a client-supplied section_id in the body is ignored and the listing's section is used."
        test_recipe:
          setup: ["a DRAFT listing on Section sid1 exists; a second Section sid2 exists in the same venue"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S1", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 1 }
              as: PlatformAdmin
              captures: { sid1: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2026-09-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { sellid: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${eid}", seller_id: "${sellid}", section_id: "${sid1}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 1, barcode_token: "SC-1" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { seatid: $.data.id, secid: $.data.section_id }
          assert:
            - "Seat.${seatid}.section_id == ${sid1} (copied from listing)"
            - "Seat.${seatid}.status == AVAILABLE"

      - name: create_section_invalid_price_zone_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Section.fields.price_zone, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /sections with price_zone outside {PREMIUM,STANDARD,VALUE} → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["a Venue exists"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S", price_zone: "GOLD", face_value_cents: 10000, row_count: 1, seats_per_row: 1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: section_capacity_computed_from_rows_times_seats
        claim_type: Computed Fields
        grounds: [entities.Section.fields.capacity, calculations.available_seat_reconciliation]
        distinguishing_aspect: "Section.capacity == row_count*seats_per_row; for 3x4 it equals 12, computed by the server regardless of any client value."
        test_recipe:
          setup: ["a Venue exists"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 3, seats_per_row: 4 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
          assert:
            - "Section.${sid}.capacity == 12"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: charge_already_charged_order_returns_invalid_state
        claim_type: Invalid Transition
        grounds: [state_machines.Order.PENDING_to_CHARGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Charging an order whose payment_status is already CHARGED → ERR_INVALID_STATE (409); no second payout is created."
        test_recipe:
          setup: ["a CHARGED qty1 order on the canonical FIXED listing"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 1 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2026-09-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
            - call: "POST /events/${eid}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { sellid: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B" }
              as: PlatformAdmin
              captures: { bid: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${eid}", seller_id: "${sellid}", section_id: "${sid}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { lid: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 1, barcode_token: "IS-1" }
              as: Seller
              as_user_id: "${sellid}"
            - call: "POST /listings/${lid}/activate"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
              captures: { lv0: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${bid}", quantity: 1, expected_listing_version: "${lv0}" }
              as: Buyer
              as_user_id: "${bid}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${bid}"
          trigger:
            - call: "POST /orders/${oid}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${bid}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_a_cancelled_event_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Event.ON_SALE_to_CANCELLED, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "An Event already CANCELLED (terminal) rejects a second cancel with ERR_ALREADY_TERMINAL (409); no cascade re-runs."
        test_recipe:
          setup: ["an ON_SALE event already CANCELLED"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2026-09-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
            - call: "POST /events/${eid}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${eid}/cancel"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /events/${eid}/cancel"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_ALREADY_TERMINAL"

      - name: newly_created_listing_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.Listing, entities.Listing.fields.status]
        distinguishing_aspect: "A freshly created Listing has status==DRAFT and version==1 before any activate."
        test_recipe:
          setup: ["Venue, Section, Event, Seller exist"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 1 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2026-09-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { sellid: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { event_id: "${eid}", seller_id: "${sellid}", section_id: "${sid}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { lid: $.data.id }
          assert:
            - "Listing.${lid}.status == DRAFT"
            - "Listing.${lid}.version == 1"

      - name: transfer_recall_returns_order_delivery_to_awaiting
        claim_type: Side Effect Execution
        grounds: [state_machines.Transfer.SENT_to_RECALLED, state_machines.Order.delivery_status]
        distinguishing_aspect: "Recalling a SENT transfer sets Transfer.status==RECALLED and reverts Order.delivery_status to AWAITING (cross-entity side effect)."
        test_recipe:
          setup: ["a CHARGED order with a SENT transfer (IN_TRANSFER) before deadline"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 1 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2027-01-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
            - call: "POST /events/${eid}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { sellid: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B" }
              as: PlatformAdmin
              captures: { bid: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${eid}", seller_id: "${sellid}", section_id: "${sid}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { lid: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 1, barcode_token: "RC-1" }
              as: Seller
              as_user_id: "${sellid}"
            - call: "POST /listings/${lid}/activate"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
              captures: { lv0: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${bid}", quantity: 1, expected_listing_version: "${lv0}" }
              as: Buyer
              as_user_id: "${bid}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${bid}"
            - call: "POST /orders/${oid}/transfers"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
              captures: { tid: $.data.id }
            - call: "POST /transfers/${tid}/send"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
          trigger:
            - call: "POST /transfers/${tid}/recall"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
              captures: { st: $.data.status }
            - call: "GET /orders/${oid}"
              payload: {}
              as: Buyer
              as_user_id: "${bid}"
              captures: { deliv: $.data.delivery_status }
          assert:
            - "Transfer.${tid}.status == RECALLED"
            - "Order.${oid}.delivery_status == AWAITING"

      - name: reservation_expiry_on_clock_advance_releases_seats_bubble_up
        claim_type: Side Effect Execution
        grounds: [state_machines.Order.PENDING_to_REFUNDED, state_machines.Listing.SOLD_OUT_to_ACTIVE, endpoints.POST./_clock/advance]
        distinguishing_aspect: "Advancing the clock past reservation_expires_at on a SOLD_OUT single-seat listing auto-refunds the PENDING order and returns the listing to ACTIVE with available_seat_count==1."
        test_recipe:
          setup: ["a single-seat listing fully reserved (SOLD_OUT) by one PENDING order; clock is just before expiry"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-12-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 1 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2027-06-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
            - call: "POST /events/${eid}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { sellid: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B" }
              as: PlatformAdmin
              captures: { bid: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${eid}", seller_id: "${sellid}", section_id: "${sid}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { lid: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 1, barcode_token: "RE-1" }
              as: Seller
              as_user_id: "${sellid}"
            - call: "POST /listings/${lid}/activate"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
              captures: { lv0: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${bid}", quantity: 1, expected_listing_version: "${lv0}" }
              as: Buyer
              as_user_id: "${bid}"
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /_clock/advance"
              payload: { by_minutes: 100000 }
              as: PlatformAdmin
            - call: "GET /orders/${oid}"
              payload: {}
              as: Buyer
              as_user_id: "${bid}"
              captures: { pay: $.data.payment_status }
            - call: "GET /listings/${lid}"
              payload: {}
              as: Buyer
              as_user_id: "${bid}"
              captures: { lstat: $.data.status, avail: $.data.available_seat_count }
          assert:
            - "Order.${oid}.payment_status == REFUNDED"
            - "Listing.${lid}.status == ACTIVE"
            - "Listing.${lid}.available_seat_count == 1"

      - name: replacement_accept_resolves_claim_and_mints_zero_priced_order
        claim_type: Compensation
        grounds: [state_machines.GuaranteeClaim.REPLACEMENT_OFFERED_to_RESOLVED_REPLACED, state_machines.Order.delivery_status, entities.GuaranteeClaim.fields.replacement_order_id]
        distinguishing_aspect: "Accepting a replacement offer mints a new Order at locked_unit_price_cents==0, sets original Order.delivery_status==REPLACED, voids the original seats, and cancels the original ESCROWED payout."
        test_recipe:
          setup: ["a CHARGED order with delivery FAILED, claim INVESTIGATING; a separate ACTIVE replacement listing on the same event with 1 seat; offer made"]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC" }
              as: PlatformAdmin
              captures: { vid: $.data.id }
            - call: "POST /sections"
              payload: { venue_id: "${vid}", name: "S", price_zone: "STANDARD", face_value_cents: 10000, row_count: 1, seats_per_row: 2 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /events"
              payload: { venue_id: "${vid}", title: "E", doors_open_at: "2027-07-01T19:00:00.000Z" }
              as: PlatformAdmin
              captures: { eid: $.data.id }
            - call: "POST /events/${eid}/open-sales"
              payload: {}
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { display_name: "S", payout_account_ref: "a" }
              as: PlatformAdmin
              captures: { sellid: $.data.id }
            - call: "POST /buyers"
              payload: { display_name: "B" }
              as: PlatformAdmin
              captures: { bid: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${eid}", seller_id: "${sellid}", section_id: "${sid}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { lid: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${lid}", row_label: "1", seat_number: 1, barcode_token: "RP-1" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { seat1: $.data.id }
            - call: "POST /listings/${lid}/activate"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
              captures: { lv0: $.data.version }
            - call: "POST /listings"
              payload: { event_id: "${eid}", seller_id: "${sellid}", section_id: "${sid}", delivery_method: "MOBILE_TRANSFER", ask_price_cents: 20000, pricing_mode: "FIXED", split_rule: "ANY" }
              as: Seller
              as_user_id: "${sellid}"
              captures: { rlid: $.data.id }
            - call: "POST /seats"
              payload: { listing_id: "${rlid}", row_label: "9", seat_number: 1, barcode_token: "RP-R1" }
              as: Seller
              as_user_id: "${sellid}"
            - call: "POST /listings/${rlid}/activate"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
              captures: { rlv0: $.data.version }
            - call: "POST /orders"
              payload: { listing_id: "${lid}", buyer_id: "${bid}", quantity: 1, expected_listing_version: "${lv0}" }
              as: Buyer
              as_user_id: "${bid}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/charge"
              payload: {}
              as: Buyer
              as_user_id: "${bid}"
            - call: "GET /payouts?order_id=${oid}"
              payload: {}
              as: PlatformAdmin
              captures: { payid: $.data.0.id }
            - call: "POST /orders/${oid}/transfers"
              payload: {}
              as: Seller
              as_user_id: "${sellid}"
              captures: { tid: $.data.id }
            - call: "POST /transfers/${tid}/fail"
