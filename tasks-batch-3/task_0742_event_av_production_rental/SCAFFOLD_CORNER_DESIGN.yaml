  - section: cross_cutting
    instances:
      - name: confirm_stale_expected_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[confirm-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Confirm carrying expected_order_version one behind the order's current version returns 412 ERR_STALE_VERSION (OCC on RentalOrder.version)."
        test_recipe:
          setup: ["Order QUOTED (clock 2026-05-01) with an APPROVED COI and high credit, so only the version check can fail."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AccountManager }
            - { call: "POST /customers", payload: { name: "COcc", contact_email: "cocc@x.test", credit_limit_cents: 100000000 }, as: AccountManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /venues", payload: { name: "VOcc", address: "17 A", required_coverage_cents: 0 }, as: AccountManager, captures: { ven_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "LED", category: "LED", total_units: 20, daily_rate_cents: 12000, replacement_value_cents: 500000 }, as: WarehouseManager, captures: { led_id: "$.data.id" } }
            - { call: "POST /rental-orders", payload: { customer_id: "${cust_id}", venue_id: "${ven_id}", event_name: "EOcc", event_start_date: "2026-06-10", event_end_date: "2026-06-12" }, as: AccountManager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /rental-orders/${ord_id}/reservations", payload: { equipment_id: "${led_id}", qty: 1, reserve_start_date: "2026-06-10", reserve_end_date: "2026-06-12" }, as: WarehouseManager }
            - { call: "POST /rental-orders/${ord_id}/quote", payload: {}, as: AccountManager }
            - { call: "POST /rental-orders/${ord_id}/certificates-of-insurance", payload: { insurer: "Lloyd", coverage_amount_cents: 100000, expiry_date: "2026-12-31" }, as: Client, as_user_id: "${cust_id}", captures: { coi_id: "$.data.id" } }
            - { call: "POST /certificates-of-insurance/${coi_id}/approve", payload: {}, as: AccountManager }
            - { call: "GET /rental-orders/${ord_id}", payload: {}, as: AccountManager, captures: { ov: "$.data.version" } }
          trigger:
            - { call: "POST /rental-orders/${ord_id}/confirm", payload: { expected_order_version: "${ov} - 1" }, as: AccountManager, captures: { err: "$.data.error_id" } }
