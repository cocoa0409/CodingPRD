            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { pv: "$.data.version" } }
            - { call: "POST /expungement/petitions/${pet}/hearings", payload: { courtroom_id: "${cr}", judge_id: "${jg}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", expected_petition_version: "${pv}" }, as: Clerk, captures: { h: "$.data.id" } }
            - { call: "POST /expungement/hearings/${h}/transition", payload: { to_status: "HELD" }, as: Clerk }
            - { call: "POST /expungement/hearings/${h}/order", payload: { disposition: "GRANTED" }, as: Judge, captures: { co: "$.data.id" } }
            - { call: "GET /expungement/sealing-distributions", payload: { court_order_id: "${co}", recipient_type: "BACKGROUND_VENDOR" }, as: Clerk, captures: { vd: "$.data[0].id" } }
            - { call: "POST /expungement/sealing-distributions/${vd}/transition", payload: { to_status: "SENT" }, as: Clerk }
