        claim_type: violation_to_error
        grounds:
          - errors.ERR_CHARGEBACK_ALREADY_OPEN
          - state_machines.ChargebackCase
        distinguishing_aspect: "A transaction may carry only one live chargeback: a second ingest while the first is OPENED fails 409."
        test_recipe:
