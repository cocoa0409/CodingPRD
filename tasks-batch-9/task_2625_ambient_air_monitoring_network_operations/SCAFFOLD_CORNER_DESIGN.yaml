              as: FieldTechnician
          trigger:
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-03T00:00:00Z", span_drift_pct: 5.004 }
              as: FieldTechnician
              captures: { o1: "$.data.outcome" }
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-04T00:00:00Z", span_drift_pct: 5.005 }
              as: FieldTechnician
              captures: { o2: "$.data.outcome" }
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "ZERO_CHECK", performed_at: "2026-01-04T12:00:00Z", zero_drift_value: 2.25 }
              as: FieldTechnician
              captures: { o3: "$.data.outcome" }
            - call: "POST /monitors/${mon_id}/qc-events"
