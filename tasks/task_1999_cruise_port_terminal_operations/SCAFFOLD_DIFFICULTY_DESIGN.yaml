            - "err == ERR_APRON_CAPACITY (in_progress == max_apron_slots == 2 rejects)"
            - "After completing SO1 the freed slot admits SO3: s3 == IN_PROGRESS"
            - "Windows of SO1/SO2 are identical yet both admitted — capacity is aggregate, not interval-pairwise"

  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: passengers_aboard_embark_offload_conservation
        grounds:
          - state_machines.ManifestEntry.SCREENED_to_EMBARKED
          - state_machines.ManifestEntry.EMBARKED_to_CHECKED_IN
          - entities.PortCall.fields.passengers_aboard
        distinguishing_aspect: |
          Conserved quantity: live HEADCOUNT aboard. Invariant
          PortCall.passengers_aboard == count(ManifestEntry EMBARKED) holds at
          every step, and the board+offload+re-board pair returns it to exactly
          its prior value (3). Different quantity type than the monetary
          gross-billed invariant.
        test_recipe:
          setup:
            - "Call TURNAROUND, customs CLEARED; entries E1/E2/E3 all EMBARKED; E2's bag LOADED (bags_aboard == 1)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV T", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P1", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P2", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e2: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P3", direction: "EMBARK", cabin_class: "PREMIUM" }, as: VesselAgent, as_user_id: "${ves}", captures: { e3: $.data.id } }
            - { call: "POST /port-ops/manifest-entries/${e1}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e2}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e3}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/customs-cases", as: CustomsOfficer, captures: { cc: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { lane: $.data.id } }
            - { call: "POST /port-ops/screening-lanes/${lane}/open", payload: { officers_assigned: 2 }, as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/manifest-entries/${e1}/screen", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e2}/screen", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e3}/screen", as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/begin-turnaround", as: TerminalOperator }
            - { call: "POST /port-ops/customs-cases/${cc}/clear", as: CustomsOfficer }
            - { call: "POST /port-ops/manifest-entries/${e1}/board", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e2}/board", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e3}/board", as: TerminalOperator }
            - { call: "POST /port-ops/baggage-items", payload: { manifest_entry_id: "${e2}", tag_code: "TAG-P2" }, as: TerminalOperator, captures: { bag2: $.data.id } }
            - { call: "POST /port-ops/baggage-items/${bag2}/stage", as: TerminalOperator }
            - { call: "POST /port-ops/baggage-items/${bag2}/load", as: TerminalOperator }
            - { call: "GET /port-ops/port-calls/${pc}", as: TerminalOperator, captures: { aboard0: $.data.passengers_aboard, bags0: $.data.bags_aboard } }
          trigger:
            - { call: "POST /port-ops/manifest-entries/${e2}/offload", as: TerminalOperator }
            - { call: "GET /port-ops/port-calls/${pc}", as: TerminalOperator, captures: { aboard1: $.data.passengers_aboard, bags1: $.data.bags_aboard } }
            - { call: "GET /port-ops/baggage-items/${bag2}", as: TerminalOperator, captures: { bag2_st: $.data.status } }
            - { call: "POST /port-ops/manifest-entries/${e2}/screen", as: TerminalOperator }
            - { call: "POST /port-ops/manifest-entries/${e2}/board", as: TerminalOperator }
            - { call: "GET /port-ops/port-calls/${pc}", as: TerminalOperator, captures: { aboard2: $.data.passengers_aboard } }
          assert:
            - "aboard0 == 3 and bags0 == 1 (baseline)"
            - "After offload: aboard1 == 2 (compensation), BaggageItem.${bag2}.status == OFFLOADED (cascade), bags1 == 0"
            - "After re-screen + re-board: aboard2 == 3 == aboard0 (forward+compensating pair conserves the headcount)"
            - "ManifestEntry.${e2}.status == EMBARKED"
      - name: gross_billed_dispute_adjust_settle_conservation
        grounds:
          - calculations.invoice_total
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
          - concurrency_rules[invoice-adjustment-stale-invoice]
        distinguishing_aspect: |
          Conserved quantity: MONEY. gross_cents (dockage + head tax + service
          fees) is invariant across the dispute -> adjust -> settle cycle; only
          total_cents moves, by exactly the posted credits:
          gross == total + adjustments_total (1815488 == 1805488 + 10000) at
          every step. Different quantity type than the headcount invariant.
        test_recipe:
          setup:
            - "Same executed turnaround as invoice_total_pinned_evaluation_order: FINAL invoice gross 1815488 (dockage 1763438 + tax 4050 + service 48000)"
          setup_api_calls:
