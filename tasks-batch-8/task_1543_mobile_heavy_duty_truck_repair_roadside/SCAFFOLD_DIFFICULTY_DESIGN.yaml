            - { call: "POST /roadside/dispatches/${dB}/accept", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/dispatches/${dB}/depart", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T21:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${dB}/arrive", payload: { actual_travel_miles: 40 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scB}/diagnose", payload: { diagnosis_summary: "loose cable", resolution_path: "ON_SITE_REPAIR" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scB}/start-repair", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scB}/complete-repair", payload: { labor_hours_actual: 1.0, completion_odometer_miles: 80100 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${scA}/invoices", payload: {}, as: BillingClerk, captures: { invA: $.data.id, invA_travel: $.data.travel_amount_cents, invA_total: $.data.total_cents } }
          trigger:
            - { call: "POST /roadside/service-calls/${scB}/invoices", payload: {}, as: BillingClerk, captures: { invB: $.data.id, invB_travel: $.data.travel_amount_cents, invB_total: $.data.total_cents } }
          assert:
            - "captured invA_travel == 6375 (40 - 25 free miles = 15 x 425, standard variant)"
            - "captured invB_travel == 34000 (2 x 40 portal-to-portal, no free miles, after-hours variant)"
            - "captured invA_total == 32875 (labor 14500 + travel 6375 + time 12000)"
            - "captured invB_total == 67750 (labor 21750 at 1.5x + travel 34000 + time 12000)"

  # ---------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: mode_a_final_invoice_tiered_premium_stack
        grounds:
          - calculations.final_invoice_pricing
        distinguishing_aspect: |
          Mode (a) - >=3 inputs with non-linear interaction: after-hours multiplier branch on
          labor, portal-to-portal branch on travel miles, conditional P1 callout, tiered GOLD
          discount on the four-component gross, parts-only tax. Every component of the stacked
          formula is pinned to a literal computed from the formula.
        test_recipe:
          setup:
            - "Same fixture as the S2 canonical job: after-hours P1, GOLD fleet (mtd 200000), MASTER tech, 2.0h actual, 30 actual miles, 80 travel minutes, 1x STARTER-9 @ 82000."
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:30:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/fleet-accounts", payload: { company_name: "HaulCo", account_number: "ACCT-1001", billing_email: "ap@haulco.example", per_call_authorization_limit_cents: 100000, monthly_spend_cap_cents: 500000, rate_card_id: "${rc}" }, as: OpsAdmin, captures: { fa: $.data.id } }
            - { call: "POST /roadside/fleet-accounts/${fa}/spend-adjustments", payload: { amount_cents: 200000, reason: "true-up" }, as: BillingClerk }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0001", unit_number: "U-101", make: "Freightliner", model: "Cascadia", year: 2021, odometer_miles: 120000, fleet_account_id: "${fa}" }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Rita Master", employee_code: "T-100", certifications: ["ENGINE"], labor_rate_class: "MASTER", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t1: $.data.id } }
