              payload: { release_id: "${rel2_id}", territory_code: "GB", tier: "PREMIUM", stream_count: 333338 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_id}/submit"
              payload: {}
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v: $.data.version }
            - call: "POST /dsp-revenue-reports/${rep_id}/accept"
              payload: { expected_deal_version: "${deal_v}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
            - call: "POST /physical-runs"
              payload: { release_id: "${rel1_id}", distributor_id: "${dist_id}", units_planned: 1200, unit_manufacturing_cost_cents: 250, window_start: "2026-04-01", window_end: "2026-06-30", returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_id: $.data.id }
            - call: "POST /physical-runs/${run_id}/manufacture"
              payload: { units_manufactured: 1200 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /physical-runs/${run_id}/ship"
              payload: { units_shipped: 1000, wholesale_unit_price_cents: 900 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /physical-runs/${run_id}/record-returns"
              payload: { returned_units: 100 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { run_v: $.data.version }
            - call: "POST /physical-runs/${run_id}/liquidate-reserve"
              payload: { expected_run_version: "${run_v}", liquidation_pct: 0.4000 }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
            - call: "POST /marketing-spends"
              payload: { release_id: "${rel1_id}", category: "DIGITAL_ADS", amount_cents: 60000, vendor: "Northlight Media" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { spend_a_id: $.data.id }
            - call: "POST /marketing-spends/${spend_a_id}/submit"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /marketing-spends/${spend_a_id}/decide"
              payload: { decision: "APPROVE" }
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
            - call: "POST /marketing-spends/${spend_a_id}/settle"
              payload: { settled_amount_cents: 45000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /marketing-spends"
              payload: { release_id: "${rel1_id}", category: "TOUR_SUPPORT", amount_cents: 40000, vendor: "Roadcase Touring" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { spend_b_id: $.data.id }
            - call: "POST /marketing-spends/${spend_b_id}/submit"
              payload: {}
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /marketing-spends/${spend_b_id}/decide"
              payload: { decision: "APPROVE" }
              as: BusinessAffairs
              as_user_id: "biz-affairs-01"
            - call: "POST /artist-statements"
              payload: { artist_agreement_id: "${agr_id}", period_start: "2026-04-01", period_end: "2026-06-30", basis_variant: "PROVISIONAL" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { stmt_prov_id: $.data.id }
            - call: "POST /artist-statements"
              payload: { artist_agreement_id: "${agr_id}", period_start: "2026-04-01", period_end: "2026-06-30", basis_variant: "FINAL" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { stmt_final_id: $.data.id }
          trigger:
            - call: "POST /artist-statements/${stmt_prov_id}/prepare"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
            - call: "POST /artist-statements/${stmt_final_id}/prepare"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
          assert:
            - "ArtistStatement.${stmt_prov_id}.applied_royalty_rate_pct == 0.1800 and ArtistStatement.${stmt_final_id}.applied_royalty_rate_pct == 0.1800"
            - "both statements report digital_royalty_base_cents == 595000 and physical_royalty_base_cents == 510000"
            - "both statements report gross_royalty_cents == 198900, advance_applied_cents == 50000 and recording_applied_cents == 50000"
            - "ArtistStatement.${stmt_prov_id}.marketing_applied_cents == 40000 (basis 60000 FULLY_RECOUPABLE at amount_cents plus 40000 HALF_RECOUPABLE at amount_cents = raw 80000, halved by marketing_recoup_share_pct)"
            - "ArtistStatement.${stmt_prov_id}.reserve_withheld_cents == 24300 (reserve_initial_cents 135000 at 0.1800)"
            - "ArtistStatement.${stmt_prov_id}.net_payable_cents == 34600"
            - "ArtistStatement.${stmt_final_id}.marketing_applied_cents == 22500 (basis is only the SETTLED row at settled_amount_cents 45000)"
            - "ArtistStatement.${stmt_final_id}.reserve_withheld_cents == 14580 (reserve_held_cents 81000 at 0.1800)"
            - "ArtistStatement.${stmt_final_id}.net_payable_cents == 61820"
            - "ArtistStatement.${stmt_final_id}.net_payable_cents - ArtistStatement.${stmt_prov_id}.net_payable_cents == 27220"
            - "PhysicalRun.${run_id}.reserve_initial_cents == 135000, reserve_liquidated_cents == 54000 and reserve_held_cents == 81000 at the moment both statements are prepared"
            - "ArtistAgreement.${agr_id}.unrecouped_artist_advance_cents is still 50000 and unrecouped_recording_cents is still 50000 — prepare debits nothing"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_order_beats_sum_then_round
        grounds:
          - calculations.dsp_line_revenue
          - entities.DspRevenueLine.fields.resolved_revenue_cents
          - entities.DspRevenueReport.fields.gross_receipts_cents
          - state_machines.DspRevenueReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER of the two rounding steps changes the answer:
          rounding each of the three lines to whole cents first and then summing gives 800001, while
          summing the raw micro-derived values and rounding once gives 800002. This instance is the
          only one that pins the rounding-order distinction; it uses no branch selection and no
          circular dependency.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Distributor, one Artist, one EXECUTED DISTRIBUTION_FEE deal with distribution_fee_pct 0.1500, advance_amount_cents 0, term 2026-01-01..2026-12-31"
            - "one RELEASED release with advance_share_cents 0"
            - "three StreamRateCard rows for dsp_code STRM at 4000, 1200 and 3000 micros per stream"
            - "one DRAFT DspRevenueReport for 2026-04-01..2026-06-30 with three lines whose raw values are 400000.4, 300000.36 and 100001.4 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US", "GB"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 500000, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "012345678905", title: "Glass Harbour", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 0 }
