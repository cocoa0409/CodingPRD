  - section: endpoints
    instances:
      - name: patch_unit_to_down_updates_occupancy_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /units/{id}]
          - entities.Unit.fields.occupancy_status
          - entities.Unit.fields.occupant_display_name
        distinguishing_aspect: |
          The update endpoint is partial: a body carrying only occupancy_status and
          occupant_display_name must leave unit_number and bedroom_count untouched, bump version to
          2 and move updated_at, while the derived counters stay 0 because no deficiency exists.
        test_recipe:
          setup:
            - "Property Cedar Walk with unit 101 created as OCCUPIED with occupant_display_name Household 101."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id, u1_v: $.data.version }
          trigger:
            - call: "PATCH /units/${u1_id}"
              payload: { occupancy_status: "DOWN", occupant_display_name: "Vacated for rehab" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          assert:
            - "the trigger returns HTTP 200"
            - "${u1_v} == 1 and Unit.${u1_id}.version == 2"
            - "Unit.${u1_id}.occupancy_status == DOWN"
            - "Unit.${u1_id}.occupant_display_name == Vacated for rehab"
            - "Unit.${u1_id}.unit_number == 101 and Unit.${u1_id}.bedroom_count == 1"
            - "Unit.${u1_id}.property_id == ${prop_id}"
            - "Unit.${u1_id}.prior_deficiency_count == 0 and Unit.${u1_id}.open_deficiency_count == 0"
            - "GET /units/${u1_id} returns the same values"

      - name: property_list_read_reflects_derived_counters_after_a_sweep_finding
        claim_type: computed_read
        grounds:
          - endpoints[GET /properties]
          - entities.Property.fields.open_life_threatening_count
          - calculations.property_readiness_posture
        distinguishing_aspect: |
          The list projection must carry the same freshly derived counters as the single read: after
          one OPEN LIFE_THREATENING finding the property is RESTRICTED with
          open_life_threatening_count 1 and overdue_life_threatening_count 0, and the
          readiness_posture filter must select it. A cached or create-time-only posture leaves the
          row under READY and the filtered list empty.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS (UNIT, LIFE_THREATENING, base 10.00, 24h)."
            - "Property Cedar Walk with OCCUPIED unit 101 and an IN_PROGRESS ALL_AREAS sweep."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
              captures: { dd_lt: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_lt}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo_id: $.data.id, d1_id: $.data.deficiency_id }
          trigger:
            - call: "GET /properties?readiness_posture=RESTRICTED&limit=10&offset=0"
              payload: {}
              as: HousingAgencyInspector
              captures: { listed_posture: "$.data[0].readiness_posture", listed_open_lt: "$.data[0].open_life_threatening_count" }
          assert:
            - "the trigger returns HTTP 200 with total_count == 1 and has_more == false"
            - "$.data[0].id == ${prop_id}"
            - "${listed_posture} == RESTRICTED"
            - "${listed_open_lt} == 1"
            - "$.data[0].overdue_life_threatening_count == 0"
            - "$.data[0].open_severe_count == 0"
            - "$.data[0].last_final_score is null"
            - "Deficiency.${d1_id}.points_deducted == 36.00 and Deficiency.${d1_id}.correction_due_at == 2026-08-04T09:00:00.000Z"
            - "WorkOrder.${wo_id}.priority_tier == URGENT"
            - "GET /properties/${prop_id} reports the identical posture and counters"

      - name: schedule_follow_up_creates_the_linked_follow_up_inspection
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /corrective-action-plans/{id}/schedule-follow-up]
          - state_machines.CorrectiveActionPlan.APPROVED_to_FOLLOW_UP_SCHEDULED
          - entities.CorrectiveActionPlan.fields.follow_up_inspection_id
          - entities.Unit.fields.prior_deficiency_count
        distinguishing_aspect: |
          One call must weave three rows together: a brand-new FOLLOW_UP Inspection in SCHEDULED on
          the same property and standard, the plan's follow_up_inspection_id pointing at it, and the
          parent inspection moved to FOLLOW_UP_SCHEDULED. It must also fold the parent's two
          non-VOIDED deficiencies into Unit.prior_deficiency_count, which is what later samplings
          rank on - a naive implementation creates the inspection but leaves the link null or the
          unit history at 0.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 with LT_GAS and SEV_WINDOW; Property Cedar Walk (total_unit_count 1, reserve 500000) with unit 101."
            - "The inspection is scored 84.0, finalized into CAP_REQUIRED with cap_due_at 2026-10-26T09:00:00.000Z and followup_due_at 2026-11-25T09:00:00.000Z."
            - "The owner's plan (cost 400000, target_completion_at 2026-10-20T09:00:00.000Z) is APPROVED."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_sev: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 1, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", standard_id: "${std_id}", scheduled_start: "2026-09-10T09:00:00.000Z", scheduled_end: "2026-09-10T17:00:00.000Z", inspection_kind: "INITIAL" }
              as: HousingAgencyInspector
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /sample-selections?inspection_id=${insp_id}&unit_id=${u1_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel1_id: "$.data[0].id" }
            - call: "POST /sample-selections/${sel1_id}/notice"
              payload: { notice_method: "MAILED", notified_at: "2026-08-05T09:00:00.000Z", access_window_start: "2026-09-10T09:00:00.000Z", access_window_end: "2026-09-10T17:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /inspections/${insp_id}/start"
              payload: { started_at: "2026-09-10T09:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /sample-selections/${sel1_id}/access"
              payload: { access_result: "GRANTED", recorded_at: "2026-09-10T09:05:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /inspections/${insp_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { v1: $.data.version }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-09-10T10:00:00.000Z" }
              as: HousingAgencyInspector
              captures: { d1_id: $.data.id, v2: $.data.inspection_version_after_record }
            - call: "POST /inspections/${insp_id}/deficiencies"
              payload: { expected_inspection_version: "${v2}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-09-10T10:05:00.000Z" }
              as: HousingAgencyInspector
              captures: { d2_id: $.data.id }
            - call: "POST /inspections/${insp_id}/score"
              payload: { scored_at: "2026-09-11T09:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /inspections/${insp_id}/finalize"
              payload: { finalized_at: "2026-09-14T09:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /corrective-action-plans"
              payload: { inspection_id: "${insp_id}", narrative: "Replace both egress windows", total_estimated_cost_cents: 400000, milestone_count: 3, target_completion_at: "2026-10-20T09:00:00.000Z", submitted_at: "2026-09-15T09:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { cap_id: $.data.id }
            - call: "POST /corrective-action-plans/${cap_id}/review"
              payload: { decision: "APPROVED", decided_at: "2026-09-16T09:00:00.000Z", reviewer_note: "Scope and schedule acceptable" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
              captures: { cap_v: $.data.version }
          trigger:
            - call: "POST /corrective-action-plans/${cap_id}/schedule-follow-up"
              payload: { scheduled_start: "2026-11-02T09:00:00.000Z", scheduled_end: "2026-11-02T17:00:00.000Z" }
              as: HousingAgencyInspector
              captures: { fu_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "Inspection.${fu_id}.inspection_kind == FOLLOW_UP and Inspection.${fu_id}.status == SCHEDULED"
            - "Inspection.${fu_id}.property_id == ${prop_id} and Inspection.${fu_id}.standard_id == ${std_id}"
            - "Inspection.${fu_id}.scheduled_start == 2026-11-02T09:00:00.000Z and Inspection.${fu_id}.scheduled_end == 2026-11-02T17:00:00.000Z"
            - "Inspection.${fu_id}.sample_size == 0 and Inspection.${fu_id}.final_score is null"
            - "CorrectiveActionPlan.${cap_id}.status == FOLLOW_UP_SCHEDULED"
            - "CorrectiveActionPlan.${cap_id}.follow_up_inspection_id == ${fu_id}"
            - "CorrectiveActionPlan.${cap_id}.version == ${cap_v} + 1"
            - "Inspection.${insp_id}.status == FOLLOW_UP_SCHEDULED"
            - "Unit.${u1_id}.prior_deficiency_count == 2"

      - name: corner_action_endpoint_work_order_transitions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /work-orders/{id}/verify-closure]
        excluded_because:
          difficulty_instance: non_linear_state_machine / work_order_rejected_verification_reopens_repair_dimension_then_passes
          rationale: "The action endpoints on the work-order lifecycle, their preconditions and their transitions are driven end-to-end by the named §1.8 instance."

      - name: corner_conditional_action_plan_review_needs_cap_required
        claim_type: conditional_action
        grounds:
          - endpoints[POST /corrective-action-plans/{id}/review]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cap_approval_requires_and_advances_the_owning_inspection_state
          rationale: "The condition on the owning inspection's state, and the state it lands in, are asserted by the named §1.8 instance."

      - name: corner_bulk_action_capital_needs_recompute
        claim_type: bulk_action
        grounds:
          - endpoints[POST /capital-needs/recompute]
        excluded_because:
          difficulty_instance: compensating_invariant / reserve_allocation_sum_invariant_holds_across_two_recompute_generations
          rationale: "The batch regeneration endpoint, its supersede-then-create semantics and the per-generation totals are asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # errors: every code in the §1.6 catalog must be triggerable.
  # Codes already driven by an instance above are not repeated here:
  #   ERR_INVALID_REQUEST, ERR_INVALID_ENUM_VALUE, ERR_PROPERTY_NOT_FOUND,
  #   ERR_DEFECT_DEFINITION_NOT_FOUND (entities), ERR_STANDARD_ALREADY_ADOPTED,
  #   ERR_SWEEP_INVALID_STATE, ERR_NOTICE_WINDOW_TOO_SHORT (state_machines),
  #   ERR_AREA_MISMATCH, ERR_AREA_OUT_OF_SCOPE (validations).
  # The three 412 stale-version codes are driven in the
  # cross_cutting_complexity_layers section, and the four 401/403 codes in the
  # rbac section, per the claim-extraction guide's own partitioning.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: get_inspection_standard_with_unknown_id_returns_standard_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STANDARD_NOT_FOUND]
          - endpoints[GET /inspection-standards/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown id must produce the entity-specific 404 code, not a
          generic 404 and not ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /inspection-standards/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_STANDARD_NOT_FOUND"

      - name: get_unit_with_unknown_id_returns_unit_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNIT_NOT_FOUND]
          - endpoints[GET /units/{id}]
        distinguishing_aspect: |
          The Unit-specific 404 code must be selected even though the same path shape serves the
          Property tree.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /units/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_UNIT_NOT_FOUND"

      - name: get_inspection_with_unknown_id_returns_inspection_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INSPECTION_NOT_FOUND]
          - endpoints[GET /inspections/{id}]
        distinguishing_aspect: |
          Every action endpoint under /inspections/{id} funnels through the same lookup, so this code
          must exist and be distinct from the sample and deficiency codes.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /inspections/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: HousingAgencyInspector
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_INSPECTION_NOT_FOUND"

      - name: get_sample_selection_with_unknown_id_returns_sample_selection_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SAMPLE_SELECTION_NOT_FOUND]
          - endpoints[GET /sample-selections/{id}]
        distinguishing_aspect: |
          Sample slots are created only as a cascade of draw-sample, so their 404 path is easy to
          leave unimplemented.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /sample-selections/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: HousingAgencyInspector
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_SAMPLE_SELECTION_NOT_FOUND"

      - name: get_deficiency_with_unknown_id_returns_deficiency_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DEFICIENCY_NOT_FOUND]
          - endpoints[GET /deficiencies/{id}]
        distinguishing_aspect: |
          Deficiencies arrive from two different parents (inspection and sweep), and the unknown-id
          case must still yield the one Deficiency 404 code.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /deficiencies/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: HousingAgencyInspector
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_DEFICIENCY_NOT_FOUND"

      - name: get_sweep_with_unknown_id_returns_sweep_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SWEEP_NOT_FOUND]
          - endpoints[GET /self-assessment-sweeps/{id}]
        distinguishing_aspect: |
          The sweep 404 must be distinct from the inspection 404 even though both are property-level
          campaigns.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /self-assessment-sweeps/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PropertyOwner
              as_user_id: "owner-unknown"
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_SWEEP_NOT_FOUND"

      - name: get_work_order_with_unknown_id_returns_work_order_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - endpoints[GET /work-orders/{id}]
        distinguishing_aspect: |
          Work orders are only ever created as a cascade of a sweep finding, so the direct-read 404
          path needs its own coverage.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_WORK_ORDER_NOT_FOUND"

      - name: get_appeal_with_unknown_id_returns_appeal_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_APPEAL_NOT_FOUND]
          - endpoints[GET /appeals/{id}]
        distinguishing_aspect: |
          The appeal 404 must be distinct from ERR_DEFICIENCY_NOT_IN_INSPECTION, which is about a
          real appeal citing the wrong deficiency.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /appeals/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: AppealsOfficer
              as_user_id: "appeals-1"
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_APPEAL_NOT_FOUND"

      - name: get_corrective_action_plan_with_unknown_id_returns_cap_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CAP_NOT_FOUND]
          - endpoints[GET /corrective-action-plans/{id}]
        distinguishing_aspect: |
          The plan 404 must be distinct from ERR_CAP_INVALID_STATE, which is about a real plan in the
          wrong state.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /corrective-action-plans/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_CAP_NOT_FOUND"

      - name: get_capital_need_item_with_unknown_id_returns_capital_need_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CAPITAL_NEED_NOT_FOUND]
          - endpoints[GET /capital-needs/{id}]
        distinguishing_aspect: |
          Capital need items exist only as recompute output, so their single-read 404 is the last
          uncovered lookup in the catalog.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /capital-needs/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 404 with error_id ERR_CAPITAL_NEED_NOT_FOUND"

      - name: create_standard_with_weights_that_miss_one_hundred_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_WEIGHTS_NOT_NORMALIZED]
          - validations[priority=63]
          - entities.InspectionStandard.fields.unit_weight_pct
        distinguishing_aspect: |
          50.00 + 30.00 + 30.00 = 110.00 must be refused at creation with the dedicated 422 code, not
          silently normalised and not reported as ERR_INVALID_REQUEST - the inspectable-area weights
          are the backbone of every later score.
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-BAD", name: "Bad weights", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 30.00 }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 422 with error_id ERR_WEIGHTS_NOT_NORMALIZED"
            - "GET /inspection-standards?code=NSPIRE-BAD has total_count == 0"

      - name: life_threatening_definition_with_a_forty_eight_hour_deadline_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LT_DEADLINE_MUST_BE_24H]
          - validations[priority=66]
          - entities.DefectDefinition.fields.correction_deadline_hours
        distinguishing_aspect: |
          The twenty-four-hour obligation is a property of the severity, not of the author's choice:
          a LIFE_THREATENING definition declaring 48 hours must be refused, while the same 48 on a
          SEVERE definition is legal.
        test_recipe:
          setup:
            - "A DRAFT standard NSPIRE-2026 exists."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_SLOW", name: "Gas leak with a lazy deadline", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 48 }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 422 with error_id ERR_LT_DEADLINE_MUST_BE_24H"
            - "InspectionStandard.${std_id}.life_threatening_definition_count == 0"
            - "InspectionStandard.${std_id}.defect_definition_count == 0"

      - name: adopting_a_standard_with_no_life_threatening_definition_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_LIFE_THREATENING_DEFINITION]
          - validations[priority=64]
          - state_machines.InspectionStandard.DRAFT_to_ADOPTED
        distinguishing_aspect: |
          A standard that cannot express a life-threatening defect can never produce a
          twenty-four-hour obligation, so adoption must fail even though the standard is otherwise
          complete and its weights are normalised.
        test_recipe:
          setup:
            - "A DRAFT standard NSPIRE-2026 carrying only one SEVERE definition."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
          trigger:
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 422 with error_id ERR_NO_LIFE_THREATENING_DEFINITION"
            - "InspectionStandard.${std_id}.adoption_status == DRAFT"
            - "InspectionStandard.${std_id}.adopted_at is null"
            - "InspectionStandard.${std_id}.defect_definition_count == 1 and InspectionStandard.${std_id}.life_threatening_definition_count == 0"

      - name: second_standard_reusing_a_live_code_is_rejected_as_duplicate
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_STANDARD_CODE]
          - validations[priority=65]
        distinguishing_aspect: |
          Uniqueness is scoped to live rows: a second DRAFT standard reusing the code of an existing
          DRAFT standard must be refused with 409, which is what keeps adoption unambiguous.
        test_recipe:
          setup:
            - "A DRAFT standard with code NSPIRE-2026 exists."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026 duplicate", effective_date: "2026-02-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_DUPLICATE_STANDARD_CODE"
            - "GET /inspection-standards?code=NSPIRE-2026 has total_count == 1"

      - name: second_defect_definition_reusing_a_code_under_one_standard_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_DEFECT_CODE]
          - validations[priority=65]
        distinguishing_aspect: |
          The defect code is unique per standard, not globally, so the collision must be detected
          within the same standard_id scope and returned as 409.
        test_recipe:
          setup:
            - "A DRAFT standard NSPIRE-2026 already carrying SEV_WINDOW."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
          trigger:
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Duplicate window defect", inspectable_area: "INSIDE", severity: "MODERATE", base_point_value: 4.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_DUPLICATE_DEFECT_CODE"
            - "InspectionStandard.${std_id}.defect_definition_count == 1"

      - name: second_unit_reusing_a_unit_number_on_one_property_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_UNIT_NUMBER]
          - validations[priority=65]
        distinguishing_aspect: |
          Unit numbers are unique per property: the same 101 must be refused on the same property and
          would be legal on a different one, so the check has to be scoped by property_id.
        test_recipe:
          setup:
            - "Property Cedar Walk already carries unit 101."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar Walk", total_unit_count: 2, capital_reserve_cents: 500000, owner_contact_email: "owner@cedar.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 1, occupancy_status: "OCCUPIED" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 3, occupancy_status: "VACANT" }
              as: PlatformAdmin
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_DUPLICATE_UNIT_NUMBER"
            - "GET /units?property_id=${prop_id} has total_count == 1"

      - name: inverted_sweep_window_is_rejected_as_invalid_time_window
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_TIME_WINDOW]
          - validations[priority=51]
        distinguishing_aspect: |
          Interval sanity is checked before any overlap or capacity arithmetic: window_end equal to
          or earlier than window_start must produce 422 rather than an empty interval that trivially
          collides with nothing.
        test_recipe:
          setup:
            - "Property Cedar Walk exists."
          setup_api_calls:
            - call: "POST /properties"
