# =============================================================================
# SCAFFOLD.yaml — Enrollment and Degree Verification Reporting from Institutions
# §1.0–§1.7 seed tables. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Enrollment and Degree Verification Reporting from Institutions (National Student
  Clearinghouse): institutional participation agreements with enrollment file
  submission on a required reporting calendar, enrollment status determination rules
  for full-time, half-time and withdrawn students feeding loan deferment and benefit
  programs, degree and certificate verification products used by employers and
  background screeners with fee structures, student privacy compliance with directory
  information rules, blocks and opt-outs, data error correction cycles when an
  institution's file misstates a status with downstream loan servicing effects,
  research data services providing aggregate outcome analysis to institutions and
  states, transcript exchange and electronic credential delivery, verification request
  authentication and requester eligibility

domain_name: enrollment-verification-clearinghouse
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat            # peer entities joined by FK references; no nested ownership tree
  state_machine_shape: cyclic      # EnrollmentFile CERTIFIED↔AMENDMENT_PENDING, Requester VETTED↔SUSPENDED, branching VerificationRequest
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # correction filer cannot decide own case; submitter≠certifier enforced by role
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; common_fields => id, created_at,
#      updated_at, version — version starts at 1 and increments on every mutation)
# =============================================================================
entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Institution legal name (required)" }
      - { name: ope_id, type: string, source: input, description: "Federal OPE identifier; unique across institutions" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | SUSPENDED", description: "ACTIVE initially; SUSPENDED by ops action or agreement-lapse cascade" }
      - { name: suspension_reason, type: enum, source: computed, default: NONE, constraints: "NONE | OPS | AGREEMENT_LAPSE", description: "Why the institution is suspended; NONE when ACTIVE" }
      - { name: compliance_standing, type: enum, source: computed, default: COMPLIANT, constraints: "COMPLIANT | WATCH | NON_COMPLIANT", description: "Derived from reporting-period outcomes per compliance_standing calculation" }
      - { name: users, type: array, source: system, description: "Embedded on create response only: the registrar users provisioned from the create payload's users array, in input order" }

  - name: ParticipationAgreement
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; owning institution" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage start date (interpreted as T00:00:00Z), inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage end date (interpreted as T00:00:00Z), EXCLUSIVE — half-open interval [from, to)" }
      - { name: status, type: enum, source: system, constraints: "SCHEDULED | ACTIVE | EXPIRED", description: "ACTIVE iff effective_from <= now < effective_to at create; SCHEDULED iff now < effective_from; EXPIRED via clock" }

  - name: InstitutionUser
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; employing institution" }
      - { name: email, type: string, source: input, description: "User email, unique per institution" }
      - { name: role, type: enum, source: input, constraints: "SUBMITTER | CERTIFIER", description: "Registrar office function; drives X-User-Role mapping" }
      - { name: status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | DEACTIVATED", description: "Only ACTIVE users may act" }

  - name: ReportingPeriod
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id" }
      - { name: term_label, type: string, source: input, description: "Human label, e.g. 'Fall 2026'" }
      - { name: term_start, type: datetime, source: input, description: "Term start date (T00:00:00Z)" }
      - { name: term_end, type: datetime, source: input, description: "Term end date (T00:00:00Z); must be > term_start" }
      - { name: submission_opens_at, type: datetime, source: input, description: "Date submissions open; must be >= term_start and < submission_due_at" }
      - { name: submission_due_at, type: datetime, source: input, description: "On-time deadline date (T00:00:00Z)" }
      - { name: grace_ends_at, type: datetime, source: computed, description: "= submission_due_at + GRACE_PERIOD_DAYS(14)" }
      - { name: status, type: enum, source: system, constraints: "SCHEDULED | OPEN | GRACE | CLOSED", description: "SCHEDULED before opens; OPEN at opens; GRACE after due; CLOSED after grace_ends_at; driven by clock" }
      - { name: outcome, type: enum, source: computed, default: NONE, constraints: "NONE | ON_TIME | LATE | DELINQUENT", description: "ON_TIME if certified_at <= due; LATE if certified after due; DELINQUENT at CLOSE with no certified file; DELINQUENT->LATE when late-certified" }
      - { name: upload_count, type: integer, source: computed, default: 0, description: "Increments by 1 on every successful enrollment-file upload for this period (drives version bumps for OCC)" }

  - name: StudentRecord
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name as reported on first enrollment row" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (T00:00:00Z)" }
      - { name: deferment_standing, type: enum, source: computed, default: NONE, constraints: "NONE | DEFERMENT_ELIGIBLE | DEFERMENT_INELIGIBLE | WITHDRAWN_GRACE | REPAYMENT_DUE", description: "Set from the most recently ACKNOWLEDGED ServicerNotification for this student (latest by created_at ASC)" }

  - name: PrivacyDirective
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> StudentRecord.id" }
      - { name: directive_type, type: enum, source: input, constraints: "FULL_BLOCK | DIRECTORY_BLOCK | RESEARCH_OPT_OUT", description: "FULL_BLOCK blocks all non-self verification; DIRECTORY_BLOCK blocks DEGREE product and consent-less ENROLLMENT; RESEARCH_OPT_OUT excludes from research cohorts" }
      - { name: effective_from, type: datetime, source: input, description: "Window start date (T00:00:00Z), inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end date (T00:00:00Z), exclusive; null = indefinite" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | SUPERSEDED | EXPIRED", description: "ACTIVE when now in window; SUPERSEDED when a newer same-type directive is created; EXPIRED via clock at effective_to" }

  - name: EnrollmentFile
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id" }
      - { name: reporting_period_id, type: string, source: input, description: "FK -> ReportingPeriod.id" }
      - { name: submitted_by_user_id, type: string, source: system, description: "FK -> InstitutionUser.id; the submitting registrar user (from X-User-ID)" }
      - { name: row_count, type: integer, source: computed, description: "Total rows ever attached (payload rows + correction-created entries)" }
      - { name: accepted_rows, type: integer, source: computed, description: "Rows with entry_status ACCEPTED or SUPERSEDED (screened clean)" }
      - { name: rejected_rows, type: integer, source: computed, description: "Rows with entry_status REJECTED at screening" }
      - { name: status, type: enum, source: system, constraints: "UPLOADED | CERTIFIED | AMENDMENT_PENDING | SUPERSEDED", description: "CERTIFIED by certifier; AMENDMENT_PENDING while a correction case is open; SUPERSEDED when replaced" }
      - { name: certified_at, type: datetime, source: system, description: "Certification timestamp (null until certified)" }
      - { name: late_submission, type: boolean, source: computed, default: false, description: "true iff certified_at > reporting period submission_due_at" }
      - { name: open_correction_count, type: integer, source: computed, default: 0, description: "Number of FILED correction cases against entries of this file" }

  - name: EnrollmentEntry
    parent: null
    common_fields: true
    fields:
      - { name: file_id, type: string, source: system, description: "FK -> EnrollmentFile.id" }
      - { name: institution_id, type: string, source: system, description: "FK -> Institution.id; denormalized from file" }
      - { name: student_id, type: string, source: system, description: "FK -> StudentRecord.id; resolved by (lower(trim(full_name)), date_of_birth) match else created" }
      - { name: student_ref, type: string, source: input, description: "Institution-scoped student identifier from the row" }
      - { name: row_index, type: integer, source: system, description: "Zero-based row order within the file payload; correction-created entries take the next index" }
      - { name: credit_hours, type: number, source: input, description: "Attempted credits; 0 <= credit_hours <= MAX_CREDIT_HOURS(30)" }
      - { name: career_level, type: enum, source: input, constraints: "UNDERGRAD | GRADUATE", description: "Drives the full-time/half-time threshold set" }
      - { name: term_start, type: datetime, source: input, description: "Row term start (T00:00:00Z)" }
      - { name: term_end, type: datetime, source: input, description: "Row term end; must be > term_start" }
      - { name: withdrawal_date, type: datetime, source: input, description: "Nullable; must satisfy term_start <= withdrawal_date <= term_end when present" }
      - { name: servicer_ref, type: string, source: input, description: "Nullable opaque loan-servicer code; entries with a servicer_ref generate ServicerNotifications" }
      - { name: entry_status, type: enum, source: system, constraints: "ACCEPTED | REJECTED | SUPERSEDED", description: "ACCEPTED at clean screening; REJECTED with reject_reason; SUPERSEDED by correction or file supersession" }
      - { name: reject_reason, type: enum, source: system, default: NONE, constraints: "NONE | MISSING_FIELD | INVALID_ENUM_VALUE | INVALID_CREDITS | INVALID_TERM_DATES | INVALID_WITHDRAWAL_DATE | DUPLICATE_STUDENT_IN_FILE", description: "Why a row was rejected" }
      - { name: status_code, type: enum, source: computed, default: NONE, constraints: "NONE | FULL_TIME | HALF_TIME | LESS_THAN_HALF_TIME | WITHDRAWN", description: "as_of_report variant: evaluated at file certification date (and at upload date pre-certification)" }
      - { name: census_status_code, type: enum, source: computed, default: NONE, constraints: "NONE | FULL_TIME | HALF_TIME | LESS_THAN_HALF_TIME | WITHDRAWN", description: "as_of_census variant: withdrawal counts only when withdrawal_date <= term_start + CENSUS_OFFSET_DAYS(14)" }
      - { name: deferment_status, type: enum, source: computed, default: NONE, constraints: "NONE | DEFERMENT_ELIGIBLE | DEFERMENT_INELIGIBLE | WITHDRAWN_GRACE | REPAYMENT_DUE", description: "Derived from status_code + withdrawal_date per deferment_determination at certification/decision date" }
      - { name: source_case_id, type: string, source: system, description: "Opaque id of the CorrectionCase that created this entry; null for file-uploaded rows" }

  - name: CorrectionCase
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_entry_id, type: string, source: input, description: "FK -> EnrollmentEntry.id; the ACCEPTED entry being corrected" }
      - { name: filed_by_user_id, type: string, source: system, description: "FK -> InstitutionUser.id; the filing registrar user (from X-User-ID)" }
      - { name: corrected_credit_hours, type: number, source: input, description: "Nullable; replacement credit_hours" }
      - { name: corrected_withdrawal_date, type: datetime, source: input, description: "Nullable; replacement withdrawal_date" }
      - { name: clear_withdrawal_date, type: boolean, source: input, default: false, description: "When true, the replacement entry has no withdrawal_date; mutually exclusive with corrected_withdrawal_date" }
      - { name: reason_code, type: enum, source: input, constraints: "REPORTING_ERROR | STATUS_MISSTATEMENT | LATE_WITHDRAWAL_NOTICE", description: "Why the original row was wrong" }
      - { name: status, type: enum, source: system, constraints: "FILED | APPLIED | DENIED", description: "FILED at create; APPLIED or DENIED via decision" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque id of deciding certifier; must differ from filed_by_user_id" }
      - { name: decided_at, type: datetime, source: system, description: "Decision timestamp" }

  - name: DegreeRecord
    parent: null
    common_fields: true
    fields:
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; conferring institution" }
      - { name: student_id, type: string, source: input, description: "FK -> StudentRecord.id" }
      - { name: degree_level, type: enum, source: input, constraints: "CERTIFICATE | ASSOCIATE | BACHELOR | MASTER | DOCTORATE", description: "Credential level" }
      - { name: degree_title, type: string, source: input, description: "e.g. 'BS Computer Science'" }
      - { name: conferred_on, type: datetime, source: input, description: "Conferral date (T00:00:00Z)" }
      - { name: status, type: enum, source: system, constraints: "REPORTED | SEALED | REVOKED", description: "REPORTED at create; SEALED = verifiable; REVOKED terminal" }
      - { name: sealed_at, type: datetime, source: system, description: "Seal timestamp" }
      - { name: created_by_user_id, type: string, source: system, description: "Opaque id of the creating submitter (from X-User-ID)" }

  - name: Requester
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Employer / background-screener organization name" }
      - { name: requester_kind, type: enum, source: input, constraints: "EMPLOYER | BACKGROUND_SCREENER", description: "Drives the purpose-eligibility matrix" }
      - { name: status, type: enum, source: system, constraints: "PENDING_VETTING | VETTED | SUSPENDED | DENIED", description: "PENDING_VETTING at create; VETTED via vet; SUSPENDED via suspend; re-vet from SUSPENDED; DENIED terminal" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "= initial_credit_cents + sum(topups 0) - charges + refunds; mutated by pay (debit) and refund (credit)" }
      - { name: initial_credit_cents, type: integer, source: input, default: 0, description: "Prepaid credit seeded at account creation" }
      - { name: vetted_at, type: datetime, source: system, description: "Most recent vetting timestamp" }

  - name: VerificationRequest
    parent: null
    common_fields: true
    fields:
      - { name: requester_id, type: string, source: input, description: "FK -> Requester.id; required and must equal X-User-ID when X-User-Role == Requester; must be absent when Learner (TRANSCRIPT self-order)" }
      - { name: student_id, type: string, source: input, description: "FK -> StudentRecord.id; for Learner role must equal X-User-ID" }
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; whose records are queried" }
      - { name: product_type, type: enum, source: input, constraints: "DEGREE | ENROLLMENT | TRANSCRIPT", description: "DEGREE/ENROLLMENT for requesters; TRANSCRIPT only for Learner self-service" }
      - { name: purpose, type: enum, source: input, constraints: "EMPLOYMENT | BACKGROUND_SCREEN | LOAN_DEFERMENT | INSURANCE | SELF", description: "Verified use; SELF only for Learner TRANSCRIPT" }
      - { name: consent_artifact, type: boolean, source: input, default: false, description: "Requester attestation that signed student consent is on file" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush handling surcharge applies" }
      - { name: status, type: enum, source: system, constraints: "QUOTED | PAID | RELEASED | BLOCKED_PRIVACY | NO_RECORD | EXPIRED | CANCELLED", description: "QUOTED at create; PAID after pay; terminal: RELEASED / BLOCKED_PRIVACY / NO_RECORD / EXPIRED / CANCELLED" }
      - { name: fee_cents, type: integer, source: computed, description: "Pinned at quote per verification_fee_quote (never re-quoted; expiry forces a new request)" }
      - { name: volume_tier_at_quote, type: enum, source: computed, constraints: "STANDARD | PREFERRED", description: "Requester's tier evaluated at quote time per requester_volume_tier" }
      - { name: quote_expires_at, type: datetime, source: computed, description: "= created_at + QUOTE_TTL_HOURS(48); pay requires now < quote_expires_at" }
      - { name: paid_at, type: datetime, source: system, description: "Payment timestamp" }
      - { name: released_at, type: datetime, source: system, description: "Release timestamp" }
      - { name: result_status, type: enum, source: system, default: NONE, constraints: "NONE | VERIFIED | NOT_VERIFIED", description: "VERIFIED on RELEASED" }
      - { name: enrollment_status_at_release, type: enum, source: system, default: NONE, constraints: "NONE | FULL_TIME | HALF_TIME | LESS_THAN_HALF_TIME | WITHDRAWN", description: "For ENROLLMENT product: recomputed as-of fulfill date" }
      - { name: artifact_expires_at, type: datetime, source: system, description: "TRANSCRIPT only: = released_at + ARTIFACT_TTL_HOURS(72); informational expiry of the delivery artifact" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Credited back to requester on BLOCKED_PRIVACY / NO_RECORD / CANCELLED from PAID" }

  - name: ServicerNotification
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_entry_id, type: string, source: system, description: "FK -> EnrollmentEntry.id; the determination this notification reports" }
      - { name: student_id, type: string, source: system, description: "FK -> StudentRecord.id" }
      - { name: servicer_ref, type: string, source: system, description: "Opaque loan-servicer code copied from the entry row; equals Servicer role's X-User-ID" }
      - { name: notification_type, type: enum, source: computed, constraints: "DEFERMENT_ELIGIBLE | DEFERMENT_INELIGIBLE | WITHDRAWN_GRACE | REPAYMENT_DUE", description: "= entry.deferment_status at generation" }
      - { name: grace_end_date, type: datetime, source: computed, description: "WITHDRAWN_GRACE only: withdrawal_date + WITHDRAWAL_GRACE_DAYS(180); else null" }
      - { name: status, type: enum, source: system, constraints: "QUEUED | SENT | ACKNOWLEDGED | SUPERSEDED", description: "QUEUED at generation; SENT on next clock advance; ACKNOWLEDGED by servicer; SUPERSEDED by a newer determination" }

  - name: ResearchDataset
    parent: null
    common_fields: true
    fields:
      - { name: scope_institution_id, type: string, source: input, description: "FK -> Institution.id; cohort drawn from this institution's entries" }
      - { name: created_by_analyst_id, type: string, source: system, description: "Opaque analyst id from X-User-ID (ResearchAnalyst role)" }
      - { name: cohort_term_start, type: datetime, source: input, description: "Cohort window start (T00:00:00Z), inclusive" }
      - { name: cohort_term_end, type: datetime, source: input, description: "Cohort window end (T00:00:00Z), inclusive; must be >= cohort_term_start" }
      - { name: status, type: enum, source: system, constraints: "REQUESTED | GENERATED", description: "REQUESTED at create; GENERATED after successful generate" }
      - { name: cohort_size, type: integer, source: computed, description: "Distinct students with an ACCEPTED non-SUPERSEDED entry whose term_start is in window, minus students with an ACTIVE RESEARCH_OPT_OUT" }
      - { name: completer_count, type: integer, source: computed, description: "Cohort members holding a SEALED DegreeRecord at this institution with conferred_on within [cohort_term_start, cohort_term_end + COMPLETION_LAG_DAYS(730)]" }
      - { name: adjusted_cohort_size, type: integer, source: computed, description: "cohort_size minus members whose census_status_code == WITHDRAWN" }
      - { name: completion_rate_census, type: number, source: computed, description: "completer_count / cohort_size, 4 decimals round_half_up" }
      - { name: completion_rate_adjusted, type: number, source: computed, description: "completer_count / adjusted_cohort_size, 4 decimals round_half_up" }
      - { name: generated_at, type: datetime, source: system, description: "Generation timestamp" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Institution
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /institutions/{id}/suspend"
        actor: ClearinghouseOps
        preconditions: ["institution.status == ACTIVE"]
        side_effects:
          - "institution.suspension_reason := OPS; institution.version += 1"
          - "every VerificationRequest targeting this institution in QUOTED or PAID -> CANCELLED (PAID ones refund fee_cents to requester.credit_balance_cents, refund_cents := fee_cents), processed in created_at ASC order"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: clock advance expires the last ACTIVE agreement with no other ACTIVE agreement covering now"
        actor: system
        preconditions: ["no ParticipationAgreement of this institution in ACTIVE status after expiry processing"]
        side_effects:
          - "institution.suspension_reason := AGREEMENT_LAPSE"
          - "same VerificationRequest cancellation cascade as ops suspend, created_at ASC"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /institutions/{id}/reinstate"
        actor: ClearinghouseOps
        preconditions: ["institution.status == SUSPENDED", "an ACTIVE agreement covering now exists (else ERR_AGREEMENT_LAPSED)"]
        side_effects: ["institution.suspension_reason := NONE"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: a SCHEDULED agreement flips ACTIVE on clock advance, or a new agreement is created already ACTIVE, while suspension_reason == AGREEMENT_LAPSE"
        actor: system
        preconditions: ["institution.suspension_reason == AGREEMENT_LAPSE"]
        side_effects: ["institution.suspension_reason := NONE"]

  - entity: ParticipationAgreement
    initial_state: ACTIVE   # ACTIVE iff effective_from <= now < effective_to at create; else SCHEDULED
    terminal_states: [EXPIRED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: clock advance reaches effective_from"
        actor: system
        preconditions: ["now >= effective_from AND now < effective_to"]
        side_effects: ["if institution SUSPENDED with suspension_reason == AGREEMENT_LAPSE -> institution ACTIVE, suspension_reason := NONE"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock advance reaches effective_to"
        actor: system
        preconditions: ["now >= effective_to"]
        side_effects: ["if no other ACTIVE agreement covers now -> institution ACTIVE->SUSPENDED (AGREEMENT_LAPSE) with the request-cancellation cascade"]
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system: clock advance past effective_to while still SCHEDULED (window skipped)"
        actor: system
        preconditions: ["now >= effective_to"]
        side_effects: []

  - entity: ReportingPeriod
    initial_state: SCHEDULED   # computed at create from now vs submission_opens_at
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system: clock advance reaches submission_opens_at"
        actor: system
        preconditions: ["now >= submission_opens_at"]
        side_effects: ["version += 1"]
      - from: OPEN
        to: GRACE
        trigger: "system: clock advance passes submission_due_at"
        actor: system
        preconditions: ["now > submission_due_at"]
        side_effects: ["version += 1"]
      - from: SCHEDULED
        to: GRACE
        trigger: "system: clock advance past submission_due_at while still SCHEDULED (opens skipped)"
        actor: system
        preconditions: ["now > submission_due_at"]
        side_effects: ["version += 1"]
      - from: OPEN
        to: CLOSED
        trigger: "system: clock advance passes grace_ends_at"
        actor: system
        preconditions: ["now > grace_ends_at"]
        side_effects:
          - "outcome := ON_TIME if a CERTIFIED file with certified_at <= submission_due_at exists, LATE if a CERTIFIED file with certified_at > submission_due_at exists, else DELINQUENT"
          - "institution.compliance_standing recomputed per compliance_standing calculation"
      - from: GRACE
        to: CLOSED
        trigger: "system: clock advance passes grace_ends_at"
        actor: system
        preconditions: ["now > grace_ends_at"]
        side_effects: ["same outcome evaluation + standing recompute as OPEN->CLOSED"]
      - from: SCHEDULED
        to: CLOSED
        trigger: "system: clock advance past grace_ends_at while still SCHEDULED"
        actor: system
        preconditions: ["now > grace_ends_at"]
        side_effects: ["same outcome evaluation + standing recompute as OPEN->CLOSED"]

  - entity: PrivacyDirective
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a new PrivacyDirective of the same directive_type is created for the same student"
        actor: system
        preconditions: ["an ACTIVE directive of the same type exists"]
        side_effects: ["student.version incremented as part of the create mutation"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock advance reaches effective_to"
        actor: system
        preconditions: ["effective_to is not null AND now >= effective_to"]
        side_effects: []
    note: "A directive whose effective_from > now is created ACTIVE with a future window start; activity for gating is evaluated as status == ACTIVE AND effective_from <= now AND (effective_to IS NULL OR now < effective_to). Creation with effective_from > now is permitted."

  - entity: EnrollmentFile
    initial_state: UPLOADED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: UPLOADED
        to: CERTIFIED
        trigger: "POST /enrollment-files/{id}/certify"
        actor: RegistrarCertifier
        preconditions:
          - "file.status == UPLOADED"
          - "certifier user.institution_id == file.institution_id (tenancy)"
          - "institution.status == ACTIVE (else ERR_INSTITUTION_SUSPENDED)"
          - "an ACTIVE agreement covering now exists (else ERR_AGREEMENT_LAPSED)"
          - "file.rejected_rows == 0 (else ERR_UNRESOLVED_ROWS)"
        side_effects:
          - "certified_at := now; late_submission := (certified_at > period.submission_due_at)"
          - "recompute status_code (as-of certified_at), census_status_code, deferment_status for every ACCEPTED entry"
          - "for each ACCEPTED entry with servicer_ref: generate ServicerNotification QUEUED with notification_type := entry.deferment_status, grace_end_date per deferment rule"
          - "any other CERTIFIED file for the same reporting_period -> SUPERSEDED; its ACCEPTED entries -> SUPERSEDED; its QUEUED/SENT notifications -> SUPERSEDED"
          - "if period.outcome IN (NONE, DELINQUENT): outcome := (late_submission ? LATE : ON_TIME); DELINQUENT -> LATE when late-certified"
          - "institution.compliance_standing recomputed"
      - from: CERTIFIED
        to: AMENDMENT_PENDING
        trigger: "system: a CorrectionCase is FILED against an ACCEPTED entry of this file"
        actor: system
        preconditions: []
        side_effects: ["open_correction_count += 1"]
      - from: AMENDMENT_PENDING
        to: CERTIFIED
        trigger: "system: the last open correction case is decided (APPLIED or DENIED) and open_correction_count reaches 0"
        actor: system
        preconditions: ["open_correction_count == 0 after decrement"]
        side_effects: []
      - from: UPLOADED
        to: SUPERSEDED
        trigger: "system: a new EnrollmentFile is uploaded for the same reporting_period"
        actor: system
        preconditions: []
        side_effects: ["its REJECTED/ACCEPTED entries -> SUPERSEDED (REJECTED rows keep reject_reason)"]
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "system: a different file for the same reporting_period is CERTIFIED"
        actor: system
        preconditions: []
        side_effects: ["its ACCEPTED entries -> SUPERSEDED; its QUEUED/SENT ServicerNotifications -> SUPERSEDED (ACKNOWLEDGED ones are historical and remain)"]
      - from: AMENDMENT_PENDING
        to: SUPERSEDED
        trigger: "system: a different file for the same reporting_period is CERTIFIED"
        actor: system
        preconditions: []
        side_effects: ["same as CERTIFIED->SUPERSEDED; any FILED cases on its entries remain FILED until decided"]

  - entity: EnrollmentEntry
    initial_state: ACCEPTED   # or REJECTED at screening; initial_state is the common path
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: correction case APPLIED on this entry, OR owning file SUPERSEDED"
        actor: system
        preconditions: []
        side_effects:
          - "on correction: a replacement ACCEPTED entry is created on the same file with corrected fields, row_index := file.row_count (then file.row_count += 1, file.accepted_rows += 1), source_case_id := case id, statuses recomputed as-of decision date"
          - "on correction: if replacement deferment_status differs, generate a new QUEUED ServicerNotification (when servicer_ref present) and supersede this entry's QUEUED/SENT notifications"
      - note: "REJECTED entries are produced at file-screening time only; they never transition"

  - entity: CorrectionCase
    initial_state: FILED
    terminal_states: [APPLIED, DENIED]
    transitions:
      - from: FILED
        to: APPLIED
        trigger: "POST /correction-cases/{id}/decision {outcome: APPROVED}"
        actor: RegistrarCertifier
        preconditions:
          - "case.status == FILED"
          - "deciding certifier user.institution_id == entry.institution_id"
          - "decided_by_user_id != filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at := now; old entry ACCEPTED->SUPERSEDED; replacement ACCEPTED entry created (see EnrollmentEntry)"
          - "file.open_correction_count -= 1; if 0 and file.status == AMENDMENT_PENDING -> file CERTIFIED"
          - "notification supersede/generate cascade per EnrollmentEntry transition"
      - from: FILED
        to: DENIED
        trigger: "POST /correction-cases/{id}/decision {outcome: DENIED}"
        actor: RegistrarCertifier
        preconditions:
          - "case.status == FILED"
          - "deciding certifier user.institution_id == entry.institution_id"
          - "decided_by_user_id != filed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "entry unchanged; file.open_correction_count -= 1; if 0 and file.status == AMENDMENT_PENDING -> file CERTIFIED"

  - entity: DegreeRecord
    initial_state: REPORTED
    terminal_states: [REVOKED]
    transitions:
      - from: REPORTED
        to: SEALED
        trigger: "POST /degree-records/{id}/seal"
        actor: RegistrarCertifier
        preconditions:
          - "degree.status == REPORTED"
          - "certifier user.institution_id == degree.institution_id"
          - "institution.status == ACTIVE (else ERR_INSTITUTION_SUSPENDED)"
          - "an ACTIVE agreement covering now exists (else ERR_AGREEMENT_LAPSED)"
          - "institution.compliance_standing != NON_COMPLIANT (else ERR_INSTITUTION_NON_COMPLIANT)"
        side_effects: ["sealed_at := now"]
      - from: SEALED
        to: REVOKED
        trigger: "POST /degree-records/{id}/revoke"
        actor: RegistrarCertifier
        preconditions: ["degree.status == SEALED", "certifier user.institution_id == degree.institution_id"]
        side_effects: ["post-revocation fulfillments treat the degree as absent (NO_RECORD path)"]

  - entity: Requester
    initial_state: PENDING_VETTING
    terminal_states: [DENIED]
    transitions:
      - from: PENDING_VETTING
        to: VETTED
        trigger: "POST /requesters/{id}/vet {outcome: VET}"
        actor: ClearinghouseOps
        preconditions: ["requester.status == PENDING_VETTING"]
        side_effects: ["vetted_at := now"]
      - from: PENDING_VETTING
        to: DENIED
        trigger: "POST /requesters/{id}/vet {outcome: DENY}"
        actor: ClearinghouseOps
        preconditions: ["requester.status == PENDING_VETTING"]
        side_effects: []
      - from: VETTED
        to: SUSPENDED
        trigger: "POST /requesters/{id}/suspend"
        actor: ClearinghouseOps
        preconditions: ["requester.status == VETTED"]
        side_effects: ["in-flight QUOTED requests of this requester are unaffected; new creates are rejected"]
      - from: SUSPENDED
        to: VETTED
        trigger: "POST /requesters/{id}/vet {outcome: VET}"
        actor: ClearinghouseOps
        preconditions: ["requester.status == SUSPENDED"]
        side_effects: ["vetted_at := now"]

  - entity: VerificationRequest
    initial_state: QUOTED
    terminal_states: [RELEASED, BLOCKED_PRIVACY, NO_RECORD, EXPIRED, CANCELLED]
    transitions:
      - from: QUOTED
        to: PAID
        trigger: "POST /verification-requests/{id}/pay"
        actor: Requester | Learner
        preconditions:
          - "request.status == QUOTED (if EXPIRED -> ERR_QUOTE_EXPIRED)"
          - "now < quote_expires_at"
          - "requester.credit_balance_cents >= fee_cents (else ERR_INSUFFICIENT_CREDIT); Learner transcript fee is 0 and always passes"
        side_effects: ["requester.credit_balance_cents -= fee_cents; paid_at := now"]
      - from: QUOTED
        to: EXPIRED
        trigger: "system: clock advance reaches quote_expires_at"
        actor: system
        preconditions: ["now >= quote_expires_at"]
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "system: institution suspension cascade"
        actor: system
        preconditions: ["target institution SUSPENDED"]
        side_effects: []
      - from: PAID
        to: CANCELLED
        trigger: "system: institution suspension cascade"
        actor: system
        preconditions: ["target institution SUSPENDED"]
        side_effects: ["refund_cents := fee_cents; requester.credit_balance_cents += refund_cents"]
      - from: PAID
        to: RELEASED
        trigger: "POST /verification-requests/{id}/fulfill"
        actor: ClearinghouseOps
        preconditions:
          - "request.status == PAID"
          - "privacy gate passes: no active FULL_BLOCK (except Learner TRANSCRIPT self-order); DIRECTORY_BLOCK blocks DEGREE always and ENROLLMENT unless consent_artifact == true"
          - "record gate: DEGREE requires a SEALED DegreeRecord for student at institution; ENROLLMENT requires >= 1 ACCEPTED non-SUPERSEDED entry for student at institution; TRANSCRIPT requires either"
        side_effects:
          - "released_at := now; result_status := VERIFIED"
          - "ENROLLMENT: enrollment_status_at_release recomputed as-of now (as_of_report variant)"
          - "TRANSCRIPT: artifact_expires_at := released_at + ARTIFACT_TTL_HOURS(72)"
      - from: PAID
        to: BLOCKED_PRIVACY
        trigger: "POST /verification-requests/{id}/fulfill with privacy gate failing"
        actor: ClearinghouseOps
        preconditions: ["request.status == PAID", "privacy gate fails"]
        side_effects: ["refund_cents := fee_cents; requester.credit_balance_cents += refund_cents (no-op for Learner fee 0)"]
      - from: PAID
        to: NO_RECORD
        trigger: "POST /verification-requests/{id}/fulfill with record gate failing"
        actor: ClearinghouseOps
        preconditions: ["request.status == PAID", "privacy gate passes", "record gate fails"]
        side_effects: ["refund_cents := fee_cents; requester.credit_balance_cents += refund_cents (no-op for Learner fee 0)"]

  - entity: ServicerNotification
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, SUPERSEDED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "system: any clock advance dispatches queued notifications"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /servicer-notifications/{id}/acknowledge"
        actor: Servicer
        preconditions: ["notification.status == SENT", "X-User-ID == notification.servicer_ref (else ERR_UNAUTHORIZED)"]
        side_effects: ["student.deferment_standing := this notification.notification_type"]
      - from: QUEUED
        to: SUPERSEDED
        trigger: "system: a newer determination for the same entry (correction applied or file superseded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: SUPERSEDED
        trigger: "system: a newer determination for the same entry"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ResearchDataset
    initial_state: REQUESTED
    terminal_states: []   # GENERATED is a stable non-terminal end state; no further transitions declared
    transitions:
      - from: REQUESTED
        to: GENERATED
        trigger: "POST /research-datasets/{id}/generate"
        actor: ClearinghouseOps
        preconditions:
          - "dataset.status == REQUESTED"
          - "cohort_size >= K_ANONYMITY_MIN(10) after RESEARCH_OPT_OUT exclusion (else ERR_COHORT_TOO_SMALL)"
        side_effects: ["compute cohort_size, completer_count, adjusted_cohort_size, completion_rate_census, completion_rate_adjusted; generated_at := now"]

# =============================================================================
# §1.2.1 Concurrency Rules (true create-with-supersede races only; OCC on parent)
# =============================================================================
concurrency_rules:
  - rule_id: directive-create-stale-student
    parent_entity: StudentRecord
    write_endpoint: "POST /students/{id}/privacy-directives"
    occ_field: "expected_student_version"
    description: |
      Creating a PrivacyDirective against a StudentRecord whose version has
      advanced since the client last observed it is rejected. A same-type create
      legitimately supersedes the prior ACTIVE directive under the privacy rules,
      so the client must present the student version it based the decision on;
      a stale version means another write (directive create, standing update)
      landed in between.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: file-upload-stale-period
    parent_entity: ReportingPeriod
    write_endpoint: "POST /enrollment-files"
    occ_field: "expected_reporting_period_version"
    description: |
      Uploading an EnrollmentFile against a ReportingPeriod whose version has
      advanced since the client last observed it is rejected. An upload
      legitimately supersedes any prior uncertified file for the period and
      bumps the period's upload_count (hence version), so a stale version means
      the client's view of the period is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: enrollment_status_determination
    trigger: "at file upload (as-of upload date), recomputed at certification (as-of certified_at) and at correction apply (as-of decision date); census variant recomputed at the same moments"
    algorithm: threshold
    formula: |
      census_date = entry.term_start + CENSUS_OFFSET_DAYS
      # as_of_report variant (stored in entry.status_code), as-of date D:
      status_code(D):
        if entry.withdrawal_date is not null AND entry.withdrawal_date <= D: WITHDRAWN
        else: credit_band(entry)
      # as_of_census variant (stored in entry.census_status_code):
      census_status_code:
        if entry.withdrawal_date is not null AND entry.withdrawal_date <= census_date: WITHDRAWN
        else: credit_band(entry)
      credit_band(entry):   # nested conditional on career_level — >= comparisons
        if career_level == UNDERGRAD:
          FULL_TIME if credit_hours >= FT_UG; HALF_TIME if >= HT_UG; else LESS_THAN_HALF_TIME
        if career_level == GRADUATE:
          FULL_TIME if credit_hours >= FT_GR; HALF_TIME if >= HT_GR; else LESS_THAN_HALF_TIME
    input_set: "a single ACCEPTED EnrollmentEntry; REJECTED rows keep NONE"
    constants:
      FT_UG: 12.0
      HT_UG: 6.0
      FT_GR: 9.0
      HT_GR: 4.5
      CENSUS_OFFSET_DAYS: 14
      MAX_CREDIT_HOURS: 30
    precision: "credit_hours compared exactly as given (number, 2dp allowed)"
    variants:
      - name: as_of_report
        when: "servicer notifications, ENROLLMENT fulfillment, stored status_code"
        difference: "withdrawal counts once withdrawal_date <= as-of date D (certification/decision/fulfill date)"
      - name: as_of_census
        when: "research cohort adjusted denominator, stored census_status_code"
        difference: "withdrawal counts only when withdrawal_date <= census_date; a student withdrawn after census keeps the credit-based band"

  - name: deferment_determination
    trigger: "evaluated whenever status_code is computed (upload, certify, correction apply), as-of the same date D"
    algorithm: threshold
    formula: |
      if status_code IN {FULL_TIME, HALF_TIME}: DEFERMENT_ELIGIBLE
      elif status_code == LESS_THAN_HALF_TIME: DEFERMENT_INELIGIBLE
      elif status_code == WITHDRAWN:
        grace_end = withdrawal_date + WITHDRAWAL_GRACE_DAYS
        if D < grace_end: WITHDRAWN_GRACE (grace_end_date := grace_end)
        else: REPAYMENT_DUE
    input_set: "a single ACCEPTED EnrollmentEntry with computed status_code"
    constants:
      WITHDRAWAL_GRACE_DAYS: 180
    precision: "date arithmetic at day granularity; comparison is strict <"

  - name: verification_fee_quote
    trigger: "at VerificationRequest creation (quote pinned for the life of the request)"
    algorithm: tiered_pricing
    formula: |
      base = DEGREE_BASE_FEE_CENTS if product_type == DEGREE
             else ENROLLMENT_BASE_FEE_CENTS if product_type == ENROLLMENT
             else TRANSCRIPT_FEE_CENTS
      tier = requester_volume_tier(requester)          # STANDARD | PREFERRED
      discount_bps = PREFERRED_DISCOUNT_BPS if tier == PREFERRED else 0
      # PINNED EVALUATION ORDER (rounding per component, then sum):
      discounted_base = round_half_up(base * (10000 - discount_bps) / 10000)     # step 1: round FIRST
      rush_component  = rush ? round_half_up(discounted_base * RUSH_SURCHARGE_BPS / 10000) : 0   # step 2: rush on the ROUNDED discounted base
      fee_cents = discounted_base + rush_component                                 # step 3: sum of rounded components
      # Alternative orderings (sum-then-round, rush on unrounded base) yield different cents and are WRONG.
      quote_expires_at = created_at + QUOTE_TTL_HOURS
    input_set: "the request being created + requester's tier"
    constants:
      DEGREE_BASE_FEE_CENTS: 2599
      ENROLLMENT_BASE_FEE_CENTS: 1599
      TRANSCRIPT_FEE_CENTS: 0
      RUSH_SURCHARGE_BPS: 3333
      PREFERRED_DISCOUNT_BPS: 2000
      QUOTE_TTL_HOURS: 48
      ARTIFACT_TTL_HOURS: 72
      MAX_ACTIVE_TRANSCRIPTS: 2
    precision: "integer cents; round_half_up at each pinned step"
    variants:
      - name: standard
        when: "rush == false"
        difference: "rush_component == 0"
      - name: rush
        when: "rush == true"
        difference: "rush_component computed on the rounded discounted base"

  - name: requester_volume_tier
    trigger: "evaluated inside verification_fee_quote at request creation"
    algorithm: threshold
    formula: |
      # Circular-looking dependency pinned: the request being quoted will itself
      # join the released set that defines the tier. Evaluation order is fixed:
      # count ONLY requests already RELEASED, strictly before this quote, excluding self.
      Q(current) = calendar quarter of current logical date (Q1: Jan-Mar, Q2: Apr-Jun, Q3: Jul-Sep, Q4: Oct-Dec)
      released_count = count of this requester's VerificationRequests with
                       status == RELEASED AND released_at in Q(current) AND released_at < now
      tier = PREFERRED if released_count >= VOLUME_TIER_THRESHOLD else STANDARD
    input_set: "requester's own RELEASED requests in the current calendar quarter"
    constants:
      VOLUME_TIER_THRESHOLD: 3
    precision: "exact count; >= comparison"

  - name: research_cohort_metrics
    trigger: "POST /research-datasets/{id}/generate"
    algorithm: aggregation
    formula: |
      entries = ACCEPTED, non-SUPERSEDED EnrollmentEntries with
                institution_id == scope_institution_id AND
                cohort_term_start <= entry.term_start <= cohort_term_end   (window boundaries INCLUSIVE)
      members = distinct entry.student_id where the student has NO active RESEARCH_OPT_OUT directive
                (status == ACTIVE AND effective_from <= now AND (effective_to IS NULL OR now < effective_to))
      cohort_size = |members|
      if cohort_size < K_ANONYMITY_MIN: reject with ERR_COHORT_TOO_SMALL
      completer_count = |members m| with a DegreeRecord at scope institution, status == SEALED,
                        conferred_on in [cohort_term_start, cohort_term_end + COMPLETION_LAG_DAYS] (inclusive)
      adjusted_cohort_size = cohort_size - |members whose latest entry's census_status_code == WITHDRAWN|
      completion_rate_census   = round4(completer_count / cohort_size)
      completion_rate_adjusted = round4(completer_count / adjusted_cohort_size)
      # Evaluation order pinned: opt-out exclusion -> k-anonymity gate -> completers ->
      # census-variant exclusion -> both rates. Numerator is identical in both variants.
    input_set: "entries of the scope institution in the cohort window; directives active at generate time"
    constants:
      K_ANONYMITY_MIN: 10
      COMPLETION_LAG_DAYS: 730
    precision: "rates to 4 decimal places, round_half_up"
    variants:
      - name: census_denominator
        when: "completion_rate_census"
        difference: "denominator is the full post-opt-out cohort"
      - name: adjusted_denominator
        when: "completion_rate_adjusted"
        difference: "denominator excludes census-WITHDRAWN members; numerator unchanged, so rates diverge"

  - name: compliance_standing
    trigger: "recomputed at every ReportingPeriod close and every file certification for the institution"
    algorithm: aggregation
    formula: |
      closed = institution's ReportingPeriods with status == CLOSED,
               latest STANDING_LOOKBACK_PERIODS(3) by submission_due_at DESC (tie-break: created_at ASC)
      outcomes = closed.period.outcome (each ON_TIME | LATE | DELINQUENT)
      if any DELINQUENT in outcomes: NON_COMPLIANT
      elif any LATE in outcomes: WATCH
      else: COMPLIANT        # including zero closed periods
      # A DELINQUENT period flips to LATE when a file for it is later certified (certified_at > due).
    input_set: "institution's CLOSED periods, at most 3 most recent"
    constants:
      GRACE_PERIOD_DAYS: 14
      STANDING_LOOKBACK_PERIODS: 3
    precision: "exact enum evaluation"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; entity-backed roles resolve to an existing entity of the backing type (InstitutionUser/Requester/StudentRecord)", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership/tenancy: registrar user's institution_id matches the target institution; Requester acts only on own requests (request.requester_id == X-User-ID); Learner acts only on own student record (path student id or body student_id == X-User-ID); Servicer's X-User-ID equals notification.servicer_ref", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "role-scoped endpoints" }
  - { priority: 4, category: auth, check: "Registrar tenancy: InstitutionUser.institution_id != institution being written -> cross-institution write rejected", error_id: ERR_CROSS_INSTITUTION_ACCESS, http_status: 403, applies_to: "POST /enrollment-files, POST /enrollment-files/{id}/certify, POST /correction-cases, POST /correction-cases/{id}/decision, POST /degree-records, POST /degree-records/{id}/seal, POST /degree-records/{id}/revoke" }
  - { priority: 5, category: auth, check: "Requester standing: VerificationRequest create requires requester.status == VETTED", error_id: ERR_REQUESTER_NOT_VETTED, http_status: 403, applies_to: "POST /verification-requests" }
  - { priority: 6, category: auth, check: "Requester purpose matrix: EMPLOYER may use purposes {EMPLOYMENT, INSURANCE}; BACKGROUND_SCREENER may use {EMPLOYMENT, BACKGROUND_SCREEN}; LOAN_DEFERMENT is not purchasable by either; TRANSCRIPT/SELF is Learner-only and DEGREE/ENROLLMENT are Requester-only", error_id: ERR_PURPOSE_NOT_PERMITTED, http_status: 422, applies_to: "POST /verification-requests" }
  - { priority: 7, category: existence, check: "Malformed payload: missing required fields, wrong types, invalid enum members, unparseable dates", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 8, category: existence, check: "Path and body references resolve, validated left-to-right (path ids first, then body ids)", error_id: ERR_INSTITUTION_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing an Institution" }
  - { priority: 9, category: existence, check: "referenced ReportingPeriod exists", error_id: ERR_PERIOD_NOT_FOUND, http_status: 404, applies_to: "POST /enrollment-files, POST /institutions/{id}/reporting-periods (parent), GET lists" }
  - { priority: 10, category: existence, check: "referenced StudentRecord exists", error_id: ERR_STUDENT_NOT_FOUND, http_status: 404, applies_to: "POST /verification-requests, POST /degree-records, POST /students/{id}/privacy-directives, GET /students/{id}*" }
  - { priority: 11, category: existence, check: "referenced EnrollmentFile exists", error_id: ERR_FILE_NOT_FOUND, http_status: 404, applies_to: "file sub-endpoints" }
  - { priority: 12, category: existence, check: "referenced EnrollmentEntry exists", error_id: ERR_ENTRY_NOT_FOUND, http_status: 404, applies_to: "POST /correction-cases, GET /enrollment-entries/{id}" }
  - { priority: 13, category: existence, check: "referenced CorrectionCase exists", error_id: ERR_CASE_NOT_FOUND, http_status: 404, applies_to: "POST /correction-cases/{id}/decision, GET /correction-cases/{id}" }
  - { priority: 14, category: existence, check: "referenced DegreeRecord exists", error_id: ERR_DEGREE_NOT_FOUND, http_status: 404, applies_to: "degree sub-endpoints" }
  - { priority: 15, category: existence, check: "referenced Requester exists", error_id: ERR_REQUESTER_NOT_FOUND, http_status: 404, applies_to: "requester sub-endpoints" }
  - { priority: 16, category: existence, check: "referenced VerificationRequest exists", error_id: ERR_REQUEST_NOT_FOUND, http_status: 404, applies_to: "verification sub-endpoints" }
  - { priority: 17, category: existence, check: "referenced ServicerNotification exists", error_id: ERR_NOTIFICATION_NOT_FOUND, http_status: 404, applies_to: "notification sub-endpoints" }
  - { priority: 18, category: existence, check: "referenced ResearchDataset exists", error_id: ERR_DATASET_NOT_FOUND, http_status: 404, applies_to: "dataset sub-endpoints" }
  - { priority: 19, category: state, check: "State-machine precondition of the triggered transition (from-state match; terminal-state lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 20, category: state, check: "OCC: expected_student_version / expected_reporting_period_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /students/{id}/privacy-directives, POST /enrollment-files" }
  - { priority: 21, category: state, check: "Institution must be ACTIVE for certify / seal / new verification requests", error_id: ERR_INSTITUTION_SUSPENDED, http_status: 409, applies_to: "POST /enrollment-files/{id}/certify, POST /degree-records/{id}/seal, POST /verification-requests, POST /enrollment-files" }
  - { priority: 22, category: state, check: "Correction target entry must be ACCEPTED; SUPERSEDED entries rejected distinctly", error_id: ERR_ENTRY_SUPERSEDED, http_status: 409, applies_to: "POST /correction-cases" }
  - { priority: 23, category: state, check: "Pay on an EXPIRED quote reports the specific cause", error_id: ERR_QUOTE_EXPIRED, http_status: 409, applies_to: "POST /verification-requests/{id}/pay" }
  - { priority: 24, category: state, check: "File upload / certify / degree seal / reinstate require an ACTIVE agreement covering now", error_id: ERR_AGREEMENT_LAPSED, http_status: 409, applies_to: "POST /enrollment-files, POST /enrollment-files/{id}/certify, POST /degree-records/{id}/seal, POST /institutions/{id}/reinstate" }
  - { priority: 25, category: state, check: "File upload requires the reporting period not to be SCHEDULED (OPEN, GRACE and CLOSED accept uploads; CLOSED is the remedy path)", error_id: ERR_PERIOD_NOT_OPEN, http_status: 409, applies_to: "POST /enrollment-files" }
  - { priority: 26, category: business_safety, check: "Privacy gate at create: active FULL_BLOCK blocks DEGREE/ENROLLMENT creation (Learner TRANSCRIPT self-order exempt); active DIRECTORY_BLOCK blocks DEGREE creation", error_id: ERR_PRIVACY_BLOCKED, http_status: 422, applies_to: "POST /verification-requests" }
  - { priority: 27, category: business_safety, check: "Consent gate: ENROLLMENT product requires consent_artifact == true when purpose is EMPLOYMENT or BACKGROUND_SCREEN (even without a block); DIRECTORY_BLOCK + ENROLLMENT requires consent_artifact == true; LOAN_DEFERMENT and INSURANCE enrollment checks are consent-exempt; DEGREE without a block is consent-exempt", error_id: ERR_CONSENT_REQUIRED, http_status: 422, applies_to: "POST /verification-requests" }
  - { priority: 28, category: business_safety, check: "Degree sealing requires institution.compliance_standing != NON_COMPLIANT", error_id: ERR_INSTITUTION_NON_COMPLIANT, http_status: 422, applies_to: "POST /degree-records/{id}/seal" }
  - { priority: 29, category: business_safety, check: "Research cohort after opt-out exclusion must satisfy k-anonymity (>= K_ANONYMITY_MIN)", error_id: ERR_COHORT_TOO_SMALL, http_status: 422, applies_to: "POST /research-datasets/{id}/generate" }
  - { priority: 30, category: business_constraint, check: "Agreement half-open windows [effective_from, effective_to) for one institution must not overlap any SCHEDULED/ACTIVE agreement; adjacency (from == other's to) is allowed", error_id: ERR_AGREEMENT_OVERLAP, http_status: 409, applies_to: "POST /institutions/{id}/agreements" }
  - { priority: 31, category: business_constraint, check: "Period occupancy is the CLOSED interval [term_start, submission_due_at]: a new period's term_start must be strictly after every existing period's submission_due_at for the institution (same-day start collides)", error_id: ERR_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /institutions/{id}/reporting-periods" }
  - { priority: 32, category: business_constraint, check: "At most one FILED CorrectionCase per entry", error_id: ERR_OPEN_CORRECTION_EXISTS, http_status: 409, applies_to: "POST /correction-cases" }
  - { priority: 33, category: business_constraint, check: "No duplicate in-flight (QUOTED or PAID) request with the same (requester_id, student_id, institution_id, product_type, purpose); applies to DEGREE and ENROLLMENT only — TRANSCRIPT self-orders are repeat-orderable and gated by the max-active rule instead", error_id: ERR_DUPLICATE_REQUEST, http_status: 409, applies_to: "POST /verification-requests" }
  - { priority: 34, category: business_constraint, check: "Segregation of duties: correction decision requires decided_by != filed_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /correction-cases/{id}/decision" }
  - { priority: 35, category: business_constraint, check: "Certification requires rejected_rows == 0", error_id: ERR_UNRESOLVED_ROWS, http_status: 409, applies_to: "POST /enrollment-files/{id}/certify" }
  - { priority: 36, category: business_constraint, check: "A Learner may hold at most MAX_ACTIVE_TRANSCRIPTS(2) TRANSCRIPT requests in QUOTED or PAID", error_id: ERR_MAX_ACTIVE_TRANSCRIPTS, http_status: 409, applies_to: "POST /verification-requests" }
  - { priority: 37, category: business_temporal, check: "Directive window: effective_to null or strictly after effective_from", error_id: ERR_DIRECTIVE_WINDOW_INVALID, http_status: 422, applies_to: "POST /students/{id}/privacy-directives" }
  - { priority: 38, category: business_temporal, check: "Field date ordering: period term_end > term_start, submission_opens_at >= term_start and < submission_due_at; agreement effective_to > effective_from; dataset cohort_term_end >= cohort_term_start; clock moves strictly forward", error_id: ERR_VALIDATION, http_status: 400, applies_to: "creation endpoints, POST /_clock/set_current_utc" }
  - { priority: 39, category: business_fiscal, check: "Pay requires requester.credit_balance_cents >= fee_cents", error_id: ERR_INSUFFICIENT_CREDIT, http_status: 402, applies_to: "POST /verification-requests/{id}/pay" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/institutions", description: "Create institution with its registrar users inline (users: array of {email, role}, order preserved in the response's embedded users array)", roles: [ClearinghouseOps], code: 201, input: [name, ope_id, users], output: Institution, side_effects: ["creates InstitutionUser records (status ACTIVE)"] }
  - { method: GET, path: "/institutions/{id}", description: "Read one institution", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: [], output: Institution, side_effects: [] }
  - { method: POST, path: "/institutions/{id}/suspend", description: "Ops-suspend an ACTIVE institution; cancels in-flight QUOTED/PAID verification requests (PAID refunded)", roles: [ClearinghouseOps], code: 200, input: [], output: Institution, side_effects: ["status SUSPENDED, suspension_reason OPS, version += 1, request-cancellation cascade"] }
  - { method: POST, path: "/institutions/{id}/reinstate", description: "Reinstate a SUSPENDED institution; requires an ACTIVE agreement covering now", roles: [ClearinghouseOps], code: 200, input: [], output: Institution, side_effects: ["status ACTIVE, suspension_reason NONE"] }
  - { method: POST, path: "/institutions/{id}/agreements", description: "Create a participation agreement (half-open window, overlap-checked); created ACTIVE or SCHEDULED per current time", roles: [ClearinghouseOps], code: 201, input: [effective_from, effective_to], output: ParticipationAgreement, side_effects: ["if created ACTIVE while institution SUSPENDED with AGREEMENT_LAPSE -> institution reinstated"] }
  - { method: GET, path: "/institutions/{id}/agreements", description: "List agreements of an institution, created_at ASC", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: ["limit?", "offset?"], output: "ParticipationAgreement[]", side_effects: [] }
  - { method: POST, path: "/institutions/{id}/reporting-periods", description: "Create a reporting period (closed-occupancy overlap rule vs other periods of the institution)", roles: [ClearinghouseOps], code: 201, input: [term_label, term_start, term_end, submission_opens_at, submission_due_at], output: ReportingPeriod, side_effects: ["initial status computed from now"] }
  - { method: GET, path: "/institutions/{id}/reporting-periods", description: "List reporting periods of an institution, submission_due_at ASC then created_at ASC", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: ["limit?", "offset?"], output: "ReportingPeriod[]", side_effects: [] }
  - { method: GET, path: "/institutions/{id}/users", description: "List registrar users of an institution, created_at ASC", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: ["limit?", "offset?"], output: "InstitutionUser[]", side_effects: [] }
  - { method: GET, path: "/institutions/{id}/research-datasets", description: "List datasets scoped to an institution; ResearchAnalyst callers see only datasets they created", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier, ResearchAnalyst], code: 200, input: ["limit?", "offset?"], output: "ResearchDataset[]", side_effects: [] }

  - { method: POST, path: "/enrollment-files", description: "Upload an enrollment file with rows inline; rows screened deterministically in row order (first occurrence of a student_ref wins); students resolved by (lower(trim(full_name)), date_of_birth) else created; supersedes any prior UPLOADED (uncertified) file for the period", roles: [RegistrarSubmitter], code: 201, input: [institution_id, reporting_period_id, expected_reporting_period_version, rows], output: EnrollmentFile, side_effects: ["creates EnrollmentEntries (ACCEPTED/REJECTED), resolves/creates StudentRecords, computes row_count/accepted_rows/rejected_rows, computes status fields as-of upload date, prior UPLOADED file -> SUPERSEDED, reporting_period.upload_count += 1 (version += 1)"] }
  - { method: GET, path: "/enrollment-files/{id}", description: "Read one enrollment file", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: [], output: EnrollmentFile, side_effects: [] }
  - { method: GET, path: "/enrollment-files", description: "List enrollment files with filters, created_at ASC", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: ["institution_id?", "reporting_period_id?", "submitted_by_user_id?", "status?", "limit?", "offset?"], output: "EnrollmentFile[]", side_effects: [] }
  - { method: POST, path: "/enrollment-files/{id}/certify", description: "Certify an UPLOADED file (registrar certifier of the same institution); generates servicer notifications; may supersede a previously CERTIFIED file for the period", roles: [RegistrarCertifier], code: 200, input: [], output: EnrollmentFile, side_effects: ["certified_at, late_submission, entry status recompute, notification generation, supersession cascade, period outcome, institution standing recompute"] }
  - { method: GET, path: "/enrollment-entries/{id}", description: "Read one enrollment entry", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: [], output: EnrollmentEntry, side_effects: [] }
  - { method: GET, path: "/enrollment-entries", description: "List enrollment entries with filters, row_index ASC within file (file order), then created_at ASC", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: ["file_id?", "student_id?", "institution_id?", "entry_status?", "limit?", "offset?"], output: "EnrollmentEntry[]", side_effects: [] }

  - { method: POST, path: "/correction-cases", description: "File a correction against an ACCEPTED entry of a CERTIFIED or AMENDMENT_PENDING file (submitter or certifier of the same institution)", roles: [RegistrarSubmitter, RegistrarCertifier], code: 201, input: [enrollment_entry_id, "corrected_credit_hours?", "corrected_withdrawal_date?", "clear_withdrawal_date?", reason_code], output: CorrectionCase, side_effects: ["file CERTIFIED -> AMENDMENT_PENDING, open_correction_count += 1"] }
  - { method: GET, path: "/correction-cases/{id}", description: "Read one correction case", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: [], output: CorrectionCase, side_effects: [] }
  - { method: GET, path: "/correction-cases", description: "List correction cases with filters, created_at ASC", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: ["enrollment_entry_id?", "filed_by_user_id?", "status?", "limit?", "offset?"], output: "CorrectionCase[]", side_effects: [] }
  - { method: POST, path: "/correction-cases/{id}/decision", description: "Decide a FILED case (certifier of the same institution, != filer); APPROVED applies the correction with the full supersede/notification cascade", roles: [RegistrarCertifier], code: 200, input: [outcome], output: CorrectionCase, side_effects: ["on APPROVED: entry supersede + replacement + notification cascade + file recount; on DENIED: file recount only"] }

  - { method: POST, path: "/degree-records", description: "Report a conferred degree/certificate", roles: [RegistrarSubmitter], code: 201, input: [institution_id, student_id, degree_level, degree_title, conferred_on], output: DegreeRecord, side_effects: ["status REPORTED, created_by_user_id := X-User-ID"] }
  - { method: GET, path: "/degree-records/{id}", description: "Read one degree record", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: [], output: DegreeRecord, side_effects: [] }
  - { method: GET, path: "/degree-records", description: "List degree records with filters, conferred_on ASC then created_at ASC", roles: [ClearinghouseOps, RegistrarSubmitter, RegistrarCertifier], code: 200, input: ["student_id?", "institution_id?", "status?", "limit?", "offset?"], output: "DegreeRecord[]", side_effects: [] }
  - { method: POST, path: "/degree-records/{id}/seal", description: "Seal a REPORTED degree (certifier, same institution; requires ACTIVE institution, ACTIVE agreement, standing != NON_COMPLIANT)", roles: [RegistrarCertifier], code: 200, input: [], output: DegreeRecord, side_effects: ["sealed_at := now"] }
  - { method: POST, path: "/degree-records/{id}/revoke", description: "Revoke a SEALED degree (terminal)", roles: [RegistrarCertifier], code: 200, input: [], output: DegreeRecord, side_effects: [] }

  - { method: POST, path: "/requesters", description: "Create a requester account (PENDING_VETTING) with optional prepaid credit", roles: [ClearinghouseOps], code: 201, input: [org_name, requester_kind, "initial_credit_cents?"], output: Requester, side_effects: ["credit_balance_cents := initial_credit_cents"] }
  - { method: GET, path: "/requesters/{id}", description: "Read one requester (Requester reads own account only)", roles: [ClearinghouseOps, Requester], code: 200, input: [], output: Requester, side_effects: [] }
  - { method: POST, path: "/requesters/{id}/vet", description: "Vet decision: VET from PENDING_VETTING or SUSPENDED -> VETTED; DENY from PENDING_VETTING -> DENIED", roles: [ClearinghouseOps], code: 200, input: [outcome], output: Requester, side_effects: ["vetted_at := now on VET"] }
  - { method: POST, path: "/requesters/{id}/suspend", description: "Suspend a VETTED requester", roles: [ClearinghouseOps], code: 200, input: [], output: Requester, side_effects: [] }

  - { method: POST, path: "/verification-requests", description: "Create a verification request (Requester for DEGREE/ENROLLMENT with requester_id == X-User-ID; Learner for TRANSCRIPT self-order with student_id == X-User-ID and requester_id absent); computes pinned fee quote, tier, and quote_expires_at", roles: [Requester, Learner], code: 201, input: ["requester_id?", student_id, institution_id, product_type, purpose, "consent_artifact?", "rush?"], output: VerificationRequest, side_effects: ["fee_cents, volume_tier_at_quote, quote_expires_at computed per verification_fee_quote"] }
  - { method: GET, path: "/verification-requests/{id}", description: "Read one verification request (Requester only own; Learner only own)", roles: [ClearinghouseOps, Requester, Learner], code: 200, input: [], output: VerificationRequest, side_effects: [] }
  - { method: GET, path: "/verification-requests", description: "List verification requests with filters, created_at ASC (Requester scoped to own; Learner scoped to own)", roles: [ClearinghouseOps, Requester, Learner], code: 200, input: ["requester_id?", "student_id?", "institution_id?", "status?", "limit?", "offset?"], output: "VerificationRequest[]", side_effects: [] }
  - { method: POST, path: "/verification-requests/{id}/pay", description: "Pay a QUOTED request from the requester's prepaid balance (Learner transcript fee is 0)", roles: [Requester, Learner], code: 200, input: [], output: VerificationRequest, side_effects: ["balance -= fee_cents, paid_at := now"] }
  - { method: POST, path: "/verification-requests/{id}/fulfill", description: "Fulfills a PAID request: privacy gate, then record gate; RELEASED / BLOCKED_PRIVACY / NO_RECORD with refunds on the two failure branches", roles: [ClearinghouseOps], code: 200, input: [], output: VerificationRequest, side_effects: ["release fields or refund_cents + balance credit"] }

  - { method: POST, path: "/students/{id}/privacy-directives", description: "Place a privacy directive on own record (Learner) or as ops; OCC on student version; a same-type ACTIVE directive is superseded", roles: [Learner, ClearinghouseOps], code: 201, input: [directive_type, effective_from, "effective_to?", expected_student_version], output: PrivacyDirective, side_effects: ["supersede same-type ACTIVE directive; student.version += 1"] }
  - { method: GET, path: "/students/{id}", description: "Read one student record", roles: [ClearinghouseOps, Learner], code: 200, input: [], output: StudentRecord, side_effects: [] }
  - { method: GET, path: "/students/{id}/privacy-directives", description: "List a student's privacy directives, created_at ASC", roles: [ClearinghouseOps, Learner], code: 200, input: ["limit?", "offset?"], output: "PrivacyDirective[]", side_effects: [] }

  - { method: GET, path: "/servicer-notifications/{id}", description: "Read one servicer notification (Servicer only when servicer_ref == X-User-ID)", roles: [ClearinghouseOps, Servicer], code: 200, input: [], output: ServicerNotification, side_effects: [] }
  - { method: GET, path: "/servicer-notifications", description: "List servicer notifications with filters, created_at ASC (Servicer scoped to own servicer_ref)", roles: [ClearinghouseOps, Servicer], code: 200, input: ["servicer_ref?", "student_id?", "enrollment_entry_id?", "status?", "limit?", "offset?"], output: "ServicerNotification[]", side_effects: [] }
  - { method: POST, path: "/servicer-notifications/{id}/acknowledge", description: "Servicer acknowledges a SENT notification; updates student.deferment_standing", roles: [Servicer], code: 200, input: [], output: ServicerNotification, side_effects: ["student.deferment_standing := notification_type"] }

  - { method: POST, path: "/research-datasets", description: "Request an aggregate outcome dataset for an institution's cohort window", roles: [ResearchAnalyst], code: 201, input: [scope_institution_id, cohort_term_start, cohort_term_end], output: ResearchDataset, side_effects: ["created_by_analyst_id := X-User-ID"] }
  - { method: POST, path: "/research-datasets/{id}/generate", description: "Generate the dataset: opt-out exclusion, k-anonymity gate, completer count, both rate variants", roles: [ClearinghouseOps], code: 200, input: [], output: ResearchDataset, side_effects: ["metrics computed, generated_at := now"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Advance the logical clock (strictly forward; to_iso8601 > current). The server default before any call is exactly 2026-09-01T00:00:00Z (never wall-clock). Processing order per advance: (1) agreements SCHEDULED->ACTIVE / ACTIVE->EXPIRED with institution cascade, (2) institution-suspension request cancellations (created_at ASC), (3) periods advance by submission_due_at ASC then created_at ASC with outcomes + standing recompute, (4) QUOTED requests past quote_expires_at -> EXPIRED (created_at ASC), (5) notifications QUEUED->SENT (created_at ASC), (6) privacy directives -> EXPIRED (created_at ASC)", roles: [ClearinghouseOps], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["all time-driven transitions in the pinned order"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role/X-User-ID, or the entity-backed identity does not resolve" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not allowed on endpoint, or ownership check failed (other requester's request, other student's record, other servicer's notification)" }
  - { id: ERR_CROSS_INSTITUTION_ACCESS, http: 403, condition: "Registrar user's institution differs from the institution being written" }
  - { id: ERR_REQUESTER_NOT_VETTED, http: 403, condition: "VerificationRequest create while requester.status != VETTED" }
  - { id: ERR_PURPOSE_NOT_PERMITTED, http: 422, condition: "Purpose not allowed for requester_kind, or product/role mismatch (TRANSCRIPT is Learner-only; DEGREE/ENROLLMENT Requester-only)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum/type/date, or field-ordering constraint violated" }
  - { id: ERR_INSTITUTION_NOT_FOUND, http: 404, condition: "Referenced institution does not exist" }
  - { id: ERR_PERIOD_NOT_FOUND, http: 404, condition: "Referenced reporting period does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Referenced student record does not exist" }
  - { id: ERR_FILE_NOT_FOUND, http: 404, condition: "Referenced enrollment file does not exist" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "Referenced enrollment entry does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "Referenced correction case does not exist" }
  - { id: ERR_DEGREE_NOT_FOUND, http: 404, condition: "Referenced degree record does not exist" }
  - { id: ERR_REQUESTER_NOT_FOUND, http: 404, condition: "Referenced requester does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "Referenced verification request does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Referenced servicer notification does not exist" }
  - { id: ERR_DATASET_NOT_FOUND, http: 404, condition: "Referenced research dataset does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine precondition violated (wrong from-state, terminal lockdown, idempotent re-fire)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INSTITUTION_SUSPENDED, http: 409, condition: "Operation requires an ACTIVE institution" }
  - { id: ERR_ENTRY_SUPERSEDED, http: 409, condition: "Correction filed against a SUPERSEDED entry" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Pay attempted on an EXPIRED quote" }
  - { id: ERR_AGREEMENT_LAPSED, http: 409, condition: "Operation requires an ACTIVE participation agreement covering now" }
  - { id: ERR_PERIOD_NOT_OPEN, http: 409, condition: "File upload attempted while the reporting period is SCHEDULED" }
  - { id: ERR_PRIVACY_BLOCKED, http: 422, condition: "Active FULL_BLOCK (non-self products) or DIRECTORY_BLOCK (DEGREE product) blocks request creation" }
  - { id: ERR_CONSENT_REQUIRED, http: 422, condition: "Consent artifact required for this product/purpose/directive combination" }
  - { id: ERR_INSTITUTION_NON_COMPLIANT, http: 422, condition: "Degree sealing blocked while compliance_standing == NON_COMPLIANT" }
  - { id: ERR_COHORT_TOO_SMALL, http: 422, condition: "Research cohort after opt-out exclusion below K_ANONYMITY_MIN(10)" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "Agreement window overlaps a SCHEDULED/ACTIVE agreement of the same institution (half-open; adjacency allowed)" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "New period's term_start not strictly after an existing period's submission_due_at (closed occupancy)" }
  - { id: ERR_OPEN_CORRECTION_EXISTS, http: 409, condition: "A FILED correction case already exists for the entry" }
  - { id: ERR_DUPLICATE_REQUEST, http: 409, condition: "An in-flight (QUOTED/PAID) DEGREE/ENROLLMENT request with the same (requester, student, institution, product, purpose) exists; TRANSCRIPT exempt" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Correction decision attempted by the same user who filed the case" }
  - { id: ERR_UNRESOLVED_ROWS, http: 409, condition: "Certification attempted with rejected_rows > 0" }
  - { id: ERR_MAX_ACTIVE_TRANSCRIPTS, http: 409, condition: "Learner already holds MAX_ACTIVE_TRANSCRIPTS(2) active TRANSCRIPT requests" }
  - { id: ERR_DIRECTIVE_WINDOW_INVALID, http: 422, condition: "effective_to present and not strictly after effective_from" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "Requester balance below fee_cents at pay time" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClearinghouseOps
    description: "Clearinghouse operations staff; administers institutions, agreements, calendar, vetting, fulfillment, dataset generation, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /institutions, /institutions/{id}/suspend, /institutions/{id}/reinstate, /institutions/{id}/agreements, /institutions/{id}/reporting-periods"
      - "POST /requesters, /requesters/{id}/vet, /requesters/{id}/suspend"
      - "POST /verification-requests/{id}/fulfill"
      - "POST /research-datasets/{id}/generate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /students/{id}/privacy-directives (ops-side directive placement)"
  - name: RegistrarSubmitter
    description: "Registrar office submitter at an institution; uploads enrollment files, files corrections, reports degrees"
    identity: "entity_backed:InstitutionUser"
    exclusive_operations:
      - "POST /enrollment-files"
      - "POST /degree-records"
    shared_operations:
      - "POST /correction-cases (shared with RegistrarCertifier)"
      - "GET endpoints for own institution's resources"
  - name: RegistrarCertifier
    description: "Registrar office certifier; certifies files, decides corrections (never own filings), seals/revokes degrees"
    identity: "entity_backed:InstitutionUser"
    exclusive_operations:
      - "POST /enrollment-files/{id}/certify"
      - "POST /correction-cases/{id}/decision"
      - "POST /degree-records/{id}/seal, /degree-records/{id}/revoke"
    shared_operations:
      - "POST /correction-cases (shared with RegistrarSubmitter)"
      - "GET endpoints for own institution's resources"
  - name: Requester
    description: "Vetted employer or background screener purchasing degree/enrollment verifications against a prepaid balance"
    identity: "entity_backed:Requester"
    exclusive_operations:
      - "POST /verification-requests (DEGREE/ENROLLMENT products, requester_id == X-User-ID)"
      - "POST /verification-requests/{id}/pay (own requests)"
    shared_operations:
      - "GET /verification-requests* (own only), GET /requesters/{id} (own account)"
  - name: Learner
    description: "Student self-service: privacy directives and transcript self-orders on own record"
    identity: "entity_backed:StudentRecord"
    exclusive_operations:
      - "POST /verification-requests (TRANSCRIPT product, purpose SELF, student_id == X-User-ID, requester_id absent)"
      - "POST /verification-requests/{id}/pay (own transcript requests)"
    shared_operations:
      - "POST /students/{id}/privacy-directives (own record only, shared with ClearinghouseOps)"
      - "GET /students/{id}* (own record), GET /verification-requests* (own only)"
  - name: Servicer
    description: "Loan servicer receiving the deferment/benefit feed; X-User-ID equals the servicer_ref code carried on enrollment rows"
    identity: opaque
    exclusive_operations:
      - "POST /servicer-notifications/{id}/acknowledge (servicer_ref == X-User-ID)"
    shared_operations:
      - "GET /servicer-notifications* (own servicer_ref only)"
  - name: ResearchAnalyst
    description: "External researcher requesting aggregate outcome datasets"
    identity: opaque
    exclusive_operations:
      - "POST /research-datasets"
    shared_operations:
      - "GET /institutions/{id}/research-datasets (own datasets only)"
