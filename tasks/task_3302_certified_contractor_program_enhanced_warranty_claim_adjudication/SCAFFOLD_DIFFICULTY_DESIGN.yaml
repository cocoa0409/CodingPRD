            - { call: "POST /program/complaints/${cmp_new}/substantiate", payload: {}, as: ProgramAdmin }
          trigger:
            - call: "POST /program/lead-assignments"
              payload: { distributor_id: "${dist_id}", contractor_id: "${cp_id}", territory_code: "T1", required_tier: "BRONZE", start_date: "2026-10-15", end_date: "2026-12-01" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_CONTRACTOR_SUSPENDED (state priority 5 beats business_constraint priority 8 even though the window [2026-10-15, 2026-12-01) overlaps the existing ASSIGNED window)"

      - name: renew_insurance_expired_beats_credit_shortfall
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_INSURANCE_EXPIRED]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_constraint: a renewal
          where insurance expired (temporal, priority 7) AND creditable training is
          short (constraint, priority 8) must return ERR_INSURANCE_EXPIRED, not
          ERR_INSUFFICIENT_TRAINING_CREDITS.
        test_recipe:
          setup:
            - "BRONZE contractor with ACTIVE cert (verified 2026-09-01, valid_until 2028-09-01), 4 credits from a course with validity_months 24 completed 2026-09-01 (credits expire after 2028-09-01)"
            - "insurance_expiry patched down to 2028-06-01; clock at 2028-08-01 so credits are still short? No: credits valid through 2028-09-01, so at 2028-08-01 credits suffice. Use validity_months 12 instead: credits expire after 2027-09-01, so at 2028-08-01 credits are short AND insurance is expired"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Renew Co", license_number: "LIC-RN", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { crn_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "ShortCourse", credits: 4, validity_months: 12 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${crn_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${crn_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${crn_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin, captures: { cert_v: $.data.version } }
            - { call: "PATCH /program/contractors/${crn_id}/compliance", payload: { insurance_expiry: "2028-06-01" }, as: ProgramAdmin }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2028-08-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - call: "POST /program/certifications/${cert_id}/renew"
              payload: { expected_certification_version: "${cert_v}" }
              as: Contractor
              as_user_id: "${crn_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422 and error_id == ERR_INSURANCE_EXPIRED (business_temporal priority 7 beats business_constraint priority 8 even though credits also fall short: 0 creditable vs BRONZE minimum 4)"

  - rule_id: boundary_precision_check
    instances:
      - name: complaint_weighted_score_four_stays_active_five_suspends
        grounds:
          - calculations.complaint_pattern_score
          - state_machines.Contractor.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Boundary metric: weighted complaint score. Score 4 (single complaint aged
          10 months, weight 2, plus one aged 10 months... pinned: two complaints of
          weight 2) leaves the contractor ACTIVE; exactly 5 (weight 3 + weight 2)
          suspends. Threshold semantics are >= (5 triggers).
        test_recipe:
          setup:
            - "two contractors A and B, both BRONZE with ACTIVE certs"
            - "A: two complaints both filed 2026-09-10, substantiated at 2027-07-15 -> ages 308 days -> 10 months -> weights 2+2 = 4"
            - "B: complaint filed 2026-09-10 (weight 2 at eval) plus complaint filed 2027-06-01 (age 61 days -> 2 months -> weight 3), both substantiated at 2027-08-01 -> 5"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Bound A", license_number: "LIC-BA", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /program/contractors", payload: { legal_name: "Bound B", license_number: "LIC-BB", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cb_id: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${ca_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { a1: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${ca_id}", category: "COMMUNICATION" }, as: Claimant, captures: { a2: $.data.id } }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cb_id}", category: "WORKMANSHIP" }, as: Claimant, captures: { b1: $.data.id } }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/complaints", payload: { contractor_id: "${cb_id}", category: "PROPERTY_DAMAGE" }, as: Claimant, captures: { b2: $.data.id } }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2027-07-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/complaints/${a1}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/complaints/${a2}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/complaints/${b1}/substantiate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /program/complaints/${b2}/substantiate", payload: {}, as: ProgramAdmin }
            - { call: "GET /program/contractors/${ca_id}", payload: {}, as: ProgramAdmin, captures: { a_score: $.data.complaint_score_24mo, a_status: $.data.status } }
            - { call: "GET /program/contractors/${cb_id}", payload: {}, as: ProgramAdmin, captures: { b_score: $.data.complaint_score_24mo, b_status: $.data.status } }
          assert:
            - "Contractor A complaint_score_24mo == 4 and status == ACTIVE (4 < 5 does not trigger)"
            - "Contractor B complaint_score_24mo == 5 and status == SUSPENDED (>= boundary is inclusive)"

      - name: labor_coverage_day_729_covered_day_730_zero
        grounds:
          - calculations.labor_coverage_amount
          - entities.RemedyAllocation.fields.completed_years
        distinguishing_aspect: |
          Boundary metric: days since activation via floor(days/365). A BRONZE claim
          filed at 729 days (completed_years 1 < labor_years 2) is covered; at 730
