  - rule_id: boundary_precision_check
    instances:
      - name: permit_utilisation_exactly_ninety_percent_restricts_the_farm
        grounds:
          - calculations.farm_posture
          - calculations.permit_daily_throughput_used
          - state_machines.FuelFarm.OPEN_to_RESTRICTED
          - entities.EnvironmentalPermit.fields.max_daily_throughput_liters
        boundary_kind: "inclusive >= threshold on a derived ratio"
        distinguishing_aspect: |
          The permit cap is 33000.0 liters and the released receipt is engineered to net exactly 29700.00
          liters, which is exactly 0.90 * 33000.0. Because the posture comparison is >=, the farm must land on
          RESTRICTED at exactly 90.00 percent; a strict > implementation leaves it OPEN. The counterfactual is
          one hundredth of a liter away: a net of 29699.99 keeps the farm OPEN.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T06:00:00Z"
            - "farm SFO with an ACTIVE permit whose max_daily_throughput_liters is 33000.0"
            - "one truck TRK1 IN_SERVICE so in_service_asset_count > 0 and cannot itself restrict the farm"
            - "tank T1 opening_volume_liters 0.0 driven ON_TEST -> RELEASED"
            - "one PIPELINE receipt whose gauge delta is 29700.0 at 15.0 C with zero measured water, sampled and tested PASS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /fuel-farms"
              payload: { iata_code: "SFO", name: "SFO Fuel Consortium", hydrant_system_available: true, unpumpable_bottom_liters: 500.0 }
              as: ConsortiumAdmin
