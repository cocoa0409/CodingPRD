            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-07T17:00:00Z" }, as: StadiumAdmin }
          trigger:
            - { call: "POST /api/catering-orders", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", package_tier: STANDARD, guest_count: 8, lines: [ { item_code: "APP", description: "Sliders", quantity: 1, unit_price_cents: 1000 } ] }, as: AccountHolder, as_user_id: "${ac}", captures: { ok_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-07T17:00:01Z" }, as: StadiumAdmin }
            - { call: "POST /api/catering-orders", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", package_tier: STANDARD, guest_count: 8, lines: [ { item_code: "APP", description: "Sliders", quantity: 1, unit_price_cents: 1000 } ] }, as: AccountHolder, as_user_id: "${ac}", captures: { err: $.data.error_id } }
          assert:
            - "First order at exactly the cutoff instant succeeds (201, status PLACED)"
            - "Second order one second later fails: error_id == ERR_CATERING_CUTOFF_PASSED"

      - name: credential_capacity_nth_succeeds_nplus1_fails
        grounds:
          - validations[priority=17]
          - entities.Suite.fields.capacity_seats
        distinguishing_aspect: |
          Metric = active credential count on POST /api/credentials (different metric
          from the time-based cutoff and a different endpoint). With capacity_seats=2,
          credential #2 (count becomes exactly capacity) succeeds; #3 fails with
          ERR_CREDENTIAL_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Venue, SILVER suite cap 2, S1 PUBLISHED, E1 REGULAR, account ACTIVE with ACTIVE agreement on the suite"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "S-009", tier: SILVER, capacity_seats: 2, base_annual_fee_cents: 6000000, f_b_minimum_cents: 2000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 6000000, escalator_bp: 0, f_b_minimum_cents: 2000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
          trigger:
            - { call: "POST /api/credentials", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", guest_name: "Guest One", guest_email: "g1@x.example", credential_type: GUEST }, as: EventServicesManager, captures: { c1: $.data.id } }
            - { call: "POST /api/credentials", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", guest_name: "Guest Two", guest_email: "g2@x.example", credential_type: GUEST }, as: EventServicesManager, captures: { c2: $.data.id } }
            - { call: "POST /api/credentials", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", guest_name: "Guest Three", guest_email: "g3@x.example", credential_type: GUEST }, as: EventServicesManager, captures: { err: $.data.error_id } }
          assert:
            - "Credentials #1 and #2 succeed (201, ISSUED) — count reaches exactly capacity_seats == 2"
            - "Credential #3 fails: error_id == ERR_CREDENTIAL_CAPACITY_EXCEEDED (boundary is >=, not >)"

  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: catering_confirm_blocked_when_agreement_suspended
        grounds:
          - state_machines.CateringOrder.PLACED_to_CONFIRMED
          - state_machines.LicenseAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair CateringOrder x LicenseAgreement: the order was placed while
          the agreement was ACTIVE, then the agreement became SUSPENDED (manual
          account suspension cascade, reason ADMINISTRATIVE), and confirm now fails
          with ERR_AGREEMENT_NOT_ACTIVE even though the event is still SCHEDULED and
          the cutoff has not passed.
        test_recipe:
          setup:
            - "Venue, GOLD suite, S1 PUBLISHED, E1 REGULAR, account ACTIVE with ACTIVE agreement, order PLACED at clock 2026-08-20"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/catering-orders", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", package_tier: STANDARD, guest_count: 8, lines: [ { item_code: "APP", description: "Sliders", quantity: 1, unit_price_cents: 1000 } ] }, as: AccountHolder, as_user_id: "${ac}", captures: { co: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "SUSPENDED" }, as: FinanceController }
          trigger:
