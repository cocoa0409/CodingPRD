            - call: "POST /valet/contractors/${cty_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-01", service_window_start: "2026-09-01T18:00:00.000Z", service_window_end: "2026-09-01T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n1_id: $.data.id, n1_v: $.data.version }
            - call: "POST /valet/service-nights/${n1_id}/route-assignments"
              payload: { contractor_id: "${ctx_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${n1_v}" }
              as: ValetOpsManager
              captures: { rtx_id: $.data.id }
          trigger:
            - call: "POST /valet/route-assignments/${rtx_id}/abandon"
              payload: { reason: "valet X called out sick" }
              as: ValetOpsManager
            - call: "GET /valet/service-nights/${n1_id}"
              payload: {}
              as: ValetOpsManager
              captures: { n1_v3: $.data.version }
            - call: "POST /valet/service-nights/${n1_id}/route-assignments"
              payload: { contractor_id: "${cty_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${n1_v3}" }
              as: ValetOpsManager
              captures: { rty_id: $.data.id }
          assert:
            - "before the trigger RouteAssignment.${rtx_id}.unit_coverage_count == 4 and ServiceNight.${n1_id}.assigned_unit_coverage_count == 4"
            - "after the abandon RouteAssignment.${rtx_id}.status == 'ABANDONED' and ServiceNight.${n1_id}.assigned_unit_coverage_count == 0 — recomputed from live routes, not decremented blindly"
            - "the re-issue returns HTTP 201, NOT 409 ERR_UNIT_RANGE_OVERLAP — an ABANDONED route no longer reserves units 101-104"
            - "RouteAssignment.${rty_id}.unit_coverage_count == 4 and ServiceNight.${n1_id}.assigned_unit_coverage_count == 4 again — the count round-trips exactly"
            - "GET /valet/route-assignments?service_night_id=${n1_id} returns 2 rows, ${rtx_id} ABANDONED and ${rty_id} ASSIGNED"
