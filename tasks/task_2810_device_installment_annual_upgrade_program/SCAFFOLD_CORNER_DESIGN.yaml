              payload: { full_name: "Kai Lindqvist", email: "kai.lindqvist@example.com", mobile_number: "+15550100012" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
          trigger:
            - call: "GET /credit-applications/${app}"
              payload: {}
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643005" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
