        grounds: ["state_machines.SweatEquityEntry.status.CREDITED_to_REVERSED", "state_machines.ApplicantHousehold.partnership_readiness.CLOSING_READY_to_EDUCATION_COMPLETE", "state_machines.MortgageApplication.status.CLEARED_TO_CLOSE_to_APPROVED", calculations.sweat_equity_ledger_invariant]
