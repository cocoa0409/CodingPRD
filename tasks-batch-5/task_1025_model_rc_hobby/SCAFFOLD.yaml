# =============================================================================
# task_1025 — Model, RC & Hobby Store
# Kit/RC & parts, build/repair service, race/event & club, pre-order/allocation,
# battery/safety, loyalty. Difficulty: Expert.
# =============================================================================

scenario: |
  1025. Model, RC & Hobby Store: kit/RC & parts, build/repair service,
  race/event & club, pre-order/allocation, battery/safety, trade-in/consignment,
  loyalty, special order

domain_name: model-rc-hobby
api_prefix: "/"

# -----------------------------------------------------------------------------
# Step 0 — Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat            # peer entities linked by FK ids in bodies (PRIORITIZED)
  state_machine_shape: parallel    # Order carries payment_status × fulfillment_status; ServiceJob is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override   # StoreManager ⊇ StoreStaff; Customer is an entity-backed peer
  consistency_model: immediate

  entity_count: 8
  state_machine_count: 6
  calculation_count: 7
  validation_layers: 9
  endpoint_count: 32
  error_code_count: 22
  role_count: 3

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix. Identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation." }
      - { name: email, type: string, source: input, description: "Login/contact email." }
      - { name: full_name, type: string, source: input, description: "Member full name." }
      - { name: lifetime_spend_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over this member's FULFILLED orders (see calc customer_lifetime_spend)." }
      - { name: loyalty_points_balance, type: integer, source: computed, default: 0, description: "Running loyalty points; credited on order place (provisional) and reconciled on fulfill; debited on cancel. See calc loyalty_points." }
      - { name: loyalty_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD, derived from lifetime_spend_cents (calc loyalty_tier)." }
      - { name: hazmat_safety_ack, type: boolean, source: computed, default: false, description: "Battery/hazmat safety acknowledgement on file; set true by POST /customers/{id}/safety-ack. Gates hazmat orders and race check-in." }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix. Identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation." }
      - { name: sku, type: string, source: input, description: "Stock keeping unit code." }
      - { name: name, type: string, source: input, description: "Display name." }
      - { name: product_type, type: enum, source: input, description: "KIT | RC_VEHICLE | PART | BATTERY." }
      - { name: price_cents, type: integer, source: input, description: "Catalog unit price in cents." }
      - { name: stock_on_hand, type: integer, source: input, default: 0, description: "Units in stock. Debited when an order is PLACED (reserved) and restored when an order is CANCELLED. System-mutated after create." }
      - { name: is_hazmat, type: boolean, source: computed, description: "TRUE iff product_type == BATTERY; triggers order hazmat surcharge and safety-ack gate." }

  - name: PreOrderCampaign
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix. Identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation (incl. each reservation create against this campaign)." }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product being pre-sold." }
      - { name: title, type: string, source: input, description: "Campaign title." }
      - { name: total_allocation_units, type: integer, source: input, description: "Finite pool of units available to allocate across reservations." }
      - { name: unit_price_cents, type: integer, source: input, description: "Price per unit charged when a reservation converts to an order." }
      - { name: reservation_open_at, type: datetime, source: input, description: "Inclusive start of the reservation window (ISO 8601 UTC)." }
      - { name: reservation_close_at, type: datetime, source: input, description: "Exclusive end of the reservation window (ISO 8601 UTC)." }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "sum(PreOrderReservation.allocated_units WHERE status IN {ALLOCATED, CONVERTED}). Invariant conserved quantity (calc campaign_allocation)." }
      - { name: remaining_units, type: integer, source: computed, description: "total_allocation_units - allocated_units; never negative." }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | ALLOCATING | CANCELLED." }

  - name: PreOrderReservation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix. Identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision. Allocation sweep processes reservations by created_at ASC." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation." }
      - { name: campaign_id, type: string, source: system, description: "FK -> PreOrderCampaign.id; set from the URL path on create." }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the reserving member." }
      - { name: requested_units, type: integer, source: input, description: "Units the member wants; must be >= 1." }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Units granted by the allocation sweep; 0 until ALLOCATED." }
      - { name: order_id, type: string, source: system, default: null, description: "FK -> Order.id; the order created when this reservation is CONVERTED, else null." }
      - { name: status, type: enum, source: system, default: HELD, description: "HELD | ALLOCATED | WAITLISTED | CONVERTED | CANCELLED | EXPIRED." }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix. Identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation." }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer. For role Customer, must equal X-User-ID." }
      - { name: source, type: enum, source: input, default: STANDARD, description: "STANDARD | PRE_ORDER (PRE_ORDER orders are created by reservation convert)." }
      - { name: lines, type: array, source: input, description: "Array of line objects {product_id, quantity, unit_price_cents}. Each product_id references Product.id; quantity >= 1." }
      - { name: subtotal_cents, type: integer, source: computed, description: "sum(line.quantity * line.unit_price_cents) over lines (calc order_totals)." }
      - { name: discount_cents, type: integer, source: computed, description: "Loyalty-tier discount, floor(subtotal_cents * discount_pct / 100) with tier snapshot at PLACE (calc order_totals)." }
      - { name: hazmat_surcharge_cents, type: integer, source: computed, description: "HAZMAT_SURCHARGE_CENTS if any line product is_hazmat else 0 (calc order_totals)." }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + hazmat_surcharge_cents (calc order_totals)." }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative amount paid on this order." }
      - { name: provisional_points, type: integer, source: computed, default: 0, description: "Loyalty points computed at PLACE using tier snapshot at placement (calc loyalty_points)." }
      - { name: final_points, type: integer, source: computed, default: 0, description: "Loyalty points computed at FULFILL using tier as of immediately before this order's total is added to lifetime_spend (calc loyalty_points)." }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Placement dimension: DRAFT | PLACED. Moves DRAFT->PLACED on POST place." }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "Payment dimension (parallel): UNPAID | PAID | REFUNDED. Evolves independently of fulfillment_status." }
      - { name: fulfillment_status, type: enum, source: system, default: PENDING, description: "Fulfillment dimension (parallel): PENDING | FULFILLED | CANCELLED. Evolves independently of payment_status." }

  - name: ServiceJob
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix. Identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation." }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owner of the item being built/repaired." }
      - { name: product_id, type: string, source: input, default: null, description: "FK -> Product.id; the catalog item being serviced (nullable when the item is customer-owned/non-catalog)." }
      - { name: job_type, type: enum, source: input, description: "BUILD | REPAIR." }
      - { name: bench_code, type: string, source: system, default: null, description: "Workbench identifier the job is scheduled on; set by action=SCHEDULE. Bench slots must be >= SERVICE_BUFFER_MINUTES (30) apart." }
      - { name: slot_start, type: datetime, source: system, default: null, description: "Scheduled bench slot start (ISO 8601 UTC), set by action=SCHEDULE." }
      - { name: slot_end, type: datetime, source: system, default: null, description: "Scheduled bench slot end (ISO 8601 UTC), set by action=SCHEDULE." }
      - { name: estimated_labor_hours, type: number, source: system, default: null, description: "Estimated labor hours captured at DIAGNOSE." }
      - { name: estimated_parts_cents, type: integer, source: input, default: 0, description: "Estimated parts cost; may be updated at DIAGNOSE." }
      - { name: actual_labor_hours, type: number, source: system, default: null, description: "Actual labor hours captured at COMPLETE." }
      - { name: actual_parts_cents, type: integer, source: system, default: null, description: "Actual parts cost captured at COMPLETE." }
      - { name: rework_count, type: integer, source: computed, default: 0, description: "Count of QC->IN_PROGRESS rework loops; increments each REWORK. Feeds final invoice surcharge." }
      - { name: provisional_quote_cents, type: integer, source: computed, default: 0, description: "floor(estimated_labor_hours * SERVICE_LABOR_RATE_CENTS) + estimated_parts_cents (calc service_pricing)." }
      - { name: final_invoice_cents, type: integer, source: computed, default: 0, description: "floor(actual_labor_hours * SERVICE_LABOR_RATE_CENTS) + actual_parts_cents + rework_count * REWORK_SURCHARGE_CENTS (calc service_pricing)." }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | DIAGNOSING | AWAITING_PARTS | IN_PROGRESS | QC | READY | COMPLETED | CANCELLED." }

  - name: RaceEvent
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix. Identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation." }
      - { name: name, type: string, source: input, description: "Event name." }
      - { name: event_date, type: datetime, source: input, description: "Race day (ISO 8601 UTC)." }
      - { name: capacity, type: integer, source: input, description: "Maximum number of non-terminal entries." }
      - { name: lane_count, type: integer, source: input, description: "Number of track lanes available for heat scheduling." }
      - { name: entry_fee_cents, type: integer, source: input, description: "Registration fee; drives loyalty points awarded on entry." }
      - { name: registration_open_at, type: datetime, source: input, description: "Inclusive start of registration window (ISO 8601 UTC)." }
      - { name: registration_close_at, type: datetime, source: input, description: "Exclusive end of registration window (ISO 8601 UTC)." }
      - { name: entry_count, type: integer, source: computed, default: 0, description: "Count of RaceEntry rows in status IN {REGISTERED, CHECKED_IN, RACED, DISQUALIFIED} for this event." }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | OPEN | RUNNING | FINISHED | CANCELLED." }

  - name: RaceEntry
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix. Identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision." }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades." }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation." }
      - { name: event_id, type: string, source: system, description: "FK -> RaceEvent.id; set from the URL path on create." }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the racer. For role Customer, must equal X-User-ID." }
      - { name: race_class, type: enum, source: input, description: "STOCK | MODIFIED | PRO." }
      - { name: lane_no, type: integer, source: input, description: "Assigned track lane (1..RaceEvent.lane_count)." }
      - { name: heat_start, type: datetime, source: input, description: "Half-open heat interval start [heat_start, heat_end) on (event_id, lane_no)." }
      - { name: heat_end, type: datetime, source: input, description: "Half-open heat interval end (exclusive)." }
      - { name: entry_points_awarded, type: integer, source: computed, default: 0, description: "floor(RaceEvent.entry_fee_cents / 100) loyalty points credited to the member on register; debited on WITHDRAWN (calc entry_points)." }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | CHECKED_IN | RACED | DISQUALIFIED | WITHDRAWN." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PreOrderCampaign
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /campaigns/{campaign_id}/open"
        actor: StoreStaff
        preconditions: ["campaign.status == DRAFT"]
        side_effects: ["Reservations may now be created against the campaign"]
      - from: OPEN
        to: ALLOCATING
        trigger: "POST /campaigns/{campaign_id}/allocate"
        actor: StoreStaff
        preconditions:
          - "campaign.status == OPEN (ERR_INVALID_STATE otherwise, e.g. re-allocation is ERR_CAMPAIGN_ALREADY_ALLOCATED)"
        side_effects:
          - "Run the allocation sweep (calc campaign_allocation): HELD reservations by created_at ASC each ALLOCATED if requested_units <= remaining pool else WAITLISTED"
          - "Set campaign.allocated_units = total_allocation_units - remaining_pool; recompute remaining_units"
      - from: [DRAFT, OPEN, ALLOCATING]
        to: CANCELLED
        trigger: "POST /campaigns/{campaign_id}/cancel"
        actor: StoreManager
        preconditions: ["campaign.status != CANCELLED"]
        side_effects:
          - "CASCADE L1: every PreOrderReservation on this campaign in status IN {HELD, WAITLISTED, ALLOCATED, CONVERTED} -> CANCELLED"
          - "CASCADE L2 (fired by each reservation's own CANCELLED transition): if reservation.order_id is set, that Order -> fulfillment_status CANCELLED"
          - "CASCADE L3 (fired by each order's own CANCELLED transition): restore Product.stock_on_hand and reverse the buyer's provisional loyalty points (see Order CANCELLED side_effects)"

  - entity: PreOrderReservation
    field: status
    initial_state: HELD
    terminal_states: [CONVERTED, CANCELLED, EXPIRED]
    transitions:
      - from: HELD
        to: ALLOCATED
        trigger: "system (allocation sweep during POST /campaigns/{campaign_id}/allocate), requested_units <= remaining pool"
        actor: system
        preconditions: ["campaign.status == OPEN at sweep time", "requested_units <= remaining pool"]
        side_effects: ["allocated_units = requested_units", "campaign.allocated_units increases by requested_units"]
      - from: HELD
        to: WAITLISTED
        trigger: "system (allocation sweep), requested_units > remaining pool"
        actor: system
        preconditions: ["requested_units > remaining pool"]
        side_effects: ["allocated_units = 0"]
      - from: ALLOCATED
        to: CONVERTED
        trigger: "POST /pre-orders/{reservation_id}/transition (action=CONVERT)"
        actor: StoreStaff
        preconditions:
          - "reservation.status == ALLOCATED (ERR_RESERVATION_NOT_ALLOCATED otherwise)"
          - "campaign.status == ALLOCATING (cross-entity dependency Reservation->Campaign)"
          - "Product.stock_on_hand >= allocated_units (ERR_INSUFFICIENT_STOCK otherwise)"
        side_effects:
          - "Create Order(source=PRE_ORDER, customer_id=reservation.customer_id, lines=[{product_id: campaign.product_id, quantity: allocated_units, unit_price_cents: campaign.unit_price_cents}]) already in status PLACED"
          - "That order-place reserves Product.stock_on_hand (-= allocated_units) and credits provisional loyalty points"
          - "reservation.order_id = new order id"
      - from: [HELD, WAITLISTED, ALLOCATED, CONVERTED]
        to: CANCELLED
        trigger: "POST /pre-orders/{reservation_id}/transition (action=CANCEL) OR system (campaign cancel cascade L1)"
        actor: "Customer or StoreStaff or system"
        preconditions: ["reservation.status not terminal"]
        side_effects:
          - "If status was ALLOCATED or CONVERTED: campaign.allocated_units decreases by allocated_units (conserved-quantity release, calc campaign_allocation)"
          - "CASCADE L2: if reservation.order_id is set and that order is not terminal, cancel that Order (fulfillment_status -> CANCELLED)"

  - entity: Order
    field: "status × payment_status × fulfillment_status (parallel dimensions)"
    initial_state: "DRAFT / UNPAID / PENDING"
    terminal_states: ["fulfillment_status ∈ {FULFILLED, CANCELLED}"]
    note: "payment_status and fulfillment_status are independent parallel dimensions; the same PLACED order may be PAID-then-FULFILLED or FULFILLED-then-PAID."
    transitions:
      - from: "status=DRAFT"
        to: "status=PLACED"
        trigger: "POST /orders/{order_id}/transition (action=PLACE)"
        actor: "Customer or StoreStaff"
        preconditions:
          - "status == DRAFT"
          - "for every line: Product.stock_on_hand >= quantity (ERR_INSUFFICIENT_STOCK)"
          - "if any line product is_hazmat: buyer.hazmat_safety_ack == true (ERR_HAZMAT_ACK_REQUIRED)"
        side_effects:
          - "Compute subtotal/discount/hazmat_surcharge/total (calc order_totals) using buyer.loyalty_tier snapshot at PLACE"
          - "Reserve stock: for every line Product.stock_on_hand -= quantity"
          - "Compute provisional_points (calc loyalty_points, tier snapshot at PLACE) and credit buyer.loyalty_points_balance += provisional_points"
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /orders/{order_id}/pay"
        actor: "Customer or StoreStaff"
        preconditions:
          - "status == PLACED (ERR_INVALID_STATE otherwise)"
          - "payment_status == UNPAID"
          - "amount_cents >= total_cents (ERR_INSUFFICIENT_PAYMENT otherwise)"
        side_effects: ["amount_paid_cents = amount_cents", "payment_status = PAID"]
      - from: "fulfillment_status=PENDING"
        to: "fulfillment_status=FULFILLED"
        trigger: "POST /orders/{order_id}/transition (action=FULFILL)"
        actor: StoreStaff
        preconditions:
          - "status == PLACED"
          - "payment_status == PAID (ERR_INVALID_STATE otherwise)"
          - "fulfillment_status == PENDING"
        side_effects:
          - "buyer.lifetime_spend_cents += total_cents (BEFORE final tier evaluation)"
          - "Compute final_points (calc loyalty_points) using tier as-of just BEFORE this order's total was added; buyer.loyalty_points_balance += (final_points - provisional_points) reconciliation"
          - "fulfillment_status = FULFILLED; buyer.loyalty_tier recomputed (calc loyalty_tier)"
      - from: "fulfillment_status=PENDING"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{order_id}/transition (action=CANCEL) OR system (reservation cancel cascade L2)"
        actor: "Customer or StoreStaff or system"
        preconditions: ["fulfillment_status == PENDING (a FULFILLED order cannot be cancelled)"]
        side_effects:
          - "CASCADE L3: restore stock for every line Product.stock_on_hand += quantity"
          - "Reverse provisional loyalty: buyer.loyalty_points_balance -= provisional_points (compensating invariant loyalty_points_conserved)"
          - "If payment_status == PAID: payment_status = REFUNDED"
          - "fulfillment_status = CANCELLED"

  - entity: ServiceJob
    field: status
    initial_state: RECEIVED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Cyclic: QC -> IN_PROGRESS rework loop increments rework_count."
    transitions:
      - from: RECEIVED
        to: DIAGNOSING
        trigger: "POST /service-jobs/{job_id}/transition (action=DIAGNOSE, estimated_labor_hours, estimated_parts_cents?)"
        actor: StoreStaff
        preconditions: ["status == RECEIVED", "estimated_labor_hours provided and >= 0"]
        side_effects: ["Set estimated_labor_hours/estimated_parts_cents", "Recompute provisional_quote_cents (calc service_pricing)"]
      - from: DIAGNOSING
        to: AWAITING_PARTS
        trigger: "POST /service-jobs/{job_id}/transition (action=AWAIT_PARTS)"
        actor: StoreStaff
        preconditions: ["status == DIAGNOSING"]
        side_effects: []
      - from: [DIAGNOSING, AWAITING_PARTS]
        to: IN_PROGRESS
        trigger: "POST /service-jobs/{job_id}/transition (action=START)"
        actor: StoreStaff
        preconditions: ["status IN {DIAGNOSING, AWAITING_PARTS}", "bench_code is set (job has been SCHEDULEd)"]
        side_effects: []
      - from: IN_PROGRESS
        to: QC
        trigger: "POST /service-jobs/{job_id}/transition (action=QC)"
        actor: StoreStaff
        preconditions: ["status == IN_PROGRESS"]
        side_effects: []
      - from: QC
        to: IN_PROGRESS
        trigger: "POST /service-jobs/{job_id}/transition (action=REWORK)"
        actor: StoreStaff
        preconditions: ["status == QC"]
        side_effects: ["rework_count += 1 (each rework adds REWORK_SURCHARGE_CENTS to final_invoice_cents)"]
      - from: QC
        to: READY
        trigger: "POST /service-jobs/{job_id}/transition (action=READY)"
        actor: StoreStaff
        preconditions: ["status == QC"]
        side_effects: []
      - from: READY
        to: COMPLETED
        trigger: "POST /service-jobs/{job_id}/transition (action=COMPLETE, actual_labor_hours, actual_parts_cents)"
        actor: StoreStaff
        preconditions: ["status == READY", "actual_labor_hours and actual_parts_cents provided"]
        side_effects: ["Set actual_labor_hours/actual_parts_cents", "Recompute final_invoice_cents (calc service_pricing)"]
      - from: [RECEIVED, DIAGNOSING, AWAITING_PARTS, IN_PROGRESS, QC, READY]
        to: CANCELLED
        trigger: "POST /service-jobs/{job_id}/transition (action=CANCEL)"
        actor: StoreStaff
        preconditions: ["status not terminal"]
        side_effects: ["Bench slot released"]

  - entity: RaceEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [FINISHED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /race-events/{event_id}/transition (action=OPEN)"
        actor: StoreStaff
        preconditions: ["status == SCHEDULED"]
        side_effects: ["Registrations accepted while current_utc within [registration_open_at, registration_close_at)"]
      - from: OPEN
        to: RUNNING
        trigger: "POST /race-events/{event_id}/transition (action=RUN)"
        actor: StoreStaff
        preconditions: ["status == OPEN"]
        side_effects: ["Check-ins accepted"]
      - from: RUNNING
        to: FINISHED
        trigger: "POST /race-events/{event_id}/transition (action=FINISH)"
        actor: StoreStaff
        preconditions: ["status == RUNNING"]
        side_effects: []
      - from: [SCHEDULED, OPEN, RUNNING]
        to: CANCELLED
        trigger: "POST /race-events/{event_id}/transition (action=CANCEL)"
        actor: StoreStaff
        preconditions: ["status not terminal"]
        side_effects:
          - "CASCADE L1: every RaceEntry on this event in status IN {REGISTERED, CHECKED_IN} -> WITHDRAWN"
          - "CASCADE L2 (fired by each entry's own WITHDRAWN transition): debit racer.loyalty_points_balance by entry_points_awarded"

  - entity: RaceEntry
    field: status
    initial_state: REGISTERED
    terminal_states: [RACED, DISQUALIFIED, WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /race-entries/{entry_id}/transition (action=CHECK_IN)"
        actor: "Customer or StoreStaff"
        preconditions:
          - "RaceEvent.status == RUNNING (cross-entity dependency Entry->Event; ERR_INVALID_STATE otherwise)"
          - "racer.hazmat_safety_ack == true (battery safety; ERR_SAFETY_INSPECTION_REQUIRED otherwise)"
          - "current_utc within [heat_start - CHECKIN_WINDOW_LEAD_MINUTES, heat_end) (ERR_CHECKIN_WINDOW_CLOSED otherwise)"
        side_effects: []
      - from: CHECKED_IN
        to: RACED
        trigger: "POST /race-entries/{entry_id}/transition (action=RACED)"
        actor: StoreStaff
        preconditions: ["status == CHECKED_IN"]
        side_effects: []
      - from: [REGISTERED, CHECKED_IN]
        to: DISQUALIFIED
        trigger: "POST /race-entries/{entry_id}/transition (action=DISQUALIFY)"
        actor: StoreStaff
        preconditions: ["status IN {REGISTERED, CHECKED_IN}"]
        side_effects: []
      - from: [REGISTERED, CHECKED_IN]
        to: WITHDRAWN
        trigger: "POST /race-entries/{entry_id}/transition (action=WITHDRAW) OR system (race event cancel cascade L1)"
        actor: "Customer or StoreStaff or system"
        preconditions: ["status IN {REGISTERED, CHECKED_IN}"]
        side_effects: ["racer.loyalty_points_balance -= entry_points_awarded (compensating; keeps points conserved relative to register)"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: preorder-reservation-stale-campaign
    parent_entity: PreOrderCampaign
    write_endpoint: "POST /campaigns/{campaign_id}/pre-orders"
    occ_field: "expected_campaign_version"
    description: |
      Creating a PreOrderReservation against a campaign whose version has
      advanced since the client last observed it is rejected. Reservations
      draw down the campaign's finite allocation pool, so a client acting on a
      stale view of the campaign (another reservation was created after the
      client read it, advancing the version) must re-read before reserving.
      Stated as a stale-version precondition, not as overlapping requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_totals
    trigger: "Order PLACE (POST /orders/{order_id}/transition action=PLACE, and the place performed by reservation CONVERT)"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = sum(line.quantity * line.unit_price_cents for line in lines)
      # tier snapshot taken at PLACE time
      discount_pct = DISCOUNT_PCT[buyer.loyalty_tier]         # BRONZE 0, SILVER 5, GOLD 10
      discount_cents = floor(subtotal_cents * discount_pct / 100)
      hazmat_surcharge_cents = HAZMAT_SURCHARGE_CENTS if any(Product(line.product_id).is_hazmat for line) else 0
      total_cents = subtotal_cents - discount_cents + hazmat_surcharge_cents
      # Evaluation order is pinned: discount is keyed on subtotal (not total);
      # surcharge is added AFTER discount.
    input_set: "All lines of the order; buyer tier snapshot at PLACE."
    constants:
      DISCOUNT_PCT: { BRONZE: 0, SILVER: 5, GOLD: 10 }
      HAZMAT_SURCHARGE_CENTS: 500
    precision: "integer cents, floor on the discount step"

  - name: loyalty_points
    trigger: "Order PLACE (provisional_points) and Order FULFILL (final_points)"
    algorithm: weighted_scoring
    formula: |
      mult_x100(tier) = { BRONZE: 100, SILVER: 150, GOLD: 200 }[tier]
      # ROUNDING ORDER PINNED: floor per line, THEN sum (NOT sum-then-floor).
      per_line_points(line, tier) = floor(line.quantity * line.unit_price_cents * mult_x100(tier) / 10000)
      provisional_points = sum(per_line_points(line, tier_at_place) for line in lines)
      final_points       = sum(per_line_points(line, tier_at_fulfill) for line in lines)
      # tier_at_place  = buyer.loyalty_tier snapshot at PLACE
      # tier_at_fulfill= buyer.loyalty_tier evaluated on lifetime_spend_cents
      #                  as of immediately BEFORE this order's total_cents is added
      # Balance effects:
      #   PLACE:   loyalty_points_balance += provisional_points
      #   FULFILL: loyalty_points_balance += (final_points - provisional_points)
      #   CANCEL (pre-fulfill): loyalty_points_balance -= provisional_points
    input_set: "All lines; tier snapshot differs between the two variants."
    constants:
      MULT_X100: { BRONZE: 100, SILVER: 150, GOLD: 200 }
    precision: "integer points, floor per line then sum"
    variants:
      - name: provisional
        when: "at PLACE"
        difference: "uses buyer tier snapshot at placement"
      - name: final
        when: "at FULFILL"
        difference: "uses buyer tier as of just before this order's total is booked to lifetime_spend; can exceed provisional if the buyer tiered up in between"

  - name: loyalty_tier
    trigger: "recomputed whenever lifetime_spend_cents changes (order FULFILL / order cancel refund)"
    algorithm: threshold
    formula: |
      loyalty_tier =
        GOLD   if lifetime_spend_cents >= GOLD_THRESHOLD_CENTS
        SILVER if lifetime_spend_cents >= SILVER_THRESHOLD_CENTS
        BRONZE otherwise
      # boundary is inclusive (>=): exactly SILVER_THRESHOLD_CENTS => SILVER
    input_set: "buyer.lifetime_spend_cents (sum of FULFILLED order totals)."
    constants:
      SILVER_THRESHOLD_CENTS: 50000
      GOLD_THRESHOLD_CENTS: 200000
    precision: "exact integer comparison, inclusive lower bound"

  - name: customer_lifetime_spend
    trigger: "order FULFILL (add) / order cancel after fulfill (subtract)"
    algorithm: aggregation
    formula: |
      lifetime_spend_cents = sum(o.total_cents for o in buyer.orders where o.fulfillment_status == FULFILLED)
    input_set: "buyer's FULFILLED orders only."
    precision: "integer cents"

  - name: service_pricing
    trigger: "ServiceJob DIAGNOSE (provisional_quote_cents) and COMPLETE (final_invoice_cents)"
    algorithm: weighted_scoring
    formula: |
      provisional_quote_cents = floor(estimated_labor_hours * SERVICE_LABOR_RATE_CENTS) + estimated_parts_cents
      final_invoice_cents     = floor(actual_labor_hours * SERVICE_LABOR_RATE_CENTS)
                                + actual_parts_cents
                                + rework_count * REWORK_SURCHARGE_CENTS
    input_set: "estimate uses estimated_* fields; final uses actual_* fields plus accumulated rework_count."
    constants:
      SERVICE_LABOR_RATE_CENTS: 6000
      REWORK_SURCHARGE_CENTS: 2500
    precision: "integer cents, floor on the labor step"
    variants:
      - name: provisional_quote
        when: "at DIAGNOSE"
        difference: "estimated hours/parts, no rework surcharge"
      - name: final_invoice
        when: "at COMPLETE"
        difference: "actual hours/parts plus rework_count * REWORK_SURCHARGE_CENTS"

  - name: campaign_allocation
    trigger: "campaign ALLOCATE (sweep) and reservation CANCEL (release)"
    algorithm: waterfall_allocation
    formula: |
      # Allocation sweep at ALLOCATE:
      remaining = campaign.total_allocation_units
      for res in HELD_reservations sorted by created_at ASC:     # created_at is the ONLY ordering key
        if res.requested_units <= remaining:                     # boundary: inclusive (<=)
          res.allocated_units = res.requested_units
          res.status = ALLOCATED
          remaining -= res.requested_units
        else:
          res.allocated_units = 0
          res.status = WAITLISTED
      campaign.allocated_units = campaign.total_allocation_units - remaining
      # Conserved-quantity invariant (holds after allocate AND after any release):
      campaign.allocated_units == sum(r.allocated_units for r in reservations
                                      where r.status IN {ALLOCATED, CONVERTED})
      campaign.remaining_units = campaign.total_allocation_units - campaign.allocated_units
    input_set: "HELD reservations at sweep time, ordered by created_at ASC."
    precision: "integer units; no auto-promotion of WAITLISTED on release"

  - name: entry_points
    trigger: "RaceEntry register (credit) and WITHDRAWN (debit)"
    algorithm: aggregation
    formula: |
      entry_points_awarded = floor(RaceEvent.entry_fee_cents / 100)
      # register:  racer.loyalty_points_balance += entry_points_awarded
      # WITHDRAWN: racer.loyalty_points_balance -= entry_points_awarded
    input_set: "the event's entry_fee_cents."
    precision: "integer points, floor"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation (RBAC §1.7); for role Customer acting on an owned resource, X-User-ID must equal the resource's customer_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (customer_id, product_id, campaign_id, order_id, event_id, entry_id), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_campaign_version matches PreOrderCampaign.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /campaigns/{campaign_id}/pre-orders"

  - priority: 6
    category: business_safety
    check: "Hazmat gate: placing an order containing a BATTERY (is_hazmat) line requires buyer.hazmat_safety_ack == true"
    error_id: ERR_HAZMAT_ACK_REQUIRED
    http_status: 409
    applies_to: "POST /orders/{order_id}/transition (action=PLACE)"

  - priority: 6
    category: business_safety
    check: "Race safety gate: check-in requires racer.hazmat_safety_ack == true"
    error_id: ERR_SAFETY_INSPECTION_REQUIRED
    http_status: 409
    applies_to: "POST /race-entries/{entry_id}/transition (action=CHECK_IN)"

  - priority: 7
    category: business_temporal
    check: "Reservation window: reservations only while current_utc within [reservation_open_at, reservation_close_at)"
    error_id: ERR_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /campaigns/{campaign_id}/pre-orders"

  - priority: 7
    category: business_temporal
    check: "Registration window: register only while current_utc within [registration_open_at, registration_close_at)"
    error_id: ERR_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /race-events/{event_id}/entries"

  - priority: 7
    category: business_temporal
    check: "Check-in window: current_utc within [heat_start - CHECKIN_WINDOW_LEAD_MINUTES, heat_end)"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /race-entries/{entry_id}/transition (action=CHECK_IN)"

  - priority: 8
    category: business_temporal
    check: "Bench slot interval valid (slot_end > slot_start) and >= SERVICE_BUFFER_MINUTES (30) from any other slot on the same bench_code"
    error_id: ERR_BENCH_CONFLICT
    http_status: 409
    applies_to: "POST /service-jobs/{job_id}/transition (action=SCHEDULE)"

  - priority: 8
    category: business_temporal
    check: "Heat interval [heat_start, heat_end) must not overlap another entry on the same (event_id, lane_no); adjacency (end==next start) allowed"
    error_id: ERR_LANE_CONFLICT
    http_status: 409
    applies_to: "POST /race-events/{event_id}/entries"

  - priority: 9
    category: business_referential
    check: "Reservation convert requires reservation.status == ALLOCATED"
    error_id: ERR_RESERVATION_NOT_ALLOCATED
    http_status: 409
    applies_to: "POST /pre-orders/{reservation_id}/transition (action=CONVERT)"

  - priority: 10
    category: business_constraint
    check: "requested_units on reservation create must be >= 1 and <= campaign.total_allocation_units (a single reservation may not exceed the whole pool)"
    error_id: ERR_ALLOCATION_EXHAUSTED
    http_status: 409
    applies_to: "POST /campaigns/{campaign_id}/pre-orders"

  - priority: 10
    category: business_constraint
    check: "Race event not at capacity (entry_count < capacity, else ERR_EVENT_FULL); no duplicate non-terminal entry per (event, customer) (else ERR_DUPLICATE_ENTRY); lane_no in 1..lane_count (else ERR_LANE_OUT_OF_RANGE)"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "POST /race-events/{event_id}/entries"

  - priority: 11
    category: business_constraint
    check: "Sufficient product stock to reserve at PLACE/CONVERT"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "order PLACE, reservation CONVERT"

  - priority: 12
    category: business_fiscal
    check: "Payment amount_cents >= order.total_cents"
    error_id: ERR_INSUFFICIENT_PAYMENT
    http_status: 402
    applies_to: "POST /orders/{order_id}/pay"

  - priority: 13
    category: business_constraint
    check: "Field-level: quantities/units >= 1; enum members valid; pagination limit within [1,100], offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table (32)
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any set, the clock reads exactly this default (never real wall-clock)."
    roles: [StoreManager, StoreStaff]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register a customer/loyalty member."
    roles: [StoreStaff, StoreManager]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["loyalty_points_balance=0, lifetime_spend_cents=0, loyalty_tier=BRONZE, hazmat_safety_ack=false"]

  - method: GET
    path: "/customers/{customer_id}"
    description: "Get a customer (own for role Customer)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{customer_id}/safety-ack"
    description: "Record the member's battery/hazmat safety acknowledgement."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: Customer
    side_effects: ["hazmat_safety_ack = true"]

  # --- Product ---
  - method: POST
    path: "/products"
    description: "Create a catalog product."
    roles: [StoreStaff, StoreManager]
    code: 201
    input: [sku, name, product_type, price_cents, stock_on_hand]
    output: Product
    side_effects: ["is_hazmat = (product_type == BATTERY)"]

  - method: GET
    path: "/products/{product_id}"
    description: "Get a product."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- PreOrderCampaign ---
  - method: POST
    path: "/campaigns"
    description: "Create a pre-order/allocation campaign for a product."
    roles: [StoreStaff, StoreManager]
    code: 201
    input: [product_id, title, total_allocation_units, unit_price_cents, reservation_open_at, reservation_close_at]
    output: PreOrderCampaign
    side_effects: ["status=DRAFT, allocated_units=0, remaining_units=total_allocation_units"]

  - method: GET
    path: "/campaigns/{campaign_id}"
    description: "Get a campaign."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: PreOrderCampaign
    side_effects: []

  - method: GET
    path: "/campaigns"
    description: "List campaigns, optionally filtered by product (FK reverse-reachability for Product)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: PreOrderCampaign[]
    side_effects: []

  - method: POST
    path: "/campaigns/{campaign_id}/open"
    description: "Open a campaign for reservations (DRAFT -> OPEN)."
    roles: [StoreStaff, StoreManager]
    code: 200
    input: []
    output: PreOrderCampaign
    side_effects: ["status=OPEN"]

  - method: POST
    path: "/campaigns/{campaign_id}/allocate"
    description: "Run the allocation sweep (OPEN -> ALLOCATING)."
    roles: [StoreStaff, StoreManager]
    code: 200
    input: []
    output: PreOrderCampaign
    side_effects: ["calc campaign_allocation over HELD reservations by created_at ASC", "status=ALLOCATING", "allocated_units/remaining_units set"]

  - method: POST
    path: "/campaigns/{campaign_id}/cancel"
    description: "Cancel a campaign (StoreManager only) with the L1->L2->L3 cascade."
    roles: [StoreManager]
    code: 200
    input: []
    output: PreOrderCampaign
    side_effects:
      - "status=CANCELLED"
      - "CASCADE L1: reservations {HELD,WAITLISTED,ALLOCATED,CONVERTED} -> CANCELLED"
      - "CASCADE L2/L3 via reservation & order cancellation (order fulfillment CANCELLED, stock restored, provisional points reversed)"

  # --- PreOrderReservation ---
  - method: POST
    path: "/campaigns/{campaign_id}/pre-orders"
    description: "Create a reservation against a campaign. OCC-guarded on campaign version."
    roles: [Customer, StoreStaff, StoreManager]
    code: 201
    input: [customer_id, requested_units, expected_campaign_version]
    output: PreOrderReservation
    side_effects: ["status=HELD, allocated_units=0", "increments PreOrderCampaign.version by 1"]

  - method: GET
    path: "/pre-orders/{reservation_id}"
    description: "Get a reservation."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: PreOrderReservation
    side_effects: []

  - method: GET
    path: "/pre-orders"
    description: "List reservations filtered by campaign, customer, or resulting order (FK reverse-reachability)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: ["campaign_id?", "customer_id?", "order_id?", "limit?", "offset?"]
    output: PreOrderReservation[]
    side_effects: []

  - method: POST
    path: "/pre-orders/{reservation_id}/transition"
    description: "Reservation lifecycle. action=CONVERT (ALLOCATED->CONVERTED, creates a PLACED order and sets order_id) or action=CANCEL (->CANCELLED, releases units, cascades to linked order)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: [action]
    output: PreOrderReservation
    side_effects:
      - "CONVERT: create Order(PRE_ORDER, PLACED); reserve stock; provisional points; order_id set (campaign remains ALLOCATING)"
      - "CANCEL: status=CANCELLED; release allocated_units (calc campaign_allocation); cascade cancel linked order if any"

  # --- Order ---
  - method: POST
    path: "/orders"
    description: "Create a DRAFT order with line items."
    roles: [Customer, StoreStaff, StoreManager]
    code: 201
    input: [customer_id, "source?", lines]
    output: Order
    side_effects: ["status=DRAFT, payment_status=UNPAID, fulfillment_status=PENDING; totals/points 0 until PLACE"]

  - method: GET
    path: "/orders/{order_id}"
    description: "Get an order."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders filtered by customer (FK reverse-reachability for Customer)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{order_id}/pay"
    description: "Pay a PLACED order (payment dimension UNPAID -> PAID)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: [amount_cents]
    output: Order
    side_effects: ["amount_paid_cents set; payment_status=PAID"]

  - method: POST
    path: "/orders/{order_id}/transition"
    description: "Order lifecycle. action=PLACE (DRAFT->PLACED; totals, stock reserve, provisional points), action=FULFILL (PENDING->FULFILLED; lifetime_spend, final points reconciliation, tier recompute), action=CANCEL (PENDING->CANCELLED; restock, reverse provisional, refund if paid)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: [action]
    output: Order
    side_effects: ["see calc order_totals / loyalty_points / loyalty_tier and Order state machine"]

  # --- ServiceJob ---
  - method: POST
    path: "/service-jobs"
    description: "Open a build/repair service job."
    roles: [StoreStaff, StoreManager]
    code: 201
    input: [customer_id, "product_id?", job_type, "estimated_parts_cents?"]
    output: ServiceJob
    side_effects: ["status=RECEIVED, rework_count=0"]

  - method: GET
    path: "/service-jobs/{job_id}"
    description: "Get a service job."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: ServiceJob
    side_effects: []

  - method: GET
    path: "/service-jobs"
    description: "List service jobs filtered by customer or serviced product (FK reverse-reachability)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: ["customer_id?", "product_id?", "limit?", "offset?"]
    output: ServiceJob[]
    side_effects: []

  - method: POST
    path: "/service-jobs/{job_id}/transition"
    description: "Service job lifecycle + scheduling. action ∈ {SCHEDULE (bench_code, slot_start, slot_end; bench buffer check), DIAGNOSE (estimated_labor_hours, estimated_parts_cents?), AWAIT_PARTS, START, QC, REWORK, READY, COMPLETE (actual_labor_hours, actual_parts_cents), CANCEL}."
    roles: [StoreStaff, StoreManager]
    code: 200
    input: [action, "bench_code?", "slot_start?", "slot_end?", "estimated_labor_hours?", "estimated_parts_cents?", "actual_labor_hours?", "actual_parts_cents?"]
    output: ServiceJob
    side_effects: ["see ServiceJob state machine and calc service_pricing"]

  # --- RaceEvent ---
  - method: POST
    path: "/race-events"
    description: "Create a race/club event."
    roles: [StoreStaff, StoreManager]
    code: 201
    input: [name, event_date, capacity, lane_count, entry_fee_cents, registration_open_at, registration_close_at]
    output: RaceEvent
    side_effects: ["status=SCHEDULED, entry_count=0"]

  - method: GET
    path: "/race-events/{event_id}"
    description: "Get a race event."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: RaceEvent
    side_effects: []

  - method: POST
    path: "/race-events/{event_id}/transition"
    description: "Event lifecycle. action ∈ {OPEN, RUN, FINISH, CANCEL}. CANCEL cascades to entries (L1) and racer points (L2)."
    roles: [StoreStaff, StoreManager]
    code: 200
    input: [action]
    output: RaceEvent
    side_effects: ["see RaceEvent state machine"]

  # --- RaceEntry ---
  - method: POST
    path: "/race-events/{event_id}/entries"
    description: "Register a race entry (heat lane booking + entry loyalty points)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 201
    input: [customer_id, race_class, lane_no, heat_start, heat_end]
    output: RaceEntry
    side_effects: ["status=REGISTERED", "entry_points_awarded credited to racer.loyalty_points_balance", "event.entry_count += 1", "lane overlap check (ERR_LANE_CONFLICT)"]

  - method: GET
    path: "/race-entries/{entry_id}"
    description: "Get a race entry."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: []
    output: RaceEntry
    side_effects: []

  - method: GET
    path: "/race-entries"
    description: "List race entries filtered by event or customer (FK reverse-reachability)."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: ["event_id?", "customer_id?", "limit?", "offset?"]
    output: RaceEntry[]
    side_effects: []

  - method: POST
    path: "/race-entries/{entry_id}/transition"
    description: "Entry lifecycle. action ∈ {CHECK_IN (event RUNNING + safety-ack + window), RACED, DISQUALIFY, WITHDRAW (reverses entry points)}."
    roles: [Customer, StoreStaff, StoreManager]
    code: 200
    input: [action]
    output: RaceEntry
    side_effects: ["see RaceEntry state machine"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-Role/X-User-ID header missing or role unknown" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation, or Customer acting on a resource they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, bad enum, quantity/units < 1, or pagination out of range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition (incl. cross-entity state gates)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_campaign_version does not match PreOrderCampaign.version" }
  - { id: ERR_CAMPAIGN_ALREADY_ALLOCATED, http: 409, condition: "Allocate called on a campaign not in OPEN status (already ALLOCATING or CANCELLED)" }
  - { id: ERR_ALLOCATION_EXHAUSTED, http: 409, condition: "reservation requested_units exceeds campaign.total_allocation_units" }
  - { id: ERR_RESERVATION_NOT_ALLOCATED, http: 409, condition: "Convert attempted on a reservation not in ALLOCATED status" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Product stock_on_hand insufficient to reserve the requested quantity at PLACE/CONVERT" }
  - { id: ERR_HAZMAT_ACK_REQUIRED, http: 409, condition: "Order contains a hazmat (BATTERY) line but buyer.hazmat_safety_ack is false" }
  - { id: ERR_INSUFFICIENT_PAYMENT, http: 402, condition: "Payment amount_cents is less than order.total_cents" }
  - { id: ERR_WINDOW_CLOSED, http: 409, condition: "Current time outside the reservation or registration window" }
  - { id: ERR_CHECKIN_WINDOW_CLOSED, http: 409, condition: "Current time outside the check-in window [heat_start - lead, heat_end)" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Race event already at capacity" }
  - { id: ERR_DUPLICATE_ENTRY, http: 409, condition: "Customer already has a non-terminal entry in this event" }
  - { id: ERR_LANE_CONFLICT, http: 409, condition: "Heat interval overlaps another entry on the same (event, lane); adjacency allowed" }
  - { id: ERR_BENCH_CONFLICT, http: 409, condition: "Bench slot within SERVICE_BUFFER_MINUTES (30) of another slot on the same bench, or invalid interval" }
  - { id: ERR_SAFETY_INSPECTION_REQUIRED, http: 409, condition: "Race check-in requires racer.hazmat_safety_ack == true" }
  - { id: ERR_INVALID_ACTION, http: 400, condition: "Unknown action value on a /transition endpoint" }
  - { id: ERR_LANE_OUT_OF_RANGE, http: 400, condition: "lane_no not in 1..RaceEvent.lane_count" }
  - { id: ERR_PAYMENT_ALREADY_SETTLED, http: 409, condition: "Pay attempted on an order whose payment_status is not UNPAID" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "A loyalty member acting on their own orders, reservations, and race entries."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /customers/{id}/safety-ack (own)"
      - "POST /orders (own; customer_id must equal X-User-ID)"
      - "POST /orders/{id}/pay (own)"
      - "POST /orders/{id}/transition action=PLACE/CANCEL (own)"
      - "POST /campaigns/{id}/pre-orders (own reservation)"
      - "POST /pre-orders/{id}/transition action=CANCEL (own)"
      - "POST /race-events/{id}/entries (own)"
      - "POST /race-entries/{id}/transition action=CHECK_IN/WITHDRAW (own)"
      - "GET on own customer/order/reservation/entry and public product/campaign/event reads"

  - name: StoreStaff
    description: "Store operator managing catalog, campaigns, fulfillment, service jobs, and events."
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /campaigns, POST /campaigns/{id}/open, POST /campaigns/{id}/allocate"
      - "POST /pre-orders/{id}/transition action=CONVERT"
      - "POST /orders/{id}/transition action=FULFILL"
      - "POST /service-jobs and POST /service-jobs/{id}/transition (all actions)"
      - "POST /race-events and POST /race-events/{id}/transition"
      - "POST /race-entries/{id}/transition action=RACED/DISQUALIFY"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads; POST /customers; acting on behalf of members for orders/reservations/entries"

  - name: StoreManager
    description: "Superset of StoreStaff (hierarchical override) plus exclusive campaign cancellation."
    identity: "opaque"
    exclusive_operations:
      - "POST /campaigns/{id}/cancel"
    shared_operations:
      - "Everything StoreStaff can do (hierarchical override), plus all GET reads and POST /customers"
