# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3104_transparent_cost_plus_pharmacy_pricing_direct_manufacturer
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: manufacturer_create_returns_system_fields_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Manufacturer
          - endpoints.POST_/manufacturers
        distinguishing_aspect: >
          A manufacturer created with only manufacturer_name comes back 201 with
          status ACTIVE, version 1, id, created_at and updated_at all server-minted,
          and the id is a bare UUID with no type prefix.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
          trigger:
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Manufacturer.${m_id}.manufacturer_name == \"Bexley Generics\" and status == \"ACTIVE\""
            - "Manufacturer.${m_id}.version == 1"
            - "Manufacturer.${m_id}.id matches the bare UUID pattern and carries no type prefix"
            - "created_at and updated_at are both non-null and equal at creation"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: manufacturer_missing_required_name_returns_400
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/manufacturers
          - errors[ERR_INVALID_AMOUNT]
          - errors[ERR_MISSING_ROLE_HEADER]
        distinguishing_aspect: >
          A manufacturer POST whose only required field is absent is rejected, so
          manufacturer_name is genuinely required rather than defaulted.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
          trigger:
            - call: "POST /manufacturers"
              payload: {}
              as: PharmacyOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "the response error_id is a request-shape error, and no Manufacturer row was created"
            - "GET /manufacturers returns total_count 0"

      - name: drug_get_round_trips_stored_values_and_404s_on_unknown_id
        claim_type: Retrieval
        grounds:
          - entities.Drug
          - endpoints.GET_/drugs/{id}
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: >
          A drug's input fields round-trip unchanged through GET, and a well-formed
          but unknown drug id returns ERR_RESOURCE_NOT_FOUND rather than an empty body.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /drugs/${d_id}"
              payload: {}
              as: PharmacyOps
            - call: "GET /drugs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PharmacyOps
              captures: { err: $.data.error_id }
          assert:
            - "GET /drugs/${d_id} returns 200 and echoes strength \"500MG\", dosage_form \"Tablet\" and retail_reference_price_cents 4200"
            - "the second call returns 404 with error_id ERR_RESOURCE_NOT_FOUND"

      - name: drugs_list_is_paginated_with_envelope_fields_and_state_filter
        claim_type: Listing
        grounds:
          - endpoints.GET_/drugs
          - entities.Drug
        distinguishing_aspect: >
          The drug collection exposes the four pagination envelope fields, honours an
          explicit limit, and its state filter narrows the result to exactly the
          matching rows.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Drugs D1, D2 and D3 exist; D1 is admitted to the formulary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d1_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Lisinopril", strength: "10MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 3900, insured_reference_price_cents: 3300 }
              as: PharmacyOps
              captures: { d2_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d1_id}", manufacturer_id: "${m_id}", unit_cost_cents: 12, available_units: 500, reliability_tier: "C", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p1_id: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p1_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p1_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
            - call: "POST /formularies/${d1_id}/expansion"
              payload: {}
              as: PharmacyOps
          trigger:
            - call: "GET /drugs"
              payload: { limit: 1, offset: 0 }
              as: PharmacyOps
            - call: "GET /drugs"
              payload: { state: "FORMULARY" }
              as: PharmacyOps
          assert:
            - "the first call returns response_type array with total_count 2, has_more true, limit 1 and offset 0, and exactly one drug element"
            - "the filtered call returns exactly one drug and its id is ${d1_id}"
            - "a limit of 101 is rejected because the declared maximum is 100"

      - name: manufacturer_drug_price_exposes_computed_interval_days_and_ignores_supplied_price_status
        claim_type: Computed Fields
        grounds:
          - entities.ManufacturerDrugPrice
          - entities.ManufacturerDrugPrice.fields.interval_days
          - entities.ManufacturerDrugPrice.fields.price_status
          - calculations.shipment_interval_days
        distinguishing_aspect: >
          interval_days is computed from reliability_tier and available_units rather
          than accepted from the client, and price_status is system-initialized to
          PROPOSED regardless of what the request carried.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Manufacturer M and drug D exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m_id}", unit_cost_cents: 12, available_units: 600, reliability_tier: "B", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p_id: $.data.id }
          assert:
            - "ManufacturerDrugPrice.${p_id}.interval_days == 7, computed as base(B)=14 plus adjustment(-7) for available_units >= 200"
            - "ManufacturerDrugPrice.${p_id}.price_status == \"PROPOSED\" and sourcing_status == \"UNDER_REVIEW\""
            - "ManufacturerDrugPrice.${p_id}.version == 1 and created_at is server-stamped"

      - name: manufacturer_drug_price_rejects_out_of_range_numeric_inputs
        claim_type: Type Constraints
        grounds:
          - entities.ManufacturerDrugPrice.fields.unit_cost_cents
          - entities.ManufacturerDrugPrice.fields.available_units
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: >
          The declared lower bounds are enforced: unit_cost_cents 0 is refused while
          available_units 0 is accepted, so the two bounds are genuinely different
          and the zero-units row is a legal UNDER_REVIEW row rather than an error.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Manufacturer M and drug D exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m_id}", unit_cost_cents: 0, available_units: 100, reliability_tier: "A", packaging: "100-count bottle" }
              as: PharmacyOps
              captures: { err: $.data.error_id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m_id}", unit_cost_cents: 12, available_units: 0, reliability_tier: "A", packaging: "100-count bottle" }
              as: PharmacyOps
              captures: { p_zero_id: $.data.id }
          assert:
            - "the unit_cost_cents 0 request returns 400 with error_id ERR_INVALID_AMOUNT"
            - "the available_units 0 request returns 201 and ManufacturerDrugPrice.${p_zero_id}.sourcing_status == \"UNDER_REVIEW\""
            - "ManufacturerDrugPrice.${p_zero_id}.available_units == 0"

      - name: prescription_create_rejects_unresolvable_prescriber_and_patient_references
        claim_type: Parent Relationships
        grounds:
          - entities.Prescription
          - entities.Prescription.fields.prescriber_id
          - entities.Prescription.fields.patient_id
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: >
          Prescription creation validates both foreign keys left to right, so an
          unknown prescriber is refused with ERR_RESOURCE_NOT_FOUND before any drug
          validation runs, and no Prescription row is created.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Patient P and drug D exist; no prescriber exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", home_state_code: "CA" }
              as: PharmacyOps
              captures: { pat_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "00000000-0000-4000-8000-000000000000", drug_id: "${d_id}", ship_state_code: "CA", total_refills_authorized: 2 }
              as: PharmacyOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id ERR_RESOURCE_NOT_FOUND"
            - "GET /prescriptions?patient_id=${pat_id} returns total_count 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: cancel_order_from_created_is_allowed_but_from_delivered_is_locked
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.transitions.CREATED_to_CANCELED
          - state_machines.Order.transitions.SHIPPED_to_DELIVERED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: >
          Cancellation is legal from CREATED but the DELIVERED terminal state accepts
          no transition at all, so the identical cancellation request is refused with
          ERR_INVALID_STATE once the order has been delivered.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Drug D is FORMULARY with a 0-day interval pool; order O2 on prescription RX2 is DELIVERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m_id}", unit_cost_cents: 12, available_units: 600, reliability_tier: "A", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p_id: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
            - call: "POST /formularies/${d_id}/expansion"
              payload: {}
              as: PharmacyOps
            - call: "POST /pharmacies"
              payload: { pharmacy_name: "Sunbelt Mail Pharmacy", domicile_state_code: "TX", shipping_enabled: true }
              as: PharmacyOps
              captures: { ph_id: $.data.id }
            - call: "POST /pharmacies/${ph_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-MP-1001", expiry_at: "2027-09-01T00:00:00Z" }
              as: PharmacyOps
              captures: { lic_id: $.data.id }
            - call: "POST /pharmacies/${ph_id}/licenses/${lic_id}/verification"
              payload: {}
              as: PharmacyOps
            - call: "POST /patients"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", home_state_code: "CA" }
              as: PharmacyOps
              captures: { pat_id: $.data.id }
            - call: "POST /prescribers"
              payload: { prescriber_name: "Dr. Lin", npi: "1407001234", license_state_code: "CA" }
              as: PharmacyOps
              captures: { prs_id: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${prs_id}", drug_id: "${d_id}", ship_state_code: "CA", total_refills_authorized: 2 }
              as: PharmacyOps
              captures: { rx_1: $.data.id }
            - call: "POST /prescriptions/${rx_1}/intake-requests"
              payload: { packaged_quantity: 100 }
              as: PharmacyOps
              captures: { rq_1: $.data.id }
            - call: "POST /prescription-requests/${rq_1}/review"
              payload: {}
              as: Pharmacist
            - call: "POST /prescription-requests/${rq_1}/acceptance"
              payload: {}
              as: Pharmacist
            - call: "POST /orders"
              payload: { prescription_id: "${rx_1}", request_id: "${rq_1}", pharmacy_id: "${ph_id}", quantity: 30, source_price_id: "${p_id}" }
              as: PharmacyOps
              captures: { o_created: $.data.id }
            - call: "POST /orders/${o_created}/cancellation"
              payload: { reason_code: "PATIENT_REQUEST" }
              as: PharmacyOps
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat_id}", prescriber_id: "${prs_id}", drug_id: "${d_id}", ship_state_code: "CA", total_refills_authorized: 2 }
              as: PharmacyOps
              captures: { rx_2: $.data.id }
            - call: "POST /prescriptions/${rx_2}/intake-requests"
              payload: { packaged_quantity: 100 }
              as: PharmacyOps
              captures: { rq_2: $.data.id }
            - call: "POST /prescription-requests/${rq_2}/review"
              payload: {}
              as: Pharmacist
            - call: "POST /prescription-requests/${rq_2}/acceptance"
              payload: {}
              as: Pharmacist
            - call: "POST /orders"
              payload: { prescription_id: "${rx_2}", request_id: "${rq_2}", pharmacy_id: "${ph_id}", quantity: 30, source_price_id: "${p_id}" }
              as: PharmacyOps
              captures: { o2: $.data.id }
            - call: "GET /orders/${o2}"
              payload: {}
              as: PharmacyOps
              captures: { v_o2: $.data.version }
            - call: "POST /orders/${o2}/payment"
              payload: {}
              as: PharmacyOps
            - call: "POST /orders/${o2}/fulfillment"
              payload: { expected_order_version: "${v_o2}" }
              as: PharmacyOps
            - call: "POST /orders/${o2}/shipping"
              payload: {}
              as: PharmacyOps
            - call: "POST /orders/${o2}/delivery"
              payload: {}
              as: PharmacyOps
          trigger:
            - call: "POST /orders/${o_created}/cancellation"
              payload: { reason_code: "PATIENT_REQUEST" }
              as: PharmacyOps
            - call: "POST /orders/${o2}/cancellation"
              payload: { reason_code: "PATIENT_REQUEST" }
              as: PharmacyOps
              captures: { err: $.data.error_id }
          assert:
            - "the cancellation of ${o_created} returns 200 and Order.${o_created}.status == \"CANCELED\""
            - "the cancellation of ${o2} returns 409 with error_id ERR_INVALID_STATE"
            - "Order.${o2}.status is still DELIVERED"

      - name: manufacturer_suspension_quarantines_every_sourced_price_row
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ManufacturerDrugPrice.transitions.SOURCED_to_SUPPRESSED
          - endpoints.POST_/manufacturers/{id}/state
          - calculations.sourcing_status
        distinguishing_aspect: >
          Suspending a manufacturer is a single request whose side effect reaches
          every SOURCED price row that manufacturer offers, and the drug's own
          sourcing_status flips to UNSOURCED once the eligible pool empties.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Manufacturer M2 offers both price rows for drug D, and both are ACTIVE+SOURCED with 500 units each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Cardell Labs" }
              as: PharmacyOps
              captures: { m2: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m2}", unit_cost_cents: 12, available_units: 500, reliability_tier: "A", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p_a: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p_a}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p_a}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m2}", unit_cost_cents: 18, available_units: 300, reliability_tier: "B", packaging: "300-count bottle" }
              as: PharmacyOps
              captures: { p_b: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p_b}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p_b}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
          trigger:
            - call: "POST /manufacturers/${m2}/state"
              payload: { to_status: "SUSPENDED" }
              as: PharmacyOps
          assert:
            - "Manufacturer.${m2}.status == \"SUSPENDED\""
            - "ManufacturerDrugPrice.${p_a}.sourcing_status == \"SUPPRESSED\""
            - "ManufacturerDrugPrice.${p_b}.sourcing_status == \"SUPPRESSED\""
            - "Drug.${d_id}.sourcing_status == \"UNSOURCED\" and supply_units == 0"
            - "the suspension request itself did not mutate either drug_id or manufacturer_id on the price rows"

      - name: formulary_gate_and_delist_cascade_behaviour_is_covered_by_difficulty_instances
        claim_type: Valid Transition
        grounds:
          - state_machines.Drug.transitions.NON_FORMULARY_to_FORMULARY
          - state_machines.Drug.transitions.FORMULARY_to_DELISTED
          - state_machines.Order.transitions.CREATED_to_CANCELED
        excluded_because:
          difficulty_instance: transitive_cascade / delist_cascade_drug_to_order_to_shipment_to_claim_to_drug_supply
          rationale: "The delist transition and its four-hop side effects are asserted end to end in the named §1.8 instance; the gate that guards the FORMULARY transition is asserted in boundary_precision_check / formulary_gate_band_upper_edge_supply_exactly_twice_demand_admits."

      - name: price_row_revocation_suppresses_the_row_and_empties_the_eligible_pool
        claim_type: Valid Transition
        grounds:
          - state_machines.ManufacturerDrugPrice.transitions.ACTIVE_to_REVOKED
          - endpoints.POST_/manufacturer-drug-prices/{id}/revocation
          - calculations.primary_source_cost
        distinguishing_aspect: >
          Revocation moves the price dimension to REVOKED and the sourcing dimension
          to SUPPRESSED in one transition, and the drug's computed per-unit cost
          becomes null because the eligible pool is now empty.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Drug D has a single ACTIVE+SOURCED row P at 12 cents with 500 units, and D is not yet on the formulary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m_id}", unit_cost_cents: 12, available_units: 500, reliability_tier: "A", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p_id: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
          trigger:
            - call: "POST /manufacturer-drug-prices/${p_id}/revocation"
              payload: {}
              as: PharmacyOps
