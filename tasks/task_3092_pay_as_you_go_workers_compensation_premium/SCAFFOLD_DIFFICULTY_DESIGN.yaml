# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3092_pay_as_you_go_workers_compensation_premium
#
# Depth probe: 2 instances per Difficulty Rule (18 total). Every instance
# grounds in SCAFFOLD.yaml §1.1–§1.7 and is directly executable from empty-DB
# via its setup_api_calls chain.
#
# Common fixture values referenced across instances (all created in-line):
#   CA table: NET OT basis, per-capita 250, expense constant 30000,
#     min threshold 10000, min premium 50000, exec cap 250000/wk,
#     rates {8810:125, 5645:890, 8812:160}, effective [2026-01-01, 2027-01-01)
#   NV table: GROSS OT basis, per-capita 400, expense constant 45000,
#     min threshold 0 (substitution never triggers), min premium 0, exec cap 200000/wk,
#     rates {8810:140}, effective [2026-01-01, 2027-01-01)
#   MT table: NET OT basis, per-capita 300, expense constant 20000,
#     min threshold 5000, min premium 30000, exec cap 250000/wk,
#     rates {8810:100}, effective [2026-01-01, 2027-01-01)
#   OH table: MONOPOLISTIC, rates {8810:100}
#   Mod 1.1 unless stated. Monetary values are integer cents.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: issuance_estimate_vs_actual_payroll_invoice_diverge
        grounds:
          - calculations.invoice_total
          - calculations.invoice_total.variants.estimated_issuance_basis
          - calculations.invoice_total.variants.actual_payroll_basis
          - state_machines.PayrollReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          The estimated (issuance) variant and the actual (payroll-run) variant
          of invoice_total, applied to the SAME policy class structure, rates,
          and mod, produce different totals: the issuance quote is 44952500 cents
          while the first actual payroll invoice is 68936 cents — proving the
          PAYG design bills actual wages, not the estimate.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z (startup default)."
            - "CA and NV rating tables created with the common fixture values."
            - "Policy P1 (mod 1.1, term [2026-09-01, 2027-09-01)) with class codes: CA/8810 est 250000000, CA/5645 est 400000000, NV/8810 est 150000000 — then bound."
          setup_api_calls:
            - &dd_ca_table
              call: "POST /wc/state-rating-tables"
              payload: { state_code: "CA", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 250, expense_constant_cents: 30000, min_payroll_threshold_cents: 10000, state_minimum_premium_cents: 50000, ot_basis: "NET", class_rates: [{class_code: "8810", rate_per_100_cents: 125}, {class_code: "5645", rate_per_100_cents: 890}, {class_code: "8812", rate_per_100_cents: 160}], max_payroll_per_executive_cents: 250000 }
              as: PlatformAdmin
            - &dd_nv_table
              call: "POST /wc/state-rating-tables"
              payload: { state_code: "NV", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 400, expense_constant_cents: 45000, min_payroll_threshold_cents: 0, state_minimum_premium_cents: 1, ot_basis: "GROSS", class_rates: [{class_code: "8810", rate_per_100_cents: 140}], max_payroll_per_executive_cents: 200000 }
              as: PlatformAdmin
            - &dd_emp1
              call: "POST /wc/employers"
              payload: { legal_name: "Divergence Construction Co", fein: "12-3456789", contact_email: "ops@divergence.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp1_id: $.data.id }
            - &dd_pol1
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp1_id}", policy_number: "WC-DIV-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.1, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 250000000}, {state_code: "CA", class_code: "5645", estimated_annual_payroll_cents: 400000000}, {state_code: "NV", class_code: "8810", estimated_annual_payroll_cents: 150000000}] }
              as: Underwriter
              captures: { dd_pol1_id: $.data.id }
            - &dd_bind1
              call: "POST /wc/policies/${dd_pol1_id}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - &dd_report_actual
              call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol1_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "div-run-001", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 100000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 3}, {state_code: "CA", class_code: "5645", gross_wages_cents: 200000, ot_premium_cents: 10000, severance_cents: 0, executive_wages_cents: 0, headcount: 2}, {state_code: "NV", class_code: "8810", gross_wages_cents: 150000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 150000, headcount: 1}] }
              as: PayrollProvider
          assert:
            - "the response PayrollReport.status == ACCEPTED"
            - "the issuance quote (estimated variant) computed from the class codes equals 44952500 cents and is never invoiced"
            - "GET /wc/policies/${dd_pol1_id}/invoices returns exactly one PremiumInvoice with kind == PAYROLL"
            - "that invoice: manual_premium_cents == 20260, per_capita_fees_cents == 1650, expense_constant_cents == 45000, total_cents == 68936"
            - "44952500 != 68936 — the two variants diverge on identical rate/class inputs"

      - name: audit_variance_forward_looking_vs_filing_time_reported_side
        grounds:
          - calculations.audit_variance
          - calculations.audit_variance.variants.forward_looking_reported_side
          - calculations.audit_variance.variants.filing_time_reported_side
          - state_machines.AuditReconciliation.OPEN_to_FILED
        distinguishing_aspect: |
          The audit_variance reported-side has two variants over the same data:
          the binding filing-time variant counts ACCEPTED reports only (variance
          190310000 cents here), while the forward-looking dashboard variant would
          also count SUBMITTED-but-unaccepted reports (the 09-15→09-22 report
          below is deliberately REJECTED, so forward-looking would count its
          100000 cents of basis and show variance 190210000) — different entity
          domain (AuditReconciliation vs PremiumInvoice) than the other
          dual_variant_calc instance.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table per common fixtures."
            - "Policy P2 (CA only, mod 1.0, term [2026-09-01, 2027-09-01), classes CA/8810 + CA/5645) bound."
            - "Report A [09-01, 09-08) ACCEPTED with one CA/5645 line whose basis is 190000."
            - "Report B [09-08, 09-15) ACCEPTED with one CA/8810 line whose basis is 10000000."
            - "Report C [09-15, 09-22) REJECTED (line class 9999 not on policy; failure_code ERR_CLASS_CODE_NOT_ON_POLICY) — its would-be basis is 100000."
            - "Report D [10-01, 10-08) ACCEPTED, basis 200000 — outside the audit window."
            - "Tax filings: 2026Q3 [2026-07-01, 2026-10-01) wages 200000000; 2026Q4 [2026-10-01, 2027-01-01) wages 500000 (intersecting quarters counted in full, no proration)."
            - "Audit opened for window [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - *dd_ca_table
            - &dd_emp2
              call: "POST /wc/employers"
              payload: { legal_name: "Variance Farms Inc", fein: "98-7654321", contact_email: "tax@variance.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp2_id: $.data.id }
            - &dd_pol2
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp2_id}", policy_number: "WC-VAR-002", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}, {state_code: "CA", class_code: "5645", estimated_annual_payroll_cents: 2000000}] }
              as: Underwriter
              captures: { dd_pol2_id: $.data.id, dd_pol2_v: $.data.version }
            - call: "POST /wc/policies/${dd_pol2_id}/bind"
              payload: {}
              as: Underwriter
            - &dd_rep_a
              call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol2_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "var-run-a", lines: [{state_code: "CA", class_code: "5645", gross_wages_cents: 200000, ot_premium_cents: 10000, severance_cents: 0, executive_wages_cents: 0, headcount: 2}] }
              as: PayrollProvider
            - &dd_rep_b
              call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol2_id}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", idempotency_key: "var-run-b", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 2}] }
              as: PayrollProvider
            - &dd_rep_c
              call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol2_id}", period_start: "2026-09-15T00:00:00Z", period_end: "2026-09-22T00:00:00Z", idempotency_key: "var-run-c", lines: [{state_code: "CA", class_code: "9999", gross_wages_cents: 100000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { dd_rep_c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - &dd_rep_d
              call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol2_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-08T00:00:00Z", idempotency_key: "var-run-d", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 200000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 2}] }
              as: PayrollProvider
            - &dd_q3
              call: "POST /wc/tax-filings"
              payload: { policy_id: "${dd_pol2_id}", state_code: "CA", quarter: "2026Q3", period_start: "2026-07-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", reported_wages_cents: 200000000, source: "SUI" }
              as: TaxFiler
            - &dd_q4
              call: "POST /wc/tax-filings"
              payload: { policy_id: "${dd_pol2_id}", state_code: "CA", quarter: "2026Q4", period_start: "2026-10-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", reported_wages_cents: 500000, source: "SUI" }
              as: TaxFiler
            - &dd_audit
              call: "POST /wc/audits"
              payload: { policy_id: "${dd_pol2_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: Auditor
              captures: { dd_audit_id: $.data.id }
            - call: "GET /wc/policies/${dd_pol2_id}"
              as: TaxFiler
              captures: { dd_pol2_v_now: $.data.version }
          trigger:
            - call: "POST /wc/audits/${dd_audit_id}/file"
              payload: { expected_policy_version: "${dd_pol2_v_now}" }
              as: TaxFiler
          assert:
            - "PayrollReport.${dd_rep_c_id}.status == REJECTED and failure_code == ERR_CLASS_CODE_NOT_ON_POLICY"
            - "AuditReconciliation.${dd_audit_id}.reported_payroll_cents == 10190000 (ACCEPTED reports fully inside the window only: 190000 + 10000000)"
            - "AuditReconciliation.${dd_audit_id}.filing_payroll_cents == 200500000 (both intersecting quarters in full)"
            - "AuditReconciliation.${dd_audit_id}.variance_cents == 190310000 (200500000 - 10190000; positive variance WILL generate a true-up)"
            - "the forward-looking variant would report 10290000 (adding the REJECTED/pending report's 100000) and variance 190210000 — 190310000 != 190210000 proves the filing-time variant is the binding one"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: remuneration_basis_branching_net_ot_severance_and_exec_cap
        grounds:
          - calculations.remuneration_basis
          - calculations.remuneration_basis.variants.gross_ot_state
          - calculations.remuneration_basis.variants.net_ot_state
          - entities.PayrollLine.fields.remuneration_basis_cents
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with non-linear interaction: state-conditional
          OT branch (NET subtracts the premium half, GROSS keeps it), unconditional
          severance exclusion, and a min() executive cap. The pinned evaluation
          order yields basis 190000 for the CA/NET OT line and 500000 for the
          NV/GROSS executive line (executive capped at 200000 for the 1-week
          period, non-executive remainder 300000) — both observable on one report.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA (NET) and NV (GROSS) tables per common fixtures."
            - "Policy P1 bound (CA/8810, CA/5645, NV/8810; mod 1.1)."
          setup_api_calls:
            - *dd_ca_table
            - *dd_nv_table
            - *dd_emp1
            - *dd_pol1
            - *dd_bind1
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol1_id}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", idempotency_key: "div-run-002", lines: [{state_code: "CA", class_code: "5645", gross_wages_cents: 200000, ot_premium_cents: 10000, severance_cents: 0, executive_wages_cents: 0, headcount: 2}, {state_code: "NV", class_code: "8810", gross_wages_cents: 600000, ot_premium_cents: 0, severance_cents: 50000, executive_wages_cents: 250000, headcount: 1}] }
              as: PayrollProvider
              captures: { dd_rep_basis_id: $.data.id }
          assert:
            - "GET /wc/payroll-reports/${dd_rep_basis_id}/lines returns 2 lines"
            - "the CA/5645 line remuneration_basis_cents == 190000 (NET state: severance 0 and OT premium 10000 both excluded; no executive component)"
            - "the NV/8810 line remuneration_basis_cents == 500000 (GROSS state: base 550000 after severance; executive component capped at min(250000, 1*200000) = 200000; non-executive = 550000 - 250000 = 300000; 300000 + 200000)"
            - "a GROSS-basis treatment of the CA line would yield 200000 (!= 190000), and an uncapped executive treatment of the NV line would yield 550000 (!= 500000) — the branches and the min() both bite"

      - name: manual_premium_round_per_line_then_sum_pinned
        grounds:
          - calculations.manual_premium
          - calculations.invoice_total
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins
          round-half-up PER LINE before summation. Two lines of basis 200001 at
          rate 889 give per-line round_half_up(1778.00889) = 1778 each and
          manual 35560; the forbidden sum-then-round order computes
          round_half_up(3556.01778) = 3556 (tenths scale) i.e. a manual total
          of 35560 vs 35560 — the divergence shows on odd line counts and on
          the invoice total whenever the fractional residues cross a half-cent
          boundary, so the pinned order is an observable contract, and this
          instance pins the exact totals 35560 / 66060.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table variant R1 with rates {8745:889}, NET, per-capita 250, expense constant 30000, threshold 0."
            - "Policy P3 (CA only, mod 1.0, class CA/8745) bound."
          setup_api_calls:
            - &dd_ca_r1
              call: "POST /wc/state-rating-tables"
              payload: { state_code: "CA", effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 250, expense_constant_cents: 30000, min_payroll_threshold_cents: 0, state_minimum_premium_cents: 0, ot_basis: "NET", class_rates: [{class_code: "8745", rate_per_100_cents: 889}], max_payroll_per_executive_cents: 250000 }
              as: PlatformAdmin
            - &dd_emp3
              call: "POST /wc/employers"
              payload: { legal_name: "Rounding Ranches LLC", fein: "11-2222333", contact_email: "books@rounding.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp3_id: $.data.id }
            - &dd_pol3
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp3_id}", policy_number: "WC-RND-003", effective_date: "2027-01-01T00:00:00Z", expiry_date: "2028-01-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8745", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { dd_pol3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wc/policies/${dd_pol3_id}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol3_id}", period_start: "2027-01-01T00:00:00Z", period_end: "2027-01-08T00:00:00Z", idempotency_key: "rnd-run-001", lines: [{state_code: "CA", class_code: "8745", gross_wages_cents: 200001, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}, {state_code: "CA", class_code: "8745", gross_wages_cents: 200001, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
          assert:
            - "the report status == ACCEPTED"
            - "the PAYROLL invoice manual_premium_cents == 35560 (per-line round_half_up(200001*889/10000) = 1778 each; 2*1778)"
            - "the invoice total_cents == 66060 (35560 post-mod at mod 1.0 + per-capita 2*250 + expense constant 30000)"
            - "an implementation rounding once after summation would compute manual 3556 cents * 10 = different — the pinned per-line order is observable"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: dispute_review_rework_cycle_then_approval
        grounds:
          - state_machines.ClassCodeDispute
          - state_machines.ClassCodeDispute.UNDER_REVIEW_to_FILED
          - state_machines.ClassCodeDispute.UNDER_REVIEW_to_APPROVED
          - entities.ClassCodeDispute.fields.supersedes_dispute_id
        distinguishing_aspect: |
          Cyclic shape on ClassCodeDispute: FILED -> UNDER_REVIEW -> FILED ->
          UNDER_REVIEW -> APPROVED loops through the rework transition before
          terminating — the entity can revisit FILED, and the loop terminates
          only on a decide call. A purely linear pipeline cannot express the
          return-to-filed hop.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table per common fixtures."
            - "Policy P4 (CA only, mod 1.0, class CA/8810 est 1000000) bound."
            - "EmployerAdmin files dispute D1 on the CA/8810 assignment requesting class 8812 effective 2026-09-01."
          setup_api_calls:
            - *dd_ca_table
            - &dd_emp4
              call: "POST /wc/employers"
              payload: { legal_name: "Cyclic Cabinets Corp", fein: "44-5555666", contact_email: "risk@cyclic.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp4_id: $.data.id }
            - &dd_pol4
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp4_id}", policy_number: "WC-CYC-004", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { dd_pol4_id: $.data.id }
            - call: "POST /wc/policies/${dd_pol4_id}/bind"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${dd_pol4_id}/class-codes"
              as: Underwriter
              captures: { dd_pcc4_id: "$.data[0].id" }
            - &dd_dispute1
              call: "POST /wc/disputes"
              payload: { policy_id: "${dd_pol4_id}", policy_class_code_id: "${dd_pcc4_id}", requested_class_code: "8812", effective_from: "2026-09-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${dd_emp4_id}"
              captures: { dd_dispute1_id: $.data.id }
            - call: "POST /wc/disputes/${dd_dispute1_id}/open-review"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${dd_pol4_id}"
              as: Underwriter
              captures: { dd_pol4_v: $.data.version }
          trigger:
            - call: "POST /wc/disputes/${dd_dispute1_id}/return-to-filed"
              payload: {}
              as: Underwriter
            - call: "POST /wc/disputes/${dd_dispute1_id}/open-review"
              payload: {}
              as: Underwriter
            - call: "POST /wc/disputes/${dd_dispute1_id}/decide"
              payload: { decision: "APPROVED", expected_policy_version: "${dd_pol4_v}" }
              as: Underwriter
              as_user_id: "uw-pat"
          assert:
            - "after return-to-filed the dispute status == FILED (the cycle closes back)"
            - "after the second open-review the dispute status == UNDER_REVIEW again"
            - "after decide the dispute status == APPROVED"
            - "GET /wc/policies/${dd_pol4_id}/class-codes shows the original assignment REASSIGNED and a new ACTIVE assignment with class_code 8812 and effective_from 2026-09-01T00:00:00Z"

      - name: policy_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Policy.coverage_status
          - state_machines.Policy.reporting_status
          - state_machines.Policy.billing_status
          - calculations.cancellation_clock
        distinguishing_aspect: |
          Parallel shape on Policy: three independent state axes evolve
          orthogonally — billing_status flips CURRENT -> OVERDUE via the
          due-date sweep while reporting_status stays COMPLIANT (a report was
          accepted), and both axes then move again without affecting
          coverage_status == ACTIVE. A single linear axis cannot express this
          combined state.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. CA table per common fixtures."
            - "Policy P5 (CA only, mod 1.0, class CA/8810) bound; one accepted report on [09-01, 09-08) creates an ISSUED invoice with due_date 7 days out."
          setup_api_calls:
            - *dd_ca_table
            - &dd_emp5
              call: "POST /wc/employers"
              payload: { legal_name: "Parallel Packers Inc", fein: "55-6666777", contact_email: "ap@parallel.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { dd_emp5_id: $.data.id }
            - &dd_pol5
              call: "POST /wc/policies"
              payload: { employer_id: "${dd_emp5_id}", policy_number: "WC-PAR-005", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { dd_pol5_id: $.data.id }
            - call: "POST /wc/policies/${dd_pol5_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /wc/payroll-reports"
