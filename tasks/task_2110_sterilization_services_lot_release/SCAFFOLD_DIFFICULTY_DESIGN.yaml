  # ===========================================================================
  # Rule 8 - Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: chamber_occupancy_half_open_with_turnaround_buffer
        grounds:
          - calculations.cycle_occupancy_window
          - validations[priority=75]
          - entities.Chamber.fields.turnaround_minutes
          - entities.Cycle.fields.occupancy_end_at
          - errors[ERR_CHAMBER_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Rule A interval semantics on the Chamber resource: PAIRWISE exclusive,
          BUFFER-EXTENDED by turnaround_minutes, and HALF-OPEN. A cycle starting
          at 06:30 collides with an existing [00:00, 06:00] dwell because the
          60-minute buffer pushes its occupancy_end_at to 07:00, while a cycle
          starting exactly at 07:00 is ACCEPTED because the upper edge is open.
        test_recipe:
          setup:
            - "One GAMMA chamber CH-G1 with turnaround_minutes 60 and one approved recipe RG."
            - "Cycle C-A occupies dwell 2026-08-11T00:00:00Z to 06:00:00Z, so its occupancy_end_at is 2026-08-11T07:00:00Z."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-G1", modality: "GAMMA", pallet_capacity: 8, turnaround_minutes: 60, abatement_efficiency_pct: 0.0 }
              as: RegulatoryAdmin
              captures: { chg1_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RG", modality: "GAMMA", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 0, required_min_zone_dosimeters: 1, required_routine_dosimeters: 1, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${rg_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${rg_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /sterilization/qualifications/${q1_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg1_id}", recipe_id: "${rg_id}", cycle_code: "C-A", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cyc_a_id: $.data.id, cyc_a_v: $.data.version }
          trigger:
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg1_id}", recipe_id: "${rg_id}", cycle_code: "C-B", scheduled_start_at: "2026-08-11T06:30:00Z", scheduled_end_at: "2026-08-11T12:30:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { conflict_err: $.data.error_id }
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg1_id}", recipe_id: "${rg_id}", cycle_code: "C-C", scheduled_start_at: "2026-08-11T07:00:00Z", scheduled_end_at: "2026-08-11T13:00:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cyc_c_id: $.data.id, cyc_c_occ: $.data.occupancy_end_at }
          assert:
            - "Cycle.${cyc_a_id}.occupancy_end_at == 2026-08-11T07:00:00Z"
            - "${conflict_err} == ERR_CHAMBER_WINDOW_CONFLICT with HTTP 409"
            - "the C-C creation returns HTTP 201 and ${cyc_c_id} is non-null"
            - "${cyc_c_occ} == 2026-08-11T14:00:00Z"
            - "GET /sterilization/cycles?chamber_id=${chg1_id} returns total_count == 2 (C-A and C-C only)"

      - name: permit_eto_concurrency_closed_interval_aggregate_cap
        grounds:
          - calculations.cycle_occupancy_window
          - validations[priority=78]
          - entities.EmissionPermit.fields.max_concurrent_eto_cycles
          - errors[ERR_PERMIT_CONCURRENCY_EXCEEDED]
        distinguishing_aspect: |
          Rule B interval semantics on the EmissionPermit resource, geometrically
          different from Rule A in three ways: it is an AGGREGATE COUNT against
          max_concurrent_eto_cycles rather than a pairwise test, it uses NO
          turnaround buffer, and its dwell intervals are CLOSED, so a cycle in a
          different chamber starting exactly at 06:00:00Z collides with an
          existing dwell ending at 06:00:00Z while one starting at 06:00:01Z does
          not.
        test_recipe:
          setup:
            - "Permit AP-2026 has max_concurrent_eto_cycles 1 and backs two ETO chambers CH-E1 and CH-E2, both with turnaround_minutes 0."
            - "Cycle C-A occupies chamber CH-E1 with dwell 2026-08-11T00:00:00Z to 06:00:00Z and is PLANNED (non-terminal)."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
