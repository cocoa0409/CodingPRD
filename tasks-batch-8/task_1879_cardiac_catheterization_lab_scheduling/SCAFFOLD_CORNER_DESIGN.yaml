  - section: validations
    instances:
      - name: schedule_elective_without_auc_returns_auc_required
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_AUC_REQUIRED]"]
        distinguishing_aspect: "An otherwise valid schedule request for an ELECTIVE case with auc_status NOT_DOCUMENTED is rejected ERR_AUC_REQUIRED (422); URGENT/STEMI are exempt."
        test_recipe:
          setup: ["ELECTIVE case POSTED (no attestation); room R ACTIVE; bed B1 AVAILABLE"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_AUC_REQUIRED"
            - "CathCase.${case_id}.status remains POSTED; RecoveryBed.${bed1_id} remains AVAILABLE"

      - name: urgent_case_schedules_without_auc_satisfaction_pass
        claim_type: satisfaction_pass
        grounds: ["validations[priority=6]", "state_machines.CathCase.POSTED_to_SCHEDULED"]
        distinguishing_aspect: "The AUC rule applies only to ELECTIVE: an URGENT case with auc_status NOT_DOCUMENTED schedules successfully."
        test_recipe:
          setup: ["URGENT case POSTED (no attestation); room R; bed B1"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
              captures: { st: $.data.status, end: $.data.scheduled_end }
          assert:
            - "HTTP 200; status == SCHEDULED; scheduled_end == 2026-08-10T10:30:00Z (PCI 90 + 0 setup)"

      - name: auc_self_attestation_returns_ordering_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_AUC_ORDERING_CONFLICT]"]
        distinguishing_aspect: "Segregation of duties: the performing physician cannot be the ordering physician — ordering_physician_id == performing_physician_id is rejected ERR_AUC_ORDERING_CONFLICT (403)."
        test_recipe:
          setup: ["ELECTIVE case POSTED with performing physician P1"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys1_id}", auc_score: APPROPRIATE, criterion_code: "AUC-45.1", expected_case_version: "${case_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; error_id == ERR_AUC_ORDERING_CONFLICT"
            - "CathCase.${case_id}.auc_status remains NOT_DOCUMENTED and version unchanged"

      - name: auc_actor_must_be_the_ordering_physician
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_AUC_ORDERING_CONFLICT]"]
        distinguishing_aspect: "The acting cardiologist's X-User-ID must equal ordering_physician_id; an attestation signed by P2 but sent by P3 is rejected ERR_AUC_ORDERING_CONFLICT."
        test_recipe:
          setup: ["ELECTIVE case POSTED (performing P1); cardiologists P2 and P3 exist"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
