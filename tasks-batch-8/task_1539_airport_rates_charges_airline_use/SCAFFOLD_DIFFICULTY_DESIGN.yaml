              as: AirportFinance
              captures: { rs_cas_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_cas_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_cas_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_cas_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${cas_air_id}"
            - call: "POST /airport/fiscal_years/{fy_cas_id}/activity_records"
              payload: { airline_id: "${cas_air_id}", activity_date: "2026-09-10T00:00:00Z", landed_weight_kg: 1000, signature_status_at_activity: "SIGNATORY" }
