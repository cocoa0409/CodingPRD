          assert:
            - "the response status is 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "SettlementStatement.${s_c1} stays ISSUED"

      - name: segregation_certifier_equals_submitter
        claim_type: Segregation of duties
        grounds:
          - validations[priority=8]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Four-eyes grading: the grader who submitted the scores (qg-1) cannot certify them — 422 ERR_SEGREGATION_OF_DUTIES; a fresh grader (qg-2) certifies fine."
        test_recipe:
          setup: ["Canonical chain through H1 graded SUBMITTED by qg-1 (received by co-1)."]
