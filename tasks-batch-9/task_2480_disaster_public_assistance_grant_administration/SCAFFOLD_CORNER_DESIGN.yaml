        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z with declaration DR-4992 already created."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
