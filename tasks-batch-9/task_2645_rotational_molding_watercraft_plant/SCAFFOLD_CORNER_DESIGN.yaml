        distinguishing_aspect: "Two identical hulls whose nested cubes are 1.2345 and 0.6173 both fit individually on a 1.8517 m3 trailer, but the second line pushes the rollup to 1.8518 and must fail 409 ERR_TRAILER_CUBE_EXCEEDED, while a 1.8518 m3 trailer accepts the identical pair exactly at its bound."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVT (gross_cube_m3 1.2345, nest_factor 0.5000, unit_weight_kg 30.000) with the 4-cavity mould MLD-CVT-1, oven OV-CVS, bay CB-CVS, site WH-CVA and resin lot LOT-CVS."
            - "ProductionOrder PO-CVT ran one cycle and produced four SELLABLE hulls fu1..fu4, all STORED at WH-CVA."
            - "Two empty PLANNED trailers on zone Z2: SHP-CVJ-A with trailer_cube_capacity_m3 1.8518 and SHP-CVJ-B with 1.8517, both with trailer_max_payload_kg 1000.000."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvT_pm
