              as: ChainAdmin
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 300000, requested_purchase_amount_cents: 300000, down_payment_cents: 30000 }
              as: SalesAssociate
              captures: { app_a_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 300000, requested_purchase_amount_cents: 300001, down_payment_cents: 30000 }
              as: SalesAssociate
              captures: { app_b_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { customer_id: "${customer_id}", store_id: "${store_id}", requested_limit_cents: 300000, requested_purchase_amount_cents: 300050, down_payment_cents: 30000 }
