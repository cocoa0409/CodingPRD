  - section: cross_cutting_layers
    instances:
      - name: risk_limit_create_with_stale_desk_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[risk-limit-create-stale-desk]
          - errors[ERR_STALE_DESK_VERSION]
        distinguishing_aspect: "Two strictly sequential creates carrying the same observed desk version: the first succeeds and advances TradingDesk.version, the second is refused with ERR_STALE_DESK_VERSION (412) and leaves the first limit ACTIVE."
        test_recipe:
          setup:
            - "One desk whose version has been read once and not re-read."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD51", name: "Corner Desk 51", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id, dv0: $.data.version }
            - call: "POST /grain/risk-limits"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", max_unpriced_bushels: 100000, max_net_short_lots: 40, expected_desk_version: "${dv0}" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { rl1_id: $.data.id }
          trigger:
            - call: "POST /grain/risk-limits"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", max_unpriced_bushels: 200000, max_net_short_lots: 60, expected_desk_version: "${dv0}" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_DESK_VERSION"
            - "the response status is 412"
            - "RiskLimit.${rl1_id}.status == ACTIVE and max_unpriced_bushels == 100000"
            - "GET /grain/risk-limits?desk_id=${desk_id} returns total_count == 1"

      - name: freight_booking_create_with_stale_fleet_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[freight-booking-create-stale-fleet]
          - errors[ERR_STALE_FLEET_VERSION]
        distinguishing_aspect: "The second booking's window does not intersect the first, so it would be accepted on its own merits; it is refused only because expected_fleet_version still carries the pre-booking value, yielding ERR_STALE_FLEET_VERSION (412)."
        test_recipe:
          setup:
            - "Desk, rail-served elevator, SHORT 2026-12 hedge with 10 lots, ACTIVE basis -32 bid, one 20,000-bushel CASH contract, one 60-car fleet and one booking already placed with the fleet's original version."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD52", name: "Corner Desk 52", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid_id: $.data.id }
            - call: "POST /grain/bids/${bid_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid_id}", hedge_position_id: "${hp_id}", contract_type: "CASH", bushels: 20000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_id: $.data.id }
            - call: "POST /grain/rail-fleets"
              payload: { home_location_id: "${loc_id}", fleet_code: "FLT-A", car_count: 60 }
              as: FreightCoordinator
              as_user_id: "u-freight-1"
              captures: { fleet_id: $.data.id, fv0: $.data.version }
