            - "Bill introduced from a DRAFT_READY request with appropriation_requested_cents 12000000, so it starts at fiscal_status NOTE_PENDING."
            - "One referral with hearing window [2026-10-05T14:00:00Z, 2026-10-05T16:00:00Z), giving report_deadline_utc 2026-10-12T16:00:00Z."
            - "An INCREMENTAL_COST note certified at 26568000 from the standard two-line set, so fiscal_status reaches NOTE_COMPLETE and the session ledger reads 26568000 with posture NORMAL."
            - "Clock advanced to 2026-10-06T00:00:00Z, the referral reported FAVORABLE (bill legislative_status REPORTED), and a FLOOR amendment with fiscal_impact_delta_cents 500000 drafted."
