            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}", captures: { as1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}", captures: { iv1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/patient-cases/${c1}/clock-suspensions", payload: { reason: "AWAITING_PATIENT" }, as: IntakeCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T09:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/withdraw", payload: { withdraw_reason: "Patient moved away" }, as: IntakeCoordinator, captures: { cst: $.data.lifecycle_status } }
