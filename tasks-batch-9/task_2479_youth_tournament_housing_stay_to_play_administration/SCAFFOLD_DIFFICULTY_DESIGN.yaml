  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cancellation_free_tier_boundary_exact_45_days
        grounds:
          - calculations.cancellation_penalty
          - entities.Booking.fields.penalty_room_nights
          - entities.Booking.fields.penalty_cents
          - endpoints[POST /housing/bookings/{id}/cancel]
        distinguishing_aspect: |
          Metric is days_out, the floor of whole days between the logical clock and check-in
          00:00:00Z, measured on POST /housing/bookings/{id}/cancel. CANCEL_FREE_TIER_DAYS is 45
          and the comparison is inclusive. Cancelling at exactly 45 days out is free; a clock one
          day later gives 44 and lands in the quarter tier, where ceil(12 * 0.25) is 3 room
          nights and 3 * 14900 is 44700 cents. An exclusive comparison, or a rounding of days_out
          instead of a floor, changes the 45-day answer from 0 to 44700.
        test_recipe:
          setup:
            - "Tournament runs 2026-09-15 to 2026-09-18 (night_count 3) with booking_deadline 2026-09-10T00:00:00Z."
            - "One EXECUTED HotelContract at negotiated_nightly_rate_cents 14900 with an 8-room block spanning 2026-09-15 to 2026-09-18."
            - "Two registrations of 13 players and 3 staff each (required_rooms_registered 6), each holding a DRAFT booking of 4 rooms with projected_room_nights 12 and check_in_date 2026-09-15."
            - "The logical clock starts at its default 2026-08-01T00:00:00Z, which is exactly 45 days before check-in."
