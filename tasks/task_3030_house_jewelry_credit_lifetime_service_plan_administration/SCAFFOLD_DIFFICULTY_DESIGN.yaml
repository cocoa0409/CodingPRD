          setup:
            - "Logical clock set so a PROMO_12_6M plan on a 450018 ticket reaches dt=196 days, then run past the default horizon. Store 0142 OPEN and ACTIVE. Customer Nina OPEN with an approved application, purchase P1 financed by plan PL."
