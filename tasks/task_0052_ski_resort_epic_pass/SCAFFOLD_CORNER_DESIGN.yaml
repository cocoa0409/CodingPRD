      - name: list_passes_pagination_envelope
        claim_type: pagination
        grounds:
          - endpoints.GET_/passes
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /passes?limit=1&offset=0 with two passes returns 1 item, total_count=2, has_more=true."
