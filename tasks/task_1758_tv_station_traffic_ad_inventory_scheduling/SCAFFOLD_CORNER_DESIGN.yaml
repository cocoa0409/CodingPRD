              as: TrafficManager
              captures: { unit_id: "$.data.id",  unit_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id"}
            - call: "POST /traffic/orders/${order_id}/lines"
              payload: { program_id: "${prog_id}", weeks_requested: 1, spots_per_week: 2, spot_length_seconds: 30, gross_rate_cents: 5000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order_id}"
              payload: {}
              as: SalesRep
              captures: { order_v: "$.data.version"}
            - call: "POST /traffic/orders/${order_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { s1_id: "$.data[0].id",  s2_id: "$.data[1].id"}
          trigger:
            - call: "POST /traffic/spots/${s1_id}/place"
              payload: { avail_unit_id: "${unit_id}", expected_avail_unit_version: "${unit_v0}" }
              as: TrafficManager
            - call: "POST /traffic/spots/${s2_id}/place"
              payload: { avail_unit_id: "${unit_id}", expected_avail_unit_version: "${unit_v0}" }
              as: TrafficManager
              captures: { err: "$.data.error_id"}
          assert:
            - "first place succeeds (version matches)"
            - "${err} == ERR_STALE_AVAIL_VERSION (412) — the first placement incremented AvailUnit.version, so the captured ${unit_v0} is stale for the second call"
            - "Spot.${s2_id}.status stays PENDING_PLACEMENT"
      - name: derived_fields_reconciled_on_preempt_and_replace
        claim_type: derived_field_reconciliation
        grounds: [entities.AvailUnit.fields.booked_commercial_seconds]
        distinguishing_aspect: "booked_commercial_seconds tracks placement (+30) and preemption (-30) exactly; a read after each mutation shows the denormalized counter consistent with the unit's SCHEDULED spots."
        test_recipe:
          setup: ["advertiser, program (weekday 6), week, unit (2026-08-08, 60s), approved order (30s x 1, guarantee 0), spot placed"]
          setup_api_calls:
            - call: "POST /traffic/advertisers"
