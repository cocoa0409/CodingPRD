            - call: "GET /reporting-persons/${p_id}"
              as: ComplianceOfficer
              captures: { oc_before: $.data.open_obligation_count }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-06", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { t_status: $.data.status }
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_4", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f4_ddl: "$.data[0].filing_deadline" }
            - call: "GET /reporting-persons/${p_id}"
              as: ComplianceOfficer
              captures: { oc_after: $.data.open_obligation_count }
          assert:
            - "oc_before == 1 (the designation Form 3 draft)"
            - "t_status == CONFIRMED"
            - "f4_ddl == \"2026-08-10\" (hop 1: auto Form 4 created with deadline = 2026-08-06 + 2 business days)"
            - "oc_after == 2 (hop 2: obligation count recomputed because the filing was created)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_exit_person_future_date_state_wins
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_PERSON_NOT_ACTIVE]
          - errors[ERR_FUTURE_TRANSACTION_DATE]
        distinguishing_aspect: |
          Category pair {state vs business_temporal}: the confirm violates both
          the cross-entity state rule (person EXITED, priority 6) and the
          temporal rule (transaction_date after the clock date, priority 8);
          priority 6 wins — a different error-category pair than the sibling
          instance's {business_safety vs business_constraint}.
        test_recipe:
          setup:
            - "Issuer I; person P designated ACTIVE at clock 2026-08-03, then EXITED at clock 2026-08-05"
            - "Transaction for P with transaction_date 2026-08-20 (later than the clock date 2026-08-05), ingested by epa_1"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "EXIT" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-20", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERSON_NOT_ACTIVE (state-category priority 6 beats business_temporal priority 8; the future-dated transaction is never reported)"

      - name: submit_sod_and_bad_credentials_sod_wins
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_SOD_PREPARER_SUBMITTER]
          - errors[ERR_EDGAR_CREDENTIAL_MISMATCH]
        distinguishing_aspect: |
          Category pair {business_safety vs business_constraint}: the submit
          violates both the segregation-of-duties guard (submitter == preparer,
          priority 7) and the EDGAR credential constraint (wrong CCC, priority
          9); priority 7 wins — a different error-category pair than the sibling
          instance's {state vs business_temporal}.
        test_recipe:
          setup:
            - "Issuer I with edgar_ccc CCC12345; person P designated ACTIVE at the default clock 2026-08-01"
            - "Manual FORM_3 filing prepared by FilingCoordinator coord_1 (prepared_by_user_id == coord_1), moved to READY"
            - "ACTIVE agent authorizations exist for BOTH agent_1 and coord_1 (so the authorization check at priority 6 passes for coord_1)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /filing-agent-authorizations"
              payload: { issuer_id: "${i_id}", agent_user_id: "agent_1" }
              as: ComplianceOfficer
            - call: "POST /filing-agent-authorizations"
              payload: { issuer_id: "${i_id}", agent_user_id: "coord_1" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /filings"
              payload: { issuer_id: "${i_id}", reporting_person_id: "${p_id}", form_type: "FORM_3" }
              as: FilingCoordinator
              as_user_id: "coord_1"
              captures: { f_id: $.data.id }
            - call: "POST /filings/${f_id}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
          trigger:
            - call: "POST /filings/${f_id}/submit"
              payload: { edgar_ccc: "WRONGCCC" }
              as: FilingAgent
              as_user_id: "coord_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SOD_PREPARER_SUBMITTER (business_safety priority 7 beats business_constraint priority 9; the wrong CCC is never evaluated as the winning error)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: ownership_pct_exactly_five_triggers
        grounds:
          - calculations.beneficial_ownership_pct
          - state_machines.BeneficialHolder.MONITORING_to_FILING_REQUIRED
        distinguishing_aspect: |
          Numeric-percentage boundary on POST /beneficial-holders/{id}/positions:
          current_pct == 4.99 leaves the holder MONITORING while exactly 5.00
          triggers FILING_REQUIRED (>= semantics) — a different metric and
          endpoint than the sibling instance's deadline-date boundary.
        test_recipe:
          setup:
            - "Issuer I with shares_outstanding 1,000,000; holder H in MONITORING (default clock 2026-08-01)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /beneficial-holders"
              payload: { issuer_id: "${i_id}", holder_name: "Big Fund LP" }
              as: ComplianceOfficer
              captures: { h_id: $.data.id }
            - call: "POST /beneficial-holders/${h_id}/positions"
              payload: { shares_delta: 49900, derivative_shares_delta: 0, effective_date: "2026-08-01" }
              as: ComplianceOfficer
            - call: "GET /beneficial-holders/${h_id}"
              as: ComplianceOfficer
              captures: { pct_below: $.data.current_pct, st_below: $.data.status }
          trigger:
            - call: "POST /beneficial-holders/${h_id}/positions"
              payload: { shares_delta: 100, derivative_shares_delta: 0, effective_date: "2026-08-01" }
              as: ComplianceOfficer
            - call: "GET /beneficial-holders/${h_id}"
              as: ComplianceOfficer
              captures: { pct_at: $.data.current_pct, st_at: $.data.status }
          assert:
            - "pct_below == 4.99 AND st_below == MONITORING (49,900 / 1,000,000 = 4.99 < 5.00)"
            - "pct_at == 5.00 AND st_at == FILING_REQUIRED (50,000 / 1,000,000 = 5.00; equality crosses)"

