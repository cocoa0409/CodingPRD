        distinguishing_aspect: |
          RESOURCE: a Vehicle wheel position — a physical, capacity-1 resource, and a third
          distinct resource entity. INTERVAL SEMANTICS: OPEN-ENDED OCCUPANCY with no end
          instant at all; the occupation lasts until an explicit pull, so exclusion is decided
