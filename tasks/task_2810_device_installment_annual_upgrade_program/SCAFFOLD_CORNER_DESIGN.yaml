  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: a_stale_expected_loan_version_is_refused_and_the_re_read_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.upgrade-request-create-stale-loan
          - validations.priority_45_ERR_STALE_LOAN_VERSION
          - endpoints.POST_/upgrade-requests
          - entities.InstallmentLoan.fields.version
        distinguishing_aspect: |
          The declared OCC rule is exercised on its declared write endpoint and occ_field: a
          1000-cent posting between the client's read and its write advances
          InstallmentLoan.version, so the request carrying the pre-payment version is refused
          with HTTP 412 ERR_STALE_LOAN_VERSION even though every business precondition still
          holds (ratio is still 5000). The refusal is side-effect free — the version does not
          move, no slot is reserved, no hold is set — and re-reading and re-posting succeeds and
          increments the version by exactly one.
        test_recipe:
          setup:
            - "Eligible Handset B loan at 2027-06-27 (12 installments paid, handset activated); the client reads the version, then a 1000-cent partial payment lands on installment 13."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_b: "$.data.id" }
            - call: "POST /device-models"
              payload: { sku: "MDL-A", display_name: "Handset A", retail_price_cents: 119900, monthly_protection_premium_cents: 1199, trade_in_base_credit_cents: 60000, generation_year: 2027 }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
              captures: { m_a: "$.data.id" }
            - call: "POST /customers"
              payload: { full_name: "Ulla Norrback", email: "ulla.norrback@example.com", mobile_number: "+15550100059" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /customers/${cust}/carrier-accounts"
              payload: { carrier_code: "ATT", account_number: "ACC-2810-0059" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { carr: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643043" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "GET /device-units"
              payload: { loan_id: "${loan}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { dev: "$.data[0].id" }
            - call: "POST /device-units/${dev}/activation"
              payload: { carrier_account_id: "${carr}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 56940 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-27T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u-admin-1"
            - call: "GET /loans/${loan}"
              payload: {}
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { v_stale: "$.data.version" }
            - call: "POST /loans/${loan}/payments"
              payload: { posting_type: "PAYMENT", amount_cents: 1000 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /loans/${loan}"
              payload: {}
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { v_fresh: "$.data.version" }
          trigger:
            - call: "POST /upgrade-requests"
              payload: { loan_id: "${loan}", target_device_model_id: "${m_a}", fulfillment_window_start: "2027-06-27T00:00:00Z", expected_loan_version: "${v_stale}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { e_stale: "$.data.error_id" }
            - call: "POST /upgrade-requests"
              payload: { loan_id: "${loan}", target_device_model_id: "${m_a}", fulfillment_window_start: "2027-06-27T00:00:00Z", expected_loan_version: "${v_fresh}" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { ur: "$.data.id" }
          assert:
            - "${v_fresh} == ${v_stale} + 1 (the 1000-cent posting incremented the loan version)"
            - "the stale-version request returns HTTP 412 with error_id ERR_STALE_LOAN_VERSION"
            - "after the refusal InstallmentLoan.${loan}.version == ${v_fresh}, upgrade_hold_flag == false, DeviceModel.${m_a}.reserved_slot_count == 0 and GET /upgrade-requests?loan_id=${loan} returns total_count == 0"
            - "the fresh-version request returns HTTP 201 with status == ELIGIBILITY_PASSED, eligibility_ratio_bps == 5000 and paid_installment_count_at_request == 12"
            - "InstallmentLoan.${loan}.version == ${v_fresh} + 1 and upgrade_hold_flag == true"
            - "InstallmentLoan.${loan}.obligation_balance_cents == 55936 and installment 13 is PARTIALLY_PAID (the partial payment did not raise paid_installment_count above 12)"
            - "DeviceModel.${m_a}.reserved_slot_count == 1"

      - name: a_default_declaration_propagates_through_three_entity_levels
        claim_type: cascading_side_effects
        grounds:
          - state_machines.InstallmentLoan.delinquency_state.DELINQUENT_to_DEFAULTED
          - state_machines.Customer.ACTIVE_to_FINANCING_LOCKED
          - state_machines.UpgradeRequest.to_EXPIRED
        excluded_because:
          difficulty_instance: default_declaration_cascade_customer_lock_apps_void_upgrade_expire
          rationale: |
            The end-to-end chain is that instance's whole subject: one sweep drives the loan to
            DEFAULTED, locks the Customer, voids the customer's SUBMITTED applications, expires
            the live UpgradeRequest with expiry_reason CUSTOMER_FINANCING_LOCKED, releases the
            model reservation and cancels the pending trade-in — with the untouched second
            customer asserted as the negative control for over-cascade.

      - name: closure_touches_only_the_children_that_are_still_open
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Installment.SCHEDULED_to_VOIDED
          - state_machines.InstallmentLoan.status.ACTIVE_to_PAID_OFF
        excluded_because:
          difficulty_instance: program_cancellation_cascade_loan_payoff_device_unlock_carrier_port_eligible
          rationale: |
            Ordering sensitivity and partial application are both covered there: cancellation
            closes the loan, voids only the unsatisfied installments with void_reason
            LOAN_CLOSED while leaving the PAID ones untouched, unlocks the handset and flips the
            carrier account to PORT_ELIGIBLE in one call.

      - name: the_two_payoff_variants_diverge_on_identical_loan_state
        claim_type: dual_variant_calculation
        grounds:
          - calculations.payoff_quote.variants
          - calculations.unearned_premium_rebate
        excluded_because:
          difficulty_instance: payoff_quote_variant_divergence_cancellation_vs_rollover
          rationale: |
            That instance draws both quotes on the same loan in the same instant and pins the
            exact delta (rule-of-78 unearned 6234 giving a 38714 rollover total versus pro-rata
            rebate 10789 plus the 2500 admin fee giving 36659), which is precisely the
            divergence claim for this layer.

      - name: the_cumulative_payment_threshold_fires_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.upgrade_eligibility_ratio
          - validations.priority_100_ERR_UPGRADE_THRESHOLD_NOT_MET
        excluded_because:
          difficulty_instance: upgrade_paid_installment_count_exactly_twelve_vs_eleven
          rationale: |
            The cumulative trigger is tested at the boundary there — 12 paid installments give
            exactly 5000 bps and pass, 11 give 4583 and fail — including the proof that a
            partially paid installment does not count toward the cumulative total.

      - name: the_days_past_due_threshold_fires_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.delinquency_progression
          - state_machines.InstallmentLoan.delinquency_state.DELINQUENT_to_DEFAULTED
        excluded_because:
          difficulty_instance: default_declared_at_dpd_ninety_not_eighty_nine
          rationale: |
            The instantaneous trigger is tested at its boundary there: the sweep at 89 days past
            due leaves the loan DELINQUENT and the sweep on the 90th day declares DEFAULT, with
            the counters and the delinquency-event ledger asserted on both days.

