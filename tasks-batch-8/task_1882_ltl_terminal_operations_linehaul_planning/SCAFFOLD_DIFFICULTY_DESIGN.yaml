            - { call: "GET /ltl/trailers/${tr_id}", payload: {}, as: DockSupervisor, captures: { tr_v1: $.data.version } }
            - { call: "POST /ltl/trailers/${tr_id}/mark-ready", payload: {}, as: DockSupervisor }
            - { call: "POST /ltl/trailers/${tr_id}/seal", payload: { expected_trailer_version: "${tr_v1}" }, as: DockSupervisor }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_chi}", destination_terminal_id: "${t_kc}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-02T10:00:00Z", planned_arrival_utc: "2026-08-02T14:00:00Z", relay_sequence: 1 }, as: Dispatcher, captures: { leg1: $.data.id } }
          trigger:
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_kc}", destination_terminal_id: "${t_den}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-02T14:44:00Z", planned_arrival_utc: "2026-08-02T18:00:00Z", relay_sequence: 2 }, as: Dispatcher, captures: { err44: $.data.error_id } }
            - { call: "POST /ltl/linehaul-legs", payload: { origin_terminal_id: "${t_kc}", destination_terminal_id: "${t_den}", trailer_id: "${tr_id}", planned_departure_utc: "2026-08-02T14:45:00Z", planned_arrival_utc: "2026-08-02T18:00:00Z", relay_sequence: 2 }, as: Dispatcher, captures: { leg2: $.data.id } }
          assert:
            - "44-minute gap rejected: ${err44} == ERR_RELAY_CONNECT_INFEASIBLE"
            - "Exactly-45-minute gap accepted: LinehaulLeg.${leg2}.status == PLANNED (buffered-adjacency semantics, >= inclusive)"

      - name: pickup_stop_shift_window_closed_interval
        grounds:
          - validations[priority=11]
        distinguishing_aspect: |
          Resource = driver shift minutes on PickupRoute; semantics = closed interval
          containment — a stop at exactly shift_start_minute (480) or shift_end_minute
          (1020) is legal, while 479 or 1021 is rejected with ERR_STOP_OUTSIDE_SHIFT.
          Different interval semantics than the relay's buffered gap (containment, no buffer).
        test_recipe:
          setup:
            - "Route shift [480, 1020]; three shipments tendered"
          setup_api_calls:
