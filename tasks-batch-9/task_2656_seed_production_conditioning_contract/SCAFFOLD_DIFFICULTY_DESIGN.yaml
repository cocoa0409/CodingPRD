              as: ConditioningManager
          assert:
            - "INVARIANT BEFORE: 41000.0 == 34501.25 + 6498.75"
            - "INVARIANT AFTER: SeedLot.${lot_id}.gross_kg == 41000.0 and current_kg == 36000.0 and cumulative_shrink_kg == 5000.0, so 41000.0 == 36000.0 + 5000.0 exactly"
            - "SeedLot.${lot_id}.bag_count == 0 and SeedLot.${lot_id}.final_clean_units == null (both derived fields returned to their pre-bagging values)"
            - "SeedLot.${lot_id}.conditioning_status == SIZED and certification_status == UNSAMPLED"
            - "SeedLot.${lot_id}.dockage_pct == 12.20 (recomputed against current_kg 36000.0, not left at the bagged 15.85)"
            - "ConditioningRun.${r3_id}.status == REVERSED and reversal_reason is stored; shrink_kg stays 1498.75 on the reversed run for audit"
            - "ConditioningRun.${r1_id}.status == COMPLETED and ConditioningRun.${r2_id}.status == COMPLETED (only the latest completed run reversed)"

