      - name: cascading_side_effects_reach_four_levels_from_one_accepted_payment
        claim_type: "cascading_side_effects"
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Claim.APPROVED_to_CLOSED_PAID
        distinguishing_aspect: "One accepted payment must propagate through the reserve journal, the coverage term, the claim status, the builder's incurred ledger, the monitoring posture and the sibling policy's enrollment hold, end to end and in that order."
        excluded_because:
          difficulty_instance: "single_payment_propagates_six_links_to_a_sibling_policy_enrollment_hold"
          rationale: "That instance already verifies the full six-link chain end to end from a single request and asserts each intermediate value, so a shorter corner test would assert a prefix of the same chain."

