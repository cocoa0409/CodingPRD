# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_1207_theatrical_rights_licensing
# 9 rules × 2 instances = 18 instances
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_quoted_vs_settled_diverge_on_actual_gross
        grounds:
          - calculations.performance_royalty
          - state_machines.LicenseApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.Performance.SCHEDULED_to_HELD
          - entities.LicenseAgreement.fields.quoted_royalty_total_cents
          - entities.LicenseAgreement.fields.settled_royalty_total_cents
        distinguishing_aspect: |
          QUOTED variant computes royalty from application.projected_gross_cents at issuance;
          SETTLED variant computes from performance.reported_gross_cents after reports.
          For identical contracted shape, when reported gross != projected gross the two
          variants produce different cents on the LicenseAgreement (royalty domain).
        test_recipe:
          setup:
            - "Title T with royalty_basis=HYBRID, base_flat_fee_cents=100000, gross_percent_bp=800 (8%)"
            - "Organization O (COMMUNITY, GOOD)"
            - "Application submitted with venue_seating_capacity=250 (tier2 mult 1.25), ticket_top_price_cents=2000, performers_compensated=false, admission_charged=true, projected_gross_cents=800000, performance_count=2, classification resolves AMATEUR"
            - "Application approved -> Agreement A in PENDING_PAYMENT with quoted_royalty_total_cents computed via QUOTED"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "Hybrid Play", author: "A", title_kind: "PLAY", royalty_basis: "HYBRID", base_flat_fee_cents: 100000, gross_percent_bp: 800, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Community Troupe", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 250, ticket_top_price_cents: 2000, performers_compensated: false, admission_charged: true, projected_gross_cents: 800000, performance_count: 2, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-02T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id, quoted_total: $.data.quoted_royalty_total_cents }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/agreements/${agreement_id}/performances"
              payload: { performance_at: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { perf1_id: $.data.id }
            - call: "POST /licensing/agreements/${agreement_id}/performances"
              payload: { performance_at: "2026-06-02T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { perf2_id: $.data.id }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/performances/${perf1_id}/report"
              payload: { reported_attendance: 220, reported_gross_cents: 500000 }
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/performances/${perf2_id}/report"
              payload: { reported_attendance: 240, reported_gross_cents: 700000 }
              as: Applicant
              as_user_id: "${org_id}"
          assert:
            - "LicenseAgreement.${agreement_id}.quoted_royalty_total_cents == computed via QUOTED with projected_gross_cents=800000"
            - "Performance.${perf1_id}.royalty_cents computed via SETTLED over reported_gross_cents=500000 != the QUOTED per-performance value"
            - "QUOTED total != sum of SETTLED per-performance royalty_cents when reported gross (1200000) != projected gross (800000)"

      - name: overdue_fee_projected_vs_actual_diverge_on_return_date
        grounds:
          - calculations.overdue_fine_rule
          - state_machines.MaterialRental.SHIPPED_to_OVERDUE
          - state_machines.MaterialRental.OVERDUE_to_RETURNED
          - entities.MaterialRental.fields.accrued_late_fee_cents
        distinguishing_aspect: |
          PROJECTED variant accrues fee through the sweep clock on the day the rental flips
          OVERDUE; ACTUAL variant accrues through returned_at on receive_return. Same rental,
          same due_date, different evaluation_clock, so accrued_late_fee_cents differs —
          this is a fine-accrual domain distinct from the royalty domain.
        test_recipe:
          setup:
            - "Title T (non-restricted) with late_fee_per_day_cents=500, rental_deposit_cents=20000"
            - "Agreement A ACTIVE under Organization O"
            - "MaterialRental R created with due_date=2026-06-10T00:00:00Z, scripts_qty=5, scores_qty=0"
            - "R shipped, received, return shipped"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "Plain Play", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Amateur Group", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-05-15T19:00:00Z", last_performance_date: "2026-05-15T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/rentals"
              payload: { agreement_id: "${agreement_id}", scripts_qty: 5, scores_qty: 0, due_date: "2026-06-10T00:00:00Z" }
              as: MaterialsClerk
              captures: { rental_id: $.data.id }
            - call: "POST /licensing/rentals/${rental_id}/ship"
              payload: {}
              as: MaterialsClerk
            - call: "POST /licensing/rentals/${rental_id}/mark_received"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/rentals/${rental_id}/ship_return"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/rentals/${rental_id}/receive_return"
              payload: {}
              as: MaterialsClerk
              captures: { final_fee: $.data.accrued_late_fee_cents }
          assert:
            - "On OVERDUE sweep at 2026-06-13, accrued_late_fee_cents (PROJECTED) == 3 * 500 == 1500"
            - "After receive_return at 2026-06-15, accrued_late_fee_cents (ACTUAL) == 5 * 500 == 2500"
            - "ACTUAL variant exceeds PROJECTED variant by 2 days * 500 = 1000 cents"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_tiered_multimode_three_inputs_nonlinear
        grounds:
          - calculations.performance_royalty
          - entities.LicenseAgreement.fields.house_seating_capacity
          - entities.LicenseAgreement.fields.classification
        distinguishing_aspect: |
          Mode (a): royalty formula has >=3 inputs (house_seating_capacity, classification,
          royalty_basis) with non-linear interaction — tier multiplier jumps at 199/399/799,
          classification multiplier 1.0 vs 1.5, royalty_basis switches flat/pct/hybrid branches.
        test_recipe:
          setup:
            - "Title with royalty_basis=HYBRID, base_flat_fee_cents=100000, gross_percent_bp=800"
            - "Two applications identical except venue_seating_capacity: App1 cap=199 (tier1), App2 cap=200 (tier2)"
            - "Both amateur, projected_gross_cents=800000, performance_count=2"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "Hybrid", author: "A", title_kind: "PLAY", royalty_basis: "HYBRID", base_flat_fee_cents: 100000, gross_percent_bp: 800, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Org", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 199, ticket_top_price_cents: 2000, performers_compensated: false, admission_charged: true, projected_gross_cents: 800000, performance_count: 2, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-02T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 200, ticket_top_price_cents: 2000, performers_compensated: false, admission_charged: true, projected_gross_cents: 800000, performance_count: 2, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-02T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /licensing/applications/${app1_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app1_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app1_id}/approve"
              payload: { expected_application_version: "${app1_v}" }
              as: LicensingOfficer
              captures: { agr1_id: $.data.id, agr1_quoted: $.data.quoted_royalty_total_cents }
            - call: "POST /licensing/applications/${app2_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app2_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app2_id}/approve"
              payload: { expected_application_version: "${app2_v}" }
              as: LicensingOfficer
              captures: { agr2_id: $.data.id, agr2_quoted: $.data.quoted_royalty_total_cents }
          trigger:
            - call: "GET /licensing/agreements/${agr1_id}"
              payload: {}
              as: RightsAdmin
            - call: "GET /licensing/agreements/${agr2_id}"
              payload: {}
              as: RightsAdmin
          assert:
            - "agr1 quoted_royalty_total_cents uses tier_mult 1.00 (cap=199)"
            - "agr2 quoted_royalty_total_cents uses tier_mult 1.25 (cap=200, crosses TIER1_MAX_SEATS boundary)"
            - "agr1_quoted != agr2_quoted — the 1-seat capacity difference flips the tier branch"

      - name: deposit_settlement_nested_rounding_order_pinned
        grounds:
          - calculations.deposit_settlement_rule
          - entities.MaterialRental.fields.deposit_status
        distinguishing_aspect: |
          Mode (b): nested rounding — damage deductions rounded per-item then summed, NOT
          summed then rounded. Pinned order produces different cents than the alternative.
        test_recipe:
          setup:
            - "Rental R in RETURN_IN_TRANSIT with deposit_cents=20000"
            - "Two damage lines each amount_cents=1000, damage_fraction=0.335 (each rounds to 335 cents)"
            - "No late fee"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-05-15T19:00:00Z", last_performance_date: "2026-05-15T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/rentals"
              payload: { agreement_id: "${agreement_id}", scripts_qty: 5, scores_qty: 0, due_date: "2026-06-10T00:00:00Z" }
              as: MaterialsClerk
              captures: { rental_id: $.data.id }
            - call: "POST /licensing/rentals/${rental_id}/ship"
              payload: {}
              as: MaterialsClerk
            - call: "POST /licensing/rentals/${rental_id}/mark_received"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/rentals/${rental_id}/ship_return"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /licensing/rentals/${rental_id}/receive_return"
              payload: { damage_lines: [{ amount_cents: 1000, damage_fraction: 0.335 }, { amount_cents: 1000, damage_fraction: 0.335 }] }
              as: MaterialsClerk
          assert:
            - "Per-item round-then-sum: 335 + 335 = 670 cents damage"
            - "MaterialRental.deposit_status == PARTIALLY_FORFEITED"
            - "Refund == 20000 - 670 = 19330 cents (NOT 19329 which sum-then-round of 670.0 -> 670 would coincidentally match here; use damage_fraction 0.3335 for sharper divergence)"
            - "accrued_late_fee_cents == 0"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_review_cycle_loops_back_to_submitted
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_RETURNED_FOR_INFO
          - state_machines.LicenseApplication.RETURNED_FOR_INFO_to_SUBMITTED
          - entities.LicenseApplication.fields.review_round
        distinguishing_aspect: |
          Cyclic shape on LicenseApplication: UNDER_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED
          -> UNDER_REVIEW forms a loop; review_round increments each cycle.
        test_recipe:
          setup:
            - "Application submitted, under review"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-05-15T19:00:00Z", last_performance_date: "2026-05-15T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/return_for_info"
              payload: { notes: "Need venue contract" }
              as: LicensingOfficer
          trigger:
            - call: "PATCH /licensing/applications/${app_id}"
              payload: { venue_seating_capacity: 120 }
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
          assert:
            - "LicenseApplication.${app_id}.review_round == 2 after second begin_review"
            - "Cycle count tracked; loop can repeat indefinitely"

      - name: agreement_parallel_dimensions_payment_and_license_status
        grounds:
          - state_machines.LicenseAgreement
          - state_machines.LicenseAgreement_payment
          - entities.LicenseAgreement.fields.license_status
          - entities.LicenseAgreement.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on LicenseAgreement: license_status (PENDING_PAYMENT ->
          ACTIVE -> ...) and payment_status (UNPAID -> PARTIALLY_PAID -> PAID_IN_FULL) evolve
          independently; a partial payment flips payment_status without touching license_status.
        test_recipe:
          setup:
            - "Agreement A created via approved application; quoted_royalty_total_cents = Q"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 2, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-02T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id, quoted: $.data.quoted_royalty_total_cents }
          trigger:
            - call: "POST /licensing/agreements/${agreement_id}/payments"
              payload: { amount_cents: 1000 }
              as: FinanceOfficer
          assert:
            - "LicenseAgreement.${agreement_id}.payment_status == PARTIALLY_PAID"
            - "LicenseAgreement.${agreement_id}.license_status == PENDING_PAYMENT (unchanged)"
            - "royalty_balance_cents == quoted - 1000"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: breach_cascade_three_deep_agreement_grant_fine_org
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_BREACHED
          - state_machines.RecordingGrant.APPROVED_to_REVOKED
          - state_machines.Fine.ASSESSED_to_PAID
        distinguishing_aspect: |
          Depth-3 cascade: declare_breach on LicenseAgreement (1) flips RecordingGrants
          APPROVED -> REVOKED which reverses royalty_balance (2), creates Fine ASSESSED (3),
          and sets Organization.standing = SUSPENDED (4). Each link caused by the previous.
        test_recipe:
          setup:
            - "Agreement A ACTIVE with an APPROVED RecordingGrant G (recording_royalty_cents added to royalty_balance)"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id, quoted: $.data.quoted_royalty_total_cents }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/recording-grants"
              payload: { agreement_id: "${agreement_id}", grant_kind: "CAST_RECORDING_AUDIO", distribution_scope: "CAST_CREW_ONLY" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/recording-grants/${grant_id}/approve"
              payload: {}
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/agreements/${agreement_id}/declare_breach"
              payload: { breach_reason: "UNAUTHORIZED_ALTERATION" }
              as: RightsAdmin
          assert:
            - "LicenseAgreement.${agreement_id}.license_status == BREACHED"
            - "RecordingGrant.${grant_id}.status == REVOKED"
            - "Fine created with fine_kind=UNAUTHORIZED_ALTERATION, status=ASSESSED"
            - "Organization.${org_id}.standing == SUSPENDED"
            - "royalty_balance_cents reduced by recording_royalty_cents (grant reversal)"

      - name: cancel_cascade_two_deep_agreement_performance
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_CANCELLED
          - state_machines.Performance.SCHEDULED_to_CANCELLED
          - state_machines.LicenseAgreement_payment
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: cancel on LicenseAgreement flips all
          SCHEDULED Performances to CANCELLED (depth 2 from agreement cancel), and
          cancellation_refund_rule refunds RoyaltyPayments chronologically which may flip
          payment_status -> REFUNDED (depth 3 via refund path).
        test_recipe:
          setup:
            - "Agreement A ACTIVE with two SCHEDULED performances and one payment recorded"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
