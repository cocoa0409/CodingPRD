          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { agreement_id: $.data.id }
            - call: "POST /licensing/agreements/${agreement_id}/activate"
              payload: {}
              as: RightsAdmin
            - call: "POST /licensing/agreements/${agreement_id}/declare_breach"
              payload: { breach_reason: "UNAUTHORIZED_ALTERATION" }
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: -5, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORG_SUSPENDED (referential standing check at priority 9 fires before business_constraint range check would otherwise surface)"
            - "HTTP status == 409"

