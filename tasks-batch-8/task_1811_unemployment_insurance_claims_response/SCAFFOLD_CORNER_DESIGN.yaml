      - name: submit_response_immediate_visibility
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST response submit"]
        distinguishing_aspect: "Submit response returns the response with filed_at/timeliness already populated AND a follow-up GET on the claim shows RESPONSE_SUBMITTED in the same logical instant (immediate model, no lag)."
        test_recipe:
          setup: ["Claim with complete draft response; clock at 2026-08-04T09:00:00Z (on time)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "ImmCo", fein: "223456738", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Han", ssn_last4: "1032", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-1032", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/responses"
              payload: { response_type: "NO_PROTEST", separation_reason_code: "LAYOFF", narrative: "n" }
              as: ClaimsAnalyst
              captures: { resp_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${resp_id}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { claim_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ui/claims/${claim_id}/responses/${resp_id}/submit"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAnalyst
              captures: { filed: $.data.filed_at, timeliness: $.data.timeliness }
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { c_status: $.data.status }
          assert:
            - "'${filed}' == '2026-08-04T09:00:00Z'"
            - "'${timeliness}' == 'ON_TIME'"
            - "'${c_status}' == 'RESPONSE_SUBMITTED'"
