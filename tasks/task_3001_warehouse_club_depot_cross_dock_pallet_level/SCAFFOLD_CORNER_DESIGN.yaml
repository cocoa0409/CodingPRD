              payload: { vendor_id: "${vendor_id}", sku: "4800048", description: "G", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: MembershipDesk
