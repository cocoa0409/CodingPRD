          assert:
            - "${err} == ERR_EXIT_TRANSITIONS_PENDING with HTTP 409 while ${e1} is TRANSITION_PENDING"
            - "Provider.${p1}.membership_status == EXITING after the refusal"
            - "${enst} == WITHDRAWN"
            - "${pst} == EXITED and ${ppo} == FROZEN"
            - "${cst} == TERMINATED"

      - name: quality_escalation_holds_only_draft_and_submitted_claims_leaving_reconciled_alone
        claim_type: Conditional cascade
        grounds:
          - state_machines.SubsidyClaim.DRAFT_to_HELD
          - state_machines.SubsidyClaim.SUBMITTED_to_HELD
          - entities.SubsidyClaim.fields.held_from_status
        distinguishing_aspect: "The hold cascade is conditional on the child's own status: with three sibling claims on one contract the DRAFT and SUBMITTED rows move to HELD with held_from_status recording their origin, while the RECONCILED row stays RECONCILED and keeps its final_amount_cents."
        test_recipe:
          setup:
