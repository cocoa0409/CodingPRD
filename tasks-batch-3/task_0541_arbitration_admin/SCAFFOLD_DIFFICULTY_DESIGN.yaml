          trigger:
            - call: "POST /cases/${c_id}/hearings"
              payload: { hearing_type: "EVIDENTIARY", start_at: "2026-06-20T10:00:00Z", end_at: "2026-06-20T12:00:00Z", location: "Room B" }
              as: CaseAdministrator
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_HEARING_OVERLAP"

