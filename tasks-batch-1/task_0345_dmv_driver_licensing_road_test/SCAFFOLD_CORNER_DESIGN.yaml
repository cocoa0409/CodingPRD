# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 per references/claim-extraction-guide.md.
# excluded_because: stubs point at §1.8 instances that already cover the corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_driver_record_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.DriverRecord
          - endpoints
        distinguishing_aspect: "POST /driver-records with full_name+date_of_birth+state_code returns 201 with licensing_status=UNLICENSED, cdl_status=NONE, point_balance=0, real_id_status=NONE, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /driver-records"
              payload: { full_name: "Amy New", date_of_birth: "1990-04-04", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id, st: $.data.licensing_status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "DriverRecord.${dr_id}.licensing_status == UNLICENSED"
            - "DriverRecord.${dr_id}.cdl_status == NONE"
            - "DriverRecord.${dr_id}.point_balance == 0"
            - "DriverRecord.${dr_id}.real_id_status == NONE"
            - "DriverRecord.${dr_id}.version == 1"

      - name: create_driver_record_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.DriverRecord.fields.state_code
        distinguishing_aspect: "POST /driver-records without state_code (a required source:input field) returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /driver-records"
              payload: { full_name: "Bad Body", date_of_birth: "1990-04-04" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_driver_record_not_found
        claim_type: Not Found
        grounds:
          - entities.DriverRecord
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /driver-records/{id} with a non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /driver-records/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: driver_record_computed_point_balance_is_server_owned
        claim_type: Computed Fields
        grounds:
          - entities.DriverRecord.fields.point_balance
          - calculations.point_balance
        distinguishing_aspect: "point_balance is source:computed; after posting a 4-point ACTIVE violation, GET shows point_balance==4 regardless of any client value."
        test_recipe:
          setup: ["A DriverRecord at clock 0."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Cal Comp", date_of_birth: "1990-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "SPEEDING_10_OVER", points: 4, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /driver-records/${dr_id}"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { pb: $.data.point_balance }
          assert:
            - "DriverRecord.${dr_id}.point_balance == 4"

      - name: opt_in_sets_donor_and_voter_flags
        claim_type: Defaults
        grounds:
          - entities.DriverRecord.fields.organ_donor
          - entities.DriverRecord.fields.voter_registration_opt_in
        distinguishing_aspect: "organ_donor and voter_registration_opt_in default false on create; POST /driver-records/{id}/opt-in flips them to true and bumps version."
        test_recipe:
          setup: ["A freshly created DriverRecord (flags default false, version 1)."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Dee Opt", date_of_birth: "1990-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
          trigger:
            - call: "POST /driver-records/${dr_id}/opt-in"
              payload: { organ_donor: true, voter_registration_opt_in: true }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { od: $.data.organ_donor, vr: $.data.voter_registration_opt_in, ver: $.data.version }
          assert:
            - "DriverRecord.${dr_id}.organ_donor == true"
            - "DriverRecord.${dr_id}.voter_registration_opt_in == true"
            - "DriverRecord.${dr_id}.version == 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: grade_already_passed_knowledge_test_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.KnowledgeTest.SCHEDULED_to_PASSED
          - "errors[ERR_TEST_NOT_SCHEDULED]"
        distinguishing_aspect: "A KnowledgeTest already PASSED cannot be graded again; second grade returns ERR_TEST_NOT_SCHEDULED 409; no side effects."
        test_recipe:
          setup: ["A DriverRecord with a knowledge test graded to PASSED (40/40) at clock 0."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Eli Pass", date_of_birth: "1990-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
          trigger:
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 35 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_TEST_NOT_SCHEDULED"
            - "KnowledgeTest.${kt_id}.status == PASSED (unchanged)"

      - name: grade_before_scheduled_period_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.KnowledgeTest.SCHEDULED_to_PASSED
          - "errors[ERR_TEST_NOT_YET_DUE]"
        distinguishing_aspect: "Grading a knowledge test whose scheduled_period (5) is after the current clock (0) returns ERR_TEST_NOT_YET_DUE 409."
        test_recipe:
          setup: ["A DriverRecord with a SCHEDULED knowledge test at period 5; clock at 0."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Fay Early", date_of_birth: "1990-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 5 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
          trigger:
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_TEST_NOT_YET_DUE"

      - name: reinstate_before_eligible_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Suspension.SERVED_to_LIFTED_BY_REINSTATEMENT
          - "validations[priority=13]"
          - "errors[ERR_NOT_YET_ELIGIBLE]"
        distinguishing_aspect: "Reinstating an ACTIVE (not yet SERVED) suspension before the clock reaches eligible_period returns ERR_NOT_YET_ELIGIBLE 409."
        test_recipe:
          setup: ["A SUSPENDED record (12-pt violation at clock 0, duration 30) with an ACTIVE suspension; clock still 0; reinstatement fee captured; record version captured."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Gus Early", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Erl", certified_classes: ["D"], opaque_user_id: "exu-erl" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "RENEWAL", amount_cents: 4000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /licenses"
              payload: { driver_record_id: "${dr_id}", road_test_appointment_id: "${appt_id}", license_class: "D" }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "RECKLESS", points: 12, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
            - call: "GET /driver-records/${dr_id}/suspensions"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { susp_id: "$.data[0].id" }
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "REINSTATEMENT", amount_cents: 20000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "GET /driver-records/${dr_id}"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_v: $.data.version }
          trigger:
            - call: "POST /suspensions/${susp_id}/reinstate"
              payload: { expected_driver_record_version: "${dr_v}" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_NOT_YET_ELIGIBLE"
            - "DriverRecord.${dr_id}.licensing_status == SUSPENDED (unchanged)"

      - name: proctor_by_wrong_examiner_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RoadTestAppointment.BOOKED_to_PROCTORED
          - "errors[ERR_EXAMINER_MISMATCH]"
        distinguishing_aspect: "An Examiner whose id != appointment.examiner_id cannot proctor it; returns ERR_EXAMINER_MISMATCH 403."
        test_recipe:
          setup: ["A knowledge-passed record with a BOOKED appointment assigned to examiner E1; a second examiner E2 exists; clock >= slot start."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Hal Wrong", date_of_birth: "1990-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex E1", certified_classes: ["D"], opaque_user_id: "exu-e1" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex1: $.data.id }
            - call: "POST /examiners"
              payload: { full_name: "Ex E2", certified_classes: ["D"], opaque_user_id: "exu-e2" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex2: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex1}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex2}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "error_id == ERR_EXAMINER_MISMATCH"

      - name: cdl_reinstate_when_not_downgraded_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DriverRecord.MEDICALLY_DOWNGRADED_to_ACTIVE
          - "errors[ERR_CDL_NOT_DOWNGRADED]"
        distinguishing_aspect: "POST /driver-records/{id}/cdl-reinstate on a record whose cdl_status is NONE (never downgraded) returns ERR_CDL_NOT_DOWNGRADED 409."
        test_recipe:
          setup: ["A freshly created DriverRecord with cdl_status NONE."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Ida None", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
          trigger:
            - call: "POST /driver-records/${dr_id}/cdl-reinstate"
              payload: {}
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_CDL_NOT_DOWNGRADED"

      - name: revoke_below_prior_suspension_threshold_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DriverRecord.SUSPENDED_to_REVOKED
          - "errors[ERR_REVOCATION_THRESHOLD_NOT_MET]"
        distinguishing_aspect: "Revoking a SUSPENDED record with prior_suspension_count==0 (< REVOCATION_PRIOR_THRESHOLD 3) returns ERR_REVOCATION_THRESHOLD_NOT_MET 409."
        test_recipe:
          setup: ["A SUSPENDED record (first-ever 12-pt suspension at clock 0) with prior_suspension_count 0."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Jay Susp", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Rev", certified_classes: ["D"], opaque_user_id: "exu-rev" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "D", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "RENEWAL", amount_cents: 4000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /licenses"
              payload: { driver_record_id: "${dr_id}", road_test_appointment_id: "${appt_id}", license_class: "D" }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "RECKLESS", points: 12, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /driver-records/${dr_id}/revoke"
              payload: { reason: "attempt" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_REVOCATION_THRESHOLD_NOT_MET"
            - "DriverRecord.${dr_id}.licensing_status == SUSPENDED (unchanged)"

      - name: cdl_grant_first_endorsement_activates_track
        claim_type: Valid Transition
        grounds:
          - state_machines.DriverRecord.NONE_to_ACTIVE
          - entities.DriverRecord.fields.cdl_status
        distinguishing_aspect: "Granting the first endorsement to an ACTIVE record with a VALID medical card flips cdl_status NONE -> ACTIVE and the endorsement is GRANTED."
        test_recipe:
          setup: ["An ACTIVE class-A licensed record with a VALID medical card (valid_through 100) and cdl_status NONE."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Kit Cdl", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 40 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
            - call: "POST /examiners"
              payload: { full_name: "Ex Cdl", certified_classes: ["A"], opaque_user_id: "exu-cdl" }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { ex_id: $.data.id }
            - call: "POST /road-test-appointments"
              payload: { driver_record_id: "${dr_id}", examiner_id: "${ex_id}", license_class: "A", slot_start_period: 0, slot_end_period: 1 }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { appt_id: $.data.id }
            - call: "POST /road-test-appointments/${appt_id}/proctor"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, auto_score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /road-test-appointments/${appt_id}/score"
              payload: { maneuver_scores: [ { maneuver: "ALL", weight: 1, score: 95 } ] }
              as: Examiner
              as_user_id: "${ex_id}"
            - call: "POST /fee-payments"
              payload: { driver_record_id: "${dr_id}", purpose: "RENEWAL", amount_cents: 6000 }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /licenses"
              payload: { driver_record_id: "${dr_id}", road_test_appointment_id: "${appt_id}", license_class: "A" }
              as: LicenseClerk
              as_user_id: "clerk-1"
            - call: "POST /medical-cards"
              payload: { driver_record_id: "${dr_id}", issued_period: 0, valid_through_period: 100 }
              as: LicenseClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "POST /cdl-endorsements"
              payload: { driver_record_id: "${dr_id}", endorsement_code: "H" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { end_id: $.data.id, st: $.data.status }
          assert:
            - "response status == 201"
            - "CdlEndorsement.${end_id}.status == GRANTED"
            - "DriverRecord.${dr_id}.cdl_status == ACTIVE"

      - name: suspension_cycle_reinstatement_already_covered
        claim_type: Valid Transition
        grounds:
          - state_machines.DriverRecord.SUSPENDED_to_ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / driver_record_suspension_reinstatement_cycle
          rationale: "The SUSPENDED -> ACTIVE reinstatement transition and its prior_suspension_count side-effect are asserted by the named §1.8 cycle instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: point_balance_excludes_out_of_window_violation
        claim_type: Input Set Filtering
        grounds:
          - calculations.point_balance
          - entities.Violation.fields.occurred_period
        distinguishing_aspect: "After clock advances past the 730-period window relative to a violation's occurred_period, that violation -> EXPIRED and drops out of point_balance. With occurred_period 0 and clock advanced to 731, point_balance == 0."
        test_recipe:
          setup: ["A DriverRecord with one ACTIVE 6-point violation at occurred_period 0; clock at 0 (balance 6); then clock advanced to 731 (diff 731 > 730 -> expired)."]
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Lou Win", date_of_birth: "1986-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /violations"
              payload: { driver_record_id: "${dr_id}", code: "SPEEDING_15_OVER", points: 6, occurred_period: 0 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
            - call: "GET /driver-records/${dr_id}"
              payload: {}
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { pb0: $.data.point_balance }
            - call: "POST /_clock/advance"
              payload: { by_periods: 731 }
              as: AdjudicationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /driver-records/${dr_id}"
              payload: {}
              as: AdjudicationOfficer
              as_user_id: "officer-1"
              captures: { pb1: $.data.point_balance }
          assert:
            - "DriverRecord.${dr_id}.point_balance at clock 0 == 6"
            - "DriverRecord.${dr_id}.point_balance at clock 731 == 0"

      - name: point_balance_window_boundary_inclusive
        claim_type: Constants Applied
        grounds:
          - calculations.point_balance
