# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Hospital Volunteer Services & Auxiliary
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Volunteer hours vs Campaign money)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: recognition_weighted_vs_raw_same_entries
        grounds:
          - calculations.recognition_points_weighted
          - entities.Volunteer.fields.total_service_hours
          - entities.Volunteer.fields.recognition_points
        distinguishing_aspect: |
          Volunteer-hours domain: the SAME two approved entries produce
          total_service_hours == 3.50 (raw, unweighted) and recognition_points == 4.20
          (category-weighted, per-entry rounded) — two valid algorithms, two different
          numbers, one input set.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z"
            - "Adult volunteer V (born 1990-05-15) fully onboarded: application approved, BACKGROUND/HEALTH_TB/HEALTH_FLU clearances CLEARED, ORIENTATION VALID, ACCEPTED placement on an OPEN request, activated (ACTIVE, badge ISSUED)"
            - "Two PENDING hour entries for V: E1 = 120 min PATIENT_FACING on 2026-08-03, E2 = 90 min CLERICAL on 2026-08-04"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Alice Adult", date_of_birth: "1990-05-15", email: "alice@x.org", phone: "555-0101" }, as: VolunteerCoordinator, captures: { app_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app_id}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { vol_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_bg: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_bg}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_tb: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_tb}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_FLU", document_ref: "flu-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_flu: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_flu}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "GET /auxiliary/training-records", payload: {}, as: VolunteerCoordinator, captures: { tr_orient: "$.data[0].id" } }
            - { call: "POST /auxiliary/training-records/${tr_orient}/complete", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/departments", payload: { name: "Emergency", head_user_id: "dh-1" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "ED Greeter", category: "PATIENT_FACING", minimum_age: 18 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-1", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-1" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${vol_id}" }, as: VolunteerCoordinator, captures: { plc_id: $.data.id } }
            - { call: "POST /auxiliary/placements/${plc_id}/accept", as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /auxiliary/volunteers/${vol_id}/activate", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-03", minutes: 120, service_category: "PATIENT_FACING" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e1: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-04", minutes: 90, service_category: "CLERICAL" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e2: $.data.id } }
          trigger:
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v0: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e1}/approve", payload: { expected_volunteer_version: "${v0}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v1: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e2}/approve", payload: { expected_volunteer_version: "${v1}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}/summary", as: VolunteerCoordinator, captures: { raw_h: $.data.total_service_hours, pts: $.data.recognition_points } }
          assert:
            - "summary.total_service_hours == 3.50  (raw: (120+90)/60)"
            - "summary.recognition_points == 4.20  (weighted: round_half_up(2.0*1.5,2)=3.00 + round_half_up(1.5*0.8,2)=1.20)"
            - "summary.total_service_hours != summary.recognition_points for the identical APPROVED input set"
            - "summary.recognition_tier == NONE (4.20 < 100.00)"

      - name: campaign_gross_raised_net_diverge
        grounds:
          - calculations.campaign_proceeds
          - entities.FundraisingCampaign.fields.gross_receipts_cents
          - entities.FundraisingCampaign.fields.raised_cents
          - entities.FundraisingCampaign.fields.net_proceeds_cents
        distinguishing_aspect: |
          Campaign-money domain (different entity domain from the recognition-hours
          instance): identical sale data yields gross_receipts_cents == 2500 (voids
          included), raised_cents == 2000 (voids excluded), net_proceeds_cents == 1400
          (voids excluded AND line COGS subtracted) — three valid aggregations, three
          different numbers.
        test_recipe:
          setup:
            - "Clock at 2026-08-02T12:00:00Z; gift-shop cashier volunteer C fully ACTIVE with ACCEPTED placement whose role category == GIFT_SHOP"
            - "Campaign CMP ACTIVE with window [2026-08-01T00:00:00Z, 2026-08-05T00:00:00Z), promo_discount_pct 0"
            - "Items: IT1 price 1000c cost 300c stock 10; IT2 price 500c cost 100c stock 5"
            - "S1: sale of 2x IT1 attributed to CMP (total 2000c, COGS 600c); S2: sale of 1x IT2 attributed to CMP (total 500c, COGS 100c)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Carol Cashier", date_of_birth: "1988-03-20", email: "carol@x.org", phone: "555-0201" }, as: VolunteerCoordinator, captures: { app_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app_id}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { vol_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_bg: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_bg}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_tb: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_tb}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_FLU", document_ref: "flu-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_flu: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_flu}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "GET /auxiliary/training-records", payload: {}, as: VolunteerCoordinator, captures: { tr_orient: "$.data[0].id" } }
            - { call: "POST /auxiliary/training-records/${tr_orient}/complete", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/departments", payload: { name: "Gift Shop", head_user_id: "dh-2" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "Gift Shop Clerk", category: "GIFT_SHOP", minimum_age: 16 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-2", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-2" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${vol_id}" }, as: VolunteerCoordinator, captures: { plc_id: $.data.id } }
            - { call: "POST /auxiliary/placements/${plc_id}/accept", as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /auxiliary/volunteers/${vol_id}/activate", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/fundraising-campaigns", payload: { name: "Lobby Renovation", goal_cents: 100000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-05T00:00:00Z", promo_discount_pct: 0 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { camp_id: $.data.id } }
            - { call: "POST /auxiliary/fundraising-campaigns/${camp_id}/activate", as: AuxiliaryTreasurer, as_user_id: "treasurer-1" }
            - { call: "POST /auxiliary/gift-shop-items", payload: { sku: "PLUSH-BEAR", name: "Plush Bear", unit_price_cents: 1000, unit_cost_cents: 300, stock_on_hand: 10 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { it1: $.data.id } }
            - { call: "POST /auxiliary/gift-shop-items", payload: { sku: "GETWELL-CARD", name: "Get Well Card", unit_price_cents: 500, unit_cost_cents: 100, stock_on_hand: 5 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { it2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/gift-shop-sales", payload: { cashier_volunteer_id: "${vol_id}", campaign_id: "${camp_id}", lines: [ { item_id: "${it1}", qty: 2 } ], tendered_cents: 2000 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { sale1: $.data.id } }
            - { call: "POST /auxiliary/gift-shop-sales", payload: { cashier_volunteer_id: "${vol_id}", campaign_id: "${camp_id}", lines: [ { item_id: "${it2}", qty: 1 } ], tendered_cents: 500 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { sale2: $.data.id } }
          trigger:
            - { call: "POST /auxiliary/gift-shop-sales/${sale2}/void", payload: { void_reason: "customer changed mind" }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1" }
            - { call: "GET /auxiliary/fundraising-campaigns/${camp_id}", as: AuxiliaryTreasurer, captures: { gross: $.data.gross_receipts_cents, raised: $.data.raised_cents, net: $.data.net_proceeds_cents } }
          assert:
            - "campaign.gross_receipts_cents == 2500  (2000 + 500, void included)"
            - "campaign.raised_cents == 2000  (void excluded)"
            - "campaign.net_proceeds_cents == 1400  (2000 - 2*300 COGS; voided line COGS excluded too)"
            - "gross_receipts_cents > raised_cents > net_proceeds_cents for identical attributed-sale data"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (three DIFFERENT modes: (a) multi-input non-linear,
  # (b) pinned rounding order, (c) pinned evaluation order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sale_discount_max_stack_per_line_rounding
        grounds:
          - calculations.sale_total_cents
          - entities.GiftShopSale.fields.discount_pct_applied
          - entities.GiftShopSale.fields.total_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 interacting inputs (buyer recognition tier, buyer junior flag,
          campaign promo) with NON-STACKING max() selection and conditional eligibility;
          rounding pinned per line before summation. Junior buyer (5%) + campaign promo
          (20%) + tier NONE (0%) -> max == 20; a half-cent line (1050c x 0.80 = 840.00;
          control line 1025c x 0.95 = 973.75 -> 974) proves round_half_up per line.
        test_recipe:
          setup:
            - "Clock 2026-08-02T12:00:00Z; cashier volunteer ACTIVE with GIFT_SHOP placement (pipeline identical to campaign_gross_raised_net_diverge setup)"
            - "Junior buyer J (born 2011-06-15 -> age 15): application approved only (no activation needed to be a buyer)"
            - "Campaign ACTIVE window [2026-08-01, 2026-08-05), promo_discount_pct 20"
            - "Items: IT_A 1000c/300c stock 10; IT_B 555c/100c stock 10; IT_C 1025c/100c stock 10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Carol Cashier", date_of_birth: "1988-03-20", email: "carol@x.org", phone: "555-0201" }, as: VolunteerCoordinator, captures: { app_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app_id}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { vol_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_bg: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_bg}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_tb: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_tb}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_FLU", document_ref: "flu-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_flu: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_flu}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "GET /auxiliary/training-records", payload: {}, as: VolunteerCoordinator, captures: { tr_orient: "$.data[0].id" } }
            - { call: "POST /auxiliary/training-records/${tr_orient}/complete", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/departments", payload: { name: "Gift Shop", head_user_id: "dh-2" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "Gift Shop Clerk", category: "GIFT_SHOP", minimum_age: 16 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-2", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-2" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${vol_id}" }, as: VolunteerCoordinator, captures: { plc_id: $.data.id } }
            - { call: "POST /auxiliary/placements/${plc_id}/accept", as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /auxiliary/volunteers/${vol_id}/activate", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Jamie Junior", date_of_birth: "2011-06-15", email: "jamie@x.org", phone: "555-0301" }, as: VolunteerCoordinator, captures: { j_app: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${j_app}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${j_app}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { junior_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/fundraising-campaigns", payload: { name: "Promo Week", goal_cents: 50000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-05T00:00:00Z", promo_discount_pct: 20 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { camp_id: $.data.id } }
            - { call: "POST /auxiliary/fundraising-campaigns/${camp_id}/activate", as: AuxiliaryTreasurer, as_user_id: "treasurer-1" }
            - { call: "POST /auxiliary/gift-shop-items", payload: { sku: "IT-A", name: "Item A", unit_price_cents: 1000, unit_cost_cents: 300, stock_on_hand: 10 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { ita: $.data.id } }
            - { call: "POST /auxiliary/gift-shop-items", payload: { sku: "IT-B", name: "Item B", unit_price_cents: 555, unit_cost_cents: 100, stock_on_hand: 10 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { itb: $.data.id } }
            - { call: "POST /auxiliary/gift-shop-items", payload: { sku: "IT-C", name: "Item C", unit_price_cents: 1025, unit_cost_cents: 100, stock_on_hand: 10 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { itc: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: VolunteerServicesDirector }
          trigger:
            - { call: "POST /auxiliary/gift-shop-sales", payload: { cashier_volunteer_id: "${vol_id}", buyer_volunteer_id: "${junior_id}", campaign_id: "${camp_id}", lines: [ { item_id: "${ita}", qty: 2 }, { item_id: "${itb}", qty: 1 } ], tendered_cents: 2500 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { s1: $.data.id, s1_total: $.data.total_cents, s1_disc: $.data.discount_pct_applied, s1_change: $.data.change_cents } }
            - { call: "POST /auxiliary/gift-shop-sales", payload: { cashier_volunteer_id: "${vol_id}", buyer_volunteer_id: "${junior_id}", lines: [ { item_id: "${itc}", qty: 1 } ], tendered_cents: 1000 }, as: AuxiliaryTreasurer, as_user_id: "treasurer-1", captures: { s2_total: $.data.total_cents, s2_disc: $.data.discount_pct_applied } }
          assert:
            - "S1.discount_pct_applied == 20  (max(tier 0, junior 5, promo 20) — non-stacking)"
            - "S1.total_cents == 2044  (round_half_up(2*1000*0.80)=1600 + round_half_up(1*555*0.80)=444)"
            - "S1.change_cents == 456  (2500 - 2044)"
            - "S2 (no campaign): discount_pct_applied == 5  (junior flag only)"
            - "S2.total_cents == 974  (round_half_up(1025*0.95)=round_half_up(973.75)=974, half-up boundary)"

      - name: recognition_per_entry_rounding_order
        grounds:
          - calculations.recognition_points_weighted
          - entities.HourEntry.fields.minutes
        distinguishing_aspect: |
          Mode (b) — nested rounding ORDER: three 25-minute CLERICAL entries give
          3 x round_half_up(25/60*0.8, 2) = 3 x 0.33 = 0.99 under the pinned
          per-entry-first order, while sum-then-round would give
          round_half_up(75/60*0.8, 2) = 1.00. The 0.01 divergence pins the algorithm.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; adult volunteer fully ACTIVE (pipeline identical to recognition_weighted_vs_raw_same_entries)"
            - "Three PENDING hour entries, each 25 minutes CLERICAL, service dates 2026-08-03/04/05"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "Alice Adult", date_of_birth: "1990-05-15", email: "alice@x.org", phone: "555-0101" }, as: VolunteerCoordinator, captures: { app_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app_id}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { vol_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_bg: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_bg}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_tb: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_tb}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${vol_id}", clearance_type: "HEALTH_FLU", document_ref: "flu-1" }, as: Screener, as_user_id: "screener-1", captures: { clr_flu: $.data.id } }
            - { call: "POST /auxiliary/clearances/${clr_flu}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "GET /auxiliary/training-records", payload: {}, as: VolunteerCoordinator, captures: { tr_orient: "$.data[0].id" } }
            - { call: "POST /auxiliary/training-records/${tr_orient}/complete", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/departments", payload: { name: "Records", head_user_id: "dh-1" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "Filing Aide", category: "CLERICAL", minimum_age: 16 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-1", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-1" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${vol_id}" }, as: VolunteerCoordinator, captures: { plc_id: $.data.id } }
            - { call: "POST /auxiliary/placements/${plc_id}/accept", as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /auxiliary/volunteers/${vol_id}/activate", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-03", minutes: 25, service_category: "CLERICAL" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e1: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-04", minutes: 25, service_category: "CLERICAL" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e2: $.data.id } }
            - { call: "POST /auxiliary/hour-entries", payload: { volunteer_id: "${vol_id}", service_date: "2026-08-05", minutes: 25, service_category: "CLERICAL" }, as: Volunteer, as_user_id: "${vol_id}", captures: { e3: $.data.id } }
          trigger:
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v0: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e1}/approve", payload: { expected_volunteer_version: "${v0}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v1: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e2}/approve", payload: { expected_volunteer_version: "${v1}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}", as: VolunteerCoordinator, captures: { v2: $.data.version } }
            - { call: "POST /auxiliary/hour-entries/${e3}/approve", payload: { expected_volunteer_version: "${v2}" }, as: VolunteerCoordinator }
            - { call: "GET /auxiliary/volunteers/${vol_id}/summary", as: VolunteerCoordinator, captures: { pts: $.data.recognition_points, raw_h: $.data.total_service_hours } }
          assert:
            - "summary.recognition_points == 0.99  (0.33+0.33+0.33, per-entry rounding)"
            - "summary.recognition_points != 1.00  (sum-then-round would give 1.00 — rejected algorithm)"
            - "summary.total_service_hours == 1.25  (75/60, unweighted)"

      - name: slot_fill_evaluation_order
        grounds:
          - calculations.slot_fill_evaluation
          - state_machines.DepartmentRequest.OPEN_to_FILLED
          - state_machines.Placement.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned evaluation order:
          accepting the LAST slot must consult the PRE-INCREMENT request status (OPEN)
          and only then flip the request to FILLED; a second outstanding offer then
          fails accept with ERR_REQUEST_NOT_OPEN. If the implementation evaluated the
          status post-increment, the last legitimate acceptance would self-reject.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; department + role created; request R with slots_needed == 1, OPEN"
            - "Two fully-cleared ONBOARDING volunteers V1, V2 (applications approved, three clearances CLEARED, ORIENTATION VALID) — activation NOT required for placement"
            - "Two placements P1 (V1) and P2 (V2) both OFFERED against R"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/departments", payload: { name: "Emergency", head_user_id: "dh-1" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "ED Greeter", category: "PATIENT_FACING", minimum_age: 18 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-1", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-1" }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "V One", date_of_birth: "1990-01-01", email: "v1@x.org", phone: "555-1001" }, as: VolunteerCoordinator, captures: { app1: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v1_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v1_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { c1: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v1_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { c2: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c2}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v1_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-1" }, as: Screener, as_user_id: "screener-1", captures: { c3: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c3}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "V Two", date_of_birth: "1992-02-02", email: "v2@x.org", phone: "555-1002" }, as: VolunteerCoordinator, captures: { app2: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app2}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app2}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v2_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v2_id}", clearance_type: "BACKGROUND", document_ref: "bg-2" }, as: Screener, as_user_id: "screener-1", captures: { c4: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c4}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v2_id}", clearance_type: "HEALTH_TB", document_ref: "tb-2" }, as: Screener, as_user_id: "screener-1", captures: { c5: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c5}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v2_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-2" }, as: Screener, as_user_id: "screener-1", captures: { c6: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c6}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${v1_id}" }, as: VolunteerCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${v2_id}" }, as: VolunteerCoordinator, captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /auxiliary/placements/${p1}/accept", as: Volunteer, as_user_id: "${v1_id}", captures: { p1_status: $.data.status } }
            - { call: "GET /auxiliary/department-requests/${req_id}", as: VolunteerCoordinator, captures: { r_status: $.data.status, r_filled: $.data.slots_filled } }
            - { call: "POST /auxiliary/placements/${p2}/accept", as: Volunteer, as_user_id: "${v2_id}", captures: { err: $.data.error_id } }
          assert:
            - "P1.status == ACCEPTED  (pre-increment OPEN check allowed the final slot's acceptance)"
            - "R.status == FILLED and R.slots_filled == 1  (flip happened AFTER the increment)"
            - "P2 accept rejected: error_id == ERR_REQUEST_NOT_OPEN (http 409)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (cycles on DIFFERENT entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: placement_counter_reoffer_cycle
        grounds:
          - state_machines.Placement.OFFERED_to_COUNTERED
          - state_machines.Placement.COUNTERED_to_OFFERED
          - entities.Placement.fields.counter_rounds
        distinguishing_aspect: |
          Placement entity — bounded negotiation CYCLE OFFERED -> COUNTERED -> OFFERED
          -> COUNTERED -> OFFERED -> ACCEPTED with counter_rounds incrementing 1 then 2;
          the cycle terminates by acceptance, and a third counter would fail
          (ERR_COUNTER_ROUND_EXHAUSTED, covered in corner design). Not a linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; department (head dh-1), role (min age 18), request R OPEN slots_needed 1"
            - "Volunteer V: application APPROVED, all three clearances CLEARED (posture CLEAR), ONBOARDING"
            - "Placement P OFFERED for (R, V)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/departments", payload: { name: "Pediatrics", head_user_id: "dh-1" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "Playroom Aide", category: "PATIENT_FACING", minimum_age: 18 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-1", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-1" }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "V Nego", date_of_birth: "1990-01-01", email: "vn@x.org", phone: "555-1101" }, as: VolunteerCoordinator, captures: { app1: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { c1: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { c2: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c2}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-1" }, as: Screener, as_user_id: "screener-1", captures: { c3: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c3}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${v_id}" }, as: VolunteerCoordinator, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /auxiliary/placements/${p1}/counter", payload: { counter_note: "prefer weekends" }, as: Volunteer, as_user_id: "${v_id}", captures: { s_mid1: $.data.status } }
            - { call: "POST /auxiliary/placements/${p1}/reoffer", payload: { offer_note: "weekend schedule attached" }, as: DepartmentHead, as_user_id: "dh-1", captures: { s_mid2: $.data.status } }
            - { call: "POST /auxiliary/placements/${p1}/counter", payload: { counter_note: "mornings only please" }, as: Volunteer, as_user_id: "${v_id}", captures: { s_mid3: $.data.status, rounds: $.data.counter_rounds } }
            - { call: "POST /auxiliary/placements/${p1}/reoffer", payload: { offer_note: "agreed: Saturday mornings" }, as: DepartmentHead, as_user_id: "dh-1" }
            - { call: "POST /auxiliary/placements/${p1}/accept", as: Volunteer, as_user_id: "${v_id}", captures: { s_fin: $.data.status } }
            - { call: "GET /auxiliary/department-requests/${req_id}", as: VolunteerCoordinator, captures: { r_status: $.data.status, r_filled: $.data.slots_filled } }
          assert:
            - "after counter #1: status == COUNTERED"
            - "after reoffer #1: status == OFFERED (cycle closed)"
            - "after counter #2: status == COUNTERED and counter_rounds == 2"
            - "final accept: status == ACCEPTED; request.slots_filled == 1 and request.status == FILLED"

      - name: clearance_resubmit_renewal_cycle
        grounds:
          - state_machines.Clearance.REJECTED_to_SUBMITTED
          - state_machines.Clearance.EXPIRED_to_SUBMITTED
          - state_machines.Clearance.CLEARED_to_EXPIRED
          - calculations.clearance_expiry
        distinguishing_aspect: |
          Clearance entity (different entity from the Placement instance) — TWO cycles
          on one record: SUBMITTED -> REJECTED -> SUBMITTED -> CLEARED (resubmission)
          and CLEARED -> EXPIRED -> SUBMITTED -> CLEARED (renewal after the annual-review
          sweep). Final expires_at must equal the second adjudication date + 12 months.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; volunteer V approved (ONBOARDING), no activation needed"
            - "HEALTH_TB clearance for V submitted by screener-1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "V Renew", date_of_birth: "1985-07-07", email: "vr@x.org", phone: "555-1201" }, as: VolunteerCoordinator, captures: { app1: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_TB", document_ref: "tb-v1" }, as: Screener, as_user_id: "screener-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "REJECTED", adjudication_notes: "illegible TB read" }, as: Screener, as_user_id: "screener-2", captures: { s1: $.data.status } }
            - { call: "POST /auxiliary/clearances/${c1}/resubmit", payload: { document_ref: "tb-v2" }, as: Screener, as_user_id: "screener-2", captures: { s2: $.data.status } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-1", captures: { s3: $.data.status, exp1: $.data.expires_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/compliance/annual-review", as: VolunteerServicesDirector, captures: { expired_count: $.data.clearances_expired } }
            - { call: "GET /auxiliary/clearances/${c1}", as: Screener, captures: { s4: $.data.status } }
            - { call: "POST /auxiliary/clearances/${c1}/resubmit", payload: { document_ref: "tb-v3" }, as: Screener, as_user_id: "screener-1", captures: { s5: $.data.status } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2", captures: { s6: $.data.status, exp2: $.data.expires_at } }
          assert:
            - "REJECTED then resubmit -> SUBMITTED (cycle 1: s1 == REJECTED, s2 == SUBMITTED)"
            - "first CLEARED expires_at == 2027-08-01T00:00:00Z (2026-08-01 + 12 calendar months for HEALTH_TB)"
            - "annual-review at 2027-08-02 reports clearances_expired == 1 and the record reads EXPIRED (sweep flip)"
            - "EXPIRED -> resubmit -> SUBMITTED -> CLEARED (cycle 2) with expires_at == 2028-08-02T00:00:00Z"
            - "SoD honored at every adjudication: adjudicator != submitted_by_user_id each time"

      - name: volunteer_separation_reactivation_cycle
        grounds:
          - state_machines.Volunteer.SEPARATED_to_ONBOARDING
          - state_machines.VolunteerApplication.IN_REVIEW_to_APPROVED
          - entities.Badge.fields.badge_number
        distinguishing_aspect: |
          Volunteer entity (third distinct entity) — the macro cycle ACTIVE -> SEPARATED
          -> ONBOARDING via reapply + approval: the SAME volunteer row is reactivated
          (joined_at reset), the old badge stays REVOKED, and a new PENDING badge with
          the next sequential badge_number is minted.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; volunteer V fully ACTIVE (complete pipeline: approve -> 3 clearances CLEARED -> ORIENTATION VALID -> placement ACCEPTED -> activate)"
            - "Badge B1 == BDG-000001 in ISSUED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/volunteer-applications", payload: { full_name: "V Return", date_of_birth: "1980-12-01", email: "vret@x.org", phone: "555-1301" }, as: VolunteerCoordinator, captures: { app1: $.data.id } }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app1}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { v_id: $.data.volunteer_id } }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "BACKGROUND", document_ref: "bg-1" }, as: Screener, as_user_id: "screener-1", captures: { c1: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c1}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_TB", document_ref: "tb-1" }, as: Screener, as_user_id: "screener-1", captures: { c2: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c2}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "POST /auxiliary/clearances", payload: { volunteer_id: "${v_id}", clearance_type: "HEALTH_FLU", document_ref: "fl-1" }, as: Screener, as_user_id: "screener-1", captures: { c3: $.data.id } }
            - { call: "POST /auxiliary/clearances/${c3}/adjudicate", payload: { decision: "CLEARED" }, as: Screener, as_user_id: "screener-2" }
            - { call: "GET /auxiliary/training-records", payload: {}, as: VolunteerCoordinator, captures: { tr_orient: "$.data[0].id" } }
            - { call: "POST /auxiliary/training-records/${tr_orient}/complete", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/departments", payload: { name: "Chaplaincy", head_user_id: "dh-1" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "Visitor", category: "COMMUNITY", minimum_age: 18 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests", payload: { department_id: "${dept_id}", role_id: "${role_id}", slots_needed: 1 }, as: DepartmentHead, as_user_id: "dh-1", captures: { req_id: $.data.id } }
            - { call: "POST /auxiliary/department-requests/${req_id}/open", as: DepartmentHead, as_user_id: "dh-1" }
            - { call: "POST /auxiliary/placements", payload: { request_id: "${req_id}", volunteer_id: "${v_id}" }, as: VolunteerCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /auxiliary/placements/${p1}/accept", as: Volunteer, as_user_id: "${v_id}" }
            - { call: "POST /auxiliary/volunteers/${v_id}/activate", as: VolunteerCoordinator, captures: { st_active: $.data.service_status } }
          trigger:
            - { call: "POST /auxiliary/volunteers/${v_id}/separate", payload: { separation_reason: "MOVED" }, as: VolunteerServicesDirector, captures: { st_sep: $.data.service_status } }
            - { call: "POST /auxiliary/volunteers/${v_id}/reapply", as: VolunteerCoordinator, captures: { app2: $.data.id, app2_link: $.data.volunteer_id } }
            - { call: "POST /auxiliary/volunteer-applications/${app2}/start-review", as: VolunteerCoordinator }
            - { call: "POST /auxiliary/volunteer-applications/${app2}/decide", payload: { decision: "APPROVE" }, as: VolunteerServicesDirector, captures: { st_back: $.data.status } }
            - { call: "GET /auxiliary/volunteers/${v_id}", as: VolunteerCoordinator, captures: { v_status: $.data.service_status, v_joined: $.data.joined_at } }
            - { call: "GET /auxiliary/badges", payload: {}, as: VolunteerCoordinator }
          assert:
            - "activation: service_status == ACTIVE; separation: == SEPARATED; after reapply+approve: == ONBOARDING (cycle)"
            - "the reactivated row is the SAME volunteer id (reapply application.volunteer_id == ${v_id})"
            - "badge audit: exactly one badge REVOKED (BDG-000001, reason SEPARATION) and exactly one badge PENDING (BDG-000002) — old badge never reused"
            - "volunteer.separated_at is null again and suspension_reason is null after reactivation"

  # ===========================================================================
  # Rule 4 — transitive_cascade (two cascades, different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clearance_revoke_freeze_cancels_and_promotes
        grounds:
          - state_machines.Clearance.CLEARED_to_REVOKED
          - state_machines.ShiftAssignment.SIGNED_UP_to_CANCELLED
          - state_machines.ShiftAssignment.WAITLISTED_to_SIGNED_UP
          - calculations.waitlist_promotion
          - calculations.compliance_posture
        distinguishing_aspect: |
