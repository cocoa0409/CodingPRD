              as: PricingAnalyst
              captures: { arr1_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr1_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr1_id}/activate"
              payload: { expected_matter_version: "${matter_v0}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
          trigger:
            - call: "POST /firms/${firm_id}/matters/${matter_id}/fee_arrangements"
              payload: { arrangement_type: "CAPPED_FEE", capped_fee_cents: 80000, fiscal_year_index: 2026, supersedes_arrangement_id: "${arr1_id}" }
              as: PricingAnalyst
              captures: { arr2_id: $.data.id }
