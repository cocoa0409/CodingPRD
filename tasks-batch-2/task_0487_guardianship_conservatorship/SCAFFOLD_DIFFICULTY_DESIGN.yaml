          On POST /gc/expenditures an amount of exactly 1,000,000 routes to APPROVED (requires_court_approval
          false, strict greater-than), while 1,000,001 routes to PENDING_COURT (requires_court_approval true);
          the boundary metric is amount_cents vs COURT_APPROVAL_THRESHOLD_CENTS, reached through the create endpoint.
