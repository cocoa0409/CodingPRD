scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: create_event_returns_all_fields_and_draft
        claim_type: Creation
        grounds: [entities.Event, endpoints]
        distinguishing_aspect: "POST /events with all required fields returns 201, status DRAFT, version 1, and a server-minted id."
        test_recipe:
          setup: ["A series, venue, chef exist"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 2, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "1 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 2, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
          assert:
            - "http status == 201"
            - "Event.${event_id}.status == DRAFT"
            - "Event.${event_id}.version == 1"

      - name: create_booking_missing_seat_ids_returns_422
        claim_type: Required Fields
        grounds: [entities.Booking.fields.seat_ids, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required seat_ids field on POST /bookings returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["OPEN event, guest exists"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "2 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "G", email: "g@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 1 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 422"

      - name: get_event_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Event, "errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /events/{unknown-uuid} returns ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /events/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_NOT_FOUND"
            - "http status == 404"

      - name: booking_system_fields_defaulted_on_create
        claim_type: System Fields
        grounds: [entities.Booking.fields.deposit_paid_cents, entities.Booking.fields.refund_cents, entities.Booking.fields.payment_status]
        distinguishing_aspect: "A freshly created Booking has deposit_paid_cents 0, refund_cents 0, payment_status UNPAID, booking_status PENDING_DEPOSIT."
        test_recipe:
          setup: ["OPEN event, 1 seat"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "3 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "G", email: "g@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id" }
          trigger:
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 1, seat_ids: ["${seat0}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.deposit_paid_cents == 0"
            - "Booking.${booking_id}.refund_cents == 0"
            - "Booking.${booking_id}.payment_status == UNPAID"
            - "Booking.${booking_id}.booking_status == PENDING_DEPOSIT"

  # =================================================================
  - section: state_machines
    instances:
      - name: open_draft_event_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Event.SCHEDULED_to_OPEN, "errors[ERR_INVALID_EVENT_STATE]"]
        distinguishing_aspect: "POST /events/{id}/open on a DRAFT (never scheduled) event returns ERR_INVALID_EVENT_STATE (409)."
        test_recipe:
          setup: ["DRAFT event exists (not scheduled)"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "4 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_EVENT_STATE"
            - "http status == 409"

      - name: complete_before_event_end_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Event.OPEN_to_COMPLETED, "errors[ERR_EVENT_NOT_ENDED]"]
        distinguishing_aspect: "POST /events/{id}/complete while clock < event_end returns ERR_EVENT_NOT_ENDED (409)."
        test_recipe:
          setup: ["OPEN event; clock at default 2026-03-01 which is before event_end 2026-03-15"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "5 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /events/${event_id}/complete"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EVENT_NOT_ENDED"
            - "http status == 409"

      - name: cancel_already_cancelled_booking_rejected
        claim_type: Idempotency
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED, "errors[ERR_BOOKING_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A second POST /bookings/{id}/cancel on an already CANCELLED booking returns ERR_BOOKING_ALREADY_TERMINAL (409)."
        test_recipe:
          setup: ["OPEN event; guest books+pays then cancels once (booking CANCELLED); clock at default 2026-03-01"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "6 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "G", email: "g@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-20T18:00:00Z", event_end: "2026-03-20T21:00:00Z", booking_deadline: "2026-03-19T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id" }
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 1, seat_ids: ["${seat0}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/pay-deposit"
              payload: { amount_cents: 2500 }
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /bookings/${booking_id}/cancel"
              payload: { reason: "first" }
              as: Guest
              as_user_id: "${guest_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: { reason: "again" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BOOKING_ALREADY_TERMINAL"
            - "http status == 409"

      - name: withdraw_non_waiting_entry_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.WaitlistEntry.WAITING_to_WITHDRAWN, "errors[ERR_WAITLIST_ENTRY_NOT_WAITING]"]
        distinguishing_aspect: "Withdrawing an already WITHDRAWN waitlist entry returns ERR_WAITLIST_ENTRY_NOT_WAITING (409)."
        test_recipe:
          setup: ["OPEN full event (1 seat sold); guest2 waitlisted then withdrawn once"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 1, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "7 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "G1", email: "g1@x.com" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /guests"
              payload: { name: "G2", email: "g2@x.com" }
              as: PlatformAdmin
              captures: { g2: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-20T18:00:00Z", event_end: "2026-03-20T21:00:00Z", booking_deadline: "2026-03-19T00:00:00Z", table_mode: "COMMUNAL", seat_capacity: 1, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id" }
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${g1}", party_size: 1, seat_ids: ["${seat0}"] }
              as: Guest
              as_user_id: "${g1}"
              captures: { b1: $.data.id }
            - call: "POST /bookings/${b1}/pay-deposit"
              payload: { amount_cents: 2500 }
              as: Guest
              as_user_id: "${g1}"
            - call: "POST /events/${event_id}/waitlist"
              payload: { guest_id: "${g2}", party_size: 1 }
              as: Guest
              as_user_id: "${g2}"
              captures: { w2: $.data.id }
            - call: "POST /waitlist/${w2}/withdraw"
              payload: {}
              as: Guest
              as_user_id: "${g2}"
          trigger:
            - call: "POST /waitlist/${w2}/withdraw"
              payload: {}
              as: Guest
              as_user_id: "${g2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WAITLIST_ENTRY_NOT_WAITING"
            - "http status == 409"

  # =================================================================
  - section: calculations
    instances:
      - name: corkage_computed_on_byob_booking
        claim_type: Correct Result
        grounds: [calculations.booking_total_price, entities.Booking.fields.corkage_due_cents]
        distinguishing_aspect: "On a BYOB event (corkage_fee_cents 1500), a booking with byob_bottles 2 has corkage_due_cents 3000 and total 23000 (subtotal 20000 + corkage 3000, no discount)."
        test_recipe:
          setup: ["OPEN PRIVATE event byob_allowed true, corkage_fee_cents 1500, seat_price 10000, 2 seats; guest books 2 seats with byob_bottles 2"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 2, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "8 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "G", email: "g@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "PRIVATE", seat_capacity: 2, seat_price_cents: 10000, deposit_pct: 0.25, byob_allowed: true, corkage_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { seat0: "$.data[0].id", seat1: "$.data[1].id" }
          trigger:
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 2, seat_ids: ["${seat0}", "${seat1}"], byob_bottles: 2 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.corkage_due_cents == 3000"
            - "Booking.${booking_id}.total_price_cents == 23000"

      - name: head_table_supplement_in_deposit_and_total
        claim_type: Constants Applied
        grounds: [calculations.booking_deposit_due, calculations.booking_total_price, entities.Seat.fields.seat_type]
        distinguishing_aspect: "A HEAD_TABLE seat adds HEAD_TABLE_SUPPLEMENT_CENTS 2000: base 12000 -> deposit round_half_up(12000*0.25)=3000, total 12000 (party 1, no discount)."
        test_recipe:
          setup: ["Event scheduled with head_table_count 1 so seat S1 is HEAD_TABLE; opened; guest books that head seat"]
          setup_api_calls:
            - call: "POST /series"
              payload: { name: "S", cadence: "WEEKLY", theme: "T", default_seat_capacity: 2, base_seat_price_cents: 10000, default_deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { series_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "V", address: "9 St", max_capacity: 10, corkage_policy: "ALLOWED" }
              as: PlatformAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /chefs"
              payload: { name: "C", specialty: "T" }
              as: PlatformAdmin
              captures: { chef_id: $.data.id }
            - call: "POST /guests"
              payload: { name: "G", email: "g@x.com" }
              as: PlatformAdmin
              captures: { guest_id: $.data.id }
            - call: "POST /events"
              payload: { series_id: "${series_id}", venue_id: "${venue_id}", chef_id: "${chef_id}", title: "E", event_start: "2026-03-15T18:00:00Z", event_end: "2026-03-15T21:00:00Z", booking_deadline: "2026-03-14T00:00:00Z", table_mode: "PRIVATE", seat_capacity: 2, seat_price_cents: 10000, deposit_pct: 0.25 }
              as: PlatformAdmin
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: { head_table_count: 1 }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/menu-courses"
              payload: { course_number: 1, name: "C", contains_allergens: [] }
              as: PlatformAdmin
            - call: "POST /events/${event_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /events/${event_id}/seats"
              payload: {}
              as: PlatformAdmin
              captures: { head_seat: "$.data[0].id" }
          trigger:
            - call: "POST /bookings"
              payload: { event_id: "${event_id}", guest_id: "${guest_id}", party_size: 1, seat_ids: ["${head_seat}"] }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "Booking.${booking_id}.deposit_due_cents == 3000"
            - "Booking.${booking_id}.total_price_cents == 12000"

      - name: refund_tier_7_day_half_refund
        claim_type: Correct Result
        grounds: [calculations.cancellation_refund, entities.Booking.fields.refund_cents]
        distinguishing_aspect: "Cancelling 7 days out (clock 2026-03-08, event_start 2026-03-15) applies the 0.5 tier: 5000 deposit refunds 2500, payment_status PARTIALLY_REFUNDED."
        test_recipe:
          setup: ["OPEN event event_start 2026-03-15T00:00:00Z; guest books 2 seats, pays 5000; clock advanced to 2026-03-08"]
          setup_api_calls:
            - call: "POST /series"
