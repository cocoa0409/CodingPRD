            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "OPEN_REVIEW" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "SUBSTANTIATE", disposition_reason: "Two registrants confirmed they never attended." }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
          trigger:
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2025-01-01T00:00:00Z", audit_period_end: "2025-06-30T00:00:00Z", trigger_type: "COMPLAINT_ESCALATION", originating_complaint_id: "${cmp_id}" }
