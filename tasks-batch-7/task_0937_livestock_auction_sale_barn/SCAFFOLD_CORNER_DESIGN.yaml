        claim_type: Constants Applied
        grounds: ["calculations.indemnity_fee"]
        excluded_because:
          difficulty_instance: "commission_floor_and_cap_nesting_mode_a"
          rationale: "That instance already pins indemnity_fee_amount == 0.75 on a 500.00 gross (the raw 0.0015 branch, above the 0.50 floor) and == 25.00 on a 24000.00 gross (the INDEMNITY_MAX cap branch). The INDEMNITY_MIN floor binds only below a gross of 333.34 and is reachable through a single-head PER_HEAD lot hammered at 300.00."

