            - "after cancel: MealOrder.${mo_id}.fulfillment_status == CANCELLED"
            - "after cancel: MealPeriod.${mp_id}.committed_tray_count == 0"
            - "after cancel: MealPeriod.${mp_id}.committed_food_cost_cents == 0"
            - "after cancel: MealPeriod.${mp_id}.period_overhead_cents == 0 and MealPeriod.${mp_id}.period_bulk_discount_cents == 0 and MealPeriod.${mp_id}.period_total_cost_cents == 0"
            - "GET /nutrition/meal-orders?meal_period_id=${mp_id}&fulfillment_status=VALIDATED returns total_count == 0"
            - "MealOrder.${mo_id}.food_cost_cents == 211 is unchanged by the cancel"

      - name: patient_supplement_cost_ledger_conserved_across_activate_then_cancel
        grounds:
          - state_machines.SupplementOrder.PENDING_to_ACTIVE
          - state_machines.SupplementOrder.ACTIVE_to_CANCELLED
          - entities.Patient.fields.daily_supplement_cost_cents
          - entities.SupplementOrder.fields.daily_cost_cents
          - concurrency_rules[supplement-order-create-stale-consult]
        distinguishing_aspect: |
          The conserved quantity is a MONETARY ledger in cents, not a slot count, and it is carried by
          a different action pair on a different entity: Patient.daily_supplement_cost_cents ==
          sum(SupplementOrder.daily_cost_cents where patient_id == P.id AND status == ACTIVE). Two
          activations take it to 780 and cancelling only the 520 order leaves exactly 260, with the
          cancelled order's own daily_cost_cents still reading 520.
        test_recipe:
          setup:
            - "Menu item SUP-ORS costs 260 cents per dose."
            - "A NutritionConsult raised by u-phys-1 is ASSIGNED, ASSESSED and SIGNED by u-rd-1."
            - "Two SupplementOrders exist on it: SO1 at 2 doses per day (520 cents) and SO2 at 1 dose per day (260 cents), both ACTIVE, so the patient ledger reads 780."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/menu-items"
              payload: { item_code: "SUP-ORS", display_name: "Oral Supplement", sodium_mg: 200, potassium_mg: 300, carb_g: 30.0, protein_g: 16.0, unit_cost_cents: 260, texture_level: "LIQUIDISED", service_temp_class: "COLD", liquid_level: "MILDLY_THICK", allergen_codes: ["MILK"] }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mi_sup_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-K001", full_name: "Kim Sato", age_years: 69 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p_id: $.data.id }
            - call: "POST /nutrition/nutrition-consults"
              payload: { patient_id: "${p_id}", reason_code: "POOR_INTAKE", acuity: "URGENT" }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { c_id: $.data.id }
            - call: "POST /nutrition/nutrition-consults/${c_id}/assign"
              payload: { dietitian_user_id: "u-rd-1" }
              as: Dietitian
              as_user_id: "u-rd-1"
            - call: "POST /nutrition/nutrition-consults/${c_id}/assess"
              payload: { assessment_variant: "COMPREHENSIVE", weight_loss_pct: 12.0, intake_pct: 30.0, bmi: 17.0, albumin_g_dl: 2.8 }
              as: Dietitian
              as_user_id: "u-rd-1"
            - call: "POST /nutrition/nutrition-consults/${c_id}/sign"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { c_v1: $.data.version }
            - call: "POST /nutrition/supplement-orders"
              payload: { consult_id: "${c_id}", menu_item_id: "${mi_sup_id}", doses_per_day: 2, expected_consult_version: "${c_v1}" }
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { so1_id: $.data.id }
            - call: "GET /nutrition/nutrition-consults/${c_id}"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { c_v2: $.data.version }
            - call: "POST /nutrition/supplement-orders"
              payload: { consult_id: "${c_id}", menu_item_id: "${mi_sup_id}", doses_per_day: 1, expected_consult_version: "${c_v2}" }
              as: Dietitian
              as_user_id: "u-rd-1"
              captures: { so2_id: $.data.id }
            - call: "POST /nutrition/supplement-orders/${so1_id}/activate"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
            - call: "POST /nutrition/supplement-orders/${so2_id}/activate"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
          trigger:
            - call: "POST /nutrition/supplement-orders/${so1_id}/cancel"
              payload: {}
              as: Dietitian
              as_user_id: "u-rd-1"
          assert:
            - "before the trigger Patient.${p_id}.daily_supplement_cost_cents == 780"
            - "after the trigger Patient.${p_id}.daily_supplement_cost_cents == 260"
            - "SupplementOrder.${so1_id}.status == CANCELLED and SupplementOrder.${so1_id}.daily_cost_cents == 520"
            - "SupplementOrder.${so2_id}.status == ACTIVE and SupplementOrder.${so2_id}.daily_cost_cents == 260"
            - "GET /nutrition/supplement-orders?patient_id=${p_id}&status=ACTIVE returns total_count == 1"
            - "NutritionConsult.${c_id}.linked_supplement_order_count == 2"
            - "NutritionConsult.${c_id}.malnutrition_risk_score == 70.00"
            - "NutritionConsult.${c_id}.risk_tier == HIGH"
