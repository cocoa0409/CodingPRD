      - name: production_batch_top_off_bake_cycles_holding_back_to_baking
        grounds:
          - state_machines.ProductionBatch.PLANNED_to_BAKING
          - state_machines.ProductionBatch.BAKING_to_HOLDING
          - state_machines.ProductionBatch.HOLDING_to_BAKING
          - calculations.batch_qty_invariant
          - entities.ProductionBatch.fields.hold_expires_at
          - entities.Store.fields.hot_case_slots_used
        distinguishing_aspect: |
          CYCLIC shape on the batch axis: HOLDING -> BAKING is a backward edge that raises baked_qty from
          40 to 52, NULLS hold_started_at and hold_expires_at (the case clock restarts only on the next
          pull, giving 12:30 instead of the original 12:00) and leaves Store.hot_case_slots_used at 1
          because the batch never vacated its slot - a forward-only reading would either double-count the
          slot or keep the stale 12:00 expiry.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z; store still in its initial BREAKFAST daypart"
            - "one BAKERY_CASE holding unit with 3 slots; one pretzel batch of 40 planned into slot 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T08:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { exp_first: $.data.hold_expires_at }
          trigger:
            - call: "POST /production-batches/${batch_id}/bake"
              payload: { additional_qty: 12 }
              as: KitchenAssociate
              captures: { st_topoff: $.data.status, baked_after: $.data.baked_qty, exp_topoff: $.data.hold_expires_at }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { slots_mid: $.data.hot_case_slots_used }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:30:00Z" }
              as: ChainAdmin
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { exp_second: $.data.hold_expires_at }
          assert:
            - "${exp_first} == 2026-08-01T12:00:00Z"
            - "${st_topoff} == BAKING"
            - "${baked_after} == 52"
            - "${exp_topoff} == null"
            - "${slots_mid} == 1"
            - "${exp_second} == 2026-08-01T12:30:00Z"
            - "ProductionBatch.${batch_id}.status == HOLDING"
            - "ProductionBatch.${batch_id}.baked_qty == 52"
            - "ProductionBatch.${batch_id}.remaining_qty == 52"
            - "ProductionBatch.${batch_id}.reserved_qty == 0"
            - "ProductionBatch.${batch_id}.sold_qty == 0"
            - "ProductionBatch.${batch_id}.discarded_qty == 0"
            - "Store.${store_id}.hot_case_slots_used == 1"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: out_of_range_temperature_log_cascades_five_levels_to_store_ledger
        grounds:
          - state_machines.HoldingUnit.OPERATIONAL_to_IMPAIRED
          - state_machines.ProductionBatch.HOLDING_to_DISCARDED
          - calculations.waste_valuation
          - calculations.inspection_readiness
          - entities.TemperatureLog.fields.in_range
          - entities.Store.fields.hot_case_slots_used
          - entities.Store.fields.waste_cost_cents_mtd
        distinguishing_aspect: |
          Depth-5 fan-out from a single write: TemperatureLog(in_range false) -> HoldingUnit IMPAIRED ->
          BOTH holding batches DISCARDED -> two WasteLog rows (1600 + 800 food cost) -> Store
          waste_cost_cents_mtd 2400 and hot_case_slots_used 2 -> 0, with the readiness read at the far
          end reporting units_impaired_count 1 and retail exposure 11940. The cascade fans OUT to two
          sibling batches, unlike the linear ticket->order->batch chain.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z; store still in its initial BREAKFAST daypart"
            - "one BAKERY_CASE unit BC-1 with a 135..185 F band, 3 slots, OPERATIONAL"
            - "two pretzel batches HOLDING in the same unit: 40 units in slot 1 and 20 units in slot 2, neither reserved, hot_case_slots_used 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T08:00:00Z" }
              as: KitchenAssociate
              captures: { batch_a: $.data.id }
            - call: "POST /production-batches/${batch_a}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_a}/pull"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 2, planned_qty: 20, bake_start_at: "2026-08-01T08:00:00Z" }
              as: KitchenAssociate
              captures: { batch_b: $.data.id }
            - call: "POST /production-batches/${batch_b}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_b}/pull"
              payload: {}
              as: KitchenAssociate
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { slots_before: $.data.hot_case_slots_used }
          trigger:
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 120 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_id: $.data.id, log_in_range: $.data.in_range }
            - call: "GET /holding-units/${unit_id}"
