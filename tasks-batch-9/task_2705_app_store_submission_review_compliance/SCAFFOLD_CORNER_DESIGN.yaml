          - endpoints.GET_/publisher-accounts/{id}/standing
        distinguishing_aspect: "A same-day CRITICAL rejection carries decay 1.0 in BOTH variants, so the dual-variant read reports standing_score_rolling_365 == standing_score_lifetime == 88.00 with decayed_penalty_total == undecayed_penalty_total == 12.00 and rejection_strike_count == 1."
        test_recipe:
