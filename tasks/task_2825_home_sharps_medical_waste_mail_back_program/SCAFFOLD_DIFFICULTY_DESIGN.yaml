  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_kit_issuance_for_paused_enrollment
        grounds:
          - validations.priority_6_ERR_INVALID_ENROLLMENT_STATE
          - validations.priority_35_ERR_PROGRAM_FUNDING_EXHAUSTED
          - endpoints.POST_/sharps/enrollments/{id}/kits
        pair:
          higher_priority: { priority: 6, category: state, error_id: ERR_INVALID_ENROLLMENT_STATE, http_status: 409 }
          lower_priority: { priority: 35, category: business_fiscal, error_id: ERR_PROGRAM_FUNDING_EXHAUSTED, http_status: 422 }
        distinguishing_aspect: |
          The STATE band (6) versus the FISCAL band (35) on kit issuance: the enrollment is still DRAFT
          while the program simultaneously cannot afford a single 1465-cent kit out of its 100-cent
          ceiling, so 29 priority levels separate the two violated rules. An implementation that checks
          affordability first (the natural order, because the cost must be computed anyway to know it
          is unaffordable) returns 422 ERR_PROGRAM_FUNDING_EXHAUSTED instead of 409.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Baseline CA state rule and PS-A spec."
            - "NovaPen MANUFACTURER program NPD-TINY: funding_ceiling_cents 100 (far below any kit cost) and per_kit_allowance_cents 6000."
            - "Patient Dana Reyes reviewed APPROVE, so she is ELIGIBLE."
            - "Enrollment created and deliberately LEFT IN DRAFT: never submitted, never sponsor-approved. The patient therefore also stays ELIGIBLE rather than ENROLLED, so the priority 7 patient-state rule is violated too and must also lose to priority 6."
            - "The DRAFT enrollment's current version is captured so the priority 13 OCC rule is satisfied and cannot mask the answer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "CONDITIONALLY_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3, requires_state_manifest: false, notification_deadline_hours: 72 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "NovaPen Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@novapen.example", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { sp_np: $.data.id }
            - call: "POST /sharps/sponsors/${sp_np}/programs"
              payload: { program_code: "NPD-TINY", funding_ceiling_cents: 100, per_kit_allowance_cents: 6000 }
              as: ProgramAdmin
              captures: { prog_tiny: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 14, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_tiny}", cadence_days: 30, kits_authorized: 5 }
              as: ProgramAdmin
              captures: { enr_draft: $.data.id, enr_dv: $.data.version }
          trigger:
            - call: "POST /sharps/enrollments/${enr_draft}/kits"
              payload: { expected_enrollment_version: "${enr_dv}" }
              as: ProgramAdmin
          assert:
            - "HTTP status 409"
            - "response data.error_id == \"ERR_INVALID_ENROLLMENT_STATE\""
            - "response data.error_id != \"ERR_PROGRAM_FUNDING_EXHAUSTED\""
            - "Enrollment.${enr_draft}.status == DRAFT"
            - "Enrollment.${enr_draft}.kits_issued == 0"
            - "GET /sharps/kits?enrollment_id=${enr_draft} returns total_count 0"
            - "SponsorshipProgram.${prog_tiny}.reserved_cents == 0"
            - "SponsorshipProgram.${prog_tiny}.available_cents == 100"
            - "SponsorshipProgram.${prog_tiny}.status == ACTIVE"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog_tiny} returns total_count 0"

      - name: safety_beats_constraint_on_label_activation_for_prohibited_state
        grounds:
          - validations.priority_14_ERR_STATE_MAILBACK_PROHIBITED
          - validations.priority_19_ERR_POSTAL_WEIGHT_EXCEEDED
          - endpoints.POST_/sharps/return-labels/{id}/activate
          - entities.StateSharpsRule.fields.mail_back_permitted
        pair:
          higher_priority: { priority: 14, category: business_safety, error_id: ERR_STATE_MAILBACK_PROHIBITED, http_status: 422 }
          lower_priority: { priority: 19, category: business_constraint, error_id: ERR_POSTAL_WEIGHT_EXCEEDED, http_status: 422 }
        distinguishing_aspect: |
          A different band pair (SAFETY 14 vs CONSTRAINT 19) on a different endpoint, and - unlike the
          state/fiscal instance - BOTH candidate errors carry HTTP 422, so status code alone cannot
          distinguish a correct implementation from a wrong one; only data.error_id can. The patient's
