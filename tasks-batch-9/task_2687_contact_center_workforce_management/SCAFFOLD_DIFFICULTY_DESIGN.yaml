          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "LA-CORE; cycle W37-REV at REQUIREMENTS_LOCKED with ot_budget_cents 1000000; FG-A with the 2026-09-07 grid."
            - "Agent E-001 (2400 cents/hour) with PUBLISHED 08:00-16:00 shifts on 2026-09-07 and 2026-09-08 (15.00 committed hours)."
            - "Two OFFERED OT_OFFERs of 4.0 hours, one per shift, both ACCEPTED: 14400 then 14400, cycle spend 28800."
