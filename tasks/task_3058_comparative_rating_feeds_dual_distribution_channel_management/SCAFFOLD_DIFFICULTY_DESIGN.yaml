              as: Anonymous
              captures: { cons_id: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_flat}", channel: "AGENT", agent_id: "${b1}", coverages: [{ coverage_code: "FLAT", tier: "TIER_D" }] }
              as: Agent
