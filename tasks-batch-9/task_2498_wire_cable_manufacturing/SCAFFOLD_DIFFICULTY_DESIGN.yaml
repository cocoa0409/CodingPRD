          assert:
            - "the VARIATION inspection changes only the certification: ListingCertification.${cert_id}.status == VARIATION_NOTICE with open_variation_count 1, while CatalogProduct.${prod_id}.status is still RELEASED"
            - "the gated lot is untouched: ProductionLot.${lot_id}.version == ${lot_v_before}, process_state == TESTED, quality_state == PENDING"
            - "invalid branch: the release attempt returns HTTP 422 with error_id ERR_CERTIFICATION_NOT_ACTIVE (priority 66) purely because a different entity is not ACTIVE"
            - "no side effects on the failed release: ProductionLot.${lot_id}.released_by_user_id == null and packaged_length_ft == null"
            - "valid branch: after POST /listing-certifications/${cert_id}/reinstate returns the file to ACTIVE with open_variation_count 0 and FactoryInspection.${insp_id}.status == CLOSED, the byte-identical release request now returns 200 with ProductionLot.${lot_id}.quality_state == CONFORMING and released_by_user_id == qe-002"

      - name: product_release_depends_on_compound_status_and_rating
        entity_pair: [CatalogProduct, Compound]
        grounds:
          - state_machines.CatalogProduct.DRAFT_to_RELEASED
          - state_machines.Compound.DRAFT_to_QUALIFIED
          - validations.priority_65_ERR_COMPOUND_NOT_QUALIFIED
          - validations.priority_65_ERR_COMPOUND_RATING_INSUFFICIENT
          - endpoints.POST_/catalog-products/{id}/release
        depends_on: "Compound(insulation_compound_id).status == QUALIFIED and its temp_rating_c / max_voltage_v / flame_test cover the SKU"
        distinguishing_aspect: |
          A different entity pair and a different flavour of dependency: it is not
          only the referenced entity's STATE that gates the write but also its
          static rating fields, and the two failure modes are separate error ids
          sharing one priority. The dependency is also directional and pinning -
          on success the SKU records pinned_insulation_compound_version, so the
          product remembers exactly which revision of the other entity it was
          cleared against.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; UL file E12345 ACTIVE via a PASS inspection on 2026-06-05."
            - "Compound PVC-90-INS (INSULATION, temp_rating_c 90, flame_test VW_1, max_voltage_v 600) created but deliberately left in status DRAFT."
            - "Compound NYL-JKT (JACKET, 90, VW_1, 600) created and QUALIFIED."
            - "SKU THHN-12-CU (LV_600, THHN, temp_rating_c 90) in status DRAFT referencing both compounds."
            - "SKU MV105-2-BADCMP (MV_15KV -> voltage_rating_v 15000, MV_105, temp_rating_c 90) in status DRAFT referencing the SAME 600 V insulation compound, so it is under-rated by voltage even once that compound is QUALIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds"
              payload: { compound_code: "NYL-JKT", layer_role: "JACKET", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 5.0 }
              as: ProcessEngineer
              captures: { jkt_id: $.data.id }
            - call: "POST /compounds/${jkt_id}/qualify"
              payload: {}
