      - name: service_contract_closed_interval_touching_endpoints_conflict
        grounds:
          - validations[priority=19]
          - errors[ERR_CONTRACT_COVERAGE_OVERLAP]
          - entities.ServiceContract.fields.coverage_start
          - entities.ServiceContract.fields.coverage_end
        distinguishing_aspect: |
          Interval semantics #2 on a different resource entity (DEVICE MODEL coverage per
          vendor) with the OPPOSITE geometry — CLOSED [coverage_start, coverage_end]. Here a
          contract starting at exactly the instant another ends DOES collide, which is the
          direct inverse of the half-open loaner rule, and a start one day later is accepted.
        test_recipe:
          setup:
            - "One vendor and one model with a single ACTIVE contract covering 2026-01-01T00:00:00Z through 2026-06-30T00:00:00Z inclusive."
          setup_api_calls:
            - call: "POST /clinical-engineering/vendors"
              payload: { name: "BioServe Inc", vendor_code: "BSV", hourly_rate_cents: 18500, travel_flat_cents: 24000, security_attestation_on_file: true, is_approved: true }
