              as: Forecaster
              as_user_id: "${d_fc_a}"
              captures: { d_prod: $.data.id }
            - call: "POST /alerts/products/${d_prod}/submit-coordination"
              payload: {}
              as: Forecaster
              as_user_id: "${d_fc_a}"
            - call: "GET /alerts/coordination-requests"
              payload: { product_id: "${d_prod}", to_office_id: "${d_off_b}" }
              as: Forecaster
