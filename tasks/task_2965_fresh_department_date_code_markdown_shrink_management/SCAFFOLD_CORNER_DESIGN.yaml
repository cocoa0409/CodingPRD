            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_mid}", dock_door_code: "D9", scheduled_window_start: "2026-08-13T14:00:00.000Z", scheduled_window_end: "2026-08-13T15:00:00.000Z" }
              as: DepartmentManager
            - call: "POST /fresh/donation-pickups"
              payload: { store_id: "${store_id}", partner_id: "${partner_south}", dock_door_code: "D1", scheduled_window_start: "2026-08-13T14:00:00.000Z", scheduled_window_end: "2026-08-13T15:00:00.000Z" }
              as: DepartmentManager
            - call: "POST /fresh/donation-pickups"
