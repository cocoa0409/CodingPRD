  - section: errors
    instances:
      - name: the_error_envelope_carries_only_an_id_and_a_message_across_all_four_status_families
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_ROUND_NOT_FOUND
          - errors.ERR_DUPLICATE_CODE
          - errors.ERR_CASE_HAS_NO_ARTIFACTS
        distinguishing_aspect: |
          Four failures raised by four different endpoints must come back in one
          uniform shape: response_type == "error", a meta block with an
          api_request_id and an api_request_timestamp, and a data object holding
          exactly error_id and message - no partially built entity, no validation
          field list, no stack detail, and no id of the row that was not created. The
          four also occupy four different HTTP families (400 for a request the schema
          rejects, 404 for a row that does not exist, 409 for a state or uniqueness
          conflict, 422 for a domain rule that the schema cannot express), so an
          implementation that collapses everything onto 400 or onto 422 is detectable
          without reading any message text. The domain rules behind these four are
          asserted elsewhere; what is asserted here is the transport contract.
        test_recipe:
          setup:
            - "project in DESIGN_DEV with artifact 2019.14.3 registered and an empty case C-09"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
