      - name: transparency_file_build_rejects_stale_facility_version_terminal_files_and_publish_during_mapping
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_FACILITY_VERSION]
          - errors[ERR_INVALID_FILE_STATE]
          - errors[ERR_TRANSPARENCY_BLACKOUT]
          - errors[ERR_NO_PUBLISHABLE_ITEMS]
