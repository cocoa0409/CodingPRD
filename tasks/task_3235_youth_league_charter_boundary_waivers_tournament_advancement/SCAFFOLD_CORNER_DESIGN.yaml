      - name: severe_screening_cannot_be_approved_but_can_be_disqualified
        claim_type: violation_to_error
        grounds: [errors.ERR_DISQUALIFYING_OFFENSE, state_machines.BackgroundScreening]
        distinguishing_aspect: "A screening with offense_category SEXUAL_OFFENSE (auto_flagged) cannot be adjudicated APPROVE (ERR_DISQUALIFYING_OFFENSE); DISQUALIFY succeeds and disqualifies the volunteer."
        test_recipe:
          setup: ["League CHARTERED; volunteer V1 REGISTERED; screening S1 with SEXUAL_OFFENSE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
