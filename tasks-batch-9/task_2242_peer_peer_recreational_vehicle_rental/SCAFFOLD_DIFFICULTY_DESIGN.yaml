  # ===========================================================================
  - rule_id: combinatorial_formula
    scaffold_basis: >-
      §1.3 booking_quote_total is a six-step pinned chain whose STEP 2 tier
      selection, STEP 3 discount and STEP 5 fee base all change with which terms
      entered STEP 1, and §1.3 protection_premium is a max() of two competing
      terms wrapped in a min() against a ceiling cap. Which branch of each
      selector fires is decided by the ProtectionPlan configuration and by
      whether a DeliveryAssignment is SCHEDULED, so the same six formulas
      produce four different arithmetic paths.
    instances:

      - name: quote_mode_pickup_tier_keyed_on_pre_discount_not_grand_total
        grounds: >-
          §1.3 booking_quote_total STEP 2, whose comment pins the loyalty tier to
          pre_discount_cents rather than to the post-fee grand total, combined
          with STEP 5's pinned fee base that excludes overages.
        distinguishing_aspect: >-
          The PICKUP mode contributes delivery_fee_cents = 0, so
          pre_discount_cents = 110896 + 24951 = 135847. That sits in the
          LOYALTY_TIER_1 band [100000, 150000) and earns 400 bp = 5434. Keying
          the tier off the undiscounted grand total instead — 135847 plus its
          1200 bp fee, i.e. 152149 — crosses LOYALTY_TIER_2_MIN_CENTS and yields
          700 bp = 9509, a quoted total of 145623 rather than 146063. The two
          readings differ by exactly 440 cents, so the assert discriminates them.
        test_recipe:
          setup: Canonical marketplace, LISTED listing, funded renter, PICKUP booking B1 approved by the owner.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - *c_booking
            - *c_bk_approve
          trigger:
            - *c_bk_confirm
          assert:
            - "response 200"
            - "data.base_subtotal_cents == 110896"
            - "data.premium_cents == 24951"
            - "data.delivery_fee_cents == 0"
            - "data.loyalty_tier == 'LOYALTY_TIER_1'"
            - "data.loyalty_discount_cents == 5434"
            - "data.service_fee_cents == 15650"
            - "data.estimated_overage_cents == 0"
            - "data.quoted_total_cents == 146063"
            - "data.hold_amount_cents == 146063"
            - "data.settlement_status == 'HELD'"

      - name: quote_mode_campground_dropoff_delivery_term_crosses_into_tier_2
        grounds: >-
          §1.3 delivery_fee (base 12000 + 350 per mile + setup fee) feeding STEP 1
          of booking_quote_total, plus the §1.2 DeliveryAssignment rule that
          Booking.delivery_fee_cents mirrors the assignment only while its status
          is SCHEDULED or COMPLETED.
        distinguishing_aspect: >-
          Adding the delivery term is what changes the SELECTOR, not just the
          sum: 12000 + 350*40 + 5000 = 31000 lifts pre_discount_cents to 166847,
          which crosses into LOYALTY_TIER_2 and switches the discount rate from
          400 bp to 700 bp. The fee base therefore also moves, to 155168 rather
          than 130413. An implementation that adds the delivery fee after the
          tier decision, or that bills the fee on the pre-discount subtotal,
          produces a different quoted_total_cents than 173788.
        test_recipe:
          setup: >-
            Canonical marketplace and LISTED listing, plus an ACCEPTING
            campground with capacity 1, a 30-minute symmetric buffer and a 40 ft
            rig limit. Booking B2 is created with delivery_option
            CAMPGROUND_DROPOFF, then a DeliveryAssignment of 40 miles with a
            5000-cent setup fee is scheduled against the booking's current
            version before the owner approves it.
