  - section: errors
    instances:
      - name: error_unauthenticated_undeclared_role_on_read_returns_401
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - "GET /api/v1/lease-fleet-cars"
        distinguishing_aspect: "A read issued under the undeclared role Anonymous is rejected by priority 1 with ERR_UNAUTHENTICATED and HTTP 401 before any state or payload rule is evaluated, while the identical read under the declared role PlatformAdmin returns 200."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "One car type CT-H1 exists so the store is not empty and the read has a resolvable collection."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "CT-H1", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-H1" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
          trigger:
            - call: "GET /api/v1/lease-fleet-cars"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
            - call: "GET /api/v1/lease-fleet-cars"
              payload: {}
              as: PlatformAdmin
              captures: { ok_rtype: $.response_type }
          assert:
            - "The undeclared-role read returns HTTP 401 with data.error_id == ${err_id} == \"ERR_UNAUTHENTICATED\""
            - "The error envelope is the §1.0 error shape: response_type is \"error\" and data carries error_id plus a non-empty message == ${err_msg}"
            - "The role name Anonymous is not declared in §1.7, which is exactly the condition §1.6 attaches to ERR_UNAUTHENTICATED"
            - "Priority 1 is category auth and precedes every other rule, so the rejection is not affected by the query string or by any stored row"
            - "The control read under the declared PlatformAdmin role succeeds: HTTP 200 with response_type == ${ok_rtype} == \"array\", so the 401 is header-caused rather than endpoint-wide"

      - name: error_forbidden_declared_role_lacks_operation_returns_403
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles.RegulatoryRetrofitist.exclusive_operations
          - "POST /api/v1/retrofit-programs"
        distinguishing_aspect: "A declared role that §1.7 does not grant POST /retrofit-programs is rejected by priority 2 with ERR_FORBIDDEN and HTTP 403 — the authenticated-but-unpermitted case, distinct from priority 1's undeclared role — and no program row is written."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "ProductionPlanner is a declared §1.7 role, but POST /retrofit-programs is listed only under RegulatoryRetrofitist.exclusive_operations, so the operation is out of scope for the planner."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-FBD", description: "Denied mandate", compliance_deadline_date: "2026-12-31", required_shop_days_per_car: 3 }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-FBD", description: "Allowed mandate", compliance_deadline_date: "2026-12-31", required_shop_days_per_car: 3 }
              as: RegulatoryRetrofitist
              captures: { ok_id: $.data.id, ok_status: $.data.status }
            - call: "GET /api/v1/retrofit-programs"
              payload: {}
              as: PlatformAdmin
              captures: { only_row: "$.data[0].id" }
          assert:
            - "The planner's write returns HTTP 403 with data.error_id == ${err_id} == \"ERR_FORBIDDEN\""
            - "The role is authenticated — ProductionPlanner is declared in §1.7 — so priority 1 passes and priority 2 is the rejecting rule, not ERR_UNAUTHENTICATED"
            - "The identical payload under RegulatoryRetrofitist succeeds: HTTP 201 with data.id == ${ok_id} and data.status == ${ok_status} == \"PLANNED\", so the denial is role-scoped rather than payload-scoped"
            - "The denial is per-operation, not per-role: the same ProductionPlanner role is allowed GET /api/v1/retrofit-programs and POST /api/v1/car-types"
            - "Nothing was written by the denied call: GET /api/v1/retrofit-programs lists exactly one row, ${only_row} == ${ok_id}, so the 403 left no partial state"

      - name: error_self_approval_forbidden_same_operator_returns_403
        claim_type: Violation → Error
        grounds:
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - state_machines.SubstitutionEndorsement.PENDING_to_APPROVED
          - roles.LeaseAdministrator.exclusive_operations
