            - { call: "POST /api/buyers/${b2_id}/qualify", payload: { qualification_expires_at: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L1", county: "Dallas", state_code: "IA", total_gross_acres: 100, packaging_strategy: "WHOLE", reserve_price_total: 770000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 100, tillable_acres: 90, soil_productivity_index: 80, min_price: 400000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t1_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "ONLINE", scheduled_start: "2026-08-10T17:00:00Z", scheduled_end: "2026-08-10T19:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T17:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/auctions/${a_id}/open", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
          trigger:
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 499999.99, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}", captures: { bid1_id: $.data.id } }
            - { call: "GET /api/auctions/${a_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 502499.99, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b2_id}", captures: { bid2_st: $.data.status } }
            - { call: "GET /api/auctions/${a_id}", as: BrokerAgent, as_user_id: "${g_id}", captures: { a_v: $.data.version } }
            - { call: "POST /api/bids", payload: { auction_id: "${a_id}", amount: 507499.98, tract_ids: ["${t1_id}"], expected_auction_version: "${a_v}" }, as: Buyer, as_user_id: "${b1_id}", captures: { err: $.data.error_id } }
