              captures: { rt_id: $.data.id }
            - call: "GET /kcma/orders/${o2_id}"
              as: ShippingCoordinator
              captures: { o2_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
              payload: { order_id: "${o2_id}", expected_order_version: "${o2_v}" }
              as: ShippingCoordinator
            - call: "GET /kcma/orders/${o1_id}"
              as: ShippingCoordinator
              captures: { o1_v: $.data.version }
            - call: "POST /kcma/delivery-routes/${rt_id}/assign-order"
