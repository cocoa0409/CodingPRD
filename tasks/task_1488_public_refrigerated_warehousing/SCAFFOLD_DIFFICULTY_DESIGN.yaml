            - "Invoice.${invD6}.dwell_surcharge_cents == 750  # only pallet A: 60 days exactly -> >= 60 tier -> round_half_up(2000*0.25*1.5)"
            - "Pallet B (59 days) contributes 0 — the >= vs > boundary is exact"

      - name: invoice_settle_exact_amount_boundary
        grounds:
          - entities.Invoice.fields.total_cents
          - errors[ERR_INVOICE_AMOUNT_MISMATCH]
          - state_machines.Invoice.FINALIZED_to_SETTLED
        distinguishing_aspect: |
          Metric: cents. Settle with total-1 (8199) is rejected; total (8200)
          exactly succeeds. Endpoint: invoice settle. Third distinct metric and
          endpoint.
        test_recipe:
          setup:
            - "Customer with card A (frozen 3000); 2 pallets received 2026-08-01T00:00; August invoice FINALIZED at 2026-09-01"
            - "Expected: storage 2 * round_half_up(31*3000/30) = 6200; handling_in 2000; total 8200"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Settle Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custSe: $.data.id, custSe_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custSe}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custSe_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-16", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneSe: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custSe}", zone_id: "${zoneSe}", product_code: "PEAS", lot_code: "SE", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: CustomerAdmin, as_user_id: "${custSe}", captures: { rSe: $.data.id } }
            - { call: "POST /api/inbound-receipts/${rSe}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rSe}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
            - { call: "GET /api/invoices?customer_id=${custSe}&status=FINALIZED", as: BillingAdmin, captures: { invSe: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/invoices/${invSe}/settle", payload: { amount_cents: 8199 }, as: BillingAdmin, captures: { errSe: $.data.error_id } }
            - { call: "POST /api/invoices/${invSe}/settle", payload: { amount_cents: 8200 }, as: BillingAdmin }
            - { call: "GET /api/invoices/${invSe}", as: BillingAdmin, captures: { invSe_st: $.data.status } }
          assert:
            - "Invoice.${invSe}.total_cents == 8200  # 6200 storage + 2000 handling_in"
            - "Settle 8199: error_id == ERR_INVOICE_AMOUNT_MISMATCH and invoice stays FINALIZED"
            - "Settle 8200: succeeds; Invoice.${invSe}.status == SETTLED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_allocation_gated_by_pallet_quality
        grounds:
          - state_machines.OutboundOrder.SUBMITTED_to_ALLOCATED
          - state_machines.Pallet
          - calculations.fifo_allocation
        distinguishing_aspect: |
          Pair OutboundOrder -> Pallet: the order's allocate outcome depends on
          child pallets' quality state — with all stock QUARANTINED the order
          goes SHORTED with 0; after release-quarantine the same allocate
          reaches ALLOCATED.
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone, 2 pallets lot GQ received 2026-08-02, both quarantined by a confirmed excursion"
            - "Order for 2 pallets SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Gate Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custG: $.data.id, custG_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custG}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custG_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-17", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneG: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custG}", zone_id: "${zoneG}", product_code: "PEAS", lot_code: "GQ", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custG}", captures: { rG: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rG}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rG}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotG: $.data.lot_id } }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zoneG}", observed_temp_c: -3.0, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { exG: $.data.id } }
            - { call: "POST /api/temperature-excursions/${exG}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custG}", product_code: "PEAS", requested_pallets: 2 }, as: CustomerAdmin, as_user_id: "${custG}", captures: { oG: $.data.id } }
            - { call: "POST /api/outbound-orders/${oG}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custG}" }
          trigger:
            - { call: "POST /api/outbound-orders/${oG}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/outbound-orders/${oG}", as: WarehouseOperator, captures: { oG_st: $.data.status, oG_al: $.data.allocated_pallets } }
            - { call: "GET /api/pallets?lot_id=${lotG}", as: QualityManager, captures: { pG1: "$.data[0].id", pG2: "$.data[1].id" } }
            - { call: "POST /api/pallets/${pG1}/release-quarantine", payload: {}, as: QualityManager }
            - { call: "POST /api/pallets/${pG2}/release-quarantine", payload: {}, as: QualityManager }
            - { call: "POST /api/outbound-orders/${oG}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/outbound-orders/${oG}", as: WarehouseOperator, captures: { oG_st2: $.data.status, oG_al2: $.data.allocated_pallets } }
          assert:
            - "While pallets QUARANTINED: OutboundOrder.${oG}.status == SHORTED and allocated_pallets == 0"
            - "After release-quarantine: OutboundOrder.${oG}.status == ALLOCATED and allocated_pallets == 2"
            - "Order transition outcome is a function of Pallet.quality, not of any order-side change"

      - name: receipt_arrival_gated_by_zone_posture
        grounds:
          - state_machines.InboundReceipt.SCHEDULED_to_ARRIVED
          - calculations.zone_posture
          - errors[ERR_ZONE_FULL]
        distinguishing_aspect: |
          Pair InboundReceipt -> TemperatureZone: arrival is legal only while
          the zone posture is not FULL; after the last pallet ships out
          (posture back to OPEN) the same arrival succeeds. Different entity
          pair from Order->Pallet.
        test_recipe:
          setup:
            - "Customer with card A; zone cap 1; receipt1 (1 pallet) COMPLETED -> zone FULL; receipt2 (1 pallet) SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Posture Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custPo: $.data.id, custPo_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custPo}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custPo_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-18", temp_class: FROZEN, capacity_pallets: 1, dock_doors: 2 }, as: WarehouseOperator, captures: { zonePo: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custPo}", zone_id: "${zonePo}", product_code: "PEAS", lot_code: "P1", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custPo}", captures: { rPo1: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custPo}", zone_id: "${zonePo}", product_code: "PEAS", lot_code: "P2", production_date: "2026-01-16", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T11:00:00Z", window_end: "2026-08-02T13:00:00Z" }, as: CustomerAdmin, as_user_id: "${custPo}", captures: { rPo2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rPo1}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rPo1}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custPo}", product_code: "PEAS", requested_pallets: 1 }, as: CustomerAdmin, as_user_id: "${custPo}", captures: { oPo: $.data.id } }
            - { call: "POST /api/outbound-orders/${oPo}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custPo}" }
            - { call: "POST /api/outbound-orders/${oPo}/allocate", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/inbound-receipts/${rPo2}/arrive", payload: {}, as: WarehouseOperator, captures: { errPo: $.data.error_id } }
            - { call: "POST /api/outbound-orders/${oPo}/ship", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rPo2}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/inbound-receipts/${rPo2}", as: WarehouseOperator, captures: { rPo2_st: $.data.status } }
          assert:
            - "While zone FULL: receipt2 arrive -> error_id == ERR_ZONE_FULL (Receipt gated by TemperatureZone.posture)"
            - "After ship frees the slot (in_use 0 -> free 1 -> posture TIGHT; only FULL gates arrival): receipt2 arrive succeeds"
            - "InboundReceipt.${rPo2}.status == ARRIVED"

      - name: claim_create_gated_by_excursion_state
        grounds:
          - state_machines.Claim
          - state_machines.TemperatureExcursion
          - errors[ERR_EXCURSION_NOT_CONFIRMED]
        distinguishing_aspect: |
          Pair Claim -> TemperatureExcursion: claim creation is legal only once
          the excursion is CONFIRMED_BREACH; while REPORTED it is rejected with
          ERR_EXCURSION_NOT_CONFIRMED. Third distinct entity pair.
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone, 1 pallet received 2026-08-02; excursion reported (window 2026-08-03..2026-08-04), still REPORTED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Gate2 Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custG2: $.data.id, custG2_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custG2}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custG2_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-19", temp_class: FROZEN, capacity_pallets: 5, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneG2: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custG2}", zone_id: "${zoneG2}", product_code: "PEAS", lot_code: "G2", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custG2}", captures: { rG2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rG2}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rG2}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/temperature-excursions", payload: { zone_id: "${zoneG2}", observed_temp_c: -6.0, window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }, as: WarehouseOperator, as_user_id: "op-1", captures: { exG2: $.data.id } }
          trigger:
            - { call: "POST /api/claims", payload: { customer_id: "${custG2}", excursion_id: "${exG2}", affected_pallet_count: 1, declared_value_cents: 5000 }, as: CustomerAdmin, as_user_id: "${custG2}", captures: { errG2: $.data.error_id } }
            - { call: "POST /api/temperature-excursions/${exG2}/confirm", payload: {}, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /api/claims", payload: { customer_id: "${custG2}", excursion_id: "${exG2}", affected_pallet_count: 1, declared_value_cents: 5000 }, as: CustomerAdmin, as_user_id: "${custG2}", captures: { clG2: $.data.id } }
          assert:
            - "While REPORTED: claim create -> error_id == ERR_EXCURSION_NOT_CONFIRMED"
            - "After confirm: claim create succeeds (Claim.${clG2} exists, status FILED)"
            - "TemperatureExcursion.${exG2}.quarantined_pallet_count == 1 (claim count 1 <= 1)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: blast_cell_turnaround_buffer_semantics
        grounds:
          - "endpoints[POST /api/blast-freeze-bookings]"
          - entities.BlastFreezeCell.fields.turnaround_minutes
          - errors[ERR_BOOKING_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: half-open windows PLUS a turnaround buffer — a
          booking starting 15 min after a 12:00 end conflicts (gap 15 < 30);
          one starting at exactly 12:30 passes (gap == turnaround is allowed,
          conflict iff start < existing.end + turnaround). Resource:
          BlastFreezeCell.
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone, 4 pallets lot BF received 2026-08-02; cell turnaround_minutes 30, capacity 5"
            - "Booking1 on the cell: 2026-08-10T10:00-12:00 SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Blast Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custB2: $.data.id, custB2_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custB2}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custB2_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-20", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneB2: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custB2}", zone_id: "${zoneB2}", product_code: "PEAS", lot_code: "BF", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 4, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custB2}", captures: { rB2: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rB2}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rB2}/complete", payload: { actual_pallets: 4 }, as: WarehouseOperator, captures: { lotB2: $.data.lot_id } }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-2", capacity_pallets: 5, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cellB2: $.data.id } }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellB2}", lot_id: "${lotB2}", pallet_count: 2, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: WarehouseOperator, captures: { bkB1: $.data.id } }
          trigger:
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellB2}", lot_id: "${lotB2}", pallet_count: 1, window_start: "2026-08-10T12:15:00Z", window_end: "2026-08-10T13:00:00Z" }, as: WarehouseOperator, captures: { errB2: $.data.error_id } }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellB2}", lot_id: "${lotB2}", pallet_count: 1, window_start: "2026-08-10T12:30:00Z", window_end: "2026-08-10T13:30:00Z" }, as: WarehouseOperator, captures: { bkB3: $.data.id } }
          assert:
            - "12:15 start: error_id == ERR_BOOKING_WINDOW_CONFLICT  # gap 15 < turnaround 30"
            - "12:30 start: succeeds (Booking.${bkB3} SCHEDULED)      # gap == 30 >= turnaround: conflict iff new.start < existing.end + turnaround, 12:30 < 12:30 is false"
            - "Buffer semantics: even zero-overlap adjacency conflicts when turnaround > 0 — unlike the dock-door rule"

      - name: dock_door_aggregate_capacity_semantics
        grounds:
          - "endpoints[POST /api/inbound-receipts]"
          - entities.TemperatureZone.fields.dock_doors
          - errors[ERR_DOCK_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity over strict overlap — mere
          adjacency (end == start) does NOT count as overlap, and a conflict
          requires the overlapping receipt count to reach dock_doors. Resource:
          TemperatureZone dock doors — different resource and different
          interval semantics from the blast cell buffer rule.
        test_recipe:
          setup:
            - "Customer with card A; zone dock_doors 1; receipt1 window 2026-08-05T09:00-11:00 SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Dock Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custDk: $.data.id, custDk_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custDk}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custDk_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-21", temp_class: FROZEN, capacity_pallets: 50, dock_doors: 1 }, as: WarehouseOperator, captures: { zoneDk: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custDk}", zone_id: "${zoneDk}", product_code: "PEAS", lot_code: "DK1", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-05T09:00:00Z", window_end: "2026-08-05T11:00:00Z" }, as: CustomerAdmin, as_user_id: "${custDk}", captures: { rDk1: $.data.id } }
          trigger:
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custDk}", zone_id: "${zoneDk}", product_code: "PEAS", lot_code: "DK2", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-05T11:00:00Z", window_end: "2026-08-05T13:00:00Z" }, as: CustomerAdmin, as_user_id: "${custDk}", captures: { rDk2: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custDk}", zone_id: "${zoneDk}", product_code: "PEAS", lot_code: "DK3", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-05T10:30:00Z", window_end: "2026-08-05T12:00:00Z" }, as: CustomerAdmin, as_user_id: "${custDk}", captures: { errDk: $.data.error_id } }
          assert:
            - "Adjacent receipt (11:00 start == 11:00 end) ACCEPTED: Receipt.${rDk2} exists with status SCHEDULED — adjacency is not overlap"
            - "Overlapping receipt (10:30-12:00): error_id == ERR_DOCK_CAPACITY_EXCEEDED  # overlapping count would reach dock_doors == 1"
            - "Both rejected and accepted receipts share the zone — the rule counts overlapping intervals against an aggregate capacity, no buffer"

      - name: cancelled_booking_excluded_from_overlap_candidate_set
        grounds:
          - state_machines.BlastFreezeBooking.SCHEDULED_to_CANCELLED
          - "endpoints[POST /api/blast-freeze-bookings]"
        distinguishing_aspect: |
          Candidate-set semantics: the overlap check considers only bookings in
          {SCHEDULED, IN_PROGRESS}; a CANCELLED booking occupying the identical
          window no longer blocks a new booking. Third facet of the overlap
          rule (status-scoped candidate set).
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone, 4 pallets lot CB received 2026-08-02; cell turnaround 30"
            - "Booking1 (2026-08-10T10:00-12:00) created then CANCELLED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Cancel Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custCb: $.data.id, custCb_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custCb}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custCb_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-22", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneCb: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custCb}", zone_id: "${zoneCb}", product_code: "PEAS", lot_code: "CB", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 4, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custCb}", captures: { rCb: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rCb}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rCb}/complete", payload: { actual_pallets: 4 }, as: WarehouseOperator, captures: { lotCb: $.data.lot_id } }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-3", capacity_pallets: 5, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cellCb: $.data.id } }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellCb}", lot_id: "${lotCb}", pallet_count: 2, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: WarehouseOperator, captures: { bkCb1: $.data.id } }
            - { call: "POST /api/blast-freeze-bookings/${bkCb1}/cancel", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellCb}", lot_id: "${lotCb}", pallet_count: 2, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: WarehouseOperator, captures: { bkCb2: $.data.id } }
            - { call: "GET /api/blast-freeze-bookings?cell_id=${cellCb}&status=SCHEDULED", as: WarehouseOperator, captures: { bkCb2_st: "$.data[0].status" } }
          assert:
            - "Rebooking the identical window succeeds after cancel: Booking.${bkCb2}.status == SCHEDULED"
            - "Exactly 1 SCHEDULED booking on the cell (the CANCELLED one is excluded from the candidate set)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: allocate_then_amend_conserves_pallet_counts
        grounds:
          - state_machines.OutboundOrder
          - calculations.zone_free_pallets
          - entities.InventoryLot.fields.on_hand_pallets
        distinguishing_aspect: |
          Conserved quantity: physical pallet counts. Forward action (allocate
          2 of 3) paired with its compensating action (amend releasing all
          allocations) leaves TemperatureZone.in_use_pallets == 3 and
          InventoryLot.on_hand_pallets == 3 exactly as before the pair.
        test_recipe:
          setup:
            - "Customer with card A; zone cap 10 with 3 pallets lot CI received 2026-08-02; order for 2 SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Inv Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custI: $.data.id, custI_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custI}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custI_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-23", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneI: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custI}", zone_id: "${zoneI}", product_code: "PEAS", lot_code: "CI", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 3, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custI}", captures: { rI: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rI}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rI}/complete", payload: { actual_pallets: 3 }, as: WarehouseOperator, captures: { lotI: $.data.lot_id } }
            - { call: "POST /api/outbound-orders", payload: { customer_id: "${custI}", product_code: "PEAS", requested_pallets: 2 }, as: CustomerAdmin, as_user_id: "${custI}", captures: { oI: $.data.id } }
            - { call: "POST /api/outbound-orders/${oI}/submit", payload: {}, as: CustomerAdmin, as_user_id: "${custI}" }
          trigger:
            - { call: "POST /api/outbound-orders/${oI}/allocate", payload: {}, as: WarehouseOperator }
            - { call: "GET /api/outbound-orders/${oI}", as: CustomerAdmin, as_user_id: "${custI}", captures: { oI_v: $.data.version, oI_st: $.data.status } }
            - { call: "POST /api/outbound-orders/${oI}/amend", payload: { requested_pallets: 1, expected_order_version: "${oI_v}" }, as: CustomerAdmin, as_user_id: "${custI}" }
            - { call: "GET /api/zones/${zoneI}", as: WarehouseOperator, captures: { zI_use: $.data.in_use_pallets, zI_free: $.data.free_pallets } }
            - { call: "GET /api/lots/${lotI}", as: WarehouseOperator, captures: { lI_on: $.data.on_hand_pallets } }
          assert:
            - "After allocate: order was ALLOCATED with allocated_pallets == 2; zone.in_use_pallets still 3 (allocation is not a physical move)"
            - "After compensating amend: TemperatureZone.${zoneI}.in_use_pallets == 3 (unchanged)"
            - "TemperatureZone.${zoneI}.free_pallets == 7"
            - "InventoryLot.${lotI}.on_hand_pallets == 3 (unchanged)"
            - "OutboundOrder.${oI}.allocated_pallets == 0 and status == DRAFT"

      - name: dispute_resolve_cycle_conserves_invoice_total
        grounds:
          - state_machines.Invoice
          - calculations.invoice_total
        distinguishing_aspect: |
          Conserved quantity: money. FINALIZED -> DISPUTED -> FINALIZED round
          trip leaves every component and total_cents (8200-style fixture here:
          4100) byte-identical — the dispute loop annotates status but must not
          drift amounts. Different conserved quantity from pallet counts.
        test_recipe:
          setup:
            - "Customer with card A; 1 pallet received 2026-08-01T00:00; August invoice FINALIZED (storage round_half_up(31*3000/30)=3100, handling_in 1000, total 4100)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Disp Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custDi: $.data.id, custDi_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custDi}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custDi_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-24", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneDi: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custDi}", zone_id: "${zoneDi}", product_code: "PEAS", lot_code: "DI", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 1, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: CustomerAdmin, as_user_id: "${custDi}", captures: { rDi: $.data.id } }
            - { call: "POST /api/inbound-receipts/${rDi}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rDi}/complete", payload: { actual_pallets: 1 }, as: WarehouseOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/billing/run", payload: {}, as: BillingAdmin }
            - { call: "GET /api/invoices?customer_id=${custDi}&status=FINALIZED", as: BillingAdmin, captures: { invDi: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/invoices/${invDi}/dispute", payload: {}, as: CustomerAdmin, as_user_id: "${custDi}" }
            - { call: "POST /api/invoices/${invDi}/resolve-dispute", payload: {}, as: BillingAdmin }
            - { call: "GET /api/invoices/${invDi}", as: BillingAdmin, captures: { di_total: $.data.total_cents, di_stor: $.data.storage_cents, di_hi: $.data.handling_in_cents, di_st: $.data.status } }
          assert:
            - "Invoice.${invDi}.status == FINALIZED after the DISPUTED round trip"
            - "Invoice.${invDi}.total_cents == 4100 (unchanged)"
            - "Invoice.${invDi}.storage_cents == 3100 and handling_in_cents == 1000 (no component drift)"

      - name: booking_schedule_cancel_conserves_cell_calendar_and_fees
        grounds:
          - state_machines.BlastFreezeBooking
          - calculations.blast_freeze_fee
          - entities.Invoice.fields.blast_freeze_cents
        distinguishing_aspect: |
          Conserved quantity: cell calendar time (and uncharged fees). A
          SCHEDULED booking followed by its compensating cancel leaves the cell
          with zero active bookings (the identical window is bookable again)
          and the customer's OPEN invoice blast_freeze_cents == 0 — no fee
          accrues without a completion. Third conserved-quantity type.
        test_recipe:
          setup:
            - "Customer with card A; FROZEN zone, 2 pallets lot CC received 2026-08-02; cell turnaround 30"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: BillingAdmin }
            - { call: "POST /api/customers", payload: { name: "Cal Co", credit_limit_cents: 100000000 }, as: BillingAdmin, captures: { custCal: $.data.id, custCal_v: $.data.version } }
            - { call: "POST /api/rate-cards", payload: { customer_id: "${custCal}", storage_method: DAILY_PRORATED, frozen_storage_cents_per_pallet_month: 3000, chilled_storage_cents_per_pallet_month: 2000, handling_in_cents_per_pallet: 1000, handling_out_cents_per_pallet: 500, blast_base_cents: 2000, blast_per_pallet_cents: 300, liability_model: LIMITED_LIABILITY, liability_per_pallet_cents: 2000, dwell_exempt: false, expected_customer_version: "${custCal_v}" }, as: BillingAdmin }
            - { call: "POST /api/zones", payload: { zone_code: "FZ-25", temp_class: FROZEN, capacity_pallets: 10, dock_doors: 2 }, as: WarehouseOperator, captures: { zoneCal: $.data.id } }
            - { call: "POST /api/inbound-receipts", payload: { customer_id: "${custCal}", zone_id: "${zoneCal}", product_code: "PEAS", lot_code: "CC", production_date: "2026-01-15", temp_class: FROZEN, expected_pallets: 2, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z" }, as: CustomerAdmin, as_user_id: "${custCal}", captures: { rCal: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rCal}/arrive", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/inbound-receipts/${rCal}/complete", payload: { actual_pallets: 2 }, as: WarehouseOperator, captures: { lotCal: $.data.lot_id } }
            - { call: "POST /api/blast-freeze-cells", payload: { cell_code: "BC-4", capacity_pallets: 5, turnaround_minutes: 30 }, as: WarehouseOperator, captures: { cellCal: $.data.id } }
          trigger:
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellCal}", lot_id: "${lotCal}", pallet_count: 1, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: WarehouseOperator, captures: { bkCal1: $.data.id } }
            - { call: "POST /api/blast-freeze-bookings/${bkCal1}/cancel", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/blast-freeze-bookings", payload: { cell_id: "${cellCal}", lot_id: "${lotCal}", pallet_count: 1, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: WarehouseOperator, captures: { bkCal2: $.data.id } }
            - { call: "GET /api/invoices?customer_id=${custCal}&status=OPEN", as: BillingAdmin, captures: { invCal_blast: "$.data[0].blast_freeze_cents" } }
            - { call: "GET /api/blast-freeze-bookings?cell_id=${cellCal}", as: WarehouseOperator, captures: { calB1: "$.data[0].status", calB2: "$.data[1].status" } }
          assert:
            - "After schedule+cancel: re-booking the identical window succeeds (Booking.${bkCal2} SCHEDULED) — calendar time restored"
            - "OPEN invoice.blast_freeze_cents == 0 (no fee without completion)"
            - "Cell bookings list: exactly one CANCELLED (${bkCal1}) and one SCHEDULED (${bkCal2})"
