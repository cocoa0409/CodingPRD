              captures: { u_status: $.data.status, u_site: $.data.current_site_id }
          assert:
            - "contract status == OFF_HIRE and actual_offhire_at == 2026-09-04T00:00:00Z"
            - "equipment line OFF_HIRED with final_charge_cents == 71000 (3 days = 36000 + 35000 demob) (link 1)"
            - "kit line OFF_HIRED with final_charge_cents == 9000 (3 x 3000) (link 1)"
            - "EquipmentUnit status == OFF_RENT and current_site_id == null (link 2, caused by the line transition)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (state>safety; temporal>fiscal)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: mobilize_permit_gate_vs_invalid_state
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PERMIT_REQUIRED]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: mobilizing a DRAFT
          contract on a site whose screening requires a permit (aggregate 5.0 >=
          CA cap 5.0, driven by a second CONFIRMED contract) must return
          ERR_INVALID_STATE (priority 4), not ERR_PERMIT_REQUIRED (priority 5).
        test_recipe:
          setup:
            - "Site S1 in CA-SCAQMD (cap 5.0); Customer CA1; Unit UX (100 kW, nox 5.0, TIER_4F, rates 12000/60000/200000, demob 35000)"
            - "Contract KA (customer CA1) CONFIRMED with UX reserved — site screening now requires a permit"
            - "Contract KB (customer CB1) exists in DRAFT with no lines — both state (not CONFIRMED) and safety (no APPROVED permit while site requires one) fail for KB mobilize"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Cali Builders", billing_email: "ap@cali.example" }
              as: SalesEngineer
              captures: { cust_a: $.data.id }
            - call: "POST /power-rental/customers"
              payload: { name: "Second Builder", billing_email: "ap@second.example" }
              as: SalesEngineer
              captures: { cust_b: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_a}", name: "LA Basin Yard", jurisdiction_code: "CA-SCAQMD", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 100, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 5.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "LAX-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_a}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 80 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_a: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_a}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_a_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_a}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_a_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_a}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_a_v4: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_a}/confirm"
              payload: { expected_rental_contract_version: "${con_a_v4}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_b}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 50 } ], start_date: "2026-09-10T00:00:00Z", expected_offhire_date: "2026-09-17T00:00:00Z" }
              as: SalesEngineer
              captures: { con_b: $.data.id }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_b}/mobilize"
              payload: {}
              as: DepotManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 5 business_safety)"
            - "RentalContract.${con_b}.status remains DRAFT"
            - "site screening for ${site_id} would still report permit_required == true (safety condition also unsatisfied for KB)"

      - name: line_add_overlap_vs_credit_hold
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_UNIT_RESERVED_CONFLICT]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_fiscal: adding an
          overlapping EQUIPMENT line for a HOLD-credit customer must return
          ERR_UNIT_RESERVED_CONFLICT (priority 6), not ERR_CREDIT_HOLD
          (priority 9) — a different category pair than state-vs-safety.
        test_recipe:
          setup:
            - "Customer CA1 (GOOD) holds Unit U1 via contract KA PENDING line, window [2026-09-01, 2026-09-08)"
            - "Customer CB1 credit_status HOLD; contract KB (DRAFT) window [2026-09-05, 2026-09-12) overlaps KA's window"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Good Credit Co", billing_email: "ap@good.example" }
              as: SalesEngineer
              captures: { cust_a: $.data.id }
            - call: "POST /power-rental/customers"
              payload: { name: "Hold Credit Co", billing_email: "ap@hold.example", credit_status: "HOLD" }
              as: SalesEngineer
              captures: { cust_b: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_a}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_a}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_a: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_a}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_a_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_a}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_a_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_b}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-05T00:00:00Z", expected_offhire_date: "2026-09-12T00:00:00Z" }
              as: SalesEngineer
              captures: { con_b: $.data.id, con_b_v: $.data.version }
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_b}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_b_v}" }
              as: SalesEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNIT_RESERVED_CONFLICT (priority 6 temporal beats priority 9 fiscal)"
            - "no RentalLine created for ${con_b} (GET /power-rental/rental-lines?contract_id=${con_b} returns empty)"
            - "EquipmentUnit.${unit_id}.status remains RESERVED to contract KA"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (duration day-7 vs NOx == cap)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rate_break_day7_equals_week_rate
        grounds:
          - calculations.rental_charge_accrual
          - entities.RentalContract.fields.quoted_total_cents
        distinguishing_aspect: |
          Duration metric at the exact tier boundary: a window of exactly 7 days
          decomposes as one week (60000), not 7 days (84000) — the 7//7 weekly
          split applies at equality; checked on the quote endpoint, distinct
          from the emissions-threshold boundary instance.
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ), Unit U1 (200 kW, rates 12000/60000/200000, demob 35000)"
            - "Contract K1 DRAFT with EQUIPMENT line on U1; window exactly 2026-09-01..2026-09-08 (7 days); sized 200"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
              as: SalesEngineer
              captures: { site_id: $.data.id }
            - call: "POST /power-rental/equipment-units"
              payload: { unit_type: "GENERATOR", capacity_kw: 200, fuel_type: "DIESEL", emissions_tier: "TIER_4F", nox_g_per_kwh: 3.0, day_rate_cents: 12000, week_rate_cents: 60000, month_rate_cents: 200000, demob_fee_cents: 35000, home_depot_code: "DAL-01" }
              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-08T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { quoted: $.data.quoted_total_cents }
          assert:
            - "quoted_total_cents == 95000 (weekly block 60000 + demob 35000)"
            - "7 * day_rate_cents = 84000 time charge would be wrong — exactly-7-days selects the week tier"

      - name: emissions_aggregate_equal_cap_requires_permit
        grounds:
          - calculations.emissions_screening
          - entities.Site.fields.jurisdiction_code
        distinguishing_aspect: |
          Emissions metric at exact threshold: capacity-weighted aggregate NOx
          exactly equal to the CA-SCAQMD cap (5.0 == 5.0) makes permit_required
          TRUE because the comparison is >=; checked on the emissions-screening
          endpoint, distinct from the quote-duration boundary instance.
        test_recipe:
          setup:
