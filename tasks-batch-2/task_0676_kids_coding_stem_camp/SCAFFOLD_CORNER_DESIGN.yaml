        grounds: [endpoints, "errors[ERR_WALLET_INSUFFICIENT]", entities.Guardian.fields.wallet_credit_cents]
        distinguishing_aspect: "A negative wallet adjustment larger than the current balance (debit 5000 against balance 1000) returns ERR_WALLET_INSUFFICIENT (409); balance unchanged at 1000."
        test_recipe:
          setup: ["Guardian with wallet 1000 (one positive adjustment)."]
          setup_api_calls:
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /guardians/${g1}/wallet/adjustments"
              payload: { amount_cents: 1000, reason: "seed" }
              as: CenterAdmin
          trigger:
            - call: "POST /guardians/${g1}/wallet/adjustments"
              payload: { amount_cents: -5000, reason: "overdraw" }
              as: CenterAdmin
          assert:
