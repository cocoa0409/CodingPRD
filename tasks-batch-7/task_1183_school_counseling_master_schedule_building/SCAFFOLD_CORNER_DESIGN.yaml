            - call: "POST /scheduling/course-requests/${rq_p}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_alt}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_b1}", course_id: "${k_alt}", term_id: "${t_alt}", priority_rank: 1, is_alternate: true }
              as: Student
              as_user_id: "${s_b1}"
              captures: { rq_a1: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_a1}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_b1}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_b2}", course_id: "${k_alt}", term_id: "${t_alt}", priority_rank: 1, is_alternate: true }
              as: Student
