  - rule_id: resource_temporal_overlap
    instances:
      - name: room_buffer_overlap_semantics
        grounds:
          - calculations.room_overlap_check
          - "validations[priority=25]"
        distinguishing_aspect: |
          Interval semantics: buffered half-open occupancy on the Room resource — occupancy runs
          [starts_at, ends_at + 15min), so an 11:14 start after a 10:00-11:00 meeting CONFLICTS,
          while an 11:15 start (exactly ends_at + buffer) is ALLOWED by the half-open boundary.
        test_recipe:
          setup:
            - "Season PUBLISHED (DRAFT acceptable for meeting ops); room R1; sessions S1 (instructor I1) and S2 (instructor I2) in DRAFT; S1 has meeting 2026-09-20 10:00-11:00 in R1"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Fitness", category: "Fitness", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Gym", capacity: 50 }, as: ProgramCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Fit A", email: "fa@x.com" }, as: ProgramCoordinator, captures: { i1: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Fit B", email: "fb@x.com" }, as: ProgramCoordinator, captures: { i2: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${i1}", title: "S1", capacity: 5, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${i2}", title: "S2", capacity: 5, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${s1}", room_id: "${r1}", starts_at: "2026-09-20T10:00:00Z", ends_at: "2026-09-20T11:00:00Z" }, as: ProgramCoordinator, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /class-meetings", payload: { session_id: "${s2}", room_id: "${r1}", starts_at: "2026-09-20T11:14:00Z", ends_at: "2026-09-20T12:00:00Z" }, as: ProgramCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /class-meetings", payload: { session_id: "${s2}", room_id: "${r1}", starts_at: "2026-09-20T11:15:00Z", ends_at: "2026-09-20T12:00:00Z" }, as: ProgramCoordinator, captures: { m2: $.data.id } }
          assert:
            - "Meeting at 11:14 rejected: error_id == ERR_ROOM_CONFLICT, HTTP 409 (inside 15-minute turnover buffer of the 10:00-11:00 meeting)"
            - "Meeting at 11:15 accepted: 201, ClassMeeting id minted (starts_at == prior ends_at + buffer exactly -> half-open, no conflict)"

      - name: instructor_unbuffered_back_to_back
        grounds:
          - calculations.instructor_overlap_check
          - "validations[priority=26]"
        distinguishing_aspect: |
          Interval semantics: UNBUFFERED half-open intervals on the Instructor resource (different
          resource and different geometry than the room rule) — a meeting starting at exactly the
          other's ends_at (back-to-back) is ALLOWED, while a one-minute overlap is rejected with
          ERR_INSTRUCTOR_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Season exists; instructor IX; sessions SA/SB/SC all taught by IX; rooms R1/R2/R3; SA has meeting 2026-09-20 10:00-11:00 in R1"
          setup_api_calls:
            - { call: "POST /seasons", payload: { name: "Fall 2026", start_date: "2026-09-01T00:00:00Z", end_date: "2026-12-15T00:00:00Z", resident_opens_at: "2026-08-10T00:00:00Z", general_opens_at: "2026-08-17T00:00:00Z", registration_closes_at: "2026-09-15T00:00:00Z" }, as: ProgramCoordinator, captures: { sn: $.data.id } }
            - { call: "POST /programs", payload: { season_id: "${sn}", name: "Tutoring", category: "Education", min_age: 0, max_age: 120 }, as: ProgramCoordinator, captures: { pg: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Room 1", capacity: 50 }, as: ProgramCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Room 2", capacity: 50 }, as: ProgramCoordinator, captures: { r2: $.data.id } }
            - { call: "POST /rooms", payload: { name: "Room 3", capacity: 50 }, as: ProgramCoordinator, captures: { r3: $.data.id } }
            - { call: "POST /instructors", payload: { full_name: "Tutor X", email: "tx@x.com" }, as: ProgramCoordinator, captures: { ix: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ix}", title: "SA", capacity: 5, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { sa: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ix}", title: "SB", capacity: 5, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { sb: $.data.id } }
            - { call: "POST /class-sessions", payload: { program_id: "${pg}", instructor_id: "${ix}", title: "SC", capacity: 5, min_enrollment: 1, fee_resident_cents: 5000, fee_nonresident_cents: 5000, enrollment_check_at: "2026-09-08T00:00:00Z" }, as: ProgramCoordinator, captures: { sc: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${sa}", room_id: "${r1}", starts_at: "2026-09-20T10:00:00Z", ends_at: "2026-09-20T11:00:00Z" }, as: ProgramCoordinator, captures: { ma: $.data.id } }
          trigger:
            - { call: "POST /class-meetings", payload: { session_id: "${sb}", room_id: "${r2}", starts_at: "2026-09-20T11:00:00Z", ends_at: "2026-09-20T12:00:00Z" }, as: ProgramCoordinator, captures: { mb: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${sc}", room_id: "${r3}", starts_at: "2026-09-20T10:59:00Z", ends_at: "2026-09-20T12:00:00Z" }, as: ProgramCoordinator, captures: { err1: $.data.error_id } }
          assert:
            - "Back-to-back 11:00 start (== prior ends_at) accepted: 201, ClassMeeting id minted (no buffer on instructor rule)"
            - "One-minute overlap 10:59 start rejected: error_id == ERR_INSTRUCTOR_DOUBLE_BOOKED, HTTP 409"

  - rule_id: compensating_invariant
    instances:
      - name: drop_promotion_seat_conservation
        grounds:
          - state_machines.Registration.ENROLLED_to_DROPPED
          - state_machines.Registration.WAITLISTED_to_ENROLLED
          - entities.ClassSession.fields.enrolled_count
        distinguishing_aspect: |
          Conserved quantity: occupied seats. Forward action (drop of the ENROLLED registrant)
          paired with its compensating promotion of the waitlisted registrant MUST leave
          ClassSession.enrolled_count unchanged: enrolled_count(after) == enrolled_count(before) == 1
          whenever a freed seat is immediately re-filled from the waitlist.
