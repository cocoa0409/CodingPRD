            - "Dropping the bonus would give 79.5, ignoring the compliance term would give 95.0 and ignoring the intensity term would give 90.5 — none of these is the correct answer."
            - "status == CLOSED and closed_at == 2026-08-01T00:00:00Z (the mandatory default logical clock, never advanced by this recipe)."
            - "GET /coaching-alerts?shift_id=${shift_id} returns total_count == 1 with alert_type INTENSITY_BREACH, severity MEDIUM and status EXPIRED — the shift close expired the still-OPEN alert, which is a side effect of closing and has no influence on leaderboard_score."

  # =======================================================================
  - rule_id: non_linear_state_machine
    mechanism: |
      Three entities carry non-linear lifecycles of three different SHAPES:
      (1) WasteEntry (shape cyclic) has TWO distinct cycle edges —
          RECORDED <-> FLAGGED (review loop) and RECORDED -> SUPERSEDED ->
          RECORDED (correction plus compensation), and the restore edge
          deliberately lands on RECORDED even when the row was FLAGGED when it
          was superseded;
      (2) DiversionConsignment (shape parallel) runs two independent dimensions,
          and the settlement dimension cycles TICKET_SUBMITTED -> DISPUTED ->
          TICKET_SUBMITTED while logistics_status is pinned at DISPATCHED;
      (3) BaselinePeriod (shape cyclic) has a rejection loop OPEN -> SUBMITTED ->
          OPEN whose iteration count is observable in rejection_count and whose
          frozen metrics are wiped and RE-derived from changed source data on
          each pass, so the second freeze differs from the first.
    instances:

      - name: waste_entry_flag_loop_twice_then_supersede_and_compensating_restore_to_recorded
        grounds: "§1.2 state_machines.WasteEntry transitions RECORDED_to_FLAGGED, FLAGGED_to_RECORDED, FLAGGED_to_SUPERSEDED, RECORDED_to_VOIDED and SUPERSEDED_to_RECORDED; §1.1 WasteEntry.flag_reason / corrects_entry_id / version."
        distinguishing_aspect: "Cyclic shape on a SINGLE entity, traversing the flag loop twice and then a second, differently-shaped cycle (SUPERSEDED -> RECORDED) that is reached only as a cascade of voiding a DIFFERENT row. The load-bearing subtlety is that the restored predecessor comes back as RECORDED, not as the FLAGGED state it left from, while flag_reason survives — so state and audit field decouple. Version numbers pin the number of loop iterations."
        test_recipe:
          setup: |
            One site, one PREP station (capture_lock_seconds 30), FT_PREP at 640 c/kg and one
            OPEN shift on 2026-06-10 with meals_served 1000 (high enough that no coaching alert
            can fire). A single 1000 g capture is flagged, cleared, flagged again, and then
            corrected upward to 1200 g by ShiftLead sl-1.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { original_id: "$.data.id" }
            - call: "POST /waste-entries/${original_id}/flag"
              payload: { flag_reason: "suspected double weigh" }
              as: ShiftLead
              as_user_id: "sl-1"
            - call: "POST /waste-entries/${original_id}/clear-flag"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
            - call: "POST /waste-entries/${original_id}/flag"
              payload: { flag_reason: "scale drift confirmed" }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { original_v4: "$.data.version" }
            - call: "POST /waste-entries/${original_id}/corrections"
              payload: { expected_entry_version: "${original_v4}", correction_note: "reweighed on calibrated scale", weight_grams: 1200 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { corrector_id: "$.data.id" }
            - call: "GET /waste-entries/${original_id}"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { original_v5: "$.data.version" }
          trigger:
            - call: "POST /waste-entries/${corrector_id}/void"
              payload: { void_reason: "correction entered against the wrong ticket" }
              as: ShiftLead
              as_user_id: "sl-2"
          assert:
            - "The setup flag/clear-flag/flag sequence walks status RECORDED -> FLAGGED -> RECORDED -> FLAGGED with version 1 -> 2 -> 3 -> 4, and the second flag response carries flag_reason == 'scale drift confirmed' (it overwrote the first reason)."
            - "The correction call returns a NEW entry with status RECORDED, weight_grams 1200, corrects_entry_id == ${original_id}, correction_note 'reweighed on calibrated scale', captured_at 2026-06-10T10:00:00Z copied from the original, station_id/shift_id/food_type_id copied, loss_reason TRIM inherited (omitted from the request) and provisional_cost_cents == 768."
            - "The setup read of the original after the correction returns status SUPERSEDED and version == 5; the entry has left the aggregation set, so a read of the site at that point would show valued_waste_cost_cents == 768 and total_captured_weight_grams == 1200."
            - "After the trigger, GET /waste-entries/${corrector_id} returns status VOIDED with void_reason set."
            - "After the trigger, GET /waste-entries/${original_id} returns status RECORDED — NOT FLAGGED, even though the row was FLAGGED at the moment it was superseded — with version == 6 and flag_reason still 'scale drift confirmed' (the audit field is never cleared by the restore)."
            - "After the trigger, GET /sites/${site_id} returns total_captured_weight_grams == 1000 and valued_waste_cost_cents == 640, byte-identical to the pre-correction values."
            - "GET /waste-entries?shift_id=${shift_id} returns total_count == 2 (both rows persist; nothing is hard-deleted)."

      - name: consignment_settlement_dimension_cycles_while_logistics_dimension_is_pinned
        grounds: "§1.2 state_machines.DiversionConsignment (shape parallel, dimensions logistics_status / settlement_status) transitions settlement.UNBILLED_to_TICKET_SUBMITTED, settlement.TICKET_SUBMITTED_to_DISPUTED, settlement.DISPUTED_to_TICKET_SUBMITTED, settlement.TICKET_SUBMITTED_to_SETTLED and logistics.DISPATCHED_to_COMPLETED; §1.2 state_machines.HaulerTicket."
        distinguishing_aspect: "Parallel shape, not cyclic-on-one-axis: the cycle runs entirely on the settlement dimension (TICKET_SUBMITTED -> DISPUTED -> TICKET_SUBMITTED) while logistics_status stays DISPATCHED for three consecutive writes and only flips to COMPLETED on the accept, in the same request as SETTLED. It also pins the asymmetry the flag-loop instance does not have: the disputed ticket is TERMINAL and never returns to SUBMITTED, so the loop is on the parent, not on the child."
        test_recipe:
          setup: |
            Site with one PREP station, FT_PREP, APPROVED hauler H1 (rate_cents_per_tonne 52000,
            stop_fee_cents 1800, capacity_kg_per_pickup 500, channels [COMPOST]). Shift
            2026-06-10 AM meals_served 1000, one 1000 g capture, fully routed onto a COMPOST
            consignment with container_tare_grams 0. The consignment is staged and dispatched.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Green Loop Compost", channels: ["COMPOST"], rate_cents_per_tonne: 52000, stop_fee_cents: 1800, capacity_kg_per_pickup: 500, max_concurrent_pickups: 1 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_id: "$.data.id" }
            - call: "POST /haulers/${hauler_id}/approve"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_id: "$.data.id" }
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_id}", channel: "COMPOST", pickup_window_start: "2026-06-11T08:00:00Z", pickup_window_end: "2026-06-11T10:00:00Z", container_tare_grams: 0 }
