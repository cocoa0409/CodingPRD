      - name: performance_aggregate_capacity_overlap
        grounds:
          - validations[priority=8]
          - calculations.performance_inventory
          - errors[ERR_PERFORMANCE_SOLD_OUT]
          - entities.Performance.fields.capacity
        distinguishing_aspect: |
          Performance capacity uses aggregate-capacity interval semantics: the pooled sum held+sold must not
          exceed the venue capacity snapshot, independent of which seat; once the aggregate fills, a further hold
          on the same single seat is rejected with ERR_PERFORMANCE_SOLD_OUT — a sum-over-pool overlap on the
          Performance resource, geometrically distinct from the Seat point collision.
        test_recipe:
          setup:
            - "An ON_SALE performance in a one-seat venue whose only seat is already held (capacity=1, available=0)"
          setup_api_calls:
