      - name: phase_split_conserves_fixed_price
        grounds:
          - calculations.phase_billing_split
          - entities.Phase.fields.amount_cents
          - entities.CleanupEngagement.fields.estimated_txn_volume
        distinguishing_aspect: |
          Different conserved quantity = total fixed price in cents. Generating phase
          amounts via round-then-residual leaves sum(Phase.amount_cents) == 90540, the
          fixed price — the rounding distribution conserves the billed total exactly.
        test_recipe:
          setup:
            - "Quoted engagement (price 90540) with phases 3333/3333/3334."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "InvB Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "InB", period_start: "2025-01-01", period_end: "2025-06-30", complexity_tier: "MEDIUM" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/quote"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/phases"
              payload: { phase_index: 1, label: "P1", weight_bp: 3333 }
              as: EngagementManager
              captures: { ph1: $.data.id }
            - call: "POST /engagements/${eng_id}/phases"
              payload: { phase_index: 2, label: "P2", weight_bp: 3333 }
              as: EngagementManager
              captures: { ph2: $.data.id }
            - call: "POST /engagements/${eng_id}/phases"
              payload: { phase_index: 3, label: "P3", weight_bp: 3334 }
              as: EngagementManager
              captures: { ph3: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/phases/generate"
              payload: {}
              as: EngagementManager
          assert:
            - "Phase.${ph1}.amount_cents + Phase.${ph2}.amount_cents + Phase.${ph3}.amount_cents == 90540"
