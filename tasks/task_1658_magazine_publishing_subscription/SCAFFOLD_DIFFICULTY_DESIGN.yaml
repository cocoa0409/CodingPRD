              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /publications/${pub_id}/renewal-series"
              payload: { series_code: "STD", effort_offsets_days: [-30], effort_pricing_cents: [999], is_default: true }
              as: CirculationManager
            - call: "POST /subscribers"
              payload: { email: "x@x.com", full_name: "X", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { sub_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${sub_id}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { subscr_id: $.data.id }
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/activate"
              payload: {}
              as: CirculationManager
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/renewal-events/fire-next"
              payload: {}
              as: CirculationManager
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /publications/${pub_id}/subscriptions/${subscr_id}/cancel"
              payload: {}
              as: CirculationManager
          assert:
            - "Subscription.${subscr_id}.status == CANCELLED"
            - "RenewalEvent.${event_id}.response == EXPIRED"
            - "All DigitalEntitlements on ${subscr_id} have revoked_at != null and revocation_reason == REFUND"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_close_ads
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - state_machines.Issue.EDITORIAL_CLOSED_to_AD_CLOSED
        distinguishing_aspect: |
          Conflict pair: state (priority 4, ERR_INVALID_STATE) vs
          business_temporal (priority 6, ERR_AD_CLOSE_NOT_REACHED). When an
          Issue is in PLANNING (wrong state) AND current_utc < ad_close_date
          (temporal not met), the state error must win because state has
          higher priority.
        test_recipe:
          setup:
            - "Publication P, Issue I in PLANNING with ad_close_date in the future"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "PriTest", issn: "88889999", frequency: "MONTHLY", circulation_model: "PAID", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-12-01T00:00:00Z", editorial_close_date: "2026-11-01T00:00:00Z", ad_close_date: "2026-11-05T00:00:00Z", ship_to_printer_date: "2026-11-10T00:00:00Z", mail_date: "2026-12-01T00:00:00Z", ad_pages_sold: 5 }
              as: ProductionManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
          trigger:
            - call: "POST /publications/${pub_id}/issues/${issue_id}/close-ads"
              payload: { expected_issue_version: "${issue_v}" }
              as: ProductionManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE (state beats business_temporal: Issue is PLANNING, not EDITORIAL_CLOSED)"

      - name: business_safety_vs_business_fiscal_on_verify_postal
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - state_machines.MailingBatch.LABELS_GENERATED_to_POSTAL_VERIFIED
        distinguishing_aspect: |
          Conflict pair: business_safety (priority 9, postal compliance) vs
          business_fiscal (priority 12, insufficient inventory). We exercise this
          via verify-postal where the batch violates PERIODICAL paid-ratio AND
          has STANDARD+controlled-copies violation (both safety); since both
          are priority 9, the safety class is deterministic — but to surface a
          safety-vs-fiscal conflict we use a setup where the batch has BOTH
          paid-percentage < 50% (safety) AND the issue's newsstand buffer
          would be exceeded if we tried to allocate labels (fiscal). The safety
          error must win.
        test_recipe:
          setup:
            - "Issue with AT_PRINTER, MailingBatch PERIODICAL with mostly CONTROLLED subs (paid_percentage < 5000 bps)"
            - "Same Issue has newsstand_buffer_copies=1 but there is an outstanding BackIssueOrder quantity=5 (would be insufficient inventory on fulfill)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PublishingDirector
            - call: "POST /publications"
              payload: { title: "PriTest2", issn: "99990000", frequency: "MONTHLY", circulation_model: "MIXED", base_cover_price_cents: 599, deferred_revenue_method: "PRO_RATA_ISSUE" }
              as: PublishingDirector
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/issues"
              payload: { issue_number: 1, volume_number: 1, cover_date: "2026-08-01T00:00:00Z", editorial_close_date: "2026-07-01T00:00:00Z", ad_close_date: "2026-07-05T00:00:00Z", ship_to_printer_date: "2026-07-10T00:00:00Z", mail_date: "2026-08-01T00:00:00Z", ad_pages_sold: 5, newsstand_buffer_copies: 1 }
              as: ProductionManager
              captures: { issue_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "p@x.com", full_name: "P", address_line1: "1 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { paid_sub: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c1@x.com", full_name: "C1", address_line1: "2 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { ctrl_sub1: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c2@x.com", full_name: "C2", address_line1: "3 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { ctrl_sub2: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "c3@x.com", full_name: "C3", address_line1: "4 A St", city: "Springfield", state_code: "IL", postal_code: "62701" }
              as: CirculationManager
              captures: { ctrl_sub3: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${paid_sub}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 1200, qualification_tier: "PAID", payment_method: "CARD" }
              as: CirculationManager
              captures: { paid_subscr: $.data.id }
            - call: "POST /publications/${pub_id}/subscribers/${ctrl_sub1}/subscriptions"
              payload: { start_issue_id: "${issue_id}", term_issues: 12, price_paid_cents: 0, qualification_tier: "CONTROLLED", payment_method: "NONE" }
