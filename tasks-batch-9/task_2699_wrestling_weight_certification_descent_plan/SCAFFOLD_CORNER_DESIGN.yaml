              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 130.0, body_fat_pct: 12.0, urine_specific_gravity: 1.018 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_f: $.data.id }
            - call: "POST /assessments/${assess_f}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { f_lean: $.data.lean_body_weight_lbs, f_min: $.data.minimum_certified_weight_lbs, f_class: $.data.min_weight_class_lbs }
            - call: "POST /wrestlers/${wrestler_m}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:30:00Z", measured_weight_lbs: 130.0, body_fat_pct: 12.0, urine_specific_gravity: 1.018 }
              as: Assessor
