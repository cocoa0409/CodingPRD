            - { call: "POST /deals/${d1}/propose-terms", payload: { fee_base_cents: 100000, expected_deal_version: "${d1_v}" }, as: BrandManager }
            - { call: "POST /deals/${d1}/creator-respond", payload: { action: "ACCEPT" }, as: Creator, as_user_id: "${c_id}" }
            - { call: "GET /deals/${d2}", payload: {}, as: BrandManager, captures: { d2_v: $.data.version } }
            - { call: "POST /deals/${d2}/propose-terms", payload: { fee_base_cents: 100000, expected_deal_version: "${d2_v}" }, as: BrandManager }
