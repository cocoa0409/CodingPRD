  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: caseload_capacity_inclusive_max
        grounds:
          - calculations.caseload_capacity_check
          - "validations[priority=14]"
          - "errors[ERR_CASELOAD_CAPACITY_EXCEEDED]"
          - entities.Attorney.fields.current_weighted_load
        distinguishing_aspect: "With max 4.0, assigning a FELONY_A (weight 4.0) is accepted at load exactly 4.0 (<= max), but assigning a further MISDEMEANOR (weight 1.0) that would make 5.0 (> max) is rejected — inclusive-at-max boundary on the weighted-load metric via POST /assignments."
        test_recipe:
          setup:
            - "Attorney max 4.0; caseA FELONY_A assigned (load exactly 4.0); caseB MISDEMEANOR SCREENED with CLEAR conflict check."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-B1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Bev", attorney_type: "STAFF", bar_number: "BB1", hourly_rate_cents: 15000, max_weighted_caseload: 4.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Fa", charge_class: "FELONY_A" }, as: IntakeClerk, captures: { cA: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cA}", household_income_cents: 500000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scrA: $.data.id } }
            - { call: "POST /financial-screenings/${scrA}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${cA}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
            - { call: "POST /assignments", payload: { case_id: "${cA}", attorney_id: "${att}" }, as: AssignmentCoordinator }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Mi", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { cB: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cB}", household_income_cents: 500000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scrB: $.data.id } }
            - { call: "POST /financial-screenings/${scrB}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
            - { call: "POST /conflict-checks", payload: { case_id: "${cB}", attorney_id: "${att}", co_defendant_names: [] }, as: AssignmentCoordinator }
          trigger:
            - { call: "POST /assignments", payload: { case_id: "${cB}", attorney_id: "${att}" }, as: AssignmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "caseA assignment succeeded with Attorney.${att}.current_weighted_load == 4.0 and status AT_CAPACITY (load == max accepted)"
            - "trigger returns HTTP 409 data.error_id == ERR_CASELOAD_CAPACITY_EXCEEDED (4.0+1.0 > 4.0 rejected)"
            - "Attorney.${att}.current_weighted_load remains 4.0"

      - name: income_eligibility_threshold_inclusive
        grounds:
          - calculations.eligibility_determination
          - entities.FinancialScreening.fields.result
          - state_machines.FinancialScreening.SUBMITTED_to_DECIDED
        distinguishing_aspect: "For household_size 2 (fpl*1.25 = 2500000), income exactly 2500000 decides ELIGIBLE (<= inclusive) while income 2500001 decides PARTIAL — boundary on the income metric via POST /financial-screenings/{id}/decide, a different metric and endpoint than caseload capacity."
        test_recipe:
          setup:
            - "Two MISDEMEANOR cases; screening E income 2500000 (== threshold), screening P income 2500001 (threshold+1), both size 2, asset 0."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-B2", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Ed", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { cE: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Pi", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { cP: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cE}", household_income_cents: 2500000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scrE: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${cP}", household_income_cents: 2500001, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scrP: $.data.id } }
          trigger:
            - { call: "POST /financial-screenings/${scrE}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1", captures: { rE: $.data.result } }
            - { call: "POST /financial-screenings/${scrP}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1", captures: { rP: $.data.result } }
          assert:
            - "FinancialScreening.${scrE}.result == ELIGIBLE (2500000 <= 2500000) and contribution_amount_cents == 0"
            - "FinancialScreening.${scrP}.result == PARTIAL (2500001 > 2500000)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assign_requires_attorney_not_suspended
        grounds:
          - state_machines.Case.SCREENED_to_ASSIGNED
          - "validations[priority=6]"
          - "errors[ERR_ATTORNEY_NOT_ACTIVE]"
          - entities.Attorney.fields.status
        distinguishing_aspect: "Case SCREENED -> ASSIGNED is blocked when the target Attorney.status == SUSPENDED (ERR_ATTORNEY_NOT_ACTIVE) — the Case transition depends on the Attorney entity's state (pair Case/Attorney)."
        test_recipe:
          setup:
            - "SCREENED case with CLEAR conflict check; attorney then SUSPENDED."
          setup_api_calls:
            - { call: "POST /defender-offices", payload: { name: "PD-X1", annual_voucher_budget_cents: 100000000, recoupment_basis: "SCHEDULE" }, as: SupervisingAttorney, captures: { off: $.data.id } }
            - { call: "POST /attorneys", payload: { office_id: "${off}", name: "Sus", attorney_type: "STAFF", bar_number: "XX1", hourly_rate_cents: 15000, max_weighted_caseload: 10.0 }, as: SupervisingAttorney, captures: { att: $.data.id } }
            - { call: "POST /cases", payload: { office_id: "${off}", defendant_name: "Cy", charge_class: "MISDEMEANOR" }, as: IntakeClerk, captures: { c: $.data.id } }
            - { call: "POST /financial-screenings", payload: { case_id: "${c}", household_income_cents: 800000, household_size: 2, asset_value_cents: 0 }, as: IntakeClerk, captures: { scr: $.data.id } }
            - { call: "POST /financial-screenings/${scr}/decide", payload: {}, as: ScreeningOfficer, as_user_id: "officer-1" }
