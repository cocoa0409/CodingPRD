      - name: disposition_cancel_restores_available_units_for_a_full_reallocation
        grounds:
          - state_machines.DispositionOrder.APPROVED_to_CANCELLED
          - validations[priority=32]
          - calculations.disposition_recovery
          - entities.Item.fields.units_committed_disposition
          - entities.Item.fields.on_hand_units
        distinguishing_aspect: |
          The conserved quantity is item_available_units = on_hand_units - units_committed_disposition: cancelling
          an APPROVED order must return it to the pre-create value, proved by immediately committing all 343
          available units to a fresh order, while the cancelled order keeps its projected_recovery_cents.
        test_recipe:
          setup:
            - "Season FW26-APPAREL was transitioned ACTIVE -> EXIT_WINDOW by md-1"
            - "The clock stands at 2026-12-05T00:00:00Z: item A-1001 has weeks_to_exit 5, so R4 puts it in CLEARANCE and disposition is eligible; on_hand_units is 343 (600 received, 257 sold)"
            - "A SALVAGE order for 200 units at 300c was created by pa-1 (projected_recovery_cents 60000) and approved by ctl-1, so units_committed_disposition is 200 and only 143 units are free"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { code: "FW26-APPAREL", category: "APPAREL", season_start_date: "2026-08-15", season_end_date: "2027-01-31", exit_target_date: "2027-01-15", exit_units_target: 1000, sell_through_target_pct: 82.0, clearance_space_units: 900 }
              as: MerchandiseDirector
              as_user_id: "md-1"
              captures: { season_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "A-1001", season_id: "${season_id}", category: "APPAREL", cluster_code: "CL-W1", vendor_code: "VN-100", first_receipt_date: "2026-08-20", original_retail_cents: 4999, unit_cost_cents: 2000, units_received_total: 600 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { item_a_id: $.data.id }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-05", units_sold: 60, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-12", units_sold: 55, ticket_price_cents: 4999 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-19", units_sold: 68, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /items/${item_a_id}/sales-weeks"
              payload: { week_ending_date: "2026-09-26", units_sold: 74, ticket_price_cents: 4499 }
              as: PricingAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-05T00:00:00Z" }
              as: PricingAnalyst
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "EXIT_WINDOW" }
              as: MerchandiseDirector
              as_user_id: "md-1"
            - call: "POST /disposition-orders"
              payload: { season_id: "${season_id}", item_id: "${item_a_id}", channel: "SALVAGE", units: 200, unit_recovery_cents: 300 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { disp1_id: $.data.id }
            - call: "POST /disposition-orders/${disp1_id}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctl-1"
          trigger:
            - call: "POST /disposition-orders/${disp1_id}/cancel"
              payload: { cancel_reason: "salvage buyer withdrew" }
              as: PricingAnalyst
              as_user_id: "pa-1"
            - call: "POST /disposition-orders"
              payload: { season_id: "${season_id}", item_id: "${item_a_id}", channel: "SALVAGE", units: 343, unit_recovery_cents: 300 }
