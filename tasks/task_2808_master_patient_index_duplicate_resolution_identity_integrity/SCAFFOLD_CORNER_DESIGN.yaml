              captures: { rec_ca1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_ca_id}", mrn: "CA-2000", last_name: "Nakagawa", first_name: "Hiroshi", dob: "1977-05-05", sex: "M", ssn_last4: "5050", postal_code: "80202", phone: "3035550101", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_ca2_id: $.data.id }
            - call: "POST /mpi/patient-records"
