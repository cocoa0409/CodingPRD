          - entities.QuoteLine.fields.billable_length_ft
        distinguishing_aspect: |
          Boundary on the PER-CONDUCTOR LENGTH metric, reached through
          POST /quotes/{quoteId}/lines: 25 ft is accepted because the guard is
          requested_length_ft >= ABSOLUTE_MIN_CUT_FT, while 24 ft is rejected with
          ERR_BELOW_ABSOLUTE_MIN_CUT (422).
        test_recipe:
          setup:
            - "One branch, one customer with a 5,000,000-cent limit, index CI1, and product P4 whose min_cut_length_ft is exactly the absolute floor of 25 ft."
            - "An empty DRAFT quote for that customer at that branch."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
