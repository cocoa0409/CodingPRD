      - name: qualification_score_at_channel_minimum_inclusive
        grounds:
          - calculations.tour_qualification_evaluation
          - validations[priority=31]
          - validations[priority=32]
          - errors[ERR_PROSPECT_NOT_QUALIFIED]
          - errors[ERR_PROSPECT_BELOW_MINIMUM_CRITERIA]
        distinguishing_aspect: |
          Against a channel with min_age 30, min_household_income_cents 5000000 and
          min_qualification_score 70 on a zero-no-show channel, three prospects sit one unit
          apart on two different boundaries: income 7500000 scores exactly 70 and is
          accepted (score >= min is inclusive, income tier >= 7500000 is inclusive), income
          7499999 drops to the 15-point tier and scores 60 -> ERR_PROSPECT_NOT_QUALIFIED
          (priority 32), and age 29 fails the hard minimum -> ERR_PROSPECT_BELOW_MINIMUM_CRITERIA
          (priority 31) before any score is computed.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery with one ACTIVE representative so the gallery is OPEN."
            - "One channel: min_age 30, min_household_income_cents 5000000, min_qualification_score 70, channel_code OFF_PROPERTY_CONTACT (no affinity points), historical_no_show_rate 0.0000 because no tour has completed."
            - "Three prospects, all MARRIED and none an existing owner: (30, 7500000), (30, 7499999), (29, 7500000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
