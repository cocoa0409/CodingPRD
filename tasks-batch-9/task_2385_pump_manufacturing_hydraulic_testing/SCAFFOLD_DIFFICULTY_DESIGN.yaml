  # =====================================================================
  # Rule 2 - combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: predicted_efficiency_four_factor_penalty_chain_with_terminal_viscosity_multiplier
        grounds:
          - calculations.predicted_efficiency
          - calculations.impeller_trim_and_head_prediction
          - entities.Selection.fields.predicted_efficiency_pct
          - entities.Selection.fields.predicted_shaft_power_kw
          - entities.MaterialSealConfig.fields.service_class
          - validations[priority=79]
        distinguishing_aspect: |
          Mode (a) multi-input combination: predicted_efficiency_pct combines FOUR independent
          inputs (off-BEP penalty 0.6953, trim penalty 5.2606, abrasive penalty 4.30 built from
          2.5 + 0.30 * solids_pct, and viscosity factor 0.94) where the viscosity factor
          multiplies the ALREADY-penalised bracket and the floor is applied last, so
          82 - 0.6953 - 5.2606 - 4.30 = 71.7441 then x 0.94 = 67.44; multiplying only
          bep_efficiency_pct by 0.94 first yields 66.83 and is the trap.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH ACTIVE (approved alloys CI_GG25 and DUPLEX_S31803); PumpModel HSC-14 ORDERABLE; PatternAsset PAT-HSC14-A QUALIFIED; MaterialSealConfig MSC-DX-P32 rated ABRASIVE with max_solids_pct 8.0, max_viscosity_cst 200.0, max_chloride_ppm 5000.0, max_temp_c 110.0."
            - "DutyApplication APP-2001 asking 230.0 m3/h at 60.0 m on a 6.0 percent solids, 45.0 cSt, 3500 ppm chloride, 95 C slurry with min_efficiency_pct 66.0 and service_class_required ABRASIVE."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-DX-P32", casing_material: "DUPLEX_S31803", impeller_material: "DUPLEX_S31803", seal_type: "DOUBLE_CARTRIDGE", flush_plan: "API_PLAN_32", service_class: "ABRASIVE", max_solids_pct: 8.0, max_viscosity_cst: 200.0, max_chloride_ppm: 5000.0, max_temp_c: 110.0, min_running_clearance_mm: 0.45 }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-2001", customer_name: "Tailings Co", duty_flow_m3h: 230.0, duty_head_m: 60.0, npsha_available_m: 6.00, specific_gravity: 1.25, viscosity_cst: 45.0, solids_pct: 6.0, chloride_ppm: 3500.0, process_temp_c: 95.0, min_efficiency_pct: 66.0, test_grade: "GRADE_2B", witness_required: false, service_class_required: "ABRASIVE" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { d3_id: $.data.id, d3_ver: $.data.version }
          trigger:
            - call: "POST /selections"
              payload: { duty_application_id: "${d3_id}", pump_model_id: "${m1_id}", material_seal_config_id: "${c2_id}", expected_duty_application_version: "${d3_ver}" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { s3_id: $.data.id }
          assert:
            - "Selection.${s3_id}.trimmed_impeller_diameter_mm == 313.5"
            - "Selection.${s3_id}.predicted_head_m == 59.99"
            - "Selection.${s3_id}.predicted_efficiency_pct == 67.44"
            - "Selection.${s3_id}.predicted_shaft_power_kw == 69.67"
            - "Selection.${s3_id}.min_motor_kw == 76.64"
            - "Selection.${s3_id}.status == DRAFT"
            - "DutyApplication.${d3_id}.version == 2"

