          setup:
            - "Property 'Cedar Ridge' with a DRAFT contract and property 'Willow Court' with an ACTIVE contract"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
