              as: Examiner
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: complainant_cannot_file_application
        claim_type: exclusive_operation_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /copyright/applications is RightsHolder-exclusive; a Complainant is denied with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A Work exists"]
          setup_api_calls:
            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
