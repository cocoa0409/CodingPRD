  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_blocked_by_active_hold_on_student
        grounds:
          - state_machines.TranscriptOrder.DRAFT_to_SUBMITTED
          - state_machines.TranscriptOrder.SUBMITTED_to_HOLD_CHECK
          - entities.Hold.fields.status
          - entities.Hold.fields.blocking_scope
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair: TranscriptOrder depends on Hold (different entity).
          The order's valid next-state after SUBMITTED is gated by the Hold
          rows hanging off the STUDENT — if any ACTIVE hold with blocking
          scope exists, order advances to HOLD_CHECK instead of
          READY_TO_FULFILL.
        test_recipe:
          setup:
            - "Student s with one ACTIVE FINANCIAL hold (blocking_scope=OFFICIAL)"
            - "Order o OFFICIAL submitted"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-XDEP1"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S8000001"
                full_name: "Nina Park"
                date_of_birth: "2001-01-01"
                email: "nina@example.edu"
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/holds"
              payload:
                student_id: "${student_id}"
                hold_type: "FINANCIAL"
                blocking_scope: "OFFICIAL"
                amount_cents: 10000
              as: BursarOffice
              captures: { hold_id: $.data.id }
            - call: "POST /registrar/recipients"
              payload:
                kind: "EMAIL_PDF"
                display_name: "Self"
                email_address: "nina@example.edu"
              as: RegistrarAdmin
              captures: { recip_id: $.data.id }
            - call: "POST /registrar/orders"
              payload:
                student_id: "${student_id}"
                order_kind: "OFFICIAL"
                rush_requested: false
              as: Student
              as_user_id: "${student_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /registrar/orders/${order_id}/line-items"
              payload:
                recipient_id: "${recip_id}"
                delivery_kind: "EMAIL_PDF"
                quantity: 1
                expected_order_version: "${order_v0}"
              as: Student
              as_user_id: "${student_id}"
              captures: { order_v1: $.data.version }
            - call: "POST /registrar/identity-verifications"
              payload:
                student_id: "${student_id}"
                order_id: "${order_id}"
                method: "SSN_DOB"
              as: Student
              as_user_id: "${student_id}"
              captures: { idv_id: $.data.id, idv_token: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv_id}/confirm"
              payload: { verification_token: "${idv_token}" }
              as: Student
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /registrar/orders/${order_id}/submit"
              payload: { expected_order_version: "${order_v1}" }
              as: Student
              as_user_id: "${student_id}"
              captures: { post_status: $.data.fulfillment_status }
          assert:
            - "post_status == HOLD_CHECK (NOT READY_TO_FULFILL — gated by Hold)"

      - name: verification_approve_blocked_by_revoked_consent_grant
        grounds:
          - state_machines.VerificationRequest.CONSENT_CHECK_to_APPROVED
          - entities.ConsentGrant.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair: VerificationRequest depends on ConsentGrant (different
          entity pair than the sibling). The APPROVE transition's
          preconditions inspect ConsentGrant.status — REVOKED/EXPIRED grant
          forces ERR_FERPA_CONSENT_REQUIRED.
        test_recipe:
          setup:
            - "Student s with ferpa_restricted=true"
            - "ConsentGrant cg was ACTIVE when VerificationRequest vr was created"
            - "cg is REVOKED before approve"
            - "vr is in CONSENT_CHECK"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/students"
              payload:
                student_number: "S8000002"
                full_name: "Omar Ray"
                date_of_birth: "2000-06-30"
                email: "omar@example.edu"
                ferpa_restricted: true
              as: RegistrarAdmin
              captures: { student_id: $.data.id }
            - call: "POST /registrar/consent-grants"
              payload:
                student_id: "${student_id}"
                grantee_name: "Employer Inc"
                scope: "DEGREE_ONLY"
                expires_at: "2027-08-01T00:00:00Z"
              as: Student
              as_user_id: "${student_id}"
              captures: { grant_id: $.data.id }
            - call: "POST /registrar/verification-requests"
              payload:
                requester_name: "Employer Inc"
                subject_student_id: "${student_id}"
                scope: "DEGREE_ONLY"
                consent_grant_id: "${grant_id}"
              as: VerificationRequester
              captures: { vr_id: $.data.id }
            - call: "POST /registrar/verification-requests/${vr_id}/begin-review"
              payload: {}
              as: RegistrarReviewer
            - call: "POST /registrar/consent-grants/${grant_id}/revoke"
              payload: {}
              as: Student
              as_user_id: "${student_id}"
          trigger:
            # Note: the cascade from revoke already transitions CONSENT_CHECK -> DENIED,
            # so a subsequent approve from DENIED would be ERR_INVALID_STATE.
            # To isolate the FERPA consent check, we instead create a NEW verification
            # request referencing the (now revoked) grant, begin review, then approve.
            - call: "POST /registrar/verification-requests"
              payload:
                requester_name: "Employer Inc"
                subject_student_id: "${student_id}"
                scope: "DEGREE_ONLY"
                consent_grant_id: "${grant_id}"
              as: VerificationRequester
              captures: { vr2_id: $.data.id }
            - call: "POST /registrar/verification-requests/${vr2_id}/begin-review"
              payload: {}
              as: RegistrarReviewer
            - call: "POST /registrar/verification-requests/${vr2_id}/approve"
              payload: {}
              as: RegistrarReviewer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FERPA_CONSENT_REQUIRED"
            - "VerificationRequest.${vr2_id}.status == CONSENT_CHECK (no transition)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: fee_schedule_window_overlap_on_active_schedules_rejected
        grounds:
          - entities.FeeSchedule.fields.effective_from
          - entities.FeeSchedule.fields.effective_to
          - validations[priority=15]
          - errors[ERR_SCHEDULE_WINDOW_INVALID]
        distinguishing_aspect: |
          Resource: FeeSchedule (interval occupation). Interval semantics:
          half-open [effective_from, effective_to); two schedules cannot BOTH
          be active with overlapping windows. This is an INTERVAL-OVERLAP
          check on a configuration resource. Adjacent windows (effective_to ==
          other.effective_from) are allowed.
        test_recipe:
          setup:
            - "FS1 active, window [2026-08-01, 2026-09-01)"
            - "Attempt FS2 active with window [2026-08-15, 2026-10-01) — overlaps"
            - "Also attempt FS3 active with window [2026-09-01, 2026-10-01) — adjacent (allowed)"
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-OVER-A"
                official_base_cents: 1000
                unofficial_base_cents: 500
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-01T00:00:00Z"
                effective_to: "2026-09-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
              captures: { fs1: $.data.id }
          trigger:
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-OVER-B"
                official_base_cents: 1200
                unofficial_base_cents: 600
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-08-15T00:00:00Z"
                effective_to: "2026-10-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
              captures: { err: $.data.error_id }
            - call: "POST /registrar/fee-schedules"
              payload:
                code: "FS-OVER-C"
                official_base_cents: 1300
                unofficial_base_cents: 650
                paper_surcharge_cents: 200
                pickup_surcharge_cents: 100
                rush_flat_cents: 1500
                rush_multiplier_bp: 15000
                volume_tiers: []
                effective_from: "2026-09-01T00:00:00Z"
                effective_to: "2026-10-01T00:00:00Z"
                active: true
              as: RegistrarAdmin
              captures: { fs3: $.data.id }
          assert:
            - "err == ERR_SCHEDULE_WINDOW_INVALID (overlap rejected)"
            - "fs3 is created successfully (adjacent windows do not overlap under half-open semantics)"

      - name: identity_verification_token_expiry_window
        grounds:
          - entities.IdentityVerification.fields.expires_at
          - validations[priority=14]
          - errors[ERR_VERIFICATION_EXPIRED]
        distinguishing_aspect: |
          Resource: IdentityVerification (point-in-interval occupation).
          Interval semantics: confirm is valid iff clock.now() < expires_at,
          i.e. the request point must lie inside the half-open window
          [created_at, expires_at). This is a POINT-IN-INTERVAL check, not
          interval-overlap. At exactly expires_at, the token is dead.
        test_recipe:
          setup:
            - "IdentityVerification idv created at 2026-08-01T00:00:00Z (expires 2026-08-04T00:00:00Z)"
            - "Clock advanced to exactly 2026-08-04T00:00:00Z"
