        claim_type: violation_to_error
        grounds: ["concurrency_rules[alloc-commit-stale-container]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client reads Container.version V, another commit advances it to V+1, then the first client's commit with expected_container_version V is rejected 412 ERR_STALE_VERSION — two strictly sequential requests."
        test_recipe:
          setup: ["item ACTIVE; PO issued; container qty 6; allocations A1 (3) and A2 (3) both PLANNED; container version captured BEFORE A1 commits"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "ER2", name: "E2", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 3000, member_price_cents: 3000, floor_margin_pct: 0.01, lead_time_days: 20, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-ER2"
                lines: [ { item_id: "${item_id}", quantity: 6, unit_cost_cents: 1000 } ]
                estimated_duty_cents: 0
                estimated_freight_cents: 0
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-ER2"
                lines: [ { item_id: "${item_id}", quantity: 6 } ]
              as: LogisticsCoordinator
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /stores"
              payload: { store_code: "ST-ER2", name: "SE2", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/allocations"
              payload: { container_id: "${cont_id}", item_id: "${item_id}", quantity: 3 }
              as: InventoryPlanner
              captures: { a1: $.data.id }
            - call: "POST /stores/${store_id}/allocations"
              payload: { container_id: "${cont_id}", item_id: "${item_id}", quantity: 3 }
              as: InventoryPlanner
              captures: { a2: $.data.id }
            - call: "POST /store-allocations/${a1}/commit"
              payload: { expected_container_version: "${cont_v}" }
              as: InventoryPlanner
          trigger:
            - call: "POST /store-allocations/${a2}/commit"
              payload: { expected_container_version: "${cont_v}" }
              as: InventoryPlanner
              captures: { err: $.data.error_id }
            - call: "GET /containers/${cont_id}"
              payload: {}
              as: InventoryPlanner
              captures: { cont_v2: $.data.version }
            - call: "POST /store-allocations/${a2}/commit"
              payload: { expected_container_version: "${cont_v2}" }
              as: InventoryPlanner
          assert:
            - "stale commit rejected: err == ERR_STALE_VERSION (http 412)"
            - "re-read then retry succeeds: StoreAllocation.${a2}.status == COMMITTED"
            - "Container.${cont_id}.unallocated_quantities[${item_id}] == 0"

