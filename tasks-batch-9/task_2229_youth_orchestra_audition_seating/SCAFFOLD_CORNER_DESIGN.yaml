              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Ada Strings", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_A", years_in_org: 6, sibling_enrolled: true, alumni_engagement_opt_in: false }
