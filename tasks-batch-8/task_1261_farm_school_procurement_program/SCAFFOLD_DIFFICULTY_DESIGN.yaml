          assert:
            - "AgreementAmendment.${amd}.status == REJECTED"
            - "PlantingAgreement.${agr}.status == SIGNED (cycled back)"
            - "PlantingAgreement.${agr}.committed_quantity == 200 AND unit_price_cents == 250 (terms unchanged)"

      - name: delivery_receipt_fork_divergence
        grounds:
          - state_machines.Delivery.CHECKED_IN_to_ACCEPTED
          - state_machines.Delivery.CHECKED_IN_to_REJECTED
          - calculations.delivered_aggregation
        distinguishing_aspect: |
          Delivery receipt is a fork with divergent side-effect sets: the
          ACCEPTED branch increments agreement.delivered_quantity by
          accepted_quantity; the REJECTED branch leaves it untouched. Two
          deliveries (qty 40 accepted, qty 10 rejected) leave delivered == 40.
        test_recipe:
          setup:
