            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-21T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C50", period_start_date: "2026-07-01", period_end_date: "2026-07-31", read_window_open_date: "2026-07-22", read_window_close_date: "2026-07-28", bill_run_date: "2026-07-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-22T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-07-22", route_shift: "AM" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_id: "$.data[0].id" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_id}/mark-no-read", payload: { no_read_reason: "NO_ACCESS" }, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /route-stops/${stop_id}/generate-estimate", payload: {}, as: BillingLiaison, captures: { est_id: $.data.id, est_val: $.data.read_value, est_method: $.data.estimation_method } }
          assert:
            - "MeterRead.${est_id}.read_value == 10270 (${est_val})   # fallback to TRAILING: 10000 + 10.0*27"
            - "MeterRead.${est_id}.estimation_method == TRAILING_AVERAGE (${est_method})   # fallback is recorded, not hidden"

      - name: estimate_rejected_with_single_trailing_read
        claim_type: input_set_filtering
        grounds: [calculations.estimate_read_value, 'errors[ERR_INSUFFICIENT_READ_HISTORY]']
        distinguishing_aspect: "Only 1 VALIDATED read in the trailing 365 days (minimum is 2) -> ERR_INSUFFICIENT_READ_HISTORY; PROVISIONAL/ESTIMATED reads do not count toward history."
