# =============================================================================
# PRD-Bench Scaffold — Online Travel Agency Model & Rate Parity Administration
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in siblings.
# =============================================================================
scenario: |
  Generate task harder than expert level!

  2581. Online Travel Agency Model & Rate Parity Administration (online travel marketplace): merchant versus agency model selection by supplier with payment and risk implications, rate and inventory ingestion with parity monitoring against supplier direct channels, commission or markup structure with negotiated overrides and preferred placement agreements, ranking and sort order governance with paid placement disclosure, cancellation and refund policy pass-through with supplier dispute mediation, chargeback and fraud liability allocation between marketplace and supplier, package rate construction combining air and hotel with opaque pricing rules, supplier scorecard, content quality and connectivity certification, regulatory disclosure of ranking criteria and total price display

domain_name: "ota-model-rate-parity"
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - selector_policy
    - optimistic_concurrency
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# --- §1.0 Response Envelope (FIXED — verbatim) --------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# --- §1.1 Entity-Relationship Table ------------------------------------------
# common_fields: true  -> id (server UUID, no prefix), created_at, updated_at, version
# common_fields: false -> id, created_at only (append-only / immutable rows)
entities:

  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: market_code, type: string, source: input, description: "Jurisdiction code the marketplace sells into", constraints: "unique; 3-12 chars uppercase/hyphen" }
      - { name: name, type: string, source: input, description: "Human readable market name" }
      - { name: paid_slot_capacity, type: integer, source: input, description: "Maximum sum of PlacementAgreement.slots that may be ACTIVE on any single calendar day in this market", constraints: ">= 0" }
      - { name: price_display_mode, type: enum, source: input, description: "Regulatory total-price display regime for this market", constraints: "enum: TOTAL_UPFRONT|EXCL_TAXES" }
      - { name: ranking_disclosure_required, type: boolean, source: input, default: true, description: "When true a RankingRun may only be PUBLISHED with a non-null disclosure_version" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Market lifecycle", constraints: "enum: ACTIVE|CLOSED" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered supplier name" }
      - { name: supplier_type, type: enum, source: input, description: "Inventory family this supplier sells", constraints: "enum: HOTEL|AIR" }
      - { name: home_market_id, type: string, source: input, description: "FK -> Market.id; market the supplier is domiciled in" }
      - { name: contact_email, type: string, source: input, description: "Operations contact" }
      - { name: conversion_index, type: number, source: input, default: 50, description: "Historic conversion index used by the ranking score", constraints: "0..100" }
      - { name: certification_level, type: enum, source: computed, default: NONE, description: "Derived from the supplier's latest decided Certification", constraints: "enum: NONE|PROVISIONAL|CERTIFIED" }
      - { name: content_score, type: number, source: computed, default: 0, description: "content_score copied from the latest CERTIFIED or PROVISIONAL Certification" }
      - { name: connectivity_score, type: number, source: computed, default: 0, description: "connectivity_score copied from the latest CERTIFIED or PROVISIONAL Certification" }
      - { name: visibility_status, type: enum, source: system, default: PENDING_CERT, description: "Marketplace visibility posture", constraints: "enum: PENDING_CERT|ACTIVE|SUSPENDED|OFFBOARDED" }
      - { name: current_model, type: enum, source: computed, default: NONE, description: "model of the ModelAgreement with status ACTIVE whose window covers the current logical date; NONE when no such agreement exists", constraints: "enum: NONE|MERCHANT|AGENCY" }
      - { name: parity_strikes, type: integer, source: computed, default: 0, description: "Count of ParityCase rows for this supplier's rate plans that have reached status ESCALATED" }
      - { name: suspension_reason, type: string, source: computed, description: "Why visibility_status became SUSPENDED; null otherwise" }

  - name: ModelAgreement
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier the agreement binds" }
      - { name: model, type: enum, source: input, description: "Merchant (marketplace is merchant of record) or agency (supplier collects, marketplace earns commission)", constraints: "enum: MERCHANT|AGENCY" }
      - { name: effective_from, type: string, source: input, description: "First calendar date covered, YYYY-MM-DD, inclusive" }
      - { name: effective_to, type: string, source: input, description: "Last calendar date covered, YYYY-MM-DD, inclusive; null means open-ended and is treated as 9999-12-31" }
      - { name: base_commission_pct, type: number, source: input, description: "Commission share of the supplier-published sell rate under AGENCY", constraints: "0..0.5" }
      - { name: base_markup_pct, type: number, source: input, description: "Target margin share of gross used to gross-up the net rate under MERCHANT", constraints: "0..0.5" }
      - { name: chargeback_liability_pct_marketplace, type: number, source: input, description: "Marketplace share of a dispute settlement total", constraints: "0..1" }
      - { name: fraud_liability_cap_cents, type: integer, source: input, description: "Hard cap on the marketplace share when dispute_type is FRAUD", constraints: ">= 0" }
      - { name: settlement_terms_days, type: integer, source: input, description: "Net settlement days owed to the supplier", constraints: "1..90" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Agreement lifecycle", constraints: "enum: DRAFT|ACTIVE|SUPERSEDED|TERMINATED|WITHDRAWN" }
      - { name: activated_at, type: datetime, source: computed, description: "Logical clock instant of activation; null while DRAFT" }
      - { name: termination_reason, type: string, source: computed, description: "Reason captured on terminate; null otherwise" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the CommercialManager that drafted the agreement" }
      - { name: activated_by_user_id, type: string, source: computed, description: "X-User-ID of the ComplianceOfficer that activated it; null while DRAFT" }

  - name: Certification
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier under certification" }
      - { name: content_score_claimed, type: number, source: input, description: "Self-declared content completeness score", constraints: "0..100" }
      - { name: connectivity_protocol, type: enum, source: input, description: "Connectivity channel being certified", constraints: "enum: OTA_2011B|JSON_V2|GDS_EDIFACT" }
      - { name: sample_payload_ref, type: string, source: input, description: "Pointer to the sample rate payload submitted for review" }
      - { name: content_score, type: number, source: computed, description: "Reviewer-assigned content quality score; null before a decision", constraints: "0..100" }
      - { name: connectivity_score, type: number, source: computed, description: "Reviewer-assigned connectivity score; null before a decision", constraints: "0..100" }
      - { name: decision, type: enum, source: computed, description: "Latest reviewer decision; null before a decision", constraints: "enum: CERTIFY|PROVISIONAL|REJECT" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Certification lifecycle", constraints: "enum: SUBMITTED|IN_REVIEW|CERTIFIED|PROVISIONAL|REJECTED|REMEDIATION_SUBMITTED|EXPIRED|REVOKED" }
      - { name: remediation_rounds, type: integer, source: computed, default: 0, description: "Number of times the supplier has resubmitted after a REJECT" }
      - { name: expires_at, type: datetime, source: computed, description: "CERTIFY sets decided_at + 365 days; PROVISIONAL sets decided_at + 90 days; null otherwise" }
      - { name: reviewed_by_user_id, type: string, source: computed, description: "X-User-ID of the ComplianceOfficer that recorded the latest decision" }
      - { name: revocation_reason, type: string, source: computed, description: "Reason captured on revoke; null otherwise" }

  - name: RatePlan
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; owning supplier" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; market the plan is sold into" }
      - { name: name, type: string, source: input, description: "Plan name shown on the listing" }
      - { name: currency, type: string, source: input, description: "ISO 4217 code all cents amounts are denominated in" }
      - { name: cancellation_policy_code, type: enum, source: input, description: "Pass-through cancellation policy inherited by every Booking on this plan", constraints: "enum: FLEX|MODERATE|STRICT|NON_REF" }
      - { name: free_cancel_cutoff_hours, type: integer, source: input, description: "Hours before arrival at or beyond which the policy's most generous band applies", constraints: "0..720" }
      - { name: tax_fee_pct, type: number, source: input, description: "Taxes and fees rate applied to gross for the market's total-price display", constraints: "0..0.5" }
      - { name: parity_monitored, type: boolean, source: input, default: true, description: "When false, parity observations are stored but never open a ParityCase" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Plan lifecycle; PARITY_HOLD blocks publishing offers", constraints: "enum: ACTIVE|PARITY_HOLD|ARCHIVED" }
      - { name: parity_hold_case_id, type: string, source: computed, description: "id of the ParityCase whose escalation placed this plan on hold (see ParityCase.rate_plan_id); null when status != PARITY_HOLD" }

  - name: Offer
    parent: RatePlan
    common_fields: true
    fields:
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id; plan this dated rate belongs to" }
      - { name: travel_date, type: string, source: input, description: "Stay or departure date, YYYY-MM-DD" }
      - { name: net_rate_cents, type: integer, source: input, description: "Supplier net (MERCHANT) or supplier-published sell rate (AGENCY), in cents", constraints: ">= 1" }
      - { name: allotment_total, type: integer, source: input, description: "Units the supplier released for this date", constraints: ">= 1" }
      - { name: allotment_held, type: integer, source: computed, default: 0, description: "Units held by bookings whose fulfillment_status is RESERVED" }
      - { name: allotment_sold, type: integer, source: computed, default: 0, description: "Units consumed by bookings whose fulfillment_status is CONFIRMED or COMPLETED" }
      - { name: allotment_remaining, type: integer, source: computed, description: "allotment_total - allotment_held - allotment_sold" }
      - { name: pricing_model, type: enum, source: computed, description: "model of the ModelAgreement resolved at offer creation", constraints: "enum: MERCHANT|AGENCY" }
      - { name: applied_rate_pct, type: number, source: computed, description: "Commission or markup rate actually used by offer_sell_price" }
      - { name: applied_override_id, type: string, source: computed, description: "id of the CommissionOverride selected by offer_sell_price (see CommissionOverride.id); null when the ModelAgreement base rate was used" }
      - { name: gross_cents, type: integer, source: computed, description: "Pre-tax sell price in cents" }
      - { name: taxes_fees_cents, type: integer, source: computed, description: "round_half_up(gross_cents * RatePlan.tax_fee_pct)" }
      - { name: display_total_cents, type: integer, source: computed, description: "gross_cents + taxes_fees_cents; the regulated total price display" }
      - { name: marketplace_margin_cents, type: integer, source: computed, description: "Marketplace take on this offer" }
      - { name: supplier_payable_cents, type: integer, source: computed, description: "gross_cents - marketplace_margin_cents" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Offer lifecycle", constraints: "enum: PENDING|LIVE|SUPPRESSED|CLOSED|SUPERSEDED" }
      - { name: suppression_reason, type: string, source: computed, description: "Why the offer was suppressed; null otherwise" }

  - name: DirectRateObservation
    parent: RatePlan
    common_fields: false
    fields:
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id; plan whose parity is being measured" }
      - { name: travel_date, type: string, source: input, description: "Travel date observed, YYYY-MM-DD" }
      - { name: channel, type: enum, source: input, description: "Supplier direct channel the price was scraped from", constraints: "enum: SUPPLIER_WEB|SUPPLIER_APP|META" }
      - { name: observed_at, type: datetime, source: input, description: "Instant the direct price was captured, ISO 8601 UTC" }
      - { name: direct_total_cents, type: integer, source: input, description: "Total price including taxes and fees on the supplier direct channel", constraints: ">= 1" }
      - { name: compared_offer_id, type: string, source: computed, description: "id of the Offer with status LIVE on the same rate_plan_id and travel_date used as the marketplace side of the comparison (see Offer.id); null when no LIVE offer exists" }
      - { name: breach_bps, type: integer, source: computed, description: "parity_breach_bps output; null when compared_offer_id is null" }
      - { name: severity, type: enum, source: computed, description: "Severity band of breach_bps", constraints: "enum: NONE|MINOR|MAJOR|SEVERE" }
      - { name: parity_case_id, type: string, source: computed, description: "id of the ParityCase this observation opened or updated (see ParityCase.opening_observation_id); null when severity is NONE" }
      - { name: observed_by_user_id, type: string, source: system, description: "X-User-ID of the ParityAnalyst that posted the observation" }

  - name: ParityCase
    parent: RatePlan
    common_fields: true
    fields:
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id; plan under investigation" }
      - { name: travel_date, type: string, source: computed, description: "Travel date the case is scoped to, copied from the opening observation" }
      - { name: opening_observation_id, type: string, source: computed, description: "FK -> DirectRateObservation.id; observation whose breach opened the case" }
      - { name: severity, type: enum, source: computed, description: "Highest severity seen on this case", constraints: "enum: MINOR|MAJOR|SEVERE" }
      - { name: peak_breach_bps, type: integer, source: computed, description: "Maximum breach_bps across observations attached to this case" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Mediation lifecycle", constraints: "enum: OPEN|SUPPLIER_NOTIFIED|SUPPLIER_RESPONDED|ESCALATED|RESOLVED_COMPLIANT|WAIVED" }
      - { name: notify_rounds, type: integer, source: computed, default: 0, description: "Number of notify-supplier rounds issued; capped at PARITY_MAX_NOTIFY_ROUNDS" }
      - { name: supplier_response_code, type: enum, source: computed, description: "Latest supplier answer; null before the first response", constraints: "enum: RATE_CORRECTED|DISPUTED|NO_ACTION" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the ParityAnalyst whose observation opened the case" }
      - { name: closed_by_user_id, type: string, source: computed, description: "X-User-ID that closed the case; null while open" }
      - { name: close_outcome, type: enum, source: computed, description: "Terminal outcome; null while open", constraints: "enum: COMPLIANT|WAIVED" }
      - { name: escalated_at, type: datetime, source: computed, description: "Logical clock instant of escalation; null otherwise" }

  - name: CommissionOverride
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier the negotiated economics apply to" }
      - { name: rate_plan_id, type: string, source: input, description: "FK -> RatePlan.id; when null the override is supplier-wide, otherwise scoped to this one plan" }
      - { name: override_type, type: enum, source: input, description: "Which economic lever the negotiated value replaces", constraints: "enum: COMMISSION_PCT|MARKUP_PCT|FLAT_FEE_CENTS" }
      - { name: value, type: number, source: input, description: "Percentage as a decimal for COMMISSION_PCT and MARKUP_PCT, whole cents for FLAT_FEE_CENTS", constraints: ">= 0" }
      - { name: effective_from, type: string, source: input, description: "First travel date covered, YYYY-MM-DD, inclusive" }
      - { name: effective_to, type: string, source: input, description: "Last travel date covered, YYYY-MM-DD, inclusive" }
      - { name: justification, type: string, source: input, description: "Commercial rationale recorded for audit" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "Override lifecycle", constraints: "enum: PROPOSED|ACTIVE|REJECTED|REVOKED|EXPIRED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the CommercialManager that proposed it" }
      - { name: approved_by_user_id, type: string, source: computed, description: "X-User-ID of the ComplianceOfficer that approved it; MUST differ from proposed_by_user_id" }
      - { name: rejection_reason, type: string, source: computed, description: "Reason captured on reject; null otherwise" }

  - name: PlacementAgreement
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier buying placement" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; market whose paid slots are consumed" }
      - { name: slots, type: integer, source: input, description: "Paid slots reserved on every day of the window", constraints: "1..10" }
      - { name: boost_points, type: integer, source: input, description: "Points added to organic_score for this supplier's offers", constraints: "0..15" }
      - { name: fee_cents, type: integer, source: input, description: "Flat fee the supplier pays for the window", constraints: ">= 0" }
      - { name: disclosure_label, type: enum, source: input, description: "Label a boosted RankingEntry must carry for paid-placement disclosure", constraints: "enum: SPONSORED|PREFERRED_PARTNER" }
      - { name: window_start, type: string, source: input, description: "First calendar date of the window, YYYY-MM-DD, inclusive" }
      - { name: window_end, type: string, source: input, description: "Exclusive end of the window, YYYY-MM-DD; the window is half-open [window_start, window_end)" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "Placement lifecycle", constraints: "enum: PROPOSED|ACTIVE|REJECTED|CANCELLED|EXPIRED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the CommercialManager that proposed it" }
      - { name: approved_by_user_id, type: string, source: computed, description: "X-User-ID of the PlatformAdmin that approved it; MUST differ from proposed_by_user_id" }
      - { name: cancellation_reason, type: string, source: computed, description: "Reason captured on cancel; null otherwise" }

  - name: RankingRun
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; market being ranked" }
      - { name: travel_date, type: string, source: input, description: "Travel date the ranked result set is for, YYYY-MM-DD" }
      - { name: sort_profile, type: enum, source: input, description: "Governed sort profile", constraints: "enum: BEST_VALUE|PRICE_ASC" }
      - { name: disclosure_version, type: string, source: input, description: "Version tag of the published ranking-criteria disclosure; null when the operator has not attached one" }
      - { name: weights_snapshot, type: object, source: computed, description: "The four ranking weights frozen at run creation, keys price/content/parity/conversion" }
      - { name: entry_count, type: integer, source: computed, description: "Number of RankingEntry rows produced" }
      - { name: paid_entry_count, type: integer, source: computed, description: "Number of RankingEntry rows with is_paid_placement true" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Run lifecycle", constraints: "enum: DRAFT|PUBLISHED|WITHDRAWN" }
      - { name: published_at, type: datetime, source: computed, description: "Logical clock instant of publication; null while DRAFT" }
      - { name: published_by_user_id, type: string, source: computed, description: "X-User-ID of the ComplianceOfficer that published the run" }
      - { name: withdrawal_reason, type: string, source: computed, description: "Reason captured on withdraw; null otherwise" }

  - name: RankingEntry
    parent: RankingRun
    common_fields: false
    fields:
      - { name: ranking_run_id, type: string, source: input, description: "FK -> RankingRun.id; run this row belongs to" }
      - { name: offer_id, type: string, source: input, description: "FK -> Offer.id; ranked offer" }
      - { name: placement_agreement_id, type: string, source: computed, description: "FK -> PlacementAgreement.id; agreement that supplied boost_points, null for organic rows" }
      - { name: rank_position, type: integer, source: computed, description: "1-based position after the governed ordering is applied" }
      - { name: price_competitiveness, type: number, source: computed, description: "Price sub-score, 2 decimals" }
      - { name: organic_score, type: number, source: computed, description: "Weighted score before any paid boost, 2 decimals" }
      - { name: boost_points_applied, type: integer, source: computed, description: "Boost actually applied after the BOOST_CAP_POINTS cap" }
      - { name: final_score, type: number, source: computed, description: "organic_score + boost_points_applied, 2 decimals" }
      - { name: is_paid_placement, type: boolean, source: computed, description: "True when boost_points_applied > 0" }
      - { name: disclosure_label, type: enum, source: computed, description: "Disclosure text carried by this row", constraints: "enum: ORGANIC|SPONSORED|PREFERRED_PARTNER" }

  - name: Package
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; market the package is sold into" }
      - { name: travel_date, type: string, source: input, description: "Common travel date every component offer must carry, YYYY-MM-DD" }
      - { name: name, type: string, source: input, description: "Merchandising name" }
      - { name: opaque, type: boolean, source: input, description: "When true the component supplier identities are withheld until after booking" }
      - { name: components_subtotal_cents, type: integer, source: computed, description: "Sum of PackageComponent.display_total_snapshot_cents; null before pricing" }
      - { name: discount_pct, type: number, source: computed, description: "Opaque bundle discount tier selected from components_subtotal_cents; null before pricing" }
      - { name: discount_cents, type: integer, source: computed, description: "floor(components_subtotal_cents * discount_pct); null before pricing" }
      - { name: package_total_cents, type: integer, source: computed, description: "components_subtotal_cents - discount_cents; null before pricing" }
      - { name: component_count, type: integer, source: computed, default: 0, description: "Number of PackageComponent rows attached" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Package lifecycle", constraints: "enum: DRAFT|PRICED|PUBLISHED|WITHDRAWN" }
      - { name: reveal_supplier_names, type: boolean, source: computed, default: false, description: "Set from the publish request; MUST stay false when opaque is true" }
      - { name: priced_at, type: datetime, source: computed, description: "Logical clock instant of the latest pricing run; null before pricing" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the CommercialManager that created the package" }

  - name: PackageComponent
    parent: Package
    common_fields: false
    fields:
      - { name: package_id, type: string, source: input, description: "FK -> Package.id; owning package" }
      - { name: offer_id, type: string, source: input, description: "FK -> Offer.id; offer contributing this leg" }
      - { name: component_type, type: enum, source: input, description: "Leg family; a publishable package needs at least one of each", constraints: "enum: AIR|HOTEL" }
      - { name: display_total_snapshot_cents, type: integer, source: computed, description: "Offer.display_total_cents frozen by the latest pricing run; null before pricing" }
      - { name: discount_alloc_cents, type: integer, source: computed, description: "This component's share of Package.discount_cents; null before pricing" }
      - { name: allocated_cents, type: integer, source: computed, description: "display_total_snapshot_cents - discount_alloc_cents; null before pricing" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: input, description: "FK -> Offer.id; booked offer for a single-component sale, null for a package sale" }
      - { name: package_id, type: string, source: input, description: "FK -> Package.id; booked package, null for a single-offer sale" }
      - { name: traveler_reference, type: string, source: input, description: "Opaque traveler record locator supplied by the booking channel" }
      - { name: quoted_total_cents, type: integer, source: input, description: "Total the channel displayed to the traveler; must equal the server-computed charged_total_cents" }
      - { name: payment_token, type: string, source: input, description: "Tokenized payment instrument reference" }
      - { name: charged_total_cents, type: integer, source: computed, description: "Offer.display_total_cents or Package.package_total_cents at booking time" }
      - { name: taxes_fees_cents, type: integer, source: computed, description: "Tax and fee portion currently retained" }
      - { name: marketplace_margin_cents, type: integer, source: computed, description: "Marketplace margin portion currently retained" }
      - { name: supplier_payable_cents, type: integer, source: computed, description: "Supplier payable portion currently retained" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Cash returned to the traveler so far" }
      - { name: last_refund_clawback_cents, type: integer, source: computed, default: 0, description: "Margin clawed back by the most recent refund, replayed on reversal" }
      - { name: last_refund_supplier_debit_cents, type: integer, source: computed, default: 0, description: "Supplier payable debited by the most recent refund, replayed on reversal" }
      - { name: last_refund_tax_cents, type: integer, source: computed, default: 0, description: "Tax and fee portion refunded by the most recent refund, replayed on reversal" }
      - { name: payment_status, type: enum, source: system, default: AUTHORIZED, description: "Money dimension; evolves independently of fulfillment_status", constraints: "enum: AUTHORIZED|CAPTURED|REFUNDED_PARTIAL|REFUNDED_FULL|CHARGEBACK" }
      - { name: fulfillment_status, type: enum, source: system, default: RESERVED, description: "Inventory dimension; evolves independently of payment_status", constraints: "enum: RESERVED|CONFIRMED|CANCELLED|COMPLETED" }
      - { name: collection_model, type: enum, source: computed, description: "Who collects from the traveler, copied from the pricing model of the booked inventory", constraints: "enum: MERCHANT|AGENCY" }
      - { name: arrival_at, type: datetime, source: computed, description: "travel_date of the booked inventory at ARRIVAL_HOUR_UTC, used by refund_passthrough_due" }
      - { name: cancellation_refund_pct, type: number, source: computed, description: "Refund percentage applied by the latest cancellation; null before cancellation" }
      - { name: cancelled_at, type: datetime, source: computed, description: "Logical clock instant of cancellation; null otherwise" }
      - { name: supplier_confirmation_code, type: string, source: computed, description: "Code supplied by the supplier on confirm; null before confirmation" }
      - { name: booked_by_user_id, type: string, source: system, description: "X-User-ID of the BookingAgent that created the booking" }

  - name: DisputeCase
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking under dispute" }
      - { name: supplier_id, type: string, source: computed, description: "FK -> Supplier.id; supplier of the booked inventory, denormalised for scorecard rollups" }
      - { name: dispute_type, type: enum, source: input, description: "Nature of the claim", constraints: "enum: REFUND_PASSTHROUGH|CHARGEBACK|FRAUD" }
      - { name: claim_cents, type: integer, source: input, description: "Amount claimed by the filing party", constraints: ">= 1" }
      - { name: narrative, type: string, source: input, description: "Filing narrative recorded for audit" }
      - { name: refund_due_cents, type: integer, source: computed, description: "claim_cents capped at Booking.charged_total_cents - Booking.refunded_cents" }
      - { name: mediation_fee_pct, type: number, source: computed, description: "Fee tier selected from refund_due_cents" }
      - { name: mediation_fee_cents, type: integer, source: computed, description: "MEDIATION_FEE_BASE_CENTS + round_half_up(refund_due_cents * mediation_fee_pct)" }
      - { name: settlement_total_cents, type: integer, source: computed, description: "refund_due_cents + mediation_fee_cents" }
      - { name: filing_agreement_id, type: string, source: computed, description: "FK -> ModelAgreement.id; agreement whose window covers the filing date, used by the PRELIMINARY variant" }
      - { name: binding_agreement_id, type: string, source: computed, description: "FK -> ModelAgreement.id; agreement whose window covers the booked travel date, used by the BINDING variant; null before resolution" }
      - { name: preliminary_marketplace_cents, type: integer, source: computed, description: "PRELIMINARY variant marketplace share, stamped at filing" }
      - { name: preliminary_supplier_cents, type: integer, source: computed, description: "settlement_total_cents - preliminary_marketplace_cents, stamped at filing" }
      - { name: binding_marketplace_cents, type: integer, source: computed, description: "BINDING variant marketplace share, stamped at resolution; null before resolution" }
      - { name: binding_supplier_cents, type: integer, source: computed, description: "settlement_total_cents - binding_marketplace_cents; null before resolution" }
      - { name: uncapped_marketplace_cents, type: integer, source: computed, description: "BINDING marketplace share before the FRAUD cap was applied; null before resolution" }
      - { name: status, type: enum, source: system, default: FILED, description: "Mediation lifecycle", constraints: "enum: FILED|RESPONSE_REQUESTED|MEDIATION|RESOLVED" }
      - { name: mediation_rounds, type: integer, source: computed, default: 0, description: "Number of response requests issued; capped at DISPUTE_MAX_ROUNDS" }
      - { name: outcome, type: enum, source: computed, description: "Binding outcome; null before resolution", constraints: "enum: SUPPLIER_LIABLE|MARKETPLACE_LIABLE|SPLIT|REVERSE_REFUND" }
      - { name: supplier_position, type: string, source: computed, description: "Latest supplier response text; null before the first response" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the party that filed" }
      - { name: resolved_by_user_id, type: string, source: computed, description: "X-User-ID of the ComplianceOfficer that resolved the case" }

  - name: SupplierScorecard
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; scored supplier" }
      - { name: period_start, type: string, source: input, description: "First date of the scoring period, YYYY-MM-DD, inclusive" }
      - { name: period_end, type: string, source: input, description: "Last date of the scoring period, YYYY-MM-DD, inclusive" }
      - { name: variant, type: enum, source: system, default: PROVISIONAL, description: "Which supplier_composite_score variant the stored numbers came from", constraints: "enum: PROVISIONAL|FINAL" }
      - { name: parity_penalty_points, type: number, source: computed, description: "Weighted parity penalty points counted by the active variant" }
      - { name: parity_component, type: number, source: computed, description: "max(0, 100 - 8 * parity_penalty_points)" }
      - { name: content_component, type: number, source: computed, description: "Supplier.content_score at computation time" }
      - { name: connectivity_component, type: number, source: computed, description: "Supplier.connectivity_score at computation time" }
      - { name: dispute_component, type: number, source: computed, description: "100 minus the supplier-liable share of disputed cents counted by the active variant" }
      - { name: composite_score, type: number, source: computed, description: "Weighted composite, 2 decimals" }
      - { name: cases_counted, type: integer, source: computed, description: "Number of ParityCase rows the active variant counted" }
      - { name: finalized_by_user_id, type: string, source: computed, description: "X-User-ID of the ComplianceOfficer that finalized; null while PROVISIONAL" }

# --- §1.2 State Machine Table -------------------------------------------------
state_machines:

  - entity: Supplier
    initial_state: PENDING_CERT
    terminal_states: [OFFBOARDED]
    transitions:
      - from: PENDING_CERT
        to: ACTIVE
        trigger: "POST /certifications/{id}/decide with decision CERTIFY or PROVISIONAL"
        actor: ComplianceOfficer
        preconditions: ["Certification.status == IN_REVIEW", "Certification.supplier_id == this Supplier.id"]
        side_effects:
          - "sets Supplier.certification_level to CERTIFIED (decision CERTIFY) or PROVISIONAL (decision PROVISIONAL)"
          - "copies Certification.content_score into Supplier.content_score and Certification.connectivity_score into Supplier.connectivity_score"
          - "increments Supplier.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /certifications/{id}/revoke, or the EXPIRED auto-transition fired by POST /_clock/set_current_utc"
        actor: ComplianceOfficer | system
        preconditions: ["the revoked or expired Certification is the one that currently backs Supplier.certification_level"]
        side_effects:
          - "sets Supplier.certification_level to NONE, content_score to 0, connectivity_score to 0"
          - "sets Supplier.suspension_reason to CERTIFICATION_REVOKED or CERTIFICATION_EXPIRED"
          - "cascade hop 2: every Offer of this supplier with status LIVE moves to SUPPRESSED with suppression_reason SUPPLIER_SUSPENDED"
          - "increments Supplier.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /suppliers/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: ["Supplier.certification_level IN {PROVISIONAL, CERTIFIED}", "Supplier.visibility_status == SUSPENDED"]
        side_effects: ["clears Supplier.suspension_reason", "increments Supplier.version by 1"]
        note: "Reinstatement never un-suppresses offers; each Offer must be republished individually."
      - from: ACTIVE
        to: OFFBOARDED
        trigger: "POST /suppliers/{id}/offboard"
        actor: PlatformAdmin
        preconditions: ["no Booking of this supplier's offers has fulfillment_status IN {RESERVED, CONFIRMED}"]
        side_effects:
          - "every Offer of this supplier with status IN {PENDING, LIVE, SUPPRESSED} moves to CLOSED"
          - "every RatePlan of this supplier moves to ARCHIVED"
          - "increments Supplier.version by 1"
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /suppliers/{id}/offboard"
        actor: PlatformAdmin
        preconditions: ["no Booking of this supplier's offers has fulfillment_status IN {RESERVED, CONFIRMED}"]
        side_effects: ["same as the ACTIVE -> OFFBOARDED transition", "increments Supplier.version by 1"]

  - entity: ModelAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /model-agreements/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Supplier.visibility_status != OFFBOARDED"
          - "no other ModelAgreement of the same supplier with status ACTIVE has a closed interval [effective_from, effective_to] intersecting this one (see validations priority 14)"
          - "X-User-ID != ModelAgreement.proposed_by_user_id"
        side_effects:
          - "stamps activated_at and activated_by_user_id from the logical clock and X-User-ID"
          - "recomputes Supplier.current_model from the agreement whose window covers the current logical date"
          - "increments Supplier.version by 1 and ModelAgreement.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /model-agreements/{id}/withdraw"
        actor: CommercialManager
        preconditions: ["ModelAgreement.status == DRAFT"]
        side_effects: ["increments ModelAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /model-agreements/{id}/terminate"
        actor: CommercialManager
        preconditions: ["ModelAgreement.status == ACTIVE"]
        side_effects:
          - "stores termination_reason"
          - "recomputes Supplier.current_model; it becomes NONE when no ACTIVE agreement covers the current logical date"
          - "increments Supplier.version by 1 and ModelAgreement.version by 1"
        note: "Termination never reprices existing offers; Offer pricing is pinned at creation."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event during POST /model-agreements/{id}/activate on a successor agreement whose effective_from equals this agreement's effective_from"
        actor: system
        preconditions: ["the successor covers exactly the same effective_from date", "this agreement's status == ACTIVE"]
        side_effects: ["increments ModelAgreement.version by 1"]
        note: "Same-start replacement is the only path that supersedes; every other window pair must be disjoint."

  - entity: Certification
    initial_state: SUBMITTED
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /certifications/{id}/start-review"
        actor: ComplianceOfficer
        preconditions: ["Certification.status == SUBMITTED"]
        side_effects: ["increments Certification.version by 1"]
      - from: REMEDIATION_SUBMITTED
        to: IN_REVIEW
        trigger: "POST /certifications/{id}/start-review"
        actor: ComplianceOfficer
        preconditions: ["Certification.status == REMEDIATION_SUBMITTED"]
        side_effects: ["increments Certification.version by 1"]
      - from: IN_REVIEW
        to: CERTIFIED
        trigger: "POST /certifications/{id}/decide with decision CERTIFY"
        actor: ComplianceOfficer
        preconditions: ["Certification.status == IN_REVIEW", "content_score >= CERT_CONTENT_PASS and connectivity_score >= CERT_CONNECTIVITY_PASS"]
        side_effects:
          - "stores content_score, connectivity_score, decision, reviewed_by_user_id"
          - "sets expires_at to the logical clock instant plus CERT_FULL_VALIDITY_DAYS"
          - "drives Supplier PENDING_CERT -> ACTIVE and sets Supplier.certification_level to CERTIFIED"
          - "increments Certification.version by 1"
      - from: IN_REVIEW
        to: PROVISIONAL
        trigger: "POST /certifications/{id}/decide with decision PROVISIONAL"
        actor: ComplianceOfficer
        preconditions: ["Certification.status == IN_REVIEW"]
        side_effects:
          - "stores content_score, connectivity_score, decision, reviewed_by_user_id"
          - "sets expires_at to the logical clock instant plus CERT_PROVISIONAL_VALIDITY_DAYS"
          - "drives Supplier PENDING_CERT -> ACTIVE and sets Supplier.certification_level to PROVISIONAL"
          - "increments Certification.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /certifications/{id}/decide with decision REJECT"
        actor: ComplianceOfficer
        preconditions: ["Certification.status == IN_REVIEW"]
        side_effects: ["stores scores, decision REJECT and reviewed_by_user_id", "leaves Supplier.certification_level unchanged", "increments Certification.version by 1"]
      - from: REJECTED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /certifications/{id}/remediate"
        actor: SupplierUser
        preconditions: ["Certification.status == REJECTED", "Certification.remediation_rounds < CERT_MAX_REMEDIATION_ROUNDS"]
        side_effects: ["increments remediation_rounds by 1", "replaces sample_payload_ref", "increments Certification.version by 1"]
        note: "REJECTED -> REMEDIATION_SUBMITTED -> IN_REVIEW -> REJECTED is the review cycle; the round counter bounds it."
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc when expires_at <= the new logical clock instant"
        actor: system
        preconditions: ["Certification.status IN {CERTIFIED, PROVISIONAL}", "expires_at <= new logical clock instant"]
        side_effects:
          - "cascade hop 1: drives Supplier ACTIVE -> SUSPENDED with suspension_reason CERTIFICATION_EXPIRED"
          - "increments Certification.version by 1"
      - from: PROVISIONAL
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc when expires_at <= the new logical clock instant"
        actor: system
        preconditions: ["Certification.status IN {CERTIFIED, PROVISIONAL}", "expires_at <= new logical clock instant"]
        side_effects:
          - "cascade hop 1: drives Supplier ACTIVE -> SUSPENDED with suspension_reason CERTIFICATION_EXPIRED"
          - "increments Certification.version by 1"
      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /certifications/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: ["Certification.status IN {CERTIFIED, PROVISIONAL}"]
        side_effects:
          - "stores revocation_reason"
          - "cascade hop 1: drives Supplier ACTIVE -> SUSPENDED with suspension_reason CERTIFICATION_REVOKED, which itself suppresses the supplier's LIVE offers (hop 2), which itself withdraws or de-prices every Package holding those offers (hop 3 and hop 4)"
          - "increments Certification.version by 1"
      - from: PROVISIONAL
        to: REVOKED
        trigger: "POST /certifications/{id}/revoke"
        actor: ComplianceOfficer
        preconditions: ["Certification.status IN {CERTIFIED, PROVISIONAL}"]
        side_effects: ["same cascade as CERTIFIED -> REVOKED", "increments Certification.version by 1"]

  - entity: RatePlan
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: PARITY_HOLD
        trigger: "POST /parity-cases/{id}/escalate"
        actor: system
        preconditions: ["ParityCase.rate_plan_id == this RatePlan.id", "RatePlan.status == ACTIVE"]
        side_effects:
          - "stores parity_hold_case_id"
          - "cascade hop 3: every Offer of this plan with status LIVE moves to SUPPRESSED with suppression_reason PARITY_HOLD"
          - "increments RatePlan.version by 1"
      - from: PARITY_HOLD
        to: ACTIVE
        trigger: "POST /rate-plans/{id}/release-parity-hold"
        actor: ComplianceOfficer
        preconditions: ["RatePlan.status == PARITY_HOLD", "the ParityCase named by parity_hold_case_id has status IN {RESOLVED_COMPLIANT, WAIVED}"]
        side_effects: ["clears parity_hold_case_id", "increments RatePlan.version by 1"]
        note: "ACTIVE -> PARITY_HOLD -> ACTIVE is a cycle; suppressed offers are not automatically republished."
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /rate-plans/{id}/archive, or the Supplier OFFBOARDED cascade"
        actor: CommercialManager | system
        preconditions: ["no Offer of this plan has status LIVE"]
        side_effects: ["every Offer of this plan with status PENDING moves to CLOSED", "increments RatePlan.version by 1"]

  - entity: Offer
    initial_state: PENDING
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: LIVE
        trigger: "POST /offers/{id}/publish"
        actor: SupplierUser
        preconditions:
          - "Supplier.certification_level IN {PROVISIONAL, CERTIFIED}"
          - "Supplier.visibility_status == ACTIVE"
          - "RatePlan.status == ACTIVE"
          - "a ModelAgreement of the supplier with status ACTIVE covers Offer.travel_date"
        side_effects: ["increments Offer.version by 1"]
      - from: SUPPRESSED
        to: LIVE
        trigger: "POST /offers/{id}/publish"
        actor: SupplierUser
        preconditions: ["same four cross-entity preconditions as PENDING -> LIVE"]
        side_effects: ["clears suppression_reason", "increments Offer.version by 1"]
        note: "LIVE -> SUPPRESSED -> LIVE is a cycle driven by the same publish endpoint."
      - from: LIVE
        to: SUPPRESSED
        trigger: "POST /offers/{id}/suppress, or the Supplier SUSPENDED cascade, or the RatePlan PARITY_HOLD cascade"
        actor: ComplianceOfficer | system
        preconditions: ["Offer.status == LIVE"]
        side_effects:
          - "stores suppression_reason"
          - "cascade hop 3: every Package with status PUBLISHED holding this offer moves to WITHDRAWN with withdrawal reason COMPONENT_SUPPRESSED; every Package with status PRICED holding it returns to DRAFT and its pricing fields are cleared (hop 4)"
          - "increments Offer.version by 1"
      - from: LIVE
        to: CLOSED
        trigger: "POST /offers/{id}/close-out"
        actor: SupplierUser
        preconditions: ["Offer.status == LIVE", "Offer.allotment_held == 0"]
        side_effects: ["increments Offer.version by 1"]
      - from: SUPPRESSED
        to: CLOSED
        trigger: "POST /offers/{id}/close-out, or the Supplier OFFBOARDED cascade"
        actor: SupplierUser | system
        preconditions: ["Offer.status == SUPPRESSED", "Offer.allotment_held == 0"]
        side_effects: ["increments Offer.version by 1"]
      - from: PENDING
        to: CLOSED
        trigger: "POST /offers/{id}/close-out, or the RatePlan ARCHIVED cascade, or the Supplier OFFBOARDED cascade"
        actor: SupplierUser | system
        preconditions: ["Offer.status == PENDING"]
        side_effects: ["increments Offer.version by 1"]
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /rate-plans/{id}/offers creating a newer offer for the same travel_date"
        actor: system
        preconditions: ["the prior offer's status IN {PENDING, LIVE, SUPPRESSED}", "the prior offer's allotment_held == 0 and allotment_sold == 0"]
        side_effects: ["increments Offer.version by 1"]
      - from: LIVE
        to: SUPERSEDED
        trigger: "POST /rate-plans/{id}/offers creating a newer offer for the same travel_date"
        actor: system
        preconditions: ["the prior offer's allotment_held == 0 and allotment_sold == 0"]
        side_effects: ["the successor offer starts at PENDING and must be published separately", "increments Offer.version by 1"]

  - entity: ParityCase
    initial_state: OPEN
    terminal_states: [RESOLVED_COMPLIANT, WAIVED]
    transitions:
      - from: OPEN
        to: SUPPLIER_NOTIFIED
        trigger: "POST /parity-cases/{id}/notify-supplier"
        actor: ParityAnalyst
        preconditions: ["ParityCase.status IN {OPEN, SUPPLIER_RESPONDED}", "ParityCase.notify_rounds < PARITY_MAX_NOTIFY_ROUNDS"]
        side_effects: ["increments notify_rounds by 1", "increments ParityCase.version by 1"]
      - from: SUPPLIER_NOTIFIED
        to: SUPPLIER_RESPONDED
        trigger: "POST /parity-cases/{id}/respond"
        actor: SupplierUser
        preconditions: ["ParityCase.status == SUPPLIER_NOTIFIED", "X-User-ID == the Supplier that owns ParityCase.rate_plan_id"]
        side_effects: ["stores supplier_response_code", "increments ParityCase.version by 1"]
      - from: SUPPLIER_RESPONDED
        to: SUPPLIER_NOTIFIED
        trigger: "POST /parity-cases/{id}/notify-supplier"
        actor: ParityAnalyst
        preconditions: ["ParityCase.status == SUPPLIER_RESPONDED", "ParityCase.notify_rounds < PARITY_MAX_NOTIFY_ROUNDS"]
        side_effects: ["increments notify_rounds by 1", "increments ParityCase.version by 1"]
        note: "SUPPLIER_NOTIFIED -> SUPPLIER_RESPONDED -> SUPPLIER_NOTIFIED is the negotiation cycle bounded by PARITY_MAX_NOTIFY_ROUNDS."
      - from: SUPPLIER_RESPONDED
        to: ESCALATED
        trigger: "POST /parity-cases/{id}/escalate"
        actor: ComplianceOfficer
        preconditions: ["ParityCase.status IN {SUPPLIER_NOTIFIED, SUPPLIER_RESPONDED}", "ParityCase.severity IN {MAJOR, SEVERE}"]
        side_effects:
          - "stamps escalated_at from the logical clock"
          - "cascade hop 2: increments Supplier.parity_strikes by 1 and drives RatePlan ACTIVE -> PARITY_HOLD, which itself suppresses that plan's LIVE offers (hop 3), which itself withdraws PUBLISHED packages holding them (hop 4)"
          - "increments ParityCase.version by 1"
      - from: SUPPLIER_NOTIFIED
        to: ESCALATED
        trigger: "POST /parity-cases/{id}/escalate"
        actor: ComplianceOfficer
        preconditions: ["ParityCase.status IN {SUPPLIER_NOTIFIED, SUPPLIER_RESPONDED}", "ParityCase.severity IN {MAJOR, SEVERE}"]
        side_effects: ["same cascade as SUPPLIER_RESPONDED -> ESCALATED", "increments ParityCase.version by 1"]
      - from: SUPPLIER_RESPONDED
        to: RESOLVED_COMPLIANT
        trigger: "POST /parity-cases/{id}/close with outcome COMPLIANT"
        actor: ParityAnalyst | ComplianceOfficer
        preconditions: ["ParityCase.status IN {OPEN, SUPPLIER_NOTIFIED, SUPPLIER_RESPONDED, ESCALATED}"]
        side_effects: ["stores close_outcome COMPLIANT and closed_by_user_id", "increments ParityCase.version by 1"]
      - from: ESCALATED
        to: RESOLVED_COMPLIANT
        trigger: "POST /parity-cases/{id}/close with outcome COMPLIANT"
        actor: ParityAnalyst | ComplianceOfficer
        preconditions: ["ParityCase.status == ESCALATED"]
        side_effects: ["stores close_outcome COMPLIANT and closed_by_user_id", "increments ParityCase.version by 1"]
        note: "Closing an escalated case does not itself release the RatePlan hold; POST /rate-plans/{id}/release-parity-hold does."
      - from: OPEN
        to: RESOLVED_COMPLIANT
        trigger: "POST /parity-cases/{id}/close with outcome COMPLIANT"
        actor: ParityAnalyst | ComplianceOfficer
        preconditions: ["ParityCase.status == OPEN"]
        side_effects: ["stores close_outcome COMPLIANT and closed_by_user_id", "increments ParityCase.version by 1"]
      - from: SUPPLIER_NOTIFIED
        to: WAIVED
        trigger: "POST /parity-cases/{id}/close with outcome WAIVED"
        actor: ComplianceOfficer
        preconditions: ["ParityCase.status IN {OPEN, SUPPLIER_NOTIFIED, SUPPLIER_RESPONDED, ESCALATED}", "X-User-Role == ComplianceOfficer", "X-User-ID != ParityCase.opened_by_user_id"]
        side_effects: ["stores close_outcome WAIVED and closed_by_user_id", "increments ParityCase.version by 1"]

  - entity: CommissionOverride
    initial_state: PROPOSED
    terminal_states: [REJECTED, REVOKED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /commission-overrides/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "CommissionOverride.status == PROPOSED"
          - "X-User-ID != CommissionOverride.proposed_by_user_id"
          - "a ModelAgreement of the supplier with status ACTIVE covers effective_from"
          - "override_type is compatible with that agreement's model (COMMISSION_PCT requires AGENCY, MARKUP_PCT requires MERCHANT, FLAT_FEE_CENTS accepts either)"
        side_effects:
          - "stores approved_by_user_id"
          - "every Offer with status PENDING whose rate_plan is in this override's scope and whose travel_date falls inside [effective_from, effective_to] is repriced by offer_sell_price and its applied_override_id, applied_rate_pct, gross_cents, taxes_fees_cents, display_total_cents, marketplace_margin_cents and supplier_payable_cents are refreshed"
          - "increments CommissionOverride.version by 1 and the version of every repriced Offer by 1"
        note: "Offers already LIVE keep the pricing pinned at their creation; only PENDING offers reprice."
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /commission-overrides/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["CommissionOverride.status == PROPOSED", "X-User-ID != CommissionOverride.proposed_by_user_id"]
        side_effects: ["stores rejection_reason", "increments CommissionOverride.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc when effective_to < the new logical clock date"
        actor: system
        preconditions: ["CommissionOverride.status == ACTIVE", "effective_to < new logical clock date"]
        side_effects: ["increments CommissionOverride.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /commission-overrides/{id}/reject on an ACTIVE override"
        actor: ComplianceOfficer
        preconditions: ["CommissionOverride.status == ACTIVE", "X-User-ID != CommissionOverride.proposed_by_user_id"]
        side_effects: ["stores rejection_reason", "increments CommissionOverride.version by 1"]

  - entity: PlacementAgreement
    initial_state: PROPOSED
    terminal_states: [REJECTED, CANCELLED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /placement-agreements/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "PlacementAgreement.status == PROPOSED"
          - "X-User-ID != PlacementAgreement.proposed_by_user_id"
          - "Supplier.visibility_status == ACTIVE"
          - "placement_slot_capacity leaves room on every date in [window_start, window_end) (see validations priority 15)"
        side_effects: ["stores approved_by_user_id", "increments PlacementAgreement.version by 1"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /placement-agreements/{id}/cancel on a PROPOSED agreement"
        actor: CommercialManager | PlatformAdmin
        preconditions: ["PlacementAgreement.status == PROPOSED"]
        side_effects: ["stores cancellation_reason", "increments PlacementAgreement.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /placement-agreements/{id}/cancel on an ACTIVE agreement"
        actor: CommercialManager | PlatformAdmin
        preconditions: ["PlacementAgreement.status == ACTIVE"]
        side_effects:
          - "stores cancellation_reason"
          - "RankingEntry rows already produced keep their boost_points_applied and disclosure_label; a run that still holds such a row can no longer be published (see validations priority 25)"
          - "increments PlacementAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc when window_end <= the new logical clock date"
        actor: system
        preconditions: ["PlacementAgreement.status == ACTIVE", "window_end <= new logical clock date"]
        side_effects: ["increments PlacementAgreement.version by 1"]

  - entity: RankingRun
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /ranking-runs/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "RankingRun.status == DRAFT"
          - "Market.ranking_disclosure_required == false OR RankingRun.disclosure_version is non-null"
          - "every RankingEntry with is_paid_placement true references a PlacementAgreement whose status is ACTIVE"
        side_effects: ["stamps published_at and published_by_user_id", "increments RankingRun.version by 1"]
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /ranking-runs/{id}/withdraw, or the Offer LIVE -> SUPPRESSED cascade when a ranked offer is suppressed"
        actor: ComplianceOfficer | system
        preconditions: ["RankingRun.status == PUBLISHED"]
        side_effects: ["stores withdrawal_reason", "increments RankingRun.version by 1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /ranking-runs/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions: ["RankingRun.status == DRAFT"]
        side_effects: ["stores withdrawal_reason", "increments RankingRun.version by 1"]

  - entity: Package
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /packages/{id}/price"
        actor: CommercialManager
        preconditions:
          - "Package.status IN {DRAFT, PRICED}"
          - "component_count >= 2 with at least one AIR and at least one HOTEL component"
          - "every component Offer has status LIVE and travel_date == Package.travel_date"
          - "expected_package_version matches Package.version"
        side_effects:
          - "runs package_pricing_and_allocation and writes components_subtotal_cents, discount_pct, discount_cents, package_total_cents, priced_at"
          - "writes display_total_snapshot_cents, discount_alloc_cents and allocated_cents on every PackageComponent"
          - "increments Package.version by 1"
      - from: PRICED
        to: PRICED
        trigger: "POST /packages/{id}/price on an already priced package"
        actor: CommercialManager
        preconditions: ["same as DRAFT -> PRICED"]
        side_effects: ["re-runs the pricing calculation and overwrites the snapshots", "increments Package.version by 1"]
      - from: PRICED
        to: DRAFT
        trigger: "POST /packages/{id}/components adding another leg, or the Offer LIVE -> SUPPRESSED cascade hop 4"
        actor: CommercialManager | system
        preconditions: ["Package.status == PRICED"]
        side_effects:
          - "clears components_subtotal_cents, discount_pct, discount_cents, package_total_cents and priced_at"
          - "clears display_total_snapshot_cents, discount_alloc_cents and allocated_cents on every PackageComponent"
          - "increments Package.version by 1"
        note: "PRICED -> DRAFT -> PRICED is a cycle; every component change invalidates the frozen snapshots."
      - from: PRICED
        to: PUBLISHED
        trigger: "POST /packages/{id}/publish"
        actor: CommercialManager
        preconditions:
          - "Package.status == PRICED"
          - "every component Offer still has status LIVE"
          - "reveal_supplier_names == false whenever Package.opaque == true"
        side_effects: ["stores reveal_supplier_names", "increments Package.version by 1"]
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /packages/{id}/withdraw, or the Offer LIVE -> SUPPRESSED cascade hop 3"
        actor: CommercialManager | system
        preconditions: ["Package.status == PUBLISHED"]
        side_effects: ["clears reveal_supplier_names back to false", "increments Package.version by 1"]

  - entity: Booking
    initial_state: "AUTHORIZED + RESERVED"
    terminal_states: ["REFUNDED_FULL + CANCELLED", "CAPTURED + COMPLETED", "CHARGEBACK + COMPLETED"]
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /bookings/{id}/capture"
        actor: BookingAgent
        preconditions: ["Booking.payment_status == AUTHORIZED", "Booking.fulfillment_status != CANCELLED"]
        side_effects: ["increments Booking.version by 1"]
        note: "Payment dimension. fulfillment_status is untouched, which is what makes the two dimensions parallel."
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: SupplierUser
        preconditions: ["Booking.fulfillment_status == RESERVED", "X-User-ID == the Supplier that owns the booked inventory", "Booking.payment_status IN {AUTHORIZED, CAPTURED}"]
        side_effects:
          - "stores supplier_confirmation_code"
          - "on every booked Offer: decrements allotment_held by 1 and increments allotment_sold by 1, leaving allotment_total = allotment_remaining + allotment_held + allotment_sold unchanged"
          - "increments Booking.version by 1 and the version of every touched Offer by 1"
        note: "Fulfillment dimension. payment_status is untouched."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: SupplierUser
        preconditions: ["Booking.fulfillment_status == CONFIRMED", "the logical clock is at or after Booking.arrival_at", "Booking.payment_status IN {CAPTURED, CHARGEBACK, REFUNDED_PARTIAL}"]
        side_effects: ["increments Booking.version by 1"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: BookingAgent
        preconditions: ["Booking.fulfillment_status IN {RESERVED, CONFIRMED}"]
        side_effects:
          - "runs refund_passthrough_due and writes cancellation_refund_pct, refunded_cents, last_refund_clawback_cents, last_refund_supplier_debit_cents, last_refund_tax_cents and the three retained components"
          - "moves payment_status to REFUNDED_FULL when cancellation_refund_pct == 1.00, to REFUNDED_PARTIAL when 0 < cancellation_refund_pct < 1, and leaves it unchanged when cancellation_refund_pct == 0"
          - "returns inventory: decrements allotment_held (from RESERVED) or allotment_sold (from CONFIRMED) by 1 and increments allotment_remaining by 1"
          - "stamps cancelled_at and increments Booking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: BookingAgent
        preconditions: ["Booking.fulfillment_status IN {RESERVED, CONFIRMED}", "Booking.payment_status != CHARGEBACK"]
        side_effects: ["same refund and inventory side effects as RESERVED -> CANCELLED", "increments Booking.version by 1"]
      - from: CAPTURED
        to: CHARGEBACK
        trigger: "POST /_payments/simulate-chargeback"
        actor: PlatformAdmin
        preconditions: ["Booking.payment_status == CAPTURED"]
        side_effects: ["increments Booking.version by 1"]
        note: "Payment dimension only; the traveler's stay may still be CONFIRMED or COMPLETED."
      - from: REFUNDED_PARTIAL
        to: CAPTURED
        trigger: "POST /dispute-cases/{id}/resolve with outcome REVERSE_REFUND"
        actor: ComplianceOfficer
        preconditions: ["Booking.payment_status IN {REFUNDED_PARTIAL, REFUNDED_FULL}", "Booking.refunded_cents > 0"]
        side_effects:
          - "compensating action: refunded_cents returns to 0 and last_refund_clawback_cents, last_refund_supplier_debit_cents and last_refund_tax_cents are added back to marketplace_margin_cents, supplier_payable_cents and taxes_fees_cents respectively, then all three last_refund_* fields reset to 0"
          - "increments Booking.version by 1"
      - from: REFUNDED_FULL
        to: CAPTURED
        trigger: "POST /dispute-cases/{id}/resolve with outcome REVERSE_REFUND"
        actor: ComplianceOfficer
        preconditions: ["Booking.payment_status IN {REFUNDED_PARTIAL, REFUNDED_FULL}", "Booking.refunded_cents > 0"]
        side_effects: ["same compensating restoration as REFUNDED_PARTIAL -> CAPTURED", "increments Booking.version by 1"]

  - entity: DisputeCase
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: FILED
        to: RESPONSE_REQUESTED
        trigger: "POST /dispute-cases/{id}/request-response"
        actor: ComplianceOfficer
        preconditions: ["DisputeCase.status IN {FILED, MEDIATION}", "DisputeCase.mediation_rounds < DISPUTE_MAX_ROUNDS"]
        side_effects: ["increments mediation_rounds by 1", "increments DisputeCase.version by 1"]
      - from: MEDIATION
        to: RESPONSE_REQUESTED
        trigger: "POST /dispute-cases/{id}/request-response"
        actor: ComplianceOfficer
        preconditions: ["DisputeCase.status IN {FILED, MEDIATION}", "DisputeCase.mediation_rounds < DISPUTE_MAX_ROUNDS"]
        side_effects: ["increments mediation_rounds by 1", "increments DisputeCase.version by 1"]
        note: "RESPONSE_REQUESTED -> MEDIATION -> RESPONSE_REQUESTED is the mediation cycle bounded by DISPUTE_MAX_ROUNDS."
      - from: RESPONSE_REQUESTED
        to: MEDIATION
        trigger: "POST /dispute-cases/{id}/respond"
        actor: SupplierUser
        preconditions: ["DisputeCase.status == RESPONSE_REQUESTED", "X-User-ID == DisputeCase.supplier_id"]
        side_effects: ["stores supplier_position", "increments DisputeCase.version by 1"]
      - from: MEDIATION
        to: RESOLVED
        trigger: "POST /dispute-cases/{id}/resolve"
        actor: ComplianceOfficer
        preconditions: ["DisputeCase.status IN {FILED, RESPONSE_REQUESTED, MEDIATION}", "X-User-ID != DisputeCase.filed_by_user_id"]
        side_effects:
          - "runs dispute_liability_split in its BINDING variant and writes binding_agreement_id, uncapped_marketplace_cents, binding_marketplace_cents, binding_supplier_cents and outcome"
          - "when outcome is REVERSE_REFUND, drives the Booking payment dimension REFUNDED_PARTIAL or REFUNDED_FULL -> CAPTURED and restores the three retained components"
          - "stores resolved_by_user_id and increments DisputeCase.version by 1"
      - from: FILED
        to: RESOLVED
        trigger: "POST /dispute-cases/{id}/resolve"
        actor: ComplianceOfficer
        preconditions: ["DisputeCase.status IN {FILED, RESPONSE_REQUESTED, MEDIATION}", "X-User-ID != DisputeCase.filed_by_user_id"]
        side_effects: ["same as MEDIATION -> RESOLVED", "increments DisputeCase.version by 1"]
      - from: RESPONSE_REQUESTED
        to: RESOLVED
        trigger: "POST /dispute-cases/{id}/resolve"
        actor: ComplianceOfficer
        preconditions: ["DisputeCase.status IN {FILED, RESPONSE_REQUESTED, MEDIATION}", "X-User-ID != DisputeCase.filed_by_user_id"]
        side_effects: ["same as MEDIATION -> RESOLVED", "increments DisputeCase.version by 1"]

  - entity: SupplierScorecard
    initial_state: PROVISIONAL
    terminal_states: [FINAL]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /scorecards/{id}/finalize"
        actor: ComplianceOfficer
        preconditions: ["SupplierScorecard.variant == PROVISIONAL", "the logical clock date is strictly after SupplierScorecard.period_end"]
        side_effects:
          - "re-runs supplier_composite_score in its FINAL variant and overwrites parity_penalty_points, parity_component, dispute_component, composite_score and cases_counted"
          - "stores finalized_by_user_id and increments SupplierScorecard.version by 1"

# --- §1.2.1 Concurrency Rules -------------------------------------------------
concurrency_rules:
  - rule_id: offer-create-stale-rate-plan
    parent_entity: RatePlan
    write_endpoint: "POST /rate-plans/{id}/offers"
    occ_field: "expected_rate_plan_version"
    description: |
      Creating an Offer against a RatePlan whose version has advanced since the
      client last read it is rejected. Rate ingestion legitimately supersedes the
      prior offer for the same travel_date, so a writer holding a stale view of
      the plan would silently replace inventory it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: package-price-stale-package
    parent_entity: Package
    write_endpoint: "POST /packages/{id}/price"
    occ_field: "expected_package_version"
    description: |
      Pricing a Package whose version has advanced since the client last read it
      is rejected. Repricing legitimately overwrites the frozen component
      snapshots, so a writer that has not observed a newly attached component
      would publish an allocation over the wrong component set.
    error_id: ERR_STALE_VERSION
    http_status: 412

# --- §1.3 Calculation Rules Table --------------------------------------------
calculations:

  - name: offer_sell_price
    trigger: "POST /rate-plans/{id}/offers (offer creation), and re-run on every PENDING offer in scope when POST /commission-overrides/{id}/approve moves an override PROPOSED -> ACTIVE"
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: resolve the governing ModelAgreement (no ambiguity: windows are disjoint) ----
      A = the ModelAgreement with supplier_id == rate_plan.supplier_id, status == ACTIVE and
          effective_from <= offer.travel_date <= coalesce(effective_to, "9999-12-31")
      if A is null: reject with ERR_AGREEMENT_NOT_ACTIVE
      offer.pricing_model = A.model
      # ---- step 2: selector — resolve the rate percentage / flat fee ----
      candidates = CommissionOverride rows where
            status == ACTIVE
        AND supplier_id == rate_plan.supplier_id
        AND (rate_plan_id == rate_plan.id OR rate_plan_id IS NULL)
        AND effective_from <= offer.travel_date <= effective_to
        AND override_type is compatible with A.model
            (COMMISSION_PCT only when A.model == AGENCY, MARKUP_PCT only when A.model == MERCHANT,
             FLAT_FEE_CENTS with either model)
      ranking expression over candidates, applied in this exact order:
        1. plan-scoped rows (rate_plan_id IS NOT NULL) rank above supplier-wide rows (rate_plan_id IS NULL)
        2. within the same scope, higher `value` ranks first
        3. tie-break: earliest created_at (ASC) wins; `id` is never consulted
      if candidates is empty:
        offer.applied_override_id = null
        offer.applied_rate_pct = (A.model == MERCHANT ? A.base_markup_pct : A.base_commission_pct)
        eff_type = (A.model == MERCHANT ? "MARKUP_PCT" : "COMMISSION_PCT")
      else:
        w = candidates[0]; offer.applied_override_id = w.id; offer.applied_rate_pct = w.value; eff_type = w.override_type
      # ---- step 3: gross and margin (evaluation order is pinned: gross first, margin second) ----
      if A.model == MERCHANT:
          if eff_type == "FLAT_FEE_CENTS":
              gross_cents = net_rate_cents + int(applied_rate_pct)
          else:
              # grossing-up on the sell price, NOT net * (1 + pct)
              gross_cents = ceil_to_int(net_rate_cents / (1 - applied_rate_pct))
          marketplace_margin_cents = gross_cents - net_rate_cents
      else:   # AGENCY — the supplier publishes the sell rate, marketplace earns commission out of it
          gross_cents = net_rate_cents
          if eff_type == "FLAT_FEE_CENTS":
              marketplace_margin_cents = int(applied_rate_pct)
          else:
              marketplace_margin_cents = round_half_up(net_rate_cents * applied_rate_pct)
      # ---- step 4: regulated total price display ----
      taxes_fees_cents   = round_half_up(gross_cents * rate_plan.tax_fee_pct)
      display_total_cents = gross_cents + taxes_fees_cents
      supplier_payable_cents = gross_cents - marketplace_margin_cents
      # invariant: display_total_cents == supplier_payable_cents + marketplace_margin_cents + taxes_fees_cents
    input_set: "Exactly one ModelAgreement (status ACTIVE, window covering travel_date) and zero or more CommissionOverride rows with status ACTIVE covering travel_date; PROPOSED, REJECTED, REVOKED and EXPIRED overrides are excluded."
    constants:
      MERCHANT_GROSS_UP_ROUNDING: ceil_to_int
      MAX_MARKUP_PCT: 0.5
    precision: "integer cents; taxes use round_half_up, the MERCHANT gross-up uses ceiling"
    variants:
      - name: merchant_gross_up
        when: "the governing ModelAgreement.model == MERCHANT"
        difference: "gross is derived from net by dividing by (1 - rate) and rounding up, so margin is a share of gross; supplier_payable equals net exactly"
      - name: agency_commission
        when: "the governing ModelAgreement.model == AGENCY"
        difference: "gross equals the supplier-published net, margin is a round_half_up share of it, and supplier_payable is net minus commission"

  - name: parity_breach_bps
    trigger: "POST /rate-plans/{id}/parity-observations"
    algorithm: threshold
    formula: |
      compared = the Offer with rate_plan_id == observation.rate_plan_id, travel_date == observation.travel_date
                 and status == LIVE; when several exist (impossible while supersede rules hold) take the
                 latest created_at, tie-break earliest created_at is not needed
      if compared is null:
          breach_bps = null; severity = "NONE"; parity_case_id = null   # stored, never opens a case
      else:
          breach_bps = round_half_up(
              (compared.display_total_cents - observation.direct_total_cents) * 10000
              / observation.direct_total_cents)
          if breach_bps < PARITY_TOLERANCE_BPS:                     severity = "NONE"
          elif breach_bps < PARITY_MAJOR_BPS:                       severity = "MINOR"
          elif breach_bps < PARITY_SEVERE_BPS:                      severity = "MAJOR"
          else:                                                     severity = "SEVERE"
      # case attachment (only when rate_plan.parity_monitored == true and severity != NONE):
      existing = the ParityCase with rate_plan_id == observation.rate_plan_id,
                 travel_date == observation.travel_date and status NOT IN {RESOLVED_COMPLIANT, WAIVED}
      if existing is null: open a new ParityCase (status OPEN, severity, peak_breach_bps = breach_bps,
                                                  opening_observation_id = this observation)
      else: peak_breach_bps = max(existing.peak_breach_bps, breach_bps) and severity is re-derived from
            peak_breach_bps with the same bands
    input_set: "One LIVE Offer on the same rate_plan_id and travel_date; at most one non-terminal ParityCase per (rate_plan_id, travel_date)."
    constants:
      PARITY_TOLERANCE_BPS: 100
      PARITY_MAJOR_BPS: 300
      PARITY_SEVERE_BPS: 800
    precision: "integer basis points, round_half_up; band comparisons are >= on the lower bound and < on the upper bound"

  - name: package_pricing_and_allocation
    trigger: "POST /packages/{id}/price"
    algorithm: waterfall_allocation
    formula: |
      components = PackageComponent rows of this package, processed in Offer.created_at ASC order
                   (never in id order); each component snapshots display_total_snapshot_cents
                   = its Offer.display_total_cents
      components_subtotal_cents = sum(display_total_snapshot_cents)
      discount_pct = the highest tier in OPAQUE_DISCOUNT_TIERS whose threshold <= components_subtotal_cents
                     (comparison is >= on the threshold)
      # ---- PINNED ROUNDING ORDER: allocate per component with floor, then distribute the remainder ----
      discount_cents = floor(components_subtotal_cents * discount_pct)          # package-level floor
      for each component i (Offer.created_at ASC):
          raw_i   = display_total_snapshot_cents_i * discount_pct
          floor_i = floor(raw_i)
          frac_i  = raw_i - floor_i
      remainder = discount_cents - sum(floor_i)                                  # 0 <= remainder < n
      distribute one extra cent to the `remainder` components with the largest frac_i,
          tie-break: earliest Offer.created_at first
      discount_alloc_cents_i = floor_i + (1 if component i received a remainder cent else 0)
      allocated_cents_i      = display_total_snapshot_cents_i - discount_alloc_cents_i
      package_total_cents    = components_subtotal_cents - discount_cents
      # invariant: sum(allocated_cents_i) == package_total_cents and sum(discount_alloc_cents_i) == discount_cents
      # REJECTED reading: rounding each raw_i with round_half_up (or prorating the rounded package total
      # back over the components) makes sum(discount_alloc_cents_i) differ from discount_cents by one or
      # more cents and produces a different package_total_cents.
    input_set: "Every PackageComponent of the package; each component's Offer must be LIVE with travel_date == Package.travel_date."
    constants:
      OPAQUE_DISCOUNT_TIERS: "[[0, 0.00], [100000, 0.06], [300000, 0.09], [600000, 0.12]]"
      MIN_COMPONENTS: 2
    precision: "integer cents; package discount uses floor, per-component allocation uses floor plus largest-remainder distribution"

  - name: refund_passthrough_due
    trigger: "POST /bookings/{id}/cancel"
    algorithm: threshold
    formula: |
      hours_to_arrival = (booking.arrival_at - logical_clock_now) / 3600 seconds, as an exact rational
      cutoff = rate_plan.free_cancel_cutoff_hours of the booked inventory
               (for a package booking: the HOTEL component's rate plan)
      policy = rate_plan.cancellation_policy_code
      if   policy == "FLEX":     refund_pct = 1.00 if hours_to_arrival >= cutoff else 0.50
      elif policy == "MODERATE": refund_pct = 1.00 if hours_to_arrival >= cutoff
                                              else (0.50 if hours_to_arrival >= 24 else 0.00)
      elif policy == "STRICT":   refund_pct = 0.50 if hours_to_arrival >= cutoff else 0.00
      else:                      refund_pct = 0.00                      # NON_REF
      refund_cents          = round_half_up(booking.charged_total_cents * refund_pct)
      clawback_cents        = round_half_up(booking.marketplace_margin_cents * refund_pct)
      supplier_debit_cents  = round_half_up(booking.supplier_payable_cents * refund_pct)
      tax_refund_cents      = refund_cents - clawback_cents - supplier_debit_cents   # residual, pinned
      # applied to the booking:
      refunded_cents               += refund_cents
      marketplace_margin_cents     -= clawback_cents
      supplier_payable_cents       -= supplier_debit_cents
      taxes_fees_cents             -= tax_refund_cents
      last_refund_clawback_cents       = clawback_cents
      last_refund_supplier_debit_cents = supplier_debit_cents
      last_refund_tax_cents            = tax_refund_cents
      # conserved quantity (must hold before and after):
      #   charged_total_cents == supplier_payable_cents + marketplace_margin_cents
      #                          + taxes_fees_cents + refunded_cents
    input_set: "The booking's own frozen money fields plus the cancellation policy of the booked rate plan; the logical clock supplies `now`."
    constants:
      ARRIVAL_HOUR_UTC: 15
      MODERATE_SECOND_BAND_HOURS: 24
    precision: "integer cents, round_half_up on the three shares; the tax share is the residual so the identity closes exactly"
    variants:
      - name: at_or_before_cutoff
        when: "hours_to_arrival >= free_cancel_cutoff_hours"
        difference: "the most generous band of the policy applies; exactly at the cutoff the generous band still wins because the comparison is >="
      - name: inside_cutoff
        when: "hours_to_arrival < free_cancel_cutoff_hours"
        difference: "the reduced band applies and the retained components stay non-zero"

  - name: dispute_settlement_total
    trigger: "POST /bookings/{id}/dispute-cases (filing)"
    algorithm: constraint_propagation
    formula: |
      # The fee looks circular: the settlement total contains the fee, and the fee rate is chosen from a
      # tier. The evaluation order below is PINNED so the value is well defined; the tier is keyed on
      # refund_due_cents, never on settlement_total_cents.
      step 1: refund_due_cents = min(claim_cents,
                                     booking.charged_total_cents - booking.refunded_cents)
      step 2: mediation_fee_pct = the highest tier in MEDIATION_FEE_TIERS whose threshold
                                  <= refund_due_cents          # keyed on the STEP 1 value
      step 3: mediation_fee_cents = MEDIATION_FEE_BASE_CENTS
                                    + round_half_up(refund_due_cents * mediation_fee_pct)
      step 4: settlement_total_cents = refund_due_cents + mediation_fee_cents
      # REJECTED reading: keying step 2 on settlement_total_cents (which already contains the fee) can
      # select a higher tier and yields a different, order-dependent fee and total.
    input_set: "The filing booking's charged_total_cents and refunded_cents at filing time; no other cases participate."
    constants:
      MEDIATION_FEE_BASE_CENTS: 2500
      MEDIATION_FEE_TIERS: "[[0, 0.020], [50000, 0.035], [200000, 0.050]]"
    precision: "integer cents, round_half_up; tier comparison is >= on the threshold"

  - name: dispute_liability_split
    trigger: "PRELIMINARY at POST /bookings/{id}/dispute-cases; BINDING at POST /dispute-cases/{id}/resolve"
    algorithm: weighted_scoring
    formula: |
      base = dispute_case.settlement_total_cents
      # ---- agreement selection differs per variant (this is the whole point) ----
      filing_agreement  = the ModelAgreement of the booked supplier with status == ACTIVE whose
                          [effective_from, coalesce(effective_to,"9999-12-31")] covers the logical clock DATE
                          at filing; when none covers it, the most recently activated ACTIVE agreement
                          (activated_at DESC, tie-break created_at ASC)
      binding_agreement = the ModelAgreement of the booked supplier with status IN
                          {ACTIVE, SUPERSEDED, TERMINATED} whose window covers the BOOKED travel_date;
                          windows are disjoint so at most one matches; when none matches, filing_agreement
      # ---- PRELIMINARY (stamped at filing, no cap, no outcome) ----
      preliminary_marketplace_cents = round_half_up(base * filing_agreement.chargeback_liability_pct_marketplace)
      preliminary_supplier_cents    = base - preliminary_marketplace_cents
      # ---- BINDING (stamped at resolution: outcome modifier, then the FRAUD cap) ----
      eff_pct = 0.00                                if outcome == "SUPPLIER_LIABLE"
                1.00                                if outcome == "MARKETPLACE_LIABLE"
                binding_agreement.chargeback_liability_pct_marketplace  if outcome == "SPLIT"
                0.00                                if outcome == "REVERSE_REFUND"
      uncapped_marketplace_cents = round_half_up(base * eff_pct)
      if dispute_type == "FRAUD":
          binding_marketplace_cents = min(uncapped_marketplace_cents,
                                          binding_agreement.fraud_liability_cap_cents)
      else:
          binding_marketplace_cents = uncapped_marketplace_cents
      binding_supplier_cents = base - binding_marketplace_cents
    input_set: "Exactly two ModelAgreement rows may participate: the one covering the filing date and the one covering the booked travel date. Cases are never aggregated."
    constants:
      FRAUD_CAP_APPLIES_TO: "marketplace share only"
    precision: "integer cents, round_half_up; the cap is applied after rounding"
    variants:
      - name: preliminary
        when: "stamped at filing time"
        difference: "uses the agreement covering the FILING date, ignores dispute_type caps and ignores the outcome, so it is a forward-looking estimate of the marketplace's exposure"
      - name: binding
        when: "stamped at resolution time"
        difference: "uses the agreement covering the BOOKED TRAVEL DATE, applies the outcome modifier and clamps FRAUD exposure at fraud_liability_cap_cents, so the same settlement total splits differently"

  - name: supplier_composite_score
    trigger: "PROVISIONAL at POST /suppliers/{id}/scorecards; FINAL at POST /scorecards/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      period = [period_start, period_end] inclusive on both ends, compared on the DATE part of created_at
      cases = ParityCase rows whose rate_plan_id belongs to this supplier and whose created_at DATE
              falls inside period
      severity_weight = {"MINOR": 1, "MAJOR": 2, "SEVERE": 4}
      # ---- variant PROVISIONAL: forward-looking ----
      #   every in-period case counts at its CURRENT severity weight, and any case still in a
      #   non-terminal status {OPEN, SUPPLIER_NOTIFIED, SUPPLIER_RESPONDED} adds
      #   PROJECTED_ESCALATION_POINTS on top
      # ---- variant FINAL: chronological ----
      #   only cases whose status is terminal-or-escalated {RESOLVED_COMPLIANT, WAIVED, ESCALATED} count;
      #   WAIVED cases count 0; non-terminal cases are excluded entirely and roll into the next period
      parity_penalty_points = sum over counted cases of their weight (see variant rules)
      parity_component      = max(0, 100 - PARITY_PENALTY_PER_POINT * parity_penalty_points)
      content_component      = supplier.content_score
      connectivity_component = supplier.connectivity_score
      disputes = DisputeCase rows with supplier_id == this supplier whose created_at DATE is in period
                 (PROVISIONAL: all of them, using preliminary_supplier_cents)
                 (FINAL: only status == RESOLVED, using binding_supplier_cents)
      gross_disputed = sum(settlement_total_cents over the counted disputes)
      supplier_liable = sum(preliminary_supplier_cents or binding_supplier_cents per variant)
      dispute_component = 100 - min(100, round_half_up(100 * supplier_liable / max(1, gross_disputed)))
      composite_score = round_half_up(  W_PARITY_SC * parity_component
                                      + W_CONTENT_SC * content_component
                                      + W_CONNECTIVITY_SC * connectivity_component
                                      + W_DISPUTE_SC * dispute_component, 2)
      cases_counted = number of ParityCase rows the active variant counted
    input_set: "ParityCase and DisputeCase rows created inside the inclusive period; the status filter is variant-specific and is the only difference in the inclusion set."
    constants:
      PARITY_PENALTY_PER_POINT: 8
      PROJECTED_ESCALATION_POINTS: 1
      W_PARITY_SC: 0.30
      W_CONTENT_SC: 0.25
      W_CONNECTIVITY_SC: 0.20
      W_DISPUTE_SC: 0.25
    precision: "2 decimal places, round_half_up; components are computed to full precision then weighted once"
    variants:
      - name: provisional
        when: "the scorecard is created while the period may still be open"
        difference: "counts every in-period case including non-terminal ones and adds a projected escalation point to each, and values disputes at their preliminary supplier share"
      - name: final
        when: "the scorecard is finalized after the period has closed"
        difference: "drops non-terminal cases entirely, counts WAIVED cases as zero, and values disputes at their binding supplier share, so the same period scores higher or lower than the provisional run"

  - name: ranking_score
    trigger: "POST /ranking-runs (one RankingEntry per eligible offer)"
    algorithm: weighted_scoring
    formula: |
      # ---- eligibility filter (the candidate set; every clause is an explicit predicate) ----
      candidates = Offer rows where
            Offer.status == "LIVE"
        AND Offer.travel_date == run.travel_date
        AND rate_plan.market_id == run.market_id
        AND rate_plan.status == "ACTIVE"
        AND supplier.visibility_status == "ACTIVE"
        AND supplier.certification_level IN {"PROVISIONAL", "CERTIFIED"}
      if candidates is empty: reject the run with ERR_NO_ELIGIBLE_OFFERS
      min_display = min(display_total_cents over candidates)
      # ---- per-candidate score ----
      price_competitiveness = round_half_up(
            100 * (1 - (display_total_cents - min_display) / min_display), 2)      # 100.00 for the cheapest
      parity_health = max(0, 100 - PARITY_HEALTH_PENALTY * (count of ParityCase rows on this supplier's
            rate plans whose status IN {OPEN, SUPPLIER_NOTIFIED, SUPPLIER_RESPONDED, ESCALATED}))
      organic_score = round_half_up(  W_PRICE * price_competitiveness
                                    + W_CONTENT * supplier.content_score
                                    + W_PARITY * parity_health
                                    + W_CONVERSION * supplier.conversion_index, 2)
      # ---- paid placement ----
      agreements = PlacementAgreement rows with supplier_id == this supplier, market_id == run.market_id,
                   status == "ACTIVE" and window_start <= run.travel_date < window_end   # half-open
      winning_agreement = the agreement with the highest boost_points; tie-break earliest created_at
      boost_points_applied = min(BOOST_CAP_POINTS, sum of boost_points over `agreements`)
      placement_agreement_id = winning_agreement.id when boost_points_applied > 0 else null
      is_paid_placement = boost_points_applied > 0
      disclosure_label = winning_agreement.disclosure_label when is_paid_placement else "ORGANIC"
      final_score = round_half_up(organic_score + boost_points_applied, 2)
      # ---- governed ordering ----
      order by final_score DESC, then organic_score DESC, then Offer.created_at ASC   # `id` is never used
      rank_position = 1-based index in that order
      weights_snapshot = {price: W_PRICE, content: W_CONTENT, parity: W_PARITY, conversion: W_CONVERSION}
    input_set: "Only LIVE offers of ACTIVE, certified suppliers on ACTIVE plans in the run's market and travel date; suppressed, pending, closed and superseded offers never enter the pool."
    constants:
      W_PRICE: 0.40
      W_CONTENT: 0.25
      W_PARITY: 0.20
      W_CONVERSION: 0.15
      BOOST_CAP_POINTS: 15
      PARITY_HEALTH_PENALTY: 10
    precision: "2 decimal places, round_half_up; price_competitiveness is rounded to 2dp BEFORE it is weighted"

  - name: placement_slot_capacity
    trigger: "POST /placement-agreements/{id}/approve"
    algorithm: interval_merge
    formula: |
      # Half-open day intervals with AGGREGATE capacity per market day.
      for each calendar date D in [window_start, window_end)          # window_end itself is excluded
          used_slots(D) = sum(slots) over PlacementAgreement rows where
                             status == "ACTIVE"
                         AND market_id == candidate.market_id
                         AND window_start <= D < window_end
          if used_slots(D) + candidate.slots > market.paid_slot_capacity:
              reject with ERR_PLACEMENT_CAPACITY_EXCEEDED
      # An agreement whose window_start equals another agreement's window_end shares NO date with it and
      # therefore never competes for capacity, which is the opposite of the closed-interval semantics used
      # for ModelAgreement windows (validations priority 14), where touching endpoints do collide.
    input_set: "All PlacementAgreement rows with status ACTIVE in the same market; PROPOSED, REJECTED, CANCELLED and EXPIRED rows never consume capacity."
    constants:
      DAY_GRANULARITY: "UTC calendar date"
    precision: "integer slot counts; the comparison is strict > on the market capacity, so filling capacity exactly is allowed"

# --- §1.4 Validation Rules Table (evaluated in ascending priority order) ------
validations:
  - { priority: 1,  category: auth,      check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,      check: "the acting role appears in the endpoint's roles list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: auth,      check: "when X-User-Role is SupplierUser on a write endpoint, X-User-ID equals the Supplier that owns the target resource (Certification.supplier_id, RatePlan.supplier_id, the Offer's plan owner, the ParityCase plan owner, the booked inventory's supplier, DisputeCase.supplier_id)", error_id: ERR_SUPPLIER_SCOPE_VIOLATION, http_status: 403, applies_to: "all SupplierUser write endpoints; read endpoints are unrestricted" }
  - { priority: 4,  category: existence, check: "every id in the path resolves, validated left to right", error_id: "ERR_MARKET_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_RATE_PLAN_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_PARITY_CASE_NOT_FOUND | ERR_OVERRIDE_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_RANKING_RUN_NOT_FOUND | ERR_RANKING_ENTRY_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_PACKAGE_COMPONENT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_SCORECARD_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND", http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 5,  category: existence, check: "every foreign key supplied in the request body resolves to an existing row", error_id: "the matching ERR_*_NOT_FOUND from priority 4", http_status: 404, applies_to: "POST /suppliers, POST /suppliers/{id}/rate-plans, POST /commission-overrides, POST /placement-agreements, POST /ranking-runs, POST /packages, POST /packages/{id}/components, POST /bookings, POST /_payments/simulate-chargeback" }
  - { priority: 6,  category: business_constraint, check: "every required input field is present, every enum value is a declared member, integers are integers and percentages are within their declared range", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 7,  category: business_constraint, check: "pagination limit is an integer in 1..100 and offset is an integer >= 0", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all list endpoints" }
  - { priority: 8,  category: state, check: "expected_rate_plan_version equals RatePlan.version (POST /rate-plans/{id}/offers) and expected_package_version equals Package.version (POST /packages/{id}/price)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /rate-plans/{id}/offers, POST /packages/{id}/price" }
  - { priority: 9,  category: state, check: "the target resource is in a state the requested transition declares as `from`", error_id: "ERR_AGREEMENT_NOT_DRAFT | ERR_AGREEMENT_NOT_ACTIVE_STATE | ERR_CERT_NOT_REVIEWABLE | ERR_CERT_NOT_REJECTED | ERR_CERT_NOT_DECIDED | ERR_RATE_PLAN_NOT_ON_HOLD | ERR_OFFER_NOT_LIVE | ERR_OFFER_NOT_PUBLISHABLE | ERR_PARITY_CASE_CLOSED | ERR_PARITY_CASE_NOT_NOTIFIED | ERR_PARITY_CASE_NOT_ESCALATABLE | ERR_OVERRIDE_NOT_PENDING | ERR_PLACEMENT_NOT_PROPOSED | ERR_RUN_NOT_DRAFT | ERR_RUN_NOT_PUBLISHED | ERR_PACKAGE_NOT_DRAFT_OR_PRICED | ERR_PACKAGE_NOT_PRICED | ERR_PACKAGE_NOT_PUBLISHED | ERR_BOOKING_ALREADY_CANCELLED | ERR_BOOKING_NOT_RESERVED | ERR_BOOKING_NOT_CONFIRMED | ERR_PAYMENT_NOT_AUTHORIZED | ERR_PAYMENT_NOT_CAPTURED | ERR_DISPUTE_ALREADY_RESOLVED | ERR_DISPUTE_NOT_AWAITING_RESPONSE | ERR_SCORECARD_ALREADY_FINAL | ERR_SUPPLIER_NOT_SUSPENDED | ERR_SUPPLIER_OFFBOARDED", http_status: 409, applies_to: "every state-transition endpoint" }
  - { priority: 10, category: business_safety, check: "the approving or resolving X-User-ID differs from the proposing or filing X-User-ID (ModelAgreement.activate, CommissionOverride.approve and reject, PlacementAgreement.approve, DisputeCase.resolve, and ParityCase.close with outcome WAIVED which additionally requires X-User-Role ComplianceOfficer)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /model-agreements/{id}/activate, POST /commission-overrides/{id}/approve, POST /commission-overrides/{id}/reject, POST /placement-agreements/{id}/approve, POST /dispute-cases/{id}/resolve, POST /parity-cases/{id}/close" }
  - { priority: 11, category: business_safety, check: "when Market.ranking_disclosure_required is true the run's disclosure_version is non-null", error_id: ERR_DISCLOSURE_MISSING, http_status: 422, applies_to: "POST /ranking-runs/{id}/publish" }
  - { priority: 12, category: business_safety, check: "reveal_supplier_names is false whenever Package.opaque is true", error_id: ERR_OPAQUE_DISCLOSURE_FORBIDDEN, http_status: 422, applies_to: "POST /packages/{id}/publish" }
  - { priority: 13, category: business_safety, check: "the offer's supplier has certification_level IN {PROVISIONAL, CERTIFIED} and visibility_status ACTIVE", error_id: ERR_SUPPLIER_NOT_CERTIFIED, http_status: 422, applies_to: "POST /offers/{id}/publish" }
  - { priority: 14, category: business_temporal, check: "no other ModelAgreement of the same supplier with status ACTIVE has a CLOSED interval [effective_from, coalesce(effective_to,'9999-12-31')] intersecting the candidate's; touching endpoints (new.effective_from == existing.effective_to) DO intersect; the single exemption is an existing ACTIVE agreement whose effective_from equals the candidate's effective_from, which is moved to SUPERSEDED instead", error_id: ERR_MODEL_AGREEMENT_OVERLAP, http_status: 409, applies_to: "POST /model-agreements/{id}/activate" }
  - { priority: 15, category: business_temporal, check: "placement_slot_capacity leaves room on every date of the HALF-OPEN window [window_start, window_end); an agreement whose window_start equals another's window_end never collides", error_id: ERR_PLACEMENT_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /placement-agreements/{id}/approve" }
  - { priority: 16, category: business_temporal, check: "travel_date is on or after the logical clock date and no later than the logical clock date plus MAX_HORIZON_DAYS (500)", error_id: ERR_TRAVEL_DATE_OUT_OF_RANGE, http_status: 422, applies_to: "POST /rate-plans/{id}/offers, POST /packages, POST /ranking-runs" }
  - { priority: 17, category: business_temporal, check: "the logical clock date is strictly after SupplierScorecard.period_end", error_id: ERR_PERIOD_NOT_CLOSED, http_status: 409, applies_to: "POST /scorecards/{id}/finalize" }
  - { priority: 18, category: business_constraint, check: "ParityCase.notify_rounds < PARITY_MAX_NOTIFY_ROUNDS (3)", error_id: ERR_PARITY_ROUND_LIMIT, http_status: 409, applies_to: "POST /parity-cases/{id}/notify-supplier" }
  - { priority: 19, category: business_constraint, check: "Certification.remediation_rounds < CERT_MAX_REMEDIATION_ROUNDS (3)", error_id: ERR_REMEDIATION_LIMIT, http_status: 409, applies_to: "POST /certifications/{id}/remediate" }
  - { priority: 20, category: business_constraint, check: "DisputeCase.mediation_rounds < DISPUTE_MAX_ROUNDS (3)", error_id: ERR_DISPUTE_ROUND_LIMIT, http_status: 409, applies_to: "POST /dispute-cases/{id}/request-response" }
  - { priority: 21, category: business_constraint, check: "the package holds at least MIN_COMPONENTS (2) components including at least one AIR and at least one HOTEL", error_id: ERR_PACKAGE_COMPONENT_MIX_INVALID, http_status: 422, applies_to: "POST /packages/{id}/price, POST /packages/{id}/publish" }
  - { priority: 22, category: business_constraint, check: "Market.market_code is unique across markets", error_id: ERR_MARKET_CODE_TAKEN, http_status: 409, applies_to: "POST /markets" }
  - { priority: 23, category: business_constraint, check: "exactly one of offer_id and package_id is supplied", error_id: ERR_BOOKING_TARGET_INVALID, http_status: 422, applies_to: "POST /bookings" }
  - { priority: 24, category: business_constraint, check: "the ranking candidate pool produced by ranking_score is non-empty", error_id: ERR_NO_ELIGIBLE_OFFERS, http_status: 422, applies_to: "POST /ranking-runs" }
  - { priority: 25, category: business_referential, check: "every RankingEntry with is_paid_placement true references a PlacementAgreement whose status is still ACTIVE", error_id: ERR_PLACEMENT_NOT_ACTIVE, http_status: 422, applies_to: "POST /ranking-runs/{id}/publish" }
  - { priority: 26, category: business_referential, check: "every component Offer has status LIVE", error_id: ERR_COMPONENT_NOT_LIVE, http_status: 422, applies_to: "POST /packages/{id}/price, POST /packages/{id}/publish" }
  - { priority: 27, category: business_referential, check: "the component Offer's travel_date equals Package.travel_date and its rate plan's market_id equals Package.market_id", error_id: ERR_COMPONENT_DATE_MISMATCH, http_status: 422, applies_to: "POST /packages/{id}/components" }
  - { priority: 28, category: business_referential, check: "a ModelAgreement of the supplier with status ACTIVE covers the offer's travel_date", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 422, applies_to: "POST /rate-plans/{id}/offers, POST /offers/{id}/publish" }
  - { priority: 29, category: business_referential, check: "the override_type matches the governing agreement's model (COMMISSION_PCT requires AGENCY, MARKUP_PCT requires MERCHANT)", error_id: ERR_OVERRIDE_MODEL_MISMATCH, http_status: 422, applies_to: "POST /commission-overrides/{id}/approve" }
  - { priority: 30, category: business_referential, check: "a dispute with dispute_type CHARGEBACK requires Booking.payment_status == CHARGEBACK", error_id: ERR_PAYMENT_NOT_CHARGED_BACK, http_status: 409, applies_to: "POST /bookings/{id}/dispute-cases" }
  - { priority: 31, category: business_fiscal, check: "quoted_total_cents equals the server-computed charged total (Offer.display_total_cents or Package.package_total_cents)", error_id: ERR_PRICE_CHANGED, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 32, category: business_fiscal, check: "every booked Offer has allotment_remaining >= 1", error_id: ERR_ALLOTMENT_EXHAUSTED, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 33, category: business_fiscal, check: "Booking.charged_total_cents - Booking.refunded_cents >= 1 so there is something left to dispute", error_id: ERR_NOTHING_TO_DISPUTE, http_status: 422, applies_to: "POST /bookings/{id}/dispute-cases" }

# --- §1.5 API Endpoint Table -------------------------------------------------
endpoints:
  # ---- test-driving endpoints (/_ namespace) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock to an explicit instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time at any point. Every deadline, expiry window, refund cutoff and scorecard period boundary in this domain is evaluated against this logical clock. Advancing the clock also runs, in this order, the Certification expiry sweep (CERTIFIED/PROVISIONAL -> EXPIRED when expires_at <= the new instant, cascading the owning Supplier to SUSPENDED with suspension_reason CERTIFICATION_EXPIRED and suppressing its LIVE offers), the CommissionOverride expiry sweep (ACTIVE -> EXPIRED when effective_to < the new logical clock date) and the PlacementAgreement expiry sweep (ACTIVE -> EXPIRED when window_end <= the new logical clock date). Moving the clock backwards is allowed and runs no sweep."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "null"
    side_effects:
      - "certification expiry sweep, then supplier suspension cascade, then offer suppression cascade"
      - "commission override expiry sweep"
      - "placement agreement expiry sweep"
      - "increments the version of every entity the sweeps touch by 1"
  - method: POST
    path: "/_payments/simulate-chargeback"
    description: "Drives the acquirer-initiated chargeback that no business actor can trigger: moves a CAPTURED booking's payment_status to CHARGEBACK. The fulfillment dimension is untouched."
    roles: [PlatformAdmin]
    code: 200
    input: [booking_id, reason_code]
    output: Booking
    side_effects: ["Booking.payment_status CAPTURED -> CHARGEBACK", "increments Booking.version by 1"]

  # ---- markets -------------------------------------------------------------
  - method: POST
    path: "/markets"
    description: "Registers a distribution market with its paid-slot capacity, price display mode and ranking-disclosure obligation."
    roles: [PlatformAdmin]
    code: 201
    input: [market_code, name, paid_slot_capacity, price_display_mode, "ranking_disclosure_required?"]
    output: Market
    side_effects: []
  - method: GET
    path: "/markets/{id}"
    description: "Reads one market."
    roles: &all_roles [PlatformAdmin, CommercialManager, ComplianceOfficer, ParityAnalyst, SupplierUser, BookingAgent]
    code: 200
    input: []
    output: Market
    side_effects: []
  - method: GET
    path: "/markets"
    description: "Lists markets, newest first by created_at DESC."
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Market[]"
    side_effects: []

  # ---- suppliers -----------------------------------------------------------
  - method: POST
    path: "/suppliers"
    description: "Onboards a supplier in visibility_status PENDING_CERT with certification_level NONE and current_model NONE."
    roles: [PlatformAdmin, CommercialManager]
    code: 201
    input: [legal_name, supplier_type, home_market_id, contact_email, "conversion_index?"]
    output: Supplier
    side_effects: []
  - method: GET
    path: "/suppliers/{id}"
    description: "Reads one supplier including its derived certification_level, content_score, connectivity_score, current_model and parity_strikes."
    roles: *all_roles
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: GET
    path: "/suppliers"
    description: "Lists suppliers, filterable by home market and visibility status, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["home_market_id?", "visibility_status?", "certification_level?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []
  - method: POST
    path: "/suppliers/{id}/reinstate"
    description: "Lifts a suspension. Requires a non-expired, non-revoked CERTIFIED or PROVISIONAL certification to exist at the current logical clock."
    roles: [ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: Supplier
    side_effects: ["Supplier SUSPENDED -> ACTIVE", "clears suspension_reason", "increments Supplier.version by 1"]
  - method: POST
    path: "/suppliers/{id}/offboard"
    description: "Terminates the relationship. Cascades to rate plans and offers."
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: Supplier
    side_effects:
      - "Supplier ACTIVE|SUSPENDED -> OFFBOARDED"
      - "every non-ARCHIVED RatePlan of the supplier -> ARCHIVED"
      - "every PENDING or SUPPRESSED or LIVE Offer under those plans -> CLOSED"
      - "increments the version of the supplier and of every touched plan and offer by 1"

  # ---- model agreements ----------------------------------------------------
  - method: POST
    path: "/suppliers/{id}/model-agreements"
    description: "Drafts a merchant-versus-agency model agreement for the supplier. base_commission_pct is required for AGENCY and base_markup_pct for MERCHANT; the irrelevant one must be omitted or null."
    roles: [CommercialManager]
    code: 201
    input: [model, effective_from, "effective_to?", "base_commission_pct?", "base_markup_pct?", chargeback_liability_pct_marketplace, fraud_liability_cap_cents, settlement_terms_days]
    output: ModelAgreement
    side_effects: ["stores proposed_by_user_id from X-User-ID"]
  - method: GET
    path: "/model-agreements/{id}"
    description: "Reads one model agreement."
    roles: *all_roles
    code: 200
    input: []
    output: ModelAgreement
    side_effects: []
  - method: GET
    path: "/model-agreements"
    description: "Lists model agreements, filterable by supplier, model and status, ordered by effective_from ASC then created_at ASC."
    roles: *all_roles
    code: 200
    input: ["supplier_id?", "model?", "status?", "limit?", "offset?"]
    output: "ModelAgreement[]"
    side_effects: []
  - method: POST
    path: "/model-agreements/{id}/activate"
    description: "Activates a DRAFT agreement after the closed-interval overlap check of validation priority 14. The activating X-User-ID must differ from proposed_by_user_id."
    roles: [ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: ModelAgreement
    side_effects:
      - "ModelAgreement DRAFT -> ACTIVE, stamps activated_at and activated_by_user_id"
      - "any ACTIVE sibling agreement with the same effective_from -> SUPERSEDED"
      - "recomputes Supplier.current_model from the agreement covering the current logical clock date"
      - "increments the version of the agreement, of any superseded sibling and of the supplier by 1"
  - method: POST
    path: "/model-agreements/{id}/terminate"
    description: "Terminates an ACTIVE agreement without repricing any existing offer."
    roles: [CommercialManager]
    code: 200
    input: [termination_reason]
    output: ModelAgreement
    side_effects: ["ModelAgreement ACTIVE -> TERMINATED", "recomputes Supplier.current_model", "increments both versions by 1"]
  - method: POST
    path: "/model-agreements/{id}/withdraw"
    description: "Withdraws a DRAFT agreement that was never activated."
    roles: [CommercialManager]
    code: 200
    input: ["note?"]
    output: ModelAgreement
    side_effects: ["ModelAgreement DRAFT -> WITHDRAWN", "increments ModelAgreement.version by 1"]

  # ---- content quality and connectivity certification ----------------------
  - method: POST
    path: "/suppliers/{id}/certifications"
    description: "Supplier submits a content-quality and connectivity certification package. Created in SUBMITTED."
    roles: [SupplierUser, CommercialManager]
    code: 201
    input: [content_score_claimed, connectivity_protocol, sample_payload_ref]
    output: Certification
    side_effects: []
  - method: GET
    path: "/certifications/{id}"
    description: "Reads one certification including the adjudicated content_score and connectivity_score."
    roles: *all_roles
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: GET
    path: "/certifications"
    description: "Lists certifications, filterable by supplier and status, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["supplier_id?", "status?", "decision?", "limit?", "offset?"]
    output: "Certification[]"
    side_effects: []
  - method: POST
    path: "/certifications/{id}/start-review"
    description: "Opens review on a SUBMITTED or REMEDIATION_SUBMITTED package."
    roles: [ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: Certification
    side_effects: ["Certification SUBMITTED|REMEDIATION_SUBMITTED -> IN_REVIEW", "increments Certification.version by 1"]
  - method: POST
    path: "/certifications/{id}/decide"
    description: "Records the adjudicated scores and the decision. CERTIFY sets expires_at to the decision date plus CERT_VALID_DAYS (365); PROVISIONAL sets it to the decision date plus PROVISIONAL_VALID_DAYS (90); REJECT sets no expiry."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, content_score, connectivity_score, "note?"]
    output: Certification
    side_effects:
      - "Certification IN_REVIEW -> CERTIFIED | PROVISIONAL | REJECTED"
      - "stamps expires_at and reviewed_by_user_id"
      - "on CERTIFY or PROVISIONAL: Supplier PENDING_CERT -> ACTIVE, copies content_score and connectivity_score onto the supplier and sets certification_level to CERTIFIED or PROVISIONAL"
      - "increments the version of the certification and of the supplier by 1"
  - method: POST
    path: "/certifications/{id}/remediate"
    description: "Supplier resubmits a REJECTED package. Bounded by CERT_MAX_REMEDIATION_ROUNDS (3)."
    roles: [SupplierUser]
    code: 200
    input: [content_score_claimed, sample_payload_ref, "note?"]
    output: Certification
    side_effects: ["Certification REJECTED -> REMEDIATION_SUBMITTED", "increments remediation_rounds by 1", "increments Certification.version by 1"]
  - method: POST
    path: "/certifications/{id}/revoke"
    description: "Revokes a live certification for cause and cascades the supplier out of the marketplace."
    roles: [ComplianceOfficer]
    code: 200
    input: [revocation_reason]
    output: Certification
    side_effects:
      - "Certification CERTIFIED|PROVISIONAL -> REVOKED"
      - "Supplier ACTIVE -> SUSPENDED with suspension_reason CERTIFICATION_REVOKED and certification_level NONE"
      - "every LIVE Offer of the supplier -> SUPPRESSED with suppression_reason SUPPLIER_SUSPENDED"
      - "every PUBLISHED Package holding one of those offers -> WITHDRAWN, and every PRICED package holding one -> DRAFT"
      - "every PUBLISHED RankingRun holding one of those offers -> WITHDRAWN"
      - "increments the version of every touched row by 1"

  # ---- rate plans ----------------------------------------------------------
  - method: POST
    path: "/suppliers/{id}/rate-plans"
    description: "Creates a rate and inventory ingestion plan for one market, carrying the cancellation policy and the tax and fee percentage that offer pricing and refund pass-through both read."
    roles: [SupplierUser, CommercialManager]
    code: 201
    input: [market_id, name, currency, cancellation_policy_code, free_cancel_cutoff_hours, tax_fee_pct, "parity_monitored?"]
    output: RatePlan
    side_effects: []
  - method: GET
    path: "/rate-plans/{id}"
    description: "Reads one rate plan, including its version for optimistic concurrency and parity_hold_case_id when held."
    roles: *all_roles
    code: 200
    input: []
    output: RatePlan
    side_effects: []
  - method: GET
    path: "/rate-plans"
    description: "Lists rate plans, filterable by supplier, market and status, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["supplier_id?", "market_id?", "status?", "limit?", "offset?"]
    output: "RatePlan[]"
    side_effects: []
  - method: POST
    path: "/rate-plans/{id}/release-parity-hold"
    description: "Lifts a parity hold once the opening case has been closed."
    roles: [ParityAnalyst, ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: RatePlan
    side_effects: ["RatePlan PARITY_HOLD -> ACTIVE", "clears parity_hold_case_id", "increments RatePlan.version by 1"]
  - method: POST
    path: "/rate-plans/{id}/archive"
    description: "Archives a plan and closes out its offers."
    roles: [CommercialManager]
    code: 200
    input: ["note?"]
    output: RatePlan
    side_effects: ["RatePlan ACTIVE -> ARCHIVED", "every PENDING Offer under the plan -> CLOSED", "increments the version of the plan and of every touched offer by 1"]

  # ---- offers --------------------------------------------------------------
  - method: POST
    path: "/rate-plans/{id}/offers"
    description: "Ingests a dated net rate and allotment. Runs offer_sell_price at creation, selecting merchant gross-up or agency commission from the ModelAgreement covering travel_date and applying the winning CommissionOverride. Guarded by expected_rate_plan_version."
    roles: [SupplierUser, CommercialManager]
    code: 201
    input: [travel_date, net_rate_cents, allotment_total, expected_rate_plan_version]
    output: Offer
    side_effects:
      - "runs offer_sell_price and writes pricing_model, applied_rate_pct, applied_override_id, gross_cents, taxes_fees_cents, display_total_cents, marketplace_margin_cents and supplier_payable_cents"
      - "sets allotment_remaining to allotment_total"
      - "any earlier PENDING or LIVE Offer on the same plan and travel_date -> SUPERSEDED"
      - "increments RatePlan.version by 1 and the version of any superseded offer by 1"
  - method: GET
    path: "/offers/{id}"
    description: "Reads one offer with its full price decomposition and allotment ledger."
    roles: *all_roles
    code: 200
    input: []
    output: Offer
    side_effects: []
  - method: GET
    path: "/offers"
    description: "Lists offers, filterable by rate plan, travel date and status, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["rate_plan_id?", "travel_date?", "status?", "limit?", "offset?"]
    output: "Offer[]"
    side_effects: []
  - method: POST
    path: "/offers/{id}/publish"
    description: "Makes an offer bookable. Requires a certified, ACTIVE supplier and an ACTIVE model agreement covering travel_date."
    roles: [SupplierUser, CommercialManager]
    code: 200
    input: ["note?"]
    output: Offer
    side_effects: ["Offer PENDING|SUPPRESSED -> LIVE", "clears suppression_reason", "increments Offer.version by 1"]
  - method: POST
    path: "/offers/{id}/suppress"
    description: "Pulls a live offer out of distribution and withdraws every published artifact that quoted it."
    roles: [ParityAnalyst, ComplianceOfficer, CommercialManager]
    code: 200
    input: [suppression_reason]
    output: Offer
    side_effects:
      - "Offer LIVE -> SUPPRESSED"
      - "every PUBLISHED RankingRun holding a RankingEntry for this offer -> WITHDRAWN"
      - "every PUBLISHED Package holding this offer as a component -> WITHDRAWN, and every PRICED such package -> DRAFT"
      - "increments the version of every touched row by 1"
  - method: POST
    path: "/offers/{id}/close-out"
    description: "Retires an offer permanently. Existing bookings are unaffected."
    roles: [SupplierUser, CommercialManager]
    code: 200
    input: ["note?"]
    output: Offer
    side_effects: ["Offer PENDING|LIVE|SUPPRESSED -> CLOSED", "increments Offer.version by 1"]

  # ---- parity monitoring ---------------------------------------------------
  - method: POST
    path: "/rate-plans/{id}/parity-observations"
    description: "Records an immutable observation of the supplier's direct-channel total for a travel_date and runs parity_breach_bps against the plan's LIVE offer for that date. A breach at or above PARITY_TOLERANCE_BPS opens a ParityCase when no open case exists for that plan and travel_date, otherwise it updates the existing case's peak_breach_bps and severity."
    roles: [ParityAnalyst]
    code: 201
    input: [travel_date, channel, observed_at, direct_total_cents]
    output: DirectRateObservation
    side_effects:
      - "runs parity_breach_bps and writes compared_offer_id, breach_bps and severity"
      - "opens a ParityCase in OPEN and back-links parity_case_id, or attaches to the existing open case and raises its peak_breach_bps and severity monotonically"
      - "increments the version of the touched ParityCase by 1"
  - method: GET
    path: "/parity-observations/{id}"
    description: "Reads one direct-rate observation."
    roles: *all_roles
    code: 200
    input: []
    output: DirectRateObservation
    side_effects: []
  - method: GET
    path: "/parity-observations"
    description: "Lists direct-rate observations, filterable by rate plan, travel date and severity, ordered by observed_at ASC then created_at ASC."
    roles: *all_roles
    code: 200
    input: ["rate_plan_id?", "travel_date?", "severity?", "limit?", "offset?"]
    output: "DirectRateObservation[]"
    side_effects: []
  - method: GET
    path: "/parity-cases/{id}"
    description: "Reads one parity case with its notify_rounds, peak_breach_bps and close outcome."
    roles: *all_roles
    code: 200
    input: []
    output: ParityCase
    side_effects: []
  - method: GET
    path: "/parity-cases"
    description: "Lists parity cases, filterable by rate plan, opening observation and status, ordered by created_at ASC."
    roles: *all_roles
    code: 200
    input: ["rate_plan_id?", "opening_observation_id?", "status?", "severity?", "limit?", "offset?"]
    output: "ParityCase[]"
    side_effects: []
  - method: POST
    path: "/parity-cases/{id}/notify-supplier"
    description: "Sends the case to the supplier for explanation. Repeatable from SUPPLIER_RESPONDED, bounded by PARITY_MAX_NOTIFY_ROUNDS (3)."
    roles: [ParityAnalyst]
    code: 200
    input: ["note?"]
    output: ParityCase
    side_effects: ["ParityCase OPEN|SUPPLIER_RESPONDED -> SUPPLIER_NOTIFIED", "increments notify_rounds by 1", "increments ParityCase.version by 1"]
  - method: POST
    path: "/parity-cases/{id}/respond"
    description: "Supplier answers the parity notice with a response code."
    roles: [SupplierUser]
    code: 200
    input: [supplier_response_code, "note?"]
    output: ParityCase
    side_effects: ["ParityCase SUPPLIER_NOTIFIED -> SUPPLIER_RESPONDED", "stores supplier_response_code", "increments ParityCase.version by 1"]
  - method: POST
    path: "/parity-cases/{id}/escalate"
    description: "Escalates an unresolved case, holding the rate plan and pulling its live inventory out of distribution."
    roles: [ParityAnalyst, ComplianceOfficer]
    code: 200
    input: [escalation_reason]
    output: ParityCase
    side_effects:
      - "ParityCase SUPPLIER_NOTIFIED|SUPPLIER_RESPONDED -> ESCALATED and stamps escalated_at"
      - "RatePlan ACTIVE -> PARITY_HOLD with parity_hold_case_id set to this case"
      - "every LIVE Offer under that plan -> SUPPRESSED with suppression_reason PARITY_HOLD"
      - "increments Supplier.parity_strikes by 1"
      - "increments the version of every touched row by 1"
  - method: POST
    path: "/parity-cases/{id}/close"
    description: "Closes a case. outcome COMPLIANT is available to ParityAnalyst and ComplianceOfficer; outcome WAIVED is restricted to ComplianceOfficer and to an X-User-ID other than opened_by_user_id."
    roles: [ParityAnalyst, ComplianceOfficer]
    code: 200
    input: [outcome, "note?"]
    output: ParityCase
    side_effects:
      - "ParityCase OPEN|SUPPLIER_RESPONDED|ESCALATED -> RESOLVED_COMPLIANT, or SUPPLIER_NOTIFIED -> WAIVED"
      - "stores close_outcome and closed_by_user_id"
      - "increments ParityCase.version by 1"

