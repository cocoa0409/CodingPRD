            - "State FL is ADOPTION_LIST with sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "Two titles are ACTIVE; both submissions to cycle 2027 are FILED with an ACCEPTED correlation and an APPROVED PricingProposal"
