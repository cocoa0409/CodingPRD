            - "the qualify call returns http 409 with error_id ERR_INVALID_STATE, not ERR_DTI_CEILING_EXCEEDED (422)"
            - "HomeSaleContract.${ct1}.contract_status == PENDING (unchanged)"
            - "LoanApplication.${la2}.application_status == DENIED (unchanged)"

