              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CAB-750", bottle_ml: 750, bottles: 6, unit_price_cents: 4200 }], expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o_id: $.data.id }
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v2: $.data.version }
          trigger:
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [], expected_consumer_version: "${c_v2}" }
              as: WineryOperator
              as_user_id: "${w_id}"
            - call: "POST /dtc/remittances"
              payload: { winery_id: "${w_id}", state_code: "TX", period_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", basis: "ACCRUAL_BASIS" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/orders/${o_id}/compliance-exceptions"
              payload: { raised_rule: "ERR_PROHIBITED_DESTINATION", justification: "Wrong rule named on purpose" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/orders/${o_id}/compliance-exceptions"
              payload: { raised_rule: "ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED", justification: "State board granted a written one-time allowance" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { ex_id: $.data.id }
          assert:
            - "empty lines array: HTTP 400 with error_id \"ERR_INVALID_REQUEST\" and no Order row is created"
            - "period_start equal to period_end: HTTP 400 with error_id \"ERR_INVALID_REQUEST\" \u2014 the interval must be strictly ordered, and this is a 400 rather than the 409 ERR_REMITTANCE_PERIOD_OVERLAP of a real collision"
            - "raised_rule that is not the order's recorded rejection_error_id: HTTP 400 with error_id \"ERR_INVALID_REQUEST\", and Winery.${w_id}.open_exception_count is still 0"
            - "the same call with the matching raised_rule: HTTP 201 with data.status \"OPEN\", data.raised_rule \"ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED\", data.requested_by_user_id \"officer_a\" and data.order_id \"${o_id}\""
            - "after the accepted call Winery.${w_id}.open_exception_count == 1 and GET /dtc/orders/${o_id}/compliance-exceptions returns exactly one row"
            - "none of the three refusals moved the order: Order.${o_id}.compliance_status is still \"OVERRIDE_PENDING\" with the same rejection_error_id"
            - "no remittance was created: GET /dtc/remittances?winery_id=${w_id} returns zero rows"
      - name: permit_not_active_is_recorded_when_the_destination_permit_is_not_live
        claim_type: triggerable
        grounds:
          - errors[ERR_PERMIT_NOT_ACTIVE]
          - validations.priority_62
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_clearance_requires_the_destination_permit_to_be_active
          rationale: "The named \u00a71.8 instance screens the same order against a PENDING, a RENEWAL_FILED and an ACTIVE permit, so ERR_PERMIT_NOT_ACTIVE is already triggered from every state that produces it."
      - name: permit_expired_is_observed_lazily_at_screening_time
        claim_type: triggerable
        grounds:
          - errors[ERR_PERMIT_EXPIRED]
          - validations.priority_64
          - state_machines.StatePermit.ACTIVE_to_EXPIRED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / permit_expired_beats_winery_volume_limit
          rationale: "The named \u00a71.8 instance moves the clock past expiration_date and screens, which both triggers ERR_PERMIT_EXPIRED and asserts the lazy ACTIVE -> EXPIRED flip that produces it."
      - name: remittance_period_overlap_is_scoped_to_one_filing_family
        claim_type: triggerable
        grounds:
          - errors[ERR_REMITTANCE_PERIOD_OVERLAP]
          - validations.priority_68
        excluded_because:
          difficulty_instance: resource_temporal_overlap / remittance_half_open_period_allows_adjacency_and_is_family_scoped
          rationale: "The named \u00a71.8 instance opens overlapping, adjacent and differently-based periods over the same month, so the error and its three exemptions are already covered."
      - name: nothing_to_remit_depends_on_the_zero_filing_flag
        claim_type: triggerable
        grounds:
          - errors[ERR_NOTHING_TO_REMIT]
          - validations.priority_90
        excluded_because:
          difficulty_instance: boundary_precision_check / remittance_zero_shipment_period_at_the_filing_threshold
          rationale: "The named \u00a71.8 instance files an empty period under both settings of zero_filing_required, which is the only way this error can be produced."
      - name: permit_period_overlap_treats_a_shared_endpoint_as_a_collision
        claim_type: triggerable
        grounds:
          - errors[ERR_PERMIT_PERIOD_OVERLAP]
          - validations.priority_66
        excluded_because:
          difficulty_instance: resource_temporal_overlap / permit_closed_interval_treats_a_shared_endpoint_as_overlap
          rationale: "The named \u00a71.8 instance files a second permit starting exactly on the incumbent's expiration_date and then one day later, which triggers the error and pins its closed-interval boundary."

  # =========================================================================
  - section: rbac
    instances:
      - name: a_missing_identity_header_is_unauthenticated_while_a_wrong_role_is_unauthorized
        claim_type: authentication_and_role_gate
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - roles.Consumer
          - roles.CarrierAgent
          - endpoints.POST_/dtc/orders/{id}/screen
        distinguishing_aspect: |
          401 and 403 are two different failures on the same call and must not be collapsed. Both headers
          are mandatory, so dropping either one is a 401 even when the value that IS present would have been
          authorized; an undeclared role string and a declared-but-unlisted role are both 403 ERR_UNAUTHORIZED.
          The screen endpoint is the sharpest probe because it ALWAYS answers 200 once it is reached — so every
          non-200 here is provably the identity gate and not the compliance ladder, and the order must still be
          sitting in DRAFT after all five refusals.
        test_recipe:
          setup:
            - "Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment; consumer Ada is ID-verified. Clock 2026-08-01."
            - "A 6 x 750 ml order (4.500 L) exists in compliance_status DRAFT and has never been screened."
            - "The screen endpoint's declared roles are ComplianceOfficer and WineryOperator only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-1", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p_tx_id: $.data.id }
            - call: "POST /dtc/state-permits/${p_tx_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/carrier-programs"
              payload: { carrier_code: "GSO", program_name: "Wine Shipper TX", states_served: ["TX"], requires_enrollment: true, adult_signature_service_code: "AS21" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v1: $.data.version }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce_id: $.data.id }
            - call: "POST /dtc/carrier-enrollments/${ce_id}/decision"
              payload: { decision: "APPROVED" }
              as: CarrierAgent
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/consumers/${c_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { c_v1: $.data.version }
            - call: "POST /dtc/orders"
              payload: { winery_id: "${w_id}", consumer_id: "${c_id}", ship_to_address_line: "12 Vine St", ship_to_state_code: "TX", ship_to_zip: "78701", lines: [{ sku: "CAB-750", bottle_ml: 750, bottles: 6, unit_price_cents: 4200 }], expected_consumer_version: "${c_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: null
              as_user_id: "officer_a"
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: null
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: null
              as_user_id: null
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: StateAuditor
              as_user_id: "auditor_1"
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: Consumer
              as_user_id: "${c_id}"
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: CarrierAgent
              as_user_id: "agent_1"
            - call: "POST /dtc/orders/${o_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
          assert:
            - "no X-User-Role header: HTTP 401 with error_id \"ERR_UNAUTHENTICATED\" even though X-User-ID is a perfectly good officer id"
            - "no X-User-ID header: HTTP 401 with error_id \"ERR_UNAUTHENTICATED\" even though the role WOULD have been authorized \u2014 authentication is checked before authorization"
            - "neither header: HTTP 401 with error_id \"ERR_UNAUTHENTICATED\""
            - "an undeclared role string \"StateAuditor\": HTTP 403 with error_id \"ERR_UNAUTHORIZED\" \u2014 403 rather than 401, because both headers were present"
            - "Consumer, a declared role that is simply not on this endpoint: HTTP 403 with error_id \"ERR_UNAUTHORIZED\" \u2014 and NOT ERR_FORBIDDEN_RESOURCE_OWNER, even though the order is that consumer's own"
            - "CarrierAgent: HTTP 403 with error_id \"ERR_UNAUTHORIZED\""
            - "none of the six refusals ran the ladder: Order.${o_id}.compliance_status is still \"DRAFT\", rejection_error_id is null, cleared_at is null, GET /dtc/volume-ledger-entries?order_id=${o_id} returns zero rows and Winery.${w_id}.excise_accrued_cents is still 0"
            - "the authorized call answers 200 with data.compliance_status \"CLEARED\" \u2014 the endpoint itself was never broken"
      - name: a_consumer_cannot_touch_another_consumers_rows_and_a_winery_cannot_touch_another_winerys
        claim_type: peer_role_isolation
        grounds:
          - errors[ERR_FORBIDDEN_RESOURCE_OWNER]
          - roles.Consumer
          - roles.WineryOperator
          - complexity_profile.role_model
          - endpoints.POST_/dtc/shipments
          - endpoints.POST_/dtc/state-permits/{id}/file-renewal
        distinguishing_aspect: |
          Both entity-backed roles carry an ownership predicate on X-User-ID, and the failure it produces is
          a third thing: not 401 (headers are present), not ERR_UNAUTHORIZED (the role IS listed on the endpoint)
          and not 404 (the row exists and the same call succeeds for its owner). Every probe here is paired with
          the identical call from the rightful owner, so the only variable is whose id is in the header.
