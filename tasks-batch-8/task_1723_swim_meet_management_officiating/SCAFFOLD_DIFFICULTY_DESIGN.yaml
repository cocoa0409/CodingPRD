            - "${res_b_plc} == 1 and ${res_b_pts} == 9.00  # hop 3: rescore promotes survivors"
            - "${res_c_plc} == 2 and ${res_c_pts} == 7.00"
            - "${tot_x} == 0.00 and ${tot_y} == 16.00  # hop 4: team rollups recomputed"
            - "${ev_v_after} == ${ev_v_done} + 1  # rescore bumps SwimEvent.version"
      - name: relay_scratch_cascade
        grounds:
          - state_machines.RelayTeam.LEGS_LOCKED_to_SCRATCHED
          - state_machines.EventEntry.SEEDED_to_SCRATCHED
          - state_machines.LaneAssignment.note
