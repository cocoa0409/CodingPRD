            - call: "POST /compliance/compensation-disclosures"
              payload: { contract_id: "${c_cx}", direct_comp_cents: 875000, indirect_comp_cents: 0, benchmark_median_cents: 1000000, services_scope_score: 4, disclosure_completeness_score: 4 }
              as: PlanSponsorAdmin
