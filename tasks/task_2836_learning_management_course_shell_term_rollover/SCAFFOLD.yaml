    roles: [LmsAdmin, Instructor]
    code: 200
    input: ["reason?"]
    output: CourseShell
    side_effects:
      - "unpublish_reason recorded; AcademicTerm.published_shell_count decremented by 1"
      - "increments CourseShell.version by 1"

  - method: POST
    path: "/course-shells/{id}/lifecycle-transitions"
    description: "Move a shell along the archival tail: CONCLUDED, ARCHIVED, PURGED."
    roles: [Registrar]
    code: 200
    input: [target_state, "reason?"]
    output: CourseShell
    side_effects:
      - "CONCLUDED completes the shell's ACTIVE enrollments and removes its ToolPlacement rows, adjusting enrollment_seat_ledger"
      - "PURGED requires retention_purge_at to be due and non-null; it zeroes storage_mb and recomputes the owner's sandbox_storage_chargeback"
      - "increments CourseShell.version by 1"

