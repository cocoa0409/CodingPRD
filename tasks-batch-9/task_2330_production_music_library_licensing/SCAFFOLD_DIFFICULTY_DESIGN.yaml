              captures: { comp1_v2: $.data.version }
          trigger:
            - call: "POST /music-library/licenses"
              payload: { license_mode: "PER_USE", sync_request_id: "${srOn}", expected_composition_version: "${comp1_v2}" }
              as: LicensingAgent
            - call: "POST /music-library/licenses"
              payload: { license_mode: "PER_USE", sync_request_id: "${srAfter}", expected_composition_version: "${comp1_v2}" }
              as: LicensingAgent
              captures: { licAfter: $.data.id }
          assert:
            - "License.${licX}.is_exclusive == true, final_fee_cents == 886421, term_start == 2026-09-01T00:00:00Z, term_end == 2028-08-31T00:00:00Z"
            - "License.${licX}.exclusive_block_until == 2028-11-29T00:00:00Z (term_end plus holdback_days 90)"
            - "Composition.${comp1}.exclusive_block_until == 2028-11-29T00:00:00Z"
            - "the ${srOn} issuance (term_start exactly 2028-11-29) returns error_id == ERR_EXCLUSIVE_WINDOW_CONFLICT with status 409 - the block day itself is occupied"
            - "the failed issuance leaves Composition.${comp1}.version == comp1_v2 unchanged, so the same value succeeds on the next call"
            - "the ${srAfter} issuance (term_start 2028-11-30) returns 201"
            - "License.${licAfter}.term_start == 2028-11-30T00:00:00Z and term_end == 2029-11-29T00:00:00Z"
            - "License.${licAfter}.is_exclusive == false and exclusive_block_until == 2029-11-29T00:00:00Z (equal to term_end, no holdback on a non-exclusive licence)"
            - "License.${licAfter}.final_fee_cents == 370500 and final_discount_pct == 5.00"
            - "SyncRequest.${srOn}.status == ACCEPTED and license_id == null after the refusal"
            - "Composition.${comp1}.active_license_count == 2"

      - name: blanket_coverage_half_open_adjacency_on_licensee
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - errors[ERR_BLANKET_COVERAGE_OVERLAP]
          - errors[ERR_COVERAGE_DATES_INVALID]
          - entities.BlanketAgreement.fields.coverage_start
          - entities.BlanketAgreement.fields.coverage_end
        distinguishing_aspect: |
          Interval semantics B on a different resource (the Licensee, not the Composition): a HALF-OPEN
          occupation with no buffer, so a new coverage starting exactly where the incumbent ends
          (2027-08-01) is accepted while a coverage starting one day earlier (2027-07-31) collides -
          the opposite adjacency verdict from the closed, holdback-buffered composition block.
        test_recipe:
          setup:
            - "One licensee."
            - "One BlanketAgreement for that licensee with coverage [2026-08-01, 2027-08-01), left in coverage_status DRAFT so it still occupies the interval."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Rivergate Networks", licensee_type: "BROADCASTER", credit_limit_cents: 20000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
            - call: "POST /music-library/blanket-agreements"
              payload: { licensee_id: "${lee1}", coverage_start: "2026-08-01T00:00:00Z", coverage_end: "2027-08-01T00:00:00Z", annual_fee_cents: 4800000, reporting_cadence: "MONTHLY", usage_cap_minutes: 120, pool_share_pct: 25.00 }
              as: LicensingAgent
              captures: { ba1: $.data.id }
          trigger:
            - call: "POST /music-library/blanket-agreements"
              payload: { licensee_id: "${lee1}", coverage_start: "2027-08-01T00:00:00Z", coverage_end: "2028-08-01T00:00:00Z", annual_fee_cents: 5000000, reporting_cadence: "QUARTERLY", usage_cap_minutes: 150, pool_share_pct: 30.00 }
              as: LicensingAgent
              captures: { ba2: $.data.id }
            - call: "POST /music-library/blanket-agreements"
              payload: { licensee_id: "${lee1}", coverage_start: "2027-07-31T00:00:00Z", coverage_end: "2028-07-31T00:00:00Z", annual_fee_cents: 5000000, reporting_cadence: "MONTHLY", usage_cap_minutes: 150, pool_share_pct: 30.00 }
              as: LicensingAgent
            - call: "POST /music-library/blanket-agreements"
              payload: { licensee_id: "${lee1}", coverage_start: "2029-01-01T00:00:00Z", coverage_end: "2029-01-01T00:00:00Z", annual_fee_cents: 5000000, reporting_cadence: "MONTHLY", usage_cap_minutes: 150, pool_share_pct: 30.00 }
              as: LicensingAgent
          assert:
            - "the adjacent coverage [2027-08-01, 2028-08-01) returns 201: touching endpoints do not overlap under half-open semantics"
            - "BlanketAgreement.${ba2}.coverage_start == 2027-08-01T00:00:00Z, coverage_end == 2028-08-01T00:00:00Z, coverage_status == DRAFT, reporting_status == COMPLIANT"
            - "the coverage [2027-07-31, 2028-07-31) returns error_id == ERR_BLANKET_COVERAGE_OVERLAP with status 409 (one day of overlap with ${ba1})"
            - "the degenerate coverage [2029-01-01, 2029-01-01) returns error_id == ERR_COVERAGE_DATES_INVALID with status 422, not ERR_BLANKET_COVERAGE_OVERLAP"
            - "exactly two BlanketAgreement rows exist for ${lee1}: ${ba1} and ${ba2}"
            - "BlanketAgreement.${ba1}.coverage_status == DRAFT and coverage_end == 2027-08-01T00:00:00Z (unchanged by the refusals)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: license_revocation_restores_composer_accrual_and_licensee_credit
        grounds:
          - state_machines.License.ISSUED_to_REVOKED
          - calculations.licensee_credit_exposure
          - entities.RoyaltyLedgerEntry.fields.source_type
          - entities.Composer.fields.accrued_unpaid_cents
          - entities.Licensee.fields.committed_spend_cents
          - entities.Licensee.fields.credit_available_cents
          - entities.Composition.fields.active_license_count
        distinguishing_aspect: |
          Conserved quantity type 1 - money. The forward action (issuance) added SYNC_FEE +156000 to
          Composer.accrued_unpaid_cents and 390000 to Licensee.committed_spend_cents; the compensating
          action (revocation) appends SYNC_FEE_REVERSAL -156000 so accrued_unpaid_cents returns to
          exactly 0 and credit_available_cents returns to exactly 5000000, with the original entry left
          immutable rather than deleted.
        test_recipe:
          setup:
            - "Composer with an ACTIVE ROYALTY_SPLIT agreement, sync_fee_share_pct 40, advance_cents 0, so accrued_unpaid_cents starts at 0."
            - "One CATALOGED composition; BROADCAST_TV tier base_rate_cents 300000; licensee with credit_limit_cents 5000000 (credit_available_cents 5000000)."
            - "A PER_USE License ISSUED at final_fee_cents 390000 with SYNC_FEE 156000 appended."
            - "The licence has been paid in full, so the SYNC_FEE entry carries cash_recognized_at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Ravi Chandran", pro_affiliation: "ASCAP", payee_country: "US", tax_withholding_pct: 0.30 }
              as: RightsManager
              captures: { c1: $.data.id }
            - call: "POST /music-library/composer-agreements"
              payload: { composer_id: "${c1}", agreement_type: "ROYALTY_SPLIT", writer_share_pct: 50.00, publisher_share_pct: 50.00, sync_fee_share_pct: 40.00, buyout_fee_cents: 0, exclusivity: "NON_EXCLUSIVE", holdback_days: 0, advance_cents: 0, blanket_opt_in: true }
              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Ravi Chandran" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Monsoon Wire", duration_sec: 185, tempo_bpm: 122, genre: "ELECTRONIC", mood_tags: ["TENSE"], instrumentation: ["SYNTH", "PERCUSSION"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
            - call: "POST /music-library/compositions/${comp1}/catalog"
              payload: {}
              as: CatalogAdmin
              captures: { comp1_v: $.data.version }
            - call: "POST /music-library/license-tiers"
              payload: { code: "BTV-STD", media_type: "BROADCAST_TV", allowed_scales: ["LOCAL", "NATIONAL", "WORLDWIDE"], base_rate_cents: 300000, min_term_months: 1, max_term_months: 120, per_use_eligible: true, blanket_eligible: false }
              as: CatalogAdmin
              captures: { tierBtv: $.data.id }
            - call: "POST /music-library/licensees"
              payload: { legal_name: "Monsoon Media", licensee_type: "PRODUCTION_COMPANY", credit_limit_cents: 5000000 }
              as: LicensingAgent
              captures: { lee1: $.data.id }
            - call: "POST /music-library/sync-requests"
              payload: { composition_id: "${comp1}", licensee_id: "${lee1}", tier_id: "${tierBtv}", media_type: "BROADCAST_TV", distribution_scale: "NATIONAL", requested_term_start: "2026-09-01T00:00:00Z", requested_term_months: 12, exclusive_requested: false, rush_requested: false }
              as: LicensingAgent
              captures: { sr1: $.data.id }
            - call: "POST /music-library/sync-requests/${sr1}/review"
              payload: {}
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/quote"
              payload: { quote_valid_days: 14 }
              as: LicensingAgent
            - call: "POST /music-library/sync-requests/${sr1}/accept"
              payload: {}
              as: Licensee
              as_user_id: "${lee1}"
            - call: "POST /music-library/licenses"
              payload: { license_mode: "PER_USE", sync_request_id: "${sr1}", expected_composition_version: "${comp1_v}" }
              as: LicensingAgent
              captures: { lic1: $.data.id }
            - call: "POST /music-library/licenses/${lic1}/record-payment"
              payload: { amount_cents: 390000 }
              as: RoyaltyAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "POST /music-library/licenses/${lic1}/revoke"
              payload: { reason: "LICENSEE_BREACH" }
              as: RightsManager
          assert:
            - "License.${lic1}.status == REVOKED and revoke_reason == LICENSEE_BREACH"
            - "a SYNC_FEE_REVERSAL RoyaltyLedgerEntry exists for ${c1} with source_ref_id == ${lic1} and amount_cents == -156000"
            - "that reversal carries accrual_recognized_at == 2026-08-01T00:00:00Z and cash_recognized_at == 2026-08-01T00:00:00Z (the original SYNC_FEE had cash stamped)"
            - "the original SYNC_FEE entry still exists unchanged with amount_cents == 156000 (append-only ledger, no deletion)"
            - "INVARIANT: Composer.${c1}.accrued_unpaid_cents == 0, exactly its pre-issuance value"
            - "INVARIANT: Licensee.${lee1}.committed_spend_cents == 0 and credit_available_cents == 5000000, exactly their pre-issuance values"
            - "Licensee.${lee1}.reserved_spend_cents == 0 (the reservation was consumed at issuance and is not resurrected by revocation)"
            - "Composition.${comp1}.active_license_count == 0 and exclusive_block_until == null"
            - "exactly 2 RoyaltyLedgerEntry rows exist for ${c1} and their amount_cents sum to 0"
            - "License.${lic1}.final_fee_cents is still 390000 and collected_amount_cents still 390000 (the licence record is not rewritten)"

      - name: society_rejection_restores_composition_performance_credits
        grounds:
          - state_machines.CueSheet.REGISTERED_to_REJECTED_BY_SOCIETY
          - state_machines.CueSheet.COLLECTED_to_REGISTERED
          - calculations.performance_royalty_cents
          - entities.Composition.fields.lifetime_performance_credits
          - entities.CueSheet.fields.total_credits
          - entities.CueSheet.fields.registration_round
          - entities.RoyaltyLedgerEntry.fields.source_type
        distinguishing_aspect: |
          Conserved quantity type 2 - performance credits, a non-monetary 2-decimal rollup rather than
          cents. Registration raised Composition.lifetime_performance_credits from 0.00 to 3.01 and
          appended PERFORMANCE +1882; the society rejection appends PERFORMANCE_REVERSAL -1882 and
          returns lifetime_performance_credits to exactly 0.00 while the sheet keeps its own
          total_credits 3.01 and registration_round 1.
        test_recipe:
          setup:
            - "Composer affiliated with BMI, writer_share_pct 50, ACTIVE ROYALTY_SPLIT agreement, sync_fee_share_pct 40."
            - "One CATALOGED composition; BROADCAST_TV tier base_rate_cents 300000; licensee with credit_limit_cents 5000000."
            - "A PER_USE License ISSUED at 390000, so the composer already holds a SYNC_FEE entry of 156000."
            - "A cue sheet on that licence with three 45-second cues (THEME, FEATURE, BACKGROUND) at market_tier NETWORK, REGISTERED with the society."
