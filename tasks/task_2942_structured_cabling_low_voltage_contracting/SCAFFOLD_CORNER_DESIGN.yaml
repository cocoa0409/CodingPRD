              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and data.error_id == \"ERR_INVALID_COORDINATION_STATE\""
            - "GET /cabling/trade-coordinations/${coord} still returns confirmed_date == \"2026-08-05\" and coordination_state == \"CONFIRMED\""
