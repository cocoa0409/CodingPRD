  - rule_id: cross_entity_state_dependency
    instances:

      - name: request_submit_blocked_by_frozen_vendor_posture
        grounds:
          - validations[priority=23]
          - errors[ERR_VENDOR_POSTURE_FROZEN]
          - calculations.vendor_privacy_posture
          - calculations.vendor_risk_score
          - state_machines.VendorIncident.CONTAINED_to_REMEDIATED
        distinguishing_aspect: |
          Whether a teacher may submit a request depends on the state of an entity
          three hops away: Vendor.privacy_posture, which is itself derived from a
          VendorIncident's severity and response_status. An open CRITICAL incident
          freezes the vendor, so submit is refused; remediating the same incident
          drops the posture to CLEAR (risk 30.00, still below the WATCH threshold)
          and the identical submit then succeeds. Nothing about the request itself
          changed between the two attempts.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Vendor V, breach_notification_hours 48, no subprocessors."
            - "Application A of V, teacher T, and a DRAFT request R by T on A (justification 240 characters, 700 students, grades 7..8)."
            - "One CRITICAL incident on V (1500 affected, tier 2, detected 2026-08-01T00:00:00Z) sitting in response_status REPORTED, which drives privacy_posture to FROZEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Meridian Practice Labs", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
