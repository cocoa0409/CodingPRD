            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 30, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_c: "$.data.id" } }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "INDIVIDUAL", target_units: 40, priority_rank: 2 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_i: "$.data.id" } }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "TRAVEL_PARTNER", target_units: 20, priority_rank: 3 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_t: "$.data.id" } }
