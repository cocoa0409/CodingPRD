            - call: "POST /chargemaster/charge-capture-batches/${b1}/reconcile"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "ria_1"
              captures: { e_closed: $.data.error_id }
            - call: "GET /chargemaster/charge-capture-batches/${b1}"
