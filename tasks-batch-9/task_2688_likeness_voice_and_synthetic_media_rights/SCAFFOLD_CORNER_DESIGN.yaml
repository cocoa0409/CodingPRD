            - "trigger call 2 -> 409 with data.error_id == \"ERR_INVALID_ASSET_STATE\"; purged_at and purge_note still show the FIRST call's values and the asset version is unchanged"
            - "trigger call 3 -> 200 with life_status \"DECEASED\", date_of_death \"2026-08-01T00:00:00Z\", postmortem_rights_until \"2096-08-01T00:00:00Z\"; the ACTIVE grant is SUSPENDED and rights_posture becomes \"RESTRICTED\" by the death cascade"
            - "trigger call 4 -> 409 with data.error_id == \"ERR_INVALID_TALENT_STATE\"; date_of_death is NOT rewritten to 2026-07-01 and postmortem_rights_until stays 2096-08-01"

      - name: license_disclosure_and_performance_state_errors_are_three_distinct_ids
        claim_type: error_triggerable
        grounds: [validations.priority_38, validations.priority_39, validations.priority_40, errors.ERR_INVALID_LICENSE_STATE, errors.ERR_INVALID_DISCLOSURE_STATE]
        distinguishing_aspect: >-
          One license row carries two independent state dimensions and hangs off a performance with a
          third. Out-of-order triggers on all three must produce three DIFFERENT error ids —
          ERR_INVALID_LICENSE_STATE for the distribution dimension, ERR_INVALID_DISCLOSURE_STATE for
          the compliance dimension, ERR_INVALID_PERFORMANCE_STATE for the parent — proving the
          implementation does not collapse them into one generic conflict.
        test_recipe:
          setup:
            - "The canonical CA / ADVERTISING chain through to an ISSUED license with compliance_status PENDING_LABEL"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
