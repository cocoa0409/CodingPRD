              payload: {}
              as: AccountManager
              captures: { csc_a: $.data.cycles_since_calibration, health_a: $.data.operational_status, alerts_a: $.data.open_alert_count }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-01T01:00:00Z", cycle_count_total: 20000, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20, source: "DEVICE" }
