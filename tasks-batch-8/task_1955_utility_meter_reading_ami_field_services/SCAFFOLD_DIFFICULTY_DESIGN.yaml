            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-06", route_shift: "AM", two_person_crew: false }, as: Dispatcher, captures: { route_id: $.data.id } }
