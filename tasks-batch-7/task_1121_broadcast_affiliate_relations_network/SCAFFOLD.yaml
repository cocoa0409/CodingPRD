  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary ISO8601 UTC timestamp. Default at server startup is 2026-05-01T00:00:00Z. Must be non-decreasing."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: Network
    side_effects:
      - "Network.current_utc updated"
      - "system transitions triggered by time passing (EXPIRING, LAPSED, EXPIRED) fire as needed"

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or invalid X-User-Role / X-User-ID" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not in endpoint.roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path parameter references non-existent or out-of-scope resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "target resource not in a state that permits the requested transition" }
  - { id: ERR_NETWORK_LOCKDOWN, http: 409, condition: "Network.posture == SWEEP_LOCKDOWN blocks preemption approvals" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "segregation of duties violated on renewal offer accept/reject/withdraw" }
  - { id: ERR_RATE_SUM_MISMATCH, http: 422, condition: "reverse_comp_pct + retrans_share_pct != 1.0" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "end time not strictly greater than start time" }
  - { id: ERR_AVAIL_POOL_EXHAUSTED, http: 409, condition: "cumulative confirmed local_minutes_claimed + new claim > avail_minutes_local_allocatable" }
  - { id: ERR_NO_WINDOW_OVERLAP, http: 422, condition: "alleged exclusivity window does not overlap territory protection window (half-open semantics)" }
  - { id: ERR_TERRITORY_EXCLUSIVITY_HELD, http: 409, condition: "another station already holds exclusivity in this DMA" }
  - { id: ERR_PREEMPTION_QUOTA_EXCEEDED, http: 422, condition: "cumulative approved preemption hours exceed 10% of clearance_obligation_hours for the period" }
  - { id: ERR_DUPLICATE_COMMITTED_SETTLEMENT, http: 409, condition: "another RetransSettlement in COMMITTED already exists for (station_id, period_index)" }
  - { id: ERR_CLAIMANT_NOT_HOLDER, http: 422, condition: "claimant_station_id does not hold exclusivity in the territory" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version does not match current AffiliationAgreement.version" }
  - { id: ERR_STALE_STATION_VERSION, http: 412, condition: "expected_station_version does not match current Station.version" }
  - { id: ERR_COUNTER_ROUND_EXHAUSTED, http: 409, condition: "counter_round_count >= 3; no further resubmission allowed" }
  - { id: ERR_FUTURE_OUTAGE, http: 422, condition: "OutageEvent.ended_at_utc > Network.current_utc" }
  - { id: ERR_INVALID_TERM_LENGTH, http: 422, condition: "proposed_term_months not in {12,24,36,48,60}" }
  - { id: ERR_FUTURE_PERIOD, http: 422, condition: "report period_index > Network.current_period_index" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field or malformed payload" }
  - { id: ERR_DEFICIENT_CLEARANCE, http: 409, condition: "attempted resolve-cleared with clearance_rate < 0.85" }
  - { id: ERR_STALE_VERSION_GENERIC, http: 412, condition: "generic stale-version fallback (unused; superseded by domain-specific codes)" }

roles:
  - name: PlatformAdmin
    description: "Top-level operator; creates networks, station groups, advances periods, drives test clock"
    identity: opaque
    exclusive_operations: ["POST /networks", "POST /station-groups", "POST /networks/{nid}/advance-period", "POST /_clock/set_current_utc"]
    shared_operations: ["GET on any resource"]

  - name: NetworkAffiliateRelations
    description: "Network-side affiliate relations operator; manages agreements, preemptions, settlements, audits"
    identity: opaque
    exclusive_operations:
      - "POST /networks/{nid}/territories"
      - "POST /networks/{nid}/programs"
      - "POST /networks/{nid}/stations/{sid}/agreements"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/submit"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/activate"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/terminate"
      - "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/begin-review"
      - "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/approve"
      - "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/deny"
      - "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/counter"
      - "POST /networks/{nid}/stations/{sid}/avail-allocations/{aid}/confirm"
      - "POST /networks/{nid}/stations/{sid}/avail-allocations/{aid}/revoke"
      - "POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/commit"
      - "POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/reconcile"
      - "POST /networks/{nid}/stations/{sid}/retrans-settlements/{rid}/void"
      - "POST /networks/{nid}/stations/{sid}/outage-events/{oid}/confirm"
      - "POST /networks/{nid}/stations/{sid}/outage-events/{oid}/reject"
      - "POST /networks/{nid}/stations/{sid}/outage-credits/{oid}/forfeit"
      - "POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/audit"
      - "POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/resolve-cleared"
      - "POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/resolve-disputed"
      - "POST /networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/validate"
      - "POST /networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/dismiss"
      - "POST /networks/{nid}/territories/{tid}/exclusivity-claims/{cid}/settle"
    shared_operations:
      - "POST /networks/{nid}/stations"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers (as NETWORK_AFFILIATE_RELATIONS proposer)"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/accept"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/reject"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/withdraw"
      - "POST /networks/{nid}/stations/{sid}/retrans-settlements"
      - "POST /networks/{nid}/stations/{sid}/outage-events"
      - "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/audit"
      - "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/resolve-pass"
      - "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/resolve-fail"
      - "GET on any resource"

  - name: StationGroupOwner
    description: "Station group owner; files clearance reports, requests preemptions, claims avails, files compliance, proposes renewal offers"
    identity: entity_backed:StationGroup
    exclusive_operations:
      - "POST /networks/{nid}/stations/{sid}/clearance-reports"
      - "POST /networks/{nid}/stations/{sid}/clearance-reports/{cid}/file"
      - "POST /networks/{nid}/stations/{sid}/preemptions"
      - "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/resubmit"
      - "POST /networks/{nid}/stations/{sid}/preemptions/{pid}/withdraw"
      - "POST /networks/{nid}/stations/{sid}/avail-allocations"
      - "POST /networks/{nid}/stations/{sid}/compliance-reports"
      - "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/submit"
      - "POST /networks/{nid}/territories/{tid}/exclusivity-claims"
    shared_operations:
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers (as STATION_GROUP_OWNER proposer)"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/accept"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/reject"
      - "POST /networks/{nid}/stations/{sid}/agreements/{aid}/renewal-offers/{oid}/withdraw"
      - "POST /networks/{nid}/stations/{sid}/retrans-settlements"
      - "POST /networks/{nid}/stations/{sid}/outage-events"
      - "GET on any resource"

  - name: ComplianceAuditor
    description: "Independent auditor; can create compliance reports and audit them, but cannot file clearance, propose renewals, or approve preemptions"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /networks/{nid}/stations/{sid}/compliance-reports"
      - "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/audit"
      - "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/resolve-pass"
      - "POST /networks/{nid}/stations/{sid}/compliance-reports/{cid}/resolve-fail"
      - "GET on any resource"
