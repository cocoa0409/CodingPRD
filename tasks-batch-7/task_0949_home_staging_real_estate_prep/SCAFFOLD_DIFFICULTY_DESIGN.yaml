              as: PlatformAdmin
            - call: "POST /staging/leases/${lease_id}/accrue-holdover"
              payload: {}
              as: BillingClerk
          assert:
            - "Lease.${lease_id}.state == HOLDOVER"
            - "Lease.${lease_id}.holdover_days == 8"
            - "Lease.${lease_id}.holdover_charge == 390.00"
            - "Lease.${lease_id}.pickup_window_end == 2026-10-20T09:00:00.000Z"

      - name: pickup_window_end_instant_is_inside_the_closed_interval
        grounds:
          - calculations.pickup_window
          - validations[priority=60]
          - errors[ERR_PICKUP_OUTSIDE_WINDOW]
          - entities.Pickup.fields.scheduled_at
        distinguishing_aspect: |
          BOUNDARY 4 — an INTERVAL-ENDPOINT inclusion on a FOURTH endpoint (pickup
          creation). scheduled_at exactly equal to pickup_window_end (2026-10-20T09:00:00Z)
