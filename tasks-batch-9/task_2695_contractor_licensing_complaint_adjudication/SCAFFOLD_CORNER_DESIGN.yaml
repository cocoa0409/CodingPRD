              payload: { full_name: "Ima Mutable", verified_experience_months: 60 }
              as: LicensingAnalyst
              captures: { qi_id: $.data.id }
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-10", score: 69, taken_on: "2025-03-01" }
              as: LicensingAnalyst
              captures: { ex1_id: $.data.id }
          trigger:
            - call: "POST /licensing/qualifying-individuals/${qi_id}/exam-results"
              payload: { exam_type: "TRADE", trade_code: "C-10", score: 88, taken_on: "2025-09-01" }
              as: LicensingAnalyst
              captures: { ex2_id: $.data.id }
            - call: "GET /licensing/qualifying-individuals/${qi_id}/exam-results?exam_type=TRADE"
              payload: {}
              as: LicensingAnalyst
          assert:
            - "${ex2_id} != ${ex1_id}"
            - "trigger call 2 response total_count == 2"
            - "ExamResult.${ex1_id}.score == 69"
            - "ExamResult.${ex1_id}.passed == false"
            - "ExamResult.${ex2_id}.score == 88"
            - "ExamResult.${ex2_id}.passed == true"
            - "ExamResult rows expose no version field and no updated_at field"

      - name: corner_exam_result_requires_an_existing_qualifying_individual_parent
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_QUALIFYING_INDIVIDUAL_NOT_FOUND]
          - endpoints[POST /licensing/qualifying-individuals/{id}/exam-results]
        distinguishing_aspect: "The nested exam-results route is parented on {id}: an unknown qualifier id returns ERR_QUALIFYING_INDIVIDUAL_NOT_FOUND (404) and no ExamResult row is written."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and one real qualifier whose exam list must stay empty"
