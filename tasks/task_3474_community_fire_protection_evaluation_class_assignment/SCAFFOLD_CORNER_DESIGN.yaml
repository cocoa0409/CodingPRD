      - name: split_class_stored_values
        claim_type: correct_result
        grounds: [calculations.total_points_divergence_and_class]
        excluded_because:
          difficulty_instance: "dual_variant_calc / water_variant_municipal_vs_rural_shuttle"
          rationale: "That instance asserts split_class values 4 (municipal, unverified alternate) and 3 (rural shuttle) on the two sheets."

      - name: provisional_premium_literal_at_create
        claim_type: correct_result
        grounds: [calculations.premium_amounts]
        excluded_because:
          difficulty_instance: "combinatorial_formula / premium_rounding_order_provisional_vs_final"
          rationale: "That instance asserts provisional_premium_cents == 412781 at creation and the 2-cent delta at bind."

      - name: draft_sheet_recompute_on_correction
        claim_type: correct_result
        grounds: [calculations.water_supply_points]
        excluded_because:
