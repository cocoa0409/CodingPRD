      - name: qualification_mismatch_and_dnr_block_offer_creation
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_QUALIFICATION_MISMATCH]
          - errors[ERR_SUBSTITUTE_DO_NOT_RETURN]
        distinguishing_aspect: "Safety layer at offer creation: an ACTIVE substitute without the required subject fails ERR_QUALIFICATION_MISMATCH, and an ACTIVE-qualified substitute on the school's DO_NOT_RETURN list fails ERR_SUBSTITUTE_DO_NOT_RETURN (priority 9 before 11)."
        test_recipe:
          setup: ["Sub A ACTIVE with only SCIENCE qualification; Sub B ACTIVE with MATH qualification but DNR-marked at the school; 1-day MATH absence"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
