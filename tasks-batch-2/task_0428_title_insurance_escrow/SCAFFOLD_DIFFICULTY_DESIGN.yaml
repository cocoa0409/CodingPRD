            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "POST /title/orders/${o_id}/transitions"
              payload: { to_status: "CLEAR_TO_CLOSE" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/deposits"
              payload: { amount_cents: 600000, source_ref: "WIRE-IN-4" }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { d_id: $.data.id }
            - call: "POST /title/deposits/${d_id}/transitions"
              payload: { to_status: "POSTED" }
              as: Underwriter
            - call: "GET /title/orders/${o_id}"
              as: Underwriter
              captures: { o_v_d1: $.data.version }
            - call: "POST /title/orders/${o_id}/disbursements"
              payload: { payee: "Payoff Bank", amount_cents: 200000, purpose: "PAYOFF", wire_window_start: "2026-01-20T09:00:00Z", wire_window_end: "2026-01-20T10:00:00Z", expected_order_version: "${o_v_d1}" }
              as: Underwriter
              captures: { disb1_id: $.data.id }
            - call: "POST /title/disbursements/${disb1_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: Underwriter
            - call: "POST /title/disbursements/${disb1_id}/transitions"
              payload: { to_status: "WIRED" }
              as: Underwriter
            - call: "GET /title/orders/${o_id}"
              as: Underwriter
              captures: { o_v_d2: $.data.version }
            - call: "POST /title/orders/${o_id}/disbursements"
              payload: { payee: "Seller", amount_cents: 200000, purpose: "SELLER_PROCEEDS", wire_window_start: "2026-01-20T09:30:00Z", wire_window_end: "2026-01-20T10:30:00Z", expected_order_version: "${o_v_d2}" }
              as: Underwriter
              captures: { disb2_id: $.data.id }
            - call: "POST /title/disbursements/${disb2_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: Underwriter
          trigger:
            - call: "POST /title/disbursements/${disb2_id}/transitions"
              payload: { to_status: "WIRED" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WIRE_WINDOW_OVERLAP"
            - "Disbursement.${disb2_id}.status == APPROVED (WIRE rejected)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: escrow_cash_invariant_deposit_post_then_reverse
        grounds:
          - calculations.escrow_balance
          - state_machines.EscrowDeposit.RECEIVED_to_POSTED
          - state_machines.EscrowDeposit.POSTED_to_REVERSED
          - entities.Order.fields.escrow_balance_cents
        distinguishing_aspect: |
          Conserved quantity = escrow trust cash. The invariant escrow_balance_cents ==
          sum(POSTED deposits) - sum(WIRED disbursements) holds throughout: posting a
          500000 deposit then reversing it returns escrow_balance_cents to its prior
          value 0 with zero drift.
        test_recipe:
          setup:
            - "An order with a single deposit 500000 posted then reversed."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-17", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id }
            - call: "POST /title/orders/${o_id}/deposits"
              payload: { amount_cents: 500000, source_ref: "WIRE-IN-5" }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { d_id: $.data.id }
            - call: "POST /title/deposits/${d_id}/transitions"
              payload: { to_status: "POSTED" }
              as: Underwriter
            - call: "GET /title/orders/${o_id}"
              as: Underwriter
              captures: { bal_after_post: $.data.escrow_balance_cents }
          trigger:
            - call: "POST /title/deposits/${d_id}/transitions"
              payload: { to_status: "REVERSED" }
              as: Underwriter
            - call: "GET /title/orders/${o_id}"
              as: Underwriter
              captures: { bal_after_reverse: $.data.escrow_balance_cents }
          assert:
            - "Order.${o_id}.escrow_deposit_total_cents == 0 after reversal"
            - "Order.${o_id}.escrow_balance_cents == 0 after reversal (returned to pre-deposit value; observed 500000 after POST)"

      - name: premium_conservation_split_then_reverse
        grounds:
          - calculations.premium_split
          - entities.PremiumRemittance.fields.gross_premium_cents
          - entities.PremiumRemittance.fields.agency_retained_cents
          - entities.PremiumRemittance.fields.underwriter_remit_cents
          - state_machines.PremiumRemittance.REMITTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity = gross premium dollars (a DIFFERENT quantity from escrow
          cash). On the split agency_retained_cents + underwriter_remit_cents ==
          gross_premium_cents (90200 + 19800 == 110000); voiding the policy reverses the
          remittance (REMITTED -> REVERSED) leaving the gross premium snapshot
          unchanged, no drift.
        test_recipe:
          setup:
            - "An ISSUED OWNER policy gross 110000 with its PremiumRemittance moved PENDING -> REMITTED, then the policy is VOIDed (cascade reverses the remittance)."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-18", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/commitments/${c_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: TitleOfficer
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
            - call: "GET /title/policies/${p_id}/remittances"
              as: Underwriter
              captures: { rem_id: "$.data[0].id", rem_gross: "$.data[0].gross_premium_cents" }
            - call: "POST /title/remittances/${rem_id}/transitions"
              payload: { to_status: "REMITTED" }
              as: Underwriter
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "VOID" }
              as: Underwriter
            - call: "GET /title/remittances/${rem_id}"
              as: Underwriter
              captures: { rem_status: $.data.status, rem_gross2: $.data.gross_premium_cents }
          assert:
            - "PremiumRemittance.${rem_id}.status == REVERSED"
            - "PremiumRemittance.${rem_id}.gross_premium_cents == 110000 (unchanged; agency_retained 90200 + underwriter_remit 19800 == 110000 preserved)"
            - "Policy.${p_id}.status == VOID"
