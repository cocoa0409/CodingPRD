  # =====================================================================
  # Rule 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: spot_window_half_open_overlap
        grounds:
          - state_machines.SpotOrder.REQUESTED_to_SCHEDULED
          - errors[ERR_SPOT_WINDOW_OVERLAP]
          - entities.Track.fields.spot_capacity
        distinguishing_aspect: |
          Resource = Track spot positions, semantics = half-open window overlap
          plus time-independent physical occupation: scheduling spot 1 for
          [14:00,16:00) while car A physically occupies spot 1 is rejected
          (ERR_SPOT_WINDOW_OVERLAP) regardless of window, while spot 2 at
          [12:30,14:00) — starting exactly at the resident window's end plus
          the 30-minute crew buffer — is accepted.
        test_recipe:
          setup:
            - "Facility (buffer 30); customer alloc 5; product clean=false; lot; track cap 2; car A SPOTTED on spot 1 (spot order window [10:00,12:00) executed at 10:30); car B ARRIVED with spot order SB (spot 1, window [14:00,16:00)) REQUESTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-O1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 2 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "92001", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { carA: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "92002", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { carB: $.data.id } }
            - { call: "POST /transload/railcars/${carA}/arrive", payload: {}, as: YardMaster, captures: { carA_v: $.data.version } }
            - { call: "POST /transload/railcars/${carB}/arrive", payload: {}, as: YardMaster, captures: { carB_v: $.data.version } }
            - { call: "POST /transload/railcars/${carA}/spot-orders", payload: { expected_railcar_version: "${carA_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z" }, as: YardMaster, captures: { soA: $.data.id } }
            - { call: "POST /transload/spot-orders/${soA}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:30:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${soA}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/railcars/${carB}/spot-orders", payload: { expected_railcar_version: "${carB_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T16:00:00Z" }, as: YardMaster, captures: { soB: $.data.id } }
          trigger:
            - { call: "POST /transload/spot-orders/${soB}/schedule", payload: {}, as: YardMaster, captures: { err: $.data.error_id } }
            - { call: "POST /transload/spot-orders/${soB}/cancel", payload: {}, as: YardMaster }
            - { call: "GET /transload/railcars/${carB}", payload: {}, as: YardMaster, captures: { carB_v2: $.data.version } }
            - { call: "POST /transload/railcars/${carB}/spot-orders", payload: { expected_railcar_version: "${carB_v2}", track_id: "${trk}", spot_number: 2, window_start: "2026-08-03T12:30:00Z", window_end: "2026-08-03T14:00:00Z" }, as: YardMaster, captures: { soB2: $.data.id } }
            - { call: "POST /transload/spot-orders/${soB2}/schedule", payload: {}, as: YardMaster, captures: { soB2_st: $.data.status } }
          assert:
            - "SB (spot 1, [14:00,16:00)) rejected: error_id == ERR_SPOT_WINDOW_OVERLAP — physical occupation is time-independent"
            - "SB2 (spot 2, [12:30,14:00)) accepted: status == SCHEDULED — its start equals A's window end (12:00) plus the 30-minute buffer exactly, and spot 2 is free"
            - "Track.occupied_spots == 1 and reserved_spots == 1 after SB2 schedules"
      - name: switch_crew_buffer_semantics
        grounds:
          - state_machines.SpotOrder.REQUESTED_to_SCHEDULED
          - errors[ERR_SWITCH_WINDOW_CONFLICT]
          - calculations.switching_fee
        distinguishing_aspect: |
          Resource = SwitchOrder crew schedule on a track, semantics =
          minimum-gap buffer (not half-open adjacency): a second move starting
          15 minutes after a scheduled move ends is rejected
          (ERR_SWITCH_WINDOW_CONFLICT), one starting exactly 30 minutes (==
          buffer) after is accepted, and any overlapping window on a DIFFERENT
          track is accepted — different resource entity and different interval
          semantics than the spot-window rule.
        test_recipe:
          setup:
            - "Facility (buffer 30); customer alloc 6; product clean=false; lot; tracks T1 (cap 2) and T2 (cap 1); cars C, D, E ARRIVED; SC (car C, T1 spot 1, [10:00,11:00)) SCHEDULED; SD (car D, T1 spot 2, [11:15,12:15)) REQUESTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-O2" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 6 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 2 }, as: FacilityAdmin, captures: { t1: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T2", spot_capacity: 1 }, as: FacilityAdmin, captures: { t2: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "93001", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { carC: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "93002", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { carD: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "93003", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { carE: $.data.id } }
            - { call: "POST /transload/railcars/${carC}/arrive", payload: {}, as: YardMaster, captures: { carC_v: $.data.version } }
            - { call: "POST /transload/railcars/${carD}/arrive", payload: {}, as: YardMaster, captures: { carD_v: $.data.version } }
            - { call: "POST /transload/railcars/${carE}/arrive", payload: {}, as: YardMaster, captures: { carE_v: $.data.version } }
            - { call: "POST /transload/railcars/${carC}/spot-orders", payload: { expected_railcar_version: "${carC_v}", track_id: "${t1}", spot_number: 1, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: YardMaster, captures: { soC: $.data.id } }
            - { call: "POST /transload/spot-orders/${soC}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /transload/railcars/${carD}/spot-orders", payload: { expected_railcar_version: "${carD_v}", track_id: "${t1}", spot_number: 2, window_start: "2026-08-03T11:15:00Z", window_end: "2026-08-03T12:15:00Z" }, as: YardMaster, captures: { soD: $.data.id } }
            - { call: "POST /transload/railcars/${carE}/spot-orders", payload: { expected_railcar_version: "${carE_v}", track_id: "${t2}", spot_number: 1, window_start: "2026-08-03T10:30:00Z", window_end: "2026-08-03T11:30:00Z" }, as: YardMaster, captures: { soE: $.data.id } }
          trigger:
            - { call: "POST /transload/spot-orders/${soD}/schedule", payload: {}, as: YardMaster, captures: { err: $.data.error_id } }
            - { call: "POST /transload/spot-orders/${soE}/schedule", payload: {}, as: YardMaster, captures: { soE_st: $.data.status } }
            - { call: "POST /transload/spot-orders/${soD}/cancel", payload: {}, as: YardMaster }
            - { call: "GET /transload/railcars/${carD}", payload: {}, as: YardMaster, captures: { carD_v2: $.data.version } }
            - { call: "POST /transload/railcars/${carD}/spot-orders", payload: { expected_railcar_version: "${carD_v2}", track_id: "${t1}", spot_number: 2, window_start: "2026-08-03T11:30:00Z", window_end: "2026-08-03T12:30:00Z" }, as: YardMaster, captures: { soD2: $.data.id } }
            - { call: "POST /transload/spot-orders/${soD2}/schedule", payload: {}, as: YardMaster, captures: { soD2_st: $.data.status } }
          assert:
            - "SD [11:15,12:15) rejected: error_id == ERR_SWITCH_WINDOW_CONFLICT (gap 15 min < buffer 30 from SC's [10:00,11:00) crew window)"
            - "SE on track T2 [10:30,11:30) accepted: status == SCHEDULED (different track resource, full overlap irrelevant)"
            - "SD2 [11:30,12:30) accepted: status == SCHEDULED (gap exactly == buffer 30 is allowed)"
  # =====================================================================
  # Rule 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ticket_certify_void_inventory_invariant
        grounds:
          - state_machines.WeightTicket.DRAFT_to_CERTIFIED
          - state_machines.WeightTicket.CERTIFIED_to_VOIDED
          - entities.InventoryLot.fields.quantity_on_hand_tons
        distinguishing_aspect: |
          Conserved quantity = lot tonnage: quantity_received_tons ==
          quantity_on_hand_tons + quantity_shipped_tons + quantity_rejected_tons
          must hold after certify (10 t moves on_hand -> shipped) AND after the
          compensating void (10 t returns) — 80 == 70 + 10 + 0 mid-way and
          80 == 80 + 0 + 0 after the void, with railcar and order mirrors
          restored exactly.
        test_recipe:
          setup:
            - "Facility; customer; clean=false product; lot (received 80.0 after arrive); track cap 1; equipment; car (80.0 t) SPOTTED; transfer order planned 40.0 t ACTIVE; DRAFT ticket net 10.000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-I1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "CONV-1", equipment_type: "CONVEYOR" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "94001", quantity_loaded_tons: 80.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 40.0 }, as: TransferOperator, captures: { to: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${to}/weight-tickets", payload: { truck_reference: "TRK-1", gross_weight_tons: 24.0, tare_weight_tons: 14.0, truck_max_payload_tons: 40.0 }, as: TransferOperator, captures: { wt: $.data.id } }
          trigger:
            - { call: "POST /transload/weight-tickets/${wt}/certify", payload: {}, as: TransferOperator }
            - { call: "GET /transload/lots/${lot}", payload: {}, as: TransferOperator, captures: { mid_recv: $.data.quantity_received_tons, mid_hand: $.data.quantity_on_hand_tons, mid_ship: $.data.quantity_shipped_tons } }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: TransferOperator, captures: { mid_rem: $.data.quantity_remaining_tons } }
            - { call: "POST /transload/weight-tickets/${wt}/void", payload: {}, as: TransferOperator, captures: { wt_st: $.data.status } }
            - { call: "GET /transload/lots/${lot}", payload: {}, as: TransferOperator, captures: { end_recv: $.data.quantity_received_tons, end_hand: $.data.quantity_on_hand_tons, end_ship: $.data.quantity_shipped_tons, end_rej: $.data.quantity_rejected_tons } }
            - { call: "GET /transload/railcars/${car}", payload: {}, as: TransferOperator, captures: { end_rem: $.data.quantity_remaining_tons } }
            - { call: "GET /transload/transfer-orders/${to}", payload: {}, as: TransferOperator, captures: { end_done: $.data.quantity_completed_tons } }
          assert:
            - "after certify: received 80.0 == on_hand 70.0 + shipped 10.0 + rejected 0.0; car remaining == 70.0"
            - "after void: received 80.0 == on_hand 80.0 + shipped 0.0 + rejected 0.0; car remaining == 80.0; order quantity_completed_tons == 0.0"
            - "WeightTicket.status == VOIDED; no drift in the conserved tonnage"
      - name: spot_cancel_reservation_and_charge_invariant
        grounds:
          - state_machines.SpotOrder.SCHEDULED_to_CANCELLED
          - state_machines.SwitchOrder.SCHEDULED_to_CANCELLED
          - state_machines.ChargeEntry.ACCRUED_to_VOIDED
          - entities.Track.fields.reserved_spots
        distinguishing_aspect: |
          Conserved quantities = track spot accounting and the charge ledger:
          occupied_spots + reserved_spots must equal physical occupants + open
          orders, and the customer's ACCRUED switching total must return to 0 —
          schedule pushes reserved 0->1 and adds an 18500-cent ACCRUED charge;
          the compensating cancel pops reserved back to 0, CANCELS the switch
          order, and VOIDS the charge.
        test_recipe:
          setup:
            - "Facility (free_switches_per_period 0); customer; product; lot; track cap 2 (empty: occupied 0, reserved 0); car ARRIVED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-I2" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 2 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "94002", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T12:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
          trigger:
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster, captures: { sw: $.data.switch_order_id } }
            - { call: "GET /transload/tracks/${trk}", payload: {}, as: YardMaster, captures: { mid_occ: $.data.occupied_spots, mid_res: $.data.reserved_spots } }
            - { call: "POST /transload/spot-orders/${so}/cancel", payload: {}, as: YardMaster, captures: { so_st: $.data.status } }
            - { call: "GET /transload/tracks/${trk}", payload: {}, as: YardMaster, captures: { end_occ: $.data.occupied_spots, end_res: $.data.reserved_spots } }
            - { call: "GET /transload/switch-orders/${sw}", payload: {}, as: YardMaster, captures: { sw_st: $.data.status } }
            - { call: "GET /transload/charges?customer_id=${cust}&charge_type=SWITCHING", payload: {}, as: BillingClerk, captures: { ch_st: "$.data[0].status", ch_amt: "$.data[0].amount_cents" } }
          assert:
            - "after schedule: Track.occupied_spots == 0 and reserved_spots == 1 (invariant: 1 open order)"
            - "after cancel: SpotOrder.status == CANCELLED; Track.occupied_spots == 0 and reserved_spots == 0 (invariant restored)"
            - "SwitchOrder.status == CANCELLED"
            - "the SWITCHING charge (amount_cents == 18500) is VOIDED — customer's ACCRUED switching total back to 0"
