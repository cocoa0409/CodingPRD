            - call: "POST /recreation/scholarship-awards/${aw}/release"
              payload: {}
              as: FundingOfficer
              as_user_id: "officer-2"
              captures: { aw_status_end: "$.data.status", aw_enc_end: "$.data.encumbered_cents" }
