        claim_type: rbac_denial
        grounds:
          - "roles[QualityOfficer]"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "RBAC denial precedes body-reference existence checks: even with bogus ids the QO gets 403, not 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /blood-bank/issue-records"
              payload: { order_id: "00000000-0000-0000-0000-000000000000", verified_by_user_id: "tech-b" }
              as: QualityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED_ROLE (priority 2 beats priority 5)"
