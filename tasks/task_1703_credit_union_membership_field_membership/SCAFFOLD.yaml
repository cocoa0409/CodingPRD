# =============================================================================
# SCAFFOLD.yaml — Credit Union Membership & Field of Membership
# =============================================================================

scenario: |
  Credit Union Membership & Field of Membership (federally chartered credit union): eligibility determination (employer/community/associational) & documentation, member share account opening & par value, family/household eligibility extension, expansion application to regulator & charter amendment, member service history & product eligibility tiers, dividend declaration & payment, member voting & annual meeting, closure of ineligible accounts

domain_name: credit-union-membership-fom
api_prefix: /credit-union

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  # Regulatory field-of-membership control: documented eligibility evidence,
  # regulator approval of charter amendments, segregation of duties between
  # filing and deciding officers, grace-period-driven forced closures, and a
  # full audit trail of reviews, declarations, and ballots.
  secondary_archetype: posture_driven_gating
  # Member eligibility posture (ACTIVE / INELIGIBLE_UNDER_REVIEW / GRACE_PERIOD /
  # CLOSED_INELIGIBLE) gates account opening, product enrollment, and ballot
  # casting; segment retirement cascades posture changes across the membership.
  complexity_layers:
    - optimistic_concurrency      # OCC on Charter.version (amendment filing baseline) and Member.version (profile patch)
    - cascading_side_effects      # grace expiry: Member -> ShareAccount -> ProductEnrollment; amendment effective: segment -> review -> member posture
    - rate_threshold_triggers     # tier thresholds (tenure/balance), dividend minimum-balance gate, quorum threshold, meeting 30-day gap
    - scheduled_deferred_actions  # amendment effective_date, dividend payable_date, grace_end_date, meeting windows — all driven by the logical clock
  entity_topology: flat           # all resources top-level under /credit-union; FK references in bodies; reverse reads via sub-resources / filtered lists
  state_machine_shape: cyclic     # dominant shape is cyclic: application documentation loop, member ineligibility cure loop, meeting adjourn->reconvene chain
  relationship_patterns:
    - one_to_many                 # charter->segments, member->accounts, declaration->payments, meeting->ballots, member->reviews
    - self_referential            # Member.sponsor_member_id -> Member.id (family/household extension); AnnualMeeting.reconvened_from_id -> AnnualMeeting.id
    - cross_aggregate             # application->segment/sponsor, enrollment->member+account, payment->declaration+account
  role_model: segregation_of_duties  # filer != approver on applications; flagger != decider on reviews; BoardDirector declares, OperationsOfficer pays; ComplianceOfficer files, Regulator approves
  consistency_model: immediate    # every mutation (incl. cascades and recomputes) is atomic and visible in the same response / subsequent reads
  difficulty_note: |
    Endpoint/entity counts exceed the Expert band midpoint because the scenario
    mandates eight regulatory workflows; difficulty is concentrated in the
    coupling (two OCC-guarded write surfaces, two depth-3 cascades, dual-variant
    dividend and tier calculations, closed-interval vs minimum-gap temporal
    rules) rather than in CRUD volume.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Charter
    parent: null
    common_fields: true
    fields:
      - { name: bond_type, type: enum, source: input, description: "Charter bond type", constraints: "one of SINGLE_OCCUPATIONAL | COMMUNITY | ASSOCIATIONAL | MULTIPLE_COMMON_BOND" }
      - { name: par_value_cents, type: integer, source: input, description: "Par value of one membership share in cents; PRIMARY share accounts must always hold at least this balance", constraints: "positive integer" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Charter status", constraints: "ACTIVE only; exactly one charter may exist per system (singleton)" }
      - { name: note, type: string, source: system, default: "", description: "version increments by 1 on every successful amendment submission (baseline rebinding) and on every amendment becoming EFFECTIVE" }

  - name: EligibilitySegment
    parent: Charter
    common_fields: true
    fields:
      - { name: charter_id, type: string, source: system, description: "FK -> Charter.id; owning charter" }
      - { name: segment_type, type: enum, source: input, description: "Segment class", constraints: "one of OCCUPATIONAL | COMMUNITY | ASSOCIATIONAL" }
      - { name: descriptor, type: string, source: input, description: "Employer name, community definition, or association name" }
      - { name: required_documents, type: array, source: input, description: "Document codes an applicant matching this segment must provide", constraints: "subset of GOVERNMENT_ID | EMPLOYER_LETTER | ADDRESS_PROOF | ASSOCIATION_CARD | RELATIONSHIP_PROOF" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED; RETIRED set when a RETIRE_SEGMENT amendment becomes EFFECTIVE" }
      - { name: retired_at, type: string, source: system, default: null, description: "Date (YYYY-MM-DD) the segment was retired, null while ACTIVE" }

  - name: CharterAmendmentApplication
    parent: Charter
    common_fields: true
    fields:
      - { name: charter_id, type: string, source: input, description: "FK -> Charter.id; charter being amended" }
      - { name: amendment_type, type: enum, source: input, description: "ADD_SEGMENT | RETIRE_SEGMENT" }
      - { name: proposed_segment_type, type: enum, source: input, description: "Required when amendment_type = ADD_SEGMENT", constraints: "OCCUPATIONAL | COMMUNITY | ASSOCIATIONAL; must be compatible with charter bond_type (single-bond charters accept only their own segment type)", default: null }
      - { name: proposed_segment_descriptor, type: string, source: input, description: "Required when amendment_type = ADD_SEGMENT", default: null }
      - { name: proposed_segment_required_documents, type: array, source: input, description: "Required when amendment_type = ADD_SEGMENT", default: null }
      - { name: retire_segment_ids, type: array, source: input, description: "Array of EligibilitySegment ids to retire; required (non-empty) when amendment_type = RETIRE_SEGMENT", default: null }
      - { name: effective_date, type: string, source: input, description: "Date (YYYY-MM-DD) the amendment takes effect once APPROVED; must be strictly later than the current date at submission and at approval" }
      - { name: baseline_charter_version, type: integer, source: system, description: "Charter.version observed at submission (equals the accepted expected_charter_version)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> APPROVED -> EFFECTIVE | SUBMITTED -> DENIED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the filing ComplianceOfficer" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the Regulator who approved/denied" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Reason recorded on denial" }
      - { name: applied_segment_id, type: string, source: system, default: null, description: "Id of the EligibilitySegment created when an ADD_SEGMENT amendment becomes EFFECTIVE (references EligibilitySegment.id)" }

  - name: MembershipApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_full_name, type: string, source: input, description: "Applicant legal name" }
      - { name: date_of_birth, type: string, source: input, description: "Applicant date of birth (YYYY-MM-DD)" }
      - { name: basis, type: enum, source: input, description: "Eligibility basis", constraints: "SEGMENT_MATCH | FAMILY | HOUSEHOLD" }
      - { name: segment_id, type: string, source: input, default: null, description: "FK -> EligibilitySegment.id; required when basis = SEGMENT_MATCH" }
      - { name: sponsor_member_id, type: string, source: input, default: null, description: "FK -> Member.id; required when basis = FAMILY or HOUSEHOLD" }
      - { name: relationship_to_sponsor, type: enum, source: input, default: null, description: "Required when basis = FAMILY or HOUSEHOLD", constraints: "FAMILY: SPOUSE | CHILD | PARENT | SIBLING | GRANDPARENT | GRANDCHILD; HOUSEHOLD: HOUSEHOLD_MEMBER" }
      - { name: documents_provided, type: array, source: input, description: "Document codes supplied with the application; grows via submit-documents" }
      - { name: required_documents, type: array, source: computed, description: "SEGMENT_MATCH: segment.required_documents; FAMILY: [GOVERNMENT_ID, RELATIONSHIP_PROOF]; HOUSEHOLD: [GOVERNMENT_ID, ADDRESS_PROOF]" }
      - { name: docs_complete, type: boolean, source: computed, description: "true iff every code in required_documents is present in documents_provided" }
      - { name: requested_document_codes, type: array, source: system, default: [], description: "Codes named by the latest request-documents call" }
      - { name: status, type: enum, source: system, default: UNDER_REVIEW, description: "UNDER_REVIEW <-> DOCS_REQUESTED loop; -> APPROVED | DENIED (terminal)" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filing MembershipOfficer" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the deciding officer; must differ from filed_by_user_id (segregation of duties)" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Reason recorded on denial" }
      - { name: resulting_member_id, type: string, source: system, default: null, description: "FK -> Member.id; member created by approval" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> MembershipApplication.id; originating application" }
      - { name: full_name, type: string, source: system, description: "Copied from application at approval" }
      - { name: date_of_birth, type: string, source: system, description: "Copied from application at approval" }
      - { name: eligibility_basis, type: enum, source: system, description: "SEGMENT_MATCH | FAMILY | HOUSEHOLD (copied from application)" }
      - { name: segment_id, type: string, source: system, default: null, description: "FK -> EligibilitySegment.id; set when basis = SEGMENT_MATCH" }
      - { name: sponsor_member_id, type: string, source: system, default: null, description: "FK -> Member.id; set when basis = FAMILY or HOUSEHOLD (self-referential extension)" }
      - { name: relationship_to_sponsor, type: string, source: system, default: null, description: "Copied from application" }
      - { name: membership_effective_date, type: string, source: system, description: "Date (YYYY-MM-DD) of the logical clock at approval; anchor for tenure" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> INELIGIBLE_UNDER_REVIEW -> GRACE_PERIOD -> CLOSED_INELIGIBLE; cure loops back to ACTIVE" }
      - { name: grace_end_date, type: string, source: system, default: null, description: "Date at which an uncured GRACE_PERIOD member is closed by the clock sweep; = confirmation date + 90 days" }
      - { name: tier, type: enum, source: system, default: STANDARD, description: "Materialized product-eligibility tier: STANDARD | SELECT | PREMIER; updated only by tier-review (trailing-90-average basis)" }
      - { name: last_tier_review_at, type: string, source: system, default: null, description: "Timestamp of the latest tier-review call" }
      - { name: mailing_address, type: string, source: input, default: null, description: "PATCH-able contact field" }
      - { name: email, type: string, source: input, default: null, description: "PATCH-able contact field" }
      - { name: phone, type: string, source: input, default: null, description: "PATCH-able contact field" }
      - { name: tenure_months, type: integer, source: computed, description: "Full calendar months from membership_effective_date to current date: (y2-y1)*12 + (m2-m1) - (1 if day(now) < day(effective) else 0)" }
      - { name: qualifying_balance_cents, type: integer, source: computed, description: "Current-point-in-time sum of balance_cents over the member's OPEN share accounts" }

  - name: ShareAccount
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: account_type, type: enum, source: input, description: "PRIMARY (exactly one per member, par-value floor applies) | SUPPLEMENTAL" }
      - { name: balance_cents, type: integer, source: computed, description: "Derived from ShareTransaction replay; equals running_balance_cents of the latest transaction in (posted_date ASC, created_at ASC) order" }
      - { name: opened_date, type: string, source: system, description: "Date of the logical clock at opening" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> CLOSED (manual or forced by member ineligibility cascade)" }
      - { name: closed_date, type: string, source: system, default: null, description: "Date of closure" }
      - { name: closure_reason, type: enum, source: system, default: null, description: "MANUAL | FORCED_INELIGIBILITY" }

  - name: ShareTransaction
    parent: ShareAccount
    common_fields: false
    fields:
      - { name: share_account_id, type: string, source: system, description: "FK -> ShareAccount.id; owning account" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | WITHDRAWAL for posted transactions; system also writes DIVIDEND_CREDIT and CLOSURE_DISBURSEMENT", constraints: "endpoint accepts DEPOSIT | WITHDRAWAL only" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount in cents" }
      - { name: posted_date, type: string, source: input, description: "Effective date (YYYY-MM-DD); must be >= account opened_date and <= current date (backdating allowed)" }
      - { name: running_balance_cents, type: integer, source: computed, description: "Balance after this row in full chronological replay ordered by (posted_date ASC, created_at ASC)" }
      - { name: origin, type: enum, source: system, description: "MANUAL (posted via endpoint) | SYSTEM (opening deposit, dividend credit, closure disbursement)" }

  - name: ProductEnrollment
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrolled member" }
      - { name: product_code, type: enum, source: input, description: "MONEY_MARKET (requires SELECT) | SHARE_CERTIFICATE (requires SELECT) | PREMIER_LOAN (requires PREMIER)" }
      - { name: funding_share_account_id, type: string, source: input, description: "FK -> ShareAccount.id; must belong to the member and be OPEN" }
      - { name: required_tier, type: enum, source: computed, description: "Tier required by product_code: MONEY_MARKET/SHARE_CERTIFICATE -> SELECT; PREMIER_LOAN -> PREMIER" }
      - { name: tier_at_enrollment, type: enum, source: computed, description: "Tier computed at enrollment on the CURRENT_POINT_IN_TIME basis (not the materialized member.tier)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> CLOSED (only via forced cascade when the funding account closes)" }
      - { name: closure_reason, type: enum, source: system, default: null, description: "FORCED_ACCOUNT_CLOSURE" }

  - name: DividendDeclaration
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: string, source: input, description: "First day of the dividend period (YYYY-MM-DD, inclusive)" }
      - { name: period_end, type: string, source: input, description: "Last day of the dividend period (YYYY-MM-DD, inclusive)" }
      - { name: rate_bps, type: integer, source: input, description: "Nominal annual dividend rate in basis points", constraints: "10 <= rate_bps <= 1500 (board-authorized band)" }
      - { name: method, type: enum, source: input, description: "AVERAGE_DAILY_BALANCE | MINIMUM_DAILY_BALANCE; pinned at declaration and reused at payment recompute" }
      - { name: payable_date, type: string, source: input, description: "Date the dividend becomes payable; must be strictly later than period_end" }
      - { name: status, type: enum, source: system, default: DECLARED, description: "DECLARED -> PAID | VOIDED (both terminal)" }
      - { name: declared_pool_cents, type: integer, source: computed, description: "Sum of per-account accrued_amount_cents (each rounded to integer cents half-up BEFORE summation) at declaration time" }
      - { name: paid_total_cents, type: integer, source: computed, default: null, description: "Sum of credited_amount_cents after the payment run; null until PAID" }
      - { name: declared_by_user_id, type: string, source: system, description: "X-User-ID of the declaring BoardDirector" }
      - { name: paid_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the OperationsOfficer who ran payment" }

  - name: DividendPayment
    parent: DividendDeclaration
    common_fields: true
    fields:
      - { name: declaration_id, type: string, source: system, description: "FK -> DividendDeclaration.id" }
      - { name: share_account_id, type: string, source: system, description: "FK -> ShareAccount.id" }
      - { name: accrued_amount_cents, type: integer, source: computed, description: "Provisional amount computed at declaration (tier bonus at declaration date)" }
      - { name: credited_amount_cents, type: integer, source: computed, default: null, description: "Final amount recomputed at payment run from full transaction history (tier bonus at payment date); null until CREDITED" }
      - { name: accrual_delta_cents, type: integer, source: computed, default: null, description: "credited_amount_cents - accrued_amount_cents; non-zero when backdated transactions or tier changes intervened" }
      - { name: tier_bonus_bps_applied, type: integer, source: computed, description: "Tier bonus used in the latest computation (0 | 25 | 50)" }
      - { name: status, type: enum, source: system, default: ACCRUED, description: "ACCRUED -> CREDITED | VOIDED (voided by declaration void, or at payment run when the account is CLOSED or fails the minimum-balance gate on recompute)" }

  - name: AnnualMeeting
    parent: null
    common_fields: true
    fields:
      - { name: meeting_date, type: string, source: input, description: "Date of the meeting (YYYY-MM-DD)" }
      - { name: record_date, type: string, source: input, description: "Voting-eligibility cutoff; only members with membership_effective_date <= record_date may vote" }
      - { name: voting_open_date, type: string, source: input, description: "First day ballots are accepted", constraints: "record_date < voting_open_date <= meeting_date" }
      - { name: quorum_threshold, type: integer, source: input, description: "Minimum count of distinct chain voters for quorum", constraints: "positive integer" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> HELD | ADJOURNED_NO_QUORUM; an ADJOURNED meeting spawns a successor via reconvene" }
      - { name: reconvened_from_id, type: string, source: system, default: null, description: "FK -> AnnualMeeting.id; set on the successor created by reconvene" }
      - { name: quorum_met, type: boolean, source: computed, default: null, description: "Result recorded at close-and-tally" }
      - { name: ballots_counted, type: integer, source: computed, default: null, description: "Distinct member count over the reconvene chain at close-and-tally (immutable snapshot)" }
      - { name: votes_for_slate_a, type: integer, source: computed, default: null, description: "Chain-wide FOR_SLATE_A count at close-and-tally" }
      - { name: votes_for_slate_b, type: integer, source: computed, default: null, description: "Chain-wide FOR_SLATE_B count at close-and-tally" }
      - { name: votes_abstain, type: integer, source: computed, default: null, description: "Chain-wide ABSTAIN count at close-and-tally (counts toward quorum, toward neither slate)" }

  - name: Ballot
    parent: AnnualMeeting
    common_fields: false
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> AnnualMeeting.id; meeting the ballot is cast on" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; equals X-User-ID of the casting Member" }
      - { name: choice, type: enum, source: input, description: "FOR_SLATE_A | FOR_SLATE_B | ABSTAIN" }
      - { name: cast_date, type: string, source: system, description: "Date of the logical clock at casting" }

  - name: EligibilityReview
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member under review" }
      - { name: reason, type: enum, source: input, description: "MANUAL_FLAG when created via endpoint; SEGMENT_RETIRED when created by the amendment cascade", constraints: "endpoint accepts MANUAL_FLAG only" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> CURED | CONFIRMED_INELIGIBLE (both terminal)" }
      - { name: flagged_by_user_id, type: string, source: system, description: "X-User-ID of the creator (or 'system' for cascade-created reviews)" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the curing/confirming officer; must differ from flagged_by_user_id (segregation of duties)" }
      - { name: resolution_note, type: string, source: system, default: null, description: "Note recorded on cure" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: MembershipApplication
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: DOCS_REQUESTED
        trigger: "POST /credit-union/membership-applications/{id}/request-documents"
        actor: MembershipOfficer
        preconditions:
          - "Application status == UNDER_REVIEW (ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "requested_document_codes replaced with the request payload"
      - from: DOCS_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /credit-union/membership-applications/{id}/submit-documents"
        actor: MembershipOfficer
        preconditions:
          - "Application status == DOCS_REQUESTED (ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "documents_provided = union(documents_provided, payload documents_provided)"
          - "docs_complete recomputed"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /credit-union/membership-applications/{id}/approve"
        actor: MembershipOfficer
        preconditions:
          - "docs_complete == true (ERR_DOCUMENTATION_INCOMPLETE)"
          - "basis = SEGMENT_MATCH -> segment.status == ACTIVE at approval time (ERR_SEGMENT_NOT_ACTIVE)"
          - "basis IN {FAMILY, HOUSEHOLD} -> sponsor member.status == ACTIVE at approval time (ERR_SPONSOR_NOT_ELIGIBLE)"
          - "deciding X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Create Member: status ACTIVE, tier STANDARD, membership_effective_date = current clock date, application/basis/segment/sponsor fields copied"
          - "resulting_member_id set to the new Member.id"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /credit-union/membership-applications/{id}/deny"
        actor: MembershipOfficer
        preconditions:
          - "deciding X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "denial_reason recorded"
      - from: DOCS_REQUESTED
        to: DENIED
        trigger: "POST /credit-union/membership-applications/{id}/deny"
        actor: MembershipOfficer
        preconditions:
          - "deciding X-User-ID != filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "denial_reason recorded"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [CLOSED_INELIGIBLE]
    transitions:
      - from: ACTIVE
        to: INELIGIBLE_UNDER_REVIEW
        trigger: "POST /credit-union/members/{id}/eligibility-reviews (manual) OR system (segment retirement cascade)"
        actor: ComplianceOfficer | system
        preconditions:
          - "Member status IN {ACTIVE, GRACE_PERIOD} for manual creation (ERR_MEMBER_NOT_ACTIVE otherwise); cascade creation requires ACTIVE"
          - "When created from GRACE_PERIOD the member's status and grace_end_date are unchanged (review is OPEN alongside grace)"
        side_effects:
          - "EligibilityReview created with status OPEN (reason MANUAL_FLAG or SEGMENT_RETIRED)"
          - "Member status -> INELIGIBLE_UNDER_REVIEW only when created from ACTIVE"
      - from: INELIGIBLE_UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /credit-union/eligibility-reviews/{id}/cure"
        actor: ComplianceOfficer
        preconditions:
          - "Review status == OPEN (ERR_REVIEW_INVALID_STATE)"
          - "deciding X-User-ID != review.flagged_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Review -> CURED"
      - from: INELIGIBLE_UNDER_REVIEW
        to: GRACE_PERIOD
        trigger: "POST /credit-union/eligibility-reviews/{id}/confirm-ineligible"
        actor: ComplianceOfficer
        preconditions:
          - "Review status == OPEN (ERR_REVIEW_INVALID_STATE)"
          - "deciding X-User-ID != review.flagged_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Review -> CONFIRMED_INELIGIBLE"
          - "grace_end_date = current clock date + 90 days"
      - from: GRACE_PERIOD
        to: ACTIVE
        trigger: "POST /credit-union/members/{id}/eligibility-reviews (accepted while GRACE_PERIOD; leaves status unchanged) immediately followed by POST /credit-union/eligibility-reviews/{newId}/cure"
        actor: ComplianceOfficer
        preconditions:
          - "New review status == OPEN (ERR_REVIEW_INVALID_STATE)"
          - "deciding X-User-ID != new review's flagged_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "New review -> CURED"
          - "grace_end_date cleared to null"
        note: "The original CONFIRMED_INELIGIBLE review is terminal and cannot be cured; late cure within grace requires a fresh review that is immediately cured."
      - from: GRACE_PERIOD
        to: CLOSED_INELIGIBLE
        trigger: "system (clock sweep: POST /_clock/set_current_utc advancing current date to >= grace_end_date)"
        actor: system
        preconditions:
          - "Member status == GRACE_PERIOD and current date >= grace_end_date"
        side_effects:
          - "For every OPEN ShareAccount of the member (oldest opened_date first): account -> CLOSED with closure_reason FORCED_INELIGIBILITY, a SYSTEM ShareTransaction kind=CLOSURE_DISBURSEMENT for the full balance is written (posted_date = current date), balance_cents -> 0"
          - "Each such account closure itself closes every ACTIVE ProductEnrollment whose funding_share_account_id = that account (closure_reason FORCED_ACCOUNT_CLOSURE)"
          - "Member version increments"

  - entity: CharterAmendmentApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, EFFECTIVE]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /credit-union/charter-amendment-applications/{id}/approve"
        actor: Regulator
        preconditions:
          - "Application status == SUBMITTED (ERR_AMENDMENT_INVALID_STATE)"
          - "effective_date strictly later than current clock date (ERR_EFFECTIVE_DATE_NOT_FUTURE)"
        side_effects:
          - "decided_by_user_id recorded"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /credit-union/charter-amendment-applications/{id}/deny"
        actor: Regulator
        preconditions:
          - "Application status == SUBMITTED (ERR_AMENDMENT_INVALID_STATE)"
        side_effects:
          - "denial_reason recorded"
      - from: APPROVED
        to: EFFECTIVE
        trigger: "system (clock sweep: current date >= effective_date)"
        actor: system
        preconditions:
          - "Application status == APPROVED"
        side_effects:
          - "Charter.version increments by 1"
          - "ADD_SEGMENT: create EligibilitySegment(status ACTIVE) from proposed_* fields; applied_segment_id set"
          - "RETIRE_SEGMENT: each listed segment -> RETIRED (retired_at = current date); each retirement itself creates an OPEN EligibilityReview (reason SEGMENT_RETIRED) for every Member with segment_id = retired segment AND eligibility_basis = SEGMENT_MATCH AND status = ACTIVE, and each such Member -> INELIGIBLE_UNDER_REVIEW"
          - "Sweep applies amendments in (effective_date ASC, created_at ASC) order"

  - entity: ShareAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /credit-union/share-accounts/{id}/close (manual) OR system (member ineligibility cascade)"
        actor: MembershipOfficer | system
        preconditions:
          - "Account status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "Manual close of a PRIMARY account requires member.status != ACTIVE (ERR_PRIMARY_ACCOUNT_REQUIRED); the system cascade bypasses this guard"
        side_effects:
          - "SYSTEM ShareTransaction kind=CLOSURE_DISBURSEMENT amount = current balance_cents, posted_date = current date; balance_cents -> 0"
          - "closed_date set; closure_reason MANUAL | FORCED_INELIGIBILITY"
          - "Every ACTIVE ProductEnrollment with funding_share_account_id = this account -> CLOSED (closure_reason FORCED_ACCOUNT_CLOSURE)"

  - entity: DividendDeclaration
    initial_state: DECLARED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DECLARED
        to: VOIDED
        trigger: "POST /credit-union/dividend-declarations/{id}/void"
        actor: BoardDirector
        preconditions:
          - "Declaration status == DECLARED (ERR_DECLARATION_INVALID_STATE)"
        side_effects:
          - "Every ACCRUED DividendPayment of the declaration -> VOIDED (no account balance is touched; accrual never moves money)"
      - from: DECLARED
        to: PAID
        trigger: "POST /credit-union/dividend-declarations/{id}/pay"
        actor: OperationsOfficer
        preconditions:
          - "Declaration status == DECLARED (ERR_DECLARATION_INVALID_STATE)"
          - "current clock date >= payable_date (ERR_DIVIDEND_NOT_YET_PAYABLE)"
        side_effects:
          - "Each ACCRUED payment is recomputed from full transaction history with the tier bonus at payment date; if the account is now CLOSED or the recomputed average balance fails the minimum-balance gate, the row -> VOIDED; otherwise row -> CREDITED with credited_amount_cents and accrual_delta_cents set, and a SYSTEM ShareTransaction kind=DIVIDEND_CREDIT posted_date = payable_date credits the account (balance_cents increases, account version increments)"
          - "paid_total_cents = sum of credited_amount_cents over CREDITED rows"

  - entity: DividendPayment
    initial_state: ACCRUED
    terminal_states: [CREDITED, VOIDED]
    transitions:
      - from: ACCRUED
        to: CREDITED
        trigger: "system (declaration payment run)"
        actor: system
        preconditions:
          - "Account OPEN and recomputed average balance >= minimum gate"
        side_effects:
          - "credited_amount_cents, accrual_delta_cents, tier_bonus_bps_applied recorded; DIVIDEND_CREDIT transaction written"
      - from: ACCRUED
        to: VOIDED
        trigger: "system (declaration void, or payment-run exclusion)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AnnualMeeting
    initial_state: SCHEDULED
    terminal_states: [HELD, ADJOURNED_NO_QUORUM]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /credit-union/annual-meetings/{id}/close-and-tally"
        actor: BoardDirector
        preconditions:
          - "Meeting status == SCHEDULED (ERR_MEETING_INVALID_STATE)"
          - "Distinct chain voter count >= quorum_threshold (otherwise ADJOURNED_NO_QUORUM — not an error)"
        side_effects:
          - "quorum_met = true; ballots_counted and per-choice tallies recorded as an immutable snapshot over the reconvene chain"
      - from: SCHEDULED
        to: ADJOURNED_NO_QUORUM
        trigger: "POST /credit-union/annual-meetings/{id}/close-and-tally"
        actor: BoardDirector
        preconditions:
          - "Meeting status == SCHEDULED (ERR_MEETING_INVALID_STATE)"
          - "Distinct chain voter count < quorum_threshold"
        side_effects:
          - "quorum_met = false; snapshot tallies recorded; ballots already cast remain valid for the chain"
      - from: ADJOURNED_NO_QUORUM
        to: SCHEDULED
        trigger: "POST /credit-union/annual-meetings/{id}/reconvene (creates a NEW AnnualMeeting with reconvened_from_id = this meeting; record_date and quorum_threshold inherited)"
        actor: BoardDirector
        preconditions:
          - "Source meeting status == ADJOURNED_NO_QUORUM (ERR_MEETING_INVALID_STATE)"
        side_effects:
          - "New meeting created in SCHEDULED; ballots cast anywhere in the chain count toward the successor's quorum and tallies; the 30-day minimum-gap rule is exempt for meetings in the same chain"
        note: "The cycle lives at chain level: an adjourned meeting is terminal for voting but spawns a successor; the chain loops until quorum is met."

  - entity: EligibilityReview
    initial_state: OPEN
    terminal_states: [CURED, CONFIRMED_INELIGIBLE]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /credit-union/eligibility-reviews/{id}/cure"
        actor: ComplianceOfficer
        preconditions:
          - "Review status == OPEN (ERR_REVIEW_INVALID_STATE)"
          - "deciding X-User-ID != flagged_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Member status IN {INELIGIBLE_UNDER_REVIEW, GRACE_PERIOD} (ERR_MEMBER_NOT_ACTIVE is NOT used here; mismatch yields ERR_REVIEW_INVALID_STATE)"
        side_effects:
          - "Member -> ACTIVE; grace_end_date cleared to null if it was set"
      - from: OPEN
        to: CONFIRMED_INELIGIBLE
        trigger: "POST /credit-union/eligibility-reviews/{id}/confirm-ineligible"
        actor: ComplianceOfficer
        preconditions:
          - "Review status == OPEN (ERR_REVIEW_INVALID_STATE)"
          - "deciding X-User-ID != flagged_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Member status == INELIGIBLE_UNDER_REVIEW (ERR_REVIEW_INVALID_STATE otherwise)"
        side_effects:
          - "Member -> GRACE_PERIOD; grace_end_date = current clock date + 90 days"

  - entity: ProductEnrollment
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system (funding share account closed)"
        actor: system
        preconditions:
          - "funding account transitioned OPEN -> CLOSED"
        side_effects:
          - "closure_reason = FORCED_ACCOUNT_CLOSURE"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: charter-amendment-stale-baseline
    parent_entity: Charter
    write_endpoint: "POST /credit-union/charter-amendment-applications"
    occ_field: expected_charter_version
    description: |
      Filing a charter amendment against a Charter whose version has advanced
      since the filer last observed it is rejected. Another amendment submission
      or an amendment becoming EFFECTIVE re-baselines the charter, so the
      filer's view is stale and must be refreshed before filing.
    error_id: ERR_STALE_CHARTER_VERSION
    http_status: 412
  - rule_id: member-patch-stale-version
    parent_entity: Member
    write_endpoint: "PATCH /credit-union/members/{id}"
    occ_field: expected_member_version
    description: |
      Updating a Member profile whose version has advanced since the caller
      last read it is rejected. Tier reviews and eligibility cascades also
      advance Member.version, so profile patches must be based on a fresh read.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: dividend_accrual
    trigger: "dividend declaration creation (provisional accrual) and payment run (final recompute with the same pinned method)"
    algorithm: aggregation
    formula: |
      Account window W = [max(period_start, account.opened_date), period_end], dates inclusive.
      day_count = days in W.
      End-of-day balance on day d = balance after replaying all ShareTransactions with
        posted_date <= d in (posted_date ASC, created_at ASC) order.
      AVERAGE_DAILY_BALANCE variant:
        raw = (sum of end-of-day balances over W) * (effective_rate_bps / 10000) / 365
      MINIMUM_DAILY_BALANCE variant:
        raw = (minimum end-of-day balance over W) * (effective_rate_bps / 10000) * day_count / 365
      effective_rate_bps = declaration.rate_bps + tier_bonus(owner member tier)
      tier_bonus: STANDARD -> 0, SELECT -> 25, PREMIER -> 50
      Tier used: at accrual, member.tier as of the declaration date; at payment recompute,
        member.tier as of the payment date.
      Minimum-balance gate: if (sum of end-of-day balances over W) / day_count < 500, the
        account earns nothing (no row at accrual; row VOIDED at payment recompute).
      amount_cents = round_half_up(raw) applied ONCE per account (integer cents).
    input_set: "ShareAccounts with status OPEN at computation time and opened_date <= period_end; CLOSED accounts are excluded entirely; eligible accounts are processed (and DividendPayment rows created) in (opened_date ASC, created_at ASC) order"
    constants:
      DAYS_IN_YEAR: 365
      MIN_AVG_BALANCE_FOR_DIVIDEND_CENTS: 500
      SELECT_TIER_BONUS_BPS: 25
      PREMIER_TIER_BONUS_BPS: 50
    precision: "integer cents, round_half_up, applied once per account after summation over the window"
    variants:
      - name: average_daily_balance
        when: "declaration.method = AVERAGE_DAILY_BALANCE"
        difference: "dividend proportional to the mean end-of-day balance over the window"
      - name: minimum_daily_balance
        when: "declaration.method = MINIMUM_DAILY_BALANCE"
        difference: "dividend proportional to the window's minimum end-of-day balance; identical inputs yield a strictly smaller amount whenever the balance ever dips below the maximum"
      - name: provisional_accrual
        when: "declaration creation"
        difference: "uses transaction history and member tier as of the declaration date; stored as accrued_amount_cents"
      - name: final_recompute
        when: "payment run"
        difference: "replays the full transaction history including backdated rows posted after declaration, and uses the member tier as of the payment date; result stored as credited_amount_cents with accrual_delta_cents = credited - accrued"

  - name: dividend_pool_total
    trigger: "declaration creation (declared_pool_cents) and payment run (paid_total_cents)"
    algorithm: aggregation
    formula: |
      declared_pool_cents = sum over eligible accounts of round_half_up(per-account raw)
      paid_total_cents    = sum over CREDITED rows of credited_amount_cents
      Rounding order is pinned: each per-account amount is rounded to integer cents
      (round_half_up) BEFORE the pool sum is taken. Summing raw values first and
      rounding once is forbidden and yields a different total.
    input_set: "DividendPayment rows of the declaration (ACCRUED for the pool at declaration; CREDITED for paid_total)"
    constants: {}
    precision: "integer cents; per-account rounding precedes summation"

  - name: member_tier_evaluation
    trigger: "product enrollment (CURRENT_POINT_IN_TIME variant, computed ad hoc, not stored on member) and POST /members/{id}/tier-review (TRAILING_90_AVERAGE variant, materialized onto member.tier)"
    algorithm: threshold
    formula: |
      tenure_months = (y2-y1)*12 + (m2-m1) - (1 if day(eval_date) < day(membership_effective_date) else 0)
      balance basis:
        CURRENT_POINT_IN_TIME: sum of balance_cents over the member's OPEN share accounts at eval time
        TRAILING_90_AVERAGE:   average of the daily aggregate end-of-day balance (sum over the
                               member's accounts open that day) over the 90-day window
                               [eval_date - 89 days, eval_date], dates inclusive
      tier = PREMIER if tenure_months >= 36 AND balance >= 2500000
             else SELECT if tenure_months >= 12 AND balance >= 500000
             else STANDARD
      Both thresholds use >= (exact boundary qualifies).
    input_set: "member's share accounts (OPEN only for CURRENT; historical daily aggregate for TRAILING)"
    constants:
      SELECT_TENURE_MONTHS: 12
      SELECT_BALANCE_CENTS: 500000
      PREMIER_TENURE_MONTHS: 36
      PREMIER_BALANCE_CENTS: 2500000
      TRAILING_WINDOW_DAYS: 90
    precision: "integer cents comparison; no rounding"
    variants:
      - name: current_point_in_time
        when: "product enrollment"
        difference: "uses the instantaneous aggregate balance; a member with a recent large deposit qualifies immediately"
      - name: trailing_90_average
        when: "tier-review"
        difference: "uses the 90-day average; the same member on the same day can evaluate to a lower tier than the enrollment-time variant"

  - name: quorum_and_tally
    trigger: "POST /annual-meetings/{id}/close-and-tally"
    algorithm: threshold
    formula: |
      chain = the meeting plus all meetings reachable by following reconvened_from_id links backwards
      chain_ballots = Ballots whose meeting_id is in the chain
      distinct_voters = count of distinct member_id over chain_ballots
      quorum_met = (distinct_voters >= quorum_threshold)   # exact boundary meets quorum
      votes_for_slate_a = count of chain_ballots with choice = FOR_SLATE_A
      votes_for_slate_b = count of chain_ballots with choice = FOR_SLATE_B
      votes_abstain     = count of chain_ballots with choice = ABSTAIN (counts toward quorum)
      ballots_counted   = distinct_voters
      Snapshots are recorded on the tallied meeting and never rewritten by later reconvenes.
    input_set: "Ballot rows over the reconvene chain; no status filter (ballots are immutable); duplicate member votes are impossible by the chain-uniqueness constraint"
    constants: {}
    precision: "integer counts; >= boundary"

  - name: share_balance_replay
    trigger: "any ShareTransaction insert (including backdated posted_date), dividend credit, closure disbursement, and every dividend computation"
    algorithm: chronological
    formula: |
      Order all ShareTransactions of the account by (posted_date ASC, created_at ASC).
      Replay: DEPOSIT/DIVIDEND_CREDIT add amount_cents; WITHDRAWAL/CLOSURE_DISBURSEMENT subtract.
      running_balance_cents recorded per row; account.balance_cents = last running value.
      A backdated insert re-runs the full replay and rewrites running balances of later rows.
    input_set: "all ShareTransaction rows of the account (any kind, any origin)"
    constants: {}
    precision: "integer cents; no rounding"

  - name: par_value_guard
    trigger: "share account opening and every WITHDRAWAL on a PRIMARY account"
    algorithm: threshold
    formula: |
      opening: initial_deposit_cents >= charter.par_value_cents (exact boundary allowed)
      withdrawal on PRIMARY: balance_cents - amount_cents >= charter.par_value_cents
      withdrawal on SUPPLEMENTAL: balance_cents - amount_cents >= 0
    input_set: "the target account and the singleton ACTIVE charter"
    constants: {}
    precision: "integer cents; >= boundary"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is permitted on the endpoint per the roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Member role ownership: X-User-ID equals the member id addressed by the path (for /members/{id}* and /share-accounts/{id}* the owning member)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-role-accessible endpoints (GET member/accounts/transactions/ballots/payments, POST ballots)"
  - priority: 4
    category: existence
    check: "Syntactic validity: required fields present, types correct, enum values in range, basis-field combinations present (SEGMENT_MATCH requires segment_id; FAMILY/HOUSEHOLD require sponsor_member_id and relationship_to_sponsor; ADD_SEGMENT amendments require proposed_* fields; RETIRE_SEGMENT requires non-empty retire_segment_ids)"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 6
    category: state
    check: "OCC: expected_charter_version == Charter.version on amendment submission; expected_member_version == Member.version on member PATCH"
    error_id: "ERR_STALE_CHARTER_VERSION | ERR_STALE_MEMBER_VERSION"
    http_status: 412
    applies_to: "POST /charter-amendment-applications, PATCH /members/{id}"
    note: "evaluated after existence, before state-machine and business checks"
  - priority: 7
    category: state
    check: "State-machine preconditions: member ACTIVE for account opening / enrollment / ballot; account OPEN for transactions and close; application/amendment/declaration/meeting/review in the required from-state; ballot-specific voter eligibility (member ACTIVE and membership_effective_date <= record_date, else ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE)"
    error_id: "ERR_MEMBER_NOT_ACTIVE | ERR_ACCOUNT_NOT_OPEN | ERR_APPLICATION_INVALID_STATE | ERR_AMENDMENT_INVALID_STATE | ERR_DECLARATION_INVALID_STATE | ERR_MEETING_INVALID_STATE | ERR_REVIEW_INVALID_STATE | ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE"
    http_status: 409
    applies_to: "all action endpoints"
    note: "ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE is http 403; within this tier, the target resource named left-most in the path is checked first (meeting state before voter eligibility on ballot casts)"
  - priority: 8
    category: business_safety
    check: "Regulatory evidence: approve requires docs_complete; sponsor must be ACTIVE at creation and at approval; deciding officer differs from filer/flagger (segregation of duties)"
    error_id: "ERR_DOCUMENTATION_INCOMPLETE | ERR_SPONSOR_NOT_ELIGIBLE | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "membership-application approve/deny; eligibility-review cure/confirm"
    note: "ERR_SEGREGATION_OF_DUTIES is http 403; the other two are 422"
  - priority: 9
    category: business_referential
    check: "Referenced-entity state/config: segment ACTIVE at application creation and approval; funding account belongs to member and is OPEN; proposed segment type compatible with charter bond_type"
    error_id: "ERR_SEGMENT_NOT_ACTIVE | ERR_PRODUCT_FUNDING_ACCOUNT_INVALID | ERR_BOND_TYPE_MISMATCH"
    http_status: 409
    applies_to: "membership-application create/approve; product-enrollment create; amendment create"
    note: "ERR_PRODUCT_FUNDING_ACCOUNT_INVALID and ERR_BOND_TYPE_MISMATCH are 422"
  - priority: 10
    category: business_constraint
    check: "Uniqueness and bands: charter singleton; one PRIMARY account per member; one ACTIVE enrollment per (member, product_code); one ballot per member per reconvene chain; dividend rate within the authorized band; tier requirement for the product"
    error_id: "ERR_CHARTER_ALREADY_EXISTS | ERR_PRIMARY_ACCOUNT_EXISTS | ERR_ALREADY_ENROLLED | ERR_BALLOT_ALREADY_CAST_IN_CHAIN | ERR_DIVIDEND_RATE_OUT_OF_BAND | ERR_TIER_REQUIREMENT_NOT_MET"
    http_status: 409
    applies_to: "charter create; share-account create; enrollment create; ballot create; dividend-declaration create"
    note: "ERR_DIVIDEND_RATE_OUT_OF_BAND is 422; ERR_TIER_REQUIREMENT_NOT_MET is 403"
  - priority: 11
    category: business_temporal
    check: "Windows and dates: dividend period overlap (closed intervals, status IN {DECLARED, PAID}); meeting 30-day minimum gap (chain-exempt); voting window [voting_open_date, meeting_date]; effective_date strictly future at submit and approve; payable_date > period_end; record_date < voting_open_date <= meeting_date; transaction posted_date within [opened_date, current date]; payment run not before payable_date"
    error_id: "ERR_DIVIDEND_PERIOD_OVERLAP | ERR_MEETING_TOO_CLOSE | ERR_VOTING_WINDOW_CLOSED | ERR_EFFECTIVE_DATE_NOT_FUTURE | ERR_DATE_ORDER_INVALID | ERR_INVALID_TRANSACTION_DATE | ERR_DIVIDEND_NOT_YET_PAYABLE"
    http_status: 409
    applies_to: "declaration create/pay; meeting create; ballot create; amendment create/approve; transaction create"
    note: "ERR_EFFECTIVE_DATE_NOT_FUTURE, ERR_DATE_ORDER_INVALID, ERR_INVALID_TRANSACTION_DATE are 422; the rest are 409"
  - priority: 12
    category: business_fiscal
    check: "Funds and par value: opening deposit >= par value; PRIMARY withdrawal keeps >= par value; withdrawal amount <= balance"
    error_id: "ERR_BELOW_PAR_VALUE | ERR_PAR_VALUE_BREACH | ERR_INSUFFICIENT_FUNDS"
    http_status: 422
    applies_to: "share-account create; transaction create"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default time before any set call is exactly 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Side effects run the epoch sweep: APPROVED amendments with effective_date <= current date become EFFECTIVE; GRACE_PERIOD members with grace_end_date <= current date are closed with the full cascade."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Amendment EFFECTIVE sweep in (effective_date ASC, created_at ASC) order, each bumping Charter.version and applying segment add/retire cascades"
      - "Grace-expiry sweep closing members, their OPEN share accounts, and enrollments funded by those accounts"

  # --- Charter ---
  - method: POST
    path: "/credit-union/charters"
    description: "Create the singleton charter with its initial eligibility segments (segments created in array order)"
    roles: [BoardDirector]
    code: 201
    input: [bond_type, par_value_cents, segments]
    output: Charter
    side_effects: ["one EligibilitySegment created per segments[] element, status ACTIVE"]
  - method: GET
    path: "/credit-union/charters/{id}"
    description: "Read a charter (includes version for OCC baselining)"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: []
    output: Charter
    side_effects: []
  - method: GET
    path: "/credit-union/charters/{id}/segments"
    description: "List segments of a charter, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EligibilitySegment[]"
    side_effects: []
  - method: GET
    path: "/credit-union/charters/{id}/amendment-applications"
    description: "List amendment applications for a charter, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CharterAmendmentApplication[]"
    side_effects: []

  # --- Charter amendments ---
  - method: POST
    path: "/credit-union/charter-amendment-applications"
    description: "File an amendment application (created in SUBMITTED); OCC-guarded on Charter.version"
    roles: [ComplianceOfficer]
    code: 201
    input: [charter_id, amendment_type, "proposed_segment_type?", "proposed_segment_descriptor?", "proposed_segment_required_documents?", "retire_segment_ids?", effective_date, expected_charter_version]
    output: CharterAmendmentApplication
    side_effects: ["increments Charter.version by 1 (baseline rebinding)", "baseline_charter_version recorded"]
  - method: POST
    path: "/credit-union/charter-amendment-applications/{id}/approve"
    description: "Regulator approves a submitted application"
    roles: [Regulator]
    code: 200
    input: []
    output: CharterAmendmentApplication
    side_effects: ["status -> APPROVED; decided_by_user_id recorded"]
  - method: POST
    path: "/credit-union/charter-amendment-applications/{id}/deny"
    description: "Regulator denies a submitted application"
    roles: [Regulator]
    code: 200
    input: [denial_reason]
    output: CharterAmendmentApplication
    side_effects: ["status -> DENIED"]

  # --- Membership applications ---
  - method: POST
    path: "/credit-union/membership-applications"
    description: "File a membership application (created in UNDER_REVIEW)"
    roles: [MembershipOfficer]
    code: 201
    input: [applicant_full_name, date_of_birth, basis, "segment_id?", "sponsor_member_id?", "relationship_to_sponsor?", documents_provided]
    output: MembershipApplication
    side_effects: ["filed_by_user_id = X-User-ID", "required_documents and docs_complete computed"]
  - method: GET
    path: "/credit-union/membership-applications"
    description: "List membership applications, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer]
    code: 200
    input: ["status?", "segment_id?", "sponsor_member_id?", "resulting_member_id?", "limit?", "offset?"]
    output: "MembershipApplication[]"
    side_effects: []
  - method: GET
    path: "/credit-union/membership-applications/{id}"
    description: "Read a membership application"
    roles: [MembershipOfficer, ComplianceOfficer]
    code: 200
    input: []
    output: MembershipApplication
    side_effects: []
  - method: POST
    path: "/credit-union/membership-applications/{id}/request-documents"
    description: "UNDER_REVIEW -> DOCS_REQUESTED"
    roles: [MembershipOfficer]
    code: 200
    input: [requested_document_codes]
    output: MembershipApplication
    side_effects: []
  - method: POST
    path: "/credit-union/membership-applications/{id}/submit-documents"
    description: "DOCS_REQUESTED -> UNDER_REVIEW; documents_provided unioned; docs_complete recomputed"
    roles: [MembershipOfficer]
    code: 200
    input: [documents_provided]
    output: MembershipApplication
    side_effects: []
  - method: POST
    path: "/credit-union/membership-applications/{id}/approve"
    description: "UNDER_REVIEW -> APPROVED; creates the Member; deciding officer must differ from filer"
    roles: [MembershipOfficer]
    code: 200
    input: []
    output: MembershipApplication
    side_effects: ["Member created (status ACTIVE, tier STANDARD, membership_effective_date = current clock date)", "resulting_member_id set"]
  - method: POST
    path: "/credit-union/membership-applications/{id}/deny"
    description: "UNDER_REVIEW or DOCS_REQUESTED -> DENIED; deciding officer must differ from filer"
    roles: [MembershipOfficer]
    code: 200
    input: [denial_reason]
    output: MembershipApplication
    side_effects: []

  # --- Members ---
  - method: GET
    path: "/credit-union/members"
    description: "List members, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer, Member]
    code: 200
    input: ["status?", "tier?", "segment_id?", "sponsor_member_id?", "application_id?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []
  - method: GET
    path: "/credit-union/members/{id}"
    description: "Read a member (Member role restricted to own record)"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: PATCH
    path: "/credit-union/members/{id}"
    description: "Update member contact fields; OCC-guarded on Member.version"
    roles: [MembershipOfficer]
    code: 200
    input: [expected_member_version, "mailing_address?", "email?", "phone?"]
    output: Member
    side_effects: ["increments Member.version by 1"]
  - method: POST
    path: "/credit-union/members/{id}/tier-review"
    description: "Re-evaluate member.tier on the TRAILING_90_AVERAGE basis and materialize it"
    roles: [OperationsOfficer]
    code: 200
    input: []
    output: Member
    side_effects: ["member.tier updated per trailing-90 evaluation", "last_tier_review_at set", "increments Member.version by 1"]

  # --- Share accounts ---
  - method: POST
    path: "/credit-union/share-accounts"
    description: "Open a share account; PRIMARY requires deposit >= par value and uniqueness per member; writes the opening DEPOSIT transaction (origin SYSTEM)"
    roles: [MembershipOfficer]
    code: 201
    input: [member_id, account_type, initial_deposit_cents]
    output: ShareAccount
    side_effects: ["opening ShareTransaction kind=DEPOSIT origin=SYSTEM posted_date = current date", "opened_date = current date"]
  - method: GET
    path: "/credit-union/share-accounts/{id}"
    description: "Read a share account"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer, Member]
    code: 200
    input: []
    output: ShareAccount
    side_effects: []
  - method: GET
    path: "/credit-union/members/{id}/share-accounts"
    description: "List a member's share accounts, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ShareAccount[]"
    side_effects: []
  - method: POST
    path: "/credit-union/share-accounts/{id}/close"
    description: "Close an OPEN account; PRIMARY manual close requires member.status != ACTIVE; disburses the full balance and force-closes funded enrollments"
    roles: [MembershipOfficer]
    code: 200
    input: []
    output: ShareAccount
    side_effects: ["CLOSURE_DISBURSEMENT transaction for the full balance", "balance_cents -> 0", "ACTIVE enrollments funded by this account -> CLOSED (FORCED_ACCOUNT_CLOSURE)"]
  - method: POST
    path: "/credit-union/share-accounts/{id}/transactions"
    description: "Post a DEPOSIT or WITHDRAWAL (backdating allowed within [opened_date, current date]); full replay recomputes running balances"
    roles: [OperationsOfficer]
    code: 201
    input: [kind, amount_cents, posted_date]
    output: ShareTransaction
    side_effects: ["share_balance_replay re-run", "account.balance_cents updated", "increments ShareAccount.version by 1"]
  - method: GET
    path: "/credit-union/share-accounts/{id}/transactions"
    description: "List transactions of an account in replay order (posted_date ASC, created_at ASC)"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShareTransaction[]"
    side_effects: []
  - method: GET
    path: "/credit-union/share-accounts/{id}/dividend-payments"
    description: "List dividend payment rows for an account, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "DividendPayment[]"
    side_effects: []

  # --- Product enrollments ---
  - method: POST
    path: "/credit-union/product-enrollments"
    description: "Enroll a member in a product; tier evaluated at enrollment on the CURRENT_POINT_IN_TIME basis"
    roles: [MembershipOfficer]
    code: 201
    input: [member_id, product_code, funding_share_account_id]
    output: ProductEnrollment
    side_effects: ["required_tier and tier_at_enrollment computed"]
  - method: GET
    path: "/credit-union/product-enrollments"
    description: "List product enrollments, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: ["member_id?", "funding_share_account_id?", "product_code?", "status?", "limit?", "offset?"]
    output: "ProductEnrollment[]"
    side_effects: []
  - method: GET
    path: "/credit-union/product-enrollments/{id}"
    description: "Read a product enrollment"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: []
    output: ProductEnrollment
    side_effects: []

  # --- Dividend declarations ---
  - method: POST
    path: "/credit-union/dividend-declarations"
    description: "Declare a dividend for a closed period; creates ACCRUED DividendPayment rows and declared_pool_cents (per-account rounding precedes summation)"
    roles: [BoardDirector]
    code: 201
    input: [period_start, period_end, rate_bps, method, payable_date]
    output: DividendDeclaration
    side_effects: ["ACCRUED DividendPayment rows computed per dividend_accrual (provisional variant)", "declared_pool_cents computed per dividend_pool_total"]
  - method: GET
    path: "/credit-union/dividend-declarations/{id}"
    description: "Read a dividend declaration"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: []
    output: DividendDeclaration
    side_effects: []
  - method: POST
    path: "/credit-union/dividend-declarations/{id}/void"
    description: "Void a DECLARED declaration; ACCRUED payments -> VOIDED; no account balance is touched"
    roles: [BoardDirector]
    code: 200
    input: []
    output: DividendDeclaration
    side_effects: ["ACCRUED payments -> VOIDED"]
  - method: POST
    path: "/credit-union/dividend-declarations/{id}/pay"
    description: "Run payment on/after payable_date; recomputes each ACCRUED row (final variant), credits OPEN accounts, VOIDs rows whose account closed or fails the gate"
    roles: [OperationsOfficer]
    code: 200
    input: []
    output: DividendDeclaration
    side_effects: ["payment rows CREDITED/VOIDED per final recompute", "DIVIDEND_CREDIT transactions written", "paid_total_cents computed"]
  - method: GET
    path: "/credit-union/dividend-declarations/{id}/payments"
    description: "List payment rows of a declaration, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DividendPayment[]"
    side_effects: []

  # --- Annual meetings & ballots ---
  - method: POST
    path: "/credit-union/annual-meetings"
    description: "Schedule an annual meeting; 30-day minimum gap vs other SCHEDULED/HELD meetings outside the same chain"
    roles: [BoardDirector]
    code: 201
    input: [meeting_date, record_date, voting_open_date, quorum_threshold]
    output: AnnualMeeting
    side_effects: []
  - method: GET
    path: "/credit-union/annual-meetings"
    description: "List annual meetings, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: ["status?", "reconvened_from_id?", "limit?", "offset?"]
    output: "AnnualMeeting[]"
    side_effects: []
  - method: GET
    path: "/credit-union/annual-meetings/{id}"
    description: "Read an annual meeting"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer, Member]
    code: 200
    input: []
    output: AnnualMeeting
    side_effects: []
  - method: POST
    path: "/credit-union/annual-meetings/{id}/close-and-tally"
    description: "Close voting and tally the reconvene chain; quorum boundary is inclusive (>=); quorum_met false -> ADJOURNED_NO_QUORUM"
    roles: [BoardDirector]
    code: 200
    input: []
    output: AnnualMeeting
    side_effects: ["quorum/tally snapshot recorded; status -> HELD or ADJOURNED_NO_QUORUM"]
  - method: POST
    path: "/credit-union/annual-meetings/{id}/reconvene"
    description: "Reconvene an ADJOURNED_NO_QUORUM meeting; creates the successor SCHEDULED meeting inheriting record_date and quorum_threshold; chain ballots carry over"
    roles: [BoardDirector]
    code: 201
    input: [meeting_date, voting_open_date]
    output: AnnualMeeting
    side_effects: ["successor created with reconvened_from_id set"]
  - method: POST
    path: "/credit-union/ballots"
    description: "Cast a ballot; one ballot per member per reconvene chain; voter must be ACTIVE with membership_effective_date <= record_date; current date must be within [voting_open_date, meeting_date]"
    roles: [Member]
    code: 201
    input: [meeting_id, choice]
    output: Ballot
    side_effects: []
  - method: GET
    path: "/credit-union/annual-meetings/{id}/ballots"
    description: "List ballots cast on a meeting (not chain-wide), sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Ballot[]"
    side_effects: []
  - method: GET
    path: "/credit-union/members/{id}/ballots"
    description: "List a member's ballots, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Ballot[]"
    side_effects: []

  # --- Eligibility reviews ---
  - method: POST
    path: "/credit-union/members/{id}/eligibility-reviews"
    description: "Open a manual eligibility review (reason MANUAL_FLAG); member ACTIVE -> INELIGIBLE_UNDER_REVIEW; also accepted while GRACE_PERIOD to enable late cure"
    roles: [ComplianceOfficer]
    code: 201
    input: [reason]
    output: EligibilityReview
    side_effects: ["Member -> INELIGIBLE_UNDER_REVIEW when created from ACTIVE; flagged_by_user_id = X-User-ID"]
  - method: GET
    path: "/credit-union/members/{id}/eligibility-reviews"
    description: "List a member's eligibility reviews, sorted created_at ASC"
    roles: [MembershipOfficer, ComplianceOfficer, Regulator, BoardDirector, OperationsOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EligibilityReview[]"
    side_effects: []
  - method: POST
    path: "/credit-union/eligibility-reviews/{id}/cure"
    description: "Cure an OPEN review; member returns to ACTIVE and grace_end_date is cleared; decider must differ from flagger"
    roles: [ComplianceOfficer]
    code: 200
    input: ["resolution_note?"]
    output: EligibilityReview
    side_effects: ["Review -> CURED", "Member -> ACTIVE, grace_end_date cleared"]
  - method: POST
    path: "/credit-union/eligibility-reviews/{id}/confirm-ineligible"
    description: "Confirm ineligibility; member INELIGIBLE_UNDER_REVIEW -> GRACE_PERIOD with grace_end_date = current date + 90 days; decider must differ from flagger"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EligibilityReview
    side_effects: ["Review -> CONFIRMED_INELIGIBLE", "Member -> GRACE_PERIOD, grace_end_date set"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member role accessing a resource owned by a different member" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Deciding user equals the filer/flagger on the same application or review" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Missing required field, type mismatch, out-of-range enum, or invalid basis/payload field combination" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_STALE_CHARTER_VERSION, http: 412, condition: "expected_charter_version does not match Charter.version at amendment submission" }
  - { id: ERR_STALE_MEMBER_VERSION, http: 412, condition: "expected_member_version does not match Member.version at member PATCH" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member not ACTIVE for account opening, enrollment, ballot, or manual review creation" }
  - { id: ERR_ACCOUNT_NOT_OPEN, http: 409, condition: "Share account not OPEN for transactions or close" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Membership application not in the required from-state for the attempted action" }
  - { id: ERR_AMENDMENT_INVALID_STATE, http: 409, condition: "Amendment application not SUBMITTED for approve/deny" }
  - { id: ERR_DECLARATION_INVALID_STATE, http: 409, condition: "Dividend declaration not DECLARED for void/pay" }
  - { id: ERR_MEETING_INVALID_STATE, http: 409, condition: "Meeting not SCHEDULED for ballot/tally, or not ADJOURNED_NO_QUORUM for reconvene" }
  - { id: ERR_REVIEW_INVALID_STATE, http: 409, condition: "Review not OPEN, or member state inconsistent with the attempted review action" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 422, condition: "Approval attempted while docs_complete is false" }
  - { id: ERR_SPONSOR_NOT_ELIGIBLE, http: 422, condition: "Sponsor member not ACTIVE at application creation or approval (FAMILY/HOUSEHOLD basis)" }
  - { id: ERR_SEGMENT_NOT_ACTIVE, http: 409, condition: "Referenced eligibility segment not ACTIVE at application creation or approval" }
  - { id: ERR_PRODUCT_FUNDING_ACCOUNT_INVALID, http: 422, condition: "Funding account does not exist for this member, or is not OPEN" }
  - { id: ERR_BOND_TYPE_MISMATCH, http: 422, condition: "Proposed segment type incompatible with the charter's bond_type (single-bond charters accept only their own segment type)" }
  - { id: ERR_CHARTER_ALREADY_EXISTS, http: 409, condition: "A charter already exists (singleton)" }
  - { id: ERR_PRIMARY_ACCOUNT_EXISTS, http: 409, condition: "Member already has a PRIMARY share account" }
  - { id: ERR_PRIMARY_ACCOUNT_REQUIRED, http: 409, condition: "Manual close of the PRIMARY account while the member is ACTIVE" }
  - { id: ERR_ALREADY_ENROLLED, http: 409, condition: "Member already has an ACTIVE enrollment for this product_code" }
  - { id: ERR_BALLOT_ALREADY_CAST_IN_CHAIN, http: 409, condition: "Member already cast a ballot on any meeting of the reconvene chain" }
  - { id: ERR_DIVIDEND_RATE_OUT_OF_BAND, http: 422, condition: "rate_bps outside the board-authorized band [10, 1500]" }
  - { id: ERR_TIER_REQUIREMENT_NOT_MET, http: 403, condition: "Member's enrollment-time tier below the product's required tier" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE, http: 403, condition: "Member not ACTIVE, or membership_effective_date after the meeting record_date" }
  - { id: ERR_DIVIDEND_PERIOD_OVERLAP, http: 409, condition: "Declaration period (closed interval, both ends inclusive) overlaps an existing DECLARED or PAID declaration" }
  - { id: ERR_MEETING_TOO_CLOSE, http: 409, condition: "New meeting within 30 days of another SCHEDULED/HELD meeting outside its chain (boundary: exactly 30 days is allowed)" }
  - { id: ERR_VOTING_WINDOW_CLOSED, http: 409, condition: "Ballot cast outside [voting_open_date, meeting_date] (inclusive)" }
  - { id: ERR_EFFECTIVE_DATE_NOT_FUTURE, http: 422, condition: "Amendment effective_date not strictly later than the current date at submission or approval" }
  - { id: ERR_DATE_ORDER_INVALID, http: 422, condition: "payable_date <= period_end, or meeting dates violating record_date < voting_open_date <= meeting_date" }
  - { id: ERR_INVALID_TRANSACTION_DATE, http: 422, condition: "posted_date before account opened_date or after the current date" }
  - { id: ERR_DIVIDEND_NOT_YET_PAYABLE, http: 409, condition: "Payment run attempted before payable_date" }
  - { id: ERR_BELOW_PAR_VALUE, http: 422, condition: "PRIMARY opening deposit below charter par_value_cents" }
  - { id: ERR_PAR_VALUE_BREACH, http: 422, condition: "WITHDRAWAL would leave a PRIMARY account below par_value_cents" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 422, condition: "WITHDRAWAL amount exceeds balance_cents (SUPPLEMENTAL floor is 0)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "Credit union member; reads own records and casts ballots"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /credit-union/ballots — cast own ballot"
    shared_operations:
      - "GET own member record, share accounts, transactions, dividend payments, ballots (ownership-checked)"
      - "GET /credit-union/annual-meetings/{id}"
  - name: MembershipOfficer
    description: "Branch officer; files and decides membership applications (but never decides own filings), opens/closes accounts, enrolls products"
    identity: opaque
    exclusive_operations:
      - "POST /credit-union/membership-applications and its request-documents / submit-documents / approve / deny actions"
      - "POST /credit-union/share-accounts and close"
      - "POST /credit-union/product-enrollments"
      - "PATCH /credit-union/members/{id}"
    shared_operations:
      - "All staff GET endpoints"
  - name: ComplianceOfficer
    description: "Compliance officer; files charter amendments, opens and decides eligibility reviews (but never decides own flags)"
    identity: opaque
    exclusive_operations:
      - "POST /credit-union/charter-amendment-applications"
      - "POST /credit-union/members/{id}/eligibility-reviews"
      - "POST /credit-union/eligibility-reviews/{id}/cure and confirm-ineligible"
    shared_operations:
      - "All staff GET endpoints"
  - name: Regulator
    description: "External regulator; approves or denies charter amendment applications"
    identity: opaque
    exclusive_operations:
      - "POST /credit-union/charter-amendment-applications/{id}/approve"
      - "POST /credit-union/charter-amendment-applications/{id}/deny"
    shared_operations:
      - "All staff GET endpoints"
  - name: BoardDirector
    description: "Board director; creates the charter, declares and voids dividends, schedules/tallies/reconvenes meetings"
    identity: opaque
    exclusive_operations:
      - "POST /credit-union/charters"
      - "POST /credit-union/dividend-declarations and void"
      - "POST /credit-union/annual-meetings, close-and-tally, reconvene"
    shared_operations:
      - "All staff GET endpoints"
  - name: OperationsOfficer
    description: "Operations officer; posts share transactions, runs tier reviews, executes dividend payment runs (never declares — segregation from BoardDirector)"
    identity: opaque
    exclusive_operations:
      - "POST /credit-union/share-accounts/{id}/transactions"
      - "POST /credit-union/members/{id}/tier-review"
      - "POST /credit-union/dividend-declarations/{id}/pay"
    shared_operations:
      - "All staff GET endpoints"
  - name: SystemAdmin
    description: "Technical operator; drives the logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
