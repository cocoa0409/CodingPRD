              payload: { period_month: "2026-09" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations/${inst_id}/allotment-run"
              payload: { period_month: "2026-10" }
