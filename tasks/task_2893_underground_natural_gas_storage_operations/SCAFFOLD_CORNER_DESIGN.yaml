            - "CompressorRun.${r1}.utilization_ratio == 0.500000 and utilization_band == MID are still the values stamped at booking"
            - "StorageField.${f1}.field_posture == FROZEN, working_gas_inventory_dth == 250000, fuel_gas_used_dth == 0, inventory_pct == 50.00"

      - name: evacuation_order_needs_a_serious_event_and_a_radius_inside_the_band
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EmergencyEvent.transitions.RESPONDING_to_EVACUATION_ORDERED
          - validations.priority_16_ERR_EVACUATION_RADIUS_INVALID
          - global_constants.MIN_EVACUATION_RADIUS_M
          - global_constants.MAX_EVACUATION_RADIUS_M
          - errors.ERR_EVACUATION_RADIUS_INVALID
        distinguishing_aspect: |
          One error code guards two unrelated preconditions on the same edge — the event's severity
          and the radius band — so a MINOR event with a perfectly legal 1500 m radius and a SERIOUS
          event with no radius at all fail identically (422). The band is inclusive at both ends:
          0 m and 8001 m are rejected while exactly MAX_EVACUATION_RADIUS_M (8000) is admissible.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1."
            - "Two EmergencyEvents on that field, both advanced to RESPONDING: EV-MINOR with severity MINOR and EV-SER with severity SERIOUS."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${f1}", event_type: "THIRD_PARTY_DAMAGE", severity: "MINOR", detected_at: "2026-08-01T00:00:00Z" }
              as: FieldOperator
              captures: { ea: $.data.id }
            - call: "POST /emergency-events/${ea}/advance"
              payload: { to_status: "RESPONDING" }
              as: FieldOperator
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${f1}", well_id: "${w1}", event_type: "LEAK", severity: "SERIOUS", detected_at: "2026-08-01T00:00:00Z" }
              as: FieldOperator
              captures: { eb: $.data.id }
            - call: "POST /emergency-events/${eb}/advance"
              payload: { to_status: "RESPONDING" }
              as: FieldOperator
          trigger:
            - call: "POST /emergency-events/${ea}/advance"
              payload: { to_status: "EVACUATION_ORDERED", evacuation_radius_m: 1500 }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /emergency-events/${eb}/advance"
              payload: { to_status: "EVACUATION_ORDERED" }
              as: FieldOperator
              captures: { e2: $.data.error_id }
            - call: "POST /emergency-events/${eb}/advance"
              payload: { to_status: "EVACUATION_ORDERED", evacuation_radius_m: 0 }
              as: FieldOperator
              captures: { e3: $.data.error_id }
            - call: "POST /emergency-events/${eb}/advance"
              payload: { to_status: "EVACUATION_ORDERED", evacuation_radius_m: 8001 }
              as: FieldOperator
              captures: { e4: $.data.error_id }
            - call: "POST /emergency-events/${eb}/advance"
              payload: { to_status: "EVACUATION_ORDERED", evacuation_radius_m: 8000 }
              as: FieldOperator
          assert:
            - "${e1} == ERR_EVACUATION_RADIUS_INVALID with HTTP 422 (severity MINOR can never justify an evacuation)"
            - "${e2} == ERR_EVACUATION_RADIUS_INVALID with HTTP 422 (no radius supplied)"
            - "${e3} == ERR_EVACUATION_RADIUS_INVALID with HTTP 422 (0 is below MIN_EVACUATION_RADIUS_M 1)"
            - "${e4} == ERR_EVACUATION_RADIUS_INVALID with HTTP 422 (8001 is above MAX_EVACUATION_RADIUS_M 8000)"
            - "after the four refusals EmergencyEvent.${eb}.status is still RESPONDING with evacuation_radius_m == null"
            - "the fifth call returns HTTP 200 with EmergencyEvent.${eb}.status == EVACUATION_ORDERED and evacuation_radius_m == 8000"
            - "EmergencyEvent.${ea}.status is still RESPONDING with evacuation_radius_m == null"
            - "StorageField.${f1}.field_posture == FROZEN throughout"

      - name: emergency_containment_reopens_the_field_and_closure_makes_the_event_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EmergencyEvent.transitions.RESPONDING_to_CONTAINED
          - state_machines.EmergencyEvent.transitions.CONTAINED_to_CLOSED
          - curtailment_sweep.phase_A
          - state_machines.Nomination.transitions.CONFIRMED_to_CURTAILED
          - errors.ERR_INVALID_EMERGENCY_STATE
        distinguishing_aspect: |
          Phase A spares nobody — a FIRM nomination is curtailed by the RESPONDING advance exactly
          like an interruptible one — and containment is deliberately asymmetric: recomputing the
          posture back to OPEN does NOT restore the swept schedule, so the nomination stays CURTAILED
          with its -80000.000 CURTAILMENT_CREDIT row and the contract's scheduled_injection_dth stays
          0. CLOSED is terminal, so any further advance is ERR_INVALID_EMERGENCY_STATE (409).
