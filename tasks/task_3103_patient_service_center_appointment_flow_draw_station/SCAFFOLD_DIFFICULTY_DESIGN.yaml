              payload: { service_center_id: "${c1}", test_order_id: "${o3}", scheduled_start_utc: "2026-09-01T14:00:00Z", slot_span: 1, source: "BOOKED", expected_test_order_version: "${v3}" }
              as: IntakeCoordinator
              captures: { err_dup: $.data.error_id }
