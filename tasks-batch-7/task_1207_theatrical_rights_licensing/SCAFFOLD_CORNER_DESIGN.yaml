              captures: { app_id: $.data.id }
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
              payload: {}
              as: LicensingOfficer
            - call: "GET /licensing/applications/${app_id}"
              payload: {}
              as: LicensingOfficer
              captures: { v_snap: $.data.version }
            - call: "POST /licensing/applications/${app_id}/return_for_info"
              payload: { notes: "bump version" }
              as: LicensingOfficer
            - call: "POST /licensing/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${org_id}"
            - call: "POST /licensing/applications/${app_id}/begin_review"
