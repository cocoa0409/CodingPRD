scenario: "78. Employee Stock Purchase Plan (ESPP): offering period (6-24 months), contribution rate (≤15%/$25k cap), Lookback, Qualifying/Disqualifying disposition, IRS Form 3922, Disqualifying Sale"
domain_name: espp-stock-purchase
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: hybrid
  # OfferingPeriod -> PurchasePeriod is a hierarchy; Enrollment, Contribution,
  # Purchase, ShareLot, Disposition, Form3922 form a flat FK web around Participant
  # and the periods (cross-aggregate references), so the overall topology is hybrid.
  state_machine_shape: branching
  # Enrollment has branching+revert (ENROLLED -> SUSPENDED -> ENROLLED, -> WITHDRAWN);
  # Disposition branches QUALIFYING vs DISQUALIFYING with divergent side-effect sets;
  # OfferingPeriod is compound over its PurchasePeriod children.
  relationship_patterns:
    - one_to_many        # OfferingPeriod -> PurchasePeriod; Participant -> Enrollment
    - cross_aggregate    # Disposition references ShareLot which references Purchase
    - polymorphic: false
  role_model: segregation_of_duties
  # PlanAdministrator configures plan + runs purchase batches; Participant enrolls and
  # disposes; ComplianceOfficer certifies $25k accrual and issues Form 3922. The officer
  # who certifies a purchase batch cannot be the participant; admin cannot self-dispose.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/identity email; unique across participants"
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Employee legal name printed on Form 3922"
      - name: employee_id
        type: string
        source: input
        description: "Employer payroll identifier; unique"
        constraints: "unique; non-empty"
      - name: is_five_percent_owner
        type: boolean
        source: input
        description: "True if the employee owns >=5% of company stock; IRC §423 bars enrollment"
        default: false
      - name: status
        type: enum
        source: system
        description: "Employment status gating enrollment"
        default: ACTIVE
        constraints: "one of {ACTIVE, TERMINATED}"

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Issuer company name"
      - name: max_contribution_rate_pct
        type: number
        source: input
        description: "Plan-level ceiling on per-paycheck contribution rate; IRC §423 hard cap is 15"
        default: 15
        constraints: "0 < value <= 15"
      - name: discount_pct
        type: number
        source: input
        description: "Purchase discount off the applicable FMV; IRC §423 max is 15"
        default: 15
        constraints: "0 <= value <= 15"
      - name: lookback_enabled
        type: boolean
        source: input
        description: "When true, purchase price uses the lower of grant-date FMV and purchase-date FMV; when false, only purchase-date FMV"
        default: true
      - name: annual_purchase_limit_usd
        type: integer
        source: input
        description: "IRC §423 statutory accrual cap measured at grant-date FMV per calendar year"
        default: 25000
        constraints: "value > 0"

  - name: OfferingPeriod
    parent: Plan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> Plan.id"
      - name: grant_date
        type: datetime
        source: input
        description: "Offering/grant date; the lookback grant-date FMV is measured here and qualifying holding period counts from here"
      - name: duration_months
        type: integer
        source: input
        description: "Length of the offering period in whole months"
        constraints: "6 <= value <= 24"
      - name: end_date
        type: datetime
        source: computed
        description: "grant_date plus duration_months (calendar-month addition); offering closes here"
      - name: grant_date_fmv_cents
        type: integer
        source: input
        description: "Fair market value per share in cents on grant_date; lookback floor input"
        constraints: "value > 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle; auto-advances when children all close"
        default: OPEN
        constraints: "one of {OPEN, ENROLLMENT_CLOSED, ACTIVE, CLOSED, CANCELLED}"
      - name: purchase_period_count
        type: integer
        source: computed
        description: "Count of PurchasePeriod children created under this offering"
        default: 0

  - name: PurchasePeriod
    parent: OfferingPeriod
    common_fields: true
    fields:
      - name: offering_period_id
        type: string
        source: input
        description: "FK -> OfferingPeriod.id"
      - name: sequence_index
        type: integer
        source: input
        description: "1-based ordinal of this purchase period within its offering; defines chronological processing order"
        constraints: "value >= 1; unique within offering_period_id"
      - name: purchase_date
        type: datetime
        source: input
        description: "Date shares are bought; disqualifying holding period counts from here"
      - name: purchase_date_fmv_cents
        type: integer
        source: input
        description: "Fair market value per share in cents on purchase_date; set when the batch is opened, before pricing"
        constraints: "value > 0"
      - name: status
        type: enum
        source: system
        description: "Batch lifecycle"
        default: PENDING
        constraints: "one of {PENDING, OPEN, CERTIFIED, PURCHASED, CANCELLED}"
      - name: certified_by_user_id
        type: string
        source: system
        description: "Opaque ComplianceOfficer id who certified the $25k accrual sweep for this batch"
        default: null

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: offering_period_id
        type: string
        source: input
        description: "FK -> OfferingPeriod.id"
      - name: contribution_rate_pct
        type: number
        source: input
        description: "Elected percentage of each paycheck to withhold"
        constraints: "0 < value <= Plan.max_contribution_rate_pct"
      - name: status
        type: enum
        source: system
        description: "Enrollment lifecycle with suspend/resume and withdraw"
        default: ENROLLED
        constraints: "one of {ENROLLED, SUSPENDED, WITHDRAWN, COMPLETED}"
      - name: accumulated_contribution_cents
        type: integer
        source: computed
        description: "Sum of Contribution.amount_cents for this enrollment in POSTED status not yet consumed by a purchase"
        default: 0
      - name: refunded_contribution_cents
        type: integer
        source: computed
        description: "Total contributions returned to the participant on withdrawal or residual after purchase"
        default: 0

  - name: Contribution
    parent: Enrollment
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: pay_date
        type: datetime
        source: input
        description: "Payroll date the withholding posted"
      - name: gross_pay_cents
        type: integer
        source: input
        description: "Gross paycheck amount the rate is applied to"
        constraints: "value > 0"
      - name: amount_cents
        type: integer
        source: computed
        description: "Withheld amount = floor(gross_pay_cents * enrollment.contribution_rate_pct / 100)"
      - name: status
        type: enum
        source: system
        description: "POSTED when recorded; CONSUMED when applied to a purchase; REFUNDED when returned"
        default: POSTED
        constraints: "one of {POSTED, CONSUMED, REFUNDED}"

  - name: Purchase
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id"
      - name: purchase_period_id
        type: string
        source: input
        description: "FK -> PurchasePeriod.id"
      - name: price_per_share_cents
        type: integer
        source: computed
        description: "Discounted purchase price per share = round_half_up(applicable_fmv_cents * (100 - Plan.discount_pct) / 100); applicable_fmv = min(grant_date_fmv, purchase_date_fmv) when lookback_enabled else purchase_date_fmv"
      - name: shares_purchased
        type: integer
        source: computed
        description: "Whole shares = floor(spendable_contribution_cents / price_per_share_cents) after the $25k accrual cap is applied"
      - name: spend_cents
        type: integer
        source: computed
        description: "shares_purchased * price_per_share_cents actually spent from contributions"
      - name: residual_cents
        type: integer
        source: computed
        description: "Contribution remainder not spent (fractional-share leftover + cap-excluded amount), refunded to enrollment"
      - name: grant_date_value_applied_cents
        type: integer
        source: computed
        description: "shares_purchased * offering.grant_date_fmv_cents; amount charged against the participant's $25k calendar-year accrual"
      - name: status
        type: enum
        source: system
        description: "Always SETTLED on creation; terminal"
        default: SETTLED
        constraints: "one of {SETTLED}"

  - name: ShareLot
    parent: null
    common_fields: true
    fields:
      - name: purchase_id
        type: string
        source: input
        description: "FK -> Purchase.id"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: shares_total
        type: integer
        source: system
        description: "Shares originally acquired in this lot (copied from Purchase.shares_purchased)"
      - name: shares_remaining
        type: integer
        source: computed
        description: "Shares not yet disposed; decremented by each Disposition"
      - name: grant_date
        type: datetime
        source: system
        description: "Copied from owning OfferingPeriod.grant_date; qualifying 2-year clock"
      - name: purchase_date
        type: datetime
        source: system
        description: "Copied from owning PurchasePeriod.purchase_date; qualifying 1-year clock and disqualifying basis date"
      - name: status
        type: enum
        source: system
        description: "OPEN while shares_remaining > 0; FULLY_DISPOSED when 0"
        default: OPEN
        constraints: "one of {OPEN, FULLY_DISPOSED}"

  - name: Disposition
    parent: null
    common_fields: true
    fields:
      - name: share_lot_id
        type: string
        source: input
        description: "FK -> ShareLot.id"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: sale_date
        type: datetime
        source: input
        description: "Date the shares were sold/transferred"
      - name: shares_sold
        type: integer
        source: input
        description: "Shares disposed in this transaction"
        constraints: "0 < value <= ShareLot.shares_remaining"
      - name: sale_price_per_share_cents
        type: integer
        source: input
        description: "Sale proceeds per share in cents"
        constraints: "value >= 0"
      - name: disposition_type
        type: enum
        source: computed
        description: "QUALIFYING when sale_date >= grant_date+2y AND sale_date >= purchase_date+1y; else DISQUALIFYING"
        constraints: "one of {QUALIFYING, DISQUALIFYING}"
      - name: ordinary_income_cents
        type: integer
        source: computed
        description: "Disposition-type-dependent compensation income; see calculations qualifying_ordinary_income / disqualifying_ordinary_income"
      - name: capital_gain_cents
        type: integer
        source: computed
        description: "(sale_proceeds - adjusted_basis), where adjusted_basis = purchase_cost + ordinary_income_cents"

  - name: Form3922
    parent: null
    common_fields: true
    fields:
      - name: purchase_id
        type: string
        source: input
        description: "FK -> Purchase.id"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: box3_grant_date_fmv_cents
        type: integer
        source: system
        description: "Form 3922 Box 3: FMV per share on grant_date"
      - name: box4_purchase_date_fmv_cents
        type: integer
        source: system
        description: "Form 3922 Box 4: FMV per share on purchase_date"
      - name: box5_price_paid_cents
        type: integer
        source: system
        description: "Form 3922 Box 5: actual price paid per share"
      - name: box6_shares
        type: integer
        source: system
        description: "Form 3922 Box 6: number of shares transferred"
      - name: tax_year
        type: integer
        source: system
        description: "Calendar year of the purchase_date"
      - name: issued_by_user_id
        type: string
        source: system
        description: "Opaque ComplianceOfficer id who issued the form"

  - name: AccrualLedger
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: calendar_year
        type: integer
        source: input
        description: "The calendar year whose $25k accrual this row tracks"
      - name: accrued_grant_value_cents
        type: integer
        source: computed
        description: "Cumulative grant_date_value_applied_cents charged to this participant-year by SETTLED purchases"
        default: 0
      - name: remaining_capacity_cents
        type: integer
        source: computed
        description: "Plan.annual_purchase_limit_usd*100 - accrued_grant_value_cents; floored at 0"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: OfferingPeriod
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: ENROLLMENT_CLOSED
        trigger: "POST /offering-periods/{id}/close-enrollment"
        actor: PlanAdministrator
        preconditions:
          - "offering.status == OPEN"
        side_effects:
          - "no new Enrollment may be created against this offering"
          - "increments OfferingPeriod.version by 1"
      - from: ENROLLMENT_CLOSED
        to: ACTIVE
        trigger: "POST /offering-periods/{id}/purchase-periods (first child opened)"
        actor: PlanAdministrator
        preconditions:
          - "offering.status == ENROLLMENT_CLOSED"
        side_effects:
          - "offering becomes ACTIVE on first PurchasePeriod transition PENDING->OPEN"
          - "increments OfferingPeriod.version by 1"
        note: "Auto-advance bubbled up from the first child PurchasePeriod opening."
      - from: ACTIVE
        to: CLOSED
        trigger: "system: last PurchasePeriod reaches PURCHASED"
        actor: system
        preconditions:
          - "offering.status == ACTIVE"
          - "every PurchasePeriod child has status IN {PURCHASED, CANCELLED}"
          - "at least one PurchasePeriod child has status == PURCHASED"
        side_effects:
          - "every Enrollment under this offering with status==ENROLLED auto-transitions to COMPLETED"
          - "increments OfferingPeriod.version by 1"
        note: "Compound bubble-up: parent closes when all children terminal."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /offering-periods/{id}/cancel"
        actor: PlanAdministrator
        preconditions:
          - "offering.status IN {OPEN, ENROLLMENT_CLOSED}"
          - "no PurchasePeriod child has status == PURCHASED"
        side_effects:
          - "every Enrollment under this offering transitions to WITHDRAWN"
          - "each WITHDRAWN enrollment refunds all POSTED contributions (Contribution.status->REFUNDED; enrollment.refunded_contribution_cents recomputed)"
          - "every PENDING/OPEN PurchasePeriod child transitions to CANCELLED"
          - "increments OfferingPeriod.version by 1"
        note: "Depth-3 cascade: cancel offering -> withdraw enrollments -> refund contributions."
      - from: ENROLLMENT_CLOSED
        to: CANCELLED
        trigger: "POST /offering-periods/{id}/cancel"
        actor: PlanAdministrator
        preconditions:
          - "offering.status IN {OPEN, ENROLLMENT_CLOSED}"
          - "no PurchasePeriod child has status == PURCHASED"
        side_effects:
          - "same cascade as OPEN->CANCELLED"
          - "increments OfferingPeriod.version by 1"

  - entity: PurchasePeriod
    initial_state: PENDING
    terminal_states: [PURCHASED, CANCELLED]
    transitions:
      - from: PENDING
        to: OPEN
        trigger: "POST /purchase-periods/{id}/open"
        actor: PlanAdministrator
        preconditions:
          - "purchase_period.status == PENDING"
          - "parent OfferingPeriod.status IN {ENROLLMENT_CLOSED, ACTIVE}"
          - "all PurchasePeriod siblings with smaller sequence_index have status IN {PURCHASED, CANCELLED}"
        side_effects:
          - "if parent OfferingPeriod.status == ENROLLMENT_CLOSED, bubble-up parent to ACTIVE"
          - "increments PurchasePeriod.version by 1"
        note: "Sequential gate: lower-indexed batches must finish first."
      - from: OPEN
        to: CERTIFIED
        trigger: "POST /purchase-periods/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "purchase_period.status == OPEN"
        side_effects:
          - "stamps certified_by_user_id with the acting officer's X-User-ID"
          - "increments PurchasePeriod.version by 1"
        note: "Segregation of duties: certification gate distinct from the admin who runs the buy."
      - from: CERTIFIED
        to: PURCHASED
        trigger: "POST /purchase-periods/{id}/run-purchase"
        actor: PlanAdministrator
        preconditions:
          - "purchase_period.status == CERTIFIED"
          - "expected_purchase_period_version matches purchase_period.version (OCC)"
        side_effects:
          - "for each ENROLLED enrollment in the parent offering, in ascending Enrollment.created_at order: compute Purchase (price, cap-limited shares, residual), create Purchase, create ShareLot, mark consumed Contributions CONSUMED, refund residual, charge AccrualLedger"
          - "creates one Form3922 per Purchase (issued during run-purchase by the certifying officer's stamp)"
          - "if this is the last non-terminal PurchasePeriod, bubble-up parent OfferingPeriod ACTIVE->CLOSED"
          - "increments PurchasePeriod.version by 1"
        note: "Depth-3 cascade: run-purchase -> charge AccrualLedger -> on last batch close offering -> complete enrollments."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /purchase-periods/{id}/cancel"
        actor: PlanAdministrator
        preconditions:
          - "purchase_period.status IN {PENDING, OPEN, CERTIFIED}"
        side_effects:
          - "increments PurchasePeriod.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /purchase-periods/{id}/cancel"
        actor: PlanAdministrator
        preconditions:
          - "purchase_period.status IN {PENDING, OPEN, CERTIFIED}"
        side_effects:
          - "increments PurchasePeriod.version by 1"
      - from: CERTIFIED
        to: CANCELLED
        trigger: "POST /purchase-periods/{id}/cancel"
        actor: PlanAdministrator
        preconditions:
          - "purchase_period.status IN {PENDING, OPEN, CERTIFIED}"
        side_effects:
          - "increments PurchasePeriod.version by 1"

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN, COMPLETED]
    transitions:
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /enrollments/{id}/suspend"
        actor: Participant
        preconditions:
          - "enrollment.status == ENROLLED"
          - "parent OfferingPeriod.status != CLOSED"
        side_effects:
          - "no further Contribution may be POSTED while SUSPENDED"
          - "increments Enrollment.version by 1"
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /enrollments/{id}/resume"
        actor: Participant
        preconditions:
          - "enrollment.status == SUSPENDED"
          - "parent OfferingPeriod.status IN {OPEN, ENROLLMENT_CLOSED, ACTIVE}"
        side_effects:
          - "increments Enrollment.version by 1"
        note: "Cyclic revert: ENROLLED<->SUSPENDED loop."
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Participant
        preconditions:
          - "enrollment.status IN {ENROLLED, SUSPENDED}"
        side_effects:
          - "all POSTED Contributions for this enrollment -> REFUNDED"
          - "enrollment.refunded_contribution_cents recomputed; accumulated_contribution_cents -> 0"
          - "increments Enrollment.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Participant
        preconditions:
          - "enrollment.status IN {ENROLLED, SUSPENDED}"
        side_effects:
          - "same refund cascade as ENROLLED->WITHDRAWN"
          - "increments Enrollment.version by 1"
      - from: ENROLLED
        to: COMPLETED
        trigger: "system: parent OfferingPeriod ACTIVE->CLOSED"
        actor: system
        preconditions:
          - "enrollment.status == ENROLLED"
          - "parent OfferingPeriod just reached CLOSED"
        side_effects:
          - "increments Enrollment.version by 1"

  - entity: ShareLot
    initial_state: OPEN
    terminal_states: [FULLY_DISPOSED]
    transitions:
      - from: OPEN
        to: FULLY_DISPOSED
        trigger: "system: Disposition reduces shares_remaining to 0"
        actor: system
        preconditions:
          - "share_lot.status == OPEN"
          - "share_lot.shares_remaining - disposition.shares_sold == 0"
        side_effects:
          - "increments ShareLot.version by 1"

  - entity: Disposition
    initial_state: RECORDED
    terminal_states: [RECORDED]
    transitions:
      - from: "(create)"
        to: RECORDED
        trigger: "POST /dispositions"
        actor: Participant
        preconditions:
          - "ShareLot.status == OPEN"
          - "ShareLot.participant_id == acting participant"
          - "0 < shares_sold <= ShareLot.shares_remaining"
        side_effects:
          - "classify disposition_type (QUALIFYING vs DISQUALIFYING) from sale_date vs holding-period clocks"
          - "compute ordinary_income_cents per the type-specific calculation"
          - "compute capital_gain_cents"
          - "decrement ShareLot.shares_remaining by shares_sold; if 0 -> FULLY_DISPOSED (cross-entity cascade)"
        note: "Branching by disposition_type: QUALIFYING and DISQUALIFYING run different ordinary-income formulas."

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: run-purchase-stale-period
    parent_entity: PurchasePeriod
    write_endpoint: "POST /purchase-periods/{id}/run-purchase"
    occ_field: "expected_purchase_period_version"
    description: |
      Running the purchase batch against a PurchasePeriod whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. The batch run legitimately supersedes prior client state (e.g. a
      certify call or a sibling-cancel cascade bumped the period's version after
      the client read it), so a second run carrying the old version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: lookback_purchase_price
    trigger: "PurchasePeriod CERTIFIED->PURCHASED (run-purchase), per enrollment"
    algorithm: threshold
    formula: |
      if Plan.lookback_enabled:
          applicable_fmv = min(OfferingPeriod.grant_date_fmv_cents,
                               PurchasePeriod.purchase_date_fmv_cents)
      else:
          applicable_fmv = PurchasePeriod.purchase_date_fmv_cents
      price_per_share_cents = round_half_up(applicable_fmv * (100 - Plan.discount_pct) / 100)
    input_set: "Single PurchasePeriod and its parent OfferingPeriod; Plan config."
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up at the per-share price"
    variants:
      - name: lookback_on
        when: "Plan.lookback_enabled == true"
        difference: "uses min(grant_fmv, purchase_fmv) as the discount base"
      - name: lookback_off
        when: "Plan.lookback_enabled == false"
        difference: "uses purchase_date_fmv only; grant-date FMV ignored for pricing"

  - name: annual_accrual_cap_allocation
    trigger: "PurchasePeriod CERTIFIED->PURCHASED (run-purchase), per enrollment, before share count"
    algorithm: waterfall_allocation
    formula: |
      # Cap is measured at GRANT-date FMV per IRC §423(b)(8), not purchase price.
      year = calendar_year(PurchasePeriod.purchase_date)
      ledger = AccrualLedger for (participant, year)   # auto-created at 0 if absent
      remaining_grant_capacity = max(0, Plan.annual_purchase_limit_usd*100
                                        - ledger.accrued_grant_value_cents)
      # Max shares the cap permits, valued at grant-date FMV:
      max_shares_by_cap = floor(remaining_grant_capacity / OfferingPeriod.grant_date_fmv_cents)
      # Max shares the cash permits, valued at the discounted price:
      max_shares_by_cash = floor(enrollment.accumulated_contribution_cents / price_per_share_cents)
      shares_purchased = min(max_shares_by_cap, max_shares_by_cash)
      spend_cents = shares_purchased * price_per_share_cents
      grant_date_value_applied_cents = shares_purchased * OfferingPeriod.grant_date_fmv_cents
      residual_cents = enrollment.accumulated_contribution_cents - spend_cents
    input_set: "One enrollment's POSTED contributions; participant-year AccrualLedger; offering grant FMV."
    constants:
      LIMIT_DEFAULT_USD: 25000
    precision: "integer cents; floor on both share-count branches; cap measured at grant FMV"
    variants:
      - name: cap_binding
        when: "max_shares_by_cap < max_shares_by_cash"
        difference: "the $25k accrual cap limits shares; excess cash is refunded as residual"
      - name: cash_binding
        when: "max_shares_by_cash <= max_shares_by_cap"
        difference: "contributions limit shares; only fractional-share leftover is residual"

  - name: qualifying_ordinary_income
    trigger: "POST /dispositions when disposition_type == QUALIFYING"
    algorithm: threshold
    formula: |
      # Ordinary income on a qualifying disposition (IRC §423) = the LESSER of:
      #   (a) actual gain = max(0, sale_proceeds - purchase_cost)
      #   (b) the statutory discount at GRANT = shares * (grant_date_fmv - price_per_share_paid)
      sale_proceeds      = shares_sold * sale_price_per_share_cents
      purchase_cost      = shares_sold * Purchase.price_per_share_cents
      actual_gain        = max(0, sale_proceeds - purchase_cost)
      statutory_discount = shares_sold * max(0, OfferingPeriod.grant_date_fmv_cents
                                                - Purchase.price_per_share_cents)
      ordinary_income_cents = min(actual_gain, statutory_discount)
      adjusted_basis     = purchase_cost + ordinary_income_cents
      capital_gain_cents = sale_proceeds - adjusted_basis
    input_set: "One Disposition, its ShareLot, owning Purchase and OfferingPeriod."
    constants: {}
    precision: "integer cents"
    variants:
      - name: gain_limited
        when: "actual_gain < statutory_discount"
        difference: "ordinary income capped by the actual economic gain (low/loss sale)"
      - name: discount_limited
        when: "statutory_discount <= actual_gain"
        difference: "ordinary income equals the grant-date statutory discount"

  - name: disqualifying_ordinary_income
    trigger: "POST /dispositions when disposition_type == DISQUALIFYING"
    algorithm: threshold
    formula: |
      # Ordinary income on a disqualifying disposition = the spread at PURCHASE,
      # measured against purchase-date FMV (not grant FMV), regardless of sale price.
      ordinary_income_cents = shares_sold * max(0, PurchasePeriod.purchase_date_fmv_cents
                                                   - Purchase.price_per_share_cents)
      sale_proceeds      = shares_sold * sale_price_per_share_cents
      purchase_cost      = shares_sold * Purchase.price_per_share_cents
      adjusted_basis     = purchase_cost + ordinary_income_cents
      capital_gain_cents = sale_proceeds - adjusted_basis
    input_set: "One Disposition, its ShareLot, owning Purchase and PurchasePeriod."
    constants: {}
    precision: "integer cents"
    variants:
      - name: standard
        when: "always for DISQUALIFYING"
        difference: "spread fixed at purchase-date FMV minus price paid; sale price only affects capital_gain"

  - name: disposition_classification
    trigger: "POST /dispositions (before income computation)"
    algorithm: threshold
    formula: |
      qualifying = (sale_date >= add_years(ShareLot.grant_date, 2)) AND \
                   (sale_date >= add_years(ShareLot.purchase_date, 1))
      disposition_type = QUALIFYING if qualifying else DISQUALIFYING
    input_set: "ShareLot grant_date and purchase_date vs sale_date."
    constants:
      QUALIFY_GRANT_YEARS: 2
      QUALIFY_PURCHASE_YEARS: 1
    precision: "date comparison; boundary is inclusive (>= the exact anniversary qualifies)"
    variants:
      - name: boundary_exact
        when: "sale_date exactly equals an anniversary date"
        difference: "the >= boundary means selling ON the 2y/1y anniversary is QUALIFYING, one day earlier is DISQUALIFYING"

  - name: contribution_withholding
    trigger: "POST /contributions"
    algorithm: aggregation
    formula: |
      amount_cents = floor(gross_pay_cents * enrollment.contribution_rate_pct / 100)
      enrollment.accumulated_contribution_cents += amount_cents   # only POSTED, not yet CONSUMED
    input_set: "One Contribution against an ENROLLED enrollment."
    constants: {}
    precision: "integer cents, floor"
    variants:
      - name: standard
        when: "always"
        difference: "single floor on the per-paycheck withholding"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /participants"
  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For Participant-owned resources, X-User-ID equals the resource's participant_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "enrollment/contribution/disposition participant actions"
  - priority: 4
    category: existence
    check: "Path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 5
    category: business_safety
    check: "Participant.is_five_percent_owner must be false to enroll (IRC §423 5% owner bar)"
    error_id: ERR_FIVE_PERCENT_OWNER
    http_status: 422
    applies_to: "POST /enrollments"
  - priority: 6
    category: business_safety
    check: "Participant.status must be ACTIVE to enroll"
    error_id: ERR_PARTICIPANT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /enrollments"
  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "Run-purchase requires PurchasePeriod.status == CERTIFIED (certify must precede buy)"
    error_id: ERR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /purchase-periods/{id}/run-purchase"
  - priority: 9
    category: business_constraint
    check: "PurchasePeriod sequence gate: all lower sequence_index siblings must be PURCHASED/CANCELLED before opening this one"
    error_id: ERR_SEQUENCE_NOT_READY
    http_status: 409
    applies_to: "POST /purchase-periods/{id}/open"
  - priority: 10
    category: business_temporal
    check: "OfferingPeriod.duration_months in [6,24]"
    error_id: ERR_OFFERING_DURATION
    http_status: 422
    applies_to: "POST /offering-periods"
  - priority: 11
    category: business_temporal
    check: "PurchasePeriod.purchase_date must fall within [grant_date, offering.end_date]"
    error_id: ERR_PURCHASE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /offering-periods/{id}/purchase-periods"
  - priority: 12
    category: business_temporal
    check: "Disposition.sale_date must be >= ShareLot.purchase_date"
    error_id: ERR_SALE_BEFORE_PURCHASE
    http_status: 422
    applies_to: "POST /dispositions"
  - priority: 13
    category: business_constraint
    check: "Enrollment.contribution_rate_pct must be > 0 and <= Plan.max_contribution_rate_pct"
    error_id: ERR_RATE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /enrollments"
  - priority: 14
    category: business_constraint
    check: "A Participant may hold at most one non-terminal Enrollment per OfferingPeriod (status IN {ENROLLED,SUSPENDED})"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"
  - priority: 15
    category: business_constraint
    check: "Disposition.shares_sold must be > 0 and <= ShareLot.shares_remaining"
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 422
    applies_to: "POST /dispositions"
  - priority: 16
    category: business_referential
    check: "Contribution.enrollment must reference an ENROLLED (not SUSPENDED/WITHDRAWN/COMPLETED) enrollment"
    error_id: ERR_ENROLLMENT_NOT_CONTRIBUTING
    http_status: 409
    applies_to: "POST /contributions"
  - priority: 17
    category: business_fiscal
    check: "run-purchase OCC: expected_purchase_period_version must equal PurchasePeriod.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /purchase-periods/{id}/run-purchase"
  - priority: 18
    category: business_safety
    check: "Segregation of duties: the ComplianceOfficer certifying a batch must differ from the PlanAdministrator running it (X-User-ID mismatch required across certify vs run-purchase)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /purchase-periods/{id}/run-purchase"
  - priority: 19
    category: business_constraint
    check: "Form 3922 may be issued only once per Purchase"
    error_id: ERR_FORM_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /purchases/{id}/form-3922"
  - priority: 20
    category: business_constraint
    check: "Request body required fields present and well-typed"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST/PATCH"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Participants ----
  - method: POST
    path: "/participants"
    description: "Register an employee"
    roles: [PlanAdministrator]
    code: 201
    input:
      - email
      - full_name
      - employee_id
      - "is_five_percent_owner?"
    output: Participant
    side_effects: []
  - method: GET
    path: "/participants/{id}"
    description: "Read a participant"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: POST
    path: "/participants/{id}/terminate"
    description: "Mark a participant TERMINATED"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Participant
    side_effects: ["Participant.status -> TERMINATED"]

  # ---- Plan ----
  - method: POST
    path: "/plans"
    description: "Create the ESPP plan configuration"
    roles: [PlanAdministrator]
    code: 201
    input:
      - company_name
      - "max_contribution_rate_pct?"
      - "discount_pct?"
      - "lookback_enabled?"
      - "annual_purchase_limit_usd?"
    output: Plan
    side_effects: []
  - method: GET
    path: "/plans/{id}"
    description: "Read plan config"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Plan
    side_effects: []

  # ---- Offering periods ----
  - method: POST
    path: "/offering-periods"
    description: "Open an offering/grant period under a plan"
    roles: [PlanAdministrator]
    code: 201
    input:
      - plan_id
      - grant_date
      - duration_months
      - grant_date_fmv_cents
    output: OfferingPeriod
    side_effects: ["computes end_date = grant_date + duration_months"]
  - method: GET
    path: "/offering-periods/{id}"
    description: "Read an offering period"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: OfferingPeriod
    side_effects: []
  - method: GET
    path: "/plans/{id}/offering-periods"
    description: "List offering periods under a plan (reverse-reachability for OfferingPeriod.plan_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "status?"
      - "limit?"
      - "offset?"
    output: OfferingPeriod[]
    side_effects: []
  - method: POST
    path: "/offering-periods/{id}/close-enrollment"
    description: "Close enrollment window"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: OfferingPeriod
    side_effects: ["status OPEN->ENROLLMENT_CLOSED; version+1"]
  - method: POST
    path: "/offering-periods/{id}/cancel"
    description: "Cancel an offering before any purchase settled (depth-3 cascade)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: OfferingPeriod
    side_effects:
      - "status -> CANCELLED; version+1"
      - "all child Enrollments -> WITHDRAWN; their POSTED contributions -> REFUNDED"
      - "all non-terminal PurchasePeriod children -> CANCELLED"

  # ---- Purchase periods ----
  - method: POST
    path: "/offering-periods/{id}/purchase-periods"
    description: "Create a purchase period (batch) under an offering"
    roles: [PlanAdministrator]
    code: 201
    input:
      - sequence_index
      - purchase_date
      - purchase_date_fmv_cents
    output: PurchasePeriod
    side_effects: ["OfferingPeriod.purchase_period_count + 1"]
  - method: GET
    path: "/purchase-periods/{id}"
    description: "Read a purchase period"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: PurchasePeriod
    side_effects: []
  - method: GET
    path: "/offering-periods/{id}/purchase-periods"
    description: "List purchase periods under an offering (reverse-reachability for PurchasePeriod.offering_period_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "status?"
      - "limit?"
      - "offset?"
    output: PurchasePeriod[]
    side_effects: []
  - method: POST
    path: "/purchase-periods/{id}/open"
    description: "Open a batch for purchase (sequential gate)"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: PurchasePeriod
    side_effects: ["status PENDING->OPEN; may bubble parent OfferingPeriod ENROLLMENT_CLOSED->ACTIVE; version+1"]
  - method: POST
    path: "/purchase-periods/{id}/certify"
    description: "ComplianceOfficer certifies the $25k accrual sweep for the batch"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PurchasePeriod
    side_effects: ["status OPEN->CERTIFIED; stamps certified_by_user_id; version+1"]
  - method: POST
    path: "/purchase-periods/{id}/run-purchase"
    description: "Execute the buy for all enrolled participants (OCC-guarded, segregation-of-duties enforced)"
    roles: [PlanAdministrator]
    code: 200
    input:
      - expected_purchase_period_version
    output: PurchasePeriod
    side_effects:
      - "status CERTIFIED->PURCHASED; version+1"
      - "per ENROLLED enrollment (ascending created_at): create Purchase, ShareLot, Form3922; mark Contributions CONSUMED; refund residual; charge AccrualLedger"
      - "if last non-terminal batch: bubble parent OfferingPeriod ACTIVE->CLOSED; complete its ENROLLED enrollments"
  - method: POST
    path: "/purchase-periods/{id}/cancel"
    description: "Cancel a batch before purchase"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: PurchasePeriod
    side_effects: ["status -> CANCELLED; version+1"]

  # ---- Enrollments ----
  - method: POST
    path: "/enrollments"
    description: "Participant enrolls in an offering"
    roles: [Participant]
    code: 201
    input:
      - participant_id
      - offering_period_id
      - contribution_rate_pct
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments/{id}"
    description: "Read an enrollment"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/enrollments"
    description: "List enrollments filtered by participant or offering (reverse-reachability for Enrollment.participant_id and Enrollment.offering_period_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "participant_id?"
      - "offering_period_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/suspend"
    description: "Participant suspends contributions"
    roles: [Participant]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status ENROLLED->SUSPENDED; version+1"]
  - method: POST
    path: "/enrollments/{id}/resume"
    description: "Participant resumes contributions"
    roles: [Participant]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status SUSPENDED->ENROLLED; version+1"]
  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Participant withdraws; refunds all POSTED contributions"
    roles: [Participant]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> WITHDRAWN; POSTED Contributions -> REFUNDED; refunded/accumulated recomputed; version+1"]

  # ---- Contributions ----
  - method: POST
    path: "/contributions"
    description: "Record a payroll withholding against an enrollment"
    roles: [PlanAdministrator]
    code: 201
    input:
      - enrollment_id
      - pay_date
      - gross_pay_cents
    output: Contribution
    side_effects: ["amount_cents = floor(gross_pay * rate/100); enrollment.accumulated_contribution_cents += amount_cents"]
  - method: GET
    path: "/contributions/{id}"
    description: "Read a contribution"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Contribution
    side_effects: []
  - method: GET
    path: "/contributions"
    description: "List contributions filtered by enrollment (reverse-reachability for Contribution.enrollment_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "enrollment_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: Contribution[]
    side_effects: []

  # ---- Purchases ----
  - method: GET
    path: "/purchases/{id}"
    description: "Read a settled purchase"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Purchase
    side_effects: []
  - method: GET
    path: "/purchases"
    description: "List purchases filtered by enrollment or purchase period (reverse-reachability for Purchase.enrollment_id and Purchase.purchase_period_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "enrollment_id?"
      - "purchase_period_id?"
      - "limit?"
      - "offset?"
    output: Purchase[]
    side_effects: []
  - method: POST
    path: "/purchases/{id}/form-3922"
    description: "Issue (or re-fetch) the IRS Form 3922 for a purchase"
    roles: [ComplianceOfficer]
    code: 201
    input: []
    output: Form3922
    side_effects: ["creates Form3922 with boxes 3-6; stamps issued_by_user_id"]
  - method: GET
    path: "/purchases/{id}/form-3922"
    description: "List the Form 3922 for a purchase (reverse-reachability for Form3922.purchase_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Form3922[]
    side_effects: []
  - method: GET
    path: "/form-3922/{id}"
    description: "Read a single Form 3922"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Form3922
    side_effects: []
  - method: GET
    path: "/form-3922"
    description: "List Form 3922 filtered by participant or purchase (reverse-reachability for Form3922.participant_id and Form3922.purchase_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "participant_id?"
      - "purchase_id?"
      - "limit?"
      - "offset?"
    output: Form3922[]
    side_effects: []

  # ---- Share lots ----
  - method: GET
    path: "/share-lots/{id}"
    description: "Read a share lot"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: ShareLot
    side_effects: []
  - method: GET
    path: "/share-lots"
    description: "List share lots filtered by participant or purchase (reverse-reachability for ShareLot.participant_id and ShareLot.purchase_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "participant_id?"
      - "purchase_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: ShareLot[]
    side_effects: []

  # ---- Dispositions ----
  - method: POST
    path: "/dispositions"
    description: "Record a sale/transfer of shares; classifies qualifying vs disqualifying and computes income"
    roles: [Participant]
    code: 201
    input:
      - share_lot_id
      - participant_id
      - sale_date
      - shares_sold
      - sale_price_per_share_cents
    output: Disposition
    side_effects:
      - "classify disposition_type; compute ordinary_income_cents and capital_gain_cents"
      - "decrement ShareLot.shares_remaining; if 0 -> FULLY_DISPOSED"
  - method: GET
    path: "/dispositions/{id}"
    description: "Read a disposition"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Disposition
    side_effects: []
  - method: GET
    path: "/dispositions"
    description: "List dispositions filtered by participant or share lot (reverse-reachability for Disposition.participant_id and Disposition.share_lot_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "participant_id?"
      - "share_lot_id?"
      - "limit?"
      - "offset?"
    output: Disposition[]
    side_effects: []

  # ---- Accrual ledger ----
  - method: GET
    path: "/accrual-ledgers/{id}"
    description: "Read a participant-year accrual ledger row"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: AccrualLedger
    side_effects: []
  - method: GET
    path: "/accrual-ledgers"
    description: "List accrual ledger rows filtered by participant (reverse-reachability for AccrualLedger.participant_id)"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input:
      - "participant_id?"
      - "calendar_year?"
      - "limit?"
      - "offset?"
    output: AccrualLedger[]
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Participant acting on an enrollment/disposition/share lot they do not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body, missing required field, or wrong type"
  - id: ERR_FIVE_PERCENT_OWNER
    http: 422
    condition: "Participant.is_five_percent_owner is true; barred from enrolling"
  - id: ERR_PARTICIPANT_NOT_ACTIVE
    http: 422
    condition: "Participant.status != ACTIVE at enrollment"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_NOT_CERTIFIED
    http: 409
    condition: "run-purchase attempted on a PurchasePeriod not in CERTIFIED"
  - id: ERR_SEQUENCE_NOT_READY
    http: 409
    condition: "Opening a purchase period while a lower sequence_index sibling is not terminal"
  - id: ERR_OFFERING_DURATION
    http: 422
    condition: "OfferingPeriod.duration_months outside [6,24]"
  - id: ERR_PURCHASE_DATE_OUT_OF_RANGE
    http: 422
    condition: "PurchasePeriod.purchase_date outside [grant_date, offering.end_date]"
  - id: ERR_SALE_BEFORE_PURCHASE
    http: 422
    condition: "Disposition.sale_date earlier than ShareLot.purchase_date"
  - id: ERR_RATE_EXCEEDS_LIMIT
    http: 422
    condition: "contribution_rate_pct <= 0 or > Plan.max_contribution_rate_pct"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "Participant already has a non-terminal enrollment in this offering"
  - id: ERR_INSUFFICIENT_SHARES
    http: 422
    condition: "Disposition.shares_sold <= 0 or exceeds ShareLot.shares_remaining"
  - id: ERR_ENROLLMENT_NOT_CONTRIBUTING
    http: 409
    condition: "Contribution posted to an enrollment not in ENROLLED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_purchase_period_version does not match current PurchasePeriod.version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "run-purchase actor equals the officer who certified the same batch"
  - id: ERR_FORM_ALREADY_ISSUED
    http: 409
    condition: "Form 3922 already exists for this purchase"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlanAdministrator
    description: "Configures the plan, offerings, batches; records contributions; runs the buy"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans"
      - "POST /participants"
      - "POST /participants/{id}/terminate"
      - "POST /offering-periods"
      - "POST /offering-periods/{id}/close-enrollment"
      - "POST /offering-periods/{id}/cancel"
      - "POST /offering-periods/{id}/purchase-periods"
      - "POST /purchase-periods/{id}/open"
      - "POST /purchase-periods/{id}/run-purchase"
      - "POST /purchase-periods/{id}/cancel"
      - "POST /contributions"
    shared_operations:
      - "all GET reads"
  - name: ComplianceOfficer
    description: "Certifies the $25k accrual sweep per batch and issues Form 3922; cannot run the buy they certified"
    identity: "opaque"
    exclusive_operations:
      - "POST /purchase-periods/{id}/certify"
      - "POST /purchases/{id}/form-3922"
    shared_operations:
      - "all GET reads"
  - name: Participant
    description: "Employee who enrolls, contributes via payroll, suspends/resumes/withdraws, and disposes shares"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /enrollments"
      - "POST /enrollments/{id}/suspend"
      - "POST /enrollments/{id}/resume"
      - "POST /enrollments/{id}/withdraw"
      - "POST /dispositions"
    shared_operations:
      - "GET reads of own resources"
