  - entity: FundingAdvance
    initial_state: RECEIVED
    terminal_states: [APPLIED, REFUNDED]
    transitions:
      - from: RECEIVED
        to: APPLIED
        trigger: POST /funding-advances/{id}/apply
        actor: AgencyFinance
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_STATE)"
          - "DA status in {FUNDED, FINAL, DISPUTED} (else ERR_INVALID_STATE)"
          - "payload.amount_cents > 0 and <= amount_cents - applied_cents - refunded_cents (else ERR_APPLY_EXCEEDS_REMAINING)"
        side_effects:
          - "applied_cents += payload.amount_cents; when applied_cents == amount_cents the advance becomes APPLIED, otherwise stays RECEIVED"
          - "DA funding fields recomputed"
      - from: RECEIVED
        to: REFUNDED
        trigger: POST /funding-advances/{id}/refund
        actor: AgencyFinance
        preconditions:
          - "status == RECEIVED (else ERR_INVALID_STATE)"
          - "DA status in {SENT_TO_PRINCIPAL, FUNDED, FINAL, DISPUTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "refunded_cents = amount_cents - applied_cents (refund always returns the full unapplied remainder); status -> REFUNDED"
          - "DA funding fields recomputed; FUNDED auto-reverts to SENT_TO_PRINCIPAL when the funding gate no longer holds"

  - entity: CostDispute
    initial_state: RAISED
    terminal_states: [UPHELD, RESOLVED_ACCEPTED, RESOLVED_REJECTED]
    transitions:
      - from: RAISED
        to: UNDER_REVIEW
        trigger: POST /cost-disputes/{id}/start-review
        actor: AgencyFinance
        preconditions: ["status == RAISED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: POST /cost-disputes/{id}/uphold
        actor: AgencyFinance
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects:
          - "when da_line_id is set: line.actual_cents = max(0, line.actual_cents - amount_cents), line status -> ACTUALIZED; when null: a MANUAL SUNDRY credit line with estimated_cents = 0 and actual_cents = -amount_cents is appended to the DA"
          - "DA totals recomputed via da_totals_calc FINAL variant"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /cost-disputes/{id}/reject
        actor: AgencyFinance
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: ["linked DALine (if any) -> ACTUALIZED unchanged"]
      - from: REJECTED
        to: ESCALATED
        trigger: POST /cost-disputes/{id}/escalate
        actor: PrincipalRep
        preconditions:
          - "status == REJECTED (else ERR_INVALID_STATE)"
          - "X-User-ID == principal_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED_ACCEPTED
        trigger: POST /cost-disputes/{id}/resolve
        actor: AgencyAdmin
        preconditions:
          - "status == ESCALATED (else ERR_INVALID_STATE)"
          - "payload.decision == ACCEPT (else branch to RESOLVED_REJECTED)"
        side_effects: ["same credit mechanics as UPHELD"]
      - from: ESCALATED
        to: RESOLVED_REJECTED
        trigger: POST /cost-disputes/{id}/resolve
        actor: AgencyAdmin
        preconditions: ["status == ESCALATED and payload.decision == REJECT"]
        side_effects: ["linked DALine (if any) -> ACTUALIZED unchanged"]

  - entity: HusbandryCase
    initial_state: OPEN
    terminal_states: [CLEARED, REPATRIATED]
    transitions:
      - from: OPEN
        to: IN_TREATMENT
        trigger: POST /husbandry-cases/{id}/begin-treatment
        actor: HusbandryOfficer
        preconditions: ["status == OPEN (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: OPEN
        to: CLEARED
        trigger: POST /husbandry-cases/{id}/clear
        actor: HusbandryOfficer
        preconditions: ["status in {OPEN, IN_TREATMENT} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: IN_TREATMENT
        to: CLEARED
        trigger: POST /husbandry-cases/{id}/clear
        actor: HusbandryOfficer
        preconditions: ["status in {OPEN, IN_TREATMENT} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: OPEN
        to: REPATRIATED
        trigger: POST /husbandry-cases/{id}/repatriate
        actor: HusbandryOfficer
        preconditions:
          - "status in {OPEN, IN_TREATMENT} (else ERR_INVALID_STATE)"
          - "crew_change_id != null (else ERR_NO_LINKED_CREW_CHANGE)"
        side_effects: ["linked CrewChange -> REPATRIATED (from DOCS_VERIFIED, VISA_GRANTED, or SHORE_PASS_ISSUED); if the linked CrewChange is in {COMPLETED, CANCELLED} the cascade is skipped"]
      - from: IN_TREATMENT
        to: REPATRIATED
        trigger: POST /husbandry-cases/{id}/repatriate
        actor: HusbandryOfficer
        preconditions: ["as OPEN -> REPATRIATED"]
        side_effects: ["as OPEN -> REPATRIATED"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: da-create-stale-portcall
    parent_entity: PortCall
    write_endpoint: "POST /disbursement-accounts"
    occ_field: "expected_port_call_version"
    description: |
      Creating a DisbursementAccount for a PortCall whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION.
      The create legitimately supersedes any existing PRO_FORMA account of the
      same call, so a writer acting on a stale view would silently replace an
      account it never saw; the OCC check on PortCall.version forces the
      second writer to re-read before superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: portcall-patch-stale
    parent_entity: PortCall
    write_endpoint: "PATCH /port-calls/{id}"
    occ_field: "expected_port_call_version"
    description: |
      Patching eta/etd/cargo fields of a PortCall whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION.
      Schedule edits legitimately overwrite the same ETA/ETD fields, so the
      OCC check on PortCall.version forces the second writer to re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: port_dues_calc
    trigger: "DA creation or TARIFF-line refresh (ESTIMATE variant); PortCall record-sailing (FINAL variant actualizes the PORT_DUES line)"
    algorithm: tiered_pricing
    formula: |
      days = alongside_days_estimated (ESTIMATE) or alongside_days_actual (FINAL); days = ceil(hours/24), minimum 1.
      base = sum over marginal tiers: for each tier in tariff.gt_tiers ascending,
             billable_gt = min(vessel_gt, tier.gt_up_to or +inf) - sum(previous gt_up_to bounds);
             if billable_gt > 0: base += billable_gt * tier.rate_cents; stop when vessel_gt covered.
      base_total = base * days.
      night = (ESTIMATE: eta hour; FINAL: actual_arrival_at hour) in [18:00, 06:00) UTC.
      line_amount = base_total + (base_total * night_surcharge_pct if night) + (base_total * hazmat_surcharge_pct if hazmat_flag).
      Result rounded to integer cents round_half_up exactly once, at the end.
      Tier boundary: gt_up_to is INCLUSIVE (vessel_gt == gt_up_to bills entirely within that tier for that band).
    input_set: "the PUBLISHED Tariff for (port_call.port_code, PORT_DUES) — ESTIMATE pins the tariff published at DA-creation time (stored on DALine.tariff_id), FINAL uses the tariff PUBLISHED at sailing time, even if that supersedes the pinned one"
    constants:
      MIN_DAYS: 1
      NIGHT_WINDOW_START_HOUR: 18
      NIGHT_WINDOW_END_HOUR: 6
    precision: "integer cents, round_half_up applied once at line level"
    variants:
      - name: ESTIMATE
        when: "DA creation / pro-forma refresh while ops_status in {NOMINATED, PRE_ARRIVAL_FILED, CLEARED_TO_ENTER, ALONGSIDE}"
        difference: "uses eta/etd projected days and the tariff pinned at DA creation (DALine.tariff_id)"
      - name: FINAL
        when: "record-sailing actualization"
        difference: "uses actual_alongside days from actual timestamps and the tariff PUBLISHED at sailing time; identical inputs can therefore diverge from ESTIMATE when the tariff was superseded mid-call or actual duration differs from projection"

  - name: agency_fee_calc
    trigger: "any DALine create/actualize/reversal/dispute-credit on a DisbursementAccount (feeds da_totals_calc)"
    algorithm: aggregation
    formula: |
      fee_estimate = sum over lines where ALL lines of round_half_up(line.estimated_cents * 0.025)
      fee_final    = sum over lines where ALL lines of round_half_up(line.actual_cents * 0.025)   # actual_cents may be negative (credit lines); round_half_up applies to the signed product
      ROUNDING ORDER PINNED: round each line's fee to integer cents FIRST, then sum the rounded integers.
      (Sum-then-round is a rejected alternative: 3333 + 3333 estimated -> per-line 83 + 83 = 166, sum-based would give 167.)
    input_set: "all DALines of the DA regardless of line status {ESTIMATED, ACTUALIZED, DISPUTED}; reversed (zero-estimate) lines contribute 0"
    constants:
      AGENCY_FEE_PCT: 0.025
    precision: "integer cents, round_half_up per line then integer sum"

  - name: da_totals_calc
    trigger: "every mutation that creates/updates/reverses/actualizes a DALine, and every FundingAdvance create/apply/refund"
    algorithm: aggregation
    formula: |
      total_estimated_cents  = sum(line.estimated_cents for all lines) + agency_fee_estimated_cents
      advance_required_cents = round_half_up(0.80 * total_estimated_cents)
      funding fields: received = sum(amount_cents over advances in {RECEIVED, APPLIED});
                      applied  = sum(applied_cents over all advances);
                      refunded = sum(refunded_cents over all advances);
                      funding_available = received - applied - refunded (invariant: >= 0).
      FINAL variant adds: total_final_cents = sum(line.actual_cents) + agency_fee_final_cents;
                          balance_due_cents = total_final_cents - advances_applied_cents.
      Line processing order for any ordered presentation: DALine.created_at ASC, ties broken by category ASC.
    input_set: "all DALines and all FundingAdvances of the DA; SUPERSEDED DAs are excluded from principal exposure but keep their stored totals frozen"
    constants:
      ADVANCE_PCT: 0.80
    precision: "integer cents"
    variants:
      - name: ESTIMATE
        when: "always maintained"
        difference: "estimated side only; advance_required derives from estimated total including the per-line-rounded fee (fee depends on lines, advance depends on total including fee — evaluation order pinned: lines, then fee, then advance)"
      - name: FINAL
        when: "finalize / refinalize"
        difference: "final side only; identical line data produces a different total than ESTIMATE whenever any actual diverges from its estimate"

  - name: principal_exposure_calc
    trigger: "GET /principals/{id}/exposure; POST /port-calls credit gate"
    algorithm: aggregation
    formula: |
      For each DisbursementAccount whose port_call.principal_id == principal AND status != SUPERSEDED AND port_call.ops_status not in {CLOSED, CANCELLED}:
        forward_contribution  = total_final_cents   if status in {FINAL, DISPUTED, SETTLED} else total_estimated_cents
        cash_contribution     = advances_applied_cents + max(0, total_final_cents - advances_applied_cents) if status in {FINAL, DISPUTED, SETTLED} else advances_applied_cents
      forward_exposure_cents  = sum(forward_contribution)   # forward-looking: counts projected spend
      cash_basis_exposure_cents = sum(cash_contribution)    # cash view: counts only money actually committed
      credit_headroom_cents = null when credit_limit_cents == 0 (unlimited) else credit_limit_cents - forward_exposure_cents
    input_set: "non-SUPERSEDED DAs of the principal's port calls in ops_status not in {CLOSED, CANCELLED}"
    constants: {}
    precision: "integer cents"
    variants:
      - name: FORWARD_LOOKING
        when: "credit gate and exposure endpoint field forward_exposure_cents"
        difference: "PRO_FORMA/SENT/FUNDED accounts count at total_estimated_cents — money not yet received still counts as exposure"
      - name: CASH_BASIS
        when: "exposure endpoint field cash_basis_exposure_cents"
        difference: "same accounts count at advances_applied_cents only — a DA with estimate 100000 and 20000 applied contributes 100000 forward but 20000 cash-basis"

  - name: po_variance_calc
    trigger: "POST /purchase-orders/{id}/invoice, /reinvoice, /match"
    algorithm: threshold
    formula: |
      if estimated_cents == 0: variance_pct = 0.0 when invoiced_cents == 0 else 999.99 (sentinel for infinite overage)
      else variance_pct = round_half_up((invoiced_cents - estimated_cents) / estimated_cents * 100, 2)
      Branch: abs(variance_pct) <= 10.0  -> within tolerance (INVOICED / MATCHED)
              abs(variance_pct) >  10.0  -> DISPUTED.  Boundary PINNED: exactly 10.0 is WITHIN tolerance.
    input_set: "single PurchaseOrder estimated_cents and invoiced_cents"
    constants:
      VARIANCE_TOLERANCE_PCT: 10.0
    precision: "2 decimal places, round_half_up"

  - name: late_cancel_fee_calc
    trigger: "POST /service-orders/{id}/cancel"
    algorithm: threshold
    formula: |
      cutoff = window_start - 2 hours
      cancellation_fee_cents = round_half_up(0.25 * estimated_cents) when current_utc > cutoff, else 0
      Boundary PINNED: current_utc == cutoff exactly is NOT late (strictly-greater comparison).
      Cascade cancellations (PortCall cancel) always produce 0 regardless of clock.
    input_set: "single ServiceOrder estimated_cents, window_start, logical clock"
    constants:
      LATE_CANCEL_PCT: 0.25
      LATE_CANCEL_CUTOFF_MINUTES: 120
    precision: "integer cents, round_half_up"

  - name: overlap_check_calc
    trigger: "POST /berth-windows/{id}/confirm, POST /service-orders/{id}/confirm"
    algorithm: interval_merge
    formula: |
      BERTH semantics (half-open, no buffer): candidate conflicts with an occupant in {CONFIRMED, OCCUPIED}
        on the same berth_code iff occupant.start_at < candidate.end_at AND candidate.start_at < occupant.end_at.
        Adjacency (end == start) does NOT conflict.
      RESOURCE-UNIT semantics (buffer-inflated, closed): candidate conflicts with an occupant in {CONFIRMED, IN_PROGRESS}
        on the same resource_unit iff (occupant.window_start - 45m) <= (candidate.window_end + 45m)
        AND (candidate.window_start - 45m) <= (occupant.window_end + 45m).
        Inflated intervals that merely touch DO conflict; two raw windows need a gap > 90 minutes to be safe.
      REQUESTED berths and ORDERED service orders never occupy (only checked against, at their own confirm).
    input_set: "same-resource windows in occupying states {CONFIRMED, OCCUPIED} (berth) or {CONFIRMED, IN_PROGRESS} (service order)"
    constants:
      RESOURCE_UNIT_BUFFER_MINUTES: 45
    precision: "second precision on datetimes"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles (incl. conditional actor rules such as ServiceOrder confirm)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every path id resolves to an existing resource, validated left to right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "every FK-style payload reference (port_call_id, vendor_id, da_id, da_line_id, berth_window_id, crew_change_id) resolves to an existing resource", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all create/action endpoints with body references" }
  - { priority: 6, category: state, check: "target resource's state machine permits the requested transition from its current state", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "advance creation requires DA status in {SENT_TO_PRINCIPAL, FUNDED, FINAL, DISPUTED}", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /disbursement-accounts/{id}/advances" }
  - { priority: 6, category: state, check: "cost-dispute creation requires DA status in {FINAL, DISPUTED}", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /cost-disputes" }
  - { priority: 6, category: state, check: "PATCH requires ops_status in {NOMINATED, PRE_ARRIVAL_FILED}", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "PATCH /port-calls/{id}" }
  - { priority: 5, category: auth, check: "entity-backed ownership: PrincipalRep/VendorRep X-User-ID equals the resource's principal_id/vendor_id", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "cost-dispute create/escalate, purchase-order vendor actions, advances by PrincipalRep" }
  - { priority: 7, category: business_safety, check: "record-sailing: no CRITICAL HusbandryCase in {OPEN, IN_TREATMENT} without departure_waiver_granted", error_id: ERR_OPEN_CRITICAL_HUSBANDRY, http_status: 422, applies_to: "POST /port-calls/{id}/record-sailing" }
  - { priority: 8, category: business_temporal, check: "file-pre-arrival before eta - 24h; occupy/start not before window start (with documented lead); shore pass expiry in the future; passport_expiry strictly after etd", error_id: ERR_PRE_ARRIVAL_DEADLINE_MISSED, http_status: 422, applies_to: "POST /port-calls/{id}/file-pre-arrival" }
  - { priority: 8, category: business_temporal, check: "berth window / service window start strictly before end", error_id: ERR_WINDOW_INVALID, http_status: 422, applies_to: "POST /berth-windows, POST /service-orders" }
  - { priority: 8, category: business_temporal, check: "berth half-open overlap on same berth_code", error_id: ERR_BERTH_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /berth-windows/{id}/confirm" }
  - { priority: 8, category: business_temporal, check: "resource-unit buffer-inflated closed overlap on same resource_unit", error_id: ERR_RESOURCE_UNIT_OVERLAP, http_status: 409, applies_to: "POST /service-orders/{id}/confirm" }
  - { priority: 8, category: business_temporal, check: "occupy/start: current_utc >= start_at (berth) or window_start - 60m (service order)", error_id: ERR_WINDOW_NOT_STARTED, http_status: 422, applies_to: "POST /berth-windows/{id}/occupy, POST /service-orders/{id}/start" }
  - { priority: 8, category: business_temporal, check: "passport_expiry > port_call.etd", error_id: ERR_PASSPORT_EXPIRY_INVALID, http_status: 422, applies_to: "POST /crew-changes/{id}/verify-docs" }
  - { priority: 8, category: business_temporal, check: "shore_pass_expires_at > current_utc at issue; lazy PASS_EXPIRED flip on read", error_id: ERR_SHORE_PASS_EXPIRED, http_status: 422, applies_to: "POST /crew-changes/{id}/issue-shore-pass" }
  - { priority: 9, category: business_constraint, check: "per-call uniqueness: one AuthorityNotification per authority_type; one CargoDocument per bl_number", error_id: ERR_DUPLICATE_NOTIFICATION_TYPE, http_status: 409, applies_to: "POST /authority-notifications" }
  - { priority: 9, category: business_constraint, check: "per-call uniqueness of bl_number", error_id: ERR_DUPLICATE_BL_NUMBER, http_status: 409, applies_to: "POST /cargo-documents" }
  - { priority: 9, category: business_constraint, check: "file-pre-arrival/grant-clearance notification coverage and acknowledgement gates", error_id: ERR_NOTIFICATIONS_OUTSTANDING, http_status: 422, applies_to: "POST /port-calls/{id}/file-pre-arrival, POST /port-calls/{id}/grant-clearance" }
  - { priority: 9, category: business_constraint, check: "occupy requires HARBOR_MASTER notification ACKNOWLEDGED on the same port call", error_id: ERR_HM_ACK_OUTSTANDING, http_status: 422, applies_to: "POST /berth-windows/{id}/occupy" }
  - { priority: 9, category: business_constraint, check: "record-arrival/record-sailing referenced berth window belongs to this call", error_id: ERR_BERTH_WINDOW_MISMATCH, http_status: 422, applies_to: "POST /port-calls/{id}/record-arrival, POST /port-calls/{id}/record-sailing" }
  - { priority: 9, category: business_constraint, check: "referenced berth window is OCCUPIED for arrival/sailing", error_id: ERR_BERTH_NOT_OCCUPIED, http_status: 422, applies_to: "POST /port-calls/{id}/record-arrival, POST /port-calls/{id}/record-sailing" }
  - { priority: 9, category: business_constraint, check: "record-sailing: no crew change in {REQUESTED, DOCS_VERIFIED, VISA_PENDING, VISA_GRANTED, PASS_EXPIRED}", error_id: ERR_OPEN_CREW_CHANGES, http_status: 422, applies_to: "POST /port-calls/{id}/record-sailing" }
  - { priority: 9, category: business_constraint, check: "record-sailing: no cargo document ON_HOLD", error_id: ERR_CARGO_DOCS_ON_HOLD, http_status: 422, applies_to: "POST /port-calls/{id}/record-sailing" }
  - { priority: 9, category: business_constraint, check: "B/L release requires ops_status == ALONGSIDE", error_id: ERR_BL_RELEASE_TOO_EARLY, http_status: 422, applies_to: "POST /cargo-documents/{id}/release" }
  - { priority: 9, category: business_constraint, check: "B/L release requires freight_paid", error_id: ERR_FREIGHT_NOT_PAID, http_status: 422, applies_to: "POST /cargo-documents/{id}/release" }
  - { priority: 9, category: business_constraint, check: "request-visa only when requires_visa; issue-shore-pass from DOCS_VERIFIED only when not requires_visa", error_id: ERR_VISA_NOT_REQUIRED, http_status: 422, applies_to: "POST /crew-changes/{id}/request-visa" }
  - { priority: 9, category: business_constraint, check: "issue-shore-pass blocked when requires_visa and visa not granted", error_id: ERR_VISA_REQUIRED, http_status: 422, applies_to: "POST /crew-changes/{id}/issue-shore-pass" }
  - { priority: 9, category: business_constraint, check: "port call editable (not CANCELLED/CLOSED) for child mutations", error_id: ERR_PORT_CALL_NOT_EDITABLE, http_status: 422, applies_to: "child create/action endpoints" }
  - { priority: 9, category: business_constraint, check: "finalize requires port call SAILED", error_id: ERR_PORT_CALL_NOT_SAILED, http_status: 422, applies_to: "POST /disbursement-accounts/{id}/finalize" }
  - { priority: 9, category: business_constraint, check: "finalize/refinalize actor differs from DA creator (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /disbursement-accounts/{id}/finalize, POST /disbursement-accounts/{id}/refinalize" }
  - { priority: 9, category: business_constraint, check: "refinalize blocked while any dispute in {RAISED, UNDER_REVIEW, ESCALATED}", error_id: ERR_DISPUTES_OPEN, http_status: 422, applies_to: "POST /disbursement-accounts/{id}/refinalize" }
  - { priority: 9, category: business_constraint, check: "close requires DA SETTLED", error_id: ERR_DA_NOT_SETTLED, http_status: 422, applies_to: "POST /port-calls/{id}/close" }
  - { priority: 9, category: business_constraint, check: "record-sailing requires DA sent (status in {SENT_TO_PRINCIPAL, FUNDED, FINAL, DISPUTED, SETTLED})", error_id: ERR_DA_NOT_SENT, http_status: 422, applies_to: "POST /port-calls/{id}/record-sailing" }
  - { priority: 9, category: business_constraint, check: "repatriate requires linked crew change", error_id: ERR_NO_LINKED_CREW_CHANGE, http_status: 422, applies_to: "POST /husbandry-cases/{id}/repatriate" }
  - { priority: 10, category: business_referential, check: "principal must be ACTIVE to create port calls", error_id: ERR_PRINCIPAL_SUSPENDED, http_status: 422, applies_to: "POST /port-calls" }
  - { priority: 10, category: business_referential, check: "vendor must be ACTIVE for PO send/acknowledge and SO confirm", error_id: ERR_VENDOR_SUSPENDED, http_status: 422, applies_to: "POST /purchase-orders, POST /purchase-orders/{id}/send, POST /purchase-orders/{id}/acknowledge, POST /service-orders, POST /service-orders/{id}/confirm" }
  - { priority: 10, category: business_referential, check: "po.category must be listed in vendor.categories", error_id: ERR_VENDOR_CATEGORY_MISMATCH, http_status: 422, applies_to: "POST /purchase-orders" }
  - { priority: 10, category: business_referential, check: "vendor_id required for TUG/LINEBOAT/LAUNCH, forbidden for PILOT", error_id: ERR_VENDOR_KIND_MISMATCH, http_status: 422, applies_to: "POST /service-orders" }
  - { priority: 10, category: business_referential, check: "confirm actor must match kind: PortAuthority for PILOT, owning VendorRep otherwise", error_id: ERR_CONFIRM_ROLE_MISMATCH, http_status: 403, applies_to: "POST /service-orders/{id}/confirm" }
  - { priority: 11, category: business_fiscal, check: "record-sailing funding gate: advances_received - advances_refunded >= advance_required", error_id: ERR_FUNDING_SHORTFALL, http_status: 422, applies_to: "POST /port-calls/{id}/record-sailing" }
  - { priority: 11, category: business_fiscal, check: "port-call creation credit gate: credit_limit_cents == 0 or forward_exposure < credit_limit", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /port-calls" }
  - { priority: 11, category: business_fiscal, check: "settle requires zero unreceived-remainder advances", error_id: ERR_UNREFUNDED_ADVANCES, http_status: 422, applies_to: "POST /disbursement-accounts/{id}/settle" }
  - { priority: 11, category: business_fiscal, check: "settle requires balance_due_cents == 0 exactly", error_id: ERR_BALANCE_NOT_ZERO, http_status: 422, applies_to: "POST /disbursement-accounts/{id}/settle" }
  - { priority: 11, category: business_fiscal, check: "apply amount within remaining unapplied balance", error_id: ERR_APPLY_EXCEEDS_REMAINING, http_status: 422, applies_to: "POST /funding-advances/{id}/apply" }
  - { priority: 12, category: state, check: "OCC: expected_port_call_version equals current PortCall.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /disbursement-accounts, PATCH /port-calls/{id}" }
  - { priority: 13, category: business_constraint, check: "request shape: required fields present, enums valid, integers in range (vessel_gt > 0, amounts > 0 where required, quantity >= 1)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Principal ---
  - { method: POST, path: "/principals", description: "Create principal", roles: [AgencyAdmin], code: 201, input: [name, contact_email, credit_limit_cents], output: Principal, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/principals", description: "List principals (paginated)", roles: [AgencyAdmin, AgencyOps, AgencyFinance, PortAuthority, PrincipalRep, VendorRep, CrewingAgent, HusbandryOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "Principal[]", side_effects: [] }
  - { method: GET, path: "/principals/{id}", description: "Get principal", roles: [AgencyAdmin, AgencyOps, AgencyFinance, PortAuthority, PrincipalRep, VendorRep, CrewingAgent, HusbandryOfficer], code: 200, input: [], output: Principal, side_effects: [] }
