  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_site_version_rejects_the_delivery_without_pricing_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[delivery-create-stale-site]
          - endpoints[POST /warewashing/chemical-deliveries]
          - errors[ERR_STALE_PARENT_VERSION]
        distinguishing_aspect: |
          Two deliveries of the same product to the same site are both legitimate, so nothing but the
          version can refuse the second one: replaying the version observed before the first delivery
          returns ERR_STALE_PARENT_VERSION (412) with no row written and no further version bump, and the
          identical payload with the refreshed version is accepted. Site.version advances by exactly one
          per accepted write, so the refused attempt is invisible in the ledger.
        test_recipe:
          setup:
            - "One site under an ACTIVE agreement covering DET-100."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Harbor Grill Main Line", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id, site_v1: $.data.version }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-C1", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-02T00:00:00Z", unit_count: 10, expected_site_version: "${site_v1}" }
              as: AccountManager
              captures: { del_1: $.data.id, amt_1: $.data.amount_cents }
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-03T00:00:00Z", unit_count: 25, expected_site_version: "${site_v1}" }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "GET /warewashing/sites/${site_id}"
              payload: {}
              as: AccountManager
              captures: { site_v2: $.data.version }
            - call: "POST /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}", product_id: "${det_id}", delivered_at: "2026-08-03T00:00:00Z", unit_count: 25, expected_site_version: "${site_v2}" }
              as: AccountManager
              captures: { del_2: $.data.id, amt_2: $.data.amount_cents }
            - call: "GET /warewashing/chemical-deliveries"
              payload: { site_id: "${site_id}" }
              as: AccountManager
              captures: { total: $.total_count }
          assert:
            - "${amt_1} == 91200 (10 units, 5% tier, 9120 cents each) and ${site_v2} == ${site_v1} + 1"
            - "${err} == ERR_STALE_PARENT_VERSION with HTTP 412"
            - "${amt_2} == 211200 (25 units, 12% tier, 8448 cents each) - the retry with the fresh version prices identically to the refused attempt"
            - "${total} == 2 - the refused delivery was never stored"

      - name: a_stale_dispenser_version_rejects_the_second_calibration_record
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[calibration-record-stale-dispenser]
          - endpoints[POST /warewashing/service-visits/{visit_id}/calibration-records]
          - errors[ERR_STALE_PARENT_VERSION]
        distinguishing_aspect: |
          Recording a second measurement on the same dispenser inside the same visit is legitimate - it is
          how a failure is superseded - so only the version can refuse it. The first record bumps
          Dispenser.version even though applied stays false, so replaying the original version is
          ERR_STALE_PARENT_VERSION (412) while the refreshed version is accepted and the visit's record
          count reaches 2.
        test_recipe:
          setup:
            - "One IN_PROGRESS visit on an INSTALLED placement with one ACTIVE DET-100 dispenser."
          setup_api_calls:
            - call: "POST /warewashing/customers"
