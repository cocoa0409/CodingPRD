            - "PaymentTransaction.${txn_id}.funds_status stays SETTLED with current_batch_id == ${batch_id}"

      - name: err_stale_service_version_on_authorize
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_SERVICE_VERSION
          - entities.FeeQuote.fields.service_version_pinned
          - concurrency_rules[service-update-stale-version]
        distinguishing_aspect: "The quote pins service version 2 (post-activation); a repricing PUT bumps the service to 3; authorize then fails 409 ERR_STALE_SERVICE_VERSION and the quote stays OPEN."
        test_recipe:
          setup:
            - "CF agency base chain; one OPEN quote created while the service was at version 2; the service is then repriced (max_amount_cents 900000) with the correct OCC version."
          setup_api_calls:
            - *c_clock
            - *c_agency
            - *c_account
            - *c_verify
            - *c_attest
            - *c_agency_on
            - *c_service
            - *c_authz
            - *c_authz_ok
            - *c_service_on
            - *c_payer
            - *c_card
            - *c_quote100k
