      - name: filing_deadline_table_holiday_roll_and_unrolled_internal_target_across_four_cycles
        claim_type: constants_applied
        grounds:
          - calculations.statutory_deadline_resolution
          - calculations.business_day_calendar
          - entities.ReportingCycle.fields.statutory_deadline_utc
          - entities.ReportingCycle.fields.internal_target_utc
        distinguishing_aspect: |
          Four cycles created against one charter pin every branch of FILING_DEADLINE_DAYS and both
          halves of the declared asymmetry. FORM_10Q/LARGE_ACCELERATED on 2026-06-30 takes 40 days to a
          Sunday and rolls to 2026-08-10T17:30:00Z; FORM_10K/LARGE_ACCELERATED takes 60 days to a
          Saturday and rolls two days to 2026-08-31T17:30:00Z; FORM_10Q/NON_ACCELERATED takes 45 days to
          a Friday that needs no roll (2026-08-14T17:30:00Z) yet whose internal target lands on a Sunday
          (2026-08-09T17:30:00Z), proving the target is NOT business-day rolled; and a period ending
          2026-07-29 lands on 2026-09-07, which is in HOLIDAYS_UTC, so it rolls to 2026-09-08T17:30:00Z
          — a holiday roll, not merely a weekend roll.
        test_recipe:
          setup:
            - "One ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) with an ACTIVE voting FINANCE member."
            - "No cycles yet."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Standing Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
          trigger:
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { c1_deadline: $.data.statutory_deadline_utc, c1_target: $.data.internal_target_utc }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-FY", form_type: "FORM_10K", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { c2_deadline: $.data.statutory_deadline_utc, c2_target: $.data.internal_target_utc }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2-NA", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "NON_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { c3_deadline: $.data.statutory_deadline_utc, c3_target: $.data.internal_target_utc }
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2027-Q1", form_type: "FORM_10Q", period_end_date: "2026-07-29", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { c4_deadline: $.data.statutory_deadline_utc, c4_target: $.data.internal_target_utc }
          assert:
            - "${c1_deadline} == \"2026-08-10T17:30:00Z\" and ${c1_target} == \"2026-08-05T17:30:00Z\""
            - "${c2_deadline} == \"2026-08-31T17:30:00Z\" and ${c2_target} == \"2026-08-26T17:30:00Z\""
            - "${c3_deadline} == \"2026-08-14T17:30:00Z\" and ${c3_target} == \"2026-08-09T17:30:00Z\""
            - "${c4_deadline} == \"2026-09-08T17:30:00Z\" and ${c4_target} == \"2026-09-03T17:30:00Z\""

      - name: coverage_percentage_rounds_half_up_to_two_places_once_on_the_final_quotient
        claim_type: precision
        grounds:
          - calculations.certification_coverage_pct
          - calculations.cycle_total_assigned_scope_weight
          - calculations.subcert_scope_weight
          - entities.ReportingCycle.fields.certification_coverage_pct
        distinguishing_aspect: |
          Two cycles produce the two rounding directions from the same code path: 55.00 / 75.00 * 100 is
          73.3333..., which round_half_up truncates DOWN to 73.33, while 30.00 / 45.00 * 100 is
          66.6666..., which rounds UP to 66.67. Both are stored with exactly two decimals and the
          rounding is applied once, to the final quotient — 73.33 is unreachable if a per-scope-area
          percentage is rounded first and then averaged.
        test_recipe:
          setup:
            - "An ADOPTED charter with three ACTIVE non-officer members: FINANCE (voting), LEGAL (voting) and OPERATIONS (non-voting)."
            - "Cycle X in CLOSE_OPEN with sub-certifications REVENUE 30.00 (FINANCE), LEGAL_CONTINGENCY 25.00 (LEGAL) and OPERATIONS 20.00 (OPERATIONS)."
