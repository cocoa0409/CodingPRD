              payload: { bidder_id: "${b1}", amount_cents: 32000 }
              as: Bidder
              as_user_id: "${b1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /auction-lots/${lot1}/close"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { lot1_v: "$.data.version" }
            - call: "POST /auction-lots/${lot2}/close"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { lot2_v: "$.data.version" }
          trigger:
            - call: "POST /proceeds-distributions"
              payload: { auction_lot_id: "${lot1}", basis: "ACCRUAL", expected_auction_lot_version: "${lot1_v}" }
              as: FinanceController
              as_user_id: "finance-01"
              captures: { d1: "$.data.id" }
            - call: "POST /proceeds-distributions/${d1}/post"
              payload: {}
              as: FinanceController
              as_user_id: "finance-01"
            - call: "POST /proceeds-distributions"
              payload: { auction_lot_id: "${lot2}", basis: "ACCRUAL", expected_auction_lot_version: "${lot2_v}" }
              as: FinanceController
              as_user_id: "finance-01"
              captures: { d2: "$.data.id" }
            - call: "POST /proceeds-distributions/${d2}/post"
              payload: {}
              as: FinanceController
              as_user_id: "finance-01"
            - call: "POST /proceeds-distributions/${d1}/reverse"
              payload: { reversal_reason: "Buyer disputed the pallet count; proceeds withdrawn pending re-audit" }
              as: FinanceController
              as_user_id: "finance-01"
            - call: "POST /proceeds-distributions/${d1}/post"
              payload: {}
              as: FinanceController
              as_user_id: "finance-01"
          assert:
            - "before the trigger: Agency.${ag_st}.proceeds_account_balance_cents == 0 and posted_distribution_count == 0; AuctionLot.${lot1}.status == CLOSED_MET with closed_by_user_id == officer-01"
            - "ProceedsDistribution.${d1}: distributable_base_cents == 20000 (lot1.high_bid_cents), service_fee_cents == 2500 (round_half_up(20000 * 0.125), entirely inside tier 1), cost_recovery_cents == 0 (no clearance certificates), net_to_agency_cents == 17500, status CALCULATED, beneficiary_agency_id == ${ag_st}"
            - "the post of ${d1} succeeds because finance-01 != AuctionLot.${lot1}.closed_by_user_id == officer-01, satisfying priority 23"
            - "after posting ${d1}: status POSTED, posted_by_user_id == finance-01, posted_at == 2026-09-05T00:00:00Z, Agency.${ag_st}.proceeds_account_balance_cents == 17500 and posted_distribution_count == 1"
            - "ProceedsDistribution.${d2}: distributable_base_cents == 32000, service_fee_cents == 4000, cost_recovery_cents == 0, net_to_agency_cents == 28000"
            - "after posting ${d2}: Agency.${ag_st}.proceeds_account_balance_cents == 45500 and posted_distribution_count == 2 — 17500 + 28000"
            - "the reverse of ${d1} returns 200: status REVERSED with reversal_reason recorded; the precondition 45500 - 17500 >= 0 holds"
            - "after the reversal Agency.${ag_st}.proceeds_account_balance_cents == 28000 and posted_distribution_count == 1 — exactly the pre-post values, with no drift and no rounding residue"
            - "ProceedsDistribution.${d1}.net_to_agency_cents is still 17500 and distributable_base_cents still 20000 — the reversal recomputes the ledger over the surviving POSTED set rather than zeroing the audit row"
            - "the invariant SUM(Agency.proceeds_account_balance_cents) == SUM(ProceedsDistribution.net_to_agency_cents WHERE status == POSTED) == 28000 holds at every checkpoint"
            - "the second post of ${d1} returns 409 with error.code == ERR_INVALID_STATE — REVERSED is terminal, so the compensated credit cannot be reapplied"
            - "ProceedsDistribution.${d1}.version == 3 (created, posted, reversed) and is unchanged by the refused re-post; ${d2} remains POSTED at version 2"

      - name: ci_bidder_deposit_custody_apply_then_void_conserves_total
        grounds:
          - state_machines.SaleInvoice.transitions[PARTIALLY_PAID->VOIDED]
          - entities.Bidder.fields.deposit_paid_cents
          - entities.Bidder.fields.deposit_held_cents
          - entities.Bidder.fields.deposit_applied_cents
          - entities.Bidder.fields.deposit_forfeited_cents
        distinguishing_aspect: |
          The conserved quantity is bidder deposit custody, not a ledger of money owed:
          deposit_paid_cents == deposit_held_cents + deposit_applied_cents + deposit_forfeited_cents must
          hold across a partial payment that moves cash out of the held bucket and across the void that
          moves it back. Unlike ci_agency_proceeds_ledger_post_then_reverse_restores_balance the total
          never changes at all — only its partition does — and the compensation also zeroes the invoice's
          amount_paid_cents, so the derived balance_due_cents must be recomputed rather than adjusted.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, later 2026-09-01T00:00:00Z and 2026-09-05T00:00:00Z"
            - "one STATE_AGENCY organization DOT-01 with an ACCEPTED turn-in holding one de-minimis furniture pallet -> fair_market_value_cents 12540, reserve 7524, required_deposit_cents 0"
            - "venue AUS-01 with buyer_premium_pct 0.105 and sales_tax_pct 0.0635"
            - "bidder B1 REGISTERED with a 90000 deposit lodged before bidding, so deposit_paid_cents == deposit_held_cents == 90000"
            - "lot opened, a single 250000 bid placed, and the lot closed at 2026-09-05 so the close cascade issues the invoice"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag_st: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag_st}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { ti1: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti1}", category: "FURNITURE", description: "Lateral file cabinets, single pallet", acquisition_cost_cents: 104500, acquisition_date: "2024-05-20" }
              as: AgencyOfficer
              as_user_id: "${ag_st}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti1}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag_st}"
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C6", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-30", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
            - call: "POST /turn-ins/${ti1}/review"
              payload: { decision: "ACCEPT" }
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /venues"
              payload: { name: "Austin Surplus Yard", venue_code: "AUS-01", concurrent_lot_capacity: 2, buyer_premium_pct: 0.105, sales_tax_pct: 0.0635 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v1: "$.data.id" }
            - call: "POST /auction-lots"
              payload: { asset_id: "${a1}", venue_id: "${v1}", opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-05T00:00:00Z" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { lot1: "$.data.id" }
            - call: "POST /bidders"
              payload: { legal_name: "Lone Star Salvage LLC", email: "bids@lonestarsalvage.example", bidder_type: "BUSINESS" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { b1: "$.data.id" }
            - call: "POST /bidders/${b1}/status"
              payload: { status: "REGISTERED" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /bidders/${b1}/deposits"
              payload: { amount_cents: 90000 }
              as: Bidder
              as_user_id: "${b1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /auction-lots/${lot1}/open"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /auction-lots/${lot1}/bids"
              payload: { bidder_id: "${b1}", amount_cents: 250000 }
              as: Bidder
              as_user_id: "${b1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /auction-lots/${lot1}/close"
              payload: {}
              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "GET /sale-invoices?auction_lot_id=${lot1}"
              payload: {}
              as: FinanceController
              as_user_id: "finance-01"
              captures: { inv1: "$.data[0].id" }
          trigger:
            - call: "POST /sale-invoices/${inv1}/payments"
              payload: { amount_cents: 10000, use_deposit: true }
              as: Bidder
              as_user_id: "${b1}"
            - call: "POST /sale-invoices/${inv1}/void"
              payload: { void_reason: "Buyer withdrew before collection; lot to be relisted" }
              as: FinanceController
              as_user_id: "finance-01"
            - call: "POST /sale-invoices/${inv1}/payments"
              payload: { amount_cents: 5000, use_deposit: true }
              as: Bidder
              as_user_id: "${b1}"
          assert:
            - "checkpoint 1, before the payment: Bidder.${b1}.deposit_paid_cents == 90000, deposit_held_cents == 90000, deposit_applied_cents == 0, deposit_forfeited_cents == 0 — the partition sums to 90000"
            - "SaleInvoice.${inv1} from the close cascade: hammer_price_cents == 250000, buyer_premium_cents == 26250 (round_half_up(250000 * 0.105)), sales_tax_cents == 17542 (round_half_up((250000 + 26250) * 0.0635)), total_due_cents == 293792, status ISSUED, due_at == 2026-09-12T00:00:00Z"
            - "the payment returns 200: SaleInvoice.${inv1}.deposit_applied_cents == 90000 — min(deposit_held_cents 90000, balance_due_cents 293792), applied before the cash"
            - "SaleInvoice.${inv1}.amount_paid_cents == 100000 — the 10000 cash plus the 90000 applied deposit — and balance_due_cents == 193792 == 293792 - 100000"
            - "SaleInvoice.${inv1}.status == PARTIALLY_PAID and AuctionLot.${lot1}.status is still CLOSED_MET — the payment did not settle the lot"
            - "checkpoint 2, after the payment: Bidder.${b1}.deposit_held_cents == 0, deposit_applied_cents == 90000, deposit_forfeited_cents == 0, deposit_paid_cents == 90000 — the total is untouched and only the partition moved"
            - "the void returns 200: SaleInvoice.${inv1}.status == VOIDED with void_reason recorded"
            - "checkpoint 3, after the void: Bidder.${b1}.deposit_held_cents == 90000, deposit_applied_cents == 0, deposit_forfeited_cents == 0, deposit_paid_cents == 90000 — custody is restored exactly, with nothing forfeited"
            - "SaleInvoice.${inv1}.deposit_applied_cents == 0 and amount_paid_cents == 0 after the void, so balance_due_cents == 293792 is recomputed from total_due_cents rather than decremented"
            - "the invariant deposit_paid_cents == deposit_held_cents + deposit_applied_cents + deposit_forfeited_cents holds at all three checkpoints"
            - "the final POST /sale-invoices/${inv1}/payments returns 409 with error.code == ERR_INVALID_STATE — VOIDED admits no payment, so the restored deposit cannot be applied to the dead invoice"
            - "after that refusal Bidder.${b1}.deposit_held_cents is still 90000 and SaleInvoice.${inv1}.amount_paid_cents is still 0"
