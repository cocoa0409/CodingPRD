# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3272_registry_operations_renewal_grace_periods_registrar_accreditation
# Nine difficulty rules x two instances each. Every recipe drives empty-DB ->
# precondition using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: accreditation_all_in_provisional_prorates_partial_year
        grounds:
          - calculations.accreditation_all_in_cost
          - calculations.prorated_annual_fee
          - entities.Registrar.fields.all_in_cost_cents
        distinguishing_aspect: "On the Registrar entity domain, the PROVISIONAL variant prorates the annual fee over the 291 days remaining in 2026 (Mar 16 to Jan 1), yielding 1,568,904c — an accreditation-finance number, not a domain-lifecycle number."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-16T00:00:00Z. One registrar applicant with application_fee 250000, annual_fee 400000, escrow 1000000, passing tests."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8001, legal_name: "Alpha Registrar LLC", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 92, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
              captures: { all_in: $.data.all_in_cost_cents, mode: $.data.annual_fee_mode }
          assert:
            - "Registrar.${reg_id}.annual_fee_mode == PROVISIONAL"
            - "Registrar.${reg_id}.all_in_cost_cents == 1568904"
            - "the ACCREDITATION invoice for registrar ${reg_id} has base_cents == 1568904 and premium_surcharge_cents == 0"
            - "the LedgerEntry DEBIT for registrar ${reg_id} has amount_cents == -1568904"

      - name: lifecycle_invoice_restore_variant_adds_restore_fee_on_domain
        grounds:
          - calculations.lifecycle_invoice
          - state_machines.Domain.REDEMPTION_GRACE_to_ACTIVE
          - entities.Invoice.fields.base_cents
        distinguishing_aspect: "On the Domain entity domain, the RESTORE variant composes renew_fee + restore_fee (12850 base on the default schedule) and then applies the 10% premium surcharge to the composite, yielding 14135c for a premium name — a domain-lifecycle fee, structurally distinct from the Registrar accreditation all-in figure."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-15T00:00:00Z. Price schedule effective 2026-01-01 (create 700, renew 850, restore 12000, transfer 700). ACTIVE registrar R. Premium domain created for 1 year, deleted into REDEMPTION_GRACE."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 8002, legal_name: "Beta Registrar Inc", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 95, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "premium-example", registrar_id: "${reg_id}", years: 1, premium: true }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/domains/${dom_id}/delete"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
          trigger:
            - call: "POST /registry/domains/${dom_id}/restore"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
          assert:
            - "Domain.${dom_id}.status == ACTIVE"
            - "the RESTORE invoice for domain ${dom_id} has base_cents == 12850 and premium_surcharge_cents == 1285 and total_cents == 14135"
            - "the LedgerEntry DEBIT against registrar ${reg_id} for the restore has amount_cents == -14135"
            - "the RESTORE invoice's price_schedule_id == ${sched_id}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: price_cap_compounds_against_jan1_baseline_not_prior_increase
        grounds:
          - calculations.wholesale_price_cap
          - validations[priority=10]
          - errors.ERR_PRICE_CAP_EXCEEDED
        distinguishing_aspect: "Mode (a): the cap has >= 3 inputs with non-linear interaction — a 2026 mid-year schedule at 750 passes against the Jan-1 baseline 700 (ceiling 770), but a second 2026 increase to 780 fails against the SAME baseline 700, not against 750 (which would allow 825)."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T00:00:00Z. Baseline schedule effective 2026-01-01 with create_fee 700. A mid-year schedule effective 2026-07-01 with create_fee 750 already proposed and accepted."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-06-30T00:00:00Z" }
              as: RegistryAdmin
              captures: { sched_base: $.data.id }
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 750, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-12-31T00:00:00Z", supersedes_schedule_id: "${sched_base}" }
              as: RegistryAdmin
              captures: { sched_mid: $.data.id }
          trigger:
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 780, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2027-06-30T00:00:00Z", supersedes_schedule_id: "${sched_mid}" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the third submission is rejected 409 with error_id == ERR_PRICE_CAP_EXCEEDED"
            - "780 > round_half_up(700 * 1.10) == 770, and the cap did NOT compound off the 750 mid-year schedule (which would have allowed 825)"

      - name: premium_surcharge_rounds_composite_restore_base_once
        grounds:
          - calculations.lifecycle_invoice
          - entities.Invoice.fields.premium_surcharge_cents
        distinguishing_aspect: "Mode (b): nested rounding order is pinned — the premium surcharge is computed on the composite base (renew 850 + restore 12000 = 12850) and rounded round_half_up ONCE to 1285; rounding renew and restore surcharges separately (85 + 1200 = 1285 here, but 849-fee schedules diverge) is the forbidden order the formula rules out by pinning base-first-then-surcharge."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-15T00:00:00Z. Schedule effective (renew 850, restore 12000). ACTIVE registrar; premium domain deleted into REDEMPTION_GRACE."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8003, legal_name: "Gamma Registrar SA", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 88, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "roundtrip-premium", registrar_id: "${reg_id}", years: 1, premium: true }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/domains/${dom_id}/delete"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
          trigger:
            - call: "POST /registry/domains/${dom_id}/restore"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
          assert:
            - "the RESTORE invoice's premium_surcharge_cents == 1285 — computed as round_half_up((850+12000)*0.10), the composite-base order"
            - "the RESTORE invoice's total_cents == 14135"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transfer_dispute_cycle_back_to_completed_on_uphold
        grounds:
          - state_machines.Transfer.DISPUTED_to_COMPLETED
          - state_machines.Transfer.COMPLETED_to_DISPUTED
        distinguishing_aspect: "Transfer is a cyclic machine: COMPLETED -> DISPUTED -> COMPLETED loops via reverse with uphold=true, and the Domain's registrar/extension state must be identical before and after the full loop."
        test_recipe:
          setup:
            - "Clock 2026-01-01. Schedule effective. Registrars A (loser) and B (winner) both ACTIVE. Domain created by A on 2026-01-02 (60-day window opens 2026-03-03). Clock advanced to 2026-03-10. B requests transfer; A acks; B completes."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8101, legal_name: "Loser Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 8102, legal_name: "Winner Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_b: $.data.id }
            - call: "POST /registry/registrars/${reg_a}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/registrars/${reg_b}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "cycle-domain", registrar_id: "${reg_a}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
              captures: { dom_id: $.data.id, dom_exp: $.data.expires_on }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/transfers"
              payload: { domain_id: "${dom_id}", to_registrar_id: "${reg_b}" }
              as: RegistrarOperator
              as_user_id: "${reg_b}"
              captures: { xfer_id: $.data.id, ac: $.data.auth_code }
            - call: "POST /registry/transfers/${xfer_id}/ack"
              payload: { auth_code: "${ac}" }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
            - call: "POST /registry/transfers/${xfer_id}/complete"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_b}"
          trigger:
            - call: "POST /registry/transfers/${xfer_id}/dispute"
              payload: { dispute_reason: "fraudulent auth code use" }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
            - call: "POST /registry/transfers/${xfer_id}/reverse"
              payload: { uphold: true }
              as: RegistryAdmin
          assert:
            - "Transfer.${xfer_id}.status == COMPLETED after the uphold (cycle returned to the pre-dispute state)"
            - "Domain.${dom_id}.registrar_id == ${reg_b} (unchanged by the dispute cycle)"
            - "Domain.${dom_id}.expires_on is 1 year beyond ${dom_exp} exactly once — the dispute cycle added no extra extension"
            - "no TRANSFER invoice was voided by the uphold"

      - name: domain_parallel_dimensions_lock_and_suspension_independent
        grounds:
          - state_machines.Domain
          - entities.Domain.fields.lock_status
          - entities.Domain.fields.suspension_status
        distinguishing_aspect: "Domain carries three parallel state dimensions (lifecycle status x lock_status x suspension_status) that evolve independently: a domain can be put under REGISTRY_LOCK while ACTIVE and then have suspension flip to HOLD via an abuse action without either dimension mutating the other or the lifecycle state."
        test_recipe:
          setup:
            - "Clock 2026-02-01. Schedule effective. ACTIVE registrar; ACTIVE domain with no lock and no suspension."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8103, legal_name: "Delta Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 91, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "parallel-dims", registrar_id: "${reg_id}", years: 2 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id, dom_v: $.data.version }
            - call: "POST /registry/domains/${dom_id}/lock"
              payload: { lock_action: "REGISTRY_LOCK", expected_domain_version: "${dom_v}", lock_token: "s3cret" }
              as: RegistryAdmin
            - call: "POST /registry/abuse-reports"
              payload: { domain_id: "${dom_id}", reporter_contact: "le@agency.example", category: "PHISHING", detail: "phishing kit hosted" }
              as: AbuseAnalyst
              captures: { rep_id: $.data.id }
            - call: "POST /registry/abuse-reports/${rep_id}/review"
              payload: {}
              as: AbuseAnalyst
          trigger:
            - call: "POST /registry/abuse-reports/${rep_id}/resolve"
              payload: { action: "ACTIONED" }
              as: AbuseAnalyst
            - call: "GET /registry/domains/${dom_id}"
              payload: {}
              as: RegistryAdmin
              captures: { st: $.data.status, lk: $.data.lock_status, sp: $.data.suspension_status }
          assert:
            - "Domain.${dom_id}.status == ACTIVE (lifecycle dimension untouched by lock and suspension)"
            - "Domain.${dom_id}.lock_status == REGISTRY_LOCK (set before, unchanged by the abuse action)"
            - "Domain.${dom_id}.suspension_status == HOLD (set by the abuse action alone)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_cascades_auto_renew_then_lapse_then_pending_delete
        grounds:
          - state_machines.Domain.ACTIVE_to_AUTO_RENEW_GRACE
          - state_machines.Domain.AUTO_RENEW_GRACE_to_REDEMPTION_GRACE
          - state_machines.Domain.REDEMPTION_GRACE_to_PENDING_DELETE
          - entities.Invoice.fields.status
        distinguishing_aspect: "Depth-3 cascade triggered by a clock advance: expiry flips Domain ACTIVE->AUTO_RENEW_GRACE (mints AUTO_RENEW invoice + ledger DEBIT); the grace lapse flips to REDEMPTION_GRACE and THAT flip itself voids the AUTO_RENEW invoice and posts a compensating VOID_CREDIT — each link caused by the previous, not by the original clock call."
        test_recipe:
          setup:
            - "Clock 2026-01-15. Schedule effective. ACTIVE registrar; domain 'cascade-me' 1 year (expires 2027-01-15). Registrar ledger topped up to observe net movement."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8201, legal_name: "Cascade Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "cascade-me", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /registry/domains/${dom_id}"
              payload: {}
              as: RegistryAdmin
              captures: { dom_status: $.data.status }
            - call: "GET /registry/invoices"
              payload: { domain_id: "${dom_id}", kind: "AUTO_RENEW" }
              as: RegistryFinance
              captures: { auto_inv_status: "$.data[0].status" }
            - call: "GET /registry/registrars/${reg_id}/ledger"
              payload: {}
              as: RegistryFinance
          assert:
            - "Domain.${dom_id}.status == REDEMPTION_GRACE"
            - "the AUTO_RENEW invoice for domain ${dom_id} has status == VOIDED"
            - "the registrar ledger contains a DEBIT -850 (auto-renew) and a compensating VOID_CREDIT +850 — net zero for the lapsed auto-renewal"
            - "Domain.${dom_id}.expires_on reverted to 2027-01-15 (the auto-renew extension unwound)"

      - name: transfer_reversal_cascades_domain_revert_then_invoice_void
        grounds:
          - state_machines.Transfer.DISPUTED_to_REVERSED
          - entities.Domain.fields.registrar_id
          - entities.Invoice.fields.status
        distinguishing_aspect: "Depth-2 cascade from the reverse transition (distinct trigger from the clock cascade): reverse mutates Domain (registrar reverts, extension unwound), and THAT domain mutation voids the TRANSFER invoice and posts the VOID_CREDIT repaying the gaining registrar."
        test_recipe:
          setup:
            - "Clock 2026-01-01, schedule effective, registrars A and B ACTIVE, domain created by A on 2026-01-02. Clock at 2026-03-10; transfer requested, acked, completed; then disputed by A."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8202, legal_name: "Origin Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 8203, legal_name: "Recipient Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_b: $.data.id }
            - call: "POST /registry/registrars/${reg_a}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/registrars/${reg_b}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "reverse-me", registrar_id: "${reg_a}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/transfers"
              payload: { domain_id: "${dom_id}", to_registrar_id: "${reg_b}" }
              as: RegistrarOperator
              as_user_id: "${reg_b}"
              captures: { xfer_id: $.data.id, ac: $.data.auth_code }
            - call: "POST /registry/transfers/${xfer_id}/ack"
              payload: { auth_code: "${ac}" }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
            - call: "POST /registry/transfers/${xfer_id}/complete"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_b}"
            - call: "POST /registry/transfers/${xfer_id}/dispute"
              payload: { dispute_reason: "hijacked auth channel" }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
          trigger:
            - call: "POST /registry/transfers/${xfer_id}/reverse"
              payload: {}
              as: RegistryAdmin
            - call: "GET /registry/domains/${dom_id}"
              payload: {}
              as: RegistryAdmin
              captures: { dom_reg: $.data.registrar_id, dom_exp: $.data.expires_on }
            - call: "GET /registry/invoices"
              payload: { domain_id: "${dom_id}", kind: "TRANSFER" }
              as: RegistryFinance
              captures: { xfer_inv_status: "$.data[0].status" }
          assert:
            - "Transfer.${xfer_id}.status == REVERSED"
            - "Domain.${dom_id}.registrar_id == ${reg_a} (reverted to the losing registrar)"
            - "Domain.${dom_id}.expires_on == 2027-01-02T00:00:00Z (the +1y transfer extension unwound)"
            - "the TRANSFER invoice has status == VOIDED and registrar ${reg_b}'s ledger holds a compensating VOID_CREDIT +700"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_domain_and_stale_grace_window_state_beats_temporal
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Pair (state, business_temporal): renewing a domain already in REDEMPTION_GRACE must return the priority-4 state error ERR_INVALID_STATE, not the priority-7 ERR_GRACE_WINDOW_CLOSED — even though the grace window is also closed."
        test_recipe:
          setup:
            - "Clock 2026-01-15, schedule effective, ACTIVE registrar, domain created for 1y and deleted into REDEMPTION_GRACE. Clock advanced beyond grace_deadline so the temporal check would also fail."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8301, legal_name: "Conflict Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
