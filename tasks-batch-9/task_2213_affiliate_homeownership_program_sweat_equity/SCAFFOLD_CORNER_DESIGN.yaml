            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${shift_v1}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_a}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { asg_a: $.data.id } }
            - { call: "POST /homeownership/shift-assignments/${asg_a}/confirm", payload: {}, as: Volunteer, as_user_id: "${vol_a}" }
            - { call: "GET /homeownership/construction-shifts/${shift_id}", as: ConstructionManager, as_user_id: "cm-1", captures: { shift_v2: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${shift_v2}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_b}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { asg_b: $.data.id } }
            - { call: "POST /homeownership/shift-assignments/${asg_b}/confirm", payload: {}, as: Volunteer, as_user_id: "${vol_b}" }
            - { call: "GET /homeownership/construction-shifts/${shift_id}", as: ConstructionManager, as_user_id: "cm-1", captures: { shift_v3: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${shift_v3}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_c}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { asg_c: $.data.id } }
          trigger:
