            - "est == 518400 and settled == 518400, from per-head round_half_up(4800 * 8 * 1.35) == 51840 multiplied by the 10-head crew"
            - "the first trigger call returns HTTP 409 with e_call == ERR_INVALID_LABOR_CALL_STATE and LaborCall.${lc}.status stays WORKED with settled_cost_cents still 518400"
            - "the second trigger call returns HTTP 409 with e_iss == ERR_INVALID_ISSUE_STATE and EquipmentIssue.${iss}.status stays RETURNED with damaged_units still 0"
            - "the EquipmentAsset row ${asset} reads units_available == 6, units_out_of_service == 0 and cycles_since_service == 1, so the refused second return neither withdrew a unit nor counted a second cycle"

