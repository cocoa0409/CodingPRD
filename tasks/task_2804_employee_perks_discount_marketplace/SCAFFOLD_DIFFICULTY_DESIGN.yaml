  - rule_id: transitive_cascade
    instances:

      - name: employment_termination_revokes_membership_voids_redemption_and_frees_inventory
        grounds:
          - state_machines.EmployeeMembership.ELIGIBLE_to_REVOKED
          - state_machines.Redemption.PENDING_to_VOID
          - entities.Redemption.fields.void_reason
          - entities.Offer.fields.inventory_reserved
          - entities.Offer.fields.sold_out
          - calculations.employer_eligible_headcount
        distinguishing_aspect: |
          Depth-3 chain from a single employment-status write: link 1 moves the membership
          ELIGIBLE -> REVOKED, link 2 exists only because link 1 happened and voids that
          membership's PENDING redemption with void_reason MEMBERSHIP_INELIGIBLE, link 3
          exists only because link 2 happened and returns the reserved inventory unit so the
          offer flips sold_out from true to false; the trigger is an employment-status write,
          not a merchant termination.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ACTIVE DINING/CA merchant with an ACTIVE agreement; employer LIVE with exactly one ELIGIBLE/ACTIVE CA membership."
