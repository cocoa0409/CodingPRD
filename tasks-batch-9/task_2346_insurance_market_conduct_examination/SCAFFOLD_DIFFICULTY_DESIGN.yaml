  # =============================================================================
  # RULE 7 - cross_entity_state_dependency
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: lock_scope_blocked_by_withdrawn_insurer_license
        grounds:
          - validations[priority 50 ERR_INSURER_NOT_EXAMINABLE]
          - state_machines.Examination
          - entities.Insurer.fields.license_status
          - endpoints[PATCH /market-conduct/insurers/{id}/market-data]
        distinguishing_aspect: |
          The gate lives on the GRANDPARENT-side entity and is re-evaluated late: the examination was
          legally opened while the carrier was LICENSED, and only the license_status changing to
          WITHDRAWN afterwards blocks lock-scope. Moving the carrier to SUSPENDED - which is still
          examinable - then unblocks the very same call, so the rule tests set membership rather than
          "not LICENSED".
        test_recipe:
          setup:
            - "Insurer AURORA created LICENSED; ON_SITE examination 2026-09-01 .. 2026-11-30 opened against it in SCOPING with one CLAIMS scope area (population 4000, sample 10)."
            - "The carrier then withdraws from the state: PATCH /insurers/{id}/market-data sets license_status WITHDRAWN."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id", license_initial: "$.data.license_status" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id" }
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { license_status: "WITHDRAWN" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { license_withdrawn: "$.data.license_status" }
          trigger:
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "TARGETED_EXAM", mode: "DESK", lead_state_code: "NV", fieldwork_start_date: "2027-06-01", fieldwork_end_date: "2027-07-31" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "PATCH /market-conduct/insurers/${aurora_id}/market-data"
              payload: { license_status: "SUSPENDED" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { license_suspended: "$.data.license_status" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_status_after: "$.data.status", scope_locked: "$.data.scope_locked" }
          assert:
            - "The first lock-scope returns 409 ERR_INSURER_NOT_EXAMINABLE"
            - "Examination.${exam_id}.status is still SCOPING and scope_locked == false after the refusal"
            - "Opening a NEW examination on the WITHDRAWN carrier also returns 409 ERR_INSURER_NOT_EXAMINABLE (the same rule guards POST /examinations)"
            - "Insurer.${aurora_id}.open_exam_count is still 1 (no examination was created)"
            - "After the license moves to SUSPENDED the replayed lock-scope returns 200 with status DATA_CALL and scope_locked == true"
            - "The examination's own state was never corrupted by the two refusals: scope_area_count == 1 and version advanced only on the successful lock"

      - name: consent_order_gate_reads_plan_state_not_plan_existence
        grounds:
          - validations[priority 60 ERR_CAP_NOT_APPROVED]
          - state_machines.CorrectiveActionPlan
          - state_machines.Examination
          - entities.CorrectiveActionPlan.fields.revision_round
        distinguishing_aspect: |
          A plan EXISTS for the whole instance, so nothing can pass by mere presence: while the only plan
          sits in REVISION_REQUESTED the order is refused, filing a replacement supersedes the first
          plan (revision_round 2) yet is still refused while PROPOSED, and only APPROVED opens the gate.
          The superseded plan is proven not to have been deleted, which distinguishes this from the
          priority-pair instance where no plan existed at all.
        test_recipe:
          setup:
            - "SETUP-CHAIN-A-24M: AURORA carrier, ON_SITE examination 2026-09-01 .. 2026-11-30, CLAIMS area population 4000 / sample 10, sample harm 30000 / 20000 / 10000 -> extrapolated exposure 24000000, one MATERIAL criticism SUSTAINED with penalty_units 20 -> examination NEGOTIATION, aggregate_restitution_cents 24000000, penalty_units_total 20."
