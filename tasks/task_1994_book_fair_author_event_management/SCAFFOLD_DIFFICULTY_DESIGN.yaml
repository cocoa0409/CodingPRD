            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /stock-lines", payload: { fair_id: "${fair_id}", agreement_id: "${agr_id}", isbn: "9780000000001", title: "Dragon Tales", list_price_cents: 1000, line_type: FRONTLIST, qty_committed: 10 }, as: Organizer, captures: { line_id: "$.data.id" } }
            - { call: "POST /stock-lines/${line_id}/commit", payload: {}, as: Organizer }
            - { call: "POST /stock-lines/${line_id}/deliver", payload: { qty_delivered: 10 }, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /sales", payload: { fair_id: "${fair_id}", lines: [{ stock_line_id: "${line_id}", qty: 3 }] }, as: Cashier, captures: { sale_id: "$.data.id" } }
          trigger:
            - { call: "POST /sales/${sale_id}/tender", payload: { tendered_amount_cents: 3000 }, as: Cashier, captures: { total_seen: "$.data.total_cents", change_seen: "$.data.change_cents" } }
            - { call: "GET /stock-lines/${line_id}", payload: {}, as: Organizer, captures: { sold_after_tender: "$.data.qty_sold", avail_after_tender: "$.data.qty_available_for_sale" } }
            - { call: "POST /sales/${sale_id}/void", payload: {}, as: Cashier }
            - { call: "GET /stock-lines/${line_id}", payload: {}, as: Organizer, captures: { sold_after_void: "$.data.qty_sold", avail_after_void: "$.data.qty_available_for_sale" } }
            - { call: "GET /fairs/${fair_id}", payload: {}, as: Organizer, captures: { gross_after_void: "$.data.gross_sales_cents" } }
          assert:
            - "Tender response: total_cents == 3000 and change_cents == 0"
            - "After tender: qty_sold == 3 and qty_available_for_sale == 7 (10 == 0 held + 3 sold + 0 damaged + 0 returned + 7 available)"
            - "After void: qty_sold == 0 and qty_available_for_sale == 10 (invariant restored exactly)"
            - "Fair.${fair_id}.gross_sales_cents == 0 after void (was 3000 after tender — full compensation, no drift)"
            - "SaleTransaction.${sale_id}.status == VOIDED"

      - name: ticket_issue_void_entitlement_conservation
        grounds:
          - state_machines.SigningTicket.ISSUED_to_VOIDED (via [ISSUED, ADMITTED] -> VOIDED)
          - validations[priority=18]
          - errors[ERR_SIGNING_CAPACITY_EXCEEDED]
          - entities.SigningSession.fields.capacity_seats
        distinguishing_aspect: |
          Conserved quantity: ENTITLEMENT SLOTS (distinct from physical copies):
          live entitlements (ISSUED + ADMITTED + REDEEMED) never exceed
          capacity_seats, and issue + compensating void restore availability
          exactly — a third issue fails at full capacity (2/2), succeeds after one
          void, and the session ends at exactly 2 live entitlements again.
        test_recipe:
          setup:
            - "Fair OPEN; booking TRAVEL_BOOKED; TICKETED session SCHEDULED with capacity_seats 2"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: AUTHOR, name: "Jane Writer", contact_email: "agent@jane.example" }, as: Organizer, captures: { author_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /author-bookings", payload: { fair_id: "${fair_id}", author_party_id: "${author_id}", base_honorarium_cents: 10000, travel_cap_cents: 2000, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72 }, as: Organizer, captures: { booking_id: "$.data.id" } }
            - { call: "POST /author-bookings/${booking_id}/accept", payload: {}, as: AuthorRep, as_user_id: "${author_id}" }
            - { call: "POST /author-bookings/${booking_id}/book-travel", payload: { travel_actual_cents: 1500 }, as: Organizer }
            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: TICKETED, start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", line_space_units: 5, capacity_seats: 2, admit_concurrent_cap: 2 }, as: Organizer, captures: { session_id: "$.data.id" } }
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid One" }, as: LineStaff, captures: { t1_id: "$.data.id" } }
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid Two" }, as: LineStaff, captures: { t2_id: "$.data.id" } }
          trigger:
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid Three" }, as: LineStaff, captures: { err_full: "$.data.error_id" } }
            - { call: "POST /signing-tickets/${t1_id}/void", payload: {}, as: LineStaff }
            - { call: "POST /signing-tickets", payload: { session_id: "${session_id}", holder_name: "Kid Three" }, as: LineStaff, captures: { t3_id: "$.data.id" } }
          assert:
            - "First issue of Kid Three is rejected with ERR_SIGNING_CAPACITY_EXCEEDED (2 live of capacity 2)"
            - "After voiding ${t1_id}, the identical issue succeeds and SigningTicket.${t3_id}.status == ISSUED"
            - "Session ends with exactly 2 live entitlements (${t2_id} ISSUED + ${t3_id} ISSUED) and 1 VOIDED — issue+void conserved the capacity invariant"
