  # =======================================================================
  # RULE 9 - compensating_invariant
  # =======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: blend_reject_restores_fired_unit_conservation_across_two_lots
        grounds:
          - state_machines.ShippedBlend.COMPOSED_to_DRAFT
          - state_machines.BlendComponent.ALLOCATED_to_VOIDED
          - state_machines.FiredLot.RESERVED_to_AVAILABLE
          - entities.FiredLot.fields.available_units
          - entities.FiredLot.fields.reserved_units
          - entities.FiredLot.fields.consumed_units
        distinguishing_aspect: |
          The invariant is fired_unit_conservation - available_units + reserved_units +
          consumed_units == fired_units - and the compensation is an IMMEDIATE, FULL
          reversal driven by a sibling endpoint on the same aggregate
          (POST /blends/{id}/reject), unwinding two lots at once by unequal amounts
          (5000 and 7000). The other instance in this rule guards a THREE-bucket ledger
          on a different entity where the forward path includes a mid-state TRANSFER
          that is deliberately not compensated, and where the compensation is delivered
          by a third entity two hops away.
        test_recipe:
          setup:
            - "Plant P1 ACTIVE, formulation F1 QUALIFIED, kiln K1 with 5 positions, kiln cars C1 and C2"
            - "Runs R1 and R2 both fired in KR1 at positions 3 and 1, giving lots L1 (9600 units, color_index 52.18) and L2 (9600 units, color_index 49.81)"
            - "Order O1 for 12000 units ASSIGNED to P1, requires_panel_approval false"
            - "Blend B1 COMPOSED from 5000 units of L1 and 7000 units of L2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
            - call: "POST /plants/${p1}/kilns"
              payload: { kiln_code: "K1", position_count: 5, setpoint_peak_c: 1050, cooldown_buffer_hours: 6.0 }
              as: PlantAdmin
              captures: { k1: "$.data.id" }
            - call: "POST /plants/${p1}/kiln-cars"
