      - name: cap_submission_and_review_conflicts_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 28]
          - validations[priority 30]
          - validations[priority 31]
          - errors.ERR_CAP_ITEMS_INCOMPLETE
          - errors.ERR_ACTIVE_CAP_EXISTS
          - errors.ERR_REVIEW_BRANCH_ALREADY_RECORDED
        distinguishing_aspect: |
          Three separate CAP gates on one plan: submit needs item_count >= 1 AND every item COMMITTED
          (an existing but PROPOSED item still fails), a second plan is refused while the first is in
          {DRAFT, SUBMITTED, IN_REVIEW, PENDING_DECISION}, and the SAFETY branch can be recorded only
          once per submission cycle even when a different auditor attempts the repeat.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM) with safety_fitness_status CONDITIONAL determined by auditor_bob."
            - "One DRAFT CorrectiveActionPlan cap1 for c1 with zero action items; the carrier version captured after the fitness determination."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /carriers"
              payload: { dot_number: "1000001", legal_name: "Buckeye Freight LLC", average_power_units: 20, annual_vmt: 1600000 }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_id: $.data.id }
            - call: "POST /carriers/${c1_id}/fitness-determination"
              payload: { determination: "CONDITIONAL", basis_note: "Compliance review found recordkeeping deficiencies." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_bob"
              captures: { c1_version: $.data.version }
            - call: "POST /corrective-action-plans"
              payload: { carrier_id: "${c1_id}", expected_carrier_version: "${c1_version}", narrative: "Plan to correct HOS recordkeeping." }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { cap1_id: $.data.id }
          trigger:
            - call: "POST /corrective-action-plans/${cap1_id}/submit"
              payload: {}
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /corrective-action-plans/${cap1_id}/action-items"
              payload: { basic_category: "HOURS_OF_SERVICE", description: "Retrain dispatch on ELD edits.", target_completion_date: "2026-10-01T00:00:00Z" }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { item1_id: $.data.id, item1_status: $.data.status }
            - call: "POST /corrective-action-plans/${cap1_id}/submit"
              payload: {}
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /cap-action-items/${item1_id}/status"
              payload: { action: "COMMIT", note: "Committing the retraining item." }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { item1_committed: $.data.status }
            - call: "POST /corrective-action-plans/${cap1_id}/submit"
              payload: {}
              as: CarrierSafetyManager
              as_user_id: "${c1_id}"
              captures: { cap1_status: $.data.status }
            - call: "GET /carriers/${c1_id}"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { c1_version_2: $.data.version }
            - call: "POST /corrective-action-plans"
              payload: { carrier_id: "${c1_id}", expected_carrier_version: "${c1_version_2}", narrative: "A competing second plan." }
              as: CarrierAnalyst
              as_user_id: "${c1_id}"
              captures: { e3: $.data.error_id }
            - call: "POST /corrective-action-plans/${cap1_id}/reviews"
              payload: { branch: "SAFETY", outcome: "CLEARED", note: "Safety branch cleared." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_carl"
              captures: { cap1_status_2: $.data.status, safety_outcome: $.data.safety_review_outcome }
            - call: "POST /corrective-action-plans/${cap1_id}/reviews"
              payload: { branch: "SAFETY", outcome: "CLEARED", note: "Second safety sign-off by a different auditor." }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_dave"
              captures: { e4: $.data.error_id }
          assert:
            - "trigger[0] -> 422 ERR_CAP_ITEMS_INCOMPLETE (item_count == 0)"
            - "after trigger[0]: CorrectiveActionPlan.${cap1_id}.status == DRAFT"
            - "trigger[1] -> 201; CapActionItem.${item1_id}.status == PROPOSED"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.item_count == 1"
            - "after trigger[1]: CorrectiveActionPlan.${cap1_id}.committed_item_count == 0"
            - "trigger[2] -> 422 ERR_CAP_ITEMS_INCOMPLETE (committed_item_count 0 != item_count 1)"
            - "trigger[3] -> 200; CapActionItem.${item1_id}.status == COMMITTED"
            - "after trigger[3]: CorrectiveActionPlan.${cap1_id}.committed_item_count == 1"
            - "trigger[4] -> 200; CorrectiveActionPlan.${cap1_id}.status == SUBMITTED"
            - "trigger[6] -> 409 ERR_ACTIVE_CAP_EXISTS (cap1 is SUBMITTED)"
            - "trigger[7] -> 200; CorrectiveActionPlan.${cap1_id}.status == IN_REVIEW"
            - "after trigger[7]: CorrectiveActionPlan.${cap1_id}.safety_review_outcome == CLEARED"
            - "after trigger[7]: CorrectiveActionPlan.${cap1_id}.safety_review_user_id == auditor_carl"
            - "after trigger[7]: CorrectiveActionPlan.${cap1_id}.data_review_outcome == null"
            - "trigger[8] -> 409 ERR_REVIEW_BRANCH_ALREADY_RECORDED"
            - "after trigger[8]: CorrectiveActionPlan.${cap1_id}.safety_review_user_id == auditor_carl"
            - "after trigger[8]: CorrectiveActionPlan.${cap1_id}.status == IN_REVIEW"

