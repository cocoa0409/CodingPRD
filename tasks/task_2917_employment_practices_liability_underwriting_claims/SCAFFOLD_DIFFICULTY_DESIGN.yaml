              as_user_id: "adj-001"
          assert:
            - "lap 1 (after setup's audit): DefenseInvoice.${inv_id}.status == UNDER_AUDIT AND allowed_amount_cents == 2957705 AND audited_by_user_id == adj-001"
            - "after dispute 1: DefenseInvoice.${inv_id}.status == ADJUSTED"
            - "after dispute 1: DefenseInvoice.${inv_id}.block_billed_hours == 0.0 AND expenses_cents == 200000"
            - "after dispute 1: DefenseInvoice.${inv_id}.block_reduction_cents == 0 AND expense_disallowance_cents == 0"
            - "after dispute 1: DefenseInvoice.${inv_id}.allowed_amount_cents == 3081500 AND guideline_reduction_cents == 452500 AND disallowed_amount_cents == 452500"
            - "after dispute 1: DefenseInvoice.${inv_id}.audited_by_user_id == null"
            - "after dispute 1: DefenseInvoice.${inv_id}.dispute_note == 'Block-billed entries have been re-itemised and travel expenses withdrawn'"
            - "lap 2 (after audit 2): DefenseInvoice.${inv_id}.status == UNDER_AUDIT AND allowed_amount_cents == 3081500 AND audited_by_user_id == adj-002"
            - "after dispute 2: DefenseInvoice.${inv_id}.status == ADJUSTED AND allowed_amount_cents == 2957705"
            - "lap 3 (after audit 3): DefenseInvoice.${inv_id}.status == UNDER_AUDIT AND audited_by_user_id == adj-001"
            - "lap 3: DefenseInvoice.${inv_id}.billed_fees_cents == 3334000 AND rate_cap_excess_cents == 452500 AND block_reduction_cents == 142884 AND expense_disallowance_cents == 200911"
            - "lap 3: DefenseInvoice.${inv_id}.allowed_amount_cents == 2957705 — bit-identical to lap 1, so the cycle is lossless"
            - "DefenseAssignment.${asg_id}.budget_spent_cents == 0 throughout (no lap of the cycle commits money)"
            - "DefenseAssignment.${asg_id}.status == ACTIVE"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: payment_approval_exhaustion_cascade_depth_four
        grounds:
          - state_machines.IndemnityPayment.PENDING_APPROVAL_to_APPROVED
          - state_machines.Claim.DEFENSE_OPEN_to_RESOLVED
          - state_machines.Policy.OPEN_to_EXHAUSTED
          - state_machines.DefenseAssignment.ACTIVE_to_CLOSED
          - state_machines.DefenseInvoice.SUBMITTED_to_REJECTED
          - calculations.indemnity_waterfall
          - entities.DefenseAssignment.fields.funding_ceased_at
          - entities.DefenseInvoice.fields.hold_reason
          - entities.DefensePanelFirm.fields.open_matter_count
        distinguishing_aspect: |
          DEPTH 4, triggered by POST /epli/indemnity-payments/{payment_id}/approve.
          Hop 1 (payment -> claim) writes the claim ledger and moves DEFENSE_OPEN ->
          RESOLVED; hop 2 fires ONLY because hop 1 changed the claim ledger, driving
          aggregate_limit_remaining_cents to exactly 0 and limit_posture OPEN ->
          EXHAUSTED; hop 3 fires ONLY because hop 2 landed on EXHAUSTED, closing the
          DefenseAssignment with funding_ceased_at; hop 4 fires ONLY because hop 3
          closed that assignment, rejecting its SUBMITTED invoice with hold_reason
          LIMIT_EXHAUSTED. The approve request itself never names the assignment or
          the invoice.
        test_recipe:
          setup:
            - "Jurisdiction TX (T2) and ACTIVE RatePlan 'EPLI Standard 2026' exist."
            - "DefensePanelFirm 'Lonestar Defense Group' is PANEL_ACTIVE, tier REGIONAL, covers TX only, rates 70000 / 43000 / 16000, capacity_open_matters 2, blended_rate_cents 48400."
            - "Applicant 'Bayline Foods LLC' (headcount 40, TX only, primary TX) binds a policy with aggregate_limit_cents 10000000 and per_claim_retention_cents 2500000, ACTIVE / OPEN for [2026-08-01, 2027-08-01)."
            - "A DISCRIMINATION / EMPLOYEE claim (FIRST_PARTY, applied_retention_cents 2500000) is accepted and a DefenseAssignment on Lonestar for [2026-08-01, 2026-11-01) with budget_cap_cents 2000000 moves it to DEFENSE_OPEN; open_matter_count is 1."
            - "Panel counsel submitted one invoice for [2026-08-01, 2026-08-31] (partner 10.0h, associate 20.0h, paralegal 4.0h, expenses 50000) which is still SUBMITTED and un-audited."
            - "A 12500000 SETTLEMENT payment is created on the claim, frozen at 2500000 retention / 10000000 insurer — exactly the remaining aggregate."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00, pre_suit_mediation_required: false }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { plan_id: $.data.id }
            - call: "POST /epli/rate-plans/${plan_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/defense-panel-firms"
              payload: { name: "Lonestar Defense Group", tier: "REGIONAL", jurisdiction_codes: ["TX"], partner_rate_cents_per_hour: 70000, associate_rate_cents_per_hour: 43000, paralegal_rate_cents_per_hour: 16000, capacity_open_matters: 2 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { firm_t_id: $.data.id }
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${plan_id}", requested_aggregate_limit_cents: 10000000, requested_retention_cents: 2500000, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asmt_id: $.data.id }
            - call: "POST /epli/exposure-assessments/${asmt_id}/price"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /epli/exposure-assessments/${asmt_id}/approve"
              payload: {}
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "POST /epli/policies"
              payload: { exposure_assessment_id: "${asmt_id}", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2027-08-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pol_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "DISCRIMINATION", claimant_class: "EMPLOYEE", notice_type: "LAWSUIT", first_notice_at: "2026-08-01T00:00:00.000Z", alleged_damages_cents: 15000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { c1_id: $.data.id }
            - call: "POST /epli/claims/${c1_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${c1_id}/coverage-decision"
              payload: { decision: "ACCEPT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${c1_id}/defense-assignments"
              payload: { engagement_from: "2026-08-01T00:00:00.000Z", engagement_to: "2026-11-01T00:00:00.000Z", budget_cap_cents: 2000000, panel_firm_id: "${firm_t_id}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { asg_id: $.data.id }
            - call: "POST /epli/defense-assignments/${asg_id}/invoices"
              payload: { period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-31T00:00:00.000Z", partner_hours: 10.0, associate_hours: 20.0, paralegal_hours: 4.0, expenses_cents: 50000 }
              as: PanelCounsel
              as_user_id: "${firm_t_id}"
              captures: { inv_id: $.data.id }
            - call: "GET /epli/policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pol_v1: $.data.version }
            - call: "POST /epli/claims/${c1_id}/indemnity-payments"
              payload: { amount_cents: 12500000, payment_basis: "SETTLEMENT", expected_policy_version: "${pol_v1}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /epli/indemnity-payments/${pay_id}/approve"
              payload: {}
              as: ClaimsManager
              as_user_id: "clm-001"
          assert:
            - "IndemnityPayment.${pay_id}.status == APPROVED"
            - "IndemnityPayment.${pay_id}.retention_portion_cents == 2500000 AND insurer_portion_cents == 10000000"
            - "IndemnityPayment.${pay_id}.sublimit_bucket == FIRST_PARTY"
            - "HOP 1 — Claim.${c1_id}.retention_satisfied_cents == 2500000"
            - "HOP 1 — Claim.${c1_id}.indemnity_paid_cents == 10000000"
            - "HOP 1 — Claim.${c1_id}.status == RESOLVED"
            - "HOP 2 — Policy.${pol_id}.indemnity_paid_cents == 10000000"
            - "HOP 2 — Policy.${pol_id}.aggregate_limit_remaining_cents == 0"
            - "HOP 2 — Policy.${pol_id}.limit_posture == EXHAUSTED"
            - "HOP 3 — DefenseAssignment.${asg_id}.status == CLOSED"
            - "HOP 3 — DefenseAssignment.${asg_id}.funding_ceased_at == 2026-08-01T00:00:00.000Z"
            - "HOP 4 — DefenseInvoice.${inv_id}.status == REJECTED"
            - "HOP 4 — DefenseInvoice.${inv_id}.hold_reason == LIMIT_EXHAUSTED"
            - "HOP 4 — DefensePanelFirm.${firm_t_id}.open_matter_count == 0"
            - "Policy.${pol_id}.status == ACTIVE (the status axis is untouched by the limit_posture cascade)"
            - "DefenseAssignment.${asg_id}.budget_spent_cents == 0 (the rejected invoice was never approved, so no money moved through the matter budget)"

      - name: policy_suspend_cascade_depth_three
        grounds:
          - state_machines.Policy.ACTIVE_to_SUSPENDED
          - state_machines.DefenseAssignment.ACTIVE_to_SUSPENDED_FUNDING
          - entities.Claim.fields.coverage_gated
          - entities.DefenseAssignment.fields.hold_reason
          - entities.DefenseInvoice.fields.hold_reason
          - entities.Policy.fields.suspended_at
        distinguishing_aspect: |
          DEPTH 3, triggered by POST /epli/policies/{policy_id}/suspend — a DIFFERENT
          triggering transition from payment_approval_exhaustion_cascade_depth_four's
          payment approval, and a different hop chain (Policy -> Claim ->
          DefenseAssignment -> DefenseInvoice). Hop 2 keys off the set of claims
          mutated in hop 1, not off the policy; hop 3 keys off the set of assignments
          mutated in hop 2, not off the claims. The invoice's own status is left
          untouched at SUBMITTED — only hold_reason changes — proving the third hop is
          a distinct propagation and not a status cascade.
