  - name: after_action_finalize_cascades_event_to_debriefed_and_locks_terminal_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.AfterActionReview.SUBMITTED_to_FINALIZED
    - state_machines.AfterActionReview.terminal_states
    - state_machines.SecurityEvent.CLOSED_to_DEBRIEFED
    - validations[priority=12]
    distinguishing_aspect: |
      FINALIZED is the terminal state that closes the whole aggregate: it is the only §1.2 terminal state whose arrival cascades a DIFFERENT machine into ITS terminal state, so the lockdown claim covers both rows at once — no further AAR decision may be taken, and the DEBRIEFED event refuses every remaining lifecycle action.
