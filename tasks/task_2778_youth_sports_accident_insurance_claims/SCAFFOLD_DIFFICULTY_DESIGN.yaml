        grounds:
          - state_machines.InjuryReport.PENDING_VERIFICATION_to_VERIFIED
          - calculations.claim_reserve_amount
          - calculations.policy_loss_experience
          - calculations.policy_coverage_posture
          - state_machines.SanctionedActivity.PENDING_SANCTION_to_REJECTED
          - entities.SanctionedActivity.fields.rejection_reason
