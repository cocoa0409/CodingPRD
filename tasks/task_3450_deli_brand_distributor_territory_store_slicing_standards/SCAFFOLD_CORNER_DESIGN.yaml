      - name: delivery_qty_above_allocated_pool_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=10"]', 'errors[ERR_QUANTITY_MISMATCH]']
        distinguishing_aspect: "Line qty 11 against an allocated pool of 10 fails; the delivery is rejected before any unit movement."
        test_recipe:
