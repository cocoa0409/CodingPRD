  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_lot_available_units_conserved
        grounds:
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.InventoryLot.fields.qty_reserved
          - entities.InventoryLot.fields.qty_on_hand
        distinguishing_aspect: "Conserved quantity = lot available units (qty_on_hand - qty_reserved): submit then cancel must leave (qty_on_hand - qty_reserved) identical to its pre-submit value of 5 — submit debits qty_reserved by 2, cancel credits it back so available returns to exactly 5."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Age-verified customer. TAXED lot qty 5, available 5 before submit. Line qty 2 submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /customers/register"
              payload: { email: "ci1@x.com", full_name: "CI One", date_of_birth: "2000-01-01", ship_state_code: "CA" }
              as: Anonymous
              captures: { cust: $.data.id }
            - call: "POST /id-scans"
              payload: { customer_id: "${cust}", id_state_code: "CA", id_expiry_date: "2030-01-01", scanned_dob: "2000-01-01" }
              as: Customer
              as_user_id: "${cust}"
              captures: { scan: $.data.id }
            - call: "POST /id-scans/${scan}/verify"
              payload: {}
              as: StoreAssociate
            - call: "POST /products"
              payload: { sku: "CI-1", name: "CI", category: "WINE", container_type: "BOTTLE", bottle_volume_ml: 750, abv_pct: 13.00 }
              as: Admin
              captures: { prod: $.data.id }
            - call: "POST /products/${prod}/vintages"
              payload: { vintage_year: 2020, list_price_cents: 3000, case_pack_size: 6 }
              as: Admin
              captures: { vint: $.data.id }
            - call: "POST /vintages/${vint}/lots"
              payload: { tax_status: "TAXED", qty_on_hand: 5, excise_band_cents_per_unit: 0 }
              as: Admin
              captures: { lot: $.data.id }
            - call: "POST /vintages/${vint}/release"
              payload: {}
              as: Admin
            - call: "POST /orders"
              payload: { customer_id: "${cust}", channel: "POS" }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { vintage_id: "${vint}", qty: 2 }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${ord}"
              as: Customer
              as_user_id: "${cust}"
              captures: { ov: $.data.version }
            - call: "POST /orders/${ord}/submit"
              payload: { expected_order_version: "${ov}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${ord}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Order.${ord}.fulfillment_status == CANCELLED"
            - "InventoryLot.${lot}.qty_reserved == 0"
            - "InventoryLot.${lot}.qty_on_hand == 5"

      - name: cancel_restores_monthly_compliance_volume_conserved
        grounds:
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.ComplianceWindow.fields.active
          - entities.ComplianceWindow.fields.volume_ml
