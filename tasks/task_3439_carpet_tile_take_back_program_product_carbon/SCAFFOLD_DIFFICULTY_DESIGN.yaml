          setup:
            - "Three sites, all contractor inst-bob: S1 [2026-10-05, 2026-10-10], S2 [2026-10-11, 2026-10-15] (gap exactly 1 day), S3 [2026-10-12, 2026-10-16] (gap 2 days after S1)."
