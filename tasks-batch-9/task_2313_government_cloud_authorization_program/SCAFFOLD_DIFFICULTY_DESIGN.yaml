      - call: POST /offerings/${offering_id}/impact-determination
        payload: {}
        as: ProgramBoardReviewer
        as_user_id: board-1
      assert:
      - 'first call: HTTP 422 with error_id ERR_NO_CONFIRMED_DATA_CATEGORY'
      - 'after the first call: CloudServiceOffering.${offering_id}.status == DRAFT, final_impact_level == null, baseline_id
        == null'
      - 'after the first call: CloudServiceOffering.${offering_id}.preliminary_impact_level == MODERATE'
      - 'after the confirm: DataCategory.${dc_pii_id}.status == CONFIRMED and confirmed_by_user_id == ''board-1'''
      - 'third call: HTTP 200; CloudServiceOffering.${offering_id}.status == CATEGORIZED'
      - 'third call: final_impact_level == MODERATE and baseline_id == ${baseline_mod_id}'
