  - rule_id: non_linear_state_machine
    instances:
      - name: session_repeat_cycle_reverts_acquisition_while_order_stays_terminal
        grounds:
          - state_machines.ScanSession.SUBMITTED_to_IN_PROGRESS
          - state_machines.ScanSession.NOT_REVIEWED_to_REPEAT_REQUIRED
          - state_machines.ScanSession.REPEAT_REQUIRED_to_NOT_REVIEWED
          - calculations.positioning_severity_and_outcome
          - entities.ScanSession.fields.repeat_count
          - entities.SiteMeasurement.fields.superseded
          - endpoints["POST /bone-density/scan-sessions/{id}/repeat-acquisition"]
        distinguishing_aspect: |
          The acquisition dimension runs backwards: IN_PROGRESS -> SUBMITTED -> IN_PROGRESS, and the
          review dimension runs NOT_REVIEWED -> REPEAT_REQUIRED -> NOT_REVIEWED, while the
          ScanAppointment and ScanOrder dimensions that were driven to COMPLETED by the first
          submission do NOT rewind. The reverse edge also erases derived work: both SiteMeasurement
          rows become superseded, measured_site_count returns to 0 and the three lowest-score fields
          go back to null, so the session is not merely relabelled but genuinely re-openable.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T09:05:00Z."
