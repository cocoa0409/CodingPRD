      - name: monitor_completion_updates_easement_derived_fields
        claim_type: side_effect_execution
        grounds: [state_machines.MonitoringVisit.SCHEDULED_to_COMPLETED, entities.Easement.fields.next_monitoring_due_on]
        distinguishing_aspect: "Completing a visit on 2026-09-05 sets last_monitoring_completed_on, recomputes next_monitoring_due_on to 2027-09-05 (completed date + interval, not record date), and increments Easement.version by exactly 1."
        test_recipe:
          setup: ["RECORDED easement (recorded 2026-08-01, interval 12) with a SCHEDULED visit"]
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-MC", grantor_name: "G", parcel_acreage: 100, permitted_use_matrix: { AGRICULTURE: PERMITTED }, monitoring_interval_months: 12 }, as: TrustAdmin, captures: { e_id: $.data.id } }
