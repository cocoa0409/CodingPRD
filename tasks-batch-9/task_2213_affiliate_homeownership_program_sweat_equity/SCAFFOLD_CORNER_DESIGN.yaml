          setup:
            - "Canonical program with exactly one build site, advanced through TITLE and ENVIRONMENTAL only, so readiness_status is ENV_CLEARED. Household H (size 3 in 2 bedrooms, 1 deficiency, verified 3000000 income, 100000 housing cost, 80000 debt, credit 640, 6 on-time months, willingness 80) has been decided into WAITLISTED with need 65, ability 45 and composite 61.75, comfortably over the 55.00 promotion floor."
