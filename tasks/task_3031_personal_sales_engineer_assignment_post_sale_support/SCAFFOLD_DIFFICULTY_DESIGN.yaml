  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: serial_registration_second_unit_conflicts_and_third_takes_next_block
        grounds:
          - validations[priority=10]
          - errors[ERR_SERIAL_ALREADY_REGISTERED]
          - entities.InstrumentUnit.fields.serial_number
          - endpoints.POST_/instrument-units
        distinguishing_aspect: "A numeric count boundary reached through POST /instrument-units: a serial_number may back exactly zero or one unit, so the second registration on the same serial is rejected while the next unseen serial succeeds, and this endpoint is distinct from the inspection boundary."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-19T00:00:00Z. A RESERVED quote with two lines, one serial already registered on the first line."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
            - *mk_guitar
            - *mk_amp
            - *mk_quote
            - *line_guitar
            - *line_amp
            - *q_submit
            - *q_reserve
            - call: "POST /instrument-units"
              payload: { quote_line_id: "${qline_gtr_id}", serial_number: "SN-GTR-5521", model_code: "SW-GTR-100" }
              as: SetupTechnician
              captures: { unit_first_id: $.data.id }
          trigger:
            - call: "POST /instrument-units"
              payload: { quote_line_id: "${qline_amp_id}", serial_number: "SN-GTR-5521", model_code: "SW-GTR-100" }
              as: SetupTechnician
              captures: { err: $.data.error_id }
            - call: "POST /instrument-units"
              payload: { quote_line_id: "${qline_amp_id}", serial_number: "SN-AMP-9903", model_code: "SW-AMP-050" }
              as: SetupTechnician
              captures: { unit_second_id: $.data.id }
          assert:
            - "the second registration returns 409 with data.error_id == ERR_SERIAL_ALREADY_REGISTERED and creates no unit"
            - "GET /instrument-units?quote_line_id=${qline_amp_id} returns exactly 1 row after the third call, not 2"
            - "the third registration returns 201 and InstrumentUnit.${unit_second_id}.serial_number == \"SN-AMP-9903\""
            - "exactly one InstrumentUnit row exists with serial_number \"SN-GTR-5521\" across the whole scaffold"

      - name: preorder_sweep_admitted_at_deadline_and_rejected_one_day_later
        grounds:
          - state_machines.Backorder.PREORDER_PENDING_to_ALLOCATION_SWEEP
          - validations[priority=12]
          - errors[ERR_PREORDER_WINDOW_EXPIRED]
          - entities.Backorder.fields.eta_deadline
          - endpoints.POST_/backorders/{id}/start-sweep
        distinguishing_aspect: "A time-boundary (>= vs >) check on the half-open preorder window, reached through POST /backorders/{id}/start-sweep, a different metric and endpoint than the numeric serial-count boundary above."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-20T00:00:00Z. A RESERVED quote with one guitar line and a PREORDER_PENDING backorder opened at 2026-09-20T00:00:00Z, so eta_deadline is 2026-10-20T00:00:00Z."
          setup_api_calls:
            - *clock
            - *mk_eng
            - *mk_cust
            - *mk_asg
            - *acc_asg
            - *mk_guitar
            - *mk_amp
            - *mk_quote
            - *line_guitar
            - *q_submit
            - *q_reserve
            - call: "POST /backorders"
              payload: { quote_line_id: "${qline_gtr_id}", engineer_id: "${eng_a_id}", units_requested: 2, preorder_open_at: "2026-09-20T00:00:00Z" }
              as: SalesEngineerOps
              captures: { bo_dead_id: $.data.id, bo_bo_deadline: $.data.eta_deadline }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /backorders/${bo_dead_id}/start-sweep"
              payload: { pool_units: 2 }
              as: SalesEngineerOps
              captures: { status_at_deadline: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /backorders/${bo_dead_id}/reset-sweep"
              payload: {}
              as: SalesEngineerOps
            - call: "POST /backorders/${bo_dead_id}/start-sweep"
              payload: { pool_units: 2 }
              as: SalesEngineerOps
              captures: { err: $.data.error_id }
          assert:
            - "Backorder.${bo_dead_id}.eta_deadline == 2026-10-20T00:00:00Z (preorder_open_at + 30 days)"
            - "at exactly the deadline the sweep is admitted: Backorder.${bo_dead_id}.status == ALLOCATION_SWEEP"
            - "at deadline plus one day the sweep is rejected with 409 and data.error_id == ERR_PREORDER_WINDOW_EXPIRED"
            - "Backorder.${bo_dead_id}.status is still PREORDER_PENDING after the rejected sweep, so the reset-sweep compensation left no drift"

