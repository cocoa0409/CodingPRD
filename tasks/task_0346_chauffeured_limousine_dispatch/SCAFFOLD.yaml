scenario: "Chauffeured / Limousine Dispatch (Black Car): reservation (point-to-point/hourly/airport), vehicle class & chauffeur assignment, flight tracking & meet-and-greet, quote/gratuity/tolls, farm-in/farm-out affiliate, run-late/wait time, corporate account, cancellation tier"

domain_name: chauffeured-limousine-dispatch
api_prefix: ""   # flat topology: peer top-level collections (no shared URL prefix)

complexity_profile:
  primary_archetype: Temporal windowing
  secondary_archetype: Pricing engine
  complexity_layers:
    - Dual-variant calculation
    - Cascading side effects
    - Rate / threshold triggers
    - Optimistic concurrency

  entity_topology: flat
  # Peer top-level entities (Reservation, Chauffeur, Vehicle, Affiliate, CorporateAccount,
  # VehicleClass) linked by foreign keys; Assignment/FlightTracking/Quote/FarmOutOrder/
  # WaitEvent/CancellationRecord reference Reservation and resources by FK in the body.

  state_machine_shape: parallel
  # Reservation carries two independent state dimensions: trip_status (lifecycle) ×
  # settlement_status (money). Chauffeur lifecycle contains a cycle (ON_DUTY -> OFF_DUTY -> ON_DUTY).
  # FarmOutOrder is a branching offer/accept/reject machine.

  relationship_patterns:
    - one_to_many       # CorporateAccount -> Reservation; VehicleClass -> Vehicle; Reservation -> WaitEvent
    - cross_aggregate   # Assignment couples Reservation + Chauffeur + Vehicle time windows

  role_model: peer_roles
  # Dispatcher (operations), CorporateBooker (entity_backed to CorporateAccount, books for own account),
  # AffiliatePartner (entity_backed to Affiliate, acts on farm-in offers), Chauffeur (entity_backed,
  # reports run-late/wait/arrival), plus opaque DispatchAdmin superset for config + test-driving.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CorporateAccount
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: company_name, type: string, source: input, description: "Legal name of the corporate client" }
      - { name: billing_email, type: string, source: input, description: "Invoice destination" }
      - { name: negotiated_discount_pct, type: number, source: input, default: 0, description: "Percent off the pre-gratuity, pre-tax fare base; 0..40", constraints: "0 <= x <= 40" }
      - { name: default_gratuity_pct, type: number, source: input, default: 20, description: "Auto-applied gratuity percent for this account's reservations; 0..30", constraints: "0 <= x <= 30" }
      - { name: cancellation_grace_minutes, type: integer, source: input, default: 120, description: "Lead-time window (minutes before pickup) inside which a cancellation incurs a fee tier; outside it is free", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of final_total_cents over this account's reservations whose settlement_status == INVOICED, minus settled amounts" }

  - name: Affiliate
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Affiliate operator name" }
      - { name: market_code, type: string, source: input, description: "Service market, e.g. SFO, JFK, LAX" }
      - { name: payout_share_pct, type: number, source: input, description: "Percent of the reservation fare base paid to the affiliate on farm-out; 0..90", constraints: "0 <= x <= 90" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: open_farmouts, type: integer, source: computed, description: "Count of FarmOutOrder rows for this affiliate whose status IN {OFFERED, ACCEPTED}" }

  - name: VehicleClass
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Class code, e.g. SEDAN, SUV, SPRINTER, STRETCH", constraints: "unique among non-SUSPENDED VehicleClass" }
      - { name: base_fare_cents, type: integer, source: input, description: "Flat base for any point-to-point trip in this class", constraints: ">= 0" }
      - { name: per_mile_cents, type: integer, source: input, description: "Distance rate in cents per mile", constraints: ">= 0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Charter rate per hour for HOURLY reservations", constraints: ">= 0" }
      - { name: included_wait_minutes, type: integer, source: input, default: 15, description: "Free wait minutes granted at pickup before wait charges accrue", constraints: ">= 0" }
      - { name: wait_per_minute_cents, type: integer, source: input, description: "Charge per chargeable wait minute beyond the grace", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_class_id, type: string, source: input, description: "FK -> VehicleClass.id; vehicle's service class" }
      - { name: plate, type: string, source: input, description: "License plate", constraints: "unique across all Vehicle rows" }
      - { name: turnaround_minutes, type: integer, source: input, default: 30, description: "Cleaning/refuel buffer required after a trip's planned drop before this vehicle may start another trip", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE (only state in v1; reserved for future retirement)", default: AVAILABLE }

  - name: Chauffeur
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Chauffeur display name" }
      - { name: home_market_code, type: string, source: input, description: "Primary market the chauffeur serves" }
      - { name: rest_buffer_minutes, type: integer, source: input, default: 20, description: "Mandatory rest gap required between the planned drop of one assigned trip and the pickup of the next for this chauffeur", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OFF_DUTY | ON_DUTY | ON_TRIP | SUSPENDED", default: OFF_DUTY }
      - { name: active_assignment_id, type: string, source: system, description: "Denormalized pointer to the Assignment.id currently driving ON_TRIP, else null; discoverable via GET /assignments?chauffeur_id=. Not a relational FK requiring reverse-reachability." }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: corporate_account_id, type: string, source: input, description: "FK -> CorporateAccount.id; owning account (all reservations are corporate in v1)" }
      - { name: trip_type, type: enum, source: input, description: "POINT_TO_POINT | HOURLY | AIRPORT" }
      - { name: vehicle_class_id, type: string, source: input, description: "FK -> VehicleClass.id; requested service class" }
      - { name: pickup_at, type: datetime, source: input, description: "Scheduled pickup time (ISO 8601 UTC)" }
      - { name: planned_drop_at, type: datetime, source: input, description: "Planned drop time (ISO 8601 UTC); must be after pickup_at" }
      - { name: estimated_miles, type: number, source: input, default: 0, description: "Quoted trip distance in miles for POINT_TO_POINT/AIRPORT", constraints: ">= 0" }
      - { name: charter_hours, type: number, source: input, default: 0, description: "Booked hours for HOURLY trips (billed as ceil to whole hours)", constraints: ">= 0" }
      - { name: tolls_cents, type: integer, source: input, default: 0, description: "Pass-through tolls/fees added after gratuity, never discounted or gratuity-bearing", constraints: ">= 0" }
      - { name: gratuity_pct_override, type: number, source: input, description: "Optional per-reservation gratuity percent; when present overrides the account default; 0..30", constraints: "0 <= x <= 30" }
      - { name: trip_status, type: enum, source: system, description: "DRAFT | QUOTED | CONFIRMED | ASSIGNED | EN_ROUTE | ON_LOCATION | PASSENGER_ABOARD | COMPLETED | CANCELLED", default: DRAFT }
      - { name: settlement_status, type: enum, source: system, description: "UNBILLED | INVOICED | SETTLED | WRITTEN_OFF (independent dimension from trip_status)", default: UNBILLED }
      - { name: fulfillment_mode, type: enum, source: system, description: "IN_HOUSE | FARMED_OUT; set when an Assignment or FarmOutOrder is accepted", default: IN_HOUSE }
      - { name: quote_estimate_total_cents, type: integer, source: computed, description: "Estimate-variant grand total stamped at QUOTED (see calc estimate_quote)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final-variant grand total stamped at COMPLETED (see calc final_settlement)" }
      - { name: chargeable_wait_minutes, type: integer, source: computed, description: "Wait minutes beyond the class grace accrued from WaitEvent rows", default: 0 }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "Fee charged at cancellation per the lead-time tier; 0 when free", default: 0 }

  - name: FlightTracking
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; AIRPORT reservation this flight tracks; one per reservation" }
      - { name: flight_number, type: string, source: input, description: "Carrier + flight, e.g. UA1234" }
      - { name: scheduled_arrival_at, type: datetime, source: input, description: "Airline-scheduled gate arrival (ISO 8601 UTC)" }
      - { name: estimated_arrival_at, type: datetime, source: system, description: "Latest tracked arrival; defaults to scheduled_arrival_at, updated by /flight-updates", default: null }
      - { name: meet_and_greet, type: boolean, source: input, default: false, description: "Inside-terminal meet-and-greet requested" }
      - { name: status, type: enum, source: system, description: "ON_TIME | DELAYED | LANDED", default: ON_TIME }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the reservation served in-house" }
      - { name: chauffeur_id, type: string, source: input, description: "FK -> Chauffeur.id; assigned chauffeur" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; assigned vehicle" }
      - { name: window_start_at, type: datetime, source: system, description: "Occupied window start = reservation.pickup_at" }
      - { name: window_end_at, type: datetime, source: system, description: "Occupied window end = reservation.planned_drop_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", default: ACTIVE }

  - name: FarmOutOrder
    parent: null
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; reservation being farmed out" }
      - { name: affiliate_id, type: string, source: input, description: "FK -> Affiliate.id; receiving affiliate" }
      - { name: offered_payout_cents, type: integer, source: computed, description: "Payout snapshot = round(reservation fare base * affiliate.payout_share_pct / 100); stamped at offer" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | REJECTED | RECALLED", default: OFFERED }
      - { name: decline_reason, type: string, source: input, description: "Affiliate's reason on REJECTED; null otherwise", default: null }

  - name: WaitEvent
    parent: null
    common_fields: false   # append-only log: id + created_at only
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; reservation the wait accrues to" }
      - { name: kind, type: enum, source: input, description: "CHAUFFEUR_ARRIVED | PASSENGER_BOARDED; marks the start/end of the wait window" }
      - { name: occurred_at, type: datetime, source: input, description: "Server-clock timestamp of the event (ISO 8601 UTC)" }

  - name: CancellationRecord
    parent: null
    common_fields: false   # immutable audit row: id + created_at only
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; cancelled reservation" }
      - { name: tier, type: enum, source: system, description: "FREE | TIER1 | TIER2 | NO_SHOW; lead-time bucket that set the fee" }
      - { name: lead_minutes, type: integer, source: system, description: "Minutes between cancellation clock and pickup_at (negative if past pickup)" }
      - { name: fee_cents, type: integer, source: system, description: "Fee assessed; mirrors reservation.cancellation_fee_cents" }

  - name: ClockState
    parent: null
    common_fields: false   # singleton-ish system clock for deterministic time-gated tests
    fields:
      - { name: current_utc, type: datetime, source: system, description: "Server 'now' used by all lead-time / wait / flight comparisons" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Reservation: PARALLEL dimensions (trip_status × settlement_status) ----
  - entity: Reservation
    field: trip_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /reservations/{id}/trip-events (action=QUOTE)"
        actor: Dispatcher
        preconditions:
          - "reservation.trip_status == DRAFT"
          - "VehicleClass(reservation.vehicle_class_id).status == ACTIVE"
        side_effects:
          - "run calc estimate_quote; stamp quote_estimate_total_cents"
          - "create Quote snapshot row (variant=ESTIMATE)"

      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /reservations/{id}/trip-events (action=CONFIRM)"
        actor: "Dispatcher or CorporateBooker"
        preconditions:
          - "reservation.trip_status == QUOTED"
          - "CorporateAccount(reservation.corporate_account_id).status == ACTIVE"
        side_effects:
          - "no money moves; awaits assignment or farm-out"

      - from: CONFIRMED
        to: ASSIGNED
        trigger: "POST /assignments (accepted in-house)"
        actor: Dispatcher
        preconditions:
          - "reservation.trip_status == CONFIRMED"
          - "reservation.fulfillment_mode == IN_HOUSE"
          - "Chauffeur status IN {OFF_DUTY, ON_DUTY} (not ON_TRIP/SUSPENDED) [ERR_RESOURCE_UNAVAILABLE]"
          - "no chauffeur window overlap incl. rest_buffer_minutes (see calc chauffeur_overlap)"
          - "no vehicle window overlap incl. turnaround_minutes (see calc temporal: vehicle_overlap)"
        side_effects:
          - "create Assignment(ACTIVE) with window = [pickup_at, planned_drop_at]"
          - "Chauffeur OFF_DUTY -> ON_DUTY (cross-entity cascade hop 1)"

      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /reservations/{id}/trip-events (action=DISPATCH)"
        actor: "Dispatcher or Chauffeur"
        preconditions:
          - "reservation.trip_status == ASSIGNED"
          - "an ACTIVE Assignment exists for this reservation"
        side_effects:
          - "Chauffeur ON_DUTY -> ON_TRIP, set active_assignment_id (cross-entity cascade hop 2)"

      - from: EN_ROUTE
        to: ON_LOCATION
        trigger: "POST /reservations/{id}/wait-events (kind=CHAUFFEUR_ARRIVED)"
        actor: Chauffeur
        preconditions:
          - "reservation.trip_status == EN_ROUTE"
        side_effects:
          - "append WaitEvent(CHAUFFEUR_ARRIVED) — starts the wait window"

      - from: ON_LOCATION
        to: PASSENGER_ABOARD
        trigger: "POST /reservations/{id}/wait-events (kind=PASSENGER_BOARDED)"
        actor: Chauffeur
        preconditions:
          - "reservation.trip_status == ON_LOCATION"
        side_effects:
          - "append WaitEvent(PASSENGER_BOARDED) — closes the wait window"
          - "run calc wait_time; stamp chargeable_wait_minutes"

      - from: PASSENGER_ABOARD
        to: COMPLETED
        trigger: "POST /reservations/{id}/trip-events (action=COMPLETE)"
        actor: "Dispatcher or Chauffeur"
        preconditions:
          - "reservation.trip_status == PASSENGER_ABOARD"
        side_effects:
          - "run calc final_settlement; stamp final_total_cents"
          - "Chauffeur ON_TRIP -> ON_DUTY, clear active_assignment_id (cross-entity cascade hop 3)"
          - "Assignment ACTIVE -> RELEASED"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /reservations/{id}/trip-events (action=CANCEL)"
        actor: "Dispatcher or CorporateBooker"
        preconditions:
          - "reservation.trip_status == DRAFT"
        side_effects:
          - "run calc cancellation_tier (lead-time bucket); stamp cancellation_fee_cents (FREE tier from DRAFT => 0)"
          - "create CancellationRecord"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /reservations/{id}/trip-events (action=CANCEL)"
        actor: "Dispatcher or CorporateBooker"
        preconditions:
          - "reservation.trip_status == QUOTED"
        side_effects:
          - "run calc cancellation_tier; stamp cancellation_fee_cents"
          - "create CancellationRecord"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{id}/trip-events (action=CANCEL)"
        actor: "Dispatcher or CorporateBooker"
        preconditions:
          - "reservation.trip_status == CONFIRMED"
        side_effects:
          - "run calc cancellation_tier; stamp cancellation_fee_cents"
          - "create CancellationRecord"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /reservations/{id}/trip-events (action=CANCEL)"
        actor: "Dispatcher or CorporateBooker"
        preconditions:
          - "reservation.trip_status == ASSIGNED"
        side_effects:
          - "run calc cancellation_tier; stamp cancellation_fee_cents"
          - "create CancellationRecord"
          - "Assignment ACTIVE -> RELEASED (compensation: window freed)"
          - "Chauffeur ON_DUTY -> OFF_DUTY (compensation: revert hop-1)"

      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /reservations/{id}/trip-events (action=CANCEL)"
        actor: Dispatcher
        preconditions:
          - "reservation.trip_status == EN_ROUTE"
        side_effects:
          - "run calc cancellation_tier; stamp cancellation_fee_cents"
          - "create CancellationRecord"
          - "Assignment ACTIVE -> RELEASED"
          - "Chauffeur ON_TRIP -> OFF_DUTY, clear active_assignment_id (compensation)"

  # ---- Reservation: settlement dimension (independent of trip_status) ----
  - entity: Reservation
    field: settlement_status
    initial_state: UNBILLED
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /reservations/{id}/billing-events (action=INVOICE)"
        actor: Dispatcher
        preconditions:
          - "reservation.settlement_status == UNBILLED"
          - "reservation.trip_status IN {COMPLETED, CANCELLED}"
          - "reservation final amount is known: final_total_cents set (COMPLETED) OR cancellation_fee_cents set (CANCELLED)"
        side_effects:
          - "bubble up: recompute CorporateAccount.outstanding_balance_cents"

      - from: INVOICED
        to: SETTLED
        trigger: "POST /reservations/{id}/billing-events (action=SETTLE)"
        actor: Dispatcher
        preconditions:
          - "reservation.settlement_status == INVOICED"
        side_effects:
          - "bubble up: recompute CorporateAccount.outstanding_balance_cents (drops by the settled amount)"

      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "POST /reservations/{id}/billing-events (action=WRITE_OFF)"
        actor: DispatchAdmin
        preconditions:
          - "reservation.settlement_status == INVOICED"
        side_effects:
          - "bubble up: recompute CorporateAccount.outstanding_balance_cents (drops by the written-off amount)"

  # ---- Chauffeur: CYCLE (ON_DUTY <-> OFF_DUTY <-> ON_TRIP) ----
  - entity: Chauffeur
    field: status
    initial_state: OFF_DUTY
    terminal_states: []
    transitions:
      - from: OFF_DUTY
        to: ON_DUTY
        trigger: "system (Assignment created for this chauffeur) OR POST /chauffeurs/{id}/duty-events (action=CLOCK_IN)"
        actor: "system or Chauffeur"
        preconditions:
          - "chauffeur.status == OFF_DUTY"
        side_effects: []
      - from: ON_DUTY
        to: ON_TRIP
        trigger: "system (reservation dispatched: ASSIGNED -> EN_ROUTE)"
        actor: system
        preconditions:
          - "chauffeur.status == ON_DUTY"
        side_effects:
          - "set active_assignment_id"
      - from: ON_TRIP
        to: ON_DUTY
        trigger: "system (reservation COMPLETED)"
        actor: system
        preconditions:
          - "chauffeur.status == ON_TRIP"
        side_effects:
          - "clear active_assignment_id"
        note: "ON_DUTY -> ON_TRIP -> ON_DUTY is the cycle; a chauffeur loops across many trips per shift"
      - from: ON_DUTY
        to: OFF_DUTY
        trigger: "POST /chauffeurs/{id}/duty-events (action=CLOCK_OUT) OR system (assignment cancelled/released with no other active assignment)"
        actor: "Chauffeur or system"
        preconditions:
          - "chauffeur.status == ON_DUTY"
          - "chauffeur.active_assignment_id is null"
        side_effects: []
      - from: ON_TRIP
        to: OFF_DUTY
        trigger: "system (reservation cancelled from EN_ROUTE)"
        actor: system
        preconditions:
          - "chauffeur.status == ON_TRIP"
        side_effects:
          - "clear active_assignment_id"
      - from: OFF_DUTY
        to: SUSPENDED
        trigger: "POST /chauffeurs/{id}/duty-events (action=SUSPEND)"
        actor: DispatchAdmin
        preconditions:
          - "chauffeur.status == OFF_DUTY"
        side_effects: []
      - from: SUSPENDED
        to: OFF_DUTY
        trigger: "POST /chauffeurs/{id}/duty-events (action=REINSTATE)"
        actor: DispatchAdmin
        preconditions:
          - "chauffeur.status == SUSPENDED"
        side_effects: []

  # ---- FarmOutOrder: BRANCHING offer/accept/reject ----
  - entity: FarmOutOrder
    field: status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, REJECTED, RECALLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /farm-out-orders/{id}/decision-events (action=ACCEPT)"
        actor: AffiliatePartner
        preconditions:
          - "farmout.status == OFFERED"
          - "Affiliate(farmout.affiliate_id).status == ACTIVE"
          - "Reservation(farmout.reservation_id).trip_status == CONFIRMED"
        side_effects:
          - "Reservation.fulfillment_mode IN_HOUSE -> FARMED_OUT (cross-entity cascade hop 1)"
          - "Reservation.trip_status CONFIRMED -> COMPLETED (farm accepted = served by affiliate) (hop 2)"
          - "run calc final_settlement on the reservation; stamp final_total_cents (hop 3)"
          - "recompute Affiliate.open_farmouts"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /farm-out-orders/{id}/decision-events (action=REJECT)"
        actor: AffiliatePartner
        preconditions:
          - "farmout.status == OFFERED"
        side_effects:
          - "Reservation stays CONFIRMED, fulfillment_mode stays IN_HOUSE"
          - "recompute Affiliate.open_farmouts"
      - from: OFFERED
        to: RECALLED
        trigger: "POST /farm-out-orders/{id}/decision-events (action=RECALL)"
        actor: Dispatcher
        preconditions:
          - "farmout.status == OFFERED"
        side_effects:
          - "Reservation stays CONFIRMED, fulfillment_mode stays IN_HOUSE"
          - "recompute Affiliate.open_farmouts"

  # ---- FlightTracking: arrival lifecycle, can revert ON_TIME<->DELAYED ----
  - entity: FlightTracking
    field: status
    initial_state: ON_TIME
    terminal_states: [LANDED]
    transitions:
      - from: ON_TIME
        to: DELAYED
        trigger: "POST /flight-trackings/{id}/flight-updates (estimated_arrival_at later than scheduled by > FLIGHT_DELAY_THRESHOLD_MIN)"
        actor: "DispatchAdmin or system"
        preconditions:
          - "flight.status == ON_TIME"
        side_effects:
          - "set estimated_arrival_at"
          - "if linked Reservation.trip_status == ASSIGNED and an ACTIVE Assignment exists, shift Assignment window_start_at/window_end_at by the delay delta (run-late propagation)"
      - from: DELAYED
        to: ON_TIME
        trigger: "POST /flight-trackings/{id}/flight-updates (estimated_arrival_at within threshold of scheduled)"
        actor: "DispatchAdmin or system"
        preconditions:
          - "flight.status == DELAYED"
        side_effects:
          - "set estimated_arrival_at; revert Assignment window shift toward scheduled"
        note: "ON_TIME <-> DELAYED revert loop"
      - from: ON_TIME
        to: LANDED
        trigger: "POST /flight-trackings/{id}/flight-updates (kind=LANDED)"
        actor: "DispatchAdmin or system"
        preconditions:
          - "flight.status == ON_TIME"
        side_effects: ["set estimated_arrival_at = actual landing time"]
      - from: DELAYED
        to: LANDED
        trigger: "POST /flight-trackings/{id}/flight-updates (kind=LANDED)"
        actor: "DispatchAdmin or system"
        preconditions:
          - "flight.status == DELAYED"
        side_effects: ["set estimated_arrival_at = actual landing time"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /assignments"
    occ_field: "expected_reservation_version"
    description: |
      Creating an Assignment against a Reservation whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      This captures the case where the reservation was already farmed out (a
      FarmOutOrder accept legitimately moved it to FARMED_OUT/COMPLETED and bumped
      its version) after the dispatcher read it but before posting the in-house
      Assignment; the dispatcher's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: farmout-create-stale-reservation
    parent_entity: Reservation
    write_endpoint: "POST /farm-out-orders"
    occ_field: "expected_reservation_version"
    description: |
      Creating a FarmOutOrder against a Reservation whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      This captures the case where the reservation was already assigned in-house
      (an Assignment accept legitimately moved it to ASSIGNED and bumped its
      version) after the dispatcher read it but before offering the farm-out.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_quote
    trigger: "Reservation DRAFT -> QUOTED (POST /reservations/{id}/trip-events action=QUOTE)"
    algorithm: tiered_pricing
    formula: |
      # Estimate variant: forward-looking, uses BOOKED inputs only (no actual wait yet).
      # Evaluation order is pinned: fare_base -> discount -> gratuity -> tolls (circular-looking
      # dependency resolved: gratuity is computed on the DISCOUNTED base, tolls added last).
      if trip_type == HOURLY:
        billable_hours = ceil(charter_hours)               # round UP to whole hours
        fare_base = vehicle_class.hourly_rate_cents * billable_hours
      else:  # POINT_TO_POINT or AIRPORT
        fare_base = vehicle_class.base_fare_cents
                    + round(vehicle_class.per_mile_cents * estimated_miles)   # round miles->cents per trip (sum-then-round NOT applicable; single line)
      discount_pct = CorporateAccount.negotiated_discount_pct
      discounted_base = round(fare_base * (100 - discount_pct) / 100)
      gratuity_pct = reservation.gratuity_pct_override if present else CorporateAccount.default_gratuity_pct
      gratuity = round(discounted_base * gratuity_pct / 100)
      quote_estimate_total_cents = discounted_base + gratuity + reservation.tolls_cents
      # NOTE: estimate excludes wait charges and cancellation fees entirely.
    input_set: "Reservation BOOKED fields + CorporateAccount + VehicleClass at QUOTED time. No WaitEvent rows are read."
    constants: {}
    precision: "integer cents; round_half_up at each `round(...)` step in the pinned order above"
    variants:
      - name: ESTIMATE
        when: "stamped at QUOTED; uses estimated_miles / charter_hours; ignores actual wait"
        difference: "forward-looking projection; no wait charges, no tolls double-count, no cancellation fee"

  - name: final_settlement
    trigger: "Reservation PASSENGER_ABOARD -> COMPLETED (POST /reservations/{id}/trip-events action=COMPLETE) OR FarmOutOrder OFFERED -> ACCEPTED (POST /farm-out-orders/{id}/decision-events action=ACCEPT)"
    algorithm: tiered_pricing
    formula: |
      # Final variant: chronological, includes ACTUAL wait charges measured from WaitEvent rows.
      # Same pinned evaluation order (fare_base -> discount -> gratuity -> tolls) BUT fare_base
      # additionally includes the actual wait charge, and gratuity is taken on the wait-inclusive
      # discounted base. This is the dual to estimate_quote: same inputs at booking, divergent
      # output because actual wait is folded in BEFORE discount+gratuity.
      if trip_type == HOURLY:
        billable_hours = ceil(charter_hours)
        fare_base = vehicle_class.hourly_rate_cents * billable_hours
      else:
        fare_base = vehicle_class.base_fare_cents + round(vehicle_class.per_mile_cents * estimated_miles)
      wait_charge = reservation.chargeable_wait_minutes * vehicle_class.wait_per_minute_cents
      pre_discount = fare_base + wait_charge
      discount_pct = CorporateAccount.negotiated_discount_pct
      discounted_base = round(pre_discount * (100 - discount_pct) / 100)
      gratuity_pct = reservation.gratuity_pct_override if present else CorporateAccount.default_gratuity_pct
      gratuity = round(discounted_base * gratuity_pct / 100)
      final_total_cents = discounted_base + gratuity + reservation.tolls_cents
    input_set: "Reservation booked fields + chargeable_wait_minutes (from wait_time calc) + CorporateAccount + VehicleClass at COMPLETED time. On farm-out accept, chargeable_wait_minutes is 0 (no in-house wait events)."
    constants: {}
    precision: "integer cents; round_half_up at each `round(...)` step in the pinned order above"
    variants:
      - name: FINAL
        when: "stamped at COMPLETED (in-house) or at farm-out ACCEPTED"
        difference: "wait_charge folded into base BEFORE discount and gratuity, so final >= estimate whenever chargeable_wait_minutes > 0; identical to estimate when wait is 0 and tolls unchanged"

  - name: wait_time
    trigger: "Reservation ON_LOCATION -> PASSENGER_ABOARD (second WaitEvent posted)"
    algorithm: threshold
    formula: |
      arrived_at = occurred_at of the WaitEvent(CHAUFFEUR_ARRIVED) for this reservation
      boarded_at = occurred_at of the WaitEvent(PASSENGER_BOARDED) for this reservation
      raw_wait_minutes = floor((boarded_at - arrived_at) total_seconds / 60)   # truncate partial minute
      grace = vehicle_class.included_wait_minutes
      chargeable_wait_minutes = max(0, raw_wait_minutes - grace)               # boundary: exactly grace -> 0
    input_set: "Exactly the two WaitEvent rows for this reservation (CHAUFFEUR_ARRIVED earliest, PASSENGER_BOARDED latest); VehicleClass.included_wait_minutes."
    constants: {}
    precision: "integer minutes; floor on raw duration; >= grace+1 minute is the first chargeable minute"
    variants: []

  - name: cancellation_tier
    trigger: "Reservation * -> CANCELLED (POST /reservations/{id}/trip-events action=CANCEL)"
    algorithm: threshold
    formula: |
      lead_minutes = floor((reservation.pickup_at - ClockState.current_utc) total_seconds / 60)
      grace = CorporateAccount.cancellation_grace_minutes
      # Penalty base = the estimate fare base (discounted_base of estimate_quote, BEFORE gratuity/tolls).
      # If the reservation never reached QUOTED, quote_estimate_total_cents is null -> penalty base = 0 -> FREE.
      penalty_base = discounted_base_of_estimate   # = quote_estimate_total_cents - gratuity - tolls; 0 if never quoted
      if lead_minutes >= grace:                 # >= grace cancels free (boundary: exactly grace == FREE)
        tier = FREE;  fee = 0
      elif lead_minutes >= TIER1_LEAD_MIN:      # grace > lead >= 60
        tier = TIER1; fee = round(penalty_base * TIER1_PCT / 100)
      elif lead_minutes >= 0:                   # 60 > lead >= 0
        tier = TIER2; fee = round(penalty_base * TIER2_PCT / 100)
      else:                                     # pickup already passed
        tier = NO_SHOW; fee = penalty_base       # full penalty base, 100%
      cancellation_fee_cents = fee
    input_set: "Reservation.pickup_at, ClockState.current_utc, CorporateAccount.cancellation_grace_minutes, reservation estimate base."
    constants:
      TIER1_LEAD_MIN: 60
      TIER1_PCT: 25
      TIER2_PCT: 50
    precision: "integer cents; round_half_up; boundary lead == grace is FREE (>=), lead == 60 is TIER1 (>=), lead == 0 is TIER2 (>=)"
    variants: []

  - name: affiliate_payout
    trigger: "POST /farm-out-orders (stamps offered_payout_cents at offer time)"
    algorithm: weighted_scoring
    formula: |
      # Operator-side trip value: payout owed to the affiliate, computed on the PRE-discount, PRE-gratuity
      # fare_base only. This is the dual of the CUSTOMER-side value (Reservation.final_total_cents), which
      # is computed on the POST-discount, gratuity-inclusive, toll-inclusive total. Same trip, two valid
      # "value" figures on two different entities (FarmOutOrder vs Reservation) that diverge.
      if trip_type == HOURLY:
        fare_base = vehicle_class.hourly_rate_cents * ceil(charter_hours)
      else:
        fare_base = vehicle_class.base_fare_cents + round(vehicle_class.per_mile_cents * estimated_miles)
      offered_payout_cents = round(fare_base * affiliate.payout_share_pct / 100)
    input_set: "Reservation booked fields (no wait, no discount, no gratuity, no tolls) + Affiliate.payout_share_pct at offer time."
    constants: {}
    precision: "integer cents; round_half_up"
    variants:
      - name: PAYOUT_BASIS
        when: "stamped on FarmOutOrder at offer"
        difference: "uses raw fare_base × payout_share_pct; ignores discount/gratuity/tolls — diverges from the customer-side final_total_cents on the same reservation"

  - name: chauffeur_overlap
    trigger: "POST /assignments (CONFIRMED -> ASSIGNED), evaluated as a precondition"
    algorithm: interval_merge
    formula: |
      # Chauffeur interval semantics: REST BUFFER is added AFTER the existing window's end only
      # (asymmetric one-sided guard). Two assignments for the same chauffeur conflict iff the new
      # window starts before an existing window's end PLUS the chauffeur's rest_buffer_minutes.
      # Windows are half-open [start, end). Adjacency exactly at end+buffer is allowed (no conflict).
      conflict := exists ACTIVE Assignment A for new.chauffeur_id such that
        new.window_start_at < (A.window_end_at + chauffeur.rest_buffer_minutes)
        AND A.window_start_at < (new.window_end_at + chauffeur.rest_buffer_minutes)
      if conflict: reject ERR_CHAUFFEUR_DOUBLE_BOOKED
    input_set: "All ACTIVE Assignment rows for the candidate chauffeur."
    constants: {}
    precision: "minute-resolution datetime comparison; buffer is symmetric on the pair test, one-sided REST after each window"
    variants: []

  - name: vehicle_overlap
    trigger: "POST /assignments (CONFIRMED -> ASSIGNED), evaluated as a precondition"
    algorithm: interval_merge
    formula: |
      # Vehicle interval semantics: TURNAROUND buffer is applied as a SHARED gap that must exist
      # BETWEEN consecutive trips (gap-based, distinct from chauffeur's one-sided rest). Two
      # assignments for the same vehicle conflict iff the gap between the earlier window's end and
      # the later window's start is strictly less than turnaround_minutes. Half-open [start, end).
      let (E, L) = the two windows ordered by window_start_at ASC, ties by created_at ASC
      gap_minutes := floor((L.window_start_at - E.window_end_at) total_seconds / 60)
      conflict := gap_minutes < vehicle.turnaround_minutes      # exactly == turnaround is allowed
      if conflict: reject ERR_VEHICLE_TURNAROUND_VIOLATION
    input_set: "All ACTIVE Assignment rows for the candidate vehicle."
    constants: {}
    precision: "minute-resolution; gap computed by floor; gap == turnaround_minutes is allowed (>=)"
    variants: []

  - name: flight_delay_propagation
    trigger: "POST /flight-trackings/{id}/flight-updates"
    algorithm: threshold
    formula: |
      # Run-late propagation: a flight update either crosses the delay threshold or finalizes (LANDED).
      delay_minutes = floor((estimated_arrival_at - scheduled_arrival_at) total_seconds / 60)
      if kind == LANDED:
        flight.status = LANDED; flight.estimated_arrival_at = estimated_arrival_at; no window shift on LANDED
      elif delay_minutes > FLIGHT_DELAY_THRESHOLD_MIN:
        flight.status = DELAYED
        # window shift only if the linked reservation is ASSIGNED and has exactly one ACTIVE Assignment:
        shift = delay_minutes - prior_applied_shift_minutes   # incremental delta from last applied shift
        Assignment.window_start_at += shift minutes; Assignment.window_end_at += shift minutes
      else:  # within threshold
        flight.status = ON_TIME
        # revert any previously applied shift back toward scheduled (shift = -prior_applied_shift_minutes)
        Assignment.window_start_at -= prior_applied_shift_minutes; window_end_at -= prior_applied_shift_minutes
    input_set: "FlightTracking.scheduled_arrival_at, the posted estimated_arrival_at/kind, and the single ACTIVE Assignment for the linked reservation when ASSIGNED."
    constants:
      FLIGHT_DELAY_THRESHOLD_MIN: 15
    precision: "integer minutes; delay computed by floor; strictly > threshold => DELAYED (boundary: exactly threshold stays ON_TIME)"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per RBAC; entity_backed role's X-User-ID must own the referenced resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Request body is well-formed and required fields present with correct types/enums"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: business_temporal
    check: "planned_drop_at must be strictly after pickup_at on reservation create"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 6
    category: business_constraint
    check: "trip_type-specific required fields: AIRPORT/POINT_TO_POINT need estimated_miles>0; HOURLY needs charter_hours>0"
    error_id: ERR_TRIP_TYPE_FIELDS
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 7
    category: state
    check: "Target resource is in the correct state for the requested transition (trip_status / settlement_status / chauffeur status / farmout status / flight status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_referential
    check: "FlightTracking may only be created for a Reservation whose trip_type == AIRPORT, and at most one per reservation"
    error_id: ERR_FLIGHT_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /flight-trackings"

  - priority: 9
    category: business_referential
    check: "WaitEvent ordering: PASSENGER_BOARDED requires an existing CHAUFFEUR_ARRIVED with earlier occurred_at; occurred_at must not predate it"
    error_id: ERR_WAIT_SEQUENCE
    http_status: 409
    applies_to: "POST /reservations/{id}/wait-events"

  - priority: 10
    category: business_safety
    check: "Assigned Chauffeur must not be ON_TRIP or SUSPENDED"
    error_id: ERR_RESOURCE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 11
    category: business_temporal
    check: "Assigned Chauffeur's window (incl. rest_buffer_minutes) must not overlap another ACTIVE Assignment (calc chauffeur_overlap)"
    error_id: ERR_CHAUFFEUR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 12
    category: business_temporal
    check: "Assigned Vehicle's inter-trip gap must be >= turnaround_minutes from any ACTIVE Assignment (calc vehicle_overlap)"
    error_id: ERR_VEHICLE_TURNAROUND_VIOLATION
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 13
    category: business_constraint
    check: "A reservation may have at most one ACTIVE Assignment AND may not have both an ACTIVE Assignment and an OFFERED/ACCEPTED FarmOutOrder (in-house and farm-out are mutually exclusive)"
    error_id: ERR_FULFILLMENT_CONFLICT
    http_status: 409
    applies_to: "POST /assignments, POST /farm-out-orders"

  - priority: 14
    category: business_constraint
    check: "Affiliate.status must be ACTIVE (not SUSPENDED) to receive a farm-out offer"
    error_id: ERR_AFFILIATE_INELIGIBLE
    http_status: 409
    applies_to: "POST /farm-out-orders"

  - priority: 15
    category: business_fiscal
    check: "Invoice requires a known final amount; settle/write-off require INVOICED; cannot invoice an UNBILLED reservation that is neither COMPLETED nor CANCELLED"
    error_id: ERR_NOT_BILLABLE
    http_status: 409
    applies_to: "POST /reservations/{id}/billing-events (action=INVOICE)"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_reservation_version must equal current Reservation.version on POST /assignments and POST /farm-out-orders"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /assignments, POST /farm-out-orders"

  - priority: 17
    category: business_constraint
    check: "Numeric percent inputs within declared ranges on create: negotiated_discount_pct 0..40, default_gratuity_pct/gratuity_pct_override 0..30, payout_share_pct 0..90"
    error_id: ERR_VALIDATION_RANGE
    http_status: 422
    applies_to: "POST /corporate-accounts, POST /affiliates, POST /reservations"

  - priority: 18
    category: business_constraint
    check: "Vehicle.plate must be unique across all Vehicle rows"
    error_id: ERR_DUPLICATE_PLATE
    http_status: 409
    applies_to: "POST /vehicles"

  - priority: 19
    category: business_constraint
    check: "VehicleClass.code must be unique among non-SUSPENDED classes"
    error_id: ERR_DUPLICATE_CLASS_CODE
    http_status: 409
    applies_to: "POST /vehicle-classes"

  - priority: 20
    category: state
    check: "CorporateAccount.status must be ACTIVE to confirm a reservation (QUOTED -> CONFIRMED)"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /reservations/{id}/trip-events (action=CONFIRM)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- CorporateAccount ----
  - method: POST
    path: "/corporate-accounts"
    description: "Create a corporate account"
    roles: [DispatchAdmin]
    code: 201
    input: [company_name, billing_email, "negotiated_discount_pct?", "default_gratuity_pct?", "cancellation_grace_minutes?"]
    output: CorporateAccount
    side_effects: ["status=ACTIVE; outstanding_balance_cents=0"]

  - method: GET
    path: "/corporate-accounts/{id}"
    description: "Get a corporate account (includes computed outstanding_balance_cents)"
    roles: [DispatchAdmin, Dispatcher, CorporateBooker]
    code: 200
    input: []
    output: CorporateAccount
    side_effects: []

  - method: POST
    path: "/corporate-accounts/{id}/suspend"
    description: "Suspend a corporate account (ACTIVE -> SUSPENDED)"
    roles: [DispatchAdmin]
    code: 200
    input: []
    output: CorporateAccount
    side_effects: ["status ACTIVE -> SUSPENDED"]

  # ---- Affiliate ----
  - method: POST
    path: "/affiliates"
    description: "Create an affiliate operator"
    roles: [DispatchAdmin]
    code: 201
    input: [name, market_code, payout_share_pct]
    output: Affiliate
    side_effects: ["status=ACTIVE; open_farmouts=0"]

  - method: GET
    path: "/affiliates/{id}"
    description: "Get an affiliate (includes computed open_farmouts)"
    roles: [DispatchAdmin, Dispatcher, AffiliatePartner]
    code: 200
    input: []
    output: Affiliate
    side_effects: []

  - method: POST
    path: "/affiliates/{id}/suspend"
    description: "Suspend an affiliate (ACTIVE -> SUSPENDED); blocks new farm-out offers"
    roles: [DispatchAdmin]
    code: 200
    input: []
    output: Affiliate
    side_effects: ["status ACTIVE -> SUSPENDED"]

  # ---- VehicleClass ----
  - method: POST
    path: "/vehicle-classes"
    description: "Create a vehicle class with rate card"
    roles: [DispatchAdmin]
    code: 201
    input: [code, base_fare_cents, per_mile_cents, hourly_rate_cents, wait_per_minute_cents, "included_wait_minutes?"]
    output: VehicleClass
    side_effects: ["status=ACTIVE"]

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Create a vehicle"
    roles: [DispatchAdmin]
    code: 201
    input: [vehicle_class_id, plate, "turnaround_minutes?"]
    output: Vehicle
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Get a vehicle"
    roles: [DispatchAdmin, Dispatcher]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List/filter vehicles (reverse-reachability for Vehicle.vehicle_class_id via vehicle_class_id filter)"
    roles: [DispatchAdmin, Dispatcher]
    code: 200
    input: ["vehicle_class_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ---- Chauffeur ----
  - method: POST
    path: "/chauffeurs"
    description: "Create a chauffeur"
    roles: [DispatchAdmin]
    code: 201
    input: [full_name, home_market_code, "rest_buffer_minutes?"]
    output: Chauffeur
    side_effects: ["status=OFF_DUTY"]

  - method: GET
    path: "/chauffeurs/{id}"
    description: "Get a chauffeur (asserts status cycle and active_assignment_id)"
    roles: [DispatchAdmin, Dispatcher, Chauffeur]
    code: 200
    input: []
    output: Chauffeur
    side_effects: []

  - method: POST
    path: "/chauffeurs/{id}/duty-events"
    description: "Chauffeur duty/admin status events: CLOCK_IN/CLOCK_OUT (Chauffeur/Admin), SUSPEND/REINSTATE (Admin only, enforced as RBAC business rule)"
    roles: [DispatchAdmin, Chauffeur]
    code: 200
    input: [action]
    output: Chauffeur
    side_effects: ["CLOCK_IN: OFF_DUTY->ON_DUTY; CLOCK_OUT: ON_DUTY->OFF_DUTY; SUSPEND: OFF_DUTY->SUSPENDED; REINSTATE: SUSPENDED->OFF_DUTY"]

  # ---- Reservation ----
  - method: POST
    path: "/reservations"
    description: "Create a reservation in DRAFT"
    roles: [Dispatcher, CorporateBooker]
    code: 201
    input: [corporate_account_id, trip_type, vehicle_class_id, pickup_at, planned_drop_at, "estimated_miles?", "charter_hours?", "tolls_cents?", "gratuity_pct_override?"]
    output: Reservation
    side_effects: ["trip_status=DRAFT; settlement_status=UNBILLED; fulfillment_mode=IN_HOUSE"]

  - method: GET
    path: "/reservations/{id}"
    description: "Get a reservation (includes computed quote/final/wait/cancellation fields)"
    roles: [DispatchAdmin, Dispatcher, CorporateBooker, Chauffeur]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "List/filter reservations (reverse-reachability for Reservation.corporate_account_id and Reservation.vehicle_class_id via filters)"
    roles: [DispatchAdmin, Dispatcher, CorporateBooker]
    code: 200
    input: ["corporate_account_id?", "vehicle_class_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: POST
    path: "/reservations/{id}/trip-events"
    description: "Advance the reservation trip_status. action=QUOTE (DRAFT->QUOTED), CONFIRM (QUOTED->CONFIRMED), DISPATCH (ASSIGNED->EN_ROUTE), COMPLETE (PASSENGER_ABOARD->COMPLETED), CANCEL (any non-terminal->CANCELLED). Per-action role limits are RBAC business rules."
    roles: [Dispatcher, CorporateBooker, Chauffeur]
    code: 200
    input: [action]
    output: Reservation
    side_effects: ["QUOTE: run calc estimate_quote, stamp quote_estimate_total_cents; CONFIRM: no money; DISPATCH: Chauffeur ON_DUTY->ON_TRIP set active_assignment_id; COMPLETE: run calc final_settlement stamp final_total_cents, Chauffeur ON_TRIP->ON_DUTY clear active_assignment_id, Assignment ACTIVE->RELEASED; CANCEL: run calc cancellation_tier stamp cancellation_fee_cents, create CancellationRecord, release Assignment + revert Chauffeur where applicable"]

  - method: POST
    path: "/reservations/{id}/wait-events"
    description: "Append a wait event. kind=CHAUFFEUR_ARRIVED moves EN_ROUTE->ON_LOCATION; kind=PASSENGER_BOARDED moves ON_LOCATION->PASSENGER_ABOARD and computes chargeable wait."
    roles: [Dispatcher, Chauffeur]
    code: 201
    input: [kind, occurred_at]
    output: WaitEvent
    side_effects: ["append WaitEvent; on PASSENGER_BOARDED run calc wait_time and stamp Reservation.chargeable_wait_minutes; advance trip_status"]

  - method: GET
    path: "/reservations/{id}/wait-events"
    description: "List wait events for a reservation (reverse-reachability for WaitEvent.reservation_id)"
    roles: [DispatchAdmin, Dispatcher, Chauffeur]
    code: 200
    input: ["limit?", "offset?"]
    output: WaitEvent[]
    side_effects: []

  - method: POST
    path: "/reservations/{id}/billing-events"
    description: "Advance the reservation settlement_status. action=INVOICE (UNBILLED->INVOICED), SETTLE (INVOICED->SETTLED), WRITE_OFF (INVOICED->WRITTEN_OFF, Admin only as RBAC business rule)."
    roles: [Dispatcher, DispatchAdmin]
    code: 200
    input: [action]
    output: Reservation
    side_effects: ["transition settlement_status; recompute CorporateAccount.outstanding_balance_cents"]

  - method: GET
    path: "/reservations/{id}/cancellation-record"
    description: "Get the cancellation record (reverse-reachability for CancellationRecord.reservation_id)"
    roles: [DispatchAdmin, Dispatcher, CorporateBooker]
    code: 200
    input: ["limit?", "offset?"]
    output: CancellationRecord[]
    side_effects: []

  # ---- Assignment ----
  - method: POST
    path: "/assignments"
    description: "Assign a chauffeur+vehicle in-house to a CONFIRMED reservation (CONFIRMED -> ASSIGNED). OCC-guarded on reservation.version."
    roles: [Dispatcher]
    code: 201
    input: [reservation_id, chauffeur_id, vehicle_id, expected_reservation_version]
    output: Assignment
    side_effects: ["create Assignment(ACTIVE) with window=[pickup_at,planned_drop_at]; Reservation CONFIRMED -> ASSIGNED; Chauffeur OFF_DUTY/ON_DUTY -> ON_DUTY; increments Reservation.version by 1"]

  - method: GET
    path: "/assignments/{id}"
    description: "Get an assignment"
    roles: [DispatchAdmin, Dispatcher, Chauffeur]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List/filter assignments (reverse-reachability for Assignment.reservation_id, Assignment.chauffeur_id, Assignment.vehicle_id via filters)"
    roles: [DispatchAdmin, Dispatcher, Chauffeur]
    code: 200
    input: ["reservation_id?", "chauffeur_id?", "vehicle_id?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  # ---- FarmOutOrder ----
  - method: POST
    path: "/farm-out-orders"
    description: "Offer a CONFIRMED reservation to an affiliate (creates OFFERED FarmOutOrder). OCC-guarded on reservation.version."
    roles: [Dispatcher]
    code: 201
    input: [reservation_id, affiliate_id, expected_reservation_version]
    output: FarmOutOrder
    side_effects: ["create FarmOutOrder(OFFERED); stamp offered_payout_cents; recompute Affiliate.open_farmouts; increments Reservation.version by 1"]

  - method: GET
    path: "/farm-out-orders/{id}"
    description: "Get a farm-out order"
    roles: [DispatchAdmin, Dispatcher, AffiliatePartner]
    code: 200
    input: []
    output: FarmOutOrder
    side_effects: []

  - method: GET
    path: "/farm-out-orders"
    description: "List/filter farm-out orders (reverse-reachability for FarmOutOrder.reservation_id and FarmOutOrder.affiliate_id via filters)"
    roles: [DispatchAdmin, Dispatcher, AffiliatePartner]
    code: 200
    input: ["reservation_id?", "affiliate_id?", "limit?", "offset?"]
    output: FarmOutOrder[]
    side_effects: []

  - method: POST
    path: "/farm-out-orders/{id}/decision-events"
    description: "Decide a farm-out offer. action=ACCEPT (OFFERED->ACCEPTED, AffiliatePartner), REJECT (OFFERED->REJECTED, AffiliatePartner), RECALL (OFFERED->RECALLED, Dispatcher). Per-action role limits are RBAC business rules."
    roles: [AffiliatePartner, Dispatcher]
    code: 200
    input: [action, "decline_reason?"]
    output: FarmOutOrder
    side_effects: ["ACCEPT: status->ACCEPTED, Reservation fulfillment_mode->FARMED_OUT, trip_status CONFIRMED->COMPLETED, run calc final_settlement, recompute Affiliate.open_farmouts; REJECT/RECALL: status->REJECTED/RECALLED, reservation stays CONFIRMED/IN_HOUSE, recompute Affiliate.open_farmouts"]

  # ---- FlightTracking ----
  - method: POST
    path: "/flight-trackings"
    description: "Attach flight tracking to an AIRPORT reservation"
    roles: [Dispatcher, CorporateBooker]
    code: 201
    input: [reservation_id, flight_number, scheduled_arrival_at, "meet_and_greet?"]
    output: FlightTracking
    side_effects: ["status=ON_TIME; estimated_arrival_at=scheduled_arrival_at"]

  - method: GET
    path: "/reservations/{id}/flight-trackings"
    description: "List flight tracking for a reservation (reverse-reachability for FlightTracking.reservation_id)"
    roles: [DispatchAdmin, Dispatcher, CorporateBooker, Chauffeur]
    code: 200
    input: ["limit?", "offset?"]
    output: FlightTracking[]
    side_effects: []

  - method: POST
    path: "/flight-trackings/{id}/flight-updates"
    description: "Push a flight status update. kind=LANDED finalizes; otherwise estimated_arrival_at drives ON_TIME<->DELAYED and may shift the linked ACTIVE Assignment window by the delay delta."
    roles: [DispatchAdmin, Dispatcher]
    code: 200
    input: ["estimated_arrival_at?", "kind?"]
    output: FlightTracking
    side_effects: ["set estimated_arrival_at; transition flight status; if linked ASSIGNED reservation has an ACTIVE Assignment, shift Assignment window by the delay delta (run-late propagation)"]

  # ---- Test-driving: deterministic clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the deterministic server clock used by lead-time/wait/flight comparisons"
    roles: [DispatchAdmin]
    code: 200
    input: [to_iso8601]
    output: ClockState
    side_effects: ["ClockState.current_utc = to_iso8601"]


# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation, or entity_backed user acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id (path or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "planned_drop_at is not strictly after pickup_at" }
  - { id: ERR_TRIP_TYPE_FIELDS, http: 422, condition: "trip_type-specific required field missing or non-positive (miles for P2P/AIRPORT, hours for HOURLY)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_FLIGHT_NOT_APPLICABLE, http: 409, condition: "FlightTracking create on a non-AIRPORT reservation or a second tracking for the same reservation" }
  - { id: ERR_WAIT_SEQUENCE, http: 409, condition: "Wait event out of order: BOARDED before ARRIVED, duplicate ARRIVED, or occurred_at earlier than the prior event" }
  - { id: ERR_RESOURCE_UNAVAILABLE, http: 409, condition: "Assigned chauffeur is ON_TRIP or SUSPENDED at assignment time" }
  - { id: ERR_CHAUFFEUR_DOUBLE_BOOKED, http: 409, condition: "Chauffeur window (incl. rest_buffer_minutes) overlaps an existing ACTIVE assignment" }
  - { id: ERR_VEHICLE_TURNAROUND_VIOLATION, http: 409, condition: "Vehicle inter-trip gap is less than turnaround_minutes against an existing ACTIVE assignment" }
  - { id: ERR_FULFILLMENT_CONFLICT, http: 409, condition: "Reservation already has an ACTIVE Assignment or an OFFERED/ACCEPTED FarmOutOrder; in-house and farm-out are mutually exclusive" }
  - { id: ERR_AFFILIATE_INELIGIBLE, http: 409, condition: "Affiliate is SUSPENDED or otherwise ineligible to receive a farm-out offer" }
  - { id: ERR_NOT_BILLABLE, http: 409, condition: "Reservation has no known final amount (not COMPLETED/CANCELLED) or settlement precondition not met for invoice/settle/write-off" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_reservation_version does not match current Reservation.version on assignment/farm-out create" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "CorporateAccount is SUSPENDED and cannot confirm new reservations" }
  - { id: ERR_VALIDATION_RANGE, http: 422, condition: "A numeric input falls outside its declared range (discount/gratuity/payout/share percent)" }
  - { id: ERR_DUPLICATE_PLATE, http: 409, condition: "Vehicle plate already in use by another vehicle" }
  - { id: ERR_DUPLICATE_CLASS_CODE, http: 409, condition: "VehicleClass code already in use among non-SUSPENDED classes" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DispatchAdmin
    description: "Operations superuser: provisions config (accounts, affiliates, classes, vehicles, chauffeurs), suspends/reinstates, writes off, sets the clock. Superset of Dispatcher."
    identity: "opaque"
    exclusive_operations:
      - "POST /corporate-accounts, POST /corporate-accounts/{id}/suspend"
      - "POST /affiliates"
      - "POST /vehicle-classes"
      - "POST /vehicles"
      - "POST /chauffeurs; POST /chauffeurs/{id}/duty-events (SUSPEND, REINSTATE exclusive to Admin)"
      - "POST /reservations/{id}/billing-events (WRITE_OFF exclusive to Admin)"
      - "POST /_clock/set_current_utc, GET /_clock"
    shared_operations:
      - "All GET reads; POST /flight-trackings/{id}/flight-updates"

  - name: Dispatcher
    description: "Operations user: builds reservations, quotes, confirms, assigns in-house, offers/recalls farm-outs, dispatches, completes, invoices, settles."
    identity: "opaque"
    exclusive_operations:
      - "POST /assignments"
      - "POST /farm-out-orders; POST /farm-out-orders/{id}/decision-events (RECALL exclusive to Dispatcher)"
      - "POST /reservations/{id}/billing-events (INVOICE, SETTLE)"
    shared_operations:
      - "POST /reservations (+CorporateBooker), POST /reservations/{id}/trip-events QUOTE/CONFIRM/CANCEL (+CorporateBooker)"
      - "POST /reservations/{id}/trip-events DISPATCH/COMPLETE, /wait-events (+Chauffeur)"
      - "POST /flight-trackings (+CorporateBooker), /flight-updates (+DispatchAdmin)"
      - "GET reads"

  - name: CorporateBooker
    description: "Acts on behalf of one CorporateAccount: books, quotes, confirms, cancels reservations for that account only; attaches flight tracking."
    identity: "entity_backed:CorporateAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /reservations (own account only), POST /reservations/{id}/trip-events QUOTE/CONFIRM/CANCEL"
      - "POST /flight-trackings"
      - "GET /corporate-accounts/{id} (own), /reservations, /reservations/{id}, vehicle-classes"

  - name: AffiliatePartner
    description: "Acts on behalf of one Affiliate: accepts/rejects farm-out offers addressed to that affiliate."
    identity: "entity_backed:Affiliate"
    exclusive_operations:
      - "POST /farm-out-orders/{id}/decision-events ACCEPT/REJECT"
    shared_operations:
      - "GET /affiliates/{id} (own), /affiliates/{id}/farm-out-orders, /farm-out-orders/{id}, /reservations/{id}/farm-out-orders"

  - name: Chauffeur
    description: "Acts on behalf of one Chauffeur: clock in/out, dispatch own trip, report wait events, complete own trip."
    identity: "entity_backed:Chauffeur"
    exclusive_operations: []
    shared_operations:
      - "POST /chauffeurs/{id}/duty-events (CLOCK_IN, CLOCK_OUT) on own chauffeur"
      - "POST /reservations/{id}/trip-events DISPATCH/COMPLETE, /wait-events (own assignment)"
      - "GET /chauffeurs/{id} (own), /chauffeurs/{id}/assignments, /assignments/{id}, /reservations/{id}, /reservations/{id}/wait-events, /flight-trackings"
