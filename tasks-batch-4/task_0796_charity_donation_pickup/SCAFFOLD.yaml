scenario: "Charity Donation-Pickup Scheduling (GreenDrop/Salvation Army style): pickup request & item list/photo, donation-vs-haul routing & tax-receipt, charity partner & schedule/route, volume pricing or free-donation, recycling/diversion, attended vs unattended (porch), confirmation & receipt, recurring"
domain_name: "charity-donation-pickup"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Tree-ish ownership (PickupRequest -> DonationItem) plus flat FK references
  # (Route <- Vehicle/CharityPartner) and a junction (RouteStop links Route x PickupRequest).

  state_machine_shape: branching
  # PickupRequest forks at completion into DONATION vs HAUL branches with divergent
  # side-effect sets; RecurringPlan is a cyclic ACTIVE<->PAUSED machine.

  relationship_patterns:
    - one_to_many        # PickupRequest -> DonationItem; Route -> RouteStop
    - many_to_many       # RouteStop is the junction between Route and PickupRequest
    - cross_aggregate    # DonationReceipt/HaulInvoice reference PickupRequest across aggregates

  role_model: peer_roles
  # Donor owns requests/items/plans; Dispatcher owns routes/scheduling; Driver services
  # in the field; PartnerAdmin owns partner config + receipts; PlatformAdmin provisions.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: CharityPartner
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the charity partner organization"
      - name: region_code
        type: string
        source: input
        description: "Service region this partner operates in (e.g., CA-BAY, NY-METRO)"
      - name: tax_id
        type: string
        source: input
        description: "Partner tax/EIN identifier printed on donation receipts"
      - name: accepted_categories
        type: array
        source: input
        description: "Subset of item categories this partner will accept for DONATION"
        constraints: "each element IN {FURNITURE, CLOTHING, ELECTRONICS, APPLIANCE, HOUSEHOLD}; non-empty"
      - name: status
        type: enum
        source: input
        description: "Operational status; SUSPENDED partners cannot host new donations or resume plans"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: ytd_donation_value_cents
        type: integer
        source: computed
        description: "Sum of final_value_cents over this partner's ISSUED DonationReceipts whose issued_at year equals the current logical-clock year; recomputed on receipt issue and void"
        default: 0
      - name: diverted_weight_lbs
        type: integer
        source: computed
        description: "Sum of DonationItem.weight_lbs with stream IN {RECYCLE, REUSE} over this partner's COMPLETED pickups; recomputed on completion and on receipt void"
        default: 0

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human-readable truck identifier"
      - name: capacity_cf
        type: integer
        source: input
        description: "Maximum cubic feet the vehicle can carry on one route"
        constraints: "> 0"
      - name: home_depot_code
        type: string
        source: input
        description: "Depot the vehicle returns to"
      - name: status
        type: enum
        source: input
        description: "OUT_OF_SERVICE vehicles cannot have a route opened onto them"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, OUT_OF_SERVICE}"

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the truck servicing this route"
      - name: partner_id
        type: string
        source: input
        description: "FK -> CharityPartner.id; the charity this route delivers donations to"
      - name: service_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the route runs"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the route service window (ISO8601 UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the route service window (ISO8601 UTC); must be > window_start"
      - name: status
        type: enum
        source: input
        description: "Lifecycle state; only OPEN routes accept new stops"
        default: "PLANNED"
        constraints: "one of {PLANNED, OPEN, CLOSED}"
      - name: reserved_volume_cf
        type: integer
        source: computed
        description: "Sum of reserved_volume_cf over this route's RouteStops in status RESERVED; recomputed on every stop create/cancel/service"
        default: 0
      - name: total_stop_count
        type: integer
        source: computed
        description: "Count of this route's RouteStops in status IN {RESERVED, SERVICED}; recomputed on stop create/service/cancel"
        default: 0
      - name: serviced_stop_count
        type: integer
        source: computed
        description: "Count of this route's RouteStops in status SERVICED; recomputed on completion"
        default: 0

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Contact email; unique per donor"
      - name: full_name
        type: string
        source: input
        description: "Donor display name"
      - name: address
        type: string
        source: input
        description: "Default pickup street address"
      - name: region_code
        type: string
        source: input
        description: "Region the donor resides in"
      - name: status
        type: enum
        source: input
        description: "Account status; set ACTIVE at registration"
        default: "ACTIVE"
        constraints: "one of {ACTIVE}"

  - name: RecurringPlan
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donor who owns this recurring plan"
      - name: partner_id
        type: string
        source: input
        description: "FK -> CharityPartner.id; the charity each generated pickup is routed to"
      - name: pickup_mode
        type: enum
        source: input
        description: "Attended (in-home) or unattended (porch) mode applied to generated requests"
        constraints: "one of {ATTENDED, UNATTENDED}"
      - name: address
        type: string
        source: input
        description: "Pickup address stamped onto generated requests"
      - name: default_disposition
        type: enum
        source: input
        description: "DONATION or HAUL disposition stamped onto generated requests"
        constraints: "one of {DONATION, HAUL}"
      - name: frequency
        type: enum
        source: input
        description: "Cadence used to advance next_pickup_date on generate"
        constraints: "one of {WEEKLY, BIWEEKLY, MONTHLY}"
      - name: next_pickup_date
        type: string
        source: computed
        description: "Next date (YYYY-MM-DD) a pickup will be generated; initialized to the current logical-clock date + one cadence step at creation, advanced on each generate"
      - name: status
        type: enum
        source: input
        description: "Lifecycle; only ACTIVE plans may generate pickups"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, PAUSED, CANCELLED}"

  - name: PickupRequest
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; owner of this request"
      - name: partner_id
        type: string
        source: input
        description: "FK -> CharityPartner.id; charity that receives the donation / hosts the haul"
      - name: recurring_plan_id
        type: string
        source: input
        description: "FK -> RecurringPlan.id; set only on requests materialized by a plan generate, else null"
        default: null
      - name: pickup_mode
        type: enum
        source: input
        description: "ATTENDED (crew enters home) vs UNATTENDED (items left on porch)"
        constraints: "one of {ATTENDED, UNATTENDED}"
      - name: disposition
        type: enum
        source: input
        description: "DONATION (tax receipt, free under volume cap) vs HAUL (priced junk removal)"
        constraints: "one of {DONATION, HAUL}"
      - name: address
        type: string
        source: input
        description: "Street address for the pickup"
      - name: porch_photo_url
        type: string
        source: input
        description: "Photo of items staged on the porch; required for UNATTENDED at schedule time"
        default: null
      - name: safety_attestation
        type: boolean
        source: input
        description: "Donor attests items are safely accessible; required true for UNATTENDED at schedule time"
        default: false
      - name: declared_volume_cf
        type: integer
        source: computed
        description: "Sum of volume_cf over this request's DonationItems; recomputed on each item add"
        default: 0
      - name: measured_volume_cf
        type: integer
        source: input
        description: "Actual cubic feet measured by the driver at completion; null until COMPLETED"
        default: null
      - name: is_free_donation
        type: boolean
        source: computed
        description: "True iff disposition == DONATION and declared_volume_cf <= FREE_DONATION_MAX_CF (50); recomputed on item add"
        default: false
      - name: estimated_haul_fee_cents
        type: integer
        source: computed
        description: "Forward-looking haul-fee estimate from declared_volume_cf (HAUL only, no diversion credit); 0 for DONATION; recomputed on item add"
        default: 0
      - name: status
        type: enum
        source: input
        description: "Lifecycle state of the pickup"
        default: "REQUESTED"
        constraints: "one of {REQUESTED, SCHEDULED, COMPLETED, NO_SHOW, CANCELLED}"

  - name: DonationItem
    parent: PickupRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> PickupRequest.id; the request this item belongs to"
      - name: category
        type: enum
        source: input
        description: "Item category, matched against partner.accepted_categories for DONATION"
        constraints: "one of {FURNITURE, CLOTHING, ELECTRONICS, APPLIANCE, HOUSEHOLD}"
      - name: volume_cf
        type: integer
        source: input
        description: "Cubic feet this item occupies"
        constraints: "> 0"
      - name: weight_lbs
        type: integer
        source: input
        description: "Weight in pounds; may be corrected by the driver during appraisal"
        constraints: ">= 0"
      - name: declared_value_cents
        type: integer
        source: input
        description: "Donor's declared fair value in cents (basis for provisional receipt value)"
        constraints: ">= 0"
      - name: declared_condition
        type: enum
        source: input
        description: "Donor-declared condition driving the provisional FMV factor"
        constraints: "one of {NEW, GOOD, FAIR, POOR}"
      - name: appraised_value_cents
        type: integer
        source: system
        description: "Driver-appraised value in cents; null until appraised; basis for final receipt value"
        default: null
      - name: appraised_condition
        type: enum
        source: system
        description: "Driver-appraised condition driving the final FMV factor; null until appraised"
        default: null
        constraints: "one of {NEW, GOOD, FAIR, POOR}"
      - name: stream
        type: enum
        source: system
        description: "Diversion stream assigned by driver at appraisal; RECYCLE/REUSE count as diverted, LANDFILL does not; null until appraised"
        default: null
        constraints: "one of {RECYCLE, REUSE, LANDFILL}"

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; the route this stop sits on"
      - name: request_id
        type: string
        source: input
        description: "FK -> PickupRequest.id; the request serviced at this stop (1:1)"
      - name: sequence
        type: integer
        source: computed
        description: "1-based ordinal of this stop within the route, assigned by ascending slot_start then created_at"
      - name: slot_start
        type: datetime
        source: input
        description: "Inclusive start of the on-site time slot (ISO8601 UTC)"
      - name: slot_end
        type: datetime
        source: input
        description: "Exclusive end of the on-site time slot; must be > slot_start"
      - name: reserved_volume_cf
        type: integer
        source: computed
        description: "Snapshot of the request's declared_volume_cf at schedule time; drives route capacity accounting"
      - name: status
        type: enum
        source: input
        description: "RESERVED at creation; SERVICED on completion; CANCELLED on request cancel / no-show"
        default: "RESERVED"
        constraints: "one of {RESERVED, SERVICED, CANCELLED}"

  - name: DonationReceipt
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> PickupRequest.id; the completed DONATION pickup this receipt documents"
      - name: partner_id
        type: string
        source: input
        description: "FK -> CharityPartner.id; the receiving charity (copied from the request)"
      - name: receipt_number
        type: string
        source: system
        description: "System-minted human-facing receipt number"
      - name: provisional_value_cents
        type: integer
        source: system
        description: "Fair-market value from donor-declared values/conditions, rounded per item then summed; snapshot at request creation state"
      - name: final_value_cents
        type: integer
        source: system
        description: "Fair-market value from appraised (else declared) values/conditions, rounded per item then summed; set at issuance"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the receipt moved to ISSUED"
        default: null
      - name: status
        type: enum
        source: input
        description: "Receipt lifecycle"
        default: "ISSUED"
        constraints: "one of {ISSUED, VOIDED}"

  - name: HaulInvoice
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> PickupRequest.id; the completed HAUL pickup this invoice bills"
      - name: estimate_cents
        type: integer
        source: system
        description: "Snapshot of the request's estimated_haul_fee_cents at completion (forward-looking, declared volume, no diversion credit)"
      - name: final_cents
        type: integer
        source: system
        description: "Chronological subtotal from measured_volume_cf (base + tiered + attended surcharge), before diversion credit"
      - name: diversion_credit_cents
        type: integer
        source: system
        description: "Recycling/reuse credit applied to this haul, capped at DIVERSION_CREDIT_MAX_PCT of final_cents"
      - name: amount_due_cents
        type: integer
        source: system
        description: "max(0, final_cents - diversion_credit_cents); the payable amount"
      - name: status
        type: enum
        source: input
        description: "Invoice lifecycle"
        default: "INVOICED"
        constraints: "one of {INVOICED, PAID}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Route
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /routes/{id}/open"
        actor: Dispatcher
        preconditions:
          - "route.status == PLANNED"
          - "referenced Vehicle.status == ACTIVE (cross-entity)"
        side_effects:
          - "route.status = OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "POST /routes/{id}/close"
        actor: Dispatcher
        preconditions:
          - "route.status == OPEN"
          - "route has zero RouteStops in status RESERVED (all stops SERVICED or CANCELLED)"
        side_effects:
          - "route.status = CLOSED"

  - entity: PickupRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /pickup-requests/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "request.status == REQUESTED"
          - "request has >= 1 DonationItem (else ERR_NO_ITEMS)"
          - "referenced Route.status == OPEN (cross-entity, else ERR_ROUTE_NOT_OPEN)"
          - "for UNATTENDED: porch_photo_url != null AND safety_attestation == true (else ERR_PORCH_ATTESTATION_REQUIRED)"
          - "for DONATION: every DonationItem.category IN partner.accepted_categories (else ERR_CATEGORY_NOT_ACCEPTED)"
          - "for DONATION: declared_volume_cf <= DONATION_MAX_CF (50) (else ERR_DONATION_OVER_LIMIT)"
          - "slot_start >= route.window_start AND slot_end <= route.window_end (else ERR_SLOT_OUTSIDE_WINDOW)"
          - "no RESERVED/SERVICED RouteStop on the route whose slot, expanded by TRAVEL_BUFFER_MIN (15 min) each side, overlaps this slot (else ERR_STOP_SLOT_CONFLICT)"
          - "route.reserved_volume_cf + declared_volume_cf <= Vehicle.capacity_cf (else ERR_ROUTE_CAPACITY_EXCEEDED)"
          - "expected_route_version == route.version (OCC, else ERR_STALE_VERSION)"
        side_effects:
          - "create RouteStop {route_id, request_id, slot_start, slot_end, reserved_volume_cf = request.declared_volume_cf, status = RESERVED}"
          - "recompute route.reserved_volume_cf (calc route_reserved_volume): += new stop volume"
          - "recompute route.total_stop_count"
          - "increments Route.version by 1"
          - "request.status = SCHEDULED"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pickup-requests/{id}/complete"
        actor: Driver
        preconditions:
          - "request.status == SCHEDULED"
        side_effects:
          - "request.measured_volume_cf = input.measured_volume_cf"
          - "the request's RouteStop.status = SERVICED; recompute route.reserved_volume_cf (stop leaves RESERVED set) and route.serviced_stop_count"
          - "BRANCH disposition == DONATION: create DonationReceipt {status = ISSUED, provisional_value_cents, final_value_cents (calc tax_receipt_value), issued_at = clock}; this issuance recomputes CharityPartner.ytd_donation_value_cents (calc partner_ytd_donation_value) and CharityPartner.diverted_weight_lbs (calc partner_diverted_weight); NO HaulInvoice"
          - "BRANCH disposition == HAUL: create HaulInvoice {status = INVOICED, estimate_cents = request.estimated_haul_fee_cents, final_cents, diversion_credit_cents, amount_due_cents (calc haul_fee final variant)}; recompute CharityPartner.diverted_weight_lbs; NO DonationReceipt"
        note: "Branching fork-join: the two dispositions apply disjoint side-effect sets."
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /pickup-requests/{id}/no-show"
        actor: Driver
        preconditions:
          - "request.status == SCHEDULED"
        side_effects:
          - "the request's RouteStop.status = CANCELLED; recompute route.reserved_volume_cf and route.total_stop_count"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /pickup-requests/{id}/cancel"
        actor: Donor
        preconditions:
          - "request.status == REQUESTED"
        side_effects:
          - "request.status = CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pickup-requests/{id}/cancel"
        actor: Donor
        preconditions:
          - "request.status == SCHEDULED"
        side_effects:
          - "the request's RouteStop.status = CANCELLED (caused by the request cancel)"
          - "that stop leaving the RESERVED set causes recompute of route.reserved_volume_cf (calc route_reserved_volume) and route.total_stop_count"

  - entity: RecurringPlan
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /recurring-plans/{id}/pause"
        actor: Donor
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "plan.status = PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /recurring-plans/{id}/resume"
        actor: Donor
        preconditions:
          - "plan.status == PAUSED"
          - "referenced CharityPartner.status == ACTIVE (cross-entity, else ERR_PARTNER_SUSPENDED)"
        side_effects:
          - "plan.status = ACTIVE"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /recurring-plans/{id}/cancel"
        actor: Donor
        preconditions:
          - "plan.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "plan.status = CANCELLED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /recurring-plans/{id}/cancel"
        actor: Donor
        preconditions:
          - "plan.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "plan.status = CANCELLED"

  - entity: DonationReceipt
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /donation-receipts/{id}/void"
        actor: PartnerAdmin
        preconditions:
          - "receipt.status == ISSUED"
        side_effects:
          - "receipt.status = VOIDED"
          - "recompute CharityPartner.ytd_donation_value_cents (calc partner_ytd_donation_value): the voided receipt drops out of the ISSUED set, debiting exactly final_value_cents (compensation)"
          - "recompute CharityPartner.diverted_weight_lbs for the underlying pickup"

  - entity: HaulInvoice
    initial_state: INVOICED
    terminal_states: [PAID]
    transitions:
      - from: INVOICED
        to: PAID
        trigger: "POST /haul-invoices/{id}/pay"
        actor: Donor
        preconditions:
          - "invoice.status == INVOICED"
        side_effects:
          - "invoice.status = PAID"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: schedule-stale-route
    parent_entity: Route
    write_endpoint: "POST /pickup-requests/{id}/schedule"
    occ_field: "expected_route_version"
    description: |
      Scheduling a pickup onto a Route whose version has advanced since the
      Dispatcher last observed it is rejected. A Dispatcher reads the route
      (observing its version and remaining capacity), decides the new stop
      fits, and submits the schedule carrying that version. If another stop
      was legitimately added in the meantime, the route's reserved_volume_cf
      and version have moved on and the submitting client's capacity view is
      stale, so the write is refused on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: declared_volume
    trigger: "on POST /pickup-requests/{id}/items (item added)"
    algorithm: aggregation
    formula: |
      PickupRequest.declared_volume_cf = sum(item.volume_cf
        for item in DonationItems where item.request_id == request.id)
    input_set: "all DonationItems of the request (no status filter; items are not individually cancellable)"
    precision: "integer cubic feet"

  - name: haul_fee
    trigger: "estimate: on item add (estimated_haul_fee_cents); final: on POST /pickup-requests/{id}/complete for disposition == HAUL"
    algorithm: tiered_pricing
    formula: |
      def tiered(V):                       # marginal per-cf tiers
        if V <= 100:  return V*40
        if V <= 250:  return 100*40 + (V-100)*60
        return 100*40 + 150*60 + (V-250)*80
      subtotal(V, mode) = HAUL_BASE_FEE_CENTS
                        + tiered(V)
                        + (ATTENDED_SURCHARGE_CENTS if mode == ATTENDED else 0)
      diverted_weight = sum(item.weight_lbs for item in items
                            where item.stream IN {RECYCLE, REUSE})
      credit = min(DIVERSION_CREDIT_PER_LB_CENTS * diverted_weight,
                   round_half_up(subtotal * DIVERSION_CREDIT_MAX_PCT))
      amount_due = max(0, subtotal - credit)
    input_set: "HAUL requests only; final variant reads appraised streams/weights of the request's DonationItems"
    constants:
      HAUL_BASE_FEE_CENTS: 3500
      TIER_A_MAX_CF: 100
      TIER_A_RATE_CENTS_PER_CF: 40
      TIER_B_MAX_CF: 250
      TIER_B_RATE_CENTS_PER_CF: 60
      TIER_C_RATE_CENTS_PER_CF: 80
      ATTENDED_SURCHARGE_CENTS: 2000
      DIVERSION_CREDIT_PER_LB_CENTS: 5
      DIVERSION_CREDIT_MAX_PCT: 0.30
    precision: "integer cents; round_half_up on the credit cap"
    variants:
      - name: estimate
        when: "computed as estimated_haul_fee_cents from declared_volume_cf at/after item add, before pickup"
        difference: "V = declared_volume_cf; forward-looking; diversion credit forced to 0 (nothing appraised yet)"
      - name: final
        when: "computed at completion into HaulInvoice.final_cents/amount_due_cents"
        difference: "V = measured_volume_cf; diversion credit computed from appraised streams/weights"

  - name: tax_receipt_value
    trigger: "provisional: snapshot from declared item values; final: on POST /pickup-requests/{id}/complete for disposition == DONATION (into DonationReceipt)"
    algorithm: weighted_scoring
    formula: |
      FACTOR = {NEW: 1.00, GOOD: 0.70, FAIR: 0.40, POOR: 0.15}
      per_item(value_cents, condition) = round_half_up(value_cents * FACTOR[condition])
      # ORDER PINNED: round each item's fair value to whole cents FIRST, THEN sum.
      value = sum(per_item(v, c) for each item)
    input_set: "all DonationItems of the DONATION request"
    constants:
      FACTOR_NEW: 1.00
      FACTOR_GOOD: 0.70
      FACTOR_FAIR: 0.40
      FACTOR_POOR: 0.15
    precision: "integer cents; round_half_up per item, then integer sum (round-then-sum, NOT sum-then-round)"
    variants:
      - name: provisional
        when: "reflects the request before appraisal"
        difference: "uses declared_value_cents and declared_condition"
      - name: final
        when: "set into DonationReceipt.final_value_cents at issuance"
        difference: "uses appraised_value_cents/appraised_condition when appraised (non-null), else the declared pair"

  - name: route_reserved_volume
    trigger: "on stop create (schedule), stop service (complete), stop cancel (cancel/no-show)"
    algorithm: aggregation
    formula: |
      Route.reserved_volume_cf = sum(stop.reserved_volume_cf
        for stop in RouteStops where stop.route_id == route.id
                                   and stop.status == RESERVED)
    input_set: "RouteStops in status RESERVED only (SERVICED and CANCELLED excluded)"
    precision: "integer cubic feet"

  - name: partner_ytd_donation_value
    trigger: "on DonationReceipt issue (complete/DONATION) and on receipt void"
    algorithm: aggregation
    formula: |
      CharityPartner.ytd_donation_value_cents = sum(r.final_value_cents
        for r in DonationReceipts where r.partner_id == partner.id
                                      and r.status == ISSUED
                                      and year_of(r.issued_at) == year_of(clock_now))
    input_set: "ISSUED receipts of the partner whose issued_at year equals the current logical-clock year"
    precision: "integer cents"

  - name: partner_diverted_weight
    trigger: "on pickup complete and on receipt void"
    algorithm: aggregation
    formula: |
      CharityPartner.diverted_weight_lbs = sum(item.weight_lbs
        for item in DonationItems
        where item.request.partner_id == partner.id
          and item.request.status == COMPLETED
          and item.stream IN {RECYCLE, REUSE})
    input_set: "DonationItems of the partner's COMPLETED pickups with a diverted stream"
    precision: "integer pounds"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /donors (Anonymous permitted)"

  - priority: 2
    category: auth
    check: "role is permitted to invoke this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id in the path resolves to a live resource, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: auth
    check: "entity-backed ownership: for Donor, X-User-ID == resource.donor_id (request/plan) or item's request.donor_id; for PartnerAdmin, X-User-ID == resource.partner_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /pickup-requests, POST /pickup-requests/{id}/items, POST /pickup-requests/{id}/cancel, POST /haul-invoices/{id}/pay, POST /recurring-plans and its lifecycle actions, POST /donation-receipts/{id}/void"

  - priority: 5
    category: existence
    check: "referenced body FKs (donor_id, partner_id, route_id, recurring_plan_id) resolve to live resources"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /pickup-requests, POST /routes, POST /recurring-plans, POST /pickup-requests/{id}/schedule"

  - priority: 6
    category: state
    check: "target resource is in a state that admits the requested transition (REQUESTED to schedule; SCHEDULED to complete/no-show; OPEN to close; ISSUED to void; INVOICED to pay; ACTIVE/PAUSED plan transitions)"
    error_id: "ERR_<domain>_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "cross-entity state gate: Route.status == OPEN for schedule; Vehicle.status == ACTIVE for open; CharityPartner.status == ACTIVE for plan resume"
    error_id: "ERR_ROUTE_NOT_OPEN | ERR_VEHICLE_OUT_OF_SERVICE | ERR_PARTNER_SUSPENDED"
    http_status: 409
    applies_to: "POST /pickup-requests/{id}/schedule, POST /routes/{id}/open, POST /recurring-plans/{id}/resume"

  - priority: 8
    category: business_referential
    check: "route window overlap: new Route [window_start, window_end) must not overlap any non-CLOSED Route on the same vehicle_id and service_date; adjacency (prev.window_end == new.window_start) is allowed (half-open)"
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /routes"

  - priority: 9
    category: business_constraint
    check: "request has >= 1 DonationItem"
    error_id: ERR_NO_ITEMS
    http_status: 422
    applies_to: "POST /pickup-requests/{id}/schedule"

  - priority: 10
    category: business_safety
    check: "UNATTENDED request has porch_photo_url != null AND safety_attestation == true"
    error_id: ERR_PORCH_ATTESTATION_REQUIRED
    http_status: 422
    applies_to: "POST /pickup-requests/{id}/schedule"

  - priority: 11
    category: business_referential
    check: "DONATION request: every DonationItem.category is in partner.accepted_categories"
    error_id: ERR_CATEGORY_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /pickup-requests/{id}/schedule"

  - priority: 12
    category: business_constraint
    check: "DONATION request: declared_volume_cf <= DONATION_MAX_CF (50)"
    error_id: ERR_DONATION_OVER_LIMIT
    http_status: 422
    applies_to: "POST /pickup-requests/{id}/schedule"

  - priority: 13
    category: business_temporal
    check: "stop slot within route window: slot_start >= route.window_start AND slot_end <= route.window_end AND slot_end > slot_start"
    error_id: ERR_SLOT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /pickup-requests/{id}/schedule"

  - priority: 14
    category: business_temporal
    check: "stop slot buffer: no RESERVED/SERVICED RouteStop on the route whose slot, expanded by TRAVEL_BUFFER_MIN (15 min) each side, overlaps the requested slot (gap between adjacent stops must be >= 15 min)"
    error_id: ERR_STOP_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /pickup-requests/{id}/schedule"

  - priority: 15
    category: business_fiscal
    check: "route capacity: route.reserved_volume_cf + request.declared_volume_cf <= Vehicle.capacity_cf"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /pickup-requests/{id}/schedule"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_route_version == route.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pickup-requests/{id}/schedule"

  - priority: 17
    category: business_constraint
    check: "field-level input validity: required fields present, enums in range, numeric fields within declared constraints, window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- CharityPartner ----
  - method: POST
    path: "/partners"
    description: "Create a charity partner"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, tax_id, accepted_categories, "status?"]
    output: CharityPartner
    side_effects: ["ytd_donation_value_cents=0, diverted_weight_lbs=0"]
  - method: GET
    path: "/partners/{id}"
    description: "Fetch a charity partner"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: []
    output: CharityPartner
    side_effects: []
  - method: PATCH
    path: "/partners/{id}"
    description: "Update partner status and/or accepted categories"
    roles: [PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["status?", "accepted_categories?"]
    output: CharityPartner
    side_effects: ["increments CharityPartner.version by 1"]

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Create a vehicle (optionally OUT_OF_SERVICE)"
    roles: [PlatformAdmin]
    code: 201
    input: [label, capacity_cf, home_depot_code, "status?"]
    output: Vehicle
    side_effects: []

  # ---- Route ----
  - method: POST
    path: "/routes"
    description: "Create a route (PLANNED) on a vehicle for a partner and service window"
    roles: [Dispatcher]
    code: 201
    input: [vehicle_id, partner_id, service_date, window_start, window_end]
    output: Route
    side_effects: ["validates route-window non-overlap on the vehicle"]
  - method: GET
    path: "/routes/{id}"
    description: "Fetch a route with computed reserved_volume_cf and stop counts"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/routes"
    description: "List routes, filterable by vehicle_id, partner_id, status"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["vehicle_id?", "partner_id?", "status?", "limit?", "offset?"]
    output: Route[]
    side_effects: []
  - method: POST
    path: "/routes/{id}/open"
    description: "Open a route for scheduling"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["route.status=OPEN; increments Route.version by 1"]
  - method: POST
    path: "/routes/{id}/close"
    description: "Close a route (requires no RESERVED stops remaining)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["route.status=CLOSED; increments Route.version by 1"]
  - method: GET
    path: "/routes/{id}/stops"
    description: "List RouteStops on a route (reverse lookup for RouteStop.route_id)"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  # ---- Donor ----
  - method: POST
    path: "/donors"
    description: "Register a donor"
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [email, full_name, address, region_code]
    output: Donor
    side_effects: []
  - method: GET
    path: "/donors/{id}"
    description: "Fetch a donor"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Donor
    side_effects: []

  # ---- PickupRequest ----
  - method: POST
    path: "/pickup-requests"
    description: "Create a pickup request (REQUESTED)"
    roles: [Donor]
    code: 201
    input: [donor_id, partner_id, pickup_mode, disposition, address, "porch_photo_url?", "safety_attestation?", "recurring_plan_id?"]
    output: PickupRequest
    side_effects: ["declared_volume_cf=0, is_free_donation per disposition, estimated_haul_fee_cents=0"]
  - method: GET
    path: "/pickup-requests/{id}"
    description: "Fetch a pickup request with computed fields"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PickupRequest
    side_effects: []
  - method: GET
    path: "/pickup-requests"
    description: "List pickup requests, filterable by donor_id, partner_id, recurring_plan_id, status"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["donor_id?", "partner_id?", "recurring_plan_id?", "status?", "limit?", "offset?"]
    output: PickupRequest[]
    side_effects: []
  - method: POST
    path: "/pickup-requests/{id}/items"
    description: "Add a donation item to a REQUESTED pickup"
    roles: [Donor]
    code: 201
    input: [category, volume_cf, weight_lbs, declared_value_cents, declared_condition]
    output: DonationItem
    side_effects: ["recompute request.declared_volume_cf, is_free_donation, estimated_haul_fee_cents"]
  - method: GET
    path: "/pickup-requests/{id}/items"
    description: "List a request's donation items (reverse lookup for DonationItem.request_id)"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DonationItem[]
    side_effects: []
  - method: GET
    path: "/pickup-requests/{id}/stops"
    description: "List RouteStops for a request (reverse lookup for RouteStop.request_id; 0 or 1)"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: GET
    path: "/pickup-requests/{id}/haul-invoices"
    description: "List HaulInvoices for a request (reverse lookup for HaulInvoice.request_id; 0 or 1)"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: HaulInvoice[]
    side_effects: []
  - method: POST
    path: "/pickup-requests/{id}/schedule"
    description: "Schedule a request onto an OPEN route, creating a RouteStop (OCC on route)"
    roles: [Dispatcher]
    code: 201
    input: [route_id, slot_start, slot_end, expected_route_version]
    output: RouteStop
    side_effects: ["create RouteStop RESERVED; recompute route.reserved_volume_cf/total_stop_count; request.status=SCHEDULED; increments Route.version by 1"]
  - method: POST
    path: "/pickup-requests/{id}/complete"
    description: "Complete a scheduled pickup; branches on disposition to issue a receipt or a haul invoice"
    roles: [Driver]
    code: 200
    input: [measured_volume_cf]
    output: PickupRequest
    side_effects: ["stop SERVICED; DONATION -> issue DonationReceipt + recompute partner ytd/diverted; HAUL -> create HaulInvoice + recompute partner diverted"]
  - method: POST
    path: "/pickup-requests/{id}/no-show"
    description: "Mark a scheduled pickup a no-show (e.g., empty porch)"
    roles: [Driver]
    code: 200
    input: []
    output: PickupRequest
    side_effects: ["stop CANCELLED; recompute route.reserved_volume_cf/total_stop_count"]
  - method: POST
    path: "/pickup-requests/{id}/cancel"
    description: "Cancel a REQUESTED or SCHEDULED pickup (donor)"
    roles: [Donor]
    code: 200
    input: []
    output: PickupRequest
    side_effects: ["if SCHEDULED: stop CANCELLED -> recompute route.reserved_volume_cf/total_stop_count"]

  # ---- DonationItem ----
  - method: PATCH
    path: "/donation-items/{id}"
    description: "Driver appraisal of an item on a SCHEDULED request (value/condition/weight/stream)"
    roles: [Driver]
    code: 200
    input: ["appraised_value_cents?", "appraised_condition?", "weight_lbs?", "stream?"]
    output: DonationItem
    side_effects: ["set appraisal fields; recompute request.estimated_haul_fee_cents unaffected (estimate is pre-appraisal)"]

  # ---- DonationReceipt ----
  - method: GET
    path: "/donation-receipts/{id}"
    description: "Fetch a donation receipt"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: []
    output: DonationReceipt
    side_effects: []
  - method: GET
    path: "/donation-receipts"
    description: "List donation receipts, filterable by request_id, partner_id (reverse lookup for both FKs)"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["request_id?", "partner_id?", "status?", "limit?", "offset?"]
    output: DonationReceipt[]
    side_effects: []
  - method: POST
    path: "/donation-receipts/{id}/void"
    description: "Void an issued receipt; compensates partner YTD/diverted totals"
    roles: [PartnerAdmin]
    code: 200
    input: []
    output: DonationReceipt
    side_effects: ["receipt.status=VOIDED; recompute partner ytd_donation_value_cents and diverted_weight_lbs"]

  # ---- HaulInvoice ----
  - method: POST
    path: "/haul-invoices/{id}/pay"
    description: "Mark an invoice paid (donor)"
    roles: [Donor]
    code: 200
    input: []
    output: HaulInvoice
    side_effects: ["invoice.status=PAID"]

  # ---- RecurringPlan ----
  - method: POST
    path: "/recurring-plans"
    description: "Create a recurring pickup plan (ACTIVE)"
    roles: [Donor]
    code: 201
    input: [donor_id, partner_id, pickup_mode, address, default_disposition, frequency]
    output: RecurringPlan
    side_effects: ["next_pickup_date = clock_date + one cadence step"]
  - method: GET
    path: "/recurring-plans/{id}"
    description: "Fetch a recurring plan"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: []
  - method: GET
    path: "/recurring-plans"
    description: "List recurring plans, filterable by donor_id, partner_id (reverse lookup for both FKs)"
    roles: [Donor, Dispatcher, Driver, PartnerAdmin, PlatformAdmin]
    code: 200
    input: ["donor_id?", "partner_id?", "status?", "limit?", "offset?"]
    output: RecurringPlan[]
    side_effects: []
  - method: POST
    path: "/recurring-plans/{id}/pause"
    description: "Pause an active plan"
    roles: [Donor]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["plan.status=PAUSED"]
  - method: POST
    path: "/recurring-plans/{id}/resume"
    description: "Resume a paused plan (requires partner ACTIVE)"
    roles: [Donor]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["plan.status=ACTIVE"]
  - method: POST
    path: "/recurring-plans/{id}/cancel"
    description: "Cancel a plan"
    roles: [Donor]
    code: 200
    input: []
    output: RecurringPlan
    side_effects: ["plan.status=CANCELLED"]
  - method: POST
    path: "/recurring-plans/{id}/generate"
    description: "Materialize the next pickup request from a plan and advance next_pickup_date"
    roles: [Dispatcher]
    code: 201
    input: []
    output: PickupRequest
    side_effects: ["create PickupRequest (REQUESTED) stamped from plan; plan.next_pickup_date advanced by one cadence step"]

  # ---- Test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; the clock never falls back to wall-clock time. All deadline/expiry/year rules read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or entity-backed ownership mismatch"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, bad enum, numeric out of range, or window_end <= window_start"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "referenced CharityPartner id does not exist"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "referenced Vehicle id does not exist"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "referenced Route id does not exist"
  - id: ERR_DONOR_NOT_FOUND
    http: 404
    condition: "referenced Donor id does not exist"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "referenced PickupRequest id does not exist"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "referenced DonationItem id does not exist"
  - id: ERR_RECEIPT_NOT_FOUND
    http: 404
    condition: "referenced DonationReceipt id does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "referenced HaulInvoice id does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "referenced RecurringPlan id does not exist"
  - id: ERR_REQUEST_INVALID_STATE
    http: 409
    condition: "pickup request not in a state that admits the transition (schedule/complete/no-show/cancel)"
  - id: ERR_ROUTE_INVALID_STATE
    http: 409
    condition: "route not in a state that admits open/close"
  - id: ERR_PLAN_INVALID_STATE
    http: 409
    condition: "recurring plan not in a state that admits pause/resume/cancel/generate"
  - id: ERR_RECEIPT_NOT_VOIDABLE
    http: 409
    condition: "donation receipt not in ISSUED state"
  - id: ERR_INVOICE_INVALID_STATE
    http: 409
    condition: "haul invoice not in INVOICED state for pay"
  - id: ERR_ROUTE_NOT_OPEN
    http: 409
    condition: "scheduling onto a route whose status is not OPEN"
  - id: ERR_VEHICLE_OUT_OF_SERVICE
    http: 409
    condition: "opening a route on a vehicle whose status is OUT_OF_SERVICE"
  - id: ERR_PARTNER_SUSPENDED
    http: 409
    condition: "resuming a plan whose CharityPartner is SUSPENDED"
  - id: ERR_ROUTE_WINDOW_CONFLICT
    http: 409
    condition: "new route window overlaps an existing non-CLOSED route on the same vehicle+date"
  - id: ERR_NO_ITEMS
    http: 422
    condition: "scheduling a request with zero DonationItems"
  - id: ERR_PORCH_ATTESTATION_REQUIRED
    http: 422
    condition: "UNATTENDED request missing porch_photo_url or safety_attestation at schedule"
  - id: ERR_CATEGORY_NOT_ACCEPTED
    http: 422
    condition: "DONATION request contains an item category not in partner.accepted_categories"
  - id: ERR_DONATION_OVER_LIMIT
    http: 422
    condition: "DONATION request declared_volume_cf exceeds DONATION_MAX_CF (50)"
  - id: ERR_SLOT_OUTSIDE_WINDOW
    http: 422
    condition: "stop slot falls outside the route window or slot_end <= slot_start"
  - id: ERR_STOP_SLOT_CONFLICT
    http: 409
    condition: "stop slot within TRAVEL_BUFFER_MIN (15 min) of another stop on the route"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "route reserved_volume_cf + request declared_volume_cf exceeds vehicle capacity_cf"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_route_version does not match the route's current version"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register as a donor"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["POST /donors"]
  - name: Donor
    description: "Owns pickup requests, items, recurring plans; pays own invoices"
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "POST /pickup-requests"
      - "POST /pickup-requests/{id}/items"
      - "POST /pickup-requests/{id}/cancel"
      - "POST /haul-invoices/{id}/pay"
      - "POST /recurring-plans"
      - "POST /recurring-plans/{id}/pause"
      - "POST /recurring-plans/{id}/resume"
      - "POST /recurring-plans/{id}/cancel"
    shared_operations: ["GET reads"]
  - name: Dispatcher
    description: "Manages routes and scheduling; generates recurring pickups"
    identity: "opaque"
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/open"
      - "POST /routes/{id}/close"
      - "POST /pickup-requests/{id}/schedule"
      - "POST /recurring-plans/{id}/generate"
    shared_operations: ["GET reads"]
  - name: Driver
    description: "Services pickups in the field: appraises items, completes, marks no-show"
    identity: "opaque"
    exclusive_operations:
      - "POST /pickup-requests/{id}/complete"
      - "POST /pickup-requests/{id}/no-show"
      - "PATCH /donation-items/{id}"
    shared_operations: ["GET reads"]
  - name: PartnerAdmin
    description: "Manages a charity partner's configuration and voids its receipts"
    identity: "entity_backed:CharityPartner"
    exclusive_operations:
      - "POST /donation-receipts/{id}/void"
    shared_operations: ["PATCH /partners/{id}", "GET reads"]
  - name: PlatformAdmin
