  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: complaint_removal_recall_cascades_through_lot_allocation_order_and_material
        grounds:
          - state_machines.Complaint.TRIAGED_to_FIELD_ACTION_DECIDED
          - state_machines.ReagentLot.RELEASED_to_RECALLED
          - state_machines.Allocation.RESERVED_to_QUARANTINED
          - state_machines.DistributionOrder.ALLOCATED_to_PARTIALLY_ALLOCATED
          - state_machines.MaterialLot.QUALIFIED_to_QUARANTINED
          - state_machines.ProductSpecification.CLEARED_to_WITHDRAWN
          - calculations.reagent_lot_unit_conservation
        distinguishing_aspect: |
          ONE request — the REMOVAL field action — propagates four hops away from
          the Complaint: hop 2 recalls the ReagentLot and blocks it, hop 3
          quarantines its RESERVED Allocation, hop 4 recomputes the parent
          DistributionOrder and drops it to PARTIALLY_ALLOCATED, and the REMOVAL-only
          hop 3b quarantines the CRITICAL raw MaterialLot two aggregates upstream,
          while the product itself is withdrawn. Five entities the request never
          named change state.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z and advanced through fill, allocation and intake."
            - "One CRITICAL ANTIBODY MaterialSpecification AB-CD19 (is_critical true) with one QUALIFIED MaterialLot of 1000.00 units."
            - "One CLEARED ProductSpecification IVD-RCL-1 with a complete four-record design trace, release_test_codes [ACTIVITY], shelf_life_months_claim 12."
            - "One RELEASED + AVAILABLE ReagentLot RCL-LOT-1: 300 units filled at 2026-08-10T10:00:00Z from a 250.00-unit component of the critical material, released by qa-01, bridging_required false because it is the first released lot of the product."
            - "One ALLOCATED DistributionOrder for 200 units with a single RESERVED Allocation of 200 units drawn from that lot at 2026-09-01T00:00:00Z."
            - "One TRIAGED Complaint on that lot with severity HIGH and malfunction_suspected true, received 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
