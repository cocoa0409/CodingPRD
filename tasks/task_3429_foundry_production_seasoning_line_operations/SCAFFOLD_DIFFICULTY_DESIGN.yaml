          Resource: the single seasoning oven OVEN_1. Interval semantics:
          aggregate capacity — overlapping bake windows are ALLOWED as long as
          the summed unit_count of all batches whose windows overlap never
          exceeds 12; here 5 + 7 = 12 succeeds at the boundary while adding a
