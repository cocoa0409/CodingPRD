            - call: "POST /mkt/workers"
              payload: { display_name: "W2 Risk", country: "US" }
              as: Anonymous
              captures: { w2: $.data.id }
            - call: "POST /mkt/workers"
              payload: { display_name: "W3 Risk", country: "US" }
              as: Anonymous
              captures: { w3: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
