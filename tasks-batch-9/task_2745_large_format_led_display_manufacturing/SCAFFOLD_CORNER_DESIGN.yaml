      - name: spare_requirement_ceils_every_fraction_of_a_module
        claim_type: constants_applied
        grounds:
          - calculations.service_contract_spare_requirement
          - calculations.service_contract_annual_fee_cents
          - entities.ServiceContract.fields.spare_required_count
        distinguishing_aspect: |
          spare_pct_bp is basis points over the project's module_count and the
          result is a CEIL, so any non-zero fraction buys a whole spare module:
          16 modules at 200 bp is 0.32 modules and still requires 1. The ceil must
          not over-count an exact integer — 625 bp is exactly 1.0000 and still
          requires 1, while one more basis point (1.0016) requires 2. The spare
          count then feeds the fee through SPARE_CARRY_COST_CENTS, so the ceil is
          visible twice in one response.
        test_recipe:
          setup:
            - "One FP25-OUT DisplayModel and three identical 2x2 projects, each with module_count 16 and total_area_sqm 0.8192."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP25-OUT", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 4, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Spare Ceil One", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 2, cabinet_grid_rows: 2, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj1: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Spare Ceil Two", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 2, cabinet_grid_rows: 2, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj2: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Spare Ceil Three", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 2, cabinet_grid_rows: 2, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj3: $.data.id }
          trigger:
            - call: "POST /service-contracts"
              payload: { project_id: "${pj1}", tier: "SILVER", spare_pct_bp: 200, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "POST /service-contracts"
              payload: { project_id: "${pj2}", tier: "SILVER", spare_pct_bp: 625, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "POST /service-contracts"
              payload: { project_id: "${pj3}", tier: "SILVER", spare_pct_bp: 626, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
          assert:
            - "trigger call 1 -> 201: spare_required_count == 1   # 16 x 200 / 10000 = 0.32 -> ceil 1, not 0"
            - "trigger call 2 -> 201: spare_required_count == 1   # 16 x 625 / 10000 = 1.0000 exactly -> ceil 1, not 2"
            - "trigger call 3 -> 201: spare_required_count == 2   # 16 x 626 / 10000 = 1.0016 -> ceil 2"
            - "trigger call 1: gross_fee_cents == 155648 (round(0.8192 x 190000)), subtotal_fee_cents == 160148 (+ 1 x 4500), volume_discount_pct == 0.00, annual_fee_cents == 160148"
            - "trigger call 3: subtotal_fee_cents == 164648 (+ 2 x 4500) and annual_fee_cents == 164648"
            - "all three: contract_state == PENDING, spare_reserved_count == 0, sla_breach_count == 0, warranty_start_at is null, response_hours == 24"

      - name: data_load_pct_floors_the_capacity_then_rounds_half_up
        claim_type: precision
        grounds:
          - calculations.project_data_load_pct
          - entities.DisplayProject.fields.effective_capacity_mbps
          - entities.DisplayProject.fields.data_load_pct
        distinguishing_aspect: |
          Two roundings with opposite directions sit next to each other. The port
          capacity is FLOORED after the redundancy derate — 3 x 333 x 0.5 = 499.5
          becomes 499 mbps, not 500 and not 499.5 — and the resulting percentage is
          then rounded HALF UP at two decimals, so 2 / 320 x 100 = 0.625 becomes
          0.63 rather than banker's-rounding down to 0.62. Getting either direction
          wrong is invisible at generous capacities and only shows on these values.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel (1024 pixels per cabinet); required_data_mbps for a 1x1 project is ceil(1024 x 10 x 3 x 60 / 1e6) = ceil(1.8432) = 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Half Up Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 320, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
            - call: "POST /projects"
              payload: { customer_name: "Floored Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "HOT_BACKUP", output_port_count: 3, port_bandwidth_mbps: 333, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
          assert:
            - "trigger call 1 -> 201: required_data_mbps == 2, effective_capacity_mbps == 320, data_load_pct == 0.63   # 0.625 rounds HALF UP"
            - "trigger call 1: data_load_pct != 0.62   # not banker's rounding, not truncation"
            - "trigger call 2 -> 201: effective_capacity_mbps == 499   # floor(3 x 333 x 0.5) = floor(499.5), not 500"
            - "trigger call 2: data_load_pct == 0.40   # 2 / 499 x 100 = 0.400801..."
            - "both projects: engineering_state == DRAFT and production_state == NOT_STARTED"

      - name: spare_reservation_skips_uncalibrated_and_foreign_modules
        claim_type: input_set_filtering
        grounds:
          - calculations.spare_module_selector
          - endpoints."POST /service-contracts/{service_contract_id}/spare-reservations"
          - entities.Module.fields.reserved_service_contract_id
        distinguishing_aspect: |
          The auto-pick has a four-clause eligibility filter and then an inverted
          ranking. Only CALIBRATED modules of the contract's own display model with
          no existing reservation may be chosen, so a MANUFACTURED, a PIXEL_TESTED,
          a REWORK and a same-bin module of a DIFFERENT model must all be passed
