  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: letter_windows_half_open_touching_allowed_overlap_rejected
        grounds:
          - validations[priority=19].ERR_LOA_PERIOD_OVERLAP
          - entities.AuthorizationLetter.fields.effective_from
          - entities.AuthorizationLetter.fields.effective_to
          - endpoints["POST /authorization-letters"]
        distinguishing_aspect: |
          Resource = the (member, distributor) authorization slot, and the
          semantics are HALF-OPEN [from, to): a new letter starting at the exact
          instant an existing letter ends is accepted, while starting one
          millisecond earlier is rejected. The scope of the check also spans
          SUBMITTED letters, not just ACTIVE ones, so the second (uncountersigned)
          letter still blocks the third.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributor METRO-01 ACTIVE, Member Harbor Grill (PENDING is fine — the overlap rule does not read enrollment_status)."
            - "Letter L1 for 2026-01-01T00:00:00.000Z .. 2027-01-01T00:00:00.000Z has been countersigned, so it is ACTIVE."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2027-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2027-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_ONLY" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa2_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-12-31T23:59:59.999Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_ONLY" }
              as: MemberOperator
              as_user_id: "${m1_id}"
          assert:
            - "the touching letter is created: 201, AuthorizationLetter.${loa2_id}.status == SUBMITTED, effective_from == 2027-01-01T00:00:00.000Z"
            - "Member.${m1_id}.active_letter_count == 1 — a SUBMITTED letter does not increment the active counter"
            - "the one-millisecond-earlier letter returns 409 with error_id == ERR_LOA_PERIOD_OVERLAP"
            - "the rejected request created nothing: GET /authorization-letters?member_id=${m1_id} still returns exactly 2 rows"
            - "the same rejection occurs against ${loa2_id} alone (a SUBMITTED letter is in scope), and a window of 2028-01-01T00:00:00.000Z .. 2029-01-01T00:00:00.000Z is accepted"

      - name: rate_card_windows_closed_interval_touching_date_rejected
        grounds:
          - validations[priority=20].ERR_RATE_CARD_PERIOD_OVERLAP
          - entities.RateCard.fields.effective_from
          - entities.RateCard.fields.effective_to
          - concurrency_rules.rate-card-create-stale-item
          - endpoints["POST /rate-cards"]
        distinguishing_aspect: |
          Resource = the rate slot on one ContractedItem, and the semantics are
          the OPPOSITE of the letter rule: CLOSED intervals, so two cards that
          merely touch on the single calendar date 2026-06-30 DO collide and the
          second is rejected, while 2026-07-01 is accepted. The two temporal rules
          therefore cannot share an implementation. Each attempt also has to carry
          a fresh expected_contracted_item_version, and a rejected attempt must
          not consume one.
        test_recipe:
          setup:
            - "ProgramTier ELITE and Deal PBC-2026 in DRAFT (rate cards may be filed on a DRAFT deal)."
            - "ContractedItem BEEF-PATTY-4OZ-CS40 exists under that deal."
            - "Card C1 covering 2026-01-01 .. 2026-06-30 has been created and APPROVED, so the item's approved_rate_card_count is 1 and its version has moved past the create."
            - "The item's current version is re-read immediately before the two attempts so the OCC token is fresh."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2026-06-30" }
              as: GpoAdmin
              captures: { rc1_id: $.data.id }
            - call: "POST /rate-cards/${rc1_id}/approve"
              as: GpoAdmin
            - call: "GET /contracted-items/${item_id}"
              as: GpoAdmin
              captures: { item_v2: $.data.version }
          trigger:
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v2}", rate_type: "PER_CASE", flat_rate_cents_per_case: 180, effective_from: "2026-06-30", effective_to: "2026-12-31" }
              as: GpoAdmin
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v2}", rate_type: "PER_CASE", flat_rate_cents_per_case: 180, effective_from: "2026-07-01", effective_to: "2026-12-31" }
              as: GpoAdmin
              captures: { rc2_id: $.data.id }
          assert:
            - "the 2026-06-30 attempt returns 409 with error_id == ERR_RATE_CARD_PERIOD_OVERLAP (closed intervals: touching on one date IS an overlap)"
            - "that rejection did NOT bump the parent: ContractedItem.${item_id}.version is still ${item_v2}, which is why the very next call can reuse the same token"
            - "the 2026-07-01 attempt returns 201 with RateCard.${rc2_id}.status == PROPOSED and effective_from == 2026-07-01"
            - "the successful create incremented ContractedItem.${item_id}.version by exactly 1 above ${item_v2}"
            - "GET /rate-cards?contracted_item_id=${item_id} returns exactly 2 rows; RateCard.${rc1_id}.status is still APPROVED"
            - "a third attempt for 2026-06-01 .. 2026-06-15 (fully inside C1) is also rejected with ERR_RATE_CARD_PERIOD_OVERLAP, while the same window with supersede == true skips rule 20 and instead exercises the incumbent check at priority 21"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: money_triple_reconciles_to_gross_after_dispute_reversal
        grounds:
          - calculations.rebate_split
          - state_machines.RebateAccrual.DISPUTED_to_REVERSED
          - entities.Member.fields.accrued_member_share_cents
          - entities.Member.fields.attributed_gpo_retention_cents
          - entities.Member.fields.attributed_admin_fee_cents
          - endpoints["POST /disputes/{dispute_id}/decide"]
        distinguishing_aspect: |
          Invariant = the money triple: for every member, accrued_member_share +
          attributed_gpo_retention + attributed_admin_fee must equal the sum of
          gross_rebate_cents over that member's non-REVERSED accruals, to the
          cent. It holds at 10500 after accrual and at exactly 6000 after one
          4500-cent accrual is reversed, which is only possible because the
          reversal subtracts the three stored components (3274 / 1091 / 135)
          rather than recomputing 75% of a rounded total.
        test_recipe:
          setup:
            - "ProgramTier ELITE with reversal_posture_limit 1, Distributor METRO-01, Member Harbor Grill ACTIVE, Deal PBC-2026 ACTIVE with an APPROVED PER_CASE 150 cents/case card."
            - "June batch ACCRUED with accruals of gross 4500 (fee 135, share 3274, retention 1091) and 6000 (fee 180, share 4365, retention 1455)."
            - "Member counters: 7639 / 2546 / 315, which already sum to 10500."
            - "The member disputes the 4500-cent accrual for 3274 cents; the dispute is OPEN."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 40, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8540, invoice_date: "2026-06-18" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /purchase-batches/${b1_id}/normalize"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches/${b1_id}/accrue"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "GET /accruals"
              payload: { purchase_line_id: "${l1_id}" }
              as: RebateAnalyst
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /accruals"
              payload: { purchase_line_id: "${l2_id}" }
              as: RebateAnalyst
              captures: { a2_id: "$.data[0].id" }
            - call: "POST /disputes"
              payload: { accrual_id: "${a1_id}", reason_code: "CASES_OVERSTATED", disputed_amount_cents: 3274 }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /disputes/${d1_id}/decide"
              payload: { decision: "UPHOLD", decision_note: "Cases restated from 30 to 24" }
              as: DisputeArbiter
              as_user_id: "arbiter-01"
          assert:
            - "before the trigger: 7639 + 2546 + 315 == 10500 == 4500 + 6000 (both accruals non-REVERSED)"
            - "after the trigger: Member.${m1_id}.accrued_member_share_cents 4365 + attributed_gpo_retention_cents 1455 + attributed_admin_fee_cents 180 == 6000"
            - "6000 equals the sum of gross_rebate_cents over the member's non-REVERSED accruals — i.e. RebateAccrual.${a2_id} alone"
            - "RebateAccrual.${a1_id}.status == REVERSED and its own gross_rebate_cents / member_share_cents / gpo_retention_cents / admin_fee_cents are unchanged at 4500 / 3274 / 1091 / 135"
            - "no counter went negative and none was recomputed as a percentage of a total: 7639 - 3274 == 4365 exactly, and re-deriving 75% of the remaining net (5820) also yields 4365, so the two routes must agree here"
            - "GET /members/${m1_id}/savings-report for 2026-06-01..2026-06-30 reports rebate_member_share_cents == 4365, consistent with the ledger"

      - name: case_conservation_survives_normalize_accrue_and_renormalize
        grounds:
          - entities.PurchaseBatch.fields.total_cases_ingested
          - entities.PurchaseBatch.fields.matched_cases
          - entities.PurchaseBatch.fields.unmatched_cases
          - state_machines.PurchaseBatch.ACCRUED_to_RECEIVED
          - state_machines.RebateAccrual.ACCRUED_to_REVERSED
          - endpoints["POST /purchase-batches/{batch_id}/renormalize"]
        distinguishing_aspect: |
          Invariant = case conservation, a non-money counterpart to the ledger
          invariant: total_cases_ingested == matched_cases + unmatched_cases must
          hold after EVERY operation, and total_cases_ingested (90) must never be
          recomputed by any of them. The compensating renormalize drives matched
          from 70 back to 0 and unmatched from 20 to 90 while simultaneously
          reversing both accruals and returning all three member money counters to
          0, so both invariants close in the same call.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributor METRO-01, Member Harbor Grill ACTIVE, Deal PBC-2026 ACTIVE with an APPROVED PER_CASE 150 card on BEEF-PATTY-4OZ-CS40."
