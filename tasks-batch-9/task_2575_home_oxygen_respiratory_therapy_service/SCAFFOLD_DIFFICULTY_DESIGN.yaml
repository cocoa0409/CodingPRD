          assert:
            - "Before the trigger: RentalContract.${c_id}.lifetime_paid_cents == 0 AND posted_month_count == 0 AND posted_months is empty AND last_posted_service_month == null"
            - "After the post: lifetime_paid_cents == 6913 AND posted_month_count == 1 AND last_posted_service_month == \"2026-08\" AND posted_months has one element with service_month \"2026-08\", amount_cents 6913 and days_in_service 31"
            - "days_in_service is 31 because the contract entered IN_SERVICE on day 1 of a 31-day month: 31 - 1 + 1 == 31, so the prorated amount equals the full monthly_allowable_cents"
            - "After the reverse: lifetime_paid_cents == 0 exactly AND posted_month_count == 0 AND posted_months is empty AND last_posted_service_month == null AND billing_status == ACCRUING"
            - "monthly_allowable_cents stays 6913 across post and reverse — reversing a month never re-prices the equipment"
            - "The re-post of the same month succeeds (no ERR_SERVICE_MONTH_ALREADY_POSTED) and lands lifetime_paid_cents back on exactly 6913, so the ledger is idempotent across a post/reverse/post cycle with zero drift"
            - "Placement.${pl_stat}.status and Placement.${pl_port}.status are PLACED throughout, and EquipmentUnit.${u_stat}/${u_port} stay DEPLOYED: the money compensation touches no equipment state"
