# =============================================================================
# Last-Mile Delivery Route Optimization — benchmark seed tables (v1)
# =============================================================================

scenario: "Last-Mile Delivery Route Optimization (UPS/FedEx style): route planning, signature requirement, time windows, redelivery, transit center sorting, customer appointment adjustment, Driver Release authorization, Hazmat"

domain_name: last-mile-delivery-routing
api_prefix: /delivery

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities (Parcel, DeliveryRoute, DeliveryStop, Driver, TransitCenter,
  # DeliveryAttempt, Appointment) linked by foreign keys, addressed by their
  # own collection paths — no deep URL nesting.

  state_machine_shape: branching
  # DeliveryStop forks at the attempt: ATTEMPTED -> {DELIVERED | REDELIVERY_SCHEDULED};
  # REDELIVERY_SCHEDULED -> OUT_FOR_DELIVERY is a revision loop (cyclic).

  relationship_patterns:
    - one_to_many   # DeliveryRoute -> DeliveryStop ; DeliveryStop -> DeliveryAttempt
    - cross_aggregate  # DeliveryStop references Parcel + DeliveryRoute across aggregates

  role_model: peer_roles
  # DispatchManager owns routes; SortAssociate owns transit-center sorting;
  # Driver executes assigned stops; CustomerServiceAgent adjusts appointments.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity Relationship Table
# =============================================================================
entities:
  - name: TransitCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Transit center / hub name" }
      - { name: hazmat_certified, type: boolean, source: input, default: false, description: "Whether this hub may sort Hazmat parcels" }
      - { name: sort_capacity, type: integer, source: input, description: "Maximum number of parcels this hub may hold in SORTED state at once; must be >= 1" }
      - { name: sorted_count, type: integer, source: computed, default: 0, description: "Read-only count of Parcels currently in SORTED state whose sorted_at_center_id == this center" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED; CLOSED hubs reject new sorting" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Driver full name" }
      - { name: hazmat_certified, type: boolean, source: input, default: false, description: "Whether driver may carry Hazmat parcels" }
      - { name: vehicle_capacity_kg, type: number, source: input, description: "Maximum total parcel weight the driver's vehicle may carry; must be > 0" }
      - { name: failure_points, type: number, source: computed, default: 0, description: "Read-only running service-failure score; starts at 0, accrues on failed delivery attempts, decays on successful redelivery (see calculations.service_failure_score)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED drivers cannot be assigned to routes" }

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - { name: tracking_code, type: string, source: input, description: "Unique human tracking code; uniqueness enforced (ERR_DUPLICATE_TRACKING_CODE)" }
      - { name: weight_kg, type: number, source: input, description: "Parcel weight in kilograms; must be > 0" }
      - { name: service_level, type: enum, source: input, default: GROUND, description: "GROUND | EXPRESS | PRIORITY; affects redelivery surcharge tier" }
      - { name: signature_required, type: boolean, source: input, default: false, description: "Whether a recipient signature is required to mark DELIVERED" }
      - { name: hazmat_class, type: enum, source: input, default: NONE, description: "NONE | CLASS_3 | CLASS_8; non-NONE requires hazmat-certified hub and driver" }
      - { name: driver_release_authorized, type: boolean, source: input, default: false, description: "Whether shipper pre-authorized Driver Release (leave without signature); forbidden when signature_required and hazmat_class are both restrictive — see validations" }
      - { name: sorted_at_center_id, type: string, source: computed, description: "FK -> TransitCenter.id; set when parcel is SORTED, cleared (null) if route is unassigned back; null until sorted" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | SORTED | ROUTED | DELIVERED | RETURNED" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; the driver who will execute this route" }
      - { name: origin_center_id, type: string, source: input, description: "FK -> TransitCenter.id; hub the route departs from" }
      - { name: service_date, type: string, source: input, description: "Delivery date in YYYY-MM-DD" }
      - { name: max_stops, type: integer, source: input, description: "Maximum number of DeliveryStops this route may hold; must be >= 1" }
      - { name: planned_weight_kg, type: number, source: computed, default: 0, description: "Read-only sum of Parcel.weight_kg over all non-cancelled stops (PENDING|OUT_FOR_DELIVERY|ATTEMPTED|REDELIVERY_SCHEDULED|DELIVERED); see calculations.route_load_metrics" }
      - { name: committed_weight_kg, type: number, source: computed, default: 0, description: "Read-only sum of Parcel.weight_kg over stops still owing delivery (PENDING|OUT_FOR_DELIVERY|ATTEMPTED|REDELIVERY_SCHEDULED); excludes DELIVERED/FAILED; see calculations.route_load_metrics" }
      - { name: stop_count, type: integer, source: computed, default: 0, description: "Read-only count of non-CANCELLED DeliveryStops on this route" }
      - { name: status, type: enum, source: system, default: PLANNING, description: "PLANNING | DISPATCHED | COMPLETED | CANCELLED" }

  - name: DeliveryStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id; the route this stop belongs to" }
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; the parcel to deliver at this stop" }
      - { name: sequence, type: integer, source: input, description: "Stop ordering index on the route; must be >= 1; unique within a route among non-CANCELLED stops" }
      - { name: window_start_min, type: integer, source: input, description: "Time-window open, minutes from midnight local; 0..1440" }
      - { name: window_end_min, type: integer, source: input, description: "Time-window close, minutes from midnight local; must be > window_start_min and <= 1440" }
      - { name: attempt_count, type: integer, source: computed, default: 0, description: "Read-only count of DeliveryAttempt records for this stop" }
      - { name: redelivery_fee_cents, type: integer, source: computed, default: 0, description: "Read-only accumulated redelivery surcharge in cents; see calculations.redelivery_surcharge" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | OUT_FOR_DELIVERY | ATTEMPTED | DELIVERED | REDELIVERY_SCHEDULED | FAILED | CANCELLED" }

  - name: DeliveryAttempt
    parent: null
    common_fields: false  # append-only event; carries id + created_at only
    fields:
      - { name: stop_id, type: string, source: input, description: "FK -> DeliveryStop.id; the stop this attempt records" }
      - { name: outcome, type: enum, source: input, description: "DELIVERED | NO_ONE_HOME | REFUSED | ADDRESS_ISSUE" }
      - { name: signature_name, type: string, source: input, required: false, description: "Recipient signature captured at the door; required when parcel.signature_required and outcome==DELIVERED unless driver release used" }
      - { name: used_driver_release, type: boolean, source: input, default: false, description: "Whether the driver left the parcel via Driver Release authorization instead of obtaining a signature" }
      - { name: attempt_index, type: integer, source: computed, description: "Read-only 1-based ordinal of this attempt on its stop (chronological by created_at)" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: input, description: "FK -> DeliveryStop.id; the stop whose window this appointment adjusts" }
      - { name: requested_start_min, type: integer, source: input, description: "Requested new window open, minutes from midnight; 0..1440" }
      - { name: requested_end_min, type: integer, source: input, description: "Requested new window close, minutes from midnight; must be > requested_start_min and <= 1440" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPLIED | REJECTED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Parcel
    initial_state: RECEIVED
    terminal_states: [DELIVERED, RETURNED]
    transitions:
      - from: RECEIVED
        to: SORTED
        trigger: "POST /delivery/parcels/{parcelId}/sort"
        actor: SortAssociate
        preconditions:
          - "Parcel must be in RECEIVED state (ERR_PARCEL_NOT_RECEIVED)"
          - "Target TransitCenter must be OPEN (ERR_CENTER_CLOSED)"
          - "If parcel.hazmat_class != NONE, the center.hazmat_certified must be true (ERR_HAZMAT_HUB_NOT_CERTIFIED)"
          - "center.sorted_count must be < center.sort_capacity (ERR_SORT_CAPACITY_EXCEEDED)"
        side_effects:
          - "parcel.sorted_at_center_id = target center id"
          - "target center.sorted_count += 1 (recompute per calculations.center_sorted_count)"
      - from: SORTED
        to: ROUTED
        trigger: "POST /delivery/stops (creating a DeliveryStop referencing this parcel)"
        actor: DispatchManager
        preconditions:
          - "Parcel must be in SORTED state (ERR_PARCEL_NOT_SORTED)"
        side_effects:
          - "origin center.sorted_count -= 1 (recompute per calculations.center_sorted_count)"
      - from: ROUTED
        to: DELIVERED
        trigger: "system (automatic when the stop's terminal DELIVERED attempt is logged)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ROUTED
        to: RETURNED
        trigger: "system (automatic when the stop reaches FAILED after exhausting redelivery)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeliveryRoute
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: DISPATCHED
        trigger: "POST /delivery/routes/{routeId}/dispatch"
        actor: DispatchManager
        preconditions:
          - "Route must be in PLANNING (ERR_ROUTE_NOT_PLANNING)"
          - "Route must have at least one non-CANCELLED stop (ERR_ROUTE_EMPTY)"
          - "driver.status must be ACTIVE (ERR_DRIVER_SUSPENDED)"
          - "committed_weight_kg must be <= driver.vehicle_capacity_kg (ERR_VEHICLE_CAPACITY_EXCEEDED)"
          - "If any stop's parcel.hazmat_class != NONE, driver.hazmat_certified must be true (ERR_DRIVER_NOT_HAZMAT_CERTIFIED)"
          - "Driver must not already have another DISPATCHED route on the same service_date (ERR_DRIVER_DOUBLE_BOOKED); whole-day exclusive occupation, exact service_date equality"
          - "expected_route_version must equal route.version (ERR_STALE_ROUTE_VERSION)"
        side_effects:
          - "All PENDING stops -> OUT_FOR_DELIVERY"
          - "increments DeliveryRoute.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /delivery/routes/{routeId}/complete"
        actor: DispatchManager
        preconditions:
          - "Route must be in DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
          - "No stop may be in OUT_FOR_DELIVERY, ATTEMPTED, or REDELIVERY_SCHEDULED (ERR_OPEN_STOPS_REMAIN)"
        side_effects: []
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /delivery/routes/{routeId}/cancel"
        actor: DispatchManager
        preconditions:
          - "Route must be in PLANNING (ERR_ROUTE_NOT_CANCELLABLE)"
        side_effects:
          - "All non-CANCELLED stops -> CANCELLED (cascade down)"
          - "Each cascaded stop: its parcel reverts ROUTED -> SORTED, parcel.sorted_at_center_id restored to route.origin_center_id, origin center.sorted_count += 1 (recompute)"

  - entity: DeliveryStop
    initial_state: PENDING
    terminal_states: [DELIVERED, FAILED, CANCELLED]
    transitions:
      - from: PENDING
        to: OUT_FOR_DELIVERY
        trigger: "system (automatic when parent route is dispatched)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: ATTEMPTED
        trigger: "POST /delivery/stops/{stopId}/attempts (non-DELIVERED outcome)"
        actor: Driver
        preconditions:
          - "Stop must be in OUT_FOR_DELIVERY or REDELIVERY_SCHEDULED (ERR_STOP_NOT_OUT_FOR_DELIVERY)"
        side_effects:
          - "Append DeliveryAttempt; stop.attempt_count = number of attempts (recompute per calculations.stop_attempt_count)"
          - "driver.failure_points += per-attempt penalty (recompute per calculations.service_failure_score)"
      - from: REDELIVERY_SCHEDULED
        to: ATTEMPTED
        trigger: "POST /delivery/stops/{stopId}/attempts (non-DELIVERED outcome)"
        actor: Driver
        preconditions:
          - "Stop must be in OUT_FOR_DELIVERY or REDELIVERY_SCHEDULED (ERR_STOP_NOT_OUT_FOR_DELIVERY)"
        side_effects:
          - "Append DeliveryAttempt; stop.attempt_count recompute"
          - "driver.failure_points += per-attempt penalty (recompute per calculations.service_failure_score)"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /delivery/stops/{stopId}/attempts (DELIVERED outcome)"
        actor: Driver
        preconditions:
          - "Stop must be in OUT_FOR_DELIVERY or REDELIVERY_SCHEDULED (ERR_STOP_NOT_OUT_FOR_DELIVERY)"
          - "If parcel.signature_required and not used_driver_release, signature_name must be present (ERR_SIGNATURE_REQUIRED)"
          - "used_driver_release true requires parcel.driver_release_authorized true (ERR_DRIVER_RELEASE_NOT_AUTHORIZED)"
        side_effects:
          - "Append DeliveryAttempt (cross-entity); parcel ROUTED -> DELIVERED (cascade)"
      - from: REDELIVERY_SCHEDULED
        to: DELIVERED
        trigger: "POST /delivery/stops/{stopId}/attempts (DELIVERED outcome)"
        actor: Driver
        preconditions:
          - "Stop must be in OUT_FOR_DELIVERY or REDELIVERY_SCHEDULED (ERR_STOP_NOT_OUT_FOR_DELIVERY)"
          - "If parcel.signature_required and not used_driver_release, signature_name must be present (ERR_SIGNATURE_REQUIRED)"
          - "used_driver_release true requires parcel.driver_release_authorized true (ERR_DRIVER_RELEASE_NOT_AUTHORIZED)"
        side_effects:
          - "Append DeliveryAttempt; parcel ROUTED -> DELIVERED (cascade)"
          - "driver.failure_points -= REDELIVERY_RECOVERY_CREDIT, floored at 0 (recompute per calculations.service_failure_score)"
      - from: ATTEMPTED
        to: REDELIVERY_SCHEDULED
        trigger: "POST /delivery/stops/{stopId}/reschedule"
        actor: DispatchManager
        preconditions:
          - "Stop must be in ATTEMPTED (ERR_STOP_NOT_ATTEMPTED)"
          - "stop.attempt_count must be < MAX_ATTEMPTS (ERR_MAX_ATTEMPTS_REACHED)"
        side_effects:
          - "Recompute stop.redelivery_fee_cents (calculations.redelivery_surcharge)"
      - from: ATTEMPTED
        to: FAILED
        trigger: "POST /delivery/stops/{stopId}/reschedule"
        actor: DispatchManager
        preconditions:
          - "Stop must be in ATTEMPTED (ERR_STOP_NOT_ATTEMPTED)"
        note: "When stop.attempt_count >= MAX_ATTEMPTS, reschedule drives FAILED instead of REDELIVERY_SCHEDULED (branch on attempt_count)."
        side_effects:
          - "parcel ROUTED -> RETURNED (cascade); driver.failure_points += RETURN_PENALTY (recompute)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /delivery/stops/{stopId}/cancel"
        actor: DispatchManager
        preconditions:
          - "Stop must be in PENDING (ERR_STOP_NOT_CANCELLABLE)"
        side_effects:
          - "parcel reverts ROUTED -> SORTED; parcel.sorted_at_center_id restored to route.origin_center_id; origin center.sorted_count += 1 (recompute)"

  - entity: Appointment
    initial_state: REQUESTED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPLIED
        trigger: "POST /delivery/appointments/{appointmentId}/apply"
        actor: CustomerServiceAgent
        preconditions:
          - "Appointment must be in REQUESTED (ERR_APPOINTMENT_NOT_REQUESTED)"
          - "Target stop must be in PENDING, OUT_FOR_DELIVERY, or REDELIVERY_SCHEDULED (ERR_STOP_WINDOW_LOCKED)"
          - "Requested window must not overlap another non-CANCELLED stop on the same route within the APPOINTMENT_BUFFER_MIN buffer (ERR_APPOINTMENT_WINDOW_CONFLICT)"
        side_effects:
          - "stop.window_start_min = appointment.requested_start_min; stop.window_end_min = appointment.requested_end_min (cross-entity)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /delivery/appointments/{appointmentId}/reject"
        actor: CustomerServiceAgent
        preconditions:
          - "Appointment must be in REQUESTED (ERR_APPOINTMENT_NOT_REQUESTED)"
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: route-dispatch-stale-version
    parent_entity: DeliveryRoute
    write_endpoint: "POST /delivery/routes/{routeId}/dispatch"
    occ_field: "expected_route_version"
    description: |
      Dispatching a DeliveryRoute whose version has advanced since the client
      last observed it is rejected. A route's version is bumped by every stop
      add/cancel and by appointment-applied window edits that mutate its stops;
      a dispatch carrying a stale expected_route_version reflects a planning
      view that no longer matches the route's committed load and stop set.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: route_load_metrics
    trigger: "Recomputed on stop create/cancel, route dispatch, and each delivery attempt that changes a stop's status"
    algorithm: aggregation
    formula: |
      For a DeliveryRoute R:
        planned_weight_kg   = SUM(parcel.weight_kg) over stops S where
                              S.route_id == R.id AND
                              S.status IN {PENDING, OUT_FOR_DELIVERY, ATTEMPTED,
                                           REDELIVERY_SCHEDULED, DELIVERED}
        committed_weight_kg = SUM(parcel.weight_kg) over stops S where
                              S.route_id == R.id AND
                              S.status IN {PENDING, OUT_FOR_DELIVERY, ATTEMPTED,
                                           REDELIVERY_SCHEDULED}
        stop_count          = COUNT(stops S where S.route_id == R.id AND
                                    S.status != CANCELLED)
      planned includes DELIVERED parcels (already on the truck this run);
      committed excludes DELIVERED and FAILED (no longer owing carriage).
    input_set: "Stops of the route filtered by the explicit status sets above; DELIVERED counts toward planned but not committed."
    precision: "weights summed as given; no rounding (kilograms, double precision)"
    variants:
      - name: planned_weight_kg
        when: "capacity-planning view; what was loaded for the run"
        difference: "includes DELIVERED stops"
      - name: committed_weight_kg
        when: "vehicle-capacity gate at dispatch and live owing-load view"
        difference: "excludes DELIVERED and FAILED stops; equals planned only before any delivery completes"

  - name: service_failure_score
    trigger: "Recomputed on every DeliveryAttempt append, on stop REDELIVERY_SCHEDULED->DELIVERED, and on stop ATTEMPTED->FAILED"
    algorithm: weighted_scoring
    formula: |
      For Driver D, failure_points is a running accumulator (starts at 0):
        On a non-DELIVERED attempt logged against a stop of D's route:
          base = ATTEMPT_PENALTY
          escalation = ATTEMPT_ESCALATION * (attempt_index - 1)   # 2nd attempt costs more than 1st
          hazmat_extra = HAZMAT_FAILURE_EXTRA if parcel.hazmat_class != NONE else 0
          failure_points += base + escalation + hazmat_extra
        On a successful redelivery (REDELIVERY_SCHEDULED -> DELIVERED):
          failure_points -= REDELIVERY_RECOVERY_CREDIT      # reward for recovering
        On a stop driven to FAILED (returns to hub):
          failure_points += RETURN_PENALTY
      failure_points is floored at 0 (never negative) and is NOT capped above.
    input_set: "Per-driver accumulator updated transactionally with each triggering transition; attempt_index is the 1-based ordinal of the triggering attempt on its stop."
    constants:
      ATTEMPT_PENALTY: 10
      ATTEMPT_ESCALATION: 5
      HAZMAT_FAILURE_EXTRA: 8
      REDELIVERY_RECOVERY_CREDIT: 6
      RETURN_PENALTY: 20
    precision: "points are numbers; arithmetic exact; floor at 0"

  - name: redelivery_surcharge
    trigger: "Recomputed on stop ATTEMPTED -> REDELIVERY_SCHEDULED (reschedule)"
    algorithm: tiered_pricing
    formula: |
      redelivery_fee_cents accumulates a per-reschedule surcharge:
        tier_base = SERVICE_BASE[parcel.service_level]   # GROUND=300, EXPRESS=500, PRIORITY=800
        # attempt-escalation: nth reschedule (n = number of reschedules already
        # done on this stop, 0-based for the current one) escalates the base:
        escalated = tier_base + (ATTEMPT_STEP * reschedule_index)   # reschedule_index 0-based
        sig_extra = SIGNATURE_EXTRA if parcel.signature_required else 0
        hazmat_mult = HAZMAT_MULT if parcel.hazmat_class != NONE else 1.0
        this_surcharge_cents = round_half_up( (escalated + sig_extra) * hazmat_mult )
        redelivery_fee_cents += this_surcharge_cents
      reschedule_index = stop.attempt_count - 1 at the moment of reschedule
      (1st reschedule follows the 1st attempt -> reschedule_index 0).
    input_set: "Single stop; reads parcel.service_level, parcel.signature_required, parcel.hazmat_class, and the stop's pre-reschedule attempt_count."
    constants:
      SERVICE_BASE: { GROUND: 300, EXPRESS: 500, PRIORITY: 800 }
      ATTEMPT_STEP: 150
      SIGNATURE_EXTRA: 120
      HAZMAT_MULT: 1.5
      MAX_ATTEMPTS: 3   # reschedule for redelivery allowed while attempt_count < 3; at >= 3 reschedule drives FAILED
    precision: "round_half_up to whole cents AFTER multiplying (escalated+sig_extra) by hazmat_mult; the multiply-then-round order is pinned"
    variants:
      - name: cumulative_accrual
        when: "the pinned, authoritative behavior on DeliveryStop"
        difference: "each reschedule ADDS its escalated surcharge to redelivery_fee_cents; the field is a running total over all reschedules"
      - name: latest_only_rejected
        when: "the wrong interpretation a naive reader might pick"
        difference: "would OVERWRITE redelivery_fee_cents with only the latest reschedule's surcharge; produces a strictly smaller value once two reschedules occur — the scaffold pins cumulative_accrual"

  - name: sort_handling_fee
    trigger: "GET /delivery/routes/{routeId}/manifest (computed read; no persistence)"
    algorithm: aggregation
    formula: |
      For a route's manifest, the per-parcel handling fee is computed then summed.
      ORDER IS PINNED: round EACH parcel's fee to whole cents FIRST, THEN sum the
      rounded per-parcel fees (round-per-line-item, not sum-then-round).
        For each non-CANCELLED stop S on the route, with parcel P:
          raw = HANDLING_BASE_CENTS + P.weight_kg * PER_KG_CENTS
          line_fee_cents = round_half_up(raw)            # round per line item
        total_handling_fee_cents = SUM(line_fee_cents)   # then sum
      A sum-then-round implementation produces a different total at fractional
      half-cent boundaries; this scaffold pins round-then-sum.
    input_set: "All non-CANCELLED stops on the route, processed in ascending sequence (tie-break created_at ASC); order does not affect the sum but is pinned for determinism."
    constants:
      HANDLING_BASE_CENTS: 50
      PER_KG_CENTS: 12.5
    precision: "round_half_up per line item to whole cents, THEN sum (order pinned)"

  - name: center_sorted_count
    trigger: "Recomputed on parcel sort, stop create (parcel ROUTED), stop/route cancel (parcel reverts to SORTED)"
    algorithm: aggregation
    formula: |
      center.sorted_count = COUNT(Parcel P where P.status == SORTED AND
                                  P.sorted_at_center_id == center.id)
    input_set: "All parcels whose sorted_at_center_id equals this center and whose status is exactly SORTED."
    precision: "integer count"

  - name: stop_attempt_count
    trigger: "Recomputed on every DeliveryAttempt append"
    algorithm: aggregation
    formula: |
      stop.attempt_count = COUNT(DeliveryAttempt A where A.stop_id == stop.id)
      attempt_index of a newly appended attempt = stop.attempt_count after append.
    input_set: "All DeliveryAttempt rows for the stop."
    precision: "integer count"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path and required FK references in body must exist (validated left-to-right, path before body)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: "all endpoints referencing resources"

  - priority: 4
    category: business_constraint
    check: "Request body field types/ranges valid (weight_kg>0, window_end_min>window_start_min, sequence>=1, max_stops>=1, enum members valid)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

  - priority: 5
    category: business_constraint
    check: "Parcel.tracking_code must be unique across all parcels"
    error_id: ERR_DUPLICATE_TRACKING_CODE
    http_status: 409
    applies_to: "POST /delivery/parcels"

  - priority: 6
    category: state
    check: "Target resource must be in the correct state for the requested transition"
    error_id: "varies (ERR_PARCEL_NOT_RECEIVED, ERR_STOP_NOT_OUT_FOR_DELIVERY, ERR_ROUTE_NOT_PLANNING, ERR_APPOINTMENT_NOT_REQUESTED, etc.)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Hazmat parcel may only be SORTED at a hazmat-certified TransitCenter"
    error_id: ERR_HAZMAT_HUB_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /delivery/parcels/{parcelId}/sort"

  - priority: 8
    category: business_safety
    check: "A route carrying any Hazmat parcel may only be dispatched with a hazmat-certified driver"
    error_id: ERR_DRIVER_NOT_HAZMAT_CERTIFIED
    http_status: 409
    applies_to: "POST /delivery/routes/{routeId}/dispatch"

  - priority: 9
    category: business_safety
    check: "Driver Release (used_driver_release=true) requires parcel.driver_release_authorized=true"
    error_id: ERR_DRIVER_RELEASE_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /delivery/stops/{stopId}/attempts"

  - priority: 10
    category: business_safety
    check: "Signature-required parcel cannot be marked DELIVERED without signature_name unless Driver Release used"
    error_id: ERR_SIGNATURE_REQUIRED
    http_status: 409
    applies_to: "POST /delivery/stops/{stopId}/attempts"

  - priority: 11
    category: business_temporal
    check: "An applied appointment window must not overlap another non-CANCELLED stop's window on the same route within APPOINTMENT_BUFFER_MIN=30. Conflict iff (req_start < other_end + 30) AND (req_end + 30 > other_start) — buffered overlap, treating a gap < 30 min between adjacent windows as a conflict."
    error_id: ERR_APPOINTMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery/appointments/{appointmentId}/apply"

  - priority: 12
    category: business_constraint
    check: "A new/updated DeliveryStop sequence must be unique among non-CANCELLED stops of the route, and stop_count after add must not exceed route.max_stops"
    error_id: ERR_ROUTE_STOP_LIMIT
    http_status: 409
    applies_to: "POST /delivery/stops"

  - priority: 13
    category: business_constraint
    check: "Sorting a parcel into a center already at capacity is rejected (sorted_count >= sort_capacity)"
    error_id: ERR_SORT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery/parcels/{parcelId}/sort"

  - priority: 14
    category: business_temporal
    check: "Driver may not be dispatched onto two routes whose service_date is identical: a DISPATCHED route already exists for this driver on the same service_date. Whole-day exclusive occupation keyed on exact service_date string equality (distinct from the appointment buffered-minute overlap semantics)."
    error_id: ERR_DRIVER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /delivery/routes/{routeId}/dispatch"

  - priority: 15
    category: business_fiscal
    check: "Route committed_weight_kg must not exceed driver.vehicle_capacity_kg at dispatch"
    error_id: ERR_VEHICLE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery/routes/{routeId}/dispatch"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_route_version must equal route.version at dispatch"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /delivery/routes/{routeId}/dispatch"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- TransitCenter ---
  - method: POST
    path: "/delivery/transit-centers"
    description: "Create a transit center / sorting hub"
    roles: [DispatchManager]
    code: 201
    input: [name, "hazmat_certified?", sort_capacity]
    output: TransitCenter
    side_effects: ["status=OPEN", "sorted_count=0"]

  - method: GET
    path: "/delivery/transit-centers"
    description: "List transit centers"
    roles: [DispatchManager, SortAssociate, Driver, CustomerServiceAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "TransitCenter[]"
    side_effects: []

  - method: GET
    path: "/delivery/transit-centers/{centerId}"
    description: "Get a transit center"
    roles: [DispatchManager, SortAssociate, Driver, CustomerServiceAgent]
    code: 200
    input: []
    output: TransitCenter
    side_effects: []

  - method: POST
    path: "/delivery/transit-centers/{centerId}/close"
    description: "Close a transit center to new sorting"
    roles: [DispatchManager]
    code: 200
    input: []
    output: TransitCenter
    side_effects: ["status=CLOSED"]

  - method: GET
    path: "/delivery/transit-centers/{centerId}/sorted-parcels"
    description: "List parcels currently SORTED at this center (reverse lookup for Parcel.sorted_at_center_id)"
    roles: [DispatchManager, SortAssociate]
    code: 200
    input: ["limit?", "offset?"]
    output: "Parcel[]"
    side_effects: []

  # --- Driver ---
  - method: POST
    path: "/delivery/drivers"
    description: "Create a driver"
    roles: [DispatchManager]
    code: 201
    input: [name, "hazmat_certified?", vehicle_capacity_kg]
    output: Driver
    side_effects: ["status=ACTIVE", "failure_points=0"]

  - method: GET
    path: "/delivery/drivers"
    description: "List drivers"
    roles: [DispatchManager, CustomerServiceAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "Driver[]"
    side_effects: []

  - method: GET
    path: "/delivery/drivers/{driverId}"
    description: "Get a driver (includes computed failure_points)"
    roles: [DispatchManager, Driver, CustomerServiceAgent]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: POST
    path: "/delivery/drivers/{driverId}/suspend"
    description: "Suspend a driver"
    roles: [DispatchManager]
    code: 200
    input: []
    output: Driver
    side_effects: ["status=SUSPENDED"]

  - method: GET
    path: "/delivery/drivers/{driverId}/routes"
    description: "List routes assigned to a driver (reverse lookup for DeliveryRoute.driver_id)"
    roles: [DispatchManager, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeliveryRoute[]"
    side_effects: []

  # --- Parcel ---
  - method: POST
    path: "/delivery/parcels"
    description: "Register an inbound parcel"
    roles: [SortAssociate, DispatchManager]
    code: 201
    input: [tracking_code, weight_kg, "service_level?", "signature_required?", "hazmat_class?", "driver_release_authorized?"]
    output: Parcel
    side_effects: ["status=RECEIVED", "sorted_at_center_id=null"]

  - method: GET
    path: "/delivery/parcels"
    description: "List parcels; filterable by sorted_at_center_id"
    roles: [DispatchManager, SortAssociate, CustomerServiceAgent]
    code: 200
    input: ["sorted_at_center_id?", "limit?", "offset?"]
    output: "Parcel[]"
    side_effects: []

  - method: GET
    path: "/delivery/parcels/{parcelId}"
    description: "Get a parcel"
    roles: [DispatchManager, SortAssociate, Driver, CustomerServiceAgent]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: POST
    path: "/delivery/parcels/{parcelId}/sort"
    description: "Sort a RECEIVED parcel into a transit center"
    roles: [SortAssociate]
    code: 200
    input: [center_id]
    output: Parcel
    side_effects:
      - "parcel.status RECEIVED->SORTED"
      - "parcel.sorted_at_center_id=center_id"
      - "center.sorted_count recomputed (+1)"

  # --- DeliveryRoute ---
  - method: POST
    path: "/delivery/routes"
    description: "Create a delivery route in PLANNING"
    roles: [DispatchManager]
    code: 201
    input: [driver_id, origin_center_id, service_date, max_stops]
    output: DeliveryRoute
    side_effects: ["status=PLANNING", "planned_weight_kg=0", "committed_weight_kg=0", "stop_count=0"]

  - method: GET
    path: "/delivery/routes"
    description: "List routes; filterable by driver_id and origin_center_id"
    roles: [DispatchManager, Driver]
    code: 200
    input: ["driver_id?", "origin_center_id?", "limit?", "offset?"]
    output: "DeliveryRoute[]"
    side_effects: []

  - method: GET
    path: "/delivery/routes/{routeId}"
    description: "Get a route (includes computed load metrics and stop_count)"
    roles: [DispatchManager, Driver]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []

  - method: GET
    path: "/delivery/routes/{routeId}/manifest"
    description: "Computed manifest: per-route handling fee total (calculations.sort_handling_fee)"
    roles: [DispatchManager]
    code: 200
    input: []
    output: "{ route_id: string, stop_count: integer, total_handling_fee_cents: integer }"
    side_effects: []

  - method: POST
    path: "/delivery/routes/{routeId}/dispatch"
    description: "Dispatch a planned route (OCC-guarded)"
    roles: [DispatchManager]
    code: 200
    input: [expected_route_version]
    output: DeliveryRoute
    side_effects:
      - "status PLANNING->DISPATCHED"
      - "All PENDING stops -> OUT_FOR_DELIVERY"
      - "increments DeliveryRoute.version by 1"

  - method: POST
    path: "/delivery/routes/{routeId}/complete"
    description: "Complete a dispatched route once no open stops remain"
    roles: [DispatchManager]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status DISPATCHED->COMPLETED"]

  - method: POST
    path: "/delivery/routes/{routeId}/cancel"
    description: "Cancel a planning route; cascade-cancels stops and reverts parcels to SORTED"
    roles: [DispatchManager]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects:
      - "status PLANNING->CANCELLED"
      - "all non-CANCELLED stops -> CANCELLED"
      - "each cascaded stop's parcel reverts ROUTED->SORTED, origin center.sorted_count recomputed (+1)"

  # --- DeliveryStop ---
  - method: POST
    path: "/delivery/stops"
    description: "Add a delivery stop to a planning route (routes the parcel)"
    roles: [DispatchManager]
    code: 201
    input: [route_id, parcel_id, sequence, window_start_min, window_end_min]
    output: DeliveryStop
    side_effects:
      - "status=PENDING"
      - "parcel.status SORTED->ROUTED; origin center.sorted_count recomputed (-1)"
      - "route.stop_count/planned_weight_kg/committed_weight_kg recomputed"
      - "increments DeliveryRoute.version by 1"

  - method: GET
    path: "/delivery/stops"
    description: "List stops; filterable by route_id and parcel_id"
    roles: [DispatchManager, Driver]
    code: 200
    input: ["route_id?", "parcel_id?", "limit?", "offset?"]
    output: "DeliveryStop[]"
    side_effects: []

  - method: GET
    path: "/delivery/stops/{stopId}"
    description: "Get a stop"
    roles: [DispatchManager, Driver, CustomerServiceAgent]
    code: 200
    input: []
    output: DeliveryStop
    side_effects: []

  - method: POST
    path: "/delivery/stops/{stopId}/attempts"
    description: "Log a delivery attempt against an out-for-delivery stop"
    roles: [Driver]
    code: 201
    input: [outcome, "signature_name?", "used_driver_release?"]
    output: DeliveryAttempt
    side_effects:
      - "Append DeliveryAttempt; stop.attempt_count recomputed"
      - "DELIVERED outcome: stop->DELIVERED, parcel->DELIVERED, driver.failure_points recovery credit if from REDELIVERY_SCHEDULED"
      - "non-DELIVERED outcome: stop->ATTEMPTED, driver.failure_points += penalty"

  - method: GET
    path: "/delivery/stops/{id}/attempts"
    description: "List delivery attempts for a stop (reverse lookup for DeliveryAttempt.stop_id)"
    roles: [DispatchManager, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeliveryAttempt[]"
    side_effects: []

  - method: POST
    path: "/delivery/stops/{stopId}/reschedule"
    description: "Reschedule an attempted stop for redelivery, or mark FAILED if max attempts reached"
    roles: [DispatchManager]
    code: 200
    input: []
    output: DeliveryStop
    side_effects:
      - "If attempt_count < MAX_ATTEMPTS: ATTEMPTED->REDELIVERY_SCHEDULED, redelivery_fee_cents recomputed"
      - "If attempt_count >= MAX_ATTEMPTS: ATTEMPTED->FAILED, parcel->RETURNED, driver.failure_points += RETURN_PENALTY"

  - method: POST
    path: "/delivery/stops/{stopId}/cancel"
    description: "Cancel a pending stop; reverts parcel to SORTED"
    roles: [DispatchManager]
    code: 200
    input: []
    output: DeliveryStop
    side_effects:
      - "status PENDING->CANCELLED"
      - "parcel reverts ROUTED->SORTED; origin center.sorted_count recomputed (+1)"
      - "route metrics recomputed"

  # --- Appointment ---
  - method: POST
    path: "/delivery/appointments"
    description: "Customer-requested time-window adjustment for a stop"
    roles: [CustomerServiceAgent]
    code: 201
    input: [stop_id, requested_start_min, requested_end_min]
    output: Appointment
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/delivery/appointments"
    description: "List appointments; filterable by stop_id"
    roles: [CustomerServiceAgent, DispatchManager]
    code: 200
    input: ["stop_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/delivery/appointments/{appointmentId}"
    description: "Get an appointment"
    roles: [CustomerServiceAgent, DispatchManager]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/delivery/appointments/{appointmentId}/apply"
    description: "Apply a requested appointment, moving the stop's time window"
    roles: [CustomerServiceAgent]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "status REQUESTED->APPLIED"
      - "stop.window_start_min/window_end_min updated (cross-entity)"
      - "increments DeliveryRoute.version by 1 (the stop's route)"

  - method: POST
    path: "/delivery/appointments/{appointmentId}/reject"
    description: "Reject a requested appointment"
    roles: [CustomerServiceAgent]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status REQUESTED->REJECTED"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Current role not permitted for this operation" }

  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, range violation (weight_kg<=0, window_end_min<=window_start_min, sequence<1, max_stops<1), or invalid enum member" }
  - { id: ERR_DUPLICATE_TRACKING_CODE, http: 409, condition: "Parcel tracking_code already exists" }

  # --- Not found ---
  - { id: ERR_CENTER_NOT_FOUND, http: 404, condition: "Transit center not found" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Driver not found" }
  - { id: ERR_PARCEL_NOT_FOUND, http: 404, condition: "Parcel not found" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Delivery route not found" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "Delivery stop not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment not found" }

  # --- State ---
  - { id: ERR_PARCEL_NOT_RECEIVED, http: 409, condition: "Sort requires parcel in RECEIVED state" }
  - { id: ERR_PARCEL_NOT_SORTED, http: 409, condition: "Routing (stop create) requires parcel in SORTED state" }
  - { id: ERR_CENTER_CLOSED, http: 409, condition: "Sorting into a CLOSED transit center" }
  - { id: ERR_ROUTE_NOT_PLANNING, http: 409, condition: "Dispatch requires route in PLANNING state" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Complete requires route in DISPATCHED state" }
  - { id: ERR_ROUTE_NOT_CANCELLABLE, http: 409, condition: "Cancel requires route in PLANNING state" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "Dispatch requires at least one non-CANCELLED stop" }
  - { id: ERR_OPEN_STOPS_REMAIN, http: 409, condition: "Complete blocked: stops still OUT_FOR_DELIVERY/ATTEMPTED/REDELIVERY_SCHEDULED" }
  - { id: ERR_STOP_NOT_OUT_FOR_DELIVERY, http: 409, condition: "Attempt requires stop in OUT_FOR_DELIVERY or REDELIVERY_SCHEDULED" }
  - { id: ERR_STOP_NOT_ATTEMPTED, http: 409, condition: "Reschedule requires stop in ATTEMPTED state" }
  - { id: ERR_STOP_NOT_CANCELLABLE, http: 409, condition: "Stop cancel requires PENDING state" }
  - { id: ERR_APPOINTMENT_NOT_REQUESTED, http: 409, condition: "Apply/reject requires appointment in REQUESTED state" }
  - { id: ERR_STOP_WINDOW_LOCKED, http: 409, condition: "Appointment apply requires stop in PENDING/OUT_FOR_DELIVERY/REDELIVERY_SCHEDULED (not terminal)" }

  # --- Business safety ---
  - { id: ERR_HAZMAT_HUB_NOT_CERTIFIED, http: 409, condition: "Hazmat parcel sorted at a non-hazmat-certified center" }
  - { id: ERR_DRIVER_NOT_HAZMAT_CERTIFIED, http: 409, condition: "Route carrying a Hazmat parcel dispatched with a non-certified driver" }
  - { id: ERR_DRIVER_RELEASE_NOT_AUTHORIZED, http: 409, condition: "used_driver_release=true but parcel.driver_release_authorized=false" }
  - { id: ERR_SIGNATURE_REQUIRED, http: 409, condition: "Signature-required parcel marked DELIVERED with no signature and no Driver Release" }
  - { id: ERR_DRIVER_SUSPENDED, http: 409, condition: "Dispatch attempted with a SUSPENDED driver" }
  - { id: ERR_DRIVER_DOUBLE_BOOKED, http: 409, condition: "Driver already has a DISPATCHED route on the same service_date" }

  # --- Business temporal / constraint ---
  - { id: ERR_APPOINTMENT_WINDOW_CONFLICT, http: 409, condition: "Applied appointment window overlaps another stop's window within APPOINTMENT_BUFFER_MIN on the same route" }
  - { id: ERR_ROUTE_STOP_LIMIT, http: 409, condition: "Adding a stop exceeds route.max_stops, or duplicate sequence among non-CANCELLED stops" }
  - { id: ERR_SORT_CAPACITY_EXCEEDED, http: 409, condition: "Center already at sort_capacity" }
  - { id: ERR_MAX_ATTEMPTS_REACHED, http: 409, condition: "Reschedule for redelivery blocked because attempt_count reached MAX_ATTEMPTS (use FAILED branch)" }

  # --- Business fiscal ---
  - { id: ERR_VEHICLE_CAPACITY_EXCEEDED, http: 409, condition: "Route committed_weight_kg exceeds driver.vehicle_capacity_kg at dispatch" }

  # --- Concurrency ---
  - { id: ERR_STALE_ROUTE_VERSION, http: 412, condition: "expected_route_version does not match route.version at dispatch (OCC)" }

# =============================================================================
# Table 1.7: RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: DispatchManager
    description: "Owns routes, stops, drivers, transit centers; plans, dispatches, reschedules, completes."
    identity: opaque
    exclusive_operations:
      - "POST /delivery/transit-centers — create hub"
      - "POST /delivery/transit-centers/{id}/close — close hub"
      - "POST /delivery/drivers — create driver"
      - "POST /delivery/drivers/{id}/suspend — suspend driver"
      - "POST /delivery/routes — create route"
      - "GET /delivery/routes/{id}/manifest — handling-fee manifest"
      - "POST /delivery/routes/{id}/dispatch — dispatch route"
      - "POST /delivery/routes/{id}/complete — complete route"
      - "POST /delivery/routes/{id}/cancel — cancel route"
      - "POST /delivery/stops — add stop"
      - "POST /delivery/stops/{id}/reschedule — reschedule/fail stop"
      - "POST /delivery/stops/{id}/cancel — cancel stop"
    shared_operations:
      - "POST /delivery/parcels — register parcel (shared with SortAssociate)"
      - "GET endpoints across the API"

  - name: SortAssociate
    description: "Works the transit center; registers and sorts parcels."
    identity: opaque
    exclusive_operations:
      - "POST /delivery/parcels/{id}/sort — sort parcel into hub"
    shared_operations:
      - "POST /delivery/parcels — register parcel (shared with DispatchManager)"
      - "GET /delivery/transit-centers, .../sorted-parcels, /delivery/parcels — read"

  - name: Driver
    description: "Executes assigned stops; logs delivery attempts at the door."
    identity: entity_backed:Driver
    exclusive_operations:
      - "POST /delivery/stops/{id}/attempts — log delivery attempt"
    shared_operations:
      - "GET /delivery/routes, /delivery/stops, /delivery/drivers/{id} — read assigned work"

  - name: CustomerServiceAgent
    description: "Handles customer appointment adjustments to delivery windows."
    identity: opaque
    exclusive_operations:
      - "POST /delivery/appointments — create appointment request"
      - "POST /delivery/appointments/{id}/apply — apply appointment"
      - "POST /delivery/appointments/{id}/reject — reject appointment"
    shared_operations:
      - "GET /delivery/appointments, /delivery/stops/{id}, /delivery/parcels — read"
