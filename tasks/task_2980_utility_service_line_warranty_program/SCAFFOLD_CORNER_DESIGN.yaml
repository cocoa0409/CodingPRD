              as_user_id: "pa-001"
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "12 Alder St", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"] }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "POST /claims"
              payload: { enrollment_id: "${enrollment_id}", line_type: "WATER_SERVICE_LINE", defect_location: "INSIDE_HOME", urgency: "ROUTINE", incident_description: "Interior riser dripping." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/triage-decision"
              payload: { decision: "DENY", coverage_note: "Interior plumbing is outside the curb-stop boundary.", denial_reason: "OWNERSHIP_INELIGIBLE" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { decider: $.data.triage_decided_by_user_id }
            - call: "POST /claims/${claim_id}/appeals"
              payload: { appeal_reason: "The utility told me the curb stop was covered." }
              as: Policyholder
              as_user_id: "${premises_id}"
              captures: { appeal_status: $.data.status, appeal_count: $.data.appeal_count, claim_v3: $.data.version }
          trigger:
            - call: "POST /claims/${claim_id}/appeal-decision"
              payload: { decision: "OVERTURN", rationale: "Reviewing my own denial." }
              as: AppealsOfficer
              as_user_id: "adj-001"
              captures: { err_sod: $.data.error_id }
            - call: "POST /claims/${claim_id}/appeal-decision"
              payload: { decision: "OVERTURN", rationale: "Ownership boundary was misread at triage." }
              as: AppealsOfficer
              as_user_id: "apo-001"
              captures: { final_status: $.data.status, final_decider: $.data.appeal_decided_by_user_id, final_reason: $.data.denial_reason }
          assert:
            - "${decider} == adj-001, ${appeal_status} == APPEAL_OPEN and ${appeal_count} == 1 before the trigger"
            - "${err_sod} == ERR_SEGREGATION_OF_DUTIES with HTTP 403  # X-User-ID equals triage_decided_by_user_id"
            - "the refused call leaves GET /claims/${claim_id} in APPEAL_OPEN with version ${claim_v3} and appeal_decided_by_user_id null"
            - "${final_status} == APPROVED, ${final_decider} == apo-001 and ${final_reason} == null with HTTP 200  # the identical decision from another officer is admitted"
