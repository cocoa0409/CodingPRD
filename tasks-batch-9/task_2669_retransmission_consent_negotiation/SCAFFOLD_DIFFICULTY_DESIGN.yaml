  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_round_trip_cycle_and_impasse_reentry
        grounds:
          - state_machines.Negotiation.OPEN_to_AWAITING_DISTRIBUTOR_RESPONSE
          - state_machines.Negotiation.AWAITING_DISTRIBUTOR_RESPONSE_to_AWAITING_STATION_OFFER
          - state_machines.Negotiation.AWAITING_STATION_OFFER_to_AWAITING_DISTRIBUTOR_RESPONSE
          - state_machines.Negotiation.AWAITING_DISTRIBUTOR_RESPONSE_to_IMPASSE
          - state_machines.Negotiation.IMPASSE_to_AWAITING_DISTRIBUTOR_RESPONSE
          - state_machines.BlackoutNotice.SERVED_to_SUPERSEDED
          - entities.Negotiation.fields.notice_compliance_status
        distinguishing_aspect: |
          The Negotiation machine is non-linear in two distinct ways at once: the two AWAITING_*
          states form a genuine round-trip cycle re-entered once per offer, and IMPASSE — which
          reads like a terminal breakdown — has an outbound edge back to AWAITING_DISTRIBUTOR_RESPONSE
          that also supersedes the already-served blackout notice, so the same state is visited twice
          with different notice_compliance_status values.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z startup default"
            - "One CBS station, one CABLE distributor with 240000 video households, one filed RETRANS_CONSENT election whose incumbent term expires 2027-01-01"
            - "One 2027-01 subscriber report with 100000 reported subscribers"
            - "Three offers already exchanged: station, distributor, station"
            - "Three MEETING_HELD good-faith entries on the negotiation"
            - "Impasse declared and one blackout notice served, both before the 2026-12-02 notice deadline"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
