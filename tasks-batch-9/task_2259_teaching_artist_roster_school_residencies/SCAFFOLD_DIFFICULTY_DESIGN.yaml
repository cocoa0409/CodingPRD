      - name: makeup_credit_round_trip_preserves_session_obligation_invariant
        grounds:
          - calculations.residency_session_ledger
          - state_machines.Session.PLANNED_to_CANCELLED_SCHOOL
          - entities.Residency.fields.makeup_credits_outstanding
          - entities.Session.fields.makeup_consumed
          - validations[priority=26]
        distinguishing_aspect: |
          A different conserved quantity: SESSION OBLIGATION. Cancelling a
          make-up-eligible session moves one unit from sessions_open_count to
          makeup_credits_outstanding (9 + 0 + 0 + 0 + 1 == 10) and creating the
          MAKEUP session moves that same unit back (9 + 1 + 0 + 0 + 0 == 10),
          without ever touching contracted_session_count or
          sessions_unscheduled_count — a counter conservation law, not a money one.
