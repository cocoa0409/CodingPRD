scenario: |
  Government procurement bidding system: procurement plan publication with annual procurement
  plan submission, plan-item review, public announcement, plan-amendment workflow, and
  plan-execution tracking; tender document preparation with tender-template library, technical
  and commercial specifications, qualification requirements, evaluation criteria,
  clarification-and-amendment management, and tender-document version control; supplier
  qualification pre-screening with supplier registration and qualification verification,
  project-specific qualification check, blacklist filtering, pre-screening result publication,
  and objection handling; bid opening, evaluation, and awarding with bid submission deadline
  enforcement, bid-opening ceremony record, evaluation committee composition (random selection/
  conflict-of-interest avoidance), evaluation-method (lowest price/comprehensive scoring),
  evaluation-process record, awarding decision, and award publication; query and complaint
  handling with query submission window, query-response by procurement entity, complaint
  submission to regulatory authority, complaint review and decision, and corrective-action
  enforcement; contract filing with awarded-supplier contract signing, contract clauses
  consistency check with tender, contract submission to regulatory authority, contract-amendment
  filing, and contract-execution monitoring; event-driven synchronization with electronic-
  signature, payment, regulatory authority, and credit-information systems; audit logging for
  evaluation actions and complaint handling.

domain_name: "govt-procurement"
api_prefix: "/procurement"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - "Cascading side effects"
    - "Scheduled / deferred actions"
    - "Version-pinning on approval"
    - "Dual-variant calculation"

  entity_topology: "hybrid"
  # Plan -> PlanItem hierarchy, but Project / TenderDocument / Bid / Award / Contract / Complaint
  # are flat peers connected via foreign keys (project_id, tender_document_id, etc.).

  state_machine_shape: "branching"
  # Branching with revert: ProcurementPlan (revisions), TenderDocument (clarifications/amendments
  # cycle the version back to DRAFT-equivalent), Complaint (review -> sustain/reject), Bid
  # (withdraw before deadline).

  relationship_patterns:
    - one_to_many       # Plan -> PlanItem, Project -> Bid, EvaluationCommittee -> Member
    - cross_aggregate   # Contract references Bid + Project + Award; Complaint references Project + Bid
    - polymorphic       # AuditLog.target_type can be EVALUATION | COMPLAINT | CONTRACT | TENDER

  role_model: "segregation_of_duties"
  # ProcurementOfficer (procurement entity), Supplier, EvaluationExpert, Regulator are mutually
  # exclusive on key operations (officer can't be expert, expert can't be regulator, etc.).

  consistency_model: "immediate"

# =============================================================================
# §1.0  Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1  Entity-Relationship Table
# =============================================================================
entities:

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the supplier company.
        constraints: "non-empty, unique"
      - name: tax_id
        type: string
        source: input
        description: National tax identifier.
        constraints: "non-empty, unique"
      - name: registration_status
        type: enum
        source: computed
        description: Pre-screening lifecycle state of the supplier as a registered party.
        constraints: "values: PENDING, VERIFIED, BLACKLISTED, REVOKED"
        default: PENDING
      - name: blacklist_until
        type: datetime
        source: system
        description: UTC timestamp until which the supplier is treated as blacklisted; null if never blacklisted or lifted.
        default: null
      - name: credit_score
        type: integer
        source: system
        description: Credit score mirrored from the external credit-information system (0–1000).
        default: 600
        constraints: "0 <= credit_score <= 1000"
      - name: qualifications
        type: array
        source: input
        description: List of qualification certificate strings (e.g. ["ISO9001","CONSTRUCTION_GRADE_A"]) attested by the supplier.

  - name: ProcurementPlan
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: Identifier of the procurement entity (government agency) that owns this plan.
      - name: fiscal_year
        type: integer
        source: input
        description: Fiscal year the plan applies to (e.g. 2026).
        constraints: "2000 <= fiscal_year <= 2100"
      - name: status
        type: enum
        source: computed
        description: Lifecycle state of the plan.
        constraints: "values: DRAFT, UNDER_REVIEW, PUBLISHED, AMENDING, ARCHIVED, REJECTED"
        default: DRAFT
      - name: total_budget_cents
        type: integer
        source: computed
        description: Sum of approved PlanItem.budget_cents for items with item_status IN {APPROVED, PUBLISHED}.
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: UTC timestamp when the plan first transitioned to PUBLISHED; preserved across AMENDING cycles.
        default: null
      - name: amendment_round
        type: integer
        source: system
        description: Number of completed amendment cycles (DRAFT->...->PUBLISHED->AMENDING->PUBLISHED counts as +1).
        default: 0

  - name: PlanItem
    parent: ProcurementPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK to ProcurementPlan.id.
      - name: title
        type: string
        source: input
        description: Short title of the procurement line item.
        constraints: "non-empty"
      - name: category
        type: enum
        source: input
        description: Procurement category.
        constraints: "values: GOODS, SERVICES, WORKS"
      - name: budget_cents
        type: integer
        source: input
        description: Allocated budget for this item in integer cents (CNY by convention).
        constraints: "budget_cents > 0"
      - name: item_status
        type: enum
        source: computed
        description: Per-item review state.
        constraints: "values: PROPOSED, APPROVED, REJECTED, PUBLISHED, EXECUTED, CANCELLED"
        default: PROPOSED
      - name: executed_amount_cents
        type: integer
        source: system
        description: Sum of Contract.contract_amount_cents for ACTIVE/EXECUTED contracts that reference this plan item via the Project chain.
        default: 0

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: plan_item_id
        type: string
        source: input
        description: FK to PlanItem.id. The plan item must be PUBLISHED before a Project can be created.
      - name: title
        type: string
        source: input
        description: Project name.
        constraints: "non-empty"
      - name: project_status
        type: enum
        source: computed
        description: Overall project lifecycle state.
        constraints: "values: DRAFT, PRESCREEN_OPEN, BIDDING_OPEN, BIDDING_CLOSED, EVALUATING, AWARDED, CONTRACT_SIGNED, CANCELLED, FROZEN"
        default: DRAFT
      - name: evaluation_method
        type: enum
        source: input
        description: Evaluation method chosen for this project.
        constraints: "values: LOWEST_PRICE, COMPREHENSIVE_SCORING"
      - name: bid_submission_deadline
        type: datetime
        source: input
        description: UTC timestamp after which no bid may be submitted or modified.
      - name: query_window_close_at
        type: datetime
        source: input
        description: UTC timestamp after which no supplier query may be submitted; must be strictly before bid_submission_deadline.
      - name: bid_opening_at
        type: datetime
        source: input
        description: UTC timestamp at which the bid-opening ceremony is to be recorded; must be > bid_submission_deadline.
      - name: estimated_value_cents
        type: integer
        source: input
        description: Procurement entity's estimated price ceiling for the project, used as a reference in scoring.
        constraints: "estimated_value_cents > 0"
      - name: required_qualifications
        type: array
        source: input
        description: List of qualification strings every bidder must hold (project-specific qualification check).
      - name: frozen_reason
        type: enum
        source: system
        description: Reason the project was frozen by the regulator (null when not frozen).
        constraints: "values: null, COMPLAINT_UPHELD, REGULATORY_HOLD"
        default: null

  - name: TenderDocument
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id. Exactly one TenderDocument per project.
        constraints: "unique per project_id"
      - name: template_id
        type: string
        source: input
        description: Identifier of the tender template the document was instantiated from (template library).
      - name: version
        type: integer
        source: system
        description: Document version number (overrides common_fields.version). Increments on every PUBLISH from DRAFT.
        default: 1
      - name: doc_status
        type: enum
        source: computed
        description: Document lifecycle state.
        constraints: "values: DRAFT, PUBLISHED, CLARIFYING, AMENDING, SUPERSEDED"
        default: DRAFT
      - name: technical_spec
        type: string
        source: input
        description: Technical specification text.
        constraints: "non-empty"
      - name: commercial_spec
        type: string
        source: input
        description: Commercial specification text including payment terms.
        constraints: "non-empty"
      - name: qualification_requirements
        type: array
        source: input
        description: Mirrored snapshot of Project.required_qualifications at time of PUBLISH; pinned on publish.
      - name: evaluation_criteria
        type: object
        source: input
        description: |
          For LOWEST_PRICE: { "tie_break": "earliest_bid" }.
          For COMPREHENSIVE_SCORING: {
            "weight_price": 0.40, "weight_technical": 0.40, "weight_qualification": 0.20,
            "max_technical_score": 100, "max_qualification_score": 100
          }. All weights MUST sum to 1.0 ± 1e-9.
      - name: pinned_at
        type: datetime
        source: system
        description: UTC timestamp when this version became PUBLISHED; bids may only be submitted against PUBLISHED versions whose pinned_at <= now.
        default: null

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id.
      - name: supplier_id
        type: string
        source: input
        description: FK to Supplier.id.
      - name: tender_document_version
        type: integer
        source: input
        description: TenderDocument.version snapshot the bid was prepared against; must equal current PUBLISHED version at submission time.
      - name: bid_price_cents
        type: integer
        source: input
        description: Bid price in integer cents.
        constraints: "bid_price_cents > 0"
      - name: technical_score_raw
        type: integer
        source: input
        description: Self-declared technical score on the document's technical criterion (used only as committee input; comprehensive scoring re-derives).
        default: 0
        constraints: "0 <= technical_score_raw <= TenderDocument.evaluation_criteria.max_technical_score"
      - name: bid_status
        type: enum
        source: computed
        description: Bid lifecycle state.
        constraints: "values: SUBMITTED, WITHDRAWN, OPENED, EVALUATED, AWARDED, LOST, DISQUALIFIED"
        default: SUBMITTED
      - name: prescreen_passed
        type: boolean
        source: computed
        description: Whether the supplier passed pre-screening for this project (snapshotted at bid submission).
        default: false
      - name: final_score
        type: number
        source: computed
        description: Final composite score after evaluation (COMPREHENSIVE_SCORING). For LOWEST_PRICE bids, equals bid_price_cents.
        default: null

  - name: EvaluationCommittee
    parent: Project
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id. Exactly one committee per project.
        constraints: "unique per project_id"
      - name: members
        type: array
        source: system
        description: |
          List of objects, each {"expert_id": <id>, "selected_at": ISO8601, "conflict_cleared": true}.
          Size MUST be an odd integer in [3, 9]. Selection is server-side and deterministic given a
          selection_seed (see calculations.committee_random_selection).
      - name: selection_seed
        type: string
        source: input
        description: Caller-supplied opaque seed used to deterministically pick experts from the eligible pool.
      - name: committee_status
        type: enum
        source: computed
        description: Committee lifecycle.
        constraints: "values: FORMED, EVALUATING, FINALIZED, DISSOLVED"
        default: FORMED

  - name: Award
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id.
        constraints: "unique per project_id"
      - name: winning_bid_id
        type: string
        source: computed
        description: FK to Bid.id of the awarded bid.
      - name: award_status
        type: enum
        source: computed
        description: Award lifecycle.
        constraints: "values: DECIDED, PUBLISHED, REVOKED"
        default: DECIDED
      - name: published_at
        type: datetime
        source: system
        description: UTC timestamp when award was publicly announced.
        default: null
      - name: award_amount_cents
        type: integer
        source: computed
        description: Snapshot of the winning Bid.bid_price_cents at the moment of award.

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id.
        constraints: "unique per project_id"
      - name: award_id
        type: string
        source: input
        description: FK to Award.id; the award must be PUBLISHED before a Contract can be filed.
      - name: supplier_id
        type: string
        source: input
        description: FK to Supplier.id; must equal the supplier_id of Award.winning_bid_id.
      - name: contract_amount_cents
        type: integer
        source: input
        description: Contract value in integer cents; must equal Award.award_amount_cents at filing time (consistency check).
      - name: payment_terms
        type: string
        source: input
        description: Free-text payment terms; must be byte-identical to TenderDocument.commercial_spec at the award's tender version (consistency check).
      - name: signature_ref
        type: string
        source: system
        description: Opaque reference returned by the electronic-signature system after both parties sign.
        default: null
      - name: contract_status
        type: enum
        source: computed
        description: Contract lifecycle.
        constraints: "values: PENDING_SIGNATURE, ACTIVE, AMENDING, EXECUTED, TERMINATED"
        default: PENDING_SIGNATURE
      - name: paid_amount_cents
        type: integer
        source: system
        description: Sum of payment events mirrored from the external payment system for this contract.
        default: 0

  - name: ContractAmendment
    parent: Contract
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK to Contract.id.
      - name: delta_amount_cents
        type: integer
        source: input
        description: Signed change to contract_amount_cents (may be negative).
      - name: reason
        type: string
        source: input
        description: Reason for amendment.
        constraints: "non-empty"
      - name: filed_at
        type: datetime
        source: system
        description: UTC timestamp the amendment was filed with the regulator.

  - name: Query
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id.
      - name: supplier_id
        type: string
        source: input
        description: FK to Supplier.id (the asker).
      - name: question
        type: string
        source: input
        description: Free-text question about the tender.
        constraints: "non-empty"
      - name: response
        type: string
        source: input
        description: Procurement entity's response (null until answered).
        default: null
      - name: query_status
        type: enum
        source: computed
        description: Query lifecycle.
        constraints: "values: OPEN, ANSWERED, EXPIRED"
        default: OPEN

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK to Project.id.
      - name: complainant_supplier_id
        type: string
        source: input
        description: FK to Supplier.id of the complaining supplier.
      - name: subject
        type: enum
        source: input
        description: What the complaint targets.
        constraints: "values: PRESCREEN_RESULT, EVALUATION, AWARD, CONTRACT"
      - name: narrative
        type: string
        source: input
        description: Complaint narrative.
        constraints: "non-empty"
      - name: complaint_status
        type: enum
        source: computed
        description: Complaint lifecycle.
        constraints: "values: SUBMITTED, UNDER_REVIEW, UPHELD, DISMISSED, WITHDRAWN"
        default: SUBMITTED
      - name: decision_at
        type: datetime
        source: system
        description: UTC timestamp the regulator finalized the decision.
        default: null
      - name: corrective_action
        type: enum
        source: input
        description: Action ordered by regulator when complaint is UPHELD.
        constraints: "values: null, REOPEN_PRESCREEN, REOPEN_EVALUATION, REVOKE_AWARD, FREEZE_PROJECT"
        default: null

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: target_type
        type: enum
        source: system
        description: Polymorphic discriminator.
        constraints: "values: EVALUATION, COMPLAINT, CONTRACT, TENDER, AWARD"
      - name: target_id
        type: string
        source: system
        description: id of the targeted entity.
      - name: actor_role
        type: string
        source: system
        description: Role name that performed the action (snapshotted from X-User-Role).
      - name: actor_id
        type: string
        source: system
        description: id snapshotted from X-User-ID.
      - name: action
        type: string
        source: system
        description: Verb describing the recorded action (e.g. "EVALUATION_SCORE_RECORDED", "COMPLAINT_DECIDED").
      - name: payload
        type: object
        source: system
        description: Structured snapshot of the relevant state at the time of the action (frozen, append-only).

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - name: current_time
        type: datetime
        source: system
        description: |
          Server-side virtual UTC clock. All time-gated transitions read this field, not wall-clock.
          Initialized to 1970-01-01T00:00:00.000Z on first boot; advanced explicitly via
          POST /_clock/advance.

# =============================================================================
# §1.2  State Machine Table
# =============================================================================
state_machines:

  - entity: ProcurementPlan
    initial_state: DRAFT
    terminal_states: [ARCHIVED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /procurement/plans/{id}/submit-review"
        actor: ProcurementOfficer
        preconditions:
          - "Plan has >= 1 PlanItem with item_status = PROPOSED"
        side_effects: []
      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /procurement/plans/{id}/publish"
        actor: ProcurementOfficer
        preconditions:
          - "All PlanItems have item_status IN {APPROVED, REJECTED}"
          - "At least one PlanItem is APPROVED"
        side_effects:
          - "For every APPROVED PlanItem, set item_status := PUBLISHED"
          - "Set published_at := ClockState.current_time if amendment_round == 0; preserve otherwise"
          - "Recompute total_budget_cents (calculations.plan_total_budget)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /procurement/plans/{id}/reject"
        actor: Regulator
        preconditions: ["plan currently in UNDER_REVIEW"]
        side_effects:
          - "All PlanItems with item_status IN {PROPOSED, APPROVED} become REJECTED"
      - from: PUBLISHED
        to: AMENDING
        trigger: "POST /procurement/plans/{id}/begin-amendment"
        actor: ProcurementOfficer
        preconditions:
          - "No PlanItem under this plan is referenced by a Project with project_status IN {BIDDING_OPEN, EVALUATING, AWARDED, CONTRACT_SIGNED}"
        side_effects: []
      - from: AMENDING
        to: PUBLISHED
        trigger: "POST /procurement/plans/{id}/publish"
        actor: ProcurementOfficer
        preconditions:
          - "All PlanItems have item_status IN {APPROVED, REJECTED, PUBLISHED, EXECUTED, CANCELLED}"
        side_effects:
          - "Increment amendment_round by 1"
          - "Recompute total_budget_cents"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /procurement/plans/{id}/archive"
        actor: ProcurementOfficer
        preconditions:
          - "Every PlanItem has item_status IN {EXECUTED, CANCELLED, REJECTED}"
        side_effects: []

  - entity: PlanItem
    initial_state: PROPOSED
    terminal_states: [EXECUTED, CANCELLED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /procurement/plan-items/{id}/approve"
        actor: ProcurementOfficer
        preconditions: ["parent ProcurementPlan.status = UNDER_REVIEW"]
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /procurement/plan-items/{id}/reject"
        actor: ProcurementOfficer
        preconditions: ["parent ProcurementPlan.status = UNDER_REVIEW"]
        side_effects: []
      - from: APPROVED
        to: PUBLISHED
        trigger: "(side effect of ProcurementPlan UNDER_REVIEW -> PUBLISHED)"
        actor: system
        preconditions: ["parent ProcurementPlan transitions to PUBLISHED"]
        side_effects: []
      - from: PUBLISHED
        to: EXECUTED
        trigger: "(side effect of Contract.PENDING_SIGNATURE -> ACTIVE for the linked contract)"
        actor: system
        preconditions:
          - "Contract for the Project on this PlanItem reached ACTIVE"
        side_effects:
          - "Increment plan_item.executed_amount_cents by Contract.contract_amount_cents"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /procurement/plan-items/{id}/cancel"
        actor: ProcurementOfficer
        preconditions: ["no Project references this PlanItem"]
        side_effects: []

  - entity: TenderDocument
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /procurement/tender-documents/{id}/publish"
        actor: ProcurementOfficer
        preconditions:
          - "Project.project_status = DRAFT"
          - "evaluation_criteria validates per calculations.criteria_weight_sum_check"
        side_effects:
          - "Set pinned_at := ClockState.current_time"
          - "Snapshot qualification_requirements := Project.required_qualifications"
          - "Transition Project DRAFT -> PRESCREEN_OPEN"
      - from: PUBLISHED
        to: CLARIFYING
        trigger: "POST /procurement/tender-documents/{id}/clarify"
        actor: ProcurementOfficer
        preconditions:
          - "ClockState.current_time < Project.query_window_close_at"
        side_effects: []
      - from: CLARIFYING
        to: PUBLISHED
        trigger: "POST /procurement/tender-documents/{id}/finalize-clarification"
        actor: ProcurementOfficer
        preconditions: []
        side_effects:
          - "Pin a new pinned_at timestamp; version unchanged"
      - from: PUBLISHED
        to: AMENDING
        trigger: "POST /procurement/tender-documents/{id}/begin-amendment"
        actor: ProcurementOfficer
        preconditions:
          - "ClockState.current_time < Project.bid_submission_deadline"
          - "Project.project_status IN {PRESCREEN_OPEN, BIDDING_OPEN}"
        side_effects:
          - "If Project.project_status = BIDDING_OPEN, revert to PRESCREEN_OPEN"
          - "All Bid records with bid_status = SUBMITTED are forced to WITHDRAWN (compensation: re-submission required against new version)"
      - from: AMENDING
        to: PUBLISHED
        trigger: "POST /procurement/tender-documents/{id}/publish"
        actor: ProcurementOfficer
        preconditions:
          - "Project.project_status = PRESCREEN_OPEN"
        side_effects:
          - "Increment version by 1"
          - "Set pinned_at := ClockState.current_time"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "(side effect of Project transitioning to CANCELLED or Award REVOKED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Project
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PRESCREEN_OPEN
        trigger: "(side effect of TenderDocument DRAFT -> PUBLISHED)"
        actor: system
        preconditions: ["plan_item.item_status = PUBLISHED"]
        side_effects: []
      - from: PRESCREEN_OPEN
        to: BIDDING_OPEN
        trigger: "POST /procurement/projects/{id}/open-bidding"
        actor: ProcurementOfficer
        preconditions:
          - "TenderDocument.doc_status = PUBLISHED"
          - "ClockState.current_time < Project.bid_submission_deadline"
        side_effects: []
      - from: BIDDING_OPEN
        to: BIDDING_CLOSED
        trigger: "POST /procurement/projects/{id}/close-bidding"
        actor: ProcurementOfficer
        preconditions:
          - "ClockState.current_time >= Project.bid_submission_deadline"
        side_effects:
          - "All Bids with bid_status = SUBMITTED that fail prescreen at this moment become DISQUALIFIED"
      - from: BIDDING_CLOSED
        to: EVALUATING
        trigger: "POST /procurement/projects/{id}/open-bid-ceremony"
        actor: ProcurementOfficer
        preconditions:
          - "ClockState.current_time >= Project.bid_opening_at"
          - "EvaluationCommittee exists with committee_status = FORMED"
          - "Count of Bids with bid_status = SUBMITTED is >= 3"
        side_effects:
          - "All SUBMITTED bids transition to OPENED"
          - "EvaluationCommittee.committee_status -> EVALUATING"
          - "Append AuditLog(action='BID_CEREMONY_RECORDED')"
      - from: EVALUATING
        to: AWARDED
        trigger: "POST /procurement/projects/{id}/decide-award"
        actor: ProcurementOfficer
        preconditions:
          - "EvaluationCommittee.committee_status = FINALIZED"
          - "At least one Bid has bid_status = EVALUATED"
        side_effects:
          - "Create Award (status=DECIDED) with winning_bid_id := bid selected by evaluation_method"
          - "Winning Bid.bid_status -> AWARDED; all other EVALUATED bids -> LOST"
          - "Append AuditLog(action='AWARD_DECIDED')"
      - from: AWARDED
        to: CONTRACT_SIGNED
        trigger: "(side effect of Contract PENDING_SIGNATURE -> ACTIVE)"
        actor: system
        preconditions: ["Contract.signature_ref is non-null"]
        side_effects: []
      - from: PRESCREEN_OPEN
        to: CANCELLED
        trigger: "POST /procurement/projects/{id}/cancel"
        actor: ProcurementOfficer
        preconditions: []
        side_effects:
          - "TenderDocument.doc_status -> SUPERSEDED"
      - from: BIDDING_OPEN
        to: CANCELLED
        trigger: "POST /procurement/projects/{id}/cancel"
        actor: ProcurementOfficer
        preconditions: []
        side_effects:
          - "All Bids with bid_status IN {SUBMITTED} -> WITHDRAWN"
          - "TenderDocument.doc_status -> SUPERSEDED"
      - from: AWARDED
        to: FROZEN
        trigger: "(side effect of Complaint UNDER_REVIEW -> UPHELD with corrective_action IN {REVOKE_AWARD, FREEZE_PROJECT})"
        actor: system
        preconditions: []
        side_effects:
          - "frozen_reason := COMPLAINT_UPHELD"
          - "If corrective_action = REVOKE_AWARD: Award.award_status -> REVOKED; winning Bid -> DISQUALIFIED"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, AWARDED, LOST, DISQUALIFIED]
    transitions:
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /procurement/bids/{id}/withdraw"
        actor: Supplier
        preconditions:
          - "ClockState.current_time < Project.bid_submission_deadline"
          - "actor supplier_id = Bid.supplier_id"
        side_effects: []
      - from: SUBMITTED
        to: OPENED
        trigger: "(side effect of Project BIDDING_CLOSED -> EVALUATING)"
        actor: system
        preconditions: ["bid_status = SUBMITTED and prescreen_passed = true"]
        side_effects: []
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "(side effect of Project BIDDING_OPEN -> BIDDING_CLOSED for bids that fail prescreen)"
        actor: system
        preconditions: ["prescreen_passed = false at the moment of close"]
        side_effects: []
      - from: OPENED
        to: EVALUATED
        trigger: "POST /procurement/bids/{id}/record-evaluation"
        actor: EvaluationExpert
        preconditions:
          - "EvaluationCommittee.committee_status = EVALUATING"
          - "Actor expert_id IN EvaluationCommittee.members[].expert_id"
        side_effects:
          - "final_score := calculations.bid_final_score(evaluation_method, bid_price_cents, technical_score_raw, ...)"
          - "Append AuditLog(action='EVALUATION_SCORE_RECORDED')"
      - from: EVALUATED
        to: AWARDED
        trigger: "(side effect of Project EVALUATING -> AWARDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EVALUATED
        to: LOST
        trigger: "(side effect of Project EVALUATING -> AWARDED for non-winning bids)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Complaint
    initial_state: SUBMITTED
    terminal_states: [UPHELD, DISMISSED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /procurement/complaints/{id}/accept"
        actor: Regulator
        preconditions: []
        side_effects:
          - "Append AuditLog(action='COMPLAINT_ACCEPTED')"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /procurement/complaints/{id}/uphold"
        actor: Regulator
        preconditions:
          - "corrective_action is non-null and in the allowed enum"
        side_effects:
          - "Set decision_at := ClockState.current_time"
          - "If corrective_action = REOPEN_PRESCREEN: Project transitions back to PRESCREEN_OPEN (only valid if Project.project_status IN {BIDDING_OPEN, BIDDING_CLOSED, EVALUATING})"
          - "If corrective_action = REOPEN_EVALUATION: EvaluationCommittee.committee_status -> EVALUATING (only valid if Project.project_status = EVALUATING)"
          - "If corrective_action = REVOKE_AWARD: Project -> FROZEN, Award.award_status -> REVOKED, winning Bid -> DISQUALIFIED, parent PlanItem -> EXECUTED reverts (since Contract is precluded by Award revocation)"
          - "If corrective_action = FREEZE_PROJECT: Project -> FROZEN"
          - "Append AuditLog(action='COMPLAINT_DECIDED', payload includes corrective_action)"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /procurement/complaints/{id}/dismiss"
        actor: Regulator
        preconditions: []
        side_effects:
          - "Set decision_at := ClockState.current_time"
          - "Append AuditLog(action='COMPLAINT_DECIDED')"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /procurement/complaints/{id}/withdraw"
        actor: Supplier
        preconditions: ["actor supplier_id = Complaint.complainant_supplier_id"]
        side_effects: []

  - entity: Contract
    initial_state: PENDING_SIGNATURE
    terminal_states: [EXECUTED, TERMINATED]
    transitions:
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /procurement/contracts/{id}/sign"
        actor: ProcurementOfficer
        preconditions:
          - "calculations.contract_consistency_check passes (clauses match tender)"
          - "Award.award_status = PUBLISHED"
          - "Supplier.registration_status = VERIFIED and not currently blacklisted"
        side_effects:
          - "signature_ref := mock external e-signature reference"
          - "Project.project_status -> CONTRACT_SIGNED"
          - "PlanItem.item_status -> EXECUTED and executed_amount_cents += contract_amount_cents"
          - "Append AuditLog(action='CONTRACT_SIGNED')"
      - from: ACTIVE
        to: AMENDING
        trigger: "POST /procurement/contracts/{id}/begin-amendment"
        actor: ProcurementOfficer
        preconditions: []
        side_effects: []
      - from: AMENDING
        to: ACTIVE
        trigger: "POST /procurement/contracts/{id}/file-amendment"
        actor: ProcurementOfficer
        preconditions:
          - "ContractAmendment.delta_amount_cents + Contract.contract_amount_cents > 0"
          - "Resulting contract_amount_cents <= 1.20 * Award.award_amount_cents (regulatory cap on amendments)"
        side_effects:
          - "Contract.contract_amount_cents += delta_amount_cents"
          - "PlanItem.executed_amount_cents += delta_amount_cents"
      - from: ACTIVE
        to: EXECUTED
        trigger: "POST /procurement/contracts/{id}/mark-executed"
        actor: ProcurementOfficer
        preconditions:
          - "paid_amount_cents >= contract_amount_cents"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /procurement/contracts/{id}/terminate"
        actor: Regulator
        preconditions: []
        side_effects:
          - "PlanItem.executed_amount_cents -= (contract_amount_cents - paid_amount_cents)"

  - entity: EvaluationCommittee
    initial_state: FORMED
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMED
        to: EVALUATING
        trigger: "(side effect of Project BIDDING_CLOSED -> EVALUATING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EVALUATING
        to: FINALIZED
        trigger: "POST /procurement/committees/{id}/finalize"
        actor: ProcurementOfficer
        preconditions:
          - "Every Bid with bid_status IN {OPENED, EVALUATED} for the project is EVALUATED"
        side_effects: []
      - from: FINALIZED
        to: DISSOLVED
        trigger: "(side effect of Project transitioning to AWARDED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1  Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two suppliers race to submit the same supplier_id's bid on a project while the deadline is approaching."
    guarantee: "At most one Bid (supplier_id, project_id) row exists; second submission rejected."
    error_id: ERR_DUPLICATE_BID
    http_status: 409
    serialization: "First-writer-wins on (project_id, supplier_id, bid_status NOT IN terminal). The losing call sees ERR_DUPLICATE_BID."

  - scenario: "Procurement officer publishes an award while a regulator upholds a complaint freezing the project at the same instant."
    guarantee: "Exactly one operation succeeds; loser is rejected with ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Project.project_status (compare-and-swap from EVALUATING/AWARDED)."

  - scenario: "Two evaluation experts simultaneously record evaluation scores for the same bid."
    guarantee: "Exactly one score is persisted; loser sees ERR_BID_ALREADY_EVALUATED."
    error_id: ERR_BID_ALREADY_EVALUATED
    http_status: 409
    serialization: "First-writer-wins on Bid.bid_status compare-and-swap OPENED->EVALUATED."

  - scenario: "Contract signing and complaint upheld race on the same project."
    guarantee: "If complaint resolves first, sign returns ERR_PROJECT_FROZEN; if sign resolves first, complaint can still upheld but corrective_action is bounded to TERMINATE-class only."
    error_id: ERR_PROJECT_FROZEN
    http_status: 409
    serialization: "First-writer-wins on Project.project_status transition from AWARDED."

  - scenario: "Plan amendment begins while a child PlanItem's Project is in BIDDING_OPEN."
    guarantee: "Amendment is rejected to preserve plan-execution invariant."
    error_id: ERR_PLAN_HAS_ACTIVE_PROJECT
    http_status: 409
    serialization: "Read-check on PlanItem->Project status BEFORE writing ProcurementPlan.status; check uses serializable read of related Projects."

# =============================================================================
# §1.3  Calculation Rules Table
# =============================================================================
calculations:

  - name: plan_total_budget
    trigger: "Recomputed on every ProcurementPlan transition into PUBLISHED, and on every PlanItem item_status mutation while parent is PUBLISHED."
    algorithm: aggregation
    formula: |
      total_budget_cents = SUM(PlanItem.budget_cents WHERE plan_id = self.id
                                AND item_status IN {APPROVED, PUBLISHED, EXECUTED})
      # CANCELLED and REJECTED items do NOT contribute.
    input_set: "PlanItems with item_status IN {APPROVED, PUBLISHED, EXECUTED} only."
    constants: {}
    precision: "integer cents, no rounding"
    variants: []

  - name: bid_final_score
    trigger: "Computed by side_effects of Bid OPENED -> EVALUATED (POST /procurement/bids/{id}/record-evaluation)."
    algorithm: weighted_scoring
    formula: |
      # Two variants of THE SAME calculation, gated by Project.evaluation_method.
      # Variant LOWEST_PRICE:
      #   final_score := bid_price_cents   # smaller is better; tie-break = earliest created_at
      # Variant COMPREHENSIVE_SCORING:
      #   # Step 1: per-component sub-scores (each 0..100, two decimal places, round_half_up)
      #   price_sub_score = round(100.0 * (lowest_bid_price_cents / bid_price_cents), 2)
      #     # lowest_bid_price_cents = MIN(bid_price_cents) over Bids with bid_status IN {OPENED, EVALUATED}
      #   technical_sub_score = round(100.0 * technical_score_raw / max_technical_score, 2)
      #   qualification_sub_score = round(100.0 * |intersect(supplier.qualifications, doc.qualification_requirements)|
      #                                          / max(1, |doc.qualification_requirements|), 2)
      #   # Step 2: weighted sum, then round (rounding ORDER pinned: round each component first, THEN sum, then round)
      #   final_score = round( weight_price * price_sub_score
      #                      + weight_technical * technical_sub_score
      #                      + weight_qualification * qualification_sub_score, 2)
      #   # Tie-break (descending final_score): smaller bid_price_cents first; then earliest created_at.
    input_set: |
      For LOWEST_PRICE: bid's own bid_price_cents only.
      For COMPREHENSIVE_SCORING: the bid plus the population of other Bids on the same project
      with bid_status IN {OPENED, EVALUATED} at the time the evaluation is recorded (so the
      'lowest_bid_price_cents' reference value may evolve as evaluations are recorded).
    constants:
      ROUNDING_MODE: "round_half_up"
      DECIMAL_PLACES: 2
    precision: "Per-component scores rounded to 2 decimal places (round_half_up) BEFORE weighted summation; final weighted score rounded once more to 2 decimal places."
    variants:
      - name: lowest_price
        when: "Project.evaluation_method = LOWEST_PRICE"
        difference: "final_score = bid_price_cents (integer); winner = MIN; tie-break = earliest created_at."
      - name: comprehensive_scoring
        when: "Project.evaluation_method = COMPREHENSIVE_SCORING"
        difference: "Weighted sum of three sub-scores; winner = MAX final_score; rounding order pinned (per-component then weighted-sum)."

  - name: committee_random_selection
    trigger: "POST /procurement/projects/{id}/form-committee"
    algorithm: topological
    formula: |
      # Deterministic given selection_seed.
      eligible = [Expert in expert pool with conflict_cleared = true
                  AND expert.id NOT IN (suppliers' principals on this project)
                  AND expert.id NOT IN agency's own staff for this project]
      sort eligible by sha256(selection_seed || "|" || expert.id) ASCENDING (lexicographic on hex)
      pick first N where N = requested_size; reject if eligible_count < N.
      For each picked expert, append {expert_id, selected_at = ClockState.current_time, conflict_cleared = true}.
    input_set: "Experts in eligible pool minus conflict-of-interest exclusions for this project."
    constants:
      MIN_SIZE: 3
      MAX_SIZE: 9
    precision: "integer indices"
    variants: []

  - name: contract_consistency_check
    trigger: "Precondition for Contract PENDING_SIGNATURE -> ACTIVE."
    algorithm: aggregation
    formula: |
      # Contract is consistent iff ALL of:
      #   Contract.contract_amount_cents == Award.award_amount_cents
      #   Contract.payment_terms == TenderDocument(version=tender_version_at_award).commercial_spec
      #   Contract.supplier_id == Bid(id=Award.winning_bid_id).supplier_id
      # Returns boolean pass/fail; on fail, raise ERR_CONTRACT_INCONSISTENT.
    input_set: "The Contract being signed, its Award, the Bid the Award references, and the TenderDocument version pinned at award time."
    constants: {}
    precision: "exact equality"
    variants: []

  - name: prescreen_eligibility
    trigger: "(a) When a Bid is created (side effect: snapshot prescreen_passed). (b) When Project transitions BIDDING_OPEN -> BIDDING_CLOSED, re-evaluated to catch suppliers blacklisted after submission."
    algorithm: threshold
    formula: |
      passes_prescreen = (
        supplier.registration_status = VERIFIED
        AND (supplier.blacklist_until is null OR supplier.blacklist_until <= ClockState.current_time)
        AND supplier.credit_score >= MIN_CREDIT_SCORE   # boundary precision: >= (600 passes, 599 fails)
        AND set(project.required_qualifications) subset of set(supplier.qualifications)
      )
    input_set: "One Supplier and one Project."
    constants:
      MIN_CREDIT_SCORE: 600
    precision: "exact integer comparison"
    variants: []

  - name: criteria_weight_sum_check
    trigger: "Precondition for TenderDocument DRAFT -> PUBLISHED (only when evaluation_method = COMPREHENSIVE_SCORING)."
    algorithm: threshold
    formula: |
      # For COMPREHENSIVE_SCORING: weight_price + weight_technical + weight_qualification MUST equal 1.0 (±1e-9).
      # Each weight MUST be in (0, 1).
    input_set: "TenderDocument.evaluation_criteria object."
    constants:
      EPSILON: 1.0e-9
    precision: "float tolerance 1e-9"
    variants: []

# =============================================================================
# §1.4  Validation Rules Table (priority-ordered)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "Request must carry X-User-Role and X-User-ID headers; both non-empty."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the declared roles in §1.7."
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "X-User-Role must be authorized for this endpoint per §1.5.roles."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every {id} path parameter resolves to an existing entity, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every foreign-key id in request body resolves to an existing entity."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 6
    category: state
    check: "The target entity is in a state from which the requested transition is declared in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties — actor's role must satisfy SoD rules: ProcurementOfficer for agency A cannot also be an EvaluationExpert on a Project of agency A; a Supplier cannot be a Regulator; the same X-User-ID may not have appeared as both ProcurementOfficer and EvaluationExpert on the same project's audit log."
    error_id: ERR_CONFLICT_OF_INTEREST
    http_status: 403
    applies_to: ["POST /procurement/bids/{id}/record-evaluation", "POST /procurement/projects/{id}/form-committee", "POST /procurement/complaints/{id}/uphold", "POST /procurement/complaints/{id}/dismiss"]

  - priority: 8
    category: business_safety
    check: "Supplier must not be currently blacklisted (blacklist_until > ClockState.current_time) for any bid-related write."
    error_id: ERR_SUPPLIER_BLACKLISTED
    http_status: 403
    applies_to: ["POST /procurement/projects/{id}/bids", "POST /procurement/contracts"]

  - priority: 9
    category: business_temporal
    check: "Bid submission time (ClockState.current_time) must be strictly < Project.bid_submission_deadline."
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: ["POST /procurement/projects/{id}/bids", "POST /procurement/bids/{id}/withdraw"]

  - priority: 10
    category: business_temporal
    check: "Query submission time must be strictly < Project.query_window_close_at."
    error_id: ERR_QUERY_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /procurement/projects/{id}/queries"]

  - priority: 11
    category: business_temporal
    check: "Project.bid_opening_at must be strictly > Project.bid_submission_deadline and Project.query_window_close_at must be strictly < Project.bid_submission_deadline."
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: ["POST /procurement/projects", "PATCH /procurement/projects/{id}"]

  - priority: 12
    category: business_referential
    check: "A Project may only be created when its plan_item.item_status = PUBLISHED."
    error_id: ERR_PLAN_ITEM_NOT_PUBLISHED
    http_status: 409
    applies_to: ["POST /procurement/projects"]

  - priority: 13
    category: business_referential
    check: "TenderDocument.evaluation_criteria weights MUST sum to 1.0 ± 1e-9 with all weights in (0,1) when COMPREHENSIVE_SCORING."
    error_id: ERR_WEIGHTS_INVALID
    http_status: 422
    applies_to: ["POST /procurement/projects/{id}/tender-document", "POST /procurement/tender-documents/{id}/publish"]

  - priority: 14
    category: business_referential
    check: "Bid.tender_document_version MUST equal the project's TenderDocument.version where doc_status = PUBLISHED at submission time."
    error_id: ERR_TENDER_VERSION_MISMATCH
    http_status: 409
    applies_to: ["POST /procurement/projects/{id}/bids"]

  - priority: 15
    category: business_constraint
    check: "Committee size must be odd integer in [3,9] and eligible pool >= requested size after conflict-of-interest exclusions."
    error_id: ERR_COMMITTEE_SIZE_INVALID
    http_status: 422
    applies_to: ["POST /procurement/projects/{id}/form-committee"]

  - priority: 16
    category: business_constraint
    check: "Contract clauses must match tender (clauses consistency)."
    error_id: ERR_CONTRACT_INCONSISTENT
    http_status: 422
    applies_to: ["POST /procurement/contracts", "POST /procurement/contracts/{id}/sign"]

  - priority: 17
    category: business_fiscal
    check: "Resulting Contract.contract_amount_cents after a ContractAmendment MUST be > 0 AND <= 1.20 * Award.award_amount_cents (20% regulatory amendment ceiling)."
    error_id: ERR_AMENDMENT_EXCEEDS_CAP
    http_status: 409
    applies_to: ["POST /procurement/contracts/{id}/file-amendment"]

  - priority: 18
    category: business_fiscal
    check: "Bid.bid_price_cents MUST be <= Project.estimated_value_cents."
    error_id: ERR_BID_EXCEEDS_CEILING
    http_status: 409
    applies_to: ["POST /procurement/projects/{id}/bids"]

  - priority: 19
    category: business_constraint
    check: "Optimistic concurrency: if request body carries a `version` field, it MUST equal the entity's current version. Applies to PATCH endpoints."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# §1.5  API Endpoint Table
# =============================================================================
endpoints:

  # ---- Suppliers ----
  - method: POST
    path: "/procurement/suppliers"
    description: "Register a new supplier (registration_status starts PENDING)."
    roles: [Supplier, ProcurementOfficer]
    code: 201
    input: [legal_name, tax_id, "qualifications?"]
    output: Supplier
    side_effects: []

  - method: POST
    path: "/procurement/suppliers/{id}/verify"
    description: "Verify supplier qualifications; PENDING -> VERIFIED."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Supplier
    side_effects: ["registration_status -> VERIFIED"]

  - method: POST
    path: "/procurement/suppliers/{id}/blacklist"
    description: "Blacklist a supplier until a given UTC timestamp."
    roles: [Regulator]
    code: 200
    input: [blacklist_until]
    output: Supplier
    side_effects:
      - "registration_status -> BLACKLISTED"
      - "All SUBMITTED Bids by this supplier are DISQUALIFIED"

  - method: GET
    path: "/procurement/suppliers/{id}"
    description: "Get a supplier."
    roles: [Supplier, ProcurementOfficer, Regulator]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  # ---- Procurement Plans ----
  - method: POST
    path: "/procurement/plans"
    description: "Create a new procurement plan (DRAFT)."
    roles: [ProcurementOfficer]
    code: 201
    input: [agency_id, fiscal_year]
    output: ProcurementPlan
    side_effects: []

  - method: POST
    path: "/procurement/plans/{id}/items"
    description: "Add a PlanItem to a DRAFT plan."
    roles: [ProcurementOfficer]
    code: 201
    input: [title, category, budget_cents]
    output: PlanItem
    side_effects: []

  - method: POST
    path: "/procurement/plan-items/{id}/approve"
    description: "Approve a PROPOSED plan item."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: PlanItem
    side_effects: ["recompute parent plan_total_budget"]

  - method: POST
    path: "/procurement/plan-items/{id}/reject"
    description: "Reject a PROPOSED plan item."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: PlanItem
    side_effects: []

  - method: POST
    path: "/procurement/plan-items/{id}/cancel"
    description: "Cancel a PUBLISHED plan item that has no Project."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: PlanItem
    side_effects: ["recompute parent plan_total_budget"]

  - method: POST
    path: "/procurement/plans/{id}/submit-review"
    description: "Submit plan from DRAFT to UNDER_REVIEW."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: ProcurementPlan
    side_effects: []

  - method: POST
    path: "/procurement/plans/{id}/publish"
    description: "Publish plan (UNDER_REVIEW -> PUBLISHED or AMENDING -> PUBLISHED)."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: ProcurementPlan
    side_effects: ["PlanItems APPROVED -> PUBLISHED; recompute total_budget_cents; set published_at on first publish; increment amendment_round on AMENDING -> PUBLISHED"]

  - method: POST
    path: "/procurement/plans/{id}/reject"
    description: "Regulator rejects an UNDER_REVIEW plan."
    roles: [Regulator]
    code: 200
    input: []
    output: ProcurementPlan
    side_effects: ["All PROPOSED/APPROVED items -> REJECTED"]

  - method: POST
    path: "/procurement/plans/{id}/begin-amendment"
    description: "Start amendment cycle on a PUBLISHED plan."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: ProcurementPlan
    side_effects: []

  - method: POST
    path: "/procurement/plans/{id}/archive"
    description: "Archive a PUBLISHED plan where all items are terminal."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: ProcurementPlan
    side_effects: []

  - method: GET
    path: "/procurement/plans"
    description: "List plans, paginated, filterable by status & fiscal_year."
    roles: [ProcurementOfficer, Regulator, Supplier]
    code: 200
    input: ["status?", "fiscal_year?", "limit?", "offset?"]
    output: ProcurementPlan[]
    side_effects: []

  - method: GET
    path: "/procurement/plans/{id}"
    description: "Get a plan (includes total_budget_cents)."
    roles: [ProcurementOfficer, Regulator, Supplier]
    code: 200
    input: []
    output: ProcurementPlan
    side_effects: []

  # ---- Projects + Tender Documents ----
  - method: POST
    path: "/procurement/projects"
    description: "Create a Project for a PUBLISHED PlanItem."
    roles: [ProcurementOfficer]
    code: 201
    input: [plan_item_id, title, evaluation_method, bid_submission_deadline, query_window_close_at, bid_opening_at, estimated_value_cents, required_qualifications]
    output: Project
    side_effects: []

  - method: POST
    path: "/procurement/projects/{id}/tender-document"
    description: "Create the (single) TenderDocument for a Project in DRAFT state."
    roles: [ProcurementOfficer]
    code: 201
    input: [template_id, technical_spec, commercial_spec, evaluation_criteria]
    output: TenderDocument
    side_effects: []

  - method: POST
    path: "/procurement/tender-documents/{id}/publish"
    description: "Publish or re-publish a tender document (handles DRAFT->PUBLISHED, AMENDING->PUBLISHED)."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: TenderDocument
    side_effects: ["set pinned_at; snapshot qualification_requirements; on initial publish: Project DRAFT -> PRESCREEN_OPEN; on AMENDING -> PUBLISHED: version += 1"]

  - method: POST
    path: "/procurement/tender-documents/{id}/clarify"
    description: "PUBLISHED -> CLARIFYING."
    roles: [ProcurementOfficer]
    code: 200
    input: [clarification_note]
    output: TenderDocument
    side_effects: []

  - method: POST
    path: "/procurement/tender-documents/{id}/finalize-clarification"
    description: "CLARIFYING -> PUBLISHED; version unchanged."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: TenderDocument
    side_effects: ["pinned_at refreshed"]

  - method: POST
    path: "/procurement/tender-documents/{id}/begin-amendment"
    description: "PUBLISHED -> AMENDING (forces all SUBMITTED bids to WITHDRAWN; reverts Project BIDDING_OPEN -> PRESCREEN_OPEN if applicable)."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: TenderDocument
    side_effects: ["force all bids WITHDRAWN; revert project status"]

  - method: GET
    path: "/procurement/projects/{id}"
    description: "Read project (includes computed counts)."
    roles: [ProcurementOfficer, Regulator, Supplier]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/procurement/projects/{id}/open-bidding"
    description: "PRESCREEN_OPEN -> BIDDING_OPEN."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/procurement/projects/{id}/close-bidding"
    description: "BIDDING_OPEN -> BIDDING_CLOSED (clock must be past bid_submission_deadline)."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Project
    side_effects: ["disqualify SUBMITTED bids failing prescreen at this moment"]

  - method: POST
    path: "/procurement/projects/{id}/cancel"
    description: "Cancel a project from PRESCREEN_OPEN or BIDDING_OPEN."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Project
    side_effects: ["TenderDocument -> SUPERSEDED; SUBMITTED bids -> WITHDRAWN"]

  # ---- Prescreening ----
  - method: POST
    path: "/procurement/projects/{id}/prescreen-results"
    description: "Publish project-specific pre-screening results (returns the snapshot)."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: "object"
    side_effects: ["Publishes a pre-screening list; suppliers can then read."]

  # ---- Bids ----
  - method: POST
    path: "/procurement/projects/{id}/bids"
    description: "Submit a bid against the current PUBLISHED TenderDocument version."
    roles: [Supplier]
    code: 201
    input: [supplier_id, tender_document_version, bid_price_cents, "technical_score_raw?"]
    output: Bid
    side_effects: ["snapshot prescreen_passed from calculations.prescreen_eligibility"]

  - method: POST
    path: "/procurement/bids/{id}/withdraw"
    description: "Supplier withdraws bid before deadline."
    roles: [Supplier]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: POST
    path: "/procurement/bids/{id}/record-evaluation"
    description: "Evaluation expert records evaluation for one bid (OPENED -> EVALUATED)."
    roles: [EvaluationExpert]
    code: 200
    input: ["technical_score_raw?"]
    output: Bid
    side_effects: ["compute final_score; append AuditLog"]

  - method: GET
    path: "/procurement/projects/{id}/bids"
    description: "List bids for a project (paginated)."
    roles: [ProcurementOfficer, Regulator, Supplier]
    code: 200
    input: ["bid_status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  # ---- Committee ----
  - method: POST
    path: "/procurement/projects/{id}/form-committee"
    description: "Deterministically form an EvaluationCommittee using selection_seed."
    roles: [ProcurementOfficer]
    code: 201
    input: [requested_size, selection_seed]
    output: EvaluationCommittee
    side_effects: ["calls calculations.committee_random_selection"]

  - method: POST
    path: "/procurement/committees/{id}/finalize"
    description: "EVALUATING -> FINALIZED once every OPENED bid is EVALUATED."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: EvaluationCommittee
    side_effects: []

  - method: POST
    path: "/procurement/projects/{id}/open-bid-ceremony"
    description: "BIDDING_CLOSED -> EVALUATING; opens all bids; committee starts evaluating."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Project
    side_effects: ["all SUBMITTED prescreen-passing bids -> OPENED; committee -> EVALUATING; AuditLog(BID_CEREMONY_RECORDED)"]

  # ---- Award ----
  - method: POST
    path: "/procurement/projects/{id}/decide-award"
    description: "EVALUATING -> AWARDED; creates Award (DECIDED)."
    roles: [ProcurementOfficer]
    code: 201
    input: []
    output: Award
    side_effects: ["winning bid -> AWARDED; other EVALUATED bids -> LOST; AuditLog"]

  - method: POST
    path: "/procurement/awards/{id}/publish"
    description: "DECIDED -> PUBLISHED; emits award announcement."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Award
    side_effects: ["published_at set; signals credit-information system"]

  # ---- Queries ----
  - method: POST
    path: "/procurement/projects/{id}/queries"
    description: "Supplier asks a tender question within query window."
    roles: [Supplier]
    code: 201
    input: [supplier_id, question]
    output: Query
    side_effects: []

  - method: POST
    path: "/procurement/queries/{id}/respond"
    description: "Procurement entity answers a query (OPEN -> ANSWERED)."
    roles: [ProcurementOfficer]
    code: 200
    input: [response]
    output: Query
    side_effects: []

  # ---- Complaints ----
  - method: POST
    path: "/procurement/projects/{id}/complaints"
    description: "Supplier files a complaint with the regulator."
    roles: [Supplier]
    code: 201
    input: [complainant_supplier_id, subject, narrative]
    output: Complaint
    side_effects: []

  - method: POST
    path: "/procurement/complaints/{id}/accept"
    description: "Regulator accepts the complaint for review."
    roles: [Regulator]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/procurement/complaints/{id}/uphold"
    description: "Regulator upholds the complaint and applies corrective_action."
    roles: [Regulator]
    code: 200
    input: [corrective_action]
    output: Complaint
    side_effects: ["see Complaint state machine"]

  - method: POST
    path: "/procurement/complaints/{id}/dismiss"
    description: "Regulator dismisses the complaint."
    roles: [Regulator]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/procurement/complaints/{id}/withdraw"
    description: "Complainant supplier withdraws a SUBMITTED complaint."
    roles: [Supplier]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  # ---- Contracts ----
  - method: POST
    path: "/procurement/contracts"
    description: "File a draft contract against a PUBLISHED Award."
    roles: [ProcurementOfficer]
    code: 201
    input: [project_id, award_id, supplier_id, contract_amount_cents, payment_terms]
    output: Contract
    side_effects: []

  - method: POST
    path: "/procurement/contracts/{id}/sign"
    description: "Run consistency check, sign contract via e-signature mock, ACTIVE."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["signature_ref set; Project -> CONTRACT_SIGNED; PlanItem -> EXECUTED; AuditLog"]

  - method: POST
    path: "/procurement/contracts/{id}/begin-amendment"
    description: "ACTIVE -> AMENDING."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/procurement/contracts/{id}/file-amendment"
    description: "File a ContractAmendment; AMENDING -> ACTIVE."
    roles: [ProcurementOfficer]
    code: 201
    input: [delta_amount_cents, reason]
    output: Contract
    side_effects: ["contract_amount_cents += delta; PlanItem.executed_amount_cents += delta; enforce 20% cap"]

  - method: POST
    path: "/procurement/contracts/{id}/record-payment"
    description: "External payment system mirrors a payment event onto the contract."
    roles: [ProcurementOfficer, Regulator]
    code: 200
    input: [amount_cents]
    output: Contract
    side_effects: ["paid_amount_cents += amount_cents"]

  - method: POST
    path: "/procurement/contracts/{id}/mark-executed"
    description: "ACTIVE -> EXECUTED when paid_amount_cents >= contract_amount_cents."
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/procurement/contracts/{id}/terminate"
    description: "Regulator terminates an ACTIVE contract."
    roles: [Regulator]
    code: 200
    input: [reason]
    output: Contract
    side_effects: ["PlanItem.executed_amount_cents -= (contract_amount_cents - paid_amount_cents)"]

  # ---- Audit + utility ----
  - method: GET
    path: "/procurement/audit-logs"
    description: "List AuditLog entries (paginated, filterable by target_type, target_id, action)."
    roles: [Regulator]
    code: 200
    input: ["target_type?", "target_id?", "action?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  - method: POST
    path: "/_clock/advance"
    description: "Test-driving endpoint: advance ClockState.current_time forward. Idempotent on (target_iso)."
    roles: [ProcurementOfficer, Regulator, Supplier, EvaluationExpert]
    code: 200
    input: [target_iso]
    output: ClockState
    side_effects: ["expire queries past query_window_close_at; auto-disqualification only on explicit close-bidding"]

  - method: POST
    path: "/_events/emit"
    description: "Test-driving endpoint: emit an external event from credit-information / regulatory system (e.g., update credit_score, blacklist signal)."
    roles: [Regulator]
    code: 200
    input: [system, payload]
    output: "object"
    side_effects: ["Supplier.credit_score may be updated; blacklist_until may be set"]

# =============================================================================
# §1.6  Error Code Catalog
# =============================================================================
errors:

  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Missing X-User-Role or X-User-ID."
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not a declared role."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for endpoint per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not resolve to an entity."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Foreign-key id in body does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity not in a valid source state for the requested transition."
  - id: ERR_CONFLICT_OF_INTEREST
    http: 403
    condition: "Segregation-of-duties rule violated (same person acting in two incompatible roles on one project, or expert with conflict)."
  - id: ERR_SUPPLIER_BLACKLISTED
    http: 403
    condition: "Supplier is currently blacklisted (blacklist_until > ClockState.current_time)."
  - id: ERR_DEADLINE_PASSED
    http: 409
    condition: "Bid-related action attempted after Project.bid_submission_deadline."
  - id: ERR_QUERY_WINDOW_CLOSED
    http: 409
    condition: "Query attempted after Project.query_window_close_at."
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "Invariant query_window_close_at < bid_submission_deadline < bid_opening_at violated on Project create/update."
  - id: ERR_PLAN_ITEM_NOT_PUBLISHED
    http: 409
    condition: "Attempting to create a Project for a PlanItem whose item_status is not PUBLISHED."
  - id: ERR_WEIGHTS_INVALID
    http: 422
    condition: "evaluation_criteria weights do not sum to 1.0 ± 1e-9 or any weight outside (0,1)."
  - id: ERR_TENDER_VERSION_MISMATCH
    http: 409
    condition: "Bid.tender_document_version does not match current PUBLISHED TenderDocument.version."
  - id: ERR_COMMITTEE_SIZE_INVALID
    http: 422
    condition: "Requested committee size not in {3,5,7,9} or eligible pool insufficient after CoI."
  - id: ERR_CONTRACT_INCONSISTENT
    http: 422
    condition: "Contract clauses fail consistency check vs tender / award."
  - id: ERR_AMENDMENT_EXCEEDS_CAP
    http: 409
    condition: "Contract amendment pushes amount above 1.20 * Award.award_amount_cents or to <= 0."
  - id: ERR_BID_EXCEEDS_CEILING
    http: 409
    condition: "bid_price_cents > Project.estimated_value_cents."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC mismatch on PATCH."
  - id: ERR_DUPLICATE_BID
    http: 409
    condition: "A non-terminal bid by the same supplier already exists for this project."
  - id: ERR_BID_ALREADY_EVALUATED
    http: 409
    condition: "Bid is already EVALUATED."
  - id: ERR_PROJECT_FROZEN
    http: 409
    condition: "Project is currently FROZEN (complaint upheld) and the requested mutation is therefore blocked."
  - id: ERR_PLAN_HAS_ACTIVE_PROJECT
    http: 409
    condition: "Cannot begin plan amendment while a child PlanItem has a Project in BIDDING_OPEN/EVALUATING/AWARDED/CONTRACT_SIGNED."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic input validation (missing field, wrong type, value out of declared range). Used when no more specific code applies."

# =============================================================================
# §1.7  RBAC Matrix
# =============================================================================
roles:

  - name: ProcurementOfficer
    description: "Acts on behalf of the procurement entity (government agency). Creates and manages procurement plans, projects, tender documents, queries, contracts."
    identity: "opaque"
    exclusive_operations:
      - "POST /procurement/plans"
      - "POST /procurement/plans/{id}/submit-review"
      - "POST /procurement/plans/{id}/publish"
      - "POST /procurement/plans/{id}/begin-amendment"
      - "POST /procurement/plans/{id}/archive"
      - "POST /procurement/plan-items/{id}/approve"
      - "POST /procurement/plan-items/{id}/reject"
      - "POST /procurement/plan-items/{id}/cancel"
      - "POST /procurement/plans/{id}/items"
      - "POST /procurement/projects"
      - "POST /procurement/projects/{id}/tender-document"
      - "POST /procurement/tender-documents/{id}/publish"
      - "POST /procurement/tender-documents/{id}/clarify"
      - "POST /procurement/tender-documents/{id}/finalize-clarification"
      - "POST /procurement/tender-documents/{id}/begin-amendment"
      - "POST /procurement/projects/{id}/open-bidding"
      - "POST /procurement/projects/{id}/close-bidding"
      - "POST /procurement/projects/{id}/cancel"
      - "POST /procurement/projects/{id}/prescreen-results"
      - "POST /procurement/projects/{id}/form-committee"
      - "POST /procurement/projects/{id}/open-bid-ceremony"
      - "POST /procurement/projects/{id}/decide-award"
      - "POST /procurement/awards/{id}/publish"
      - "POST /procurement/queries/{id}/respond"
      - "POST /procurement/contracts"
      - "POST /procurement/contracts/{id}/sign"
      - "POST /procurement/contracts/{id}/begin-amendment"
      - "POST /procurement/contracts/{id}/file-amendment"
      - "POST /procurement/contracts/{id}/mark-executed"
      - "POST /procurement/committees/{id}/finalize"
      - "POST /procurement/suppliers/{id}/verify"
    shared_operations:
      - "GET /procurement/plans"
      - "GET /procurement/plans/{id}"
      - "GET /procurement/projects/{id}"
      - "GET /procurement/projects/{id}/bids"
      - "GET /procurement/suppliers/{id}"
      - "POST /procurement/suppliers"
      - "POST /procurement/contracts/{id}/record-payment"
      - "POST /_clock/advance"
    forbidden_operations:
      - "POST /procurement/bids/{id}/record-evaluation     # ConflictOfInterest: same agency cannot evaluate own project"
      - "POST /procurement/projects/{id}/bids               # ProcurementOfficer cannot submit bids"
      - "POST /procurement/complaints/{id}/uphold           # Regulator only"

  - name: Supplier
    description: "A registered supplier company; can register, submit bids, ask queries, file complaints, withdraw."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /procurement/projects/{id}/bids"
      - "POST /procurement/bids/{id}/withdraw"
      - "POST /procurement/projects/{id}/queries"
      - "POST /procurement/projects/{id}/complaints"
      - "POST /procurement/complaints/{id}/withdraw"
    shared_operations:
      - "POST /procurement/suppliers"
      - "GET /procurement/suppliers/{id}"
      - "GET /procurement/plans"
      - "GET /procurement/plans/{id}"
      - "GET /procurement/projects/{id}"
      - "GET /procurement/projects/{id}/bids"
      - "POST /_clock/advance"
    forbidden_operations:
      - "All POST endpoints under /plan-items, /plans except read"
      - "POST /procurement/bids/{id}/record-evaluation"
      - "POST /procurement/contracts/*"
      - "POST /procurement/complaints/{id}/uphold|accept|dismiss"

  - name: EvaluationExpert
    description: "An external evaluation expert randomly selected for an EvaluationCommittee. Identity is opaque (operator id), but conflict-of-interest checks compare X-User-ID against project's procurement officer ids and supplier principal ids snapshotted in committee."
    identity: "opaque"
    exclusive_operations:
      - "POST /procurement/bids/{id}/record-evaluation"
    shared_operations:
      - "GET /procurement/projects/{id}"
      - "GET /procurement/projects/{id}/bids"
      - "POST /_clock/advance"
    forbidden_operations:
      - "POST /procurement/projects/* (writes other than record-evaluation)"
      - "POST /procurement/contracts/*"
      - "POST /procurement/complaints/*"

  - name: Regulator
    description: "Acts on behalf of the regulatory authority; reviews complaints, handles blacklist signals, terminates contracts."
    identity: "opaque"
    exclusive_operations:
      - "POST /procurement/plans/{id}/reject"
      - "POST /procurement/suppliers/{id}/blacklist"
      - "POST /procurement/complaints/{id}/accept"
      - "POST /procurement/complaints/{id}/uphold"
      - "POST /procurement/complaints/{id}/dismiss"
      - "POST /procurement/contracts/{id}/terminate"
      - "GET /procurement/audit-logs"
      - "POST /_events/emit"
    shared_operations:
      - "GET /procurement/plans"
      - "GET /procurement/plans/{id}"
      - "GET /procurement/projects/{id}"
      - "GET /procurement/projects/{id}/bids"
      - "GET /procurement/suppliers/{id}"
      - "POST /procurement/contracts/{id}/record-payment"
      - "POST /_clock/advance"
    forbidden_operations:
      - "POST /procurement/projects/{id}/bids"
      - "POST /procurement/bids/{id}/record-evaluation"
      - "POST /procurement/projects/{id}/decide-award"
