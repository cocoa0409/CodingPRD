              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub_v: "$.data.version" }
            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 10000000, offered_retention_usd: 250000, offered_side_c_sublimit_usd: 5000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
              captures: { quote_id: "$.data.id" }
            - call: "GET /dno/quotes/${quote_id}/exclusion-terms"
              payload: {}
              as: Underwriter
              captures: { conduct_term_id: "$.data[0].id" }
            - call: "POST /dno/exclusion-terms/${conduct_term_id}/resolve"
              payload: { resolution: "AGREE" }
              as: RiskManager
              as_user_id: "${insured_id}"
            - call: "GET /dno/insureds/${insured_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ins_v1: "$.data.version" }
          trigger:
            - call: "PATCH /dno/insureds/${insured_id}"
              payload: { expected_insured_version: "${ins_v1}", control_status: "CHANGE_OF_CONTROL_ANNOUNCED", change_of_control_date: "2026-12-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ins_v2: "$.data.version" }
            - call: "POST /dno/quotes/${quote_id}/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
            - call: "PATCH /dno/insureds/${insured_id}"
              payload: { expected_insured_version: "${ins_v2}", control_status: "INDEPENDENT" }
              as: ComplianceOfficer
            - call: "POST /dno/quotes/${quote_id}/accept"
              payload: {}
              as: RiskManager
              as_user_id: "${insured_id}"
          assert:
            - "the captured ins_v1 is 1 and trigger call 1 returns 200 with control_status == CHANGE_OF_CONTROL_ANNOUNCED, change_of_control_date == 2026-12-01T00:00:00Z and version == 2 (the captured ins_v2)"
            - "trigger call 2 returns 409 ERR_CONTROL_CHANGE_BLOCKS_BIND: the quote is untouched OFFERED, unexpired and fully negotiated, so the failing precondition is purely the grandparent insured's control_status"
            - "after trigger call 2, GET /dno/quotes/${quote_id} still returns status == OFFERED, GET /dno/policies?quote_id=${quote_id} returns total_count == 0, and GET /dno/insureds/${insured_id} still returns version == 2 with aggregate_bound_side_c_usd == 0"
            - "trigger call 3 returns 200 with control_status == INDEPENDENT and version == 3; change_of_control_date may be left as stored because ERR_CONDITIONAL_FIELD_REQUIRED only demands it when control_status != INDEPENDENT"
            - "trigger call 4 now returns 201 with coverage_status == INCEPTED and gross_premium_usd == 236468.57 — the identical request that failed at trigger call 2 succeeds once the other entity's state is reverted"
