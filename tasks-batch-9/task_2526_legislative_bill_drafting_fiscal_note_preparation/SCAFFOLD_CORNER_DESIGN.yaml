              payload: { submission_note: "Round one filed." }
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /fiscal-note-requests/${n1_id}/return"
              payload: { return_reason: "Operating assumption understated." }
              as: FiscalOfficer
            - call: "POST /fiscal-note-requests/${n1_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${nv3}", fiscal_year: 2027, scenario: "BASELINE", personnel_cost_cents: 5000000, operating_cost_cents: 2000000, one_time_cost_cents: 0, fte_count: 1.0, revenue_impact_cents: 0, assumption_note: "Round two line filed against a pre-return version." }
