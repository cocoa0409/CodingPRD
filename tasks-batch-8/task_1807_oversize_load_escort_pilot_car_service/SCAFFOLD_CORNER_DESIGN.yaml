      - name: ownership_forbidden_cross_principal
        claim_type: role_denial
        grounds: ["validations[priority=6]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Entity-backed identity binds the caller: CarrierRep of carrier B cannot cancel carrier A's job, and EscortOperator E2 cannot accept E1's assignment — distinct from role denial (the roles are correct)."
        test_recipe:
          setup: ["Carriers A and B; job of carrier A QUOTED; escorts E1/E2 with an OFFERED REAR assignment to E1 on a booked TX job of carrier A"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Owner A", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_a: $.data.id } }
            - { call: "POST /carriers", payload: { carrier_name: "Owner B", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_b: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "E1", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc1: $.data.id } }
