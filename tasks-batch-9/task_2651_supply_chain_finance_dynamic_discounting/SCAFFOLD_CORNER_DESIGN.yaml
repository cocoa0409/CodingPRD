  # =========================================================================
  # Section 8 - From Cross-Cutting Complexity Layers
  # =========================================================================
  - section: complexity_layers
    instances:
      - name: stale_expected_invoice_version_on_offer_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.offer-create-stale-invoice
          - errors.ERR_STALE_INVOICE_VERSION
          - state_machines.Invoice[OFFERED -> OFFERED]
          - endpoints[POST /discount-offers]
        distinguishing_aspect: |
          The whole point of the rule is that the first successful create leaves the invoice in the
          same status (OFFERED -> OFFERED self-edge) while still bumping version, so status alone can
          never tell the second writer its view is stale. Replaying the version read before the
          first create must therefore yield 412 ERR_STALE_INVOICE_VERSION - not a success and not an
          invalid-state error - and the identical payload with the refreshed version must succeed and
          supersede the first offer.
        test_recipe:
          setup:
            - "Buyer with an OPEN SUPPLIER_NAMED programme, one ACTIVE Supplier, one LIVE session, one ELIGIBLE invoice of 100000 cents"
            - "The invoice version is read once before any offer exists and that value is replayed later"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
