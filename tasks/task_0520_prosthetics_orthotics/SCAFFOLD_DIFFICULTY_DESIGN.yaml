  - rule_id: compensating_invariant
    instances:
      - name: ledger_conserved_under_deny_then_overturn
        grounds:
          - state_machines.ClaimLine.SUBMITTED_to_DENIED
          - state_machines.ClaimLine.DENIED_to_ADJUDICATED
          - calculations.order_allowed_total
          - entities.DeviceOrder.fields.allowed_total_cents
        distinguishing_aspect: |
          Conserved quantity = DeviceOrder.allowed_total_cents (a money ledger). Adjudicating a line
          to 30000 then denying it (allowed_total -> 0) then appeal-overturning it must restore
          allowed_total_cents to EXACTLY sum over ADJUDICATED lines = 30000; no cent of drift.
          Invariant: allowed_total_cents == sum(cl.allowed_cents where adjudication_status==ADJUDICATED).
        test_recipe:
          setup:
            - "Delivered COMMERCIAL orthosis order with one SUBMITTED line (NONE, fee 30000 x1)."
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
