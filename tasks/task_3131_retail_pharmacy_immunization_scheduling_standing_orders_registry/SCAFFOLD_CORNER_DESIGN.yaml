            - call: "POST /immunization/appointments/${appt_a2}/review-consent"
              payload: { expected_appointment_version: "${appt_a2_v + 2}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
            - call: "PUT /immunization/stores/${store_s2}"
              payload: { status: "SUSPENDED" }
              as: StoreManager
          trigger:
            - call: "POST /immunization/appointments/${appt_a2}/administer"
              payload: { lot_id: "${lot_lf}", expected_lot_version: 1 }
              as: Immunizer
              as_user_id: "user-imm-1"
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s2}", patient_id: "${pat_p}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T11:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
          assert:
            - "lot LE created with expiration 2026-08-31 is not administerable today (expiration rule: no administration on or after expiration_date) — verified via GET showing status RELEASED but eligibility excludes it"
            - "administer at SUSPENDED store S2 returns 409 ERR_STORE_SUSPENDED"
            - "new booking at SUSPENDED store S2 returns 409 ERR_STORE_SUSPENDED"

      - name: walk_in_bypasses_slot_conflict_but_not_eligibility
        claim_type: satisfaction_pass
        grounds: ["validations[priority=10]", entities.ImmunizationAppointment.fields.is_walk_in]
        distinguishing_aspect: "A walk-in booking inside another appointment's 15-minute slot succeeds (slot check bypassed), while a non-walk-in at the same instant fails ERR_SLOT_CONFLICT — same interval, different flag."
        test_recipe:
          setup: ["store S; product FLU; protocol; patients P1/P2/P3; non-walk-in appointment at 10:00 occupies [10:00,10:15)"]
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-25", state_code: "CA", address_line: "25 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat W1", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p1: $.data.id }
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat W2", date_of_birth: "1981-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p2: $.data.id }
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat W3", date_of_birth: "1982-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p3: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p1}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-02T10:00:00Z" }
              as: PharmacyTechnician
          trigger:
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p2}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-02T10:05:00Z" }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p3}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-02T10:05:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_wi: $.data.id, appt_wi_status: $.data.status }
          assert:
            - "non-walk-in at 10:05 returns 409 ERR_SLOT_CONFLICT"
            - "captured appt_wi_status == SCHEDULED — walk-in at the same 10:05 instant bypasses slot-availability"

      - name: clinic_event_window_malformed_and_close_before_end
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_EVENT_STILL_RUNNING]", entities.ClinicEvent.fields.event_end]
        distinguishing_aspect: "Clinic event creation with event_end <= event_start fails 400/409 ERR_EVENT_STILL_RUNNING (malformed window); close before event_end fails 409 ERR_EVENT_STILL_RUNNING."
        test_recipe:
          setup: ["store S; product FLU; lot L1 RELEASED 10 doses"]
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-26", state_code: "CA", address_line: "26 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 10 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Acme Corp", event_start: "2026-09-01T10:00:00Z", event_end: "2026-09-01T12:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 4 }
              as: StoreManager
              captures: { event_e: $.data.id }
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T11:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Bad Window", event_start: "2026-09-02T12:00:00Z", event_end: "2026-09-02T12:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 1 }
              as: StoreManager
            - call: "POST /immunization/clinic-events/${event_e}/close"
              payload: {}
              as: StoreManager
          assert:
            - "creation with event_end == event_start returns ERR_EVENT_STILL_RUNNING (window malformed: end must be strictly after start)"
            - "close at 11:00 (before event_end 12:00) returns 409 ERR_EVENT_STILL_RUNNING; event remains ACTIVE"

      - name: observation_reaction_requires_escalation_and_notes
        claim_type: violation_to_error
        grounds: [state_machines.ObservationSession.IN_PROGRESS_to_ESCALATED, "errors[ERR_REACTION_MUST_ESCALATE]", "errors[ERR_REACTION_NOTES_REQUIRED]", "errors[ERR_NOT_ASSIGNED_OBSERVER]"]
        distinguishing_aspect: "Escalate with empty reaction_notes fails 400 ERR_REACTION_NOTES_REQUIRED; after escalation the session is ESCALATED and complete fails 409 ERR_SESSION_NOT_IN_PROGRESS; complete by a different observer X-User-ID fails 403 ERR_NOT_ASSIGNED_OBSERVER."
        test_recipe:
          setup: ["full administration completed for non-high-risk patient (15-minute observation); session OS IN_PROGRESS started 10:00"]
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-27", state_code: "CA", address_line: "27 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Obs", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false } }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments/${appt_a}/review-consent"
              payload: { expected_appointment_version: "${appt_a_v + 2}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
            - call: "POST /immunization/appointments/${appt_a}/administer"
              payload: { lot_id: "${lot_l1}", expected_lot_version: 1 }
              as: Immunizer
              as_user_id: "user-imm-1"
              captures: { rec_id: $.data.id }
            - call: "GET /immunization/immunization-records/${rec_id}/observation-sessions"
              as: ObservationMonitor
              captures: { obs_id: "$.data[0].id" }
          trigger:
            - call: "POST /immunization/observation-sessions/${obs_id}/escalate"
              payload: { adverse_reaction: true, reaction_notes: "" }
              as: ObservationMonitor
              as_user_id: "user-obs-1"
            - call: "POST /immunization/observation-sessions/${obs_id}/escalate"
              payload: { adverse_reaction: true, reaction_notes: "urticaria on left arm" }
              as: ObservationMonitor
              as_user_id: "user-obs-1"
              captures: { obs_status: $.data.status, obs_reaction: $.data.adverse_reaction }
            - call: "POST /immunization/observation-sessions/${obs_id}/complete"
              payload: {}
              as: ObservationMonitor
              as_user_id: "user-obs-1"
          assert:
            - "escalate with empty reaction_notes returns 400 ERR_REACTION_NOTES_REQUIRED"
            - "captured obs_status == ESCALATED and obs_reaction == true; adverse-event audit flag written to the parent record (record stays COMPLETED, registry unaffected)"
            - "complete after escalation returns 409 ERR_SESSION_NOT_IN_PROGRESS (terminal)"
