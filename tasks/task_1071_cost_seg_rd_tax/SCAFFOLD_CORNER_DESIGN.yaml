  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: amended_return_stale_study_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[amended-return-create-stale-study]", "errors[ERR_STALE_STUDY_VERSION]"]
        distinguishing_aspect: "After one amended-return create advances study.version, a second create still carrying the earlier expected_study_version is rejected with ERR_STALE_STUDY_VERSION (412)."
        test_recipe:
          setup: ["A DELIVERED look-back cost-seg study; version captured as sv at deliver; one amended return already created (study.version now sv+1)"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "OC Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "E", email: "e12@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "R", email: "r12@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "oc", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024, is_look_back: true }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/finalize", payload: {}, as: Reviewer, as_user_id: "${rev}" }
            - { call: "POST /studies/${st}/deliver", payload: {}, as: CPA, captures: { sv: "$.data.version" } }
            - { call: "POST /studies/${st}/amended-returns", payload: { amended_tax_year: 2024, expected_study_version: "${sv}" }, as: StudyManager, captures: { am1: "$.data.id" } }
          trigger:
            - { call: "POST /studies/${st}/amended-returns", payload: { amended_tax_year: 2024, expected_study_version: "${sv}" }, as: StudyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_STALE_STUDY_VERSION"
            - "http status == 412"

      - name: study_version_increments_on_scope_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Study.fields.status, state_machines.Study.DRAFT_to_SCOPING]
        distinguishing_aspect: "A freshly created Study has version 1; after scope it is 2 (version increments by one per mutation)."
        test_recipe:
          setup: ["ACTIVE client; property; DRAFT cost-seg study"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "VI Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "vi", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
          trigger:
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager, captures: { v: "$.data.version" } }
          assert:
            - "Study.${st}.version == 2"

