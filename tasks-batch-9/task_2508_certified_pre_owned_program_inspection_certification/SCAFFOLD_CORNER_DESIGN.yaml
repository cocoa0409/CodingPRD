          Both lifetime caps bite at once and both are measured from the vehicle's in_service_date,
          not from the certification: with warranty_total_cap_months 60 the raw end 2027-08-01 is
          clamped to 2027-02-01, and with warranty_total_cap_miles 70000 the raw 74000 is clamped to
