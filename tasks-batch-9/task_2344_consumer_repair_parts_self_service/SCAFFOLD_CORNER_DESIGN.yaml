            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-R6-A"], safety_warning_count: 4, expected_model_version: "${mv1}" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
              captures: { rev_id: $.data.id, author: $.data.authored_by_user_id, rev_no: $.data.revision_number }
            - call: "POST /repair-program/manual-revisions/${rev_id}/submit"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
              captures: { state_1: $.data.status }
          trigger:
            - call: "POST /repair-program/manual-revisions/${rev_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "my own work is fine" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
              captures: { e1: $.data.error_id }
            - call: "POST /repair-program/manual-revisions/${rev_id}/review-decision"
              payload: { decision: "REJECT", review_note: "self rejection is still self review" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
              captures: { e2: $.data.error_id }
            - call: "POST /repair-program/manual-revisions/${rev_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "independent review complete" }
              as: SafetyReviewer
              as_user_id: "u_rev_2"
              captures: { state_2: $.data.status, reviewer: $.data.reviewed_by_user_id, cycles: $.data.rejection_cycle_count }
            - call: "POST /repair-program/manual-revisions/${rev_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
              captures: { state_3: $.data.status, published_at: $.data.published_at }
          assert:
            - "${author} == u_rev_1, ${rev_no} == 1 and ${state_1} == IN_REVIEW"
            - "${e1} == ERR_SELF_REVIEW_FORBIDDEN with HTTP 403"
            - "${e2} == ERR_SELF_REVIEW_FORBIDDEN — the guard covers REJECT as well, and rejection_cycle_count stays 0"
            - "${state_2} == APPROVED with ${reviewer} == u_rev_2 and ${cycles} == 0"
            - "${state_3} == PUBLISHED with ${published_at} == 2026-08-01T00:00:00Z — publication has no user-level guard, so the author may perform it"

