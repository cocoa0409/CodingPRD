              payload: { reason: "hurricane" }
              as: ScheduleCoordinator
            - call: "GET /members/${m_n_id}/schedule-compliance"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "GET /members/${m_s_id}/schedule-compliance"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          assert:
            - "the pre-cancel compliance read for North has unmet_rivalry_count == 0, home_game_count == 1, away_game_count == 0 and schedule_compliance_score == 100"
            - "the cancel returns HTTP 200 and ScheduleGame.${g_lap_id}.status == \"CANCELLED\""
            - "ProtectedRivalry.${pr_lap_id}.status == \"LAPSED\""
            - "the post-cancel compliance read for North has unmet_rivalry_count == 1, home_game_count == 0, away_game_count == 0 and schedule_compliance_score == 85"
            - "the compliance read for South has unmet_rivalry_count == 1, home_game_count == 0, away_game_count == 0 and schedule_compliance_score == 85"
            - "Member.${m_n_id}.schedule_compliance_score == 85 and Member.${m_s_id}.schedule_compliance_score == 85"

      - name: corner_third_amend_rejected_at_amend_limit
        claim_type: cyclic
        grounds:
          - state_machines.MembershipAction.VOTING_to_PROPOSED
          - state_machines.Ballot.CAST_to_VOIDED
          - validations[priority=31]
          - errors[ERR_AMEND_LIMIT_REACHED]
        distinguishing_aspect: |
          The VOTING-PROPOSED loop is bounded: two amendments are accepted and each
          voids every ballot cast in that round, but the third fails with
          ERR_AMEND_LIMIT_REACHED and leaves the action in VOTING - the loop has a
          termination condition rather than being freely re-enterable.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and four charter members at 10000 bps."
            - "Central is PETITIONED and an ADMIT action for it is in VOTING with amend_count 0."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_mc
            - *c_ma_admit
            - &c_ma_open
              call: "POST /membership-actions/${ma_id}/open-voting"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
            - &c_ma_read
              call: "GET /membership-actions/${ma_id}"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { ma_v: $.data.version }
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
          trigger:
            - call: "POST /membership-actions/${ma_id}/amend"
              payload: { effective_fiscal_year: 2029, rationale: "Deferred one cycle" }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /membership-actions/${ma_id}/open-voting"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /membership-actions/${ma_id}/amend"
              payload: { entry_fee_cents: 0, rationale: "Fee terms restated" }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /membership-actions/${ma_id}/open-voting"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /membership-actions/${ma_id}/amend"
              payload: { rationale: "One change too many" }
              as: Commissioner
              as_user_id: "u_com_1"
          assert:
            - "after the first amend, MembershipAction.${ma_id}.status == \"PROPOSED\", .amend_count == 1, .cast_weight_bps == 0 and .for_weight_bps == 0"
            - "GET /membership-actions/${ma_id}/ballots returns 1 row with status == \"VOIDED\""
            - "after the second amend, MembershipAction.${ma_id}.amend_count == 2 and .effective_fiscal_year == 2029 is unchanged by the fee-only amendment"
            - "the third amend returns HTTP 409 with error.error_id == ERR_AMEND_LIMIT_REACHED"
            - "MembershipAction.${ma_id}.status is still \"VOTING\" and .amend_count is still 2"

  # ===================================================================
  # SECTION 3 - CALCULATIONS
  # ===================================================================
  - section: calculations
    instances:

      - name: corner_bowl_reimbursement_band_boundary_at_ten_million
        claim_type: threshold
        grounds:
          - calculations.bowl_expense_reimbursement
          - endpoints[POST /bowl-appearances/{id}/approve]
        distinguishing_aspect: |
          REIMB_BAND_HIGH_PAYOUT_CENTS is inclusive: a payout of exactly
          10000000 selects the 6000 bps band, while 9999999 - one cent lower -
          selects 8500 bps. Because the band multiplies the payout, the member
          with the *larger* payout is reimbursed *less* (6000000 against
          8000000) on identical submitted expenses, so an implementation using
          `>` instead of `>=`, or bracketing on event_tier, inverts both
          reimbursements and lands 2000001 cents in the wrong place in escrow.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members."
            - "North has a payout of exactly 10000000 cents and South one cent less; both submitted 9500000 cents of expense with zero travel miles."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Boundary Bowl", event_tier: "BOWL", payout_cents: 10000000, submitted_expense_cents: 9500000, travel_miles: 0, units_claimed: 1 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_hi_id: $.data.id }
            - call: "POST /members/${m_s_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Boundary Bowl", event_tier: "TOURNAMENT", payout_cents: 9999999, submitted_expense_cents: 9500000, travel_miles: 0, units_claimed: 1 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_lo_id: $.data.id }
            - call: "POST /bowl-appearances/${ba_hi_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba_lo_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          trigger:
            - call: "POST /bowl-appearances/${ba_hi_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba_lo_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "GET /conference"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "BowlAppearance.${ba_hi_id}.allowable_expense_cents == 8000000 and .travel_allowance_cents == 0"
            - "BowlAppearance.${ba_hi_id}.reimbursement_ceiling_cents == 6000000, .reimbursed_cents == 6000000 and .residual_to_pool_cents == 4000000"
            - "BowlAppearance.${ba_lo_id}.allowable_expense_cents == 8000000 and .travel_allowance_cents == 0"
            - "BowlAppearance.${ba_lo_id}.reimbursement_ceiling_cents == 8500000, .reimbursed_cents == 8000000 and .residual_to_pool_cents == 1999999"
            - "both appearances are status \"APPROVED\" and the event_tier values BOWL and TOURNAMENT had no effect on the band selection"
            - "Conference.escrow_balance_cents == 5999999 (4000000 + 1999999) and .validated_postseason_unit_count == 2"

      - name: corner_travel_allowance_capped_at_two_point_five_million
        claim_type: Constants Applied
        grounds:
          - calculations.bowl_expense_reimbursement
          - entities.BowlAppearance.fields.travel_allowance_cents
        distinguishing_aspect: |
          TRAVEL_ALLOWANCE_CAP_CENTS clamps 30000 miles at 95 cents/mile from a
          raw 2850000 to 2500000, and even the clamped allowance is then dropped
          again by the independent reimbursement ceiling (7200000) - two caps in
          series. The 900-mile companion shows the uncapped path, 900 * 95 =
          85500, sitting below the 5100000 ceiling so the sum survives intact.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members."
            - "North travels 30000 miles on a 12000000 payout; South travels 900 miles on a 6000000 payout."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Antipodean Invitational", event_tier: "TOURNAMENT", payout_cents: 12000000, submitted_expense_cents: 9500000, travel_miles: 30000, units_claimed: 2 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_far_id: $.data.id }
            - call: "POST /members/${m_s_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Valley Bowl", event_tier: "BOWL", payout_cents: 6000000, submitted_expense_cents: 4200000, travel_miles: 900, units_claimed: 1 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_near_id: $.data.id }
            - call: "POST /bowl-appearances/${ba_far_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba_near_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          trigger:
            - call: "POST /bowl-appearances/${ba_far_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /bowl-appearances/${ba_near_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "GET /conference"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "BowlAppearance.${ba_far_id}.travel_allowance_cents == 2500000, not the uncapped 2850000"
            - "BowlAppearance.${ba_far_id}.allowable_expense_cents == 8000000, .reimbursement_ceiling_cents == 7200000, .reimbursed_cents == 7200000 and .residual_to_pool_cents == 4800000"
            - "BowlAppearance.${ba_near_id}.travel_allowance_cents == 85500 and .allowable_expense_cents == 4200000"
            - "BowlAppearance.${ba_near_id}.reimbursement_ceiling_cents == 5100000, .reimbursed_cents == 4285500 and .residual_to_pool_cents == 1714500"
            - "Conference.escrow_balance_cents == 6514500 (4800000 + 1714500) and .validated_postseason_unit_count == 3"

      - name: corner_postseason_unit_valuation_input_set_filters_by_status_and_window
        claim_type: Input Set Filtering
        grounds:
          - calculations.postseason_unit_valuation
          - endpoints[GET /members/{id}/postseason-unit-valuation]
          - entities.PostseasonUnit.fields.status
        distinguishing_aspect: |
          The valuation counts only PostseasonUnit rows that are VALIDATED *and*
          whose fiscal_year falls inside the rolling window [2022, 2027]. A
          PROVISIONAL unit minted at submission time contributes nothing, and an
          approved FY2021 appearance three units strong stays outside the window
          - so the member's valuation is 68000000 (2 units) even though
          Conference.validated_postseason_unit_count reads 5.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members and unit_value_cents 34000000 at current_fiscal_year 2027."
            - "North has a FY2027 appearance claiming 2 units and a FY2021 appearance claiming 3 units, both under review."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
