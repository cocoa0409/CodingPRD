scenario: "916. Hospital-at-Home Program: eligibility & admission criteria, remote-monitoring & device kit, nurse/paramedic visit & telehealth rounding, medication & DME delivery, escalation & bed-return, meals & care coordination, CMS-waiver billing, discharge"
domain_name: "hospital-at-home-program"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    Peer entities linked by explicit foreign keys (flat topology): no entity is nested more
    than one segment deep in any URL. Episode is the hub, but children are addressed at their
    own top-level collections and discovered through Episode sub-resource GET endpoints.
    Ten state machines; nine of them are non-linear (Episode cyclic via bed-return/readmit,
    Visit parallel scheduling x attestation axes, DailyComplianceRecord cyclic via reopen,
    DeviceKit cyclic via refurbishment, DeliveryOrder branching with a capped redelivery loop,
    MealPlan cyclic via suspend/resume, EscalationEvent branching with SLA auto-promotion,
    BillingClaim cyclic with a capped appeal loop, BedReservation branching).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Program constants. EVERY named threshold, window, cap, buffer, radius, SLA
# minute count, price, and rate used anywhere in this scaffold has an explicit
# numeric value here. No constant is referenced without a value.
# ---------------------------------------------------------------------------
program_constants:

  # --- Logical clock ---
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- Admission eligibility gauntlet ---
  ELIGIBLE_REFERRAL_ORIGINS: ["ED", "INPATIENT_WARD"]
  QUALIFYING_CONDITION_CODES: ["CHF_EXAC", "COPD_EXAC", "CAP_PNEUMONIA", "CELLULITIS", "UTI_COMPLICATED", "COVID_MODERATE"]
  SERVICE_RADIUS_KM: 40.0                  # PASS when patient.home_distance_km <= 40.0 (at or below, inclusive)
  PHYSICIAN_EVAL_WINDOW_HOURS: 24          # eval must be at or after (admission - 24h) AND at or before admission
  HIGH_ACUITY_REQUIRES_CAREGIVER: true

  # --- CMS waiver visit-compliance arithmetic ---
  WAIVER_REQUIRED_IN_PERSON_VISITS_PER_DAY: 2
  WAIVER_REQUIRED_PHYSICIAN_EVALS_PER_DAY: 1
  FFS_REQUIRED_IN_PERSON_VISITS_PER_DAY: 1
  FFS_REQUIRED_PHYSICIAN_EVALS_PER_DAY: 0
  MAX_MONITORING_LAPSE_MINUTES_PER_DAY: 240   # day stays compliant when merged lapse minutes <= 240 (at or below, inclusive)

  # --- Escalation SLA ladder (minutes from tier entry to acknowledgement) ---
  TIER1_ACK_SLA_MINUTES: 10
  TIER2_ACK_SLA_MINUTES: 20
  TIER3_ACK_SLA_MINUTES: 30
  TIER4_ACK_SLA_MINUTES: 15
  HIGH_ACUITY_SLA_MULTIPLIER: 0.5          # HIGH-acuity episodes halve every tier SLA, rounded half up to whole minutes

  # --- Visit scheduling ---
  VISIT_TURNAROUND_BUFFER_MINUTES: 15      # next visit for the same staff must start at or after prior end + 15 min
  TRAVEL_BAND_1_MAX_KM: 10.0               # band 1 applies when distance_km <= 10.0 (at or below, inclusive)
  TRAVEL_BAND_2_MAX_KM: 25.0               # band 2 applies when 10.0 < distance_km <= 25.0
  TRAVEL_BAND_1_USD_PER_KM: 0.92
  TRAVEL_BAND_2_USD_PER_KM: 0.74
  TRAVEL_BAND_3_USD_PER_KM: 0.61
  TRAVEL_MIN_PAYMENT_USD: 8.00

  # --- Medication / DME delivery ---
  CONTROLLED_HANDLING_BASE_USD: 45.00
  NON_CONTROLLED_HANDLING_BASE_USD: 12.00
  WITNESS_FEE_USD: 12.50
  COLD_CHAIN_SURCHARGE_USD: 22.00
  COLD_CHAIN_MAX_EXCURSION_MINUTES: 30     # excursion rejected when excursion_minutes > 30 (strictly greater)
  DELIVERY_WEIGHT_FEE_PER_KG_USD: 1.40
  REDELIVERY_FEE_USD: 9.00
  DELIVERY_FEE_FLOOR_USD: 15.00
  DELIVERY_FEE_CAP_USD: 120.00
  MAX_REDELIVERY_ATTEMPTS: 2               # 3rd refusal is terminal; redelivery rejected when redelivery_count >= 2

  # --- Meals ---
  MEAL_CREDIT_PER_DAY_USD: 28.00
  MEAL_MAX_DAILY_DELIVERIES: 3             # daily_delivery_count must be >= 1 and <= 3, inclusive on both ends

  # --- Device kits ---
  REFURB_CYCLE_LIMIT: 5                    # kit is RETIRED instead of AVAILABLE when refurb_cycle_count > 5 (strictly greater)

  # --- Beds ---
  BED_HOLD_MINUTES: 120                    # a HELD reservation EXPIRES when clock > held_at + 120 minutes (strictly greater)

  # --- Billing ---
  WAIVER_PER_DIEM_USD: 1850.00
  DRG_EQUIVALENT_BASE_USD: 9600.00
  DRG_EQUIVALENT_OUTLIER_PER_DIEM_USD: 640.00
  DRG_OUTLIER_THRESHOLD_DAYS: 6            # outlier per-diem applies to each billable day beyond 6 (strictly greater than 6)
  CLAIM_WITHHOLD_TIER_THRESHOLD_USD: 9600.00   # LOW rate when gross_amount_usd <= 9600.00 (at or below, inclusive)
  CLAIM_WITHHOLD_RATE_LOW: 0.02
  CLAIM_WITHHOLD_RATE_HIGH: 0.05
  APPEAL_RECOVERY_RATE: 0.60
  MAX_APPEAL_ATTEMPTS: 2                   # appeal rejected when appeal_count >= 2
  MIN_BILLABLE_DAYS_FOR_CLAIM: 1           # claim build rejected when billable_day_count < 1

# ---------------------------------------------------------------------------
# Conservation invariants — quantities that MUST balance across states.
# ---------------------------------------------------------------------------
conservation_invariants:
  - id: episode-day-ledger
    formula: "Episode.service_day_count == Episode.billable_day_count + Episode.carved_out_day_count + Episode.pending_day_count"
    description: |
      Every calendar service date of an Episode owns exactly one DailyComplianceRecord, and every
      record is in exactly one of PENDING / COMPLIANT / CARVED_OUT. The three counters are
      recomputed together on every event that can move a record between those states.
  - id: kit-census
    formula: "device_kit_census.total_kits == device_kit_census.available_count + device_kit_census.deployed_count + device_kit_census.in_refurb_count + device_kit_census.retired_count"
    description: |
      Every DeviceKit ever created sits in exactly one of AVAILABLE / DEPLOYED / IN_REFURB /
      RETIRED. Deployment, refurbishment and retirement move a kit between buckets but never
      create or destroy one.
  - id: bed-census
    formula: "InpatientUnit.total_beds == InpatientUnit.available_bed_count + InpatientUnit.held_bed_count + InpatientUnit.occupied_bed_count"
    description: |
      Reserving a bed moves one unit of capacity from available to held; occupying moves it from
      held to occupied; releasing or expiring moves it from held (or occupied) back to available.
      total_beds is immutable after unit creation.

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table (15 entities)
# ---------------------------------------------------------------------------
entities:

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number, unique across patients"
        constraints: "non-empty; unique"
      - name: full_name
        type: string
        source: input
        description: "Patient legal name"
        constraints: "non-empty"
      - name: home_distance_km
        type: number
        source: input
        description: "Road distance in kilometres from the program hub to the patient home"
        constraints: "greater than or equal to 0"
      - name: primary_diagnosis_code
        type: enum
        source: input
        description: "Working diagnosis driving the referral"
        constraints: "one of CHF_EXAC, COPD_EXAC, CAP_PNEUMONIA, CELLULITIS, UTI_COMPLICATED, COVID_MODERATE, OTHER"
      - name: diet_restriction
        type: enum
        source: input
        description: "Dietary restriction the meal plan must satisfy"
        default: NONE
        constraints: "one of NONE, LOW_SODIUM, RENAL, CARB_CONTROLLED, PUREED"
      - name: broadband_verified
        type: boolean
        source: input
        description: "True when a broadband/connectivity check at the home passed"
        default: false
      - name: caregiver_present
        type: boolean
        source: input
        description: "True when a competent adult caregiver is present in the home"
        default: false
      - name: status
        type: enum
        source: system
        description: "Patient record lifecycle marker"
        default: REGISTERED
        constraints: "one of REGISTERED, IN_PROGRAM, DISCHARGED"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient being referred into the hospital-at-home program"
      - name: origin
        type: enum
        source: input
        description: "Where the referral came from"
        constraints: "one of ED, INPATIENT_WARD, CLINIC, SNF"
      - name: qualifying_condition_code
        type: enum
        source: input
        description: "Condition code claimed as qualifying for home hospitalization"
        constraints: "one of CHF_EXAC, COPD_EXAC, CAP_PNEUMONIA, CELLULITIS, UTI_COMPLICATED, COVID_MODERATE, OTHER"
      - name: acuity
        type: enum
        source: input
        description: "Clinical acuity band, drives caregiver requirement and escalation SLA halving"
        constraints: "one of STANDARD, HIGH"
      - name: referring_physician_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the AdmittingPhysician who filed the referral"
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle state"
        default: SUBMITTED
        constraints: "one of SUBMITTED, SCREENING, ELIGIBLE, ADMITTED, CLOSED"
      - name: first_failed_gauntlet_rung
        type: string
        source: system
        description: "Error id of the highest-priority admission-gauntlet rung that rejected the most recent mark-eligible attempt; null once the referral reaches ELIGIBLE"
        default: null

  - name: EligibilityAssessment
    parent: Referral
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral this assessment documents"
      - name: in_person_eval_at
        type: datetime
        source: input
        description: "UTC timestamp of the required in-person physician evaluation"
      - name: home_safety_outcome
        type: enum
        source: input
        description: "Outcome of the home environment and safety assessment"
        constraints: "one of PASS, CONDITIONAL, FAIL"
      - name: broadband_check
        type: enum
        source: input
        description: "Outcome of the home broadband/connectivity check"
        constraints: "one of PASS, FAIL"
      - name: caregiver_present_confirmed
        type: boolean
        source: input
        description: "Assessor confirmation that a competent adult caregiver is present"
      - name: consent_signed
        type: boolean
        source: input
        description: "Patient consent to home hospitalization has been signed"
      - name: assessor_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the clinician who performed the assessment"

  - name: Episode
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the admitted patient"
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the ELIGIBLE referral this admission consumes"
      - name: program_track
        type: enum
        source: input
        description: "Billing track selected at admission; forks the compliance and reimbursement calculations"
        constraints: "one of CMS_WAIVER, FEE_FOR_SERVICE"
      - name: acuity
        type: enum
        source: system
        description: "Copied verbatim from Referral.acuity at admission; forks the escalation SLA calculation"
        constraints: "one of STANDARD, HIGH"
      - name: status
        type: enum
        source: system
        description: "Episode lifecycle state"
        default: ACTIVE
        constraints: "one of ACTIVE, ESCALATED, RETURNED_TO_FACILITY, DISCHARGE_PENDING, DISCHARGED"
      - name: admitted_at
        type: datetime
        source: system
        description: "Logical-clock value at the moment POST /episodes succeeded"
      - name: physician_eval_at
        type: datetime
        source: system
        description: "Copied from the referral's latest-created EligibilityAssessment.in_person_eval_at at admission"
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock value when the episode most recently entered RETURNED_TO_FACILITY; null if never"
        default: null
      - name: discharged_at
        type: datetime
        source: system
        description: "Logical-clock value when the episode entered DISCHARGED; null while open"
        default: null
      - name: readmission_count
        type: integer
        source: system
        description: "Number of times the episode has re-entered ACTIVE from RETURNED_TO_FACILITY"
        default: 0
      - name: service_day_count
        type: integer
        source: computed
        description: "Count of DailyComplianceRecord rows whose episode_id == this episode id. Exactly one record exists per served UTC calendar date: one is minted for the admission date at POST /episodes, one for each new date first referenced by POST /visits or POST /monitoring-lapses, and every still-missing date in the inclusive range [admitted_at date .. current clock date] is back-filled as PENDING by POST /episodes/{id}/begin-discharge, POST /escalation-events/{id}/convert-bed-return and POST /episodes/{id}/readmit"
      - name: billable_day_count
        type: integer
        source: computed
        description: "Count of this episode's DailyComplianceRecord rows whose status == COMPLIANT"
      - name: carved_out_day_count
        type: integer
        source: computed
        description: "Count of this episode's DailyComplianceRecord rows whose status == CARVED_OUT"
      - name: pending_day_count
        type: integer
        source: computed
        description: "Count of this episode's DailyComplianceRecord rows whose status == PENDING"
      - name: reimbursement_amount_usd
        type: number
        source: computed
        description: "Output of calculations.episode_reimbursement_amount for this episode"
      - name: meal_credit_total_usd
        type: number
        source: computed
        description: "Output of calculations.meal_credit_accrual for this episode"
      - name: travel_reimbursement_total_usd
        type: number
        source: computed
        description: "Output of calculations.visit_travel_reimbursement for this episode"
      - name: med_rec_signed
        type: boolean
        source: system
        description: "True once medication reconciliation has been signed for the current admission"
        default: false
      - name: med_rec_signed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the AdmittingPhysician who signed medication reconciliation; null while unsigned"
        default: null
      - name: open_escalation_count
        type: integer
        source: computed
        description: "Count of this episode's EscalationEvent rows whose status is not in {RESOLVED, BED_RETURN_CONVERTED}"

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the episode this visit serves"
      - name: visit_type
        type: enum
        source: input
        description: "Modality and discipline of the visit"
        constraints: "one of RN_IN_PERSON, PARAMEDIC_IN_PERSON, PHYSICIAN_IN_PERSON, PHYSICIAN_TELEHEALTH"
      - name: staff_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the clinician who owns this visit slot; overlap is checked per staff_user_id"
      - name: service_date
        type: string
        source: input
        description: "UTC calendar date the visit counts toward, formatted YYYY-MM-DD"
        constraints: "must equal the UTC date part of scheduled_start_at"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "UTC start of the reserved visit interval, inclusive"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "UTC end of the reserved visit interval, exclusive"
        constraints: "must be strictly greater than scheduled_start_at"
      - name: distance_km
        type: number
        source: input
        description: "One-way travel distance for this visit; 0 for PHYSICIAN_TELEHEALTH"
        constraints: "greater than or equal to 0"
      - name: scheduling_status
        type: enum
        source: system
        description: "Scheduling axis of the parallel state machine"
        default: SCHEDULED
        constraints: "one of SCHEDULED, EN_ROUTE, COMPLETED, NO_SHOW, CANCELLED"
      - name: attestation_status
        type: enum
        source: system
        description: "Attestation axis of the parallel state machine; evolves independently of scheduling_status"
        default: UNATTESTED
        constraints: "one of UNATTESTED, ATTESTED, AMENDED"
      - name: attested_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the clinician who attested this visit; null while UNATTESTED"
        default: null
      - name: travel_payment_usd
        type: number
        source: computed
        description: "Per-visit travel reimbursement from calculations.visit_travel_reimbursement, rounded before any episode-level sum"

  - name: DailyComplianceRecord
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the episode whose service date this record scores"
      - name: service_date
        type: string
        source: system
        description: "UTC calendar date scored by this record, formatted YYYY-MM-DD; unique per episode_id"
      - name: qualified_in_person_visit_count
        type: integer
        source: computed
        description: "Count of this episode+date Visit rows with visit_type in {RN_IN_PERSON, PARAMEDIC_IN_PERSON}, scheduling_status == COMPLETED and attestation_status in {ATTESTED, AMENDED}"
      - name: physician_eval_present
        type: boolean
        source: computed
        description: "True when at least one this-episode+date Visit has visit_type in {PHYSICIAN_IN_PERSON, PHYSICIAN_TELEHEALTH}, scheduling_status == COMPLETED and attestation_status in {ATTESTED, AMENDED}"
      - name: monitoring_lapse_minutes
        type: integer
        source: computed
        description: "Output of calculations.monitoring_lapse_daily_minutes for this episode and service_date"
      - name: kit_deployed_all_day
        type: boolean
        source: system
        description: "False once the episode's DeviceKit stops being DEPLOYED on or before the end of this service_date; true otherwise"
        default: true
      - name: status
        type: enum
        source: system
        description: "Compliance verdict for the service date"
        default: PENDING
        constraints: "one of PENDING, COMPLIANT, CARVED_OUT"
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock value when the record left PENDING; reset to null when the record is reopened"
        default: null
      - name: carve_out_reason
        type: string
        source: system
        description: "Machine-readable reason the day was carved out, one of INSUFFICIENT_IN_PERSON_VISITS, MISSING_PHYSICIAN_EVAL, MONITORING_LAPSE_EXCEEDED, KIT_NOT_DEPLOYED; null unless status == CARVED_OUT"
        default: null

  - name: DeviceKit
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: "Human-readable inventory tag, unique across kits"
        constraints: "non-empty; unique"
      - name: assigned_episode_id
        type: string
        source: system
        description: "FK -> Episode.id; the single episode this kit is deployed to, or null when not DEPLOYED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Kit inventory lifecycle state"
        default: AVAILABLE
        constraints: "one of AVAILABLE, DEPLOYED, IN_REFURB, RETIRED"
      - name: refurb_cycle_count
        type: integer
        source: system
        description: "Number of completed refurbishment cycles; incremented when the kit enters IN_REFURB"
        default: 0
      - name: deployed_at
        type: datetime
        source: system
        description: "Logical-clock value when the kit most recently entered DEPLOYED; null if never"
        default: null
      - name: component_count
        type: integer
        source: computed
        description: "Count of DeviceComponent rows whose kit_id == this kit id"
      - name: unreconciled_component_count
        type: integer
        source: computed
        description: "Count of this kit's DeviceComponent rows whose reconciliation_status == PENDING_RECONCILIATION"

  - name: DeviceComponent
    parent: DeviceKit
    common_fields: true
    fields:
      - name: kit_id
        type: string
        source: input
        description: "FK -> DeviceKit.id; the kit this component belongs to"
      - name: component_type
        type: enum
        source: input
        description: "Typed component in the monitoring kit"
        constraints: "one of TABLET, BP_CUFF, PULSE_OX, SCALE, THERMOMETER, GATEWAY"
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial, unique across components"
        constraints: "non-empty; unique"
      - name: replacement_cost_usd
        type: number
        source: input
        description: "Book value charged to the episode when the component is written off"
        constraints: "greater than or equal to 0"
      - name: reconciliation_status
        type: enum
        source: system
        description: "Chain-of-custody status; IN_STOCK before deployment, PENDING_RECONCILIATION once the kit leaves DEPLOYED, then RETURNED or WRITTEN_OFF"
        default: IN_STOCK
        constraints: "one of IN_STOCK, DEPLOYED, PENDING_RECONCILIATION, RETURNED, WRITTEN_OFF"
      - name: reconciled_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FieldNurse who reconciled the component; null until reconciled"
        default: null

  - name: MonitoringLapse
    parent: Episode
    common_fields: false
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the episode whose telemetry gapped"
      - name: gap_start_at
        type: datetime
        source: input
        description: "UTC start of the telemetry gap, inclusive"
      - name: gap_end_at
        type: datetime
        source: input
        description: "UTC end of the telemetry gap, exclusive"
        constraints: "must be strictly greater than gap_start_at"
      - name: cause
        type: enum
        source: input
        description: "Reported cause of the gap"
        default: UNKNOWN
        constraints: "one of DEVICE_OFFLINE, CONNECTIVITY_LOSS, PATIENT_REMOVED, UNKNOWN"

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the episode receiving the medication or DME"
      - name: order_kind
        type: enum
        source: input
        description: "What is being delivered"
        constraints: "one of MEDICATION, DME"
      - name: is_controlled
        type: boolean
        source: input
        description: "True for controlled-substance orders; forks segregation-of-duties, witness and fee rules"
      - name: cold_chain_required
        type: boolean
        source: input
        description: "True when the payload must stay in cold chain; enables the excursion check and surcharge"
      - name: weight_kg
        type: number
        source: input
        description: "Billable weight used by the handling-fee formula"
        constraints: "greater than or equal to 0"
      - name: requested_by_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the identity that requested the order"
      - name: authorized_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the PharmacyAuthorizer who authorized the order; must differ from requested_by_user_id when is_controlled is true"
        default: null
      - name: witness_staff_id
        type: string
        source: system
        description: "Opaque X-User-ID of the witness recorded at handoff; required when is_controlled is true"
        default: null
      - name: status
        type: enum
        source: system
        description: "Delivery lifecycle state"
        default: PENDING_AUTHORIZATION
        constraints: "one of PENDING_AUTHORIZATION, AUTHORIZED, OUT_FOR_DELIVERY, DELIVERED, REFUSED, FAILED, CANCELLED"
      - name: redelivery_count
        type: integer
        source: system
        description: "Number of redelivery dispatches already performed for this order"
        default: 0
      - name: last_excursion_minutes
        type: integer
        source: system
        description: "Cold-chain excursion minutes reported on the most recent delivery attempt; null until a delivery attempt"
        default: null
      - name: handling_fee_usd
        type: number
        source: computed
        description: "Output of calculations.delivery_handling_fee for this order"

  - name: MealPlan
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the episode being fed"
      - name: diet_code
        type: enum
        source: input
        description: "Diet the plan delivers; must be compatible with Patient.diet_restriction"
        constraints: "one of NONE, LOW_SODIUM, RENAL, CARB_CONTROLLED, PUREED"
      - name: daily_delivery_count
        type: integer
        source: input
        description: "Meal deliveries scheduled per service day"
        constraints: "greater than or equal to 1 and less than or equal to 3, both bounds inclusive"
      - name: activated_on_date
        type: string
        source: system
        description: "UTC calendar date (YYYY-MM-DD) the plan became ACTIVE, taken from the logical clock at creation"
      - name: status
        type: enum
        source: system
        description: "Meal plan lifecycle state"
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, COMPLETED, CANCELLED"
      - name: suspension_day_count
        type: integer
        source: system
        description: "Incremented by exactly 1 each time the plan transitions ACTIVE -> SUSPENDED; each suspension forfeits one credited day"
        default: 0
      - name: credited_day_count
        type: integer
        source: computed
        description: "Output of calculations.meal_credit_accrual credited-day step for this plan"
      - name: meal_credit_total_usd
        type: number
        source: computed
        description: "Output of calculations.meal_credit_accrual money step for this plan"

  - name: EscalationEvent
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the episode being escalated"
      - name: reason
        type: enum
        source: input
        description: "Clinical trigger for the escalation"
        constraints: "one of VITALS_OUT_OF_RANGE, PATIENT_REQUEST, TELEMETRY_LOSS, MEDICATION_FAILURE, FALL"
      - name: opened_by_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the clinician who opened the escalation"
      - name: status
        type: enum
        source: system
        description: "Escalation ladder state; each OPEN tier has an acknowledgement deadline and auto-promotes on breach"
        default: TIER1_OPEN
        constraints: "one of TIER1_OPEN, TIER1_ACKED, TIER2_OPEN, TIER2_ACKED, TIER3_OPEN, TIER3_ACKED, TIER4_OPEN, TIER4_ACKED, RESOLVED, BED_RETURN_CONVERTED"
      - name: current_tier
        type: integer
        source: system
        description: "Numeric tier 1..4 matching the status prefix"
        default: 1
      - name: tier_entered_at
        type: datetime
        source: system
        description: "Logical-clock value when the escalation entered the current OPEN tier; reset on every promotion"
      - name: ack_deadline_at
        type: datetime
        source: system
        description: "Output of calculations.escalation_sla_deadline; tier_entered_at plus the effective tier SLA minutes"
      - name: promotion_count
        type: integer
        source: system
        description: "Number of times this escalation has auto-promoted to a higher tier"
        default: 0
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the responder who acknowledged the current tier; null while the tier is OPEN"
        default: null

  - name: InpatientUnit
    parent: null
    common_fields: true
    fields:
      - name: unit_code
        type: string
        source: input
        description: "Ward identifier, unique across units"
        constraints: "non-empty; unique"
      - name: total_beds
        type: integer
        source: input
        description: "Fixed bed capacity of the unit; immutable after creation"
        constraints: "greater than or equal to 1"
      - name: held_bed_count
        type: integer
        source: computed
        description: "Count of this unit's BedReservation rows whose status == HELD"
      - name: occupied_bed_count
        type: integer
        source: computed
        description: "Count of this unit's BedReservation rows whose status == OCCUPIED"
      - name: available_bed_count
        type: integer
        source: computed
        description: "total_beds minus held_bed_count minus occupied_bed_count"

  - name: BedReservation
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> InpatientUnit.id; the ward holding the bed"
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the episode returning to the facility"
      - name: status
        type: enum
        source: system
        description: "Bed reservation lifecycle state"
        default: HELD
        constraints: "one of HELD, OCCUPIED, RELEASED, EXPIRED"
      - name: held_at
        type: datetime
        source: system
        description: "Logical-clock value when the reservation was created"
      - name: hold_expires_at
        type: datetime
        source: system
        description: "held_at plus BED_HOLD_MINUTES (120); the hold EXPIRES when the clock is strictly greater than this value"
      - name: occupied_at
        type: datetime
        source: system
        description: "Logical-clock value when the reservation entered OCCUPIED; null otherwise"
        default: null

  - name: BillingClaim
    parent: null
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: "FK -> Episode.id; the episode being billed"
      - name: billed_day_count
        type: integer
        source: system
        description: "Snapshot of Episode.billable_day_count taken when the claim was built; never recounts carved-out days"
      - name: gross_amount_usd
        type: number
        source: computed
        description: "episode_reimbursement_amount plus meal_credit_total_usd, both snapshotted at build time"
      - name: withhold_rate
        type: number
        source: computed
        description: "0.02 when gross_amount_usd is at or below 9600.00, otherwise 0.05; keyed on gross, never on net"
      - name: withhold_amount_usd
        type: number
        source: computed
        description: "gross_amount_usd multiplied by withhold_rate, rounded to 2 decimals half up"
      - name: net_payable_usd
        type: number
        source: computed
        description: "gross_amount_usd minus withhold_amount_usd, rounded to 2 decimals half up"
      - name: paid_amount_usd
        type: number
        source: system
        description: "Amount actually paid by the payer; 0.00 until an outcome is recorded"
        default: 0.00
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state"
        default: BUILT
        constraints: "one of BUILT, SUBMITTED, PAID, DENIED, APPEALED, CLOSED, VOIDED"
      - name: appeal_count
        type: integer
        source: system
        description: "Number of appeals already filed for this claim"
        default: 0
      - name: denial_reason
        type: string
        source: system
        description: "Free-text payer denial reason recorded with a DENIED outcome; null otherwise"
        default: null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table (10 machines; 9 non-linear)
# ---------------------------------------------------------------------------
state_machines:

  # ---- 1. Referral — linear pipeline -------------------------------------
  - entity: Referral
    shape: linear
    initial_state: SUBMITTED
    terminal_states: [CLOSED]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /eligibility-assessments (first assessment recorded for this referral)"
        actor: AdmittingPhysician
        preconditions:
          - "Referral.status == SUBMITTED"
        side_effects:
          - "Referral.status set to SCREENING"
          - "increments Referral.version by 1"
      - from: SCREENING
        to: ELIGIBLE
        trigger: "POST /referrals/{id}/mark-eligible"
        actor: AdmittingPhysician
        preconditions:
          - "Referral.status == SCREENING"
          - "at least one EligibilityAssessment exists with referral_id == Referral.id"
          - "admission-gauntlet rungs 9.1, 9.2, 9.3, 9.5, 9.6, 9.7 and 9.8 all pass against the latest-created EligibilityAssessment (tie-break created_at ASC, latest wins)"
        side_effects:
          - "Referral.status set to ELIGIBLE"
          - "Referral.first_failed_gauntlet_rung set to null"
          - "increments Referral.version by 1"
        note: |
          On failure the referral stays in SCREENING and Referral.first_failed_gauntlet_rung is set
          to the error_id of the highest-priority failing rung, so the rejection is observable.
      - from: ELIGIBLE
        to: ADMITTED
        trigger: "POST /episodes"
        actor: AdmittingPhysician
        preconditions:
          - "Referral.status == ELIGIBLE"
        side_effects:
          - "Referral.status set to ADMITTED"
          - "Patient.status set to IN_PROGRAM"
          - "increments Referral.version by 1"
      - from: ADMITTED
        to: CLOSED
        trigger: "POST /episodes/{id}/discharge"
        actor: AdmittingPhysician
        preconditions:
          - "Episode.referral_id == Referral.id"
        side_effects:
          - "Referral.status set to CLOSED"
          - "increments Referral.version by 1"

  # ---- 2. Episode — CYCLIC (bed-return then readmission) ------------------
  - entity: Episode
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [DISCHARGED]
    transitions:
      - from: ACTIVE
        to: ESCALATED
        trigger: "system: an EscalationEvent of this episode enters TIER3_OPEN (via POST /escalation-events/{id}/promote)"
        actor: system
        preconditions:
          - "Episode.status == ACTIVE"
        side_effects:
          - "Episode.status set to ESCALATED"
          - "Episode.open_escalation_count recomputed"
          - "increments Episode.version by 1"
      - from: ESCALATED
        to: ACTIVE
        trigger: "system: the last non-terminal EscalationEvent of this episode reaches RESOLVED (via POST /escalation-events/{id}/resolve)"
        actor: system
        preconditions:
          - "Episode.status == ESCALATED"
          - "no EscalationEvent with episode_id == Episode.id has status outside {RESOLVED, BED_RETURN_CONVERTED}"
        side_effects:
          - "Episode.status set to ACTIVE"
          - "Episode.open_escalation_count recomputed to 0"
          - "increments Episode.version by 1"
      - from: ESCALATED
        to: RETURNED_TO_FACILITY
        trigger: "POST /escalation-events/{id}/convert-bed-return (CASCADE C1 link 1)"
        actor: AdmittingPhysician
        preconditions:
          - "Episode.status == ESCALATED"
          - "a BedReservation exists with episode_id == Episode.id and status == HELD"
        side_effects:
          - "Episode.status set to RETURNED_TO_FACILITY"
          - "Episode.returned_at set to the logical clock"
          - "every still-missing UTC date in [admitted_at date .. clock date] is back-filled as a PENDING DailyComplianceRecord"
          - "CASCADE C1 link 2: the DeviceKit whose assigned_episode_id == Episode.id and status == DEPLOYED transitions to IN_REFURB"
          - "every MealPlan with episode_id == Episode.id and status == ACTIVE transitions to SUSPENDED"
          - "every DeliveryOrder with episode_id == Episode.id and status in {PENDING_AUTHORIZATION, AUTHORIZED, OUT_FOR_DELIVERY, REFUSED} transitions to CANCELLED"
          - "increments Episode.version by 1"
      - from: RETURNED_TO_FACILITY
        to: ACTIVE
        trigger: "POST /episodes/{id}/readmit"
        actor: AdmittingPhysician
        preconditions:
          - "Episode.status == RETURNED_TO_FACILITY"
          - "a DeviceKit with status == AVAILABLE exists (the readmission redeploys inventory)"
        side_effects:
          - "Episode.status set to ACTIVE"
          - "Episode.readmission_count incremented by 1"
          - "every BedReservation with episode_id == Episode.id and status in {HELD, OCCUPIED} transitions to RELEASED"
          - "every MealPlan with episode_id == Episode.id and status == SUSPENDED transitions to ACTIVE"
          - "every still-missing UTC date in [admitted_at date .. clock date] is back-filled as a PENDING DailyComplianceRecord"
          - "Episode.service_day_count, billable_day_count, carved_out_day_count and pending_day_count recomputed"
          - "increments Episode.version by 1"
        note: "This edge closes the cycle ACTIVE -> ESCALATED -> RETURNED_TO_FACILITY -> ACTIVE."
      - from: ACTIVE
        to: DISCHARGE_PENDING
        trigger: "POST /episodes/{id}/begin-discharge"
        actor: AdmittingPhysician
        preconditions:
          - "Episode.status == ACTIVE"
          - "Episode.open_escalation_count == 0"
        side_effects:
          - "Episode.status set to DISCHARGE_PENDING"
          - "every still-missing UTC date in [admitted_at date .. clock date] is back-filled as a PENDING DailyComplianceRecord"
          - "the DeviceKit whose assigned_episode_id == Episode.id and status == DEPLOYED transitions to IN_REFURB"
          - "increments Episode.version by 1"
      - from: DISCHARGE_PENDING
        to: DISCHARGED
        trigger: "POST /episodes/{id}/discharge (CASCADE C4 link 0)"
        actor: AdmittingPhysician
        preconditions:
          - "Episode.status == DISCHARGE_PENDING"
          - "Episode.med_rec_signed == true"
          - "every DeliveryOrder with episode_id == Episode.id has status in {DELIVERED, FAILED, CANCELLED}"
          - "no DeviceComponent of the kit most recently deployed to this episode has reconciliation_status in {DEPLOYED, PENDING_RECONCILIATION}"
        side_effects:
          - "Episode.status set to DISCHARGED"
          - "Episode.discharged_at set to the logical clock"
          - "Patient.status set to DISCHARGED"
          - "Referral.status set to CLOSED"
          - "CASCADE C4 link 1: every Visit with episode_id == Episode.id and scheduling_status in {SCHEDULED, EN_ROUTE} transitions to CANCELLED"
          - "every DailyComplianceRecord of this episode still in PENDING is finalized to COMPLIANT or CARVED_OUT per calculations.daily_visit_compliance"
          - "Episode.service_day_count, billable_day_count, carved_out_day_count, pending_day_count, reimbursement_amount_usd, meal_credit_total_usd and travel_reimbursement_total_usd recomputed"
          - "increments Episode.version by 1"

  # ---- 3. Visit — PARALLEL AXES (scheduling x attestation) ---------------
  - entity: Visit
    shape: parallel
    parallel_axes:
      - axis: scheduling
        field: scheduling_status
        initial_state: SCHEDULED
        terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
      - axis: attestation
        field: attestation_status
        initial_state: UNATTESTED
        terminal_states: [AMENDED]
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, NO_SHOW]
    note: |
      The two axes advance independently on the same row. A visit may be ATTESTED while still
      SCHEDULED, and may be COMPLETED while still UNATTESTED. Only the combination
      scheduling_status == COMPLETED AND attestation_status in {ATTESTED, AMENDED} counts toward
      the daily CMS-waiver visit requirement, which is what makes the two axes interact.
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        axis: scheduling
        trigger: "POST /visits/{id}/depart"
        actor: FieldNurse
        preconditions:
          - "Visit.scheduling_status == SCHEDULED"
          - "Episode.status == ACTIVE for the visit's episode_id"
        side_effects:
          - "Visit.scheduling_status set to EN_ROUTE"
          - "increments Visit.version by 1"
      - from: EN_ROUTE
        to: COMPLETED
        axis: scheduling
        trigger: "POST /visits/{id}/complete"
        actor: FieldNurse
        preconditions:
          - "Visit.scheduling_status == EN_ROUTE"
          - "Episode.status == ACTIVE for the visit's episode_id"
        side_effects:
          - "Visit.scheduling_status set to COMPLETED"
          - "Visit.travel_payment_usd computed per calculations.visit_travel_reimbursement"
          - "the DailyComplianceRecord for (episode_id, service_date) is recomputed per calculations.daily_visit_compliance"
          - "Episode.travel_reimbursement_total_usd recomputed"
          - "increments Visit.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        axis: scheduling
        trigger: "POST /visits/{id}/close-unperformed with outcome NO_SHOW"
        actor: FieldNurse
        preconditions:
          - "Visit.scheduling_status in {SCHEDULED, EN_ROUTE}"
        side_effects:
          - "Visit.scheduling_status set to NO_SHOW"
          - "the DailyComplianceRecord for (episode_id, service_date) is recomputed"
          - "increments Visit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        axis: scheduling
        trigger: "POST /visits/{id}/close-unperformed with outcome CANCELLED, or CASCADE C4 link 1 from POST /episodes/{id}/discharge"
        actor: FieldNurse | system
        preconditions:
          - "Visit.scheduling_status in {SCHEDULED, EN_ROUTE}"
        side_effects:
          - "Visit.scheduling_status set to CANCELLED"
          - "CASCADE C4 link 2: the DailyComplianceRecord for (episode_id, service_date) is recomputed and, when the episode is DISCHARGED, finalized out of PENDING"
          - "increments Visit.version by 1"
      - from: UNATTESTED
        to: ATTESTED
        axis: attestation
        trigger: "POST /visits/{id}/attest (CASCADE C2 link 0)"
        actor: FieldNurse | CommunityParamedic | AdmittingPhysician
        preconditions:
          - "Visit.attestation_status == UNATTESTED"
          - "Visit.scheduling_status is not CANCELLED (the two axes are independent: a SCHEDULED or EN_ROUTE visit may be attested, it simply does not count toward the daily requirement until scheduling_status also reaches COMPLETED)"
        side_effects:
          - "Visit.attestation_status set to ATTESTED"
          - "Visit.attested_by_user_id set to the caller's X-User-ID"
          - "CASCADE C2 link 1: the DailyComplianceRecord for (episode_id, service_date) recomputes qualified_in_person_visit_count and physician_eval_present"
          - "increments Visit.version by 1"
      - from: ATTESTED
        to: AMENDED
        axis: attestation
        trigger: "POST /visits/{id}/attest (a second attestation amends the first)"
        actor: FieldNurse | CommunityParamedic | AdmittingPhysician
        preconditions:
          - "Visit.attestation_status == ATTESTED"
        side_effects:
          - "Visit.attestation_status set to AMENDED"
          - "Visit.attested_by_user_id set to the caller's X-User-ID"
          - "the DailyComplianceRecord for (episode_id, service_date) is REOPENED to PENDING when its status was COMPLIANT or CARVED_OUT, then recomputed"
          - "increments Visit.version by 1"

  # ---- 4. DailyComplianceRecord — CYCLIC (finalize then reopen) ----------
  - entity: DailyComplianceRecord
    shape: cyclic
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: COMPLIANT
        trigger: "POST /compliance-days/{id}/finalize, or CASCADE C4 finalization sweep on POST /episodes/{id}/discharge"
        actor: ProgramAdmin | system
        preconditions:
          - "DailyComplianceRecord.status == PENDING"
          - "calculations.daily_visit_compliance returns COMPLIANT for this record under the episode's program_track variant"
        side_effects:
          - "DailyComplianceRecord.status set to COMPLIANT"
          - "DailyComplianceRecord.finalized_at set to the logical clock"
          - "CASCADE C2 link 2: Episode.billable_day_count incremented and Episode.pending_day_count decremented"
          - "Episode.reimbursement_amount_usd and Episode.meal_credit_total_usd recomputed"
          - "increments DailyComplianceRecord.version by 1"
      - from: PENDING
        to: CARVED_OUT
        trigger: "POST /compliance-days/{id}/finalize, CASCADE C1 link 3 from the kit release, or CASCADE C4 finalization sweep"
        actor: ProgramAdmin | system
        preconditions:
          - "DailyComplianceRecord.status == PENDING"
          - "calculations.daily_visit_compliance returns CARVED_OUT for this record under the episode's program_track variant"
        side_effects:
          - "DailyComplianceRecord.status set to CARVED_OUT"
          - "DailyComplianceRecord.carve_out_reason set to the first failing clause in the order INSUFFICIENT_IN_PERSON_VISITS, MISSING_PHYSICIAN_EVAL, MONITORING_LAPSE_EXCEEDED, KIT_NOT_DEPLOYED"
          - "DailyComplianceRecord.finalized_at set to the logical clock"
          - "Episode.carved_out_day_count incremented and Episode.pending_day_count decremented"
          - "CASCADE C1 link 4: every BillingClaim with episode_id == this episode and status == BUILT transitions to VOIDED"
          - "increments DailyComplianceRecord.version by 1"
      - from: COMPLIANT
        to: PENDING
        trigger: "system: POST /visits/{id}/attest amends an already-ATTESTED visit whose service_date matches this record"
        actor: system
        preconditions:
          - "DailyComplianceRecord.status == COMPLIANT"
          - "the episode is not DISCHARGED"
        side_effects:
          - "DailyComplianceRecord.status set to PENDING"
          - "DailyComplianceRecord.finalized_at set to null"
          - "Episode.billable_day_count decremented and Episode.pending_day_count incremented"
          - "increments DailyComplianceRecord.version by 1"
        note: "Closes the cycle PENDING -> COMPLIANT -> PENDING."
      - from: CARVED_OUT
        to: PENDING
        trigger: "system: POST /visits/{id}/attest amends an already-ATTESTED visit whose service_date matches this record"
        actor: system
        preconditions:
          - "DailyComplianceRecord.status == CARVED_OUT"
          - "the episode is not DISCHARGED"
        side_effects:
          - "DailyComplianceRecord.status set to PENDING"
          - "DailyComplianceRecord.carve_out_reason set to null"
          - "DailyComplianceRecord.finalized_at set to null"
          - "Episode.carved_out_day_count decremented and Episode.pending_day_count incremented"
          - "increments DailyComplianceRecord.version by 1"

  # ---- 5. DeviceKit — CYCLIC (deploy, refurbish, back to available) ------
  - entity: DeviceKit
    shape: cyclic
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: DEPLOYED
        trigger: "POST /device-kits/{id}/deploy"
        actor: FieldNurse
        preconditions:
          - "DeviceKit.status == AVAILABLE"
          - "expected_kit_version equals DeviceKit.version"
          - "Episode.status == ACTIVE for the target episode_id"
          - "no other DeviceKit has assigned_episode_id == the target episode_id and status == DEPLOYED"
        side_effects:
          - "DeviceKit.status set to DEPLOYED"
          - "DeviceKit.assigned_episode_id set to the target episode_id"
          - "DeviceKit.deployed_at set to the logical clock"
          - "every DeviceComponent with kit_id == DeviceKit.id and reconciliation_status == IN_STOCK moves to DEPLOYED"
          - "increments DeviceKit.version by 1"
      - from: DEPLOYED
        to: IN_REFURB
        trigger: "system: CASCADE C1 link 2 from Episode -> RETURNED_TO_FACILITY, or the kit-release effect of POST /episodes/{id}/begin-discharge"
        actor: system
        preconditions:
          - "DeviceKit.status == DEPLOYED"
        side_effects:
          - "DeviceKit.status set to IN_REFURB"
          - "DeviceKit.assigned_episode_id set to null"
          - "DeviceKit.refurb_cycle_count incremented by 1"
          - "every DeviceComponent with kit_id == DeviceKit.id and reconciliation_status == DEPLOYED moves to PENDING_RECONCILIATION"
          - "CASCADE C1 link 3: the DailyComplianceRecord of the released episode whose service_date equals the UTC date of the logical clock has kit_deployed_all_day set to false and, when its status is PENDING, is immediately finalized through calculations.daily_visit_compliance. Its carve_out_reason is therefore whichever clause fails FIRST in the declared clause order; a day that already satisfied clauses 1 to 3 on a CMS_WAIVER episode fails only clause 4 and carries carve_out_reason KIT_NOT_DEPLOYED, which is the only way that reason value is produced"
          - "increments DeviceKit.version by 1"
      - from: IN_REFURB
        to: AVAILABLE
        trigger: "system: POST /device-components/{id}/reconcile reconciles the last PENDING_RECONCILIATION component of the kit"
        actor: system
        preconditions:
          - "DeviceKit.status == IN_REFURB"
          - "DeviceKit.unreconciled_component_count == 0"
          - "DeviceKit.refurb_cycle_count is at or below 5"
        side_effects:
          - "DeviceKit.status set to AVAILABLE"
          - "every DeviceComponent with kit_id == DeviceKit.id and reconciliation_status == RETURNED moves back to IN_STOCK"
          - "increments DeviceKit.version by 1"
        note: "Closes the cycle AVAILABLE -> DEPLOYED -> IN_REFURB -> AVAILABLE."
      - from: IN_REFURB
        to: RETIRED
        trigger: "system: POST /device-components/{id}/reconcile reconciles the last component while refurb_cycle_count is strictly greater than 5"
        actor: system
        preconditions:
          - "DeviceKit.status == IN_REFURB"
          - "DeviceKit.unreconciled_component_count == 0"
          - "DeviceKit.refurb_cycle_count is strictly greater than 5"
        side_effects:
          - "DeviceKit.status set to RETIRED"
          - "increments DeviceKit.version by 1"

  # ---- 6. DeliveryOrder — BRANCHING with a capped redelivery loop --------
  - entity: DeliveryOrder
    shape: branching
    initial_state: PENDING_AUTHORIZATION
    terminal_states: [DELIVERED, FAILED, CANCELLED]
    transitions:
      - from: PENDING_AUTHORIZATION
        to: AUTHORIZED
        trigger: "POST /delivery-orders/{id}/authorize"
        actor: PharmacyAuthorizer
        preconditions:
          - "DeliveryOrder.status == PENDING_AUTHORIZATION"
          - "Episode.status == ACTIVE for the order's episode_id"
          - "when DeliveryOrder.is_controlled is true, the caller's X-User-ID differs from DeliveryOrder.requested_by_user_id"
        side_effects:
          - "DeliveryOrder.status set to AUTHORIZED"
          - "DeliveryOrder.authorized_by_user_id set to the caller's X-User-ID"
          - "increments DeliveryOrder.version by 1"
      - from: AUTHORIZED
        to: OUT_FOR_DELIVERY
        trigger: "POST /delivery-orders/{id}/dispatch"
        actor: LogisticsCoordinator
        preconditions:
          - "DeliveryOrder.status == AUTHORIZED"
          - "Episode.status == ACTIVE for the order's episode_id"
        side_effects:
          - "DeliveryOrder.status set to OUT_FOR_DELIVERY"
          - "increments DeliveryOrder.version by 1"
      - from: REFUSED
        to: OUT_FOR_DELIVERY
        trigger: "POST /delivery-orders/{id}/dispatch (redelivery attempt)"
        actor: LogisticsCoordinator
        preconditions:
          - "DeliveryOrder.status == REFUSED"
          - "DeliveryOrder.redelivery_count is strictly less than 2"
          - "Episode.status == ACTIVE for the order's episode_id"
        side_effects:
          - "DeliveryOrder.status set to OUT_FOR_DELIVERY"
          - "DeliveryOrder.redelivery_count incremented by 1"
          - "DeliveryOrder.handling_fee_usd recomputed per calculations.delivery_handling_fee"
          - "increments DeliveryOrder.version by 1"
        note: "Closes the capped retry loop OUT_FOR_DELIVERY -> REFUSED -> OUT_FOR_DELIVERY, at most twice."
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /delivery-orders/{id}/deliver"
        actor: LogisticsCoordinator | CommunityParamedic
        preconditions:
          - "DeliveryOrder.status == OUT_FOR_DELIVERY"
          - "when DeliveryOrder.is_controlled is true, witness_staff_id is supplied in the request body"
          - "when DeliveryOrder.cold_chain_required is true, excursion_minutes is at or below 30"
        side_effects:
          - "DeliveryOrder.status set to DELIVERED"
          - "DeliveryOrder.witness_staff_id set from the request body when supplied"
          - "DeliveryOrder.last_excursion_minutes set from the request body when supplied"
          - "DeliveryOrder.handling_fee_usd recomputed per calculations.delivery_handling_fee"
          - "increments DeliveryOrder.version by 1"
      - from: OUT_FOR_DELIVERY
        to: REFUSED
        trigger: "POST /delivery-orders/{id}/refuse"
        actor: LogisticsCoordinator | CommunityParamedic
        preconditions:
          - "DeliveryOrder.status == OUT_FOR_DELIVERY"
        side_effects:
          - "DeliveryOrder.status set to REFUSED"
          - "increments DeliveryOrder.version by 1"
        note: "A refusal from OUT_FOR_DELIVERY is always accepted and never increments redelivery_count; only a dispatch does."
      - from: REFUSED
        to: FAILED
        trigger: "POST /delivery-orders/{id}/refuse on an already-REFUSED order whose redeliveries are exhausted (CASCADE C3 link 0)"
        actor: LogisticsCoordinator | CommunityParamedic
        preconditions:
          - "DeliveryOrder.status == REFUSED"
          - "DeliveryOrder.redelivery_count == 2 (both permitted redeliveries have been used); a REFUSED order with redelivery_count strictly less than 2 is rejected with ERR_INVALID_STATE because a redelivery is still available"
        side_effects:
          - "DeliveryOrder.status set to FAILED"
          - "CASCADE C3 link 1: a new EscalationEvent is created for the same episode_id with reason MEDICATION_FAILURE, status TIER1_OPEN, opened_by_user_id set to the caller's X-User-ID"
          - "CASCADE C3 link 2: Episode.open_escalation_count is recomputed and incremented by 1"
          - "increments DeliveryOrder.version by 1"
        note: |
          This edge is what makes both terminal outcomes reachable: the third dispatch attempt is
          refused by the cap (ERR_REDELIVERY_LIMIT_EXCEEDED) leaving the order REFUSED, and a
          follow-up refuse call abandons it into FAILED.
      - from: PENDING_AUTHORIZATION
        to: CANCELLED
        trigger: "system: Episode enters RETURNED_TO_FACILITY via POST /escalation-events/{id}/convert-bed-return"
        actor: system
        preconditions:
          - "DeliveryOrder.status in {PENDING_AUTHORIZATION, AUTHORIZED, OUT_FOR_DELIVERY, REFUSED}"
        side_effects:
          - "DeliveryOrder.status set to CANCELLED"
          - "increments DeliveryOrder.version by 1"

  # ---- 7. MealPlan — CYCLIC (suspend then resume) ------------------------
  - entity: MealPlan
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: Episode enters RETURNED_TO_FACILITY via POST /escalation-events/{id}/convert-bed-return"
        actor: system
        preconditions:
          - "MealPlan.status == ACTIVE"
        side_effects:
          - "MealPlan.status set to SUSPENDED"
          - "MealPlan.suspension_day_count incremented by 1"
          - "MealPlan.credited_day_count and MealPlan.meal_credit_total_usd recomputed per calculations.meal_credit_accrual"
          - "Episode.meal_credit_total_usd recomputed"
          - "increments MealPlan.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: POST /episodes/{id}/readmit"
        actor: system
        preconditions:
          - "MealPlan.status == SUSPENDED"
          - "Episode.status == ACTIVE after the readmission"
        side_effects:
          - "MealPlan.status set to ACTIVE"
          - "MealPlan.credited_day_count and MealPlan.meal_credit_total_usd recomputed"
          - "increments MealPlan.version by 1"
        note: "Closes the cycle ACTIVE -> SUSPENDED -> ACTIVE."
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: POST /episodes/{id}/discharge"
        actor: system
        preconditions:
          - "MealPlan.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "MealPlan.status set to COMPLETED"
          - "CASCADE C4 link 3: MealPlan.credited_day_count and MealPlan.meal_credit_total_usd recomputed from the freshly finalized DailyComplianceRecord set"
          - "Episode.meal_credit_total_usd recomputed"
          - "increments MealPlan.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "system: POST /episodes/{id}/discharge while the episode never returned to ACTIVE"
        actor: system
        preconditions:
          - "MealPlan.status == SUSPENDED"
          - "Episode.status == DISCHARGED"
        side_effects:
          - "MealPlan.status set to CANCELLED"
          - "MealPlan.meal_credit_total_usd set to 0.00"
          - "increments MealPlan.version by 1"

  # ---- 8. EscalationEvent — BRANCHING ladder with SLA auto-promotion -----
  - entity: EscalationEvent
    shape: branching
    initial_state: TIER1_OPEN
    terminal_states: [RESOLVED, BED_RETURN_CONVERTED]
    transitions:
      - from: TIER1_OPEN
        to: TIER1_ACKED
        trigger: "POST /escalation-events/{id}/acknowledge"
        actor: FieldNurse
        preconditions:
          - "EscalationEvent.status == TIER1_OPEN"
          - "the logical clock is at or before EscalationEvent.ack_deadline_at"
        side_effects:
          - "EscalationEvent.status set to TIER1_ACKED"
          - "EscalationEvent.acknowledged_by_user_id set to the caller's X-User-ID"
          - "increments EscalationEvent.version by 1"
      - from: TIER2_OPEN
        to: TIER2_ACKED
        trigger: "POST /escalation-events/{id}/acknowledge"
        actor: AdmittingPhysician
        preconditions:
          - "EscalationEvent.status == TIER2_OPEN"
          - "the logical clock is at or before EscalationEvent.ack_deadline_at"
        side_effects:
          - "EscalationEvent.status set to TIER2_ACKED"
          - "EscalationEvent.acknowledged_by_user_id set to the caller's X-User-ID"
          - "increments EscalationEvent.version by 1"
      - from: TIER3_OPEN
        to: TIER3_ACKED
        trigger: "POST /escalation-events/{id}/acknowledge"
        actor: CommunityParamedic
        preconditions:
          - "EscalationEvent.status == TIER3_OPEN"
          - "the logical clock is at or before EscalationEvent.ack_deadline_at"
        side_effects:
          - "EscalationEvent.status set to TIER3_ACKED"
          - "EscalationEvent.acknowledged_by_user_id set to the caller's X-User-ID"
          - "increments EscalationEvent.version by 1"
      - from: TIER4_OPEN
        to: TIER4_ACKED
        trigger: "POST /escalation-events/{id}/acknowledge"
        actor: AdmittingPhysician
        preconditions:
          - "EscalationEvent.status == TIER4_OPEN"
          - "the logical clock is at or before EscalationEvent.ack_deadline_at"
        side_effects:
          - "EscalationEvent.status set to TIER4_ACKED"
          - "EscalationEvent.acknowledged_by_user_id set to the caller's X-User-ID"
          - "increments EscalationEvent.version by 1"
      - from: TIER1_OPEN
        to: TIER2_OPEN
        trigger: "POST /escalation-events/{id}/promote (SLA breach auto-promotion)"
        actor: ProgramAdmin | FieldNurse
        preconditions:
          - "EscalationEvent.status in {TIER1_OPEN, TIER1_ACKED}"
          - "when the status is TIER1_OPEN, the logical clock is strictly greater than EscalationEvent.ack_deadline_at"
        side_effects:
          - "EscalationEvent.status set to TIER2_OPEN"
          - "EscalationEvent.current_tier set to 2"
          - "EscalationEvent.tier_entered_at set to the logical clock"
          - "EscalationEvent.ack_deadline_at recomputed per calculations.escalation_sla_deadline"
          - "EscalationEvent.acknowledged_by_user_id reset to null"
          - "EscalationEvent.promotion_count incremented by 1"
          - "increments EscalationEvent.version by 1"
      - from: TIER2_OPEN
        to: TIER3_OPEN
        trigger: "POST /escalation-events/{id}/promote (SLA breach auto-promotion)"
        actor: ProgramAdmin | FieldNurse
        preconditions:
          - "EscalationEvent.status in {TIER2_OPEN, TIER2_ACKED}"
          - "when the status is TIER2_OPEN, the logical clock is strictly greater than EscalationEvent.ack_deadline_at"
        side_effects:
          - "EscalationEvent.status set to TIER3_OPEN"
          - "EscalationEvent.current_tier set to 3"
          - "EscalationEvent.tier_entered_at set to the logical clock"
          - "EscalationEvent.ack_deadline_at recomputed per calculations.escalation_sla_deadline"
          - "EscalationEvent.acknowledged_by_user_id reset to null"
          - "EscalationEvent.promotion_count incremented by 1"
          - "the owning Episode transitions ACTIVE -> ESCALATED"
          - "increments EscalationEvent.version by 1"
      - from: TIER3_OPEN
        to: TIER4_OPEN
        trigger: "POST /escalation-events/{id}/promote (SLA breach auto-promotion)"
        actor: ProgramAdmin | FieldNurse
        preconditions:
          - "EscalationEvent.status in {TIER3_OPEN, TIER3_ACKED}"
          - "when the status is TIER3_OPEN, the logical clock is strictly greater than EscalationEvent.ack_deadline_at"
        side_effects:
          - "EscalationEvent.status set to TIER4_OPEN"
          - "EscalationEvent.current_tier set to 4"
          - "EscalationEvent.tier_entered_at set to the logical clock"
          - "EscalationEvent.ack_deadline_at recomputed per calculations.escalation_sla_deadline"
          - "EscalationEvent.acknowledged_by_user_id reset to null"
          - "EscalationEvent.promotion_count incremented by 1"
          - "increments EscalationEvent.version by 1"
      - from: TIER1_ACKED
        to: RESOLVED
        trigger: "POST /escalation-events/{id}/resolve"
        actor: FieldNurse | AdmittingPhysician | CommunityParamedic
        preconditions:
          - "EscalationEvent.status in {TIER1_ACKED, TIER2_ACKED, TIER3_ACKED, TIER4_ACKED}"
        side_effects:
          - "EscalationEvent.status set to RESOLVED"
          - "Episode.open_escalation_count recomputed"
          - "when no EscalationEvent of the episode remains outside {RESOLVED, BED_RETURN_CONVERTED} and Episode.status == ESCALATED, the Episode transitions ESCALATED -> ACTIVE"
          - "increments EscalationEvent.version by 1"
      - from: TIER4_OPEN
        to: BED_RETURN_CONVERTED
        trigger: "POST /escalation-events/{id}/convert-bed-return (CASCADE C1 link 0)"
        actor: AdmittingPhysician
        preconditions:
          - "EscalationEvent.status in {TIER3_ACKED, TIER4_OPEN, TIER4_ACKED}"
          - "Episode.status == ESCALATED"
          - "a BedReservation exists with episode_id == this episode and status == HELD"
        side_effects:
          - "EscalationEvent.status set to BED_RETURN_CONVERTED"
          - "the earliest-created HELD BedReservation of this episode (sort held_at ASC, tie-break created_at ASC) transitions HELD -> OCCUPIED"
          - "CASCADE C1 link 1: the Episode transitions ESCALATED -> RETURNED_TO_FACILITY"
          - "Episode.open_escalation_count recomputed"
          - "increments EscalationEvent.version by 1"

  # ---- 9. BedReservation — BRANCHING (occupy | release | expire) ---------
  - entity: BedReservation
    shape: branching
    initial_state: HELD
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: OCCUPIED
        trigger: "system: POST /escalation-events/{id}/convert-bed-return selects the earliest-created HELD reservation of the episode"
        actor: system
        preconditions:
          - "BedReservation.status == HELD"
          - "the logical clock is at or before BedReservation.hold_expires_at"
        side_effects:
          - "BedReservation.status set to OCCUPIED"
          - "BedReservation.occupied_at set to the logical clock"
          - "InpatientUnit.held_bed_count decremented and InpatientUnit.occupied_bed_count incremented"
          - "increments BedReservation.version by 1"
      - from: HELD
        to: EXPIRED
        trigger: "system: lazy expiry evaluated on GET /bed-reservations/{id}, GET /inpatient-units/{id}, and POST /bed-reservations against the same unit_id"
        actor: system
        preconditions:
          - "BedReservation.status == HELD"
          - "the logical clock is strictly greater than BedReservation.hold_expires_at"
        side_effects:
          - "BedReservation.status set to EXPIRED"
          - "InpatientUnit.held_bed_count decremented and InpatientUnit.available_bed_count incremented"
          - "increments BedReservation.version by 1"
      - from: OCCUPIED
        to: RELEASED
        trigger: "system: POST /episodes/{id}/readmit"
        actor: system
        preconditions:
          - "BedReservation.status in {HELD, OCCUPIED}"
        side_effects:
          - "BedReservation.status set to RELEASED"
          - "InpatientUnit.occupied_bed_count (or held_bed_count) decremented and InpatientUnit.available_bed_count incremented"
          - "increments BedReservation.version by 1"

  # ---- 10. BillingClaim — CYCLIC with a capped appeal loop ---------------
  - entity: BillingClaim
    shape: cyclic
    initial_state: BUILT
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: BUILT
        to: SUBMITTED
        trigger: "POST /billing-claims/{id}/submit"
        actor: BillingAnalyst
        preconditions:
          - "BillingClaim.status == BUILT"
          - "Episode.status == DISCHARGED for the claim's episode_id"
        side_effects:
          - "BillingClaim.status set to SUBMITTED"
          - "increments BillingClaim.version by 1"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /billing-claims/{id}/record-outcome with outcome PAID"
        actor: BillingAnalyst
        preconditions:
          - "BillingClaim.status in {SUBMITTED, APPEALED}"
        side_effects:
          - "BillingClaim.status set to PAID"
          - "BillingClaim.paid_amount_usd set to BillingClaim.net_payable_usd when the claim was SUBMITTED, or to the appeal-recovery amount when the claim was APPEALED"
          - "increments BillingClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /billing-claims/{id}/record-outcome with outcome DENIED"
        actor: BillingAnalyst
        preconditions:
          - "BillingClaim.status in {SUBMITTED, APPEALED}"
        side_effects:
          - "BillingClaim.status set to DENIED"
          - "BillingClaim.denial_reason set from the request body"
          - "BillingClaim.paid_amount_usd set to 0.00"
          - "increments BillingClaim.version by 1"
      - from: DENIED
        to: APPEALED
        trigger: "POST /billing-claims/{id}/appeal"
        actor: BillingAnalyst
        preconditions:
          - "BillingClaim.status == DENIED"
          - "BillingClaim.appeal_count is strictly less than 2"
        side_effects:
          - "BillingClaim.status set to APPEALED"
          - "BillingClaim.appeal_count incremented by 1"
          - "increments BillingClaim.version by 1"
        note: "Closes the cycle SUBMITTED -> DENIED -> APPEALED -> DENIED, at most twice."
      - from: DENIED
        to: CLOSED
        trigger: "POST /billing-claims/{id}/appeal is rejected at the cap, then POST /billing-claims/{id}/record-outcome with outcome CLOSED"
        actor: BillingAnalyst
        preconditions:
          - "BillingClaim.status in {PAID, DENIED}"
        side_effects:
          - "BillingClaim.status set to CLOSED"
          - "increments BillingClaim.version by 1"
      - from: BUILT
        to: VOIDED
        trigger: "system: CASCADE C1 link 4 — a DailyComplianceRecord of the same episode transitions to CARVED_OUT"
        actor: system
        preconditions:
          - "BillingClaim.status == BUILT"
        side_effects:
          - "BillingClaim.status set to VOIDED"
          - "increments BillingClaim.version by 1"
        note: |
          Voiding is what prevents the recompute from double-counting: the snapshot in a VOIDED
          claim is never re-added, and a fresh claim must be built from the surviving COMPLIANT
          days.

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules — OCC on three distinct parent entities
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: kit-deploy-stale-kit
    parent_entity: DeviceKit
    write_endpoint: "POST /device-kits/{id}/deploy"
    occ_field: "expected_kit_version"
    description: |
      Deploying a DeviceKit whose version has advanced since the client last observed it is
      rejected. A kit legitimately serves at most one episode at a time, so a second deployment
      request carrying a stale expected_kit_version is refused with a precondition failure rather
      than silently re-pointing the kit at a different episode.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bed-reserve-stale-unit
    parent_entity: InpatientUnit
    write_endpoint: "POST /bed-reservations"
    occ_field: "expected_unit_version"
    description: |
      Creating a BedReservation against an InpatientUnit whose version has advanced since the
      client last read it is rejected. Every reservation, expiry and release mutates the unit's
      bed census, so a stale expected_unit_version means the caller's view of remaining capacity
      is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-build-stale-episode
    parent_entity: Episode
    write_endpoint: "POST /billing-claims"
    occ_field: "expected_episode_version"
    description: |
      Building a BillingClaim against an Episode whose version has advanced since the client last
      read it is rejected. A newly built claim legitimately supersedes any prior BUILT claim for
      the same episode, so the build must be anchored to the exact day-ledger the client saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table (10 calculations; 5 dual-variant)
# ---------------------------------------------------------------------------
calculations:

  - name: daily_visit_compliance
    trigger: "Recomputed on POST /visits, POST /visits/{id}/complete, POST /visits/{id}/close-unperformed, POST /visits/{id}/attest, POST /monitoring-lapses, the DeviceKit DEPLOYED -> IN_REFURB transition, POST /compliance-days/{id}/finalize, and the finalization sweep inside POST /episodes/{id}/discharge"
    algorithm: threshold
    formula: |
      # Inputs for one DailyComplianceRecord R of Episode E on service_date D:
      qualified_in_person_visit_count =
          count(Visit V where V.episode_id == E.id
                          and V.service_date == D
                          and V.visit_type in {RN_IN_PERSON, PARAMEDIC_IN_PERSON}
                          and V.scheduling_status == COMPLETED
                          and V.attestation_status in {ATTESTED, AMENDED})
      physician_eval_present =
          exists(Visit V where V.episode_id == E.id
                          and V.service_date == D
                          and V.visit_type in {PHYSICIAN_IN_PERSON, PHYSICIAN_TELEHEALTH}
                          and V.scheduling_status == COMPLETED
                          and V.attestation_status in {ATTESTED, AMENDED})
      monitoring_lapse_minutes = monitoring_lapse_daily_minutes(E, D)     # see next calculation
      kit_deployed_all_day     = R.kit_deployed_all_day

      # VARIANT FORK on Episode.program_track (declared condition):
      if E.program_track == CMS_WAIVER:
          required_in_person = WAIVER_REQUIRED_IN_PERSON_VISITS_PER_DAY   # 2
          required_physician = WAIVER_REQUIRED_PHYSICIAN_EVALS_PER_DAY    # 1
          kit_clause_applies = true
      else:  # E.program_track == FEE_FOR_SERVICE
          required_in_person = FFS_REQUIRED_IN_PERSON_VISITS_PER_DAY      # 1
          required_physician = FFS_REQUIRED_PHYSICIAN_EVALS_PER_DAY       # 0
          kit_clause_applies = false

      # Clauses evaluated in THIS order; the first failing clause names carve_out_reason.
      # 1: qualified_in_person_visit_count >= required_in_person   -> INSUFFICIENT_IN_PERSON_VISITS
      # 2: required_physician == 0 or physician_eval_present       -> MISSING_PHYSICIAN_EVAL
      # 3: monitoring_lapse_minutes <= MAX_MONITORING_LAPSE_MINUTES_PER_DAY (240, at or below, inclusive)
      #                                                            -> MONITORING_LAPSE_EXCEEDED
      # 4: kit_clause_applies == false or kit_deployed_all_day     -> KIT_NOT_DEPLOYED
      # All four clauses pass -> COMPLIANT. Otherwise -> CARVED_OUT with the first failure's reason.
    input_set: |
      Only Visit rows of the same episode whose service_date equals the record's service_date and whose
      scheduling_status == COMPLETED are counted; SCHEDULED, EN_ROUTE, NO_SHOW and CANCELLED visits are
      excluded regardless of attestation. Only MonitoringLapse rows of the same episode intersecting the
      UTC day are counted.
    constants:
      WAIVER_REQUIRED_IN_PERSON_VISITS_PER_DAY: 2
      WAIVER_REQUIRED_PHYSICIAN_EVALS_PER_DAY: 1
      FFS_REQUIRED_IN_PERSON_VISITS_PER_DAY: 1
      FFS_REQUIRED_PHYSICIAN_EVALS_PER_DAY: 0
      MAX_MONITORING_LAPSE_MINUTES_PER_DAY: 240
    precision: "integer counts; minutes are whole minutes"
    variants:
      - name: cms_waiver_compliance
        when: "Episode.program_track == CMS_WAIVER"
        difference: "Requires 2 qualified in-person visits AND a physician evaluation AND continuous kit deployment on the day."
      - name: fee_for_service_compliance
        when: "Episode.program_track == FEE_FOR_SERVICE"
        difference: "Requires only 1 qualified in-person visit; the physician-evaluation and kit-deployment clauses are skipped entirely, so the identical visit set can score COMPLIANT under FFS and CARVED_OUT under the waiver."

  - name: monitoring_lapse_daily_minutes
    trigger: "Recomputed whenever a MonitoringLapse is created for the episode and whenever daily_visit_compliance runs for the affected service_date"
    algorithm: interval_merge
    formula: |
      # For Episode E and UTC service_date D, day window = [D 00:00:00Z, D+1 00:00:00Z)
      raw = [ (max(L.gap_start_at, D 00:00:00Z), min(L.gap_end_at, D+1 00:00:00Z))
              for L in MonitoringLapse where L.episode_id == E.id
              and L.gap_start_at < D+1 00:00:00Z and L.gap_end_at > D 00:00:00Z ]
      sort raw by clipped start ASC; tie-break by MonitoringLapse.created_at ASC
      merged = []
      for (s, e) in raw:
          if merged is empty or s > merged[-1].end:      # strictly greater -> new interval
              append (s, e)
          else:                                          # overlapping OR exactly touching -> merge
              merged[-1].end = max(merged[-1].end, e)
      total_seconds = sum(e - s for (s, e) in merged)
      monitoring_lapse_minutes = floor(total_seconds / 60)   # partial minutes truncated downward
    input_set: |
      Every MonitoringLapse row of the episode that intersects the day window, clipped to the window.
      MonitoringLapse is append-only (common_fields: false) so no status filter is needed.
      Adjacency with a zero gap merges: [10:00, 10:30) and [10:30, 11:00) become one 60-minute interval.
    constants:
      SECONDS_PER_MINUTE: 60
    precision: "whole minutes, truncated downward (floor)"

  - name: episode_day_ledger
    trigger: "Recomputed on every DailyComplianceRecord status change, on POST /episodes/{id}/readmit, on POST /episodes/{id}/begin-discharge and on POST /episodes/{id}/discharge"
    algorithm: aggregation
    formula: |
      records = DailyComplianceRecord rows where episode_id == E.id, ordered by service_date ASC
      service_day_count    = count(records)
      billable_day_count   = count(records where status == COMPLIANT)
      carved_out_day_count = count(records where status == CARVED_OUT)
      pending_day_count    = count(records where status == PENDING)
      # CONSERVATION INVARIANT episode-day-ledger:
      assert service_day_count == billable_day_count + carved_out_day_count + pending_day_count
    input_set: "All DailyComplianceRecord rows of the episode, with no status filter; every record is in exactly one of the three buckets."
    constants: {}
    precision: "integer counts"

  - name: episode_reimbursement_amount
    trigger: "Recomputed whenever Episode.billable_day_count changes, and snapshotted into BillingClaim.gross_amount_usd at POST /billing-claims"
    algorithm: tiered_pricing
    formula: |
      B = Episode.billable_day_count      # carved-out and pending days contribute nothing

      # VARIANT FORK on Episode.program_track (declared condition):
      if Episode.program_track == CMS_WAIVER:
          reimbursement_amount_usd = round(B * WAIVER_PER_DIEM_USD, 2)        # 1850.00 per billable day
      else:  # FEE_FOR_SERVICE -> DRG-equivalent lump sum plus outlier per-diem
          if B == 0:
              reimbursement_amount_usd = 0.00
          else:
              outlier_days = max(0, B - DRG_OUTLIER_THRESHOLD_DAYS)           # strictly beyond 6 days
              reimbursement_amount_usd = round(
                  DRG_EQUIVALENT_BASE_USD + outlier_days * DRG_EQUIVALENT_OUTLIER_PER_DIEM_USD, 2)
    input_set: "Only DailyComplianceRecord rows with status == COMPLIANT contribute; CARVED_OUT and PENDING rows are excluded."
    constants:
      WAIVER_PER_DIEM_USD: 1850.00
      DRG_EQUIVALENT_BASE_USD: 9600.00
      DRG_EQUIVALENT_OUTLIER_PER_DIEM_USD: 640.00
      DRG_OUTLIER_THRESHOLD_DAYS: 6
    precision: "2 decimal places, round_half_up"
    variants:
      - name: waiver_per_diem
        when: "Episode.program_track == CMS_WAIVER"
        difference: "Strictly linear per-diem: 6 billable days pay 11100.00."
      - name: drg_equivalent
        when: "Episode.program_track == FEE_FOR_SERVICE"
        difference: "Flat 9600.00 for the first 6 billable days, then 640.00 for each day strictly beyond 6; 6 billable days pay 9600.00 while the waiver variant pays 11100.00 on identical data."

  - name: delivery_handling_fee
    trigger: "Computed at POST /delivery-orders, and recomputed on POST /delivery-orders/{id}/dispatch (redelivery) and POST /delivery-orders/{id}/deliver"
    algorithm: waterfall_allocation
    formula: |
      # VARIANT FORK on DeliveryOrder.is_controlled (declared condition):
      if DeliveryOrder.is_controlled == true:
          base    = CONTROLLED_HANDLING_BASE_USD          # 45.00
          witness = WITNESS_FEE_USD                       # 12.50
      else:
          base    = NON_CONTROLLED_HANDLING_BASE_USD      # 12.00
          witness = 0.00

      cold          = COLD_CHAIN_SURCHARGE_USD if DeliveryOrder.cold_chain_required else 0.00   # 22.00
      weight_fee    = round(DeliveryOrder.weight_kg * DELIVERY_WEIGHT_FEE_PER_KG_USD, 2)        # 1.40 / kg
      redeliv_fee   = DeliveryOrder.redelivery_count * REDELIVERY_FEE_USD                        # 9.00 each
      raw           = base + witness + cold + weight_fee + redeliv_fee
      # Nested min/max: floor first, then cap. Evaluation order is pinned and NOT interchangeable.
      handling_fee_usd = round(min(max(raw, DELIVERY_FEE_FLOOR_USD), DELIVERY_FEE_CAP_USD), 2)
    input_set: "A single DeliveryOrder row; no cross-entity aggregation. redelivery_count is read at the moment of the recompute."
    constants:
      CONTROLLED_HANDLING_BASE_USD: 45.00
      NON_CONTROLLED_HANDLING_BASE_USD: 12.00
      WITNESS_FEE_USD: 12.50
      COLD_CHAIN_SURCHARGE_USD: 22.00
      DELIVERY_WEIGHT_FEE_PER_KG_USD: 1.40
      REDELIVERY_FEE_USD: 9.00
      DELIVERY_FEE_FLOOR_USD: 15.00
      DELIVERY_FEE_CAP_USD: 120.00
    precision: "2 decimal places, round_half_up; weight_fee is rounded before it enters the sum"
    variants:
      - name: controlled_chain_of_custody
        when: "DeliveryOrder.is_controlled == true"
        difference: "Base 45.00 plus a 12.50 witness fee; the witnessed-handoff and segregation-of-duties gates also apply."
      - name: non_controlled_standard
        when: "DeliveryOrder.is_controlled == false"
        difference: "Base 12.00 with no witness fee; identical weight and cold-chain inputs therefore yield a raw fee 45.50 lower before the 15.00 floor and 120.00 cap are applied."

  - name: visit_travel_reimbursement
    trigger: "Per-visit value computed on POST /visits/{id}/complete; the episode total is recomputed on the same transition and on POST /episodes/{id}/discharge"
    algorithm: tiered_pricing
    formula: |
      # Per visit V (average-rate banding: ONE band rate applies to the WHOLE distance,
      # NOT marginal per-band allocation).
      if V.distance_km <= TRAVEL_BAND_1_MAX_KM:          # <= 10.0, at or below, inclusive
          rate = TRAVEL_BAND_1_USD_PER_KM                # 0.92
      elif V.distance_km <= TRAVEL_BAND_2_MAX_KM:        # 10.0 < d <= 25.0
          rate = TRAVEL_BAND_2_USD_PER_KM                # 0.74
      else:                                              # strictly greater than 25.0
          rate = TRAVEL_BAND_3_USD_PER_KM                # 0.61
      travel_payment_usd = max(round(V.distance_km * rate, 2), TRAVEL_MIN_PAYMENT_USD)   # floor 8.00

      # EPISODE TOTAL — ROUNDING ORDER IS PINNED: round PER VISIT first, THEN sum.
      # Summing raw products and rounding once at the end is explicitly NOT the rule.
      travel_reimbursement_total_usd = round(
          sum(V.travel_payment_usd for V in Visit
              where V.episode_id == E.id
              and V.scheduling_status == COMPLETED
              and V.attestation_status in {ATTESTED, AMENDED}), 2)
    input_set: |
      Only Visit rows of the episode with scheduling_status == COMPLETED and attestation_status in
      {ATTESTED, AMENDED}. NO_SHOW, CANCELLED, SCHEDULED, EN_ROUTE and UNATTESTED visits contribute 0.00.
      Order of summation does not change the result because every addend is already rounded.
      TRAVEL_MIN_PAYMENT_USD is an UNCONDITIONAL per-visit floor applied to every qualifying visit
      regardless of visit_type: a PHYSICIAN_TELEHEALTH visit with distance_km 0 still yields
      max(0.00, 8.00) == 8.00. There is no telehealth exemption.
    constants:
      TRAVEL_BAND_1_MAX_KM: 10.0
      TRAVEL_BAND_2_MAX_KM: 25.0
      TRAVEL_BAND_1_USD_PER_KM: 0.92
      TRAVEL_BAND_2_USD_PER_KM: 0.74
      TRAVEL_BAND_3_USD_PER_KM: 0.61
      TRAVEL_MIN_PAYMENT_USD: 8.00
    precision: "2 decimal places, round_half_up, applied per visit before summation"

  - name: escalation_sla_deadline
    trigger: "Computed at POST /escalation-events and recomputed on every POST /escalation-events/{id}/promote"
    algorithm: threshold
    formula: |
      base_minutes = { 1: TIER1_ACK_SLA_MINUTES,     # 10
                       2: TIER2_ACK_SLA_MINUTES,     # 20
                       3: TIER3_ACK_SLA_MINUTES,     # 30
                       4: TIER4_ACK_SLA_MINUTES      # 15
                     }[EscalationEvent.current_tier]

      # VARIANT FORK on Episode.acuity (declared condition):
      if Episode.acuity == HIGH:
          effective_minutes = round_half_up(base_minutes * HIGH_ACUITY_SLA_MULTIPLIER)   # 0.5
      else:  # STANDARD
          effective_minutes = base_minutes

      ack_deadline_at = EscalationEvent.tier_entered_at + effective_minutes minutes
      # Breach test: the clock must be STRICTLY GREATER than ack_deadline_at to permit promotion.
      # Acknowledgement is permitted while the clock is AT OR BEFORE ack_deadline_at.
    input_set: "One EscalationEvent row plus the acuity of its owning Episode; no aggregation."
    constants:
      TIER1_ACK_SLA_MINUTES: 10
      TIER2_ACK_SLA_MINUTES: 20
      TIER3_ACK_SLA_MINUTES: 30
      TIER4_ACK_SLA_MINUTES: 15
      HIGH_ACUITY_SLA_MULTIPLIER: 0.5
    precision: "whole minutes, round_half_up (tier 4 HIGH acuity is 15 * 0.5 = 7.5 which rounds up to 8)"
    variants:
      - name: standard_acuity_sla
        when: "Episode.acuity == STANDARD"
        difference: "Deadlines are 10 / 20 / 30 / 15 minutes for tiers 1-4."
      - name: high_acuity_sla
        when: "Episode.acuity == HIGH"
        difference: "Deadlines are halved and rounded half up: 5 / 10 / 15 / 8 minutes; the same clock advance that leaves a STANDARD tier-4 escalation inside its deadline breaches a HIGH-acuity one."

  - name: meal_credit_accrual
    trigger: "Recomputed on POST /meal-plans, on every MealPlan status change, and on every DailyComplianceRecord status change of the same episode"
    algorithm: aggregation
    formula: |
      eligible_dates = [ R.service_date for R in DailyComplianceRecord
                         where R.episode_id == MealPlan.episode_id
                         and R.status in {PENDING, COMPLIANT}
                         and R.service_date >= MealPlan.activated_on_date ]   # string date compare, at or after
      credited_day_count = max(0, count(eligible_dates) - MealPlan.suspension_day_count)

      # VARIANT FORK on Episode.program_track (declared condition):
      if Episode.program_track == CMS_WAIVER:
          meal_credit_total_usd = 0.00            # meals are bundled into the waiver per-diem
      else:  # FEE_FOR_SERVICE — meals are separately billable and roll into the claim gross
          meal_credit_total_usd = round(credited_day_count * MEAL_CREDIT_PER_DAY_USD, 2)   # 28.00 / day

      # Episode.meal_credit_total_usd = round(sum of meal_credit_total_usd over the episode's
      # MealPlan rows whose status is in {ACTIVE, SUSPENDED, COMPLETED}; CANCELLED plans contribute 0.00, 2)
    input_set: |
      Only DailyComplianceRecord rows of the same episode whose status is PENDING or COMPLIANT and whose
      service_date is at or after MealPlan.activated_on_date. CARVED_OUT days never accrue a meal credit,
      which is why a carve-out cascades into a MealPlan recompute.
    constants:
      MEAL_CREDIT_PER_DAY_USD: 28.00
    precision: "2 decimal places, round_half_up; credited_day_count is an integer floored at 0"
    variants:
      - name: waiver_bundled_meals
        when: "Episode.program_track == CMS_WAIVER"
        difference: "credited_day_count is still tracked but meal_credit_total_usd is always 0.00 because meals are inside the per-diem."
      - name: ffs_separately_billed_meals
        when: "Episode.program_track == FEE_FOR_SERVICE"
        difference: "meal_credit_total_usd is 28.00 per credited day and is added to BillingClaim.gross_amount_usd; identical day ledgers therefore produce different claim gross amounts across the two tracks."

  - name: claim_net_payable
    trigger: "Computed at POST /billing-claims and re-used verbatim by POST /billing-claims/{id}/record-outcome and POST /billing-claims/{id}/appeal"
    algorithm: constraint_propagation
    formula: |
      # This formula LOOKS circular: net_payable = gross - withhold, and the withhold rate is
      # keyed on a tier. EVALUATION ORDER IS PINNED as follows and is NOT interchangeable:
      #   step 1  gross_amount_usd    (from the two snapshots)
      #   step 2  withhold_rate       KEYED ON gross_amount_usd  <-- never on net_payable_usd
      #   step 3  withhold_amount_usd
      #   step 4  net_payable_usd
      gross_amount_usd = round(Episode.reimbursement_amount_usd + Episode.meal_credit_total_usd, 2)

      if gross_amount_usd <= CLAIM_WITHHOLD_TIER_THRESHOLD_USD:      # 9600.00, at or below, inclusive
          withhold_rate = CLAIM_WITHHOLD_RATE_LOW                    # 0.02
      else:
          withhold_rate = CLAIM_WITHHOLD_RATE_HIGH                   # 0.05

      withhold_amount_usd = round(gross_amount_usd * withhold_rate, 2)
      net_payable_usd     = round(gross_amount_usd - withhold_amount_usd, 2)

      # Outcome amounts:
      #   record-outcome PAID from SUBMITTED   -> paid_amount_usd = net_payable_usd
      #   record-outcome PAID from APPEALED    -> paid_amount_usd = round(net_payable_usd * APPEAL_RECOVERY_RATE, 2)
      #   record-outcome DENIED (either)       -> paid_amount_usd = 0.00
    input_set: "The Episode snapshot taken at build time (billed_day_count, reimbursement_amount_usd, meal_credit_total_usd). VOIDED claims are excluded from any recompute so carved-out days are never double-counted."
    constants:
      CLAIM_WITHHOLD_TIER_THRESHOLD_USD: 9600.00
      CLAIM_WITHHOLD_RATE_LOW: 0.02
      CLAIM_WITHHOLD_RATE_HIGH: 0.05
      APPEAL_RECOVERY_RATE: 0.60
    precision: "2 decimal places, round_half_up at each pinned step"

  - name: device_kit_census
    trigger: "Computed on demand by GET /device-kit-census and asserted after every DeviceKit transition"
    algorithm: aggregation
    formula: |
      total_kits       = count(DeviceKit)
      available_count  = count(DeviceKit where status == AVAILABLE)
      deployed_count   = count(DeviceKit where status == DEPLOYED)
      in_refurb_count  = count(DeviceKit where status == IN_REFURB)
      retired_count    = count(DeviceKit where status == RETIRED)
      # CONSERVATION INVARIANT kit-census:
      assert total_kits == available_count + deployed_count + in_refurb_count + retired_count
    input_set: "Every DeviceKit row ever created, with no filter; kits are never deleted."
    constants: {}
    precision: "integer counts"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table — 31 rules on an explicit 16-rung priority ladder.
#     Lower `priority` wins. When one request violates several rules, the
#     response carries the error_id of the LOWEST-numbered violated priority.
# ---------------------------------------------------------------------------
validation_priority_ladder:
  - rung: 1
    name: authentication
    priorities: [1]
  - rung: 2
    name: authorization
    priorities: [2]
  - rung: 3
    name: path_resource_existence
    priorities: [3]
  - rung: 4
    name: request_body_schema
    priorities: [4, 5, 6]
  - rung: 5
    name: body_foreign_key_existence
    priorities: [7]
  - rung: 6
    name: optimistic_concurrency
    priorities: [8]
  - rung: 7
    name: target_state_precondition
    priorities: [9]
  - rung: 8
    name: parent_episode_state_gate
    priorities: [10]
  - rung: 9
    name: admission_eligibility_gauntlet
    priorities: [11, 12, 13, 14, 15, 16, 17, 18]
  - rung: 10
    name: segregation_of_duties
    priorities: [19]
  - rung: 11
    name: clinical_custody_safety
    priorities: [20, 21]
  - rung: 12
    name: temporal_overlap
    priorities: [22]
  - rung: 13
    name: referential_compatibility
    priorities: [23]
  - rung: 14
    name: capacity_and_caps
    priorities: [24, 25, 26, 27]
  - rung: 15
    name: discharge_reconciliation_gate
    priorities: [28, 29, 30]
  - rung: 16
    name: fiscal_gate
    priorities: [31]

validations:
  - priority: 1
    rung: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    rung: 2
    category: auth
    check: "The caller's X-User-Role appears in the target endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    rung: 3
    category: existence
    check: "Every id in the URL path resolves, validated left to right. Error id by resource type: Patient -> ERR_PATIENT_NOT_FOUND, Referral -> ERR_REFERRAL_NOT_FOUND, Episode -> ERR_EPISODE_NOT_FOUND, every other entity -> ERR_RESOURCE_NOT_FOUND"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    rung: 4
    category: business_constraint
    check: "Every field declared required in the endpoint's input is present and non-null"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST, PUT and PATCH endpoints"

  - priority: 5
    rung: 4
    category: business_constraint
    check: "Every enum-typed field carries a value inside its declared constraint set"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints with enum inputs"

  - priority: 6
    rung: 4
    category: business_constraint
    check: "Numeric and format bounds hold: home_distance_km >= 0, weight_kg >= 0, distance_km >= 0, replacement_cost_usd >= 0, total_beds >= 1, daily_delivery_count between 1 and 3 inclusive, excursion_minutes >= 0, scheduled_end_at strictly greater than scheduled_start_at, gap_end_at strictly greater than gap_start_at, service_date equal to the UTC date part of scheduled_start_at, limit between 1 and 100 inclusive, offset >= 0, all datetimes ISO 8601 UTC"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints accepting the named fields"

  - priority: 7
    rung: 5
    category: business_referential
    check: "Every foreign key supplied in the request body resolves: patient_id -> ERR_PATIENT_NOT_FOUND, referral_id -> ERR_REFERRAL_NOT_FOUND, episode_id -> ERR_EPISODE_NOT_FOUND, unit_id and kit_id -> ERR_RESOURCE_NOT_FOUND"
    error_id: ERR_EPISODE_NOT_FOUND
    http_status: 404
    applies_to: "POST /referrals, POST /eligibility-assessments, POST /episodes, POST /visits, POST /monitoring-lapses, POST /delivery-orders, POST /meal-plans, POST /escalation-events, POST /bed-reservations, POST /billing-claims, POST /device-kits/{id}/deploy"

  - priority: 8
    rung: 6
    category: state
    check: "The supplied expected_kit_version, expected_unit_version or expected_episode_version equals the current version of the named parent entity"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /device-kits/{id}/deploy, POST /bed-reservations, POST /billing-claims"

  - priority: 9
    rung: 7
    category: state
    check: "The target entity's current state appears in the `from:` set of the requested transition (including cap-guarded edges such as redelivery_count and appeal_count already at their limit being routed by rungs 14 instead)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 10
    rung: 8
    category: state
    check: "For operations that write into a live episode, the parent Episode.status == ACTIVE"
    error_id: ERR_EPISODE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /visits, POST /visits/{id}/depart, POST /visits/{id}/complete, POST /device-kits/{id}/deploy, POST /delivery-orders, POST /delivery-orders/{id}/authorize, POST /delivery-orders/{id}/dispatch, POST /meal-plans, POST /monitoring-lapses"

  - priority: 11
    rung: 9
    category: business_safety
    check: "Referral.origin is in ELIGIBLE_REFERRAL_ORIGINS (ED or INPATIENT_WARD)"
    error_id: ERR_REFERRAL_ORIGIN_INELIGIBLE
    http_status: 422
    applies_to: "POST /referrals/{id}/mark-eligible"

  - priority: 12
    rung: 9
    category: business_safety
    check: "Referral.qualifying_condition_code is in QUALIFYING_CONDITION_CODES (CHF_EXAC, COPD_EXAC, CAP_PNEUMONIA, CELLULITIS, UTI_COMPLICATED, COVID_MODERATE); the value OTHER is legal as an enum but never qualifying"
    error_id: ERR_CONDITION_NOT_QUALIFYING
    http_status: 422
    applies_to: "POST /referrals/{id}/mark-eligible"

  - priority: 13
    rung: 9
    category: business_safety
    check: "Patient.home_distance_km is at or below SERVICE_RADIUS_KM (40.0, inclusive: exactly 40.0 passes, 40.1 fails)"
    error_id: ERR_OUTSIDE_SERVICE_RADIUS
    http_status: 422
    applies_to: "POST /referrals/{id}/mark-eligible, POST /episodes"

  - priority: 14
    rung: 9
    category: business_temporal
    check: "The latest-created EligibilityAssessment.in_person_eval_at is at or after (admission instant minus PHYSICIAN_EVAL_WINDOW_HOURS = 24 hours) AND at or before the admission instant; both bounds inclusive"
    error_id: ERR_EVAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /episodes"

  - priority: 15
    rung: 9
    category: business_safety
    check: "The latest-created EligibilityAssessment.home_safety_outcome == PASS; CONDITIONAL and FAIL both reject"
    error_id: ERR_HOME_SAFETY_FAILED
    http_status: 422
    applies_to: "POST /referrals/{id}/mark-eligible"

  - priority: 16
    rung: 9
    category: business_safety
    check: "The latest-created EligibilityAssessment.broadband_check == PASS"
    error_id: ERR_CONNECTIVITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /referrals/{id}/mark-eligible"

  - priority: 17
    rung: 9
    category: business_safety
    check: "When Referral.acuity == HIGH, both Patient.caregiver_present and the latest-created EligibilityAssessment.caregiver_present_confirmed are true; STANDARD acuity skips this rung entirely"
    error_id: ERR_CAREGIVER_REQUIRED
    http_status: 422
    applies_to: "POST /referrals/{id}/mark-eligible"

  - priority: 18
    rung: 9
    category: business_safety
    check: "The latest-created EligibilityAssessment.consent_signed == true"
    error_id: ERR_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /referrals/{id}/mark-eligible"

  - priority: 19
    rung: 10
    category: business_safety
    check: "When DeliveryOrder.is_controlled == true, the authorizing caller's X-User-ID differs from DeliveryOrder.requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /delivery-orders/{id}/authorize"

  - priority: 20
    rung: 11
    category: business_safety
    check: "When DeliveryOrder.is_controlled == true, witness_staff_id is supplied and non-empty in the delivery request body"
    error_id: ERR_WITNESS_REQUIRED
    http_status: 422
    applies_to: "POST /delivery-orders/{id}/deliver"

  - priority: 21
    rung: 11
    category: business_safety
    check: "When DeliveryOrder.cold_chain_required == true, the supplied excursion_minutes is at or below COLD_CHAIN_MAX_EXCURSION_MINUTES (30, inclusive: exactly 30 passes, 31 fails)"
    error_id: ERR_COLD_CHAIN_EXCURSION
    http_status: 422
    applies_to: "POST /delivery-orders/{id}/deliver"

  - priority: 22
    rung: 12
    category: business_temporal
    check: "No other Visit with the same staff_user_id and scheduling_status in {SCHEDULED, EN_ROUTE, COMPLETED} occupies an interval that collides with the requested one. Intervals are half-open [scheduled_start_at, scheduled_end_at) and each existing visit is padded on its trailing edge by VISIT_TURNAROUND_BUFFER_MINUTES (15): the new visit is accepted only when its start is at or after (existing end + 15 minutes) or its end is at or before existing start. Exactly 15 minutes of separation passes; 14 minutes collides."
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /visits"

  - priority: 23
    rung: 13
    category: business_referential
    check: "MealPlan.diet_code is compatible with Patient.diet_restriction: when Patient.diet_restriction == NONE any diet_code is accepted, otherwise diet_code must equal Patient.diet_restriction exactly"
    error_id: ERR_DIET_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /meal-plans"

  - priority: 24
    rung: 14
    category: business_constraint
    check: "InpatientUnit.available_bed_count, after lazily expiring every HELD reservation of the unit whose hold_expires_at is strictly before the clock, is at least 1"
    error_id: ERR_NO_BEDS_AVAILABLE
    http_status: 409
    applies_to: "POST /bed-reservations"

  - priority: 25
    rung: 14
    category: business_constraint
    check: "The target DeviceKit.status == AVAILABLE and no other kit is already DEPLOYED to the target episode"
    error_id: ERR_KIT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /device-kits/{id}/deploy"

  - priority: 26
    rung: 14
    category: business_constraint
    check: "A redelivery dispatch from REFUSED requires DeliveryOrder.redelivery_count strictly less than MAX_REDELIVERY_ATTEMPTS (2); a value of 2 or more rejects"
    error_id: ERR_REDELIVERY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-orders/{id}/dispatch"

  - priority: 27
    rung: 14
    category: business_constraint
    check: "An appeal requires BillingClaim.appeal_count strictly less than MAX_APPEAL_ATTEMPTS (2); a value of 2 or more rejects"
    error_id: ERR_APPEAL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /billing-claims/{id}/appeal"

  - priority: 28
    rung: 15
    category: business_safety
    check: "Episode.med_rec_signed == true"
    error_id: ERR_MED_REC_UNSIGNED
    http_status: 409
    applies_to: "POST /episodes/{id}/discharge"

  - priority: 29
    rung: 15
    category: business_referential
    check: "Every DeliveryOrder with episode_id == the episode has status in the terminal set {DELIVERED, FAILED, CANCELLED}"
    error_id: ERR_DELIVERY_NOT_TERMINAL
    http_status: 409
    applies_to: "POST /episodes/{id}/discharge"

  - priority: 30
    rung: 15
    category: business_referential
    check: "No DeviceComponent of the kit most recently deployed to the episode has reconciliation_status in {DEPLOYED, PENDING_RECONCILIATION}"
    error_id: ERR_RECONCILIATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /episodes/{id}/discharge"

  - priority: 31
    rung: 16
    category: business_fiscal
    check: "Episode.billable_day_count is at least MIN_BILLABLE_DAYS_FOR_CLAIM (1)"
    error_id: ERR_NO_BILLABLE_DAYS
    http_status: 422
    applies_to: "POST /billing-claims"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table (60 endpoints)
# ---------------------------------------------------------------------------
endpoints:

  # --- logical clock -------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["all subsequent timestamp stamping, SLA deadline comparison and bed-hold expiry use the new value"]

  # --- patients ------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [ProgramAdmin, AdmittingPhysician]
    code: 201
    input: ["mrn", "full_name", "home_distance_km", "primary_diagnosis_code", "diet_restriction?", "broadband_verified?", "caregiver_present?"]
    output: "Patient"
    side_effects: ["Patient.status initialized to REGISTERED"]

  - method: GET
    path: "/patients/{id}"
    description: "Read one patient"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse, CommunityParamedic, LogisticsCoordinator, BillingAnalyst, Patient]
    code: 200
    input: []
    output: "Patient"
    side_effects: []

  - method: PATCH
    path: "/patients/{id}"
    description: "Update the home-environment attributes that feed the admission gauntlet"
    roles: [ProgramAdmin, AdmittingPhysician]
    code: 200
    input: ["home_distance_km?", "diet_restriction?", "broadband_verified?", "caregiver_present?"]
    output: "Patient"
    side_effects: ["increments Patient.version by 1"]

  - method: GET
    path: "/patients/{id}/referrals"
    description: "List the referrals filed for a patient"
    roles: [ProgramAdmin, AdmittingPhysician, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Referral[]"
    side_effects: []

  # --- referrals -----------------------------------------------------------
  - method: POST
    path: "/referrals"
    description: "File a referral into the hospital-at-home program"
    roles: [AdmittingPhysician]
    code: 201
    input: ["patient_id", "origin", "qualifying_condition_code", "acuity", "referring_physician_user_id"]
    output: "Referral"
    side_effects: ["Referral.status initialized to SUBMITTED"]

  - method: GET
    path: "/referrals/{id}"
    description: "Read one referral"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse]
    code: 200
    input: []
    output: "Referral"
    side_effects: []

  - method: POST
    path: "/referrals/{id}/mark-eligible"
    description: "Run admission-gauntlet priorities 11, 12, 13, 15, 16, 17 and 18 against the latest-created EligibilityAssessment and move the referral SCREENING -> ELIGIBLE"
    roles: [AdmittingPhysician]
    code: 200
    input: []
    output: "Referral"
    side_effects:
      - "Referral.status set to ELIGIBLE on success; on failure the referral stays SCREENING and Referral.first_failed_gauntlet_rung records the winning error_id"
      - "increments Referral.version by 1"

  # --- eligibility assessments --------------------------------------------
  - method: POST
    path: "/eligibility-assessments"
    description: "Record the in-person evaluation, home-safety, connectivity, caregiver and consent facts for a referral"
    roles: [AdmittingPhysician, FieldNurse]
    code: 201
    input: ["referral_id", "in_person_eval_at", "home_safety_outcome", "broadband_check", "caregiver_present_confirmed", "consent_signed", "assessor_user_id"]
    output: "EligibilityAssessment"
    side_effects: ["the parent Referral transitions SUBMITTED -> SCREENING on the first assessment"]

  - method: GET
    path: "/referrals/{id}/eligibility-assessments"
    description: "List the assessments recorded for a referral"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse]
    code: 200
    input: ["limit?", "offset?"]
    output: "EligibilityAssessment[]"
    side_effects: []

  # --- episodes ------------------------------------------------------------
  - method: POST
    path: "/episodes"
    description: "Admit the patient to the hospital-at-home program; enforces priority 13 (service-radius re-check) and priority 14 (physician-evaluation window)"
    roles: [AdmittingPhysician]
    code: 201
    input: ["patient_id", "referral_id", "program_track"]
    output: "Episode"
    side_effects:
      - "Episode.status initialized to ACTIVE; admitted_at and physician_eval_at stamped"
      - "Episode.acuity copied from Referral.acuity"
      - "Referral.status set to ADMITTED and Patient.status set to IN_PROGRAM"
      - "one PENDING DailyComplianceRecord minted for the admission UTC date"

  - method: GET
    path: "/episodes/{id}"
    description: "Read one episode including its recomputed day ledger counters"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse, CommunityParamedic, LogisticsCoordinator, PharmacyAuthorizer, BillingAnalyst, Patient]
    code: 200
    input: []
    output: "Episode"
    side_effects: []

  - method: GET
    path: "/episodes"
    description: "List episodes, filterable by patient_id, referral_id and status"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse, CommunityParamedic, LogisticsCoordinator, BillingAnalyst]
    code: 200
    input: ["patient_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: "Episode[]"
    side_effects: []

  - method: GET
    path: "/episodes/{id}/ledger"
    description: "Computed read: the episode day ledger and money totals"
    roles: [ProgramAdmin, AdmittingPhysician, BillingAnalyst]
    code: 200
    input: []
    output: { service_day_count: integer, billable_day_count: integer, carved_out_day_count: integer, pending_day_count: integer, reimbursement_amount_usd: number, meal_credit_total_usd: number, travel_reimbursement_total_usd: number }
    side_effects: []

  - method: POST
    path: "/episodes/{id}/sign-med-rec"
    description: "Sign medication reconciliation for the current admission"
    roles: [AdmittingPhysician]
    code: 200
    input: []
    output: "Episode"
    side_effects: ["Episode.med_rec_signed set to true", "Episode.med_rec_signed_by_user_id set to the caller's X-User-ID", "increments Episode.version by 1"]

  - method: POST
    path: "/episodes/{id}/begin-discharge"
    description: "Move ACTIVE -> DISCHARGE_PENDING, back-fill missing compliance days and release the deployed device kit for reconciliation"
    roles: [AdmittingPhysician]
    code: 200
    input: []
    output: "Episode"
    side_effects:
      - "Episode.status set to DISCHARGE_PENDING"
      - "missing UTC dates in the inclusive range from the admitted_at date to the clock date are back-filled as PENDING DailyComplianceRecord rows"
      - "the DEPLOYED DeviceKit of this episode transitions to IN_REFURB and its DEPLOYED components move to PENDING_RECONCILIATION"
      - "increments Episode.version by 1"

  - method: POST
    path: "/episodes/{id}/discharge"
    description: "Close the episode; blocked by the medication-reconciliation, open-delivery and component-reconciliation gates"
    roles: [AdmittingPhysician]
    code: 200
    input: []
    output: "Episode"
    side_effects:
      - "Episode.status set to DISCHARGED and discharged_at stamped"
      - "CASCADE C4: open Visits cancelled, then their DailyComplianceRecords finalized, then MealPlan credits recomputed"
      - "Patient.status set to DISCHARGED and Referral.status set to CLOSED"
      - "increments Episode.version by 1"

  - method: POST
    path: "/episodes/{id}/readmit"
    description: "Return a RETURNED_TO_FACILITY episode to the home program, releasing its bed and resuming its meal plan"
    roles: [AdmittingPhysician]
    code: 200
    input: []
    output: "Episode"
    side_effects:
      - "Episode.status set to ACTIVE and readmission_count incremented by 1"
      - "HELD or OCCUPIED BedReservations of the episode transition to RELEASED"
      - "SUSPENDED MealPlans of the episode transition to ACTIVE"
      - "increments Episode.version by 1"

  # --- visits --------------------------------------------------------------
  - method: POST
    path: "/visits"
    description: "Schedule a nurse, paramedic or physician visit (in-person or telehealth); enforces the staff turnaround-buffer overlap rule"
    roles: [FieldNurse, CommunityParamedic, AdmittingPhysician]
    code: 201
    input: ["episode_id", "visit_type", "staff_user_id", "service_date", "scheduled_start_at", "scheduled_end_at", "distance_km"]
    output: "Visit"
    side_effects:
      - "Visit.scheduling_status initialized to SCHEDULED and attestation_status to UNATTESTED"
      - "a PENDING DailyComplianceRecord is minted for (episode_id, service_date) when none exists"

  - method: GET
    path: "/episodes/{id}/visits"
    description: "List the visits of an episode"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse, CommunityParamedic, BillingAnalyst, Patient]
    code: 200
    input: ["service_date?", "scheduling_status?", "limit?", "offset?"]
    output: "Visit[]"
    side_effects: []

  - method: POST
    path: "/visits/{id}/depart"
    description: "Scheduling axis: SCHEDULED -> EN_ROUTE"
    roles: [FieldNurse, CommunityParamedic, AdmittingPhysician]
    code: 200
    input: []
    output: "Visit"
    side_effects: ["Visit.scheduling_status set to EN_ROUTE", "increments Visit.version by 1"]

  - method: POST
    path: "/visits/{id}/complete"
    description: "Scheduling axis: EN_ROUTE -> COMPLETED; computes the per-visit travel payment"
    roles: [FieldNurse, CommunityParamedic, AdmittingPhysician]
    code: 200
    input: []
    output: "Visit"
    side_effects:
      - "Visit.scheduling_status set to COMPLETED"
      - "Visit.travel_payment_usd computed per calculations.visit_travel_reimbursement"
      - "the DailyComplianceRecord for (episode_id, service_date) is recomputed"
      - "increments Visit.version by 1"

  - method: POST
    path: "/visits/{id}/close-unperformed"
    description: "Scheduling axis: SCHEDULED or EN_ROUTE -> NO_SHOW or CANCELLED depending on the supplied outcome. `outcome` is an enum accepting exactly NO_SHOW or CANCELLED; any other value is rejected with ERR_INVALID_ENUM."
    roles: [FieldNurse, CommunityParamedic, AdmittingPhysician]
    code: 200
    input: ["outcome"]
    output: "Visit"
    side_effects: ["Visit.scheduling_status set to the supplied outcome", "the DailyComplianceRecord for (episode_id, service_date) is recomputed", "increments Visit.version by 1"]

  - method: POST
    path: "/visits/{id}/attest"
    description: "Attestation axis: UNATTESTED -> ATTESTED, or ATTESTED -> AMENDED on a second call; an amendment reopens a finalized compliance day"
    roles: [FieldNurse, CommunityParamedic, AdmittingPhysician]
    code: 200
    input: []
    output: "Visit"
    side_effects:
      - "Visit.attestation_status advanced one step and attested_by_user_id set to the caller's X-User-ID"
      - "the DailyComplianceRecord for (episode_id, service_date) is recomputed, and reopened to PENDING when the call produced AMENDED"
      - "increments Visit.version by 1"

  # --- daily compliance records -------------------------------------------
  - method: GET
    path: "/episodes/{id}/compliance-days"
    description: "List the per-service-date compliance records of an episode"
    roles: [ProgramAdmin, AdmittingPhysician, BillingAnalyst]
    code: 200
    input: ["status?", "service_date?", "limit?", "offset?"]
    output: "DailyComplianceRecord[]"
    side_effects: []

  - method: POST
    path: "/compliance-days/{id}/finalize"
    description: "Finalize a PENDING day into COMPLIANT or CARVED_OUT per calculations.daily_visit_compliance"
    roles: [ProgramAdmin, AdmittingPhysician]
    code: 200
    input: []
    output: "DailyComplianceRecord"
    side_effects:
      - "DailyComplianceRecord.status set to COMPLIANT or CARVED_OUT and finalized_at stamped"
      - "Episode day-ledger counters and money totals recomputed"
      - "any BUILT BillingClaim of the episode transitions to VOIDED when the day carved out"
      - "increments DailyComplianceRecord.version by 1"

  # --- device kits ---------------------------------------------------------
  - method: POST
    path: "/device-kits"
    description: "Add a remote-monitoring kit to inventory"
    roles: [ProgramAdmin]
    code: 201
    input: ["asset_tag"]
    output: "DeviceKit"
    side_effects: ["DeviceKit.status initialized to AVAILABLE"]

  - method: GET
    path: "/device-kits/{id}"
    description: "Read one device kit"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse]
    code: 200
    input: []
    output: "DeviceKit"
    side_effects: []

  - method: GET
    path: "/episodes/{id}/device-kits"
    description: "List the device kits currently assigned to an episode"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceKit[]"
    side_effects: []

  - method: POST
    path: "/device-kits/{id}/deploy"
    description: "Deploy an AVAILABLE kit to an ACTIVE episode under optimistic concurrency on DeviceKit.version"
    roles: [FieldNurse]
    code: 200
    input: ["episode_id", "expected_kit_version"]
    output: "DeviceKit"
    side_effects:
      - "DeviceKit.status set to DEPLOYED, assigned_episode_id set, deployed_at stamped"
      - "IN_STOCK components of the kit move to DEPLOYED"
      - "increments DeviceKit.version by 1"

  - method: GET
    path: "/device-kit-census"
    description: "Computed read: the program-wide kit conservation census"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { total_kits: integer, available_count: integer, deployed_count: integer, in_refurb_count: integer, retired_count: integer }
    side_effects: []

  - method: POST
    path: "/device-kits/{id}/components"
    description: "Add a typed component to a kit"
    roles: [ProgramAdmin]
    code: 201
    input: ["component_type", "serial_number", "replacement_cost_usd"]
    output: "DeviceComponent"
    side_effects: ["DeviceComponent.reconciliation_status initialized to IN_STOCK", "DeviceKit.component_count recomputed"]

  - method: GET
    path: "/device-kits/{id}/components"
    description: "List the components of a kit"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse]
    code: 200
    input: ["reconciliation_status?", "limit?", "offset?"]
    output: "DeviceComponent[]"
    side_effects: []

  - method: POST
    path: "/device-components/{id}/reconcile"
    description: "Reconcile a PENDING_RECONCILIATION component; reconciling the last one returns the kit to AVAILABLE or RETIRED. `outcome` is an enum accepting exactly RETURNED or WRITTEN_OFF; any other value is rejected with ERR_INVALID_ENUM."
    roles: [FieldNurse]
    code: 200
    input: ["outcome"]
    output: "DeviceComponent"
    side_effects:
      - "DeviceComponent.reconciliation_status set to RETURNED or WRITTEN_OFF and reconciled_by_user_id stamped"
      - "DeviceKit.unreconciled_component_count recomputed"
      - "when the count reaches 0 the kit transitions IN_REFURB -> AVAILABLE, or IN_REFURB -> RETIRED when refurb_cycle_count is strictly greater than 5"

  # --- monitoring lapses ---------------------------------------------------
  - method: POST
    path: "/monitoring-lapses"
    description: "Record an append-only telemetry gap for an episode"
    roles: [ProgramAdmin, FieldNurse]
    code: 201
    input: ["episode_id", "gap_start_at", "gap_end_at", "cause?"]
    output: "MonitoringLapse"
    side_effects:
      - "a PENDING DailyComplianceRecord is minted for the UTC date of gap_start_at when none exists"
      - "the affected DailyComplianceRecord monitoring_lapse_minutes recomputed per calculations.monitoring_lapse_daily_minutes"

  - method: GET
    path: "/episodes/{id}/monitoring-lapses"
    description: "List the telemetry gaps recorded for an episode"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse]
    code: 200
    input: ["limit?", "offset?"]
    output: "MonitoringLapse[]"
    side_effects: []

  # --- delivery orders -----------------------------------------------------
  - method: POST
    path: "/delivery-orders"
    description: "Raise a medication or DME delivery order for an ACTIVE episode; the handling fee is computed immediately"
    roles: [LogisticsCoordinator, AdmittingPhysician]
    code: 201
    input: ["episode_id", "order_kind", "is_controlled", "cold_chain_required", "weight_kg", "requested_by_user_id"]
    output: "DeliveryOrder"
    side_effects: ["DeliveryOrder.status initialized to PENDING_AUTHORIZATION", "DeliveryOrder.handling_fee_usd computed per calculations.delivery_handling_fee"]

  - method: GET
    path: "/episodes/{id}/delivery-orders"
    description: "List the delivery orders of an episode"
    roles: [ProgramAdmin, AdmittingPhysician, LogisticsCoordinator, PharmacyAuthorizer, CommunityParamedic]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DeliveryOrder[]"
    side_effects: []

  - method: POST
    path: "/delivery-orders/{id}/authorize"
    description: "Authorize a pending order; controlled orders require an authorizing identity distinct from requested_by_user_id"
    roles: [PharmacyAuthorizer]
    code: 200
    input: []
    output: "DeliveryOrder"
    side_effects: ["DeliveryOrder.status set to AUTHORIZED", "DeliveryOrder.authorized_by_user_id set to the caller's X-User-ID", "increments DeliveryOrder.version by 1"]

  - method: POST
    path: "/delivery-orders/{id}/dispatch"
    description: "Send the order out for delivery from AUTHORIZED, or redeliver from REFUSED while redelivery_count is strictly less than 2"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: "DeliveryOrder"
    side_effects:
      - "DeliveryOrder.status set to OUT_FOR_DELIVERY"
      - "on a redelivery, redelivery_count is incremented by 1 and handling_fee_usd is recomputed"
      - "increments DeliveryOrder.version by 1"

  - method: POST
    path: "/delivery-orders/{id}/deliver"
    description: "Complete a handoff; controlled orders require witness_staff_id and cold-chain orders require excursion_minutes at or below 30"
    roles: [LogisticsCoordinator, CommunityParamedic]
    code: 200
    input: ["witness_staff_id?", "excursion_minutes?"]
    output: "DeliveryOrder"
    side_effects: ["DeliveryOrder.status set to DELIVERED", "witness_staff_id and last_excursion_minutes recorded", "handling_fee_usd recomputed", "increments DeliveryOrder.version by 1"]

  - method: POST
    path: "/delivery-orders/{id}/refuse"
    description: "Record a refused handoff (OUT_FOR_DELIVERY -> REFUSED), or abandon an already-REFUSED order whose two redeliveries are exhausted into FAILED, which opens a tier-1 escalation"
    roles: [LogisticsCoordinator, CommunityParamedic]
    code: 200
    input: []
    output: "DeliveryOrder"
    side_effects:
      - "DeliveryOrder.status set to REFUSED from OUT_FOR_DELIVERY, or to FAILED from REFUSED when redelivery_count == 2"
      - "on FAILED, a new EscalationEvent is created for the same episode with reason MEDICATION_FAILURE at TIER1_OPEN and Episode.open_escalation_count is incremented by 1"
      - "increments DeliveryOrder.version by 1"

  # --- meal plans ----------------------------------------------------------
  - method: POST
    path: "/meal-plans"
    description: "Open a meal plan for an ACTIVE episode; the diet code must be compatible with the patient's diet restriction"
    roles: [LogisticsCoordinator]
    code: 201
    input: ["episode_id", "diet_code", "daily_delivery_count"]
    output: "MealPlan"
    side_effects: ["MealPlan.status initialized to ACTIVE and activated_on_date stamped from the clock date", "credited_day_count and meal_credit_total_usd computed per calculations.meal_credit_accrual"]

  - method: GET
    path: "/episodes/{id}/meal-plans"
    description: "List the meal plans of an episode"
    roles: [ProgramAdmin, AdmittingPhysician, LogisticsCoordinator, BillingAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MealPlan[]"
    side_effects: []

  # --- escalation events ---------------------------------------------------
  - method: POST
    path: "/escalation-events"
    description: "Open a tier-1 escalation on an episode; the acknowledgement deadline is computed from the episode acuity"
    roles: [FieldNurse, CommunityParamedic, ProgramAdmin]
    code: 201
    input: ["episode_id", "reason", "opened_by_user_id"]
    output: "EscalationEvent"
    side_effects: ["EscalationEvent.status initialized to TIER1_OPEN, current_tier 1, tier_entered_at stamped", "ack_deadline_at computed per calculations.escalation_sla_deadline", "Episode.open_escalation_count recomputed"]

  - method: GET
    path: "/episodes/{id}/escalation-events"
    description: "List the escalations of an episode"
    roles: [ProgramAdmin, AdmittingPhysician, FieldNurse, CommunityParamedic]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EscalationEvent[]"
    side_effects: []

  - method: POST
    path: "/escalation-events/{id}/acknowledge"
    description: "Acknowledge the current OPEN tier; permitted only while the clock is at or before ack_deadline_at"
    roles: [FieldNurse, AdmittingPhysician, CommunityParamedic]
    code: 200
    input: []
    output: "EscalationEvent"
    side_effects: ["EscalationEvent.status advanced from TIERn_OPEN to TIERn_ACKED", "acknowledged_by_user_id stamped", "increments EscalationEvent.version by 1"]

  - method: POST
    path: "/escalation-events/{id}/promote"
    description: "Promote to the next tier; from a TIERn_OPEN status this requires the clock to be strictly greater than ack_deadline_at, from TIERn_ACKED it is always permitted"
    roles: [ProgramAdmin, FieldNurse]
    code: 200
    input: []
    output: "EscalationEvent"
    side_effects:
      - "current_tier incremented, status set to the next TIERn_OPEN, tier_entered_at re-stamped, ack_deadline_at recomputed, acknowledged_by_user_id reset to null, promotion_count incremented by 1"
      - "on entry to TIER3_OPEN the owning Episode transitions ACTIVE -> ESCALATED"
      - "increments EscalationEvent.version by 1"

  - method: POST
    path: "/escalation-events/{id}/resolve"
    description: "Resolve an acknowledged escalation; resolving the last open one returns the episode to ACTIVE"
    roles: [FieldNurse, AdmittingPhysician, CommunityParamedic]
    code: 200
    input: []
    output: "EscalationEvent"
    side_effects: ["EscalationEvent.status set to RESOLVED", "Episode.open_escalation_count recomputed", "the Episode transitions ESCALATED -> ACTIVE when no escalation remains open", "increments EscalationEvent.version by 1"]

  - method: POST
    path: "/escalation-events/{id}/convert-bed-return"
    description: "Convert a tier-3-acknowledged or tier-4 escalation into a bed return; fires the depth-5 cascade C1"
    roles: [AdmittingPhysician]
    code: 200
    input: []
    output: "EscalationEvent"
    side_effects:
      - "EscalationEvent.status set to BED_RETURN_CONVERTED and the earliest-held BedReservation of the episode transitions HELD -> OCCUPIED"
      - "CASCADE C1: Episode -> RETURNED_TO_FACILITY, then DeviceKit -> IN_REFURB, then the current-date DailyComplianceRecord -> CARVED_OUT, then any BUILT BillingClaim -> VOIDED"
      - "ACTIVE MealPlans suspended and non-terminal DeliveryOrders cancelled"
      - "increments EscalationEvent.version by 1"

  # --- inpatient units and bed reservations --------------------------------
  - method: POST
    path: "/inpatient-units"
    description: "Register a receiving inpatient unit with a fixed bed count"
    roles: [ProgramAdmin]
    code: 201
    input: ["unit_code", "total_beds"]
    output: "InpatientUnit"
    side_effects: ["held_bed_count and occupied_bed_count initialized to 0, available_bed_count to total_beds"]

  - method: GET
    path: "/inpatient-units/{id}"
    description: "Read one inpatient unit; lazily expires any HELD reservation past its hold window before reporting the census"
    roles: [ProgramAdmin, AdmittingPhysician]
    code: 200
    input: []
    output: "InpatientUnit"
    side_effects: ["HELD BedReservations of this unit whose hold_expires_at is strictly before the clock transition to EXPIRED"]

  - method: POST
    path: "/bed-reservations"
    description: "Hold a bed for an episode under optimistic concurrency on InpatientUnit.version. Permitted while Episode.status is any of ACTIVE, ESCALATED, RETURNED_TO_FACILITY or DISCHARGE_PENDING; a DISCHARGED episode is rejected with ERR_INVALID_STATE (priority 9). There is no ACTIVE-only gate on this endpoint."
    roles: [AdmittingPhysician]
    code: 201
    input: ["unit_id", "episode_id", "expected_unit_version"]
    output: "BedReservation"
    side_effects:
      - "BedReservation.status initialized to HELD, held_at stamped, hold_expires_at set to held_at plus 120 minutes"
      - "InpatientUnit.held_bed_count incremented and available_bed_count decremented"
      - "increments InpatientUnit.version by 1"

  - method: GET
    path: "/bed-reservations/{id}"
    description: "Read one bed reservation; lazily expires it when the hold window has passed"
    roles: [ProgramAdmin, AdmittingPhysician]
    code: 200
    input: []
    output: "BedReservation"
    side_effects: ["the reservation transitions HELD -> EXPIRED when the clock is strictly greater than hold_expires_at"]

  - method: GET
    path: "/bed-reservations"
    description: "List bed reservations, filterable by unit_id, episode_id and status"
    roles: [ProgramAdmin, AdmittingPhysician]
    code: 200
    input: ["unit_id?", "episode_id?", "status?", "limit?", "offset?"]
    output: "BedReservation[]"
    side_effects: []

  # --- billing claims ------------------------------------------------------
  - method: POST
    path: "/billing-claims"
    description: "Build a claim from the episode's COMPLIANT days under optimistic concurrency on Episode.version"
    roles: [BillingAnalyst]
    code: 201
    input: ["episode_id", "expected_episode_version"]
    output: "BillingClaim"
    side_effects:
      - "BillingClaim.status initialized to BUILT with billed_day_count snapshotted from Episode.billable_day_count"
      - "gross_amount_usd, withhold_rate, withhold_amount_usd and net_payable_usd computed per calculations.claim_net_payable"
      - "increments Episode.version by 1"

  - method: GET
    path: "/episodes/{id}/billing-claims"
    description: "List the claims built for an episode"
    roles: [ProgramAdmin, AdmittingPhysician, BillingAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BillingClaim[]"
    side_effects: []

  - method: POST
    path: "/billing-claims/{id}/submit"
    description: "Submit a BUILT claim to the payer; the episode must already be DISCHARGED"
    roles: [BillingAnalyst]
    code: 200
    input: []
    output: "BillingClaim"
    side_effects: ["BillingClaim.status set to SUBMITTED", "increments BillingClaim.version by 1"]

  - method: POST
    path: "/billing-claims/{id}/record-outcome"
    description: "Record a payer outcome against a SUBMITTED, APPEALED, PAID or DENIED claim. `outcome` is an enum accepting exactly PAID, DENIED or CLOSED; any other value is rejected with ERR_INVALID_ENUM. `denial_reason` is required when outcome is DENIED and ignored otherwise."
    roles: [BillingAnalyst]
    code: 200
    input: ["outcome", "denial_reason?"]
    output: "BillingClaim"
    side_effects:
      - "BillingClaim.status set to the supplied outcome"
      - "paid_amount_usd set to net_payable_usd from SUBMITTED, to net_payable_usd multiplied by 0.60 and rounded from APPEALED, or to 0.00 on DENIED"
      - "increments BillingClaim.version by 1"

  - method: POST
    path: "/billing-claims/{id}/appeal"
    description: "Appeal a DENIED claim while appeal_count is strictly less than 2"
    roles: [BillingAnalyst]
    code: 200
    input: []
    output: "BillingClaim"
    side_effects: ["BillingClaim.status set to APPEALED and appeal_count incremented by 1", "increments BillingClaim.version by 1"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog (32 codes)
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles"
  - id: ERR_VALIDATION
    http: 400
    condition: "A required body field is missing or null, or a numeric, format or ordering bound is violated"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "An enum-typed field carries a value outside its declared constraint set"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "A patient id in the path or body does not resolve"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "A referral id in the path or body does not resolve"
  - id: ERR_EPISODE_NOT_FOUND
    http: 404
    condition: "An episode id in the path or body does not resolve"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Any other entity id (visit, compliance day, device kit, device component, delivery order, meal plan, escalation event, inpatient unit, bed reservation, billing claim) does not resolve"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_kit_version, expected_unit_version or expected_episode_version does not equal the current version of the named parent entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity's current state is not a legal `from:` state for the requested transition"
  - id: ERR_EPISODE_NOT_ACTIVE
    http: 409
    condition: "A write into a live episode was attempted while Episode.status is not ACTIVE"
  - id: ERR_REFERRAL_ORIGIN_INELIGIBLE
    http: 422
    condition: "Referral.origin is CLINIC or SNF rather than ED or INPATIENT_WARD"
  - id: ERR_CONDITION_NOT_QUALIFYING
    http: 422
    condition: "Referral.qualifying_condition_code is not one of the six qualifying codes (OTHER never qualifies)"
  - id: ERR_OUTSIDE_SERVICE_RADIUS
    http: 422
    condition: "Patient.home_distance_km is strictly greater than 40.0 km"
  - id: ERR_EVAL_WINDOW_EXPIRED
    http: 422
    condition: "The latest EligibilityAssessment.in_person_eval_at is more than 24 hours before the admission instant, or is strictly after it"
  - id: ERR_HOME_SAFETY_FAILED
    http: 422
    condition: "The latest EligibilityAssessment.home_safety_outcome is CONDITIONAL or FAIL"
  - id: ERR_CONNECTIVITY_INSUFFICIENT
    http: 422
    condition: "The latest EligibilityAssessment.broadband_check is FAIL"
  - id: ERR_CAREGIVER_REQUIRED
    http: 422
    condition: "Referral.acuity is HIGH but Patient.caregiver_present or the latest EligibilityAssessment.caregiver_present_confirmed is false"
  - id: ERR_CONSENT_MISSING
    http: 422
    condition: "The latest EligibilityAssessment.consent_signed is false"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A controlled delivery order was authorized by the same X-User-ID that requested it"
  - id: ERR_WITNESS_REQUIRED
    http: 422
    condition: "A controlled delivery order was handed off without witness_staff_id"
  - id: ERR_COLD_CHAIN_EXCURSION
    http: 422
    condition: "A cold-chain delivery reported excursion_minutes strictly greater than 30"
  - id: ERR_VISIT_OVERLAP
    http: 409
    condition: "The requested visit interval collides with an existing SCHEDULED, EN_ROUTE or COMPLETED visit of the same staff_user_id once the 15-minute turnaround buffer is applied"
  - id: ERR_DIET_INCOMPATIBLE
    http: 422
    condition: "MealPlan.diet_code differs from a non-NONE Patient.diet_restriction"
  - id: ERR_NO_BEDS_AVAILABLE
    http: 409
    condition: "The inpatient unit has no available bed after lazy expiry of stale holds"
  - id: ERR_KIT_UNAVAILABLE
    http: 409
    condition: "The target kit is not AVAILABLE, or the target episode already has a DEPLOYED kit"
  - id: ERR_REDELIVERY_LIMIT_EXCEEDED
    http: 409
    condition: "A redelivery dispatch from REFUSED was attempted with redelivery_count already at or above 2; the order stays REFUSED"
  - id: ERR_APPEAL_LIMIT_EXCEEDED
    http: 409
    condition: "An appeal was attempted with appeal_count already at or above 2"
  - id: ERR_MED_REC_UNSIGNED
    http: 409
    condition: "Discharge attempted while Episode.med_rec_signed is false"
  - id: ERR_DELIVERY_NOT_TERMINAL
    http: 409
    condition: "Discharge attempted while at least one delivery order of the episode is outside {DELIVERED, FAILED, CANCELLED}"
  - id: ERR_RECONCILIATION_INCOMPLETE
    http: 409
    condition: "Discharge attempted while at least one component of the episode's kit is still DEPLOYED or PENDING_RECONCILIATION"
  - id: ERR_NO_BILLABLE_DAYS
    http: 422
    condition: "Claim build attempted while Episode.billable_day_count is 0"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix (8 roles; segregation-of-duties model)
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Operations lead: inventory, inpatient units, telemetry lapse entry, compliance-day finalization, escalation promotion, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /device-kits"
      - "POST /device-kits/{id}/components"
      - "GET /device-kit-census"
      - "POST /inpatient-units"
    shared_operations:
      - "POST /patients"
      - "PATCH /patients/{id}"
      - "POST /monitoring-lapses"
      - "POST /compliance-days/{id}/finalize"
      - "POST /escalation-events"
      - "POST /escalation-events/{id}/promote"
      - "all GET reads"

  - name: AdmittingPhysician
    description: "Attending clinician: referrals, eligibility, admission, telehealth rounding, medication reconciliation, bed reservation, discharge, readmission"
    identity: "opaque"
    exclusive_operations:
      - "POST /referrals"
      - "POST /referrals/{id}/mark-eligible"
      - "POST /episodes"
      - "POST /episodes/{id}/sign-med-rec"
      - "POST /episodes/{id}/begin-discharge"
      - "POST /episodes/{id}/discharge"
      - "POST /episodes/{id}/readmit"
      - "POST /bed-reservations"
      - "POST /escalation-events/{id}/convert-bed-return"
    shared_operations:
      - "POST /patients"
      - "PATCH /patients/{id}"
      - "POST /eligibility-assessments"
      - "POST /visits and the four visit action endpoints"
      - "POST /delivery-orders"
      - "POST /compliance-days/{id}/finalize"
      - "POST /escalation-events/{id}/acknowledge"
      - "POST /escalation-events/{id}/resolve"
      - "all GET reads"

  - name: FieldNurse
    description: "RN performing in-person visits, kit deployment, component reconciliation and tier-1 escalation response"
    identity: "opaque"
    exclusive_operations:
      - "POST /device-kits/{id}/deploy"
      - "POST /device-components/{id}/reconcile"
    shared_operations:
      - "POST /eligibility-assessments"
      - "POST /visits and the four visit action endpoints"
      - "POST /monitoring-lapses"
      - "POST /escalation-events"
      - "POST /escalation-events/{id}/acknowledge"
      - "POST /escalation-events/{id}/promote"
      - "POST /escalation-events/{id}/resolve"
      - "GET reads on patients, referrals, episodes, visits, kits, components, lapses and escalations"

  - name: CommunityParamedic
    description: "Community paramedic performing in-person visits, delivery handoffs and tier-3 escalation response"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /visits and the four visit action endpoints"
      - "POST /delivery-orders/{id}/deliver"
      - "POST /delivery-orders/{id}/refuse"
      - "POST /escalation-events"
      - "POST /escalation-events/{id}/acknowledge"
      - "POST /escalation-events/{id}/resolve"
      - "GET reads on patients, episodes, visits, delivery orders and escalations"

  - name: PharmacyAuthorizer
    description: "Pharmacy authorizing identity; the segregation-of-duties counterpart that may never authorize an order it requested"
    identity: "opaque"
    exclusive_operations:
      - "POST /delivery-orders/{id}/authorize"
    shared_operations:
      - "GET /episodes/{id}"
      - "GET /episodes/{id}/delivery-orders"

  - name: LogisticsCoordinator
    description: "Logistics: raises delivery orders, dispatches, hands off and runs meal plans"
    identity: "opaque"
    exclusive_operations:
      - "POST /delivery-orders/{id}/dispatch"
      - "POST /meal-plans"
    shared_operations:
      - "POST /delivery-orders"
      - "POST /delivery-orders/{id}/deliver"
      - "POST /delivery-orders/{id}/refuse"
      - "GET reads on patients, episodes, delivery orders and meal plans"

  - name: BillingAnalyst
    description: "Revenue cycle: builds, submits, records outcomes on and appeals CMS-waiver and fee-for-service claims"
    identity: "opaque"
    exclusive_operations:
      - "POST /billing-claims"
      - "POST /billing-claims/{id}/submit"
      - "POST /billing-claims/{id}/record-outcome"
      - "POST /billing-claims/{id}/appeal"
    shared_operations:
      - "GET /episodes, GET /episodes/{id}, GET /episodes/{id}/ledger"
      - "GET /episodes/{id}/compliance-days"
      - "GET /episodes/{id}/visits"
      - "GET /episodes/{id}/meal-plans"
      - "GET /episodes/{id}/billing-claims"

  - name: Patient
    description: "The admitted patient reading their own record; X-User-ID equals the Patient.id"
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "GET /patients/{id}"
      - "GET /patients/{id}/referrals"
      - "GET /episodes/{id}"
      - "GET /episodes/{id}/visits"
