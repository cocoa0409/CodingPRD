            - call: "POST /clinic/procedures"
              payload: { patient_id: "${p17}", provider_id: "${dr1}", consult_id: "${cs17}", standing_order_id: "${so17}", procedure_type: "INITIAL", room_code: "RM10", scheduled_start: "2026-06-10T09:00:00Z" }
              as: FrontDesk
              captures: { fin_err: $.data.error_id }
          assert:
            - "Patient.${p17}.eligibility_status was DUAL_HOLD at the first trigger"
            - "${dual_err} == ERR_PATIENT_CLINICAL_HOLD with HTTP 409"
            - "Patient.${p17}.eligibility_status == FINANCIAL_HOLD after the clear"
            - "${fin_err} == ERR_PATIENT_FINANCIAL_HOLD with HTTP 402"
