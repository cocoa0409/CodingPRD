# ---------------------------------------------------------------------------
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task 2554 — School Crossing Guard & Safe Routes to School
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only.
# ---------------------------------------------------------------------------
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: warrant_score_gap_adequacy_vs_exposure_index_divergence
        grounds:
          - calculations.warrant_score
          - calculations.warrant_determination
          - entities.WarrantStudy.fields.scoring_variant
          - entities.WarrantStudy.fields.warrant_score
          - entities.Intersection.fields.control_type
        distinguishing_aspect: |
          The dual variant lives on the Intersection/WarrantStudy engineering domain:
          two intersections carrying byte-identical count sessions, crash history and
          speed limit score 66.19 under GAP_ADEQUACY (control_type UNCONTROLLED) and
          51.98 under EXPOSURE_INDEX (control_type STOP_SIGN), which lands them on
          different determinations (WARRANTED vs CONDITIONAL) from the same data.
        test_recipe:
          setup:
            - "One school with a 2026-08-24 -> 2027-06-11 session."
            - "Two intersections under it, identical except control_type: UNCONTROLLED and STOP_SIGN, both 30 mph, 2 lanes."
            - "Each intersection carries the same two pedestrian crashes: an INJURY on 2023-10-01 and a SEVERE_INJURY on 2025-05-14."
            - "Each intersection carries one warrant study over 2026-09-08 -> 2026-09-30 with the same AM (70 children / 500 vehicles / 28 adequate gaps) and PM (50 / 380 / 20) sessions."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50, early_dismissal_pm_offset_minutes: -120, no_school_dates: ["2026-11-26", "2026-11-27"], early_dismissal_dates: ["2026-09-17"] }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Maple St & 3rd Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { isx_u_id: $.data.id }
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Birch St & 4th Ave", control_type: "STOP_SIGN", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { isx_s_id: $.data.id }
            - call: "POST /srts/intersections/${isx_u_id}/crash-records"
              payload: { crash_date: "2023-10-01", severity: "INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/intersections/${isx_u_id}/crash-records"
              payload: { crash_date: "2025-05-14", severity: "SEVERE_INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { isx_u_v: $.data.version }
            - call: "POST /srts/intersections/${isx_s_id}/crash-records"
              payload: { crash_date: "2023-10-01", severity: "INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/intersections/${isx_s_id}/crash-records"
              payload: { crash_date: "2025-05-14", severity: "SEVERE_INJURY", involved_pedestrian: true, involved_school_age: true }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { isx_s_v: $.data.version }
            - call: "POST /srts/warrant-studies"
              payload: { intersection_id: "${isx_u_id}", count_window_start: "2026-09-08", count_window_end: "2026-09-30", expected_intersection_version: "${isx_u_v}" }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { study_u_id: $.data.id }
            - call: "POST /srts/warrant-studies/${study_u_id}/count-sessions"
              payload: { session_date: "2026-09-08", period: "AM_ARRIVAL", observed_minutes: 60, child_count: 70, adult_count: 10, vehicle_count: 500, adequate_gaps: 28 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_u_id}/count-sessions"
              payload: { session_date: "2026-09-09", period: "PM_DISMISSAL", observed_minutes: 60, child_count: 50, adult_count: 8, vehicle_count: 380, adequate_gaps: 20 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies"
              payload: { intersection_id: "${isx_s_id}", count_window_start: "2026-09-08", count_window_end: "2026-09-30", expected_intersection_version: "${isx_s_v}" }
              as: TrafficEngineer
              as_user_id: "eng-1"
              captures: { study_s_id: $.data.id }
            - call: "POST /srts/warrant-studies/${study_s_id}/count-sessions"
              payload: { session_date: "2026-09-08", period: "AM_ARRIVAL", observed_minutes: 60, child_count: 70, adult_count: 10, vehicle_count: 500, adequate_gaps: 28 }
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_s_id}/count-sessions"
              payload: { session_date: "2026-09-09", period: "PM_DISMISSAL", observed_minutes: 60, child_count: 50, adult_count: 8, vehicle_count: 380, adequate_gaps: 20 }
              as: TrafficEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /srts/warrant-studies/${study_u_id}/analyze"
              payload: {}
              as: TrafficEngineer
              as_user_id: "eng-1"
            - call: "POST /srts/warrant-studies/${study_s_id}/analyze"
              payload: {}
              as: TrafficEngineer
              as_user_id: "eng-1"
          assert:
            - "WarrantStudy.${study_u_id}.scoring_variant == GAP_ADEQUACY"
            - "WarrantStudy.${study_u_id}.warrant_score == 66.19"
            - "WarrantStudy.${study_u_id}.determination == WARRANTED"
            - "WarrantStudy.${study_s_id}.scoring_variant == EXPOSURE_INDEX"
            - "WarrantStudy.${study_s_id}.warrant_score == 51.98"
            - "WarrantStudy.${study_s_id}.determination == CONDITIONAL"
            - "WarrantStudy.${study_u_id}.included_child_count == 120 and WarrantStudy.${study_s_id}.included_child_count == 120"
            - "WarrantStudy.${study_u_id}.included_adequate_gaps == 48 and WarrantStudy.${study_s_id}.included_adequate_gaps == 48"
            - "WarrantStudy.${study_u_id}.included_vehicle_count == 880 and WarrantStudy.${study_s_id}.included_vehicle_count == 880"
            - "WarrantStudy.${study_u_id}.pedestrian_crash_count_3yr == 2 and WarrantStudy.${study_u_id}.severe_pedestrian_crash_count_3yr == 1"
            - "WarrantStudy.${study_u_id}.warrant_score - WarrantStudy.${study_s_id}.warrant_score == 14.21"

      - name: guard_reliability_rolling_vs_season_divergence
        grounds:
          - calculations.guard_reliability_score
          - entities.Guard.fields.reliability_score_rolling_90d
          - entities.Guard.fields.reliability_score_season_to_date
          - entities.AbsenceReport.fields.reason
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain — workforce
          reliability on a Guard, not warrant engineering on an Intersection — and
          the two variants use different penalty coefficients AND different window
          anchors, so three ILLNESS absences yield reliability_score_rolling_90d
          91.00 and reliability_score_season_to_date 95.50 on the same guard row.
        setup_note: "Training hours 12 gives both variants the same +3.00 bonus, so the entire 4.50 gap is coefficient-driven."
        test_recipe:
          setup:
            - "School 2026-08-24 -> 2027-06-11; one WARRANTED intersection; one ACTIVE AM guard post."
            - "One CERTIFIED guard with exactly 12 training hours and complete equipment, assigned 2026-09-08 -> 2026-09-18."
            - "Three ILLNESS absence reports on 2026-09-08, 2026-09-09 and 2026-09-10, all filed at the default logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Maple St & 3rd Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2, posted_school_zone: true }
              as: ProgramAdmin
              as_user_id: "adm-1"
