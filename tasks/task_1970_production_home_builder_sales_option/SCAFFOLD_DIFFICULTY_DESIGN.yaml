          - validations[priority=7]
          - errors[ERR_LOT_NOT_RESERVED_BY_BUYER]
        distinguishing_aspect: |
          Entity pair PurchaseAgreement x Lot: a PurchaseAgreement can only be
          created against a Lot in RESERVED state whose reserved_buyer_id equals
          the agreement's buyer; a RELEASED lot (nobody holds it) rejects the
          create with ERR_LOT_NOT_RESERVED_BY_BUYER even with a fresh OCC version.
        test_recipe:
          setup:
            - "Community SELLING; phase P1 ACTIVE; plan Maple; lot L-101 RELEASED (never reserved)"
            - "Buyer Bea registered"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector, captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOT_NOT_RESERVED_BY_BUYER (lot is RELEASED, not RESERVED by the buyer)"
            - "Lot.${lot_id}.version unchanged by the rejected create (still ${lot_v})"

      - name: close_blocked_until_all_milestones_complete
        grounds:
          - state_machines.PurchaseAgreement.CONTINGENCIES_CLEARED_to_CLOSED
          - validations[priority=7]
          - errors[ERR_CLOSE_BLOCKED]
        distinguishing_aspect: |
          Entity pair PurchaseAgreement x ConstructionMilestone (different pair
          than agreement_create_requires_lot_reserved_by_buyer): close is gated
          on ALL five milestones being COMPLETE; with any NOT_STARTED it fails
          with ERR_CLOSE_BLOCKED, and succeeds only after the last completion.
        test_recipe:
          setup:
            - "Signed agreement (default fixtures); financing and appraisal CLEARED, sale_of_home WAIVED at sign -> CONTINGENCIES_CLEARED"
            - "All 5 milestones still NOT_STARTED"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}", captures: { agr_v_s: $.data.version } }
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "financing", action: "CLEARED", expected_agreement_version: "${agr_v_s}" }, as: SalesAgent, captures: { agr_v_c1: $.data.version } }
            - { call: "POST /homebuilder/agreements/${agr_id}/contingency-clearance", payload: { contingency_type: "appraisal", action: "CLEARED", expected_agreement_version: "${agr_v_c1}" }, as: SalesAgent, captures: { agr_status: $.data.status } }
            - { call: "GET /homebuilder/milestones?agreement_id=${agr_id}", payload: {}, as: SalesAgent, captures: { m1: "$.data[0].id", m2: "$.data[1].id", m3: "$.data[2].id", m4: "$.data[3].id", m5: "$.data[4].id" } }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_id}/close", payload: {}, as: SalesAgent, captures: { err: $.data.error_id } }
            - { call: "POST /homebuilder/milestones/${m1}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m2}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m3}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m4}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/milestones/${m5}/complete", payload: {}, as: ConstructionManager }
            - { call: "POST /homebuilder/agreements/${agr_id}/close", payload: {}, as: SalesAgent, captures: { fin_status: $.data.status } }
          assert:
            - "Setup reached CONTINGENCIES_CLEARED (agr_status == CONTINGENCIES_CLEARED after the second clearance bubble-up)"
            - "First close attempt: error_id == ERR_CLOSE_BLOCKED (milestones still NOT_STARTED)"
            - "Second close attempt after all 5 completions: status == CLOSED"
            - "PurchaseAgreement.${agr_id}.final_total_cents == 45241000 (no options, fees, or incentives)"
            - "PurchaseAgreement.${agr_id}.warranty_status == ENROLLED and warranty_term_months == 12 and warranty_enrolled_at == 2026-08-01T00:00:00Z"
            - "Lot.${lot_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: lot_hold_point_containment_half_open
        grounds:
          - validations[priority=8]
          - errors[ERR_LOT_HOLD_ACTIVE]
          - entities.Lot.fields.hold_expires_at
        distinguishing_aspect: |
          Point-in-interval containment on the Lot resource with a half-open
          window: a second reserve one second BEFORE hold_expires_at collides
          (ERR_LOT_HOLD_ACTIVE), while a reserve exactly AT hold_expires_at
          succeeds because the sweep treats the hold as inactive at its expiry
          instant.
        test_recipe:
          setup:
            - "Community SELLING; phase P1 ACTIVE; lot L-101 RELEASED at 9991000"
            - "Buyers Bea and Ben registered; Bea reserves at the default clock -> hold [2026-08-01T00:00:00Z, 2026-08-04T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Ben Buyer", email: "ben@example.com" }, as: Anonymous, captures: { b2_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { hold_exp: $.data.hold_expires_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T23:59:59Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b2_id}" }, as: Buyer, as_user_id: "${b2_id}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b2_id}" }, as: Buyer, as_user_id: "${b2_id}", captures: { st2: $.data.status, hold2: $.data.hold_expires_at } }
          assert:
            - "Bea's hold_expires_at == 2026-08-04T00:00:00Z (reserve at default clock + 72h)"
            - "At 2026-08-03T23:59:59Z (inside the hold): error_id == ERR_LOT_HOLD_ACTIVE"
            - "At exactly 2026-08-04T00:00:00Z the sweep released the lot (expiry is exclusive of occupation)"
            - "Ben's reserve succeeds: Lot.${lot_id}.status == RESERVED, reserved_buyer_id == ${b2_id}, hold_expires_at == 2026-08-07T00:00:00Z"
            - "Lot.${lot_id}.release_price_cents == 9991000 and release_count == 0 (hold churn never reprices)"

      - name: price_phase_window_overlap_vs_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_PHASE_WINDOW_OVERLAP]
          - entities.PricePhase.fields.effective_from
          - entities.PricePhase.fields.effective_to
        distinguishing_aspect: |
          Interval-vs-interval overlap on the PricePhase resource (different
          interval semantics than the lot-hold point containment): windows are
          half-open [effective_from, effective_to), so an interior overlap is
          rejected while exact adjacency (new.from == existing.to) is allowed.
        test_recipe:
          setup:
            - "Community with phase P1 [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) (ACTIVE at default clock)"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector, captures: { p1_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P-Overlap", uplift_pct: 0.04, effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }, as: SalesDirector, captures: { err: $.data.error_id } }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P2", uplift_pct: 0.05, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }, as: SalesDirector, captures: { p2_id: $.data.id, p2_status: $.data.status } }
          assert:
            - "Interior overlap [2026-08-15, 2026-10-01) vs P1: error_id == ERR_PHASE_WINDOW_OVERLAP"
            - "Adjacent window [2026-09-01, 2026-10-01) touching P1.effective_to: created 201, status == SCHEDULED (now 2026-08-01 < effective_from)"
            - "GET /homebuilder/communities/${c_id}/price-phases returns total_count == 2 (P1 + P2; the rejected phase was not persisted)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: incentive_budget_conserved_across_approve_and_revoke
        grounds:
          - calculations.incentive_budget_ledger
          - state_machines.IncentiveRequest.SUBMITTED_to_APPROVED
          - state_machines.IncentiveRequest.APPROVED_to_REVOKED
        distinguishing_aspect: |
          Conserved money quantity: Community.incentive_budget_remaining_cents +
          sum(APPROVED incentive amounts) == incentive_budget_total_cents must
          hold after the forward action (approve: -250000) and after the
          compensating action (agreement cancellation revokes: +250000).
        test_recipe:
          setup:
            - "Signed agreement (default fixtures; community budget total 1000000)"
            - "Incentive 250000 auto-approved at creation (250000 <= 300000; budget and cap available)"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/plans", payload: { community_id: "${c_id}", plan_name: "Maple", base_price_cents: 35000000, elevations: [ { name: "A", price_cents: 0 }, { name: "B", price_cents: 250000 } ] }, as: SalesDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot_id}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}", captures: { lot_v: $.data.version } }
            - { call: "POST /homebuilder/agreements", payload: { buyer_id: "${b_id}", lot_id: "${lot_id}", plan_id: "${pl_id}", elevation_name: "B", earnest_money_deposited_cents: 500000, contingency_deadline: "2026-08-21T00:00:00Z", outside_close_date: "2027-03-01T00:00:00Z", has_sale_of_home_contingency: false, expected_lot_version: "${lot_v}" }, as: SalesAgent, captures: { agr_id: $.data.id } }
            - { call: "POST /homebuilder/agreements/${agr_id}/sign", payload: {}, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/incentive-requests", payload: { agreement_id: "${agr_id}", incentive_type: "RATE_BUYDOWN", amount_cents: 250000 }, as: SalesAgent, captures: { inc_id: $.data.id, inc_status: $.data.status } }
          trigger:
            - { call: "POST /homebuilder/agreements/${agr_id}/cancel", payload: { reason: "BUILDER_DEFAULT" }, as: SalesAgent }
          assert:
            - "After approval (pre-trigger): Community.${c_id}.incentive_budget_remaining_cents == 750000 (invariant: 750000 + 250000 == 1000000)"
            - "After cancel: IncentiveRequest.${inc_id}.status == REVOKED"
            - "After cancel: Community.${c_id}.incentive_budget_remaining_cents == 1000000 (invariant restored: 1000000 + 0 == 1000000)"
            - "PurchaseAgreement.${agr_id}.incentives_total_cents == 0 after the revoke cascade"

      - name: released_lot_count_conserved_across_reserve_cycle
        grounds:
          - state_machines.Lot.RELEASED_to_RESERVED
          - state_machines.Lot.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Conserved count quantity (different quantity type than the money
          invariant): count(Lot with status == RELEASED in the community) is
          unchanged by the reserve + release-reservation pair — the forward
          action decrements it (2 -> 1) and the compensating action restores it
          (1 -> 2) with no pricing drift.
        test_recipe:
          setup:
            - "Community SELLING; phase P1 ACTIVE; two RELEASED lots: L-101 (9991000) and L-102 STANDARD base 5000000 view 0 (5150000)"
            - "Buyer Bea registered"
          setup_api_calls:
            - { call: "POST /homebuilder/communities", payload: { name: "Cedar Ridge", incentive_budget_total_cents: 1000000 }, as: SalesDirector, captures: { c_id: $.data.id } }
            - { call: "POST /homebuilder/communities/${c_id}/open-sales", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/price-phases", payload: { community_id: "${c_id}", phase_name: "P1", uplift_pct: 0.03, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: SalesDirector }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-101", base_price_cents: 8000000, lot_type: "CORNER", view_adjustment_cents: 200000 }, as: SalesDirector, captures: { lot1: $.data.id } }
            - { call: "POST /homebuilder/lots", payload: { community_id: "${c_id}", lot_number: "L-102", base_price_cents: 5000000, lot_type: "STANDARD", view_adjustment_cents: 0 }, as: SalesDirector, captures: { lot2: $.data.id } }
            - { call: "POST /homebuilder/lots/${lot1}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/lots/${lot2}/release", payload: {}, as: SalesDirector }
            - { call: "POST /homebuilder/buyers", payload: { full_name: "Bea Buyer", email: "bea@example.com" }, as: Anonymous, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /homebuilder/lots/${lot1}/reserve", payload: { buyer_id: "${b_id}" }, as: Buyer, as_user_id: "${b_id}" }
            - { call: "POST /homebuilder/lots/${lot1}/release-reservation", payload: {}, as: Buyer, as_user_id: "${b_id}" }
          assert:
            - "Before reserve: GET /homebuilder/lots?community_id=${c_id}&status=RELEASED has total_count == 2"
            - "After reserve: the same list has total_count == 1 (only L-102)"
            - "After release-reservation: the same list has total_count == 2 (invariant restored)"
            - "Lot.${lot1}.release_price_cents == 9991000 and release_count == 0 (no drift from the cycle)"
            - "Lot.${lot2}.release_price_cents == 5150000 = round_half_up(5000000 * 1.03) + 0 (untouched by the cycle on L-101)"
