      assert:
      - HoistReservation.${res1}.blocked_from == 2026-08-10T05:15:00Z and blocked_until == 2026-08-10T18:45:00Z
      - the nested 09:00 -> 11:00 request returns ERR_HOIST_WINDOW_CONFLICT with HTTP 409
      - the enclosing 04:00 -> 20:00 request returns ERR_HOIST_WINDOW_CONFLICT with HTTP 409
      - after the cancel HoistReservation.${res1}.status == CANCELLED and the row still exists with its blocked interval
        stored
      - the trigger - byte-identical to the nested request that was rejected - returns 201
      - HoistReservation.${res2}.blocked_from == 2026-08-10T08:15:00Z and blocked_until == 2026-08-10T11:45:00Z
      - GET /hoist-rigs/${rig}/reservations returns both rows, one CANCELLED and one RESERVED
