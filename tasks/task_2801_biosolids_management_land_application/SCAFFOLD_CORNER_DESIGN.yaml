# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 breadth probe
# Domain: Biosolids Management & Land Application (wastewater treatment utility)
# section: values and claim_type: values are taken verbatim from
# references/claim-extraction-guide.md; every instance drives empty-DB -> precondition
# using only endpoints declared in SCAFFOLD.yaml §1.5.
scaffold_corner_design:

  - section: entities
    instances:
      - name: entity_facility_create_returns_declared_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.TreatmentFacility.fields.storage_used_wet_tons
          - entities.TreatmentFacility.fields.storage_utilization_pct
          - entities.TreatmentFacility.fields.open_ceiling_exceedance_count
          - entities.TreatmentFacility.fields.substantiated_complaint_count_30d
          - entities.TreatmentFacility.fields.posture
          - endpoints.POST_/treatment-facilities
        distinguishing_aspect: "A facility created from the five required inputs alone comes back with every computed counter at its declared zero and posture OPEN, version 1 and created_at stamped from the logical clock, not from wall time."
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to 2026-08-01T00:00:00Z so created_at is a literal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          assert:
            - "the response response_type == \"object\""
            - "TreatmentFacility.${fac_id}.name == \"North Water Reclamation Plant\""
            - "TreatmentFacility.${fac_id}.storage_capacity_wet_tons == 5000.00"
            - "TreatmentFacility.${fac_id}.storage_used_wet_tons == 0.00"
            - "TreatmentFacility.${fac_id}.storage_utilization_pct == 0.00"
            - "TreatmentFacility.${fac_id}.open_ceiling_exceedance_count == 0"
            - "TreatmentFacility.${fac_id}.substantiated_complaint_count_30d == 0"
            - "TreatmentFacility.${fac_id}.posture == OPEN"
            - "TreatmentFacility.${fac_id}.version == 1"
            - "TreatmentFacility.${fac_id}.created_at == \"2026-08-01T00:00:00.000Z\""

      - name: entity_site_omitting_reapplication_interval_applies_thirty_day_default
        claim_type: defaults
        grounds:
          - entities.LandApplicationSite.fields.reapplication_interval_days
          - entities.LandApplicationSite.fields.weather_clearance_ok
          - entities.LandApplicationSite.fields.cumulative_loading_kg_per_hectare
          - entities.LandApplicationSite.fields.status
          - endpoints.POST_/land-application-sites
        distinguishing_aspect: "reapplication_interval_days is omitted from the request and comes back as 30, while the optional weather and loading fields come back at their declared defaults (weather_clearance_ok true with no observation ever posted)."
        test_recipe:
          setup:
            - "A facility exists. No site exists yet. The site is created with required fields only - no reapplication_interval_days, no soil_ph, no slope_pct, no nearest_residence_ft."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /land-application-sites"
              payload: { facility_id: "${fac_id}", site_code: "S-01", acres: 100.0, crop_type: "CORN", crop_n_demand_lb_per_acre: 160.0, crop_p_removal_lb_per_acre: 60.0, soil_p_index: 40, setback_to_well_ft: 200, setback_to_surface_water_ft: 150, allowed_application_months: [8, 9, 10] }
              as: Agronomist
              captures: { site_id: $.data.id }
          assert:
            - "LandApplicationSite.${site_id}.reapplication_interval_days == 30"
            - "LandApplicationSite.${site_id}.status == DRAFT"
            - "LandApplicationSite.${site_id}.permit_number == null"
            - "LandApplicationSite.${site_id}.permitted_at == null"
            - "LandApplicationSite.${site_id}.cumulative_loading_kg_per_hectare == {}"
            - "LandApplicationSite.${site_id}.annual_loading_kg_per_hectare == {}"
            - "LandApplicationSite.${site_id}.weather_clearance_ok == true"
            - "LandApplicationSite.${site_id}.latest_rainfall_in_24h == 0"
            - "LandApplicationSite.${site_id}.latest_weather_observed_at == null"
            - "LandApplicationSite.${site_id}.odor_risk_score_historical == 0.00"
            - "LandApplicationSite.${site_id}.gating_risk_score == 0.00"
            - "LandApplicationSite.${site_id}.pfas_advisory_flag == false"
            - "LandApplicationSite.${site_id}.version == 1"

      - name: entity_batch_get_with_unknown_id_returns_batch_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_BATCH_NOT_FOUND]
          - validations.priority_3_existence
          - endpoints.GET_/solids-batches/{batchId}
        distinguishing_aspect: "A syntactically valid UUID that names no SolidsBatch row returns ERR_BATCH_NOT_FOUND with HTTP 404 and the error envelope, not an empty 200 body."
        test_recipe:
          setup:
            - "A facility exists so the database is not empty; no SolidsBatch row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /solids-batches/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FacilityOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response response_type == \"error\""
            - "the response HTTP status == 404"
            - "${err} == \"ERR_BATCH_NOT_FOUND\""

      - name: entity_batch_list_filters_by_process_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/solids-batches
          - entities.SolidsBatch.fields.process_status
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three batches exist and one has been digested, so the process_status=THICKENED filter reports total_count 2 - the filter is applied before pagination, and offset 1 flips has_more from true to false."
        test_recipe:
          setup:
            - "One facility with three THICKENED batches; the first is then advanced to DIGESTED, leaving exactly two THICKENED batches."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 100.00, dry_tons_in: 25.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0 }
              as: FacilityOperator
              captures: { b1: $.data.id }
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-002", wet_tons: 100.00, dry_tons_in: 25.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0 }
              as: FacilityOperator
              captures: { b2: $.data.id }
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-003", wet_tons: 100.00, dry_tons_in: 25.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0 }
              as: FacilityOperator
              captures: { b3: $.data.id }
            - call: "POST /solids-batches/${b1}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 20.000, volatile_solids_out_pct: 55.00, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
          trigger:
            - call: "GET /solids-batches"
              payload: { facility_id: "${fac_id}", process_status: "THICKENED", limit: 1, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /solids-batches"
              payload: { facility_id: "${fac_id}", process_status: "THICKENED", limit: 1, offset: 1 }
              as: ComplianceOfficer
          assert:
            - "the first response response_type == \"array\""
            - "the first response total_count == 2"
            - "the first response has_more == true"
            - "the first response limit == 1 and offset == 0"
            - "the first response data contains exactly 1 element"
            - "the second response total_count == 2"
            - "the second response has_more == false"
            - "the second response data contains exactly 1 element"
            - "the two responses return different SolidsBatch ids and neither is ${b1}"

      - name: entity_site_create_missing_allowed_application_months_is_rejected
        claim_type: required_fields
        grounds:
          - entities.LandApplicationSite.fields.allowed_application_months
          - validations.priority_5_business_constraint
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "allowed_application_months is a required input with no default, so omitting it returns ERR_INVALID_REQUEST 422 and no LandApplicationSite row is created."
        test_recipe:
          setup:
            - "A facility exists. The site payload carries every required field except allowed_application_months."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /land-application-sites"
              payload: { facility_id: "${fac_id}", site_code: "S-01", acres: 100.0, crop_type: "CORN", crop_n_demand_lb_per_acre: 160.0, crop_p_removal_lb_per_acre: 60.0, soil_p_index: 40, setback_to_well_ft: 200, setback_to_surface_water_ft: 150 }
              as: Agronomist
              captures: { err: $.data.error_id }
            - call: "GET /land-application-sites"
              payload: { facility_id: "${fac_id}" }
              as: Agronomist
          assert:
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "the first response HTTP status == 422"
            - "the second response total_count == 0"

      - name: entity_batch_create_rejects_unknown_stabilization_process_enum
        claim_type: type_constraints
        grounds:
          - entities.SolidsBatch.fields.stabilization_process
          - validations.priority_5_business_constraint
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "stabilization_process is an enum whose only members are ANAEROBIC_DIGESTION, COMPOSTED and LIME_STABILIZED; the string SOLAR_DRYING is refused with ERR_INVALID_REQUEST rather than stored verbatim."
        test_recipe:
          setup:
            - "A facility exists. The batch payload is otherwise valid and carries stabilization_process: \"SOLAR_DRYING\"."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 100.00, dry_tons_in: 25.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, stabilization_process: "SOLAR_DRYING" }
              as: FacilityOperator
              captures: { err: $.data.error_id }
            - call: "GET /solids-batches"
              payload: { facility_id: "${fac_id}" }
              as: FacilityOperator
          assert:
            - "${err} == \"ERR_INVALID_REQUEST\""
            - "the first response HTTP status == 422"
            - "the second response total_count == 0"

      - name: entity_lab_result_rejects_unknown_parent_batch
        claim_type: parent_relationships
        grounds:
          - entities.LabResult.parent_SolidsBatch
          - validations.priority_3_existence
          - errors[ERR_BATCH_NOT_FOUND]
          - endpoints.POST_/solids-batches/{batchId}/lab-results
        distinguishing_aspect: "LabResult is a child of SolidsBatch, so a result filed against a batchId that resolves to nothing returns ERR_BATCH_NOT_FOUND (priority 3) and never reaches the ACTIVE-limit check at priority 60."
        test_recipe:
          setup:
            - "A facility and an ACTIVE CADMIUM PollutantLimit exist. No SolidsBatch row exists, so the path id cannot resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
              payload: { analyte: "CADMIUM", ceiling_mg_kg: 85.0, monthly_avg_mg_kg: 39.0, aplr_kg_per_hectare_yr: 1.9, cplr_kg_per_hectare: 39.0 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /solids-batches/00000000-0000-0000-0000-000000000000/lab-results"
              payload: { analyte: "CADMIUM", concentration_mg_kg: 20.0, sampling_event_index: 0, analyzed_at: "2026-08-01T00:00:00Z", method_code: "EPA-6010D" }
              as: LabAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == \"ERR_BATCH_NOT_FOUND\""
            - "the response HTTP status == 404"
            - "the response error_id is NOT \"ERR_LIMIT_NOT_FOUND\""

      - name: entity_event_rejects_agreement_belonging_to_another_site
        claim_type: parent_relationships
        grounds:
          - validations.priority_44_ERR_AGREEMENT_SITE_MISMATCH
          - entities.FarmerAgreement.fields.site_id
          - entities.ApplicationEvent.fields.agreement_id
          - errors[ERR_AGREEMENT_SITE_MISMATCH]
          - complexity_profile.entity_topology_graph
        distinguishing_aspect: "Both foreign keys resolve and both parents are in the right state, yet the agreement names site S-02 while the event names site S-01, so cross-reference integrity is enforced by ERR_AGREEMENT_SITE_MISMATCH rather than by any state check."
        test_recipe:
          setup:
            - "Two PERMITTED sites on one facility, each with its own ACTIVE FarmerAgreement (farmer-jones on S-01, farmer-smith on S-02), and one QUALIFIED batch with 160.000 unallocated dry tons."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
              payload: { analyte: "CADMIUM", ceiling_mg_kg: 85.0, monthly_avg_mg_kg: 39.0, aplr_kg_per_hectare_yr: 1.9, cplr_kg_per_hectare: 39.0 }
              as: ComplianceOfficer
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_id: $.data.id }
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DIGESTED", dry_tons_out: 160.000, volatile_solids_out_pct: 55.00, detention_days: 20.0, digester_temp_c: 36.0 }
              as: FacilityOperator
            - call: "POST /solids-batches/${batch_id}/advance-process"
              payload: { to_status: "DEWATERED", percent_solids: 20.0 }
              as: FacilityOperator
              captures: { batch_v: $.data.version }
            - call: "POST /solids-batches/${batch_id}/lab-results"
              payload: { analyte: "CADMIUM", concentration_mg_kg: 20.0, sampling_event_index: 0, analyzed_at: "2026-08-01T00:00:00Z", method_code: "EPA-6010D" }
              as: LabAnalyst
            - call: "POST /solids-batches/${batch_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-cert-1"
            - call: "POST /land-application-sites"
              payload: { facility_id: "${fac_id}", site_code: "S-01", acres: 100.0, crop_type: "CORN", crop_n_demand_lb_per_acre: 160.0, crop_p_removal_lb_per_acre: 60.0, soil_p_index: 40, setback_to_well_ft: 200, setback_to_surface_water_ft: 150, allowed_application_months: [8, 9, 10], soil_ph: 6.5, depth_to_groundwater_ft: 10.0, slope_pct: 3.0, nearest_residence_ft: 3000, reapplication_interval_days: 10 }
              as: Agronomist
              captures: { site_id: $.data.id }
            - call: "POST /land-application-sites/${site_id}/submit-permit"
              payload: {}
              as: Agronomist
            - call: "POST /land-application-sites/${site_id}/permit-decision"
              payload: { decision: "APPROVE", permit_number: "LAP-0001" }
              as: ComplianceOfficer
              captures: { site_v: $.data.version }
            - call: "POST /farmer-agreements"
              payload: { site_id: "${site_id}", expected_site_version: "${site_v}", farmer_user_id: "farmer-jones", farm_name: "Jones Family Farm", term_start: "2026-08-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", max_dry_tons_per_acre: 20.0, notice_days: 3 }
              as: Agronomist
              captures: { agr_id: $.data.id }
            - call: "POST /farmer-agreements/${agr_id}/propose"
              payload: {}
              as: Agronomist
            - call: "POST /farmer-agreements/${agr_id}/sign"
              payload: {}
              as: Farmer
              as_user_id: "farmer-jones"
            - call: "POST /farmer-agreements/${agr_id}/activate"
              payload: {}
              as: Agronomist
            - call: "POST /land-application-sites"
              payload: { facility_id: "${fac_id}", site_code: "S-02", acres: 100.0, crop_type: "CORN", crop_n_demand_lb_per_acre: 160.0, crop_p_removal_lb_per_acre: 60.0, soil_p_index: 40, setback_to_well_ft: 200, setback_to_surface_water_ft: 150, allowed_application_months: [8, 9, 10], nearest_residence_ft: 3000, reapplication_interval_days: 10 }
              as: Agronomist
              captures: { site2_id: $.data.id }
            - call: "POST /land-application-sites/${site2_id}/submit-permit"
              payload: {}
              as: Agronomist
            - call: "POST /land-application-sites/${site2_id}/permit-decision"
              payload: { decision: "APPROVE", permit_number: "LAP-0002" }
              as: ComplianceOfficer
              captures: { site2_v: $.data.version }
            - call: "POST /farmer-agreements"
              payload: { site_id: "${site2_id}", expected_site_version: "${site2_v}", farmer_user_id: "farmer-smith", farm_name: "Smith Acres", term_start: "2026-08-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", max_dry_tons_per_acre: 20.0, notice_days: 3 }
              as: Agronomist
              captures: { agr2_id: $.data.id }
            - call: "POST /farmer-agreements/${agr2_id}/propose"
              payload: {}
              as: Agronomist
            - call: "POST /farmer-agreements/${agr2_id}/sign"
              payload: {}
              as: Farmer
              as_user_id: "farmer-smith"
            - call: "POST /farmer-agreements/${agr2_id}/activate"
              payload: {}
              as: Agronomist
          trigger:
            - call: "POST /application-events"
              payload: { site_id: "${site_id}", batch_id: "${batch_id}", agreement_id: "${agr2_id}", window_start: "2026-08-20T00:00:00Z", window_end: "2026-08-21T00:00:00Z", application_method: "SURFACE", acres_treated: 100.0, planned_dry_tons: 80.000 }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == \"ERR_AGREEMENT_SITE_MISMATCH\""
            - "the response HTTP status == 422"
            - "SolidsBatch.${batch_id}.unallocated_dry_tons == 160.000"
            - "FarmerAgreement.${agr2_id}.status == ACTIVE"

      - name: entity_loading_ledger_entry_is_immutable_with_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.LoadingLedgerEntry.common_fields_false
          - entities.LoadingLedgerEntry.fields.kg_per_hectare_delta
          - entities.LoadingLedgerEntry.fields.entry_type
          - entities.LoadingLedgerEntry.fields.applied_year
          - endpoints.GET_/loading-ledger-entries
        distinguishing_aspect: "LoadingLedgerEntry carries common_fields: false, so its rows expose id and created_at but no version and no updated_at, and §1.5 declares only GET routes - the single APPLICATION row is written as a side effect of close-out and is never addressable for mutation."
        test_recipe:
          setup:
            - "One facility, one ACTIVE CADMIUM limit (ceiling 85.0, monthly avg 39.0, APLR 1.9, CPLR 39.0), one QUALIFIED batch at 20.0 mg/kg cadmium, one PERMITTED site of 100.0 acres with an ACTIVE agreement, and one event completed at 80.000 dry tons over 100.0 acres (applied rate 0.80 dry tons/acre, ledger delta 0.0359 kg/ha)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
            - call: "POST /pollutant-limits"
              payload: { analyte: "CADMIUM", ceiling_mg_kg: 85.0, monthly_avg_mg_kg: 39.0, aplr_kg_per_hectare_yr: 1.9, cplr_kg_per_hectare: 39.0 }
              as: ComplianceOfficer
            - call: "POST /solids-batches"
              payload: { facility_id: "${fac_id}", batch_code: "B-2026-001", wet_tons: 800.00, dry_tons_in: 200.000, volatile_solids_in_pct: 70.00, percent_solids: 20.0, detention_days: 20.0, digester_temp_c: 36.0, stabilization_process: "ANAEROBIC_DIGESTION", pathogen_option: "PSRP_ALT1_TIME_TEMP", vector_option: "VAR_OPTION_1_VSR", nh4_n_mg_kg: 4000.0, organic_n_mg_kg: 30000.0, nitrate_n_mg_kg: 100.0, total_p_mg_kg: 25000.0 }
              as: FacilityOperator
              captures: { batch_id: $.data.id }
