            - call: "GET /robots/${roff}"
              as: FleetDispatcher
              captures: { roff_v: $.data.version }
          trigger:
            - call: "POST /delivery-missions"
              payload: { order_id: "${o}", robot_id: "${roff}", expected_delivery_order_version: "${o_v}" }
              as: FleetDispatcher
            - call: "POST /delivery-missions"
              payload: { order_id: "${o}", robot_id: "${r}", expected_delivery_order_version: "${o_v}" }
              as: FleetDispatcher
              captures: { mi: $.data.id }
          assert:
            - "the dispatch of the OFFLINE robot returns 409 with error_id ERR_ROBOT_NOT_AVAILABLE"
            - "DeliveryOrder.${o}.order_state == RECEIVED, version == ${o_v} and dispatch_attempt_count == 0"
            - "Robot.${roff}.duty_state == OFFLINE and Robot.${roff}.version == ${roff_v}"
            - "ServiceZone.${z}.version == ${zv} and ServiceZone.${z}.on_mission_robot_count == 0"
            - "GET /delivery-missions?order_id=${o} reports total_count == 0 after the refusal"
            - "the dispatch of the AVAILABLE robot returns 201 with DeliveryMission.${mi}.mission_state == PLANNED"
            - "DeliveryOrder.${o}.order_state == DISPATCHED, Robot.${r}.duty_state == ON_MISSION and ServiceZone.${z}.on_mission_robot_count == 1"
      - name: a_cascade_writes_every_level_or_none
        claim_type: cascade_atomicity
        grounds:
          - "state_machines.SegmentClosure.SCHEDULED_to_ACTIVE"
          - "common_fields_contract.version_semantics"
        excluded_because:
          difficulty_instance: hard_closure_activation_cascades_five_levels
          rationale: "that instance asserts the version bump of every row at all five levels of one activation, which is the observable content of cascade atomicity here."
      - name: a_compensating_write_restores_the_prior_totals
        claim_type: compensating_invariant
        grounds:
          - "entities.DepotBay.fields.committed_minutes"
          - "entities.ServiceZone.fields.reserved_bay_minutes"
        excluded_because:
          difficulty_instance: bay_minutes_ledger_restored_by_cancel
          rationale: "that instance takes both bay-minute ledgers up and back down to their exact prior values, which is the restore claim in full."
