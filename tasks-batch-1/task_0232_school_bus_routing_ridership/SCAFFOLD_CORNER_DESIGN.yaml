  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_posture_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[posture-change-stale-route]"
          - endpoints
          - entities.Route.fields.version
        distinguishing_aspect: "OCC happy path: a posture RESTRICT with the CURRENT expected_route_version succeeds (200) and increments Route.version by 1 (from 1 to 2)."
        test_recipe:
          setup: ["District + a fresh Route (version 1, posture OPEN)."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
          trigger:
            - call: "POST /routes/${r_id}/posture"
              payload: { action: "RESTRICT", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { p: $.data.posture, v: $.data.version }
          assert:
            - "Response status == 200"
            - "Route.${r_id}.posture == RESTRICTED"
            - "Route.${r_id}.version == 2 (bumped from 1)"

      - name: substitute_supersede_stale_route_already_covered
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[substitute-assign-stale-route]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / start_boarding_requires_active_driver_assignment
          rationale: "The substitute-supersede flow (which advances Route.version) is set up and exercised by the named §1.8 instance; the stale-version negative path mirrors posture-change-stale-route's OCC test."

      - name: substitute_assign_stale_route_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[substitute-assign-stale-route]"
          - "errors[ERR_STALE_VERSION]"
          - endpoints
        distinguishing_aspect: "Creating a SUBSTITUTE assignment with a stale expected_route_version (captured before a prior assignment bumped the version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["District + Route OPEN; a PRIMARY driver P assigned (route version now bumped); a substitute driver S. Client replays the OLD pre-primary route version on the substitute create."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Primary" }
              as: TransportAdmin
              captures: { drv_p: $.data.id }
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Sub", is_substitute: true }
              as: TransportAdmin
              captures: { drv_s: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_p}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_p: $.data.id }
          trigger:
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_s}", role: "SUBSTITUTE", replaces_assignment_id: "${asg_p}", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412"
            - "data.error_id == ERR_STALE_VERSION (r_v0 is stale; the PRIMARY assignment already bumped Route.version)"

      - name: incident_raise_cascades_notifications_to_onboard
        claim_type: cascading_side_effects
        grounds: [state_machines.BusTrip.IN_TRANSIT_to_INCIDENT_HOLD, entities.ParentNotification.fields.kind]
        distinguishing_aspect: "raise-incident appends a ParentNotification(kind=INCIDENT) for each onboard student: with one rider tapped on, exactly one INCIDENT notice is created for that rider's parent."
        test_recipe:
          setup: ["District + Route OPEN + Driver PRIMARY ACTIVE + stops seq1/seq2; APPROVED rider RF-R (par-1); trip IN_TRANSIT with the rider tapped on."]
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 10 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop1: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S2", lat: 40.01, lng: -75.0, sequence: 2, scheduled_departure: "2026-09-01T07:10:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Rider", grade: 5, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-R" }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop1}" }
              as: TransportAdmin
              captures: { app_id: $.data.id }
            - call: "POST /ridership-applications/${app_id}/start-review"
              payload: {}
              as: TransportAdmin
            - call: "POST /ridership-applications/${app_id}/approve"
              payload: {}
              as: TransportAdmin
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/taps"
              payload: { rfid_uid: "RF-R", direction: "TAP_ON", stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /bus-trips/${trip_id}/raise-incident"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { st: $.data.status }
            - call: "GET /parent-notifications?bus_trip_id=${trip_id}&kind=INCIDENT"
              as: TransportAdmin
          assert:
            - "BusTrip.${trip_id}.status == INCIDENT_HOLD"
            - "GET /parent-notifications returns exactly one INCIDENT notice for student ${stu_id} / parent par-1"

      - name: rate_threshold_route_full_at_capacity_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - "validations[priority=17]"
          - entities.Route.fields.seat_capacity
          - entities.Route.fields.assigned_rider_count
