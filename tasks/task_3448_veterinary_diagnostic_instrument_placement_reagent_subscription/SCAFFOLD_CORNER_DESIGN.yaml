# =============================================================================
# §1.9 Scaffold Corner Design — task_3448 veterinary diagnostics
# Breadth probe over §1.1–§1.7 claims not covered by §1.8. Stubs marked
# excluded_because cite the covering difficulty instance. Logical-clock
# default is 2026-09-01T00:00:00Z. Anchors are local to this file.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: clinic_create_applies_defaults_and_roundtrips
        claim_type: Creation
        grounds:
          - entities.Clinic
          - endpoints.POST_/api/clinics
        distinguishing_aspect: "A clinic created with only name and caseload_baseline_tests returns 201 with status ACTIVE, caseload_current_tests copied from the baseline, null group codes, version 1, and server-minted id/created_at/updated_at — none of the system fields are client-settable."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - &c_clinic
              call: "POST /api/clinics"
              payload: { name: "Vale Veterinary", caseload_baseline_tests: 1000 }
              as: PlatformAdmin
              captures: { clinic_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Clinic.${clinic_id}.status == ACTIVE and version == 1"
            - "Clinic.${clinic_id}.caseload_current_tests == 1000 (initialized from caseload_baseline_tests)"
            - "Clinic.${clinic_id}.corporate_group_code is null and buying_group_code is null"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: placement_agreement_program_conditional_terms
        claim_type: Required Fields
        grounds:
          - entities.PlacementAgreement.fields.monthly_minimum_cents
          - entities.PlacementAgreement.fields.lease_rate_cents
          - entities.PlacementAgreement.fields.purchase_price_cents
          - errors.ERR_INVALID_PROGRAM_TERMS
        distinguishing_aspect: "Each program_type demands its own price field: REAGENT_COMMITMENT without monthly_minimum_cents, LEASE without lease_rate_cents, and a field foreign to the program all fail 400 ERR_INVALID_PROGRAM_TERMS, while a complete PURCHASE draft succeeds."
        test_recipe:
          setup:
            - "Logical clock at default. One ACTIVE clinic."
          setup_api_calls:
            - *c_clinic
          trigger:
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "REAGENT_COMMITMENT", term_months: 24, start_date: "2026-09-01T00:00:00Z" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "LEASE", term_months: 36, start_date: "2026-09-01T00:00:00Z", monthly_minimum_cents: 100000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "PURCHASE", term_months: 24, start_date: "2026-09-01T00:00:00Z", purchase_price_cents: 950000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa_ok: $.data.id }
          assert:
            - "REAGENT_COMMITMENT without monthly_minimum_cents: 400 ERR_INVALID_PROGRAM_TERMS"
            - "LEASE carrying monthly_minimum_cents instead of lease_rate_cents: 400 ERR_INVALID_PROGRAM_TERMS (foreign program field)"
            - "the complete PURCHASE draft returns 201 with status DRAFT"
            - "GET /api/placement-agreements?clinic_id=${clinic_id} returns exactly 1 row"

      - name: placement_agreement_invalid_enum_and_term_rejected
        claim_type: Type Constraints
        grounds:
          - entities.PlacementAgreement.fields.program_type
          - entities.PlacementAgreement.fields.term_months
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "program_type is a closed enum and term_months is restricted to {24,36,48,60}: LEASE_TO_OWN and term_months 25 are both 400 ERR_INVALID_REQUEST, never silently coerced."
        test_recipe:
          setup:
            - "Logical clock at default. One ACTIVE clinic."
          setup_api_calls:
            - *c_clinic
          trigger:
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "LEASE_TO_OWN", term_months: 24, start_date: "2026-09-01T00:00:00Z" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "PURCHASE", term_months: 25, start_date: "2026-09-01T00:00:00Z", purchase_price_cents: 950000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e2: $.data.error_id }
          assert:
            - "both responses are 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /api/placement-agreements?clinic_id=${clinic_id} returns 0 rows"

      - name: analyzer_create_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Analyzer.fields.operational_status
          - entities.Analyzer.fields.proficiency_standing
        distinguishing_aspect: "operational_status, connectivity_status, proficiency_standing and version are source system: a client smuggling operational_status IN_SERVICE and version 99 into the create body is ignored — the analyzer lands INSTALLED / NOT_CONFIGURED / LAPSED at version 1 with the model copied from the agreement."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with an ACTIVE PURCHASE agreement (VETHEMAT_500)."
          setup_api_calls:
            - *c_clinic
            - &c_pa_purchase
              call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETHEMAT_500", program_type: "PURCHASE", term_months: 24, start_date: "2026-09-01T00:00:00Z", purchase_price_cents: 950000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa_id: $.data.id }
            - &c_approve
              call: "POST /api/placement-agreements/${pa_id}/approve"
              payload: {}
              as: FinanceReviewer
            - &c_activate
              call: "POST /api/placement-agreements/${pa_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { pa_v: $.data.version }
          trigger:
            - call: "POST /api/analyzers"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", serial_number: "SN-SYS-1", operational_status: "IN_SERVICE", proficiency_standing: "CURRENT", version: 99 }
              as: FieldServiceEngineer
              captures: { an_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Analyzer.${an_id}.operational_status == INSTALLED, connectivity_status == NOT_CONFIGURED, proficiency_standing == LAPSED, version == 1"
            - "Analyzer.${an_id}.model == VETHEMAT_500 (copied from the agreement, never client-supplied)"
            - "Analyzer.${an_id}.is_loaner_unit == false (default applied)"

      - name: commitment_period_computed_fields_null_until_close
        claim_type: Computed Fields
        grounds:
          - entities.CommitmentPeriod.fields.fulfilled_cents
          - entities.CommitmentPeriod.fields.provisional_fulfilled_cents
        distinguishing_aspect: "An OPEN period created at activation exposes minimum_cents == 100000 and provisional_fulfilled_cents == 0, while fulfilled_cents, shortfall_cents and billed_cents are null — the final-variant fields do not exist until the close locks them."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c, 24 months)."
          setup_api_calls:
            - *c_clinic
            - &c_pa_rc100
              call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "REAGENT_COMMITMENT", term_months: 24, start_date: "2026-09-01T00:00:00Z", monthly_minimum_cents: 100000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa_id: $.data.id }
            - *c_approve
            - *c_activate
          trigger:
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp0: "$.data[0].id" }
          assert:
            - "the list returns exactly 24 rows ordered by period_month ASC, first period_month == \"2026-09\", last == \"2028-08\""
            - "periods[0].period_status == OPEN and billing_status == NONE and minimum_cents == 100000"
            - "periods[0].provisional_fulfilled_cents == 0 (no FULFILLED orders)"
            - "periods[0].fulfilled_cents, shortfall_cents and billed_cents are all null while OPEN"

      - name: lab_result_immutable_single_record
        claim_type: Immutability
        grounds:
          - entities.LabResult
          - endpoints.GET_/api/lab-test-orders/{id}/results
        distinguishing_aspect: "LabResult has common_fields false: the record carries id and created_at but no version or updated_at, there is no update endpoint, and a second RECORD_RESULT on the same order is rejected 409 — the result record is append-only."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE, connectivity ACTIVE, proficiency CURRENT (one PASS recorded)."
            - "An IN_CLINIC PATIENT order already RESULT_RECORDED with result 7.7."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - &c_analyzer
              call: "POST /api/analyzers"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", serial_number: "SN-LAB-1" }
              as: FieldServiceEngineer
              captures: { an_id: $.data.id }
            - &c_analyzer_online
              call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE", connectivity_status: "ACTIVE" }
              as: FieldServiceEngineer
            - &c_prof_order
              call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PROFICIENCY", test_code: "PROF-CHEM", analyzer_id: "${an_id}", expected_result: 200.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_prof: $.data.id }
            - &c_prof_pass
              call: "PATCH /api/lab-test-orders/${lto_prof}"
              payload: { action: "RECORD_RESULT", result_value: 205.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - &c_patient_order
              call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PATIENT", test_code: "CBC", analyzer_id: "${an_id}" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_pat: $.data.id }
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "RECORD_RESULT", result_value: 7.7 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
          trigger:
            - call: "GET /api/lab-test-orders/${lto_pat}/results"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { res_id: "$.data[0].id" }
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "RECORD_RESULT", result_value: 8.8 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { dup_err: $.data.error_id }
          assert:
            - "GET results returns exactly 1 row with source == IN_CLINIC, result_value == 7.7, verdict null (PATIENT), resulted_at == the recording clock"
            - "LabResult.${res_id} carries id and created_at but no version and no updated_at fields"
            - "second RECORD_RESULT: 409 ERR_TEST_ORDER_INVALID_STATE (status RESULT_RECORDED has no RECORD_RESULT edge)"
            - "the stored result still reads 7.7 (no overwrite channel exists)"

      - name: unknown_id_reads_return_entity_specific_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_CLINIC_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_ANALYZER_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_TEST_ORDER_NOT_FOUND
        distinguishing_aspect: "Each entity's GET-by-id maps an unallocated UUID to its own 404 code — never a generic 404 and never a 400."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /api/clinics/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /api/placement-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /api/analyzers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /api/reagent-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /api/lab-test-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e5: $.data.error_id }
          assert:
            - "the five responses are 404 with error_id ERR_CLINIC_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_ANALYZER_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_TEST_ORDER_NOT_FOUND respectively"
            - "every error body carries response_type error and data.error_id plus data.message"

      - name: unknown_id_actions_return_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_SERVICE_CASE_NOT_FOUND
          - errors.ERR_PERIOD_NOT_FOUND
        distinguishing_aspect: "Action endpoints on unknown ids 404 with the entity-specific code before any state logic runs (existence priority 4 beats state priority 6)."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "PATCH /api/service-cases/00000000-0000-4000-8000-000000000000"
              payload: { action: "DISPATCH" }
              as: FieldServiceEngineer
              captures: { e1: $.data.error_id }
            - call: "POST /api/commitment-periods/00000000-0000-4000-8000-000000000000/record-payment"
              payload: { amount_cents: 100 }
              as: FinanceReviewer
              captures: { e2: $.data.error_id }
          assert:
            - "PATCH service-case: 404 ERR_SERVICE_CASE_NOT_FOUND"
            - "record-payment: 404 ERR_PERIOD_NOT_FOUND"

      - name: reagent_orders_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/reagent-orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three orders on one agreement, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns the tail with has_more false; the status filter narrows to FULFILLED only; default limit is 10."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c). Three orders created on it; the third is FULFILLED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 10 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_LYTE_CART", quantity: 10 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-10", lines: [{ sku: "VU200_URINE_STRIP", quantity: 10 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro3: $.data.id }
            - call: "PATCH /api/reagent-orders/${ro3}"
              payload: { status: "FULFILLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
          trigger:
            - call: "GET /api/reagent-orders"
              payload: { agreement_id: "${pa_id}", limit: 2, offset: 0 }
              as: FinanceReviewer
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/reagent-orders?agreement_id=${pa_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /api/reagent-orders?agreement_id=${pa_id}&status=FULFILLED returns exactly 1 row (the third order)"
            - "GET /api/reagent-orders?agreement_id=${pa_id} with no pagination params returns 3 rows under the default limit 10 / offset 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: placement_agreement_initial_state_and_computed_end_date
        claim_type: Initial State
        grounds:
          - state_machines.PlacementAgreement
          - entities.PlacementAgreement.fields.end_date
        distinguishing_aspect: "A fresh agreement is DRAFT at version 1 with end_date computed as start_date + term_months calendar months: 2026-09-01 + 24 months lands exactly on 2028-09-01T00:00:00Z."
        test_recipe:
          setup:
            - "Logical clock at default. One ACTIVE clinic."
          setup_api_calls:
            - *c_clinic
          trigger:
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETURINE_200", program_type: "LEASE", term_months: 24, start_date: "2026-09-01T00:00:00Z", lease_rate_cents: 320000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa_id: $.data.id }
          assert:
            - "the response status is 201; PlacementAgreement.${pa_id}.status == DRAFT and version == 1"
            - "end_date == 2028-09-01T00:00:00Z (computed, 24 calendar months)"
            - "baseline_caseload_snapshot is null until activation and cumulative_billed_cents == 0"

      - name: approve_from_approved_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlacementAgreement.DRAFT_to_APPROVED
          - errors.ERR_AGREEMENT_INVALID_STATE
        distinguishing_aspect: "APPROVED has no approve edge: a second approve is rejected 409 ERR_AGREEMENT_INVALID_STATE and the agreement stays APPROVED."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with an APPROVED agreement."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/approve"
              payload: {}
              as: FinanceReviewer
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_AGREEMENT_INVALID_STATE"
            - "PlacementAgreement.${pa_id}.status remains APPROVED and version == 2"

      - name: activate_from_draft_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlacementAgreement.APPROVED_to_ACTIVE
          - errors.ERR_AGREEMENT_INVALID_STATE
        distinguishing_aspect: "Activation skips no steps: a DRAFT agreement cannot jump to ACTIVE — 409 ERR_AGREEMENT_INVALID_STATE and no CommitmentPeriods are created."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with a DRAFT agreement (never approved)."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_AGREEMENT_INVALID_STATE"
            - "status remains DRAFT; GET commitment-periods returns 0 rows"

      - name: reagent_order_terminal_lockdown_after_cancel
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ReagentOrder
          - errors.ERR_ORDER_INVALID_STATE
        distinguishing_aspect: "CANCELLED is terminal: a later FULFILLED patch is 409 ERR_ORDER_INVALID_STATE, fulfilled_at stays null, and the order never enters any commitment total."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE REAGENT_COMMITMENT agreement; one order already CANCELLED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 5 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_id: $.data.id }
            - call: "PATCH /api/reagent-orders/${ro_id}"
              payload: { status: "CANCELLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
          trigger:
            - call: "PATCH /api/reagent-orders/${ro_id}"
              payload: { status: "FULFILLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ORDER_INVALID_STATE"
            - "ReagentOrder.${ro_id}.status == CANCELLED and fulfilled_at is null"
            - "the 2026-09 period's provisional_fulfilled_cents stays 0"

      - name: lab_test_order_receive_rejected_for_in_clinic
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LabTestOrder.ORDERED_to_RECEIVED
          - errors.ERR_TEST_ORDER_INVALID_STATE
        distinguishing_aspect: "RECEIVE exists only on the SEND_OUT branch: even the LaboratoryTechnician gets 409 ERR_TEST_ORDER_INVALID_STATE when the order's origin is IN_CLINIC."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; analyzer installed; an IN_CLINIC PATIENT order ORDERED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PATIENT", test_code: "CBC", analyzer_id: "${an_id}" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_id: $.data.id }
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECEIVE" }
              as: LaboratoryTechnician
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TEST_ORDER_INVALID_STATE (origin gate, not a role failure — LaboratoryTechnician is the RECEIVE role)"
            - "LabTestOrder.${lto_id}.status remains ORDERED"

      - name: lab_test_order_send_out_result_before_receive_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LabTestOrder.RECEIVED_to_RESULT_RECORDED
          - errors.ERR_TEST_ORDER_INVALID_STATE
        distinguishing_aspect: "The SEND_OUT branch inserts RECEIVED before results: RECORD_RESULT from ORDERED is 409 ERR_TEST_ORDER_INVALID_STATE — the reference lab cannot skip sample receipt."
        test_recipe:
          setup:
            - "Logical clock at default. One ACTIVE clinic; a SEND_OUT PATIENT order ORDERED (no analyzer)."
          setup_api_calls:
            - *c_clinic
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "SEND_OUT", order_kind: "PATIENT", test_code: "CHEM17" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_id: $.data.id }
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECORD_RESULT", result_value: 42.0 }
              as: LaboratoryTechnician
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TEST_ORDER_INVALID_STATE"
            - "GET /api/lab-test-orders/${lto_id}/results returns 0 rows"

      - name: lab_test_order_cancel_after_result_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LabTestOrder.ORDERED_to_CANCELLED
          - errors.ERR_TEST_ORDER_INVALID_STATE
        distinguishing_aspect: "CANCEL is only legal from ORDERED or RECEIVED: once RESULT_RECORDED the record is permanent and CANCEL is 409."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE/ACTIVE/CURRENT; PATIENT order RESULT_RECORDED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - *c_analyzer_online
            - *c_prof_order
            - *c_prof_pass
            - *c_patient_order
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "RECORD_RESULT", result_value: 7.7 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "CANCEL" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TEST_ORDER_INVALID_STATE"
            - "status remains RESULT_RECORDED and the LabResult row still exists"

      - name: service_case_double_dispatch_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.ServiceCase.OPEN_to_DISPATCHED
          - errors.ERR_SERVICE_CASE_INVALID_STATE
        distinguishing_aspect: "DISPATCH is not idempotent: the second DISPATCH on the same case is 409 ERR_SERVICE_CASE_INVALID_STATE and the case version advances only once."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE; REPAIR case OPEN."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE" }
              as: FieldServiceEngineer
            - call: "POST /api/service-cases"
              payload: { analyzer_id: "${an_id}", case_type: "REPAIR" }
              as: FieldServiceEngineer
              captures: { sc_id: $.data.id }
          trigger:
            - call: "PATCH /api/service-cases/${sc_id}"
              payload: { action: "DISPATCH" }
              as: FieldServiceEngineer
            - call: "PATCH /api/service-cases/${sc_id}"
              payload: { action: "DISPATCH" }
              as: FieldServiceEngineer
              captures: { e1: $.data.error_id }
          assert:
            - "first DISPATCH: 200, status DISPATCHED"
            - "second DISPATCH: 409 ERR_SERVICE_CASE_INVALID_STATE"
            - "ServiceCase.${sc_id}.version == 2 (create 1, one dispatch +1)"

      - name: record_payment_on_open_period_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.CommitmentPeriod.ISSUED_to_PAID
          - errors.ERR_PERIOD_INVALID_STATE
        distinguishing_aspect: "An OPEN period has billing_status NONE: record-payment is 409 ERR_PERIOD_INVALID_STATE — payment cannot precede billing."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE REAGENT_COMMITMENT agreement; period 2026-09 still OPEN."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp1: "$.data[0].id" }
          trigger:
            - call: "POST /api/commitment-periods/${cp1}/record-payment"
              payload: { amount_cents: 80000 }
              as: FinanceReviewer
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PERIOD_INVALID_STATE (billing_status NONE != ISSUED)"
            - "the period remains OPEN / NONE and the agreement's cumulative_unpaid_billed_cents == 0"

      - name: activation_snapshots_baseline_and_creates_periods
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PlacementAgreement.APPROVED_to_ACTIVE
          - entities.PlacementAgreement.fields.baseline_caseload_snapshot
        distinguishing_aspect: "Activation freezes the clinic's CURRENT caseload into baseline_caseload_snapshot and materializes exactly 24 OPEN CommitmentPeriods; a later caseload change must not rewrite the snapshot."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic baseline 1000, then caseload_current raised to 1250 BEFORE activation; agreement APPROVED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { caseload_current_tests: 1250 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - *c_approve
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { snap: $.data.baseline_caseload_snapshot, pa_v: $.data.version }
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { caseload_current_tests: 900 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: FinanceReviewer
              captures: { snap_after: $.data.baseline_caseload_snapshot }
          assert:
            - "baseline_caseload_snapshot == 1250 (the current caseload at activation, not the 1000 onboarding baseline)"
            - "24 CommitmentPeriods exist, all OPEN/NONE with minimum_cents == 100000"
            - "after the later PATCH to 900 the snapshot still reads 1250 (immutable once taken)"
            - "PlacementAgreement.${pa_id}.version == 3 (create, approve, activate)"

      - name: gpa_expiry_sweep_terminal_and_repricing
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.GroupPricingAgreement.ACTIVE_to_EXPIRED
          - calculations.reagent_order_pricing
        distinguishing_aspect: "Once the clock reaches effective_to the agreement is EXPIRED for good: further clock advances never revive it, and new orders fall back to LIST pricing — a clinic's buying-group 20% discount disappears mid-term."
        test_recipe:
          setup:
            - "Logical clock at default. BUYING GPA BUY-9 window [2026-09-01, 2026-10-01) discount 0.20, ACTIVE."
            - "Clinic with buying_group_code BUY-9 and ACTIVE REAGENT_COMMITMENT agreement."
            - "September order priced with the discount; clock advanced to 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "BUYING", group_code: "BUY-9", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", discount_pct: 0.20 }
              as: PlatformAdmin
              captures: { gpa9: $.data.id }
            - call: "POST /api/clinics"
              payload: { name: "Buying Group Vet", caseload_baseline_tests: 1000, buying_group_code: "BUY-9" }
              as: PlatformAdmin
              captures: { clinic_id: $.data.id }
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 10 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_before: $.data.final_total_cents }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/group-pricing-agreements"
              payload: { group_code: "BUY-9" }
              as: PlatformAdmin
              captures: { gpa_status: "$.data[0].status" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/group-pricing-agreements"
              payload: { group_code: "BUY-9" }
              as: PlatformAdmin
              captures: { gpa_status_2: "$.data[0].status" }
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-10", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 10 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_after: $.data.final_total_cents }
          assert:
            - "September order final_total_cents == 3360 (10 x round_half_up(420 x 0.8) = 10 x 336)"
            - "at clock == effective_to the agreement reads EXPIRED (half-open end is exclusive of coverage, inclusive of expiry)"
            - "after a further clock advance it still reads EXPIRED (terminal; no resurrection)"
            - "October order final_total_cents == 4200 (10 x 420 LIST — expired GPA no longer applies)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: pricing_layered_precedence
        claim_type: Correct Result
        grounds:
          - calculations.reagent_order_pricing
        excluded_because:
          difficulty_instance: layered_pricing_override_membership
          rationale: "Override/discount/program-included precedence with literal totals is asserted there."

      - name: commitment_provisional_counts_only_fulfilled_orders
        claim_type: Input Set Filtering
        grounds:
          - calculations.commitment_fulfillment
          - entities.CommitmentPeriod.fields.provisional_fulfilled_cents
        distinguishing_aspect: "The provisional aggregation filters on status == FULFILLED: a SUBMITTED order contributes nothing, fulfilling it adds exactly its final_total, and cancelling a different SUBMITTED order changes nothing — 0 -> 42000 -> 42000."
        test_recipe:
          setup:
            - "Logical clock at default (September). Clinic with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c)."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 100 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro1: $.data.id }
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { p0: "$.data[0].provisional_fulfilled_cents" }
          trigger:
            - call: "PATCH /api/reagent-orders/${ro1}"
              payload: { status: "FULFILLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VH500_CBC_CART", quantity: 5 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro2: $.data.id }
            - call: "PATCH /api/reagent-orders/${ro2}"
              payload: { status: "CANCELLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { p1: "$.data[0].provisional_fulfilled_cents" }
          assert:
            - "while SUBMITTED: provisional_fulfilled_cents == 0"
            - "after FULFILLED: provisional_fulfilled_cents == 42000 (fulfilled_at month 2026-09 == period_month)"
            - "the cancelled 4450c order contributes nothing: the total remains 42000"

      - name: proficiency_tolerance_boundary_inclusive
        claim_type: Constants Applied
        grounds:
          - calculations.proficiency_verdict
          - entities.LabResult.fields.verdict
        distinguishing_aspect: "The 5% tolerance is inclusive: |210.0 - 200.0| == 10.0 == 0.05 x 200.0 PASSES, while 210.01 exceeds it and FAILS — the two verdicts land on opposite sides of one constant."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE (proficiency gate does not block PROFICIENCY orders, so both attempts run)."
            - "Two PROFICIENCY orders on the analyzer, expected_result 200.0."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE" }
              as: FieldServiceEngineer
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PROFICIENCY", test_code: "PROF-CHEM", analyzer_id: "${an_id}", expected_result: 200.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { prof_a: $.data.id }
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PROFICIENCY", test_code: "PROF-CHEM", analyzer_id: "${an_id}", expected_result: 200.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { prof_b: $.data.id }
          trigger:
            - call: "PATCH /api/lab-test-orders/${prof_a}"
              payload: { action: "RECORD_RESULT", result_value: 210.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "GET /api/lab-test-orders/${prof_a}/results"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { verdict_a: "$.data[0].verdict" }
            - call: "PATCH /api/lab-test-orders/${prof_b}"
              payload: { action: "RECORD_RESULT", result_value: 210.01 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "GET /api/lab-test-orders/${prof_b}/results"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { verdict_b: "$.data[0].verdict" }
          assert:
            - "result 210.0: verdict == PASS (deviation 10.0 == 0.05 * 200.0, boundary inclusive)"
            - "result 210.01: verdict == FAIL (10.01 > 10.0)"
            - "after the PASS the analyzer's proficiency_standing was CURRENT; the later FAIL moved it back to LAPSED"
            - "the PASS set qc_valid_until == 2026-10-01T00:00:00Z (resulted 2026-09-01 + 30 days)"

      - name: uptime_breach_grants_exactly_one_service_credit
        claim_type: Correct Result
        grounds:
          - calculations.uptime_and_service_credit
          - entities.PlacementAgreement.fields.service_credit_cents
        distinguishing_aspect: "A 33-hour REPAIR pushes breach_uptime_pct to 0.9847, strictly below the 0.985 threshold, so the resolve credits the agreement exactly 25000c once; sla_met is false at 33h > 24h."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE."
            - "REPAIR case opened at 2026-09-01T00:00:00Z, DISPATCHED, clock advanced 33 hours to 2026-09-02T09:00:00Z."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE" }
              as: FieldServiceEngineer
            - call: "POST /api/service-cases"
              payload: { analyzer_id: "${an_id}", case_type: "REPAIR" }
              as: FieldServiceEngineer
              captures: { sc_id: $.data.id }
            - call: "PATCH /api/service-cases/${sc_id}"
              payload: { action: "DISPATCH" }
              as: FieldServiceEngineer
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PATCH /api/service-cases/${sc_id}"
              payload: { action: "RESOLVE" }
              as: FieldServiceEngineer
            - call: "GET /api/analyzers/${an_id}"
              payload: {}
              as: FieldServiceEngineer
              captures: { an_breach: $.data.breach_uptime_pct, an_down: $.data.total_downtime_hours }
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: FinanceReviewer
              captures: { pa_credit: $.data.service_credit_cents }
          assert:
            - "ServiceCase.${sc_id}.downtime_hours == 33 and sla_met == false (33h > RESPONSE_SLA_HOURS 24)"
            - "Analyzer.${an_id}.breach_uptime_pct == 0.9847 (round_half_up((2160-33)/2160, 4)) — strictly below 0.985"
            - "Analyzer.${an_id}.reported_uptime_pct == 0.9847 too (REPAIR downtime is never calibration-free)"
            - "PlacementAgreement.${pa_id}.service_credit_cents == 25000 (exactly one UPTIME_SERVICE_CREDIT_CENTS per case)"
            - "total_downtime_hours == 33"

      - name: renegotiation_proposal_hits_minimum_floor
        claim_type: Correct Result
        grounds:
          - calculations.renegotiation_terms
          - entities.PlacementAgreement.fields.proposed_minimum_cents
        distinguishing_aspect: "When the caseload collapses 60% (1000 -> 400) the raw proposal round_half_up(100000 x 0.4) == 40000 falls below the floor: the stored proposed_minimum_cents is exactly MIN_MONTHLY_MINIMUM_CENTS 50000."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic (snapshot 1000) with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c); caseload_current cut to 400."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { caseload_current_tests: 400 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { proposed: $.data.proposed_minimum_cents }
          assert:
            - "the request succeeds (delta 0.60 >= 0.30 in either direction)"
            - "proposed_minimum_cents == 50000 (floor engages over the raw 40000)"
            - "PlacementAgreement.${pa_id}.status == RENEGOTIATION"

      - name: order_month_outside_agreement_term_rejected
        claim_type: Constants Applied
        grounds:
          - "validations[priority=5]"
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "order_month must name one of the agreement's 24 term months: 2026-08 (before start) and 2030-01 (beyond end_date 2028-09) are both 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE REAGENT_COMMITMENT agreement (start 2026-09-01, 24 months)."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
          trigger:
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-08", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 1 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2030-01", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 1 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e2: $.data.error_id }
          assert:
            - "both responses are 400 ERR_INVALID_REQUEST"
            - "GET /api/reagent-orders?agreement_id=${pa_id} returns 0 rows"

      - name: qc_material_zero_priced_only_on_reagent_commitment
        claim_type: Correct Result
        grounds:
          - calculations.reagent_order_pricing
          - entities.ReagentOrder.fields.pricing_detail
        distinguishing_aspect: "The PROGRAM_INCLUDED zero price is conditional on the agreement's program_type: the identical QC_LEVEL_1 line totals 0c on the clinic's REAGENT_COMMITMENT agreement but full list 6000c on its PURCHASE agreement."
        test_recipe:
          setup:
            - "Logical clock at default. One clinic with TWO ACTIVE agreements: a REAGENT_COMMITMENT (VETCHEM_300) and a PURCHASE (VETHEMAT_500)."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETHEMAT_500", program_type: "PURCHASE", term_months: 24, start_date: "2026-09-01T00:00:00Z", purchase_price_cents: 950000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa2_id: $.data.id }
            - call: "POST /api/placement-agreements/${pa2_id}/approve"
              payload: {}
              as: FinanceReviewer
            - call: "POST /api/placement-agreements/${pa2_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "QC_LEVEL_1", quantity: 2 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { tot_rc: $.data.final_total_cents }
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa2_id}", order_month: "2026-09", lines: [{ sku: "QC_LEVEL_1", quantity: 2 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { tot_pur: $.data.final_total_cents }
          assert:
            - "REAGENT_COMMITMENT agreement: final_total_cents == 0 with price_source PROGRAM_INCLUDED on the line"
            - "PURCHASE agreement: final_total_cents == 6000 (2 x 3000 LIST) — same SKU, same clinic, different program economics"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=1]"
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request with neither X-User-ID nor X-User-Role is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role, existence, or state logic — even on a read."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /api/group-pricing-agreements"
              payload: {}
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "response_type is error and no data rows leak"

      - name: unknown_role_header_rejected_invalid_role
        claim_type: Violation → Error
        grounds:
          - "validations[priority=1]"
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "An X-User-Role value outside the five declared roles is the same 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, not a 403 — the role itself fails authentication before authorization is consulted."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /api/group-pricing-agreements"
              payload: {}
              as: SuperUser
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 403 ERR_INSUFFICIENT_PERMISSIONS)"

      - name: clinic_manager_cannot_touch_other_clinic_order
        claim_type: Violation → Error
        grounds:
          - "validations[priority=3]"
          - errors.ERR_CLINIC_OWNERSHIP_MISMATCH
        distinguishing_aspect: "The ClinicManager ownership check compares X-User-ID to the order's clinic_id: fulfilling another clinic's order is 403 ERR_CLINIC_OWNERSHIP_MISMATCH even though the role may fulfill orders generally."
        test_recipe:
          setup:
            - "Logical clock at default. Two clinics A and B, each with an ACTIVE REAGENT_COMMITMENT agreement; one SUBMITTED order on clinic B's agreement."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/clinics"
              payload: { name: "Other Vet", caseload_baseline_tests: 800 }
              as: PlatformAdmin
              captures: { clinic_b: $.data.id }
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_b}", model: "VETCHEM_300", program_type: "REAGENT_COMMITMENT", term_months: 24, start_date: "2026-09-01T00:00:00Z", monthly_minimum_cents: 100000 }
              as: ClinicManager
              as_user_id: "${clinic_b}"
              captures: { pa_b: $.data.id }
            - call: "POST /api/placement-agreements/${pa_b}/approve"
              payload: {}
              as: FinanceReviewer
            - call: "POST /api/placement-agreements/${pa_b}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_b}", agreement_id: "${pa_b}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 1 }] }
              as: ClinicManager
              as_user_id: "${clinic_b}"
              captures: { ro_b: $.data.id }
          trigger:
            - call: "PATCH /api/reagent-orders/${ro_b}"
              payload: { status: "FULFILLED" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_CLINIC_OWNERSHIP_MISMATCH (X-User-ID is clinic A, the order belongs to clinic B)"
            - "ReagentOrder.${ro_b}.status remains SUBMITTED"

      - name: body_foreign_keys_checked_in_input_order
        claim_type: Violation → Error
        grounds:
          - "validations[priority=4]"
          - errors.ERR_CLINIC_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
        distinguishing_aspect: "POST /api/reagent-orders declares clinic_id before agreement_id: with BOTH unknown the answer is ERR_CLINIC_NOT_FOUND; with only agreement_id unknown it is ERR_AGREEMENT_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at default. One ACTIVE clinic exists."
          setup_api_calls:
            - *c_clinic
          trigger:
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "00000000-0000-4000-8000-000000000001", agreement_id: "00000000-0000-4000-8000-000000000002", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 1 }] }
              as: ClinicManager
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { e1: $.data.error_id }
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "00000000-0000-4000-8000-000000000002", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 1 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e2: $.data.error_id }
          assert:
            - "both unknown: 404 ERR_CLINIC_NOT_FOUND (clinic_id is validated first in declared input order)"
            - "only agreement unknown: 404 ERR_AGREEMENT_NOT_FOUND"
            - "GET /api/reagent-orders?clinic_id=${clinic_id} returns 0 rows"

      - name: analyzer_install_requires_active_agreement
        claim_type: Violation → Error
        grounds:
          - "validations[priority=6]"
          - errors.ERR_AGREEMENT_INVALID_STATE
          - state_machines.Analyzer
        distinguishing_aspect: "Installation is gated on the agreement being ACTIVE (or RENEGOTIATION/BREACHED): an APPROVED-but-never-activated agreement rejects analyzer creation with 409 ERR_AGREEMENT_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with an APPROVED (not activated) PURCHASE agreement."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
          trigger:
            - call: "POST /api/analyzers"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", serial_number: "SN-EARLY-1" }
              as: FieldServiceEngineer
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_AGREEMENT_INVALID_STATE"
            - "GET /api/analyzers?agreement_id=${pa_id} returns 0 rows"

      - name: clinic_terminate_blocked_by_unpaid_shortfall
        claim_type: Violation → Error
        grounds:
          - "validations[priority=10]"
          - state_machines.Clinic.ACTIVE_to_TERMINATED
          - errors.ERR_OUTSTANDING_SHORTFALL_UNPAID
        distinguishing_aspect: "The fiscal gate fires only after the state gate passes: an agreement that ran past its end_date, breached, and recovered to COMPLETED still carries cumulative_unpaid_billed_cents 80000 — clinic termination is 402 ERR_OUTSTANDING_SHORTFALL_UNPAID until it is settled."
        test_recipe:
          setup:
            - "Clinic with REAGENT_COMMITMENT agreement (minimum 100000c, start 2026-09-01, 24 months, end 2028-09-01); no orders."
            - "Periods 2026-09 and 2026-10 CLOSED (two 80000c bills, cumulative_unpaid 160000); clock at 2028-09-02 so the sweep BREACHED the agreement; one 80000c payment recorded, which recovered the agreement to COMPLETED with 80000c still unpaid."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-10", expected_agreement_version: "${v1}" }
              as: PlatformAdmin
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp_sep: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/commitment-periods/${cp_sep}/record-payment"
              payload: { amount_cents: 80000 }
              as: FinanceReviewer
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: FinanceReviewer
              captures: { pa_status_now: $.data.status, unpaid_now: $.data.cumulative_unpaid_billed_cents }
          trigger:
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { status: "TERMINATED" }
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
          assert:
            - "setup proof: after the payment the agreement is COMPLETED (recovery past end_date) with cumulative_unpaid_billed_cents == 80000"
            - "the terminate is rejected 402 ERR_OUTSTANDING_SHORTFALL_UNPAID — the state gate (all agreements COMPLETED) passed and fiscal priority 10 fired"
            - "Clinic.${clinic_id}.status remains SUSPENDED (set by the earlier breach cascade; recovery to COMPLETED does not unsuspend the clinic)"

      - name: gpa_invalid_window_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=8]"
          - errors.ERR_WINDOW_INVALID
        distinguishing_aspect: "effective_to must exceed both effective_from and the logical clock: a zero-length window and a window already past are both 400 ERR_WINDOW_INVALID."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-W", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-W", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
          assert:
            - "both responses are 400 ERR_WINDOW_INVALID"
            - "GET /api/group-pricing-agreements?group_code=CORP-W returns 0 rows"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: close_commitment_period_side_effects
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/api/placement-agreements/{id}/close-commitment-period
          - state_machines.CommitmentPeriod.OPEN_to_CLOSED
        distinguishing_aspect: "One close call moves both period dimensions atomically and debits the agreement: the returned period is CLOSED/ISSUED at version 2 with billed_cents 80000, and the agreement's cumulative_unpaid_billed_cents becomes 80000 at version 4."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-10-02T00:00:00Z. Clinic with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c, version 3); no orders."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id, cp_v: $.data.version }
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: FinanceReviewer
              captures: { pa_unpaid: $.data.cumulative_unpaid_billed_cents, pa_v_after: $.data.version }
          assert:
            - "CommitmentPeriod.${cp_id}: period_status == CLOSED, billing_status == ISSUED, fulfilled_cents == 0, shortfall_cents == 100000, billed_cents == 80000"
            - "the period's version == 2 (one mutation event covering both dimensions)"
            - "PlacementAgreement.${pa_id}.cumulative_billed_cents == 80000 and cumulative_unpaid_billed_cents == 80000, version == 4"
            - "no breach: 80000 < 250000 so status stays ACTIVE and the clinic stays ACTIVE"

      - name: deliver_requires_result_recorded_first
        claim_type: Conditional action
        grounds:
          - state_machines.LabTestOrder.RESULT_RECORDED_to_DELIVERED
          - errors.ERR_TEST_ORDER_INVALID_STATE
        distinguishing_aspect: "DELIVER is only legal from RESULT_RECORDED: on a fresh ORDERED test order it is 409 ERR_TEST_ORDER_INVALID_STATE and delivery_status stays NOT_READY."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE/ACTIVE/CURRENT; a PATIENT order ORDERED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - *c_analyzer_online
            - *c_prof_order
            - *c_prof_pass
            - *c_patient_order
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "DELIVER" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_TEST_ORDER_INVALID_STATE"
            - "LabTestOrder.${lto_pat}.status == ORDERED and delivery_status == NOT_READY"

      - name: deliver_blocked_when_connectivity_degraded
        claim_type: Conditional action
        grounds:
          - state_machines.LabTestOrder.RESULT_RECORDED_to_DELIVERED
          - errors.ERR_CONNECTIVITY_NOT_ACTIVE
        distinguishing_aspect: "The PIMS push for an IN_CLINIC result requires the interface ACTIVE at DELIVER time: recording succeeds online, then degrading the interface makes DELIVER 409 ERR_CONNECTIVITY_NOT_ACTIVE until it is restored — the maintenance window is enforced per call."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE/ACTIVE/CURRENT; PATIENT order RESULT_RECORDED (delivery PENDING)."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - *c_analyzer_online
            - *c_prof_order
            - *c_prof_pass
            - *c_patient_order
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "RECORD_RESULT", result_value: 7.7 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { connectivity_status: "DEGRADED" }
              as: FieldServiceEngineer
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "DELIVER" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { connectivity_status: "ACTIVE" }
              as: FieldServiceEngineer
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "DELIVER" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_status: $.data.status }
          assert:
            - "while DEGRADED: 409 ERR_CONNECTIVITY_NOT_ACTIVE and the order stays RESULT_RECORDED / PENDING"
            - "after restore: DELIVER succeeds, status == DELIVERED and delivery_status == DELIVERED"

      - name: analyzers_filter_by_agreement_reverse_lookup
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET_/api/analyzers
          - entities.Analyzer.fields.agreement_id
        distinguishing_aspect: "The flat filtered list is the FK reverse channel: two analyzers under different agreements, and GET /api/analyzers?agreement_id=X returns exactly the one installed under X."
        test_recipe:
          setup:
            - "Logical clock at default. One clinic with an ACTIVE REAGENT_COMMITMENT agreement (VETCHEM_300) and an ACTIVE PURCHASE agreement (VETHEMAT_500); one analyzer under each."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETHEMAT_500", program_type: "PURCHASE", term_months: 24, start_date: "2026-09-01T00:00:00Z", purchase_price_cents: 950000 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { pa2: $.data.id }
            - call: "POST /api/placement-agreements/${pa2}/approve"
              payload: {}
              as: FinanceReviewer
            - call: "POST /api/placement-agreements/${pa2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/analyzers"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", serial_number: "SN-FK-1" }
              as: FieldServiceEngineer
            - call: "POST /api/analyzers"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa2}", serial_number: "SN-FK-2" }
              as: FieldServiceEngineer
          trigger:
            - call: "GET /api/analyzers"
              payload: { agreement_id: "${pa2}" }
              as: PlatformAdmin
          assert:
            - "exactly 1 row, serial_number == SN-FK-2, model == VETHEMAT_500 (copied from its agreement)"
            - "GET /api/analyzers?clinic_id=${clinic_id} returns 2 rows"
            - "GET /api/analyzers?operational_status=INSTALLED returns 2 rows"

  # ===========================================================================
  - section: errors
    instances:
      - name: record_payment_amount_mismatch_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PAYMENT_AMOUNT_MISMATCH
          - "validations[priority=10]"
        distinguishing_aspect: "On an ISSUED period the state gate passes, so the fiscal exact-amount rule fires: paying 79999c against an 80000c bill is 402 ERR_PAYMENT_AMOUNT_MISMATCH and the bill stays ISSUED."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-02T00:00:00Z. Clinic with ACTIVE REAGENT_COMMITMENT agreement; period 2026-09 CLOSED with billed_cents 80000, billing ISSUED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp1: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/commitment-periods/${cp1}/record-payment"
              payload: { amount_cents: 79999 }
              as: FinanceReviewer
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 402 and error_id == ERR_PAYMENT_AMOUNT_MISMATCH (79999 != 80000)"
            - "the period remains ISSUED and cumulative_unpaid_billed_cents == 80000"

      - name: state_errors_sweep_analyzer_and_service_case
        claim_type: Violation → Error
        grounds:
          - errors.ERR_ANALYZER_INVALID_STATE
          - errors.ERR_SERVICE_CASE_INVALID_STATE
        distinguishing_aspect: "Two leftover state codes: RECORD_RESULT on an analyzer still INSTALLED is 409 ERR_ANALYZER_INVALID_STATE (operational gate fires first), and decommissioning that analyzer while a case is OPEN is 409 ERR_SERVICE_CASE_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; an analyzer created and moved to IN_SERVICE; a PATIENT order placed on it; then a REPAIR case (OPEN) moves the analyzer to UNDER_SERVICE."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "IN_CLINIC", order_kind: "PATIENT", test_code: "CBC", analyzer_id: "${an_id}" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_id: $.data.id }
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE" }
              as: FieldServiceEngineer
            - call: "POST /api/service-cases"
              payload: { analyzer_id: "${an_id}", case_type: "REPAIR" }
              as: FieldServiceEngineer
              captures: { sc_id: $.data.id }
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECORD_RESULT", result_value: 7.7 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e0: $.data.error_id }
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "DECOMMISSIONED" }
              as: FieldServiceEngineer
              captures: { e1: $.data.error_id }
          assert:
            - "RECORD_RESULT with the analyzer UNDER_SERVICE: 409 ERR_ANALYZER_INVALID_STATE (operational gate fires first, before connectivity or proficiency)"
            - "decommission with an OPEN case: 409 ERR_SERVICE_CASE_INVALID_STATE"
            - "Analyzer.${an_id}.operational_status remains UNDER_SERVICE"
            - "ServiceCase.${sc_id}.status remains OPEN"

      - name: invalid_request_sweep_missing_and_bad_inputs
        claim_type: Violation → Error
        grounds:
          - errors.ERR_INVALID_REQUEST
          - "validations[priority=5]"
        distinguishing_aspect: "ERR_INVALID_REQUEST covers the shape rules no narrower code owns: missing required field on clinic create, missing result_value on RECORD_RESULT, accept=true without new_minimum_cents, and a non-monotonic clock-set — four distinct 400s, one code."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE REAGENT_COMMITMENT agreement in RENEGOTIATION (caseload 1400 vs snapshot 1000); analyzer IN_SERVICE/ACTIVE/CURRENT; a PATIENT order ORDERED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { caseload_current_tests: 1400 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { reneg_v: $.data.version }
            - *c_analyzer
            - *c_analyzer_online
            - *c_prof_order
            - *c_prof_pass
            - *c_patient_order
          trigger:
            - call: "POST /api/clinics"
              payload: { caseload_baseline_tests: 500 }
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "PATCH /api/lab-test-orders/${lto_pat}"
              payload: { action: "RECORD_RESULT" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /api/placement-agreements/${pa_id}/resolve-renegotiation"
              payload: { accept: true, expected_agreement_version: "${reneg_v}" }
              as: FinanceReviewer
              captures: { e3: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
          assert:
            - "missing name on clinic create: 400 ERR_INVALID_REQUEST"
            - "RECORD_RESULT without result_value: 400 ERR_INVALID_REQUEST"
            - "accept=true without new_minimum_cents: 400 ERR_INVALID_REQUEST (agreement stays RENEGOTIATION)"
            - "clock-set moving backwards: 400 ERR_INVALID_REQUEST (monotonicity)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: clinic_manager_cannot_approve_own_draft
        claim_type: Violation → Error
        grounds:
          - roles.FinanceReviewer
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Segregation of duties: the drafting role cannot approve — a ClinicManager calling approve (even on their own clinic's agreement) is 403 ERR_INSUFFICIENT_PERMISSIONS and the agreement stays DRAFT."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with a DRAFT agreement."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/approve"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "PlacementAgreement.${pa_id}.status remains DRAFT"

      - name: laboratory_technician_cannot_create_placement
        claim_type: Violation → Error
        grounds:
          - roles.LaboratoryTechnician
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "The lab role is confined to send-out receipt and results: POST /api/placement-agreements as LaboratoryTechnician is 403 before any body validation."
        test_recipe:
          setup:
            - "Logical clock at default. One ACTIVE clinic."
          setup_api_calls:
            - *c_clinic
          trigger:
            - call: "POST /api/placement-agreements"
              payload: { clinic_id: "${clinic_id}", model: "VETCHEM_300", program_type: "REAGENT_COMMITMENT", term_months: 24, start_date: "2026-09-01T00:00:00Z", monthly_minimum_cents: 100000 }
              as: LaboratoryTechnician
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /api/placement-agreements?clinic_id=${clinic_id} returns 0 rows"

      - name: field_engineer_cannot_record_payment
        claim_type: Violation → Error
        grounds:
          - roles.FinanceReviewer
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "record-payment belongs to FinanceReviewer exclusively: a FieldServiceEngineer with a valid period id is 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-02T00:00:00Z. Clinic with ACTIVE REAGENT_COMMITMENT agreement; period 2026-09 CLOSED and ISSUED at 80000c."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp1: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/commitment-periods/${cp1}/record-payment"
              payload: { amount_cents: 80000 }
              as: FieldServiceEngineer
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "the period remains ISSUED"

      - name: finance_reviewer_cannot_set_clock
        claim_type: Violation → Error
        grounds:
          - roles.PlatformAdmin
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "The logical clock is PlatformAdmin-only: every other role gets 403 ERR_INSUFFICIENT_PERMISSIONS, and the clock does not move."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: FinanceReviewer
              captures: { e1: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "a follow-up GPA creation with effective_from 2026-09-01T00:00:00Z still lands ACTIVE — proof the clock never left the default"

      - name: lab_test_action_role_matrix_enforced
        claim_type: Violation → Error
        grounds:
          - roles.LaboratoryTechnician
          - roles.ClinicManager
          - "validations[priority=2]"
        distinguishing_aspect: "Within one endpoint the allowed role depends on the action and branch: RECEIVE by a ClinicManager is 403, RECEIVE by LaboratoryTechnician succeeds, RECORD_RESULT on the SEND_OUT branch by a ClinicManager is 403, and by LaboratoryTechnician succeeds — producing a REFERENCE_LAB result in the same record shape."
        test_recipe:
          setup:
            - "Logical clock at default. One ACTIVE clinic; a SEND_OUT PATIENT order ORDERED."
          setup_api_calls:
            - *c_clinic
            - call: "POST /api/lab-test-orders"
              payload: { clinic_id: "${clinic_id}", origin: "SEND_OUT", order_kind: "PATIENT", test_code: "CHEM17" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { lto_id: $.data.id }
          trigger:
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECEIVE" }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e1: $.data.error_id }
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECEIVE" }
              as: LaboratoryTechnician
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECORD_RESULT", result_value: 42.0 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { e2: $.data.error_id }
            - call: "PATCH /api/lab-test-orders/${lto_id}"
              payload: { action: "RECORD_RESULT", result_value: 42.0 }
              as: LaboratoryTechnician
              captures: { lto_status: $.data.status }
            - call: "GET /api/lab-test-orders/${lto_id}/results"
              payload: {}
              as: LaboratoryTechnician
              captures: { res_src: "$.data[0].source" }
          assert:
            - "RECEIVE as ClinicManager: 403 ERR_INSUFFICIENT_PERMISSIONS; order stays ORDERED"
            - "RECEIVE as LaboratoryTechnician: 200, status RECEIVED"
            - "RECORD_RESULT (SEND_OUT) as ClinicManager: 403 ERR_INSUFFICIENT_PERMISSIONS"
            - "RECORD_RESULT as LaboratoryTechnician: 200, status RESULT_RECORDED, delivery_status PENDING"
            - "the unified record reads source == REFERENCE_LAB with verdict null — one record shape shared with IN_CLINIC"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_resolve_renegotiation_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[occ-resolve-renegotiation-stale]
          - errors.ERR_STALE_AGREEMENT_VERSION
        distinguishing_aspect: "Resolving with expected_agreement_version one behind the current version is 412 ERR_STALE_AGREEMENT_VERSION with zero mutation; resubmitting at the observed version then succeeds — two strictly sequential requests, no wall-clock dependence."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic (snapshot 1000, current 1400) with ACTIVE REAGENT_COMMITMENT agreement; renegotiation requested — the request response carried version 4."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "PATCH /api/clinics/${clinic_id}"
              payload: { caseload_current_tests: 1400 }
              as: ClinicManager
              as_user_id: "${clinic_id}"
            - call: "POST /api/placement-agreements/${pa_id}/request-renegotiation"
              payload: {}
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { reneg_v: $.data.version }
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/resolve-renegotiation"
              payload: { accept: false, expected_agreement_version: "${reneg_v} - 1" }
              as: FinanceReviewer
              captures: { e1: $.data.error_id }
            - call: "POST /api/placement-agreements/${pa_id}/resolve-renegotiation"
              payload: { accept: false, expected_agreement_version: "${reneg_v}" }
              as: FinanceReviewer
              captures: { ok_v: $.data.version }
          assert:
            - "stale resolve: 412 ERR_STALE_AGREEMENT_VERSION (3 != current 4); status stays RENEGOTIATION and version stays 4"
            - "correct resolve: 200, status ACTIVE, version == 5"

      - name: occ_close_period_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[occ-close-period-stale]
          - errors.ERR_STALE_AGREEMENT_VERSION
        distinguishing_aspect: "The close endpoint is OCC-guarded on the same parent: after one successful close advanced the agreement version, replaying the next close with the pre-close version is 412, and refreshing the observation makes it succeed."
        test_recipe:
          setup:
            - "Logical clock at 2026-11-01T00:00:00Z. Clinic with ACTIVE REAGENT_COMMITMENT agreement; version 3 observed at activation; no orders."
            - "Period 2026-09 already closed (agreement now version 4)."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-10", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pa_v_now: $.data.version }
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-10", expected_agreement_version: "${pa_v_now}" }
              as: PlatformAdmin
              captures: { cp_oct: $.data.period_status }
          assert:
            - "replaying with the stale version 3: 412 ERR_STALE_AGREEMENT_VERSION (agreement is at 4 after the September close)"
            - "after re-reading, the close at version 4 succeeds: period_status == CLOSED"
            - "only one October close landed: a third attempt would fail state (already CLOSED), not OCC"

      - name: clock_default_fixed_at_startup
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/api/_clock/set_current_utc
          - entities.GroupPricingAgreement.fields.status
        distinguishing_aspect: "Before any clock-set the logical clock reads exactly 2026-09-01T00:00:00Z: a GPA whose effective_from equals that instant lands ACTIVE (inclusive lower bound), and one a nanosecond later lands DRAFT — proving the fixed default without any clock call."
        test_recipe:
          setup:
            - "Empty database; no clock-set has ever been issued."
          setup_api_calls: []
          trigger:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-D", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { g1: $.data.status }
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "CORPORATE", group_code: "CORP-E", effective_from: "2026-09-01T00:00:01Z", effective_to: "2027-01-01T00:00:00Z", discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { g2: $.data.status }
          assert:
            - "window starting exactly at the default clock: status == ACTIVE"
            - "window starting one second later: status == DRAFT"
            - "neither creation consulted any wall-clock time"

      - name: gpa_deferred_activation_and_expiry_sweep
        claim_type: scheduled_actions
        grounds:
          - state_machines.GroupPricingAgreement.DRAFT_to_ACTIVE
          - state_machines.GroupPricingAgreement.ACTIVE_to_EXPIRED
        distinguishing_aspect: "The same agreement rides both sweep edges: DRAFT at creation (future window), ACTIVE when the clock reaches effective_from, EXPIRED when it reaches effective_to — status is clock-derived, never directly writable."
        test_recipe:
          setup:
            - "Logical clock at default. One GPA for BUY-Q with window [2026-10-01T00:00:00Z, 2026-11-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /api/group-pricing-agreements"
              payload: { group_type: "BUYING", group_code: "BUY-Q", effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { gq: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/group-pricing-agreements"
              payload: { group_code: "BUY-Q" }
              as: PlatformAdmin
              captures: { s1: "$.data[0].status" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/group-pricing-agreements"
              payload: { group_code: "BUY-Q" }
              as: PlatformAdmin
              captures: { s2: "$.data[0].status" }
          assert:
            - "at creation (clock 2026-09-01): status == DRAFT"
            - "at clock == effective_from: status == ACTIVE (activation boundary inclusive)"
            - "at clock == effective_to: status == EXPIRED (expiry boundary inclusive, window half-open)"

      - name: qc_validity_lapses_only_after_boundary
        claim_type: scheduled_actions
        grounds:
          - state_machines.Analyzer.CURRENT_to_LAPSED
          - calculations.proficiency_verdict
        distinguishing_aspect: "The QC sweep is strict-greater: at the clock exactly equal to qc_valid_until the analyzer is still CURRENT; one second past, the sweep lapses it to LAPSED without any write to the analyzer."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. Clinic with ACTIVE PURCHASE agreement; analyzer IN_SERVICE; proficiency PASS just recorded (qc_valid_until == 2026-10-01T00:00:00Z)."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE" }
              as: FieldServiceEngineer
            - *c_prof_order
            - *c_prof_pass
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/analyzers/${an_id}"
              payload: {}
              as: FieldServiceEngineer
              captures: { st1: $.data.proficiency_standing }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:01Z" }
              as: PlatformAdmin
            - call: "GET /api/analyzers/${an_id}"
              payload: {}
              as: FieldServiceEngineer
              captures: { st2: $.data.proficiency_standing }
          assert:
            - "at clock == qc_valid_until exactly: proficiency_standing == CURRENT (lapse requires clock > qc_valid_until)"
            - "one second later: proficiency_standing == LAPSED"
            - "qc_valid_until itself is unchanged (2026-10-01T00:00:00Z) — only the derived standing moved"

      - name: service_case_cancel_returns_loaner_and_leaves_no_downtime
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ServiceCase.OPEN_to_CANCELLED
          - state_machines.Analyzer.ON_LOAN_to_IN_SERVICE
          - state_machines.Analyzer.UNDER_SERVICE_to_IN_SERVICE
        distinguishing_aspect: "Cancelling an OPEN repair fully compensates: the serviced analyzer returns UNDER_SERVICE -> IN_SERVICE, the loaner returns ON_LOAN -> IN_SERVICE, and total_downtime_hours stays 0 — no residue from the abandoned case."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE PURCHASE agreement; patient analyzer A IN_SERVICE; loaner unit L (is_loaner_unit true, same agreement) IN_SERVICE."
            - "A REPAIR case on A with loaner L assigned is OPEN."
          setup_api_calls:
            - *c_clinic
            - *c_pa_purchase
            - *c_approve
            - *c_activate
            - *c_analyzer
            - call: "PATCH /api/analyzers/${an_id}"
              payload: { operational_status: "IN_SERVICE" }
              as: FieldServiceEngineer
            - call: "POST /api/analyzers"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", serial_number: "SN-LOAN-1", is_loaner_unit: true }
              as: FieldServiceEngineer
              captures: { loaner_id: $.data.id }
            - call: "PATCH /api/analyzers/${loaner_id}"
              payload: { operational_status: "IN_SERVICE" }
              as: FieldServiceEngineer
            - call: "POST /api/service-cases"
              payload: { analyzer_id: "${an_id}", case_type: "REPAIR", loaner_analyzer_id: "${loaner_id}" }
              as: FieldServiceEngineer
              captures: { sc_id: $.data.id }
          trigger:
            - call: "PATCH /api/service-cases/${sc_id}"
              payload: { action: "CANCEL" }
              as: FieldServiceEngineer
            - call: "GET /api/analyzers/${an_id}"
              payload: {}
              as: FieldServiceEngineer
              captures: { a_op: $.data.operational_status, a_down: $.data.total_downtime_hours }
            - call: "GET /api/analyzers/${loaner_id}"
              payload: {}
              as: FieldServiceEngineer
              captures: { l_op: $.data.operational_status }
          assert:
            - "before cancel the serviced analyzer was UNDER_SERVICE and the loaner ON_LOAN"
            - "after cancel: serviced analyzer IN_SERVICE, loaner IN_SERVICE, case CANCELLED"
            - "total_downtime_hours == 0 on both units (no RESOLVE, no downtime)"
            - "PlacementAgreement.${pa_id}.service_credit_cents == 0"

      - name: derived_unpaid_reconciles_after_exact_payment
        claim_type: derived_field_reconciliation
        grounds:
          - entities.PlacementAgreement.fields.cumulative_unpaid_billed_cents
          - state_machines.CommitmentPeriod.ISSUED_to_PAID
        distinguishing_aspect: "The denormalized cumulative_unpaid_billed_cents tracks the ledger: 80000 after the close, exactly 0 after an exact payment — and cumulative_billed_cents stays 80000 because payment settles but never unbills."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-02T00:00:00Z. Clinic with ACTIVE REAGENT_COMMITMENT agreement; period 2026-09 CLOSED, billed 80000, ISSUED."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
            - call: "GET /api/placement-agreements/${pa_id}/commitment-periods"
              payload: {}
              as: FinanceReviewer
              captures: { cp1: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/placement-agreements/${pa_id}/close-commitment-period"
              payload: { period_month: "2026-09", expected_agreement_version: "${pa_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/commitment-periods/${cp1}/record-payment"
              payload: { amount_cents: 80000 }
              as: FinanceReviewer
              captures: { cp_billing: $.data.billing_status }
            - call: "GET /api/placement-agreements/${pa_id}"
              payload: {}
              as: FinanceReviewer
              captures: { unpaid: $.data.cumulative_unpaid_billed_cents, billed: $.data.cumulative_billed_cents }
          assert:
            - "period billing_status == PAID"
            - "cumulative_unpaid_billed_cents == 0 (reconciled) while cumulative_billed_cents == 80000 (payment does not unbill)"
            - "a second record-payment on the PAID period would be 409 ERR_PERIOD_INVALID_STATE"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: create_response_carries_locked_pricing_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/api/reagent-orders
        distinguishing_aspect: "Immediate consistency: the 201 response of POST /api/reagent-orders already contains the locked pricing_detail and final_total_cents — a follow-up GET returns byte-identical computed fields, and they never change afterwards (immutable snapshot)."
        test_recipe:
          setup:
            - "Logical clock at default. Clinic with ACTIVE REAGENT_COMMITMENT agreement (minimum 100000c)."
          setup_api_calls:
            - *c_clinic
            - *c_pa_rc100
            - *c_approve
            - *c_activate
          trigger:
            - call: "POST /api/reagent-orders"
              payload: { clinic_id: "${clinic_id}", agreement_id: "${pa_id}", order_month: "2026-09", lines: [{ sku: "VC300_CHEM_SLIDE", quantity: 10 }, { sku: "QC_LEVEL_1", quantity: 1 }] }
              as: ClinicManager
              as_user_id: "${clinic_id}"
              captures: { ro_id: $.data.id, tot: $.data.final_total_cents }
            - call: "GET /api/reagent-orders/${ro_id}"
