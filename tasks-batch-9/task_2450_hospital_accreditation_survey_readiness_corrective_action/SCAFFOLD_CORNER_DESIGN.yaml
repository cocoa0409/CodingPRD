              as: AccreditationDirector
              as_user_id: "dir-1"
              captures: { s14_err: $.data.error_id }
          assert:
            - "${s14_self} == 50.00, ${s14_gap} == 0.00, ${s14_flag} == false and Chapter.${s14_ch}.ppr_escalation_count == 0"
            - "${s14_state1} == ATTESTED after the first attest"
            - "${s14_err} == ERR_PPR_ALREADY_ATTESTED with HTTP 409"
            - "PprSelfAssessment.${s14_p}.state == ATTESTED and attested_by_user_id == dir-1 (unchanged)"

      - name: open_survey_without_activated_command_center_rejected
        claim_type: guarded_transitions
