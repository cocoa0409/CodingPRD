            - "NurseryBlock.${block_id}.occupancy_status == OCCUPIED after the planting and was AVAILABLE before it"
            - "CrossingBlock.${cb_id}.status == PLANNED, realized_cross_count == 0, progeny_line_count == 0"
            - "NurseryPlanting.${p_id}.status == SCHEDULED and occupancy_end_date == 2027-02-24"
            - "TrialSeries.${series_id}.status == PLANNING, entry_count == 1, location_count == 1, total_trial_cost_usd == null"
            - "TrialEntry.${entry_id}.status == ENTERED and BreedingProgram.${prog_id}.committed_plot_count == 59"

      - name: nursery_planting_plant_from_planted_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.NurseryPlanting.SCHEDULED_to_PLANTED
          - validations[priority=10]
          - errors[ERR_PLANTING_INVALID_STATE]
        distinguishing_aspect: "The plant trigger is not idempotent: the second call from PLANTED must fail with ERR_PLANTING_INVALID_STATE 409 and must not re-run the occupancy re-derivation or bump the program ledger a second time."
        test_recipe:
          setup:
            - "One program, one objective, one line, one WINTER block, one planting already moved to PLANTED."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
