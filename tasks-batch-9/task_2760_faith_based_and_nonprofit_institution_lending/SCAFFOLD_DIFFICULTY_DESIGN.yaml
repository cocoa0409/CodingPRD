            - call: "GET /loans/${loan}"
              payload: {}
              as: LoanServicer
              captures: { disbursed_before: $.data.disbursed_principal_cents, undrawn_before: $.data.undrawn_commitment_cents }
          trigger:
            - call: "POST /draw-requests/${d1}/void"
              payload: { void_reason: "Wire returned by the bank; contractor never funded" }
              as: LoanServicer
              captures: { d1_status: $.data.status, retainage_kept: $.data.retainage_cents }
            - call: "GET /loans/${loan}"
              payload: {}
              as: LoanServicer
              captures: { disbursed_after: $.data.disbursed_principal_cents, undrawn_after: $.data.undrawn_commitment_cents, shortfall_after: $.data.interest_reserve_shortfall_cents }
          assert:
            - "Pre-void ledger: ${disbursed_before} == 60000000 and ${undrawn_before} == 165000000, with retainage_held_cents 6000000, interest_reserve_shortfall_cents 0, outstanding_principal_cents 60000000, servicing_status \"CONSTRUCTION_DRAW\""
            - "${d1_status} == \"VOIDED\" and DrawRequest.${d1}.void_reason == \"Wire returned by the bank; contractor never funded\""
            - "${retainage_kept} == 6000000 and the draw still reports interest_reserve_applied_cents 1500000, inspection_fee_cents 45000, net_disbursed_cents 52455000, completion_pct_at_disbursement 0.2666 — the audit record survives the reversal"
            - "${disbursed_after} == 0, ${undrawn_after} == 225000000, ${shortfall_after} == 1500000; retainage_held_cents == 0, outstanding_principal_cents == 0, reserved_draw_cents == 0, cancelled_commitment_cents == 0"
            - "Loan.${loan}.servicing_status == \"PENDING_FIRST_DRAW\" — the void drove the servicing dimension backwards because disbursed_principal_cents reached 0"
            - "Conservation identity principal_cents == disbursed_principal_cents + undrawn_commitment_cents + cancelled_commitment_cents holds at 225000000 both before (60000000 + 165000000 + 0) and after (0 + 225000000 + 0)"
            - "Loan.${loan}.risk_posture is still \"OPEN\" and retainage_released_cents is still 0 — the void touches no other dimension"

      - name: pledge_reinstate_restores_campaign_pledged_dollar_conservation
        grounds:
          - state_machines.Pledge.transitions["LAPSED -> ACTIVE"]
          - state_machines.PledgeCampaign.transitions["UNDERPERFORMING -> OPEN"]
          - entities.PledgeCampaign.fields.active_pledged_cents
          - entities.PledgeCampaign.fields.lapsed_pledged_cents
          - entities.Pledge.fields.missed_payments_count
          - endpoints["POST /pledges/{pledge_id}/reinstate"]
        distinguishing_aspect: |
          Reinstatement is an exact dollar compensation but a DELIBERATELY PARTIAL state
          compensation. The bucket identity total_pledged == active + lapsed + fulfilled
          holds at 125000000 throughout (85000000 + 40000000 + 0 while lapsed, 125000000 + 0
          + 0 after), attrition_adjusted_value_cents returns to exactly 109560000, and the
          campaign climbs UNDERPERFORMING -> OPEN. But collected_cents 8000000,
          payments_made_count 1 and missed_payments_count 2 must be carried across the lapse
          untouched — so effective_attrition_pct stays 0.2700, not the 0.1200 tier rate — and
          the PLEDGE_ADVANCE application pushed to REVISION_REQUESTED by the lapse must STAY
          in REVISION_REQUESTED. Implementations that zero the payment counters on lapse, or
          that auto-unwind the application cascade, both fail.
        test_recipe:
          setup:
            - "Institution with the four 2025 AUDITED periods and an AUTHORIZED governance packet."
            - "Campaign 'Build His House' (goal 120000000, sponsor 9200 bps) with LEAD 60000000 (12000000 paid), MAJOR 40000000 (8000000 paid, 2 MISSED) and GENERAL 25000000 (5000000 paid); attrition_adjusted_value_cents 109560000, status OPEN."
