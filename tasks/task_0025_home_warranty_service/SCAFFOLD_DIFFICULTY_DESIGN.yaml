  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_creation_blocked_by_expired_contract
        grounds:
          - validations[priority=8]
          - errors[ERR_OUT_OF_COVERAGE]
          - state_machines.Contract.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Entity pair: (ClaimTicket, Contract). ClaimTicket creation depends
