      - POST /retrofit-programs/${rp_id}/start returns HTTP 200 with data.status == ${rp_status1} == "IN_PROGRESS"
        and data.version == ${rp_v1} == ${rp_v0} + 1
      - POST /retrofit-programs/${rp_id}/void returns HTTP 200 with data.status == ${rp_status2} == "VOIDED"
        and data.version == ${rp_v2} == ${rp_v1} + 1
      - Every one of the five calls succeeds under RegulatoryRetrofitist alone, so the mandate, its coverage
        and its start/void transitions sit inside this role's declared exclusive surface while POST /car-types
        is exercised through its shared entry
