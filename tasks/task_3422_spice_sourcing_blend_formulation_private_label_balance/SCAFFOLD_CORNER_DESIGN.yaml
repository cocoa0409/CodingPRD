  - section: calculations
    instances:
      - name: micro_and_moisture_at_limit_pass_over_limit_fails
        claim_type: boundary_threshold
        grounds:
          - calculations.lot_test_result
          - constants.MICRO_LIMIT_CFU_G
          - constants.MOISTURE_LIMIT_PCT
        distinguishing_aspect: "MICRO (100000) and MOISTURE (12.0) use over-limit semantics (>): values exactly AT the limit PASS, one unit over FAILs — the opposite convention from the adulterant/pesticide action levels."
        test_recipe:
          setup: ["supplier S; one RECEIVED lot"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: OREGANO, origin_region: "Lesvos", crop_year: 2025, quantity_kg: 40, flavor_intensity_units: 60.0, moisture_pct: 9.0, cost_per_kg_cents: 150, allergen_profile: NONE }, as: SupplyPlanner, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MICRO, measured_value: 100000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r1: $.data.result } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MICRO, measured_value: 100001, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r2: $.data.result } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MOISTURE, measured_value: 12.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r3: $.data.result } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MOISTURE, measured_value: 12.01, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r4: $.data.result } }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: QualityManager, captures: { st: $.data.status } }
          assert:
            - "${r1} == PASS (100000 at limit) and ${r2} == FAIL (100001 over)"
            - "${r3} == PASS (12.0 at limit) and ${r4} == FAIL (12.01 over)"
            - "lot ${st} == IN_TEST — non-adulterant FAILs never auto-quarantine"

      - name: pesticide_action_level_at_limit_fails
        claim_type: boundary_threshold
        grounds:
          - calculations.lot_test_result
          - constants.PESTICIDE_LIMIT_PPM
        distinguishing_aspect: "PESTICIDE uses action-level semantics (>= 0.10 FAILS): 0.09 PASSes, exactly 0.10 FAILs; PESTICIDE is not in REQUIRED_TEST_SUITE but a latest-FAIL still blocks ACCEPT."
        test_recipe:
          setup: ["supplier S; one RECEIVED lot"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CUMIN, origin_region: "Aleppo", crop_year: 2025, quantity_kg: 40, flavor_intensity_units: 60.0, moisture_pct: 9.0, cost_per_kg_cents: 150, allergen_profile: NONE }, as: SupplyPlanner, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: PESTICIDE, measured_value: 0.09, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r1: $.data.result } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: PESTICIDE, measured_value: 0.10, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { r2: $.data.result } }
          assert:
            - "${r1} == PASS (0.09 < 0.10)"
            - "${r2} == FAIL (0.10 >= 0.10 — at-limit fails under action-level semantics)"

