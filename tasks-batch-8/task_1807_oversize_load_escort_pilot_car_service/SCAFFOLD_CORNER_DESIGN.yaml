          assert:
            - "List success: meta.api_request_id and meta.api_request_timestamp present, response_type == array, pagination fields total_count == 1 and has_more == false present with defaults limit 10 / offset 0"
            - "Error: response_type == error, data.error_id == ERR_CARRIER_NOT_FOUND, data.message non-empty"

