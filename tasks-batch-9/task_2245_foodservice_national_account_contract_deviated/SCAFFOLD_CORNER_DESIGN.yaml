          With three products carrying identical costs (4200 / 4100 / 4300) the class
          tier alone decides the answer: the PROTEIN band flips at exactly 500 prior
          cases (4725 at 499 and at 500 prior cases, 4578 once 500 prior cases exist),
          DAIRY reads avg_cost and adds a flat 150, and PRODUCE reads replacement_cost
          and rounds 4611.75 half-up to 4612.
