              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_x: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_y: $.data.id }
            - call: "POST /orders/${order_y}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
          trigger:
            - call: "POST /orders/${order_x}/place"
              payload: {}
              as: StoreTerminal
              captures: { e_empty: $.data.error_id }
            - call: "POST /orders/${order_y}/settle"
              payload: {}
              as: StoreTerminal
              captures: { e_settle: $.data.error_id }
            - call: "POST /orders/${order_y}/place"
              payload: {}
              as: StoreTerminal
              captures: { ps: $.data.production_status }
            - call: "POST /orders/${order_y}/pickup"
              payload: {}
              as: StoreTerminal
              captures: { e_pickup: $.data.error_id }
            - call: "GET /kitchen-tickets"
              payload: { order_id: "${order_y}" }
              as: KitchenAssociate
              captures: { tk: "$.data[0].id" }
            - call: "POST /kitchen-tickets/${tk}/complete"
              payload: {}
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { e_ticket: $.data.error_id }
            - call: "POST /orders/${order_y}/authorize"
              payload: { tender_type: "CARD" }
              as: StoreTerminal
            - call: "POST /kitchen-tickets/${tk}/start"
              payload: {}
              as: KitchenAssociate
              as_user_id: "assoc-1"
            - call: "POST /kitchen-tickets/${tk}/complete"
              payload: {}
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { tk_done: $.data.status }
            - call: "POST /kitchen-tickets/${tk}/reopen"
              payload: { reason: "CUSTOMER_ASKED_FOR_A_REMAKE" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { e_rework: $.data.error_id }
          assert:
            - "${e_empty} == ERR_ORDER_EMPTY"
            - "${e_settle} == ERR_ORDER_SETTLEMENT_STATE_INVALID"
            - "${ps} == PLACED"
            - "${e_pickup} == ERR_ORDER_PRODUCTION_STATE_INVALID"
            - "${e_ticket} == ERR_TICKET_STATE_INVALID"
            - "${tk_done} == DONE"
            - "${e_rework} == ERR_ORDER_NOT_REWORKABLE"
            - "Order.${order_x}.production_status == DRAFT"
            - "Order.${order_y}.production_status == READY"
            - "Order.${order_y}.settlement_status == AUTHORIZED"
            - "KitchenTicket.${tk}.rework_count == 0"
            - "Store.${store_id}.rework_waste_cents_mtd == 0"

      - name: production_rejections_cover_the_batch_and_unit_error_ids
        claim_type: error_triggerable
        grounds:
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=22]
          - validations[priority=24]
          - validations[priority=27]
          - validations[priority=39]
          - errors[ERR_ITEM_NOT_PAR_BAKED]
          - errors[ERR_SLOT_INDEX_OUT_OF_RANGE]
          - errors[ERR_INSUFFICIENT_BATCH_QTY]
          - errors[ERR_BATCH_HOLD_EXPIRED]
          - errors[ERR_DISCARD_QTY_EXCEEDS_REMAINING]
          - errors[ERR_TEMP_READING_OUT_OF_SENSOR_RANGE]
        distinguishing_aspect: |
          ERR_INSUFFICIENT_BATCH_QTY and ERR_BATCH_HOLD_EXPIRED are the pair most likely to be conflated:
          with NO batch at all the placement fails on supply (priority 39), but once a batch exists whose
          hold_expires_at is exactly the clock, the higher-priority safety rule 17 must answer instead. The
          same chain also proves slot_index is bounded by THIS unit's slot_count, that a batch cannot be
          planned for a made-to-order item, and that the sensor band is -40..250 F rather than the unit's
          135..185 F holding band.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 in its initial BREAKFAST daypart with a PUBLISHED BREAKFAST plan for 2026-08-01"
            - "unit BC-1 is a BAKERY_CASE banded 135..185 F with slot_count 3"
            - "pretzel PRETZEL-SOFT is PAR_BAKED_CASE with hold_minutes 240; coffee COFFEE-LG is MADE_TO_ORDER"
            - "orders O1 and O2 are DRAFT anonymous TOUCHSCREEN orders, each with a 5-unit pretzel line"
