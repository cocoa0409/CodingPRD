  - name: evaluation_ring_fence_nets_zero_across_loan_round_trips
    grounds:
    - calculations.evaluation_ring_fence
    - state_machines.EvaluationLoan.REQUESTED_to_APPROVED
    - state_machines.EvaluationLoan.ACTIVE_to_RETURNED
    - state_machines.EvaluationLoan.APPROVED_to_RECLAIMED
    distinguishing_aspect: 'The conserved quantity is AcceleratorProduct.reserved_evaluation_units:

      an approval-and-return round trip and an approval-and-reclaim round trip

      each net exactly zero, so the ring fence reads 1000 before every pair

      and 1000 again after it, with a 1050 excursion visible only mid-pair.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified; SKU AC-100-PCIE promoted to GENERAL_AVAILABILITY with a 1000-unit ring fence; two evaluation loans of 50 units requested.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
