            - "probe 4 (DIFFERENT component, start == claim1's END instant): HTTP 409 and ${err_touch} == ERR_REMEDIATION_CAPACITY_EXCEEDED - the windows are CLOSED and the aggregate test counts an instant shared by one window's end and another's start in BOTH windows, so depth reaches 2 at exactly 2026-09-03T00:00:00Z; a half-open aggregate implementation wrongly accepts, in direct contrast to the ClosingBatch adjacency probe which IS accepted at the shared instant"
            - "probe 5 (DIFFERENT component, clear of every occupied window): HTTP 200 with WarrantyClaim.${wc3_id}.status == REMEDIATION_SCHEDULED and WarrantyClaim.${wc3_id}.remediation_start_at == 2026-09-11T00:00:00Z - aggregate depth stays 1, and no cooldown applies across components because the 259200-second buffer is per-component only"
            - "end state: WarrantyClaim.${wc1_id}.remediation_start_at == 2026-09-01T00:00:00Z and WarrantyClaim.${wc1_id}.accrued_charge_cents == 4000000  # min(4000000, FOUNDATION cap round_half_up(10000000 * 6000 / 10000) == 6000000)"
            - "end state: WarrantyClaim.${wc2_id}.accrued_charge_cents == 1000000 and WarrantyClaim.${wc3_id}.accrued_charge_cents == 500000  # min(500000, ROOF cap round_half_up(4000000 * 6000 / 10000) == 2400000)"
            - "end state: every claim has reopen_count == 0 and status == REMEDIATION_SCHEDULED"
            - "end state: ConversionProject.${proj_id}.warranty_reserve_charge_cents == 5500000  # 4000000 + 1000000 + 500000"
            - "end state: ConversionProject.${proj_id}.max_overlapping_remediations == 1 and GET /conversion-projects/${proj_id}/warranty-claims returns exactly three claims, so no rejected probe left a partially written window"

  - rule_id: compensating_invariant
    instances:
      - name: escrow_cash_conserved_across_fund_then_rescind
        grounds:
          - calculations.escrow_and_obligation_conservation
          - state_machines.PurchaseAgreement.FUNDED_to_REFUNDED
          - entities.ConversionProject.fields.escrow_reconciliation_delta_cents
          - state_machines.PurchaseAgreement.SIGNED_to_RESCINDED
          - entities.PurchaseAgreement.fields.escrow_status
        distinguishing_aspect: |
          The conserved quantity is MONEY in cents: escrow_deposits_received_cents must always equal
          escrow_balance_cents + escrow_refunded_cents + escrow_disbursed_cents, so funding then
          rescinding moves 2400000 cents out of the balance bucket and into the refunded bucket
          without ever changing the received total, and the delta reads 0 after EVERY request.
          Cash is moved between buckets, unlike the sibling instance where a dimensionless 10000 bp
          share is redistributed and per-unit values must be restored byte-identically.
        test_recipe:
          setup:
            - "ConversionProject with DeclarationPackage RECORDED, InitialBudget ADOPTED,
               PublicOfferingStatement EFFECTIVE and one INCLUDED Unit K-1 at
               base_percentage_interest_bp 10000."
            - "One OWNER_OCCUPANT PurchaseAgreement on K-1 in contract_status SIGNED with
               deposit_cents 2400000, pos_delivered_at 2026-08-01T00:00:00Z and
               rescission_deadline_at 2026-08-16T00:00:00Z."
            - "Before any escrow movement the project reads escrow_deposits_received_cents 0,
               escrow_balance_cents 0, escrow_refunded_cents 0, escrow_disbursed_cents 0 and
               escrow_reconciliation_delta_cents 0."
            - "Logical clock rests at the startup default 2026-08-01T00:00:00Z, strictly before the
               rescission deadline, so the rescission is admissible."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "14 Keystone Court, Woburn MA", year_built: 1969, total_unit_count: 1, sponsor_user_id: "sponsor-1" }
