# =============================================================================
# SCAFFOLD.yaml — Reference Laboratory Send-Out Testing & Result Interfacing
# Task: task_3138_reference_laboratory_send_out_testing_result_interfacing
# §1.0 through §1.7 (+ preamble keys). §1.8 and §1.9 live in their sibling files.
# =============================================================================

scenario: |
  Reference Laboratory Send-Out Testing & Result Interfacing (ARUP Laboratories): test catalog with specimen requirements, stability windows and reflex testing rules published to client laboratories, client onboarding with courier logistics, requisition formats and interface build for orders and results, specimen receipt with accessioning, condition assessment and rejection criteria communicated to the client, esoteric and genetic test workflows with long turnaround times and interim status reporting, reflex and add-on ordering within stability limits after the initial result, result interfacing with discrete data, interpretive comments and critical value calling protocols, test utilization management advising clients on unnecessary or duplicative orders, billing routed to client, patient or payer by arrangement

domain_name: reference-lab-send-out-testing
api_prefix: /reference-lab

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: saga

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: ClientLaboratory
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the client laboratory or collection site" }
      - { name: clia_number, type: string, source: input, description: "CLIA certificate number; unique across non-deleted clients" }
      - { name: client_type, type: enum, source: input, description: "HOSPITAL | PHYSICIAN_OFFICE | REFERENCE_LAB | PATIENT_SERVICE_CENTER", constraints: "enum members exactly: HOSPITAL, PHYSICIAN_OFFICE, REFERENCE_LAB, PATIENT_SERVICE_CENTER" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the client's primary site" }
      - { name: billing_arrangement, type: enum, source: input, default: CLIENT, description: "CLIENT | PATIENT | PAYER — the party a send-out invoice is routed to by arrangement", constraints: "enum members exactly: CLIENT, PATIENT, PAYER" }
      - { name: credit_limit_cents, type: integer, source: input, default: 500000, description: "Maximum routed outstanding balance in cents before the posture flips to CREDIT_HOLD" }
      - { name: status, type: enum, source: system, description: "Posture gating all intake: PENDING_ONBOARDING | ACTIVE | CREDIT_HOLD | SUSPENDED | INACTIVE", constraints: "enum members exactly: PENDING_ONBOARDING, ACTIVE, CREDIT_HOLD, SUSPENDED, INACTIVE" }
      - { name: onboarding_status, type: enum, source: system, description: "DOCUMENTS_PENDING | REQUIREMENTS_PUBLISHED | COURIER_CONFIGURED | COMPLETE", constraints: "enum members exactly: DOCUMENTS_PENDING, REQUIREMENTS_PUBLISHED, COURIER_CONFIGURED, COMPLETE" }
      - { name: interface_status, type: enum, source: computed, description: "Derived on every write from the highest-status InterfaceBuild of this client: NOT_BUILT | IN_BUILD | CERTIFIED | RETIRED", constraints: "enum members exactly: NOT_BUILT, IN_BUILD, CERTIFIED, RETIRED" }
      - { name: requirement_notes_published_at, type: datetime, source: computed, description: "Instant the specimen requirement note was published to this client; null before" }
      - { name: outstanding_balance_cents, type: number, source: computed, description: "Sum of routed_amount_cents over this client's SendOutOrder rows in billing_status BILLED; recomputed on every ledger mutation" }
      - { name: billable_line_count, type: integer, source: computed, description: "Count of OrderTestLine rows reachable from this client whose line_status is in {INTERIM, FINAL}" }
      - { name: forward_utilization_score, type: number, source: computed, description: "Forward-looking utilization: count of reachable OrderTestLine rows in {PENDING, IN_PROGRESS, INTERIM, FINAL, REPEAT_REQUIRED} whose client_requested_at is inside the trailing 30 days" }
      - { name: settled_utilization_score, type: number, source: computed, description: "Chronological utilization: count of reachable OrderTestLine rows in {FINAL} whose result_released_at is non-null, at or before the logical clock, and inside the trailing 30 days" }
      - { name: utilization_flag, type: boolean, source: computed, description: "True when settled_utilization_score exceeds the trailing monthly band" }

  # ---------------------------------------------------------------------------
  - name: CourierRun
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: client_laboratory_id, type: string, source: input, description: "FK -> ClientLaboratory.id; the client this pickup leg collects from" }
      - { name: route_code, type: string, source: input, description: "Operator route identifier; legs sharing a route_code share the same vehicle" }
      - { name: origin_city, type: string, source: input, description: "City where the leg begins" }
      - { name: destination_city, type: string, source: input, description: "City where the leg ends" }
      - { name: vehicle_id, type: string, source: input, description: "Vehicle assigned to this leg; the overlap resource key" }
      - { name: scheduled_departure_at, type: datetime, source: input, description: "Planned departure instant of the vehicle (UTC)" }
      - { name: scheduled_arrival_at, type: datetime, source: input, description: "Planned arrival instant of the vehicle (UTC)" }
      - { name: scheduled_pickup_at, type: datetime, source: input, description: "Inclusive start of this leg's occupation of the vehicle" }
      - { name: scheduled_delivery_at, type: datetime, source: input, description: "Exclusive end of this leg's occupation of the vehicle" }
      - { name: temperature_control_mode, type: enum, source: input, description: "AMBIENT | REFRIGERATED | FROZEN | MIXED", constraints: "enum members exactly: AMBIENT, REFRIGERATED, FROZEN, MIXED" }
      - { name: specimen_count, type: integer, source: computed, description: "Count of Specimen rows whose courier_run_id is this leg" }
      - { name: transit_allowance_minutes, type: number, source: computed, description: "Chronological allowance = base transit minutes + per-leg increment for every leg created strictly earlier on the same route_code" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | IN_TRANSIT | COMPLETED | ABORTED", constraints: "enum members exactly: PLANNED, DISPATCHED, IN_TRANSIT, COMPLETED, ABORTED" }

  # ---------------------------------------------------------------------------
  - name: TestCatalogEntry
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - { name: test_code, type: string, source: input, description: "Published catalog test code; unique among entries whose status is not WITHDRAWN" }
      - { name: test_name, type: string, source: input, description: "Long-form test name printed on requisitions" }
      - { name: test_category, type: enum, source: input, description: "ROUTINE | ESOTERIC | GENETIC", constraints: "enum members exactly: ROUTINE, ESOTERIC, GENETIC" }
      - { name: method, type: string, source: input, description: "Analytical method, e.g. LC_MS_MS or SANGER_SEQUENCING" }
      - { name: required_specimen_type, type: enum, source: input, description: "WHOLE_BLOOD_EDTA | SERUM_SST | PLASMA_LITHIUM_HEPARIN | URINE_RANDOM | TISSUE_FRESH", constraints: "enum members exactly: WHOLE_BLOOD_EDTA, SERUM_SST, PLASMA_LITHIUM_HEPARIN, URINE_RANDOM, TISSUE_FRESH" }
      - { name: container_type, type: enum, source: input, description: "LAVENDER_TOP | GOLD_SST | GREEN_TOP | STERILE_CUP | PARAFFIN_BLOCK", constraints: "enum members exactly: LAVENDER_TOP, GOLD_SST, GREEN_TOP, STERILE_CUP, PARAFFIN_BLOCK" }
      - { name: min_volume_ml, type: number, source: input, description: "Minimum acceptable specimen volume in millilitres; the bound is inclusive" }
      - { name: transport_temperature, type: enum, source: input, description: "AMBIENT | REFRIGERATED | FROZEN — the only accepted transport condition", constraints: "enum members exactly: AMBIENT, REFRIGERATED, FROZEN" }
      - { name: stability_hours_ambient, type: number, source: input, description: "Specimen stability in hours when transported at AMBIENT" }
      - { name: stability_hours_refrigerated, type: number, source: input, description: "Specimen stability in hours when transported at REFRIGERATED" }
      - { name: stability_hours_frozen, type: number, source: input, description: "Specimen stability in hours when transported at FROZEN" }
      - { name: base_tat_hours, type: number, source: input, description: "Nominal turnaround time in hours before the rush-tier adjustment" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog list price per reportable test" }
      - { name: client_price_cents, type: integer, source: input, description: "Contracted client price per reportable test; null means the list price applies" }
      - { name: floor_price_cents, type: integer, source: input, description: "Hard floor applied after every discount in the volume-tier price rule" }
      - { name: reference_low, type: number, source: input, description: "Lower analytical reference limit, inclusive; null disables low-side flagging" }
      - { name: reference_high, type: number, source: input, description: "Upper analytical reference limit, inclusive; null disables high-side flagging" }
      - { name: critical_value_low, type: number, source: input, description: "Lower critical reporting limit, inclusive; null disables low-side critical calling" }
      - { name: critical_value_high, type: number, source: input, description: "Upper critical reporting limit, inclusive; null disables high-side critical calling" }
      - { name: reflex_test_code, type: string, source: input, description: "Test code automatically ordered when the reflex condition fires; null means no reflex" }
      - { name: reflex_condition, type: enum, source: input, description: "ALWAYS | RESULT_ABOVE_HIGH | RESULT_BELOW_LOW | NONE", constraints: "enum members exactly: ALWAYS, RESULT_ABOVE_HIGH, RESULT_BELOW_LOW, NONE" }
      - { name: reflex_within_hours, type: number, source: input, description: "Maximum elapsed hours from the triggering result release for a reflex order to be accepted; the bound is inclusive" }
      - { name: reflex_min_remaining_hours, type: number, source: input, description: "Minimum specimen remaining_stability_hours required at reflex or add-on time; the bound is strict" }
      - { name: is_utilization_managed, type: boolean, source: input, default: false, description: "When true, repeated ordering of this test for the same patient is guarded by the utilization advisory rule" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | DEPRECATED | WITHDRAWN", constraints: "enum members exactly: DRAFT, PUBLISHED, DEPRECATED, WITHDRAWN" }

  # ---------------------------------------------------------------------------
  - name: Specimen
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: client_laboratory_id, type: string, source: input, description: "FK -> ClientLaboratory.id; submitting client" }
      - { name: courier_run_id, type: string, source: input, description: "FK -> CourierRun.id; inbound pickup leg that carried this specimen" }
      - { name: aliquot_parent_id, type: string, source: input, description: "FK -> Specimen.id; null for a primary tube, set for a derived aliquot tube" }
      - { name: accession_number, type: string, source: input, description: "Laboratory accession number assigned at receipt; unique across specimens" }
      - { name: patient_mrn, type: string, source: input, description: "Submitting client's medical record number for the patient" }
      - { name: specimen_type, type: enum, source: input, description: "WHOLE_BLOOD_EDTA | SERUM_SST | PLASMA_LITHIUM_HEPARIN | URINE_RANDOM | TISSUE_FRESH", constraints: "enum members exactly: WHOLE_BLOOD_EDTA, SERUM_SST, PLASMA_LITHIUM_HEPARIN, URINE_RANDOM, TISSUE_FRESH" }
      - { name: container_type, type: enum, source: input, description: "Container the specimen arrives in", constraints: "enum members exactly: LAVENDER_TOP, GOLD_SST, GREEN_TOP, STERILE_CUP, PARAFFIN_BLOCK" }
      - { name: volume_ml, type: number, source: input, description: "Received volume in millilitres" }
      - { name: aliquot_volume_ml, type: number, source: input, description: "Volume captured in this tube when it is a derived aliquot; null for a primary tube" }
      - { name: collection_at, type: datetime, source: input, description: "Instant the specimen was collected at the client site" }
      - { name: received_at, type: datetime, source: input, description: "Instant the specimen was received into accessioning" }
      - { name: transport_temperature, type: enum, source: input, description: "AMBIENT | REFRIGERATED | FROZEN — observed transport condition on receipt", constraints: "enum members exactly: AMBIENT, REFRIGERATED, FROZEN" }
      - { name: condition, type: enum, source: system, description: "ACCEPTABLE | HEMOLYZED | CLOTTED | INSUFFICIENT_VOLUME | TEMPERATURE_EXCURSION", constraints: "enum members exactly: ACCEPTABLE, HEMOLYZED, CLOTTED, INSUFFICIENT_VOLUME, TEMPERATURE_EXCURSION" }
      - { name: condition_reason_code, type: string, source: input, description: "Operator reason recorded with a non-acceptable condition; null when condition is ACCEPTABLE" }
      - { name: rejection_reason_code, type: string, source: input, description: "Reason code recorded when the specimen is rejected; null otherwise" }
      - { name: remaining_stability_hours, type: number, source: computed, description: "Binding_window_hours minus elapsed hours at the logical clock; derived on every read, never stored, never clamped (may be negative)" }
      - { name: total_aliquot_volume_ml, type: number, source: computed, description: "Sum of aliquot_volume_ml over every Specimen whose aliquot_parent_id is this specimen" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ACCESSIONED | IN_TESTING | RESULT_PENDING_REVIEW | RELEASED | REJECTED", constraints: "enum members exactly: RECEIVED, ACCESSIONED, IN_TESTING, RESULT_PENDING_REVIEW, RELEASED, REJECTED" }

  # ---------------------------------------------------------------------------
  - name: SendOutOrder
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: client_laboratory_id, type: string, source: input, description: "FK -> ClientLaboratory.id; the client that requisitioned the send-out" }
      - { name: specimen_id, type: string, source: input, description: "FK -> Specimen.id; the specimen the ordered tests run against" }
      - { name: reflex_source_order_id, type: string, source: input, description: "FK -> SendOutOrder.id; the order whose released result triggered this reflex order, null otherwise" }
      - { name: order_number, type: string, source: input, description: "Client-supplied requisition number" }
      - { name: patient_mrn, type: string, source: input, description: "Patient medical record number the requisition carries" }
      - { name: client_requested_at, type: datetime, source: input, description: "Instant the client requested the send-out; drives rush-tier selection and the utilization window" }
      - { name: priority, type: enum, source: input, description: "ROUTINE | STAT | TIMED", constraints: "enum members exactly: ROUTINE, STAT, TIMED" }
      - { name: rush_tier, type: enum, source: computed, description: "STANDARD | RUSH | CRITICAL — derived once from the pinned evaluation order of rush_priority_surcharge", constraints: "enum members exactly: STANDARD, RUSH, CRITICAL" }
      - { name: base_tat_hours, type: number, source: computed, description: "Maximum base_tat_hours over the order's live OrderTestLine catalog entries" }
      - { name: effective_tat_hours, type: number, source: computed, description: "base_tat_hours scaled by the tier factor of the computed rush_tier" }
      - { name: expected_result_at, type: datetime, source: computed, description: "Pinned as specimen.received_at plus effective_tat_hours; recomputed exactly once after rush_tier settles" }
      - { name: stability_deadline_at, type: datetime, source: computed, description: "received_at plus the minimum remaining stability across the order's live test lines" }
      - { name: provisional_charge_cents, type: number, source: computed, description: "Provisional amount estimated at accession from catalog list prices (variant provisional)" }
      - { name: order_final_charge_cents, type: number, source: computed, description: "Final amount priced from contracted client prices, volume tier, add-ons and rush surcharge at release (variant final)" }
      - { name: charge_variance_cents, type: number, source: computed, description: "order_final_charge_cents minus provisional_charge_cents; the dual-variant delta" }
      - { name: tat_credit_cents, type: number, source: computed, description: "Late-turnaround credit, computed per line and then summed (pinned rounding order)" }
      - { name: interpretive_comment, type: string, source: input, description: "Pathologist interpretive comment carried on the result interface message; null until release" }
      - { name: override_utilization_guard, type: boolean, source: input, default: false, description: "When true, a duplicate-order advisory is recorded instead of rejecting the submission" }
      - { name: order_status, type: enum, source: system, description: "Parallel dimension A: SUBMITTED | ACCESSIONED | IN_TESTING | INTERIM_REPORTED | RESULT_RELEASED | REFLEX_PENDING | ON_HOLD | CLOSED | CANCELLED", constraints: "enum members exactly: SUBMITTED, ACCESSIONED, IN_TESTING, INTERIM_REPORTED, RESULT_RELEASED, REFLEX_PENDING, ON_HOLD, CLOSED, CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "Parallel dimension B, evolves independently: UNBILLED | PROVISIONAL | BILLED | VOIDED", constraints: "enum members exactly: UNBILLED, PROVISIONAL, BILLED, VOIDED" }

  # ---------------------------------------------------------------------------
  - name: OrderTestLine
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: send_out_order_id, type: string, source: input, description: "FK -> SendOutOrder.id; owning order" }
      - { name: test_catalog_entry_id, type: string, source: input, description: "FK -> TestCatalogEntry.id; ordered test" }
      - { name: line_sequence, type: integer, source: input, description: "Ordering within the requisition; unique per order, and the pinned traversal key for turnaround_credit_per_line" }
      - { name: is_add_on, type: boolean, source: input, default: false, description: "True when the line was appended after the initial requisition" }
      - { name: add_on_at, type: datetime, source: input, description: "Instant the add-on or reflex line was appended; null for requisition lines" }
      - { name: result_value, type: number, source: input, description: "Discrete numeric result entered by the technologist; null until entered" }
      - { name: result_units, type: string, source: input, description: "Units accompanying result_value" }
      - { name: result_flag, type: enum, source: computed, description: "NORMAL | HIGH | LOW | CRITICAL_HIGH | CRITICAL_LOW, derived on read in this pinned order: CRITICAL_LOW when critical_value_low is non-null and result_value < critical_value_low; else CRITICAL_HIGH when critical_value_high is non-null and result_value > critical_value_high; else LOW when reference_low is non-null and result_value < reference_low; else HIGH when reference_high is non-null and result_value > reference_high; else NORMAL. A null limit never fires its step.", constraints: "enum members exactly: NORMAL, HIGH, LOW, CRITICAL_HIGH, CRITICAL_LOW" }
      - { name: critical_value_notified_to, type: string, source: input, description: "Named recipient of the critical value call; required when result_flag is CRITICAL_HIGH or CRITICAL_LOW" }
      - { name: critical_value_notified_at, type: datetime, source: input, description: "Instant the critical value call was documented" }
      - { name: entered_by_user_id, type: string, source: system, description: "X-User-ID that entered the result; a Pathologist releasing results must differ from this value" }
      - { name: billed_cents, type: number, source: computed, description: "Line charge after the volume-tier price rule and the contracted client price" }
      - { name: tat_credit_cents, type: number, source: computed, description: "Per-line late credit, rounded to 2 decimals at line level before summation" }
      - { name: result_released_at, type: datetime, source: computed, description: "Instant the owning order released results; null before release" }
      - { name: line_status, type: enum, source: system, description: "PENDING | IN_PROGRESS | INTERIM | FINAL | REPEAT_REQUIRED | CANCELLED", constraints: "enum members exactly: PENDING, IN_PROGRESS, INTERIM, FINAL, REPEAT_REQUIRED, CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: InstrumentRun
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: test_catalog_entry_id, type: string, source: input, description: "FK -> TestCatalogEntry.id; the assay this run performs" }
      - { name: instrument_code, type: string, source: input, description: "Analyzer identifier; the overlap resource key together with section" }
      - { name: section, type: string, source: input, description: "Laboratory section that owns the analyzer" }
      - { name: decontamination_buffer_minutes, type: integer, source: input, description: "Mandatory buffer minutes that must separate closed runs on this analyzer" }
      - { name: reserved_start_at, type: datetime, source: input, description: "Inclusive start of the booked run (closed-interval start)" }
      - { name: reserved_end_at, type: datetime, source: input, description: "Inclusive end of the booked run (closed-interval end)" }
      - { name: occupied_until_at, type: datetime, source: computed, description: "reserved_end_at plus decontamination_buffer_minutes; the exclusive boundary the next run must clear" }
      - { name: run_status, type: enum, source: system, description: "RESERVED | RUNNING | COMPLETED | ABORTED", constraints: "enum members exactly: RESERVED, RUNNING, COMPLETED, ABORTED" }

  # ---------------------------------------------------------------------------
  - name: InterfaceBuild
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: client_laboratory_id, type: string, source: input, description: "FK -> ClientLaboratory.id; the client this interface build serves" }
      - { name: build_version_label, type: string, source: input, description: "Operator label for the build revision" }
      - { name: format, type: enum, source: input, description: "HL7_V2_5_1 | HL7_V2_8 | CSV_FLAT_FILE | API_JSON", constraints: "enum members exactly: HL7_V2_5_1, HL7_V2_8, CSV_FLAT_FILE, API_JSON" }
      - { name: order_interface_enabled, type: boolean, source: input, default: false, description: "Whether the build carries inbound requisition orders" }
      - { name: result_interface_enabled, type: boolean, source: input, default: false, description: "Whether the build carries outbound discrete results" }
      - { name: certified_at, type: datetime, source: computed, description: "Instant this build passed certification; null before" }
      - { name: superseded_at, type: datetime, source: computed, description: "Instant a newer build for the same client superseded this one; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_BUILD | CERTIFIED | SUPERSEDED | RETIRED", constraints: "enum members exactly: DRAFT, IN_BUILD, CERTIFIED, SUPERSEDED, RETIRED" }

  # ---------------------------------------------------------------------------
  - name: ResultInterfaceMessage
    parent: null
    common_fields: true
    kind: event
    fields:
      - { name: send_out_order_id, type: string, source: input, description: "FK -> SendOutOrder.id; order whose payload the message carries" }
      - { name: interface_build_id, type: string, source: input, description: "FK -> InterfaceBuild.id; the certified build that renders the payload" }
      - { name: message_type, type: enum, source: input, description: "ORDER | RESULT | INTERIM", constraints: "enum members exactly: ORDER, RESULT, INTERIM" }
      - { name: control_id, type: string, source: input, description: "Interface control id used by the client to de-duplicate messages; unique per client" }
      - { name: interpreted_comment_included, type: boolean, source: computed, description: "True when the owning order carried a non-null interpretive_comment at queue time" }
      - { name: discrete_field_count, type: integer, source: computed, description: "Number of discrete result fields rendered into the payload" }
      - { name: queued_at, type: datetime, source: computed, description: "Instant the message was placed on the outbound queue" }
      - { name: transmitted_at, type: datetime, source: computed, description: "Instant the message was successfully transmitted; null before" }
      - { name: retry_count, type: integer, source: computed, default: 0, description: "Number of failed transmission attempts so far; resets only on TRANSMITTED" }
      - { name: next_retry_offset_minutes, type: number, source: computed, description: "min(BASE * 2^retry_count, CAP) minutes, capped" }
      - { name: status, type: enum, source: system, description: "QUEUED | VALIDATED | HELD | TRANSMITTED | FAILED | ACKNOWLEDGED", constraints: "enum members exactly: QUEUED, VALIDATED, HELD, TRANSMITTED, FAILED, ACKNOWLEDGED" }

  # ---------------------------------------------------------------------------
  - name: BillingLedger
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: client_laboratory_id, type: string, source: input, description: "FK -> ClientLaboratory.id; the client whose charges this ledger accumulates" }
      - { name: billed_cents, type: number, source: computed, description: "Running sum of posted charge amounts in cents" }
      - { name: voided_cents, type: number, source: computed, description: "Running sum of voided charge amounts in cents" }
      - { name: net_billed_cents, type: number, source: computed, description: "billed_cents minus voided_cents; the conserved quantity a post/void pair must leave unchanged" }
      - { name: charge_entry_count, type: integer, source: computed, description: "Number of posted-charge events applied; never decremented by a void" }
      - { name: status, type: enum, source: system, description: "OPEN | HELD | CLOSED", constraints: "enum members exactly: OPEN, HELD, CLOSED" }

  # ---------------------------------------------------------------------------
  - name: UtilizationAdvisory
    parent: null
    common_fields: true
    kind: resource
    fields:
      - { name: client_laboratory_id, type: string, source: input, description: "FK -> ClientLaboratory.id; client being advised" }
      - { name: test_catalog_entry_id, type: string, source: input, description: "FK -> TestCatalogEntry.id; test the advisory concerns" }
      - { name: source_order_id, type: string, source: input, description: "FK -> SendOutOrder.id; the order that provoked the advisory, null for manually raised advisories" }
      - { name: advisory_type, type: enum, source: input, description: "DUPLICATE_ORDER | UNNECESSARY_FREQUENCY | REFLEX_REDUNDANT", constraints: "enum members exactly: DUPLICATE_ORDER, UNNECESSARY_FREQUENCY, REFLEX_REDUNDANT" }
      - { name: message, type: string, source: input, description: "Advisory text delivered to the client" }
      - { name: send_count, type: integer, source: computed, default: 0, description: "Number of times this advisory has been sent or re-sent" }
      - { name: status, type: enum, source: system, description: "OPEN | SENT | ACKNOWLEDGED | DISMISSED | ESCALATED", constraints: "enum members exactly: OPEN, SENT, ACKNOWLEDGED, DISMISSED, ESCALATED" }# =============================================================================
# §1.0 Response Envelope (FIXED - EMIT VERBATIM)
# =============================================================================

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
# =============================================================================
# §1.2 State Machine Table + §1.2.1 Concurrency Rules
#
# Note on declaration style: where one entity carries TWO state dimensions, this
# table declares one state_machine block per dimension and each block re-declares
# the shared waypoint states redundantly (once per block) so that every
# transition's `from:` resolves to exactly one state name declared anywhere in the
# file. That redundancy is what makes the lint walker's two-pass check succeed.
# =============================================================================

state_machines:

  # ---------------------------------------------------------------------------
  - entity: ClientLaboratory
    initial_state: PENDING_ONBOARDING
    terminal_states: [INACTIVE]
    shape: posture_driven_with_revert_cycles
    transitions:
      - from: PENDING_ONBOARDING
        to: ACTIVE
        trigger: POST /client-laboratories/{id}/activate
        actor: LabClientAdmin
        preconditions:
          - "client_laboratory.status == PENDING_ONBOARDING"
          - "client_laboratory.onboarding_status == COMPLETE"
          - "client_laboratory.interface_status == CERTIFIED, meaning at least one InterfaceBuild of this client_laboratory_id is in status CERTIFIED"
          - "at least one CourierRun exists with CourierRun.client_laboratory_id == client_laboratory.id"
          - "client_laboratory.outstanding_balance_cents <= client_laboratory.credit_limit_cents"
        side_effects:
          - "client_laboratory.status -> ACTIVE"
          - "recompute client_laboratory.interface_status from the highest-status InterfaceBuild of this client_laboratory_id"
          - "recompute client_laboratory.outstanding_balance_cents from the client's SendOutOrder rows in billing_status BILLED"
          - "recompute client_laboratory.billable_line_count over the reachable OrderTestLine rows"
          - "client_laboratory.version incremented by 1"
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system event: a BillingLedger mutation or order charge leaves the client's routed outstanding_balance_cents above credit_limit_cents"
        actor: system
        preconditions:
          - "client_laboratory.status == ACTIVE"
          - "recomputed outstanding_balance_cents > credit_limit_cents"
        side_effects:
          - "client_laboratory.status -> CREDIT_HOLD"
          - "every SendOutOrder whose SendOutOrder.client_laboratory_id == client_laboratory.id and whose order_status == SUBMITTED transitions to ON_HOLD (this is cascade hop 5 of the catalog-withdrawal chain, and hop 4 of the reflex chain)"
          - "client_laboratory.version incremented by 1"
        note: "Only orders in SUBMITTED are held; an order already ACCESSIONED or later keeps running, because the posture governs new intake rather than in-flight work."
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: POST /client-laboratories/{id}/settle-balance
        actor: LabBillingSpecialist
        preconditions:
          - "client_laboratory.status == CREDIT_HOLD"
          - "client_laboratory.outstanding_balance_cents <= client_laboratory.credit_limit_cents after the settlement amount is applied to the ledger"
        side_effects:
          - "client_laboratory.status -> ACTIVE"
          - "billing_ledger.voided_cents increased by the settlement amount; billing_ledger.net_billed_cents recomputed as billed_cents minus voided_cents"
          - "client_laboratory.outstanding_balance_cents recomputed"
          - "client_laboratory.version incremented by 1"
        note: "Revert leg. Because the posture is a pure function of outstanding_balance_cents against credit_limit_cents, settlement flips CREDIT_HOLD back to ACTIVE and a fresh charge can flip it forward again with no new client record."
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /client-laboratories/{id}/suspend
        actor: ReferenceLabOperations
        preconditions:
          - "client_laboratory.status == ACTIVE"
        side_effects:
          - "client_laboratory.status -> SUSPENDED"
          - "every CourierRun whose CourierRun.client_laboratory_id == client_laboratory.id and whose status == PLANNED transitions to ABORTED (cascade hop 1 of the suspension chain)"
          - "client_laboratory.version incremented by 1"
      - from: CREDIT_HOLD
        to: SUSPENDED
        trigger: POST /client-laboratories/{id}/suspend
        actor: ReferenceLabOperations
        preconditions:
          - "client_laboratory.status == CREDIT_HOLD"
        side_effects:
          - "client_laboratory.status -> SUSPENDED"
          - "every CourierRun whose CourierRun.client_laboratory_id == client_laboratory.id and whose status == PLANNED transitions to ABORTED"
          - "client_laboratory.version incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /client-laboratories/{id}/reinstate
        actor: LabClientAdmin
        preconditions:
          - "client_laboratory.status == SUSPENDED"
          - "client_laboratory.interface_status == CERTIFIED"
          - "client_laboratory.outstanding_balance_cents <= client_laboratory.credit_limit_cents"
        side_effects:
          - "client_laboratory.status -> ACTIVE"
          - "client_laboratory.version incremented by 1"
      - from: SUSPENDED
        to: INACTIVE
        trigger: POST /client-laboratories/{id}/deactivate
        actor: ReferenceLabOperations
        preconditions:
          - "client_laboratory.status == SUSPENDED"
          - "no SendOutOrder whose SendOutOrder.client_laboratory_id == client_laboratory.id has order_status in {SUBMITTED, ACCESSIONED, IN_TESTING, INTERIM_REPORTED, REFLEX_PENDING, ON_HOLD}"
        side_effects:
          - "client_laboratory.status -> INACTIVE"
          - "client_laboratory.version incremented by 1"

  # ---------------------------------------------------------------------------
  - entity: CourierRun
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    shape: linear_with_recall_cycle_and_abort_branch
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: POST /courier-runs/{id}/dispatch
        actor: CourierCoordinator
        preconditions:
          - "courier_run.status == PLANNED"
          - "courier_run.scheduled_departure_at <= the logical clock"
          - "the owning ClientLaboratory.status in {ACTIVE, CREDIT_HOLD}"
        side_effects:
          - "courier_run.status -> DISPATCHED"
          - "courier_run.version incremented by 1"
      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "system event: the logical clock reaches courier_run.scheduled_departure_at"
        actor: system
        preconditions:
          - "courier_run.status == DISPATCHED"
        side_effects:
          - "courier_run.status -> IN_TRANSIT"
          - "courier_run.version incremented by 1"
      - from: DISPATCHED
        to: PLANNED
        trigger: POST /courier-runs/{id}/recall
        actor: CourierCoordinator
        preconditions:
          - "courier_run.status == DISPATCHED"
          - "courier_run.scheduled_pickup_at > the logical clock"
        side_effects:
          - "courier_run.status -> PLANNED"
          - "courier_run.version incremented by 1"
        note: "Revert leg of the recall cycle: a leg dispatched in error returns to PLANNED as long as the vehicle has not physically left."
      - from: IN_TRANSIT
        to: COMPLETED
        trigger: POST /courier-runs/{id}/arrive
        actor: AccessioningTechnologist
        preconditions:
          - "courier_run.status == IN_TRANSIT"
          - "courier_run.scheduled_delivery_at <= the logical clock"
        side_effects:
          - "courier_run.status -> COMPLETED"
          - "recompute courier_run.specimen_count as the count of Specimen rows whose Specimen.courier_run_id == courier_run.id"
          - "courier_run.version incremented by 1"
      - from: PLANNED
        to: ABORTED
        trigger: "system event: ClientLaboratory ACTIVE or CREDIT_HOLD -> SUSPENDED (cascade hop 2)"
        actor: system
        preconditions:
          - "courier_run.status == PLANNED"
          - "courier_run.client_laboratory_id is the client_laboratory whose status just became SUSPENDED"
        side_effects:
          - "courier_run.status -> ABORTED"
          - "courier_run.version incremented by 1"

  # ---------------------------------------------------------------------------
  - entity: TestCatalogEntry
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    shape: branching_with_republish_cycle
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /test-catalog-entries/{id}/publish
        actor: LabClientAdmin
        preconditions:
          - "test_catalog_entry.status == DRAFT"
          - "no other TestCatalogEntry with the same test_code has status not equal to WITHDRAWN"
          - "test_catalog_entry.reflex_condition != NONE implies reflex_test_code names an existing TestCatalogEntry whose status == PUBLISHED"
        side_effects:
          - "test_catalog_entry.status -> PUBLISHED"
          - "test_catalog_entry.updated_at stamped from the logical clock, which is what makes every previously certified order-carrying InterfaceBuild of every client stale for catalog_publication_currency"
          - "test_catalog_entry.version incremented by 1"
      - from: PUBLISHED
        to: DEPRECATED
        trigger: POST /test-catalog-entries/{id}/deprecate
        actor: LabClientAdmin
        preconditions:
          - "test_catalog_entry.status == PUBLISHED"
        side_effects:
          - "test_catalog_entry.status -> DEPRECATED"
          - "test_catalog_entry.version incremented by 1"
      - from: DEPRECATED
        to: PUBLISHED
        trigger: POST /test-catalog-entries/{id}/publish
        actor: LabClientAdmin
        preconditions:
          - "test_catalog_entry.status == DEPRECATED"
          - "test_catalog_entry.reflex_condition != NONE implies reflex_test_code names an existing TestCatalogEntry whose status == PUBLISHED"
        side_effects:
          - "test_catalog_entry.status -> PUBLISHED"
          - "test_catalog_entry.updated_at stamped from the logical clock"
          - "test_catalog_entry.version incremented by 1"
        note: "Revert leg of the republish cycle: a deprecated test is brought back without recapturing its requirement fields."
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: POST /test-catalog-entries/{id}/withdraw
        actor: ReferenceLabOperations
        preconditions:
          - "test_catalog_entry.status == PUBLISHED"
          - "no OrderTestLine for this test_catalog_entry_id has line_status in {PENDING, IN_PROGRESS, INTERIM}"
        side_effects:
          - "test_catalog_entry.status -> WITHDRAWN"
          - "CASCADE HOP 1: for every Specimen that is the specimen_id of a SendOutOrder carrying at least one OrderTestLine for this test and whose status in {RECEIVED, ACCESSIONED, IN_TESTING}: specimen.status -> REJECTED, specimen.rejection_reason_code -> \"TEST_WITHDRAWN\", specimen.condition left unchanged"
          - "CASCADE HOP 2: for every SendOutOrder carrying such a rejected Specimen and whose order_status in {SUBMITTED, ACCESSIONED, IN_TESTING, INTERIM_REPORTED}: order_status -> CANCELLED"
          - "CASCADE HOP 3: for every such SendOutOrder cancelled at hop 2, every OrderTestLine whose line_status is not CANCELLED transitions to CANCELLED"
          - "CASCADE HOP 4: for every line cancelled at hop 3 with billed_cents > 0, send_out_order.billing_status -> VOIDED and billing_ledger.voided_cents += sum of those billed_cents; billing_ledger.net_billed_cents recomputed"
          - "CASCADE HOP 5: client_laboratory.outstanding_balance_cents and client_laboratory.billable_line_count recomputed; a void only ever lowers the routed balance, so the client does NOT enter CREDIT_HOLD from this chain, and every SendOutOrder of the client still in SUBMITTED remains SUBMITTED"
          - "test_catalog_entry.version incremented by 1"
      - from: DEPRECATED
        to: WITHDRAWN
        trigger: POST /test-catalog-entries/{id}/withdraw
        actor: ReferenceLabOperations
        preconditions:
          - "test_catalog_entry.status == DEPRECATED"
          - "no OrderTestLine for this test_catalog_entry_id has line_status in {PENDING, IN_PROGRESS, INTERIM}"
        side_effects:
          - "test_catalog_entry.status -> WITHDRAWN"
          - "identical five-hop cascade to the PUBLISHED -> WITHDRAWN transition: TestCatalogEntry -> Specimen -> SendOutOrder -> OrderTestLine -> BillingLedger -> ClientLaboratory"
          - "test_catalog_entry.version incremented by 1"

  # ---------------------------------------------------------------------------
  # Dimension 1 of Specimen: the receipt lifecycle. Waypoints R_<STATE> are the
  # canonical names for this dimension; the aliquot dimension below re-declares
  # A_RECEIVED / A_ACCESSIONED / R_REJECTED for its own transitions.
  - entity: Specimen
    initial_state: R_RECEIVED
    terminal_states: [R_RELEASED, R_REJECTED]
    shape: branching_with_rejection_exits
    transitions:
      - from: R_RECEIVED
        to: R_ACCESSIONED
        trigger: POST /specimens/{id}/accession
        actor: AccessioningTechnologist
        preconditions:
          - "specimen.status == RECEIVED"
          - "specimen.condition == ACCEPTABLE"
          - "specimen.remaining_stability_hours > 0, which is the strict stability bound of validation priority 11"
          - "specimen.volume_ml >= the maximum min_volume_ml over every TestCatalogEntry ordered against it, with the bound inclusive"
        side_effects:
          - "specimen.status -> ACCESSIONED"
          - "the SendOutOrder whose SendOutOrder.specimen_id == specimen.id and whose order_status == SUBMITTED transitions to ACCESSIONED (bubble up)"
          - "specimen.version incremented by 1"
      - from: R_ACCESSIONED
        to: R_IN_TESTING
        trigger: POST /specimens/{id}/begin-testing
        actor: MedicalTechnologist
        preconditions:
          - "specimen.status == ACCESSIONED"
          - "specimen.remaining_stability_hours > 0"
          - "exactly one InstrumentRun whose section equals the section of the specimen's first pending OrderTestLine has run_status == RUNNING and a reserved window covering the logical clock"
        side_effects:
          - "specimen.status -> IN_TESTING"
          - "every OrderTestLine of the owning SendOutOrder whose line_status == PENDING transitions to IN_PROGRESS"
          - "the owning SendOutOrder with order_status == ACCESSIONED transitions to IN_TESTING"
          - "specimen.version incremented by 1"
      - from: R_RECEIVED
        to: R_REJECTED
        trigger: POST /specimens/{id}/reject
        actor: AccessioningTechnologist
        preconditions:
          - "specimen.status == RECEIVED"
          - "specimen.condition != ACCEPTABLE implies specimen.condition_reason_code is not null"
          - "specimen.rejection_reason_code is not null"
        side_effects:
          - "specimen.status -> REJECTED"
          - "the owning SendOutOrder with order_status in {SUBMITTED, ACCESSIONED} transitions to CANCELLED"
          - "every OrderTestLine of that order whose line_status is not CANCELLED transitions to CANCELLED"
          - "the rejection reason is published back to the client as a UtilizationAdvisory with advisory_type DUPLICATE_ORDER only when the same patient_mrn was submitted twice in the trailing 24 hours; otherwise no advisory is raised"
          - "specimen.version incremented by 1"
      - from: R_ACCESSIONED
        to: R_REJECTED
        trigger: POST /specimens/{id}/reject
        actor: AccessioningTechnologist
        preconditions:
          - "specimen.status == ACCESSIONED"
          - "specimen.condition != ACCEPTABLE implies specimen.condition_reason_code is not null"
          - "specimen.rejection_reason_code is not null"
        side_effects:
          - "specimen.status -> REJECTED"
          - "the owning SendOutOrder with order_status == ACCESSIONED transitions to CANCELLED"
          - "every OrderTestLine of that order transitions to CANCELLED"
          - "specimen.version incremented by 1"
      - from: R_IN_TESTING
        to: R_RESULT_PENDING_REVIEW
        trigger: POST /send-out-orders/{id}/enter-results
        actor: MedicalTechnologist
        preconditions:
          - "specimen.status == IN_TESTING"
          - "every OrderTestLine of the owning order has result_value set"
        side_effects:
          - "specimen.status -> RESULT_PENDING_REVIEW"
          - "specimen.version incremented by 1"
      - from: R_RESULT_PENDING_REVIEW
        to: R_RELEASED
        trigger: POST /result-interface-messages/{id}/transmit
        actor: InterfaceAnalyst
        preconditions:
          - "specimen.status == RESULT_PENDING_REVIEW"
          - "the transmitted ResultInterfaceMessage carries message_type == RESULT for the owning SendOutOrder"
        side_effects:
          - "specimen.status -> RELEASED"
          - "specimen.version incremented by 1"

  # ---------------------------------------------------------------------------
  # Dimension 2 of Specimen: the aliquot-derivation lifecycle. The aliquot child
  # row is driven through the receipt states by its parent, so the child's
  # initial_state is A_RECEIVED.
  - entity: Specimen
    initial_state: A_RECEIVED
    terminal_states: [R_REJECTED]
    shape: derivation_lifecycle_on_aliquot_rows
    transitions:
      - from: A_RECEIVED
        to: A_ACCESSIONED
        trigger: POST /specimens/{id}/aliquots then POST /specimens/{aliquot_id}/accession on the child row
        actor: AccessioningTechnologist
        preconditions:
          - "the child Specimen.aliquot_parent_id references a parent Specimen whose status in {RECEIVED, ACCESSIONED, IN_TESTING}"
          - "child.aliquot_volume_ml > 0"
          - "child.volume_ml >= child.aliquot_volume_ml"
        side_effects:
          - "child Specimen.status -> ACCESSIONED"
          - "child Specimen.condition inherited from the parent Specimen.condition"
          - "child Specimen.transport_temperature inherited from the parent Specimen.transport_temperature"
          - "parent Specimen.total_aliquot_volume_ml recomputed as the sum of aliquot_volume_ml over all children (cascade hop 1)"
          - "if parent Specimen.total_aliquot_volume_ml > parent Specimen.volume_ml then the parent Specimen transitions to REJECTED with condition INSUFFICIENT_VOLUME, condition_reason_code ALIQUOT_OVERDRAW and the reported error ERR_ALIQUOT_OVERDRAW (cascade hop 2)"
          - "child Specimen.version incremented by 1; parent Specimen.version incremented by 1 when the overdraw rejection fires"
        note: "The workflow engine reacts to child specimen creation by re-deriving every derived field on the parent, which is why a single Specimen row carries both a receipt lifecycle and an aliquot-derivation lifecycle."
      - from: R_REJECTED
        to: R_ACCESSIONED
        trigger: POST /specimens/{id}/accession
        actor: AccessioningTechnologist
        preconditions:
          - "specimen.rejection_reason_code == \"TEST_WITHDRAWN\", meaning the rejection came from the catalog-withdrawal cascade rather than from a specimen condition failure"
          - "the specimen.condition == ACCEPTABLE"
          - "specimen.remaining_stability_hours > 0"
        side_effects:
          - "specimen.status -> ACCESSIONED"
          - "specimen.rejection_reason_code -> null"
          - "specimen.version incremented by 1"
        note: "Redo leg: a withdrawal-cascaded rejection is reversible when the test is republished within stability. A condition-caused rejection is not, because its condition is no longer ACCEPTABLE."

  # ---------------------------------------------------------------------------
  # Dimension 1 of SendOutOrder: order_status. Waypoints S_<STATE> are the
  # canonical names; the billing dimension below re-declares S_PROVISIONAL,
  # S_BILLED and S_VOIDED for its own transitions.
  - entity: SendOutOrder
    initial_state: S_SUBMITTED
    terminal_states: [S_CLOSED, S_CANCELLED]
    shape: cyclic_with_hold_and_reflex_loops
    transitions:
      - from: S_SUBMITTED
        to: S_ACCESSIONED
        trigger: POST /send-out-orders/{id}/accession
        actor: AccessioningTechnologist
        preconditions:
          - "send_out_order.order_status == SUBMITTED"
          - "send_out_order.specimen_id references a Specimen whose status == ACCESSIONED"
          - "the owning ClientLaboratory.status == ACTIVE"
          - "catalog_currency_ok == true for every ordered TestCatalogEntry"
        side_effects:
          - "send_out_order.order_status -> ACCESSIONED"
          - "send_out_order.billing_status -> PROVISIONAL"
          - "compute send_out_order.provisional_charge_cents with the provisional variant of order_price_reconciliation"
          - "send_out_order.version incremented by 1"
      - from: S_ACCESSIONED
        to: S_IN_TESTING
        trigger: POST /specimens/{id}/begin-testing
        actor: system
        preconditions:
          - "send_out_order.order_status == ACCESSIONED"
          - "the order's specimen transitioned to IN_TESTING"
        side_effects:
          - "send_out_order.order_status -> IN_TESTING"
          - "compute send_out_order.rush_tier, then effective_tat_hours, then expected_result_at, exactly once and in that pinned order"
          - "send_out_order.version incremented by 1"
      - from: S_IN_TESTING
        to: S_INTERIM_REPORTED
        trigger: POST /result-interface-messages with message_type == INTERIM
        actor: MedicalTechnologist
        preconditions:
          - "send_out_order.order_status == IN_TESTING"
          - "the interface_build_id references an InterfaceBuild whose status == CERTIFIED and whose result_interface_enabled == true"
          - "that InterfaceBuild.client_laboratory_id equals send_out_order.client_laboratory_id"
        side_effects:
          - "send_out_order.order_status -> INTERIM_REPORTED"
          - "every OrderTestLine of this order whose line_status == IN_PROGRESS transitions to INTERIM"
          - "result_interface_message.status -> VALIDATED and result_interface_message.queued_at stamped from the logical clock"
          - "send_out_order.version incremented by 1"
      - from: S_INTERIM_REPORTED
        to: S_RESULT_RELEASED
        trigger: POST /send-out-orders/{id}/release-results
        actor: Pathologist
        preconditions:
          - "send_out_order.order_status in {IN_TESTING, INTERIM_REPORTED}"
          - "every OrderTestLine of this order has result_value set"
          - "the releasing Pathologist X-User-ID differs from every OrderTestLine.entered_by_user_id on this order"
          - "for every OrderTestLine whose computed result_flag is CRITICAL_HIGH or CRITICAL_LOW, that line's critical_value_notified_to and critical_value_notified_at are both set"
        side_effects:
          - "send_out_order.order_status -> RESULT_RELEASED"
          - "every OrderTestLine of this order transitions to FINAL and its result_released_at is stamped from the logical clock"
          - "compute OrderTestLine.billed_cents per line with volume_tier_price"
          - "compute OrderTestLine.tat_credit_cents per line with turnaround_credit_per_line, then sum into send_out_order.tat_credit_cents"
          - "compute send_out_order.order_final_charge_cents and send_out_order.charge_variance_cents with the final variant of order_price_reconciliation"
          - "send_out_order.billing_status -> BILLED; billing_ledger.billed_cents += order_final_charge_cents; billing_ledger.net_billed_cents recomputed; billing_ledger.charge_entry_count incremented by 1"
          - "client_laboratory.outstanding_balance_cents and billable_line_count recomputed; if the routed outstanding_balance_cents exceeds credit_limit_cents the client posture flips to CREDIT_HOLD (cascade hop 4 of the reflex chain)"
          - "recompute OrderTestLine.result_flag on every line from the catalog entry's critical_value_low and critical_value_high"
          - "if any OrderTestLine's TestCatalogEntry carries reflex_condition != NONE and the reflex condition fires, send_out_order.order_status -> REFLEX_PENDING (cascade hop 2 of the reflex chain)"
          - "send_out_order.version incremented by 1"
      - from: S_RESULT_RELEASED
        to: S_REFLEX_PENDING
        trigger: POST /send-out-orders/{id}/release-results
        actor: system
        preconditions:
          - "send_out_order.order_status == RESULT_RELEASED"
          - "at least one OrderTestLine satisfies its TestCatalogEntry reflex_condition: reflex_condition == ALWAYS, or reflex_condition == RESULT_ABOVE_HIGH with result_value > critical_value_high, or reflex_condition == RESULT_BELOW_LOW with result_value < critical_value_low"
        side_effects:
          - "send_out_order.order_status -> REFLEX_PENDING"
          - "CASCADE HOP 3: a new SendOutOrder is created with reflex_source_order_id = this order, order_status = SUBMITTED, billing_status = UNBILLED, and one OrderTestLine in PENDING for the reflex TestCatalogEntry"
          - "CASCADE HOP 4: every ResultInterfaceMessage whose client is this client and whose interface_build is CERTIFIED and whose status in {QUEUED, VALIDATED} transitions to HELD"
          - "send_out_order.version incremented by 1"
      - from: S_RESULT_RELEASED
        to: S_REFLEX_PENDING
        trigger: POST /send-out-orders/{id}/order-reflex-test
        actor: Pathologist
        preconditions:
          - "send_out_order.order_status == RESULT_RELEASED"
          - "the manually requested reflex falls inside the triggering entry's reflex window at validation priority 10 and clears the strict stability bound at validation priority 11"
        side_effects:
          - "send_out_order.order_status -> REFLEX_PENDING"
          - "a new OrderTestLine is created on this same order with is_add_on true, line_status PENDING and add_on_at stamped"
          - "send_out_order.version incremented by 1"
        note: "Manual reflex leg; the automatic leg is the same transition triggered by release-results."
      - from: S_REFLEX_PENDING
        to: S_RESULT_RELEASED
        trigger: POST /send-out-orders/{id}/reflex-cancel
        actor: Pathologist
        preconditions:
          - "send_out_order.order_status == REFLEX_PENDING"
        side_effects:
          - "the reflex SendOutOrder whose reflex_source_order_id == this order transitions to CANCELLED and its single OrderTestLine transitions to CANCELLED"
          - "send_out_order.order_status -> RESULT_RELEASED"
          - "send_out_order.version incremented by 1"
        note: "Closes the reflex cycle. This compensating cancel is the invariant probe for the reflex chain."
      - from: S_IN_TESTING
        to: S_ON_HOLD
        trigger: POST /send-out-orders/{id}/hold
        actor: ReferenceLabOperations
        preconditions:
          - "send_out_order.order_status in {SUBMITTED, ACCESSIONED, IN_TESTING, INTERIM_REPORTED}"
        side_effects:
          - "send_out_order.order_status -> ON_HOLD"
          - "every OrderTestLine of this order whose line_status == IN_PROGRESS transitions to PENDING"
          - "send_out_order.version incremented by 1"
      - from: S_SUBMITTED
        to: S_ON_HOLD
        trigger: "system event: ClientLaboratory ACTIVE -> CREDIT_HOLD"
        actor: system
        preconditions:
          - "send_out_order.order_status == SUBMITTED"
          - "send_out_order.client_laboratory_id is the client_laboratory whose status just became CREDIT_HOLD"
        side_effects:
          - "send_out_order.order_status -> ON_HOLD"
          - "send_out_order.version incremented by 1"
      - from: S_ON_HOLD
        to: S_SUBMITTED
        trigger: POST /send-out-orders/{id}/release-hold
        actor: LabBillingSpecialist
        preconditions:
          - "send_out_order.order_status == ON_HOLD"
          - "the owning ClientLaboratory.status == ACTIVE"
          - "send_out_order.billing_status in {UNBILLED, PROVISIONAL}"
        side_effects:
          - "send_out_order.order_status -> SUBMITTED"
          - "send_out_order.version incremented by 1"
        note: "Closes the hold cycle: an order may be held and released many times while the client posture oscillates."
      - from: S_INTERIM_REPORTED
        to: S_CANCELLED
        trigger: POST /send-out-orders/{id}/cancel
        actor: ReferenceLabOperations
        preconditions:
          - "send_out_order.order_status in {SUBMITTED, ACCESSIONED, IN_TESTING, INTERIM_REPORTED}"
        side_effects:
          - "send_out_order.order_status -> CANCELLED"
          - "every OrderTestLine of this order whose line_status in {PENDING, IN_PROGRESS, INTERIM} transitions to CANCELLED"
          - "if any OrderTestLine of this order has billed_cents > 0, send_out_order.billing_status -> VOIDED and billing_ledger.voided_cents += the sum of those billed_cents"
          - "send_out_order.version incremented by 1"
      - from: S_CANCELLED
        to: S_ON_HOLD
        trigger: POST /send-out-orders/{id}/hold
        actor: ReferenceLabOperations
        preconditions:
          - "send_out_order.order_status == CANCELLED"
          - "the cancellation is under billing review, meaning send_out_order.billing_status == VOIDED"
        side_effects:
          - "send_out_order.order_status -> ON_HOLD"
          - "send_out_order.version incremented by 1"
        note: "Audit hold: a cancelled order is parked so the billing review can proceed without the order re-entering intake."
      - from: S_RESULT_RELEASED
        to: S_CLOSED
        trigger: POST /result-interface-messages/{id}/acknowledge
        actor: system
        preconditions:
          - "send_out_order.order_status == RESULT_RELEASED"
          - "the acknowledged ResultInterfaceMessage carries message_type == RESULT for this order"
          - "no SendOutOrder whose reflex_source_order_id == this order sits in a non-terminal order_status"
        side_effects:
          - "send_out_order.order_status -> CLOSED"
          - "send_out_order.version incremented by 1"

  # ---------------------------------------------------------------------------
  # Dimension 2 of SendOutOrder: billing_status, which evolves independently of
  # order_status. S_PROVISIONAL / S_BILLED / S_VOIDED are this dimension's
  # canonical waypoint names.
  - entity: SendOutOrder
    initial_state: S_UNBILLED
    terminal_states: []
    shape: independent_billing_dimension
    transitions:
      - from: S_UNBILLED
        to: S_PROVISIONAL
        trigger: POST /send-out-orders/{id}/accession
        actor: system
        preconditions:
          - "send_out_order.billing_status == UNBILLED"
        side_effects:
          - "send_out_order.billing_status -> PROVISIONAL"
          - "send_out_order.version incremented by 1"
      - from: S_PROVISIONAL
        to: S_BILLED
        trigger: POST /send-out-orders/{id}/charge
        actor: LabBillingSpecialist
        preconditions:
          - "send_out_order.billing_status in {UNBILLED, PROVISIONAL}"
          - "the owning ClientLaboratory.status in {ACTIVE, CREDIT_HOLD}"
        side_effects:
          - "send_out_order.billing_status -> BILLED"
          - "billing_ledger.billed_cents += order_final_charge_cents; billing_ledger.net_billed_cents recomputed; billing_ledger.charge_entry_count incremented by 1"
          - "client_laboratory.outstanding_balance_cents recomputed; if it exceeds credit_limit_cents the client posture flips to CREDIT_HOLD"
          - "send_out_order.version incremented by 1"
      - from: S_BILLED
        to: S_VOIDED
        trigger: POST /billing-ledgers/{id}/void-charges
        actor: LabBillingSpecialist
        preconditions:
          - "send_out_order.billing_status == BILLED"
          - "the void amount equals send_out_order.order_final_charge_cents exactly"
        side_effects:
          - "send_out_order.billing_status -> VOIDED"
          - "billing_ledger.voided_cents += the void amount; billing_ledger.net_billed_cents recomputed; billing_ledger.charge_entry_count left unchanged"
          - "client_laboratory.outstanding_balance_cents recomputed"
          - "send_out_order.version incremented by 1"
      - from: S_VOIDED
        to: S_BILLED
        trigger: POST /send-out-orders/{id}/charge
        actor: LabBillingSpecialist
        preconditions:
          - "send_out_order.billing_status == VOIDED"
          - "the owning ClientLaboratory.status in {ACTIVE, CREDIT_HOLD}"
        side_effects:
          - "send_out_order.billing_status -> BILLED"
          - "billing_ledger.billed_cents += order_final_charge_cents; billing_ledger.net_billed_cents recomputed; billing_ledger.charge_entry_count incremented by 1"
          - "client_laboratory.outstanding_balance_cents recomputed"
          - "send_out_order.version incremented by 1"
        note: |
          Re-charge leg; this is the compensating action that makes a void/re-charge pair conserve net_billed_cents.
          billing_status is genuinely independent and cyclic: an order can sit in order_status
          RESULT_RELEASED with billing_status UNBILLED for as long as the billing specialist
          chooses, a billing VOIDED order can still carry a CLOSED order_status, and a voided
          charge can be posted again.

  # ---------------------------------------------------------------------------
  - entity: OrderTestLine
    initial_state: PENDING
    terminal_states: [FINAL, CANCELLED]
    shape: branching_with_repeat_and_interim_cycles
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: POST /specimens/{id}/begin-testing
        actor: system
        preconditions:
          - "order_test_line.line_status == PENDING"
          - "the owning SendOutOrder.order_status == IN_TESTING"
        side_effects:
          - "order_test_line.line_status -> IN_PROGRESS"
          - "order_test_line.version incremented by 1"
      - from: IN_PROGRESS
        to: INTERIM
        trigger: POST /result-interface-messages with message_type == INTERIM
        actor: system
        preconditions:
          - "order_test_line.line_status == IN_PROGRESS"
          - "the owning SendOutOrder.order_status == INTERIM_REPORTED"
        side_effects:
          - "order_test_line.line_status -> INTERIM"
          - "order_test_line.version incremented by 1"
      - from: INTERIM
        to: IN_PROGRESS
        trigger: POST /send-out-orders/{id}/order-add-on-test
        actor: AccessioningTechnologist
        preconditions:
          - "order_test_line.line_status == INTERIM"
          - "the add-on is accepted inside the stability window at validation priority 10"
        side_effects:
          - "order_test_line.line_status -> IN_PROGRESS"
          - "order_test_line.version incremented by 1"
        note: "Revert leg: accepting an add-on inside stability pulls interim lines back into active testing."
      - from: IN_PROGRESS
        to: FINAL
        trigger: POST /send-out-orders/{id}/release-results
        actor: Pathologist
        preconditions:
          - "order_test_line.line_status in {IN_PROGRESS, INTERIM}"
          - "order_test_line.result_value is not null"
        side_effects:
          - "order_test_line.line_status -> FINAL"
          - "order_test_line.result_flag recomputed from the catalog entry's critical_value_low and critical_value_high"
          - "order_test_line.result_released_at stamped from the logical clock"
          - "order_test_line.billed_cents computed with volume_tier_price and order_test_line.tat_credit_cents computed with turnaround_credit_per_line"
          - "order_test_line.version incremented by 1"
      - from: FINAL
        to: REPEAT_REQUIRED
        trigger: POST /send-out-orders/{id}/repeat-test
        actor: Pathologist
        preconditions:
          - "order_test_line.line_status == FINAL"
          - "the specimen still has at least one aliquot Specimen with remaining_stability_hours > 0"
          - "no OrderTestLine with the same send_out_order_id and test_catalog_entry_id already sits in REPEAT_REQUIRED"
        side_effects:
          - "order_test_line.line_status -> REPEAT_REQUIRED"
          - "a new OrderTestLine is created on the same order with is_add_on = true, line_status = PENDING and line_sequence equal to the maximum existing line_sequence plus one"
          - "order_test_line.version incremented by 1"
      - from: REPEAT_REQUIRED
        to: PENDING
        trigger: "system event: the replacement OrderTestLine for the same test is cancelled"
        actor: system
        preconditions:
          - "order_test_line.line_status == REPEAT_REQUIRED"
          - "the replacement OrderTestLine with the same send_out_order_id and test_catalog_entry_id has line_status == CANCELLED"
        side_effects:
          - "order_test_line.line_status -> PENDING"
          - "order_test_line.result_value -> null"
          - "order_test_line.version incremented by 1"
        note: "Cycle leg: a repeat whose replacement was cancelled returns to PENDING with its stale result cleared."
      - from: PENDING
        to: CANCELLED
        trigger: POST /send-out-orders/{id}/hold, POST /send-out-orders/{id}/cancel, POST /specimens/{id}/reject
        actor: system
        preconditions:
          - "order_test_line.line_status in {PENDING, IN_PROGRESS, INTERIM}"
        side_effects:
          - "order_test_line.line_status -> CANCELLED"
          - "order_test_line.billed_cents preserved at its last computed value so a later void can match it exactly"
          - "order_test_line.version incremented by 1"

  # ---------------------------------------------------------------------------
  - entity: InstrumentRun
    initial_state: RESERVED
    terminal_states: [COMPLETED]
    shape: linear_with_abort_branch_and_rerun_cycle
    transitions:
      - from: RESERVED
        to: RUNNING
        trigger: "system event: the logical clock reaches instrument_run.reserved_start_at"
        actor: system
        preconditions:
          - "instrument_run.run_status == RESERVED"
        side_effects:
          - "instrument_run.run_status -> RUNNING"
          - "instrument_run.version incremented by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "system event: the logical clock reaches instrument_run.reserved_end_at"
        actor: system
        preconditions:
          - "instrument_run.run_status == RUNNING"
        side_effects:
          - "instrument_run.run_status -> COMPLETED"
          - "instrument_run.occupied_until_at recomputed as reserved_end_at plus decontamination_buffer_minutes"
          - "instrument_run.version incremented by 1"
      - from: RESERVED
        to: ABORTED
        trigger: POST /instrument-runs/{id}/abort
        actor: MedicalTechnologist
        preconditions:
          - "instrument_run.run_status == RESERVED"
        side_effects:
          - "instrument_run.run_status -> ABORTED"
          - "instrument_run.reserved_start_at and reserved_end_at no longer participate in the decontamination-buffer overlap rule, so the slot is free for a fresh booking"
          - "instrument_run.version incremented by 1"
      - from: ABORTED
        to: RESERVED
        trigger: PATCH /instrument-runs/{id}
        actor: MedicalTechnologist
        preconditions:
          - "instrument_run.run_status == ABORTED"
          - "the replacement window clears every non-ABORTED run on the same instrument_code and section once the buffer is added"
        side_effects:
          - "instrument_run.run_status -> RESERVED"
          - "instrument_run.reserved_start_at, reserved_end_at and occupied_until_at recomputed from the new window"
          - "instrument_run.version incremented by 1"
        note: "Rerun cycle: an aborted booking is rebooked in place rather than duplicated, so the analyzer's calendar never carries a phantom slot."

  # ---------------------------------------------------------------------------
  - entity: InterfaceBuild
    initial_state: DRAFT
    terminal_states: [RETIRED]
    shape: branching_with_rework_cycle
    transitions:
      - from: DRAFT
        to: IN_BUILD
        trigger: POST /interface-builds/{id}/start-build
        actor: InterfaceAnalyst
        preconditions:
          - "interface_build.status == DRAFT"
          - "no other InterfaceBuild with the same client_laboratory_id has status == IN_BUILD"
        side_effects:
          - "interface_build.status -> IN_BUILD"
          - "recompute client_laboratory.interface_status for the owning ClientLaboratory as the highest-status build of that client_laboratory_id"
          - "interface_build.version incremented by 1"
      - from: IN_BUILD
        to: CERTIFIED
        trigger: POST /interface-builds/{id}/certify
        actor: InterfaceAnalyst
        preconditions:
          - "interface_build.status == IN_BUILD"
          - "the build has completed at least one round-trip order and one round-trip result against the client test endpoint"
        side_effects:
          - "interface_build.status -> CERTIFIED"
          - "interface_build.certified_at stamped from the logical clock"
          - "every ResultInterfaceMessage sharing this client_laboratory_id and still in status HELD transitions to VALIDATED"
          - "recompute client_laboratory.interface_status"
          - "interface_build.version incremented by 1"
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: POST /interface-builds/{id}/supersede
        actor: InterfaceAnalyst
        preconditions:
          - "interface_build.status == CERTIFIED"
          - "another InterfaceBuild with the same client_laboratory_id is already CERTIFIED"
        side_effects:
          - "interface_build.status -> SUPERSEDED"
          - "interface_build.superseded_at stamped from the logical clock"
          - "every ResultInterfaceMessage whose interface_build_id == interface_build.id and whose status in {QUEUED, VALIDATED} transitions to HELD"
          - "recompute client_laboratory.interface_status"
          - "interface_build.version incremented by 1"
      - from: SUPERSEDED
        to: RETIRED
        trigger: POST /interface-builds/{id}/retire
        actor: InterfaceAnalyst
        preconditions:
          - "interface_build.status == SUPERSEDED"
          - "no ResultInterfaceMessage whose interface_build_id == interface_build.id has status in {QUEUED, VALIDATED, HELD}"
        side_effects:
          - "interface_build.status -> RETIRED"
          - "interface_build.version incremented by 1"
      - from: RETIRED
        to: IN_BUILD
        trigger: POST /interface-builds/{id}/start-build
        actor: InterfaceAnalyst
        preconditions:
          - "interface_build.status == RETIRED"
          - "no other InterfaceBuild with the same client_laboratory_id has status == IN_BUILD"
        side_effects:
          - "interface_build.status -> IN_BUILD"
          - "interface_build.certified_at -> null and interface_build.superseded_at -> null"
          - "recompute client_laboratory.interface_status"
          - "interface_build.version incremented by 1"
        note: "Fresh-start leg: a retired build may be revived to a blank IN_BUILD state, which is the cycle back into the build lifecycle."

  # ---------------------------------------------------------------------------
  - entity: ResultInterfaceMessage
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED]
    shape: cyclic_with_hold_and_retry_loops
    transitions:
      - from: QUEUED
        to: VALIDATED
        trigger: POST /result-interface-messages/{id}/validate
        actor: InterfaceAnalyst
        preconditions:
          - "result_interface_message.status in {QUEUED, HELD, FAILED}"
          - "the referenced InterfaceBuild.status == CERTIFIED"
          - "the referenced InterfaceBuild.client_laboratory_id equals the owning SendOutOrder.client_laboratory_id"
          - "result_interface_message.retry_count < 5"
        side_effects:
          - "result_interface_message.status -> VALIDATED"
          - "result_interface_message.discrete_field_count computed as the count of the owning order's OrderTestLine rows in {INTERIM, FINAL}"
          - "result_interface_message.version incremented by 1"
      - from: HELD
        to: VALIDATED
        trigger: POST /result-interface-messages/{id}/release-hold
        actor: InterfaceAnalyst
        preconditions:
          - "result_interface_message.status == HELD"
          - "the referenced InterfaceBuild.status == CERTIFIED"
        side_effects:
          - "result_interface_message.status -> VALIDATED"
          - "result_interface_message.version incremented by 1"
        note: "Hold cycle outbound leg; the matching inbound leg is the HELD transition below, so the pair QUEUED/FAILED -> VALIDATED -> HELD -> VALIDATED may repeat."
      - from: VALIDATED
        to: HELD
        trigger: POST /result-interface-messages/{id}/hold and the reflex-escalation cascade
        actor: InterfaceAnalyst
        preconditions:
          - "result_interface_message.status in {QUEUED, VALIDATED, TRANSMITTED}"
        side_effects:
          - "result_interface_message.status -> HELD"
          - "result_interface_message.version incremented by 1"
      - from: FAILED
        to: VALIDATED
        trigger: POST /result-interface-messages/{id}/validate
        actor: InterfaceAnalyst
        preconditions:
          - "result_interface_message.status == FAILED"
          - "result_interface_message.retry_count < 5"
        side_effects:
          - "result_interface_message.status -> VALIDATED"
          - "result_interface_message.version incremented by 1"
        note: "Retry cycle closing leg; the opening leg is VALIDATED -> FAILED below, and the two may repeat until retry_count reaches 5."
      - from: VALIDATED
        to: TRANSMITTED
        trigger: POST /result-interface-messages/{id}/transmit
        actor: InterfaceAnalyst
        preconditions:
          - "result_interface_message.status == VALIDATED"
          - "result_interface_message.retry_count < 5"
        side_effects:
          - "result_interface_message.status -> TRANSMITTED"
          - "result_interface_message.transmitted_at stamped from the logical clock"
          - "result_interface_message.retry_count reset to 0"
          - "if message_type == RESULT, the owning order's Specimen transitions to RELEASED"
          - "result_interface_message.version incremented by 1"
      - from: VALIDATED
        to: FAILED
        trigger: POST /result-interface-messages/{id}/fail
        actor: InterfaceAnalyst
        preconditions:
          - "result_interface_message.status == VALIDATED"
        side_effects:
          - "result_interface_message.status -> FAILED"
          - "result_interface_message.retry_count incremented by 1, then next_retry_offset_minutes computed with interface_retry_backoff"
          - "result_interface_message.version incremented by 1"
      - from: TRANSMITTED
        to: ACKNOWLEDGED
        trigger: POST /result-interface-messages/{id}/acknowledge
        actor: system
        preconditions:
          - "result_interface_message.status == TRANSMITTED"
          - "the client acknowledgement carries a control_id equal to result_interface_message.control_id"
        side_effects:
          - "result_interface_message.status -> ACKNOWLEDGED"
          - "if message_type == RESULT and the owning order has no live reflex order, the owning SendOutOrder transitions to CLOSED"
          - "result_interface_message.version incremented by 1"

  # ---------------------------------------------------------------------------
  - entity: UtilizationAdvisory
    initial_state: OPEN
    terminal_states: [DISMISSED, ESCALATED]
    shape: branching_with_sendback_cycle
    transitions:
      - from: OPEN
        to: SENT
        trigger: POST /utilization-advisories/{id}/acknowledge on the initial delivery, or POST /client-laboratories/{id}/publish-requirements
        actor: LabClientAdmin
        preconditions:
          - "utilization_advisory.status == OPEN"
          - "the client's onboarding_status == COMPLETE"
        side_effects:
          - "utilization_advisory.status -> SENT"
          - "utilization_advisory.send_count incremented by 1"
          - "utilization_advisory.version incremented by 1"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: POST /utilization-advisories/{id}/acknowledge
        actor: LabClientAdmin
        preconditions:
          - "utilization_advisory.status in {OPEN, SENT}"
        side_effects:
          - "utilization_advisory.status -> ACKNOWLEDGED"
          - "utilization_advisory.version incremented by 1"
      - from: ACKNOWLEDGED
        to: SENT
        trigger: "system event: the same client orders the same utilization-managed test again"
        actor: system
        preconditions:
          - "utilization_advisory.status == ACKNOWLEDGED"
          - "a new SendOutOrder for the same client_laboratory_id carries a line for the same TestCatalogEntry"
        side_effects:
          - "utilization_advisory.status -> SENT"
          - "utilization_advisory.send_count incremented by 1"
          - "utilization_advisory.version incremented by 1"
        note: "Send-back cycle: an acknowledged advisory is re-sent rather than duplicated whenever the behaviour repeats."
      - from: SENT
        to: DISMISSED
        trigger: POST /utilization-advisories/{id}/dismiss
        actor: LabClientAdmin
        preconditions:
          - "utilization_advisory.status in {OPEN, SENT}"
        side_effects:
          - "utilization_advisory.status -> DISMISSED"
          - "utilization_advisory.version incremented by 1"
      - from: SENT
        to: ESCALATED
        trigger: POST /utilization-advisories/{id}/escalate
        actor: ReferenceLabOperations
        preconditions:
          - "utilization_advisory.status in {OPEN, SENT}"
          - "utilization_advisory.send_count >= 2, meaning the advisory was sent and re-sent at least once"
        side_effects:
          - "utilization_advisory.status -> ESCALATED"
          - "the client's forward_utilization_score and settled_utilization_score are both recomputed and persisted"
          - "utilization_advisory.version incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: courier-run-create-stale-client-laboratory
    parent_entity: ClientLaboratory
    write_endpoint: "POST /courier-runs"
    occ_field: "expected_client_laboratory_version"
    description: |
      Booking a CourierRun against a ClientLaboratory whose version has advanced
      since the coordinator last observed it is rejected. This captures the case
      where another writer has already changed the client's courier configuration,
      or where a ledger-driven posture cascade bumped the client's version, so the
      coordinator's view of the client is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enter-results-stale-send-out-order
    parent_entity: SendOutOrder
    write_endpoint: "POST /send-out-orders/{id}/enter-results"
    occ_field: "expected_send_out_order_version"
    description: |
      Entering or amending result values against a SendOutOrder whose version has
      advanced since the technologist last read the order is rejected. This
      captures the case where an add-on line was appended to the same order since
      the technologist's read, legitimately superseding the earlier line set, so
      the technologist's view of the order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: interface-message-stale-send-out-order
    parent_entity: SendOutOrder
    write_endpoint: "POST /result-interface-messages"
    occ_field: "expected_send_out_order_version"
    description: |
      Queuing a ResultInterfaceMessage against a SendOutOrder whose version has
      advanced since the interface analyst last observed it is rejected. This
      captures the case where a result release or a reflex escalation has already
      moved the order since the analyst's read, so the queued payload is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  # ---------------------------------------------------------------------------
  # Rule 2 mode (a): tiered-rate selection over a state-filtered count, floor applied last.
  - name: volume_tier_price
    trigger: "POST /send-out-orders/{id}/charge, POST /send-out-orders/{id}/release-results, POST /send-out-orders/{id}/order-add-on-test"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order — do not reorder these five steps.
      STEP 1  reportable_count = count of OrderTestLine rows L where
                 L.send_out_order_id == order.id
                 AND L.test_catalog_entry_id == line.test_catalog_entry_id
                 AND L.line_status IN {PENDING, IN_PROGRESS, INTERIM, FINAL, REPEAT_REQUIRED}
              reportable_count is computed from the line set AS IT STANDS before
              this line's own billed_cents is written.
      STEP 2  contracted_cents = catalog_entry.client_price_cents
                                  if catalog_entry.client_price_cents IS NOT NULL
                                  else catalog_entry.list_price_cents
      STEP 3  tier_rate = 1.00                          if reportable_count <= 2
                        = 0.85                          if reportable_count >= 3 and reportable_count <= 5
                        = 0.72                          if reportable_count >= 6
      STEP 4  discounted_cents = round_half_up(contracted_cents * tier_rate, 2)
      STEP 5  line.billed_cents = max(discounted_cents, catalog_entry.floor_price_cents)
      The floor is applied AFTER the discount, never before, and is never itself rounded.
    input_set: "OrderTestLine rows on the same order and same test whose line_status is in {PENDING, IN_PROGRESS, INTERIM, FINAL, REPEAT_REQUIRED}. Rows in {CANCELLED} are excluded from reportable_count and contribute no billed_cents."
    constants:
      TIER_RATE_THROUGH_2: 1.00
      TIER_RATE_3_TO_5: 0.85
      TIER_RATE_6_PLUS: 0.72
      TIER_LOWER_BOUND_2: 2
      TIER_LOWER_BOUND_3: 3
      TIER_LOWER_BOUND_6: 6
    precision: "2 decimal places, round_half_up, applied once at STEP 4"
    note: "The count boundary is inclusive on the lower tier: exactly 2 reportable lines price at 1.00, exactly 3 lines price at 0.85."

  # ---------------------------------------------------------------------------
  # Rule 1 instance A: two-variant estimate-vs-actual pricing on SendOutOrder.
  - name: order_price_reconciliation
    trigger: "POST /send-out-orders/{id}/accession (provisional) and POST /send-out-orders/{id}/charge or POST /send-out-orders/{id}/release-results (final)"
    algorithm: aggregation
    formula: |
      VARIANT "provisional" (runs once at accession):
        provisional_charge_cents = round_half_up(
            sum over OrderTestLine rows of that order of catalog_entry.list_price_cents, 2)
      VARIANT "final" (runs at charge or release, after every line's billed_cents is written):
        base_cents      = sum over OrderTestLine rows of line.billed_cents
        surge_rate      = TIER_SURCHARGE_RATE[rush_tier]     # 0.00 / 0.15 / 0.40
        surcharge_cents = round_half_up(base_cents * surge_rate, 2)
        raw_cents       = base_cents + surcharge_cents
        order_floor_cents   = sum over OrderTestLine rows of catalog_entry.floor_price_cents
        order_ceiling_cents = 4 * sum over OrderTestLine rows of catalog_entry.list_price_cents
        order_final_charge_cents = min(max(raw_cents, order_floor_cents), order_ceiling_cents)
      DELTA
        charge_variance_cents = order_final_charge_cents - provisional_charge_cents
      Pinned: the provisional variant NEVER reads client_price_cents, tier_rate or the
      surcharge, so for identical line data the two variants diverge by exactly the
      contract discount plus the rush surcharge.
    input_set: "OrderTestLine rows of the order whose line_status is in {PENDING, IN_PROGRESS, INTERIM, FINAL, REPEAT_REQUIRED}. The order_ceiling_cents uses list prices so the ceiling is variant-independent."
    constants:
      TIER_SURCHARGE_RATE: { STANDARD: 0.00, RUSH: 0.15, CRITICAL: 0.40 }
      CEILING_MULTIPLIER: 4
    precision: "2 decimal places, round_half_up at each round(...) site"
    variants:
      - name: provisional
        when: "at accession, before any line has a final billed_cents"
        difference: "uses catalog list price for every line, applies no tier discount, no contract price, and no rush surcharge"
      - name: final
        when: "at charge or result release, after every line's billed_cents is written"
        difference: "uses the contracted client price with the volume tier discount, adds the rush surcharge, then clamps to [order_floor_cents, order_ceiling_cents]"

  # ---------------------------------------------------------------------------
  # Rule 2 mode (c): circular-looking dependency between rush_tier and effective_tat_hours.
  - name: rush_priority_surcharge
    trigger: "POST /specimens/{id}/begin-testing (the SendOutOrder ACCESSIONED -> IN_TESTING transition)"
    algorithm: threshold
    formula: |
      preliminary_tat_hours = max over the order's live OrderTestLine catalog entries
                              of catalog_entry.base_tat_hours
      STEP 1  candidate_tier = CRITICAL  if order.priority == STAT
                             = STANDARD  if order.priority in {TIMED, ROUTINE}
      STEP 2  first_pass_tat = preliminary_tat_hours * TIER_TAT_FACTOR[candidate_tier]
      STEP 3  escalate exactly once, and only from STANDARD:
                if candidate_tier == STANDARD and first_pass_tat < RUSH_TAT_THRESHOLD_HOURS:
                    rush_tier = RUSH
                    effective_tat_hours = preliminary_tat_hours * TIER_TAT_FACTOR[RUSH]
                else:
                    rush_tier = candidate_tier
                    effective_tat_hours = first_pass_tat
      STEP 4  FREEZE rush_tier and effective_tat_hours. No second escalation pass runs,
              even when the escalated effective_tat_hours is itself still below the threshold.
      STEP 5  expected_result_at = order.specimen.received_at + effective_tat_hours
      STEP 6  surcharge_rate = TIER_SURCHARGE_RATE[rush_tier]   # consumed by order_price_reconciliation
      Because STEP 3 re-reads a TAT that STEP 2 produced, the tier is keyed on a quantity
      the tier itself changes. The pinned order (candidate -> first pass -> at most one
      escalation -> freeze) is what makes the value well defined.
    input_set: "OrderTestLine rows of the order whose line_status is in {PENDING, IN_PROGRESS, INTERIM}; rows in {CANCELLED} contribute no base_tat_hours."
    constants:
      TIER_TAT_FACTOR: { STANDARD: 1.0, RUSH: 0.5, CRITICAL: 0.25 }
      TIER_SURCHARGE_RATE: { STANDARD: 0.00, RUSH: 0.15, CRITICAL: 0.40 }
      RUSH_TAT_THRESHOLD_HOURS: 24
    precision: "2 decimal places, round_half_up for effective_tat_hours and expected_result_at"
    note: "Worked values against the fixture catalog: ROUTINE with base_tat_hours 6 -> candidate STANDARD, first_pass_tat 6.0 < 24 -> escalate to RUSH, effective_tat_hours 3.0, surcharge_rate 0.15. TIMED with base_tat_hours 48 -> candidate STANDARD, first_pass_tat 48.0 >= 24 -> stays STANDARD, effective_tat_hours 48.0, surcharge_rate 0.00. STAT with base_tat_hours 20 -> candidate CRITICAL, effective_tat_hours 5.0, surcharge_rate 0.40."

  # ---------------------------------------------------------------------------
  # Rule 2 mode (b): nested rounding where the order of rounding changes cents.
  - name: turnaround_credit_per_line
    trigger: "POST /send-out-orders/{id}/release-results"
    algorithm: chronological
    formula: |
      # Pinned rounding order: round PER LINE, then sum. Summing first and rounding
      # once produces a different cent total and is WRONG for this scaffold.
      for each OrderTestLine L of the order in ASCENDING line_sequence order:
          overrun_hours = max(0, ceil((order.result_released_at - order.expected_result_at) in hours))
          if overrun_hours == 0:
              L.tat_credit_cents = 0.00
          else:
              L.tat_credit_cents = round_half_up(L.billed_cents * overrun_hours * LATE_CREDIT_RATE_PER_HOUR, 2)
      order.tat_credit_cents = round_half_up(sum over L of L.tat_credit_cents, 2)
      Tie-break for the traversal: line_sequence ASCENDING is the only permitted order;
      if two lines share a line_sequence the order is rejected at validation priority 13.
    input_set: "OrderTestLine rows of the order whose line_status == FINAL. Lines in {CANCELLED, PENDING, IN_PROGRESS, INTERIM, REPEAT_REQUIRED} earn no credit."
    constants:
      LATE_CREDIT_RATE_PER_HOUR: 0.015
    precision: "2 decimal places, round_half_up — applied at LINE level first, then again on the sum"
    note: "Divergence probe with two lines each billed_cents 1237 and overrun_hours 1: per-line rounding gives 18.56 + 18.56 = 37.12, while sum-then-round gives 37.11. The scaffold pins 37.12."

  # ---------------------------------------------------------------------------
  # Rule 1 instance B: forward vs settled utilization on ClientLaboratory.
  - name: client_utilization_dual_metric
    trigger: "on read of GET /client-laboratories/{id}, on POST /utilization-advisories, on POST /utilization-advisories/{id}/escalate, and on every OrderTestLine status change for this client"
    algorithm: forward_looking
    formula: |
      VARIANT "forward":
        forward_utilization_score = count of OrderTestLine rows L such that
            L.send_out_order.client_laboratory_id == client.id
            AND L.line_status IN {PENDING, IN_PROGRESS, INTERIM, FINAL, REPEAT_REQUIRED}
            AND L.send_out_order.client_requested_at > logical_clock - 30 days
      VARIANT "settled":
        settled_utilization_score = count of OrderTestLine rows L such that
            L.send_out_order.client_laboratory_id == client.id
            AND L.line_status == FINAL
            AND L.result_released_at IS NOT NULL
            AND L.result_released_at <= logical_clock
            AND L.result_released_at > logical_clock - 30 days
      DERIVED
        latency_gap = forward_utilization_score - settled_utilization_score
        utilization_flag = settled_utilization_score > UTILIZATION_BAND_PER_MONTH
      Both windows are half-open on the left: strictly greater than clock - 30 days,
      inclusive at the clock. The two variants count the SAME work differently —
      in-flight lines are visible only to the forward variant.
    input_set: "OrderTestLine rows reachable from the client through SendOutOrder.client_laboratory_id. Rows in {CANCELLED} are excluded from both variants."
    constants:
      UTILIZATION_BAND_PER_MONTH: 4
      WINDOW_DAYS: 30
    precision: "integer counts; latency_gap and utilization_flag derived without rounding"
    variants:
      - name: forward
        when: "any read or advisory evaluation while work is still in flight"
        difference: "counts PENDING/IN_PROGRESS/INTERIM/FINAL/REPEAT_REQUIRED lines by client_requested_at, so an order submitted but not yet released already counts"
      - name: settled
        when: "any read or advisory evaluation that should reflect only completed work"
        difference: "counts only FINAL lines with a non-null result_released_at inside the window, so the same order contributes nothing until its results are released"

  # ---------------------------------------------------------------------------
  # Rule 9 instance A anchor: the conserved quantity a charge/void pair must preserve.
  - name: billing_ledger_net_position
    trigger: "POST /send-out-orders/{id}/charge, POST /billing-ledgers/{id}/void-charges, POST /client-laboratories/{id}/settle-balance, and every cascade that posts or voids a charge"
    algorithm: aggregation
    formula: |
      billed_cents      = running sum of posted charge amounts (incremented by order_final_charge_cents)
      voided_cents      = running sum of voided charge amounts
      net_billed_cents  = billed_cents - voided_cents
      charge_entry_count = number of posted-charge events applied (NEVER decremented by a void)
      CONSERVED QUANTITY: for any order O already in billing_status BILLED, the pair
        POST /billing-ledgers/{L}/void-charges with void_amount_cents == O.order_final_charge_cents
        (the forward action; voided_cents += the amount, net falls)
        POST /send-out-orders/{O}/charge
        (the compensating action; billed_cents += the same amount, net rises back)
      leaves BOTH billing_ledger.net_billed_cents and
      client_laboratory.outstanding_balance_cents exactly equal to their pre-pair values.
      billing_ledger.billed_cents, billing_ledger.voided_cents and charge_entry_count all
      GROW across the pair and are deliberately NOT part of the conserved quantity.
    input_set: "All BillingLedger rows of the client. Voids that do not exactly equal a prior order_final_charge_cents are rejected at validation priority 13, so no partial void can move the net position by an unpaired amount."
    constants:
      VOID_TOLERANCE_CENTS: 0
    precision: "2 decimal places, round_half_up; exact integer-cent equality is required for the pair to cancel"

  # ---------------------------------------------------------------------------
  # Rule 9 instance B anchor: the conserved quantity an aliquot create/delete pair must preserve.
  - name: specimen_aliquot_volume_conservation
    trigger: "POST /specimens/{id}/aliquots and DELETE /specimens/{id}/aliquots/{aliquot_id}"
    algorithm: aggregation
    formula: |
      total_aliquot_volume_ml = sum of child.aliquot_volume_ml over every Specimen child
                                whose child.aliquot_parent_id == parent.id
      CONSERVED QUANTITY: for any parent specimen P with children {c1..cn}, the pair
        POST /specimens/{P}/aliquots   (creates child c, total rises by c.aliquot_volume_ml)
        DELETE /specimens/{P}/aliquots/{c}
        (removes child c from the set, total falls by c.aliquot_volume_ml)
      leaves parent.total_aliquot_volume_ml exactly equal to its pre-pair value, and
      leaves the number of Specimen rows whose aliquot_parent_id == P unchanged.
      The conservation claim covers ONLY total_aliquot_volume_ml and the child row count.
      parent.condition and parent.status are NOT part of the conserved quantity: an
      overdraw rejection is not undone by deleting the offending child.
    input_set: "Specimen rows whose aliquot_parent_id equals the parent, in any status. A deleted child is removed from the set entirely, so it contributes nothing after the delete."
    constants: {}
    precision: "2 decimal places, round_half_up; aliquot volumes are compared with exact decimal equality"

  # ---------------------------------------------------------------------------
  - name: specimen_remaining_stability
    trigger: "on read of GET /specimens/{id}, POST /specimens/{id}/accession, POST /specimens/{id}/begin-testing, POST /send-out-orders/{id}/order-add-on-test, POST /send-out-orders/{id}/order-reflex-test"
    algorithm: decay_function
    formula: |
      binding_window_hours = MIN over every TestCatalogEntry E ordered against this specimen of
          E.stability_hours_ambient       if specimen.transport_temperature == AMBIENT
          E.stability_hours_refrigerated  if specimen.transport_temperature == REFRIGERATED
          E.stability_hours_frozen        if specimen.transport_temperature == FROZEN
      elapsed_hours = (logical_clock - specimen.collection_at) in hours
      remaining_stability_hours = binding_window_hours - elapsed_hours
      The value MAY be negative; it is never clamped and never stored — it is derived
      on every read from the logical clock. The binding window is the MINIMUM across the
      ordered tests, so adding a new test to an order can only shorten the window.
    input_set: "Every TestCatalogEntry referenced by an OrderTestLine row whose send_out_order.specimen_id == this specimen.id and whose line_status is not CANCELLED."
    constants: {}
    precision: "4 decimal places, round_half_down; comparisons elsewhere use at most 2 decimals"

  # ---------------------------------------------------------------------------
  - name: interface_retry_backoff
    trigger: "POST /result-interface-messages/{id}/fail"
    algorithm: threshold
    formula: |
      next_retry_offset_minutes = min(BASE_RETRY_MINUTES * (2 ** retry_count), MAX_RETRY_MINUTES)
      retry_count is incremented by 1 BEFORE the offset is computed, so the first
      failure produces retry_count 1 and an offset of 10 minutes.
      Pinned boundary values: retry_count 1 -> 10, 2 -> 20, 3 -> 40, 4 -> 60, 5 -> 60.
      The cap binds at retry_count 4 (80 minutes would exceed MAX_RETRY_MINUTES).
      retry_count is never reset by a successful VALIDATED hop; it resets only when the
      message reaches TRANSMITTED.
    input_set: "ResultInterfaceMessage rows in status FAILED. Messages with retry_count == 5 cannot be re-validated (validation priority 5 rejects with ERR_RETRY_LIMIT_REACHED)."
    constants:
      BASE_RETRY_MINUTES: 5
      MAX_RETRY_MINUTES: 60
      RETRY_COUNT_LIMIT: 5
    precision: "integer minutes, exact; the min() cap is applied last"

  # ---------------------------------------------------------------------------
  - name: billing_route_attribution
    trigger: "POST /send-out-orders/{id}/charge, POST /billing-ledgers/{id}/void-charges, POST /send-out-orders/{id}/release-results"
    algorithm: conditional_branch
    formula: |
      route = client_laboratory.billing_arrangement
      routed_amount_cents =
          order.order_final_charge_cents      if route == CLIENT
          0                                   if route == PATIENT
          0                                   if route == PAYER
      client_laboratory.outstanding_balance_cents =
          sum over SendOutOrder rows O of this client with O.billing_status == BILLED
          of routed_amount_cents(O)
      billing_ledger.billed_cents still rises by order_final_charge_cents for EVERY route;
      only the client's outstanding_balance_cents is route-gated. A PATIENT- or PAYER-routed
      client therefore never crosses credit_limit_cents and never enters CREDIT_HOLD, while
      its BillingLedger keeps accumulating.
    input_set: "SendOutOrder rows of this client whose billing_status == BILLED. Rows in {VOIDED} contribute nothing; rows in {UNBILLED, PROVISIONAL} contribute nothing."
    constants:
      DEFAULT_ARRANGEMENT: CLIENT
    precision: "2 decimal places, round_half_up"

  # ---------------------------------------------------------------------------
  - name: catalog_publication_currency
    trigger: "POST /send-out-orders, POST /send-out-orders/{id}/order-add-on-test, POST /send-out-orders/{id}/order-reflex-test"
    algorithm: aggregation
    formula: |
      stale_cell_count(client, test) = number of InterfaceBuild rows B such that
          B.client_laboratory_id == client.id
          AND B.order_interface_enabled == true
          AND B.status in {CERTIFIED}
          AND B.certified_at < test_catalog_entry.updated_at
      catalog_currency_ok = (test_catalog_entry.status == PUBLISHED) AND (stale_cell_count == 0)
      A catalog publish bumps test_catalog_entry.updated_at, which makes every
      previously certified order-carrying build for every client stale at once —
      a single test edit invalidates the whole publication grid.
    input_set: "InterfaceBuild rows of the ordering client with order_interface_enabled == true and status == CERTIFIED. Builds in {DRAFT, IN_BUILD, SUPERSEDED, RETIRED} are excluded."
    constants: {}
    precision: "integer count; comparison is a strict instant comparison (<), so a build certified at exactly test_catalog_entry.updated_at is NOT stale"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must both be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"
    note: "Header presence is checked before anything else, so a request with neither headers nor a valid body reports the header failure."

  - priority: 2
    category: auth
    check: "The acting role must be permitted for this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
    note: "Every role listed in §1.5 for an endpoint passes; every other declared role fails here."

  - priority: 2.5
    category: auth
    check: "A LabClientAdmin may only act on resources whose client_laboratory_id equals its own X-User-ID"
    error_id: ERR_CLIENT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /client-laboratories/{id}/publish-requirements, POST /send-out-orders, POST /send-out-orders/{id}/cancel, POST /utilization-advisories/{id}/acknowledge, POST /utilization-advisories/{id}/dismiss, GET /client-laboratories/{id}"
    note: "This is a distinct error from priority 2: the role IS permitted for the operation, but the acting client is not the resource's client."

  - priority: 3
    category: existence
    check: "Every resource id in the path must exist; path segments are validated left to right"
    error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying {id} in the path"
    note: |
      The entity-specific error ids this priority can raise are ERR_CLIENT_LABORATORY_NOT_FOUND,
      ERR_COURIER_RUN_NOT_FOUND, ERR_TEST_CATALOG_ENTRY_NOT_FOUND, ERR_SPECIMEN_NOT_FOUND,
      ERR_SEND_OUT_ORDER_NOT_FOUND, ERR_ORDER_TEST_LINE_NOT_FOUND, ERR_INSTRUMENT_RUN_NOT_FOUND,
      ERR_INTERFACE_BUILD_NOT_FOUND, ERR_INTERFACE_MESSAGE_NOT_FOUND, ERR_BILLING_LEDGER_NOT_FOUND,
      ERR_UTILIZATION_ADVISORY_NOT_FOUND and ERR_ALIQUOT_NOT_FOUND. For
      /client-laboratories/{id}/send-out-orders the client is checked first; a missing client
      yields ERR_CLIENT_LABORATORY_NOT_FOUND even when the endpoint's other inputs are also invalid.

  - priority: 4
    category: existence
    check: "Body foreign keys must resolve, validated in the exact order the endpoint's §1.5 input list declares"
    error_id: ERR_{RESOURCE}_NOT_FOUND
    http_status: 404
    applies_to: "POST /courier-manifests, POST /specimens, POST /send-out-orders, POST /instruments, POST /instrument-runs, POST /interface-builds, POST /result-interface-messages, POST /utilization-advisories, POST /send-out-orders/{id}/order-add-on-test, POST /send-out-orders/{id}/order-reflex-test, POST /billing-ledgers/{id}/void-charges"

  - priority: 4.5
    category: existence
    check: "When the request body carries expected_<parent>_version, it must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /courier-manifests, POST /send-out-orders/{id}/enter-results, POST /result-interface-messages"
    note: "The optimistic-concurrency check runs BEFORE every business rule, so a stale write reports ERR_STALE_VERSION and never the business error it would otherwise have produced."

  - priority: 5
    category: state
    check: "The target resource must be in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint in §1.5"
    note: "A transition attempted from any state not listed as a from: in §1.2 for that trigger is rejected here. A specimen-level action whose owning order has already moved past the required earlier state reports the more specific ERR_ORDER_NOT_ACCESSIBLE."

  - priority: 5.5
    category: state
    check: "No transition may leave a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every action endpoint whose entity declares terminal_states in §1.2"

  - priority: 6
    category: business_referential
    check: "Every ordered TestCatalogEntry must be in status PUBLISHED and every certified order-carrying InterfaceBuild of the ordering client must have been certified at or after the catalog entry's updated_at (catalog_publication_currency == true)"
    error_id: ERR_CATALOG_ENTRY_NOT_PUBLISHED
    http_status: 422
    applies_to: "POST /send-out-orders, POST /send-out-orders/{id}/order-add-on-test, POST /send-out-orders/{id}/order-reflex-test"
    note: "A DEPRECATED or WITHDRAWN test, and a PUBLISHED test whose entry has been edited since the ordering client's build was certified, both fail here."

  - priority: 6.5
    category: business_constraint
    check: "A send-out requisition must carry at least one test line"
    error_id: ERR_EMPTY_REQUISITION
    http_status: 400
    applies_to: "POST /send-out-orders"
    note: "An empty line set is a shape failure checked before any catalog or interface integrity rule, so no order row is created."

  - priority: 7
    category: business_referential
    check: "The InterfaceBuild referenced by an interface operation must be CERTIFIED and must belong to the order's own client"
    error_id: ERR_INTERFACE_BUILD_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /result-interface-messages, POST /result-interface-messages/{id}/validate, POST /result-interface-messages/{id}/transmit, POST /result-interface-messages/{id}/release-hold"

  - priority: 8
    category: business_safety
    check: "A specimen being accessioned or having a run started must match the required_specimen_type and container_type of every ordered test"
    error_id: ERR_SPECIMEN_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /specimens/{id}/accession, POST /specimens/{id}/begin-testing"

  - priority: 8.5
    category: business_safety
    check: "A specimen presented for accessioning whose condition is not ACCEPTABLE must carry a condition_reason_code and is rejected outright"
    error_id: ERR_SPECIMEN_NOT_ACCEPTABLE
    http_status: 422
    applies_to: "POST /specimens/{id}/accession, POST /specimens/{id}/begin-testing"
    note: "Hemolysis, clotting and temperature excursion are specimen-quality failures rather than credential failures, so they are checked ahead of volume and stability."

  - priority: 9
    category: business_safety
    check: "Specimen volume must be greater than or equal to the max min_volume_ml over the ordered tests, and every TESTED transport temperature must equal the observed transport_temperature"
    error_id: "ERR_INSUFFICIENT_SPECIMEN_VOLUME / ERR_TRANSPORT_TEMPERATURE_EXCEEDED"
    http_status: 422
    applies_to: "POST /specimens/{id}/accession, POST /specimens/{id}/begin-testing, POST /send-out-orders/{id}/order-add-on-test"
    note: "The volume bound is inclusive: volume_ml == min_volume_ml passes, one hundredth below fails."

  - priority: 10
    category: business_safety
    check: "The specimen's binding stability window must not have elapsed at the logical clock, and a REFLEX order must additionally fall inside the triggering catalog entry's reflex_within_hours of the triggering result release (add-on lines are anchored on the specimen window alone)"
    error_id: "ERR_SPECIMEN_STABILITY_EXCEEDED / ERR_REFLEX_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "POST /specimens/{id}/accession, POST /specimens/{id}/begin-testing, POST /send-out-orders/{id}/order-add-on-test, POST /send-out-orders/{id}/order-reflex-test"
    note: "Two distinct bounds sit here: the stability bound is elapsed_hours <= binding_window_hours (inclusive), while the reflex window bound is elapsed <= reflex_within_hours (inclusive) measured from the triggering result's release."

  - priority: 11
    category: business_safety
    check: "A reflex or add-on must leave strictly positive remaining specimen stability at the logical clock"
    error_id: ERR_INSUFFICIENT_STABILITY_FOR_REFLEX
    http_status: 422
    applies_to: "POST /send-out-orders/{id}/order-add-on-test, POST /send-out-orders/{id}/order-reflex-test"
    note: "This is the STRICT bound: remaining_stability_hours must be > reflex_min_remaining_hours. At exactly equality the request is rejected; a hundredth above it passes. This differs from priority 10's inclusive bound."

  - priority: 12
    category: business_safety
    check: "A reflex order may only be placed when the triggering catalog entry's reflex_condition is satisfied by the triggering result value"
    error_id: ERR_REFLEX_CONDITION_NOT_MET
    http_status: 422
    applies_to: "POST /send-out-orders/{id}/order-reflex-test"

  - priority: 13
    category: business_safety
    check: "A result line whose computed result_flag is CRITICAL_HIGH or CRITICAL_LOW must carry both critical_value_notified_to and critical_value_notified_at before the order may release"
    error_id: ERR_CRITICAL_VALUE_NOT_NOTIFIED
    http_status: 422
    applies_to: "POST /send-out-orders/{id}/release-results, POST /result-interface-messages with message_type RESULT"

  - priority: 14
    category: business_safety
    check: "The X-User-ID releasing a result must differ from entered_by_user_id on every line of that order"
    error_id: ERR_SOD_RESULT_ENTRY_RELEASE
    http_status: 403
    applies_to: "POST /send-out-orders/{id}/release-results"

  - priority: 15
    category: business_constraint
    check: "A booked InstrumentRun must not collide with an existing non-ABORTED run on the same instrument once the instrument's decontamination buffer is added, and reserved_start_at must be strictly before reserved_end_at"
    error_id: ERR_INSTRUMENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /instrument-runs"

  - priority: 16
    category: business_constraint
    check: "A CourierManifest leg must not properly overlap another PLANNED, DISPATCHED or IN_TRANSIT leg on the same route vehicle"
    error_id: ERR_COURIER_LEG_OVERLAP
    http_status: 409
    applies_to: "POST /courier-manifests"

  - priority: 17
    category: business_constraint
    check: "Uniqueness: test_code among non-WITHDRAWN catalog entries, accession_number across specimens, clia_number across clients, line_sequence within an order, and control_id within a client"
    error_id: "ERR_DUPLICATE_TEST_CODE / ERR_DUPLICATE_ACCESSION_NUMBER / ERR_CONTROL_ID_REUSED / ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /test-catalog-entries, POST /specimens, POST /specimens/{id}/aliquots, POST /client-laboratories, POST /send-out-orders, POST /result-interface-messages"

  - priority: 18
    category: business_constraint
    check: "Reordering a utilization-managed test for the same patient beyond the advisory threshold is blocked once an advisory for the same client and test is already ESCALATED"
    error_id: ERR_UTILIZATION_GUARD_BLOCKED
    http_status: 409
    applies_to: "POST /send-out-orders"

  - priority: 19
    category: business_constraint
    check: "A delete or void amount must exactly match a prior charge on the same order, and an aliquot delete target must belong to the parent specimen"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_STATE"
    http_status: 409
    applies_to: "POST /billing-ledgers/{id}/void-charges, DELETE /specimens/{id}/aliquots/{aliquot_id}"
    note: "A void whose amount does not match a prior charge reports ERR_VOID_AMOUNT_MISMATCH, and a delete whose target is not a child of the parent in the path reports ERR_ALIQUOT_PARENT_MISMATCH. Exact cent equality is required so that a compensating pair can cancel to zero drift."

  - priority: 20
    category: business_constraint
    check: "A result-interface message may only be queued or transmitted when the order's order_status admits it, and a message with retry_count == 5 may no longer be validated"
    error_id: "ERR_INTERFACE_RESULT_GATED / ERR_RETRY_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /result-interface-messages, POST /result-interface-messages/{id}/transmit, POST /result-interface-messages/{id}/validate"

  - priority: 21
    category: business_constraint
    check: "The ordering client must not be SUSPENDED or INACTIVE for a submission, and the client's specimen requirement note must be published before submission"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 403
    applies_to: "POST /send-out-orders, POST /specimens, POST /courier-manifests"

  - priority: 22
    category: business_constraint
    check: "A requested collection_at must be at or before received_at, and client_requested_at must be at or before the logical clock"
    error_id: ERR_INVALID_TEMPORAL_WINDOW
    http_status: 422
    applies_to: "POST /specimens, POST /send-out-orders, POST /courier-manifests"

  - priority: 23
    category: business_referential
    check: "An add-on or reflex line must not duplicate an existing non-CANCELLED OrderTestLine for the same test on the same order"
    error_id: ERR_DUPLICATE_ADD_ON_LINE
    http_status: 409
    applies_to: "POST /send-out-orders/{id}/order-add-on-test, POST /send-out-orders/{id}/order-reflex-test"

  - priority: 24
    category: business_fiscal
    check: "A client whose routed outstanding_balance_cents is at or above credit_limit_cents may not have specimens, orders or charges admitted, and posting a charge may not push the routed balance above the limit"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /specimens, POST /specimens/{id}/accession, POST /send-out-orders, POST /send-out-orders/{id}/accession, POST /send-out-orders/{id}/charge"# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================

endpoints:

  # --- logical clock ---------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Startup default is exactly 2026-09-01T00:00:00Z and the server MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [ReferenceLabOperations]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["advances the logical clock", "may fire clock-driven system transitions such as CourierRun DISPATCHED->IN_TRANSIT, CourierRun IN_TRANSIT->COMPLETED and InstrumentRun RESERVED->RUNNING"]

  # --- ClientLaboratory ------------------------------------------------------
  - method: POST
    path: "/reference-lab/client-laboratories"
    description: "Register a client laboratory in PENDING_ONBOARDING"
    roles: [ReferenceLabOperations]
    code: 201
    input: [name, clia_number, client_type, state_code, billing_arrangement, credit_limit_cents]
    output: ClientLaboratory
    side_effects: ["client_laboratory created with status PENDING_ONBOARDING and onboarding_status DOCUMENTS_PENDING"]
  - method: GET
    path: "/reference-lab/client-laboratories"
    description: "List client laboratories, optionally filtered by posture"
    roles: [ReferenceLabOperations, LabBillingSpecialist, UtilizationReviewer, LabClientAdmin]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: ClientLaboratory[]
    side_effects: []
  - method: GET
    path: "/reference-lab/client-laboratories/{id}"
    description: "Read one client laboratory, recomputing its derived counters on read"
    roles: [ReferenceLabOperations, LabBillingSpecialist, UtilizationReviewer, LabClientAdmin]
    code: 200
    input: []
    output: ClientLaboratory
    side_effects: ["recompute interface_status, outstanding_balance_cents, billable_line_count, forward_utilization_score and settled_utilization_score"]
  - method: POST
    path: "/reference-lab/client-laboratories/{id}/publish-requirements"
    description: "Publish the specimen requirement note and requisition format to the client"
    roles: [LabClientAdmin, ReferenceLabOperations]
    code: 200
    input: []
    output: ClientLaboratory
    side_effects: ["client_laboratory.requirement_notes_published_at stamped from the logical clock", "client_laboratory.onboarding_status advances to REQUIREMENTS_PUBLISHED then to COMPLETE when both a requirement note and at least one CourierRun exist", "any UtilizationAdvisory of this client in status OPEN transitions to SENT"]
  - method: POST
    path: "/reference-lab/client-laboratories/{id}/activate"
    description: "Move a fully onboarded client to ACTIVE"
    roles: [LabClientAdmin, ReferenceLabOperations]
    code: 200
    input: []
    output: ClientLaboratory
    side_effects: ["client_laboratory.status -> ACTIVE"]
  - method: POST
    path: "/reference-lab/client-laboratories/{id}/suspend"
    description: "Suspend a client, aborting its planned courier legs"
    roles: [ReferenceLabOperations]
    code: 200
    input: []
    output: ClientLaboratory
    side_effects: ["client_laboratory.status -> SUSPENDED", "cascade: every CourierRun of this client in PLANNED -> ABORTED"]
  - method: POST
    path: "/reference-lab/client-laboratories/{id}/reinstate"
    description: "Lift a suspension and return the client to ACTIVE"
    roles: [LabClientAdmin, ReferenceLabOperations]
    code: 200
    input: []
    output: ClientLaboratory
    side_effects: ["client_laboratory.status -> ACTIVE"]
  - method: POST
    path: "/reference-lab/client-laboratories/{id}/settle-balance"
    description: "Apply a settlement to the client ledger, which may lift a CREDIT_HOLD"
    roles: [LabBillingSpecialist]
    code: 200
    input: [settlement_amount_cents]
    output: ClientLaboratory
    side_effects: ["billing_ledger.voided_cents increased by the settlement amount", "billing_ledger.net_billed_cents recomputed", "client_laboratory.outstanding_balance_cents recomputed", "client_laboratory.status -> ACTIVE when the recomputed balance is at or below credit_limit_cents"]
  - method: POST
    path: "/reference-lab/client-laboratories/{id}/deactivate"
    description: "Retire a suspended client with no live orders"
    roles: [ReferenceLabOperations]
    code: 200
    input: []
    output: ClientLaboratory
    side_effects: ["client_laboratory.status -> INACTIVE"]

  # --- CourierRun ------------------------------------------------------------
  - method: POST
    path: "/reference-lab/courier-runs"
    description: "Book a courier pickup leg against a client, subject to vehicle overlap and OCC checks"
    roles: [CourierCoordinator]
    code: 201
    input: [client_laboratory_id, route_code, origin_city, destination_city, vehicle_id, scheduled_departure_at, scheduled_arrival_at, scheduled_pickup_at, scheduled_delivery_at, temperature_control_mode, expected_client_laboratory_version]
    output: CourierRun
    side_effects: ["courier_run created in PLANNED", "compute transit_allowance_minutes chronologically over same-route legs", "increments ClientLaboratory.version by 1"]
  - method: GET
    path: "/reference-lab/courier-runs"
    description: "List courier legs, filterable by owning client"
    roles: [CourierCoordinator, AccessioningTechnologist, ReferenceLabOperations, LabClientAdmin]
    code: 200
    input: ["client_laboratory_id?", "status?", "limit?", "offset?"]
    output: CourierRun[]
    side_effects: []
  - method: GET
    path: "/reference-lab/courier-runs/{id}"
    description: "Read one courier leg"
    roles: [CourierCoordinator, AccessioningTechnologist, ReferenceLabOperations, LabClientAdmin]
    code: 200
    input: []
    output: CourierRun
    side_effects: []
  - method: POST
    path: "/reference-lab/courier-runs/{id}/dispatch"
    description: "Dispatch a planned leg"
    roles: [CourierCoordinator]
    code: 200
    input: []
    output: CourierRun
    side_effects: ["courier_run.status -> DISPATCHED"]
  - method: POST
    path: "/reference-lab/courier-runs/{id}/recall"
    description: "Recall a dispatched leg before the vehicle departs"
    roles: [CourierCoordinator]
    code: 200
    input: []
    output: CourierRun
    side_effects: ["courier_run.status -> PLANNED"]
  - method: POST
    path: "/reference-lab/courier-runs/{id}/arrive"
    description: "Complete a leg that has reached its delivery instant"
    roles: [AccessioningTechnologist]
    code: 200
    input: []
    output: CourierRun
    side_effects: ["courier_run.status -> COMPLETED", "recompute courier_run.specimen_count"]

  # --- TestCatalogEntry ------------------------------------------------------
  - method: POST
    path: "/reference-lab/test-catalog-entries"
    description: "Create a catalog entry in DRAFT with its specimen requirements and reflex rule"
    roles: [LabClientAdmin, ReferenceLabOperations]
    code: 201
    input: [test_code, test_name, test_category, method, required_specimen_type, container_type, min_volume_ml, transport_temperature, stability_hours_ambient, stability_hours_refrigerated, stability_hours_frozen, base_tat_hours, list_price_cents, client_price_cents, floor_price_cents, "reference_low?", "reference_high?", critical_value_low, critical_value_high, reflex_test_code, reflex_condition, reflex_within_hours, reflex_min_remaining_hours, is_utilization_managed]
    output: TestCatalogEntry
    side_effects: ["test_catalog_entry created in DRAFT"]
  - method: GET
    path: "/reference-lab/test-catalog-entries"
    description: "List catalog entries, filterable by status and category"
    roles: [LabClientAdmin, InterfaceAnalyst, ReferenceLabOperations, AccessioningTechnologist, MedicalTechnologist, Pathologist, LabBillingSpecialist, UtilizationReviewer, CourierCoordinator, MedicalDirector]
    code: 200
    input: ["status?", "test_category?", "limit?", "offset?"]
    output: TestCatalogEntry[]
    side_effects: []
  - method: GET
    path: "/reference-lab/test-catalog-entries/{id}"
    description: "Read one catalog entry with its published requirements"
    roles: [LabClientAdmin, InterfaceAnalyst, ReferenceLabOperations, AccessioningTechnologist, MedicalTechnologist, Pathologist, LabBillingSpecialist, UtilizationReviewer, CourierCoordinator, MedicalDirector]
    code: 200
    input: []
    output: TestCatalogEntry
    side_effects: []
  - method: POST
    path: "/reference-lab/test-catalog-entries/{id}/publish"
    description: "Publish a draft or deprecated entry to clients"
    roles: [LabClientAdmin]
    code: 200
    input: []
    output: TestCatalogEntry
    side_effects: ["test_catalog_entry.status -> PUBLISHED", "test_catalog_entry.updated_at refreshed, which makes every previously certified order-carrying InterfaceBuild stale"]
  - method: POST
    path: "/reference-lab/test-catalog-entries/{id}/deprecate"
    description: "Deprecate a published entry so it is no longer orderable"
    roles: [LabClientAdmin]
    code: 200
    input: []
    output: TestCatalogEntry
    side_effects: ["test_catalog_entry.status -> DEPRECATED"]
  - method: POST
    path: "/reference-lab/test-catalog-entries/{id}/withdraw"
    description: "Withdraw a published or deprecated entry, cascading rejects down to the client ledger"
    roles: [ReferenceLabOperations]
    code: 200
    input: []
    output: TestCatalogEntry
    side_effects: ["test_catalog_entry.status -> WITHDRAWN", "cascade hop 1: affected Specimens -> REJECTED with rejection_reason_code TEST_WITHDRAWN", "cascade hop 2: their SendOutOrders -> CANCELLED", "cascade hop 3: their OrderTestLines -> CANCELLED", "cascade hop 4: affected orders -> billing_status VOIDED and billing_ledger.voided_cents increased", "cascade hop 5: client_laboratory.outstanding_balance_cents and billable_line_count recomputed"]

  # --- Specimen --------------------------------------------------------------
  - method: POST
    path: "/reference-lab/specimens"
    description: "Record a specimen received from a client leg, with condition assessment on intake"
    roles: [AccessioningTechnologist, CourierCoordinator]
    code: 201
    input: [client_laboratory_id, courier_run_id, accession_number, patient_mrn, specimen_type, container_type, volume_ml, collection_at, received_at, transport_temperature, condition, condition_reason_code]
    output: Specimen
    side_effects: ["specimen created in RECEIVED", "recompute the parent courier_run.specimen_count"]
  - method: GET
    path: "/reference-lab/specimens"
    description: "List specimens, filterable by client, inbound leg or parent tube"
    roles: [AccessioningTechnologist, MedicalTechnologist, Pathologist, ReferenceLabOperations]
    code: 200
    input: ["client_laboratory_id?", "courier_run_id?", "aliquot_parent_id?", "status?", "limit?", "offset?"]
    output: Specimen[]
    side_effects: []
  - method: GET
    path: "/reference-lab/specimens/{id}"
    description: "Read one specimen, recomputing remaining stability on read"
    roles: [AccessioningTechnologist, MedicalTechnologist, Pathologist, ReferenceLabOperations]
    code: 200
    input: []
    output: Specimen
    side_effects: ["recompute remaining_stability_hours and total_aliquot_volume_ml"]
  - method: POST
    path: "/reference-lab/specimens/{id}/accession"
    description: "Accession a received specimen, or re-accession one rejected by a catalog withdrawal"
    roles: [AccessioningTechnologist]
    code: 200
    input: []
    output: Specimen
    side_effects: ["specimen.status -> ACCESSIONED", "bubble up: the owning SendOutOrder in SUBMITTED -> ACCESSIONED"]
  - method: POST
    path: "/reference-lab/specimens/{id}/begin-testing"
    description: "Start testing on an accessioned specimen with a live analyzer run"
    roles: [MedicalTechnologist]
    code: 200
    input: []
    output: Specimen
    side_effects: ["specimen.status -> IN_TESTING", "owning OrderTestLines PENDING -> IN_PROGRESS", "owning SendOutOrder ACCESSIONED -> IN_TESTING", "compute rush_tier, effective_tat_hours and expected_result_at on the order"]
  - method: POST
    path: "/reference-lab/specimens/{id}/reject"
    description: "Reject a specimen and cascade the rejection to the order"
    roles: [AccessioningTechnologist]
    code: 200
    input: [rejection_reason_code]
    output: Specimen
    side_effects: ["specimen.status -> REJECTED", "owning SendOutOrder -> CANCELLED", "owning OrderTestLines -> CANCELLED"]
  - method: POST
    path: "/reference-lab/specimens/{id}/aliquots"
    description: "Derive an aliquot tube from a parent specimen"
    roles: [AccessioningTechnologist]
    code: 201
    input: [aliquot_volume_ml, container_type, accession_number]
    output: Specimen
    side_effects: ["child Specimen created with aliquot_parent_id set", "parent Specimen.total_aliquot_volume_ml recomputed", "parent Specimen -> REJECTED with condition INSUFFICIENT_VOLUME when the aliquot total exceeds the parent volume"]
  - method: DELETE
    path: "/reference-lab/specimens/{id}/aliquots/{aliquot_id}"
    description: "Remove a derived aliquot tube from its parent"
    roles: [AccessioningTechnologist]
    code: 200
    input: []
    output: Specimen
    side_effects: ["the child Specimen row is removed from the aliquot set", "parent Specimen.total_aliquot_volume_ml recomputed as the sum over the remaining children"]

  # --- SendOutOrder ----------------------------------------------------------
  - method: POST
    path: "/reference-lab/send-out-orders"
    description: "Submit a send-out requisition with its ordered test lines"
    roles: [AccessioningTechnologist, LabClientAdmin, MedicalDirector]
    code: 201
    input: [client_laboratory_id, specimen_id, order_number, patient_mrn, client_requested_at, priority, test_lines, override_utilization_guard]
    output: SendOutOrder
    side_effects: ["send_out_order created with order_status SUBMITTED and billing_status UNBILLED", "one OrderTestLine created per entry of test_lines in status PENDING", "raise a UtilizationAdvisory when a utilization-managed test repeats for the same patient_mrn"]
  - method: GET
    path: "/reference-lab/send-out-orders"
    description: "List send-out orders, filterable by client, specimen or triggering reflex order"
    roles: [AccessioningTechnologist, MedicalTechnologist, Pathologist, InterfaceAnalyst, LabBillingSpecialist, ReferenceLabOperations, UtilizationReviewer, MedicalDirector, LabClientAdmin]
    code: 200
    input: ["client_laboratory_id?", "specimen_id?", "reflex_source_order_id?", "order_status?", "limit?", "offset?"]
    output: SendOutOrder[]
    side_effects: []
  - method: GET
    path: "/reference-lab/send-out-orders/{id}"
    description: "Read one send-out order with its computed TAT and charge fields"
    roles: [AccessioningTechnologist, MedicalTechnologist, Pathologist, InterfaceAnalyst, LabBillingSpecialist, ReferenceLabOperations, UtilizationReviewer, MedicalDirector, LabClientAdmin]
    code: 200
    input: []
    output: SendOutOrder
    side_effects: []
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/accession"
    description: "Accession an order and price it provisionally"
    roles: [AccessioningTechnologist]
    code: 200
    input: []
    output: SendOutOrder
    side_effects: ["order_status -> ACCESSIONED", "billing_status -> PROVISIONAL", "compute provisional_charge_cents with the provisional variant"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/enter-results"
    description: "Enter or amend discrete result values and critical-value documentation on the order's lines"
    roles: [MedicalTechnologist]
    code: 200
    input: [expected_send_out_order_version, result_lines]
    output: SendOutOrder
    side_effects: ["OrderTestLine.result_value, result_units and critical_value_notified_to written; entered_by_user_id stamped from X-User-ID", "recompute OrderTestLine.result_flag", "increments SendOutOrder.version by 1"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/release-results"
    description: "Release results, pricing every line and billing the client"
    roles: [Pathologist]
    code: 200
    input: [interpretive_comment]
    output: SendOutOrder
    side_effects: ["order_status -> RESULT_RELEASED", "every OrderTestLine -> FINAL with result_released_at stamped", "compute billed_cents and tat_credit_cents per line, then order_final_charge_cents and charge_variance_cents", "billing_status -> BILLED and billing_ledger.billed_cents increased", "client posture may flip to CREDIT_HOLD", "order may move immediately to REFLEX_PENDING"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/cancel"
    description: "Cancel an in-flight order and void any billed lines"
    roles: [ReferenceLabOperations, LabClientAdmin]
    code: 200
    input: []
    output: SendOutOrder
    side_effects: ["order_status -> CANCELLED", "OrderTestLines -> CANCELLED", "billing_status -> VOIDED when billed lines exist and billing_ledger.voided_cents increased"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/hold"
    description: "Park an order for manual review"
    roles: [ReferenceLabOperations]
    code: 200
    input: []
    output: SendOutOrder
    side_effects: ["order_status -> ON_HOLD", "OrderTestLines IN_PROGRESS -> PENDING"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/release-hold"
    description: "Return a held order to intake"
    roles: [LabBillingSpecialist]
    code: 200
    input: []
    output: SendOutOrder
    side_effects: ["order_status -> SUBMITTED"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/repeat-test"
    description: "Flag a released line for repeat and spawn its replacement line"
    roles: [Pathologist]
    code: 200
    input: [order_test_line_id]
    output: SendOutOrder
    side_effects: ["target OrderTestLine -> REPEAT_REQUIRED", "a replacement OrderTestLine is created in PENDING with is_add_on true"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/order-add-on-test"
    description: "Append an add-on test line within the specimen's remaining stability"
    roles: [AccessioningTechnologist]
    code: 200
    input: [test_catalog_entry_id, line_sequence, add_on_at]
    output: SendOutOrder
    side_effects: ["a new OrderTestLine is created with is_add_on true and add_on_at stamped", "any OrderTestLine of this order in INTERIM -> IN_PROGRESS"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/order-reflex-test"
    description: "Place a manual reflex order against the triggering result, inside the reflex window"
    roles: [Pathologist]
    code: 200
    input: [test_catalog_entry_id, line_sequence, add_on_at]
    output: SendOutOrder
    side_effects: ["a new OrderTestLine is created with is_add_on true for the reflex target", "order_status -> REFLEX_PENDING"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/reflex-cancel"
    description: "Withdraw a pending reflex, cancelling the spawned reflex order"
    roles: [Pathologist]
    code: 200
    input: []
    output: SendOutOrder
    side_effects: ["the reflex SendOutOrder spawned by this order -> CANCELLED with its line CANCELLED", "order_status -> RESULT_RELEASED"]
  - method: POST
    path: "/reference-lab/send-out-orders/{id}/charge"
    description: "Post the order's final charge against the client ledger"
    roles: [LabBillingSpecialist]
    code: 200
    input: []
    output: SendOutOrder
    side_effects: ["billing_status -> BILLED", "billing_ledger.billed_cents and charge_entry_count increased", "client_laboratory.outstanding_balance_cents recomputed and the posture may flip to CREDIT_HOLD"]

  # --- OrderTestLine ---------------------------------------------------------
  - method: GET
    path: "/reference-lab/order-test-lines"
    description: "List test lines, filterable by owning order or by catalog entry"
    roles: [MedicalTechnologist, Pathologist, LabBillingSpecialist, UtilizationReviewer, ReferenceLabOperations, AccessioningTechnologist, MedicalDirector]
    code: 200
    input: ["send_out_order_id?", "test_catalog_entry_id?", "line_status?", "limit?", "offset?"]
    output: OrderTestLine[]
    side_effects: []
  - method: GET
    path: "/reference-lab/order-test-lines/{id}"
    description: "Read one test line with its computed charge and flag"
    roles: [MedicalTechnologist, Pathologist, LabBillingSpecialist, UtilizationReviewer, ReferenceLabOperations, AccessioningTechnologist, MedicalDirector]
    code: 200
    input: []
    output: OrderTestLine
    side_effects: []

  # --- InstrumentRun ---------------------------------------------------------
  - method: POST
    path: "/reference-lab/instrument-runs"
    description: "Book an analyzer window for a test, subject to the decontamination buffer"
    roles: [MedicalTechnologist]
    code: 201
    input: [test_catalog_entry_id, instrument_code, section, decontamination_buffer_minutes, reserved_start_at, reserved_end_at]
    output: InstrumentRun
    side_effects: ["instrument_run created in RESERVED", "occupied_until_at computed as reserved_end_at plus decontamination_buffer_minutes"]
  - method: GET
    path: "/reference-lab/instrument-runs"
    description: "List analyzer bookings, filterable by assay"
    roles: [MedicalTechnologist, ReferenceLabOperations]
    code: 200
    input: ["test_catalog_entry_id?", "instrument_code?", "run_status?", "limit?", "offset?"]
    output: InstrumentRun[]
    side_effects: []
  - method: GET
    path: "/reference-lab/instrument-runs/{id}"
    description: "Read one analyzer booking"
    roles: [MedicalTechnologist, ReferenceLabOperations]
    code: 200
    input: []
    output: InstrumentRun
    side_effects: []
  - method: POST
    path: "/reference-lab/instrument-runs/{id}/abort"
    description: "Abort a reserved booking and free its slot"
    roles: [MedicalTechnologist]
    code: 200
    input: []
    output: InstrumentRun
    side_effects: ["run_status -> ABORTED", "the freed window no longer participates in the decontamination-buffer overlap rule"]
  - method: PATCH
    path: "/reference-lab/instrument-runs/{id}"
    description: "Rebook an aborted analyzer window in place"
    roles: [MedicalTechnologist]
    code: 200
    input: [reserved_start_at, reserved_end_at]
    output: InstrumentRun
    side_effects: ["run_status -> RESERVED", "occupied_until_at recomputed"]

  # --- InterfaceBuild --------------------------------------------------------
  - method: POST
    path: "/reference-lab/interface-builds"
    description: "Open an interface build for a client"
    roles: [InterfaceAnalyst]
    code: 201
    input: [client_laboratory_id, build_version_label, format, order_interface_enabled, result_interface_enabled]
    output: InterfaceBuild
    side_effects: ["interface_build created in DRAFT", "recompute client_laboratory.interface_status"]
  - method: GET
    path: "/reference-lab/interface-builds"
    description: "List interface builds, filterable by client"
    roles: [InterfaceAnalyst, ReferenceLabOperations, LabClientAdmin]
    code: 200
    input: ["client_laboratory_id?", "status?", "limit?", "offset?"]
    output: InterfaceBuild[]
    side_effects: []
  - method: GET
    path: "/reference-lab/interface-builds/{id}"
    description: "Read one interface build"
    roles: [InterfaceAnalyst, ReferenceLabOperations, LabClientAdmin]
    code: 200
    input: []
    output: InterfaceBuild
    side_effects: []
  - method: POST
    path: "/reference-lab/interface-builds/{id}/start-build"
    description: "Begin interface construction, or revive a retired build to a blank build"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: InterfaceBuild
    side_effects: ["interface_build.status -> IN_BUILD", "recompute client_laboratory.interface_status"]
  - method: POST
    path: "/reference-lab/interface-builds/{id}/certify"
    description: "Certify a build after a successful round-trip, releasing held messages"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: InterfaceBuild
    side_effects: ["interface_build.status -> CERTIFIED and certified_at stamped", "every held ResultInterfaceMessage of this client -> VALIDATED", "recompute client_laboratory.interface_status"]
  - method: POST
    path: "/reference-lab/interface-builds/{id}/supersede"
    description: "Supersede a certified build with a newer one"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: InterfaceBuild
    side_effects: ["interface_build.status -> SUPERSEDED and superseded_at stamped", "every ResultInterfaceMessage of this build in QUEUED or VALIDATED -> HELD", "recompute client_laboratory.interface_status"]
  - method: POST
    path: "/reference-lab/interface-builds/{id}/retire"
    description: "Retire a superseded build with no live messages"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: InterfaceBuild
    side_effects: ["interface_build.status -> RETIRED"]
  - method: PATCH
    path: "/reference-lab/interface-builds/{id}"
    description: "Amend a build's interface flags, or return an uncertified build to DRAFT"
    roles: [InterfaceAnalyst]
    code: 200
    input: [order_interface_enabled, result_interface_enabled, status]
    output: InterfaceBuild
    side_effects: ["interface_build fields amended", "interface_build.status -> DRAFT when status DRAFT is supplied for an uncertified build", "recompute client_laboratory.interface_status"]

  # --- ResultInterfaceMessage ------------------------------------------------
  - method: POST
    path: "/reference-lab/result-interface-messages"
    description: "Queue an outbound interface message for an order against a certified build"
    roles: [InterfaceAnalyst, MedicalTechnologist]
    code: 201
    input: [send_out_order_id, interface_build_id, message_type, control_id, expected_send_out_order_version]
    output: ResultInterfaceMessage
    side_effects: ["result_interface_message created in QUEUED", "increments SendOutOrder.version by 1", "an INTERIM message moves the order to INTERIM_REPORTED with its in-progress lines set to INTERIM"]
  - method: GET
    path: "/reference-lab/result-interface-messages"
    description: "List interface messages, filterable by order or build"
    roles: [InterfaceAnalyst, ReferenceLabOperations]
    code: 200
    input: ["send_out_order_id?", "interface_build_id?", "status?", "limit?", "offset?"]
    output: ResultInterfaceMessage[]
    side_effects: []
  - method: GET
    path: "/reference-lab/result-interface-messages/{id}"
    description: "Read one interface message"
    roles: [InterfaceAnalyst, ReferenceLabOperations]
    code: 200
    input: []
    output: ResultInterfaceMessage
    side_effects: []
  - method: POST
    path: "/reference-lab/result-interface-messages/{id}/validate"
    description: "Validate a message against a certified build, or re-validate a failed message within the retry limit"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: ResultInterfaceMessage
    side_effects: ["status -> VALIDATED", "discrete_field_count computed from the order's lines in INTERIM and FINAL"]
  - method: POST
    path: "/reference-lab/result-interface-messages/{id}/transmit"
    description: "Transmit a validated message and release the specimen"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: ResultInterfaceMessage
    side_effects: ["status -> TRANSMITTED and transmitted_at stamped", "retry_count reset to 0", "a RESULT message moves the owning Specimen to RELEASED"]
  - method: POST
    path: "/reference-lab/result-interface-messages/{id}/fail"
    description: "Record a failed transmission attempt and compute the next backoff"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: ResultInterfaceMessage
    side_effects: ["status -> FAILED", "retry_count incremented", "next_retry_offset_minutes computed as min(BASE * 2^retry_count, CAP)"]
  - method: POST
    path: "/reference-lab/result-interface-messages/{id}/hold"
    description: "Hold a message while its build is not certified"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: ResultInterfaceMessage
    side_effects: ["status -> HELD"]
  - method: POST
    path: "/reference-lab/result-interface-messages/{id}/release-hold"
    description: "Release a held message once a certified build exists"
    roles: [InterfaceAnalyst]
    code: 200
    input: []
    output: ResultInterfaceMessage
    side_effects: ["status -> VALIDATED"]
  - method: POST
    path: "/reference-lab/result-interface-messages/{id}/acknowledge"
    description: "Record the client's acknowledgement of a transmitted message"
    roles: [InterfaceAnalyst, ReferenceLabOperations]
    code: 200
    input: [control_id]
    output: ResultInterfaceMessage
    side_effects: ["status -> ACKNOWLEDGED", "a RESULT message with no live reflex order moves the owning SendOutOrder to CLOSED"]

  # --- BillingLedger ---------------------------------------------------------
  - method: POST
    path: "/reference-lab/billing-ledgers"
    description: "Open the billing ledger for a client"
    roles: [LabBillingSpecialist]
    code: 201
    input: [client_laboratory_id]
    output: BillingLedger
    side_effects: ["billing_ledger created in OPEN with billed_cents, voided_cents, net_billed_cents and charge_entry_count at zero"]
  - method: GET
    path: "/reference-lab/billing-ledgers"
    description: "List client ledgers, filterable by client"
    roles: [LabBillingSpecialist, UtilizationReviewer, ReferenceLabOperations]
    code: 200
    input: ["client_laboratory_id?", "status?", "limit?", "offset?"]
    output: BillingLedger[]
    side_effects: []
  - method: GET
    path: "/reference-lab/billing-ledgers/{id}"
    description: "Read one client ledger"
    roles: [LabBillingSpecialist, UtilizationReviewer, ReferenceLabOperations]
    code: 200
    input: []
    output: BillingLedger
    side_effects: []
  - method: POST
    path: "/reference-lab/billing-ledgers/{id}/void-charges"
    description: "Void an order's charge, the compensating action paired with posting it"
    roles: [LabBillingSpecialist]
    code: 200
    input: [send_out_order_id, void_amount_cents]
    output: BillingLedger
    side_effects: ["billing_ledger.voided_cents increased by the void amount and net_billed_cents recomputed", "the order's billing_status -> VOIDED", "the client's outstanding_balance_cents recomputed"]

  # --- UtilizationAdvisory ---------------------------------------------------
  - method: POST
    path: "/reference-lab/utilization-advisories"
    description: "Raise a test-utilization advisory for a client and test"
    roles: [UtilizationReviewer, MedicalDirector]
    code: 201
    input: [client_laboratory_id, test_catalog_entry_id, source_order_id, advisory_type, message]
    output: UtilizationAdvisory
    side_effects: ["utilization_advisory created in OPEN", "both utilization metrics of the client recomputed"]
  - method: GET
    path: "/reference-lab/utilization-advisories"
    description: "List advisories, filterable by client, test or provoking order"
    roles: [UtilizationReviewer, MedicalDirector, LabClientAdmin, ReferenceLabOperations]
    code: 200
    input: ["client_laboratory_id?", "test_catalog_entry_id?", "source_order_id?", "status?", "limit?", "offset?"]
    output: UtilizationAdvisory[]
    side_effects: []
  - method: GET
    path: "/reference-lab/utilization-advisories/{id}"
    description: "Read one advisory"
    roles: [UtilizationReviewer, MedicalDirector, LabClientAdmin, ReferenceLabOperations]
    code: 200
    input: []
    output: UtilizationAdvisory
    side_effects: []
  - method: POST
    path: "/reference-lab/utilization-advisories/{id}/acknowledge"
    description: "Record the client's receipt of an advisory"
    roles: [LabClientAdmin]
    code: 200
    input: []
    output: UtilizationAdvisory
    side_effects: ["status -> SENT then ACKNOWLEDGED, with send_count incremented on the delivery step"]
  - method: POST
    path: "/reference-lab/utilization-advisories/{id}/dismiss"
    description: "Dismiss an advisory the client considers inapplicable"
    roles: [LabClientAdmin]
    code: 200
    input: []
    output: UtilizationAdvisory
    side_effects: ["status -> DISMISSED"]
  - method: POST
    path: "/reference-lab/utilization-advisories/{id}/escalate"
    description: "Escalate an ignored advisory to the laboratory medical director"
    roles: [ReferenceLabOperations, MedicalDirector]
    code: 200
    input: []
    output: UtilizationAdvisory
    side_effects: ["status -> ESCALATED", "both utilization metrics of the client recomputed and persisted"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:
  # -- auth / request shape ---------------------------------------------------
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not a declared role (validation priority 1)" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "the acting role is not listed for the endpoint (validation priority 2)" }
  - { id: ERR_CLIENT_SCOPE_VIOLATION, http: 403, condition: "a LabClientAdmin acts on a resource whose client_laboratory_id differs from its own X-User-ID (validation priority 2.5)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required body field is missing, a field carries an out-of-enum value, or a payload is unparseable" }

  # -- not found --------------------------------------------------------------
  - { id: ERR_CLIENT_LABORATORY_NOT_FOUND, http: 404, condition: "the client_laboratory_id path segment or body field does not resolve (validation priority 3 or 4)" }
  - { id: ERR_COURIER_RUN_NOT_FOUND, http: 404, condition: "the courier_run_id path segment or body field does not resolve" }
  - { id: ERR_TEST_CATALOG_ENTRY_NOT_FOUND, http: 404, condition: "the test catalog entry id does not resolve" }
  - { id: ERR_SPECIMEN_NOT_FOUND, http: 404, condition: "the specimen id path segment or body field does not resolve" }
  - { id: ERR_SEND_OUT_ORDER_NOT_FOUND, http: 404, condition: "the send-out order id does not resolve" }
  - { id: ERR_ORDER_TEST_LINE_NOT_FOUND, http: 404, condition: "the order_test_line_id does not resolve" }
  - { id: ERR_INSTRUMENT_RUN_NOT_FOUND, http: 404, condition: "the instrument run id does not resolve" }
  - { id: ERR_INTERFACE_BUILD_NOT_FOUND, http: 404, condition: "the interface build id does not resolve" }
  - { id: ERR_INTERFACE_MESSAGE_NOT_FOUND, http: 404, condition: "the result interface message id does not resolve" }
  - { id: ERR_BILLING_LEDGER_NOT_FOUND, http: 404, condition: "the billing ledger id does not resolve" }
  - { id: ERR_UTILIZATION_ADVISORY_NOT_FOUND, http: 404, condition: "the utilization advisory id does not resolve" }
  - { id: ERR_ALIQUOT_NOT_FOUND, http: 404, condition: "the aliquot_id in the delete path does not resolve, or the resolved row's aliquot_parent_id is not the parent specimen in the path" }

  # -- optimistic concurrency -------------------------------------------------
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (validation priority 4.5)" }

  # -- state ------------------------------------------------------------------
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target resource is not in a state from which the requested transition is declared (validation priority 5)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "the target resource sits in a declared terminal state and admits no further transition (validation priority 5.5)" }
  - { id: ERR_ORDER_NOT_ACCESSIBLE, http: 409, condition: "a specimen-level action requires its owning order to be in a specific earlier state that it no longer holds" }
  - { id: ERR_INTERFACE_RESULT_GATED, http: 409, condition: "a result interface message is queued outside the order states that admit it, or a premature release is attempted before every line has a result value (validation priority 20)" }
  - { id: ERR_RETRY_LIMIT_REACHED, http: 409, condition: "a failed interface message with retry_count 5 is re-validated (validation priority 20)" }

  # -- catalog / interface integrity -----------------------------------------
  - { id: ERR_EMPTY_REQUISITION, http: 400, condition: "a send-out requisition carries an empty test_lines set (validation priority 6.5)" }
  - { id: ERR_CATALOG_ENTRY_NOT_PUBLISHED, http: 422, condition: "an ordered test catalog entry is not PUBLISHED, or the ordering client's certified order-carrying build predates the entry's last edit (validation priority 6)" }
  - { id: ERR_INTERFACE_BUILD_NOT_CERTIFIED, http: 422, condition: "the referenced interface build is not CERTIFIED, or belongs to a different client than the order (validation priority 7)" }
  - { id: ERR_DUPLICATE_TEST_CODE, http: 409, condition: "a non-WITHDRAWN catalog entry already carries the requested test_code (validation priority 17)" }
  - { id: ERR_DUPLICATE_ACCESSION_NUMBER, http: 409, condition: "an existing specimen already carries the requested accession_number (validation priority 17)" }
  - { id: ERR_CONTROL_ID_REUSED, http: 409, condition: "the client has already used the requested interface control_id (validation priority 17)" }

  # -- specimen acceptability -------------------------------------------------
  - { id: ERR_SPECIMEN_TYPE_MISMATCH, http: 422, condition: "the specimen_type or container_type does not match an ordered test's required_specimen_type or container_type (validation priority 8)" }
  - { id: ERR_INSUFFICIENT_SPECIMEN_VOLUME, http: 422, condition: "volume_ml is below the maximum min_volume_ml over the ordered tests; equality passes (validation priority 9)" }
  - { id: ERR_TRANSPORT_TEMPERATURE_EXCEEDED, http: 422, condition: "the observed transport_temperature differs from an ordered test's declared transport_temperature (validation priority 9)" }
  - { id: ERR_SPECIMEN_STABILITY_EXCEEDED, http: 422, condition: "elapsed hours since collection exceed the binding stability window; equality passes (validation priority 10)" }
  - { id: ERR_REFLEX_WINDOW_EXPIRED, http: 422, condition: "the reflex or add-on request falls outside the triggering catalog entry's reflex_within_hours of the triggering result release; equality passes (validation priority 10)" }
  - { id: ERR_INSUFFICIENT_STABILITY_FOR_REFLEX, http: 422, condition: "remaining_stability_hours is at or below reflex_min_remaining_hours; equality FAILS this strict bound (validation priority 11)" }
  - { id: ERR_REFLEX_CONDITION_NOT_MET, http: 422, condition: "the triggering catalog entry's reflex_condition is not satisfied by the triggering result value (validation priority 12)" }
  - { id: ERR_SPECIMEN_NOT_ACCEPTABLE, http: 422, condition: "a specimen with a non-ACCEPTABLE condition is presented for accessioning without a condition_reason_code" }

  # -- critical value and segregation of duties -------------------------------
  - { id: ERR_CRITICAL_VALUE_NOT_NOTIFIED, http: 422, condition: "a line whose result_flag is CRITICAL_HIGH or CRITICAL_LOW lacks critical_value_notified_to or critical_value_notified_at at release (validation priority 13)" }
  - { id: ERR_SOD_RESULT_ENTRY_RELEASE, http: 403, condition: "the releasing Pathologist's X-User-ID equals entered_by_user_id on a line of the same order (validation priority 14)" }

  # -- scheduling conflicts ---------------------------------------------------
  - { id: ERR_INSTRUMENT_DOUBLE_BOOKED, http: 409, condition: "the requested analyzer window collides with a non-ABORTED run on the same instrument_code and section once the decontamination buffer is applied, or reserved_start_at is not strictly before reserved_end_at (validation priority 15)" }
  - { id: ERR_COURIER_LEG_OVERLAP, http: 409, condition: "the requested leg properly overlaps another PLANNED, DISPATCHED or IN_TRANSIT leg on the same vehicle (validation priority 16)" }

  # -- utilization ------------------------------------------------------------
  - { id: ERR_UTILIZATION_GUARD_BLOCKED, http: 409, condition: "a utilization-managed test repeats for the same patient_mrn while an advisory for the same client and test is already ESCALATED and override_utilization_guard is false (validation priority 18)" }

  # -- compensating actions ---------------------------------------------------
  - { id: ERR_VOID_AMOUNT_MISMATCH, http: 409, condition: "a void amount does not exactly equal a prior charge on the same order, so the compensating pair could not cancel (validation priority 19)" }
  - { id: ERR_ALIQUOT_PARENT_MISMATCH, http: 409, condition: "the aliquot target does not belong to the parent specimen in the path (validation priority 19)" }
  - { id: ERR_ALIQUOT_OVERDRAW, http: 409, condition: "creating the aliquot would push total_aliquot_volume_ml above volume_ml, rejecting the parent specimen with condition INSUFFICIENT_VOLUME" }

  # -- client state and temporality ------------------------------------------
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 403, condition: "the ordering client is SUSPENDED or INACTIVE, or its requirement note has not been published (validation priority 21)" }
  - { id: ERR_INVALID_TEMPORAL_WINDOW, http: 422, condition: "collection_at is after received_at, or client_requested_at is after the logical clock (validation priority 22)" }
  - { id: ERR_DUPLICATE_ADD_ON_LINE, http: 409, condition: "an add-on or reflex line duplicates an existing non-CANCELLED line for the same test on the same order (validation priority 23)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "posting the charge would leave outstanding_balance_cents above credit_limit_cents for a CLIENT-routed account whose ledger is not on hold (validation priority 24)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================

roles:
  - name: LabClientAdmin
    description: "Acting administrator of a single client laboratory; the X-User-ID is that ClientLaboratory's id"
    identity: "entity_backed:ClientLaboratory"
    exclusive_operations:
      - "POST /client-laboratories/{id}/publish-requirements for its own client only"
      - "POST /test-catalog-entries/{id}/publish"
      - "POST /test-catalog-entries/{id}/deprecate"
      - "POST /utilization-advisories/{id}/acknowledge"
      - "POST /utilization-advisories/{id}/dismiss"
    shared_operations:
      - "POST /client-laboratories/{id}/activate"
      - "POST /client-laboratories/{id}/reinstate"
      - "POST /send-out-orders"
      - "POST /send-out-orders/{id}/cancel"
      - "POST /test-catalog-entries"
  - name: CourierCoordinator
    description: "Dispatch operator who plans and runs pickup routes"
    identity: opaque
    exclusive_operations:
      - "POST /courier-runs"
      - "POST /courier-runs/{id}/dispatch"
      - "POST /courier-runs/{id}/recall"
    shared_operations:
      - "POST /specimens"
  - name: AccessioningTechnologist
    description: "Receiving bench technologist who accessions, assesses and rejects specimens"
    identity: opaque
    exclusive_operations:
      - "POST /specimens/{id}/accession"
      - "POST /specimens/{id}/reject"
      - "POST /specimens/{id}/aliquots"
      - "DELETE /specimens/{id}/aliquots/{aliquot_id}"
      - "POST /send-out-orders/{id}/accession"
      - "POST /send-out-orders/{id}/order-add-on-test"
    shared_operations:
      - "POST /specimens"
      - "POST /send-out-orders"
  - name: MedicalTechnologist
    description: "Bench technologist who books analyzer time, starts runs and enters results"
    identity: opaque
    exclusive_operations:
      - "POST /specimens/{id}/begin-testing"
      - "POST /send-out-orders/{id}/enter-results"
      - "POST /instrument-runs"
      - "PATCH /instrument-runs/{id}"
      - "POST /instrument-runs/{id}/abort"
    shared_operations:
      - "POST /result-interface-messages"
  - name: InterfaceAnalyst
    description: "Interface engineer who builds, certifies and operates client interfaces"
    identity: opaque
    exclusive_operations:
      - "POST /interface-builds"
      - "POST /interface-builds/{id}/start-build"
      - "POST /interface-builds/{id}/certify"
      - "POST /interface-builds/{id}/supersede"
      - "POST /interface-builds/{id}/retire"
      - "PATCH /interface-builds/{id}"
      - "POST /result-interface-messages/{id}/validate"
      - "POST /result-interface-messages/{id}/transmit"
      - "POST /result-interface-messages/{id}/fail"
      - "POST /result-interface-messages/{id}/hold"
      - "POST /result-interface-messages/{id}/release-hold"
    shared_operations:
      - "POST /result-interface-messages"
      - "POST /result-interface-messages/{id}/acknowledge"
  - name: Pathologist
    description: "Laboratory physician who releases results, documents critical calls and orders reflex testing"
    identity: opaque
    exclusive_operations:
      - "POST /send-out-orders/{id}/release-results"
      - "POST /send-out-orders/{id}/repeat-test"
      - "POST /send-out-orders/{id}/order-reflex-test"
      - "POST /send-out-orders/{id}/reflex-cancel"
    shared_operations: []
  - name: MedicalDirector
    description: "Laboratory director who adjudicates utilization escalations"
    identity: opaque
    exclusive_operations:
      - "POST /utilization-advisories"
    shared_operations:
      - "POST /send-out-orders"
      - "POST /utilization-advisories/{id}/escalate"
  - name: LabBillingSpecialist
    description: "Revenue-cycle specialist who posts charges, voids them and settles client balances"
    identity: opaque
    exclusive_operations:
      - "POST /billing-ledgers"
      - "POST /billing-ledgers/{id}/void-charges"
      - "POST /client-laboratories/{id}/settle-balance"
      - "POST /send-out-orders/{id}/charge"
      - "POST /send-out-orders/{id}/release-hold"
    shared_operations: []
  - name: UtilizationReviewer
    description: "Reviewer who advises clients on unnecessary or duplicative ordering"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /utilization-advisories"
  - name: ReferenceLabOperations
    description: "Reference laboratory operations operator with override authority over client posture and catalog withdrawal"
    identity: opaque
    exclusive_operations:
      - "POST /client-laboratories"
      - "POST /client-laboratories/{id}/suspend"
      - "POST /client-laboratories/{id}/deactivate"
      - "POST /test-catalog-entries/{id}/withdraw"
      - "POST /send-out-orders/{id}/hold"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /client-laboratories/{id}/activate"
      - "POST /client-laboratories/{id}/reinstate"
      - "POST /client-laboratories/{id}/publish-requirements"
      - "POST /test-catalog-entries"
      - "POST /send-out-orders/{id}/cancel"
      - "POST /utilization-advisories/{id}/escalate"
      - "POST /result-interface-messages/{id}/acknowledge"