# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-Difficulty claims)
# Walks the claim-extraction guide against SCAFFOLD.yaml §1.1–§1.7. Real
# instances carry an executable test_recipe; excluded_because stubs point at the
# §1.8 instance that already exercises the corner.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: student_create_returns_system_and_computed_fields
        claim_type: Creation
        grounds: [entities.Student, endpoints]
        distinguishing_aspect: "POST /students returns 201 with a prefix-less UUID id, enrollment_status ENROLLED, all counters 0, attendance_rate_recorded null."
        test_recipe:
          setup: ["A school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Ent School" }
              as: Administrator
              captures: { sch: "$.data.id" }
          trigger:
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Sam New", grade_level: 7 }
              as: Administrator
              captures: { sid: "$.data.id" }
          assert:
            - "response HTTP status == 201"
            - "Student.${sid}.enrollment_status == ENROLLED"
            - "Student.${sid}.unexcused_count == 0 and Student.${sid}.present_count == 0"
            - "Student.${sid}.attendance_rate_recorded == null"

      - name: get_case_not_found
        claim_type: Not Found
        grounds: [entities.TruancyCase, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /cases/{random uuid} with no such case → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_student_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Student.fields.grade_level, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /students without grade_level → ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Req School" }
              as: Administrator
              captures: { sch: "$.data.id" }
          trigger:
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "No Grade" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: create_staff_invalid_role_enum
        claim_type: Type Constraints
        grounds: [entities.Staff.fields.role_type, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /staff with role_type PRINCIPAL (not a member) → ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["A school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Enum School" }
              as: Administrator
              captures: { sch: "$.data.id" }
          trigger:
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Bad Role", role_type: "PRINCIPAL" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_ENUM"
            - "HTTP status == 422"

      - name: create_student_unknown_school_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Student.fields.school_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /students with a non-existent school_id FK → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no schools)."]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { school_id: "00000000-0000-0000-0000-000000000000", full_name: "Orphan", grade_level: 9 }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_students_pagination_invalid
        claim_type: Listing
        grounds: [endpoints, "errors[ERR_PAGINATION_INVALID]"]
        distinguishing_aspect: "GET /schools/{id}/students?limit=0 (below min 1) → ERR_PAGINATION_INVALID (400)."
        test_recipe:
          setup: ["A school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Page School" }
              as: Administrator
              captures: { sch: "$.data.id" }
          trigger:
            - call: "GET /schools/${sch}/students?limit=0"
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_PAGINATION_INVALID"
            - "HTTP status == 400"

      - name: compliance_check_is_immutable_event
        claim_type: Immutability
        grounds: [entities.ComplianceCheck]
        distinguishing_aspect: "ComplianceCheck (common_fields:false) carries only id + created_at — no version or updated_at, and no transition/update endpoint exists."
        test_recipe:
          setup: ["A case exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Imm School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ida Imm", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
          trigger:
            - call: "POST /cases/${cid}/compliance-checks"
              payload: { check_date: "2026-09-15", result: "COMPLIANT" }
              as: Administrator
              captures: { chk: "$.data.id" }
          assert:
            - "response HTTP status == 201"
            - "ComplianceCheck.${chk} response exposes id and created_at but no version field"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: conference_double_hold_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Conference, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Transitioning a HELD (terminal) conference to HELD again → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An assigned case with a conference already HELD."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Dbl School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Dbl Mgr", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Uma Dbl", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
            - call: "POST /cases/${cid}/conferences"
              payload: { scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: Administrator
              captures: { conf_id: "$.data.id" }
            - call: "POST /cases/${cid}/conferences/${conf_id}/transition"
              payload: { to_status: "HELD" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/conferences/${conf_id}/transition"
              payload: { to_status: "HELD" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: citation_transition_after_withdrawn_returns_409
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CourtCitation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A WITHDRAWN (terminal) citation cannot transition to HEARD → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A COURT_REFERRED case with a citation transitioned to WITHDRAWN."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Term School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Term Off", role_type: "OFFICER" }
              as: Administrator
              captures: { officer_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Ted Term", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-03", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-04", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /cases/${cid}/court-citations"
              payload: { courtroom_id: "CR-9", hearing_start: "2026-10-01T09:00:00Z", hearing_end: "2026-10-01T10:00:00Z" }
              as: CourtOfficer
              as_user_id: "${officer_id}"
              captures: { cit_id: "$.data.id" }
            - call: "POST /cases/${cid}/court-citations/${cit_id}/transition"
              payload: { to_status: "WITHDRAWN" }
              as: CourtOfficer
              as_user_id: "${officer_id}"
          trigger:
            - call: "POST /cases/${cid}/court-citations/${cit_id}/transition"
              payload: { to_status: "HEARD", disposition: "guilty" }
              as: CourtOfficer
              as_user_id: "${officer_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: tier_manual_regression_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.TruancyCase, "errors[ERR_TIER_REGRESSION]"]
        distinguishing_aspect: "POST /cases/{id}/transition {to_tier: TIER_1} on a TIER_3 case → ERR_TIER_REGRESSION (409); tier is monotonic."
        test_recipe:
          setup: ["Low-threshold school; a case driven to tier TIER_3 by 3 UNEXCUSED."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Reg School", tier1_unexcused_threshold: 1, tier2_unexcused_threshold: 2, tier3_unexcused_threshold: 3, court_unexcused_threshold: 4 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Val Reg", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-02", status: "UNEXCUSED" }
              as: Administrator
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-03", status: "UNEXCUSED" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/transition"
              payload: { to_tier: "TIER_1" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_TIER_REGRESSION"
            - "HTTP status == 409"

      - name: resolved_transition_sweeps_referrals_completed
        claim_type: Side Effect Execution
        grounds: [state_machines.TruancyCase, state_machines.ServiceReferral]
        distinguishing_aspect: "MONITORING->RESOLVED sweeps all non-terminal ServiceReferrals to COMPLETED (cross-entity cascade)."
        test_recipe:
          setup: ["An assigned case with a HELD conference (moved to MONITORING) and one REFERRED service referral."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Sweep School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Sweep Mgr", role_type: "CASE_MANAGER" }
              as: Administrator
              captures: { staff_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Wes Sweep", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
            - call: "POST /cases/${cid}/conferences"
              payload: { scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: Administrator
              captures: { conf_id: "$.data.id" }
            - call: "POST /cases/${cid}/conferences/${conf_id}/transition"
              payload: { to_status: "HELD" }
              as: Administrator
            - call: "POST /cases/${cid}/service-referrals"
              payload: { service_type: "COUNSELING", provider_name: "Hope Center" }
              as: Administrator
              captures: { ref_id: "$.data.id" }
            - call: "POST /cases/${cid}/transition"
              payload: { to_status: "MONITORING" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid}/transition"
              payload: { to_status: "RESOLVED" }
              as: Administrator
              captures: { st: "$.data.status" }
          assert:
            - "TruancyCase.${cid}.status == RESOLVED"
            - "ServiceReferral.${ref_id}.status == COMPLETED"

      - name: withdrawn_student_attendance_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Student, "errors[ERR_STUDENT_NOT_ENROLLED]"]
        distinguishing_aspect: "Recording attendance for a WITHDRAWN student → ERR_STUDENT_NOT_ENROLLED (409)."
        test_recipe:
          setup: ["A student moved to enrollment_status WITHDRAWN."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Wd School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Xia Wd", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /students/${sid}/enrollment"
              payload: { to_status: "WITHDRAWN" }
              as: Administrator
          trigger:
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_STUDENT_NOT_ENROLLED"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: chronic_absent_true_at_threshold
        claim_type: Correct Result
        grounds: [entities.Student.fields.chronic_absent, calculations.student_attendance_rate]
        distinguishing_aspect: "With required_instructional_days=10 and threshold 10.0%, one absence (10%) flips chronic_absent to true (>=)."
        test_recipe:
          setup: ["School required_instructional_days=10, chronic_absence_pct_threshold=10.0; student with 1 UNEXCUSED."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Chr School", required_instructional_days: 10, chronic_absence_pct_threshold: 10.0 }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Yan Chr", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
          trigger:
            - call: "GET /students/${sid}"
              as: Administrator
              captures: { ca: "$.data.chronic_absent" }
          assert:
            - "Student.${sid}.chronic_absent == true"   # (0+1)/10*100 == 10.0 >= 10.0

      - name: official_rate_value_check
        claim_type: Correct Result
        grounds: [calculations.student_attendance_rate, entities.Student.fields.attendance_rate_official]
        excluded_because:
          difficulty_instance: dual_variant_calc / attendance_rate_recorded_vs_official
          rationale: "The official-basis rate literal (98.33) is asserted directly by the named §1.8 dual-variant instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: duplicate_attendance_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ATTENDANCE]"]
        distinguishing_aspect: "A second non-voided record for the same (student_id, attendance_date) → ERR_DUPLICATE_ATTENDANCE (409)."
        test_recipe:
          setup: ["A student with a PRESENT record on 2026-09-01."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Dup School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Zoe Dup", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "PRESENT" }
              as: Administrator
          trigger:
            - call: "POST /students/${sid}/attendance-records"
              payload: { attendance_date: "2026-09-01", status: "UNEXCUSED" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_DUPLICATE_ATTENDANCE"
            - "HTTP status == 409"

      - name: second_open_case_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_CASE_ALREADY_OPEN]"]
        distinguishing_aspect: "Opening a second case for a student who already has an OPEN case → ERR_CASE_ALREADY_OPEN (409)."
        test_recipe:
          setup: ["A student with one OPEN case."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "One School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Amy One", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
          trigger:
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_CASE_ALREADY_OPEN"
            - "HTTP status == 409"

      - name: assign_non_casemanager_staff_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_STAFF_ROLE]"]
        distinguishing_aspect: "Assigning a case to an OFFICER (not CASE_MANAGER) staff → ERR_INVALID_STAFF_ROLE (409)."
        test_recipe:
          setup: ["An OFFICER staff member and an OPEN case."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Role School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: " Off Role", role_type: "OFFICER" }
              as: Administrator
              captures: { officer_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Bo Role", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id" }
          trigger:
            - call: "POST /cases/${cid}/assign"
              payload: { staff_id: "${officer_id}" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STAFF_ROLE"
            - "HTTP status == 409"

      - name: caseload_cap_exceeded_rejected
        claim_type: Aggregate validation
        grounds: ["validations[priority=11]", "errors[ERR_CASELOAD_EXCEEDED]", entities.Staff.fields.max_caseload]
        distinguishing_aspect: "Assigning a second case to a CASE_MANAGER whose max_caseload=1 (already at 1) → ERR_CASELOAD_EXCEEDED (409)."
        test_recipe:
          setup: ["A CASE_MANAGER with max_caseload=1 already holding one OPEN case; a second OPEN case."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Cap School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /staff"
              payload: { school_id: "${sch}", full_name: "Cap Mgr", role_type: "CASE_MANAGER", max_caseload: 1 }
              as: Administrator
              captures: { staff_id: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Cy Cap", grade_level: 9 }
              as: Administrator
              captures: { sid1: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Di Cap", grade_level: 9 }
              as: Administrator
              captures: { sid2: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid1}" }
              as: Administrator
              captures: { cid1: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid2}" }
              as: Administrator
              captures: { cid2: "$.data.id" }
            - call: "POST /cases/${cid1}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
          trigger:
            - call: "POST /cases/${cid2}/assign"
              payload: { staff_id: "${staff_id}" }
              as: Administrator
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_CASELOAD_EXCEEDED"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: goal_progress_goal_not_found
        claim_type: Conditional action
        grounds: [endpoints, "errors[ERR_GOAL_NOT_FOUND]"]
        distinguishing_aspect: "Progress update against a goal_id not embedded in the contract → ERR_GOAL_NOT_FOUND (404)."
        test_recipe:
          setup: ["A case with a contract that has one goal (a different, unknown goal_id is used)."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Goal School" }
              as: Administrator
              captures: { sch: "$.data.id" }
            - call: "POST /students"
              payload: { school_id: "${sch}", full_name: "Eve Goal", grade_level: 9 }
              as: Administrator
              captures: { sid: "$.data.id" }
            - call: "POST /cases"
              payload: { student_id: "${sid}" }
              as: Administrator
              captures: { cid: "$.data.id", case_v: "$.data.version" }
            - call: "POST /cases/${cid}/contracts"
              payload:
                start_date: "2026-09-01"
                end_date: "2026-12-01"
                goals:
                  - { description: "Only goal", weight: 1, target_value: 5, met_value: 0 }
                expected_case_version: "${case_v}"
              as: Administrator
