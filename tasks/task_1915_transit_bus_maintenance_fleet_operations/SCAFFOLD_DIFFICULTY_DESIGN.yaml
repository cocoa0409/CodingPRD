# =============================================================================
# §1.8 Scaffold Difficulty Design — task 1915 transit bus maintenance
# 9 rules x 2 instances. Every recipe replays against SCAFFOLD.yaml §1.1-§1.7.
# Clock default is 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: pm_projection_mileage_rate_vs_calendar_divergence
        grounds:
          - calculations.pm_due_projection
          - entities.Bus.fields.pm_due_status
        distinguishing_aspect: |
          Bus-domain dual variant: identical odometer/log history yields projected_due_date
          2026-08-03 under MILEAGE_RATE (observed 1500 mi/day) but 2026-11-28 under CALENDAR
          (last_pm_a_date + 180 days) — a different entity domain than the warranty proration variant.
        test_recipe:
          setup:
            - "ACTIVE PMPolicy A=6000/B=18000/C=36000, tolerance 500, calendar 180"
            - "Bus in_service 2026-06-01, odometer 0 initially; three logs bring it to 3000 miles (1000 mi/day for 3 days)"
            - "Clock untouched at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /fleet/pm-policies", payload: { level_a_interval_miles: 6000, level_b_interval_miles: 18000, level_c_interval_miles: 36000, tolerance_miles: 500, calendar_interval_days: 180 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "B1", vin: "VIN1", model_year: 2023, in_service_date: "2026-06-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-06-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id } }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b1}", log_date: "2026-07-29", odometer_end: 1000, fuel_gallons: 50 }, as: Operator }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b1}", log_date: "2026-07-30", odometer_end: 2000, fuel_gallons: 50 }, as: Operator }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b1}", log_date: "2026-07-31", odometer_end: 3000, fuel_gallons: 50 }, as: Operator }
          trigger:
            - { call: "GET /fleet/buses/${b1}/pm-status", payload: { variant: "MILEAGE_RATE" }, as: MaintenanceSupervisor, captures: { mr_status: $.data.pm_due_status, mr_due: $.data.projected_due_date, mr_avg: $.data.avg_daily_miles, mr_rem: $.data.miles_remaining_a } }
            - { call: "GET /fleet/buses/${b1}/pm-status", payload: { variant: "CALENDAR" }, as: MaintenanceSupervisor, captures: { cal_due: $.data.projected_due_date, cal_status: $.data.pm_due_status } }
          assert:
            - "MILEAGE_RATE: avg_daily_miles == 1500 (3000 miles / 2 days), miles_remaining_a == 3000, projected_due_date == '2026-08-03'"
            - "CALENDAR: projected_due_date == '2026-11-28' (2026-06-01 + 180 days)"
            - "${mr_due} != ${cal_due} — same bus data, two valid algorithms, different dates"
            - "Both variants report pm_due_status == CURRENT (miles_remaining 3000 > 500 tolerance; 61 calendar days < 166 remaining)"

      - name: warranty_proration_miles_vs_time_divergence
        grounds:
          - calculations.warranty_claim_amount
          - entities.WarrantyClaim.fields.claimed_cents
        distinguishing_aspect: |
          Money-domain dual variant on WarrantyClaim: identical CLOSED work order (eligible
          72000c) claims 36000c under proration_basis MILES ((400000-200000)/400000) but
          35500c under TIME ((720-365)/720) — different entity domain than the PM projection variant.
        test_recipe:
          setup:
            - "Bus in_service 2025-08-01, odometer 200000, base warranty expired (100000 mi / 2026-01-01), extended limits 400000 mi / 24 months"
            - "CLOSED CORRECTIVE WO: part line qty 2 x 23000c (warranty_eligible) + labor 4h DAY = 46000 + 26000 = 72000c total"
            - "Clock at default 2026-08-01; days in service = 365"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "B100", vin: "VINB100", model_year: 2020, in_service_date: "2025-08-01", initial_odometer_miles: 200000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2026-01-01", extended_warranty_limit_miles: 400000, extended_warranty_limit_months: 24, overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-ELG", description: "Eligible sensor", part_class: "CONSUMABLE", unit_cost_cents: 23000, reorder_point: 0, initial_on_hand: 10, warranty_eligible: true }, as: PartsClerk, captures: { p1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead Tech", employee_ref: "E1" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA Tech", employee_ref: "E2" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 4, estimated_cost_cents: 72000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p1}", qty: 2 }, as: PartsClerk, captures: { ln: $.data.id } }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "CONSUME" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 4 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: WarrantyClerk, captures: { wov1: $.data.version } }
            - { call: "POST /fleet/warranty-claims", payload: { work_order_id: "${wo}", claim_type: "EXTENDED", proration_basis: "MILES", expected_work_order_version: "${wov1}" }, as: WarrantyClerk, captures: { c_miles: $.data.id } }
            - { call: "POST /fleet/warranty-claims/${c_miles}/events", payload: { event_type: "SUBMIT" }, as: WarrantyClerk }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: WarrantyClerk, captures: { wov2: $.data.version } }
            - { call: "POST /fleet/warranty-claims", payload: { work_order_id: "${wo}", claim_type: "EXTENDED", proration_basis: "TIME", expected_work_order_version: "${wov2}" }, as: WarrantyClerk, captures: { c_time: $.data.id } }
            - { call: "POST /fleet/warranty-claims/${c_time}/events", payload: { event_type: "SUBMIT" }, as: WarrantyClerk }
          trigger:
            - { call: "GET /fleet/warranty-claims/${c_miles}", payload: {}, as: WarrantyClerk, captures: { miles_claimed: $.data.claimed_cents, miles_eligible: $.data.eligible_cents } }
            - { call: "GET /fleet/warranty-claims/${c_time}", payload: {}, as: WarrantyClerk, captures: { time_claimed: $.data.claimed_cents } }
          assert:
            - "Both claims report eligible_cents == 72000 (46000 parts + 26000 labor, no core credits before submit)"
            - "MILES claim claimed_cents == 36000 (fraction (400000-200000)/400000 = 0.5)"
            - "TIME claim claimed_cents == 35500 (fraction (720-365)/720 = 355/720)"
            - "${miles_claimed} != ${time_claimed} — 500c divergence on identical work-order data"

  # ---------------------------------------------------------------- rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: labor_rounding_per_entry_then_sum_pinned
        grounds:
          - calculations.work_order_cost
        distinguishing_aspect: |
          Mode (b) nested rounding: three 0.5h NIGHT entries must round per entry then sum
          (3 x 4063 = 12189), NOT sum then round (12188) — the scaffold pins per-entry-first order.
        test_recipe:
          setup:
            - "Bus, lead mechanic m1, CORRECTIVE WO started; clock default"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "B200", vin: "VINB200", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Night Tech", employee_ref: "E10" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 2, estimated_cost_cents: 12000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "NIGHT", hours: 0.5 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "NIGHT", hours: 0.5 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "NIGHT", hours: 0.5 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: MaintenanceSupervisor, captures: { labor_total: $.data.labor_total_cents, total: $.data.total_cost_cents } }
          assert:
            - "labor_total_cents == 12189 (per-entry round_half_up(0.5 * 6500 * 1.25) = 4063, summed 3x)"
            - "labor_total_cents != 12188 (the sum-then-round order is rejected)"
            - "total_cost_cents == 12189 (no parts, no cores)"

      - name: replacement_score_weighted_multifactor_conditional_branch
        grounds:
          - calculations.replacement_score
          - entities.FleetReplacementPlan.fields.scores
        distinguishing_aspect: |
          Mode (a) combinatorial formula: 4 weighted inputs with min() caps plus a conditional
          PM-overdue multiplier branch; with age 6y, 300000 mi, cost ratio 0.3, overhaul overdue,
          no PM policy (multiplier skipped) the score is exactly 0.555 -> OVERHAUL.
        test_recipe:
          setup:
            - "Bus in_service 2020-08-01 (age 6y at clock 2026-08-01), odometer 300000, overhaul interval 250000 (overdue), replacement cost 30000000c"
            - "One CLOSED CORRECTIVE WO costing exactly 9000000c (parts 2 x 4496750 + labor 6500) so cost_ratio == 0.3"
            - "No PMPolicy exists, so pm_due_status is CURRENT and the 1.25 multiplier branch is NOT taken"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "B300", vin: "VINB300", model_year: 2020, in_service_date: "2020-08-01", initial_odometer_miles: 300000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-ENG", description: "Engine kit", part_class: "CONSUMABLE", unit_cost_cents: 4496750, reorder_point: 0, initial_on_hand: 5, warranty_eligible: false }, as: PartsClerk, captures: { p1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "E20" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "E21" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-07-10", planned_end_date: "2026-07-12", estimated_labor_hours: 1, estimated_cost_cents: 9000000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p1}", qty: 2 }, as: PartsClerk, captures: { ln: $.data.id } }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "CONSUME" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-07-11", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
          trigger:
            - { call: "POST /fleet/replacement-plans", payload: { plan_year: 2027 }, as: FleetManager, captures: { plan: $.data.id } }
            - { call: "GET /fleet/replacement-plans/${plan}", payload: {}, as: FleetManager, captures: { entry: "$.data.scores[0]" } }
          assert:
            - "scores has exactly 1 entry (only ACTIVE buses scored) for bus ${b1}"
            - "age_years == 6 (floor(2192/365)), miles_norm == 0.6, cost_ratio == 0.3, overhaul_overdue == 1"
            - "score == 0.555 (0.30*0.5 + 0.30*0.6 + 0.25*0.3 + 0.15*1), recommendation == OVERHAUL"
            - "PM-overdue multiplier NOT applied (0.555 * 1.25 = 0.6938 would still be OVERHAUL but score would differ)"

  # ---------------------------------------------------------------- rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_rework_cycle_reopened_resume_recertify
        grounds:
          - state_machines.WorkOrder.PENDING_QA_to_REOPENED
          - state_machines.WorkOrder.REOPENED_to_IN_PROGRESS
        distinguishing_aspect: |
          WorkOrder machine is cyclic: PENDING_QA -> QA_REJECT -> REOPENED -> RESUME_WORK ->
          IN_PROGRESS -> SUBMIT_QA -> PENDING_QA -> QA_CERTIFY -> CLOSED, with qa_reject_count
          accumulating; a linear pipeline cannot express the reject-rework loop.
        test_recipe:
          setup:
            - "Bus, lead m1, QA-certified m2; CORRECTIVE WO in PENDING_QA after 1h labor"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "B400", vin: "VINB400", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "E30" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "E31" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 2, estimated_cost_cents: 13000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_REJECT", qa_note: "brake drag persists" }, as: Mechanic, as_user_id: "${m2}", captures: { st1: $.data.status, rej: $.data.qa_reject_count } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "RESUME_WORK" }, as: Mechanic, as_user_id: "${m1}", captures: { st2: $.data.status } }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-03", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}", captures: { st3: $.data.status, labor: $.data.labor_total_cents } }
          assert:
            - "After QA_REJECT: status == REOPENED, qa_reject_count == 1"
            - "After RESUME_WORK: status == IN_PROGRESS (cycle back, not forward)"
            - "Final: status == CLOSED, labor_total_cents == 13000 (both labor entries kept across the loop)"

      - name: warranty_claim_denied_appeal_cycle_with_cap
        grounds:
          - state_machines.WarrantyClaim.DENIED_to_SUBMITTED
          - validations[priority=41]
        distinguishing_aspect: |
          WarrantyClaim machine is a negotiation cycle on a different entity than WorkOrder:
          DENIED -> APPEAL -> SUBMITTED may repeat exactly twice; the third APPEAL is rejected
          with ERR_APPEAL_LIMIT_EXCEEDED while the claim stays DENIED.
        test_recipe:
          setup:
            - "Bus inside base warranty (odo 50000 <= 100000 mi, opened before 2027-01-01); CLOSED CORRECTIVE WO with 10000c part + 6500c labor"
            - "WO close auto-creates a DRAFT BASE_OEM claim (auto_created=true)"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "B500", vin: "VINB500", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 100000, base_warranty_expiry_date: "2027-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-INJ", description: "Injector", part_class: "CONSUMABLE", unit_cost_cents: 10000, reorder_point: 0, initial_on_hand: 5, warranty_eligible: true }, as: PartsClerk, captures: { p1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "E40" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "E41" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "URGENT", planned_start_date: "2026-08-02", planned_end_date: "2026-08-02", estimated_labor_hours: 1, estimated_cost_cents: 16500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p1}", qty: 1 }, as: PartsClerk, captures: { ln: $.data.id } }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "CONSUME" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/work-orders/${wo}/warranty-claims", payload: {}, as: WarrantyClerk, captures: { claim: "$.data[0].id" } }
          trigger:
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "SUBMIT" }, as: WarrantyClerk, as_user_id: "clerk-9", captures: { st1: $.data.status, amt: $.data.claimed_cents } }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "RECORD_OEM_DECISION", decision_outcome: "DENIED" }, as: WarrantyClerk, as_user_id: "clerk-9" }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "APPEAL", appeal_note: "resubmit with teardown photos" }, as: WarrantyClerk, as_user_id: "clerk-9", captures: { ap1: $.data.appeal_count, st2: $.data.status } }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "RECORD_OEM_DECISION", decision_outcome: "DENIED" }, as: WarrantyClerk, as_user_id: "clerk-9" }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "APPEAL" }, as: WarrantyClerk, as_user_id: "clerk-9", captures: { ap2: $.data.appeal_count } }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "RECORD_OEM_DECISION", decision_outcome: "DENIED" }, as: WarrantyClerk, as_user_id: "clerk-9" }
            - { call: "POST /fleet/warranty-claims/${claim}/events", payload: { event_type: "APPEAL" }, as: WarrantyClerk, as_user_id: "clerk-9", captures: { err: $.data.error_id } }
          assert:
            - "First SUBMIT pins claimed_cents == 16500 (100% base warranty: 10000 + 6500)"
            - "First APPEAL: status back to SUBMITTED with appeal_count == 1 (cycle)"
            - "Second APPEAL: appeal_count == 2"
            - "Third APPEAL rejected: err == ERR_APPEAL_LIMIT_EXCEEDED, claim remains DENIED"

  # ---------------------------------------------------------------- rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: emissions_fail_cascade_reaches_campaign_suspend
        grounds:
          - calculations.bus_availability_derivation
          - state_machines.Part.LOW_STOCK_to_BACKORDERED
          - state_machines.Campaign.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-5 chain from POST /fleet/emissions-inspections: FAIL -> bus HELD(EMISSIONS)
          -> system spawns SCHEDULED EMISSIONS WO -> WO reserves failed-component part (qty 1,
          stock to LOW_STOCK) -> follow-on stock write-down forces available < 0 (BACKORDERED)
          -> ACTIVE campaign requiring that part auto-SUSPENDs. Different trigger than the
          safety-defect cascade.
        test_recipe:
          setup:
            - "Five ACTIVE buses (model_year 2021), clock default 2026-08-01"
            - "Part P-EM: on_hand 1, reorder_point 0"
            - "Campaign CMP-EM-1 covering model years 2020-2022, required_part P-EM, ACTIVATED with scope of 5 buses"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "E1", vin: "VINE1", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "E2", vin: "VINE2", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b2: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "E3", vin: "VINE3", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b3: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "E4", vin: "VINE4", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b4: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "E5", vin: "VINE5", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b5: $.data.id } }
            - { call: "POST /fleet/parts", payload: { sku: "P-EM", description: "DPF sensor", part_class: "CONSUMABLE", unit_cost_cents: 5000, reorder_point: 0, initial_on_hand: 1, warranty_eligible: false }, as: PartsClerk, captures: { p1: $.data.id } }
            - { call: "POST /fleet/campaigns", payload: { code: "CMP-EM-1", title: "DPF sensor recall", model_year_from: 2020, model_year_to: 2022, labor_hours_per_bus: 2, deadline_date: "2026-12-31", required_part_id: "${p1}" }, as: FleetManager, captures: { c1: $.data.id } }
            - { call: "POST /fleet/campaigns/${c1}/events", payload: { event_type: "ACTIVATE" }, as: FleetManager, captures: { scope_n: "$.data.scope_bus_ids" } }
          trigger:
            - { call: "POST /fleet/emissions-inspections", payload: { bus_id: "${b1}", test_type: "OBD", test_date: "2026-08-01", result: "FAIL", failed_component_part_id: "${p1}" }, as: MaintenanceSupervisor, captures: { insp: $.data.id } }
            - { call: "GET /fleet/emissions-inspections/${insp}/work-orders", payload: {}, as: MaintenanceSupervisor, captures: { auto_wo: "$.data[0].id", auto_wo_status: "$.data[0].status", auto_wo_type: "$.data[0].wo_type", auto_wo_prio: "$.data[0].priority" } }
            - { call: "GET /fleet/parts/${p1}", payload: {}, as: PartsClerk, captures: { pstat1: $.data.stock_status, pres1: $.data.quantity_reserved } }
            - { call: "POST /fleet/parts/${p1}/stock-adjustments", payload: { delta: -1, reason: "cycle count write-down" }, as: PartsClerk, captures: { pstat2: $.data.stock_status } }
            - { call: "GET /fleet/campaigns/${c1}", payload: {}, as: FleetManager, captures: { cstat: $.data.status } }
          assert:
            - "After FAIL: bus ${b1} availability_status == HELD with EMISSIONS in hold_reasons"
            - "Auto WO exists: wo_type == EMISSIONS, status == SCHEDULED, priority == EMERGENCY, emissions_inspection_id == ${insp}"
            - "Part after auto-reserve: quantity_reserved == 1, stock_status == LOW_STOCK (available 0 <= reorder_point 0)"
            - "After write-down delta -1: stock_status == BACKORDERED (on_hand 0, reserved 1, available -1)"
            - "Campaign auto-suspended: status == SUSPENDED without any direct campaign call"

      - name: safety_defect_five_bus_cascade_freezes_scheduled_work
        grounds:
          - calculations.fleet_posture
          - state_machines.WorkOrder.SCHEDULE_to_BLOCKED
          - state_machines.Bus.AVAILABLE_to_HELD
        distinguishing_aspect: |
          Depth-3 chain from POST /fleet/defect-reports (different trigger than the emissions
          cascade): SAFETY_CRITICAL report -> bus HELD(SAFETY) -> spare ratio crosses below
          0.15 so posture flips GREEN->RED -> every SCHEDULED ROUTINE/ELECTIVE work order
          fleet-wide auto-BLOCKs.
        test_recipe:
          setup:
            - "Five ACTIVE buses; two ROUTINE CORRECTIVE WOs SCHEDULED on B1 and B2"
            - "SAFETY_CRITICAL defects already filed on B1..B4 (4 held, ratio 1/5 = 0.20 -> still GREEN)"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "S1", vin: "VINS1", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "S2", vin: "VINS2", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b2: $.data.id, bv2: $.data.version } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "S3", vin: "VINS3", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b3: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "S4", vin: "VINS4", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b4: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "S5", vin: "VINS5", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b5: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "E50" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-12", estimated_labor_hours: 2, estimated_cost_cents: 13000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv1}" }, as: MaintenanceSupervisor, captures: { wo1: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo1}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b2}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-12", estimated_labor_hours: 2, estimated_cost_cents: 13000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv2}" }, as: MaintenanceSupervisor, captures: { wo2: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo2}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b1}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "brake fade", odometer_at_report: 10050 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b2}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "brake fade", odometer_at_report: 10050 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b3}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "brake fade", odometer_at_report: 10050 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b4}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "brake fade", odometer_at_report: 10050 }, as: Operator }
          trigger:
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b5}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "brake fade", odometer_at_report: 10050 }, as: Operator, captures: { d5: $.data.id } }
            - { call: "GET /fleet/posture", payload: {}, as: FleetManager, captures: { posture: $.data.posture, ratio: $.data.spare_ratio, avail: $.data.available_buses } }
            - { call: "GET /fleet/work-orders/${wo1}", payload: {}, as: MaintenanceSupervisor, captures: { wo1_status: $.data.status } }
            - { call: "GET /fleet/work-orders/${wo2}", payload: {}, as: MaintenanceSupervisor, captures: { wo2_status: $.data.status } }
          assert:
            - "Before the 5th defect: 4 held of 5 active -> ratio 0.20 -> posture GREEN (verified via prior GET in test)"
            - "After defect ${d5}: posture == RED, spare_ratio == 0.0, available_buses == 0"
            - "wo1.status == BLOCKED and wo2.status == BLOCKED (freeze fired from the posture flip, not from any direct WO call)"
            - "Bus ${b5}.availability_status == HELD with SAFETY in hold_reasons"

  # ---------------------------------------------------------------- rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_terminal_qa_certify
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair state vs business_safety: QA_CERTIFY on a CLOSED work order by a
          mechanic who also lacks the QA_AUTHORITY cert must surface ERR_ALREADY_TERMINAL
          (priority 7), never ERR_CERT_REQUIRED (priority 10).
        test_recipe:
          setup:
            - "CLOSED CORRECTIVE WO (lead m1, certified by QA-holder m3); m2 exists with NO certifications"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "P1", vin: "VINP1", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "E60" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "NoCert", employee_ref: "E61" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "E62" }, as: MaintenanceSupervisor, captures: { m3: $.data.id } }
            - { call: "POST /fleet/mechanics/${m3}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 6500, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-02", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m3}" }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_TERMINAL (state priority 7 beats missing-cert safety priority 10)"
            - "HTTP status == 409, and the WO remains CLOSED"

      - name: referential_beats_temporal_duplicate_shift_assignment
        grounds:
          - validations[priority=19]
          - validations[priority=22]
        distinguishing_aspect: |
          Category pair business_referential vs business_temporal: re-assigning the same
          mechanic to the same AM shift violates BOTH the duplicate-assignment rule (p19) and
          the half-open overlap rule (p22); ERR_DUPLICATE_ASSIGNMENT must win. Different
          category pair than state-vs-safety.
        test_recipe:
          setup:
            - "Mechanic m1; PUBLISHED AM shift on 2026-08-05; m1 already SCHEDULED on it"
          setup_api_calls:
            - { call: "POST /fleet/mechanics", payload: { name: "Tech", employee_ref: "E70" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/shifts", payload: { shift_date: "2026-08-05", shift_type: "AM", required_headcount: {} }, as: MaintenanceSupervisor, captures: { s1: $.data.id } }
            - { call: "POST /fleet/shifts/${s1}/publish", payload: {}, as: MaintenanceSupervisor }
            - { call: "POST /fleet/shifts/${s1}/assignments", payload: { mechanic_id: "${m1}", role_in_shift: "TECH" }, as: MaintenanceSupervisor, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /fleet/shifts/${s1}/assignments", payload: { mechanic_id: "${m1}", role_in_shift: "TECH" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_ASSIGNMENT (referential p19 beats temporal p22)"
            - "HTTP 409; shift still has exactly one assignment"

  # ---------------------------------------------------------------- rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: spare_ratio_green_floor_inclusive_at_exactly_0_20
        grounds:
          - calculations.fleet_posture
          - endpoints.GET /fleet/posture
        distinguishing_aspect: |
          Metric spare_ratio on GET /fleet/posture: with 5 active buses, exactly 1 available
          gives ratio 0.20 and the GREEN floor is INCLUSIVE (>= 0.20); only the 5th hold
          (ratio 0.0) flips RED. Different metric and endpoint than the PM interval boundary.
        test_recipe:
          setup:
            - "Five ACTIVE buses; SAFETY_CRITICAL defects filed on four of them (held)"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "G1", vin: "VING1", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "G2", vin: "VING2", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b2: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "G3", vin: "VING3", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b3: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "G4", vin: "VING4", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b4: $.data.id } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "G5", vin: "VING5", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b5: $.data.id } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b1}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "d1", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b2}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "d2", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b3}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "d3", odometer_at_report: 10000 }, as: Operator }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b4}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "d4", odometer_at_report: 10000 }, as: Operator }
          trigger:
            - { call: "GET /fleet/posture", payload: {}, as: FleetManager, captures: { posture1: $.data.posture, ratio1: $.data.spare_ratio, avail1: $.data.available_buses, pmin: $.data.pull_out_minimum, pready: $.data.pull_out_ready } }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b5}", severity: "SAFETY_CRITICAL", defect_code: "BRAKES", description: "d5", odometer_at_report: 10000 }, as: Operator }
            - { call: "GET /fleet/posture", payload: {}, as: FleetManager, captures: { posture2: $.data.posture, ratio2: $.data.spare_ratio } }
          assert:
            - "At 1/5 available: spare_ratio == 0.2, posture == GREEN (floor inclusive), pull_out_minimum == 4 (ceil(0.8*5)), pull_out_ready == false (1 < 4)"
            - "After 5th defect: spare_ratio == 0.0, posture == RED"

      - name: pm_interval_exact_boundary_due_not_overdue
        grounds:
          - calculations.pm_due_status
          - endpoints.GET /fleet/buses/{id}/pm-status
        distinguishing_aspect: |
          Metric miles_remaining on GET pm-status: odometer exactly at the 6000-mile A
          interval (miles_remaining == 0) classifies DUE — not DUE_SOON (1..500) and not
          OVERDUE (< 0). Different metric and endpoint than the spare-ratio boundary.
        test_recipe:
          setup:
            - "PMPolicy A=6000 tol=500 cal=180; bus in_service 2026-07-01 (calendar CURRENT), odometer starts 0"
          setup_api_calls:
            - { call: "POST /fleet/pm-policies", payload: { level_a_interval_miles: 6000, level_b_interval_miles: 18000, level_c_interval_miles: 36000, tolerance_miles: 500, calendar_interval_days: 180 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "M1", vin: "VINM1", model_year: 2024, in_service_date: "2026-07-01", initial_odometer_miles: 0, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 150000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id } }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b1}", log_date: "2026-08-01", odometer_end: 5999, fuel_gallons: 60 }, as: Operator }
          trigger:
            - { call: "GET /fleet/buses/${b1}/pm-status", payload: {}, as: FleetManager, captures: { s1: $.data.pm_due_status, r1: $.data.miles_remaining_a } }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b1}", log_date: "2026-08-01", odometer_end: 6000, fuel_gallons: 60 }, as: Operator }
            - { call: "GET /fleet/buses/${b1}/pm-status", payload: {}, as: FleetManager, captures: { s2: $.data.pm_due_status, r2: $.data.miles_remaining_a } }
            - { call: "POST /fleet/mileage-fuel-logs", payload: { bus_id: "${b1}", log_date: "2026-08-01", odometer_end: 6001, fuel_gallons: 60 }, as: Operator }
            - { call: "GET /fleet/buses/${b1}/pm-status", payload: {}, as: FleetManager, captures: { s3: $.data.pm_due_status, r3: $.data.miles_remaining_a } }
          assert:
            - "At 5999 miles: miles_remaining_a == 1, pm_due_status == DUE_SOON"
            - "At exactly 6000 miles: miles_remaining_a == 0, pm_due_status == DUE (== maps to DUE, not OVERDUE)"
            - "At 6001 miles: miles_remaining_a == -1, pm_due_status == OVERDUE"

  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: emissions_wo_blocked_until_passing_retest
        grounds:
          - validations[priority=38]
          - state_machines.WorkOrder.IN_PROGRESS_to_PENDING_QA
        distinguishing_aspect: |
          Entity pair WorkOrder -> EmissionsInspection: an EMISSIONS work order cannot reach
          PENDING_QA until a PASS inspection exists for the bus with created_at at/after the
          WO's last IN_PROGRESS entry; recording the PASS retest unblocks the same transition.
        test_recipe:
          setup:
            - "Bus with FAIL OBD inspection -> HELD(EMISSIONS) + auto EMISSIONS WO (SCHEDULED, EMERGENCY)"
            - "m1 holds EMISSIONS cert and is assigned lead; WO started; 1h labor posted"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "X1", vin: "VINX1", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Emissions Tech", employee_ref: "E80" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics/${m1}/certifications", payload: { cert_type: "EMISSIONS", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "E81" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/emissions-inspections", payload: { bus_id: "${b1}", test_type: "OBD", test_date: "2026-08-01", result: "FAIL" }, as: MaintenanceSupervisor, captures: { insp: $.data.id } }
            - { call: "GET /fleet/emissions-inspections/${insp}/work-orders", payload: {}, as: MaintenanceSupervisor, captures: { wo: "$.data[0].id" } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "ASSIGN", lead_mechanic_id: "${m1}" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/labor-entries", payload: { work_date: "2026-08-01", shift_type: "DAY", hours: 1 }, as: Mechanic, as_user_id: "${m1}" }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}", captures: { err: $.data.error_id } }
            - { call: "POST /fleet/emissions-inspections", payload: { bus_id: "${b1}", test_type: "OBD", test_date: "2026-08-01", result: "PASS", certificate_expiry_date: "2027-08-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}", captures: { st1: $.data.status } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}", captures: { st2: $.data.status } }
            - { call: "GET /fleet/buses/${b1}", payload: {}, as: FleetManager, captures: { avail: $.data.availability_status, cert_exp: $.data.emissions_cert_expiry_date } }
          assert:
            - "First SUBMIT_QA rejected: err == ERR_EMISSIONS_RETEST_REQUIRED (409)"
            - "After PASS retest: SUBMIT_QA succeeds (PENDING_QA), QA_CERTIFY closes (CLOSED)"
            - "Bus emissions_cert_expiry_date == 2027-08-01 and availability_status == AVAILABLE after close"

      - name: campaign_auto_completes_when_last_scope_wo_closes
        grounds:
          - calculations.campaign_progress
          - state_machines.Campaign.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Entity pair Campaign -> WorkOrder (child bubble-up): campaign progress derives from
          CLOSED WOs of its frozen scope buses; closing the first of two yields exactly 50.0%
          and keeps ACTIVE, closing the second auto-transitions the campaign to COMPLETED.
        test_recipe:
          setup:
            - "Two ACTIVE buses model_year 2021 (warranty-ineligible to avoid auto-claims); campaign 2020-2022 ACTIVATED with scope [B1, B2]"
            - "m1 lead, m2 QA-certified"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "C1", vin: "VINC1", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "POST /fleet/buses", payload: { fleet_number: "C2", vin: "VINC2", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b2: $.data.id, bv2: $.data.version } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "E90" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "QA", employee_ref: "E91" }, as: MaintenanceSupervisor, captures: { m2: $.data.id } }
            - { call: "POST /fleet/mechanics/${m2}/certifications", payload: { cert_type: "QA_AUTHORITY", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/campaigns", payload: { code: "CMP-50", title: "Mirror retrofit", model_year_from: 2020, model_year_to: 2022, labor_hours_per_bus: 2, deadline_date: "2026-12-31" }, as: FleetManager, captures: { c1: $.data.id } }
            - { call: "POST /fleet/campaigns/${c1}/events", payload: { event_type: "ACTIVATE" }, as: FleetManager }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CAMPAIGN", priority: "ROUTINE", campaign_id: "${c1}", planned_start_date: "2026-08-03", planned_end_date: "2026-08-04", estimated_labor_hours: 2, estimated_cost_cents: 13000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv1}" }, as: MaintenanceSupervisor, captures: { wo1: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo1}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo1}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo1}/labor-entries", payload: { work_date: "2026-08-03", shift_type: "DAY", hours: 2 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo1}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo1}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
          trigger:
            - { call: "GET /fleet/campaigns/${c1}", payload: {}, as: FleetManager, captures: { pct1: $.data.progress_pct, cstat1: $.data.status, done1: $.data.buses_completed_count } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b2}", wo_type: "CAMPAIGN", priority: "ROUTINE", campaign_id: "${c1}", planned_start_date: "2026-08-03", planned_end_date: "2026-08-04", estimated_labor_hours: 2, estimated_cost_cents: 13000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv2}" }, as: MaintenanceSupervisor, captures: { wo2: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo2}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo2}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo2}/labor-entries", payload: { work_date: "2026-08-03", shift_type: "DAY", hours: 2 }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo2}/events", payload: { event_type: "SUBMIT_QA" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/work-orders/${wo2}/events", payload: { event_type: "QA_CERTIFY" }, as: Mechanic, as_user_id: "${m2}" }
            - { call: "GET /fleet/campaigns/${c1}", payload: {}, as: FleetManager, captures: { pct2: $.data.progress_pct, cstat2: $.data.status, done2: $.data.buses_completed_count } }
          assert:
            - "After first WO close: buses_completed_count == 1, progress_pct == 50.0, status == ACTIVE"
            - "After second WO close: buses_completed_count == 2, progress_pct == 100.0, status == COMPLETED (auto bubble-up, no campaign event call)"

  # ---------------------------------------------------------------- rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_assignment_half_open_adjacency_vs_overlap
        grounds:
          - validations[priority=22]
          - entities.Shift.fields.shift_type
        distinguishing_aspect: |
          Resource Mechanic, half-open interval semantics: fixed AM [06:00,14:00) and PM
          [14:00,22:00) on the same date touch at 14:00 and are ALLOWED (adjacency), while a
          second AM assignment overlaps [06:00,14:00) and is rejected with ERR_SHIFT_OVERLAP.
        test_recipe:
          setup:
            - "Mechanic m1; three PUBLISHED shifts on 2026-08-05: AM, PM, and a second AM"
          setup_api_calls:
            - { call: "POST /fleet/mechanics", payload: { name: "Tech", employee_ref: "E100" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/shifts", payload: { shift_date: "2026-08-05", shift_type: "AM", required_headcount: {} }, as: MaintenanceSupervisor, captures: { s_am1: $.data.id } }
            - { call: "POST /fleet/shifts/${s_am1}/publish", payload: {}, as: MaintenanceSupervisor }
            - { call: "POST /fleet/shifts", payload: { shift_date: "2026-08-05", shift_type: "PM", required_headcount: {} }, as: MaintenanceSupervisor, captures: { s_pm: $.data.id } }
            - { call: "POST /fleet/shifts/${s_pm}/publish", payload: {}, as: MaintenanceSupervisor }
            - { call: "POST /fleet/shifts", payload: { shift_date: "2026-08-05", shift_type: "AM", required_headcount: {} }, as: MaintenanceSupervisor, captures: { s_am2: $.data.id } }
            - { call: "POST /fleet/shifts/${s_am2}/publish", payload: {}, as: MaintenanceSupervisor }
            - { call: "POST /fleet/shifts/${s_am1}/assignments", payload: { mechanic_id: "${m1}", role_in_shift: "TECH" }, as: MaintenanceSupervisor, captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /fleet/shifts/${s_pm}/assignments", payload: { mechanic_id: "${m1}", role_in_shift: "TECH" }, as: MaintenanceSupervisor, captures: { a2: $.data.id, a2_status: $.data.status } }
            - { call: "POST /fleet/shifts/${s_am2}/assignments", payload: { mechanic_id: "${m1}", role_in_shift: "TECH" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "PM assignment succeeds: a2 status SCHEDULED (14:00 adjacency is not an overlap under half-open semantics)"
            - "Second AM assignment rejected: err == ERR_SHIFT_OVERLAP (409)"

      - name: work_order_bus_window_one_day_buffer_required
        grounds:
          - validations[priority=23]
          - state_machines.WorkOrder.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Resource Bus, buffered CLOSED-interval semantics: WO window 2026-08-10..2026-08-12
          blocks a successor starting 2026-08-13 (needs start > end + 1 day) yet allows
          2026-08-14. Different resource and different interval geometry than the shift rule.
        test_recipe:
          setup:
            - "One ACTIVE bus; PM_A WO scheduled for window 08-10..08-12 (inclusive)"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "W1", vin: "VINW1", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "PM_A", priority: "ROUTINE", planned_start_date: "2026-08-10", planned_end_date: "2026-08-12", estimated_labor_hours: 4, estimated_cost_cents: 26000, expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo1: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo1}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "GET /fleet/buses/${b1}", payload: {}, as: MaintenanceSupervisor, captures: { bv2: $.data.version } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "PM_B", priority: "ROUTINE", planned_start_date: "2026-08-13", planned_end_date: "2026-08-14", estimated_labor_hours: 6, estimated_cost_cents: 39000, expected_bus_version: "${bv2}" }, as: MaintenanceSupervisor, captures: { wo2: $.data.id } }
          trigger:
            - { call: "POST /fleet/work-orders/${wo2}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
            - { call: "GET /fleet/buses/${b1}", payload: {}, as: MaintenanceSupervisor, captures: { bv3: $.data.version } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "PM_C", priority: "ROUTINE", planned_start_date: "2026-08-14", planned_end_date: "2026-08-15", estimated_labor_hours: 8, estimated_cost_cents: 52000, expected_bus_version: "${bv3}" }, as: MaintenanceSupervisor, captures: { wo3: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo3}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor, captures: { st3: $.data.status } }
          assert:
            - "PM_B starting 2026-08-13 (exactly end+1 day) is rejected: err == ERR_WO_WINDOW_OVERLAP (13 > 12+1 is false)"
            - "PM_C starting 2026-08-14 succeeds: status == SCHEDULED (14 > 13 satisfies the buffer)"

  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: parts_issue_return_unused_conserve_on_hand_units
        grounds:
          - state_machines.WorkOrderPartLine.RESERVED_to_ISSUED
          - state_machines.WorkOrderPartLine.ISSUED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity = physical stock units: Part.quantity_on_hand must return to its
          exact pre-issue value after ISSUE paired with RETURN_UNUSED, and quantity_reserved
          to 0 — the forward and compensating actions leave no drift.
        test_recipe:
          setup:
            - "Part P with on_hand 10; IN_PROGRESS CORRECTIVE WO led by m1"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "V1", vin: "VINV1", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-FIL", description: "Filter", part_class: "CONSUMABLE", unit_cost_cents: 3000, reorder_point: 0, initial_on_hand: 10, warranty_eligible: false }, as: PartsClerk, captures: { p1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "E110" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 12000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
          trigger:
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p1}", qty: 4 }, as: PartsClerk, captures: { ln: $.data.id } }
            - { call: "GET /fleet/parts/${p1}", payload: {}, as: PartsClerk, captures: { oh1: $.data.quantity_on_hand, rs1: $.data.quantity_reserved, av1: $.data.quantity_available } }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "GET /fleet/parts/${p1}", payload: {}, as: PartsClerk, captures: { oh2: $.data.quantity_on_hand, rs2: $.data.quantity_reserved } }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "RETURN_UNUSED" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "GET /fleet/parts/${p1}", payload: {}, as: PartsClerk, captures: { oh3: $.data.quantity_on_hand, rs3: $.data.quantity_reserved, av3: $.data.quantity_available } }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: MaintenanceSupervisor, captures: { ptot: $.data.parts_total_cents } }
          assert:
            - "After reserve: on_hand == 10, reserved == 4, available == 6"
            - "After issue: on_hand == 6, reserved == 0"
            - "After return_unused (compensation): on_hand == 10 AND reserved == 0 AND available == 10 — invariant restored exactly"
            - "WorkOrder.parts_total_cents == 0 (RETURNED lines contribute nothing)"

      - name: core_accrue_and_on_time_credit_net_zero_liability
        grounds:
          - calculations.core_exchange_credit
          - state_machines.WorkOrderPartLine.CORE_PENDING_to_CORE_CREDITED
        distinguishing_aspect: |
          Conserved quantity = money (core liability cents), different from stock units:
          ISSUE of a REBUILDABLE_CORE line accrues a 10000c core charge; an on-time GOOD
          core return credits exactly 10000c, leaving accrued - credited == 0 and
          parts_net == parts_total - 10000.
        test_recipe:
          setup:
            - "REBUILDABLE_CORE part: unit 25000c, core_charge 10000c, on_hand 3; IN_PROGRESS CORRECTIVE WO led by m1; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /fleet/buses", payload: { fleet_number: "K1", vin: "VINK1", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 50000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b1: $.data.id, bv: $.data.version } }
            - { call: "POST /fleet/parts", payload: { sku: "P-ALT", description: "Alternator core", part_class: "REBUILDABLE_CORE", unit_cost_cents: 25000, reorder_point: 0, initial_on_hand: 3, warranty_eligible: false, core_charge_cents: 10000 }, as: PartsClerk, captures: { p1: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "E120" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b1}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 25000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "SCHEDULE" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/events", payload: { event_type: "START" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/work-orders/${wo}/part-lines", payload: { part_id: "${p1}", qty: 1 }, as: PartsClerk, captures: { ln: $.data.id } }
          trigger:
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "ISSUE" }, as: Mechanic, as_user_id: "${m1}", captures: { cs1: $.data.core_status, due: $.data.core_due_date } }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: PartsClerk, captures: { acc: $.data.core_charges_accrued_cents } }
            - { call: "POST /fleet/part-lines/${ln}/events", payload: { event_type: "CORE_RETURN", core_condition: "GOOD" }, as: PartsClerk, captures: { cs2: $.data.core_status } }
            - { call: "GET /fleet/work-orders/${wo}", payload: {}, as: PartsClerk, captures: { acc2: $.data.core_charges_accrued_cents, cred: $.data.core_credits_cents, pnet: $.data.parts_net_cents, ptot: $.data.parts_total_cents } }
          assert:
            - "After ISSUE: core_status == CORE_PENDING, core_due_date == 2026-08-31 (issue date + 30), WO.core_charges_accrued_cents == 10000"
            - "After on-time GOOD CORE_RETURN: core_status == CORE_CREDITED"
            - "Invariant: core_charges_accrued_cents - core_credits_cents == 10000 - 10000 == 0"
            - "parts_total_cents == 25000 and parts_net_cents == 15000 (credit offsets cost exactly)"
