            - "${d_final} == CLOSED"

  # -------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: forecast_below_min_samples_uses_weighted_blend
        claim_type: correct_result
        grounds: [calculations.forecast_cash_need]
        distinguishing_aspect: "With only 1 same-day-of-week sample (< FORECAST_MIN_SAMPLES 3), the TRAILING forecast falls back to the 70/30 blend: ceil(0.70*160000 + 0.30*200000) == 172000."
        test_recipe:
          setup:
            - "Branch B (vault 0); teller T with drawer; account A with 100000000"
            - "Sampled days in the window [2026-08-04 .. 2026-08-31] for an order placed 2026-09-01 with delivery 2026-09-02 (a Wednesday): Wed 2026-08-12 net 160000 (the only Wednesday sample); other-DOW samples Tue 2026-08-04 net 180000, Mon 2026-08-10 net 200000, Sat 2026-08-22 net 220000 (mean 200000)"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 0, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
