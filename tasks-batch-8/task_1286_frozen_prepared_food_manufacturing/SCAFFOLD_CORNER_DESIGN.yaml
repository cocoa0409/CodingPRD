              captures: { comp_a: $.data.id }
            - call: "POST /plant/recipes/${r_id}/components"
              payload: { component_name: "B", component_type: "SUB_ASSEMBLY", quantity_per_base_batch: 5, unit_of_measure: "KG", parent_component_id: "${comp_a}" }
              as: PlantManager
              captures: { comp_b: $.data.id }
            - { call: "PATCH /plant/components/${comp_a}", payload: { parent_component_id: "${comp_b}" }, as: PlantManager }
