              as: ProcurementOfficer
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T10:00:00Z", planned_quantity: 10000 }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /mint/production-runs/${run1}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run1}/inspect"
              payload: { outcome: "PASS", good_pieces: 9800 }
              as: QualityInspector
            - call: "POST /mint/error-coin-cases"
              payload: { production_run_id: "${run1}", error_pieces: 199 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P1", planned_start: "2026-10-05T10:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 5000 }
              as: ProductionPlanner
              captures: { run2: $.data.id }
          trigger:
            - call: "POST /mint/production-runs/${run2}/start"
              as: ProductionPlanner
          assert:
            - "ProductionRun.${run2}.status == STRIKING (0.0199 < 0.02 passes the gate)"

      - name: error_rate_rolling_window_excludes_old_cases
        claim_type: input_set_filtering
        grounds: ["calculations.error_rate_threshold"]
        distinguishing_aspect: "The trailing-30-day window filters BOTH the numerator (old error case) and the denominator (old inspected run); 44 days later the same data yields struck_pieces == 0 in-window and the gate stays open."
        test_recipe:
          setup: ["breach-shaped data (200/10000) all created at 2026-09-01; clock then advanced to 2026-10-15"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 50000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 10, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 900000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots/${lot_id}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T10:00:00Z", planned_quantity: 10000 }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /mint/production-runs/${run1}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run1}/inspect"
              payload: { outcome: "PASS", good_pieces: 9800 }
              as: QualityInspector
            - call: "POST /mint/error-coin-cases"
              payload: { production_run_id: "${run1}", error_pieces: 200 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P1", planned_start: "2026-10-16T08:00:00Z", planned_end: "2026-10-16T10:00:00Z", planned_quantity: 5000 }
              as: ProductionPlanner
              captures: { run2: $.data.id }
          trigger:
            - call: "POST /mint/production-runs/${run2}/start"
              as: ProductionPlanner
          assert:
            - "ProductionRun.${run2}.status == STRIKING (case and run1 both outside [2026-09-15, 2026-10-15]; in-window struck_pieces == 0 disables the gate)"

      - name: seigniorage_report_filters_by_fiscal_year
        claim_type: input_set_filtering
        grounds: ["calculations.budgeted_unit_seigniorage"]
        distinguishing_aspect: "The report's fiscal_year filter includes only that year's orders: FY2026 shows budgeted 1900000c while a 950000c FY2027 order is excluded."
        test_recipe:
          setup: ["QUARTER denomination; FY2026 order for 100000; FY2027 order for 50000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 100000, due_date: "2026-12-31" }
              as: FedLiaison
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2027, denomination_code: "QUARTER", quantity_ordered_pieces: 50000, due_date: "2027-12-31" }
              as: FedLiaison
          trigger:
            - call: "GET /mint/reports/seigniorage"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER" }
              as: FinanceOfficer
          assert:
            - "FY2026 QUARTER row: budgeted_seigniorage_cents == 1900000.0 (the FY2027 order's 950000.0 is excluded)"

      - name: surcharge_disbursement_cap_binds
        claim_type: correct_result
        grounds: ["calculations.surcharge_disbursement_amount", "state_machines.CommemorativeProgram.SALES_CLOSED_to_SURCHARGE_DISBURSED"]
        distinguishing_aspect: "min() boundary: accrued 400000c (400 paid units x 1000c) exceeds the statutory cap 350000c, so exactly 350000c is disbursed."
        test_recipe:
          setup: ["program (surcharge 1000c, cap 350000c) ON_SALE; product CX-CAP (mintage 400) sold out to one household (400 paid units); clock past the window end"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/commemorative-programs"
              payload: { name: "Cap Program", statute_reference: "PL 119-30", max_mintage_legal: 1000, surcharge_cents_per_unit: 1000, beneficiary_name: "Cap Fund", beneficiary_cap_cents: 350000, direct_costs_cents: 1000, sales_window_start: "2026-09-15T00:00:00Z", sales_window_end: "2026-12-31T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /mint/commemorative-programs/${prog_id}/decide-design"
              payload: { decision: "APPROVED" }
              as: MintDirector
            - call: "POST /mint/products"
              payload: { product_code: "CX-CAP", program_id: "${prog_id}", product_family: "CXCF", product_type: "COMMEMORATIVE", price_cents: 5000, mintage_limit: 400, household_order_limit: 500, release_datetime: "2026-09-16T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Cap Buyer", email: "cap@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 400 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o_id: $.data.id }
            - call: "POST /mint/orders/${o_id}/pay"
              payload: { amount_cents: 2000000 }
              as: Collector
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/commemorative-programs/${prog_id}/disburse-surcharges"
              as: FinanceOfficer
              as_user_id: "fin-1"
          assert:
            - "CommemorativeProgram.${prog_id}.surcharge_accrued_cents == 400000"
            - "CommemorativeProgram.${prog_id}.disbursed_cents == 350000 (cap binds)"
            - "CommemorativeProgram.${prog_id}.status == SURCHARGE_DISBURSED"

      - name: surcharge_disbursement_accrued_binds
        claim_type: correct_result
        grounds: ["calculations.surcharge_disbursement_amount"]
        distinguishing_aspect: "Other side of the min(): accrued 300000c (300 paid units) is under the 350000c cap, so the full 300000c is disbursed."
        test_recipe:
          setup: ["same shape as the cap case but product mintage 300 and 300 units sold"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/commemorative-programs"
              payload: { name: "Accrual Program", statute_reference: "PL 119-31", max_mintage_legal: 1000, surcharge_cents_per_unit: 1000, beneficiary_name: "Accrual Fund", beneficiary_cap_cents: 350000, direct_costs_cents: 1000, sales_window_start: "2026-09-15T00:00:00Z", sales_window_end: "2026-12-31T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { prog_id: $.data.id }
            - call: "POST /mint/commemorative-programs/${prog_id}/decide-design"
              payload: { decision: "APPROVED" }
              as: MintDirector
            - call: "POST /mint/products"
              payload: { product_code: "CX-ACC", program_id: "${prog_id}", product_family: "CXAF", product_type: "COMMEMORATIVE", price_cents: 5000, mintage_limit: 300, household_order_limit: 500, release_datetime: "2026-09-16T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Acc Buyer", email: "acc@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 300 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o_id: $.data.id }
            - call: "POST /mint/orders/${o_id}/pay"
              payload: { amount_cents: 1500000 }
              as: Collector
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/commemorative-programs/${prog_id}/disburse-surcharges"
              as: FinanceOfficer
              as_user_id: "fin-1"
          assert:
            - "CommemorativeProgram.${prog_id}.disbursed_cents == 300000 (accrued under cap passes through whole)"

      - name: program_net_proceeds_admin_fee_constant
        claim_type: constants_applied
        grounds: ["calculations.program_net_proceeds"]
        excluded_because:
          difficulty_instance: program_net_proceeds_pinned_evaluation_order
          rationale: "The §1.8 instance pins ADMIN_FEE_PCT 0.05 against gross 2000000/direct 1200000 and asserts net_proceeds_cents == 760000."

      - name: metal_exposure_hedged_lot_excluded
        claim_type: input_set_filtering
        grounds: ["calculations.metal_cost_exposure"]
        excluded_because:
          difficulty_instance: metal_exposure_mark_to_market_vs_budget_variance
          rationale: "The §1.8 instance places a hedged 10t lot in the same commodity; the asserted 2000000c/3000000c totals are exactly the unhedged-only sums."

      - name: household_limit_aggregates_across_collectors
        claim_type: input_set_filtering
        grounds: ["calculations.household_order_limit_check"]
        excluded_because:
          difficulty_instance: household_limit_exact_equality_accepted
          rationale: "The §1.8 instance aggregates two collectors sharing household_id HH-SHARED and asserts the third unit is rejected."

  # ------------------------------------------------------------------
  # Section: validations
  # ------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database; no headers will be sent"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /mint/products"
          assert:
            - "response is 401 with error_id ERR_UNAUTHENTICATED (headers absent)"

      - name: clock_regression_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CLOCK_REGRESSION]"]
        distinguishing_aspect: "Setting the logical clock backwards (2026-09-09 after 2026-09-10) fails ERR_CLOCK_REGRESSION; setting it to the same instant is allowed."
        test_recipe:
          setup: ["clock at 2026-09-10T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
          assert:
            - "err == ERR_CLOCK_REGRESSION"
            - "re-setting the SAME instant succeeds (no regression) and updates the COPPER spot"

      - name: pagination_limit_out_of_range_rejected
        claim_type: violation_to_error
        grounds: ["response_envelope.pagination_defaults", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "limit 0 and limit 101 both fail ERR_INVALID_REQUEST; the envelope declares min 1 / max 100."
        test_recipe:
          setup: ["one product exists"]
          setup_api_calls:
            - call: "POST /mint/products"
              payload: { product_code: "PG-1", product_family: "F1", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "GET /mint/products"
              payload: { limit: 0 }
              as: ProgramManager
              captures: { err0: $.data.error_id }
            - call: "GET /mint/products"
              payload: { limit: 101 }
              as: ProgramManager
              captures: { err101: $.data.error_id }
          assert:
            - "err0 == ERR_INVALID_REQUEST and err101 == ERR_INVALID_REQUEST"

      - name: product_type_invalid_enum_value_rejected
        claim_type: violation_to_error
        grounds: ["entities.NumismaticProduct.fields.product_type", "errors[ERR_INVALID_REQUEST]", "validations[priority=9]"]
        distinguishing_aspect: "product_type GOLD_BAR is not in the declared enum and fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["no products needed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/products"
              payload: { product_code: "ENUM-1", product_family: "F1", product_type: "GOLD_BAR", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: unknown_payload_field_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Sending the read-only/computed field status in a create payload fails 400 ERR_INVALID_REQUEST (no silent override of server state)."
        test_recipe:
          setup: ["none"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/products"
              payload: { product_code: "RO-1", product_family: "F1", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z", status: "ON_SALE" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (status is computed, not an input)"

      - name: order_zero_quantity_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUANTITY_INVALID]", "validations[priority=9]"]
        distinguishing_aspect: "quantity 0 fails ERR_QUANTITY_INVALID (400) even though the product is orderable."
        test_recipe:
          setup: ["product ON_SALE; collector"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "QTY-1", product_family: "F1", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Zero Qty", email: "zq@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 0 }
              as: Collector
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_QUANTITY_INVALID with http 400"

      - name: run_create_unknown_fed_order_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]", "entities.ProductionRun.fields.fed_order_id"]
        distinguishing_aspect: "A run whose fed_order_id does not resolve fails 404 ERR_NOT_FOUND (body-FK existence)."
        test_recipe:
          setup: ["no orders exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "00000000-0000-0000-0000-000000000000", facility: "DENVER", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 1000 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: fedorder_unknown_denomination_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNKNOWN_DENOMINATION]", "validations[priority=6]"]
        distinguishing_aspect: "An order whose denomination_code matches no Denomination.code fails ERR_UNKNOWN_DENOMINATION (422)."
        test_recipe:
          setup: ["no denominations exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "NOPE", quantity_ordered_pieces: 1000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNKNOWN_DENOMINATION"

      - name: order_unknown_product_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNKNOWN_PRODUCT]", "validations[priority=6]"]
        distinguishing_aspect: "An order naming a nonexistent product_id fails ERR_UNKNOWN_PRODUCT (422), not a generic 400."
        test_recipe:
          setup: ["collector exists; no products"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "No Product", email: "np@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /mint/orders"
              payload: { product_id: "00000000-0000-0000-0000-000000000000", quantity: 1 }
              as: Collector
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNKNOWN_PRODUCT"

      - name: lot_create_without_spot_price_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SPOT_PRICE_MISSING]", "validations[priority=6]"]
        distinguishing_aspect: "At the boot default clock no spot prices exist, so lot creation fails ERR_SPOT_PRICE_MISSING until the market feed is established via the clock endpoint."
        test_recipe:
          setup: ["QUARTER denomination exists; clock never set (boot default 2026-09-01T00:00:00Z, no spot prices)"]
          setup_api_calls:
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 5, budget_price_cents_per_tonne: 700000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SPOT_PRICE_MISSING (the boot default clock carries no market data)"

      - name: program_mintage_ceiling_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_MINTAGE_EXCEEDED]", "validations[priority=9]"]
        distinguishing_aspect: "Aggregate validation: product mintage 60 succeeds alone, but a second product with mintage 41 pushes the program sum to 101 > max_mintage_legal 100."
        test_recipe:
          setup: ["program with max_mintage_legal 100 (still in DESIGN_REVIEW); product one with mintage 60"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/commemorative-programs"
              payload: { name: "Ceiling Program", statute_reference: "PL 119-40", max_mintage_legal: 100, surcharge_cents_per_unit: 500, beneficiary_name: "Ceiling Fund", beneficiary_cap_cents: 100000, direct_costs_cents: 1000, sales_window_start: "2026-09-15T00:00:00Z", sales_window_end: "2026-12-31T00:00:00Z" }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /mint/products"
              payload: { product_code: "CEIL-1", program_id: "${prog_id}", product_family: "CEILA", product_type: "COMMEMORATIVE", price_cents: 5000, mintage_limit: 60, household_order_limit: 10, release_datetime: "2026-09-16T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /mint/products"
              payload: { product_code: "CEIL-2", program_id: "${prog_id}", product_family: "CEILB", product_type: "COMMEMORATIVE", price_cents: 5000, mintage_limit: 41, household_order_limit: 10, release_datetime: "2026-09-16T00:00:00Z" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROGRAM_MINTAGE_EXCEEDED (60 + 41 == 101 > 100)"

      - name: settle_by_offering_manager_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.BullionAllocation.CONFIRMED_to_SETTLED", "validations[priority=7]"]
        distinguishing_aspect: "Segregation of duties on settlement: the FinanceOfficer settling carries the same user id (pm-9) as the ProgramManager who made the offer — rejected even from CONFIRMED."
        test_recipe:
          setup: ["offer made by pm-9 and confirmed by the dealer"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 1000, offer_window_hours: 48 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 10, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              as_user_id: "pm-9"
              captures: { alloc_id: $.data.id }
            - call: "POST /mint/allocations/${alloc_id}/confirm"
              as: BullionDealer
              as_user_id: "${ap_id}"
          trigger:
            - call: "POST /mint/allocations/${alloc_id}/settle"
              as: FinanceOfficer
              as_user_id: "pm-9"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (settler id pm-9 == offered_by_user_id)"
            - "BullionAllocation.${alloc_id}.status stays CONFIRMED"

      - name: order_pay_wrong_amount_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAYMENT_AMOUNT_MISMATCH]", "validations[priority=9]"]
        distinguishing_aspect: "amount_cents 5999 against total_cents 6000 fails ERR_PAYMENT_AMOUNT_MISMATCH; the order stays UNPAID."
        test_recipe:
          setup: ["ALLOCATED order qty 3 at price 2000 (total 6000)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "AMT-1", product_family: "F1", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Wrong Amount", email: "wa@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 3 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /mint/orders/${o_id}/pay"
              payload: { amount_cents: 5999 }
              as: Collector
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PAYMENT_AMOUNT_MISMATCH and NumismaticOrder.${o_id}.payment_status stays UNPAID"

  # ------------------------------------------------------------------
  # Section: endpoints
  # ------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success envelope: meta.api_request_id and meta.api_request_timestamp present, response_type == 'object', data carries the entity."
        test_recipe:
          setup: ["none"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/collectors"
              payload: { full_name: "Envelope", email: "env@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c_id: $.data.id }
          assert:
            - "response has meta.api_request_id (non-empty) and meta.api_request_timestamp (ISO8601) and response_type == object"
            - "data.id == the captured collector id and http status == 201"

      - name: response_envelope_error_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Error envelope: response_type == 'error' with data.error_id and data.message present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /mint/orders/00000000-0000-0000-0000-000000000000"
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error and err == ERR_NOT_FOUND and data.message is a non-empty string"

      - name: list_pagination_envelope_and_offset
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "endpoints"]
        distinguishing_aspect: "Pagination envelope: with 3 products, limit=2 returns total_count 3, has_more true and 2 rows; limit=2&offset=2 returns 1 row, has_more false."
        test_recipe:
          setup: ["three products in distinct families"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "PAGE-1", product_family: "PGA", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z" }
              as: ProgramManager
            - call: "POST /mint/products"
              payload: { product_code: "PAGE-2", product_family: "PGB", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z" }
              as: ProgramManager
            - call: "POST /mint/products"
              payload: { product_code: "PAGE-3", product_family: "PGC", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "GET /mint/products"
              payload: { limit: 2 }
              as: ProgramManager
            - call: "GET /mint/products"
              payload: { limit: 2, offset: 2 }
              as: ProgramManager
          assert:
            - "page 1: total_count == 3, has_more == true, exactly 2 rows, response_type == array"
            - "page 2 (offset 2): has_more == false, exactly 1 row"

      - name: orders_list_filter_by_product
        claim_type: listing
        grounds: ["endpoints", "entities.NumismaticOrder.fields.product_id"]
        distinguishing_aspect: "Filtered list: with orders on two products, ?product_id=<p1> returns exactly the p1 order(s) and nothing else."
        test_recipe:
          setup: ["products F-1 and F-2 ON_SALE; one order on each by different collectors"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "F-1", product_family: "FA", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p1: $.data.id }
            - call: "POST /mint/products"
              payload: { product_code: "F-2", product_family: "FB", product_type: "PROOF_SET", price_cents: 3000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "F One", email: "f1@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "F Two", email: "f2@example.com", household_id: "HH-2" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p1}", quantity: 1 }
              as: Collector
              as_user_id: "${c1}"
            - call: "POST /mint/orders"
              payload: { product_id: "${p2}", quantity: 2 }
              as: Collector
              as_user_id: "${c2}"
          trigger:
            - call: "GET /mint/orders"
              payload: { product_id: "${p1}" }
              as: ProgramManager
          assert:
            - "total_count == 1 and the single row's product_id == ${p1} (the p2 order is excluded)"

      - name: report_seigniorage_computed_read
        claim_type: computed_read
        grounds: ["endpoints"]
        excluded_because:
          difficulty_instance: seigniorage_budgeted_vs_realized_on_fulfillment
          rationale: "The §1.8 instance reads GET /mint/reports/seigniorage and asserts the row's budgeted and realized figures."

  # ------------------------------------------------------------------
  # Section: rbac
  # ------------------------------------------------------------------
  - section: rbac
    instances:
      - name: collector_cannot_create_products
        claim_type: rbac_denial
        grounds: ["roles[Collector]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Collector calling POST /mint/products (ProgramManager-exclusive) gets 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["clock set; a collector id known to the caller is irrelevant to the role check"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/products"
              payload: { product_code: "RBAC-1", product_family: "F1", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-10-01T14:00:00Z" }
              as: Collector
              as_user_id: "c-x"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE with http 403 and no product is created"

      - name: quality_inspector_cannot_certify_destruction
        claim_type: rbac_denial
        grounds: ["roles[QualityInspector]", "roles[DestructionCertifier]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "QualityInspector (who may report cases) is NOT in the destroy endpoint's roles — the quality/ destruction split is role-enforced before any certifier-id check."
        test_recipe:
          setup: ["a QUARANTINED case exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { COPPER: 800000 } }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 50000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots"
              payload: { commodity: "COPPER", denomination_code: "QUARTER", quantity_tonnes: 10, budget_price_cents_per_tonne: 700000, locked_unit_price_cents_per_tonne: 900000, vault: "WEST_POINT", planned_delivery_date: "2026-09-05" }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mint/metal-procurement-lots/${lot_id}/receive"
              as: ProcurementOfficer
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 10000 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /mint/production-runs/${run_id}/start"
              as: ProductionPlanner
            - call: "POST /mint/production-runs/${run_id}/inspect"
              payload: { outcome: "PASS", good_pieces: 9800 }
              as: QualityInspector
            - call: "POST /mint/error-coin-cases"
              payload: { production_run_id: "${run_id}", error_pieces: 100 }
              as: QualityInspector
              as_user_id: "qi-1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /mint/error-coin-cases/${case_id}/destroy"
              payload: { primary_certifier_user_id: "dc-1", secondary_certifier_user_id: "dc-2" }
              as: QualityInspector
              as_user_id: "qi-9"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE with http 403 (role gate fires before the certifier rules)"

      - name: program_manager_cannot_disburse_surcharges
        claim_type: rbac_denial
        grounds: ["roles[ProgramManager]", "roles[FinanceOfficer]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "ProgramManager calling disburse-surcharges (FinanceOfficer-exclusive) gets 403 before any state or segregation check."
        test_recipe:
          setup: ["a program exists (any state)"]
          setup_api_calls:
            - call: "POST /mint/commemorative-programs"
              payload: { name: "RBAC Program", statute_reference: "PL 119-50", max_mintage_legal: 5000, surcharge_cents_per_unit: 500, beneficiary_name: "RBAC Fund", beneficiary_cap_cents: 100000, direct_costs_cents: 1000, sales_window_start: "2026-09-15T00:00:00Z", sales_window_end: "2026-12-31T00:00:00Z" }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /mint/commemorative-programs/${prog_id}/disburse-surcharges"
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE with http 403"

      - name: fedliaison_cannot_start_production_run
        claim_type: rbac_denial
        grounds: ["roles[FedLiaison]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "FedLiaison may submit and read orders but may not start a production run (ProductionPlanner-exclusive) — 403."
        test_recipe:
          setup: ["order + PLANNED run"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/denominations"
              payload: { code: "QUARTER", face_value_cents: 25, blank_budget_cost_cents: 4.0, striking_cost_cents: 2.0, blanks_per_tonne: 176000 }
              as: PlatformAdmin
            - call: "POST /mint/federal-reserve-orders"
              payload: { fiscal_year: 2026, denomination_code: "QUARTER", quantity_ordered_pieces: 50000, due_date: "2026-12-31" }
              as: FedLiaison
              captures: { fo_id: $.data.id }
            - call: "POST /mint/production-runs"
              payload: { fed_order_id: "${fo_id}", facility: "DENVER", press_line: "P1", planned_start: "2026-10-05T08:00:00Z", planned_end: "2026-10-05T12:00:00Z", planned_quantity: 50000 }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /mint/production-runs/${run_id}/start"
              as: FedLiaison
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE with http 403 and the run stays PLANNED"

      - name: collector_cannot_run_billing_cycle
        claim_type: rbac_denial
        grounds: ["roles[Collector]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Billing cycles are PlatformAdmin-run; a Collector (even the subscriber) calling billing-cycle gets 403."
        test_recipe:
          setup: ["ACTIVE subscription owned by the caller"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "SUB-RB", product_family: "SUBFAM", product_type: "SUBSCRIPTION_SERIES", price_cents: 9995, mintage_limit: 10000, household_order_limit: 1000, release_datetime: "2026-08-15T00:00:00Z", subscription_eligible: true }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "RB Sub", email: "rbs@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/subscriptions"
              payload: { product_id: "${p_id}", units_per_cycle: 1, frequency: "MONTHLY" }
              as: Collector
              as_user_id: "${c1}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /mint/subscriptions/${sub_id}/billing-cycle"
              payload: { expected_subscription_version: "${sub_v}" }
              as: Collector
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE with http 403"

      - name: bullion_dealer_cannot_create_allocation_offer
        claim_type: rbac_denial
        grounds: ["roles[BullionDealer]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "BullionDealer confirms allocations but cannot create offers (ProgramManager-exclusive) — 403."
        test_recipe:
          setup: ["issue + purchaser exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 1000, offer_window_hours: 48 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 5, expected_bullion_issue_version: "${issue_v}" }
              as: BullionDealer
              as_user_id: "${ap_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE with http 403 and remaining_pool_units stays 1000"

      - name: collector_reading_others_order_forbidden
        claim_type: ownership_enforcement
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_OWNERSHIP]", "roles[Collector]"]
        distinguishing_aspect: "Entity-backed ownership: Collector c2 reading c1's order gets 403 ERR_FORBIDDEN_OWNERSHIP (not 404 — the resource exists but is not theirs)."
        test_recipe:
          setup: ["product ON_SALE; c1 has an order; c2 is a different collector"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "OWN-1", product_family: "F1", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Owner", email: "own@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "Other", email: "oth@example.com", household_id: "HH-2" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /mint/orders/${o_id}"
              as: Collector
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_OWNERSHIP with http 403"

      - name: collector_listing_with_foreign_collector_filter_forbidden
        claim_type: ownership_enforcement
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "A Collector listing orders with collector_id != their own X-User-ID gets 403 ERR_FORBIDDEN_OWNERSHIP; listing with their own id works."
        test_recipe:
          setup: ["product ON_SALE; c1 has an order; c2 exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "OWN-2", product_family: "F1", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Lister One", email: "l1@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/collectors"
              payload: { full_name: "Lister Two", email: "l2@example.com", household_id: "HH-2" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c1}"
          trigger:
            - call: "GET /mint/orders"
              payload: { collector_id: "${c1}" }
              as: Collector
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
            - call: "GET /mint/orders"
              payload: { collector_id: "${c2}" }
              as: Collector
              as_user_id: "${c2}"
          assert:
            - "foreign filter: err == ERR_FORBIDDEN_OWNERSHIP (403)"
            - "own filter: 200 with total_count == 0 (c2 has no orders)"

      - name: allocation_confirm_while_ap_suspended_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_AP_NOT_APPROVED]", "state_machines.BullionAllocation.OFFERED_to_CONFIRMED"]
        distinguishing_aspect: "The AP-status gate is re-checked at confirm: an offer made while APPROVED cannot be confirmed after the purchaser is SUSPENDED."
        test_recipe:
          setup: ["offer created while the purchaser was APPROVED; purchaser then SUSPENDED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 1000, offer_window_hours: 72 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Flip Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 10, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { alloc_id: $.data.id }
            - call: "POST /mint/authorized-purchasers/${ap_id}/set-status"
              payload: { to_status: "SUSPENDED" }
              as: MintDirector
          trigger:
            - call: "POST /mint/allocations/${alloc_id}/confirm"
              as: BullionDealer
              as_user_id: "${ap_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AP_NOT_APPROVED and allocation stays OFFERED"

  # ------------------------------------------------------------------
  # Section: cross_cutting_layers
  # ------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_allocation_offer_stale_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[allocation-offer-stale-issue]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on BullionIssue.version: offer1 with the observed version 1 succeeds (version advances to 2); a second offer still carrying expected_bullion_issue_version 1 fails 412 ERR_STALE_VERSION; refetching and retrying with version 2 succeeds."
        test_recipe:
          setup: ["GOLD spot; issue (pool 1000) at version 1; APPROVED purchaser"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z", spot_prices: { GOLD: 250000 } }
              as: PlatformAdmin
            - call: "POST /mint/bullion-issues"
              payload: { name: "AGE 2026", metal: "GOLD", unit_weight_oz: 1.0, total_pool_units: 1000, offer_window_hours: 48 }
              as: ProgramManager
              captures: { issue_id: $.data.id, issue_v: $.data.version }
            - call: "POST /mint/authorized-purchasers"
              payload: { name: "Dealer", tier: "T1" }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 10, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { alloc1: $.data.id }
          trigger:
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 10, expected_bullion_issue_version: "${issue_v}" }
              as: ProgramManager
              captures: { err: $.data.error_id }
            - call: "GET /mint/bullion-issues/${issue_id}"
              as: ProgramManager
              captures: { issue_v2: $.data.version }
            - call: "POST /mint/bullion-issues/${issue_id}/allocations"
              payload: { authorized_purchaser_id: "${ap_id}", quantity_units: 10, expected_bullion_issue_version: "${issue_v2}" }
              as: ProgramManager
              captures: { alloc3: $.data.id }
          assert:
            - "stale retry: err == ERR_STALE_VERSION with http 412 (version advanced 1 -> 2 under the client's feet)"
            - "after refetch: BullionIssue.${issue_id}.version == 2, and the retry with version 2 succeeds"
            - "BullionIssue.${issue_id}.remaining_pool_units == 980 (two accepted offers of 10)"

      - name: occ_billing_cycle_stale_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[billing-cycle-stale-subscription]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Subscription.version: after a successful billing cycle advances the version to 2, replaying the cycle with the stale version 1 fails 412 ERR_STALE_VERSION — and this state-level check beats the billing-not-due temporal check that would also fail."
        test_recipe:
          setup: ["subscription at version 1; first billing cycle completed (version now 2, next_billing_date 2026-10-01); clock still 2026-09-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "SUB-OCC", product_family: "SUBFAM", product_type: "SUBSCRIPTION_SERIES", price_cents: 9995, mintage_limit: 10000, household_order_limit: 1000, release_datetime: "2026-08-15T00:00:00Z", subscription_eligible: true }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "OCC Sub", email: "occ@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/subscriptions"
              payload: { product_id: "${p_id}", units_per_cycle: 1, frequency: "MONTHLY" }
              as: Collector
              as_user_id: "${c1}"
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /mint/subscriptions/${sub_id}/billing-cycle"
              payload: { expected_subscription_version: "${sub_v}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mint/subscriptions/${sub_id}/billing-cycle"
              payload: { expected_subscription_version: "${sub_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION with http 412 (priority 5 state/OCC precedes priority 8 temporal; the not-due condition never surfaces)"
            - "Subscription.${sub_id}.cycles_billed == 1"

      - name: product_release_auto_opens_at_release_datetime
        claim_type: scheduled_execution
        grounds: ["state_machines.NumismaticProduct.SCHEDULED_to_ON_SALE"]
        distinguishing_aspect: "Scheduled action: a program-less product stays SCHEDULED at clock 2026-09-19 and flips to ON_SALE exactly when the clock reaches its release_datetime 2026-09-20T00:00:00Z."
        test_recipe:
          setup: ["product REL-1 with release_datetime 2026-09-20T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "REL-1", product_family: "RELF", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-09-20T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-19T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mint/products/${p_id}"
              as: ProgramManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /mint/products/${p_id}"
              as: ProgramManager
          assert:
            - "at 2026-09-19: status == SCHEDULED"
            - "at 2026-09-20 (release instant, inclusive): status == ON_SALE"

      - name: cascading_side_effects_layer
        claim_type: cascade_chain
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: run_completion_bubbles_fulfillment_and_seigniorage
          rationale: "The layer's N-level chain claim is verified end-to-end by the two §1.8 transitive_cascade instances (run-completion chain and cancel-promotion chain)."

      - name: dual_variant_calculation_layer
        claim_type: variant_divergence
        grounds: ["complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: seigniorage_budgeted_vs_realized_on_fulfillment
          rationale: "Both declared dual-variant pairs (seigniorage, metal exposure) are asserted with exact divergent cent figures in §1.8."

  # ------------------------------------------------------------------
  # Section: consistency_model
  # ------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the GET issued right after pay reflects payment_status PAID and derived status COMPLETED in the same clock instant — no lag, no recompute delay."
        test_recipe:
          setup: ["ALLOCATED order qty 1 (total 2000c)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/products"
              payload: { product_code: "IMM-1", product_family: "F1", product_type: "PROOF_SET", price_cents: 2000, mintage_limit: 100, household_order_limit: 10, release_datetime: "2026-08-15T00:00:00Z" }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /mint/collectors"
              payload: { full_name: "Immediate", email: "imm@example.com", household_id: "HH-1" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /mint/orders"
              payload: { product_id: "${p_id}", quantity: 1 }
              as: Collector
              as_user_id: "${c1}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /mint/orders/${o_id}/pay"
              payload: { amount_cents: 2000 }
              as: Collector
              as_user_id: "${c1}"
            - call: "GET /mint/orders/${o_id}"
              as: Collector
              as_user_id: "${c1}"
          assert:
            - "immediately after pay: payment_status == PAID and status == COMPLETED and updated_at is refreshed"
