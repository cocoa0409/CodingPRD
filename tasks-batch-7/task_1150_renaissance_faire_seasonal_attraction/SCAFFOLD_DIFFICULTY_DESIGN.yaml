# =============================================================================
# §1.8: Scaffold Difficulty Design (Test Targeting Index)
# Task 1150 — Renaissance Faire & Seasonal Attraction Operations
# 9 rules x 2 instances = 18 instances. All fixture arithmetic pre-computed:
#   season_weeks = ceil(14d/7) = 2 for opening 2026-06-06 / closing 2026-06-20
#   booth PRIME 100sqft: provisional = 100*120*2 = 24000
#   residency [06-06, 06-20) = 14 days: daily credit = round(24000*0.25/14) = 429
#   final fee: subtotal 24000-1287 = 22713 >= 20000 -> surcharge round(22713*0.05)=1136
#   cast: rate 20000, weather pct 0.5 -> cancelled day +10000, completed +20000
#   tickets: DAY qty3 unit 3000 -> 9000 + 3*150 = 9450; GROUP 10 -> 27000; 20 -> 51000
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: booth_fee_provisional_vs_final_settlement
        grounds:
          - calculations.booth_provisional_fee
          - calculations.booth_final_fee
          - calculations.weather_vendor_credit
          - state_machines.BoothAssignment.CONFIRMED_to_SETTLED
        distinguishing_aspect: |
          Vendor-finance domain: the same booth (100 sqft PRIME, 2 season weeks) prices at
          24000 under the forward-looking provisional variant and at 23849 under the
          settlement variant (post-credit subtotal 22713 + PRIME surcharge 1136) — two valid
          algorithms, two different cents values. Companion instance covers the cast-payroll domain.
        test_recipe:
          setup:
            - "Season PLANNING->BUILD->OPEN with opening 2026-06-06, closing 2026-06-20, volunteer_min_hours 8, grace 14"
            - "FaireDays 06-06, 06-07, 06-13, 06-14, 06-20; artisan vendor JURIED_IN; booth A-01 residency [06-06, 06-20) CONFIRMED, provisional 24000"
            - "Two 4h volunteer shifts on 06-06 CONFIRMED (posture READY); 06-06 OPERATING then COMPLETED; 06-07/06-13/06-14 CANCELLED_WEATHER (credit 429 each); 06-20 COMPLETED; season STRIKE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Summer Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 8, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-07T00:00:00Z" }, as: FaireOperator, captures: { d2: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-13T00:00:00Z" }, as: FaireOperator, captures: { d3: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-14T00:00:00Z" }, as: FaireOperator, captures: { d4: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-20T00:00:00Z" }, as: FaireOperator, captures: { d5: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Ironwood Carvings", category: "ARTISAN" }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 100, requested_location_tier: "PRIME" }, as: Vendor, as_user_id: "${v_id}", captures: { a_id: $.data.id } }
            - { call: "POST /vendor-applications/${a_id}/decide", payload: { craft_score: 8, authenticity_score: 9, safety_score: 7, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /booth-assignments", payload: { application_id: "${a_id}", booth_site: "A-01", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-20T00:00:00Z" }, as: VendorCoordinator, captures: { b_id: $.data.id, prov_fee: $.data.provisional_fee_cents } }
            - { call: "POST /booth-assignments/${b_id}/confirm", payload: {}, as: Vendor, as_user_id: "${v_id}" }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "GATE", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T12:00:00Z" }, as: Volunteer, as_user_id: "vol-anna", captures: { sh1: $.data.id } }
            - { call: "POST /volunteer-shifts", payload: { season_id: "${s_id}", faire_day_id: "${d1}", role: "TAVERN", start_time: "2026-06-06T08:00:00Z", end_time: "2026-06-06T12:00:00Z" }, as: Volunteer, as_user_id: "vol-ben", captures: { sh2: $.data.id } }
            - { call: "POST /volunteer-shifts/${sh1}/confirm", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-shifts/${sh2}/confirm", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /seasons/${s_id}/open", payload: {}, as: FaireOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-06T07:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-gates", payload: {}, as: FaireOperator }
            - { call: "POST /volunteer-shifts/${sh1}/close-out", payload: { outcome: "WORKED" }, as: VolunteerCoordinator }
            - { call: "POST /volunteer-shifts/${sh2}/close-out", payload: { outcome: "WORKED" }, as: VolunteerCoordinator }
            - { call: "POST /faire-days/${d1}/complete", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d2}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d2}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d3}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d3}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d4}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d4}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d5}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T07:00:00Z" }, as: FaireOperator }
            - { call: "POST /faire-days/${d5}/open-gates", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d5}/complete", payload: {}, as: FaireOperator }
            - { call: "POST /seasons/${s_id}/begin-strike", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /booth-assignments/${b_id}/settle", payload: {}, as: VendorCoordinator, captures: { b_final: $.data.final_fee_cents, b_credit: $.data.weather_credit_cents, b_delta: $.data.settlement_delta_cents } }
          assert:
            - "BoothAssignment.${b_id}.provisional_fee_cents == 24000 (100 sqft * 120 * 2 weeks, forward-looking variant)"
            - "BoothAssignment.${b_id}.weather_credit_cents == 1287 (3 cancelled in-residency days * 429 per-day-rounded)"
            - "BoothAssignment.${b_id}.final_fee_cents == 23849 (subtotal 22713 + surcharge 1136) — differs from provisional 24000"
            - "BoothAssignment.${b_id}.settlement_delta_cents == -151"
            - "BoothAssignment.${b_id}.status == SETTLED"

      - name: cast_payout_accrual_vs_guarantee_floor
        grounds:
          - calculations.cast_accrued_payout
          - calculations.cast_final_payout
          - state_machines.CastContract.PERFORMING_to_COMPLETED
        distinguishing_aspect: |
          Cast-payroll domain (distinct entity domain from the booth-fee instance): with all 5
          faire days weather-cancelled, the chronological weather-adjusted accrual yields 50000
          (5 * round(20000*0.5)) while the guarantee-floor final payout yields 60000
          (max(50000, 3*20000) - 0 rehearsal penalty) for the identical day history.
        test_recipe:
          setup:
            - "Season (opening 06-06, closing 06-20, volunteer_min_hours 0, grace 14) with 5 faire days; performer rate 20000"
            - "CastContract DRAFT->OFFERED->ACCEPTED, 4 rehearsal hours attended of 4 required; season BUILD then OPEN (contract PERFORMING); all 5 days OPEN_FOR_SALES then CANCELLED_WEATHER"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "All-Rain Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { e1: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-07T00:00:00Z" }, as: FaireOperator, captures: { e2: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-13T00:00:00Z" }, as: FaireOperator, captures: { e3: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-14T00:00:00Z" }, as: FaireOperator, captures: { e4: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-20T00:00:00Z" }, as: FaireOperator, captures: { e5: $.data.id } }
            - { call: "POST /performers", payload: { stage_name: "Sir Cedric", act_type: "COMBAT", base_day_rate_cents: 20000 }, as: CastDirector, captures: { p_id: $.data.id } }
            - { call: "POST /cast-contracts", payload: { season_id: "${s_id}", performer_id: "${p_id}", offered_day_rate_cents: 20000, guaranteed_days: 3, weather_pay_pct: 0.5, required_rehearsal_hours: 4 }, as: CastDirector, captures: { c_id: $.data.id } }
            - { call: "POST /cast-contracts/${c_id}/offer", payload: {}, as: CastDirector }
            - { call: "POST /cast-contracts/${c_id}/accept", payload: {}, as: Performer, as_user_id: "${p_id}" }
            - { call: "POST /rehearsal-slots", payload: { contract_id: "${c_id}", stage_name: "MAIN", start_time: "2026-05-10T09:00:00Z", end_time: "2026-05-10T11:00:00Z" }, as: CastDirector, captures: { r1: $.data.id } }
            - { call: "POST /rehearsal-slots", payload: { contract_id: "${c_id}", stage_name: "MAIN", start_time: "2026-05-10T11:15:00Z", end_time: "2026-05-10T13:15:00Z" }, as: CastDirector, captures: { r2: $.data.id } }
            - { call: "POST /rehearsal-slots/${r1}/record-attendance", payload: { outcome: "ATTENDED" }, as: CastDirector }
            - { call: "POST /rehearsal-slots/${r2}/record-attendance", payload: { outcome: "ATTENDED" }, as: CastDirector }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /seasons/${s_id}/open", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e1}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e1}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e2}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e2}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e3}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e3}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e4}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e4}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e5}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${e5}/cancel-weather", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /seasons/${s_id}/begin-strike", payload: {}, as: FaireOperator }
            - { call: "GET /cast-contracts/${c_id}", payload: {}, as: Any, captures: { c_acc: $.data.accrued_payout_cents, c_fin: $.data.final_payout_cents, c_status: $.data.status } }
          assert:
            - "CastContract.${c_id}.status == COMPLETED"
            - "CastContract.${c_id}.accrued_payout_cents == 50000 (5 weather-cancelled days * round(20000*0.5))"
            - "CastContract.${c_id}.final_payout_cents == 60000 (max(50000, 3*20000) - 0 shortfall penalty)"
            - "accrued 50000 != final 60000 — guarantee floor exceeds weather-adjusted accrual for identical day history"

  - rule_id: combinatorial_formula
    instances:
      - name: group_order_tiered_total_with_conditional_fee
        grounds:
          - calculations.ticket_order_total
          - entities.TicketOrder.fields.total_cents
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tiered discount selection keyed on
          quantity vs group_min_size multiples AND a conditional per-ticket convenience fee keyed
          on order_type. DAY qty3 -> 9450 (fee 450, no discount); GROUP qty10 -> 27000 (10%);
          GROUP qty20 -> 51000 (15%); SEASON qty2 -> 18000 (no fee, no discount). Companion
          instance exercises mode (b) nested rounding.
        test_recipe:
          setup:
            - "Season (group_min_size 10, volunteer_min_hours 0) in BUILD with faire day 06-06 OPEN_FOR_SALES"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Pricing Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-06T00:00:00Z" }, as: FaireOperator, captures: { d1: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d1}/open-sales", payload: {}, as: FaireOperator }
          trigger:
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "DAY", quantity: 3, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-day@x.com", captures: { o_day: $.data.total_cents, o_day_fee_disc: $.data.discount_pct } }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "GROUP", quantity: 10, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-g10@x.com", captures: { o_g10: $.data.total_cents, o_g10_disc: $.data.discount_pct } }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "GROUP", quantity: 20, unit_price_cents: 3000, faire_day_id: "${d1}" }, as: Guest, as_user_id: "g-g20@x.com", captures: { o_g20: $.data.total_cents, o_g20_disc: $.data.discount_pct } }
            - { call: "POST /ticket-orders", payload: { season_id: "${s_id}", order_type: "SEASON", quantity: 2, unit_price_cents: 9000 }, as: Guest, as_user_id: "g-sea@x.com", captures: { o_sea: $.data.total_cents } }
          assert:
            - "DAY order total_cents == 9450 (9000 base + 3*150 convenience fee), discount_pct == 0"
            - "GROUP qty10 total_cents == 27000 (30000 * 0.90), discount_pct == 0.10"
            - "GROUP qty20 total_cents == 51000 (60000 * 0.85), discount_pct == 0.15"
            - "SEASON qty2 total_cents == 18000 (no fee for non-DAY, no discount for non-GROUP)"

      - name: weather_credit_per_day_rounding_order
        grounds:
          - calculations.weather_vendor_credit
          - entities.BoothAssignment.fields.weather_credit_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the scaffold pins per-day rounding
          (round each day's credit half-up, then sum). Residency of 14 days yields a non-integer
          daily credit 428.571...; 3 cancelled days give 3*429 = 1287 under the pinned order vs
          1286 under aggregate-then-round. Distinct mode from the tiered/fee formula instance.
        test_recipe:
          setup:
            - "Season (volunteer_min_hours 0) in BUILD; artisan vendor JURIED_IN; booth A-01 residency [2026-06-06, 2026-06-20) = 14 days, provisional 24000"
            - "FaireDays 06-07, 06-13, 06-14 opened then weather-cancelled (all inside residency)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Rainy Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-07T00:00:00Z" }, as: FaireOperator, captures: { d2: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-13T00:00:00Z" }, as: FaireOperator, captures: { d3: $.data.id } }
            - { call: "POST /faire-days", payload: { season_id: "${s_id}", date: "2026-06-14T00:00:00Z" }, as: FaireOperator, captures: { d4: $.data.id } }
            - { call: "POST /vendors", payload: { business_name: "Pewter & Pine", category: "ARTISAN" }, as: VendorCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-applications", payload: { season_id: "${s_id}", booth_size_sqft: 100, requested_location_tier: "PRIME" }, as: Vendor, as_user_id: "${v_id}", captures: { a_id: $.data.id } }
            - { call: "POST /vendor-applications/${a_id}/decide", payload: { craft_score: 8, authenticity_score: 8, safety_score: 8, outcome: "JURIED_IN" }, as: VendorCoordinator }
            - { call: "POST /booth-assignments", payload: { application_id: "${a_id}", booth_site: "A-01", residency_start_date: "2026-06-06T00:00:00Z", residency_end_date: "2026-06-20T00:00:00Z" }, as: VendorCoordinator, captures: { b_id: $.data.id } }
            - { call: "POST /seasons/${s_id}/begin-build", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d2}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d2}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d3}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d3}/cancel-weather", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d4}/open-sales", payload: {}, as: FaireOperator }
            - { call: "POST /faire-days/${d4}/cancel-weather", payload: {}, as: FaireOperator }
          trigger:
            - { call: "GET /booth-assignments/${b_id}", payload: {}, as: Any, captures: { credit: $.data.weather_credit_cents } }
          assert:
            - "BoothAssignment.${b_id}.weather_credit_cents == 1287 (per-day round: 3 * round(24000*0.25/14) = 3 * 429)"
            - "weather_credit_cents != 1286 (aggregate-then-round value; pinning per-day rounding is observable)"

  - rule_id: non_linear_state_machine
    instances:
      - name: cast_contract_counter_offer_cycle
        grounds:
          - state_machines.CastContract.OFFERED_to_COUNTERED
          - state_machines.CastContract.COUNTERED_to_OFFERED
        distinguishing_aspect: |
          Cyclic machine on CastContract: OFFERED -> COUNTERED -> OFFERED loop with
          negotiation_round increments and rate adoption from the counter. Distinct entity from
          the VendorApplication appeal-cycle instance.
        test_recipe:
          setup:
            - "Season PLANNING (volunteer_min_hours 0); performer registered; contract DRAFT at 20000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FaireOperator }
            - call: "POST /seasons"
              payload: { name: "Negotiation Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }
              as: FaireOperator
              captures: { s_id: $.data.id }
            - { call: "POST /performers", payload: { stage_name: "Madame Zara", act_type: "COMEDY", base_day_rate_cents: 18000 }, as: CastDirector, captures: { p_id: $.data.id } }
            - { call: "POST /cast-contracts", payload: { season_id: "${s_id}", performer_id: "${p_id}", offered_day_rate_cents: 20000, guaranteed_days: 2, weather_pay_pct: 0.5, required_rehearsal_hours: 2 }, as: CastDirector, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /cast-contracts/${c_id}/offer", payload: {}, as: CastDirector, captures: { st1: $.data.status, nr1: $.data.negotiation_round } }
            - { call: "POST /cast-contracts/${c_id}/counter", payload: { countered_day_rate_cents: 25000 }, as: Performer, as_user_id: "${p_id}", captures: { st2: $.data.status, nr2: $.data.negotiation_round } }
            - { call: "POST /cast-contracts/${c_id}/counter", payload: { countered_day_rate_cents: 26000 }, as: Performer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
            - { call: "POST /cast-contracts/${c_id}/offer", payload: {}, as: CastDirector, captures: { st3: $.data.status, nr3: $.data.negotiation_round, rate3: $.data.offered_day_rate_cents } }
            - { call: "POST /cast-contracts/${c_id}/accept", payload: {}, as: Performer, as_user_id: "${p_id}", captures: { st4: $.data.status } }
          assert:
            - "After first offer: status OFFERED, negotiation_round == 1"
            - "After counter: status COUNTERED, negotiation_round == 2"
            - "Second counter while COUNTERED rejected with ERR_CONTRACT_NOT_OFFERED"
            - "After re-offer (rate omitted): status OFFERED, negotiation_round == 3, offered_day_rate_cents == 25000 (countered rate adopted)"
            - "After accept: status ACCEPTED"

      - name: vendor_application_appeal_cycle
        grounds:
          - state_machines.VendorApplication.JURIED_OUT_to_APPEALED
          - state_machines.VendorApplication.APPEALED_to_JURIED_IN
        distinguishing_aspect: |
          Cyclic machine on VendorApplication: JURIED_OUT -> APPEALED -> (re-decide) -> JURIED_IN,
          with appeal_used latched. Distinct entity from the CastContract negotiation cycle.
        test_recipe:
          setup:
