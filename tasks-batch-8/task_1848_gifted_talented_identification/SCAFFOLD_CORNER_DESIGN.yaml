            - { call: "POST /gifted/placements/${plc_x}/re-evaluations", payload: { due_on: "2027-01-15" }, as: GiftedCoordinator, captures: { re_x: $.data.id } }
            - { call: "POST /gifted/placements/${plc_y}/re-evaluations", payload: { due_on: "2027-01-15" }, as: GiftedCoordinator, captures: { re_y: $.data.id } }
