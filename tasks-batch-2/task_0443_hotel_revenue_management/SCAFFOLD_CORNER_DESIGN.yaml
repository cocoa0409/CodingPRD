              captures: { err: $.data.error_id }
          assert:
            - "Response code 401; error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_publish_stale_rate_plan_version_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[publish-stale-rate-plan]"
          - entities.RatePlan.fields.version
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Publishing a second decision with a RatePlan version stale by one (first publish bumped it) -> ERR_STALE_VERSION (412); version increments on the successful publish."
        test_recipe:
          setup: ["Property/RoomType/master BAR plan; InventoryDay; two DRAFT decisions; first published"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "OccPub", total_rooms: 50 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "STD", name: "Standard", physical_rooms: 50 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp: $.data.id, rpv0: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-21T00:00:00Z", physical_capacity: 50, transient_sold_rooms: 10 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-21T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec1: $.data.id }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-21T00:00:00Z", requested_rate: 250 }
              as: RevenueManager
              captures: { dec2: $.data.id }
            - call: "POST /rate-decisions/${dec1}/publish"
              payload: { expected_rate_plan_version: "${rpv0}" }
              as: RevenueManager
          trigger:
            - call: "POST /rate-decisions/${dec2}/publish"
              payload: { expected_rate_plan_version: "${rpv0}" }
              as: RevenueManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 412; error_id == ERR_STALE_VERSION; RateDecision.${dec2}.status == DRAFT"

      - name: occ_commit_stale_room_type_version_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[commit-stale-room-type]"
          - entities.RoomType.fields.version
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Committing a second block with a RoomType version stale by one (first commit bumped it) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Property/RoomType; InventoryDay capacity 30 sold 2; two evaluated-ACCEPT blocks of 3 rooms; first committed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "OccCommit", total_rooms: 30 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "KING", name: "King", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt: $.data.id, rtv0: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-22T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 2 }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt}", group_name: "Romeo", arrival_date: "2026-06-22T00:00:00Z", nights: 1, rooms_per_night: 3, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb1: $.data.id }
            - call: "POST /group-blocks/${gb1}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt}", group_name: "Sierra", arrival_date: "2026-06-22T00:00:00Z", nights: 1, rooms_per_night: 3, offered_rate: 400 }
              as: GroupSalesManager
              captures: { gb2: $.data.id }
            - call: "POST /group-blocks/${gb2}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
            - call: "POST /group-blocks/${gb1}/commit"
              payload: { expected_room_type_version: "${rtv0}" }
              as: GroupSalesManager
          trigger:
            - call: "POST /group-blocks/${gb2}/commit"
              payload: { expected_room_type_version: "${rtv0}" }
              as: GroupSalesManager
              captures: { err: $.data.error_id }
          assert:
            - "Response code 412; error_id == ERR_STALE_VERSION; GroupBlock.${gb2}.status == NEGOTIATING"

      - name: rate_threshold_no_rule_eligible_below_threshold
        claim_type: rate_threshold_triggers
        grounds: [calculations.rate_yield, entities.YieldRule.fields.occupancy_threshold_pct]
        distinguishing_aspect: "Forecast occ 0.74 just below a 0.75-threshold rule -> rule does NOT fire; yielded_rate equals requested (no adjustment), boundary at threshold-epsilon."
        test_recipe:
          setup: ["Property/RoomType capacity 100; one rule T0.75/+0.10; InventoryDay sold 49 -> forecast round(73.5)=74, occ 0.74; requested 200; rooms_available 51 (no premium)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "BelowThr", total_rooms: 100 }
              as: RevenueManager
              captures: { pid: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${pid}", code: "STD", name: "Standard", physical_rooms: 100 }
              as: RevenueManager
              captures: { rt: $.data.id }
            - call: "POST /yield-rules"
              payload: { property_id: "${pid}", name: "Thr75", occupancy_threshold_pct: 0.75, adjustment_pct: 0.10, priority: 1, enabled: true }
              as: RevenueManager
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp: $.data.id, rpv: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 100, transient_sold_rooms: 49 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp}", stay_date: "2026-06-06T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec}/publish"
              payload: { expected_rate_plan_version: "${rpv}" }
              as: RevenueManager
              captures: { yr: $.data.yielded_rate, ar: $.data.applied_yield_rule_id }
          assert:
            - "RateDecision.${dec}.yielded_rate == 200.00 and applied_yield_rule_id == null"

      - name: cascade_publish_channel_resync_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.RateDecision.DRAFT_to_PUBLISHED, calculations.channel_sync]
        excluded_because:
          difficulty_instance: transitive_cascade / publish_sets_rate_then_resyncs_channel_depth2
          rationale: "The publish -> published_rate -> channel re-sync cascade is exercised end-to-end by the named §1.8 transitive-cascade instance."

