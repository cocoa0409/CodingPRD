  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_certification_failure_beats_page_overflow
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint: a submission that violates BOTH the human-subjects certification window (expiry 2026-11-01 < receipt deadline
          2026-12-01) AND the page limit (13 > 12) must fail with ERR_CERTIFICATION_EXPIRED, not
          ERR_PAGE_LIMIT_EXCEEDED, because compliance checks order before constraint checks.
        test_recipe:
          setup:
            - "Institution whose human_subjects_certification_expiry (2026-11-01) precedes the FOA receipt_deadline (2026-12-01); draft application with human_subjects_involved true and 13 pages against a 12-page FOA"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University", human_subjects_certification_expiry: "2026-11-01T00:00:00Z" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/funding-opportunities", payload: { pa_number: "PA-26-110", title: "R01 Cert FOA", activity_code: "R01", research_strategy_page_limit: 12, min_direct_cents_per_year: 1000000, max_direct_cents_per_year: 25000000, max_years: 5, open_date: "2026-08-01T00:00:00Z", receipt_deadline: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, captures: { foa_id: $.data.id } }
