# =============================================================================
# task_2705 — App Store Submission & Review Compliance
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# 9 rule_ids from §0.5, 28 instances total. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls chain drives empty-DB -> the
# `setup:` state using only endpoints declared in §1.5, with every ${var} bound
# by an earlier `captures:` in the same instance. The logical clock starts at
# its mandatory default 2026-08-01T00:00:00Z; POST /_clock/set_current_utc is
# used (monotonically) only where a time gate demands it.
#
# Fixed actor ids used across instances (X-User-ID values):
#   u-pubadmin-1  PublisherAdmin        u-release-1    ReleaseManager
#   u-compliance-1/2 ComplianceOfficer  u-reviewer-1/2 PlatformReviewer
#   u-board-1     PlatformAppealBoard   u-policy-1     PlatformPolicyAdmin
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: disclosure_late_finding_provisional_vs_final
        grounds:
          - calculations.disclosure_accuracy_score
          - entities.Submission.fields.disclosure_accuracy_score_provisional
          - entities.Submission.fields.disclosure_accuracy_score_final
          - entities.BehaviorFinding.fields.detected_at
          - state_machines.Submission.WAITING_FOR_REVIEW_to_IN_REVIEW
          - validations[priority=55]
        distinguishing_aspect: |
          The SELF_REVIEW_PROVISIONAL variant excludes the MAJOR finding because its detected_at
          (2026-08-01T06:00:00Z) is later than pre_review_checked_at (2026-08-01T00:00:00Z), so it
          stays at 1.0000 while REVIEW_FINAL — which has no detected_at bound — lands on 0.8000 for
          the identical stored rows, and the APPROVE gate reads the final variant only.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE, standing_score_lifetime 100.00, STANDARD commerce tier"
            - "AppRecord IOS with an ACTIVE DISTRIBUTION_CERT and full PASSED mapping coverage (feature_compliance_index 100.00, posture OPEN)"
            - "Submission build 10 with one declared privacy item {DEVICE_ID, ANALYTICS, false, false}, pre-review passed at clock 2026-08-01T00:00:00Z"
            - "One OPEN MAJOR BehaviorFinding on DEVICE_ID detected_at 2026-08-01T06:00:00Z that does NOT match the declared tuple (purpose ADVERTISING, linked true, tracking true)"
            - "One OPEN ReviewCapacityWindow IOS/POOL_A [2026-08-01, 2026-09-01) with capacity_slots 5"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_id: "$.data.id", acct_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { cert_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "GET /publisher-accounts/${acct_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { acct_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { prof_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_id: "$.data.id" } }
            - { call: "POST /guideline-rules", payload: { rule_code: "5.1.1", title: "Data collection and storage", category: "PRIVACY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_priv_id: "$.data.id" } }
            - { call: "POST /guideline-rules/${rule_priv_id}/publish", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /feature-mappings", payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_priv_id}", feature_code: "ACCOUNT_DELETION" }, as: ComplianceOfficer, as_user_id: "u-compliance-1", captures: { fm_priv_id: "$.data.id" } }
            - { call: "POST /feature-mappings/${fm_priv_id}/self-review", payload: { outcome: "START" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings/${fm_priv_id}/self-review", payload: { outcome: "PASS", evidence_ref: "https://evidence.northwind.example/acct-deletion.pdf" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "GET /app-records/${app_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_v_cur: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v_cur}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 10, version_string: "1.0.0", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub_id: "$.data.id" } }
            - { call: "POST /metadata-locales", payload: { submission_id: "${sub_id}", locale: "en-US", title: "Northwind Wallet", screenshot_counts: { PHONE_65: 3, TABLET_129: 2 }, is_primary: true, subtitle: "Spend smarter", keywords: "wallet,finance" }, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "PUT /submissions/${sub_id}/age-rating", payload: { age_rating_answers: { VIOLENCE: 0, SEXUAL_CONTENT: 0, DRUGS_ALCOHOL: 0, GAMBLING_SIMULATED: 0, HORROR: 0, PROFANITY: 0, real_money_gambling: false, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, contests: false }, attested_age_rating: 4 }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "PUT /submissions/${sub_id}/privacy-declaration", payload: { declared_privacy_items: [ { data_type: "DEVICE_ID", purpose: "ANALYTICS", linked_to_user: false, used_for_tracking: false } ], tracking_consent_prompt_present: false }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", capacity_slots: 5 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { win_id: "$.data.id" } }
            - { call: "POST /submissions/${sub_id}/pre-review-check", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T06:00:00Z" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /behavior-findings", payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.thirdparty.example", severity: "MAJOR", scanner_confidence: 0.9500, detected_at: "2026-08-01T06:00:00Z" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { find_id: "$.data.id" } }
          trigger:
            - { call: "POST /submissions/${sub_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "POST /submissions/${sub_id}/claim", payload: {}, as: PlatformReviewer, as_user_id: "u-reviewer-1" }
            - { call: "POST /submissions/${sub_id}/decision", payload: { outcome: "APPROVE" }, as: PlatformReviewer, as_user_id: "u-reviewer-1" }
          assert:
            - "Submission.${sub_id}.pre_review_checked_at == 2026-08-01T00:00:00Z"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional == 1.0000"
            - "Submission.${sub_id}.disclosure_accuracy_score_final == 0.8000"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional != Submission.${sub_id}.disclosure_accuracy_score_final"
            - "POST /submissions/${sub_id}/queue -> 200 (the provisional 1.0000 clears DISCLOSURE_PASS_THRESHOLD)"
            - "Submission.${sub_id}.queued_at == 2026-08-01T06:00:00Z"
            - "Submission.${sub_id}.provisional_deadline_at == 2026-08-03T06:00:00Z"
            - "Submission.${sub_id}.priority_score == 50.00"
            - "Submission.${sub_id}.priority_band == NORMAL"
            - "POST /submissions/${sub_id}/decision outcome=APPROVE -> 409 ERR_PRIVACY_DISCLOSURE_INACCURATE"
            - "Submission.${sub_id}.state == IN_REVIEW (the refused APPROVE changes no state)"
            - "BehaviorFinding.${find_id}.status == OPEN"

      - name: standing_rolling_vs_lifetime_decay
        grounds:
          - calculations.standing_score
          - entities.PublisherAccount.fields.standing_score_rolling_365
          - entities.PublisherAccount.fields.standing_score_lifetime
          - state_machines.Submission.IN_REVIEW_to_REJECTED
          - entities.RejectionReason.fields.recorded_at
        distinguishing_aspect: |
          At clock 2026-12-01T00:00:00Z the single CRITICAL RejectionReason recorded at
          2026-08-02T00:00:00Z is 121 days old, so ROLLING_365 applies decay 0.5 (91..180 days) and
          returns 94.00 while LIFETIME_UNDECAYED applies decay 1.0 and returns 88.00 — same row, two
          stored numbers, read side by side from GET /publisher-accounts/{id}/standing.
        test_recipe:
          setup:
            - "The BASE-IOS fixture of disclosure_late_finding_provisional_vs_final through the capacity-window call"
            - "Submission build 10 queued and claimed at clock 2026-08-02T00:00:00Z"
            - "Reviewer REJECTs with a single CRITICAL rejection reason -> RejectionReason.recorded_at == 2026-08-02T00:00:00Z"
            - "Clock advanced to 2026-12-01T00:00:00Z (121 whole days later)"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_id: "$.data.id", acct_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { cert_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "GET /publisher-accounts/${acct_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { acct_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { prof_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_id: "$.data.id" } }
            - { call: "POST /guideline-rules", payload: { rule_code: "5.1.1", title: "Data collection and storage", category: "PRIVACY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_priv_id: "$.data.id" } }
            - { call: "POST /guideline-rules/${rule_priv_id}/publish", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /feature-mappings", payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_priv_id}", feature_code: "ACCOUNT_DELETION" }, as: ComplianceOfficer, as_user_id: "u-compliance-1", captures: { fm_priv_id: "$.data.id" } }
            - { call: "POST /feature-mappings/${fm_priv_id}/self-review", payload: { outcome: "START" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings/${fm_priv_id}/self-review", payload: { outcome: "PASS", evidence_ref: "https://evidence.northwind.example/acct-deletion.pdf" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "GET /app-records/${app_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_v_cur: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v_cur}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 10, version_string: "1.0.0", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub_id: "$.data.id" } }
            - { call: "POST /metadata-locales", payload: { submission_id: "${sub_id}", locale: "en-US", title: "Northwind Wallet", screenshot_counts: { PHONE_65: 3, TABLET_129: 2 }, is_primary: true }, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "PUT /submissions/${sub_id}/age-rating", payload: { age_rating_answers: { VIOLENCE: 0, SEXUAL_CONTENT: 0, DRUGS_ALCOHOL: 0, GAMBLING_SIMULATED: 0, HORROR: 0, PROFANITY: 0, real_money_gambling: false, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, contests: false }, attested_age_rating: 4 }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "PUT /submissions/${sub_id}/privacy-declaration", payload: { declared_privacy_items: [], tracking_consent_prompt_present: false }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", capacity_slots: 5 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { win_id: "$.data.id" } }
            - { call: "POST /submissions/${sub_id}/pre-review-check", payload: {}, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-02T00:00:00Z" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /submissions/${sub_id}/queue", payload: {}, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "POST /submissions/${sub_id}/claim", payload: {}, as: PlatformReviewer, as_user_id: "u-reviewer-1" }
            - { call: "POST /submissions/${sub_id}/decision", payload: { outcome: "REJECT", rejection_reasons: [ { guideline_rule_id: "${rule_priv_id}", reason_code: "PRIVACY_LABEL_INACCURATE", severity: "CRITICAL", detail: "Undisclosed device-id sharing to an advertising domain" } ] }, as: PlatformReviewer, as_user_id: "u-reviewer-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-12-01T00:00:00Z" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "GET /publisher-accounts/${acct_id}/standing", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { rolling: "$.data.standing_score_rolling_365", lifetime: "$.data.standing_score_lifetime" } }
          assert:
            - "GET /publisher-accounts/${acct_id}/standing -> 200"
            - "standing_score_rolling_365 == 94.00"
            - "standing_score_lifetime == 88.00"
            - "standing_score_rolling_365 != standing_score_lifetime"
            - "decayed_penalty_total == 6.00"
            - "undecayed_penalty_total == 12.00"
            - "penalty_event_count == 1"
            - "rejection_strike_count == 1"
            - "credit_total == 0.00"
            - "PublisherAccount.${acct_id}.standing_score_lifetime == 88.00"

      - name: disclosure_disputed_and_over_disclosure_divergence
        grounds:
          - calculations.disclosure_accuracy_score
          - state_machines.BehaviorFinding.OPEN_to_DISPUTED
          - entities.Submission.fields.declared_privacy_items
          - validations[priority=55]
        distinguishing_aspect: |
          Two mechanisms diverge at once on the SAME rows: DISPUTE removes the MAJOR finding from the
          provisional scope (1.0000) but not from the final scope, and the final variant alone charges
          OVER_DISCLOSURE_PENALTY for the declared LOCATION tuple that no in-scope finding matches by
          data_type, so final == 0.7800 == (100 - 20 - 2*1)/100.
        test_recipe:
          setup:
            - "The BASE-IOS fixture, but declared_privacy_items holds TWO tuples: {DEVICE_ID, ANALYTICS, false, false} and {LOCATION, APP_FUNCTIONALITY, false, false}"
            - "One MAJOR DEVICE_ID BehaviorFinding detected_at 2026-08-01T00:00:00Z with scanner_confidence 0.9900, purpose ADVERTISING (does not match the declared DEVICE_ID tuple)"
            - "No finding of any kind on LOCATION, so the declared LOCATION tuple is an over-disclosure"
            - "The finding is DISPUTED by the ComplianceOfficer BEFORE the pre-review check runs"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_id: "$.data.id", acct_v1: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v1}", publisher_account_id: "${acct_id}", credential_type: "DISTRIBUTION_CERT", platform: "IOS", key_custody: "HSM", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { cert_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${cert_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "GET /publisher-accounts/${acct_id}", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { acct_v2: "$.data.version" } }
            - { call: "POST /signing-credentials", payload: { expected_publisher_account_version: "${acct_v2}", publisher_account_id: "${acct_id}", credential_type: "PROVISIONING_PROFILE", platform: "IOS", key_custody: "CLOUD_MANAGED", not_before: "2026-07-01T00:00:00Z", not_after: "2027-07-01T00:00:00Z", linked_cert_id: "${cert_id}" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { prof_id: "$.data.id" } }
            - { call: "POST /signing-credentials/${prof_id}/activate", payload: {}, as: PublisherAdmin, as_user_id: "u-pubadmin-1" }
            - { call: "POST /app-records", payload: { publisher_account_id: "${acct_id}", bundle_id: "com.northwind.wallet", platform: "IOS", display_name: "Northwind Wallet", primary_category: "FINANCE" }, as: PublisherAdmin, as_user_id: "u-pubadmin-1", captures: { app_id: "$.data.id" } }
            - { call: "POST /guideline-rules", payload: { rule_code: "5.1.1", title: "Data collection and storage", category: "PRIVACY", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { rule_priv_id: "$.data.id" } }
            - { call: "POST /guideline-rules/${rule_priv_id}/publish", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
            - { call: "POST /feature-mappings", payload: { app_record_id: "${app_id}", guideline_rule_id: "${rule_priv_id}", feature_code: "ACCOUNT_DELETION" }, as: ComplianceOfficer, as_user_id: "u-compliance-1", captures: { fm_priv_id: "$.data.id" } }
            - { call: "POST /feature-mappings/${fm_priv_id}/self-review", payload: { outcome: "START" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /feature-mappings/${fm_priv_id}/self-review", payload: { outcome: "PASS", evidence_ref: "https://evidence.northwind.example/acct-deletion.pdf" }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "GET /app-records/${app_id}", payload: {}, as: ReleaseManager, as_user_id: "u-release-1", captures: { app_v_cur: "$.data.version" } }
            - { call: "POST /submissions", payload: { expected_app_record_version: "${app_v_cur}", app_record_id: "${app_id}", signing_credential_id: "${prof_id}", build_number: 10, version_string: "1.0.0", release_mode: "PHASED" }, as: ReleaseManager, as_user_id: "u-release-1", captures: { sub_id: "$.data.id" } }
            - { call: "POST /metadata-locales", payload: { submission_id: "${sub_id}", locale: "en-US", title: "Northwind Wallet", screenshot_counts: { PHONE_65: 3, TABLET_129: 2 }, is_primary: true }, as: ReleaseManager, as_user_id: "u-release-1" }
            - { call: "PUT /submissions/${sub_id}/age-rating", payload: { age_rating_answers: { VIOLENCE: 0, SEXUAL_CONTENT: 0, DRUGS_ALCOHOL: 0, GAMBLING_SIMULATED: 0, HORROR: 0, PROFANITY: 0, real_money_gambling: false, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, contests: false }, attested_age_rating: 4 }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "PUT /submissions/${sub_id}/privacy-declaration", payload: { declared_privacy_items: [ { data_type: "DEVICE_ID", purpose: "ANALYTICS", linked_to_user: false, used_for_tracking: false }, { data_type: "LOCATION", purpose: "APP_FUNCTIONALITY", linked_to_user: false, used_for_tracking: false } ], tracking_consent_prompt_present: false }, as: ComplianceOfficer, as_user_id: "u-compliance-1" }
            - { call: "POST /review-capacity-windows", payload: { platform: "IOS", reviewer_pool_code: "POOL_A", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-01T00:00:00Z", capacity_slots: 5 }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { win_id: "$.data.id" } }
