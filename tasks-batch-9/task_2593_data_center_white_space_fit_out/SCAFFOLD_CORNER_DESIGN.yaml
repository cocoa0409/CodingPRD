              payload: {}
          assert:
            - "tenant_a_reads_foreign_cage -> 403, error_id == ERR_TENANT_SCOPE_VIOLATION"
            - "tenant_a_reads_foreign_rack -> 403, error_id == ERR_TENANT_SCOPE_VIOLATION"
            - "tenant_a_reads_unassigned_rack -> 403, error_id == ERR_TENANT_SCOPE_VIOLATION (tenant_id null is owned by no tenant, so it is foreign to every TenantRepresentative)"
            - "tenant_a_reads_foreign_packet -> 403, error_id == ERR_TENANT_SCOPE_VIOLATION"
            - "tenant_a_reads_own_cage -> 200, id == ${cage_a}, label == CG-A, tenant_id == ${tenant_a}"
            - "tenant_a_lists_cages -> 200, total_count == 1, items[0].id == ${cage_a} (a list spanning tenants is filtered, not refused)"
            - "tenant_a_lists_racks -> 200, total_count == 1, items[0].id == ${rack_a} (both the foreign rack and the unassigned rack are absent)"
            - "tenant_a_lists_packets -> 200, total_count == 1, items[0].id == ${packet_a}"
            - "tenant_a_filters_the_list_to_the_other_tenant -> 200, total_count == 0 (an explicit foreign tenant_id filter intersects with the caller's scope to the empty set; it is not a 403 and it is not an escape hatch)"
            - "tenant_a_reads_the_hall_summary -> 200, design_kw_capacity == 400.00 (the shared hall envelope stays readable to a tenant that occupies it)"
            - "tenant_a_reads_the_other_tenant_row -> 200, code == TN91B (GET /tenants/{tenant_id} is outside validations[9].applies_to; the scope predicate is enumerated, not blanket)"
            - "staff_lists_cages -> 200, total_count == 2 (no filtering for staff_read roles)"
            - "GET /racks?hall_id=${hall_id} as FacilityPlanner -> 200, total_count == 3"

      - name: tenant_scoped_uniqueness_and_cage_tenant_coherence
        claim_type: multi_tenancy
        grounds:
          - "validations[10]: Cage.label is unique per hall_id (not globally, and not per tenant)"
          - "validations[8]: a Cage's tenant must be the tenant of every rack the cage already contains -> ERR_HALL_MISMATCH 422, applies_to POST /racks, POST /cages"
          - "endpoints[POST /racks].input includes optional cage_id and tenant_id"
        distinguishing_aspect: "Two tenants sharing one hall collide on the label namespace even though the cages are tenant-private, while the same label is free in a different hall — so the uniqueness key is (hall_id, label) and neither (tenant_id, label) nor label alone. Layered on top, cage membership is tenant-coherent: a rack carrying tenant B cannot be placed inside tenant A's cage, and a rack carrying no tenant cannot be placed in a cage either, which is the write-side twin of the read-side isolation."
        test_recipe:
          setup: "Halls CX92 and CX93, tenants TN92A and TN92B. CX92 holds cage CG-1 for TN92A; CX93 is empty."
          setup_api_calls:
            - name: create_hall_one
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "Namespace Hall One", code: "CX92", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { hall_1: "$.data.id" }
            - name: create_hall_two
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "Namespace Hall Two", code: "CX93", tenant_mode: "MULTI_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { hall_2: "$.data.id" }
            - name: create_tenant_a
              call: "POST /tenants"
              as: FacilityPlanner
              payload: { name: "Tenant 92A", code: "TN92A", contracted_kw: 80.00, contract_start_date: "2026-08-01" }
              captures: { tenant_a: "$.data.id" }
            - name: create_tenant_b
              call: "POST /tenants"
              as: FacilityPlanner
              payload: { name: "Tenant 92B", code: "TN92B", contracted_kw: 80.00, contract_start_date: "2026-08-01" }
              captures: { tenant_b: "$.data.id" }
            - name: create_zone_hall_one
              call: "POST /containment-zones"
              as: MechanicalContractor
              payload: { hall_id: "${hall_1}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              captures: { zone_1: "$.data.id" }
            - name: create_cage_a_hall_one
              call: "POST /cages"
              as: SecurityAdministrator
              payload: { hall_id: "${hall_1}", tenant_id: "${tenant_a}", label: "CG-1", perimeter_length_m: 40.0 }
              captures: { cage_a: "$.data.id" }
          trigger:
            - name: other_tenant_reuses_the_label_in_the_same_hall
              call: "POST /cages"
              as: SecurityAdministrator
              payload: { hall_id: "${hall_1}", tenant_id: "${tenant_b}", label: "CG-1", perimeter_length_m: 30.0 }
              captures: { e_dup: "$.data.error_id" }
            - name: other_tenant_uses_the_label_in_the_other_hall
              call: "POST /cages"
              as: SecurityAdministrator
              payload: { hall_id: "${hall_2}", tenant_id: "${tenant_b}", label: "CG-1", perimeter_length_m: 30.0 }
              captures: { cage_b_hall_2: "$.data.id" }
            - name: same_tenant_uses_a_free_label_in_the_first_hall
              call: "POST /cages"
              as: SecurityAdministrator
              payload: { hall_id: "${hall_1}", tenant_id: "${tenant_b}", label: "CG-2", perimeter_length_m: 30.0 }
              captures: { cage_b_hall_1: "$.data.id" }
            - name: foreign_tenant_rack_inside_the_cage_rejected
              call: "POST /racks"
              as: FacilityPlanner
              payload: { hall_id: "${hall_1}", containment_zone_id: "${zone_1}", grid_row: "A", grid_col: 1, design_kw: 8.00, u_height: 45, cage_id: "${cage_a}", tenant_id: "${tenant_b}" }
              captures: { e_mismatch: "$.data.error_id" }
            - name: tenantless_rack_inside_the_cage_rejected
              call: "POST /racks"
              as: FacilityPlanner
              payload: { hall_id: "${hall_1}", containment_zone_id: "${zone_1}", grid_row: "A", grid_col: 1, design_kw: 8.00, u_height: 45, cage_id: "${cage_a}" }
              captures: { e_mismatch_null: "$.data.error_id" }
            - name: cross_hall_cage_rejected
              call: "POST /racks"
              as: FacilityPlanner
              payload: { hall_id: "${hall_1}", containment_zone_id: "${zone_1}", grid_row: "A", grid_col: 1, design_kw: 8.00, u_height: 45, cage_id: "${cage_b_hall_2}", tenant_id: "${tenant_b}" }
              captures: { e_mismatch_hall: "$.data.error_id" }
            - name: matching_tenant_rack_inside_the_cage_admitted
              call: "POST /racks"
              as: FacilityPlanner
              payload: { hall_id: "${hall_1}", containment_zone_id: "${zone_1}", grid_row: "A", grid_col: 1, design_kw: 8.00, u_height: 45, cage_id: "${cage_a}", tenant_id: "${tenant_a}" }
              captures: { rack_a: "$.data.id" }
          assert:
            - "other_tenant_reuses_the_label_in_the_same_hall -> 409, error_id == ERR_DUPLICATE_CODE (the label namespace is the hall, not the tenant)"
            - "other_tenant_uses_the_label_in_the_other_hall -> 201, label == CG-1, hall_id == ${hall_2} (the same label in a different hall is free)"
            - "same_tenant_uses_a_free_label_in_the_first_hall -> 201, label == CG-2, tenant_id == ${tenant_b}"
            - "foreign_tenant_rack_inside_the_cage_rejected -> 422, error_id == ERR_HALL_MISMATCH"
            - "tenantless_rack_inside_the_cage_rejected -> 422, error_id == ERR_HALL_MISMATCH (a cage member must carry the cage's tenant explicitly)"
            - "cross_hall_cage_rejected -> 422, error_id == ERR_HALL_MISMATCH (the cage is tenant-coherent but lives in another hall)"
            - "matching_tenant_rack_inside_the_cage_admitted -> 201, cage_id == ${cage_a}, tenant_id == ${tenant_a}, status == PLANNED, chargeable_kw == 8.36"
            - "GET /racks?hall_id=${hall_1} as FacilityPlanner -> 200, total_count == 1 (none of the three refused creates consumed grid position A/1)"
            - "GET /cages?hall_id=${hall_1} as FacilityPlanner -> 200, total_count == 2"

      - name: cascading_side_effects_chain_depth_and_ordering
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers includes cascading_side_effects"
          - "state_machines[MethodOfProcedure] execute cascade: Busway ENERGIZED -> ISOLATED, its RackFeeds ENERGIZED -> DERATED, their Racks POWERED -> AT_RISK, then Hall custody counts and hall_cooling_model"
        distinguishing_aspect: "The four-level chain and its ordering sensitivity (a rack must not be re-counted when a second feed of the same rack derates) are already the subject of a dedicated §1.8 instance, and its back-out twin covers the compensation direction; re-testing the chain here would duplicate that fixture rather than add a corner."
        excluded_because:
          difficulty_instance: mop_execute_busway_isolation_cascade_depth_four
          rationale: "That instance drives the full depth-four cascade end-to-end (busway isolation -> feed DERATED -> rack AT_RISK -> hall custody and thermal recomputation) and asserts each level plus the partial-overlap case where only one of a rack's two feeds derates, which is exactly the claim this row would generate."

      - name: dual_variant_calculation_both_variants_and_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers includes dual_variant_calculation"
          - "calculations[busway_usable_kw].variants: DESIGN vs COMMISSIONED; calculations[hall_cooling_model].variants: NAMEPLATE_SENSIBLE vs AIRFLOW_LIMITED"
        distinguishing_aspect: "Both variant families already have dedicated §1.8 instances that assert the two results on identical data and the ledger delta at the switch, so this row's claim is fully consumed there."
        excluded_because:
          difficulty_instance: busway_usable_kw_design_vs_commissioned_divergence
          rationale: "That instance pins both variants on the same busway (DESIGN 196.66 before PDU commissioning, COMMISSIONED after the measured derate lands), asserts the headroom delta at the switch and shows a feed that was admissible under DESIGN becoming inadmissible under COMMISSIONED; the cooling-side twin cooling_capacity_nameplate_vs_airflow_divergence covers the min() flip."

      - name: derived_field_reconciliation_after_create_update_and_delete
        claim_type: derived_field_reconciliation
        grounds:
          - "complexity_profile.complexity_layers includes derived_field_reconciliation"
          - "calculations[hall_power_ledger] recomputes committed_kw, commissioning_reserve_kw and spare_kw on POST /rack-feeds, on DELETE /rack-feeds/{feed_id} and on any RackFeed status cascade"
        distinguishing_aspect: "The create/update/delete reconciliation of the hall ledger — including the tier re-lookup on the way down and the exact restoration of every derived field after the delete — is the whole subject of a §1.8 compensating-invariant instance."
        excluded_because:
          difficulty_instance: feed_reserve_then_delete_conserves_hall_power_ledger
          rationale: "That instance snapshots committed_kw / commissioning_reserve_kw / spare_kw / Busway.committed_kw / Busway.feed_count / Rack.connected_kw, reserves feeds that cross a reserve tier boundary, releases them again and asserts byte-for-byte restoration with the invariant committed + reserve + spare == design_kw_capacity holding at every step."

  # =========================================================================
  # SECTION: consistency model  (§1.0 consistency_model: immediate)
  # =========================================================================
  - section: consistency model
    instances:
      - name: every_derived_field_is_visible_in_the_same_response_that_caused_it
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model: immediate"
          - "endpoints[POST /rack-feeds].description: allocated_kw is booked against the busway's usable_kw and the hall's power ledger immediately"
          - "endpoints[POST /racks/{rack_id}/power-on].side_effects: feeds ENERGIZED, custody counters moved, hall_cooling_model recomputed"
          - "calculations[hall_power_ledger] and calculations[hall_cooling_model] are recomputed on the triggering request, not on a later read"
        distinguishing_aspect: "Three different write endpoints each fan out to a different set of derived fields on three different entities (busway ledger, tenant allocation, hall thermal model), and under an immediate consistency model every one of those fields must already be correct in the write's own response body AND identical on the read that immediately follows — no lag, no recompute-on-read. An implementation that recomputes lazily passes the follow-up read but returns stale numbers in the write response; one that recomputes only in the response and forgets to persist passes the write and fails the read. Both halves are asserted for each write."
        test_recipe:
          setup: "Hall CX94 driven to FIT_OUT with both PDUs commissioned at derate 1.00, BW-A1/BW-B1 ENERGIZED, zone CA-1 at PASS (5.00 %), CU-1 IN_SERVICE (22000 cfm, dT 18.0 F, 200.00 kW nameplate, redundancy N), and one PLANNED rack R-1-1 of 15.00 kW assigned to tenant TN94 (contracted 80.00 kW)."
          setup_api_calls:
            - name: create_hall
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "Immediate Consistency Hall", code: "CX94", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { hall_id: "$.data.id" }
            - name: create_tenant
              call: "POST /tenants"
              as: FacilityPlanner
              payload: { name: "Tenant 94", code: "TN94", contracted_kw: 80.00, contract_start_date: "2026-08-01" }
              captures: { tenant_id: "$.data.id" }
            - name: create_pdu_a
              call: "POST /pdus"
              as: ElectricalContractor
              payload: { hall_id: "${hall_id}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              captures: { pdu_a: "$.data.id" }
            - name: create_pdu_b
              call: "POST /pdus"
              as: ElectricalContractor
              payload: { hall_id: "${hall_id}", name: "PDU-B1", feed_side: "B", rated_kw: 300.00 }
              captures: { pdu_b: "$.data.id" }
            - name: commission_pdu_a
              call: "PATCH /pdus/${pdu_a}"
              as: ElectricalContractor
              payload: { measured_derate_factor: 1.00 }
            - name: commission_pdu_b
              call: "PATCH /pdus/${pdu_b}"
              as: ElectricalContractor
              payload: { measured_derate_factor: 1.00 }
            - name: create_busway_a
              call: "POST /busways"
              as: ElectricalContractor
              payload: { pdu_id: "${pdu_a}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              captures: { bw_a: "$.data.id" }
            - name: create_busway_b
              call: "POST /busways"
              as: ElectricalContractor
              payload: { pdu_id: "${pdu_b}", name: "BW-B1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              captures: { bw_b: "$.data.id" }
            - name: create_zone
              call: "POST /containment-zones"
              as: MechanicalContractor
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              captures: { zone_id: "$.data.id" }
            - name: create_cooling_unit
              call: "POST /cooling-units"
              as: MechanicalContractor
              payload: { hall_id: "${hall_id}", name: "CU-1", rated_sensible_kw: 200.00, design_airflow_cfm: 22000, supply_delta_t_f: 18.0, redundancy_role: "PRIMARY" }
              captures: { cu_1: "$.data.id" }
            - name: create_rack
              call: "POST /racks"
              as: FacilityPlanner
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone_id}", grid_row: "A", grid_col: 1, design_kw: 15.00, u_height: 45, required_feed_count: 2, tenant_id: "${tenant_id}" }
              captures: { rack_1: "$.data.id" }
            - name: advance_to_fit_out
              call: "POST /halls/${hall_id}/advance-phase"
              as: FacilityPlanner
              payload: { target_status: "FIT_OUT" }
            - name: energize_a
              call: "POST /busways/${bw_a}/energize"
              as: ElectricalContractor
              payload: {}
            - name: energize_b
              call: "POST /busways/${bw_b}/energize"
              as: ElectricalContractor
              payload: {}
            - name: leakage_test_pass
              call: "POST /containment-zones/${zone_id}/leakage-test"
              as: MechanicalContractor
              payload: { measured_leakage_pct: 5.00, measured_static_pressure_pa: 20.0 }
            - name: commission_cooling_unit
              call: "POST /cooling-units/${cu_1}/commission"
              as: MechanicalContractor
              payload: { measured_airflow_cfm: 22000 }
            - name: place_cooling_unit_in_service
              call: "POST /cooling-units/${cu_1}/place-in-service"
              as: MechanicalContractor
              payload: {}
          trigger:
            - name: reserve_first_feed
              call: "POST /rack-feeds"
              as: ElectricalContractor
              payload: { rack_id: "${rack_1}", busway_id: "${bw_a}", feed_side: "A", requested_kw: 7.50, breaker_amps: 32 }
              captures: { feed_a: "$.data.id" }
            - name: read_busway_after_first_feed
              call: "GET /busways/${bw_a}"
              as: FacilityPlanner
              payload: {}
            - name: read_hall_summary_after_first_feed
              call: "GET /halls/${hall_id}/capacity-summary"
              as: FacilityPlanner
              payload: {}
            - name: reserve_second_feed
              call: "POST /rack-feeds"
              as: ElectricalContractor
              payload: { rack_id: "${rack_1}", busway_id: "${bw_b}", feed_side: "B", requested_kw: 7.50, breaker_amps: 32 }
              captures: { feed_b: "$.data.id" }
            - name: read_hall_summary_after_second_feed
              call: "GET /halls/${hall_id}/capacity-summary"
              as: FacilityPlanner
              payload: {}
            - name: install_rack
              call: "POST /racks/${rack_1}/install"
              as: FacilityPlanner
              payload: { asset_tag: "AT-0940" }
            - name: read_tenant_after_install
              call: "GET /tenants/${tenant_id}"
              as: FacilityPlanner
              payload: {}
            - name: read_hall_summary_after_install
              call: "GET /halls/${hall_id}/capacity-summary"
              as: FacilityPlanner
              payload: {}
            - name: power_on_rack
              call: "POST /racks/${rack_1}/power-on"
              as: ElectricalContractor
              payload: {}
            - name: read_rack_after_power_on
              call: "GET /racks/${rack_1}"
              as: FacilityPlanner
              payload: {}
            - name: read_first_feed_after_power_on
              call: "GET /rack-feeds/${feed_a}"
              as: FacilityPlanner
              payload: {}
            - name: read_hall_summary_after_power_on
              call: "GET /halls/${hall_id}/capacity-summary"
              as: FacilityPlanner
              payload: {}
          assert:
            - "reserve_first_feed -> 201, status == RESERVED, allocated_kw == 7.500 (the derived allocation is in the create response itself)"
            - "read_busway_after_first_feed -> 200, committed_kw == 7.500, feed_count == 1, usable_kw == 196.66, status == ENERGIZED"
            - "read_hall_summary_after_first_feed -> 200, committed_kw == 7.50, commissioning_reserve_kw == 25.00, spare_kw == 367.50 (committed + reserve + spare == 400.00 already on the first read after the write)"
            - "reserve_second_feed -> 201, status == RESERVED, allocated_kw == 7.500"
            - "read_hall_summary_after_second_feed -> 200, committed_kw == 15.00, commissioning_reserve_kw == 25.00, spare_kw == 360.00"
            - "GET /racks/${rack_1} as FacilityPlanner -> 200, connected_kw == 15.00, energized_feed_count == 0, status == PLANNED (reservation books power without energising anything)"
            - "install_rack -> 200, status == INSTALLED, asset_tag == AT-0940, chargeable_kw == 15.68 (the rack's own derived field is in the transition response)"
            - "read_tenant_after_install -> 200, allocated_kw == 15.00 (the cross-entity tenant allocation is already reconciled)"
            - "read_hall_summary_after_install -> 200, chargeable_kw == 15.68, custody_fitout_count == 1, custody_ops_count == 0, thermal_load_kw == 0.00 (an INSTALLED rack is chargeable but not yet a heat load)"
            - "power_on_rack -> 200, status == POWERED, energized_feed_count == 2, connected_kw == 15.00 (the fan-out onto the feeds is reflected in the rack response body)"
            - "read_rack_after_power_on -> 200, status == POWERED, energized_feed_count == 2 (the response body and the persisted row agree)"
            - "read_first_feed_after_power_on -> 200, status == ENERGIZED, allocated_kw == 7.500"
            - "read_hall_summary_after_power_on -> 200, thermal_load_kw == 12.75, cooling_capacity_nameplate_kw == 200.00, cooling_capacity_airflow_kw == 119.08, cooling_capacity_kw == 119.08, cooling_margin_kw == 106.33, thermal_posture == NOMINAL"
            - "read_hall_summary_after_power_on -> 200, custody_fitout_count == 0, custody_ops_count == 1, committed_kw == 15.00, chargeable_kw == 15.68 (the ledger is untouched by energisation while the custody partition moves)"
            - "GET /rack-feeds?rack_id=${rack_1} as FacilityPlanner -> 200, total_count == 2, every item status == ENERGIZED"
