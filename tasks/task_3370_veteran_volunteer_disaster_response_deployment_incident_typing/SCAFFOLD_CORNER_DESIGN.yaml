              payload: { full_name: "Student Stu", email: "stu@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/training-courses"
              payload: { title: "Chainsaw Ops 101", grants_cert_kind: CHAINSAW, capacity: 5, starts_at: "2026-09-10T09:00:00Z", lead_instructor_volunteer_id: "${instr}" }
              as: TrainingDirector
              captures: { course: $.data.id }
            - call: "POST /vdr/training-courses/${course}/enrollments"
              payload: { volunteer_id: "${v1}" }
              as: TrainingDirector
              captures: { e1: $.data.id }
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "PATCH /vdr/training-enrollments/${e1}"
              payload: { status: COMPLETED }
              as: TrainingDirector
          assert:
            - "TrainingEnrollment.${e1}.status == COMPLETED"
            - "GET /vdr/certifications?volunteer_id=${v1} returns exactly 1 cert with kind == CHAINSAW and status == PENDING_VERIFICATION"
            - "Granted cert expires_at == 2028-09-09T10:00:00Z (current_utc + 730 days)"


  - section: endpoints
    instances:
      - name: work_order_referral_partner_attribution
        claim_type: cross_reference_link
        grounds: [entities.WorkOrder.fields.source_partner_id, roles]
        distinguishing_aspect: "PartnerLiaison referral stores source_partner_id == own agency and is listable by it; attributing a referral to a different agency is denied 403 (entity-backed ownership on the create path)."
        test_recipe:
          setup: ["PartnerAgencies p1 (County EM) and p2 (LTRG); incident ASSESSED"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/partners"
              payload: { name: "County EM", kind: EMERGENCY_MANAGEMENT, contact_email: "em@county.gov" }
              as: SystemAdmin
              captures: { p1: $.data.id }
            - call: "POST /vdr/partners"
              payload: { name: "Recovery Group", kind: LTRG, contact_email: "ltrg@x.org" }
              as: SystemAdmin
              captures: { p2: $.data.id }
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 3, affected_households: 40 }
              as: IncidentCommander
          trigger:
            - call: "POST /vdr/incidents/${i1}/work-orders"
              payload: { requester_name: "Referred Owner", hazard_kind: MUCK_OUT, vulnerable_resident: true, municipality_sourced: true, source_partner_id: "${p1}" }
              as: PartnerLiaison
              as_user_id: "${p1}"
              captures: { wo1: $.data.id }
            - call: "POST /vdr/incidents/${i1}/work-orders"
              payload: { requester_name: "Misattributed", hazard_kind: DEBRIS, source_partner_id: "${p2}" }
              as: PartnerLiaison
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
            - call: "GET /vdr/work-orders"
              payload: { source_partner_id: "${p1}" }
              as: PartnerLiaison
              as_user_id: "${p1}"
          assert:
            - "WorkOrder.${wo1}.source_partner_id == ${p1} and status == INTAKE"
            - "Misattributed referral: err == ERR_UNAUTHORIZED (http 403)"
            - "GET by source_partner_id == ${p1}: total_count == 1 and the item is ${wo1}"

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.volunteer_readiness_score]
        distinguishing_aspect: "Immediate consistency: a PATCHed availability window is visible in the very next GET, and a cert verification is reflected in the volunteer's operational_readiness_score (10 + MEDICAL 20 = 30) without any ops run."
        test_recipe:
          setup: ["Volunteer v1 with a PENDING_VERIFICATION MEDICAL cert"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Read Reba", email: "reba@x.org", home_region: "TX-GULF", skills: [MEDICAL] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: MEDICAL, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
          trigger:
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "GET /vdr/volunteers/${v1}"
              payload: {}
              as: Volunteer
              as_user_id: "${v1}"
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "GET /vdr/volunteers/${v1}"
              payload: {}
              as: Volunteer
              as_user_id: "${v1}"
          assert:
            - "First GET: availability_windows == [{start 2026-09-05T00:00:00Z, end 2026-09-30T00:00:00Z}]"
            - "Second GET: operational_readiness_score == 30 and readiness_score == 30 (fatigue 0)"

  - section: calculations
    instances:
      - name: lodging_rounding_order_ground_covered
        claim_type: precision
        grounds: [calculations.fob_lodging_cost_cents]
        excluded_because:
          difficulty_instance: "combinatorial_formula / lodging_per_night_rounding_order_pinned"
          rationale: "The pinned per-night-then-sum rounding order and its one-cent divergence from sum-then-round are asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: cert_expiry_cycle_ground_covered
        claim_type: valid_transition
        grounds: [state_machines.Certification]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / certification_expiry_renewal_cycle"
          rationale: "VERIFIED -> EXPIRED -> VERIFIED plus the volunteer auto-downgrade are asserted by the named §1.8 instance; no extra corner test needed."

  - section: validations
    instances:
      - name: safety_watch_shift_requires_medical_or_structural
        claim_type: conditional_validation
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "Conditional validation by shift kind: SAFETY_WATCH requires a VERIFIED MEDICAL or STRUCTURAL cert on the deployment's volunteer (CHAINSAW-only volunteer rejected), while an OPERATIONS shift for the same deployment succeeds."
        test_recipe:
          setup: ["Operation OPEN; d1 (v1 with VERIFIED CHAINSAW only) ON_SITE"]
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Ada Voss", email: "ada@x.org", home_region: "TX-GULF", skills: [CHAINSAW], availability_windows: [{ start_iso8601: "2026-09-05T00:00:00Z", end_iso8601: "2026-09-30T00:00:00Z" }] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: VETTED }
              as: SafetyOfficer
            - call: "PATCH /vdr/volunteers/${v1}"
              payload: { readiness_status: DEPLOYABLE }
              as: SafetyOfficer
            - call: "POST /vdr/incidents"
              payload: { name: "Storm A", region: "TX-GULF" }
              as: IncidentCommander
              captures: { i1: $.data.id }
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: ASSESSED, severity: 4, affected_households: 120 }
              as: IncidentCommander
            - call: "PATCH /vdr/incidents/${i1}"
              payload: { status: TYPED, incident_type: WIND }
              as: IncidentCommander
            - call: "POST /vdr/incidents/${i1}/operations"
              payload: { title: "Tree Ops", hazard_focus: TREE_REMOVAL, team_size_required: 2, duration_days: 4, required_capabilities: [CHAINSAW], start_date: "2026-09-10" }
              as: IncidentCommander
              captures: { op1: $.data.id }
            - call: "PATCH /vdr/operations/${op1}"
              payload: { status: OPEN }
              as: OperationsLead
            - call: "POST /vdr/operations/${op1}/deployments"
              payload: { volunteer_id: "${v1}", travel_mode: SELF, planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-14T08:00:00Z", needs_lodging: false }
              as: OperationsLead
              captures: { d1: $.data.id }
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ACCEPTED }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: SystemAdmin
            - call: "PATCH /vdr/deployments/${d1}"
              payload: { status: ON_SITE }
              as: OperationsLead
          trigger:
            - call: "POST /vdr/operations/${op1}/duty-shifts"
              payload: { deployment_id: "${d1}", kind: SAFETY_WATCH, starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T12:00:00Z" }
              as: OperationsLead
              captures: { err: $.data.error_id }
            - call: "POST /vdr/operations/${op1}/duty-shifts"
              payload: { deployment_id: "${d1}", kind: OPERATIONS, starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T12:00:00Z" }
              as: OperationsLead
              captures: { s1: $.data.id }
          assert:
            - "SAFETY_WATCH without MEDICAL/STRUCTURAL cert: err == ERR_CERT_NOT_VERIFIED (http 422)"
            - "OPERATIONS shift same window: 201, DutyShift.${s1}.status == SCHEDULED"
