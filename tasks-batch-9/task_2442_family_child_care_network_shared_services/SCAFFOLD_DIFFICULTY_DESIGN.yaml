            - "SubsidyContract.${c1}.committed_slots == 0 and available_slots == 4 (released by the exit cascade, never re-committed)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: substitute_half_open_window_with_thirty_minute_buffer_exact_gap_allowed
        grounds:
          - validations[priority=13]
          - errors[ERR_SUBSTITUTE_INTERVAL_CONFLICT]
          - calculations.substitute_selection
          - entities.SubstituteAssignment.fields.start_at
          - entities.SubstituteAssignment.fields.end_at
        distinguishing_aspect: |
          The resource is a Substitute and the interval semantics are half-open datetime windows
          [start_at, end_at) widened symmetrically by a 30-minute turnaround buffer: a 20-minute gap
          conflicts, a gap of exactly 30 minutes does not, and the boundary holds on both sides of
          the existing booking. Conflict detection also spans OFFERED as well as CONFIRMED rows.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE in county_tier STANDARD."
            - "Substitute S1 (STANDARD, credential NONE, clearance_expires_on 2026-12-31, hourly_rate_cents 2000) with one CONFIRMED assignment on 2026-08-10 from 08:00Z to 12:00Z."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["SUBSTITUTE_POOL"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Rosa Nunez", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2000, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T12:00:00Z", reason: "ILLNESS", min_credential_level: "NONE", requested_substitute_id: "${s1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa_a: $.data.id }
            - call: "POST /fccn/substitute-assignments/${sa_a}/accept"
              as: Substitute
              as_user_id: "${s1}"
          trigger:
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-10T12:20:00Z", end_at: "2026-08-10T16:00:00Z", reason: "ILLNESS", min_credential_level: "NONE", requested_substitute_id: "${s1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { err_gap20: $.data.error_id }
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-10T12:30:00Z", end_at: "2026-08-10T16:30:00Z", reason: "ILLNESS", min_credential_level: "NONE", requested_substitute_id: "${s1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa_b: $.data.id, st_b: $.data.staffing_status }
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-10T04:00:00Z", end_at: "2026-08-10T07:30:00Z", reason: "VACATION", min_credential_level: "NONE", requested_substitute_id: "${s1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa_c: $.data.id }
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-10T16:45:00Z", end_at: "2026-08-10T18:00:00Z", reason: "ILLNESS", min_credential_level: "NONE", requested_substitute_id: "${s1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { err_after_offered: $.data.error_id }
            - call: "GET /fccn/substitutes/${s1}/assignments"
              as: NetworkAdmin
          assert:
            - "${err_gap20} == ERR_SUBSTITUTE_INTERVAL_CONFLICT with HTTP 409 (20-minute gap after a 12:00Z end is inside the 30-minute buffer)"
            - "the 12:30Z-16:30Z request returns 201 with ${st_b} == OFFERED (a gap of exactly 30 minutes is allowed)"
            - "the 04:00Z-07:30Z request returns 201 (exactly 30 minutes before the 08:00Z start is allowed on the other side)"
            - "${err_after_offered} == ERR_SUBSTITUTE_INTERVAL_CONFLICT with HTTP 409 (16:45Z is only 15 minutes after the OFFERED assignment ${sa_b} ends, so OFFERED rows block too)"
            - "GET /fccn/substitutes/${s1}/assignments returns total_count == 3 (only ${sa_a}, ${sa_b} and ${sa_c} were created)"

      - name: coaching_visit_inclusive_twentynine_day_calendar_window_aggregate_saturation
        grounds:
          - validations[priority=13]
          - errors[ERR_COACHING_WINDOW_SATURATED]
          - endpoints[POST /fccn/coaching-visits]
          - entities.CoachingVisit.fields.scheduled_on
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: instead of a half-open
          datetime range on a Substitute, this is a closed, inclusive +/-29 calendar-day window
          centred on the requested scheduled_on for a Provider, and the constraint is an aggregate
          count (fewer than 2 SCHEDULED/COMPLETED visits inside it) rather than a pairwise overlap.
          A visit exactly 29 days away is inside the window; exactly 30 days away is outside.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE with the COACHING shared service."
            - "Two SCHEDULED coaching visits on 2026-08-10 and 2026-08-11."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["COACHING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-08-10T00:00:00Z", focus_area: "ENVIRONMENT" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { v1: $.data.id }
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-08-11T00:00:00Z", focus_area: "INTERACTIONS" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-09-08T00:00:00Z", focus_area: "CURRICULUM" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { err_sat: $.data.error_id }
            - call: "POST /fccn/coaching-visits"
              payload: { provider_id: "${p1}", scheduled_on: "2026-09-09T00:00:00Z", focus_area: "CURRICULUM" }
              as: QualityCoach
              as_user_id: "coach-a"
              captures: { v4: $.data.id, st4: $.data.status }
            - call: "GET /fccn/providers/${p1}/coaching-visits"
              as: NetworkAdmin
          assert:
            - "${err_sat} == ERR_COACHING_WINDOW_SATURATED with HTTP 409 (window [2026-08-10, 2026-10-07] inclusively contains both ${v1} at exactly 29 days and ${v2})"
            - "the 2026-09-09 request returns 201 with ${st4} == SCHEDULED (window [2026-08-11, 2026-10-08] excludes ${v1} at exactly 30 days, so only 1 visit is inside)"
            - "GET /fccn/providers/${p1}/coaching-visits returns total_count == 3 (the saturated request created no CoachingVisit row)"
            - "CoachingVisit.${v4}.scheduled_on == 2026-09-09T00:00:00Z and visit_conducted_on == null"

  - rule_id: compensating_invariant
    instances:
      - name: remittance_reversal_conserves_contract_remitted_cents_ledger
        grounds:
          - state_machines.Remittance.POSTED_to_REVERSED
          - calculations.remittance_allocation
          - entities.SubsidyContract.fields.remitted_cents
          - entities.SubsidyContract.fields.unallocated_credit_cents
          - entities.SubsidyClaim.fields.paid_cents
          - endpoints[POST /fccn/remittances/{id}/reverse]
        distinguishing_aspect: |
          Forward action POST /fccn/remittances runs a waterfall over two RECONCILED claims and
          leaves a remainder; the compensating action POST /fccn/remittances/{id}/reverse walks every
          allocation back. The named conserved quantity is the remittance_cents_conservation
          identity contract.remitted_cents == sum(claim.paid_cents) + contract.unallocated_credit_cents,
          which must hold at 250000 == 227250 + 22750 after the post and at 0 == 0 + 0 after the
          reversal, with both claims returning from SETTLED to RECONCILED and no cent of drift.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE with an ACTIVE SubsidyContract (daily_rate_cents 4500, absence_rate_pct 50, authorized_amount_cents 5000000)."
            - "Claim A for 2026-07 walked to RECONCILED with final_amount_cents 137250."
            - "Claim B for 2026-08 walked to RECONCILED with final_amount_cents 90000."
            - "The contract's version is re-read before creating claim B because submit/advance/reconfile on claim A bumped it."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-07-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-07-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-07-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-07", lines: [{ enrollment_id: "${e1}", attended_days: 18, absent_days: 4 }, { enrollment_id: "${e2}", attended_days: 10, absent_days: 2 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cla: $.data.id }
            - call: "POST /fccn/subsidy-claims/${cla}/submit"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-claims/${cla}/advance"
              as: FiscalOfficer
            - call: "POST /fccn/subsidy-claims/${cla}/reconcile"
              as: FiscalOfficer
              captures: { fin_a: $.data.final_amount_cents }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: FiscalOfficer
              captures: { cv2: $.data.version }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv2}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { clb: $.data.id }
            - call: "POST /fccn/subsidy-claims/${clb}/submit"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-claims/${clb}/advance"
              as: FiscalOfficer
            - call: "POST /fccn/subsidy-claims/${clb}/reconcile"
              as: FiscalOfficer
              captures: { fin_b: $.data.final_amount_cents }
          trigger:
            - call: "POST /fccn/remittances"
              payload: { contract_id: "${c1}", agency_reference: "AG-BULK-1", amount_cents: 250000, received_on: "2026-08-01T00:00:00Z" }
              as: FiscalOfficer
              captures: { rm1: $.data.id, unalloc: $.data.unallocated_cents }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: FiscalOfficer
              captures: { rem_after: $.data.remitted_cents, ucc_after: $.data.unallocated_credit_cents }
            - call: "POST /fccn/remittances/${rm1}/reverse"
              payload: { reversal_reason: "Agency mis-posted against the wrong contract" }
              as: FiscalOfficer
              captures: { rm_status: $.data.status }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: FiscalOfficer
              captures: { rem_rev: $.data.remitted_cents, ucc_rev: $.data.unallocated_credit_cents }
          assert:
            - "${fin_a} == 137250 and ${fin_b} == 90000"
            - "Remittance.${rm1}.allocations == [{ claim_id: ${cla}, allocated_cents: 137250 }, { claim_id: ${clb}, allocated_cents: 90000 }] in period_month ASC order"
            - "${unalloc} == 22750"
            - "${rem_after} == 250000 and ${ucc_after} == 22750"
            - "invariant after the forward action: 250000 == (137250 + 90000) + 22750"
            - "SubsidyClaim.${cla}.status == SETTLED and paid_cents == 137250; SubsidyClaim.${clb}.status == SETTLED and paid_cents == 90000"
            - "${rm_status} == REVERSED and Remittance.${rm1}.reversal_reason == 'Agency mis-posted against the wrong contract'"
            - "${rem_rev} == 0 and ${ucc_rev} == 0"
            - "SubsidyClaim.${cla}.status == RECONCILED and paid_cents == 0; SubsidyClaim.${clb}.status == RECONCILED and paid_cents == 0"
            - "invariant after the compensating action: 0 == (0 + 0) + 0, i.e. zero drift"
            - "SubsidyClaim.${cla}.final_amount_cents == 137250 and settlement_delta_cents == 14850 (untouched by the reversal)"

      - name: claim_rejection_conserves_contract_claimed_authorization_ledger
        grounds:
          - state_machines.SubsidyClaim.SUBMITTED_to_REJECTED
          - entities.SubsidyContract.fields.claimed_amount_cents
          - entities.SubsidyContract.fields.authorized_amount_cents
          - validations[priority=13]
          - validations[priority=16]
          - errors[ERR_CLAIM_PERIOD_DUPLICATE]
        distinguishing_aspect: |
          A different conserved quantity from instance (a) — SubsidyContract.claimed_amount_cents,
          the authorization ledger rather than the cash ledger — and a different forward/compensating
          pair: submit consumes headroom, reject releases exactly the provisional amount it consumed.
          Conservation is proved twice over: claimed_amount_cents returns to its exact pre-submit
          value 153000, and the released headroom is genuinely reusable because a replacement claim
          for the same period_month (uniqueness ignores REJECTED) can be submitted back to 243000.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE with an ACTIVE SubsidyContract (daily_rate_cents 4500, absence_rate_pct 50, authorized_amount_cents 5000000, claimed_amount_cents 0)."
            - "Claim A for 2026-07 in SUBMITTED with provisional_amount_cents 153000, so claimed_amount_cents is 153000."
            - "Claim B for 2026-08 in DRAFT with a single 20-attended-day line worth 90000."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6, fixed_monthly_cost_cents: 237000 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["ENROLLMENT", "BILLING"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/subsidy-contracts"
              payload: { provider_id: "${p1}", agency_code: "CCDF-01", daily_rate_cents: 4500, contracted_slots: 4, authorized_amount_cents: 5000000, period_start_on: "2026-07-01T00:00:00Z", absence_rate_pct: 50 }
              as: NetworkAdmin
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-1", family_name: "Alvarez", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-07-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /fccn/enrollments"
              payload: { provider_id: "${p1}", child_ref: "CH-2", family_name: "Brody", days_per_week: 5, private_monthly_tuition_cents: 0, subsidy_certified: true, start_on: "2026-07-01T00:00:00Z" }
              as: Provider
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-07", lines: [{ enrollment_id: "${e1}", attended_days: 18, absent_days: 4 }, { enrollment_id: "${e2}", attended_days: 10, absent_days: 2 }], expected_contract_version: "${cv1}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { cla: $.data.id }
            - call: "POST /fccn/subsidy-claims/${cla}/submit"
              as: Provider
              as_user_id: "${p1}"
              captures: { prov_a: $.data.provisional_amount_cents }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: FiscalOfficer
              captures: { cv2: $.data.version, claimed_1: $.data.claimed_amount_cents }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv2}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { clb: $.data.id }
          trigger:
            - call: "POST /fccn/subsidy-claims/${clb}/submit"
              as: Provider
              as_user_id: "${p1}"
              captures: { prov_b: $.data.provisional_amount_cents }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: FiscalOfficer
              captures: { claimed_2: $.data.claimed_amount_cents }
            - call: "POST /fccn/subsidy-claims/${clb}/reject"
              payload: { rejection_reason: "Attendance sheets missing for 2026-08" }
              as: FiscalOfficer
              captures: { st_b: $.data.status }
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: FiscalOfficer
              captures: { claimed_3: $.data.claimed_amount_cents, cv3: $.data.version }
            - call: "POST /fccn/subsidy-claims"
              payload: { contract_id: "${c1}", period_month: "2026-08", lines: [{ enrollment_id: "${e1}", attended_days: 20, absent_days: 0 }], expected_contract_version: "${cv3}" }
              as: Provider
              as_user_id: "${p1}"
              captures: { clc: $.data.id }
            - call: "POST /fccn/subsidy-claims/${clc}/submit"
              as: Provider
              as_user_id: "${p1}"
            - call: "GET /fccn/subsidy-contracts/${c1}"
              as: FiscalOfficer
              captures: { claimed_4: $.data.claimed_amount_cents }
          assert:
            - "${prov_a} == 153000 and ${claimed_1} == 153000"
            - "${prov_b} == 90000 and ${claimed_2} == 243000 (forward action consumed exactly 90000 of headroom)"
            - "${st_b} == REJECTED and SubsidyClaim.${clb}.rejection_reason == 'Attendance sheets missing for 2026-08'"
            - "${claimed_3} == 153000 exactly (compensating action released exactly the 90000 it consumed; zero drift against ${claimed_1})"
            - "invariant after each step: claimed_amount_cents == sum of provisional_amount_cents over SUBMITTED/ADVANCE_PAID claims plus sum of final_amount_cents over RECONCILED/SETTLED claims"
            - "the replacement claim for 2026-08 is accepted (no ERR_CLAIM_PERIOD_DUPLICATE, because uniqueness ignores REJECTED claims)"
            - "${claimed_4} == 243000 (the released headroom was genuinely reusable, not merely zeroed on the rejected row)"
            - "SubsidyClaim.${clb}.advance_paid_cents == 0 and final_amount_cents == 0 (no fiscal residue on the rejected claim)"
