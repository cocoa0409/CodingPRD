        distinguishing_aspect: |
          Entity pair RefundRequest -> PatientAccount: the CreditBalance is ATTRIBUTED
          with 12000 cents of patient capacity and every fiscal rule passes, yet the
          ATTRIBUTED -> REFUND_PENDING transition is blocked purely because the owning
          PatientAccount sits in BAD_DEBT; flipping the account back to OPEN makes the
          identical request succeed.
        test_recipe:
          setup:
            - "A COMMERCIAL payer and account BD1 with a 12000-cent credit identified 2026-08-15 and attributed PROPORTIONAL to attribution PATIENT (patient_portion_cents 12000)."
            - "The account was moved OPEN -> BAD_DEBT on 2026-08-16 while the credit balance stayed ATTRIBUTED."
