              as: ConcessionerHRManager
              captures: { h4: $.data.id }
          assert:
            - "occupied_beds after create(emp-303) == 3 (unit at capacity)"
            - "after terminate(emp-303): occupied_beds == 2 — create+terminate is net-zero on the conserved bed count"
            - "the probe hire emp-304 (${h4}) succeeds into the restored bed, proving the pool drifted neither up nor down"

