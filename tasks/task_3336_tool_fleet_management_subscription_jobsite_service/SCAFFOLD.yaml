# =============================================================================
# SCAFFOLD — Tool Fleet Management Subscription & Jobsite Service (task_3336)
# =============================================================================

scenario: |
  Tool Fleet Management Subscription & Jobsite Service (Hilti North America):
  fleet agreements where contractors pay a monthly rate covering tools, repairs,
  loaners and replacement rather than purchasing, tool tagging and asset tracking
  across jobsites with utilization and location reporting, repair service with
  pickup, turnaround commitments and loaner provision so work is not interrupted,
  theft coverage and replacement terms with police report requirements, fleet
  size adjustment as project volume changes with add and return provisions,
  consumable and fastener supply tied to the tool platform with technical
  application approval, on-site technical support for anchor design and firestop
  systems with documentation, contract end-of-term options including buyout,
  renewal and return condition standards.

domain_name: tool-fleet-subscription
api_prefix: /fleet

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal company name" }
      - { name: tax_id, type: string, source: input, description: "US EIN", constraints: "unique across all accounts" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Approved credit limit in cents" }
      - { name: status, type: enum, source: system, description: "Account lifecycle", constraints: "ACTIVE | SUSPENDED" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Billed amounts + consumable approvals + theft deductibles, minus payments and SLA credits; floored at 0" }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Rate card code", constraints: "unique" }
      - { name: tool_category, type: enum, source: input, description: "Category governed", constraints: "DRILL | SAW | BREAKER | MEASURING | ANCHORING" }
      - { name: base_monthly_rate_cents, type: integer, source: input, description: "Per-unit monthly rate below tier2_threshold" }
      - { name: tier2_threshold, type: integer, source: input, description: "Unit count at which tier 2 begins (>=)" }
      - { name: tier2_monthly_rate_cents, type: integer, source: input, description: "Per-unit rate for tier-2 units" }
      - { name: tier3_threshold, type: integer, source: input, description: "Unit count at which tier 3 begins (>=)" }
      - { name: tier3_monthly_rate_cents, type: integer, source: input, description: "Per-unit rate for tier-3 units" }
      - { name: min_monthly_fee_cents, type: integer, source: input, description: "Per-category minimum monthly fee" }
      - { name: effective_from, type: datetime, source: input, description: "Card effective start (closed interval bound)" }
      - { name: effective_to, type: datetime, source: input, description: "Card effective end (closed interval bound); must be > effective_from" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation", constraints: "ACTIVE" }

  - name: ToolModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Catalog model code", constraints: "unique" }
      - { name: category, type: enum, source: input, description: "Tool category", constraints: "DRILL | SAW | BREAKER | MEASURING | ANCHORING" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Catalog replacement value for theft and buyout pricing" }
      - { name: weight_class, type: enum, source: input, description: "Drives repair SLA days and breach credit", constraints: "LIGHT | HEAVY" }

  - name: FleetAgreement
    parent: ContractorAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> ContractorAccount.id; owning account" }
      - { name: agreement_number, type: string, source: system, description: "Server-minted agreement number" }
      - { name: term_months, type: integer, source: input, description: "Term length in whole months; +12 on renewal" }
      - { name: start_date, type: datetime, source: input, description: "Coverage start (inclusive); must be >= logical-clock date at activation" }
      - { name: end_date, type: datetime, source: computed, description: "start_date + term_months months; recomputed on renewal" }
      - { name: status, type: enum, source: system, description: "Agreement lifecycle", constraints: "DRAFT | ACTIVE | SUSPENDED | ENDING | CLOSED" }
      - { name: end_of_term_option, type: enum, source: input, description: "Elected end-of-term option (set at creation, re-pinned at election)", constraints: "BUYOUT | RENEWAL | RETURN" }
      - { name: fleet_size_target, type: integer, source: computed, description: "Count of ToolAsset rows with this agreement_id and status in {REGISTERED, DEPLOYED, IN_TRANSIT, IN_REPAIR}" }
      - { name: billed_this_month_cents, type: integer, source: computed, description: "Most recent committed monthly billing; 0 before first billing" }
      - { name: theft_claim_count, type: integer, source: computed, description: "Count of TheftClaim rows on this agreement's assets with status in {REPORTED, POLICE_VERIFIED, APPROVED}" }

  - name: ToolAsset
    parent: FleetAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> FleetAgreement.id; leasing agreement" }
      - { name: tool_model_id, type: string, source: system, description: "FK -> ToolModel.id; catalog model (set from adjust-fleet add list)" }
      - { name: serial_number, type: string, source: system, description: "Server-minted serial at registration", constraints: "unique within tool_model_id" }
      - { name: tag_code, type: string, source: system, description: "Server-minted RFID tag code" }
      - { name: status, type: enum, source: system, description: "Asset lifecycle", constraints: "REGISTERED | DEPLOYED | IN_TRANSIT | IN_REPAIR | LOST | RETIRED" }
      - { name: current_jobsite_id, type: string, source: system, description: "FK -> Jobsite.id; set only while DEPLOYED, null otherwise" }
      - { name: pending_jobsite_id, type: string, source: system, description: "FK -> Jobsite.id; transfer target while IN_TRANSIT, null otherwise" }
      - { name: commissioned_on, type: datetime, source: system, description: "Timestamp of first DEPLOYED entry; theft depreciation anchor" }
      - { name: utilization_minutes_current_month, type: integer, source: computed, description: "Sum of UsageEvent minutes recorded in the logical clock's current calendar month; reset to 0 by the month-boundary sweep" }

  - name: Jobsite
    parent: ContractorAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> ContractorAccount.id" }
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: capacity_assets, type: integer, source: input, description: "Maximum DEPLOYED assets hosted (deploy/transfer rejected when count >= capacity)" }
      - { name: geofence_radius_m, type: integer, source: input, description: "Geofence radius for location reporting" }
      - { name: deployed_asset_count, type: integer, source: computed, description: "Count of ToolAsset rows with current_jobsite_id == this id and status == DEPLOYED" }

  - name: UsageEvent
    parent: ToolAsset
    common_fields: false
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> ToolAsset.id" }
      - { name: started_at, type: datetime, source: input, description: "Usage start (ISO); must lie in the clock's current calendar month" }
      - { name: ended_at, type: datetime, source: input, description: "Usage end (ISO); strictly after started_at" }
      - { name: minutes, type: integer, source: computed, description: "floor((ended_at - started_at) in minutes)" }

  - name: LoanerUnit
    parent: null
    common_fields: true
    fields:
      - { name: tool_model_id, type: string, source: input, description: "FK -> ToolModel.id" }
      - { name: serial_number, type: string, source: input, description: "Loaner serial", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "Loaner lifecycle", constraints: "AVAILABLE | DISPATCHED | RETURNED | DECOMMISSIONED" }
      - { name: assigned_ticket_id, type: string, source: system, description: "FK -> RepairTicket.id; set while DISPATCHED, null otherwise" }

  - name: RepairTicket
    parent: ToolAsset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> ToolAsset.id; unit under repair" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: promised_return_by, type: datetime, source: computed, description: "opened_at + SLA days (LIGHT 3d, HEAVY 5d); recomputed from the REOPENED -> IN_SHOP receive timestamp" }
      - { name: loaner_requested, type: boolean, source: input, description: "Whether a loaner was requested at ticket open" }
      - { name: loaner_unit_id, type: string, source: system, description: "Reference to the dispatched LoanerUnit; null until dispatch" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of close; null while open" }
      - { name: sla_breach_credit_cents, type: integer, source: computed, description: "Credit granted at close; immutable once set (reopen does not recompute)" }
      - { name: status, type: enum, source: system, description: "Ticket lifecycle", constraints: "OPENED | PICKUP_SCHEDULED | IN_SHOP | LOANER_DISPATCHED | QUALITY_CHECK | CLOSED | REOPENED" }
      - { name: reopen_count, type: integer, source: computed, description: "Number of CLOSED -> REOPENED transitions; hard cap 2" }

  - name: TheftClaim
    parent: ToolAsset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> ToolAsset.id" }
      - { name: reported_at, type: datetime, source: system, description: "Logical-clock timestamp at claim creation" }
      - { name: police_report_number, type: string, source: system, description: "Police report reference recorded at verification" }
      - { name: police_report_filed_at, type: datetime, source: system, description: "Police report filing timestamp recorded at verification" }
      - { name: verified_by, type: string, source: system, description: "X-User-ID of the verifying FleetAdmin (duty-segregation anchor)" }
      - { name: approved_replacement_value_cents, type: integer, source: computed, description: "See calculation theft_replacement_cost" }
      - { name: deductible_cents, type: integer, source: computed, description: "See calculation theft_replacement_cost" }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", constraints: "REPORTED | POLICE_VERIFIED | APPROVED | DENIED | EXPIRED" }

  - name: ConsumableProduct
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit list price" }
      - { name: pack_size, type: integer, source: input, description: "Units per pack; quantities round up to whole packs per line" }
      - { name: requires_application_approval, type: boolean, source: input, description: "True for anchors/fasteners needing a DOCUMENTED ANCHOR_DESIGN support case" }

  - name: ConsumableOrder
    parent: ContractorAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> ContractorAccount.id" }
      - { name: lines, type: array, source: input, description: "Array of {product_id, quantity_units}; each product_id references a ConsumableProduct" }
      - { name: status, type: enum, source: system, description: "Order lifecycle", constraints: "DRAFT | SUBMITTED | APPROVED | FULFILLED | REJECTED" }
      - { name: total_cents, type: integer, source: computed, description: "See calculation consumable_order_total (per-line pack rounding, then sum)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of DRAFT -> SUBMITTED" }

  - name: SupportCase
    parent: ContractorAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> ContractorAccount.id" }
      - { name: kind, type: enum, source: input, description: "Support discipline", constraints: "ANCHOR_DESIGN | FIRESTOP" }
      - { name: jobsite_id, type: string, source: input, description: "FK -> Jobsite.id; visit location" }
      - { name: scheduled_for, type: datetime, source: input, description: "Visit start; occupies the half-open window [scheduled_for, scheduled_for + 2h) at that jobsite" }
      - { name: approved_by_engineer_id, type: string, source: system, description: "X-User-ID of the reviewing FieldEngineer (set on DOCUMENTED)" }
      - { name: documentation_url, type: string, source: system, description: "Stamped design documentation link; mandatory for APPROVE" }
      - { name: status, type: enum, source: system, description: "Case lifecycle", constraints: "OPEN | DOCUMENTED | REJECTED" }

  - name: EndOfTermSettlement
    parent: FleetAgreement
    common_fields: false
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> FleetAgreement.id; at most one settlement per agreement" }
      - { name: option, type: enum, source: system, description: "Echo of end_of_term_option at election", constraints: "BUYOUT | RENEWAL | RETURN" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Snapshot computed on entry to ENDING (provisional variant)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Recomputed at finalize-settlement (final variant); null until finalized" }
      - { name: finalized, type: boolean, source: system, description: "True once final_amount_cents is committed" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ContractorAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fleet/accounts/{id}/suspend"
        actor: FleetAdmin
        preconditions:
          - "outstanding_balance_cents > credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Every FleetAgreement of this account in ACTIVE moves to SUSPENDED (each such agreement's version increments by 1)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fleet/accounts/{id}/reinstate"
        actor: FleetAdmin
        preconditions:
          - "outstanding_balance_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Every FleetAgreement of this account in SUSPENDED moves to ACTIVE (each such agreement's version increments by 1)"

  - entity: FleetAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /fleet/accounts/{account_id}/agreements/{id}/activate"
        actor: FleetAdmin
        preconditions:
          - "Owning ContractorAccount.status == ACTIVE"
          - "fleet_size_target >= 1 (at least one asset added via adjust-fleet)"
          - "start_date >= logical-clock current timestamp's date"
        side_effects:
          - "monthly_fleet_billing runs (activation_prorated variant); billed_this_month_cents set"
          - "billed amount added to ContractorAccount.outstanding_balance_cents"
          - "increments FleetAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade from ContractorAccount suspend"
        actor: system
        preconditions: []
        side_effects:
          - "RepairTicket rows on this agreement's assets in {OPENED, PICKUP_SCHEDULED, IN_SHOP, LOANER_DISPATCHED, QUALITY_CHECK} cannot advance while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "cascade from ContractorAccount reinstate"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ENDING
        trigger: "POST /fleet/accounts/{account_id}/agreements/{id}/elect-end-of-term"
        actor: ContractorManager
        preconditions:
          - "OCC: expected_agreement_version == current version (else ERR_STALE_VERSION)"
          - "Logical-clock timestamp >= end_date - 30 days (election window; else ERR_WINDOW_EXPIRED)"
          - "No TheftClaim on any asset of this agreement in {REPORTED, POLICE_VERIFIED} (else ERR_AGREEMENT_HAS_OPEN_CLAIMS)"
        side_effects:
          - "end_of_term_option re-pinned to the elected value"
          - "EndOfTermSettlement row created; provisional_amount_cents computed (provisional variant)"
          - "increments FleetAgreement.version by 1"
      - from: ENDING
        to: CLOSED
        trigger: "POST /fleet/accounts/{account_id}/agreements/{id}/finalize-settlement (option BUYOUT or RETURN)"
        actor: FleetAdmin
        preconditions:
          - "If option == RETURN: every ToolAsset of this agreement is in {REGISTERED, RETIRED} (else ERR_RETURN_INCOMPLETE)"
        side_effects:
          - "EndOfTermSettlement final variant computed from the billable fleet as of this call (before any retirement below); final_amount_cents committed; finalized = true"
          - "If option == BUYOUT: every non-LOST, non-RETIRED ToolAsset of this agreement moves to RETIRED after the final amount is computed"
          - "increments FleetAgreement.version by 1"
      - from: ENDING
        to: ACTIVE
        trigger: "POST /fleet/accounts/{account_id}/agreements/{id}/finalize-settlement (option RENEWAL)"
        actor: FleetAdmin
        preconditions:
          - "Elected end_of_term_option == RENEWAL"
        side_effects:
          - "term_months += 12; end_date recomputed; settlement finalized with final_amount_cents == 0"
          - "Subsequent billing uses the RateCard effective at the renewal date"
          - "increments FleetAgreement.version by 1"

  - entity: ToolAsset
    initial_state: REGISTERED
    terminal_states: [RETIRED, LOST]
    transitions:
      - from: REGISTERED
        to: DEPLOYED
        trigger: "POST /fleet/assets/{id}/deploy"
        actor: JobsiteSupervisor
        preconditions:
          - "Agreement.status == ACTIVE (else ERR_INVALID_STATE)"
          - "Target Jobsite.account_id == agreement.account_id (else ERR_NOT_FOUND, cross-scope hidden)"
          - "Jobsite.deployed_asset_count < Jobsite.capacity_assets (>= capacity rejected with ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "current_jobsite_id set; commissioned_on set iff never deployed before"
          - "Jobsite.deployed_asset_count += 1"
      - from: DEPLOYED
        to: IN_TRANSIT
        trigger: "POST /fleet/assets/{id}/transfer"
        actor: JobsiteSupervisor
        preconditions:
          - "Agreement.status == ACTIVE"
          - "Target Jobsite.account_id == agreement.account_id (else ERR_NOT_FOUND)"
          - "Target Jobsite.deployed_asset_count < target capacity_assets (else ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "Origin Jobsite.deployed_asset_count -= 1; current_jobsite_id cleared; pending_jobsite_id = target"
      - from: IN_TRANSIT
        to: DEPLOYED
        trigger: "POST /fleet/assets/{id}/confirm-arrival"
        actor: JobsiteSupervisor
        preconditions: []
        side_effects:
          - "current_jobsite_id = pending_jobsite_id; pending_jobsite_id cleared; target Jobsite.deployed_asset_count += 1"
      - from: IN_TRANSIT
        to: DEPLOYED
        trigger: "POST /fleet/assets/{id}/cancel-transfer"
        actor: JobsiteSupervisor
        preconditions: []
        side_effects:
          - "current_jobsite_id restored to origin; pending_jobsite_id cleared; origin Jobsite.deployed_asset_count += 1 (compensates transfer)"
      - from: DEPLOYED
        to: REGISTERED
        trigger: "POST /fleet/assets/{id}/check-in"
        actor: JobsiteSupervisor
        preconditions: []
        side_effects:
          - "current_jobsite_id cleared; Jobsite.deployed_asset_count -= 1"
      - from: DEPLOYED
        to: IN_REPAIR
        trigger: "POST /fleet/assets/{asset_id}/repair-tickets (ticket creation)"
        actor: JobsiteSupervisor
        preconditions: []
        side_effects:
          - "RepairTicket created OPENED; promised_return_by computed from weight class"
          - "Origin Jobsite.deployed_asset_count -= 1; current_jobsite_id retained for return"
      - from: IN_REPAIR
        to: DEPLOYED
        trigger: "cascade from RepairTicket close"
        actor: system
        preconditions: []
        side_effects:
          - "Asset returns to the jobsite held in current_jobsite_id; that Jobsite.deployed_asset_count += 1"
      - from: DEPLOYED
        to: LOST
        trigger: "cascade from TheftClaim APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "Jobsite.deployed_asset_count -= 1; current_jobsite_id cleared"
      - from: REGISTERED
        to: RETIRED
        trigger: "POST /fleet/accounts/{account_id}/agreements/{id}/adjust-fleet (asset listed in return_asset_ids)"
        actor: ContractorManager
        preconditions:
          - "Asset status == REGISTERED (returning a DEPLOYED/IN_TRANSIT/IN_REPAIR asset -> ERR_INVALID_STATE)"
        side_effects: []

  - entity: RepairTicket
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: PICKUP_SCHEDULED
        trigger: "POST /fleet/repair-tickets/{id}/schedule-pickup"
        actor: ServiceCoordinator
        preconditions:
          - "Asset's agreement status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PICKUP_SCHEDULED
        to: IN_SHOP
        trigger: "POST /fleet/repair-tickets/{id}/receive"
        actor: ServiceCoordinator
        preconditions:
          - "Asset's agreement status == ACTIVE"
        side_effects: []
      - from: REOPENED
        to: IN_SHOP
        trigger: "POST /fleet/repair-tickets/{id}/receive"
        actor: ServiceCoordinator
        preconditions:
          - "Asset's agreement status == ACTIVE"
        side_effects:
          - "promised_return_by recomputed from this receive timestamp (new SLA window)"
      - from: IN_SHOP
        to: LOANER_DISPATCHED
        trigger: "POST /fleet/repair-tickets/{id}/dispatch-loaner"
        actor: ServiceCoordinator
        preconditions:
          - "Asset's agreement status == ACTIVE"
          - "loaner_requested == true (else ERR_INVALID_STATE)"
          - "loaner_allocation selector non-empty (else ERR_LOANER_POOL_EMPTY)"
        side_effects:
          - "LoanerUnit AVAILABLE -> DISPATCHED; assigned_ticket_id set; ticket.loaner_unit_id set"
      - from: IN_SHOP
        to: QUALITY_CHECK
        trigger: "POST /fleet/repair-tickets/{id}/complete-repair"
        actor: ServiceCoordinator
        preconditions:
          - "Asset's agreement status == ACTIVE"
        side_effects: []
      - from: LOANER_DISPATCHED
        to: QUALITY_CHECK
        trigger: "POST /fleet/repair-tickets/{id}/complete-repair"
        actor: ServiceCoordinator
        preconditions:
          - "Asset's agreement status == ACTIVE"
        side_effects: []
      - from: QUALITY_CHECK
        to: CLOSED
        trigger: "POST /fleet/repair-tickets/{id}/close"
        actor: ServiceCoordinator
        preconditions:
          - "Asset's agreement status == ACTIVE"
        side_effects:
          - "closed_at set; sla_breach_credit_cents computed (repair_turnaround_penalty)"
          - "If loaner_unit_id set: LoanerUnit DISPATCHED -> RETURNED, and that mutation itself advances the unit RETURNED -> AVAILABLE within the same call; assigned_ticket_id and ticket.loaner_unit_id cleared"
          - "ToolAsset IN_REPAIR -> DEPLOYED, which itself increments the return Jobsite.deployed_asset_count"
          - "sla_breach_credit_cents, if > 0, reduces ContractorAccount.outstanding_balance_cents (floor 0)"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /fleet/repair-tickets/{id}/reopen"
        actor: JobsiteSupervisor
        preconditions:
          - "Logical-clock now <= closed_at + 14 days (else ERR_WINDOW_EXPIRED)"
          - "reopen_count < 2 (else ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "ToolAsset DEPLOYED -> IN_REPAIR; its Jobsite.deployed_asset_count -= 1"
          - "reopen_count += 1; sla_breach_credit_cents unchanged (credit immutable once granted)"

  - entity: TheftClaim
    initial_state: REPORTED
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: REPORTED
        to: POLICE_VERIFIED
        trigger: "POST /fleet/theft-claims/{id}/verify-police-report"
        actor: FleetAdmin
        preconditions:
          - "police_report_filed_at <= reported_at + 48 hours (boundary inclusive; else ERR_WINDOW_EXPIRED)"
        side_effects:
          - "police_report_number, police_report_filed_at, verified_by recorded"
      - from: REPORTED
        to: EXPIRED
        trigger: "system (logical-clock sweep: clock passes reported_at + 48h while still REPORTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Asset remains DEPLOYED; agreement.theft_claim_count decremented"
      - from: POLICE_VERIFIED
        to: APPROVED
        trigger: "POST /fleet/theft-claims/{id}/decide (decision=APPROVE)"
        actor: ClaimsAdjuster
        preconditions:
          - "Actor X-User-ID != claim.verified_by (segregation of duties; else ERR_DUTY_SEGREGATION)"
        side_effects:
          - "theft_replacement_cost computed: deductible_cents, approved_replacement_value_cents"
          - "ToolAsset DEPLOYED -> LOST, which itself decrements its Jobsite.deployed_asset_count and clears current_jobsite_id"
          - "deductible_cents added to ContractorAccount.outstanding_balance_cents"
      - from: POLICE_VERIFIED
        to: DENIED
        trigger: "POST /fleet/theft-claims/{id}/decide (decision=DENY)"
        actor: ClaimsAdjuster
        preconditions:
          - "Actor X-User-ID != claim.verified_by (else ERR_DUTY_SEGREGATION)"
        side_effects:
          - "Asset remains DEPLOYED; agreement.theft_claim_count decremented"

  - entity: ConsumableOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fleet/accounts/{account_id}/consumable-orders/{id}/submit"
        actor: ContractorManager
        preconditions:
          - "lines non-empty (else ERR_VALIDATION)"
          - "ContractorAccount.status == ACTIVE (else ERR_INVALID_STATE)"
          - "Every line whose product has requires_application_approval == true is covered by a DOCUMENTED SupportCase of kind ANCHOR_DESIGN on this account (else ERR_APPLICATION_APPROVAL_REQUIRED)"
        side_effects:
          - "total_cents computed (consumable_order_total); submitted_at set"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fleet/accounts/{account_id}/consumable-orders/{id}/decide (decision=APPROVE)"
        actor: FleetAdmin
        preconditions:
          - "total_cents + account.outstanding_balance_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "account.outstanding_balance_cents += total_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fleet/accounts/{account_id}/consumable-orders/{id}/decide (decision=REJECT)"
        actor: FleetAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /fleet/accounts/{account_id}/consumable-orders/{id}/fulfill"
        actor: FleetAdmin
        preconditions: []
        side_effects: []

  - entity: SupportCase
    initial_state: OPEN
    terminal_states: [DOCUMENTED, REJECTED]
    transitions:
      - from: OPEN
        to: DOCUMENTED
        trigger: "POST /fleet/accounts/{account_id}/support-cases/{id}/review (decision=APPROVE)"
        actor: FieldEngineer
        preconditions:
          - "documentation_url present (else ERR_VALIDATION)"
        side_effects:
          - "approved_by_engineer_id = actor X-User-ID; documentation_url recorded"
      - from: OPEN
        to: REJECTED
        trigger: "POST /fleet/accounts/{account_id}/support-cases/{id}/review (decision=REJECT)"
        actor: FieldEngineer
        preconditions: []
        side_effects: []

  - entity: LoanerUnit
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: DISPATCHED
        trigger: "cascade from RepairTicket dispatch-loaner"
        actor: system
        preconditions: []
        side_effects: ["assigned_ticket_id set"]
      - from: DISPATCHED
        to: RETURNED
        trigger: "cascade from RepairTicket close (first hop)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: AVAILABLE
        trigger: "cascade from RepairTicket close (second hop, caused by the first hop)"
        actor: system
        preconditions: []
        side_effects: ["assigned_ticket_id cleared"]
      - from: AVAILABLE
        to: DECOMMISSIONED
        trigger: "POST /fleet/loaner-units/{id}/decommission"
        actor: FleetAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2b: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-adjust-stale-version
    parent_entity: FleetAgreement
    write_endpoint: "POST /fleet/accounts/{account_id}/agreements/{id}/adjust-fleet"
    occ_field: expected_agreement_version
    description: |
      An adjust-fleet call carrying an expected_agreement_version that no longer
      matches the agreement's current version is rejected: the adjustment
      reprices the agreement under monthly_fleet_billing, so a writer holding a
      stale view of fleet_size_target would reprice against superseded state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: end-of-term-election-stale-version
    parent_entity: FleetAgreement
    write_endpoint: "POST /fleet/accounts/{account_id}/agreements/{id}/elect-end-of-term"
    occ_field: expected_agreement_version
    description: |
      An elect-end-of-term call carrying an expected_agreement_version that no
      longer matches the agreement's current version is rejected: the election
      freezes a provisional settlement computed from the then-current fleet
      composition, so a stale view must not produce a settlement.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: monthly_fleet_billing
    trigger: "agreement activation; every successful adjust-fleet call; month-boundary sweep fired by the logical clock"
    algorithm: tiered_pricing
    formula: |
      Rate card selection: for each category, the RateCard with
      status == ACTIVE whose closed interval [effective_from, effective_to]
      contains the billing date (overlap prevention guarantees at most one).
      For each tool_category present among the agreement's billable assets
      (ToolAsset.status in {REGISTERED, DEPLOYED, IN_TRANSIT, IN_REPAIR};
      LOST and RETIRED excluded), with n = billable unit count in that category
      and R = the selected RateCard:
        tier1_units = min(n, R.tier2_threshold - 1)
        tier2_units = if n >= R.tier2_threshold
                      then min(n - R.tier2_threshold + 1, R.tier3_threshold - R.tier2_threshold)
                      else 0
        tier3_units = if n >= R.tier3_threshold then n - R.tier3_threshold + 1 else 0
        category_charge = tier1_units * R.base_monthly_rate_cents
                        + tier2_units * R.tier2_monthly_rate_cents
                        + tier3_units * R.tier3_monthly_rate_cents
        category_charge = max(category_charge, R.min_monthly_fee_cents)
      subtotal = sum of category_charge over categories
      Mid-cycle proration (activation and adjust-fleet only; NOT the sweep):
        proration_factor = remaining_days_inclusive / days_in_month
          where remaining_days_inclusive counts the calendar days from the
          logical-clock date through month end, both endpoints included.
        subtotal = floor(subtotal * proration_factor)
      billed_this_month_cents = subtotal; the billed amount is added to the
      account's outstanding_balance_cents.
      Evaluation order is pinned: tier split -> per-category min fee -> sum ->
      prorate -> floor. floor() is applied exactly once, after proration.
    input_set: "Billable assets = ToolAsset rows for the agreement with status in {REGISTERED, DEPLOYED, IN_TRANSIT, IN_REPAIR}"
    constants:
      PRORATION_BASIS: remaining_days_inclusive_of_today
    precision: "integer cents; single floor after proration; no rounding elsewhere"
    variants:
      - name: activation_prorated
        when: "agreement activation or adjust-fleet mid-month"
        difference: "proration_factor < 1 over the remaining days of the current month"
      - name: monthly_full
        when: "month-boundary sweep (clock crosses into a new month)"
        difference: "proration_factor = 1; full month billed; also resets every asset's utilization_minutes_current_month to 0"

  - name: repair_turnaround_penalty
    trigger: "RepairTicket close"
    algorithm: threshold
    formula: |
      promised_return_by = opened_at + SLA_DAYS days
        (SLA_DAYS = 3 for ToolModel.weight_class == LIGHT, 5 for HEAVY);
      recomputed from the receive timestamp on the REOPENED -> IN_SHOP leg.
      raw_hours = (closed_at - promised_return_by) in hours
      breach exists iff raw_hours > 0 (closed_at strictly after promised_return_by)
      breach_days = ceil(raw_hours / 24) when raw_hours > 0 else 0
      daily_credit_cents = 2500 for LIGHT, 9000 for HEAVY
      sla_breach_credit_cents = min(breach_days * daily_credit_cents, CREDIT_CAP_CENTS)
      Rounding order pinned: ceil on whole breach days first, multiply, cap last.
    input_set: "Single RepairTicket"
    constants:
      SLA_DAYS_LIGHT: 3
      SLA_DAYS_HEAVY: 5
      DAILY_CREDIT_LIGHT_CENTS: 2500
      DAILY_CREDIT_HEAVY_CENTS: 9000
      CREDIT_CAP_CENTS: 50000
    precision: "integer cents; ceil on breach_days; cap applied last"

  - name: theft_replacement_cost
    trigger: "TheftClaim approval"
    algorithm: weighted_scoring
    formula: |
      Evaluation order pinned (resolves the circular-looking dependency between
      deductible and coverage cap):
      1) age_months = floor(days between ToolAsset.commissioned_on and
         TheftClaim.reported_at / 30)
      2) depreciated_value_cents = round_half_up(ToolModel.replacement_value_cents * pct)
         where pct = 1.00 if age_months <= 12, 0.70 if 13..36, 0.40 if > 36
      3) deductible_cents = min(max(DEDUCTIBLE_FLOOR_CENTS,
                                    round_half_up(DEDUCTIBLE_PCT * depreciated_value_cents)),
                                DEDUCTIBLE_CAP_CENTS)
      4) approved_replacement_value_cents = max(0, min(
           depreciated_value_cents - deductible_cents,
           COVERAGE_CAP_CENTS - agreement_running_approved_theft_cents))
         where agreement_running_approved_theft_cents sums
         approved_replacement_value_cents over already-APPROVED claims on the
         same agreement (chronological by reported_at; ties broken by created_at).
    input_set: "Single TheftClaim plus prior APPROVED claims on the same agreement"
    constants:
      DEDUCTIBLE_FLOOR_CENTS: 50000
      DEDUCTIBLE_PCT: 0.10
      DEDUCTIBLE_CAP_CENTS: 250000
      COVERAGE_CAP_CENTS: 1000000
    precision: "integer cents; round_half_up after each percentage; floor 0 at the end"

  - name: fleet_utilization
    trigger: "GET /fleet/agreements/{id}/utilization"
    algorithm: aggregation
    formula: |
      elapsed_days = day-of-month of the logical-clock date (e.g. 16 on the 16th)
      per-asset utilization = utilization_minutes_current_month /
        (elapsed_days * WORKDAY_MINUTES) * 100, clamped to [0, 100]
      Report value = arithmetic mean of per-asset utilization over the
      agreement's billable assets (same status filter as monthly_fleet_billing),
      rounded half-up to 2 decimals. asset_count = number of billable assets;
      an agreement with 0 billable assets reports utilization_pct 0.00.
    input_set: "UsageEvent minutes accumulated in the current calendar month for billable assets"
    constants:
      WORKDAY_MINUTES: 480
    precision: "2 decimal places, round_half_up"
    variants:
      - name: actual
        when: "default (mode query param omitted or ACTUAL)"
        difference: "uses recorded minutes only"
      - name: projected
        when: "mode=PROJECTED"
        difference: "scales the actual figure by days_in_month / elapsed_days, extrapolating to month end; identical inputs yield a different (higher) percentage mid-month — clamp applied after scaling"

  - name: consumable_order_total
    trigger: "ConsumableOrder create and submit"
    algorithm: aggregation
    formula: |
      Rounding order pinned: per line first, then sum.
      For each line: packs = ceil(quantity_units / pack_size);
      line_total_cents = packs * pack_size * unit_price_cents (integer math).
      total_cents = sum(line_total_cents).
      Merging quantities across lines of the same product and rounding once is
      FORBIDDEN (produces a smaller total whenever two lines of one product
      individually under-fill a pack).
    input_set: "All lines of the order"
    constants: {}
    precision: "integer cents; ceil per line; no order-level rounding"

  - name: end_of_term_settlement
    trigger: "agreement ACTIVE -> ENDING (provisional); finalize-settlement (final)"
    algorithm: constraint_propagation
    formula: |
      Computed over the agreement's billable assets at computation time (same
      status filter as monthly_fleet_billing):
        BUYOUT: per asset charge = round_half_up(ToolModel.replacement_value_cents * BUYOUT_PCT);
          amount = sum over billable assets.
        RETURN: amount = assessed_damage_cents (finalize input; 0 for the
          provisional, which has no inspection input yet).
        RENEWAL: amount = 0.
      provisional_amount_cents is the snapshot at ENDING entry;
      final_amount_cents is recomputed at finalize-settlement against the
      then-current fleet — identical formula, different input snapshot, so the
      variants diverge whenever the fleet changed between election and
      finalization (e.g. an asset went LOST in between).
    input_set: "Billable assets at computation time"
    constants:
      BUYOUT_PCT: 0.20
    precision: "integer cents; round_half_up per asset"
    variants:
      - name: provisional
        when: "on entry to ENDING"
        difference: "fleet snapshot at election time"
      - name: final
        when: "at finalize-settlement"
        difference: "fleet snapshot at finalization time; RETURN uses assessed_damage_cents input"

  - name: loaner_allocation
    trigger: "RepairTicket dispatch-loaner"
    algorithm: waterfall_allocation
    formula: |
      Eligibility: LoanerUnit.status == AVAILABLE AND tool_model_id equals the
      model of the asset under repair. Ranking: created_at ASC (oldest unit
      first). Tie-break: created_at is unique per row by construction, so no
      further tie-break applies. Empty pool: ERR_LOANER_POOL_EMPTY (409) and the
      ticket remains IN_SHOP.
    input_set: "LoanerUnit rows"
    constants: {}
    precision: "n/a"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enum values valid, ended_at > started_at, effective_to > effective_from, quantities positive"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Path ids exist and belong to the embedding parent, validated left to right; cross-account references are hidden as NOT_FOUND"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "OCC: expected_agreement_version equals the agreement's current version on adjust-fleet and elect-end-of-term"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "adjust-fleet, elect-end-of-term"

  - priority: 6
    category: state
    check: "Target resource in a state from which the requested transition exists (invalid-from rejections, terminal lockout, agreement not ACTIVE gating deploy/transfer/ticket advancement, asset not DEPLOYED for usage/repair/theft, loaner_requested false on dispatch)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_safety
    check: "Segregation of duties: theft-claim decider's X-User-ID must differ from the claim's verified_by"
    error_id: ERR_DUTY_SEGREGATION
    http_status: 409
    applies_to: "POST /fleet/theft-claims/{id}/decide"

  - priority: 8
    category: business_temporal
    check: "Time windows: police_report_filed_at <= reported_at + 48h (inclusive); elect-end-of-term within end_date - 30d; repair reopen within closed_at + 14d (inclusive)"
    error_id: ERR_WINDOW_EXPIRED
    http_status: 409
    applies_to: "verify-police-report, elect-end-of-term, repair-ticket reopen"

  - priority: 9
    category: business_constraint
    check: "Capacity / occupancy / overlaps / structural gates: jobsite capacity on deploy & transfer; reopen_count cap 2; support-case half-open window overlap per jobsite; rate-card closed-interval overlap per category; loaner pool non-empty; no open theft claims at election; RETURN finalization completeness"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_WINDOW_OVERLAP | ERR_LOANER_POOL_EMPTY | ERR_AGREEMENT_HAS_OPEN_CLAIMS | ERR_RETURN_INCOMPLETE"
    http_status: 409
    applies_to: "deploy, transfer, reopen, support-case create, rate-card create, dispatch-loaner, elect-end-of-term, finalize-settlement"

  - priority: 10
    category: business_referential
    check: "Application-approval gate: every order line with requires_application_approval == true must be covered by a DOCUMENTED ANCHOR_DESIGN SupportCase on the same account"
    error_id: ERR_APPLICATION_APPROVAL_REQUIRED
    http_status: 422
    applies_to: "consumable-order submit"

  - priority: 11
    category: business_fiscal
    check: "Credit: consumable approval requires total_cents + outstanding_balance_cents <= credit_limit_cents; account suspend requires outstanding > credit_limit; reinstate requires outstanding <= credit_limit"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "consumable-order decide(APPROVE), account suspend, account reinstate"

  - priority: 12
    category: business_constraint
    check: "Uniqueness: tax_id, rate card code, model_code, loaner serial_number, sku"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "create endpoints for accounts, rate-cards, tool-models, loaner-units, consumable-products"

# =============================================================================
# Table 5: API Endpoint Table (53 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/fleet/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [FleetAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Theft-claim expiry sweep: REPORTED claims whose reported_at + 48h has passed move to EXPIRED"
      - "Month-boundary sweep: crossing into a new calendar month runs monthly_fleet_billing (monthly_full) for every ACTIVE agreement and resets utilization_minutes_current_month on all assets"

  # --- accounts ---
  - method: POST
    path: "/fleet/accounts"
    description: "Create a contractor account"
    roles: [FleetAdmin]
    code: 201
    input: [company_name, tax_id, credit_limit_cents]
    output: ContractorAccount
    side_effects: ["status=ACTIVE, outstanding_balance_cents=0"]

  - method: GET
    path: "/fleet/accounts/{id}"
    description: "Get an account"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor, ServiceCoordinator, ClaimsAdjuster, FieldEngineer]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: []

  - method: POST
    path: "/fleet/accounts/{id}/suspend"
    description: "Suspend an account whose outstanding balance exceeds its credit limit"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["agreements ACTIVE -> SUSPENDED cascade"]

  - method: POST
    path: "/fleet/accounts/{id}/reinstate"
    description: "Reinstate a suspended account once balance is within limit"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["agreements SUSPENDED -> ACTIVE cascade"]

  - method: POST
    path: "/fleet/accounts/{id}/payments"
    description: "Record a payment against the account's outstanding balance (floor 0)"
    roles: [ContractorManager]
    code: 200
    input: [amount_cents]
    output: ContractorAccount
    side_effects: ["outstanding_balance_cents -= amount_cents, floored at 0"]

  # --- rate cards & catalog ---
  - method: POST
    path: "/fleet/rate-cards"
    description: "Create a rate card; closed-interval overlap with an existing ACTIVE card of the same tool_category is rejected"
    roles: [FleetAdmin]
    code: 201
    input: [code, tool_category, base_monthly_rate_cents, tier2_threshold, tier2_monthly_rate_cents, tier3_threshold, tier3_monthly_rate_cents, min_monthly_fee_cents, effective_from, effective_to]
    output: RateCard
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/fleet/tool-models"
    description: "Create a catalog tool model"
    roles: [FleetAdmin]
    code: 201
    input: [model_code, category, replacement_value_cents, weight_class]
    output: ToolModel
    side_effects: []

  # --- agreements ---
  - method: POST
    path: "/fleet/accounts/{account_id}/agreements"
    description: "Create a fleet agreement in DRAFT"
    roles: [FleetAdmin]
    code: 201
    input: [term_months, start_date, end_of_term_option]
    output: FleetAgreement
    side_effects: ["end_date computed = start_date + term_months months"]

  - method: GET
    path: "/fleet/accounts/{id}/agreements"
    description: "List agreements of an account"
    roles: [FleetAdmin, ContractorManager]
    code: 200
    input: []
    output: FleetAgreement[]
    side_effects: []

  - method: GET
    path: "/fleet/agreements/{id}"
    description: "Get an agreement"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor]
    code: 200
    input: []
    output: FleetAgreement
    side_effects: []

  - method: POST
    path: "/fleet/accounts/{account_id}/agreements/{id}/activate"
    description: "Activate a DRAFT agreement; runs the prorated first billing"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: FleetAgreement
    side_effects: ["monthly_fleet_billing (activation_prorated)", "billed amount added to outstanding_balance_cents", "version += 1"]

  - method: POST
    path: "/fleet/accounts/{account_id}/agreements/{id}/adjust-fleet"
    description: "Add assets (by tool model, duplicates allowed) and/or return REGISTERED assets; reprices with mid-cycle proration. Allowed in DRAFT and ACTIVE. OCC-guarded."
    roles: [ContractorManager]
    code: 200
    input: [expected_agreement_version, add_tool_model_ids, return_asset_ids]
    output: FleetAgreement
    side_effects:
      - "each added model id creates a ToolAsset in REGISTERED with server-minted serial_number and tag_code"
      - "each returned asset must be REGISTERED -> RETIRED (else ERR_INVALID_STATE)"
      - "monthly_fleet_billing recompute (activation_prorated variant) when the agreement is ACTIVE; billed delta added to outstanding_balance_cents"
      - "increments FleetAgreement.version by 1"

  - method: POST
    path: "/fleet/accounts/{account_id}/agreements/{id}/elect-end-of-term"
    description: "Elect BUYOUT/RENEWAL/RETURN within the election window; creates the provisional settlement. OCC-guarded."
    roles: [ContractorManager]
    code: 200
    input: [expected_agreement_version, end_of_term_option]
    output: FleetAgreement
    side_effects:
      - "agreement ACTIVE -> ENDING"
      - "EndOfTermSettlement created (provisional variant)"
      - "increments FleetAgreement.version by 1"

  - method: POST
    path: "/fleet/accounts/{account_id}/agreements/{id}/finalize-settlement"
    description: "Finalize the end-of-term settlement; BUYOUT/RETURN close the agreement, RENEWAL extends it by 12 months back to ACTIVE"
    roles: [FleetAdmin]
    code: 200
    input: [assessed_damage_cents]
    output: FleetAgreement
    side_effects:
      - "end_of_term_settlement final variant computed from the billable fleet as of this call (before BUYOUT retirements) and committed (finalized = true)"
      - "BUYOUT: non-terminal assets -> RETIRED; agreement -> CLOSED"
      - "RETURN: all assets must be REGISTERED/RETIRED; agreement -> CLOSED"
      - "RENEWAL: term_months += 12; end_date recomputed; agreement -> ACTIVE"
      - "increments FleetAgreement.version by 1"

  - method: GET
    path: "/fleet/agreements/{id}/utilization"
    description: "Utilization report over billable assets; optional query mode=ACTUAL (default) | PROJECTED"
    roles: [FleetAdmin, ContractorManager]
    code: 200
    input: ["mode?"]
    output: { utilization_pct: number, mode: string, asset_count: integer }
    side_effects: []

  - method: GET
    path: "/fleet/agreements/{id}/settlement"
    description: "Read the end-of-term settlement for an agreement (array of length 0 or 1)"
    roles: [FleetAdmin, ContractorManager]
    code: 200
    input: []
    output: EndOfTermSettlement[]
    side_effects: []

  # --- jobsites ---
  - method: POST
    path: "/fleet/accounts/{account_id}/jobsites"
    description: "Create a jobsite"
    roles: [ContractorManager]
    code: 201
    input: [name, address, capacity_assets, geofence_radius_m]
    output: Jobsite
    side_effects: ["deployed_asset_count = 0"]

  - method: GET
    path: "/fleet/accounts/{id}/jobsites"
    description: "List jobsites of an account"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor]
    code: 200
    input: []
    output: Jobsite[]
    side_effects: []

  - method: GET
    path: "/fleet/jobsites/{id}"
    description: "Get a jobsite"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor]
    code: 200
    input: []
    output: Jobsite
    side_effects: []

  # --- assets ---
  - method: GET
    path: "/fleet/assets"
    description: "List assets with optional filters"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor, ServiceCoordinator, ClaimsAdjuster]
    code: 200
    input: ["agreement_id?", "tool_model_id?", "current_jobsite_id?", "pending_jobsite_id?", "status?"]
    output: ToolAsset[]
    side_effects: []

  - method: GET
    path: "/fleet/assets/{id}"
    description: "Get an asset"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor, ServiceCoordinator, ClaimsAdjuster]
    code: 200
    input: []
    output: ToolAsset
    side_effects: []

  - method: POST
    path: "/fleet/assets/{id}/deploy"
    description: "Deploy a REGISTERED asset to a jobsite of the same account with free capacity"
    roles: [JobsiteSupervisor]
    code: 200
    input: [jobsite_id]
    output: ToolAsset
    side_effects: ["jobsite.deployed_asset_count += 1", "commissioned_on set on first deploy"]

  - method: POST
    path: "/fleet/assets/{id}/transfer"
    description: "Move a DEPLOYED asset to another jobsite via IN_TRANSIT"
    roles: [JobsiteSupervisor]
    code: 200
    input: [target_jobsite_id]
    output: ToolAsset
    side_effects: ["origin jobsite.deployed_asset_count -= 1", "pending_jobsite_id set"]

  - method: POST
    path: "/fleet/assets/{id}/confirm-arrival"
    description: "Confirm arrival of an IN_TRANSIT asset at its pending target jobsite"
    roles: [JobsiteSupervisor]
    code: 200
    input: []
    output: ToolAsset
    side_effects: ["target jobsite.deployed_asset_count += 1", "pending_jobsite_id cleared"]

  - method: POST
    path: "/fleet/assets/{id}/cancel-transfer"
    description: "Return an IN_TRANSIT asset to its origin jobsite (compensates transfer)"
    roles: [JobsiteSupervisor]
    code: 200
    input: []
    output: ToolAsset
    side_effects: ["origin jobsite.deployed_asset_count += 1", "pending_jobsite_id cleared"]

  - method: POST
    path: "/fleet/assets/{id}/check-in"
    description: "Return a DEPLOYED asset to the depot (DEPLOYED -> REGISTERED)"
    roles: [JobsiteSupervisor]
    code: 200
    input: []
    output: ToolAsset
    side_effects: ["jobsite.deployed_asset_count -= 1", "current_jobsite_id cleared"]

  - method: POST
    path: "/fleet/assets/{id}/usage-events"
    description: "Record a usage event for a DEPLOYED asset; both timestamps must fall in the clock's current calendar month"
    roles: [JobsiteSupervisor]
    code: 201
    input: [started_at, ended_at]
    output: UsageEvent
    side_effects: ["asset.utilization_minutes_current_month += minutes"]

  - method: GET
    path: "/fleet/assets/{id}/usage-events"
    description: "List usage events for an asset"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor]
    code: 200
    input: []
    output: UsageEvent[]
    side_effects: []

  # --- repair tickets ---
  - method: POST
    path: "/fleet/assets/{asset_id}/repair-tickets"
    description: "Open a repair ticket on a DEPLOYED asset"
    roles: [JobsiteSupervisor]
    code: 201
    input: [loaner_requested]
    output: RepairTicket
    side_effects: ["asset DEPLOYED -> IN_REPAIR", "promised_return_by computed", "jobsite.deployed_asset_count -= 1"]

  - method: GET
    path: "/fleet/assets/{id}/repair-tickets"
    description: "List repair tickets for an asset"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor, ServiceCoordinator]
    code: 200
    input: []
    output: RepairTicket[]
    side_effects: []

  - method: GET
    path: "/fleet/repair-tickets/{id}"
    description: "Get a repair ticket"
    roles: [FleetAdmin, ContractorManager, JobsiteSupervisor, ServiceCoordinator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/fleet/repair-tickets/{id}/schedule-pickup"
    description: "OPENED -> PICKUP_SCHEDULED"
    roles: [ServiceCoordinator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/fleet/repair-tickets/{id}/receive"
    description: "PICKUP_SCHEDULED or REOPENED -> IN_SHOP; on REOPENED recomputes promised_return_by from now"
    roles: [ServiceCoordinator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["REOPENED leg: promised_return_by recomputed"]

  - method: POST
    path: "/fleet/repair-tickets/{id}/dispatch-loaner"
    description: "IN_SHOP -> LOANER_DISPATCHED; allocates the oldest AVAILABLE loaner of the same tool model"
    roles: [ServiceCoordinator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["loaner_allocation selector", "LoanerUnit AVAILABLE -> DISPATCHED"]

  - method: POST
    path: "/fleet/repair-tickets/{id}/complete-repair"
    description: "IN_SHOP or LOANER_DISPATCHED -> QUALITY_CHECK"
    roles: [ServiceCoordinator]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []

  - method: POST
    path: "/fleet/repair-tickets/{id}/close"
    description: "QUALITY_CHECK -> CLOSED; computes SLA credit, returns loaner (two-hop cascade), redeploys asset"
    roles: [ServiceCoordinator]
    code: 200
    input: []
    output: RepairTicket
    side_effects:
      - "repair_turnaround_penalty computed"
      - "LoanerUnit DISPATCHED -> RETURNED -> AVAILABLE (two-hop cascade in one call)"
      - "ToolAsset IN_REPAIR -> DEPLOYED; jobsite.deployed_asset_count += 1"
      - "account.outstanding_balance_cents reduced by sla_breach_credit_cents (floor 0)"

  - method: POST
    path: "/fleet/repair-tickets/{id}/reopen"
    description: "CLOSED -> REOPENED within 14 days of close, max 2 reopens"
    roles: [JobsiteSupervisor]
    code: 200
    input: []
    output: RepairTicket
    side_effects: ["asset DEPLOYED -> IN_REPAIR", "jobsite.deployed_asset_count -= 1", "reopen_count += 1"]

  # --- loaner units ---
  - method: POST
    path: "/fleet/loaner-units"
    description: "Register a loaner unit"
    roles: [FleetAdmin]
    code: 201
    input: [tool_model_id, serial_number]
    output: LoanerUnit
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/fleet/loaner-units"
    description: "List loaner units with optional filters"
    roles: [FleetAdmin, ServiceCoordinator]
    code: 200
    input: ["tool_model_id?", "assigned_ticket_id?", "status?"]
    output: LoanerUnit[]
    side_effects: []

  - method: GET
    path: "/fleet/loaner-units/{id}"
    description: "Get a loaner unit"
    roles: [FleetAdmin, ServiceCoordinator]
    code: 200
    input: []
    output: LoanerUnit
    side_effects: []

  - method: POST
    path: "/fleet/loaner-units/{id}/decommission"
    description: "AVAILABLE -> DECOMMISSIONED"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: LoanerUnit
    side_effects: []

  # --- theft claims ---
  - method: POST
    path: "/fleet/assets/{asset_id}/theft-claims"
    description: "Report a theft on a DEPLOYED asset"
    roles: [JobsiteSupervisor]
    code: 201
    input: []
    output: TheftClaim
    side_effects: ["status=REPORTED; reported_at = logical clock", "agreement.theft_claim_count += 1"]

  - method: GET
    path: "/fleet/assets/{id}/theft-claims"
    description: "List theft claims for an asset"
    roles: [FleetAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: TheftClaim[]
    side_effects: []

  - method: POST
    path: "/fleet/theft-claims/{id}/verify-police-report"
    description: "REPORTED -> POLICE_VERIFIED; enforces the 48h police-report window (inclusive boundary)"
    roles: [FleetAdmin]
    code: 200
    input: [police_report_number, police_report_filed_at]
    output: TheftClaim
    side_effects: ["verified_by = actor X-User-ID"]

  - method: POST
    path: "/fleet/theft-claims/{id}/decide"
    description: "POLICE_VERIFIED -> APPROVED | DENIED; decider must differ from verifier (segregation of duties)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision]
    output: TheftClaim
    side_effects:
      - "APPROVE: theft_replacement_cost computed; asset DEPLOYED -> LOST; jobsite count -= 1; deductible added to outstanding_balance_cents"
      - "DENY: agreement.theft_claim_count -= 1"

  # --- consumables ---
  - method: POST
    path: "/fleet/consumable-products"
    description: "Create a consumable product"
    roles: [FleetAdmin]
    code: 201
    input: [sku, name, unit_price_cents, pack_size, requires_application_approval]
    output: ConsumableProduct
    side_effects: []

  - method: POST
    path: "/fleet/accounts/{account_id}/consumable-orders"
    description: "Create a DRAFT consumable order with lines [{product_id, quantity_units}]"
    roles: [ContractorManager]
    code: 201
    input: [lines]
    output: ConsumableOrder
    side_effects: ["consumable_order_total computed"]

  - method: GET
    path: "/fleet/accounts/{id}/consumable-orders"
    description: "List consumable orders of an account"
    roles: [FleetAdmin, ContractorManager]
    code: 200
    input: []
    output: ConsumableOrder[]
    side_effects: []

  - method: GET
    path: "/fleet/consumable-orders/{id}"
    description: "Get a consumable order"
    roles: [FleetAdmin, ContractorManager]
    code: 200
    input: []
    output: ConsumableOrder
    side_effects: []

  - method: POST
    path: "/fleet/accounts/{account_id}/consumable-orders/{id}/submit"
    description: "DRAFT -> SUBMITTED; application-approval gate; recomputes total"
    roles: [ContractorManager]
    code: 200
    input: []
    output: ConsumableOrder
    side_effects: ["consumable_order_total recomputed", "submitted_at set"]

  - method: POST
    path: "/fleet/accounts/{account_id}/consumable-orders/{id}/decide"
    description: "SUBMITTED -> APPROVED | REJECTED; credit-limit gate on APPROVE"
    roles: [FleetAdmin]
    code: 200
    input: [decision]
    output: ConsumableOrder
    side_effects: ["APPROVE: account.outstanding_balance_cents += total_cents"]

  - method: POST
    path: "/fleet/accounts/{account_id}/consumable-orders/{id}/fulfill"
    description: "APPROVED -> FULFILLED"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: ConsumableOrder
    side_effects: []

  # --- support cases ---
  - method: POST
    path: "/fleet/accounts/{account_id}/support-cases"
    description: "Open an on-site support case; half-open 2h window overlap with another non-REJECTED case at the same jobsite is rejected"
    roles: [ContractorManager]
    code: 201
    input: [kind, jobsite_id, scheduled_for]
    output: SupportCase
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/fleet/support-cases"
    description: "List support cases with optional filters"
    roles: [FleetAdmin, ContractorManager, FieldEngineer]
    code: 200
    input: ["account_id?", "jobsite_id?", "status?", "kind?"]
    output: SupportCase[]
    side_effects: []

  - method: GET
    path: "/fleet/support-cases/{id}"
    description: "Get a support case"
    roles: [FleetAdmin, ContractorManager, FieldEngineer]
    code: 200
    input: []
    output: SupportCase
    side_effects: []

  - method: POST
    path: "/fleet/accounts/{account_id}/support-cases/{id}/review"
    description: "OPEN -> DOCUMENTED (decision=APPROVE, documentation_url required) or OPEN -> REJECTED (decision=REJECT)"
    roles: [FieldEngineer]
    code: 200
    input: [decision, "documentation_url?"]
    output: SupportCase
    side_effects: ["APPROVE: approved_by_engineer_id = actor X-User-ID; documentation_url recorded"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed input: missing required field, bad enum, ended_at <= started_at, effective_to <= effective_from, empty lines, non-positive quantities" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id missing, not under the embedding parent, or references a resource of another account (cross-account references hidden)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition requested from a state where it does not exist; includes terminal lockout, agreement not ACTIVE gating deploy/transfer/ticket advancement, asset not DEPLOYED for usage/repair/theft, dispatch without loaner_requested" }
  - { id: ERR_DUTY_SEGREGATION, http: 409, condition: "Theft-claim decider's X-User-ID equals the claim's verified_by" }
  - { id: ERR_WINDOW_EXPIRED, http: 409, condition: "Police report older than 48h, election outside the 30-day window, reopen past 14 days after close" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Jobsite at capacity on deploy/transfer-target, or reopen_count already 2" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Support-case half-open 2h window overlap at a jobsite, or rate-card closed-interval overlap within a category" }
  - { id: ERR_LOANER_POOL_EMPTY, http: 409, condition: "No AVAILABLE LoanerUnit matching the asset's tool_model_id at dispatch" }
  - { id: ERR_AGREEMENT_HAS_OPEN_CLAIMS, http: 409, condition: "End-of-term election blocked by a theft claim in REPORTED or POLICE_VERIFIED" }
  - { id: ERR_RETURN_INCOMPLETE, http: 409, condition: "RETURN finalization blocked: some assets still DEPLOYED/IN_TRANSIT/IN_REPAIR/LOST" }
  - { id: ERR_APPLICATION_APPROVAL_REQUIRED, http: 422, condition: "Order line requires a DOCUMENTED ANCHOR_DESIGN support case the account lacks" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Consumable approval would exceed credit limit; or suspend/reinstate balance precondition violated" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique constraint violation (tax_id, rate card code, model_code, loaner serial_number, sku)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: FleetAdmin
    description: "Provider-side operations administrator: accounts, rate cards, catalog, agreement lifecycle, theft verification, consumable approval, loaner registry, logical clock"
    identity: opaque
    exclusive_operations:
      - account create/suspend/reinstate
      - rate card and tool model and consumable product creation
      - agreement create/activate/finalize-settlement
      - theft-claim police verification
      - consumable-order decide/fulfill
      - loaner-unit register/decommission
      - logical clock control
    shared_operations: [reads]

  - name: ContractorManager
    description: "Contractor-side account manager; X-User-ID equals the ContractorAccount id the manager acts for"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations:
      - jobsite create
      - agreement adjust-fleet and elect-end-of-term
      - account payments
      - consumable-order create/submit
      - support-case create
    shared_operations: [reads]

  - name: JobsiteSupervisor
    description: "Contractor-side field supervisor; X-User-ID equals the ContractorAccount id whose jobsites they supervise"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations:
      - asset deploy/transfer/confirm-arrival/cancel-transfer/check-in
      - usage-event record
      - repair-ticket open/reopen
      - theft-claim report
    shared_operations: [reads]

  - name: ServiceCoordinator
    description: "Provider-side repair dispatcher; advances repair tickets and dispatches loaners"
    identity: opaque
    exclusive_operations:
      - repair-ticket schedule-pickup/receive/dispatch-loaner/complete-repair/close
    shared_operations: [reads]

  - name: ClaimsAdjuster
    description: "Provider-side claims adjudicator; decides verified theft claims (segregated from the verifier)"
    identity: opaque
    exclusive_operations: [theft-claim decide]
    shared_operations: [reads]

  - name: FieldEngineer
    description: "Provider-side field engineer; reviews and documents anchor-design/firestop support cases"
    identity: opaque
    exclusive_operations: [support-case review]
    shared_operations: [reads]
