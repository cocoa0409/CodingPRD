  - rule_id: combinatorial_formula
    instances:

      - name: gross_premium_round_per_band_then_sum_not_sum_then_round
        grounds:
          - calculations.policy_gross_premium_banded
          - entities.LeaguePolicy.fields.gross_premium_cents
          - entities.SportClassification.fields.hazard_load_bps
          - global_constants.HAZARD_LOAD_BPS
        distinguishing_aspect: |
          This instance is §0.5 Rule 2 mode (b) - nested rounding whose ORDER changes the answer: rounding
          each of the three participant bands to whole cents and then summing yields 154706 + 620114 + 7013
          == 781833, while summing the three unrounded band products (154706.25 + 620114.21875 + 7013.35 ==
          781833.81875) and rounding once yields 781834. The scaffold pins round-per-band-then-sum, so
          781834 is the wrong answer and one cent separates a correct implementation from a wrong one.
        test_recipe:
          setup:
            - "One SANCTIONED league and one BASEBALL_U12 classification whose hazard_class CLASS_2_MODERATE carries hazard_load_bps 1150 and whose base rate is 1850 cents per participant."
            - "No policy exists yet; the quote itself is the observation."
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "Riverside Youth Baseball", league_code: "RYB-003", state_code: "OH", governing_body_code: "USYSA", contact_email: "admin@ryb.example" }
              as: ProgramAdministrator
              captures: { league_id: "$.data.id" }
            - call: "POST /sport-classifications"
              payload: { sport_code: "BASEBALL_U12", sport_name: "Baseball U12", hazard_class: "CLASS_2_MODERATE", base_rate_per_participant_cents: 1850, deductible_cents: 25000, per_injury_limit_cents: 2500000, cat_attachment_point_cents: 2500000, aggregate_limit_cents: 25000000, cat_lifetime_max_cents: 100000000, minimum_participants: 25, travel_buffer_minutes: 60, service_category_caps: { EMERGENCY_ROOM: 500000, SURGERY: 3000000, DIAGNOSTIC_IMAGING: 300000, PHYSICAL_THERAPY: 20000, DENTAL: 350000, AMBULANCE: 200000, PHYSICIAN_OFFICE: 50000 } }
              as: ProgramAdministrator
              captures: { sport_id: "$.data.id" }
          trigger:
            - call: "POST /league-policies"
              payload: { league_id: "${league_id}", sport_classification_id: "${sport_id}", term_effective_date: "2026-03-01", term_expiration_date: "2027-03-01", enrolled_participant_count: 404, coverage_basis_election: "EXCESS_ONLY", cat_layer_elected: true }
              as: ProgramAdministrator
              captures: { pol_id: "$.data.id" }
          assert:
            - "SportClassification.${sport_id}.hazard_load_bps == 1150"
            - "LeaguePolicy.${pol_id}.gross_premium_cents == 781833"
            - "LeaguePolicy.${pol_id}.gross_premium_cents != 781834"
            - "LeaguePolicy.${pol_id}.cat_layer_charge_cents == 66456"
            - "LeaguePolicy.${pol_id}.premium_subtotal_cents == 848289"
            - "LeaguePolicy.${pol_id}.volume_credit_bps == 300"
            - "LeaguePolicy.${pol_id}.volume_credit_cents == 25449"
            - "LeaguePolicy.${pol_id}.annual_premium_cents == 822840"
            - "LeaguePolicy.${pol_id}.status == QUOTED"

      - name: annual_premium_pinned_order_cat_charge_before_volume_tier
        grounds:
