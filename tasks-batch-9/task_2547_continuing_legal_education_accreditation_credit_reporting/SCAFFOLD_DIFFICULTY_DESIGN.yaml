  - rule_id: non_linear_state_machine
    instances:

      - name: course_application_info_request_loop_then_remand_refills_the_budget
        grounds:
          - state_machines.CourseApplication
          - domain_constants.MAX_INFO_REQUEST_ROUNDS
          - domain_constants.MAX_REMANDS
          - entities.CourseApplication.fields.info_request_round
          - entities.CourseApplication.fields.remand_count
          - entities.CourseApplication.fields.supplement_count
          - errors[ERR_INFO_REQUEST_LIMIT_EXCEEDED]
          - errors[ERR_REMAND_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          CourseApplication is cyclic on two nested loops over the SAME entity: SUBMITTED ->
          INFO_REQUESTED -> SUBMITTED is bounded by MAX_INFO_REQUEST_ROUNDS (2), and the outer loop
          DENIED -> APPEALED -> SUBMITTED (REMAND) is bounded by MAX_REMANDS (1) and, as a side
          effect, RESETS info_request_round to 0 — so a REQUEST_INFO that is rejected before the
          remand is accepted after it, while supplement_count keeps accumulating across both loops.
          Falsifiable: an implementation that treats info_request_round as a lifetime counter rejects
          the post-remand REQUEST_INFO; one that resets remand_count too accepts a second remand.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default so the APPEAL_WINDOW_DAYS window never expires during the run."
            - "One ACTIVE attorney who files an individual-approval course (no provider_id), leaving the course in PENDING_APPROVAL and the application in SUBMITTED with info_request_round 0."
            - "Reviewer identity is 'reviewer-alpha' throughout; the appeals panelist is 'panelist-one' so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-4004", full_name: "Dorothy Achebe", admission_date: "2011-03-01T00:00:00Z", compliance_group: "GROUP_3", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Self-Directed Study of Fee Agreements", delivery_format: "SELF_STUDY", total_minutes: 180, presented_at: "2026-06-01T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "ETHICS", minutes: 180 } ] }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { crs_id: $.data.id }
            - call: "POST /cle/courses/${crs_id}/applications"
              payload: {}
              as: Attorney
              as_user_id: "${att_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "REQUEST_INFO" }
              as: AccreditationReviewer
              as_user_id: "reviewer-alpha"
            - call: "POST /cle/course-applications/${app_id}/appellant-actions"
              payload: { action: "SUPPLEMENT" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "REQUEST_INFO" }
              as: AccreditationReviewer
              as_user_id: "reviewer-alpha"
            - call: "POST /cle/course-applications/${app_id}/appellant-actions"
              payload: { action: "SUPPLEMENT" }
              as: Attorney
              as_user_id: "${att_id}"
          trigger:
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "REQUEST_INFO" }
              as: AccreditationReviewer
              as_user_id: "reviewer-alpha"
              expect_error: ERR_INFO_REQUEST_LIMIT_EXCEEDED
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "DENY", denial_reason: "Materials still do not identify the ethics content." }
              as: AccreditationReviewer
              as_user_id: "reviewer-alpha"
            - call: "POST /cle/course-applications/${app_id}/appellant-actions"
              payload: { action: "APPEAL", appeal_grounds: "The ethics content is identified in the appended outline." }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/course-applications/${app_id}/appeal-decisions"
              payload: { disposition: "REMAND", decision_reason: "Reviewer did not consider the appended outline." }
              as: AppealsPanelist
              as_user_id: "panelist-one"
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "REQUEST_INFO" }
              as: AccreditationReviewer
              as_user_id: "reviewer-alpha"
            - call: "POST /cle/course-applications/${app_id}/appellant-actions"
              payload: { action: "SUPPLEMENT" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/course-applications/${app_id}/review-actions"
              payload: { action: "DENY", denial_reason: "Outline still lacks an ethics learning objective." }
              as: AccreditationReviewer
              as_user_id: "reviewer-alpha"
            - call: "POST /cle/course-applications/${app_id}/appellant-actions"
              payload: { action: "APPEAL", appeal_grounds: "Second appeal on the same record." }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/course-applications/${app_id}/appeal-decisions"
              payload: { disposition: "REMAND", decision_reason: "Send back once more." }
              as: AppealsPanelist
              as_user_id: "panelist-one"
              expect_error: ERR_REMAND_LIMIT_EXCEEDED
          assert:
            - "The third REQUEST_INFO of the first loop returns ERR_INFO_REQUEST_LIMIT_EXCEEDED (409) and leaves status == SUBMITTED with info_request_round == 2"
            - "Immediately after REMAND: CourseApplication.${app_id}.status == SUBMITTED, remand_count == 1, info_request_round == 0, reviewer_user_id == null, denial_reason == null, denied_at == null"
            - "Immediately after REMAND: Course.${crs_id}.status == PENDING_APPROVAL and denial_reason == null"
            - "The post-remand REQUEST_INFO SUCCEEDS: status == INFO_REQUESTED, info_request_round == 1"
            - "After the post-remand SUPPLEMENT: supplement_count == 3 (cumulative across both loops, never reset)"
            - "The second REMAND returns ERR_REMAND_LIMIT_EXCEEDED (409) and leaves status == APPEALED with remand_count == 1"
            - "CourseApplication.${app_id}.appeal_panelist_user_id == \"panelist-one\" and no transition ever set reviewer_user_id == appeal_panelist_user_id"

      - name: compliance_cycle_administrative_dimension_advances_twice_while_credit_dimension_stays_open
        grounds:
          - state_machines.ComplianceCycle.parallel_dimensions
          - state_machines.ComplianceCycle.GOOD_STANDING_to_DELINQUENT
          - state_machines.ComplianceCycle.DELINQUENT_to_ADMIN_SUSPENDED
          - state_machines.ComplianceCycle.ADMIN_SUSPENDED_to_REINSTATED
          - domain_constants.DELINQUENCY_TO_SUSPENSION_DAYS
          - domain_constants.REINSTATEMENT_FEE_CENTS
          - calculations.late_fee_assessment
        distinguishing_aspect: |
          ComplianceCycle carries two independent state dimensions on one row. Two sweeps drive
          administrative_status GOOD_STANDING -> DELINQUENT -> ADMIN_SUSPENDED and a board order then
          drives it to REINSTATED, while credit_status never leaves OPEN because no certification was
          ever filed — producing the combined state (OPEN, REINSTATED) that no single dimension's path
          can reach. Falsifiable: an implementation with one status column overwrites OPEN with
          DELINQUENT (or refuses the suspension because the cycle is not DEFICIENT), and the
          BOARD_ORDER reinstatement wrongly flips credit_status to SATISFIED.
        test_recipe:
          setup:
            - "One ACTIVE attorney admitted 2009-06-01 in compliance GROUP_1, so the cycle is not prorated and DEADLINE_OFFSET_DAYS is 31."
            - "One cycle 2024-01-01 -> 2026-01-01 with filing_deadline 2026-02-01 and NO credit records at all, so the FINAL deficiency is the whole 1800 minutes."
            - "Logical clock starts at its 2026-08-01T00:00:00Z default, which is already past the filing deadline."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-5005", full_name: "Anton Kowalczyk", admission_date: "2009-06-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep1: $.data.id, sweep1_fees: $.data.late_fees_assessed_cents }
            - call: "GET /cle/compliance-cycles/${cyc_id}"
              as: BoardAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep2: $.data.id }
            - call: "GET /cle/fee-assessments?attorney_id=${att_id}"
              as: BoardAdmin
              captures: { fee_late: "$.data.items[0].id", fee_reinstate: "$.data.items[1].id" }
            - call: "POST /cle/fee-assessments/${fee_late}/settlement"
              payload: { action: "PAY" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/fee-assessments/${fee_reinstate}/settlement"
              payload: { action: "PAY" }
              as: Attorney
              as_user_id: "${att_id}"
            - call: "POST /cle/attorneys/${att_id}/reinstatement"
              payload: { cycle_id: "${cyc_id}", cure_basis: "BOARD_ORDER", reason: "Hardship petition granted." }
              as: BoardAdmin
          assert:
            - "After sweep 1: ComplianceCycle.${cyc_id}.administrative_status == DELINQUENT, credit_status == OPEN (unchanged), delinquent_since == 2026-08-01T00:00:00Z"
            - "After sweep 1: exactly one FeeAssessment with fee_type == LATE_COMPLIANCE, status == ASSESSED, amount_cents == 100000 (30 deficient hours -> 60000 base + 20-hour-capped 50000 surcharge = 110000, clamped to LATE_FEE_CAP_CENTS)"
            - "ReportingSweep.${sweep1}.delinquencies_issued == 1, suspensions_issued == 0, late_fees_assessed_cents == 100000"
            - "Sweep 1 did NOT also suspend: 2026-08-01 is exactly delinquent_since, which is 60 days short of DELINQUENCY_TO_SUSPENSION_DAYS"
            - "After sweep 2 at 2026-09-30 (delinquent_since + 60 days exactly): administrative_status == ADMIN_SUSPENDED and credit_status is STILL OPEN"
            - "After sweep 2: Attorney.${att_id}.status == ADMIN_SUSPENDED and outstanding_fee_cents == 150000 (100000 + REINSTATEMENT_FEE_CENTS 50000)"
            - "ReportingSweep.${sweep2}.suspensions_issued == 1 and delinquencies_issued == 0"
            - "After both settlements: Attorney.${att_id}.outstanding_fee_cents == 0"
            - "After the BOARD_ORDER reinstatement: administrative_status == REINSTATED, credit_status == OPEN (a BOARD_ORDER cure never satisfies credits), delinquent_since == null, Attorney.status == ACTIVE"
            - "ComplianceCycle.${cyc_id}.certified_at is still null and earned_countable_minutes is still 0"

  - rule_id: transitive_cascade
    instances:

      - name: substantiated_course_complaint_unwinds_a_satisfied_cycle_and_the_successor_carryover
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.Course.APPROVED_to_REVOKED
          - state_machines.CreditRecord.VERIFIED_to_VOIDED
          - state_machines.ComplianceCycle.SATISFIED_to_OPEN
          - calculations.carryover_determination
          - entities.ComplianceCycle.fields.carryover_in_general_minutes
          - entities.Attorney.fields.pending_recertification_count
        distinguishing_aspect: |
          Cascade depth 5 from a single complaint disposition: Complaint -> SUBSTANTIATED (1) revokes
          the Course (2), which voids that course's VERIFIED CreditRecord (3), which re-runs the
          owning cycle's FINAL credit application and reverts it SATISFIED -> OPEN (4), which zeroes
          its carryover_out_* and therefore rewrites the SUCCESSOR cycle's carryover_in_* and
          re-derives the successor's figures (5). The trigger is an actor's complaint disposition and
          the terminal victim is a second ComplianceCycle that the complaint never named.
          Falsifiable: an implementation that stops at level 3 leaves cycle 1 SATISFIED; one that
          stops at level 4 leaves the successor holding 300 phantom carried-in minutes.
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider with two APPROVED LIVE_IN_PERSON courses verified by ATTENDANCE_CODE, whose session windows do not overlap so PROVIDER_CONCURRENT_LIVE_CAPACITY is never tested."
            - "L1 is 1200 minutes allocated ETHICS 180 / TECHNOLOGY 60 / BIAS_ELIMINATION 120 / GENERAL 840; L2 is 900 minutes of GENERAL."
            - "One ACTIVE attorney admitted 2009-04-01, compliance GROUP_2, with cycle 1 = 2024-01-01 -> 2026-01-01 (non-prorated: 1800 / 180 / 60 / 120)."
            - "Both records are VERIFIED at creation, cycle 1 is certified SATISFIED with 2100 earned live minutes, and cycle 2 = 2026-01-01 -> 2028-01-01 is then created with previous_cycle_id = cycle 1, inheriting 300 carried-in general minutes."
            - "The complaint is filed by board user 'board-intake-3' and disposed of by 'board-review-5' so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Lakeshore Trial Advocacy Institute", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Trial Advocacy Intensive", delivery_format: "LIVE_IN_PERSON", total_minutes: 1200, presented_at: "2024-03-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "ETHICS", minutes: 180 }, { category: "TECHNOLOGY", minutes: 60 }, { category: "BIAS_ELIMINATION", minutes: 120 }, { category: "GENERAL", minutes: 840 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { l1_id: $.data.id, l1_code: $.data.attendance_code }
            - call: "POST /cle/courses"
              payload: { title: "Deposition Skills Workshop", delivery_format: "LIVE_IN_PERSON", total_minutes: 900, presented_at: "2024-05-01T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 900 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
