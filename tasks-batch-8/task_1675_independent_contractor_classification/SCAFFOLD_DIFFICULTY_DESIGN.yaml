            - "2026-10-01 ACCEPTED (exactly 30 days from R1 — buffer boundary is inclusive-allowed)"

  - rule_id: compensating_invariant
    instances:
      - name: ci_lifetime_reported_submit_void_pair
        grounds:
          - calculations.contractor_lifetime_reported_reconciliation
          - state_machines.TaxForm1099Filing.ACCEPTED_to_VOID
          - entities.Contractor.fields.lifetime_reported_cents
        distinguishing_aspect: |
          Conserved quantity = monetary cents. The forward action (submit
          ORIGINAL, +60000) paired with its compensating action (correct VOID)
          MUST return Contractor.lifetime_reported_cents to its exact pre-submit
          value — the counted set {SUBMITTED, ACCEPTED} excludes VOID.
        test_recipe:
          setup:
            - "VERIFIED contractor with lifetime_reported_cents == 0; ORIGINAL filing with reportable 60000"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-CA", test_type: "ABC_TEST", state_filing_threshold_cents: 0, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_ca: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Invariant Money LLC", entity_type: "LLC", ein: "12-0001693", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /api/filings"
              payload: { contractor_id: "${con_id}", state_jurisdiction_id: "${jur_ca}", tax_year: 2026, payment_line_items: [ { amount_cents: 60000, payment_date: "2026-04-15", kind: "SERVICE_FEE" } ] }
              as: TaxReportingSpecialist
              captures: { fil_id: $.data.id }
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { life_before: $.data.lifetime_reported_cents }
          trigger:
            - call: "POST /api/filings/${fil_id}/submit"
              payload: {}
              as: TaxReportingSpecialist
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { life_mid: $.data.lifetime_reported_cents }
            - call: "POST /api/filings/${fil_id}/correct"
              payload: { mode: "VOID", reason: "Filed in error — wrong contractor" }
              as: TaxReportingSpecialist
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { life_after: $.data.lifetime_reported_cents }
          assert:
            - "before: lifetime_reported_cents == 0"
            - "after submit: lifetime_reported_cents == 60000 (SUBMITTED counted)"
            - "after VOID correction: lifetime_reported_cents == 0 exactly — zero drift from the submit+void pair"
      - name: ci_audit_open_action_count_create_close_pair
        grounds:
          - entities.RiskAudit.fields.open_action_count
          - state_machines.RemediationAction.OPEN_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity = child COUNT (distinct from monetary cents above).
          Creating a RemediationAction (+1) paired with closing it (-1) returns
          RiskAudit.open_action_count to its baseline, and the denormalized
          counter always equals the live count of child actions with status OPEN.
        test_recipe:
          setup:
            - "Contractor + CLASSIFIED engagement (COMMON_LAW); FIELDWORK audit finalized LOW (final 3.6) with open_action_count == 0"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-TX", test_type: "COMMON_LAW_WEIGHTED", employee_score_threshold: 0.60, state_filing_threshold_cents: 60000, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_tx: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Invariant Count LLC", entity_type: "LLC", ein: "12-0001694", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/engagements"
              payload: { contractor_id: "${con_id}", jurisdiction_id: "${jur_tx}", title: "Count invariant", scope_description: "Audit target", agreed_rate_cents: 10000, rate_unit: "HOURLY", start_date: "2026-02-01", end_date: "2026-12-31", supervision_level: "NONE" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /api/engagements/${eng_id}/questionnaire"
              payload: { answers: [ { factor_key: "CONTROL_METHOD", answer: "NO" }, { factor_key: "CONTROL_HOURS", answer: "NO" }, { factor_key: "OUTSIDE_USUAL_BUSINESS", answer: "YES" }, { factor_key: "INDEPENDENT_TRADE", answer: "YES" }, { factor_key: "PROFIT_LOSS", answer: "YES" }, { factor_key: "INVESTMENT", answer: "YES" }, { factor_key: "INTEGRAL_TO_BUSINESS", answer: "NO" }, { factor_key: "PERMANENCY", answer: "NO" } ] }
              as: EngagementManager
            - call: "GET /api/engagements/${eng_id}"
              as: PlatformAdmin
              captures: { eng_v: $.data.version }
            - call: "POST /api/engagements/${eng_id}/determinations"
              payload: { expected_engagement_version: "${eng_v}" }
              as: ClassificationAnalyst
            - call: "POST /api/audits"
              payload: { contractor_id: "${con_id}", engagement_id: "${eng_id}", audit_type: "FIELDWORK" }
              as: ComplianceOfficer
              captures: { audit_id: $.data.id, count0: $.data.open_action_count }
            - call: "POST /api/audits/${audit_id}/finalize"
              payload: { fieldwork_events: [], findings_summary: "One documentation gap" }
              as: ComplianceOfficer
              captures: { fin_level: $.data.risk_level }
          trigger:
            - call: "POST /api/audits/${audit_id}/remediation-actions"
              payload: { description: "Obtain signed W-9", severity: "LOW", due_date: "2026-09-01" }
              as: ComplianceOfficer
              captures: { act_id: $.data.id }
            - call: "GET /api/audits/${audit_id}"
              as: PlatformAdmin
              captures: { count1: $.data.open_action_count }
            - call: "POST /api/remediation-actions/${act_id}/close"
              payload: { outcome: "CLOSED" }
              as: ComplianceOfficer
            - call: "GET /api/audits/${audit_id}"
              as: PlatformAdmin
              captures: { count2: $.data.open_action_count }
            - call: "POST /api/audits/${audit_id}/close"
              payload: {}
              as: ComplianceOfficer
              captures: { audit_status: $.data.status }
          assert:
            - "baseline open_action_count == 0; after create == 1; after close == 0 — the create+close pair conserves the counter"
            - "finalized risk_level == LOW (0.3*12.0 + 0 = 3.6), so audit close from FINDINGS_FINALIZED is permitted once count == 0: status == CLOSED"
            - "open_action_count always equals the live count of child RemediationAction with status == OPEN"
