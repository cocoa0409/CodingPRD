          assert:
            - "${f1_pax} == 100 and ${f1_std} == 2 — cumulative capacity 90 does not cover 100, so the waterfall consumes a second lane"
            - "${unforecast_error} == ERR_BAND_NOT_FORECAST (422): band 10:30 has forecast_pax_count null, and this is reported even though band 10:00 is ALSO under-staffed"
            - "${f2_pax} == 0 for band 10:30 (no flight feeds it) with required_standard_lanes == 1 from the MIN_OPEN_LANES.STANDARD floor, which the single lane-2 assignment satisfies"
            - "${coverage_error} == ERR_MIN_LANES_NOT_MET (422) — with both bands now forecast, band 10:00 is staffed on 1 distinct lane against required_standard_lanes 2"
            - "${v_state} == SUBMITTED once band 10:00 is staffed on two distinct lanes"
            - "${v_sub} == 9750 (officer 1: 45 regular x 100 + round_half_up(15 x 100 x 1.5) == 4500 + 2250; officer 2: 30 x 100 == 3000) and ${v_total} == 10189 with admin_fee_rate \"0.045\""

      - name: plan_cost_cap_is_breached_only_strictly_above_the_cap
        claim_type: conditional_validation
        grounds:
          - validations[priority 30]
          - errors[ERR_PLAN_COST_CAP_EXCEEDED]
        distinguishing_aspect: "The cap lives on the Checkpoint, not the plan, so lowering it after the assignments exist retroactively blocks the submit. The comparison is total > cap: a total exactly equal to the cap must pass, which is the classic off-by-one."
        test_recipe:
          setup: ["a DRAFT plan whose single assignment already costs 3180 cents in total"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - call: "GET /staffing-plans/${plan_id}/cost-summary"
              payload: {}
              as: StaffingPlanner
              captures: { cap_total_pre: $.data.total_cost_cents }
          trigger:
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { plan_cost_cap_cents: 3179 }
              as: PlatformAdmin
              captures: { cap_low: $.data.plan_cost_cap_cents }
            - call: "POST /staffing-plans/${plan_id}/submit"
              payload: {}
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { cap_error: $.data.error_id }
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { plan_cost_cap_cents: 3180 }
              as: PlatformAdmin
              captures: { cap_exact: $.data.plan_cost_cap_cents }
            - call: "POST /staffing-plans/${plan_id}/submit"
              payload: {}
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { cap_state: $.data.state, cap_total_post: $.data.total_cost_cents }
          assert:
            - "${cap_total_pre} == 3180 — the cost is computed on assignment create, while the plan is still DRAFT"
            - "${cap_low} == 3179 and ${cap_error} == ERR_PLAN_COST_CAP_EXCEEDED (422)"
            - "the plan is still DRAFT after the rejected submit and submitted_at_utc is still null"
            - "${cap_exact} == 3180 and ${cap_state} == SUBMITTED with ${cap_total_post} == 3180 — equality passes because the rule fires only on total > cap"
            - "only PlatformAdmin could make those PATCH calls: plan_cost_cap_cents is the PlatformAdmin-only field of priority 6"

      - name: overtime_cap_blocks_the_assignment_that_would_cross_it
        claim_type: violation_to_error
        grounds:
          - validations[priority 29]
          - errors[ERR_OVERTIME_CAP_EXCEEDED]
          - calculations.officer_duty_ledger
        distinguishing_aspect: "The check is prospective and uses the FORWARD_LOOKING_PLANNED variant, so it must add the row being created before comparing. With a 30-minute regular cap and a zero overtime cap the first band fits exactly and the second is refused — and the refusal must leave committed_duty_minutes untouched."
        test_recipe:
          setup: ["an officer with weekly_regular_minutes_cap 30 and weekly_overtime_minutes_cap 0"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_curve
            - *c_band1000
            - *c_band1030
            - *c_flight1030
            - *c_forecast1
            - call: "POST /officers"
              payload: { badge_number: "B-5001", full_name: "Ola Cap", certifications: ["STANDARD_LANE", "ADVANCED_IMAGING"], base_rate_cents_per_minute: 100, weekly_regular_minutes_cap: 30, weekly_overtime_minutes_cap: 0 }
              as: PlatformAdmin
              captures: { cap_off_id: $.data.id }
            - *c_cpver
            - *c_plan
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${cap_off_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { ot_a1: $.data.id }
            - call: "GET /officers/${cap_off_id}/duty-ledger"
              payload: { variant: "FORWARD_LOOKING_PLANNED" }
              as: StaffingPlanner
              captures: { ot_reg: $.data.regular_minutes, ot_ot: $.data.overtime_minutes, ot_head: $.data.cap_headroom_minutes }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${cap_off_id}", time_band_id: "${band2_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { ot_error: $.data.error_id }
            - call: "GET /officers/${cap_off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { ot_committed: $.data.committed_duty_minutes }
          assert:
            - "the first assignment succeeds: ${ot_reg} == 30, ${ot_ot} == 0 and ${ot_head} == 0 — sitting exactly ON the caps is legal"
            - "${ot_error} == ERR_OVERTIME_CAP_EXCEEDED (422) — the second band would make total 60, overtime 30 and cap_headroom -30"
            - "${ot_committed} == 30 — the rejected create did not credit the ledger"
            - "the failure is priority 29 and not priority 23: two adjacent 30-minute bands are a 60-minute run, which is not STRICTLY more than MAX_CONSECUTIVE_ON_POSITION_MINUTES"
            - "GET /lane-assignments?officer_id=${cap_off_id} returns exactly one row"

      - name: uniqueness_rules_reject_duplicate_position_band_start_and_badge
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_LANE_POSITION]
          - errors[ERR_DUPLICATE_TIME_BAND]
          - errors[ERR_DUPLICATE_BADGE_NUMBER]
        distinguishing_aspect: "Three different uniqueness scopes in one probe: position_index is unique per checkpoint among non-decommissioned lanes, band_start_utc is unique per checkpoint, badge_number is globally unique. The fixture proves the first two are scoped per checkpoint by re-using both values successfully on a second checkpoint."
        test_recipe:
          setup: ["two checkpoints, one lane at position 1 and one 10:00 band on the first, one officer"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_band1000
            - *c_officer
            - *c_cp2
          trigger:
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "EXPEDITED", position_index: 1, required_officer_count: 1, max_concurrent_officers: 1, secondary_positions: 0 }
              as: CheckpointManager
              expect_status: 409
              captures: { dup_pos_error: $.data.error_id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 50, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              expect_status: 409
              captures: { dup_band_error: $.data.error_id }
            - call: "POST /officers"
              payload: { badge_number: "B-1001", full_name: "Ada Clone", certifications: ["STANDARD_LANE"], base_rate_cents_per_minute: 100, weekly_regular_minutes_cap: 45, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              expect_status: 409
              captures: { dup_badge_error: $.data.error_id }
            - call: "POST /lanes"
              payload: { checkpoint_id: "${cp2_id}", lane_type: "STANDARD", position_index: 1, required_officer_count: 1, max_concurrent_officers: 1, secondary_positions: 0 }
              as: CheckpointManager
              captures: { scoped_lane_id: $.data.id, scoped_pos: $.data.position_index }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp2_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { scoped_band_id: $.data.id }
          assert:
            - "${dup_pos_error} == ERR_DUPLICATE_LANE_POSITION (409) even though the lane_type differs — the scope is (checkpoint_id, position_index)"
            - "${dup_band_error} == ERR_DUPLICATE_TIME_BAND (409) even though expedited_share_pct differs"
            - "${dup_badge_error} == ERR_DUPLICATE_BADGE_NUMBER (409) — badge_number is global, not per checkpoint"
            - "${scoped_pos} == 1 and ${scoped_band_id} is created — both uniqueness rules are per checkpoint, so T2 may reuse position 1 and the 10:00 start"
            - "GET /lanes?checkpoint_id=${cp_id} still returns exactly one row"

      - name: show_up_curve_buckets_must_tile_the_window_and_sum_to_one_hundred
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CURVE_BUCKETS_INVALID]
          - endpoints.POST_show-up-curves
        distinguishing_aspect: "Three independent ways to be invalid — a gap in the tiling, an overlap, and shares that sum to 99 — must all produce the same 422, and a two-bucket curve that tiles exactly and sums to exactly 100 must be accepted. Without this the forecast's per-bucket weighting has no well-defined denominator."
        test_recipe:
          setup: ["empty database apart from the logical clock"]
          setup_api_calls:
            - *c_clock08
          trigger:
            - call: "POST /show-up-curves"
              payload:
                name: "Gapped"
                carrier_type: "DOMESTIC"
                season_code: "PEAK"
                window_start_minutes_before: 60
                window_end_minutes_before: 0
                buckets:
                  - { minutes_before_start: 60, minutes_before_end: 45, share_pct: 50 }
                  - { minutes_before_start: 30, minutes_before_end: 0, share_pct: 50 }
              as: PlatformAdmin
              expect_status: 422
              captures: { gap_error: $.data.error_id }
            - call: "POST /show-up-curves"
              payload:
                name: "Overlapping"
                carrier_type: "DOMESTIC"
                season_code: "PEAK"
                window_start_minutes_before: 60
                window_end_minutes_before: 0
                buckets:
                  - { minutes_before_start: 60, minutes_before_end: 20, share_pct: 50 }
                  - { minutes_before_start: 30, minutes_before_end: 0, share_pct: 50 }
              as: PlatformAdmin
              expect_status: 422
              captures: { overlap_error: $.data.error_id }
            - call: "POST /show-up-curves"
              payload:
                name: "Short shares"
                carrier_type: "DOMESTIC"
                season_code: "PEAK"
                window_start_minutes_before: 60
                window_end_minutes_before: 0
                buckets:
                  - { minutes_before_start: 60, minutes_before_end: 30, share_pct: 49 }
                  - { minutes_before_start: 30, minutes_before_end: 0, share_pct: 50 }
              as: PlatformAdmin
              expect_status: 422
              captures: { sum_error: $.data.error_id }
            - call: "POST /show-up-curves"
              payload:
                name: "Valid two bucket"
                carrier_type: "INTERNATIONAL"
                season_code: "PEAK"
                window_start_minutes_before: 60
                window_end_minutes_before: 0
                buckets:
                  - { minutes_before_start: 60, minutes_before_end: 30, share_pct: 40 }
                  - { minutes_before_start: 30, minutes_before_end: 0, share_pct: 60 }
              as: PlatformAdmin
              captures: { valid_curve_id: $.data.id, valid_curve_name: $.data.name }
          assert:
            - "${gap_error} == ERR_CURVE_BUCKETS_INVALID (422) — minutes 45..30 before departure are uncovered"
            - "${overlap_error} == ERR_CURVE_BUCKETS_INVALID (422) — 30..20 is covered twice"
            - "${sum_error} == ERR_CURVE_BUCKETS_INVALID (422) — 49 + 50 == 99, and the rule demands exactly 100"
            - "${valid_curve_id} is created with ${valid_curve_name} == \"Valid two bucket\": adjacent buckets meeting at 30 are a tiling, not an overlap"
            - "GET /show-up-curves/${valid_curve_id} returns the two buckets in the order supplied"

      - name: suspended_checkpoint_blocks_operational_writes_but_not_reads_or_patch
        claim_type: violation_to_error
        grounds:
