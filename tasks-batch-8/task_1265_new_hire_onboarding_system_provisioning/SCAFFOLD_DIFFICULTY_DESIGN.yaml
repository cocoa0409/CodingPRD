  # ================================================================ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: session_room_overlap_half_open_adjacency
        grounds:
          - errors[ERR_SESSION_ROOM_OVERLAP]
          - entities.OrientationSession.fields.room
        distinguishing_aspect: |
          OrientationSession resource with HALF-OPEN interval semantics [starts_at, ends_at): a session
          starting exactly when another ends (12:00 == 12:00) is legal adjacency, while a strict interior
          overlap (11:00-13:00 vs 09:00-12:00) is rejected; same window in a different room is legal.
        test_recipe:
          setup: ["Session s1 room R1 2026-05-04T09:00:00Z-12:00:00Z and session s2 room R1 2026-05-04T12:00:00Z-15:00:00Z both exist"]
          setup_api_calls:
            - { call: "POST /api/orientation-sessions", as: HRAdmin, captures: { s1: "$.data.id", s1_st: "$.data.status" }, payload: { room: "R1", starts_at: "2026-05-04T09:00:00Z", ends_at: "2026-05-04T12:00:00Z", capacity: 10 } }
            - { call: "POST /api/orientation-sessions", as: HRAdmin, captures: { s2: "$.data.id", s2_st: "$.data.status" }, payload: { room: "R1", starts_at: "2026-05-04T12:00:00Z", ends_at: "2026-05-04T15:00:00Z", capacity: 10 } }
          trigger:
            - { call: "POST /api/orientation-sessions", as: HRAdmin, captures: { err: "$.data.error_id" }, payload: { room: "R1", starts_at: "2026-05-04T11:00:00Z", ends_at: "2026-05-04T13:00:00Z", capacity: 10 } }
            - { call: "POST /api/orientation-sessions", as: HRAdmin, captures: { s4: "$.data.id" }, payload: { room: "R2", starts_at: "2026-05-04T11:00:00Z", ends_at: "2026-05-04T13:00:00Z", capacity: 10 } }
          assert:
            - "s2 was created with 201 (adjacent session starting exactly at s1.ends_at is legal under half-open [start, end) semantics)"
            - "Overlapping 11:00-13:00 create in room R1 fails with error_id == ERR_SESSION_ROOM_OVERLAP"
            - "Identical 11:00-13:00 window in room R2 succeeds (overlap is per-room)"

      - name: checkin_buffer_thirty_minutes_semantics
        grounds:
          - state_machines.CheckIn.SCHEDULED_to_SCHEDULED
          - errors[ERR_CHECKIN_TOO_CLOSE]
        distinguishing_aspect: |
          CheckIn resource with BUFFER semantics per owner_employee_id — different interval semantics than
          the half-open session rule: two check-ins of the same owner must be >= 30 minutes apart, so
          15 minutes is rejected but exactly 30 minutes is accepted (inclusive minimum, not adjacency).
        test_recipe:
          setup: ["Case PRE_BOARDING; manager owns c_m1 SCHEDULED 2026-05-05T09:00:00Z and c_m2 SCHEDULED 2026-06-03T09:00:00Z; clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/role-profiles", as: HRAdmin, captures: { p_id: "$.data.id" }, payload: { name: "SE", preboarding_tasks: [{task_kind: "DOCUMENT_UPLOAD", title: "Government ID", is_required: true}, {task_kind: "FORM_ACK", title: "NDA", is_required: true}, {task_kind: "POLICY_READ", title: "Handbook", is_required: false}], training_modules: [{module_code: "SEC101", due_offset_days: 7}, {module_code: "HR201", due_offset_days: 14}], equipment_items: [{item_name: "Laptop", quantity: 1}], access_grants: [{system_name: "VPN", permission_level: "STANDARD"}], probation_days: 90, max_probation_extensions: 1, extension_days: 30, buddy_checkin_interval_days: 7, buddy_checkin_count: 2, manager_checkin_offsets_days: [1, 30], provisioning_sla_hours: 48 } }
            - { call: "POST /api/role-profiles/${p_id}/publish", as: HRAdmin }
            - { call: "POST /api/employees", as: HRAdmin, captures: { mgr_id: "$.data.id" }, payload: { full_name: "Mgr Fifteen", email: "mgr-r8b@x.com" } }
            - { call: "POST /api/employees", as: HRAdmin, captures: { bud_id: "$.data.id" }, payload: { full_name: "Bud Fifteen", email: "bud-r8b@x.com", manager_id: "${mgr_id}" } }
            - { call: "POST /api/new-hires", as: HRAdmin, captures: { nh_id: "$.data.id" }, payload: { full_name: "New Hire", personal_email: "nh-r8b@x.com", start_date: "2026-05-04", department: "Engineering" } }
            - { call: "POST /api/onboarding-cases", as: HRAdmin, captures: { case_id: "$.data.id" }, payload: { new_hire_id: "${nh_id}", role_profile_id: "${p_id}", manager_id: "${mgr_id}", buddy_id: "${bud_id}", start_date: "2026-05-04", base_salary_cents: 90000, signing_bonus_cents: 10000, relocation_stipend_cents: 2500, benefits_tier: "PLUS" } }
            - { call: "GET /api/onboarding-cases/${case_id}/check-ins", as: HRAdmin, captures: { c_m1: "$.data[0].id", c_m2: "$.data[1].id" } }
          trigger:
            - { call: "POST /api/check-ins/${c_m2}/reschedule", as: HRAdmin, captures: { err: "$.data.error_id" }, payload: { scheduled_at: "2026-05-05T09:15:00Z" } }
            - { call: "POST /api/check-ins/${c_m2}/reschedule", as: HRAdmin, captures: { st: "$.data.status", sa: "$.data.scheduled_at" }, payload: { scheduled_at: "2026-05-05T09:30:00Z" } }
          assert:
            - "Reschedule to 2026-05-05T09:15:00Z fails with error_id == ERR_CHECKIN_TOO_CLOSE (15 minutes < 30-minute buffer vs c_m1 at 09:00:00Z)"
            - "Reschedule to 2026-05-05T09:30:00Z succeeds (exactly 30 minutes satisfies >= buffer) and scheduled_at == 2026-05-05T09:30:00Z, status == SCHEDULED"

