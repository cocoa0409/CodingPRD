# §1.9 Scaffold Corner Design — coverage index for non-difficulty claims.
# Breadth probe: every testable §1.1–§1.7 claim not already covered by §1.8.
# Names are unique across the union of this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: customer_create_missing_email_rejected
        claim_type: required_fields
        grounds: [entities.Customer.fields.email, "errors[ERR_VALIDATION]", "validations[priority=3]"]
        distinguishing_aspect: "email is a required input with no default; omitting it yields 400 ERR_VALIDATION before any persistence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /golf-shop/customers"
              payload: { full_name: "No Email" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_VALIDATION"
            - "no Customer row is created"

      - name: bay_cleanup_buffer_default_applied
        claim_type: defaults
        grounds: [entities.LaunchMonitorBay.fields.cleanup_buffer_minutes]
        distinguishing_aspect: "cleanup_buffer_minutes is optional input with default 15; an omitted value must materialize as 15."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay D" }
              as: ShopAdmin
              captures: { bay_buf: $.data.cleanup_buffer_minutes, bay_status: $.data.status }
          assert:
            - "LaunchMonitorBay.cleanup_buffer_minutes == 15 (default applied)"
            - "LaunchMonitorBay.status == AVAILABLE (initial state)"

      - name: repair_ticket_rush_default_false
        claim_type: defaults
        grounds: [entities.RepairTicket.fields.rush, calculations.repair_quote]
        distinguishing_aspect: "omitting rush defaults to false: REGRIP quote is the bare base 1800 with a +72h promise, no rush fee."
        test_recipe:
          setup: ["customer C exists"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Tom Tao", email: "tom@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /golf-shop/repair-tickets"
              payload: { customer_id: "${c_id}", club_description: "7-iron", service_type: "REGRIP" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { t_id: $.data.id }
          assert:
            - "RepairTicket.${t_id}.rush == false"
            - "RepairTicket.${t_id}.quoted_total_cents == 1800 (no rush fee)"
            - "RepairTicket.${t_id}.promised_at == 2026-05-13T09:00:00Z (+72h standard)"

      - name: customer_create_computed_credit_input_ignored
        claim_type: computed_fields
        grounds: [entities.Customer.fields.credit_balance_cents, calculations.customer_credit_balance]
        distinguishing_aspect: "credit_balance_cents is computed from the ledger; a client-supplied value in the create body is ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Uma Ulm", email: "uma@example.com", credit_balance_cents: 9999 }
              as: ShopAdmin
              captures: { bal: $.data.credit_balance_cents }
          assert:
            - "response Customer.credit_balance_cents == 0 (input 9999 ignored; only ledger writes move the balance)"

      - name: get_nonexistent_spec_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_SPEC_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "a well-formed but unknown spec id yields 404 ERR_SPEC_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /golf-shop/build-specs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 with error_id == ERR_SPEC_NOT_FOUND"

      - name: fitting_session_list_pagination_filters
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "list endpoint honors customer_id filter plus limit/offset pagination with total_count and has_more."
        test_recipe:
          setup:
            - "customer C; specialist FS; one bay; three non-overlapping BOOKED sessions for C (10:00-11:00, 11:15-12:15, 12:30-13:30)"
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Val Vale", email: "val@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T11:15:00Z", ends_at: "2026-05-10T12:15:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T12:30:00Z", ends_at: "2026-05-10T13:30:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          trigger:
            - call: "GET /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", limit: 1, offset: 0 }
              as: ShopManager
            - call: "GET /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", limit: 1, offset: 2 }
              as: ShopManager
              captures: { third_id: "$$.data[0].id" }
          assert:
            - "page 1: total_count == 3, has_more == true, exactly 1 row returned"
            - "page 3 (offset 2): has_more == false, exactly 1 row returned, and it is a different session than page 1's"

      - name: credit_ledger_entries_immutable
        claim_type: immutability
        grounds: [entities.CreditLedgerEntry]
        distinguishing_aspect: "CreditLedgerEntry has common_fields false: entries expose id and created_at but no version/updated_at, and no mutation endpoint exists."
        test_recipe:
          setup: ["customer C with one accepted appraisal granting credit"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Wes Wold", email: "wes@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/trade-in-appraisals"
              payload: { customer_id: "${c_id}", clubs: [ { club_type: "PUTTER", condition_grade: "A" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { appr_id: $.data.id, appr_v: $.data.version }
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/offers"
              payload: { basis: "GRADE_MATRIX", expected_appraisal_version: "${appr_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
            - call: "POST /golf-shop/trade-in-appraisals/${appr_id}/accept"
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "GET /golf-shop/customers/${c_id}/credit-ledger-entries"
              as: ShopManager
              captures: { amt: "$$.data[0].amount_cents", rsn: "$$.data[0].reason" }
          assert:
            - "exactly 1 entry with amount_cents == 8999 (round(14999*0.60)) and reason == TRADE_IN_ACCEPT"
            - "entry has id and created_at but no version and no updated_at fields"
            - "no POST/PUT/PATCH/DELETE endpoint exists under /golf-shop/customers/{id}/credit-ledger-entries (append-only by design)"

  # =====================================================================
  - section: state_machines
    instances:
      - name: fitting_session_initial_state_booked
        claim_type: initial_state
        grounds: [state_machines.FittingSession]
        distinguishing_aspect: "a newly created session is BOOKED with credit_consumed false and no version bumps beyond creation."
        test_recipe:
          setup: ["customer C, specialist FS, bay B"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Xu Xen", email: "xu@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
          trigger:
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "status == BOOKED, version == 1, credit_consumed == false, credit_refunded == false"

      - name: session_complete_from_booked_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FittingSession.CHECKED_IN_to_COMPLETED, "errors[ERR_SESSION_NOT_CHECKED_IN]"]
        distinguishing_aspect: "complete requires CHECKED_IN; from BOOKED it fails with ERR_SESSION_NOT_CHECKED_IN and no state change."
        test_recipe:
          setup: ["BOOKED session (same base chain as fitting_session_initial_state_booked)"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Yan Yew", email: "yan@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/complete"
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with error_id == ERR_SESSION_NOT_CHECKED_IN"
            - "FittingSession.${sess_id}.status remains BOOKED"

      - name: session_checkin_after_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FittingSession, "errors[ERR_SESSION_NOT_BOOKED]"]
        distinguishing_aspect: "CANCELLED is terminal; check-in afterwards fails with ERR_SESSION_NOT_BOOKED."
        test_recipe:
          setup: ["session BOOKED then cancelled"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Zoe Zest", email: "zoe@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/cancel"
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /golf-shop/fitting-sessions/${sess_id}/check-in"
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with error_id == ERR_SESSION_NOT_BOOKED"
            - "FittingSession.${sess_id}.status remains CANCELLED"

      - name: spec_cancel_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ClubBuildSpec, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "cancelling an already CANCELLED spec is an undefined transition from a terminal state: ERR_INVALID_STATE_TRANSITION, no further side effects."
        test_recipe:
          setup: ["DRAFT spec cancelled once"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Amy Ash", email: "amy@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "HD-C", component_type: "HEAD", unit_cost_cents: 40000, msrp_cents: 55000, initial_stock: 5 }
              as: ShopAdmin
              captures: { head_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "SH-C", component_type: "SHAFT", unit_cost_cents: 12000, msrp_cents: 18000, initial_stock: 5 }
              as: ShopAdmin
              captures: { shaft_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "GR-C", component_type: "GRIP", unit_cost_cents: 800, msrp_cents: 1500, initial_stock: 5 }
              as: ShopAdmin
              captures: { grip_id: $.data.id }
            - call: "POST /golf-shop/build-specs"
              payload: { customer_id: "${c_id}", fitting_session_id: "${sess_id}", head_item_id: "${head_id}", shaft_item_id: "${shaft_id}", grip_item_id: "${grip_id}", length_inches: 45.5, loft_deg: 10.5, lie_deg: 58, labor_cents: 15000 }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /golf-shop/build-specs/${spec_id}/cancel"
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /golf-shop/build-specs/${spec_id}/cancel"
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second cancel is 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "ClubBuildSpec.${spec_id}.status remains CANCELLED"

      - name: mark_ready_before_build_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ClubBuildSpec.IN_BUILD_to_READY, "errors[ERR_SPEC_NOT_IN_BUILD]"]
        distinguishing_aspect: "mark-ready on a QUOTED spec fails with ERR_SPEC_NOT_IN_BUILD."
        test_recipe:
          setup: ["spec in QUOTED (components in stock)"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Ben Birch", email: "ben@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Tina Tech", staff_role: "REPAIR_TECHNICIAN" }
              as: ShopAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "HD-M", component_type: "HEAD", unit_cost_cents: 40000, msrp_cents: 55000, initial_stock: 5 }
              as: ShopAdmin
              captures: { head_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "SH-M", component_type: "SHAFT", unit_cost_cents: 12000, msrp_cents: 18000, initial_stock: 5 }
              as: ShopAdmin
              captures: { shaft_id: $.data.id }
            - call: "POST /golf-shop/component-items"
              payload: { sku: "GR-M", component_type: "GRIP", unit_cost_cents: 800, msrp_cents: 1500, initial_stock: 5 }
              as: ShopAdmin
              captures: { grip_id: $.data.id }
            - call: "POST /golf-shop/build-specs"
              payload: { customer_id: "${c_id}", fitting_session_id: "${sess_id}", head_item_id: "${head_id}", shaft_item_id: "${shaft_id}", grip_item_id: "${grip_id}", length_inches: 45.5, loft_deg: 10.5, lie_deg: 58, labor_cents: 15000 }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { spec_id: $.data.id, spec_v: $.data.version }
            - call: "POST /golf-shop/build-specs/${spec_id}/quote"
              payload: { expected_build_spec_version: "${spec_v}" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
          trigger:
            - call: "POST /golf-shop/build-specs/${spec_id}/mark-ready"
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with error_id == ERR_SPEC_NOT_IN_BUILD"
            - "ClubBuildSpec.${spec_id}.status remains QUOTED"

      - name: no_show_sweep_via_clock
        claim_type: valid_transition
        grounds: [state_machines.FittingSession.BOOKED_to_NO_SHOW]
        distinguishing_aspect: "advancing the logical clock past ends_at auto-transitions a BOOKED session to NO_SHOW without any session endpoint call."
        test_recipe:
          setup: ["BOOKED session 10:00-11:00 on 2026-05-10"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Cy Cedar", email: "cy@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Fred Fitter", staff_role: "FITTING_SPECIALIST" }
              as: ShopAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /golf-shop/launch-monitor-bays"
              payload: { bay_name: "Bay 1" }
              as: ShopAdmin
              captures: { bay_id: $.data.id }
            - call: "POST /golf-shop/fitting-sessions"
              payload: { customer_id: "${c_id}", bay_id: "${bay_id}", specialist_id: "${fs_id}", starts_at: "2026-05-10T10:00:00Z", ends_at: "2026-05-10T11:00:00Z" }
              as: FittingSpecialist
              as_user_id: "${fs_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T12:00:00Z" }
              as: ShopAdmin
          assert:
            - "FittingSession.${sess_id}.status == NO_SHOW after the sweep"
            - "CHECKED_IN and COMPLETED sessions are never swept to NO_SHOW (only BOOKED)"

      - name: offer_expiry_sweep_via_clock
        claim_type: valid_transition
        grounds: [state_machines.TradeInAppraisal.OFFERED_to_EXPIRED, "errors[ERR_APPRAISAL_NOT_OFFERED]"]
        distinguishing_aspect: "advancing the clock past offer_expires_at (offer + 168h) flips OFFERED to EXPIRED; a later accept then fails with ERR_APPRAISAL_NOT_OFFERED."
        test_recipe:
          setup: ["appraisal OFFERED at 2026-05-10T09:00:00Z (expires 2026-05-17T09:00:00Z)"]
          setup_api_calls:
            - call: "POST /golf-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: ShopAdmin
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Dee Dawn", email: "dee@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
