            - "response HTTP status == 409"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: supervising_officer_cannot_adjudicate_violation
        claim_type: exclusive_operation_denied
        grounds: [roles.SupervisingOfficer, roles.JudicialOfficer]
        distinguishing_aspect: "A SupervisingOfficer calling POST /violations/{id}/transition (JudicialOfficer-only) is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A violation in REPORTED."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-RB1", full_name: "Rb One", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /violations"
              payload: { defendant_id: "${def_id}", violation_type: "OTHER", severity: "MINOR" }
              as: SupervisingOfficer
              as_user_id: "u_sup"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /violations/${v_id}/transition"
              payload: { to_status: "UNDER_REVIEW" }
              as: SupervisingOfficer
              as_user_id: "u_sup"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "response HTTP status == 403"

      - name: defendant_role_cannot_create_assessment
        claim_type: exclusive_operation_denied
        grounds: [roles.Defendant, roles.IntakeOfficer]
        distinguishing_aspect: "The Defendant role calling POST /assessments (IntakeOfficer-only) is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One defendant exists (acts as the Defendant role)."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-RB2", full_name: "Rb Two", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { defendant_id: "${def_id}", instrument_type: "FULL", prior_failures: 0, pending_charges_count: 0, employment_status: "EMPLOYED", residence_stability: "STABLE" }
              as: Defendant
              as_user_id: "${def_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"
            - "response HTTP status == 403"

      - name: unauthenticated_unknown_role_rejected
        claim_type: exclusive_operation_denied
        grounds: [roles.IntakeOfficer]
        distinguishing_aspect: "A request bearing an unknown role is rejected with ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /defendants"
              payload: { case_number: "C-RB3", full_name: "Rb Three", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "response HTTP status == 401"

  # =========================================================================
  # Section: cross_cutting_complexity_layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: level_adjustment_success_increments_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[level-adjustment-stale-defendant]", entities.Defendant.fields.version]
        distinguishing_aspect: "A manual level adjustment with the correct expected_defendant_version succeeds (201), sets supervision_level, and increments Defendant.version to 2."
        test_recipe:
          setup: ["A fresh defendant (version 1)."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-OCC1", full_name: "Oc One", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id, def_v: $.data.version }
          trigger:
            - call: "POST /defendants/${def_id}/level-adjustments"
              payload: { expected_defendant_version: "${def_v}", to_level: "MEDIUM", reason: "manual" }
              as: SupervisingOfficer
              as_user_id: "u_sup"
              captures: { adj_id: $.data.id }
            - call: "GET /defendants/${def_id}"
              payload: {}
              as: SupervisingOfficer
              captures: { new_level: $.data.supervision_level, new_v: $.data.version }
          assert:
            - "Defendant.${def_id}.supervision_level == MEDIUM"
            - "Defendant.${def_id}.version == 2"

      - name: level_adjustment_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[level-adjustment-stale-defendant]"]
        distinguishing_aspect: "A second level adjustment still carrying the pre-adjustment expected_defendant_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A defendant whose version was advanced by one successful adjustment."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-OCC2", full_name: "Oc Two", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id, def_v: $.data.version }
            - call: "POST /defendants/${def_id}/level-adjustments"
              payload: { expected_defendant_version: "${def_v}", to_level: "MEDIUM" }
              as: SupervisingOfficer
              as_user_id: "u_sup"
          trigger:
            - call: "POST /defendants/${def_id}/level-adjustments"
              payload: { expected_defendant_version: "${def_v}", to_level: "MAXIMUM" }
              as: SupervisingOfficer
              as_user_id: "u_sup"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response HTTP status == 412"

      - name: curfew_window_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[curfew-window-stale-enrollment]"]
        distinguishing_aspect: "Adding a (non-overlapping) curfew window with a stale expected_enrollment_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An enrollment whose version advanced from adding one curfew window."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { case_number: "C-OCC3", full_name: "Oc Three", date_of_birth: "1990-01-01" }
              as: IntakeOfficer
              captures: { def_id: $.data.id }
            - call: "POST /em-devices"
              payload: { model_name: "GT-OCC", total_units: 1 }
              as: ProgramAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /em-enrollments"
              payload: { defendant_id: "${def_id}", device_id: "${dev_id}" }
              as: SupervisingOfficer
              captures: { enr_id: $.data.id, enr_v0: $.data.version }
            - call: "POST /em-enrollments/${enr_id}/curfew-windows"
              payload: { expected_enrollment_version: "${enr_v0}", day_of_week: 0, start_minute: 1200, end_minute: 1320 }
              as: SupervisingOfficer
          trigger:
            - call: "POST /em-enrollments/${enr_id}/curfew-windows"
              payload: { expected_enrollment_version: "${enr_v0}", day_of_week: 1, start_minute: 600, end_minute: 700 }
              as: SupervisingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response HTTP status == 412"

