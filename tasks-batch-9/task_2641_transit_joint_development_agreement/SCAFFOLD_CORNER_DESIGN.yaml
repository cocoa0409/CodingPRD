  - section: state_machines
    instances:
      - name: corner_assessment_draft_to_certified_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.ReadinessAssessment.DRAFT_to_CERTIFIED
          - calculations.readiness_composite_score
          - endpoints[POST /jda/assessments/{id}/certify]
        distinguishing_aspect: |
          Certifying a DRAFT assessment moves it to CERTIFIED and swaps the PRELIMINARY 71.25 for the
          weighted CERTIFIED 70.00 (73.25 weighted - 3.00 encumbrance - 0.25 federal), stamps certified_at
          with the logical clock and writes tier READY onto both the assessment and the site.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "FEDERAL_GRANT AgencySite with federal_interest_pct 2.5 at ASSESSED carrying one DRAFT assessment (80/75/70/60, encumbrance_count 1)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-C-012", name: "Dogwood Transit Parcel", address_line: "12 Dogwood Way", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id, prelim: $.data.composite_score }
          trigger:
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
              captures: { st: $.data.status, score: $.data.composite_score, variant: $.data.variant_applied, tier: $.data.tier, cert_at: $.data.certified_at }
          assert:
            - "${prelim} == 71.25"
            - "HTTP status == 200"
            - "${st} == CERTIFIED"
            - "${score} == 70.00"
            - "${variant} == CERTIFIED"
            - "${tier} == READY"
            - "${cert_at} == 2026-08-01T00:00:00Z"
            - "AgencySite.${site_a}.readiness_composite_score == 70.00"
            - "AgencySite.${site_a}.readiness_tier == READY"
            - "AgencySite.${site_a}.status == ASSESSED"

