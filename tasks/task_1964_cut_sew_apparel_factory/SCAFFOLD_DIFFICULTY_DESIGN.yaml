          assert:
            - "TechPack.${tpA}.status == SUPERSEDED (terminal) after sibling approval"
            - "TechPack.${tpB}.status == APPROVED"
            - "Style.${st}.active_tech_pack_id == ${tpB}"
            - "pack v1 traversed DRAFT->PENDING_APPROVAL->REJECTED->DRAFT->PENDING_APPROVAL->APPROVED->SUPERSEDED"

