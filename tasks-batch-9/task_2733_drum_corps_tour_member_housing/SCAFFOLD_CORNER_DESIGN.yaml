            - "HostSchool.${school_id}.reserved_bed_nights == 0 and Season.${season_id}.housing_cost_cents == 0 — the cancelled agreement is dropped from the SIGNED-only sum"

      - name: season_ledger_reconciles_only_when_every_stop_and_settlement_is_closed
        claim_type: ledger_sync_side_effect
        grounds:
          - entities.Season.fields.ledger_status
          - entities.Season.fields.tour_revenue_cents
          - state_machines.ShowSettlement.DRAFT_to_FINALIZED.side_effects
          - endpoints.POST_/seasons/{season_id}/run-billing-cycle
        distinguishing_aspect: "ledger_status is re-derived ONLY by a run-billing-cycle sweep, never by the finalize itself: after finalizing the last settlement the season must still read OPEN, and only the following sweep flips it to RECONCILED. A CANCELLED stop counts as closed and needs no settlement."
        test_recipe:
          setup:
            - "One season has a COMPLETED SHOW stop and a CANCELLED stop. The show settlement (appearance 100000, prize pool 500000, projected placement 3) is drafted by bm-anna. The clock has been advanced past both stop windows."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
