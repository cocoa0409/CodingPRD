      - name: duplicate_reading_same_date_rejected_then_accepted_after_void
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_DUPLICATE_READING]"]
        distinguishing_aspect: "Uniqueness is over ACCEPTED readings only: a second reading for (equipment, 08-03) while the first is ACCEPTED -> 409 ERR_DUPLICATE_READING; after voiding the first, the same (equipment, 08-03) re-post succeeds — satisfaction case included."
        test_recipe:
          setup: ["Class C403 (service_interval_hours 10000), Equipment E403, one ACCEPTED reading on 08-03"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-403", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { c403_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-403", class_id: "${c403_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e403_id: $.data.id }
            - call: "POST /fleet/equipment/${e403_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 5000, fuel_used_milliliters: 2500 }
              as: FleetAdmin
              captures: { r403_id: $.data.id }
          trigger:
            - call: "POST /fleet/equipment/${e403_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 7000, fuel_used_milliliters: 3500 }
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fleet/readings/${r403_id}/void"
              payload: { void_reason: "bad meter" }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e403_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 7000, fuel_used_milliliters: 3500 }
              as: FleetAdmin
              captures: { r403b_status: $.data.status }
            - call: "GET /fleet/equipment/${e403_id}"
              as: FleetAdmin
              captures: { e403_hours: $.data.engine_hours_milli }
          assert:
            - "Duplicate while ACCEPTED: error_id == ERR_DUPLICATE_READING, http 409"
            - "After void: re-post for the same date succeeds (201, status ACCEPTED)"
            - "Equipment.${e403_id}.engine_hours_milli == 7000 (voided 5000 excluded, new 7000 included)"

      - name: rented_unit_dispose_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_RENTED_UNIT]"]
        distinguishing_aspect: "Dispose requires OWNED: a RENTED unit (acquisition_cost_cents == 0) in IDLE -> 422 ERR_RENTED_UNIT."
        test_recipe:
          setup: ["Class C404, RENTED Equipment E404 IDLE"]
          setup_api_calls:
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-404", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
