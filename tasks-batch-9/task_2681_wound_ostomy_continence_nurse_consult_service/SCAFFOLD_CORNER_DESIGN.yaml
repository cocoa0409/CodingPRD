              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /pressure-injury-cases/${k1_id}/rca-complete"
              payload: { root_cause_category: "SUPPORT_SURFACE", contributing_factors: ["Specialty surface upgrade delayed by 36 hours", "Turn schedule not documented on nights"] }
              as: WocNurse
              as_user_id: "${n2_id}"
            - call: "POST /consult-requests/${c1_id}/close"
              payload: { closing_summary: "Sacral HAPI adjudicated; barrier protocol handed off to the unit." }
              as: WocNurse
              as_user_id: "${n1_id}"
          assert:
            - "Before the trigger: PressureInjuryCase.${k1_id}.status == RCA_REQUIRED with rca_due_at == 2026-08-04T00:00:00Z, and ConsultRequest.${c1_id}.status == PLAN_ACTIVE"
            - "Call 1 returns HTTP 409 with data.error_id == ERR_RCA_NOT_COMPLETE even though the consult's own PLAN_ACTIVE -> CLOSED precondition on status is satisfied"
            - "After call 1 ConsultRequest.${c1_id}.status is still PLAN_ACTIVE and WocNurse.${n1_id}.active_consult_load is still 1 — no side effect leaked from the refused close"
            - "Call 2 returns HTTP 200: PressureInjuryCase.${k1_id}.status == RCA_IN_PROGRESS with rca_lead_nurse_id == Omar, who is not the staging nurse"
            - "Call 3 returns HTTP 409 with ERR_RCA_NOT_COMPLETE again — RCA_IN_PROGRESS is deliberately absent from the allowed set {CLASSIFIED_POA, RCA_COMPLETE, CLOSED, RECLASSIFIED}"
            - "Call 4 returns HTTP 200 and must be made with X-User-ID == the recorded rca_lead_nurse_id: status == RCA_COMPLETE, root_cause_category == SUPPORT_SURFACE, contributing_factors has length 2"
            - "Call 5 returns HTTP 200: ConsultRequest.${c1_id}.status == CLOSED with the closing_summary stored"
            - "WocNurse.${n1_id}.active_consult_load == 0 and mentored_consult_count == 1 after the accepted close"
            - "WocNurse.${n1_id}.certification_eligibility_score == 66.00 — 0.4 * 100 + 0.4 * min(60, 2 * 30) + 0.2 * (MENTORED_POINTS_PER_CONSULT 10 * min(MENTORED_CONSULT_CAP 4, 1)) == 40.00 + 24.00 + 2.00"

      - name: link_mismatch_outranks_round_state_and_rejects_foreign_unit
        claim_type: Priority conflict
        grounds:
