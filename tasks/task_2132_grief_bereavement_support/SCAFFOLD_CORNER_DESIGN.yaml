              as: ProgramDirector
              captures: { ev_id: $.data.id }
            - call: "POST /bereavement/remembrance-events/${ev_id}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /bereavement/referrals"
              payload: { source_type: "SELF", decedent_name: "D One", date_of_death: "2026-06-01", relationship_to_deceased: "SPOUSE", loss_type: "SUDDEN_DEATH", contact_name: "Inv One", contact_email: "inv.one@example.org" }
              as: ReferralSource
              captures: { r1_id: $.data.id }
            - call: "POST /bereavement/referrals/${r1_id}/screen"
              payload: { eligibility_note: "ok" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${r1_id}/accept"
