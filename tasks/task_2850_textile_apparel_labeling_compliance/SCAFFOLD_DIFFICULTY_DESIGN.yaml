# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2850 - Textile & Apparel Labeling Compliance
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Fixture literals are
# shared across instances so the downstream unit-test-generator can hoist them:
#   markets   US  -> languages [en],      fiber_tol 3.0, abs_tol 0.0, min_cycles 20, duty 0.100
#             CA  -> languages [en, fr],  fiber_tol 3.0, abs_tol 0.3, min_cycles 25, duty 0.100
#             MX  -> languages [es],      fiber_tol 4.0, abs_tol 0.5, min_cycles 15, duty 0.075
#             EU_FR -> languages [fr],    fiber_tol 3.0, abs_tol 0.0, min_cycles 30, duty 0.050
#   brand     "Northline Apparel Co" BRAND_OWNER RN12345 SELF_OF_RECORD
#   style S1  NL-4410 KNIT_TOP target [US, CA] 320.0 g
#             fibers COTTON 60.0 / POLYESTER 37.0 / ELASTANE 3.0 (all non-exempt)
#             effective_fiber_content_text = "60.0% COTTON, 37.0% POLYESTER, 3.0% OTHER FIBER"
#   graph S1  N1 FIBER IN 500g/2.00 root
#             N2 YARN  IN 480g/3.00 parent N1
#             N3 YARN  PK 520g/2.50 parent N1
#             N4 FABRIC CN 950g/6.00 parent N2
#             N5 CUT_AND_SEW VN 900g/9.00 parent N4
#             -> st_country VN (value added 9.00 highest), yf_country PK (yarn weight 520 > 480)
#   the logical clock is left at its declared startup default 2026-08-01T00:00:00Z
#   unless an instance sets it explicitly.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: origin_substantial_transformation_versus_yarn_forward_on_one_graph
        grounds:
          - calculations.origin_country_determination
          - entities.OriginDetermination.fields.st_country
          - entities.OriginDetermination.fields.yf_country
          - entities.OriginDetermination.fields.divergent
          - entities.OriginDetermination.fields.determined_country
          - entities.MaterialInput.fields.value_added_usd
          - entities.MaterialInput.fields.weight_grams
          - state_machines.OriginDetermination.DRAFT_to_ISSUED
          - state_machines.OriginDetermination.ISSUED_to_SUPERSEDED
          - state_machines.Style.origin_state.ORIGIN_ISSUED_to_ORIGIN_DRAFTED
        distinguishing_aspect: |
          This instance's two variants diverge on the MaterialInput supply graph of a Style: SUBSTANTIAL_TRANSFORMATION ranks countries by summed value_added_usd over YARN/FABRIC/CUT_AND_SEW and picks VN, while YARN_FORWARD ranks by summed weight_grams over YARN nodes only and picks PK, so the same five rows yield determined_country VN under one pinned method and PK under the other.
        test_recipe:
          setup:
            - "Markets US and CA are registered."
            - "Brand Northline Apparel Co exists with rn_number RN12345 and posture OPEN."
            - "Style S1 exists with target markets [US, CA] and the five-node supply graph above."
            - "Determination D1 has been drafted over that graph and issued with method SUBSTANTIAL_TRANSFORMATION, so Style.origin_state is ORIGIN_ISSUED."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "CA", required_languages: ["en", "fr"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.3, min_durability_cycles: 25, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "KNIT_TOP", target_market_codes: ["US", "CA"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "YARN", country_code: "IN", value_added_usd: 3.00, weight_grams: 480.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n2_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "YARN", country_code: "PK", value_added_usd: 2.50, weight_grams: 520.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n3_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FABRIC", country_code: "CN", value_added_usd: 6.00, weight_grams: 950.0, is_ornamentation: false, parent_input_id: "${n2_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n4_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "CUT_AND_SEW", country_code: "VN", value_added_usd: 9.00, weight_grams: 900.0, is_ornamentation: false, parent_input_id: "${n4_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n5_id: $.data.id }
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { sv1: $.data.version }
            - call: "POST /labeling/origin-determinations"
              payload: { style_id: "${style_id}", expected_style_version: "${sv1}" }
              as: ComplianceAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /labeling/origin-determinations/${d1_id}/issue"
              payload: { method: "SUBSTANTIAL_TRANSFORMATION" }
              as: ComplianceAdmin
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { sv2: $.data.version }
          trigger:
            - call: "POST /labeling/origin-determinations"
              payload: { style_id: "${style_id}", expected_style_version: "${sv2}" }
              as: ComplianceAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /labeling/origin-determinations/${d2_id}/issue"
              payload: { method: "YARN_FORWARD" }
              as: ComplianceAdmin
          assert:
            - "OriginDetermination.${d1_id}.st_country == \"VN\""
            - "OriginDetermination.${d1_id}.yf_country == \"PK\""
            - "OriginDetermination.${d1_id}.divergent == true"
            - "OriginDetermination.${d1_id}.graph_node_count == 5"
            - "OriginDetermination.${d1_id}.determined_country == \"VN\""
            - "OriginDetermination.${d2_id}.st_country == \"VN\""
            - "OriginDetermination.${d2_id}.yf_country == \"PK\""
            - "OriginDetermination.${d2_id}.determined_country == \"PK\""
            - "OriginDetermination.${d1_id}.determined_country != OriginDetermination.${d2_id}.determined_country"
            - "OriginDetermination.${d1_id}.state == \"SUPERSEDED\""
            - "OriginDetermination.${d2_id}.state == \"ISSUED\""
            - "Style.${style_id}.origin_state == \"ORIGIN_ISSUED\""

      - name: marking_penalty_ad_valorem_versus_statutory_per_unit_on_one_entry
        grounds:
          - calculations.marking_penalty_assessment
          - calculations.brand_penalty_ledger
          - calculations.brand_posture
          - entities.ImportShipment.fields.penalty_ad_valorem_usd
          - entities.ImportShipment.fields.penalty_statutory_usd
          - entities.ImportShipment.fields.assessment_basis
          - entities.ImportShipment.fields.posture_at_review
          - state_machines.ImportShipment.ENTRY_FILED_to_REDELIVERY_ORDERED
        distinguishing_aspect: |
          This instance's two variants diverge on an ImportShipment/Brand money pair rather than on a supply graph: the same deficient entry stores penalty_ad_valorem_usd 2000.00 and penalty_statutory_usd 5000.00 side by side, and because posture_at_review is SUSPENDED the STATUTORY_PER_UNIT variant is the one selected, making penalty_assessed_usd 5000.00 instead of the 2000.00 the AD_VALOREM variant computed from identical inputs.
        test_recipe:
          setup:
            - "Market US is registered with marking_duty_rate 0.100."
            - "Brand Northline Apparel Co exists and owns style S1 targeting [US]."
            - "A first entry ENT-1001 of 12000 units at 300000.00 USD was reviewed DEFICIENT while the brand posture was OPEN, so it was assessed 30000.00 ad valorem and drove Brand.outstanding_penalty_usd to 30000.00, which is strictly above PENALTY_SUSPEND_LEDGER_USD 25000.00, so Brand.posture is SUSPENDED."
            - "A second entry ENT-1002 of 4000 units at 10000.00 USD sits in state ENTRY_FILED."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "KNIT_TOP", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/import-shipments"
              payload: { importer_brand_id: "${brand_id}", style_id: "${style_id}", entry_number: "ENT-1001", quantity_units: 12000, declared_value_usd: 300000.00, entry_market_code: "US" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh1_id: $.data.id }
            - call: "POST /labeling/import-shipments/${sh1_id}/marking-review"
              payload: { outcome: "DEFICIENT", deficiency_code: "MISSING_ORIGIN" }
              as: CustomsOfficer
            - call: "POST /labeling/import-shipments"
              payload: { importer_brand_id: "${brand_id}", style_id: "${style_id}", entry_number: "ENT-1002", quantity_units: 4000, declared_value_usd: 10000.00, entry_market_code: "US" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh2_id: $.data.id }
          trigger:
            - call: "POST /labeling/import-shipments/${sh2_id}/marking-review"
              payload: { outcome: "DEFICIENT", deficiency_code: "MISSING_ORIGIN" }
              as: CustomsOfficer
          assert:
            - "ImportShipment.${sh1_id}.assessment_basis == \"AD_VALOREM\""
            - "ImportShipment.${sh1_id}.penalty_ad_valorem_usd == 30000.00"
            - "ImportShipment.${sh1_id}.penalty_assessed_usd == 30000.00"
            - "ImportShipment.${sh2_id}.posture_at_review == \"SUSPENDED\""
            - "ImportShipment.${sh2_id}.penalty_ad_valorem_usd == 2000.00"
            - "ImportShipment.${sh2_id}.penalty_statutory_usd == 5000.00"
            - "ImportShipment.${sh2_id}.assessment_basis == \"STATUTORY_PER_UNIT\""
            - "ImportShipment.${sh2_id}.penalty_assessed_usd == 5000.00"
            - "ImportShipment.${sh2_id}.penalty_mitigated_usd == 0.00"
            - "ImportShipment.${sh2_id}.marking_state == \"REDELIVERY_ORDERED\""
            - "Brand.${brand_id}.outstanding_penalty_usd == 35000.00"
            - "Brand.${brand_id}.posture == \"SUSPENDED\""

  - rule_id: combinatorial_formula
    instances:
      - name: durability_floor_composes_market_max_class_factor_ceiling_and_evidence_min
        grounds:
          - calculations.durability_adequacy
          - calculations.label_market_compliance
          - entities.MarketRequirement.fields.min_durability_cycles
          - entities.Style.fields.product_class
          - entities.LabelSpec.fields.durability_cycles_rating
          - entities.LabTest.fields.legibility_cycles
          - validations[priority=95]
          - errors.ERR_DURABILITY_INSUFFICIENT
        distinguishing_aspect: |
          The durability gate is a four-operator composition whose operators cannot be reordered: max over the label's markets (20, 25 -> 25), multiplication by the product-class factor (25 * 1.25 = 31.25), ceiling to the next whole cycle (32), and then a min over two independent evidence sources (legibility_cycles 40 and durability_cycles_rating), so a label rated 32 passes at the exact boundary while a label rated 30 fails.
        test_recipe:
          setup:
            - "Markets US (min_durability_cycles 20) and CA (min_durability_cycles 25) are registered."
            - "Brand Northline Apparel Co exists with rn_number RN12345 and posture OPEN."
            - "Style S1 is a KNIT_TOP (factor 1.25) targeting [US, CA] with the five-node graph; its determination is ISSUED under SUBSTANTIAL_TRANSFORMATION, so determined_country is VN."
            - "A PASSED FIBER_CONTENT run makes substantiation_state FIBER_SUBSTANTIATED, and a PASSED CARE_PERFORMANCE run at 30 C reports legibility_cycles 40."
            - "Two permanent labels sit in PENDING_APPROVAL with identical content except durability_cycles_rating: L1 is rated 32 and L2 is rated 30."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "CA", required_languages: ["en", "fr"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.3, min_durability_cycles: 25, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "KNIT_TOP", target_market_codes: ["US", "CA"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 37.0, ornamentation_exempt: false }, { fiber_generic_name: "ELASTANE", declared_pct: 3.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FIBER", country_code: "IN", value_added_usd: 2.00, weight_grams: 500.0, is_ornamentation: false }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "YARN", country_code: "IN", value_added_usd: 3.00, weight_grams: 480.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n2_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "YARN", country_code: "PK", value_added_usd: 2.50, weight_grams: 520.0, is_ornamentation: false, parent_input_id: "${n1_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "FABRIC", country_code: "CN", value_added_usd: 6.00, weight_grams: 950.0, is_ornamentation: false, parent_input_id: "${n2_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { n4_id: $.data.id }
            - call: "POST /labeling/styles/${style_id}/material-inputs"
              payload: { stage: "CUT_AND_SEW", country_code: "VN", value_added_usd: 9.00, weight_grams: 900.0, is_ornamentation: false, parent_input_id: "${n4_id}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { sv1: $.data.version }
            - call: "POST /labeling/origin-determinations"
              payload: { style_id: "${style_id}", expected_style_version: "${sv1}" }
              as: ComplianceAdmin
              captures: { od_id: $.data.id }
            - call: "POST /labeling/origin-determinations/${od_id}/issue"
              payload: { method: "SUBSTANTIAL_TRANSFORMATION" }
              as: ComplianceAdmin
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${style_id}", test_type: "FIBER_CONTENT", lab_code: "LAB-ATL-1", method: "AATCC_20A", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z" }
              as: AccreditedLab
              captures: { ft_id: $.data.id }
            - call: "POST /labeling/lab-tests/${ft_id}/results"
              payload: { measured_fibers: [{ fiber_generic_name: "COTTON", measured_pct: 57.0 }, { fiber_generic_name: "POLYESTER", measured_pct: 40.0 }, { fiber_generic_name: "ELASTANE", measured_pct: 3.0 }] }
              as: AccreditedLab
            - call: "POST /labeling/lab-tests"
              payload: { style_id: "${style_id}", test_type: "CARE_PERFORMANCE", lab_code: "LAB-ATL-1", method: "AATCC_135", specimen_received_at: "2026-08-03T09:00:00Z", results_due_at: "2026-08-05T09:00:00Z", wash_temp_c: 30 }
              as: AccreditedLab
              captures: { ct_id: $.data.id }
            - call: "POST /labeling/lab-tests/${ct_id}/results"
              payload: { cycles_run: 5, dimensional_change_pct: 2.0, colorfastness_grade: 4.0, legibility_cycles: 40 }
              as: AccreditedLab
            - call: "POST /labeling/label-specs"
              payload: { style_id: "${style_id}", market_codes: ["US", "CA"], languages: ["en", "fr"], placement_code: "NECK_CENTER_INSIDE", durability_cycles_rating: 32, wash_temp_c: 30, bleach_code: "NO_BLEACH", dry_code: "TUMBLE_LOW", iron_code: "IRON_LOW", dryclean_code: "DO_NOT_DRYCLEAN", identity_display_mode: "RN", fiber_content_text: "60.0% COTTON, 37.0% POLYESTER, 3.0% OTHER FIBER", origin_text: "Made in VN", origin_determination_id: "${od_id}", care_test_id: "${ct_id}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { l1_id: $.data.id }
            - call: "POST /labeling/label-specs/${l1_id}/submit"
              payload: {}
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
            - call: "POST /labeling/label-specs"
              payload: { style_id: "${style_id}", market_codes: ["US", "CA"], languages: ["en", "fr"], placement_code: "NECK_CENTER_INSIDE", durability_cycles_rating: 30, wash_temp_c: 30, bleach_code: "NO_BLEACH", dry_code: "TUMBLE_LOW", iron_code: "IRON_LOW", dryclean_code: "DO_NOT_DRYCLEAN", identity_display_mode: "RN", fiber_content_text: "60.0% COTTON, 37.0% POLYESTER, 3.0% OTHER FIBER", origin_text: "Made in VN", origin_determination_id: "${od_id}", care_test_id: "${ct_id}" }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { l2_id: $.data.id }
            - call: "POST /labeling/label-specs/${l2_id}/submit"
              payload: {}
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
          trigger:
            - call: "POST /labeling/label-specs/${l2_id}/approve"
              payload: {}
              as: LabelingApprover
              as_user_id: "user-appr-1"
              captures: { l2_err: $.data.error_id }
            - call: "POST /labeling/label-specs/${l1_id}/approve"
              payload: {}
              as: LabelingApprover
              as_user_id: "user-appr-1"
          assert:
            - "${l2_err} == \"ERR_DURABILITY_INSUFFICIENT\" with HTTP 422"
            - "LabelSpec.${l2_id}.state == \"PENDING_APPROVAL\""
            - "LabelSpec.${l2_id}.approved_by_user_id == null"
            - "LabelSpec.${l1_id}.state == \"APPROVED\""
            - "LabelSpec.${l1_id}.approved_by_user_id == \"user-appr-1\""
            - "GET /labeling/styles/${style_id}/compliance-summary returns required_durability_cycles == 32"
            - "GET /labeling/styles/${style_id}/compliance-summary returns substantiated_durability_cycles == 32"
            - "Style.${style_id}.label_readiness == \"READY\""

      - name: marking_penalty_two_step_rounding_order_is_pinned
        grounds:
          - calculations.marking_penalty_assessment
          - calculations.brand_posture
          - calculations.audit_rollup
          - calculations.finding_severity
          - entities.MarketRequirement.fields.marking_duty_rate
          - entities.ImportShipment.fields.penalty_ad_valorem_usd
        distinguishing_aspect: |
          The ad valorem figure is a two-stage rounding chain whose stages cannot be collapsed: round_half_up(1000.10 * 0.075, 2) = 75.01 first, then round_half_up(75.01 * 1.50, 2) = 112.52, whereas rounding only once at the end gives 112.51, so the single stored value 112.52 falsifies any implementation that folds the two roundings into one.
        test_recipe:
          setup:
            - "Market MX is registered with marking_duty_rate 0.075."
            - "Brand Northline Apparel Co exists and owns style S1 targeting [MX]."
            - "An open audit on that brand carries three findings that calculations.finding_severity resolves to CRITICAL - FIBER_CONTENT_MISSTATED (base CRITICAL, 100 units), ORIGIN_MISSTATED (base CRITICAL, 100 units) and CARE_UNSUBSTANTIATED (base MAJOR escalated by 5000 units) - so the audit is IN_REVIEW with critical_finding_count 3 and calculations.brand_posture reads RESTRICTED with escalation multiplier 1.50."
            - "Entry ENT-2001 of 800 units at 1000.10 USD sits in state ENTRY_FILED."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "MX", required_languages: ["es"], fiber_tolerance_pp: 4.0, absolute_claim_tolerance_pp: 0.5, min_durability_cycles: 15, marking_duty_rate: 0.075, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
