              as: FleetManager
              as_user_id: "fm-st"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0218", model_code: "CASCADIA_126", in_service_on: "2025-06-01T00:00:00Z", odometer_miles: 0, base_warranty_until_miles: 250000, base_warranty_until_on: "2027-12-31T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id, truck_v_initial: $.data.version }
            - call: "POST /dealers"
              payload: { dealer_name: "Stale Freightliner", region: "SE", hourly_labor_rate_cents: 18500 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
              captures: { bay_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/triage"
              payload: {}
              as: UptimeCoordinator
          trigger:
            # Truck.version has advanced since create (case create + triage both bumped it)
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/schedule"
              payload: { dealer_id: "${dealer_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-01T14:00:00Z", scheduled_end_at: "2026-09-01T17:00:00Z", expected_truck_version: "${truck_v_initial}" }
