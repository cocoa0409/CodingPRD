          - entities.PenaltyAssessment.fields.cure_deadline
        distinguishing_aspect: "cure_deadline = notice_date 2026-02-01 + cure_days 30 = 2026-03-03, and the rule bars affirmation 'on or before' it, so 2026-03-03 is still inside the cure period and 2026-03-04 is the first affirmable day. ABATE is NOT gated by the cure period at all, which separates the temporal guard from the state guard."
        test_recipe:
          setup:
            - "ProgramYear 2026 configured; Ridge Composites (120 employees, WAVE_1) has not registered"
            - "officer-a raised a FAILURE_TO_REGISTER assessment with notice_date 2026-02-01 and cure_days 30, so cure_deadline is 2026-03-03 and status is ASSESSED"
