  # =========================================================================
  # 7. cross_entity_state_dependency — three instances over three different
  #    entity pairs: request/cycle, request/committee-member, asset/project.
  #    Each flips the OTHER entity and re-runs the same call to prove the gate.
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: request_submit_depends_on_cycle_intake_stage
        grounds:
          - state_machines.ReplacementRequest.DRAFT_to_SUBMITTED
          - state_machines.CapitalCycle.DRAFT_to_INTAKE_OPEN
          - validations[priority=50]
          - errors.ERR_CYCLE_INVALID_STATE
        distinguishing_aspect: >-
          Entity pair = ReplacementRequest gated on CapitalCycle: the request is perfectly valid
          (DRAFT, own department, eligible asset) yet submit fails with ERR_CYCLE_INVALID_STATE purely
          because its cycle is still DRAFT, and the identical call succeeds after the cycle — a
          different entity — is moved to INTAKE_OPEN.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; facility NRH, department DEPT-A1, asset A1 (adjusted RULS 30.00, eligible)."
            - "Cycle C1 plan_year 2027 is CREATED but intake is NOT opened, so it sits in DRAFT."
            - "Request R1 is created (creation carries no cycle-stage precondition) and sits in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-16", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 240000000, oem_support_end_date: "2029-01-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_a1_id: $.data.id }
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-06-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.10, facility_contingency_pct: 0.05 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c1_id: $.data.id }
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c1_id}", department_id: "${dept_a1_id}", asset_id: "${asset_a1_id}", clinical_justification: "CT-16 scanner at end of service life; replacement restores stroke protocol throughput.", current_annual_volume: 1200, projected_annual_volume: 1801, estimated_capital_cents: 250000001, annual_service_contract_cents: 12345678, disposable_unit_cents: 1230, facility_modification_cents: 60000000, regulatory_mandate_flag: true, mandate_deadline: "2027-06-30T00:00:00Z" }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /capital/requests/${r1_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { err_cycle_stage: $.data.error_id }
            - call: "POST /capital/cycles/${c1_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/requests/${r1_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
          assert:
            - "Trigger step 1 returns HTTP 409 with error_id == ERR_CYCLE_INVALID_STATE"
            - "After trigger step 1: ReplacementRequest.${r1_id}.status == DRAFT, budgetary_tco_cents == 0, baseline_year1_opex_cents == 0"
            - "Trigger step 2 response: CapitalCycle.status == INTAKE_OPEN, system_contingency_cents == 50000000, distributable_cents == 450000000"
            - "Trigger step 3 response: status == SUBMITTED, budgetary_operating_5y_cents == 78961530, budgetary_tco_cents == 388961531, baseline_year1_opex_cents == 14228624"
            - "CapitalCycle.${c1_id}.scored_count == 0 and expedited_count == 0"

      - name: committee_decision_depends_on_member_active_flag
        grounds:
          - calculations.committee_tally
          - entities.CommitteeMember.fields.active
          - validations[priority=74]
          - state_machines.ReplacementRequest.IN_COMMITTEE_to_APPROVED
          - errors.ERR_NO_ELIGIBLE_VOTERS
        distinguishing_aspect: >-
          Entity pair = ReplacementRequest gated on CommitteeMember: the chair M1 is deliberately
          conflicted out of the eligible set by its DEPT-A1 seat, so deactivating the single
          system-wide voter M2 empties E and the chair's committee-decision returns
          ERR_NO_ELIGIBLE_VOTERS even though a ballot already exists; re-activating M2 makes the same
          call land APPROVED with M2's pinned counted_weight 2 — a member-flag dependency, not a
          cycle-stage one.
