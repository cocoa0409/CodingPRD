      - name: recon_zero_topdown_and_missing_submission_branches
        claim_type: input_set_filtering
        grounds: ["calculations.reconciliation_final"]
        distinguishing_aspect: "BLENDED edge branches in one run: child Z with top_down 0 (zero potential) and a 400000 submission lands final 400000 escalated true; child Y with no submission lands final == top_down 1000000 with bottom_up null escalated false."
        test_recipe:
          setup: ["BLENDED plan SUBMISSIONS_CLOSED; root R pool 1000000 over children Z (potential 0) and Y (potential 1000); rep RZ on Z submitted 400000; Y has no submission"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 1000000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15", reconciliation_policy: "BLENDED" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "R", potential_cents: 0, headcount_capacity: 5 }, as: SalesOpsAdmin, captures: { r: $.data.id } }
