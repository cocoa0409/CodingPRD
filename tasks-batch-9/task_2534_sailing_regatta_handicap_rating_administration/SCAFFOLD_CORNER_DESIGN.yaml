      - name: start_sequence_is_allowed_only_while_no_division_is_under_its_floor
        claim_type: conditional_action
        grounds:
          - endpoints[POST /regatta-ops/races/{id}/start-sequence]
          - entities.Race.fields.start_blocked_reason
        excluded_because:
          difficulty_instance: guarded_cross_entity_transition / start_sequence_blocked_while_division_reverted_to_provisional
          rationale: "That instance withdraws an entry to drive a CONFIRMED division back to PROVISIONAL, shows the start sequence refused with ERR_RACE_START_BLOCKED while start_blocked_reason is DIVISION_UNDER_MINIMUM, then re-confirms the division and shows the identical call succeed, which is the conditional-action claim end to end."

      - name: protest_invalidate_is_terminal_and_rejects_every_later_action
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /regatta-ops/protests/{id}/invalidate]
          - endpoints[POST /regatta-ops/protests/{id}/schedule-hearing]
          - endpoints[POST /regatta-ops/protests/{id}/reopen]
          - state_machines[Protest]
          - validations[priority 6 ERR_INVALID_REQUEST]
          - validations[priority 11 ERR_INVALID_STATE]
        distinguishing_aspect: |
          Ruling a protest invalid is the only route into the Protest machine's single terminal
          state: reason_code is required, so an empty payload is 422 ERR_INVALID_REQUEST, the
          reasoned call lands INVALID, and invalidate, schedule-hearing and reopen are then all
          409 ERR_INVALID_STATE on the same row - no transition leaves INVALID.
