# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Foreclosure Trustee & Auction Administration
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: case_creation_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.ForeclosureCase]
        distinguishing_aspect: "Created case starts REFERRED with version 1, prepayment_penalty_applies defaulting to false when omitted, hold_status CLEAR."
        test_recipe:
          setup: ["Beneficiary exists"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary T1", reference_code: "BEN-T1", contact_email: "t1@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
          trigger:
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T1", borrower_name: "Borrower T", property_address: "1 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id, case_v: $.data.version, case_lc: $.data.lifecycle_status, case_pre: $.data.prepayment_penalty_applies } }
          assert:
            - "${case_lc} == REFERRED (initial state)"
            - "${case_v} == 1 and ${case_pre} == false (default applied)"
            - "response includes server-minted id, created_at, updated_at (system fields)"

      - name: case_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.ForeclosureCase, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting unpaid_principal_balance_cents is a schema rejection before any state or business check."
        test_recipe:
          setup: ["Beneficiary exists"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary T2", reference_code: "BEN-T2", contact_email: "t2@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
          trigger:
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T2", borrower_name: "Borrower T2", property_address: "2 Fresh Rd", county_code: "CC01", monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST and HTTP 400"

      - name: case_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.ForeclosureCase.fields.distribution_method, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "distribution_method outside {STATUTORY_PRIORITY, PRO_RATA} is rejected at intake."
        test_recipe:
          setup: ["Beneficiary exists"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary T3", reference_code: "BEN-T3", contact_email: "t3@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
          trigger:
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T3", borrower_name: "Borrower T3", property_address: "3 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "WEEKLY" }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST and HTTP 400"

      - name: case_create_duplicate_loan_reference_rejected
        claim_type: type_constraints
        grounds: [entities.ForeclosureCase.fields.loan_reference, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "loan_reference is globally unique; second create with the same reference fails."
        test_recipe:
          setup: ["Beneficiary with one case LN-T4"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary T4", reference_code: "BEN-T4", contact_email: "t4@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T4", borrower_name: "Borrower T4", property_address: "4 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager }
          trigger:
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T4", borrower_name: "Borrower T4b", property_address: "5 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "PRO_RATA" }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: get_case_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "Unknown UUID on any id-addressed endpoint resolves to the shared 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/foreclosure-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RESOURCE_NOT_FOUND and HTTP 404"

      - name: postponement_immutable_no_common_fields
        claim_type: immutability
        grounds: [entities.Postponement]
        distinguishing_aspect: "Postponement is an append-only event (common_fields false): response carries id and created_at but no version or updated_at."
        test_recipe:
          setup: ["Case LN-T6 at SALE_SCHEDULED (VEN-T6, 2026-11-23T10:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary T6", reference_code: "BEN-T6", contact_email: "t6@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T6", borrower_name: "Borrower T6", property_address: "6 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-T6" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-T6" }, as: CaseManager, captures: { nots_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-16T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p3: $.data.id } }
            - { call: "POST /api/publications/${p1}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${p2}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${p3}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/schedule-sale", payload: { venue_name: "VEN-T6", scheduled_sale_start_at: "2026-11-23T10:00:00Z" }, as: CaseManager, captures: { sale_id: $.data.id, sale_v: $.data.version } }
          trigger:
            - { call: "POST /api/auction-sales/${sale_id}/postponements", payload: { new_sale_start_at: "2026-11-25T10:00:00Z", reason: "TRUSTEE_DISCRETION", announced_via: "ADVANCE", expected_auction_sale_version: "${sale_v}" }, as: Auctioneer, captures: { post_id: $.data.id } }
          assert:
            - "Postponement response has id and created_at but NO version and NO updated_at (common_fields: false)"
            - "Postponement.${post_id}.prior_sale_start_at == 2026-11-23T10:00:00Z and new_sale_start_at == 2026-11-25T10:00:00Z"

      - name: case_list_pagination_envelope
        claim_type: listing_pagination
        grounds: [response_envelope]
        distinguishing_aspect: "limit/offset windowing with total_count and has_more per the fixed envelope; defaults limit=10."
        test_recipe:
          setup: ["One beneficiary with two cases"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary T7", reference_code: "BEN-T7", contact_email: "t7@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T7A", borrower_name: "Borrower A", property_address: "7 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T7B", borrower_name: "Borrower B", property_address: "8 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "PRO_RATA" }, as: CaseManager }
          trigger:
            - { call: "GET /api/foreclosure-cases?beneficiary_id=${ben_id}&limit=1&offset=0", as: CaseManager }
            - { call: "GET /api/foreclosure-cases?beneficiary_id=${ben_id}&limit=1&offset=1", as: CaseManager }
          assert:
            - "page 1: data length 1, total_count == 2, has_more == true"
            - "page 2: data length 1, total_count == 2, has_more == false; the two pages return distinct case ids"

      - name: summary_computed_read
        claim_type: computed_fields
        grounds: [entities.ForeclosureCase.fields.reinstatement_deadline_date, entities.ForeclosureCase.fields.hold_status]
        distinguishing_aspect: "Summary derives hold_status from StayOrder children and reinstatement_deadline_date from the RECORDED NOD (+90d) — cross-entity computed read."
        test_recipe:
          setup: ["Case LN-T8 with NOD recorded 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary T8", reference_code: "BEN-T8", contact_email: "t8@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-T8", borrower_name: "Borrower T8", property_address: "9 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-T8" }, as: CaseManager }
          trigger:
            - { call: "GET /api/foreclosure-cases/${case_id}/summary", as: CaseManager, captures: { hold: $.data.hold_status, deadline: $.data.reinstatement_deadline_date, stays: $.data.active_stay_count } }
          assert:
            - "${hold} == CLEAR and ${stays} == 0"
            - "${deadline} == 2026-10-30 (recording 2026-08-01 + 90 days)"

      - name: unknown_input_field_rejected
        claim_type: system_fields
        grounds: [response_envelope, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied id on create is an unknown input field and is rejected outright (400), proving ids are server-minted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary T9", reference_code: "BEN-T9", contact_email: "t9@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
          trigger:
            - { call: "POST /api/foreclosure-cases", payload: { id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", beneficiary_id: "${ben_id}", loan_reference: "LN-T9", borrower_name: "Borrower T9", property_address: "10 Fresh Rd", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

  - section: state_machines
    instances:
      - name: second_nod_while_recorded_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ForeclosureCase.REFERRED_to_NOD_RECORDED", "errors[ERR_DUPLICATE_ACTIVE_NOD]"]
        distinguishing_aspect: "A case already in NOD_RECORDED with a RECORDED NOD rejects a second NOD recording with the duplicate guard."
        test_recipe:
          setup: ["Case LN-S1 in NOD_RECORDED"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary S1", reference_code: "BEN-S1", contact_email: "s1@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-S1", borrower_name: "Borrower S1", property_address: "1 State St", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-S1" }, as: CaseManager }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-S1B" }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_CASE_STATE (case left REFERRED; the state guard fires at priority 7)"

      - name: terminal_case_lockdown_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.ForeclosureCase (terminal CANCELLED)", "errors[ERR_INVALID_CASE_STATE]"]
        distinguishing_aspect: "After rescission (CANCELLED terminal), quote issuance on the case is rejected; terminal states admit no further transitions."
        test_recipe:
          setup: ["Case LN-S2 in NOD_RECORDED, then rescinded to CANCELLED"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary S2", reference_code: "BEN-S2", contact_email: "s2@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-S2", borrower_name: "Borrower S2", property_address: "2 State St", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-S2" }, as: CaseManager, captures: { nod_id: $.data.id } }
            - { call: "POST /api/notices-of-default/${nod_id}/rescind", payload: {}, as: CaseManager }
            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { cv: $.data.version, lc: $.data.lifecycle_status } }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/quotes", payload: { quote_type: "PAYOFF", good_through_date: "2026-09-01", expected_foreclosure_case_version: "${cv}" }, as: CaseManager, captures: { err: $.data.error_id } }
          assert:
            - "${lc} == CANCELLED after rescind"
            - "${err} == ERR_INVALID_CASE_STATE (terminal lockdown)"

      - name: publication_bubble_up_not_complete_before_third_affidavit
        claim_type: side_effect_execution
        grounds: ["state_machines.NoticeOfTrusteeSale.RECORDED_to_PUBLICATION_COMPLETE", "state_machines.Publication.RUN_to_AFFIDAVIT_FILED"]
        distinguishing_aspect: "Bubble-up is threshold-exact: NOTS stays RECORDED with 2 affidavits filed and flips to PUBLICATION_COMPLETE exactly on the 3rd."
        test_recipe:
          setup: ["Case LN-S3 at NOTS_RECORDED with 3 publications run (11-02, 11-09, 11-16), none yet affidavit-filed"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary S3", reference_code: "BEN-S3", contact_email: "s3@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-S3", borrower_name: "Borrower S3", property_address: "3 State St", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-S3" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-S3" }, as: CaseManager, captures: { nots_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-16T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p3: $.data.id } }
          trigger:
            - { call: "POST /api/publications/${p1}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${p2}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "GET /api/notices-of-trustee-sale/${nots_id}", as: CaseManager, captures: { st_mid: $.data.status } }
            - { call: "POST /api/publications/${p3}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "GET /api/notices-of-trustee-sale/${nots_id}", as: CaseManager, captures: { st_end: $.data.status } }
          assert:
            - "${st_mid} == RECORDED (2 of 3 affidavits is not complete)"
            - "${st_end} == PUBLICATION_COMPLETE (bubble-up fires on the 3rd affidavit only)"

      - name: fourth_publication_rejected
        claim_type: invalid_transition
        grounds: ["validations[priority=23]", "errors[ERR_PUBLICATION_LIMIT]"]
        distinguishing_aspect: "PUBLICATIONS_REQUIRED == 3 is a hard cap; a 4th publication row is rejected even with a valid 7-day gap."
        test_recipe:
          setup: ["Case LN-S4 NOTS with 3 publications (11-02, 11-09, 11-16)"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary S4", reference_code: "BEN-S4", contact_email: "s4@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-S4", borrower_name: "Borrower S4", property_address: "4 State St", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-S4" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-S4" }, as: CaseManager, captures: { nots_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
