              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/members"
              payload: { member_code: "M-CLS", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 }, { member_item_number: "MI-2", description: "Mesh graft", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "Dana Whitfield" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
