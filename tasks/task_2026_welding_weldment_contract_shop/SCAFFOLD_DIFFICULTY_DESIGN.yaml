# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Two instances per §0.5 rule (≥18 instances total).
# =============================================================================

scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: continuity_expiry_prospective_vs_retrospective
        grounds:
          - calculations.continuity_expiry
          - entities.WelderQualification.fields.continuity_expires_at_utc
        distinguishing_aspect: |
          Same WelderQualification row produces different continuity outcomes
          depending on variant: prospective (evaluated at a new WeldPass's
          welded_at_utc) vs retrospective (evaluated by a system sweep at
          current_utc). A welder with baseline 2026-01-01T00:00:00Z has
          continuity_expires_at = 2026-07-02T00:00:00Z; with current_utc
          pinned at 2026-07-01T23:59:59Z a weld pass succeeds (prospective),
          but advancing the clock past expiry and re-running the sweep flips
          status to LAPSED (retrospective) — same row, different variants.
        test_recipe:
          setup:
            - "Shop created with default repair_rate_limit_pct = 5"
            - "Logical clock set to 2026-07-01T23:59:59Z (one second before expiry)"
            - "Welder W has qualification Q with qualified_at_utc = 2026-01-01T00:00:00Z and last_weld_at_utc = 2026-01-01T00:00:00Z"
            - "An APPROVED PQR/WPS, an ISSUED SMAW lot, an order/weldment/joint in fabrication"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S1", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "W1", full_name: "Welder One" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-1", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-1" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-1", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_id: $.data.id, wps_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/welder-qualifications"
              payload: { welder_id: "${welder_id}", wps_id: "${wps_id}", process: "SMAW", qualified_at_utc: "2026-01-01T00:00:00Z" }
              as: QCManager
              captures: { qual_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV1", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L1", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 5 }
              as: MaterialController
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "F1", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-1", customer_name: "Cust A", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-1", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { weldment_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${weldment_id}/joints"
              payload: { joint_number: "J1", wps_id: "${wps_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT"] }
              as: WeldLead
              captures: { joint_id: $.data.id, joint_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_id}/start-fabrication"
              payload: { expected_joint_version: "${joint_v}" }
              as: WeldLead
            - call: "POST /weld-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T23:59:59Z" }
              as: ShopAdmin
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/joints/${joint_id}/weld-passes"
              payload: { welder_id: "${welder_id}", qualification_id: "${qual_id}", consumable_lot_id: "${lot_id}", consumable_used_kg: 1, is_repair: false }
              as: Welder
              as_user_id: "${welder_id}"
            - call: "POST /weld-shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:01Z" }
              as: ShopAdmin
            - call: "GET /weld-shop/shops/${shop_id}/welder-qualifications/${qual_id}"
              as: Any
              captures: { post_sweep_status: $.data.status, post_sweep_last_weld: $.data.last_weld_at_utc }
          assert:
            - "WeldPass succeeds (prospective variant passes at 2026-07-01T23:59:59Z, one second before expiry)"
            - "After the weld pass, WelderQualification.last_weld_at_utc == '2026-07-01T23:59:59Z' (continuity refreshed)"
            - "After advancing clock to 2026-07-02T00:00:01Z and reading the qualification, its continuity_expires_at_utc has been recomputed to '2026-12-31T23:59:59Z' (183 days after last_weld_at_utc)"
            - "post_sweep_status == 'QUALIFIED' (continuity was refreshed by the weld pass; retrospective sweep does not lapse it)"

      - name: repair_rate_weldment_vs_joint_scope
        grounds:
          - calculations.repair_rate_pct
          - entities.Weldment.fields.repair_rate_pct
          - entities.Joint.fields.repair_cycle_count
        distinguishing_aspect: |
          Same is_repair flag produces divergent repair-rate outcomes depending
          on aggregation scope: weldment-scoped variant (drives REPAIR_REVIEW
          posture) vs joint-scoped variant (drives audit report on a single
          joint). A weldment with 1 repair pass + 19 normal passes has
          weldment repair_rate_pct = 5.00 (>= 5 limit → REPAIR_REVIEW). The
          same repair pass scoped to its own joint with 1 repair + 1 normal
          pass yields joint repair rate = 50.00 — different number, different
          gate, different entity domain.
        test_recipe:
          setup:
            - "Shop with repair_rate_limit_pct = 5"
            - "Weldment has Joint A with 1 repair pass + 1 normal pass; Joint B with 18 normal passes"
            - "Total weldment passes = 20, of which repair = 1"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S2", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "W2", full_name: "Welder Two" }
