  - rule_id: priority_pair_validation_conflict
    instances:
      - name: trading_suspended_outranks_credit_insufficient_on_transaction_proposal
        grounds:
          - validations[priority=12]
          - validations[priority=28]
          - errors[ERR_TRADING_SUSPENDED]
          - errors[ERR_CREDIT_INSUFFICIENT]
          - state_machines.Watershed.ACTIVE_to_ADAPTIVE_HOLD
          - state_machines.Watershed.ADAPTIVE_HOLD_to_ACTIVE
        distinguishing_aspect: |
          One POST /credit-transactions violates a category `state` rule at priority 12
          (Watershed.program_status is ADAPTIVE_HOLD) and a category `business_fiscal` rule at
          priority 28 (requested_gross_lbs 10000.00 far exceeds CreditBatch.available_lbs
          520.00); the response MUST be ERR_TRADING_SUSPENDED with 409, and returning the
          watershed to ACTIVE without changing the payload then surfaces
          ERR_CREDIT_INSUFFICIENT, proving the second violation was live all along.
        test_recipe:
          setup:
            - "Watershed SCR with an APPROVED TMDL, so it reached ACTIVE; reaches R_OUT / R_MID / R_UP as in the base topology."
            - "Permit OH0012345 is INTERIM with applicable limit 23916.00 and reported 25000.00 for 2026, so compliance_status is SHORTFALL with compliance_gap_lbs 1084.00 and priority 29 cannot fire."
            - "PracticeProject PP-A on tract T-101 (COVER_CROP, R_UP, zone Z1, enrolled 100.00, pre 950.50, post 300.00, vintage 2026) is CERTIFIED with verified_acres 80.00, producing CreditBatch A with issued_lbs 520 and available_lbs 520.00; the batch is LISTED while the watershed is still ACTIVE."
            - "The program administrator then moves the watershed ACTIVE -> ADAPTIVE_HOLD; there are no open transactions, so nothing is voided and CreditBatch A's version is unchanged."
