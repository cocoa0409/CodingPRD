# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Blood Bank & Transfusion Service (task 2010)
# §1.8 Test Targeting Index: 9 rules x >= 2 instances (27 instances total).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and replays from empty-DB
# using only §1.5 endpoints.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two entity domains: BloodUnit vs ParLevelPolicy)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ffp_unit_fixed_shelf_vs_thawed_clock
        grounds:
          - calculations.unit_expiration_at_receive
          - entities.BloodUnit.fields.expires_at
        distinguishing_aspect: |
          BloodUnit-domain dual variant: two FFP units with IDENTICAL collected_at
          get different expires_at because one carries thawed_at — the fixed_shelf
          variant yields collected_at + 8760h, the derived_clock variant yields
          min(fixed, thawed_at + 24h).
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z"
            - "supplier S1 with a received FFP order carrying two FFP units, both collected 2026-08-01T00:00:00Z, both abo A / rh NEG; unit U-FROZEN has no thawed_at, unit U-THAW has thawed_at 2026-08-10T06:00:00Z"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "FFP", abo_type: "A", rh_type: "NEG", quantity: 2 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-FROZEN", product_type: "FFP", abo_type: "A", rh_type: "NEG", volume_ml: 250, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-600", lot_number: "LOT-F", antigen_negative: [] }, { unit_number: "U-THAW", product_type: "FFP", abo_type: "A", rh_type: "NEG", volume_ml: 250, collected_at: "2026-08-01T00:00:00Z", thawed_at: "2026-08-10T06:00:00Z", donor_id: "D-601", lot_number: "LOT-F", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-FROZEN"
              as: BloodBankTechnologist
              captures: { u_frozen: "$.data[0].id" }
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-THAW"
              as: BloodBankTechnologist
              captures: { u_thaw: "$.data[0].id" }
          trigger:
            - call: "GET /blood-bank/blood-units/${u_frozen}"
              as: BloodBankTechnologist
              captures: { frozen_exp: $.data.expires_at }
            - call: "GET /blood-bank/blood-units/${u_thaw}"
              as: BloodBankTechnologist
              captures: { thaw_exp: $.data.expires_at }
          assert:
            - "BloodUnit.${u_frozen}.expires_at == 2027-08-01T00:00:00Z (fixed shelf: 2026-08-01 + 8760h)"
            - "BloodUnit.${u_thaw}.expires_at == 2026-08-11T06:00:00Z (derived clock: thawed 2026-08-10T06:00 + 24h, earlier than frozen shelf)"
            - "frozen_exp != thaw_exp despite identical collected_at and product_type"
      - name: bucket_physical_vs_prospective_posture
        grounds:
          - calculations.bucket_physical_posture
          - calculations.bucket_prospective_posture
          - "endpoints.GET_/blood-bank/par-level-policies/{id}/posture"
        distinguishing_aspect: |
          Inventory-domain dual variant: for the same bucket at the same instant,
          physical_posture counts only on-shelf usable units (1 usable -> CRITICAL
          with critical_threshold 2), while prospective_posture adds undelivered
          inbound units arriving within 24h (1 + 6 = 7 > watch 6 -> NORMAL).
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z"
            - "policy for bucket RBC:O:NEG with watch 6, shortage 4, critical 2, min_shelf_life_hours 4"
            - "order SO1 (qty 1) fully received and its unit released to AVAILABLE (expires 2026-09-12T00:00:00Z)"
            - "order SO2 (qty 6, expected_delivery_at 2026-08-10T20:00:00Z, within the 24h horizon) ACKNOWLEDGED but not received"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/par-level-policies"
              payload: { product_type: "RBC", abo_type: "O", rh_type: "NEG", watch_threshold: 6, shortage_threshold: 4, critical_threshold: 2, min_shelf_life_hours: 4 }
              as: BloodBankSupervisor
              captures: { pol_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }], expected_delivery_at: "2026-08-09T00:00:00Z" }
              as: SupplierCoordinator
              captures: { so1_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so1_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so1_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so1_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so1_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 6 }], expected_delivery_at: "2026-08-10T20:00:00Z" }
              as: SupplierCoordinator
              captures: { so2_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so2_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so2_id}/acknowledge"
              as: SupplierCoordinator
          trigger:
            - call: "GET /blood-bank/par-level-policies/${pol_id}/posture"
              as: BloodBankSupervisor
              captures: { phys: $.data.physical_posture, prosp: $.data.prospective_posture }
          assert:
            - "usable_units == 1"
            - "inbound_units_24h == 6"
            - "physical_posture == CRITICAL (1 <= critical_threshold 2)"
            - "prospective_posture == NORMAL (1 + 6 = 7 > watch_threshold 6)"
            - "phys != prosp for identical on-shelf stock — the two variants diverge"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c — all three covered)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: compatibility_decision_abo_plasma_inversion
        grounds:
          - calculations.unit_compatibility_decision
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear conditional branches: for an
          O-positive patient, an AB RBC unit is INCOMPATIBLE (red-cell matrix) while
          an AB FFP unit is COMPATIBLE (plasma matrix runs the opposite direction),
          decided by product_class x patient ABO x unit ABO x Rh rule x antigen and
          special-requirement clauses.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z"
            - "patient P typed O POS, antibody screen NEGATIVE, T&S ACTIVE (expires 2026-08-13T08:00:00Z)"
            - "unit U-RBC-AB (RBC, AB POS, AVAILABLE) and unit U-FFP-AB (FFP, AB NEG, AVAILABLE)"
            - "RBC order for P verified (AWAITING_CROSSMATCH); FFP order for P verified (auto-READY, no crossmatch required)"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "AB", rh_type: "POS", quantity: 1 }, { product_type: "FFP", abo_type: "AB", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-RBC-AB", product_type: "RBC", abo_type: "AB", rh_type: "POS", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-610", lot_number: "LOT-2", antigen_negative: [] }, { unit_number: "U-FFP-AB", product_type: "FFP", abo_type: "AB", rh_type: "NEG", volume_ml: 250, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-611", lot_number: "LOT-2", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-RBC-AB"
              as: BloodBankTechnologist
              captures: { u_rbc_ab: "$.data[0].id" }
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-FFP-AB"
              as: BloodBankTechnologist
              captures: { u_ffp_ab: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u_rbc_ab}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/blood-units/${u_ffp_ab}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-9001", full_name: "Pat One", date_of_birth: "1979-04-15", special_requirements: [] }
              as: BloodBankTechnologist
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat_id}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts_id: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts_id}/result"
              payload: { abo_result: "O", rh_result: "POS", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts_id}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat_id}", product_type: "RBC", units_requested: 1, urgency: "ROUTINE", indication_code: "ANEMIA" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord_rbc: $.data.id }
            - call: "POST /blood-bank/transfusion-orders/${ord_rbc}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat_id}", product_type: "FFP", units_requested: 1, urgency: "ROUTINE", indication_code: "COAGULOPATHY" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord_ffp: $.data.id }
            - call: "POST /blood-bank/transfusion-orders/${ord_ffp}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
          trigger:
            - call: "POST /blood-bank/crossmatches"
              payload: { order_id: "${ord_rbc}", unit_id: "${u_rbc_ab}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { xm_err: $.data.error_id }
            - call: "POST /blood-bank/issue-records"
              payload: { order_id: "${ord_ffp}", unit_id: "${u_ffp_ab}", verified_by_user_id: "tech-b" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { iss_ffp: $.data.id }
          assert:
            - "RBC crossmatch rejected: 422 ERR_UNIT_INCOMPATIBLE (O patient cannot receive AB red cells)"
            - "FFP issue succeeds: IssueRecord.${iss_ffp}.status == ISSUED with unit_id == ${u_ffp_ab} (O patient may receive AB plasma — the matrices are inverses)"
            - "BloodUnit.${u_ffp_ab}.status == ISSUED"
            - "BloodUnit.${u_rbc_ab}.status == AVAILABLE (unchanged)"
      - name: supplier_order_cost_per_line_then_total_rounding
        grounds:
          - calculations.supplier_order_estimated_cost
          - entities.SupplierOrder.fields.estimated_cost_cents
        distinguishing_aspect: |
          Mode (b) — pinned nested rounding order: each line is rounded half-up
          BEFORE summing (CRYO 6495c x 10 x 0.95 = 61702.50 -> 61703c per line, so
          two lines total 123406c; summing first would give 123405c — one cent of
          divergence). The 25% emergency surcharge is then applied ONCE to the
          summed subtotal with a single rounding (123406 x 1.25 = 154257.50 ->
          154258c).
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; supplier exists"
            - "two supplier orders with identical lines [{CRYO,A,NEG,10},{CRYO,B,NEG,10}] (total_qty 20 -> 5% tier); SO-N normal, SO-E emergency"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "CRYO", abo_type: "A", rh_type: "NEG", quantity: 10 }, { product_type: "CRYO", abo_type: "B", rh_type: "NEG", quantity: 10 }] }
              as: SupplierCoordinator
              captures: { so_n: $.data.id, cost_n: $.data.estimated_cost_cents }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: true, lines: [{ product_type: "CRYO", abo_type: "A", rh_type: "NEG", quantity: 10 }, { product_type: "CRYO", abo_type: "B", rh_type: "NEG", quantity: 10 }] }
              as: SupplierCoordinator
              captures: { so_e: $.data.id, cost_e: $.data.estimated_cost_cents }
          trigger:
            - call: "GET /blood-bank/supplier-orders/${so_n}"
              as: SupplierCoordinator
            - call: "GET /blood-bank/supplier-orders/${so_e}"
              as: SupplierCoordinator
          assert:
            - "SupplierOrder.${so_n}.estimated_cost_cents == 123406 (per-line round_half_up then sum)"
            - "SupplierOrder.${so_e}.estimated_cost_cents == 154258 (subtotal 123406 x 1.25 = 154257.50 rounded half-up once)"
            - "cost_n != cost_e; neither equals the sum-then-round result 123405"
      - name: mtp_pack_constitution_evaluation_order
        grounds:
          - calculations.mtp_pack_constitution
          - calculations.fefo_unit_selector
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by an explicit evaluation
          order: component order is fixed [RBC x4, FFP x2, PLT x1]; within a
          component the pinned ABO preference list is walked BEFORE FEFO (an O-NEG
          platelet is chosen over an earlier-expiring A-NEG platelet because the
          preference walk outranks outdate), availability is decremented as units
          are picked, and unfillable quantities become recorded shortfalls rather
          than errors.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z"
            - "AVAILABLE stock: U-R1, U-R2 (RBC O NEG); U-F1, U-F2 (FFP AB NEG); U-P-O (PLT_APHERESIS O NEG, expires 2026-08-11T00:00:00Z); U-P-A (PLT_APHERESIS A NEG, expires 2026-08-10T20:00:00Z — earlier than U-P-O)"
            - "patient P with NO TypeAndScreen (type UNKNOWN); MTP ACTIVATED for P"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 2 }, { product_type: "FFP", abo_type: "AB", rh_type: "NEG", quantity: 2 }, { product_type: "PLT_APHERESIS", abo_type: "O", rh_type: "NEG", quantity: 1 }, { product_type: "PLT_APHERESIS", abo_type: "A", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-R1", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-620", lot_number: "LOT-3", antigen_negative: [] }, { unit_number: "U-R2", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-621", lot_number: "LOT-3", antigen_negative: [] }, { unit_number: "U-F1", product_type: "FFP", abo_type: "AB", rh_type: "NEG", volume_ml: 250, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-622", lot_number: "LOT-3", antigen_negative: [] }, { unit_number: "U-F2", product_type: "FFP", abo_type: "AB", rh_type: "NEG", volume_ml: 250, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-623", lot_number: "LOT-3", antigen_negative: [] }, { unit_number: "U-P-O", product_type: "PLT_APHERESIS", abo_type: "O", rh_type: "NEG", volume_ml: 200, collected_at: "2026-08-06T00:00:00Z", donor_id: "D-624", lot_number: "LOT-3", antigen_negative: [] }, { unit_number: "U-P-A", product_type: "PLT_APHERESIS", abo_type: "A", rh_type: "NEG", volume_ml: 200, collected_at: "2026-08-05T20:00:00Z", donor_id: "D-625", lot_number: "LOT-3", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-P-O"
              as: BloodBankTechnologist
              captures: { u_p_o: "$.data[0].id" }
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-P-A"
              as: BloodBankTechnologist
              captures: { u_p_a: "$.data[0].id" }
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-R1"
              as: BloodBankTechnologist
              captures: { u_r1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u_r1}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-R2"
              as: BloodBankTechnologist
              captures: { u_r2: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u_r2}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-F1"
              as: BloodBankTechnologist
              captures: { u_f1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u_f1}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-F2"
              as: BloodBankTechnologist
              captures: { u_f2: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u_f2}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/blood-units/${u_p_o}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/blood-units/${u_p_a}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-9002", full_name: "Pat Two", date_of_birth: "1985-11-02", special_requirements: [] }
              as: BloodBankTechnologist
              captures: { pat_id: $.data.id }
            - call: "POST /blood-bank/mtp-activations"
              payload: { patient_id: "${pat_id}", activation_reason: "trauma bay hemorrhage protocol" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { mtp_id: $.data.id }
          trigger:
            - call: "POST /blood-bank/mtp-activations/${mtp_id}/dispatch-pack"
              payload: { verified_by_user_id: "tech-b" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { pack_no: $.data.pack_number, pack_issues: $.data.issue_record_ids, pack_short: $.data.shortfalls }
          assert:
            - "pack_number == 1"
            - "len(issue_record_ids) == 5 (2 RBC + 2 FFP + 1 PLT)"
            - "shortfalls == [{ product_type: RBC, missing_qty: 2 }] — untyped patient accepts only (O,NEG) RBC and just 2 exist"
            - "BloodUnit.${u_p_o}.status == ISSUED — the (O,NEG) platelet wins the preference walk"
            - "BloodUnit.${u_p_a}.status == AVAILABLE — the earlier-expiring (A,NEG) platelet is NOT taken: preference-list order outranks FEFO across buckets"
