              as: PlatformAdmin
              captures: { c99: $.data.id }
            - call: "POST /camp-ops/complexes"
              payload: { name: "Boundary 100", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 100 }
