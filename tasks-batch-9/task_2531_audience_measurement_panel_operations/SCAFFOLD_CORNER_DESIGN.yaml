            - call: "GET /markets/${m98_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { mv98_b: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m98_id}", vintage_label: "2026Q4", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${c98_id}", population_households: 100000, population_persons: 250000 }], expected_market_version: "${mv98_b}" }
              as: MethodologyStatistician
              captures: { ue2_98: "$.data.id" }
          trigger:
            - call: "POST /universe-estimates/${ue2_98}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /universe-estimates/${ue1_98}"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /processing-runs/${runopen98}"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /processing-runs/${runpub98}"
              payload: {}
