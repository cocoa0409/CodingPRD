          the seat ledger releases the student's eight seats, that drives
          open_student_count to 0 which auto-completes the IN_EFFECT plan, the
          completed plan drives AcademicProgram to DISCONTINUED and then its
          second axis to CATALOG_WITHDRAWN, and the discontinued program returns
