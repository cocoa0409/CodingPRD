              as: AssetManager
              as_user_id: "${am_id}"
            - call: "POST /portfolios/${pid}/leases/${lid}/options"
              payload: { option_type: "RENEWAL", notice_window_open_date: "2026-08-10T00:00:00Z", notice_window_close_date: "2026-11-30T00:00:00Z", target_commencement_date: "2027-02-01T00:00:00Z", extension_years: 3, rate_determination: "FIXED", fixed_rent_cents_per_rsf_year: 4300 }
