            - "that ValueRevision has ltv_bps_before == 8333, ltv_bps_after == 8000, decision_impact_before == PRICING_ADJUSTMENT, decision_impact_after == NO_IMPACT"
            - "Appraisal.${ap1_id}.current_value_cents == 50000000 and review_status == VALUE_REVISED"
