            - call: "POST /survey-observations"
              payload: { survey_round_id: "${r1_id}", unit_id: "${u1_id}", patient_id: "${p1_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-02T00:00:00Z", injury_present: true, classification: "POA", observed_stage: "STAGE_2", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
