    roles: [PlatformAdmin, AccountOwner, Member, Auditor]
    code: 200
    input: []
    output: AddOnSubscription
    side_effects: []

  - method: POST
    path: "/addons/{id}/suspend"
    description: "Suspends an add-on, voiding its bound seats and booking the SEAT_RELEASED proration credit."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: AddOnSubscription
    side_effects:
      - "AddOnSubscription ACTIVE -> SUSPENDED"
      - "BOUND DeviceSeat rows -> VOIDED with bind_count preserved"
      - "books calculations.addon_proration_amount SEAT_RELEASED onto the OPEN BillingCycle.addon_credit_cents"
      - "increments AddOnSubscription.version by 1"

  - method: POST
    path: "/addons/{id}/resume"
    description: "Resumes a suspended add-on and re-binds its voided seats without any cool-off."
    roles: [PlatformAdmin, AccountOwner]
    code: 200
    input: []
    output: AddOnSubscription
    side_effects:
      - "AddOnSubscription SUSPENDED -> ACTIVE"
      - "VOIDED DeviceSeat rows whose member is ACTIVE -> BOUND, bind_count incremented"
      - "increments AddOnSubscription.version by 1"

  - method: POST
    path: "/device-seats"
    description: "Binds a device seat. Guarded by OCC on the add-on's version and by calculations.seat_pool_occupancy."
