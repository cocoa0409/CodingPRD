            - "Order.${ord_id}.fulfillment_status is still 'PLACED' and ready_at is still null"
            - "Order.${ord_id}.settlement_status is still 'UNDISCLOSED', the rejected call having touched neither dimension"

      - name: depart_before_lock_is_rejected_as_invalid_dispatch_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Dispatch.LOCKED_to_EN_ROUTE
          - validations.priority_12
          - errors.ERR_INVALID_DISPATCH_STATE
        distinguishing_aspect: "depart is declared only from LOCKED, so a STACKED dispatch is rejected with ERR_INVALID_DISPATCH_STATE (409) at priority 12 — ahead of the driver-qualification check at priority 13 that this unqualified driver would also fail — and departed_at stays null."
