              as_user_id: "mgr-1"
          assert:
            - "Before the trigger: ComponentAsset.${c_id}.ndt_status == \"OVERDUE\" and condition_flag == \"FAILED\"; ShopBay.${bay_id}.booked_order_count == 1; Attraction.${a_id}.operational_posture == \"OVERHAUL\""
            - "OverhaulWorkOrder.${w_id}.status == \"RECOMMISSIONED\" and recommissioned_at == \"2026-08-01T00:00:00.000Z\""
            - "ComponentAsset.${c_id}.last_ndt_cycles == 1200 and last_ndt_at == \"2026-08-01T00:00:00.000Z\" and ndt_status == \"CURRENT\" and condition_flag == \"OK\""
            - "ShopBay.${bay_id}.booked_order_count == 0"
            - "Attraction.${a_id}.operational_posture == \"CLOSED_PENDING_INSPECTION\""
            - "Attraction.${a_id}.ytd_downtime_minutes == 30 and DowntimeEvent.${d_id}.settled_guest_slots_lost == 220.00 (unchanged by the overhaul)"

      - name: bubble_up_bulletin_completes_when_the_last_action_verifies
        claim_type: bubble_up
        grounds:
          - "state_machines.MaintenanceBulletin.transitions.ACKNOWLEDGED_to_COMPLETED"
          - "state_machines.BulletinAction.transitions.IN_WORK_to_VERIFIED"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / bulletin_action_verify_gated_by_linked_requisition_then_bubbles_bulletin_to_completed
          rationale: "That §1.8 instance verifies the last non-CANCELLED action and asserts the parent bulletin auto-transitions ACKNOWLEDGED -> COMPLETED with action_verified_count == action_total_count."

      - name: cross_entity_ride_hold_suspends_the_attractions_certifications
        claim_type: cross_entity
        grounds:
          - "state_machines.IncidentReport.transitions.REPORTED_to_RIDE_HELD"
          - "state_machines.OperatorCertification.transitions.CERTIFIED_to_SUSPENDED"
        excluded_because:
          difficulty_instance: transitive_cascade / ride_hold_cascade_suspends_only_certified_rows_and_gates_cycle_logging
          rationale: "That §1.8 instance asserts entity B's post-cascade state field by field: two CERTIFIED rows become SUSPENDED, the TRAINEE row is untouched, and certified_operator_count drops to 0."

      - name: ledger_sync_close_and_void_reconcile_the_downtime_ledger
        claim_type: ledger_sync
        grounds:
          - "state_machines.DowntimeEvent.transitions.RESOLVED_to_CLOSED"
          - "state_machines.DowntimeEvent.transitions.CLOSED_to_VOIDED"
          - "calculations.downtime_minutes_ledger"
        excluded_because:
          difficulty_instance: compensating_invariant / void_restores_ytd_downtime_minutes_exactly_and_drops_the_event_from_both_variants
          rationale: "That §1.8 instance reconciles Attraction.ytd_downtime_minutes before and after both legs (0 -> 105 -> 135 -> 30) and re-reads the capacity window afterwards."

  - section: calculations
    instances:

      - name: bulletin_risk_excludes_verified_and_cancelled_actions_from_both_variants
        claim_type: input_set_filtering
        grounds:
          - "calculations.bulletin_fleet_risk_score.input_set"
          - "endpoints[GET /park-ops/bulletins/{id}/risk]"
        distinguishing_aspect: "With two fanned-out actions where one has reached VERIFIED, the risk read evaluates exactly one action: evaluated_action_count == 1 and both variants report 8.00 (ADVISORY base 10 x FAMILY 0.8 x PENDING 1.0, no overdue points), never the two-action average that would include a VERIFIED row."
        test_recipe:
          setup:
            - "Two Chance/RS-4 FAMILY attractions; one ADVISORY bulletin issued 2026-07-01 with compliance_deadline_date 2026-12-01 (not overdue at the 2026-08-01 clock), acknowledged so both units carry a PENDING action; the first action is started and verified."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Filter Unit One", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "RS-4", ride_class: "FAMILY", theoretical_hourly_capacity: 500, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a1: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Filter Unit Two", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "RS-4", ride_class: "FAMILY", theoretical_hourly_capacity: 500, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a2: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "BR-FILT-1", manufacturer: "Chance", model_code: "RS-4", severity: "ADVISORY", issued_date: "2026-07-01", compliance_deadline_date: "2026-12-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b_id: "$.data.id" }
            - call: "POST /park-ops/bulletins/${b_id}/acknowledge"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/bulletin-actions"
              payload: { bulletin_id: "${b_id}" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { act1: "$.data[0].id", act2: "$.data[1].id" }
            - call: "POST /park-ops/bulletin-actions/${act1}/start"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/bulletin-actions/${act1}/verify"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-1"
          trigger:
            - call: "GET /park-ops/bulletins/${b_id}/risk"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "BulletinAction.${act1}.status == \"VERIFIED\" and BulletinAction.${act2}.status == \"PENDING\""
            - "MaintenanceBulletin.${b_id}.action_total_count == 2 and action_verified_count == 1 and status == \"ACKNOWLEDGED\""
            - "Risk read: evaluated_action_count == 1 and deferred_action_count == 0 and escalation_factor == 1.00"
            - "Risk read: fleet_aggregate_score == 8.00 and per_unit_max_score == 8.00 and divergence == 0.00"
            - "BulletinAction.${act1}.required_part_received == true (no requisition references it)"

      - name: capacity_window_defaults_to_the_clock_date_and_excludes_other_service_dates
        claim_type: input_set_filtering
        grounds:
          - "calculations.downtime_capacity_loss.input_set"
          - "endpoints[GET /park-ops/attractions/{id}/capacity-impact]"
        distinguishing_aspect: "Two closed events on 2026-08-09 (fully peak) and 2026-08-10 (fully off-peak) with the clock at 2026-08-10T20:00:00Z: the parameterless read window is exactly 2026-08-10..2026-08-10 and returns event_count 1 / settled 550.00 / provisional 467.50 / divergence 82.50, the two-day window returns 2 / 1550.00 / 1317.50 / 232.50, and an empty window returns 0 / 0.00 / 0.00 / 0.00."
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T20:00:00Z. One attraction with theoretical_hourly_capacity 1000. Event A: 2026-08-09 12:00Z-13:00Z (60 peak minutes) closed. Event B: 2026-08-10 18:00Z-19:00Z (60 off-peak minutes) closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T20:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/attractions"
              payload: { name: "Window Filter Ride", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "WF-1", ride_class: "THRILL", theoretical_hourly_capacity: 1000, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-09T12:00:00.000Z", cause_category: "ELECTRICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { dA: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${dA}/diagnose"
              payload: { root_cause_code: "PLC-FAULT" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${dA}/resolve"
              payload: { ended_at: "2026-08-09T13:00:00.000Z" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${dA}/close"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-10T18:00:00.000Z", cause_category: "WEATHER" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { dB: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${dB}/diagnose"
              payload: { root_cause_code: "LIGHTNING-HOLD" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${dB}/resolve"
              payload: { ended_at: "2026-08-10T19:00:00.000Z" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${dB}/close"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /park-ops/attractions/${a_id}/capacity-impact"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/attractions/${a_id}/capacity-impact"
              payload: { window_start_date: "2026-08-09", window_end_date: "2026-08-10" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/attractions/${a_id}/capacity-impact"
              payload: { window_start_date: "2026-08-08", window_end_date: "2026-08-08" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "DowntimeEvent.${dA}.peak_minutes == 60 and off_peak_minutes == 0 and settled_guest_slots_lost == 1000.00"
            - "DowntimeEvent.${dB}.peak_minutes == 0 and off_peak_minutes == 60 and settled_guest_slots_lost == 550.00"
            - "Trigger 1: window_start_date == \"2026-08-10\" and window_end_date == \"2026-08-10\", event_count == 1, settled_guest_slots_lost == 550.00, provisional_guest_slots_lost == 467.50, divergence_guest_slots == 82.50"
            - "Trigger 2: event_count == 2, settled_guest_slots_lost == 1550.00, provisional_guest_slots_lost == 1317.50, divergence_guest_slots == 232.50"
            - "Trigger 3: event_count == 0, settled_guest_slots_lost == 0.00, provisional_guest_slots_lost == 0.00, divergence_guest_slots == 0.00"
            - "Attraction.${a_id}.ytd_downtime_minutes == 120"

      - name: provisional_variant_projects_still_open_downtime_from_mean_repair_minutes
        claim_type: projection
        grounds:
          - "calculations.downtime_capacity_loss.formula"
          - "entities.Attraction.fields.mean_repair_minutes"
          - "calculations.downtime_capacity_loss.variants"
        distinguishing_aspect: "For a DIAGNOSED event with ended_at still null (started 16:00Z, mean_repair_minutes 90, capacity 1200) SETTLED contributes exactly 0.00 while PROVISIONAL projects an end of 17:30Z and reports 1300.50, giving divergence -1300.50; resolving the event at exactly the projected 17:30Z flips SETTLED to 1530.00 and leaves PROVISIONAL at 1300.50 (divergence 229.50)."
        test_recipe:
          setup:
            - "Clock at 2026-08-10T18:00:00Z. One attraction with theoretical_hourly_capacity 1200 and mean_repair_minutes 90. One event started 2026-08-10T16:00:00Z, diagnosed, not yet resolved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/attractions"
              payload: { name: "Projection Ride", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "PJ-1", ride_class: "THRILL", theoretical_hourly_capacity: 1200, min_operators_required: 2, parts_budget_cents: 1000000, mean_repair_minutes: 90 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-10T16:00:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${d_id}/diagnose"
              payload: { root_cause_code: "BRAKE-VALVE" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "GET /park-ops/attractions/${a_id}/capacity-impact"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/downtime-events/${d_id}/resolve"
              payload: { ended_at: "2026-08-10T17:30:00.000Z" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "GET /park-ops/attractions/${a_id}/capacity-impact"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Trigger 1: event_count == 1, settled_guest_slots_lost == 0.00, provisional_guest_slots_lost == 1300.50, divergence_guest_slots == -1300.50"
            - "Trigger 2: DowntimeEvent.${d_id}.status == \"RESOLVED\", duration_minutes == 90, peak_minutes == 60, off_peak_minutes == 30, settled_guest_slots_lost == 1530.00"
            - "Trigger 3: event_count == 1, settled_guest_slots_lost == 1530.00, provisional_guest_slots_lost == 1300.50, divergence_guest_slots == 229.50"
            - "Attraction.${a_id}.ytd_downtime_minutes == 0 (the event is RESOLVED, not CLOSED)"

      - name: overhaul_off_season_predicate_requires_every_window_date_inside_the_span
        claim_type: constants_applied
        grounds:
          - "calculations.overhaul_cost_estimate.constants"
          - "entities.OverhaulWorkOrder.fields.off_season"
        distinguishing_aspect: "A 2027-02-25..2027-03-02 window straddles OFF_SEASON_END_MMDD, so off_season is false, off_season_discount_cents is 0 and the expedite tier is taken from 3950000 (EXPEDITE_PCT_SMALL 0.12 -> fee 474000, total 4424000); the same money in a fully off-season 2026-11-05..2026-11-10 window discounts by exactly 237000 to 3713000."
        test_recipe:
          setup:
            - "One attraction with one component, one bay of capacity 1, and two work orders both quoted at parts_subtotal_cents 3000000 and labor_hours 100 (base_total_cents 3950000)."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Off Season Ride", park_area: "LAGOON", manufacturer: "Mack", model_code: "OS-1", ride_class: "WATER", theoretical_hourly_capacity: 700, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "Drive Gearbox", component_type: "GEARBOX", criticality: "ESSENTIAL", ndt_interval_cycles: 900000, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c_id: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay Season", concurrent_slot_capacity: 1 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { bay_id: "$.data.id", bay_v1: "$.data.version" }
          trigger:
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${a_id}", component_id: "${c_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v1}", window_start_date: "2027-02-25", window_end_date: "2027-03-02", parts_subtotal_cents: 3000000, labor_hours: 100, expedite_requested: true }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { w1: "$.data.id" }
            - call: "GET /park-ops/shop-bays/${bay_id}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { bay_v2: "$.data.version" }
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${a_id}", component_id: "${c_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v2}", window_start_date: "2026-11-05", window_end_date: "2026-11-10", parts_subtotal_cents: 3000000, labor_hours: 100 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { w2: "$.data.id" }
          assert:
            - "OverhaulWorkOrder.${w1}.off_season == false and base_total_cents == 3950000 and off_season_discount_cents == 0 and discounted_base_cents == 3950000"
            - "OverhaulWorkOrder.${w1}.expedite_pct == 0.12 and expedite_fee_cents == 474000 and estimated_total_cents == 4424000"
            - "OverhaulWorkOrder.${w2}.off_season == true and off_season_discount_cents == 237000 and discounted_base_cents == 3713000"
            - "OverhaulWorkOrder.${w2}.expedite_pct == 0 and expedite_fee_cents == 0 and estimated_total_cents == 3713000"
            - "${bay_v2} == 2 and ShopBay.${bay_id}.booked_order_count == 2 and version == 3 after both creates"
            - "Attraction.${a_id}.parts_budget_committed_cents == 0 (overhaul quotes never touch the parts ledger)"

      - name: certification_status_precedence_expiry_beats_suspension_and_trainee_flips_at_effective_from
        claim_type: correct_result
        grounds:
          - "calculations.certification_status_derivation.formula"
          - "endpoints[POST /park-ops/operator-certifications/{id}/suspend]"
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: "Status is never stored: one certification reads CERTIFIED, becomes SUSPENDED after the suspend call, and then reads EXPIRED (not SUSPENDED) once the clock passes expires_at, while a second certification with a future effective_from reads TRAINEE first and CERTIFIED later - proving the pinned clause order EXPIRED > SUSPENDED > TRAINEE > CERTIFIED is re-evaluated at read time."
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z start. One attraction with min_operators_required 1. Certification C1 for operator op-1 over [2026-08-01T00:00:00Z, 2026-08-15T00:00:00Z) with passing scores 90/85; certification C2 for operator op-2 over [2026-08-10T00:00:00Z, 2026-09-01T00:00:00Z) with passing scores 88/82."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Cert Precedence Ride", park_area: "KIDS_COVE", manufacturer: "Zamperla", model_code: "CP-1", ride_class: "FAMILY", theoretical_hourly_capacity: 600, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${a_id}", operator_user_id: "op-1", effective_from: "2026-08-01T00:00:00.000Z", expires_at: "2026-08-15T00:00:00.000Z", restraint_verification_score: 90, dispatch_procedure_score: 85 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { c1: "$.data.id" }
            - call: "POST /park-ops/operator-certifications"
              payload: { attraction_id: "${a_id}", operator_user_id: "op-2", effective_from: "2026-08-10T00:00:00.000Z", expires_at: "2026-09-01T00:00:00.000Z", restraint_verification_score: 88, dispatch_procedure_score: 82 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { c2: "$.data.id" }
          trigger:
            - call: "POST /park-ops/operator-certifications/${c1}/suspend"
              payload: { suspension_reason: "PROCEDURAL_REVIEW" }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/operator-certifications/${c1}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/operator-certifications/${c2}"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "GET /park-ops/attractions/${a_id}/dispatch-readiness"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Before the suspend call: C1.status == \"CERTIFIED\", C2.status == \"TRAINEE\", Attraction.certified_operator_count == 1"
            - "After the suspend call: C1.status == \"SUSPENDED\" with suspended_at set and suspension_reason \"PROCEDURAL_REVIEW\", Attraction.certified_operator_count == 0"
            - "At 2026-08-15T00:00:00Z (exactly expires_at, half-open): C1.status == \"EXPIRED\" even though suspended_at is still set, C2.status == \"CERTIFIED\", Attraction.certified_operator_count == 1"
            - "At 2026-09-01T00:00:00Z: C2.status == \"EXPIRED\" and Attraction.certified_operator_count == 0"
            - "Final dispatch-readiness: certified_operator_count == 0 and dispatch_readiness_index == 0.00 (posture is CLOSED_PENDING_INSPECTION, not OPEN)"

      - name: posture_precedence_walks_overhaul_over_hold_over_down_and_unwinds_in_reverse
        claim_type: constraint_propagation
        grounds:
          - "calculations.operational_posture_derivation.formula"
          - "state_machines.OverhaulWorkOrder.transitions.SCHEDULED_to_TEARDOWN"
          - "state_machines.IncidentReport.transitions.REPORTED_to_RIDE_HELD"
        distinguishing_aspect: "The same attraction carries an open downtime event, a regulatory hold and an in-flight overhaul simultaneously; posture reports only the highest-precedence clause at each step (DOWN -> HOLD -> OVERHAUL) and then walks back down the identical ladder (HOLD -> DOWN -> CLOSED_PENDING_INSPECTION) as each condition is retired, reaching a fixed point with no clause skipped."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T20:00:00Z. One attraction with one ESSENTIAL component and one bay of capacity 1. No inspection template, so the attraction can never reach OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T20:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/attractions"
              payload: { name: "Precedence Ladder Ride", park_area: "SKYLINE", manufacturer: "B&M", model_code: "PL-1", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 5000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "Main Gearbox", component_type: "GEARBOX", criticality: "ESSENTIAL", ndt_interval_cycles: 500000, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c_id: "$.data.id" }
            - call: "POST /park-ops/shop-bays"
              payload: { name: "Bay Ladder", concurrent_slot_capacity: 1 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { bay_id: "$.data.id", bay_v: "$.data.version" }
          trigger:
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-01T08:00:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d_id: "$.data.id" }
            - call: "POST /park-ops/incidents"
              payload: { attraction_id: "${a_id}", occurred_at: "2026-08-01T09:00:00.000Z", injury_severity: "SERIOUS", guest_count_affected: 1, narrative: "Guest reported arm injury during dispatch." }
              as: SafetyOfficer
              as_user_id: "safety-1"
              captures: { inc: "$.data.id" }
            - call: "POST /park-ops/overhaul-work-orders"
              payload: { attraction_id: "${a_id}", component_id: "${c_id}", shop_bay_id: "${bay_id}", expected_shop_bay_version: "${bay_v}", window_start_date: "2026-11-01", window_end_date: "2026-11-20", parts_subtotal_cents: 500000, labor_hours: 40 }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { w_id: "$.data.id" }
            - call: "POST /park-ops/overhaul-work-orders/${w_id}/advance"
              payload: { target_phase: "TEARDOWN" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/overhaul-work-orders/${w_id}/advance"
              payload: { target_phase: "INSPECTION" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/overhaul-work-orders/${w_id}/advance"
              payload: { target_phase: "REBUILD" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/overhaul-work-orders/${w_id}/advance"
              payload: { target_phase: "RECOMMISSIONED" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/incidents/${inc}/investigate"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /park-ops/incidents/${inc}/notify-regulator"
              payload: { regulator_case_ref: "REG-LADDER-1" }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /park-ops/incidents/${inc}/clear"
              payload: { regulator_clearance_ref: "CLR-LADDER-1" }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /park-ops/downtime-events/${d_id}/diagnose"
              payload: { root_cause_code: "GEAR-NOISE" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${d_id}/resolve"
              payload: { ended_at: "2026-08-01T09:00:00.000Z" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${d_id}/close"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "At creation the attraction reads operational_posture == \"CLOSED_PENDING_INSPECTION\" (clause 4, last_signed_off_service_date is null)"
            - "After the downtime create: posture == \"DOWN\" (clause 3)"
            - "After the incident create with SERIOUS: incident.status == \"RIDE_HELD\", Attraction.regulatory_hold == true, posture == \"HOLD\" (clause 2 outranks the still-open event)"
            - "After the TEARDOWN advance: posture == \"OVERHAUL\" (clause 1 outranks both HOLD and DOWN); the INSPECTION and REBUILD advances leave it OVERHAUL"
            - "After the RECOMMISSIONED advance: ShopBay.${bay_id}.booked_order_count == 0, ComponentAsset.${c_id}.ndt_status == \"CURRENT\" and condition_flag == \"OK\", and posture drops back to \"HOLD\" (not OPEN)"
            - "After the incident clear: regulatory_hold == false and posture == \"DOWN\" (clause 3 again, the event is still RESOLVED at that moment)"
            - "After the downtime close: posture == \"CLOSED_PENDING_INSPECTION\" and Attraction.ytd_downtime_minutes == 60; a repeat read returns the same value (fixed point)"

      - name: capacity_loss_rounding_order_is_the_only_source_of_the_two_variant_delta
        claim_type: precision
        grounds:
          - "calculations.downtime_capacity_loss.precision"
          - "calculations.downtime_capacity_loss.variants"
        excluded_because:
          difficulty_instance: dual_variant_calc / capacity_loss_settled_per_event_rounding_vs_provisional_single_rounding
          rationale: "That §1.8 instance pins three closed events whose per-event half-up rounding differs from the single terminal rounding of the aggregate, so the delta is attributable to rounding order alone."

      - name: bulletin_risk_two_variants_diverge_on_the_same_action_set
        claim_type: variant_divergence
        grounds:
          - "calculations.bulletin_fleet_risk_score.variants"
        excluded_because:
          difficulty_instance: dual_variant_calc / bulletin_risk_fleet_aggregate_escalation_vs_per_unit_max
          rationale: "That §1.8 instance holds the action set fixed while asserting both fleet_aggregate_score and per_unit_max_score plus their signed divergence, including the deferral escalation factor."

      - name: ndt_cycle_threshold_is_probed_at_minus_one_at_and_past_the_boundary
        claim_type: threshold
        grounds:
          - "calculations.component_ndt_due_status.formula"
          - "calculations.component_ndt_due_status.constants"
        excluded_because:
          difficulty_instance: boundary_precision_check / ndt_cycle_interval_and_grace_ceiling_are_inclusive_at_50000_and_60000
          rationale: "That §1.8 instance walks the cycle counter across both the interval and the NDT_GRACE_FACTOR ceiling one cycle at a time, asserting CURRENT / DUE / OVERDUE at each boundary."

      - name: dispatch_readiness_weights_are_applied_without_drift
        claim_type: weighted_scoring
        grounds:
          - "calculations.dispatch_readiness_index.formula"
          - "calculations.dispatch_readiness_index.constants"
        excluded_because:
          difficulty_instance: combinatorial_formula / dispatch_readiness_nested_min_max_with_capped_penalty
          rationale: "That §1.8 instance exercises BASE_WEIGHT / RESTRAINT_WEIGHT together with the clamped restraint span and the capped essential-fail penalty on one OPEN attraction."

      - name: overhaul_expedite_tier_boundaries_are_each_exercised
        claim_type: tiered_pricing
        grounds:
          - "calculations.overhaul_cost_estimate.formula"
          - "calculations.overhaul_cost_estimate.constants"
        excluded_because:
          difficulty_instance: combinatorial_formula / overhaul_expedite_tier_selected_from_discounted_base_not_base_total
          rationale: "That §1.8 instance places quotes on both sides of the 5,000,000 and 20,000,000 tier edges specifically where the discount moves the quote across a tier."

      - name: downtime_minute_ledger_totals_survive_add_then_reversal
        claim_type: aggregation
        grounds:
          - "calculations.downtime_minutes_ledger"
          - "entities.Attraction.fields.ytd_downtime_minutes"
        excluded_because:
          difficulty_instance: compensating_invariant / void_restores_ytd_downtime_minutes_exactly_and_drops_the_event_from_both_variants
          rationale: "That §1.8 instance asserts the running total after each close and after the void, proving the reversal restores the pre-close value exactly."

  - section: validations
    instances:

      - name: template_and_inspection_gates_fire_for_no_active_template_empty_template_and_duplicate_service_date
        claim_type: violation_to_error
        grounds:
          - "validations[priority 13] ERR_NO_ACTIVE_TEMPLATE"
          - "validations[priority 17] ERR_TEMPLATE_HAS_NO_ITEMS"
          - "validations[priority 20] ERR_DUPLICATE_INSPECTION"
        distinguishing_aspect: "Three independent gates on the inspection setup path in one run: opening an inspection before any template is ACTIVE is 409 ERR_NO_ACTIVE_TEMPLATE, activating a DRAFT template with item_count 0 is 422 ERR_TEMPLATE_HAS_NO_ITEMS (and leaves Attraction.version untouched so the same expected_attraction_version still works), and a second inspection for the same (attraction_id, service_date) is 409 ERR_DUPLICATE_INSPECTION while the next service date is accepted."
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z start. One attraction and one DRAFT inspection template with no checklist items."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Gate Ride", park_area: "KIDS_COVE", manufacturer: "Zamperla", model_code: "GT-1", ride_class: "FAMILY", theoretical_hourly_capacity: 600, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t_id: "$.data.id" }
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_v: "$.data.version" }
          trigger:
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${a_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/inspection-templates/${t_id}/activate"
              payload: { expected_attraction_version: "${a_v}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t_id}/items"
              payload: { sequence_no: 1, description: "Walk the track and verify no debris", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t_id}/activate"
              payload: { expected_attraction_version: "${a_v}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${a_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { insp1: "$.data.id" }
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${a_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${a_id}", service_date: "2026-08-02" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { insp2: "$.data.id" }
          assert:
            - "Trigger 1: 409 with error_id \"ERR_NO_ACTIVE_TEMPLATE\" and no DailyInspection row is created"
            - "Trigger 2: 422 with error_id \"ERR_TEMPLATE_HAS_NO_ITEMS\"; the template stays DRAFT, Attraction.${a_id}.active_template_id stays null and Attraction.version is still ${a_v}"
            - "Trigger 4: 200; template status == \"ACTIVE\", item_count == 1, Attraction.active_template_id == \"${t_id}\" and Attraction.version == ${a_v} + 1"
            - "Trigger 5: 201; DailyInspection.${insp1}.status == \"IN_PROGRESS\", template_id == \"${t_id}\", item_count == 1, pending_item_count == 1, rework_round == 0"
            - "Trigger 6: 409 with error_id \"ERR_DUPLICATE_INSPECTION\"; still exactly one inspection for 2026-08-01"
            - "Trigger 7: 201; DailyInspection.${insp2}.service_date == \"2026-08-02\" (the uniqueness key is the pair, not the attraction)"

      - name: submit_and_sign_off_refuse_pending_lines_blocking_lines_and_an_unnoted_essential_fail
        claim_type: violation_to_error
        grounds:
          - "validations[priority 18] ERR_ITEM_RESULTS_PENDING"
          - "validations[priority 19] ERR_ESSENTIAL_FAIL_NOTE_REQUIRED"
          - "validations[priority 8] ERR_SAFETY_CRITICAL_ITEM_FAILED"
        distinguishing_aspect: "The three inspection guards are exercised in their natural order on a two-line template: submit with one PENDING line is 409 ERR_ITEM_RESULTS_PENDING, a FAIL on the ESSENTIAL line with no note is 422 ERR_ESSENTIAL_FAIL_NOTE_REQUIRED (the line stays PENDING), and once the noted FAIL is stored sign-off is 409 ERR_SAFETY_CRITICAL_ITEM_FAILED with blocking_item_count 1 even though every line has been recorded."
        test_recipe:
          setup:
            - "One attraction with an ACTIVE two-line template: line 1 ESSENTIAL, line 2 ADVISORY. One IN_PROGRESS inspection for 2026-08-01 with two PENDING results."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Blocking Ride", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "BL-1", ride_class: "THRILL", theoretical_hourly_capacity: 900, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id", a_v: "$.data.version" }
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t_id}/items"
              payload: { sequence_no: 1, description: "Verify restraint locking on every car", severity_class: "ESSENTIAL" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t_id}/items"
              payload: { sequence_no: 2, description: "Confirm queue gates latch", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t_id}/activate"
              payload: { expected_attraction_version: "${a_v}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${a_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { insp: "$.data.id" }
            - call: "GET /park-ops/inspection-item-results"
              payload: { inspection_id: "${insp}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r1: "$.data[0].id", r2: "$.data[1].id" }
          trigger:
            - call: "POST /park-ops/daily-inspections/${insp}/submit"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/inspection-item-results/${r1}/record"
              payload: { outcome: "FAIL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/inspection-item-results/${r1}/record"
              payload: { outcome: "FAIL", note: "Car 3 restraint sensor intermittent" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/inspection-item-results/${r2}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/daily-inspections/${insp}/submit"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/daily-inspections/${insp}/sign-off"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-1"
          assert:
            - "Trigger 1: 409 with error_id \"ERR_ITEM_RESULTS_PENDING\"; the inspection stays IN_PROGRESS with pending_item_count == 2"
            - "Trigger 2: 422 with error_id \"ERR_ESSENTIAL_FAIL_NOTE_REQUIRED\"; result ${r1} keeps outcome \"PENDING\", the inspection still has pending_item_count == 2 and blocking_item_count == 0"
            - "Trigger 3: 200; result ${r1}.outcome == \"FAIL\", severity_class == \"ESSENTIAL\", the note is stored, pending_item_count == 1 and blocking_item_count == 1"
            - "Trigger 5: 200; status == \"PENDING_SIGN_OFF\", pending_item_count == 0, blocking_item_count == 1, recorded_by_user_ids == [\"tech-1\"]"
            - "Trigger 6: 409 with error_id \"ERR_SAFETY_CRITICAL_ITEM_FAILED\"; status stays PENDING_SIGN_OFF, signed_off_by_user_id stays null and Attraction.last_signed_off_service_date stays null"
            - "Attraction.${a_id}.operational_posture == \"CLOSED_PENDING_INSPECTION\" throughout (no line is SAFETY_CRITICAL, so the inspection never reaches BLOCKED)"

      - name: ndt_overdue_on_a_safety_critical_component_blocks_sign_off_until_a_pass_is_recorded
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority 9] ERR_NDT_OVERDUE_SAFETY_CRITICAL"
          - "calculations.component_ndt_due_status"
          - "endpoints[POST /park-ops/components/{id}/ndt-records]"
        distinguishing_aspect: "The inspection itself is flawless (single ADVISORY line PASSED, PENDING_SIGN_OFF, blocking_item_count 0) yet sign-off is refused 409 ERR_NDT_OVERDUE_SAFETY_CRITICAL purely because a sibling ComponentAsset is OVERDUE; recording an NDT PASS on that component flips the same sign-off call to 200 and moves the posture from DOWN to OPEN."
        test_recipe:
          setup:
            - "One attraction with a SAFETY_CRITICAL component whose ndt_interval_cycles is 100 (grace ceiling ceil(100 * 1.2) == 120). 120 cycles are logged, pushing the component to OVERDUE. An ACTIVE one-line ADVISORY template, an inspection for 2026-08-01 with the line PASSED and the inspection submitted."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "NDT Gate Ride", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "ND-1", ride_class: "THRILL", theoretical_hourly_capacity: 1000, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id", a_v: "$.data.version" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a_id}", name: "Restraint Cylinder", component_type: "RESTRAINT_ACTUATOR", criticality: "SAFETY_CRITICAL", ndt_interval_cycles: 100, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c_id: "$.data.id" }
            - call: "POST /park-ops/attractions/${a_id}/cycles"
              payload: { service_date: "2026-08-01", cycles_added: 120 }
              as: RideOperator
              as_user_id: "op-1"
            - call: "POST /park-ops/inspection-templates"
              payload: { attraction_id: "${a_id}", effective_from_date: "2026-08-01" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { t_id: "$.data.id" }
            - call: "POST /park-ops/inspection-templates/${t_id}/items"
              payload: { sequence_no: 1, description: "Confirm station gate interlock", severity_class: "ADVISORY" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/inspection-templates/${t_id}/activate"
              payload: { expected_attraction_version: "${a_v}" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/daily-inspections"
              payload: { attraction_id: "${a_id}", service_date: "2026-08-01" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { insp: "$.data.id" }
            - call: "GET /park-ops/inspection-item-results"
              payload: { inspection_id: "${insp}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r1: "$.data[0].id" }
            - call: "POST /park-ops/inspection-item-results/${r1}/record"
              payload: { outcome: "PASS" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/daily-inspections/${insp}/submit"
              payload: {}
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /park-ops/daily-inspections/${insp}/sign-off"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-1"
            - call: "POST /park-ops/components/${c_id}/ndt-records"
              payload: { ndt_method: "ULTRASONIC", result: "PASS" }
              as: QualifiedInspector
              as_user_id: "insp-1"
            - call: "POST /park-ops/daily-inspections/${insp}/sign-off"
              payload: {}
              as: QualifiedInspector
              as_user_id: "insp-1"
            - call: "GET /park-ops/attractions/${a_id}/dispatch-readiness"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Before trigger 1: Attraction.cumulative_cycles == 120, ComponentAsset.${c_id}.cycles_since_last_ndt == 120 and ndt_status == \"OVERDUE\", Attraction.operational_posture == \"DOWN\", DailyInspection.${insp}.status == \"PENDING_SIGN_OFF\" with blocking_item_count == 0"
            - "Trigger 1: 409 with error_id \"ERR_NDT_OVERDUE_SAFETY_CRITICAL\"; the inspection stays PENDING_SIGN_OFF"
            - "Trigger 2: 200; ComponentAsset.${c_id}.last_ndt_cycles == 120, cycles_since_last_ndt == 0, ndt_status == \"CURRENT\", and the posture recomputes to \"CLOSED_PENDING_INSPECTION\""
            - "Trigger 3: 200; DailyInspection.${insp}.status == \"SIGNED_OFF\", signed_off_by_user_id == \"insp-1\", Attraction.last_signed_off_service_date == \"2026-08-01\" and operational_posture == \"OPEN\""
            - "Trigger 4: operational_posture == \"OPEN\" but certified_operator_count == 0, so dispatch_readiness_index == 0.00"

      - name: downtime_uniqueness_and_service_date_span_guards_are_both_enforced
        claim_type: violation_to_error
        grounds:
          - "validations[priority 21] ERR_DOWNTIME_ALREADY_OPEN"
          - "validations[priority 23] ERR_DOWNTIME_SPANS_SERVICE_DATES"
          - "entities.DowntimeEvent.fields.service_date"
        distinguishing_aspect: "A second live event on the same attraction is 409 ERR_DOWNTIME_ALREADY_OPEN while the first is only DIAGNOSED (the live set is {OPEN, DIAGNOSED, AWAITING_PARTS, RESOLVED}, not just OPEN), and an ended_at of 2026-08-11T01:00:00Z on an event pinned to service_date 2026-08-10 is 422 ERR_DOWNTIME_SPANS_SERVICE_DATES even though it is strictly later than started_at; once the event is closed a fresh event is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-08-11T02:00:00Z. One attraction. One event started 2026-08-10T22:00:00Z and diagnosed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T02:00:00.000Z" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
            - call: "POST /park-ops/attractions"
              payload: { name: "Span Guard Ride", park_area: "LAGOON", manufacturer: "Mack", model_code: "SG-1", ride_class: "WATER", theoretical_hourly_capacity: 700, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-10T22:00:00.000Z", cause_category: "ELECTRICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d1: "$.data.id" }
            - call: "POST /park-ops/downtime-events/${d1}/diagnose"
              payload: { root_cause_code: "VFD-TRIP" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-11T00:30:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${d1}/resolve"
              payload: { ended_at: "2026-08-11T01:00:00.000Z" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${d1}/resolve"
              payload: { ended_at: "2026-08-10T23:00:00.000Z" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${d1}/close"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a_id}", started_at: "2026-08-11T00:30:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d2: "$.data.id" }
          assert:
            - "Trigger 1: 409 with error_id \"ERR_DOWNTIME_ALREADY_OPEN\"; exactly one DowntimeEvent exists for the attraction"
            - "Trigger 2: 422 with error_id \"ERR_DOWNTIME_SPANS_SERVICE_DATES\"; ${d1} stays DIAGNOSED with ended_at null and duration_minutes null"
            - "Trigger 3: 200; ${d1}.status == \"RESOLVED\", service_date == \"2026-08-10\", duration_minutes == 60, peak_minutes == 0, off_peak_minutes == 60"
            - "Trigger 4: 200; ${d1}.status == \"CLOSED\" and Attraction.ytd_downtime_minutes == 60"
            - "Trigger 5: 201; ${d2}.status == \"OPEN\" and service_date == \"2026-08-11\" (the uniqueness rule only barred a second live event)"

      - name: deferral_is_refused_for_a_recall_action_and_accepted_for_an_advisory_one
        claim_type: conditional_validation
        grounds:
          - "validations[priority 22] ERR_RECALL_NOT_DEFERRABLE"
          - "state_machines.BulletinAction.transitions.PENDING_to_DEFERRED"
        distinguishing_aspect: "Two actions on the same attraction differ only by their parent bulletin's severity: the RECALL child is 409 ERR_RECALL_NOT_DEFERRABLE and stays PENDING, while the ADVISORY child defers successfully and records deferred_until_date - the rule reads through the FK to the parent, not the action's own fields."
        test_recipe:
          setup:
            - "One Chance/DF-1 attraction; one RECALL bulletin and one ADVISORY bulletin for that manufacturer/model, both acknowledged so each fans out one PENDING action onto the attraction."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Deferral Ride", park_area: "KIDS_COVE", manufacturer: "Chance", model_code: "DF-1", ride_class: "FAMILY", theoretical_hourly_capacity: 500, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "BR-REC-1", manufacturer: "Chance", model_code: "DF-1", severity: "RECALL", issued_date: "2026-07-15", compliance_deadline_date: "2026-09-15" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b_rec: "$.data.id" }
            - call: "POST /park-ops/bulletins"
              payload: { bulletin_ref: "BR-ADV-1", manufacturer: "Chance", model_code: "DF-1", severity: "ADVISORY", issued_date: "2026-07-15", compliance_deadline_date: "2026-12-15" }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { b_adv: "$.data.id" }
            - call: "POST /park-ops/bulletins/${b_rec}/acknowledge"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/bulletins/${b_adv}/acknowledge"
              payload: {}
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "GET /park-ops/bulletin-actions"
              payload: { bulletin_id: "${b_rec}" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { act_rec: "$.data[0].id" }
            - call: "GET /park-ops/bulletin-actions"
              payload: { bulletin_id: "${b_adv}" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
              captures: { act_adv: "$.data[0].id" }
          trigger:
            - call: "POST /park-ops/bulletin-actions/${act_rec}/defer"
              payload: { deferral_reason: "Awaiting factory kit", deferred_until_date: "2026-09-01" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
            - call: "POST /park-ops/bulletin-actions/${act_adv}/defer"
              payload: { deferral_reason: "Bundled with the autumn shutdown", deferred_until_date: "2026-11-01" }
              as: MaintenanceManager
              as_user_id: "mgr-1"
          assert:
            - "Trigger 1: 409 with error_id \"ERR_RECALL_NOT_DEFERRABLE\"; BulletinAction.${act_rec}.status stays \"PENDING\" with deferral_count 0 and deferred_until_date null"
            - "Trigger 2: 200; BulletinAction.${act_adv}.status == \"DEFERRED\", deferred_until_date == \"2026-11-01\" and deferral_count == 1"
            - "MaintenanceBulletin.${b_rec}.status == \"ACKNOWLEDGED\" with action_total_count 1 and action_verified_count 0"
            - "Both actions still belong to attraction ${a_id} and neither create touched Attraction.parts_budget_committed_cents"

      - name: regulator_notification_is_refused_for_a_minor_incident_and_the_internal_branch_clears_without_a_reference
        claim_type: conditional_validation
        grounds:
          - "validations[priority 15] ERR_NOTIFICATION_NOT_REQUIRED"
          - "state_machines.IncidentReport.transitions.UNDER_INVESTIGATION_to_INTERNAL_REVIEW_CLOSED"
        distinguishing_aspect: "A MINOR incident enters REPORTED with regulator_notification_due_at null (no automatic hold), and after a manual hold and investigation the notify call is 422 ERR_NOTIFICATION_NOT_REQUIRED; the internal-review branch then clears with regulator_clearance_ref omitted, releasing the hold and leaving notified_late false."
        test_recipe:
          setup:
            - "One attraction and one MINOR incident occurring 2026-08-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Minor Incident Ride", park_area: "KIDS_COVE", manufacturer: "Zamperla", model_code: "MI-1", ride_class: "KIDDIE", theoretical_hourly_capacity: 300, min_operators_required: 1, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /park-ops/incidents"
              payload: { attraction_id: "${a_id}", occurred_at: "2026-08-01T10:00:00.000Z", injury_severity: "MINOR", guest_count_affected: 1, narrative: "Guest scraped a knee on the exit ramp." }
              as: SafetyOfficer
              as_user_id: "safety-1"
              captures: { inc: "$.data.id" }
          trigger:
            - call: "POST /park-ops/incidents/${inc}/hold-ride"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /park-ops/incidents/${inc}/investigate"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /park-ops/incidents/${inc}/notify-regulator"
              payload: { regulator_case_ref: "REG-MINOR-1" }
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /park-ops/incidents/${inc}/close-internal"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
            - call: "POST /park-ops/incidents/${inc}/clear"
              payload: {}
              as: SafetyOfficer
              as_user_id: "safety-1"
          assert:
            - "At creation: IncidentReport.${inc}.status == \"REPORTED\", regulator_notification_due_at == null, Attraction.regulatory_hold == false"
            - "Trigger 1: 200; status == \"RIDE_HELD\", Attraction.regulatory_hold == true, operational_posture == \"HOLD\", suspended_certification_count == 0"
            - "Trigger 3: 422 with error_id \"ERR_NOTIFICATION_NOT_REQUIRED\"; status stays \"UNDER_INVESTIGATION\", regulator_case_ref stays null and notified_at stays null"
            - "Trigger 4: 200; status == \"INTERNAL_REVIEW_CLOSED\" and notified_late == false"
            - "Trigger 5: 200 with no regulator_clearance_ref supplied; status == \"CLEARED_TO_OPERATE\", cleared_at set, Attraction.regulatory_hold == false and operational_posture == \"CLOSED_PENDING_INSPECTION\""

      - name: blank_or_unrecognised_role_headers_return_unauthenticated_before_any_lookup
        claim_type: violation_to_error
        grounds:
          - "validations[priority 1] ERR_UNAUTHENTICATED"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Priority 1 runs before the path-id lookup of priority 3 and before the role membership test of priority 2: a blank X-User-Role, a blank X-User-ID and an unrecognised role such as SuperAdmin all return 401 ERR_UNAUTHENTICATED, and the blank-header call against a non-existent id is 401 rather than 404."
        test_recipe:
          setup:
            - "One attraction so a valid id exists; the non-existent id literal 00000000-0000-4000-8000-000000000000 is never created."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Auth Probe Ride", park_area: "FRONTIER", manufacturer: "Vekoma", model_code: "AU-1", ride_class: "THRILL", theoretical_hourly_capacity: 800, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a_id: "$.data.id" }
          trigger:
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: ""
              as_user_id: "admin-1"
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: ParkOpsAdmin
              as_user_id: ""
            - call: "GET /park-ops/attractions/${a_id}"
              payload: {}
              as: "SuperAdmin"
              as_user_id: "admin-1"
            - call: "GET /park-ops/attractions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              as_user_id: ""
          assert:
            - "Trigger 1 (blank X-User-Role): 401 with error_id \"ERR_UNAUTHENTICATED\""
            - "Trigger 2 (blank X-User-ID): 401 with error_id \"ERR_UNAUTHENTICATED\""
            - "Trigger 3 (role SuperAdmin, not one of the six declared roles): 401 with error_id \"ERR_UNAUTHENTICATED\", never 403 ERR_UNAUTHORIZED"
            - "Trigger 4 (both headers blank AND a non-existent path id): 401 with error_id \"ERR_UNAUTHENTICATED\", never 404 ERR_ATTRACTION_NOT_FOUND"
            - "Every error body is the declared envelope: response_type \"error\" and data holding exactly error_id and message"

      - name: failed_component_from_another_attraction_is_refused_while_the_installed_component_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - "validations[priority 12] ERR_COMPONENT_ATTRACTION_MISMATCH"
          - "endpoints[POST /park-ops/downtime-events/{id}/diagnose]"
        distinguishing_aspect: "Both component ids resolve to live rows, so priority 4 passes and priority 12 is the deciding check: diagnosing an event on attraction A with attraction B's component is 422 ERR_COMPONENT_ATTRACTION_MISMATCH and leaves the event OPEN, while the same call with A's own component succeeds and stamps condition_flag FAILED on exactly that component."
        test_recipe:
          setup:
            - "Two attractions, each with one ESSENTIAL component. One OPEN downtime event on the first attraction."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Mismatch Ride A", park_area: "SKYLINE", manufacturer: "B&M", model_code: "MM-1", ride_class: "THRILL", theoretical_hourly_capacity: 1000, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a1: "$.data.id" }
            - call: "POST /park-ops/attractions"
              payload: { name: "Mismatch Ride B", park_area: "SKYLINE", manufacturer: "B&M", model_code: "MM-2", ride_class: "THRILL", theoretical_hourly_capacity: 1000, min_operators_required: 2, parts_budget_cents: 1000000 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { a2: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a1}", name: "A Lift Chain", component_type: "LIFT_CHAIN", criticality: "ESSENTIAL", ndt_interval_cycles: 500000, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c1: "$.data.id" }
            - call: "POST /park-ops/components"
              payload: { attraction_id: "${a2}", name: "B Lift Chain", component_type: "LIFT_CHAIN", criticality: "ESSENTIAL", ndt_interval_cycles: 500000, ndt_interval_days: 3650 }
              as: ParkOpsAdmin
              as_user_id: "admin-1"
              captures: { c2: "$.data.id" }
            - call: "POST /park-ops/downtime-events"
              payload: { attraction_id: "${a1}", started_at: "2026-08-01T09:00:00.000Z", cause_category: "MECHANICAL" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { d_id: "$.data.id" }
          trigger:
            - call: "POST /park-ops/downtime-events/${d_id}/diagnose"
              payload: { root_cause_code: "CHAIN-STRETCH", failed_component_id: "${c2}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/downtime-events/${d_id}/diagnose"
              payload: { root_cause_code: "CHAIN-STRETCH", failed_component_id: "${c1}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
          assert:
            - "Trigger 1: 422 with error_id \"ERR_COMPONENT_ATTRACTION_MISMATCH\"; DowntimeEvent.${d_id}.status stays \"OPEN\", failed_component_id stays null and ComponentAsset.${c2}.condition_flag stays \"OK\""
            - "Trigger 2: 200; status == \"DIAGNOSED\", root_cause_code == \"CHAIN-STRETCH\", failed_component_id == \"${c1}\""
            - "ComponentAsset.${c1}.condition_flag == \"FAILED\" and ComponentAsset.${c2}.condition_flag == \"OK\""
            - "Attraction.${a1}.operational_posture == \"DOWN\" and Attraction.${a2}.operational_posture == \"CLOSED_PENDING_INSPECTION\""

      - name: sign_off_priority_pair_returns_the_lower_numbered_error
        claim_type: priority_ordering
        grounds:
          - "validations[priority 7]"
          - "validations[priority 8]"
          - "validations[priority 11]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / signoff_state_check_priority_7_wins_over_blocking_item_8_and_segregation_11
          rationale: "That §1.8 instance constructs an inspection that violates the state check, the blocking-item check and segregation of duties simultaneously and asserts only the priority 7 error surfaces, then peels the violations off one at a time."

      - name: shop_bay_windows_conflict_only_through_the_changeover_buffer
        claim_type: temporal_validation
        grounds:
          - "validations[priority 24] ERR_BAY_CAPACITY_CONFLICT"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / shop_bay_closed_windows_collide_through_the_one_day_changeover_buffer
          rationale: "That §1.8 instance places windows one and two days apart on a capacity-1 bay so the buffered collision is detected exactly at the one-day gap and released once an order recommissions."

      - name: parts_budget_ceiling_is_an_aggregate_over_committed_requisitions
        claim_type: aggregate_validation
        grounds:
