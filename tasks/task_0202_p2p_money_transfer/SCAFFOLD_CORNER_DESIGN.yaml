              as_user_id: "${dps_acc}"
              captures: { dps_fs1: $.data.id, dps_code1: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${dps_fs1}/verify"
              payload: { code: "${dps_code1}" }
              as: AccountHolder
              as_user_id: "${dps_acc}"
            - call: "POST /funding-sources"
              payload: { account_id: "${dps_acc}", kind: "BANK", last4: "8888" }
              as: AccountHolder
              as_user_id: "${dps_acc}"
              captures: { dps_fs2: $.data.id, dps_code2: $.data.micro_deposit_code }
            - call: "POST /funding-sources/${dps_fs2}/verify"
