              as: ComplianceOfficer
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "FULL_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "OVERWRITE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Legal name schedule published in advance of any lawful use." }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.d@x.test", child_pseudonym: "child-201", intended_uses: ["PARTICIPATION_CORE"], consent_method: "SIGNED_FORM_RETURN", expected_service_version: "${sv2}" }
              as: ComplianceOfficer
              captures: { consent_id: $.data.id }
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "NOTICE_DELIVERED" }
              as: ComplianceOfficer
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "PENDING_VERIFICATION" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_id}", activity_id: "${act_id}", data_element_code: "FULL_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "UNDER_13" }
              as: PrivacyEngineer
              captures: { err_both_violated: $.data.error_id }
            - call: "POST /consent-requests/${consent_id}/status"
              payload: { to_status: "GRANTED", verification_evidence_code: "FORM-OK-1" }
              as: ComplianceOfficer
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_id}", activity_id: "${act_id}", data_element_code: "FULL_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "UNDER_13" }
              as: PrivacyEngineer
              captures: { err_minimization_only: $.data.error_id }
            - call: "POST /child-data-records"
              payload: { service_id: "${svc_id}", consent_request_id: "${consent_id}", activity_id: "${act_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", age_screen_outcome: "UNDER_13" }
              as: PrivacyEngineer
              captures: { rec_id: $.data.id }
          assert:
            - "${err_both_violated} == ERR_CONSENT_NOT_GRANTED with HTTP 409 (priority 70 wins over the also-violated priority 110)"
            - "${err_both_violated} != ERR_ELEMENT_NOT_REASONABLY_NECESSARY"
            - "${err_minimization_only} == ERR_ELEMENT_NOT_REASONABLY_NECESSARY with HTTP 422 (identical payload, only the consent state changed)"
            - "ChildDataRecord.${rec_id}.status == COLLECTED and ChildDataRecord.${rec_id}.data_element_code == SCREEN_NAME"
            - "ChildDataRecord.${rec_id}.child_pseudonym == child-201 (copied from the consent, not supplied by the caller)"
            - "ChildDataRecord.${rec_id}.retention_days_applied == 30 and ChildDataRecord.${rec_id}.disposal_method_applied == ANONYMIZE"
            - "ChildDataRecord.${rec_id}.disposal_due_at == 2026-08-31T00:00:00Z"
            - "OnlineService.${svc_id}.live_child_data_element_count == 1 and OnlineService.${svc_id}.lifetime_collected_element_count == 1 (the two refused calls created nothing)"

