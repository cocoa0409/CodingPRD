          trigger:
            - call: "POST /plans/${pid}/adopt"
              payload: {}
              as: CommissionChair
              as_user_id: "u_chair"
          assert: ["response error_id == ERR_NO_HELD_HEARING"]

      - name: terminal_plan_reject_again_invalid
        claim_type: Terminal State Lockdown
        grounds:
          - 'state_machines.RedistrictingPlan.UNDER_REVIEW_to_REJECTED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Rejecting an already-REJECTED plan -> 409 ERR_INVALID_STATE; terminal state permits no further transitions."
        test_recipe:
          setup: ["plan submitted then rejected"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jt", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1000, voting_age_population: 800, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Pt" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
