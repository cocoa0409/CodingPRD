              as: BillingSpecialist
              captures: { pred_id: $.data.id }
            - call: "POST /predeterminations/${pred_id}/approve"
              payload: { approved_benefit_cents: 42500, valid_until_date: "2027-01-01" }
              as: BillingSpecialist
              captures: { pred_status: $.data.status }
            # item Y: the BASIC claim that consumes the annual max
            - call: "POST /treatment-plans/${tp_id}/items"
              payload: { cdt_code: "D2394", category: "BASIC", fee_cents: 130000, phase_number: 1, tooth_number: 19 }
              as: Clinician
              captures: { item_y_id: $.data.id }
            - call: "POST /treatment-plans/${tp_id}/propose"
              payload: {}
              as: Clinician
            - call: "POST /treatment-plans/${tp_id}/accept"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "OPERATIVE", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T10:00:00Z", treatment_plan_item_id: "${item_y_id}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /claims"
              payload: { patient_id: "${p_id}", treatment_plan_item_id: "${item_y_id}", patient_coverage_id: "${cov_id}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/attachments"
              payload: { attachment_type: "XRAY", document_ref: "ref://x4" }
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingSpecialist
              captures: { paid: $.data.carrier_paid_cents }
          assert:
            - "Claim.${claim_id}.carrier_paid_cents == 100000"
            - "PatientCoverage.${cov_id}.annual_benefit_used_cents == 100000"
            - "PatientCoverage.${cov_id}.annual_max_reached == true"
            - "Predetermination.${pred_id}.status == REQUIRES_REVALIDATION"

      - name: treatment_plan_cancel_cascade_to_appointment_depth3
        grounds:
          - state_machines.TreatmentPlan.PROPOSED_to_CANCELLED
          - state_machines.TreatmentPlanItem.SCHEDULED_to_CANCELLED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
