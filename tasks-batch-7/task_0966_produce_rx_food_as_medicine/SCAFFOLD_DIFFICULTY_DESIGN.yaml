            - { call: "POST /referrals/${rf}/start-review", payload: {}, as: ProgramAdmin }
            - { call: "POST /referrals/${rf}/approve", payload: {}, as: ProgramAdmin, captures: { en: $.data.enrollment_id } }
            - { call: "POST /programs/${pg}/cycles", payload: { period_index: 1, start_date: "2026-05-01", end_date: "2026-06-01" }, as: ProgramAdmin, captures: { cy: $.data.id } }
            - { call: "POST /cycles/${cy}/open", payload: {}, as: ProgramAdmin }
