            - "ProductSubmission.${sub_q2}.status == 'REVOKED' with revocation_reason == 'COMPLIANCE_ORDER'"
            - "LicenseAgreement.${agr_q2}.approved_sku_count == 0 and distribution_ready == false"
            - "RetailerAuthorization.${auth_q2}.status == 'SUSPENDED' with suspension_reason == 'NO_APPROVED_SKUS'"
            - "TerritoryGrant rows of ${agr_q2} that were GRANTED now read status == 'REVOKED'"
            - "Licensee.${lic_q2}.status is still 'ACTIVE' (the cascade runs downward only)"

      - name: parallel_dimensions_of_license_agreement
        claim_type: parallel
        grounds:
          - state_machines.LicenseAgreement.contract_status
          - state_machines.LicenseAgreement.compliance_posture
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_parallel_dimensions_move_independently
          rationale: "The named §1.8 instance drives both dimensions of the same row and asserts that each moves without implying the other."

      - name: submission_revision_loop_is_cyclic
        claim_type: cyclic
        grounds:
          - state_machines.ProductSubmission.IN_REVIEW_to_REVISION_REQUESTED
