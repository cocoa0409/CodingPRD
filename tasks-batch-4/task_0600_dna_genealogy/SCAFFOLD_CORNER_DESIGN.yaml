      - name: upgrade_with_insufficient_wallet_credit_returns_402
        claim_type: Violation → Error
        grounds: ["validations[priority=25]", "errors[ERR_INSUFFICIENT_CREDIT]", calculations.tier_change_charge]
        distinguishing_aspect: "Wallet of 1000 cents against a PLUS -> PRO upgrade whose charge_total_cents is 5557 at 30/30 remaining days yields ERR_INSUFFICIENT_CREDIT (402); tier stays PLUS and the wallet is untouched."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z. Customer on PLUS (period 2026-05-01 -> 2026-05-31) with wallet_credit_cents = 1000; remaining_days = 30 so prorated_cents = 6000, discount 0.10 -> 5400, fee 157 -> charge_total_cents = 5557."]
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
