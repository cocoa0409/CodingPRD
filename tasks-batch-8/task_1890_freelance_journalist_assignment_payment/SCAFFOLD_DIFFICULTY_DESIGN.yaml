  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_agreement_window_half_open
        grounds:
          - entities.RateAgreement.fields.effective_from
          - entities.RateAgreement.fields.effective_to
          - "validations[priority=16]"
          - state_machines.RateAgreement.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Interval semantics = half-open [effective_from, effective_to): an
          offer at exactly effective_from uses the NEW agreement (100 c/word),
          while an offer at exactly effective_to falls back to the OLD one
          because the new window has not-yet/just-ended membership. Adjacent
          windows (old.effective_to == new.effective_from) never double-cover
          an instant.
        test_recipe:
          setup:
            - "DeskConfig defaults; contributor W with agreement A1 [2026-08-01, 2026-08-15) at 50 c/word, superseded by A2 [2026-08-15, null) at 100 c/word"
            - "Clock at 2026-08-15T00:00:00Z exactly (boundary instant)"
            - "Two DRAFT assignments: one offered at boundary (must pin A2), plus a control offered earlier at 2026-08-14T23:59:59Z (must pin A1)"
          setup_api_calls:
            - call: "POST /freelance-desk/desk-config"
              payload: {}
              as: DeskAdmin
            - call: "POST /freelance-desk/contributors"
              payload: { legal_name: "Window Wes", email: "wes@x.com", tax_residency: "DOMESTIC_US" }
