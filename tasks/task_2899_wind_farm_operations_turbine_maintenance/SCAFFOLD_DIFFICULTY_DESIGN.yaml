            - "every settled agreement reports time_based_availability_pct == 98.3333 from 24 counted downtime hours over a 1440-hour denominator"
            - "ServiceAgreement.${ag_equal_id}.assessed_lda_cents == 0, because a guarantee exactly equal to the basis figure yields shortfall 0.0000 through the max(0, ...) floor"
            - "ServiceAgreement.${ag_one_tick_id}.assessed_lda_cents == 100, from a shortfall of exactly 0.0001 percentage points"
            - "ServiceAgreement.${ag_cap_equal_id}.assessed_lda_cents == 666700, the uncapped figure being exactly the cap so the min is not binding"
            - "ServiceAgreement.${ag_cap_binds_id}.assessed_lda_cents == 666699, one cent below, proving the cap is applied with min after rounding rather than before"
            - "all five agreements end in state IN_SETTLEMENT"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: replacement_creation_legality_is_decided_by_the_spare_parts_stock_state
        grounds:
          - validations[priority=68]
          - validations[priority=73]
          - errors.ERR_SPARE_PART_TYPE_MISMATCH
          - errors.ERR_SPARE_PART_UNAVAILABLE
          - entities.SparePart.fields.status
          - endpoints.POST_/wind-ops/component-replacements
          - endpoints.POST_/wind-ops/spare-parts/{id}/receipts
        distinguishing_aspect: |
          The identical replacement payload is refused, then accepted, without the payload changing
          at all - only the referenced SparePart's stock state moves. It also shows the two
          cross-entity gates ordered: a payload that names a BLADE line with zero stock for a
          GEARBOX replacement violates both 68 and 73 and must report the type mismatch, because
          referential correctness outranks fiscal availability.
        test_recipe:
          setup:
            - "one farm with one ONLINE turbine and one DRAFT MAJOR_COMPONENT work order on it"
            - "spare part GB with component_type GEARBOX, quantity_on_hand 1 and reorder_point 1"
            - "spare part BL with component_type BLADE and quantity_on_hand 0"
            - "the logical clock reads 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /wind-ops/farms"
              payload: { name: "Cedar Draw", region_code: "TX-P", grid_operator_code: "ERCOT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/spare-parts"
              payload: { component_type: "GEARBOX", part_number: "GB-21", quantity_on_hand: 1, lead_time_days: 210, reorder_point: 1, unit_cost_cents: 90000000, uptower_repairable: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { sp_gb_id: $.data.id }
            - call: "POST /wind-ops/spare-parts"
              payload: { component_type: "BLADE", part_number: "BL-4", quantity_on_hand: 0, lead_time_days: 150, reorder_point: 1, unit_cost_cents: 30000000, uptower_repairable: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { sp_bl_id: $.data.id }
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t1_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 10 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_gb_id}", component_type: "GEARBOX", estimated_lift_hours: 12, uptower_labor_hours: 40 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { r1_id: $.data.id }
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_gb_id}", component_type: "GEARBOX", estimated_lift_hours: 12, uptower_labor_hours: 40 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_unavailable: $.data.error_id }
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_bl_id}", component_type: "GEARBOX", estimated_lift_hours: 12, uptower_labor_hours: 40 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_pair: $.data.error_id }
            - call: "POST /wind-ops/spare-parts/${sp_gb_id}/receipts"
              payload: { quantity_received: 1 }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_gb_id}", component_type: "GEARBOX", estimated_lift_hours: 12, uptower_labor_hours: 40 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { r2_id: $.data.id }
          assert:
            - "the first create returns HTTP 201 and SparePart.${sp_gb_id} reads quantity_on_hand 0, quantity_reserved 1, total_units_accounted 1, status OUT_OF_STOCK and procurement_flag true"
            - "the second create, byte-identical to the first, returns HTTP 422 with ${err_unavailable} == ERR_SPARE_PART_UNAVAILABLE"
            - "the third create violates both the type gate and the stock gate and returns HTTP 422 with ${err_pair} == ERR_SPARE_PART_TYPE_MISMATCH, the lower-priority referential rule"
            - "the receipt leaves SparePart.${sp_gb_id} at quantity_on_hand 1, quantity_reserved 1, total_units_accounted 2, status IN_STOCK and procurement_flag false"
            - "the fourth create, again byte-identical to the first, now returns HTTP 201 and ComponentReplacement.${r2_id}.state == PLANNED"
            - "SparePart.${sp_bl_id} is untouched throughout, with quantity_on_hand 0 and quantity_reserved 0"
      - name: forced_stop_on_the_curtailment_dimension_blocks_reset_and_start_on_the_availability_dimension
        grounds:
          - validations[priority=56]
          - errors.ERR_TURBINE_FORCE_STOPPED
          - calculations.remote_reset_eligibility
          - entities.Turbine.fields.curtailment_state
          - state_machines.Turbine.UNCONSTRAINED_to_FORCED_STOP
          - endpoints.POST_/wind-ops/fault-events/{id}/remote-reset
          - endpoints.POST_/wind-ops/work-orders/{id}/start
        distinguishing_aspect: |
          Two endpoints that only ever write the availability dimension are gated by the state of
          the ORTHOGONAL curtailment dimension of the same turbine. Neither the FaultEvent nor the
          WorkOrder changes between the refused and the accepted call - only a CurtailmentOrder on
          a third entity moves from ACTIVE to RELEASED. An implementation that keys the guard on
          availability_state, or that forgets to re-derive curtailment_state on release, fails.
        test_recipe:
          setup:
            - "one farm with one ONLINE, UNCONSTRAINED turbine and one RESETTABLE fault code rule FC-1000 with a 2-per-24h quota and requires_dispatch false"
            - "one AVAILABLE crew certified GWO_BASIC with daily_hours_capacity 12 and max_work_wind_speed_ms 20"
            - "one CONFIRMED weather window on 2026-06-20 forecasting 8 m/s"
