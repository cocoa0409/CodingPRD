          assert:
            - "${c1_pct} == 60"
            - "${c1_resp} == SPLIT"
            - "${c1_cb} == 29991"
            - "${c2_pct} == 100"
            - "${c2_resp} == LAB"
            - "${c2_cb} == 49985"
            - "RemakeCase.${case1_id}.defect_codes == RemakeCase.${case2_id}.defect_codes == [POWER_OUT_OF_TOL, AXIS_OUT_OF_TOL], so the 60-versus-100 divergence is attributable to adjudication_method alone"
            - "RemakeCase.${case1_id}.status == ADJUDICATED and RemakeCase.${case2_id}.status == ADJUDICATED"
            - "RxOrder.${order_id}.remake_count == 2"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: layout_blank_diameter_branches_nonlinearly_on_design_type
        grounds:
          - calculations.frame_layout_geometry
          - entities.FrameLayout.fields.required_blank_diameter_mm
          - entities.FrameLayout.fields.decentration_v_mm
          - entities.LensDesign.fields.design_type
        distinguishing_aspect: |
          Mode (a) combinatorial complexity: required_blank_diameter_mm consumes six inputs (a_mm,
          b_mm, ed_mm, dbl_mm, the two monocular PDs and the fitting height) through a nested
          max()-inside-a-design_type-branch, so the identical trace yields 77.0 mm on a PROGRESSIVE
          design and 67.0 mm on a SINGLE_VISION design even though decentration_v_mm is 6.0 in both.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; plan, patient and an 80.0 mm blank lot configured."
            - "Two designs share a price and tier but differ in design_type: PRG-HI167 (PROGRESSIVE, min fitting height 18.0) and SV-POLY (SINGLE_VISION, min fitting height 14.0)."
            - "Two verified prescriptions with identical powers and PD 61.0; the first carries add_power 2.00 (multifocal), the second carries no add_power so it may be filled single vision."
            - "Two orders, one per design, both with monocular PD 31.0 / 30.0 and fitting height 22.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
            - call: "POST /prescribers"
              payload: { npi: "1234567893", full_name: "Dr Iris Vance", license_state: "CA", max_rx_validity_months: 12 }
              as: LabManager
              as_user_id: "0d000000-0000-4000-8000-000000000001"
