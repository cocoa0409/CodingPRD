  - section: endpoints
    instances:
      - name: staffing_patch_updates_only_supplied_fields
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_centers_center_id_staffing
          - entities.Center.fields.staffing_headroom
          - entities.Center.fields.student_teacher_ratio
        distinguishing_aspect: "A partial staffing PATCH revises only the keys present: certified_teacher_fte 4.00 -> 6.00 and support_staff_fte 2.00 -> 3.00 while max_students_per_teacher stays 12, which lifts staffing_headroom from 48 to 72 and bumps version exactly once."
        test_recipe:
          setup: ["one center with seat_capacity 20, certified_teacher_fte 4.00, support_staff_fte 2.00 and max_students_per_teacher 12, no placements"]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "Cedar AEC", seat_capacity: 20, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
          trigger:
            - call: "PATCH /centers/${ctr_id}/staffing"
              payload: { certified_teacher_fte: 6.00, support_staff_fte: 3.00, expected_center_version: "${ctr_v1}" }
              as: DistrictAdmin
          assert:
            - "HTTP 200 with Center.${ctr_id}.certified_teacher_fte == 6.00 and support_staff_fte == 3.00"
            - "max_students_per_teacher is still 12 because the key was absent from the body"
            - "staffing_headroom == 72 (floor(6.00 * 12) - 0) and student_teacher_ratio == 0.00"
            - "version == ${ctr_v1} + 1, restricted_seat_margin == 2, seats_available == 20 and intake_posture == OPEN"

