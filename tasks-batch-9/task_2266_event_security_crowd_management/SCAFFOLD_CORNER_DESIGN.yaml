  - name: assignment_cost_splits_straight_and_overtime_hours
    claim_type: tiered_pricing
    grounds:
    - calculations.assignment_cost
    - calculations.assignment_cost.constants
    - entities.PostAssignment.fields.line_cost_cents
    - entities.PostAssignment.fields.pay_basis
    - calculations.plan_cost_and_hours_ledger
    distinguishing_aspect: |
      assignment_cost is declared with THREE separately rounded levels and an 8-hour overtime tier, so the claim needs one shift that straddles the tier and one that does not: 10.50 scheduled hours must split into 8.00 straight and 2.50 overtime, each rounded to whole cents SEPARATELY before addition (17600 + 8250 = 25850), while a 7.50-hour shift stays entirely straight at 16500 and carries pay_basis EMPLOYEE_STRAIGHT rather than EMPLOYEE_OT. Both windows start well before NIGHT_START_HOUR 22 and after NIGHT_END_HOUR 6, so the night differential is 0 and cannot mask the tier arithmetic.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - StaffingPlan PUBLISHED with budget_cents 500000 and one PERIMETER post P1 in ZF (required_guard_count 5, min_credential_level 1, window 2026-09-12T12:00:00Z..22:30:00Z)
      - two VERIFIED EMPLOYEE guards GC-7001 and GC-7002 at base_hourly_rate_cents 2200
