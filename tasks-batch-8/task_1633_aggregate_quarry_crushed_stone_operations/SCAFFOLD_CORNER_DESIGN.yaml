      - name: manual_bench_hold_survives_posture_recovery
        claim_type: conditional_cascade
        grounds: [state_machines.Bench, calculations.posture_derivation]
        distinguishing_aspect: "The resume cascade is scoped by hold_reason: a bench held manually (GEOTECH) is NOT auto-released when SUSPENDED lifts; only MSHA_SUSPENSION holds auto-resume."
        test_recipe:
          setup: ["site OPERATING (bond 100000); bench RELEASED then manually held (reason GEOTECH); overdue S&S citation suspends and is then abated"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "BENCH-1400", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /benches/${bench}/hold", payload: { reason: "GEOTECH" }, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /msha-inspections", payload: { site_id: "${site}", inspection_type: "SPOT" }, as: SafetyOfficer, as_user_id: "so-1", captures: { insp: $.data.id } }
            - { call: "POST /msha-citations", payload: { msha_inspection_id: "${insp}", citation_code: "56.14100", s_and_s: true, abatement_due_on: "2026-07-15" }, as: SafetyOfficer, as_user_id: "so-1", captures: { cit: $.data.id } }
            - { call: "POST /msha-citations/${cit}/abate", payload: { abated_on: "2026-08-01" }, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "GET /benches/${bench}", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /benches/${bench}/resume", payload: {}, as: SiteManager, as_user_id: "sm-1" }
          assert:
            - "site posture returned to OPERATING after abate"
            - "Bench.${bench}.status stays ON_HOLD with hold_reason == GEOTECH (manual holds are sticky)"
            - "subsequent POST /benches/${bench}/resume returns it to RELEASED (manual path still available)"

  # ---------------------------------------------------------------------------
  # Section 3: Calculations (correct results, input-set filtering, constants,
  # precision, algorithm-specific boundaries, selectors)
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: gradation_inclusive_band_bounds
        claim_type: boundary_edge
        grounds: [calculations.gradation_result]
        distinguishing_aspect: "Measurements exactly on min_pct (90) and max_pct (10 for the No4 band) PASS — band bounds are inclusive on both ends."
        test_recipe:
          setup: ["site; spec with two bands [90,100] and [0,10]; stockpile"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 }, { sieve: "No4", min_pct: 0, max_pct: 10 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id } }
          trigger:
            - { call: "POST /gradation-tests", payload: { stockpile_id: "${pile}", sampled_at: "2026-08-01T06:00:00Z", sieve_results: [ { sieve: "1.5in", pct_passing: 90 }, { sieve: "No4", pct_passing: 10 } ] }, as: QCTechnician, as_user_id: "qc-1", captures: { t1: $.data.id } }
          assert:
            - "GradationTest.${t1}.result == PASS (90 == min_pct passes; 10 == max_pct passes)"

