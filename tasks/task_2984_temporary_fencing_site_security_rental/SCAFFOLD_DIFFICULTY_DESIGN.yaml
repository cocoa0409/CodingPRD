            - call: "POST /fence-rentals/work-orders/${w3_id}/complete"
              payload: { completed_linear_feet: 500 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { w3_status: "$.data.status"}
            - call: "GET /fence-rentals/products/${p_panel_id}"
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { s4_avail: "$.data.available_count", s4_res: "$.data.reserved_count", s4_dep: "$.data.deployed_count"}
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/contracts/${c_id}/work-orders"
              payload: { work_order_type: "REMOVAL", ordered_linear_feet: 500 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { w4_id: "$.data.id"}
            - call: "POST /fence-rentals/work-orders/${w4_id}/dispatch"
              payload: { crew_id: "${c1_id}", scheduled_start_utc: "2026-08-25T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/work-orders/${w4_id}/complete"
              payload: { completed_linear_feet: 500 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "GET /fence-rentals/reconciliations?contract_id=${c_id}"
              as: YardAuditor
              as_user_id: "ya-001"
              captures: { rec_id: "$.data[0].id"}
            - call: "POST /fence-rentals/reconciliations/${rec_id}/finalize"
              payload: { unit_returns: [ { product_code: "PANEL-CL-10", returned: 50, damaged: 0, missing: 0 } ] }
              as: YardAuditor
              as_user_id: "ya-001"
              captures: { rec_loss: "$.data.loss_charge_cents", rec_damage: "$.data.damage_charge_cents"}
            - call: "GET /fence-rentals/products/${p_panel_id}"
              as: YardAuditor
              as_user_id: "ya-001"
              captures: { s5_avail: "$.data.available_count", s5_res: "$.data.reserved_count", s5_dep: "$.data.deployed_count"}
