  - rule_id: resource_temporal_overlap
    instances:

      - name: supply_room_stop_half_open_interval_plus_turnover_buffer
        grounds:
          - validations[priority=18]
          - errors[ERR_ROOM_WINDOW_CONFLICT]
          - entities.ReplenishmentOrder.fields.stop_arrival_min
          - entities.ReplenishmentOrder.fields.stop_service_minutes
        distinguishing_aspect: |
          Interval semantics A - HALF-OPEN stop windows [arrival, arrival+service)
          on the SUPPLY_ROOM resource, expanded by a 15-minute turnover buffer, keyed
          on (supply_room, service_date) across every PLANNED or DISPATCHED route.
          The first legal arrival after a 480+30 stop is exactly 525; 524 collides.
        test_recipe:
          setup:
            - "One ACUTE supply room with window 360..1080 and one AMBIENT case item with a 100-unit lot."
            - "Two orders for that room, each one line of 10 cases, both submitted and ALLOCATED."
