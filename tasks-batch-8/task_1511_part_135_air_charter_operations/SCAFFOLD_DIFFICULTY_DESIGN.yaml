            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_ck}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
