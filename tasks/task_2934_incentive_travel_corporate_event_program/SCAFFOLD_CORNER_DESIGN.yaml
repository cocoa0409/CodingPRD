  - name: award_tier_is_immutable_with_no_version_and_no_write_path
    claim_type: immutability
    grounds:
    - §1.1 AwardTier.common_fields == false
    - §1.5 the AwardTier endpoint set (POST /award-tiers, GET /award-tiers/{tier_id}, GET /award-tiers)
      — no update or delete endpoint exists
    - §1.4 priority 22 ERR_DUPLICATE_TIER_KEY
    distinguishing_aspect: |-
      AwardTier is declared with common_fields false, so its rows carry no version and no updated_at, no endpoint anywhere in §1.5 can mutate or delete one, and the only way a program's ladder can change shape is by adding a new tier — which is itself constrained by the per-program uniqueness of tier_code and tier_rank.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - A program in DESIGN with PLATINUM (tier_rank 1) and GOLD (tier_rank 2) already created.
      setup_api_calls:
