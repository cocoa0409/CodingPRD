            - call: "POST /api/license-types"
              payload: { code: "CA-ANN6", state_code: "CA", license_class: "RESIDENT", base_price_cents: 3000, min_age: 0, season_start_date: "2026-01-01", season_end_date: "2026-12-31", validity_days: 365 }
              as: ShopManager
              captures: { lt_id: "$.data.id" }
