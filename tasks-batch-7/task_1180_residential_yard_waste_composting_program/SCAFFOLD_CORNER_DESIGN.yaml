  # ===========================================================================
  - section: calculations
    instances:
      - name: entitlement_excludes_rejected_tickets
        claim_type: input_set_filtering
        grounds:
          - "calculations.compost_entitlement"
        distinguishing_aspect: "Only COMPLETED tickets feed the entitlement: a 100-lb COMPLETED ticket plus a 300-lb REJECTED_CONTAMINATION ticket yields exactly 2.50 gallons, not 10.00."
        test_recipe:
          setup: ["universal household ACTIVE; published route; T1 COMPLETED 100 lbs; T2 TAGGED_REJECTED (ticket REJECTED_CONTAMINATION)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-11" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t2: $.data.id } }
            - { call: "POST /pickup-tickets/${t1}/complete", payload: { weight_lbs: 100 }, as: Driver, as_user_id: "drv_1" }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t2}", result: "TAGGED_REJECTED", violation_codes: ["PLASTIC_BAG"] }, as: FieldInspector, as_user_id: "insp_1" }
          trigger:
            - { call: "GET /households/${hh_a}", as: ProgramAdmin, captures: { ent: $.data.compost_entitlement_gallons } }
          assert:
            - "capture ${ent} == 2.5"
            - "Subscription.${sub_a}.strikes_this_season == 1"
            - "Subscription.${sub_a}.status == ACTIVE"

      - name: inventory_excludes_rejected_deliveries
        claim_type: input_set_filtering
        grounds:
          - "calculations.giveback_inventory_derivation"
          - "entities.CompostGivebackEvent.fields.initial_inventory_gallons"
        distinguishing_aspect: "Only ACCEPTED deliveries feed giveback inventory: 4000 lbs ACCEPTED + 8000 lbs REJECTED yields floor(4000 x 0.025) = 100 gallons, not 300."
        test_recipe:
          setup: ["zone with published route; facility; D1 ACCEPTED 4000 lbs (2026-06-15); D2 outcome REJECT 8000 lbs (2026-06-16)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
