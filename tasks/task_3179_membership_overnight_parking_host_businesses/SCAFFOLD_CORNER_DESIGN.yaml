# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over every testable claim in SCAFFOLD.yaml §1.1–§1.7 that §1.8
# does not already cover. Sections and claim_types follow
# references/claim-extraction-guide.md verbatim.
scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: host_creation_applies_declared_defaults_and_derived_zeros
        claim_type: defaults
        grounds:
          - entities.HostBusiness.fields.self_contained_required
          - entities.HostBusiness.fields.arrival_window_start_hour
          - entities.HostBusiness.fields.arrival_window_end_hour
          - endpoints./api/hosts
        distinguishing_aspect: "Omitting the three optional host declarations applies defaults 14, 11 and true while the derived capacity fields start at 0."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default; no hosts exist"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Default Farm", category: "FARM", address_line1: "21 Default Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_df: $.data.id, h_df_self: $.data.self_contained_required, h_df_start: $.data.arrival_window_start_hour, h_df_end: $.data.arrival_window_end_hour, h_df_cap: $.data.effective_capacity, h_df_status: $.data.onboarding_status, h_df_posture: $.data.posture }
          trigger:
            - call: "GET /api/hosts/${h_df}"
              payload: {}
              as: HostOperator
              captures: { h_df_again: $.data.id }
          assert:
            - "HostBusiness.${h_df}.self_contained_required == true, arrival_window_start_hour == 14 and arrival_window_end_hour == 11"
            - "HostBusiness.${h_df}.onboarding_status == \"PENDING_REVIEW\", posture == \"UNAVAILABLE\" and effective_capacity == 0"
            - "HostBusiness.${h_df}.committed_sites == 0, free_sites == 0, electric_site_count == 0 and patronization_credit_cents == 0"
            - "HostBusiness.${h_df}.version == 1 and created_at is a three-fractional-digit ISO 8601 UTC instant"

      - name: member_creation_rejects_missing_required_and_bad_enum
        claim_type: required_fields
        grounds:
          - entities.Member.fields.email
          - entities.Member.fields.plan_tier
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A member payload missing home_state_code or carrying plan_tier ELITE is refused at priority 4 before any member row is created."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default; no members exist"]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "ok@x.com", full_name: "Ok Member", plan_tier: "CLASSIC", home_state_code: "TX" }
              as: Anonymous
              captures: { m_ok: $.data.id }
          trigger:
            - call: "POST /api/members"
              payload: { email: "bad1@x.com", full_name: "Bad One", plan_tier: "CLASSIC" }
              as: Anonymous
              captures: { err_missing: $.data.error_id, msg_missing: $.data.message }
            - call: "POST /api/members"
              payload: { email: "bad2@x.com", full_name: "Bad Two", plan_tier: "ELITE", home_state_code: "TX" }
              as: Anonymous
              captures: { err_enum: $.data.error_id }
          assert:
            - "the first trigger returns error_id \"ERR_INVALID_REQUEST\" with http 400 for the absent home_state_code"
            - "the second trigger returns error_id \"ERR_INVALID_REQUEST\" with http 400 for plan_tier outside {CLASSIC, PLUS, PREMIER}"
            - "GET /api/members returns total_count 1, so neither rejected payload created a row"
            - "Member.${m_ok}.guest_passes_remaining == 0, the CLASSIC allotment"

      - name: duplicate_site_label_and_duplicate_member_email_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_DUPLICATE_SITE_LABEL]
          - errors[ERR_MEMBER_EMAIL_DUPLICATE]
        distinguishing_aspect: "Site labels are unique per host only, so the same label succeeds on a second host, while member email uniqueness is global."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Uniq Farm", category: "FARM", address_line1: "22 Dup Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_u1: $.data.id }
            - call: "POST /api/hosts"
              payload: { legal_name: "Other Farm", category: "FARM", address_line1: "23 Dup Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_u2: $.data.id }
            - call: "POST /api/hosts/${h_u1}/parking-sites"
              payload: { site_label: "LOT-A", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
              captures: { site_u1: $.data.id }
            - call: "POST /api/members"
              payload: { email: "dup@x.com", full_name: "Dup Member", plan_tier: "CLASSIC", home_state_code: "TX" }
              as: Anonymous
              captures: { m_dup: $.data.id }
          trigger:
            - call: "POST /api/hosts/${h_u1}/parking-sites"
              payload: { site_label: "LOT-A", site_class: "PULL_THROUGH", max_vehicle_length_feet: 50, has_electric: true, electric_service_code: "ELECTRIC_30A" }
              as: HostOperator
              captures: { err_label: $.data.error_id }
            - call: "POST /api/members"
              payload: { email: "dup@x.com", full_name: "Another Person", plan_tier: "PLUS", home_state_code: "CA" }
              as: Anonymous
              captures: { err_email: $.data.error_id }
            - call: "POST /api/hosts/${h_u2}/parking-sites"
              payload: { site_label: "LOT-A", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
              captures: { site_u2: $.data.id }
          assert:
            - "the duplicate label on host ${h_u1} returns error_id \"ERR_DUPLICATE_SITE_LABEL\" with http 409"
            - "the duplicate email returns error_id \"ERR_MEMBER_EMAIL_DUPLICATE\" with http 409"
            - "the same label on host ${h_u2} is created, so the uniqueness scope is the host and not the platform"
            - "HostParkingSite.${site_u1}.site_class is still \"BACK_IN\" and max_vehicle_length_feet is still 40, proving the rejected update did not partially apply"

      - name: missing_host_and_missing_stay_return_not_found_left_to_right
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - endpoints./api/hosts/{hostId}
          - endpoints./api/stay-requests/{requestId}
        distinguishing_aspect: "Path ids are validated left to right, so an unknown inner id under a valid host and an unknown outer id are distinguishable by which segment is reported."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Lookup Farm", category: "FARM", address_line1: "24 Find Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_lk: $.data.id }
          trigger:
            - call: "GET /api/hosts/3f1a2b4c-0000-4000-8000-000000000001"
              payload: {}
              as: HostOperator
              captures: { err_host: $.data.error_id }
            - call: "GET /api/stay-requests/3f1a2b4c-0000-4000-8000-000000000002"
              payload: {}
              as: HostOperator
              captures: { err_stay: $.data.error_id }
          assert:
            - "both lookups return error_id \"ERR_RESOURCE_NOT_FOUND\" with http 404"
            - "GET /api/hosts/${h_lk} still returns 200 with legal_name \"Lookup Farm\""
            - "a PATCH against an unknown host returns ERR_RESOURCE_NOT_FOUND before any payload validation, so the not-found gate sits above the business gates"

      - name: host_capacity_and_posture_are_recomputed_from_declared_sites
        claim_type: computed_fields
        grounds:
          - entities.HostBusiness.fields.effective_capacity
          - entities.HostBusiness.fields.posture
          - entities.HostBusiness.fields.electric_site_count
          - calculations.host_effective_capacity
        distinguishing_aspect: "effective_capacity, electric_site_count and posture are server-derived from the declared site rows, so the same host reports 0, then 2, then 3 as sites are added and a site is deactivated."
        test_recipe:
          setup: ["Logical clock advanced to 2026-06-01T00:00:00Z; a TX/FARM host approved with no sites yet"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Derive Farm", category: "FARM", address_line1: "25 Derive Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_dv: $.data.id, h_dv_cap: $.data.effective_capacity, h_dv_posture: $.data.posture }
          trigger:
            - call: "POST /api/hosts/${h_dv}/parking-sites"
              payload: { site_label: "G1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: true, electric_service_code: "ELECTRIC_30A" }
              as: HostOperator
              captures: { site_g1: $.data.id }
            - call: "POST /api/hosts/${h_dv}/parking-sites"
              payload: { site_label: "G2", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
              captures: { site_g2: $.data.id }
            - call: "GET /api/hosts/${h_dv}/capacity_summary"
              payload: {}
              as: HostOperator
              captures: { cap_two: $.data.base_capacity, elec_two: $.data.posture }
            - call: "POST /api/hosts/${h_dv}/parking-sites"
              payload: { site_label: "G3", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: true, electric_service_code: "ELECTRIC_50A" }
              as: HostOperator
              captures: { site_g3: $.data.id }
            - call: "GET /api/hosts/${h_dv}"
              payload: {}
              as: HostOperator
              captures: { host_cap: $.data.effective_capacity, host_elec: $.data.electric_site_count, host_posture: $.data.posture }
          assert:
            - "HostBusiness.${h_dv}.effective_capacity was 0 on creation even though the host has no capacity field in its create payload"
            - "HostBusiness.${h_dv}.effective_capacity == 3 and HostBusiness.${h_dv}.electric_site_count == 2 after the three site declarations"
            - "capacity_summary.base_capacity was 2 before the third site was declared, so the field tracks the site rows rather than a stored counter"
            - "HostBusiness.${h_dv}.posture == \"OPEN\" throughout, because 3 free sites of 3 exceed the ceil(3 * 0.20) = 1 band"
      - name: member_subscription_starts_pending_and_stays_field_inmutable
        claim_type: initial_state
        grounds:
          - entities.Member.fields.subscription_status
          - entities.Member.fields.subscription_status
          - endpoints./api/members
        distinguishing_aspect: "A newly registered member starts PENDING with a full standing score and cannot request a stay until an activation moves it to ACTIVE."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default"]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "new@x.com", full_name: "New Member", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m_new: $.data.id, m_new_status: $.data.subscription_status, m_new_score: $.data.standing_score, m_new_strikes: $.data.strike_count }
            - call: "POST /api/hosts"
              payload: { legal_name: "Pending Farm", category: "FARM", address_line1: "26 Pending Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_pd: $.data.id }
            - call: "POST /api/hosts/${h_pd}/parking-sites"
              payload: { site_label: "P1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_pd}"
              payload: {}
              as: HostOperator
              captures: { h_pd_v: $.data.version }
            - call: "POST /api/hosts/${h_pd}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_pd_v}" }
              as: PlatformAdmin
            - call: "POST /api/members/${m_new}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m_new}"
              captures: { v_new: $.data.id }
          trigger:
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_pd}", member_id: "${m_new}", vehicle_id: "${v_new}", arrival_date: "2026-09-20", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m_new}"
              captures: { err_pending: $.data.error_id }
          assert:
            - "Member.${m_new}.subscription_status == \"PENDING\" on creation with standing_score 100 and strike_count 0"
            - "the stay request returns error_id \"ERR_MEMBER_NOT_ELIGIBLE\" with http 403 while the member is PENDING"
            - "Member.${m_new}.guest_passes_remaining == 2 from the PLUS allotment even before activation"
            - "Member.${m_new}.removal_status == \"NONE\" and version == 1, since registration counted as the initial write"

  # ===========================================================================
  # State machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: stay_request_terminal_state_lockdown_on_checked_out
        claim_type: terminal_state_lockdown
        grounds:
          - entities.StayRequest.fields.request_status
          - errors[ERR_INVALID_STATE]
          - endpoints./api/stay-requests/{requestId}/cancellations
        distinguishing_aspect: "CHECKED_OUT is terminal, so neither cancellation nor a second checkout is admitted once a stay has departed."
        test_recipe:
          setup: ["Logical clock advanced to 2026-06-05T00:00:00Z; a stay confirmed on 2026-06-05 for one night then checked in and checked out"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Terminal Farm", category: "FARM", address_line1: "27 End Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_tm: $.data.id }
            - call: "POST /api/hosts/${h_tm}/parking-sites"
              payload: { site_label: "T1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_tm}"
              payload: {}
              as: HostOperator
              captures: { h_tm_v1: $.data.version }
            - call: "POST /api/hosts/${h_tm}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_tm_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "term@x.com", full_name: "Term Member", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m_tm: $.data.id }
            - call: "POST /api/members/${m_tm}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m_tm}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m_tm}"
              captures: { v_tm: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_tm}", member_id: "${m_tm}", vehicle_id: "${v_tm}", arrival_date: "2026-06-05", nights: 1, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m_tm}"
              captures: { r_tm: $.data.id }
            - call: "GET /api/hosts/${h_tm}"
              payload: {}
              as: HostOperator
              captures: { h_tm_v2: $.data.version }
            - call: "POST /api/stay-requests/${r_tm}/decisions"
              payload: { decision: "CONFIRM", site_id: "T1", expected_host_version: "${h_tm_v2}" }
              as: HostOperator
              as_user_id: "${h_tm}"
            - call: "POST /api/stay-requests/${r_tm}/check_ins"
              payload: {}
              as: HostOperator
              as_user_id: "${h_tm}"
            - call: "GET /api/hosts/${h_tm}"
              payload: {}
              as: HostOperator
              captures: { h_tm_v3: $.data.version }
            - call: "GET /api/hosts/${h_tm}"
              payload: {}
              as: HostOperator
              captures: { h_tm_v4: $.data.version }
          trigger:
            - call: "POST /api/stay-requests/${r_tm}/check_outs"
              payload: {}
              as: HostOperator
              as_user_id: "${h_tm}"
              captures: { r_tm_out: $.data.request_status, r_tm_done: $.data.checked_out_at }
            - call: "POST /api/stay-requests/${r_tm}/cancellations"
              payload: {}
              as: Member
              as_user_id: "${m_tm}"
              captures: { err_cancel: $.data.error_id }
            - call: "POST /api/stay-requests/${r_tm}/check_outs"
              payload: {}
              as: HostOperator
              as_user_id: "${h_tm}"
              captures: { err_reout: $.data.error_id }
          assert:
            - "the checkout returns request_status \"CHECKED_OUT\" with checked_out_at set"
            - "the cancellation returns error_id \"ERR_INVALID_STATE\" with http 409"
            - "the second checkout returns error_id \"ERR_INVALID_STATE\" with http 409"
            - "Member.${m_tm}.total_stays_completed == 1 and StayRequest.${r_tm}.checked_out_at is unchanged by the two rejected calls"

      - name: initial_state_lockdown_of_host_rejection_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - entities.HostBusiness.fields.onboarding_status
          - state_machines.HostBusiness.PENDING_REVIEW_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REJECTED is the only terminal host state, so once a host is rejected no suspension, reinstatement or second decision is admitted."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default; a host rejected from PENDING_REVIEW"]
          setup_api_calls:
            - call: "POST /api/hosts"
              payload: { legal_name: "Rejected Farm", category: "FARM", address_line1: "28 No Rd", state_code: "TX" }
              as: HostOperator
              captures: { h_rj: $.data.id }
            - call: "GET /api/hosts/${h_rj}"
              payload: {}
              as: HostOperator
              captures: { h_rj_v1: $.data.version }
            - call: "POST /api/hosts/${h_rj}/decisions"
              payload: { action: "REJECT", reason: "no amenities declared", expected_host_version: "${h_rj_v1}" }
              as: PlatformAdmin
              captures: { h_rj_status: $.data.onboarding_status, h_rj_posture: $.data.posture }
            - call: "GET /api/hosts/${h_rj}"
              payload: {}
              as: HostOperator
              captures: { h_rj_v2: $.data.version }
          trigger:
            - call: "POST /api/hosts/${h_rj}/decisions"
              payload: { action: "REINSTATE", reason: "second look", expected_host_version: "${h_rj_v2}" }
              as: PlatformAdmin
              captures: { err_reinstate: $.data.error_id }
            - call: "POST /api/hosts/${h_rj}/decisions"
              payload: { action: "SUSPEND", reason: "n/a", expected_host_version: "${h_rj_v2}" }
              as: PlatformAdmin
              captures: { err_suspend: $.data.error_id }
          assert:
            - "HostBusiness.${h_rj}.onboarding_status == \"REJECTED\" and posture == \"SUSPENDED\" after the rejection"
            - "the reinstatement returns error_id \"ERR_INVALID_STATE\" with http 409"
            - "the suspension returns error_id \"ERR_INVALID_STATE\" with http 409"
            - "HostBusiness.${h_rj}.version is unchanged by both rejected calls"

      - name: incident_disposition_is_idempotent_after_resolution
        claim_type: idempotency
        grounds:
          - state_machines.Incident.OPEN_to_UPHELD
          - errors[ERR_INCIDENT_NOT_OPEN]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "An already-resolved incident refuses a second ruling, so the disposition machine is single-shot per incident."
        test_recipe:
          setup: ["Logical clock advanced to 2026-06-01T00:00:00Z; one member with one OPEN MAJOR incident"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "idem@x.com", full_name: "Idem Member", plan_tier: "PLUS", home_state_code: "TX" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /api/members/${m_id}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/incidents"
              payload: { member_id: "${m_id}", host_id: "${m_id}", severity: "MAJOR", narrative: "generator curfew", origin: "MEMBER_REPORT" }
              as: Member
              as_user_id: "${m_id}"
              captures: { inc_id: $.data.id, inc_status: $.data.incident_status }
            - call: "POST /api/incidents/${inc_id}/dispositions"
              payload: { action: "UPHOLD", decided_by_display_name: "Panel A", requested_decision: "UPHOLD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { inc_after: $.data.incident_status, inc_waived: $.data.waived_days_remaining }
          trigger:
            - call: "POST /api/incidents/${inc_id}/dispositions"
              payload: { action: "DISMISS", decided_by_display_name: "Panel B", requested_decision: "DISMISS" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err_second: $.data.error_id }
          assert:
            - "the first ruling returns incident_status \"UPHELD\" with waived_days_remaining 3 for severity MAJOR"
            - "the second ruling returns error_id \"ERR_INCIDENT_NOT_OPEN\" with http 409"
            - "Incident.${inc_id}.incident_status is still \"UPHELD\" and incident_status was not overwritten"
            - "Member.${m_id}.strike_count == 1 and standing_score == 85, so the rejected second ruling moved nothing"

      - name: availability_window_amend_is_a_cyclic_self_transition
        claim_type: cyclic
        grounds:
          - state_machines.HostAvailabilityWindow.ACTIVE_to_ACTIVE
          - state_machines.HostAvailabilityWindow.ACTIVE_to_SCHEDULED
          - endpoints./api/availability-windows/{windowId}/amend
        distinguishing_aspect: "A live window can be amended repeatedly without leaving ACTIVE, and a clock rewind can return it to SCHEDULED for a later re-activation."
        test_recipe:
          setup: ["Logical clock advanced to 2026-10-05T00:00:00Z; an ACTIVE EVENT window 2026-10-01 to 2026-10-20 with capacity_override 20 and reserved_sites 15"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/hosts"
              payload: { legal_name: "Cycle Farm", category: "FARM", address_line1: "29 Cycle Rd", state_code: "TX", self_contained_required: false }
              as: HostOperator
              captures: { h_cy: $.data.id }
            - call: "POST /api/hosts/${h_cy}/parking-sites"
              payload: { site_label: "C1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_cy}"
              payload: {}
              as: HostOperator
              captures: { h_cy_v1: $.data.version }
            - call: "POST /api/hosts/${h_cy}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_cy_v1}" }
              as: PlatformAdmin
            - call: "POST /api/availability-windows"
