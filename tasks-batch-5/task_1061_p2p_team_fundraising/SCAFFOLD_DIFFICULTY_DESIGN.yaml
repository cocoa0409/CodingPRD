              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent pool creation returns HTTP 201 with MatchPool.${pool_2_id}.status == ACTIVE"
            - "MatchPool.${pool_2_id}.starts_at == 2026-08-01T00:00:00Z equals MatchPool.${pool_1_id}.ends_at"
            - "overlapping pool creation returns HTTP 409 with error_id == ERR_MATCH_WINDOW_OVERLAP"
            - "GET /api/match-pools?campaign_id=${camp_id} total_count == 2"

      - name: registration_buffered_closed_windows_touching_is_a_conflict
        grounds:
          - validations[priority=9]
          - errors[ERR_REGISTRATION_TIME_CONFLICT]
          - entities.Event.fields.starts_at
          - entities.Event.fields.ends_at
        distinguishing_aspect: |
          Interval semantics on the Participant resource are CLOSED and BUFFERED by 90 minutes on both sides:
          event A [14:00, 16:00] buffers to [12:30, 17:30] and event B [19:00, 21:00] buffers to [17:30, 22:30],
          so the windows merely touch at 17:30 and the second registration is still rejected.
        test_recipe:
          setup:
            - "PUBLISHED campaign owning event A (2026-09-12T14:00:00Z .. 16:00:00Z) and event B (2026-09-12T19:00:00Z .. 21:00:00Z), both capacity 10."
            - "One ACTIVE participant already holding a RESERVED registration for event A."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_id}", name: "Morning Walk", starts_at: "2026-09-12T14:00:00Z", ends_at: "2026-09-12T16:00:00Z", early_bird_ends_at: "2026-08-01T00:00:00Z", registration_fee_cents: 4000, capacity: 10 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { event_a_id: $.data.id }
            - call: "POST /api/events"
              payload: { campaign_id: "${camp_id}", name: "Evening Run", starts_at: "2026-09-12T19:00:00Z", ends_at: "2026-09-12T21:00:00Z", early_bird_ends_at: "2026-08-01T00:00:00Z", registration_fee_cents: 4000, capacity: 10 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { event_b_id: $.data.id }
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Alice Reyes" }
              as: Anonymous
              captures: { p_id: $.data.id }
            - call: "POST /api/participants/${p_id}/activate"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
            - call: "POST /api/registrations"
              payload: { participant_id: "${p_id}", event_id: "${event_a_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { reg_a_id: $.data.id }
          trigger:
            - call: "POST /api/registrations"
              payload: { participant_id: "${p_id}", event_id: "${event_b_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_REGISTRATION_TIME_CONFLICT"
            - "Event.${event_b_id}.registered_count == 0"
            - "Registration.${reg_a_id}.status == RESERVED (unchanged)"

  - rule_id: compensating_invariant
    instances:
      - name: sponsor_pool_cents_conserved_across_match_and_refund_reversal
        grounds:
          - calculations.match_allocation
          - state_machines.Donation.MATCHED_to_REVERSED
          - entities.MatchPool.fields.allocated_cents
          - entities.MatchPool.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity #1 is sponsor pool cents, pinned as
          MatchPool.allocated_cents + MatchPool.remaining_cents == MatchPool.pool_amount_cents; it reads
          5000 + 0 = 5000 after the settle and 0 + 5000 = 5000 after the compensating refund, with zero drift.
        test_recipe:
          setup:
            - "PUBLISHED campaign with a 5000-cent pool (ratio 0.5, cap 5000, window 2026-07-01 .. 2026-08-01)."
            - "One SETTLED 10000-cent PARTICIPANT-designated donation holding a 5000-cent match, pool EXHAUSTED."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/match-pools"
              payload: { campaign_id: "${camp_id}", sponsor_name: "Northline Bank", pool_amount_cents: 5000, match_ratio: 0.5, per_donation_cap_cents: 5000, min_donation_cents: 0, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-08-01T00:00:00Z" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { pool_id: $.data.id }
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Alice Reyes" }
              as: Anonymous
              captures: { p_id: $.data.id }
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "PARTICIPANT", designation_id: "${p_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/donations/${don_id}/refund"
              payload: { reason: "card dispute" }
              as: PlatformAdmin
            - call: "GET /api/match-pools/${pool_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { remaining_after: $.data.remaining_cents, allocated_after: $.data.allocated_cents }
          assert:
            - "MatchPool.${pool_id}.allocated_cents == 0"
            - "MatchPool.${pool_id}.remaining_cents == 5000"
            - "MatchPool.${pool_id}.allocated_cents + MatchPool.${pool_id}.remaining_cents == 5000 == MatchPool.${pool_id}.pool_amount_cents"
            - "MatchPool.${pool_id}.status == ACTIVE"

      - name: campaign_net_funds_conserved_across_payout_release_and_void
        grounds:
          - calculations.campaign_available_balance
          - state_machines.Payout.APPROVED_to_RELEASED
          - state_machines.Payout.RELEASED_to_VOIDED
          - entities.Campaign.fields.available_balance_cents
        distinguishing_aspect: |
          Conserved quantity #2 is a different kind — campaign net funds, pinned as
          available_balance_cents + reserved_payout_cents + paid_out_cents == lifetime_net_cents; it holds at
          42070 + 0 + 50000 = 92070 after release and 92070 + 0 + 0 = 92070 after the compensating void.
        test_recipe:
          setup:
            - "Organization with payout_account_status VERIFIED."
            - "PUBLISHED campaign with one SETTLED 100000-cent donation and no match pool, so lifetime_net_cents is 92070."
            - "One 50000-cent Payout already RELEASED (reviewed by fr-reviewer-1, approved by fr-reviewer-2)."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/organizations/${org_id}/payout-account"
              payload: { status: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
            - call: "POST /api/campaigns/${camp_id}/payouts"
              payload: { amount_cents: 50000, expected_campaign_version: "${camp_v}", note: "first tranche" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { payout_id: $.data.id }
            - call: "POST /api/payouts/${payout_id}/review"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-1"
            - call: "POST /api/payouts/${payout_id}/approve"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-2"
            - call: "POST /api/payouts/${payout_id}/release"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/payouts/${payout_id}/void"
              payload: { reason: "bank returned the transfer" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { avail_after: $.data.available_balance_cents, paid_after: $.data.paid_out_cents }
          assert:
            - "Payout.${payout_id}.status == VOIDED"
            - "Campaign.${camp_id}.paid_out_cents == 0"
            - "Campaign.${camp_id}.reserved_payout_cents == 0"
            - "Campaign.${camp_id}.available_balance_cents == 92070"
            - "Campaign.${camp_id}.lifetime_net_cents == 92070"
            - "available_balance_cents + reserved_payout_cents + paid_out_cents == lifetime_net_cents == 92070 both before and after the void"
