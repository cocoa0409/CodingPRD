# =====================================================================================
# §1.8  SCAFFOLD DIFFICULTY DESIGN - task_2529 Artist Residency Program Administration
#
# Nine §0.5 Difficulty Rules, 25 instances. Every instance names a distinct mechanism and
# every instance under one rule_id satisfies that rule's differentiation clause:
#
#   dual_variant_calc                  2 instances - different entity domains
#                                        (Application panel scoring / Residency stipend money)
#   combinatorial_formula              3 instances - modes (a) >=3-input non-linear,
#                                        (b) nested rounding order, (c) circular-looking
#                                        dependency with pinned evaluation order
#   non_linear_state_machine           3 instances - cyclic Application, parallel Residency
#                                        axes, cyclic VisaCase (three different entities)
#   transitive_cascade                 2 instances - depth 4 and depth 5, different triggers
#   priority_pair_validation_conflict  3 instances - state<fiscal, safety<temporal,
#                                        state<constraint (three different category pairs)
#   boundary_precision_check           3 instances - numeric threshold / empty-set /
#                                        half-cent precision, three different endpoints
#   cross_entity_state_dependency      3 instances - Residency<-VisaCase,
#                                        PanelAssignment<-Cycle, StipendDisbursement<-Obligation
#   resource_temporal_overlap          3 instances - buffered-closed Studio, half-open
#                                        HousingUnit, aggregate-headcount shared Studio
#   compensating_invariant             3 instances - cycle cents, studio-days, paid-gross
#                                        and withheld-tax ledger pair
#
# Conventions used by every test_recipe below:
#   * The logical clock starts at 2026-08-01T00:00:00Z and is moved only through
#     POST /_clock/set_current_utc.
#   * Two recurring setup chains are named in the `setup:` prose:
#       CHAIN-SHORT  clock -> POST /cycles -> POST /disciplines -> POST /applicants
#                    -> stage OPEN -> POST /residencies -> POST /residencies/{id}/schedule
#                    (an invited residency; needs no application, panel or slate)
#       CHAIN-PANEL  CHAIN-SHORT's first five calls, then POST /applications,
#                    portfolio items, fee waiver, submit, stage SCREENING,
#                    screening-decision ADVANCE, stage PANEL_REVIEW, panelists,
#                    panel assignments, scores
#   * Roles are sent as X-User-Role and actor identity as X-User-ID (`as_user_id`).
#   * Every asserted number is pre-computed from the §1.3 formulas and written as a literal.
# =====================================================================================
scaffold_difficulty_design:

  # ===================================================================================
  # RULE 1 - dual_variant_calc
  # Differentiation: the two instances live in different entity domains. Instance 1 is the
  # Application / PanelAssignment scoring domain (a dimensionless 0..100 rubric score);
  # instance 2 is the Residency / Cycle money domain (integer cents against a funded pool).
  # ===================================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: application_provisional_untrimmed_vs_final_trimmed_panel_score
        grounds: "§1.3 calculations.application_composite_score, variants provisional_screening_score and final_panel_score; §1.1 Application.provisional_screening_score / final_panel_score / scored_panelist_count; §1.2 Application PANEL_REVIEW -> SCORED"
        distinguishing_aspect: |
          Entity domain: Application panel scoring. The two variants read the SAME set of SCORED
          PanelAssignment rows and still disagree, because provisional_screening_score is an
          untrimmed mean with no quorum gate while final_panel_score is quorum-gated and, once
          TRIM_MIN_PANELISTS (4) reviewers have scored, drops exactly one highest and one lowest
          reviewer total before averaging. The divergence is therefore structural (different input
          multiset), not a rounding artefact - and it only appears at the 4th reviewer, so the
          fourth scoring call flips the two fields apart in a single request.
        test_recipe:
          setup: |
            CHAIN-PANEL with panel_quorum = 2 and one discipline SCULPT. Four panelists are
            assigned to the single application. Three of them have already scored, producing
            reviewer totals 82.00, 80.00 and 77.58 (the third panelist's discipline_expertise
            omits SCULPT, so expertise_matched is false and EXPERTISE_MISMATCH_MULTIPLIER 0.90
            applies: (315+243+184+120)/10 = 86.20 * 0.90 = 77.58). Every panelist has an
            affiliation_org different from the applicant's, so P58 never fires.
            After three reviewers: n = 3 < TRIM_MIN_PANELISTS, so both variants agree at
            (82.00+80.00+77.58)/3 = 239.58/3 = 79.86.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 2,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: true,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { artist: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${artist}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms for public plazas",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${artist}"
              captures: { app: "$.data.id" }
            - call: "POST /portfolio-items"
              payload: { application_id: "${app}", media_type: "IMAGE", title: "Plate I", file_size_mb: 12.5,
                         hazardous_materials_declared: false }
              as: Applicant
              as_user_id: "${artist}"
            - call: "POST /portfolio-items"
              payload: { application_id: "${app}", media_type: "IMAGE", title: "Plate II", file_size_mb: 9.0,
                         hazardous_materials_declared: false }
              as: Applicant
              as_user_id: "${artist}"
            - call: "POST /applications/${app}/fee-resolution"
              payload: { action: "WAIVE", reason: "declared income below FEE_WAIVER_INCOME_CEILING_CENTS" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${artist}"
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "SCREENING" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications/${app}/screening-decision"
              payload: { decision: "ADVANCE", note: "advance to panel" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "PANEL_REVIEW" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /panelists"
              payload: { full_name: "Rae One", email: "rae.one@example.org", affiliation_org: "Museum A",
                         discipline_expertise: ["SCULPT"], chair_eligible: false }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { p1: "$.data.id" }
            - call: "POST /panelists"
              payload: { full_name: "Rae Two", email: "rae.two@example.org", affiliation_org: "Museum B",
                         discipline_expertise: ["SCULPT"], chair_eligible: false }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { p2: "$.data.id" }
            - call: "POST /panelists"
              payload: { full_name: "Rae Three", email: "rae.three@example.org", affiliation_org: "Museum C",
                         discipline_expertise: ["PRINT"], chair_eligible: false }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { p3: "$.data.id" }
            - call: "POST /panelists"
              payload: { full_name: "Rae Four", email: "rae.four@example.org", affiliation_org: "Museum D",
                         discipline_expertise: ["SCULPT"], chair_eligible: false }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { p4: "$.data.id" }
            - call: "POST /panel-assignments"
              payload: { application_id: "${app}", panelist_id: "${p1}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { pa1: "$.data.id" }
            - call: "POST /panel-assignments"
              payload: { application_id: "${app}", panelist_id: "${p2}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { pa2: "$.data.id" }
            - call: "POST /panel-assignments"
              payload: { application_id: "${app}", panelist_id: "${p3}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { pa3: "$.data.id" }
            - call: "POST /panel-assignments"
              payload: { application_id: "${app}", panelist_id: "${p4}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { pa4: "$.data.id" }
            - call: "POST /panel-assignments/${pa1}/scores"
              payload: { score_artistic_merit: 9, score_feasibility: 8, score_community_fit: 8,
                         score_technical_readiness: 7, notes: "strong formal command" }
              as: Panelist
              as_user_id: "${p1}"
            - call: "POST /panel-assignments/${pa2}/scores"
              payload: { score_artistic_merit: 8, score_feasibility: 8, score_community_fit: 8,
                         score_technical_readiness: 8, notes: "solid across the board" }
              as: Panelist
              as_user_id: "${p2}"
            - call: "POST /panel-assignments/${pa3}/scores"
              payload: { score_artistic_merit: 9, score_feasibility: 9, score_community_fit: 8,
                         score_technical_readiness: 8, notes: "outside my discipline" }
              as: Panelist
              as_user_id: "${p3}"
          trigger:
            - call: "POST /panel-assignments/${pa4}/scores"
              payload: { score_artistic_merit: 7, score_feasibility: 7, score_community_fit: 7,
                         score_technical_readiness: 7, notes: "competent but unadventurous" }
              as: Panelist
              as_user_id: "${p4}"
            - call: "GET /applications/${app}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "the trigger returns 200 with panelist_total_100 == 70.00 and expertise_matched == true for pa4"
            - "GET /applications/${app} returns scored_panelist_count == 4"
            - "GET /applications/${app} returns provisional_screening_score == 77.40 - the untrimmed mean (82.00+80.00+77.58+70.00)/4 = 309.58/4 = 77.395, round_half_up to 77.40"
            - "GET /applications/${app} returns final_panel_score == 78.79 - the trimmed mean with 82.00 and 70.00 dropped: (80.00+77.58)/2 = 157.58/2 = 78.79"
            - "the two variants therefore differ by exactly 1.39 on identical input data"
            - "before the trigger both fields read 79.86 (n = 3 < TRIM_MIN_PANELISTS, so no trim applies), which proves the divergence is created by crossing the trim threshold and not by the extra reviewer alone"
            - "Application.status is SCORED both before and after the trigger - the variant divergence does not move the state machine"
            - "rank_in_discipline == 1 and is derived from final_panel_score, never from provisional_screening_score"

      - name: residency_provisional_award_vs_final_settled_stipend
        grounds: "§1.3 calculations.residency_stipend_total, variants provisional_award and final_settled; §1.3 calculations.cycle_stipend_ledger; §1.1 Residency.stipend_basis / stipend_total_cents / actual_weeks_in_residence; §1.2 Residency IN_RESIDENCE -> TERMINATED"
        distinguishing_aspect: |
          Entity domain: Residency and Cycle money, in integer cents against a funded pool - a
          completely different domain from instance 1's dimensionless rubric score. Here the two
          variants are selected by Residency.stipend_basis rather than by a reviewer count:
          provisional_award prices the FULL planned session (rate x planned weeks) so the cycle can
          commit the whole award at acceptance, while final_settled prices only the ceil-rounded
          weeks actually served. The switch is a reconciliation, not just a recomputation: the
          difference is released back into Cycle.stipend_uncommitted_cents, so the delta is
          observable on a second entity.
        test_recipe:
          setup: |
            CHAIN-SHORT with a US applicant, stipend_weekly_rate_cents 70000, session
            2026-11-02 for 8 weeks (session_end_date 2026-12-27). Trainings are recorded so
            compliance_status reaches CLEARED (required_training_types is
            ["EQUIPMENT_WELDING", "SAFETY_ORIENTATION"]: SAFETY_ORIENTATION plus one
            EQUIPMENT_<TAG> per discipline capability tag; HAZMAT_HANDLING is absent because an
            invited residency has no application that declared hazardous materials). The clock is
            then moved to the session start so CHECK_IN's `date(now) >= session_start_date`
            precondition holds, and finally to 2026-11-20, 19 days into the session.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 2,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: true,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { artist: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${artist}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "SAFETY_ORIENTATION" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "EQUIPMENT_WELDING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "CHECK_IN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-20T15:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "TERMINATE", reason: "resident left the programme early" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "before the trigger: Residency.stipend_basis == 'PROVISIONAL', stipend_total_cents == 560000 (70000 x 8 planned weeks) and actual_weeks_in_residence == null"
            - "before the trigger: the setup GET /cycles/${cyc} returns stipend_committed_cents == 560000 and stipend_uncommitted_cents == 19440000"
            - "the trigger returns 200 with status == 'TERMINATED', stipend_basis == 'FINAL_SETTLED' and actual_weeks_in_residence == 3 - ceil((2026-11-20 - 2026-11-02 + 1 day) / 7) = ceil(19/7) = 3"
            - "the trigger returns stipend_total_cents == 210000 (70000 x 3 served weeks), i.e. the final_settled variant"
            - "GET /cycles/${cyc} after the trigger returns stipend_committed_cents == 210000 and stipend_uncommitted_cents == 19790000 - exactly 350000 cents released, the provisional/final delta"
            - "stipend_committed_cents + stipend_uncommitted_cents == stipend_pool_cents == 20000000 both before and after, so the reconciliation moves money without creating or destroying any"
            - "the variant is selected by Residency.stipend_basis alone: a residency left IN_RESIDENCE keeps PROVISIONAL pricing even after its planned end date passes"

  # ===================================================================================
  # RULE 2 - combinatorial_formula
  # Differentiation: the three instances occupy three different modes of §0.5's mode set.
  #   (a) >=3 inputs interacting non-linearly     -> stipend_period_split_nested_min_...
  #   (b) nested rounding whose ORDER changes the result -> withholding_round_per_...
  #   (c) circular-looking dependency resolved by a pinned evaluation order -> alumni_reserve_...
  # ===================================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: stipend_period_split_nested_min_produces_short_final_period
        grounds: "§1.3 calculations.stipend_period_split (algorithm chronological); §1.0 constants.STIPEND_PERIOD_WEEKS; §1.5 POST /residencies/{id}/stipend-schedule; §1.1 StipendDisbursement.period_index / period_start_date / period_end_date / gross_cents"
        distinguishing_aspect: |
          MODE (a): three or more inputs interacting non-linearly. period_count, every period's
          weeks_in_period, every period_end_date and every gross_cents are produced by a single
          loop whose body combines FIVE inputs - session_length_weeks, session_start_date,
          session_end_date, the effective weekly rate and STIPEND_PERIOD_WEEKS - through a
          ceil() and TWO different min() clamps that fire on different arguments:
            weeks_in_period  = min(STIPEND_PERIOD_WEEKS, remaining)         # clamps the QUANTITY
            period_end_date  = min(start + 2*7 - 1, session_end_date)        # clamps the DATE
          Nothing here is linear in the week count: 5 weeks does not produce 2.5 periods but 3
          periods whose last one is priced at one week, and the same 5 weeks produces a
          period_end_date that is 7 days earlier than the un-clamped arithmetic would give. A
          naive `gross = rate * 2` per period over-pays by 70000 and a naive
          `period_end = start + 13` runs the schedule past the residency's own session.
        test_recipe:
          setup: |
            CHAIN-SHORT with stipend_weekly_rate_cents 70000 and a FIVE-week session starting
            2026-11-02, so session_end_date = 2026-11-02 + 5*7 - 1 = 2026-12-06. Five weeks is
            not a multiple of STIPEND_PERIOD_WEEKS (2), which is what forces the short final
            period. The Residency.version returned by the schedule call is captured because
            POST /residencies/{id}/stipend-schedule requires expected_residency_version.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 2,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: true,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { artist: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${artist}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 5 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
          trigger:
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v}" }
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "GET /stipend-disbursements?residency_id=${res}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-01"
          assert:
            - "the schedule call returned session_end_date == '2026-12-06' (2026-11-02 + 5*7 - 1)"
            - "the trigger returns 201 and GET /stipend-disbursements?residency_id=${res} returns exactly 3 rows - ceil(5 / 2) = 3, not 2 and not 2.5"
            - "period_index 1: period_start_date == '2026-11-02', period_end_date == '2026-11-15', gross_cents == 140000"
            - "period_index 2: period_start_date == '2026-11-16', period_end_date == '2026-11-29', gross_cents == 140000"
            - "period_index 3: period_start_date == '2026-11-30', period_end_date == '2026-12-06', gross_cents == 70000 - BOTH clamps fire on this row: weeks_in_period = min(2, 1) = 1 prices it at one week, and period_end_date = min(2026-12-13, 2026-12-06) = 2026-12-06 pulls the window in by 7 days"
            - "the three gross_cents values sum to 350000, which equals Residency.stipend_total_cents (70000 x 5) exactly - the split conserves the award"
            - "every row has status == 'SCHEDULED', scheduled_by_user_id == 'fin-01' and tax_form_type == 'W9'"
            - "period_index values are 1, 2, 3 in strictly ascending order and no row's period_end_date exceeds session_end_date"

      - name: withholding_round_per_disbursement_then_sum_versus_round_once
        grounds: "§1.3 calculations.stipend_withholding, variants withheld_actual and statutory_liability; §1.0 constants.WITHHOLDING_EXEMPT_THRESHOLD_CENTS / TREATY_WITHHOLDING_RATE; §1.5 GET /residencies/{id}/tax-report"
        distinguishing_aspect: |
          MODE (b): nested rounding whose ORDER changes the answer. Both variants apply the same
          0.15 treaty rate to the same annual taxable base, and they still disagree by one cent,
          because withheld_actual rounds INSIDE the per-disbursement loop
            sum_i round_half_up(taxable_slice_i * rate)
          while statutory_liability rounds OUTSIDE, once, on the annual aggregate
            round_half_up((annual_gross - threshold) * rate).
          Four slices each landing on x.30 truncate downward four times and lose the fractional
          cents that a single annual rounding keeps, so the gap is a pure artefact of rounding
          ORDER rather than of different inputs. The weekly rate 43751 is chosen precisely so the
          per-payment products land off the cent boundary and the delta is non-zero.
        test_recipe:
          setup: |
            CHAIN-SHORT with a FRENCH applicant flagged treaty_country = true, so
            Applicant.is_international is true, Residency.tax_form_type is '1042S' and the rate
