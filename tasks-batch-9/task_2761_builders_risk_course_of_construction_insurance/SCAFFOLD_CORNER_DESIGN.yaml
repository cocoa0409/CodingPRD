            - "e2 == ERR_POLICY_NOT_FOUND with HTTP 404 - the interest endpoint reports the missing POLICY, not ERR_INTEREST_NOT_FOUND"
            - "e3 == ERR_INVALID_REQUEST with HTTP 400 - with the FK resolvable, the same negative sublimit is now the top-most defect"
            - "GET /builders-risk/policies/${pl1}/coverage-parts returns total_count == 0 and GET /builders-risk/policies/${pl1}/named-insured-interests returns total_count == 0"

      - name: corner_invalid_request_covers_missing_fields_bad_enums_and_negative_money
