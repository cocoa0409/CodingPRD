              captures: { tp_accr: $.data.true_up_accrual_id, tp_delta: $.data.true_up_delta_cents }
          assert:
            - "the response returns HTTP 200 with fiscal_year == 2026 and accepted_period_count == 1"
            - "annual_agop_cents == 20220000, final_incentive_fee_cents == 983000 and provisional_incentive_total_cents == 1922000"
            - "true_up_delta_cents == -939000 — the signed difference, negative because the monthly provisionals overpaid"
            - "true_up_accrual_id is non-null and attached_report_package_id equals ${tp_pkg}, the latest accepted period"
            - "GET /hotel-management/report-packages/${tp_pkg}/fee-accruals with fee_type INCENTIVE and variant FINAL returns pagination.total_count == 1 holding ${tp_accr} with amount_cents == -939000"
            - "the response body carries exactly these eight keys and no id, created_at, updated_at or version — it is a projection, not an entity"

      - name: distribution_execute_while_held
        claim_type: conditional_action
        grounds:
          - endpoints[POST /hotel-management/distributions/{id}/execute]
          - errors[ERR_ACCRUALS_ON_HOLD]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / curable_failure_holds_distributions_then_cure_releases_them
          rationale: "The named §1.8 instance already exercises the blocked execute under distribution_hold and the release after the cure."

  # =========================================================================
  # §1.6 Errors
  # =========================================================================
  - section: errors
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: standard_crud
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - rbac.identity
        distinguishing_aspect: "A request with no role identity at all returns ERR_UNAUTHENTICATED with HTTP 401 and a null data member, distinct from the 403 an authenticated-but-unlisted role receives."
        test_recipe:
          setup:
            - "One ACTIVE agreement so the target path resolves to a real row."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Auth Header Hotel", owner_entity_name: "Auth Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { ah_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${ah_agr}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /hotel-management/agreements/${ah_agr}"
              payload: {}
              as: none
              captures: { ah_err: $.data.error_id }
            - call: "GET /hotel-management/agreements/${ah_agr}"
              payload: {}
              as: BrandStandardsAuditor
              captures: { ah_err2: $.data.error_id }
          assert:
            - "the header-less read returns HTTP 401 with error.error_id == ERR_UNAUTHENTICATED and data == null"
            - "a request carrying a role string outside the four declared roles also returns HTTP 401 ERR_UNAUTHENTICATED, not 403"
            - "the error envelope still carries meta.api_request_id and meta.api_request_timestamp"
            - "the same read with any declared role returns HTTP 200 with ManagementAgreement.${ah_agr}.status == ACTIVE"

      - name: unknown_ids_map_to_entity_specific_not_found_errors
        claim_type: standard_crud
        grounds:
          - errors[ERR_BUDGET_NOT_FOUND]
          - errors[ERR_PACKAGE_NOT_FOUND]
          - errors[ERR_VARIANCE_NOT_FOUND]
          - errors[ERR_CHARGE_NOT_FOUND]
          - errors[ERR_DISTRIBUTION_NOT_FOUND]
          - errors[ERR_CALL_NOT_FOUND]
          - errors[ERR_TEST_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: "Each path segment carries its own not-found code, so nine unknown ids produce nine distinct error_ids rather than one generic 404."
        test_recipe:
          setup:
            - "No fixture rows are needed; every id below is a syntactically valid identifier that matches nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /hotel-management/budgets/bud_missing"
              payload: {}
              as: AssetManager
              captures: { nf_bud: $.data.error_id }
            - call: "GET /hotel-management/report-packages/pkg_missing"
              payload: {}
              as: AssetManager
              captures: { nf_pkg: $.data.error_id }
            - call: "POST /hotel-management/variance-requests/var_missing/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              captures: { nf_var: $.data.error_id }
            - call: "POST /hotel-management/centralized-charges/chg_missing/review"
              payload: { action: "CONTEST" }
              as: AssetManager
              captures: { nf_chg: $.data.error_id }
            - call: "POST /hotel-management/distributions/dst_missing/execute"
              payload: {}
              as: HotelManagerOps
              captures: { nf_dst: $.data.error_id }
            - call: "POST /hotel-management/working-capital-calls/wcc_missing/fund"
              payload: { funded_amount_cents: 500000 }
              as: OwnerRep
              captures: { nf_call: $.data.error_id }
            - call: "POST /hotel-management/performance-tests/tst_missing/cure"
              payload: { action: "ELECT_CURE" }
              as: HotelManagerOps
              captures: { nf_test: $.data.error_id }
            - call: "POST /hotel-management/brand-disputes/dsp_missing/rounds"
              payload: { action: "OWNER_COUNTER" }
              as: OwnerRep
              captures: { nf_disp: $.data.error_id }
            - call: "POST /hotel-management/employment-claims/clm_missing/allocation"
              payload: { action: "ALLOCATE" }
              as: AssetManager
              captures: { nf_clm: $.data.error_id }
          assert:
            - "all nine triggers return HTTP 404 with data == null"
            - "the error_ids are ERR_BUDGET_NOT_FOUND, ERR_PACKAGE_NOT_FOUND, ERR_VARIANCE_NOT_FOUND, ERR_CHARGE_NOT_FOUND, ERR_DISTRIBUTION_NOT_FOUND, ERR_CALL_NOT_FOUND, ERR_TEST_NOT_FOUND, ERR_DISPUTE_NOT_FOUND and ERR_CLAIM_NOT_FOUND respectively"
            - "existence is checked before role authority and before body validity — an unknown id with a well-formed body still yields 404, and an unknown agreement id on POST /hotel-management/agreements/{id}/budgets yields ERR_AGREEMENT_NOT_FOUND rather than ERR_STALE_AGREEMENT_VERSION"

      - name: invalid_state_errors_are_distinct_per_entity
        claim_type: standard_crud
        grounds:
          - errors[ERR_INVALID_BUDGET_STATE]
          - errors[ERR_INVALID_PACKAGE_STATE]
          - errors[ERR_INVALID_CLAIM_STATE]
          - errors[ERR_INVALID_DISPUTE_STATE]
        distinguishing_aspect: "Four out-of-sequence actions on four different entities each return their own ERR_INVALID_*_STATE code with HTTP 409, so the catalog does not collapse them into a shared state error."
        test_recipe:
          setup:
            - "One ACTIVE agreement holding a DRAFT FY2026 budget, a PENDING_REVIEW (2026, 9) package, a FILED employment claim and an OPENED brand dispute."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "State Codes Hotel", owner_entity_name: "State Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { st_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${st_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { st_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${st_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${st_v2}" }
              as: HotelManagerOps
              captures: { st_bud: $.data.id }
            - call: "POST /hotel-management/agreements/${st_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { st_pkg: $.data.id }
            - call: "POST /hotel-management/agreements/${st_agr}/employment-claims"
              payload: { position_class: "GENERAL_MANAGER", claim_amount_cents: 3000000 }
              as: HotelManagerOps
              captures: { st_clm: $.data.id }
            - call: "POST /hotel-management/agreements/${st_agr}/brand-disputes"
              payload: { franchise_requirement_ref: "BRAND-STD-SIGNAGE-2026", estimated_cost_cents: 400000, remediation_start_utc: "2026-09-01T00:00:00Z", remediation_deadline_utc: "2026-12-01T00:00:00Z" }
              as: AssetManager
              captures: { st_disp: $.data.id }
          trigger:
            - call: "POST /hotel-management/budgets/${st_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { is_bud: $.data.error_id }
            - call: "POST /hotel-management/report-packages/${st_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { is_pkg: $.data.error_id }
            - call: "POST /hotel-management/employment-claims/${st_clm}/allocation"
              payload: { action: "REVERSE" }
              as: AssetManager
              captures: { is_clm: $.data.error_id }
            - call: "POST /hotel-management/brand-disputes/${st_disp}/rounds"
              payload: { action: "OWNER_COUNTER" }
              as: OwnerRep
              captures: { is_disp: $.data.error_id }
          assert:
            - "the budget decision on a DRAFT budget returns HTTP 409 ERR_INVALID_BUDGET_STATE — only SUBMITTED budgets are decidable"
            - "the FINANCIAL owner-review before submission returns HTTP 409 ERR_INVALID_PACKAGE_STATE"
            - "REVERSE on a FILED claim returns HTTP 409 ERR_INVALID_CLAIM_STATE"
            - "OWNER_COUNTER on an OPENED dispute returns HTTP 409 ERR_INVALID_DISPUTE_STATE — the manager must respond first"
            - "after all four rejections OperatingBudget.${st_bud}.status == DRAFT, MonthlyReportPackage.${st_pkg}.financial_status == PENDING_REVIEW, EmploymentClaim.${st_clm}.status == FILED and BrandStandardDispute.${st_disp}.status == OPENED with round == 0"

      - name: agreement_not_active_guard_on_a_draft_agreement
        claim_type: standard_crud
        grounds:
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - state_machines.ManagementAgreement.DRAFT_to_ACTIVE
        distinguishing_aspect: "Three unrelated child creations all refuse to attach to a DRAFT agreement with the same ERR_AGREEMENT_NOT_ACTIVE and HTTP 409, and all three succeed unchanged once the agreement is activated."
        test_recipe:
          setup:
            - "One agreement left in DRAFT — created but never activated."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Draft Guard Hotel", owner_entity_name: "Draft Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, initial_working_capital_cents: 0, working_capital_floor_cents: 0 }
              as: PlatformAdmin
              captures: { dg_agr: $.data.id }
          trigger:
            - call: "POST /hotel-management/agreements/${dg_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { dg_err_pkg: $.data.error_id }
            - call: "POST /hotel-management/agreements/${dg_agr}/working-capital-calls"
              payload: { amount_cents: 500000, reason: "FLOOR_RESTORATION" }
              as: HotelManagerOps
              captures: { dg_err_call: $.data.error_id }
            - call: "POST /hotel-management/agreements/${dg_agr}/employment-claims"
              payload: { position_class: "LINE_STAFF", claim_amount_cents: 900000 }
              as: HotelManagerOps
              captures: { dg_err_clm: $.data.error_id }
            - call: "POST /hotel-management/agreements/${dg_agr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /hotel-management/agreements/${dg_agr}/working-capital-calls"
              payload: { amount_cents: 500000, reason: "FLOOR_RESTORATION" }
              as: HotelManagerOps
              captures: { dg_call: $.data.id }
          assert:
            - "all three pre-activation creations return HTTP 409 with error.error_id == ERR_AGREEMENT_NOT_ACTIVE"
            - "GET /hotel-management/agreements/${dg_agr}/working-capital-calls returns pagination.total_count == 0 before activation"
            - "the post-activation call returns HTTP 201 with WorkingCapitalCall.${dg_call}.status == REQUESTED and amount_cents == 500000"
            - "ManagementAgreement.${dg_agr}.status == ACTIVE with version == 2 after activation"
            - "activating an already-ACTIVE agreement is refused; the DRAFT to ACTIVE edge fires exactly once"

  # =========================================================================
  # §1.7 RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: annual_true_up_by_the_owner_rep_is_forbidden
        claim_type: standard_crud
        grounds:
          - rbac[HotelManagerOps]
          - endpoints[POST /hotel-management/agreements/{id}/annual-true-up]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The true-up is a manager-only computation: the owner side is refused with ERR_UNAUTHORIZED and HTTP 403 even though the owner may read every accrual it produces."
        test_recipe:
          setup:
            - "One ACTIVE agreement with an APPROVED FY2026 budget and one FINANCIAL-ACCEPTED (2026, 9) package."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "True Up Role Hotel", owner_entity_name: "Role Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0, working_capital_floor_cents: 0, initial_working_capital_cents: 0 }
              as: PlatformAdmin
              captures: { tr_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${tr_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { tr_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${tr_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${tr_v2}" }
              as: HotelManagerOps
              captures: { tr_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${tr_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${tr_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${tr_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { tr_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${tr_pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${tr_pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/agreements/${tr_agr}"
              payload: {}
              as: OwnerRep
              captures: { tr_v3: $.data.version }
          trigger:
            - call: "POST /hotel-management/agreements/${tr_agr}/annual-true-up"
              payload: { fiscal_year: 2026, expected_agreement_version: "${tr_v3}" }
              as: OwnerRep
              captures: { tr_err: $.data.error_id }
            - call: "POST /hotel-management/agreements/${tr_agr}/annual-true-up"
              payload: { fiscal_year: 2026, expected_agreement_version: "${tr_v3}" }
              as: HotelManagerOps
              captures: { tr_delta: $.data.true_up_delta_cents }
          assert:
            - "the owner-side attempt returns HTTP 403 with error.error_id == ERR_UNAUTHORIZED and creates no FINAL accrual"
            - "the rejected attempt does not consume the version, so the manager's identical body with the same ${tr_v3} succeeds"
            - "the manager's run returns HTTP 200 with true_up_delta_cents == -939000 and final_incentive_fee_cents == 983000"
            - "GET /hotel-management/report-packages/${tr_pkg}/fee-accruals is readable by OwnerRep, so the refusal is write-side only"

      - name: write_endpoints_reject_every_role_outside_their_declared_set_unauthorized
        claim_type: standard_crud
        grounds:
          - rbac[PlatformAdmin]
          - rbac[HotelManagerOps]
          - rbac[AssetManager]
          - rbac[OwnerRep]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Five writes are each attempted by one role that is authentic but not listed on that endpoint; all five return ERR_UNAUTHORIZED with HTTP 403 and leave no trace."
        test_recipe:
          setup:
            - "One ACTIVE agreement holding a SUBMITTED FY2026 budget so every target path resolves."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Role Sweep Hotel", owner_entity_name: "Sweep Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: PlatformAdmin
              captures: { rs_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${rs_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { rs_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${rs_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${rs_v2}" }
              as: HotelManagerOps
              captures: { rs_bud: $.data.id, rs_v3: $.data.version }
            - call: "POST /hotel-management/budgets/${rs_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Rogue Hotel", owner_entity_name: "Rogue Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000 }
              as: HotelManagerOps
              captures: { rs_e1: $.data.error_id }
            - call: "POST /hotel-management/agreements/${rs_agr}/budgets"
              payload: { fiscal_year: 2027, budgeted_revenue_cents: 320000000, budgeted_operating_expenses_cents: 210000000, expected_agreement_version: "${rs_v3}" }
              as: OwnerRep
              captures: { rs_e2: $.data.error_id }
            - call: "POST /hotel-management/budgets/${rs_bud}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              captures: { rs_e3: $.data.error_id }
            - call: "POST /hotel-management/agreements/${rs_agr}/brand-disputes"
              payload: { franchise_requirement_ref: "BRAND-STD-ROGUE", estimated_cost_cents: 400000, remediation_start_utc: "2026-09-01T00:00:00Z", remediation_deadline_utc: "2026-12-01T00:00:00Z" }
              as: HotelManagerOps
              captures: { rs_e4: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OwnerRep
              captures: { rs_e5: $.data.error_id }
          assert:
            - "all five triggers return HTTP 403 with error.error_id == ERR_UNAUTHORIZED"
            - "GET /hotel-management/budgets with agreement_id ${rs_agr} still reports pagination.total_count == 1 — the FY2027 create left nothing behind"
            - "OperatingBudget.${rs_bud}.status is still SUBMITTED with decided_by_user_id null"
            - "GET /hotel-management/agreements/${rs_agr}/brand-disputes returns pagination.total_count == 0"
            - "the rejected clock write leaves the clock at 2026-08-01T00:00:00Z, so OperatingBudget.${rs_bud} is not DEEMED_APPROVED"
            - "ManagementAgreement.${rs_agr}.version is still ${rs_v3} — a 403 never advances the OCC counter"

      - name: charge_review_contest_by_the_manager_is_an_action_role_mismatch
        claim_type: standard_crud
        grounds:
          - validations[priority=32]
          - errors[ERR_ACTION_ROLE_MISMATCH]
          - endpoints[POST /hotel-management/centralized-charges/{id}/review]
        distinguishing_aspect: "Both AssetManager and HotelManagerOps may call the review endpoint, but the actions are split by side: the manager contesting its own charge returns ERR_ACTION_ROLE_MISMATCH with HTTP 403, which is a different code from ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "One ACTIVE agreement with an APPROVED FY2026 budget and a SUBMITTED (2026, 9) package carrying a DISCLOSED 300000 RESERVATIONS charge."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Action Split Hotel", owner_entity_name: "Split Owner LLC", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, centralized_services_cap_pct: 0.015 }
              as: PlatformAdmin
              captures: { as_agr: $.data.id }
            - call: "POST /hotel-management/agreements/${as_agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { as_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${as_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${as_v2}" }
              as: HotelManagerOps
              captures: { as_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${as_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${as_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${as_agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { as_pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${as_pkg}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 6000000, hotel_basis_share: 0.05 }
              as: HotelManagerOps
              captures: { as_chg: $.data.id }
            - call: "POST /hotel-management/report-packages/${as_pkg}/submit"
              payload: {}
              as: HotelManagerOps
          trigger:
            - call: "POST /hotel-management/centralized-charges/${as_chg}/review"
              payload: { action: "CONTEST", note: "manager contesting its own allocation" }
              as: HotelManagerOps
              captures: { as_err1: $.data.error_id }
            - call: "POST /hotel-management/centralized-charges/${as_chg}/review"
              payload: { action: "CONTEST", note: "owner contests the reservation pool basis" }
              as: AssetManager
            - call: "POST /hotel-management/centralized-charges/${as_chg}/review"
              payload: { action: "ADJUST", adjusted_amount_cents: 250000 }
              as: AssetManager
              captures: { as_err2: $.data.error_id }
