            - "Exactly 1 OutageEvent row exists for participant ${pa_id} after the refused declaration"
            - "The buffer edge admits: the same declaration with started_at 2026-08-03T12:15:00Z (clock moved to 12:15) returns HTTP 201 with status DECLARED, while 2026-08-03T12:14:00Z returns 409"
            - "Scope crosses: a NETWORK_WIDE declaration with started_at 2026-08-03T12:10:00Z is also refused with ERR_OUTAGE_WINDOW_CONFLICT because network-wide events overlap participant-scoped ones"

  - rule_id: compensating_invariant
    instances:
      - name: ledger_identity_and_balance_round_trip_after_full_return
        grounds:
          - calculations.position_balance_and_availability
          - state_machines.CreditTransfer.RETURN_REQUESTED_to_RETURN_HONORED
          - entities.LiquidityLedgerEntry.fields.sequence_no
          - entities.LiquidityLedgerEntry.fields.balance_after_cents
        distinguishing_aspect: |
          The conserved quantity is the ledger identity itself: current_balance_cents must equal
          opening_balance_cents plus the signed sum of every entry at all times, and a fully
          honored return must restore it to exactly the opening figure using a NEW compensating
          entry rather than by deleting or amending the original debit. Exactly two immutable
          entries must exist with sequence_no 1 and 2 and correct running balance_after_cents, so
          an implementation that "unwinds" the debit drifts from the invariant even though the
          headline balance looks right.
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account opened at 1,200,000,000 cents (warning 1,100,000,000 / critical 1,000,000,000 / floor 200,000,000), a CORPORATE policy and customer account CUST-ALPHA-0001 (baseline 20); Beta Trust Bank (routing 021000089) is LIVE."
            - "Settlement cycle 2026-08-03 is OPEN."
            - "A single transfer T1 for 250,000,000 cents is created at 13:00, accepted, and settled at 13:10, with no sibling transfers of any kind."
            - "Beta lodges a full return request for 250,000,000 cents at 13:20 and the clock is 13:25 at the honor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", account_reference: "CUST-ALPHA-0001", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /participants"
              payload: { legal_name: "Beta Trust Bank", routing_number: "021000089", settlement_agent_reference: "SA-BETA-01", participation_model: "SEND_AND_RECEIVE" }
