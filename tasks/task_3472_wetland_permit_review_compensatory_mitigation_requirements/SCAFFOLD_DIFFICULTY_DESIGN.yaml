            - { call: "POST /wetland-permits/mitigation-banks/${bank_id}/approve", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 7.0 }, as: Applicant, as_user_id: "${ap_id}", captures: { txn_id: "$.data.id" } }
            - { call: "POST /wetland-permits/credit-transactions/${txn_id}/purchase", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/secure-credits", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/applications/${app_id}/render-decision", payload: { outcome: "ISSUE" }, as: DistrictEngineer, as_user_id: "de-9" }
            - { call: "GET /wetland-permits/permits?application_id=${app_id}", as: Reviewer, as_user_id: "rev-1", captures: { perm_id: "$.data[0].id" } }
            - { call: "GET /wetland-permits/monitoring-reports?permit_id=${perm_id}", as: Reviewer, as_user_id: "rev-1", captures: { rep1: "$.data[0].id", rep2: "$.data[1].id" } }
            - { call: "POST /wetland-permits/monitoring-reports/${rep1}/submit", payload: { coverage_start: "2026-10-02T00:00:00Z", coverage_end: "2027-10-02T00:00:00Z", findings_text: "Year 1 findings" }, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/monitoring-reports/${rep1}/review", payload: { outcome: "ACCEPTED" }, as: Reviewer, as_user_id: "rev-1" }
