      - after the create Project.${proj_id}.version == 2
      - after the commit Project.${proj_id}.version == 3
      - after RELEASED_FOR_FAB Project.${proj_id}.version == 4, PurchaseCommitment.${pc_id}.escalation_variant == PROVISIONAL and escalation_accrued == 12909.90
      - after FABRICATING Project.${proj_id}.version is still 4 and the two intervening GETs did not change it
      - after DELIVERED Project.${proj_id}.version == 5, escalation_variant == FINAL and escalation_accrued == 12909.90
      - PurchaseCommitment.${pc_id}.escalation_index_period == "2026-08" and commitment_status == CLOSED
      - MaterialPackage.${pkg_id}.status == CLOSED
      - Project.${proj_id}.escalation_contingency_committed == 12909.90 and escalation_contingency_remaining == 487090.10
      - Project.${proj_id}.committed_total_cost == 1162909.90 and buyout_variance == 37090.10
  - name: cascading_side_effects_a_four_level_chain_is_verified_end_to_end
    claim_type: cascading_side_effects
    grounds:
    - complexity_profile.complexity_layers
    - endpoints[POST /procurement/_clock/set_current_utc]
    excluded_because:
      difficulty_instance: transitive_cascade / clock_sweep_expires_quote_lapses_clause_voids_po_stalls_package
      rationale: The §1.8 instance asserts all four hops of the deepest chain in the scaffold, in order, from a single write.
  - name: dual_variant_calculation_both_variants_and_the_delta_on_the_switch
    claim_type: dual_variant_calculation
    grounds:
    - complexity_profile.complexity_layers
    - calculations.escalation_adjustment.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / escalation_provisional_at_release_versus_final_at_delivery
      rationale: The §1.8 instance computes both variants on one commitment and asserts the ledger delta the variant switch produces.
  - name: rate_threshold_triggers_the_cumulative_band_is_tested_at_its_boundary
    claim_type: rate_threshold_triggers
    grounds:
    - complexity_profile.complexity_layers
    - calculations.supplier_exposure_score.constants
    excluded_because:
      difficulty_instance: boundary_precision_check / supplier_exposure_high_band_at_exactly_sixty_blocks_commitment
      rationale: The §1.8 instance sits exactly on the 60.00 HIGH boundary and pairs it with a 59.84 sibling that passes, and its companion instance does the same for the 90-day long-lead threshold.
- section: consistency_model
  instances:
  - name: immediate_the_delivery_response_already_carries_the_final_variant_and_the_closures
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - state_machines.PurchaseCommitment.FABRICATING_to_DELIVERED
    - calculations.escalation_adjustment
    distinguishing_aspect: consistency_model is immediate, so the DELIVERED write's own response body — not a later read — already shows escalation_variant FINAL at 12909.90, commitment_status CLOSED and the closed package; the follow-up GET is field-for-field identical, proving nothing is denormalised with a lag.
