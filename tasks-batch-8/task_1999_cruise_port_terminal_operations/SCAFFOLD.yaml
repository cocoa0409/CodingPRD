# =============================================================================
# Task 1999 — Cruise Port Terminal Operations — SCAFFOLD (§1.0–§1.7)
# =============================================================================

scenario: |
  1999. Cruise Port Terminal Operations (PortMiami cruise terminal): vessel berth assignment & turnaround window, embarkation/debarkation flow & security screening staffing, baggage handling & mis-tag resolution, customs & immigration coordination, provisioning/waste offload scheduling, terminal fee & passenger head tax billing, taxi/ground transport queue, weather/vessel-delay contingency

domain_name: cruise-port-terminal-ops
api_prefix: "/port-ops"

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all FKs by body field)
# =============================================================================
entities:
  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Terminal display name" }
      - { name: max_apron_slots, type: integer, source: input, description: "Max service orders concurrently IN_PROGRESS across the terminal apron", constraints: ">= 1" }
      - { name: taxi_dispatch_capacity_per_window, type: integer, source: input, description: "Max transport dispatches per 15-minute window per terminal", constraints: ">= 1" }
      - { name: occupied_berth_count, type: integer, source: computed, description: "Count of distinct berths holding a BerthAssignment in status ACTIVE" }
      - { name: active_berth_count, type: integer, source: computed, description: "Count of Berth rows of this terminal in status ACTIVE" }
      - { name: free_berth_count, type: integer, source: computed, description: "= active_berth_count - occupied_berth_count" }
      - { name: posture, type: enum, source: computed, description: "OPERATIONAL | CONSTRAINED | EMERGENCY — see calculation terminal_posture", constraints: "OPERATIONAL|CONSTRAINED|EMERGENCY" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone checkpoint counter incremented by run-ops" }

  - name: Berth
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; owning terminal" }
      - { name: berth_code, type: string, source: input, description: "Human berth label; unique per terminal", constraints: "unique within terminal_id" }
      - { name: length_ft, type: integer, source: input, description: "Usable berth face length in feet", constraints: ">= 100" }
      - { name: max_draft_ft, type: number, source: input, description: "Maximum vessel draft in feet", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE", constraints: "ACTIVE|OUT_OF_SERVICE" }

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; home terminal" }
      - { name: name, type: string, source: input, description: "Vessel name" }
      - { name: loa_ft, type: integer, source: input, description: "Length overall in feet", constraints: ">= 50" }
      - { name: draft_ft, type: number, source: input, description: "Maximum draft in feet", constraints: "> 0" }
      - { name: pax_capacity, type: integer, source: input, description: "Passenger capacity", constraints: ">= 1" }
      - { name: crew_count, type: integer, source: input, description: "Crew complement", constraints: ">= 0" }

  - name: PortCall
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; terminal hosting the call" }
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; calling vessel (VesselAgent identity scope)" }
      - { name: voyage_ref, type: string, source: input, description: "Voyage reference; unique per terminal", constraints: "unique within terminal_id" }
      - { name: scheduled_eta, type: datetime, source: input, description: "Scheduled arrival (ISO8601 UTC)" }
      - { name: scheduled_etd, type: datetime, source: input, description: "Scheduled departure; must satisfy MIN_TURNAROUND_HOURS vs scheduled_eta" }
      - { name: booked_embark_pax, type: integer, source: input, description: "Booked embarking passenger count (provisional billing + staffing input)", constraints: ">= 0" }
      - { name: booked_debark_pax, type: integer, source: input, description: "Booked debarking passenger count (provisional billing input)", constraints: ">= 0" }
      - { name: revised_eta, type: datetime, source: input, description: "Revised ETA recorded by delay; null until first delay", constraints: "nullable" }
      - { name: revised_etd, type: datetime, source: input, description: "Revised ETD recorded by delay; null until first delay", constraints: "nullable" }
      - { name: delay_reason, type: string, source: input, description: "Free-text delay reason; null until first delay", constraints: "nullable" }
      - { name: actual_eta, type: datetime, source: system, description: "Actual arrival timestamp set by arrive; null until ARRIVED", constraints: "nullable" }
      - { name: actual_etd, type: datetime, source: system, description: "Actual departure timestamp set by depart; null until DEPARTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DELAYED | ARRIVED | TURNAROUND | DEPARTED | CLOSED | CANCELLED", constraints: "SCHEDULED|DELAYED|ARRIVED|TURNAROUND|DEPARTED|CLOSED|CANCELLED" }
      - { name: passengers_aboard, type: integer, source: computed, description: "= count of ManifestEntry of this call with status EMBARKED" }
      - { name: bags_aboard, type: integer, source: computed, description: "= count of BaggageItem of this call with status LOADED" }

  - name: BerthAssignment
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call occupying the berth" }
      - { name: berth_id, type: string, source: input, description: "FK -> Berth.id; assigned berth" }
      - { name: window_start, type: datetime, source: input, description: "Occupation window start (half-open, inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Occupation window end (half-open, exclusive)" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | CONFIRMED | ACTIVE | RELEASED | SUPERSEDED | EXPIRED", constraints: "TENTATIVE|CONFIRMED|ACTIVE|RELEASED|SUPERSEDED|EXPIRED" }

  - name: ManifestEntry
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call this passenger moves on" }
      - { name: passenger_ref, type: string, source: input, description: "Booking reference; unique per port call", constraints: "unique within port_call_id" }
      - { name: direction, type: enum, source: input, description: "EMBARK | DEBARK — selects the status flow", constraints: "EMBARK|DEBARK" }
      - { name: cabin_class, type: enum, source: input, description: "STANDARD | PREMIUM | CREW", constraints: "STANDARD|PREMIUM|CREW" }
      - { name: status, type: enum, source: system, description: "EMBARK flow: BOOKED|CHECKED_IN|SCREENED|EMBARKED|NO_SHOW|CANCELLED; DEBARK flow: ABOARD|DISEMBARKED|HELD|CLEARED|CARRIED_AWAY|CANCELLED", constraints: "BOOKED|CHECKED_IN|SCREENED|EMBARKED|NO_SHOW|ABOARD|DISEMBARKED|HELD|CLEARED|CARRIED_AWAY|CANCELLED" }
      - { name: is_taxable, type: boolean, source: computed, description: "= (cabin_class != CREW); CREW exempt from head tax" }

  - name: BaggageItem
    parent: null
    common_fields: true
    fields:
      - { name: manifest_entry_id, type: string, source: input, description: "FK -> ManifestEntry.id; owning passenger movement" }
      - { name: port_call_id, type: string, source: system, description: "FK -> PortCall.id; denormalized from the manifest entry for terminal sweeps" }
      - { name: tag_code, type: string, source: input, description: "Bag tag; unique per port call", constraints: "unique within port_call_id" }
      - { name: status, type: enum, source: system, description: "CHECKED | STAGED | LOADED | DELIVERED | MISTAGGED | RECOVERED | OFFLOADED | CANCELLED", constraints: "CHECKED|STAGED|LOADED|DELIVERED|MISTAGGED|RECOVERED|OFFLOADED|CANCELLED" }

  - name: ScreeningLane
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; terminal operating the lane" }
      - { name: lane_code, type: string, source: input, description: "Lane label; unique per terminal", constraints: "unique within terminal_id" }
      - { name: officers_assigned, type: integer, source: system, description: "Officers currently staffing the lane; set by open, cleared to 0 by close", default: 0 }
      - { name: status, type: enum, source: system, description: "CLOSED | OPEN", constraints: "CLOSED|OPEN" }

  - name: CustomsCase
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; at most one case per port call" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | HELD | CLEARED", constraints: "DRAFT|FILED|HELD|CLEARED" }
      - { name: hold_reason, type: string, source: system, description: "Reason captured on hold; null otherwise", constraints: "nullable" }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call being serviced" }
      - { name: kind, type: enum, source: input, description: "PROVISIONING | WASTE_OFFLOAD", constraints: "PROVISIONING|WASTE_OFFLOAD" }
      - { name: units, type: integer, source: input, description: "Planned units (pallets or tons)", constraints: ">= 1" }
      - { name: window_start, type: datetime, source: input, description: "Requested service window start" }
      - { name: window_end, type: datetime, source: input, description: "Requested service window end" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requester (segregation-of-duties anchor)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approver; null until APPROVED", constraints: "nullable" }
      - { name: surcharge_applied, type: boolean, source: system, default: false, description: "True when approved while terminal posture == CONSTRAINED (10% surcharge)" }
      - { name: actual_units, type: integer, source: input, description: "Actual units moved; set by complete", constraints: "nullable; >= 0" }
      - { name: reject_reason, type: string, source: system, description: "Rejection reason; WINDOW_LOST when cascade-rejected; null until REJECTED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "REQUESTED|APPROVED|REJECTED|IN_PROGRESS|COMPLETED|CANCELLED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; one PROVISIONAL and one FINAL per call" }
      - { name: kind, type: enum, source: system, description: "PROVISIONAL | FINAL", constraints: "PROVISIONAL|FINAL" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | SETTLED | CANCELLED", constraints: "DRAFT|ISSUED|DISPUTED|SETTLED|CANCELLED" }
      - { name: dockage_fee_cents, type: integer, source: computed, description: "See calculation dockage_fee (tiered LOA x billed hours + overtime + late penalty)" }
      - { name: head_tax_cents, type: integer, source: computed, description: "See calculation passenger_head_tax (per-side discount rounding)" }
      - { name: service_fee_cents, type: integer, source: computed, description: "See calculation service_fee (rate x units, CONSTRAINED surcharge)" }
      - { name: adjustments_total_cents, type: integer, source: computed, description: "Sum of posted adjustment credits", default: 0 }
      - { name: gross_cents, type: integer, source: computed, description: "= dockage_fee_cents + head_tax_cents + service_fee_cents; never changes after DRAFT computation except via documented recomputes" }
      - { name: total_cents, type: integer, source: computed, description: "= gross_cents - adjustments_total_cents" }
      - { name: payment_cents, type: integer, source: system, description: "Amount accepted by settle; null until SETTLED", constraints: "nullable" }
      - { name: dispute_reason, type: string, source: system, description: "Reason captured on dispute; null otherwise", constraints: "nullable" }

  - name: TransportSlot
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; queue owner" }
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; debark wave served" }
      - { name: vehicle_class, type: enum, source: input, description: "TAXI | SHUTTLE | PRIVATE", constraints: "TAXI|SHUTTLE|PRIVATE" }
      - { name: party_size, type: integer, source: input, description: "Passengers in the party", constraints: ">= 1" }
      - { name: queue_seq, type: integer, source: system, description: "Per-(terminal, vehicle_class) monotone sequence assigned at creation and requeue; FIFO order key" }
      - { name: requeue_count, type: integer, source: system, default: 0, description: "Number of NO_SHOW -> QUEUED requeues; max 1" }
      - { name: dispatch_window_start, type: datetime, source: system, description: "15-minute window start the slot was dispatched in; null until DISPATCHED", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "QUEUED | DISPATCHED | COMPLETED | NO_SHOW | EXPIRED", constraints: "QUEUED|DISPATCHED|COMPLETED|NO_SHOW|EXPIRED" }

  - name: WeatherAdvisory
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id; affected terminal" }
      - { name: severity, type: enum, source: input, description: "WATCH | WARNING | EMERGENCY", constraints: "WATCH|WARNING|EMERGENCY" }
      - { name: window_start, type: datetime, source: input, description: "Advisory window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Advisory window end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED | EXPIRED", constraints: "ACTIVE|CANCELLED|EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PortCall
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELAYED
        trigger: "POST /port-ops/port-calls/{id}/delay"
        actor: VesselAgent
        preconditions:
          - "status == SCHEDULED"
          - "revised_etd - revised_eta >= MIN_TURNAROUND_HOURS (ERR_TURNAROUND_TOO_SHORT)"
        side_effects:
          - "revised_eta / revised_etd / delay_reason recorded"
          - "increments PortCall.version by 1"
        note: "Cyclic revision loop with confirm-revised"
      - from: DELAYED
        to: SCHEDULED
        trigger: "POST /port-ops/port-calls/{id}/confirm-revised"
        actor: Harbormaster
        preconditions:
          - "status == DELAYED"
        side_effects:
          - "scheduled_eta := revised_eta; scheduled_etd := revised_etd"
          - "CASCADE hop 1: this call's CONFIRMED BerthAssignment whose window no longer contains [scheduled_eta, scheduled_etd] -> SUPERSEDED (berth window released)"
          - "CASCADE hop 2 (caused by hop 1): this call's ServiceOrders in {REQUESTED, APPROVED} whose [window_start, window_end] is not contained in any remaining live (TENTATIVE|CONFIRMED|ACTIVE) assignment window of this call -> REJECTED with reject_reason WINDOW_LOST"
          - "CASCADE hop 3 (caused by hop 2): the call's PROVISIONAL Invoice in DRAFT recomputes service_fee_cents (rejected orders contribute 0), gross_cents, total_cents"
          - "increments PortCall.version by 1"
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /port-ops/port-calls/{id}/arrive"
        actor: Harbormaster
        preconditions:
          - "status == SCHEDULED"
          - "a CONFIRMED BerthAssignment exists for this call (ERR_INVALID_STATE)"
          - "window_start <= actual_eta <= window_end on that assignment (ERR_WINDOW_NOT_CONTAINED)"
        side_effects:
          - "actual_eta := payload actual_eta"
          - "that BerthAssignment CONFIRMED -> ACTIVE"
          - "Terminal occupied_berth_count / free_berth_count / posture recomputed"
          - "increments PortCall.version by 1"
      - from: ARRIVED
        to: TURNAROUND
        trigger: "POST /port-ops/port-calls/{id}/begin-turnaround"
        actor: TerminalOperator
        preconditions:
          - "status == ARRIVED"
          - "sum of officers_assigned over OPEN ScreeningLanes of this terminal >= required_officers per screening_staffing_requirement (ERR_SCREENING_CAPACITY)"
        side_effects:
          - "increments PortCall.version by 1"
      - from: TURNAROUND
        to: DEPARTED
        trigger: "POST /port-ops/port-calls/{id}/depart"
        actor: Harbormaster
        preconditions:
          - "status == TURNAROUND"
          - "Terminal posture != EMERGENCY (ERR_POSTURE_EMERGENCY)"
          - "the call's CustomsCase status == CLEARED (ERR_CUSTOMS_NOT_CLEARED)"
          - "no BaggageItem of this call in {MISTAGGED, RECOVERED} (ERR_OPEN_MISTAGS)"
          - "every ServiceOrder of this call in {COMPLETED, REJECTED, CANCELLED} (ERR_OPEN_SERVICE_ORDERS)"
        side_effects:
          - "actual_etd := payload actual_etd"
          - "the ACTIVE BerthAssignment -> RELEASED; Terminal occupancy/posture recomputed"
          - "CASCADE hop 1: ManifestEntries direction=EMBARK in {BOOKED, CHECKED_IN, SCREENED} -> NO_SHOW; direction=DEBARK in ABOARD -> CARRIED_AWAY"
          - "CASCADE hop 2 (caused by hop 1): BaggageItems of each newly NO_SHOW entry in {CHECKED, STAGED} -> OFFLOADED"
          - "passengers_aboard / bags_aboard recomputed"
          - "increments PortCall.version by 1"
      - from: DEPARTED
        to: CLOSED
        trigger: "POST /port-ops/port-calls/{id}/close"
        actor: BillingClerk
        preconditions:
          - "status == DEPARTED"
        side_effects:
          - "creates the FINAL Invoice in DRAFT with computed dockage_fee_cents / head_tax_cents / service_fee_cents / gross_cents / total_cents (FINAL variants)"
          - "increments PortCall.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /port-ops/port-calls/{id}/cancel"
        actor: "VesselAgent (scope) | Harbormaster"
        preconditions:
          - "status in {SCHEDULED, DELAYED}"
        side_effects:
          - "live BerthAssignment (TENTATIVE|CONFIRMED) -> SUPERSEDED"
          - "ServiceOrders in {REQUESTED, APPROVED} -> CANCELLED"
          - "QUEUED TransportSlots of this call -> EXPIRED"
          - "DRAFT/ISSUED PROVISIONAL Invoice -> CANCELLED"
          - "non-terminal ManifestEntries -> CANCELLED; non-terminal BaggageItems of this call -> CANCELLED"
          - "increments PortCall.version by 1"
      - from: DELAYED
        to: CANCELLED
        trigger: "POST /port-ops/port-calls/{id}/cancel"
        actor: "VesselAgent (scope) | Harbormaster"
        preconditions: []
        side_effects: ["same side-effect set as SCHEDULED -> CANCELLED"]

  - entity: BerthAssignment
    initial_state: TENTATIVE
    terminal_states: [RELEASED, SUPERSEDED, EXPIRED]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /port-ops/berth-assignments/{id}/confirm"
        actor: Harbormaster
        preconditions:
          - "status == TENTATIVE"
          - "Terminal posture != EMERGENCY (ERR_POSTURE_EMERGENCY)"
          - "Berth status == ACTIVE (ERR_INVALID_STATE)"
          - "berth fit: Berth.length_ft >= Vessel.loa_ft + LOA_SAFETY_MARGIN_FT and Berth.max_draft_ft >= Vessel.draft_ft (ERR_BERTH_NOT_FIT)"
          - "containment: window_start <= PortCall.scheduled_eta and window_end >= PortCall.scheduled_etd (ERR_WINDOW_NOT_CONTAINED)"
          - "buffered overlap: no other BerthAssignment on the same berth in {CONFIRMED, ACTIVE} violating the BERTH_BUFFER_MINUTES gap rule (ERR_BERTH_WINDOW_CONFLICT)"
        side_effects: []
      - from: CONFIRMED
        to: ACTIVE
        trigger: "system (side effect of PortCall arrive)"
        actor: system
        preconditions: []
        side_effects: ["Terminal occupied_berth_count / free_berth_count / posture recomputed"]
      - from: ACTIVE
        to: RELEASED
        trigger: "system (side effect of PortCall depart)"
        actor: system
        preconditions: []
        side_effects: ["Terminal occupied_berth_count / free_berth_count / posture recomputed"]
      - from: TENTATIVE
        to: SUPERSEDED
        trigger: "system (a new BerthAssignment is created for the same PortCall, or the call is cancelled, or confirm-revised containment fails)"
        actor: system
        preconditions: []
        side_effects: ["berth window released"]
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system (same triggers as TENTATIVE -> SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "berth window released"
          - "chain: non-terminal ServiceOrders whose window is no longer contained in a live assignment -> REJECTED (WINDOW_LOST); DRAFT PROVISIONAL invoice service fees recomputed"
      - from: TENTATIVE
        to: EXPIRED
        trigger: "system (run-ops when window_start <= logical now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Berth
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "POST /port-ops/berths/{id}/out-of-service"
        actor: PortAuthorityAdmin
        preconditions:
          - "no BerthAssignment on this berth in status ACTIVE (ERR_INVALID_STATE)"
        side_effects: ["Terminal active_berth_count / free_berth_count / posture recomputed; TENTATIVE assignments on this berth are unaffected until confirm"]
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "POST /port-ops/berths/{id}/return-to-service"
        actor: PortAuthorityAdmin
        preconditions: []
        side_effects: ["Terminal active_berth_count / free_berth_count / posture recomputed"]

  - entity: ManifestEntry
    initial_state: "BOOKED (direction=EMBARK) | ABOARD (direction=DEBARK)"
    terminal_states: [EMBARKED, NO_SHOW, CLEARED, CARRIED_AWAY, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /port-ops/manifest-entries/{id}/check-in"
        actor: TerminalOperator
        preconditions:
          - "direction == EMBARK (ERR_MANIFEST_DIRECTION)"
          - "PortCall.status in {SCHEDULED, ARRIVED, TURNAROUND} (ERR_INVALID_STATE)"
        side_effects: []
      - from: CHECKED_IN
        to: SCREENED
        trigger: "POST /port-ops/manifest-entries/{id}/screen"
        actor: TerminalOperator
        preconditions:
          - "direction == EMBARK (ERR_MANIFEST_DIRECTION)"
          - "PortCall.status in {ARRIVED, TURNAROUND} (ERR_INVALID_STATE)"
          - "at least one ScreeningLane of the terminal OPEN with officers_assigned >= 1 (ERR_SCREENING_CAPACITY)"
        side_effects: []
      - from: SCREENED
        to: EMBARKED
        trigger: "POST /port-ops/manifest-entries/{id}/board"
        actor: TerminalOperator
        preconditions:
          - "direction == EMBARK (ERR_MANIFEST_DIRECTION)"
          - "PortCall.status == TURNAROUND (ERR_INVALID_STATE)"
          - "the call's CustomsCase status == CLEARED (ERR_CUSTOMS_NOT_CLEARED)"
        side_effects:
          - "PortCall.passengers_aboard += 1"
      - from: EMBARKED
        to: CHECKED_IN
        trigger: "POST /port-ops/manifest-entries/{id}/offload"
        actor: TerminalOperator
        preconditions:
          - "direction == EMBARK (ERR_MANIFEST_DIRECTION)"
          - "PortCall.status == TURNAROUND (ERR_INVALID_STATE)"
        side_effects:
          - "PortCall.passengers_aboard -= 1"
          - "CASCADE hop 1: this entry's BaggageItems in LOADED -> OFFLOADED"
          - "CASCADE hop 2 (caused by hop 1): PortCall.bags_aboard decremented per offloaded bag"
        note: "Compensating action of board; passengers_aboard conserved"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (side effect of PortCall depart)"
        actor: system
        preconditions: []
        side_effects: ["entry's bags in {CHECKED, STAGED} -> OFFLOADED"]
      - from: CHECKED_IN
        to: NO_SHOW
        trigger: "system (side effect of PortCall depart)"
        actor: system
        preconditions: []
        side_effects: ["entry's bags in {CHECKED, STAGED} -> OFFLOADED"]
      - from: SCREENED
        to: NO_SHOW
        trigger: "system (side effect of PortCall depart)"
        actor: system
        preconditions: []
        side_effects: ["entry's bags in {CHECKED, STAGED} -> OFFLOADED"]
      - from: ABOARD
        to: DISEMBARKED
        trigger: "POST /port-ops/manifest-entries/{id}/disembark"
        actor: TerminalOperator
        preconditions:
          - "direction == DEBARK (ERR_MANIFEST_DIRECTION)"
          - "PortCall.status in {ARRIVED, TURNAROUND} (ERR_INVALID_STATE)"
          - "the call's CustomsCase status in {FILED, CLEARED} (ERR_CUSTOMS_HOLD_ACTIVE when HELD)"
        side_effects: []
      - from: DISEMBARKED
        to: HELD
        trigger: "POST /port-ops/manifest-entries/{id}/customs-hold"
        actor: CustomsOfficer
        preconditions:
          - "direction == DEBARK (ERR_MANIFEST_DIRECTION)"
        side_effects: []
      - from: DISEMBARKED
        to: CLEARED
        trigger: "POST /port-ops/manifest-entries/{id}/customs-release"
        actor: CustomsOfficer
        preconditions:
          - "direction == DEBARK (ERR_MANIFEST_DIRECTION)"
        side_effects: []
      - from: HELD
        to: CLEARED
        trigger: "POST /port-ops/manifest-entries/{id}/customs-release"
        actor: CustomsOfficer
        preconditions:
          - "direction == DEBARK (ERR_MANIFEST_DIRECTION)"
        side_effects: []
      - from: ABOARD
        to: CARRIED_AWAY
        trigger: "system (side effect of PortCall depart)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "system (side effect of PortCall cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ABOARD
        to: CANCELLED
        trigger: "system (side effect of PortCall cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BaggageItem
    initial_state: CHECKED
    terminal_states: [DELIVERED, OFFLOADED, CANCELLED]
    transitions:
      - from: CHECKED
        to: STAGED
        trigger: "POST /port-ops/baggage-items/{id}/stage"
        actor: TerminalOperator
        preconditions:
          - "ManifestEntry.status in {CHECKED_IN, SCREENED, EMBARKED, DISEMBARKED, CLEARED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: RECOVERED
        to: STAGED
        trigger: "POST /port-ops/baggage-items/{id}/stage"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
        note: "Recovery loop: MISTAGGED -> RECOVERED -> STAGED re-enters normal flow"
      - from: STAGED
        to: LOADED
        trigger: "POST /port-ops/baggage-items/{id}/load"
        actor: TerminalOperator
        preconditions:
          - "ManifestEntry.direction == EMBARK (ERR_MANIFEST_DIRECTION)"
          - "ManifestEntry.status == EMBARKED (ERR_INVALID_STATE) — cross-entity dependency"
          - "PortCall.status == TURNAROUND (ERR_INVALID_STATE)"
        side_effects: ["PortCall.bags_aboard += 1"]
      - from: STAGED
        to: DELIVERED
        trigger: "POST /port-ops/baggage-items/{id}/deliver"
        actor: TerminalOperator
        preconditions:
          - "ManifestEntry.direction == DEBARK (ERR_MANIFEST_DIRECTION)"
          - "ManifestEntry.status == CLEARED (ERR_CUSTOMS_NOT_CLEARED) — cross-entity dependency"
        side_effects: []
      - from: CHECKED
        to: MISTAGGED
        trigger: "POST /port-ops/baggage-items/{id}/report-mistag"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
      - from: STAGED
        to: MISTAGGED
        trigger: "POST /port-ops/baggage-items/{id}/report-mistag"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
      - from: MISTAGGED
        to: RECOVERED
        trigger: "POST /port-ops/baggage-items/{id}/recover"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
      - from: LOADED
        to: OFFLOADED
        trigger: "system (side effect of ManifestEntry offload, or of PortCall depart for bags of NO_SHOW entries still LOADED)"
        actor: system
        preconditions: []
        side_effects: ["PortCall.bags_aboard -= 1"]
      - from: CHECKED
        to: OFFLOADED
        trigger: "system (side effect of PortCall depart for bags of NO_SHOW entries)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STAGED
        to: OFFLOADED
        trigger: "system (side effect of PortCall depart for bags of NO_SHOW entries)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHECKED
        to: CANCELLED
        trigger: "system (side effect of PortCall cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: STAGED
        to: CANCELLED
        trigger: "system (side effect of PortCall cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScreeningLane
    initial_state: CLOSED
    terminal_states: []
    transitions:
      - from: CLOSED
        to: OPEN
        trigger: "POST /port-ops/screening-lanes/{id}/open"
        actor: TerminalOperator
        preconditions:
          - "officers_assigned >= 1 (ERR_VALIDATION)"
        side_effects: ["officers_assigned := payload officers_assigned"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /port-ops/screening-lanes/{id}/close"
        actor: TerminalOperator
        preconditions: []
        side_effects: ["officers_assigned := 0"]

  - entity: CustomsCase
    initial_state: DRAFT
    terminal_states: [CLEARED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /port-ops/customs-cases/{id}/file"
        actor: CustomsOfficer
        preconditions:
          - "PortCall.status in {SCHEDULED, DELAYED, ARRIVED, TURNAROUND} (ERR_INVALID_STATE)"
        side_effects: []
      - from: FILED
        to: HELD
        trigger: "POST /port-ops/customs-cases/{id}/hold"
        actor: CustomsOfficer
        preconditions: []
        side_effects:
          - "hold_reason := payload reason"
          - "CASCADE hop 1: DEBARK ManifestEntries of this call in DISEMBARKED -> HELD"
      - from: HELD
        to: FILED
        trigger: "POST /port-ops/customs-cases/{id}/file"
        actor: CustomsOfficer
        preconditions: []
        side_effects: []
        note: "Revision loop FILED -> HELD -> FILED; each loop re-allows disembark"
      - from: FILED
        to: CLEARED
        trigger: "POST /port-ops/customs-cases/{id}/clear"
        actor: CustomsOfficer
        preconditions: []
        side_effects: []
        note: "Clearing the case does NOT auto-release HELD entries; each needs customs-release"

  - entity: ServiceOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /port-ops/service-orders/{id}/approve"
        actor: "TerminalOperator (posture OPERATIONAL) | Harbormaster (any posture except EMERGENCY)"
        preconditions:
          - "Terminal posture != EMERGENCY (ERR_POSTURE_EMERGENCY)"
          - "when posture == CONSTRAINED, actor role must be Harbormaster (ERR_CONSTRAINED_REQUIRES_HARBORMASTER)"
          - "requested_by_user_id != approver X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
          - "requested window contained in a live (TENTATIVE|CONFIRMED|ACTIVE) BerthAssignment window of the call (ERR_SERVICE_WINDOW_OUTSIDE_BERTH)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "surcharge_applied := (posture == CONSTRAINED)"
          - "DRAFT PROVISIONAL invoice of the call, if present, recomputes service_fee_cents / gross_cents / total_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /port-ops/service-orders/{id}/reject"
        actor: "TerminalOperator | Harbormaster"
        preconditions: []
        side_effects: ["reject_reason := payload reason"]
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /port-ops/service-orders/{id}/start"
        actor: TerminalOperator
        preconditions:
          - "an ACTIVE BerthAssignment exists for the call (ERR_INVALID_STATE)"
          - "count of IN_PROGRESS ServiceOrders across the terminal < Terminal.max_apron_slots (ERR_APRON_CAPACITY)"
          - "contamination: starting PROVISIONING while a WASTE_OFFLOAD of the same call is IN_PROGRESS is forbidden (ERR_WASTE_BEFORE_PROVISIONING)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /port-ops/service-orders/{id}/complete"
        actor: TerminalOperator
        preconditions: []
        side_effects:
          - "actual_units := payload actual_units"
          - "DRAFT PROVISIONAL invoice of the call, if present, recomputes service_fee_cents / gross_cents / total_cents"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /port-ops/service-orders/{id}/cancel"
        actor: "VesselAgent (scope)"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /port-ops/service-orders/{id}/cancel"
        actor: "VesselAgent (scope)"
        preconditions: []
        side_effects: ["DRAFT PROVISIONAL invoice of the call, if present, recomputes service_fee_cents / gross_cents / total_cents"]
      - from: REQUESTED
        to: REJECTED
        trigger: "system (confirm-revised cascade: window lost)"
        actor: system
        preconditions: []
        side_effects: ["reject_reason := WINDOW_LOST; DRAFT PROVISIONAL invoice recomputes"]
      - from: APPROVED
        to: REJECTED
        trigger: "system (confirm-revised cascade: window lost)"
        actor: system
        preconditions: []
        side_effects: ["reject_reason := WINDOW_LOST; DRAFT PROVISIONAL invoice recomputes"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (side effect of PortCall cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "system (side effect of PortCall cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /port-ops/invoices/{id}/issue"
        actor: BillingClerk
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: SETTLED
        trigger: "POST /port-ops/invoices/{id}/settle"
        actor: BillingClerk
        preconditions:
          - "payment_cents == total_cents (ERR_UNDERPAYMENT if less, ERR_OVERPAYMENT if greater)"
        side_effects: ["payment_cents := payload payment_cents"]
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /port-ops/invoices/{id}/dispute"
        actor: "VesselAgent (scope)"
        preconditions: []
        side_effects: ["dispute_reason := payload reason"]
      - from: DISPUTED
        to: ISSUED
        trigger: "system (a posted adjustment resolves the dispute and re-issues at the adjusted total)"
        actor: system
        preconditions: []
        side_effects: ["adjustments_total_cents / total_cents recomputed"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system (side effect of PortCall cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "system (side effect of PortCall cancel; PROVISIONAL only — a FINAL ISSUED invoice survives cancel impossible because cancel precedes arrival)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TransportSlot
    initial_state: QUEUED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: QUEUED
        to: DISPATCHED
        trigger: "POST /port-ops/transport-slots/{id}/dispatch"
        actor: TerminalOperator
        preconditions:
          - "Terminal posture != EMERGENCY (ERR_POSTURE_EMERGENCY)"
          - "PortCall.status in {ARRIVED, TURNAROUND} (ERR_INVALID_STATE)"
          - "FIFO: no other QUEUED slot of same (terminal_id, vehicle_class) with lower queue_seq (ERR_QUEUE_ORDER)"
          - "window capacity: count of slots DISPATCHED in the current 15-minute window (floor(now, 15min)) at this terminal < taxi_dispatch_capacity_per_window (ERR_QUEUE_WINDOW_FULL)"
        side_effects: ["dispatch_window_start := floor(now, TAXI_WINDOW_MINUTES)"]
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /port-ops/transport-slots/{id}/complete"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: NO_SHOW
        trigger: "POST /port-ops/transport-slots/{id}/no-show"
        actor: TerminalOperator
        preconditions: []
        side_effects: []
      - from: NO_SHOW
        to: QUEUED
        trigger: "POST /port-ops/transport-slots/{id}/requeue"
        actor: TerminalOperator
        preconditions:
          - "requeue_count < 1 (ERR_REQUEUE_LIMIT)"
        side_effects: ["requeue_count += 1", "queue_seq := next per-(terminal, class) sequence (rejoins at back of queue)"]
        note: "Single-cycle loop; second requeue rejected"
      - from: QUEUED
        to: EXPIRED
        trigger: "system (run-ops when the linked PortCall is in {DEPARTED, CLOSED, CANCELLED}; also direct cascade on PortCall cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WeatherAdvisory
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /port-ops/weather-advisories/{id}/cancel"
        actor: PortAuthorityAdmin
        preconditions: []
        side_effects: ["Terminal posture recomputed"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run-ops when window_end <= logical now)"
        actor: system
        preconditions: []
        side_effects: ["Terminal posture recomputed"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: berth-assignment-supersede-stale-call
    parent_entity: PortCall
    write_endpoint: "POST /port-ops/port-calls/{id}/berth-assignments"
    occ_field: expected_port_call_version
    description: |
      Creating a BerthAssignment supersedes the call's existing live
      (TENTATIVE/CONFIRMED) assignment, which is legitimate product behavior.
      A create carrying an expected_port_call_version older than the call's
      current version is rejected: the caller's view of the call (and of which
      assignment is live) is stale, so its supersede decision is void.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: invoice-adjustment-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /port-ops/invoices/{id}/adjustments"
    occ_field: expected_invoice_version
    description: |
      Posting an adjustment credit mutates the invoice's totals and version.
      Multiple adjustments are legitimate; a post carrying an
      expected_invoice_version older than the invoice's current version is
      rejected because the credit ceiling (total_cents) the caller validated
      against may no longer be current.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: terminal_posture
    trigger: "on advisory create/cancel/expire, on berth ACTIVE<->OUT_OF_SERVICE, on assignment ACTIVE/RELEASED, on every read of Terminal"
    algorithm: threshold
    formula: |
      active_berth_count   = count(Berth of terminal with status == ACTIVE)
      occupied_berth_count = count(distinct berth_id over BerthAssignment of terminal with status == ACTIVE)
      free_berth_count     = active_berth_count - occupied_berth_count
      if exists WeatherAdvisory of terminal: status == ACTIVE, severity == EMERGENCY,
                window_start <= now < window_end:
          posture = EMERGENCY
      elif exists WeatherAdvisory of terminal: status == ACTIVE, severity == WARNING,
                window_start <= now < window_end  OR  free_berth_count == 0:
          posture = CONSTRAINED
      else:
          posture = OPERATIONAL
      # WATCH advisories never affect posture. `now` is the logical clock.
    input_set: "WeatherAdvisory status ACTIVE only; Berth status ACTIVE only; BerthAssignment status ACTIVE only"
    constants:
      WATCH_NEVER_GATES: true
    precision: "integer counts; window containment is half-open [start, end)"
    variants: []

  - name: dockage_fee
    trigger: "PROVISIONAL variant at provisional-invoice creation; FINAL variant at port-call close"
    algorithm: tiered_pricing
    formula: |
      tier_rate(loa_ft): loa_ft <= 700 -> 95 ; 701..1000 -> 125 ; > 1000 -> 150   # cents per LOA-ft per billed hour, single non-marginal rate selected by tier
      scheduled_hours = ceil((scheduled_etd - scheduled_eta) seconds / 3600)
      PROVISIONAL:
        billed_hours = max(scheduled_hours, DOCKAGE_MIN_BILLED_HOURS)
        dockage_fee_cents = loa_ft * tier_rate(loa_ft) * billed_hours
      FINAL (evaluation order pinned 1..5):
        1. actual_hours = ceil((actual_etd - actual_eta) seconds / 3600)
        2. billed_base  = max(actual_hours, DOCKAGE_MIN_BILLED_HOURS)
           overtime_hours = max(0, billed_base - scheduled_hours)
        3. base_cents     = loa_ft * tier_rate * (billed_base - overtime_hours)
           overtime_cents = round_half_up(loa_ft * tier_rate * overtime_hours * OVERTIME_MULTIPLIER)
           subtotal       = base_cents + overtime_cents
        4. late_penalty_cents = round_half_up(subtotal * LATE_PENALTY_PCT / 100)  if actual_etd > scheduled_etd  else 0
        5. dockage_fee_cents = subtotal + late_penalty_cents
    input_set: "PROVISIONAL uses scheduled times only; FINAL uses system-stamped actual_eta/actual_etd of the DEPARTED call"
    constants:
      DOCKAGE_MIN_BILLED_HOURS: 10
      OVERTIME_MULTIPLIER: 1.5
      LATE_PENALTY_PCT: 10
      TIER1_MAX_LOA_FT: 700
      TIER1_RATE_CENTS: 95
      TIER2_MAX_LOA_FT: 1000
      TIER2_RATE_CENTS: 125
      TIER3_RATE_CENTS: 150
    precision: "integer cents; round_half_up only at the overtime and penalty steps; partial hours round UP (ceil) before any multiplication"
    variants:
      - name: PROVISIONAL
        when: "provisional-invoice generation (requires a CONFIRMED berth assignment; call not CANCELLED/CLOSED)"
        difference: "uses scheduled_eta/scheduled_etd; no overtime, no late penalty"
      - name: FINAL
        when: "port-call close"
        difference: "uses actual_eta/actual_etd with ceil hours, overtime multiplier beyond scheduled hours, and 10% late penalty when actual_etd > scheduled_etd"

  - name: passenger_head_tax
    trigger: "PROVISIONAL variant at provisional-invoice creation; FINAL variant at port-call close"
    algorithm: aggregation
    formula: |
      # Rounding order PINNED (mode b): discount is computed PER DIRECTION SIDE,
      # rounded half-up to whole cents per side, then the two sides are summed.
      # (Sum-then-round yields different cents and is NOT conformant.)
      PROVISIONAL:
        taxable_emb = booked_embark_pax ; taxable_deb = booked_debark_pax
      FINAL:
        taxable_emb = count(ManifestEntry of call: direction==EMBARK, status==EMBARKED, cabin_class != CREW)
        taxable_deb = count(ManifestEntry of call: direction==DEBARK, status in {DISEMBARKED, HELD, CLEARED}, cabin_class != CREW)
      if taxable_emb + taxable_deb >= HEAD_TAX_VOLUME_TIER_PAX:
        discount_emb = round_half_up(taxable_emb * HEAD_TAX_CENTS_PER_PAX * HEAD_TAX_VOLUME_DISCOUNT_PCT / 100)
        discount_deb = round_half_up(taxable_deb * HEAD_TAX_CENTS_PER_PAX * HEAD_TAX_VOLUME_DISCOUNT_PCT / 100)
        head_tax_cents = (taxable_emb * 1350 - discount_emb) + (taxable_deb * 1350 - discount_deb)
      else:
        head_tax_cents = (taxable_emb + taxable_deb) * HEAD_TAX_CENTS_PER_PAX
    input_set: "FINAL includes only the pinned status sets above; BOOKED/CHECKED_IN/SCREENED/NO_SHOW/CANCELLED and ABOARD/CARRIED_AWAY never count; CREW never counts"
    constants:
      HEAD_TAX_CENTS_PER_PAX: 1350
      HEAD_TAX_VOLUME_TIER_PAX: 3000
      HEAD_TAX_VOLUME_DISCOUNT_PCT: 5
    precision: "integer cents; round_half_up per side at the discount step only"
    variants:
      - name: PROVISIONAL
        when: "provisional-invoice generation"
        difference: "input set is the booked counts on PortCall; no manifest inspection"
      - name: FINAL
        when: "port-call close"
        difference: "input set is state-filtered ManifestEntry rows; identical booked data can yield a different tax once actuals diverge"

  - name: service_fee
    trigger: "at provisional-invoice creation, at final-invoice creation, and recompute on ServiceOrder approve/complete/cancel/cascade-reject while a DRAFT PROVISIONAL invoice exists"
    algorithm: aggregation
    formula: |
      rate(kind): PROVISIONING -> 4800 ; WASTE_OFFLOAD -> 6200   # cents per unit
      PROVISIONAL input set: ServiceOrders of call with status in {APPROVED, IN_PROGRESS, COMPLETED}, units = units (planned)
      FINAL input set:       ServiceOrders of call with status == COMPLETED, units = actual_units
      per order line: line_cents = rate(kind) * units
                      if surcharge_applied: line_cents = round_half_up(line_cents * 110 / 100)
      service_fee_cents = sum(line_cents)   # per-order surcharge rounding, then sum (pinned order)
    input_set: "status-filtered per variant; REJECTED/CANCELLED/REQUESTED contribute 0"
    constants:
      PROVISIONING_RATE_CENTS: 4800
      WASTE_OFFLOAD_RATE_CENTS: 6200
      CONSTRAINED_SURCHARGE_PCT: 10
    precision: "integer cents; round_half_up per order line at the surcharge step, then sum"
    variants:
      - name: PROVISIONAL
        when: "provisional invoice lifecycle"
        difference: "counts APPROVED+IN_PROGRESS+COMPLETED at planned units"
      - name: FINAL
        when: "port-call close"
        difference: "counts COMPLETED only at actual_units"

  - name: invoice_total
    trigger: "after any of dockage_fee / passenger_head_tax / service_fee compute or recompute, and after any adjustment post"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency RESOLVED by pinned evaluation order:
      # dockage overtime depends on scheduled vs actual times; the late penalty is
      # a percentage of the dockage subtotal; totals must never feed back into fees.
      Evaluation order (fixed):
        (1) dockage_fee_cents   (includes overtime and late penalty per dockage_fee)
        (2) head_tax_cents      (per-side discount rounding per passenger_head_tax)
        (3) service_fee_cents   (per-line surcharge rounding per service_fee)
        (4) gross_cents = dockage_fee_cents + head_tax_cents + service_fee_cents
        (5) total_cents = gross_cents - adjustments_total_cents
      Adjustments NEVER re-enter steps (1)-(3).
    input_set: "the three fee fields plus posted adjustments on the same invoice"
    constants: {}
    precision: "integer cents; no additional rounding"
    variants: []

  - name: screening_staffing_requirement
    trigger: "precondition evaluation of begin-turnaround; and on GET /port-ops/terminals/{id}/screening-requirement"
    algorithm: threshold
    formula: |
      turnaround_hours = floor((scheduled_etd - scheduled_eta) seconds / 3600)
      embark_window_hours = min(EMBARK_WINDOW_CAP_HOURS, max(1, turnaround_hours - EMBARK_WINDOW_TAIL_HOURS))
      PROJECTION variant (used by begin-turnaround):
        required_officers = ceil(booked_embark_pax / (PAX_PER_OFFICER_HOUR * embark_window_hours))
      ACTUAL variant (screening-requirement read with mode=ACTUAL):
        live = count(ManifestEntry: direction==EMBARK, status in {CHECKED_IN, SCREENED, EMBARKED})
        required_officers = ceil(live / (PAX_PER_OFFICER_HOUR * embark_window_hours))
      assigned_officers = sum(officers_assigned over ScreeningLane of terminal with status == OPEN)
      satisfied = assigned_officers >= required_officers      # boundary: equality SATISFIES
    input_set: "PROJECTION uses booked_embark_pax; ACTUAL uses state-filtered manifest rows; only OPEN lanes contribute officers"
    constants:
      PAX_PER_OFFICER_HOUR: 60
      EMBARK_WINDOW_CAP_HOURS: 8
      EMBARK_WINDOW_TAIL_HOURS: 2
    precision: "integer officers; ceil division"
    variants:
      - name: PROJECTION
        when: "begin-turnaround gate and screening-requirement mode=PROJECTION (default)"
        difference: "numerator is booked_embark_pax"
      - name: ACTUAL
        when: "screening-requirement mode=ACTUAL"
        difference: "numerator is count of EMBARK entries in {CHECKED_IN, SCREENED, EMBARKED}; same booked data, different requirement once check-ins diverge"

  - name: berth_window_conflict
    trigger: "BerthAssignment confirm (and create-time berth fit is separate)"
    algorithm: interval_merge
    formula: |
      For candidate window [s, e) on berth B against every other BerthAssignment
      on B with status in {CONFIRMED, ACTIVE} and window [s2, e2):
        conflict unless (e + BERTH_BUFFER_MINUTES <= s2) OR (s >= e2 + BERTH_BUFFER_MINUTES)
      # Half-open windows plus a mandatory buffer on BOTH sides.
      # Equality (gap == exactly BERTH_BUFFER_MINUTES) is ALLOWED.
    input_set: "same-berth assignments in {CONFIRMED, ACTIVE}; TENTATIVE/SUPERSEDED/EXPIRED/RELEASED never block"
    constants:
      BERTH_BUFFER_MINUTES: 120
    precision: "minute resolution; >= comparison (inclusive) at the buffer edge"
    variants: []

  - name: apron_capacity_window
    trigger: "ServiceOrder start"
    algorithm: threshold
    formula: |
      in_progress = count(ServiceOrder of the SAME TERMINAL with status == IN_PROGRESS)
      if in_progress >= Terminal.max_apron_slots: reject ERR_APRON_CAPACITY
      # Aggregate concurrency semantics: no pairwise interval arithmetic;
      # any IN_PROGRESS order anywhere on the terminal apron consumes one slot
      # regardless of its window times. Boundary: in_progress == max_apron_slots - 1 passes.
    input_set: "all ServiceOrders of the terminal (across ALL port calls) in IN_PROGRESS"
    constants: {}
    precision: "integer count; >= rejects (exclusive capacity edge)"
    variants: []

  - name: transport_window_allocation
    trigger: "TransportSlot dispatch"
    algorithm: threshold
    formula: |
      window_start = floor(now, TAXI_WINDOW_MINUTES minutes)   # [ws, ws+15min)
      dispatched = count(TransportSlot of terminal with dispatch_window_start == window_start and status in {DISPATCHED, COMPLETED, NO_SHOW})
      if dispatched >= Terminal.taxi_dispatch_capacity_per_window: reject ERR_QUEUE_WINDOW_FULL
      # Slots that left DISPATCHED via complete/no-show still consume their window slot;
      # QUEUED/EXPIRED do not. Boundary: dispatched == capacity - 1 passes.
    input_set: "terminal's slots whose dispatch_window_start equals the current 15-min window"
    constants:
      TAXI_WINDOW_MINUTES: 15
    precision: "minute resolution; half-open window [ws, ws+15)"
    variants: []

  - name: turnaround_feasibility
    trigger: "PortCall create and delay"
    algorithm: threshold
    formula: |
      if (scheduled_etd - scheduled_eta) < MIN_TURNAROUND_HOURS hours: reject ERR_TURNAROUND_TOO_SHORT
      # Boundary: exactly MIN_TURNAROUND_HOURS is ALLOWED (>= passes).
      # Same check applies to (revised_eta, revised_etd) on delay.
    input_set: "single PortCall times"
    constants:
      MIN_TURNAROUND_HOURS: 6
    precision: "whole minutes; >= comparison inclusive at the boundary"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is permitted on this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Path ids and body FK references exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with ids/FKs" }
  - { priority: 4, category: business_referential, check: "VesselAgent scope: X-User-ID must equal the vessel_id of the owning PortCall (directly or via the referenced child)", error_id: ERR_VESSEL_SCOPE, http_status: 403, applies_to: "VesselAgent-accessible endpoints acting on a specific call/child" }
  - { priority: 5, category: business_constraint, check: "OCC: expected_port_call_version / expected_invoice_version equals current version", error_id: "ERR_STALE_VERSION | ERR_STALE_INVOICE_VERSION", http_status: 412, applies_to: "POST /port-ops/port-calls/{id}/berth-assignments ; POST /port-ops/invoices/{id}/adjustments" }
  - { priority: 6, category: business_constraint, check: "Request body shape: required fields present, types and enum values valid, integer ranges respected", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 7, category: business_constraint, check: "Direction applicability: check-in/screen/board/offload require direction EMBARK; disembark/customs-hold/customs-release require DEBARK; load requires an EMBARK entry; deliver requires a DEBARK entry. Evaluated before state preconditions because the operation is undefined for the other direction's flow", error_id: ERR_MANIFEST_DIRECTION, http_status: 422, applies_to: "manifest and baggage action endpoints" }
  - { priority: 8, category: state, check: "Target entity is in a state from which the requested transition exists, including parent-state gates on child creation (manifest entries only while SCHEDULED/DELAYED, etc.)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints and gated child-creation endpoints" }
  - { priority: 9, category: business_safety, check: "Posture gate: EMERGENCY blocks berth-assignment create/confirm, service-order approve, transport dispatch, port-call depart", error_id: ERR_POSTURE_EMERGENCY, http_status: 409, applies_to: "posture-gated endpoints" }
  - { priority: 10, category: business_safety, check: "Berth physical fit: length_ft >= loa_ft + LOA_SAFETY_MARGIN_FT (equality allowed) and max_draft_ft >= draft_ft (equality allowed)", error_id: ERR_BERTH_NOT_FIT, http_status: 422, applies_to: "berth-assignment create and confirm" }
  - { priority: 11, category: business_safety, check: "Contamination: PROVISIONING may not start while a WASTE_OFFLOAD of the same call is IN_PROGRESS", error_id: ERR_WASTE_BEFORE_PROVISIONING, http_status: 409, applies_to: "POST /port-ops/service-orders/{id}/start" }
  - { priority: 12, category: business_temporal, check: "Turnaround minimum: etd - eta >= 6h (create / delay)", error_id: ERR_TURNAROUND_TOO_SHORT, http_status: 422, applies_to: "POST /port-ops/port-calls ; POST /port-ops/port-calls/{id}/delay" }
  - { priority: 13, category: business_temporal, check: "Window sanity and containment: assignment window contains [scheduled_eta, scheduled_etd]; advisory window_end > window_start; service window inside a live assignment window; arrive within assignment window", error_id: "ERR_WINDOW_NOT_CONTAINED | ERR_ADVISORY_WINDOW_INVALID | ERR_SERVICE_WINDOW_OUTSIDE_BERTH", http_status: 422, applies_to: "windowed endpoints" }
  - { priority: 14, category: business_temporal, check: "Buffered berth overlap: gap to every CONFIRMED/ACTIVE same-berth window >= 120 minutes (equality allowed)", error_id: ERR_BERTH_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /port-ops/berth-assignments/{id}/confirm" }
  - { priority: 15, category: business_constraint, check: "Uniqueness of config labels: berth_code per terminal, voyage_ref per terminal", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /port-ops/berths ; POST /port-ops/port-calls" }
  - { priority: 16, category: business_constraint, check: "Uniqueness of operational records: passenger_ref per call, tag_code per call, one CustomsCase per call, one PROVISIONAL and one FINAL invoice per call", error_id: "ERR_DUPLICATE_MANIFEST_REF | ERR_DUPLICATE_TAG | ERR_DUPLICATE_CUSTOMS_CASE | ERR_INVOICE_KIND_EXISTS", http_status: 409, applies_to: "manifest/baggage/customs/invoice creation endpoints" }
  - { priority: 17, category: business_constraint, check: "Segregation of duties: service-order approver != requester", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /port-ops/service-orders/{id}/approve" }
  - { priority: 18, category: business_constraint, check: "Conditional role: during CONSTRAINED posture only Harbormaster may approve service orders", error_id: ERR_CONSTRAINED_REQUIRES_HARBORMASTER, http_status: 403, applies_to: "POST /port-ops/service-orders/{id}/approve" }
  - { priority: 19, category: business_constraint, check: "Capacity thresholds: screening officers >= required; apron IN_PROGRESS < max_apron_slots; dispatch window count < taxi capacity", error_id: "ERR_SCREENING_CAPACITY | ERR_APRON_CAPACITY | ERR_QUEUE_WINDOW_FULL", http_status: 409, applies_to: "begin-turnaround / service-order start / transport dispatch" }
  - { priority: 20, category: business_constraint, check: "Queue discipline: FIFO per (terminal, vehicle_class) by queue_seq; requeue_count < 1", error_id: "ERR_QUEUE_ORDER | ERR_REQUEUE_LIMIT", http_status: 409, applies_to: "transport dispatch / requeue" }
  - { priority: 21, category: business_referential, check: "Customs coordination: board requires case CLEARED; depart requires case CLEARED; disembark requires case in {FILED, CLEARED}; deliver requires entry CLEARED", error_id: "ERR_CUSTOMS_NOT_CLEARED | ERR_CUSTOMS_HOLD_ACTIVE", http_status: 409, applies_to: "board / depart / disembark / deliver" }
  - { priority: 22, category: business_referential, check: "Departure completeness: no MISTAGGED/RECOVERED bags; all service orders terminal", error_id: "ERR_OPEN_MISTAGS | ERR_OPEN_SERVICE_ORDERS", http_status: 409, applies_to: "POST /port-ops/port-calls/{id}/depart" }
  - { priority: 23, category: business_fiscal, check: "Settlement exactness: payment_cents == total_cents", error_id: "ERR_UNDERPAYMENT | ERR_OVERPAYMENT", http_status: 422, applies_to: "POST /port-ops/invoices/{id}/settle" }
  - { priority: 24, category: business_fiscal, check: "Credit ceiling: adjustment amount_cents <= current total_cents", error_id: ERR_CREDIT_EXCEEDS_OUTSTANDING, http_status: 422, applies_to: "POST /port-ops/invoices/{id}/adjustments" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/port-ops/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time.", roles: [PortAuthorityAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["posture and time-gated rules re-evaluate against the new now"] }

  # --- Terminal ---
  - { method: POST, path: "/port-ops/terminals", description: "Create terminal", roles: [PortAuthorityAdmin], code: 201, input: [name, max_apron_slots, taxi_dispatch_capacity_per_window], output: Terminal, side_effects: ["posture=OPERATIONAL, ops_run_index=0, counts=0"] }
  - { method: GET, path: "/port-ops/terminals", description: "List terminals", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["limit?", "offset?"], output: "Terminal[]", side_effects: [] }
  - { method: GET, path: "/port-ops/terminals/{id}", description: "Get terminal incl. computed posture/counts", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: Terminal, side_effects: [] }
  - { method: POST, path: "/port-ops/terminals/{id}/run-ops", description: "Ops checkpoint: expire advisories past window_end; expire TENTATIVE assignments whose window_start <= now; expire QUEUED transport slots whose port call is DEPARTED/CLOSED/CANCELLED; recompute posture; ops_run_index += 1", roles: [PortAuthorityAdmin], code: 200, input: [], output: Terminal, side_effects: ["sweep expiries per description", "increments Terminal.version by 1"] }
  - { method: GET, path: "/port-ops/terminals/{id}/screening-requirement", description: "Computed read: required vs assigned screening officers for a port call", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator], code: 200, input: [port_call_id, "mode?"], output: "{ required_officers: integer, assigned_officers: integer, embark_window_hours: integer, satisfied: boolean }", side_effects: [] }

  # --- Berth ---
  - { method: POST, path: "/port-ops/berths", description: "Create berth (status ACTIVE)", roles: [PortAuthorityAdmin], code: 201, input: [terminal_id, berth_code, length_ft, max_draft_ft], output: Berth, side_effects: ["Terminal active_berth_count/free_berth_count recomputed"] }
  - { method: GET, path: "/port-ops/berths", description: "List berths", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["terminal_id?", "status?", "limit?", "offset?"], output: "Berth[]", side_effects: [] }
  - { method: GET, path: "/port-ops/berths/{id}", description: "Get berth", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: Berth, side_effects: [] }
  - { method: POST, path: "/port-ops/berths/{id}/out-of-service", description: "Take berth out of service", roles: [PortAuthorityAdmin], code: 200, input: [], output: Berth, side_effects: ["status -> OUT_OF_SERVICE", "Terminal counts/posture recomputed"] }
  - { method: POST, path: "/port-ops/berths/{id}/return-to-service", description: "Return berth to service", roles: [PortAuthorityAdmin], code: 200, input: [], output: Berth, side_effects: ["status -> ACTIVE", "Terminal counts/posture recomputed"] }

  # --- Vessel ---
  - { method: POST, path: "/port-ops/vessels", description: "Register vessel", roles: [PortAuthorityAdmin], code: 201, input: [terminal_id, name, loa_ft, draft_ft, pax_capacity, crew_count], output: Vessel, side_effects: [] }
  - { method: GET, path: "/port-ops/vessels", description: "List vessels", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["terminal_id?", "limit?", "offset?"], output: "Vessel[]", side_effects: [] }
  - { method: GET, path: "/port-ops/vessels/{id}", description: "Get vessel", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: Vessel, side_effects: [] }

  # --- PortCall ---
  - { method: POST, path: "/port-ops/port-calls", description: "Create port call (status SCHEDULED). VesselAgent must act for own vessel (vessel_id == X-User-ID).", roles: [VesselAgent, PortAuthorityAdmin], code: 201, input: [terminal_id, vessel_id, voyage_ref, scheduled_eta, scheduled_etd, booked_embark_pax, booked_debark_pax], output: PortCall, side_effects: ["turnaround feasibility check (>= 6h)"] }
  - { method: GET, path: "/port-ops/port-calls", description: "List port calls; VesselAgent sees only own vessel's calls", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["terminal_id?", "vessel_id?", "status?", "limit?", "offset?"], output: "PortCall[]", side_effects: [] }
  - { method: GET, path: "/port-ops/port-calls/{id}", description: "Get port call (VesselAgent scope-enforced)", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: PortCall, side_effects: [] }
  - { method: POST, path: "/port-ops/port-calls/{id}/delay", description: "SCHEDULED -> DELAYED with revised times", roles: [VesselAgent], code: 200, input: [revised_eta, revised_etd, reason], output: PortCall, side_effects: ["status -> DELAYED", "increments PortCall.version by 1"] }
  - { method: POST, path: "/port-ops/port-calls/{id}/confirm-revised", description: "DELAYED -> SCHEDULED; applies revised times and fires the berth/service-order/invoice cascade", roles: [Harbormaster], code: 200, input: [], output: PortCall, side_effects: ["cascade per §1.2", "increments PortCall.version by 1"] }
  - { method: POST, path: "/port-ops/port-calls/{id}/arrive", description: "SCHEDULED -> ARRIVED; flips the CONFIRMED assignment ACTIVE", roles: [Harbormaster], code: 200, input: [actual_eta], output: PortCall, side_effects: ["assignment CONFIRMED -> ACTIVE", "Terminal occupancy/posture recomputed", "increments PortCall.version by 1"] }
  - { method: POST, path: "/port-ops/port-calls/{id}/begin-turnaround", description: "ARRIVED -> TURNAROUND; gated on screening staffing", roles: [TerminalOperator], code: 200, input: [], output: PortCall, side_effects: ["increments PortCall.version by 1"] }
  - { method: POST, path: "/port-ops/port-calls/{id}/depart", description: "TURNAROUND -> DEPARTED; gated on customs/bags/service-orders/posture; cascades NO_SHOW and bag offload", roles: [Harbormaster], code: 200, input: [actual_etd], output: PortCall, side_effects: ["cascade per §1.2", "assignment ACTIVE -> RELEASED", "increments PortCall.version by 1"] }
  - { method: POST, path: "/port-ops/port-calls/{id}/close", description: "DEPARTED -> CLOSED; generates the FINAL DRAFT invoice", roles: [BillingClerk], code: 200, input: [], output: PortCall, side_effects: ["creates FINAL Invoice DRAFT (computed actuals)", "increments PortCall.version by 1"] }
  - { method: POST, path: "/port-ops/port-calls/{id}/cancel", description: "SCHEDULED|DELAYED -> CANCELLED with full compensation cascade", roles: [VesselAgent, Harbormaster], code: 200, input: ["reason?"], output: PortCall, side_effects: ["cascade per §1.2", "increments PortCall.version by 1"] }

  # --- BerthAssignment ---
  - { method: POST, path: "/port-ops/port-calls/{id}/berth-assignments", description: "Create TENTATIVE assignment; supersedes the call's existing live assignment; OCC-guarded", roles: [Harbormaster], code: 201, input: [berth_id, window_start, window_end, expected_port_call_version], output: BerthAssignment, side_effects: ["existing live assignment of this call -> SUPERSEDED", "fit/containment/posture checks", "increments PortCall.version by 1"] }
  - { method: GET, path: "/port-ops/berth-assignments", description: "List berth assignments", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["port_call_id?", "berth_id?", "status?", "limit?", "offset?"], output: "BerthAssignment[]", side_effects: [] }
  - { method: GET, path: "/port-ops/berth-assignments/{id}", description: "Get berth assignment", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: BerthAssignment, side_effects: [] }
  - { method: POST, path: "/port-ops/berth-assignments/{id}/confirm", description: "TENTATIVE -> CONFIRMED; re-checks posture, berth ACTIVE, fit, containment, buffered overlap", roles: [Harbormaster], code: 200, input: [], output: BerthAssignment, side_effects: [] }

  # --- ManifestEntry ---
  - { method: POST, path: "/port-ops/port-calls/{id}/manifest-entries", description: "Add passenger movement (EMBARK starts BOOKED, DEBARK starts ABOARD). Call must be SCHEDULED or DELAYED.", roles: [VesselAgent], code: 201, input: [passenger_ref, direction, cabin_class], output: ManifestEntry, side_effects: ["is_taxable computed"] }
  - { method: GET, path: "/port-ops/manifest-entries", description: "List manifest entries", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["port_call_id?", "status?", "direction?", "limit?", "offset?"], output: "ManifestEntry[]", side_effects: [] }
  - { method: GET, path: "/port-ops/manifest-entries/{id}", description: "Get manifest entry", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: ManifestEntry, side_effects: [] }
  - { method: POST, path: "/port-ops/manifest-entries/{id}/check-in", description: "BOOKED -> CHECKED_IN (EMBARK)", roles: [TerminalOperator], code: 200, input: [], output: ManifestEntry, side_effects: [] }
  - { method: POST, path: "/port-ops/manifest-entries/{id}/screen", description: "CHECKED_IN -> SCREENED (EMBARK); needs an OPEN lane", roles: [TerminalOperator], code: 200, input: [], output: ManifestEntry, side_effects: [] }
  - { method: POST, path: "/port-ops/manifest-entries/{id}/board", description: "SCREENED -> EMBARKED (EMBARK); needs TURNAROUND + customs CLEARED", roles: [TerminalOperator], code: 200, input: [], output: ManifestEntry, side_effects: ["passengers_aboard += 1"] }
  - { method: POST, path: "/port-ops/manifest-entries/{id}/offload", description: "EMBARKED -> CHECKED_IN (EMBARK); compensating action; cascades bag offload", roles: [TerminalOperator], code: 200, input: [], output: ManifestEntry, side_effects: ["passengers_aboard -= 1", "LOADED bags -> OFFLOADED", "bags_aboard recomputed"] }
  - { method: POST, path: "/port-ops/manifest-entries/{id}/disembark", description: "ABOARD -> DISEMBARKED (DEBARK); blocked while customs case HELD", roles: [TerminalOperator], code: 200, input: [], output: ManifestEntry, side_effects: [] }
  - { method: POST, path: "/port-ops/manifest-entries/{id}/customs-hold", description: "DISEMBARKED -> HELD (DEBARK)", roles: [CustomsOfficer], code: 200, input: [], output: ManifestEntry, side_effects: [] }
  - { method: POST, path: "/port-ops/manifest-entries/{id}/customs-release", description: "DISEMBARKED|HELD -> CLEARED (DEBARK)", roles: [CustomsOfficer], code: 200, input: [], output: ManifestEntry, side_effects: [] }

  # --- BaggageItem ---
  - { method: POST, path: "/port-ops/baggage-items", description: "Check a bag (status CHECKED); entry must be non-terminal (not NO_SHOW/CANCELLED/CARRIED_AWAY); port_call_id denormalized from the manifest entry", roles: [TerminalOperator], code: 201, input: [manifest_entry_id, tag_code], output: BaggageItem, side_effects: [] }
  - { method: GET, path: "/port-ops/baggage-items", description: "List baggage items", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["manifest_entry_id?", "port_call_id?", "status?", "tag_code?", "limit?", "offset?"], output: "BaggageItem[]", side_effects: [] }
  - { method: GET, path: "/port-ops/baggage-items/{id}", description: "Get baggage item", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: BaggageItem, side_effects: [] }
  - { method: POST, path: "/port-ops/baggage-items/{id}/stage", description: "CHECKED|RECOVERED -> STAGED", roles: [TerminalOperator], code: 200, input: [], output: BaggageItem, side_effects: [] }
  - { method: POST, path: "/port-ops/baggage-items/{id}/load", description: "STAGED -> LOADED; requires owning entry EMBARKED and call TURNAROUND", roles: [TerminalOperator], code: 200, input: [], output: BaggageItem, side_effects: ["bags_aboard += 1"] }
  - { method: POST, path: "/port-ops/baggage-items/{id}/report-mistag", description: "CHECKED|STAGED -> MISTAGGED", roles: [TerminalOperator], code: 200, input: ["note?"], output: BaggageItem, side_effects: [] }
  - { method: POST, path: "/port-ops/baggage-items/{id}/recover", description: "MISTAGGED -> RECOVERED", roles: [TerminalOperator], code: 200, input: [], output: BaggageItem, side_effects: [] }
  - { method: POST, path: "/port-ops/baggage-items/{id}/deliver", description: "STAGED -> DELIVERED (DEBARK bags); requires owning entry CLEARED", roles: [TerminalOperator], code: 200, input: [], output: BaggageItem, side_effects: [] }

  # --- ScreeningLane ---
  - { method: POST, path: "/port-ops/screening-lanes", description: "Create screening lane (status CLOSED, officers 0)", roles: [PortAuthorityAdmin], code: 201, input: [terminal_id, lane_code], output: ScreeningLane, side_effects: [] }
  - { method: GET, path: "/port-ops/screening-lanes", description: "List screening lanes", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["terminal_id?", "status?", "limit?", "offset?"], output: "ScreeningLane[]", side_effects: [] }
  - { method: GET, path: "/port-ops/screening-lanes/{id}", description: "Get screening lane", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: ScreeningLane, side_effects: [] }
  - { method: POST, path: "/port-ops/screening-lanes/{id}/open", description: "CLOSED -> OPEN with officers_assigned >= 1", roles: [TerminalOperator], code: 200, input: [officers_assigned], output: ScreeningLane, side_effects: ["officers_assigned := payload"] }
  - { method: POST, path: "/port-ops/screening-lanes/{id}/close", description: "OPEN -> CLOSED; officers reset to 0", roles: [TerminalOperator], code: 200, input: [], output: ScreeningLane, side_effects: ["officers_assigned := 0"] }

  # --- CustomsCase ---
  - { method: POST, path: "/port-ops/port-calls/{id}/customs-cases", description: "Create the call's customs case (DRAFT); one per call; call must be in {SCHEDULED, DELAYED, ARRIVED, TURNAROUND}", roles: [CustomsOfficer], code: 201, input: [], output: CustomsCase, side_effects: [] }
  - { method: GET, path: "/port-ops/customs-cases", description: "List customs cases", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["port_call_id?", "status?", "limit?", "offset?"], output: "CustomsCase[]", side_effects: [] }
  - { method: GET, path: "/port-ops/customs-cases/{id}", description: "Get customs case", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: CustomsCase, side_effects: [] }
  - { method: POST, path: "/port-ops/customs-cases/{id}/file", description: "DRAFT|HELD -> FILED", roles: [CustomsOfficer], code: 200, input: [], output: CustomsCase, side_effects: [] }
  - { method: POST, path: "/port-ops/customs-cases/{id}/hold", description: "FILED -> HELD; cascades DISEMBARKED entries -> HELD", roles: [CustomsOfficer], code: 200, input: [reason], output: CustomsCase, side_effects: ["DISEMBARKED debark entries -> HELD"] }
  - { method: POST, path: "/port-ops/customs-cases/{id}/clear", description: "FILED -> CLEARED", roles: [CustomsOfficer], code: 200, input: [], output: CustomsCase, side_effects: [] }

  # --- ServiceOrder ---
  - { method: POST, path: "/port-ops/port-calls/{id}/service-orders", description: "Request a service order (REQUESTED); call must be in {SCHEDULED, DELAYED, ARRIVED, TURNAROUND}; window containment vs a live assignment checked at approve time", roles: [VesselAgent], code: 201, input: [kind, units, window_start, window_end], output: ServiceOrder, side_effects: ["requested_by_user_id := X-User-ID"] }
  - { method: GET, path: "/port-ops/service-orders", description: "List service orders", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["port_call_id?", "status?", "kind?", "limit?", "offset?"], output: "ServiceOrder[]", side_effects: [] }
  - { method: GET, path: "/port-ops/service-orders/{id}", description: "Get service order", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: ServiceOrder, side_effects: [] }
  - { method: POST, path: "/port-ops/service-orders/{id}/approve", description: "REQUESTED -> APPROVED; SoD; posture-conditional role; window containment; CONSTRAINED surcharge flag", roles: [TerminalOperator, Harbormaster], code: 200, input: [], output: ServiceOrder, side_effects: ["surcharge_applied := (posture == CONSTRAINED)", "DRAFT PROVISIONAL invoice recomputes"] }
  - { method: POST, path: "/port-ops/service-orders/{id}/reject", description: "REQUESTED -> REJECTED", roles: [TerminalOperator, Harbormaster], code: 200, input: ["reason?"], output: ServiceOrder, side_effects: [] }
  - { method: POST, path: "/port-ops/service-orders/{id}/start", description: "APPROVED -> IN_PROGRESS; needs ACTIVE assignment; apron capacity; contamination rule", roles: [TerminalOperator], code: 200, input: [], output: ServiceOrder, side_effects: [] }
  - { method: POST, path: "/port-ops/service-orders/{id}/complete", description: "IN_PROGRESS -> COMPLETED with actual_units", roles: [TerminalOperator], code: 200, input: [actual_units], output: ServiceOrder, side_effects: ["DRAFT PROVISIONAL invoice recomputes"] }
  - { method: POST, path: "/port-ops/service-orders/{id}/cancel", description: "REQUESTED|APPROVED -> CANCELLED by the requesting agent", roles: [VesselAgent], code: 200, input: [], output: ServiceOrder, side_effects: ["DRAFT PROVISIONAL invoice recomputes"] }

  # --- Invoice ---
  - { method: POST, path: "/port-ops/port-calls/{id}/provisional-invoice", description: "Generate the PROVISIONAL invoice (DRAFT); requires a CONFIRMED|ACTIVE assignment; one PROVISIONAL per call", roles: [BillingClerk], code: 201, input: [], output: Invoice, side_effects: ["computes dockage/head-tax/service-fee PROVISIONAL variants, gross, total"] }
  - { method: GET, path: "/port-ops/invoices", description: "List invoices", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["port_call_id?", "kind?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/port-ops/invoices/{id}", description: "Get invoice", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/port-ops/invoices/{id}/issue", description: "DRAFT -> ISSUED", roles: [BillingClerk], code: 200, input: [], output: Invoice, side_effects: ["increments Invoice.version by 1"] }
  - { method: POST, path: "/port-ops/invoices/{id}/settle", description: "ISSUED -> SETTLED; payment must equal total_cents exactly", roles: [BillingClerk], code: 200, input: [payment_cents], output: Invoice, side_effects: ["payment_cents := payload", "increments Invoice.version by 1"] }
  - { method: POST, path: "/port-ops/invoices/{id}/dispute", description: "ISSUED -> DISPUTED by the billed vessel's agent", roles: [VesselAgent], code: 200, input: [reason], output: Invoice, side_effects: ["dispute_reason := payload", "increments Invoice.version by 1"] }
  - { method: POST, path: "/port-ops/invoices/{id}/adjustments", description: "Post a credit adjustment (ISSUED|DISPUTED); OCC-guarded; DISPUTED -> ISSUED on post", roles: [BillingClerk], code: 201, input: [amount_cents, reason, expected_invoice_version], output: Invoice, side_effects: ["adjustments_total_cents += amount_cents", "total_cents recomputed", "DISPUTED -> ISSUED", "increments Invoice.version by 1"] }

  # --- TransportSlot ---
  - { method: POST, path: "/port-ops/transport-slots", description: "Enqueue a ground-transport slot (QUEUED, queue_seq assigned); call must be in {SCHEDULED, DELAYED, ARRIVED, TURNAROUND}", roles: [TerminalOperator], code: 201, input: [terminal_id, port_call_id, vehicle_class, party_size], output: TransportSlot, side_effects: ["queue_seq := next per (terminal, vehicle_class)"] }
  - { method: GET, path: "/port-ops/transport-slots", description: "List transport slots", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["terminal_id?", "port_call_id?", "status?", "vehicle_class?", "limit?", "offset?"], output: "TransportSlot[]", side_effects: [] }
  - { method: GET, path: "/port-ops/transport-slots/{id}", description: "Get transport slot", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: TransportSlot, side_effects: [] }
  - { method: POST, path: "/port-ops/transport-slots/{id}/dispatch", description: "QUEUED -> DISPATCHED; FIFO per class; 15-min window capacity; EMERGENCY blocks", roles: [TerminalOperator], code: 200, input: [], output: TransportSlot, side_effects: ["dispatch_window_start := floor(now, 15min)"] }
  - { method: POST, path: "/port-ops/transport-slots/{id}/complete", description: "DISPATCHED -> COMPLETED", roles: [TerminalOperator], code: 200, input: [], output: TransportSlot, side_effects: [] }
  - { method: POST, path: "/port-ops/transport-slots/{id}/no-show", description: "DISPATCHED -> NO_SHOW", roles: [TerminalOperator], code: 200, input: [], output: TransportSlot, side_effects: [] }
  - { method: POST, path: "/port-ops/transport-slots/{id}/requeue", description: "NO_SHOW -> QUEUED once; new queue_seq at back", roles: [TerminalOperator], code: 200, input: [], output: TransportSlot, side_effects: ["requeue_count += 1", "queue_seq reassigned"] }

  # --- WeatherAdvisory ---
  - { method: POST, path: "/port-ops/weather-advisories", description: "Create advisory (ACTIVE); recomputes posture immediately", roles: [PortAuthorityAdmin], code: 201, input: [terminal_id, severity, window_start, window_end], output: WeatherAdvisory, side_effects: ["Terminal posture recomputed"] }
  - { method: GET, path: "/port-ops/weather-advisories", description: "List advisories", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: ["terminal_id?", "status?", "severity?", "limit?", "offset?"], output: "WeatherAdvisory[]", side_effects: [] }
  - { method: GET, path: "/port-ops/weather-advisories/{id}", description: "Get advisory", roles: [PortAuthorityAdmin, Harbormaster, TerminalOperator, VesselAgent, CustomsOfficer, BillingClerk], code: 200, input: [], output: WeatherAdvisory, side_effects: [] }
  - { method: POST, path: "/port-ops/weather-advisories/{id}/cancel", description: "ACTIVE -> CANCELLED; recomputes posture", roles: [PortAuthorityAdmin], code: 200, input: [], output: WeatherAdvisory, side_effects: ["Terminal posture recomputed"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role is declared but not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist (checked left-to-right)" }
  - { id: ERR_VESSEL_SCOPE, http: 403, condition: "VesselAgent's X-User-ID does not match the owning PortCall's vessel_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_port_call_version != current PortCall.version on berth-assignment create" }
  - { id: ERR_STALE_INVOICE_VERSION, http: 412, condition: "expected_invoice_version != current Invoice.version on adjustment post" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, unknown enum value, or violated numeric range; duplicate berth_code/voyage_ref within a terminal" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a state from which the requested transition exists (generic state precondition)" }
  - { id: ERR_POSTURE_EMERGENCY, http: 409, condition: "Terminal posture is EMERGENCY; operation gated (assignment create/confirm, SO approve, dispatch, depart)" }
  - { id: ERR_BERTH_NOT_FIT, http: 422, condition: "Berth length_ft < loa_ft + 30 or max_draft_ft < draft_ft" }
  - { id: ERR_WASTE_BEFORE_PROVISIONING, http: 409, condition: "Starting PROVISIONING while a WASTE_OFFLOAD of the same call is IN_PROGRESS" }
  - { id: ERR_TURNAROUND_TOO_SHORT, http: 422, condition: "etd - eta < 6 hours on create or delay" }
  - { id: ERR_WINDOW_NOT_CONTAINED, http: 422, condition: "Assignment window does not contain [scheduled_eta, scheduled_etd], or arrive actual_eta outside the CONFIRMED window" }
  - { id: ERR_ADVISORY_WINDOW_INVALID, http: 422, condition: "WeatherAdvisory window_end <= window_start" }
  - { id: ERR_SERVICE_WINDOW_OUTSIDE_BERTH, http: 422, condition: "Service order window not contained in any live assignment window of the call (checked at approve)" }
  - { id: ERR_BERTH_WINDOW_CONFLICT, http: 409, condition: "Same-berth CONFIRMED/ACTIVE window within the 120-minute buffer of the candidate window" }
  - { id: ERR_SCREENING_CAPACITY, http: 409, condition: "Assigned officers across OPEN lanes < required officers (begin-turnaround), or no OPEN lane with officers (screen)" }
  - { id: ERR_APRON_CAPACITY, http: 409, condition: "IN_PROGRESS service orders at the terminal == max_apron_slots on start" }
  - { id: ERR_QUEUE_WINDOW_FULL, http: 409, condition: "Dispatches in the current 15-minute window == taxi_dispatch_capacity_per_window" }
  - { id: ERR_QUEUE_ORDER, http: 409, condition: "A QUEUED slot of the same (terminal, vehicle_class) with lower queue_seq exists at dispatch" }
  - { id: ERR_DUPLICATE_MANIFEST_REF, http: 409, condition: "passenger_ref already exists on this port call" }
  - { id: ERR_DUPLICATE_TAG, http: 409, condition: "tag_code already exists on this port call" }
  - { id: ERR_DUPLICATE_CUSTOMS_CASE, http: 409, condition: "A CustomsCase already exists for this port call" }
  - { id: ERR_INVOICE_KIND_EXISTS, http: 409, condition: "A PROVISIONAL invoice already exists for this call (or FINAL already generated)" }
  - { id: ERR_REQUEUE_LIMIT, http: 409, condition: "requeue_count >= 1 on requeue attempt" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Service-order approver X-User-ID equals requested_by_user_id" }
  - { id: ERR_CONSTRAINED_REQUIRES_HARBORMASTER, http: 403, condition: "Posture CONSTRAINED: only Harbormaster may approve service orders" }
  - { id: ERR_UNDERPAYMENT, http: 422, condition: "settle payment_cents < total_cents" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "settle payment_cents > total_cents" }
  - { id: ERR_CREDIT_EXCEEDS_OUTSTANDING, http: 422, condition: "adjustment amount_cents > current total_cents" }
  - { id: ERR_MANIFEST_DIRECTION, http: 422, condition: "Action not valid for the entry's direction (EMBARK vs DEBARK), including baggage load/deliver direction guards" }
  - { id: ERR_OPEN_MISTAGS, http: 409, condition: "Depart blocked: bags of this call remain in MISTAGGED or RECOVERED" }
  - { id: ERR_CUSTOMS_NOT_CLEARED, http: 409, condition: "CustomsCase not CLEARED (board / depart), or debark bag deliver before entry CLEARED" }
  - { id: ERR_CUSTOMS_HOLD_ACTIVE, http: 409, condition: "Disembark blocked while the call's CustomsCase is HELD" }
  - { id: ERR_OPEN_SERVICE_ORDERS, http: 409, condition: "Depart blocked: service orders still in REQUESTED / APPROVED / IN_PROGRESS" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PortAuthorityAdmin
    description: "Port authority staff; owns terminal configuration, berths, vessels registry, weather advisories, ops checkpoint, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /port-ops/terminals"
      - "POST /port-ops/berths ; /out-of-service ; /return-to-service"
      - "POST /port-ops/vessels"
      - "POST /port-ops/screening-lanes (create)"
      - "POST /port-ops/weather-advisories ; /cancel"
      - "POST /port-ops/terminals/{id}/run-ops"
      - "POST /port-ops/_clock/set_current_utc"
    shared_operations:
      - "All GET list/single endpoints"
      - "POST /port-ops/port-calls (may create a call for any vessel)"

  - name: Harbormaster
    description: "Berth and movement authority; owns berth assignment, arrival/departure, delay acceptance"
    identity: opaque
    exclusive_operations:
      - "POST /port-ops/port-calls/{id}/berth-assignments"
      - "POST /port-ops/berth-assignments/{id}/confirm"
      - "POST /port-ops/port-calls/{id}/arrive ; /depart ; /confirm-revised"
    shared_operations:
      - "All GET endpoints"
      - "POST /port-ops/port-calls/{id}/cancel (shared with VesselAgent)"
      - "POST /port-ops/service-orders/{id}/approve ; /reject (shared with TerminalOperator; sole approver under CONSTRAINED posture)"
      - "GET /port-ops/terminals/{id}/screening-requirement"

  - name: TerminalOperator
    description: "Terminal floor operator; runs passenger flow, baggage, lanes, service execution, transport queue"
    identity: opaque
    exclusive_operations:
      - "POST /port-ops/port-calls/{id}/begin-turnaround"
      - "POST /port-ops/manifest-entries/{id}/check-in ; /screen ; /board ; /offload ; /disembark"
      - "POST /port-ops/baggage-items (create) ; /stage ; /load ; /report-mistag ; /recover ; /deliver"
      - "POST /port-ops/screening-lanes/{id}/open ; /close"
      - "POST /port-ops/service-orders/{id}/start ; /complete"
      - "POST /port-ops/transport-slots (create) ; /dispatch ; /complete ; /no-show ; /requeue"
    shared_operations:
      - "All GET endpoints"
      - "POST /port-ops/service-orders/{id}/approve ; /reject (shared with Harbormaster; blocked under CONSTRAINED posture)"
      - "GET /port-ops/terminals/{id}/screening-requirement"

  - name: VesselAgent
    description: "Shipping-line agent for one vessel; X-User-ID equals the Vessel id it represents; acts only on its own vessel's calls"
    identity: "entity_backed:Vessel"
    exclusive_operations:
      - "POST /port-ops/port-calls/{id}/delay"
      - "POST /port-ops/port-calls/{id}/manifest-entries"
      - "POST /port-ops/port-calls/{id}/service-orders"
      - "POST /port-ops/service-orders/{id}/cancel"
      - "POST /port-ops/invoices/{id}/dispute"
    shared_operations:
      - "All GET endpoints (single-resource GETs and child lists of other vessels' calls return ERR_VESSEL_SCOPE; own-vessel data only)"
      - "POST /port-ops/port-calls (own vessel_id only, shared with PortAuthorityAdmin)"
      - "POST /port-ops/port-calls/{id}/cancel (own vessel only, shared with Harbormaster)"

  - name: CustomsOfficer
    description: "CBP liaison; owns customs cases and per-passenger customs actions"
    identity: opaque
    exclusive_operations:
      - "POST /port-ops/port-calls/{id}/customs-cases"
      - "POST /port-ops/customs-cases/{id}/file ; /hold ; /clear"
      - "POST /port-ops/manifest-entries/{id}/customs-hold ; /customs-release"
    shared_operations:
      - "All GET endpoints"

  - name: BillingClerk
    description: "Port finance; owns provisional/final invoicing, issuing, settlement, adjustments, call closeout"
    identity: opaque
    exclusive_operations:
      - "POST /port-ops/port-calls/{id}/provisional-invoice"
      - "POST /port-ops/invoices/{id}/issue ; /settle ; /adjustments"
      - "POST /port-ops/port-calls/{id}/close"
    shared_operations:
      - "All GET endpoints"
