        grounds:
          - state_machines.ProceedsDistribution.transitions[POSTED->REVERSED]
          - calculations.agency_proceeds_ledger_balance
          - entities.Agency.fields.proceeds_account_balance_cents
          - entities.Agency.fields.posted_distribution_count
          - validations[priority=23]
