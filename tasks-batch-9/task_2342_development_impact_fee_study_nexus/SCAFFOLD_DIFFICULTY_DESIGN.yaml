      - name: certificate_of_occupancy_is_blocked_by_an_open_deferral_agreement
        grounds:
          - state_machines.DevelopmentApplication.co_issued_at=null_to_co_issued_at=clock
          - validations[priority=32]
          - entities.DeferralAgreement.fields.status
          - state_machines.DeferralAgreement.REQUESTED_to_DENIED
          - errors.ERR_CO_BLOCKED_UNPAID
        distinguishing_aspect: |
          The money test already passes - collection_status is PAID and paid_cents
          equals net_due_cents 5,189,521 - yet issue-co still fails with
          ERR_CO_BLOCKED_UNPAID because a sibling DeferralAgreement of the same application
          is still REQUESTED. Denying that agreement touches only the agreement row (the
          application's version and money fields do not move) and the identical issue-co
          then succeeds, which isolates the gate to the other entity's state.
