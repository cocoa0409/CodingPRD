            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "POST /treatment-plans/${bp}/treatment-cycles"
              payload: { preauthorization_id: "${bph}", retrieval_date: "2026-09-28T00:00:00Z", transfer_date: "2026-09-30T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { idem_cy: $.data.id }
            - call: "POST /treatment-cycles/${idem_cy}/start-stimulation"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${idem_cy}/record-retrieval"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${idem_cy}/record-fertilization"
              payload: {}
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${idem_cy}/record-transfer"
              payload: { transfer_date: "2026-09-30T00:00:00Z", embryos_transferred: 1 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
            - call: "POST /treatment-cycles/${idem_cy}/record-outcome"
              payload: { live_birth: false, births_count: 0, multiple_birth: false, gestational_weeks: 0 }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { idem_cy_v: $.data.version }
            - call: "POST /clinics/${bc}/report-outcome"
              payload: { treatment_cycle_id: "${idem_cy}", live_birth: false, births_count: 0, multiple_birth: false, gestational_weeks: 0, expected_treatment_cycle_version: "${idem_cy_v}" }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { idem_or: $.data.id }
          trigger:
            - call: "POST /clinics/${bc}/report-outcome"
              payload: { treatment_cycle_id: "${idem_cy}", live_birth: true, births_count: 1, multiple_birth: false, gestational_weeks: 39, expected_treatment_cycle_version: "${idem_cy_v}" }
              as: ClinicCoordinator
              as_user_id: "${bc}"
              captures: { err: $.data.error_id }
          assert:
            - "the second report returns 409 and err == ERR_DUPLICATE_OPERATION"
            - "err != ERR_CYCLE_VERSION_STALE — the OCC input was current, so the idempotency gate is what fired"
            - "GET /outcome-records?clinic_id=${bc} returns exactly 1 row"
            - "OutcomeRecord.${idem_or}.live_birth == false — the duplicate did not overwrite the first report"
            - "Clinic.${bc}.cycles_reported == 1 and Clinic.${bc}.live_birth_rate_bps == 0"

