      - name: performer_not_on_case_at_priority_12_outranks_the_out_of_range_completed_at_at_14_1
        claim_type: Priority Ordering
        grounds:
          - validations[priority=12]
          - validations[priority=14.1]
          - errors[ERR_PERFORMER_NOT_ON_CASE]
          - errors[ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE]
          - endpoints[POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unattached_performer_at_12_outranks_future_dated_completed_at_at_14_1_on_checklist_complete
          rationale: |
            §1.4 declares this as PRIORITY CONFLICT PAIR 5, and the cited §1.8 instance already drives
            exactly this call with both rungs armed: a performed_by_staff_id holding neither an ACTIVE
            CareAssignment on the encounter nor an ACTIVE CHARGE/OR_STANDBY shift on the unit, AND a
            completed_at stamped after clock_now. It asserts ERR_PERFORMER_NOT_ON_CASE (422) with the
            409-family timestamp error suppressed, then repairs the performer to expose
            ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE underneath. A §1.9 breadth instance over the same
            endpoint pair would be a verbatim restatement, so only the pointer is kept here.

      - name: divert_posture_at_priority_8_02_outranks_the_exhausted_induction_day_budget_at_priority_15
        claim_type: Priority Ordering
        grounds:
          - validations[priority=8.02]
          - validations[priority=15]
          - errors[ERR_UNIT_POSTURE_BLOCKS_OPERATION]
          - errors[ERR_INDUCTION_CAPACITY_EXCEEDED]
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
          - calculations.unit_posture_derivation
          - calculations.induction_capacity_projection
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / divert_posture_at_8_02_outranks_exceeded_day_bed_minute_budget_at_15_on_induction_hold
          rationale: |
            The cited §1.8 instance already stands a unit in DIVERT while the requested hold would
            also overrun max_daily_induction_bed_minutes, and asserts ERR_UNIT_POSTURE_BLOCKS_OPERATION
            (409) rather than ERR_INDUCTION_CAPACITY_EXCEEDED — the seven-rung gap between the state
            check and the fiscal check on a single hold-capacity call. Note that the sibling corner
            (§1.4's declared PRIORITY CONFLICT PAIR 2, 11.4 readiness vs 15 capacity on /confirm) is
            NOT separately probed here because it is structurally unreachable: any unit whose
            cesarean_readiness_state is NOT_READY derives staffing_posture INDUCTION_FROZEN, and
            /confirm requires a posture IN {OPEN, RATIO_STRAINED}, so rung 8.02 always fires first and
            ERR_CESAREAN_READINESS_NOT_MET can never be the answer on that endpoint.

      - name: shift_window_overlap_and_the_maximum_shift_span_at_priority_13_2
        claim_type: Violation → Error
        grounds:
          - validations[priority=13.2]
          - errors[ERR_SHIFT_WINDOW_OVERLAP]
          - errors[ERR_SHIFT_WINDOW_TOO_LONG]
          - endpoints[POST /shift-assignments]
          - entities.ShiftAssignment.fields.shift_start_utc
          - entities.ShiftAssignment.fields.shift_end_utc
        excluded_because:
          difficulty_instance: resource_temporal_overlap / shift_window_admits_the_touching_sixteen_hundred_start_and_the_exact_720_minute_span_but_refuses_15_59_and_721
          rationale: |
            The cited §1.8 instance already walks all four sides of this rung on one staff member: the
            half-open overlap semantics (a window starting exactly when the incumbent ends is admitted,
            one minute earlier collides with ERR_SHIFT_WINDOW_OVERLAP) and the MAX_SHIFT_MINUTES
            ceiling (exactly 720 minutes admitted, 721 refused with ERR_SHIFT_WINDOW_TOO_LONG). Both
            error ids of the rung are therefore already triggered in isolation with every earlier rung
            satisfied, which is precisely what a §1.9 validations instance would add.

      - name: bed_turnover_interval_conflict_at_priority_13_3
        claim_type: Violation → Error
        grounds:
          - validations[priority=13.3]
          - errors[ERR_BED_TURNOVER_CONFLICT]
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
          - entities.ObstetricUnit.fields.turnover_buffer_minutes
          - calculations.induction_capacity_projection
        excluded_because:
          difficulty_instance: resource_temporal_overlap / bed_hold_collides_inside_the_frozen_buffer_and_on_the_touching_endpoint_but_admits_one_minute_later
          rationale: |
            13.3 is the closed-interval half of the temporal pair and its only genuinely reachable
            trigger is a recycled bed — hold, confirm, admit, transfer out, advance the clock past
            turnover_clear_at, then let the capacity sweep return the bed to AVAILABLE, because EXPIRED
            holds fall outside the colliding status set. The cited §1.8 instance already builds that
            history and probes the interval on both closed endpoints and one minute clear of them, with
            the frozen turnover_buffer_minutes (45 under OPEN, 75 otherwise) held fixed across the
            comparison. Reproducing it as a breadth instance would duplicate the whole chain for the
            same error id.

  - section: endpoints
    instances:
      - name: create_endpoints_answer_201_while_action_patch_and_delete_endpoints_answer_200
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /obstetric-units]
          - endpoints[POST /obstetric-units/{unitId}/beds]
          - endpoints[POST /labor-encounters]
          - endpoints[POST /labor-encounters/{encounterId}/assign-bed]
          - endpoints[PATCH /obstetric-units/{unitId}]
          - endpoints[DELETE /beds/{bedId}]
        distinguishing_aspect: |
          §1.5 assigns 201 to exactly the endpoints that mint a row and 200 to everything else — and
          the discriminator is NOT the HTTP verb: POST /labor-encounters/{encounterId}/assign-bed is a
          POST that must answer 200 because it mints nothing, and DELETE /beds/{bedId} must answer 200
          with a Bed body rather than the reflexive 204 No Content, because the bed is closed rather
          than erased and the caller needs to see the resulting status. A framework's default status
          conventions (201 for every POST, 204 for every DELETE) fail this in two places at once. The
          deleted bed's body is what proves DELETE is a soft close: status CLOSED, not an absent row.
        test_recipe:
          setup: |
            Only the logical clock is pinned; every row this instance inspects is created inside the
            trigger so each response status is observed directly.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_2: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-STATUS-2010", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id }
            - call: POST /labor-encounters/${enc_id}/assign-bed
              payload: { bed_id: "${bed_ldr_1}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: PATCH /obstetric-units/${unit_id}
              payload: { max_daily_induction_bed_minutes: 1440 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: DELETE /beds/${bed_ldr_2}
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          assert:
            - "HTTP 201 on POST /obstetric-units"
            - "HTTP 201 on both POST /obstetric-units/${unit_id}/beds calls"
            - "HTTP 201 on POST /labor-encounters"
            - "HTTP 200 on POST /labor-encounters/${enc_id}/assign-bed"
            - "HTTP 200 on PATCH /obstetric-units/${unit_id}"
            - "HTTP 200 on DELETE /beds/${bed_ldr_2}"
            - "the DELETE response body is a Bed with Bed.${bed_ldr_2}.status == \"CLOSED\""
            - "Bed.${bed_ldr_1}.status == \"OCCUPIED\""
            - "Bed.${bed_ldr_1}.current_encounter_id == \"${enc_id}\""
            - "ObstetricUnit.${unit_id}.max_daily_induction_bed_minutes == 1440"
            - "LaborEncounter.${enc_id}.bed_id == \"${bed_ldr_1}\""

      - name: induction_booking_list_orders_by_promotion_rank_not_by_creation_order
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /induction-bookings]
          - calculations.induction_priority_class
          - entities.InductionBooking.fields.priority_class
        distinguishing_aspect: |
          §1.5 pins this list to the sweep's promotion key — PRIORITY_RANK[priority_class] ASC, then
          requested_start_utc ASC, then created_at ASC — explicitly so a test can read the promotion
          order before sweeping. Every other list in this scaffold is ordered by a timestamp, so a
          single shared "order by created_at" list helper passes every other listing test and fails
          only here. The three bookings are created in the exact reverse of their promotion order and
          given requested_start_utc values that would also disagree with creation order, so creation
          order, requested-start order and promotion order are three different permutations and only
          the correct one satisfies the assertion. The priority_class filter is then applied to prove
          filtering and ordering compose rather than one resetting the other.
        test_recipe:
          setup: |
            One unit and three REQUESTED bookings created deliberately out of order: PATIENT_REQUEST at
            gestational age 37 (rank last) created first with the EARLIEST requested_start_utc,
            ELECTIVE_NO_INDICATION at 39 weeks (ELECTIVE_39_WEEK, rank middle) created second, and
            PREECLAMPSIA (MEDICALLY_INDICATED, rank first) created last with the LATEST start.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-ORDER-A", gestational_age_weeks: 37, indication_code: "ELECTIVE_NO_INDICATION", requested_start_utc: "2026-08-02T07:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_request: $.data.id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-ORDER-B", gestational_age_weeks: 39, indication_code: "ELECTIVE_NO_INDICATION", requested_start_utc: "2026-08-02T09:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_elective: $.data.id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-ORDER-C", gestational_age_weeks: 41, indication_code: "PREECLAMPSIA", requested_start_utc: "2026-08-02T11:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_medical: $.data.id }
          trigger:
            - call: GET /induction-bookings
              payload: { unit_id: "${unit_id}", limit: 10, offset: 0 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures:
                first_id: "$.data[0].id"
                second_id: "$.data[1].id"
                third_id: "$.data[2].id"
            - call: GET /induction-bookings
              payload: { unit_id: "${unit_id}", priority_class: "ELECTIVE_39_WEEK", limit: 10, offset: 0 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
          assert:
            - "HTTP 200 on both list calls"
            - "the unfiltered list returns exactly 3 rows with total_count == 3 and has_more == false"
            - "first_id == \"${booking_medical}\" (MEDICALLY_INDICATED sorts first despite being created last and starting last)"
            - "second_id == \"${booking_elective}\""
            - "third_id == \"${booking_request}\" (PATIENT_REQUEST sorts last despite being created first and starting first)"
            - "InductionBooking.${booking_request}.priority_class == \"PATIENT_REQUEST\""
            - "InductionBooking.${booking_elective}.priority_class == \"ELECTIVE_39_WEEK\""
            - "InductionBooking.${booking_medical}.priority_class == \"MEDICALLY_INDICATED\""
            - "the filtered list returns exactly 1 row, that row's id == \"${booking_elective}\", total_count == 1 and has_more == false"

      - name: shift_assignment_link_requires_the_staff_member_to_belong_to_the_named_unit
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /shift-assignments]
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_STAFF_NOT_FOUND]
          - errors[ERR_CROSS_UNIT_REFERENCE]
          - entities.ShiftAssignment.fields.capacity_units_effective
          - calculations.staff_capacity_units
        distinguishing_aspect: |
          POST /shift-assignments is the scaffold's purest cross-reference link: it names a unit and a
          staff member in the body and creates the association between them, and §1.4 requires BOTH
          that each id resolves (priority 4) and that the staff member is scoped to the named unit
          (priority 7) — two different failure modes that a single "SELECT staff WHERE id = ?" lookup
          collapses into one. An implementation that only checks existence happily books a nurse from
          another hospital onto this unit's ratio ledger. The successful third call also pins the
          snapshot semantics of the link: capacity_units_effective is written from calc
          staff_capacity_units at ACTIVATION, so it is null on a freshly created SCHEDULED shift and
          becomes 4.0 (BEDSIDE base 4.0 capped by the ADVANCED cert cap 4.0, no charge offset) only
          once the shift is activated.
        test_recipe:
          setup: |
            Two units. The only staff member belongs to unit B; unit A has no staff at all, so the
            cross-unit attempt cannot accidentally resolve to a local row.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_a: $.data.id }
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center Annex", licensed_ldr_beds: 2, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_b: $.data.id }
            - call: POST /obstetric-units/${unit_b}/staff-members
              payload: { full_name: "Dana Alvarez RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_b: $.data.id }
          trigger:
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_a}", staff_id: "staff-never-hired-0001", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { missing_err: $.data.error_id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_a}", staff_id: "${staff_b}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { scope_err: $.data.error_id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_b}", staff_id: "${staff_b}", role_slot: "BEDSIDE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_ok: $.data.id }
            - call: POST /shift-assignments/${shift_ok}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
          assert:
            - "HTTP 404 on the first trigger call with error_id == \"ERR_STAFF_NOT_FOUND\""
            - "HTTP 422 on the second trigger call with error_id == \"ERR_CROSS_UNIT_REFERENCE\""
            - "the second trigger call does NOT return error_id \"ERR_STAFF_NOT_FOUND\""
            - "HTTP 201 on the third trigger call"
            - "ShiftAssignment.${shift_ok}.unit_id == \"${unit_b}\""
            - "ShiftAssignment.${shift_ok}.staff_id == \"${staff_b}\""
            - "immediately after creation, ShiftAssignment.${shift_ok}.status == \"SCHEDULED\" and capacity_units_effective == null"
            - "HTTP 200 on the activate call"
            - "after activation, ShiftAssignment.${shift_ok}.status == \"ACTIVE\" and capacity_units_effective == 4.0"
            - "ShiftAssignment.${shift_ok}.assigned_acuity_load_units == 0.0"
            - "the GET /shift-assignments list filtered by unit_id == \"${unit_a}\" returns exactly 0 rows"

      - name: bed_status_patch_flips_available_and_blocked_but_refuses_an_occupied_bed
        claim_type: Action endpoint
        grounds:
          - endpoints[PATCH /beds/{bedId}]
          - validations[priority=5]
          - validations[priority=8.07]
          - errors[ERR_BED_NOT_RELEASABLE]
          - errors[ERR_INVALID_FIELD_VALUE]
          - state_machines.Bed.status
        distinguishing_aspect: |
          PATCH /beds/{bedId} looks like a generic field update but §1.5 restricts its input enum to
          {AVAILABLE, BLOCKED} — the other three Bed statuses (OCCUPIED, HELD, TURNOVER, CLOSED) are
          reachable only through the lifecycle endpoints that own them. So this endpoint has two
          distinct rejection modes that a naive "set status to whatever the client sent" implementation
          collapses: a syntactically out-of-enum target (TURNOVER, priority 5, 400) and a
          syntactically legal target on a bed the charge nurse does not own right now (an OCCUPIED bed,
          priority 8.07, 409 ERR_BED_NOT_RELEASABLE). The two successful flips in between prove the
          manual AVAILABLE <-> BLOCKED round trip is genuinely open, so the refusals are about the
          bed's current state and the enum rather than a blanket read-only field.
        test_recipe:
          setup: |
            One unit with two LDR beds; LDR-01 is occupied by an encounter and LDR-02 is AVAILABLE.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_2: $.data.id }
            - call: POST /labor-encounters
