              captures: { b_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ProcedureBooking.${b_id}.status == BOOKED"
            - "Room.${room_id}.version == 2"

      - name: occ_stale_membership_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[cosmetic-redeem-stale-membership]"
          - "errors[ERR_STALE_MEMBERSHIP_VERSION]"
        distinguishing_aspect: "After one redemption advances membership.version, a second redemption still carrying the pre-redemption version (captured value minus 1) -> ERR_STALE_MEMBERSHIP_VERSION (412)."
        test_recipe:
          setup: ["COSMETIC encounter; GOLD membership activated, one redemption already applied (version advanced)."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Stl", npi: "SL-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Stl Pat", date_of_birth: "1988-02-26" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "COSMETIC", scheduled_at: "2026-02-03T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /cosmetic-memberships"
              payload: { patient_id: "${pat_id}", tier: "GOLD", purchased_unit_cents: 100000 }
              as: BillingSpecialist
              captures: { mem_id: $.data.id }
            - call: "POST /cosmetic-memberships/${mem_id}/activate"
              payload: {}
              as: BillingSpecialist
              captures: { mem_v1: $.data.version }
            - call: "POST /cosmetic-treatments"
              payload: { encounter_id: "${enc_id}", membership_id: "${mem_id}", service_name: "first", list_price_cents: 10000, expected_membership_version: "${mem_v1}" }
              as: BillingSpecialist
              captures: { t1_id: $.data.id, mem_v2: $.data.version }
          trigger:
            - call: "POST /cosmetic-treatments"
              payload: { encounter_id: "${enc_id}", membership_id: "${mem_id}", service_name: "second-stale", list_price_cents: 10000, expected_membership_version: "${mem_v2} - 1" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_MEMBERSHIP_VERSION"

      - name: booking_cancel_frees_room_interval
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.ProcedureBooking.BOOKED_to_CANCELLED
          - "validations[priority=10]"
        distinguishing_aspect: "Cancelling a BOOKED room interval frees it: a subsequent booking on the exact same room+time that previously would conflict now succeeds (201)."
        test_recipe:
          setup: ["STANDARD room buffer 0 with one BOOKED [10:00,11:00); then that booking is CANCELLED."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { full_name: "Dr Free", npi: "FR-1", active: true }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Free Pat", date_of_birth: "1990-03-27" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", visit_type: "MEDICAL", scheduled_at: "2026-02-04T09:00:00Z" }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Free Room", room_kind: "STANDARD", turnover_buffer_minutes: 0 }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /procedure-bookings"
              payload: { room_id: "${room_id}", provider_id: "${prov_id}", encounter_id: "${enc_id}", procedure_kind: "EXCISION", start_at: "2026-02-04T10:00:00Z", end_at: "2026-02-04T11:00:00Z", expected_room_version: "${room_v0}" }
              as: FrontDesk
              captures: { b1_id: $.data.id }
            - call: "POST /procedure-bookings/${b1_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { room_v_after_cancel: $.data.version }
            - call: "GET /rooms/${room_id}"
              payload: {}
              as: FrontDesk
              captures: { room_v_now: $.data.version }
          trigger:
            - call: "POST /procedure-bookings"
              payload: { room_id: "${room_id}", provider_id: "${prov_id}", encounter_id: "${enc_id}", procedure_kind: "EXCISION", start_at: "2026-02-04T10:00:00Z", end_at: "2026-02-04T11:00:00Z", expected_room_version: "${room_v_now}" }
              as: FrontDesk
              captures: { b2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ProcedureBooking.${b2_id}.status == BOOKED"

