            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl}", modality_id: "${mod}", consent_id: "${con}", start_at: "2026-01-05T09:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl_v}" }
              as: FrontDesk
