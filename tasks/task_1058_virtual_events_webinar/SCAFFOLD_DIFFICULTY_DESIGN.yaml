      - name: booth_approval_requires_sponsor_contract_signed
        grounds:
          - state_machines.Booth.SUBMITTED_to_APPROVED
          - entities.Sponsor.fields.contract_status
          - "validations[priority=44]"
          - "errors[ERR_CONTRACT_NOT_SIGNED]"
        distinguishing_aspect: |
          A DIFFERENT entity pair, BOOTH -> SPONSOR: the Booth is legitimately SUBMITTED and the
          Organizer is authorised, yet approval is rejected solely because Sponsor.contract_status
          is UNSIGNED; signing the contract afterwards makes the identical call succeed.
        test_recipe:
          setup:
            - "Event 'Expo N' PUBLISHED with a SILVER sponsor whose contract_status is still UNSIGNED."
            - "That sponsor's booth has been submitted and is in state SUBMITTED with revision_round 1."
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Expo N", timezone: "UTC", starts_at: "2026-09-24T09:00:00Z", ends_at: "2026-09-24T18:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 50 }
