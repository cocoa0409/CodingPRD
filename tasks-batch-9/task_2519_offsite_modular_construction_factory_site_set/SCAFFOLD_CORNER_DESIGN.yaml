              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m1: "$.data.id" }
            - call: "POST /modular/defect-claims"
              payload: { module_id: "${m1}", discovered_phase: "FACTORY", description: "marriage wall out of plumb", repair_cost_cents: 1234567 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { claim: "$.data.id", st0: "$.data.status", round0: "$.data.adjudication_round" }
          trigger:
            - call: "POST /modular/defect-claims/${claim}/adjudicate"
              payload: { adjudication_note: "phase presumption" }
              as: WarrantyAdjudicator
              captures: { st1: "$.data.status", round1: "$.data.adjudication_round" }
            - call: "POST /modular/defect-claims/${claim}/dispute"
