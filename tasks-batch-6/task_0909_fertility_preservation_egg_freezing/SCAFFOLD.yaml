# =============================================================================
# Fertility Preservation & Egg Freezing (elective) — Expert scaffold
# §1.0–§1.7 (SCAFFOLD.yaml). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: "Fertility Preservation & Egg Freezing (elective): consultation & ovarian-reserve testing, cycle protocol & monitoring calendar, retrieval & cryo-inventory (vial/straw), storage subscription & renewal, employer-benefit coverage, thaw/transfer authorization, consent & disposition directive, billing"

domain_name: fertility-preservation-egg-freezing
api_prefix: ""   # flat topology: every resource is a top-level collection with FK references

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # directive supersede race on Patient.version (§1.2.1)
    - cascading_side_effects        # retrieval-complete and thaw-execute multi-hop cascades
    - dual_variant_calculation      # cycle cost estimate/final; benefit provisional/settled
    - derived_field_reconciliation  # tank.used_slots, subscription.specimen_count, benefit ledger
  entity_topology: flat
  state_machine_shape: cyclic       # cycle MONITORING<->SUSPENDED, subscription ACTIVE<->PAST_DUE; also branching (thaw) + supersede (directive)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties  # thaw requester != authorizer; plus peer_roles across clinical/billing surfaces
  consistency_model: immediate

# Scenario-wide constants not owned by a single §1.3 calculation (pinned so PRD/impl/test agree).
domain_constants:
  MIN_MONITORING_VISITS: 3          # cycle trigger gate (>=, not >)
  PROVIDER_BUFFER_MINUTES: 15       # buffered exclusion around a provider's monitoring appointments
  OOCYTES_PER_SPECIMEN: 1           # each vial/straw holds 1 oocyte => specimen_count == mature_oocyte_count
  STORAGE_PERIOD_DAYS: 365          # storage billing period length
  GRACE_DAYS: 30                    # grace after current_period_end before LAPSED
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB (ISO 8601 UTC)" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: employer_name, type: string, source: input, required: false, description: "Employer, used to match employer benefit" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Clinical staff name" }
      - { name: provider_role, type: enum, source: input, description: "PHYSICIAN | EMBRYOLOGIST", constraints: "one of {PHYSICIAN, EMBRYOLOGIST}" }
      - { name: npi, type: string, source: input, required: false, description: "National Provider Identifier" }

  - name: ProcedureRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room label" }
      - { name: room_kind, type: enum, source: input, description: "RETRIEVAL_OR | PROCEDURE", constraints: "one of {RETRIEVAL_OR, PROCEDURE}" }

  - name: StorageTank
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cryo tank label" }
      - { name: capacity_slots, type: integer, source: input, description: "Maximum specimens (vials/straws) storable", constraints: ">= 1" }
      - { name: used_slots, type: integer, source: computed, default: 0, description: "Count of CryoSpecimen with tank_id==this AND status IN {STORED, RESERVED}" }
      - { name: is_full, type: boolean, source: computed, default: false, description: "True when used_slots >= capacity_slots" }

  - name: Consultation
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: patient_age_years, type: integer, source: input, description: "Age at consultation (drives yield age tiers)", constraints: ">= 18" }
      - { name: amh_level, type: number, source: input, description: "Anti-Mullerian Hormone ng/mL", constraints: ">= 0" }
      - { name: antral_follicle_count, type: integer, source: input, description: "AFC ultrasound count", constraints: ">= 0" }
      - { name: expected_oocyte_yield, type: integer, source: computed, default: 0, description: "Computed at complete via expected_oocyte_yield calc" }
      - { name: eligibility_status, type: enum, source: computed, default: PENDING, description: "PENDING before complete; ELIGIBLE|INELIGIBLE after", constraints: "one of {PENDING, ELIGIBLE, INELIGIBLE}" }
      - { name: recommended_protocol, type: enum, source: computed, default: NONE, description: "Set at complete from expected yield", constraints: "one of {ANTAGONIST, LONG_AGONIST, MINIMAL_STIM, NONE}" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> COMPLETED", constraints: "one of {REQUESTED, COMPLETED}" }

  - name: StimulationCycle
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: consultation_id, type: string, source: input, description: "FK -> Consultation.id; the completed, eligible consult authorizing this cycle" }
      - { name: protocol_type, type: enum, source: computed, default: NONE, description: "Copied from consultation.recommended_protocol at schedule", constraints: "one of {ANTAGONIST, LONG_AGONIST, MINIMAL_STIM, NONE}" }
      - { name: monitoring_visit_count, type: integer, source: computed, default: 0, description: "Count of non-cancelled MonitoringAppointment for this cycle" }
      - { name: estimated_cost_cents, type: integer, source: computed, default: 0, description: "Provisional cycle cost pinned at schedule (cycle_cost estimate variant)" }
      - { name: final_cost_cents, type: integer, source: computed, default: 0, description: "Final cycle cost pinned at retrieve/complete (cycle_cost final variant)" }
      - { name: retrieval_room_id, type: string, source: system, required: false, description: "FK -> ProcedureRoom.id; room booked at retrieve" }
      - { name: retrieval_start, type: datetime, source: system, required: false, description: "Retrieval window start (set at retrieve)" }
      - { name: retrieval_end, type: datetime, source: system, required: false, description: "Retrieval window end (set at retrieve)" }
      - { name: oocytes_retrieved, type: integer, source: system, default: 0, description: "Total oocytes aspirated (set at retrieve)" }
      - { name: mature_oocyte_count, type: integer, source: system, default: 0, description: "Mature oocytes cryopreserved = number of CryoSpecimen created" }
      - { name: trigger_at, type: datetime, source: system, required: false, description: "Trigger-shot timestamp (set at trigger)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT->SCHEDULED->MONITORING(<->SUSPENDED)->TRIGGERED->COMPLETED; CANCELLED from any non-terminal", constraints: "one of {DRAFT, SCHEDULED, MONITORING, SUSPENDED, TRIGGERED, COMPLETED, CANCELLED}" }

  - name: MonitoringAppointment
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> StimulationCycle.id" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id (monitoring physician)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Appointment start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Appointment end; must be > scheduled_start" }
      - { name: visit_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> CANCELLED (system, on cycle cancel)", constraints: "one of {SCHEDULED, CANCELLED}" }

  - name: CryoSpecimen
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> StimulationCycle.id (retrieval that produced it)" }
      - { name: tank_id, type: string, source: system, description: "FK -> StorageTank.id" }
      - { name: specimen_type, type: enum, source: system, description: "VIAL | STRAW (from retrieve packaging choice)", constraints: "one of {VIAL, STRAW}" }
      - { name: oocyte_count, type: integer, source: system, default: 1, description: "Oocytes in this vial/straw (OOCYTES_PER_SPECIMEN)" }
      - { name: status, type: enum, source: system, default: STORED, description: "STORED->RESERVED->THAWED; STORED->DISCARDED", constraints: "one of {STORED, RESERVED, THAWED, DISCARDED}" }

  - name: StorageSubscription
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: specimen_count, type: integer, source: computed, default: 0, description: "Billed specimen count = count of patient CryoSpecimen in {STORED, RESERVED}" }
      - { name: annual_fee_cents, type: integer, source: computed, default: 0, description: "Most recent storage_renewal_fee result" }
      - { name: current_period_start, type: datetime, source: system, required: false, description: "Active billing period start" }
      - { name: current_period_end, type: datetime, source: system, required: false, description: "Active billing period end (start + STORAGE_PERIOD_DAYS)" }
      - { name: last_paid_at, type: datetime, source: system, required: false, description: "Timestamp of last recorded payment" }
      - { name: status, type: enum, source: system, default: PENDING_ACTIVATION, description: "PENDING_ACTIVATION->ACTIVE(<->PAST_DUE)->LAPSED; CANCELLED from ACTIVE/PAST_DUE", constraints: "one of {PENDING_ACTIVATION, ACTIVE, PAST_DUE, LAPSED, CANCELLED}" }

  - name: BenefitCoverage
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: employer_name, type: string, source: input, description: "Sponsoring employer" }
      - { name: annual_cap_cents, type: integer, source: input, description: "Annual coverage cap", constraints: ">= 0" }
      - { name: covered_pct, type: number, source: input, description: "Fraction of eligible charge covered", constraints: "0 <= covered_pct <= 1" }
      - { name: covered_service_types, type: array, source: input, description: "Subset of {CYCLE, STORAGE, RETRIEVAL, THAW} eligible for coverage" }
      - { name: consumed_cents, type: integer, source: computed, default: 0, description: "Cap consumed by finalized invoices; restored on void" }
      - { name: remaining_cents, type: integer, source: computed, description: "= annual_cap_cents - consumed_cents (invariant: consumed + remaining == annual_cap)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> EXHAUSTED (when remaining_cents == 0); back to ACTIVE if a void frees cap", constraints: "one of {ACTIVE, EXHAUSTED}" }

  - name: Directive
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: directive_type, type: enum, source: input, description: "CONSENT | DISPOSITION", constraints: "one of {CONSENT, DISPOSITION}" }
      - { name: disposition_action, type: enum, source: input, required: false, description: "Required when directive_type==DISPOSITION", constraints: "one of {THAW_TO_SELF, DONATE_TO_RESEARCH, DISCARD, TRANSFER_TO_PARTNER}" }
      - { name: signed_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> SUPERSEDED (new same-type directive) | REVOKED (patient revoke)", constraints: "one of {ACTIVE, SUPERSEDED, REVOKED}" }

  - name: ThawTransferAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: specimen_ids, type: array, source: input, description: "List of CryoSpecimen ids to reserve/thaw (not a scalar FK)" }
      - { name: transfer_type, type: enum, source: input, description: "THAW_TO_TRANSFER | TRANSFER_OUT | RESEARCH_DONATION", constraints: "one of {THAW_TO_TRANSFER, TRANSFER_OUT, RESEARCH_DONATION}" }
      - { name: requester_provider_id, type: string, source: system, description: "X-User-ID of requesting Physician" }
      - { name: authorizer_provider_id, type: string, source: system, required: false, description: "X-User-ID of authorizing Physician (set at authorize; must differ from requester)" }
      - { name: consent_directive_id, type: string, source: system, required: false, description: "ACTIVE CONSENT directive pinned at authorize" }
      - { name: disposition_directive_id, type: string, source: system, required: false, description: "ACTIVE DISPOSITION directive pinned at authorize" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED->{AUTHORIZED->EXECUTED | DENIED}", constraints: "one of {REQUESTED, AUTHORIZED, EXECUTED, DENIED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: service_type, type: enum, source: input, description: "CYCLE | STORAGE | RETRIEVAL | THAW", constraints: "one of {CYCLE, STORAGE, RETRIEVAL, THAW}" }
      - { name: line_items, type: array, source: input, description: "Objects {description, amount_cents(int>=0)}" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of line_items[].amount_cents" }
      - { name: facility_fee_cents, type: integer, source: computed, default: 0, description: "Tier-keyed fee on subtotal (invoice_total calc)" }
      - { name: estimated_coverage_cents, type: integer, source: computed, default: 0, description: "Provisional benefit at DRAFT (benefit_coverage_applied provisional)" }
      - { name: settled_coverage_cents, type: integer, source: computed, default: 0, description: "Final benefit at FINALIZED (benefit_coverage_applied final)" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "= subtotal + facility_fee - settled_coverage (final) / - estimated_coverage (draft)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> FINALIZED -> VOID", constraints: "one of {DRAFT, FINALIZED, VOID}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Consultation
    initial_state: REQUESTED
    terminal_states: [COMPLETED]
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /consultations/{id}/complete"
        actor: Physician
        preconditions:
          - "consultation.status == REQUESTED"
          - "amh_level and antral_follicle_count present (set at creation)"
        side_effects:
          - "compute expected_oocyte_yield (see calculations.expected_oocyte_yield); write Consultation.expected_oocyte_yield"
          - "set eligibility_status = ELIGIBLE if amh_level >= MIN_AMH_NG_ML else INELIGIBLE"
          - "set recommended_protocol from expected_oocyte_yield tiers (NONE when INELIGIBLE)"

  - entity: StimulationCycle
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /stimulation-cycles/{id}/schedule"
        actor: Coordinator
        preconditions:
          - "cycle.status == DRAFT"
          - "referenced Consultation.status == COMPLETED AND Consultation.eligibility_status == ELIGIBLE (cross-entity: Cycle->Consultation)"
        side_effects:
          - "copy protocol_type = Consultation.recommended_protocol"
          - "compute estimated_cost_cents via cycle_cost (estimate variant)"
      - from: SCHEDULED
        to: MONITORING
        trigger: "POST /monitoring-appointments (first appointment for this cycle)"
        actor: Coordinator
        preconditions:
          - "cycle.status == SCHEDULED"
        side_effects:
          - "cycle.status becomes MONITORING; monitoring_visit_count incremented for the created appointment"
        note: "Creating a MonitoringAppointment while cycle is SCHEDULED advances the cycle to MONITORING; subsequent appointments keep it MONITORING and only increment the count."
      - from: MONITORING
        to: SUSPENDED
        trigger: "POST /stimulation-cycles/{id}/suspend"
        actor: Physician
        preconditions:
          - "cycle.status == MONITORING"
        side_effects:
          - "cycle frozen: new MonitoringAppointment creation rejected while SUSPENDED"
      - from: SUSPENDED
        to: MONITORING
        trigger: "POST /stimulation-cycles/{id}/resume"
        actor: Physician
        preconditions:
          - "cycle.status == SUSPENDED"
        side_effects:
          - "cycle re-opened for monitoring (cyclic MONITORING<->SUSPENDED)"
      - from: MONITORING
        to: TRIGGERED
        trigger: "POST /stimulation-cycles/{id}/trigger"
        actor: Physician
        preconditions:
          - "cycle.status == MONITORING"
          - "monitoring_visit_count >= MIN_MONITORING_VISITS (boundary: >=, not >)"
        side_effects:
          - "set trigger_at = current clock"
      - from: TRIGGERED
        to: COMPLETED
        trigger: "POST /stimulation-cycles/{id}/retrieve"
        actor: Physician
        preconditions:
          - "cycle.status == TRIGGERED"
          - "referenced ProcedureRoom exists"
          - "retrieval window does not overlap another Retrieval interval on the same room (business_temporal; half-open [start,end), NO buffer — adjacency allowed)"
          - "target StorageTank has free slots: tank.used_slots + specimens_to_create <= tank.capacity_slots (boundary)"
        side_effects:
          - "set retrieval_room_id, retrieval_start, retrieval_end, oocytes_retrieved, mature_oocyte_count"
          - "CASCADE: create mature_oocyte_count CryoSpecimen rows (status STORED) in target tank -> increments StorageTank.used_slots -> when used_slots >= capacity_slots sets StorageTank.is_full=true"
          - "CASCADE: increment StorageSubscription.specimen_count for the patient (if a subscription exists) -> recompute annual_fee_cents via storage_renewal_fee"
          - "compute final_cost_cents via cycle_cost (final variant)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /stimulation-cycles/{id}/cancel"
        actor: Coordinator
        preconditions: ["cycle.status in {DRAFT, SCHEDULED, MONITORING, SUSPENDED}"]
        side_effects: ["release estimated_cost_cents (no charge)"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /stimulation-cycles/{id}/cancel"
        actor: Coordinator
        preconditions: ["cycle.status in {DRAFT, SCHEDULED, MONITORING, SUSPENDED}"]
        side_effects: ["CASCADE: set all this cycle's MonitoringAppointment.visit_status = CANCELLED (only SCHEDULED ones)"]
      - from: MONITORING
        to: CANCELLED
        trigger: "POST /stimulation-cycles/{id}/cancel"
        actor: Coordinator
        preconditions: ["cycle.status in {DRAFT, SCHEDULED, MONITORING, SUSPENDED}"]
        side_effects: ["CASCADE: set all this cycle's MonitoringAppointment.visit_status = CANCELLED (only SCHEDULED ones)"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /stimulation-cycles/{id}/cancel"
        actor: Coordinator
        preconditions: ["cycle.status in {DRAFT, SCHEDULED, MONITORING, SUSPENDED}"]
        side_effects: ["CASCADE: set all this cycle's MonitoringAppointment.visit_status = CANCELLED (only SCHEDULED ones)"]

  - entity: StorageSubscription
    initial_state: PENDING_ACTIVATION
    terminal_states: [LAPSED, CANCELLED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /storage-subscriptions/{id}/record-payment"
        actor: BillingAdmin
        preconditions: ["subscription.status == PENDING_ACTIVATION"]
        side_effects:
          - "set current_period_start = current clock; current_period_end = start + STORAGE_PERIOD_DAYS"
          - "set last_paid_at = current clock"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /storage-subscriptions/{id}/renew"
        actor: BillingAdmin
        preconditions:
          - "subscription.status == ACTIVE"
          - "current clock >= current_period_end (period elapsed)"
        side_effects:
          - "recompute annual_fee_cents via storage_renewal_fee over current specimen_count"
          - "status becomes PAST_DUE awaiting payment (renewal invoice due)"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /storage-subscriptions/{id}/record-payment"
        actor: BillingAdmin
        preconditions:
          - "subscription.status == PAST_DUE"
          - "current clock < current_period_end + GRACE_DAYS (paid within grace)"
        side_effects:
          - "advance current_period_start = previous current_period_end; current_period_end += STORAGE_PERIOD_DAYS"
          - "set last_paid_at = current clock (cyclic ACTIVE<->PAST_DUE)"
      - from: PAST_DUE
        to: LAPSED
        trigger: "POST /storage-subscriptions/{id}/renew"
        actor: BillingAdmin
        preconditions:
          - "subscription.status == PAST_DUE"
          - "current clock >= current_period_end + GRACE_DAYS (grace expired)"
        side_effects:
          - "CASCADE: set all this patient's CryoSpecimen with status==STORED to DISCARDED -> decrement each specimen's StorageTank.used_slots"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /storage-subscriptions/{id}/cancel"
        actor: BillingAdmin
        preconditions: ["subscription.status in {ACTIVE, PAST_DUE}"]
        side_effects: ["stop billing; specimens retained under patient ownership"]
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /storage-subscriptions/{id}/cancel"
        actor: BillingAdmin
        preconditions: ["subscription.status in {ACTIVE, PAST_DUE}"]
        side_effects: ["stop billing; specimens retained under patient ownership"]

  - entity: Directive
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: POST /directives creates a newer directive of the same directive_type for the same patient"
        actor: system
        preconditions: ["prior directive.status == ACTIVE AND same patient_id AND same directive_type as the new one"]
        side_effects: ["prior directive.status = SUPERSEDED; new directive becomes the ACTIVE one; Patient.version incremented by the create (see §1.2.1)"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /directives/{id}/revoke"
        actor: Patient
        preconditions: ["directive.status == ACTIVE", "acting Patient owns the directive (X-User-ID == directive.patient_id)"]
        side_effects: ["directive.status = REVOKED"]

  - entity: CryoSpecimen
    initial_state: STORED
    terminal_states: [THAWED, DISCARDED]
    transitions:
      - from: STORED
        to: RESERVED
        trigger: "system: POST /thaw-transfer-authorizations/{id}/authorize"
        actor: system
        preconditions: ["specimen.status == STORED", "specimen belongs to the authorization's patient"]
        side_effects: ["specimen.status = RESERVED (still occupies a tank slot; used_slots unchanged)"]
      - from: RESERVED
        to: THAWED
        trigger: "system: POST /thaw-transfer-authorizations/{id}/execute"
        actor: system
        preconditions: ["specimen.status == RESERVED"]
        side_effects: ["specimen.status = THAWED -> decrement StorageTank.used_slots -> decrement patient StorageSubscription.specimen_count -> recompute storage_renewal_fee"]
      - from: STORED
        to: DISCARDED
        trigger: "system: subscription LAPSED cascade OR disposition DISCARD"
        actor: system
        preconditions: ["specimen.status == STORED"]
        side_effects: ["specimen.status = DISCARDED -> decrement StorageTank.used_slots"]

  - entity: ThawTransferAuthorization
    initial_state: REQUESTED
    terminal_states: [EXECUTED, DENIED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /thaw-transfer-authorizations/{id}/authorize"
        actor: Physician
        preconditions:
          - "authorization.status == REQUESTED"
          - "acting Physician (X-User-ID) != requester_provider_id (segregation of duties)"
          - "patient has an ACTIVE CONSENT Directive (business_safety)"
          - "patient has an ACTIVE DISPOSITION Directive (business_safety)"
          - "every specimen in specimen_ids belongs to patient (business_referential) AND is STORED"
        side_effects:
          - "pin consent_directive_id and disposition_directive_id; set authorizer_provider_id"
          - "CASCADE: set each referenced CryoSpecimen STORED -> RESERVED"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /thaw-transfer-authorizations/{id}/deny"
        actor: Physician
        preconditions: ["authorization.status == REQUESTED"]
        side_effects: ["no reservation occurs (divergent branch from AUTHORIZED)"]
      - from: AUTHORIZED
        to: EXECUTED
        trigger: "POST /thaw-transfer-authorizations/{id}/execute"
        actor: Embryologist
        preconditions:
          - "authorization.status == AUTHORIZED"
          - "every referenced CryoSpecimen.status == RESERVED"
        side_effects:
          - "CASCADE: each referenced CryoSpecimen RESERVED -> THAWED -> decrement StorageTank.used_slots -> decrement StorageSubscription.specimen_count -> recompute storage_renewal_fee"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /invoices/{id}/finalize"
        actor: BillingAdmin
        preconditions:
          - "invoice.status == DRAFT"
          - "if service_type in patient's ACTIVE BenefitCoverage.covered_service_types, remaining cap must be checked (fiscal); finalize never exceeds cap (coverage is capped, not rejected)"
        side_effects:
          - "compute subtotal_cents, facility_fee_cents, settled_coverage_cents (benefit final variant), total_due_cents via invoice_total"
          - "CASCADE: BenefitCoverage.consumed_cents += settled_coverage_cents -> remaining_cents recomputed -> status EXHAUSTED if remaining_cents == 0"
      - from: FINALIZED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: BillingAdmin
        preconditions: ["invoice.status == FINALIZED"]
        side_effects:
          - "COMPENSATION: BenefitCoverage.consumed_cents -= settled_coverage_cents -> remaining_cents restored -> status back to ACTIVE if remaining_cents > 0 (invariant consumed+remaining==annual_cap preserved)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned race)
# =============================================================================
concurrency_rules:
  - rule_id: directive-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /directives"
    occ_field: "expected_patient_version"
    description: |
      Creating a Directive against a Patient whose version has advanced since
      the client last observed it is rejected. A newer directive of the same
      directive_type legitimately supersedes the prior ACTIVE one and bumps
      Patient.version; a create still carrying the pre-supersede version is
      therefore stale and rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: expected_oocyte_yield
    trigger: "POST /consultations/{id}/complete"
    algorithm: threshold
    formula: |
      base = AMH_YIELD_FACTOR * amh_level + AFC_YIELD_FACTOR * antral_follicle_count
      age_multiplier =
        1.00 if patient_age_years < 35
        0.85 if 35 <= patient_age_years < 38
        0.65 if 38 <= patient_age_years < 41
        0.40 if patient_age_years >= 41
      raw = base * age_multiplier
      expected_oocyte_yield = min(MAX_EXPECTED_YIELD, max(0, floor(raw)))
    input_set: "Single Consultation's amh_level, antral_follicle_count, patient_age_years"
    constants: { AMH_YIELD_FACTOR: 2.0, AFC_YIELD_FACTOR: 0.5, MAX_EXPECTED_YIELD: 30, MIN_AMH_NG_ML: 0.5 }
    precision: "floor to integer after multiplier"

  - name: cycle_cost
    trigger: "estimate at POST /stimulation-cycles/{id}/schedule; final at POST /stimulation-cycles/{id}/retrieve"
    algorithm: forward_looking
    formula: |
      med_fee = MEDICATION_FEE_BY_PROTOCOL[protocol_type]   # ANTAGONIST 300000, LONG_AGONIST 350000, MINIMAL_STIM 150000
      estimate (forward_looking): estimated_cost_cents = BASE_CYCLE_FEE + EXPECTED_MONITORING_VISITS * MONITORING_VISIT_FEE + med_fee
      final (chronological):      final_cost_cents     = BASE_CYCLE_FEE + monitoring_visit_count * MONITORING_VISIT_FEE + med_fee + RETRIEVAL_FEE
    input_set: "One StimulationCycle; estimate uses the EXPECTED_MONITORING_VISITS constant, final uses the actual non-cancelled monitoring_visit_count"
    constants: { BASE_CYCLE_FEE: 800000, MONITORING_VISIT_FEE: 25000, EXPECTED_MONITORING_VISITS: 5, RETRIEVAL_FEE: 400000, MEDICATION_FEE_BY_PROTOCOL: { ANTAGONIST: 300000, LONG_AGONIST: 350000, MINIMAL_STIM: 150000 } }
    precision: "integer cents"
    variants:
      - { name: estimate, when: "at schedule", difference: "projects EXPECTED_MONITORING_VISITS and excludes RETRIEVAL_FEE" }
      - { name: final, when: "at retrieve/complete", difference: "uses actual monitoring_visit_count and adds RETRIEVAL_FEE" }

  - name: storage_renewal_fee
    trigger: "at retrieve/thaw specimen_count change and at POST /storage-subscriptions/{id}/renew"
    algorithm: aggregation
    formula: |
      per_specimen_net_cents = round_half_up(ANNUAL_RATE_PER_SPECIMEN_CENTS * (1 - LOYALTY_DISCOUNT_PCT))   # round PER SPECIMEN first (pinned)
      annual_fee_cents = specimen_count * per_specimen_net_cents                                             # then multiply/sum
    input_set: "StorageSubscription.specimen_count"
    constants: { ANNUAL_RATE_PER_SPECIMEN_CENTS: 4000, LOYALTY_DISCOUNT_PCT: 0.0333 }
    precision: "round_half_up per specimen BEFORE multiplying by count; NOT round(count*rate*(1-disc))"
    variants:
      - { name: per_specimen_rounding, when: "pinned order", difference: "round each specimen's net fee then sum; sum-then-round would differ by cents" }

  - name: benefit_coverage_applied
    trigger: "provisional at POST /invoices (DRAFT); final at POST /invoices/{id}/finalize"
    algorithm: threshold
    formula: |
      eligible = subtotal_cents if invoice.service_type in coverage.covered_service_types else 0
      raw_cover = round_half_up(coverage.covered_pct * eligible)
      applied = min(coverage.remaining_cents, raw_cover)    # capped at remaining cap
    input_set: "Patient's ACTIVE BenefitCoverage (earliest created_at if multiple) and the invoice subtotal"
    constants: {}
    precision: "round_half_up on covered_pct*eligible, then min with remaining_cents"
    variants:
      - { name: provisional, when: "at DRAFT create", difference: "uses remaining_cents at draft time; stored as estimated_coverage_cents" }
      - { name: final, when: "at finalize", difference: "re-reads remaining_cents after any intervening finalized/voided claims; stored as settled_coverage_cents; may diverge from provisional" }

  - name: invoice_total
    trigger: "at POST /invoices (draft preview) and POST /invoices/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = sum(line_items[].amount_cents)                       # evaluate FIRST
      facility_pct =                                                        # tier keyed on subtotal (evaluate SECOND)
        0.05 if subtotal_cents < 500000
        0.03 if 500000 <= subtotal_cents < 1500000
        0.02 if subtotal_cents >= 1500000
      facility_fee_cents = round_half_up(subtotal_cents * facility_pct)     # THIRD
      coverage = benefit_coverage_applied(...)                             # FOURTH (provisional at draft / final at finalize)
      total_due_cents = subtotal_cents + facility_fee_cents - coverage      # LAST
    input_set: "One Invoice's line_items plus resolved BenefitCoverage"
    constants: { FACILITY_PCT_LOW: 0.05, FACILITY_PCT_MID: 0.03, FACILITY_PCT_HIGH: 0.02, TIER_LOW_MAX: 500000, TIER_MID_MAX: 1500000 }
    precision: "evaluation order pinned: subtotal -> tier -> facility_fee -> coverage -> total_due"

  - name: tank_slot_count
    trigger: "on any CryoSpecimen status change touching {STORED, RESERVED}"
    algorithm: aggregation
    formula: |
      StorageTank.used_slots = count(CryoSpecimen where tank_id == tank.id AND status IN {STORED, RESERVED})
      StorageTank.is_full = (used_slots >= capacity_slots)
    input_set: "All CryoSpecimen for the tank in {STORED, RESERVED}"
    constants: {}
    precision: "integer count; invariant used_slots == live specimen count"

  - name: benefit_cap_ledger
    trigger: "on Invoice finalize (+consume) and void (-consume)"
    algorithm: aggregation
    formula: |
      remaining_cents = annual_cap_cents - consumed_cents
      invariant: consumed_cents + remaining_cents == annual_cap_cents (always)
    input_set: "BenefitCoverage.annual_cap_cents and consumed_cents"
    constants: {}
    precision: "integer cents; conserved quantity is annual_cap_cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number = wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Acting role permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "Request body fails schema: missing required field, unknown enum, wrong type, non-positive where >0 required, scheduled_end <= scheduled_start", error_id: ERR_VALIDATION, http_status: 400, applies_to: all }
  - { priority: 4, category: existence, check: "Path/body referenced resource does not exist (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 5, category: state, check: "Target resource not in a legal state for this transition (cycle/subscription/directive/authorization/invoice)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_patient_version != current Patient.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /directives" }
  - { priority: 7, category: business_safety, check: "Referenced Consultation not COMPLETED+ELIGIBLE when scheduling a cycle", error_id: ERR_CONSULTATION_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /stimulation-cycles/{id}/schedule" }
  - { priority: 8, category: business_safety, check: "Patient lacks an ACTIVE CONSENT directive at thaw authorize", error_id: ERR_CONSENT_NOT_ACTIVE, http_status: 422, applies_to: "POST /thaw-transfer-authorizations/{id}/authorize" }
  - { priority: 9, category: business_safety, check: "Patient lacks an ACTIVE DISPOSITION directive at thaw authorize", error_id: ERR_DISPOSITION_NOT_ACTIVE, http_status: 422, applies_to: "POST /thaw-transfer-authorizations/{id}/authorize" }
  - { priority: 10, category: business_referential, check: "Acting authorizer X-User-ID equals requester_provider_id (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /thaw-transfer-authorizations/{id}/authorize" }
  - { priority: 11, category: business_referential, check: "A specimen in specimen_ids does not belong to the authorization's patient", error_id: ERR_SPECIMEN_NOT_OWNED, http_status: 422, applies_to: "POST /thaw-transfer-authorizations/{id}/authorize" }
  - { priority: 12, category: business_referential, check: "A referenced specimen is not in the required state (STORED at authorize / RESERVED at execute)", error_id: ERR_SPECIMEN_NOT_AVAILABLE, http_status: 409, applies_to: "thaw authorize/execute" }
  - { priority: 13, category: business_temporal, check: "MonitoringAppointment overlaps an existing non-cancelled appointment on the same provider within PROVIDER_BUFFER_MINUTES", error_id: ERR_PROVIDER_UNAVAILABLE, http_status: 409, applies_to: "POST /monitoring-appointments" }
  - { priority: 14, category: business_temporal, check: "Retrieval window overlaps another retrieval on the same room (half-open [start,end), no buffer)", error_id: ERR_ROOM_UNAVAILABLE, http_status: 409, applies_to: "POST /stimulation-cycles/{id}/retrieve" }
  - { priority: 15, category: business_constraint, check: "Cycle trigger requires monitoring_visit_count >= MIN_MONITORING_VISITS", error_id: ERR_INSUFFICIENT_MONITORING_VISITS, http_status: 422, applies_to: "POST /stimulation-cycles/{id}/trigger" }
  - { priority: 16, category: business_constraint, check: "Storing specimens would exceed tank capacity: used_slots + to_create > capacity_slots", error_id: ERR_TANK_AT_CAPACITY, http_status: 409, applies_to: "POST /stimulation-cycles/{id}/retrieve" }
  - { priority: 17, category: business_constraint, check: "Patient already has a non-terminal StorageSubscription / more than one ACTIVE BenefitCoverage", error_id: ERR_DUPLICATE_ACTIVE_RESOURCE, http_status: 409, applies_to: "POST /storage-subscriptions, POST /benefit-coverages" }
  - { priority: 18, category: business_temporal, check: "Renew before current_period_end (period has not elapsed)", error_id: ERR_PERIOD_NOT_ELAPSED, http_status: 409, applies_to: "POST /storage-subscriptions/{id}/renew" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Patient ----
  - { method: POST, path: "/patients", description: "Create patient", roles: [Coordinator, BillingAdmin], code: 201, input: [full_name, date_of_birth, email, "employer_name?"], output: Patient, side_effects: [] }
  - { method: GET, path: "/patients/{id}", description: "Get patient", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: Patient }

  # ---- Provider / Room / Tank (operational resources) ----
  - { method: POST, path: "/providers", description: "Create clinical provider", roles: [PlatformAdmin], code: 201, input: [full_name, provider_role, "npi?"], output: Provider, side_effects: [] }
  - { method: POST, path: "/procedure-rooms", description: "Create procedure/retrieval room", roles: [PlatformAdmin], code: 201, input: [name, room_kind], output: ProcedureRoom, side_effects: [] }
  - { method: POST, path: "/storage-tanks", description: "Create cryo storage tank", roles: [Embryologist, PlatformAdmin], code: 201, input: [name, capacity_slots], output: StorageTank, side_effects: [] }
  - { method: GET, path: "/storage-tanks/{id}", description: "Get tank (observe used_slots/is_full)", roles: [Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: StorageTank }

  # ---- Consultation ----
  - { method: POST, path: "/consultations", description: "Create consultation with ovarian-reserve inputs", roles: [Coordinator, Physician], code: 201, input: [patient_id, patient_age_years, amh_level, antral_follicle_count], output: Consultation, side_effects: [] }
  - { method: GET, path: "/consultations/{id}", description: "Get consultation", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: Consultation }
  - { method: GET, path: "/consultations", description: "List consultations (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["patient_id?", "limit?", "offset?"], output: "Consultation[]" }
  - { method: POST, path: "/consultations/{id}/complete", description: "Complete consult; compute yield, eligibility, protocol", roles: [Physician], code: 200, input: [], output: Consultation, side_effects: ["compute expected_oocyte_yield", "set eligibility_status", "set recommended_protocol"] }

  # ---- StimulationCycle ----
  - { method: POST, path: "/stimulation-cycles", description: "Create cycle (DRAFT)", roles: [Coordinator], code: 201, input: [patient_id, consultation_id], output: StimulationCycle, side_effects: [] }
  - { method: GET, path: "/stimulation-cycles/{id}", description: "Get cycle", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: StimulationCycle }
  - { method: GET, path: "/stimulation-cycles", description: "List cycles (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["patient_id?", "consultation_id?", "retrieval_room_id?", "limit?", "offset?"], output: "StimulationCycle[]" }
  - { method: POST, path: "/stimulation-cycles/{id}/schedule", description: "DRAFT->SCHEDULED (requires eligible consult)", roles: [Coordinator], code: 200, input: [], output: StimulationCycle, side_effects: ["copy protocol_type", "compute estimated_cost_cents (cycle_cost estimate)"] }
  - { method: POST, path: "/stimulation-cycles/{id}/suspend", description: "MONITORING->SUSPENDED", roles: [Physician], code: 200, input: [], output: StimulationCycle, side_effects: ["freeze monitoring appointment creation"] }
  - { method: POST, path: "/stimulation-cycles/{id}/resume", description: "SUSPENDED->MONITORING", roles: [Physician], code: 200, input: [], output: StimulationCycle, side_effects: ["re-open monitoring"] }
  - { method: POST, path: "/stimulation-cycles/{id}/trigger", description: "MONITORING->TRIGGERED (>= MIN_MONITORING_VISITS)", roles: [Physician], code: 200, input: [], output: StimulationCycle, side_effects: ["set trigger_at"] }
  - { method: POST, path: "/stimulation-cycles/{id}/retrieve", description: "TRIGGERED->COMPLETED; book room, cryopreserve, cascade inventory/subscription/final cost", roles: [Physician], code: 200, input: [retrieval_room_id, retrieval_start, retrieval_end, oocytes_retrieved, mature_oocyte_count, tank_id, specimen_type], output: StimulationCycle, side_effects: ["room overlap check", "tank capacity check", "create CryoSpecimen x mature_oocyte_count (cascade tank.used_slots/is_full)", "increment StorageSubscription.specimen_count + recompute storage_renewal_fee", "compute final_cost_cents (cycle_cost final)"] }
  - { method: POST, path: "/stimulation-cycles/{id}/cancel", description: "Cancel cycle (cascade cancel pending appointments)", roles: [Coordinator], code: 200, input: [], output: StimulationCycle, side_effects: ["cancel SCHEDULED MonitoringAppointment rows"] }

  # ---- MonitoringAppointment ----
  - { method: POST, path: "/monitoring-appointments", description: "Create monitoring appointment (provider buffered overlap check; first one advances cycle to MONITORING)", roles: [Coordinator], code: 201, input: [cycle_id, provider_id, scheduled_start, scheduled_end], output: MonitoringAppointment, side_effects: ["cycle SCHEDULED->MONITORING on first", "increment cycle.monitoring_visit_count"] }
  - { method: GET, path: "/monitoring-appointments/{id}", description: "Get appointment", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: MonitoringAppointment }
  - { method: GET, path: "/monitoring-appointments", description: "List appointments (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["cycle_id?", "provider_id?", "limit?", "offset?"], output: "MonitoringAppointment[]" }

  # ---- CryoSpecimen (cascade-created; read-only surface) ----
  - { method: GET, path: "/cryo-specimens/{id}", description: "Get specimen", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: CryoSpecimen }
  - { method: GET, path: "/cryo-specimens", description: "List specimens (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["patient_id?", "cycle_id?", "tank_id?", "limit?", "offset?"], output: "CryoSpecimen[]" }

  # ---- StorageSubscription ----
  - { method: POST, path: "/storage-subscriptions", description: "Create subscription (PENDING_ACTIVATION)", roles: [BillingAdmin], code: 201, input: [patient_id], output: StorageSubscription, side_effects: [] }
  - { method: GET, path: "/storage-subscriptions/{id}", description: "Get subscription", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: StorageSubscription }
  - { method: GET, path: "/storage-subscriptions", description: "List subscriptions (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["patient_id?", "limit?", "offset?"], output: "StorageSubscription[]" }
  - { method: POST, path: "/storage-subscriptions/{id}/record-payment", description: "PENDING_ACTIVATION->ACTIVE or PAST_DUE->ACTIVE (advance period)", roles: [BillingAdmin], code: 200, input: [], output: StorageSubscription, side_effects: ["set/advance period window", "set last_paid_at"] }
  - { method: POST, path: "/storage-subscriptions/{id}/renew", description: "ACTIVE->PAST_DUE (period elapsed) or PAST_DUE->LAPSED (grace expired, cascade discard)", roles: [BillingAdmin], code: 200, input: [], output: StorageSubscription, side_effects: ["recompute storage_renewal_fee", "on lapse: discard STORED specimens + decrement tanks"] }
  - { method: POST, path: "/storage-subscriptions/{id}/cancel", description: "ACTIVE/PAST_DUE->CANCELLED", roles: [BillingAdmin], code: 200, input: [], output: StorageSubscription, side_effects: ["stop billing"] }

  # ---- BenefitCoverage ----
  - { method: POST, path: "/benefit-coverages", description: "Create employer benefit coverage", roles: [BillingAdmin], code: 201, input: [patient_id, employer_name, annual_cap_cents, covered_pct, covered_service_types], output: BenefitCoverage, side_effects: ["set remaining_cents = annual_cap_cents"] }
  - { method: GET, path: "/benefit-coverages/{id}", description: "Get coverage", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: BenefitCoverage }
  - { method: GET, path: "/benefit-coverages", description: "List coverages (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["patient_id?", "limit?", "offset?"], output: "BenefitCoverage[]" }

  # ---- Directive ----
  - { method: POST, path: "/directives", description: "Create consent/disposition directive (supersedes prior same-type; OCC on Patient.version)", roles: [Patient], code: 201, input: [patient_id, directive_type, "disposition_action?", expected_patient_version], output: Directive, side_effects: ["supersede prior ACTIVE same-type directive", "increments Patient.version by 1"] }
  - { method: GET, path: "/directives/{id}", description: "Get directive", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: Directive }
  - { method: GET, path: "/directives", description: "List directives (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["patient_id?", "directive_type?", "limit?", "offset?"], output: "Directive[]" }
  - { method: POST, path: "/directives/{id}/revoke", description: "ACTIVE->REVOKED (owner only)", roles: [Patient], code: 200, input: [], output: Directive, side_effects: [] }

  # ---- ThawTransferAuthorization ----
  - { method: POST, path: "/thaw-transfer-authorizations", description: "Request thaw/transfer (requester = X-User-ID physician)", roles: [Physician], code: 201, input: [patient_id, specimen_ids, transfer_type], output: ThawTransferAuthorization, side_effects: ["set requester_provider_id"] }
  - { method: GET, path: "/thaw-transfer-authorizations/{id}", description: "Get authorization", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: ThawTransferAuthorization }
  - { method: GET, path: "/thaw-transfer-authorizations", description: "List authorizations (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["patient_id?", "limit?", "offset?"], output: "ThawTransferAuthorization[]" }
  - { method: POST, path: "/thaw-transfer-authorizations/{id}/authorize", description: "REQUESTED->AUTHORIZED (segregation; directives active; reserve specimens)", roles: [Physician], code: 200, input: [], output: ThawTransferAuthorization, side_effects: ["pin directives + authorizer", "reserve specimens STORED->RESERVED"] }
  - { method: POST, path: "/thaw-transfer-authorizations/{id}/execute", description: "AUTHORIZED->EXECUTED (thaw cascade)", roles: [Embryologist], code: 200, input: [], output: ThawTransferAuthorization, side_effects: ["specimens RESERVED->THAWED", "decrement tank.used_slots", "decrement subscription.specimen_count + recompute fee"] }
  - { method: POST, path: "/thaw-transfer-authorizations/{id}/deny", description: "REQUESTED->DENIED", roles: [Physician], code: 200, input: [], output: ThawTransferAuthorization, side_effects: [] }

  # ---- Invoice ----
  - { method: POST, path: "/invoices", description: "Create invoice draft (provisional benefit)", roles: [BillingAdmin], code: 201, input: [patient_id, service_type, line_items], output: Invoice, side_effects: ["compute subtotal/facility_fee/estimated_coverage/total_due"] }
  - { method: GET, path: "/invoices/{id}", description: "Get invoice", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: [], output: Invoice }
  - { method: GET, path: "/invoices", description: "List invoices (filterable)", roles: [Patient, Coordinator, Physician, Embryologist, BillingAdmin, PlatformAdmin], code: 200, input: ["patient_id?", "limit?", "offset?"], output: "Invoice[]" }
  - { method: POST, path: "/invoices/{id}/finalize", description: "DRAFT->FINALIZED (settle benefit, consume cap)", roles: [BillingAdmin], code: 200, input: [], output: Invoice, side_effects: ["compute settled_coverage_cents/total_due", "consume BenefitCoverage cap (cascade EXHAUSTED)"] }
  - { method: POST, path: "/invoices/{id}/void", description: "FINALIZED->VOID (restore benefit cap)", roles: [BillingAdmin], code: 200, input: [], output: Invoice, side_effects: ["restore BenefitCoverage cap (compensation)"] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set logical clock. Server default before any set is 2026-05-01T00:00:00Z (never real wall-clock).", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }" }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, unknown enum, wrong type, non-positive/negative where forbidden, scheduled_end <= scheduled_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or FK) does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_patient_version != current Patient.version on directive create" }
  - { id: ERR_CONSULTATION_NOT_ELIGIBLE, http: 422, condition: "Scheduling a cycle whose consultation is not COMPLETED+ELIGIBLE" }
  - { id: ERR_CONSENT_NOT_ACTIVE, http: 422, condition: "Thaw authorize without an ACTIVE CONSENT directive" }
  - { id: ERR_DISPOSITION_NOT_ACTIVE, http: 422, condition: "Thaw authorize without an ACTIVE DISPOSITION directive" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Thaw authorizer X-User-ID equals requester_provider_id" }
  - { id: ERR_SPECIMEN_NOT_OWNED, http: 422, condition: "A specimen in specimen_ids does not belong to the authorization patient" }
  - { id: ERR_SPECIMEN_NOT_AVAILABLE, http: 409, condition: "Specimen not STORED at authorize / not RESERVED at execute" }
  - { id: ERR_PROVIDER_UNAVAILABLE, http: 409, condition: "Monitoring appointment overlaps provider's existing appointment within buffer" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "Retrieval window overlaps another retrieval on the same room" }
  - { id: ERR_INSUFFICIENT_MONITORING_VISITS, http: 422, condition: "Cycle trigger with monitoring_visit_count < MIN_MONITORING_VISITS" }
  - { id: ERR_TANK_AT_CAPACITY, http: 409, condition: "Cryopreservation would exceed tank capacity_slots" }
  - { id: ERR_DUPLICATE_ACTIVE_RESOURCE, http: 409, condition: "Second non-terminal subscription / second ACTIVE benefit for a patient" }
  - { id: ERR_PERIOD_NOT_ELAPSED, http: 409, condition: "Renew before current_period_end" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patient
    description: "The individual preserving oocytes; owns consent/disposition directives and reads own resources."
    identity: "entity_backed:Patient"
    exclusive_operations: ["POST /directives", "POST /directives/{id}/revoke"]
    shared_operations: ["GET reads of own resources"]
  - name: Coordinator
    description: "Care coordinator: onboards patients, opens consultations, creates & schedules cycles and monitoring appointments."
    identity: "opaque"
    exclusive_operations: ["POST /patients", "POST /consultations", "POST /stimulation-cycles", "POST /stimulation-cycles/{id}/schedule", "POST /stimulation-cycles/{id}/cancel", "POST /monitoring-appointments"]
    shared_operations: ["GET reads"]
  - name: Physician
    description: "Reproductive endocrinologist: completes consults, runs the cycle (suspend/resume/trigger/retrieve), requests/authorizes/denies thaw."
    identity: "entity_backed:Provider"
    exclusive_operations: ["POST /consultations/{id}/complete", "POST /stimulation-cycles/{id}/suspend", "POST /stimulation-cycles/{id}/resume", "POST /stimulation-cycles/{id}/trigger", "POST /stimulation-cycles/{id}/retrieve", "POST /thaw-transfer-authorizations", "POST /thaw-transfer-authorizations/{id}/authorize", "POST /thaw-transfer-authorizations/{id}/deny"]
    shared_operations: ["POST /consultations", "GET reads"]
  - name: Embryologist
    description: "Lab embryologist: manages storage tanks and executes thaws."
    identity: "entity_backed:Provider"
    exclusive_operations: ["POST /thaw-transfer-authorizations/{id}/execute"]
    shared_operations: ["POST /storage-tanks", "GET reads"]
  - name: BillingAdmin
    description: "Manages storage subscriptions, employer benefit coverage, and invoices."
    identity: "opaque"
    exclusive_operations: ["POST /storage-subscriptions", "POST /storage-subscriptions/{id}/record-payment", "POST /storage-subscriptions/{id}/renew", "POST /storage-subscriptions/{id}/cancel", "POST /benefit-coverages", "POST /invoices", "POST /invoices/{id}/finalize", "POST /invoices/{id}/void"]
    shared_operations: ["POST /patients", "GET reads"]
  - name: PlatformAdmin
    description: "Operational admin: providers, rooms, and the logical clock."
    identity: "opaque"
    exclusive_operations: ["POST /providers", "POST /procedure-rooms", "POST /_clock/set_current_utc"]
    shared_operations: ["POST /storage-tanks", "GET reads"]
