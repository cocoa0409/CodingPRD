  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fund_frozen_state_beats_fiscal_rejected
        grounds:
          - validations[priority=6]
          - validations[priority=20]
          - state_machines.FundAccount.ACTIVE_to_FROZEN
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the trigger violates both
          ERR_FUND_FROZEN (priority 6, fund is FROZEN) and
          ERR_INSUFFICIENT_FUND_AVAILABLE (priority 20, 50000000 > 10000000
          committed); the state-category error must win.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "TRUST fund appropriation 100000000 with one POSTED expenditure 90000000 (committed_available == 10000000), then set FROZEN."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-OPS", fund_type: "TRUST", appropriation_cents: 100000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/funds/${fund_id}/expenditures"
              payload: { amount_cents: 90000000, activity_type: "OPERATIONS", memo: "Security contract" }
              as: FinanceOfficer
            - call: "POST /campus/funds/${fund_id}/set-status"
              payload: { status: "FROZEN" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campus/funds/${fund_id}/expenditures"
              payload: { amount_cents: 50000000, activity_type: "OPERATIONS", memo: "Elevator repair" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "trigger is rejected with error_id == ERR_FUND_FROZEN (state priority 6 beats business_fiscal priority 20)"
            - "the response is NOT ERR_INSUFFICIENT_FUND_AVAILABLE although 50000000 > committed_available 10000000"
            - "FundAccount.${fund_id} still shows exactly one POSTED expenditure and settled_available_cents == 10000000"

      - name: cultural_property_safety_beats_referential_rejected
        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - state_machines.CollectionReview.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Category pair business_safety vs business_referential (different pair
          than state-vs-fiscal): the decide violates both
          ERR_CULTURAL_PROPERTY_REVIEW_PENDING (priority 8 — cultural-property
          object, review not completed) and ERR_OBJECT_ON_ACTIVE_LOAN
          (priority 18 — object is OUT_ON_LOAN under an ACTIVE loan); the
          safety error must win.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CollectionObject with is_cultural_property true, declared 600000000."
            - "Loan taken to ACTIVE: PROPOSED (declared 600000000, INSURANCE, courier true — required at >= 100000000) -> accepted -> OUTBOUND report ACCEPTED -> activate."
            - "DEACCESSION review (disposal REPATRIATION, cultural_property_review_completed false) created and submitted by 'cur-3'."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "1978.0110", title: "Ancestral Funerary Mask", declared_value_cents: 600000000, is_cultural_property: true }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "British Museum", loan_start_date: "2026-10-01", loan_end_date: "2027-06-01", declared_value_cents: 600000000, coverage_type: "INSURANCE", courier_required: true }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
            - call: "POST /campus/loan-agreements/${loan_id}/condition-reports"
              payload: { report_kind: "OUTBOUND", condition_summary: "Fragile but stable.", damage_noted: false }
              as: LoansOfficer
              captures: { cr_id: $.data.id }
            - call: "POST /campus/condition-reports/${cr_id}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan_id}/activate"
              payload: {}
              as: LoansOfficer
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "DEACCESSION", object_id: "${obj_id}", disposal_method: "REPATRIATION", cultural_property_review_completed: false }
              as: Curator
              as_user_id: "cur-3"
              captures: { rev_id: $.data.id }
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-3"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "APPROVED", expected_review_version: "${rev_v}" }
              as: CommitteeChair
              as_user_id: "chair-9"
              captures: { err: $.data.error_id }
          assert:
            - "trigger is rejected with error_id == ERR_CULTURAL_PROPERTY_REVIEW_PENDING (http 422; safety priority 8 beats referential priority 18)"
            - "the response is NOT ERR_OBJECT_ON_ACTIVE_LOAN although an ACTIVE loan exists for the object"
            - "CollectionReview.${rev_id}.status remains SUBMITTED; CollectionObject.${obj_id}.status remains OUT_ON_LOAN"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: screening_full_at_exact_rate_rejected
        grounds:
          - calculations.pass_slot_availability
          - state_machines.TimedEntryPass.RESERVED_to_ADMITTED
          - errors[ERR_SCREENING_THROUGHPUT_FULL]
        distinguishing_aspect: |
          Count metric on the admit endpoint: admission is allowed while the
          current slot's admitted count is strictly below
          screening_rate_per_quarter_hour; the admission attempted at count ==
          rate (== 2) is rejected — a >= boundary, tested at rate-1 and rate.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T11:05:00Z (slot index 4)."
            - "Museum requires_timed_pass true, quarter_hour_pass_quota 3, daily_pass_quota 10, screening_rate_per_quarter_hour 2."
            - "Three RESERVED passes for visit 2026-09-10, entry_quarter_hour 4 (visitors A, B, C)."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/museums"
              payload: { museum_code: "NASM", display_name: "National Air and Space Museum", requires_timed_pass: true, quarter_hour_pass_quota: 3, daily_pass_quota: 10, screening_rate_per_quarter_hour: 2 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Visitor A", visit_date: "2026-09-10", entry_quarter_hour: 4 }
              as: Public
              as_user_id: "visitor-a"
              captures: { pass_a: $.data.id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Visitor B", visit_date: "2026-09-10", entry_quarter_hour: 4 }
              as: Public
              as_user_id: "visitor-b"
              captures: { pass_b: $.data.id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Visitor C", visit_date: "2026-09-10", entry_quarter_hour: 4 }
              as: Public
              as_user_id: "visitor-c"
              captures: { pass_c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T11:05:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campus/timed-entry-passes/${pass_a}/admit"
              payload: {}
              as: SecurityScreener
            - call: "POST /campus/timed-entry-passes/${pass_b}/admit"
              payload: {}
              as: SecurityScreener
            - call: "POST /campus/timed-entry-passes/${pass_c}/admit"
              payload: {}
              as: SecurityScreener
              captures: { err: $.data.error_id }
          assert:
            - "TimedEntryPass.${pass_a}.status == ADMITTED with admitted_slot == 4 (count 0 < 2 allowed)"
            - "TimedEntryPass.${pass_b}.status == ADMITTED with admitted_slot == 4 (count 1 < 2 allowed — boundary rate-1 succeeds)"
            - "third admit is rejected with error_id == ERR_SCREENING_THROUGHPUT_FULL (count == rate == 2 is full; >= semantics)"
            - "TimedEntryPass.${pass_c}.status remains RESERVED"

      - name: public_sale_boundary_exact_open
        grounds:
          - calculations.presale_window_check
          - errors[ERR_PRESALE_MEMBER_ONLY]
        distinguishing_aspect: |
          Timestamp metric on the ticket-purchase endpoint (different metric and
          endpoint than the screening count boundary): the public window is
          half-open [public_sale_opens_at, inf) — a non-member purchase one
          second before opens fails ERR_PRESALE_MEMBER_ONLY while the same call
          at exactly public_sale_opens_at succeeds (>=, not >).
        test_recipe:
          setup:
            - "TRUST fund; museum; exhibition fee 1000, quota 5, member_presale_opens_at 2026-09-10T00:00:00Z, public_sale_opens_at 2026-09-15T00:00:00Z, ON_SALE."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-PUB", fund_type: "TRUST", appropriation_cents: 50000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/museums"
              payload: { museum_code: "HMSG", display_name: "Hirshhorn", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/exhibitions"
              payload: { title: "One-Way Colour", fee_cents: 1000, daily_ticket_quota: 5, member_presale_opens_at: "2026-09-10T00:00:00Z", public_sale_opens_at: "2026-09-15T00:00:00Z", revenue_fund_id: "${fund_id}" }
              as: ExhibitionManager
              captures: { exh_id: $.data.id }
            - call: "POST /campus/exhibitions/${exh_id}/open-sale"
              payload: {}
              as: ExhibitionManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /campus/exhibitions/${exh_id}/tickets"
              payload: { buyer_name: "Early Bird", visit_date: "2026-09-20" }
              as: Public
              as_user_id: "visitor-e"
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campus/exhibitions/${exh_id}/tickets"
              payload: { buyer_name: "On The Dot", visit_date: "2026-09-20" }
              as: Public
              as_user_id: "visitor-f"
              captures: { tick_ok: $.data.id }
          assert:
            - "purchase at 2026-09-14T23:59:59Z rejected with error_id == ERR_PRESALE_MEMBER_ONLY (strictly before public open)"
            - "purchase at exactly 2026-09-15T00:00:00Z succeeds (half-open window: current_utc >= public_sale_opens_at)"
            - "ExhibitionTicket.${tick_ok}.price_paid_cents == 1000 (full public price; no member)"
            - "ExhibitionTicket.${tick_ok}.status == PURCHASED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: museum_closure_cascades_pass_expiry
        grounds:
          - state_machines.TimedEntryPass.RESERVED_to_EXPIRED
          - state_machines.TimedEntryPass.RESERVED_to_ADMITTED
          - entities.Museum.fields.closed_dates
        distinguishing_aspect: |
          Entity pair TimedEntryPass x Museum: the pass's admissibility depends
          on Museum.closed_dates — closing the museum on the pass's visit_date
          force-expires the RESERVED pass, so the subsequent admit (which would
          otherwise succeed in-window) fails with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Museum requires_timed_pass true, quotas 5/20, screening rate 4."
            - "One RESERVED pass for visit 2026-09-20, entry_quarter_hour 2."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/museums"
              payload: { museum_code: "NMNH", display_name: "National Museum of Natural History", requires_timed_pass: true, quarter_hour_pass_quota: 5, daily_pass_quota: 20, screening_rate_per_quarter_hour: 4 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/timed-entry-passes"
              payload: { visitor_name: "Day Tripper", visit_date: "2026-09-20", entry_quarter_hour: 2 }
              as: Public
              as_user_id: "visitor-d"
              captures: { pass_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/close-day"
              payload: { closure_date: "2026-09-20" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T10:35:00Z" }
              as: PlatformAdmin
            - call: "POST /campus/timed-entry-passes/${pass_id}/admit"
              payload: {}
              as: SecurityScreener
              captures: { err: $.data.error_id }
          assert:
            - "after close-day, TimedEntryPass.${pass_id}.status == EXPIRED (cascade from Museum.closed_dates)"
            - "admit is rejected with error_id == ERR_INVALID_STATE (the EXPIRED pass admits no transition)"
            - "Museum.${mus_id}.closed_dates contains 2026-09-20"

      - name: loan_activate_requires_accepted_outbound_report
        grounds:
          - state_machines.LoanAgreement.AGREED_to_ACTIVE
          - state_machines.ConditionReport.SUBMITTED_to_ACCEPTED
          - errors[ERR_CONDITION_REPORT_REQUIRED]
        distinguishing_aspect: |
          Entity pair LoanAgreement x ConditionReport (different pair than
          pass x museum): activate is gated on a sibling entity's state — an
          OUTBOUND report that is merely SUBMITTED blocks activation; only its
          ACCEPTED transition unblocks the loan.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CollectionObject; loan AGREED (declared 50000000, INSURANCE, no courier, window [2026-10-01, 2026-12-01))."
            - "OUTBOUND condition report filed but still SUBMITTED."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0006", title: "Star-Spangled Banner Fragment", declared_value_cents: 50000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Museum of American History Partners", loan_start_date: "2026-10-01", loan_end_date: "2026-12-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
            - call: "POST /campus/loan-agreements/${loan_id}/condition-reports"
              payload: { report_kind: "OUTBOUND", condition_summary: "Textile stable under low light.", damage_noted: false }
              as: LoansOfficer
              captures: { cr_id: $.data.id }
          trigger:
            - call: "POST /campus/loan-agreements/${loan_id}/activate"
              payload: {}
              as: LoansOfficer
              captures: { err: $.data.error_id }
            - call: "POST /campus/condition-reports/${cr_id}/decide"
              payload: { outcome: "ACCEPTED" }
              as: LoansOfficer
            - call: "POST /campus/loan-agreements/${loan_id}/activate"
              payload: {}
              as: LoansOfficer
          assert:
            - "first activate is rejected with error_id == ERR_CONDITION_REPORT_REQUIRED (report SUBMITTED, not ACCEPTED)"
            - "after the report's SUBMITTED -> ACCEPTED transition, the identical activate succeeds"
            - "LoanAgreement.${loan_id}.status == ACTIVE and CollectionObject.${obj_id}.status == OUT_ON_LOAN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: loan_windows_half_open_adjacency
        grounds:
          - calculations.loan_window_overlap
          - errors[ERR_LOAN_PERIOD_CONFLICT]
        distinguishing_aspect: |
          Half-open interval semantics on the CollectionObject resource: a loan
          window [start, end) overlapping an AGREED loan is rejected at accept,
          while a window starting exactly at the AGREED loan's end date is
          legal adjacency (back-to-back loans share the boundary date).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CollectionObject; loan A AGREED with window [2026-10-01, 2026-12-01), declared 50000000, INSURANCE, no courier."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0007", title: "Wright Flyer Fabric", declared_value_cents: 50000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Science Museum London", loan_start_date: "2026-10-01", loan_end_date: "2026-12-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_a: $.data.id, va: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_a}/accept"
              payload: { expected_loan_version: "${va}" }
              as: BorrowerRep
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Deutsches Museum", loan_start_date: "2026-11-15", loan_end_date: "2027-01-15", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_b: $.data.id, vb: $.data.version }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "National Air and Space Annex", loan_start_date: "2026-12-01", loan_end_date: "2027-02-01", declared_value_cents: 50000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_c: $.data.id, vc: $.data.version }
          trigger:
            - call: "POST /campus/loan-agreements/${loan_b}/accept"
              payload: { expected_loan_version: "${vb}" }
              as: BorrowerRep
              captures: { err: $.data.error_id }
            - call: "POST /campus/loan-agreements/${loan_c}/accept"
              payload: { expected_loan_version: "${vc}" }
              as: BorrowerRep
          assert:
            - "loan B accept is rejected with error_id == ERR_LOAN_PERIOD_CONFLICT ([2026-11-15, 2027-01-15) intersects A's [2026-10-01, 2026-12-01))"
            - "LoanAgreement.${loan_b}.status remains PROPOSED (rejection leaves the negotiation open)"
            - "loan C accept succeeds: [2026-12-01, 2027-02-01) starts exactly at A's end — adjacency is NOT overlap under half-open semantics"
            - "LoanAgreement.${loan_c}.status == AGREED with premium_cents == 300000"

      - name: gallery_buffer_expanded_overlap
        grounds:
          - calculations.gallery_schedule_overlap
          - errors[ERR_GALLERY_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Buffer-expanded interval semantics on the EducationProgram gallery
          resource (different entity and different interval arithmetic than the
          loan half-open rule): each session occupies [start-30, end+30), so a
          program starting 30 minutes after another ends still conflicts (its
          buffer intersects), while a 60-minute gap is legal.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Museum; program A gallery G1 MON 600-660 (expanded occupancy [570,690)), SCHEDULED."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/museums"
              payload: { museum_code: "SAAM", display_name: "Smithsonian American Art Museum", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Folk Art Basics", gallery_code: "G1", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 30, docent_ratio: 15, max_group_size: 30, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_a: $.data.id }
          trigger:
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Modern Masters Walk", gallery_code: "G1", day_of_week: "MON", start_minute: 690, end_minute: 750, student_capacity: 30, docent_ratio: 15, max_group_size: 30, required_docent_certification: "ADVANCED" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Sculpture Garden Studio", gallery_code: "G1", day_of_week: "MON", start_minute: 720, end_minute: 780, student_capacity: 30, docent_ratio: 15, max_group_size: 30, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_c: $.data.id }
          assert:
            - "program B (start 690) is rejected with error_id == ERR_GALLERY_SCHEDULE_CONFLICT: its buffer-expanded interval [660,780) intersects A's [570,690) — a bare 30-minute gap is NOT enough"
            - "program C (start 720) is created 201: expanded [690,810) merely touches A's expanded end 690, and half-open expanded intervals do not overlap at the touch point"
            - "EducationProgram.${prog_c}.status == SCHEDULED and EducationProgram.${prog_a}.status remains SCHEDULED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: expenditure_void_restores_fund_dollars
        grounds:
          - calculations.fund_available_cents
          - state_machines.Expenditure.POSTED_to_VOIDED
          - entities.FundAccount.fields.settled_available_cents
        distinguishing_aspect: |
          Conserved quantity: fund dollars. The forward action (post 100000000)
          paired with its compensating action (void) leaves
          settled_available_cents exactly at its pre-action value 500000000,
          per settled = appropriation + receipts - sum(POSTED) with VOIDED
          rows excluded from the sum.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "TRUST fund appropriation 500000000, no expenditures, receipts 0."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-INV", fund_type: "TRUST", appropriation_cents: 500000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "GET /campus/funds/${fund_id}"
              payload: {}
              as: FinanceOfficer
              captures: { settled_before: $.data.settled_available_cents }
          trigger:
            - call: "POST /campus/funds/${fund_id}/expenditures"
              payload: { amount_cents: 100000000, activity_type: "OPERATIONS", memo: "Galas and openings" }
              as: FinanceOfficer
              captures: { exp_id: $.data.id }
            - call: "GET /campus/funds/${fund_id}"
              payload: {}
              as: FinanceOfficer
              captures: { settled_mid: $.data.settled_available_cents }
            - call: "POST /campus/expenditures/${exp_id}/void"
              payload: {}
              as: FinanceOfficer
            - call: "GET /campus/funds/${fund_id}"
              payload: {}
              as: FinanceOfficer
              captures: { settled_after: $.data.settled_available_cents }
          assert:
            - "settled_before == 500000000"
            - "settled_mid == 400000000 (forward action debited 100000000)"
            - "settled_after == 500000000 == settled_before (post + void conserve fund dollars; no drift)"
            - "Expenditure.${exp_id}.status == VOIDED and committed_available_cents == 500000000 after the void"

      - name: ticket_purchase_refund_conserves_quota
        grounds:
          - calculations.ticket_quota_remaining
          - state_machines.ExhibitionTicket.PURCHASED_to_REFUNDED
          - errors[ERR_TICKET_QUOTA_EXHAUSTED]
        distinguishing_aspect: |
          Conserved quantity: per-date ticket inventory (different quantity
          than fund dollars). For (exhibition, visit_date), sold + remaining ==
          daily_ticket_quota == 3 across every interleaving of purchases and
          refunds; the fifth purchase is rejected only when sold == quota.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z (public sale open)."
            - "TRUST fund; museum; exhibition fee 1000, daily_ticket_quota 3, ON_SALE; visit date 2026-09-20."
          setup_api_calls:
            - *clock_reset
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-QTA", fund_type: "TRUST", appropriation_cents: 10000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/museums"
              payload: { museum_code: "NPG", display_name: "National Portrait Gallery", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/exhibitions"
              payload: { title: "Presidents and Poets", fee_cents: 1000, daily_ticket_quota: 3, member_presale_opens_at: "2026-09-05T00:00:00Z", public_sale_opens_at: "2026-09-10T00:00:00Z", revenue_fund_id: "${fund_id}" }
              as: ExhibitionManager
              captures: { exh_id: $.data.id }
            - call: "POST /campus/exhibitions/${exh_id}/open-sale"
              payload: {}
              as: ExhibitionManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campus/exhibitions/${exh_id}/tickets"
              payload: { buyer_name: "Buyer One", visit_date: "2026-09-20" }
              as: Public
              as_user_id: "visitor-1"
              captures: { t1: $.data.id }
            - call: "POST /campus/exhibitions/${exh_id}/tickets"
              payload: { buyer_name: "Buyer Two", visit_date: "2026-09-20" }
              as: Public
              as_user_id: "visitor-2"
              captures: { t2: $.data.id }
            - call: "POST /campus/tickets/${t1}/refund"
              payload: {}
              as: VisitorServices
            - call: "POST /campus/exhibitions/${exh_id}/tickets"
              payload: { buyer_name: "Buyer Three", visit_date: "2026-09-20" }
              as: Public
              as_user_id: "visitor-3"
              captures: { t3: $.data.id }
            - call: "POST /campus/exhibitions/${exh_id}/tickets"
              payload: { buyer_name: "Buyer Four", visit_date: "2026-09-20" }
              as: Public
              as_user_id: "visitor-4"
              captures: { t4: $.data.id }
            - call: "POST /campus/exhibitions/${exh_id}/tickets"
              payload: { buyer_name: "Buyer Five", visit_date: "2026-09-20" }
              as: Public
              as_user_id: "visitor-5"
              captures: { err: $.data.error_id }
            - call: "GET /campus/funds/${fund_id}"
              payload: {}
              as: FinanceOfficer
              captures: { receipts_final: $.data.receipts_cents }
          assert:
            - "after buy,buy,refund,buy,buy: sold (PURCHASED or REDEEMED) == 3 and remaining == 0 — every intermediate state satisfied sold + remaining == 3"
            - "fifth purchase rejected with error_id == ERR_TICKET_QUOTA_EXHAUSTED (sold == quota boundary)"
            - "ExhibitionTicket.${t1}.status == REFUNDED; ${t2}, ${t3}, ${t4} remain PURCHASED"
            - "receipts_final == 3000 (three live tickets at 1000; the refund debited 1000)"
