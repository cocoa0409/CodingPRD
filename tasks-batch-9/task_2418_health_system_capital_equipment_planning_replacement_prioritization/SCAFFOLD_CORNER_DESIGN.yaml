        distinguishing_aspect: >-
          A re-cast ballot supersedes the earlier one rather than replacing it, so the member's own
          sub-resource returns both rows with DIFFERENT counted_weight values — 2 from before the weight
          change and 5 after — while quorum_weight uses the member's CURRENT weight. The tally therefore
          runs on cast_weight 8 and rejects the request.
