          The identical two-period report set under score_mode PERIOD_EQUAL is a simple mean,
          (0.20 + 1.00) / 2 = 0.60, which sits above company_suspension_score_threshold 0.50 and
          below company_probation_score_threshold 0.70, so the company lands in PROBATION and
          keeps its dispatch privilege instead of being suspended.
