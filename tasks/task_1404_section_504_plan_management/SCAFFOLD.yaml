# =============================================================================
# Section 504 Plan Management — scaffold seed tables (v1, expert+ difficulty)
# =============================================================================

scenario: |
  Section 504 Plan Management (school 504 coordinator): referral & eligibility
  determination under disability definition, accommodation plan drafting &
  teacher acknowledgment, implementation monitoring & documentation, annual
  review & re-evaluation cadence, testing accommodation approval & flagging,
  transition from/to IEP process, parent consent, notice & grievance procedure,
  staff training & compliance audit

domain_name: section-504-plan-management
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions

  entity_topology: flat                 # peer resources with FK references; URLs are /students/{id}, /plans/{id}, etc.
  state_machine_shape: branching        # Plan has a review-cycle loop; Evaluation has a self-referential re-evaluation chain; Student carries two parallel status dimensions

  relationship_patterns:
    - one_to_many                       # Student→Plans, Plan→Accommodations, Plan→Logs, Plan→Reviews, StaffMember→TrainingRecords
    - cross_aggregate                   # Grievance→Plan; EligibilityEvaluation→Referral; TestingAccommodationRequest→Accommodation
    - self_referential                  # EligibilityEvaluation.supersedes_evaluation_id (re-evaluation chain)

  role_model: segregation_of_duties     # referral submitter != eligibility determiner; plan drafter != testing approver; grievance intake != grievance resolver

  consistency_model: immediate          # all cascading updates are atomic within a single request

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: school_name, type: string, source: input, description: "School display name" }
      - { name: district_code, type: string, source: input, description: "District identifier" }
      - { name: school_posture, type: enum, source: computed, default: OPERATIONAL, description: "OPERATIONAL | PROBATION | AUDIT_HOLD — derived from open grievances + training coverage + overdue reviews" }
      - { name: current_academic_year, type: string, source: input, description: "e.g. '2025-2026'; cadence windows anchor to this" }

  - name: Student
    parent: School
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; owning school" }
      - { name: student_external_ref, type: string, source: input, description: "District SIS reference (unique within school)" }
      - { name: full_name, type: string, source: input, description: "Student name" }
      - { name: date_of_birth, type: datetime, source: input, description: "Student DOB (ISO8601 date)" }
      - { name: grade_level, type: integer, source: input, description: "0..12" }
      - { name: section_504_status, type: enum, source: system, default: NONE, description: "NONE | REFERRED | EVALUATING | PLAN_ACTIVE | PLAN_SUSPENDED | EXITED_TO_IEP | NOT_ELIGIBLE | TERMINATED — parallel dimension 1" }
      - { name: iep_status, type: enum, source: system, default: NONE, description: "NONE | IEP_ACTIVE | IEP_EXITED — parallel dimension 2; gates 504 exit-to-IEP" }
      - { name: has_active_504_plan, type: boolean, source: computed, description: "True iff exactly one Section504Plan with status ACTIVE exists for this student" }

  - name: StaffMember
    parent: School
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; owning school" }
      - { name: staff_external_ref, type: string, source: input, description: "HR system reference" }
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: staff_role, type: enum, source: input, description: "TEACHER | COORDINATOR | PRINCIPAL | DISTRICT_DIRECTOR" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether currently employed" }
      - { name: current_training_status, type: enum, source: computed, default: UNTRAINED, description: "UNTRAINED | TRAINED_CURRENT | TRAINED_EXPIRED — derived from latest StaffTrainingRecord vs clock" }

  - name: Section504Referral
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; owning student" }
      - { name: submitted_by_staff_id, type: string, source: system, description: "ID of the StaffMember who submitted (from X-User-ID); segregation-of-duties anchor" }
      - { name: referral_reason, type: string, source: input, description: "Free text describing concern" }
      - { name: suspected_disability_category, type: enum, source: input, description: "PHYSICAL | MENTAL | LEARNING | CHRONIC_HEALTH | OTHER" }
      - { name: referral_status, type: enum, source: system, default: PENDING, description: "PENDING → UNDER_REVIEW → EVALUATION_INITIATED | REJECTED | WITHDRAWN" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped UTC" }
      - { name: review_deadline, type: datetime, source: computed, description: "submitted_at + 15 calendar days; drives overdue flagging" }

  - name: EligibilityEvaluation
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; owning student" }
      - { name: referral_id, type: string, source: system, description: "FK -> Section504Referral.id; referral that initiated this evaluation" }
      - { name: supersedes_evaluation_id, type: string, source: input, description: "FK -> EligibilityEvaluation.id; nullable self-referential link forming the re-evaluation chain" }
      - { name: evaluation_status, type: enum, source: system, default: INITIATED, description: "INITIATED | CONSENT_PENDING | CONSENT_RECEIVED | EVALUATION_IN_PROGRESS | DETERMINATION_MADE | CANCELLED" }
      - { name: parent_consent_obtained_at, type: datetime, source: system, description: "Null until parent consent recorded" }
      - { name: evaluation_started_at, type: datetime, source: system, description: "Null until evaluation starts" }
      - { name: determination_deadline, type: datetime, source: computed, description: "evaluation_started_at + 60 calendar days" }
      - { name: determination_outcome, type: enum, source: system, description: "Null until made; then ELIGIBLE | NOT_ELIGIBLE" }
      - { name: disability_impairment_found, type: boolean, source: input, default: false, description: "Physical/mental impairment prong" }
      - { name: major_life_activity_affected, type: boolean, source: input, default: false, description: "Substantially limits major life activity prong" }
      - { name: determined_by_staff_id, type: string, source: system, description: "ID of the StaffMember who determined (must differ from referral submitter — segregation of duties)" }

  - name: Section504Plan
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; owning student" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> EligibilityEvaluation.id; the ELIGIBLE determination that authorizes this plan" }
      - { name: plan_status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_PARENT_CONSENT | PENDING_TEACHER_ACK | ACTIVE | UNDER_ANNUAL_REVIEW | SUSPENDED | EXITED_TO_IEP | TERMINATED" }
      - { name: drafted_by_staff_id, type: string, source: system, description: "ID of the StaffMember (COORDINATOR) who drafted; segregation anchor for testing reviews" }
      - { name: plan_effective_date, type: datetime, source: system, description: "Null until ACTIVE" }
      - { name: next_annual_review_due, type: datetime, source: computed, description: "plan_effective_date + 365 days; re-anchored on each completed ANNUAL review" }
      - { name: next_re_evaluation_due, type: datetime, source: computed, description: "evaluation.created_at + 3 years; re-anchored when a re-evaluation completes" }
      - { name: implementation_compliance_pct, type: number, source: computed, description: "Derived from ImplementationLog (see calculation implementation_compliance_ratio)" }
      - { name: all_teachers_acknowledged, type: boolean, source: computed, description: "True iff every TeacherAcknowledgment row has ack_status = ACKNOWLEDGED and no PENDING or DECLINED remain" }

  - name: Accommodation
    parent: Section504Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Section504Plan.id; owning plan" }
      - { name: accommodation_type, type: enum, source: input, description: "EXTENDED_TIME | PREFERENTIAL_SEATING | REDUCED_WORKLOAD | BREAKS_AS_NEEDED | ASSISTIVE_TECH | MODIFIED_GRADING | OTHER" }
      - { name: description, type: string, source: input, description: "Free text" }
      - { name: accommodation_status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUSPENDED | DISCONTINUED" }
      - { name: applies_to_testing, type: boolean, source: input, default: false, description: "If true, this accommodation may be referenced by TestingAccommodationRequest" }

  - name: TeacherAcknowledgment
    parent: Section504Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Section504Plan.id; owning plan" }
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id; teacher who must acknowledge" }
      - { name: ack_status, type: enum, source: system, default: PENDING, description: "PENDING | ACKNOWLEDGED | DECLINED" }
      - { name: ack_requested_at, type: datetime, source: system, description: "When acknowledgment was requested" }
      - { name: ack_responded_at, type: datetime, source: system, description: "Null until teacher responds" }

  - name: ImplementationLog
    parent: Section504Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Section504Plan.id; owning plan" }
      - { name: accommodation_id, type: string, source: input, description: "FK -> Accommodation.id; the accommodation being documented" }
      - { name: logged_by_staff_id, type: string, source: system, description: "ID of the StaffMember who logged (Teacher or Coordinator)" }
      - { name: log_date, type: datetime, source: input, description: "Date of implementation observation" }
      - { name: was_implemented_as_planned, type: boolean, source: input, description: "True=implemented, False=deviation" }
      - { name: deviation_notes, type: string, source: input, description: "Required iff was_implemented_as_planned=false (ERR_DEVIATION_NOTES_REQUIRED)" }

  - name: ReviewEvent
    parent: Section504Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> Section504Plan.id; owning plan" }
      - { name: review_type, type: enum, source: input, description: "ANNUAL | RE_EVALUATION | PARENT_REQUESTED | DISTRICT_AUDIT" }
      - { name: review_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | OVERDUE | CANCELLED" }
      - { name: scheduled_for, type: datetime, source: input, description: "When the review is scheduled" }
      - { name: completed_at, type: datetime, source: system, description: "Null until COMPLETED" }
      - { name: outcome, type: enum, source: input, description: "Null until completion; then CONTINUE_PLAN | MODIFY_PLAN | EXIT_TO_IEP | TERMINATE_504" }
      - { name: was_late, type: boolean, source: computed, default: false, description: "True iff completed_at > scheduled_for + 14-day grace (ANNUAL) or > scheduled_for (RE_EVALUATION)" }

  - name: TestingAccommodationRequest
    parent: Section504Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Section504Plan.id; owning plan" }
      - { name: accommodation_id, type: string, source: input, description: "FK -> Accommodation.id; must reference an Accommodation with applies_to_testing=true" }
      - { name: test_name, type: string, source: input, description: "Name of assessment (e.g. 'State ELA Grade 8' — 'State ' prefix marks state-mandated tests)" }
      - { name: test_date, type: datetime, source: input, description: "Scheduled test date" }
      - { name: request_status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | PENDING_DISTRICT_REVIEW | APPROVED | DENIED | FLAGGED_FOR_STATE_AUDIT" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped" }
      - { name: reviewed_by_staff_id, type: string, source: system, description: "ID of the district StaffMember reviewer (must differ from plan drafter — segregation)" }
      - { name: review_deadline, type: datetime, source: computed, description: "submitted_at + 7 days" }

  - name: ParentConsentRecord
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; owning student" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> EligibilityEvaluation.id; set iff scope is RE_EVALUATION or INITIAL_PLAN tied to evaluation (nullable)" }
      - { name: plan_id, type: string, source: input, description: "FK -> Section504Plan.id; set iff scope is INITIAL_PLAN tied to plan, PLAN_AMENDMENT, EXIT_TO_IEP, or TESTING_ACCOMMODATION (nullable)" }
      - { name: consent_scope, type: enum, source: input, description: "INITIAL_PLAN | PLAN_AMENDMENT | RE_EVALUATION | EXIT_TO_IEP | TESTING_ACCOMMODATION" }
      - { name: consent_status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | GRANTED | DENIED | REVOKED" }
      - { name: requested_at, type: datetime, source: system, description: "Server-stamped" }
      - { name: responded_at, type: datetime, source: system, description: "Null until parent responds" }
      - { name: responded_by_parent_ref, type: string, source: input, description: "Parent identifier (opaque string)" }

  - name: Grievance
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; owning student" }
      - { name: plan_id, type: string, source: input, description: "FK -> Section504Plan.id; nullable — grievance may predate plan" }
      - { name: filed_by_parent_ref, type: string, source: input, description: "Parent identifier (opaque string)" }
      - { name: grievance_category, type: enum, source: input, description: "DISCRIMINATION | NON_IMPLEMENTATION | PROCEDURAL_VIOLATION | RETALIATION | OTHER" }
      - { name: description, type: string, source: input, description: "Free text" }
      - { name: grievance_status, type: enum, source: system, default: FILED, description: "FILED | INFORMAL_RESOLUTION | FORMAL_INVESTIGATION | RESOLVED | ESCALATED_TO_OCR | CLOSED" }
      - { name: filed_at, type: datetime, source: system, description: "Server-stamped" }
      - { name: resolution_deadline, type: datetime, source: computed, description: "filed_at + 30 days for INFORMAL; clock.now() + 60 days on escalate to FORMAL_INVESTIGATION" }
      - { name: resolved_by_staff_id, type: string, source: system, description: "ID of the StaffMember who resolved (must differ from intake officer — segregation)" }
      - { name: intake_staff_id, type: string, source: system, description: "ID of the StaffMember who took intake (coordinator)" }

  - name: StaffTrainingRecord
    parent: StaffMember
    common_fields: true
    fields:
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id; owning staff member" }
      - { name: training_topic, type: enum, source: input, description: "SECTION_504_BASICS | ACCOMMODATION_DELIVERY | GRIEVANCE_PROCEDURES | TESTING_ACCOMMODATIONS | TRANSITION_PROCEDURES" }
      - { name: trained_at, type: datetime, source: input, description: "Date training completed" }
      - { name: expires_at, type: datetime, source: computed, description: "trained_at + 2 years" }
      - { name: training_status, type: enum, source: computed, description: "CURRENT | EXPIRED — derived from expires_at vs clock" }

  - name: ComplianceAuditEvent
    parent: School
    common_fields: false
    fields:
      - { name: school_id, type: string, source: system, description: "FK -> School.id; owning school" }
      - { name: event_type, type: enum, source: system, description: "REFERRAL_SUBMITTED | REFERRAL_REVIEWED | EVALUATION_INITIATED | CONSENT_GRANTED | CONSENT_DENIED | DETERMINATION_MADE | PLAN_ACTIVATED | PLAN_SUSPENDED | PLAN_TERMINATED | REVIEW_COMPLETED_LATE | REVIEW_OVERDUE | TEST_ACCOMM_DENIED | GRIEVANCE_FILED | GRIEVANCE_ESCALATED | TRAINING_LAPSED | POSTURE_CHANGED | OCC_CONFLICT" }
      - { name: entity_ref, type: string, source: system, description: "ID of the entity this event pertains to (Student/Plan/Grievance/etc.)" }
      - { name: actor_staff_id, type: string, source: system, description: "ID of the acting StaffMember (or null for system)" }
      - { name: event_payload, type: object, source: system, description: "Event-specific structured details" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Section504Referral
    initial_state: PENDING
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: UNDER_REVIEW
        trigger: "POST /referrals/{referralId}/start-review"
        actor: Section504Coordinator
        preconditions:
          - "Referral is in PENDING (ERR_REFERRAL_NOT_PENDING)"
          - "Student.section_504_status == REFERRED (ERR_STUDENT_NOT_IN_REFERRED_STATE)"
          - "School.school_posture != AUDIT_HOLD (ERR_SCHOOL_UNDER_AUDIT_HOLD)"
        side_effects:
          - "Emit ComplianceAuditEvent(REFERRAL_REVIEWED)"
      - from: UNDER_REVIEW
        to: EVALUATION_INITIATED
        trigger: "POST /referrals/{referralId}/initiate-evaluation"
        actor: Section504Coordinator
        preconditions:
          - "Referral is in UNDER_REVIEW (ERR_REFERRAL_NOT_UNDER_REVIEW)"
          - "Student has no other EligibilityEvaluation in non-terminal state (ERR_EVALUATION_ALREADY_OPEN)"
        side_effects:
          - "Create EligibilityEvaluation(status=INITIATED, referral_id=this)"
          - "Student.section_504_status: REFERRED -> EVALUATING"
          - "Emit ComplianceAuditEvent(EVALUATION_INITIATED)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /referrals/{referralId}/reject"
        actor: Section504Coordinator
        preconditions:
          - "Referral is in UNDER_REVIEW (ERR_REFERRAL_NOT_UNDER_REVIEW)"
        side_effects:
          - "Student.section_504_status: REFERRED -> NONE"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /referrals/{referralId}/withdraw"
        actor: Section504Coordinator
        preconditions:
          - "Referral is in PENDING or UNDER_REVIEW (ERR_REFERRAL_NOT_WITHDRAWABLE)"
        side_effects:
          - "Student.section_504_status: REFERRED -> NONE"

  - entity: EligibilityEvaluation
    initial_state: INITIATED
    terminal_states: [DETERMINATION_MADE, CANCELLED]
    transitions:
      - from: INITIATED
        to: CONSENT_PENDING
        trigger: "POST /evaluations/{evaluationId}/request-consent"
        actor: Section504Coordinator
        preconditions:
          - "Evaluation is INITIATED (ERR_EVALUATION_NOT_INITIATED)"
        side_effects:
          - "Create ParentConsentRecord(scope = RE_EVALUATION if supersedes_evaluation_id else INITIAL_PLAN, evaluation_id=this)"
      - from: CONSENT_PENDING
        to: CONSENT_RECEIVED
        trigger: "POST /evaluations/{evaluationId}/record-consent (granted=true)"
        actor: Section504Coordinator
        preconditions:
          - "Evaluation is CONSENT_PENDING (ERR_EVALUATION_NOT_AWAITING_CONSENT)"
        side_effects:
          - "parent_consent_obtained_at = clock.now()"
          - "Linked ParentConsentRecord.consent_status -> GRANTED; responded_at = clock.now()"
          - "Emit ComplianceAuditEvent(CONSENT_GRANTED)"
      - from: CONSENT_PENDING
        to: CANCELLED
        trigger: "POST /evaluations/{evaluationId}/record-consent (granted=false)"
        actor: Section504Coordinator
        preconditions:
          - "Evaluation is CONSENT_PENDING (ERR_EVALUATION_NOT_AWAITING_CONSENT)"
        side_effects:
          - "Linked ParentConsentRecord.consent_status -> DENIED"
          - "Student.section_504_status: EVALUATING -> NONE"
          - "Emit ComplianceAuditEvent(CONSENT_DENIED)"
      - from: CONSENT_RECEIVED
        to: EVALUATION_IN_PROGRESS
        trigger: "POST /evaluations/{evaluationId}/start"
        actor: Section504Coordinator
        preconditions:
          - "Evaluation is CONSENT_RECEIVED (ERR_EVALUATION_NOT_READY_TO_START)"
        side_effects:
          - "evaluation_started_at = clock.now()"
          - "determination_deadline = evaluation_started_at + 60 days"
      - from: EVALUATION_IN_PROGRESS
        to: DETERMINATION_MADE
        trigger: "POST /evaluations/{evaluationId}/determine"
        actor: Section504Coordinator
        preconditions:
          - "Evaluation is EVALUATION_IN_PROGRESS (ERR_EVALUATION_NOT_IN_PROGRESS)"
          - "Actor staff_id differs from referral.submitted_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If supersedes_evaluation_id is set, that prior evaluation must be in DETERMINATION_MADE (ERR_PRIOR_EVALUATION_OPEN)"
          - "If determination_outcome == NOT_ELIGIBLE AND clock.now() > determination_deadline: ERR_DETERMINATION_DEADLINE_MISSED"
        side_effects:
          - "determination_outcome set per input; disability_impairment_found and major_life_activity_affected stored"
          - "If determination_outcome == NOT_ELIGIBLE: Student.section_504_status -> NOT_ELIGIBLE"
          - "If determination_outcome == ELIGIBLE: Student.section_504_status stays EVALUATING (awaits plan activation)"
          - "If determination made after determination_deadline AND outcome == ELIGIBLE: emit ComplianceAuditEvent(REVIEW_COMPLETED_LATE) surrogate"
          - "Emit ComplianceAuditEvent(DETERMINATION_MADE)"

  - entity: Section504Plan
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXITED_TO_IEP]
    transitions:
      - from: DRAFT
        to: PENDING_PARENT_CONSENT
        trigger: "POST /plans/{planId}/submit-for-consent"
        actor: Section504Coordinator
        preconditions:
          - "Plan is DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "Plan has at least 1 Accommodation (ERR_PLAN_HAS_NO_ACCOMMODATIONS)"
          - "Linked EligibilityEvaluation.determination_outcome == ELIGIBLE (ERR_PLAN_REQUIRES_ELIGIBLE_DETERMINATION)"
          - "Student has no other Section504Plan in {DRAFT-submitted, PENDING_PARENT_CONSENT, PENDING_TEACHER_ACK, ACTIVE, UNDER_ANNUAL_REVIEW} (ERR_STUDENT_PLAN_ALREADY_OPEN)"
          - "expected_plan_version matches plan.version (ERR_STALE_PLAN_VERSION, 412)"
        side_effects:
          - "Create ParentConsentRecord(scope=INITIAL_PLAN, plan_id=this)"
          - "Increments Section504Plan.version by 1"
      - from: PENDING_PARENT_CONSENT
        to: PENDING_TEACHER_ACK
        trigger: "POST /plans/{planId}/record-parent-consent (granted=true)"
        actor: Section504Coordinator
        preconditions:
          - "Plan is PENDING_PARENT_CONSENT (ERR_PLAN_NOT_AWAITING_CONSENT)"
        side_effects:
          - "Linked ParentConsentRecord(scope=INITIAL_PLAN, plan_id=this).consent_status -> GRANTED; responded_at = clock.now()"
          - "Create one TeacherAcknowledgment row per active StaffMember where staff_role == TEACHER and school_id == plan.student.school_id (selector: staff_role=TEACHER AND is_active=true; ranking: created_at ASC; no tie-break needed since all included)"
          - "Recompute plan.all_teachers_acknowledged (false initially)"
      - from: PENDING_PARENT_CONSENT
        to: DRAFT
        trigger: "POST /plans/{planId}/record-parent-consent (granted=false)"
        actor: Section504Coordinator
        preconditions:
          - "Plan is PENDING_PARENT_CONSENT (ERR_PLAN_NOT_AWAITING_CONSENT)"
        side_effects:
          - "Linked ParentConsentRecord.consent_status -> DENIED"
          - "Emit ComplianceAuditEvent(CONSENT_DENIED)"
      - from: PENDING_TEACHER_ACK
        to: ACTIVE
        trigger: "system (auto when the last PENDING TeacherAcknowledgment flips to ACKNOWLEDGED and no DECLINED rows remain)"
        actor: system
        preconditions:
          - "all_teachers_acknowledged == true"
        side_effects:
          - "plan_effective_date = clock.now()"
          - "next_annual_review_due = plan_effective_date + 365 days"
          - "next_re_evaluation_due = evaluation.created_at + 3 years (evaluation = the EligibilityEvaluation linked by plan.evaluation_id)"
          - "All Accommodations on this plan in DRAFT -> ACTIVE"
          - "Student.section_504_status: EVALUATING -> PLAN_ACTIVE"
          - "Student.has_active_504_plan recomputed (true)"
          - "Emit ComplianceAuditEvent(PLAN_ACTIVATED)"
      - from: ACTIVE
        to: UNDER_ANNUAL_REVIEW
        trigger: "POST /plans/{planId}/reviews (any review_type)"
        actor: Section504Coordinator
        preconditions:
          - "Plan is ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "No ReviewEvent for this plan already in SCHEDULED or IN_PROGRESS (ERR_REVIEW_ALREADY_SCHEDULED)"
        side_effects:
          - "Create ReviewEvent(status=SCHEDULED, plan_id=this)"
      - from: UNDER_ANNUAL_REVIEW
        to: ACTIVE
        trigger: "POST /reviews/{reviewId}/complete (outcome=CONTINUE_PLAN)"
        actor: Section504Coordinator
        preconditions:
          - "Plan is UNDER_ANNUAL_REVIEW (ERR_PLAN_NOT_UNDER_REVIEW)"
          - "ReviewEvent.review_status == IN_PROGRESS (ERR_REVIEW_NOT_IN_PROGRESS)"
        side_effects:
          - "ReviewEvent.review_status -> COMPLETED; completed_at = clock.now()"
          - "was_late recomputed; if was_late: emit ComplianceAuditEvent(REVIEW_COMPLETED_LATE)"
          - "If review_type == ANNUAL: next_annual_review_due = completed_at + 365 days"
          - "If review_type == RE_EVALUATION: next_re_evaluation_due = completed_at + 3 years; create new EligibilityEvaluation(supersedes_evaluation_id = plan.evaluation_id, status = INITIATED) — plan.evaluation_id switches to the new evaluation once it reaches DETERMINATION_MADE (ELIGIBLE)"
      - from: UNDER_ANNUAL_REVIEW
        to: DRAFT
        trigger: "POST /reviews/{reviewId}/complete (outcome=MODIFY_PLAN)"
        actor: Section504Coordinator
        preconditions:
          - "Plan is UNDER_ANNUAL_REVIEW (ERR_PLAN_NOT_UNDER_REVIEW)"
          - "ReviewEvent.review_status == IN_PROGRESS (ERR_REVIEW_NOT_IN_PROGRESS)"
        side_effects:
          - "Plan re-enters DRAFT (cyclic revision loop): plan_status ACTIVE -> UNDER_ANNUAL_REVIEW -> DRAFT"
          - "Accommodations stay in their current states; new accommodations may be added/removed in DRAFT"
          - "Plan must re-traverse submit-for-consent -> record-parent-consent -> teacher acks -> auto-activate"
          - "Student.section_504_status remains PLAN_ACTIVE until plan exits DRAFT again"
      - from: UNDER_ANNUAL_REVIEW
        to: EXITED_TO_IEP
        trigger: "POST /reviews/{reviewId}/complete (outcome=EXIT_TO_IEP)"
        actor: Section504Coordinator
        preconditions:
          - "Plan is UNDER_ANNUAL_REVIEW (ERR_PLAN_NOT_UNDER_REVIEW)"
          - "Student.iep_status == IEP_ACTIVE (ERR_IEP_NOT_ACTIVE)"
          - "ParentConsentRecord(scope=EXIT_TO_IEP, plan_id=this).consent_status == GRANTED (ERR_PARENT_CONSENT_REQUIRED)"
        side_effects:
          - "Student.section_504_status -> EXITED_TO_IEP; Student.has_active_504_plan = false"
          - "All Accommodations on this plan -> DISCONTINUED"
          - "All PENDING TeacherAcknowledgment rows -> DECLINED"
          - "All TestingAccommodationRequests on this plan in SUBMITTED or PENDING_DISTRICT_REVIEW -> DENIED (auto-cancel cascade)"
      - from: UNDER_ANNUAL_REVIEW
        to: TERMINATED
        trigger: "POST /reviews/{reviewId}/complete (outcome=TERMINATE_504)"
        actor: Section504Coordinator
        preconditions:
          - "Plan is UNDER_ANNUAL_REVIEW (ERR_PLAN_NOT_UNDER_REVIEW)"
        side_effects:
          - "Student.section_504_status -> TERMINATED; has_active_504_plan = false"
          - "All Accommodations on this plan -> DISCONTINUED"
          - "Emit ComplianceAuditEvent(PLAN_TERMINATED)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /plans/{planId}/suspend"
        actor: Section504Coordinator
        preconditions:
          - "Plan is ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "implementation_compliance_pct < 60 OR school.school_posture == AUDIT_HOLD (ERR_NO_SUSPENSION_JUSTIFICATION)"
        side_effects:
          - "Student.section_504_status: PLAN_ACTIVE -> PLAN_SUSPENDED"
          - "Student.has_active_504_plan = false (suspended plan does not count)"
          - "Emit ComplianceAuditEvent(PLAN_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /plans/{planId}/reinstate"
        actor: Section504Coordinator
        preconditions:
          - "Plan is SUSPENDED (ERR_PLAN_NOT_SUSPENDED)"
          - "School.school_posture == OPERATIONAL (ERR_SCHOOL_UNDER_AUDIT_HOLD)"
        side_effects:
          - "Student.section_504_status: PLAN_SUSPENDED -> PLAN_ACTIVE"
          - "Student.has_active_504_plan = true"

  - entity: Accommodation
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (auto when parent plan transitions to ACTIVE)"
        actor: system
        preconditions: ["Parent plan transitions to ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accommodations/{accommodationId}/suspend"
        actor: Section504Coordinator
        preconditions:
          - "Accommodation is ACTIVE (ERR_ACCOMMODATION_NOT_ACTIVE)"
          - "Plan is ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accommodations/{accommodationId}/resume"
        actor: Section504Coordinator
        preconditions:
          - "Accommodation is SUSPENDED (ERR_ACCOMMODATION_NOT_SUSPENDED)"
          - "Plan is ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /accommodations/{accommodationId}/discontinue"
        actor: Section504Coordinator
        preconditions:
          - "Accommodation is ACTIVE or SUSPENDED (ERR_ACCOMMODATION_NOT_DISCONTINUABLE)"
        side_effects:
          - "All TestingAccommodationRequest rows referencing this accommodation in SUBMITTED or PENDING_DISTRICT_REVIEW -> DENIED (cascade)"
      - from: SUSPENDED
        to: DISCONTINUED
        trigger: "POST /accommodations/{accommodationId}/discontinue"
        actor: Section504Coordinator
        preconditions:
          - "Accommodation is ACTIVE or SUSPENDED (ERR_ACCOMMODATION_NOT_DISCONTINUABLE)"
        side_effects:
          - "Same cascade as ACTIVE -> DISCONTINUED"

  - entity: TeacherAcknowledgment
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, DECLINED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /teacher-acks/{ackId}/acknowledge"
        actor: Teacher
        preconditions:
          - "Ack is PENDING (ERR_ACK_NOT_PENDING)"
          - "X-User-ID maps to a StaffMember with id == ack.staff_id (ERR_ACK_OWNERSHIP_MISMATCH)"
          - "StaffMember.current_training_status == TRAINED_CURRENT (ERR_STAFF_TRAINING_NOT_CURRENT)"
        side_effects:
          - "ack_responded_at = clock.now()"
          - "Recompute plan.all_teachers_acknowledged"
          - "If no PENDING or DECLINED acks remain AND plan.plan_status == PENDING_TEACHER_ACK: plan auto-transitions PENDING_TEACHER_ACK -> ACTIVE (cascades: accommodations DRAFT -> ACTIVE, plan_effective_date + due dates anchored, student status -> PLAN_ACTIVE)"
          - "Increments Section504Plan.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /teacher-acks/{ackId}/decline"
        actor: Teacher
        preconditions:
          - "Ack is PENDING (ERR_ACK_NOT_PENDING)"
          - "X-User-ID maps to a StaffMember with id == ack.staff_id (ERR_ACK_OWNERSHIP_MISMATCH)"
        side_effects:
          - "Plan is blocked from activating until coordinator adds a replacement TeacherAcknowledgment row (POST /plans/{planId}/teacher-acks)"

  - entity: ReviewEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /reviews/{reviewId}/start"
        actor: Section504Coordinator
        preconditions:
          - "Review is SCHEDULED (ERR_REVIEW_NOT_SCHEDULED)"
          - "Plan is UNDER_ANNUAL_REVIEW (ERR_PLAN_NOT_UNDER_REVIEW)"
        side_effects: []
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (auto when clock advances past scheduled_for + grace window AND review is still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "Emit ComplianceAuditEvent(REVIEW_OVERDUE)"
          - "Recompute school.school_posture (may flip to PROBATION or AUDIT_HOLD)"
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: "POST /reviews/{reviewId}/start"
        actor: Section504Coordinator
        preconditions:
          - "Review is OVERDUE (ERR_REVIEW_NOT_SCHEDULED)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /reviews/{reviewId}/complete"
        actor: Section504Coordinator
        preconditions:
          - "Review is IN_PROGRESS (ERR_REVIEW_NOT_IN_PROGRESS)"
        side_effects:
          - "See plan-side transitions for outcome-specific cascades"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /reviews/{reviewId}/cancel"
        actor: Section504Coordinator
        preconditions:
          - "Review is SCHEDULED (ERR_REVIEW_NOT_SCHEDULED)"
        side_effects:
          - "Plan reverts UNDER_ANNUAL_REVIEW -> ACTIVE (compensation)"

  - entity: TestingAccommodationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: PENDING_DISTRICT_REVIEW
        trigger: "POST /testing-requests/{requestId}/forward-to-district"
        actor: Section504Coordinator
        preconditions:
          - "Request is SUBMITTED (ERR_TESTING_REQUEST_NOT_SUBMITTED)"
          - "test_date - clock.now() >= 14 days (ERR_TESTING_LEAD_TIME_INSUFFICIENT)"
          - "Plan is ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects: []
      - from: PENDING_DISTRICT_REVIEW
        to: APPROVED
        trigger: "POST /testing-requests/{requestId}/approve"
        actor: District504Director
        preconditions:
          - "Request is PENDING_DISTRICT_REVIEW (ERR_TESTING_REQUEST_NOT_PENDING)"
          - "Reviewer staff_id differs from plan.drafted_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_staff_id = actor's StaffMember.id"
      - from: PENDING_DISTRICT_REVIEW
        to: DENIED
        trigger: "POST /testing-requests/{requestId}/deny"
        actor: District504Director
        preconditions:
          - "Request is PENDING_DISTRICT_REVIEW (ERR_TESTING_REQUEST_NOT_PENDING)"
        side_effects:
          - "Emit ComplianceAuditEvent(TEST_ACCOMM_DENIED)"
      - from: APPROVED
        to: FLAGGED_FOR_STATE_AUDIT
        trigger: "POST /testing-requests/{requestId}/flag"
        actor: District504Director
        preconditions:
          - "Request is APPROVED (ERR_TESTING_REQUEST_NOT_APPROVED)"
          - "test_name starts with 'State ' AND the underlying Accommodation has accommodation_status == DISCONTINUED (retroactive integrity check)"
        side_effects: []

  - entity: Grievance
    initial_state: FILED
    terminal_states: [RESOLVED, CLOSED]
    transitions:
      - from: FILED
        to: INFORMAL_RESOLUTION
        trigger: "POST /grievances/{grievanceId}/begin-informal"
        actor: Section504Coordinator
        preconditions:
          - "Grievance is FILED (ERR_GRIEVANCE_NOT_FILED)"
        side_effects:
          - "intake_staff_id = actor's StaffMember.id"
          - "resolution_deadline = filed_at + 30 days"
      - from: INFORMAL_RESOLUTION
        to: FORMAL_INVESTIGATION
        trigger: "POST /grievances/{grievanceId}/escalate-to-formal"
        actor: Section504Coordinator
        preconditions:
          - "Grievance is INFORMAL_RESOLUTION (ERR_GRIEVANCE_NOT_INFORMAL)"
        side_effects:
          - "resolution_deadline = clock.now() + 60 days"
      - from: INFORMAL_RESOLUTION
        to: RESOLVED
        trigger: "POST /grievances/{grievanceId}/resolve"
        actor: District504Director
        preconditions:
          - "Grievance is INFORMAL_RESOLUTION (ERR_GRIEVANCE_NOT_INFORMAL)"
          - "Actor staff_id != intake_staff_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_grievance_version matches grievance.version (ERR_STALE_GRIEVANCE_VERSION, 412)"
        side_effects:
          - "resolved_by_staff_id = actor's StaffMember.id"
          - "Increments Grievance.version by 1"
          - "Recompute school.school_posture (open-grievance count drops)"
      - from: FORMAL_INVESTIGATION
        to: RESOLVED
        trigger: "POST /grievances/{grievanceId}/resolve"
        actor: District504Director
        preconditions:
          - "Grievance is FORMAL_INVESTIGATION (ERR_GRIEVANCE_NOT_FORMAL)"
          - "Actor staff_id != intake_staff_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_grievance_version matches grievance.version (ERR_STALE_GRIEVANCE_VERSION, 412)"
        side_effects:
          - "resolved_by_staff_id = actor's StaffMember.id"
          - "Increments Grievance.version by 1"
          - "Recompute school.school_posture"
      - from: FORMAL_INVESTIGATION
        to: ESCALATED_TO_OCR
        trigger: "POST /grievances/{grievanceId}/escalate-to-ocr"
        actor: District504Director
        preconditions:
          - "Grievance is FORMAL_INVESTIGATION (ERR_GRIEVANCE_NOT_FORMAL)"
        side_effects:
          - "Emit ComplianceAuditEvent(GRIEVANCE_ESCALATED)"
          - "Recompute school.school_posture (OCR escalation forces AUDIT_HOLD)"
      - from: ESCALATED_TO_OCR
        to: CLOSED
        trigger: "POST /grievances/{grievanceId}/close"
        actor: District504Director
        preconditions:
          - "Grievance is ESCALATED_TO_OCR (ERR_GRIEVANCE_NOT_ESCALATED)"
        side_effects:
          - "Recompute school.school_posture (may drop from AUDIT_HOLD)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: plan-submit-stale-version
    parent_entity: Section504Plan
    write_endpoint: "POST /plans/{planId}/submit-for-consent"
    occ_field: expected_plan_version
    description: |
      Submitting a plan for parent consent when the plan's version has advanced
      since the client last observed it is rejected. Captures the case where
      another coordinator has added an Accommodation to the plan (which bumps
      the plan's version) and the current writer's view of the accommodation
      set is stale.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

  - rule_id: plan-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /plans"
    occ_field: expected_student_version
    description: |
      Creating a new Section504Plan against a Student whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another workflow (e.g., a determination on a parallel evaluation, or an
      iep_status flip via PATCH /students/{id}) has mutated the student and the
      plan-creation would be premised on stale student state.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

  - rule_id: grievance-resolve-stale-version
    parent_entity: Grievance
    write_endpoint: "POST /grievances/{grievanceId}/resolve"
    occ_field: expected_grievance_version
    description: |
      Resolving a grievance whose version has advanced since the resolver last
      observed it is rejected. Captures the case where another actor escalated
      the grievance to FORMAL_INVESTIGATION between the resolver's read and the
      resolve call, leaving the resolver's premise (still INFORMAL_RESOLUTION
      with deadline X) stale.
    error_id: ERR_STALE_GRIEVANCE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: implementation_compliance_ratio
    trigger: "On POST /implementation-logs; on GET /plans/{planId}"
    algorithm: aggregation
    formula: |
      Let logs = ImplementationLog entries for this plan with log_date in window W.
      Let implemented = count of logs where was_implemented_as_planned == true.
      Let total = count of logs.
      ratio = (total == 0) ? 1.0 : (implemented / total)
      plan.implementation_compliance_pct = round(ratio * 100, 2)
    input_set: "ImplementationLog rows for this plan, filtered by log_date within the window defined by variant"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: trailing_30_day
        when: "Default; W = [clock.now() - 30 days, clock.now()] (inclusive both ends)"
        difference: "Only logs in the last 30 calendar days count; empty window yields ratio = 1.0"
      - name: cumulative_plan_year
        when: "Computed when generating the annual compliance snapshot via GET /plans/{id}/compliance-summary"
        difference: "All logs since the plan year's anchor (plan_effective_date or last completed ANNUAL review's completed_at, whichever is later) count"

  - name: determination_timeliness_check
    trigger: "On POST /evaluations/{id}/determine"
    algorithm: chronological
    formula: |
      days_elapsed = floor((clock.now() - evaluation_started_at) / 86400)
      is_timely = (days_elapsed <= 60)
      If NOT is_timely AND determination_outcome == NOT_ELIGIBLE: reject with ERR_DETERMINATION_DEADLINE_MISSED (cannot deny late).
      If NOT is_timely AND determination_outcome == ELIGIBLE: allow, but emit ComplianceAuditEvent(REVIEW_COMPLETED_LATE).
    input_set: "single EligibilityEvaluation"
    constants:
      DETERMINATION_WINDOW_DAYS: 60

  - name: annual_review_window_check
    trigger: "On clock advance; on GET /plans/{id}"
    algorithm: threshold
    formula: |
      anchor = plan.plan_effective_date if no completed ANNUAL review exists
               else max(completed_at) over ReviewEvent rows where review_type == ANNUAL and review_status == COMPLETED
      days_since_anchor = floor((clock.now() - anchor) / 86400)
      is_due = (days_since_anchor >= 365)
      is_overdue = (days_since_anchor > 365 + 14)   # 14-day grace; strictly greater than 379
    input_set: "Single plan; its ANNUAL ReviewEvent history"
    constants:
      ANNUAL_WINDOW_DAYS: 365
      GRACE_DAYS: 14
    precision: "integer days, floor"
    variants:
      - name: annual_strict
        when: "review_type == ANNUAL"
        difference: "Uses 14-day grace window (boundary at 379)"
      - name: re_evaluation_strict
        when: "review_type == RE_EVALUATION"
        difference: "No grace window — boundary at exactly 1095 days"

  - name: re_evaluation_cadence_check
    trigger: "On clock advance; on GET /plans/{id}"
    algorithm: threshold
    formula: |
      anchor = created_at of the most recent EligibilityEvaluation with evaluation_status == DETERMINATION_MADE for this student
      days_since = floor((clock.now() - anchor) / 86400)
      is_re_evaluation_due = (days_since >= 1095)   # 3 * 365
    input_set: "EligibilityEvaluation rows for this student with evaluation_status == DETERMINATION_MADE"
    constants:
      RE_EVAL_WINDOW_DAYS: 1095

  - name: testing_accommodation_lead_time_check
    trigger: "On POST /testing-requests/{id}/forward-to-district"
    algorithm: threshold
    formula: |
      days_until_test = floor((test_date - clock.now()) / 86400)
      lead_time_sufficient = (days_until_test >= 14)
    input_set: "single TestingAccommodationRequest"
    constants:
      MIN_LEAD_DAYS: 14
    precision: "integer days, floor; boundary at exactly 14 passes, 13 fails"

  - name: staff_training_coverage_ratio
    trigger: "On POST /training-records; on clock advance"
    algorithm: aggregation
    formula: |
      active_staff = StaffMember rows where school_id == school.id AND is_active == true
      trained_current = count of active_staff where current_training_status == TRAINED_CURRENT
      coverage_ratio = (count(active_staff) == 0) ? 1.0 : (trained_current / count(active_staff))
      coverage_pct = round(coverage_ratio * 100, 2)
    input_set: "StaffMember rows for the school where is_active == true"
    precision: "2 decimal places, round_half_up"

  - name: school_posture_derivation
    trigger: "On ComplianceAuditEvent append; on training coverage recompute; on review overdue event"
    algorithm: weighted_scoring
    formula: |
      # Four inputs with non-linear interaction
      open_grievance_count = count of Grievance rows where student.school_id == school.id
                             AND grievance_status IN {FILED, INFORMAL_RESOLUTION, FORMAL_INVESTIGATION}
      ocr_escalation_flag = (count of Grievance rows where student.school_id == school.id
                             AND grievance_status == ESCALATED_TO_OCR) > 0 ? 1 : 0
      overdue_reviews_count = count of ReviewEvent rows where plan.student.school_id == school.id
                              AND review_status == OVERDUE
      training_gap = (staff_training_coverage_ratio < 0.95) ? 1 : 0

      open_grievance_weight = open_grievance_count * 20
      ocr_escalation_weight = ocr_escalation_flag * 50
      overdue_weight = min(overdue_reviews_count * 15, 30)
      training_gap_weight = training_gap * 25

      composite_score = min(open_grievance_weight + ocr_escalation_weight + overdue_weight + training_gap_weight, 100)

      # Threshold selection (branching on entity state)
      if composite_score >= 60 OR ocr_escalation_weight > 0:
        school_posture = AUDIT_HOLD
      elif composite_score >= 30:
        school_posture = PROBATION
      else:
        school_posture = OPERATIONAL
    input_set: "Grievance rows + ReviewEvent rows + StaffMember rows for the school"
    constants:
      GRIEVANCE_WEIGHT: 20
      OCR_FLAG_WEIGHT: 50
      OVERDUE_REVIEW_WEIGHT: 15
      OVERDUE_REVIEW_CAP: 30
      TRAINING_GAP_WEIGHT: 25
      TRAINING_FLOOR: 0.95
      PROBATION_THRESHOLD: 30
      AUDIT_HOLD_THRESHOLD: 60
    precision: "integer composite score"

  - name: teacher_ack_completion_gate
    trigger: "On TeacherAcknowledgment flip to ACKNOWLEDGED or DECLINED"
    algorithm: aggregation
    formula: |
      acks = TeacherAcknowledgment rows for this plan
      pending = count(acks where ack_status == PENDING)
      declined = count(acks where ack_status == DECLINED)
      all_acknowledged = (pending == 0) AND (declined == 0) AND (count(acks) > 0)
      plan.all_teachers_acknowledged = all_acknowledged
      If all_acknowledged AND plan.plan_status == PENDING_TEACHER_ACK: trigger plan PENDING_TEACHER_ACK -> ACTIVE
    input_set: "All TeacherAcknowledgment rows for this plan"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be authorized for this endpoint (per §1.7)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resource ids must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "School posture must not be AUDIT_HOLD for mutation operations under that school"
    error_id: ERR_SCHOOL_UNDER_AUDIT_HOLD
    http_status: 409
    applies_to: "All POST/PUT/PATCH/DELETE mutations scoped under a school"

  - priority: 5
    category: state
    check: "OCC expected_*_version must match current parent entity version (where declared)"
    error_id: "ERR_STALE_PLAN_VERSION | ERR_STALE_STUDENT_VERSION | ERR_STALE_GRIEVANCE_VERSION"
    http_status: 412
    applies_to: "Endpoints declared in §1.2.1"

  - priority: 6
    category: state
    check: "Target entity must be in the expected state for the requested transition"
    error_id: "ERR_<ENTITY>_NOT_<STATE> (entity-specific)"
    http_status: 409
    applies_to: "All state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Parent consent must be GRANTED for gated operations (initial plan activation, re-evaluation, exit-to-IEP)"
    error_id: ERR_PARENT_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /plans/{id}/record-parent-consent, POST /reviews/{id}/complete (outcome=EXIT_TO_IEP)"

  - priority: 8
    category: business_safety
    check: "Segregation of duties — determiner != referral submitter; testing reviewer != plan drafter; grievance resolver != grievance intake"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /evaluations/{id}/determine, POST /testing-requests/{id}/approve, POST /grievances/{id}/resolve"

  - priority: 9
    category: business_temporal
    check: "Testing accommodation lead time (>=14 days before test_date)"
    error_id: ERR_TESTING_LEAD_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /testing-requests/{id}/forward-to-district"

  - priority: 10
    category: business_temporal
    check: "Determination deadline — late NOT_ELIGIBLE determinations forbidden; late ELIGIBLE allowed with audit event"
    error_id: ERR_DETERMINATION_DEADLINE_MISSED
    http_status: 422
    applies_to: "POST /evaluations/{id}/determine"

  - priority: 11
    category: business_referential
    check: "Referenced Accommodation must belong to the same plan AND have applies_to_testing=true for testing requests"
    error_id: ERR_ACCOMMODATION_NOT_TEST_APPLICABLE
    http_status: 422
    applies_to: "POST /testing-requests"

  - priority: 12
    category: business_referential
    check: "Referenced Accommodation must be in ACTIVE state for implementation logging"
    error_id: ERR_ACCOMMODATION_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /implementation-logs"

  - priority: 13
    category: business_constraint
    check: "Student cannot have more than one open plan (any plan not in TERMINATED/EXITED_TO_IEP)"
    error_id: ERR_STUDENT_PLAN_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /plans"

  - priority: 14
    category: business_constraint
    check: "Student cannot have more than one open evaluation (non-terminal EligibilityEvaluation)"
    error_id: ERR_EVALUATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /referrals/{id}/initiate-evaluation"

  - priority: 15
    category: business_constraint
    check: "Teacher acknowledging a plan must have current 504 training (current_training_status == TRAINED_CURRENT)"
    error_id: ERR_STAFF_TRAINING_NOT_CURRENT
    http_status: 422
    applies_to: "POST /teacher-acks/{id}/acknowledge"

  - priority: 16
    category: business_constraint
    check: "Plan must have at least 1 Accommodation before submit-for-consent"
    error_id: ERR_PLAN_HAS_NO_ACCOMMODATIONS
    http_status: 422
    applies_to: "POST /plans/{id}/submit-for-consent"

  - priority: 17
    category: business_temporal
    check: "IEP exit path — student.iep_status must be IEP_ACTIVE before EXIT_TO_IEP outcome is allowed"
    error_id: ERR_IEP_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /reviews/{id}/complete (outcome=EXIT_TO_IEP)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Schools ---
  - method: POST
    path: "/schools"
    description: "Create a School"
    roles: [District504Director]
    code: 201
    input: [school_name, district_code, current_academic_year]
    output: School
    side_effects: ["school_posture initialized to OPERATIONAL"]

  - method: GET
    path: "/schools"
    description: "List schools"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: ["limit?", "offset?"]
    output: "School[]"
    side_effects: []

  - method: GET
    path: "/schools/{schoolId}"
    description: "Get school detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/schools/{schoolId}/compliance-summary"
    description: "Computed read — posture derivation snapshot"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal]
    code: 200
    input: []
    output: "{ posture: string, training_coverage_pct: number, open_grievance_count: integer, overdue_review_count: integer, composite_score: integer }"
    side_effects: []

  # --- Staff ---
  - method: POST
    path: "/staff-members"
    description: "Register a staff member"
    roles: [District504Director, SchoolPrincipal]
    code: 201
    input: [school_id, staff_external_ref, full_name, staff_role, "is_active?"]
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/staff-members"
    description: "List staff (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: ["school_id?", "staff_role?", "is_active?", "limit?", "offset?"]
    output: "StaffMember[]"
    side_effects: []

  - method: GET
    path: "/staff-members/{staffId}"
    description: "Get staff detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  # --- Staff Training ---
  - method: POST
    path: "/training-records"
    description: "Record a training completion"
    roles: [District504Director, SchoolPrincipal, Section504Coordinator]
    code: 201
    input: [staff_id, training_topic, trained_at]
    output: StaffTrainingRecord
    side_effects:
      - "expires_at = trained_at + 2 years"
      - "Recompute staff.current_training_status"
      - "Recompute school training coverage; may flip school_posture"

  - method: GET
    path: "/training-records"
    description: "List training records (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: ["staff_id?", "training_topic?", "limit?", "offset?"]
    output: "StaffTrainingRecord[]"
    side_effects: []

  - method: GET
    path: "/training-records/{recordId}"
    description: "Get a single training record"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: []
    output: StaffTrainingRecord
    side_effects: []

  # --- Students ---
  - method: POST
    path: "/students"
    description: "Register a student"
    roles: [Section504Coordinator, SchoolPrincipal]
    code: 201
    input: [school_id, student_external_ref, full_name, date_of_birth, grade_level]
    output: Student
    side_effects: ["section_504_status = NONE; iep_status = NONE; version = 1"]

  - method: GET
    path: "/students"
    description: "List students (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: ["school_id?", "section_504_status?", "iep_status?", "has_active_504_plan?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/students/{studentId}"
    description: "Get student detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: PATCH
    path: "/students/{studentId}"
    description: "Update student iep_status (district special-ed workflow writes back)"
    roles: [District504Director]
    code: 200
    input: ["iep_status?"]
    output: Student
    side_effects:
      - "Increments Student.version by 1"
      - "If iep_status transitions to IEP_ACTIVE while a plan is ACTIVE: no automatic cascade (requires explicit review with EXIT_TO_IEP outcome)"

  # --- Referrals ---
  - method: POST
    path: "/referrals"
    description: "Submit a 504 referral for a student"
    roles: [Teacher, Section504Coordinator]
    code: 201
    input: [student_id, referral_reason, suspected_disability_category]
    output: Section504Referral
    side_effects:
      - "Student.section_504_status: NONE -> REFERRED (ERR_INVALID_STATE if student not in NONE)"
      - "review_deadline = submitted_at + 15 days"
      - "submitted_by_staff_id = StaffMember.id matching X-User-ID"
      - "Emit ComplianceAuditEvent(REFERRAL_SUBMITTED)"

  - method: GET
    path: "/referrals"
    description: "List referrals (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: ["student_id?", "referral_status?", "limit?", "offset?"]
    output: "Section504Referral[]"
    side_effects: []

  - method: GET
    path: "/referrals/{referralId}"
    description: "Get referral detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: []
    output: Section504Referral
    side_effects: []

  - method: POST
    path: "/referrals/{referralId}/start-review"
    description: "Begin coordinator review"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Section504Referral
    side_effects: ["Referral PENDING -> UNDER_REVIEW"]

  - method: POST
    path: "/referrals/{referralId}/initiate-evaluation"
    description: "Initiate eligibility evaluation from an UNDER_REVIEW referral"
    roles: [Section504Coordinator]
    code: 201
    input: ["supersedes_evaluation_id?"]
    output: EligibilityEvaluation
    side_effects:
      - "Referral UNDER_REVIEW -> EVALUATION_INITIATED"
      - "Create EligibilityEvaluation(status=INITIATED)"
      - "Student.section_504_status: REFERRED -> EVALUATING"

  - method: POST
    path: "/referrals/{referralId}/reject"
    description: "Reject a referral (no evaluation)"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Section504Referral
    side_effects: ["Referral UNDER_REVIEW -> REJECTED; Student.section_504_status: REFERRED -> NONE"]

  - method: POST
    path: "/referrals/{referralId}/withdraw"
    description: "Withdraw a referral"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Section504Referral
    side_effects: ["Referral PENDING/UNDER_REVIEW -> WITHDRAWN; Student.section_504_status: REFERRED -> NONE"]

  # --- Eligibility Evaluations ---
  - method: GET
    path: "/evaluations"
    description: "List evaluations (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: ["student_id?", "referral_id?", "supersedes_evaluation_id?", "evaluation_status?", "limit?", "offset?"]
    output: "EligibilityEvaluation[]"
    side_effects: []

  - method: GET
    path: "/evaluations/{evaluationId}"
    description: "Get evaluation detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: []
    output: EligibilityEvaluation
    side_effects: []

  - method: POST
    path: "/evaluations/{evaluationId}/request-consent"
    description: "Request parent consent for evaluation"
    roles: [Section504Coordinator]
    code: 201
    input: []
    output: ParentConsentRecord
    side_effects:
      - "Evaluation INITIATED -> CONSENT_PENDING"
      - "Create ParentConsentRecord(scope = RE_EVALUATION if supersedes_evaluation_id else INITIAL_PLAN, evaluation_id = this)"

  - method: POST
    path: "/evaluations/{evaluationId}/record-consent"
    description: "Record parent response to evaluation consent request"
    roles: [Section504Coordinator]
    code: 200
    input: [granted, responded_by_parent_ref]
    output: EligibilityEvaluation
    side_effects:
      - "If granted=true: evaluation CONSENT_PENDING -> CONSENT_RECEIVED"
      - "If granted=false: evaluation CONSENT_PENDING -> CANCELLED; Student.section_504_status -> NONE"

  - method: POST
    path: "/evaluations/{evaluationId}/start"
    description: "Begin evaluation (after consent)"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: EligibilityEvaluation
    side_effects:
      - "Evaluation CONSENT_RECEIVED -> EVALUATION_IN_PROGRESS"
      - "evaluation_started_at = clock.now()"
      - "determination_deadline = evaluation_started_at + 60 days"

  - method: POST
    path: "/evaluations/{evaluationId}/determine"
    description: "Record eligibility determination"
    roles: [Section504Coordinator]
    code: 200
    input: [determination_outcome, disability_impairment_found, major_life_activity_affected]
    output: EligibilityEvaluation
    side_effects:
      - "Evaluation EVALUATION_IN_PROGRESS -> DETERMINATION_MADE"
      - "Segregation check: determiner != referral.submitted_by_staff_id"
      - "Timeliness check: late NOT_ELIGIBLE rejected (ERR_DETERMINATION_DEADLINE_MISSED); late ELIGIBLE allowed with audit"
      - "If NOT_ELIGIBLE: Student.section_504_status -> NOT_ELIGIBLE"
      - "Emit ComplianceAuditEvent(DETERMINATION_MADE)"

  # --- Plans ---
  - method: POST
    path: "/plans"
    description: "Draft a new 504 plan (OCC-guarded)"
    roles: [Section504Coordinator]
    code: 201
    input: [student_id, evaluation_id, expected_student_version]
    output: Section504Plan
    side_effects:
      - "Plan status = DRAFT"
      - "drafted_by_staff_id = StaffMember.id matching X-User-ID"
      - "Increments Student.version by 1 (OCC parent)"

  - method: GET
    path: "/plans"
    description: "List plans (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: ["student_id?", "evaluation_id?", "plan_status?", "limit?", "offset?"]
    output: "Section504Plan[]"
    side_effects: []

  - method: GET
    path: "/plans/{planId}"
    description: "Get plan detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: []
    output: Section504Plan
    side_effects: []

  - method: GET
    path: "/plans/{planId}/compliance-summary"
    description: "Computed read — cumulative implementation compliance snapshot"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: []
    output: "{ implementation_compliance_pct_trailing_30: number, implementation_compliance_pct_cumulative: number, next_annual_review_due: string, next_re_evaluation_due: string }"
    side_effects: []

  - method: POST
    path: "/plans/{planId}/submit-for-consent"
    description: "Submit plan for parent consent (OCC-guarded)"
    roles: [Section504Coordinator]
    code: 200
    input: [expected_plan_version]
    output: Section504Plan
    side_effects:
      - "Plan DRAFT -> PENDING_PARENT_CONSENT"
      - "Create ParentConsentRecord(scope=INITIAL_PLAN, plan_id=this)"
      - "Increments Section504Plan.version by 1"

  - method: POST
    path: "/plans/{planId}/record-parent-consent"
    description: "Record parent response to plan consent request"
    roles: [Section504Coordinator]
    code: 200
    input: [granted, responded_by_parent_ref]
    output: Section504Plan
    side_effects:
      - "If granted=true: Plan PENDING_PARENT_CONSENT -> PENDING_TEACHER_ACK; create TeacherAcknowledgment rows for all active teachers at the school"
      - "If granted=false: Plan reverts PENDING_PARENT_CONSENT -> DRAFT"

  - method: POST
    path: "/plans/{planId}/suspend"
    description: "Suspend an active plan"
    roles: [Section504Coordinator]
    code: 200
    input: [justification]
    output: Section504Plan
    side_effects:
      - "Plan ACTIVE -> SUSPENDED"
      - "Student.section_504_status: PLAN_ACTIVE -> PLAN_SUSPENDED"
      - "Emit ComplianceAuditEvent(PLAN_SUSPENDED)"

  - method: POST
    path: "/plans/{planId}/reinstate"
    description: "Reinstate a suspended plan"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Section504Plan
    side_effects:
      - "Plan SUSPENDED -> ACTIVE"
      - "Student.section_504_status: PLAN_SUSPENDED -> PLAN_ACTIVE"

  # --- Accommodations ---
  - method: POST
    path: "/accommodations"
    description: "Add an accommodation to a plan"
    roles: [Section504Coordinator]
    code: 201
    input: [plan_id, accommodation_type, description, "applies_to_testing?"]
    output: Accommodation
    side_effects:
      - "Accommodation status = DRAFT (auto-flips to ACTIVE when plan activates)"
      - "Increments Section504Plan.version by 1"

  - method: GET
    path: "/accommodations"
    description: "List accommodations (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: ["plan_id?", "accommodation_status?", "accommodation_type?", "limit?", "offset?"]
    output: "Accommodation[]"
    side_effects: []

  - method: GET
    path: "/accommodations/{accommodationId}"
    description: "Get accommodation detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: []
    output: Accommodation
    side_effects: []

  - method: POST
    path: "/accommodations/{accommodationId}/suspend"
    description: "Suspend an accommodation"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Accommodation
    side_effects: []

  - method: POST
    path: "/accommodations/{accommodationId}/resume"
    description: "Resume a suspended accommodation"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Accommodation
    side_effects: []

  - method: POST
    path: "/accommodations/{accommodationId}/discontinue"
    description: "Discontinue an accommodation (cascades deny pending testing requests)"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Accommodation
    side_effects:
      - "Auto-DENY any TestingAccommodationRequest referencing this accommodation in SUBMITTED or PENDING_DISTRICT_REVIEW"

  # --- Teacher Acknowledgments ---
  - method: POST
    path: "/teacher-acks"
    description: "Add a replacement ack row (used when a teacher DECLINED)"
    roles: [Section504Coordinator]
    code: 201
    input: [plan_id, staff_id]
    output: TeacherAcknowledgment
    side_effects: ["New ack row created (status=PENDING)"]

  - method: GET
    path: "/teacher-acks"
    description: "List ack rows (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: ["plan_id?", "staff_id?", "ack_status?", "limit?", "offset?"]
    output: "TeacherAcknowledgment[]"
    side_effects: []

  - method: GET
    path: "/teacher-acks/{ackId}"
    description: "Get ack detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: []
    output: TeacherAcknowledgment
    side_effects: []

  - method: POST
    path: "/teacher-acks/{ackId}/acknowledge"
    description: "Teacher acknowledges plan"
    roles: [Teacher]
    code: 200
    input: []
    output: TeacherAcknowledgment
    side_effects:
      - "Ack PENDING -> ACKNOWLEDGED"
      - "If no PENDING or DECLINED acks remain AND plan is PENDING_TEACHER_ACK: plan auto-transitions to ACTIVE; accommodations DRAFT -> ACTIVE; student status -> PLAN_ACTIVE; effective date and review dues anchored"
      - "Increments Section504Plan.version by 1"

  - method: POST
    path: "/teacher-acks/{ackId}/decline"
    description: "Teacher declines acknowledgment"
    roles: [Teacher]
    code: 200
    input: []
    output: TeacherAcknowledgment
    side_effects:
      - "Ack PENDING -> DECLINED"
      - "Plan blocked from activating until coordinator adds a replacement TeacherAcknowledgment row"

  # --- Implementation Logs ---
  - method: POST
    path: "/implementation-logs"
    description: "Log an implementation observation"
    roles: [Teacher, Section504Coordinator]
    code: 201
    input: [plan_id, accommodation_id, log_date, was_implemented_as_planned, "deviation_notes?"]
    output: ImplementationLog
    side_effects:
      - "Recompute plan.implementation_compliance_pct (trailing_30_day variant updates eagerly)"
      - "If was_implemented_as_planned=false AND deviation_notes missing: ERR_DEVIATION_NOTES_REQUIRED"

  - method: GET
    path: "/implementation-logs"
    description: "List implementation logs (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: ["plan_id?", "accommodation_id?", "was_implemented_as_planned?", "limit?", "offset?"]
    output: "ImplementationLog[]"
    side_effects: []

  - method: GET
    path: "/implementation-logs/{logId}"
    description: "Get log detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher]
    code: 200
    input: []
    output: ImplementationLog
    side_effects: []

  # --- Review Events ---
  - method: POST
    path: "/reviews"
    description: "Schedule a review (ANNUAL | RE_EVALUATION | PARENT_REQUESTED | DISTRICT_AUDIT)"
    roles: [Section504Coordinator, District504Director]
    code: 201
    input: [plan_id, review_type, scheduled_for]
    output: ReviewEvent
    side_effects:
      - "Plan ACTIVE -> UNDER_ANNUAL_REVIEW"
      - "ReviewEvent status = SCHEDULED"

  - method: GET
    path: "/reviews"
    description: "List reviews (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: ["plan_id?", "review_status?", "review_type?", "limit?", "offset?"]
    output: "ReviewEvent[]"
    side_effects: []

  - method: GET
    path: "/reviews/{reviewId}"
    description: "Get review detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: []
    output: ReviewEvent
    side_effects: []

  - method: POST
    path: "/reviews/{reviewId}/start"
    description: "Start a scheduled review"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: ReviewEvent
    side_effects: ["Review SCHEDULED/OVERDUE -> IN_PROGRESS"]

  - method: POST
    path: "/reviews/{reviewId}/complete"
    description: "Complete a review with an outcome"
    roles: [Section504Coordinator]
    code: 200
    input: [outcome]
    output: ReviewEvent
    side_effects:
      - "Review IN_PROGRESS -> COMPLETED; completed_at = clock.now(); was_late recomputed"
      - "Outcome-specific plan cascades (CONTINUE_PLAN, MODIFY_PLAN, EXIT_TO_IEP, TERMINATE_504) per §1.2"

  - method: POST
    path: "/reviews/{reviewId}/cancel"
    description: "Cancel a scheduled review (compensates plan back to ACTIVE)"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: ReviewEvent
    side_effects:
      - "Review SCHEDULED -> CANCELLED"
      - "Plan reverts UNDER_ANNUAL_REVIEW -> ACTIVE (compensation)"

  # --- Testing Accommodation Requests ---
  - method: POST
    path: "/testing-requests"
    description: "Submit a testing accommodation request"
    roles: [Section504Coordinator, Teacher]
    code: 201
    input: [plan_id, accommodation_id, test_name, test_date]
    output: TestingAccommodationRequest
    side_effects:
      - "Request status = SUBMITTED"
      - "review_deadline = submitted_at + 7 days"

  - method: GET
    path: "/testing-requests"
    description: "List testing requests (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: ["plan_id?", "accommodation_id?", "request_status?", "limit?", "offset?"]
    output: "TestingAccommodationRequest[]"
    side_effects: []

  - method: GET
    path: "/testing-requests/{requestId}"
    description: "Get testing request detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Teacher, Parent]
    code: 200
    input: []
    output: TestingAccommodationRequest
    side_effects: []

  - method: POST
    path: "/testing-requests/{requestId}/forward-to-district"
    description: "Forward request to district for review"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: TestingAccommodationRequest
    side_effects: ["Request SUBMITTED -> PENDING_DISTRICT_REVIEW; lead time check (>=14 days)"]

  - method: POST
    path: "/testing-requests/{requestId}/approve"
    description: "District approves testing accommodation"
    roles: [District504Director]
    code: 200
    input: []
    output: TestingAccommodationRequest
    side_effects:
      - "Request PENDING_DISTRICT_REVIEW -> APPROVED"
      - "Segregation check: reviewer != plan.drafted_by_staff_id"

  - method: POST
    path: "/testing-requests/{requestId}/deny"
    description: "District denies testing accommodation"
    roles: [District504Director]
    code: 200
    input: []
    output: TestingAccommodationRequest
    side_effects:
      - "Request PENDING_DISTRICT_REVIEW -> DENIED"
      - "Emit ComplianceAuditEvent(TEST_ACCOMM_DENIED)"

  - method: POST
    path: "/testing-requests/{requestId}/flag"
    description: "Flag an approved request for state audit"
    roles: [District504Director]
    code: 200
    input: []
    output: TestingAccommodationRequest
    side_effects: ["Request APPROVED -> FLAGGED_FOR_STATE_AUDIT"]

  # --- Parent Consent Records ---
  - method: POST
    path: "/consent-records"
    description: "Request parent consent for an out-of-band scope (PLAN_AMENDMENT, EXIT_TO_IEP, TESTING_ACCOMMODATION). INITIAL_PLAN and RE_EVALUATION are auto-created by their workflows; this endpoint is for ad-hoc scopes."
    roles: [Section504Coordinator]
    code: 201
    input: [student_id, consent_scope, "plan_id?", "evaluation_id?"]
    output: ParentConsentRecord
    side_effects:
      - "Creates ParentConsentRecord with status=REQUESTED"
      - "Exactly one of plan_id or evaluation_id must be set (ERR_INVALID_REQUEST otherwise)"

  - method: GET
    path: "/consent-records"
    description: "List parent consent records (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Parent]
    code: 200
    input: ["student_id?", "evaluation_id?", "plan_id?", "consent_scope?", "consent_status?", "limit?", "offset?"]
    output: "ParentConsentRecord[]"
    side_effects: []

  - method: GET
    path: "/consent-records/{consentId}"
    description: "Get a single consent record"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Parent]
    code: 200
    input: []
    output: ParentConsentRecord
    side_effects: []

  - method: POST
    path: "/consent-records/{consentId}/record-response"
    description: "Record parent response to a consent request"
    roles: [Section504Coordinator]
    code: 200
    input: [granted, responded_by_parent_ref]
    output: ParentConsentRecord
    side_effects:
      - "If granted=true: consent_status -> GRANTED; responded_at = clock.now()"
      - "If granted=false: consent_status -> DENIED; responded_at = clock.now()"

  # --- Grievances ---
  - method: POST
    path: "/grievances"
    description: "File a grievance"
    roles: [Parent, Section504Coordinator]
    code: 201
    input: [student_id, "plan_id?", grievance_category, description, filed_by_parent_ref]
    output: Grievance
    side_effects:
      - "Grievance status = FILED"
      - "Emit ComplianceAuditEvent(GRIEVANCE_FILED)"
      - "Recompute school.school_posture (open grievances count)"

  - method: GET
    path: "/grievances"
    description: "List grievances (filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Parent]
    code: 200
    input: ["student_id?", "plan_id?", "grievance_status?", "limit?", "offset?"]
    output: "Grievance[]"
    side_effects: []

  - method: GET
    path: "/grievances/{grievanceId}"
    description: "Get grievance detail"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal, Parent]
    code: 200
    input: []
    output: Grievance
    side_effects: []

  - method: POST
    path: "/grievances/{grievanceId}/begin-informal"
    description: "Begin informal resolution"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "Grievance FILED -> INFORMAL_RESOLUTION"
      - "intake_staff_id = actor's StaffMember.id"
      - "resolution_deadline = filed_at + 30 days"

  - method: POST
    path: "/grievances/{grievanceId}/escalate-to-formal"
    description: "Escalate to formal investigation"
    roles: [Section504Coordinator]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "Grievance INFORMAL_RESOLUTION -> FORMAL_INVESTIGATION"
      - "resolution_deadline = clock.now() + 60 days"

  - method: POST
    path: "/grievances/{grievanceId}/resolve"
    description: "Resolve a grievance (district level; OCC-guarded)"
    roles: [District504Director]
    code: 200
    input: [expected_grievance_version]
    output: Grievance
    side_effects:
      - "Grievance INFORMAL_RESOLUTION/FORMAL_INVESTIGATION -> RESOLVED"
      - "Segregation check: resolved_by != intake_staff_id"
      - "Increments Grievance.version by 1"

  - method: POST
    path: "/grievances/{grievanceId}/escalate-to-ocr"
    description: "Escalate grievance to OCR (forces school AUDIT_HOLD)"
    roles: [District504Director]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "Grievance FORMAL_INVESTIGATION -> ESCALATED_TO_OCR"
      - "Emit ComplianceAuditEvent(GRIEVANCE_ESCALATED)"
      - "Recompute school.school_posture (OCR -> AUDIT_HOLD)"

  - method: POST
    path: "/grievances/{grievanceId}/close"
    description: "Close an OCR-escalated grievance"
    roles: [District504Director]
    code: 200
    input: []
    output: Grievance
    side_effects:
      - "Grievance ESCALATED_TO_OCR -> CLOSED"
      - "Recompute school.school_posture"

  # --- Compliance Audit Events ---
  - method: GET
    path: "/audit-events"
    description: "List compliance audit events (append-only log; filterable)"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal]
    code: 200
    input: ["school_id?", "event_type?", "entity_ref?", "limit?", "offset?"]
    output: "ComplianceAuditEvent[]"
    side_effects: []

  - method: GET
    path: "/audit-events/{eventId}"
    description: "Get a single audit event by id"
    roles: [District504Director, Section504Coordinator, SchoolPrincipal]
    code: 200
    input: []
    output: ComplianceAuditEvent
    side_effects: []

  # --- Test-driving endpoint (/_<name>) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default before any call: 2026-08-01T00:00:00Z. All server-stamped fields and time-derived calculations read this clock."
    roles: [District504Director]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects:
      - "After clock advance, run scheduled side effects: flip SCHEDULED reviews past grace window to OVERDUE; expire TRAINED_CURRENT training statuses past expires_at; recompute school postures; emit TRAINING_LAPSED / POSTURE_CHANGED events as applicable"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this operation" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "School not found" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student not found" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "StaffMember not found" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral not found" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "Evaluation not found" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Plan not found" }
  - { id: ERR_ACCOMMODATION_NOT_FOUND, http: 404, condition: "Accommodation not found" }
  - { id: ERR_ACK_NOT_FOUND, http: 404, condition: "TeacherAcknowledgment not found" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "ReviewEvent not found" }
  - { id: ERR_TESTING_REQUEST_NOT_FOUND, http: 404, condition: "TestingAccommodationRequest not found" }
  - { id: ERR_GRIEVANCE_NOT_FOUND, http: 404, condition: "Grievance not found" }
  - { id: ERR_TRAINING_RECORD_NOT_FOUND, http: 404, condition: "StaffTrainingRecord not found" }
  - { id: ERR_CONSENT_RECORD_NOT_FOUND, http: 404, condition: "ParentConsentRecord not found" }

  # --- Generic input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request, missing required field, type mismatch, invalid enum" }
  - { id: ERR_DEVIATION_NOTES_REQUIRED, http: 400, condition: "deviation_notes required when was_implemented_as_planned=false" }

  # --- State (posture) ---
  - { id: ERR_SCHOOL_UNDER_AUDIT_HOLD, http: 409, condition: "School posture is AUDIT_HOLD; mutations blocked" }
  - { id: ERR_STUDENT_NOT_IN_REFERRED_STATE, http: 409, condition: "Student.section_504_status must be REFERRED for this action" }

  # --- State (per-entity) ---
  - { id: ERR_REFERRAL_NOT_PENDING, http: 409, condition: "Referral must be PENDING" }
  - { id: ERR_REFERRAL_NOT_UNDER_REVIEW, http: 409, condition: "Referral must be UNDER_REVIEW" }
  - { id: ERR_REFERRAL_NOT_WITHDRAWABLE, http: 409, condition: "Referral must be PENDING or UNDER_REVIEW to withdraw" }
  - { id: ERR_EVALUATION_ALREADY_OPEN, http: 409, condition: "Another EligibilityEvaluation is open for this student" }
  - { id: ERR_EVALUATION_NOT_INITIATED, http: 409, condition: "Evaluation must be INITIATED" }
  - { id: ERR_EVALUATION_NOT_AWAITING_CONSENT, http: 409, condition: "Evaluation must be CONSENT_PENDING" }
  - { id: ERR_EVALUATION_NOT_READY_TO_START, http: 409, condition: "Evaluation must be CONSENT_RECEIVED" }
  - { id: ERR_EVALUATION_NOT_IN_PROGRESS, http: 409, condition: "Evaluation must be EVALUATION_IN_PROGRESS" }
  - { id: ERR_PRIOR_EVALUATION_OPEN, http: 409, condition: "Superseded evaluation must be in DETERMINATION_MADE before re-evaluation can determine" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Plan must be DRAFT" }
  - { id: ERR_PLAN_NOT_AWAITING_CONSENT, http: 409, condition: "Plan must be PENDING_PARENT_CONSENT" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Plan must be ACTIVE" }
  - { id: ERR_PLAN_NOT_UNDER_REVIEW, http: 409, condition: "Plan must be UNDER_ANNUAL_REVIEW" }
  - { id: ERR_PLAN_NOT_SUSPENDED, http: 409, condition: "Plan must be SUSPENDED" }
  - { id: ERR_STUDENT_PLAN_ALREADY_OPEN, http: 409, condition: "Student already has an open plan" }
  - { id: ERR_PLAN_HAS_NO_ACCOMMODATIONS, http: 422, condition: "Plan must have at least 1 accommodation" }
  - { id: ERR_PLAN_REQUIRES_ELIGIBLE_DETERMINATION, http: 409, condition: "Linked evaluation must be ELIGIBLE" }
  - { id: ERR_ACCOMMODATION_NOT_ACTIVE, http: 422, condition: "Accommodation must be ACTIVE" }
  - { id: ERR_ACCOMMODATION_NOT_SUSPENDED, http: 409, condition: "Accommodation must be SUSPENDED" }
  - { id: ERR_ACCOMMODATION_NOT_DISCONTINUABLE, http: 409, condition: "Accommodation must be ACTIVE or SUSPENDED to discontinue" }
  - { id: ERR_ACCOMMODATION_NOT_TEST_APPLICABLE, http: 422, condition: "Accommodation.applies_to_testing must be true" }
  - { id: ERR_ACK_NOT_PENDING, http: 409, condition: "Ack must be PENDING" }
  - { id: ERR_ACK_OWNERSHIP_MISMATCH, http: 403, condition: "Only the named teacher may acknowledge this row" }
  - { id: ERR_REVIEW_ALREADY_SCHEDULED, http: 409, condition: "Plan already has an open ReviewEvent" }
  - { id: ERR_REVIEW_NOT_SCHEDULED, http: 409, condition: "Review must be SCHEDULED (or OVERDUE for start)" }
  - { id: ERR_REVIEW_NOT_IN_PROGRESS, http: 409, condition: "Review must be IN_PROGRESS" }
  - { id: ERR_TESTING_REQUEST_NOT_SUBMITTED, http: 409, condition: "Testing request must be SUBMITTED" }
  - { id: ERR_TESTING_REQUEST_NOT_PENDING, http: 409, condition: "Testing request must be PENDING_DISTRICT_REVIEW" }
  - { id: ERR_TESTING_REQUEST_NOT_APPROVED, http: 409, condition: "Testing request must be APPROVED" }
  - { id: ERR_GRIEVANCE_NOT_FILED, http: 409, condition: "Grievance must be FILED" }
  - { id: ERR_GRIEVANCE_NOT_INFORMAL, http: 409, condition: "Grievance must be INFORMAL_RESOLUTION" }
  - { id: ERR_GRIEVANCE_NOT_FORMAL, http: 409, condition: "Grievance must be FORMAL_INVESTIGATION" }
  - { id: ERR_GRIEVANCE_NOT_ESCALATED, http: 409, condition: "Grievance must be ESCALATED_TO_OCR" }

  # --- Business safety / compliance ---
  - { id: ERR_PARENT_CONSENT_REQUIRED, http: 422, condition: "Parent consent record must be GRANTED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same actor cannot perform both sides of a segregation-of-duties pair" }
  - { id: ERR_STAFF_TRAINING_NOT_CURRENT, http: 422, condition: "Acknowledging teacher must have current 504 training" }
  - { id: ERR_IEP_NOT_ACTIVE, http: 422, condition: "Student.iep_status must be IEP_ACTIVE for EXIT_TO_IEP outcome" }
  - { id: ERR_NO_SUSPENSION_JUSTIFICATION, http: 422, condition: "Plan suspension requires implementation_compliance_pct < 60 OR school in AUDIT_HOLD" }

  # --- Temporal ---
  - { id: ERR_TESTING_LEAD_TIME_INSUFFICIENT, http: 422, condition: "test_date must be at least 14 days after submission" }
  - { id: ERR_DETERMINATION_DEADLINE_MISSED, http: 422, condition: "NOT_ELIGIBLE determination after 60-day window forbidden" }

  # --- OCC ---
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version does not match current plan version" }
  - { id: ERR_STALE_STUDENT_VERSION, http: 412, condition: "expected_student_version does not match current student version" }
  - { id: ERR_STALE_GRIEVANCE_VERSION, http: 412, condition: "expected_grievance_version does not match current grievance version" }

  # --- Generic invalid state fallback ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state for transitions without a more specific error" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: District504Director
    description: "District-level 504 director. Owns schools, district-level testing decisions, grievance resolution, OCR escalation. Cannot draft school-level plans or submit referrals."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /schools"
      - "PATCH /students/{studentId} (iep_status updates)"
      - "POST /testing-requests/{requestId}/approve"
      - "POST /testing-requests/{requestId}/deny"
      - "POST /testing-requests/{requestId}/flag"
      - "POST /grievances/{grievanceId}/resolve"
      - "POST /grievances/{grievanceId}/escalate-to-ocr"
      - "POST /grievances/{grievanceId}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all resources)"
      - "POST /staff-members (shared with SchoolPrincipal)"
      - "POST /training-records (shared with SchoolPrincipal, Section504Coordinator)"
      - "POST /reviews (shared with Section504Coordinator)"

  - name: Section504Coordinator
    description: "School-level 504 coordinator. Owns referrals review, evaluations, plan drafting, reviews, accommodation management, grievance intake. Cannot approve own drafted plans' testing requests (segregation)."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /referrals/{referralId}/start-review, /initiate-evaluation, /reject, /withdraw"
      - "POST /evaluations/{evaluationId}/request-consent, /record-consent, /start, /determine"
      - "POST /plans (draft)"
      - "POST /plans/{planId}/submit-for-consent, /record-parent-consent, /suspend, /reinstate"
      - "POST /accommodations, /accommodations/{id}/suspend, /resume, /discontinue"
      - "POST /teacher-acks (replacement row)"
      - "POST /reviews/{reviewId}/start, /complete, /cancel"
      - "POST /testing-requests/{requestId}/forward-to-district"
      - "POST /grievances/{grievanceId}/begin-informal, /escalate-to-formal"
    shared_operations:
      - "GET (all resources)"
      - "POST /referrals (shared with Teacher)"
      - "POST /implementation-logs (shared with Teacher)"
      - "POST /testing-requests (shared with Teacher)"
      - "POST /grievances (shared with Parent)"
      - "POST /students (shared with SchoolPrincipal)"

  - name: Teacher
    description: "School teacher. Submits referrals, acknowledges plans, logs implementation, submits testing requests."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /teacher-acks/{ackId}/acknowledge"
      - "POST /teacher-acks/{ackId}/decline"
    shared_operations:
      - "GET (own school's resources)"
      - "POST /referrals (shared with Section504Coordinator)"
      - "POST /implementation-logs (shared with Section504Coordinator)"
      - "POST /testing-requests (shared with Section504Coordinator)"

  - name: SchoolPrincipal
    description: "School principal. Read access to all school data; can register staff and record training; cannot perform 504 workflow operations."
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "GET (all resources)"
      - "POST /staff-members (shared with District504Director)"
      - "POST /training-records (shared with District504Director, Section504Coordinator)"
      - "POST /students (shared with Section504Coordinator)"

  - name: Parent
    description: "Student's parent/guardian. Files grievances; reads own student's plan status. Cannot mutate workflow."
    identity: "opaque"
    exclusive_operations:
      - "POST /grievances (file)"
    shared_operations:
      - "GET (own student's records — plan, reviews, consent-records, grievances)"

