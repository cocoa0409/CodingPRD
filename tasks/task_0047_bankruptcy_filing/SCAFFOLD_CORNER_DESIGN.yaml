          assert:
            - "POST /cases/${case_id}/petition .status == 403"
            - "POST /cases/${case_id}/petition .data.error_id == ERR_UNAUTHORIZED"

      - name: debtor_cannot_confirm_plan_segregation_of_duties
        claim_type: Segregation of duties
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Debtor calling POST /plans/{id}/confirm-plan (a Trustee-exclusive op) returns ERR_UNAUTHORIZED (403); the filer cannot also adjudicate."
        test_recipe:
          setup: ["A Chapter 13 case with a FILED plan; the debtor attempts to confirm its own plan."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Seg Debtor", email: "seg@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
