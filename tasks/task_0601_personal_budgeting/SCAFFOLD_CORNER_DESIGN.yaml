# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims) — task_0601
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_household_returns_201_with_owner
        claim_type: Creation
        grounds: [entities.Household, endpoints]
        distinguishing_aspect: "POST /households with name/owner_email/owner_display_name returns 201, posture=HEALTHY, net_worth_cents=0, and a non-null owner_member_id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
          assert:
            - "Household.${hh_id}.posture == HEALTHY"
            - "Household.${hh_id}.net_worth_cents == 0"
            - "Household.${hh_id}.version == 1"
            - "owner_member_id is non-null"

      - name: get_household_not_found
        claim_type: Not Found
        grounds:
          - entities.Household
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /households/{random-uuid} for a non-existent household returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /households/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: create_household_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Household
          - "validations[priority=15]"
        distinguishing_aspect: "POST /households omitting owner_email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { name: "Acme", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: household_base_currency_default_applied
        claim_type: Defaults
        grounds: [entities.Household.fields.base_currency]
        distinguishing_aspect: "POST /households omitting base_currency yields base_currency == USD (the declared default)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id }
          assert:
            - "Household.${hh_id}.base_currency == USD"

      - name: account_balance_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Account.fields.cleared_balance_cents, calculations.net_worth_rollup]
        distinguishing_aspect: "Account.cleared_balance_cents is computed: with opening 10000 and no posted txns it equals 10000 regardless of any client attempt to set it."
        test_recipe:
          setup: ["Household with one DEPOSITORY account opening 10000, no transactions"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
          trigger:
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
          assert:
            - "Account.${acc_id}.cleared_balance_cents == 10000"
            - "Account.${acc_id}.available_balance_cents == 10000"
            - "Account.${acc_id}.status == LINKED"

      - name: invalid_account_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Account.fields.account_type
          - "validations[priority=15]"
        distinguishing_aspect: "POST account with account_type=BROKERAGE (not in DEPOSITORY|CREDIT|LOAN|INVESTMENT) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Household exists"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
          trigger:
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "BROKERAGE" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: goal_contribution_immutable_no_version
        claim_type: Immutability
        grounds: [entities.GoalContribution]
        distinguishing_aspect: "GoalContribution has common_fields:false — its read shape carries id and created_at but no version field (append-only event)."
        test_recipe:
          setup: ["Household, period, category Save allocated 5000, goal target 20000, one 2000 contribution"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Save", allocated_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/goals"
              payload: { name: "Trip", target_cents: 20000, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { goal_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/goals/${goal_id}/contribute"
              payload: { amount_cents: 2000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { gc_id: $.data.id }
          assert:
            - "GoalContribution.${gc_id}.amount_cents == 2000"
            - "GoalContribution.${gc_id}.reversed == false"
            - "response has no version field"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: post_already_posted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Transaction.PENDING_to_POSTED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Posting a transaction already in POSTED state returns ERR_INVALID_STATE (409); no envelope/balance side effects fire."
        test_recipe:
          setup: ["Household; DEPOSITORY account; one PENDING txn posted once already"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -1000, merchant_name: "Store" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: recategorize_removed_txn_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Transaction.PENDING_to_REMOVED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Recategorizing a REMOVED (terminal) transaction returns ERR_INVALID_STATE (409); REMOVED admits no further transitions."
        test_recipe:
          setup: ["Household OPEN period, category Food; DEPOSITORY account; one PENDING txn then removed"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Food", allocated_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -1000, merchant_name: "Store" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/remove"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/recategorize"
              payload: { budget_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: new_transaction_starts_pending
        claim_type: Initial State
        grounds: [state_machines.Transaction, entities.Transaction.fields.status]
        distinguishing_aspect: "A newly ingested transaction starts in PENDING (the declared initial_state)."
        test_recipe:
          setup: ["Household; DEPOSITORY account"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -1000, merchant_name: "Store" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
          assert:
            - "Transaction.${txn_id}.status == PENDING"

      - name: resume_scheduled_bill_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RecurringBill.PAUSED_to_SCHEDULED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling resume on a bill already SCHEDULED returns ERR_INVALID_STATE (409) — resume is only defined from PAUSED."
        test_recipe:
          setup: ["Household OPEN period, category, one SCHEDULED bill (never paused)"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Bills", allocated_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/recurring-bills"
              payload: { payee: "Rent", amount_cents: 5000, day_of_month: 1, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /households/${hh_id}/recurring-bills/${bill_id}/resume"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: period_close_rolls_leftover_envelope
        claim_type: Side Effect Execution
        grounds: [state_machines.BudgetPeriod.OPEN_to_CLOSED, entities.BudgetCategory.fields.rollover_in_cents]
        distinguishing_aspect: "Closing a zero-based period carries a rollover-enabled category's positive available (3000) into a same-named category in the new period as rollover_in_cents=3000."
        test_recipe:
          setup: ["Household period 2026-01 income 5000; category Food allocated 5000 spent 2000 (available 3000, rollover_enabled true)"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${p1_id}/categories"
              payload: { name: "Food", allocated_cents: 5000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 50000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -2000, merchant_name: "Mart", budget_category_id: "${cat_id}" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
            - call: "GET /households/${hh_id}"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { hv: $.data.version }
          trigger:
            - call: "POST /households/${hh_id}/budget-periods/${p1_id}/close"
              payload: { expected_household_version: "${hv}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "GET /households/budget-periods"
              payload: { household_id: "${hh_id}", status: "OPEN" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { new_period_id: "$.data[0].id" }
          assert:
            - "BudgetPeriod.${p1_id}.status == CLOSED"
            - "the new OPEN period's Food category has rollover_in_cents == 3000"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: auto_categorize_priority_then_created_at
        claim_type: Correct Result
        grounds: [calculations.auto_categorize, entities.CategoryRule.fields.priority]
        distinguishing_aspect: "Two enabled rules match merchant 'WHOLE FOODS': priority 1 (created later) wins over priority 2 (created earlier); the posted txn lands in the priority-1 rule's category."
        test_recipe:
          setup: ["Household OPEN period; categories Groceries and Misc; rule prio2->Misc created first, rule prio1->Groceries created second; both match 'foods'"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 20000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Misc", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { misc_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Groceries", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { groc_id: $.data.id }
            - call: "POST /households/${hh_id}/category-rules"
              payload: { match_substring: "foods", budget_category_id: "${misc_id}", priority: 2 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /households/${hh_id}/category-rules"
              payload: { match_substring: "foods", budget_category_id: "${groc_id}", priority: 1 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 50000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -3000, merchant_name: "WHOLE FOODS" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
              captures: { assigned_cat: $.data.budget_category_id }
          assert:
            - "Transaction.${txn_id}.budget_category_id == ${groc_id}"
            - "BudgetCategory.${groc_id}.spent_cents == 3000"
            - "BudgetCategory.${misc_id}.spent_cents == 0"

      - name: auto_categorize_no_match_leaves_uncategorized
        claim_type: Input Set Filtering
        grounds: [calculations.auto_categorize, entities.Transaction.fields.budget_category_id]
        distinguishing_aspect: "When no enabled rule's substring matches the merchant, the posted transaction stays uncategorized (budget_category_id null) with no envelope impact."
        test_recipe:
          setup: ["Household OPEN period; one rule matching 'amazon'; a posted txn at merchant 'GROCER'"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Online", allocated_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/category-rules"
              payload: { match_substring: "amazon", budget_category_id: "${cat_id}", priority: 1 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 50000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/transactions"
              payload: { amount_cents: -3000, merchant_name: "GROCER" }
              as: PlatformAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_id}/transactions/${txn_id}/post"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Transaction.${txn_id}.budget_category_id is null"
            - "BudgetCategory.${cat_id}.spent_cents == 0"

      - name: cash_flow_no_shortfall_within_horizon
        claim_type: Correct Result
        grounds: [calculations.cash_flow_forecast]
        distinguishing_aspect: "Clock 2026-02-01, cash 10000, one SCHEDULED bill 3000 on day 10: min_projected_balance_cents == 7000 and shortfall == false over a 30-day horizon."
        test_recipe:
          setup: ["Clock 2026-02-01; DEPOSITORY cleared 10000; one SCHEDULED bill 3000 day 10"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-02", income_expected_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { period_id: $.data.id }
            - call: "POST /households/${hh_id}/budget-periods/${period_id}/categories"
              payload: { name: "Bills", allocated_cents: 0 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
              captures: { cat_id: $.data.id }
            - call: "POST /households/${hh_id}/accounts"
              payload: { institution_name: "Bank", account_type: "DEPOSITORY", opening_balance_cents: 10000 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
            - call: "POST /households/${hh_id}/recurring-bills"
              payload: { payee: "Net", amount_cents: 3000, day_of_month: 10, funding_category_id: "${cat_id}" }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "GET /households/${hh_id}/cash-flow-forecast"
              payload: { horizon_days: 30 }
              as: HouseholdOwner
              as_user_id: "${owner_id}"
          assert:
            - "cash-flow-forecast.min_projected_balance_cents == 7000"
            - "cash-flow-forecast.shortfall == false"

      - name: paused_bill_excluded_from_forecast
        claim_type: Input Set Filtering
        grounds: [calculations.cash_flow_forecast, state_machines.RecurringBill.SCHEDULED_to_PAUSED]
        distinguishing_aspect: "A PAUSED bill of 9000 is excluded from the forecast: min_projected_balance_cents stays at the starting cash 10000 with shortfall false."
        test_recipe:
          setup: ["Clock 2026-02-01; DEPOSITORY cleared 10000; one bill 9000 day 5 then PAUSED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-02", income_expected_cents: 0 }
              as: HouseholdOwner
