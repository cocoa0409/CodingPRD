# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2461 — Challenge Course & Outdoor Education Facilitation
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. Deleting this file leaves
# the declared behaviour identical; it only makes coverage harder to audit.
# All numeric asserts were computed by executing the §1.3 formulas as code.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: element_retirement_forecast_switches_to_usage_basis
        grounds:
          - calculations.element_retirement_forecast
          - entities.Element.fields.retirement_basis
          - entities.Element.fields.calendar_life_forecast_date
          - entities.Element.fields.usage_life_forecast_date
        distinguishing_aspect: |
          Asset-life domain on Element: the CALENDAR variant returns 2036-08-10
          and the USAGE variant returns 2027-08-10 for the identical element row,
          and the scaffold pins min() so retirement_basis is USAGE — a nine-year
          divergence driven purely by cumulative_cycle_count.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10; one course; one HIGH_ELEMENT installed exactly 730 days earlier with 14600 seeded cycles (20.0 cycles/day, 7300 of its 21900-cycle design limit remaining)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Pamper Pole", element_type: "HIGH_ELEMENT", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 27.0, max_participant_weight_kg: 113.0, initial_cycle_count: 14600 }
              as: ProgramDirector
              captures: { h_id: $.data.id }
          assert:
            - "Element.${h_id}.cycle_life_limit == 21900"
            - "Element.${h_id}.design_life_years == 12"
            - "Element.${h_id}.calendar_life_forecast_date == 2036-08-10"
            - "Element.${h_id}.usage_life_forecast_date == 2027-08-10"
            - "Element.${h_id}.retirement_forecast_date == 2027-08-10"
            - "Element.${h_id}.retirement_basis == USAGE"
            - "Element.${h_id}.required_belay_set_count == 2"
            - "Element.${h_id}.belay_ready == false"

      - name: cancellation_settlement_weather_variant_diverges_from_client_variant
        grounds:
          - calculations.booking_cancellation_settlement
          - state_machines.Booking.WEATHER_HOLD_to_CANCELLED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.cancellation_variant
        distinguishing_aspect: |
          Money domain on Booking/GroupClient: two bookings holding an identical
          341-cent deposit, cancelled on the identical day (10 days notice),
          settle to 341 cents retained under OPERATOR_WEATHER_INITIATED (flat
          admin fee, capped at the deposit) versus 171 cents under
          CLIENT_INITIATED (50% notice tier) — a 170-cent divergence from the
          variant selector alone.
        test_recipe:
          setup:
            - "Two confirmed bookings (A and B) for the same PARTNER client on the same course, each priced from an identical two-block program with one adult participant, each holding a 341-cent deposit."
            - "Clock moved to 2026-09-05 (10 days before the 2026-09-15 program date); booking A's icebreaker block is IN_PROGRESS when a 6.5 km lightning strike closes the course, driving A to WEATHER_HOLD while B stays CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Dana Reyes", staff_type: "SAFETY_OFFICER", certification_level: "LEVEL_3", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { so_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${so_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${so_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Kim Alvarez", staff_type: "STAFF_FACILITATOR", certification_level: "LEVEL_2", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { f1_id: $.data.id }
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "RESCUE_DRILL", completed_on: "2026-07-15" }
              as: ProgramDirector
            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f1_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/group-clients/${gc_id}/payments"
              payload: { amount_cents: 20000, reference: "CHK-8801" }
              as: ProgramDirector
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 1 }
              as: ProgramDirector
              captures: { ba_id: $.data.id, ba_v0: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${ba_id}", expected_booking_version: "${ba_v0}", full_name: "Alex Stone", birth_date: "1990-04-12", weight_kg: 78.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /challenge-course/participants/${pa_id}/screening-packet"
              payload: { agreement_signed: true, guardian_signature_provided: false, health_flags: ["NONE"] }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${ba_id}", sequence_index: 1, phase: "ICEBREAKER", planned_start_at: "2026-09-15T09:00:00Z", planned_end_at: "2026-09-15T09:45:00Z" }
              as: ProgramDirector
              captures: { ba_b1_id: $.data.id }
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${ba_id}", sequence_index: 2, phase: "DEBRIEF", planned_start_at: "2026-09-15T09:45:00Z", planned_end_at: "2026-09-15T10:15:00Z" }
              as: ProgramDirector
            - call: "GET /challenge-course/bookings/${ba_id}"
              payload: {}
              as: ProgramDirector
              captures: { ba_v1: $.data.version }
            - call: "POST /challenge-course/bookings/${ba_id}/quote"
              payload: { expected_booking_version: "${ba_v1}" }
              as: ProgramDirector
            - call: "POST /challenge-course/bookings/${ba_id}/confirm"
              payload: {}
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 1 }
              as: ProgramDirector
              captures: { bb_id: $.data.id, bb_v0: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${bb_id}", expected_booking_version: "${bb_v0}", full_name: "Robin Vale", birth_date: "1988-11-30", weight_kg: 71.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /challenge-course/participants/${pb_id}/screening-packet"
              payload: { agreement_signed: true, guardian_signature_provided: false, health_flags: ["NONE"] }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${bb_id}", sequence_index: 1, phase: "ICEBREAKER", planned_start_at: "2026-09-15T11:00:00Z", planned_end_at: "2026-09-15T11:45:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${bb_id}", sequence_index: 2, phase: "DEBRIEF", planned_start_at: "2026-09-15T11:45:00Z", planned_end_at: "2026-09-15T12:15:00Z" }
              as: ProgramDirector
            - call: "GET /challenge-course/bookings/${bb_id}"
              payload: {}
              as: ProgramDirector
              captures: { bb_v1: $.data.version }
            - call: "POST /challenge-course/bookings/${bb_id}/quote"
              payload: { expected_booking_version: "${bb_v1}" }
              as: ProgramDirector
            - call: "POST /challenge-course/bookings/${bb_id}/confirm"
              payload: {}
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T07:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/program-blocks/${ba_b1_id}/block-assignments"
