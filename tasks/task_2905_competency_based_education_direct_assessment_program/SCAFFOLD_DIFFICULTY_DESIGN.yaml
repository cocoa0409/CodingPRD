  - rule_id: non_linear_state_machine
    instances:
      - name: student_parallel_enrollment_and_sap_axes
        grounds:
          - state_machines.Student.enrollment_status
          - state_machines.Student.sap_status
          - calculations.sap_pace_and_outcome
          - entities.SapReview.fields.pace_band
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Non-linearity by PARALLEL STATE DIMENSIONS on Student: enrollment_status
          and sap_status are two independent axes on one row. Suspension moves the
          enrollment axis to SUSPENDED while sap_status stays GOOD_STANDING; a SAP
          review at 0.00 pace then drives the sap axis to its terminal DISMISSED
          while enrollment stays SUSPENDED; reinstatement moves enrollment back to
          ACTIVE and leaves sap_status DISMISSED. Every combined state
          (SUSPENDED,GOOD_STANDING) -> (SUSPENDED,DISMISSED) -> (ACTIVE,DISMISSED)
          is observed, which no single-axis machine can produce.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with the default sap_min_units_per_term 12 and one ACTIVE competency so the program is publishable"
            - "ACTIVE student with an ACTIVE term covering 2026-09-01 to 2026-12-01 and nothing mastered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /students/${stu_id}/suspend"
              payload: { reason: "Cadence non-response" }
              as: Registrar
              captures: { enr_after_suspend: $.data.enrollment_status, sap_after_suspend: $.data.sap_status }
            - call: "POST /sap-reviews"
              payload: { student_id: "${stu_id}", term_id: "${term_id}" }
              as: Registrar
              captures: { rev_id: $.data.id, pace: $.data.pace_pct, band: $.data.pace_band, prev: $.data.previous_sap_status, next: $.data.new_sap_status }
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { enr_mid: $.data.enrollment_status, sap_mid: $.data.sap_status }
            - call: "POST /students/${stu_id}/reinstate"
              payload: {}
              as: Registrar
              captures: { enr_final: $.data.enrollment_status, sap_final: $.data.sap_status }
          assert:
            - "${enr_after_suspend} == SUSPENDED"
            - "${sap_after_suspend} == GOOD_STANDING"
            - "SapReview.${rev_id}.terms_counted == 1"
            - "SapReview.${rev_id}.expected_units == 12"
            - "${pace} == 0.00"
            - "${band} == FAIL"
            - "${prev} == GOOD_STANDING"
            - "${next} == DISMISSED"
            - "${enr_mid} == SUSPENDED"
            - "${sap_mid} == DISMISSED"
            - "${enr_final} == ACTIVE"
            - "${sap_final} == DISMISSED"
            - "the two axes moved independently: enrollment SUSPENDED -> ACTIVE while sap stayed DISMISSED"

      - name: attempt_revision_cycle_and_adjudication_branch
        grounds:
          - state_machines.AssessmentAttempt.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.AssessmentAttempt.REVISION_REQUESTED_to_DRAFT
          - state_machines.AssessmentAttempt.UNDER_REVIEW_to_ADJUDICATION
          - entities.AssessmentAttempt.fields.revision_count
          - entities.EvaluatorScore.fields.voided_reason
        distinguishing_aspect: |
          Non-linearity by CYCLE plus FORK on AssessmentAttempt (a different entity
          from the parallel-axis instance): UNDER_REVIEW -> REVISION_REQUESTED ->
          DRAFT -> UNDER_REVIEW is a genuine loop that increments revision_count and
          resets scores_received_count to 0, and the second lap forks away from the
          scoring path into ADJUDICATION because the two readers diverge by 12.00 >
          irr_tolerance_pct 5.00, leaving final_score_pct null with two SUBMITTED
          scores on file. The loop is observable only through revision_count, which
          a linear machine has no field for.
