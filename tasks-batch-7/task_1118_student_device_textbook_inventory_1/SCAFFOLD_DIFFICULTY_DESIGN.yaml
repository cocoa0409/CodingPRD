              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_AGREEMENT_NOT_SIGNED"
            - "Assignment NOT created"

      - name: write_off_gated_by_audit_sweep_unaccounted_flag
        grounds:
          - state_machines.AssetUnit.END_OF_LIFE_to_WRITTEN_OFF
          - state_machines.AuditSweep
          - calculations.audit_unaccounted_count
        distinguishing_aspect: |
          Pair: AssetUnit ↔ AuditSweep. AssetUnit.write-off precondition is
          that the unit was flagged UNACCOUNTED in a CLOSED AuditSweep.
          Without a closed sweep marking the unit unaccounted, retire→
          write-off fails ERR_NOT_UNACCOUNTED. Different entity pair from
          instance 1.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet+asset ready, asset grade=F, useful_life exhausted (force via clock)"
            - "AssetUnit retired to END_OF_LIFE"
            - "NO audit sweep was ever run, so the unit is NOT flagged UNACCOUNTED"
