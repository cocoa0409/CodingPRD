          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request without X-User-Role fails at priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — before role, existence, or state checks, so even a valid id cannot rescue it."
        test_recipe:
          setup: ["One territory created; clock 2026-09-01."]
          setup_api_calls:
