              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /policy-rules"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "GET /sellers/${s_id}/metric-snapshots"
              payload: {}
