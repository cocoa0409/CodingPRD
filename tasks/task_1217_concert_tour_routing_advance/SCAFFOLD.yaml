  - method: GET
    path: "/tours/budget-lines"
    description: "Flat search: budget lines by show_id"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["show_id?", "limit?", "offset?"]
    output: "BudgetLine[]"
