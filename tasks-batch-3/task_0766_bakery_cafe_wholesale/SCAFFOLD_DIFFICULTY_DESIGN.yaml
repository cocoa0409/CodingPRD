        distinguishing_aspect: "Reserving exactly available_qty (5) leaves available_qty==0 (zero boundary); the next unit (qty 1 against available 0) is rejected ERR_INSUFFICIENT_PAR — an empty-pool/zero-count boundary on the create-order endpoint, a different metric than the markdown hours threshold."
        test_recipe:
