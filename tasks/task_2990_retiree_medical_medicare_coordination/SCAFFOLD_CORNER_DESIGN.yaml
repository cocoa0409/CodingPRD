      - name: error_envelope_carries_meta_and_response_type_on_invalid_request
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_RETIREE_NOT_FOUND
          - validations[priority=12]
        distinguishing_aspect: |
          Rejections use the same envelope as successes: meta.api_request_id and
          meta.api_request_timestamp are still present, response_type is the
          literal string error rather than object, and data carries exactly
          error_id and message with no entity fields leaking in. Two different
          failure classes - a 400 shape failure and a 404 existence failure -
          must produce structurally identical envelopes, and two successive
          requests must carry different api_request_id values.
        test_recipe:
          setup:
            - "An empty store; no rows of any entity."
          setup_api_calls: []
          trigger:
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "No Dates Given" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { e_shape: $.data.error_id, m_shape: $.data.message }
            - call: "GET /retiree-benefits/retirees/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { e_missing: $.data.error_id, m_missing: $.data.message }
          assert:
            - "SHAPE FAILURE: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "EXISTENCE FAILURE: HTTP 404 with data.error_id == ERR_RETIREE_NOT_FOUND"
            - "Both responses set response_type == error, never object or array"
            - "Both responses expose meta.api_request_id as a non-empty string and meta.api_request_timestamp as an ISO-8601 instant"
            - "Both responses expose data.message as a non-empty string"
            - "Neither response body contains data.id, data.version, data.created_at or any other entity field"
            - "The two responses carry different meta.api_request_id values"
            - "No Retiree row was created by the rejected POST"

  - section: endpoints
    instances:
      - name: retiree_patch_updates_only_named_mutable_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /retiree-benefits/retirees/{retiree_id}]
          - entities.Retiree.fields.eligibility_points
          - entities.Retiree.fields.grandfathered_group
          - calculations.retiree_grandfather_group_assignment
        distinguishing_aspect: |
          PATCH is partial and narrow. Omitted keys leave their columns alone,
          hire_date and grandfathered_group are not in the input list at all and
          stay frozen, and eligibility_points is NOT recomputed by PATCH even
          when credited_service_months changes - only a new determination
          rewrites it. Each accepted PATCH still increments version, so a
          two-step edit ends at version 4 rather than 3.
        test_recipe:
          setup:
            - "PlanYear 2027 OPEN."
            - "R1 Rosa Alvarez created with credited_service_months 150 and all Medicare attributes defaulted, so grandfathered_group GRANDFATHERED_A and version 1."
            - "One CERTIFIED determination for (R1, 2027) which set Retiree.eligibility_points to 75 and left the retiree at version 2."
            - "No Enrollment rows exist, so the MSP re-run has an empty input set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/retirees"
              payload: { full_name: "Rosa Alvarez", birth_date: "1963-06-01", hire_date: "1990-06-01", retirement_date: "2026-12-31", credited_service_months: 150 }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /retiree-benefits/eligibility-determinations"
              payload: { retiree_id: "${r1_id}", plan_year_id: "${py_id}", expected_retiree_version: "${r1_v}" }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { det1_id: $.data.id }
            - call: "POST /retiree-benefits/eligibility-determinations/${det1_id}/certify"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-02"
          trigger:
            - call: "PATCH /retiree-benefits/retirees/${r1_id}"
              payload: { medicare_status: "MEDICARE_ELIGIBLE_NOT_ENROLLED" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { v_after_first: $.data.version }
            - call: "PATCH /retiree-benefits/retirees/${r1_id}"
              payload: { credited_service_months: 143, other_group_coverage_employer_size: 250, active_employment_flag: true }
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { v_after_second: $.data.version }
            - call: "GET /retiree-benefits/retirees/${r1_id}"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { v_final: $.data.version }
          assert:
            - "PRECONDITION: after setup the retiree has version 2, eligibility_points 75 and grandfathered_group GRANDFATHERED_A"
            - "FIRST PATCH: HTTP 200 with data.medicare_status == MEDICARE_ELIGIBLE_NOT_ENROLLED and data.version == 3"
            - "FIRST PATCH: data.credited_service_months is still 150, data.other_group_coverage_employer_size is still 0 and data.active_employment_flag is still false"
            - "SECOND PATCH: HTTP 200 with data.credited_service_months == 143, data.other_group_coverage_employer_size == 250, data.active_employment_flag == true and data.version == 4"
            - "SECOND PATCH: data.medicare_status is still MEDICARE_ELIGIBLE_NOT_ENROLLED, carried over from the first PATCH"
            - "SECOND PATCH: data.eligibility_points is still 75, NOT recomputed to 74 from the new service months"
            - "SECOND PATCH: data.grandfathered_group is still GRANDFATHERED_A and data.hire_date is still 1990-06-01"
            - "SECOND PATCH: data.eligibility_status is still ELIGIBLE and data.determination_sequence is still 1"
            - "FOLLOW-UP GET: every field equals the second PATCH response, including version 4"
            - "EligibilityDetermination.${det1_id}.points is still 75 and its status is still CERTIFIED"

      - name: clock_endpoint_moves_logical_time_for_subsequent_writes
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.PlanYear.fields.created_at
        distinguishing_aspect: |
          The clock endpoint is the only source of "now" in the system: it
          echoes the instant it was given, and every later write stamps
          created_at and updated_at from that logical instant rather than from
          wall-clock time. Setting the clock twice and creating one row after
          each proves the second row is stamped later, and that moving the clock
          does not retro-stamp the first row.
        test_recipe:
          setup:
            - "An empty store."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { t1: $.data.current_utc }
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py27_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-09T12:34:56Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { t2: $.data.current_utc }
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2028, open_enrollment_start: "2027-10-15T00:00:00Z", open_enrollment_end: "2027-11-15T00:00:00Z", coverage_start: "2028-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py28_id: $.data.id }
            - call: "GET /retiree-benefits/plan-years/${py27_id}"
              payload: {}
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py27_created: $.data.created_at }
          assert:
            - "FIRST CLOCK CALL: HTTP 200 with data.current_utc == 2026-10-20T00:00:00.000Z"
            - "SECOND CLOCK CALL: HTTP 200 with data.current_utc == 2027-03-09T12:34:56.000Z"
            - "PlanYear 2027: created_at == 2026-10-20T00:00:00.000Z and updated_at == 2026-10-20T00:00:00.000Z"
            - "PlanYear 2028: created_at == 2027-03-09T12:34:56.000Z"
            - "RE-READ OF PLANYEAR 2027 AFTER THE CLOCK MOVED: created_at is still 2026-10-20T00:00:00.000Z, not retro-stamped to the new instant"
            - "PlanYear 2027 created_at is strictly earlier than PlanYear 2028 created_at"

      - name: daily_run_on_quiet_system_returns_all_zero_counts
        claim_type: Bulk action
        grounds:
          - endpoints[POST /_ops/daily-run]
          - calculations.delinquency_progression
        distinguishing_aspect: |
          The batch endpoint must be safe to call when there is nothing to do:
          with no Enrollment, PremiumInvoice or pending plan change in the store
          it returns all six counters at zero rather than erroring or omitting
          keys, and calling it twice at the same instant is a no-op the second
          time as well. This separates "counter present and zero" from "counter
          missing", which a naive implementation conflates.
        test_recipe:
          setup:
            - "PlanYear 2027 OPEN and one ACTIVE PlanOption, but no Retiree, ElectionEvent, Enrollment or PremiumInvoice rows."
            - "Logical clock at 2027-02-01T00:00:00Z, well past the plan year's coverage_start."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
