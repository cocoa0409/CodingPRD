# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0542
# 9 rules x 2 instances = 18 instances. Every grounds ref resolves into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: petition_fee_provisional_vs_final
        grounds:
          - calculations.petition_filing_fee
          - state_machines.Petition.SCREENED_to_FILED
          - entities.Petition.fields.provisional_fee_cents
          - entities.Petition.fields.final_fee_cents
        distinguishing_aspect: |
          Provisional fee sums ALL three records (incl. the ineligible FELONY_CLASS_B) =
          27682 cents; final fee sums only the two ELIGIBLE records = 14244 cents — same
          records, different state-filtered input set, on the Petition domain.
        test_recipe:
          setup:
            - "Clock at 2026-05-01. Petitioner with 3 records: R1 MISDEMEANOR/CONVICTED (eligible), R2 FELONY_CLASS_B/DISMISSED (ineligible, waiting period to 2028), R3 INFRACTION/ARREST_ONLY (eligible). All screened; petition assembled and SCREENED; provisional fee 27682 paid."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Jane Roe", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 8000000, household_size: 2 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r1: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-2", offense_class: "FELONY_CLASS_B", disposition: "DISMISSED", disposition_date: "2023-01-01T00:00:00Z" }, as: Clerk, captures: { r2: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-3", offense_class: "INFRACTION", disposition: "ARREST_ONLY", disposition_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r3: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r1}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/criminal-records/${r2}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/criminal-records/${r3}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r1}", "${r2}", "${r3}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 27682 }, as: Clerk }
          trigger:
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk, captures: { prov: "$.data.provisional_fee_cents", fin: "$.data.final_fee_cents" } }
          assert:
            - "Petition.${pet}.provisional_fee_cents == 27682"
            - "Petition.${pet}.final_fee_cents == 14244"

      - name: record_eligibility_sentence_vs_disposition
        grounds:
          - calculations.record_eligibility
          - entities.CriminalRecord.fields.eligible_on
          - state_machines.CriminalRecord.UNSCREENED_to_ELIGIBLE
        distinguishing_aspect: |
          For a CONVICTED record the 2-year MISDEMEANOR waiting period is measured from
          sentence_completion_date (2024-05-01 -> eligible_on 2026-05-01), NOT from
          disposition_date (which would give 2025-01-01) — a CriminalRecord-domain variant.
        test_recipe:
          setup:
            - "Clock at 2026-05-01. One CONVICTED MISDEMEANOR record with disposition_date 2023-01-01 and sentence_completion_date 2024-05-01."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Amy Poe", date_of_birth: "1988-03-03T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-9", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2023-01-01T00:00:00Z", sentence_completion_date: "2024-05-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk, captures: { st: "$.data.status", eo: "$.data.eligible_on" } }
          assert:
            - "CriminalRecord.${r}.eligible_on == 2026-05-01T00:00:00.000Z"
            - "CriminalRecord.${r}.status == ELIGIBLE"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_waiver_income_threshold_branches
        grounds:
          - calculations.fee_waiver_determination
          - entities.FeeWaiver.fields.determination_basis
          - entities.FeeWaiver.fields.income_threshold_cents
        distinguishing_aspect: |
          Mode (a) multi-input non-linear: poverty_line(household_size=3)=2560000, *1.25 =
          threshold 3200000; income 3000000 <= threshold AND assets 150000 <= 200000 cap ->
          INCOME_UNDER_125. Three inputs combine via a conditional threshold.
        test_recipe:
          setup:
            - "Petitioner household_size 3, income 3000000 cents, liquid assets 150000 cents. A DRAFT petition exists to attach the waiver to."
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Lee Fox", date_of_birth: "1985-05-05T00:00:00Z", annual_income_cents: 3000000, household_size: 3, monthly_liquid_assets_cents: 150000 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/fee-waivers", payload: { petitioner_id: "${p}", petition_id: "${pet}" }, as: Clerk, captures: { fw: "$.data.id", basis: "$.data.determination_basis", thr: "$.data.income_threshold_cents" } }
          assert:
            - "FeeWaiver.${fw}.income_threshold_cents == 3200000"
            - "FeeWaiver.${fw}.determination_basis == INCOME_UNDER_125"

      - name: filing_fee_round_per_record_then_sum
        grounds:
          - calculations.petition_filing_fee
          - entities.PetitionItem.fields.fee_at_screening_cents
          - entities.Petition.fields.provisional_fee_cents
        distinguishing_aspect: |
          Mode (b) rounding order: three INFRACTION/ARREST_ONLY records each raw 1343.75 cents;
          round-per-record-then-sum = 1344*3 = 4032, whereas sum-then-round = round(4031.25) =
          4031. Scaffold pins per-record rounding, so provisional_fee_cents == 4032.
        test_recipe:
          setup:
            - "Clock at 2026-05-01. Three INFRACTION/ARREST_ONLY records (disposition 2020-01-01, eligible). Petition assembled and SCREENED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Sam Kip", date_of_birth: "1991-02-02T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-A", offense_class: "INFRACTION", disposition: "ARREST_ONLY", disposition_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r1: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-B", offense_class: "INFRACTION", disposition: "ARREST_ONLY", disposition_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r2: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-C", offense_class: "INFRACTION", disposition: "ARREST_ONLY", disposition_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r3: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r1}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/criminal-records/${r2}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/criminal-records/${r3}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r1}", "${r2}", "${r3}"] }, as: Clerk, captures: { pet: "$.data.id" } }
          trigger:
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk, captures: { prov: "$.data.provisional_fee_cents" } }
          assert:
            - "Petition.${pet}.provisional_fee_cents == 4032"

  - rule_id: non_linear_state_machine
    instances:
      - name: petition_objection_review_revert_cycle
        grounds:
          - state_machines.Petition.FILED_to_OBJECTION_REVIEW
          - state_machines.Petition.OBJECTION_REVIEW_to_FILED
          - state_machines.Objection.REQUESTED_to_OVERRULED
        distinguishing_aspect: |
          Petition follows a revision LOOP FILED -> OBJECTION_REVIEW -> FILED: an objection sends
          it to OBJECTION_REVIEW, and OVERRULED returns it to FILED (not forward) — a cycle, not
          a linear pipeline.
        test_recipe:
          setup:
            - "FILED petition (MISDEMEANOR eligible, fee 12900 paid). One of its 3 notifications is SERVED (window open, deadline 2026-05-31)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Ida Vale", date_of_birth: "1980-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
          trigger:
            - { call: "POST /expungement/agency-notifications/${n0}/objections", payload: { grounds: "related open matter" }, as: Agency, captures: { obj: "$.data.id" } }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { st1: "$.data.status" } }
            - { call: "POST /expungement/objections/${obj}/transition", payload: { to_status: "OVERRULED" }, as: Clerk }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { st2: "$.data.status" } }
          assert:
            - "Petition.${pet}.status == OBJECTION_REVIEW immediately after the objection is filed (st1)"
            - "Petition.${pet}.status == FILED after the objection is OVERRULED (st2) — loop back, not forward"
            - "AgencyNotification.${n0}.status == CLEARED after OVERRULED"

      - name: sealing_distribution_failed_retry_cycle
        grounds:
          - state_machines.SealingDistribution.SENT_to_FAILED
          - state_machines.SealingDistribution.FAILED_to_QUEUED
          - entities.SealingDistribution.fields.attempt_count
        distinguishing_aspect: |
          A distribution cycles QUEUED -> SENT -> FAILED -> QUEUED, re-entering QUEUED with
          attempt_count incremented to 1 — a genuine retry cycle on a different entity than the
          Petition loop.
        test_recipe:
          setup:
            - "A GRANTED court order exists (petition granted, record sealed) producing 3 QUEUED agency distributions."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/courtrooms", payload: { name: "Room 1", jurisdiction_code: "CA-01" }, as: Clerk, captures: { cr: "$.data.id" } }
            - { call: "POST /expungement/judges", payload: { name: "Judge A", jurisdiction_code: "CA-01" }, as: Clerk, captures: { jg: "$.data.id" } }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Ken Ash", date_of_birth: "1979-07-07T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { pv: "$.data.version" } }
            - { call: "POST /expungement/petitions/${pet}/hearings", payload: { courtroom_id: "${cr}", judge_id: "${jg}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", expected_petition_version: "${pv}" }, as: Clerk, captures: { h: "$.data.id" } }
            - { call: "POST /expungement/hearings/${h}/transition", payload: { to_status: "HELD" }, as: Clerk }
            - { call: "POST /expungement/hearings/${h}/order", payload: { disposition: "GRANTED" }, as: Judge, captures: { co: "$.data.id" } }
            - { call: "GET /expungement/sealing-distributions", payload: { court_order_id: "${co}" }, as: Clerk, captures: { d: "$.data[0].id" } }
          trigger:
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "SENT" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "FAILED" }, as: Clerk }
            - { call: "POST /expungement/sealing-distributions/${d}/transition", payload: { to_status: "QUEUED" }, as: Clerk, captures: { st: "$.data.status", ac: "$.data.attempt_count" } }
          assert:
            - "SealingDistribution.${d}.status == QUEUED"
            - "SealingDistribution.${d}.attempt_count == 1"

  - rule_id: transitive_cascade
    instances:
      - name: grant_order_seals_records_queues_distributions
        grounds:
          - state_machines.Petition.HEARING_SET_to_GRANTED
          - state_machines.CriminalRecord.ELIGIBLE_to_SEALED
          - entities.SealingDistribution.fields.status
        distinguishing_aspect: |
          Entering a GRANTED order drives petition -> GRANTED (hop 1); that itself seals the
          ELIGIBLE record -> SEALED (hop 2); that itself queues the SealingDistribution rows
          (hop 3). Each hop is caused by the previous — depth 3.
        test_recipe:
          setup:
            - "Petition at HEARING_SET with a HELD hearing (record eligible, notifications cleared)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/courtrooms", payload: { name: "Room 2", jurisdiction_code: "CA-01" }, as: Clerk, captures: { cr: "$.data.id" } }
            - { call: "POST /expungement/judges", payload: { name: "Judge B", jurisdiction_code: "CA-01" }, as: Clerk, captures: { jg: "$.data.id" } }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Ola May", date_of_birth: "1982-08-08T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
            - { call: "GET /expungement/agency-notifications", payload: { petition_id: "${pet}" }, as: Clerk, captures: { n0: "$.data[0].id", n1: "$.data[1].id", n2: "$.data[2].id" } }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "SERVED" }, as: Clerk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n0}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n1}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "POST /expungement/agency-notifications/${n2}/transition", payload: { to_status: "CLEARED" }, as: Clerk }
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { pv: "$.data.version" } }
            - { call: "POST /expungement/petitions/${pet}/hearings", payload: { courtroom_id: "${cr}", judge_id: "${jg}", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", expected_petition_version: "${pv}" }, as: Clerk, captures: { h: "$.data.id" } }
            - { call: "POST /expungement/hearings/${h}/transition", payload: { to_status: "HELD" }, as: Clerk }
          trigger:
            - { call: "POST /expungement/hearings/${h}/order", payload: { disposition: "GRANTED" }, as: Judge, captures: { co: "$.data.id" } }
            - { call: "GET /expungement/criminal-records/${r}", payload: {}, as: Clerk, captures: { rst: "$.data.status" } }
            - { call: "GET /expungement/sealing-distributions", payload: { court_order_id: "${co}" }, as: Clerk, captures: { tot: "$.data[0].status" } }
          assert:
            - "Petition.${pet}.status == GRANTED (hop 1)"
            - "CriminalRecord.${r}.status == SEALED (hop 2)"
            - "GET /expungement/sealing-distributions?court_order_id=${co} returns total_count == 3, every row status == QUEUED (hop 3)"

      - name: objection_filed_notification_petition_review
        grounds:
          - state_machines.AgencyNotification.SERVED_to_OBJECTED
          - state_machines.Petition.FILED_to_OBJECTION_REVIEW
        distinguishing_aspect: |
          Filing an objection flips the notification SERVED -> OBJECTED (hop 1); that notification
          change itself drives petition FILED -> OBJECTION_REVIEW (hop 2). Different trigger
          (objection filing) than the grant cascade, depth 2.
        test_recipe:
          setup:
            - "FILED petition with one SERVED notification (window open)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: Clerk }
            - { call: "POST /expungement/petitioners", payload: { full_name: "Ray Cox", date_of_birth: "1975-04-04T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/criminal-records/${r}/screen", payload: {}, as: Clerk }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "SCREENED" }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/pay-fee", payload: { amount_cents: 12900 }, as: Clerk }
            - { call: "POST /expungement/petitions/${pet}/transition", payload: { to_status: "FILED" }, as: Clerk }
