            - "FederalReportingPeriod.${period_id}.certified_by_user_id == \"an-2\" after the third trigger call"

      - name: hold_release_blocked_by_case_compliance_status_on_a_different_entity
        grounds:
          - validations[priority=26]
          - errors.ERR_ASSIGNMENT_NOT_ACTIVE
          - state_machines.SupportiveServiceAuthorization.status
          - state_machines.AssistanceCase.compliance_status
        distinguishing_aspect: |
          The authorization is in HELD, the legal predecessor of the release-hold
          transition, and its own WorkAssignment is ACTIVE; the release is blocked
          solely because AssistanceCase.compliance_status is CONCILIATION_PENDING.
          Granting good cause on the ComplianceEpisode moves the case to EXEMPT and
          the identical release-hold call then succeeds — a two-hop dependency
          through case and episode, not through the authorization.
