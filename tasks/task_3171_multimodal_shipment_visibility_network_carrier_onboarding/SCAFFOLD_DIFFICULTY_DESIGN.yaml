              payload: { shipment_id: "${pv_ship_id}", window_start: "2026-09-01T10:30:00Z", window_end: "2026-09-01T11:30:00Z", expected_facility_version: "${pv_fac_v2}" }
              as: CarrierRep
              as_user_id: "${pv_car_id}"
              captures: { pv_err: $.data.error_id }
          assert:
            - "response status 409 with error_id ERR_FACILITY_NOT_ACTIVE (state priority 6 beats business_temporal priority 7 despite the overlapping window)"
            - "no second appointment exists: GET /facilities/${pv_fac_id}/appointments returns exactly 1 row"

      - name: wrong_role_beats_alert_already_resolved
        grounds:
          - validations[priority=2]
          - validations[priority=6]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
          - errors.ERR_ALERT_INVALID_STATE
        distinguishing_aspect: |
          Error-category pair (auth, state): a CarrierRep (role lacks
          resolve permission) resolving an already-RESOLVED alert receives
          ERR_INSUFFICIENT_PERMISSIONS (priority 2), not
          ERR_ALERT_INVALID_STATE (priority 6) — role check precedes any
          state evaluation.
        test_recipe:
          setup:
            - "An alert that has already been acknowledged and resolved (resolution FALSE_ALARM)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
