        grounds:
          - calculations.penalty_recomputation_and_allocation
          - entities.PenaltyNotice.fields.a_month_penalty_cents
          - entities.PenaltyNotice.fields.b_month_penalty_cents
          - entities.GroupMember.fields.allocated_penalty_cents
          - validations[priority=31]
