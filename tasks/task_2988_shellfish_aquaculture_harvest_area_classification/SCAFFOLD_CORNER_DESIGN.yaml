      - name: interstate_shipment_without_a_current_listing_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=83]
          - errors[ERR_DEALER_NOT_LISTED_FOR_INTERSTATE]
          - entities.Shipment.fields.is_interstate
          - entities.Dealer.fields.icssl_listed_through
        distinguishing_aspect: |
          listing_status LISTED is not sufficient — the icssl_listed_through DATE must also cover the
          logical clock — so a dealer whose listing lapsed on 2026-07-31 is refused on a 2026-08-10
          interstate release with the interstate-specific code rather than ERR_DEALER_NOT_LISTED.
        test_recipe:
          setup:
            - "The standard active-authorization fixture, except the dealer's listing renewal set icssl_listed_through 2026-07-31 while certified_through stays 2027-06-30, so listing_status is LISTED but the interstate window has lapsed."
