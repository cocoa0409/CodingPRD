scenario: "632. Pet DNA & Health Screening (Embark/Wisdom Panel style): kit order & swab activation, sample receipt & genotyping pipeline, breed/ancestry & genetic-health/trait report, relative-finder & opt-in, vet-shareable report, subscription/upgrade, re-test/QNS, data download/delete"
domain_name: "pet-dna-health-screening"
api_prefix: "/dna"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (Account, Pet, Kit, Sample, Report, ...);
  # paths are flat collections with FK fields in bodies, not deep URL nesting.

  state_machine_shape: branching
  # Sample genotyping pipeline forks: PASS -> report path; QNS/FAIL -> re-test path.
  # Report has parallel-style preliminary/finalized progression; DataRequest branches
  # download vs delete with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # Account -> Pets, Account -> Kits, Sample -> GenotypingRuns
    - many_to_many       # RelativeMatch is a junction between two Pets
    - self_referential   # RelativeMatch references Pet twice (pet pair)
    - cross_aggregate    # Report references Sample which references Pet & Kit

  role_model: peer_roles
  # Account owns its pets/kits/reports; LabTechnician owns genotyping pipeline;
  # Veterinarian consumes shared reports; PlatformAdmin operates clock/catalog.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Login email, unique across accounts.
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: Account holder display name.
      - name: data_residency
        type: enum
        source: input
        description: Region governing data-export/delete rules.
        default: "US"
        constraints: "one of {US, EU}"
      - name: active_subscription_id
        type: string
        source: computed
        description: "Denormalized back-pointer holding the id of the account's current ACTIVE or GRACE Subscription, or null when no non-terminal subscription exists. Resolve via GET /dna/subscriptions?account_id=<id> (status IN {ACTIVE, GRACE})."
        default: null
      - name: relative_finder_opt_in
        type: boolean
        source: input
        description: Account-level master switch for the relative-finder network. Per-pet opt-in additionally required.
        default: false
      - name: pet_count
        type: integer
        source: computed
        description: Count of Pets whose account_id == this account and status != ARCHIVED.
        default: 0
      - name: purge_pending
        type: boolean
        source: computed
        description: True when a DELETE-type DataRequest for this account is in GRACE or PURGING state.
        default: false

  - name: Pet
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account."
      - name: name
        type: string
        source: input
        description: Pet name.
      - name: species
        type: enum
        source: input
        description: Animal species.
        constraints: "one of {DOG, CAT}"
      - name: birth_year
        type: integer
        source: input
        description: Birth year, used only for display.
      - name: relative_finder_opt_in
        type: boolean
        source: input
        description: Per-pet opt-in to appear in and query the relative-finder network.
        default: false
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state machine.
        default: "REGISTERED"
        constraints: "one of {REGISTERED, ARCHIVED}"
      - name: finalized_report_id
        type: string
        source: computed
        description: "Denormalized back-pointer holding the id of the pet's most recent FINALIZED Report (latest by report.created_at ASC, last wins), or null. Resolve via GET /dna/reports?pet_id=<id> (status == FINALIZED)."
        default: null

  - name: Kit
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account that ordered the kit."
      - name: barcode
        type: string
        source: system
        description: Server-minted unique kit barcode used for swab activation.
        constraints: "unique"
      - name: product_tier
        type: enum
        source: input
        description: Kit product; gates which report sections are produced.
        constraints: "one of {BREED, BREED_HEALTH}"
      - name: status
        type: enum
        source: system
        description: Kit lifecycle; see state machine.
        default: "ORDERED"
        constraints: "one of {ORDERED, ACTIVATED, RECEIVED, CONSUMED, VOIDED}"
      - name: activated_pet_id
        type: string
        source: computed
        description: "FK -> Pet.id; the pet this kit's swab was activated against, or null until activation."
        default: null

  - name: Sample
    parent: null
    common_fields: true
    fields:
      - name: kit_id
        type: string
        source: input
        description: "FK -> Kit.id; the activated kit this physical sample came from."
      - name: pet_id
        type: string
        source: computed
        description: "FK -> Pet.id; copied from the kit's activated_pet_id at sample receipt."
      - name: status
        type: enum
        source: system
        description: Genotyping pipeline state; see state machine.
        default: "RECEIVED"
        constraints: "one of {RECEIVED, GENOTYPING, PASS, QNS, FAILED, RETESTED}"
      - name: qc_score
        type: number
        source: computed
        description: Latest GenotypingRun qc_score copied onto the sample, or null. Two decimals.
        default: null
      - name: retest_of_sample_id
        type: string
        source: input
        description: "FK -> Sample.id; when this sample is a re-test, the prior QNS/FAILED sample it replaces; null otherwise."
        default: null

  - name: GenotypingRun
    parent: null
    common_fields: true
    fields:
      - name: sample_id
        type: string
        source: input
        description: "FK -> Sample.id; the sample this lab run processed."
      - name: call_rate
        type: number
        source: input
        description: Fraction of markers successfully called, 0..1.
        constraints: "0 <= call_rate <= 1"
      - name: het_rate
        type: number
        source: input
        description: Observed heterozygosity rate, 0..1.
        constraints: "0 <= het_rate <= 1"
      - name: contamination
        type: number
        source: input
        description: Estimated cross-sample contamination fraction, 0..1.
        constraints: "0 <= contamination <= 1"
      - name: qc_score
        type: number
        source: computed
        description: Weighted QC score 0..100, two decimals; see calculations.
        default: null
      - name: outcome
        type: enum
        source: computed
        description: Pipeline verdict derived from qc_score and call_rate gate.
        default: null
        constraints: "one of {PASS, QNS, FAILED}"

  - name: Report
    parent: null
    common_fields: true
    fields:
      - name: sample_id
        type: string
        source: input
        description: "FK -> Sample.id; the PASS sample this report is built from."
      - name: pet_id
        type: string
        source: computed
        description: "FK -> Pet.id; copied from the sample's pet_id."
      - name: includes_health
        type: boolean
        source: computed
        description: True when the originating kit product_tier == BREED_HEALTH.
        default: false
      - name: status
        type: enum
        source: system
        description: Report lifecycle; see state machine.
        default: "PRELIMINARY"
        constraints: "one of {PRELIMINARY, FINALIZED, REVOKED}"
      - name: breed_composition
        type: array
        source: computed
        description: Array of { breed, pct } objects summing to 100.00; see ancestry calculation.
        default: []
      - name: at_risk_marker_count
        type: integer
        source: computed
        description: Count of at-risk genetic-health markers included per report status; see health roll-up calculation.
        default: 0

  - name: HealthMarkerResult
    parent: null
    common_fields: false
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> Report.id; the report this marker result belongs to."
      - name: marker_code
        type: string
        source: input
        description: Catalog marker code (e.g., MDR1, DM_SOD1).
      - name: genotype
        type: enum
        source: input
        description: Called genotype class for this marker.
        constraints: "one of {CLEAR, CARRIER, AT_RISK}"
      - name: review_status
        type: enum
        source: system
        description: Clinical review state of the marker on the report.
        default: "PASS"
        constraints: "one of {PASS, REVIEWED}"

  - name: RelativeMatch
    parent: null
    common_fields: true
    fields:
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the querying pet (must be relative_finder opted-in)."
      - name: relative_pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the matched relative pet (must be relative_finder opted-in)."
      - name: shared_cm
        type: number
        source: input
        description: Shared autosomal centimorgans between the two pets' genotypes.
        constraints: "0 <= shared_cm <= 2500"
      - name: relationship_pct
        type: number
        source: computed
        description: Estimated or confirmed shared-DNA percentage; see kinship calculation. Two decimals.
        default: null
      - name: status
        type: enum
        source: system
        description: Match lifecycle; see state machine.
        default: "ESTIMATED"
        constraints: "one of {ESTIMATED, CONFIRMED, WITHDRAWN}"

  - name: ShareLink
    parent: null
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> Report.id; the report being shared with a vet."
      - name: vet_email
        type: string
        source: input
        description: Veterinarian email the link is issued to.
      - name: token
        type: string
        source: system
        description: Server-minted opaque share token used by the vet to fetch the report.
        constraints: "unique"
      - name: status
        type: enum
        source: system
        description: Share link lifecycle; see state machine.
        default: "ACTIVE"
        constraints: "one of {ACTIVE, REVOKED}"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; subscribing account."
      - name: tier
        type: enum
        source: input
        description: Subscription tier.
        constraints: "one of {BASIC, PREMIUM}"
      - name: status
        type: enum
        source: system
        description: Subscription lifecycle; see state machine.
        default: "ACTIVE"
        constraints: "one of {ACTIVE, GRACE, CANCELLED, SUPERSEDED}"
      - name: started_on
        type: datetime
        source: system
        description: UTC date the subscription term began (logical clock at creation).
      - name: term_days
        type: integer
        source: system
        description: Length of the paid term in days.
        default: 365
      - name: annual_fee_cents
        type: integer
        source: input
        description: Annual fee in cents for this tier.
        constraints: ">= 0"
      - name: last_charge_cents
        type: integer
        source: computed
        description: Cents charged on the most recent create/upgrade for this subscription.
        default: 0

  - name: DataRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the account requesting export or deletion."
      - name: kind
        type: enum
        source: input
        description: Whether this is a data export or a deletion request.
        constraints: "one of {DOWNLOAD, DELETE}"
      - name: status
        type: enum
        source: system
        description: Request lifecycle; see state machine.
        default: "PENDING"
        constraints: "one of {PENDING, READY, GRACE, PURGING, PURGED, CANCELLED}"
      - name: grace_until
        type: datetime
        source: computed
        description: For DELETE requests, the UTC instant after which purge may run; null for DOWNLOAD.
        default: null
      - name: export_payload
        type: object
        source: computed
        description: For DOWNLOAD requests, the assembled export bundle (pets, reports, matches); null otherwise.
        default: null

  - name: MarkerCatalogEntry
    parent: null
    common_fields: false
    fields:
      - name: marker_code
        type: string
        source: input
        description: Unique catalog code for a genetic-health/trait marker.
        constraints: "unique"
      - name: category
        type: enum
        source: input
        description: Whether the marker is a clinical health risk or a phenotypic trait.
        constraints: "one of {HEALTH, TRAIT}"
      - name: species
        type: enum
        source: input
        description: Species the marker applies to.
        constraints: "one of {DOG, CAT}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Pet
    initial_state: REGISTERED
    terminal_states: [ARCHIVED]
    transitions:
      - from: REGISTERED
        to: ARCHIVED
        trigger: "system: account purge-finalize (POST /dna/data-requests/{id}/purge-finalize)"
        actor: PlatformAdmin
        preconditions:
          - "pet.status == REGISTERED"
          - "owning account's DELETE DataRequest reached PURGING"
        side_effects:
          - "decrement Account.pet_count"
          - "increments Pet.version by 1"
        note: "Pets are only archived as a cascade of account deletion purge-finalize; no direct archive endpoint."

  - entity: Kit
    initial_state: ORDERED
    terminal_states: [CONSUMED, VOIDED]
    transitions:
      - from: ORDERED
        to: ACTIVATED
        trigger: "POST /dna/kits/{id}/activate"
        actor: Account
        preconditions:
          - "kit.status == ORDERED"
          - "target Pet exists and pet.account_id == kit.account_id"
          - "Pet.status == REGISTERED"
          - "account has no DataRequest in {GRACE, PURGING} (account.purge_pending == false)"
        side_effects:
          - "set kit.activated_pet_id = pet_id"
          - "increments Kit.version by 1"
      - from: ACTIVATED
        to: RECEIVED
        trigger: "POST /dna/samples (sample receipt against an activated kit)"
        actor: LabTechnician
        preconditions:
          - "kit.status == ACTIVATED"
        side_effects:
          - "create Sample with kit_id=kit.id, pet_id=kit.activated_pet_id, status=RECEIVED"
          - "increments Kit.version by 1"
      - from: RECEIVED
        to: CONSUMED
        trigger: "system: Sample reaches PASS"
        actor: system
        preconditions:
          - "kit.status == RECEIVED"
          - "the kit's Sample transitioned to PASS"
        side_effects:
          - "increments Kit.version by 1"
      - from: ORDERED
        to: VOIDED
        trigger: "POST /dna/kits/{id}/void"
        actor: Account
        preconditions:
          - "kit.status == ORDERED"
        side_effects:
          - "increments Kit.version by 1"
        note: "Only un-activated kits may be voided."

  - entity: Sample
    initial_state: RECEIVED
    terminal_states: [PASS, RETESTED]
    transitions:
      - from: RECEIVED
        to: GENOTYPING
        trigger: "POST /dna/samples/{id}/genotyping-runs (first run created)"
        actor: LabTechnician
        preconditions:
          - "sample.status == RECEIVED"
        side_effects:
          - "create GenotypingRun in PENDING-equivalent (run computes qc_score immediately)"
          - "increments Sample.version by 1"
      - from: GENOTYPING
        to: PASS
        trigger: "system: GenotypingRun.outcome == PASS"
        actor: system
        preconditions:
          - "sample.status == GENOTYPING"
          - "latest GenotypingRun.outcome == PASS"
        side_effects:
          - "copy run.qc_score onto sample.qc_score"
          - "transition owning Kit RECEIVED -> CONSUMED"
          - "create Report (status=PRELIMINARY) for this sample"
          - "increments Sample.version by 1"
        note: "Branch A of the genotyping fork: success path."
      - from: GENOTYPING
        to: QNS
        trigger: "system: GenotypingRun.outcome == QNS"
        actor: system
        preconditions:
          - "sample.status == GENOTYPING"
          - "latest GenotypingRun.outcome == QNS"
        side_effects:
          - "copy run.qc_score onto sample.qc_score"
          - "increments Sample.version by 1"
        note: "Branch B: quantity-not-sufficient; eligible for re-test."
      - from: GENOTYPING
        to: FAILED
        trigger: "system: GenotypingRun.outcome == FAILED"
        actor: system
        preconditions:
          - "sample.status == GENOTYPING"
          - "latest GenotypingRun.outcome == FAILED"
        side_effects:
          - "copy run.qc_score onto sample.qc_score"
          - "increments Sample.version by 1"
        note: "Branch C: hard failure (call-rate gate); eligible for re-test."
      - from: QNS
        to: RETESTED
        trigger: "POST /dna/samples (re-test sample referencing this sample via retest_of_sample_id)"
        actor: LabTechnician
        preconditions:
          - "sample.status == QNS"
          - "owning Kit.status == RECEIVED"
        side_effects:
          - "mark this sample RETESTED"
          - "create successor Sample status=RECEIVED on the same kit"
          - "increments Sample.version by 1"
      - from: FAILED
        to: RETESTED
        trigger: "POST /dna/samples (re-test sample referencing this sample via retest_of_sample_id)"
        actor: LabTechnician
        preconditions:
          - "sample.status == FAILED"
          - "owning Kit.status == RECEIVED"
        side_effects:
          - "mark this sample RETESTED"
          - "create successor Sample status=RECEIVED on the same kit"
          - "increments Sample.version by 1"

  - entity: Report
    initial_state: PRELIMINARY
    terminal_states: [REVOKED]
    transitions:
      - from: PRELIMINARY
        to: FINALIZED
        trigger: "POST /dna/reports/{id}/finalize"
        actor: LabTechnician
        preconditions:
          - "report.status == PRELIMINARY"
          - "report.sample_id sample.status == PASS"
          - "breed_composition computed and sums to 100.00"
        side_effects:
          - "recompute at_risk_marker_count including REVIEWED markers (final variant)"
          - "set Pet.finalized_report_id = report.id on the report's pet"
          - "increments Report.version by 1"
      - from: PRELIMINARY
        to: REVOKED
        trigger: "POST /dna/reports/{id}/revoke"
        actor: Account
        preconditions:
          - "report.status == PRELIMINARY"
        side_effects:
          - "cascade: revoke all ACTIVE ShareLink for this report (ShareLink ACTIVE -> REVOKED)"
          - "increments Report.version by 1"
      - from: FINALIZED
        to: REVOKED
        trigger: "POST /dna/reports/{id}/revoke"
        actor: Account
        preconditions:
          - "report.status == FINALIZED"
        side_effects:
          - "cascade: revoke all ACTIVE ShareLink for this report (ShareLink ACTIVE -> REVOKED)"
          - "if Pet.finalized_report_id == report.id, recompute it to the next-latest FINALIZED report or null"
          - "increments Report.version by 1"

  - entity: RelativeMatch
    initial_state: ESTIMATED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ESTIMATED
        to: CONFIRMED
        trigger: "POST /dna/relative-matches/{id}/confirm"
        actor: LabTechnician
        preconditions:
          - "match.status == ESTIMATED"
          - "both Pet.finalized_report_id are non-null (both pets have a FINALIZED report)"
        side_effects:
          - "recompute relationship_pct using the CONFIRMED (phased) variant"
          - "increments RelativeMatch.version by 1"
      - from: ESTIMATED
        to: WITHDRAWN
        trigger: "POST /dna/relative-matches/{id}/withdraw"
        actor: Account
        preconditions:
          - "match.status == ESTIMATED"
          - "acting account owns either pet_id or relative_pet_id"
        side_effects:
          - "increments RelativeMatch.version by 1"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /dna/relative-matches/{id}/withdraw"
        actor: Account
        preconditions:
          - "match.status == CONFIRMED"
          - "acting account owns either pet_id or relative_pet_id"
        side_effects:
          - "increments RelativeMatch.version by 1"
      - from: ESTIMATED
        to: WITHDRAWN
        trigger: "system: a referenced Pet relative_finder_opt_in set false via PATCH"
        actor: system
        preconditions:
          - "match.status == ESTIMATED"
        side_effects:
          - "increments RelativeMatch.version by 1"
        note: "Cascade from opt-out: matches referencing an opted-out pet auto-withdraw."

  - entity: ShareLink
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /dna/share-links/{id}/revoke"
        actor: Account
        preconditions:
          - "share_link.status == ACTIVE"
          - "acting account owns the report's pet"
        side_effects:
          - "increments ShareLink.version by 1"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /dna/subscriptions/{id}/upgrade"
        actor: Account
        preconditions:
          - "subscription.status == ACTIVE"
          - "subscription.tier == BASIC and requested tier == PREMIUM"
        side_effects:
          - "create successor Subscription tier=PREMIUM status=ACTIVE with prorated last_charge_cents"
          - "set Account.active_subscription_id = successor.id"
          - "increments Subscription.version by 1"
        note: "Upgrade supersedes the BASIC term; successor charge is prorated (see calculations)."
      - from: ACTIVE
        to: GRACE
        trigger: "POST /dna/subscriptions/{id}/cancel"
        actor: Account
        preconditions:
          - "subscription.status == ACTIVE"
        side_effects:
          - "increments Subscription.version by 1"
        note: "Cancel enters GRACE until term end; access retained until then."
      - from: GRACE
        to: CANCELLED
        trigger: "system: clock advances past started_on + term_days while in GRACE (POST /dna/subscriptions/{id}/expire)"
        actor: PlatformAdmin
        preconditions:
          - "subscription.status == GRACE"
          - "current clock >= started_on + term_days"
        side_effects:
          - "set Account.active_subscription_id = null"
          - "increments Subscription.version by 1"

  - entity: DataRequest
    initial_state: PENDING
    terminal_states: [PURGED, CANCELLED]
    transitions:
      - from: PENDING
        to: READY
        trigger: "system: DOWNLOAD export assembled (POST /dna/data-requests with kind=DOWNLOAD)"
        actor: Account
        preconditions:
          - "data_request.kind == DOWNLOAD"
        side_effects:
          - "assemble export_payload from account's pets, reports, matches"
        note: "DOWNLOAD branch: PENDING auto-advances to READY on creation."
      - from: PENDING
        to: GRACE
        trigger: "system: DELETE request opened (POST /dna/data-requests with kind=DELETE)"
        actor: Account
        preconditions:
          - "data_request.kind == DELETE"
          - "no other DataRequest for this account in {GRACE, PURGING}"
        side_effects:
          - "set grace_until = current clock + 30 days"
          - "set Account.purge_pending = true"
        note: "DELETE branch: opens a 30-day cool-off."
      - from: GRACE
        to: PURGING
        trigger: "POST /dna/data-requests/{id}/purge"
        actor: PlatformAdmin
        preconditions:
          - "data_request.status == GRACE"
          - "current clock >= grace_until"
        side_effects:
          - "increments DataRequest.version by 1"
      - from: PURGING
        to: PURGED
        trigger: "POST /dna/data-requests/{id}/purge-finalize"
        actor: PlatformAdmin
        preconditions:
          - "data_request.status == PURGING"
        side_effects:
          - "cascade: ARCHIVE all account Pets (Pet -> ARCHIVED); cascade: revoke all ACTIVE ShareLink of those pets' reports; cascade: WITHDRAW all ESTIMATED/CONFIRMED RelativeMatch referencing those pets"
          - "set Account.purge_pending = false"
          - "increments DataRequest.version by 1"
      - from: GRACE
        to: CANCELLED
        trigger: "POST /dna/data-requests/{id}/cancel"
        actor: Account
        preconditions:
          - "data_request.status == GRACE"
        side_effects:
          - "set Account.purge_pending = false"
          - "increments DataRequest.version by 1"
        note: "Account may rescind a deletion during the cool-off."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: upgrade-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /dna/subscriptions/{id}/upgrade"
    occ_field: "expected_subscription_version"
    description: |
      Upgrading a Subscription whose version has advanced since the client last
      observed it is rejected. This captures the case where the subscription was
      already cancelled (ACTIVE -> GRACE) or already upgraded (ACTIVE ->
      SUPERSEDED) after the client's last read, so the client's intent to upgrade
      a still-ACTIVE BASIC term is based on a stale view of the subscription.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: finalize-stale-report
    parent_entity: Report
    write_endpoint: "POST /dna/reports/{id}/finalize"
    occ_field: "expected_report_version"
    description: |
      Finalizing a Report whose version has advanced since the client last
      observed it is rejected. A reviewed-marker addition or a revoke transition
      can bump the report's version between read and finalize, so a finalize
      carrying an out-of-date version is acting on a stale report view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: genotyping_qc_score
    trigger: "POST /dna/samples/{id}/genotyping-runs (run created)"
    algorithm: weighted_scoring
    formula: |
      het_consistency = clamp(1 - abs(het_rate - HET_TARGET) / HET_TARGET, 0, 1)
      raw = 100 * ( W_CALL * call_rate
                  + W_CONTAM * (1 - contamination)
                  + W_HET * het_consistency )
      qc_score = round_half_up(raw, 2)
      # Outcome gate (evaluation order is fixed):
      #   1. if call_rate < CALL_GATE      -> outcome = FAILED   (hard call-rate gate, evaluated FIRST)
      #   2. elif qc_score < QC_QNS_FLOOR  -> outcome = QNS
      #   3. else                          -> outcome = PASS
    input_set: "Single GenotypingRun's three input metrics; no cross-entity aggregation."
    constants:
      W_CALL: 0.6
      W_CONTAM: 0.3
      W_HET: 0.1
      HET_TARGET: 0.35
      CALL_GATE: 0.85
      QC_QNS_FLOOR: 60.00
    precision: "qc_score to 2 decimal places, round_half_up"
    variants:
      - name: pass_outcome
        when: "call_rate >= 0.85 AND qc_score >= 60.00"
        difference: "Sample -> PASS; report created."
      - name: qns_outcome
        when: "call_rate >= 0.85 AND qc_score < 60.00"
        difference: "Sample -> QNS; eligible for re-test, no report."
      - name: failed_outcome
        when: "call_rate < 0.85"
        difference: "Sample -> FAILED regardless of qc_score (gate evaluated before QNS floor)."

  - name: breed_ancestry_composition
    trigger: "system: Report created on Sample PASS; recomputed on report finalize"
    algorithm: weighted_scoring
    formula: |
      breed_segments are the array supplied on the genotyping run (each { breed, match_cm });
      total_cm = sum(segment.match_cm for segment in breed_segments)
      for each segment (processed in the request's array order):
          pct = round_half_up(segment.match_cm / total_cm * 100, 2)
      remainder = round_half_up(100.00 - sum(pct), 2)
      assign the entire remainder to the single segment with the largest match_cm
        (tie-break on equal match_cm: earliest array index) so the array sums to EXACTLY 100.00
      breed_composition = [ { breed, pct } ... ] preserving request array order
    input_set: "The breed_segments array supplied on the sample's PASS genotyping run; empty array yields []."
    constants:
      TARGET_SUM: 100.00
    precision: "each pct to 2 dp round_half_up; remainder reallocated to largest raw_cm breed so total == 100.00"

  - name: subscription_upgrade_proration
    trigger: "POST /dna/subscriptions/{id}/upgrade"
    algorithm: tiered_pricing
    formula: |
      elapsed_days = floor( (current_clock_date - basic.started_on_date) in whole days )
      remaining_days = basic.term_days - elapsed_days          # may be 0..term_days
      unused_credit_cents = floor( basic.annual_fee_cents * remaining_days / basic.term_days )
      successor.last_charge_cents = premium_annual_fee_cents - unused_credit_cents
      # If unused_credit_cents > premium_annual_fee_cents the charge floors at 0 (cannot go negative).
    input_set: "The BASIC subscription being upgraded plus the PREMIUM annual fee from the request."
    constants:
      PREMIUM_ANNUAL_FEE_CENTS: 19900
      FLOOR_CENTS: 0
    precision: "integer cents; floor on the proration division"

  - name: relative_kinship_pct
    trigger: "POST /dna/relative-matches (create) and POST /dna/relative-matches/{id}/confirm"
    algorithm: weighted_scoring
    formula: |
      ESTIMATED variant: relationship_pct = round_half_up( shared_cm / TOTAL_AUTOSOMAL_CM * 100, 2 )
      CONFIRMED variant: relationship_pct = round_half_up( shared_cm * PHASE_FACTOR / TOTAL_AUTOSOMAL_CM * 100, 2 )
    input_set: "The two pets' shared_cm on the RelativeMatch row."
    constants:
      TOTAL_AUTOSOMAL_CM: 2500.0
      PHASE_FACTOR: 0.98
    precision: "2 decimal places, round_half_up"
    variants:
      - name: estimated
        when: "match created (status ESTIMATED), reports not both finalized"
        difference: "uses raw shared_cm; provisional kinship at match creation"
      - name: confirmed
        when: "match confirmed after both pets have a FINALIZED report"
        difference: "applies PHASE_FACTOR=0.98 phasing correction, yielding a different (lower) percentage for identical shared_cm"

  - name: report_health_risk_rollup
    trigger: "system: Report created (preliminary count); recomputed on POST /dna/reports/{id}/finalize"
    algorithm: aggregation
    formula: |
      PRELIMINARY variant: at_risk_marker_count =
        count(HealthMarkerResult where report_id == report.id
              AND genotype == 'AT_RISK' AND review_status == 'PASS')
      FINALIZED variant: at_risk_marker_count =
        count(HealthMarkerResult where report_id == report.id
              AND genotype == 'AT_RISK' AND review_status IN {PASS, REVIEWED})
    input_set: "HealthMarkerResult rows for the report; status filter differs by report state."
    constants: {}
    precision: "integer count"
    variants:
      - name: preliminary_count
        when: "report.status == PRELIMINARY"
        difference: "excludes REVIEWED markers; counts only AT_RISK with review_status PASS"
      - name: finalized_count
        when: "report.status == FINALIZED"
        difference: "includes REVIEWED markers; same data can yield a higher count than preliminary"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET /dna/shared-reports/{token} (public token view)"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all that reference resources"

  - priority: 4
    category: business_referential
    check: "Acting entity-backed user owns the targeted resource (Account owns Pet/Kit/Report/Subscription/DataRequest; either pet's owner may act on a RelativeMatch)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Account-owned mutations"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions"

  - priority: 6
    category: business_referential
    check: "Cross-entity precondition: relative-match confirm requires BOTH pets to have a FINALIZED report"
    error_id: ERR_REPORTS_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /dna/relative-matches/{id}/confirm"

  - priority: 7
    category: business_safety
    check: "A pet may not be activated/queried into relative-finder unless both account-level and pet-level relative_finder_opt_in are true"
    error_id: ERR_RELATIVE_FINDER_NOT_OPTED_IN
    http_status: 422
    applies_to: "POST /dna/relative-matches"

  - priority: 8
    category: business_safety
    check: "No mutation permitted on an account or its pets while a DELETE DataRequest is in {GRACE, PURGING} (account.purge_pending == true), except cancelling that DataRequest"
    error_id: ERR_PURGE_IN_PROGRESS
    http_status: 409
    applies_to: "POST /dna/kits/{id}/activate, POST /dna/relative-matches, POST /dna/subscriptions, POST /dna/share-links"

  - priority: 9
    category: business_constraint
    check: "Re-test (sample with retest_of_sample_id) may only reference a sample in {QNS, FAILED}; a PASS/RECEIVED sample cannot be re-tested"
    error_id: ERR_RETEST_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /dna/samples (when retest_of_sample_id present)"

  - priority: 10
    category: business_constraint
    check: "A genotyping run may only be created on a sample in {RECEIVED, GENOTYPING}; the same kit may not hold two non-terminal samples"
    error_id: ERR_SAMPLE_NOT_GENOTYPABLE
    http_status: 422
    applies_to: "POST /dna/samples/{id}/genotyping-runs"

  - priority: 11
    category: business_constraint
    check: "Only one ACTIVE/GRACE Subscription per account; a second create is rejected"
    error_id: ERR_SUBSCRIPTION_EXISTS
    http_status: 409
    applies_to: "POST /dna/subscriptions"

  - priority: 12
    category: business_temporal
    check: "Purge may only run when current clock >= grace_until; expire only when clock >= started_on + term_days"
    error_id: ERR_GRACE_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /dna/data-requests/{id}/purge, POST /dna/subscriptions/{id}/expire"

  - priority: 13
    category: business_constraint
    check: "Numeric inputs within declared ranges (call_rate/het_rate/contamination in [0,1]; shared_cm in [0,2500])"
    error_id: ERR_INVALID_RANGE
    http_status: 422
    applies_to: "POST /dna/samples/{id}/genotyping-runs, POST /dna/relative-matches"

  - priority: 14
    category: business_constraint
    check: "Health report sections require kit product_tier == BREED_HEALTH; adding HealthMarkerResult to a BREED-only report is rejected"
    error_id: ERR_HEALTH_NOT_INCLUDED
    http_status: 422
    applies_to: "POST /dna/reports/{id}/markers"

  - priority: 15
    category: business_constraint
    check: "Required body fields present and enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all creates"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the live parent version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dna/subscriptions/{id}/upgrade, POST /dna/reports/{id}/finalize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/dna/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances logical clock used by all temporal rules"]

  # ---- Accounts ----
  - method: POST
    path: "/dna/accounts"
    description: "Register an account."
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, "data_residency?", "relative_finder_opt_in?"]
    output: Account
    side_effects: []
  - method: GET
    path: "/dna/accounts/{id}"
    description: "Fetch an account (includes computed fields)."
    roles: [PlatformAdmin, Account]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: PATCH
    path: "/dna/accounts/{id}"
    description: "Update account-level relative_finder_opt_in master switch."
    roles: [Account]
    code: 200
    input: [relative_finder_opt_in]
    output: Account
    side_effects: ["cascade: setting opt-in false auto-withdraws ESTIMATED matches of this account's pets"]

  # ---- Pets ----
  - method: POST
    path: "/dna/pets"
    description: "Register a pet under an account."
    roles: [Account]
    code: 201
    input: [account_id, name, species, birth_year, "relative_finder_opt_in?"]
    output: Pet
    side_effects: ["increments Account.pet_count"]
  - method: GET
    path: "/dna/pets/{id}"
    description: "Fetch a pet."
    roles: [PlatformAdmin, Account]
    code: 200
    input: []
    output: Pet
    side_effects: []
  - method: GET
    path: "/dna/pets"
    description: "List pets, optionally filtered by account_id."
    roles: [PlatformAdmin, Account]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Pet[]
    side_effects: []
  - method: PATCH
    path: "/dna/pets/{id}"
    description: "Update per-pet relative_finder_opt_in; setting false cascades match withdrawal."
    roles: [Account]
    code: 200
    input: [relative_finder_opt_in]
    output: Pet
    side_effects: ["cascade: setting false withdraws ESTIMATED RelativeMatch referencing this pet"]

  # ---- Kits ----
  - method: POST
    path: "/dna/kits"
    description: "Order a kit for an account; server mints barcode."
    roles: [Account]
    code: 201
    input: [account_id, product_tier]
    output: Kit
    side_effects: []
  - method: GET
    path: "/dna/kits/{id}"
    description: "Fetch a kit."
    roles: [PlatformAdmin, Account, LabTechnician]
    code: 200
    input: []
    output: Kit
    side_effects: []
  - method: GET
    path: "/dna/kits"
    description: "List kits, optionally filtered by account_id or activated_pet_id."
    roles: [PlatformAdmin, Account]
    code: 200
    input: ["account_id?", "activated_pet_id?", "limit?", "offset?"]
    output: Kit[]
    side_effects: []
  - method: POST
    path: "/dna/kits/{id}/activate"
    description: "Activate the kit's swab against a pet (ORDERED -> ACTIVATED)."
    roles: [Account]
    code: 200
    input: [pet_id]
    output: Kit
    side_effects: ["set kit.activated_pet_id", "increments Kit.version by 1"]
  - method: POST
    path: "/dna/kits/{id}/void"
    description: "Void an un-activated kit (ORDERED -> VOIDED)."
    roles: [Account]
    code: 200
    input: []
    output: Kit
    side_effects: ["increments Kit.version by 1"]

  # ---- Samples ----
  - method: POST
    path: "/dna/samples"
    description: "Receive a physical sample against an ACTIVATED kit (kit -> RECEIVED), OR create a re-test successor when retest_of_sample_id is supplied."
    roles: [LabTechnician]
    code: 201
    input: [kit_id, "retest_of_sample_id?"]
    output: Sample
    side_effects: ["transition Kit ACTIVATED -> RECEIVED (first sample)", "on re-test: prior sample QNS/FAILED -> RETESTED, successor created"]
  - method: GET
    path: "/dna/samples/{id}"
    description: "Fetch a sample."
    roles: [PlatformAdmin, Account, LabTechnician]
    code: 200
    input: []
    output: Sample
    side_effects: []
  - method: GET
    path: "/dna/samples"
    description: "List samples, optionally filtered by kit_id, pet_id, or retest_of_sample_id."
    roles: [PlatformAdmin, LabTechnician]
    code: 200
    input: ["kit_id?", "pet_id?", "retest_of_sample_id?", "limit?", "offset?"]
    output: Sample[]
    side_effects: []
  - method: POST
    path: "/dna/samples/{id}/genotyping-runs"
    description: "Create a genotyping run; computes qc_score and outcome, then drives the sample fork (PASS/QNS/FAILED) and its cascades."
    roles: [LabTechnician]
    code: 201
    input: [call_rate, het_rate, contamination, "breed_segments?"]
    output: GenotypingRun
    side_effects: ["compute qc_score+outcome", "sample RECEIVED->GENOTYPING then ->PASS/QNS/FAILED", "PASS: kit->CONSUMED + Report created"]
  - method: GET
    path: "/dna/samples/{id}/genotyping-runs"
    description: "List genotyping runs for a sample."
    roles: [PlatformAdmin, LabTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: GenotypingRun[]
    side_effects: []

  # ---- Reports ----
  - method: GET
    path: "/dna/reports/{id}"
    description: "Fetch a report (breed_composition, at_risk_marker_count)."
    roles: [PlatformAdmin, Account, LabTechnician]
    code: 200
    input: []
    output: Report
    side_effects: []
  - method: GET
    path: "/dna/reports"
    description: "List reports, optionally filtered by sample_id or pet_id (resolves a pet's finalized_report_id back-pointer)."
    roles: [PlatformAdmin, Account, LabTechnician]
    code: 200
    input: ["sample_id?", "pet_id?", "limit?", "offset?"]
    output: Report[]
    side_effects: []
  - method: POST
    path: "/dna/reports/{id}/markers"
    description: "Attach a genetic-health/trait marker result to a report (requires BREED_HEALTH kit)."
    roles: [LabTechnician]
    code: 201
    input: [marker_code, genotype, "review_status?"]
    output: HealthMarkerResult
    side_effects: ["recompute report.at_risk_marker_count (preliminary variant)", "increments Report.version by 1"]
  - method: GET
    path: "/dna/reports/{id}/markers"
    description: "List marker results attached to a report."
    roles: [PlatformAdmin, Account, LabTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: HealthMarkerResult[]
    side_effects: []
  - method: POST
    path: "/dna/reports/{id}/finalize"
    description: "Finalize a report (PRELIMINARY -> FINALIZED); OCC-guarded."
    roles: [LabTechnician]
    code: 200
    input: [expected_report_version]
    output: Report
    side_effects: ["recompute at_risk_marker_count (finalized variant)", "set Pet.finalized_report_id", "increments Report.version by 1"]
  - method: POST
    path: "/dna/reports/{id}/revoke"
    description: "Revoke a report (-> REVOKED); cascades share-link revocation and finalized_report_id recompute."
    roles: [Account]
    code: 200
    input: []
    output: Report
    side_effects: ["cascade revoke ACTIVE ShareLink", "recompute Pet.finalized_report_id if needed", "increments Report.version by 1"]

  # ---- Share links ----
  - method: POST
    path: "/dna/share-links"
    description: "Issue a vet-shareable link for a report; server mints token."
    roles: [Account]
    code: 201
    input: [report_id, vet_email]
    output: ShareLink
    side_effects: []
  - method: GET
    path: "/dna/share-links/{id}"
    description: "Fetch a share link by its id (owner/admin view; distinct from the token view)."
    roles: [PlatformAdmin, Account]
    code: 200
    input: []
    output: ShareLink
    side_effects: []
  - method: GET
    path: "/dna/share-links"
    description: "List share links, optionally filtered by report_id."
    roles: [PlatformAdmin, Account]
    code: 200
    input: ["report_id?", "limit?", "offset?"]
    output: ShareLink[]
    side_effects: []
  - method: GET
    path: "/dna/shared-reports/{token}"
    description: "Vet fetches the shared report via opaque token (no auth headers required); distinct path from the id-keyed share-link view to avoid template collision."
    roles: [Veterinarian, Anonymous]
    code: 200
    input: []
    output: Report
    side_effects: []
  - method: POST
    path: "/dna/share-links/{id}/revoke"
    description: "Revoke an ACTIVE share link (-> REVOKED)."
    roles: [Account]
    code: 200
    input: []
    output: ShareLink
    side_effects: ["increments ShareLink.version by 1"]

  # ---- Relative matches ----
  - method: POST
    path: "/dna/relative-matches"
    description: "Create a relative-finder match between two opted-in pets; computes ESTIMATED relationship_pct."
    roles: [LabTechnician]
    code: 201
    input: [pet_id, relative_pet_id, shared_cm]
    output: RelativeMatch
    side_effects: ["compute relationship_pct (estimated variant)"]
  - method: GET
    path: "/dna/relative-matches/{id}"
    description: "Fetch a relative match."
    roles: [PlatformAdmin, Account, LabTechnician]
    code: 200
    input: []
    output: RelativeMatch
    side_effects: []
  - method: GET
    path: "/dna/relative-matches"
    description: "List relative matches, optionally filtered by pet_id or relative_pet_id."
    roles: [PlatformAdmin, Account, LabTechnician]
    code: 200
    input: ["pet_id?", "relative_pet_id?", "limit?", "offset?"]
    output: RelativeMatch[]
    side_effects: []
  - method: POST
    path: "/dna/relative-matches/{id}/confirm"
    description: "Confirm an ESTIMATED match (-> CONFIRMED); recomputes relationship_pct via phased variant."
    roles: [LabTechnician]
    code: 200
    input: []
    output: RelativeMatch
    side_effects: ["recompute relationship_pct (confirmed variant)", "increments RelativeMatch.version by 1"]
  - method: POST
    path: "/dna/relative-matches/{id}/withdraw"
    description: "Withdraw a match (-> WITHDRAWN)."
    roles: [Account]
    code: 200
    input: []
    output: RelativeMatch
    side_effects: ["increments RelativeMatch.version by 1"]

  # ---- Subscriptions ----
  - method: POST
    path: "/dna/subscriptions"
    description: "Create a subscription for an account."
    roles: [Account]
    code: 201
    input: [account_id, tier, annual_fee_cents]
    output: Subscription
    side_effects: ["set Account.active_subscription_id", "set last_charge_cents = annual_fee_cents"]
  - method: GET
    path: "/dna/subscriptions/{id}"
    description: "Fetch a subscription."
    roles: [PlatformAdmin, Account]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/dna/subscriptions"
    description: "List subscriptions, optionally filtered by account_id (resolves an account's active_subscription_id back-pointer)."
    roles: [PlatformAdmin, Account]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/dna/subscriptions/{id}/upgrade"
    description: "Upgrade BASIC -> PREMIUM (ACTIVE -> SUPERSEDED, successor created); OCC-guarded, prorated charge."
    roles: [Account]
    code: 200
    input: [expected_subscription_version]
    output: Subscription
    side_effects: ["create PREMIUM successor with prorated last_charge_cents", "set Account.active_subscription_id = successor.id", "increments Subscription.version by 1"]
  - method: POST
    path: "/dna/subscriptions/{id}/cancel"
    description: "Cancel a subscription (ACTIVE -> GRACE)."
    roles: [Account]
    code: 200
    input: []
    output: Subscription
    side_effects: ["increments Subscription.version by 1"]
  - method: POST
    path: "/dna/subscriptions/{id}/expire"
    description: "Expire a GRACE subscription once the term has elapsed (GRACE -> CANCELLED)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["set Account.active_subscription_id = null", "increments Subscription.version by 1"]

  # ---- Data requests ----
  - method: POST
    path: "/dna/data-requests"
    description: "Open a data export (DOWNLOAD -> READY with export_payload) or deletion (DELETE -> GRACE with 30-day cool-off)."
    roles: [Account]
    code: 201
    input: [account_id, kind]
    output: DataRequest
    side_effects: ["DOWNLOAD: assemble export_payload", "DELETE: set grace_until, set Account.purge_pending=true"]
  - method: GET
    path: "/dna/data-requests/{id}"
    description: "Fetch a data request (export_payload for DOWNLOAD)."
    roles: [PlatformAdmin, Account]
    code: 200
    input: []
    output: DataRequest
    side_effects: []
  - method: GET
    path: "/dna/data-requests"
    description: "List data requests, optionally filtered by account_id."
    roles: [PlatformAdmin, Account]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: DataRequest[]
    side_effects: []
  - method: POST
    path: "/dna/data-requests/{id}/purge"
    description: "Advance a DELETE request GRACE -> PURGING once grace_until has elapsed."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DataRequest
    side_effects: ["increments DataRequest.version by 1"]
  - method: POST
    path: "/dna/data-requests/{id}/purge-finalize"
    description: "Execute purge PURGING -> PURGED; cascades pet archival, share-link revocation, match withdrawal."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DataRequest
    side_effects: ["cascade ARCHIVE pets, revoke share-links, withdraw matches", "set Account.purge_pending=false", "increments DataRequest.version by 1"]
  - method: POST
    path: "/dna/data-requests/{id}/cancel"
    description: "Rescind a deletion during cool-off (GRACE -> CANCELLED)."
    roles: [Account]
    code: 200
    input: []
    output: DataRequest
    side_effects: ["set Account.purge_pending=false", "increments DataRequest.version by 1"]

  # ---- Marker catalog ----
  - method: POST
    path: "/dna/marker-catalog"
    description: "Register a genetic-health/trait marker in the catalog."
    roles: [PlatformAdmin]
    code: 201
    input: [marker_code, category, species]
    output: MarkerCatalogEntry
    side_effects: []
  - method: GET
    path: "/dna/marker-catalog"
    description: "List marker catalog entries."
    roles: [PlatformAdmin, LabTechnician]
    code: 200
    input: ["species?", "category?", "limit?", "offset?"]
    output: MarkerCatalogEntry[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID on an authenticated endpoint."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Entity-backed actor does not own the targeted resource."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state."
  - id: ERR_REPORTS_NOT_FINALIZED
    http: 409
    condition: "Relative-match confirm attempted before both pets have a FINALIZED report."
  - id: ERR_RELATIVE_FINDER_NOT_OPTED_IN
    http: 422
    condition: "A pet in the match lacks account-level or pet-level relative_finder_opt_in."
  - id: ERR_PURGE_IN_PROGRESS
    http: 409
    condition: "Mutation attempted on an account/pet while a DELETE DataRequest is GRACE/PURGING."
  - id: ERR_RETEST_NOT_ELIGIBLE
    http: 422
    condition: "retest_of_sample_id references a sample not in {QNS, FAILED}."
  - id: ERR_SAMPLE_NOT_GENOTYPABLE
    http: 422
    condition: "Genotyping run requested on a sample not in {RECEIVED, GENOTYPING}."
  - id: ERR_SUBSCRIPTION_EXISTS
    http: 409
    condition: "Second ACTIVE/GRACE subscription create for an account."
  - id: ERR_GRACE_NOT_ELAPSED
    http: 409
    condition: "Purge/expire requested before the temporal window has elapsed."
  - id: ERR_INVALID_RANGE
    http: 422
    condition: "Numeric input outside its declared range."
  - id: ERR_HEALTH_NOT_INCLUDED
    http: 422
    condition: "Marker attached to a report whose kit product_tier != BREED_HEALTH."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field or invalid enum value."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match live parent version."
  - id: ERR_INVALID_TOKEN
    http: 404
    condition: "Share-link token not found or its link is REVOKED."
  - id: ERR_UPGRADE_NOT_ALLOWED
    http: 422
    condition: "Upgrade requested on a non-BASIC subscription or to a non-PREMIUM tier."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator: account registration, clock, marker catalog, purge/expire batch operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /dna/accounts"
      - "POST /dna/_clock/set_current_utc"
      - "POST /dna/marker-catalog"
      - "POST /dna/data-requests/{id}/purge"
      - "POST /dna/data-requests/{id}/purge-finalize"
      - "POST /dna/subscriptions/{id}/expire"
    shared_operations:
      - "GET reads across accounts, pets, kits, samples, reports, subscriptions, data-requests, matches, share-links"

  - name: Account
    description: "Pet owner: registers pets, orders/activates kits, manages reports/subscriptions/share-links/data-requests."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /dna/pets"
      - "POST /dna/kits"
      - "POST /dna/kits/{id}/activate"
      - "POST /dna/kits/{id}/void"
      - "POST /dna/reports/{id}/revoke"
      - "POST /dna/share-links"
      - "POST /dna/share-links/{id}/revoke"
      - "POST /dna/subscriptions"
      - "POST /dna/subscriptions/{id}/upgrade"
      - "POST /dna/subscriptions/{id}/cancel"
      - "POST /dna/data-requests"
      - "POST /dna/data-requests/{id}/cancel"
      - "POST /dna/relative-matches/{id}/withdraw"
      - "PATCH /dna/accounts/{id}"
      - "PATCH /dna/pets/{id}"
    shared_operations:
      - "GET reads scoped to own account's resources"

  - name: LabTechnician
    description: "Lab operator: receives samples, runs genotyping pipeline, attaches markers, finalizes reports, creates/confirms matches."
    identity: "opaque"
    exclusive_operations:
      - "POST /dna/samples"
      - "POST /dna/samples/{id}/genotyping-runs"
      - "POST /dna/reports/{id}/markers"
      - "POST /dna/reports/{id}/finalize"
      - "POST /dna/relative-matches"
      - "POST /dna/relative-matches/{id}/confirm"
    shared_operations:
      - "GET reads on kits, samples, reports, markers, matches, marker-catalog"

  - name: Veterinarian
    description: "Read-only consumer of a shared report via opaque token."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /dna/share-links/{token}"

  - name: Anonymous
    description: "Unauthenticated token holder fetching a shared report; no headers required."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /dna/share-links/{token}"
