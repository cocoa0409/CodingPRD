  # --------------------- Cross-cutting: OCC / concurrency ---------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_surveillance_plan_supersede_success
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[surveillance-plan-create-stale-case]
          - state_machines.SurveillancePlan.ACTIVE_to_SUPERSEDED
          - calculations.surveillance_interval
        distinguishing_aspect: "With current expected_counseling_case_version, POST /surveillance-plans succeeds (201); the case (disclosed VUS, MODERATE) gets an ACTIVE plan with screening_interval_months 12."
        test_recipe:
          setup: ["Proband disclosed VUS with prior 0.15 (MODERATE); case in DISCLOSED (no auto plan since VUS not actionable)"]
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Kindred Y", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC AO", npi: "2000000024" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /labs", payload: { lab_name: "LabY", max_concurrent_capacity: 5, turnaround_days: 14 }, as: ProgramAdmin, captures: { lid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob Y", patient_dob: "1980-01-01", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 2 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /pedigree-members", payload: { counseling_case_id: "${case_id}", relationship: "SIBLING", degree: 1, affected: true, age_of_onset: 45 }, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /counseling-cases/${case_id}/assess-risk", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /consent-records", payload: { counseling_case_id: "${case_id}", consent_type: "TESTING" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { consent_id: $.data.id } }
            - { call: "POST /consent-records/${consent_id}/sign", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-orders", payload: { counseling_case_id: "${case_id}", lab_id: "${lid}", panel_name: "BRCA", list_price_cents: 300000, processing_start: "2026-05-02T09:00:00Z", processing_end: "2026-05-16T09:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { order_id: $.data.id } }
            - { call: "POST /test-orders/${order_id}/submit", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "POST /test-results", payload: { test_order_id: "${order_id}", gene: "BRCA1", variant: "c.100A>G", classification: "VUS" }, as: LabTechnician, as_user_id: "${lid}", captures: { result_id: $.data.id } }
            - { call: "POST /test-results/${result_id}/release", payload: {}, as: LabTechnician, as_user_id: "${lid}" }
            - { call: "POST /test-results/${result_id}/disclose", payload: {}, as: GeneticCounselor, as_user_id: "${cid}" }
            - { call: "GET /counseling-cases/${case_id}", payload: {}, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /surveillance-plans", payload: { counseling_case_id: "${case_id}", modalities: [ "BREAST_MRI" ], expected_counseling_case_version: "${case_v}" }, as: GeneticCounselor, as_user_id: "${cid}", captures: { plan_id: $.data.id } }
          assert:
            - "response HTTP status == 201"
            - "SurveillancePlan.${plan_id}.status == ACTIVE"
            - "SurveillancePlan.${plan_id}.risk_tier == MODERATE"
            - "SurveillancePlan.${plan_id}.screening_interval_months == 12"
            - "CounselingCase.${case_id}.residual_risk_pct == 0.15"

      - name: occ_surveillance_plan_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[surveillance-plan-create-stale-case]
          - entities.CounselingCase.fields.version
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first plan create bumps the case version, a second POST /surveillance-plans still carrying the pre-bump expected_counseling_case_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Proband disclosed VUS in DISCLOSED; case version captured before first plan create"]
